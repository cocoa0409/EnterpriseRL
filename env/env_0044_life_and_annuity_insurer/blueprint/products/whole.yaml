# Whole Life Insurance — product and event policy charter of Ashgrove Mutual Life Insurance Company.
category: whole
display_name: Whole Life Insurance

binding:
  holding_table: whole_holdings
  event_tables: [whole_transactions]
  intake_tables: [whole_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_outstanding: premium_outstanding
    loan_balance: policy_loan
    dividend_accumulation_balance: dividend_accumulation
    pua_face_amount: pua_face
    tiadb_lien_balance: tiadb_lien

lifecycle:
  states: [applied, in_force, grace_period, paid_up, reduced_paid_up, extended_term, lapsed, expired, surrendered, death_claim_pending, claim_paid, claim_denied, matured, cancelled_free_look, declined]
  transitions:
    - {from: applied, to: in_force, by: system, means: "New business places a premium-paying policy in force once it is delivered and the first premium is received."}
    - {from: applied, to: paid_up, by: system, means: "New business places an Ashgrove Single Premium Whole Life policy in force on receipt of the single premium; no further premium is ever due."}
    - {from: applied, to: declined, by: system, means: "Underwriting declines the application or it is withdrawn before placement."}
    - {from: in_force, to: grace_period, by: system, means: "An installment is unpaid on its due date and the grace period begins."}
    - {from: grace_period, to: in_force, by: agent, means: "The overdue premium is paid in time, by the owner or by an automatic premium loan."}
    - {from: grace_period, to: extended_term, by: system, means: "The grace period ends unpaid and the net cash value buys extended term insurance."}
    - {from: grace_period, to: reduced_paid_up, by: system, means: "The grace period ends unpaid and the net cash value buys reduced paid-up insurance, by default or by the owner's election."}
    - {from: grace_period, to: lapsed, by: system, means: "The grace period ends unpaid with no net cash value to apply, and coverage ends."}
    - {from: in_force, to: reduced_paid_up, by: user, means: "The owner elects to stop premiums and take reduced paid-up insurance."}
    - {from: extended_term, to: expired, by: system, means: "The extended term period runs out and coverage ends."}
    - {from: lapsed, to: in_force, by: agent, means: "A lapsed policy is reinstated."}
    - {from: extended_term, to: in_force, by: agent, means: "A policy on extended term is reinstated to premium-paying status."}
    - {from: reduced_paid_up, to: in_force, by: agent, means: "A policy on reduced paid-up is reinstated to its original face and premium."}
    - {from: in_force, to: paid_up, by: system, means: "The premium-paying period is completed and no further premium is due."}
    - {from: in_force, to: lapsed, by: system, means: "Loan indebtedness reaches the cash value and the loan default notice period ends without payment."}
    - {from: paid_up, to: lapsed, by: system, means: "Loan indebtedness reaches the cash value of a paid-up policy and the loan default notice period ends without payment."}
    - {from: reduced_paid_up, to: lapsed, by: system, means: "Loan indebtedness reaches the cash value of a reduced paid-up policy and the loan default notice period ends without payment."}
    - {from: in_force, to: surrendered, by: user, means: "The owner surrenders the policy for its net cash surrender value."}
    - {from: grace_period, to: surrendered, by: user, means: "The owner surrenders the policy during the grace period."}
    - {from: paid_up, to: surrendered, by: user, means: "The owner surrenders a paid-up policy."}
    - {from: reduced_paid_up, to: surrendered, by: user, means: "The owner surrenders a reduced paid-up policy."}
    - {from: extended_term, to: surrendered, by: user, means: "The owner surrenders a policy on extended term for its remaining cash value."}
    - {from: in_force, to: death_claim_pending, by: agent, means: "Notice of death is registered on a premium-paying policy."}
    - {from: grace_period, to: death_claim_pending, by: agent, means: "Notice of death is registered where death occurred during the grace period."}
    - {from: paid_up, to: death_claim_pending, by: agent, means: "Notice of death is registered on a paid-up policy."}
    - {from: reduced_paid_up, to: death_claim_pending, by: agent, means: "Notice of death is registered on a reduced paid-up policy."}
    - {from: extended_term, to: death_claim_pending, by: agent, means: "Notice of death is registered where death occurred within the extended term period."}
    - {from: death_claim_pending, to: claim_paid, by: agent, means: "The claim is approved and the proceeds are disbursed."}
    - {from: death_claim_pending, to: claim_denied, by: system, means: "The claims committee rescinds the contract or applies the suicide exclusion."}
    - {from: in_force, to: matured, by: system, means: "The insured reaches the maturity age and the policy endows."}
    - {from: paid_up, to: matured, by: system, means: "The insured reaches the maturity age on a paid-up policy and it endows."}
    - {from: in_force, to: cancelled_free_look, by: user, means: "The owner returns a premium-paying policy within the free-look period."}
    - {from: paid_up, to: cancelled_free_look, by: user, means: "The owner returns a single premium policy within the free-look period."}

accounts:
  - key: premium_outstanding
    unit: USD
    meaning: "Billed premium not yet paid or waived; negative when unapplied money is held for the owner."
  - key: policy_loan
    unit: USD
    meaning: "Principal of policy loans outstanding, including loan interest capitalized on anniversaries."
  - key: dividend_accumulation
    unit: USD
    meaning: "Dividends left on deposit with Ashgrove under the accumulate-at-interest option, plus the interest credited on them."
  - key: pua_face
    unit: USD of death benefit
    meaning: "Face amount of paid-up additions purchased with dividends and not yet surrendered."
  - key: tiadb_lien
    unit: USD
    meaning: "Outstanding lien from terminal illness acceleration advances, deducted from the death proceeds."

parameter_schema:
  premium_paying_basis: "enum to_attained_age|policy_years|single_premium — how the end of the premium-paying period is measured"
  premium_paying_period_value: "integer — the attained age, the number of policy years, or 1 for a single premium, at which premiums stop"
  maturity_age: "integer years — attained age at which the policy endows for its cash value"
  min_issue_age: "integer years, age last birthday — lowest issue age"
  max_issue_age: "integer years, age last birthday — highest issue age"
  min_face_amount: "USD — smallest base face amount issued"
  max_face_amount: "USD — largest base face amount issued on one policy"
  underwriting_basis: "enum full_medical|simplified_issue — the underwriting basis of the tier"
  graded_benefit_years: "integer policy years — period from the issue date during which a death from illness pays only the graded benefit; 0 means level benefit from issue"
  graded_benefit_return_pct: "decimal — multiple of premiums paid returned as the graded benefit; 0 when the tier has no graded period"
  participating: "boolean — whether the tier is eligible for annual dividends"
  annual_policy_fee: "USD per policy year — flat fee included in the annual premium"
  modal_factor_annual: "decimal — annual premium multiplier for annual mode"
  modal_factor_semiannual: "decimal — annual premium multiplier for each semiannual installment"
  modal_factor_quarterly: "decimal — annual premium multiplier for each quarterly installment"
  modal_factor_monthly_eft: "decimal — annual premium multiplier for each monthly EFT draft"
  grace_period_days: "integer calendar days — grace period counted from the unpaid installment's due date"
  grace_period_state_overrides: "mapping of issue-state code -> integer calendar days replacing grace_period_days"
  premium_shortage_tolerance: "USD — shortfall up to which a remittance is applied as full payment of the installment"
  overpayment_refund_threshold: "USD — unapplied money above this amount is refunded; at or below it is held toward the next installment"
  returned_eft_limit_12m: "integer — returned EFT drafts within a rolling 12 months that end the EFT privilege"
  eft_reenroll_wait_months: "integer calendar months — wait before monthly EFT may be elected again after the privilege ended"
  eft_draft_day_max: "integer — latest day of month that may be chosen as the EFT draft day"
  apl_available: "boolean — whether the automatic premium loan provision may be elected"
  default_nonforfeiture_option: "enum extended_term|reduced_paid_up — the option applied automatically when the grace period ends unpaid and the owner has not elected otherwise"
  nonforfeiture_election_days: "integer calendar days — period after the unpaid installment's due date within which the owner may elect a different nonforfeiture option or cash surrender"
  eti_available_for_rated: "boolean — whether extended term insurance is available when the underwriting class is table_rated or a tobacco class"
  rpu_min_face_amount: "USD — smallest reduced paid-up face; when the net cash value buys less, it is paid in cash instead"
  reinstatement_window_months: "integer calendar months — period from the lapse, extended term or reduced paid-up date within which reinstatement may be applied for"
  reinstatement_interest_rate: "decimal annual rate — simple interest charged on back premiums from each due date to the reinstatement date"
  reinstatement_evidence_ladder: "ladder of {from_day, to_day, evidence} — evidence required by calendar days from the lapse, extended term or reduced paid-up date to the application's signed date"
  loan_first_policy_year: "integer — first policy year in which a policy loan may be taken"
  loan_interest_rate: "decimal annual rate — fixed policy loan interest rate, simple, due in arrears on each policy anniversary"
  loan_value_pct: "decimal — share of the guaranteed cash value plus paid-up additions cash value that may be borrowed in total"
  min_loan_amount: "USD — smallest new policy loan"
  min_loan_repayment: "USD — smallest loan repayment accepted, unless it repays the loan in full"
  loan_default_notice_days: "integer calendar days — period after the loan default notice is mailed before the policy terminates for excess indebtedness"
  dividend_accumulation_rate: "decimal annual rate — interest credited on dividend accumulations on each policy anniversary"
  default_dividend_option: "enum paid_up_additions|accumulate|reduce_premium|cash|none — dividend option applied when the owner made no election (none for non-participating tiers)"
  pua_surrender_min: "USD of cash value — smallest partial surrender of paid-up additions"
  accumulation_withdrawal_min: "USD — smallest withdrawal from dividend accumulations, unless it withdraws the whole balance"
  federal_withholding_default_pct: "decimal — federal income tax withheld from the taxable portion of a distribution unless the owner elects no withholding"
  modified_endowment_at_issue: "boolean — whether the tier is a modified endowment contract from issue, making loans and withdrawals taxable distributions subject to withholding"
  surrender_deferral_max_days: "integer calendar days — longest Ashgrove may defer paying a cash surrender value under the deferral clause"
  waiver_rider_available: "boolean — whether the waiver of premium rider may be attached"
  waiver_rider_max_issue_age: "integer years — highest issue age for the waiver of premium rider"
  waiver_rider_expiry_age: "integer years — attained age at the anniversary on which the waiver rider ends"
  waiver_elimination_months: "integer calendar months — continuous total disability required before premiums are waived"
  tiadb_max_pct: "decimal — largest share of the face amount that may be accelerated for terminal illness"
  tiadb_max_amount: "USD — largest acceleration on one insured across all Ashgrove whole life policies"
  tiadb_life_expectancy_months: "integer months — certified life expectancy at or below which the insured qualifies"
  tiadb_admin_fee: "USD — processing fee deducted from an acceleration advance"
  tiadb_discount_rate: "decimal — actuarial discount applied to the elected acceleration amount"
  free_look_days: "integer calendar days — free-look period counted from the policy delivery date"
  free_look_days_replacement: "integer calendar days — free-look period when the sale replaced existing coverage"
  contestability_period_years: "integer years — contestable period from the issue date, or from the reinstatement date for reinstatement statements"
  suicide_exclusion_years: "integer years — period from the issue date in which death by suicide pays only the premiums paid"
  death_claim_interest_rate: "decimal annual rate — simple interest on death proceeds from the date of death to disbursement"
  beneficiary_access_account_min: "USD — smallest payee share that may be settled into an Ashgrove Beneficiary Access Account"
  beneficiary_max_primary: "integer — maximum number of primary beneficiaries"
  beneficiary_min_share_pct: "integer percent — smallest beneficiary share; shares are whole percents"
  minor_beneficiary_age: "integer years — age below which a share is paid only to a guardian or UTMA custodian"

