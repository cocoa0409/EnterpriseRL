events:
  # ---- contract changes on fixed_holdings ----
  - type: fixed_contract_issued
    target: fixed_holdings
    mutation: create
    meaning: "A deferred fixed annuity application is accepted and the contract is recorded as applied until the premium is received in good order."
    grain: "one row per contract"
    fields:
      customer_id: "the owner"
      contract_number: "the contract number"
      variant_name: "the official tier name"
      annuitant_name: "the annuitant"
      annuitant_date_of_birth: "the annuitant's date of birth"
      owner_is_annuitant: "whether the owner is the annuitant"
      issue_state: "state of issue"
      issue_date: "the contract date; contract years and anniversaries count from it"
      issue_age: "owner's age last birthday on the issue date"
      tax_qualification: "non-qualified or the IRA type"
      initial_premium: "the initial premium or exchange amount expected"
      guaranteed_rate: "the rate guaranteed for the first guarantee period, bonus and band included"
      guarantee_period_end_date: "the last day of the first guarantee period"
      sc_schedule_start_date: "the date the current surrender charge schedule started — the issue date at first"
      replacement_sale: "whether the contract replaced another annuity or life policy"
      waiver_riders_attached: "whether the nursing home and terminal illness waivers are included"
      exchange_source_company: "the other company's name for a 1035 exchange or IRA transfer, as on the transfer form; empty for new money"
    triggers:
      - event: fixed:fixed_premium_received
        map: {amount: initial_premium, transaction_date: issue_date}
      - event: fixed:fixed_beneficiary_designated
        map: {designation_effective_date: issue_date}
  - type: fixed_contract_activated
    target: fixed_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: "The initial premium is received in good order and the contract is issued and delivered."
    grain: "one row per transaction"
    fields:
      status: "becomes active"
      contract_delivery_date: "date the owner received the contract"
    triggers: []
  - type: fixed_application_declined
    target: fixed_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The application is declined or withdrawn before issue."
    grain: "one row per transaction"
    fields:
      status: "becomes declined"
      termination_date: "date of the decline"
    triggers:
      - event: fixed:fixed_premium_returned
        map: {return_reason: application_declined, transaction_date: termination_date}
  - type: fixed_contract_surrendered
    target: fixed_holdings
    mutation: {transition: {from: active, to: surrendered}}
    meaning: "The owner surrenders the contract."
    grain: "one row per transaction"
    fields:
      status: "becomes surrendered"
      termination_date: "the date the signed surrender request was received in good order"
    triggers:
      - event: fixed:fixed_surrender_paid
        map: {transaction_date: termination_date}
  - type: fixed_contract_annuitized
    target: fixed_holdings
    mutation: {transition: {from: active, to: annuitized}}
    meaning: "The contract value is applied to an Ashgrove income annuity on the owner's signed election or at the maturity date."
    grain: "one row per transaction"
    fields:
      status: "becomes annuitized"
      termination_date: "the annuitization date"
    triggers:
      - event: fixed:fixed_annuitization_transfer
        map: {transaction_date: termination_date}
  - type: fixed_death_claim_registered
    target: fixed_holdings
    mutation: {transition: {from: active, to: death_claim_pending}}
    meaning: "Notice of the owner's death is registered and the contract stops accepting transactions other than the claim."
    grain: "one row per transaction"
    fields:
      status: "becomes death_claim_pending"
    triggers: []
  - type: fixed_death_claim_paid
    target: fixed_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_paid}}
    meaning: "The death benefit is paid or applied for every beneficiary and the contract closes."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_paid"
      termination_date: "date the last beneficiary share was settled"
    triggers:
      - event: fixed:fixed_death_benefit_paid
        map: {transaction_date: termination_date}
  - type: fixed_spousal_continuation
    target: fixed_holdings
    mutation: {transition: {from: death_claim_pending, to: active}}
    meaning: "The surviving spouse, as sole primary beneficiary, continues the contract as its new owner."
    grain: "one row per transaction"
    fields:
      status: "becomes active"
      customer_id: "the surviving spouse's customer profile, now the owner"
      annuitant_name: "the spouse, when the deceased owner was the annuitant"
      annuitant_date_of_birth: "the spouse's date of birth, when the spouse becomes annuitant"
      owner_is_annuitant: "whether the new owner is the annuitant"
      spousal_continuation_date: "the date the continuation took effect"
    triggers: []
  - type: fixed_free_look_cancelled
    target: fixed_holdings
    mutation: {transition: {from: active, to: cancelled_free_look}}
    meaning: "The owner returns the contract within the free-look period."
    grain: "one row per transaction"
    fields:
      status: "becomes cancelled_free_look"
      termination_date: "date the returned contract was received"
    triggers:
      - event: fixed:fixed_premium_returned
        map: {return_reason: free_look, transaction_date: termination_date}
  - type: fixed_guarantee_period_renewed
    target: fixed_holdings
    mutation: update
    meaning: "A guarantee period ends and a new one starts at the rate then declared, by the owner's election or by default renewal."
    grain: "one row per transaction"
    fields:
      guaranteed_rate: "the rate for the new guarantee period"
      guarantee_period_end_date: "the last day of the new guarantee period"
      sc_schedule_start_date: "the start of the new surrender charge schedule, where the renewal restarts one"
      variant_name: "the tier of the new guarantee period, when the owner elected a different period length"
    triggers: []
  - type: fixed_systematic_withdrawal_changed
    target: fixed_holdings
    mutation: update
    meaning: "A systematic withdrawal plan is set up, changed or stopped."
    grain: "one row per transaction"
    fields:
      swp_amount: "installment amount; 0.00 when stopped"
      swp_frequency: "installment frequency; none when stopped"
      swp_next_date: "date of the next installment; empty when stopped"
    triggers: []
  - type: fixed_rmd_amount_posted
    target: fixed_holdings
    mutation: update
    meaning: "Ashgrove posts the required minimum distribution for the calendar year on an IRA contract whose owner has reached the required beginning age."
    grain: "one row per transaction"
    fields:
      rmd_year: "the calendar year"
      rmd_amount_current_year: "the required minimum distribution Ashgrove calculated for that year"
    triggers: []
  # ---- ledger rows on fixed_transactions ----
  - type: fixed_premium_received
    target: fixed_transactions
    meaning: "A premium or exchange amount is received and credited to the contract value."
    grain: "one row per premium receipt"
    distinguish_by: [transaction_date, premium_source, payment_method]
    fields:
      transaction_date: "date received in good order"
      amount: "premium credited"
      premium_source: "new money, 1035 exchange, IRA transfer or rollover"
      payment_method: "how the money arrived"
    account: contract_value
    direction: in
    triggers: []
  - type: fixed_interest_credited
    target: fixed_transactions
    meaning: "Interest is credited for a period — on a contract anniversary for the contract year, or on the date of a withdrawal, surrender, death benefit or annuitization for the part year."
    grain: "one row per interest crediting period"
    distinguish_by: [interest_period_end]
    fields:
      transaction_date: "date credited"
      amount: "interest credited"
      interest_period_start: "first day of the period"
      interest_period_end: "last day of the period"
      credited_rate: "the annual effective rate applied"
    account: contract_value
    direction: in
    triggers: []
  - type: fixed_withdrawal_paid
    target: fixed_transactions
    meaning: "A partial withdrawal, systematic installment or required minimum distribution is taken from the contract value."
    grain: "one row per withdrawal"
    distinguish_by: [transaction_date, withdrawal_type, fixed_request_id]
    fields:
      transaction_date: "date paid"
      amount: "gross amount removed from the contract value before any surrender charge"
      withdrawal_type: "classification of the withdrawal for surrender charge purposes"
      free_portion_amount: "part of the amount within the free withdrawal amount or otherwise free of charge"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      net_paid_amount: "amount paid to the owner after charge and withholding"
      fixed_request_id: "the signed request or systematic plan setup the withdrawal is made under"
      payout_method: "how it was paid"
    account: contract_value
    direction: out
    triggers:
      - event: fixed:fixed_surrender_charge_assessed
        when: {withdrawal_type: excess_partial}
        map: {charge_reason: partial_withdrawal, fixed_request_id: fixed_request_id, transaction_date: transaction_date}
  - type: fixed_surrender_charge_assessed
    target: fixed_transactions
    meaning: "A surrender charge is deducted from the contract value on the part of a withdrawal or surrender subject to charge."
    grain: "one row per charged withdrawal or surrender"
    distinguish_by: [charge_reason, fixed_request_id]
    fields:
      transaction_date: "date assessed"
      amount: "charge deducted"
      charge_reason: "partial_withdrawal or full_surrender"
      charge_pct: "the surrender charge percentage applied"
      contract_year: "the surrender charge schedule year the charge was taken in"
      fixed_request_id: "the request the charge belongs to"
    account: contract_value
    direction: out
    triggers: []
  - type: fixed_surrender_paid
    target: fixed_transactions
    meaning: "The remaining contract value leaves the contract on full surrender and the cash surrender value is paid."
    grain: "one row per surrender"
    distinguish_by: [fixed_request_id]
    fields:
      transaction_date: "date paid"
      amount: "contract value released after any surrender charge"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      net_paid_amount: "amount paid after withholding"
      fixed_request_id: "the signed surrender request"
      payout_method: "how it was paid"
    account: contract_value
    direction: out
    triggers: []
  - type: fixed_annuitization_transfer
    target: fixed_transactions
    meaning: "The contract value is applied as the purchase amount of an Ashgrove income annuity."
    grain: "one row per annuitization"
    distinguish_by: [transaction_date]
    fields:
      transaction_date: "annuitization date"
      amount: "contract value applied, free of surrender charge where annuitization qualifies, otherwise after the charge"
      fixed_request_id: "the signed annuitization election; empty at maturity"
    account: contract_value
    direction: out
    triggers:
      - event: income:income_contract_issued
        map: {customer_id: customer_id, source_fixed_contract_id: fixed_contract_id, issue_date: transaction_date, purchase_amount: amount}
  - type: fixed_death_benefit_paid
    target: fixed_transactions
    meaning: "One beneficiary's share of the death benefit is paid out."
    grain: "one row per payee per death claim"
    distinguish_by: [fixed_request_id, payee_name]
    fields:
      transaction_date: "date paid"
      amount: "share of contract value paid, excluding interest"
      interest_amount: "death-claim interest paid with it"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      payee_name: "beneficiary as named in the governing designation"
      payout_method: "how it was paid"
      fixed_request_id: "the death claim"
    account: contract_value
    direction: out
    triggers: []
  - type: fixed_premium_returned
    target: fixed_transactions
    meaning: "Premium is returned on a free-look cancellation or on a declined application."
    grain: "one row per return"
    distinguish_by: [return_reason]
    fields:
      transaction_date: "date returned"
      amount: "amount returned"
      return_reason: "free_look or application_declined"
    account: contract_value
    direction: out
    triggers: []
  - type: fixed_beneficiary_designated
    target: fixed_transactions
    meaning: "One beneficiary line of a designation is recorded; a later designation replaces the earlier one entirely."
    grain: "one row per beneficiary line per designation"
    distinguish_by: [designation_effective_date, beneficiary_class, beneficiary_name]
    fields:
      transaction_date: "date recorded"
      designation_effective_date: "date the owner signed the designation"
      beneficiary_name: "beneficiary as named"
      beneficiary_relationship: "relationship to the owner"
      beneficiary_class: "primary or contingent"
      share_percent: "whole-percent share within the class"
      designation_type: "revocable or irrevocable"
      fixed_request_id: "the signed change request; empty for the original designation"
    triggers: []

measures:
  - id: fixed_msr_withdrawals_contract_year
    window: "the current contract year, from the latest contract anniversary on or before the evaluation date (the issue date in year 1), before the withdrawal being evaluated"
    measure: "sum of amount over fixed_withdrawal_paid rows on the contract in the window"
  - id: fixed_msr_anniversary_value
    window: "all rows up to and including the latest contract anniversary on or before the evaluation date"
    measure: "net sum of amount over every contract_value row on the contract (in rows added, out rows subtracted) — the contract value on that anniversary"
  - id: fixed_msr_premiums_on_annuitant
    window: "point in time at the evaluation date"
    measure: "sum of amount over fixed_premium_received rows, less fixed_premium_returned rows, on every fixed_holdings contract on the same annuitant (annuitant_name and annuitant_date_of_birth) whose status is applied or active"

policies:
  - id: fixed_agg_multi_holding
    subject: [fixed_contract_issued]
    rule: "An owner may hold any number of Ashgrove deferred fixed annuity contracts, of any tiers and tax registrations; the count is not capped. Total premium on one annuitant is governed by fixed_agg_premium_limit."
    eligibility: []
    params:
      max_per_customer: null
  - id: fixed_agg_premium_limit
    subject: [fixed_contract_issued, fixed_premium_received]
    rule: "Premiums are aggregated per annuitant, identified by annuitant name and date of birth, across every Ashgrove deferred fixed annuity in applied or active status. A premium is accepted without home office approval only if fixed_msr_premiums_on_annuitant plus the new premium does not exceed aggregate_premium_limit_per_annuitant, and only if the contract's own total premium stays within max_premium_without_approval. A premium above either limit is not accepted through policy service and is referred for home office approval."
    eligibility: []
    params:
      aggregate_premium_limit_per_annuitant: 2000000
      max_premium_without_approval: "=max_premium_without_approval"
    measures: [fixed_msr_premiums_on_annuitant]
  - id: fixed_issue_and_funding
    subject: [fixed_contract_issued, fixed_contract_activated, fixed_application_declined, fixed_premium_received]
    rule: "A tier is issued only when the owner's and annuitant's ages on the issue date are between min_issue_age and max_issue_age, with an initial premium of at least min_initial_premium_nonqualified for a non-qualified contract or min_initial_premium_qualified for an IRA, registered as one of tax_qualifications_offered. A premium is credited only while the contract status is applied or active. The contract is issued and becomes active when the initial premium or the exchange or transfer proceeds are received in good order; the contract date is the date funds are received. Funds from a 1035 exchange or IRA transfer are credited on the date Ashgrove receives them from the other company; a partial arrival is credited when it arrives. An application declined or withdrawn before issue has any money received returned without interest. Additional premiums are accepted only where additional_premiums_allowed is true, while the contract is active, of at least min_additional_premium, by check, wire or EFT on a draft day from 1 to eft_draft_day_max."
    eligibility:
      - id: premium_status
        applies_to: [fixed_premium_received]
        kind: state
        condition: "A premium is credited only while the contract status is applied or active."
        evidence_fields: [fixed_holdings.status, fixed_holdings.fixed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_holdings.fixed_contract_id]]
          action_bindings: {fixed_holdings.fixed_contract_id: fixed_contract_id}
        state_contract:
          field: fixed_holdings.status
          allowed: [applied, active]
    params:
      eft_draft_day_max: "=eft_draft_day_max"
      tax_qualifications_offered: "=tax_qualifications_offered"
      per_tier:
        Ashgrove Flexible Premium Deferred Annuity: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_initial_premium_nonqualified: "=min_initial_premium_nonqualified", min_initial_premium_qualified: "=min_initial_premium_qualified", additional_premiums_allowed: "=additional_premiums_allowed", min_additional_premium: "=min_additional_premium"}
        Ashgrove SecureRate 3: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_initial_premium_nonqualified: "=min_initial_premium_nonqualified", min_initial_premium_qualified: "=min_initial_premium_qualified", additional_premiums_allowed: "=additional_premiums_allowed", min_additional_premium: "=min_additional_premium"}
        Ashgrove SecureRate 5: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_initial_premium_nonqualified: "=min_initial_premium_nonqualified", min_initial_premium_qualified: "=min_initial_premium_qualified", additional_premiums_allowed: "=additional_premiums_allowed", min_additional_premium: "=min_additional_premium"}
        Ashgrove SecureRate 6: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_initial_premium_nonqualified: "=min_initial_premium_nonqualified", min_initial_premium_qualified: "=min_initial_premium_qualified", additional_premiums_allowed: "=additional_premiums_allowed", min_additional_premium: "=min_additional_premium"}
        Ashgrove SecureRate 7: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_initial_premium_nonqualified: "=min_initial_premium_nonqualified", min_initial_premium_qualified: "=min_initial_premium_qualified", additional_premiums_allowed: "=additional_premiums_allowed", min_additional_premium: "=min_additional_premium"}
        Ashgrove SecureRate 10: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_initial_premium_nonqualified: "=min_initial_premium_nonqualified", min_initial_premium_qualified: "=min_initial_premium_qualified", additional_premiums_allowed: "=additional_premiums_allowed", min_additional_premium: "=min_additional_premium"}
  - id: fixed_interest_crediting
    subject: [fixed_interest_credited, fixed_guarantee_period_renewed]
    rule: "Each guarantee period earns the rate guaranteed for it, an annual effective rate never below guaranteed_min_interest_rate. The rate for a new guarantee period is current_base_rate plus high_band_rate_addition when the premium (or, at renewal, the contract value on the renewal date) is at least high_band_threshold; on the Ashgrove Flexible Premium Deferred Annuity, first_year_interest_bonus is added for the first contract year only, and each later contract year earns the rate declared for it. Interest is credited on each contract anniversary for the contract year, and on the date of any withdrawal, surrender, death benefit payment or annuitization for the part year since the last crediting, at the daily equivalent of the annual effective rate for actual calendar days; each additional premium earns from the day it is credited. A guarantee period renews under fixed_guarantee_period_renewal."
    eligibility: []
    params:
      per_tier:
        Ashgrove Flexible Premium Deferred Annuity: {guarantee_period_years: "=guarantee_period_years", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", current_base_rate: "=current_base_rate", high_band_threshold: "=high_band_threshold", high_band_rate_addition: "=high_band_rate_addition", first_year_interest_bonus: "=first_year_interest_bonus"}
        Ashgrove SecureRate 3: {guarantee_period_years: "=guarantee_period_years", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", current_base_rate: "=current_base_rate", high_band_threshold: "=high_band_threshold", high_band_rate_addition: "=high_band_rate_addition", first_year_interest_bonus: "=first_year_interest_bonus"}
        Ashgrove SecureRate 5: {guarantee_period_years: "=guarantee_period_years", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", current_base_rate: "=current_base_rate", high_band_threshold: "=high_band_threshold", high_band_rate_addition: "=high_band_rate_addition", first_year_interest_bonus: "=first_year_interest_bonus"}
        Ashgrove SecureRate 6: {guarantee_period_years: "=guarantee_period_years", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", current_base_rate: "=current_base_rate", high_band_threshold: "=high_band_threshold", high_band_rate_addition: "=high_band_rate_addition", first_year_interest_bonus: "=first_year_interest_bonus"}
        Ashgrove SecureRate 7: {guarantee_period_years: "=guarantee_period_years", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", current_base_rate: "=current_base_rate", high_band_threshold: "=high_band_threshold", high_band_rate_addition: "=high_band_rate_addition", first_year_interest_bonus: "=first_year_interest_bonus"}
        Ashgrove SecureRate 10: {guarantee_period_years: "=guarantee_period_years", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", current_base_rate: "=current_base_rate", high_band_threshold: "=high_band_threshold", high_band_rate_addition: "=high_band_rate_addition", first_year_interest_bonus: "=first_year_interest_bonus"}
    formula:
      new_period_rate: max(guaranteed_min_interest_rate, current_base_rate + (high_band_rate_addition if contract_value >= high_band_threshold else 0))
  - id: fixed_evt_withdrawal
    subject: [fixed_withdrawal_paid, fixed_surrender_charge_assessed]
    rule: "The owner may take partial withdrawals by signed request. A withdrawal is paid only while the contract status is active. A partial withdrawal is paid only on a withdrawal request signed by the owner and approved. Each withdrawal must be at least min_withdrawal_amount, and a request that would leave less than min_remaining_contract_value is processed as a full surrender. From contract year free_withdrawal_first_contract_year, withdrawals in a contract year up to free_withdrawal_pct of the contract value on the most recent contract anniversary (fixed_msr_anniversary_value; the initial premium in the first contract year) are free of surrender charge; withdrawals already taken in the contract year (fixed_msr_withdrawals_contract_year) use up the free amount, and unused free amount carries forward only where free_withdrawal_carryover is true. The part above the free amount is an excess withdrawal and, within surrender_charge_years of sc_schedule_start_date, bears a surrender charge of that part times the surrender_charge_ladder percentage for the schedule year in which it is taken, rounded to the cent; the charge is deducted from the remaining contract value, not from the amount paid. No surrender charge applies during a renewal window under fixed_guarantee_period_renewal, or to amounts waived under fixed_sc_waivers or fixed_evt_rmd_and_systematic. On a non-qualified contract a withdrawal is taxable first to the extent of the gain (contract value less cost basis); on a traditional or SEP IRA the whole amount is taxable; on a Roth IRA no tax is withheld by default. Federal tax is withheld at federal_withholding_default_pct of the taxable amount unless the owner elected no withholding."
    eligibility:
      - id: withdrawal_status
        applies_to: [fixed_withdrawal_paid]
        kind: state
        condition: "A withdrawal is paid only while the contract status is active."
        evidence_fields: [fixed_holdings.status, fixed_holdings.fixed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_holdings.fixed_contract_id]]
          action_bindings: {fixed_holdings.fixed_contract_id: fixed_contract_id}
        state_contract:
          field: fixed_holdings.status
          allowed: [active]
      - id: signed_withdrawal_request
        applies_to: [fixed_withdrawal_paid]
        kind: authorization
        condition: "A partial withdrawal is paid only on a withdrawal request signed by the owner and approved."
        evidence_fields: [fixed_service_requests.request_type, fixed_service_requests.request_status, fixed_service_requests.signed_date, fixed_service_requests.fixed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_service_requests.fixed_request_id]]
          action_bindings: {fixed_service_requests.fixed_request_id: fixed_request_id}
    params:
      min_withdrawal_amount: "=min_withdrawal_amount"
      min_remaining_contract_value: "=min_remaining_contract_value"
      federal_withholding_default_pct: "=federal_withholding_default_pct"
      surrender_charge_pct: "=surrender_charge_ladder"
      per_tier:
        Ashgrove Flexible Premium Deferred Annuity: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", free_withdrawal_carryover: "=free_withdrawal_carryover", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove SecureRate 3: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", free_withdrawal_carryover: "=free_withdrawal_carryover", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove SecureRate 5: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", free_withdrawal_carryover: "=free_withdrawal_carryover", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove SecureRate 6: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", free_withdrawal_carryover: "=free_withdrawal_carryover", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove SecureRate 7: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", free_withdrawal_carryover: "=free_withdrawal_carryover", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove SecureRate 10: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", free_withdrawal_carryover: "=free_withdrawal_carryover", surrender_charge_years: "=surrender_charge_years"}
    measures: [fixed_msr_withdrawals_contract_year, fixed_msr_anniversary_value]
    formula:
      free_amount_remaining: max(0, round(free_withdrawal_pct * fixed_msr_anniversary_value, 2) - fixed_msr_withdrawals_contract_year)
      excess_amount: max(0, amount - free_amount_remaining)
      surrender_charge: round(excess_amount * surrender_charge_pct, 2)
  - id: fixed_evt_rmd_and_systematic
    subject: [fixed_withdrawal_paid, fixed_systematic_withdrawal_changed, fixed_rmd_amount_posted]
    rule: "For an IRA contract whose owner has reached the federal required beginning age, Ashgrove calculates the required minimum distribution for each calendar year from the prior December 31 contract value and posts it as rmd_amount_current_year. Where rmd_surrender_charge_waiver is true, withdrawals in the calendar year up to the posted required minimum distribution are free of surrender charge even when they exceed the free withdrawal amount, and they count toward the free withdrawal amount for the contract year. A systematic withdrawal plan pays a fixed installment of at least systematic_withdrawal_min at one of systematic_frequencies. A systematic plan change is accepted only while the contract status is active. Systematic installments are withdrawals under fixed_evt_withdrawal and bear the surrender charge on any part above the free amount. A plan stops automatically on surrender, annuitization or notice of death."
    eligibility:
      - id: plan_status
        applies_to: [fixed_systematic_withdrawal_changed]
        kind: state
        condition: "A systematic plan change is accepted only while the contract status is active."
        evidence_fields: [fixed_holdings.status, fixed_holdings.fixed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_holdings.fixed_contract_id]]
          action_bindings: {fixed_holdings.fixed_contract_id: fixed_contract_id}
        state_contract:
          field: fixed_holdings.status
          allowed: [active]
    params:
      rmd_surrender_charge_waiver: "=rmd_surrender_charge_waiver"
      systematic_withdrawal_min: "=systematic_withdrawal_min"
      systematic_frequencies: "=systematic_frequencies"
  - id: fixed_sc_waivers
    subject: [fixed_withdrawal_paid, fixed_contract_surrendered]
    rule: "Where the waivers are included — nursing_home_waiver_available and terminal_illness_waiver_available true, and the owner's issue age not above waiver_max_issue_age — surrender charges are waived on withdrawals and surrender in two situations. A surrender charge waiver applies only under a waiver claim whose request status is approved. The nursing home waiver applies when the owner has been confined to a licensed nursing facility for at least nursing_home_min_days consecutive days, the confinement began in contract year nursing_home_waiver_first_contract_year or later, and the request is received during the confinement or within 90 days after it ends. The terminal illness waiver applies when a physician certifies the owner's life expectancy at terminal_illness_life_expectancy_months or less, after the first contract year. A waiver removes the surrender charge only; withholding still applies."
    eligibility:
      - id: approved_waiver_claim
        applies_to: [fixed_withdrawal_paid, fixed_contract_surrendered]
        kind: authorization
        condition: "A surrender charge waiver applies only under a waiver claim whose request status is approved."
        evidence_fields: [fixed_service_requests.request_type, fixed_service_requests.request_status, fixed_service_requests.signed_date, fixed_service_requests.confinement_start_date, fixed_service_requests.life_expectancy_months, fixed_service_requests.fixed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_service_requests.fixed_request_id]]
          action_bindings: {fixed_service_requests.fixed_request_id: fixed_request_id}
    params:
      per_tier:
        Ashgrove Flexible Premium Deferred Annuity: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", nursing_home_waiver_first_contract_year: "=nursing_home_waiver_first_contract_year", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_max_issue_age: "=waiver_max_issue_age"}
        Ashgrove SecureRate 3: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", nursing_home_waiver_first_contract_year: "=nursing_home_waiver_first_contract_year", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_max_issue_age: "=waiver_max_issue_age"}
        Ashgrove SecureRate 5: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", nursing_home_waiver_first_contract_year: "=nursing_home_waiver_first_contract_year", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_max_issue_age: "=waiver_max_issue_age"}
        Ashgrove SecureRate 6: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", nursing_home_waiver_first_contract_year: "=nursing_home_waiver_first_contract_year", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_max_issue_age: "=waiver_max_issue_age"}
        Ashgrove SecureRate 7: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", nursing_home_waiver_first_contract_year: "=nursing_home_waiver_first_contract_year", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_max_issue_age: "=waiver_max_issue_age"}
        Ashgrove SecureRate 10: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", nursing_home_waiver_first_contract_year: "=nursing_home_waiver_first_contract_year", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_max_issue_age: "=waiver_max_issue_age"}
  - id: fixed_surrender
    subject: [fixed_contract_surrendered, fixed_surrender_paid, fixed_surrender_charge_assessed]
    rule: "The owner may surrender the contract for its cash surrender value. A full surrender is processed only on a surrender request signed by the owner, and by any irrevocable beneficiary and assignee of record. The surrender is effective on the date the signed request is received in good order; interest is credited to that date. The cash surrender value is the contract value less a surrender charge equal to the contract value less the remaining free withdrawal amount, times the surrender_charge_ladder percentage for the schedule year, rounded to the cent, but never less than the guaranteed minimum value required by the state nonforfeiture law. No surrender charge applies after surrender_charge_years from sc_schedule_start_date, during a renewal window, or under an approved waiver. Withholding follows fixed_evt_withdrawal. Ashgrove may defer payment for up to surrender_deferral_max_days. A 1035 exchange or IRA transfer out to another company is a full surrender paid to that company."
    eligibility:
      - id: signed_surrender_request
        applies_to: [fixed_contract_surrendered, fixed_surrender_paid]
        kind: authorization
        condition: "A full surrender is processed only on a surrender request signed by the owner, and by any irrevocable beneficiary and assignee of record."
        evidence_fields: [fixed_service_requests.request_type, fixed_service_requests.request_status, fixed_service_requests.signed_date, fixed_service_requests.fixed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_service_requests.fixed_request_id]]
          action_bindings: {fixed_service_requests.fixed_request_id: fixed_request_id}
    params:
      surrender_charge_pct: "=surrender_charge_ladder"
      surrender_deferral_max_days: "=surrender_deferral_max_days"
      per_tier:
        Ashgrove Flexible Premium Deferred Annuity: {surrender_charge_years: "=surrender_charge_years", free_withdrawal_pct: "=free_withdrawal_pct"}
        Ashgrove SecureRate 3: {surrender_charge_years: "=surrender_charge_years", free_withdrawal_pct: "=free_withdrawal_pct"}
        Ashgrove SecureRate 5: {surrender_charge_years: "=surrender_charge_years", free_withdrawal_pct: "=free_withdrawal_pct"}
        Ashgrove SecureRate 6: {surrender_charge_years: "=surrender_charge_years", free_withdrawal_pct: "=free_withdrawal_pct"}
        Ashgrove SecureRate 7: {surrender_charge_years: "=surrender_charge_years", free_withdrawal_pct: "=free_withdrawal_pct"}
        Ashgrove SecureRate 10: {surrender_charge_years: "=surrender_charge_years", free_withdrawal_pct: "=free_withdrawal_pct"}
    formula:
      surrender_charge: round(max(0, contract_value - max(0, round(free_withdrawal_pct * fixed_msr_anniversary_value, 2) - fixed_msr_withdrawals_contract_year)) * surrender_charge_pct, 2)
  - id: fixed_guarantee_period_renewal
    subject: [fixed_guarantee_period_renewed]
    rule: "When a SecureRate guarantee period ends, a renewal window of renewal_window_days begins the day after the guarantee period end date. During the window the owner may withdraw any amount or surrender without surrender charge, or elect a new guarantee period of any SecureRate length then offered. A renewal election must be received no later than the guarantee period end date plus renewal_window_days. The window end is found by adding the window length in calendar days to the guarantee period end date; an election received on that day is in time. Without an election the contract renews on the day after the guarantee period end date into renewal_default_period_years at the rate then declared for that period under fixed_interest_crediting, and a new surrender charge schedule starts on the renewal date. An election of a different period changes the tier to the SecureRate of that length, effective the day after the guarantee period end date. The Ashgrove Flexible Premium Deferred Annuity has no renewal window; its rate is re-declared each contract year without restarting its schedule."
    eligibility:
      - id: election_in_window
        applies_to: [fixed_guarantee_period_renewed]
        kind: time
        condition: "A renewal election must be received no later than the guarantee period end date plus renewal_window_days."
        evidence_fields: [fixed_holdings.guarantee_period_end_date, fixed_service_requests.received_date, fixed_holdings.fixed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_holdings.fixed_contract_id]]
          action_bindings: {fixed_holdings.fixed_contract_id: fixed_contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guarantee period end date"
          anchor_source: fixed_holdings.guarantee_period_end_date
          relation: not_after
          duration_source: variants.renewal_window_days
          unit: calendar_days
          counting_rule: "The window end is found by adding the window length in calendar days to the guarantee period end date; an election received on that day is in time."
          boundary: inclusive
    params:
      per_tier:
        Ashgrove Flexible Premium Deferred Annuity: {renewal_window_days: "=renewal_window_days", renewal_default_period_years: "=renewal_default_period_years"}
        Ashgrove SecureRate 3: {renewal_window_days: "=renewal_window_days", renewal_default_period_years: "=renewal_default_period_years"}
        Ashgrove SecureRate 5: {renewal_window_days: "=renewal_window_days", renewal_default_period_years: "=renewal_default_period_years"}
        Ashgrove SecureRate 6: {renewal_window_days: "=renewal_window_days", renewal_default_period_years: "=renewal_default_period_years"}
        Ashgrove SecureRate 7: {renewal_window_days: "=renewal_window_days", renewal_default_period_years: "=renewal_default_period_years"}
        Ashgrove SecureRate 10: {renewal_window_days: "=renewal_window_days", renewal_default_period_years: "=renewal_default_period_years"}
  - id: fixed_annuitization
    subject: [fixed_contract_annuitized, fixed_annuitization_transfer]
    rule: "The owner may apply the contract value to an Ashgrove income annuity by signed election. Annuitization is processed only on an annuitization election signed by the owner and approved, except at the maturity date. Annuitization from contract year annuitization_first_contract_year onward is free of surrender charge when the income option includes a life contingency or a period certain of at least annuitization_min_period_certain_years; otherwise the surrender charge under fixed_surrender is deducted first. The contract value applied must be at least annuitization_min_contract_value; a smaller value is paid in a lump sum. When the annuitant reaches maturity_age the contract is annuitized on a life with 10-year period certain basis unless the owner elects another option or a lump sum before that date. The income annuity is issued to the same owner, with the same tax registration, on the annuitization date, with purchase amount equal to the value applied."
    eligibility:
      - id: signed_annuitization_election
        applies_to: [fixed_contract_annuitized]
        kind: authorization
        condition: "Annuitization is processed only on an annuitization election signed by the owner and approved, except at the maturity date."
        evidence_fields: [fixed_service_requests.request_type, fixed_service_requests.request_status, fixed_service_requests.signed_date, fixed_service_requests.fixed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_service_requests.fixed_request_id]]
          action_bindings: {fixed_service_requests.fixed_request_id: fixed_request_id}
    params:
      annuitization_min_period_certain_years: "=annuitization_min_period_certain_years"
      annuitization_min_contract_value: "=annuitization_min_contract_value"
      maturity_age: "=maturity_age"
      per_tier:
        Ashgrove Flexible Premium Deferred Annuity: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove SecureRate 3: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove SecureRate 5: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove SecureRate 6: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove SecureRate 7: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove SecureRate 10: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
  - id: fixed_death_benefit
    subject: [fixed_death_claim_registered, fixed_death_claim_paid, fixed_spousal_continuation, fixed_death_benefit_paid]
    rule: "On the death of an owner before annuitization, the death benefit is the contract value on the date due proof of death is received, with no surrender charge. Death benefit is paid only on a death claim whose certified death certificate has been received and whose request status is approved. Disbursement proceeds only while the contract status is death_claim_pending or claim_paid. Interest is added at death_claim_interest_rate, simple, for actual calendar days from the date due proof is received to payment, over 365, rounded to the cent. The benefit is divided among the surviving primary beneficiaries of the designation in effect at death by share; a predeceased primary's share passes pro rata to surviving primaries, then to contingents, then to the owner's estate. Where spousal_continuation_allowed is true and the owner's spouse is the sole primary beneficiary, the spouse may instead continue the contract as owner with no surrender charge restart, and the death benefit is not paid. Any other beneficiary must take a lump sum, or apply the share to an Ashgrove income annuity beginning within beneficiary_annuitization_start_months of the date of death, or take the whole share within nonspouse_payout_deadline_years of the date of death. A share for a beneficiary younger than minor_beneficiary_age is paid only to a guardian or UTMA custodian. The taxable part of a non-qualified benefit is the gain over cost basis; withholding follows fixed_evt_withdrawal."
    eligibility:
      - id: proof_and_approval
        applies_to: [fixed_death_claim_paid, fixed_death_benefit_paid, fixed_spousal_continuation]
        kind: authorization
        condition: "Death benefit is paid only on a death claim whose certified death certificate has been received and whose request status is approved."
        evidence_fields: [fixed_service_requests.death_certificate_received, fixed_service_requests.request_status, fixed_service_requests.fixed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_service_requests.fixed_request_id]]
          action_bindings: {fixed_service_requests.fixed_request_id: fixed_request_id}
      - id: disbursement_status
        applies_to: [fixed_death_benefit_paid]
        kind: state
        condition: "Disbursement proceeds only while the contract status is death_claim_pending or claim_paid."
        evidence_fields: [fixed_holdings.status, fixed_holdings.fixed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_holdings.fixed_contract_id]]
          action_bindings: {fixed_holdings.fixed_contract_id: fixed_contract_id}
        state_contract:
          field: fixed_holdings.status
          allowed: [death_claim_pending, claim_paid]
    params:
      spousal_continuation_allowed: "=spousal_continuation_allowed"
      beneficiary_annuitization_start_months: "=beneficiary_annuitization_start_months"
      nonspouse_payout_deadline_years: "=nonspouse_payout_deadline_years"
      death_claim_interest_rate: "=death_claim_interest_rate"
      minor_beneficiary_age: "=minor_beneficiary_age"
  - id: fixed_beneficiary_designation
    subject: [fixed_beneficiary_designated]
    rule: "The owner names primary and contingent beneficiaries. A beneficiary designation is recorded only while the contract status is applied or active. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. The new designation replaces the earlier one entirely, effective on the owner's signature date if signed while the owner was living. Shares are whole percents of at least beneficiary_min_share_pct totalling 100 in each class, with no more than beneficiary_max_primary primaries. On an IRA contract the owner's spouse must consent in writing to a primary designation of anyone else where the owner lives in a community property state."
    eligibility:
      - id: designation_status
        applies_to: [fixed_beneficiary_designated]
        kind: state
        condition: "A beneficiary designation is recorded only while the contract status is applied or active."
        evidence_fields: [fixed_holdings.status, fixed_holdings.fixed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_holdings.fixed_contract_id]]
          action_bindings: {fixed_holdings.fixed_contract_id: fixed_contract_id}
        state_contract:
          field: fixed_holdings.status
          allowed: [applied, active]
      - id: signed_change_request
        applies_to: [fixed_beneficiary_designated]
        kind: authorization
        condition: "A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary."
        evidence_fields: [fixed_service_requests.request_type, fixed_service_requests.request_status, fixed_service_requests.signed_date, fixed_transactions.designation_type, fixed_service_requests.fixed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_service_requests.fixed_request_id]]
          action_bindings: {fixed_service_requests.fixed_request_id: fixed_request_id}
    params:
      beneficiary_min_share_pct: "=beneficiary_min_share_pct"
      beneficiary_max_primary: "=beneficiary_max_primary"
  - id: fixed_free_look
    subject: [fixed_free_look_cancelled, fixed_premium_returned]
    rule: "The owner may return the contract for a refund of the premium paid less any withdrawals. The returned contract must be received no later than the contract delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the contract delivery date; a contract received on that day is in time. When the contract replaced another annuity or life policy, free_look_days_replacement replaces free_look_days; when the owner's age on the issue date was free_look_senior_age or more, free_look_days_senior replaces it; when both apply the longer period governs. Exchange or transfer proceeds are returned to the company they came from where the owner asks."
    eligibility:
      - id: within_free_look
        applies_to: [fixed_free_look_cancelled]
        kind: time
        condition: "The returned contract must be received no later than the contract delivery date plus free_look_days."
        evidence_fields: [fixed_holdings.contract_delivery_date, fixed_holdings.replacement_sale, fixed_holdings.issue_age, fixed_holdings.fixed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fixed_holdings.fixed_contract_id]]
          action_bindings: {fixed_holdings.fixed_contract_id: fixed_contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the contract delivery date"
          anchor_source: fixed_holdings.contract_delivery_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look end is found by adding the free-look days in calendar days to the contract delivery date; a contract received on that day is in time."
          boundary: inclusive
    params:
      free_look_days: "=free_look_days"
      free_look_days_replacement: "=free_look_days_replacement"
      free_look_senior_age: "=free_look_senior_age"
      free_look_days_senior: "=free_look_days_senior"

extended_policies:
  - id: fixed_ext_missed_withdrawal_charge
    base_policy_refs: [fixed_evt_withdrawal, fixed_surrender, fixed_evt_rmd_and_systematic, fixed_sc_waivers, fixed_guarantee_period_renewal]
    overwrite:
      - base_policy: fixed_evt_withdrawal
        superseded_clause: >-
          withdrawals in a contract year up to free_withdrawal_pct of the contract value on the most recent contract anniversary
        replaced_by: >-
          The free percentage of a corrected partial-withdrawal charge is senior_free_pct where the annuitant was aged senior_age or more on the contract anniversary that opened the withdrawal's contract year and the withdrawal fell in schedule year seasoned_schedule_year or later, seasoned_free_pct where the annuitant was under senior_age on that anniversary and the withdrawal fell in schedule year seasoned_schedule_year or later, and free_withdrawal_pct otherwise.
      - base_policy: fixed_evt_withdrawal
        superseded_clause: >-
          bears a surrender charge of that part times the surrender_charge_ladder percentage for the schedule year in which it is taken, rounded to the cent
        replaced_by: >-
          The percentage of a corrected partial-withdrawal charge is worked in this order: the schedule-year percentage is first capped, the capped percentage is then reduced for the whole life relationship, and the reduced percentage is then graded; the corrected partial-withdrawal charge is the excess times the graded percentage times the recovered share, rounded to the cent.
      - base_policy: fixed_evt_rmd_and_systematic
        superseded_clause: >-
          and they count toward the free withdrawal amount for the contract year
        replaced_by: >-
          The earlier withdrawals that use up the free amount of a corrected partial-withdrawal charge are, on a traditional or SEP IRA contract with required minimum distribution withdrawals earlier in the withdrawal's contract year, every earlier withdrawal of that contract year except the required minimum distribution withdrawals; on any other contract with withdrawals taken earlier in that contract year under an approved surrender charge waiver, every earlier withdrawal of that contract year except the waiver withdrawals; and otherwise every earlier withdrawal of that contract year.
    trigger: state_due
    subject: [fixed_surrender_charge_assessed]
    computes: charge_amount
    target_tool: assess_missed_withdrawal_charge_e9f9c059
    params:
      senior_age: 70
      seasoned_schedule_year: 4
      senior_free_pct: 0.15
      seasoned_free_pct: 0.12
      ladder_step: 0.01
      cap_age_high: 75
      cap_pct_high: 0.02
      cap_pct_mid: 0.03
      rel_premium_count: 12
      rel_reduction_full: 0.005
      rel_reduction_part: 0.0025
      closing_window_years: 3
      late_days: 90
      late_share_senior: 0.5
      late_share: 0.75
    rule: >-
      An excess partial withdrawal that was paid without the surrender charge entry it owed is corrected by booking the missing charge, dated the day it is booked, as a deduction from the remaining contract value; the money already paid to the owner is not touched.
      The corrected partial-withdrawal charge is worked out on the most recent excess partial withdrawal on the contract.
      Its free amount, where the withdrawal fell in contract year free_withdrawal_first_contract_year or later, is free_withdrawal_pct times the contract value on the contract anniversary that opened the withdrawal's contract year (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken earlier in that contract year, never below zero; where the withdrawal fell in an earlier contract year its free amount is nothing.
      Its excess is the withdrawal amount less that free amount, never below zero.
      Its charge percentage is the surrender_charge_ladder percentage for the schedule year in which the withdrawal was taken, which is the first-year percentage of the ladder less ladder_step for each schedule year completed since sc_schedule_start_date, and nothing once surrender_charge_years have passed, where the withdrawal fell in a renewal window, or where the contract has an approved nursing home or terminal illness waiver claim.
      The corrected partial-withdrawal charge is the excess times the charge percentage, rounded to the cent, and is booked as a deduction from the contract value.
      The free percentage of a corrected partial-withdrawal charge is senior_free_pct where the annuitant was aged senior_age or more on the contract anniversary that opened the withdrawal's contract year and the withdrawal fell in schedule year seasoned_schedule_year or later, seasoned_free_pct where the annuitant was under senior_age on that anniversary and the withdrawal fell in schedule year seasoned_schedule_year or later, and free_withdrawal_pct otherwise.
      The earlier withdrawals that use up the free amount of a corrected partial-withdrawal charge are, on a traditional or SEP IRA contract with required minimum distribution withdrawals earlier in the withdrawal's contract year, every earlier withdrawal of that contract year except the required minimum distribution withdrawals; on any other contract with withdrawals taken earlier in that contract year under an approved surrender charge waiver, every earlier withdrawal of that contract year except the waiver withdrawals; and otherwise every earlier withdrawal of that contract year.
      The schedule-year percentage of a corrected partial-withdrawal charge is capped at cap_pct_high where the annuitant was aged cap_age_high or more on the withdrawal date, capped at cap_pct_mid where the annuitant was aged senior_age or more but under cap_age_high on the withdrawal date, and left uncapped where the annuitant was under senior_age on that date.
      The capped percentage of a corrected partial-withdrawal charge is reduced, never below zero, by rel_reduction_full where the owner holds an in-force Ashgrove whole life policy with at least rel_premium_count whole life premium payments in the twelve months before the correction is booked, by rel_reduction_part where the owner holds an in-force Ashgrove whole life policy with at least one but fewer than rel_premium_count such payments, and not at all otherwise.
      Where the annuitant was aged senior_age or more on the withdrawal date and the withdrawal fell in one of the last closing_window_years schedule years, the reduced percentage of a corrected partial-withdrawal charge is graded monthly, multiplied by twelve less the whole months already completed in that schedule year on the withdrawal date, over twelve; where the annuitant was under senior_age on that date and the withdrawal fell in those last schedule years, it is graded quarterly, multiplied by the quarters left in that schedule year (twelve less the completed months, divided by three and rounded up) over four; otherwise it is applied as it stands.
      A corrected partial-withdrawal charge booked more than late_days days after the withdrawal date recovers late_share_senior of the charge where the annuitant is aged senior_age or more on the booking date and late_share of it where the annuitant is younger on the booking date; one booked within late_days days of the withdrawal recovers the whole charge.
      The percentage of a corrected partial-withdrawal charge is worked in this order: the schedule-year percentage is first capped, the capped percentage is then reduced for the whole life relationship, and the reduced percentage is then graded; the corrected partial-withdrawal charge is the excess times the graded percentage times the recovered share, rounded to the cent.
      Contract years run from the issue date and its anniversaries; schedule years run from sc_schedule_start_date; ages are whole years last birthday from the annuitant's date of birth.
    prerequisite: []
    cross_category:
      - category: whole
        as: history
        reads: [status, whole_transactions.event_type, whole_transactions.transaction_date]
        note: The whole life relationship reduction is decided from the owner's in-force Ashgrove whole life policy and the count of its premium payments in the last twelve months.
    compute:
      - c_cv: "F('contract_value')"
      - c_w_amt: "LATEST('fixed_transactions', 'amount', date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='excess_partial')"
      - c_w_date: "LATEST('fixed_transactions', 'transaction_date', date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='excess_partial')"
      - c_m_w: "MONTHS(c_w_date, NOW)"
      - c_m_ap: "MONTHS(F('issue_date'), NOW) - (MONTHS(F('issue_date'), c_w_date) // 12) * 12"
      - c_after_in: "SUM('fixed_transactions', 'amount', within_months=c_m_ap, date_field='transaction_date', event_type='fixed_interest_credited') + SUM('fixed_transactions', 'amount', within_months=c_m_ap, date_field='transaction_date', event_type='fixed_premium_received')"
      - c_after_out: "SUM('fixed_transactions', 'amount', within_months=c_m_ap, date_field='transaction_date', event_type='fixed_withdrawal_paid') + SUM('fixed_transactions', 'amount', within_months=c_m_ap, date_field='transaction_date', event_type='fixed_surrender_charge_assessed')"
      - c_av: "RND(c_cv - c_after_in + c_after_out, 2)"
      - c_before_w: "SUM('fixed_transactions', 'amount', within_months=c_m_ap, date_field='transaction_date', event_type='fixed_withdrawal_paid') - SUM('fixed_transactions', 'amount', within_months=c_m_w + 1, date_field='transaction_date', event_type='fixed_withdrawal_paid')"
      - c_before_rmd: "SUM('fixed_transactions', 'amount', within_months=c_m_ap, date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='rmd') - SUM('fixed_transactions', 'amount', within_months=c_m_w + 1, date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='rmd')"
      - c_before_waiver: "SUM('fixed_transactions', 'amount', within_months=c_m_ap, date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='waiver_partial') - SUM('fixed_transactions', 'amount', within_months=c_m_w + 1, date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='waiver_partial')"
      - c_sy_w: "MONTHS(F('sc_schedule_start_date'), c_w_date) // 12 + 1"
      - c_age_ap: "(MONTHS(F('annuitant_date_of_birth'), NOW) - c_m_ap) // 12"
      - c_free_pct: "K('senior_free_pct') if (c_age_ap >= K('senior_age') and c_sy_w >= K('seasoned_schedule_year')) else (K('seasoned_free_pct') if (c_age_ap < K('senior_age') and c_sy_w >= K('seasoned_schedule_year')) else P('free_withdrawal_pct'))"
      - c_counted: "(c_before_w - c_before_rmd) if ((F('tax_qualification') == 'traditional_ira' or F('tax_qualification') == 'sep_ira') and c_before_rmd > 0) else ((c_before_w - c_before_waiver) if c_before_waiver > 0 else c_before_w)"
      - c_cy_w: "MONTHS(F('issue_date'), c_w_date) // 12 + 1"
      - c_free_rem: "0 if c_cy_w < P('free_withdrawal_first_contract_year') else MX(0, RND(c_free_pct * (F('initial_premium') if c_cy_w == 1 else c_av), 2) - c_counted)"
      - c_excess: "MX(0, c_w_amt - c_free_rem)"
      - c_gp_days_w: "DAYS(F('guarantee_period_end_date'), c_w_date)"
      - c_waivers: "COUNT('fixed_service_requests', request_status='approved', request_type='nursing_home_waiver_claim') + COUNT('fixed_service_requests', request_status='approved', request_type='terminal_illness_waiver_claim')"
      - c_sched_pct: "0 if (c_sy_w > P('surrender_charge_years') or (c_gp_days_w >= 1 and c_gp_days_w <= P('renewal_window_days')) or c_waivers > 0) else MX(0, MX(P('surrender_charge_ladder')) - K('ladder_step') * (c_sy_w - 1))"
      - c_age_w: "MONTHS(F('annuitant_date_of_birth'), c_w_date) // 12"
      - c_capped: "MN(c_sched_pct, K('cap_pct_high')) if c_age_w >= K('cap_age_high') else (MN(c_sched_pct, K('cap_pct_mid')) if c_age_w >= K('senior_age') else c_sched_pct)"
      - c_wl_inforce: "EXISTS('whole', status='in_force')"
      - c_wl_paid: "XCOUNT('whole', 'whole_transactions', within_months=12, date_field='transaction_date', event_type='whole_premium_paid')"
      - c_rel_reduction: "K('rel_reduction_full') if (c_wl_inforce and c_wl_paid >= K('rel_premium_count')) else (K('rel_reduction_part') if (c_wl_inforce and c_wl_paid >= 1) else 0)"
      - c_reduced: "MX(0, c_capped - c_rel_reduction)"
      - c_months_left: "12 - MONTHS(F('sc_schedule_start_date'), c_w_date) % 12"
      - c_graded: "c_reduced * c_months_left / 12 if (c_age_w >= K('senior_age') and c_sy_w > P('surrender_charge_years') - K('closing_window_years')) else (c_reduced * ((c_months_left + 2) // 3) / 4 if (c_age_w < K('senior_age') and c_sy_w > P('surrender_charge_years') - K('closing_window_years')) else c_reduced)"
      - c_age_now: "MONTHS(F('annuitant_date_of_birth'), NOW) // 12"
      - c_late_days: "DAYS(c_w_date, NOW)"
      - c_share: "K('late_share_senior') if (c_late_days > K('late_days') and c_age_now >= K('senior_age')) else (K('late_share') if (c_late_days > K('late_days') and c_age_now < K('senior_age')) else 1)"
      - result: "RND(c_excess * c_graded * c_share, 2)"
    compute_basis:
      c_w_amt: "The corrected partial-withdrawal charge is worked out on the most recent excess partial withdrawal on the contract."
      c_w_date: "The corrected partial-withdrawal charge is worked out on the most recent excess partial withdrawal on the contract."
      c_av: "Its free amount, where the withdrawal fell in contract year free_withdrawal_first_contract_year or later, is free_withdrawal_pct times the contract value on the contract anniversary that opened the withdrawal's contract year (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken earlier in that contract year, never below zero; where the withdrawal fell in an earlier contract year its free amount is nothing."
      c_before_w: "Its free amount, where the withdrawal fell in contract year free_withdrawal_first_contract_year or later, is free_withdrawal_pct times the contract value on the contract anniversary that opened the withdrawal's contract year (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken earlier in that contract year, never below zero; where the withdrawal fell in an earlier contract year its free amount is nothing."
      c_free_pct: "The free percentage of a corrected partial-withdrawal charge is senior_free_pct where the annuitant was aged senior_age or more on the contract anniversary that opened the withdrawal's contract year and the withdrawal fell in schedule year seasoned_schedule_year or later, seasoned_free_pct where the annuitant was under senior_age on that anniversary and the withdrawal fell in schedule year seasoned_schedule_year or later, and free_withdrawal_pct otherwise."
      c_counted: "The earlier withdrawals that use up the free amount of a corrected partial-withdrawal charge are, on a traditional or SEP IRA contract with required minimum distribution withdrawals earlier in the withdrawal's contract year, every earlier withdrawal of that contract year except the required minimum distribution withdrawals; on any other contract with withdrawals taken earlier in that contract year under an approved surrender charge waiver, every earlier withdrawal of that contract year except the waiver withdrawals; and otherwise every earlier withdrawal of that contract year."
      c_cy_w: "Its free amount, where the withdrawal fell in contract year free_withdrawal_first_contract_year or later, is free_withdrawal_pct times the contract value on the contract anniversary that opened the withdrawal's contract year (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken earlier in that contract year, never below zero; where the withdrawal fell in an earlier contract year its free amount is nothing."
      c_free_rem: "Its free amount, where the withdrawal fell in contract year free_withdrawal_first_contract_year or later, is free_withdrawal_pct times the contract value on the contract anniversary that opened the withdrawal's contract year (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken earlier in that contract year, never below zero; where the withdrawal fell in an earlier contract year its free amount is nothing."
      c_excess: "Its excess is the withdrawal amount less that free amount, never below zero."
      c_sched_pct: "Its charge percentage is the surrender_charge_ladder percentage for the schedule year in which the withdrawal was taken, which is the first-year percentage of the ladder less ladder_step for each schedule year completed since sc_schedule_start_date, and nothing once surrender_charge_years have passed, where the withdrawal fell in a renewal window, or where the contract has an approved nursing home or terminal illness waiver claim."
      c_capped: "The schedule-year percentage of a corrected partial-withdrawal charge is capped at cap_pct_high where the annuitant was aged cap_age_high or more on the withdrawal date, capped at cap_pct_mid where the annuitant was aged senior_age or more but under cap_age_high on the withdrawal date, and left uncapped where the annuitant was under senior_age on that date."
      c_rel_reduction: "The capped percentage of a corrected partial-withdrawal charge is reduced, never below zero, by rel_reduction_full where the owner holds an in-force Ashgrove whole life policy with at least rel_premium_count whole life premium payments in the twelve months before the correction is booked, by rel_reduction_part where the owner holds an in-force Ashgrove whole life policy with at least one but fewer than rel_premium_count such payments, and not at all otherwise."
      c_graded: "Where the annuitant was aged senior_age or more on the withdrawal date and the withdrawal fell in one of the last closing_window_years schedule years, the reduced percentage of a corrected partial-withdrawal charge is graded monthly, multiplied by twelve less the whole months already completed in that schedule year on the withdrawal date, over twelve; where the annuitant was under senior_age on that date and the withdrawal fell in those last schedule years, it is graded quarterly, multiplied by the quarters left in that schedule year (twelve less the completed months, divided by three and rounded up) over four; otherwise it is applied as it stands."
      c_share: "A corrected partial-withdrawal charge booked more than late_days days after the withdrawal date recovers late_share_senior of the charge where the annuitant is aged senior_age or more on the booking date and late_share of it where the annuitant is younger on the booking date; one booked within late_days days of the withdrawal recovers the whole charge."
      result: "The percentage of a corrected partial-withdrawal charge is worked in this order: the schedule-year percentage is first capped, the capped percentage is then reduced for the whole life relationship, and the reduced percentage is then graded; the corrected partial-withdrawal charge is the excess times the graded percentage times the recovered share, rounded to the cent."
    factors:
      - id: withdrawal_free_percentage
        effect: parameter
        decides: c_free_pct
        bindings: [c_age_ap, c_free_pct]
        ladder:
          - when: "the annuitant was aged senior_age or more on the anniversary opening the withdrawal's contract year AND the withdrawal fell in schedule year seasoned_schedule_year or later"
            value: "K('senior_free_pct')"
          - when: "the annuitant was under senior_age on that anniversary AND the withdrawal fell in schedule year seasoned_schedule_year or later"
            value: "K('seasoned_free_pct')"
          - when: "otherwise"
            value: "P('free_withdrawal_pct')"
        baseline:
          c_free_pct: "P('free_withdrawal_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: withdrawal_free_amount_usage
        effect: method
        decides: c_counted
        bindings: [c_before_rmd, c_before_waiver, c_counted]
        ladder:
          - when: "a traditional or SEP IRA contract with required minimum distribution withdrawals earlier in the withdrawal's contract year"
            method: "every earlier withdrawal of that contract year except the required minimum distribution withdrawals uses up the free amount"
          - when: "any other contract with withdrawals earlier in that contract year under an approved surrender charge waiver"
            method: "every earlier withdrawal of that contract year except the waiver withdrawals uses up the free amount"
          - when: "otherwise"
            method: "every earlier withdrawal of that contract year uses up the free amount"
        baseline:
          c_counted: "c_before_w"
        evidence: [history]
        cross_difficulty: null
      - id: withdrawal_charge_age_cap
        effect: parameter
        decides: c_capped
        bindings: [c_age_w, c_capped]
        ladder:
          - when: "the annuitant was aged cap_age_high or more on the withdrawal date"
            value: "MN(schedule-year percentage, K('cap_pct_high'))"
          - when: "the annuitant was aged senior_age or more but under cap_age_high on the withdrawal date"
            value: "MN(schedule-year percentage, K('cap_pct_mid'))"
          - when: "otherwise"
            value: "the schedule-year percentage"
        baseline:
          c_capped: "c_sched_pct"
        evidence: [date]
        cross_difficulty: null
      - id: withdrawal_charge_whole_life_relationship
        effect: parameter
        decides: c_rel_reduction
        bindings: [c_wl_inforce, c_wl_paid, c_rel_reduction]
        ladder:
          - when: "the owner holds an in-force Ashgrove whole life policy AND it shows at least rel_premium_count premium payments in the twelve months before the booking date"
            value: "K('rel_reduction_full')"
          - when: "the owner holds an in-force Ashgrove whole life policy AND it shows at least one but fewer than rel_premium_count such payments"
            value: "K('rel_reduction_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_rel_reduction: "0"
        evidence: [cross_category, history]
        cross_difficulty: whole
      - id: withdrawal_charge_grading
        effect: method
        decides: c_graded
        bindings: [c_months_left, c_graded]
        ladder:
          - when: "the annuitant was aged senior_age or more on the withdrawal date AND the withdrawal fell in one of the last closing_window_years schedule years"
            method: "graded monthly: the reduced percentage times the months left in that schedule year over twelve"
          - when: "the annuitant was under senior_age on the withdrawal date AND the withdrawal fell in one of those last schedule years"
            method: "graded quarterly: the reduced percentage times the quarters left in that schedule year over four"
          - when: "otherwise"
            method: "the reduced percentage applied as it stands"
        baseline:
          c_graded: "c_reduced"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: withdrawal_charge_late_correction_share
        effect: parameter
        decides: c_share
        bindings: [c_age_now, c_late_days, c_share]
        ladder:
          - when: "the correction is booked more than late_days days after the withdrawal date AND the annuitant is aged senior_age or more on the booking date"
            value: "K('late_share_senior')"
          - when: "the correction is booked more than late_days days after the withdrawal date AND the annuitant is under senior_age on the booking date"
            value: "K('late_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          c_share: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The corrected partial-withdrawal charge is worked out on the most recent excess partial withdrawal on the contract.
        Its free amount, where the withdrawal fell in contract year free_withdrawal_first_contract_year or later, is free_withdrawal_pct times the contract value on the contract anniversary that opened the withdrawal's contract year (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken earlier in that contract year, never below zero; where the withdrawal fell in an earlier contract year its free amount is nothing.
        Its excess is the withdrawal amount less that free amount, never below zero.
        Its charge percentage is the surrender_charge_ladder percentage for the schedule year in which the withdrawal was taken, which is the first-year percentage of the ladder less ladder_step for each schedule year completed since sc_schedule_start_date, and nothing once surrender_charge_years have passed, where the withdrawal fell in a renewal window, or where the contract has an approved nursing home or terminal illness waiver claim.
        The corrected partial-withdrawal charge is the excess times the charge percentage, rounded to the cent, and is booked as a deduction from the contract value.
      params: [free_withdrawal_pct, free_withdrawal_first_contract_year, surrender_charge_ladder, surrender_charge_years, ladder_step, renewal_window_days]
    inputs:
      history:
        - {table: fixed_transactions, aggregate: latest, field: amount, filters: {event_type: fixed_withdrawal_paid, withdrawal_type: excess_partial}}
        - {table: fixed_transactions, aggregate: sum, field: amount, filters: {event_type: fixed_withdrawal_paid}}
        - {table: fixed_transactions, aggregate: sum, field: amount, filters: {event_type: fixed_interest_credited}}
        - {category: whole, table: whole_transactions, aggregate: count, field: whole_txn_id, within_months: 12, filters: {event_type: whole_premium_paid}}
      cross_category: [whole]
  - id: fixed_ext_surrender_part_year_interest
    base_policy_refs: [fixed_interest_crediting, fixed_surrender]
    overwrite:
      - base_policy: fixed_interest_crediting
        superseded_clause: >-
          at the daily equivalent of the annual effective rate for actual calendar days
        replaced_by: >-
          Where the annuitant is aged senior_age or more on the handling date and the part year is at least convention_min_days days, the part-year surrender interest is simple interest, the contract value times the rate times the days over 365; where the annuitant is under senior_age and the part year is at least convention_min_days days, it is compounded daily at the nominal rate, the contract value times one plus the rate over 365 raised to the power of the days, less one; otherwise it is worked at the daily equivalent of the annual effective rate as the standard method states.
      - base_policy: fixed_interest_crediting
        superseded_clause: >-
          Each guarantee period earns the rate guaranteed for it
        replaced_by: >-
          The rate of the part-year surrender interest is the guaranteed rate plus the closing-years addition, plus the income annuity relationship addition, plus the withdrawal history adjustment, the three being added together once to the guaranteed rate.
      - base_policy: fixed_surrender
        superseded_clause: >-
          The surrender is effective on the date the signed request is received in good order; interest is credited to that date.
        replaced_by: >-
          Where the surrender is handled more than lag_long_days days after the signed request was received, the part year of the surrender interest runs through the handling date; where it is handled one to lag_long_days days after receipt, it runs through the day after the receipt date; where it is handled on the receipt date, it runs through the receipt date.
      - base_policy: fixed_interest_crediting
        superseded_clause: >-
          on the date of any withdrawal, surrender, death benefit payment or annuitization for the part year since the last crediting
        replaced_by: >-
          Where the surrender is handled more than lag_long_days days after the signed request was received, the part year of the surrender interest runs through the handling date; where it is handled one to lag_long_days days after receipt, it runs through the day after the receipt date; where it is handled on the receipt date, it runs through the receipt date.
    trigger: state_due
    subject: [fixed_interest_credited]
    computes: interest_amount
    target_tool: credit_surrender_interest_88d8dad0
    params:
      senior_age: 70
      closing_window_years: 3
      senior_closing_addition: 0.002
      closing_addition: 0.001
      income_payment_count: 12
      income_addition_full: 0.001
      income_addition_part: 0.0005
      history_months: 24
      no_withdrawal_addition: 0.001
      excess_withdrawal_adjustment: 0.001
      convention_min_days: 90
      lag_long_days: 2
    rule: >-
      When a full surrender is handled, the contract's interest is closed by crediting the part-year surrender interest, dated the day it is credited, to the contract value.
      The part-year surrender interest is worked out only after every excess partial withdrawal on the contract carries its surrender charge entry.
      The part-year surrender interest runs from the date of the contract's most recent interest credit through the date the signed surrender request was received, counted in actual calendar days.
      It is credited at the guaranteed rate of the current guarantee period.
      It is the contract value times the daily equivalent of that annual effective rate for those days, the contract value times one plus the rate raised to the power of the days over 365, less one, rounded to the cent.
      Where the surrender is handled more than lag_long_days days after the signed request was received, the part year of the surrender interest runs through the handling date; where it is handled one to lag_long_days days after receipt, it runs through the day after the receipt date; where it is handled on the receipt date, it runs through the receipt date.
      The closing-years addition to the part-year surrender interest rate is senior_closing_addition where the annuitant is aged senior_age or more on the handling date and the contract is in one of its last closing_window_years schedule years, closing_addition where the annuitant is under senior_age and the contract is in one of those last schedule years, and nothing otherwise.
      The income annuity relationship addition to the part-year surrender interest rate is income_addition_full where the owner has an Ashgrove income annuity in payout with at least income_payment_count installments issued in the twelve months before the handling date, income_addition_part where the owner has an Ashgrove income annuity in payout with at least one but fewer than income_payment_count such installments, and nothing otherwise.
      The withdrawal history adjustment to the part-year surrender interest rate is an addition of no_withdrawal_addition where no withdrawal other than a required minimum distribution was taken from the contract in the history_months months before the handling date, a deduction of excess_withdrawal_adjustment where an excess partial withdrawal was taken from the contract in those months, and nothing otherwise.
      The rate of the part-year surrender interest is the guaranteed rate plus the closing-years addition, plus the income annuity relationship addition, plus the withdrawal history adjustment, the three being added together once to the guaranteed rate.
      Where the annuitant is aged senior_age or more on the handling date and the part year is at least convention_min_days days, the part-year surrender interest is simple interest, the contract value times the rate times the days over 365; where the annuitant is under senior_age and the part year is at least convention_min_days days, it is compounded daily at the nominal rate, the contract value times one plus the rate over 365 raised to the power of the days, less one; otherwise it is worked at the daily equivalent of the annual effective rate as the standard method states.
      In every case the part-year surrender interest is rounded to the cent once, at the end; ages are whole years last birthday from the annuitant's date of birth and schedule years run from sc_schedule_start_date.
    prerequisite:
      - problem: fixed_ext_missed_withdrawal_charge
        kind: value_input
        gate: b_cv
        form: state
        policy_source: >-
          The part-year surrender interest is worked out only after every excess partial withdrawal on the contract carries its surrender charge entry.
        condition: >-
          Every withdrawal on the contract recorded as an excess partial withdrawal has a surrender charge entry for partial withdrawal under the same withdrawal request, and the contract value reflects that charge.
        resolved_by: assess_missed_withdrawal_charge_e9f9c059
        effect: >-
          Booking the missing partial-withdrawal charge lowers the contract value by the corrected charge, so the contract value the part-year surrender interest acts on (b_cv) falls by that amount and the interest falls with it.
    cross_category:
      - category: income
        as: history
        reads: [status, income_transactions.event_type, income_transactions.transaction_date]
        note: The income annuity relationship addition is decided from the owner's Ashgrove income annuity in payout and the count of installments issued to it in the last twelve months.
    compute:
      - b_cv: "F('contract_value')"
      - b_last: "LATEST('fixed_transactions', 'transaction_date', date_field='transaction_date', event_type='fixed_interest_credited')"
      - b_recv: "LATEST('fixed_service_requests', 'received_date', date_field='received_date', request_type='full_surrender')"
      - b_lag: "DAYS(b_recv, NOW)"
      - b_days: "DAYS(b_last, NOW) if b_lag > K('lag_long_days') else ((DAYS(b_last, b_recv) + 1) if b_lag >= 1 else DAYS(b_last, b_recv))"
      - b_sy: "MONTHS(F('sc_schedule_start_date'), NOW) // 12 + 1"
      - b_age: "MONTHS(F('annuitant_date_of_birth'), NOW) // 12"
      - b_closing_add: "K('senior_closing_addition') if (b_age >= K('senior_age') and b_sy > P('surrender_charge_years') - K('closing_window_years')) else (K('closing_addition') if (b_age < K('senior_age') and b_sy > P('surrender_charge_years') - K('closing_window_years')) else 0)"
      - b_ia_active: "EXISTS('income', status='income_active')"
      - b_ia_paid: "XCOUNT('income', 'income_transactions', within_months=12, date_field='transaction_date', event_type='income_payment_issued')"
      - b_income_add: "K('income_addition_full') if (b_ia_active and b_ia_paid >= K('income_payment_count')) else (K('income_addition_part') if (b_ia_active and b_ia_paid >= 1) else 0)"
      - b_nonrmd_w: "COUNT('fixed_transactions', within_months=K('history_months'), date_field='transaction_date', event_type='fixed_withdrawal_paid') - COUNT('fixed_transactions', within_months=K('history_months'), date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='rmd')"
      - b_excess_w: "COUNT('fixed_transactions', within_months=K('history_months'), date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='excess_partial')"
      - b_history_adj: "K('no_withdrawal_addition') if b_nonrmd_w == 0 else ((0 - K('excess_withdrawal_adjustment')) if b_excess_w > 0 else 0)"
      - b_rate: "F('guaranteed_rate') + b_closing_add + b_income_add + b_history_adj"
      - b_interest: "RND(b_cv * b_rate * b_days / 365, 2) if (b_age >= K('senior_age') and b_days >= K('convention_min_days')) else (RND(b_cv * ((1 + b_rate / 365) ** b_days - 1), 2) if (b_age < K('senior_age') and b_days >= K('convention_min_days')) else RND(b_cv * ((1 + b_rate) ** (b_days / 365) - 1), 2))"
      - result: "b_interest"
    compute_basis:
      b_cv: "It is the contract value times the daily equivalent of that annual effective rate for those days, the contract value times one plus the rate raised to the power of the days over 365, less one, rounded to the cent."
      b_last: "The part-year surrender interest runs from the date of the contract's most recent interest credit through the date the signed surrender request was received, counted in actual calendar days."
      b_recv: "The part-year surrender interest runs from the date of the contract's most recent interest credit through the date the signed surrender request was received, counted in actual calendar days."
      b_days: "Where the surrender is handled more than lag_long_days days after the signed request was received, the part year of the surrender interest runs through the handling date; where it is handled one to lag_long_days days after receipt, it runs through the day after the receipt date; where it is handled on the receipt date, it runs through the receipt date."
      b_closing_add: "The closing-years addition to the part-year surrender interest rate is senior_closing_addition where the annuitant is aged senior_age or more on the handling date and the contract is in one of its last closing_window_years schedule years, closing_addition where the annuitant is under senior_age and the contract is in one of those last schedule years, and nothing otherwise."
      b_income_add: "The income annuity relationship addition to the part-year surrender interest rate is income_addition_full where the owner has an Ashgrove income annuity in payout with at least income_payment_count installments issued in the twelve months before the handling date, income_addition_part where the owner has an Ashgrove income annuity in payout with at least one but fewer than income_payment_count such installments, and nothing otherwise."
      b_history_adj: "The withdrawal history adjustment to the part-year surrender interest rate is an addition of no_withdrawal_addition where no withdrawal other than a required minimum distribution was taken from the contract in the history_months months before the handling date, a deduction of excess_withdrawal_adjustment where an excess partial withdrawal was taken from the contract in those months, and nothing otherwise."
      b_rate: "The rate of the part-year surrender interest is the guaranteed rate plus the closing-years addition, plus the income annuity relationship addition, plus the withdrawal history adjustment, the three being added together once to the guaranteed rate."
      b_interest: "Where the annuitant is aged senior_age or more on the handling date and the part year is at least convention_min_days days, the part-year surrender interest is simple interest, the contract value times the rate times the days over 365; where the annuitant is under senior_age and the part year is at least convention_min_days days, it is compounded daily at the nominal rate, the contract value times one plus the rate over 365 raised to the power of the days, less one; otherwise it is worked at the daily equivalent of the annual effective rate as the standard method states."
      result: "In every case the part-year surrender interest is rounded to the cent once, at the end; ages are whole years last birthday from the annuitant's date of birth and schedule years run from sc_schedule_start_date."
    factors:
      - id: surrender_interest_end_date
        effect: method
        decides: b_days
        bindings: [b_lag, b_days]
        ladder:
          - when: "the surrender is handled more than lag_long_days days after the signed request was received"
            method: "the part year runs through the handling date"
          - when: "the surrender is handled one to lag_long_days days after receipt"
            method: "the part year runs through the day after the receipt date"
          - when: "otherwise"
            method: "the part year runs through the receipt date"
        baseline:
          b_days: "DAYS(b_last, b_recv)"
        evidence: [date]
        cross_difficulty: null
      - id: surrender_interest_closing_years_addition
        effect: parameter
        decides: b_closing_add
        bindings: [b_sy, b_closing_add]
        ladder:
          - when: "the annuitant is aged senior_age or more on the handling date AND the contract is in one of its last closing_window_years schedule years"
            value: "K('senior_closing_addition')"
          - when: "the annuitant is under senior_age on the handling date AND the contract is in one of those last schedule years"
            value: "K('closing_addition')"
          - when: "otherwise"
            value: "0"
        baseline:
          b_closing_add: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: surrender_interest_income_relationship
        effect: parameter
        decides: b_income_add
        bindings: [b_ia_active, b_ia_paid, b_income_add]
        ladder:
          - when: "the owner has an Ashgrove income annuity in payout AND at least income_payment_count installments were issued to it in the twelve months before the handling date"
            value: "K('income_addition_full')"
          - when: "the owner has an Ashgrove income annuity in payout AND at least one but fewer than income_payment_count installments were issued to it in those twelve months"
            value: "K('income_addition_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          b_income_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: income
      - id: surrender_interest_withdrawal_history
        effect: parameter
        decides: b_history_adj
        bindings: [b_nonrmd_w, b_excess_w, b_history_adj]
        ladder:
          - when: "no withdrawal other than a required minimum distribution was taken from the contract in the history_months months before the handling date"
            value: "K('no_withdrawal_addition')"
          - when: "an excess partial withdrawal was taken from the contract in those months"
            value: "0 - K('excess_withdrawal_adjustment')"
          - when: "otherwise"
            value: "0"
        baseline:
          b_history_adj: "0"
        evidence: [history]
        cross_difficulty: null
      - id: surrender_interest_convention
        effect: method
        decides: b_interest
        bindings: [b_age, b_interest]
        ladder:
          - when: "the annuitant is aged senior_age or more on the handling date AND the part year is at least convention_min_days days"
            method: "simple interest: the contract value times the rate times the days over 365"
          - when: "the annuitant is under senior_age on the handling date AND the part year is at least convention_min_days days"
            method: "daily compounding of the nominal rate: the contract value times one plus the rate over 365 raised to the power of the days, less one"
          - when: "otherwise"
            method: "the daily equivalent of the annual effective rate: the contract value times one plus the rate raised to the power of the days over 365, less one"
        baseline:
          b_interest: "RND(b_cv * ((1 + b_rate) ** (b_days / 365) - 1), 2)"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The part-year surrender interest runs from the date of the contract's most recent interest credit through the date the signed surrender request was received, counted in actual calendar days.
        It is credited at the guaranteed rate of the current guarantee period.
        It is the contract value times the daily equivalent of that annual effective rate for those days, the contract value times one plus the rate raised to the power of the days over 365, less one, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: fixed_transactions, aggregate: latest, field: transaction_date, filters: {event_type: fixed_interest_credited}}
        - {table: fixed_service_requests, aggregate: latest, field: received_date, filters: {request_type: full_surrender}}
        - {table: fixed_transactions, aggregate: count, field: fixed_txn_id, within_months: 24, filters: {event_type: fixed_withdrawal_paid}}
        - {category: income, table: income_transactions, aggregate: count, field: income_txn_id, within_months: 12, filters: {event_type: income_payment_issued}}
      cross_category: [income]
  - id: fixed_ext_surrender_value
    base_policy_refs: [fixed_surrender, fixed_sc_waivers, fixed_evt_withdrawal, fixed_evt_rmd_and_systematic, fixed_guarantee_period_renewal]
    overwrite:
      - base_policy: fixed_surrender
        superseded_clause: >-
          a surrender charge equal to the contract value less the remaining free withdrawal amount, times the surrender_charge_ladder percentage for the schedule year, rounded to the cent
        replaced_by: >-
          The surrender percentage is worked in this order: the schedule-year percentage is first capped, the capped percentage is then reduced for the whole life relationship, and the reduced percentage is then graded; the surrender charge is the contract value less the surrender free amount, never below zero, times the graded percentage, rounded to the cent; the cash surrender value is the contract value less that surrender charge and less any premium tax recovery, rounded to the cent.
      - base_policy: fixed_surrender
        superseded_clause: >-
          The cash surrender value is the contract value less a surrender charge
        replaced_by: >-
          On a full surrender of a contract issued in one of premium_tax_states, Ashgrove recovers the state premium tax on the premiums received, at qualified_premium_tax_rate of those premiums on an IRA contract and at nonqualified_premium_tax_rate of those premiums on a non-qualified contract, rounded to the cent; a contract issued in any other state bears no premium tax recovery.
      - base_policy: fixed_evt_withdrawal
        superseded_clause: >-
          withdrawals in a contract year up to free_withdrawal_pct of the contract value on the most recent contract anniversary
        replaced_by: >-
          The surrender free percentage is senior_free_pct where the annuitant was aged senior_age or more on the latest contract anniversary and the contract is in schedule year seasoned_schedule_year or later on the handling date, seasoned_free_pct where the annuitant was under senior_age on that anniversary and the contract is in schedule year seasoned_schedule_year or later, and free_withdrawal_pct otherwise.
      - base_policy: fixed_evt_rmd_and_systematic
        superseded_clause: >-
          and they count toward the free withdrawal amount for the contract year
        replaced_by: >-
          The withdrawals that reduce the surrender free amount are, on a traditional or SEP IRA contract with required minimum distribution withdrawals since the latest contract anniversary, every withdrawal since that anniversary except those required minimum distribution withdrawals; on any other contract with withdrawals since that anniversary under an approved surrender charge waiver, every withdrawal since that anniversary except the waiver withdrawals; and otherwise every withdrawal since that anniversary.
      - base_policy: fixed_surrender
        superseded_clause: >-
          The surrender is effective on the date the signed request is received in good order; interest is credited to that date.
        replaced_by: >-
          The surrender takes effect on the date it is handled, and the cash surrender value is worked out on that date.
      - base_policy: fixed_sc_waivers
        superseded_clause: >-
          A surrender charge waiver applies only under a waiver claim whose request status is approved.
        replaced_by: >-
          A full surrender is released free of surrender charge under a waiver only where a nursing home or terminal illness waiver claim on the contract was approved on or before the handling date; a surrender that relies on no waiver needs no waiver claim.
    trigger: on_request
    subject: [fixed_contract_surrendered, fixed_surrender_paid]
    computes: cash_surrender_value
    target_tool: confirm_full_surrender_fa1c6fc8
    params:
      senior_age: 70
      seasoned_schedule_year: 4
      senior_free_pct: 0.15
      seasoned_free_pct: 0.12
      ladder_step: 0.01
      cap_age_high: 75
      cap_pct_high: 0.02
      cap_pct_mid: 0.03
      rel_premium_count: 12
      rel_reduction_full: 0.005
      rel_reduction_part: 0.0025
      closing_window_years: 3
      premium_tax_states: [CA]
      qualified_premium_tax_rate: 0.005
      nonqualified_premium_tax_rate: 0.0235
    rule: >-
      A full surrender requested on a signed surrender request on file is released only when the owner, told the cash surrender value, confirms the surrender in person; the surrender then closes the contract and the cash surrender value is paid by the payout method the owner chooses.
      The cash surrender value is not fixed until the contract carries the part-year interest credited for the surrender.
      The surrender takes effect on the date it is handled, and the cash surrender value is worked out on that date.
      The surrender free amount, from contract year free_withdrawal_first_contract_year on, is free_withdrawal_pct times the contract value on the latest contract anniversary (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken since that anniversary, never below zero; in an earlier contract year it is nothing.
      The surrender charge percentage is the surrender_charge_ladder percentage for the current schedule year, which is the first-year percentage of the ladder less ladder_step for each schedule year completed since sc_schedule_start_date, and nothing once surrender_charge_years have passed, during a renewal window, or where the contract has an approved nursing home or terminal illness waiver claim.
      The surrender charge is the contract value less the surrender free amount, never below zero, times the surrender charge percentage, rounded to the cent.
      The cash surrender value is the contract value less the surrender charge, rounded to the cent.
      The surrender free percentage is senior_free_pct where the annuitant was aged senior_age or more on the latest contract anniversary and the contract is in schedule year seasoned_schedule_year or later on the handling date, seasoned_free_pct where the annuitant was under senior_age on that anniversary and the contract is in schedule year seasoned_schedule_year or later, and free_withdrawal_pct otherwise.
      The withdrawals that reduce the surrender free amount are, on a traditional or SEP IRA contract with required minimum distribution withdrawals since the latest contract anniversary, every withdrawal since that anniversary except those required minimum distribution withdrawals; on any other contract with withdrawals since that anniversary under an approved surrender charge waiver, every withdrawal since that anniversary except the waiver withdrawals; and otherwise every withdrawal since that anniversary.
      The schedule-year surrender percentage is capped at cap_pct_high where the annuitant is aged cap_age_high or more on the handling date, capped at cap_pct_mid where the annuitant is aged senior_age or more but under cap_age_high on the handling date, and left uncapped where the annuitant is under senior_age.
      The capped surrender percentage is reduced, never below zero, by rel_reduction_full where the owner holds an in-force Ashgrove whole life policy with at least rel_premium_count whole life premium payments in the twelve months before the handling date, by rel_reduction_part where the owner holds an in-force Ashgrove whole life policy with at least one but fewer than rel_premium_count such payments, and not at all otherwise.
      Where the annuitant is aged senior_age or more on the handling date and the contract is in one of its last closing_window_years schedule years, the reduced surrender percentage is graded monthly, multiplied by twelve less the whole months already completed in the current schedule year, over twelve; where the annuitant is under senior_age and the contract is in one of those last schedule years, it is graded quarterly, multiplied by the quarters left in the current schedule year (twelve less the completed months, divided by three and rounded up) over four; otherwise it is applied as it stands.
      On a full surrender of a contract issued in one of premium_tax_states, Ashgrove recovers the state premium tax on the premiums received, at qualified_premium_tax_rate of those premiums on an IRA contract and at nonqualified_premium_tax_rate of those premiums on a non-qualified contract, rounded to the cent; a contract issued in any other state bears no premium tax recovery.
      The surrender percentage is worked in this order: the schedule-year percentage is first capped, the capped percentage is then reduced for the whole life relationship, and the reduced percentage is then graded; the surrender charge is the contract value less the surrender free amount, never below zero, times the graded percentage, rounded to the cent; the cash surrender value is the contract value less that surrender charge and less any premium tax recovery, rounded to the cent.
      A full surrender is released free of surrender charge under a waiver only where a nursing home or terminal illness waiver claim on the contract was approved on or before the handling date; a surrender that relies on no waiver needs no waiver claim.
      Contract years run from the issue date and its anniversaries; schedule years run from sc_schedule_start_date; ages are whole years last birthday from the annuitant's date of birth.
    prerequisite:
      - problem: fixed_ext_surrender_part_year_interest
        kind: value_input
        gate: a_cv
        form: state
        policy_source: >-
          The cash surrender value is not fixed until the contract carries the part-year interest credited for the surrender.
        condition: >-
          The contract shows an interest credit entry dated on or after the received date of the signed full surrender request, and the contract value includes it.
        resolved_by: credit_surrender_interest_88d8dad0
        effect: >-
          Crediting the part-year surrender interest raises the contract value (a_cv) the surrender charge and the cash surrender value are worked from, so the cash surrender value rises by the interest less the extra charge on it.
    cross_category:
      - category: whole
        as: history
        reads: [status, whole_transactions.event_type, whole_transactions.transaction_date]
        note: The whole life relationship reduction of the surrender percentage is decided from the owner's in-force Ashgrove whole life policy and the count of its premium payments in the last twelve months.
    compute:
      - a_cv: "F('contract_value')"
      - a_sy: "MONTHS(F('sc_schedule_start_date'), NOW) // 12 + 1"
      - a_m_cy: "MONTHS(F('issue_date'), NOW) % 12"
      - a_cy_in: "SUM('fixed_transactions', 'amount', within_months=a_m_cy, date_field='transaction_date', event_type='fixed_interest_credited') + SUM('fixed_transactions', 'amount', within_months=a_m_cy, date_field='transaction_date', event_type='fixed_premium_received')"
      - a_cy_out: "SUM('fixed_transactions', 'amount', within_months=a_m_cy, date_field='transaction_date', event_type='fixed_withdrawal_paid') + SUM('fixed_transactions', 'amount', within_months=a_m_cy, date_field='transaction_date', event_type='fixed_surrender_charge_assessed')"
      - a_anniv_value: "RND(a_cv - a_cy_in + a_cy_out, 2)"
      - a_cy_w: "SUM('fixed_transactions', 'amount', within_months=a_m_cy, date_field='transaction_date', event_type='fixed_withdrawal_paid')"
      - a_cy_rmd_w: "SUM('fixed_transactions', 'amount', within_months=a_m_cy, date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='rmd')"
      - a_cy_waiver_w: "SUM('fixed_transactions', 'amount', within_months=a_m_cy, date_field='transaction_date', event_type='fixed_withdrawal_paid', withdrawal_type='waiver_partial')"
      - a_age_anniv: "(MONTHS(F('annuitant_date_of_birth'), NOW) - a_m_cy) // 12"
      - a_free_pct: "K('senior_free_pct') if (a_age_anniv >= K('senior_age') and a_sy >= K('seasoned_schedule_year')) else (K('seasoned_free_pct') if (a_age_anniv < K('senior_age') and a_sy >= K('seasoned_schedule_year')) else P('free_withdrawal_pct'))"
      - a_counted: "(a_cy_w - a_cy_rmd_w) if ((F('tax_qualification') == 'traditional_ira' or F('tax_qualification') == 'sep_ira') and a_cy_rmd_w > 0) else ((a_cy_w - a_cy_waiver_w) if a_cy_waiver_w > 0 else a_cy_w)"
      - a_cy: "MONTHS(F('issue_date'), NOW) // 12 + 1"
      - a_free_rem: "0 if a_cy < P('free_withdrawal_first_contract_year') else MX(0, RND(a_free_pct * (F('initial_premium') if a_cy == 1 else a_anniv_value), 2) - a_counted)"
      - a_gp_days: "DAYS(F('guarantee_period_end_date'), NOW)"
      - a_waivers: "COUNT('fixed_service_requests', request_status='approved', request_type='nursing_home_waiver_claim') + COUNT('fixed_service_requests', request_status='approved', request_type='terminal_illness_waiver_claim')"
      - a_sched_pct: "0 if (a_sy > P('surrender_charge_years') or (a_gp_days >= 1 and a_gp_days <= P('renewal_window_days')) or a_waivers > 0) else MX(0, MX(P('surrender_charge_ladder')) - K('ladder_step') * (a_sy - 1))"
      - a_age_now: "MONTHS(F('annuitant_date_of_birth'), NOW) // 12"
      - a_capped_pct: "MN(a_sched_pct, K('cap_pct_high')) if a_age_now >= K('cap_age_high') else (MN(a_sched_pct, K('cap_pct_mid')) if a_age_now >= K('senior_age') else a_sched_pct)"
      - a_wl_inforce: "EXISTS('whole', status='in_force')"
      - a_wl_paid: "XCOUNT('whole', 'whole_transactions', within_months=12, date_field='transaction_date', event_type='whole_premium_paid')"
      - a_rel_reduction: "K('rel_reduction_full') if (a_wl_inforce and a_wl_paid >= K('rel_premium_count')) else (K('rel_reduction_part') if (a_wl_inforce and a_wl_paid >= 1) else 0)"
      - a_reduced_pct: "MX(0, a_capped_pct - a_rel_reduction)"
      - a_months_left: "12 - MONTHS(F('sc_schedule_start_date'), NOW) % 12"
      - a_graded_pct: "a_reduced_pct * a_months_left / 12 if (a_age_now >= K('senior_age') and a_sy > P('surrender_charge_years') - K('closing_window_years')) else (a_reduced_pct * ((a_months_left + 2) // 3) / 4 if (a_age_now < K('senior_age') and a_sy > P('surrender_charge_years') - K('closing_window_years')) else a_reduced_pct)"
      - a_charge: "RND(MX(0, a_cv - a_free_rem) * a_graded_pct, 2)"
      - a_premiums: "SUM('fixed_transactions', 'amount', event_type='fixed_premium_received')"
      - a_ptax_rate: "K('qualified_premium_tax_rate') if (F('issue_state') in K('premium_tax_states') and F('tax_qualification') != 'non_qualified') else (K('nonqualified_premium_tax_rate') if (F('issue_state') in K('premium_tax_states') and F('tax_qualification') == 'non_qualified') else 0)"
      - a_ptax: "RND(a_premiums * a_ptax_rate, 2)"
      - result: "RND(a_cv - a_charge - a_ptax, 2)"
    compute_basis:
      a_cv: "The surrender takes effect on the date it is handled, and the cash surrender value is worked out on that date."
      a_anniv_value: "The surrender free amount, from contract year free_withdrawal_first_contract_year on, is free_withdrawal_pct times the contract value on the latest contract anniversary (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken since that anniversary, never below zero; in an earlier contract year it is nothing."
      a_cy_w: "The surrender free amount, from contract year free_withdrawal_first_contract_year on, is free_withdrawal_pct times the contract value on the latest contract anniversary (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken since that anniversary, never below zero; in an earlier contract year it is nothing."
      a_free_pct: "The surrender free percentage is senior_free_pct where the annuitant was aged senior_age or more on the latest contract anniversary and the contract is in schedule year seasoned_schedule_year or later on the handling date, seasoned_free_pct where the annuitant was under senior_age on that anniversary and the contract is in schedule year seasoned_schedule_year or later, and free_withdrawal_pct otherwise."
      a_counted: "The withdrawals that reduce the surrender free amount are, on a traditional or SEP IRA contract with required minimum distribution withdrawals since the latest contract anniversary, every withdrawal since that anniversary except those required minimum distribution withdrawals; on any other contract with withdrawals since that anniversary under an approved surrender charge waiver, every withdrawal since that anniversary except the waiver withdrawals; and otherwise every withdrawal since that anniversary."
      a_cy: "The surrender free amount, from contract year free_withdrawal_first_contract_year on, is free_withdrawal_pct times the contract value on the latest contract anniversary (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken since that anniversary, never below zero; in an earlier contract year it is nothing."
      a_free_rem: "The surrender free amount, from contract year free_withdrawal_first_contract_year on, is free_withdrawal_pct times the contract value on the latest contract anniversary (the initial premium in the first contract year), rounded to the cent, less every withdrawal taken since that anniversary, never below zero; in an earlier contract year it is nothing."
      a_sched_pct: "The surrender charge percentage is the surrender_charge_ladder percentage for the current schedule year, which is the first-year percentage of the ladder less ladder_step for each schedule year completed since sc_schedule_start_date, and nothing once surrender_charge_years have passed, during a renewal window, or where the contract has an approved nursing home or terminal illness waiver claim."
      a_capped_pct: "The schedule-year surrender percentage is capped at cap_pct_high where the annuitant is aged cap_age_high or more on the handling date, capped at cap_pct_mid where the annuitant is aged senior_age or more but under cap_age_high on the handling date, and left uncapped where the annuitant is under senior_age."
      a_rel_reduction: "The capped surrender percentage is reduced, never below zero, by rel_reduction_full where the owner holds an in-force Ashgrove whole life policy with at least rel_premium_count whole life premium payments in the twelve months before the handling date, by rel_reduction_part where the owner holds an in-force Ashgrove whole life policy with at least one but fewer than rel_premium_count such payments, and not at all otherwise."
      a_graded_pct: "Where the annuitant is aged senior_age or more on the handling date and the contract is in one of its last closing_window_years schedule years, the reduced surrender percentage is graded monthly, multiplied by twelve less the whole months already completed in the current schedule year, over twelve; where the annuitant is under senior_age and the contract is in one of those last schedule years, it is graded quarterly, multiplied by the quarters left in the current schedule year (twelve less the completed months, divided by three and rounded up) over four; otherwise it is applied as it stands."
      a_charge: "The surrender charge is the contract value less the surrender free amount, never below zero, times the surrender charge percentage, rounded to the cent."
      a_ptax_rate: "On a full surrender of a contract issued in one of premium_tax_states, Ashgrove recovers the state premium tax on the premiums received, at qualified_premium_tax_rate of those premiums on an IRA contract and at nonqualified_premium_tax_rate of those premiums on a non-qualified contract, rounded to the cent; a contract issued in any other state bears no premium tax recovery."
      result: "The surrender percentage is worked in this order: the schedule-year percentage is first capped, the capped percentage is then reduced for the whole life relationship, and the reduced percentage is then graded; the surrender charge is the contract value less the surrender free amount, never below zero, times the graded percentage, rounded to the cent; the cash surrender value is the contract value less that surrender charge and less any premium tax recovery, rounded to the cent."
    factors:
      - id: surrender_free_percentage
        effect: parameter
        decides: a_free_pct
        bindings: [a_age_anniv, a_free_pct]
        ladder:
          - when: "the annuitant was aged senior_age or more on the latest contract anniversary AND the contract is in schedule year seasoned_schedule_year or later"
            value: "K('senior_free_pct')"
          - when: "the annuitant was under senior_age on that anniversary AND the contract is in schedule year seasoned_schedule_year or later"
            value: "K('seasoned_free_pct')"
          - when: "otherwise"
            value: "P('free_withdrawal_pct')"
        baseline:
          a_free_pct: "P('free_withdrawal_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: surrender_free_amount_usage
        effect: method
        decides: a_counted
        bindings: [a_cy_rmd_w, a_cy_waiver_w, a_counted]
        ladder:
          - when: "a traditional or SEP IRA contract with required minimum distribution withdrawals since the latest contract anniversary"
            method: "every withdrawal since that anniversary except the required minimum distribution withdrawals reduces the surrender free amount"
          - when: "any other contract with withdrawals since that anniversary under an approved surrender charge waiver"
            method: "every withdrawal since that anniversary except the waiver withdrawals reduces the surrender free amount"
          - when: "otherwise"
            method: "every withdrawal since that anniversary reduces the surrender free amount"
        baseline:
          a_counted: "a_cy_w"
        evidence: [history]
        cross_difficulty: null
      - id: surrender_charge_age_cap
        effect: parameter
        decides: a_capped_pct
        bindings: [a_age_now, a_capped_pct]
        ladder:
          - when: "the annuitant is aged cap_age_high or more on the handling date"
            value: "MN(schedule-year surrender percentage, K('cap_pct_high'))"
          - when: "the annuitant is aged senior_age or more but under cap_age_high on the handling date"
            value: "MN(schedule-year surrender percentage, K('cap_pct_mid'))"
          - when: "otherwise"
            value: "the schedule-year surrender percentage"
        baseline:
          a_capped_pct: "a_sched_pct"
        evidence: [date]
        cross_difficulty: null
      - id: surrender_charge_whole_life_relationship
        effect: parameter
        decides: a_rel_reduction
        bindings: [a_wl_inforce, a_wl_paid, a_rel_reduction]
        ladder:
          - when: "the owner holds an in-force Ashgrove whole life policy AND it shows at least rel_premium_count premium payments in the twelve months before the handling date"
            value: "K('rel_reduction_full')"
          - when: "the owner holds an in-force Ashgrove whole life policy AND it shows at least one but fewer than rel_premium_count such payments"
            value: "K('rel_reduction_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_rel_reduction: "0"
        evidence: [cross_category, history]
        cross_difficulty: whole
      - id: surrender_charge_grading
        effect: method
        decides: a_graded_pct
        bindings: [a_months_left, a_graded_pct]
        ladder:
          - when: "the annuitant is aged senior_age or more on the handling date AND the contract is in one of its last closing_window_years schedule years"
            method: "graded monthly: the reduced surrender percentage times the months left in the current schedule year over twelve"
          - when: "the annuitant is under senior_age on the handling date AND the contract is in one of those last schedule years"
            method: "graded quarterly: the reduced surrender percentage times the quarters left in the current schedule year over four"
          - when: "otherwise"
            method: "the reduced surrender percentage applied as it stands"
        baseline:
