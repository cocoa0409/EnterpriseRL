  - id: fixed_ext_claim_renewal_rate
    base_policy_refs: [fixed_interest_crediting, fixed_guarantee_period_renewal, fixed_death_benefit]
    overwrite:
      - base_policy: fixed_guarantee_period_renewal
        superseded_clause: >-
          A renewal election must be received no later than the guarantee period end date plus renewal_window_days.
        replaced_by: >-
          A renewal election of a different guarantee period must be received no later than the guarantee period end date plus renewal_window_days; a renewal by default needs no election.
      - base_policy: fixed_interest_crediting
        superseded_clause: >-
          The rate for a new guarantee period is current_base_rate plus high_band_rate_addition when the premium (or, at renewal, the contract value on the renewal date) is at least high_band_threshold
        replaced_by: >-
          The default renewal rate is current_base_rate plus the renewal value band addition, plus the renewal persistency addition, plus the whole life relationship addition, the three being added together once to current_base_rate, and never below guaranteed_min_interest_rate, rounded to four decimal places.
    trigger: state_due
    subject: [fixed_guarantee_period_renewed]
    computes: renewal_rate
    target_tool: renew_guarantee_period_14f04954
    params:
      jumbo_threshold: 300000
      jumbo_addition: 0.003
      mid_threshold: 250000
      mid_addition: 0.002
      first_period_addition: 0.0015
      later_period_addition: 0.001
      rel_premium_count: 12
      rel_addition_full: 0.001
      rel_addition_part: 0.0005
    rule: >-
      A SecureRate contract whose guarantee period has ended without a renewal election renews by default into a new guarantee period of the same length, starting the day after the guarantee period end date, and the renewal is recorded with the default renewal rate.
      A renewal election of a different guarantee period must be received no later than the guarantee period end date plus renewal_window_days; a renewal by default needs no election.
      The default renewal rate is worked out from the renewal value, which is the contract value at the most recent interest credit grown at the expiring guaranteed rate, as a daily equivalent of that annual effective rate, for the actual calendar days from that credit to the renewal date, rounded to the cent.
      The default renewal rate is current_base_rate plus high_band_rate_addition where the renewal value is at least high_band_threshold, and current_base_rate alone otherwise, never below guaranteed_min_interest_rate, rounded to four decimal places.
      The renewal value band addition is jumbo_addition where the measured renewal value is at least jumbo_threshold, mid_addition where it is at least mid_threshold but under jumbo_threshold, high_band_rate_addition where it is at least high_band_threshold but under mid_threshold, and nothing where it is under high_band_threshold.
      The renewal value is measured, where the owner died before the renewal date, on the date of death, as the contract value at the most recent interest credit grown at the expiring guaranteed rate for the actual calendar days from that credit to the date of death; where the owner is living and an approved partial withdrawal request is waiting to be paid, as the renewal value less the amount that request asks for; and otherwise on the renewal date.
      The renewal persistency addition is first_period_addition where the expiring guarantee period was the first since issue and no withdrawal has ever been taken from the contract, later_period_addition where the expiring guarantee period followed an earlier renewal and no withdrawal was taken during it, and nothing otherwise.
      The whole life relationship addition to the default renewal rate is rel_addition_full where the owner has an Ashgrove whole life policy on record, whatever its current status, showing at least rel_premium_count premium payments in the twelve months before the renewal is recorded, rel_addition_part where the owner has an Ashgrove whole life policy on record, whatever its current status, showing at least one but fewer than rel_premium_count such payments, and nothing otherwise.
      The default renewal rate is current_base_rate plus the renewal value band addition, plus the renewal persistency addition, plus the whole life relationship addition, the three being added together once to current_base_rate, and never below guaranteed_min_interest_rate, rounded to four decimal places.
    prerequisite: []
    cross_category:
      - category: whole
        as: history
        reads: [whole_transactions.event_type, whole_transactions.transaction_date]
        note: The whole life relationship addition is decided from the owner's Ashgrove whole life policy and the count of its premium payments in the last twelve months.
    compute:
      - r_cv: "SUM('fixed_transactions', 'amount', event_type='fixed_premium_received') + SUM('fixed_transactions', 'amount', event_type='fixed_interest_credited') - SUM('fixed_transactions', 'amount', event_type='fixed_withdrawal_paid') - SUM('fixed_transactions', 'amount', event_type='fixed_surrender_charge_assessed') - SUM('fixed_transactions', 'amount', event_type='fixed_death_benefit_paid')"
      - r_last: "LATEST('fixed_transactions', 'transaction_date', date_field='transaction_date', event_type='fixed_interest_credited')"
      - r_days_renew: "DAYS(r_last, F('guarantee_period_end_date')) + 1"
      - r_value_renew: "RND(r_cv * (1 + F('guaranteed_rate')) ** (r_days_renew / 365), 2)"
      - r_dod: "LATEST('fixed_service_requests', 'owner_date_of_death', date_field='received_date', request_type='death_claim')"
      - r_dod_lead: "(DAYS(r_dod, F('guarantee_period_end_date')) + 1) if r_dod else 0"
      - r_waiting_w: "SUM('fixed_service_requests', 'requested_amount', request_type='partial_withdrawal', request_status='approved')"
      - r_measure: "RND(r_cv * (1 + F('guaranteed_rate')) ** (DAYS(r_last, r_dod) / 365), 2) if r_dod_lead > 0 else ((r_value_renew - r_waiting_w) if r_waiting_w > 0 else r_value_renew)"
      - r_band: "K('jumbo_addition') if r_measure >= K('jumbo_threshold') else (K('mid_addition') if r_measure >= K('mid_threshold') else (P('high_band_rate_addition') if r_measure >= P('high_band_threshold') else 0))"
      - r_first: "DAYS(F('issue_date'), F('sc_schedule_start_date')) == 0"
      - r_w_ever: "COUNT('fixed_transactions', event_type='fixed_withdrawal_paid')"
      - r_w_period: "COUNT('fixed_transactions', within_months=MONTHS(F('sc_schedule_start_date'), NOW) + 1, date_field='transaction_date', event_type='fixed_withdrawal_paid')"
      - r_persist: "K('first_period_addition') if (r_first and r_w_ever == 0) else (K('later_period_addition') if ((not r_first) and r_w_period == 0) else 0)"
      - r_wl_held: "EXISTS('whole')"
      - r_wl_paid: "XCOUNT('whole', 'whole_transactions', within_months=12, date_field='transaction_date', event_type='whole_premium_paid')"
      - r_rel: "K('rel_addition_full') if (r_wl_held and r_wl_paid >= K('rel_premium_count')) else (K('rel_addition_part') if (r_wl_held and r_wl_paid >= 1) else 0)"
      - result: "RND(MX(P('guaranteed_min_interest_rate'), P('current_base_rate') + r_band + r_persist + r_rel), 4)"
    compute_basis:
      r_cv: "The default renewal rate is worked out from the renewal value, which is the contract value at the most recent interest credit grown at the expiring guaranteed rate, as a daily equivalent of that annual effective rate, for the actual calendar days from that credit to the renewal date, rounded to the cent."
      r_last: "The default renewal rate is worked out from the renewal value, which is the contract value at the most recent interest credit grown at the expiring guaranteed rate, as a daily equivalent of that annual effective rate, for the actual calendar days from that credit to the renewal date, rounded to the cent."
      r_value_renew: "The default renewal rate is worked out from the renewal value, which is the contract value at the most recent interest credit grown at the expiring guaranteed rate, as a daily equivalent of that annual effective rate, for the actual calendar days from that credit to the renewal date, rounded to the cent."
      r_measure: "The renewal value is measured, where the owner died before the renewal date, on the date of death, as the contract value at the most recent interest credit grown at the expiring guaranteed rate for the actual calendar days from that credit to the date of death; where the owner is living and an approved partial withdrawal request is waiting to be paid, as the renewal value less the amount that request asks for; and otherwise on the renewal date."
      r_band: "The renewal value band addition is jumbo_addition where the measured renewal value is at least jumbo_threshold, mid_addition where it is at least mid_threshold but under jumbo_threshold, high_band_rate_addition where it is at least high_band_threshold but under mid_threshold, and nothing where it is under high_band_threshold."
      r_persist: "The renewal persistency addition is first_period_addition where the expiring guarantee period was the first since issue and no withdrawal has ever been taken from the contract, later_period_addition where the expiring guarantee period followed an earlier renewal and no withdrawal was taken during it, and nothing otherwise."
      r_rel: "The whole life relationship addition to the default renewal rate is rel_addition_full where the owner has an Ashgrove whole life policy on record, whatever its current status, showing at least rel_premium_count premium payments in the twelve months before the renewal is recorded, rel_addition_part where the owner has an Ashgrove whole life policy on record, whatever its current status, showing at least one but fewer than rel_premium_count such payments, and nothing otherwise."
      result: "The default renewal rate is current_base_rate plus the renewal value band addition, plus the renewal persistency addition, plus the whole life relationship addition, the three being added together once to current_base_rate, and never below guaranteed_min_interest_rate, rounded to four decimal places."
    factors:
      - id: renewal_value_band
        effect: parameter
        decides: r_band
        bindings: [r_days_renew, r_value_renew, r_band]
        ladder:
          - when: "the measured renewal value is at least jumbo_threshold"
            value: "K('jumbo_addition')"
          - when: "the measured renewal value is at least mid_threshold but under jumbo_threshold"
            value: "K('mid_addition')"
          - when: "the measured renewal value is at least high_band_threshold but under mid_threshold"
            value: "P('high_band_rate_addition')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_band: "P('high_band_rate_addition') if r_measure >= P('high_band_threshold') else 0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: renewal_value_measure_date
        effect: method
        decides: r_measure
        bindings: [r_dod, r_dod_lead, r_waiting_w, r_measure]
        ladder:
          - when: "the owner died before the renewal date"
            method: "the renewal value is measured on the date of death: the value at the most recent credit grown at the expiring rate to the date of death"
          - when: "the owner is living and an approved partial withdrawal request is waiting to be paid"
            method: "the renewal value less the amount that request asks for"
          - when: "otherwise"
            method: "the renewal value on the renewal date"
        baseline:
          r_measure: "r_value_renew"
        evidence: [date, history]
        cross_difficulty: null
      - id: renewal_persistency
        effect: parameter
        decides: r_persist
        bindings: [r_first, r_w_ever, r_w_period, r_persist]
        ladder:
          - when: "the expiring guarantee period was the first since issue AND no withdrawal has ever been taken"
            value: "K('first_period_addition')"
          - when: "the expiring guarantee period followed an earlier renewal AND no withdrawal was taken during it"
            value: "K('later_period_addition')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_persist: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: renewal_whole_life_relationship
        effect: parameter
        decides: r_rel
        bindings: [r_wl_held, r_wl_paid, r_rel]
        ladder:
          - when: "the owner has an Ashgrove whole life policy on record, whatever its status, AND it shows at least rel_premium_count premium payments in the twelve months before the renewal is recorded"
            value: "K('rel_addition_full')"
          - when: "the owner has an Ashgrove whole life policy on record, whatever its status, AND it shows at least one but fewer than rel_premium_count such payments"
            value: "K('rel_addition_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_rel: "0"
        evidence: [cross_category, history]
        cross_difficulty: whole
    baseline:
      rule: >-
        The default renewal rate is worked out from the renewal value, which is the contract value at the most recent interest credit grown at the expiring guaranteed rate, as a daily equivalent of that annual effective rate, for the actual calendar days from that credit to the renewal date, rounded to the cent.
        The default renewal rate is current_base_rate plus high_band_rate_addition where the renewal value is at least high_band_threshold, and current_base_rate alone otherwise, never below guaranteed_min_interest_rate, rounded to four decimal places.
      params: [current_base_rate, high_band_rate_addition, high_band_threshold, guaranteed_min_interest_rate]
    inputs:
      history:
        - {table: fixed_transactions, aggregate: sum, field: amount, filters: {event_type: fixed_interest_credited}}
        - {table: fixed_transactions, aggregate: latest, field: transaction_date, filters: {event_type: fixed_interest_credited}}
        - {table: fixed_transactions, aggregate: count, field: fixed_txn_id, filters: {event_type: fixed_withdrawal_paid}}
        - {category: whole, table: whole_transactions, aggregate: count, field: whole_txn_id, within_months: 12, filters: {event_type: whole_premium_paid}}
      cross_category: [whole]
  - id: fixed_ext_death_valuation_interest
    base_policy_refs: [fixed_interest_crediting, fixed_death_benefit]
    overwrite:
      - base_policy: fixed_death_benefit
        superseded_clause: >-
          the death benefit is the contract value on the date due proof of death is received
        replaced_by: >-
          The valuation date of the death benefit is, where a certified death certificate for the owner was received on an Ashgrove whole life claim before this contract's death claim was received, the date that certificate was received; where no such certificate exists and this contract's death claim was received more than late_claim_days days after the date of death, the date of death plus late_claim_days days; and otherwise the date this contract's death claim was received.
      - base_policy: fixed_interest_crediting
        superseded_clause: >-
          Each guarantee period earns the rate guaranteed for it
        replaced_by: >-
          The valuation value band addition, the valuation age addition and the income annuity relationship addition are added together once to each rate the death benefit valuation interest is worked at.
    trigger: state_due
    subject: [fixed_interest_credited]
    computes: interest_amount
    target_tool: credit_death_valuation_interest_0cf0ffa2
    params:
      late_claim_days: 365
      band_high_value: 300000
      band_high_addition: 0.001
      band_mid_value: 250000
      band_mid_addition: 0.0005
      senior_death_age: 80
      held_years: 2
      senior_age_addition: 0.001
      age_addition: 0.0005
      income_payment_count: 12
      income_addition_full: 0.001
      income_addition_part: 0.0005
    rule: >-
      When an owner's death is on file, the contract's death benefit is valued by crediting the death benefit valuation interest, dated the day it is credited and closing on the valuation date, to the contract value.
      The death benefit valuation interest is fixed only after the contract carries its renewed guaranteed rate for every guarantee period that ended before the valuation date.
      The death benefit valuation interest runs from the date of the contract's most recent interest credit through the date this contract's death claim was received, counted in actual calendar days.
      It is worked at the guaranteed rate of the current guarantee period, as the contract value times one plus that rate raised to the power of the days over 365, less one, rounded to the cent.
      The valuation date of the death benefit is, where a certified death certificate for the owner was received on an Ashgrove whole life claim before this contract's death claim was received, the date that certificate was received; where no such certificate exists and this contract's death claim was received more than late_claim_days days after the date of death, the date of death plus late_claim_days days; and otherwise the date this contract's death claim was received.
      Where a guarantee period ended within the valuation period and the valuation date falls within renewal_window_days days after the renewal date, the death benefit valuation interest is worked in two parts multiplied together: the days up to the renewal date at the expiring rate, which is the rate of the most recent interest credit, and the days from the renewal date at the current guaranteed rate; where a guarantee period ended within the valuation period, the owner died before the renewal date and the valuation date falls later than renewal_window_days days after the renewal date, every day is worked at the expiring rate; otherwise every day is worked at the current guaranteed rate.
      The valuation value band addition is band_high_addition where the contract value at the most recent interest credit is at least band_high_value, band_mid_addition where it is at least band_mid_value but under band_high_value, and nothing otherwise.
      The valuation age addition is senior_age_addition where the owner was aged senior_death_age or more at death and had held the contract for at least held_years whole years at death, age_addition where the owner was under senior_death_age at death and had held the contract for at least held_years whole years, and nothing otherwise.
      The income annuity relationship addition to the death benefit valuation interest is income_addition_full where the owner held an Ashgrove income annuity with at least income_payment_count installments issued in the twelve months before the valuation interest is credited, income_addition_part where the owner held an Ashgrove income annuity with at least one but fewer than income_payment_count such installments, and nothing otherwise.
      The valuation value band addition, the valuation age addition and the income annuity relationship addition are added together once to each rate the death benefit valuation interest is worked at.
      The death benefit valuation interest is rounded to the cent once, at the end; ages and years held are whole years counted to the date of death.
    prerequisite:
      - problem: fixed_ext_claim_renewal_rate
        kind: value_input
        gate: v_growth
        form: state
        policy_source: >-
          The death benefit valuation interest is fixed only after the contract carries its renewed guaranteed rate for every guarantee period that ended before the valuation date.
        condition: >-
          The contract's guarantee period end date is not earlier than the valuation date, its guaranteed rate is the rate of the renewed period, and its surrender charge schedule start date is the renewal date.
        resolved_by: renew_guarantee_period_14f04954
        effect: >-
          Recording the renewal sets the current guaranteed rate and the renewal date, so the days after the renewal date are worked at the renewed rate and the valuation growth factor (v_growth) changes.
    cross_category:
      - category: whole
        as: history
        reads: [whole_service_requests.received_date, whole_service_requests.request_type, whole_service_requests.death_certificate_received]
        note: The valuation date is moved to the date a certified death certificate was received on the owner's Ashgrove whole life claim when that came first.
      - category: income
        as: history
        reads: [income_transactions.event_type, income_transactions.transaction_date]
        note: The income annuity relationship addition is decided from the owner's Ashgrove income annuity and the count of installments issued in the last twelve months.
    compute:
      - v_cv: "F('contract_value')"
      - v_last: "LATEST('fixed_transactions', 'transaction_date', date_field='transaction_date', event_type='fixed_interest_credited')"
      - v_exp_rate: "LATEST('fixed_transactions', 'credited_rate', date_field='transaction_date', event_type='fixed_interest_credited')"
      - v_claim_recv: "LATEST('fixed_service_requests', 'received_date', date_field='received_date', request_type='death_claim')"
      - v_dod: "LATEST('fixed_service_requests', 'owner_date_of_death', date_field='received_date', request_type='death_claim')"
      - v_wl_cert: "XLATEST('whole', 'whole_service_requests', 'received_date', date_field='received_date', request_type='death_claim', death_certificate_received=True)"
      - v_end_days: "DAYS(v_last, v_wl_cert) if (v_wl_cert and DAYS(v_wl_cert or v_claim_recv, v_claim_recv) > 0) else ((DAYS(v_last, v_dod) + K('late_claim_days')) if ((not v_wl_cert) and DAYS(v_dod, v_claim_recv) > K('late_claim_days')) else DAYS(v_last, v_claim_recv))"
      - v_d1: "MN(v_end_days, MX(0, DAYS(v_last, F('sc_schedule_start_date'))))"
      - v_d2: "v_end_days - v_d1"
      - v_value_sum: "SUM('fixed_transactions', 'amount', event_type='fixed_premium_received') + SUM('fixed_transactions', 'amount', event_type='fixed_interest_credited') - SUM('fixed_transactions', 'amount', event_type='fixed_withdrawal_paid') - SUM('fixed_transactions', 'amount', event_type='fixed_surrender_charge_assessed') - SUM('fixed_transactions', 'amount', event_type='fixed_death_benefit_paid')"
      - v_band_add: "K('band_high_addition') if v_value_sum >= K('band_high_value') else (K('band_mid_addition') if v_value_sum >= K('band_mid_value') else 0)"
      - v_age_death: "MONTHS(F('annuitant_date_of_birth'), v_dod) // 12"
      - v_held: "MONTHS(F('issue_date'), v_dod) // 12"
      - v_age_add: "K('senior_age_addition') if (v_age_death >= K('senior_death_age') and v_held >= K('held_years')) else (K('age_addition') if (v_age_death < K('senior_death_age') and v_held >= K('held_years')) else 0)"
      - v_ia_held: "EXISTS('income')"
      - v_ia_paid: "XCOUNT('income', 'income_transactions', within_months=12, date_field='transaction_date', event_type='income_payment_issued')"
      - v_inc_add: "K('income_addition_full') if (v_ia_held and v_ia_paid >= K('income_payment_count')) else (K('income_addition_part') if (v_ia_held and v_ia_paid >= 1) else 0)"
      - v_adds: "v_band_add + v_age_add + v_inc_add"
      - v_growth: "((1 + v_exp_rate + v_adds) ** (v_d1 / 365)) * ((1 + F('guaranteed_rate') + v_adds) ** (v_d2 / 365)) if (v_d1 > 0 and v_d2 > 0 and v_d2 <= P('renewal_window_days')) else (((1 + v_exp_rate + v_adds) ** (v_end_days / 365)) if (v_d1 > 0 and v_d2 > P('renewal_window_days') and DAYS(v_dod, F('sc_schedule_start_date')) > 0) else ((1 + F('guaranteed_rate') + v_adds) ** (v_end_days / 365)))"
      - result: "RND(v_cv * (v_growth - 1), 2)"
    compute_basis:
      v_last: "The death benefit valuation interest runs from the date of the contract's most recent interest credit through the date this contract's death claim was received, counted in actual calendar days."
      v_claim_recv: "The death benefit valuation interest runs from the date of the contract's most recent interest credit through the date this contract's death claim was received, counted in actual calendar days."
      v_end_days: "The valuation date of the death benefit is, where a certified death certificate for the owner was received on an Ashgrove whole life claim before this contract's death claim was received, the date that certificate was received; where no such certificate exists and this contract's death claim was received more than late_claim_days days after the date of death, the date of death plus late_claim_days days; and otherwise the date this contract's death claim was received."
      v_d1: "Where a guarantee period ended within the valuation period and the valuation date falls within renewal_window_days days after the renewal date, the death benefit valuation interest is worked in two parts multiplied together: the days up to the renewal date at the expiring rate, which is the rate of the most recent interest credit, and the days from the renewal date at the current guaranteed rate; where a guarantee period ended within the valuation period, the owner died before the renewal date and the valuation date falls later than renewal_window_days days after the renewal date, every day is worked at the expiring rate; otherwise every day is worked at the current guaranteed rate."
      v_band_add: "The valuation value band addition is band_high_addition where the contract value at the most recent interest credit is at least band_high_value, band_mid_addition where it is at least band_mid_value but under band_high_value, and nothing otherwise."
      v_age_add: "The valuation age addition is senior_age_addition where the owner was aged senior_death_age or more at death and had held the contract for at least held_years whole years at death, age_addition where the owner was under senior_death_age at death and had held the contract for at least held_years whole years, and nothing otherwise."
      v_inc_add: "The income annuity relationship addition to the death benefit valuation interest is income_addition_full where the owner held an Ashgrove income annuity with at least income_payment_count installments issued in the twelve months before the valuation interest is credited, income_addition_part where the owner held an Ashgrove income annuity with at least one but fewer than income_payment_count such installments, and nothing otherwise."
      v_adds: "The valuation value band addition, the valuation age addition and the income annuity relationship addition are added together once to each rate the death benefit valuation interest is worked at."
      v_growth: "Where a guarantee period ended within the valuation period and the valuation date falls within renewal_window_days days after the renewal date, the death benefit valuation interest is worked in two parts multiplied together: the days up to the renewal date at the expiring rate, which is the rate of the most recent interest credit, and the days from the renewal date at the current guaranteed rate; where a guarantee period ended within the valuation period, the owner died before the renewal date and the valuation date falls later than renewal_window_days days after the renewal date, every day is worked at the expiring rate; otherwise every day is worked at the current guaranteed rate."
      result: "It is worked at the guaranteed rate of the current guarantee period, as the contract value times one plus that rate raised to the power of the days over 365, less one, rounded to the cent."
    factors:
      - id: valuation_date_source
        effect: method
        decides: v_end_days
        bindings: [v_wl_cert, v_end_days]
        ladder:
          - when: "a certified death certificate for the owner was received on an Ashgrove whole life claim AND it came before this contract's death claim"
            method: "the valuation period runs to the date that certificate was received"
          - when: "no such certificate exists AND this contract's death claim came more than late_claim_days days after the date of death"
            method: "the valuation period runs to the date of death plus late_claim_days days"
          - when: "otherwise"
            method: "the valuation period runs to the date this contract's death claim was received"
        baseline:
          v_end_days: "DAYS(v_last, v_claim_recv)"
        evidence: [cross_category, date]
        cross_difficulty: whole
      - id: valuation_rate_split
        effect: method
        decides: v_growth
        bindings: [v_d1, v_d2, v_growth]
        ladder:
          - when: "a guarantee period ended within the valuation period AND the valuation date is within renewal_window_days days after the renewal date"
            method: "two parts multiplied: days to the renewal date at the expiring rate, days from it at the current guaranteed rate"
          - when: "a guarantee period ended within the valuation period AND the owner died before the renewal date AND the valuation date is later than renewal_window_days days after the renewal date"
            method: "every day at the expiring rate"
          - when: "otherwise"
            method: "every day at the current guaranteed rate"
        baseline:
          v_growth: "(1 + F('guaranteed_rate') + v_adds) ** (v_end_days / 365)"
        evidence: [date, history]
        cross_difficulty: null
      - id: valuation_value_band
        effect: parameter
        decides: v_band_add
        bindings: [v_value_sum, v_band_add]
        ladder:
          - when: "the contract value at the most recent interest credit is at least band_high_value"
            value: "K('band_high_addition')"
          - when: "it is at least band_mid_value but under band_high_value"
            value: "K('band_mid_addition')"
          - when: "otherwise"
            value: "0"
        baseline:
          v_band_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: valuation_age_addition
        effect: parameter
        decides: v_age_add
        bindings: [v_age_death, v_held, v_age_add]
        ladder:
          - when: "the owner was aged senior_death_age or more at death AND had held the contract at least held_years whole years"
            value: "K('senior_age_addition')"
          - when: "the owner was under senior_death_age at death AND had held the contract at least held_years whole years"
            value: "K('age_addition')"
          - when: "otherwise"
            value: "0"
        baseline:
          v_age_add: "0"
        evidence: [date]
        cross_difficulty: null
      - id: valuation_income_relationship
        effect: parameter
        decides: v_inc_add
        bindings: [v_ia_held, v_ia_paid, v_inc_add]
        ladder:
          - when: "the owner held an Ashgrove income annuity AND at least income_payment_count installments were issued to it in the twelve months before the credit"
            value: "K('income_addition_full')"
          - when: "the owner held an Ashgrove income annuity AND at least one but fewer than income_payment_count such installments were issued"
            value: "K('income_addition_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          v_inc_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: income
    baseline:
      rule: >-
        The death benefit valuation interest runs from the date of the contract's most recent interest credit through the date this contract's death claim was received, counted in actual calendar days.
        It is worked at the guaranteed rate of the current guarantee period, as the contract value times one plus that rate raised to the power of the days over 365, less one, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: fixed_transactions, aggregate: latest, field: transaction_date, filters: {event_type: fixed_interest_credited}}
        - {table: fixed_service_requests, aggregate: latest, field: received_date, filters: {request_type: death_claim}}
        - {category: whole, table: whole_service_requests, aggregate: latest, field: received_date, filters: {request_type: death_claim}}
        - {category: income, table: income_transactions, aggregate: count, field: income_txn_id, within_months: 12, filters: {event_type: income_payment_issued}}
      cross_category: [whole, income]
  - id: fixed_ext_death_claim_settlement
    base_policy_refs: [fixed_death_benefit, fixed_beneficiary_designation]
    overwrite:
      - base_policy: fixed_death_benefit
        superseded_clause: >-
          Interest is added at death_claim_interest_rate, simple, for actual calendar days from the date due proof is received to payment, over 365, rounded to the cent.
        replaced_by: >-
          The death claim interest rate is the claim interest base rate plus the late settlement addition plus the earlier-claim coordination addition, the three being added together once, and the death claim interest is the claimant's share times that rate times the interest days over the day-count divisor, simple, rounded to the cent once at the end.
    trigger: on_request
    subject: [fixed_death_benefit_paid]
    computes: claim_interest
    target_tool: settle_death_benefit_share_569ae0ca
    params:
      dod_interest_states: [CA, NY, NJ]
      beneficiary_delay_days: 10
      delayed_days: 45
      prompt_days: 30
      delayed_rate: 0.05
      prompt_rate: 0.04
      approval_days: 30
      prompt_pay_states: [FL, GA, TX]
      prompt_pay_addition: 0.02
      late_addition: 0.01
      coordination_days: 30
      coordination_addition_late: 0.005
      coordination_addition: 0.0025
      check_mail_days: 3
      transfer_days: 1
      actual_360_states: [VA, MD]
    rule: >-
      A beneficiary who elects a lump sum is paid, on the day of the election, the claimant's share of the death benefit with the death claim interest on it, by the payout method the beneficiary chooses; the shares of other beneficiaries stay on the contract.
      A beneficiary's death benefit share is not paid until the contract carries the valuation interest credited through the valuation date of the death benefit.
      The death benefit is the contract value once that valuation interest is credited.
      The claimant's share is the claimant's share percent in the beneficiary designation, times the death benefit, rounded to the cent; where a primary beneficiary named in the designation died before the owner, as shown by an Ashgrove death claim on a policy insuring that beneficiary, that beneficiary's share passes to the surviving primaries pro rata, so a surviving primary's share percent is divided by one hundred less the predeceased share percent and multiplied by one hundred.
      The death claim interest runs from the valuation date, which is the date the valuation interest closed on, to the payment date, in actual calendar days.
      It is the claimant's share times death_claim_interest_rate times those days over 365, simple, rounded to the cent.
      Where the contract was issued in one of dod_interest_states, the death claim interest runs from the owner's date of death; where it was issued elsewhere and this contract's death claim was received more than beneficiary_delay_days days after the valuation date, it runs from the date the death claim was received; otherwise it runs from the valuation date.
      The claim interest base rate is delayed_rate where payment is made more than delayed_days days after the valuation date, prompt_rate where payment is made more than prompt_days but no more than delayed_days days after the valuation date, and death_claim_interest_rate otherwise.
      The late settlement addition is prompt_pay_addition where payment is made more than approval_days days after the death claim was approved and the contract was issued in one of prompt_pay_states, late_addition where payment is made more than approval_days days after approval and the contract was issued in any other state, and nothing otherwise.
      The earlier-claim coordination addition is coordination_addition_late where Ashgrove paid a death benefit on the owner's whole life policy more than coordination_days days before this payment, coordination_addition where it paid one within coordination_days days before this payment, and nothing otherwise.
      The interest days are extended past the payment date by check_mail_days days where the claimant asked to be paid by check, by transfer_days days where the claimant asked for a transfer to another financial company, and not at all for a direct deposit.
      The day-count divisor of the death claim interest is 360 where the contract was issued in one of actual_360_states, 366 where it was issued elsewhere and the payment falls in a leap year, and 365 otherwise.
      The death claim interest rate is the claim interest base rate plus the late settlement addition plus the earlier-claim coordination addition, the three being added together once, and the death claim interest is the claimant's share times that rate times the interest days over the day-count divisor, simple, rounded to the cent once at the end.
    prerequisite:
      - problem: fixed_ext_death_valuation_interest
        kind: value_input
        gate: s_db
        form: state
        policy_source: >-
          A beneficiary's death benefit share is not paid until the contract carries the valuation interest credited through the valuation date of the death benefit.
        condition: >-
          The contract shows an interest credit entry whose interest period closes on the valuation date of the death benefit, credited after the owner's death claim was received, and the contract value includes it.
        resolved_by: credit_death_valuation_interest_0cf0ffa2
        effect: >-
          Crediting the valuation interest raises the contract value, which is the death benefit (s_db), and records the valuation date the death claim interest runs from, so the claimant's share and the interest on it change.
    cross_category:
      - category: term
        as: branch
        reads: [insured_name, status, term_service_requests.insured_date_of_death]
        note: A co-primary beneficiary's death before the owner is read from the death claim on the Ashgrove term policy insuring that beneficiary, which reallocates the shares.
      - category: whole
        as: history
        reads: [whole_transactions.event_type, whole_transactions.transaction_date]
        note: The earlier-claim coordination addition is decided from the date Ashgrove paid the death benefit on the owner's whole life policy.
    compute:
      - s_db: "SUM('fixed_transactions', 'amount', event_type='fixed_premium_received') + SUM('fixed_transactions', 'amount', event_type='fixed_interest_credited') - SUM('fixed_transactions', 'amount', event_type='fixed_withdrawal_paid') - SUM('fixed_transactions', 'amount', event_type='fixed_surrender_charge_assessed') - SUM('fixed_transactions', 'amount', event_type='fixed_death_benefit_paid')"
      - s_claimant: "LATEST('fixed_service_requests', 'claimant_name', date_field='received_date', request_type='death_claim')"
      - s_dod: "LATEST('fixed_service_requests', 'owner_date_of_death', date_field='received_date', request_type='death_claim')"
      - s_own_share: "LATEST('fixed_transactions', 'share_percent', date_field='designation_effective_date', event_type='fixed_beneficiary_designated', beneficiary_name=s_claimant) or 0"
      - s_pre_name: "CFIELD('term', 'insured_name', status='claim_paid')"
      - s_pre_dod: "XLATEST('term', 'term_service_requests', 'insured_date_of_death', date_field='received_date', request_type='death_claim')"
      - s_pre_share: "LATEST('fixed_transactions', 'share_percent', date_field='designation_effective_date', event_type='fixed_beneficiary_designated', beneficiary_class='primary', beneficiary_name=s_pre_name) or 0"
      - s_share_pct: "(s_own_share * 100 / (100 - s_pre_share)) if (s_pre_share > 0 and s_pre_share < 100 and DAYS(s_pre_dod or s_dod, s_dod) > 0) else s_own_share"
      - s_share_amt: "RND(s_db * s_share_pct / 100, 2)"
      - s_val: "LATEST('fixed_transactions', 'interest_period_end', date_field='transaction_date', event_type='fixed_interest_credited')"
      - s_claim_recv: "LATEST('fixed_service_requests', 'received_date', date_field='received_date', request_type='death_claim')"
      - s_start_days: "DAYS(s_dod, NOW) if (F('issue_state') in K('dod_interest_states')) else (DAYS(s_claim_recv, NOW) if ((F('issue_state') not in K('dod_interest_states')) and DAYS(s_val, s_claim_recv) > K('beneficiary_delay_days')) else DAYS(s_val, NOW))"
      - s_proof_lag: "DAYS(s_val, NOW)"
      - s_rate: "K('delayed_rate') if s_proof_lag > K('delayed_days') else (K('prompt_rate') if s_proof_lag > K('prompt_days') else P('death_claim_interest_rate'))"
      - s_approved: "LATEST('fixed_service_requests', 'decision_date', date_field='received_date', request_type='death_claim')"
      - s_approval_lag: "DAYS(s_approved, NOW)"
      - s_late: "K('prompt_pay_addition') if (s_approval_lag > K('approval_days') and F('issue_state') in K('prompt_pay_states')) else (K('late_addition') if (s_approval_lag > K('approval_days') and F('issue_state') not in K('prompt_pay_states')) else 0)"
      - s_wl_paid_on: "XLATEST('whole', 'whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_death_benefit_disbursed')"
      - s_coord: "K('coordination_addition_late') if (s_wl_paid_on and DAYS(s_wl_paid_on or NOW, NOW) > K('coordination_days')) else (K('coordination_addition') if (s_wl_paid_on and DAYS(s_wl_paid_on or NOW, NOW) <= K('coordination_days')) else 0)"
      - s_method: "LATEST('fixed_service_requests', 'disbursement_method', date_field='received_date', request_type='death_claim')"
      - s_end_extra: "K('check_mail_days') if s_method == 'check' else (K('transfer_days') if s_method == 'company_transfer' else 0)"
      - s_year: "MONTHS('2000-01-01', NOW) // 12 + 2000"
      - s_divisor: "360 if F('issue_state') in K('actual_360_states') else (366 if s_year % 4 == 0 else 365)"
      - s_days: "s_start_days + s_end_extra"
      - result: "RND(s_share_amt * (s_rate + s_late + s_coord) * s_days / s_divisor, 2)"
    compute_basis:
      s_db: "The death benefit is the contract value once that valuation interest is credited."
      s_own_share: "The claimant's share is the claimant's share percent in the beneficiary designation, times the death benefit, rounded to the cent; where a primary beneficiary named in the designation died before the owner, as shown by an Ashgrove death claim on a policy insuring that beneficiary, that beneficiary's share passes to the surviving primaries pro rata, so a surviving primary's share percent is divided by one hundred less the predeceased share percent and multiplied by one hundred."
      s_pre_name: "The claimant's share is the claimant's share percent in the beneficiary designation, times the death benefit, rounded to the cent; where a primary beneficiary named in the designation died before the owner, as shown by an Ashgrove death claim on a policy insuring that beneficiary, that beneficiary's share passes to the surviving primaries pro rata, so a surviving primary's share percent is divided by one hundred less the predeceased share percent and multiplied by one hundred."
      s_share_pct: "The claimant's share is the claimant's share percent in the beneficiary designation, times the death benefit, rounded to the cent; where a primary beneficiary named in the designation died before the owner, as shown by an Ashgrove death claim on a policy insuring that beneficiary, that beneficiary's share passes to the surviving primaries pro rata, so a surviving primary's share percent is divided by one hundred less the predeceased share percent and multiplied by one hundred."
      s_val: "The death claim interest runs from the valuation date, which is the date the valuation interest closed on, to the payment date, in actual calendar days."
      s_start_days: "Where the contract was issued in one of dod_interest_states, the death claim interest runs from the owner's date of death; where it was issued elsewhere and this contract's death claim was received more than beneficiary_delay_days days after the valuation date, it runs from the date the death claim was received; otherwise it runs from the valuation date."
      s_rate: "The claim interest base rate is delayed_rate where payment is made more than delayed_days days after the valuation date, prompt_rate where payment is made more than prompt_days but no more than delayed_days days after the valuation date, and death_claim_interest_rate otherwise."
      s_late: "The late settlement addition is prompt_pay_addition where payment is made more than approval_days days after the death claim was approved and the contract was issued in one of prompt_pay_states, late_addition where payment is made more than approval_days days after approval and the contract was issued in any other state, and nothing otherwise."
      s_coord: "The earlier-claim coordination addition is coordination_addition_late where Ashgrove paid a death benefit on the owner's whole life policy more than coordination_days days before this payment, coordination_addition where it paid one within coordination_days days before this payment, and nothing otherwise."
      s_end_extra: "The interest days are extended past the payment date by check_mail_days days where the claimant asked to be paid by check, by transfer_days days where the claimant asked for a transfer to another financial company, and not at all for a direct deposit."
      s_divisor: "The day-count divisor of the death claim interest is 360 where the contract was issued in one of actual_360_states, 366 where it was issued elsewhere and the payment falls in a leap year, and 365 otherwise."
      result: "The death claim interest rate is the claim interest base rate plus the late settlement addition plus the earlier-claim coordination addition, the three being added together once, and the death claim interest is the claimant's share times that rate times the interest days over the day-count divisor, simple, rounded to the cent once at the end."
    factors:
      - id: claim_interest_start
        effect: method
        decides: s_start_days
        bindings: [s_claim_recv, s_start_days]
        ladder:
          - when: "the contract was issued in one of dod_interest_states"
            method: "interest runs from the owner's date of death"
          - when: "the contract was issued elsewhere AND the death claim was received more than beneficiary_delay_days days after the valuation date"
            method: "interest runs from the date the death claim was received"
          - when: "otherwise"
            method: "interest runs from the valuation date"
        baseline:
          s_start_days: "DAYS(s_val, NOW)"
        evidence: [date, history]
        cross_difficulty: null
      - id: claim_interest_base_rate
        effect: parameter
        decides: s_rate
        bindings: [s_proof_lag, s_rate]
        ladder:
          - when: "payment is made more than delayed_days days after the valuation date"
            value: "K('delayed_rate')"
          - when: "payment is made more than prompt_days but no more than delayed_days days after the valuation date"
            value: "K('prompt_rate')"
          - when: "otherwise"
            value: "P('death_claim_interest_rate')"
        baseline:
          s_rate: "P('death_claim_interest_rate')"
        evidence: [date]
        cross_difficulty: null
      - id: claim_late_settlement_addition
        effect: parameter
        decides: s_late
        bindings: [s_approved, s_approval_lag, s_late]
        ladder:
          - when: "payment is made more than approval_days days after the claim was approved AND the contract was issued in one of prompt_pay_states"
            value: "K('prompt_pay_addition')"
          - when: "payment is made more than approval_days days after approval AND the contract was issued in any other state"
            value: "K('late_addition')"
          - when: "otherwise"
            value: "0"
        baseline:
          s_late: "0"
        evidence: [date]
        cross_difficulty: null
      - id: claim_earlier_claim_coordination
        effect: parameter
        decides: s_coord
        bindings: [s_wl_paid_on, s_coord]
        ladder:
          - when: "Ashgrove paid a death benefit on the owner's whole life policy AND it did so more than coordination_days days before this payment"
            value: "K('coordination_addition_late')"
          - when: "Ashgrove paid a death benefit on the owner's whole life policy AND it did so within coordination_days days before this payment"
            value: "K('coordination_addition')"
          - when: "otherwise"
            value: "0"
        baseline:
          s_coord: "0"
        evidence: [cross_category, date]
        cross_difficulty: whole
      - id: claim_interest_end_extension
        effect: parameter
        decides: s_end_extra
        bindings: [s_method, s_end_extra]
        ladder:
          - when: "the claimant asked to be paid by check"
            value: "K('check_mail_days')"
          - when: "the claimant asked for a transfer to another financial company"
            value: "K('transfer_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          s_end_extra: "0"
        evidence: [history]
        cross_difficulty: null
      - id: claim_interest_day_count
        effect: parameter
        decides: s_divisor
        bindings: [s_year, s_divisor]
        ladder:
          - when: "the contract was issued in one of actual_360_states"
            value: "360"
          - when: "the contract was issued elsewhere and the payment falls in a leap year"
            value: "366"
          - when: "otherwise"
            value: "365"
        baseline:
          s_divisor: "365"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The death benefit is the contract value once that valuation interest is credited.
        The claimant's share is the claimant's share percent in the beneficiary designation, times the death benefit, rounded to the cent; where a primary beneficiary named in the designation died before the owner, as shown by an Ashgrove death claim on a policy insuring that beneficiary, that beneficiary's share passes to the surviving primaries pro rata, so a surviving primary's share percent is divided by one hundred less the predeceased share percent and multiplied by one hundred.
        The death claim interest runs from the valuation date, which is the date the valuation interest closed on, to the payment date, in actual calendar days.
        It is the claimant's share times death_claim_interest_rate times those days over 365, simple, rounded to the cent.
      params: [death_claim_interest_rate]
    inputs:
      history:
        - {table: fixed_transactions, aggregate: sum, field: amount, filters: {event_type: fixed_interest_credited}}
        - {table: fixed_transactions, aggregate: latest, field: share_percent, filters: {event_type: fixed_beneficiary_designated}}
        - {table: fixed_service_requests, aggregate: latest, field: decision_date, filters: {request_type: death_claim}}
        - {category: whole, table: whole_transactions, aggregate: latest, field: transaction_date, filters: {event_type: whole_death_benefit_disbursed}}
        - {category: term, table: term_service_requests, aggregate: latest, field: insured_date_of_death, filters: {request_type: death_claim}}
