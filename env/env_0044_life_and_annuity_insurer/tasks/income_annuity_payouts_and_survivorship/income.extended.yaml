        ladder:
          - when: "the contract was issued in Iowa, Minnesota, North Carolina or Vermont, federal tax is withheld from the arrears installment and federal tax was withheld from the contract's installments falling due in the twelve months before the payment date"
            value: "K('state_flat_rate') of the taxable part"
          - when: "the contract was issued in Delaware, New York or Oklahoma, federal tax is withheld from the arrears installment and federal tax was withheld from the contract's installments falling due in the twelve months before the payment date"
            value: "K('state_alt_rate') of the taxable part"
          - when: "otherwise"
            value: "0 — no state tax"
        baseline:
