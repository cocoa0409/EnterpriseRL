  - id: income_ext_survivor_held_release
    base_policy_refs: [income_proof_of_life_and_suspension, income_evt_overpayment_recovery, income_payment_schedule]
    overwrite:
      - base_policy: income_evt_overpayment_recovery
        superseded_clause: >-
          Held installments falling due after the death are forfeited rather than paid, and are never counted as
          overpayments.
        replaced_by: >-
          On a joint-and-survivor tier whose contract is continuing to the survivor, the survivor share of an installment
          held for a payment date after the first death is the tier's survivor continuation percentage of the joint
          installment of that payment date, rounded to the cent and never more than the held installment; on a life-only or
          cash-refund tier, nothing of an installment held for a payment date after the death is released; otherwise the
          whole held installment is released.
      - base_policy: income_proof_of_life_and_suspension
        superseded_clause: >-
          When the suspension ends in a confirmed death instead, held installments falling due on or before the date of
          death are released to the estate or survivor and those falling due after it are forfeited.
        replaced_by: >-
          On a joint-and-survivor tier whose contract is continuing to the survivor, the survivor share of an installment
          held for a payment date after the first death is the tier's survivor continuation percentage of the joint
          installment of that payment date, rounded to the cent and never more than the held installment; on a life-only or
          cash-refund tier, nothing of an installment held for a payment date after the death is released; otherwise the
          whole held installment is released.
      - base_policy: income_payment_schedule
        superseded_clause: >-
          On a non-qualified contract where exclusion_ratio_applies is true, each installment is split into a tax-free part
          equal to the installment times the exclusion ratio and a taxable remainder, until the total tax-free amount equals
          the purchase amount, after which the whole installment is taxable; IRA installments are fully taxable.
        replaced_by: >-
          The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase amount,
          times the exclusion ratio, rounded to the cent; the tax-free part of the released survivor share is that share
          times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less the
          tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole
          released survivor share is taxable.
      - base_policy: income_payment_schedule
        superseded_clause: >-
          Federal tax is withheld at the rate on the owner's latest withholding election; with no election on file the
          withholding_default_periodic method applies.
        replaced_by: >-
          Federal tax on the released survivor share is withheld at the rate on the survivor's own withholding election
          when the survivor has one on file; when the survivor is a payee other than the owner and has no election of their
          own, at the survivor default rate, because an election made by the owner does not govern the survivor's payments;
          otherwise at the rate on the contract's withholding election.
      - base_policy: income_evt_overpayment_recovery
        superseded_clause: >-
          Where payments continue to a survivor or beneficiary, an unrecovered overpayment may be offset against those
          payments, taking no more than overpayment_offset_max_pct of each gross installment, rounded to the cent.
        replaced_by: >-
          When an overpayment stands unrecovered on the contract and payments continue to a survivor or beneficiary, the
          amount applied to it is the overpayment offset maximum percentage of the released survivor share, rounded to the
          cent and never more than the overpayment outstanding; when an overpayment stands unrecovered and no payments
          continue, the whole released share is applied to it, never more than the overpayment outstanding; otherwise
          nothing is applied.
    trigger: state_due
    subject: [income_held_payment_released, income_payment_issued]
    computes: net_paid_amount
    target_tool: release_survivor_share_80ea435e
    params:
      survivor_default_rate: 0.10
      state_flat_rate: 0.05
      state_alt_rate: 0.04
    rule: >-
      Once the death that ended the suspension of a contract is confirmed, an installment still held in suspense for a
      payment date after the death is settled in one step: the share owed to a living payee is released to that payee by
      the payment method on the contract and the rest is forfeited back to the contract, the held installment earning no interest, and no part of a held installment is ever counted as an overpayment. The survivor share of a held installment is fixed only after every installment deposited at the joint
      amount after the first death carries a repayment entry for its excess. A held installment that fell due after the
      first death is not released until every installment held for a payment date on or before that death stands released.
      The whole held installment is released. The joint installment of a payment date is the installment most recently
      issued on the contract. Its taxable part is the amount released less a tax-free part equal to that amount times the
      exclusion ratio, rounded to the cent. Federal tax is withheld from the taxable part at the rate on the contract's
      withholding election, rounded to the cent, no state tax is withheld and nothing is applied to any overpayment. The
      amount sent is the amount released less the federal tax, the state tax and any amount applied to an overpayment. On a
      joint-and-survivor tier whose contract is continuing to the survivor, the survivor share of an installment held for
      a payment date after the first death is the tier's survivor continuation percentage of the joint installment of that
      payment date, rounded to the cent and never more than the held installment; on a life-only or cash-refund tier,
      nothing of an installment held for a payment date after the death is released; otherwise the whole held installment
      is released. The joint installment of the held payment date is the held installment as scheduled when a
      cost-of-living increase took effect on a contract anniversary after that payment date; it is the held installment
      raised by the cost-of-living rate, rounded to the cent, when an anniversary increase took effect after the death and
      on or before that payment date while the installment was held at the amount of the last installment issued to the
      annuitant; otherwise it is the installment most recently issued on the contract. The investment in the contract is,
      for a contract bought by annuitizing an Ashgrove deferred fixed annuity or an Ashgrove fixed indexed annuity, the cost
      basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase
      amount. The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase
      amount, times the exclusion ratio, rounded to the cent; the tax-free part of the released survivor share is that share
      times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less the tax-free
      amount already recovered and never less than zero, so that once the investment is recovered the whole released
      survivor share is taxable. Federal tax on the released survivor share is withheld at the rate on the survivor's own
      withholding election when the survivor has one on file; when the survivor is a payee other than the owner and has no
      election of their own, at the survivor default rate, because an election made by the owner does not govern the
      survivor's payments; otherwise at the rate on the contract's withholding election. The overpayment outstanding is the
      overpayments recorded on the contract less the recoveries recorded against them. When an overpayment stands
      unrecovered on the contract and payments continue to a survivor or beneficiary, the amount applied to it is the
      overpayment offset maximum percentage of the released survivor share, rounded to the cent and never more than the
      overpayment outstanding; when an overpayment stands unrecovered and no payments continue, the whole released share is
      applied to it, never more than the overpayment outstanding; otherwise nothing is applied. State tax is withheld from
      the released survivor share only when federal tax is withheld from it and federal tax was withheld from the contract's
      installments falling due in the twelve months before the release: at the state flat rate on the taxable part for a
      contract issued in Iowa, Minnesota, North Carolina or Vermont, and at the alternative state rate on the taxable part
      for a contract issued in Delaware, New York or Oklahoma; otherwise no state tax is withheld from the released survivor
      share. Each amount is rounded to the cent on its own.
    prerequisite:
      - problem: income_ext_post_death_excess_repayment
        kind: value_input
        gate: overpayment_outstanding
        form: state
        policy_source: >-
          The survivor share of a held installment is fixed only after every installment deposited at the joint amount after
          the first death carries a repayment entry for its excess.
        condition: >-
          Every installment issued at more than the survivor installment for a payment date after the first death has a
          repayment entry by the payee linked to it.
        resolved_by: settle_post_death_deposit_f655a739
        effect: >-
          Once the payee's settlement is recorded, the overpayment it records less the payee's repayment stands outstanding,
          and that remainder is applied against the released survivor share, which changes the amount sent.
      - problem: income_ext_returned_installment_reissue
        kind: state_gate
        gate: income_transactions.release_outcome
        form: state
        policy_source: >-
          A held installment that fell due after the first death is not released until every installment held for a
          payment date on or before that death stands released.
        condition: >-
          Every held entry for a payment date on or before the first death has a paid release entry for that payment date.
        resolved_by: reissue_returned_installment_7c2be31a
        effect: >-
          Once the earlier returned installment is reissued, no installment held for a payment date on or before the death
          remains, so the post-death held installment may be released.
    cross_category:
      - category: fixed
        as: branch
        reads: [cost_basis]
        note: The investment-in-the-contract factor reads the cost basis of the Ashgrove deferred fixed annuity annuitized into the contract.
      - category: indexed
        as: branch
        reads: [cost_basis]
        note: The same factor reads the cost basis of an Ashgrove fixed indexed annuity annuitized into the contract.
    compute:
      - held_due: "LATEST('income_transactions', 'payment_due_date', date_field='payment_due_date', event_type='income_payment_held')"
      - held_amount: "SUM('income_transactions', 'amount', event_type='income_payment_held', payment_due_date=held_due)"
      - increases_after_due: "int(MONTHS(F('issue_date'), NOW) / 12) - int(MONTHS(F('issue_date'), held_due) / 12)"
      - increases_death_to_due: "int(MONTHS(F('issue_date'), held_due) / 12) - int(MONTHS(F('issue_date'), F('first_death_date')) / 12)"
      - last_issued: "LATEST('income_transactions', 'amount', date_field='payment_due_date', event_type='income_payment_issued')"
      - last_annuitant_installment: "LATEST('income_transactions', 'amount', date_field='payment_due_date', event_type='income_payment_issued', payee_name=F('annuitant_name'))"
      - joint_base: "held_amount if (F('cola_pct') > 0 and increases_after_due >= 1) else (RND(held_amount * (1 + F('cola_pct')), 2) if (increases_death_to_due >= 1 and held_amount == last_annuitant_installment) else last_issued)"
      - days_after_death: "DAYS(F('first_death_date'), held_due)"
      - survivor_share: "MN(held_amount, RND(joint_base * P('survivor_continuation_pct'), 2)) if (P('payout_basis') == 'joint_survivor' and days_after_death > 0 and F('status') == 'survivor_continuing') else (0 if ((P('payout_basis') == 'life_only' or P('payout_basis') == 'life_cash_refund') and days_after_death > 0) else held_amount)"
      - forfeited: "held_amount - survivor_share"
      - investment: "(CFIELD('indexed', 'cost_basis', indexed_contract_id=F('source_indexed_contract_id')) if F('purchase_source') == 'ashgrove_indexed_annuitization' else CFIELD('fixed', 'cost_basis', fixed_contract_id=F('source_fixed_contract_id'))) if (F('purchase_source') == 'ashgrove_indexed_annuitization' or F('purchase_source') == 'ashgrove_fixed_annuitization') else (0 if (F('tax_qualification') == 'traditional_ira' or F('tax_qualification') == 'sep_ira') else F('purchase_amount'))"
      - recovered: "RND((F('purchase_amount') - F('unreturned_premium')) * F('exclusion_ratio'), 2)"
      - tax_free: "MX(0, MN(RND(survivor_share * F('exclusion_ratio'), 2), investment - recovered))"
      - taxable: "survivor_share - tax_free"
      - own_elections: "COUNT('income_service_requests', request_type='withholding_election', customer_id=F('payee_customer_id'))"
      - own_rate: "LATEST('income_service_requests', 'requested_withholding_pct', date_field='received_date', request_type='withholding_election', customer_id=F('payee_customer_id'))"
      - withholding_rate: "own_rate if own_elections > 0 else (K('survivor_default_rate') if (F('payee_customer_id') != None and F('payee_customer_id') != F('customer_id')) else F('federal_withholding_pct'))"
      - federal_tax: "RND(taxable * withholding_rate, 2)"
      - overpayment_outstanding: "SUM('income_transactions', 'amount', event_type='income_overpayment_identified') - SUM('income_transactions', 'amount', event_type='income_overpayment_recovered')"
      - offset: "MN(overpayment_outstanding, RND(survivor_share * P('overpayment_offset_max_pct'), 2)) if (overpayment_outstanding > 0 and (F('status') == 'survivor_continuing' or F('status') == 'beneficiary_continuing')) else (MN(overpayment_outstanding, survivor_share) if overpayment_outstanding > 0 else 0)"
      - federal_withheld_12m: "SUM('income_transactions', 'federal_withholding_amount', within_months=12, date_field='payment_due_date', event_type='income_payment_issued')"
      - state_tax: "RND(taxable * K('state_flat_rate'), 2) if ((F('issue_state') == 'IA' or F('issue_state') == 'MN' or F('issue_state') == 'NC' or F('issue_state') == 'VT') and federal_tax > 0 and federal_withheld_12m > 0) else (RND(taxable * K('state_alt_rate'), 2) if ((F('issue_state') == 'DE' or F('issue_state') == 'NY' or F('issue_state') == 'OK') and federal_tax > 0 and federal_withheld_12m > 0) else 0)"
      - result: "RND(survivor_share - federal_tax - state_tax - offset, 2)"
    compute_basis:
      held_due: "an installment still held in suspense for a payment date after the death"
      held_amount: "The whole held installment is released."
      increases_after_due: "when a cost-of-living increase took effect on a contract anniversary after that payment date"
      increases_death_to_due: "when an anniversary increase took effect after the death and on or before that payment date"
      last_issued: "The joint installment of a payment date is the installment most recently issued on the contract."
      last_annuitant_installment: "while the installment was held at the amount of the last installment issued to the annuitant"
      joint_base: "The joint installment of the held payment date is the held installment as scheduled when a cost-of-living increase took effect on a contract anniversary after that payment date; it is the held installment raised by the cost-of-living rate, rounded to the cent, when an anniversary increase took effect after the death and on or before that payment date while the installment was held at the amount of the last installment issued to the annuitant; otherwise it is the installment most recently issued on the contract."
      days_after_death: "an installment held for a payment date after the first death"
      survivor_share: "On a joint-and-survivor tier whose contract is continuing to the survivor, the survivor share of an installment held for a payment date after the first death is the tier's survivor continuation percentage of the joint installment of that payment date, rounded to the cent and never more than the held installment; on a life-only or cash-refund tier, nothing of an installment held for a payment date after the death is released; otherwise the whole held installment is released."
      forfeited: "the share owed to a living payee is released to that payee by the payment method on the contract and the rest is forfeited back to the contract"
      investment: "The investment in the contract is, for a contract bought by annuitizing an Ashgrove deferred fixed annuity or an Ashgrove fixed indexed annuity, the cost basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase amount."
      recovered: "The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase amount, times the exclusion ratio, rounded to the cent"
      tax_free: "the tax-free part of the released survivor share is that share times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less the tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole released survivor share is taxable."
      taxable: "Its taxable part is the amount released less a tax-free part"
      own_elections: "when the survivor has one on file"
      own_rate: "at the rate on the survivor's own withholding election when the survivor has one on file"
      withholding_rate: "Federal tax on the released survivor share is withheld at the rate on the survivor's own withholding election when the survivor has one on file; when the survivor is a payee other than the owner and has no election of their own, at the survivor default rate, because an election made by the owner does not govern the survivor's payments; otherwise at the rate on the contract's withholding election."
      federal_tax: "Federal tax is withheld from the taxable part at the rate on the contract's withholding election, rounded to the cent"
      overpayment_outstanding: "The overpayment outstanding is the overpayments recorded on the contract less the recoveries recorded against them."
      offset: "When an overpayment stands unrecovered on the contract and payments continue to a survivor or beneficiary, the amount applied to it is the overpayment offset maximum percentage of the released survivor share, rounded to the cent and never more than the overpayment outstanding; when an overpayment stands unrecovered and no payments continue, the whole released share is applied to it, never more than the overpayment outstanding; otherwise nothing is applied."
      federal_withheld_12m: "federal tax was withheld from the contract's installments falling due in the twelve months before the release"
      state_tax: "State tax is withheld from the released survivor share only when federal tax is withheld from it and federal tax was withheld from the contract's installments falling due in the twelve months before the release: at the state flat rate on the taxable part for a contract issued in Iowa, Minnesota, North Carolina or Vermont, and at the alternative state rate on the taxable part for a contract issued in Delaware, New York or Oklahoma; otherwise no state tax is withheld from the released survivor share."
      result: "The amount sent is the amount released less the federal tax, the state tax and any amount applied to an overpayment."
    factors:
      - id: survivor_release_share
        effect: method
        decides: survivor_share
        bindings: [days_after_death, survivor_share]
        ladder:
          - when: "a joint-and-survivor tier whose contract is continuing to the survivor, and the installment is held for a payment date after the first death"
            method: "the survivor share is the tier's survivor continuation percentage of the joint installment of that payment date, never more than the held installment"
          - when: "a life-only or cash-refund tier and the installment is held for a payment date after the death"
            method: "nothing is released"
          - when: "otherwise"
            method: "the whole held installment is released"
        baseline:
          survivor_share: "held_amount"
        evidence: [history, date]
        cross_difficulty: null
      - id: survivor_release_joint_installment
        effect: parameter
        decides: joint_base
        bindings: [increases_after_due, increases_death_to_due, last_issued, last_annuitant_installment, joint_base]
        ladder:
          - when: "a cost-of-living increase took effect on a contract anniversary after the held payment date"
            value: "the held installment as scheduled"
          - when: "an anniversary increase took effect after the death and on or before the held payment date while the installment was held at the amount of the last installment issued to the annuitant"
            value: "the held installment raised by the cost-of-living rate, rounded to the cent"
          - when: "otherwise"
            value: "the installment most recently issued on the contract"
        baseline:
          joint_base: "last_issued"
        evidence: [history, date]
        cross_difficulty: null
      - id: survivor_release_investment
        effect: method
        decides: investment
        bindings: [investment]
        ladder:
          - when: "the contract was bought by annuitizing an Ashgrove deferred fixed annuity or an Ashgrove fixed indexed annuity"
            method: "the investment in the contract is the cost basis of the annuity annuitized"
          - when: "the contract is a traditional or SEP IRA not bought by annuitizing an Ashgrove deferred annuity"
            method: "the investment in the contract is zero"
          - when: "otherwise"
            method: "the investment in the contract is the purchase amount"
        baseline:
          investment: "F('purchase_amount')"
        evidence: [cross_category]
        cross_difficulty: fixed
      - id: survivor_release_withholding_rate
        effect: parameter
        decides: withholding_rate
        bindings: [own_elections, own_rate, withholding_rate]
        ladder:
          - when: "the survivor has a withholding election of their own on file"
            value: "the rate on the survivor's own withholding election"
          - when: "the survivor is a payee other than the owner and has no withholding election of their own"
            value: "K('survivor_default_rate')"
          - when: "otherwise"
            value: "F('federal_withholding_pct') — the rate on the contract's withholding election"
        baseline:
          withholding_rate: "F('federal_withholding_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: survivor_release_overpayment_offset
        effect: parameter
        decides: offset
        bindings: [overpayment_outstanding, offset]
        ladder:
          - when: "an overpayment stands unrecovered on the contract and payments continue to a survivor or beneficiary"
            value: "P('overpayment_offset_max_pct') of the released survivor share, never more than the overpayment outstanding"
          - when: "an overpayment stands unrecovered and no payments continue"
            value: "the whole released share, never more than the overpayment outstanding"
          - when: "otherwise"
            value: "0 — nothing applied"
        baseline:
          offset: "0"
        evidence: [history]
        cross_difficulty: null
      - id: survivor_release_state_tax
        effect: parameter
        decides: state_tax
        bindings: [federal_withheld_12m, state_tax]
        ladder:
          - when: "the contract was issued in Iowa, Minnesota, North Carolina or Vermont, federal tax is withheld from the released survivor share and federal tax was withheld from the contract's installments falling due in the twelve months before the release"
            value: "K('state_flat_rate') of the taxable part"
          - when: "the contract was issued in Delaware, New York or Oklahoma, federal tax is withheld from the released survivor share and federal tax was withheld from the contract's installments falling due in the twelve months before the release"
            value: "K('state_alt_rate') of the taxable part"
          - when: "otherwise"
            value: "0 — no state tax"
        baseline:
          state_tax: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The whole held installment is released. The joint installment of a payment date is the installment most recently
        issued on the contract. Its taxable part is the amount released less a tax-free part equal to that amount times the
        exclusion ratio, rounded to the cent. Federal tax is withheld from the taxable part at the rate on the contract's
        withholding election, rounded to the cent, no state tax is withheld and nothing is applied to any overpayment. The
        amount sent is the amount released less the federal tax, the state tax and any amount applied to an overpayment.
      params: []
    inputs:
      history:
        - {table: income_transactions, aggregate: sum, field: amount, filters: {event_type: income_payment_held}}
        - {table: income_transactions, aggregate: sum, field: amount, filters: {event_type: income_overpayment_identified}}
        - {table: income_transactions, aggregate: sum, field: amount, filters: {event_type: income_overpayment_recovered}}
        - {table: income_transactions, aggregate: sum, field: federal_withholding_amount, within_months: 12, filters: {event_type: income_payment_issued}}
        - {table: income_service_requests, aggregate: count, field: income_request_id, filters: {request_type: withholding_election}}
      cross_category: [fixed, indexed]
