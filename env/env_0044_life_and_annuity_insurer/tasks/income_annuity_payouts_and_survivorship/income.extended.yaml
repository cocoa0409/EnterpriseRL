        effect: method
        decides: interest_days
        bindings: [interest_days]
        ladder:
          - when: "the contract was issued in Connecticut, Minnesota, New Jersey or New York"
            method: "interest runs for the actual days from the date of death to the payment date"
          - when: "the contract was issued in any other state and the annuitant's death was reported to Ashgrove before due proof of death was received"
            method: "interest runs for the actual days from the date the death was first reported to the payment date"
          - when: "otherwise"
