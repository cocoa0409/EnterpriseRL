        ladder:
          - when: "the contract was bought by annuitizing an Ashgrove fixed indexed annuity or an Ashgrove deferred fixed annuity"
            method: "the investment in the contract is the cost basis of the annuity annuitized"
          - when: "the contract is a traditional or SEP IRA not bought by annuitizing an Ashgrove deferred annuity"
            method: "the investment in the contract is zero"
          - when: "otherwise"
