            value: "K('group_delay_rate')"
          - when: "the contract was issued in any other state and more than the other-state late days have passed since due proof of death was received"
            value: "K('other_late_rate')"
          - when: "otherwise"
            value: "P('death_claim_interest_rate')"
        baseline:
