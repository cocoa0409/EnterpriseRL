    baseline:
      rule: >-
        The arrears installment is paid at the current installment on the contract. Its taxable part is the installment
        less a tax-free part equal to the installment times the exclusion ratio, rounded to the cent. Federal tax is
        withheld from the taxable part at the rate on the contract's withholding election, rounded to the cent, and no
        state tax is withheld. Interest is added at the contract's death-claim interest rate, simple, for the actual days
        from the date due proof of death was received to the payment date over 365, rounded to the cent. The amount sent
        is the arrears installment plus the interest, less the federal tax and the state tax.
      params: [death_claim_interest_rate]
    inputs:
      history:
        - {table: income_transactions, aggregate: latest, field: amount, filters: {event_type: income_payment_issued}}
        - {table: income_transactions, aggregate: latest, field: amount, filters: {event_type: income_payment_held}}
        - {table: income_transactions, aggregate: sum, field: federal_withholding_amount, within_months: 12, filters: {event_type: income_payment_issued}}
        - {table: income_service_requests, aggregate: latest, field: received_date, filters: {request_type: death_claim}}
        - {table: income_service_requests, aggregate: count, field: income_request_id, filters: {request_type: withholding_election}}
      cross_category: [indexed, fixed]
  - id: income_ext_commutation_election
    base_policy_refs: [income_death_of_annuitant]
    overwrite:
      - base_policy: income_death_of_annuitant
        superseded_clause: >-
          where beneficiary_commutation_allowed is true and at least commutation_min_remaining_payments installments
          remain, a beneficiary may elect instead the commuted value of the remaining installments, discounted at the
          pricing interest rate plus commutation_discount_spread as an annual effective rate converted to the payment
          frequency, with the first remaining installment discounted one period, rounded to the cent;
        replaced_by: >-
          The commuted value counts the certain installments not paid before the date of death, which is the period-certain
          years times the installments per year less one installment for each payment date from the first payment date
          through the date of death, values every one of them at the current installment on the contract, and discounts
          them at the contract's pricing interest rate plus the commutation discount spread, taken as an annual effective
          rate and converted to a rate per payment period, the first counted installment discounted one payment period and
          each later one a further payment period, the total rounded to the cent.
    trigger: on_request
    subject: [income_commuted_value_paid]
    computes: commuted_value
    target_tool: elect_commuted_value_be644418
    params:
      cutoff_days: 10
      days_per_month: 30.4375
      short_months: 24
      long_months: 180
      short_spread: 0.0050
      long_spread: 0.0150
      floor_months: 120
      rate_floor: 0.0550
      rate_cap: 0.0900
      exact_growth_months: 36
    rule: >-
      On a period-certain tier that allows beneficiary commutation, the beneficiary receiving the remaining certain
      installments after the annuitant's death within the period certain may sign an election to take their commuted value
      in one sum instead of continuing payments, while at least the minimum number of remaining payments for commutation
      are left; the election carries the commuted value, the federal withholding rate the beneficiary chooses for the lump
      sum and how the beneficiary wants to be paid. The commuted value counts the certain installments not paid before the
      date of death, which is the period-certain years times the installments per year less one installment for each
      payment date from the first payment date through the date of death, values every one of them at the current
      installment on the contract, and discounts them at the contract's pricing interest rate plus the commutation discount
      spread, taken as an annual effective rate and converted to a rate per payment period, the first counted installment
      discounted one payment period and each later one a further payment period, the total rounded to the cent. The commuted value is fixed only after every certain installment that fell due between the date of death and the approval of the death claim stands issued to the beneficiary on the contract's activity history. Which installments are commuted
      depends on the contract's status: while the remaining installments are already continuing to the beneficiary, the
      count is one installment for each payment date from the next payment date through the certain period end date, and
      any certain installment that fell due after the date of death and on or before the approval of the death claim and still stands unissued is added undiscounted at the
      amount of the last installment issued to the annuitant; while the death claim is still pending, the count is that
      same number plus one installment for each payment period elapsed since the date of death, all of them discounted;
      otherwise the count is the certain installments not paid before the date of death. When the next payment date falls
      after the election day but within the cutoff days of it, that installment is left out of the commuted count and paid
      on its own schedule; when the election falls on a payment date, the installment due that day is left out of the count
      and paid undiscounted with the commuted value; otherwise every counted installment is commuted. The commutation
      discount spread is the short spread when fewer than the short months remain from the election to the certain period
      end date, the long spread when the long months or more remain, and otherwise the tier's commutation discount spread.
      The annual discount rate is the rate floor when the contract has been in force for the floor months or more and its
      pricing interest rate plus the spread is below the rate floor; it is the rate cap when the contract has been in force
      for fewer than the floor months and its pricing interest rate plus the spread is above the rate cap; otherwise it is
      the pricing interest rate plus the spread. When the next payment date falls more than the cutoff days after the
      election, the first commuted installment is discounted by the days from the election to the next payment date divided
      by the days in a payment period, taken as the days per month times the months per payment period; when it falls
      within the cutoff days, the first commuted installment is discounted by those days plus one payment period, divided by
      the days in a payment period; otherwise the first commuted installment is discounted one payment period; each later
      commuted installment is discounted one further payment period. On a contract with a cost-of-living rate and fewer than
      the exact growth months left to the certain period end date, each commuted installment is valued at the current
      installment increased by the cost-of-living rate once for each contract anniversary falling between now and its
      payment date, counting the installments left in the current contract year, then those of the next contract year at
      one increase, then the rest at two increases; on a contract with a cost-of-living rate and the exact growth months or
      more left, the growth is allowed for by discounting the level current installment at the per-period rate reduced for
      the cost-of-living rate spread evenly over the payment periods of a year; otherwise every commuted installment is
      valued level at the current installment. The commuted value is the sum of the discounted installments plus any
      installment added undiscounted, rounded to the cent.
    prerequisite:
      - problem: income_ext_beneficiary_arrears
        kind: value_input
        gate: unpaid_past
        form: state
        policy_source: >-
          The commuted value is fixed only after every certain installment that fell due between the date of death and the approval of the death claim stands issued to the beneficiary on the contract's activity history.
        condition: >-
          Every certain installment whose payment date fell after the annuitant's date of death and on or before the date the death claim was approved has an issued payment to the beneficiary on the contract's activity history.
        resolved_by: pay_beneficiary_arrears_076c3375
        effect: >-
          Once the arrears installment is issued, no certain installment that fell due since the death stands unissued, so
          nothing is added undiscounted to the commuted value and the count of unissued past installments falls to zero.
    cross_category: []
    compute:
      - ppy: "12 if F('payment_frequency') == 'monthly' else (4 if F('payment_frequency') == 'quarterly' else (2 if F('payment_frequency') == 'semiannual' else 1))"
      - mpp: "int(12 / ppy)"
      - next_due: "F('next_payment_date')"
      - death_date: "F('first_death_date')"
      - future_count: "int(MONTHS(next_due, F('certain_period_end_date')) / mpp) + 1"
      - paid_before_death: "int(MONTHS(F('first_payment_date'), death_date) / mpp) + 1"
      - months_since_death: "MONTHS(death_date, NOW)"
      - claim_approved: "LATEST('income_service_requests', 'decision_date', date_field='received_date', request_type='death_claim', death_certificate_received=True)"
      - first_after_death_index: "int(MONTHS(F('first_payment_date'), death_date) / mpp) + 1"
      - claim_span_last_index: "int(MONTHS(F('first_payment_date'), claim_approved) / mpp)"
      - months_from_first: "MONTHS(F('first_payment_date'), NOW)"
      - issued_since_death: "COUNT('income_transactions', within_months=months_from_first - mpp * first_after_death_index + 1, date_field='payment_due_date', event_type='income_payment_issued') - COUNT('income_transactions', within_months=months_from_first - mpp * claim_span_last_index, date_field='payment_due_date', event_type='income_payment_issued')"
      - unpaid_past: "MX(0, claim_span_last_index - first_after_death_index + 1 - issued_since_death)"
      - base_count: "future_count if F('status') == 'beneficiary_continuing' else (future_count + int(months_since_death / mpp) if F('status') == 'death_claim_pending' else P('period_certain_years') * ppy - paid_before_death)"
      - face_count: "unpaid_past if F('status') == 'beneficiary_continuing' else 0"
      - face_amount: "LATEST('income_transactions', 'amount', date_field='payment_due_date', event_type='income_payment_issued', payee_name=F('annuitant_name'))"
      - cutoff_days_to_next: "DAYS(NOW, next_due)"
      - cutoff_skip: "1 if (cutoff_days_to_next > 0 and cutoff_days_to_next <= K('cutoff_days')) else (1 if cutoff_days_to_next == 0 else 0)"
      - cutoff_face: "1 if cutoff_days_to_next == 0 else 0"
      - commuted_count: "base_count - cutoff_skip"
      - months_left: "MONTHS(NOW, F('certain_period_end_date'))"
      - spread: "K('short_spread') if months_left < K('short_months') else (K('long_spread') if months_left >= K('long_months') else P('commutation_discount_spread'))"
      - months_in_force: "MONTHS(F('issue_date'), NOW)"
      - annual_rate: "K('rate_floor') if (months_in_force >= K('floor_months') and F('pricing_interest_rate') + spread < K('rate_floor')) else (K('rate_cap') if (months_in_force < K('floor_months') and F('pricing_interest_rate') + spread > K('rate_cap')) else F('pricing_interest_rate') + spread)"
      - periodic_rate: "(1 + annual_rate) ** (1 / ppy) - 1"
      - v: "1 / (1 + periodic_rate)"
      - lead_days: "DAYS(NOW, next_due)"
      - first_discount: "lead_days / (K('days_per_month') * mpp) if lead_days > K('cutoff_days') else ((lead_days + K('days_per_month') * mpp) / (K('days_per_month') * mpp) if lead_days >= 0 else 1)"
      - first_commuted_month: "MONTHS(F('issue_date'), next_due) + mpp * cutoff_skip"
      - seg1: "MN(commuted_count, ppy - (int(first_commuted_month / mpp) % ppy))"
      - seg2: "MN(commuted_count - seg1, ppy)"
      - seg3: "MX(0, commuted_count - seg1 - seg2)"
      - growth_v: "v * (1 + F('cola_pct')) ** (1 / ppy)"
      - pv_units: "((1 - v ** seg1) / (1 - v) + (1 + F('cola_pct')) * v ** seg1 * (1 - v ** seg2) / (1 - v) + (1 + F('cola_pct')) ** 2 * v ** (seg1 + seg2) * (1 - v ** seg3) / (1 - v)) if (F('cola_pct') > 0 and months_left < K('exact_growth_months')) else ((1 - growth_v ** commuted_count) / (1 - growth_v) if F('cola_pct') > 0 else (1 - v ** commuted_count) / (1 - v))"
      - commuted_pv: "F('current_payment_amount') * v ** first_discount * pv_units"
      - result: "RND(commuted_pv + face_count * face_amount + cutoff_face * F('current_payment_amount'), 2)"
    compute_basis:
      future_count: "the count is one installment for each payment date from the next payment date through the certain period end date"
      paid_before_death: "less one installment for each payment date from the first payment date through the date of death"
      months_since_death: "one installment for each payment period elapsed since the date of death"
      claim_approved: "on or before the approval of the death claim"
      first_after_death_index: "any certain installment that fell due after the date of death"
      claim_span_last_index: "on or before the approval of the death claim and still stands unissued"
      months_from_first: "any certain installment that fell due after the date of death and on or before the approval of the death claim and still stands unissued"
      issued_since_death: "any certain installment that fell due after the date of death and on or before the approval of the death claim and still stands unissued"
      unpaid_past: "any certain installment that fell due after the date of death and on or before the approval of the death claim and still stands unissued is added undiscounted at the amount of the last installment issued to the annuitant"
      base_count: "while the remaining installments are already continuing to the beneficiary, the count is one installment for each payment date from the next payment date through the certain period end date, and any certain installment that fell due after the date of death and on or before the approval of the death claim and still stands unissued is added undiscounted at the amount of the last installment issued to the annuitant; while the death claim is still pending, the count is that same number plus one installment for each payment period elapsed since the date of death, all of them discounted; otherwise the count is the certain installments not paid before the date of death."
      face_count: "any certain installment that fell due after the date of death and on or before the approval of the death claim and still stands unissued is added undiscounted"
      face_amount: "at the amount of the last installment issued to the annuitant"
      cutoff_days_to_next: "When the next payment date falls after the election day but within the cutoff days of it"
      cutoff_skip: "When the next payment date falls after the election day but within the cutoff days of it, that installment is left out of the commuted count and paid on its own schedule; when the election falls on a payment date, the installment due that day is left out of the count and paid undiscounted with the commuted value; otherwise every counted installment is commuted."
      cutoff_face: "the installment due that day is left out of the count and paid undiscounted with the commuted value"
      months_left: "when fewer than the short months remain from the election to the certain period end date"
      spread: "The commutation discount spread is the short spread when fewer than the short months remain from the election to the certain period end date, the long spread when the long months or more remain, and otherwise the tier's commutation discount spread."
      months_in_force: "when the contract has been in force for the floor months or more"
      annual_rate: "The annual discount rate is the rate floor when the contract has been in force for the floor months or more and its pricing interest rate plus the spread is below the rate floor; it is the rate cap when the contract has been in force for fewer than the floor months and its pricing interest rate plus the spread is above the rate cap; otherwise it is the pricing interest rate plus the spread."
      periodic_rate: "taken as an annual effective rate and converted to a rate per payment period"
      lead_days: "by the days from the election to the next payment date"
      first_discount: "When the next payment date falls more than the cutoff days after the election, the first commuted installment is discounted by the days from the election to the next payment date divided by the days in a payment period, taken as the days per month times the months per payment period; when it falls within the cutoff days, the first commuted installment is discounted by those days plus one payment period, divided by the days in a payment period; otherwise the first commuted installment is discounted one payment period; each later commuted installment is discounted one further payment period."
      first_commuted_month: "counting the installments left in the current contract year"
      seg1: "counting the installments left in the current contract year"
      seg2: "then those of the next contract year at one increase"
      seg3: "then the rest at two increases"
      growth_v: "the growth is allowed for by discounting the level current installment at the per-period rate reduced for the cost-of-living rate spread evenly over the payment periods of a year"
      pv_units: "On a contract with a cost-of-living rate and fewer than the exact growth months left to the certain period end date, each commuted installment is valued at the current installment increased by the cost-of-living rate once for each contract anniversary falling between now and its payment date, counting the installments left in the current contract year, then those of the next contract year at one increase, then the rest at two increases; on a contract with a cost-of-living rate and the exact growth months or more left, the growth is allowed for by discounting the level current installment at the per-period rate reduced for the cost-of-living rate spread evenly over the payment periods of a year; otherwise every commuted installment is valued level at the current installment."
      commuted_pv: "values every one of them at the current installment on the contract"
      result: "The commuted value is the sum of the discounted installments plus any installment added undiscounted, rounded to the cent."
    factors:
      - id: commuted_installment_count
        effect: method
        decides: base_count
        bindings: [future_count, paid_before_death, months_since_death, claim_approved, first_after_death_index, claim_span_last_index, months_from_first, issued_since_death, unpaid_past, base_count, face_count, face_amount]
        ladder:
          - when: "the remaining certain installments are already continuing to the beneficiary"
            method: "count one installment for each payment date from the next payment date through the certain period end date, and add any certain installment that fell due between the death and the approval of the death claim and stands unissued undiscounted at the last installment issued to the annuitant"
          - when: "the death claim is still pending"
            method: "count the payment dates from the next payment date through the certain period end date plus one installment for each payment period elapsed since the death, all discounted"
          - when: "otherwise"
            method: "count the certain installments not paid before the date of death, all discounted"
        baseline:
          base_count: "P('period_certain_years') * ppy - paid_before_death"
          face_count: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: commutation_cutoff_installment
        effect: method
        decides: cutoff_skip
        bindings: [cutoff_days_to_next, cutoff_skip, cutoff_face]
        ladder:
          - when: "the next payment date falls after the election day but within the cutoff days of it"
            method: "that installment is left out of the commuted count and paid on its own schedule"
          - when: "the election falls on a payment date"
            method: "the installment due that day is left out of the count and paid undiscounted with the commuted value"
          - when: "otherwise"
            method: "every counted installment is commuted"
        baseline:
          cutoff_skip: "0"
          cutoff_face: "0"
        evidence: [date]
        cross_difficulty: null
      - id: commutation_spread_by_term_left
        effect: parameter
        decides: spread
        bindings: [months_left, spread]
        ladder:
          - when: "fewer than the short months remain from the election to the certain period end date"
            value: "K('short_spread')"
          - when: "the long months or more remain from the election to the certain period end date"
            value: "K('long_spread')"
          - when: "otherwise"
            value: "P('commutation_discount_spread')"
        baseline:
          spread: "P('commutation_discount_spread')"
        evidence: [date]
        cross_difficulty: null
      - id: commutation_rate_floor_and_cap
        effect: parameter
        decides: annual_rate
        bindings: [months_in_force, annual_rate]
        ladder:
          - when: "the contract has been in force for the floor months or more and its pricing interest rate plus the spread is below the rate floor"
            value: "K('rate_floor')"
          - when: "the contract has been in force for fewer than the floor months and its pricing interest rate plus the spread is above the rate cap"
            value: "K('rate_cap')"
          - when: "otherwise"
            value: "F('pricing_interest_rate') + spread"
        baseline:
          annual_rate: "F('pricing_interest_rate') + spread"
        evidence: [date]
        cross_difficulty: null
      - id: commutation_first_discount_period
        effect: method
        decides: first_discount
        bindings: [lead_days, first_discount]
        ladder:
          - when: "the next payment date falls more than the cutoff days after the election"
            method: "the first commuted installment is discounted by the days to the next payment date divided by the days in a payment period"
          - when: "the next payment date falls within the cutoff days of the election"
            method: "the first commuted installment is discounted by those days plus one payment period, divided by the days in a payment period"
          - when: "otherwise"
            method: "the first commuted installment is discounted one payment period"
        baseline:
          first_discount: "1"
        evidence: [date]
        cross_difficulty: null
      - id: commutation_cost_of_living_growth
        effect: method
        decides: pv_units
        bindings: [first_commuted_month, seg1, seg2, seg3, growth_v, pv_units]
        ladder:
          - when: "the contract has a cost-of-living rate and fewer than the exact growth months are left to the certain period end date"
            method: "each commuted installment is raised by the cost-of-living rate once per contract anniversary before its payment date, in contract-year segments"
          - when: "the contract has a cost-of-living rate and the exact growth months or more are left"
            method: "the level current installment is discounted at the per-period rate reduced for the cost-of-living rate"
          - when: "otherwise"
            method: "every commuted installment is valued level at the current installment"
        baseline:
          pv_units: "(1 - v ** commuted_count) / (1 - v)"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The commuted value counts the certain installments not paid before the date of death, which is the period-certain
        years times the installments per year less one installment for each payment date from the first payment date
        through the date of death, values every one of them at the current installment on the contract, and discounts them
        at the contract's pricing interest rate plus the commutation discount spread, taken as an annual effective rate and
        converted to a rate per payment period, the first counted installment discounted one payment period and each later
        one a further payment period, the total rounded to the cent.
      params: [commutation_discount_spread, period_certain_years]
    inputs:
      history:
        - {table: income_transactions, aggregate: count, field: income_txn_id, filters: {event_type: income_payment_issued}}
        - {table: income_transactions, aggregate: latest, field: amount, filters: {event_type: income_payment_issued}}
      cross_category: []
  - id: income_ext_commuted_value_payout
    base_policy_refs: [income_death_of_annuitant, income_payment_schedule]
    overwrite:
      - base_policy: income_payment_schedule
        superseded_clause: >-
          On a non-qualified contract where exclusion_ratio_applies is true, each installment is split into a tax-free part
          equal to the installment times the exclusion ratio and a taxable remainder, until the total tax-free amount equals
          the purchase amount, after which the whole installment is taxable; IRA installments are fully taxable.
        replaced_by: >-
          On a non-qualified contract whose investment in the contract is already recovered, the whole commuted value is
          taxable; on a non-qualified contract whose investment is not yet recovered, the taxable part is the commuted value
          less the investment still unrecovered, never below zero; otherwise the taxable part is the commuted value less a
          tax-free part equal to the commuted value times the exclusion ratio, rounded to the cent.
      - base_policy: income_payment_schedule
        superseded_clause: >-
          Federal tax is withheld at the rate on the owner's latest withholding election; with no election on file the
          withholding_default_periodic method applies.
        replaced_by: >-
          Federal tax on the commuted value is withheld at the rate the beneficiary chose on the commutation election when
          the election carries one; when it carries none and the payee is a beneficiary other than the owner, at the lump-sum
          default rate; otherwise at the rate on the contract's withholding election.
    trigger: on_request
    subject: [income_commuted_value_paid]
    computes: net_paid_amount
    target_tool: pay_commuted_value_cb4f45b9
    params:
      lump_sum_default_rate: 0.10
      state_flat_rate: 0.05
      state_alt_rate: 0.04
    rule: >-
      The commuted value a beneficiary has elected is paid in one sum to that beneficiary, by the method the election asks
      for, while the contract status is death claim pending or beneficiary continuing. The commuted value is not paid until
      a commutation election signed by the beneficiary stands approved on the contract. The gross amount paid is the
      commuted value carried on the latest approved commutation election. Its taxable part is the commuted value less a
      tax-free part equal to the commuted value times the exclusion ratio, rounded to the cent; federal tax is withheld
      from the taxable part at the rate on the contract's withholding election, rounded to the cent; no state tax is
      withheld; and the amount sent is the commuted value less the federal tax and the state tax. On a non-qualified
      contract whose investment in the contract is already recovered, the whole commuted value is taxable; on a
      non-qualified contract whose investment is not yet recovered, the taxable part is the commuted value less the
      investment still unrecovered, never below zero; otherwise the taxable part is the commuted value less a tax-free
      part equal to the commuted value times the exclusion ratio, rounded to the cent. The investment in the contract is,
      for a contract bought by annuitizing an Ashgrove fixed indexed annuity or an Ashgrove deferred fixed annuity, the
      cost basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase
      amount; the investment still unrecovered is that investment less the purchase amount less the unreturned purchase
      amount times the exclusion ratio, the latter product rounded to the cent. Federal tax on the commuted value is
      withheld at the rate the beneficiary chose on the commutation election when the election carries one; when it
      carries none and the payee is a beneficiary other than the owner, at the lump-sum default rate; otherwise at the rate
      on the contract's withholding election. State tax is withheld from the commuted value only when federal tax is
      withheld from it and federal tax was withheld from the contract's installments falling due in the twelve months
      before the payment: at the state flat rate on the taxable part for a contract issued in Iowa, Minnesota, North Carolina or Vermont, and at the alternative state rate on the taxable part for a contract issued in Delaware, New York or Oklahoma; otherwise no state tax is withheld from the commuted value. Each tax is rounded to the cent on its own.
    prerequisite:
      - problem: income_ext_commutation_election
        kind: value_input
        gate: commuted
        form: state
        policy_source: >-
          The commuted value is not paid until a commutation election signed by the beneficiary stands approved on the
          contract.
        condition: >-
          The contract's service requests include an approved commutation election signed by the beneficiary.
        resolved_by: elect_commuted_value_be644418
        effect: >-
          Once the election is filed, the gross amount paid is the commuted value it carries and the federal withholding
          follows the rate chosen on it; with no election on file there is no commuted value to pay.
    cross_category:
      - category: indexed
        as: branch
        reads: [cost_basis]
        note: The investment-in-the-contract factor reads the cost basis of the Ashgrove fixed indexed annuity annuitized into the contract.
      - category: fixed
        as: branch
        reads: [cost_basis]
        note: The same factor reads the cost basis of an Ashgrove deferred fixed annuity annuitized into the contract.
    compute:
      - commuted: "LATEST('income_service_requests', 'requested_amount', date_field='received_date', request_type='commutation_election', request_status='approved')"
      - investment: "(CFIELD('indexed', 'cost_basis', indexed_contract_id=F('source_indexed_contract_id')) if F('purchase_source') == 'ashgrove_indexed_annuitization' else CFIELD('fixed', 'cost_basis', fixed_contract_id=F('source_fixed_contract_id'))) if (F('purchase_source') == 'ashgrove_indexed_annuitization' or F('purchase_source') == 'ashgrove_fixed_annuitization') else (0 if (F('tax_qualification') == 'traditional_ira' or F('tax_qualification') == 'sep_ira') else F('purchase_amount'))"
      - unrecovered: "investment - RND((F('purchase_amount') - F('unreturned_premium')) * F('exclusion_ratio'), 2)"
      - taxable: "commuted if (F('tax_qualification') == 'non_qualified' and unrecovered <= 0) else (MX(0, commuted - unrecovered) if F('tax_qualification') == 'non_qualified' else commuted - RND(commuted * F('exclusion_ratio'), 2))"
      - elected_rate: "LATEST('income_service_requests', 'requested_withholding_pct', date_field='received_date', request_type='commutation_election', request_status='approved')"
      - withholding_rate: "elected_rate if elected_rate != None else (K('lump_sum_default_rate') if (F('payee_customer_id') != None and F('payee_customer_id') != F('customer_id')) else F('federal_withholding_pct'))"
      - federal_tax: "RND(taxable * withholding_rate, 2)"
      - federal_withheld_12m: "SUM('income_transactions', 'federal_withholding_amount', within_months=12, date_field='payment_due_date', event_type='income_payment_issued')"
      - state_tax: "RND(taxable * K('state_flat_rate'), 2) if ((F('issue_state') == 'IA' or F('issue_state') == 'MN' or F('issue_state') == 'NC' or F('issue_state') == 'VT') and federal_tax > 0 and federal_withheld_12m > 0) else (RND(taxable * K('state_alt_rate'), 2) if ((F('issue_state') == 'DE' or F('issue_state') == 'NY' or F('issue_state') == 'OK') and federal_tax > 0 and federal_withheld_12m > 0) else 0)"
      - result: "RND(commuted - federal_tax - state_tax, 2)"
    compute_basis:
      commuted: "The gross amount paid is the commuted value carried on the latest approved commutation election."
      investment: "The investment in the contract is, for a contract bought by annuitizing an Ashgrove fixed indexed annuity or an Ashgrove deferred fixed annuity, the cost basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase amount"
      unrecovered: "the investment still unrecovered is that investment less the purchase amount less the unreturned purchase amount times the exclusion ratio, the latter product rounded to the cent."
      taxable: "On a non-qualified contract whose investment in the contract is already recovered, the whole commuted value is taxable; on a non-qualified contract whose investment is not yet recovered, the taxable part is the commuted value less the investment still unrecovered, never below zero; otherwise the taxable part is the commuted value less a tax-free part equal to the commuted value times the exclusion ratio, rounded to the cent."
      elected_rate: "at the rate the beneficiary chose on the commutation election when the election carries one"
      withholding_rate: "Federal tax on the commuted value is withheld at the rate the beneficiary chose on the commutation election when the election carries one; when it carries none and the payee is a beneficiary other than the owner, at the lump-sum default rate; otherwise at the rate on the contract's withholding election."
      federal_tax: "federal tax is withheld from the taxable part at the rate on the contract's withholding election, rounded to the cent"
      federal_withheld_12m: "federal tax was withheld from the contract's installments falling due in the twelve months before the payment"
      state_tax: "State tax is withheld from the commuted value only when federal tax is withheld from it and federal tax was withheld from the contract's installments falling due in the twelve months before the payment: at the state flat rate on the taxable part for a contract issued in Iowa, Minnesota, North Carolina or Vermont, and at the alternative state rate on the taxable part for a contract issued in Delaware, New York or Oklahoma; otherwise no state tax is withheld from the commuted value."
      result: "the amount sent is the commuted value less the federal tax and the state tax."
    factors:
      - id: commuted_value_taxable_part
        effect: method
        decides: taxable
        bindings: [commuted, taxable]
        ladder:
          - when: "the contract is non-qualified and its investment in the contract is already recovered"
            method: "the whole commuted value is taxable"
          - when: "the contract is non-qualified and its investment is not yet recovered"
            method: "the taxable part is the commuted value less the investment still unrecovered, never below zero"
          - when: "otherwise"
            method: "the taxable part is the commuted value less the commuted value times the exclusion ratio"
        baseline:
          taxable: "commuted - RND(commuted * F('exclusion_ratio'), 2)"
        evidence: [history]
        cross_difficulty: null
      - id: commuted_value_investment_in_contract
        effect: method
        decides: investment
        bindings: [investment]
        ladder:
          - when: "the contract was bought by annuitizing an Ashgrove fixed indexed annuity or an Ashgrove deferred fixed annuity"
            method: "the investment in the contract is the cost basis of the annuity annuitized"
          - when: "the contract is a traditional or SEP IRA not bought by annuitizing an Ashgrove deferred annuity"
            method: "the investment in the contract is zero"
          - when: "otherwise"
            method: "the investment in the contract is the purchase amount"
        baseline:
          investment: "F('purchase_amount')"
        evidence: [cross_category]
        cross_difficulty: fixed
      - id: commuted_value_withholding_rate
        effect: parameter
        decides: withholding_rate
        bindings: [elected_rate, withholding_rate]
        ladder:
          - when: "the commutation election carries a withholding rate chosen by the beneficiary"
            value: "the rate chosen on the election"
          - when: "the election carries no rate and the payee is a beneficiary other than the owner"
            value: "K('lump_sum_default_rate')"
          - when: "otherwise"
            value: "F('federal_withholding_pct') — the rate on the contract's withholding election"
        baseline:
          withholding_rate: "F('federal_withholding_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: commuted_value_state_tax
        effect: parameter
        decides: state_tax
        bindings: [federal_withheld_12m, state_tax]
        ladder:
          - when: "the contract was issued in Iowa, Minnesota, North Carolina or Vermont, federal tax is withheld from the commuted value and federal tax was withheld from the contract's installments falling due in the twelve months before the payment"
            value: "K('state_flat_rate') of the taxable part"
          - when: "the contract was issued in Delaware, New York or Oklahoma, federal tax is withheld from the commuted value and federal tax was withheld from the contract's installments falling due in the twelve months before the payment"
            value: "K('state_alt_rate') of the taxable part"
          - when: "otherwise"
            value: "0 — no state tax"
        baseline:
          state_tax: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The gross amount paid is the commuted value carried on the latest approved commutation election. Its taxable part
        is the commuted value less a tax-free part equal to the commuted value times the exclusion ratio, rounded to the
        cent; federal tax is withheld from the taxable part at the rate on the contract's withholding election, rounded to
        the cent; no state tax is withheld; and the amount sent is the commuted value less the federal tax and the state
        tax.
      params: []
    inputs:
      history:
        - {table: income_service_requests, aggregate: latest, field: requested_amount, filters: {request_type: commutation_election}}
        - {table: income_transactions, aggregate: sum, field: federal_withholding_amount, within_months: 12, filters: {event_type: income_payment_issued}}
      cross_category: [indexed, fixed]
  - id: income_ext_returned_installment_reissue
    base_policy_refs: [income_proof_of_life_and_suspension, income_evt_overpayment_recovery, income_payment_schedule, income_evt_returned_payment]
    overwrite:
      - base_policy: income_proof_of_life_and_suspension
        superseded_clause: >-
          Installments falling due while suspended are held and earn no interest when suspended_payments_earn_interest is
          false.
        replaced_by: >-
          Interest on the reissued installment is added at the group delay rate for a contract issued in Connecticut,
          Minnesota, New Jersey or New York when more than the group late days have passed since its payment date; at the
          other-state late rate for a contract issued in any other state when more than the other-state late days have
          passed since that date; and otherwise no interest is added.
      - base_policy: income_payment_schedule
        superseded_clause: >-
          On a non-qualified contract where exclusion_ratio_applies is true, each installment is split into a tax-free part
          equal to the installment times the exclusion ratio and a taxable remainder, until the total tax-free amount equals
          the purchase amount, after which the whole installment is taxable; IRA installments are fully taxable.
        replaced_by: >-
          The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase amount,
          times the exclusion ratio, rounded to the cent; the tax-free part of the reissued installment is that installment
          times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less the
          tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole
          reissued installment is taxable.
    trigger: state_due
    subject: [income_held_payment_released, income_payment_issued]
    computes: net_paid_amount
    target_tool: reissue_returned_installment_7c2be31a
    params:
      group_delay_rate: 0.0600
      other_late_rate: 0.0500
      group_late_days: 30
      other_late_days: 60
      state_flat_rate: 0.05
      state_alt_rate: 0.04
    rule: >-
      An installment that came back returned and is held in suspense is reissued in one payment, by the tier's reissue
      method for returned payments, once confirmed payment instructions are on file: to the payee named on it while that
      payee is living, and otherwise, for an installment that fell due on or before an annuitant's death, to the surviving
      joint annuitant or to the beneficiary now receiving the payments. A returned installment held in suspense is reissued
      at its held amount. Its taxable part is the reissued installment less a tax-free part equal to that installment times
      the exclusion ratio, rounded to the cent. Federal tax is withheld from the taxable part at the rate on the contract's
      withholding election, rounded to the cent, no state tax is withheld and no interest is added. The amount sent is the
      reissued installment plus any interest, less the federal tax and the state tax. The investment in the contract is,
      for a contract bought by annuitizing an Ashgrove deferred fixed annuity or an Ashgrove fixed indexed annuity, the cost
      basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase
      amount. The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase
      amount, times the exclusion ratio, rounded to the cent; the tax-free part of the reissued installment is that
      installment times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less
      the tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole
      reissued installment is taxable. Interest on the reissued installment is added at the group delay rate for a contract
      issued in Connecticut, Minnesota, New Jersey or New York when more than the group late days have passed since its
      payment date; at the other-state late rate for a contract issued in any other state when more than the other-state
      late days have passed since that date; and otherwise no interest is added. For a contract issued in Connecticut,
      Minnesota, New Jersey or New York the interest on the reissued installment runs for the actual days from its payment
      date to the reissue date; for a contract issued in any other state it runs from the date the confirmed payment
      instructions were received to the reissue date; and with no confirmed instructions on file it runs for no days.
      Interest is simple, over 365 days, and rounded to the cent. State tax is withheld from the reissued installment only
      when federal tax is withheld from it and federal tax was withheld from the contract's installments falling due in the
      twelve months before the reissue: at the state flat rate on the taxable part for a contract issued in Iowa, Minnesota,
      North Carolina or Vermont, and at the alternative state rate on the taxable part for a contract issued in Delaware,
      New York or Oklahoma; otherwise no state tax is withheld from the reissued installment. Each tax is rounded to the cent
      on its own.
    prerequisite: []
    cross_category:
      - category: fixed
        as: branch
        reads: [cost_basis]
        note: The investment-in-the-contract factor reads the cost basis of the Ashgrove deferred fixed annuity annuitized into the contract.
      - category: indexed
        as: branch
        reads: [cost_basis]
        note: The same factor reads the cost basis of an Ashgrove fixed indexed annuity annuitized into the contract.
    compute:
      - in_rate_group: "F('issue_state') == 'CT' or F('issue_state') == 'MN' or F('issue_state') == 'NJ' or F('issue_state') == 'NY'"
      - returned_due: "LATEST('income_transactions', 'payment_due_date', date_field='payment_due_date', event_type='income_payment_held', hold_reason='returned_payment')"
      - returned_gross: "SUM('income_transactions', 'amount', event_type='income_payment_held', hold_reason='returned_payment', payment_due_date=returned_due)"
      - investment: "(CFIELD('indexed', 'cost_basis', indexed_contract_id=F('source_indexed_contract_id')) if F('purchase_source') == 'ashgrove_indexed_annuitization' else CFIELD('fixed', 'cost_basis', fixed_contract_id=F('source_fixed_contract_id'))) if (F('purchase_source') == 'ashgrove_indexed_annuitization' or F('purchase_source') == 'ashgrove_fixed_annuitization') else (0 if (F('tax_qualification') == 'traditional_ira' or F('tax_qualification') == 'sep_ira') else F('purchase_amount'))"
      - recovered: "RND((F('purchase_amount') - F('unreturned_premium')) * F('exclusion_ratio'), 2)"
      - tax_free: "MX(0, MN(RND(returned_gross * F('exclusion_ratio'), 2), investment - recovered))"
      - taxable: "returned_gross - tax_free"
      - federal_tax: "RND(taxable * F('federal_withholding_pct'), 2)"
      - held_days: "DAYS(returned_due, NOW)"
      - interest_rate: "K('group_delay_rate') if (in_rate_group and held_days > K('group_late_days')) else (K('other_late_rate') if ((not in_rate_group) and held_days > K('other_late_days')) else 0)"
      - instructions_date: "LATEST('income_service_requests', 'received_date', date_field='received_date', request_type='bank_change', request_status='completed')"
      - interest_days: "DAYS(returned_due, NOW) if in_rate_group else (DAYS(instructions_date, NOW) if instructions_date != None else 0)"
      - interest: "RND(returned_gross * interest_rate * interest_days / 365, 2)"
      - federal_withheld_12m: "SUM('income_transactions', 'federal_withholding_amount', within_months=12, date_field='payment_due_date', event_type='income_payment_issued')"
      - state_tax: "RND(taxable * K('state_flat_rate'), 2) if ((F('issue_state') == 'IA' or F('issue_state') == 'MN' or F('issue_state') == 'NC' or F('issue_state') == 'VT') and federal_tax > 0 and federal_withheld_12m > 0) else (RND(taxable * K('state_alt_rate'), 2) if ((F('issue_state') == 'DE' or F('issue_state') == 'NY' or F('issue_state') == 'OK') and federal_tax > 0 and federal_withheld_12m > 0) else 0)"
      - result: "RND(returned_gross + interest - federal_tax - state_tax, 2)"
    compute_basis:
      in_rate_group: "for a contract issued in Connecticut, Minnesota, New Jersey or New York"
      returned_due: "An installment that came back returned and is held in suspense"
      returned_gross: "A returned installment held in suspense is reissued at its held amount."
      investment: "The investment in the contract is, for a contract bought by annuitizing an Ashgrove deferred fixed annuity or an Ashgrove fixed indexed annuity, the cost basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase amount."
      recovered: "The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase amount, times the exclusion ratio, rounded to the cent"
      tax_free: "the tax-free part of the reissued installment is that installment times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less the tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole reissued installment is taxable."
      taxable: "Its taxable part is the reissued installment less a tax-free part"
      federal_tax: "Federal tax is withheld from the taxable part at the rate on the contract's withholding election, rounded to the cent"
      held_days: "when more than the group late days have passed since its payment date"
      interest_rate: "Interest on the reissued installment is added at the group delay rate for a contract issued in Connecticut, Minnesota, New Jersey or New York when more than the group late days have passed since its payment date; at the other-state late rate for a contract issued in any other state when more than the other-state late days have passed since that date; and otherwise no interest is added."
      instructions_date: "from the date the confirmed payment instructions were received to the reissue date"
      interest_days: "For a contract issued in Connecticut, Minnesota, New Jersey or New York the interest on the reissued installment runs for the actual days from its payment date to the reissue date; for a contract issued in any other state it runs from the date the confirmed payment instructions were received to the reissue date; and with no confirmed instructions on file it runs for no days."
      interest: "Interest is simple, over 365 days, and rounded to the cent."
      federal_withheld_12m: "federal tax was withheld from the contract's installments falling due in the twelve months before the reissue"
      state_tax: "State tax is withheld from the reissued installment only when federal tax is withheld from it and federal tax was withheld from the contract's installments falling due in the twelve months before the reissue: at the state flat rate on the taxable part for a contract issued in Iowa, Minnesota, North Carolina or Vermont, and at the alternative state rate on the taxable part for a contract issued in Delaware, New York or Oklahoma; otherwise no state tax is withheld from the reissued installment."
      result: "The amount sent is the reissued installment plus any interest, less the federal tax and the state tax."
    factors:
      - id: reissue_investment_in_contract
        effect: method
        decides: investment
        bindings: [investment]
        ladder:
          - when: "the contract was bought by annuitizing an Ashgrove deferred fixed annuity or an Ashgrove fixed indexed annuity"
            method: "the investment in the contract is the cost basis of the annuity annuitized"
          - when: "the contract is a traditional or SEP IRA not bought by annuitizing an Ashgrove deferred annuity"
            method: "the investment in the contract is zero"
          - when: "otherwise"
            method: "the investment in the contract is the purchase amount"
        baseline:
          investment: "F('purchase_amount')"
        evidence: [cross_category]
        cross_difficulty: fixed
      - id: reissue_interest_rate
        effect: parameter
        decides: interest_rate
        bindings: [held_days, interest_rate]
        ladder:
          - when: "the contract was issued in Connecticut, Minnesota, New Jersey or New York and more than the group late days have passed since the returned installment's payment date"
            value: "K('group_delay_rate')"
          - when: "the contract was issued in any other state and more than the other-state late days have passed since that payment date"
            value: "K('other_late_rate')"
          - when: "otherwise"
            value: "0 — no interest"
        baseline:
          interest_rate: "0"
        evidence: [date]
        cross_difficulty: null
      - id: reissue_interest_period
        effect: method
        decides: interest_days
        bindings: [instructions_date, interest_days]
        ladder:
          - when: "the contract was issued in Connecticut, Minnesota, New Jersey or New York"
            method: "interest runs for the actual days from the installment's payment date to the reissue date"
          - when: "the contract was issued in any other state and confirmed payment instructions are on file"
            method: "interest runs for the actual days from the date the confirmed instructions were received to the reissue date"
          - when: "otherwise"
            method: "interest runs for no days"
        baseline:
          interest_days: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: reissue_state_tax
        effect: parameter
        decides: state_tax
        bindings: [federal_withheld_12m, state_tax]
        ladder:
          - when: "the contract was issued in Iowa, Minnesota, North Carolina or Vermont, federal tax is withheld from the reissued installment and federal tax was withheld from the contract's installments falling due in the twelve months before the reissue"
            value: "K('state_flat_rate') of the taxable part"
          - when: "the contract was issued in Delaware, New York or Oklahoma, federal tax is withheld from the reissued installment and federal tax was withheld from the contract's installments falling due in the twelve months before the reissue"
            value: "K('state_alt_rate') of the taxable part"
          - when: "otherwise"
            value: "0 — no state tax"
        baseline:
          state_tax: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A returned installment held in suspense is reissued at its held amount. Its taxable part is the reissued installment
        less a tax-free part equal to that installment times the exclusion ratio, rounded to the cent. Federal tax is
        withheld from the taxable part at the rate on the contract's withholding election, rounded to the cent, no state tax
        is withheld and no interest is added. The amount sent is the reissued installment plus any interest, less the federal
        tax and the state tax.
      params: []
    inputs:
      history:
        - {table: income_transactions, aggregate: sum, field: amount, filters: {event_type: income_payment_held, hold_reason: returned_payment}}
        - {table: income_transactions, aggregate: sum, field: federal_withholding_amount, within_months: 12, filters: {event_type: income_payment_issued}}
        - {table: income_service_requests, aggregate: latest, field: received_date, filters: {request_type: bank_change}}
      cross_category: [fixed, indexed]
  - id: income_ext_post_death_excess_repayment
    base_policy_refs: [income_evt_overpayment_recovery, income_death_of_annuitant]
    overwrite:
      - base_policy: income_evt_overpayment_recovery
        superseded_clause: >-
          An installment paid for a payment date after the date of death that ended it is an overpayment, recorded once per
          installment.
        replaced_by: >-
          An overpayment on a deposit paid after a death is recorded once against that deposit; on a joint-and-survivor tier the overpayment on a deposit paid after the first death is the part of it the surviving payee was not entitled to.
      - base_policy: income_death_of_annuitant
        superseded_clause: >-
          Every installment paid for a payment date after the date of death that ended it is an overpayment under
          income_evt_overpayment_recovery.
        replaced_by: >-
          On a joint-and-survivor tier whose contract is continuing to the survivor, the excess of a deposit whose payment
          date fell after the first death is the deposit less the survivor's entitlement for that payment date; on a
          period-certain tier, a deposit falling due on or before the certain period end date has no excess, being owed to
          the beneficiary; otherwise the whole deposit is the excess.
      - base_policy: income_evt_overpayment_recovery
        superseded_clause: >-
          Ashgrove first asks the bank to return a post-death direct deposit within overpayment_reclamation_window_days of
          the deposit; what the bank does not return is requested from the estate or the person who received it.
        replaced_by: >-
          A deposit paid to the surviving payee after the survivor continuation took effect is not asked back from the bank,
          because the payee entitled to the continuing payments received it; what is owed back on it is recovered from that
          payee, and any other deposit made after a death is first asked back from the bank within the reclamation window,
          the rest being requested from the estate or the person who received it.
      - base_policy: income_evt_overpayment_recovery
        superseded_clause: >-
          Where payments continue to a survivor or beneficiary, an unrecovered overpayment may be offset against those
          payments, taking no more than overpayment_offset_max_pct of each gross installment, rounded to the cent.
        replaced_by: >-
          The part of the overpayment to be recovered by offset is the overpayment offset maximum percentage of the
          survivor percentage of the installment held for the latest payment date after the first death, each rounded to
          the cent and never more than the overpayment, when such an installment is held for the surviving payee; it is the
          overpayment offset maximum percentage of the survivor installment now on the contract, rounded to the cent and
          never more than the overpayment, when nothing is held and the survivor's next installment falls due within the
          cutoff days; otherwise nothing is recovered by offset.
    trigger: on_request
    subject: [income_overpayment_identified, income_overpayment_recovered]
    computes: repayment_amount
    target_tool: settle_post_death_deposit_f655a739
    params:
      whole_excess_share: 1.0
      cutoff_days: 10
    rule: >-
      A deposit paid to the surviving payee after the survivor continuation took effect is not asked back from the bank,
      because the payee entitled to the continuing payments received it; what is owed back on it is recovered from that
      payee, and any other deposit made after a death is first asked back from the bank within the reclamation window, the
      rest being requested from the estate or the person who received it. The payee may settle the overpayment on such a
      deposit directly: the overpayment owed and the payee's repayment are recorded together against that deposit, and any part of the overpayment not repaid stays owed on the contract to be recovered by offset. An overpayment on a deposit paid after a death is recorded once against that deposit; on a joint-and-survivor tier the overpayment on a deposit paid after the first death is the part of it the surviving payee was not entitled to. The deposit concerned is the
      installment most recently issued on the contract. The whole deposit is the excess, nothing of it is kept as the
      survivor's entitlement, the overpayment is the whole excess, nothing is recovered by offset, and the payee repays the
      whole overpayment. On a joint-and-survivor tier whose contract is continuing to the survivor, the excess of a deposit
      whose payment date fell after the first death is the deposit less the survivor's entitlement for that payment date;
      on a period-certain tier, a deposit falling due on or before the certain period end date has no excess, being owed to
      the beneficiary; otherwise the whole deposit is the excess. On a joint-and-survivor tier, when the deposit was paid at
      more than the survivor installment now on the contract, the survivor's entitlement for its payment date is the tier's
      survivor continuation percentage of the deposit, rounded to the cent; when it was paid at no more than that survivor
      installment, the whole deposit is the survivor's entitlement; otherwise nothing of the deposit is the survivor's
      entitlement. The share of the excess owed back is one less the federal tax withheld from the deposit divided by the
      deposit when the deposit was paid in the current calendar year with federal tax withheld and no bank return is
      recorded against it, because Ashgrove recovers the tax it withheld in the same year through its own withholding
      adjustment; it is one less the amount the bank returned divided by the deposit when a bank return is recorded against
      the deposit; otherwise the whole excess is owed back. The overpayment owed is the excess times that share, rounded to
      the cent. The part of the overpayment to be recovered by offset is the overpayment offset maximum percentage of the
      survivor percentage of the installment held for the latest payment date after the first death, each rounded to the
      cent and never more than the overpayment, when such an installment is held for the surviving payee; it is the
      overpayment offset maximum percentage of the survivor installment now on the contract, rounded to the cent and never
      more than the overpayment, when nothing is held and the survivor's next installment falls due within the cutoff days;
      otherwise nothing is recovered by offset. The amount the payee repays now is the overpayment owed less the part to be
      recovered by offset.
    prerequisite: []
    cross_category: []
    compute:
      - deposit_id: "LATEST('income_transactions', 'income_txn_id', date_field='payment_due_date', event_type='income_payment_issued')"
      - deposit: "LATEST('income_transactions', 'amount', date_field='payment_due_date', event_type='income_payment_issued')"
      - deposit_due: "LATEST('income_transactions', 'payment_due_date', date_field='payment_due_date', event_type='income_payment_issued')"
      - deposit_date: "LATEST('income_transactions', 'transaction_date', date_field='payment_due_date', event_type='income_payment_issued')"
      - deposit_withheld: "SUM('income_transactions', 'federal_withholding_amount', event_type='income_payment_issued', income_txn_id=deposit_id)"
      - entitlement: "RND(deposit * P('survivor_continuation_pct'), 2) if (P('payout_basis') == 'joint_survivor' and deposit > F('current_payment_amount')) else (deposit if P('payout_basis') == 'joint_survivor' else 0)"
      - deposit_days_after_death: "DAYS(F('first_death_date'), deposit_due)"
      - excess: "deposit - entitlement if (P('payout_basis') == 'joint_survivor' and deposit_days_after_death > 0 and F('status') == 'survivor_continuing') else (0 if (P('payout_basis') == 'life_period_certain' and DAYS(deposit_due, F('certain_period_end_date')) >= 0) else deposit)"
      - bank_returned: "SUM('income_transactions', 'amount', event_type='income_overpayment_recovered', recovery_method='bank_reclamation', source_txn_id=deposit_id)"
      - same_year: "int(MONTHS('0001-01-01', deposit_date) / 12) == int(MONTHS('0001-01-01', NOW) / 12)"
      - repay_share: "1 - deposit_withheld / deposit if (same_year and deposit_withheld > 0 and bank_returned == 0) else (1 - bank_returned / deposit if bank_returned > 0 else K('whole_excess_share'))"
      - overpayment_owed: "RND(excess * repay_share, 2)"
      - held_due: "LATEST('income_transactions', 'payment_due_date', date_field='payment_due_date', event_type='income_payment_held')"
      - held_amount: "SUM('income_transactions', 'amount', event_type='income_payment_held', payment_due_date=held_due)"
      - held_days_after_death: "DAYS(F('first_death_date'), held_due) if held_due != None else 0"
      - offset_to_come: "MN(overpayment_owed, RND(RND(held_amount * P('survivor_continuation_pct'), 2) * P('overpayment_offset_max_pct'), 2)) if (held_amount > 0 and held_days_after_death > 0 and F('status') == 'survivor_continuing') else (MN(overpayment_owed, RND(F('current_payment_amount') * P('overpayment_offset_max_pct'), 2)) if (F('status') == 'survivor_continuing' and DAYS(NOW, F('next_payment_date')) <= K('cutoff_days')) else 0)"
      - result: "RND(overpayment_owed - offset_to_come, 2)"
    compute_basis:
      deposit_id: "The deposit concerned is the installment most recently issued on the contract."
      deposit: "The deposit concerned is the installment most recently issued on the contract."
      deposit_due: "a deposit whose payment date fell after the first death"
      deposit_date: "when the deposit was paid in the current calendar year"
      deposit_withheld: "one less the federal tax withheld from the deposit divided by the deposit"
      entitlement: "On a joint-and-survivor tier, when the deposit was paid at more than the survivor installment now on the contract, the survivor's entitlement for its payment date is the tier's survivor continuation percentage of the deposit, rounded to the cent; when it was paid at no more than that survivor installment, the whole deposit is the survivor's entitlement; otherwise nothing of the deposit is the survivor's entitlement."
      deposit_days_after_death: "a deposit whose payment date fell after the first death"
      excess: "On a joint-and-survivor tier whose contract is continuing to the survivor, the excess of a deposit whose payment date fell after the first death is the deposit less the survivor's entitlement for that payment date; on a period-certain tier, a deposit falling due on or before the certain period end date has no excess, being owed to the beneficiary; otherwise the whole deposit is the excess."
      bank_returned: "when a bank return is recorded against the deposit"
      same_year: "when the deposit was paid in the current calendar year"
      repay_share: "The share of the excess owed back is one less the federal tax withheld from the deposit divided by the deposit when the deposit was paid in the current calendar year with federal tax withheld and no bank return is recorded against it, because Ashgrove recovers the tax it withheld in the same year through its own withholding adjustment; it is one less the amount the bank returned divided by the deposit when a bank return is recorded against the deposit; otherwise the whole excess is owed back."
      overpayment_owed: "The overpayment owed is the excess times that share, rounded to the cent."
      held_due: "the installment held for the latest payment date after the first death"
      held_amount: "the survivor percentage of the installment held for the latest payment date after the first death"
      held_days_after_death: "the latest payment date after the first death"
      offset_to_come: "The part of the overpayment to be recovered by offset is the overpayment offset maximum percentage of the survivor percentage of the installment held for the latest payment date after the first death, each rounded to the cent and never more than the overpayment, when such an installment is held for the surviving payee; it is the overpayment offset maximum percentage of the survivor installment now on the contract, rounded to the cent and never more than the overpayment, when nothing is held and the survivor's next installment falls due within the cutoff days; otherwise nothing is recovered by offset."
      result: "The amount the payee repays now is the overpayment owed less the part to be recovered by offset."
    factors:
      - id: repayment_excess_of_deposit
        effect: method
        decides: excess
        bindings: [deposit_days_after_death, excess]
        ladder:
          - when: "a joint-and-survivor tier whose contract is continuing to the survivor, and the deposit's payment date fell after the first death"
            method: "the excess is the deposit less the survivor's entitlement for that payment date"
          - when: "a period-certain tier and the deposit fell due on or before the certain period end date"
            method: "the deposit has no excess"
          - when: "otherwise"
            method: "the whole deposit is the excess"
        baseline:
          excess: "deposit"
        evidence: [history, date]
        cross_difficulty: null
      - id: repayment_survivor_entitlement
        effect: method
        decides: entitlement
        bindings: [deposit, entitlement]
        ladder:
          - when: "a joint-and-survivor tier and the deposit was paid at more than the survivor installment now on the contract"
            method: "the entitlement is the tier's survivor continuation percentage of the deposit, rounded to the cent"
          - when: "a joint-and-survivor tier and the deposit was paid at no more than the survivor installment now on the contract"
            method: "the whole deposit is the entitlement"
          - when: "otherwise"
            method: "nothing of the deposit is the entitlement"
        baseline:
          entitlement: "0"
        evidence: [history]
        cross_difficulty: null
      - id: repayment_share_of_excess
        effect: parameter
        decides: repay_share
        bindings: [deposit_id, deposit_date, deposit_withheld, bank_returned, same_year, repay_share]
        ladder:
          - when: "the deposit was paid in the current calendar year with federal tax withheld and no bank return is recorded against it"
            value: "one less the federal tax withheld divided by the deposit"
          - when: "a bank return is recorded against the deposit"
            value: "one less the amount the bank returned divided by the deposit"
          - when: "otherwise"
            value: "K('whole_excess_share') — the whole excess"
        baseline:
          repay_share: "K('whole_excess_share')"
        evidence: [history, date]
        cross_difficulty: null
      - id: repayment_part_left_to_offset
        effect: parameter
        decides: offset_to_come
        bindings: [held_due, held_amount, held_days_after_death, offset_to_come]
        ladder:
          - when: "an installment for a payment date after the first death is held for the surviving payee"
            value: "P('overpayment_offset_max_pct') of the survivor percentage of that held installment, never more than the overpayment"
          - when: "nothing is held and the survivor's next installment falls due within the cutoff days"
            value: "P('overpayment_offset_max_pct') of the survivor installment now on the contract, never more than the overpayment"
          - when: "otherwise"
            value: "0 — nothing left to offset"
        baseline:
          offset_to_come: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The deposit concerned is the installment most recently issued on the contract. The whole deposit is the excess,
        nothing of it is kept as the survivor's entitlement, the overpayment is the whole excess, nothing is recovered by
        offset, and the payee repays the whole overpayment.
      params: []
    inputs:
      history:
        - {table: income_transactions, aggregate: latest, field: amount, filters: {event_type: income_payment_issued}}
        - {table: income_transactions, aggregate: sum, field: amount, filters: {event_type: income_payment_held}}
        - {table: income_transactions, aggregate: sum, field: amount, filters: {event_type: income_overpayment_recovered, recovery_method: bank_reclamation}}
