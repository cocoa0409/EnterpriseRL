events:
  # ---- contract changes on income_holdings ----
  - type: income_contract_issued
    target: income_holdings
    mutation: create
    meaning: "An income annuity is purchased — with new money, exchange or transfer funds, or by annuitizing an Ashgrove deferred annuity — and recorded as applied until the purchase amount is in good order."
    grain: "one row per contract"
    fields:
      customer_id: "the owner"
      contract_number: "the contract number"
      variant_name: "the official tier name"
      annuitant_name: "the annuitant"
      annuitant_date_of_birth: "the annuitant's date of birth"
      joint_annuitant_name: "the joint annuitant on a joint tier; empty otherwise"
      joint_annuitant_date_of_birth: "the joint annuitant's date of birth; empty otherwise"
      owner_is_annuitant: "whether the owner is the annuitant"
      issue_state: "state of issue"
      issue_date: "the contract date"
      issue_age: "annuitant's age last birthday on the issue date"
      tax_qualification: "non-qualified or the IRA type"
      purchase_amount: "the single premium applied"
      purchase_source: "origin of the purchase money"
      source_fixed_contract_id: "the Ashgrove deferred fixed annuity annuitized into this contract; empty otherwise"
      source_indexed_contract_id: "the Ashgrove fixed indexed annuity annuitized into this contract; empty otherwise"
      payment_frequency: "installment frequency"
      payment_day: "day of month payments are made"
      first_payment_date: "date of the first installment"
      current_payment_amount: "the gross installment"
      cola_pct: "annual cost-of-living increase chosen"
      certain_period_end_date: "last date of the period certain; empty when none"
      pricing_interest_rate: "interest rate used to price the contract"
      exclusion_ratio: "tax-free share of each payment for a non-qualified contract"
      payment_method: "direct deposit or check"
      federal_withholding_pct: "elected federal withholding rate on periodic payments"
    triggers:
      - event: income:income_premium_received
        map: {amount: purchase_amount, transaction_date: issue_date}
      - event: income:income_beneficiary_designated
        map: {designation_effective_date: issue_date}
  - type: income_payments_started
    target: income_holdings
    mutation: {transition: {from: applied, to: income_active}}
    meaning: "The purchase amount is in good order, the contract is delivered and the income schedule is set."
    grain: "one row per transaction"
    fields:
      status: "becomes income_active"
      contract_delivery_date: "date the owner received the contract"
      next_payment_date: "the first installment date"
    triggers: []
  - type: income_application_declined
    target: income_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The application is declined or withdrawn before issue."
    grain: "one row per transaction"
    fields:
      status: "becomes declined"
      termination_date: "date of the decline"
    triggers:
      - event: income:income_purchase_refunded
        map: {refund_reason: application_declined, transaction_date: termination_date}
  - type: income_payments_suspended
    target: income_holdings
    mutation: {transition: {from: income_active, to: payments_suspended}}
    meaning: "Payments are suspended for an overdue proof of life, an undeliverable payment, or an unverified report of death."
    grain: "one row per transaction"
    fields:
      status: "becomes payments_suspended"
      suspension_reason: "proof_of_life_overdue, returned_payment or death_report_unverified"
      suspension_date: "date payments were suspended"
    triggers: []
  - type: income_payments_resumed
    target: income_holdings
    mutation: {transition: {from: payments_suspended, to: income_active}}
    meaning: "The suspension is cleared and the schedule resumes."
    grain: "one row per transaction"
    fields:
      status: "becomes income_active"
      suspension_reason: "cleared to none"
      last_proof_of_life_date: "date of the certificate of existence received, when that cleared the suspension"
    triggers: []
  - type: income_death_claim_registered
    target: income_holdings
    mutation: {transition: [{from: income_active, to: death_claim_pending}, {from: payments_suspended, to: death_claim_pending}, {from: survivor_continuing, to: death_claim_pending}]}
    meaning: "Notice of an annuitant's death is registered and further payments stop pending the claim."
    grain: "one row per transaction"
    fields:
      status: "becomes death_claim_pending"
    triggers: []
  - type: income_survivor_continuation
    target: income_holdings
    mutation: {transition: {from: death_claim_pending, to: survivor_continuing}}
    meaning: "The first death on a joint contract is confirmed and payments continue to the survivor at the survivor percentage."
    grain: "one row per transaction"
    fields:
      status: "becomes survivor_continuing"
      first_death_date: "date of the first death"
      current_payment_amount: "the survivor installment"
    triggers: []
  - type: income_beneficiary_continuation
    target: income_holdings
    mutation: {transition: {from: death_claim_pending, to: beneficiary_continuing}}
    meaning: "The annuitant died within the period certain and the remaining certain payments continue to the beneficiary."
    grain: "one row per transaction"
    fields:
      status: "becomes beneficiary_continuing"
      first_death_date: "the annuitant's date of death"
      payee_customer_id: "the beneficiary's customer profile, who now receives the payments"
      payment_method: "the beneficiary's payment method"
    triggers: []
  - type: income_contract_completed
    target: income_holdings
    mutation: {transition: [{from: death_claim_pending, to: completed}, {from: beneficiary_continuing, to: completed}]}
    meaning: "All obligations under the contract are fulfilled."
    grain: "one row per transaction"
    fields:
      status: "becomes completed"
      termination_date: "date the last obligation was fulfilled"
    triggers: []
  - type: income_free_look_cancelled
    target: income_holdings
    mutation: {transition: {from: income_active, to: cancelled_free_look}}
    meaning: "The owner returns the contract within the free-look period."
    grain: "one row per transaction"
    fields:
      status: "becomes cancelled_free_look"
      termination_date: "date the returned contract was received"
    triggers:
      - event: income:income_purchase_refunded
        map: {refund_reason: free_look, transaction_date: termination_date}
  - type: income_payment_instructions_changed
    target: income_holdings
    mutation: update
    meaning: "The payment method or bank account for payments is changed."
    grain: "one row per transaction"
    fields:
      payment_method: "direct deposit or check"
      bank_account_last4: "last four digits of the new deposit account; empty for check"
      bank_routing_number: "routing number of the new deposit account; empty for check"
      instructions_effective_date: "the first payment date the new instructions apply to"
    triggers: []
  - type: income_address_changed
    target: income_holdings
    mutation: update
    meaning: "The mailing address for checks and tax forms on the contract is changed."
    grain: "one row per transaction"
    fields:
      payment_mailing_address: "the new mailing address, as given by the owner"
      last_address_change_date: "date the change was recorded"
    triggers: []
  - type: income_withholding_changed
    target: income_holdings
    mutation: update
    meaning: "The owner files a new federal withholding election for periodic payments."
    grain: "one row per transaction"
    fields:
      federal_withholding_pct: "the elected withholding rate; 0 for no withholding"
      withholding_effective_date: "the first payment date the election applies to"
    triggers: []
  - type: income_payment_amount_changed
    target: income_holdings
    mutation: update
    meaning: "The installment changes — by the cost-of-living increase on an anniversary, or by the survivor reduction."
    grain: "one row per transaction"
    fields:
      current_payment_amount: "the new gross installment"
      next_payment_date: "the next installment date"
    triggers: []
  - type: income_proof_of_life_requested
    target: income_holdings
    mutation: update
    meaning: "Ashgrove requests a certificate of existence from an annuitant who has reached the proof-of-life age."
    grain: "one row per transaction"
    fields:
      proof_of_life_due_date: "date by which the certificate must be returned"
    triggers: []
  # ---- ledger rows on income_transactions ----
  - type: income_premium_received
    target: income_transactions
    meaning: "The purchase amount is received and applied."
    grain: "one row per purchase receipt"
    distinguish_by: [transaction_date, premium_source]
    fields:
      transaction_date: "date received in good order"
      amount: "purchase amount applied"
      premium_source: "origin of the money"
    account: unreturned_premium
    direction: in
    triggers: []
  - type: income_payment_issued
    target: income_transactions
    meaning: "One income installment is paid."
    grain: "one row per installment due date per payee"
    distinguish_by: [payment_due_date, payee_name]
    fields:
      transaction_date: "date issued"
      amount: "gross installment"
      payment_due_date: "scheduled installment date"
      payee_name: "who was paid"
      payment_method: "how"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      net_paid_amount: "amount paid after withholding and any overpayment offset"
    account: unreturned_premium
    direction: out
    triggers: []
  - type: income_payment_returned
    target: income_transactions
    meaning: "An issued payment comes back — a deposit rejected by the bank or a check returned undeliverable."
    grain: "one row per returned payment"
    distinguish_by: [source_txn_id]
    fields:
      transaction_date: "date of the return"
      amount: "gross installment returned"
      payment_due_date: "installment date of the returned payment"
      source_txn_id: "the payment returned"
      return_reason: "why it came back"
    account: unreturned_premium
    direction: in
    triggers:
      - event: income:income_payment_held
        map: {hold_reason: returned_payment, payment_due_date: payment_due_date, amount: amount, transaction_date: transaction_date}
  - type: income_payment_held
    target: income_transactions
    meaning: "An installment falling due during a suspension, or returned, is held in suspense."
    grain: "one row per held installment"
    distinguish_by: [payment_due_date, hold_reason]
    fields:
      transaction_date: "date held"
      amount: "gross installment held"
      payment_due_date: "installment date"
      hold_reason: "proof_of_life_overdue, returned_payment or death_report_unverified"
    account: suspense_held
    direction: in
    triggers: []
  - type: income_held_payment_released
    target: income_transactions
    meaning: "A held installment is released once the reason for holding it is cleared, or forfeited back to the contract at a confirmed death that ended it."
    grain: "one row per released installment"
    distinguish_by: [payment_due_date, release_outcome]
    fields:
      transaction_date: "date released"
      amount: "gross installment released"
      payment_due_date: "installment date"
      release_outcome: "paid when the payee was entitled to it, forfeited when the installment fell due after the death that ended it"
    account: suspense_held
    direction: out
    triggers:
      - event: income:income_payment_issued
        when: {release_outcome: paid}
        map: {payment_due_date: payment_due_date, amount: amount, transaction_date: transaction_date}
  - type: income_overpayment_identified
    target: income_transactions
    meaning: "A payment made for an installment falling due after the death that ended it is recorded as owed back."
    grain: "one row per overpaid installment"
    distinguish_by: [source_txn_id]
    fields:
      transaction_date: "date identified"
      amount: "gross installment overpaid"
      payment_due_date: "installment date"
      source_txn_id: "the payment made after death"
    account: overpayment_receivable
    direction: in
    triggers: []
  - type: income_overpayment_recovered
    target: income_transactions
    meaning: "An overpayment is recovered — returned by the bank, repaid by the estate or payee, or offset against continuing payments."
    grain: "one row per recovery"
    distinguish_by: [transaction_date, recovery_method]
    fields:
      transaction_date: "date recovered"
      amount: "amount recovered"
      recovery_method: "bank_reclamation, direct_repayment or payment_offset"
      source_txn_id: "the overpaid payment the recovery applies to"
    account: overpayment_receivable
    direction: out
    triggers: []
  - type: income_refund_benefit_paid
    target: income_transactions
    meaning: "The cash refund lump sum is paid to a beneficiary at the annuitant's death."
    grain: "one row per payee per refund claim"
    distinguish_by: [income_request_id, payee_name]
    fields:
      transaction_date: "date paid"
      amount: "refund share paid, excluding interest"
      interest_amount: "death-claim interest paid with it"
      payee_name: "beneficiary"
      income_request_id: "the death claim"
      payment_method: "how"
    account: unreturned_premium
    direction: out
    triggers: []
  - type: income_commuted_value_paid
    target: income_transactions
    meaning: "A beneficiary takes the commuted value of the remaining certain payments in one sum."
    grain: "one row per payee per commutation"
    distinguish_by: [income_request_id, payee_name]
    fields:
      transaction_date: "date paid"
      amount: "commuted value paid"
      discount_rate: "annual rate used to discount the remaining certain payments"
      payee_name: "beneficiary"
      income_request_id: "the beneficiary's commutation election"
      payment_method: "how"
    account: unreturned_premium
    direction: out
    triggers: []
  - type: income_purchase_refunded
    target: income_transactions
    meaning: "The purchase amount, less payments made, is refunded on free-look cancellation or a declined application."
    grain: "one row per refund"
    distinguish_by: [refund_reason]
    fields:
      transaction_date: "date refunded"
      amount: "amount refunded"
      refund_reason: "free_look or application_declined"
    account: unreturned_premium
    direction: out
    triggers: []
  - type: income_beneficiary_designated
    target: income_transactions
    meaning: "One beneficiary line of a designation is recorded; a later designation replaces the earlier one entirely."
    grain: "one row per beneficiary line per designation"
    distinguish_by: [designation_effective_date, beneficiary_class, beneficiary_name]
    fields:
      transaction_date: "date recorded"
      designation_effective_date: "date the owner signed the designation"
      beneficiary_name: "beneficiary as named"
      beneficiary_relationship: "relationship to the annuitant"
      beneficiary_class: "primary or contingent"
      share_percent: "whole-percent share within the class"
      designation_type: "revocable or irrevocable"
      income_request_id: "the signed change request; empty for the original designation"
    triggers: []

measures:
  - id: income_msr_payments_before_death
    window: "from the first payment date through the date of death being evaluated, inclusive"
    measure: "count of income_payment_issued rows on the contract whose payment_due_date falls in the window, less income_payment_returned rows for those installments"
  - id: income_msr_gross_paid_before_death
    window: "from the first payment date through the date of death being evaluated, inclusive"
    measure: "sum of amount over income_payment_issued rows on the contract whose payment_due_date falls in the window, less income_payment_returned rows for those installments"
  - id: income_msr_purchases_on_annuitant
    window: "point in time at the evaluation date"
    measure: "sum of purchase_amount over income_holdings on the same annuitant (annuitant_name and annuitant_date_of_birth) whose status is applied, income_active, payments_suspended or survivor_continuing"

policies:
  - id: income_agg_multi_holding
    subject: [income_contract_issued]
    rule: "An owner may hold any number of Ashgrove income annuities, including several on the same annuitant; the count is not capped. Purchases on one annuitant are aggregated under income_agg_purchase_limit."
    eligibility: []
    params:
      max_per_customer: null
  - id: income_agg_purchase_limit
    subject: [income_contract_issued, income_premium_received]
    rule: "Purchases are aggregated per annuitant, identified by annuitant name and date of birth, across every Ashgrove income annuity that is applied, income_active, payments_suspended or survivor_continuing. A purchase is accepted without home office approval only if income_msr_purchases_on_annuitant plus the new purchase amount does not exceed aggregate_purchase_limit_per_annuitant and the purchase itself does not exceed max_purchase_without_approval. A purchase made by annuitizing an Ashgrove deferred annuity counts toward the limit like any other purchase but is never refused for it; it is referred for approval only as to the excess, which is paid to the owner in cash."
    eligibility: []
    params:
      aggregate_purchase_limit_per_annuitant: 3000000
      max_purchase_without_approval: "=max_purchase_without_approval"
    measures: [income_msr_purchases_on_annuitant]
  - id: income_issue_and_purchase
    subject: [income_contract_issued, income_payments_started, income_application_declined, income_premium_received]
    rule: "A tier is issued only when the annuitant's age on the issue date is between min_issue_age and max_issue_age, and on a joint tier the younger annuitant is at least joint_min_age; the purchase amount must be at least min_purchase_nonqualified, or min_purchase_qualified for an IRA, and come from one of purchase_sources. The purchase amount is applied only while the contract status is applied. On an IRA contract the period certain may not exceed qualified_max_period_certain_years. The first payment date must be at least first_payment_min_days and no more than first_payment_max_months after the issue date, on a payment day from 1 to payment_day_max; the frequency is one of payment_frequencies, and an installment below min_payment_amount requires a less frequent mode. A cost-of-living increase rate may be chosen from cola_options at purchase only. The payout rate quoted at application is held for rate_lock_days while exchange or transfer funds are in transit; funds arriving later are priced at the rate in effect on arrival. The contract is irrevocable: it has no cash surrender value, the frequency cannot be changed when frequency_change_allowed is false, and payments cannot be assigned, sold or pledged when assignment_allowed is false. An application declined or withdrawn before issue has its money returned without interest."
    eligibility:
      - id: purchase_status
        applies_to: [income_premium_received]
        kind: state
        condition: "The purchase amount is applied only while the contract status is applied."
        evidence_fields: [income_holdings.status, income_holdings.income_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_holdings.income_contract_id]]
          action_bindings: {income_holdings.income_contract_id: income_contract_id}
        state_contract:
          field: income_holdings.status
          allowed: [applied]
    params:
      max_purchase_without_approval: "=max_purchase_without_approval"
      first_payment_min_days: "=first_payment_min_days"
      first_payment_max_months: "=first_payment_max_months"
      payment_day_max: "=payment_day_max"
      payment_frequencies: "=payment_frequencies"
      min_payment_amount: "=min_payment_amount"
      cola_options: "=cola_options"
      rate_lock_days: "=rate_lock_days"
      frequency_change_allowed: "=frequency_change_allowed"
      assignment_allowed: "=assignment_allowed"
      purchase_sources: "=purchase_sources"
      qualified_max_period_certain_years: "=qualified_max_period_certain_years"
      per_tier:
        Ashgrove Income Annuity Life Only: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", joint_min_age: "=joint_min_age", min_purchase_nonqualified: "=min_purchase_nonqualified", min_purchase_qualified: "=min_purchase_qualified"}
        Ashgrove Income Annuity Cash Refund: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", joint_min_age: "=joint_min_age", min_purchase_nonqualified: "=min_purchase_nonqualified", min_purchase_qualified: "=min_purchase_qualified"}
        Ashgrove Income Annuity 10-Year Certain: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", joint_min_age: "=joint_min_age", min_purchase_nonqualified: "=min_purchase_nonqualified", min_purchase_qualified: "=min_purchase_qualified"}
        Ashgrove Income Annuity 20-Year Certain: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", joint_min_age: "=joint_min_age", min_purchase_nonqualified: "=min_purchase_nonqualified", min_purchase_qualified: "=min_purchase_qualified"}
        Ashgrove Income Annuity Joint 50% Survivor: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", joint_min_age: "=joint_min_age", min_purchase_nonqualified: "=min_purchase_nonqualified", min_purchase_qualified: "=min_purchase_qualified"}
        Ashgrove Income Annuity Joint 100% Survivor: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", joint_min_age: "=joint_min_age", min_purchase_nonqualified: "=min_purchase_nonqualified", min_purchase_qualified: "=min_purchase_qualified"}
  - id: income_payment_schedule
    subject: [income_payment_issued, income_payment_amount_changed, income_withholding_changed]
    rule: "Installments are paid on each scheduled payment date while the contract status is income_active, survivor_continuing or beneficiary_continuing; while a death claim is pending, only installments that fell due on or before the date of death, held or unpaid, are issued, to the person entitled to them. An installment is issued only while the contract status is income_active, death_claim_pending, survivor_continuing or beneficiary_continuing. Where a cost-of-living rate was chosen, the installment increases by that rate, compounded, on each contract anniversary from cola_first_increase_anniversary onward, rounded to the cent. On a non-qualified contract where exclusion_ratio_applies is true, each installment is split into a tax-free part equal to the installment times the exclusion ratio and a taxable remainder, until the total tax-free amount equals the purchase amount, after which the whole installment is taxable; IRA installments are fully taxable. Federal tax is withheld at the rate on the owner's latest withholding election; with no election on file the withholding_default_periodic method applies. A new withholding election applies to installments whose payment date is at least withholding_change_cutoff_business_days business days after the election is received; earlier installments use the prior election."
    eligibility:
      - id: payable_status
        applies_to: [income_payment_issued]
        kind: state
        condition: "An installment is issued only while the contract status is income_active, death_claim_pending, survivor_continuing or beneficiary_continuing."
        evidence_fields: [income_holdings.status, income_holdings.income_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_holdings.income_contract_id]]
          action_bindings: {income_holdings.income_contract_id: income_contract_id}
        state_contract:
          field: income_holdings.status
          allowed: [income_active, death_claim_pending, survivor_continuing, beneficiary_continuing]
    params:
      cola_first_increase_anniversary: "=cola_first_increase_anniversary"
      exclusion_ratio_applies: "=exclusion_ratio_applies"
      withholding_default_periodic: "=withholding_default_periodic"
      withholding_change_cutoff_business_days: "=withholding_change_cutoff_business_days"
    formula:
      cola_payment: round(current_payment_amount * (1 + cola_pct), 2)
      taxable_amount: round(amount * (1 - exclusion_ratio), 2)
      federal_withholding_amount: round(taxable_amount * federal_withholding_pct, 2)
  - id: income_payment_instructions
    subject: [income_payment_instructions_changed, income_address_changed]
    rule: "The owner, or the payee receiving continuing payments, may change the payment method among payment_methods and the deposit account, and may change the mailing address. A payment instruction change is accepted only while the contract status is income_active, payments_suspended, survivor_continuing or beneficiary_continuing. Within address_change_bank_hold_days after the most recent address change, a bank account change is accepted only on a signed, signature-verified request. Otherwise a verified caller may change the account by phone. The deposit account must be in the name of the payee. A change received at least payment_change_cutoff_business_days business days before a payment date applies to that payment; a change received later applies from the following payment date."
    eligibility:
      - id: instruction_status
        applies_to: [income_payment_instructions_changed]
        kind: state
        condition: "A payment instruction change is accepted only while the contract status is income_active, payments_suspended, survivor_continuing or beneficiary_continuing."
        evidence_fields: [income_holdings.status, income_holdings.income_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_holdings.income_contract_id]]
          action_bindings: {income_holdings.income_contract_id: income_contract_id}
        state_contract:
          field: income_holdings.status
          allowed: [income_active, payments_suspended, survivor_continuing, beneficiary_continuing]
      - id: signed_bank_change_after_address_change
        applies_to: [income_payment_instructions_changed]
        kind: authorization
        condition: "Within address_change_bank_hold_days after the most recent address change, a bank account change is accepted only on a signed, signature-verified request."
        evidence_fields: [income_service_requests.request_type, income_service_requests.request_status, income_service_requests.signed_date, income_holdings.last_address_change_date, income_service_requests.income_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_service_requests.income_request_id]]
          action_bindings: {income_service_requests.income_request_id: income_request_id}
    params:
      payment_methods: "=payment_methods"
      address_change_bank_hold_days: "=address_change_bank_hold_days"
      payment_change_cutoff_business_days: "=payment_change_cutoff_business_days"
  - id: income_proof_of_life_and_suspension
    subject: [income_proof_of_life_requested, income_payments_suspended, income_payments_resumed, income_payment_held, income_held_payment_released]
    rule: "From the contract anniversary on or after an annuitant's attained age reaches proof_of_life_age, Ashgrove requests a certificate of existence every proof_of_life_frequency_months. When the certificate is not returned within proof_of_life_response_days of the request, payments are suspended. Payments are also suspended when a payment is returned undeliverable and no valid instructions are on file, and when a report of death is received that is not yet confirmed by a certified death certificate. Installments falling due while suspended are held and earn no interest when suspended_payments_earn_interest is false. A suspension is cleared only by the record that resolves it: a completed certificate of existence signed by the annuitant and dated after the request, confirmed new payment instructions, or, for a death report not confirmed within death_report_verification_days, the annuitant's own certificate of existence. Once cleared the schedule resumes and the held installments are released in one sum within held_payment_release_business_days business days. A returned payment is reissued by returned_payment_reissue_method once instructions are confirmed. When the suspension ends in a confirmed death instead, held installments falling due on or before the date of death are released to the estate or survivor and those falling due after it are forfeited."
    eligibility: []
    params:
      proof_of_life_age: "=proof_of_life_age"
      proof_of_life_frequency_months: "=proof_of_life_frequency_months"
      proof_of_life_response_days: "=proof_of_life_response_days"
      suspended_payments_earn_interest: "=suspended_payments_earn_interest"
      death_report_verification_days: "=death_report_verification_days"
      held_payment_release_business_days: "=held_payment_release_business_days"
      returned_payment_reissue_method: "=returned_payment_reissue_method"
  - id: income_evt_returned_payment
    subject: [income_payment_returned]
    rule: "A payment returned by the bank or the postal service reverses only the payment it names. Each returned payment is recorded once against the payment it reverses. The returned installment is held under income_proof_of_life_and_suspension; a deposit rejected because the account holder is deceased is treated as a report of death."
    eligibility:
      - id: one_return_per_payment
        applies_to: [income_payment_returned]
        kind: dedup
        condition: "Each returned payment is recorded once against the payment it reverses."
        evidence_fields: [income_transactions.source_txn_id, income_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_transactions.source_txn_id]]
          action_bindings: {income_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: income_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [income_payment_returned]}
          distinct_fields: []
  - id: income_death_of_annuitant
    subject: [income_death_claim_registered, income_survivor_continuation, income_beneficiary_continuation, income_contract_completed, income_refund_benefit_paid, income_commuted_value_paid]
    rule: "Payments stop on notice of an annuitant's death. A death benefit, continuation or completion is processed only on a death claim whose certified death certificate has been received and whose request status is approved. What follows depends on payout_basis. Life only: no further payment is due and the contract completes. Life with cash refund: where refund_lump_sum_available is true, the beneficiaries receive the purchase amount less income_msr_gross_paid_before_death, if positive, as a lump sum with interest at death_claim_interest_rate, simple, from the date due proof is received to payment, actual days over 365, rounded to the cent. Life with period certain: when death occurs before certain_period_end_date the remaining certain installments continue to the beneficiaries on the original schedule; where beneficiary_commutation_allowed is true and at least commutation_min_remaining_payments installments remain, a beneficiary may elect instead the commuted value of the remaining installments, discounted at the pricing interest rate plus commutation_discount_spread as an annual effective rate converted to the payment frequency, with the first remaining installment discounted one period, rounded to the cent; when death occurs after the certain period the contract completes. Joint and survivor: on the first death, determined by survivor_reduction_trigger, payments continue to the survivor at survivor_continuation_pct of the installment, rounded to the cent; on the survivor's death the contract completes. Refund or commuted value is paid only while the contract status is death_claim_pending or beneficiary_continuing. Every installment paid for a payment date after the date of death that ended it is an overpayment under income_evt_overpayment_recovery. Shares follow the designation in effect at death, a predeceased primary's share passing pro rata to surviving primaries, then to contingents, then to the owner's estate; a minor's share, below minor_beneficiary_age, is paid only to a guardian or UTMA custodian."
    eligibility:
      - id: proof_and_approval
        applies_to: [income_survivor_continuation, income_beneficiary_continuation, income_refund_benefit_paid, income_commuted_value_paid]
        kind: authorization
        condition: "A death benefit, continuation or completion is processed only on a death claim whose certified death certificate has been received and whose request status is approved."
        evidence_fields: [income_service_requests.death_certificate_received, income_service_requests.request_status, income_service_requests.income_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_service_requests.income_request_id]]
          action_bindings: {income_service_requests.income_request_id: income_request_id}
      - id: lump_sum_status
        applies_to: [income_refund_benefit_paid, income_commuted_value_paid]
        kind: state
        condition: "Refund or commuted value is paid only while the contract status is death_claim_pending or beneficiary_continuing."
        evidence_fields: [income_holdings.status, income_holdings.income_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_holdings.income_contract_id]]
          action_bindings: {income_holdings.income_contract_id: income_contract_id}
        state_contract:
          field: income_holdings.status
          allowed: [death_claim_pending, beneficiary_continuing]
    params:
      death_claim_interest_rate: "=death_claim_interest_rate"
      minor_beneficiary_age: "=minor_beneficiary_age"
      per_tier:
        Ashgrove Income Annuity Life Only: {payout_basis: "=payout_basis", period_certain_years: "=period_certain_years", survivor_continuation_pct: "=survivor_continuation_pct", refund_lump_sum_available: "=refund_lump_sum_available", refund_basis: "=refund_basis", beneficiary_commutation_allowed: "=beneficiary_commutation_allowed", commutation_discount_spread: "=commutation_discount_spread", commutation_min_remaining_payments: "=commutation_min_remaining_payments", survivor_reduction_trigger: "=survivor_reduction_trigger"}
        Ashgrove Income Annuity Cash Refund: {payout_basis: "=payout_basis", period_certain_years: "=period_certain_years", survivor_continuation_pct: "=survivor_continuation_pct", refund_lump_sum_available: "=refund_lump_sum_available", refund_basis: "=refund_basis", beneficiary_commutation_allowed: "=beneficiary_commutation_allowed", commutation_discount_spread: "=commutation_discount_spread", commutation_min_remaining_payments: "=commutation_min_remaining_payments", survivor_reduction_trigger: "=survivor_reduction_trigger"}
        Ashgrove Income Annuity 10-Year Certain: {payout_basis: "=payout_basis", period_certain_years: "=period_certain_years", survivor_continuation_pct: "=survivor_continuation_pct", refund_lump_sum_available: "=refund_lump_sum_available", refund_basis: "=refund_basis", beneficiary_commutation_allowed: "=beneficiary_commutation_allowed", commutation_discount_spread: "=commutation_discount_spread", commutation_min_remaining_payments: "=commutation_min_remaining_payments", survivor_reduction_trigger: "=survivor_reduction_trigger"}
        Ashgrove Income Annuity 20-Year Certain: {payout_basis: "=payout_basis", period_certain_years: "=period_certain_years", survivor_continuation_pct: "=survivor_continuation_pct", refund_lump_sum_available: "=refund_lump_sum_available", refund_basis: "=refund_basis", beneficiary_commutation_allowed: "=beneficiary_commutation_allowed", commutation_discount_spread: "=commutation_discount_spread", commutation_min_remaining_payments: "=commutation_min_remaining_payments", survivor_reduction_trigger: "=survivor_reduction_trigger"}
        Ashgrove Income Annuity Joint 50% Survivor: {payout_basis: "=payout_basis", period_certain_years: "=period_certain_years", survivor_continuation_pct: "=survivor_continuation_pct", refund_lump_sum_available: "=refund_lump_sum_available", refund_basis: "=refund_basis", beneficiary_commutation_allowed: "=beneficiary_commutation_allowed", commutation_discount_spread: "=commutation_discount_spread", commutation_min_remaining_payments: "=commutation_min_remaining_payments", survivor_reduction_trigger: "=survivor_reduction_trigger"}
        Ashgrove Income Annuity Joint 100% Survivor: {payout_basis: "=payout_basis", period_certain_years: "=period_certain_years", survivor_continuation_pct: "=survivor_continuation_pct", refund_lump_sum_available: "=refund_lump_sum_available", refund_basis: "=refund_basis", beneficiary_commutation_allowed: "=beneficiary_commutation_allowed", commutation_discount_spread: "=commutation_discount_spread", commutation_min_remaining_payments: "=commutation_min_remaining_payments", survivor_reduction_trigger: "=survivor_reduction_trigger"}
    measures: [income_msr_gross_paid_before_death, income_msr_payments_before_death]
    formula:
      refund_benefit: max(0, purchase_amount - income_msr_gross_paid_before_death)
      survivor_payment: round(current_payment_amount * survivor_continuation_pct, 2)
      payments_per_year: 12 if payment_frequency == "monthly" else 4 if payment_frequency == "quarterly" else 2 if payment_frequency == "semiannual" else 1
      remaining_certain_payments: period_certain_years * payments_per_year - income_msr_payments_before_death
      periodic_rate: (1 + pricing_interest_rate + commutation_discount_spread) ** (1 / payments_per_year) - 1
      commuted_value: round(current_payment_amount * (1 - (1 + periodic_rate) ** (0 - remaining_certain_payments)) / periodic_rate, 2)
  - id: income_evt_overpayment_recovery
    subject: [income_overpayment_identified, income_overpayment_recovered, income_held_payment_released]
    rule: "An installment paid for a payment date after the date of death that ended it is an overpayment, recorded once per installment. Ashgrove first asks the bank to return a post-death direct deposit within overpayment_reclamation_window_days of the deposit; what the bank does not return is requested from the estate or the person who received it. Where payments continue to a survivor or beneficiary, an unrecovered overpayment may be offset against those payments, taking no more than overpayment_offset_max_pct of each gross installment, rounded to the cent. Held installments falling due after the death are forfeited rather than paid, and are never counted as overpayments."
    eligibility:
      - id: one_overpayment_per_installment
        applies_to: [income_overpayment_identified]
        kind: dedup
        condition: "An installment paid for a payment date after the date of death that ended it is an overpayment, recorded once per installment."
        evidence_fields: [income_transactions.source_txn_id, income_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_transactions.source_txn_id]]
          action_bindings: {income_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: income_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [income_overpayment_identified]}
          distinct_fields: []
    params:
      overpayment_reclamation_window_days: "=overpayment_reclamation_window_days"
      overpayment_offset_max_pct: "=overpayment_offset_max_pct"
    formula:
      max_offset: round(current_payment_amount * overpayment_offset_max_pct, 2)
  - id: income_beneficiary_designation
    subject: [income_beneficiary_designated]
    rule: "On tiers with a cash refund or period certain the owner names beneficiaries for any amount payable after the annuitant's death; on life only and joint tiers a designation only directs installments held or due on or before the final death. A beneficiary designation is recorded only while the contract status is applied, income_active, payments_suspended or survivor_continuing. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. The new designation replaces the earlier one entirely, effective on the owner's signature date if signed while the annuitant was living. Shares are whole percents of at least beneficiary_min_share_pct totalling 100 in each class, with no more than beneficiary_max_primary primaries."
    eligibility:
      - id: designation_status
        applies_to: [income_beneficiary_designated]
        kind: state
        condition: "A beneficiary designation is recorded only while the contract status is applied, income_active, payments_suspended or survivor_continuing."
        evidence_fields: [income_holdings.status, income_holdings.income_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_holdings.income_contract_id]]
          action_bindings: {income_holdings.income_contract_id: income_contract_id}
        state_contract:
          field: income_holdings.status
          allowed: [applied, income_active, payments_suspended, survivor_continuing]
      - id: signed_change_request
        applies_to: [income_beneficiary_designated]
        kind: authorization
        condition: "A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary."
        evidence_fields: [income_service_requests.request_type, income_service_requests.request_status, income_service_requests.signed_date, income_transactions.designation_type, income_service_requests.income_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_service_requests.income_request_id]]
          action_bindings: {income_service_requests.income_request_id: income_request_id}
    params:
      beneficiary_min_share_pct: "=beneficiary_min_share_pct"
      beneficiary_max_primary: "=beneficiary_max_primary"
  - id: income_free_look
    subject: [income_free_look_cancelled, income_purchase_refunded]
    rule: "The owner may return the contract for a refund of the purchase amount less income installments already paid. The returned contract must be received no later than the contract delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the contract delivery date; a contract received on that day is in time. When the purchase replaced another annuity, free_look_days_replacement replaces free_look_days; when the owner's age on the issue date was free_look_senior_age or more, free_look_days_senior replaces it; when both apply the longer governs. A contract bought by annuitizing an Ashgrove deferred annuity may be returned the same way, and the refund is paid to the owner in cash; the deferred annuity is not restored."
    eligibility:
      - id: within_free_look
        applies_to: [income_free_look_cancelled]
        kind: time
        condition: "The returned contract must be received no later than the contract delivery date plus free_look_days."
        evidence_fields: [income_holdings.contract_delivery_date, income_holdings.issue_age, income_holdings.income_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[income_holdings.income_contract_id]]
          action_bindings: {income_holdings.income_contract_id: income_contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the contract delivery date"
          anchor_source: income_holdings.contract_delivery_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look end is found by adding the free-look days in calendar days to the contract delivery date; a contract received on that day is in time."
          boundary: inclusive
    params:
      free_look_days: "=free_look_days"
      free_look_days_replacement: "=free_look_days_replacement"
      free_look_senior_age: "=free_look_senior_age"
      free_look_days_senior: "=free_look_days_senior"

# ============================================================================
# extended_policies: multi-factor calculation policies of the income_annuity_payouts_and_survivorship difficulty
# ============================================================================
extended_policies:
  - id: income_ext_beneficiary_arrears
    base_policy_refs: [income_payment_schedule, income_death_of_annuitant]
    overwrite:
      - base_policy: income_payment_schedule
        superseded_clause: >-
          Where a cost-of-living rate was chosen, the installment increases by that rate, compounded, on each contract
          anniversary from cola_first_increase_anniversary onward, rounded to the cent.
        replaced_by: >-
          Where a cost-of-living increase took effect on a contract anniversary after the payment date of the last installment issued to the annuitant and nothing is held in suspense for the arrears installment's payment date, the arrears installment is paid at the amount of that last installment raised by the cost-of-living rate once for each contract anniversary falling after its payment date and on or before the arrears installment's own payment date, the amount being rounded to the cent after each of the first twelve such increases and any further increases being compounded in one step and rounded to the cent
      - base_policy: income_payment_schedule
        superseded_clause: >-
          On a non-qualified contract where exclusion_ratio_applies is true, each installment is split into a tax-free part
          equal to the installment times the exclusion ratio and a taxable remainder, until the total tax-free amount equals
          the purchase amount, after which the whole installment is taxable; IRA installments are fully taxable.
        replaced_by: >-
          The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase amount,
          times the exclusion ratio, rounded to the cent; the tax-free part of the arrears installment is the installment times the exclusion ratio, rounded to the cent, but never more than the investment
          in the contract less the tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole arrears installment is taxable.
      - base_policy: income_payment_schedule
        superseded_clause: >-
          Federal tax is withheld at the rate on the owner's latest withholding election; with no election on file the
          withholding_default_periodic method applies.
        replaced_by: >-
          Federal tax on the arrears installment is withheld at the rate on the payee's own withholding election when the
          payee has one on file; when the payee is a beneficiary or survivor other than the owner and has no election of
          their own, it is withheld at the payee default rate, because an election made by the owner does not govern
          another person's payments; otherwise it is withheld at the rate on the contract's withholding election.
    trigger: state_due
    subject: [income_payment_issued]
    computes: net_paid_amount
    target_tool: pay_beneficiary_arrears_076c3375
    params:
      group_delay_rate: 0.0600
      other_late_rate: 0.0500
      group_late_days: 30
      other_late_days: 60
      payee_default_rate: 0.10
      state_flat_rate: 0.05
      state_alt_rate: 0.04
    rule: >-
      On a period-certain contract whose annuitant died within the period certain, every certain installment that fell due after the date of death and on or before the date the death claim was approved, while payments were stopped pending the claim, and was never issued is owed to the beneficiary now receiving the payments as an arrears installment; installments falling due after the claim was approved are paid on the regular schedule, and when every installment of that span stands issued no arrears installment is owed. The arrears installments are paid one at a time, earliest payment date first, each in one payment for its payment date to that beneficiary by the payment method on the contract. Because no installment of that span is paid on the regular schedule and its arrears are paid in date order, the installments of the span already issued are its earliest ones, so the arrears installment being paid is the installment whose payment date follows those already issued, counted from the first payment date after the death. The arrears installment is paid at the current installment on
      the contract. Its taxable part is the installment less a tax-free part equal to the installment times the exclusion
      ratio, rounded to the cent. Federal tax is withheld from the taxable part at the rate on the contract's withholding
      election, rounded to the cent, and no state tax is withheld. Interest is added at the contract's death-claim interest
      rate, simple, for the actual days from the date due proof of death was received to the payment date over 365,
      rounded to the cent. The amount sent is the arrears installment plus the interest, less the federal tax and the
      state tax. Where a cost-of-living increase took effect on a contract anniversary after the payment date of the last installment issued to the annuitant and nothing is held in suspense for the arrears installment's payment date, the arrears installment is paid at the amount of that last installment raised by the cost-of-living rate once for each contract anniversary falling after its payment date and on or before the arrears installment's own payment date, the amount being rounded to the cent after each of the first twelve such increases and any further increases being compounded in one step and rounded to the cent; where an amount is still held in suspense for the arrears installment's payment date, it is paid at that held amount; otherwise it is paid at the current installment on the contract. The investment in the contract is, for a contract bought by annuitizing an Ashgrove fixed indexed annuity or an Ashgrove deferred fixed annuity, the cost basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase amount. The tax-free amount
      already recovered on the contract is the purchase amount less the unreturned purchase amount, times the exclusion
      ratio, rounded to the cent; the tax-free part of the arrears installment is the
      installment times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less
      the tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole arrears installment is taxable. Federal tax on the
      arrears installment is withheld at the rate on the payee's own withholding election when the payee has one on file;
      when the payee is a beneficiary or survivor other than the owner and has no election of their own, it is withheld at
      the payee default rate, because an election made by the owner does not govern another person's payments; otherwise
      it is withheld at the rate on the contract's withholding election. The interest on the arrears installment is added
      at the group delay rate for a contract issued in Connecticut, Minnesota, New Jersey or New York when more than the
      group late days have passed since the date due proof of death was received; at the other-state late rate for a
      contract issued in any other state when more than the other-state late days have passed since that date; and
      otherwise at the contract's death-claim interest rate. For a contract issued in Connecticut, Minnesota, New Jersey or New York the interest on the arrears installment runs for the actual days from the date of death to the payment date; for a contract issued in any other state whose annuitant's death was reported to Ashgrove before due proof of death was received, it runs from the date the death was first reported to the payment date; otherwise it runs from the date due proof was received to the payment date. State tax is withheld from the arrears installment only when
      federal tax is withheld from it and federal tax was withheld from the contract's installments falling due in the
      twelve months before the payment date: at the state flat rate on the taxable part for a contract issued in Iowa, Minnesota, North Carolina or Vermont, and at the alternative state rate on the taxable part for a contract issued in Delaware, New York or Oklahoma; otherwise no state tax is withheld from the arrears installment. The federal tax, the state
      tax and the interest are each rounded to the cent on their own before the amount sent is worked out.
    prerequisite: []
    cross_category:
      - category: indexed
        as: branch
        reads: [cost_basis]
        note: The investment-in-the-contract factor reads the cost basis of the Ashgrove fixed indexed annuity annuitized into the contract.
      - category: fixed
        as: branch
        reads: [cost_basis]
        note: The same factor reads the cost basis of an Ashgrove deferred fixed annuity annuitized into the contract.
    compute:
      - in_rate_group: "F('issue_state') == 'CT' or F('issue_state') == 'MN' or F('issue_state') == 'NJ' or F('issue_state') == 'NY'"
      - proof_date: "LATEST('income_service_requests', 'received_date', date_field='received_date', request_type='death_claim', death_certificate_received=True)"
      - report_date: "LATEST('income_service_requests', 'received_date', date_field='received_date', request_type='death_report')"
      - arrears_ppy: "12 if F('payment_frequency') == 'monthly' else (4 if F('payment_frequency') == 'quarterly' else (2 if F('payment_frequency') == 'semiannual' else 1))"
      - arrears_mpp: "int(12 / arrears_ppy)"
      - last_annuitant_due: "LATEST('income_transactions', 'payment_due_date', date_field='payment_due_date', event_type='income_payment_issued', payee_name=F('annuitant_name'))"
      - anniversaries_since_last_installment: "int(MONTHS(F('issue_date'), NOW) / 12) - int(MONTHS(F('issue_date'), last_annuitant_due) / 12)"
      - arrears_first_index: "int(MONTHS(F('first_payment_date'), F('first_death_date')) / arrears_mpp) + 1"
      - arrears_months_now: "MONTHS(F('first_payment_date'), NOW)"
      - claim_approved_date: "LATEST('income_service_requests', 'decision_date', date_field='received_date', request_type='death_claim', death_certificate_received=True)"
      - arrears_last_index: "int(MONTHS(F('first_payment_date'), claim_approved_date) / arrears_mpp)"
      - issued_in_span: "COUNT('income_transactions', within_months=arrears_months_now - arrears_mpp * arrears_first_index + 1, date_field='payment_due_date', event_type='income_payment_issued') - COUNT('income_transactions', within_months=arrears_months_now - arrears_mpp * arrears_last_index, date_field='payment_due_date', event_type='income_payment_issued')"
      - arrears_index: "arrears_first_index + issued_in_span"
      - arrears_months_back: "arrears_months_now - arrears_mpp * arrears_index"
      - anniversaries_to_arrears_date: "int((MONTHS(F('issue_date'), F('first_payment_date')) + arrears_mpp * arrears_index) / 12) - int(MONTHS(F('issue_date'), last_annuitant_due) / 12)"
      - last_annuitant_installment: "LATEST('income_transactions', 'amount', date_field='payment_due_date', event_type='income_payment_issued', payee_name=F('annuitant_name'))"
      - cola_step_1: "RND(last_annuitant_installment * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 1 else last_annuitant_installment"
      - cola_step_2: "RND(cola_step_1 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 2 else cola_step_1"
      - cola_step_3: "RND(cola_step_2 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 3 else cola_step_2"
      - cola_step_4: "RND(cola_step_3 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 4 else cola_step_3"
      - cola_step_5: "RND(cola_step_4 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 5 else cola_step_4"
      - cola_step_6: "RND(cola_step_5 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 6 else cola_step_5"
      - cola_step_7: "RND(cola_step_6 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 7 else cola_step_6"
      - cola_step_8: "RND(cola_step_7 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 8 else cola_step_7"
      - cola_step_9: "RND(cola_step_8 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 9 else cola_step_8"
      - cola_step_10: "RND(cola_step_9 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 10 else cola_step_9"
      - cola_step_11: "RND(cola_step_10 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 11 else cola_step_10"
      - cola_step_12: "RND(cola_step_11 * (1 + F('cola_pct')), 2) if anniversaries_to_arrears_date >= 12 else cola_step_11"
      - cola_raised_installment: "RND(cola_step_12 * (1 + F('cola_pct')) ** (anniversaries_to_arrears_date - 12), 2) if anniversaries_to_arrears_date > 12 else cola_step_12"
      - held_installment: "SUM('income_transactions', 'amount', within_months=arrears_months_back + 1, date_field='payment_due_date', event_type='income_payment_held') - SUM('income_transactions', 'amount', within_months=arrears_months_back, date_field='payment_due_date', event_type='income_payment_held') - SUM('income_transactions', 'amount', within_months=arrears_months_back + 1, date_field='payment_due_date', event_type='income_held_payment_released') + SUM('income_transactions', 'amount', within_months=arrears_months_back, date_field='payment_due_date', event_type='income_held_payment_released')"
      - arrears_installment: "cola_raised_installment if (F('cola_pct') > 0 and anniversaries_since_last_installment >= 1 and held_installment <= 0) else (held_installment if held_installment > 0 else F('current_payment_amount'))"
      - investment: "(CFIELD('indexed', 'cost_basis', indexed_contract_id=F('source_indexed_contract_id')) if F('purchase_source') == 'ashgrove_indexed_annuitization' else CFIELD('fixed', 'cost_basis', fixed_contract_id=F('source_fixed_contract_id'))) if (F('purchase_source') == 'ashgrove_indexed_annuitization' or F('purchase_source') == 'ashgrove_fixed_annuitization') else (0 if (F('tax_qualification') == 'traditional_ira' or F('tax_qualification') == 'sep_ira') else F('purchase_amount'))"
      - recovered: "RND((F('purchase_amount') - F('unreturned_premium')) * F('exclusion_ratio'), 2)"
      - tax_free: "MX(0, MN(RND(arrears_installment * F('exclusion_ratio'), 2), investment - recovered))"
      - taxable: "arrears_installment - tax_free"
      - own_elections: "COUNT('income_service_requests', request_type='withholding_election', customer_id=F('payee_customer_id'))"
      - own_rate: "LATEST('income_service_requests', 'requested_withholding_pct', date_field='received_date', request_type='withholding_election', customer_id=F('payee_customer_id'))"
      - withholding_rate: "own_rate if own_elections > 0 else (K('payee_default_rate') if (F('payee_customer_id') != None and F('payee_customer_id') != F('customer_id')) else F('federal_withholding_pct'))"
      - federal_tax: "RND(taxable * withholding_rate, 2)"
      - proof_days: "DAYS(proof_date, NOW)"
      - interest_rate: "K('group_delay_rate') if (in_rate_group and proof_days > K('group_late_days')) else (K('other_late_rate') if ((not in_rate_group) and proof_days > K('other_late_days')) else P('death_claim_interest_rate'))"
      - interest_days: "DAYS(F('first_death_date'), NOW) if in_rate_group else (DAYS(report_date, NOW) if (report_date != None and DAYS(report_date, proof_date) > 0) else DAYS(proof_date, NOW))"
      - interest: "RND(arrears_installment * interest_rate * interest_days / 365, 2)"
      - federal_withheld_12m: "SUM('income_transactions', 'federal_withholding_amount', within_months=12, date_field='payment_due_date', event_type='income_payment_issued')"
      - state_tax: "RND(taxable * K('state_flat_rate'), 2) if ((F('issue_state') == 'IA' or F('issue_state') == 'MN' or F('issue_state') == 'NC' or F('issue_state') == 'VT') and federal_tax > 0 and federal_withheld_12m > 0) else (RND(taxable * K('state_alt_rate'), 2) if ((F('issue_state') == 'DE' or F('issue_state') == 'NY' or F('issue_state') == 'OK') and federal_tax > 0 and federal_withheld_12m > 0) else 0)"
      - result: "0 if arrears_index > arrears_last_index else RND(arrears_installment + interest - federal_tax - state_tax, 2)"
    compute_basis:
      cola_raised_installment: "any further increases being compounded in one step and rounded to the cent"
      cola_step_12: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_11: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_10: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_9: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_8: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_7: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_6: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_5: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_4: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_3: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_2: "the amount being rounded to the cent after each of the first twelve such increases"
      cola_step_1: "the amount being rounded to the cent after each of the first twelve such increases"
      last_annuitant_due: "after the payment date of the last installment issued to the annuitant"
      in_rate_group: "for a contract issued in Connecticut, Minnesota, New Jersey or New York"
      proof_date: "from the date due proof of death was received to the payment date over 365"
      report_date: "it runs from the date the death was first reported to the payment date"
      anniversaries_since_last_installment: "Where a cost-of-living increase took effect on a contract anniversary after the payment date of the last installment issued to the annuitant"
      arrears_ppy: "once for each contract anniversary falling after the date of death and on or before the arrears installment's own payment date"
      arrears_mpp: "once for each contract anniversary falling after the date of death and on or before the arrears installment's own payment date"
      arrears_first_index: "counted from the first payment date after the death"
      arrears_months_now: "the installment whose payment date follows those already issued, counted from the first payment date after the death"
      claim_approved_date: "on or before the date the death claim was approved"
      arrears_last_index: "when every installment of that span stands issued no arrears installment is owed"
      issued_in_span: "the installments of the span already issued are its earliest ones"
      arrears_index: "so the arrears installment being paid is the installment whose payment date follows those already issued, counted from the first payment date after the death."
      arrears_months_back: "the arrears installment's own payment date"
      anniversaries_to_arrears_date: "once for each contract anniversary falling after its payment date and on or before the arrears installment's own payment date"
      last_annuitant_installment: "the arrears installment is paid at the amount of the last installment issued to the annuitant"
      held_installment: "where an amount is still held in suspense for the arrears installment's payment date, it is paid at that held amount"
      arrears_installment: "Where a cost-of-living increase took effect on a contract anniversary after the payment date of the last installment issued to the annuitant and nothing is held in suspense for the arrears installment's payment date, the arrears installment is paid at the amount of that last installment raised by the cost-of-living rate once for each contract anniversary falling after its payment date and on or before the arrears installment's own payment date, the amount being rounded to the cent after each of the first twelve such increases and any further increases being compounded in one step and rounded to the cent; where an amount is still held in suspense for the arrears installment's payment date, it is paid at that held amount; otherwise it is paid at the current installment on the contract."
      investment: "The investment in the contract is, for a contract bought by annuitizing an Ashgrove fixed indexed annuity or an Ashgrove deferred fixed annuity, the cost basis of the annuity annuitized; for any other traditional or SEP IRA contract, zero; and otherwise the purchase amount."
      recovered: "The tax-free amount already recovered on the contract is the purchase amount less the unreturned purchase amount, times the exclusion ratio, rounded to the cent"
      tax_free: "the tax-free part of the arrears installment is the installment times the exclusion ratio, rounded to the cent, but never more than the investment in the contract less the tax-free amount already recovered and never less than zero, so that once the investment is recovered the whole arrears installment is taxable."
      taxable: "Its taxable part is the installment less a tax-free part"
      own_elections: "when the payee has one on file"
      own_rate: "at the rate on the payee's own withholding election when the payee has one on file"
      withholding_rate: "Federal tax on the arrears installment is withheld at the rate on the payee's own withholding election when the payee has one on file; when the payee is a beneficiary or survivor other than the owner and has no election of their own, it is withheld at the payee default rate, because an election made by the owner does not govern another person's payments; otherwise it is withheld at the rate on the contract's withholding election."
      federal_tax: "Federal tax is withheld from the taxable part at the rate on the contract's withholding election, rounded to the cent"
      proof_days: "when more than the group late days have passed since the date due proof of death was received"
      interest_rate: "The interest on the arrears installment is added at the group delay rate for a contract issued in Connecticut, Minnesota, New Jersey or New York when more than the group late days have passed since the date due proof of death was received; at the other-state late rate for a contract issued in any other state when more than the other-state late days have passed since that date; and otherwise at the contract's death-claim interest rate."
      interest_days: "For a contract issued in Connecticut, Minnesota, New Jersey or New York the interest on the arrears installment runs for the actual days from the date of death to the payment date; for a contract issued in any other state whose annuitant's death was reported to Ashgrove before due proof of death was received, it runs from the date the death was first reported to the payment date; otherwise it runs from the date due proof was received to the payment date."
      interest: "Interest is added at the contract's death-claim interest rate, simple, for the actual days from the date due proof of death was received to the payment date over 365, rounded to the cent."
      federal_withheld_12m: "federal tax was withheld from the contract's installments falling due in the twelve months before the payment date"
      state_tax: "State tax is withheld from the arrears installment only when federal tax is withheld from it and federal tax was withheld from the contract's installments falling due in the twelve months before the payment date: at the state flat rate on the taxable part for a contract issued in Iowa, Minnesota, North Carolina or Vermont, and at the alternative state rate on the taxable part for a contract issued in Delaware, New York or Oklahoma; otherwise no state tax is withheld from the arrears installment."
      result: "The amount sent is the arrears installment plus the interest, less the federal tax and the state tax."
    factors:
      - id: arrears_installment_amount
        effect: method
        decides: arrears_installment
        bindings: [arrears_ppy, arrears_mpp, last_annuitant_due, anniversaries_since_last_installment, arrears_first_index, arrears_months_now, claim_approved_date, arrears_last_index, issued_in_span, arrears_index, arrears_months_back, anniversaries_to_arrears_date, last_annuitant_installment, cola_step_1, cola_step_2, cola_step_3, cola_step_4, cola_step_5, cola_step_6, cola_step_7, cola_step_8, cola_step_9, cola_step_10, cola_step_11, cola_step_12, cola_raised_installment, held_installment, arrears_installment]
        ladder:
          - when: "a cost-of-living increase took effect on a contract anniversary after the payment date of the last installment issued to the annuitant and nothing is held in suspense for the arrears installment's payment date"
            method: "the arrears installment is paid at the amount of the last installment issued to the annuitant, raised by the cost-of-living rate once for each anniversary after that installment's payment date and on or before the arrears installment's own payment date, rounded to the cent at each increase"
          - when: "an amount is still held in suspense for the arrears installment's payment date"
            method: "the arrears installment is paid at that held amount"
          - when: "otherwise"
            method: "the arrears installment is paid at the current installment on the contract"
