    baseline:
      rule: 'When a policy''s monthly bank-draft privilege ends because its returned bank drafts reach the product''s returned-draft limit, Ashgrove converts the policy to quarterly direct billing and sets the converted quarterly installment from the premium components as they stand on record, every rider still attached on record being charged. For the converted quarterly installment, the insured''s issue age is the whole years from the insured''s date of birth to the issue date on record, the insured''s anniversary age is the whole years from the insured''s date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today. For the converted quarterly installment, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone. The standard band factor of the converted quarterly installment is 1.00. The face premium of the converted quarterly installment is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent. The fee before sharing in the converted quarterly installment is set by the face amount on record: the product''s annual policy fee less 10.00 below 250,000, the product''s annual policy fee less 20.00 at 1,000,000 or more, and the product''s annual policy fee from 250,000 up to 1,000,000. The long-standing fee concession in the converted quarterly installment is 10.00 once the policy has completed 20 policy years, 5.00 once it has completed 10 policy years, and nothing before that. The standard policy fee share in the converted quarterly installment is the whole fee. The policy fee of the converted quarterly installment is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent. The accidental death rider rate in the converted quarterly installment is 1.08 per 1,000 when the insured''s anniversary age is from 60 through 69, 0.84 per 1,000 when it is below 45, and the product''s accidental death rider rate per 1,000 at any other age. The accidental death charge of the converted quarterly installment is the accidental death rider amount on record divided by 1,000, times the accidental death rider rate, rounded to the cent. The children''s term unit rate in the converted quarterly installment is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product''s children''s term rate per unit below 5 units. The children''s term charge of the converted quarterly installment is the units on record times the children''s term unit rate. The standard waiver rate in the converted quarterly installment is 0.11. The standard waiver charge base in the converted quarterly installment is the face premium alone. When the waiver of premium rider is attached on record, the waiver charge of the converted quarterly installment is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge. The annual premium of the converted quarterly installment is the face premium plus the policy fee, the accidental death charge, the children''s term charge and the waiver charge. The converted quarterly installment is the annual premium times the product''s quarterly factor, rounded to the cent.'
