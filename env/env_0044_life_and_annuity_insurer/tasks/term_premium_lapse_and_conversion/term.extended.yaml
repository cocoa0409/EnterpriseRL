    factors:
    - id: size_band
      effect: parameter
      decides: band
      bindings:
      - band
      ladder:
      - when: the band measurement face is 1,000,000 or more
        value: 0.74 on the level term ladder, 0.82 on the renewable ladder
      - when: the band measurement face is from 500,000 up to 1,000,000
        value: 0.80 on the level term ladder, 0.86 on the renewable ladder
      - when: the band measurement face is from 250,000 up to 500,000
        value: 0.88 on the level term ladder, 0.92 on the renewable ladder
      - when: otherwise
        value: '1.00'
      baseline:
        band: '1.0'
      evidence:
      - date
      cross_difficulty: null
    - id: fee_concession
      effect: parameter
      decides: concession
      bindings:
      - policy_years
      - concession
      ladder:
      - when: the policy has completed 20 policy years
        value: '10.00'
      - when: it has completed 10 through 19 policy years
        value: '5.00'
      - when: otherwise
        value: nothing
      baseline:
        concession: '0.0'
      evidence:
      - date
      cross_difficulty: null
    - id: fee_share
      effect: parameter
      decides: fee_share
      bindings:
      - owns_whole
      - owns_ul
      - fee_share
      ladder:
      - when: the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy
        value: nothing
      - when: the owner holds exactly one of the two in force
        value: one half
      - when: otherwise
        value: the whole fee
      baseline:
        fee_share: '1.0'
      evidence:
      - cross_category
      cross_difficulty: whole
    - id: adb_age_rate
      effect: parameter
      decides: adb_rate
      bindings:
      - anniv_age
      - adb_rate
      ladder:
      - when: the insured's anniversary age is from 60 through 69
        value: 1.08 per 1,000
      - when: the insured's anniversary age is below 45
        value: 0.84 per 1,000
      - when: otherwise
        value: the product's accidental death rider rate per 1,000
      baseline:
        adb_rate: P('adb_rider_annual_rate_per_thousand')
      evidence:
      - date
      cross_difficulty: null
    - id: returned_item_rate
      effect: parameter
      decides: item_charge
      bindings:
      - returns_12m
      - item_charge
      ladder:
      - when: 3 or more payments on the policy were returned unpaid in the 12 months ending today
        value: 25.00 per item
      - when: exactly 2 were returned in those 12 months
        value: 15.00 per item
      - when: otherwise
        value: nothing
      baseline:
        item_charge: '0.0'
      evidence:
      - history
      cross_difficulty: null
    - id: items_charged
      effect: method
      decides: items_charged
      bindings:
      - holds_permanent
      - items_charged
      ladder:
      - when: the owner holds an in-force Ashgrove whole life or universal life policy and at least one payment was returned in the 12 months
        method: only the most recent returned item is charged
      - when: the owner holds neither and 3 or more payments were returned in the 12 months
        method: every returned item except the first of the 12 months is charged
      - when: otherwise
        method: every returned item of the 12 months is charged
      baseline:
        items_charged: returns_12m
      evidence:
      - cross_category
      - history
      cross_difficulty: whole
    baseline:
      rule: 'A policy in its grace period is restored to in force by the owner''s grace remittance, which is the overdue billed premium plus the newly due installment counted in the grace remittance when one has fallen due without being billed, plus the returned-item charge. The overdue billed premium is the total of every billed installment on the ledger, less every remittance applied, plus every payment returned unpaid by the bank. An installment has fallen due without being billed when a full month or more has passed since the latest billed due date and that latest billed installment had been drafted by monthly bank draft; exactly one such installment is then counted, and none is counted otherwise. For the newly due installment counted in the grace remittance, the insured''s issue age is the whole years from the insured''s date of birth to the issue date on record, the insured''s anniversary age is the whole years from the insured''s date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today. For the newly due installment counted in the grace remittance, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone. The standard band factor of the newly due installment counted in the grace remittance is 1.00. The face premium of the newly due installment counted in the grace remittance is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent. The fee before sharing in the newly due installment counted in the grace remittance is set by the face amount on record: the product''s annual policy fee less 10.00 below 250,000, the product''s annual policy fee less 20.00 at 1,000,000 or more, and the product''s annual policy fee from 250,000 up to 1,000,000. The standard long-standing fee concession in the newly due installment counted in the grace remittance is nothing. The standard policy fee share in the newly due installment counted in the grace remittance is the whole fee. The policy fee of the newly due installment counted in the grace remittance is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent. The standard accidental death rider rate in the newly due installment counted in the grace remittance is the product''s accidental death rider rate per 1,000. The accidental death charge of the newly due installment counted in the grace remittance is the accidental death rider amount on record divided by 1,000, times the accidental death rider rate, rounded to the cent. The children''s term unit rate in the newly due installment counted in the grace remittance is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product''s children''s term rate per unit below 5 units. The children''s term charge of the newly due installment counted in the grace remittance is the units on record times the children''s term unit rate. The waiver rate in the newly due installment counted in the grace remittance is 0.14 when the issue age is 45 or more, 0.09 when it is below 35, and 0.11 when it is from 35 through 44. The waiver charge base in the newly due installment counted in the grace remittance is chosen by issue age: the face premium plus the accidental death charge plus the children''s term charge when the issue age is 40 or more, the face premium plus the accidental death charge when it is from 30 through 39, and the face premium alone when it is below 30. When the waiver of premium rider is attached on record, the waiver charge of the newly due installment counted in the grace remittance is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge. The annual premium of the newly due installment counted in the grace remittance is the face premium plus the policy fee, the accidental death charge, the children''s term charge and the waiver charge. The modal factor for the newly due installment counted in the grace remittance is that of the premium mode on record: the product''s quarterly factor for quarterly, the product''s monthly bank-draft factor for monthly bank draft, the product''s semiannual factor for semiannual and the product''s annual factor for annual. The newly due installment counted in the grace remittance is the annual premium times the modal factor, rounded to the cent. The standard returned-item charge rate is nothing. The standard items charged are every returned item of the 12 months ending today. The returned-item charge is the returned-item charge rate times the items charged. The grace remittance is the overdue billed premium plus the newly due installment counted in the grace remittance times the installments counted, plus the returned-item charge, rounded to the cent; the policy returns to in force when the grace remittance is received no later than the last day of grace. The grace remittance is entered as one payment record that pays every installment it covers, the overdue billed installments first and the newly due installment next, and the paid-to date moves forward by one modal period of the mode in which each covered installment falls due: the mode under which an overdue installment was billed, and the premium mode on record for the newly due installment. The part of a grace remittance that pays the newly due installment and the returned-item charge is applied with it and is never treated as unapplied money.'
      params:
      - annual_policy_fee
      - waiver_rate_std
      - adb_rider_annual_rate_per_thousand
      - child_rider_annual_premium_per_unit
      - modal_factor_quarterly
      - modal_factor_monthly_eft
      - modal_factor_semiannual
      - modal_factor_annual
    inputs:
      history:
      - table: term_transactions
        aggregate: sum
        field: amount
        within_months: null
        filters:
          event_type: term_premium_billed
      - table: term_transactions
        aggregate: count
        field: term_txn_id
