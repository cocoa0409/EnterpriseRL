    overwrite:
    - base_policy: term_premium_calculation
      superseded_clause: The face premium is the face amount divided by 1,000, times base_rate_per_thousand, times the band factor, rounded to the cent; the band factor is the band_factor of the highest premium_band_ladder band whose min_face does not exceed the face amount in force for the installment.
      replaced_by: 'For the installment after the accidental death rider ends, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone.'
