  - id: term_ext_face_decrease_repricing
    base_policy_refs:
    - term_premium_calculation
    - term_face_decrease
    overwrite:
    - base_policy: term_premium_calculation
      superseded_clause: The face premium is the face amount divided by 1,000, times base_rate_per_thousand, times the band factor, rounded to the cent; the band factor is the band_factor of the highest premium_band_ladder band whose min_face does not exceed the face amount in force for the installment.
      replaced_by: 'The permanent face counted toward the band is chosen by the owner''s Ashgrove permanent coverage on the same insured: both permanent face amounts when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, that one permanent face amount when exactly one of the two is in force for the insured, and nothing otherwise; the band measurement face of each face is that face plus the permanent face counted.'
    - base_policy: term_premium_calculation
      superseded_clause: The annual premium is the face premium plus the annual policy fee plus rider charges.
      replaced_by: The fee before sharing at each face is the product's annual policy fee less 10.00 for a face below 250,000, the product's annual policy fee less 20.00 for a face of 1,000,000 or more, and the product's annual policy fee for a face from 250,000 up to 1,000,000.
    - base_policy: term_premium_calculation
      superseded_clause: The installment premium is the annual premium times the modal factor of the premium mode (modal_factor_annual, modal_factor_semiannual, modal_factor_quarterly or modal_factor_monthly_eft), rounded to the cent.
      replaced_by: The installment after the face decrease is the installment premium on record less the installment share of the released premium, rounded to the cent.
    trigger: on_request
    subject:
    - term_face_amount_decreased
    computes: new_modal_premium
    target_tool: apply_face_decrease_78b62126
    params:
      band_cut_1m: 1000000
      band_cut_500k: 500000
      band_cut_250k: 250000
      art_band_1m: 0.82
      art_band_500k: 0.86
      art_band_250k: 0.92
      lt_band_1m: 0.74
      lt_band_500k: 0.8
      lt_band_250k: 0.88
      fee_share_one: 0.5
      fee_small_cut: 250000
      fee_small_off: 10.0
      fee_large_cut: 1000000
      fee_large_off: 20.0
      conc_20y: 10.0
      conc_10y: 5.0
      adb_rate_60s: 1.08
      adb_age_lo: 60
      adb_age_hi: 70
      adb_rate_young: 0.84
      adb_age_young: 45
      child_cut_11: 11
      child_cut_5: 5
      child_rate_11: 5.0
      child_rate_5: 5.5
      waiver_rate_45: 0.14
      waiver_rate_std: 0.11
      waiver_rate_young: 0.09
      waiver_age_rate: 45
      waiver_age_young: 35
      waiver_age_base: 40
    rule: 'An approved face decrease request on file is applied by recording the requested face after the decrease and the installment after the face decrease, which is the installment premium on record less the installment share of the premium the decrease releases. The current face is the face amount on record and the requested face is the new face amount of the approved face decrease request; the policy years completed are the whole years from the issue date to today. The permanent face counted toward the band is chosen by the owner''s Ashgrove permanent coverage on the same insured: both permanent face amounts when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, that one permanent face amount when exactly one of the two is in force for the insured, and nothing otherwise; the band measurement face of each face is that face plus the permanent face counted. The standard permanent face counted toward the band is nothing, so each band measurement face is the face itself. The band factor of the face premium at each face is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces. The standard band factor at each face is 1.00. The face premium at each face is that face divided by 1,000, times the rate per 1,000 on record, times its band factor, rounded to the cent. The fee before sharing at each face is the product''s annual policy fee less 10.00 for a face below 250,000, the product''s annual policy fee less 20.00 for a face of 1,000,000 or more, and the product''s annual policy fee for a face from 250,000 up to 1,000,000. The standard fee before sharing at each face is the product''s annual policy fee. The policy fee share in the premium released by the decrease follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise. The standard policy fee share in the premium released by the decrease is the whole fee. The premium the decrease releases is the face premium at the current face less the face premium at the requested face, plus the fee before sharing at the current face less the fee before sharing at the requested face times the policy fee share, rounded to the cent; the long-standing fee concession and every rider charge are unchanged by a decrease and release nothing. The installment share of the released premium is the released premium times the modal factor of the premium mode on record (the product''s quarterly factor for quarterly, monthly bank-draft factor for monthly bank draft, semiannual factor for semiannual and annual factor for annual), rounded to the cent. The installment after the face decrease is the installment premium on record less the installment share of the released premium, rounded to the cent. The installment after the face decrease is not recorded until the policy status on record has moved from the grace period back to in force. The released premium is taken from the installment on record only after that installment no longer carries the charge of a waiver rider whose insured''s anniversary age has reached the waiver rider expiry age.'
    prerequisite:
    - problem: term_ext_grace_cure_remittance
      kind: state_gate
      gate: term_face_decrease.decrease_status
      form: state
      policy_source: The installment after the face decrease is not recorded until the policy status on record has moved from the grace period back to in force.
      condition: term_holdings.status is in_force, having moved from grace_period
      resolved_by: remit_grace_premium_a5ae3e41
      effect: the decrease status gate (status in force) becomes satisfied
    - problem: term_ext_waiver_expiry_repricing
      kind: value_input
      gate: record_installment
      form: state
      policy_source: The released premium is taken from the installment on record only after that installment no longer carries the charge of a waiver rider whose insured's anniversary age has reached the waiver rider expiry age.
      condition: term_holdings.waiver_of_premium_rider is false and term_holdings.modal_premium excludes its charge whenever the insured's anniversary age has reached the waiver rider expiry age
      resolved_by: end_expired_waiver_rider_bcdc46e8
      effect: the installment on record from which the released premium is taken drops by the waiver charge
    cross_category:
    - category: whole
      as: branch
      reads:
      - status
      - face_amount
      note: the band measurement face and the policy fee share read the owner's in-force Ashgrove whole life policies
    - category: ul
      as: branch
      reads:
      - status
      - face_amount
      note: the band measurement face and the policy fee share read the owner's in-force Ashgrove universal life policies
    compute:
    - new_face: MAX('term_service_requests', 'new_face_amount', request_type='face_decrease', request_status='approved')
    - old_face: F('face_amount')
    - whole_face: CFIELD('whole', 'face_amount', insured_name=F('insured_name'), status='in_force') or 0
    - ul_face: CFIELD('ul', 'face_amount', insured_name=F('insured_name'), status='in_force') or 0
    - perm_face: whole_face + ul_face if whole_face > 0 and ul_face > 0 else (whole_face + ul_face if whole_face > 0 or ul_face > 0 else 0)
    - band_old: (K('art_band_1m') if (old_face + perm_face) >= K('band_cut_1m') else (K('art_band_500k') if (old_face + perm_face) >= K('band_cut_500k') else (K('art_band_250k') if (old_face + perm_face) >= K('band_cut_250k') else 1.0))) if F('variant_name') == 'Ashgrove Annual Renewable Term' or MONTHS(F('issue_date'), NOW) >= 12 * P('level_premium_period_years') else (K('lt_band_1m') if (old_face + perm_face) >= K('band_cut_1m') else (K('lt_band_500k') if (old_face + perm_face) >= K('band_cut_500k') else (K('lt_band_250k') if (old_face + perm_face) >= K('band_cut_250k') else 1.0)))
    - band_new: (K('art_band_1m') if (new_face + perm_face) >= K('band_cut_1m') else (K('art_band_500k') if (new_face + perm_face) >= K('band_cut_500k') else (K('art_band_250k') if (new_face + perm_face) >= K('band_cut_250k') else 1.0))) if F('variant_name') == 'Ashgrove Annual Renewable Term' or MONTHS(F('issue_date'), NOW) >= 12 * P('level_premium_period_years') else (K('lt_band_1m') if (new_face + perm_face) >= K('band_cut_1m') else (K('lt_band_500k') if (new_face + perm_face) >= K('band_cut_500k') else (K('lt_band_250k') if (new_face + perm_face) >= K('band_cut_250k') else 1.0)))
    - fp_old: RND(old_face / 1000 * F('base_rate_per_thousand') * band_old, 2)
    - fp_new: RND(new_face / 1000 * F('base_rate_per_thousand') * band_new, 2)
    - fee_old: P('annual_policy_fee') - K('fee_small_off') if old_face < K('fee_small_cut') else (P('annual_policy_fee') - K('fee_large_off') if old_face >= K('fee_large_cut') else P('annual_policy_fee'))
    - fee_new: P('annual_policy_fee') - K('fee_small_off') if new_face < K('fee_small_cut') else (P('annual_policy_fee') - K('fee_large_off') if new_face >= K('fee_large_cut') else P('annual_policy_fee'))
    - owns_whole: CFIELD('whole', 'status', status='in_force') == 'in_force'
    - owns_ul: CFIELD('ul', 'status', status='in_force') == 'in_force'
    - fee_share: 0.0 if owns_whole and owns_ul else (K('fee_share_one') if owns_whole or owns_ul else 1.0)
    - released: RND(fp_old - fp_new + (fee_old - fee_new) * fee_share, 2)
    - mode_factor: P('modal_factor_quarterly') if F('premium_mode') == 'quarterly' else (P('modal_factor_monthly_eft') if F('premium_mode') == 'monthly_eft' else (P('modal_factor_semiannual') if F('premium_mode') == 'semiannual' else P('modal_factor_annual')))
    - released_installment: RND(released * mode_factor, 2)
    - record_installment: F('modal_premium')
    - result: RND(record_installment - released_installment, 2)
    compute_basis:
      new_face: The current face is the face amount on record and the requested face is the new face amount of the approved face decrease request; the policy years completed are the whole years from the issue date to today.
      old_face: The current face is the face amount on record and the requested face is the new face amount of the approved face decrease request; the policy years completed are the whole years from the issue date to today.
      whole_face: 'The permanent face counted toward the band is chosen by the owner''s Ashgrove permanent coverage on the same insured: both permanent face amounts when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, that one permanent face amount when exactly one of the two is in force for the insured, and nothing otherwise; the band measurement face of each face is that face plus the permanent face counted.'
      ul_face: 'The permanent face counted toward the band is chosen by the owner''s Ashgrove permanent coverage on the same insured: both permanent face amounts when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, that one permanent face amount when exactly one of the two is in force for the insured, and nothing otherwise; the band measurement face of each face is that face plus the permanent face counted.'
      perm_face: 'The permanent face counted toward the band is chosen by the owner''s Ashgrove permanent coverage on the same insured: both permanent face amounts when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, that one permanent face amount when exactly one of the two is in force for the insured, and nothing otherwise; the band measurement face of each face is that face plus the permanent face counted.'
      band_old: 'The band factor of the face premium at each face is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces.'
      band_new: 'The band factor of the face premium at each face is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces.'
      fp_old: The face premium at each face is that face divided by 1,000, times the rate per 1,000 on record, times its band factor, rounded to the cent.
      fp_new: The face premium at each face is that face divided by 1,000, times the rate per 1,000 on record, times its band factor, rounded to the cent.
      fee_old: The fee before sharing at each face is the product's annual policy fee less 10.00 for a face below 250,000, the product's annual policy fee less 20.00 for a face of 1,000,000 or more, and the product's annual policy fee for a face from 250,000 up to 1,000,000.
      fee_new: The fee before sharing at each face is the product's annual policy fee less 10.00 for a face below 250,000, the product's annual policy fee less 20.00 for a face of 1,000,000 or more, and the product's annual policy fee for a face from 250,000 up to 1,000,000.
      owns_whole: 'The policy fee share in the premium released by the decrease follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      owns_ul: 'The policy fee share in the premium released by the decrease follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      fee_share: 'The policy fee share in the premium released by the decrease follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      released: The premium the decrease releases is the face premium at the current face less the face premium at the requested face, plus the fee before sharing at the current face less the fee before sharing at the requested face times the policy fee share, rounded to the cent; the long-standing fee concession and every rider charge are unchanged by a decrease and release nothing.
      mode_factor: The installment share of the released premium is the released premium times the modal factor of the premium mode on record (the product's quarterly factor for quarterly, monthly bank-draft factor for monthly bank draft, semiannual factor for semiannual and annual factor for annual), rounded to the cent.
      released_installment: The installment share of the released premium is the released premium times the modal factor of the premium mode on record (the product's quarterly factor for quarterly, monthly bank-draft factor for monthly bank draft, semiannual factor for semiannual and annual factor for annual), rounded to the cent.
      record_installment: The installment after the face decrease is the installment premium on record less the installment share of the released premium, rounded to the cent.
      result: The installment after the face decrease is the installment premium on record less the installment share of the released premium, rounded to the cent.
    factors:
    - id: band_measurement
      effect: method
      decides: perm_face
      bindings:
      - whole_face
      - ul_face
      - perm_face
      ladder:
      - when: an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured
        method: both permanent face amounts are counted toward each band measurement face
      - when: exactly one of the two is in force for the insured
        method: that permanent face amount is counted toward each band measurement face
      - when: otherwise
        method: each band is measured on the face alone
      baseline:
        perm_face: '0'
      evidence:
      - cross_category
      cross_difficulty: whole
    - id: size_band
      effect: parameter
      decides: band_new
      bindings:
      - band_old
      - band_new
      ladder:
      - when: the band measurement face is 1,000,000 or more
        value: 0.74 on the level term ladder, 0.82 on the renewable ladder
      - when: the band measurement face is from 500,000 up to 1,000,000
        value: 0.80 on the level term ladder, 0.86 on the renewable ladder
      - when: the band measurement face is from 250,000 up to 500,000
        value: 0.88 on the level term ladder, 0.92 on the renewable ladder
      - when: otherwise
        value: '1.00'
      baseline:
        band_old: '1.0'
        band_new: '1.0'
      evidence:
      - date
      cross_difficulty: null
    - id: fee_size
      effect: parameter
      decides: fee_new
      bindings:
      - new_face
      - fee_old
      - fee_new
      ladder:
      - when: the face is below 250,000
        value: the product's annual policy fee less 10.00
      - when: the face is 1,000,000 or more
        value: the product's annual policy fee less 20.00
      - when: otherwise
        value: the product's annual policy fee
      baseline:
        fee_old: P('annual_policy_fee')
        fee_new: P('annual_policy_fee')
      evidence:
      - history
      cross_difficulty: null
    - id: fee_share
      effect: parameter
      decides: fee_share
      bindings:
      - owns_whole
      - owns_ul
      - fee_share
      ladder:
      - when: the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy
        value: nothing
      - when: the owner holds exactly one of the two in force
        value: one half
      - when: otherwise
        value: the whole fee
      baseline:
        fee_share: '1.0'
      evidence:
      - cross_category
      cross_difficulty: whole
    baseline:
      rule: An approved face decrease request on file is applied by recording the requested face after the decrease and the installment after the face decrease, which is the installment premium on record less the installment share of the premium the decrease releases. The current face is the face amount on record and the requested face is the new face amount of the approved face decrease request; the policy years completed are the whole years from the issue date to today. The standard permanent face counted toward the band is nothing, so each band measurement face is the face itself. The standard band factor at each face is 1.00. The face premium at each face is that face divided by 1,000, times the rate per 1,000 on record, times its band factor, rounded to the cent. The standard fee before sharing at each face is the product's annual policy fee. The standard policy fee share in the premium released by the decrease is the whole fee. The premium the decrease releases is the face premium at the current face less the face premium at the requested face, plus the fee before sharing at the current face less the fee before sharing at the requested face times the policy fee share, rounded to the cent; the long-standing fee concession and every rider charge are unchanged by a decrease and release nothing. The installment share of the released premium is the released premium times the modal factor of the premium mode on record (the product's quarterly factor for quarterly, monthly bank-draft factor for monthly bank draft, semiannual factor for semiannual and annual factor for annual), rounded to the cent. The installment after the face decrease is the installment premium on record less the installment share of the released premium, rounded to the cent.
