    rule: 'A lapsed policy with an approved reinstatement application is reinstated when the owner pays the reinstatement amount, which is the back premium plus reinstatement interest plus the repeat reinstatement charge. The back premium is the total of every billed installment on the ledger, less every remittance applied, plus every payment returned unpaid by the bank. The lapse gap is the number of calendar days from the lapse date on record to the date the approved reinstatement application was signed. The reinstatement interest rate is 2 percent a year when the lapse gap is 15 days or less, 4 percent when it is from 16 through 90 days, and the product''s reinstatement interest rate when it is longer. The standard reinstatement interest rate is the product''s reinstatement interest rate. The long-standing policy concession lowers that rate by 1 percentage point when the policy had been in force 20 policy years or more at its lapse date, by half a percentage point when it had been in force 10 through 19 policy years, and not at all otherwise. The standard long-standing policy concession is nothing. The relationship share of the interest is one half when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, three quarters when the owner holds exactly one of them in force, and the whole interest otherwise. The standard relationship share of the interest is the whole interest. The interest days are counted by one of three methods: when the lapse gap is 15 days or less, from the date the reinstatement application was signed to today; when it is from 16 through 120 days, from the lapse date to today; when it is longer, from the paid-to date at lapse to today. The standard interest days are the calendar days from the paid-to date at lapse to today. The reinstatement interest is the back premium times the reinstatement interest rate less the long-standing policy concession, times the relationship share, times the interest days over 365, simple and rounded to the cent once on the total. The repeat reinstatement charge is 50.00 when two or more earlier reinstatement applications on the policy were completed within the 60 months ending today, 25.00 when one was, and nothing otherwise. The standard repeat reinstatement charge is nothing. The reinstatement amount is the back premium plus the reinstatement interest plus the repeat reinstatement charge, rounded to the cent. The reinstatement amount is fixed only after the ledger carries a billed installment for every premium due date from the paid-to date at lapse through today.'
