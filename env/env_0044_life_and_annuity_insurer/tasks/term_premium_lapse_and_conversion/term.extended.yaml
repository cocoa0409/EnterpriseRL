      face_prem: The face premium of the installment after the accidental death rider ends is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent.
      fee_base: 'The fee before sharing in the installment after the accidental death rider ends is set by the face amount on record: the product''s annual policy fee less 10.00 below 250,000, the product''s annual policy fee less 20.00 at 1,000,000 or more, and the product''s annual policy fee from 250,000 up to 1,000,000.'
      concession: The long-standing fee concession in the installment after the accidental death rider ends is 10.00 once the policy has completed 20 policy years, 5.00 once it has completed 10 policy years, and nothing before that.
      owns_whole: 'The policy fee share in the installment after the accidental death rider ends follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      owns_ul: 'The policy fee share in the installment after the accidental death rider ends follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      fee_share: 'The policy fee share in the installment after the accidental death rider ends follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      fee: The policy fee of the installment after the accidental death rider ends is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent.
      adb_charge: The installment after the accidental death rider ends carries no accidental death charge, the rider having been removed.
      child_rate: The children's term unit rate in the installment after the accidental death rider ends is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product's children's term rate per unit below 5 units.
      child_charge: The children's term charge of the installment after the accidental death rider ends is the units on record times the children's term unit rate.
      waiver_rate: The waiver rate in the installment after the accidental death rider ends is 0.14 when the issue age is 45 or more, 0.09 when it is below 35, and 0.11 when it is from 35 through 44.
      waiver_base: 'The waiver charge base in the installment after the accidental death rider ends is chosen by issue age: the face premium plus the accidental death charge plus the children''s term charge when the issue age is 40 or more, the face premium plus the accidental death charge when it is from 30 through 39, and the face premium alone when it is below 30.'
      waiver_charge: When the waiver of premium rider is attached on record, the waiver charge of the installment after the accidental death rider ends is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge.
      annual: The annual premium of the installment after the accidental death rider ends is the face premium plus the policy fee, the accidental death charge, the children's term charge and the waiver charge.
      mode_factor: 'The modal factor for the installment after the accidental death rider ends is that of the premium mode on record: the product''s quarterly factor for quarterly, the product''s monthly bank-draft factor for monthly bank draft, the product''s semiannual factor for semiannual and the product''s annual factor for annual.'
      result: The installment after the accidental death rider ends is the annual premium times the modal factor, rounded to the cent.
    factors:
