    rule: 'The accidental death rider ends on the policy anniversary at which the insured''s anniversary age reaches the product''s accidental death rider expiry age; Ashgrove then removes the rider amount and sets the installment after the accidental death rider ends from the premium components on record. For the installment after the accidental death rider ends, the insured''s issue age is the whole years from the insured''s date of birth to the issue date on record, the insured''s anniversary age is the whole years from the insured''s date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today. For the installment after the accidental death rider ends, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone. The standard band measurement face for the installment after the accidental death rider ends is the face amount on record alone. The band factor of the installment after the accidental death rider ends is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces. The standard band factor of the installment after the accidental death rider ends is 1.00. The face premium of the installment after the accidental death rider ends is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent. The fee before sharing in the installment after the accidental death rider ends is set by the face amount on record: the product''s annual policy fee less 10.00 below 250,000, the product''s annual policy fee less 20.00 at 1,000,000 or more, and the product''s annual policy fee from 250,000 up to 1,000,000. The long-standing fee concession in the installment after the accidental death rider ends is 10.00 once the policy has completed 20 policy years, 5.00 once it has completed 10 policy years, and nothing before that. The standard long-standing fee concession in the installment after the accidental death rider ends is nothing. The policy fee share in the installment after the accidental death rider ends follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise. The standard policy fee share in the installment after the accidental death rider ends is the whole fee. The policy fee of the installment after the accidental death rider ends is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent. The installment after the accidental death rider ends carries no accidental death charge, the rider having been removed. The children''s term unit rate in the installment after the accidental death rider ends is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product''s children''s term rate per unit below 5 units. The children''s term charge of the installment after the accidental death rider ends is the units on record times the children''s term unit rate. The waiver rate in the installment after the accidental death rider ends is 0.14 when the issue age is 45 or more, 0.09 when it is below 35, and 0.11 when it is from 35 through 44. The waiver charge base in the installment after the accidental death rider ends is chosen by issue age: the face premium plus the accidental death charge plus the children''s term charge when the issue age is 40 or more, the face premium plus the accidental death charge when it is from 30 through 39, and the face premium alone when it is below 30. When the waiver of premium rider is attached on record, the waiver charge of the installment after the accidental death rider ends is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge. The annual premium of the installment after the accidental death rider ends is the face premium plus the policy fee, the accidental death charge, the children''s term charge and the waiver charge. The modal factor for the installment after the accidental death rider ends is that of the premium mode on record: the product''s quarterly factor for quarterly, the product''s monthly bank-draft factor for monthly bank draft, the product''s semiannual factor for semiannual and the product''s annual factor for annual. The installment after the accidental death rider ends is the annual premium times the modal factor, rounded to the cent. The installment after the accidental death rider ends is not set until the policy status on record has moved from lapsed back to in force.'
