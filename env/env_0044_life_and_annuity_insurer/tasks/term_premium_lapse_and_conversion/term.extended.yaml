    rule: 'A policy in its grace period is restored to in force by the owner''s grace remittance, which is the overdue billed premium plus the newly due installment counted in the grace remittance when one has fallen due without being billed, plus the returned-item charge. The overdue billed premium is the total of every billed installment on the ledger, less every remittance applied, plus every payment returned unpaid by the bank. An installment has fallen due without being billed when a full month or more has passed since the latest billed due date and that latest billed installment had been drafted by monthly bank draft; exactly one such installment is then counted, and none is counted otherwise. For the newly due installment counted in the grace remittance, the insured''s issue age is the whole years from the insured''s date of birth to the issue date on record, the insured''s anniversary age is the whole years from the insured''s date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today. For the newly due installment counted in the grace remittance, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone. The band factor of the newly due installment counted in the grace remittance is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces. The standard band factor of the newly due installment counted in the grace remittance is 1.00. The face premium of the newly due installment counted in the grace remittance is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent. The fee before sharing in the newly due installment counted in the grace remittance is set by the face amount on record: the product''s annual policy fee less 10.00 below 250,000, the product''s annual policy fee less 20.00 at 1,000,000 or more, and the product''s annual policy fee from 250,000 up to 1,000,000. The long-standing fee concession in the newly due installment counted in the grace remittance is 10.00 once the policy has completed 20 policy years, 5.00 once it has completed 10 policy years, and nothing before that. The standard long-standing fee concession in the newly due installment counted in the grace remittance is nothing. The policy fee share in the newly due installment counted in the grace remittance follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise. The standard policy fee share in the newly due installment counted in the grace remittance is the whole fee. The policy fee of the newly due installment counted in the grace remittance is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent. The accidental death rider rate in the newly due installment counted in the grace remittance is 1.08 per 1,000 when the insured''s anniversary age is from 60 through 69, 0.84 per 1,000 when it is below 45, and the product''s accidental death rider rate per 1,000 at any other age. The standard accidental death rider rate in the newly due installment counted in the grace remittance is the product''s accidental death rider rate per 1,000. The accidental death charge of the newly due installment counted in the grace remittance is the accidental death rider amount on record divided by 1,000, times the accidental death rider rate, rounded to the cent. The children''s term unit rate in the newly due installment counted in the grace remittance is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product''s children''s term rate per unit below 5 units. The children''s term charge of the newly due installment counted in the grace remittance is the units on record times the children''s term unit rate. The waiver rate in the newly due installment counted in the grace remittance is 0.14 when the issue age is 45 or more, 0.09 when it is below 35, and 0.11 when it is from 35 through 44. The waiver charge base in the newly due installment counted in the grace remittance is chosen by issue age: the face premium plus the accidental death charge plus the children''s term charge when the issue age is 40 or more, the face premium plus the accidental death charge when it is from 30 through 39, and the face premium alone when it is below 30. When the waiver of premium rider is attached on record, the waiver charge of the newly due installment counted in the grace remittance is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge. The annual premium of the newly due installment counted in the grace remittance is the face premium plus the policy fee, the accidental death charge, the children''s term charge and the waiver charge. The modal factor for the newly due installment counted in the grace remittance is that of the premium mode on record: the product''s quarterly factor for quarterly, the product''s monthly bank-draft factor for monthly bank draft, the product''s semiannual factor for semiannual and the product''s annual factor for annual. The newly due installment counted in the grace remittance is the annual premium times the modal factor, rounded to the cent. The returned-item charge rate is 25.00 per item when 3 or more payments on the policy were returned unpaid in the 12 months ending today, 15.00 per item when 2 were, and nothing otherwise. The standard returned-item charge rate is nothing. The items charged are chosen by the owner''s standing with Ashgrove: when the owner holds an in-force Ashgrove whole life or universal life policy and at least one payment was returned in those 12 months, only the most recent returned item is charged; when the owner holds neither and 3 or more payments were returned, every returned item except the first of the 12 months is charged; otherwise every returned item of the 12 months is charged. The standard items charged are every returned item of the 12 months ending today. The returned-item charge is the returned-item charge rate times the items charged. The grace remittance is the overdue billed premium plus the newly due installment counted in the grace remittance times the installments counted, plus the returned-item charge, rounded to the cent; the policy returns to in force when the grace remittance is received no later than the last day of grace. The grace remittance is entered as one payment record that pays every installment it covers, the overdue billed installments first and the newly due installment next, and the paid-to date moves forward by one modal period of the mode in which each covered installment falls due: the mode under which an overdue installment was billed, and the premium mode on record for the newly due installment. The part of a grace remittance that pays the newly due installment and the returned-item charge is applied with it and is never treated as unapplied money. The grace remittance is fixed only after the premium mode on record shows quarterly direct billing for a policy whose bank drafts returned in the last 12 months have reached the returned-draft limit. Before the grace remittance is worked out, the waiver of premium rider on record must already be detached from a policy whose insured''s anniversary age has reached the waiver rider expiry age.'
    prerequisite:
    - problem: term_ext_eft_quarterly_conversion
      kind: value_input
      gate: mode_factor
      form: state
      policy_source: The grace remittance is fixed only after the premium mode on record shows quarterly direct billing for a policy whose bank drafts returned in the last 12 months have reached the returned-draft limit.
      condition: term_holdings.premium_mode is quarterly whenever the eft returns of the last 12 months on term_transactions have reached the returned-draft limit
      resolved_by: convert_to_quarterly_billing_2bfb08af
      effect: the modal factor of the newly due installment moves from the monthly bank-draft factor to the quarterly factor
    - problem: term_ext_waiver_expiry_repricing
      kind: value_input
      gate: waiver_charge
      form: state
      policy_source: Before the grace remittance is worked out, the waiver of premium rider on record must already be detached from a policy whose insured's anniversary age has reached the waiver rider expiry age.
      condition: term_holdings.waiver_of_premium_rider is false whenever the insured's anniversary age has reached the waiver rider expiry age
      resolved_by: end_expired_waiver_rider_bcdc46e8
      effect: the waiver charge of the newly due installment falls to nothing
    cross_category:
    - category: whole
      as: branch
      reads:
      - status
      - face_amount
      note: the band measurement face and the policy fee share read the owner's in-force Ashgrove whole life policies
    - category: ul
      as: branch
      reads:
      - status
      - face_amount
      note: the band measurement face and the policy fee share read the owner's in-force Ashgrove universal life policies
    compute:
    - billed_total: SUM('term_transactions', 'amount', event_type='term_premium_billed')
    - paid_total: SUM('term_transactions', 'amount', event_type='term_premium_paid')
    - returned_total: SUM('term_transactions', 'amount', event_type='term_premium_payment_returned')
    - overdue_billed: RND(billed_total - paid_total + returned_total, 2)
    - last_billed_due: LATEST('term_transactions', 'premium_due_date', date_field='premium_due_date', event_type='term_premium_billed')
    - last_was_draft: COUNT('term_transactions', event_type='term_premium_paid', premium_due_date=last_billed_due, payment_method='eft') > 0
    - newly_due_count: 1 if MONTHS(last_billed_due, NOW) >= 1 and last_was_draft else 0
    - issue_age: int(MONTHS(F('insured_date_of_birth'), F('issue_date')) / 12)
    - base_issue_age: int(MONTHS(F('insured_date_of_birth'), F('issue_date')) / 12)
    - anniv_age: int((MONTHS(F('insured_date_of_birth'), NOW) - MONTHS(F('issue_date'), NOW) % 12) / 12)
    - policy_years: int(MONTHS(F('issue_date'), NOW) / 12)
    - term_face: F('face_amount')
    - whole_face: CFIELD('whole', 'face_amount', insured_name=F('insured_name'), status='in_force') or 0
    - ul_face: CFIELD('ul', 'face_amount', insured_name=F('insured_name'), status='in_force') or 0
    - band_face: term_face + whole_face + ul_face if whole_face > 0 and ul_face > 0 else (term_face + whole_face + ul_face if whole_face > 0 or ul_face > 0 else term_face)
    - band: (K('art_band_1m') if band_face >= K('band_cut_1m') else (K('art_band_500k') if band_face >= K('band_cut_500k') else (K('art_band_250k') if band_face >= K('band_cut_250k') else 1.0))) if F('variant_name') == 'Ashgrove Annual Renewable Term' or MONTHS(F('issue_date'), NOW) >= 12 * P('level_premium_period_years') else (K('lt_band_1m') if band_face >= K('band_cut_1m') else (K('lt_band_500k') if band_face >= K('band_cut_500k') else (K('lt_band_250k') if band_face >= K('band_cut_250k') else 1.0)))
    - face_prem: RND(term_face / 1000 * F('base_rate_per_thousand') * band, 2)
    - fee_base: P('annual_policy_fee') - K('fee_small_off') if term_face < K('fee_small_cut') else (P('annual_policy_fee') - K('fee_large_off') if term_face >= K('fee_large_cut') else P('annual_policy_fee'))
    - concession: K('conc_20y') if policy_years >= 20 else (K('conc_10y') if policy_years >= 10 else 0.0)
    - owns_whole: CFIELD('whole', 'status', status='in_force') == 'in_force'
    - owns_ul: CFIELD('ul', 'status', status='in_force') == 'in_force'
    - fee_share: 0.0 if owns_whole and owns_ul else (K('fee_share_one') if owns_whole or owns_ul else 1.0)
    - fee: RND(MX(fee_base - concession, 0) * fee_share, 2)
    - adb_rate: K('adb_rate_60s') if anniv_age >= K('adb_age_lo') and anniv_age < K('adb_age_hi') else (K('adb_rate_young') if anniv_age < K('adb_age_young') else P('adb_rider_annual_rate_per_thousand'))
    - adb_charge: RND(F('adb_rider_amount') / 1000 * adb_rate, 2)
    - child_rate: K('child_rate_11') if F('child_rider_units') >= K('child_cut_11') else (K('child_rate_5') if F('child_rider_units') >= K('child_cut_5') else P('child_rider_annual_premium_per_unit'))
    - child_charge: RND(F('child_rider_units') * child_rate, 2)
    - waiver_rate: K('waiver_rate_45') if issue_age >= K('waiver_age_rate') else (K('waiver_rate_young') if issue_age < K('waiver_age_young') else K('waiver_rate_std'))
    - waiver_base: face_prem + adb_charge + child_charge if base_issue_age >= K('waiver_age_base') else (face_prem + adb_charge if base_issue_age >= 30 else face_prem)
    - waiver_charge: RND(waiver_rate * waiver_base, 2) if F('waiver_of_premium_rider') == True else 0.0
    - annual: RND(face_prem + fee + adb_charge + child_charge + waiver_charge, 2)
    - mode_factor: P('modal_factor_quarterly') if F('premium_mode') == 'quarterly' else (P('modal_factor_monthly_eft') if F('premium_mode') == 'monthly_eft' else (P('modal_factor_semiannual') if F('premium_mode') == 'semiannual' else P('modal_factor_annual')))
    - newdue_installment: RND(annual * mode_factor, 2)
    - returns_12m: COUNT('term_transactions', within_months=12, date_field='transaction_date', event_type='term_premium_payment_returned')
    - item_charge: K('item_charge_high') if returns_12m >= K('items_high') else (K('item_charge_low') if returns_12m >= K('items_low') else 0.0)
    - holds_permanent: CFIELD('whole', 'status', status='in_force') == 'in_force' or CFIELD('ul', 'status', status='in_force') == 'in_force'
    - items_charged: 1 if holds_permanent and returns_12m >= 1 else (returns_12m - 1 if returns_12m >= K('items_high') and not holds_permanent else returns_12m)
    - return_charge: RND(item_charge * items_charged, 2)
    - result: RND(overdue_billed + newly_due_count * newdue_installment + return_charge, 2)
