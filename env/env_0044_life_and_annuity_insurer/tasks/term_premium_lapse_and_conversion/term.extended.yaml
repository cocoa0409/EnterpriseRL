    compute:
    - issue_age: int(MONTHS(F('insured_date_of_birth'), F('issue_date')) / 12)
    - base_issue_age: int(MONTHS(F('insured_date_of_birth'), F('issue_date')) / 12)
    - anniv_age: int((MONTHS(F('insured_date_of_birth'), NOW) - MONTHS(F('issue_date'), NOW) % 12) / 12)
