  - id: term_ext_accelerated_lien
    base_policy_refs:
    - term_agg_insured_face_limit
    - term_evt_accelerated_benefit
    overwrite:
    - base_policy: term_evt_accelerated_benefit
      superseded_clause: The amount paid is the elected amount reduced by tiadb_discount_rate and then by tiadb_admin_fee, rounded to the cent; the lien is the full elected amount and earns no interest.
      replaced_by: The lien is the accelerated amount plus the lien charge, the administrative charge and the premium set aside, rounded to the cent; the owner is paid the accelerated amount and the lien earns no further interest.
    - base_policy: term_evt_accelerated_benefit
      superseded_clause: The elected amount may not exceed the lower of tiadb_max_pct of the face amount and tiadb_max_amount less term_msr_tiadb_accelerated_on_insured, and the face amount less the resulting lien may not fall below tiadb_min_remaining_face.
      replaced_by: 'The acceleration room is worked out by one of three methods: when the owner has terminal illness advances paid on an Ashgrove whole life policy, it is the product''s maximum acceleration amount less the advances already paid on this policy and less those whole life advances; when there are none on whole life but advances were already paid on this policy, it is that maximum less the advances on this policy; otherwise it is that maximum.'
    trigger: on_request
    subject:
    - term_tiadb_advance_paid
    computes: lien_amount
    target_tool: pay_accelerated_advance_7c43a05b
    params:
      fee_mid: 100.0
      courtesy_half: 0.5
      courtesy_three_q: 0.75
    rule: 'An approved terminal illness accelerated benefit claim is paid as an advance and placed on the policy as a lien; the lien is the accelerated amount plus the lien charge, the administrative charge and the premium set aside from the advance. The elected amount is the amount on the approved accelerated benefit claim, and the physician-certified life expectancy is the one on that claim. The acceleration room is worked out by one of three methods: when the owner has terminal illness advances paid on an Ashgrove whole life policy, it is the product''s maximum acceleration amount less the advances already paid on this policy and less those whole life advances; when there are none on whole life but advances were already paid on this policy, it is that maximum less the advances on this policy; otherwise it is that maximum. The standard acceleration room is the product''s maximum acceleration amount less the advances already paid on this policy. The accelerated amount is the lowest of the elected amount, the product''s maximum acceleration share of the face amount on record, the acceleration room, and the face amount on record less the product''s minimum remaining face. The lien charge rate is chosen by method: no charge when the life expectancy is 3 months or less; the product''s acceleration discount rate times the life expectancy in months over 12 when it is from 4 through 9 months; and the product''s acceleration discount rate in full otherwise. The standard lien charge rate is the product''s acceleration discount rate in full. The lien charge is the accelerated amount times the lien charge rate, rounded to the cent. The administrative charge before courtesy is nothing when the life expectancy is 3 months or less, 100.00 when it is from 4 through 9 months, and the product''s acceleration administrative fee otherwise. The standard administrative charge before courtesy is the product''s acceleration administrative fee. The courtesy share of the administrative charge is one half when the owner had a terminal illness advance paid on an Ashgrove whole life policy within the 12 months ending today and the life expectancy is 9 months or less, three quarters when such a whole life advance was paid within those 12 months and the life expectancy is longer, and the whole charge otherwise. The standard courtesy share is the whole administrative charge. The administrative charge is the administrative charge before courtesy times the courtesy share, rounded to the cent. The premium months to cover are none while an approved waiver of premium claim is on file, 6 months when the life expectancy is 6 months or less, and the life expectancy in months when it is longer. The standard premium months to cover are none. The months to set aside are worked out from the premium months to cover by one of three methods: when the paid-to date on record is after today and the whole months from today to it cover all of the premium months, nothing is set aside; when the paid-to date is after today but covers only part of them, the whole months already paid are taken off; otherwise, the paid-to date not being after today, the premium months to cover are set aside as they are. The standard months to set aside are the premium months to cover as they are. The premium set aside is the installment premium on record times the number of installments of the premium mode on record (one month each for monthly bank draft, three for quarterly, six for semiannual, twelve for annual) needed to cover the months to set aside, a part installment counting as a whole one. The lien is the accelerated amount plus the lien charge, the administrative charge and the premium set aside, rounded to the cent; the owner is paid the accelerated amount and the lien earns no further interest. Before the lien is worked out, the accidental death rider amount on record must already be zero for an insured whose anniversary age has reached the rider expiry age. The advance is paid only once the policy status on record has returned from lapsed to in force.'
    prerequisite:
    - problem: term_ext_adb_expiry_repricing
      kind: value_input
      gate: premium_set_aside
      form: state
      policy_source: Before the lien is worked out, the accidental death rider amount on record must already be zero for an insured whose anniversary age has reached the rider expiry age.
      condition: term_holdings.adb_rider_amount is 0 and term_holdings.modal_premium excludes the accidental death charge whenever the insured's anniversary age has reached the rider expiry age
      resolved_by: end_expired_adb_rider_b05b3f4a
      effect: the installment premium on record drops by the accidental death charge, so the premium set aside and the lien fall
    - problem: term_ext_reinstatement_collection
      kind: state_gate
      gate: term_evt_accelerated_benefit.acceleration_status
      form: state
      policy_source: The advance is paid only once the policy status on record has returned from lapsed to in force.
      condition: term_holdings.status is in_force, having moved from lapsed
      resolved_by: pay_reinstatement_amount_3f8d4404
      effect: the acceleration status gate (in force) becomes satisfied
    cross_category:
    - category: whole
      as: history
      reads:
      - whole_transactions.amount
      - whole_transactions.transaction_date
      note: the acceleration room and the administrative courtesy read the owner's whole life terminal illness advances
    compute:
    - elected: MAX('term_service_requests', 'requested_amount', request_type='accelerated_benefit', request_status='approved')
    - life_exp: LATEST('term_service_requests', 'life_expectancy_months', date_field='decision_date', request_type='accelerated_benefit', request_status='approved')
    - term_advances: SUM('term_transactions', 'amount', event_type='term_tiadb_advance_paid')
    - whole_advances: XSUM('whole', 'whole_transactions', 'amount', event_type='whole_tiadb_advance_paid')
    - room: P('tiadb_max_amount') - term_advances - whole_advances if whole_advances > 0 else (P('tiadb_max_amount') - term_advances if term_advances > 0 else P('tiadb_max_amount'))
    - accelerated: MN(elected, P('tiadb_max_pct') * F('face_amount'), room, F('face_amount') - P('tiadb_min_remaining_face'))
    - charge_rate: 0.0 if life_exp <= 3 else (P('tiadb_discount_rate') * life_exp / 12 if life_exp <= 9 else P('tiadb_discount_rate'))
    - lien_charge: RND(accelerated * charge_rate, 2)
    - fee_le: LATEST('term_service_requests', 'life_expectancy_months', date_field='decision_date', request_type='accelerated_benefit', request_status='approved')
    - fee_amount: 0.0 if fee_le <= 3 else (K('fee_mid') if fee_le <= 9 else P('tiadb_admin_fee'))
    - recent_whole_adv: XCOUNT('whole', 'whole_transactions', within_months=12, date_field='transaction_date', event_type='whole_tiadb_advance_paid')
    - courtesy: K('courtesy_half') if recent_whole_adv >= 1 and life_exp <= 9 else (K('courtesy_three_q') if recent_whole_adv >= 1 and life_exp > 9 else 1.0)
    - admin_charge: RND(fee_amount * courtesy, 2)
    - waiver_claims: COUNT('term_service_requests', request_type='waiver_of_premium_claim', request_status='approved')
    - prem_months: 0 if waiver_claims > 0 else (6 if life_exp <= 6 else life_exp)
    - months_set_aside: 0 if F('paid_to_date') > NOW and MONTHS(NOW, F('paid_to_date')) >= prem_months else (prem_months - MONTHS(NOW, F('paid_to_date')) if F('paid_to_date') > NOW else prem_months)
    - inst_months: 1 if F('premium_mode') == 'monthly_eft' else (3 if F('premium_mode') == 'quarterly' else (6 if F('premium_mode') == 'semiannual' else 12))
    - premium_set_aside: RND(F('modal_premium') * (-((-months_set_aside) // inst_months)), 2)
    - result: RND(accelerated + lien_charge + admin_charge + premium_set_aside, 2)
