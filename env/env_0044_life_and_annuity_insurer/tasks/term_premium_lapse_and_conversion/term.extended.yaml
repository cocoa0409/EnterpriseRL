    factors:
    - id: band_measurement
      effect: method
      decides: band_face
      bindings:
      - whole_face
      - ul_face
      - band_face
      ladder:
      - when: an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured
        method: the band is measured on the face amount on record plus both permanent face amounts
      - when: exactly one of the two is in force for the insured
        method: the band is measured on the face amount on record plus that permanent face amount
      - when: otherwise
        method: the band is measured on the face amount on record alone
      baseline:
        band_face: term_face
      evidence:
      - cross_category
      cross_difficulty: whole
    - id: size_band
      effect: parameter
      decides: band
      bindings:
      - band
      ladder:
      - when: the band measurement face is 1,000,000 or more
        value: 0.74 on the level term ladder, 0.82 on the renewable ladder
      - when: the band measurement face is from 500,000 up to 1,000,000
        value: 0.80 on the level term ladder, 0.86 on the renewable ladder
      - when: the band measurement face is from 250,000 up to 500,000
        value: 0.88 on the level term ladder, 0.92 on the renewable ladder
      - when: otherwise
        value: '1.00'
      baseline:
        band: '1.0'
      evidence:
      - date
      cross_difficulty: null
    - id: fee_share
      effect: parameter
      decides: fee_share
      bindings:
      - owns_whole
      - owns_ul
      - fee_share
      ladder:
      - when: the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy
        value: nothing
      - when: the owner holds exactly one of the two in force
        value: one half
      - when: otherwise
        value: the whole fee
      baseline:
        fee_share: '1.0'
      evidence:
      - cross_category
      cross_difficulty: whole
    - id: adb_rate_in_effect
      effect: parameter
      decides: adb_rate
      bindings:
      - due_age
      - adb_rate
      ladder:
      - when: the insured's age for the due date has reached the accidental death rider expiry age
        value: nothing (the rider has ended)
      - when: the insured's age for the due date is from 60 through 69
        value: 1.08 per 1,000
      - when: the insured's age for the due date is below 45
        value: 0.84 per 1,000
      - when: otherwise
        value: the product's accidental death rider rate per 1,000
      baseline:
        adb_rate: P('adb_rider_annual_rate_per_thousand')
      evidence:
      - date
      cross_difficulty: null
