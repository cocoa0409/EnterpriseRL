      unearned_premium_refund_on_death: "=unearned_premium_refund_on_death"
      death_claim_interest_rate: "=death_claim_interest_rate"
      minor_beneficiary_age: "=minor_beneficiary_age"
      beneficiary_access_account_min: "=beneficiary_access_account_min"
    formula:
      gross_proceeds: face_amount - premium_outstanding - tiadb_lien
  - id: term_beneficiary_designation
    subject: [term_beneficiary_designated]
    rule: "The owner names primary and contingent beneficiaries; the insured, if not the owner, has no say. A beneficiary designation is recorded only while the policy status is applied, in_force or grace_period. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. A new designation replaces the whole earlier designation and takes effect on the date the owner signed it, provided the owner signed it while the insured was living; Ashgrove is discharged for any payment made before the request was received. Shares are whole percents of at least beneficiary_min_share_pct; the shares within each class must total 100; no more than beneficiary_max_primary primary beneficiaries may be named. A trust or the estate may be named; a minor may be named, but the minor's share is paid under term_death_claim. After the insured's death no change is accepted."
    eligibility:
      - id: designation_status
        applies_to: [term_beneficiary_designated]
        kind: state
        condition: "A beneficiary designation is recorded only while the policy status is applied, in_force or grace_period."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [applied, in_force, grace_period]
      - id: signed_change_request
        applies_to: [term_beneficiary_designated]
        kind: authorization
        condition: "A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary."
        evidence_fields: [term_service_requests.request_type, term_service_requests.signed_date, term_service_requests.term_request_id, term_transactions.designation_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
    params:
      beneficiary_min_share_pct: "=beneficiary_min_share_pct"
      beneficiary_max_primary: "=beneficiary_max_primary"
  - id: term_free_look_and_cancellation
    subject: [term_free_look_cancelled, term_owner_cancelled, term_premium_refunded]
    rule: "The owner may return a new policy for a full refund of every premium paid. The returned policy must be received no later than the policy delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time. When the sale replaced existing coverage, free_look_days_replacement replaces free_look_days. A free-look return voids the contract from issue. After the free-look period the owner may cancel by signed request; cancellation takes effect on the date requested, which may not be earlier than the date the request is received, and premium paid for complete policy months after the month in which cancellation takes effect is refunded. Monthly EFT installments are never refunded on cancellation. A cancelled policy cannot be reinstated."
    eligibility:
      - id: within_free_look
        applies_to: [term_free_look_cancelled]
        kind: time
        condition: "The returned policy must be received no later than the policy delivery date plus free_look_days."
        evidence_fields: [term_holdings.policy_delivery_date, term_holdings.replacement_sale, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the policy delivery date"
          anchor_source: term_holdings.policy_delivery_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time."
          boundary: inclusive
    params:
      free_look_days: "=free_look_days"
      free_look_days_replacement: "=free_look_days_replacement"
  - id: term_expiry_and_renewal
    subject: [term_policy_expired, term_annual_rate_reset, term_rider_removed]
    rule: "Each tier is guaranteed renewable without evidence until the policy anniversary on or after the insured's attained age reaches coverage_expiry_age, when coverage expires without value. The premium rate per 1,000 is guaranteed for level_premium_period_years from the issue date; from the first anniversary after that period, and on every anniversary of the Ashgrove Annual Renewable Term, the rate is re-set to the guaranteed attained-age renewal rate. The waiver of premium rider ends on the anniversary at waiver_rider_expiry_age and the accidental death benefit rider on the anniversary at adb_rider_expiry_age; their charges stop from the next installment due."
    eligibility: []
    params:
      coverage_expiry_age: "=coverage_expiry_age"
      level_premium_period_years: "=level_premium_period_years"
      waiver_rider_expiry_age: "=waiver_rider_expiry_age"
      adb_rider_expiry_age: "=adb_rider_expiry_age"
  - id: term_rider_changes
    subject: [term_rider_removed]
    rule: "The owner may remove the waiver of premium rider or the accidental death benefit rider, or reduce the children's term rider units, by signed request. A rider change is processed only while the policy status is in_force or grace_period. The change takes effect with the next installment due and the premium is recalculated under term_premium_calculation; rider charges already paid are not refunded. Children's term rider units may not exceed child_rider_max_units at child_rider_unit_amount each, and the accidental death benefit rider may not exceed adb_rider_max_amount. Adding a rider or increasing a rider after issue requires new underwriting and is not available through policy service."
    eligibility:
      - id: rider_change_status
        applies_to: [term_rider_removed]
        kind: state
        condition: "A rider change is processed only while the policy status is in_force or grace_period."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [in_force, grace_period]
    params:
      child_rider_max_units: "=child_rider_max_units"
      child_rider_unit_amount: "=child_rider_unit_amount"
      adb_rider_max_amount: "=adb_rider_max_amount"

extended_policies:
  - id: term_ext_eft_quarterly_conversion
    base_policy_refs:
    - term_premium_calculation
    - term_evt_returned_eft
    - term_mode_change
    overwrite:
    - base_policy: term_premium_calculation
      superseded_clause: The face premium is the face amount divided by 1,000, times base_rate_per_thousand, times the band factor, rounded to the cent; the band factor is the band_factor of the highest premium_band_ladder band whose min_face does not exceed the face amount in force for the installment.
      replaced_by: 'For the converted quarterly installment, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone.'
    - base_policy: term_premium_calculation
      superseded_clause: The annual premium is the face premium plus the annual policy fee plus rider charges.
      replaced_by: The policy fee of the converted quarterly installment is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent.
    - base_policy: term_premium_calculation
      superseded_clause: 'Rider charges are: children''s term rider units times child_rider_annual_premium_per_unit; the accidental death benefit rider amount divided by 1,000 times adb_rider_annual_rate_per_thousand; and, when the waiver of premium rider is attached, waiver_rider_charge_pct of the face premium, rounded to the cent.'
      replaced_by: The children's term unit rate in the converted quarterly installment is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product's children's term rate per unit below 5 units.
    - base_policy: term_premium_calculation
      superseded_clause: The installment premium is the annual premium times the modal factor of the premium mode (modal_factor_annual, modal_factor_semiannual, modal_factor_quarterly or modal_factor_monthly_eft), rounded to the cent.
      replaced_by: The converted quarterly installment is the annual premium times the product's quarterly factor, rounded to the cent.
    trigger: state_due
    subject:
    - term_premium_mode_changed
    computes: new_modal_premium
    target_tool: convert_to_quarterly_billing_2bfb08af
    params:
      band_cut_1m: 1000000
      band_cut_500k: 500000
      band_cut_250k: 250000
      art_band_1m: 0.82
      art_band_500k: 0.86
      art_band_250k: 0.92
      lt_band_1m: 0.74
      lt_band_500k: 0.8
      lt_band_250k: 0.88
      fee_share_one: 0.5
      fee_small_cut: 250000
      fee_small_off: 10.0
      fee_large_cut: 1000000
      fee_large_off: 20.0
      conc_20y: 10.0
      conc_10y: 5.0
      adb_rate_60s: 1.08
      adb_age_lo: 60
      adb_age_hi: 70
      adb_rate_young: 0.84
      adb_age_young: 45
      child_cut_11: 11
      child_cut_5: 5
      child_rate_11: 5.0
      child_rate_5: 5.5
      waiver_rate_45: 0.14
      waiver_rate_std: 0.11
      waiver_rate_young: 0.09
      waiver_age_rate: 45
      waiver_age_young: 35
      waiver_age_base: 40
    rule: 'When a policy''s monthly bank-draft privilege ends because its returned bank drafts reach the product''s returned-draft limit, Ashgrove converts the policy to quarterly direct billing and sets the converted quarterly installment from the premium components as they stand on record, every rider still attached on record being charged. For the converted quarterly installment, the insured''s issue age is the whole years from the insured''s date of birth to the issue date on record, the insured''s anniversary age is the whole years from the insured''s date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today. For the converted quarterly installment, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone. The band factor of the converted quarterly installment is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces. The standard band factor of the converted quarterly installment is 1.00. The face premium of the converted quarterly installment is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent. The fee before sharing in the converted quarterly installment is set by the face amount on record: the product''s annual policy fee less 10.00 below 250,000, the product''s annual policy fee less 20.00 at 1,000,000 or more, and the product''s annual policy fee from 250,000 up to 1,000,000. The long-standing fee concession in the converted quarterly installment is 10.00 once the policy has completed 20 policy years, 5.00 once it has completed 10 policy years, and nothing before that. The policy fee share in the converted quarterly installment follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise. The standard policy fee share in the converted quarterly installment is the whole fee. The policy fee of the converted quarterly installment is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent. The accidental death rider rate in the converted quarterly installment is 1.08 per 1,000 when the insured''s anniversary age is from 60 through 69, 0.84 per 1,000 when it is below 45, and the product''s accidental death rider rate per 1,000 at any other age. The accidental death charge of the converted quarterly installment is the accidental death rider amount on record divided by 1,000, times the accidental death rider rate, rounded to the cent. The children''s term unit rate in the converted quarterly installment is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product''s children''s term rate per unit below 5 units. The children''s term charge of the converted quarterly installment is the units on record times the children''s term unit rate. The waiver rate in the converted quarterly installment is 0.14 when the issue age is 45 or more, 0.09 when it is below 35, and 0.11 when it is from 35 through 44. The standard waiver rate in the converted quarterly installment is 0.11. The waiver charge base in the converted quarterly installment is chosen by issue age: the face premium plus the accidental death charge plus the children''s term charge when the issue age is 40 or more, the face premium plus the accidental death charge when it is from 30 through 39, and the face premium alone when it is below 30. The standard waiver charge base in the converted quarterly installment is the face premium alone. When the waiver of premium rider is attached on record, the waiver charge of the converted quarterly installment is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge. The annual premium of the converted quarterly installment is the face premium plus the policy fee, the accidental death charge, the children''s term charge and the waiver charge. The converted quarterly installment is the annual premium times the product''s quarterly factor, rounded to the cent.'
    prerequisite: []
    cross_category:
    - category: whole
      as: branch
      reads:
      - status
      - face_amount
      note: the band measurement face and the policy fee share read the owner's in-force Ashgrove whole life policies
    - category: ul
      as: branch
      reads:
      - status
      - face_amount
      note: the band measurement face and the policy fee share read the owner's in-force Ashgrove universal life policies
    compute:
    - issue_age: int(MONTHS(F('insured_date_of_birth'), F('issue_date')) / 12)
    - base_issue_age: int(MONTHS(F('insured_date_of_birth'), F('issue_date')) / 12)
    - anniv_age: int((MONTHS(F('insured_date_of_birth'), NOW) - MONTHS(F('issue_date'), NOW) % 12) / 12)
    - policy_years: int(MONTHS(F('issue_date'), NOW) / 12)
    - term_face: F('face_amount')
    - whole_face: CFIELD('whole', 'face_amount', insured_name=F('insured_name'), status='in_force') or 0
    - ul_face: CFIELD('ul', 'face_amount', insured_name=F('insured_name'), status='in_force') or 0
    - band_face: term_face + whole_face + ul_face if whole_face > 0 and ul_face > 0 else (term_face + whole_face + ul_face if whole_face > 0 or ul_face > 0 else term_face)
    - band: (K('art_band_1m') if band_face >= K('band_cut_1m') else (K('art_band_500k') if band_face >= K('band_cut_500k') else (K('art_band_250k') if band_face >= K('band_cut_250k') else 1.0))) if F('variant_name') == 'Ashgrove Annual Renewable Term' or MONTHS(F('issue_date'), NOW) >= 12 * P('level_premium_period_years') else (K('lt_band_1m') if band_face >= K('band_cut_1m') else (K('lt_band_500k') if band_face >= K('band_cut_500k') else (K('lt_band_250k') if band_face >= K('band_cut_250k') else 1.0)))
    - face_prem: RND(term_face / 1000 * F('base_rate_per_thousand') * band, 2)
    - fee_base: P('annual_policy_fee') - K('fee_small_off') if term_face < K('fee_small_cut') else (P('annual_policy_fee') - K('fee_large_off') if term_face >= K('fee_large_cut') else P('annual_policy_fee'))
    - concession: K('conc_20y') if policy_years >= 20 else (K('conc_10y') if policy_years >= 10 else 0.0)
    - owns_whole: CFIELD('whole', 'status', status='in_force') == 'in_force'
    - owns_ul: CFIELD('ul', 'status', status='in_force') == 'in_force'
    - fee_share: 0.0 if owns_whole and owns_ul else (K('fee_share_one') if owns_whole or owns_ul else 1.0)
    - fee: RND(MX(fee_base - concession, 0) * fee_share, 2)
    - adb_rate: K('adb_rate_60s') if anniv_age >= K('adb_age_lo') and anniv_age < K('adb_age_hi') else (K('adb_rate_young') if anniv_age < K('adb_age_young') else P('adb_rider_annual_rate_per_thousand'))
    - adb_charge: RND(F('adb_rider_amount') / 1000 * adb_rate, 2)
    - child_rate: K('child_rate_11') if F('child_rider_units') >= K('child_cut_11') else (K('child_rate_5') if F('child_rider_units') >= K('child_cut_5') else P('child_rider_annual_premium_per_unit'))
    - child_charge: RND(F('child_rider_units') * child_rate, 2)
    - waiver_rate: K('waiver_rate_45') if issue_age >= K('waiver_age_rate') else (K('waiver_rate_young') if issue_age < K('waiver_age_young') else K('waiver_rate_std'))
    - waiver_base: face_prem + adb_charge + child_charge if base_issue_age >= K('waiver_age_base') else (face_prem + adb_charge if base_issue_age >= 30 else face_prem)
    - waiver_charge: RND(waiver_rate * waiver_base, 2) if F('waiver_of_premium_rider') == True else 0.0
    - annual: RND(face_prem + fee + adb_charge + child_charge + waiver_charge, 2)
    - result: RND(annual * P('modal_factor_quarterly'), 2)
    compute_basis:
      issue_age: For the converted quarterly installment, the insured's issue age is the whole years from the insured's date of birth to the issue date on record, the insured's anniversary age is the whole years from the insured's date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today.
      base_issue_age: For the converted quarterly installment, the insured's issue age is the whole years from the insured's date of birth to the issue date on record, the insured's anniversary age is the whole years from the insured's date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today.
      anniv_age: For the converted quarterly installment, the insured's issue age is the whole years from the insured's date of birth to the issue date on record, the insured's anniversary age is the whole years from the insured's date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today.
      policy_years: For the converted quarterly installment, the insured's issue age is the whole years from the insured's date of birth to the issue date on record, the insured's anniversary age is the whole years from the insured's date of birth to the most recent policy anniversary on or before today, and the policy years completed are the whole years from the issue date to today.
      whole_face: 'For the converted quarterly installment, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone.'
      ul_face: 'For the converted quarterly installment, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone.'
      band_face: 'For the converted quarterly installment, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone.'
      band: 'The band factor of the converted quarterly installment is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces.'
      face_prem: The face premium of the converted quarterly installment is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent.
      fee_base: 'The fee before sharing in the converted quarterly installment is set by the face amount on record: the product''s annual policy fee less 10.00 below 250,000, the product''s annual policy fee less 20.00 at 1,000,000 or more, and the product''s annual policy fee from 250,000 up to 1,000,000.'
      concession: The long-standing fee concession in the converted quarterly installment is 10.00 once the policy has completed 20 policy years, 5.00 once it has completed 10 policy years, and nothing before that.
      owns_whole: 'The policy fee share in the converted quarterly installment follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      owns_ul: 'The policy fee share in the converted quarterly installment follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      fee_share: 'The policy fee share in the converted quarterly installment follows the owner''s other Ashgrove life policies: nothing of the fee is charged when the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy, one half of it when the owner holds exactly one of the two in force, and the whole of it otherwise.'
      fee: The policy fee of the converted quarterly installment is the fee before sharing less the long-standing fee concession, never below nothing, times the policy fee share, rounded to the cent.
      adb_rate: The accidental death rider rate in the converted quarterly installment is 1.08 per 1,000 when the insured's anniversary age is from 60 through 69, 0.84 per 1,000 when it is below 45, and the product's accidental death rider rate per 1,000 at any other age.
      adb_charge: The accidental death charge of the converted quarterly installment is the accidental death rider amount on record divided by 1,000, times the accidental death rider rate, rounded to the cent.
      child_rate: The children's term unit rate in the converted quarterly installment is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product's children's term rate per unit below 5 units.
      child_charge: The children's term charge of the converted quarterly installment is the units on record times the children's term unit rate.
      waiver_rate: The waiver rate in the converted quarterly installment is 0.14 when the issue age is 45 or more, 0.09 when it is below 35, and 0.11 when it is from 35 through 44.
      waiver_base: 'The waiver charge base in the converted quarterly installment is chosen by issue age: the face premium plus the accidental death charge plus the children''s term charge when the issue age is 40 or more, the face premium plus the accidental death charge when it is from 30 through 39, and the face premium alone when it is below 30.'
      waiver_charge: When the waiver of premium rider is attached on record, the waiver charge of the converted quarterly installment is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge.
      annual: The annual premium of the converted quarterly installment is the face premium plus the policy fee, the accidental death charge, the children's term charge and the waiver charge.
      result: The converted quarterly installment is the annual premium times the product's quarterly factor, rounded to the cent.
    factors:
    - id: size_band
      effect: parameter
      decides: band
      bindings:
      - band
      ladder:
      - when: the band measurement face is 1,000,000 or more
        value: 0.74 on the level term ladder, 0.82 on the renewable ladder
      - when: the band measurement face is from 500,000 up to 1,000,000
        value: 0.80 on the level term ladder, 0.86 on the renewable ladder
      - when: the band measurement face is from 250,000 up to 500,000
        value: 0.88 on the level term ladder, 0.92 on the renewable ladder
      - when: otherwise
        value: '1.00'
      baseline:
        band: '1.0'
      evidence:
      - date
      cross_difficulty: null
    - id: fee_share
      effect: parameter
      decides: fee_share
      bindings:
      - owns_whole
      - owns_ul
      - fee_share
      ladder:
      - when: the owner holds both an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy
        value: nothing
      - when: the owner holds exactly one of the two in force
        value: one half
      - when: otherwise
        value: the whole fee
      baseline:
        fee_share: '1.0'
      evidence:
      - cross_category
      cross_difficulty: whole
    - id: waiver_issue_age_rate
      effect: parameter
