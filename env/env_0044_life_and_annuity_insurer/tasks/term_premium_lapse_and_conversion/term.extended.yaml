    rule: 'The waiver of premium rider ends on the policy anniversary at which the insured''s anniversary age reaches the product''s waiver rider expiry age; Ashgrove then detaches the rider and sets the installment after the waiver rider ends by taking the waiver charge out of the installment premium on record. For the waiver removal reckoning, the insured''s issue age is the whole years from the insured''s date of birth to the issue date on record, and the insured''s anniversary age is the whole years from the insured''s date of birth to the most recent policy anniversary on or before today. For the waiver removal reckoning, the band measurement face is chosen by the owner''s Ashgrove permanent coverage on the same insured: when an in-force Ashgrove whole life policy and an in-force Ashgrove universal life policy are both on record for the insured, it is the face amount on record plus both permanent face amounts; when exactly one of the two is in force for the insured, it is the face amount on record plus that one permanent face amount; otherwise it is the face amount on record alone. The standard band measurement face for the waiver removal reckoning is the face amount on record alone. The band factor of the waiver removal reckoning is read from the band measurement face on one of two ladders: the renewable ladder applies to the Ashgrove Annual Renewable Term and to any term policy past its level premium period, and the level term ladder applies to a level term policy within its level premium period; the renewable ladder gives 0.82 at 1,000,000 or more, 0.86 from 500,000 up to 1,000,000, 0.92 from 250,000 up to 500,000 and 1.00 below 250,000, and the level term ladder gives 0.74, 0.80, 0.88 and 1.00 at the same faces. The standard band factor of the waiver removal reckoning is 1.00. The face premium of the waiver removal reckoning is the face amount on record divided by 1,000, times the rate per 1,000 on record, times the band factor, rounded to the cent. The accidental death rider rate in the waiver removal reckoning is 1.08 per 1,000 when the insured''s anniversary age is from 60 through 69, 0.84 per 1,000 when it is below 45, and the product''s accidental death rider rate per 1,000 at any other age. The accidental death charge of the waiver removal reckoning is the accidental death rider amount on record divided by 1,000, times the accidental death rider rate, rounded to the cent. The children''s term unit rate in the waiver removal reckoning is 5.00 when 11 or more units are on record, 5.50 when 5 through 10 units are on record, and the product''s children''s term rate per unit below 5 units. The children''s term charge of the waiver removal reckoning is the units on record times the children''s term unit rate. The waiver rate in the waiver removal reckoning is 0.14 when the issue age is 45 or more, 0.09 when it is below 35, and 0.11 when it is from 35 through 44. The standard waiver rate in the waiver removal reckoning is 0.11. The waiver charge base in the waiver removal reckoning is chosen by issue age: the face premium plus the accidental death charge plus the children''s term charge when the issue age is 40 or more, the face premium plus the accidental death charge when it is from 30 through 39, and the face premium alone when it is below 30. The standard waiver charge base in the waiver removal reckoning is the face premium alone. When the waiver of premium rider is attached on record, the waiver charge of the waiver removal reckoning is the waiver rate times the waiver charge base, rounded to the cent; when it is not attached there is no waiver charge. The modal factor for the waiver removal reckoning is that of the premium mode on record: the product''s quarterly factor for quarterly, the product''s monthly bank-draft factor for monthly bank draft, the product''s semiannual factor for semiannual and the product''s annual factor for annual. The waiver charge removed when the rider ends is the waiver rate times the waiver charge base, rounded to the cent, and its installment share is that charge times the modal factor of the premium mode on record, rounded to the cent. The installment after the waiver rider ends is the installment premium on record less the installment share of the waiver charge removed, rounded to the cent. The installment after the waiver rider ends is set only after the installment premium on record has been converted to quarterly direct billing for a policy whose returned bank drafts of the last 12 months have reached the returned-draft limit.'
