      conc_10y: 5.0
      adb_rate_60s: 1.08
      adb_age_lo: 60
      adb_age_hi: 70
      adb_rate_young: 0.84
      adb_age_young: 45
      child_cut_11: 11
      child_cut_5: 5
      child_rate_11: 5.0
      child_rate_5: 5.5
      waiver_rate_45: 0.14
      waiver_rate_std: 0.11
      waiver_rate_young: 0.09
      waiver_age_rate: 45
      waiver_age_young: 35
      waiver_age_base: 40
      item_charge_high: 25.0
      item_charge_low: 15.0
      items_high: 3
