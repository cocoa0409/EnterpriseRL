            value: "K('early_settlement_discount_full')"
          - when: "they number fewer than the full-discount number but at least the partial-discount number"
            value: "K('early_settlement_discount_partial')"
          - when: "otherwise (fewer than the partial-discount number remaining)"
            value: "0"
        baseline:
          settlement_discount: "0"
        evidence: [date]
        cross_difficulty: null
