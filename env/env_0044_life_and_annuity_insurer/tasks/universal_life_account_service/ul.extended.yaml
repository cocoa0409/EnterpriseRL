        evidence: [history, date]
        cross_difficulty: null
      - id: protected_deduction_reserve
        effect: method
        decides: deduction_reserve
        bindings: [deduction_reserve]
        ladder:
          - when: "the insured's attained age on the exercise date is at least the senior reserve age"
            method: "a reserve of a fixed count, the senior reserve months, of the current monthly deduction is left out of the value"
          - when: "the insured is below the senior reserve age and the policy year is before the reserve-end policy year"
            method: "a reserve of the current monthly deduction for each monthly anniversary still to fall due after the exercise date up to and including the next policy anniversary is left out"
