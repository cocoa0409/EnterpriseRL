  - id: ul_ext_overloan_charge
    base_policy_refs: [ul_overloan_protection]
    overwrite:
      - base_policy: ul_overloan_protection
        superseded_clause: >-
          On exercise overloan_charge_pct of the account value is deducted
        replaced_by: >-
          The overloan protection charge is the value the charge is taken on, times the overloan charge rate, times the persistency share, times the household share, times one plus the indebtedness surcharge, all multiplied together before a single rounding to the cent.
    trigger: state_due
    subject: [ul_overloan_protection_charged]
    computes: overloan_charge
    target_tool: assess_overloan_charge_72382565
    params:
      long_duration_policy_year: 25
      long_duration_attained_age: 85
      long_duration_charge_pct: 0.025
      mid_duration_policy_year: 20
      mid_duration_charge_pct: 0.03
      mid_duration_attained_age: 78
      full_carry_days: 15
      persistency_premiums_long: 15
      persistency_premiums_mid: 10
      persistency_share_long: 0.90
      persistency_share_mid: 0.95
      surcharge_high_ratio: 0.99
      surcharge_mid_ratio: 0.97
      surcharge_high: 0.10
      surcharge_mid: 0.05
      household_large_value: 50000
      household_share_large: 0.90
      household_share_small: 0.95
    rule: >-
      When an approved overloan protection election is carried out, a one-time overloan protection charge is deducted from the account value and booked in the policy's activity history.
      The overloan protection charge is figured only after the policy's loan interest paid-to date stands at the date the charge is figured, so that no loan interest is left accruing from an earlier date.
      The standard overloan protection charge is the account value shown at the latest monthly anniversary times the tier's overloan charge percentage, rounded to the cent.
      The overloan charge rate follows the policy year and the insured's attained age on the charge date: a policy in at least the long-duration policy year whose insured has reached the long-duration attained age is charged the long-duration charge percentage; a policy in at least the mid-duration policy year whose insured has reached the mid-duration attained age, where the policy is not in the long-duration policy year with the insured at the long-duration attained age, is charged the mid-duration charge percentage; any other policy is charged the tier's overloan charge percentage.
      The value the charge is taken on follows the days from the latest monthly anniversary in the policy's deduction history to the charge date: at least the full-carry days after it, the account value is carried forward by fixed-account interest on the part of the account value above the loan balance at the current fixed account rate and by collateral interest on the loan balance at the credited rate of the policy's loan type, both simple for those days over 365; at least one day but fewer than the full-carry days after it, the account value is carried forward by the fixed-account interest on the part above the loan balance only; on the latest monthly anniversary itself, the account value is taken as shown.
      The persistency share follows the number of premium payments in the policy's activity history: a policy with at least the long-persistency number of premium payments pays the long persistency share of the charge; a policy with at least the mid-persistency number but fewer than the long-persistency number pays the mid persistency share; any other policy pays the whole charge.
      The indebtedness surcharge follows the loan balance standing in the activity history, the loan advances plus the interest capitalized less the principal repaid, as a share of the account value: at or above the high surcharge ratio the charge is raised by the high surcharge; at or above the mid surcharge ratio but below the high surcharge ratio it is raised by the mid surcharge; below the mid surcharge ratio no surcharge applies.
      The household share follows the owner's active Ashgrove deferred fixed annuity: an owner whose active deferred fixed annuity carries a contract value of at least the household large value pays the large household share; an owner whose active deferred fixed annuity carries a smaller contract value pays the small household share; an owner with no active deferred fixed annuity pays the whole charge.
      The overloan protection charge is the value the charge is taken on, times the overloan charge rate, times the persistency share, times the household share, times one plus the indebtedness surcharge, all multiplied together before a single rounding to the cent.
    prerequisite:
      - problem: ul_ext_loan_interest_settlement
        kind: state_gate
        gate: ul_holdings.loan_interest_paid_to_date
        form: state
        policy_source: >-
          The overloan protection charge is figured only after the policy's loan interest paid-to date stands at the date the charge is figured, so that no loan interest is left accruing from an earlier date.
        condition: >-
          ul_holdings.loan_interest_paid_to_date equals the date the charge is figured, so no loan interest accrues on the policy from an earlier date.
        resolved_by: settle_loan_interest_b95e2dd6
        effect: >-
          Once the accrued loan interest is settled in cash, the loan interest paid-to date moves to the settlement date and the charge may be figured on the policy as it then stands.
    cross_category:
      - category: fixed
        as: branch
        reads: [status, contract_value]
        note: the household share is decided by the contract value of the owner's active Ashgrove deferred fixed annuity.
    compute:
      - charge_policy_year: "MONTHS(F('issue_date'), NOW) // 12 + 1"
      - charge_attained_age: "MONTHS(F('insured_date_of_birth'), NOW) // 12"
      - overloan_charge_rate: "K('long_duration_charge_pct') if charge_policy_year >= K('long_duration_policy_year') and charge_attained_age >= K('long_duration_attained_age') else (K('mid_duration_charge_pct') if charge_policy_year >= K('mid_duration_policy_year') and charge_attained_age >= K('mid_duration_attained_age') and not (charge_policy_year >= K('long_duration_policy_year') and charge_attained_age >= K('long_duration_attained_age')) else P('overloan_charge_pct'))"
      - latest_monthiversary: "LATEST('ul_transactions', 'monthiversary_date', date_field='transaction_date', event_type='ul_monthly_deduction')"
      - carry_days: "DAYS(latest_monthiversary, NOW)"
      - collateral_rate: "P('preferred_loan_credited_rate') if MONTHS(F('issue_date'), NOW) // 12 + 1 >= P('preferred_loan_first_policy_year') else P('standard_loan_credited_rate')"
      - charge_base_value: "F('account_value') + (F('account_value') - F('loan_balance')) * P('current_fixed_account_rate') * carry_days / 365 + F('loan_balance') * collateral_rate * carry_days / 365 if carry_days >= K('full_carry_days') else (F('account_value') + (F('account_value') - F('loan_balance')) * P('current_fixed_account_rate') * carry_days / 365 if carry_days >= 1 else F('account_value'))"
      - premium_payment_count: "COUNT('ul_transactions', event_type='ul_premium_received')"
      - persistency_share: "K('persistency_share_long') if premium_payment_count >= K('persistency_premiums_long') else (K('persistency_share_mid') if premium_payment_count >= K('persistency_premiums_mid') else 1)"
      - ledger_loan_balance: "SUM('ul_transactions', 'amount', event_type='ul_loan_advanced') + SUM('ul_transactions', 'amount', event_type='ul_loan_interest_capitalized') - SUM('ul_transactions', 'amount', event_type='ul_loan_repaid')"
      - indebtedness_surcharge: "K('surcharge_high') if ledger_loan_balance / F('account_value') >= K('surcharge_high_ratio') else (K('surcharge_mid') if ledger_loan_balance / F('account_value') >= K('surcharge_mid_ratio') else 0)"
      - annuity_contract_value: "CFIELD('fixed', 'contract_value', status='active') or 0"
      - household_share: "K('household_share_large') if annuity_contract_value >= K('household_large_value') else (K('household_share_small') if annuity_contract_value > 0 else 1)"
      - result: "RND(charge_base_value * overloan_charge_rate * persistency_share * household_share * (1 + indebtedness_surcharge), 2)"
    compute_basis:
      overloan_charge_rate: "The overloan charge rate follows the policy year and the insured's attained age on the charge date: a policy in at least the long-duration policy year whose insured has reached the long-duration attained age is charged the long-duration charge percentage; a policy in at least the mid-duration policy year whose insured has reached the mid-duration attained age, where the policy is not in the long-duration policy year with the insured at the long-duration attained age, is charged the mid-duration charge percentage; any other policy is charged the tier's overloan charge percentage."
      latest_monthiversary: "The value the charge is taken on follows the days from the latest monthly anniversary in the policy's deduction history to the charge date"
      carry_days: "The value the charge is taken on follows the days from the latest monthly anniversary in the policy's deduction history to the charge date"
      collateral_rate: "by collateral interest on the loan balance at the credited rate of the policy's loan type"
      charge_base_value: "at least the full-carry days after it, the account value is carried forward by fixed-account interest on the part of the account value above the loan balance at the current fixed account rate and by collateral interest on the loan balance at the credited rate of the policy's loan type, both simple for those days over 365; at least one day but fewer than the full-carry days after it, the account value is carried forward by the fixed-account interest on the part above the loan balance only; on the latest monthly anniversary itself, the account value is taken as shown."
      premium_payment_count: "The persistency share follows the number of premium payments in the policy's activity history"
      persistency_share: "a policy with at least the long-persistency number of premium payments pays the long persistency share of the charge; a policy with at least the mid-persistency number but fewer than the long-persistency number pays the mid persistency share; any other policy pays the whole charge."
      ledger_loan_balance: "The indebtedness surcharge follows the loan balance standing in the activity history, the loan advances plus the interest capitalized less the principal repaid, as a share of the account value"
      indebtedness_surcharge: "at or above the high surcharge ratio the charge is raised by the high surcharge; at or above the mid surcharge ratio but below the high surcharge ratio it is raised by the mid surcharge; below the mid surcharge ratio no surcharge applies."
      annuity_contract_value: "The household share follows the owner's active Ashgrove deferred fixed annuity"
      household_share: "an owner whose active deferred fixed annuity carries a contract value of at least the household large value pays the large household share; an owner whose active deferred fixed annuity carries a smaller contract value pays the small household share; an owner with no active deferred fixed annuity pays the whole charge."
      result: "The overloan protection charge is the value the charge is taken on, times the overloan charge rate, times the persistency share, times the household share, times one plus the indebtedness surcharge, all multiplied together before a single rounding to the cent."
    factors:
      - id: overloan_charge_rate_band
        effect: parameter
        decides: overloan_charge_rate
        bindings: [charge_policy_year, charge_attained_age, overloan_charge_rate]
        ladder:
          - when: "the policy year is at least the long-duration policy year and the insured's attained age is at least the long-duration attained age"
            value: "K('long_duration_charge_pct')"
          - when: "the policy year is at least the mid-duration policy year and the insured's attained age is at least the mid-duration attained age, and the policy does not meet both long-duration conditions"
            value: "K('mid_duration_charge_pct')"
          - when: "otherwise"
            value: "P('overloan_charge_pct')"
        baseline:
          overloan_charge_rate: "P('overloan_charge_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: charge_value_carry
        effect: method
        decides: charge_base_value
        bindings: [latest_monthiversary, carry_days, collateral_rate, charge_base_value]
        ladder:
          - when: "the charge date is at least the full-carry days after the latest monthly anniversary in the deduction history"
            method: "the account value is carried forward by fixed-account interest on the part above the loan balance and by collateral interest on the loan balance, simple, days over 365"
          - when: "the charge date is at least one day but fewer than the full-carry days after the latest monthly anniversary"
            method: "the account value is carried forward by fixed-account interest on the part above the loan balance only, simple, days over 365"
          - when: "otherwise (the charge date is the latest monthly anniversary itself)"
            method: "the account value is taken as shown"
        baseline:
          charge_base_value: "F('account_value')"
        evidence: [history, date]
        cross_difficulty: null
      - id: charge_persistency_share
        effect: parameter
        decides: persistency_share
        bindings: [premium_payment_count, persistency_share]
        ladder:
          - when: "the activity history shows at least the long-persistency number of premium payments"
            value: "K('persistency_share_long')"
          - when: "the activity history shows at least the mid-persistency number but fewer than the long-persistency number of premium payments"
            value: "K('persistency_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          persistency_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: charge_indebtedness_surcharge
        effect: parameter
        decides: indebtedness_surcharge
        bindings: [ledger_loan_balance, indebtedness_surcharge]
        ladder:
          - when: "the loan balance standing in the activity history is at least the high surcharge ratio of the account value"
            value: "K('surcharge_high')"
          - when: "it is at least the mid surcharge ratio but below the high surcharge ratio of the account value"
            value: "K('surcharge_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          indebtedness_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: charge_household_share
        effect: parameter
        decides: household_share
        bindings: [annuity_contract_value, household_share]
        ladder:
          - when: "the owner holds an active Ashgrove deferred fixed annuity whose contract value is at least the household large value"
            value: "K('household_share_large')"
          - when: "the owner holds an active Ashgrove deferred fixed annuity whose contract value is below the household large value"
            value: "K('household_share_small')"
          - when: "otherwise (no active Ashgrove deferred fixed annuity)"
            value: "1"
        baseline:
          household_share: "1"
        evidence: [cross_category]
        cross_difficulty: fixed
    baseline:
      rule: >-
        The standard overloan protection charge is the account value shown at the latest monthly anniversary times the tier's overloan charge percentage, rounded to the cent.
