  - id: ul_ext_overloan_protected_face
    base_policy_refs: [ul_overloan_protection]
    overwrite:
      - base_policy: ul_overloan_protection
        superseded_clause: >-
          the face amount becomes the account value after the charge times the corridor factor at the insured's attained age, rounded to the cent
        replaced_by: >-
          The protected face is the value carried into the protected face, less the overloan protection charge booked and less the deduction reserve, times the corridor factor at the insured's attained age, times the duration enhancement, times the loan margin, all multiplied together before a single rounding to the cent.
    trigger: on_request
    subject: [ul_overloan_protection_exercised]
    computes: protected_face_amount
    target_tool: exercise_overloan_protection_1091dc6b
    params:
      corridor_age_91: 91
      corridor_age_92: 92
      corridor_age_93: 93
      corridor_age_94: 94
      corridor_age_95: 95
      corridor_factor_75_to_90: 1.05
      corridor_factor_91: 1.04
      corridor_factor_92: 1.03
      corridor_factor_93: 1.02
      corridor_factor_94: 1.01
      corridor_factor_95_up: 1.00
      face_full_carry_days: 15
      senior_reserve_age: 85
      senior_reserve_months: 6
      reserve_end_policy_year: 25
      long_enhancement_policy_year: 30
      mid_enhancement_policy_year: 20
      long_duration_enhancement: 1.03
      mid_duration_enhancement: 1.015
      high_loan_margin_ratio: 0.98
      standard_loan_margin_ratio: 0.96
      high_loan_margin: 1.02
      standard_loan_margin: 1.01
    rule: >-
      When an approved overloan protection election is carried out, the policy becomes guaranteed paid-up coverage under death benefit Option A and its face amount becomes the protected face.
      The protected face is not fixed until the overloan protection charge stands deducted in the policy's activity history.
      The standard protected face is the account value shown at the latest monthly anniversary less the overloan protection charge booked in the activity history, times the corridor factor for the insured's attained age, rounded to the cent.
      The corridor factor is the tier's corridor factor for the insured's attained age on the exercise date, which for the ages at which the rider can be exercised is the factor for ages seventy-five through ninety, the separate factors for ages ninety-one, ninety-two, ninety-three and ninety-four, and the factor from age ninety-five.
      The value carried into the protected face follows the days from the latest monthly anniversary in the policy's deduction history to the exercise date: at least the face full-carry days after it, the account value is brought forward to the exercise date by fixed-account interest on the part of the account value above the loan balance at the current fixed account rate and by collateral interest on the loan balance at the credited rate of the policy's loan type, both simple for those days over 365; at least one day but fewer than the face full-carry days after it, the account value is brought forward by the fixed-account interest on the part above the loan balance only; on the latest monthly anniversary itself, the account value is carried as shown.
      The deduction reserve follows the insured's attained age and the policy year on the exercise date, because the paid-up coverage no longer collects monthly deductions: an insured at or above the senior reserve age leaves a reserve of the senior reserve months of the current monthly deduction; an insured below the senior reserve age on a policy before the reserve-end policy year leaves a reserve of the current monthly deduction for each monthly anniversary still to fall due after the exercise date up to and including the next policy anniversary; any other policy leaves no reserve.
      The duration enhancement follows the policy year on the exercise date: a policy in at least the long-enhancement policy year receives the long duration enhancement; a policy in at least the mid-enhancement policy year but before the long-enhancement policy year receives the mid duration enhancement; any other policy receives no enhancement.
      The loan margin follows the loan balance standing in the activity history, the loan advances plus the interest capitalized less the principal repaid, as a share of the account value shown, so that the paid-up face stays above a loan that keeps accruing interest after the exercise: at or above the high loan-margin ratio the high loan margin applies; at or above the standard loan-margin ratio but below the high loan-margin ratio the standard loan margin applies; below the standard loan-margin ratio no margin applies.
      The protected face is the value carried into the protected face, less the overloan protection charge booked and less the deduction reserve, times the corridor factor at the insured's attained age, times the duration enhancement, times the loan margin, all multiplied together before a single rounding to the cent.
    prerequisite:
      - problem: ul_ext_overloan_charge
        kind: value_input
        gate: opr_charge_booked
        form: state
        policy_source: >-
          The protected face is not fixed until the overloan protection charge stands deducted in the policy's activity history.
        condition: >-
          ul_transactions carries an ul_overloan_protection_charged entry for the policy, so the charge booked that the protected face subtracts is the charge for this exercise.
        resolved_by: assess_overloan_charge_72382565
        effect: >-
          Once the overloan protection charge is booked, the charge booked that enters the protected face changes from nothing to the booked charge, lowering the value the protected face is figured on.
    cross_category: []
    compute:
      - opr_charge_booked: "SUM('ul_transactions', 'amount', event_type='ul_overloan_protection_charged')"
      - opr_attained_age: "MONTHS(F('insured_date_of_birth'), NOW) // 12"
      - corridor_factor: "K('corridor_factor_95_up') if opr_attained_age >= K('corridor_age_95') else (K('corridor_factor_94') if opr_attained_age >= K('corridor_age_94') else (K('corridor_factor_93') if opr_attained_age >= K('corridor_age_93') else (K('corridor_factor_92') if opr_attained_age >= K('corridor_age_92') else (K('corridor_factor_91') if opr_attained_age >= K('corridor_age_91') else K('corridor_factor_75_to_90')))))"
      - face_latest_monthiversary: "LATEST('ul_transactions', 'monthiversary_date', date_field='transaction_date', event_type='ul_monthly_deduction')"
      - face_carry_days: "DAYS(face_latest_monthiversary, NOW)"
      - face_collateral_rate: "P('preferred_loan_credited_rate') if MONTHS(F('issue_date'), NOW) // 12 + 1 >= P('preferred_loan_first_policy_year') else P('standard_loan_credited_rate')"
      - carried_value: "F('account_value') + (F('account_value') - F('loan_balance')) * P('current_fixed_account_rate') * face_carry_days / 365 + F('loan_balance') * face_collateral_rate * face_carry_days / 365 if face_carry_days >= K('face_full_carry_days') else (F('account_value') + (F('account_value') - F('loan_balance')) * P('current_fixed_account_rate') * face_carry_days / 365 if face_carry_days >= 1 else F('account_value'))"
      - deduction_reserve: "F('current_monthly_deduction') * K('senior_reserve_months') if MONTHS(F('insured_date_of_birth'), NOW) // 12 >= K('senior_reserve_age') else (F('current_monthly_deduction') * (12 - MONTHS(F('issue_date'), NOW) % 12) if MONTHS(F('issue_date'), NOW) // 12 + 1 < K('reserve_end_policy_year') else 0)"
      - duration_enhancement: "K('long_duration_enhancement') if MONTHS(F('issue_date'), NOW) // 12 + 1 >= K('long_enhancement_policy_year') else (K('mid_duration_enhancement') if MONTHS(F('issue_date'), NOW) // 12 + 1 >= K('mid_enhancement_policy_year') else 1)"
      - opr_ledger_loan: "SUM('ul_transactions', 'amount', event_type='ul_loan_advanced') + SUM('ul_transactions', 'amount', event_type='ul_loan_interest_capitalized') - SUM('ul_transactions', 'amount', event_type='ul_loan_repaid')"
      - loan_margin: "K('high_loan_margin') if opr_ledger_loan / F('account_value') >= K('high_loan_margin_ratio') else (K('standard_loan_margin') if opr_ledger_loan / F('account_value') >= K('standard_loan_margin_ratio') else 1)"
      - result: "RND((carried_value - opr_charge_booked - deduction_reserve) * corridor_factor * duration_enhancement * loan_margin, 2)"
    compute_basis:
      opr_charge_booked: "The standard protected face is the account value shown at the latest monthly anniversary less the overloan protection charge booked in the activity history"
      corridor_factor: "The corridor factor is the tier's corridor factor for the insured's attained age on the exercise date, which for the ages at which the rider can be exercised is the factor for ages seventy-five through ninety, the separate factors for ages ninety-one, ninety-two, ninety-three and ninety-four, and the factor from age ninety-five."
      face_latest_monthiversary: "The value carried into the protected face follows the days from the latest monthly anniversary in the policy's deduction history to the exercise date"
      face_carry_days: "The value carried into the protected face follows the days from the latest monthly anniversary in the policy's deduction history to the exercise date"
      face_collateral_rate: "by collateral interest on the loan balance at the credited rate of the policy's loan type, both simple for those days over 365"
      carried_value: "at least the face full-carry days after it, the account value is brought forward to the exercise date by fixed-account interest on the part of the account value above the loan balance at the current fixed account rate and by collateral interest on the loan balance at the credited rate of the policy's loan type, both simple for those days over 365; at least one day but fewer than the face full-carry days after it, the account value is brought forward by the fixed-account interest on the part above the loan balance only; on the latest monthly anniversary itself, the account value is carried as shown."
      deduction_reserve: "an insured at or above the senior reserve age leaves a reserve of the senior reserve months of the current monthly deduction; an insured below the senior reserve age on a policy before the reserve-end policy year leaves a reserve of the current monthly deduction for each monthly anniversary still to fall due after the exercise date up to and including the next policy anniversary; any other policy leaves no reserve."
      duration_enhancement: "a policy in at least the long-enhancement policy year receives the long duration enhancement; a policy in at least the mid-enhancement policy year but before the long-enhancement policy year receives the mid duration enhancement; any other policy receives no enhancement."
      opr_ledger_loan: "The loan margin follows the loan balance standing in the activity history, the loan advances plus the interest capitalized less the principal repaid, as a share of the account value shown"
      loan_margin: "at or above the high loan-margin ratio the high loan margin applies; at or above the standard loan-margin ratio but below the high loan-margin ratio the standard loan margin applies; below the standard loan-margin ratio no margin applies."
      result: "The protected face is the value carried into the protected face, less the overloan protection charge booked and less the deduction reserve, times the corridor factor at the insured's attained age, times the duration enhancement, times the loan margin, all multiplied together before a single rounding to the cent."
    factors:
      - id: protected_value_carry
        effect: method
        decides: carried_value
        bindings: [face_latest_monthiversary, face_carry_days, face_collateral_rate, carried_value]
        ladder:
          - when: "the exercise date is at least the face full-carry days after the latest monthly anniversary in the deduction history"
            method: "the account value is brought forward by fixed-account interest on the part above the loan balance and by collateral interest on the loan balance, simple, days over 365"
          - when: "the exercise date is at least one day but fewer than the face full-carry days after the latest monthly anniversary"
            method: "the account value is brought forward by fixed-account interest on the part above the loan balance only, simple, days over 365"
          - when: "otherwise (the exercise date is the latest monthly anniversary itself)"
            method: "the account value is carried as shown"
        baseline:
