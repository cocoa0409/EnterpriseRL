      - care_waiver: "K('care_waiver_full') if sc_care_payments_6m >= K('care_payments_full') and sc_care_claim_status == 'claim_active' else (K('care_waiver_partial') if sc_care_payments_6m >= 1 and sc_care_payments_6m < K('care_payments_full') and sc_care_claim_status == 'claim_active' else 0)"
      - result: "RND(F('initial_face_amount') / 1000 * graded_rate * issue_age_share * (1 - funding_credit) * (1 - conversion_credit) * (1 - care_waiver), 2)"
    compute_basis:
      sc_effective_date: "The surrender is effective on the date the signed surrender request was received"
      sc_policy_year: "the policy year and the whole months elapsed in it are counted from the issue date to that effective date"
      schedule_rate: "The standard full-surrender charge is the initial face amount divided by one thousand times the tier's surrender charge schedule rate for the policy year in which the surrender is effective, rounded to the cent, and nothing once the tier's surrender charge years have ended."
      sc_months_elapsed: "the policy year and the whole months elapsed in it are counted from the issue date to that effective date"
      next_year_rate: "by one twelfth of the difference between that year's schedule rate and the next year's schedule rate per month"
      graded_rate: "The schedule rate actually applied follows the policy year of the surrender: from the monthly-grading policy year the rate steps down each whole month elapsed in the policy year, by one twelfth of the difference between that year's schedule rate and the next year's schedule rate per month; from the quarterly-grading policy year until the monthly-grading policy year it steps down each whole quarter elapsed, by one quarter of that difference per quarter; in the first policy year the year's schedule rate applies unchanged."
      insured_issue_age: "The issue-age share follows the insured's age last birthday on the issue date, counted from the insured's date of birth"
      issue_age_share: "at or above the older issue age the older issue-age share of the charge applies; at or above the middle issue age but below the older issue age the middle issue-age share applies; below the middle issue age the whole charge applies."
      gross_premiums_received: "The funding credit follows the gross premiums received in the policy's activity history against the target premium times the policy year of the surrender"
      funding_credit: "premiums of at least the high funding multiple of that figure earn the high funding credit; premiums of at least that figure but below the high funding multiple earn the standard funding credit; smaller premiums earn no credit."
      converted_term_years: "that term policy, shown as converted, was in force at least the long-term years from its issue date to this policy's issue date"
      conversion_credit: "where the policy records a converted term policy and that term policy, shown as converted, was in force at least the long-term years from its issue date to this policy's issue date, the long conversion credit applies; where it was in force at least one but fewer than the long-term years, the short conversion credit applies; where no converted Ashgrove term policy is recorded, or it was in force less than one year, no conversion credit applies."
      sc_care_payments_6m: "its activity history shows at least the full-care number of long-term care benefit payments in the last six months"
      sc_care_claim_status: "where the CareAssure policy is on an active claim"
      care_waiver: "where the CareAssure policy is on an active claim and its activity history shows at least the full-care number of long-term care benefit payments in the last six months, the full care waiver applies; where it is on an active claim and shows at least one but fewer than the full-care number of such payments in the last six months, the partial care waiver applies; otherwise no care waiver applies."
      result: "The full-surrender charge is the initial face amount divided by one thousand, times the graded schedule rate, times the issue-age share, times one less the funding credit, times one less the conversion credit, times one less the care waiver, all multiplied together before a single rounding to the cent."
    factors:
      - id: schedule_rate_grading
        effect: method
        decides: graded_rate
        bindings: [sc_months_elapsed, next_year_rate, graded_rate]
        ladder:
          - when: "the surrender falls in at least the monthly-grading policy year"
            method: "the year's schedule rate steps down by one twelfth of the gap to the next year's rate for each whole month elapsed in the policy year"
          - when: "the surrender falls in at least the quarterly-grading policy year and before the monthly-grading policy year"
            method: "the year's schedule rate steps down by one quarter of the gap to the next year's rate for each whole quarter elapsed"
          - when: "otherwise (first policy year)"
            method: "the year's schedule rate applies unchanged for the whole policy year"
        baseline:
          graded_rate: "schedule_rate"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: issue_age_share_band
        effect: parameter
        decides: issue_age_share
        bindings: [insured_issue_age, issue_age_share]
        ladder:
          - when: "the insured's age last birthday on the issue date is at least the older issue age"
            value: "K('older_issue_age_share')"
          - when: "it is at least the middle issue age and below the older issue age"
            value: "K('middle_issue_age_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          issue_age_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: surrender_funding_credit
        effect: parameter
        decides: funding_credit
        bindings: [gross_premiums_received, funding_credit]
        ladder:
          - when: "gross premiums received are at least the high funding multiple of the target premium times the policy year of the surrender"
            value: "K('funding_credit_high')"
          - when: "they are at least the target premium times the policy year but below the high funding multiple of it"
            value: "K('funding_credit_standard')"
          - when: "otherwise"
            value: "0"
        baseline:
          funding_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: term_conversion_credit
        effect: parameter
        decides: conversion_credit
        bindings: [converted_term_years, conversion_credit]
        ladder:
          - when: "the policy records a converted Ashgrove term policy and that term policy was in force at least the long-term years before this policy's issue date"
            value: "K('conversion_credit_long')"
          - when: "the policy records a converted Ashgrove term policy and it was in force at least one year but fewer than the long-term years"
            value: "K('conversion_credit_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          conversion_credit: "0"
        evidence: [cross_category, date]
        cross_difficulty: term
      - id: surrender_care_waiver
        effect: parameter
        decides: care_waiver
        bindings: [sc_care_payments_6m, sc_care_claim_status, care_waiver]
        ladder:
          - when: "the insured's CareAssure policy is on an active claim and shows at least the full-care number of long-term care benefit payments in the last six months"
            value: "K('care_waiver_full')"
          - when: "the CareAssure policy is on an active claim and shows at least one but fewer than the full-care number of such payments in the last six months"
            value: "K('care_waiver_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          care_waiver: "0"
        evidence: [cross_category, history]
        cross_difficulty: ltc
    baseline:
      rule: >-
        The standard full-surrender charge is the initial face amount divided by one thousand times the tier's surrender charge schedule rate for the policy year in which the surrender is effective, rounded to the cent, and nothing once the tier's surrender charge years have ended.
      params: [surrender_charge_ladder, surrender_charge_years]
    inputs:
      history:
        - {table: ul_service_requests, aggregate: latest, field: received_date, filters: {request_type: surrender, request_status: approved}}
        - {table: ul_transactions, aggregate: sum, field: gross_amount, filters: {event_type: ul_premium_received}}
        - {category: ltc, table: ltc_transactions, aggregate: count, field: ltc_txn_id, within_months: 6, filters: {event_type: ltc_benefit_paid}}
      cross_category: [term, ltc]
  - id: ul_ext_guideline_excess_refund
    base_policy_refs: [ul_evt_premium_acceptance]
    overwrite:
      - base_policy: ul_evt_premium_acceptance
        superseded_clause: >-
          A payment that would make premiums paid less withdrawals (ul_msr_cumulative_premiums) exceed the greater of the guideline single premium and the sum of guideline level premiums to date is refunded in the excess part within 60 days of receipt, unless it is needed to keep the policy in force.
        replaced_by: >-
          The guideline excess refund is the guideline excess plus the earnings credited on it, rounded to the cent once at the end.
    trigger: state_due
    subject: [ul_premium_refunded]
    computes: refund_amount
    target_tool: refund_guideline_excess_434d2811
    params:
      earnings_min_days: 30
      check_clearing_days: 5
      card_clearing_days: 1
      compliance_days: 60
      late_full_days: 60
      late_partial_days: 45
      late_rate_full: 0.02
      late_rate_partial: 0.01
      compounding_days: 45
    rule: >-
      Premium received above the guideline premium limit is returned to the payer as a guideline excess refund booked against the payment that carried the policy over the limit, the most recent premium payment in the activity history.
      The guideline excess is the gross premiums received in the activity history, less the premiums already refunded and less the amounts of the partial withdrawals, above the greater of the guideline single premium and the guideline level premium times the policy years begun to date, and nothing when they do not exceed it.
      The standard guideline excess refund is the guideline excess, rounded to the cent, with no earnings added.
      The earnings rate on the excess follows the policy's indexed allocation and the days since the excess payment was received: a policy allocating nothing to the indexed account whose excess payment was received at least the minimum earnings days ago earns the tier's current fixed account rate; a policy allocating part of its premium to the indexed account whose excess payment was received at least the minimum earnings days ago earns the tier's guaranteed minimum interest rate; an excess payment received fewer than the minimum earnings days ago earns nothing.
      The late-refund addition follows the days since the excess payment was received: at least the late full days ago the late full rate is added to the earnings rate; at least the late partial days but fewer than the late full days ago the late partial rate is added; fewer than the late partial days ago nothing is added.
      The earnings start date follows how the excess payment was made: a payment by check earns from its receipt date plus the check clearing days; a payment by debit card or online bank payment earns from its receipt date plus the card clearing days; a payment made any other way earns from its receipt date.
      The earnings end date follows what else stands on the policy: where a surrender request signed by the owner and approved is on file, earnings end on that request's received date, the date the surrender is effective; where none is on file and the excess payment was received more than the compliance days ago, earnings end on the compliance day after receipt; otherwise earnings end on the refund date.
      The earnings are figured on the guideline excess at the earnings rate plus the late-refund addition for the days from the earnings start date to the earnings end date, by a method that follows the days since the excess payment was received: at least the compounding days ago, the rate is compounded monthly over the whole thirty-day months in that period and the remaining days earn simple interest over 365 on the compounded amount; fewer than the compounding days ago but at least one day, simple interest over 365 for the days; on the day of receipt, nothing.
      The guideline excess refund is the guideline excess plus the earnings credited on it, rounded to the cent once at the end.
    prerequisite: []
    cross_category: []
    compute:
      - gl_gross_premiums: "SUM('ul_transactions', 'gross_amount', event_type='ul_premium_received')"
      - gl_prior_refunds: "SUM('ul_transactions', 'amount', event_type='ul_premium_refunded')"
      - gl_withdrawals: "SUM('ul_transactions', 'amount', event_type='ul_partial_withdrawal')"
      - guideline_limit: "max(F('guideline_single_premium'), F('guideline_level_premium') * (MONTHS(F('issue_date'), NOW) // 12 + 1))"
      - guideline_excess: "max(0, gl_gross_premiums - gl_prior_refunds - gl_withdrawals - guideline_limit)"
      - excess_receipt_date: "LATEST('ul_transactions', 'transaction_date', date_field='transaction_date', event_type='ul_premium_received')"
      - excess_payment_method: "LATEST('ul_transactions', 'payment_method', date_field='transaction_date', event_type='ul_premium_received')"
      - days_since_receipt: "DAYS(excess_receipt_date, NOW)"
      - earnings_rate: "P('current_fixed_account_rate') if F('allocation_indexed_pct') == 0 and days_since_receipt >= K('earnings_min_days') else (P('guaranteed_min_interest_rate') if F('allocation_indexed_pct') > 0 and days_since_receipt >= K('earnings_min_days') else 0)"
      - late_addition: "K('late_rate_full') if DAYS(excess_receipt_date, NOW) >= K('late_full_days') else (K('late_rate_partial') if DAYS(excess_receipt_date, NOW) >= K('late_partial_days') else 0)"
      - earnings_start_offset: "K('check_clearing_days') if excess_payment_method == 'check' else (K('card_clearing_days') if excess_payment_method == 'debit_card' or excess_payment_method == 'online_bank_payment' else 0)"
      - surrender_received_date: "LATEST('ul_service_requests', 'received_date', date_field='received_date', request_type='surrender', request_status='approved')"
      - earnings_days: "DAYS(excess_receipt_date, surrender_received_date) - earnings_start_offset if surrender_received_date else (K('compliance_days') - earnings_start_offset if days_since_receipt > K('compliance_days') else days_since_receipt - earnings_start_offset)"
      - excess_earnings: "guideline_excess * ((1 + (earnings_rate + late_addition) / 12) ** (earnings_days // 30) * (1 + (earnings_rate + late_addition) * (earnings_days % 30) / 365) - 1) if DAYS(excess_receipt_date, NOW) >= K('compounding_days') else (guideline_excess * (earnings_rate + late_addition) * earnings_days / 365 if DAYS(excess_receipt_date, NOW) >= 1 else 0)"
      - result: "RND(guideline_excess + excess_earnings, 2)"
    compute_basis:
      gl_gross_premiums: "The guideline excess is the gross premiums received in the activity history, less the premiums already refunded and less the amounts of the partial withdrawals"
      gl_prior_refunds: "less the premiums already refunded"
      gl_withdrawals: "less the amounts of the partial withdrawals"
      guideline_limit: "above the greater of the guideline single premium and the guideline level premium times the policy years begun to date"
      guideline_excess: "The guideline excess is the gross premiums received in the activity history, less the premiums already refunded and less the amounts of the partial withdrawals, above the greater of the guideline single premium and the guideline level premium times the policy years begun to date, and nothing when they do not exceed it."
      excess_receipt_date: "booked against the payment that carried the policy over the limit, the most recent premium payment in the activity history"
      excess_payment_method: "The earnings start date follows how the excess payment was made"
      days_since_receipt: "the days since the excess payment was received"
      earnings_rate: "a policy allocating nothing to the indexed account whose excess payment was received at least the minimum earnings days ago earns the tier's current fixed account rate; a policy allocating part of its premium to the indexed account whose excess payment was received at least the minimum earnings days ago earns the tier's guaranteed minimum interest rate; an excess payment received fewer than the minimum earnings days ago earns nothing."
      late_addition: "at least the late full days ago the late full rate is added to the earnings rate; at least the late partial days but fewer than the late full days ago the late partial rate is added; fewer than the late partial days ago nothing is added."
      earnings_start_offset: "a payment by check earns from its receipt date plus the check clearing days; a payment by debit card or online bank payment earns from its receipt date plus the card clearing days; a payment made any other way earns from its receipt date."
      surrender_received_date: "where a surrender request signed by the owner and approved is on file, earnings end on that request's received date, the date the surrender is effective"
      earnings_days: "The earnings end date follows what else stands on the policy: where a surrender request signed by the owner and approved is on file, earnings end on that request's received date, the date the surrender is effective; where none is on file and the excess payment was received more than the compliance days ago, earnings end on the compliance day after receipt; otherwise earnings end on the refund date."
      excess_earnings: "at least the compounding days ago, the rate is compounded monthly over the whole thirty-day months in that period and the remaining days earn simple interest over 365 on the compounded amount; fewer than the compounding days ago but at least one day, simple interest over 365 for the days; on the day of receipt, nothing."
      result: "The guideline excess refund is the guideline excess plus the earnings credited on it, rounded to the cent once at the end."
    factors:
      - id: excess_earnings_rate
        effect: parameter
        decides: earnings_rate
        bindings: [days_since_receipt, earnings_rate]
        ladder:
          - when: "the policy allocates nothing to the indexed account and the excess payment was received at least the minimum earnings days ago"
            value: "P('current_fixed_account_rate')"
          - when: "the policy allocates part of its premium to the indexed account and the excess payment was received at least the minimum earnings days ago"
            value: "P('guaranteed_min_interest_rate')"
          - when: "otherwise (received fewer than the minimum earnings days ago)"
            value: "0"
        baseline:
          earnings_rate: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: late_refund_addition
        effect: parameter
        decides: late_addition
        bindings: [late_addition]
        ladder:
          - when: "the excess payment was received at least the late full days ago"
            value: "K('late_rate_full')"
          - when: "it was received at least the late partial days but fewer than the late full days ago"
            value: "K('late_rate_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          late_addition: "0"
        evidence: [date]
        cross_difficulty: null
      - id: earnings_start_date
        effect: method
        decides: earnings_start_offset
        bindings: [excess_payment_method, earnings_start_offset]
        ladder:
          - when: "the excess payment was made by check"
            method: "earnings start on the receipt date plus the check clearing days"
          - when: "the excess payment was made by debit card or online bank payment"
            method: "earnings start on the receipt date plus the card clearing days"
          - when: "otherwise"
            method: "earnings start on the receipt date"
        baseline:
          earnings_start_offset: "0"
        evidence: [history]
        cross_difficulty: null
      - id: earnings_end_date
        effect: method
        decides: earnings_days
        bindings: [surrender_received_date, earnings_days]
        ladder:
          - when: "an approved surrender request signed by the owner is on file"
            method: "earnings end on the surrender request's received date"
          - when: "no approved surrender request is on file and the excess payment was received more than the compliance days ago"
            method: "earnings end on the compliance day after receipt"
          - when: "otherwise"
            method: "earnings end on the refund date"
        baseline:
          earnings_days: "days_since_receipt - earnings_start_offset"
        evidence: [history, date]
        cross_difficulty: null
      - id: earnings_compounding
        effect: method
        decides: excess_earnings
        bindings: [excess_earnings]
        ladder:
          - when: "the excess payment was received at least the compounding days ago"
            method: "monthly compounding over the whole thirty-day months of the earnings period, then simple interest over 365 for the remaining days"
          - when: "it was received at least one day but fewer than the compounding days ago"
            method: "simple interest over 365 for the earnings days"
          - when: "otherwise (received on the refund date)"
            method: "no earnings"
        baseline:
          excess_earnings: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard guideline excess refund is the guideline excess, rounded to the cent, with no earnings added.
      params: []
    inputs:
      history:
        - {table: ul_transactions, aggregate: sum, field: gross_amount, filters: {event_type: ul_premium_received}}
        - {table: ul_transactions, aggregate: sum, field: amount, filters: {event_type: ul_premium_refunded}}
        - {table: ul_transactions, aggregate: sum, field: amount, filters: {event_type: ul_partial_withdrawal}}
        - {table: ul_transactions, aggregate: latest, field: transaction_date, filters: {event_type: ul_premium_received}}
        - {table: ul_service_requests, aggregate: latest, field: received_date, filters: {request_type: surrender, request_status: approved}}
      cross_category: []
  - id: ul_ext_surrender_payout
    base_policy_refs: [ul_surrender, ul_evt_policy_loan]
    overwrite:
      - base_policy: ul_evt_policy_loan
        superseded_clause: >-
          Loans are standard loans, charged standard_loan_charged_rate with collateral credited standard_loan_credited_rate; from policy year preferred_loan_first_policy_year every loan is a preferred loan, charged preferred_loan_charged_rate with collateral credited preferred_loan_credited_rate.
        replaced_by: >-
          Loan interest accrued to the effective date is the loan balance times the loan charged rate for the policy year of the surrender, which is the preferred loan charged rate from the tier's preferred loan first policy year, the surrender interim loan rate from the surrender interim loan year until then, and the standard loan charged rate before it, for the actual days from the loan interest paid-to date to the effective date over 365.
      - base_policy: ul_surrender
        superseded_clause: >-
          The cash surrender value is the account value less the surrender charge, less the loan balance and loan interest accrued to the effective date.
        replaced_by: >-
          The cash surrender value is the value the surrender releases plus the unearned deduction refund, less the full-surrender charge booked, less any premium refund booked on or after the latest monthly anniversary, less the loan balance and the loan interest accrued to the effective date, and less the surrender processing fee.
      - base_policy: ul_surrender
        superseded_clause: >-
          The taxable amount is the account value less the surrender charge less the cost basis, never below zero, and federal tax is withheld at federal_withholding_default_pct of it unless the owner elected none.
        replaced_by: >-
          The taxable amount is the value the surrender releases plus the unearned deduction refund, less the full-surrender charge booked and less any premium refund booked on or after the latest monthly anniversary, less the surrender cost basis, never below zero; federal tax is withheld at the tier's default federal withholding rate of the taxable amount unless the surrender request elects no withholding.
    trigger: on_request
    subject: [ul_policy_surrendered, ul_surrender_value_paid]
    computes: net_paid_amount
    target_tool: surrender_policy_65d610d4
    params:
      bonus_long_year: 10
      bonus_mid_year: 5
      bonus_long: 0.005
      bonus_mid: 0.0025
      full_carry_days: 15
      fee_early_years: 5
      fee_early: 75
      fee_late: 50
      surrender_interim_loan_year: 6
      surrender_interim_loan_rate: 0.045
      delay_long_days: 30
      delay_short_days: 7
      delay_rate_long: 0.06
      delay_rate_short: 0.03
    rule: >-
      The owner surrenders the policy for its cash surrender value on the signed surrender request, and the surrender is effective on the date that request was received; the policy ends on that date and the net amount is paid to the owner.
      The surrender value is paid only after the full-surrender charge for the surrender request stands booked in the policy's activity history.
      The surrender value is not settled until the gross premiums received, less the premiums refunded and the partial withdrawals, stand at or below the guideline premium limit in the policy's activity history.
      The standard surrender payment is the account value shown at the latest monthly anniversary, less the full-surrender charge booked, less any premium refund booked on or after that anniversary, less the loan balance and the loan interest accrued to the effective date, and less federal tax withheld at the tier's default federal withholding rate on the taxable amount, that account value less those charge and refund amounts less the gross premiums received less the premiums refunded less the non-taxable part of earlier withdrawals, never below zero, unless the surrender request elects no withholding; the result is rounded to the cent once at the end.
      Loan interest accrued to the effective date is the loan balance times the loan charged rate for the policy year of the surrender, which is the preferred loan charged rate from the tier's preferred loan first policy year, the surrender interim loan rate from the surrender interim loan year until then, and the standard loan charged rate before it, for the actual days from the loan interest paid-to date to the effective date over 365.
      The persistency interest bonus follows the policy year of the surrender: at least the long bonus year earns the long bonus; at least the mid bonus year but before the long bonus year earns the mid bonus; earlier policy years earn no bonus.
      The value the surrender releases follows the days from the latest monthly anniversary in the deduction history to the effective date: at least the full-carry days after it, the account value is carried forward by interest on the part above the loan balance at the current fixed account rate plus the persistency interest bonus and by collateral interest on the loan balance at the credited rate of the policy's loan type, simple over 365; at least one day but fewer than the full-carry days after it, the account value is carried forward by interest on the part above the loan balance at the guaranteed minimum interest rate, simple over 365; on the anniversary itself the account value is taken as shown.
      The unearned deduction refund follows the same days from the latest monthly anniversary to the effective date, on a thirty-day month: at least one but no more than fifteen days after it, the whole latest monthly deduction is refunded for the unused days of the thirty; sixteen to twenty-nine days after it, only the cost of insurance part of the latest monthly deduction is refunded for the unused days; otherwise nothing is refunded.
      The surrender processing fee follows the policy year of the surrender: up to the early fee year the early fee applies; after the early fee year and within the tier's surrender charge years the late fee applies; after the surrender charge years no fee applies.
      The surrender cost basis follows how the premiums came in: where the policy records a converted Ashgrove term policy shown as converted and its activity history holds a conversion credit, the gross premiums less the conversion credits count; where it records no converted term policy, holds a premium paid by exchange and the owner holds an Ashgrove whole life policy shown as surrendered, the gross premiums less the exchanged amounts plus that whole life policy's cost basis count; otherwise every gross premium counts; from the premiums that count, the premiums refunded and the non-taxable part of earlier withdrawals, their amount less their withdrawal fee less their taxable part, are taken off.
      The delayed-payment interest follows the days from the effective date to the payment date: at least the long delay days the long delay rate applies; at least the short delay days but fewer than the long delay days the short delay rate applies; fewer days earn nothing; the interest is the cash surrender value times that rate for those days over 365.
      The cash surrender value is the value the surrender releases plus the unearned deduction refund, less the full-surrender charge booked, less any premium refund booked on or after the latest monthly anniversary, less the loan balance and the loan interest accrued to the effective date, and less the surrender processing fee.
      The taxable amount is the value the surrender releases plus the unearned deduction refund, less the full-surrender charge booked and less any premium refund booked on or after the latest monthly anniversary, less the surrender cost basis, never below zero; federal tax is withheld at the tier's default federal withholding rate of the taxable amount unless the surrender request elects no withholding.
      The net surrender payment is the cash surrender value less the federal tax withheld plus the delayed-payment interest, rounded to the cent once at the end.
    prerequisite:
      - problem: ul_ext_surrender_charge_assessment
        kind: value_input
        gate: po_charge_booked
        form: state
        policy_source: >-
          The surrender value is paid only after the full-surrender charge for the surrender request stands booked in the policy's activity history.
        condition: >-
          ul_transactions carries an ul_surrender_charge_assessed entry with charge_reason full_surrender on the approved surrender request.
        resolved_by: assess_surrender_charge_840d0421
        effect: >-
          Once the full-surrender charge is booked, the charge booked that the cash surrender value and the taxable amount subtract changes from nothing to the booked charge.
      - problem: ul_ext_guideline_excess_refund
        kind: value_input
        gate: po_refund_since
        form: state
        policy_source: >-
          The surrender value is not settled until the gross premiums received, less the premiums refunded and the partial withdrawals, stand at or below the guideline premium limit in the policy's activity history.
        condition: >-
          In ul_transactions the gross premiums received less the ul_premium_refunded amounts and the ul_partial_withdrawal amounts are at or below the greater of the guideline single premium and the guideline level premium times the policy years begun.
        resolved_by: refund_guideline_excess_434d2811
        effect: >-
          Once the guideline excess is refunded, the refund booked since the latest monthly anniversary is taken off the value released and off the surrender cost basis, changing the cash surrender value and the taxable amount.
    cross_category:
      - category: term
        as: branch
        reads: [status]
        note: the surrender cost basis leaves out conversion credits where the policy was converted from an Ashgrove term policy shown as converted.
      - category: whole
        as: branch
        reads: [status, cost_basis]
        note: the surrender cost basis carries over a surrendered Ashgrove whole life policy's cost basis for premiums paid by exchange.
    compute:
      - po_effective_date: "LATEST('ul_service_requests', 'received_date', date_field='received_date', request_type='surrender', request_status='approved')"
      - po_latest_monthiversary: "LATEST('ul_transactions', 'monthiversary_date', date_field='transaction_date', event_type='ul_monthly_deduction')"
      - po_carry_days: "DAYS(po_latest_monthiversary, po_effective_date)"
      - persistency_bonus: "K('bonus_long') if MONTHS(F('issue_date'), po_effective_date) // 12 + 1 >= K('bonus_long_year') else (K('bonus_mid') if MONTHS(F('issue_date'), po_effective_date) // 12 + 1 >= K('bonus_mid_year') else 0)"
      - po_collateral_rate: "P('preferred_loan_credited_rate') if MONTHS(F('issue_date'), po_effective_date) // 12 + 1 >= P('preferred_loan_first_policy_year') else P('standard_loan_credited_rate')"
      - released_value: "F('account_value') + (F('account_value') - F('loan_balance')) * (P('current_fixed_account_rate') + persistency_bonus) * po_carry_days / 365 + F('loan_balance') * po_collateral_rate * po_carry_days / 365 if po_carry_days >= K('full_carry_days') else (F('account_value') + (F('account_value') - F('loan_balance')) * P('guaranteed_min_interest_rate') * po_carry_days / 365 if po_carry_days >= 1 else F('account_value'))"
      - latest_deduction_amount: "LATEST('ul_transactions', 'amount', date_field='transaction_date', event_type='ul_monthly_deduction')"
      - latest_deduction_coi: "LATEST('ul_transactions', 'coi_amount', date_field='transaction_date', event_type='ul_monthly_deduction')"
      - unearned_deduction: "latest_deduction_amount * (30 - po_carry_days) / 30 if po_carry_days >= 1 and po_carry_days <= 15 else (latest_deduction_coi * (30 - po_carry_days) / 30 if po_carry_days >= 16 and po_carry_days <= 29 else 0)"
      - surrender_fee: "K('fee_early') if MONTHS(F('issue_date'), po_effective_date) // 12 + 1 <= K('fee_early_years') else (K('fee_late') if MONTHS(F('issue_date'), po_effective_date) // 12 + 1 <= P('surrender_charge_years') else 0)"
      - po_charge_booked: "SUM('ul_transactions', 'amount', event_type='ul_surrender_charge_assessed', charge_reason='full_surrender')"
      - po_refund_since: "(LATEST('ul_transactions', 'amount', date_field='transaction_date', event_type='ul_premium_refunded') or 0) if (LATEST('ul_transactions', 'transaction_date', date_field='transaction_date', event_type='ul_premium_refunded') or '0000-00-00') >= po_latest_monthiversary else 0"
      - po_loan_interest: "F('loan_balance') * (P('preferred_loan_charged_rate') if MONTHS(F('issue_date'), po_effective_date) // 12 + 1 >= P('preferred_loan_first_policy_year') else (K('surrender_interim_loan_rate') if MONTHS(F('issue_date'), po_effective_date) // 12 + 1 >= K('surrender_interim_loan_year') else P('standard_loan_charged_rate'))) * DAYS(F('loan_interest_paid_to_date') or po_effective_date, po_effective_date) / 365"
      - cash_surrender_value: "released_value + unearned_deduction - po_charge_booked - po_refund_since - F('loan_balance') - po_loan_interest - surrender_fee"
      - po_gross_premiums: "SUM('ul_transactions', 'gross_amount', event_type='ul_premium_received')"
      - po_conversion_credits: "SUM('ul_transactions', 'gross_amount', event_type='ul_premium_received', payment_method='conversion_credit')"
      - po_exchange_premiums: "SUM('ul_transactions', 'gross_amount', event_type='ul_premium_received', payment_method='exchange_1035')"
      - premiums_counted: "po_gross_premiums - po_conversion_credits if EXISTS('term', status='converted') and po_conversion_credits > 0 else (po_gross_premiums - po_exchange_premiums + (CFIELD('whole', 'cost_basis', status='surrendered') or 0) if not EXISTS('term', status='converted') and po_exchange_premiums > 0 and EXISTS('whole', status='surrendered') else po_gross_premiums)"
      - surrender_cost_basis: "premiums_counted - SUM('ul_transactions', 'amount', event_type='ul_premium_refunded') - (SUM('ul_transactions', 'amount', event_type='ul_partial_withdrawal') - SUM('ul_transactions', 'withdrawal_fee', event_type='ul_partial_withdrawal') - SUM('ul_transactions', 'taxable_amount', event_type='ul_partial_withdrawal'))"
      - taxable_amount: "max(0, released_value + unearned_deduction - po_charge_booked - po_refund_since - surrender_cost_basis)"
      - withheld_tax: "0 if LATEST('ul_service_requests', 'withholding_election', date_field='received_date', request_type='surrender', request_status='approved') == 'no_withholding' else taxable_amount * P('federal_withholding_default_pct')"
      - delay_rate: "K('delay_rate_long') if DAYS(po_effective_date, NOW) >= K('delay_long_days') else (K('delay_rate_short') if DAYS(po_effective_date, NOW) >= K('delay_short_days') else 0)"
      - result: "RND(cash_surrender_value - withheld_tax + cash_surrender_value * delay_rate * DAYS(po_effective_date, NOW) / 365, 2)"
    compute_basis:
      po_effective_date: "the surrender is effective on the date that request was received"
      po_latest_monthiversary: "The value the surrender releases follows the days from the latest monthly anniversary in the deduction history to the effective date"
      po_carry_days: "The value the surrender releases follows the days from the latest monthly anniversary in the deduction history to the effective date"
      persistency_bonus: "The persistency interest bonus follows the policy year of the surrender: at least the long bonus year earns the long bonus; at least the mid bonus year but before the long bonus year earns the mid bonus; earlier policy years earn no bonus."
      po_collateral_rate: "by collateral interest on the loan balance at the credited rate of the policy's loan type"
      released_value: "at least the full-carry days after it, the account value is carried forward by interest on the part above the loan balance at the current fixed account rate plus the persistency interest bonus and by collateral interest on the loan balance at the credited rate of the policy's loan type, simple over 365; at least one day but fewer than the full-carry days after it, the account value is carried forward by interest on the part above the loan balance at the guaranteed minimum interest rate, simple over 365; on the anniversary itself the account value is taken as shown."
      latest_deduction_amount: "the whole latest monthly deduction is refunded for the unused days of the thirty"
      latest_deduction_coi: "only the cost of insurance part of the latest monthly deduction is refunded for the unused days"
      unearned_deduction: "The unearned deduction refund follows the same days from the latest monthly anniversary to the effective date, on a thirty-day month: at least one but no more than fifteen days after it, the whole latest monthly deduction is refunded for the unused days of the thirty; sixteen to twenty-nine days after it, only the cost of insurance part of the latest monthly deduction is refunded for the unused days; otherwise nothing is refunded."
      surrender_fee: "The surrender processing fee follows the policy year of the surrender: up to the early fee year the early fee applies; after the early fee year and within the tier's surrender charge years the late fee applies; after the surrender charge years no fee applies."
      po_charge_booked: "less the full-surrender charge booked"
      po_refund_since: "less any premium refund booked on or after the latest monthly anniversary"
      po_loan_interest: "Loan interest accrued to the effective date is the loan balance times the loan charged rate for the policy year of the surrender, which is the preferred loan charged rate from the tier's preferred loan first policy year, the surrender interim loan rate from the surrender interim loan year until then, and the standard loan charged rate before it, for the actual days from the loan interest paid-to date to the effective date over 365."
      cash_surrender_value: "The cash surrender value is the value the surrender releases plus the unearned deduction refund, less the full-surrender charge booked, less any premium refund booked on or after the latest monthly anniversary, less the loan balance and the loan interest accrued to the effective date, and less the surrender processing fee."
      po_gross_premiums: "The surrender cost basis follows how the premiums came in"
      po_conversion_credits: "its activity history holds a conversion credit, the gross premiums less the conversion credits count"
      po_exchange_premiums: "holds a premium paid by exchange and the owner holds an Ashgrove whole life policy shown as surrendered, the gross premiums less the exchanged amounts plus that whole life policy's cost basis count"
      premiums_counted: "where the policy records a converted Ashgrove term policy shown as converted and its activity history holds a conversion credit, the gross premiums less the conversion credits count; where it records no converted term policy, holds a premium paid by exchange and the owner holds an Ashgrove whole life policy shown as surrendered, the gross premiums less the exchanged amounts plus that whole life policy's cost basis count; otherwise every gross premium counts"
      surrender_cost_basis: "from the premiums that count, the premiums refunded and the non-taxable part of earlier withdrawals, their amount less their withdrawal fee less their taxable part, are taken off."
      taxable_amount: "The taxable amount is the value the surrender releases plus the unearned deduction refund, less the full-surrender charge booked and less any premium refund booked on or after the latest monthly anniversary, less the surrender cost basis, never below zero"
      withheld_tax: "federal tax is withheld at the tier's default federal withholding rate of the taxable amount unless the surrender request elects no withholding."
      delay_rate: "The delayed-payment interest follows the days from the effective date to the payment date: at least the long delay days the long delay rate applies; at least the short delay days but fewer than the long delay days the short delay rate applies; fewer days earn nothing"
      result: "The net surrender payment is the cash surrender value less the federal tax withheld plus the delayed-payment interest, rounded to the cent once at the end."
    factors:
      - id: persistency_interest_bonus
        effect: parameter
        decides: persistency_bonus
        bindings: [persistency_bonus]
        ladder:
          - when: "the surrender falls in at least the long bonus policy year"
            value: "K('bonus_long')"
          - when: "it falls in at least the mid bonus policy year and before the long bonus policy year"
            value: "K('bonus_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          persistency_bonus: "0"
        evidence: [date]
        cross_difficulty: null
      - id: released_value_carry
        effect: method
        decides: released_value
        bindings: [po_latest_monthiversary, po_carry_days, po_collateral_rate, released_value]
        ladder:
          - when: "the effective date is at least the full-carry days after the latest monthly anniversary in the deduction history"
            method: "the account value is carried forward by interest at the current fixed account rate plus the bonus on the part above the loan and by collateral interest on the loan, simple over 365"
          - when: "the effective date is at least one day but fewer than the full-carry days after it"
            method: "the account value is carried forward by interest at the guaranteed minimum rate on the part above the loan, simple over 365"
          - when: "otherwise (the effective date is the monthly anniversary itself)"
            method: "the account value is taken as shown"
        baseline:
          released_value: "F('account_value')"
        evidence: [history, date]
        cross_difficulty: null
      - id: unearned_deduction_refund
        effect: method
        decides: unearned_deduction
        bindings: [latest_deduction_amount, latest_deduction_coi, unearned_deduction]
        ladder:
          - when: "the effective date is at least one and no more than fifteen days after the latest monthly anniversary"
            method: "the whole latest monthly deduction is refunded for the unused days of a thirty-day month"
          - when: "the effective date is sixteen to twenty-nine days after it"
            method: "only the cost of insurance part of the latest monthly deduction is refunded for the unused days of a thirty-day month"
          - when: "otherwise"
            method: "nothing is refunded"
        baseline:
          unearned_deduction: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: surrender_processing_fee
        effect: parameter
        decides: surrender_fee
        bindings: [surrender_fee]
        ladder:
          - when: "the surrender falls in a policy year up to the early fee year"
            value: "K('fee_early')"
          - when: "it falls after the early fee year and within the tier's surrender charge years"
            value: "K('fee_late')"
          - when: "otherwise"
            value: "0"
        baseline:
          surrender_fee: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: surrender_cost_basis_source
        effect: method
        decides: premiums_counted
        bindings: [po_conversion_credits, po_exchange_premiums, premiums_counted]
        ladder:
          - when: "the policy records a converted Ashgrove term policy shown as converted and its activity history holds a conversion credit"
            method: "the gross premiums less the conversion credits count"
          - when: "no converted term policy is recorded, the activity history holds a premium paid by exchange and the owner holds an Ashgrove whole life policy shown as surrendered"
            method: "the gross premiums less the exchanged amounts plus that whole life policy's cost basis count"
          - when: "otherwise"
            method: "every gross premium counts"
        baseline:
          premiums_counted: "po_gross_premiums"
        evidence: [history, cross_category]
        cross_difficulty: term
      - id: delayed_payment_interest
        effect: parameter
        decides: delay_rate
        bindings: [delay_rate]
        ladder:
          - when: "the payment date is at least the long delay days after the effective date"
            value: "K('delay_rate_long')"
          - when: "it is at least the short delay days but fewer than the long delay days after it"
            value: "K('delay_rate_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          delay_rate: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard surrender payment is the account value shown at the latest monthly anniversary, less the full-surrender charge booked, less any premium refund booked on or after that anniversary, less the loan balance and the loan interest accrued to the effective date, and less federal tax withheld at the tier's default federal withholding rate on the taxable amount, that account value less those charge and refund amounts less the gross premiums received less the premiums refunded less the non-taxable part of earlier withdrawals, never below zero, unless the surrender request elects no withholding; the result is rounded to the cent once at the end.
      params: [federal_withholding_default_pct, standard_loan_charged_rate]
    inputs:
      history:
        - {table: ul_service_requests, aggregate: latest, field: received_date, filters: {request_type: surrender, request_status: approved}}
        - {table: ul_transactions, aggregate: latest, field: monthiversary_date, filters: {event_type: ul_monthly_deduction}}
        - {table: ul_transactions, aggregate: sum, field: amount, filters: {event_type: ul_surrender_charge_assessed, charge_reason: full_surrender}}
        - {table: ul_transactions, aggregate: sum, field: gross_amount, filters: {event_type: ul_premium_received}}
        - {table: ul_transactions, aggregate: sum, field: amount, filters: {event_type: ul_premium_refunded}}
        - {table: ul_transactions, aggregate: sum, field: amount, filters: {event_type: ul_partial_withdrawal}}
      cross_category: [term, whole]
