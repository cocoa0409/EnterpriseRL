    rule: >-
      When a signed full surrender is processed, the surrender charge is booked in the policy's activity history as a full-surrender charge on the surrender request, dated the day it is assessed.
      The surrender is effective on the date the signed surrender request was received, and the policy year and the whole months elapsed in it are counted from the issue date to that effective date.
      The standard full-surrender charge is the initial face amount divided by one thousand times the tier's surrender charge schedule rate for the policy year in which the surrender is effective, rounded to the cent, and nothing once the tier's surrender charge years have ended.
      The schedule rate actually applied follows the policy year of the surrender: from the monthly-grading policy year the rate steps down each whole month elapsed in the policy year, by one twelfth of the difference between that year's schedule rate and the next year's schedule rate per month; from the quarterly-grading policy year until the monthly-grading policy year it steps down each whole quarter elapsed, by one quarter of that difference per quarter; in the first policy year the year's schedule rate applies unchanged.
      The issue-age share follows the insured's age last birthday on the issue date, counted from the insured's date of birth: at or above the older issue age the older issue-age share of the charge applies; at or above the middle issue age but below the older issue age the middle issue-age share applies; below the middle issue age the whole charge applies.
      The funding credit follows the gross premiums received in the policy's activity history against the target premium times the policy year of the surrender: premiums of at least the high funding multiple of that figure earn the high funding credit; premiums of at least that figure but below the high funding multiple earn the standard funding credit; smaller premiums earn no credit.
      The conversion credit follows the Ashgrove term policy this policy was converted from: where the policy records a converted term policy and that term policy, shown as converted, was in force at least the long-term years from its issue date to this policy's issue date, the long conversion credit applies; where it was in force at least one but fewer than the long-term years, the short conversion credit applies; where no converted Ashgrove term policy is recorded, or it was in force less than one year, no conversion credit applies.
      The care waiver follows the insured's Ashgrove CareAssure claim: where the CareAssure policy is on an active claim and its activity history shows at least the full-care number of long-term care benefit payments in the last six months, the full care waiver applies; where it is on an active claim and shows at least one but fewer than the full-care number of such payments in the last six months, the partial care waiver applies; otherwise no care waiver applies.
      The full-surrender charge is the initial face amount divided by one thousand, times the graded schedule rate, times the issue-age share, times one less the funding credit, times one less the conversion credit, times one less the care waiver, all multiplied together before a single rounding to the cent.
