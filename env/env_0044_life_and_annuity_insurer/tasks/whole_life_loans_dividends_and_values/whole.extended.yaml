  factors:
  - id: termination_dividend_scale
    effect: parameter
    decides: termination_rate
    bindings:
    - converted_term_issue
    - coverage_months
    - termination_rate
    ladder:
    - when: continuous coverage to the effective date (from the converted Ashgrove term policy's issue date, else this policy's) reaches the 30-year month count and the policy has never been reinstated
      value: K('termination_rate_30_years')
    - when: it reaches the 20-year count but not the 30-year count and the policy has never been reinstated
      value: K('termination_rate_20_years')
    - when: otherwise
      value: '0'
    baseline:
      termination_rate: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: term
  - id: termination_dividend_loan_cut
    effect: parameter
    decides: termination_share
    bindings:
    - loan_extinguished
    - termination_share
    ladder:
    - when: the principal on the election's loan offset entry is at least heavy_loan_ratio of the guaranteed plus additions cash value
      value: K('termination_share_heavy_loan')
    - when: that principal is above zero but below heavy_loan_ratio of those values
      value: K('termination_share_light_loan')
    - when: otherwise (no loan extinguished)
      value: '1'
    baseline:
      termination_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: termination_dividend_application
    effect: method
    decides: termination_in_ncv
    bindings:
    - last_dividend_option
    - termination_in_ncv
    - termination_pua_face
    ladder:
    - when: the most recent declared dividend was applied under the accumulate option
      method: the termination dividend is added to the net cash value and buys reduced paid-up insurance
    - when: it was applied under the paid-up additions option
      method: the termination dividend buys its own paid-up additions at the net single premium, their face added outside the rounding
    - when: otherwise
      method: the termination dividend is paid in cash and stays out of the net cash value
    baseline:
      termination_in_ncv: '0'
      termination_pua_face: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: partial_year_dividend_share
    effect: parameter
    decides: partial_share
    bindings:
    - months_elapsed
    - partial_share
    - last_dividend
    ladder:
    - when: whole months from the anniversary to the effective date are at least partial_months_half
      value: K('partial_share_half')
    - when: they are at least one but below partial_months_half
      value: months_elapsed / K('months_per_year')
    - when: otherwise
      value: '0'
    baseline:
      partial_share: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: paid_up_additions_treatment
    effect: method
    decides: additions_in_ncv
    bindings:
    - additions_total
    - additions_recent
    - recent_additions_cash
    - additions_in_ncv
    ladder:
    - when: the paid-up additions face is at least pua_continue_ratio of the base face
      method: the additions continue as paid-up additions alongside the reduced face and their cash value stays out of the net cash value
    - when: the additions face is below that ratio and every addition was bought within the last pua_recent_months months
      method: the additions are folded in at the dividend cash that bought them
    - when: otherwise
      method: the additions are folded in at their cash value
    baseline:
      additions_in_ncv: F('pua_cash_value')
    evidence:
    - history
    cross_difficulty: null
