    - when: dividends were placed on deposit at deposit_count_long or more anniversaries
      value: K('deposit_increment_long')
    - when: at deposit_count_mid or more but fewer than deposit_count_long
      value: K('deposit_increment_mid')
    - when: otherwise
      value: '0'
    baseline:
      deposit_increment: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: withdrawal_frequency_reduction
    effect: parameter
    decides: frequency_cut
    bindings:
    - withdrawals_12m
    - frequency_cut
    ladder:
    - when: two or more accumulation withdrawals are dated within the last 12 calendar months
      value: K('frequency_cut_two')
    - when: exactly one is
      value: K('frequency_cut_one')
    - when: otherwise
      value: '0'
    baseline:
      frequency_cut: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: loan_activity_reduction
    effect: parameter
    decides: loan_cut
    bindings:
    - advances_24m
    - loan_cut
    ladder:
    - when: two or more loan advances (owner or automatic premium) are dated within the last 24 calendar months
      value: K('loan_cut_two')
    - when: exactly one is
      value: K('loan_cut_one')
    - when: otherwise
      value: '0'
    baseline:
      loan_cut: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: accumulation_interest_start
    effect: method
    decides: interest_start
    bindings:
    - last_withdrawal
    - last_deposit
    - interest_start
    ladder:
    - when: an accumulation withdrawal is dated after the most recent anniversary
      method: interest runs from the latest such withdrawal's date
    - when: no withdrawal but a dividend deposit entry is dated after the most recent anniversary
      method: interest runs from the latest such deposit's date
    - when: otherwise
      method: interest runs from the most recent anniversary
    baseline:
      interest_start: anniversary
    evidence:
    - history
    cross_difficulty: null
  - id: policy_form_part_year_convention
    effect: method
    decides: year_part
    bindings:
    - issue_days_from_1985
    - issue_days_from_2005
    - year_part
    ladder:
    - when: the policy was issued before January 1, 1985
      method: interest is credited for whole policy months over months_per_year; a part month is not credited
    - when: the policy was issued from January 1, 1985 through December 31, 2004
      method: interest is credited for actual calendar days over days_per_year_360
    - when: otherwise (issued on or after January 1, 2005)
      method: interest is credited for actual calendar days over days_per_year
    baseline:
      year_part: DAYS(interest_start, effective) / K('days_per_year')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The accumulations withdrawn at a reduced paid-up election are the dividend accumulation balance shown on the policy plus simple interest on that balance at dividend_accumulation_rate for the actual calendar days from the most recent policy anniversary to the date the election takes effect over days_per_year, rounded half up to the cent.
    params:
    - dividend_accumulation_rate
    - days_per_year
  inputs:
    history:
    - table: whole_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: whole_dividend_accumulated
    - table: whole_transactions
      aggregate: count
      field: whole_txn_id
      within_months: 12
      filters:
        event_type: whole_accumulation_withdrawn
    - table: whole_transactions
      aggregate: count
      field: whole_txn_id
      within_months: 24
      filters:
        event_type: whole_loan_advanced
    cross_category: []
- id: whole_ext_reduced_paid_up_face
  base_policy_refs:
  - whole_reduced_paid_up_election
  - whole_grace_apl_and_nonforfeiture
  - whole_dividends
  overwrite:
  - base_policy: whole_reduced_paid_up_election
    superseded_clause: the reduced face is the net cash value divided by rpu_nsp_per_thousand times 1,000, rounded to the dollar, and must be at least rpu_min_face_amount
    replaced_by: The reduced paid-up face is the net cash value, made up of the guaranteed cash value, the paid-up additions as folded in, the accumulations withdrawn for the election, the termination dividend where it enters the net cash value and the partial-year dividend, less the principal and the interest on the loan offset entry for the election, divided by rpu_nsp_per_thousand and multiplied by 1,000 and rounded half up to the whole dollar, plus the face of any additions the termination dividend buys.
  trigger: on_request
  subject:
  - whole_reduced_paid_up_elected
  computes: reduced_face_amount
  target_tool: elect_reduced_paid_up_64725b60
  params:
    termination_rate_30_years: 0.03
    termination_rate_20_years: 0.015
    continuity_months_30_years: 360
    continuity_months_20_years: 240
    termination_share_heavy_loan: 0.5
    termination_share_light_loan: 0.8
    heavy_loan_ratio: 0.25
    partial_months_half: 6
    partial_share_half: 0.5
    months_per_year: 12
    pua_continue_ratio: 0.1
    pua_recent_months: 60
  rule: 'An owner of a premium-paying policy may stop premiums and continue it as reduced paid-up insurance by signed election, effective on the paid-to date; the reduced paid-up face is bought by the net cash value at rpu_nsp_per_thousand from the most recent anniversary statement and must be at least rpu_min_face_amount. The reduced paid-up face is the net cash value, which is the guaranteed cash value and the paid-up additions cash value from the most recent anniversary statement plus the dividend accumulations withdrawn for the election less the loan principal and loan interest extinguished at the election, divided by rpu_nsp_per_thousand and multiplied by 1,000, rounded half up to the whole dollar. A termination dividend is added at a reduced paid-up election for long continuous coverage on the insured, counted in whole months to the date the election takes effect from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: it is termination_rate_30_years of the guaranteed cash value where the count is at least continuity_months_30_years and the policy has never been reinstated, termination_rate_20_years of the guaranteed cash value where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise. The termination dividend is cut where the election extinguishes a loan, judged by the principal on the loan offset entry for the election against the guaranteed cash value plus the paid-up additions cash value: it is paid at termination_share_heavy_loan of its amount where that principal is at least heavy_loan_ratio of those values, at termination_share_light_loan of its amount where the principal is above zero but below heavy_loan_ratio of those values, and in full where no loan is extinguished; the reduced amount is rounded half up to the cent. The termination dividend is applied under the dividend option of the most recent declared dividend on the policy ledger: under the accumulate option it is added to the net cash value and buys reduced paid-up insurance with it; under the paid-up additions option it buys paid-up additions of its own at rpu_nsp_per_thousand, whose face, to the cent, is added to the reduced face outside its rounding; under any other option it is paid to the owner in cash and does not enter the net cash value. A dividend for the part of the policy year elapsed at the election is added to the net cash value as a share of the most recent declared dividend, the share being fixed by the whole months from the most recent anniversary to the date the election takes effect: partial_share_half where those months are at least partial_months_half, those months over months_per_year where they are at least one but below partial_months_half, and nothing where they are fewer than one; the partial-year dividend is rounded half up to the cent. Paid-up additions at a reduced paid-up election are treated by their size and age: where the paid-up additions face is at least pua_continue_ratio of the base face, the additions continue in force as paid-up additions alongside the reduced face, so their cash value stays out of the net cash value; where the additions face is below pua_continue_ratio of the base face and every addition on the policy ledger was bought within the last pua_recent_months calendar months, the additions are folded into the net cash value at the dividend cash that bought them; otherwise they are folded into the net cash value at their cash value. The reduced paid-up face is the net cash value, made up of the guaranteed cash value, the paid-up additions as folded in, the accumulations withdrawn for the election, the termination dividend where it enters the net cash value and the partial-year dividend, less the principal and the interest on the loan offset entry for the election, divided by rpu_nsp_per_thousand and multiplied by 1,000 and rounded half up to the whole dollar, plus the face of any additions the termination dividend buys. The reduced paid-up face is fixed only after the loan balance shown on the policy stands at zero with a loan offset entry for it on the policy ledger. The reduced paid-up face is not worked out until the dividend accumulation balance shown on the policy stands at zero with an accumulation withdrawal entry for the election on the policy ledger.'
  prerequisite:
  - problem: whole_ext_offset_interest_extinguished
    kind: value_input
    gate: offset_principal
    form: state
    policy_source: The reduced paid-up face is fixed only after the loan balance shown on the policy stands at zero with a loan offset entry for it on the policy ledger.
    condition: whole_holdings.loan_balance is 0.00 and whole_transactions carries a whole_loan_offset row with offset_reason nonforfeiture for the policy
    resolved_by: extinguish_policy_loan_1349795c
    effect: Once the loan is extinguished, the offset entry supplies the principal and interest deducted from the net cash value and the principal that sets the termination dividend's loan cut.
  - problem: whole_ext_election_accumulation_withdrawal
    kind: value_input
    gate: accumulations_applied
    form: state
    policy_source: The reduced paid-up face is not worked out until the dividend accumulation balance shown on the policy stands at zero with an accumulation withdrawal entry for the election on the policy ledger.
    condition: whole_holdings.dividend_accumulation_balance is 0.00 and whole_transactions carries a whole_accumulation_withdrawn row dated on the election day
    resolved_by: withdraw_election_accumulations_2818c877
    effect: Once the accumulations are withdrawn for the election, that withdrawal entry, interest for the part year included, is the accumulation amount added to the net cash value.
  cross_category:
  - category: term
    as: branch
    reads:
    - issue_date
    note: The termination dividend counts continuous coverage from the issue date of the Ashgrove term policy converted into this policy.
  compute:
  - effective: F('paid_to_date')
  - gcv: F('guaranteed_cash_value')
  - nsp: F('rpu_nsp_per_thousand')
  - accumulations_applied: LATEST('whole_transactions', 'amount', date_field='transaction_date', event_type='whole_accumulation_withdrawn') or 0
  - offset_principal: SUM('whole_transactions', 'amount', event_type='whole_loan_offset', offset_reason='nonforfeiture')
  - offset_interest: SUM('whole_transactions', 'interest_amount', event_type='whole_loan_offset', offset_reason='nonforfeiture')
  - converted_term_issue: CFIELD('term', 'issue_date', term_policy_id=F('converted_from_term_policy_id'))
  - coverage_months: MONTHS(converted_term_issue or F('issue_date'), effective)
  - termination_rate: K('termination_rate_30_years') if (coverage_months >= K('continuity_months_30_years') and not F('reinstatement_date')) else (K('termination_rate_20_years') if (coverage_months >= K('continuity_months_20_years') and not F('reinstatement_date')) else 0)
  - loan_extinguished: float(LATEST('whole_transactions', 'amount', date_field='transaction_date', event_type='whole_loan_offset', offset_reason='nonforfeiture') or 0)
  - termination_share: K('termination_share_heavy_loan') if loan_extinguished >= K('heavy_loan_ratio') * (gcv + F('pua_cash_value')) else (K('termination_share_light_loan') if loan_extinguished > 0 else 1)
  - termination_dividend: RND(gcv * termination_rate * termination_share, 2)
  - last_dividend_option: LATEST('whole_transactions', 'dividend_option', date_field='transaction_date', event_type='whole_dividend_declared') or ''
  - termination_in_ncv: termination_dividend if last_dividend_option == 'accumulate' else 0
  - termination_pua_face: RND(termination_dividend * 1000 / nsp, 2) if last_dividend_option == 'paid_up_additions' else 0
  - months_elapsed: MONTHS(F('values_as_of_date'), effective)
  - partial_share: K('partial_share_half') if months_elapsed >= K('partial_months_half') else (months_elapsed / K('months_per_year') if months_elapsed >= 1 else 0)
  - last_dividend: LATEST('whole_transactions', 'amount', date_field='transaction_date', event_type='whole_dividend_declared') or 0
  - partial_dividend: RND(float(last_dividend) * partial_share, 2)
  - additions_total: COUNT('whole_transactions', event_type='whole_dividend_purchased_pua')
  - additions_recent: COUNT('whole_transactions', within_months=K('pua_recent_months'), date_field='transaction_date', event_type='whole_dividend_purchased_pua')
  - recent_additions_cash: SUM('whole_transactions', 'cash_amount', event_type='whole_dividend_purchased_pua')
  - additions_in_ncv: 0 if F('pua_face_amount') >= K('pua_continue_ratio') * F('face_amount') else (recent_additions_cash if (additions_total > 0 and additions_recent == additions_total) else F('pua_cash_value'))
  - ncv: gcv + additions_in_ncv + float(accumulations_applied) + termination_in_ncv + partial_dividend - float(offset_principal) - float(offset_interest)
  - result: RND(ncv / nsp * 1000, 0) + termination_pua_face
