- id: whole_ext_election_accumulation_withdrawal
  base_policy_refs:
  - whole_dividends
  - whole_reduced_paid_up_election
  overwrite:
  - base_policy: whole_dividends
    superseded_clause: accumulations are left on deposit and credited interest at dividend_accumulation_rate on each anniversary on the balance held for the whole policy year
    replaced_by: When the owner elects reduced paid-up insurance, the whole dividend accumulation deposit is withdrawn and applied with the cash value to buy the reduced paid-up insurance, as one accumulation withdrawal entry; the withdrawal carries interest on the deposit for the part of the current policy year that ends on the date the election takes effect, which is the paid-to date.
  trigger: on_request
  subject:
  - whole_accumulation_withdrawn
  computes: withdrawal_amount
  target_tool: withdraw_election_accumulations_2818c877
  params:
    band_floor_high: 25000
    band_floor_mid: 10000
    band_increment_high: 0.005
    band_increment_mid: 0.0025
    deposit_count_long: 10
    deposit_count_mid: 5
    deposit_increment_long: 0.004
    deposit_increment_mid: 0.002
    frequency_cut_two: 0.005
    frequency_cut_one: 0.0025
    loan_cut_two: 0.01
    loan_cut_one: 0.005
    days_per_year: 365
    months_per_year: 12
    days_per_year_360: 360
  rule: 'When the owner elects reduced paid-up insurance, the whole dividend accumulation deposit is withdrawn and applied with the cash value to buy the reduced paid-up insurance, as one accumulation withdrawal entry; the withdrawal carries interest on the deposit for the part of the current policy year that ends on the date the election takes effect, which is the paid-to date. The accumulations withdrawn at a reduced paid-up election are the dividend accumulation balance shown on the policy plus simple interest on that balance at dividend_accumulation_rate for the actual calendar days from the most recent policy anniversary to the date the election takes effect over days_per_year, rounded half up to the cent. The interest rate on accumulations withdrawn at an election is the declared dividend_accumulation_rate raised for a large deposit, judged by the deposit as the policy ledger totals it, that is the dividends placed on deposit plus the interest credited less the withdrawals: by band_increment_high where the balance is at least band_floor_high, by band_increment_mid where it is at least band_floor_mid but below band_floor_high, and not at all where it is below band_floor_mid. That rate is raised again for a long-standing deposit, judged by the number of anniversaries at which a dividend was placed on deposit as shown by the dividend deposit entries on the policy ledger: by deposit_increment_long where there are at least deposit_count_long such entries, by deposit_increment_mid where there are at least deposit_count_mid but fewer than deposit_count_long, and not at all where there are fewer than deposit_count_mid. That rate is lowered for a deposit drawn on often, judged by the accumulation withdrawals on the policy ledger dated within the last 12 calendar months: by frequency_cut_two where there are two or more such withdrawals, by frequency_cut_one where there is exactly one, and not at all where there is none. That rate is lowered again for a policy drawing loans, judged by the loan advances on the policy ledger, owner loans and automatic premium loans alike, dated within the last 24 calendar months: by loan_cut_two where there are two or more such advances, by loan_cut_one where there is exactly one, and not at all where there is none; the rate applied is the declared rate plus the two increases less the two reductions. Interest on accumulations withdrawn at an election runs on the balance shown on the policy from a start date that the ledger fixes: where an accumulation withdrawal is dated after the most recent policy anniversary, from the date of the latest such withdrawal; where no withdrawal is dated after the anniversary but a dividend deposit entry is, from the date of the latest such deposit; otherwise from the most recent policy anniversary. The part of a year for which interest is credited on accumulations withdrawn at an election follows the interest convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 credits by whole policy months, the whole months from the start date to the date the election takes effect over months_per_year, a remaining part month not being credited; a policy issued from January 1, 1985 through December 31, 2004 credits on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 credits on a 365-day year, the actual calendar days over days_per_year. The accumulations withdrawn are the balance shown on the policy plus that balance multiplied by the rate applied and by that part of a year, the interest being rounded half up to the cent once, on the total.'
  prerequisite: []
  cross_category: []
  compute:
  - anniversary: F('values_as_of_date')
  - effective: F('paid_to_date')
  - balance: F('dividend_accumulation_balance')
  - ledger_deposit: SUM('whole_transactions', 'amount', event_type='whole_dividend_accumulated') + SUM('whole_transactions', 'amount', event_type='whole_accumulation_interest_credited') - SUM('whole_transactions', 'amount', event_type='whole_accumulation_withdrawn')
  - band_increment: K('band_increment_high') if ledger_deposit >= K('band_floor_high') else (K('band_increment_mid') if ledger_deposit >= K('band_floor_mid') else 0)
  - deposit_count: COUNT('whole_transactions', event_type='whole_dividend_accumulated')
  - deposit_increment: K('deposit_increment_long') if deposit_count >= K('deposit_count_long') else (K('deposit_increment_mid') if deposit_count >= K('deposit_count_mid') else 0)
  - withdrawals_12m: COUNT('whole_transactions', within_months=12, date_field='transaction_date', event_type='whole_accumulation_withdrawn')
  - frequency_cut: K('frequency_cut_two') if withdrawals_12m >= 2 else (K('frequency_cut_one') if withdrawals_12m == 1 else 0)
  - advances_24m: COUNT('whole_transactions', within_months=24, date_field='transaction_date', event_type='whole_loan_advanced')
  - loan_cut: K('loan_cut_two') if advances_24m >= 2 else (K('loan_cut_one') if advances_24m == 1 else 0)
  - rate: P('dividend_accumulation_rate') + band_increment + deposit_increment - frequency_cut - loan_cut
  - issue_days_from_2005: DAYS('2005-01-01', F('issue_date'))
  - last_withdrawal: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_accumulation_withdrawn') or ''
  - last_deposit: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_dividend_accumulated') or ''
  - interest_start: last_withdrawal if last_withdrawal > anniversary else (last_deposit if last_deposit > anniversary else anniversary)
  - issue_days_from_1985: DAYS('1985-01-01', F('issue_date'))
  - year_part: MONTHS(interest_start, effective) / K('months_per_year') if issue_days_from_1985 < 0 else (DAYS(interest_start, effective) / K('days_per_year_360') if issue_days_from_2005 < 0 else DAYS(interest_start, effective) / K('days_per_year'))
  - result: RND(balance + RND(balance * rate * year_part, 2), 2)
  compute_basis:
    anniversary: The accumulations withdrawn at a reduced paid-up election are the dividend accumulation balance shown on the policy plus simple interest on that balance at dividend_accumulation_rate for the actual calendar days from the most recent policy anniversary to the date the election takes effect over days_per_year, rounded half up to the cent.
    effective: When the owner elects reduced paid-up insurance, the whole dividend accumulation deposit is withdrawn and applied with the cash value to buy the reduced paid-up insurance, as one accumulation withdrawal entry; the withdrawal carries interest on the deposit for the part of the current policy year that ends on the date the election takes effect, which is the paid-to date.
    balance: The accumulations withdrawn at a reduced paid-up election are the dividend accumulation balance shown on the policy plus simple interest on that balance at dividend_accumulation_rate for the actual calendar days from the most recent policy anniversary to the date the election takes effect over days_per_year, rounded half up to the cent.
    ledger_deposit: 'The interest rate on accumulations withdrawn at an election is the declared dividend_accumulation_rate raised for a large deposit, judged by the deposit as the policy ledger totals it, that is the dividends placed on deposit plus the interest credited less the withdrawals: by band_increment_high where the balance is at least band_floor_high, by band_increment_mid where it is at least band_floor_mid but below band_floor_high, and not at all where it is below band_floor_mid.'
    band_increment: 'The interest rate on accumulations withdrawn at an election is the declared dividend_accumulation_rate raised for a large deposit, judged by the deposit as the policy ledger totals it, that is the dividends placed on deposit plus the interest credited less the withdrawals: by band_increment_high where the balance is at least band_floor_high, by band_increment_mid where it is at least band_floor_mid but below band_floor_high, and not at all where it is below band_floor_mid.'
    deposit_count: 'That rate is raised again for a long-standing deposit, judged by the number of anniversaries at which a dividend was placed on deposit as shown by the dividend deposit entries on the policy ledger: by deposit_increment_long where there are at least deposit_count_long such entries, by deposit_increment_mid where there are at least deposit_count_mid but fewer than deposit_count_long, and not at all where there are fewer than deposit_count_mid.'
    deposit_increment: 'That rate is raised again for a long-standing deposit, judged by the number of anniversaries at which a dividend was placed on deposit as shown by the dividend deposit entries on the policy ledger: by deposit_increment_long where there are at least deposit_count_long such entries, by deposit_increment_mid where there are at least deposit_count_mid but fewer than deposit_count_long, and not at all where there are fewer than deposit_count_mid.'
    withdrawals_12m: 'That rate is lowered for a deposit drawn on often, judged by the accumulation withdrawals on the policy ledger dated within the last 12 calendar months: by frequency_cut_two where there are two or more such withdrawals, by frequency_cut_one where there is exactly one, and not at all where there is none.'
    frequency_cut: 'That rate is lowered for a deposit drawn on often, judged by the accumulation withdrawals on the policy ledger dated within the last 12 calendar months: by frequency_cut_two where there are two or more such withdrawals, by frequency_cut_one where there is exactly one, and not at all where there is none.'
    advances_24m: 'That rate is lowered again for a policy drawing loans, judged by the loan advances on the policy ledger, owner loans and automatic premium loans alike, dated within the last 24 calendar months: by loan_cut_two where there are two or more such advances, by loan_cut_one where there is exactly one, and not at all where there is none; the rate applied is the declared rate plus the two increases less the two reductions.'
    loan_cut: 'That rate is lowered again for a policy drawing loans, judged by the loan advances on the policy ledger, owner loans and automatic premium loans alike, dated within the last 24 calendar months: by loan_cut_two where there are two or more such advances, by loan_cut_one where there is exactly one, and not at all where there is none; the rate applied is the declared rate plus the two increases less the two reductions.'
    rate: 'That rate is lowered again for a policy drawing loans, judged by the loan advances on the policy ledger, owner loans and automatic premium loans alike, dated within the last 24 calendar months: by loan_cut_two where there are two or more such advances, by loan_cut_one where there is exactly one, and not at all where there is none; the rate applied is the declared rate plus the two increases less the two reductions.'
    last_withdrawal: 'Interest on accumulations withdrawn at an election runs on the balance shown on the policy from a start date that the ledger fixes: where an accumulation withdrawal is dated after the most recent policy anniversary, from the date of the latest such withdrawal; where no withdrawal is dated after the anniversary but a dividend deposit entry is, from the date of the latest such deposit; otherwise from the most recent policy anniversary.'
    last_deposit: 'Interest on accumulations withdrawn at an election runs on the balance shown on the policy from a start date that the ledger fixes: where an accumulation withdrawal is dated after the most recent policy anniversary, from the date of the latest such withdrawal; where no withdrawal is dated after the anniversary but a dividend deposit entry is, from the date of the latest such deposit; otherwise from the most recent policy anniversary.'
    interest_start: 'Interest on accumulations withdrawn at an election runs on the balance shown on the policy from a start date that the ledger fixes: where an accumulation withdrawal is dated after the most recent policy anniversary, from the date of the latest such withdrawal; where no withdrawal is dated after the anniversary but a dividend deposit entry is, from the date of the latest such deposit; otherwise from the most recent policy anniversary.'
    year_part: 'The part of a year for which interest is credited on accumulations withdrawn at an election follows the interest convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 credits by whole policy months, the whole months from the start date to the date the election takes effect over months_per_year, a remaining part month not being credited; a policy issued from January 1, 1985 through December 31, 2004 credits on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 credits on a 365-day year, the actual calendar days over days_per_year.'
    result: The accumulations withdrawn are the balance shown on the policy plus that balance multiplied by the rate applied and by that part of a year, the interest being rounded half up to the cent once, on the total.
    issue_days_from_2005: 'The part of a year for which interest is credited on accumulations withdrawn at an election follows the interest convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 credits by whole policy months, the whole months from the start date to the date the election takes effect over months_per_year, a remaining part month not being credited; a policy issued from January 1, 1985 through December 31, 2004 credits on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 credits on a 365-day year, the actual calendar days over days_per_year.'
    issue_days_from_1985: 'The part of a year for which interest is credited on accumulations withdrawn at an election follows the interest convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 credits by whole policy months, the whole months from the start date to the date the election takes effect over months_per_year, a remaining part month not being credited; a policy issued from January 1, 1985 through December 31, 2004 credits on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 credits on a 365-day year, the actual calendar days over days_per_year.'
  factors:
  - id: large_deposit_increment
    effect: parameter
    decides: band_increment
    bindings:
    - ledger_deposit
    - band_increment
    ladder:
    - when: the ledger-totalled deposit is at least band_floor_high
