  - deposited_12m: SUM('whole_transactions', 'amount', within_months=12, date_field='transaction_date', event_type='whole_dividend_accumulated')
  - half_year_amount: withdrawn_12m * K('credit_half_year') if withdrawals_12m > 0 else (deposited_12m * K('credit_half_year') if deposited_12m > 0 else 0)
  - result: RND(rate * (balance + half_year_amount), 2)
