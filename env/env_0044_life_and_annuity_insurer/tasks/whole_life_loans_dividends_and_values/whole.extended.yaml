  rule: 'On each policy anniversary the dividend accumulation deposit is owed interest for the policy year that the anniversary closes; the credit is booked as one interest credit entry dated that anniversary, and every count and total below is taken over the policy ledger as it stands on the day the credit is processed, which may be later than the anniversary. The interest credited for a closed policy year is the dividend accumulation balance shown on the policy multiplied by dividend_accumulation_rate, rounded half up to the cent. The annual rate credited on the deposit is the declared dividend_accumulation_rate raised for a large deposit, judged by the deposit as the policy ledger totals it, that is the dividends placed on deposit plus the interest credited less the withdrawals: by credit_band_increment_high where that total is at least credit_band_floor_high, by credit_band_increment_mid where it is at least credit_band_floor_mid but below credit_band_floor_high, and not at all where it is below credit_band_floor_mid. The rate credited is raised again for a long-standing deposit, judged by the number of dividend deposit entries on the policy ledger: by credit_deposit_increment_long where there are at least credit_deposit_count_long, by credit_deposit_increment_mid where there are at least credit_deposit_count_mid but fewer than credit_deposit_count_long, and not at all where there are fewer than credit_deposit_count_mid. The rate credited is lowered for a deposit drawn on often, judged by the accumulation withdrawals on the policy ledger dated within the 12 calendar months before the day the credit is processed: by credit_frequency_cut_two where there are two or more, by credit_frequency_cut_one where there is exactly one, and not at all where there is none. The rate credited is lowered again for a policy drawing loans, judged by the loan advances on the policy ledger, owner loans and automatic premium loans alike, dated within the 24 calendar months before the day the credit is processed: by credit_loan_cut_two where there are two or more, by credit_loan_cut_one where there is exactly one, and not at all where there is none; the rate credited is the declared rate plus the two increases less the two reductions. Money that moved through the deposit in the 12 calendar months before the day the credit is processed earns interest for half a year: where accumulation withdrawals are dated within those 12 months, the amounts withdrawn are credited for half a year, that is their total times credit_half_year is added to the balance the rate applies to; where no withdrawal is so dated but dividend deposit entries are, those deposits are credited for half a year the same way; otherwise only the balance shown is credited. The interest credited is the rate credited multiplied by the balance shown on the policy plus any half-year amount, rounded half up to the cent once, at the end.'
  prerequisite: []
  cross_category: []
  compute:
