    coverage_months: 'The dividend placed on deposit is raised for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: by deposit_duration_increment_30 where the count is at least deposit_duration_months_30 and the policy has never been reinstated, by deposit_duration_increment_20 where it is at least deposit_duration_months_20 but below deposit_duration_months_30 and the policy has never been reinstated, and not at all otherwise.'
    duration_increment: 'The dividend placed on deposit is raised for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: by deposit_duration_increment_30 where the count is at least deposit_duration_months_30 and the policy has never been reinstated, by deposit_duration_increment_20 where it is at least deposit_duration_months_20 but below deposit_duration_months_30 and the policy has never been reinstated, and not at all otherwise.'
    result: The amount placed on deposit is the declared dividend plus the additions dividend, multiplied by one plus the size increase plus the duration increase less the persistency reduction, rounded half up to the cent once, at the end.
    additions_recent: 'The declared dividend is earned by the base face, and paid-up additions earn a dividend of their own, apportioned by a method that depends on how long the additions have been in force: where at least one paid-up addition on the policy ledger was bought more than deposit_additions_seasoning_months calendar months before the deposit is processed, the additions dividend is apportioned by face, the declared dividend divided by the base face and multiplied by the paid-up additions face that the purchase entries total; where every addition on the ledger was bought within those deposit_additions_seasoning_months months, the additions dividend is apportioned by reserve, the declared dividend divided by the guaranteed cash value and multiplied by the paid-up additions cash value; where the ledger shows no paid-up additions, there is no additions dividend.'
  factors:
  - id: additions_dividend_method
    effect: method
    decides: additions_dividend
    bindings:
    - additions_face
    - additions_purchases
    - additions_recent
    - additions_dividend
    ladder:
    - when: at least one paid-up addition was bought more than deposit_additions_seasoning_months months before the deposit is processed
      method: 'the additions dividend is apportioned by face: the declared dividend per unit of base face times the additions face'
    - when: every addition was bought within those months
      method: 'the additions dividend is apportioned by reserve: the declared dividend per unit of guaranteed cash value times the additions cash value'
    - when: otherwise (no additions)
      method: no additions dividend
    baseline:
      additions_dividend: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: large_policy_increment
    effect: parameter
    decides: size_increment
    bindings:
    - policy_total_face
    - size_increment
    ladder:
    - when: base face plus ledger-totalled additions face is at least deposit_size_floor_high
      value: K('deposit_size_increment_high')
    - when: it is at least deposit_size_floor_mid but below deposit_size_floor_high
      value: K('deposit_size_increment_mid')
    - when: otherwise
      value: '0'
    baseline:
      size_increment: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: interrupted_premium_reduction
    effect: parameter
    decides: persistency_cut
    bindings:
    - returned_12m
    - persistency_cut
    ladder:
    - when: two or more premium payments returned unpaid within the 12 calendar months before the day the deposit is processed
      value: K('deposit_persistency_cut_two')
    - when: exactly one
      value: K('deposit_persistency_cut_one')
    - when: otherwise
      value: '0'
    baseline:
      persistency_cut: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: continuous_coverage_increment
    effect: parameter
    decides: duration_increment
    bindings:
    - converted_term_issue
    - coverage_months
    - duration_increment
    ladder:
    - when: whole months of continuous coverage to the anniversary (from the converted Ashgrove term policy's issue date, else this policy's) reach the 30-year count and the policy has never been reinstated
      value: K('deposit_duration_increment_30')
    - when: they reach the 20-year count but not the 30-year count and the policy has never been reinstated
      value: K('deposit_duration_increment_20')
    - when: otherwise
      value: '0'
    baseline:
      duration_increment: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: term
  baseline:
    rule: The amount placed on deposit is the most recent dividend declared on the policy ledger.
    params: []
  inputs:
    history:
    - table: whole_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: whole_dividend_declared
    - table: whole_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: whole_dividend_purchased_pua
    - table: whole_transactions
      aggregate: count
      field: whole_txn_id
      within_months: 12
      filters:
        event_type: whole_premium_payment_returned
    cross_category:
    - term
- id: whole_ext_net_surrender_value
  base_policy_refs:
  - whole_surrender
  - whole_dividends
  - whole_evt_loan_interest_and_repayment
  overwrite:
  - base_policy: whole_surrender
    superseded_clause: The gross cash value is the guaranteed cash value plus the paid-up additions cash value from the most recent anniversary statement plus dividend accumulations; the net cash surrender value is the gross cash value less the loan balance and loan interest accrued to the effective date.
    replaced_by: The net cash surrender value paid is the gross cash value, including the accumulation interest rounded half up to the cent and the termination dividend as paid, less the loan indebtedness, less the withholding on its taxable amount, plus any premium refund, rounded half up to the cent once, at the end.
  - base_policy: whole_evt_loan_interest_and_repayment
    superseded_clause: interest not paid by the anniversary is capitalized into the loan principal on that anniversary and itself bears interest
    replaced_by: 'The loan indebtedness deducted at a surrender is settled inside the surrender payment: its interest runs from the loan interest start, which is the date of the latest loan repayment on the policy ledger where that repayment paid loan interest and is later than the loan interest paid-to date shown, and otherwise that paid-to date; the principal owed is the loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, less the latest capitalization entry where its anniversary is later than the loan interest start, because interest after that start is charged here instead and is never charged twice; and the indebtedness is that principal owed plus simple interest on it at the tier''s loan_interest_rate for the actual calendar days from the loan interest start to the surrender effective date over days_in_year, the interest rounded half up to the cent.'
  trigger: on_request
  subject:
  - whole_policy_surrendered
  - whole_cash_value_paid
  computes: net_amount
  target_tool: complete_policy_surrender_23994b0e
  params:
    surrender_termination_rate_30: 0.03
    surrender_termination_rate_20: 0.015
    surrender_termination_months_30: 360
    surrender_termination_months_20: 240
    surrender_record_share_two: 0.5
    surrender_record_share_one: 0.8
    months_in_year: 12
    days_in_year: 365
  rule: 'A full surrender is effective on the date the signed surrender request was received, and the owner is paid the net cash surrender value in one cash value payment. The net cash surrender value is the gross cash value, which is the guaranteed cash value and the paid-up additions cash value from the most recent anniversary statement plus the dividend accumulation balance shown on the policy plus simple interest on that balance at dividend_accumulation_rate for the actual calendar days from the most recent anniversary to the surrender effective date over days_in_year, less the loan indebtedness and less federal withholding at federal_withholding_default_pct of the taxable amount, which is that gross cash value less the cost basis and never below zero, unless the owner elected no withholding on the request; it is rounded half up to the cent. The loan indebtedness deducted at a surrender is settled inside the surrender payment: its interest runs from the loan interest start, which is the date of the latest loan repayment on the policy ledger where that repayment paid loan interest and is later than the loan interest paid-to date shown, and otherwise that paid-to date; the principal owed is the loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, less the latest capitalization entry where its anniversary is later than the loan interest start, because interest after that start is charged here instead and is never charged twice; and the indebtedness is that principal owed plus simple interest on it at the tier''s loan_interest_rate for the actual calendar days from the loan interest start to the surrender effective date over days_in_year, the interest rounded half up to the cent. A termination dividend is paid with a full surrender for long continuous coverage on the insured, counted in whole months to the surrender effective date from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: it is surrender_termination_rate_30 of the guaranteed cash value where the count is at least surrender_termination_months_30 and the policy has never been reinstated, surrender_termination_rate_20 of the guaranteed cash value where the count is at least surrender_termination_months_20 but below surrender_termination_months_30 and the policy has never been reinstated, and nothing otherwise. The surrender termination dividend is cut for an interrupted premium record, judged by the premium payments returned unpaid on the policy ledger and dated within the 24 calendar months before the day the surrender is processed: it is paid at surrender_record_share_two of its amount where there are two or more, at surrender_record_share_one where there is exactly one, and in full where there is none; the amount paid is rounded half up to the cent and counts toward the gross cash value. Premium paid for whole months beyond the surrender effective date is refunded with the surrender, measured to the paid-to date by the billing mode: on a policy billed quarterly or semiannually the refund is the whole months from the effective date to the paid-to date times the installment premium over the months in that installment''s period; on a policy billed annually it is the whole months to the paid-to date times the annual premium less the annual_policy_fee, over months_in_year; on a policy paying by monthly EFT draft nothing is refunded; each refund is rounded half up to the cent, is added to the net amount paid and is not part of the taxable amount. Interest on the dividend accumulations paid with a surrender runs to the surrender effective date from a start date that the ledger fixes: where an accumulation withdrawal is dated after the most recent anniversary, from the date of the latest such withdrawal; where no withdrawal is so dated but a dividend deposit entry is, from the date of the latest such deposit; otherwise from the most recent anniversary. The net cash surrender value paid is the gross cash value, including the accumulation interest rounded half up to the cent and the termination dividend as paid, less the loan indebtedness, less the withholding on its taxable amount, plus any premium refund, rounded half up to the cent once, at the end. The net cash surrender value is fixed only after the accumulation ledger carries the deposit of the dividend declared at the most recent policy anniversary. The net cash surrender value is not worked out until the accumulation ledger carries the interest credit for the policy year closed by the most recent anniversary.'
  prerequisite:
  - problem: whole_ext_anniversary_dividend_deposit
    kind: value_input
    gate: balance
    form: state
    policy_source: The net cash surrender value is fixed only after the accumulation ledger carries the deposit of the dividend declared at the most recent policy anniversary.
    condition: whole_transactions carries a whole_dividend_accumulated row dated the most recent anniversary (whole_holdings.values_as_of_date) for a policy whose dividend declared that anniversary was applied under the accumulate option
    resolved_by: deposit_anniversary_dividend_704bd37e
    effect: Once the anniversary dividend is on deposit, the accumulation balance paid with the surrender, and the accumulation interest on it, include that deposit.
  - problem: whole_ext_accumulation_interest_credit
    kind: value_input
    gate: balance
    form: state
    policy_source: The net cash surrender value is not worked out until the accumulation ledger carries the interest credit for the policy year closed by the most recent anniversary.
    condition: whole_transactions carries a whole_accumulation_interest_credited row whose interest_period_end equals the most recent anniversary (whole_holdings.values_as_of_date)
    resolved_by: credit_accumulation_interest_b6da2e99
    effect: Once the closed year's interest is credited, the accumulation balance paid with the surrender includes it.
  cross_category:
  - category: term
    as: branch
    reads:
    - issue_date
    note: The surrender termination dividend counts continuous coverage from the issue date of the Ashgrove term policy converted into this policy.
  compute:
  - effective: LATEST('whole_service_requests', 'received_date', date_field='received_date', request_type='surrender') or NOW
  - anniversary: F('values_as_of_date')
  - gcv: F('guaranteed_cash_value')
  - balance: F('dividend_accumulation_balance')
  - converted_term_issue: CFIELD('term', 'issue_date', term_policy_id=F('converted_from_term_policy_id'))
  - coverage_months: MONTHS(converted_term_issue or F('issue_date'), effective)
  - termination_rate: K('surrender_termination_rate_30') if (coverage_months >= K('surrender_termination_months_30') and not F('reinstatement_date')) else (K('surrender_termination_rate_20') if (coverage_months >= K('surrender_termination_months_20') and not F('reinstatement_date')) else 0)
  - returned_24m: COUNT('whole_transactions', within_months=24, date_field='transaction_date', event_type='whole_premium_payment_returned')
  - record_share: K('surrender_record_share_two') if returned_24m >= 2 else (K('surrender_record_share_one') if returned_24m == 1 else 1)
  - termination_dividend: RND(gcv * termination_rate * record_share, 2)
  - months_prepaid: MONTHS(effective, F('paid_to_date')) if F('paid_to_date') else 0
  - premium_refund: RND(months_prepaid * F('modal_premium') / (3 if F('premium_mode') == 'quarterly' else 6), 2) if (F('premium_mode') == 'quarterly' or F('premium_mode') == 'semiannual') else (RND(months_prepaid * (F('modal_premium') - P('annual_policy_fee')) / K('months_in_year'), 2) if F('premium_mode') == 'annual' else 0)
  - last_withdrawal: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_accumulation_withdrawn') or ''
  - last_deposit: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_dividend_accumulated') or ''
  - accrual_start: last_withdrawal if last_withdrawal > anniversary else (last_deposit if last_deposit > anniversary else anniversary)
  - accumulation_interest: RND(balance * P('dividend_accumulation_rate') * DAYS(accrual_start, effective) / K('days_in_year'), 2)
  - gross: gcv + F('pua_cash_value') + balance + accumulation_interest + termination_dividend
  - withholding: 0 if (LATEST('whole_service_requests', 'withholding_election', date_field='received_date', request_type='surrender') or '') == 'no_withholding' else RND(MX(0, gross - F('cost_basis')) * P('federal_withholding_default_pct'), 2)
  - loan_repayment_date: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_loan_repaid') or ''
  - loan_repayment_interest: LATEST('whole_transactions', 'interest_amount', date_field='transaction_date', event_type='whole_loan_repaid') or 0
  - loan_paid_to: F('loan_interest_paid_to_date') or effective
  - loan_interest_start: loan_repayment_date if (loan_repayment_date > loan_paid_to and float(loan_repayment_interest) > 0) else loan_paid_to
  - latest_capitalization_end: LATEST('whole_transactions', 'interest_period_end', date_field='interest_period_end', event_type='whole_loan_interest_capitalized') or ''
  - latest_capitalization_amount: LATEST('whole_transactions', 'amount', date_field='interest_period_end', event_type='whole_loan_interest_capitalized') or 0
  - ledger_loan_principal: SUM('whole_transactions', 'amount', event_type='whole_loan_advanced') + SUM('whole_transactions', 'amount', event_type='whole_loan_interest_capitalized') - SUM('whole_transactions', 'amount', event_type='whole_loan_repaid') - SUM('whole_transactions', 'amount', event_type='whole_loan_offset')
  - principal_owed: ledger_loan_principal - (float(latest_capitalization_amount) if latest_capitalization_end > loan_interest_start else 0)
  - accrued_loan_interest: RND(principal_owed * P('loan_interest_rate') * DAYS(loan_interest_start, effective) / K('days_in_year'), 2) if principal_owed > 0 else 0
  - result: RND(gross - principal_owed - accrued_loan_interest - withholding + premium_refund, 2)
