events:
- type: whole_policy_issued
  target: whole_holdings
  mutation: create
  meaning: A whole life policy is issued — from a new application or from the conversion of an Ashgrove term policy — and recorded as applied until placed in force.
  grain: one row per policy issued
  fields:
    customer_id: the owner
    policy_number: the contract number
    variant_name: the official tier name issued
    insured_name: the insured life
    insured_date_of_birth: the insured's date of birth
    insured_is_owner: whether the owner is the insured
    issue_state: state of issue
    issue_date: the policy date (for a conversion, the conversion date)
    issue_age: insured's age last birthday on the issue date
    underwriting_class: the class approved, or carried over from the converted term policy
    face_amount: the base face amount
    base_rate_per_thousand: the guaranteed annual premium rate per 1,000 of face
    modal_premium: the installment premium (the single premium for a single premium tier)
    premium_mode: the premium mode
    dividend_option: the dividend option elected on the application
    replacement_sale: whether the sale replaced existing coverage
    modified_endowment_contract: whether the policy is a modified endowment contract
    converted_from_term_policy_id: the Ashgrove term policy converted into this policy; empty for a new application
  triggers:
  - event: whole:whole_premium_billed
    map:
      premium_due_date: issue_date
      amount: modal_premium
  - event: whole:whole_beneficiary_designated
    map:
      designation_effective_date: issue_date
- type: whole_policy_placed_in_force
  target: whole_holdings
  mutation:
    transition:
      from: applied
      to: in_force
  meaning: A premium-paying policy is delivered with the first installment paid and coverage begins.
  grain: one row per transaction
  fields:
    status: becomes in_force
    policy_delivery_date: date the owner received the contract
    paid_to_date: date through which the first installment pays
  triggers: []
- type: whole_single_premium_placed
  target: whole_holdings
  mutation:
    transition:
      from: applied
      to: paid_up
  meaning: A single premium policy is delivered with the single premium paid and is paid up from issue.
  grain: one row per transaction
  fields:
    status: becomes paid_up
    policy_delivery_date: date the owner received the contract
    cost_basis: the single premium, which is the opening tax cost basis
  triggers: []
- type: whole_application_declined
  target: whole_holdings
  mutation:
    transition:
      from: applied
      to: declined
  meaning: The application is declined or withdrawn before placement.
  grain: one row per transaction
  fields:
    status: becomes declined
    termination_date: date of the decline or withdrawal
  triggers:
  - event: whole:whole_premium_refunded
    map:
      refund_reason: application_declined
      transaction_date: termination_date
- type: whole_grace_period_started
  target: whole_holdings
  mutation:
    transition:
      from: in_force
      to: grace_period
  meaning: An installment is unpaid on its due date and the grace period begins.
  grain: one row per transaction
  fields:
    status: becomes grace_period
  triggers: []
- type: whole_grace_period_cured
  target: whole_holdings
  mutation:
    transition:
      from: grace_period
      to: in_force
  meaning: Every overdue installment is paid in time — by the owner or by an automatic premium loan — and the policy returns to premium-paying status.
  grain: one row per transaction
  fields:
    status: becomes in_force
  triggers: []
- type: whole_nonforfeiture_applied
  target: whole_holdings
  mutation:
    transition:
    - from: grace_period
      to: extended_term
    - from: grace_period
      to: reduced_paid_up
    - from: grace_period
      to: lapsed
  meaning: The grace period ends unpaid and the nonforfeiture provision applies the net cash value to extended term or reduced paid-up insurance, or the policy lapses when there is no value to apply.
  grain: one row per transaction
  fields:
    status: becomes extended_term, reduced_paid_up or lapsed
    nonforfeiture_option: 'the option applied: extended_term, reduced_paid_up or none'
    face_amount: 'the face of the continued coverage (extended term: base face plus paid-up additions less indebtedness; reduced paid-up: the reduced face bought); unchanged for a lapse'
    eti_expiry_date: the last day of extended term coverage; empty unless extended_term
    default_date: the due date of the unpaid installment, from which the nonforfeiture coverage runs
  triggers: []
- type: whole_reduced_paid_up_elected
  target: whole_holdings
  mutation:
    transition:
      from: in_force
      to: reduced_paid_up
  meaning: The owner elects to stop premiums and continue the policy as reduced paid-up insurance.
  grain: one row per transaction
  fields:
    status: becomes reduced_paid_up
    nonforfeiture_option: reduced_paid_up
    face_amount: the reduced paid-up face bought by the net cash value
    default_date: the effective date of the election — the paid-to date
  triggers: []
- type: whole_extended_term_expired
  target: whole_holdings
  mutation:
    transition:
      from: extended_term
      to: expired
  meaning: The extended term period ends and coverage terminates without value.
  grain: one row per transaction
  fields:
    status: becomes expired
    termination_date: the day after the extended term expiry date
  triggers: []
- type: whole_policy_reinstated
  target: whole_holdings
  mutation:
    transition:
    - from: lapsed
      to: in_force
    - from: extended_term
      to: in_force
    - from: reduced_paid_up
      to: in_force
  meaning: A policy that lapsed or went onto a nonforfeiture option is restored to its original face and premium-paying status.
  grain: one row per transaction
  fields:
    status: becomes in_force
    reinstatement_date: date coverage is restored
    face_amount: the original base face restored
    nonforfeiture_option: cleared to none
    paid_to_date: the paid-to date after back premiums are applied
  triggers: []
- type: whole_premiums_completed
  target: whole_holdings
  mutation:
    transition:
      from: in_force
      to: paid_up
  meaning: The last premium of the premium-paying period is paid and the policy becomes paid up.
  grain: one row per transaction
  fields:
    status: becomes paid_up
  triggers: []
- type: whole_policy_surrendered
  target: whole_holdings
  mutation:
    transition:
    - from: in_force
      to: surrendered
    - from: grace_period
      to: surrendered
    - from: paid_up
      to: surrendered
    - from: reduced_paid_up
      to: surrendered
    - from: extended_term
      to: surrendered
  meaning: The owner surrenders the policy and coverage ends.
  grain: one row per transaction
  fields:
    status: becomes surrendered
    termination_date: the surrender effective date — the date the signed surrender request was received
  triggers:
  - event: whole:whole_cash_value_paid
    map:
      distribution_reason: surrender
      transaction_date: termination_date
- type: whole_loan_default_terminated
  target: whole_holdings
  mutation:
    transition:
    - from: in_force
      to: lapsed
    - from: paid_up
      to: lapsed
    - from: reduced_paid_up
      to: lapsed
  meaning: Indebtedness reached the cash value, the default notice period ended unpaid, and the policy terminates.
  grain: one row per transaction
  fields:
    status: becomes lapsed
    default_date: the termination date at the end of the notice period
    termination_date: the same termination date
  triggers:
  - event: whole:whole_loan_offset
    map:
      offset_reason: loan_default
      transaction_date: termination_date
- type: whole_death_claim_registered
  target: whole_holdings
  mutation:
    transition:
    - from: in_force
      to: death_claim_pending
    - from: grace_period
      to: death_claim_pending
    - from: paid_up
      to: death_claim_pending
    - from: reduced_paid_up
      to: death_claim_pending
    - from: extended_term
      to: death_claim_pending
  meaning: Notice of the insured's death is registered on a policy with coverage on the date of death.
  grain: one row per transaction
  fields:
    status: becomes death_claim_pending
  triggers: []
- type: whole_death_claim_paid
  target: whole_holdings
  mutation:
    transition:
      from: death_claim_pending
      to: claim_paid
  meaning: The death claim is approved and the proceeds are disbursed.
  grain: one row per transaction
  fields:
    status: becomes claim_paid
    termination_date: the disbursement date
  triggers:
  - event: whole:whole_death_benefit_disbursed
    map:
      transaction_date: termination_date
- type: whole_death_claim_denied
  target: whole_holdings
  mutation:
    transition:
      from: death_claim_pending
      to: claim_denied
  meaning: The claim is denied by rescission or the suicide exclusion.
  grain: one row per transaction
  fields:
    status: becomes claim_denied
    termination_date: the claim decision date
  triggers:
  - event: whole:whole_premium_refunded
    map:
      refund_reason: claim_denied_premium_refund
      transaction_date: termination_date
- type: whole_policy_matured
  target: whole_holdings
  mutation:
    transition:
    - from: in_force
      to: matured
    - from: paid_up
      to: matured
  meaning: The insured reaches the maturity age and the policy endows for its cash value.
  grain: one row per transaction
  fields:
    status: becomes matured
    termination_date: the maturity anniversary
  triggers:
  - event: whole:whole_cash_value_paid
    map:
      distribution_reason: maturity
      transaction_date: termination_date
- type: whole_free_look_cancelled
  target: whole_holdings
  mutation:
    transition:
    - from: in_force
      to: cancelled_free_look
    - from: paid_up
      to: cancelled_free_look
  meaning: The owner returns the policy within the free-look period and it is void from issue.
  grain: one row per transaction
  fields:
    status: becomes cancelled_free_look
    termination_date: date the returned policy was received
  triggers:
  - event: whole:whole_premium_refunded
    map:
      refund_reason: free_look
      transaction_date: termination_date
- type: whole_dividend_option_changed
  target: whole_holdings
  mutation: update
  meaning: The owner changes the dividend option for future dividends.
  grain: one row per transaction
  fields:
    dividend_option: the new dividend option
  triggers: []
- type: whole_apl_election_changed
  target: whole_holdings
  mutation: update
  meaning: The owner elects or revokes the automatic premium loan provision.
  grain: one row per transaction
  fields:
    apl_elected: whether automatic premium loan is now elected
  triggers: []
- type: whole_premium_mode_changed
  target: whole_holdings
  mutation: update
  meaning: The premium mode or EFT draft day changes.
  grain: one row per transaction
  fields:
    premium_mode: the new mode
    modal_premium: the installment premium for the new mode
    eft_draft_day: the draft day; empty unless monthly EFT
  triggers: []
- type: whole_anniversary_values_posted
  target: whole_holdings
  mutation: update
  meaning: On each policy anniversary the guaranteed cash value and paid-up additions cash value for the new policy year are posted and loan interest is settled to the anniversary.
  grain: one row per transaction
  fields:
    values_as_of_date: the anniversary the values are as of
    guaranteed_cash_value: the guaranteed cash value of the base face at that anniversary
    pua_cash_value: the cash value of the paid-up additions at that anniversary
    loan_interest_paid_to_date: the anniversary through which loan interest has been paid or capitalized
    rpu_nsp_per_thousand: net single premium per 1,000 of paid-up insurance at the insured's attained age on that anniversary, used to buy reduced paid-up insurance and dividend paid-up additions during the policy year
  triggers: []
- type: whole_paid_to_date_updated
  target: whole_holdings
  mutation: update
  meaning: The paid-to date moves forward when an installment is paid or waived, and back when a payment is returned.
  grain: one row per transaction
  fields:
    paid_to_date: the date through which premiums are paid
  triggers: []
- type: whole_premium_billed
  target: whole_transactions
  meaning: One installment falls due and is billed.
  grain: one row per installment due date
  distinguish_by:
  - premium_due_date
  fields:
    transaction_date: billing date
    amount: installment billed
    premium_due_date: installment due date
  account: premium_outstanding
  direction: in
  triggers: []
- type: whole_premium_paid
  target: whole_transactions
  meaning: A remittance, dividend credit, conversion credit or automatic premium loan is applied to one installment.
  grain: one row per payment applied to one installment
  distinguish_by:
  - premium_due_date
  - transaction_date
  - payment_method
  fields:
    transaction_date: date received or applied
    amount: amount applied
    premium_due_date: installment paid
    payment_method: source of the payment
  account: premium_outstanding
  direction: out
  triggers:
  - event: whole:whole_paid_to_date_updated
    map: {}
- type: whole_premium_payment_returned
  target: whole_transactions
  meaning: An applied payment is returned unpaid by the bank.
  grain: one row per returned payment
  distinguish_by:
  - source_txn_id
  fields:
    transaction_date: date of the return
    amount: amount returned
    premium_due_date: installment the payment had paid
    source_txn_id: the returned payment
    return_reason: bank return reason
  account: premium_outstanding
  direction: in
  triggers:
  - event: whole:whole_paid_to_date_updated
    map: {}
- type: whole_premium_waived
  target: whole_transactions
  meaning: An installment is waived under the waiver of premium rider.
  grain: one row per installment waived
  distinguish_by:
  - premium_due_date
  fields:
    transaction_date: date applied
    amount: installment waived
    premium_due_date: installment waived
    whole_request_id: the approved waiver claim
  account: premium_outstanding
  direction: out
  triggers:
  - event: whole:whole_paid_to_date_updated
    map: {}
- type: whole_premium_refunded
  target: whole_transactions
  meaning: Premium money is refunded.
  grain: one row per refund
  distinguish_by:
  - refund_reason
  - transaction_date
  fields:
    transaction_date: refund date
    amount: amount refunded
    refund_reason: why
    source_txn_id: the refunded payment when the refund relates to one payment
  account: premium_outstanding
  direction: in
  triggers: []
- type: whole_loan_advanced
  target: whole_transactions
  meaning: A policy loan is advanced — to the owner on request, or automatically to pay an overdue premium.
  grain: one row per loan advance
  distinguish_by:
  - transaction_date
  - loan_purpose
  - premium_due_date
  - whole_request_id
  fields:
    transaction_date: date of the advance
    amount: loan principal advanced
    loan_purpose: owner_request or automatic_premium_loan
    premium_due_date: the installment an automatic premium loan pays; empty for an owner loan
    whole_request_id: the owner's loan request; empty for an automatic premium loan
    payout_method: how an owner loan was paid; empty for an automatic premium loan
    federal_withholding_amount: federal tax withheld from a loan on a modified endowment contract; 0.00 otherwise
  account: policy_loan
  direction: in
  triggers:
  - event: whole:whole_premium_paid
    when:
      loan_purpose: automatic_premium_loan
    map:
      payment_method: automatic_premium_loan
      amount: amount
      premium_due_date: premium_due_date
      transaction_date: transaction_date
- type: whole_loan_interest_capitalized
  target: whole_transactions
  meaning: Loan interest unpaid on an anniversary is added to the loan principal.
  grain: one row per anniversary
  distinguish_by:
  - interest_period_end
  fields:
    transaction_date: the anniversary
    amount: interest capitalized
    interest_period_end: the anniversary closing the interest year
  account: policy_loan
  direction: in
  triggers: []
- type: whole_loan_repaid
  target: whole_transactions
  meaning: A loan repayment from the owner reduces the loan.
  grain: one row per repayment
  distinguish_by:
  - transaction_date
  - payment_method
  fields:
    transaction_date: date received
    amount: principal repaid
    interest_amount: accrued loan interest paid with the repayment
    payment_method: how it was paid
  account: policy_loan
  direction: out
  triggers: []
- type: whole_loan_offset
  target: whole_transactions
  meaning: The loan is extinguished against policy values at surrender, death, nonforfeiture or loan default.
  grain: one row per offset occasion
  distinguish_by:
  - offset_reason
  fields:
    transaction_date: date of the offset
    amount: principal extinguished
    interest_amount: accrued interest extinguished with it
    offset_reason: surrender, death_claim, nonforfeiture or loan_default
  account: policy_loan
  direction: out
  triggers: []
- type: whole_dividend_declared
  target: whole_transactions
  meaning: The annual dividend for a policy year is declared on the anniversary and applied under the dividend option in effect.
  grain: one row per policy year's dividend
  distinguish_by:
  - dividend_year
  fields:
    transaction_date: the anniversary
    amount: dividend declared
    dividend_year: the policy year the dividend is paid for
    dividend_option: the option it is applied under
  triggers:
  - event: whole:whole_dividend_accumulated
    when:
      dividend_option: accumulate
    map:
      amount: amount
      dividend_year: dividend_year
      transaction_date: transaction_date
  - event: whole:whole_dividend_purchased_pua
    when:
      dividend_option: paid_up_additions
    map:
      cash_amount: amount
      dividend_year: dividend_year
      transaction_date: transaction_date
  - event: whole:whole_dividend_paid_in_cash
    when:
      dividend_option: cash
    map:
      amount: amount
      dividend_year: dividend_year
      transaction_date: transaction_date
  - event: whole:whole_premium_paid
    when:
      dividend_option: reduce_premium
    map:
      payment_method: dividend_credit
      amount: amount
      transaction_date: transaction_date
- type: whole_dividend_accumulated
  target: whole_transactions
  meaning: A dividend is left on deposit at interest.
  grain: one row per policy year's dividend
  distinguish_by:
  - dividend_year
  fields:
    transaction_date: the anniversary
    amount: dividend deposited
    dividend_year: policy year of the dividend
  account: dividend_accumulation
  direction: in
  triggers: []
- type: whole_accumulation_interest_credited
  target: whole_transactions
  meaning: Interest is credited on dividend accumulations on the anniversary.
  grain: one row per anniversary
  distinguish_by:
  - interest_period_end
  fields:
    transaction_date: the anniversary
    amount: interest credited
    interest_period_end: the anniversary closing the interest year
  account: dividend_accumulation
  direction: in
  triggers: []
- type: whole_accumulation_withdrawn
  target: whole_transactions
  meaning: Dividend accumulations are withdrawn in cash, or paid out with a surrender or death claim.
  grain: one row per withdrawal or payout
  distinguish_by:
  - transaction_date
  - whole_request_id
  fields:
    transaction_date: date paid
    amount: accumulations withdrawn
    whole_request_id: the withdrawal request, surrender request or death claim
    payout_method: how it was paid
  account: dividend_accumulation
  direction: out
  triggers: []
- type: whole_dividend_paid_in_cash
  target: whole_transactions
  meaning: A dividend is paid to the owner in cash.
  grain: one row per policy year's dividend
  distinguish_by:
  - dividend_year
  fields:
    transaction_date: the anniversary
    amount: dividend paid
    dividend_year: policy year of the dividend
  triggers: []
- type: whole_dividend_purchased_pua
  target: whole_transactions
  meaning: A dividend buys paid-up additional insurance at the insured's attained age.
  grain: one row per policy year's dividend
  distinguish_by:
  - dividend_year
  fields:
    transaction_date: the anniversary
    amount: face of paid-up additions purchased
    cash_amount: the dividend applied
    dividend_year: policy year of the dividend
  account: pua_face
  direction: in
  triggers: []
- type: whole_pua_surrendered
  target: whole_transactions
  meaning: Part of the paid-up additions is surrendered for its cash value.
  grain: one row per partial surrender request
  distinguish_by:
  - whole_request_id
  fields:
    transaction_date: date paid
    amount: face of paid-up additions surrendered
    cash_amount: cash value paid before withholding
    taxable_amount: taxable portion of the cash paid
    federal_withholding_amount: federal tax withheld
    whole_request_id: the signed partial surrender request
    payout_method: how it was paid
  account: pua_face
  direction: out
  triggers: []
- type: whole_cash_value_paid
  target: whole_transactions
  meaning: The net cash value is paid on full surrender or maturity.
  grain: one row per terminating distribution
  distinguish_by:
  - distribution_reason
  fields:
    transaction_date: date paid
    amount: net amount paid after loan offset and withholding
    cash_amount: gross cash value before loan offset and withholding
    taxable_amount: gain over cost basis
    federal_withholding_amount: federal tax withheld
    distribution_reason: surrender or maturity
    payout_method: how it was paid
    whole_request_id: the signed surrender request; empty for maturity
  triggers: []
- type: whole_beneficiary_designated
  target: whole_transactions
  meaning: One beneficiary line of a designation is recorded; a later designation replaces the earlier one entirely.
  grain: one row per beneficiary line per designation
  distinguish_by:
  - designation_effective_date
  - beneficiary_class
  - beneficiary_name
  fields:
    transaction_date: date recorded
    designation_effective_date: date the owner signed the designation
    beneficiary_name: beneficiary as named
    beneficiary_relationship: relationship to the insured
    beneficiary_class: primary or contingent
    share_percent: whole-percent share within the class
    designation_type: revocable or irrevocable
    whole_request_id: the signed change request; empty for the original designation
  triggers: []
- type: whole_tiadb_advance_paid
  target: whole_transactions
  meaning: A terminal illness acceleration advance is paid and a lien placed.
  grain: one row per approved acceleration claim
  distinguish_by:
  - whole_request_id
  fields:
    transaction_date: date paid
    amount: elected amount added to the lien
    whole_request_id: the approved claim
    payout_method: how the net advance was paid
  account: tiadb_lien
  direction: in
  triggers: []
- type: whole_tiadb_lien_settled
  target: whole_transactions
  meaning: The acceleration lien is deducted from the death proceeds.
  grain: one row per death claim settling a lien
  distinguish_by:
  - whole_request_id
  fields:
    transaction_date: disbursement date
    amount: lien deducted
    whole_request_id: the death claim
  account: tiadb_lien
  direction: out
  triggers: []
- type: whole_death_benefit_disbursed
  target: whole_transactions
  meaning: One payee's share of the death proceeds is paid.
  grain: one row per payee per death claim
  distinguish_by:
  - whole_request_id
  - payee_name
  fields:
    transaction_date: date paid
    amount: net amount paid including interest
    interest_amount: death-claim interest included
    payee_name: payee as named in the governing designation
    payout_method: check, direct deposit or Beneficiary Access Account
    whole_request_id: the death claim
  triggers: []
measures:
- id: whole_msr_returned_eft_12m
  window: rolling 12 calendar months ending on the date of the return being evaluated, both ends inclusive
  measure: count of whole_premium_payment_returned rows on the policy whose returned payment had payment_method eft, including the one being evaluated
- id: whole_msr_inforce_face_on_insured
  window: point in time at the evaluation date
  measure: sum of face_amount over whole_holdings on the same insured (insured_name and insured_date_of_birth) whose status is applied, in_force, grace_period, paid_up, reduced_paid_up or extended_term
- id: whole_msr_tiadb_accelerated_on_insured
  window: lifetime of every Ashgrove whole life policy on the same insured
  measure: sum of amount over whole_tiadb_advance_paid rows on those policies
- id: whole_msr_premiums_paid
  window: from the issue date to the evaluation date
  measure: sum of amount over whole_premium_paid rows on the policy with payment_method eft, check, debit_card, online_bank_payment, automatic_premium_loan or conversion_credit, less the amount of whole_premium_payment_returned rows and of whole_premium_refunded rows with refund_reason overpayment
policies:
- id: whole_agg_multi_holding
  subject:
  - whole_policy_issued
  rule: An owner may hold any number of Ashgrove whole life policies on lives in which the owner has an insurable interest; the count is not capped. The total face amount on one insured is governed by whole_agg_insured_face_limit, and an Ashgrove Final Expense Whole Life policy may not be issued on an insured who already has Ashgrove Final Expense Whole Life coverage in force.
  eligibility: []
  params:
    max_per_customer: null
- id: whole_agg_insured_face_limit
  subject:
  - whole_policy_issued
  - whole_tiadb_advance_paid
  rule: Whole life coverage is aggregated per insured life, identified by insured name and date of birth. A new policy is issued only if whole_msr_inforce_face_on_insured plus the new face amount does not exceed aggregate_face_limit_per_insured; the face of extended term and reduced paid-up coverage counts at its continued face. A policy issued by conversion of an Ashgrove term policy counts against the limit, but the term face it replaces stops counting under the term charter on the same date, so a conversion never fails this limit for the face converted. Terminal illness accelerations on one insured across all whole life policies, whole_msr_tiadb_accelerated_on_insured, may never exceed tiadb_max_amount of the policy being accelerated.
  eligibility: []
  params:
    aggregate_face_limit_per_insured: 10000000
    tiadb_max_amount: =tiadb_max_amount
  measures:
  - whole_msr_inforce_face_on_insured
  - whole_msr_tiadb_accelerated_on_insured
- id: whole_issue_and_placement
  subject:
  - whole_policy_issued
  - whole_policy_placed_in_force
  - whole_single_premium_placed
  - whole_application_declined
  rule: A tier is issued only within its issue ages, min_face_amount and max_face_amount, on its underwriting_basis; a policy issued by conversion is issued without evidence of insurability in the underwriting class of the converted term policy, at the insured's attained age on the conversion date, and is not subject to the tier's medical underwriting. The first installment is billed on the issue date. A premium-paying policy is placed in force when it is delivered and the first installment is paid; an Ashgrove Single Premium Whole Life policy is placed directly in paid-up status when it is delivered and the single premium is paid, and is a modified endowment contract from issue when modified_endowment_at_issue is true. On the Ashgrove Final Expense Whole Life, for graded_benefit_years from the issue date a death from illness pays graded_benefit_return_pct times whole_msr_premiums_paid instead of the face amount; an accidental death pays the full face amount from issue. A declined or withdrawn application has any premium received refunded in full without interest.
  eligibility: []
  params:
    min_issue_age: =min_issue_age
    max_issue_age: =max_issue_age
    min_face_amount: =min_face_amount
    max_face_amount: =max_face_amount
    underwriting_basis: =underwriting_basis
    modified_endowment_at_issue: =modified_endowment_at_issue
    graded_benefit_years: =graded_benefit_years
    graded_benefit_return_pct: =graded_benefit_return_pct
  measures:
  - whole_msr_premiums_paid
- id: whole_premium_billing
  subject:
  - whole_premium_billed
  - whole_premium_mode_changed
  - whole_premiums_completed
  rule: 'The annual premium is the face amount divided by 1,000 times base_rate_per_thousand, rounded to the cent, plus annual_policy_fee; it is guaranteed never to change. The installment premium is the annual premium times the modal factor of the mode (modal_factor_annual, modal_factor_semiannual, modal_factor_quarterly or modal_factor_monthly_eft), rounded to the cent. Installments are billed until the end of the premium-paying period: when premium_paying_basis is to_attained_age, the last installment is the one due before the policy anniversary on or after the insured''s attained age reaches premium_paying_period_value; when it is policy_years, the last is the one due before the anniversary that ends that number of policy years; a single premium tier bills only once. When the last installment is paid the policy becomes paid_up. A premium mode change is accepted only while the policy status is in_force or grace_period. A mode change takes effect with the first installment due on or after the request, a change to annual mode only on a policy anniversary; monthly EFT needs a draft day from 1 to eft_draft_day_max and is refused during an EFT re-enrollment wait under whole_evt_premium_application.'
  eligibility:
  - id: mode_change_status
    applies_to:
    - whole_premium_mode_changed
    kind: state
    condition: A premium mode change is accepted only while the policy status is in_force or grace_period.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - in_force
      - grace_period
  params:
    annual_policy_fee: =annual_policy_fee
    modal_factor_annual: =modal_factor_annual
    modal_factor_semiannual: =modal_factor_semiannual
    modal_factor_quarterly: =modal_factor_quarterly
    modal_factor_monthly_eft: =modal_factor_monthly_eft
    premium_paying_basis: =premium_paying_basis
    premium_paying_period_value: =premium_paying_period_value
    eft_draft_day_max: =eft_draft_day_max
  formula:
    annual_premium: round(face_amount / 1000 * base_rate_per_thousand, 2) + annual_policy_fee
    modal_premium: round(annual_premium * (modal_factor_annual if premium_mode == "annual" else modal_factor_semiannual if premium_mode == "semiannual" else modal_factor_quarterly if premium_mode == "quarterly" else modal_factor_monthly_eft), 2)
- id: whole_evt_premium_application
  subject:
  - whole_premium_paid
  - whole_premium_payment_returned
  - whole_premium_refunded
  - whole_paid_to_date_updated
  rule: A payment is applied as premium only while the policy status is applied, in_force or grace_period. A remittance not designated as a loan repayment is applied first to the oldest unpaid installment, one installment per payment record; a remittance designated as a loan repayment is never applied to premium. A shortfall up to premium_shortage_tolerance is accepted as full payment; a larger shortfall is not applied and is returned. Unapplied money above overpayment_refund_threshold is refunded; money at or below it is held toward the next installment. A dividend under the reduce-premium option and a conversion credit are applied to the next installment due like a remittance. A payment returned unpaid by the bank reverses only that payment, once; the installment becomes due again and its grace period is counted from its original due date. When whole_msr_returned_eft_12m reaches returned_eft_limit_12m the monthly EFT privilege ends, the mode changes to quarterly direct billing from the next installment, and EFT may be elected again only eft_reenroll_wait_months calendar months after that return.
  eligibility:
  - id: payable_status
    applies_to:
    - whole_premium_paid
    kind: state
    condition: A payment is applied as premium only while the policy status is applied, in_force or grace_period.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - applied
      - in_force
      - grace_period
  params:
    premium_shortage_tolerance: =premium_shortage_tolerance
    overpayment_refund_threshold: =overpayment_refund_threshold
    returned_eft_limit_12m: =returned_eft_limit_12m
    eft_reenroll_wait_months: =eft_reenroll_wait_months
  measures:
  - whole_msr_returned_eft_12m
- id: whole_grace_apl_and_nonforfeiture
  subject:
  - whole_grace_period_started
  - whole_grace_period_cured
  - whole_nonforfeiture_applied
  - whole_loan_advanced
  - whole_extended_term_expired
  rule: 'When an installment is unpaid on its due date the policy enters the grace period, which lasts grace_period_days, or the number of days in grace_period_state_overrides for the issue state; coverage continues during grace. The overdue premium must be received no later than the last day of grace, which is the unpaid installment''s due date plus the grace period days. The last day of grace is found by adding the grace period length in calendar days to the due date; payment received on that day is in time. If the grace period ends unpaid and the owner has elected automatic premium loan on a tier where apl_available is true, an automatic premium loan pays the overdue installment on the last day of grace, provided the loan value available under whole_evt_policy_loan covers it; the policy then returns to in_force. Otherwise the nonforfeiture provision applies as of the unpaid installment''s due date: the owner''s elected option, or default_nonforfeiture_option when none was elected. Extended term insurance continues the base face plus paid-up additions less indebtedness for the period the net cash value buys, and is not available when eti_available_for_rated is false and the underwriting class is table_rated or a tobacco class, in which case reduced paid-up applies. Reduced paid-up insurance is bought by the net cash value at rpu_nsp_per_thousand; when it would buy less than rpu_min_face_amount, the net cash value is paid in cash and the policy is surrendered. Any loan is extinguished against the cash value when a nonforfeiture option applies. With no net cash value the policy lapses. Within nonforfeiture_election_days of the unpaid installment''s due date the owner may replace the default with the other option or with cash surrender, effective as of the same due date. Extended term coverage ends on its expiry date; it has no loan value and pays no dividends.'
  eligibility:
  - id: cure_within_grace
    applies_to:
    - whole_grace_period_cured
    kind: time
    condition: The overdue premium must be received no later than the last day of grace, which is the unpaid installment's due date plus the grace period days.
    evidence_fields:
    - whole_holdings.paid_to_date
    - whole_holdings.issue_state
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the unpaid installment's due date
      anchor_source: whole_holdings.paid_to_date
      relation: not_after
      duration_source: variants.grace_period_days
      unit: calendar_days
      counting_rule: The last day of grace is found by adding the grace period length in calendar days to the due date; payment received on that day is in time.
      boundary: inclusive
  params:
    grace_period_days: =grace_period_days
    grace_period_state_overrides: =grace_period_state_overrides
    apl_available: =apl_available
    default_nonforfeiture_option: =default_nonforfeiture_option
    eti_available_for_rated: =eti_available_for_rated
    rpu_min_face_amount: =rpu_min_face_amount
    nonforfeiture_election_days: =nonforfeiture_election_days
  formula:
    rpu_face: round(net_cash_value / rpu_nsp_per_thousand * 1000, 0)
    net_cash_value: guaranteed_cash_value + pua_cash_value + dividend_accumulation_balance - loan_balance
- id: whole_evt_policy_loan
  subject:
  - whole_loan_advanced
  rule: The owner may borrow against the policy from policy year loan_first_policy_year. A policy loan is advanced only while the policy status is in_force, grace_period, paid_up or reduced_paid_up. An owner loan is advanced only on a loan request whose request status is approved; a loan request signed by the owner is approved when the amount is within the loan value. The loan value available is loan_value_pct of the guaranteed cash value plus the paid-up additions cash value from the most recent anniversary statement, rounded to the cent, less the loan balance, less loan interest accrued since loan_interest_paid_to_date; dividend accumulations are not loan value. A new owner loan must be at least min_loan_amount. Interest accrues at loan_interest_rate, simple, for actual calendar days over 365, and is due on each anniversary. On a modified endowment contract the loan is a taxable distribution to the extent of the gain in the contract and federal tax is withheld at federal_withholding_default_pct of the taxable part unless the owner elected no withholding on the request. An automatic premium loan follows whole_grace_apl_and_nonforfeiture and needs no request. Extended term coverage has no loan value.
  eligibility:
  - id: loan_status
    applies_to:
    - whole_loan_advanced
    kind: state
    condition: A policy loan is advanced only while the policy status is in_force, grace_period, paid_up or reduced_paid_up.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - in_force
      - grace_period
      - paid_up
      - reduced_paid_up
  - id: approved_loan_request
    applies_to:
    - whole_loan_advanced
    kind: authorization
    condition: An owner loan is advanced only on a loan request whose request status is approved; a loan request signed by the owner is approved when the amount is within the loan value.
    evidence_fields:
    - whole_service_requests.request_type
    - whole_service_requests.request_status
    - whole_service_requests.signed_date
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
  params:
    federal_withholding_default_pct: =federal_withholding_default_pct
    modified_endowment_at_issue: =modified_endowment_at_issue
    per_tier:
      Ashgrove Final Expense Whole Life:
        loan_first_policy_year: =loan_first_policy_year
        loan_value_pct: =loan_value_pct
        min_loan_amount: =min_loan_amount
        loan_interest_rate: =loan_interest_rate
      Ashgrove Whole Life Paid-Up at 100:
        loan_first_policy_year: =loan_first_policy_year
        loan_value_pct: =loan_value_pct
        min_loan_amount: =min_loan_amount
        loan_interest_rate: =loan_interest_rate
      Ashgrove Whole Life Paid-Up at 65:
        loan_first_policy_year: =loan_first_policy_year
        loan_value_pct: =loan_value_pct
        min_loan_amount: =min_loan_amount
        loan_interest_rate: =loan_interest_rate
      Ashgrove 20-Pay Whole Life:
        loan_first_policy_year: =loan_first_policy_year
        loan_value_pct: =loan_value_pct
        min_loan_amount: =min_loan_amount
        loan_interest_rate: =loan_interest_rate
      Ashgrove 10-Pay Whole Life:
        loan_first_policy_year: =loan_first_policy_year
        loan_value_pct: =loan_value_pct
        min_loan_amount: =min_loan_amount
        loan_interest_rate: =loan_interest_rate
      Ashgrove Single Premium Whole Life:
        loan_first_policy_year: =loan_first_policy_year
        loan_value_pct: =loan_value_pct
        min_loan_amount: =min_loan_amount
        loan_interest_rate: =loan_interest_rate
  formula:
    accrued_loan_interest: round(loan_balance * loan_interest_rate * (transaction_date - loan_interest_paid_to_date) / 365, 2)
    loan_value_available: round(loan_value_pct * (guaranteed_cash_value + pua_cash_value), 2) - loan_balance - accrued_loan_interest
- id: whole_evt_loan_interest_and_repayment
  subject:
  - whole_loan_interest_capitalized
  - whole_loan_repaid
  - whole_loan_offset
  - whole_loan_default_terminated
  - whole_anniversary_values_posted
  rule: Loan interest for the policy year is due on the anniversary; interest not paid by the anniversary is capitalized into the loan principal on that anniversary and itself bears interest. A repayment is applied first to interest accrued since loan_interest_paid_to_date and then to principal; a repayment must be at least min_loan_repayment unless it repays the whole indebtedness. Repayment may be made at any time while the policy has coverage. A loan is extinguished against the policy values on surrender, death, the application of a nonforfeiture option or loan default. When the loan balance plus accrued interest equals or exceeds the guaranteed cash value plus paid-up additions cash value, Ashgrove mails a default notice to the owner and any assignee; the policy terminates for excess indebtedness when loan_default_notice_days have passed after the notice without a payment bringing indebtedness below that value.
  eligibility: []
  params:
    min_loan_repayment: =min_loan_repayment
    loan_default_notice_days: =loan_default_notice_days
    loan_interest_rate: =loan_interest_rate
- id: whole_dividends
  subject:
  - whole_dividend_declared
  - whole_dividend_accumulated
  - whole_accumulation_interest_credited
  - whole_accumulation_withdrawn
  - whole_dividend_paid_in_cash
  - whole_dividend_purchased_pua
  - whole_pua_surrendered
  - whole_dividend_option_changed
  rule: 'Dividends are not guaranteed. On tiers where participating is true, the dividend declared by the Board for a policy year is credited on the anniversary ending that year, provided the policy is in_force, paid_up or reduced_paid_up on that anniversary; extended term and lapsed policies earn none, and the Ashgrove Final Expense Whole Life is non-participating. The dividend is applied under the option in effect on the anniversary: paid-up additions buy face at rpu_nsp_per_thousand; accumulations are left on deposit and credited interest at dividend_accumulation_rate on each anniversary on the balance held for the whole policy year; reduce-premium dividends pay the next installment due, and any excess is held toward later installments; cash dividends are paid to the owner. When no option was elected, default_dividend_option applies, and the reduce-premium option is unavailable once the policy is paid up, in which case paid-up additions apply. A dividend option change is accepted only while the policy status is in_force, paid_up or reduced_paid_up. The new option applies from the next anniversary''s dividend. The owner may withdraw accumulations in cash by request, at least accumulation_withdrawal_min unless the whole balance is withdrawn. The owner may surrender paid-up additions for their cash value by signed request, at least pua_surrender_min of cash value; the cash value paid is the face surrendered times pua_cash_value divided by pua_face_amount, rounded to the cent. On a contract that is not a modified endowment contract, a withdrawal or partial surrender is taxable only to the extent it exceeds the cost basis; on a modified endowment contract it is taxable first to the extent of the gain; federal tax is withheld at federal_withholding_default_pct of the taxable part unless the owner elected no withholding.'
  eligibility:
  - id: option_change_status
    applies_to:
    - whole_dividend_option_changed
    kind: state
    condition: A dividend option change is accepted only while the policy status is in_force, paid_up or reduced_paid_up.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - in_force
      - paid_up
      - reduced_paid_up
  params:
    participating: =participating
    dividend_accumulation_rate: =dividend_accumulation_rate
    default_dividend_option: =default_dividend_option
    accumulation_withdrawal_min: =accumulation_withdrawal_min
    pua_surrender_min: =pua_surrender_min
    federal_withholding_default_pct: =federal_withholding_default_pct
  formula:
    pua_face_bought: round(cash_amount / rpu_nsp_per_thousand * 1000, 2)
    accumulation_interest: round(dividend_accumulation_balance * dividend_accumulation_rate, 2)
    pua_cash_paid: round(amount * pua_cash_value / pua_face_amount, 2)
- id: whole_surrender
  subject:
  - whole_policy_surrendered
  - whole_cash_value_paid
  - whole_policy_matured
  rule: The owner may surrender the policy for its net cash surrender value. A full surrender is processed only on a surrender request signed by the owner, and also by every irrevocable beneficiary and any collateral assignee of record. The surrender is effective on the date the signed request is received. The gross cash value is the guaranteed cash value plus the paid-up additions cash value from the most recent anniversary statement plus dividend accumulations; the net cash surrender value is the gross cash value less the loan balance and loan interest accrued to the effective date. The taxable amount is the gross cash value less the cost basis, never below zero; federal tax is withheld at federal_withholding_default_pct of the taxable amount unless the owner elected no withholding on the request. Ashgrove pays within its normal processing time but may defer payment for up to surrender_deferral_max_days as the contract permits. A surrender cannot be revoked once the policy is surrendered. At the maturity age the policy endows and the net cash value is paid the same way.
  eligibility:
  - id: signed_surrender_request
    applies_to:
    - whole_policy_surrendered
    - whole_cash_value_paid
    kind: authorization
    condition: A full surrender is processed only on a surrender request signed by the owner, and also by every irrevocable beneficiary and any collateral assignee of record.
    evidence_fields:
    - whole_service_requests.request_type
    - whole_service_requests.signed_date
    - whole_service_requests.request_status
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
  params:
    federal_withholding_default_pct: =federal_withholding_default_pct
    surrender_deferral_max_days: =surrender_deferral_max_days
    maturity_age: =maturity_age
  formula:
    gross_cash_value: guaranteed_cash_value + pua_cash_value + dividend_accumulation_balance
    taxable_amount: max(0, gross_cash_value - cost_basis)
    federal_withholding_amount: round(taxable_amount * federal_withholding_default_pct, 2)
- id: whole_reinstatement
  subject:
  - whole_policy_reinstated
  rule: A policy that lapsed, or that went onto extended term or reduced paid-up insurance by default or election, may be reinstated on the owner's signed application unless it was surrendered for cash. The reinstatement application must be signed no later than the default date plus reinstatement_window_months. The window end is found by adding the number of calendar months to the default date, falling back to the last day of the month when that day does not exist; an application signed on the window end is in time. Evidence of insurability follows reinstatement_evidence_ladder by calendar days from the default date to the application's signed date. The policy is reinstated only on a reinstatement application whose request status is approved. The reinstatement amount is every installment from the default date through the reinstatement date plus simple interest at reinstatement_interest_rate on each from its due date, actual days over 365, rounded to the cent per installment; any loan that was extinguished at default is either repaid or reinstated as a loan with interest from the default date. Statements in the reinstatement application are contestable for contestability_period_years from the reinstatement date.
  eligibility:
  - id: within_reinstatement_window
    applies_to:
    - whole_policy_reinstated
    kind: time
    condition: The reinstatement application must be signed no later than the default date plus reinstatement_window_months.
    evidence_fields:
    - whole_holdings.default_date
    - whole_service_requests.signed_date
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the default date
      anchor_source: whole_holdings.default_date
      relation: not_after
      duration_source: variants.reinstatement_window_months
      unit: calendar_months
      counting_rule: The window end is found by adding the number of calendar months to the default date, falling back to the last day of the month when that day does not exist; an application signed on the window end is in time.
      boundary: inclusive
  - id: approved_application
    applies_to:
    - whole_policy_reinstated
    kind: authorization
    condition: The policy is reinstated only on a reinstatement application whose request status is approved.
    evidence_fields:
    - whole_service_requests.request_type
    - whole_service_requests.request_status
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
  params:
    reinstatement_window_months: =reinstatement_window_months
    reinstatement_interest_rate: =reinstatement_interest_rate
    reinstatement_evidence_ladder: =reinstatement_evidence_ladder
    contestability_period_years: =contestability_period_years
- id: whole_reduced_paid_up_election
  subject:
  - whole_reduced_paid_up_elected
  - whole_apl_election_changed
  rule: An owner of a premium-paying policy may stop premiums and continue it as reduced paid-up insurance by signed request, effective on the paid-to date; the reduced face is the net cash value divided by rpu_nsp_per_thousand times 1,000, rounded to the dollar, and must be at least rpu_min_face_amount. Any loan is extinguished against the cash value first; dividends continue on the reduced face where the tier is participating. An automatic premium loan election may be made or revoked by the owner at any time while the policy is premium-paying on a tier where apl_available is true. An automatic premium loan election change is accepted only while the policy status is in_force or grace_period. The change applies to installments whose grace period has not yet ended.
  eligibility:
  - id: apl_change_status
    applies_to:
    - whole_apl_election_changed
    kind: state
    condition: An automatic premium loan election change is accepted only while the policy status is in_force or grace_period.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - in_force
      - grace_period
  params:
    rpu_min_face_amount: =rpu_min_face_amount
    apl_available: =apl_available
- id: whole_death_claim
  subject:
  - whole_death_claim_registered
  - whole_death_claim_paid
  - whole_death_claim_denied
  - whole_death_benefit_disbursed
  - whole_tiadb_lien_settled
  - whole_loan_offset
  rule: A claim is covered when on the date of death the policy was in_force, in grace, paid_up, reduced_paid_up, or on extended term with the date of death on or before the extended term expiry date. Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved. A death within contestability_period_years of the issue date, or of the reinstatement date for a reinstated policy, is approved only after contestable review, and a rescinded claim refunds premiums paid. Death by suicide within suicide_exclusion_years of the issue date pays only whole_msr_premiums_paid. Otherwise the gross proceeds are the face amount in force (the reduced or extended face where a nonforfeiture option applies, or the graded benefit during a graded period), plus paid-up additions face, plus dividend accumulations, less the loan balance and interest accrued to the date of death, less installments overdue at death, less any acceleration lien, plus premium paid for any period beyond the policy month of death. Interest is added to each payee's share at death_claim_interest_rate, simple, actual calendar days from the date of death to disbursement over 365, rounded to the cent. Disbursement proceeds only while the policy status is death_claim_pending or claim_paid. Proceeds go to the surviving primary beneficiaries of the designation in effect at death by share; a predeceased primary's share passes pro rata to surviving primaries, then to contingents, then to the owner or the owner's estate. A minor's share, below minor_beneficiary_age, is paid only to a court-appointed guardian or UTMA custodian. A payee with a share of at least beneficiary_access_account_min may elect an Ashgrove Beneficiary Access Account.
  eligibility:
  - id: proof_and_approval
    applies_to:
    - whole_death_claim_paid
    - whole_death_benefit_disbursed
    kind: authorization
    condition: Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved.
    evidence_fields:
    - whole_service_requests.death_certificate_received
    - whole_service_requests.request_status
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
  - id: disbursement_status
    applies_to:
    - whole_death_benefit_disbursed
    - whole_tiadb_lien_settled
    kind: state
    condition: Disbursement proceeds only while the policy status is death_claim_pending or claim_paid.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - death_claim_pending
      - claim_paid
  params:
    contestability_period_years: =contestability_period_years
    suicide_exclusion_years: =suicide_exclusion_years
    death_claim_interest_rate: =death_claim_interest_rate
    minor_beneficiary_age: =minor_beneficiary_age
    beneficiary_access_account_min: =beneficiary_access_account_min
  measures:
  - whole_msr_premiums_paid
  formula:
    gross_proceeds: face_amount + pua_face_amount + dividend_accumulation_balance - loan_balance - premium_outstanding - tiadb_lien
- id: whole_beneficiary_designation
  subject:
  - whole_beneficiary_designated
  rule: The owner names primary and contingent beneficiaries. A beneficiary designation is recorded only while the policy status is applied, in_force, grace_period, paid_up, reduced_paid_up or extended_term. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. The new designation replaces the earlier one entirely and is effective on the owner's signature date if signed while the insured was living; Ashgrove is discharged for payments made before receipt. Shares are whole percents of at least beneficiary_min_share_pct totalling 100 in each class, with no more than beneficiary_max_primary primaries. No change is accepted after the insured's death.
  eligibility:
  - id: designation_status
    applies_to:
    - whole_beneficiary_designated
    kind: state
    condition: A beneficiary designation is recorded only while the policy status is applied, in_force, grace_period, paid_up, reduced_paid_up or extended_term.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - applied
      - in_force
      - grace_period
      - paid_up
      - reduced_paid_up
      - extended_term
  - id: signed_change_request
    applies_to:
    - whole_beneficiary_designated
    kind: authorization
    condition: A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary.
    evidence_fields:
    - whole_service_requests.request_type
    - whole_service_requests.signed_date
    - whole_service_requests.whole_request_id
    - whole_transactions.designation_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
  params:
    beneficiary_min_share_pct: =beneficiary_min_share_pct
    beneficiary_max_primary: =beneficiary_max_primary
- id: whole_free_look
  subject:
  - whole_free_look_cancelled
  - whole_premium_refunded
  rule: The owner may return a new policy for a full refund of all premium paid. The returned policy must be received no later than the policy delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time. When the sale replaced existing coverage, free_look_days_replacement replaces free_look_days. A policy issued by conversion of an Ashgrove term policy has no free-look right, because the term coverage it replaced cannot be restored.
  eligibility:
  - id: within_free_look
    applies_to:
    - whole_free_look_cancelled
    kind: time
    condition: The returned policy must be received no later than the policy delivery date plus free_look_days.
    evidence_fields:
    - whole_holdings.policy_delivery_date
    - whole_holdings.replacement_sale
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the policy delivery date
      anchor_source: whole_holdings.policy_delivery_date
      relation: not_after
      duration_source: variants.free_look_days
      unit: calendar_days
      counting_rule: The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time.
      boundary: inclusive
  params:
    free_look_days: =free_look_days
    free_look_days_replacement: =free_look_days_replacement
- id: whole_evt_waiver_of_premium
  subject:
  - whole_premium_waived
  rule: Where waiver_rider_available is true and the rider is attached, installments falling due on or after the disability onset date are waived while total disability continues, if the disability began before the anniversary at waiver_rider_expiry_age. A waiver is applied only when the claim decision date is not earlier than the disability onset date plus waiver_elimination_months. The elimination end is found by adding the number of calendar months to the disability onset date, falling back to the last day of the month when that day does not exist; a decision dated on the elimination end qualifies. Premiums are waived only under a waiver of premium claim whose request status is approved. Each installment is waived at most once, and installments for that period already paid are refunded. Waived premiums count as paid for dividends and cash values but not toward the cost basis.
  eligibility:
  - id: elimination_satisfied
    applies_to:
    - whole_premium_waived
    kind: time
    condition: A waiver is applied only when the claim decision date is not earlier than the disability onset date plus waiver_elimination_months.
    evidence_fields:
    - whole_service_requests.disability_onset_date
    - whole_service_requests.decision_date
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the disability onset date
      anchor_source: whole_service_requests.disability_onset_date
      relation: not_before
      duration_source: variants.waiver_elimination_months
      unit: calendar_months
      counting_rule: The elimination end is found by adding the number of calendar months to the disability onset date, falling back to the last day of the month when that day does not exist; a decision dated on the elimination end qualifies.
      boundary: inclusive
  - id: approved_waiver_claim
    applies_to:
    - whole_premium_waived
    kind: authorization
    condition: Premiums are waived only under a waiver of premium claim whose request status is approved.
    evidence_fields:
    - whole_service_requests.request_type
    - whole_service_requests.request_status
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
  - id: one_waiver_per_installment
    applies_to:
    - whole_premium_waived
    kind: dedup
    condition: Each installment is waived at most once, and installments for that period already paid are refunded.
    evidence_fields:
    - whole_transactions.whole_policy_id
    - whole_transactions.premium_due_date
    - whole_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_transactions.whole_policy_id
        - whole_transactions.premium_due_date
      action_bindings:
        whole_transactions.whole_policy_id: whole_policy_id
        whole_transactions.premium_due_date: premium_due_date
    dedup_contract:
      table: whole_transactions
      mode: separate_record
      object_bindings:
        whole_policy_id: whole_policy_id
        premium_due_date: premium_due_date
      duplicate_filters:
        event_type:
        - whole_premium_waived
      distinct_fields: []
  params:
    waiver_rider_available: =waiver_rider_available
    waiver_rider_max_issue_age: =waiver_rider_max_issue_age
    waiver_rider_expiry_age: =waiver_rider_expiry_age
    waiver_elimination_months: =waiver_elimination_months
- id: whole_evt_accelerated_benefit
  subject:
  - whole_tiadb_advance_paid
  rule: An insured certified to have a life expectancy of tiadb_life_expectancy_months or less may receive part of the death benefit in advance, once per policy. An acceleration is paid only while the policy status is in_force, paid_up or reduced_paid_up. An advance is paid only under an accelerated benefit claim whose request status is approved, which requires the written consent of every irrevocable beneficiary and assignee. The elected amount may not exceed the lower of tiadb_max_pct of the base face amount less the loan balance and tiadb_max_amount less whole_msr_tiadb_accelerated_on_insured. The amount paid is the elected amount reduced by tiadb_discount_rate and then by tiadb_admin_fee, rounded to the cent; the lien is the elected amount, bears no interest and is deducted from the death proceeds; premiums and dividends continue on the full face.
  eligibility:
  - id: acceleration_status
    applies_to:
    - whole_tiadb_advance_paid
    kind: state
    condition: An acceleration is paid only while the policy status is in_force, paid_up or reduced_paid_up.
    evidence_fields:
    - whole_holdings.status
    - whole_holdings.whole_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_holdings.whole_policy_id
      action_bindings:
        whole_holdings.whole_policy_id: whole_policy_id
    state_contract:
      field: whole_holdings.status
      allowed:
      - in_force
      - paid_up
      - reduced_paid_up
  - id: approved_acceleration_claim
    applies_to:
    - whole_tiadb_advance_paid
    kind: authorization
    condition: An advance is paid only under an accelerated benefit claim whose request status is approved, which requires the written consent of every irrevocable beneficiary and assignee.
    evidence_fields:
    - whole_service_requests.request_type
    - whole_service_requests.request_status
    - whole_service_requests.life_expectancy_months
    - whole_service_requests.whole_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - whole_service_requests.whole_request_id
      action_bindings:
        whole_service_requests.whole_request_id: whole_request_id
  params:
    tiadb_life_expectancy_months: =tiadb_life_expectancy_months
    tiadb_max_pct: =tiadb_max_pct
    tiadb_max_amount: =tiadb_max_amount
    tiadb_discount_rate: =tiadb_discount_rate
    tiadb_admin_fee: =tiadb_admin_fee
  measures:
  - whole_msr_tiadb_accelerated_on_insured
  formula:
    max_elected: min(tiadb_max_pct * face_amount - loan_balance, tiadb_max_amount - whole_msr_tiadb_accelerated_on_insured)
    net_advance: round(amount * (1 - tiadb_discount_rate) - tiadb_admin_fee, 2)
extended_policies:
- id: whole_ext_anniversary_interest_capitalization
  base_policy_refs:
  - whole_evt_loan_interest_and_repayment
  - whole_evt_policy_loan
  overwrite:
  - base_policy: whole_evt_policy_loan
    superseded_clause: Interest accrues at loan_interest_rate, simple, for actual calendar days over 365, and is due on each anniversary.
    replaced_by: 'The annual rate at which an anniversary capitalization charges interest is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
  - base_policy: whole_evt_loan_interest_and_repayment
    superseded_clause: interest not paid by the anniversary is capitalized into the loan principal on that anniversary and itself bears interest
    replaced_by: 'Loan interest for the interest period that a policy anniversary closes is billed on that anniversary; where the owner has not paid it within interest_billing_days calendar days after the anniversary, it is capitalized: it is added to the loan principal as a single capitalization entry dated that anniversary, and the capitalized amount bears interest from the anniversary like the rest of the principal.'
  trigger: state_due
  subject:
  - whole_loan_interest_capitalized
  computes: interest_amount
  target_tool: capitalize_loan_interest_55a34971
  params:
    series_rate_before_1990: 0.08
    series_rate_1990_to_2004: 0.07
    continuity_cut_30_years: 0.015
    continuity_cut_20_years: 0.0075
    continuity_months_30_years: 360
    continuity_months_20_years: 240
    months_per_year: 12
    days_per_year: 365
    advance_quiet_days: 30
    interest_billing_days: 31
    days_per_year_360: 360
  rule: 'Loan interest for the interest period that a policy anniversary closes is billed on that anniversary; where the owner has not paid it within interest_billing_days calendar days after the anniversary, it is capitalized: it is added to the loan principal as a single capitalization entry dated that anniversary, and the capitalized amount bears interest from the anniversary like the rest of the principal. The interest capitalized at an anniversary is the loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, multiplied by the tier''s loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the anniversary over days_per_year, rounded half up to the cent. The annual rate at which an anniversary capitalization charges interest is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate. The series rate of an anniversary capitalization is reduced for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction. The interest period that an anniversary capitalization closes starts on a date the policy ledger fixes: where the latest loan repayment on the ledger paid loan interest, falls on or before the anniversary, is later than the loan interest paid-to date shown and is no earlier than the anniversary of the latest capitalization entry, the period starts on that repayment''s date, because the repayment settled interest up to its own date; otherwise, where the anniversary of the latest capitalization entry is later than the loan interest paid-to date shown, the period starts on that anniversary; otherwise it starts on the loan interest paid-to date shown on the policy. Within an anniversary capitalization, the latest owner loan advance on the policy ledger, where it falls after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal: where it was made more than advance_quiet_days calendar days before the anniversary it bears interest from its own advance date; where it was made within advance_quiet_days calendar days before the anniversary it bears no interest for the period and is charged from the anniversary onward; where the latest owner advance does not fall inside the interest period, nothing is set apart for it and the whole loan principal bears interest from the period start. Within an anniversary capitalization, the latest automatic premium loan on the policy ledger, where it was booked after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal as well: on a policy paying by monthly EFT draft it bears interest from the due date of the draft it paid, because an automatic premium loan is dated back to the installment it pays; on a policy billed on any other mode it bears interest from the date it was booked, the last day of grace; where the latest automatic premium loan does not fall inside the interest period, nothing is set apart for it. The part of a year for which an anniversary capitalization charges each piece of principal follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the date that piece starts bearing interest to the anniversary over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year. The interest capitalized is that rate multiplied by the sum of three products: that ledger loan principal less any owner advance and any automatic premium loan set apart, times its part of a year from the period start; the owner advance set apart, times its part of a year from the date it starts bearing interest; and the automatic premium loan set apart, times its part of a year from the date it starts bearing interest; the total is rounded half up to the cent once, at the end.'
  prerequisite: []
  cross_category:
  - category: term
    as: branch
    reads:
    - issue_date
    note: The continuity reduction counts coverage from the issue date of the Ashgrove term policy converted into this policy, read from that term holding.
  compute:
  - anniversary: F('values_as_of_date')
  - paid_to: F('loan_interest_paid_to_date')
  - issue_days_from_1990: DAYS('1990-01-01', F('issue_date'))
  - issue_days_from_2005: DAYS('2005-01-01', F('issue_date'))
  - series_rate: K('series_rate_before_1990') if issue_days_from_1990 < 0 else (K('series_rate_1990_to_2004') if issue_days_from_2005 < 0 else P('loan_interest_rate'))
  - converted_term_issue: CFIELD('term', 'issue_date', term_policy_id=F('converted_from_term_policy_id'))
  - coverage_months: MONTHS(converted_term_issue or F('issue_date'), anniversary)
  - continuity_cut: K('continuity_cut_30_years') if (coverage_months >= K('continuity_months_30_years') and not F('reinstatement_date')) else (K('continuity_cut_20_years') if (coverage_months >= K('continuity_months_20_years') and not F('reinstatement_date')) else 0)
  - rate: series_rate - continuity_cut
  - repayment_date: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_loan_repaid') or ''
  - repayment_interest: LATEST('whole_transactions', 'interest_amount', date_field='transaction_date', event_type='whole_loan_repaid') or 0
  - capitalization_end: LATEST('whole_transactions', 'interest_period_end', date_field='interest_period_end', event_type='whole_loan_interest_capitalized') or ''
  - period_start: repayment_date if (repayment_date > paid_to and repayment_date >= capitalization_end and repayment_date <= anniversary and float(repayment_interest) > 0) else (capitalization_end if capitalization_end > paid_to else paid_to)
  - advance_date: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_loan_advanced', loan_purpose='owner_request') or ''
  - advance_amount: LATEST('whole_transactions', 'amount', date_field='transaction_date', event_type='whole_loan_advanced', loan_purpose='owner_request') or 0
  - advance_set_apart: float(advance_amount) if (advance_date > period_start and advance_date <= anniversary) else 0
  - advance_from: advance_date if (advance_set_apart > 0 and DAYS(advance_date, anniversary) > K('advance_quiet_days')) else (anniversary if advance_set_apart > 0 else period_start)
  - apl_booked: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_loan_advanced', loan_purpose='automatic_premium_loan') or ''
  - apl_due: LATEST('whole_transactions', 'premium_due_date', date_field='transaction_date', event_type='whole_loan_advanced', loan_purpose='automatic_premium_loan') or ''
  - apl_amount: LATEST('whole_transactions', 'amount', date_field='transaction_date', event_type='whole_loan_advanced', loan_purpose='automatic_premium_loan') or 0
  - apl_set_apart: float(apl_amount) if (apl_booked > period_start and apl_booked <= anniversary) else 0
  - apl_from: apl_due if (apl_set_apart > 0 and F('premium_mode') == 'monthly_eft') else (apl_booked if apl_set_apart > 0 else period_start)
  - issue_days_from_1985: DAYS('1985-01-01', F('issue_date'))
  - main_part: MONTHS(period_start, anniversary) / K('months_per_year') if issue_days_from_1985 < 0 else (DAYS(period_start, anniversary) / K('days_per_year_360') if issue_days_from_2005 < 0 else DAYS(period_start, anniversary) / K('days_per_year'))
  - advance_part: MONTHS(advance_from, anniversary) / K('months_per_year') if issue_days_from_1985 < 0 else (DAYS(advance_from, anniversary) / K('days_per_year_360') if issue_days_from_2005 < 0 else DAYS(advance_from, anniversary) / K('days_per_year'))
  - apl_part: MONTHS(apl_from, anniversary) / K('months_per_year') if issue_days_from_1985 < 0 else (DAYS(apl_from, anniversary) / K('days_per_year_360') if issue_days_from_2005 < 0 else DAYS(apl_from, anniversary) / K('days_per_year'))
  - ledger_principal: SUM('whole_transactions', 'amount', event_type='whole_loan_advanced') + SUM('whole_transactions', 'amount', event_type='whole_loan_interest_capitalized') - SUM('whole_transactions', 'amount', event_type='whole_loan_repaid') - SUM('whole_transactions', 'amount', event_type='whole_loan_offset')
  - principal_from_start: ledger_principal - advance_set_apart - apl_set_apart
  - result: RND(rate * (principal_from_start * main_part + advance_set_apart * advance_part + apl_set_apart * apl_part), 2)
  compute_basis:
    anniversary: 'Loan interest for the interest period that a policy anniversary closes is billed on that anniversary; where the owner has not paid it within interest_billing_days calendar days after the anniversary, it is capitalized: it is added to the loan principal as a single capitalization entry dated that anniversary, and the capitalized amount bears interest from the anniversary like the rest of the principal.'
    paid_to: The interest capitalized at an anniversary is the loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, multiplied by the tier's loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the anniversary over days_per_year, rounded half up to the cent.
    issue_days_from_1990: 'The annual rate at which an anniversary capitalization charges interest is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
    issue_days_from_2005: 'The annual rate at which an anniversary capitalization charges interest is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
    series_rate: 'The annual rate at which an anniversary capitalization charges interest is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
    converted_term_issue: 'The series rate of an anniversary capitalization is reduced for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    coverage_months: 'The series rate of an anniversary capitalization is reduced for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    continuity_cut: 'The series rate of an anniversary capitalization is reduced for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    rate: 'The series rate of an anniversary capitalization is reduced for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    repayment_date: 'The interest period that an anniversary capitalization closes starts on a date the policy ledger fixes: where the latest loan repayment on the ledger paid loan interest, falls on or before the anniversary, is later than the loan interest paid-to date shown and is no earlier than the anniversary of the latest capitalization entry, the period starts on that repayment''s date, because the repayment settled interest up to its own date; otherwise, where the anniversary of the latest capitalization entry is later than the loan interest paid-to date shown, the period starts on that anniversary; otherwise it starts on the loan interest paid-to date shown on the policy.'
    repayment_interest: 'The interest period that an anniversary capitalization closes starts on a date the policy ledger fixes: where the latest loan repayment on the ledger paid loan interest, falls on or before the anniversary, is later than the loan interest paid-to date shown and is no earlier than the anniversary of the latest capitalization entry, the period starts on that repayment''s date, because the repayment settled interest up to its own date; otherwise, where the anniversary of the latest capitalization entry is later than the loan interest paid-to date shown, the period starts on that anniversary; otherwise it starts on the loan interest paid-to date shown on the policy.'
    capitalization_end: 'The interest period that an anniversary capitalization closes starts on a date the policy ledger fixes: where the latest loan repayment on the ledger paid loan interest, falls on or before the anniversary, is later than the loan interest paid-to date shown and is no earlier than the anniversary of the latest capitalization entry, the period starts on that repayment''s date, because the repayment settled interest up to its own date; otherwise, where the anniversary of the latest capitalization entry is later than the loan interest paid-to date shown, the period starts on that anniversary; otherwise it starts on the loan interest paid-to date shown on the policy.'
    period_start: 'The interest period that an anniversary capitalization closes starts on a date the policy ledger fixes: where the latest loan repayment on the ledger paid loan interest, falls on or before the anniversary, is later than the loan interest paid-to date shown and is no earlier than the anniversary of the latest capitalization entry, the period starts on that repayment''s date, because the repayment settled interest up to its own date; otherwise, where the anniversary of the latest capitalization entry is later than the loan interest paid-to date shown, the period starts on that anniversary; otherwise it starts on the loan interest paid-to date shown on the policy.'
    advance_date: 'Within an anniversary capitalization, the latest owner loan advance on the policy ledger, where it falls after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal: where it was made more than advance_quiet_days calendar days before the anniversary it bears interest from its own advance date; where it was made within advance_quiet_days calendar days before the anniversary it bears no interest for the period and is charged from the anniversary onward; where the latest owner advance does not fall inside the interest period, nothing is set apart for it and the whole loan principal bears interest from the period start.'
    advance_amount: 'Within an anniversary capitalization, the latest owner loan advance on the policy ledger, where it falls after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal: where it was made more than advance_quiet_days calendar days before the anniversary it bears interest from its own advance date; where it was made within advance_quiet_days calendar days before the anniversary it bears no interest for the period and is charged from the anniversary onward; where the latest owner advance does not fall inside the interest period, nothing is set apart for it and the whole loan principal bears interest from the period start.'
    advance_set_apart: 'Within an anniversary capitalization, the latest owner loan advance on the policy ledger, where it falls after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal: where it was made more than advance_quiet_days calendar days before the anniversary it bears interest from its own advance date; where it was made within advance_quiet_days calendar days before the anniversary it bears no interest for the period and is charged from the anniversary onward; where the latest owner advance does not fall inside the interest period, nothing is set apart for it and the whole loan principal bears interest from the period start.'
    advance_from: 'Within an anniversary capitalization, the latest owner loan advance on the policy ledger, where it falls after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal: where it was made more than advance_quiet_days calendar days before the anniversary it bears interest from its own advance date; where it was made within advance_quiet_days calendar days before the anniversary it bears no interest for the period and is charged from the anniversary onward; where the latest owner advance does not fall inside the interest period, nothing is set apart for it and the whole loan principal bears interest from the period start.'
    apl_booked: 'Within an anniversary capitalization, the latest automatic premium loan on the policy ledger, where it was booked after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal as well: on a policy paying by monthly EFT draft it bears interest from the due date of the draft it paid, because an automatic premium loan is dated back to the installment it pays; on a policy billed on any other mode it bears interest from the date it was booked, the last day of grace; where the latest automatic premium loan does not fall inside the interest period, nothing is set apart for it.'
    apl_due: 'Within an anniversary capitalization, the latest automatic premium loan on the policy ledger, where it was booked after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal as well: on a policy paying by monthly EFT draft it bears interest from the due date of the draft it paid, because an automatic premium loan is dated back to the installment it pays; on a policy billed on any other mode it bears interest from the date it was booked, the last day of grace; where the latest automatic premium loan does not fall inside the interest period, nothing is set apart for it.'
    apl_amount: 'Within an anniversary capitalization, the latest automatic premium loan on the policy ledger, where it was booked after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal as well: on a policy paying by monthly EFT draft it bears interest from the due date of the draft it paid, because an automatic premium loan is dated back to the installment it pays; on a policy billed on any other mode it bears interest from the date it was booked, the last day of grace; where the latest automatic premium loan does not fall inside the interest period, nothing is set apart for it.'
    apl_set_apart: 'Within an anniversary capitalization, the latest automatic premium loan on the policy ledger, where it was booked after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal as well: on a policy paying by monthly EFT draft it bears interest from the due date of the draft it paid, because an automatic premium loan is dated back to the installment it pays; on a policy billed on any other mode it bears interest from the date it was booked, the last day of grace; where the latest automatic premium loan does not fall inside the interest period, nothing is set apart for it.'
    apl_from: 'Within an anniversary capitalization, the latest automatic premium loan on the policy ledger, where it was booked after the start of the interest period and on or before the anniversary, is set apart from the rest of the principal as well: on a policy paying by monthly EFT draft it bears interest from the due date of the draft it paid, because an automatic premium loan is dated back to the installment it pays; on a policy billed on any other mode it bears interest from the date it was booked, the last day of grace; where the latest automatic premium loan does not fall inside the interest period, nothing is set apart for it.'
    main_part: 'The part of a year for which an anniversary capitalization charges each piece of principal follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the date that piece starts bearing interest to the anniversary over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year.'
    advance_part: 'The part of a year for which an anniversary capitalization charges each piece of principal follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the date that piece starts bearing interest to the anniversary over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year.'
    apl_part: 'The part of a year for which an anniversary capitalization charges each piece of principal follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the date that piece starts bearing interest to the anniversary over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year.'
    ledger_principal: The interest capitalized at an anniversary is the loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, multiplied by the tier's loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the anniversary over days_per_year, rounded half up to the cent.
    principal_from_start: 'The interest capitalized is that rate multiplied by the sum of three products: that ledger loan principal less any owner advance and any automatic premium loan set apart, times its part of a year from the period start; the owner advance set apart, times its part of a year from the date it starts bearing interest; and the automatic premium loan set apart, times its part of a year from the date it starts bearing interest; the total is rounded half up to the cent once, at the end.'
    result: 'The interest capitalized is that rate multiplied by the sum of three products: that ledger loan principal less any owner advance and any automatic premium loan set apart, times its part of a year from the period start; the owner advance set apart, times its part of a year from the date it starts bearing interest; and the automatic premium loan set apart, times its part of a year from the date it starts bearing interest; the total is rounded half up to the cent once, at the end.'
    issue_days_from_1985: 'The part of a year for which an anniversary capitalization charges each piece of principal follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the date that piece starts bearing interest to the anniversary over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year.'
  factors:
  - id: policy_series_rate
    effect: parameter
    decides: series_rate
    bindings:
    - issue_days_from_1990
    - issue_days_from_2005
    - series_rate
    ladder:
    - when: the policy was issued before January 1, 1990
      value: K('series_rate_before_1990')
    - when: the policy was issued from January 1, 1990 through December 31, 2004
      value: K('series_rate_1990_to_2004')
    - when: otherwise (issued on or after January 1, 2005)
      value: P('loan_interest_rate')
    baseline:
      series_rate: P('loan_interest_rate')
    evidence:
    - date
    cross_difficulty: null
  - id: continuous_coverage_reduction
    effect: parameter
    decides: continuity_cut
    bindings:
    - converted_term_issue
    - coverage_months
    - continuity_cut
    ladder:
    - when: whole months of continuous coverage (from the converted Ashgrove term policy's issue date, else this policy's) reach the 30-year count and the policy has never been reinstated
      value: K('continuity_cut_30_years')
    - when: the count reaches the 20-year count but not the 30-year count and the policy has never been reinstated
      value: K('continuity_cut_20_years')
    - when: otherwise
      value: '0'
    baseline:
      continuity_cut: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: term
  - id: interest_period_start
    effect: method
    decides: period_start
    bindings:
    - repayment_date
    - repayment_interest
    - capitalization_end
    - period_start
    ladder:
    - when: the latest loan repayment on the ledger paid interest, falls on or before the anniversary, is later than the paid-to date shown and no earlier than the latest capitalization anniversary
      method: the period starts on that repayment's date
    - when: that does not hold and the latest capitalization anniversary is later than the paid-to date shown
      method: the period starts on that capitalization anniversary
    - when: otherwise
      method: the period starts on the loan interest paid-to date shown on the policy
    baseline:
      period_start: paid_to
    evidence:
    - history
    cross_difficulty: null
  - id: late_owner_advance
    effect: method
    decides: advance_from
    bindings:
    - advance_date
    - advance_amount
    - advance_set_apart
    - advance_from
    ladder:
    - when: the latest owner advance on the ledger falls inside the interest period and more than advance_quiet_days days before the anniversary
      method: that advance bears interest from its own advance date
    - when: the latest owner advance falls inside the interest period and within advance_quiet_days days of the anniversary
      method: that advance bears no interest for the period
    - when: otherwise
      method: nothing is set apart; the whole principal runs from the period start
    baseline:
      advance_from: period_start
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: late_automatic_premium_loan
    effect: method
    decides: apl_from
    bindings:
    - apl_booked
    - apl_due
    - apl_amount
    - apl_set_apart
    - apl_from
    ladder:
    - when: the latest automatic premium loan on the ledger was booked inside the interest period on a policy paying by monthly EFT draft
      method: it bears interest from the due date of the draft it paid
    - when: it was booked inside the interest period on a policy billed on another mode
      method: it bears interest from its booking date, the last day of grace
    - when: otherwise
      method: nothing is set apart
    baseline:
      apl_from: period_start
    evidence:
    - history
    cross_difficulty: null
  - id: policy_form_accrual_convention
    effect: method
    decides: main_part
    bindings:
    - issue_days_from_1985
    - main_part
    - advance_part
    - apl_part
    ladder:
    - when: the policy was issued before January 1, 1985
      method: interest is charged for whole policy months over months_per_year; a part month is not charged
    - when: the policy was issued from January 1, 1985 through December 31, 2004
      method: interest is charged for actual calendar days over days_per_year_360
    - when: otherwise (issued on or after January 1, 2005)
      method: interest is charged for actual calendar days over days_per_year
    baseline:
      main_part: DAYS(period_start, anniversary) / K('days_per_year')
      advance_part: DAYS(advance_from, anniversary) / K('days_per_year')
      apl_part: DAYS(apl_from, anniversary) / K('days_per_year')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The interest capitalized at an anniversary is the loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, multiplied by the tier's loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the anniversary over days_per_year, rounded half up to the cent.
    params:
    - loan_interest_rate
    - days_per_year
  inputs:
    history:
    - table: whole_transactions
      aggregate: latest
      field: transaction_date
      filters:
        event_type: whole_loan_repaid
    - table: whole_transactions
      aggregate: latest
      field: interest_period_end
      filters:
        event_type: whole_loan_interest_capitalized
    - table: whole_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: whole_loan_advanced
    cross_category:
    - term
- id: whole_ext_offset_interest_extinguished
  base_policy_refs:
  - whole_evt_loan_interest_and_repayment
  - whole_death_claim
  - whole_evt_policy_loan
  - whole_reduced_paid_up_election
  overwrite:
  - base_policy: whole_evt_policy_loan
    superseded_clause: Interest accrues at loan_interest_rate, simple, for actual calendar days over 365, and is due on each anniversary.
    replaced_by: 'The annual rate at which interest is extinguished at a loan offset is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
  - base_policy: whole_evt_loan_interest_and_repayment
    superseded_clause: A loan is extinguished against the policy values on surrender, death, the application of a nonforfeiture option or loan default.
    replaced_by: When a policy loan is extinguished against the policy values on the insured's death, on the application of a nonforfeiture option or on loan default, the whole loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, is extinguished together with the loan interest accrued and unpaid on it, as one loan offset entry; a loan on a policy surrendered for cash is not extinguished by an offset entry, because the surrender payment itself deducts the loan and its interest.
  trigger: on_request
  subject:
  - whole_loan_offset
  computes: interest_amount
  target_tool: extinguish_policy_loan_1349795c
  params:
    series_rate_before_1990: 0.08
    series_rate_1990_to_2004: 0.07
    continuity_cut_30_years: 0.015
    continuity_cut_20_years: 0.0075
    continuity_months_30_years: 360
    continuity_months_20_years: 240
    months_per_year: 12
    days_per_year: 365
    days_per_year_360: 360
  rule: 'When a policy loan is extinguished against the policy values on the insured''s death, on the application of a nonforfeiture option or on loan default, the whole loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, is extinguished together with the loan interest accrued and unpaid on it, as one loan offset entry; a loan on a policy surrendered for cash is not extinguished by an offset entry, because the surrender payment itself deducts the loan and its interest. The interest extinguished with the loan at an offset is the ledger loan principal multiplied by the tier''s loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the date the offset is booked over days_per_year, rounded half up to the cent. The annual rate at which interest is extinguished at a loan offset is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate. The series rate at which interest is extinguished at a loan offset is reduced for long continuous coverage on the insured, counted in whole months to the date the offset is booked from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction. Interest extinguished at a loan offset runs from a date the policy ledger fixes: the anniversary of the latest capitalization entry, where it is later than the loan interest paid-to date shown and no earlier than the date of the latest loan repayment; otherwise the date of the latest loan repayment on the ledger, where that repayment paid loan interest and is later than the paid-to date shown; otherwise the loan interest paid-to date shown on the policy. Interest extinguished at a loan offset runs to the date the offset takes effect, which depends on the occasion shown in the records: where a death claim on the policy is on file, to the insured''s date of death; where none is on file and the policy is premium-paying with a paid-to date later than the date the offset is booked, to that paid-to date, the date a reduced paid-up or extended term option takes effect; otherwise to the date the offset is booked. The part of a year for which interest is extinguished at a loan offset follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the start of the interest to the date the offset takes effect over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year. The interest extinguished is the ledger loan principal multiplied by that rate and by that part of a year, rounded half up to the cent; the principal extinguished is that ledger loan principal. The interest extinguished at an offset is fixed only after the policy ledger carries a capitalization entry for the most recent policy anniversary on which loan interest was owed.'
  prerequisite:
  - problem: whole_ext_anniversary_interest_capitalization
    kind: value_input
    gate: interest_start
    form: state
    policy_source: The interest extinguished at an offset is fixed only after the policy ledger carries a capitalization entry for the most recent policy anniversary on which loan interest was owed.
    condition: whole_transactions carries a whole_loan_interest_capitalized row whose interest_period_end equals the most recent anniversary (whole_holdings.values_as_of_date) of a policy with a loan balance
    resolved_by: capitalize_loan_interest_55a34971
    effect: Once the anniversary capitalization is booked, the interest start moves to that anniversary and the loan balance shown includes the capitalized interest, so the interest extinguished is recomputed on the larger principal over the short period since the anniversary.
  cross_category:
  - category: term
    as: branch
    reads:
    - issue_date
    note: The continuity reduction counts coverage from the issue date of the Ashgrove term policy converted into this policy.
  compute:
  - booked: NOW
  - issue_days_from_1990: DAYS('1990-01-01', F('issue_date'))
  - issue_days_from_2005: DAYS('2005-01-01', F('issue_date'))
  - series_rate: K('series_rate_before_1990') if issue_days_from_1990 < 0 else (K('series_rate_1990_to_2004') if issue_days_from_2005 < 0 else P('loan_interest_rate'))
  - converted_term_issue: CFIELD('term', 'issue_date', term_policy_id=F('converted_from_term_policy_id'))
  - coverage_months: MONTHS(converted_term_issue or F('issue_date'), booked)
  - continuity_cut: K('continuity_cut_30_years') if (coverage_months >= K('continuity_months_30_years') and not F('reinstatement_date')) else (K('continuity_cut_20_years') if (coverage_months >= K('continuity_months_20_years') and not F('reinstatement_date')) else 0)
  - rate: series_rate - continuity_cut
  - paid_to: F('loan_interest_paid_to_date')
  - capitalization_end: LATEST('whole_transactions', 'interest_period_end', date_field='interest_period_end', event_type='whole_loan_interest_capitalized') or ''
  - repayment_date: LATEST('whole_transactions', 'transaction_date', date_field='transaction_date', event_type='whole_loan_repaid') or ''
  - repayment_interest: LATEST('whole_transactions', 'interest_amount', date_field='transaction_date', event_type='whole_loan_repaid') or 0
  - interest_start: capitalization_end if (capitalization_end > paid_to and capitalization_end >= repayment_date) else (repayment_date if (repayment_date > paid_to and float(repayment_interest) > 0) else paid_to)
  - date_of_death: LATEST('whole_service_requests', 'insured_date_of_death', date_field='received_date', request_type='death_claim') or ''
  - premium_paid_to: F('paid_to_date') or ''
  - interest_end: date_of_death if date_of_death else (premium_paid_to if (premium_paid_to > booked and (F('status') == 'in_force' or F('status') == 'grace_period')) else booked)
  - issue_days_from_1985: DAYS('1985-01-01', F('issue_date'))
  - year_part: MONTHS(interest_start, interest_end) / K('months_per_year') if issue_days_from_1985 < 0 else (DAYS(interest_start, interest_end) / K('days_per_year_360') if issue_days_from_2005 < 0 else DAYS(interest_start, interest_end) / K('days_per_year'))
  - ledger_principal: SUM('whole_transactions', 'amount', event_type='whole_loan_advanced') + SUM('whole_transactions', 'amount', event_type='whole_loan_interest_capitalized') - SUM('whole_transactions', 'amount', event_type='whole_loan_repaid') - SUM('whole_transactions', 'amount', event_type='whole_loan_offset')
  - result: RND(ledger_principal * rate * year_part, 2)
  compute_basis:
    booked: The interest extinguished with the loan at an offset is the ledger loan principal multiplied by the tier's loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the date the offset is booked over days_per_year, rounded half up to the cent.
    issue_days_from_1990: 'The annual rate at which interest is extinguished at a loan offset is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
    issue_days_from_2005: 'The annual rate at which interest is extinguished at a loan offset is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
    series_rate: 'The annual rate at which interest is extinguished at a loan offset is set by the policy series that the issue date falls in: a policy issued before January 1, 1990 is charged series_rate_before_1990; a policy issued from January 1, 1990 through December 31, 2004 is charged series_rate_1990_to_2004; a policy issued on or after January 1, 2005 is charged its tier''s loan_interest_rate.'
    converted_term_issue: 'The series rate at which interest is extinguished at a loan offset is reduced for long continuous coverage on the insured, counted in whole months to the date the offset is booked from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    coverage_months: 'The series rate at which interest is extinguished at a loan offset is reduced for long continuous coverage on the insured, counted in whole months to the date the offset is booked from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    continuity_cut: 'The series rate at which interest is extinguished at a loan offset is reduced for long continuous coverage on the insured, counted in whole months to the date the offset is booked from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    rate: 'The series rate at which interest is extinguished at a loan offset is reduced for long continuous coverage on the insured, counted in whole months to the date the offset is booked from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: the reduction is continuity_cut_30_years where the count is at least continuity_months_30_years and the policy has never been reinstated, continuity_cut_20_years where the count is at least continuity_months_20_years but below continuity_months_30_years and the policy has never been reinstated, and nothing otherwise; the rate charged is the series rate less the reduction.'
    paid_to: The interest extinguished with the loan at an offset is the ledger loan principal multiplied by the tier's loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the date the offset is booked over days_per_year, rounded half up to the cent.
    capitalization_end: 'Interest extinguished at a loan offset runs from a date the policy ledger fixes: the anniversary of the latest capitalization entry, where it is later than the loan interest paid-to date shown and no earlier than the date of the latest loan repayment; otherwise the date of the latest loan repayment on the ledger, where that repayment paid loan interest and is later than the paid-to date shown; otherwise the loan interest paid-to date shown on the policy.'
    repayment_date: 'Interest extinguished at a loan offset runs from a date the policy ledger fixes: the anniversary of the latest capitalization entry, where it is later than the loan interest paid-to date shown and no earlier than the date of the latest loan repayment; otherwise the date of the latest loan repayment on the ledger, where that repayment paid loan interest and is later than the paid-to date shown; otherwise the loan interest paid-to date shown on the policy.'
    repayment_interest: 'Interest extinguished at a loan offset runs from a date the policy ledger fixes: the anniversary of the latest capitalization entry, where it is later than the loan interest paid-to date shown and no earlier than the date of the latest loan repayment; otherwise the date of the latest loan repayment on the ledger, where that repayment paid loan interest and is later than the paid-to date shown; otherwise the loan interest paid-to date shown on the policy.'
    interest_start: 'Interest extinguished at a loan offset runs from a date the policy ledger fixes: the anniversary of the latest capitalization entry, where it is later than the loan interest paid-to date shown and no earlier than the date of the latest loan repayment; otherwise the date of the latest loan repayment on the ledger, where that repayment paid loan interest and is later than the paid-to date shown; otherwise the loan interest paid-to date shown on the policy.'
    date_of_death: 'Interest extinguished at a loan offset runs to the date the offset takes effect, which depends on the occasion shown in the records: where a death claim on the policy is on file, to the insured''s date of death; where none is on file and the policy is premium-paying with a paid-to date later than the date the offset is booked, to that paid-to date, the date a reduced paid-up or extended term option takes effect; otherwise to the date the offset is booked.'
    premium_paid_to: 'Interest extinguished at a loan offset runs to the date the offset takes effect, which depends on the occasion shown in the records: where a death claim on the policy is on file, to the insured''s date of death; where none is on file and the policy is premium-paying with a paid-to date later than the date the offset is booked, to that paid-to date, the date a reduced paid-up or extended term option takes effect; otherwise to the date the offset is booked.'
    interest_end: 'Interest extinguished at a loan offset runs to the date the offset takes effect, which depends on the occasion shown in the records: where a death claim on the policy is on file, to the insured''s date of death; where none is on file and the policy is premium-paying with a paid-to date later than the date the offset is booked, to that paid-to date, the date a reduced paid-up or extended term option takes effect; otherwise to the date the offset is booked.'
    year_part: 'The part of a year for which interest is extinguished at a loan offset follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the start of the interest to the date the offset takes effect over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year.'
    ledger_principal: When a policy loan is extinguished against the policy values on the insured's death, on the application of a nonforfeiture option or on loan default, the whole loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, is extinguished together with the loan interest accrued and unpaid on it, as one loan offset entry; a loan on a policy surrendered for cash is not extinguished by an offset entry, because the surrender payment itself deducts the loan and its interest.
    result: The interest extinguished is the ledger loan principal multiplied by that rate and by that part of a year, rounded half up to the cent; the principal extinguished is that ledger loan principal.
    issue_days_from_1985: 'The part of a year for which interest is extinguished at a loan offset follows the loan-interest accrual convention printed in the policy form, which the issue date sets: a policy issued before January 1, 1985 accrues by whole policy months, the whole months from the start of the interest to the date the offset takes effect over months_per_year, a remaining part month not being charged; a policy issued from January 1, 1985 through December 31, 2004 accrues on a 360-day year, the actual calendar days over days_per_year_360; a policy issued on or after January 1, 2005 accrues on a 365-day year, the actual calendar days over days_per_year.'
  factors:
  - id: offset_policy_series_rate
    effect: parameter
    decides: series_rate
    bindings:
    - issue_days_from_1990
    - issue_days_from_2005
    - series_rate
    ladder:
    - when: the policy was issued before January 1, 1990
      value: K('series_rate_before_1990')
    - when: the policy was issued from January 1, 1990 through December 31, 2004
      value: K('series_rate_1990_to_2004')
    - when: otherwise (issued on or after January 1, 2005)
      value: P('loan_interest_rate')
    baseline:
      series_rate: P('loan_interest_rate')
    evidence:
    - date
    cross_difficulty: null
  - id: offset_continuous_coverage_reduction
    effect: parameter
    decides: continuity_cut
    bindings:
    - converted_term_issue
    - coverage_months
    - continuity_cut
    ladder:
    - when: whole months of continuous coverage to the offset (from the converted Ashgrove term policy's issue date, else this policy's) reach the 30-year count and the policy has never been reinstated
      value: K('continuity_cut_30_years')
    - when: the count reaches the 20-year count but not the 30-year count and the policy has never been reinstated
      value: K('continuity_cut_20_years')
    - when: otherwise
      value: '0'
    baseline:
      continuity_cut: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: term
  - id: offset_interest_start
    effect: method
    decides: interest_start
    bindings:
    - capitalization_end
    - repayment_date
    - repayment_interest
    - interest_start
    ladder:
    - when: the latest capitalization anniversary is later than the paid-to date shown and no earlier than the latest loan repayment
      method: interest runs from that capitalization anniversary
    - when: that does not hold and the latest loan repayment paid interest and is later than the paid-to date shown
      method: interest runs from that repayment's date
    - when: otherwise
      method: interest runs from the loan interest paid-to date shown on the policy
    baseline:
      interest_start: paid_to
    evidence:
    - history
    cross_difficulty: null
  - id: offset_effective_date
    effect: method
    decides: interest_end
    bindings:
    - date_of_death
    - premium_paid_to
    - interest_end
    ladder:
    - when: a death claim on the policy is on file
      method: interest runs to the insured's date of death
    - when: no death claim is on file and the policy is premium-paying with a paid-to date later than the booking date
      method: interest runs to the paid-to date
    - when: otherwise
      method: interest runs to the date the offset is booked
    baseline:
      interest_end: booked
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: offset_policy_form_accrual_convention
    effect: method
    decides: year_part
    bindings:
    - issue_days_from_1985
    - year_part
    ladder:
    - when: the policy was issued before January 1, 1985
      method: interest is extinguished for whole policy months over months_per_year; a part month is not charged
    - when: the policy was issued from January 1, 1985 through December 31, 2004
      method: interest is extinguished for actual calendar days over days_per_year_360
    - when: otherwise (issued on or after January 1, 2005)
      method: interest is extinguished for actual calendar days over days_per_year
    baseline:
      year_part: DAYS(interest_start, interest_end) / K('days_per_year')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The interest extinguished with the loan at an offset is the ledger loan principal multiplied by the tier's loan_interest_rate, simple, for the actual calendar days from the loan interest paid-to date shown on the policy to the date the offset is booked over days_per_year, rounded half up to the cent.
    params:
    - loan_interest_rate
    - days_per_year
  inputs:
    history:
    - table: whole_transactions
      aggregate: latest
      field: interest_period_end
      filters:
        event_type: whole_loan_interest_capitalized
    - table: whole_service_requests
      aggregate: latest
      field: insured_date_of_death
