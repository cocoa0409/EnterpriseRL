    deposited_12m: 'Money that moved through the deposit in the 12 calendar months before the day the credit is processed earns interest for half a year: where accumulation withdrawals are dated within those 12 months, the amounts withdrawn are credited for half a year, that is their total times credit_half_year is added to the balance the rate applies to; where no withdrawal is so dated but dividend deposit entries are, those deposits are credited for half a year the same way; otherwise only the balance shown is credited.'
