    - when: it is at least credit_band_floor_mid but below credit_band_floor_high
      value: K('credit_band_increment_mid')
    - when: otherwise
      value: '0'
    baseline:
      band_increment: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: credit_long_deposit_increment
    effect: parameter
    decides: deposit_increment
    bindings:
    - deposit_count
    - deposit_increment
    ladder:
    - when: credit_deposit_count_long or more dividend deposit entries
      value: K('credit_deposit_increment_long')
    - when: credit_deposit_count_mid or more but fewer than credit_deposit_count_long
      value: K('credit_deposit_increment_mid')
    - when: otherwise
