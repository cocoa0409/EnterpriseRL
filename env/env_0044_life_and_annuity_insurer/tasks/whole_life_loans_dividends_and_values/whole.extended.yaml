  trigger: state_due
  subject:
  - whole_dividend_accumulated
  computes: deposit_amount
  target_tool: deposit_anniversary_dividend_704bd37e
  params:
    deposit_size_floor_high: 250000
    deposit_size_floor_mid: 100000
    deposit_size_increment_high: 0.04
    deposit_size_increment_mid: 0.02
    deposit_persistency_cut_two: 0.1
    deposit_persistency_cut_one: 0.05
    deposit_duration_increment_30: 0.03
    deposit_duration_increment_20: 0.015
    deposit_duration_months_30: 360
    deposit_duration_months_20: 240
    deposit_additions_seasoning_months: 36
  rule: 'Under the accumulate option, the dividend declared on a policy anniversary is placed on deposit with Ashgrove as one dividend deposit entry dated that anniversary for the policy year the dividend is paid for. The amount placed on deposit is the most recent dividend declared on the policy ledger. The declared dividend is earned by the base face, and paid-up additions earn a dividend of their own, apportioned by a method that depends on how long the additions have been in force: where at least one paid-up addition on the policy ledger was bought more than deposit_additions_seasoning_months calendar months before the deposit is processed, the additions dividend is apportioned by face, the declared dividend divided by the base face and multiplied by the paid-up additions face that the purchase entries total; where every addition on the ledger was bought within those deposit_additions_seasoning_months months, the additions dividend is apportioned by reserve, the declared dividend divided by the guaranteed cash value and multiplied by the paid-up additions cash value; where the ledger shows no paid-up additions, there is no additions dividend. The dividend placed on deposit is raised for a large policy, judged by the base face plus the paid-up additions face that the purchase entries total: by deposit_size_increment_high where that total is at least deposit_size_floor_high, by deposit_size_increment_mid where it is at least deposit_size_floor_mid but below deposit_size_floor_high, and not at all where it is below deposit_size_floor_mid. The dividend placed on deposit is lowered for interrupted premium payment, judged by the premium payments returned unpaid on the policy ledger and dated within the 12 calendar months before the day the deposit is processed: by deposit_persistency_cut_two where there are two or more, by deposit_persistency_cut_one where there is exactly one, and not at all where there is none. The dividend placed on deposit is raised for long continuous coverage on the insured, counted in whole months to the anniversary from the issue date of the Ashgrove term policy converted into this policy, or from this policy''s own issue date when it was not issued by conversion: by deposit_duration_increment_30 where the count is at least deposit_duration_months_30 and the policy has never been reinstated, by deposit_duration_increment_20 where it is at least deposit_duration_months_20 but below deposit_duration_months_30 and the policy has never been reinstated, and not at all otherwise. The amount placed on deposit is the declared dividend plus the additions dividend, multiplied by one plus the size increase plus the duration increase less the persistency reduction, rounded half up to the cent once, at the end. A dividend is placed on deposit at an anniversary only after the interest credit for the policy year that anniversary closes stands on the accumulation ledger.'
  prerequisite:
  - problem: whole_ext_accumulation_interest_credit
    kind: state_gate
    gate: whole_transactions.interest_period_end
    form: state
    policy_source: A dividend is placed on deposit at an anniversary only after the interest credit for the policy year that anniversary closes stands on the accumulation ledger.
    condition: whole_transactions carries a whole_accumulation_interest_credited row whose interest_period_end equals the most recent anniversary (whole_holdings.values_as_of_date)
    resolved_by: credit_accumulation_interest_b6da2e99
    effect: Once the closed year's interest credit stands, the anniversary deposit may be booked; the credit is then computed on the deposit as it stood through the closed year, without the new dividend in its balance or deposit count.
  cross_category:
  - category: term
    as: branch
    reads:
    - issue_date
    note: The duration increase counts continuous coverage from the issue date of the Ashgrove term policy converted into this policy.
  compute:
  - declared: float(LATEST('whole_transactions', 'amount', date_field='transaction_date', event_type='whole_dividend_declared') or 0)
  - base_face: F('face_amount')
  - additions_face: SUM('whole_transactions', 'amount', event_type='whole_dividend_purchased_pua')
  - additions_purchases: COUNT('whole_transactions', event_type='whole_dividend_purchased_pua')
  - additions_recent: COUNT('whole_transactions', within_months=K('deposit_additions_seasoning_months'), date_field='transaction_date', event_type='whole_dividend_purchased_pua')
  - additions_dividend: declared / base_face * additions_face if (additions_purchases > 0 and additions_recent < additions_purchases) else (declared / F('guaranteed_cash_value') * F('pua_cash_value') if additions_purchases > 0 else 0)
  - policy_total_face: base_face + SUM('whole_transactions', 'amount', event_type='whole_dividend_purchased_pua')
  - size_increment: K('deposit_size_increment_high') if policy_total_face >= K('deposit_size_floor_high') else (K('deposit_size_increment_mid') if policy_total_face >= K('deposit_size_floor_mid') else 0)
  - returned_12m: COUNT('whole_transactions', within_months=12, date_field='transaction_date', event_type='whole_premium_payment_returned')
  - persistency_cut: K('deposit_persistency_cut_two') if returned_12m >= 2 else (K('deposit_persistency_cut_one') if returned_12m == 1 else 0)
  - converted_term_issue: CFIELD('term', 'issue_date', term_policy_id=F('converted_from_term_policy_id'))
  - coverage_months: MONTHS(converted_term_issue or F('issue_date'), F('values_as_of_date'))
  - duration_increment: K('deposit_duration_increment_30') if (coverage_months >= K('deposit_duration_months_30') and not F('reinstatement_date')) else (K('deposit_duration_increment_20') if (coverage_months >= K('deposit_duration_months_20') and not F('reinstatement_date')) else 0)
  - result: RND((declared + additions_dividend) * (1 + size_increment + duration_increment - persistency_cut), 2)
