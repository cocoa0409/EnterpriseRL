    - history
    cross_difficulty: null
  - id: credit_loan_activity_reduction
    effect: parameter
    decides: loan_cut
    bindings:
    - advances_24m
    - loan_cut
    ladder:
    - when: two or more loan advances dated within the 24 calendar months before the day the credit is processed
