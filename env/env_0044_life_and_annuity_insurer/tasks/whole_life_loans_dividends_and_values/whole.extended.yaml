  factors:
  - id: surrender_termination_dividend_scale
    effect: parameter
    decides: termination_rate
    bindings:
    - converted_term_issue
    - coverage_months
    - termination_rate
    ladder:
    - when: whole months of continuous coverage to the effective date (from the converted Ashgrove term policy's issue date, else this policy's) reach the 30-year count and the policy has never been reinstated
      value: K('surrender_termination_rate_30')
    - when: they reach the 20-year count but not the 30-year count and the policy has never been reinstated
      value: K('surrender_termination_rate_20')
    - when: otherwise
      value: '0'
    baseline:
      termination_rate: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: term
  - id: surrender_premium_record_cut
    effect: parameter
    decides: record_share
    bindings:
    - returned_24m
    - record_share
    ladder:
    - when: two or more premium payments returned unpaid within the 24 calendar months before the day the surrender is processed
      value: K('surrender_record_share_two')
    - when: exactly one
      value: K('surrender_record_share_one')
    - when: otherwise
      value: '1'
    baseline:
      record_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: unearned_premium_refund
    effect: method
    decides: premium_refund
    bindings:
    - months_prepaid
    - premium_refund
    ladder:
    - when: the policy is billed quarterly or semiannually
      method: whole months from the effective date to the paid-to date times the installment over the months in its period
    - when: the policy is billed annually
      method: whole months to the paid-to date times the annual premium less the policy fee, over months_in_year
    - when: otherwise (monthly EFT)
      method: nothing is refunded
    baseline:
      premium_refund: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: surrender_accrual_start
    effect: method
    decides: accrual_start
    bindings:
    - last_withdrawal
    - last_deposit
    - accrual_start
    ladder:
    - when: an accumulation withdrawal is dated after the most recent anniversary
      method: accumulation interest runs from the latest such withdrawal
    - when: no withdrawal but a dividend deposit entry is dated after the most recent anniversary
      method: accumulation interest runs from the latest such deposit
    - when: otherwise
      method: accumulation interest runs from the most recent anniversary
    baseline:
      accrual_start: anniversary
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The net cash surrender value is the gross cash value, which is the guaranteed cash value and the paid-up additions cash value from the most recent anniversary statement plus the dividend accumulation balance shown on the policy plus simple interest on that balance at dividend_accumulation_rate for the actual calendar days from the most recent anniversary to the surrender effective date over days_in_year, less the loan indebtedness and less federal withholding at federal_withholding_default_pct of the taxable amount, which is that gross cash value less the cost basis and never below zero, unless the owner elected no withholding on the request; it is rounded half up to the cent. The loan indebtedness deducted at a surrender is settled inside the surrender payment: its interest runs from the loan interest start, which is the date of the latest loan repayment on the policy ledger where that repayment paid loan interest and is later than the loan interest paid-to date shown, and otherwise that paid-to date; the principal owed is the loan principal as the policy ledger totals it, that is the loan advances and capitalized interest less the principal repaid and extinguished, less the latest capitalization entry where its anniversary is later than the loan interest start, because interest after that start is charged here instead and is never charged twice; and the indebtedness is that principal owed plus simple interest on it at the tier''s loan_interest_rate for the actual calendar days from the loan interest start to the surrender effective date over days_in_year, the interest rounded half up to the cent.'
    params:
    - dividend_accumulation_rate
    - federal_withholding_default_pct
    - loan_interest_rate
  inputs:
    history:
    - table: whole_transactions
      aggregate: count
      field: whole_txn_id
      within_months: 24
      filters:
        event_type: whole_premium_payment_returned
    - table: whole_transactions
      aggregate: latest
      field: transaction_date
      filters:
        event_type: whole_accumulation_withdrawn
    - table: whole_service_requests
      aggregate: latest
      field: received_date
      filters:
        request_type: surrender
    cross_category:
    - term
