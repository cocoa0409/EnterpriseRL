name: env_0045_vacation_rental_platform
company: Roamhaven, Inc.

background: |
  Roamhaven is a US short-term vacation rental marketplace that connects travelers with independent hosts and small hospitality businesses renting out rooms, suites, apartments, homes and luxury villas.
  Founded in Austin in 2014, it carries about 410,000 active listings and serves roughly 9 million guests a year, and its host and guest support teams in Austin, Denver and Mexico City speak in a warm, plain, hospitality-first voice.
  Guests hold Stays, reservations booked against one listing for a run of nights, and each stay is booked under one cancellation policy: Flexible, Moderate, Limited, Firm, Strict, Super Strict 30 Days, Super Strict 60 Days, or Long-Term for month-long stays.
  Every stay freezes its price breakdown at booking (nightly subtotal, cleaning, pet and extra-guest fees, guest service fee and occupancy tax), and its collections, refunds, change requests and reviews are booked as it moves from request through check-in to completion or cancellation.
  Hosts hold Listings, each classed by space type as a Shared Room, Private Room, Entire Guest Suite, Entire Apartment, Entire Home or Luxury Villa, and each carrying the host's own nightly rate, cleaning fee, discounts, chosen cancellation policy and local registration number.
  Fee changes, calendar blocks, quarterly quality assessments and jurisdiction notices are logged against each listing.
  Every host has one Host Account in a host tier (Starter Host, Standard Host, Superhost, Professional Host, Professional Host Plus or Enterprise Partner) against which host service fees, host cancellations and their penalties, policy strikes, appeals, Superhost assessments and tax forms are booked.
  Hosts are paid through Payout Methods on one of six rails (Direct Deposit (ACH), Fast Pay Debit Card, PayPal, Payoneer, International Wire Transfer or Western Union Cash Pickup), each carrying a running balance of released earnings, transfers, fees, withholding, deductions and credits.
  Every listing carries HostCover damage protection at one of six levels (HostCover Essential, HostCover Standard, HostCover Plus, HostCover Premier, HostCover Elite or HostCover Estate), and premiums, guest payment requests, guest payments, reimbursements and recoveries are booked against the plan as hosts file damage claims.
  Guests may join Roamhaven Rewards (Rewards Member, Rewards Silver, Rewards Gold, Rewards Platinum, Rewards Diamond and Rewards Ambassador) to earn and redeem credits on stays, and may insure a stay with Trip Protection underwritten by Harbor Mutual Travel Insurance Company (Trip Cancellation Only, Trip Protection Essential, Trip Protection Standard, Trip Protection Plus, Trip Protection Premier and Trip Protection Premier CFAR).
  Listings sit in six jurisdictions (Austin, Orange County around Orlando, Denver, Nashville, Honolulu and San Diego), where Roamhaven collects occupancy tax on stays and hosts register with the local authority.
  Callers are guests and hosts in roughly equal measure, and many people are both: a host who travels on Roamhaven, or a guest who rents out a spare room.
  A typical guest calls with one to several stays on file, often a Rewards membership and sometimes trip protection, and brings a history of bookings, collections, refunds, date changes and travel-issue reports.
  A typical host is an individual with one to three listings or a small property-management business with a few dozen, holding one host account, one or two payout methods and a HostCover plan per listing, with a history of stays hosted, fees withheld, payouts sent and returned, cancellations, penalties, strikes, appeals and damage claims.
  Most calls are about money that moved, or did not move, the way the caller expected (a refund, a fee, a payout, a penalty or a reimbursement), or about an account or listing whose standing changed.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: guest_cancellations_and_refunds
    claim:
      categories: [stay]
      event_types: [stay_guest_cancelled, stay_payment_lapse_cancelled, stay_altered, stay_payment_collected, stay_refund_issued]
    summary: >
      Guests call to cancel a stay, to leave a stay early, to change dates or guest count, to ask why a refund was
      smaller than expected, or to report that a stay was unusable; the setting varies by the stay's cancellation tier
      (Flexible through Super Strict 60 Days and Long-Term), its status (confirmed or checked in), its rate type and
      payment plan (paid in full, part now and part later, or monthly installments), the guest's other stays, and the
      history of collections, failed payments, earlier refunds and stay requests on file. The governing records are the
      stay's frozen price breakdown, its booking and cancellation moments, its ledger of collections and refunds, and
      its requests; the refund turns on the tier's windows in stay_evt_guest_cancellation_refund (booking grace period,
      full-refund cutoff, partial window, after-check-in notice nights), on stay_evt_non_refundable_rate, on the
      cross-stay guest service fee cap in stay_agg_service_fee_refund_cap and its stay_msr_guest_sf_refunds_365d measure,
      on proportional service-fee and occupancy-tax refunds, on the per-component limit of what was actually collected
      under stay_evt_payment_schedule, and on the stay's fee_structure, which was fixed at booking from the host's tier
      under stay_booking_terms; approved travel-issue and major-disruptive-event requests (stay_evt_travel_issue_refund,
      stay_evt_major_disruptive_event) and accepted alterations (stay_evt_alteration) are refunded or collected under
      their own rules, and the natural order of the domain is booking, confirmation and collection, then any change or
      cancellation, then the refund of each component. The agent verifies identity, reads the stay and its ledger,
      computes and books collections and component refunds, and records the outcome of requests that the records
      already decide; cancelling a stay or submitting a change or a travel-issue report is the guest's own act, handed
      to the guest as a user action, and approval of travel issues and major disruptive events belongs to Roamhaven's
      back office, never to the caller's word. Requests no policy decides — compensation beyond the published refunds, a
      missed monthly installment on a stay already in progress, tenancy disputes on long stays, or a chargeback the
      guest has already opened with the card issuer — go to a human representative as POLICY_NOT_COVERED.

  - name: listing_settings_and_compliance
    claim:
      categories: [listing]
      event_types: [listing_pricing_updated, listing_fee_change_logged, listing_cancellation_policy_changed, listing_registration_recorded, listing_snoozed, listing_unsnoozed, listing_unlisted, listing_relisted, listing_reinstated, listing_removed]
    summary: >
      Hosts call to change a cleaning fee, short-stay cleaning fee, pet or extra-guest fee, discounts or minimum stay,
      to switch the cancellation policy their listing offers, to record a registration number after a city notice, to
      snooze, unlist, relist or remove a listing, or to get a suspended listing back in search; the setting varies by
      space type (Shared Room through Luxury Villa), listing status, the host account's tier and status, the listing's
      jurisdiction, and the history of fee changes, quality assessments, notices, calendar blocks and stays on the
      listing. The governing records are the listing's current settings, its event log and reinstatement requests, the
      host account and the listing's stays; the rules are the per-space-type ceilings and short-stay limits in
      listing_evt_fee_settings, the discount selection in listing_evt_discounts, the policy options and the host-tier
      condition for Super Strict in listing_evt_cancellation_policy_choice, the registration and cure-deadline rules in
      listing_publishing_requirements and listing_evt_registration_compliance, the per-tier rating thresholds in
      listing_evt_quality_assessment, the live-listing and primary-residence limits in listing_agg_live_listing_limits,
      the open-stay condition in listing_evt_availability_changes, and the approval, minimum-period and host-status
      conditions in listing_evt_reinstatement; as background, a setting change applies only to stays booked afterwards,
      and a suspension is lifted only after its own condition is met. The agent verifies identity, reads the listing,
      its log and the host account, applies settings and logs each changed fee, records registration numbers exactly as
      issued, and reinstates or relists when the records allow; removing a listing, snoozing or unlisting it are the
      host's own choices handed to the host, and reinstatement and registration decisions rest on Roamhaven's review
      records, never on the host's account of events. Requests no policy decides — legal or zoning advice on a permit,
      a dispute with the city about whether a registration is valid, a listing in a jurisdiction Roamhaven does not
      operate in, or a disagreement with the inspection or photography of a Luxury Villa — go to a human
      representative as POLICY_NOT_COVERED.

  - name: host_standing_and_penalties
    claim:
      categories: [host]
      event_types: [host_cancellation_recorded, host_cancellation_penalty_charged, host_cancellation_penalty_waived, host_service_fee_refunded, host_restriction_lifted, host_account_reinstated, host_account_deactivated, host_tier_updated, host_taxpayer_info_updated]
    summary: >
      Hosts call about a cancellation penalty after cancelling a booking, a waiver they appealed for, a host service fee
      they believe was wrong, a restriction or suspension of their account, a lost or expected Superhost badge, a tier
      move as their portfolio grew, tax forms and withholding, or closing their account; the setting varies by host tier
      (Starter Host through Enterprise Partner), account status (active, restricted, suspended), fee structure, tax
      residency and form on file, and the history of stays hosted, cancellations, penalties, strikes, appeals and
      assessments. The governing records are the host account, its event ledger and appeals, the stays it hosted and
      their reviews; the rules are the timing bands, minimum and maximum in host_evt_cancellation_penalty, the approved
      and timely appeal conditions in host_evt_penalty_waiver, the per-tier fee percentages and fallback rates in
      host_evt_service_fee, the per-tier cancellation-rate threshold in host_evt_cancellation_rate_restriction with
      host_msr_cancellation_rate_365d, the strike counts in host_evt_strikes_and_suspension, the appeal window and
      approval in host_evt_appeals_and_reinstatement, the precedence of tiers and the Superhost criteria in
      host_tier_assignment, and the taxpayer and form rules in host_evt_verification_and_tax_info; as background, a
      cancellation is recorded before its penalty, a penalty is charged before any waiver, and an appeal is decided
      before any reinstatement. The agent verifies identity, reads the account history, records cancellations and
      penalties, books waivers and fee refunds that the records support, lifts restrictions and reinstates accounts
      when the records allow, and updates tier or taxpayer status as the records decide; submitting an appeal, closing
      the account or supplying a tax form is the host's own act handed to the host, and appeal decisions belong to
      Roamhaven's review team. Requests no policy decides — negotiating a partner agreement, contesting the evidence
      behind a trust-and-safety strike, removing a guest review, a legal threat, or moving listings to another person's host
      account — go to a human representative as POLICY_NOT_COVERED.

  - name: host_payouts
    claim:
      categories: [payout]
      event_types: [payout_earnings_released, payout_sent, payout_fee_charged, payout_tax_withheld, payout_deduction_applied, payout_adjustment_credited, payout_hold_released, payout_method_reactivated, payout_routing_updated, payout_method_removed]
    summary: >
      Hosts call because a payout is late, smaller than expected, held, returned by the bank, or sent to the wrong
      method, or to change their default method, route a listing to another method, or remove a method; the setting
      varies by payout rail (Direct Deposit (ACH) through Western Union Cash Pickup), method status (pending, active, on
      hold), currency, the host account's status, tier and tax position, the stays released and refunded, and the
      history of releases, transfers, fees, withholding, deductions, credits and holds. The governing records are the
      payout methods and their ledger, the host account, and the stays, refunds, penalties and HostCover records that
      create amounts owed or credited; the rules are the release timing and stay-status condition in payout_evt_release,
      the routing order in payout_agg_routing, the per-rail fees, minimums, maximums and holds in payout_evt_transfer,
      the withholding rates in payout_evt_tax_withholding, the return and reactivation rules in
      payout_evt_returns_and_reactivation, the hold rules in payout_evt_holds, the deduction and credit bases in
      payout_evt_deductions_and_credits, and the cross-method recovery order in payout_agg_negative_balance; as
      background, earnings are released after check-in, withholding and deductions come before a transfer, and a fee
      follows the transfer it belongs to. The agent verifies identity, reads the methods and ledger, books releases,
      transfers, fees, withholding, deductions and credits the records determine, releases holds and reactivates
      methods when their conditions are on record, and updates routing; adding, removing or re-verifying a method, and
      choosing a new default, are the host's own acts handed to the host. Requests no policy decides — a dispute about a conversion rate,
      a rail provider's own fee, paying a co-host's share of earnings, or a deficit already past the collections
      threshold — go to a human representative as POLICY_NOT_COVERED.

  - name: damage_claims_and_protection
    claim:
      categories: [protect]
      event_types: [protect_guest_payment_requested, protect_reimbursement_paid, protect_claim_denied, protect_premium_refunded, protect_plan_tier_changed, protect_plan_cancelled]
    summary: >
      Hosts call after a guest damaged their place, a pet ruined furnishings, a deep clean was needed, items were stolen
      or bookings had to be cancelled while repairs ran, to ask whether they are covered, how much they will get, why a
      claim was denied or paid less than claimed, or to change or cancel their HostCover level; the setting varies by
      HostCover level (Essential through Estate), plan status and effective date, the listing's space type, the host's
      tier, the damage category and item age, and the history of claims, guest payments, reimbursements and recoveries
      in the plan year. The governing records are the plan, its claims and ledger, the stay the damage arose from and
      the listing; the rules are the filing window and guest request in protect_evt_guest_request, the approval,
      escalation window and payable computation in protect_evt_reimbursement (depreciation by item age, cleaning-fee
      offset, guest payments, deductible, sublimits, per-claim limit), the plan-year aggregate and claim count in
      protect_agg_plan_year_limits, the exclusions and denial reasons in protect_evt_exclusions_and_denial, the premium
      and Superhost discount in protect_evt_premium, and the eligibility, waiting period and change cooldown in
      protect_evt_enrollment_and_level; as background, a claim is filed and the guest asked to pay before Roamhaven is
      involved, the claims team verifies the loss and decides, and only then is a reimbursement paid. The agent
      verifies identity, reads the plan, claim and stay, sends the guest payment request, books reimbursements and
      denials the records determine, refunds premiums and changes levels when the conditions hold; filing or escalating
      a claim, paying it as the guest, and cancelling the plan are acts only the host or guest can take, and the
      verified loss and approval belong to the claims team, never to the host's estimate. Requests no policy decides —
      bodily injury or third-party liability, a listing outside the United States, a dispute of the claims team's
      final appeal decision, or a guest disputing the damage payment with their card issuer — go to a human
      representative as POLICY_NOT_COVERED.
