# Policy charter of the Trip Protection category, sold by Roamhaven to guests and underwritten by Harbor
# Mutual Travel Insurance Company. A trip protection policy is the contract a guest holds for one stay;
# its tier is the plan, which fixes the premium rate, the covered reasons and the benefit limits.
# Premiums and benefit payments are booked in trip_protection_transactions; claims are taken in
# trip_protection_claims and decided by the underwriter's claims team.

category: cover
display_name: Trip Protection

binding:
  holding_table: trip_protection_policies
  event_tables: [trip_protection_transactions]
  intake_tables: [trip_protection_claims]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [active, cancelled_free_look, voided, expired]
  transitions:
    - {from: active, to: cancelled_free_look, by: user, means: "The guest cancels the policy within the free-look period for a full premium refund."}
    - {from: active, to: voided, by: system, means: "The insured stay was cancelled by the host or never confirmed, so the policy is void and the premium refunded."}
    - {from: active, to: expired, by: system, means: "The stay's check-out date passes and coverage ends."}

accounts:
  - key: cover_premiums
    unit: USD
    meaning: Premiums the guest paid for the policy — premiums charged in, premiums refunded out.
  - key: benefits_paid
    unit: USD
    meaning: Net benefits paid to the guest under the policy — benefits paid in, recoveries of overlapping Roamhaven refunds out.

parameter_schema:
  premium_pct_of_trip_cost: "decimal percent of the insured trip cost charged as premium"
  premium_min_usd: "decimal USD, lowest premium for a policy"
  premium_rounding: "string, rounding of premiums and benefits"
  max_insured_trip_cost_usd: "decimal USD, highest trip cost the plan insures"
  insured_cost_basis: "string, what the insured trip cost is"
  trip_cancellation_pct: "decimal percent of the non-refunded insured cost paid on a covered cancellation"
  trip_interruption_pct: "decimal percent of the non-refunded unused insured cost paid on a covered interruption"
  interruption_return_travel_usd: "decimal USD, most paid toward return travel on an interruption"
  interruption_unused_nights_basis: "string, which nights count as unused on an interruption"
  cfar_reimbursement_pct: "decimal percent of the non-refunded insured cost paid on a cancel-for-any-reason claim; 0.00 where not offered"
  cfar_purchase_window_days: "int, calendar days after the stay was booked within which the CFAR plan must be bought; 0 where not offered"
  cfar_min_hours_before_check_in: "int, elapsed hours before the start of the check-in date by which a CFAR cancellation must be made; 0 where not offered"
  covered_reasons: "list, reasons for which cancellation and interruption are covered"
  job_loss_min_employment_months: "int, months of continuous employment required for job loss to be covered"
  named_storm_exclusion_hours: "int, a storm named at least this many hours before purchase is not a covered reason"
  epidemic_illness_covered: "bool, whether illness from an epidemic disease is a covered illness"
  work_reasons_covered: "bool, whether being required to work is a covered reason"
  travel_delay_per_day_usd: "decimal USD, paid per full day of covered travel delay"
  travel_delay_max_usd: "decimal USD, most paid for travel delay per policy"
  travel_delay_threshold_hours: "int, hours of delay before the delay benefit starts"
  missed_connection_usd: "decimal USD, most paid for a missed connection"
  baggage_limit_usd: "decimal USD, most paid for lost or damaged baggage"
  baggage_delay_usd: "decimal USD, most paid for essentials during a baggage delay"
  baggage_delay_threshold_hours: "int, hours of baggage delay before the benefit starts"
  emergency_medical_usd: "decimal USD, most paid for emergency medical care"
  medical_evacuation_usd: "decimal USD, most paid for emergency evacuation"
  accidental_death_usd: "decimal USD, accidental death benefit"
  rental_car_damage_usd: "decimal USD, most paid for rental car damage"
  pre_existing_waiver: "bool, whether pre-existing conditions are covered when bought in time"
  pre_existing_waiver_purchase_days: "int, calendar days after booking within which the plan must be bought for the waiver"
  pre_existing_lookback_days: "int, days before purchase in which a condition counts as pre-existing"
  free_look_days: "int, calendar days after purchase during which the guest may cancel for a full refund"
  purchase_latest_days_before_check_in: "int, latest purchase, in calendar days before check-in"
  max_trip_length_days: "int, longest stay the plan covers"
  assistance_line_24h: "bool, whether the 24-hour travel assistance line is included"
  reimbursement_basis: "string, what cancellation benefits are measured on"
  coordination_with_platform_refunds: "string, how Roamhaven refunds and plan benefits fit together"
  premium_refund_on_void_pct: "decimal percent of the premium refunded when the policy is voided"
  premium_refund_after_free_look_pct: "decimal percent of the premium refunded on a cancellation after the free look"
  coverage_start: "string, when each benefit starts"
  coverage_end: "string, when coverage ends"
  claim_filing_days: "int, calendar days after the loss within which a claim must be submitted"
  claim_decision_business_days: "int, business days within which the claims team decides"
  claim_documentation: "string, what a claim must carry"
  benefit_payment_method: "string, how benefits are paid"
  multiple_claims_per_policy: "bool, whether several benefits may be claimed on one policy"
  underwriter: "string, the insurer"
  policies_per_stay_max: "int, most active policies on one stay"

