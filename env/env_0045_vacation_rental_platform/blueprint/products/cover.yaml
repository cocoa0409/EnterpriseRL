events:
  - type: cover_purchased
    target: trip_protection_policies
    mutation: create
    meaning: A guest buys a trip protection plan for one stay.
    grain: one row per policy
    fields:
      trip_policy_id: reference number of the policy
      customer_id: the guest
      stay_id: the insured stay
      variant_name: the plan bought
      status: active at purchase
      purchased_at: timestamp of purchase
      insured_trip_cost: the trip cost insured
      premium_amount: premium charged
      coverage_end_date: the stay's check-out date
    triggers:
      - event: cover:cover_premium_charged
        map: {trip_policy_id: trip_policy_id, amount: premium_amount}
  - type: cover_free_look_cancelled
    target: trip_protection_policies
    mutation: {transition: {from: active, to: cancelled_free_look}}
    meaning: The guest cancels the policy within the free-look period.
    grain: one row per policy
    fields:
      trip_policy_id: the policy
      status: becomes cancelled_free_look
      cancelled_at: timestamp of cancellation
    triggers:
      - event: cover:cover_premium_refunded
        map: {trip_policy_id: trip_policy_id}
  - type: cover_voided
    target: trip_protection_policies
    mutation: {transition: {from: active, to: voided}}
    meaning: The policy is voided because the insured stay was cancelled by the host or never confirmed.
    grain: one row per policy
    fields:
      trip_policy_id: the policy
      status: becomes voided
      cancelled_at: timestamp voided
    triggers:
      - event: cover:cover_premium_refunded
        map: {trip_policy_id: trip_policy_id}
  - type: cover_expired
    target: trip_protection_policies
    mutation: {transition: {from: active, to: expired}}
    meaning: Coverage ends at check-out.
    grain: one row per policy
    fields:
      trip_policy_id: the policy
      status: becomes expired
    triggers: []
  - type: cover_insured_cost_updated
    target: trip_protection_policies
    mutation: update
    meaning: The insured cost and premium follow an accepted alteration of the stay's price.
    grain: one row per policy (each update rewrites the insured cost)
    fields:
      trip_policy_id: the policy
      insured_trip_cost: new insured cost
      premium_amount: new premium
    triggers: []
  - type: cover_premium_charged
    target: trip_protection_transactions
    meaning: The premium (or an increase in premium) is charged to the guest.
    grain: one row per premium charge on a policy
    distinguish_by: [posted_date, amount]
    fields:
      trip_policy_id: the policy
      customer_id: the guest
      posted_date: date charged
      amount: premium charged, positive
    account: cover_premiums
    direction: in
    triggers: []
  - type: cover_premium_refunded
    target: trip_protection_transactions
    meaning: Premium is refunded to the guest.
    grain: one row per premium refund on a policy
    distinguish_by: [posted_date]
    fields:
      trip_policy_id: the policy
      customer_id: the guest
      posted_date: date refunded
      amount: premium refunded, positive
    account: cover_premiums
    direction: out
    triggers: []
  - type: cover_benefit_paid
    target: trip_protection_transactions
    meaning: A benefit is paid to the guest on an approved claim.
    grain: one row per approved claim
    distinguish_by: [trip_claim_id]
    fields:
      trip_policy_id: the policy
      customer_id: the guest
      posted_date: date paid
      trip_claim_id: the claim
      benefit_type: trip_cancellation, trip_interruption, cfar, travel_delay, baggage or emergency_medical
      amount: benefit paid, positive
    account: benefits_paid
    direction: in
    triggers: []
  - type: cover_benefit_recovered
    target: trip_protection_transactions
    meaning: A benefit already paid is recovered because Roamhaven later refunded the same amounts.
    grain: one row per recovery on a claim
    distinguish_by: [trip_claim_id, posted_date]
    fields:
      trip_policy_id: the policy
      customer_id: the guest
      posted_date: date recovered
      trip_claim_id: the claim
      original_txn_id: the benefit payment recovered
      amount: amount recovered, positive
    account: benefits_paid
    direction: out
    triggers: []
  - type: cover_claim_denied
    target: trip_protection_transactions
    meaning: A claim is refused, with the reason recorded.
    grain: one row per claim denial
    distinguish_by: [trip_claim_id]
    fields:
      trip_policy_id: the policy
      customer_id: the guest
      posted_date: date denied
      trip_claim_id: the claim
      denial_reason: reason_not_covered, filed_late, pre_existing_condition, insufficient_documentation, cfar_too_late or no_loss
    triggers: []

measures:
  - id: cover_msr_live_policies_on_stay
    window: current state at the moment of the write
    measure: count of trip protection policies on the same stay_id whose status is active
  - id: cover_msr_net_benefits
    window: lifetime of the policy
    measure: sum of cover_benefit_paid amounts minus cover_benefit_recovered amounts on the policy

policies:
  - id: cover_agg_multi_holding
    subject: [cover_purchased]
    rule: >-
      A guest may hold trip protection on as many stays as they book, one policy per stay; there is no cap on policies
      per guest. Each policy covers only its own stay, and limits are never pooled across a guest's policies.
    eligibility: []
    params:
      max_per_customer: null
  - id: cover_agg_one_policy_per_stay
    subject: [cover_purchased]
    rule: >-
      A stay may carry at most policies_per_stay_max active policies (cover_msr_live_policies_on_stay); a guest who
      wants a different plan cancels the first within its free look and buys the second. The insured trip cost is the
      stay's total_price, insured in full, and may not exceed the plan's max_insured_trip_cost_usd; a stay above that
      cost cannot be insured on that plan. A stay longer than max_trip_length_days cannot be insured on that plan.
    eligibility: []
    measures: [cover_msr_live_policies_on_stay]
  - id: cover_evt_purchase_and_premium
    subject: [cover_purchased, cover_premium_charged, cover_insured_cost_updated]
    rule: >-
      A plan may be bought at booking or up to purchase_latest_days_before_check_in calendar days before check-in. The
      premium is premium_pct_of_trip_cost of the insured trip cost, raised to premium_min_usd when lower, rounded per
      premium_rounding. A CFAR plan can be bought only within cfar_purchase_window_days calendar days after the stay was
      booked; the days are counted from the date part of the stay's booked_at to the date part of purchased_at, and a
      purchase on the last day stands. The pre-existing condition waiver applies only where pre_existing_waiver is true
      and the plan was bought within pre_existing_waiver_purchase_days of booking. When an accepted alteration changes
      the stay's total_price, the insured cost and premium are recomputed; an increase is charged as a further premium
      and a decrease is refunded as premium.
    eligibility:
      - id: cfar_purchase_window
        applies_to: [cover_purchased]
        kind: time
        condition: A CFAR plan can be bought only within cfar_purchase_window_days calendar days after the stay was booked; the days are counted from the date part of the stay's booked_at to the date part of purchased_at, and a purchase on the last day stands.
        evidence_fields: [stays.booked_at, stays.stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [stays.stay_id]
          action_bindings:
            stays.stay_id: stay_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the stay was booked
          anchor_source: stays.booked_at
          relation: not_after
          duration_source: variants.cfar_purchase_window_days
          unit: calendar_days
          counting_rule: the days are counted from the date part of the stay's booked_at to the date part of purchased_at, and a purchase on the last day stands.
          boundary: inclusive
    params:
      per_tier:
        Trip Cancellation Only: {premium_pct_of_trip_cost: "=premium_pct_of_trip_cost", premium_min_usd: "=premium_min_usd"}
        Trip Protection Essential: {premium_pct_of_trip_cost: "=premium_pct_of_trip_cost", premium_min_usd: "=premium_min_usd"}
        Trip Protection Standard: {premium_pct_of_trip_cost: "=premium_pct_of_trip_cost", premium_min_usd: "=premium_min_usd"}
        Trip Protection Plus: {premium_pct_of_trip_cost: "=premium_pct_of_trip_cost", premium_min_usd: "=premium_min_usd"}
        Trip Protection Premier: {premium_pct_of_trip_cost: "=premium_pct_of_trip_cost", premium_min_usd: "=premium_min_usd"}
        Trip Protection Premier CFAR: {premium_pct_of_trip_cost: "=premium_pct_of_trip_cost", premium_min_usd: "=premium_min_usd"}
    formula:
      premium_amount: round(max(insured_trip_cost * premium_pct_of_trip_cost / 100, premium_min_usd), 2)
  - id: cover_evt_free_look_and_void
    subject: [cover_free_look_cancelled, cover_voided, cover_premium_refunded]
    rule: >-
      A guest may cancel a policy for a full premium refund only within free_look_days calendar days after purchase, and
      only when no claim has been submitted on it; the days are counted from the date part of purchased_at, and a
      cancellation on the last day stands. After the free look, cancelling refunds premium_refund_after_free_look_pct of
      the premium. A policy is voided, with premium_refund_on_void_pct of the premium refunded, when its stay is
      cancelled by the host or declined or expires before confirmation; a stay cancelled by the guest does not void the
      policy, because that cancellation may itself be a covered loss.
    eligibility:
      - id: free_look_window
        applies_to: [cover_free_look_cancelled]
        kind: time
        condition: A guest may cancel a policy for a full premium refund only within free_look_days calendar days after purchase, and only when no claim has been submitted on it; the days are counted from the date part of purchased_at, and a cancellation on the last day stands.
        evidence_fields: [trip_protection_policies.purchased_at, trip_protection_policies.trip_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trip_protection_policies.trip_policy_id]
          action_bindings:
            trip_protection_policies.trip_policy_id: trip_policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: purchase
          anchor_source: trip_protection_policies.purchased_at
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: the days are counted from the date part of purchased_at, and a cancellation on the last day stands.
          boundary: inclusive
  - id: cover_evt_cancellation_benefit
    subject: [cover_benefit_paid]
    rule: >-
      A trip_cancellation benefit is paid when the guest cancelled the stay for a reason in the plan's covered_reasons,
      as decided by the underwriter's claims team. A benefit is paid only on a claim the claims team has approved. The
      benefit is trip_cancellation_pct of the insured amounts Roamhaven did not refund on the guest cancellation
      (reimbursement_basis): the stay's total_price less every Roamhaven refund issued on the stay, never more than the
      insured trip cost. A storm named at least named_storm_exclusion_hours before purchase is not a covered reason, job
      loss needs job_loss_min_employment_months of employment, and a pre-existing condition is covered only under the
      waiver.
    eligibility:
      - id: benefit_claim_approved
        applies_to: [cover_benefit_paid]
        kind: state
        condition: A benefit is paid only on a claim the claims team has approved.
        evidence_fields: [trip_protection_claims.claim_status, trip_protection_claims.trip_claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trip_protection_claims.trip_claim_id]
          action_bindings:
            trip_protection_claims.trip_claim_id: trip_claim_id
        state_contract:
          field: trip_protection_claims.claim_status
          allowed: [approved]
  - id: cover_evt_cfar_benefit
    subject: [cover_benefit_paid]
    rule: >-
      On a plan whose cfar_reimbursement_pct is above 0.00 the guest may cancel for any reason. A CFAR benefit is paid
      only when the guest cancelled at least cfar_min_hours_before_check_in elapsed hours before the start of the stay's
      check-in date; the hours are counted back from 00:00 on check_in_date to the stay's cancelled_at, and a
      cancellation exactly at the boundary qualifies. The benefit is cfar_reimbursement_pct of the stay's total_price
      less every Roamhaven refund issued on it. A covered-reason cancellation on a CFAR plan is paid as trip_cancellation
      instead, at the higher trip_cancellation_pct.
    eligibility:
      - id: cfar_timing
        applies_to: [cover_benefit_paid]
        kind: time
        condition: A CFAR benefit is paid only when the guest cancelled at least cfar_min_hours_before_check_in elapsed hours before the start of the stay's check-in date; the hours are counted back from 00:00 on check_in_date to the stay's cancelled_at, and a cancellation exactly at the boundary qualifies.
        evidence_fields: [stays.check_in_date, stays.cancelled_at, stays.stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [stays.stay_id]
          action_bindings:
            stays.stay_id: stay_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the start of the stay's check-in date
          anchor_source: stays.check_in_date
          relation: not_after
          duration_source: variants.cfar_min_hours_before_check_in
          unit: elapsed_hours
          counting_rule: the hours are counted back from 00:00 on check_in_date to the stay's cancelled_at, and a cancellation exactly at the boundary qualifies.
          boundary: inclusive
  - id: cover_evt_travel_benefits
    subject: [cover_benefit_paid]
    rule: >-
      During the stay the plan pays, each within its own limit: trip_interruption_pct of the unused prepaid nights not
      refunded by Roamhaven plus up to interruption_return_travel_usd for return travel when the stay is cut short for a
      covered reason; travel_delay_per_day_usd for each full day of delay once delay passes travel_delay_threshold_hours,
      up to travel_delay_max_usd; up to baggage_limit_usd for lost or damaged baggage and baggage_delay_usd for essentials
      once a baggage delay passes baggage_delay_threshold_hours; and emergency medical and evacuation costs up to
      emergency_medical_usd and medical_evacuation_usd. A plan whose limit for a benefit is 0.00 does not offer it.
    eligibility: []
  - id: cover_evt_coordination_and_denial
    subject: [cover_benefit_recovered, cover_claim_denied]
    rule: >-
      A claim must be submitted within claim_filing_days calendar days after the loss; a later claim is denied as
      filed_late. A claim for a reason outside covered_reasons is denied as reason_not_covered, one resting on an
      excluded pre-existing condition as pre_existing_condition, one without the claim_documentation as
      insufficient_documentation, a CFAR claim made inside the cutoff as cfar_too_late, and a claim where Roamhaven
      already refunded everything as no_loss. When Roamhaven refunds amounts on the stay after the plan paid a benefit
      on them, the overlap is recovered from the guest under coordination_with_platform_refunds, never more than the
      benefit paid net of earlier recoveries (cover_msr_net_benefits). Roamhaven support never decides a claim; the
      underwriter's claims team does.
    eligibility: []
    measures: [cover_msr_net_benefits]
  - id: cover_evt_expiry
    subject: [cover_expired]
    rule: >-
      Coverage ends on the stay's check-out date (coverage_end) and the policy expires the next day; a claim for a loss
      during coverage may still be submitted within claim_filing_days after the loss. An expired policy refunds no
      premium.
    eligibility: []
