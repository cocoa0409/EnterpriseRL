# Policy charter of the Host Accounts category at Roamhaven.
# A host account is the contract a host (an individual or a small hospitality business) holds with
# Roamhaven to list spaces and receive earnings. Its tier is the host program the account sits in, which
# fixes the fee structure and host service fee, the Superhost standards, the number of live listings, the
# support entitlements and the standing thresholds. Host service fees, host cancellations and their
# penalties, policy strikes, Superhost assessments and tax forms are booked in host_account_events;
# appeals against suspensions, restrictions, strikes and penalties are taken in host_appeals.

category: host
display_name: Host Accounts

binding:
  holding_table: host_accounts
  event_tables: [host_account_events]
  intake_tables: [host_appeals]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_verification, active, restricted, suspended, deactivated]
  transitions:
    - {from: pending_verification, to: active, by: system, means: "Identity verification completes and the host may publish listings."}
    - {from: pending_verification, to: deactivated, by: system, means: "Identity verification was not completed in time and the account is closed."}
    - {from: active, to: restricted, by: system, means: "The account may not accept new bookings for a period because of its cancellation rate or strike count."}
    - {from: restricted, to: active, by: agent, means: "The restriction period has run out (or an appeal against it was approved) and support lifts the restriction."}
    - {from: active, to: suspended, by: system, means: "Trust and safety suspends the account."}
    - {from: restricted, to: suspended, by: system, means: "Trust and safety suspends a restricted account."}
    - {from: suspended, to: active, by: agent, means: "Support reinstates the account after its suspension appeal was approved."}
    - {from: active, to: deactivated, by: user, means: "The host closes their host account."}
    - {from: suspended, to: deactivated, by: system, means: "A suspension becomes permanent after the appeal is denied or the appeal window lapses."}

accounts:
  - key: host_fees
    unit: USD
    meaning: Host service fees withheld from the host's earnings — fees assessed in, fees refunded out.
  - key: cancellation_penalties
    unit: USD
    meaning: Host cancellation penalties owed by the host — penalties charged in, penalties waived out.

parameter_schema:
  fee_structure: "enum (split_fee | host_only_fee), how Roamhaven's service fee is split between guest and host on stays booked while the account holds this tier"
  host_service_fee_pct: "decimal percent of the host-fee base withheld as the host service fee on stays whose fee_structure equals this tier's fee_structure"
  split_fee_host_pct: "decimal percent withheld on a split_fee stay assessed while the account holds a host_only_fee tier"
  host_only_fee_default_pct: "decimal percent withheld on a host_only_fee stay assessed while the account holds a split_fee tier"
  host_service_fee_base: "string, the stay amounts that make up the host-fee base"
  host_fee_assessment_timing: "string, when the host service fee is assessed"
  host_fee_refund_mode: "string, how the host service fee is refunded when host-funded refunds follow payout release"
  cancel_penalty_pct_over_30_days: "decimal percent of the penalty base charged when the host cancels more than 30 days before check-in"
  cancel_penalty_pct_30_days_to_48_hours: "decimal percent of the penalty base charged when the host cancels 30 days to 48 hours before check-in"
  cancel_penalty_pct_under_48_hours: "decimal percent of the penalty base charged when the host cancels less than 48 hours before check-in"
  cancel_penalty_min_usd: "decimal USD, lowest penalty charged on a penalised host cancellation"
  cancel_penalty_max_usd: "decimal USD, highest penalty charged on one host cancellation"
  cancel_penalty_base: "string, the amounts of the cancelled stay the penalty percentage applies to"
  penalty_recovery: "string, how a charged penalty is recovered"
  penalty_waiver_reasons: "list, the documented reasons for which a host cancellation penalty is waived on an approved appeal"
  penalty_waiver_request_days: "int, calendar days after the host cancellation within which a penalty appeal must be submitted"
  cancellation_rate_lookback_days: "int, calendar days of history over which the host cancellation rate is measured"
  cancellation_rate_min_stays: "int, fewest stays in the lookback before the cancellation rate is applied"
  cancellation_restriction_rate_pct: "decimal percent, host cancellation rate at or above which the account is restricted"
  cancellation_restriction_days: "int, calendar days a cancellation-rate or strike restriction lasts"
  restriction_blocks_new_bookings: "bool, whether a restricted account's listings accept no new bookings"
  superhost_min_avg_rating: "decimal stars, lowest average guest rating for Superhost"
  superhost_min_response_rate_pct: "decimal percent, lowest message response rate for Superhost"
  superhost_max_cancellation_rate_pct: "decimal percent, cancellation rate below which Superhost may be held"
  superhost_min_stays_12m: "int, completed stays in the lookback needed for Superhost"
  superhost_alt_min_stays_12m: "int, completed stays needed under the alternative long-stay route to Superhost"
  superhost_alt_min_nights_12m: "int, completed nights needed under the alternative long-stay route to Superhost"
  superhost_lookback_days: "int, calendar days of history read at each Superhost assessment"
  superhost_assessment_schedule: "string, the dates on which Superhost assessments run"
  superhost_travel_credit_usd: "decimal USD, Roamhaven travel credit issued after the required consecutive met assessments; 0.00 where not a perk"
  superhost_credit_consecutive_quarters: "int, consecutive met Superhost assessments that earn one travel credit"
  superhost_loss_on_suspension: "bool, whether a suspension removes Superhost status at once"
  starter_graduation_min_stays: "int, completed stays needed to leave Starter Host"
  starter_graduation_min_account_days: "int, account age in calendar days needed to leave Starter Host"
  professional_min_live_listings: "int, live listings at which an individual host moves to Professional Host"
  professional_plus_min_live_listings: "int, live listings needed for Professional Host Plus"
  professional_plus_min_avg_rating: "decimal stars, lowest average guest rating for Professional Host Plus"
  enterprise_min_live_listings: "int, live listings needed for Enterprise Partner"
  max_active_listings: "int, most live (listed or snoozed) listings the account may hold"
  strike_lookback_days: "int, calendar days over which policy strikes are counted"
  restriction_strike_count: "int, strikes in the lookback at which the account is restricted"
  suspension_strike_count: "int, strikes in the lookback at which the account is suspended"
  immediate_suspension_strike_types: "list, strike types that suspend the account on the first occurrence"
  suspension_holds_payouts: "bool, whether a suspension holds every payout of the account"
  appeal_window_days: "int, calendar days after a suspension, restriction or strike within which an appeal may be submitted"
  appeal_decision_business_days: "int, business days within which Roamhaven decides an appeal"
  appeals_per_decision: "int, appeals allowed against one decision"
  dedicated_account_manager: "bool, whether the account has a named account manager"
  priority_support: "bool, whether the account's calls go to the priority host support line"
  co_host_seats: "int, co-hosts that may be added to the account"
  identity_verification_deadline_days: "int, calendar days after opening within which identity verification must complete"
  taxpayer_info_required_before_payout: "bool, whether taxpayer information is required before payouts are released without withholding"
  form_1099k_threshold_usd: "decimal USD, gross payouts in a calendar year above which a Form 1099-K is issued (with the transaction count also met)"
  form_1099k_min_transactions: "int, payout transactions in a calendar year above which a Form 1099-K is issued (with the amount also met)"
  closure_blocked_by_upcoming_stays: "bool, whether an account with requested, confirmed or checked-in stays cannot be closed"

