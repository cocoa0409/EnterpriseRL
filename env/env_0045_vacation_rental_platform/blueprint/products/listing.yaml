events:
  - type: listing_created
    target: listings
    mutation: create
    meaning: A host creates a new listing in draft with its space type, location, capacity and initial settings.
    grain: one row per listing
    fields:
      listing_id: reference number of the new listing
      customer_id: the host who owns it
      host_account_id: the host account it belongs to
      variant_name: the space type
      status: draft at creation
      listing_title: title shown to guests
      jurisdiction_code: the tax and registration jurisdiction of the address
      cancellation_policy: the cancellation policy offered to new bookings
      nightly_rate: base nightly rate
      cleaning_fee: cleaning fee per stay
      short_stay_cleaning_fee: cleaning fee for short stays
      pet_fee: pet fee per stay
      extra_guest_fee: fee per extra guest per night
      extra_guest_threshold: guest count beyond which the extra-guest fee applies
      max_guests: guests the listing accepts
      bedrooms: bedrooms
      photo_count: photos uploaded
      minimum_nights: minimum stay
      instant_book: whether Instant Book is on
      created_date: date created
    triggers: []
  - type: listing_submitted_for_inspection
    target: listings
    mutation: {transition: {from: draft, to: pending_inspection}}
    meaning: The host submits a listing whose space type requires an in-person inspection.
    grain: one row per listing
    fields:
      listing_id: the listing submitted
      status: becomes pending_inspection
    triggers: []
  - type: listing_published
    target: listings
    mutation: {transition: [{from: draft, to: listed}, {from: pending_inspection, to: listed}]}
    meaning: The listing goes live in search for the first time.
    grain: one row per listing
    fields:
      listing_id: the listing published
      status: becomes listed
      first_listed_date: date first published
    triggers: []
  - type: listing_snoozed
    target: listings
    mutation: {transition: {from: listed, to: snoozed}}
    meaning: The host pauses new bookings for a period.
    grain: one row per listing
    fields:
      listing_id: the listing snoozed
      status: becomes snoozed
    triggers: []
  - type: listing_unsnoozed
    target: listings
    mutation: {transition: {from: snoozed, to: listed}}
    meaning: A snooze ends and the listing is bookable again.
    grain: one row per listing
    fields:
      listing_id: the listing
      status: becomes listed
    triggers: []
  - type: listing_unlisted
    target: listings
    mutation: {transition: [{from: listed, to: unlisted}, {from: snoozed, to: unlisted}]}
    meaning: The host takes the listing out of search indefinitely.
    grain: one row per listing
    fields:
      listing_id: the listing
      status: becomes unlisted
    triggers: []
  - type: listing_relisted
    target: listings
    mutation: {transition: {from: unlisted, to: listed}}
    meaning: The host puts an unlisted listing back in search.
    grain: one row per listing
    fields:
      listing_id: the listing
      status: becomes listed
    triggers: []
  - type: listing_suspended
    target: listings
    mutation: {transition: [{from: listed, to: suspended}, {from: snoozed, to: suspended}, {from: unlisted, to: suspended}]}
    meaning: Roamhaven suspends the listing, recording why.
    grain: one row per listing
    fields:
      listing_id: the listing suspended
      status: becomes suspended
      suspension_reason: quality, registration, safety or host_account
      suspended_date: date of suspension
    triggers: []
  - type: listing_reinstated
    target: listings
    mutation: {transition: {from: suspended, to: listed}}
    meaning: A suspended listing is put back in search.
    grain: one row per listing
    fields:
      listing_id: the listing reinstated
      status: becomes listed
      suspension_reason: reset to none
    triggers: []
  - type: listing_removed
    target: listings
    mutation: {transition: [{from: unlisted, to: removed}, {from: suspended, to: removed}]}
    meaning: The listing is permanently deactivated.
    grain: one row per listing
    fields:
      listing_id: the listing removed
      status: becomes removed
      removed_date: date of removal
    triggers: []
  - type: listing_pricing_updated
    target: listings
    mutation: update
    meaning: The host changes the nightly rate, fees, discounts, minimum stay or Instant Book setting.
    grain: one row per listing (each change rewrites the current settings)
    fields:
      listing_id: the listing
      nightly_rate: new nightly rate
      cleaning_fee: new cleaning fee
      short_stay_cleaning_fee: new short-stay cleaning fee
      pet_fee: new pet fee
      extra_guest_fee: new extra-guest fee
      extra_guest_threshold: new extra-guest threshold
      weekly_discount_pct: new weekly discount
      monthly_discount_pct: new monthly discount
      early_bird_discount_pct: new early-bird discount
      last_minute_discount_pct: new last-minute discount
      new_listing_promo_enabled: whether the new-listing promotion is on
      minimum_nights: new minimum stay
      instant_book: new Instant Book setting
    triggers:
      - event: listing:listing_fee_change_logged
        map: {listing_id: listing_id}
  - type: listing_cancellation_policy_changed
    target: listings
    mutation: update
    meaning: The host changes the cancellation policy offered to new bookings.
    grain: one row per listing
    fields:
      listing_id: the listing
      cancellation_policy: the new policy
    triggers: []
  - type: listing_registration_recorded
    target: listings
    mutation: update
    meaning: The host's jurisdiction registration or permit number is recorded on the listing.
    grain: one row per listing
    fields:
      listing_id: the listing
      registration_number: the registration number exactly as issued
    triggers: []
  - type: listing_fee_change_logged
    target: listing_events
    meaning: One changed fee or rate on a listing is logged with its old and new value.
    grain: one row per fee type changed per change
    distinguish_by: [fee_type, event_date, new_amount]
    fields:
      listing_id: the listing
      customer_id: the host
      event_date: date the change was saved
      fee_type: which fee or rate changed
      previous_amount: value before the change
      new_amount: value after the change
    triggers: []
  - type: listing_calendar_blocked
    target: listing_events
    meaning: The nights of a stay the host cancelled are blocked on the listing calendar.
    grain: one row per cancelled stay
    distinguish_by: [stay_id]
    fields:
      listing_id: the listing
      customer_id: the host
      event_date: date the block was placed
      stay_id: the cancelled stay whose nights are blocked
      block_start_date: first blocked night
      block_end_date: day after the last blocked night
      block_reason: host_cancellation
    triggers: []
  - type: listing_quality_reviewed
    target: listing_events
    meaning: A quarterly quality assessment of the listing's guest ratings is recorded with its outcome.
    grain: one row per listing per quarterly assessment
    distinguish_by: [assessment_quarter]
    fields:
      listing_id: the listing
      customer_id: the host
      event_date: assessment date
      assessment_quarter: the quarter assessed
      average_rating: average guest rating in the lookback window
      review_count: guest reviews in the lookback window
      quality_outcome: not_assessed, pass, warning or suspension
    triggers:
      - event: listing:listing_suspended
        when: {quality_outcome: suspension}
        map: {listing_id: listing_id, suspension_reason: quality}
  - type: listing_regulatory_notice_recorded
    target: listing_events
    meaning: A jurisdiction's notice that the listing lacks a valid registration is recorded.
    grain: one row per jurisdiction notice
    distinguish_by: [notice_reference]
    fields:
      listing_id: the listing
      customer_id: the host
      event_date: date the notice was received
      notice_type: missing_registration or invalid_registration
      notice_reference: the jurisdiction's notice reference exactly as issued
      cure_deadline: last day a valid registration number may be recorded
    triggers: []

measures:
  - id: listing_msr_avg_rating_365d
    window: the quality_lookback_days calendar days ending on the day before the assessment date
    measure: mean of stay_transactions.rating over stay_review_submitted rows with reviewer_role guest on stays of this listing whose posted_at date falls in the window, rounded half up to 2 decimals
  - id: listing_msr_review_count_365d
    window: the quality_lookback_days calendar days ending on the day before the assessment date
    measure: count of stay_review_submitted rows with reviewer_role guest on stays of this listing whose posted_at date falls in the window
  - id: listing_msr_promo_stays
    window: lifetime of the listing
    measure: count of stays on this listing with discount_type new_listing whose status is not declined or expired
  - id: listing_msr_host_live_listings
    window: current state at the moment of the write
    measure: count of the host's listings (same host_account_id) whose status is listed or snoozed
  - id: listing_msr_host_live_in_jurisdiction
    window: current state at the moment of the write
    measure: count of the host's entire-place listings (same host_account_id) in the same jurisdiction_code whose status is listed or snoozed

policies:
  - id: listing_agg_multi_holding
    subject: [listing_created]
    rule: >-
      A host may create any number of listings, of any space types; there is no cap on listings held in draft,
      unlisted or removed status. The number of live listings (listed or snoozed) a host may hold at once is limited by
      the host account's tier through listing_agg_live_listing_limits, and entire-place listings in primary-residence
      jurisdictions are further limited there. Each listing carries its own settings, quality record and registration;
      nothing set on one listing applies to another.
    eligibility: []
    params:
      max_per_customer: null
  - id: listing_agg_live_listing_limits
    subject: [listing_published, listing_relisted, listing_unsnoozed, listing_reinstated]
    rule: >-
      Before a listing goes live, the host's portfolio is checked. A listing can go live only when the host account's
      status is active. The number of the host's live listings, counted with listing_msr_host_live_listings before the
      write, must be below the max_active_listings of the host account's tier under the Host Accounts charter;
      otherwise the listing stays in its current status until another listing leaves live status or the host's tier
      rises. In a jurisdiction whose jurisdiction_rules entry has primary_residence_rule true, a host may hold only
      max_live_entire_place_per_host live entire-place listings, counted with listing_msr_host_live_in_jurisdiction;
      hosted space types are not counted. Snoozing does not free a slot, because a snoozed listing is still live.
    eligibility:
      - id: host_account_active
        applies_to: [listing_published, listing_relisted, listing_unsnoozed, listing_reinstated]
        kind: state
        condition: A listing can go live only when the host account's status is active.
        evidence_fields: [host_accounts.status, host_accounts.host_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_accounts.host_account_id]
          action_bindings:
            host_accounts.host_account_id: host_account_id
        state_contract:
          field: host_accounts.status
          allowed: [active]
    measures: [listing_msr_host_live_listings, listing_msr_host_live_in_jurisdiction]
    params:
      max_live_entire_place_per_host: 1
  - id: listing_publishing_requirements
    subject: [listing_created, listing_submitted_for_inspection, listing_published]
    rule: >-
      A listing is published only when it meets every standard of its space type: max_guests no higher than
      max_guest_capacity, bedrooms no fewer than min_bedrooms, photo_count no fewer than min_photos_to_publish, a nightly
      rate between nightly_rate_min_usd and nightly_rate_max_usd, a listing title no longer than max_listing_title_chars,
      a cancellation policy among the space type's cancellation_policy_options, and declared working smoke and carbon
      monoxide alarms where smoke_and_co_alarms_required is true. A space type whose in_person_inspection_required is true
      goes from draft to pending_inspection, and is published only by a passed inspection; professional photographs are
      required where professional_photography_required is true. In a jurisdiction whose jurisdiction_rules entry
      requires registration for the space type's regulatory_class, a listing can be published only when a registration
      number is recorded on it. The registration number is recorded exactly as the jurisdiction issued it and displayed
      on the listing where registration_display_required is true. A listing failing any standard stays in draft.
    eligibility:
      - id: registration_before_publish
        applies_to: [listing_published]
        kind: authorization
        condition: In a jurisdiction whose jurisdiction_rules entry requires registration for the space type's regulatory_class, a listing can be published only when a registration number is recorded on it.
        evidence_fields: [listings.registration_number, listings.jurisdiction_code, listings.listing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [listings.listing_id]
          action_bindings:
            listings.listing_id: listing_id
    params:
      jurisdiction_rules:
        TX-AUSTIN: {registration_required_hosted: true, registration_required_unhosted: true, primary_residence_rule: false}
        FL-ORANGE: {registration_required_hosted: false, registration_required_unhosted: false, primary_residence_rule: false}
        CO-DENVER: {registration_required_hosted: true, registration_required_unhosted: true, primary_residence_rule: true}
        TN-NASHVILLE: {registration_required_hosted: true, registration_required_unhosted: true, primary_residence_rule: false}
        HI-HONOLULU: {registration_required_hosted: true, registration_required_unhosted: true, primary_residence_rule: false}
        CA-SAN-DIEGO: {registration_required_hosted: true, registration_required_unhosted: true, primary_residence_rule: false}
  - id: listing_evt_fee_settings
    subject: [listing_pricing_updated, listing_fee_change_logged]
    rule: >-
      The host sets the nightly rate and the per-stay cleaning fee, pet fee and per-night extra-guest fee within the
      ceilings of the space type: cleaning_fee no higher than cleaning_fee_max_usd, pet_fee no higher than
      pet_fee_max_usd, extra_guest_fee no higher than extra_guest_fee_max_usd, and extra_guest_threshold no lower than
      extra_guest_threshold_min; a setting outside its ceiling is not saved. A short-stay cleaning fee may be set only
      where short_stay_cleaning_fee_allowed is true, must not exceed the regular cleaning fee, and replaces the regular
      cleaning fee on stays of short_stay_max_nights nights or fewer. The pet fee is charged once per stay when
      pet_count is above 0; the extra-guest fee is charged per night for each guest beyond extra_guest_threshold. A
      change takes effect for stays booked after the change is saved (fee_change_applies_to) and never alters a stay
      already booked, which keeps the amounts frozen on it. Every saved change logs one listing_fee_change_logged row per
      fee or rate that changed, with the previous and new value; a value saved unchanged logs nothing. Minimum stay
      settings must lie between minimum_nights_floor and minimum_nights_ceiling, and Instant Book may be switched on
      only where instant_book_allowed is true.
    eligibility: []
    params:
      per_tier:
        Shared Room: {cleaning_fee_max_usd: "=cleaning_fee_max_usd", pet_fee_max_usd: "=pet_fee_max_usd", extra_guest_fee_max_usd: "=extra_guest_fee_max_usd"}
        Private Room: {cleaning_fee_max_usd: "=cleaning_fee_max_usd", pet_fee_max_usd: "=pet_fee_max_usd", extra_guest_fee_max_usd: "=extra_guest_fee_max_usd"}
        Entire Guest Suite: {cleaning_fee_max_usd: "=cleaning_fee_max_usd", pet_fee_max_usd: "=pet_fee_max_usd", extra_guest_fee_max_usd: "=extra_guest_fee_max_usd"}
        Entire Apartment: {cleaning_fee_max_usd: "=cleaning_fee_max_usd", pet_fee_max_usd: "=pet_fee_max_usd", extra_guest_fee_max_usd: "=extra_guest_fee_max_usd"}
        Entire Home: {cleaning_fee_max_usd: "=cleaning_fee_max_usd", pet_fee_max_usd: "=pet_fee_max_usd", extra_guest_fee_max_usd: "=extra_guest_fee_max_usd"}
        Luxury Villa: {cleaning_fee_max_usd: "=cleaning_fee_max_usd", pet_fee_max_usd: "=pet_fee_max_usd", extra_guest_fee_max_usd: "=extra_guest_fee_max_usd"}
    formula:
      cleaning_fee_within_ceiling: cleaning_fee <= cleaning_fee_max_usd
      short_stay_fee_valid: short_stay_cleaning_fee <= cleaning_fee
      pet_fee_within_ceiling: pet_fee <= pet_fee_max_usd
      extra_guest_fee_within_ceiling: extra_guest_fee <= extra_guest_fee_max_usd
  - id: listing_evt_discounts
    subject: [listing_pricing_updated]
    rule: >-
      A listing may carry a weekly discount (stays of weekly_discount_min_nights nights or more), a monthly discount
      (stays of monthly_discount_min_nights nights or more), an early-bird discount (booked at least
      early_bird_min_lead_days calendar days before check-in), a last-minute discount (booked at most
      last_minute_max_lead_days calendar days before check-in) and, where new_listing_promo_pct is above 0, the
      new-listing promotion. The new-listing promotion applies to a booking only while the listing has fewer than
      new_listing_promo_max_bookings promoted stays (listing_msr_promo_stays) and only when the booking is made within
      new_listing_promo_window_days calendar days after first_listed_date, counted from the first listed date to the
      booking date with the last day included. Discounts never stack: every discount the booking qualifies for is
      priced on the nightly rate times nights, and only the single largest discount by amount applies
      (discount_selection_rule), ties going to the length-of-stay discount; the stay records it as discount_type and
      discount_amount. A non-refundable-rate booking takes the Stays charter's non-refundable discount instead of any
      listing discount, and is not counted as a promoted stay.
    eligibility: []
    measures: [listing_msr_promo_stays]
  - id: listing_evt_cancellation_policy_choice
    subject: [listing_cancellation_policy_changed]
    rule: >-
      The host chooses which cancellation policy the listing offers to new bookings, from the space type's
      cancellation_policy_options; Long-Term is never chosen, because it attaches automatically to long stays under the
      Stays charter. A Super Strict policy can be chosen only when the host account's tier is Professional Host Plus or
      Enterprise Partner (super_strict_min_host_tiers). A host whose tier later falls below those tiers keeps the Super
      Strict policy on stays already booked, but the listing's setting must be moved to a policy the host may choose
      before any further booking is accepted. A change applies to stays booked after the change is saved and never to a
      stay already booked.
    eligibility:
      - id: super_strict_host_tier
        applies_to: [listing_cancellation_policy_changed]
        kind: state
        condition: A Super Strict policy can be chosen only when the host account's tier is Professional Host Plus or Enterprise Partner (super_strict_min_host_tiers).
        evidence_fields: [host_accounts.variant_name, host_accounts.host_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_accounts.host_account_id]
          action_bindings:
            host_accounts.host_account_id: host_account_id
        state_contract:
          field: host_accounts.variant_name
          allowed: [Professional Host Plus, Enterprise Partner]
  - id: listing_evt_quality_assessment
    subject: [listing_quality_reviewed, listing_suspended]
    rule: >-
      Every listing that is listed, snoozed or unlisted is assessed on the quality_assessment_schedule dates. When the
      listing has fewer than quality_min_reviews guest reviews in the lookback window (listing_msr_review_count_365d)
      the outcome is not_assessed. Otherwise the average guest rating (listing_msr_avg_rating_365d) decides it: below
      quality_min_avg_rating the outcome is suspension and the listing is suspended with suspension_reason quality; at or
      above quality_min_avg_rating but below quality_warning_avg_rating the outcome is warning; at or above
      quality_warning_avg_rating the outcome is pass. The thresholds are those of the listing's space type. A
      quality-suspended listing keeps its confirmed stays where quality_suspension_honors_confirmed_stays is true, and
      accepts no new bookings.
    eligibility: []
    measures: [listing_msr_avg_rating_365d, listing_msr_review_count_365d]
    params:
      per_tier:
        Shared Room: {quality_min_avg_rating: "=quality_min_avg_rating", quality_warning_avg_rating: "=quality_warning_avg_rating", quality_min_reviews: "=quality_min_reviews"}
        Private Room: {quality_min_avg_rating: "=quality_min_avg_rating", quality_warning_avg_rating: "=quality_warning_avg_rating", quality_min_reviews: "=quality_min_reviews"}
        Entire Guest Suite: {quality_min_avg_rating: "=quality_min_avg_rating", quality_warning_avg_rating: "=quality_warning_avg_rating", quality_min_reviews: "=quality_min_reviews"}
        Entire Apartment: {quality_min_avg_rating: "=quality_min_avg_rating", quality_warning_avg_rating: "=quality_warning_avg_rating", quality_min_reviews: "=quality_min_reviews"}
        Entire Home: {quality_min_avg_rating: "=quality_min_avg_rating", quality_warning_avg_rating: "=quality_warning_avg_rating", quality_min_reviews: "=quality_min_reviews"}
        Luxury Villa: {quality_min_avg_rating: "=quality_min_avg_rating", quality_warning_avg_rating: "=quality_warning_avg_rating", quality_min_reviews: "=quality_min_reviews"}
    formula:
      quality_outcome: '"not_assessed" if listing_msr_review_count_365d < quality_min_reviews else ("suspension" if listing_msr_avg_rating_365d < quality_min_avg_rating else ("warning" if listing_msr_avg_rating_365d < quality_warning_avg_rating else "pass"))'
  - id: listing_evt_registration_compliance
    subject: [listing_registration_recorded, listing_regulatory_notice_recorded, listing_suspended]
    rule: >-
      A jurisdiction that finds a listing without a valid registration sends a notice, recorded with its reference
      exactly as issued and a cure deadline of registration_notice_cure_days calendar days after the notice date. A
      listing under a notice is suspended for registration only when no new registration number has been recorded by the
      cure deadline; the deadline is the notice date plus registration_notice_cure_days calendar days, and a number
      recorded on the deadline itself cures the notice. Recording a registration number replaces the previous one; it is
      recorded verbatim and never reformatted. A registration-suspended listing is reinstated only through an approved
      reinstatement request that carries the new registration number.
    eligibility:
      - id: cure_deadline_passed
        applies_to: [listing_suspended]
        kind: time
        condition: A listing under a notice is suspended for registration only when no new registration number has been recorded by the cure deadline; the deadline is the notice date plus registration_notice_cure_days calendar days, and a number recorded on the deadline itself cures the notice.
        evidence_fields: [listing_events.event_date, listing_events.cure_deadline, listing_events.notice_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [listing_events.notice_reference]
          action_bindings:
            listing_events.notice_reference: notice_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the notice date
          anchor_source: listing_events.event_date
          relation: not_before
          duration_source: variants.registration_notice_cure_days
          unit: calendar_days
          counting_rule: the deadline is the notice date plus registration_notice_cure_days calendar days, and a number recorded on the deadline itself cures the notice.
          boundary: exclusive
  - id: listing_evt_availability_changes
    subject: [listing_snoozed, listing_unsnoozed, listing_unlisted, listing_relisted, listing_removed]
    rule: >-
      Snoozing and unlisting stop new bookings only; confirmed stays go ahead when snooze_keeps_confirmed_stays is true,
      and the host remains bound to them. A snoozed listing returns to listed on its snooze end date or when the host
      ends the snooze. A listing can be removed only when none of its stays is requested, confirmed or checked in; the
      host must first resolve those stays, and a host cancellation of them is a host cancellation under the Host Accounts
      charter. Removal is permanent when removed_listing_relist_allowed is false: a removed listing never returns, and the
      host creates a new listing instead.
    eligibility:
      - id: no_open_stays_on_removal
        applies_to: [listing_removed]
        kind: state
        condition: A listing can be removed only when none of its stays is requested, confirmed or checked in; the host must first resolve those stays, and a host cancellation of them is a host cancellation under the Host Accounts charter.
        evidence_fields: [stays.status, stays.listing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [stays.listing_id]
          action_bindings:
            stays.listing_id: listing_id
        state_contract:
          field: stays.status
          allowed: [completed, cancelled_by_guest, cancelled_by_host, declined, expired]
  - id: listing_evt_calendar_block
    subject: [listing_calendar_blocked]
    rule: >-
      When the host cancels a confirmed stay and host_cancel_calendar_block is true, every night of the cancelled stay
      is blocked on the listing's calendar (block_start_date is the stay's check-in date and block_end_date its check-out
      date), so the host cannot re-sell the same nights. The block is placed once per cancelled stay, is never lifted by
      the host or by support, and applies even when the host cancellation penalty is waived.
    eligibility:
      - id: one_block_per_stay
        applies_to: [listing_calendar_blocked]
        kind: dedup
        condition: The block is placed once per cancelled stay, is never lifted by the host or by support, and applies even when the host cancellation penalty is waived.
        evidence_fields: [listing_events.stay_id, listing_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [listing_events.stay_id]
          action_bindings:
            listing_events.stay_id: stay_id
        dedup_contract:
          table: listing_events
          mode: separate_record
          object_bindings: {stay_id: stay_id}
          duplicate_filters: {event_type: [listing_calendar_blocked]}
          distinct_fields: []
  - id: listing_evt_reinstatement
    subject: [listing_reinstated]
    rule: >-
      A suspended listing returns to listed only through a reinstatement request decided by Roamhaven's listing review
      team. A listing is reinstated only when its reinstatement request has been approved. A quality-suspended listing is
      reinstated no earlier than quality_suspension_min_days calendar days after the suspension date; the days are
      counted from suspended_date, and reinstatement on the last day of the period is allowed. A listing suspended for
      registration is reinstated only after the registration number carried on the approved request has been recorded on
      the listing. A listing suspended because its host account was suspended is reinstated only after the host account
      is active again, and listing_agg_live_listing_limits applies to every reinstatement. A denied request leaves the
      listing suspended, and Roamhaven may then remove it.
    eligibility:
      - id: reinstatement_approved
        applies_to: [listing_reinstated]
        kind: state
        condition: A listing is reinstated only when its reinstatement request has been approved.
        evidence_fields: [listing_reinstatement_requests.request_status, listing_reinstatement_requests.reinstatement_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [listing_reinstatement_requests.reinstatement_request_id]
          action_bindings:
            listing_reinstatement_requests.reinstatement_request_id: reinstatement_request_id
        state_contract:
          field: listing_reinstatement_requests.request_status
          allowed: [approved]
      - id: quality_minimum_period
        applies_to: [listing_reinstated]
        kind: time
        condition: A quality-suspended listing is reinstated no earlier than quality_suspension_min_days calendar days after the suspension date; the days are counted from suspended_date, and reinstatement on the last day of the period is allowed.
        evidence_fields: [listings.suspended_date, listings.suspension_reason, listings.listing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [listings.listing_id]
          action_bindings:
            listings.listing_id: listing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension date
          anchor_source: listings.suspended_date
          relation: not_before
          duration_source: variants.quality_suspension_min_days
          unit: calendar_days
          counting_rule: the days are counted from suspended_date, and reinstatement on the last day of the period is allowed.
          boundary: inclusive
  - id: listing_evt_safety_standards
    subject: [listing_suspended]
    rule: >-
      Every listing must respect the house standards of its space type: no camera inside the listing where
      indoor_cameras_allowed is false, every exterior camera or noise monitor disclosed where
      exterior_camera_disclosure_required is true, working smoke and carbon monoxide alarms where
      smoke_and_co_alarms_required is true, and no party or event where party_ban_applies is true. A listing is suspended
      with suspension_reason safety when Roamhaven's trust and safety team confirms a breach; the confirmation is a
      policy strike recorded on the host account under the Host Accounts charter, never a guest's or a host's own
      account of events. A listing is suspended with suspension_reason host_account whenever its host account is
      suspended. A safety-suspended listing does not honour its confirmed stays: they are cancelled by Roamhaven and
      refunded as host cancellations.
    eligibility: []
