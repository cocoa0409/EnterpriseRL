# Policy charter of the Payout Methods category at Roamhaven.
# A payout method is the contract a host holds for receiving earnings through one payment rail. Its tier
# is the rail (ACH direct deposit, Fast Pay to a debit card, PayPal, Payoneer, international wire,
# Western Union cash pickup), which fixes fees, speed, limits, currencies and verification. Each method
# carries an undisbursed balance: host earnings released for stays, credits and returned transfers come
# in; transfers, fees, tax withholding and deductions go out. Holds are documentary records.

category: payout
display_name: Payout Methods

binding:
  holding_table: payout_methods
  event_tables: [payout_transactions]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_verification, active, on_hold, removed]
  transitions:
    - {from: pending_verification, to: active, by: system, means: "The method passes verification and can receive transfers."}
    - {from: pending_verification, to: removed, by: system, means: "Verification was not completed in time and the method is discarded."}
    - {from: active, to: on_hold, by: system, means: "A transfer to the method was returned, or the method went dormant, and it receives nothing until the host re-verifies it."}
    - {from: on_hold, to: active, by: agent, means: "Support reactivates the method after the host's updated details were re-verified."}
    - {from: active, to: removed, by: user, means: "The host removes the method."}
    - {from: on_hold, to: removed, by: user, means: "The host removes a method on hold."}

accounts:
  - key: undisbursed_balance
    unit: USD
    meaning: Host money attributed to this payout method and not yet transferred out — released earnings, credits and returned transfers in; transfers, fees, withholding and deductions out.

parameter_schema:
  fee_pct: "decimal percent of the transfer amount charged per transfer"
  fee_fixed_usd: "decimal USD charged per transfer"
  fee_cap_usd: "decimal USD, highest percentage fee per transfer; 0.00 where no percentage fee applies"
  cross_currency_fee_pct: "decimal percent of the transfer charged when the method's payout_currency is not USD"
  cross_currency_fee_cap_usd: "decimal USD, highest cross-currency fee per transfer; 0.00 means no cap"
  conversion_basis: "string, the exchange rate used for non-USD transfers"
  supported_currencies: "list, payout currencies the rail supports"
  available_countries: "list, countries of the host's bank or receiver profile where the rail is offered"
  processing_business_days: "int, business days from transfer to arrival; 0 means within the same day"
  instant_arrival: "bool, whether funds arrive within minutes"
  weekend_processing: "bool, whether transfers are sent on weekends and holidays"
  business_day_calendar: "string, calendar defining business days"
  min_payout_usd: "decimal USD, smallest transfer sent"
  max_single_payout_usd: "decimal USD, largest single transfer"
  below_minimum_handling: "string, what happens to an amount below the minimum"
  over_maximum_handling: "string, what happens to an amount above the maximum"
  new_method_hold_days: "int, calendar days after verification during which transfers to the new method are held"
  verification_method: "string, how the method is verified"
  verification_deadline_days: "int, calendar days after adding the method to complete verification"
  verification_attempts_max: "int, failed verification attempts allowed before the method is discarded"
  default_change_security_hold_hours: "int, elapsed hours after the default method is changed during which transfers to the new default are held"
  returned_payout_fee_usd: "decimal USD charged when a transfer to the method is returned"
  returned_payout_handling: "string, what happens when a transfer is returned"
  release_hours_after_check_in: "int, elapsed hours after the start of the check-in date at which a stay's earnings are released"
  long_term_release_basis: "string, release timing for monthly-installment stays"
  earnings_basis: "string, how the earnings released for a stay are computed"
  backup_withholding_pct: "decimal percent withheld from released earnings of a US host without a W-9 on file"
  nonresident_withholding_pct: "decimal percent withheld from released earnings of a non-US host without a W-8 on file"
  withholding_base: "string, the amount withholding is computed on"
  negative_balance_recovery: "string, how amounts owed by the host are recovered"
  unrecovered_deficit_escalation_days: "int, calendar days after which an unrecovered deficit leaves support's hands for collections"
  listing_routing_allowed: "bool, whether one listing's earnings may be routed to this method instead of the default"
  annual_card_fee_usd: "decimal USD, yearly fee charged by the rail provider (not by Roamhaven)"
  name_match_required: "bool, whether the account holder name must match the host's legal or business name"
  trace_reference_available: "bool, whether the rail provides a trace reference for a sent transfer"
  suspension_hold_scope: "string, which transfers an account-suspension hold stops"
  hold_release_on_reinstatement: "string, when account-suspension holds are released"
  risk_review_hold_business_days: "int, business days a risk-review hold lasts before release"
  fee_rounding: "string, rounding of payout fees and withholding"
  fee_base: "string, the amount the percentage fee applies to"
  claim_credit_routing: "string, the method protection reimbursements and guest damage payments are credited to"
  removal_reroute: "string, what happens to a removed method's undisbursed balance"
  dormant_method_days: "int, calendar days without a transfer after which an active method is placed on hold as dormant"
  reactivation_requires: "string, what is needed before a method on hold is reactivated"
  currency_of_record: "string, currency in which balances and amounts are recorded"
  min_methods_for_removal_of_default: "int, active methods the host must hold for the default method to be removed"
  transfer_cutoff_time: "string, cut-off after which a transfer starts the next business day"
  statement_frequency: "string, how often the host receives an earnings statement"

