events:
  - type: protect_plan_enrolled
    target: protection_plans
    mutation: create
    meaning: A HostCover plan is opened on a listing — automatically at Essential when the listing is published, or by the host choosing a paid level.
    grain: one row per plan
    fields:
      protection_plan_id: reference number of the plan
      customer_id: the host
      host_account_id: the host account
      listing_id: the listing covered
      variant_name: the HostCover level
      status: pending_activation at enrollment
      enrolled_date: date enrolled
      effective_date: enrolled_date plus the level's waiting period
    triggers: []
  - type: protect_plan_activated
    target: protection_plans
    mutation: {transition: {from: pending_activation, to: active}}
    meaning: The plan's effective date arrives.
    grain: one row per plan
    fields:
      protection_plan_id: the plan
      status: becomes active
      plan_year_start: first day of the current plan year
    triggers: []
  - type: protect_plan_tier_changed
    target: protection_plans
    mutation: update
    meaning: The host moves the plan to another HostCover level.
    grain: one row per plan (each change rewrites the current level)
    fields:
      protection_plan_id: the plan
      variant_name: the new level
      tier_changed_date: date of the change
    triggers: []
  - type: protect_plan_cancelled
    target: protection_plans
    mutation: {transition: [{from: pending_activation, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The host cancels the plan.
    grain: one row per plan
    fields:
      protection_plan_id: the plan
      status: becomes cancelled
      cancelled_date: date cancelled
    triggers: []
  - type: protect_plan_lapsed
    target: protection_plans
    mutation: {transition: {from: active, to: lapsed}}
    meaning: The plan ends because its listing was removed or the host account deactivated.
    grain: one row per plan
    fields:
      protection_plan_id: the plan
      status: becomes lapsed
      cancelled_date: date it lapsed
    triggers: []
  - type: protect_premium_charged
    target: protection_events
    meaning: The premium of a paid level is charged on one stay when the stay's earnings are released.
    grain: one row per stay
    distinguish_by: [stay_id]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date charged
      stay_id: the stay covered
      premium_base_amount: the stay's premium base
      amount: premium charged, positive
    account: premiums
    direction: in
    triggers:
      - event: payout:payout_deduction_applied
        map: {stay_id: stay_id, amount: amount, deduction_type: protection_premium}
  - type: protect_premium_refunded
    target: protection_events
    meaning: Part or all of a stay's premium is refunded because host-funded refunds reduced the stay's premium base.
    grain: one row per stay per refund date
    distinguish_by: [stay_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date refunded
      stay_id: the stay
      premium_base_amount: the reduction in the premium base
      amount: premium refunded, positive
    account: premiums
    direction: out
    triggers:
      - event: payout:payout_adjustment_credited
        map: {stay_id: stay_id, amount: amount, credit_type: premium_refund}
  - type: protect_guest_payment_requested
    target: protection_events
    meaning: The host's request for payment is sent to the guest of the stay on a filed claim.
    grain: one row per claim
    distinguish_by: [claim_id]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date the request was sent
      claim_id: the claim
      stay_id: the stay the damage arose from
      amount: amount requested from the guest, positive
    triggers: []
  - type: protect_guest_payment_recorded
    target: protection_events
    meaning: The guest pays some or all of the requested amount toward the claim.
    grain: one row per guest payment on a claim
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date paid
      claim_id: the claim
      stay_id: the stay
      guest_response: paid_in_full or paid_partial
      amount: amount the guest paid, positive
    account: guest_recoveries
    direction: in
    triggers:
      - event: payout:payout_adjustment_credited
        map: {stay_id: stay_id, amount: amount, credit_type: guest_damage_payment}
  - type: protect_guest_payment_reversed
    target: protection_events
    meaning: A guest payment on a claim is reversed by the guest's card issuer.
    grain: one row per reversed guest payment
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date reversed
      claim_id: the claim
      stay_id: the stay
      amount: amount reversed, positive
    account: guest_recoveries
    direction: out
    triggers:
      - event: payout:payout_deduction_applied
        map: {stay_id: stay_id, amount: amount, deduction_type: guest_payment_reversal}
  - type: protect_reimbursement_paid
    target: protection_events
    meaning: Roamhaven pays the host the payable amount of an approved claim.
    grain: one row per claim
    distinguish_by: [claim_id]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date paid
      claim_id: the claim
      stay_id: the stay
      verified_loss_amount: the loss verified by the claims team, before depreciation, offsets, deductible and limits
      amount: reimbursement paid, positive
    account: reimbursements
    direction: in
    triggers:
      - event: payout:payout_adjustment_credited
        map: {stay_id: stay_id, amount: amount, credit_type: claim_reimbursement}
  - type: protect_reimbursement_recovered
    target: protection_events
    meaning: Roamhaven recovers from the responsible guest part or all of a reimbursement it paid.
    grain: one row per recovery on a claim
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date recovered
      claim_id: the claim
      stay_id: the stay
      amount: amount recovered, positive
    account: reimbursements
    direction: out
    triggers: []
  - type: protect_claim_denied
    target: protection_events
    meaning: A claim is refused, with the reason recorded.
    grain: one row per denial of a claim (an appeal decision is a second denial row)
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date denied
      claim_id: the claim
      stay_id: the stay
      denial_reason: filed_late, no_guest_request, excluded_damage, insufficient_evidence, coverage_inactive, below_minimum, claim_limit_reached or not_escalated_in_time
    triggers: []

measures:
  - id: protect_msr_net_reimbursed_plan_year
    window: the current plan year of the plan (plan_year_start to the day before its next anniversary)
    measure: sum of protect_reimbursement_paid amounts minus protect_reimbursement_recovered amounts on the plan whose posted_date falls in the window
  - id: protect_msr_paid_claims_plan_year
    window: the current plan year of the plan
    measure: count of distinct claim_id values on the plan with a protect_reimbursement_paid row whose posted_date falls in the window

policies:
  - id: protect_agg_multi_holding
    subject: [protect_plan_enrolled]
    rule: >-
      A host holds HostCover per listing: each listing carries exactly one plan that is pending_activation or active at
      a time, and a host with several listings holds several plans, each with its own level, limits, plan year and
      claims. HostCover Essential is enrolled automatically when a listing is first published; choosing a paid level
      changes that plan's level rather than opening a second plan. There is no cap on the number of plans a host holds.
    eligibility: []
    params:
      max_per_customer: null
  - id: protect_agg_plan_year_limits
    subject: [protect_reimbursement_paid]
    rule: >-
      Limits are counted per plan and per plan year, never pooled across a host's listings. A claim is paid only while
      the plan's net reimbursements this plan year (protect_msr_net_reimbursed_plan_year) are below
      annual_aggregate_limit_usd, and the payment is cut to the remaining aggregate. A claim is paid only while fewer
      than max_paid_claims_per_plan_year claims have been paid this plan year (protect_msr_paid_claims_plan_year); a
      claim beyond that count is denied as claim_limit_reached. Recoveries from guests restore the aggregate because the
      aggregate is counted net.
    eligibility: []
    measures: [protect_msr_net_reimbursed_plan_year, protect_msr_paid_claims_plan_year]
    formula:
      remaining_aggregate: max(annual_aggregate_limit_usd - protect_msr_net_reimbursed_plan_year, 0)
  - id: protect_evt_enrollment_and_level
    subject: [protect_plan_enrolled, protect_plan_activated, protect_plan_tier_changed, protect_plan_cancelled, protect_plan_lapsed]
    rule: >-
      A level may be held only on a listing whose space type is in the level's eligible_space_types, while the host
      account is active. A plan becomes effective waiting_period_days calendar days after enrollment, and its plan year
      runs from the effective date and renews on each anniversary. A level change takes effect for stays checking in
      after the change date; stays already checked in stay under the level they checked in under. A plan's level can be
      changed only when at least tier_change_cooldown_days calendar days have passed since its last level change; the
      days are counted from tier_changed_date (or from enrolled_date when the level was never changed), and a change on
      the last day of the period is allowed. Cancelling a plan never refunds premiums already charged when
      unearned_premium_refund_on_cancellation is false, and a cancelled paid plan falls back to HostCover Essential only
      through a new enrollment. A plan lapses when its listing is removed or its host account is deactivated. A plan
      that is cancelled or lapsed still covers stays that checked in while it was active.
    eligibility:
      - id: level_change_cooldown
        applies_to: [protect_plan_tier_changed]
        kind: time
        condition: A plan's level can be changed only when at least tier_change_cooldown_days calendar days have passed since its last level change; the days are counted from tier_changed_date (or from enrolled_date when the level was never changed), and a change on the last day of the period is allowed.
        evidence_fields: [protection_plans.tier_changed_date, protection_plans.enrolled_date, protection_plans.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.protection_plan_id]
          action_bindings:
            protection_plans.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its last level change
          anchor_source: protection_plans.tier_changed_date
          relation: not_before
          duration_source: variants.tier_change_cooldown_days
          unit: calendar_days
          counting_rule: the days are counted from tier_changed_date (or from enrolled_date when the level was never changed), and a change on the last day of the period is allowed.
          boundary: inclusive
  - id: protect_evt_premium
    subject: [protect_premium_charged, protect_premium_refunded]
    rule: >-
      A paid level charges a premium on each stay it covers, when the stay's earnings are released: premium_pct of the
      premium base (the stay's nightly_subtotal and cleaning_fee), raised to premium_min_per_stay_usd when lower, then
      reduced by superhost_premium_discount_pct when the host account's tier is Superhost on the stay's check-in date,
      rounded half up to the cent. The minimum is applied before the discount. A premium is charged only on a plan whose
      status is active. A premium is charged once per stay. HostCover Essential charges nothing. When host-funded guest
      refunds later reduce the stay's premium base, the premium is refunded in the same proportion, never more than was
      charged.
    eligibility:
      - id: plan_active_for_premium
        applies_to: [protect_premium_charged]
        kind: state
        condition: A premium is charged only on a plan whose status is active.
        evidence_fields: [protection_plans.status, protection_plans.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.protection_plan_id]
          action_bindings:
            protection_plans.protection_plan_id: protection_plan_id
        state_contract:
          field: protection_plans.status
          allowed: [active]
      - id: one_premium_per_stay
        applies_to: [protect_premium_charged]
        kind: dedup
        condition: A premium is charged once per stay.
        evidence_fields: [protection_events.stay_id, protection_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.stay_id]
          action_bindings:
            protection_events.stay_id: stay_id
        dedup_contract:
          table: protection_events
          mode: separate_record
          object_bindings: {stay_id: stay_id}
          duplicate_filters: {event_type: [protect_premium_charged]}
          distinct_fields: []
    params:
      per_tier:
        HostCover Essential: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Standard: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Plus: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Premier: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Elite: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Estate: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
    formula:
      amount: round(max(premium_base_amount * premium_pct / 100, premium_min_per_stay_usd) * (100 - superhost_premium_discount_pct) / 100, 2)
  - id: protect_evt_guest_request
    subject: [protect_guest_payment_requested, protect_guest_payment_recorded, protect_guest_payment_reversed]
    rule: >-
      A host claims for guest damage by filing a claim on the stay and, where guest_request_required is true, by first
      asking the guest of that stay to pay. A payment request is sent to the guest only for a claim filed within
      claim_filing_window_days calendar days after the stay's check-out date; the days are counted from check_out_date to
      the date part of the claim's filed_at, and a claim filed on the last day stands. The guest has guest_response_hours
      elapsed hours from the request to pay in full, pay part, or decline; only the guest can pay, and paying is the
      guest's own act. A guest payment is credited to the host and reduces what Roamhaven pays; a payment reversed by the
      guest's card issuer is recovered from the host's payouts. A claim may be filed only once per stay per damage
      category (claims_per_stay_per_category), and a claimed amount below min_claim_amount_usd is not accepted.
    eligibility:
      - id: filed_in_window
        applies_to: [protect_guest_payment_requested]
        kind: time
        condition: A payment request is sent to the guest only for a claim filed within claim_filing_window_days calendar days after the stay's check-out date; the days are counted from check_out_date to the date part of the claim's filed_at, and a claim filed on the last day stands.
        evidence_fields: [stays.check_out_date, protection_claims.filed_at, protection_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_claims.claim_id]
          action_bindings:
            protection_claims.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the stay's check-out date
          anchor_source: stays.check_out_date
          relation: not_after
          duration_source: variants.claim_filing_window_days
          unit: calendar_days
          counting_rule: the days are counted from check_out_date to the date part of the claim's filed_at, and a claim filed on the last day stands.
          boundary: inclusive
  - id: protect_evt_reimbursement
    subject: [protect_reimbursement_paid]
    rule: >-
      Roamhaven pays a claim only after the guest has not paid it in full. A reimbursement is paid only on a claim the
      claims team has approved. A claim is escalated to Roamhaven only after the guest's response deadline has passed or
      the guest has declined, and the host must escalate within escalation_window_days calendar days after the guest's
      response deadline; the deadline is the request time plus guest_response_hours, and the days are counted from the
      date part of that deadline, an escalation on the last day standing. The stay must have checked in on or after the
      plan's effective date while the plan was active. The payable amount is computed in this order: start from the
      verified loss; for property_damage, pet_damage, theft and valuables claims, when depreciation_applies is true,
      deduct the depreciation_schedule percentage for the item's age in whole months (0-12, 13-36, 37-60, 61 and over);
      for a deep_cleaning claim, when deep_cleaning_offset_by_cleaning_fee is true, deduct the cleaning fee collected on
      the stay; subtract every guest payment recorded on the claim (net of reversals); subtract deductible_usd; floor at
      0.00; then cut to the category's sublimit (pet_damage_sublimit_usd, deep_cleaning_sublimit_usd, theft_sublimit_usd
      or valuables_sublimit_usd; property_damage and income_loss have none), to per_claim_limit_usd, and to the remaining
      aggregate under protect_agg_plan_year_limits. An income_loss claim is covered only where income_loss_covered is
      true, its verified loss is the nightly subtotal of the stays the host had to cancel for at most
      income_loss_max_nights nights, and it takes no depreciation. A payable amount of 0.00 is recorded as a denial, not
      a payment. A claim is reimbursed once. The reimbursement is credited to the default payout method.
    eligibility:
      - id: claim_approved
        applies_to: [protect_reimbursement_paid]
        kind: state
        condition: A reimbursement is paid only on a claim the claims team has approved.
        evidence_fields: [protection_claims.claim_status, protection_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_claims.claim_id]
          action_bindings:
            protection_claims.claim_id: claim_id
        state_contract:
          field: protection_claims.claim_status
          allowed: [approved]
      - id: escalated_in_time
        applies_to: [protect_reimbursement_paid]
        kind: time
        condition: A claim is escalated to Roamhaven only after the guest's response deadline has passed or the guest has declined, and the host must escalate within escalation_window_days calendar days after the guest's response deadline; the deadline is the request time plus guest_response_hours, and the days are counted from the date part of that deadline, an escalation on the last day standing.
        evidence_fields: [protection_claims.guest_response_due_at, protection_claims.escalated_at, protection_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_claims.claim_id]
          action_bindings:
            protection_claims.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the guest's response deadline
          anchor_source: protection_claims.guest_response_due_at
          relation: not_after
          duration_source: variants.escalation_window_days
          unit: calendar_days
          counting_rule: the deadline is the request time plus guest_response_hours, and the days are counted from the date part of that deadline, an escalation on the last day standing.
          boundary: inclusive
      - id: one_reimbursement_per_claim
        applies_to: [protect_reimbursement_paid]
        kind: dedup
        condition: A claim is reimbursed once.
        evidence_fields: [protection_events.claim_id, protection_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.claim_id]
          action_bindings:
            protection_events.claim_id: claim_id
        dedup_contract:
          table: protection_events
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [protect_reimbursement_paid]}
          distinct_fields: []
    params:
      per_tier:
        HostCover Essential: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Standard: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Plus: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Premier: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Elite: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Estate: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
    formula:
      amount: min(max(verified_loss_amount - deductible_usd, 0), per_claim_limit_usd)
  - id: protect_evt_exclusions_and_denial
    subject: [protect_claim_denied]
    rule: >-
      A claim is denied, with the matching denial_reason, when it was filed after the filing window (filed_late), when
      no payment request was sent to the guest first (no_guest_request), when the damage is excluded — ordinary wear and
      tear, cash or securities, vehicles or watercraft, damage present before the stay, or damage caused by the host or
      the host's staff (excluded_damage) — when the claim lacks the evidence_required (insufficient_evidence), when the
      stay did not check in under an active plan (coverage_inactive), when the claimed amount is below
      min_claim_amount_usd (below_minimum), when the plan year's paid-claim count is used up (claim_limit_reached), or
      when the host did not escalate in time (not_escalated_in_time). Damage by a guest's service animal is covered as
      pet damage when service_animal_damage_covered is true. Bodily injury and third-party liability are never decided
      by support when liability_claims_handled_by_support is false. A host may appeal a denial once
      (appeals_per_claim) within appeal_window_days; the claims team's decision on the appeal is final.
    eligibility: []
  - id: protect_evt_subrogation
    subject: [protect_reimbursement_recovered]
    rule: >-
      After paying a claim, Roamhaven pursues the responsible guest for the amount it paid when subrogation_applies is
      true. Every amount recovered is booked against the claim, never exceeds the reimbursement paid on that claim net
      of earlier recoveries, and restores the plan-year aggregate. Recoveries never reach the host: the host was already
      paid, and a guest payment made after the reimbursement is a recovery, not a guest payment to the host.
    eligibility: []
