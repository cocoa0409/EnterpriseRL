events:
  - type: rewards_enrolled
    target: rewards_memberships
    mutation: create
    meaning: A guest enrolls in Roamhaven Rewards.
    grain: one row per membership
    fields:
      rewards_membership_id: reference number of the membership
      customer_id: the guest
      variant_name: Rewards Member at enrollment
      status: pending_confirmation at enrollment
      enrolled_date: date enrolled
    triggers: []
  - type: rewards_activated
    target: rewards_memberships
    mutation: {transition: {from: pending_confirmation, to: active}}
    meaning: The guest confirms enrollment.
    grain: one row per membership
    fields:
      rewards_membership_id: the membership
      status: becomes active
      last_activity_date: set to the confirmation date
    triggers: []
  - type: rewards_tier_changed
    target: rewards_memberships
    mutation: update
    meaning: The member's tier changes at qualification or at the annual review.
    grain: one row per membership (each change rewrites the current tier)
    fields:
      rewards_membership_id: the membership
      variant_name: the new tier
      tier_valid_through: last day the tier is held
    triggers: []
  - type: rewards_suspended
    target: rewards_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: The membership is frozen for review.
    grain: one row per membership
    fields:
      rewards_membership_id: the membership
      status: becomes suspended
    triggers: []
  - type: rewards_reinstated
    target: rewards_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspension is lifted after a cleared review.
    grain: one row per membership
    fields:
      rewards_membership_id: the membership
      status: becomes active
    triggers: []
  - type: rewards_closed
    target: rewards_memberships
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}, {from: pending_confirmation, to: closed}]}
    meaning: The membership ends.
    grain: one row per membership
    fields:
      rewards_membership_id: the membership
      status: becomes closed
      closed_date: date closed
    triggers: []
  - type: rewards_credit_earned
    target: rewards_transactions
    meaning: Credits are earned on a completed stay.
    grain: one row per earning stay
    distinguish_by: [stay_id]
    fields:
      rewards_membership_id: the membership
      customer_id: the guest
      posted_date: date posted
      stay_id: the stay
      eligible_spend: eligible spend of the stay
      amount: credits earned, positive
    account: credit_balance
    direction: in
    triggers: []
  - type: rewards_bonus_credited
    target: rewards_transactions
    meaning: Bonus credits are granted — a Superhost-stay bonus on a stay or a tier-upgrade bonus.
    grain: one row per bonus type per stay or per status year
    distinguish_by: [bonus_type, stay_id, posted_date]
    fields:
      rewards_membership_id: the membership
      customer_id: the guest
      posted_date: date posted
      stay_id: the stay for a Superhost-stay bonus; empty for a tier-upgrade bonus
      bonus_type: superhost_stay or tier_upgrade
      amount: credits granted, positive
    account: credit_balance
    direction: in
    triggers: []
  - type: rewards_credit_redeemed
    target: rewards_transactions
    meaning: Credits are applied to a new booking.
    grain: one row per booking redeemed on
    distinguish_by: [stay_id]
    fields:
      rewards_membership_id: the membership
      customer_id: the guest
      posted_date: date redeemed
      stay_id: the booking paid with credits
      amount: credits redeemed, positive
    account: credit_balance
    direction: out
    triggers: []
  - type: rewards_credit_reinstated
    target: rewards_transactions
    meaning: Credits redeemed on a stay come back because the stay was refunded.
    grain: one row per reinstatement on a stay
    distinguish_by: [stay_id, posted_date]
    fields:
      rewards_membership_id: the membership
      customer_id: the guest
      posted_date: date reinstated
      stay_id: the refunded stay
      original_txn_id: the redemption reinstated
      credit_expiry_date: date the reinstated credits expire
      amount: credits reinstated, positive
    account: credit_balance
    direction: in
    triggers: []
  - type: rewards_credit_expired
    target: rewards_transactions
    meaning: The balance expires after inactivity, or reinstated credits expire unused, or the balance is forfeited on closure.
    grain: one row per expiry event
    distinguish_by: [posted_date, original_txn_id]
    fields:
      rewards_membership_id: the membership
      customer_id: the guest
      posted_date: date expired
      original_txn_id: the reinstatement expiring; empty for an inactivity or closure expiry of the whole balance
      amount: credits expired, positive
    account: credit_balance
    direction: out
    triggers: []
  - type: rewards_credit_clawed_back
    target: rewards_transactions
    meaning: Credits earned on a stay are taken back because the stay was later refunded.
    grain: one row per clawback on a stay
    distinguish_by: [stay_id, posted_date]
    fields:
      rewards_membership_id: the membership
      customer_id: the guest
      posted_date: date clawed back
      stay_id: the refunded stay
      original_txn_id: the earning reduced
      amount: credits clawed back, positive
    account: credit_balance
    direction: out
    triggers: []

measures:
  - id: rewards_msr_qualifying_nights_year
    window: the calendar year being reviewed, by check-out date
    measure: sum of nights actually stayed on the member's completed stays and on stays the member cancelled after check-in, plus rollover nights carried in
  - id: rewards_msr_qualifying_stays_year
    window: the calendar year being reviewed, by check-out date
    measure: count of the member's completed stays
  - id: rewards_msr_last_activity
    window: lifetime of the membership
    measure: the latest posted_date among rewards_credit_earned and rewards_credit_redeemed rows, or the activation date when there is none

policies:
  - id: rewards_agg_multi_holding
    subject: [rewards_enrolled]
    rule: >-
      A guest may hold one Roamhaven Rewards membership; a second enrollment by a guest whose membership is not closed
      is not opened, and a membership closed for a terms breach cannot be reopened. Pooling with up to
      household_pooling_members other members lets a member redeem pooled credits, but each membership keeps its own
      tier, balance and history.
    eligibility: []
    params:
      max_per_customer: 1
  - id: rewards_tier_qualification
    subject: [rewards_tier_changed]
    rule: >-
      A member qualifies for a tier in a calendar year by reaching its qualifying_nights_min
      (rewards_msr_qualifying_nights_year) or its qualifying_stays_alt_min (rewards_msr_qualifying_stays_year), the
      highest tier reached winning; an upgrade takes effect on the day it is reached and holds through
      status_valid_through. At the tier_review_date a member who did not requalify drops by no more than
      tier_soft_landing_levels tier. Where rollover_nights_allowed is true, nights beyond those needed for the tier
      reached roll into the next year up to rollover_nights_max. Reaching a tier for the first time in a status year
      grants tier_upgrade_bonus_usd once.
    eligibility: []
    measures: [rewards_msr_qualifying_nights_year, rewards_msr_qualifying_stays_year]
  - id: rewards_evt_earning
    subject: [rewards_credit_earned, rewards_bonus_credited]
    rule: >-
      A completed stay earns earn_pct of its eligible spend (nightly_subtotal and cleaning_fee net of refunds) at the
      member's tier on the check-out date, plus superhost_stay_bonus_pct when the stay's host account was a Superhost on
      the check-out date (booked as a separate superhost_stay bonus), the total for the stay cut to
      max_credit_per_stay_usd and rounded per credit_rounding. Credits are earned only while the membership is active.
      Credits post credit_posting_days_after_checkout calendar days after check-out. Stays cancelled by the guest or the
      host earn nothing; non-refundable-rate stays earn when earn_on_non_refundable_rate is true. A stay earns once.
    eligibility:
      - id: member_active_to_earn
        applies_to: [rewards_credit_earned, rewards_bonus_credited]
        kind: state
        condition: Credits are earned only while the membership is active.
        evidence_fields: [rewards_memberships.status, rewards_memberships.rewards_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.rewards_membership_id]
          action_bindings:
            rewards_memberships.rewards_membership_id: rewards_membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [active]
      - id: one_earning_per_stay
        applies_to: [rewards_credit_earned]
        kind: dedup
        condition: A stay earns once.
        evidence_fields: [rewards_transactions.stay_id, rewards_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_transactions.stay_id]
          action_bindings:
            rewards_transactions.stay_id: stay_id
        dedup_contract:
          table: rewards_transactions
          mode: separate_record
          object_bindings: {stay_id: stay_id}
          duplicate_filters: {event_type: [rewards_credit_earned]}
          distinct_fields: []
    params:
      per_tier:
        Rewards Member: {earn_pct: "=earn_pct", max_credit_per_stay_usd: "=max_credit_per_stay_usd"}
        Rewards Silver: {earn_pct: "=earn_pct", max_credit_per_stay_usd: "=max_credit_per_stay_usd"}
        Rewards Gold: {earn_pct: "=earn_pct", max_credit_per_stay_usd: "=max_credit_per_stay_usd"}
        Rewards Platinum: {earn_pct: "=earn_pct", max_credit_per_stay_usd: "=max_credit_per_stay_usd"}
        Rewards Diamond: {earn_pct: "=earn_pct", max_credit_per_stay_usd: "=max_credit_per_stay_usd"}
        Rewards Ambassador: {earn_pct: "=earn_pct", max_credit_per_stay_usd: "=max_credit_per_stay_usd"}
    formula:
      amount: min(round(eligible_spend * earn_pct / 100, 2), max_credit_per_stay_usd)
  - id: rewards_evt_redemption
    subject: [rewards_credit_redeemed]
    rule: >-
      Credits pay for a new booking's total_price, at least redemption_min_usd and at most the lesser of the balance and
      redemption_max_per_booking_usd; on a monthly-installment stay they apply to installment 1 only. Credits are
      redeemed only while the membership is active. Credits never become cash and never move to another member outside
      household pooling. A booking is redeemed on once.
    eligibility:
      - id: member_active_to_redeem
        applies_to: [rewards_credit_redeemed]
        kind: state
        condition: Credits are redeemed only while the membership is active.
        evidence_fields: [rewards_memberships.status, rewards_memberships.rewards_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.rewards_membership_id]
          action_bindings:
            rewards_memberships.rewards_membership_id: rewards_membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [active]
  - id: rewards_evt_reinstatement
    subject: [rewards_credit_reinstated]
    rule: >-
      When a stay paid partly with credits is refunded, the redeemed credits come back in the proportion that the
      refunded amount bears to the stay's total_price, rounded per credit_rounding. Reinstated credits expire on the
      later of the original balance's expiry and reinstated_credit_min_validity_days calendar days after reinstatement.
      Nothing is reinstated while the membership is suspended or after it is closed. A refund reinstates once per
      redemption and refund date.
    eligibility: []
  - id: rewards_evt_expiry
    subject: [rewards_credit_expired]
    rule: >-
      The whole balance expires when the member has had no activity (rewards_msr_last_activity) for
      credit_expiry_inactivity_months. The balance expires only once credit_expiry_inactivity_months calendar months have
      passed since the last activity; the months are added to the last activity date, a month without that day falling
      back to its last day, and the balance survives through that day. The member is told credit_expiry_notice_days
      before. Reinstated credits unused by their own expiry date expire alone. Closing the membership forfeits the
      balance when account_closure_forfeits_credits is true. Support never restores expired credits when
      support_goodwill_credit_allowed is false.
    eligibility:
      - id: inactivity_elapsed
        applies_to: [rewards_credit_expired]
        kind: time
        condition: The balance expires only once credit_expiry_inactivity_months calendar months have passed since the last activity; the months are added to the last activity date, a month without that day falling back to its last day, and the balance survives through that day.
        evidence_fields: [rewards_memberships.last_activity_date, rewards_memberships.rewards_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.rewards_membership_id]
          action_bindings:
            rewards_memberships.rewards_membership_id: rewards_membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the last activity
          anchor_source: rewards_memberships.last_activity_date
          relation: not_before
          duration_source: variants.credit_expiry_inactivity_months
          unit: calendar_months
          counting_rule: the months are added to the last activity date, a month without that day falling back to its last day, and the balance survives through that day.
          boundary: exclusive
    measures: [rewards_msr_last_activity]
  - id: rewards_evt_clawback
    subject: [rewards_credit_clawed_back]
    rule: >-
      When a stay that already earned credits is later refunded and earned_credit_clawback_on_refund is true, the credits
      earned on it (bonus included) are reduced in the proportion that the refunded eligible spend bears to the eligible
      spend it earned on. A clawback is taken from the balance even when that leaves less than was earned elsewhere; it
      never takes the balance below zero, and any shortfall is forgiven.
    eligibility: []
  - id: rewards_evt_membership_status
    subject: [rewards_enrolled, rewards_activated, rewards_suspended, rewards_reinstated, rewards_closed]
    rule: >-
      A guest of at least enrollment_min_age_years enrolls as member_tier_on_enrollment and confirms through the
      enrollment_verification within enrollment_confirmation_days calendar days, or the enrollment closes. A membership
      is suspended only on suspension_reasons, by Roamhaven's review team; while suspended and
      credits_frozen_while_suspended is true, nothing is earned, redeemed or reinstated. A suspension is lifted only when
      the review clears the member, within suspension_review_business_days; a review that upholds the breach closes the
      membership.
    eligibility: []
