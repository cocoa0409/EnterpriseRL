# Policy charter of the Roamhaven Rewards category (guest loyalty).
# A membership is the contract a guest holds in Roamhaven Rewards. Its tier is the status level earned
# by nights or stays in a calendar year, which fixes the credit earn rate, per-stay earn cap, redemption
# ceiling and service perks. Credits (1 credit = 1.00 USD) are earned on completed stays, redeemed
# against new bookings, reinstated when a redeemed booking is refunded, clawed back when an earning
# stay is refunded, and expire after inactivity; every movement is booked in rewards_transactions.

category: rewards
display_name: Roamhaven Rewards

binding:
  holding_table: rewards_memberships
  event_tables: [rewards_transactions]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_confirmation, active, suspended, closed]
  transitions:
    - {from: pending_confirmation, to: active, by: user, means: "The guest confirms enrollment through the emailed link."}
    - {from: pending_confirmation, to: closed, by: system, means: "Enrollment was not confirmed in time."}
    - {from: active, to: suspended, by: system, means: "The membership is frozen for a fraud review or a terms breach."}
    - {from: suspended, to: active, by: agent, means: "The review cleared the member and support lifts the suspension."}
    - {from: active, to: closed, by: user, means: "The guest closes the membership."}
    - {from: suspended, to: closed, by: system, means: "The review upheld the breach and the membership is closed."}

accounts:
  - key: credit_balance
    unit: USD credit
    meaning: Rewards credits available to the member — earned, bonus and reinstated credits in; redeemed, expired and clawed-back credits out.

parameter_schema:
  qualifying_nights_min: "int, nights in the qualification period needed for the tier"
  qualifying_stays_alt_min: "int, completed stays in the qualification period that qualify for the tier instead of nights"
  qualification_period: "string, the period nights and stays are counted over"
  status_valid_through: "string, how long a qualified tier is held"
  tier_review_date: "string, the date tiers are reviewed each year"
  tier_soft_landing_levels: "int, most tiers a member drops at one annual review"
  rollover_nights_allowed: "bool, whether nights beyond the next tier's need roll into the next qualification period"
  rollover_nights_max: "int, most nights rolled over; 0 where not allowed"
  earn_pct: "decimal percent of eligible spend credited on a completed stay"
  eligible_spend_basis: "string, which stay amounts earn credits"
  superhost_stay_bonus_pct: "decimal percent of eligible spend added when the stay's host account was Superhost on the check-out date"
  max_credit_per_stay_usd: "decimal USD credit, most earned on one stay (bonus included)"
  earn_on_non_refundable_rate: "bool, whether non-refundable-rate stays earn"
  earn_on_cancelled_stays: "bool, whether stays cancelled by the guest earn"
  earn_on_host_cancelled_stays: "bool, whether stays cancelled by the host earn"
  credit_posting_days_after_checkout: "int, calendar days after check-out on which earned credits post"
  credit_unit: "string, value of one credit"
  credit_rounding: "string, rounding of credit amounts"
  tier_upgrade_bonus_usd: "decimal USD credit granted once when the member first reaches this tier in a status year"
  bonus_stacking: "string, how earn rate and bonuses combine"
  credit_expiry_inactivity_months: "int, calendar months without activity after which the whole balance expires"
  activity_definition: "string, what counts as activity"
  credit_expiry_notice_days: "int, calendar days before expiry the member is notified"
  redemption_min_usd: "decimal USD credit, smallest redemption"
  redemption_max_per_booking_usd: "decimal USD credit, most redeemed on one booking"
  redemption_applies_to: "string, what credits pay for"
  redemption_on_long_term_stays: "string, how credits apply to a monthly-installment stay"
  reinstatement_on_cancellation: "string, what happens to redeemed credits when the stay is refunded"
  reinstated_credit_min_validity_days: "int, fewest calendar days a reinstated credit stays valid"
  earned_credit_clawback_on_refund: "bool, whether credits earned on a stay are taken back when the stay is later refunded"
  credit_cash_out_allowed: "bool, whether credits can be paid out as cash"
  credit_transfer_allowed: "bool, whether credits can be moved to another member outside household pooling"
  household_pooling_members: "int, other members whose credits this member may pool; 0 where not offered"
  priority_support_line: "bool, whether the member reaches the priority guest support line"
  dedicated_concierge: "bool, whether the member has a named concierge"
  annual_choice_benefit: "bool, whether the member chooses one annual benefit"
  enrollment_min_age_years: "int, youngest age to enroll"
  enrollment_confirmation_days: "int, calendar days to confirm enrollment"
  enrollment_verification: "string, how enrollment is confirmed"
  suspension_reasons: "list, grounds on which a membership is suspended"
  suspension_review_business_days: "int, business days within which a suspension review is decided"
  credits_frozen_while_suspended: "bool, whether no credit is earned, redeemed or reinstated while suspended"
  account_closure_forfeits_credits: "bool, whether closing the membership forfeits the balance"
  support_goodwill_credit_allowed: "bool, whether support may grant credits as goodwill"
  statement_frequency: "string, how often a credit statement is issued"
  qualifying_nights_basis: "string, which nights count toward qualification"
  member_tier_on_enrollment: "string, the tier a new member starts in"
  status_match_allowed: "bool, whether another program's status can be matched"

