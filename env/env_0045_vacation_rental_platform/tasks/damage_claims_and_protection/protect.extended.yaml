# Policy charter of the Host Damage Protection category at Roamhaven (HostCover).
# A protection plan is the contract a host holds for one listing, covering damage caused by guests (and
# their pets) during stays. Its tier is the HostCover level, which fixes limits, deductible, sublimits,
# premium, depreciation and filing windows. HostCover Essential is included free on every published
# listing; higher levels are paid per stay out of the host's earnings. Claims are taken in
# protection_claims (filed by the host, decided by the claims team); premiums, guest payment requests,
# guest payments, reimbursements, recoveries and denials are booked in protection_events.

category: protect
display_name: Host Damage Protection (HostCover)

binding:
  holding_table: protection_plans
  event_tables: [protection_events]
  intake_tables: [protection_claims]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_activation, active, cancelled, lapsed]
  transitions:
    - {from: pending_activation, to: active, by: system, means: "The waiting period ends and the plan starts covering stays."}
    - {from: pending_activation, to: cancelled, by: user, means: "The host cancels the plan before it starts."}
    - {from: active, to: cancelled, by: user, means: "The host cancels the plan; stays already checked in stay covered."}
    - {from: active, to: lapsed, by: system, means: "The listing is removed or the host account is deactivated, and the plan ends."}

accounts:
  - key: premiums
    unit: USD
    meaning: Premiums charged for paid HostCover levels — premiums charged in, premiums refunded out.
  - key: guest_recoveries
    unit: USD
    meaning: Money the responsible guest paid toward claims on this plan — guest payments recorded in, guest payments reversed out.
  - key: reimbursements
    unit: USD
    meaning: Net claim reimbursements Roamhaven paid under this plan — reimbursements paid in, subrogation recoveries out.

parameter_schema:
  per_claim_limit_usd: "decimal USD, most paid on one claim"
  annual_aggregate_limit_usd: "decimal USD, most paid net on all claims in one plan year"
  deductible_usd: "decimal USD, subtracted from every payable claim"
  premium_pct: "decimal percent of the premium base charged per stay"
  premium_min_per_stay_usd: "decimal USD, lowest premium charged on a stay; 0.00 for the free level"
  premium_base: "string, the stay amounts the premium percentage applies to"
  superhost_premium_discount_pct: "decimal percent off the premium for a host whose tier is Superhost on the stay's check-in date"
  pet_damage_sublimit_usd: "decimal USD, most paid on one pet_damage claim"
  deep_cleaning_sublimit_usd: "decimal USD, most paid on one deep_cleaning claim"
  theft_sublimit_usd: "decimal USD, most paid on one theft claim"
  valuables_sublimit_usd: "decimal USD, most paid on one valuables claim (art, jewellery, collectibles); 0.00 means not covered"
  income_loss_covered: "bool, whether bookings the host had to cancel because of guest damage are covered"
  income_loss_max_nights: "int, most cancelled nights paid on one income_loss claim; 0 where not covered"
  income_loss_basis: "string, how lost income is valued"
  depreciation_applies: "bool, whether damaged items are paid at depreciated value (false means replacement cost)"
  depreciation_schedule: "mapping item-age band -> decimal percent deducted from the verified loss"
  deep_cleaning_offset_by_cleaning_fee: "bool, whether a deep_cleaning claim is reduced by the cleaning fee collected on the stay"
  claim_filing_window_days: "int, calendar days after the stay's check-out date within which the claim must be filed"
  guest_response_hours: "int, elapsed hours the guest has to respond to the payment request"
  escalation_window_days: "int, calendar days after the guest's response deadline within which the host must escalate the claim"
  guest_request_required: "bool, whether the host must first request payment from the guest"
  claim_decision_business_days: "int, business days within which the claims team decides an escalated claim"
  claim_payment_business_days: "int, business days after approval within which the reimbursement is paid"
  max_paid_claims_per_plan_year: "int, most claims paid in one plan year"
  min_claim_amount_usd: "decimal USD, smallest claimed amount accepted"
  wear_and_tear_excluded: "bool, whether ordinary wear and tear is excluded"
  cash_and_securities_excluded: "bool, whether cash and securities are excluded"
  vehicles_and_watercraft_excluded: "bool, whether vehicles and watercraft are excluded"
  pre_existing_damage_excluded: "bool, whether damage existing before the stay is excluded"
  intentional_host_damage_excluded: "bool, whether damage caused by the host or the host's staff is excluded"
  liability_claims_handled_by_support: "bool, whether bodily injury or third-party liability claims are handled by support (false means they go to the insurer's adjusters)"
  service_animal_damage_covered: "bool, whether damage by a guest's service animal is covered as pet damage"
  evidence_required: "string, the evidence a claim must carry"
  waiting_period_days: "int, calendar days after enrollment before the plan is effective"
  coverage_trigger: "string, which stays the plan covers"
  eligible_space_types: "list, listing space types that may hold this level"
  tier_change_effective: "string, which stays a level change affects"
  tier_change_cooldown_days: "int, calendar days that must pass between two level changes on one plan"
  premium_refund_mode: "string, how a premium is refunded when the stay is refunded"
  reimbursement_routing: "string, where reimbursements are paid"
  subrogation_applies: "bool, whether Roamhaven recovers paid reimbursements from the responsible guest"
  appeal_window_days: "int, calendar days after a denial within which the host may appeal"
  appeals_per_claim: "int, appeals allowed per claim"
  plan_year_basis: "string, how the plan year is counted"
  guest_payment_offset: "string, how guest payments reduce the payable amount"
  claims_per_stay_per_category: "int, claims allowed per stay per damage category"
  unearned_premium_refund_on_cancellation: "bool, whether cancelling the plan refunds any premium"
  lapse_on_listing_removal: "bool, whether the plan lapses when its listing is removed"
  lapse_on_host_deactivation: "bool, whether the plan lapses when the host account is deactivated"
  coverage_territory: "string, where the plan applies"

