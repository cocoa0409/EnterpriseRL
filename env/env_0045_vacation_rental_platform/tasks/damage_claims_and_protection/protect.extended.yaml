  compute:
  - va_claim: LATEST('protection_claims', 'claim_id', date_field='decided_at', claim_status='approved', damage_category='valuables')
  - va_stay: LATEST('protection_claims', 'stay_id', date_field='decided_at', claim_status='approved', damage_category='valuables')
  - va_loss: LATEST('protection_claims', 'verified_loss_amount', date_field='decided_at', claim_status='approved',
      damage_category='valuables')
  - va_item_age: LATEST('protection_claims', 'item_age_months', date_field='decided_at', claim_status='approved',
      damage_category='valuables')
  - va_dep_pct: K('valuables_dep_pct_121_plus') if (P('depreciation_applies') and va_item_age >= 121) else (K('valuables_dep_pct_61_120')
      if (P('depreciation_applies') and va_item_age >= 61) else (K('valuables_dep_pct_13_60') if (P('depreciation_applies')
      and va_item_age >= 13) else 0))
  - va_space_type: CFIELD('listing', 'variant_name', listing_id=F('listing_id'))
  - va_access_pct: K('valuables_shared_room_share_pct') if va_space_type == 'Shared Room' else (K('valuables_private_room_share_pct')
      if va_space_type == 'Private Room' else 100)
  - va_checkin: XLATEST('host', 'host_account_events', 'event_date', date_field='event_date', event_type='host_service_fee_assessed',
      stay_id=va_stay)
  - va_level_since: F('tier_changed_date') if F('tier_changed_date') != '' else F('enrolled_date')
  - va_level_days: DAYS(va_level_since, va_checkin)
  - va_new_cover_pct: K('valuables_new_cover_under_90_share_pct') if va_level_days < 90 else (K('valuables_new_cover_90_364_share_pct')
      if va_level_days < 365 else 100)
  - va_deadline: LATEST('protection_claims', 'guest_response_due_at', date_field='decided_at', claim_status='approved',
      damage_category='valuables')
  - va_escalated: LATEST('protection_claims', 'escalated_at', date_field='decided_at', claim_status='approved',
      damage_category='valuables')
  - va_escalation_days: DAYS(va_deadline, va_escalated)
  - va_escalation_pct: K('valuables_escalation_22_30_share_pct') if va_escalation_days >= 22 else (K('valuables_escalation_8_21_share_pct')
      if va_escalation_days >= 8 else 100)
  - va_superhost_run: CFIELD('host', 'variant_name') == 'Superhost' and CFIELD('host', 'superhost_since') != ''
      and CFIELD('host', 'superhost_since') <= va_checkin
  - va_other_paid_12m: COUNT('protection_events', within_months=12, date_field='posted_date', event_type='protect_reimbursement_paid')
      - COUNT('protection_events', event_type='protect_reimbursement_paid', stay_id=va_stay)
  - va_ded_factor: K('valuables_superhost_deductible_factor') if (va_superhost_run and va_other_paid_12m == 0) else
      (K('valuables_repeat_claims_deductible_factor') if ((not va_superhost_run) and va_other_paid_12m >= 2) else
      1)
  - va_stay_claims: COUNT('protection_claims', stay_id=va_stay, claim_status='approved')
  - va_stay_settled: COUNT('protection_events', event_type='protect_reimbursement_paid', stay_id=va_stay)
  - va_ded_share: P('deductible_usd') * (va_stay_claims - va_stay_settled) / va_stay_claims
  - va_deductible: va_ded_share * va_ded_factor
  - va_guest_paid: SUM('protection_events', 'amount', event_type='protect_guest_payment_recorded', claim_id=va_claim)
      - SUM('protection_events', 'amount', event_type='protect_guest_payment_reversed', claim_id=va_claim)
  - va_covered: va_loss * (100 - va_dep_pct) / 100 * va_access_pct / 100 * va_new_cover_pct / 100 * va_escalation_pct
      / 100
  - va_offset: MX(va_guest_paid, va_deductible) if (F('variant_name') == 'HostCover Premier' or F('variant_name')
      == 'HostCover Elite' or F('variant_name') == 'HostCover Estate') else (va_deductible + va_guest_paid * MX(0,
      va_covered - va_deductible) / va_covered if ((F('variant_name') == 'HostCover Standard' or F('variant_name')
      == 'HostCover Plus') and va_covered > 0) else va_guest_paid + va_deductible)
  - va_net: MX(0, va_covered - va_offset)
  - va_year_net: SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'), NOW) + 1, date_field='posted_date',
      event_type='protect_reimbursement_paid') - SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'),
      NOW) + 1, date_field='posted_date', event_type='protect_reimbursement_recovered')
  - va_cap: MN(P('valuables_sublimit_usd'), P('per_claim_limit_usd'), MX(0, P('annual_aggregate_limit_usd') - va_year_net))
  - result: RND(MN(va_net, va_cap), 2)
  compute_basis:
    va_claim: This rule settles a valuables claim (art, jewellery or collectibles) that the claims team has approved
      on a HostCover plan
    va_stay: Where the same stay also carries an approved theft claim, the valuables settlement is fixed only after
      the plan's HostCover ledger shows a reimbursement on that theft claim.
    va_loss: The valuables settlement starts from the loss the claims team verified on the approved valuables claim.
    va_item_age: the age in whole months the claim records for the art, jewellery or collectibles
    va_dep_pct: on a level whose depreciation_applies is true, valuables 121 months old or older are depreciated
      by valuables_dep_pct_121_plus percent, valuables 61 to 120 months old by valuables_dep_pct_61_120 percent
      and valuables 13 to 60 months old by valuables_dep_pct_13_60 percent, because they hold their value better
      than furnishings; valuables 12 months old or younger, and valuables on a level whose depreciation_applies
      is false, are not depreciated.
    va_space_type: 'The valuables access share follows the space type of the listing the plan covers:'
    va_access_pct: valuables lost from a Shared Room listing are settled at valuables_shared_room_share_pct percent,
      from a Private Room listing at valuables_private_room_share_pct percent, and from a listing of any other space
      type in full.
    va_checkin: the date the host service fee was assessed on the stay
    va_level_since: counted in calendar days from the plan's last level change (or from its enrollment when the
      level was never changed) to the date the host service fee was assessed on the stay
    va_level_days: counted in calendar days from the plan's last level change (or from its enrollment when the level
      was never changed) to the date the host service fee was assessed on the stay
    va_new_cover_pct: fewer than 90 days settles the valuables at valuables_new_cover_under_90_share_pct percent,
      90 to 364 days at valuables_new_cover_90_364_share_pct percent, and 365 days or more in full.
    va_deadline: the calendar days from the date part of the guest's response deadline to the date part of the host's
      escalation of the valuables claim
    va_escalated: the calendar days from the date part of the guest's response deadline to the date part of the
      host's escalation of the valuables claim
    va_escalation_days: the calendar days from the date part of the guest's response deadline to the date part of
      the host's escalation of the valuables claim
    va_escalation_pct: an escalation 22 to 30 days after the deadline settles the valuables at valuables_escalation_22_30_share_pct
      percent, one 8 to 21 days after at valuables_escalation_8_21_share_pct percent, and one 7 days or fewer after
      in full.
    va_superhost_run: a host whose account tier is Superhost, with a Superhost run that began on or before the date
      the host service fee was assessed on the stay
    va_other_paid_12m: on a plan with no claim from another stay reimbursed in the 12 months before the settlement
      date
    va_ded_factor: a host whose account tier is Superhost, with a Superhost run that began on or before the date
      the host service fee was assessed on the stay, on a plan with no claim from another stay reimbursed in the
      12 months before the settlement date, bears valuables_superhost_deductible_factor times the deductible the
      valuables claim bears; a host who is not such a Superhost, on a plan with two or more claims from other stays
      reimbursed in those 12 months, bears valuables_repeat_claims_deductible_factor times it; every other host
      bears it as it stands.
    va_stay_claims: the number of approved claims filed on the stay
    va_stay_settled: each claim of the stay that already carries a reimbursement has borne an equal share of it
    va_ded_share: the valuables claim bears the part of the level's deductible_usd those reimbursed claims have
      not borne.
    va_guest_paid: how the guest payments recorded on the claim, net of reversals, are shared between Roamhaven
      and the host
    va_offset: on HostCover Premier, HostCover Elite or HostCover Estate the guest payments first restore the deductible
      the valuables claim bears, so only the larger of those payments and that deductible is subtracted from the
      adjusted valuables loss; on HostCover Standard or HostCover Plus the guest payments are shared in proportion
      to the parts of the loss each side bears, so that deductible is subtracted from the adjusted valuables loss
      together with the guest payments multiplied by the adjusted valuables loss less that deductible (never below
      0.00) and divided by the adjusted valuables loss; on any other level the guest payments and that deductible
      are both subtracted from the adjusted valuables loss.
    va_covered: The verified valuables loss is first reduced by the valuables depreciation share; the depreciated
      valuables loss is then multiplied by the valuables access share, that result by the valuables new-cover share
      and that result by the valuables escalation share, with no rounding between these steps; the figure so reached
      is the adjusted valuables loss.
    va_net: The guest payments and the deductible are then subtracted as the valuables recovery-sharing method directs,
      the result is floored at 0.00
    va_year_net: the reimbursements, net of recoveries, posted on the plan in the current plan year
    va_cap: cut to the lowest of the level's valuables_sublimit_usd, the level's per_claim_limit_usd and the plan's
      remaining aggregate, which is the level's annual_aggregate_limit_usd less the reimbursements, net of recoveries,
      posted on the plan in the current plan year.
    result: The valuables settlement is rounded half up to the nearest cent only at the end.
  factors:
  - id: valuables_depreciation_share
    effect: parameter
    decides: va_dep_pct
    bindings:
    - va_item_age
    - va_dep_pct
    ladder:
    - when: the plan level depreciates items (depreciation_applies is true) and the claim records the valuables
        as 121 months old or older
      value: K('valuables_dep_pct_121_plus')
    - when: the plan level depreciates items and the claim records them as 61 to 120 months old
      value: K('valuables_dep_pct_61_120')
    - when: the plan level depreciates items and the claim records them as 13 to 60 months old
      value: K('valuables_dep_pct_13_60')
    - when: otherwise (valuables 12 months old or younger, or a level that does not depreciate)
      value: 0 (no depreciation)
    baseline:
      va_dep_pct: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: valuables_access_share
    effect: parameter
    decides: va_access_pct
    bindings:
    - va_space_type
    - va_access_pct
    ladder:
    - when: the listing the plan covers is a Shared Room
      value: K('valuables_shared_room_share_pct')
    - when: the listing the plan covers is a Private Room
      value: K('valuables_private_room_share_pct')
    - when: otherwise (any other space type)
      value: 100 (settled in full)
    baseline:
      va_access_pct: '100'
    evidence:
    - cross_category
    cross_difficulty: listing
  - id: valuables_new_cover_share
    effect: parameter
    decides: va_new_cover_pct
    bindings:
    - va_checkin
    - va_level_since
    - va_level_days
    - va_new_cover_pct
    ladder:
    - when: the plan had held its current level for fewer than 90 calendar days on the date the host service fee
        was assessed on the stay
      value: K('valuables_new_cover_under_90_share_pct')
    - when: it had held that level for 90 to 364 calendar days
      value: K('valuables_new_cover_90_364_share_pct')
    - when: otherwise (365 days or more)
      value: 100 (settled in full)
    baseline:
      va_new_cover_pct: '100'
    evidence:
    - date
    - cross_category
    cross_difficulty: host
  - id: valuables_escalation_share
    effect: parameter
    decides: va_escalation_pct
    bindings:
    - va_deadline
    - va_escalated
    - va_escalation_days
    - va_escalation_pct
    ladder:
    - when: the host escalated the valuables claim 22 to 30 calendar days after the date of the guest's response
        deadline
      value: K('valuables_escalation_22_30_share_pct')
    - when: the host escalated 8 to 21 calendar days after that date
      value: K('valuables_escalation_8_21_share_pct')
    - when: otherwise (7 days or fewer after)
      value: 100 (settled in full)
    baseline:
      va_escalation_pct: '100'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: valuables_deductible_factor
    effect: parameter
    decides: va_ded_factor
    bindings:
    - va_superhost_run
    - va_other_paid_12m
    - va_ded_factor
    ladder:
    - when: the host account is a Superhost whose run began on or before the stay's fee-assessment date AND no claim
        from another stay was reimbursed on the plan in the 12 months before the settlement date
      value: K('valuables_superhost_deductible_factor')
    - when: the host is not such a Superhost AND two or more claims from other stays were reimbursed on the plan
        in those 12 months
      value: K('valuables_repeat_claims_deductible_factor')
    - when: otherwise
      value: 1 (the deductible as it stands)
    baseline:
      va_ded_factor: '1'
    evidence:
    - history
    - cross_category
    cross_difficulty: host
  - id: valuables_recovery_sharing_method
    effect: method
    decides: va_offset
    bindings:
    - va_guest_paid
    - va_offset
    ladder:
    - when: the plan level is HostCover Premier, HostCover Elite or HostCover Estate
      method: 'the guest payments first restore the deductible: subtract from the adjusted valuables loss only the
        larger of the guest payments and the deductible (made whole first)'
    - when: the plan level is HostCover Standard or HostCover Plus
      method: 'share the guest payments in proportion: subtract from the adjusted valuables loss the deductible
        plus the guest payments times (the adjusted valuables loss less the deductible, never below 0.00) divided
        by the adjusted valuables loss'
    - when: otherwise (HostCover Essential)
      method: subtract the guest payments and the deductible both from the adjusted valuables loss (Roamhaven credited
        first)
    baseline:
      va_offset: va_guest_paid + va_deductible
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The valuables settlement starts from the loss the claims team verified on the approved valuables claim.
      A stay bears its deductible once: each claim of the stay that already carries a reimbursement has borne an
      equal share of it, that share being the plan level''s deductible_usd divided by the number of approved claims
      filed on the stay, and the valuables claim bears the part of the level''s deductible_usd those reimbursed
      claims have not borne. From the verified valuables loss, every guest payment recorded on the valuables claim,
      net of reversals, is subtracted together with the deductible the valuables claim bears. The result is floored
      at 0.00 and then cut to the lowest of the level''s valuables_sublimit_usd, the level''s per_claim_limit_usd
      and the plan''s remaining aggregate, which is the level''s annual_aggregate_limit_usd less the reimbursements,
      net of recoveries, posted on the plan in the current plan year. The valuables settlement is rounded half up
      to the nearest cent only at the end.'
    params:
    - deductible_usd
    - valuables_sublimit_usd
    - per_claim_limit_usd
    - annual_aggregate_limit_usd
  inputs:
    history:
    - table: protection_claims
      aggregate: latest
      field: verified_loss_amount
      filters:
        claim_status: approved
        damage_category: valuables
    - table: protection_events
      aggregate: count
      field: protection_event_id
      filters:
        event_type: protect_reimbursement_paid
    - table: protection_events
      aggregate: count
      field: protection_event_id
      within_months: 12
      filters:
        event_type: protect_reimbursement_paid
    - table: protection_events
      aggregate: sum
      field: amount
      filters:
        event_type: protect_guest_payment_recorded
    - category: host
      table: host_account_events
      aggregate: latest
      field: event_date
      filters:
        event_type: host_service_fee_assessed
    cross_category:
    - listing
    - host
- id: protect_ext_property_settlement
  base_policy_refs:
  - protect_evt_reimbursement
  - protect_agg_plan_year_limits
  overwrite:
  - base_policy: protect_evt_reimbursement
    superseded_clause: 'The payable amount is computed in this order: start from the verified loss;'
    replaced_by: The verified property loss is first reduced by the property depreciation share; the depreciated
      property loss is then multiplied by the property condition share and that result by the property escalation
      share, with no rounding between these steps; the figure so reached is the adjusted property loss.
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract every guest payment recorded on the claim (net of reversals)
    replaced_by: 'The property recovery-sharing method follows the plan level and decides how the guest payments
      recorded on the claim, net of reversals, are shared between Roamhaven and the host:'
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract deductible_usd
    replaced_by: 'A property-damage claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd
      divided by the number of approved claims filed on the same stay.'
  trigger: state_due
  subject:
  - protect_reimbursement_paid
  computes: amount
  target_tool: pay_property_damage_reimbursement_941cbbf5
  params:
    property_dep_pct_13_36: 20.0
    property_dep_pct_37_60: 40.0
    property_dep_pct_61_plus: 60.0
    property_condition_warning_share_pct: 85.0
    property_condition_suspension_share_pct: 70.0
    property_escalation_8_21_share_pct: 95.0
    property_escalation_22_30_share_pct: 90.0
    property_professional_deductible_factor: 1.5
    property_superhost_deductible_factor: 0.5
  rule: 'This rule settles a property-damage claim that the claims team has approved on a HostCover plan; the figure
    it produces is the property reimbursement Roamhaven books on that claim, and every base condition on paying
    a claim (approval, escalation in time, coverage of the stay, one reimbursement per claim) continues to apply.
    The property reimbursement starts from the loss the claims team verified on the approved property-damage claim.
    A property-damage claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd divided
    by the number of approved claims filed on the same stay. From the verified property loss, every guest payment
    recorded on the property-damage claim, net of reversals, is subtracted together with the property claim''s deductible
    share. The result is floored at 0.00 and then cut to the lower of the level''s per_claim_limit_usd and the plan''s
    remaining aggregate, which is the level''s annual_aggregate_limit_usd less the reimbursements, net of recoveries,
    posted on the plan in the current plan year; property damage carries no category sublimit. The property reimbursement
    is rounded half up to the nearest cent only at the end. The property depreciation share follows the plan level
    and the age in whole months the claim records for the damaged items: on a level whose depreciation_applies is
    true, items 61 months old or older are depreciated by property_dep_pct_61_plus percent, items 37 to 60 months
    old by property_dep_pct_37_60 percent and items 13 to 36 months old by property_dep_pct_13_36 percent; items
    12 months old or younger, and items on a level whose depreciation_applies is false, are not depreciated. The
    property condition share follows the outcome of the most recent quality review recorded on the listing the plan
    covers, because a listing whose guests have been reporting its condition carries damage that may in part be
    wear or damage present before the stay, which HostCover excludes: a most recent review ending in a suspension
    settles the property damage at property_condition_suspension_share_pct percent, one ending in a warning at property_condition_warning_share_pct
    percent, and any other outcome, or no review, in full. For the property condition share, a quality review rates
    the guest reviews of the year before it, so the most recent review reflects the condition guests reported over
    the months around the stay. The property escalation share follows the calendar days from the date part of the
    guest''s response deadline to the date part of the host''s escalation of the property-damage claim: an escalation
    22 to 30 days after the deadline settles the property damage at property_escalation_22_30_share_pct percent,
    one 8 to 21 days after at property_escalation_8_21_share_pct percent, and one 7 days or fewer after in full.
    The property deductible factor follows the host''s program and the listing: a host account on a professional
    tier (Professional Host, Professional Host Plus or Enterprise Partner) whose listing under the plan is an Entire
    Home or a Luxury Villa bears property_professional_deductible_factor times the property claim''s deductible
    share; a host whose account tier is Superhost, with a Superhost run that began on or before the stay''s check-in
    date (the date the host service fee was assessed on the stay), on a plan with no claim from another stay reimbursed
    in the 12 months before the settlement date, bears property_superhost_deductible_factor times the share; every
    other host bears the share as it stands. The property recovery-sharing method follows the plan level and decides
    how the guest payments recorded on the claim, net of reversals, are shared between Roamhaven and the host: on
    HostCover Premier, HostCover Elite or HostCover Estate the guest payments first restore the deductible the property
    claim bears, so only the larger of those payments and that deductible is subtracted from the adjusted property
    loss; on HostCover Standard or HostCover Plus the guest payments are shared in proportion to the parts of the
    loss each side bears, so that deductible is subtracted from the adjusted property loss together with the guest
    payments multiplied by the adjusted property loss less that deductible (never below 0.00) and divided by the
    adjusted property loss; on any other level the guest payments and that deductible are both subtracted from the
    adjusted property loss. The verified property loss is first reduced by the property depreciation share; the
    depreciated property loss is then multiplied by the property condition share and that result by the property
    escalation share, with no rounding between these steps; the figure so reached is the adjusted property loss.
    The guest payments and the deductible are then subtracted as the property recovery-sharing method directs, the
    result is floored at 0.00 and cut to the lower of the per-claim limit and the remaining aggregate, and only
    that figure is rounded.'
  prerequisite: []
  cross_category:
  - category: listing
    as: history
    reads:
    - variant_name
    - listing_events.quality_outcome
    note: the property condition share is decided from the listing's most recent quality review; the deductible
      factor reads the listing's space type
  - category: host
    as: history
    reads:
    - variant_name
    - superhost_since
    - host_account_events.event_date
    note: the property deductible factor reads the host's tier, Superhost run and the stay's check-in date from
      the host service fee assessed on it
  compute:
  - pr_claim: LATEST('protection_claims', 'claim_id', date_field='decided_at', claim_status='approved', damage_category='property_damage')
  - pr_stay: LATEST('protection_claims', 'stay_id', date_field='decided_at', claim_status='approved', damage_category='property_damage')
  - pr_loss: LATEST('protection_claims', 'verified_loss_amount', date_field='decided_at', claim_status='approved',
      damage_category='property_damage')
  - pr_item_age: LATEST('protection_claims', 'item_age_months', date_field='decided_at', claim_status='approved',
      damage_category='property_damage')
  - pr_dep_pct: K('property_dep_pct_61_plus') if (P('depreciation_applies') and pr_item_age >= 61) else (K('property_dep_pct_37_60')
      if (P('depreciation_applies') and pr_item_age >= 37) else (K('property_dep_pct_13_36') if (P('depreciation_applies')
      and pr_item_age >= 13) else 0))
  - pr_quality: XLATEST('listing', 'listing_events', 'quality_outcome', date_field='event_date', event_type='listing_quality_reviewed',
      listing_id=F('listing_id'))
  - pr_condition_pct: K('property_condition_suspension_share_pct') if pr_quality == 'suspension' else (K('property_condition_warning_share_pct')
      if pr_quality == 'warning' else 100)
  - pr_deadline: LATEST('protection_claims', 'guest_response_due_at', date_field='decided_at', claim_status='approved',
      damage_category='property_damage')
  - pr_escalated: LATEST('protection_claims', 'escalated_at', date_field='decided_at', claim_status='approved',
      damage_category='property_damage')
  - pr_escalation_days: DAYS(pr_deadline, pr_escalated)
  - pr_escalation_pct: K('property_escalation_22_30_share_pct') if pr_escalation_days >= 22 else (K('property_escalation_8_21_share_pct')
      if pr_escalation_days >= 8 else 100)
  - pr_host_tier: CFIELD('host', 'variant_name')
  - pr_space_type: CFIELD('listing', 'variant_name', listing_id=F('listing_id'))
  - pr_checkin: XLATEST('host', 'host_account_events', 'event_date', date_field='event_date', event_type='host_service_fee_assessed',
      stay_id=pr_stay)
  - pr_superhost_run: pr_host_tier == 'Superhost' and CFIELD('host', 'superhost_since') != '' and CFIELD('host',
      'superhost_since') <= pr_checkin
  - pr_other_paid_12m: COUNT('protection_events', within_months=12, date_field='posted_date', event_type='protect_reimbursement_paid')
      - COUNT('protection_events', event_type='protect_reimbursement_paid', stay_id=pr_stay)
  - pr_ded_factor: K('property_professional_deductible_factor') if ((pr_host_tier == 'Professional Host' or pr_host_tier
      == 'Professional Host Plus' or pr_host_tier == 'Enterprise Partner') and (pr_space_type == 'Entire Home' or
      pr_space_type == 'Luxury Villa')) else (K('property_superhost_deductible_factor') if (pr_superhost_run and
      pr_other_paid_12m == 0) else 1)
  - pr_stay_claims: COUNT('protection_claims', stay_id=pr_stay, claim_status='approved')
  - pr_ded_share: P('deductible_usd') / pr_stay_claims
  - pr_deductible: pr_ded_share * pr_ded_factor
  - pr_guest_paid: SUM('protection_events', 'amount', event_type='protect_guest_payment_recorded', claim_id=pr_claim)
      - SUM('protection_events', 'amount', event_type='protect_guest_payment_reversed', claim_id=pr_claim)
  - pr_covered: pr_loss * (100 - pr_dep_pct) / 100 * pr_condition_pct / 100 * pr_escalation_pct / 100
  - pr_offset: MX(pr_guest_paid, pr_deductible) if (F('variant_name') == 'HostCover Premier' or F('variant_name')
      == 'HostCover Elite' or F('variant_name') == 'HostCover Estate') else (pr_deductible + pr_guest_paid * MX(0,
      pr_covered - pr_deductible) / pr_covered if ((F('variant_name') == 'HostCover Standard' or F('variant_name')
      == 'HostCover Plus') and pr_covered > 0) else pr_guest_paid + pr_deductible)
  - pr_net: MX(0, pr_covered - pr_offset)
  - pr_year_net: SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'), NOW) + 1, date_field='posted_date',
      event_type='protect_reimbursement_paid') - SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'),
      NOW) + 1, date_field='posted_date', event_type='protect_reimbursement_recovered')
  - pr_cap: MN(P('per_claim_limit_usd'), MX(0, P('annual_aggregate_limit_usd') - pr_year_net))
  - result: RND(MN(pr_net, pr_cap), 2)
  compute_basis:
    pr_claim: This rule settles a property-damage claim that the claims team has approved on a HostCover plan; the
      figure it produces is the property reimbursement Roamhaven books on that claim
    pr_stay: the number of approved claims filed on the same stay
    pr_loss: The property reimbursement starts from the loss the claims team verified on the approved property-damage
      claim.
    pr_item_age: the age in whole months the claim records for the damaged items
    pr_dep_pct: on a level whose depreciation_applies is true, items 61 months old or older are depreciated by property_dep_pct_61_plus
      percent, items 37 to 60 months old by property_dep_pct_37_60 percent and items 13 to 36 months old by property_dep_pct_13_36
      percent; items 12 months old or younger, and items on a level whose depreciation_applies is false, are not
      depreciated.
    pr_quality: The property condition share follows the outcome of the most recent quality review recorded on the
      listing the plan covers
    pr_condition_pct: a most recent review ending in a suspension settles the property damage at property_condition_suspension_share_pct
      percent, one ending in a warning at property_condition_warning_share_pct percent, and any other outcome, or
      no review, in full.
    pr_deadline: the calendar days from the date part of the guest's response deadline to the date part of the host's
      escalation of the property-damage claim
    pr_escalated: the calendar days from the date part of the guest's response deadline to the date part of the
      host's escalation of the property-damage claim
    pr_escalation_days: the calendar days from the date part of the guest's response deadline to the date part of
      the host's escalation of the property-damage claim
    pr_escalation_pct: an escalation 22 to 30 days after the deadline settles the property damage at property_escalation_22_30_share_pct
      percent, one 8 to 21 days after at property_escalation_8_21_share_pct percent, and one 7 days or fewer after
      in full.
    pr_host_tier: a host account on a professional tier (Professional Host, Professional Host Plus or Enterprise
      Partner)
    pr_space_type: whose listing under the plan is an Entire Home or a Luxury Villa
    pr_checkin: the stay's check-in date (the date the host service fee was assessed on the stay)
    pr_superhost_run: a host whose account tier is Superhost, with a Superhost run that began on or before the stay's
      check-in date (the date the host service fee was assessed on the stay)
    pr_other_paid_12m: on a plan with no claim from another stay reimbursed in the 12 months before the settlement
      date
    pr_ded_factor: a host account on a professional tier (Professional Host, Professional Host Plus or Enterprise
      Partner) whose listing under the plan is an Entire Home or a Luxury Villa bears property_professional_deductible_factor
      times the property claim's deductible share; a host whose account tier is Superhost, with a Superhost run
      that began on or before the stay's check-in date (the date the host service fee was assessed on the stay),
      on a plan with no claim from another stay reimbursed in the 12 months before the settlement date, bears property_superhost_deductible_factor
      times the share; every other host bears the share as it stands.
    pr_stay_claims: the number of approved claims filed on the same stay
    pr_ded_share: 'A property-damage claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd
      divided by the number of approved claims filed on the same stay.'
    pr_guest_paid: how the guest payments recorded on the claim, net of reversals, are shared between Roamhaven
      and the host
    pr_offset: on HostCover Premier, HostCover Elite or HostCover Estate the guest payments first restore the deductible
      the property claim bears, so only the larger of those payments and that deductible is subtracted from the
      adjusted property loss; on HostCover Standard or HostCover Plus the guest payments are shared in proportion
      to the parts of the loss each side bears, so that deductible is subtracted from the adjusted property loss
      together with the guest payments multiplied by the adjusted property loss less that deductible (never below
      0.00) and divided by the adjusted property loss; on any other level the guest payments and that deductible
      are both subtracted from the adjusted property loss.
    pr_covered: The verified property loss is first reduced by the property depreciation share; the depreciated
      property loss is then multiplied by the property condition share and that result by the property escalation
      share, with no rounding between these steps; the figure so reached is the adjusted property loss.
    pr_net: The guest payments and the deductible are then subtracted as the property recovery-sharing method directs,
      the result is floored at 0.00
    pr_year_net: the reimbursements, net of recoveries, posted on the plan in the current plan year
    pr_cap: cut to the lower of the level's per_claim_limit_usd and the plan's remaining aggregate, which is the
      level's annual_aggregate_limit_usd less the reimbursements, net of recoveries, posted on the plan in the current
      plan year; property damage carries no category sublimit.
    result: The property reimbursement is rounded half up to the nearest cent only at the end.
  factors:
  - id: property_depreciation_share
    effect: parameter
    decides: pr_dep_pct
    bindings:
    - pr_item_age
    - pr_dep_pct
    ladder:
    - when: the plan level depreciates items (depreciation_applies is true) and the claim records the damaged items
        as 61 months old or older
      value: K('property_dep_pct_61_plus')
    - when: the plan level depreciates items and the claim records them as 37 to 60 months old
      value: K('property_dep_pct_37_60')
    - when: the plan level depreciates items and the claim records them as 13 to 36 months old
      value: K('property_dep_pct_13_36')
    - when: otherwise (items 12 months old or younger, or a level that does not depreciate)
      value: 0 (no depreciation)
    baseline:
      pr_dep_pct: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: property_condition_share
    effect: parameter
    decides: pr_condition_pct
    bindings:
    - pr_quality
    - pr_condition_pct
    ladder:
    - when: the most recent quality review recorded on the listing ended in a suspension
      value: K('property_condition_suspension_share_pct')
    - when: the most recent quality review ended in a warning
      value: K('property_condition_warning_share_pct')
    - when: otherwise (any other outcome, or no review)
      value: 100 (settled in full)
    baseline:
      pr_condition_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: listing
  - id: property_escalation_share
    effect: parameter
    decides: pr_escalation_pct
    bindings:
    - pr_deadline
    - pr_escalated
    - pr_escalation_days
    - pr_escalation_pct
    ladder:
    - when: the host escalated the property-damage claim 22 to 30 calendar days after the date of the guest's response
        deadline
      value: K('property_escalation_22_30_share_pct')
    - when: the host escalated 8 to 21 calendar days after that date
      value: K('property_escalation_8_21_share_pct')
    - when: otherwise (7 days or fewer after)
      value: 100 (settled in full)
    baseline:
      pr_escalation_pct: '100'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: property_deductible_factor
    effect: parameter
    decides: pr_ded_factor
    bindings:
    - pr_host_tier
    - pr_space_type
    - pr_checkin
    - pr_superhost_run
    - pr_other_paid_12m
    - pr_ded_factor
    ladder:
    - when: the host account is on a professional tier (Professional Host, Professional Host Plus or Enterprise
        Partner) AND the listing under the plan is an Entire Home or a Luxury Villa
      value: K('property_professional_deductible_factor')
    - when: the host account is a Superhost whose run began on or before the stay's check-in date AND no claim from
        another stay was reimbursed on the plan in the 12 months before the settlement date
      value: K('property_superhost_deductible_factor')
    - when: otherwise
      value: 1 (the deductible share as it stands)
    baseline:
      pr_ded_factor: '1'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: host
  - id: property_recovery_sharing_method
    effect: method
    decides: pr_offset
    bindings:
    - pr_guest_paid
    - pr_offset
    ladder:
    - when: the plan level is HostCover Premier, HostCover Elite or HostCover Estate
      method: 'the guest payments first restore the deductible: subtract from the adjusted property loss only the
        larger of the guest payments and the deductible (made whole first)'
    - when: the plan level is HostCover Standard or HostCover Plus
      method: 'share the guest payments in proportion: subtract from the adjusted property loss the deductible plus
        the guest payments times (the adjusted property loss less the deductible, never below 0.00) divided by the
        adjusted property loss'
    - when: otherwise (HostCover Essential)
      method: subtract the guest payments and the deductible both from the adjusted property loss (Roamhaven credited
        first)
    baseline:
      pr_offset: pr_guest_paid + pr_deductible
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The property reimbursement starts from the loss the claims team verified on the approved property-damage
      claim. A property-damage claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd
      divided by the number of approved claims filed on the same stay. From the verified property loss, every guest
      payment recorded on the property-damage claim, net of reversals, is subtracted together with the property
      claim''s deductible share. The result is floored at 0.00 and then cut to the lower of the level''s per_claim_limit_usd
      and the plan''s remaining aggregate, which is the level''s annual_aggregate_limit_usd less the reimbursements,
      net of recoveries, posted on the plan in the current plan year; property damage carries no category sublimit.
      The property reimbursement is rounded half up to the nearest cent only at the end.'
    params:
    - deductible_usd
    - per_claim_limit_usd
    - annual_aggregate_limit_usd
  inputs:
    history:
    - table: protection_claims
      aggregate: latest
      field: verified_loss_amount
      filters:
        claim_status: approved
        damage_category: property_damage
    - table: protection_claims
      aggregate: count
      field: claim_id
      filters:
        claim_status: approved
    - table: protection_events
      aggregate: sum
      field: amount
      filters:
        event_type: protect_guest_payment_recorded
    - category: listing
      table: listing_events
      aggregate: latest
      field: quality_outcome
      filters:
        event_type: listing_quality_reviewed
    - category: host
      table: host_account_events
      aggregate: latest
      field: event_date
      filters:
        event_type: host_service_fee_assessed
    cross_category:
    - listing
    - host
- id: protect_ext_pet_damage_settlement
  base_policy_refs:
  - protect_evt_reimbursement
  - protect_agg_plan_year_limits
  overwrite:
  - base_policy: protect_evt_reimbursement
    superseded_clause: 'The payable amount is computed in this order: start from the verified loss;'
    replaced_by: The verified pet-damage loss is first reduced by the pet depreciation share; the depreciated pet-damage
      loss is then multiplied by the pet-fee share, that result by the pet condition share and that result by the
      pet escalation share, with no rounding between these steps; the figure so reached is the adjusted pet-damage
      loss.
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract every guest payment recorded on the claim (net of reversals)
    replaced_by: 'The pet recovery-sharing method follows the plan level and decides how the guest payments recorded
      on the claim, net of reversals, are shared between Roamhaven and the host:'
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract deductible_usd
    replaced_by: 'A pet-damage claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd
      divided by the number of approved claims filed on the same stay.'
  trigger: state_due
  subject:
  - protect_reimbursement_paid
  computes: amount
  target_tool: pay_pet_damage_reimbursement_a5391300
  params:
    pet_dep_pct_13_36: 20.0
    pet_dep_pct_37_60: 40.0
    pet_dep_pct_61_plus: 60.0
    pet_fee_100_plus_share_pct: 80.0
    pet_fee_under_100_share_pct: 90.0
    pet_condition_warning_share_pct: 90.0
    pet_condition_suspension_share_pct: 75.0
    pet_escalation_8_21_share_pct: 95.0
    pet_escalation_22_30_share_pct: 85.0
  rule: 'This rule settles a pet-damage claim (damage by a guest''s pet, a service animal included) that the claims
    team has approved on a HostCover plan; the figure it produces is the pet-damage reimbursement Roamhaven books
    on that claim, and every base condition on paying a claim (approval, escalation in time, coverage of the stay,
    one reimbursement per claim) continues to apply. The pet-damage reimbursement starts from the loss the claims
    team verified on the approved pet-damage claim. A pet-damage claim bears an equal share of the stay''s deductible:
    the plan level''s deductible_usd divided by the number of approved claims filed on the same stay. From the verified
    pet-damage loss, every guest payment recorded on the pet-damage claim, net of reversals, is subtracted together
    with the pet-damage claim''s deductible share. The result is floored at 0.00 and then cut to the lowest of the
    level''s pet_damage_sublimit_usd, the level''s per_claim_limit_usd and the plan''s remaining aggregate, which
    is the level''s annual_aggregate_limit_usd less the reimbursements, net of recoveries, posted on the plan in
    the current plan year. The pet-damage reimbursement is rounded half up to the nearest cent only at the end.
    The pet depreciation share follows the plan level and the age in whole months the claim records for the items
    the pet damaged: on a level whose depreciation_applies is true, items 61 months old or older are depreciated
    by pet_dep_pct_61_plus percent, items 37 to 60 months old by pet_dep_pct_37_60 percent and items 13 to 36 months
    old by pet_dep_pct_13_36 percent; items 12 months old or younger, and items on a level whose depreciation_applies
    is false, are not depreciated. The pet-fee share follows the pet fee the listing under the plan charges per
    stay, because the pet fee the guest paid is charged for the extra cleaning and upkeep a pet brings, in the way
    the base settlement reduces a deep-cleaning claim by the cleaning fee collected, so part of the pet''s impact
    has already been paid for on the stay: a listing charging a pet fee of 100.00 or more settles the pet damage
    at pet_fee_100_plus_share_pct percent, a listing charging a pet fee above 0.00 but below 100.00 at pet_fee_under_100_share_pct
    percent, and a listing charging no pet fee in full. The pet condition share follows the outcome of the most
    recent quality review recorded on the listing the plan covers: a most recent review ending in a suspension settles
    the pet damage at pet_condition_suspension_share_pct percent, one ending in a warning at pet_condition_warning_share_pct
    percent, and any other outcome, or no review, in full. For the pet condition share, a quality review rates the
    guest reviews of the year before it, so the most recent review reflects the condition guests reported over the
    months around the stay. The pet escalation share follows the calendar days from the date part of the guest''s
    response deadline to the date part of the host''s escalation of the pet-damage claim: an escalation 22 to 30
    days after the deadline settles the pet damage at pet_escalation_22_30_share_pct percent, one 8 to 21 days after
    at pet_escalation_8_21_share_pct percent, and one 7 days or fewer after in full. The pet recovery-sharing method
    follows the plan level and decides how the guest payments recorded on the claim, net of reversals, are shared
    between Roamhaven and the host: on HostCover Premier, HostCover Elite or HostCover Estate the guest payments
    first restore the deductible the pet-damage claim bears, so only the larger of those payments and that deductible
    is subtracted from the adjusted pet-damage loss; on HostCover Standard or HostCover Plus the guest payments
    are shared in proportion to the parts of the loss each side bears, so that deductible is subtracted from the
    adjusted pet-damage loss together with the guest payments multiplied by the adjusted pet-damage loss less that
    deductible (never below 0.00) and divided by the adjusted pet-damage loss; on any other level the guest payments
    and that deductible are both subtracted from the adjusted pet-damage loss. The verified pet-damage loss is first
    reduced by the pet depreciation share; the depreciated pet-damage loss is then multiplied by the pet-fee share,
    that result by the pet condition share and that result by the pet escalation share, with no rounding between
    these steps; the figure so reached is the adjusted pet-damage loss. The guest payments and the deductible are
    then subtracted as the pet recovery-sharing method directs, the result is floored at 0.00 and cut to the lowest
    of the pet-damage sublimit, the per-claim limit and the remaining aggregate, and only that figure is rounded.'
  prerequisite: []
  cross_category:
  - category: listing
    as: history
    reads:
    - pet_fee
    - listing_events.quality_outcome
    note: the pet-fee share is decided from the listing's pet fee and the pet condition share from its most recent
      quality review
  compute:
  - pe_claim: LATEST('protection_claims', 'claim_id', date_field='decided_at', claim_status='approved', damage_category='pet_damage')
  - pe_stay: LATEST('protection_claims', 'stay_id', date_field='decided_at', claim_status='approved', damage_category='pet_damage')
  - pe_loss: LATEST('protection_claims', 'verified_loss_amount', date_field='decided_at', claim_status='approved',
      damage_category='pet_damage')
  - pe_item_age: LATEST('protection_claims', 'item_age_months', date_field='decided_at', claim_status='approved',
      damage_category='pet_damage')
  - pe_dep_pct: K('pet_dep_pct_61_plus') if (P('depreciation_applies') and pe_item_age >= 61) else (K('pet_dep_pct_37_60')
      if (P('depreciation_applies') and pe_item_age >= 37) else (K('pet_dep_pct_13_36') if (P('depreciation_applies')
      and pe_item_age >= 13) else 0))
  - pe_listing_pet_fee: CFIELD('listing', 'pet_fee', listing_id=F('listing_id'))
  - pe_fee_pct: K('pet_fee_100_plus_share_pct') if pe_listing_pet_fee >= 100 else (K('pet_fee_under_100_share_pct')
      if pe_listing_pet_fee > 0 else 100)
  - pe_quality: XLATEST('listing', 'listing_events', 'quality_outcome', date_field='event_date', event_type='listing_quality_reviewed',
      listing_id=F('listing_id'))
  - pe_condition_pct: K('pet_condition_suspension_share_pct') if pe_quality == 'suspension' else (K('pet_condition_warning_share_pct')
      if pe_quality == 'warning' else 100)
  - pe_deadline: LATEST('protection_claims', 'guest_response_due_at', date_field='decided_at', claim_status='approved',
      damage_category='pet_damage')
  - pe_escalated: LATEST('protection_claims', 'escalated_at', date_field='decided_at', claim_status='approved',
      damage_category='pet_damage')
  - pe_escalation_days: DAYS(pe_deadline, pe_escalated)
  - pe_escalation_pct: K('pet_escalation_22_30_share_pct') if pe_escalation_days >= 22 else (K('pet_escalation_8_21_share_pct')
      if pe_escalation_days >= 8 else 100)
  - pe_stay_claims: COUNT('protection_claims', stay_id=pe_stay, claim_status='approved')
  - pe_deductible: P('deductible_usd') / pe_stay_claims
  - pe_guest_paid: SUM('protection_events', 'amount', event_type='protect_guest_payment_recorded', claim_id=pe_claim)
      - SUM('protection_events', 'amount', event_type='protect_guest_payment_reversed', claim_id=pe_claim)
  - pe_covered: pe_loss * (100 - pe_dep_pct) / 100 * pe_fee_pct / 100 * pe_condition_pct / 100 * pe_escalation_pct
      / 100
  - pe_offset: MX(pe_guest_paid, pe_deductible) if (F('variant_name') == 'HostCover Premier' or F('variant_name')
      == 'HostCover Elite' or F('variant_name') == 'HostCover Estate') else (pe_deductible + pe_guest_paid * MX(0,
      pe_covered - pe_deductible) / pe_covered if ((F('variant_name') == 'HostCover Standard' or F('variant_name')
      == 'HostCover Plus') and pe_covered > 0) else pe_guest_paid + pe_deductible)
  - pe_net: MX(0, pe_covered - pe_offset)
  - pe_year_net: SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'), NOW) + 1, date_field='posted_date',
      event_type='protect_reimbursement_paid') - SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'),
      NOW) + 1, date_field='posted_date', event_type='protect_reimbursement_recovered')
  - pe_cap: MN(P('pet_damage_sublimit_usd'), P('per_claim_limit_usd'), MX(0, P('annual_aggregate_limit_usd') - pe_year_net))
  - result: RND(MN(pe_net, pe_cap), 2)
