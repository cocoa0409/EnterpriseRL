events:
  - type: protect_plan_enrolled
    target: protection_plans
    mutation: create
    meaning: A HostCover plan is opened on a listing — automatically at Essential when the listing is published, or by the host choosing a paid level.
    grain: one row per plan
    fields:
      protection_plan_id: reference number of the plan
      customer_id: the host
      host_account_id: the host account
      listing_id: the listing covered
      variant_name: the HostCover level
      status: pending_activation at enrollment
      enrolled_date: date enrolled
      effective_date: enrolled_date plus the level's waiting period
    triggers: []
  - type: protect_plan_activated
    target: protection_plans
    mutation: {transition: {from: pending_activation, to: active}}
    meaning: The plan's effective date arrives.
    grain: one row per plan
    fields:
      protection_plan_id: the plan
      status: becomes active
      plan_year_start: first day of the current plan year
    triggers: []
  - type: protect_plan_tier_changed
    target: protection_plans
    mutation: update
    meaning: The host moves the plan to another HostCover level.
    grain: one row per plan (each change rewrites the current level)
    fields:
      protection_plan_id: the plan
      variant_name: the new level
      tier_changed_date: date of the change
    triggers: []
  - type: protect_plan_cancelled
    target: protection_plans
    mutation: {transition: [{from: pending_activation, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The host cancels the plan.
    grain: one row per plan
    fields:
      protection_plan_id: the plan
      status: becomes cancelled
      cancelled_date: date cancelled
    triggers: []
  - type: protect_plan_lapsed
    target: protection_plans
    mutation: {transition: {from: active, to: lapsed}}
    meaning: The plan ends because its listing was removed or the host account deactivated.
    grain: one row per plan
    fields:
      protection_plan_id: the plan
      status: becomes lapsed
      cancelled_date: date it lapsed
    triggers: []
  - type: protect_premium_charged
    target: protection_events
    meaning: The premium of a paid level is charged on one stay when the stay's earnings are released.
    grain: one row per stay
    distinguish_by: [stay_id]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date charged
      stay_id: the stay covered
      premium_base_amount: the stay's premium base
      amount: premium charged, positive
    account: premiums
    direction: in
    triggers:
      - event: payout:payout_deduction_applied
        map: {stay_id: stay_id, amount: amount, deduction_type: protection_premium}
  - type: protect_premium_refunded
    target: protection_events
    meaning: Part or all of a stay's premium is refunded because host-funded refunds reduced the stay's premium base.
    grain: one row per stay per refund date
    distinguish_by: [stay_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date refunded
      stay_id: the stay
      premium_base_amount: the reduction in the premium base
      amount: premium refunded, positive
    account: premiums
    direction: out
    triggers:
      - event: payout:payout_adjustment_credited
        map: {stay_id: stay_id, amount: amount, credit_type: premium_refund}
  - type: protect_guest_payment_requested
    target: protection_events
    meaning: The host's request for payment is sent to the guest of the stay on a filed claim.
    grain: one row per claim
    distinguish_by: [claim_id]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date the request was sent
      claim_id: the claim
      stay_id: the stay the damage arose from
      amount: amount requested from the guest, positive
    triggers: []
  - type: protect_guest_payment_recorded
    target: protection_events
    meaning: The guest pays some or all of the requested amount toward the claim.
    grain: one row per guest payment on a claim
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date paid
      claim_id: the claim
      stay_id: the stay
      guest_response: paid_in_full or paid_partial
      amount: amount the guest paid, positive
    account: guest_recoveries
    direction: in
    triggers:
      - event: payout:payout_adjustment_credited
        map: {stay_id: stay_id, amount: amount, credit_type: guest_damage_payment}
  - type: protect_guest_payment_reversed
    target: protection_events
    meaning: A guest payment on a claim is reversed by the guest's card issuer.
    grain: one row per reversed guest payment
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date reversed
      claim_id: the claim
      stay_id: the stay
      amount: amount reversed, positive
    account: guest_recoveries
    direction: out
    triggers:
      - event: payout:payout_deduction_applied
        map: {stay_id: stay_id, amount: amount, deduction_type: guest_payment_reversal}
  - type: protect_reimbursement_paid
    target: protection_events
    meaning: Roamhaven pays the host the payable amount of an approved claim.
    grain: one row per claim
    distinguish_by: [claim_id]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date paid
      claim_id: the claim
      stay_id: the stay
      verified_loss_amount: the loss verified by the claims team, before depreciation, offsets, deductible and limits
      amount: reimbursement paid, positive
    account: reimbursements
    direction: in
    triggers:
      - event: payout:payout_adjustment_credited
        map: {stay_id: stay_id, amount: amount, credit_type: claim_reimbursement}
  - type: protect_reimbursement_recovered
    target: protection_events
    meaning: Roamhaven recovers from the responsible guest part or all of a reimbursement it paid.
    grain: one row per recovery on a claim
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date recovered
      claim_id: the claim
      stay_id: the stay
      amount: amount recovered, positive
    account: reimbursements
    direction: out
    triggers: []
  - type: protect_claim_denied
    target: protection_events
    meaning: A claim is refused, with the reason recorded.
    grain: one row per denial of a claim (an appeal decision is a second denial row)
    distinguish_by: [claim_id, posted_date]
    fields:
      protection_plan_id: the plan
      customer_id: the host
      posted_date: date denied
      claim_id: the claim
      stay_id: the stay
      denial_reason: filed_late, no_guest_request, excluded_damage, insufficient_evidence, coverage_inactive, below_minimum, claim_limit_reached or not_escalated_in_time
    triggers: []

measures:
  - id: protect_msr_net_reimbursed_plan_year
    window: the current plan year of the plan (plan_year_start to the day before its next anniversary)
    measure: sum of protect_reimbursement_paid amounts minus protect_reimbursement_recovered amounts on the plan whose posted_date falls in the window
  - id: protect_msr_paid_claims_plan_year
    window: the current plan year of the plan
    measure: count of distinct claim_id values on the plan with a protect_reimbursement_paid row whose posted_date falls in the window

policies:
  - id: protect_agg_multi_holding
    subject: [protect_plan_enrolled]
    rule: >-
      A host holds HostCover per listing: each listing carries exactly one plan that is pending_activation or active at
      a time, and a host with several listings holds several plans, each with its own level, limits, plan year and
      claims. HostCover Essential is enrolled automatically when a listing is first published; choosing a paid level
      changes that plan's level rather than opening a second plan. There is no cap on the number of plans a host holds.
    eligibility: []
    params:
      max_per_customer: null
  - id: protect_agg_plan_year_limits
    subject: [protect_reimbursement_paid]
    rule: >-
      Limits are counted per plan and per plan year, never pooled across a host's listings. A claim is paid only while
      the plan's net reimbursements this plan year (protect_msr_net_reimbursed_plan_year) are below
      annual_aggregate_limit_usd, and the payment is cut to the remaining aggregate. A claim is paid only while fewer
      than max_paid_claims_per_plan_year claims have been paid this plan year (protect_msr_paid_claims_plan_year); a
      claim beyond that count is denied as claim_limit_reached. Recoveries from guests restore the aggregate because the
      aggregate is counted net.
    eligibility: []
    measures: [protect_msr_net_reimbursed_plan_year, protect_msr_paid_claims_plan_year]
    formula:
      remaining_aggregate: max(annual_aggregate_limit_usd - protect_msr_net_reimbursed_plan_year, 0)
  - id: protect_evt_enrollment_and_level
    subject: [protect_plan_enrolled, protect_plan_activated, protect_plan_tier_changed, protect_plan_cancelled, protect_plan_lapsed]
    rule: >-
      A level may be held only on a listing whose space type is in the level's eligible_space_types, while the host
      account is active. A plan becomes effective waiting_period_days calendar days after enrollment, and its plan year
      runs from the effective date and renews on each anniversary. A level change takes effect for stays checking in
      after the change date; stays already checked in stay under the level they checked in under. A plan's level can be
      changed only when at least tier_change_cooldown_days calendar days have passed since its last level change; the
      days are counted from tier_changed_date (or from enrolled_date when the level was never changed), and a change on
      the last day of the period is allowed. Cancelling a plan never refunds premiums already charged when
      unearned_premium_refund_on_cancellation is false, and a cancelled paid plan falls back to HostCover Essential only
      through a new enrollment. A plan lapses when its listing is removed or its host account is deactivated. A plan
      that is cancelled or lapsed still covers stays that checked in while it was active.
    eligibility:
      - id: level_change_cooldown
        applies_to: [protect_plan_tier_changed]
        kind: time
        condition: A plan's level can be changed only when at least tier_change_cooldown_days calendar days have passed since its last level change; the days are counted from tier_changed_date (or from enrolled_date when the level was never changed), and a change on the last day of the period is allowed.
        evidence_fields: [protection_plans.tier_changed_date, protection_plans.enrolled_date, protection_plans.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.protection_plan_id]
          action_bindings:
            protection_plans.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its last level change
          anchor_source: protection_plans.tier_changed_date
          relation: not_before
          duration_source: variants.tier_change_cooldown_days
          unit: calendar_days
          counting_rule: the days are counted from tier_changed_date (or from enrolled_date when the level was never changed), and a change on the last day of the period is allowed.
          boundary: inclusive
  - id: protect_evt_premium
    subject: [protect_premium_charged, protect_premium_refunded]
    rule: >-
      A paid level charges a premium on each stay it covers, when the stay's earnings are released: premium_pct of the
      premium base (the stay's nightly_subtotal and cleaning_fee), raised to premium_min_per_stay_usd when lower, then
      reduced by superhost_premium_discount_pct when the host account's tier is Superhost on the stay's check-in date,
      rounded half up to the cent. The minimum is applied before the discount. A premium is charged only on a plan whose
      status is active. A premium is charged once per stay. HostCover Essential charges nothing. When host-funded guest
      refunds later reduce the stay's premium base, the premium is refunded in the same proportion, never more than was
      charged.
    eligibility:
      - id: plan_active_for_premium
        applies_to: [protect_premium_charged]
        kind: state
        condition: A premium is charged only on a plan whose status is active.
        evidence_fields: [protection_plans.status, protection_plans.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_plans.protection_plan_id]
          action_bindings:
            protection_plans.protection_plan_id: protection_plan_id
        state_contract:
          field: protection_plans.status
          allowed: [active]
      - id: one_premium_per_stay
        applies_to: [protect_premium_charged]
        kind: dedup
        condition: A premium is charged once per stay.
        evidence_fields: [protection_events.stay_id, protection_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.stay_id]
          action_bindings:
            protection_events.stay_id: stay_id
        dedup_contract:
          table: protection_events
          mode: separate_record
          object_bindings: {stay_id: stay_id}
          duplicate_filters: {event_type: [protect_premium_charged]}
          distinct_fields: []
    params:
      per_tier:
        HostCover Essential: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Standard: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Plus: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Premier: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Elite: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
        HostCover Estate: {premium_pct: "=premium_pct", premium_min_per_stay_usd: "=premium_min_per_stay_usd"}
    formula:
      amount: round(max(premium_base_amount * premium_pct / 100, premium_min_per_stay_usd) * (100 - superhost_premium_discount_pct) / 100, 2)
  - id: protect_evt_guest_request
    subject: [protect_guest_payment_requested, protect_guest_payment_recorded, protect_guest_payment_reversed]
    rule: >-
      A host claims for guest damage by filing a claim on the stay and, where guest_request_required is true, by first
      asking the guest of that stay to pay. A payment request is sent to the guest only for a claim filed within
      claim_filing_window_days calendar days after the stay's check-out date; the days are counted from check_out_date to
      the date part of the claim's filed_at, and a claim filed on the last day stands. The guest has guest_response_hours
      elapsed hours from the request to pay in full, pay part, or decline; only the guest can pay, and paying is the
      guest's own act. A guest payment is credited to the host and reduces what Roamhaven pays; a payment reversed by the
      guest's card issuer is recovered from the host's payouts. A claim may be filed only once per stay per damage
      category (claims_per_stay_per_category), and a claimed amount below min_claim_amount_usd is not accepted.
    eligibility:
      - id: filed_in_window
        applies_to: [protect_guest_payment_requested]
        kind: time
        condition: A payment request is sent to the guest only for a claim filed within claim_filing_window_days calendar days after the stay's check-out date; the days are counted from check_out_date to the date part of the claim's filed_at, and a claim filed on the last day stands.
        evidence_fields: [stays.check_out_date, protection_claims.filed_at, protection_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_claims.claim_id]
          action_bindings:
            protection_claims.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the stay's check-out date
          anchor_source: stays.check_out_date
          relation: not_after
          duration_source: variants.claim_filing_window_days
          unit: calendar_days
          counting_rule: the days are counted from check_out_date to the date part of the claim's filed_at, and a claim filed on the last day stands.
          boundary: inclusive
  - id: protect_evt_reimbursement
    subject: [protect_reimbursement_paid]
    rule: >-
      Roamhaven pays a claim only after the guest has not paid it in full. A reimbursement is paid only on a claim the
      claims team has approved. A claim is escalated to Roamhaven only after the guest's response deadline has passed or
      the guest has declined, and the host must escalate within escalation_window_days calendar days after the guest's
      response deadline; the deadline is the request time plus guest_response_hours, and the days are counted from the
      date part of that deadline, an escalation on the last day standing. The stay must have checked in on or after the
      plan's effective date while the plan was active. The payable amount is computed in this order: start from the
      verified loss; for property_damage, pet_damage, theft and valuables claims, when depreciation_applies is true,
      deduct the depreciation_schedule percentage for the item's age in whole months (0-12, 13-36, 37-60, 61 and over);
      for a deep_cleaning claim, when deep_cleaning_offset_by_cleaning_fee is true, deduct the cleaning fee collected on
      the stay; subtract every guest payment recorded on the claim (net of reversals); subtract deductible_usd; floor at
      0.00; then cut to the category's sublimit (pet_damage_sublimit_usd, deep_cleaning_sublimit_usd, theft_sublimit_usd
      or valuables_sublimit_usd; property_damage and income_loss have none), to per_claim_limit_usd, and to the remaining
      aggregate under protect_agg_plan_year_limits. An income_loss claim is covered only where income_loss_covered is
      true, its verified loss is the nightly subtotal of the stays the host had to cancel for at most
      income_loss_max_nights nights, and it takes no depreciation. A payable amount of 0.00 is recorded as a denial, not
      a payment. A claim is reimbursed once. The reimbursement is credited to the default payout method.
    eligibility:
      - id: claim_approved
        applies_to: [protect_reimbursement_paid]
        kind: state
        condition: A reimbursement is paid only on a claim the claims team has approved.
        evidence_fields: [protection_claims.claim_status, protection_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_claims.claim_id]
          action_bindings:
            protection_claims.claim_id: claim_id
        state_contract:
          field: protection_claims.claim_status
          allowed: [approved]
      - id: escalated_in_time
        applies_to: [protect_reimbursement_paid]
        kind: time
        condition: A claim is escalated to Roamhaven only after the guest's response deadline has passed or the guest has declined, and the host must escalate within escalation_window_days calendar days after the guest's response deadline; the deadline is the request time plus guest_response_hours, and the days are counted from the date part of that deadline, an escalation on the last day standing.
        evidence_fields: [protection_claims.guest_response_due_at, protection_claims.escalated_at, protection_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_claims.claim_id]
          action_bindings:
            protection_claims.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the guest's response deadline
          anchor_source: protection_claims.guest_response_due_at
          relation: not_after
          duration_source: variants.escalation_window_days
          unit: calendar_days
          counting_rule: the deadline is the request time plus guest_response_hours, and the days are counted from the date part of that deadline, an escalation on the last day standing.
          boundary: inclusive
      - id: one_reimbursement_per_claim
        applies_to: [protect_reimbursement_paid]
        kind: dedup
        condition: A claim is reimbursed once.
        evidence_fields: [protection_events.claim_id, protection_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.claim_id]
          action_bindings:
            protection_events.claim_id: claim_id
        dedup_contract:
          table: protection_events
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [protect_reimbursement_paid]}
          distinct_fields: []
    params:
      per_tier:
        HostCover Essential: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Standard: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Plus: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Premier: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Elite: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
        HostCover Estate: {deductible_usd: "=deductible_usd", per_claim_limit_usd: "=per_claim_limit_usd", depreciation_applies: "=depreciation_applies"}
    formula:
      amount: min(max(verified_loss_amount - deductible_usd, 0), per_claim_limit_usd)
  - id: protect_evt_exclusions_and_denial
    subject: [protect_claim_denied]
    rule: >-
      A claim is denied, with the matching denial_reason, when it was filed after the filing window (filed_late), when
      no payment request was sent to the guest first (no_guest_request), when the damage is excluded — ordinary wear and
      tear, cash or securities, vehicles or watercraft, damage present before the stay, or damage caused by the host or
      the host's staff (excluded_damage) — when the claim lacks the evidence_required (insufficient_evidence), when the
      stay did not check in under an active plan (coverage_inactive), when the claimed amount is below
      min_claim_amount_usd (below_minimum), when the plan year's paid-claim count is used up (claim_limit_reached), or
      when the host did not escalate in time (not_escalated_in_time). Damage by a guest's service animal is covered as
      pet damage when service_animal_damage_covered is true. Bodily injury and third-party liability are never decided
      by support when liability_claims_handled_by_support is false. A host may appeal a denial once
      (appeals_per_claim) within appeal_window_days; the claims team's decision on the appeal is final.
    eligibility: []
  - id: protect_evt_subrogation
    subject: [protect_reimbursement_recovered]
    rule: >-
      After paying a claim, Roamhaven pursues the responsible guest for the amount it paid when subrogation_applies is
      true. Every amount recovered is booked against the claim, never exceeds the reimbursement paid on that claim net
      of earlier recoveries, and restores the plan-year aggregate. Recoveries never reach the host: the host was already
      paid, and a guest payment made after the reimbursement is a recovery, not a guest payment to the host.
    eligibility: []

extended_policies:
- id: protect_ext_theft_settlement
  base_policy_refs:
  - protect_evt_reimbursement
  - protect_agg_plan_year_limits
  overwrite:
  - base_policy: protect_evt_reimbursement
    superseded_clause: 'The payable amount is computed in this order: start from the verified loss;'
    replaced_by: The verified theft loss is first reduced by the theft depreciation share; the depreciated theft
      loss is then multiplied by the theft access share, that result by the theft repeat-loss share and that result
      by the theft escalation share, with no rounding between these steps; the figure so reached is the adjusted
      theft loss.
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract every guest payment recorded on the claim (net of reversals)
    replaced_by: 'The theft recovery-sharing method follows the plan level and decides how the guest payments recorded
      on the claim, net of reversals, are shared between Roamhaven and the host:'
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract deductible_usd
    replaced_by: 'A theft claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd
      divided by the number of approved claims filed on the same stay.'
  trigger: state_due
  subject:
  - protect_reimbursement_paid
  computes: amount
  target_tool: pay_theft_reimbursement_c380c173
  params:
    theft_dep_pct_13_36: 20.0
    theft_dep_pct_37_60: 40.0
    theft_dep_pct_61_plus: 60.0
    theft_shared_room_share_pct: 50.0
    theft_private_room_share_pct: 75.0
    theft_superhost_deductible_factor: 0.5
    theft_repeat_claims_deductible_factor: 1.5
    theft_repeat_one_share_pct: 90.0
    theft_repeat_two_share_pct: 75.0
    theft_escalation_8_21_share_pct: 95.0
    theft_escalation_22_30_share_pct: 90.0
  rule: 'This rule settles a theft claim that the claims team has approved on a HostCover plan; the figure it produces
    is the theft reimbursement Roamhaven books on that claim, and every base condition on paying a claim (approval,
    escalation in time, coverage of the stay, one reimbursement per claim) continues to apply. The theft reimbursement
    starts from the loss the claims team verified on the approved theft claim. A theft claim bears an equal share
    of the stay''s deductible: the plan level''s deductible_usd divided by the number of approved claims filed on
    the same stay. From the verified theft loss, every guest payment recorded on the theft claim, net of reversals,
    is subtracted together with the theft claim''s deductible share. The result is floored at 0.00 and then cut
    to the lowest of the level''s theft_sublimit_usd, the level''s per_claim_limit_usd and the plan''s remaining
    aggregate, which is the level''s annual_aggregate_limit_usd less the reimbursements, net of recoveries, posted
    on the plan in the current plan year. The theft reimbursement is rounded half up to the nearest cent only at
    the end. The theft depreciation share follows the plan level and the age in whole months the claim records for
    the stolen items: on a level whose depreciation_applies is true, items 61 months old or older are depreciated
    by theft_dep_pct_61_plus percent, items 37 to 60 months old by theft_dep_pct_37_60 percent and items 13 to 36
    months old by theft_dep_pct_13_36 percent; items 12 months old or younger, and items on a level whose depreciation_applies
    is false, are not depreciated. The theft access share follows the space type of the listing the plan covers:
    theft from a Shared Room listing is settled at theft_shared_room_share_pct percent, theft from a Private Room
    listing at theft_private_room_share_pct percent, and theft from a listing of any other space type in full. The
    theft deductible factor follows the host''s standing and the plan''s recent claims: a host whose account tier
    is Superhost, with a Superhost run that began on or before the stay''s check-in date (the date the host service
    fee was assessed on the stay), on a plan with no claim from another stay reimbursed in the 12 months before
    the settlement date, bears theft_superhost_deductible_factor times the theft claim''s deductible share; a host
    who is not such a Superhost, on a plan with two or more claims from other stays reimbursed in those 12 months,
    bears theft_repeat_claims_deductible_factor times the share; every other host bears the share as it stands.
    The theft recovery-sharing method follows the plan level and decides how the guest payments recorded on the
    claim, net of reversals, are shared between Roamhaven and the host: on HostCover Premier, HostCover Elite or
    HostCover Estate the guest payments first restore the deductible the theft claim bears, so only the larger of
    those payments and that deductible is subtracted from the adjusted theft loss; on HostCover Standard or HostCover
    Plus the guest payments are shared in proportion to the parts of the loss each side bears, so that deductible
    is subtracted from the adjusted theft loss together with the guest payments multiplied by the adjusted theft
    loss less that deductible (never below 0.00) and divided by the adjusted theft loss; on any other level the
    guest payments and that deductible are both subtracted from the adjusted theft loss. The theft repeat-loss share
    follows the theft claims on the same plan that the claims team approved in the 24 months before the settlement
    date, leaving out claims on the same stay, because a listing that has already lost belongings to a guest is
    expected to lock away or remove portable valuables and electronics before it is let again: with two or more
    such claims the theft is settled at theft_repeat_two_share_pct percent, with exactly one at theft_repeat_one_share_pct
    percent, and with none in full. The theft escalation share follows the calendar days from the date part of the
    guest''s response deadline to the date part of the host''s escalation of the claim: an escalation 22 to 30 days
    after the deadline settles the theft at theft_escalation_22_30_share_pct percent, one 8 to 21 days after at
    theft_escalation_8_21_share_pct percent, and one 7 days or fewer after in full. The verified theft loss is first
    reduced by the theft depreciation share; the depreciated theft loss is then multiplied by the theft access share,
    that result by the theft repeat-loss share and that result by the theft escalation share, with no rounding between
    these steps; the figure so reached is the adjusted theft loss. The guest payments and the deductible are then
    subtracted as the theft recovery-sharing method directs, the result is floored at 0.00 and cut to the lowest
    of the theft sublimit, the per-claim limit and the remaining aggregate, and only that figure is rounded.'
  prerequisite: []
  cross_category:
  - category: listing
    as: branch
    reads:
    - variant_name
    note: the theft access share is decided from the space type of the listing the plan covers
  - category: host
    as: history
    reads:
    - variant_name
    - superhost_since
    - host_account_events.event_date
    note: the theft deductible factor reads the host's Superhost run and the stay's check-in date from the host
      service fee assessed on the stay
  compute:
  - th_claim: LATEST('protection_claims', 'claim_id', date_field='decided_at', claim_status='approved', damage_category='theft')
  - th_stay: LATEST('protection_claims', 'stay_id', date_field='decided_at', claim_status='approved', damage_category='theft')
  - th_loss: LATEST('protection_claims', 'verified_loss_amount', date_field='decided_at', claim_status='approved',
      damage_category='theft')
  - th_item_age: LATEST('protection_claims', 'item_age_months', date_field='decided_at', claim_status='approved',
      damage_category='theft')
  - th_dep_pct: K('theft_dep_pct_61_plus') if (P('depreciation_applies') and th_item_age >= 61) else (K('theft_dep_pct_37_60')
      if (P('depreciation_applies') and th_item_age >= 37) else (K('theft_dep_pct_13_36') if (P('depreciation_applies')
      and th_item_age >= 13) else 0))
  - th_space_type: CFIELD('listing', 'variant_name', listing_id=F('listing_id'))
  - th_access_pct: K('theft_shared_room_share_pct') if th_space_type == 'Shared Room' else (K('theft_private_room_share_pct')
      if th_space_type == 'Private Room' else 100)
  - th_checkin: XLATEST('host', 'host_account_events', 'event_date', date_field='event_date', event_type='host_service_fee_assessed',
      stay_id=th_stay)
  - th_superhost_run: CFIELD('host', 'variant_name') == 'Superhost' and CFIELD('host', 'superhost_since') != ''
      and CFIELD('host', 'superhost_since') <= th_checkin
  - th_other_paid_12m: COUNT('protection_events', within_months=12, date_field='posted_date', event_type='protect_reimbursement_paid')
      - COUNT('protection_events', event_type='protect_reimbursement_paid', stay_id=th_stay)
  - th_ded_factor: K('theft_superhost_deductible_factor') if (th_superhost_run and th_other_paid_12m == 0) else
      (K('theft_repeat_claims_deductible_factor') if ((not th_superhost_run) and th_other_paid_12m >= 2) else 1)
  - th_stay_claims: COUNT('protection_claims', stay_id=th_stay, claim_status='approved')
  - th_ded_share: P('deductible_usd') / th_stay_claims
  - th_deductible: th_ded_share * th_ded_factor
  - th_guest_paid: SUM('protection_events', 'amount', event_type='protect_guest_payment_recorded', claim_id=th_claim)
      - SUM('protection_events', 'amount', event_type='protect_guest_payment_reversed', claim_id=th_claim)
  - th_repeat_count: COUNT('protection_claims', within_months=24, date_field='decided_at', claim_status='approved',
      damage_category='theft') - COUNT('protection_claims', claim_status='approved', damage_category='theft', stay_id=th_stay)
  - th_repeat_pct: K('theft_repeat_two_share_pct') if th_repeat_count >= 2 else (K('theft_repeat_one_share_pct')
      if th_repeat_count == 1 else 100)
  - th_deadline: LATEST('protection_claims', 'guest_response_due_at', date_field='decided_at', claim_status='approved',
      damage_category='theft')
  - th_escalated: LATEST('protection_claims', 'escalated_at', date_field='decided_at', claim_status='approved',
      damage_category='theft')
  - th_escalation_days: DAYS(th_deadline, th_escalated)
  - th_escalation_pct: K('theft_escalation_22_30_share_pct') if th_escalation_days >= 22 else (K('theft_escalation_8_21_share_pct')
      if th_escalation_days >= 8 else 100)
  - th_covered: th_loss * (100 - th_dep_pct) / 100 * th_access_pct / 100 * th_repeat_pct / 100 * th_escalation_pct
      / 100
  - th_offset: MX(th_guest_paid, th_deductible) if (F('variant_name') == 'HostCover Premier' or F('variant_name')
      == 'HostCover Elite' or F('variant_name') == 'HostCover Estate') else (th_deductible + th_guest_paid * MX(0,
      th_covered - th_deductible) / th_covered if ((F('variant_name') == 'HostCover Standard' or F('variant_name')
      == 'HostCover Plus') and th_covered > 0) else th_guest_paid + th_deductible)
  - th_net: MX(0, th_covered - th_offset)
  - th_year_net: SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'), NOW) + 1, date_field='posted_date',
      event_type='protect_reimbursement_paid') - SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'),
      NOW) + 1, date_field='posted_date', event_type='protect_reimbursement_recovered')
  - th_cap: MN(P('theft_sublimit_usd'), P('per_claim_limit_usd'), MX(0, P('annual_aggregate_limit_usd') - th_year_net))
  - result: RND(MN(th_net, th_cap), 2)
  compute_basis:
    th_claim: This rule settles a theft claim that the claims team has approved on a HostCover plan; the figure
      it produces is the theft reimbursement Roamhaven books on that claim
    th_stay: 'A theft claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd divided
      by the number of approved claims filed on the same stay.'
    th_loss: The theft reimbursement starts from the loss the claims team verified on the approved theft claim.
    th_item_age: the age in whole months the claim records for the stolen items
    th_dep_pct: on a level whose depreciation_applies is true, items 61 months old or older are depreciated by theft_dep_pct_61_plus
      percent, items 37 to 60 months old by theft_dep_pct_37_60 percent and items 13 to 36 months old by theft_dep_pct_13_36
      percent; items 12 months old or younger, and items on a level whose depreciation_applies is false, are not
      depreciated.
    th_space_type: 'The theft access share follows the space type of the listing the plan covers:'
    th_access_pct: theft from a Shared Room listing is settled at theft_shared_room_share_pct percent, theft from
      a Private Room listing at theft_private_room_share_pct percent, and theft from a listing of any other space
      type in full.
    th_checkin: the stay's check-in date (the date the host service fee was assessed on the stay)
    th_superhost_run: a host whose account tier is Superhost, with a Superhost run that began on or before the stay's
      check-in date (the date the host service fee was assessed on the stay)
    th_other_paid_12m: on a plan with no claim from another stay reimbursed in the 12 months before the settlement
      date
    th_ded_factor: a host whose account tier is Superhost, with a Superhost run that began on or before the stay's
      check-in date (the date the host service fee was assessed on the stay), on a plan with no claim from another
      stay reimbursed in the 12 months before the settlement date, bears theft_superhost_deductible_factor times
      the theft claim's deductible share; a host who is not such a Superhost, on a plan with two or more claims
      from other stays reimbursed in those 12 months, bears theft_repeat_claims_deductible_factor times the share;
      every other host bears the share as it stands.
    th_stay_claims: the number of approved claims filed on the same stay
    th_ded_share: 'A theft claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd
      divided by the number of approved claims filed on the same stay.'
    th_guest_paid: how the guest payments recorded on the claim, net of reversals, are shared between Roamhaven
      and the host
    th_offset: on HostCover Premier, HostCover Elite or HostCover Estate the guest payments first restore the deductible
      the theft claim bears, so only the larger of those payments and that deductible is subtracted from the adjusted
      theft loss; on HostCover Standard or HostCover Plus the guest payments are shared in proportion to the parts
      of the loss each side bears, so that deductible is subtracted from the adjusted theft loss together with the
      guest payments multiplied by the adjusted theft loss less that deductible (never below 0.00) and divided by
      the adjusted theft loss; on any other level the guest payments and that deductible are both subtracted from
      the adjusted theft loss.
    th_repeat_count: the theft claims on the same plan that the claims team approved in the 24 months before the
      settlement date, leaving out claims on the same stay
    th_repeat_pct: with two or more such claims the theft is settled at theft_repeat_two_share_pct percent, with
      exactly one at theft_repeat_one_share_pct percent, and with none in full.
    th_deadline: the calendar days from the date part of the guest's response deadline to the date part of the host's
      escalation of the claim
    th_escalated: the calendar days from the date part of the guest's response deadline to the date part of the
      host's escalation of the claim
    th_escalation_days: the calendar days from the date part of the guest's response deadline to the date part of
      the host's escalation of the claim
    th_escalation_pct: an escalation 22 to 30 days after the deadline settles the theft at theft_escalation_22_30_share_pct
      percent, one 8 to 21 days after at theft_escalation_8_21_share_pct percent, and one 7 days or fewer after
      in full.
    th_covered: The verified theft loss is first reduced by the theft depreciation share; the depreciated theft
      loss is then multiplied by the theft access share, that result by the theft repeat-loss share and that result
      by the theft escalation share, with no rounding between these steps; the figure so reached is the adjusted
      theft loss.
    th_net: The guest payments and the deductible are then subtracted as the theft recovery-sharing method directs,
      the result is floored at 0.00
    th_year_net: the reimbursements, net of recoveries, posted on the plan in the current plan year
    th_cap: cut to the lowest of the level's theft_sublimit_usd, the level's per_claim_limit_usd and the plan's
      remaining aggregate, which is the level's annual_aggregate_limit_usd less the reimbursements, net of recoveries,
      posted on the plan in the current plan year.
    result: The theft reimbursement is rounded half up to the nearest cent only at the end.
  factors:
  - id: theft_depreciation_share
    effect: parameter
    decides: th_dep_pct
    bindings:
    - th_item_age
    - th_dep_pct
    ladder:
    - when: the plan level depreciates items (depreciation_applies is true) and the claim records the stolen items
        as 61 months old or older
      value: K('theft_dep_pct_61_plus')
    - when: the plan level depreciates items and the claim records them as 37 to 60 months old
      value: K('theft_dep_pct_37_60')
    - when: the plan level depreciates items and the claim records them as 13 to 36 months old
      value: K('theft_dep_pct_13_36')
    - when: otherwise (items 12 months old or younger, or a level that does not depreciate)
      value: 0 (no depreciation)
    baseline:
      th_dep_pct: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: theft_access_share
    effect: parameter
    decides: th_access_pct
    bindings:
    - th_space_type
    - th_access_pct
    ladder:
    - when: the listing the plan covers is a Shared Room
      value: K('theft_shared_room_share_pct')
    - when: the listing the plan covers is a Private Room
      value: K('theft_private_room_share_pct')
    - when: otherwise (any other space type)
      value: 100 (settled in full)
    baseline:
      th_access_pct: '100'
    evidence:
    - cross_category
    cross_difficulty: listing
  - id: theft_deductible_factor
    effect: parameter
    decides: th_ded_factor
    bindings:
    - th_checkin
    - th_superhost_run
    - th_other_paid_12m
    - th_ded_factor
    ladder:
    - when: the host account is a Superhost whose run began on or before the stay's check-in date AND no claim from
        another stay was reimbursed on the plan in the 12 months before the settlement date
      value: K('theft_superhost_deductible_factor')
    - when: the host is not such a Superhost AND two or more claims from other stays were reimbursed on the plan
        in those 12 months
      value: K('theft_repeat_claims_deductible_factor')
    - when: otherwise
      value: 1 (the deductible share as it stands)
    baseline:
      th_ded_factor: '1'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: host
  - id: theft_recovery_sharing_method
    effect: method
    decides: th_offset
    bindings:
    - th_guest_paid
    - th_offset
    ladder:
    - when: the plan level is HostCover Premier, HostCover Elite or HostCover Estate
      method: 'the guest payments first restore the deductible: subtract from the adjusted theft loss only the larger
        of the guest payments and the deductible (made whole first)'
    - when: the plan level is HostCover Standard or HostCover Plus
      method: 'share the guest payments in proportion: subtract from the adjusted theft loss the deductible plus
        the guest payments times (the adjusted theft loss less the deductible, never below 0.00) divided by the
        adjusted theft loss'
    - when: otherwise (HostCover Essential)
      method: subtract the guest payments and the deductible both from the adjusted theft loss (Roamhaven credited
        first)
    baseline:
      th_offset: th_guest_paid + th_deductible
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: theft_repeat_loss_share
    effect: parameter
    decides: th_repeat_pct
    bindings:
    - th_repeat_count
    - th_repeat_pct
    ladder:
    - when: two or more theft claims from other stays were approved on the plan in the 24 months before the settlement
        date
      value: K('theft_repeat_two_share_pct')
    - when: exactly one such theft claim was approved in those 24 months
      value: K('theft_repeat_one_share_pct')
    - when: otherwise (none)
      value: 100 (settled in full)
    baseline:
      th_repeat_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: theft_escalation_share
    effect: parameter
    decides: th_escalation_pct
    bindings:
    - th_deadline
    - th_escalated
    - th_escalation_days
    - th_escalation_pct
    ladder:
    - when: the host escalated the claim 22 to 30 calendar days after the date of the guest's response deadline
      value: K('theft_escalation_22_30_share_pct')
    - when: the host escalated 8 to 21 calendar days after that date
      value: K('theft_escalation_8_21_share_pct')
    - when: otherwise (7 days or fewer after)
      value: 100 (settled in full)
    baseline:
      th_escalation_pct: '100'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: 'The theft reimbursement starts from the loss the claims team verified on the approved theft claim. A
      theft claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd divided by the
      number of approved claims filed on the same stay. From the verified theft loss, every guest payment recorded
      on the theft claim, net of reversals, is subtracted together with the theft claim''s deductible share. The
      result is floored at 0.00 and then cut to the lowest of the level''s theft_sublimit_usd, the level''s per_claim_limit_usd
      and the plan''s remaining aggregate, which is the level''s annual_aggregate_limit_usd less the reimbursements,
      net of recoveries, posted on the plan in the current plan year. The theft reimbursement is rounded half up
      to the nearest cent only at the end.'
    params:
    - deductible_usd
    - theft_sublimit_usd
    - per_claim_limit_usd
    - annual_aggregate_limit_usd
  inputs:
    history:
    - table: protection_claims
      aggregate: latest
      field: verified_loss_amount
      filters:
        claim_status: approved
        damage_category: theft
    - table: protection_claims
      aggregate: count
      field: claim_id
      within_months: 24
      filters:
        claim_status: approved
        damage_category: theft
    - table: protection_events
      aggregate: count
      field: protection_event_id
      within_months: 12
      filters:
        event_type: protect_reimbursement_paid
    - table: protection_events
      aggregate: sum
      field: amount
      filters:
        event_type: protect_guest_payment_recorded
    - category: host
      table: host_account_events
      aggregate: latest
      field: event_date
      filters:
        event_type: host_service_fee_assessed
    cross_category:
    - listing
    - host
- id: protect_ext_valuables_settlement
  base_policy_refs:
  - protect_evt_reimbursement
  - protect_agg_plan_year_limits
  overwrite:
  - base_policy: protect_evt_reimbursement
    superseded_clause: 'The payable amount is computed in this order: start from the verified loss;'
    replaced_by: The verified valuables loss is first reduced by the valuables depreciation share; the depreciated
      valuables loss is then multiplied by the valuables access share, that result by the valuables new-cover share
      and that result by the valuables escalation share, with no rounding between these steps; the figure so reached
      is the adjusted valuables loss.
  - base_policy: protect_evt_reimbursement
    superseded_clause: for property_damage, pet_damage, theft and valuables claims, when depreciation_applies is
      true, deduct the depreciation_schedule percentage for the item's age in whole months (0-12, 13-36, 37-60,
      61 and over);
    replaced_by: 'The valuables depreciation share follows the plan level and the age in whole months the claim
      records for the art, jewellery or collectibles:'
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract every guest payment recorded on the claim (net of reversals)
    replaced_by: 'The valuables recovery-sharing method follows the plan level and decides how the guest payments
      recorded on the claim, net of reversals, are shared between Roamhaven and the host:'
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract deductible_usd
    replaced_by: 'A stay bears its deductible once: each claim of the stay that already carries a reimbursement
      has borne an equal share of it, that share being the plan level''s deductible_usd divided by the number of
      approved claims filed on the stay, and the valuables claim bears the part of the level''s deductible_usd those
      reimbursed claims have not borne.'
  trigger: on_request
  subject:
  - protect_reimbursement_paid
  computes: amount
  target_tool: accept_valuables_settlement_01cb0de3
  params:
    valuables_dep_pct_13_60: 10.0
    valuables_dep_pct_61_120: 20.0
    valuables_dep_pct_121_plus: 30.0
    valuables_shared_room_share_pct: 25.0
    valuables_private_room_share_pct: 50.0
    valuables_new_cover_under_90_share_pct: 50.0
    valuables_new_cover_90_364_share_pct: 75.0
    valuables_escalation_8_21_share_pct: 90.0
    valuables_escalation_22_30_share_pct: 80.0
    valuables_superhost_deductible_factor: 0.5
    valuables_repeat_claims_deductible_factor: 1.5
  rule: 'This rule settles a valuables claim (art, jewellery or collectibles) that the claims team has approved
    on a HostCover plan; because the value of such items rests on the host''s own appraisals, provenance and receipts,
    a valuables settlement is booked only when the host accepts it in person, and the figure this rule produces
    is the valuables settlement booked on that claim when the host accepts it. Every base condition on paying a
    claim (approval, escalation in time, coverage of the stay, one reimbursement per claim) continues to apply.
    Where the same stay also carries an approved theft claim, the valuables settlement is fixed only after the plan''s
    HostCover ledger shows a reimbursement on that theft claim. The valuables settlement starts from the loss the
    claims team verified on the approved valuables claim. A stay bears its deductible once: each claim of the stay
    that already carries a reimbursement has borne an equal share of it, that share being the plan level''s deductible_usd
    divided by the number of approved claims filed on the stay, and the valuables claim bears the part of the level''s
    deductible_usd those reimbursed claims have not borne. From the verified valuables loss, every guest payment
    recorded on the valuables claim, net of reversals, is subtracted together with the deductible the valuables
    claim bears. The result is floored at 0.00 and then cut to the lowest of the level''s valuables_sublimit_usd,
    the level''s per_claim_limit_usd and the plan''s remaining aggregate, which is the level''s annual_aggregate_limit_usd
    less the reimbursements, net of recoveries, posted on the plan in the current plan year. The valuables settlement
    is rounded half up to the nearest cent only at the end. The valuables depreciation share follows the plan level
    and the age in whole months the claim records for the art, jewellery or collectibles: on a level whose depreciation_applies
    is true, valuables 121 months old or older are depreciated by valuables_dep_pct_121_plus percent, valuables
    61 to 120 months old by valuables_dep_pct_61_120 percent and valuables 13 to 60 months old by valuables_dep_pct_13_60
    percent, because they hold their value better than furnishings; valuables 12 months old or younger, and valuables
    on a level whose depreciation_applies is false, are not depreciated. The valuables access share follows the
    space type of the listing the plan covers: valuables lost from a Shared Room listing are settled at valuables_shared_room_share_pct
    percent, from a Private Room listing at valuables_private_room_share_pct percent, and from a listing of any
    other space type in full. The valuables new-cover share follows how long the plan had held its current HostCover
    level when the stay checked in, counted in calendar days from the plan''s last level change (or from its enrollment
    when the level was never changed) to the date the host service fee was assessed on the stay: fewer than 90 days
    settles the valuables at valuables_new_cover_under_90_share_pct percent, 90 to 364 days at valuables_new_cover_90_364_share_pct
    percent, and 365 days or more in full. The valuables escalation share follows the calendar days from the date
    part of the guest''s response deadline to the date part of the host''s escalation of the valuables claim: an
    escalation 22 to 30 days after the deadline settles the valuables at valuables_escalation_22_30_share_pct percent,
    one 8 to 21 days after at valuables_escalation_8_21_share_pct percent, and one 7 days or fewer after in full.
    The valuables deductible factor follows the host''s standing and the plan''s recent claims: a host whose account
    tier is Superhost, with a Superhost run that began on or before the date the host service fee was assessed on
    the stay, on a plan with no claim from another stay reimbursed in the 12 months before the settlement date,
    bears valuables_superhost_deductible_factor times the deductible the valuables claim bears; a host who is not
    such a Superhost, on a plan with two or more claims from other stays reimbursed in those 12 months, bears valuables_repeat_claims_deductible_factor
    times it; every other host bears it as it stands. The valuables recovery-sharing method follows the plan level
    and decides how the guest payments recorded on the claim, net of reversals, are shared between Roamhaven and
    the host: on HostCover Premier, HostCover Elite or HostCover Estate the guest payments first restore the deductible
    the valuables claim bears, so only the larger of those payments and that deductible is subtracted from the adjusted
    valuables loss; on HostCover Standard or HostCover Plus the guest payments are shared in proportion to the parts
    of the loss each side bears, so that deductible is subtracted from the adjusted valuables loss together with
    the guest payments multiplied by the adjusted valuables loss less that deductible (never below 0.00) and divided
    by the adjusted valuables loss; on any other level the guest payments and that deductible are both subtracted
    from the adjusted valuables loss. The verified valuables loss is first reduced by the valuables depreciation
    share; the depreciated valuables loss is then multiplied by the valuables access share, that result by the valuables
    new-cover share and that result by the valuables escalation share, with no rounding between these steps; the
    figure so reached is the adjusted valuables loss. The guest payments and the deductible are then subtracted
    as the valuables recovery-sharing method directs, the result is floored at 0.00 and cut to the lowest of the
    valuables sublimit, the per-claim limit and the remaining aggregate, and only that figure is rounded.'
  prerequisite:
  - problem: protect_ext_theft_settlement
    kind: value_input
    gate: va_stay_settled
    form: state
    policy_source: Where the same stay also carries an approved theft claim, the valuables settlement is fixed only
