      pet escalation share, with no rounding between these steps; the figure so reached is the adjusted pet-damage
      loss.
    pe_net: The guest payments and the deductible are then subtracted as the pet recovery-sharing method directs,
      the result is floored at 0.00
    pe_year_net: the reimbursements, net of recoveries, posted on the plan in the current plan year
    pe_cap: cut to the lowest of the level's pet_damage_sublimit_usd, the level's per_claim_limit_usd and the plan's
      remaining aggregate, which is the level's annual_aggregate_limit_usd less the reimbursements, net of recoveries,
      posted on the plan in the current plan year.
    result: The pet-damage reimbursement is rounded half up to the nearest cent only at the end.
  factors:
  - id: pet_depreciation_share
    effect: parameter
    decides: pe_dep_pct
    bindings:
    - pe_item_age
    - pe_dep_pct
    ladder:
    - when: the plan level depreciates items (depreciation_applies is true) and the claim records the items the
        pet damaged as 61 months old or older
      value: K('pet_dep_pct_61_plus')
    - when: the plan level depreciates items and the claim records them as 37 to 60 months old
      value: K('pet_dep_pct_37_60')
    - when: the plan level depreciates items and the claim records them as 13 to 36 months old
      value: K('pet_dep_pct_13_36')
    - when: otherwise (items 12 months old or younger, or a level that does not depreciate)
      value: 0 (no depreciation)
    baseline:
      pe_dep_pct: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: pet_fee_share
    effect: parameter
    decides: pe_fee_pct
    bindings:
    - pe_listing_pet_fee
    - pe_fee_pct
    ladder:
    - when: the listing under the plan charges a pet fee of 100.00 or more per stay
      value: K('pet_fee_100_plus_share_pct')
    - when: the listing charges a pet fee above 0.00 but below 100.00
      value: K('pet_fee_under_100_share_pct')
    - when: otherwise (the listing charges no pet fee)
      value: 100 (settled in full)
    baseline:
      pe_fee_pct: '100'
    evidence:
    - cross_category
    cross_difficulty: listing
  - id: pet_condition_share
    effect: parameter
    decides: pe_condition_pct
    bindings:
    - pe_quality
    - pe_condition_pct
    ladder:
    - when: the most recent quality review recorded on the listing ended in a suspension
      value: K('pet_condition_suspension_share_pct')
    - when: the most recent quality review ended in a warning
      value: K('pet_condition_warning_share_pct')
    - when: otherwise (any other outcome, or no review)
      value: 100 (settled in full)
    baseline:
      pe_condition_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: listing
  - id: pet_escalation_share
    effect: parameter
    decides: pe_escalation_pct
    bindings:
    - pe_deadline
    - pe_escalated
    - pe_escalation_days
    - pe_escalation_pct
    ladder:
    - when: the host escalated the pet-damage claim 22 to 30 calendar days after the date of the guest's response
        deadline
      value: K('pet_escalation_22_30_share_pct')
    - when: the host escalated 8 to 21 calendar days after that date
      value: K('pet_escalation_8_21_share_pct')
    - when: otherwise (7 days or fewer after)
      value: 100 (settled in full)
    baseline:
      pe_escalation_pct: '100'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: pet_recovery_sharing_method
    effect: method
    decides: pe_offset
    bindings:
    - pe_guest_paid
    - pe_offset
    ladder:
    - when: the plan level is HostCover Premier, HostCover Elite or HostCover Estate
      method: 'the guest payments first restore the deductible: subtract from the adjusted pet-damage loss only
        the larger of the guest payments and the deductible (made whole first)'
    - when: the plan level is HostCover Standard or HostCover Plus
      method: 'share the guest payments in proportion: subtract from the adjusted pet-damage loss the deductible
        plus the guest payments times (the adjusted pet-damage loss less the deductible, never below 0.00) divided
        by the adjusted pet-damage loss'
    - when: otherwise (HostCover Essential)
      method: subtract the guest payments and the deductible both from the adjusted pet-damage loss (Roamhaven credited
        first)
    baseline:
      pe_offset: pe_guest_paid + pe_deductible
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The pet-damage reimbursement starts from the loss the claims team verified on the approved pet-damage
      claim. A pet-damage claim bears an equal share of the stay''s deductible: the plan level''s deductible_usd
      divided by the number of approved claims filed on the same stay. From the verified pet-damage loss, every
      guest payment recorded on the pet-damage claim, net of reversals, is subtracted together with the pet-damage
      claim''s deductible share. The result is floored at 0.00 and then cut to the lowest of the level''s pet_damage_sublimit_usd,
      the level''s per_claim_limit_usd and the plan''s remaining aggregate, which is the level''s annual_aggregate_limit_usd
      less the reimbursements, net of recoveries, posted on the plan in the current plan year. The pet-damage reimbursement
      is rounded half up to the nearest cent only at the end.'
    params:
    - deductible_usd
    - pet_damage_sublimit_usd
    - per_claim_limit_usd
    - annual_aggregate_limit_usd
  inputs:
    history:
    - table: protection_claims
      aggregate: latest
      field: verified_loss_amount
      filters:
        claim_status: approved
        damage_category: pet_damage
    - table: protection_claims
      aggregate: count
      field: claim_id
      filters:
        claim_status: approved
    - table: protection_events
      aggregate: sum
      field: amount
      filters:
        event_type: protect_guest_payment_recorded
    - category: listing
      table: listing_events
      aggregate: latest
      field: quality_outcome
      filters:
        event_type: listing_quality_reviewed
    cross_category:
    - listing
- id: protect_ext_income_loss_settlement
  base_policy_refs:
  - protect_evt_reimbursement
  - protect_agg_plan_year_limits
  overwrite:
  - base_policy: protect_evt_reimbursement
    superseded_clause: 'The payable amount is computed in this order: start from the verified loss;'
    replaced_by: The lost-income value set by the lost-nights method is first multiplied by the cancellation timing
      share, that result by the income escalation share and that result by the income new-cover share, with no rounding
      between these steps; the figure so reached is the adjusted lost income.
  - base_policy: protect_evt_reimbursement
    superseded_clause: its verified loss is the nightly subtotal of the stays the host had to cancel for at most
      income_loss_max_nights nights
    replaced_by: 'The lost-nights method values the lost income from the claim''s verified loss and the nights the
      listing''s calendar holds blocked for the booking the host cancelled (the most recent calendar block placed
      on the listing for a host cancellation, counted from its first blocked night to the day after its last):'
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract every guest payment recorded on the claim (net of reversals)
    replaced_by: 'The income recovery-sharing method follows the plan level and decides how the guest payments recorded
      on the claim, net of reversals, are shared between Roamhaven and the host:'
  - base_policy: protect_evt_reimbursement
    superseded_clause: subtract deductible_usd
    replaced_by: 'A stay bears its deductible once: each claim of the stay that already carries a reimbursement
      has borne an equal share of it, that share being the plan level''s deductible_usd divided by the number of
      approved claims filed on the stay, and the income-loss claim bears the part of the level''s deductible_usd
      those reimbursed claims have not borne.'
  trigger: on_request
  subject:
  - protect_reimbursement_paid
  computes: amount
  target_tool: accept_income_loss_settlement_ab094655
  params:
    income_cancel_30_days_to_48_hours_share_pct: 80.0
    income_cancel_more_than_30_days_share_pct: 50.0
    income_escalation_8_21_share_pct: 95.0
    income_escalation_22_30_share_pct: 85.0
    income_new_cover_under_90_share_pct: 50.0
    income_new_cover_90_364_share_pct: 75.0
  rule: 'This rule settles an income-loss claim that the claims team has approved on a HostCover plan: the lost
    booking income of a host who had to cancel confirmed bookings because damage from a guest''s stay made the listing
    unusable. Lost-income settlements rest on the host''s own cancelled bookings, so the host confirms them and
    accepts the settlement in person, and the figure this rule produces is the income-loss settlement booked when
    the host accepts it. Every base condition on paying a claim (approval, escalation in time, coverage of the stay,
    one reimbursement per claim, income loss covered only where income_loss_covered is true, no depreciation) continues
    to apply. The income-loss settlement is not fixed until the plan''s HostCover ledger shows a reimbursement on
    every approved property-damage claim of the same stay. The income-loss settlement is likewise not fixed until
    the ledger shows a reimbursement on every approved pet-damage claim of the same stay. The income-loss settlement
    starts from the loss the claims team verified on the approved income-loss claim. A stay bears its deductible
    once: each claim of the stay that already carries a reimbursement has borne an equal share of it, that share
    being the plan level''s deductible_usd divided by the number of approved claims filed on the stay, and the income-loss
    claim bears the part of the level''s deductible_usd those reimbursed claims have not borne. From the verified
    lost income, every guest payment recorded on the income-loss claim, net of reversals, is subtracted together
    with the deductible the income-loss claim bears. The result is floored at 0.00 and then cut to the lower of
    the level''s per_claim_limit_usd and the plan''s remaining aggregate, which is the level''s annual_aggregate_limit_usd
    less the reimbursements, net of recoveries, posted on the plan in the current plan year; income loss carries
    no category sublimit. The income-loss settlement is rounded half up to the nearest cent only at the end. The
    lost-nights method values the lost income from the claim''s verified loss and the nights the listing''s calendar
    holds blocked for the booking the host cancelled (the most recent calendar block placed on the listing for a
    host cancellation, counted from its first blocked night to the day after its last): on a level whose income_loss_covered
    is false nothing is payable; on a covering level, when the blocked nights exceed income_loss_max_nights, the
    verified loss is multiplied by income_loss_max_nights and divided by the blocked nights; otherwise the verified
    loss is taken whole. The cancellation timing share follows the host cancellation recorded on the host account
    for that cancelled booking: a cancellation the host initiated in the more_than_30_days band settles the lost
    income at income_cancel_more_than_30_days_share_pct percent, because a booking that far ahead could have been
    kept once repairs were done; one the host initiated in the 30_days_to_48_hours band at income_cancel_30_days_to_48_hours_share_pct
    percent; and a cancellation in the under_48_hours band, or one Roamhaven initiated, in full. The income escalation
    share follows the calendar days from the date part of the guest''s response deadline to the date part of the
    host''s escalation of the income-loss claim: an escalation 22 to 30 days after the deadline settles the lost
    income at income_escalation_22_30_share_pct percent, one 8 to 21 days after at income_escalation_8_21_share_pct
    percent, and one 7 days or fewer after in full. The income new-cover share follows how long the plan had held
    its current HostCover level when the damaged stay checked in, counted in calendar days from the plan''s last
    level change (or from its enrollment when the level was never changed) to the date the host service fee was
    assessed on that stay: fewer than 90 days settles the lost income at income_new_cover_under_90_share_pct percent,
    90 to 364 days at income_new_cover_90_364_share_pct percent, and 365 days or more in full. The income recovery-sharing
    method follows the plan level and decides how the guest payments recorded on the claim, net of reversals, are
    shared between Roamhaven and the host: on HostCover Premier, HostCover Elite or HostCover Estate the guest payments
    first restore the deductible the income-loss claim bears, so only the larger of those payments and that deductible
    is subtracted from the adjusted lost income; on HostCover Standard or HostCover Plus the guest payments are
    shared in proportion to the parts of the loss each side bears, so that deductible is subtracted from the adjusted
    lost income together with the guest payments multiplied by the adjusted lost income less that deductible (never
    below 0.00) and divided by the adjusted lost income; on any other level the guest payments and that deductible
    are both subtracted from the adjusted lost income. The lost-income value set by the lost-nights method is first
    multiplied by the cancellation timing share, that result by the income escalation share and that result by the
    income new-cover share, with no rounding between these steps; the figure so reached is the adjusted lost income.
    The guest payments and the deductible are then subtracted as the income recovery-sharing method directs, the
    result is floored at 0.00 and cut to the lower of the per-claim limit and the remaining aggregate, and only
    that figure is rounded.'
  prerequisite:
  - problem: protect_ext_property_settlement
    kind: value_input
    gate: in_stay_settled
    form: state
    policy_source: The income-loss settlement is not fixed until the plan's HostCover ledger shows a reimbursement
      on every approved property-damage claim of the same stay.
    condition: protection_events carries a protect_reimbursement_paid row on every approved property_damage claim
      filed on the same stay as the income-loss claim.
    resolved_by: pay_property_damage_reimbursement_941cbbf5
    effect: Once the stay's approved property-damage claim carries its reimbursement, the count of the stay's claims
      already reimbursed rises by one, so the deductible the income-loss claim bears falls by one equal share of
      the level deductible.
  - problem: protect_ext_pet_damage_settlement
    kind: value_input
    gate: in_stay_settled
    form: state
    policy_source: The income-loss settlement is likewise not fixed until the ledger shows a reimbursement on every
      approved pet-damage claim of the same stay.
    condition: protection_events carries a protect_reimbursement_paid row on every approved pet_damage claim filed
      on the same stay as the income-loss claim.
    resolved_by: pay_pet_damage_reimbursement_a5391300
    effect: Once the stay's approved pet-damage claim carries its reimbursement, the count of the stay's claims
      already reimbursed rises by one, so the deductible the income-loss claim bears falls by one more equal share
      of the level deductible.
  cross_category:
  - category: listing
    as: history
    reads:
    - listing_events.stay_id
    - listing_events.block_start_date
    - listing_events.block_end_date
    note: the lost-nights method counts the nights of the most recent calendar block placed on the listing for a
      host cancellation
  - category: host
    as: history
    reads:
    - host_account_events.penalty_band
    - host_account_events.initiated_by
    - host_account_events.event_date
    note: the cancellation timing share reads the host cancellation recorded for the blocked booking; the new-cover
      share reads the fee-assessment date of the damaged stay
  compute:
  - in_claim: LATEST('protection_claims', 'claim_id', date_field='decided_at', claim_status='approved', damage_category='income_loss')
  - in_stay: LATEST('protection_claims', 'stay_id', date_field='decided_at', claim_status='approved', damage_category='income_loss')
  - in_loss: LATEST('protection_claims', 'verified_loss_amount', date_field='decided_at', claim_status='approved',
      damage_category='income_loss')
  - in_cancelled_stay: XLATEST('listing', 'listing_events', 'stay_id', date_field='event_date', event_type='listing_calendar_blocked',
      block_reason='host_cancellation', listing_id=F('listing_id'))
  - in_block_start: XLATEST('listing', 'listing_events', 'block_start_date', date_field='event_date', event_type='listing_calendar_blocked',
      block_reason='host_cancellation', listing_id=F('listing_id'))
  - in_block_end: XLATEST('listing', 'listing_events', 'block_end_date', date_field='event_date', event_type='listing_calendar_blocked',
      block_reason='host_cancellation', listing_id=F('listing_id'))
  - in_blocked_nights: DAYS(in_block_start, in_block_end)
  - in_valued_loss: 0 if not P('income_loss_covered') else (in_loss * P('income_loss_max_nights') / in_blocked_nights
      if (P('income_loss_covered') and in_blocked_nights > P('income_loss_max_nights')) else in_loss)
  - in_cancel_band: XLATEST('host', 'host_account_events', 'penalty_band', date_field='event_date', event_type='host_cancellation_recorded',
      stay_id=in_cancelled_stay)
  - in_cancel_initiator: XLATEST('host', 'host_account_events', 'initiated_by', date_field='event_date', event_type='host_cancellation_recorded',
      stay_id=in_cancelled_stay)
  - in_timing_pct: K('income_cancel_more_than_30_days_share_pct') if (in_cancel_initiator == 'host' and in_cancel_band
      == 'more_than_30_days') else (K('income_cancel_30_days_to_48_hours_share_pct') if (in_cancel_initiator ==
      'host' and in_cancel_band == '30_days_to_48_hours') else 100)
  - in_deadline: LATEST('protection_claims', 'guest_response_due_at', date_field='decided_at', claim_status='approved',
      damage_category='income_loss')
  - in_escalated: LATEST('protection_claims', 'escalated_at', date_field='decided_at', claim_status='approved',
      damage_category='income_loss')
  - in_escalation_days: DAYS(in_deadline, in_escalated)
  - in_escalation_pct: K('income_escalation_22_30_share_pct') if in_escalation_days >= 22 else (K('income_escalation_8_21_share_pct')
      if in_escalation_days >= 8 else 100)
  - in_checkin: XLATEST('host', 'host_account_events', 'event_date', date_field='event_date', event_type='host_service_fee_assessed',
      stay_id=in_stay)
  - in_level_since: F('tier_changed_date') if F('tier_changed_date') != '' else F('enrolled_date')
  - in_level_days: DAYS(in_level_since, in_checkin)
  - in_new_cover_pct: K('income_new_cover_under_90_share_pct') if in_level_days < 90 else (K('income_new_cover_90_364_share_pct')
      if in_level_days < 365 else 100)
  - in_stay_claims: COUNT('protection_claims', stay_id=in_stay, claim_status='approved')
  - in_stay_settled: COUNT('protection_events', event_type='protect_reimbursement_paid', stay_id=in_stay)
  - in_deductible: P('deductible_usd') * (in_stay_claims - in_stay_settled) / in_stay_claims
  - in_guest_paid: SUM('protection_events', 'amount', event_type='protect_guest_payment_recorded', claim_id=in_claim)
      - SUM('protection_events', 'amount', event_type='protect_guest_payment_reversed', claim_id=in_claim)
  - in_covered: in_valued_loss * in_timing_pct / 100 * in_escalation_pct / 100 * in_new_cover_pct / 100
  - in_offset: MX(in_guest_paid, in_deductible) if (F('variant_name') == 'HostCover Premier' or F('variant_name')
      == 'HostCover Elite' or F('variant_name') == 'HostCover Estate') else (in_deductible + in_guest_paid * MX(0,
      in_covered - in_deductible) / in_covered if ((F('variant_name') == 'HostCover Standard' or F('variant_name')
      == 'HostCover Plus') and in_covered > 0) else in_guest_paid + in_deductible)
  - in_net: MX(0, in_covered - in_offset)
  - in_year_net: SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'), NOW) + 1, date_field='posted_date',
      event_type='protect_reimbursement_paid') - SUM('protection_events', 'amount', within_months=MONTHS(F('plan_year_start'),
      NOW) + 1, date_field='posted_date', event_type='protect_reimbursement_recovered')
  - in_cap: MN(P('per_claim_limit_usd'), MX(0, P('annual_aggregate_limit_usd') - in_year_net))
  - result: RND(MN(in_net, in_cap), 2)
  compute_basis:
    in_claim: This rule settles an income-loss claim that the claims team has approved on a HostCover plan
    in_stay: the number of approved claims filed on the stay
    in_loss: The income-loss settlement starts from the loss the claims team verified on the approved income-loss
      claim.
    in_cancelled_stay: the booking the host cancelled (the most recent calendar block placed on the listing for
      a host cancellation
    in_block_start: counted from its first blocked night to the day after its last
    in_block_end: counted from its first blocked night to the day after its last
    in_blocked_nights: the nights the listing's calendar holds blocked for the booking the host cancelled (the most
      recent calendar block placed on the listing for a host cancellation, counted from its first blocked night
      to the day after its last)
    in_valued_loss: on a level whose income_loss_covered is false nothing is payable; on a covering level, when
      the blocked nights exceed income_loss_max_nights, the verified loss is multiplied by income_loss_max_nights
      and divided by the blocked nights; otherwise the verified loss is taken whole.
    in_cancel_band: 'The cancellation timing share follows the host cancellation recorded on the host account for
      that cancelled booking:'
    in_cancel_initiator: 'The cancellation timing share follows the host cancellation recorded on the host account
      for that cancelled booking:'
    in_timing_pct: a cancellation the host initiated in the more_than_30_days band settles the lost income at income_cancel_more_than_30_days_share_pct
      percent, because a booking that far ahead could have been kept once repairs were done; one the host initiated
      in the 30_days_to_48_hours band at income_cancel_30_days_to_48_hours_share_pct percent; and a cancellation
      in the under_48_hours band, or one Roamhaven initiated, in full.
    in_deadline: the calendar days from the date part of the guest's response deadline to the date part of the host's
      escalation of the income-loss claim
    in_escalated: the calendar days from the date part of the guest's response deadline to the date part of the
      host's escalation of the income-loss claim
    in_escalation_days: the calendar days from the date part of the guest's response deadline to the date part of
      the host's escalation of the income-loss claim
    in_escalation_pct: an escalation 22 to 30 days after the deadline settles the lost income at income_escalation_22_30_share_pct
      percent, one 8 to 21 days after at income_escalation_8_21_share_pct percent, and one 7 days or fewer after
      in full.
    in_checkin: the date the host service fee was assessed on that stay
    in_level_since: counted in calendar days from the plan's last level change (or from its enrollment when the
      level was never changed) to the date the host service fee was assessed on that stay
    in_level_days: counted in calendar days from the plan's last level change (or from its enrollment when the level
      was never changed) to the date the host service fee was assessed on that stay
    in_new_cover_pct: fewer than 90 days settles the lost income at income_new_cover_under_90_share_pct percent,
      90 to 364 days at income_new_cover_90_364_share_pct percent, and 365 days or more in full.
    in_stay_claims: the number of approved claims filed on the stay
    in_stay_settled: each claim of the stay that already carries a reimbursement has borne an equal share of it
    in_deductible: the income-loss claim bears the part of the level's deductible_usd those reimbursed claims have
      not borne.
    in_guest_paid: how the guest payments recorded on the claim, net of reversals, are shared between Roamhaven
      and the host
    in_offset: on HostCover Premier, HostCover Elite or HostCover Estate the guest payments first restore the deductible
      the income-loss claim bears, so only the larger of those payments and that deductible is subtracted from the
      adjusted lost income; on HostCover Standard or HostCover Plus the guest payments are shared in proportion
      to the parts of the loss each side bears, so that deductible is subtracted from the adjusted lost income together
      with the guest payments multiplied by the adjusted lost income less that deductible (never below 0.00) and
      divided by the adjusted lost income; on any other level the guest payments and that deductible are both subtracted
      from the adjusted lost income.
    in_covered: The lost-income value set by the lost-nights method is first multiplied by the cancellation timing
      share, that result by the income escalation share and that result by the income new-cover share, with no rounding
      between these steps; the figure so reached is the adjusted lost income.
    in_net: The guest payments and the deductible are then subtracted as the income recovery-sharing method directs,
      the result is floored at 0.00
    in_year_net: the reimbursements, net of recoveries, posted on the plan in the current plan year
    in_cap: cut to the lower of the level's per_claim_limit_usd and the plan's remaining aggregate, which is the
      level's annual_aggregate_limit_usd less the reimbursements, net of recoveries, posted on the plan in the current
      plan year; income loss carries no category sublimit.
    result: The income-loss settlement is rounded half up to the nearest cent only at the end.
  factors:
  - id: income_lost_nights_method
    effect: method
    decides: in_valued_loss
    bindings:
    - in_block_start
    - in_block_end
    - in_blocked_nights
    - in_valued_loss
    ladder:
    - when: the plan level does not cover lost income (income_loss_covered is false)
      method: nothing is payable
    - when: the level covers lost income AND the nights blocked for the cancelled booking exceed income_loss_max_nights
      method: multiply the verified loss by income_loss_max_nights and divide by the blocked nights
    - when: otherwise
      method: take the verified loss whole
    baseline:
      in_valued_loss: in_loss
    evidence:
    - cross_category
    - date
    - tier_param
    cross_difficulty: listing
  - id: income_cancellation_timing_share
    effect: parameter
    decides: in_timing_pct
    bindings:
    - in_cancelled_stay
    - in_cancel_band
    - in_cancel_initiator
    - in_timing_pct
    ladder:
    - when: the host initiated the cancellation AND it was recorded in the more_than_30_days band
      value: K('income_cancel_more_than_30_days_share_pct')
    - when: the host initiated the cancellation AND it was recorded in the 30_days_to_48_hours band
      value: K('income_cancel_30_days_to_48_hours_share_pct')
    - when: otherwise (the under_48_hours band, or a cancellation Roamhaven initiated)
      value: 100 (settled in full)
    baseline:
      in_timing_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: host
  - id: income_escalation_share
    effect: parameter
    decides: in_escalation_pct
    bindings:
    - in_deadline
    - in_escalated
    - in_escalation_days
    - in_escalation_pct
    ladder:
    - when: the host escalated the income-loss claim 22 to 30 calendar days after the date of the guest's response
        deadline
      value: K('income_escalation_22_30_share_pct')
    - when: the host escalated 8 to 21 calendar days after that date
      value: K('income_escalation_8_21_share_pct')
    - when: otherwise (7 days or fewer after)
      value: 100 (settled in full)
    baseline:
      in_escalation_pct: '100'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: income_new_cover_share
    effect: parameter
    decides: in_new_cover_pct
    bindings:
    - in_checkin
    - in_level_since
    - in_level_days
    - in_new_cover_pct
    ladder:
    - when: the plan had held its current level for fewer than 90 calendar days on the date the host service fee
        was assessed on the damaged stay
      value: K('income_new_cover_under_90_share_pct')
    - when: it had held that level for 90 to 364 calendar days
      value: K('income_new_cover_90_364_share_pct')
    - when: otherwise (365 days or more)
      value: 100 (settled in full)
    baseline:
      in_new_cover_pct: '100'
    evidence:
    - date
    - cross_category
    cross_difficulty: host
  - id: income_recovery_sharing_method
    effect: method
    decides: in_offset
    bindings:
    - in_guest_paid
    - in_offset
    ladder:
    - when: the plan level is HostCover Premier, HostCover Elite or HostCover Estate
      method: 'the guest payments first restore the deductible: subtract from the adjusted lost income only the
        larger of the guest payments and the deductible (made whole first)'
    - when: the plan level is HostCover Standard or HostCover Plus
      method: 'share the guest payments in proportion: subtract from the adjusted lost income the deductible plus
        the guest payments times (the adjusted lost income less the deductible, never below 0.00) divided by the
        adjusted lost income'
    - when: otherwise (HostCover Essential)
      method: subtract the guest payments and the deductible both from the adjusted lost income (Roamhaven credited
        first)
    baseline:
      in_offset: in_guest_paid + in_deductible
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The income-loss settlement starts from the loss the claims team verified on the approved income-loss
      claim. A stay bears its deductible once: each claim of the stay that already carries a reimbursement has borne
      an equal share of it, that share being the plan level''s deductible_usd divided by the number of approved
      claims filed on the stay, and the income-loss claim bears the part of the level''s deductible_usd those reimbursed
      claims have not borne. From the verified lost income, every guest payment recorded on the income-loss claim,
      net of reversals, is subtracted together with the deductible the income-loss claim bears. The result is floored
      at 0.00 and then cut to the lower of the level''s per_claim_limit_usd and the plan''s remaining aggregate,
      which is the level''s annual_aggregate_limit_usd less the reimbursements, net of recoveries, posted on the
      plan in the current plan year; income loss carries no category sublimit. The income-loss settlement is rounded
      half up to the nearest cent only at the end.'
    params:
    - deductible_usd
    - per_claim_limit_usd
    - annual_aggregate_limit_usd
  inputs:
    history:
    - table: protection_claims
      aggregate: latest
      field: verified_loss_amount
      filters:
        claim_status: approved
        damage_category: income_loss
    - table: protection_events
      aggregate: count
      field: protection_event_id
      filters:
        event_type: protect_reimbursement_paid
    - table: protection_events
      aggregate: sum
      field: amount
      filters:
        event_type: protect_guest_payment_recorded
    - category: listing
      table: listing_events
      aggregate: latest
      field: block_end_date
      filters:
        event_type: listing_calendar_blocked
        block_reason: host_cancellation
    - category: host
      table: host_account_events
      aggregate: latest
      field: penalty_band
      filters:
        event_type: host_cancellation_recorded
    cross_category:
    - listing
    - host
