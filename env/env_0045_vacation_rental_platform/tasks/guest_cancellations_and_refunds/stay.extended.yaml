  - id: stay_ext_first_installment_payment
    base_policy_refs: [stay_evt_payment_schedule, stay_evt_alteration, stay_booking_terms]
    overwrite:
      - base_policy: stay_evt_payment_schedule
        superseded_clause: >-
          each installment carries the guest service fee and occupancy tax attributable to the amounts it collects
        replaced_by: >-
          Each installment carries the guest service fee and occupancy tax attributable to the amounts it collects,
          except that installment 1 of a stay paid in monthly installments carries its guest service fee less the
          Rewards courtesy set out below, following the guest's Rewards tier active when installment 1 is collected.
    trigger: state_due
    subject: [stay_payment_collected]
    computes: amount
    target_tool: pay_first_installment_26275b3d
    params:
      standard_installment_fee_pct: 14.20
      installment_fee_courtesy_concierge_pct: 100
      installment_fee_courtesy_priority_pct: 50
      tx_austin_rate_pct: 17.00
      fl_orange_rate_pct: 12.50
      co_denver_rate_pct: 15.75
      tn_nashville_rate_pct: 15.25
      hi_honolulu_rate_pct: 17.96
      ca_san_diego_rate_pct: 12.50
      tn_nashville_flat_per_night_usd: 2.50
      tx_austin_exempt_min_nights: 30
      fl_orange_exempt_min_nights: 183
      co_denver_exempt_min_nights: 30
      tn_nashville_exempt_min_nights: 30
      hi_honolulu_exempt_min_nights: 180
      ca_san_diego_exempt_min_nights: 30
    rule: >-
      When the collection of installment 1 at confirmation has been declined and the stay, still confirmed or checked
      in, is inside the failed-payment grace period, the guest pays installment 1 from their own payment method and it
      is recorded as installment 1 of the stay.
      Each installment carries the guest service fee and occupancy tax attributable to the amounts it collects,
      except that installment 1 of a stay paid in monthly installments carries its guest service fee less the
      Rewards courtesy set out below, following the guest's Rewards tier active when installment 1 is collected.
      Installment 1 collects the whole stay: the nightly subtotal and the cleaning, pet and extra-guest fees, plus a
      guest service fee of standard_installment_fee_pct percent of those amounts and occupancy tax at the percentage
      rate the occupancy tax schedule of the booking terms sets for the stay's jurisdiction, applied to those same
      amounts. The fee and the tax are each rounded half up to the cent, and installment 1 is the sum of those amounts,
      the fee and the tax, less the Rewards credits redeemed on the stay and not yet reinstated.
      What installment 1 carries depends on how the stay is paid: on a stay of long_term_min_nights nights or more
      paid in monthly installments, installment 1 carries the first installment_nights nights at the stay's night
      price, the nightly subtotal divided by the stay's nights rounded half up to the cent, together with the
      cleaning, pet and extra-guest fees in full; on a pay-part-now stay, installment 1 carries
      pay_part_now_deposit_pct percent of the nightly subtotal and of those fees; on any other stay it carries the
      whole nightly subtotal and the fees.
      The guest service fee percentage of installment 1 depends on the stay: a stay booked with the host-only fee
      structure carries host_only_fee_guest_service_fee_pct; a split-fee stay of long_term_min_nights nights or more
      carries the guest_service_fee_pct of the stay's tier; any other stay carries standard_installment_fee_pct.
      The occupancy tax of installment 1 depends on the stay and its jurisdiction: a stay whose nights reach the
      jurisdiction's exempt minimum carries none; a stay in a jurisdiction that levies a flat amount per night carries
      the percentage rate of what installment 1 carries plus the flat amount for each night installment 1 carries, a
      pay-part-now installment 1 carrying pay_part_now_deposit_pct percent of each night's flat amount; any other
      stay carries the percentage rate of what installment 1 carries.
      Roamhaven Rewards members who book a long stay get a courtesy on the guest service fee of its first month: on a
      stay paid in monthly installments, a guest whose active Rewards tier includes a dedicated concierge is spared
      installment_fee_courtesy_concierge_pct percent of installment 1's guest service fee; on a stay paid in monthly
      installments, a guest whose active Rewards tier includes the priority support line but no dedicated concierge is
      spared installment_fee_courtesy_priority_pct percent of it; any other guest pays all of it. The courtesy is
      applied to the fee before it is rounded.
    prerequisite: []
    cross_category:
      - category: rewards
        as: history
        reads: [variant_name, status, rewards_transactions.amount]
        note: The fee courtesy factor reads the guest's active Rewards tier; the credits redeemed and reinstated on the stay are read from the guest's Rewards ledger and taken off installment 1.
    compute:
      - nights_booked: "DAYS(F('check_in_date'), F('check_out_date'))"
      - night_price: "RND(F('nightly_subtotal') / nights_booked, 2)"
      - addon_fees: "F('cleaning_fee') + F('pet_fee_total') + F('extra_guest_fee_total')"
      - inst1_base: "MN(P('installment_nights'), nights_booked) * night_price + addon_fees if (F('payment_plan') == 'monthly_installments' and DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights')) else ((F('nightly_subtotal') + addon_fees) * P('pay_part_now_deposit_pct') / 100 if F('payment_plan') == 'pay_part_now' else F('nightly_subtotal') + addon_fees)"
      - nights_carried: "MN(P('installment_nights'), nights_booked) if F('payment_plan') == 'monthly_installments' else (nights_booked * P('pay_part_now_deposit_pct') / 100 if F('payment_plan') == 'pay_part_now' else nights_booked)"
      - inst1_fee_pct: "P('host_only_fee_guest_service_fee_pct') if F('fee_structure') == 'host_only_fee' else (P('guest_service_fee_pct') if DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights') else K('standard_installment_fee_pct'))"
      - inst1_fee_courtesy_pct: "K('installment_fee_courtesy_concierge_pct') if (F('payment_plan') == 'monthly_installments' and CPARAM('rewards', 'dedicated_concierge', status='active') == True) else (K('installment_fee_courtesy_priority_pct') if (F('payment_plan') == 'monthly_installments' and CPARAM('rewards', 'priority_support_line', status='active') == True) else 0)"
      - inst1_fee: "RND(inst1_base * inst1_fee_pct / 100 * (100 - inst1_fee_courtesy_pct) / 100, 2)"
      - jurisdiction_rate_pct: "K('tx_austin_rate_pct') if F('jurisdiction_code') == 'TX-AUSTIN' else (K('fl_orange_rate_pct') if F('jurisdiction_code') == 'FL-ORANGE' else (K('co_denver_rate_pct') if F('jurisdiction_code') == 'CO-DENVER' else (K('tn_nashville_rate_pct') if F('jurisdiction_code') == 'TN-NASHVILLE' else (K('hi_honolulu_rate_pct') if F('jurisdiction_code') == 'HI-HONOLULU' else K('ca_san_diego_rate_pct')))))"
      - jurisdiction_flat_usd: "K('tn_nashville_flat_per_night_usd') if F('jurisdiction_code') == 'TN-NASHVILLE' else 0"
      - jurisdiction_exempt_min: "K('tx_austin_exempt_min_nights') if F('jurisdiction_code') == 'TX-AUSTIN' else (K('fl_orange_exempt_min_nights') if F('jurisdiction_code') == 'FL-ORANGE' else (K('co_denver_exempt_min_nights') if F('jurisdiction_code') == 'CO-DENVER' else (K('tn_nashville_exempt_min_nights') if F('jurisdiction_code') == 'TN-NASHVILLE' else (K('hi_honolulu_exempt_min_nights') if F('jurisdiction_code') == 'HI-HONOLULU' else K('ca_san_diego_exempt_min_nights')))))"
      - inst1_tax: "0 if DAYS(F('check_in_date'), F('check_out_date')) >= jurisdiction_exempt_min else (RND(inst1_base * jurisdiction_rate_pct / 100 + jurisdiction_flat_usd * nights_carried, 2) if jurisdiction_flat_usd > 0 else RND(inst1_base * jurisdiction_rate_pct / 100, 2))"
      - inst1_credits_redeemed: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_redeemed', stay_id=HID)"
      - inst1_credits_reinstated: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_reinstated', stay_id=HID)"
      - inst1_credit_offset: "MX(0, inst1_credits_redeemed - inst1_credits_reinstated)"
      - result: "RND(inst1_base + inst1_fee + inst1_tax - inst1_credit_offset, 2)"
    compute_basis:
      nights_booked: "the nightly subtotal divided by the stay's nights rounded half up to the cent"
      night_price: "installment 1 carries the first installment_nights nights at the stay's night price, the nightly subtotal divided by the stay's nights rounded half up to the cent"
      addon_fees: "together with the cleaning, pet and extra-guest fees in full"
      inst1_base: "What installment 1 carries depends on how the stay is paid: on a stay of long_term_min_nights nights or more paid in monthly installments, installment 1 carries the first installment_nights nights at the stay's night price, the nightly subtotal divided by the stay's nights rounded half up to the cent, together with the cleaning, pet and extra-guest fees in full; on a pay-part-now stay, installment 1 carries pay_part_now_deposit_pct percent of the nightly subtotal and of those fees; on any other stay it carries the whole nightly subtotal and the fees."
      nights_carried: "plus the flat amount for each night installment 1 carries, a pay-part-now installment 1 carrying pay_part_now_deposit_pct percent of each night's flat amount"
      inst1_fee_pct: "The guest service fee percentage of installment 1 depends on the stay: a stay booked with the host-only fee structure carries host_only_fee_guest_service_fee_pct; a split-fee stay of long_term_min_nights nights or more carries the guest_service_fee_pct of the stay's tier; any other stay carries standard_installment_fee_pct."
      inst1_fee_courtesy_pct: "on a stay paid in monthly installments, a guest whose active Rewards tier includes a dedicated concierge is spared installment_fee_courtesy_concierge_pct percent of installment 1's guest service fee; on a stay paid in monthly installments, a guest whose active Rewards tier includes the priority support line but no dedicated concierge is spared installment_fee_courtesy_priority_pct percent of it; any other guest pays all of it."
      inst1_fee: "The courtesy is applied to the fee before it is rounded."
      jurisdiction_rate_pct: "occupancy tax at the percentage rate the occupancy tax schedule of the booking terms sets for the stay's jurisdiction"
      jurisdiction_flat_usd: "a stay in a jurisdiction that levies a flat amount per night"
      jurisdiction_exempt_min: "a stay whose nights reach the jurisdiction's exempt minimum carries none"
      inst1_tax: "The occupancy tax of installment 1 depends on the stay and its jurisdiction: a stay whose nights reach the jurisdiction's exempt minimum carries none; a stay in a jurisdiction that levies a flat amount per night carries the percentage rate of what installment 1 carries plus the flat amount for each night installment 1 carries, a pay-part-now installment 1 carrying pay_part_now_deposit_pct percent of each night's flat amount; any other stay carries the percentage rate of what installment 1 carries."
      inst1_credits_redeemed: "less the Rewards credits redeemed on the stay and not yet reinstated"
      inst1_credits_reinstated: "less the Rewards credits redeemed on the stay and not yet reinstated"
      inst1_credit_offset: "less the Rewards credits redeemed on the stay and not yet reinstated"
      result: "installment 1 is the sum of those amounts, the fee and the tax, less the Rewards credits redeemed on the stay and not yet reinstated."
    factors:
      - id: installment_one_coverage
        effect: method
        decides: inst1_base
        bindings: [inst1_base]
        ladder:
          - when: "the stay has long_term_min_nights nights or more and is paid in monthly installments"
            method: "the first installment_nights nights at the stay's night price plus the cleaning, pet and extra-guest fees in full"
          - when: "the stay is on pay-part-now"
            method: "pay_part_now_deposit_pct percent of the nightly subtotal and of the fees"
          - when: "otherwise"
            method: "the whole nightly subtotal and the fees"
        baseline:
          inst1_base: "F('nightly_subtotal') + addon_fees"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: installment_one_fee_rate
        effect: parameter
        decides: inst1_fee_pct
        bindings: [inst1_fee_pct]
        ladder:
          - when: "the stay was booked with the host-only fee structure"
            value: "P('host_only_fee_guest_service_fee_pct')"
          - when: "the stay is split-fee and has long_term_min_nights nights or more"
            value: "P('guest_service_fee_pct')"
          - when: "otherwise"
            value: "K('standard_installment_fee_pct')"
        baseline:
          inst1_fee_pct: "K('standard_installment_fee_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: installment_one_fee_courtesy
        effect: parameter
        decides: inst1_fee_courtesy_pct
        bindings: [inst1_fee_courtesy_pct]
        ladder:
          - when: "the stay is paid in monthly installments and the guest's active Rewards tier includes a dedicated concierge"
            value: "K('installment_fee_courtesy_concierge_pct')"
          - when: "the stay is paid in monthly installments and the guest's active Rewards tier includes the priority support line but no dedicated concierge"
            value: "K('installment_fee_courtesy_priority_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          inst1_fee_courtesy_pct: "0"
        evidence: [history, cross_category]
        cross_difficulty: rewards
      - id: installment_one_tax
        effect: method
        decides: inst1_tax
        bindings: [inst1_tax]
        ladder:
          - when: "the stay's nights reach the jurisdiction's exempt minimum"
            method: "no occupancy tax"
          - when: "the jurisdiction levies a flat amount per night"
            method: "the percentage rate of what installment 1 carries plus the flat amount for each night it carries (a pay-part-now deposit carries that share of each night's flat amount)"
          - when: "otherwise"
            method: "the percentage rate of what installment 1 carries"
        baseline:
          inst1_tax: "RND(inst1_base * jurisdiction_rate_pct / 100, 2)"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        Installment 1 collects the whole stay: the nightly subtotal and the cleaning, pet and extra-guest fees, plus a
        guest service fee of standard_installment_fee_pct percent of those amounts and occupancy tax at the percentage
        rate the occupancy tax schedule of the booking terms sets for the stay's jurisdiction, applied to those same
        amounts. The fee and the tax are each rounded half up to the cent, and installment 1 is the sum of those amounts,
        the fee and the tax, less the Rewards credits redeemed on the stay and not yet reinstated.
      params: [standard_installment_fee_pct, tx_austin_rate_pct, fl_orange_rate_pct, co_denver_rate_pct, tn_nashville_rate_pct, hi_honolulu_rate_pct, ca_san_diego_rate_pct]
    inputs:
      history:
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_redeemed}}
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_reinstated}}
      cross_category: [rewards]
  - id: stay_ext_travel_issue_nightly_refund
    base_policy_refs: [stay_agg_service_fee_refund_cap, stay_evt_guest_cancellation_refund, stay_evt_host_cancellation_refund, stay_evt_travel_issue_refund, stay_evt_major_disruptive_event, stay_evt_alteration, stay_evt_refund_settlement]
    overwrite:
      - base_policy: stay_evt_travel_issue_refund
        superseded_clause: >-
          The affected nights are the stay's nights dated on or after the date part of submitted_at and before the
          check-out date, and the nightly refund is the travel_issue_refund_pct_by_category percentage for the request's
          issue_category times one night's price times the affected nights.
        replaced_by: >-
          On a stay paid in monthly installments, the travel-issue nightly refund covers only the affected nights that
          fall inside the nights the collected installments cover, each collected installment covering installment_nights
          nights counted from the check-in date
    trigger: state_due
    subject: [stay_refund_issued]
    computes: amount
    target_tool: refund_travel_nightly_d238de09
    params:
      misrepresented_refund_pct: 50
      amenity_missing_refund_pct: 25
      severe_issue_refund_pct: 100
      loyal_two_stays_uplift_pct: 10
      loyal_one_stay_uplift_pct: 5
      loyalty_window_months: 24
      concierge_uplift_pct: 10
      priority_uplift_pct: 5
      arrival_full_refund_pct: 100
      arrival_next_day_pct: 75
    rule: >-
      When Roamhaven has approved a travel-issue request, the host-funded nightly part of the travel-issue refund is
      refunded to the guest's original payment method. The nightly refund of a travel issue is not fixed until the
      stay's ledger carries the collection of every installment whose first night has arrived.
      The affected nights are the stay's nights dated on or after the date the travel issue was submitted and before
      the check-out date, and one night's price is the nightly subtotal divided by the stay's nights, rounded half up to
      the cent. The travel-issue nightly refund is the price of every affected night, refunded in full and paid to the
      guest's card in full, rounded half up to the cent once.
      The share of each affected night refunded depends on the issue category of the approved request: a misrepresented
      listing is refunded misrepresented_refund_pct percent of each affected night; an essential amenity missing is
      refunded amenity_missing_refund_pct percent; a guest who cannot get in or a place that is unsafe or unsanitary is
      refunded severe_issue_refund_pct percent.
      Guests who keep coming back get a loyalty uplift on that share, counted from the credits their Rewards ledger
      shows earned on completed stays in the last loyalty_window_months calendar months: two or more such earnings add
      loyal_two_stays_uplift_pct percentage points; exactly one adds loyal_one_stay_uplift_pct percentage points; none
      adds nothing.
      Roamhaven Rewards members get a tier uplift on that share as well: a guest whose active Rewards tier includes a
      dedicated concierge adds concierge_uplift_pct percentage points; a guest whose active Rewards tier includes the
      priority support line but no dedicated concierge adds priority_uplift_pct percentage points; any other guest adds
      nothing. The share with both uplifts never exceeds 100 percent.
      On a stay paid in monthly installments, the travel-issue nightly refund covers only the affected nights that fall
      inside the nights the collected installments cover, each collected installment covering installment_nights nights
      counted from the check-in date; on a pay-part-now stay whose balance has not been collected, it covers every
      affected night, the first included, at pay_part_now_deposit_pct percent; on any other stay it covers every
      affected night.
      The first affected night is treated on its own, by how soon after arrival the issue was reported: when the
      request was submitted on the check-in date, the first affected night is refunded at arrival_full_refund_pct
      percent; when it was submitted on the day after the check-in date, the first affected night is refunded at
      arrival_next_day_pct percent or at the share of the other affected nights, whichever is higher; otherwise the
      first affected night is refunded at the same share as the other affected nights.
      When Rewards credits paid part of the stay, the credit-funded part of the travel-issue nightly refund goes back as
      credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been
      reinstated yet, the card receives the travel-issue nightly refund times one minus the credits redeemed divided by
      the stay's total price; when credits were redeemed on the stay and part of them has already been reinstated, the
      card receives it times one minus the credits still outstanding (redeemed less reinstated) divided by the stay's
      total price; when no credits were redeemed, the card receives the whole
      travel-issue nightly refund. The night price is multiplied by the first affected night's share plus the other
      covered nights' share, the credit-funded part is then taken out, and the result is rounded half up to the cent
      once.
    prerequisite:
      - problem: stay_ext_first_installment_payment
        kind: value_input
        gate: travel_installments_collected
        form: state
        policy_source: >-
          The nightly refund of a travel issue is not fixed until the stay's ledger carries the collection of every
          installment whose first night has arrived.
        condition: >-
          stay_transactions holds a stay_payment_collected row for every installment whose first night is on or before
          the handling date; for a monthly stay on its check-in date that is installment 1.
        resolved_by: pay_first_installment_26275b3d
        effect: >-
          travel_installments_collected rises from 0 to 1, so the affected nights the refund covers rise from none to
          the installment_nights nights installment 1 covers.
    cross_category:
      - category: rewards
        as: history
        reads: [variant_name, status, rewards_transactions.amount, rewards_transactions.posted_date]
        note: The loyalty uplift counts credits earned in the Rewards ledger, the tier uplift reads the active Rewards tier, and the credit-funded part reads the credits redeemed and reinstated on the stay.
    compute:
      - nights_booked: "DAYS(F('check_in_date'), F('check_out_date'))"
      - night_price: "RND(F('nightly_subtotal') / nights_booked, 2)"
      - issue_submitted_at: "LATEST('stay_requests', 'submitted_at', date_field='decided_at', request_type='travel_issue', request_status='approved')"
      - affected_start_offset: "MX(0, DAYS(F('check_in_date'), issue_submitted_at))"
      - severity_pct: "K('misrepresented_refund_pct') if LATEST('stay_requests', 'issue_category', date_field='decided_at', request_type='travel_issue', request_status='approved') == 'misrepresented' else (K('amenity_missing_refund_pct') if LATEST('stay_requests', 'issue_category', date_field='decided_at', request_type='travel_issue', request_status='approved') == 'amenity_missing' else K('severe_issue_refund_pct'))"
      - loyalty_earnings: "XCOUNT('rewards', 'rewards_transactions', within_months=K('loyalty_window_months'), date_field='posted_date', event_type='rewards_credit_earned')"
      - loyalty_uplift_pct: "K('loyal_two_stays_uplift_pct') if loyalty_earnings >= 2 else (K('loyal_one_stay_uplift_pct') if loyalty_earnings == 1 else 0)"
      - tier_uplift_pct: "K('concierge_uplift_pct') if CPARAM('rewards', 'dedicated_concierge', status='active') == True else (K('priority_uplift_pct') if CPARAM('rewards', 'priority_support_line', status='active') == True else 0)"
      - affected_share_pct: "MN(100, severity_pct + loyalty_uplift_pct + tier_uplift_pct)"
      - travel_installments_collected: "COUNT('stay_transactions', event_type='stay_payment_collected') - COUNT('stay_transactions', event_type='stay_payment_collected', installment_number=0)"
      - covered_affected_nights: "MX(0, MN(travel_installments_collected * P('installment_nights'), nights_booked) - affected_start_offset) if F('payment_plan') == 'monthly_installments' else ((nights_booked - affected_start_offset) * P('pay_part_now_deposit_pct') / 100 if (F('payment_plan') == 'pay_part_now' and COUNT('stay_transactions', event_type='stay_payment_collected', installment_number=2) == 0) else nights_booked - affected_start_offset)"
      - arrival_night_pct: "K('arrival_full_refund_pct') if DAYS(F('check_in_date'), issue_submitted_at) == 0 else (MX(K('arrival_next_day_pct'), affected_share_pct) if DAYS(F('check_in_date'), issue_submitted_at) == 1 else affected_share_pct)"
      - arrival_in_scope: "0 if covered_affected_nights <= 0 else (P('pay_part_now_deposit_pct') / 100 if (F('payment_plan') == 'pay_part_now' and COUNT('stay_transactions', event_type='stay_payment_collected', installment_number=2) == 0) else 1)"
      - nightly_refund_gross: "night_price * (arrival_in_scope * arrival_night_pct + (covered_affected_nights - arrival_in_scope) * affected_share_pct) / 100"
      - travel_credits_redeemed: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_redeemed', stay_id=HID)"
      - travel_credits_reinstated: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_reinstated', stay_id=HID)"
      - travel_cash_fraction: "(1 - travel_credits_redeemed / F('total_price')) if (travel_credits_redeemed > 0 and travel_credits_reinstated == 0) else ((1 - (travel_credits_redeemed - travel_credits_reinstated) / F('total_price')) if (travel_credits_redeemed > travel_credits_reinstated and travel_credits_reinstated > 0) else 1)"
      - result: "RND(nightly_refund_gross * travel_cash_fraction, 2)"
    compute_basis:
      nights_booked: "one night's price is the nightly subtotal divided by the stay's nights, rounded half up to the cent"
      night_price: "one night's price is the nightly subtotal divided by the stay's nights, rounded half up to the cent"
      issue_submitted_at: "The affected nights are the stay's nights dated on or after the date the travel issue was submitted and before the check-out date"
      affected_start_offset: "The affected nights are the stay's nights dated on or after the date the travel issue was submitted and before the check-out date"
      severity_pct: "The share of each affected night refunded depends on the issue category of the approved request: a misrepresented listing is refunded misrepresented_refund_pct percent of each affected night; an essential amenity missing is refunded amenity_missing_refund_pct percent; a guest who cannot get in or a place that is unsafe or unsanitary is refunded severe_issue_refund_pct percent."
      loyalty_earnings: "counted from the credits their Rewards ledger shows earned on completed stays in the last loyalty_window_months calendar months"
      loyalty_uplift_pct: "Guests who keep coming back get a loyalty uplift on that share, counted from the credits their Rewards ledger shows earned on completed stays in the last loyalty_window_months calendar months: two or more such earnings add loyal_two_stays_uplift_pct percentage points; exactly one adds loyal_one_stay_uplift_pct percentage points; none adds nothing."
      tier_uplift_pct: "Roamhaven Rewards members get a tier uplift on that share as well: a guest whose active Rewards tier includes a dedicated concierge adds concierge_uplift_pct percentage points; a guest whose active Rewards tier includes the priority support line but no dedicated concierge adds priority_uplift_pct percentage points; any other guest adds nothing."
      affected_share_pct: "The share with both uplifts never exceeds 100 percent."
      travel_installments_collected: "each collected installment covering installment_nights nights counted from the check-in date"
      covered_affected_nights: "On a stay paid in monthly installments, the travel-issue nightly refund covers only the affected nights that fall inside the nights the collected installments cover, each collected installment covering installment_nights nights counted from the check-in date; on a pay-part-now stay whose balance has not been collected, it covers every affected night, the first included, at pay_part_now_deposit_pct percent; on any other stay it covers every affected night."
      arrival_night_pct: "The first affected night is treated on its own, by how soon after arrival the issue was reported: when the request was submitted on the check-in date, the first affected night is refunded at arrival_full_refund_pct percent; when it was submitted on the day after the check-in date, the first affected night is refunded at arrival_next_day_pct percent or at the share of the other affected nights, whichever is higher; otherwise the first affected night is refunded at the same share as the other affected nights."
      arrival_in_scope: "on a pay-part-now stay whose balance has not been collected, it covers every affected night, the first included, at pay_part_now_deposit_pct percent"
      nightly_refund_gross: "The night price is multiplied by the first affected night's share plus the other covered nights' share"
      travel_credits_redeemed: "when credits were redeemed on the stay and none of them has been reinstated yet"
      travel_credits_reinstated: "when credits were redeemed on the stay and part of them has already been reinstated"
      travel_cash_fraction: "When Rewards credits paid part of the stay, the credit-funded part of the travel-issue nightly refund goes back as credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been reinstated yet, the card receives the travel-issue nightly refund times one minus the credits redeemed divided by the stay's total price; when credits were redeemed on the stay and part of them has already been reinstated, the card receives it times one minus the credits still outstanding (redeemed less reinstated) divided by the stay's total price; when no credits were redeemed, the card receives the whole travel-issue nightly refund."
      result: "the credit-funded part is then taken out, and the result is rounded half up to the cent once."
    factors:
      - id: travel_severity_share
        effect: parameter
        decides: severity_pct
        bindings: [severity_pct]
        ladder:
          - when: "the approved request's issue category is misrepresented"
            value: "K('misrepresented_refund_pct')"
          - when: "the approved request's issue category is amenity_missing"
            value: "K('amenity_missing_refund_pct')"
          - when: "otherwise (no_access or uninhabitable)"
            value: "K('severe_issue_refund_pct')"
        baseline:
          severity_pct: "K('severe_issue_refund_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: travel_loyalty_uplift
        effect: parameter
        decides: loyalty_uplift_pct
        bindings: [loyalty_earnings, loyalty_uplift_pct]
        ladder:
          - when: "the guest's Rewards ledger shows two or more credit earnings in the last loyalty_window_months months"
            value: "K('loyal_two_stays_uplift_pct')"
          - when: "it shows exactly one"
            value: "K('loyal_one_stay_uplift_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          loyalty_uplift_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: rewards
      - id: travel_tier_uplift
        effect: parameter
        decides: tier_uplift_pct
        bindings: [tier_uplift_pct]
        ladder:
          - when: "the guest's active Rewards tier includes a dedicated concierge"
            value: "K('concierge_uplift_pct')"
          - when: "the guest's active Rewards tier includes the priority support line but no dedicated concierge"
            value: "K('priority_uplift_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          tier_uplift_pct: "0"
        evidence: [cross_category]
        cross_difficulty: rewards
      - id: travel_paid_night_scope
        effect: method
        decides: covered_affected_nights
        bindings: [travel_installments_collected, covered_affected_nights]
        ladder:
          - when: "the stay is paid in monthly installments"
            method: "only the affected nights inside the installment_nights nights each collected installment covers from the check-in date"
          - when: "the stay is on pay-part-now and its balance has not been collected"
            method: "every affected night, the first included, at pay_part_now_deposit_pct percent"
          - when: "otherwise"
            method: "every affected night"
        baseline:
          covered_affected_nights: "nights_booked - affected_start_offset"
        evidence: [history, date]
        cross_difficulty: null
      - id: travel_first_night_treatment
        effect: parameter
        decides: arrival_night_pct
        bindings: [arrival_night_pct]
        ladder:
          - when: "the request was submitted on the check-in date"
            value: "K('arrival_full_refund_pct')"
          - when: "the request was submitted on the day after the check-in date"
            value: "MX(K('arrival_next_day_pct'), affected_share_pct)"
          - when: "otherwise"
            value: "the same share as the other affected nights"
        baseline:
          arrival_night_pct: "affected_share_pct"
        evidence: [date]
        cross_difficulty: null
      - id: travel_credit_funded_part
        effect: method
        decides: travel_cash_fraction
        bindings: [travel_credits_redeemed, travel_credits_reinstated, travel_cash_fraction]
        ladder:
          - when: "credits were redeemed on the stay and none has been reinstated"
            method: "card share = 1 - credits redeemed / total price"
          - when: "credits were redeemed on the stay and part has already been reinstated"
            method: "card share = 1 - (credits redeemed - credits reinstated) / total price"
          - when: "otherwise"
            method: "the whole travel-issue nightly refund goes to the card"
        baseline:
          travel_cash_fraction: "1"
        evidence: [cross_category, history]
        cross_difficulty: rewards
    baseline:
      rule: >-
        The affected nights are the stay's nights dated on or after the date the travel issue was submitted and before
        the check-out date, and one night's price is the nightly subtotal divided by the stay's nights, rounded half up to
        the cent. The travel-issue nightly refund is the price of every affected night, refunded in full and paid to the
        guest's card in full, rounded half up to the cent once.
      params: [severe_issue_refund_pct]
    inputs:
      history:
        - {table: stay_requests, aggregate: latest, field: issue_category, filters: {request_type: travel_issue, request_status: approved}}
        - {table: stay_transactions, aggregate: count, field: stay_txn_id, filters: {event_type: stay_payment_collected}}
        - {category: rewards, table: rewards_transactions, aggregate: count, field: rewards_txn_id, within_months: 24, filters: {event_type: rewards_credit_earned}}
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_redeemed}}
      cross_category: [rewards]
  - id: stay_ext_travel_issue_service_fee_refund
    base_policy_refs: [stay_agg_service_fee_refund_cap, stay_evt_guest_cancellation_refund, stay_evt_host_cancellation_refund, stay_evt_travel_issue_refund, stay_evt_major_disruptive_event, stay_evt_alteration, stay_evt_refund_settlement, stay_booking_terms]
    overwrite:
      - base_policy: stay_evt_travel_issue_refund
        superseded_clause: >-
          The guest service fee and occupancy tax are refunded in the proportion that the refunded nightly and cleaning
          amounts bear to their full amounts.
        replaced_by: >-
          On an approved travel issue, Roamhaven refunds its guest service fee as a percentage of the travel-issue fee
          base and pays it to the guest's original payment method, while the occupancy tax of a travel issue is refunded
          in the proportion that the refunded nightly and cleaning amounts bear to their full amounts.
    trigger: state_due
    subject: [stay_refund_issued]
    computes: amount
    target_tool: refund_travel_service_fee_041715de
    params:
      standard_travel_fee_pct: 14.20
      arrival_fee_courtesy_concierge_pct: 100
      arrival_fee_courtesy_priority_pct: 50
    rule: >-
      On an approved travel issue, Roamhaven refunds its guest service fee as a percentage of the travel-issue fee
      base and pays it to the guest's original payment method, while the occupancy tax of a travel issue is refunded
      in the proportion that the refunded nightly and cleaning amounts bear to their full amounts. The service-fee
      refund of a travel issue is fixed only after the stay's ledger carries the nightly refund of that travel issue.
      The travel-issue fee base is the nightly refund the stay's ledger shows for the travel issue. The travel-issue
      service-fee refund is standard_travel_fee_pct percent of the travel-issue fee base, rounded half up to the cent,
      and all of it is paid to the guest's card.
      The percentage of the travel-issue service-fee refund depends on the stay: a stay booked with the host-only fee
      structure refunds at host_only_fee_guest_service_fee_pct; a split-fee stay of long_term_min_nights nights or more
      refunds at the guest_service_fee_pct of the stay's tier; any other stay refunds at standard_travel_fee_pct.
      What the travel-issue fee base holds depends on the issue: for a misrepresented listing, Roamhaven answers for
      the listing it published, so the fee base is the nightly refund on the ledger for the travel issue plus the whole
      cleaning fee of the stay; for a guest who could not get in or a place that was unsafe or unsanitary, reported on
      the check-in date, the fee base is the nightly and cleaning-fee refunds on the ledger for the travel issue; for
      any other issue it is the nightly refund on the ledger for the travel issue.
      Roamhaven Rewards members who report the issue on the day they arrive get a courtesy on the fee base, the arrival
      night's price being the nightly subtotal divided by the stay's nights rounded half up to the cent: when the request
      was submitted on the check-in date and the guest's active Rewards tier includes a dedicated concierge,
      arrival_fee_courtesy_concierge_pct percent of the arrival night's price is added to the travel-issue fee base;
      when the request was submitted on the check-in date and the guest's active Rewards tier includes the priority
      support line but no dedicated concierge, arrival_fee_courtesy_priority_pct percent of it is added; otherwise none
      of it is added. The courtesy amount is rounded half up to the cent.
      When Rewards credits paid part of the stay, the credit-funded part of the travel-issue service-fee refund goes
      back as credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has
      been reinstated yet, the card receives the travel-issue service-fee refund times one minus the credits redeemed
      divided by the stay's total price; when credits were redeemed on the stay and part of them has already been
      reinstated, the card receives it times one minus the credits still outstanding (redeemed less reinstated) divided
      by the stay's total price; when no credits were redeemed, the card
      receives the whole travel-issue service-fee refund. The percentage is applied to the travel-issue fee base plus
      the courtesy, the credit-funded part is then taken out, and the result is rounded half up to the cent once.
    prerequisite:
      - problem: stay_ext_travel_issue_nightly_refund
        kind: value_input
        gate: travel_fee_nightly_refunds
        form: state
        policy_source: >-
          The service-fee refund of a travel issue is fixed only after the stay's ledger carries the nightly refund of
          that travel issue.
        condition: >-
          stay_transactions holds the stay_refund_issued row with charge_component nightly and refund_reason
          travel_issue carrying the approved request's request_id.
        resolved_by: refund_travel_nightly_d238de09
        effect: >-
          travel_fee_nightly_refunds rises from 0.00 to the nightly travel-issue refund posted, and the fee base and the
          service-fee refund rise with it.
    cross_category:
      - category: rewards
        as: history
        reads: [variant_name, status, rewards_transactions.amount]
        note: The arrival courtesy reads the guest's active Rewards tier, and the credit-funded part reads the credits redeemed and reinstated on the stay.
    compute:
      - travel_fee_nightly_refunds: "SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='nightly', refund_reason='travel_issue')"
      - travel_fee_cleaning_refunds: "SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='cleaning_fee', refund_reason='travel_issue')"
      - travel_issue_category: "LATEST('stay_requests', 'issue_category', date_field='decided_at', request_type='travel_issue', request_status='approved')"
      - travel_issue_submitted_at: "LATEST('stay_requests', 'submitted_at', date_field='decided_at', request_type='travel_issue', request_status='approved')"
      - travel_fee_pct: "P('host_only_fee_guest_service_fee_pct') if F('fee_structure') == 'host_only_fee' else (P('guest_service_fee_pct') if DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights') else K('standard_travel_fee_pct'))"
      - travel_fee_base: "travel_fee_nightly_refunds + F('cleaning_fee') if LATEST('stay_requests', 'issue_category', date_field='decided_at', request_type='travel_issue', request_status='approved') == 'misrepresented' else (travel_fee_nightly_refunds + travel_fee_cleaning_refunds if ((travel_issue_category == 'no_access' or travel_issue_category == 'uninhabitable') and DAYS(F('check_in_date'), travel_issue_submitted_at) == 0) else travel_fee_nightly_refunds)"
      - travel_fee_courtesy_pct: "K('arrival_fee_courtesy_concierge_pct') if (DAYS(F('check_in_date'), travel_issue_submitted_at) == 0 and CPARAM('rewards', 'dedicated_concierge', status='active') == True) else (K('arrival_fee_courtesy_priority_pct') if (DAYS(F('check_in_date'), travel_issue_submitted_at) == 0 and CPARAM('rewards', 'priority_support_line', status='active') == True) else 0)"
      - travel_fee_courtesy: "RND(RND(F('nightly_subtotal') / DAYS(F('check_in_date'), F('check_out_date')), 2) * travel_fee_courtesy_pct / 100, 2)"
      - travel_fee_credits_redeemed: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_redeemed', stay_id=HID)"
      - travel_fee_credits_reinstated: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_reinstated', stay_id=HID)"
      - travel_fee_cash_fraction: "(1 - travel_fee_credits_redeemed / F('total_price')) if (travel_fee_credits_redeemed > 0 and travel_fee_credits_reinstated == 0) else ((1 - (travel_fee_credits_redeemed - travel_fee_credits_reinstated) / F('total_price')) if (travel_fee_credits_redeemed > travel_fee_credits_reinstated and travel_fee_credits_reinstated > 0) else 1)"
      - result: "RND((travel_fee_base + travel_fee_courtesy) * travel_fee_pct / 100 * travel_fee_cash_fraction, 2)"
    compute_basis:
      travel_fee_nightly_refunds: "The travel-issue fee base is the nightly refund the stay's ledger shows for the travel issue."
      travel_fee_cleaning_refunds: "the fee base is the nightly and cleaning-fee refunds on the ledger for the travel issue"
      travel_issue_category: "What the travel-issue fee base holds depends on the issue"
      travel_issue_submitted_at: "reported on the check-in date"
      travel_fee_pct: "The percentage of the travel-issue service-fee refund depends on the stay: a stay booked with the host-only fee structure refunds at host_only_fee_guest_service_fee_pct; a split-fee stay of long_term_min_nights nights or more refunds at the guest_service_fee_pct of the stay's tier; any other stay refunds at standard_travel_fee_pct."
      travel_fee_base: "What the travel-issue fee base holds depends on the issue: for a misrepresented listing, Roamhaven answers for the listing it published, so the fee base is the nightly refund on the ledger for the travel issue plus the whole cleaning fee of the stay; for a guest who could not get in or a place that was unsafe or unsanitary, reported on the check-in date, the fee base is the nightly and cleaning-fee refunds on the ledger for the travel issue; for any other issue it is the nightly refund on the ledger for the travel issue."
      travel_fee_courtesy_pct: "when the request was submitted on the check-in date and the guest's active Rewards tier includes a dedicated concierge, arrival_fee_courtesy_concierge_pct percent of the arrival night's price is added to the travel-issue fee base; when the request was submitted on the check-in date and the guest's active Rewards tier includes the priority support line but no dedicated concierge, arrival_fee_courtesy_priority_pct percent of it is added; otherwise none of it is added."
      travel_fee_courtesy: "the arrival night's price being the nightly subtotal divided by the stay's nights rounded half up to the cent"
      travel_fee_credits_redeemed: "when credits were redeemed on the stay and none of them has been reinstated yet"
      travel_fee_credits_reinstated: "when credits were redeemed on the stay and part of them has already been reinstated"
      travel_fee_cash_fraction: "When Rewards credits paid part of the stay, the credit-funded part of the travel-issue service-fee refund goes back as credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been reinstated yet, the card receives the travel-issue service-fee refund times one minus the credits redeemed divided by the stay's total price; when credits were redeemed on the stay and part of them has already been reinstated, the card receives it times one minus the credits still outstanding (redeemed less reinstated) divided by the stay's total price; when no credits were redeemed, the card receives the whole travel-issue service-fee refund."
      result: "The percentage is applied to the travel-issue fee base plus the courtesy, the credit-funded part is then taken out, and the result is rounded half up to the cent once."
    factors:
      - id: travel_fee_percentage
        effect: parameter
        decides: travel_fee_pct
        bindings: [travel_fee_pct]
        ladder:
          - when: "the stay was booked with the host-only fee structure"
            value: "P('host_only_fee_guest_service_fee_pct')"
          - when: "the stay is split-fee and has long_term_min_nights nights or more"
            value: "P('guest_service_fee_pct')"
          - when: "otherwise"
            value: "K('standard_travel_fee_pct')"
        baseline:
          travel_fee_pct: "K('standard_travel_fee_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: travel_fee_base_by_issue
        effect: method
        decides: travel_fee_base
        bindings: [travel_fee_base]
        ladder:
          - when: "the approved issue is a misrepresented listing"
            method: "nightly refund on the ledger for the travel issue plus the whole cleaning fee"
          - when: "the issue is no_access or uninhabitable and was reported on the check-in date"
            method: "nightly and cleaning-fee refunds on the ledger for the travel issue"
          - when: "otherwise"
            method: "the nightly refund on the ledger for the travel issue"
        baseline:
          travel_fee_base: "travel_fee_nightly_refunds"
        evidence: [history, date]
        cross_difficulty: null
      - id: travel_fee_arrival_courtesy
        effect: parameter
        decides: travel_fee_courtesy_pct
        bindings: [travel_fee_courtesy_pct]
        ladder:
          - when: "the request was submitted on the check-in date and the guest's active Rewards tier includes a dedicated concierge"
            value: "K('arrival_fee_courtesy_concierge_pct')"
          - when: "the request was submitted on the check-in date and the guest's active Rewards tier includes the priority support line but no dedicated concierge"
            value: "K('arrival_fee_courtesy_priority_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          travel_fee_courtesy_pct: "0"
        evidence: [date, cross_category]
        cross_difficulty: rewards
      - id: travel_fee_credit_funded_part
        effect: method
        decides: travel_fee_cash_fraction
        bindings: [travel_fee_credits_redeemed, travel_fee_credits_reinstated, travel_fee_cash_fraction]
        ladder:
          - when: "credits were redeemed on the stay and none has been reinstated"
            method: "card share = 1 - credits redeemed / total price"
          - when: "credits were redeemed on the stay and part has already been reinstated"
            method: "card share = 1 - (credits redeemed - credits reinstated) / total price"
          - when: "otherwise"
            method: "the whole travel-issue service-fee refund goes to the card"
        baseline:
          travel_fee_cash_fraction: "1"
        evidence: [cross_category, history]
        cross_difficulty: rewards
    baseline:
      rule: >-
        The travel-issue fee base is the nightly refund the stay's ledger shows for the travel issue. The travel-issue
        service-fee refund is standard_travel_fee_pct percent of the travel-issue fee base, rounded half up to the cent,
        and all of it is paid to the guest's card.
      params: [standard_travel_fee_pct]
    inputs:
      history:
        - {table: stay_transactions, aggregate: sum, field: amount, filters: {event_type: stay_refund_issued, charge_component: nightly, refund_reason: travel_issue}}
        - {table: stay_requests, aggregate: latest, field: issue_category, filters: {request_type: travel_issue, request_status: approved}}
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_redeemed}}
      cross_category: [rewards]
