      params: [standard_refund_fee_pct]
    inputs:
      history:
        - {table: stay_transactions, aggregate: sum, field: amount, filters: {event_type: stay_refund_issued, charge_component: nightly, refund_reason: guest_cancellation}}
        - {table: stay_transactions, aggregate: sum, field: amount, filters: {event_type: stay_refund_issued, charge_component: cleaning_fee, refund_reason: guest_cancellation}}
        - {table: stay_transactions, aggregate: sum, field: amount, filters: {event_type: stay_refund_issued, charge_component: pet_fee, refund_reason: guest_cancellation}}
        - {table: stay_transactions, aggregate: sum, field: amount, filters: {event_type: stay_refund_issued, charge_component: extra_guest_fee, refund_reason: guest_cancellation}}
