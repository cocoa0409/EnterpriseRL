    factors:
      - id: notice_length
        effect: parameter
        decides: notice_nights
        bindings: [notice_nights]
        ladder:
          - when: "the stay has long_term_min_nights nights or more"
            value: "P('after_check_in_notice_nights')"
          - when: "the stay is shorter and its tier's after_check_in_refund_pct is 0"
            value: "0"
          - when: "otherwise"
            value: "K('standard_notice_nights')"
        baseline:
          notice_nights: "K('standard_notice_nights')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: later_nights_kept
        effect: parameter
        decides: later_kept_pct
        bindings: [later_kept_pct]
        ladder:
          - when: "the stay has long_term_min_nights nights or more, or its tier's after_check_in_refund_pct is 100"
            value: "0"
          - when: "the stay is shorter and its tier's after_check_in_refund_pct is above 0 and below 100"
            value: "100 - P('after_check_in_refund_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          later_kept_pct: "100"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: notice_fee_rate
        effect: parameter
        decides: fee_rate_pct
        bindings: [fee_rate_pct]
        ladder:
          - when: "the stay was booked with the host-only fee structure"
            value: "P('host_only_fee_guest_service_fee_pct')"
          - when: "the stay is split-fee and has long_term_min_nights nights or more"
            value: "P('guest_service_fee_pct')"
          - when: "otherwise"
            value: "K('standard_guest_service_fee_pct')"
        baseline:
          fee_rate_pct: "K('standard_guest_service_fee_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: notice_tax_exemption
        effect: method
        decides: notice_tax
        bindings: [notice_tax]
        ladder:
          - when: "the stay's nights reach the jurisdiction's exempt minimum and the nights kept still reach it"
            method: "no occupancy tax on the notice charge"
          - when: "the stay's nights reach the exempt minimum but the nights kept fall below it"
            method: "occupancy tax on every night kept: the percentage rate of the kept nights' price and attributable fees plus the flat amount for each night kept"
          - when: "otherwise"
            method: "the percentage rate of the notice charge's fee base plus the flat amount for each night it charges"
        baseline:
          notice_tax: "RND(fee_base * jurisdiction_rate_pct / 100 + jurisdiction_flat_usd * owed_nights, 2)"
        evidence: [date]
        cross_difficulty: null
      - id: rewards_fee_relief
        effect: parameter
        decides: fee_relief_pct
        bindings: [fee_relief_pct]
        ladder:
          - when: "the guest's active Rewards tier includes a dedicated concierge"
            value: "K('concierge_fee_relief_pct')"
          - when: "the guest's active Rewards tier includes the priority support line but no dedicated concierge"
            value: "K('priority_fee_relief_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          fee_relief_pct: "0"
        evidence: [cross_category]
        cross_difficulty: rewards
      - id: returning_guest_relief
        effect: parameter
        decides: returning_relief_pct
        bindings: [returning_earnings, returning_relief_pct]
        ladder:
          - when: "the guest's Rewards ledger shows two or more credit earnings in the last loyalty_window_months months"
            value: "K('returning_two_relief_pct')"
          - when: "it shows exactly one"
            value: "K('returning_one_relief_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          returning_relief_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: rewards
