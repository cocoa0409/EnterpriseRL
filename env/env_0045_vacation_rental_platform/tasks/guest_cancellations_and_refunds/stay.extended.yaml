# Policy charter of the Stays category (guest reservations) at Roamhaven.
# A stay is the contract a guest holds for one booked range of nights at one listing. Its tier is the
# cancellation policy the stay was booked under, fixed at booking: the listing's chosen short-stay
# policy, or Long-Term for any stay of long_term_min_nights or more. The stay records the full price
# breakdown at booking; money actually moving (collections and refunds) is booked in stay_transactions.

category: stay
display_name: Stays (Guest Reservations)

binding:
  holding_table: stays
  event_tables: [stay_transactions]
  intake_tables: [stay_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [requested, confirmed, checked_in, completed, cancelled_by_guest, cancelled_by_host, declined, expired]
  transitions:
    - {from: requested, to: confirmed, by: user, means: "The host accepts the booking request, or an Instant Book request is accepted automatically at the moment it is booked."}
    - {from: requested, to: declined, by: user, means: "The host declines the booking request; no money is collected."}
    - {from: requested, to: expired, by: system, means: "The booking request lapses because the host did not accept it in time; no money is collected."}
    - {from: confirmed, to: checked_in, by: system, means: "The check-in date arrives on a confirmed stay and the stay is in progress."}
    - {from: checked_in, to: completed, by: system, means: "The check-out date arrives on a stay in progress and the stay is completed."}
    - {from: confirmed, to: cancelled_by_guest, by: user, means: "The guest cancels the confirmed stay before check-in."}
    - {from: checked_in, to: cancelled_by_guest, by: user, means: "The guest cancels a stay in progress and leaves early."}
    - {from: confirmed, to: cancelled_by_guest, by: system, means: "The stay is cancelled for non-payment of a scheduled installment; it is treated as a guest cancellation."}
    - {from: confirmed, to: cancelled_by_host, by: user, means: "The host cancels the confirmed stay before check-in."}

accounts:
  - key: guest_payments
    unit: USD
    meaning: Net money collected from the guest's payment method on this stay — collections in, refunds out; its balance is what the guest has paid and not had back.

parameter_schema:
  full_refund_cutoff_days: "int, calendar days before the check-in date at or beyond which a guest cancellation refunds every nightly-based component in full; 0 means the tier has no full-refund window"
  booking_grace_hours: "int, elapsed hours after the stay was booked within which a guest cancellation refunds in full (subject to grace_min_lead_days); 0 means the tier has no booking grace period"
  grace_min_lead_days: "int, minimum calendar days between the cancellation date and the check-in date for the booking grace period to apply; 0 when the tier has no grace period"
  partial_window_cutoff_days: "int, calendar days before check-in at or beyond which the partial-refund window applies once the full-refund window is missed; 0 means the partial window runs right up to the check-in date"
  partial_refund_pct: "decimal percent of the nightly-based components refunded in the partial-refund window, applied to the nights left after the forfeited nights"
  partial_window_forfeited_nights: "int, nights (taken from the start of the stay) that are never refunded in the partial-refund window"
  after_check_in_refund_pct: "decimal percent of the unspent nights (after notice nights) refunded when the guest cancels after check-in"
  after_check_in_notice_nights: "int, unspent nights forfeited as notice when the guest cancels after check-in"
  cleaning_fee_refund_before_check_in: "bool, whether the cleaning fee is refunded in full on any standard-rate guest cancellation dated before the check-in date"
  cleaning_fee_refund_after_check_in: "bool, whether the cleaning fee is refunded on a guest cancellation dated on or after the check-in date"
  add_on_fees_follow_nightly: "bool, whether the pet fee and extra-guest fee are refunded in the same proportion as the nightly subtotal"
  service_fee_refund_in_full_window: "bool, whether the guest service fee is refunded in full when the cancellation falls in the full-refund window or the booking grace period"
  service_fee_partial_refund_mode: "enum (proportional | none), how the guest service fee is refunded outside the full-refund window"
  service_fee_refund_annual_cap: "int, number of other guest-cancelled stays with a guest service fee refund in the cap window beyond which no guest service fee is refunded"
  service_fee_refund_cap_window_days: "int, calendar days of the trailing window over which the service-fee refund cap is counted"
  occupancy_tax_refund_mode: "enum (proportional), occupancy tax is refunded in the same proportion as the refunded taxable base"
  non_refundable_option_available: "bool, whether a guest may book this tier at the non-refundable rate"
  non_refundable_discount_pct: "decimal percent off the nightly subtotal for the non-refundable rate; 0.00 where the option is not offered"
  non_refundable_refund_pct: "decimal percent of any component refunded on a guest cancellation of a non-refundable-rate stay"
  host_cancellation_guest_refund_pct: "decimal percent of every collected component refunded to the guest when the host cancels"
  refund_destination: "string, where refunds are sent"
  refund_posting_business_days_max: "int, business days within which the card issuer posts a refund after it is issued (guest-facing expectation only)"
  pay_part_now_available: "bool, whether the pay-part-now plan (deposit now, balance later) may be chosen on this tier"
  pay_part_now_deposit_pct: "decimal percent of every component collected as installment 1 under pay-part-now; 0.00 where unavailable"
  pay_part_now_min_lead_days: "int, minimum calendar days between the booking date and the check-in date for pay-part-now; 0 where unavailable"
  balance_due_days_before_check_in: "int, calendar days before the check-in date on which the pay-part-now balance (installment 2) is collected; 0 where unavailable"
  payment_retry_attempts: "int, automatic retries of a failed scheduled collection"
  failed_payment_grace_hours: "int, elapsed hours after the first failed collection attempt of an installment after which a still-unpaid confirmed stay is cancelled for non-payment"
  monthly_installments_available: "bool, whether the stay is paid in monthly installments"
  installment_nights: "int, nights covered by each monthly installment; 0 where monthly installments are not used"
  long_term_min_nights: "int, nights at or above which a stay is booked under Long-Term regardless of the listing's chosen policy"
  guest_service_fee_pct: "decimal percent of the service-fee base charged as the guest service fee on a split_fee stay"
  host_only_fee_guest_service_fee_pct: "decimal percent of the service-fee base charged as the guest service fee on a host_only_fee stay"
  service_fee_base_components: "list, the stay amounts that make up the guest service fee base"
  occupancy_tax_base_components: "list, the stay amounts that make up the occupancy tax base"
  amount_rounding: "string, rounding applied to every computed component amount"
  request_expiry_hours: "int, elapsed hours after a request-to-book stay was booked after which the unaccepted request expires"
  instant_book_permitted: "bool, whether a listing on this policy may accept stays by Instant Book"
  alteration_response_hours: "int, elapsed hours the host has to accept a date or guest-count change request before it lapses"
  alteration_removed_nights_treatment: "string, how nights removed by an accepted alteration are refunded"
  alteration_after_check_in_allowed: "bool, whether a stay in progress may still be altered"
  alteration_added_nights_pricing: "string, the nightly price used for nights added by an alteration"
  travel_issue_report_hours: "int, elapsed hours after the guest discovered a travel issue within which it must be reported"
  travel_issue_refund_pct_by_category: "mapping issue_category -> decimal percent of the affected nights' nightly amount refunded on an approved travel issue"
  travel_issue_cleaning_fee_categories: "list, travel-issue categories for which the cleaning fee is also refunded in full when reported on the check-in date"
  major_event_refund_pct: "decimal percent of every collected component for unspent nights refunded on an approved major disruptive event request"
  major_event_counts_toward_service_fee_cap: "bool, whether a major-disruptive-event refund counts toward the service-fee refund cap"
  review_window_days: "int, calendar days after the check-out date within which guest and host may each submit a review"
  review_one_per_role: "bool, whether each side may submit only one review per stay"
  nightly_rate_basis: "string, how one night's price is derived for any per-night refund"
  unspent_night_basis: "string, which nights count as unspent on a cancellation after check-in"

