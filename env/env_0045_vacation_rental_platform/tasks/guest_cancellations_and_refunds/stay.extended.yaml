        night and the balance pays the rest; on any other stay installment 1 pays every night; no night is paid before
        installment 1 is collected. Each night is priced at the stay's night price, the nightly subtotal divided by the
        stay's nights and rounded half up to the cent, and the notice charge collects the price of the nights kept
        less the nightly amounts collected, never below 0.00. When installment 1 has not been collected, the notice
        charge also collects the cleaning fee and the share of the pet and extra-guest fees that the nights kept bear
        to the stay's nights, and it is reduced by the Rewards credits redeemed on the stay and not yet reinstated. The
        guest service fee on the notice charge is standard_guest_service_fee_pct percent of the notice charge's fee
        base, the nightly amount and the fees it collects. The occupancy tax on the notice charge is the percentage rate
        of the notice charge's fee base plus the flat amount for each night it charges, the rate and the flat amount
        being those the occupancy tax schedule of the booking terms sets for the jurisdiction recorded on the stay. The
        notice charge is the nightly amount and the fees it collects plus that guest service fee and that occupancy
        tax, the fee and the tax each rounded half up to the cent, less those credits, and never below 0.00.
      params: [standard_notice_nights, standard_guest_service_fee_pct, tx_austin_rate_pct, fl_orange_rate_pct, co_denver_rate_pct, tn_nashville_rate_pct, hi_honolulu_rate_pct, ca_san_diego_rate_pct, tn_nashville_flat_per_night_usd]
    inputs:
      history:
        - {table: stay_transactions, aggregate: count, field: stay_txn_id, filters: {event_type: stay_payment_collected}}
        - {table: stay_transactions, aggregate: count, field: stay_txn_id, filters: {event_type: stay_payment_collected, installment_number: 0}}
        - {table: stay_transactions, aggregate: count, field: stay_txn_id, filters: {event_type: stay_payment_collected, installment_number: 1}}
        - {table: stay_transactions, aggregate: count, field: stay_txn_id, filters: {event_type: stay_payment_collected, installment_number: 2}}
        - {category: rewards, table: rewards_transactions, aggregate: count, field: rewards_txn_id, within_months: 24, filters: {event_type: rewards_credit_earned}}
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_redeemed}}
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_reinstated}}
      cross_category: [rewards]
  - id: stay_ext_departure_pet_fee_refund
    base_policy_refs: [stay_agg_service_fee_refund_cap, stay_evt_guest_cancellation_refund, stay_evt_host_cancellation_refund, stay_evt_travel_issue_refund, stay_evt_major_disruptive_event, stay_evt_alteration, stay_evt_refund_settlement]
    overwrite:
      - base_policy: stay_evt_guest_cancellation_refund
        superseded_clause: >-
          The pet fee and extra-guest fee are refunded in the same proportion as the nightly subtotal when
          add_on_fees_follow_nightly is true.
        replaced_by: >-
          How much of the pet fee is returned depends on how the stay is paid: on a stay paid in monthly installments
          whose collections have begun, the pet fee was collected in full up front, so the share returned is the
          pet-refundable nights divided by the stay's nights
    trigger: state_due
    subject: [stay_refund_issued]
    computes: amount
    target_tool: refund_pet_fee_41a7068c
    params:
      standard_pet_notice_nights: 1
      pet_clean_share_arrival_day_pct: 20
      pet_clean_share_after_arrival_day_pct: 35
      pet_clean_courtesy_concierge_pct: 100
      pet_clean_courtesy_priority_pct: 50
    rule: >-
      When a guest cancels a stay that recorded a pet fee, part of the pet fee is refunded to the guest's original
      payment method as a pet-fee refund, funded by the host.
      The pet-fee refund counts the pet-refundable nights, the nights dated after the cancellation date and before
      the check-out date less the nights the pet-fee refund leaves out for notice, and it leaves out
      standard_pet_notice_nights of them. The share of the pet fee returned is the nightly amount refunded on the
      same cancellation divided by the stay's nightly subtotal. The pet-fee refund is the pet fee recorded on the
      stay times that share, rounded half up to the cent, and it is paid to the guest's card in full.
      How many nights the pet-fee refund leaves out for notice depends on the stay: a stay of long_term_min_nights
      nights or more leaves out after_check_in_notice_nights nights; a shorter stay booked under a tier whose
      after_check_in_refund_pct is 0 leaves out none; any other stay leaves out standard_pet_notice_nights.
      How much of the pet fee is returned depends on how the stay is paid: on a stay paid in monthly installments
      whose collections have begun, the pet fee was collected in full up front, so the share returned is the
      pet-refundable nights divided by the stay's nights; on a pay-part-now stay whose balance has not been collected, the share returned
      is the pet-refundable nights divided by the stay's nights, times pay_part_now_deposit_pct percent; on any other
      stay the share returned is the nightly amount refunded on the same cancellation divided by the stay's nightly
      subtotal.
      Once pets have arrived, part of the pet fee pays for the deep clean after them and is kept: a cancellation
      dated on the check-in date keeps pet_clean_share_arrival_day_pct percent of the refundable pet fee; a
      cancellation dated after the check-in date keeps pet_clean_share_after_arrival_day_pct percent of it; a
      cancellation before the check-in date keeps none.
      Roamhaven Rewards members get a courtesy on the deep-clean share: a guest whose active Rewards tier includes a
      dedicated concierge has pet_clean_courtesy_concierge_pct percent of the deep-clean share waived; a guest whose
      active Rewards tier includes the priority support line but no dedicated concierge has
      pet_clean_courtesy_priority_pct percent of it waived; any other guest has none of it waived.
      When Rewards credits paid part of the stay, the credit-funded part of the pet-fee refund goes back as credits
      and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been
      reinstated yet, the card receives the refund times one minus the credits redeemed divided by the stay's total
      price; when credits were redeemed on the stay and part of them has already been reinstated, the card
      receives the refund times one minus the credits still outstanding (redeemed less reinstated) divided by the
      stay's total price; when no credits were redeemed, the card receives
      the whole refund. The deep-clean share, the courtesy and the credit-funded part are applied in that order to
      the refundable pet fee before the single rounding to the cent.
    prerequisite: []
    cross_category:
      - category: rewards
        as: history
        reads: [variant_name, status, rewards_transactions.amount]
        note: The deep-clean courtesy reads the guest's active Rewards tier, and the credit-funded part reads the credits redeemed and reinstated on the stay in the Rewards ledger.
    compute:
      - nights_booked: "DAYS(F('check_in_date'), F('check_out_date'))"
      - cancel_offset: "DAYS(F('check_in_date'), F('cancelled_at'))"
      - pet_notice_nights: "P('after_check_in_notice_nights') if DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights') else (0 if P('after_check_in_refund_pct') == 0 else K('standard_pet_notice_nights'))"
      - pet_refundable_nights: "MX(0, MN(nights_booked, nights_booked - cancel_offset - 1) - pet_notice_nights)"
      - pet_refund_share: "pet_refundable_nights / nights_booked if (F('payment_plan') == 'monthly_installments' and COUNT('stay_transactions', event_type='stay_payment_collected') >= 1) else (pet_refundable_nights / nights_booked * P('pay_part_now_deposit_pct') / 100 if (F('payment_plan') == 'pay_part_now' and COUNT('stay_transactions', event_type='stay_payment_collected', installment_number=2) == 0) else SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='nightly', refund_reason='guest_cancellation') / F('nightly_subtotal'))"
      - pet_clean_pct: "K('pet_clean_share_arrival_day_pct') if DAYS(F('check_in_date'), F('cancelled_at')) == 0 else (K('pet_clean_share_after_arrival_day_pct') if DAYS(F('check_in_date'), F('cancelled_at')) > 0 else 0)"
      - pet_courtesy_pct: "K('pet_clean_courtesy_concierge_pct') if CPARAM('rewards', 'dedicated_concierge', status='active') == True else (K('pet_clean_courtesy_priority_pct') if CPARAM('rewards', 'priority_support_line', status='active') == True else 0)"
      - pet_kept_pct: "pet_clean_pct * (100 - pet_courtesy_pct) / 100"
      - pet_credits_redeemed: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_redeemed', stay_id=HID)"
      - pet_credits_reinstated: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_reinstated', stay_id=HID)"
      - pet_cash_fraction: "(1 - pet_credits_redeemed / F('total_price')) if (pet_credits_redeemed > 0 and pet_credits_reinstated == 0) else ((1 - (pet_credits_redeemed - pet_credits_reinstated) / F('total_price')) if (pet_credits_redeemed > pet_credits_reinstated and pet_credits_reinstated > 0) else 1)"
      - result: "RND(F('pet_fee_total') * pet_refund_share * (100 - pet_kept_pct) / 100 * pet_cash_fraction, 2)"
    compute_basis:
      nights_booked: "the share returned is the pet-refundable nights divided by the stay's nights"
      cancel_offset: "the nights dated after the cancellation date and before the check-out date less the nights the pet-fee refund leaves out for notice"
      pet_notice_nights: "How many nights the pet-fee refund leaves out for notice depends on the stay: a stay of long_term_min_nights nights or more leaves out after_check_in_notice_nights nights; a shorter stay booked under a tier whose after_check_in_refund_pct is 0 leaves out none; any other stay leaves out standard_pet_notice_nights."
      pet_refundable_nights: "The pet-fee refund counts the pet-refundable nights, the nights dated after the cancellation date and before the check-out date less the nights the pet-fee refund leaves out for notice"
      pet_refund_share: "How much of the pet fee is returned depends on how the stay is paid: on a stay paid in monthly installments whose collections have begun, the pet fee was collected in full up front, so the share returned is the pet-refundable nights divided by the stay's nights; on a pay-part-now stay whose balance has not been collected, the share returned is the pet-refundable nights divided by the stay's nights, times pay_part_now_deposit_pct percent; on any other stay the share returned is the nightly amount refunded on the same cancellation divided by the stay's nightly subtotal."
      pet_clean_pct: "Once pets have arrived, part of the pet fee pays for the deep clean after them and is kept: a cancellation dated on the check-in date keeps pet_clean_share_arrival_day_pct percent of the refundable pet fee; a cancellation dated after the check-in date keeps pet_clean_share_after_arrival_day_pct percent of it; a cancellation before the check-in date keeps none."
      pet_courtesy_pct: "Roamhaven Rewards members get a courtesy on the deep-clean share: a guest whose active Rewards tier includes a dedicated concierge has pet_clean_courtesy_concierge_pct percent of the deep-clean share waived; a guest whose active Rewards tier includes the priority support line but no dedicated concierge has pet_clean_courtesy_priority_pct percent of it waived; any other guest has none of it waived."
      pet_kept_pct: "The deep-clean share, the courtesy and the credit-funded part are applied in that order to the refundable pet fee before the single rounding to the cent."
      pet_credits_redeemed: "when credits were redeemed on the stay and none of them has been reinstated yet"
      pet_credits_reinstated: "when credits were redeemed on the stay and part of them has already been reinstated"
      pet_cash_fraction: "When Rewards credits paid part of the stay, the credit-funded part of the pet-fee refund goes back as credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been reinstated yet, the card receives the refund times one minus the credits redeemed divided by the stay's total price; when credits were redeemed on the stay and part of them has already been reinstated, the card receives the refund times one minus the credits still outstanding (redeemed less reinstated) divided by the stay's total price; when no credits were redeemed, the card receives the whole refund."
      result: "The deep-clean share, the courtesy and the credit-funded part are applied in that order to the refundable pet fee before the single rounding to the cent."
    factors:
      - id: pet_notice_nights
        effect: parameter
        decides: pet_notice_nights
        bindings: [pet_notice_nights]
        ladder:
          - when: "the stay has long_term_min_nights nights or more"
            value: "P('after_check_in_notice_nights')"
          - when: "the stay is shorter and its tier's after_check_in_refund_pct is 0"
            value: "0"
          - when: "otherwise"
            value: "K('standard_pet_notice_nights')"
        baseline:
          pet_notice_nights: "K('standard_pet_notice_nights')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: pet_refund_share
        effect: method
        decides: pet_refund_share
        bindings: [pet_refund_share]
        ladder:
          - when: "the stay is paid in monthly installments and its collections have begun"
            method: "pet-refundable nights divided by the stay's nights"
          - when: "the stay is on pay-part-now and its balance has not been collected"
            method: "pet-refundable nights divided by the stay's nights, times pay_part_now_deposit_pct percent"
          - when: "otherwise"
            method: "the nightly amount refunded on the same cancellation divided by the nightly subtotal"
        baseline:
          pet_refund_share: "SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='nightly', refund_reason='guest_cancellation') / F('nightly_subtotal')"
        evidence: [history, date]
        cross_difficulty: null
      - id: pet_deep_clean_share
        effect: parameter
        decides: pet_clean_pct
        bindings: [pet_clean_pct]
        ladder:
          - when: "the cancellation is dated on the check-in date"
            value: "K('pet_clean_share_arrival_day_pct')"
          - when: "the cancellation is dated after the check-in date"
            value: "K('pet_clean_share_after_arrival_day_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          pet_clean_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: pet_clean_courtesy
        effect: parameter
        decides: pet_courtesy_pct
        bindings: [pet_courtesy_pct]
        ladder:
          - when: "the guest's active Rewards tier includes a dedicated concierge"
            value: "K('pet_clean_courtesy_concierge_pct')"
          - when: "the guest's active Rewards tier includes the priority support line but no dedicated concierge"
            value: "K('pet_clean_courtesy_priority_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          pet_courtesy_pct: "0"
        evidence: [cross_category]
        cross_difficulty: rewards
      - id: pet_credit_funded_part
        effect: method
        decides: pet_cash_fraction
        bindings: [pet_credits_redeemed, pet_credits_reinstated, pet_cash_fraction]
        ladder:
          - when: "credits were redeemed on the stay and none has been reinstated"
            method: "card share = 1 - credits redeemed / total price"
          - when: "credits were redeemed on the stay and part has already been reinstated"
            method: "card share = 1 - (credits redeemed - credits reinstated) / total price"
          - when: "otherwise"
            method: "the whole refund goes to the card"
        baseline:
          pet_cash_fraction: "1"
        evidence: [cross_category, history]
        cross_difficulty: rewards
    baseline:
      rule: >-
        The pet-fee refund counts the pet-refundable nights, the nights dated after the cancellation date and before
        the check-out date less the nights the pet-fee refund leaves out for notice, and it leaves out
