      linen_courtesy_pct: "Roamhaven Rewards members get a courtesy on the linen share: a guest whose active Rewards tier includes a dedicated concierge has linen_courtesy_concierge_pct percent of the linen share waived; a guest whose active Rewards tier includes the priority support line but no dedicated concierge has linen_courtesy_priority_pct percent of it waived; any other guest has none of it waived."
      linen_kept_pct: "The linen share, the courtesy and the credit-funded part are applied in that order to the refundable extra-guest fee before the single rounding to the cent."
      extra_credits_redeemed: "when credits were redeemed on the stay and none of them has been reinstated yet"
      extra_credits_reinstated: "when credits were redeemed on the stay and part of them has already been reinstated"
      extra_cash_fraction: "When Rewards credits paid part of the stay, the credit-funded part of the extra-guest-fee refund goes back as credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been reinstated yet, the card receives the extra-guest-fee refund times one minus the credits redeemed divided by the stay's total price; when credits were redeemed on the stay and part of them has already been reinstated, the card receives the extra-guest-fee refund times one minus the credits still outstanding (redeemed less reinstated) divided by the stay's total price; when no credits were redeemed, the card receives the whole extra-guest-fee refund."
      result: "The linen share, the courtesy and the credit-funded part are applied in that order to the refundable extra-guest fee before the single rounding to the cent."
    factors:
      - id: extra_guest_notice_nights
        effect: parameter
        decides: extra_notice_nights
        bindings: [extra_notice_nights]
        ladder:
          - when: "the stay has long_term_min_nights nights or more"
            value: "P('after_check_in_notice_nights')"
          - when: "the stay is shorter and its tier's after_check_in_refund_pct is 0"
            value: "0"
          - when: "otherwise"
            value: "K('standard_extra_guest_notice_nights')"
        baseline:
          extra_notice_nights: "K('standard_extra_guest_notice_nights')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: extra_guest_refund_share
        effect: method
        decides: extra_refund_share
        bindings: [extra_refund_share]
        ladder:
          - when: "the stay is paid in monthly installments and its collections have begun"
            method: "extra-guest-refundable nights divided by the stay's nights"
          - when: "the stay is on pay-part-now and its balance has not been collected"
            method: "extra-guest-refundable nights divided by the stay's nights, times pay_part_now_deposit_pct percent"
          - when: "otherwise"
            method: "the nightly amount refunded on the same cancellation divided by the nightly subtotal"
        baseline:
          extra_refund_share: "SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='nightly', refund_reason='guest_cancellation') / F('nightly_subtotal')"
        evidence: [history, date]
        cross_difficulty: null
      - id: extra_guest_linen_share
        effect: parameter
        decides: linen_pct
        bindings: [linen_pct]
        ladder:
          - when: "the cancellation is dated on the check-in date"
            value: "K('linen_share_arrival_day_pct')"
          - when: "the cancellation is dated after the check-in date"
            value: "K('linen_share_after_arrival_day_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          linen_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: extra_guest_linen_courtesy
        effect: parameter
        decides: linen_courtesy_pct
        bindings: [linen_courtesy_pct]
        ladder:
          - when: "the guest's active Rewards tier includes a dedicated concierge"
            value: "K('linen_courtesy_concierge_pct')"
          - when: "the guest's active Rewards tier includes the priority support line but no dedicated concierge"
            value: "K('linen_courtesy_priority_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          linen_courtesy_pct: "0"
        evidence: [cross_category]
        cross_difficulty: rewards
      - id: extra_guest_credit_funded_part
        effect: method
        decides: extra_cash_fraction
        bindings: [extra_credits_redeemed, extra_credits_reinstated, extra_cash_fraction]
        ladder:
          - when: "credits were redeemed on the stay and none has been reinstated"
            method: "card share = 1 - credits redeemed / total price"
          - when: "credits were redeemed on the stay and part has already been reinstated"
            method: "card share = 1 - (credits redeemed - credits reinstated) / total price"
          - when: "otherwise"
            method: "the whole extra-guest-fee refund goes to the card"
        baseline:
          extra_cash_fraction: "1"
        evidence: [cross_category, history]
        cross_difficulty: rewards
    baseline:
      rule: >-
        The extra-guest-fee refund counts the extra-guest-refundable nights, the nights dated after the cancellation
        date and before the check-out date less the nights the extra-guest-fee refund holds back for notice, and it
        holds back standard_extra_guest_notice_nights of them. The share of the extra-guest fee returned is the nightly
        amount refunded on the same cancellation divided by the stay's nightly subtotal. The extra-guest-fee refund is
        the extra-guest fee recorded on the stay times that share, rounded half up to the cent, and it is paid to the
        guest's card in full.
      params: [standard_extra_guest_notice_nights]
    inputs:
      history:
        - {table: stay_transactions, aggregate: sum, field: amount, filters: {event_type: stay_refund_issued, charge_component: nightly, refund_reason: guest_cancellation}}
        - {table: stay_transactions, aggregate: count, field: stay_txn_id, filters: {event_type: stay_payment_collected, installment_number: 2}}
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_redeemed}}
        - {category: rewards, table: rewards_transactions, aggregate: sum, field: amount, filters: {event_type: rewards_credit_reinstated}}
      cross_category: [rewards]
  - id: stay_ext_departure_service_fee_refund
    base_policy_refs: [stay_agg_service_fee_refund_cap, stay_evt_guest_cancellation_refund, stay_evt_host_cancellation_refund, stay_evt_travel_issue_refund, stay_evt_major_disruptive_event, stay_evt_alteration, stay_evt_refund_settlement, stay_booking_terms]
    overwrite:
      - base_policy: stay_evt_guest_cancellation_refund
        superseded_clause: >-
          Outside the full-refund window and grace period the guest service fee is refunded in the proportion that the
          refunded service-fee base bears to the full service-fee base when service_fee_partial_refund_mode is
          proportional, and not at all when it is none, always subject to stay_agg_service_fee_refund_cap.
        replaced_by: >-
          Outside the full-refund window and grace period, Roamhaven refunds its guest service fee on a guest
          cancellation as a percentage of the refunded fee base, always subject to the service-fee refund cap, and pays
          it to the guest's original payment method.
      - base_policy: stay_evt_travel_issue_refund
        superseded_clause: >-
          A travel-issue refund is issued only when Roamhaven has approved the travel-issue request.
        replaced_by: >-
          A travel-issue refund is issued only when Roamhaven has approved the travel-issue request, and a refund that
          rests on no stay request, as every departure refund does, needs no such approval.
      - base_policy: stay_evt_travel_issue_refund
        superseded_clause: >-
          A travel issue is eligible only when the guest reported it no more than travel_issue_report_hours elapsed
          hours after the guest discovered the issue; the hours are counted in elapsed clock time from the request's
          issue_discovered_at to its submitted_at.
        replaced_by: >-
          A travel issue is eligible only when the guest reported it no more than travel_issue_report_hours elapsed
          hours after the guest discovered the issue; the hours are counted in elapsed clock time from the request's
          issue_discovered_at to its submitted_at, and a refund that rests on no stay request has no reporting window.
      - base_policy: stay_evt_major_disruptive_event
        superseded_clause: >-
          A major-disruptive-event refund is issued only when Roamhaven has approved the major-disruptive-event request.
        replaced_by: >-
          A major-disruptive-event refund is issued only when Roamhaven has approved the major-disruptive-event request,
          and a cancellation that rests on no approved major-disruptive-event request is refunded under these departure
          rules.
    trigger: state_due
    subject: [stay_refund_issued]
    computes: amount
    target_tool: refund_service_fee_f4bed6e4
    params:
      standard_refund_fee_pct: 14.20
      in_stay_fee_share_pct: 50
      late_fee_share_pct: 75
      late_cancellation_days: 7
      arrival_courtesy_concierge_pct: 100
      arrival_courtesy_priority_pct: 50
    rule: >-
      Outside the full-refund window and grace period, Roamhaven refunds its guest service fee on a guest
      cancellation as a percentage of the refunded fee base, always subject to the service-fee refund cap, and pays
      it to the guest's original payment method. The guest-service-fee refund on a cancellation is fixed only after
      the stay's ledger carries the pet-fee refund that cancellation owes. The guest-service-fee refund on a
      cancellation is fixed only after the stay's ledger carries the extra-guest-fee refund that cancellation owes.
      The refunded fee base is the nightly, cleaning-fee, pet-fee and extra-guest-fee amounts the stay's ledger shows
      refunded on the guest cancellation, every amount the guest service fee was charged on. The guest-service-fee
      refund is standard_refund_fee_pct percent of the refunded fee base, rounded half up to the cent, and the whole
      of it is paid to the guest's card.
      The percentage the guest-service-fee refund applies depends on the stay: a stay booked with the host-only fee
      structure applies host_only_fee_guest_service_fee_pct; a split-fee stay of long_term_min_nights nights or more
      applies the guest_service_fee_pct of the stay's tier; any other stay applies standard_refund_fee_pct.
      Roamhaven keeps part of its fee on the refunded amounts when a cancellation comes late, because the booking
      held the listing off the market: a cancellation dated on or after the check-in date returns
      in_stay_fee_share_pct percent of the fee on the refunded fee base; a cancellation dated before the check-in date
      but fewer than late_cancellation_days calendar days before it returns late_fee_share_pct percent of it; any
      earlier cancellation returns all of it.
      Roamhaven Rewards members who leave on the day they arrive get a courtesy on the arrival night, whose price is
      the nightly subtotal divided by the stay's nights rounded half up to the cent: when the cancellation is dated on
      the check-in date and the guest's active Rewards tier includes a dedicated concierge,
      arrival_courtesy_concierge_pct percent of the arrival night's price is added to the fee base of the refund;
      when the cancellation is dated on the check-in date and the guest's active Rewards tier includes the priority
      support line but no dedicated concierge, arrival_courtesy_priority_pct percent of it is added; otherwise none of
      it is added. The courtesy amount is rounded half up to the cent and is returned in full.
      When Rewards credits paid part of the stay, the credit-funded part of the guest-service-fee refund goes back as
      credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been
      reinstated yet, the card receives the guest-service-fee refund times one minus the credits redeemed divided by
      the stay's total price; when credits were redeemed on the stay and part of them has already been reinstated,
      the card receives it times one minus the credits still outstanding (redeemed less reinstated) divided by the
      stay's total price; when no credits were redeemed, the card receives the whole guest-service-fee refund. The
      percentage is applied to the refunded fee base times the share returned plus the arrival-night courtesy, the
      credit-funded part is then taken out, and the result is rounded half up to the cent once.
      A travel-issue refund is issued only when Roamhaven has approved the travel-issue request, and a refund that
      rests on no stay request, as every departure refund does, needs no such approval. A travel issue is eligible
      only when the guest reported it no more than travel_issue_report_hours elapsed hours after the guest discovered
      the issue; the hours are counted in elapsed clock time from the request's issue_discovered_at to its
      submitted_at, and a refund that rests on no stay request has no reporting window. A major-disruptive-event
      refund is issued only when Roamhaven has approved the major-disruptive-event request, and a cancellation that
      rests on no approved major-disruptive-event request is refunded under these departure rules.
    prerequisite:
      - problem: stay_ext_departure_pet_fee_refund
        kind: value_input
        gate: sf_addon_refunds
        form: state
        policy_source: >-
          The guest-service-fee refund on a cancellation is fixed only after the stay's ledger carries the pet-fee
          refund that cancellation owes.
        condition: >-
          stay_transactions holds the stay_refund_issued row with charge_component pet_fee and refund_reason
          guest_cancellation for the cancelled stay whenever the pet-fee refund the departure rules give is above 0.00.
        resolved_by: refund_pet_fee_41a7068c
        effect: >-
          sf_addon_refunds rises by the pet-fee refund posted, so the refunded fee base and the service-fee refund
          rise with it.
      - problem: stay_ext_departure_extra_guest_fee_refund
        kind: value_input
        gate: sf_addon_refunds
        form: state
        policy_source: >-
          The guest-service-fee refund on a cancellation is fixed only after the stay's ledger carries the
          extra-guest-fee refund that cancellation owes.
        condition: >-
          stay_transactions holds the stay_refund_issued row with charge_component extra_guest_fee and refund_reason
          guest_cancellation for the cancelled stay whenever the extra-guest-fee refund the departure rules give is
          above 0.00.
        resolved_by: refund_extra_guest_fee_b492f389
        effect: >-
          sf_addon_refunds rises by the extra-guest-fee refund posted, so the refunded fee base and the service-fee
          refund rise with it.
    cross_category:
      - category: rewards
        as: history
        reads: [variant_name, status, rewards_transactions.amount]
        note: The arrival-night courtesy reads the guest's active Rewards tier, and the credit-funded part reads the credits redeemed and reinstated on the stay in the Rewards ledger.
    compute:
      - sf_nightly_refunds: "SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='nightly', refund_reason='guest_cancellation')"
      - sf_cleaning_refunds: "SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='cleaning_fee', refund_reason='guest_cancellation')"
      - sf_addon_refunds: "SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='pet_fee', refund_reason='guest_cancellation') + SUM('stay_transactions', 'amount', event_type='stay_refund_issued', charge_component='extra_guest_fee', refund_reason='guest_cancellation')"
      - sf_refunded_base: "sf_nightly_refunds + sf_cleaning_refunds + sf_addon_refunds"
      - sf_rate_pct: "P('host_only_fee_guest_service_fee_pct') if F('fee_structure') == 'host_only_fee' else (P('guest_service_fee_pct') if DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights') else K('standard_refund_fee_pct'))"
      - sf_fee_share_pct: "K('in_stay_fee_share_pct') if DAYS(F('check_in_date'), F('cancelled_at')) >= 0 else (K('late_fee_share_pct') if DAYS(F('cancelled_at'), F('check_in_date')) < K('late_cancellation_days') else 100)"
      - sf_arrival_share_pct: "K('arrival_courtesy_concierge_pct') if (DAYS(F('check_in_date'), F('cancelled_at')) == 0 and CPARAM('rewards', 'dedicated_concierge', status='active') == True) else (K('arrival_courtesy_priority_pct') if (DAYS(F('check_in_date'), F('cancelled_at')) == 0 and CPARAM('rewards', 'priority_support_line', status='active') == True) else 0)"
      - sf_arrival_courtesy: "RND(RND(F('nightly_subtotal') / DAYS(F('check_in_date'), F('check_out_date')), 2) * sf_arrival_share_pct / 100, 2)"
      - sf_credits_redeemed: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_redeemed', stay_id=HID)"
      - sf_credits_reinstated: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_reinstated', stay_id=HID)"
      - sf_cash_fraction: "(1 - sf_credits_redeemed / F('total_price')) if (sf_credits_redeemed > 0 and sf_credits_reinstated == 0) else ((1 - (sf_credits_redeemed - sf_credits_reinstated) / F('total_price')) if (sf_credits_redeemed > sf_credits_reinstated and sf_credits_reinstated > 0) else 1)"
      - result: "RND((sf_refunded_base * sf_fee_share_pct / 100 + sf_arrival_courtesy) * sf_rate_pct / 100 * sf_cash_fraction, 2)"
    compute_basis:
      sf_nightly_refunds: "The refunded fee base is the nightly, cleaning-fee, pet-fee and extra-guest-fee amounts the stay's ledger shows refunded on the guest cancellation"
      sf_cleaning_refunds: "The refunded fee base is the nightly, cleaning-fee, pet-fee and extra-guest-fee amounts the stay's ledger shows refunded on the guest cancellation"
      sf_addon_refunds: "The refunded fee base is the nightly, cleaning-fee, pet-fee and extra-guest-fee amounts the stay's ledger shows refunded on the guest cancellation"
      sf_refunded_base: "The refunded fee base is the nightly, cleaning-fee, pet-fee and extra-guest-fee amounts the stay's ledger shows refunded on the guest cancellation, every amount the guest service fee was charged on."
      sf_rate_pct: "The percentage the guest-service-fee refund applies depends on the stay: a stay booked with the host-only fee structure applies host_only_fee_guest_service_fee_pct; a split-fee stay of long_term_min_nights nights or more applies the guest_service_fee_pct of the stay's tier; any other stay applies standard_refund_fee_pct."
      sf_fee_share_pct: "a cancellation dated on or after the check-in date returns in_stay_fee_share_pct percent of the fee on the refunded fee base; a cancellation dated before the check-in date but fewer than late_cancellation_days calendar days before it returns late_fee_share_pct percent of it; any earlier cancellation returns all of it."
      sf_arrival_share_pct: "when the cancellation is dated on the check-in date and the guest's active Rewards tier includes a dedicated concierge, arrival_courtesy_concierge_pct percent of the arrival night's price is added to the fee base of the refund; when the cancellation is dated on the check-in date and the guest's active Rewards tier includes the priority support line but no dedicated concierge, arrival_courtesy_priority_pct percent of it is added; otherwise none of it is added."
      sf_arrival_courtesy: "Roamhaven Rewards members who leave on the day they arrive get a courtesy on the arrival night, whose price is the nightly subtotal divided by the stay's nights rounded half up to the cent"
      sf_credits_redeemed: "when credits were redeemed on the stay and none of them has been reinstated yet"
      sf_credits_reinstated: "when credits were redeemed on the stay and part of them has already been reinstated"
      sf_cash_fraction: "When Rewards credits paid part of the stay, the credit-funded part of the guest-service-fee refund goes back as credits and only the rest is paid to the card: when credits were redeemed on the stay and none of them has been reinstated yet, the card receives the guest-service-fee refund times one minus the credits redeemed divided by the stay's total price; when credits were redeemed on the stay and part of them has already been reinstated, the card receives it times one minus the credits still outstanding (redeemed less reinstated) divided by the stay's total price; when no credits were redeemed, the card receives the whole guest-service-fee refund."
      result: "The percentage is applied to the refunded fee base times the share returned plus the arrival-night courtesy, the credit-funded part is then taken out, and the result is rounded half up to the cent once."
    factors:
      - id: refund_fee_percentage
        effect: parameter
        decides: sf_rate_pct
        bindings: [sf_rate_pct]
        ladder:
          - when: "the stay was booked with the host-only fee structure"
            value: "P('host_only_fee_guest_service_fee_pct')"
          - when: "the stay is split-fee and has long_term_min_nights nights or more"
