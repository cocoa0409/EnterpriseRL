          extra_guest_fee and refund_reason guest_cancellation whenever the extra-guest-fee refund the departure rules
          give is above 0.00.
        resolved_by: refund_extra_guest_fee_b492f389
        effect: >-
          The extra-guest-fee refund the cancellation owes is on the ledger, so the notice charge may be collected;
          the extra-guest-fee refund policy books that entry.
      - problem: stay_ext_departure_service_fee_refund
        kind: state_gate
        gate: stay_transactions.charge_component
        form: state
        policy_source: >-
          The notice charge is not collected until the stay's ledger carries the guest-cancellation refund owed on
          Roamhaven's guest service fee.
        condition: >-
          stay_transactions holds a stay_refund_issued row on the cancelled stay with charge_component
          guest_service_fee and refund_reason guest_cancellation whenever the service-fee refund the departure rules
          give is above 0.00.
        resolved_by: refund_service_fee_f4bed6e4
        effect: >-
          The guest-service-fee refund the cancellation owes is on the ledger, so the notice charge may be collected;
          the service-fee refund policy books that entry.
    cross_category:
      - category: rewards
        as: history
        reads: [variant_name, status, rewards_transactions.amount, rewards_transactions.posted_date]
        note: The Rewards fee relief reads whether the guest's active Rewards tier carries a dedicated concierge or the priority support line; the returning-guest relief counts the credits earned in the guest's Rewards ledger; the credits redeemed and reinstated on the stay are read when installment 1 was never collected.
    compute:
      - nights_booked: "DAYS(F('check_in_date'), F('check_out_date'))"
      - cancel_offset: "DAYS(F('check_in_date'), F('cancelled_at'))"
      - spent_nights: "MN(nights_booked, MX(0, cancel_offset + 1))"
      - unspent_nights: "MX(0, nights_booked - spent_nights)"
      - notice_nights: "P('after_check_in_notice_nights') if DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights') else (0 if P('after_check_in_refund_pct') == 0 else K('standard_notice_nights'))"
      - notice_count: "MN(notice_nights, unspent_nights)"
      - later_nights: "MX(0, unspent_nights - notice_count)"
      - later_kept_pct: "0 if (DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights') or P('after_check_in_refund_pct') == 100) else ((100 - P('after_check_in_refund_pct')) if P('after_check_in_refund_pct') > 0 else 100)"
      - kept_nights: "spent_nights + notice_count + later_nights * later_kept_pct / 100"
      - night_price: "RND(F('nightly_subtotal') / nights_booked, 2)"
      - kept_nightly: "RND(kept_nights * night_price, 2)"
      - installments_collected: "COUNT('stay_transactions', event_type='stay_payment_collected') - COUNT('stay_transactions', event_type='stay_payment_collected', installment_number=0)"
      - first_installment_collected: "COUNT('stay_transactions', event_type='stay_payment_collected', installment_number=1)"
      - paid_nightly: "(MN(nights_booked, installments_collected * P('installment_nights')) * night_price if F('payment_plan') == 'monthly_installments' else (F('nightly_subtotal') * (1 if COUNT('stay_transactions', event_type='stay_payment_collected', installment_number=2) >= 1 else P('pay_part_now_deposit_pct') / 100) if F('payment_plan') == 'pay_part_now' else F('nightly_subtotal'))) if first_installment_collected >= 1 else 0"
      - owed_nightly: "MX(0, RND(kept_nightly - paid_nightly, 2))"
      - owed_nights: "owed_nightly / night_price"
      - owed_fees: "0 if first_installment_collected >= 1 else RND(F('cleaning_fee') + (F('pet_fee_total') + F('extra_guest_fee_total')) * kept_nights / nights_booked, 2)"
      - fee_base: "owed_nightly + owed_fees"
      - fee_rate_pct: "P('host_only_fee_guest_service_fee_pct') if F('fee_structure') == 'host_only_fee' else (P('guest_service_fee_pct') if DAYS(F('check_in_date'), F('check_out_date')) >= P('long_term_min_nights') else K('standard_guest_service_fee_pct'))"
      - fee_relief_pct: "K('concierge_fee_relief_pct') if CPARAM('rewards', 'dedicated_concierge', status='active') == True else (K('priority_fee_relief_pct') if CPARAM('rewards', 'priority_support_line', status='active') == True else 0)"
      - returning_earnings: "XCOUNT('rewards', 'rewards_transactions', within_months=K('loyalty_window_months'), date_field='posted_date', event_type='rewards_credit_earned')"
      - returning_relief_pct: "K('returning_two_relief_pct') if returning_earnings >= 2 else (K('returning_one_relief_pct') if returning_earnings == 1 else 0)"
      - notice_fee: "RND(fee_base * fee_rate_pct / 100 * (100 - MN(100, fee_relief_pct + returning_relief_pct)) / 100, 2)"
      - jurisdiction_rate_pct: "K('tx_austin_rate_pct') if F('jurisdiction_code') == 'TX-AUSTIN' else (K('fl_orange_rate_pct') if F('jurisdiction_code') == 'FL-ORANGE' else (K('co_denver_rate_pct') if F('jurisdiction_code') == 'CO-DENVER' else (K('tn_nashville_rate_pct') if F('jurisdiction_code') == 'TN-NASHVILLE' else (K('hi_honolulu_rate_pct') if F('jurisdiction_code') == 'HI-HONOLULU' else K('ca_san_diego_rate_pct')))))"
      - jurisdiction_flat_usd: "K('tn_nashville_flat_per_night_usd') if F('jurisdiction_code') == 'TN-NASHVILLE' else 0"
      - jurisdiction_exempt_min: "K('tx_austin_exempt_min_nights') if F('jurisdiction_code') == 'TX-AUSTIN' else (K('fl_orange_exempt_min_nights') if F('jurisdiction_code') == 'FL-ORANGE' else (K('co_denver_exempt_min_nights') if F('jurisdiction_code') == 'CO-DENVER' else (K('tn_nashville_exempt_min_nights') if F('jurisdiction_code') == 'TN-NASHVILLE' else (K('hi_honolulu_exempt_min_nights') if F('jurisdiction_code') == 'HI-HONOLULU' else K('ca_san_diego_exempt_min_nights')))))"
      - notice_tax: "0 if (DAYS(F('check_in_date'), F('check_out_date')) >= jurisdiction_exempt_min and kept_nights >= jurisdiction_exempt_min) else (RND((kept_nightly + (F('cleaning_fee') + F('pet_fee_total') + F('extra_guest_fee_total')) * kept_nights / nights_booked) * jurisdiction_rate_pct / 100 + jurisdiction_flat_usd * kept_nights, 2) if DAYS(F('check_in_date'), F('check_out_date')) >= jurisdiction_exempt_min else RND(fee_base * jurisdiction_rate_pct / 100 + jurisdiction_flat_usd * owed_nights, 2))"
      - notice_credits_redeemed: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_redeemed', stay_id=HID)"
      - notice_credits_reinstated: "XSUM('rewards', 'rewards_transactions', 'amount', event_type='rewards_credit_reinstated', stay_id=HID)"
      - notice_credit_offset: "0 if first_installment_collected >= 1 else MX(0, notice_credits_redeemed - notice_credits_reinstated)"
      - result: "MX(0, RND(owed_nightly + owed_fees + notice_fee + notice_tax - notice_credit_offset, 2))"
