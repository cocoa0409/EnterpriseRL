    trigger: state_due
    subject: [stay_payment_collected]
    computes: amount
    target_tool: pay_notice_charge_caff8891
    params:
      standard_notice_nights: 1
      standard_guest_service_fee_pct: 14.20
      concierge_fee_relief_pct: 100
      priority_fee_relief_pct: 50
      returning_two_relief_pct: 25
      returning_one_relief_pct: 10
      loyalty_window_months: 24
      tx_austin_rate_pct: 17.00
      fl_orange_rate_pct: 12.50
      co_denver_rate_pct: 15.75
      tn_nashville_rate_pct: 15.25
      hi_honolulu_rate_pct: 17.96
      ca_san_diego_rate_pct: 12.50
      tn_nashville_flat_per_night_usd: 2.50
      tx_austin_exempt_min_nights: 30
      fl_orange_exempt_min_nights: 183
      co_denver_exempt_min_nights: 30
      tn_nashville_exempt_min_nights: 30
      hi_honolulu_exempt_min_nights: 180
      ca_san_diego_exempt_min_nights: 30
    rule: >-
      When a guest cancels a stay that is already in progress, the guest owes the nights the cancellation keeps
      that the stay's collections have not paid, and Roamhaven collects them from the guest in one notice charge on
      the cancelled stay. This covers a guest who leaves a long stay paid month by month before the installments
      reach the nights the cancellation keeps, and a guest who checked in while the collection of installment 1 was
      still declined and leaves before paying it.
      Money is collected only on a confirmed or checked-in stay, except that a notice charge is collected on a
      stay already cancelled by the guest.
      For each component the refund posted is the lesser of the amount of that component collected so far and the
      amount refundable under this rule, except that on a cancellation dated on or after the check-in date the
      nightly amounts collected pay for the stay's nights in date order and the nightly refund is the nightly amount
      collected less the price of the nights the cancellation keeps, never below 0.00.
      Each installment carries the guest service fee and occupancy tax attributable to the amounts it collects,
      except that the guest service fee of a notice charge is reduced by the Rewards relief and the returning-guest
      relief set out below.
      A stay whose nights are equal to or greater than the jurisdiction's exempt_min_nights carries no occupancy tax
      at all, except that a stay a guest cancellation leaves keeping fewer nights than that minimum carries, on its
      notice charge, the occupancy tax of every night kept.
      The notice charge is booked as the installment that covers the first unpaid night the cancellation keeps; when
      no installment has been collected on the stay, that is installment 1.
      The notice charge is not collected until the stay's ledger carries the guest-cancellation refund owed on the
      stay's pet fee. The notice charge is not collected until the stay's ledger carries the guest-cancellation
      refund owed on the stay's extra-guest fee. The notice charge is not collected until the stay's ledger carries
      the guest-cancellation refund owed on Roamhaven's guest service fee.
      The nights the cancellation keeps are the nights up to and including the cancellation date, the notice nights,
      which are the first standard_notice_nights nights dated after the cancellation date and before the check-out
      date, and every later night of the stay. The nightly amounts collected pay for the stay's nights in date order:
      on a stay paid in monthly installments every installment collected covers installment_nights nights counted
      from the check-in date; on a pay-part-now stay installment 1 pays pay_part_now_deposit_pct percent of every
      night and the balance pays the rest; on any other stay installment 1 pays every night; no night is paid before
      installment 1 is collected. Each night is priced at the stay's night price, the nightly subtotal divided by the
      stay's nights and rounded half up to the cent, and the notice charge collects the price of the nights kept
      less the nightly amounts collected, never below 0.00. When installment 1 has not been collected, the notice
      charge also collects the cleaning fee and the share of the pet and extra-guest fees that the nights kept bear
      to the stay's nights, and it is reduced by the Rewards credits redeemed on the stay and not yet reinstated. The
      guest service fee on the notice charge is standard_guest_service_fee_pct percent of the notice charge's fee
      base, the nightly amount and the fees it collects. The occupancy tax on the notice charge is the percentage rate
      of the notice charge's fee base plus the flat amount for each night it charges, the rate and the flat amount
      being those the occupancy tax schedule of the booking terms sets for the jurisdiction recorded on the stay. The
      notice charge is the nightly amount and the fees it collects plus that guest service fee and that occupancy
      tax, the fee and the tax each rounded half up to the cent, less those credits, and never below 0.00.
      How many notice nights the cancellation keeps depends on the stay: a stay of long_term_min_nights nights or
      more keeps after_check_in_notice_nights notice nights; a shorter stay booked under a tier whose
      after_check_in_refund_pct is 0 keeps no notice night; any other stay keeps standard_notice_nights. When fewer
      nights remain after the cancellation date, the notice nights are those that remain.
      How much of the later nights, those after the notice nights, the cancellation keeps depends on the stay: a
      stay of long_term_min_nights nights or more, or a stay whose tier's after_check_in_refund_pct is 100, keeps
      none of them; a shorter stay whose tier's after_check_in_refund_pct is above 0 and below 100 keeps 100 minus
      after_check_in_refund_pct percent of them; any other stay keeps all of them.
      The guest service fee percentage of the notice charge depends on the stay's fee structure and length: a stay
      booked with the host-only fee structure carries host_only_fee_guest_service_fee_pct; a split-fee stay of
      long_term_min_nights nights or more carries the guest_service_fee_pct of the stay's tier; any other stay
      carries standard_guest_service_fee_pct.
      The occupancy tax of the notice charge depends on whether the stay keeps its exemption: when the stay's
      nights reach the jurisdiction's exempt minimum and the nights kept, the nights up to and including the
      cancellation date, the notice nights kept and the part of the later nights kept, still reach it, the notice
      charge carries no occupancy tax; when the stay's nights reach the exempt minimum but the nights kept fall below
      it, the stay is no longer exempt and the notice charge carries the occupancy tax of every night kept, the
      percentage rate of the kept nights' price and of the cleaning, pet and extra-guest fees attributable to them
      plus the flat amount for each night kept; any other stay is taxed at the percentage rate of the notice charge's
      fee base plus the flat amount for each night it charges.
      Roamhaven Rewards members get relief on the guest service fee of a notice charge: a guest whose active Rewards
      tier includes a dedicated concierge is relieved of concierge_fee_relief_pct percent of it; a guest whose
      active Rewards tier includes the priority support line but no dedicated concierge is relieved of
      priority_fee_relief_pct percent of it; any other guest gets no Rewards relief.
      Guests who keep coming back get a returning-guest relief on the guest service fee of a notice charge as well,
      counted from the credits their Rewards ledger shows earned on completed stays in the last loyalty_window_months
      calendar months: two or more such earnings relieve returning_two_relief_pct percent of it; exactly one relieves
      returning_one_relief_pct percent of it; none relieves nothing. The two reliefs are added together, never
      relieve more than the whole fee, and are applied to the fee before it is rounded.
    prerequisite:
      - problem: stay_ext_departure_pet_fee_refund
        kind: state_gate
        gate: stay_transactions.charge_component
        form: state
        policy_source: >-
          The notice charge is not collected until the stay's ledger carries the guest-cancellation refund owed on the
          stay's pet fee.
        condition: >-
          stay_transactions holds a stay_refund_issued row on the cancelled stay with charge_component pet_fee and
          refund_reason guest_cancellation whenever the pet-fee refund the departure rules give is above 0.00.
        resolved_by: refund_pet_fee_41a7068c
        effect: >-
          The pet-fee refund the cancellation owes is on the ledger, so the notice charge may be collected; the
          pet-fee refund policy books that entry.
      - problem: stay_ext_departure_extra_guest_fee_refund
        kind: state_gate
        gate: stay_transactions.charge_component
        form: state
        policy_source: >-
