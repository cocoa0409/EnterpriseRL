events:
  - type: payout_method_added
    target: payout_methods
    mutation: create
    meaning: A host adds a payout method to the host account.
    grain: one row per payout method
    fields:
      payout_method_id: reference number of the new method
      customer_id: the host
      host_account_id: the host account
      variant_name: the payout rail
      status: pending_verification at creation
      added_date: date added
      is_default: whether it is the default method
      account_last4: last four characters of the account, card or receiver number
      payout_currency: currency the host receives
      routed_listing_id: the listing whose earnings this method receives instead of the default; empty when none
    triggers: []
  - type: payout_method_verified
    target: payout_methods
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: The method passes verification.
    grain: one row per payout method
    fields:
      payout_method_id: the method
      status: becomes active
      verified_date: date verified
    triggers: []
  - type: payout_method_placed_on_hold
    target: payout_methods
    mutation: {transition: {from: active, to: on_hold}}
    meaning: The method stops receiving transfers because a transfer was returned or the method went dormant.
    grain: one row per payout method
    fields:
      payout_method_id: the method
      status: becomes on_hold
      hold_cause: returned_payout or dormant
    triggers: []
  - type: payout_method_reactivated
    target: payout_methods
    mutation: {transition: {from: on_hold, to: active}}
    meaning: A method on hold is reactivated after its updated details were re-verified.
    grain: one row per payout method
    fields:
      payout_method_id: the method
      status: becomes active
      hold_cause: reset to none
    triggers: []
  - type: payout_method_removed
    target: payout_methods
    mutation: {transition: [{from: active, to: removed}, {from: on_hold, to: removed}, {from: pending_verification, to: removed}]}
    meaning: The method is removed by the host, or discarded after failed verification.
    grain: one row per payout method
    fields:
      payout_method_id: the method
      status: becomes removed
      removed_date: date removed
    triggers: []
  - type: payout_routing_updated
    target: payout_methods
    mutation: update
    meaning: The host changes which method is the default, or which listing a method receives.
    grain: one row per payout method (each change rewrites its routing)
    fields:
      payout_method_id: the method
      is_default: whether it is now the default
      default_set_at: timestamp it became the default; empty when not default
      routed_listing_id: listing routed to it; empty when none
    triggers: []
  - type: payout_earnings_released
    target: payout_transactions
    meaning: A stay's (or one monthly installment's) host earnings, net of the host service fee, are released to the routed payout method.
    grain: one row per stay per installment
    distinguish_by: [stay_id, installment_number]
    fields:
      payout_method_id: the method receiving the earnings
      customer_id: the host
      posted_date: date released
      stay_id: the stay
      installment_number: 1 for a stay paid in full or in two parts, n for the nth monthly installment
      amount: earnings released, positive
    account: undisbursed_balance
    direction: in
    triggers: []
  - type: payout_sent
    target: payout_transactions
    meaning: Money is transferred from the undisbursed balance to the host's account on the method.
    grain: one row per transfer
    distinguish_by: [source_event_id, posted_date, amount]
    fields:
      payout_method_id: the method paid
      customer_id: the host
      posted_date: date sent
      stay_id: the stay the transfer pays out; empty for a transfer of credits
      source_event_id: the release or credit record being paid out
      amount: amount transferred, positive
    account: undisbursed_balance
    direction: out
    triggers: []
  - type: payout_fee_charged
    target: payout_transactions
    meaning: A rail fee (transfer, cross-currency or returned-payout fee) is charged against the balance.
    grain: one row per fee per transfer or return
    distinguish_by: [source_event_id, fee_type]
    fields:
      payout_method_id: the method
      customer_id: the host
      posted_date: date charged
      source_event_id: the transfer or return the fee belongs to
      fee_type: transfer_fee, cross_currency_fee or returned_payout_fee
      amount: fee charged, positive
    account: undisbursed_balance
    direction: out
    triggers: []
  - type: payout_tax_withheld
    target: payout_transactions
    meaning: US tax withholding is taken from released earnings of a host without the required taxpayer form.
    grain: one row per release withheld on
    distinguish_by: [stay_id, installment_number]
    fields:
      payout_method_id: the method
      customer_id: the host
      posted_date: date withheld
      stay_id: the stay
      installment_number: the installment released
      source_event_id: the release withheld on
      amount: amount withheld, positive
    account: undisbursed_balance
    direction: out
    triggers: []
  - type: payout_returned
    target: payout_transactions
    meaning: A transfer is returned by the receiving bank or rail and its amount comes back to the balance.
    grain: one row per returned transfer
    distinguish_by: [source_event_id]
    fields:
      payout_method_id: the method
      customer_id: the host
      posted_date: date returned
      source_event_id: the transfer returned
      return_reason: account_closed, invalid_account or name_mismatch
      amount: amount returned, positive
    account: undisbursed_balance
    direction: in
    triggers:
      - event: payout:payout_method_placed_on_hold
        map: {payout_method_id: payout_method_id, hold_cause: returned_payout}
  - type: payout_deduction_applied
    target: payout_transactions
    meaning: An amount the host owes Roamhaven is recovered from the balance.
    grain: one row per amount owed per source record
    distinguish_by: [deduction_type, stay_id, source_event_id]
    fields:
      payout_method_id: the method the deduction is taken from
      customer_id: the host
      posted_date: date deducted
      stay_id: the stay concerned; empty when none
      deduction_type: refund_clawback, cancellation_penalty, protection_premium or guest_payment_reversal
      source_event_id: the refund, penalty, premium or reversal record that created the amount owed
      amount: amount deducted, positive
    account: undisbursed_balance
    direction: out
    triggers: []
  - type: payout_adjustment_credited
    target: payout_transactions
    meaning: An amount owed to the host is credited to the balance.
    grain: one row per amount credited per source record
    distinguish_by: [credit_type, source_event_id]
    fields:
      payout_method_id: the method credited
      customer_id: the host
      posted_date: date credited
      stay_id: the stay concerned; empty when none
      credit_type: claim_reimbursement, guest_damage_payment, penalty_waiver or premium_refund
      source_event_id: the reimbursement, guest payment, waiver or premium refund record
      amount: amount credited, positive
    account: undisbursed_balance
    direction: in
    triggers: []
  - type: payout_hold_placed
    target: payout_transactions
    meaning: Transfers to a method (or to every method of the account) are held.
    grain: one row per hold per method
    distinguish_by: [hold_reason, posted_date]
    fields:
      payout_method_id: the method held
      customer_id: the host
      posted_date: date the hold starts
      hold_reason: account_suspension, new_method, default_change or risk_review
    triggers: []
  - type: payout_hold_released
    target: payout_transactions
    meaning: A hold on a method is released.
    grain: one row per hold released per method
    distinguish_by: [hold_reason, posted_date]
    fields:
      payout_method_id: the method released
      customer_id: the host
      posted_date: date released
      hold_reason: the hold being released
      source_event_id: the hold record released
    triggers: []

measures:
  - id: payout_msr_host_deficit
    window: current state at the moment of the write, across every payout method of the host account
    measure: sum of payout_deduction_applied amounts not yet covered by later inflows, i.e. the negative part of the sum of undisbursed_balance over all the host's methods
  - id: payout_msr_open_holds
    window: current state at the moment of the write
    measure: payout_hold_placed rows of the method (or of any method of the account, for account_suspension) with no payout_hold_released row naming them as source_event_id

policies:
  - id: payout_agg_multi_holding
    subject: [payout_method_added]
    rule: >-
      A host account may hold up to max_per_customer payout methods in any status other than removed, on any mix of
      rails; exactly one active method is the default at any time. A rail may be added only when the host's bank or
      receiver country is in the rail's available_countries and the payout currency is in its supported_currencies,
      and, where name_match_required is true, only in the host's legal name or the account's business_name. The first
      method added becomes the default.
    eligibility: []
    params:
      max_per_customer: 10
  - id: payout_agg_routing
    subject: [payout_earnings_released, payout_adjustment_credited, payout_routing_updated, payout_method_removed]
    rule: >-
      Earnings of a stay are released to the method whose routed_listing_id is the stay's listing, when such a method is
      active and its rail has listing_routing_allowed true; otherwise to the default method. Protection reimbursements,
      guest damage payments, penalty waivers and premium refunds are credited to the default method
      (claim_credit_routing). Setting a new default clears the flag on the old one and stamps default_set_at; transfers
      to a newly set default are held under payout_evt_holds. The default method can be removed only when the host has
      at least min_methods_for_removal_of_default active methods, and another active method must be made the default
      first; a removed method's undisbursed balance moves to the default method (removal_reroute). A method that is not
      active receives no release; its share goes to the default method instead.
    eligibility: []
  - id: payout_agg_negative_balance
    subject: [payout_deduction_applied]
    rule: >-
      An amount the host owes — the host-funded share of a guest refund issued after the payout release (the refunded
      amount less the host service fee refunded on it), a host cancellation penalty, a protection premium, or a guest
      damage payment later reversed — is deducted from the undisbursed balance of the method the stay's earnings were
      released to, or of the default method when the amount is not tied to a stay. Where that balance cannot cover it,
      the remainder is recovered from the next released earnings on any of the host's payout methods, oldest deficit
      first (payout_msr_host_deficit). A deduction is applied once per source record. A deficit still unrecovered
      unrecovered_deficit_escalation_days after it arose leaves support for Roamhaven collections; support does not
      settle it, write it off or take a card payment for it.
    eligibility:
      - id: one_deduction_per_source
        applies_to: [payout_deduction_applied]
        kind: dedup
        condition: A deduction is applied once per source record.
        evidence_fields: [payout_transactions.source_event_id, payout_transactions.deduction_type, payout_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_transactions.source_event_id]
          action_bindings:
            payout_transactions.source_event_id: source_event_id
        dedup_contract:
          table: payout_transactions
          mode: separate_record
          object_bindings: {source_event_id: source_event_id, deduction_type: deduction_type}
          duplicate_filters: {event_type: [payout_deduction_applied]}
          distinct_fields: []
    measures: [payout_msr_host_deficit]
  - id: payout_evt_release
    subject: [payout_earnings_released]
    rule: >-
      A stay's earnings are its nightly_subtotal, cleaning_fee, pet_fee_total and extra_guest_fee_total less the host
      service fee assessed on it, all net of host-funded refunds already issued. Earnings are released only for a stay
      that has checked in, has completed, or was cancelled by the guest. Earnings are released no earlier than
      release_hours_after_check_in elapsed hours after the start of the stay's check-in date; the hours run from 00:00 on
      check_in_date, so the earliest release falls on the next calendar day. A stay cancelled by the guest before
      check-in releases the host-funded amount the guest did not get back, on the same schedule from the original
      check-in date. A monthly-installment stay releases each installment's earnings on long_term_release_basis, as
      installment n. Each stay installment is released once.
    eligibility:
      - id: stay_has_started_or_retained
        applies_to: [payout_earnings_released]
        kind: state
        condition: Earnings are released only for a stay that has checked in, has completed, or was cancelled by the guest.
        evidence_fields: [stays.status, stays.stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [stays.stay_id]
          action_bindings:
            stays.stay_id: stay_id
        state_contract:
          field: stays.status
          allowed: [checked_in, completed, cancelled_by_guest]
      - id: release_after_check_in
        applies_to: [payout_earnings_released]
        kind: time
        condition: Earnings are released no earlier than release_hours_after_check_in elapsed hours after the start of the stay's check-in date; the hours run from 00:00 on check_in_date, so the earliest release falls on the next calendar day.
        evidence_fields: [stays.check_in_date, stays.stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [stays.stay_id]
          action_bindings:
            stays.stay_id: stay_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the start of the stay's check-in date
          anchor_source: stays.check_in_date
          relation: not_before
          duration_source: variants.release_hours_after_check_in
          unit: elapsed_hours
          counting_rule: the hours run from 00:00 on check_in_date, so the earliest release falls on the next calendar day.
          boundary: inclusive
      - id: one_release_per_installment
        applies_to: [payout_earnings_released]
        kind: dedup
        condition: Each stay installment is released once.
        evidence_fields: [payout_transactions.stay_id, payout_transactions.installment_number, payout_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_transactions.stay_id, payout_transactions.installment_number]
          action_bindings:
            payout_transactions.stay_id: stay_id
            payout_transactions.installment_number: installment_number
        dedup_contract:
          table: payout_transactions
          mode: separate_record
          object_bindings: {stay_id: stay_id, installment_number: installment_number}
          duplicate_filters: {event_type: [payout_earnings_released]}
          distinct_fields: []
  - id: payout_evt_transfer
    subject: [payout_sent, payout_fee_charged]
    rule: >-
      Released earnings and credits are transferred to their method after withholding and deductions, in USD or in the
      method's payout_currency at the conversion_basis rate. A transfer is sent only to an active payout method. No
      transfer is sent while the host account's status is suspended. Transfers to a newly verified method start only
      new_method_hold_days calendar days after its verification date; the days are counted from verified_date, and a
      transfer on the first day after the period is allowed. An amount below min_payout_usd waits in the balance until
      the balance reaches the minimum; an amount above max_single_payout_usd is split into consecutive transfers of at
      most the maximum on the same day. Each transfer is charged the rail's fee_pct of the transfer (cut to fee_cap_usd
      where a cap above 0.00 applies) plus fee_fixed_usd as one transfer_fee, and, when the payout currency is not USD,
      cross_currency_fee_pct (cut to cross_currency_fee_cap_usd where above 0.00) as a separate cross_currency_fee; fees
      are rounded per fee_rounding and taken from the balance. Funds arrive within processing_business_days business
      days on the business_day_calendar; a transfer after transfer_cutoff_time starts the next business day.
    eligibility:
      - id: method_active
        applies_to: [payout_sent]
        kind: state
        condition: A transfer is sent only to an active payout method.
        evidence_fields: [payout_methods.status, payout_methods.payout_method_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_methods.payout_method_id]
          action_bindings:
            payout_methods.payout_method_id: payout_method_id
        state_contract:
          field: payout_methods.status
          allowed: [active]
      - id: account_not_suspended
        applies_to: [payout_sent]
        kind: state
        condition: No transfer is sent while the host account's status is suspended.
        evidence_fields: [host_accounts.status, host_accounts.host_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_accounts.host_account_id]
          action_bindings:
            host_accounts.host_account_id: host_account_id
        state_contract:
          field: host_accounts.status
          allowed: [active, restricted, deactivated]
      - id: new_method_hold
        applies_to: [payout_sent]
        kind: time
        condition: Transfers to a newly verified method start only new_method_hold_days calendar days after its verification date; the days are counted from verified_date, and a transfer on the first day after the period is allowed.
        evidence_fields: [payout_methods.verified_date, payout_methods.payout_method_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_methods.payout_method_id]
          action_bindings:
            payout_methods.payout_method_id: payout_method_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its verification date
          anchor_source: payout_methods.verified_date
          relation: not_before
          duration_source: variants.new_method_hold_days
          unit: calendar_days
          counting_rule: the days are counted from verified_date, and a transfer on the first day after the period is allowed.
          boundary: inclusive
    params:
      per_tier:
        Direct Deposit (ACH): {fee_pct: "=fee_pct", fee_fixed_usd: "=fee_fixed_usd", fee_cap_usd: "=fee_cap_usd", processing_business_days: "=processing_business_days"}
        Fast Pay Debit Card: {fee_pct: "=fee_pct", fee_fixed_usd: "=fee_fixed_usd", fee_cap_usd: "=fee_cap_usd", processing_business_days: "=processing_business_days"}
        PayPal: {fee_pct: "=fee_pct", fee_fixed_usd: "=fee_fixed_usd", fee_cap_usd: "=fee_cap_usd", processing_business_days: "=processing_business_days"}
        Payoneer: {fee_pct: "=fee_pct", fee_fixed_usd: "=fee_fixed_usd", fee_cap_usd: "=fee_cap_usd", processing_business_days: "=processing_business_days"}
        International Wire Transfer: {fee_pct: "=fee_pct", fee_fixed_usd: "=fee_fixed_usd", fee_cap_usd: "=fee_cap_usd", processing_business_days: "=processing_business_days"}
        Western Union Cash Pickup: {fee_pct: "=fee_pct", fee_fixed_usd: "=fee_fixed_usd", fee_cap_usd: "=fee_cap_usd", processing_business_days: "=processing_business_days"}
    formula:
      transfer_fee: 'round((min(amount * fee_pct / 100, fee_cap_usd) if fee_cap_usd > 0 else amount * fee_pct / 100) + fee_fixed_usd, 2)'
  - id: payout_evt_tax_withholding
    subject: [payout_tax_withheld]
    rule: >-
      When the host account's taxpayer_info_status is not_provided, US tax is withheld from every release: a host whose
      tax_residency is us has backup_withholding_pct withheld, and a host whose tax_residency is non_us has
      nonresident_withholding_pct withheld, each on the withholding_base and rounded per fee_rounding. No withholding is
      taken while a W-9 (us) or W-8 (non_us) is on file. Withholding is taken once per release and is never refunded by
      support once taken; it is credited against the host's annual US tax return through the year-end tax form. A form
      supplied later stops withholding on releases from that day onward only.
    eligibility:
      - id: one_withholding_per_release
        applies_to: [payout_tax_withheld]
        kind: dedup
        condition: Withholding is taken once per release and is never refunded by support once taken; it is credited against the host's annual US tax return through the year-end tax form.
        evidence_fields: [payout_transactions.source_event_id, payout_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_transactions.source_event_id]
          action_bindings:
            payout_transactions.source_event_id: source_event_id
        dedup_contract:
          table: payout_transactions
          mode: separate_record
          object_bindings: {source_event_id: source_event_id}
          duplicate_filters: {event_type: [payout_tax_withheld]}
          distinct_fields: []
    formula:
      us_host_withholding: round(amount * backup_withholding_pct / 100, 2)
      non_us_host_withholding: round(amount * nonresident_withholding_pct / 100, 2)
  - id: payout_evt_returns_and_reactivation
    subject: [payout_returned, payout_method_placed_on_hold, payout_method_reactivated, payout_fee_charged]
    rule: >-
      When a transfer is returned, its amount comes back to the undisbursed balance, the method is placed on hold with
      hold_cause returned_payout, and the rail's returned_payout_fee_usd (where above 0.00) is charged once as a
      returned_payout_fee. An active method with no transfer for dormant_method_days calendar days is placed on hold with
      hold_cause dormant. A method on hold receives nothing; releases due to it go to the default method, or wait in
      its balance when it is itself the default. A method on hold is reactivated only after the host has updated and
      re-verified its details, shown by a verified_date later than the date the method was placed on hold. On
      reactivation the held balance is transferred at the next run.
    eligibility:
      - id: reverified_after_hold
        applies_to: [payout_method_reactivated]
        kind: authorization
        condition: A method on hold is reactivated only after the host has updated and re-verified its details, shown by a verified_date later than the date the method was placed on hold.
        evidence_fields: [payout_methods.verified_date, payout_methods.payout_method_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_methods.payout_method_id]
          action_bindings:
            payout_methods.payout_method_id: payout_method_id
  - id: payout_evt_holds
    subject: [payout_hold_placed, payout_hold_released]
    rule: >-
      Holds stop transfers without touching the balance. An account_suspension hold is placed on every method of the
      account when the host account is suspended and released on the day it is reinstated (hold_release_on_reinstatement);
      it is never released while the account stays suspended. A new_method hold runs for new_method_hold_days after
      verification. A default_change hold applies to the new default for default_change_security_hold_hours elapsed hours
      after default_set_at. A risk_review hold placed by Roamhaven's risk team is released after
      risk_review_hold_business_days business days unless the team extends it. An account_suspension hold is released
      only when the host account's status is active again.
    eligibility:
      - id: suspension_hold_release
        applies_to: [payout_hold_released]
        kind: state
        condition: An account_suspension hold is released only when the host account's status is active again.
        evidence_fields: [host_accounts.status, host_accounts.host_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_accounts.host_account_id]
          action_bindings:
            host_accounts.host_account_id: host_account_id
        state_contract:
          field: host_accounts.status
          allowed: [active]
    measures: [payout_msr_open_holds]
  - id: payout_evt_deductions_and_credits
    subject: [payout_deduction_applied, payout_adjustment_credited]
    rule: >-
      Each deduction and credit carries the record that created it. A refund_clawback equals the host-funded guest
      refunds issued after the payout release on the stay less the host service fee refunded on them; a
      cancellation_penalty equals the penalty charged; a protection_premium equals the premium charged on the stay; a
      guest_payment_reversal equals the guest damage payment reversed. A claim_reimbursement equals the reimbursement
      paid on the claim, a guest_damage_payment the guest payment recorded, a penalty_waiver the penalty waived and a
      premium_refund the premium refunded. A credit is booked once per source record and never netted against a
      deduction; both are booked in full and the balance shows the net.
    eligibility:
      - id: one_credit_per_source
        applies_to: [payout_adjustment_credited]
        kind: dedup
        condition: A credit is booked once per source record and never netted against a deduction; both are booked in full and the balance shows the net.
        evidence_fields: [payout_transactions.source_event_id, payout_transactions.credit_type, payout_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_transactions.source_event_id]
          action_bindings:
            payout_transactions.source_event_id: source_event_id
        dedup_contract:
          table: payout_transactions
          mode: separate_record
          object_bindings: {source_event_id: source_event_id, credit_type: credit_type}
          duplicate_filters: {event_type: [payout_adjustment_credited]}
          distinct_fields: []
  - id: payout_evt_method_management
    subject: [payout_method_added, payout_method_verified, payout_method_removed, payout_routing_updated]
    rule: >-
      A new method starts in pending_verification and is verified by the rail's verification_method within
      verification_deadline_days calendar days after it was added, with at most verification_attempts_max failed
      attempts; otherwise it is discarded. A payout method is verified only within verification_deadline_days calendar
      days after it was added; the days are counted from added_date, and verification on the last day stands. Changing
      the default never moves money already released; listing routing applies to releases from the day it is saved.
      Removing a method never cancels a transfer already sent.
    eligibility:
      - id: verification_deadline
        applies_to: [payout_method_verified]
        kind: time
        condition: A payout method is verified only within verification_deadline_days calendar days after it was added; the days are counted from added_date, and verification on the last day stands.
        evidence_fields: [payout_methods.added_date, payout_methods.payout_method_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payout_methods.payout_method_id]
          action_bindings:
            payout_methods.payout_method_id: payout_method_id
        temporal_basis:
          clock: frozen_time
          anchor_event: it was added
          anchor_source: payout_methods.added_date
          relation: not_after
          duration_source: variants.verification_deadline_days
          unit: calendar_days
          counting_rule: the days are counted from added_date, and verification on the last day stands.
          boundary: inclusive

extended_policies:
  - id: payout_ext_conversion_fee
    base_policy_refs: [payout_evt_transfer, payout_evt_returns_and_reactivation]
    overwrite:
      - base_policy: payout_evt_transfer
        superseded_clause: >-
          when the payout currency is not USD, cross_currency_fee_pct (cut to cross_currency_fee_cap_usd where above
          0.00) as a separate cross_currency_fee
        replaced_by: >-
          The percentage applied to a transfer is set by the method's conversion volume, the total of the transfers
          sent to the method less than conv_volume_window_months whole months before the settlement day, the transfer
          the fee belongs to included: a method paid in CAD or MXN whose conversion volume is at least
          conv_volume_tier_usd takes conv_rate_north_america_pct; a method paid in EUR or GBP whose conversion volume is
          at least conv_volume_tier_usd takes conv_rate_europe_pct; any other method takes the rail's
          cross_currency_fee_pct.
    trigger: state_due
    subject: [payout_fee_charged]
    computes: amount
    target_tool: book_conversion_fee_3c5b00cd
    params:
      conv_volume_window_months: 12
      conv_volume_tier_usd: 8000.00
      conv_rate_north_america_pct: 1.25
      conv_rate_europe_pct: 1.50
      conv_flat_below_usd: 250.00
      conv_flat_charge_usd: 4.00
      conv_minimum_below_usd: 1000.00
      conv_minimum_charge_usd: 9.00
      conv_superhost_long_months: 24
      conv_superhost_discount_long_pct: 25
      conv_superhost_discount_short_pct: 10
      conv_rewards_discount_top_pct: 10
      conv_rewards_discount_mid_pct: 5
      conv_method_long_months: 24
      conv_method_mid_months: 12
      conv_method_discount_long_pct: 10
      conv_method_discount_mid_pct: 5
      conv_tenure_long_months: 60
      conv_tenure_mid_months: 36
      conv_tenure_discount_long_pct: 15
      conv_tenure_discount_mid_pct: 8
    rule: >-
      A transfer to a payout method whose payout_currency is not USD carries one conversion fee, booked as a
      cross_currency_fee against that method and naming the transfer it belongs to; each conversion fee is computed on
      the amount of the transfer it names. The conversion fee falls due on the transfer's settlement day,
      processing_business_days business days on the business_day_calendar after the day the transfer was sent; it is
      booked on that day, once per transfer, and every count of months below runs to that settlement day. A transfer
      returned before it settles carries no conversion fee. The conversion fee is the rail's cross_currency_fee_pct of
      the transfer amount in USD, cut to cross_currency_fee_cap_usd where that cap is above 0.00, and rounded half up
      to the cent. The percentage applied to a transfer is set by the method's conversion volume, the total of the
      transfers sent to the method less than conv_volume_window_months whole months before the settlement day, the
      transfer the fee belongs to included: a method paid in CAD or MXN whose conversion volume is at least
      conv_volume_tier_usd takes conv_rate_north_america_pct; a method paid in EUR or GBP whose conversion volume is at
      least conv_volume_tier_usd takes conv_rate_europe_pct; any other method takes the rail's cross_currency_fee_pct.
      The cap is applied to the percentage charge alone. How the conversion charge is formed then follows the size of
      the transfer, because a percentage of a small conversion does not cover the cost of converting it: a transfer
      below conv_flat_below_usd is charged the flat conv_flat_charge_usd in place of the percentage charge; a transfer
      of at least conv_flat_below_usd and below conv_minimum_below_usd is charged the greater of the capped percentage
      charge and the minimum conv_minimum_charge_usd; a transfer of conv_minimum_below_usd or more is charged the
      capped percentage charge as it stands. Four loyalty discounts are combined by adding their percentages into one
      discount percentage, which is applied once to that conversion charge; the discounts never act one after another.
      The conversion fee's Superhost discount is conv_superhost_discount_long_pct for a host account whose tier is
      Superhost and whose superhost_since is at least conv_superhost_long_months whole months before the settlement
      day, conv_superhost_discount_short_pct for a Superhost account whose superhost_since is fewer months before it,
      and nothing for any other tier. The conversion fee's Rewards discount is conv_rewards_discount_top_pct when the
      host also holds an active Roamhaven Rewards membership at Rewards Platinum, Rewards Diamond or Rewards
      Ambassador, conv_rewards_discount_mid_pct when that active membership is at Rewards Silver or Rewards Gold, and
      nothing when the host holds no active membership or one at Rewards Member. The conversion fee's long-held method
      discount is conv_method_discount_long_pct when the method's added_date is at least conv_method_long_months whole
      months before the settlement day, conv_method_discount_mid_pct when it is at least conv_method_mid_months but
      fewer than conv_method_long_months whole months before it, and nothing for a newer method. The conversion fee's
      long-standing account discount is conv_tenure_discount_long_pct when the host account's opened_date is at least
      conv_tenure_long_months whole months before the settlement day, conv_tenure_discount_mid_pct when it is at least
      conv_tenure_mid_months but fewer than conv_tenure_long_months whole months before it, and nothing for a newer
      account. The percentage charge and the conversion charge are carried unrounded, and the discounted conversion
      fee is rounded half up to the cent once, at the end. Where the rail's cross_currency_fee_pct is 0.00, or the
      method is paid in USD, no conversion fee is owed at all.
    prerequisite: []
    cross_category:
      - category: host
        as: branch
        reads: [variant_name, superhost_since, opened_date]
        note: The Superhost discount reads the host account's tier and superhost_since; the long-standing account discount reads its opened_date.
      - category: rewards
        as: branch
        reads: [variant_name, status]
        note: The Rewards discount reads the tier of the host's own active Rewards membership as a guest.
    compute:
      - conv_amount: "LATEST('payout_transactions', 'amount', date_field='posted_date', event_type='payout_sent')"
      - conv_volume: "SUM('payout_transactions', 'amount', within_months=K('conv_volume_window_months'), date_field='posted_date', event_type='payout_sent')"
      - conv_paid_na: "F('payout_currency') == 'CAD' or F('payout_currency') == 'MXN'"
      - conv_paid_eu: "F('payout_currency') == 'EUR' or F('payout_currency') == 'GBP'"
      - conv_rate: "K('conv_rate_north_america_pct') if (conv_volume >= K('conv_volume_tier_usd') and conv_paid_na) else (K('conv_rate_europe_pct') if (conv_volume >= K('conv_volume_tier_usd') and conv_paid_eu) else P('cross_currency_fee_pct'))"
      - conv_pct_charge: "MN(conv_amount * conv_rate / 100, P('cross_currency_fee_cap_usd')) if P('cross_currency_fee_cap_usd') > 0 else conv_amount * conv_rate / 100"
      - conv_charge: "K('conv_flat_charge_usd') if conv_amount < K('conv_flat_below_usd') else (MX(conv_pct_charge, K('conv_minimum_charge_usd')) if conv_amount < K('conv_minimum_below_usd') else conv_pct_charge)"
      - conv_superhost_disc: "K('conv_superhost_discount_long_pct') if (CFIELD('host', 'variant_name') == 'Superhost' and MONTHS(CFIELD('host', 'superhost_since'), NOW) >= K('conv_superhost_long_months')) else (K('conv_superhost_discount_short_pct') if CFIELD('host', 'variant_name') == 'Superhost' else 0)"
      - conv_rewards_level: "CFIELD('rewards', 'variant_name', status='active')"
      - conv_rewards_disc: "K('conv_rewards_discount_top_pct') if (conv_rewards_level == 'Rewards Platinum' or conv_rewards_level == 'Rewards Diamond' or conv_rewards_level == 'Rewards Ambassador') else (K('conv_rewards_discount_mid_pct') if (conv_rewards_level == 'Rewards Silver' or conv_rewards_level == 'Rewards Gold') else 0)"
      - conv_method_months: "MONTHS(F('added_date'), NOW)"
      - conv_method_disc: "K('conv_method_discount_long_pct') if conv_method_months >= K('conv_method_long_months') else (K('conv_method_discount_mid_pct') if conv_method_months >= K('conv_method_mid_months') else 0)"
      - conv_tenure_months: "MONTHS(CFIELD('host', 'opened_date'), NOW)"
      - conv_tenure_disc: "K('conv_tenure_discount_long_pct') if conv_tenure_months >= K('conv_tenure_long_months') else (K('conv_tenure_discount_mid_pct') if conv_tenure_months >= K('conv_tenure_mid_months') else 0)"
      - conv_discounted: "conv_charge * (100 - conv_superhost_disc - conv_rewards_disc - conv_method_disc - conv_tenure_disc) / 100"
      - result: "RND(conv_discounted, 2) if (P('cross_currency_fee_pct') > 0 and F('payout_currency') != 'USD') else 0"
    compute_basis:
      conv_amount: "each conversion fee is computed on the amount of the transfer it names"
      conv_volume: "the total of the transfers sent to the method less than conv_volume_window_months whole months before the settlement day, the transfer the fee belongs to included"
      conv_rate: "a method paid in CAD or MXN whose conversion volume is at least conv_volume_tier_usd takes conv_rate_north_america_pct; a method paid in EUR or GBP whose conversion volume is at least conv_volume_tier_usd takes conv_rate_europe_pct; any other method takes the rail's cross_currency_fee_pct."
      conv_pct_charge: "The conversion fee is the rail's cross_currency_fee_pct of the transfer amount in USD, cut to cross_currency_fee_cap_usd where that cap is above 0.00, and rounded half up to the cent. The percentage applied to a transfer is set by the method's conversion volume"
      conv_charge: "a transfer below conv_flat_below_usd is charged the flat conv_flat_charge_usd in place of the percentage charge; a transfer of at least conv_flat_below_usd and below conv_minimum_below_usd is charged the greater of the capped percentage charge and the minimum conv_minimum_charge_usd; a transfer of conv_minimum_below_usd or more is charged the capped percentage charge as it stands."
      conv_superhost_disc: "The conversion fee's Superhost discount is conv_superhost_discount_long_pct for a host account whose tier is Superhost and whose superhost_since is at least conv_superhost_long_months whole months before the settlement day, conv_superhost_discount_short_pct for a Superhost account whose superhost_since is fewer months before it, and nothing for any other tier."
      conv_rewards_level: "when the host also holds an active Roamhaven Rewards membership"
      conv_rewards_disc: "The conversion fee's Rewards discount is conv_rewards_discount_top_pct when the host also holds an active Roamhaven Rewards membership at Rewards Platinum, Rewards Diamond or Rewards Ambassador, conv_rewards_discount_mid_pct when that active membership is at Rewards Silver or Rewards Gold, and nothing when the host holds no active membership or one at Rewards Member."
      conv_method_months: "when the method's added_date is at least conv_method_long_months whole months before the settlement day"
      conv_method_disc: "The conversion fee's long-held method discount is conv_method_discount_long_pct when the method's added_date is at least conv_method_long_months whole months before the settlement day, conv_method_discount_mid_pct when it is at least conv_method_mid_months but fewer than conv_method_long_months whole months before it, and nothing for a newer method."
      conv_tenure_months: "the host account's opened_date is at least conv_tenure_long_months whole months before the settlement day"
      conv_tenure_disc: "The conversion fee's long-standing account discount is conv_tenure_discount_long_pct when the host account's opened_date is at least conv_tenure_long_months whole months before the settlement day, conv_tenure_discount_mid_pct when it is at least conv_tenure_mid_months but fewer than conv_tenure_long_months whole months before it, and nothing for a newer account."
      conv_discounted: "Four loyalty discounts are combined by adding their percentages into one discount percentage, which is applied once to that conversion charge; the discounts never act one after another."
      result: "The percentage charge and the conversion charge are carried unrounded, and the discounted conversion fee is rounded half up to the cent once, at the end. Where the rail's cross_currency_fee_pct is 0.00, or the method is paid in USD, no conversion fee is owed at all."
    factors:
      - id: conv_volume_corridor_rate
        effect: parameter
        decides: conv_rate
        bindings: [conv_volume, conv_paid_na, conv_paid_eu, conv_rate]
        ladder:
          - when: "the method is paid in CAD or MXN and its conversion volume over the window is at least conv_volume_tier_usd"
            value: "K('conv_rate_north_america_pct')"
          - when: "the method is paid in EUR or GBP and its conversion volume over the window is at least conv_volume_tier_usd"
            value: "K('conv_rate_europe_pct')"
          - when: "otherwise"
            value: "P('cross_currency_fee_pct')"
        baseline:
          conv_rate: "P('cross_currency_fee_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: conv_charge_structure
        effect: method
        decides: conv_charge
        bindings: [conv_amount, conv_charge]
        ladder:
          - when: "the transfer the fee names is below conv_flat_below_usd"
            method: "a flat conv_flat_charge_usd replaces the percentage charge"
          - when: "the transfer is at least conv_flat_below_usd and below conv_minimum_below_usd"
            method: "the greater of the capped percentage charge and the minimum conv_minimum_charge_usd"
          - when: "otherwise (the transfer is conv_minimum_below_usd or more)"
            method: "the capped percentage charge as it stands"
        baseline:
          conv_charge: "conv_pct_charge"
        evidence: [history]
        cross_difficulty: null
      - id: conv_superhost_discount
        effect: parameter
        decides: conv_superhost_disc
        bindings: [conv_superhost_disc]
        ladder:
          - when: "the host account's tier is Superhost and its superhost_since is at least conv_superhost_long_months whole months before the settlement day"
            value: "K('conv_superhost_discount_long_pct')"
          - when: "the host account's tier is Superhost and its superhost_since is fewer than conv_superhost_long_months whole months before the settlement day"
            value: "K('conv_superhost_discount_short_pct')"
          - when: "otherwise (any other tier)"
            value: "0"
        baseline:
          conv_superhost_disc: "0"
        evidence: [cross_category, date]
        cross_difficulty: host
      - id: conv_rewards_discount
        effect: parameter
        decides: conv_rewards_disc
        bindings: [conv_rewards_level, conv_rewards_disc]
        ladder:
          - when: "the host's active Rewards membership is at Rewards Platinum, Rewards Diamond or Rewards Ambassador"
            value: "K('conv_rewards_discount_top_pct')"
          - when: "the host's active Rewards membership is at Rewards Silver or Rewards Gold"
            value: "K('conv_rewards_discount_mid_pct')"
          - when: "otherwise (no active membership, or one at Rewards Member)"
            value: "0"
        baseline:
          conv_rewards_disc: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: conv_long_held_method_discount
        effect: parameter
        decides: conv_method_disc
        bindings: [conv_method_months, conv_method_disc]
        ladder:
          - when: "the method's added_date is at least conv_method_long_months whole months before the settlement day"
            value: "K('conv_method_discount_long_pct')"
          - when: "the method's added_date is at least conv_method_mid_months but fewer than conv_method_long_months whole months before the settlement day"
            value: "K('conv_method_discount_mid_pct')"
          - when: "otherwise (a newer method)"
            value: "0"
        baseline:
          conv_method_disc: "0"
        evidence: [date]
        cross_difficulty: null
      - id: conv_account_tenure_discount
        effect: parameter
        decides: conv_tenure_disc
        bindings: [conv_tenure_months, conv_tenure_disc]
        ladder:
          - when: "the host account's opened_date is at least conv_tenure_long_months whole months before the settlement day"
            value: "K('conv_tenure_discount_long_pct')"
          - when: "it is at least conv_tenure_mid_months but fewer than conv_tenure_long_months whole months before the settlement day"
            value: "K('conv_tenure_discount_mid_pct')"
          - when: "otherwise (a newer account)"
            value: "0"
        baseline:
          conv_tenure_disc: "0"
        evidence: [cross_category, date]
        cross_difficulty: host
    baseline:
      rule: >-
        The conversion fee is the rail's cross_currency_fee_pct of the transfer amount in USD, cut to
        cross_currency_fee_cap_usd where that cap is above 0.00, and rounded half up to the cent.
      params: [cross_currency_fee_pct, cross_currency_fee_cap_usd]
    inputs:
      history:
        - {table: payout_transactions, aggregate: latest, field: amount, filters: {event_type: payout_sent}}
        - {table: payout_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: payout_sent}}
      cross_category: [host, rewards]
  - id: payout_ext_on_request_payout
    base_policy_refs: [payout_evt_transfer]
    overwrite:
      - base_policy: payout_evt_transfer
        superseded_clause: >-
          Released earnings and credits are transferred to their method after withholding and deductions
        replaced_by: >-
          An on-request payout pays the method's undisbursed balance, which is every release, returned transfer and
          credit booked to the method less every transfer, rail fee, withholding and deduction booked against it, less
          the parts it holds back, and it is rounded half up to the cent once, at the end.
    trigger: on_request
    subject: [payout_sent]
    computes: amount
    target_tool: send_on_request_payout_d225f921
    params:
      onreq_fresh_share_top_pct: 90
      onreq_fresh_share_mid_pct: 80
      onreq_fresh_share_std_pct: 60
      onreq_rating_top: 4.90
      onreq_rating_mid: 4.80
      onreq_stays_min: 12
      onreq_response_top_pct: 99.00
      onreq_response_mid_pct: 95.00
      onreq_response_bonus_top_pts: 10
      onreq_response_bonus_mid_pts: 4
      onreq_claim_share_top_pct: 100
      onreq_claim_share_mid_pct: 50
      onreq_claim_lookback_months: 24
      onreq_claims_frequent_count: 3
      onreq_claims_repeat_count: 2
      onreq_claim_mult_frequent: 0.60
      onreq_claim_mult_repeat: 0.80
      onreq_float_window_months: 12
      onreq_float_frequent_count: 12
      onreq_float_regular_count: 6
      onreq_float_regular_pct: 1.00
      onreq_float_std_usd: 50.00
    rule: >-
      A host may ask for an on-request payout of the undisbursed balance of an active payout method between scheduled
      runs; it is sent as one transfer to that method on the day it is asked for, and only when the host confirms it in person in the host app, and the amount the host confirms is the amount this rule gives. The base conditions for
      any transfer still apply: the method is active, the host account is not suspended, and the new-method period
      after the method's verified_date has passed. An on-request payout is fixed only after every conversion fee
      falling due on the method's transfers by the request date stands on the method's ledger. An on-request payout
      pays the method's undisbursed balance, which is every release, returned transfer and credit booked to the method
      less every transfer, rail fee, withholding and deduction booked against it, less the parts it holds back, and it
      is rounded half up to the cent once, at the end. It includes onreq_fresh_share_std_pct percent of the earnings
      released to the method on the request date, none of the claim reimbursements credited to the method on the
      request date, and it leaves a float of onreq_float_std_usd in the balance; whatever it does not include stays in
      the balance for the next scheduled run. The on-request share of fresh earnings is set by the host's most recent
      Superhost assessment: onreq_fresh_share_top_pct when its average rating is at least onreq_rating_top and its
      completed stays are at least onreq_stays_min; onreq_fresh_share_mid_pct when its average rating is at least
      onreq_rating_mid but below onreq_rating_top and its completed stays are at least onreq_stays_min;
      onreq_fresh_share_std_pct otherwise. The on-request responsiveness bonus raises that share by
      onreq_response_bonus_top_pts percentage points when the most recent Superhost assessment records a response rate
      of at least onreq_response_top_pct, by onreq_response_bonus_mid_pts points when it records at least
      onreq_response_mid_pct but less than onreq_response_top_pct, and by none otherwise. The on-request claim advance
      share is set by the level of the host's active HostCover plan: onreq_claim_share_top_pct at HostCover Premier,
      HostCover Elite or HostCover Estate; onreq_claim_share_mid_pct at HostCover Standard or HostCover Plus; none at
      HostCover Essential or with no active plan. The claim-history factor multiplies that claim advance share by
      onreq_claim_mult_frequent when the host's HostCover plans record onreq_claims_frequent_count or more
      reimbursements paid less than onreq_claim_lookback_months whole months before the request date, the one credited
      on the request date included; by onreq_claim_mult_repeat when they record exactly onreq_claims_repeat_count; and
      by one otherwise. The on-request float depends on how often the method is paid: for a method with at least
      onreq_float_frequent_count transfers sent less than onreq_float_window_months whole months before the request
      date, the float is the largest rail fee ever charged on the method; for a method with at least
      onreq_float_regular_count but fewer than onreq_float_frequent_count such transfers, the float is
      onreq_float_regular_pct percent of the balance less the fresh-earnings and claim holdbacks; for any other method the float is onreq_float_std_usd. The fresh-earnings holdback is the released
      earnings of the request date times the part of one hundred percent not covered by the share plus the bonus, the
      claim holdback is the claim reimbursements of the request date times the part of one hundred percent not covered
      by the claim advance share as multiplied, and both holdbacks and the float are subtracted from the balance
      unrounded; a payout that would come out below 0.00 is 0.00.
    prerequisite:
      - problem: payout_ext_conversion_fee
        kind: value_input
        gate: onreq_balance
        form: state
        policy_source: >-
          An on-request payout is fixed only after every conversion fee falling due on the method's transfers by the
          request date stands on the method's ledger.
        condition: >-
          Every payout_sent row of the method whose settlement day (processing_business_days business days after its
          posted_date) is on or before the request date, and which was not returned before that day, has a
          payout_fee_charged row with fee_type cross_currency_fee whose source_event_id names it — required only when
          the method's payout_currency is not USD and its rail's cross_currency_fee_pct is above 0.00; on any other
          method no conversion fee falls due and the condition holds as it stands.
        resolved_by: book_conversion_fee_3c5b00cd
        effect: >-
          Booking the conversion fee due on the request date takes that fee out of the method's undisbursed balance,
          so the balance the on-request payout pays from drops by the fee and the payout amount drops with it.
    cross_category:
      - category: host
        as: history
        reads: [host_account_events.average_rating, host_account_events.stays_12m, host_account_events.response_rate_pct]
        note: The fresh-earnings share and the responsiveness bonus read the host's most recent Superhost assessment.
      - category: protect
        as: history
        reads: [variant_name, status, protection_events.event_type]
        note: The claim advance share reads the active HostCover level; the claim-history factor counts reimbursements paid on the host's plans.
    compute:
      - onreq_balance_in: "SUM('payout_transactions', 'amount', event_type='payout_earnings_released') + SUM('payout_transactions', 'amount', event_type='payout_returned') + SUM('payout_transactions', 'amount', event_type='payout_adjustment_credited')"
      - onreq_balance_out: "SUM('payout_transactions', 'amount', event_type='payout_sent') + SUM('payout_transactions', 'amount', event_type='payout_fee_charged') + SUM('payout_transactions', 'amount', event_type='payout_tax_withheld') + SUM('payout_transactions', 'amount', event_type='payout_deduction_applied')"
      - onreq_balance: "onreq_balance_in - onreq_balance_out"
      - onreq_fresh: "SUM('payout_transactions', 'amount', event_type='payout_earnings_released', posted_date=NOW)"
      - onreq_claims_today: "SUM('payout_transactions', 'amount', event_type='payout_adjustment_credited', credit_type='claim_reimbursement', posted_date=NOW)"
      - onreq_rating: "XLATEST('host', 'host_account_events', 'average_rating', date_field='event_date', event_type='host_superhost_assessed') or 0"
      - onreq_stays: "XLATEST('host', 'host_account_events', 'stays_12m', date_field='event_date', event_type='host_superhost_assessed') or 0"
      - onreq_fresh_share: "K('onreq_fresh_share_top_pct') if (onreq_rating >= K('onreq_rating_top') and onreq_stays >= K('onreq_stays_min')) else (K('onreq_fresh_share_mid_pct') if (onreq_rating >= K('onreq_rating_mid') and onreq_rating < K('onreq_rating_top') and onreq_stays >= K('onreq_stays_min')) else K('onreq_fresh_share_std_pct'))"
      - onreq_response: "XLATEST('host', 'host_account_events', 'response_rate_pct', date_field='event_date', event_type='host_superhost_assessed') or 0"
      - onreq_response_bonus: "K('onreq_response_bonus_top_pts') if onreq_response >= K('onreq_response_top_pct') else (K('onreq_response_bonus_mid_pts') if onreq_response >= K('onreq_response_mid_pct') else 0)"
      - onreq_fresh_held: "onreq_fresh * (100 - onreq_fresh_share - onreq_response_bonus) / 100"
      - onreq_cover_level: "CFIELD('protect', 'variant_name', status='active')"
      - onreq_claim_share: "K('onreq_claim_share_top_pct') if (onreq_cover_level == 'HostCover Premier' or onreq_cover_level == 'HostCover Elite' or onreq_cover_level == 'HostCover Estate') else (K('onreq_claim_share_mid_pct') if (onreq_cover_level == 'HostCover Standard' or onreq_cover_level == 'HostCover Plus') else 0)"
      - onreq_paid_claims: "XCOUNT('protect', 'protection_events', within_months=K('onreq_claim_lookback_months'), date_field='posted_date', event_type='protect_reimbursement_paid')"
      - onreq_claim_mult: "K('onreq_claim_mult_frequent') if onreq_paid_claims >= K('onreq_claims_frequent_count') else (K('onreq_claim_mult_repeat') if onreq_paid_claims == K('onreq_claims_repeat_count') else 1)"
      - onreq_claim_held: "onreq_claims_today * (100 - onreq_claim_share * onreq_claim_mult) / 100"
      - onreq_pre_float: "onreq_balance - onreq_fresh_held - onreq_claim_held"
      - onreq_recent_transfers: "COUNT('payout_transactions', within_months=K('onreq_float_window_months'), date_field='posted_date', event_type='payout_sent')"
      - onreq_float: "MAX('payout_transactions', 'amount', event_type='payout_fee_charged') if onreq_recent_transfers >= K('onreq_float_frequent_count') else (onreq_pre_float * K('onreq_float_regular_pct') / 100 if onreq_recent_transfers >= K('onreq_float_regular_count') else K('onreq_float_std_usd'))"
      - result: "RND(MX(0, onreq_pre_float - onreq_float), 2)"
    compute_basis:
      onreq_balance_in: "every release, returned transfer and credit booked to the method"
      onreq_balance_out: "less every transfer, rail fee, withholding and deduction booked against it"
      onreq_balance: "An on-request payout pays the method's undisbursed balance, which is every release, returned transfer and credit booked to the method less every transfer, rail fee, withholding and deduction booked against it, less the parts it holds back, and it is rounded half up to the cent once, at the end."
      onreq_fresh: "the earnings released to the method on the request date"
      onreq_claims_today: "the claim reimbursements credited to the method on the request date"
      onreq_rating: "The on-request share of fresh earnings is set by the host's most recent Superhost assessment"
      onreq_stays: "its completed stays are at least onreq_stays_min"
      onreq_fresh_share: "onreq_fresh_share_top_pct when its average rating is at least onreq_rating_top and its completed stays are at least onreq_stays_min; onreq_fresh_share_mid_pct when its average rating is at least onreq_rating_mid but below onreq_rating_top and its completed stays are at least onreq_stays_min; onreq_fresh_share_std_pct otherwise."
      onreq_response: "when the most recent Superhost assessment records a response rate"
      onreq_response_bonus: "The on-request responsiveness bonus raises that share by onreq_response_bonus_top_pts percentage points when the most recent Superhost assessment records a response rate of at least onreq_response_top_pct, by onreq_response_bonus_mid_pts points when it records at least onreq_response_mid_pct but less than onreq_response_top_pct, and by none otherwise."
      onreq_fresh_held: "The fresh-earnings holdback is the released earnings of the request date times the part of one hundred percent not covered by the share plus the bonus"
      onreq_cover_level: "set by the level of the host's active HostCover plan"
      onreq_claim_share: "The on-request claim advance share is set by the level of the host's active HostCover plan: onreq_claim_share_top_pct at HostCover Premier, HostCover Elite or HostCover Estate; onreq_claim_share_mid_pct at HostCover Standard or HostCover Plus; none at HostCover Essential or with no active plan."
      onreq_paid_claims: "reimbursements paid less than onreq_claim_lookback_months whole months before the request date, the one credited on the request date included"
      onreq_claim_mult: "The claim-history factor multiplies that claim advance share by onreq_claim_mult_frequent when the host's HostCover plans record onreq_claims_frequent_count or more reimbursements paid less than onreq_claim_lookback_months whole months before the request date, the one credited on the request date included; by onreq_claim_mult_repeat when they record exactly onreq_claims_repeat_count; and by one otherwise."
      onreq_claim_held: "the claim holdback is the claim reimbursements of the request date times the part of one hundred percent not covered by the claim advance share as multiplied"
      onreq_pre_float: "both holdbacks and the float are subtracted from the balance unrounded"
      onreq_recent_transfers: "for a method with at least onreq_float_frequent_count transfers sent less than onreq_float_window_months whole months before the request date"
      onreq_float: "for a method with at least onreq_float_frequent_count transfers sent less than onreq_float_window_months whole months before the request date, the float is the largest rail fee ever charged on the method; for a method with at least onreq_float_regular_count but fewer than onreq_float_frequent_count such transfers, the float is onreq_float_regular_pct percent of the balance less the fresh-earnings and claim holdbacks; for any other method the float is onreq_float_std_usd."
      result: "a payout that would come out below 0.00 is 0.00."
    factors:
      - id: onreq_fresh_earnings_share
        effect: parameter
        decides: onreq_fresh_share
        bindings: [onreq_rating, onreq_stays, onreq_fresh_share]
        ladder:
          - when: "the most recent Superhost assessment has an average rating of at least onreq_rating_top and completed stays of at least onreq_stays_min"
            value: "K('onreq_fresh_share_top_pct')"
          - when: "the most recent Superhost assessment has an average rating of at least onreq_rating_mid but below onreq_rating_top and completed stays of at least onreq_stays_min"
            value: "K('onreq_fresh_share_mid_pct')"
          - when: "otherwise"
            value: "K('onreq_fresh_share_std_pct')"
        baseline:
          onreq_fresh_share: "K('onreq_fresh_share_std_pct')"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: onreq_responsiveness_bonus
        effect: parameter
        decides: onreq_response_bonus
        bindings: [onreq_response, onreq_response_bonus]
        ladder:
          - when: "the most recent Superhost assessment records a response rate of at least onreq_response_top_pct"
            value: "K('onreq_response_bonus_top_pts')"
          - when: "it records a response rate of at least onreq_response_mid_pct but less than onreq_response_top_pct"
            value: "K('onreq_response_bonus_mid_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          onreq_response_bonus: "0"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: onreq_claim_advance_share
        effect: parameter
        decides: onreq_claim_share
        bindings: [onreq_cover_level, onreq_claim_share]
        ladder:
          - when: "the host's active HostCover plan is at HostCover Premier, HostCover Elite or HostCover Estate"
            value: "K('onreq_claim_share_top_pct')"
          - when: "the host's active HostCover plan is at HostCover Standard or HostCover Plus"
            value: "K('onreq_claim_share_mid_pct')"
          - when: "otherwise (HostCover Essential, or no active plan)"
            value: "0"
        baseline:
          onreq_claim_share: "0"
        evidence: [cross_category]
        cross_difficulty: protect
      - id: onreq_claim_history
        effect: parameter
        decides: onreq_claim_mult
        bindings: [onreq_paid_claims, onreq_claim_mult]
        ladder:
          - when: "the host's HostCover plans record onreq_claims_frequent_count or more reimbursements paid in the lookback, the one of the request date included"
            value: "K('onreq_claim_mult_frequent')"
          - when: "they record exactly onreq_claims_repeat_count"
            value: "K('onreq_claim_mult_repeat')"
          - when: "otherwise"
            value: "1"
        baseline:
          onreq_claim_mult: "1"
        evidence: [cross_category, history]
        cross_difficulty: protect
      - id: onreq_float_rule
        effect: method
        decides: onreq_float
        bindings: [onreq_recent_transfers, onreq_float]
        ladder:
          - when: "the method had at least onreq_float_frequent_count transfers sent less than onreq_float_window_months whole months before the request date"
            method: "the float is the largest rail fee ever charged on the method"
          - when: "the method had at least onreq_float_regular_count but fewer than onreq_float_frequent_count such transfers"
            method: "the float is onreq_float_regular_pct percent of the balance less the fresh-earnings and claim holdbacks"
          - when: "otherwise"
            method: "the float is the flat onreq_float_std_usd"
        baseline:
          onreq_float: "K('onreq_float_std_usd')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        An on-request payout pays the method's undisbursed balance, which is every release, returned transfer and
        credit booked to the method less every transfer, rail fee, withholding and deduction booked against it, less
        the parts it holds back, and it is rounded half up to the cent once, at the end. It includes
        onreq_fresh_share_std_pct percent of the earnings released to the method on the request date, none of the claim
        reimbursements credited to the method on the request date, and it leaves a float of onreq_float_std_usd in the
        balance; whatever it does not include stays in the balance for the next scheduled run.
      params: [onreq_fresh_share_std_pct, onreq_float_std_usd]
    inputs:
      history:
        - {table: payout_transactions, aggregate: sum, field: amount, filters: {event_type: payout_earnings_released}}
        - {table: payout_transactions, aggregate: sum, field: amount, filters: {event_type: payout_sent}}
        - {table: payout_transactions, aggregate: count, field: payout_txn_id, within_months: 12, filters: {event_type: payout_sent}}
        - {table: payout_transactions, aggregate: max, field: amount, filters: {event_type: payout_fee_charged}}
        - {category: host, table: host_account_events, aggregate: latest, field: average_rating, filters: {event_type: host_superhost_assessed}}
        - {category: protect, table: protection_events, aggregate: count, field: protection_event_id, within_months: 24, filters: {event_type: protect_reimbursement_paid}}
      cross_category: [host, protect]
  - id: payout_ext_return_charge
    base_policy_refs: [payout_evt_transfer, payout_evt_returns_and_reactivation]
    overwrite:
      - base_policy: payout_evt_returns_and_reactivation
        superseded_clause: >-
          the rail's returned_payout_fee_usd (where above 0.00) is charged once as a returned_payout_fee
        replaced_by: >-
          The base of the return charge follows the reason the receiving bank gave for the latest return on the
          method: ret_base_closed_usd when the return reason is account_closed, ret_base_name_usd when it is
          name_mismatch, and the rail's returned_payout_fee_usd for any other reason.
    trigger: state_due
    subject: [payout_fee_charged]
    computes: amount
    target_tool: book_return_charge_692b7e7b
    params:
      ret_base_closed_usd: 20.00
      ret_base_name_usd: 30.00
      ret_lifting_min_usd: 5000.00
      ret_lifting_pct: 0.10
      ret_intermediary_min_usd: 1000.00
      ret_intermediary_flat_usd: 6.00
      ret_prompt_fast_days: 3
      ret_prompt_slow_days: 10
      ret_prompt_fast_credit_usd: 5.00
      ret_prompt_slow_credit_usd: 2.50
      ret_courtesy_top_pct: 0
      ret_courtesy_pro_pct: 50
    rule: >-
      A transfer that the receiving bank or rail sends back carries one return charge, booked as a returned_payout_fee
      against the method it was returned to and naming the return record; it falls due on the day of the return and is
      booked once per return, and it is worked out on the latest return on the method, the one it names; the returned
      amount is the amount that latest return booked back to the method. A rail whose returned_payout_fee_usd is 0.00
      carries no return charge at all, and a return charge that works out to 0.00 is not booked. The return charge is
      the rail's returned_payout_fee_usd, rounded half up to the cent. The base of the return charge follows the reason
      the receiving bank gave for the latest return on the method: ret_base_closed_usd when the return reason is
      account_closed, ret_base_name_usd when it is name_mismatch, and the rail's returned_payout_fee_usd for any other
      reason. The correspondent bank's handling of the returned funds is passed on according to the size of the
      return: a return of at least ret_lifting_min_usd carries a lifting charge of ret_lifting_pct percent of the
      returned amount; a return of at least ret_intermediary_min_usd and below ret_lifting_min_usd carries a flat
      correspondent charge of ret_intermediary_flat_usd; a smaller return carries no correspondent charge. A prompt
      re-verification credit is then taken off, counted in calendar days from the date of the return to the method's
      verified_date: ret_prompt_fast_credit_usd when the details were re-verified on the day of the return or at most
      ret_prompt_fast_days days after it, ret_prompt_slow_credit_usd when they were re-verified more than
      ret_prompt_fast_days but at most ret_prompt_slow_days days after it, and nothing when they were re-verified later,
      or not since the return; the base plus the correspondent charge less the credit is never below 0.00. The
      return-charge courtesy share is then applied to that amount, by the host account's tier: ret_courtesy_top_pct
      percent is charged to a Professional Host Plus or Enterprise Partner account, ret_courtesy_pro_pct percent to a
      Professional Host account, and the whole amount to any other tier. Nothing is carried rounded until the shared
      return charge, which is rounded half up to the cent once, at the end.
    prerequisite: []
    cross_category:
      - category: host
        as: branch
        reads: [variant_name]
        note: The courtesy share reads the host account's tier.
    compute:
      - ret_date: "LATEST('payout_transactions', 'posted_date', date_field='posted_date', event_type='payout_returned')"
      - ret_amount: "SUM('payout_transactions', 'amount', event_type='payout_returned', posted_date=ret_date)"
      - ret_reason: "LATEST('payout_transactions', 'return_reason', date_field='posted_date', event_type='payout_returned')"
      - ret_base: "K('ret_base_closed_usd') if ret_reason == 'account_closed' else (K('ret_base_name_usd') if ret_reason == 'name_mismatch' else P('returned_payout_fee_usd'))"
      - ret_correspondent: "ret_amount * K('ret_lifting_pct') / 100 if ret_amount >= K('ret_lifting_min_usd') else (K('ret_intermediary_flat_usd') if ret_amount >= K('ret_intermediary_min_usd') else 0)"
      - ret_reverify_days: "DAYS(ret_date, F('verified_date'))"
      - ret_prompt_credit: "K('ret_prompt_fast_credit_usd') if (ret_reverify_days >= 0 and ret_reverify_days <= K('ret_prompt_fast_days')) else (K('ret_prompt_slow_credit_usd') if (ret_reverify_days > K('ret_prompt_fast_days') and ret_reverify_days <= K('ret_prompt_slow_days')) else 0)"
      - ret_gross: "MX(0, ret_base + ret_correspondent - ret_prompt_credit)"
      - ret_tier: "CFIELD('host', 'variant_name')"
      - ret_share: "K('ret_courtesy_top_pct') if (ret_tier == 'Professional Host Plus' or ret_tier == 'Enterprise Partner') else (K('ret_courtesy_pro_pct') if ret_tier == 'Professional Host' else 100)"
      - ret_shared: "ret_gross * ret_share / 100"
      - result: "RND(ret_shared, 2) if P('returned_payout_fee_usd') > 0 else 0"
    compute_basis:
      ret_date: "counted in calendar days from the date of the return to the method's verified_date"
      ret_amount: "the returned amount is the amount that latest return booked back to the method"
      ret_reason: "the reason the receiving bank gave for the latest return on the method"
      ret_base: "ret_base_closed_usd when the return reason is account_closed, ret_base_name_usd when it is name_mismatch, and the rail's returned_payout_fee_usd for any other reason."
      ret_correspondent: "a return of at least ret_lifting_min_usd carries a lifting charge of ret_lifting_pct percent of the returned amount; a return of at least ret_intermediary_min_usd and below ret_lifting_min_usd carries a flat correspondent charge of ret_intermediary_flat_usd; a smaller return carries no correspondent charge."
      ret_reverify_days: "counted in calendar days from the date of the return to the method's verified_date"
      ret_prompt_credit: "ret_prompt_fast_credit_usd when the details were re-verified on the day of the return or at most ret_prompt_fast_days days after it, ret_prompt_slow_credit_usd when they were re-verified more than ret_prompt_fast_days but at most ret_prompt_slow_days days after it, and nothing when they were re-verified later, or not since the return"
      ret_gross: "the base plus the correspondent charge less the credit is never below 0.00."
      ret_tier: "by the host account's tier"
      ret_share: "ret_courtesy_top_pct percent is charged to a Professional Host Plus or Enterprise Partner account, ret_courtesy_pro_pct percent to a Professional Host account, and the whole amount to any other tier."
      ret_shared: "The return-charge courtesy share is then applied to that amount, by the host account's tier"
      result: "Nothing is carried rounded until the shared return charge, which is rounded half up to the cent once, at the end. A rail whose returned_payout_fee_usd is 0.00 carries no return charge at all, and a return charge that works out to 0.00 is not booked."
    factors:
      - id: ret_reason_base
        effect: parameter
        decides: ret_base
        bindings: [ret_reason, ret_base]
        ladder:
          - when: "the latest return on the method has return reason account_closed"
            value: "K('ret_base_closed_usd')"
          - when: "the latest return on the method has return reason name_mismatch"
            value: "K('ret_base_name_usd')"
          - when: "otherwise (invalid_account)"
            value: "P('returned_payout_fee_usd')"
        baseline:
          ret_base: "P('returned_payout_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: ret_correspondent_handling
        effect: method
        decides: ret_correspondent
        bindings: [ret_amount, ret_correspondent]
        ladder:
          - when: "the returned amount is at least ret_lifting_min_usd"
            method: "a lifting charge of ret_lifting_pct percent of the returned amount"
          - when: "the returned amount is at least ret_intermediary_min_usd and below ret_lifting_min_usd"
            method: "a flat correspondent charge of ret_intermediary_flat_usd"
          - when: "otherwise (a smaller return)"
            method: "no correspondent charge"
        baseline:
          ret_correspondent: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ret_prompt_reverification_credit
        effect: parameter
        decides: ret_prompt_credit
        bindings: [ret_date, ret_reverify_days, ret_prompt_credit]
        ladder:
          - when: "the method's verified_date is on the day of the latest return or at most ret_prompt_fast_days calendar days after it"
            value: "K('ret_prompt_fast_credit_usd')"
          - when: "the method's verified_date is more than ret_prompt_fast_days but at most ret_prompt_slow_days calendar days after the return"
            value: "K('ret_prompt_slow_credit_usd')"
          - when: "otherwise (re-verified later, or not since the return)"
            value: "0"
        baseline:
          ret_prompt_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: ret_segment_courtesy
        effect: parameter
        decides: ret_share
        bindings: [ret_tier, ret_share]
        ladder:
          - when: "the host account's tier is Professional Host Plus or Enterprise Partner"
            value: "K('ret_courtesy_top_pct')"
          - when: "the host account's tier is Professional Host"
            value: "K('ret_courtesy_pro_pct')"
          - when: "otherwise (any other tier)"
            value: "100"
        baseline:
          ret_share: "100"
        evidence: [cross_category]
        cross_difficulty: host
    baseline:
      rule: >-
        The return charge is the rail's returned_payout_fee_usd, rounded half up to the cent.
      params: [returned_payout_fee_usd]
    inputs:
      history:
        - {table: payout_transactions, aggregate: latest, field: posted_date, filters: {event_type: payout_returned}}
        - {table: payout_transactions, aggregate: sum, field: amount, filters: {event_type: payout_returned}}
        - {table: payout_transactions, aggregate: latest, field: return_reason, filters: {event_type: payout_returned}}
      cross_category: [host]
  - id: payout_ext_transfer_fee
    base_policy_refs: [payout_evt_transfer, payout_evt_returns_and_reactivation]
    overwrite:
      - base_policy: payout_evt_transfer
        superseded_clause: >-
          Each transfer is charged the rail's fee_pct of the transfer (cut to fee_cap_usd where a cap above 0.00
          applies) plus fee_fixed_usd as one transfer_fee
        replaced_by: >-
          The fixed part of the transfer fee is a share of the rail's fee_fixed_usd, set by how often the method is paid
          and by who holds the account: xfee_fixed_share_business_pct percent when the method received at least
          xfee_count_min transfers less than xfee_count_window_months whole months before the booking day and the host
          account carries a registered business_name, xfee_fixed_share_individual_pct percent when it received at least
          xfee_count_min such transfers and the host account carries no business_name, and the full fee_fixed_usd
          otherwise.
    trigger: state_due
    subject: [payout_fee_charged]
    computes: amount
    target_tool: book_transfer_fee_e67ff494
    params:
      xfee_count_window_months: 6
      xfee_count_min: 8
      xfee_fixed_share_business_pct: 60
      xfee_fixed_share_individual_pct: 80
      xfee_size_large_usd: 5000.00
      xfee_size_mid_usd: 2000.00
      xfee_surcharge_large_usd: 7.40
      xfee_surcharge_mid_usd: 3.20
      xfee_volume_window_months: 6
      xfee_volume_top_usd: 75000.00
      xfee_volume_mid_usd: 30000.00
      xfee_volume_top_pct: 25
      xfee_volume_mid_pct: 10
      xfee_cover_top_pct: 11
      xfee_cover_mid_pct: 5
      xfee_quick_return_days: 10
      xfee_trace_charge_usd: 12.00
    rule: >-
      Each transfer carries one transfer fee, booked as a transfer_fee against the method it was sent to and naming the
      transfer; each transfer fee is computed on the transfer it names. The transfer fee falls due on the transfer's settlement day, processing_business_days
      business days on the business_day_calendar after it was sent, or, for a transfer returned before it settles, on
      the day of the return; it is booked once per transfer, and a transfer fee that works out to 0.00 is not booked.
      The transfer fee is the rail's fee_pct of the transfer amount in USD, cut to fee_cap_usd where that cap is above
      0.00, plus the rail's fee_fixed_usd, rounded half up to the cent. The fixed part of the transfer fee is a share of
      the rail's fee_fixed_usd, set by how often the method is paid and by who holds the account:
      xfee_fixed_share_business_pct percent when the method received at least xfee_count_min transfers less than
      xfee_count_window_months whole months before the booking day and the host account carries a registered
      business_name, xfee_fixed_share_individual_pct percent when it received at least xfee_count_min such transfers and
      the host account carries no business_name, and the full fee_fixed_usd otherwise. On a rail whose fee_fixed_usd is
      above 0.00, a large-transfer surcharge is added: xfee_surcharge_large_usd for a transfer of at least
      xfee_size_large_usd, xfee_surcharge_mid_usd for a transfer of at least xfee_size_mid_usd and below
      xfee_size_large_usd, and nothing for a smaller transfer or on a rail with no fixed fee. Two discounts are combined
      by adding their percentages into one discount percentage, applied once to the percentage part plus the fixed part
      plus the surcharge; they never act one after another. The transfer fee's earnings-volume discount is
      xfee_volume_top_pct when the earnings released to the method less than xfee_volume_window_months whole months
      before the booking day total at least xfee_volume_top_usd, xfee_volume_mid_pct when they total at least
      xfee_volume_mid_usd but less than xfee_volume_top_usd, and nothing below that. The transfer fee's HostCover
      discount is xfee_cover_top_pct when the host's active HostCover plan is at HostCover Premier, HostCover Elite or
      HostCover Estate, xfee_cover_mid_pct at HostCover Standard or HostCover Plus, and nothing at HostCover Essential
      or with no active plan. What became of the transfer then decides how the discounted transfer fee is charged: a transfer returned at most
      xfee_quick_return_days calendar days after it was sent was rejected on arrival, and half of the discounted
      transfer fee is charged; a transfer returned later than that had to be traced and recalled through the
      correspondent banks, and the discounted transfer fee is charged in full with a trace charge of
      xfee_trace_charge_usd added to it; a transfer that settled is charged the discounted transfer fee as it stands.
      Nothing is rounded until that last step, which is rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: host
        as: branch
        reads: [business_name]
        note: The fixed-part share reads whether the host account carries a registered business name.
      - category: protect
        as: branch
        reads: [variant_name, status]
        note: The HostCover discount reads the level of the host's active HostCover plan.
    compute:
      - xfee_id: "LATEST('payout_transactions', 'payout_txn_id', date_field='posted_date', event_type='payout_sent')"
      - xfee_amount: "LATEST('payout_transactions', 'amount', date_field='posted_date', event_type='payout_sent')"
      - xfee_sent_date: "LATEST('payout_transactions', 'posted_date', date_field='posted_date', event_type='payout_sent')"
      - xfee_pct_part: "MN(xfee_amount * P('fee_pct') / 100, P('fee_cap_usd')) if P('fee_cap_usd') > 0 else xfee_amount * P('fee_pct') / 100"
      - xfee_count: "COUNT('payout_transactions', within_months=K('xfee_count_window_months'), date_field='posted_date', event_type='payout_sent')"
      - xfee_business: "(CFIELD('host', 'business_name') or '') != ''"
      - xfee_fixed_share: "K('xfee_fixed_share_business_pct') if (xfee_count >= K('xfee_count_min') and xfee_business) else (K('xfee_fixed_share_individual_pct') if (xfee_count >= K('xfee_count_min') and not xfee_business) else 100)"
      - xfee_fixed_part: "P('fee_fixed_usd') * xfee_fixed_share / 100"
      - xfee_surcharge: "K('xfee_surcharge_large_usd') if (P('fee_fixed_usd') > 0 and xfee_amount >= K('xfee_size_large_usd')) else (K('xfee_surcharge_mid_usd') if (P('fee_fixed_usd') > 0 and xfee_amount >= K('xfee_size_mid_usd')) else 0)"
      - xfee_volume: "SUM('payout_transactions', 'amount', within_months=K('xfee_volume_window_months'), date_field='posted_date', event_type='payout_earnings_released')"
      - xfee_volume_disc: "K('xfee_volume_top_pct') if xfee_volume >= K('xfee_volume_top_usd') else (K('xfee_volume_mid_pct') if xfee_volume >= K('xfee_volume_mid_usd') else 0)"
      - xfee_cover_level: "CFIELD('protect', 'variant_name', status='active')"
      - xfee_cover_disc: "K('xfee_cover_top_pct') if (xfee_cover_level == 'HostCover Premier' or xfee_cover_level == 'HostCover Elite' or xfee_cover_level == 'HostCover Estate') else (K('xfee_cover_mid_pct') if (xfee_cover_level == 'HostCover Standard' or xfee_cover_level == 'HostCover Plus') else 0)"
      - xfee_discounted: "(xfee_pct_part + xfee_fixed_part + xfee_surcharge) * (100 - xfee_volume_disc - xfee_cover_disc) / 100"
      - xfee_returned: "COUNT('payout_transactions', event_type='payout_returned', source_event_id=xfee_id)"
      - xfee_return_date: "LATEST('payout_transactions', 'posted_date', date_field='posted_date', event_type='payout_returned', source_event_id=xfee_id)"
      - xfee_outcome_fee: "xfee_discounted / 2 if (xfee_returned > 0 and DAYS(xfee_sent_date, xfee_return_date) <= K('xfee_quick_return_days')) else (xfee_discounted + K('xfee_trace_charge_usd') if xfee_returned > 0 else xfee_discounted)"
      - result: "RND(xfee_outcome_fee, 2)"
    compute_basis:
      xfee_id: "each transfer fee is computed on the transfer it names"
      xfee_amount: "each transfer fee is computed on the transfer it names"
      xfee_sent_date: "returned at most xfee_quick_return_days calendar days after it was sent"
      xfee_pct_part: "The transfer fee is the rail's fee_pct of the transfer amount in USD, cut to fee_cap_usd where that cap is above 0.00, plus the rail's fee_fixed_usd, rounded half up to the cent."
      xfee_count: "the method received at least xfee_count_min transfers less than xfee_count_window_months whole months before the booking day"
      xfee_business: "the host account carries a registered business_name"
      xfee_fixed_share: "xfee_fixed_share_business_pct percent when the method received at least xfee_count_min transfers less than xfee_count_window_months whole months before the booking day and the host account carries a registered business_name, xfee_fixed_share_individual_pct percent when it received at least xfee_count_min such transfers and the host account carries no business_name, and the full fee_fixed_usd otherwise."
      xfee_fixed_part: "The fixed part of the transfer fee is a share of the rail's fee_fixed_usd"
      xfee_surcharge: "On a rail whose fee_fixed_usd is above 0.00, a large-transfer surcharge is added: xfee_surcharge_large_usd for a transfer of at least xfee_size_large_usd, xfee_surcharge_mid_usd for a transfer of at least xfee_size_mid_usd and below xfee_size_large_usd, and nothing for a smaller transfer or on a rail with no fixed fee."
      xfee_volume: "the earnings released to the method less than xfee_volume_window_months whole months before the booking day"
      xfee_volume_disc: "The transfer fee's earnings-volume discount is xfee_volume_top_pct when the earnings released to the method less than xfee_volume_window_months whole months before the booking day total at least xfee_volume_top_usd, xfee_volume_mid_pct when they total at least xfee_volume_mid_usd but less than xfee_volume_top_usd, and nothing below that."
      xfee_cover_level: "the host's active HostCover plan"
      xfee_cover_disc: "The transfer fee's HostCover discount is xfee_cover_top_pct when the host's active HostCover plan is at HostCover Premier, HostCover Elite or HostCover Estate, xfee_cover_mid_pct at HostCover Standard or HostCover Plus, and nothing at HostCover Essential or with no active plan."
      xfee_discounted: "Two discounts are combined by adding their percentages into one discount percentage, applied once to the percentage part plus the fixed part plus the surcharge; they never act one after another."
      xfee_returned: "for a transfer returned before it settles"
      xfee_return_date: "a transfer returned at most xfee_quick_return_days calendar days after it was sent"
      xfee_outcome_fee: "a transfer returned at most xfee_quick_return_days calendar days after it was sent was rejected on arrival, and half of the discounted transfer fee is charged; a transfer returned later than that had to be traced and recalled through the correspondent banks, and the discounted transfer fee is charged in full with a trace charge of xfee_trace_charge_usd added to it; a transfer that settled is charged the discounted transfer fee as it stands."
      result: "Nothing is rounded until that last step, which is rounded half up to the cent."
    factors:
      - id: xfee_payout_frequency_share
        effect: parameter
        decides: xfee_fixed_share
        bindings: [xfee_count, xfee_business, xfee_fixed_share]
        ladder:
          - when: "the method received at least xfee_count_min transfers in the window and the host account carries a business_name"
            value: "K('xfee_fixed_share_business_pct')"
          - when: "the method received at least xfee_count_min transfers in the window and the host account carries no business_name"
            value: "K('xfee_fixed_share_individual_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          xfee_fixed_share: "100"
        evidence: [history, cross_category]
        cross_difficulty: host
      - id: xfee_large_transfer_surcharge
        effect: parameter
        decides: xfee_surcharge
        bindings: [xfee_amount, xfee_surcharge]
        ladder:
          - when: "the rail charges a fixed fee and the transfer is at least xfee_size_large_usd"
            value: "K('xfee_surcharge_large_usd')"
          - when: "the rail charges a fixed fee and the transfer is at least xfee_size_mid_usd and below xfee_size_large_usd"
            value: "K('xfee_surcharge_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          xfee_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: xfee_earnings_volume_discount
        effect: parameter
        decides: xfee_volume_disc
        bindings: [xfee_volume, xfee_volume_disc]
        ladder:
          - when: "earnings released to the method in the window total at least xfee_volume_top_usd"
            value: "K('xfee_volume_top_pct')"
          - when: "they total at least xfee_volume_mid_usd but less than xfee_volume_top_usd"
            value: "K('xfee_volume_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          xfee_volume_disc: "0"
        evidence: [history]
        cross_difficulty: null
      - id: xfee_hostcover_discount
        effect: parameter
        decides: xfee_cover_disc
        bindings: [xfee_cover_level, xfee_cover_disc]
        ladder:
          - when: "the host's active HostCover plan is at HostCover Premier, HostCover Elite or HostCover Estate"
            value: "K('xfee_cover_top_pct')"
          - when: "the host's active HostCover plan is at HostCover Standard or HostCover Plus"
            value: "K('xfee_cover_mid_pct')"
          - when: "otherwise (HostCover Essential, or no active plan)"
            value: "0"
        baseline:
          xfee_cover_disc: "0"
        evidence: [cross_category]
        cross_difficulty: protect
      - id: xfee_outcome_settlement
        effect: method
        decides: xfee_outcome_fee
        bindings: [xfee_id, xfee_sent_date, xfee_returned, xfee_return_date, xfee_outcome_fee]
        ladder:
          - when: "the transfer was returned at most xfee_quick_return_days calendar days after it was sent (rejected on arrival)"
            method: "half of the discounted transfer fee is charged"
          - when: "the transfer was returned more than xfee_quick_return_days calendar days after it was sent (traced and recalled)"
            method: "the discounted transfer fee in full plus a trace charge of xfee_trace_charge_usd"
          - when: "otherwise (the transfer settled)"
            method: "the discounted transfer fee as it stands"
        baseline:
          xfee_outcome_fee: "xfee_discounted"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The transfer fee is the rail's fee_pct of the transfer amount in USD, cut to fee_cap_usd where that cap is above
        0.00, plus the rail's fee_fixed_usd, rounded half up to the cent.
      params: [fee_pct, fee_cap_usd, fee_fixed_usd]
    inputs:
      history:
        - {table: payout_transactions, aggregate: latest, field: amount, filters: {event_type: payout_sent}}
        - {table: payout_transactions, aggregate: count, field: payout_txn_id, within_months: 6, filters: {event_type: payout_sent}}
        - {table: payout_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: payout_earnings_released}}
        - {table: payout_transactions, aggregate: count, field: payout_txn_id, filters: {event_type: payout_returned}}
      cross_category: [host, protect]
  - id: payout_ext_returned_resend
    base_policy_refs: [payout_evt_transfer, payout_evt_returns_and_reactivation]
    overwrite:
      - base_policy: payout_evt_returns_and_reactivation
        superseded_clause: >-
          On reactivation the held balance is transferred at the next run.
        replaced_by: >-
          Once a method on hold after a returned transfer has been reactivated, its held balance may be re-sent ahead of
          the next scheduled run; the re-send is one transfer to that method, made on the day it is asked for and only
          when the host confirms it in person in the host app, and the amount the host confirms is the amount this rule gives
      - base_policy: payout_evt_transfer
        superseded_clause: >-
          Released earnings and credits are transferred to their method after withholding and deductions
        replaced_by: >-
          A re-send pays out the held balance of the reactivated method — the releases, returned transfers and credits
          on its ledger less the transfers, rail fees, withholding and deductions on it — less a re-send float that stays
          for the next scheduled run, rounded half up to the cent once, at the end.
    trigger: on_request
    subject: [payout_sent]
    computes: amount
    target_tool: confirm_payout_resend_90576149
    params:
      resend_return_lookback_months: 24
      resend_returns_frequent_count: 2
      resend_reserve_frequent_pct: 40
      resend_reserve_repeat_pct: 20
      resend_cancel_window_months: 12
      resend_cancel_many_count: 2
      resend_reliability_many_pct: 6
      resend_reliability_one_pct: 3
      resend_quality_window_months: 3
      resend_quality_suspension_pct: 5
      resend_quality_warning_pct: 2
      resend_float_long_months: 48
      resend_float_mid_months: 24
      resend_float_mid_pct: 1.00
      resend_float_std_usd: 100.00
      resend_buffer_na_pct: 1.40
      resend_buffer_eu_pct: 1.00

    rule: >-
      Once a method on hold after a returned transfer has been reactivated, its held balance may be re-sent ahead of
      the next scheduled run; the re-send is one transfer to that method, made on the day it is asked for and only when
      the host confirms it in person in the host app, and the amount the host confirms is the amount this rule gives,
      and it names the return it re-sends. The base conditions for any transfer still apply: the method is active, the
      host account is not suspended, and the new-method period counted from the method's verified_date, which the
      re-verification after the return moved, has passed. A re-send is not made until the return charge for the
      returned transfer stands on the method's ledger. The re-send amount is fixed only after the returned transfer's
      own transfer fee stands on the method's ledger. A re-send pays out the held balance of the reactivated method —
      the releases, returned transfers and credits on its ledger less the transfers, rail fees, withholding and
      deductions on it — less a re-send float that stays for the next scheduled run, rounded half up to the cent once,
      at the end. The standard re-send float is resend_float_std_usd and nothing else is held back. Three holdback
      percentages, each taken on the held balance and added together into one percentage, keep part of it for the next
      scheduled run. The re-send return-history reserve counts the returned transfers on the method less than
      resend_return_lookback_months whole months before the re-send, the one being re-sent excluded:
      resend_reserve_frequent_pct percent when there are resend_returns_frequent_count or more such earlier returns,
      resend_reserve_repeat_pct percent when there is exactly one, and nothing when there is none. The re-send
      reliability holdback counts the host cancellations initiated by the host and recorded on the host account less
      than resend_cancel_window_months whole months before the re-send: resend_reliability_many_pct percent for
      resend_cancel_many_count or more, resend_reliability_one_pct percent for one, and nothing for none. The re-send
      listing-quality holdback looks at the quality assessments of the host's listings dated less than
      resend_quality_window_months whole months before the re-send: resend_quality_suspension_pct percent when any of
      them has the outcome suspension, resend_quality_warning_pct percent when none is a suspension but any has the
      outcome warning, and nothing otherwise. The re-send conversion buffer keeps back part of the amount the returned transfer booked back to the method, to cover the movement of the conversion rate between the return and the settlement of the re-send: resend_buffer_na_pct percent of that returned amount when the method is paid in MXN or CAD, resend_buffer_eu_pct percent when it is paid in GBP or EUR, and nothing when it is paid in USD. The re-send float depends on how long the method has been on file,
      counted in whole months from its added_date: for a method on file at least resend_float_long_months months the
      float is the largest rail fee ever charged on the method; for one on file at least resend_float_mid_months but
      fewer than resend_float_long_months months it is resend_float_mid_pct percent of the held balance less the holdbacks and the conversion buffer; for a newer method it is resend_float_std_usd. The holdbacks, the conversion buffer and the float are subtracted unrounded, and a re-send that would come out below 0.00 is 0.00.
    prerequisite:
      - problem: payout_ext_return_charge
        kind: value_input
        gate: resend_balance
        form: state
        policy_source: >-
          A re-send is not made until the return charge for the returned transfer stands on the method's ledger.
        condition: >-
          The payout_returned row being re-sent has a payout_fee_charged row with fee_type returned_payout_fee whose
          source_event_id names it, on a rail whose returned_payout_fee_usd is above 0.00 and when that charge works out
          above 0.00.
        resolved_by: book_return_charge_692b7e7b
        effect: >-
          Booking the return charge takes it out of the held balance, so the balance the re-send pays drops by the
          charge and the re-send amount drops with it.
      - problem: payout_ext_transfer_fee
        kind: value_input
        gate: resend_balance
        form: state
        policy_source: >-
          The re-send amount is fixed only after the returned transfer's own transfer fee stands on the method's ledger.
        condition: >-
          The payout_sent row that was returned has a payout_fee_charged row with fee_type transfer_fee whose
          source_event_id names it, when that fee works out above 0.00.
        resolved_by: book_transfer_fee_e67ff494
        effect: >-
          Booking the returned transfer's own transfer fee takes it out of the held balance, so the re-send amount
          drops by the holdback-adjusted share of that fee.
    cross_category:
      - category: host
        as: history
        reads: [host_account_events.event_type, host_account_events.initiated_by]
        note: The reliability holdback counts the host-initiated cancellations recorded on the host account.
      - category: listing
        as: history
        reads: [listing_events.event_type, listing_events.quality_outcome]
        note: The listing-quality holdback reads the outcomes of the recent quality assessments of the host's listings.
    compute:
      - resend_balance_in: "SUM('payout_transactions', 'amount', event_type='payout_earnings_released') + SUM('payout_transactions', 'amount', event_type='payout_returned') + SUM('payout_transactions', 'amount', event_type='payout_adjustment_credited')"
      - resend_balance_out: "SUM('payout_transactions', 'amount', event_type='payout_sent') + SUM('payout_transactions', 'amount', event_type='payout_fee_charged') + SUM('payout_transactions', 'amount', event_type='payout_tax_withheld') + SUM('payout_transactions', 'amount', event_type='payout_deduction_applied')"
      - resend_balance: "resend_balance_in - resend_balance_out"
      - resend_returns: "COUNT('payout_transactions', within_months=K('resend_return_lookback_months'), date_field='posted_date', event_type='payout_returned')"
      - resend_reserve_pct: "K('resend_reserve_frequent_pct') if resend_returns - 1 >= K('resend_returns_frequent_count') else (K('resend_reserve_repeat_pct') if resend_returns - 1 == 1 else 0)"
      - resend_cancels: "XCOUNT('host', 'host_account_events', within_months=K('resend_cancel_window_months'), date_field='event_date', event_type='host_cancellation_recorded', initiated_by='host')"
      - resend_reliability_pct: "K('resend_reliability_many_pct') if resend_cancels >= K('resend_cancel_many_count') else (K('resend_reliability_one_pct') if resend_cancels == 1 else 0)"
      - resend_warnings: "XCOUNT('listing', 'listing_events', within_months=K('resend_quality_window_months'), date_field='event_date', event_type='listing_quality_reviewed', quality_outcome='warning')"
      - resend_suspensions: "XCOUNT('listing', 'listing_events', within_months=K('resend_quality_window_months'), date_field='event_date', event_type='listing_quality_reviewed', quality_outcome='suspension')"
      - resend_quality_pct: "K('resend_quality_suspension_pct') if resend_suspensions > 0 else (K('resend_quality_warning_pct') if resend_warnings > 0 else 0)"
      - resend_held_back: "resend_balance * (resend_reserve_pct + resend_reliability_pct + resend_quality_pct) / 100"
      - resend_last_return: "LATEST('payout_transactions', 'posted_date', date_field='posted_date', event_type='payout_returned')"
      - resend_returned_amt: "SUM('payout_transactions', 'amount', event_type='payout_returned', posted_date=resend_last_return)"
      - resend_paid_na: "F('payout_currency') == 'MXN' or F('payout_currency') == 'CAD'"
      - resend_paid_eu: "F('payout_currency') == 'GBP' or F('payout_currency') == 'EUR'"
      - resend_buffer_pct: "K('resend_buffer_na_pct') if resend_paid_na else (K('resend_buffer_eu_pct') if resend_paid_eu else 0)"
      - resend_buffer: "resend_returned_amt * resend_buffer_pct / 100"
      - resend_pre_float: "resend_balance - resend_held_back - resend_buffer"
      - resend_method_months: "MONTHS(F('added_date'), NOW)"
      - resend_float: "MAX('payout_transactions', 'amount', event_type='payout_fee_charged') if resend_method_months >= K('resend_float_long_months') else (resend_pre_float * K('resend_float_mid_pct') / 100 if resend_method_months >= K('resend_float_mid_months') else K('resend_float_std_usd'))"
      - result: "RND(MX(0, resend_pre_float - resend_float), 2)"
    compute_basis:
      resend_balance_in: "the releases, returned transfers and credits on its ledger"
      resend_balance_out: "less the transfers, rail fees, withholding and deductions on it"
      resend_balance: "A re-send pays out the held balance of the reactivated method — the releases, returned transfers and credits on its ledger less the transfers, rail fees, withholding and deductions on it — less a re-send float that stays for the next scheduled run, rounded half up to the cent once, at the end."
      resend_returns: "The re-send return-history reserve counts the returned transfers on the method less than resend_return_lookback_months whole months before the re-send, the one being re-sent excluded"
      resend_reserve_pct: "resend_reserve_frequent_pct percent when there are resend_returns_frequent_count or more such earlier returns, resend_reserve_repeat_pct percent when there is exactly one, and nothing when there is none."
      resend_cancels: "The re-send reliability holdback counts the host cancellations initiated by the host and recorded on the host account less than resend_cancel_window_months whole months before the re-send"
      resend_reliability_pct: "resend_reliability_many_pct percent for resend_cancel_many_count or more, resend_reliability_one_pct percent for one, and nothing for none."
      resend_warnings: "The re-send listing-quality holdback looks at the quality assessments of the host's listings dated less than resend_quality_window_months whole months before the re-send"
      resend_suspensions: "The re-send listing-quality holdback looks at the quality assessments of the host's listings dated less than resend_quality_window_months whole months before the re-send"
      resend_quality_pct: "resend_quality_suspension_pct percent when any of them has the outcome suspension, resend_quality_warning_pct percent when none is a suspension but any has the outcome warning, and nothing otherwise."
      resend_held_back: "Three holdback percentages, each taken on the held balance and added together into one percentage, keep part of it for the next scheduled run."
      resend_pre_float: "The holdbacks, the conversion buffer and the float are subtracted unrounded"
      resend_last_return: "the amount the returned transfer booked back to the method"
      resend_returned_amt: "the amount the returned transfer booked back to the method"
      resend_buffer_pct: "resend_buffer_na_pct percent of that returned amount when the method is paid in MXN or CAD, resend_buffer_eu_pct percent when it is paid in GBP or EUR, and nothing when it is paid in USD."
      resend_buffer: "The re-send conversion buffer keeps back part of the amount the returned transfer booked back to the method"
      resend_method_months: "counted in whole months from its added_date"
      resend_float: "for a method on file at least resend_float_long_months months the float is the largest rail fee ever charged on the method; for one on file at least resend_float_mid_months but fewer than resend_float_long_months months it is resend_float_mid_pct percent of the held balance less the holdbacks and the conversion buffer; for a newer method it is resend_float_std_usd."
      result: "a re-send that would come out below 0.00 is 0.00."
    factors:
      - id: resend_return_history_reserve
        effect: parameter
        decides: resend_reserve_pct
        bindings: [resend_returns, resend_reserve_pct]
        ladder:
          - when: "resend_returns_frequent_count or more earlier returns on the method in the lookback"
            value: "K('resend_reserve_frequent_pct')"
          - when: "exactly one earlier return on the method in the lookback"
            value: "K('resend_reserve_repeat_pct')"
          - when: "otherwise (no earlier return)"
            value: "0"
        baseline:
          resend_reserve_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: resend_reliability_holdback
        effect: parameter
        decides: resend_reliability_pct
        bindings: [resend_cancels, resend_reliability_pct]
        ladder:
          - when: "resend_cancel_many_count or more host-initiated cancellations recorded in the window"
            value: "K('resend_reliability_many_pct')"
          - when: "exactly one host-initiated cancellation recorded in the window"
            value: "K('resend_reliability_one_pct')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          resend_reliability_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: resend_listing_quality_holdback
        effect: parameter
        decides: resend_quality_pct
        bindings: [resend_warnings, resend_suspensions, resend_quality_pct]
        ladder:
          - when: "a quality assessment of any of the host's listings in the window has the outcome suspension"
            value: "K('resend_quality_suspension_pct')"
          - when: "none has the outcome suspension but one or more has the outcome warning"
            value: "K('resend_quality_warning_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          resend_quality_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: listing
      - id: resend_conversion_buffer
        effect: parameter
        decides: resend_buffer_pct
        bindings: [resend_last_return, resend_returned_amt, resend_paid_na, resend_paid_eu, resend_buffer_pct]
        ladder:
          - when: "the method is paid in MXN or CAD"
            value: "K('resend_buffer_na_pct')"
          - when: "the method is paid in GBP or EUR"
            value: "K('resend_buffer_eu_pct')"
          - when: "otherwise (the method is paid in USD)"
            value: "0"
        baseline:
          resend_buffer_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: resend_float_rule
        effect: method
        decides: resend_float
        bindings: [resend_method_months, resend_float]
        ladder:
          - when: "the method has been on file at least resend_float_long_months whole months"
            method: "the float is the largest rail fee ever charged on the method"
          - when: "the method has been on file at least resend_float_mid_months but fewer than resend_float_long_months whole months"
            method: "the float is resend_float_mid_pct percent of the held balance less the holdbacks and the conversion buffer"
          - when: "otherwise"
            method: "the float is the flat resend_float_std_usd"
        baseline:
          resend_float: "K('resend_float_std_usd')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A re-send pays out the held balance of the reactivated method — the releases, returned transfers and credits on
        its ledger less the transfers, rail fees, withholding and deductions on it — less a re-send float that stays for
        the next scheduled run, rounded half up to the cent once, at the end. The standard re-send float is
        resend_float_std_usd and nothing else is held back.
      params: [resend_float_std_usd]
    inputs:
      history:
        - {table: payout_transactions, aggregate: sum, field: amount, filters: {event_type: payout_earnings_released}}
        - {table: payout_transactions, aggregate: count, field: payout_txn_id, within_months: 24, filters: {event_type: payout_returned}}
        - {table: payout_transactions, aggregate: max, field: amount, filters: {event_type: payout_fee_charged}}
        - {category: host, table: host_account_events, aggregate: count, field: host_event_id, within_months: 12, filters: {event_type: host_cancellation_recorded, initiated_by: host}}
        - {category: listing, table: listing_events, aggregate: count, field: listing_event_id, within_months: 3, filters: {event_type: listing_quality_reviewed}}
      cross_category: [host, listing]
