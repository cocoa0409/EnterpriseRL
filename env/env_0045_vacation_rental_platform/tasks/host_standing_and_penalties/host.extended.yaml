- id: host_ext_professional_plus_enrollment
  base_policy_refs:
  - host_tier_assignment
  overwrite:
  - base_policy: host_tier_assignment
    superseded_clause: Professional Host Plus for an account with at least professional_plus_min_live_listings live listings
      and an average guest rating of at least professional_plus_min_avg_rating
    replaced_by: An enrollment places the account in Professional Host Plus when its live-listing count is at least professional_plus_min_live_listings
      and its listing rating is at least professional_plus_min_avg_rating; otherwise the account stays a Professional Host.
  - base_policy: host_tier_assignment
    superseded_clause: The tier of a host account is decided in this order of precedence, the first that applies winning
    replaced_by: The tier of a host account follows the order of precedence of the tier assignment, except that a Professional
      Host account moves into Professional Host Plus only when the host enrolls it in person, because the move carries the
      programme's service commitments; the enrollment places it in the tier its records qualify it for, and Enterprise Partner
      is never reached by an enrollment.
  trigger: on_request
  subject:
  - host_tier_updated
  computes: variant_name
  target_tool: enroll_professional_tier_a874e389
  params:
    long_tenure_months: 60
    mid_tenure_months: 36
    rating_window_long_months: 9
    rating_window_mid_months: 6
    rating_window_standard_months: 3
    not_assessed_weight_clean: 0.0
    not_assessed_weight_warned: 0.5
    not_assessed_weight_standard: 1.0
    new_listing_count_recent: 2
  rule: 'The tier of a host account follows the order of precedence of the tier assignment, except that a Professional Host
    account moves into Professional Host Plus only when the host enrolls it in person, because the move carries the programme''s
    service commitments; the enrollment places it in the tier its records qualify it for, and Enterprise Partner is never
    reached by an enrollment. An enrollment places the account in Professional Host Plus when its live-listing count is
    at least professional_plus_min_live_listings and its listing rating is at least professional_plus_min_avg_rating; otherwise
    the account stays a Professional Host. The standard live-listing count is the number of the account''s listings that
    are listed or snoozed, and the standard listing rating is the average of every rating recorded at the account''s listing
    quality assessments dated within the rating_window_standard_months months before the enrollment, each rating counted
    once, rounded half up to 2 decimal places. A window of a number of months holds the records dated fewer than that many
    whole calendar months before the date of the enrollment, and a round is the set of listing quality assessments dated
    in the same calendar quarter. The live-listing count of an enrollment is worked out by one of three methods: for an
    account with registration-suspended listings whose reinstatement requests are submitted and still undecided, it is the
    listed and snoozed listings plus one listing for each such request; for any other account whose restricted until date
    falls within the 12 months before the enrollment, it is the listed listings only; for every other account it is the
    standard live-listing count. The listing rating covers the listing quality assessments dated within rating_window_long_months
    months before the enrollment for an account opened at least long_tenure_months whole calendar months before it, within
    rating_window_mid_months months for an account opened at least mid_tenure_months but fewer than long_tenure_months whole
    months before it, and within the standard rating_window_standard_months months otherwise. In the listing rating each
    rating recorded at an assessment whose outcome is not_assessed counts with weight not_assessed_weight_clean for an account
    none of whose listing quality assessments dated within the 12 months before the enrollment had a warning or suspension
    outcome, with weight not_assessed_weight_warned for an account with at least one warning outcome but no suspension outcome
    in those 12 months, and with the standard weight not_assessed_weight_standard otherwise; every other rating counts with
    weight 1. The listing rating is aggregated by one of three methods: for an account with at least new_listing_count_recent
    listed listings first listed within the rating''s window, the weighted average of each round in the window is taken
    on its own and the rounds'' averages are averaged, a round with no weighted rating being left out; for an account with
    exactly one such listing, it is the weighted average of the latest round in the window alone; for every other account
    every weighted rating in the window is averaged together. The listing rating is rounded half up to 2 decimal places
    only at the end.'
  prerequisite: []
  cross_category:
  - category: listing
    as: history
    reads:
    - listings.status
    - listings.first_listed_date
    - listing_events.average_rating
    - listing_events.quality_outcome
    - listing_events.event_date
    - listing_reinstatement_requests.request_status
    - listing_reinstatement_requests.suspension_reason
    note: Every factor of the enrollment reads the host's own listings, their quality assessments or their reinstatement
      requests.
  compute:
  - listed_count: XCOUNT('listing', 'listings', status='listed')
  - snoozed_count: XCOUNT('listing', 'listings', status='snoozed')
  - live_count_std: listed_count + snoozed_count
  - pending_reinstatements: XCOUNT('listing', 'listing_reinstatement_requests', request_status='submitted', suspension_reason='registration')
  - live_count: live_count_std + pending_reinstatements if pending_reinstatements >= 1 else (listed_count if (F('restricted_until')
      and MONTHS(F('restricted_until'), NOW) >= 0 and MONTHS(F('restricted_until'), NOW) < 12) else live_count_std)
  - account_months: MONTHS(F('opened_date'), NOW)
  - rating_window: K('rating_window_long_months') if account_months >= K('long_tenure_months') else (K('rating_window_mid_months')
      if account_months >= K('mid_tenure_months') else K('rating_window_standard_months'))
  - warnings_12m: XCOUNT('listing', 'listing_events', within_months=12, event_type='listing_quality_reviewed', quality_outcome='warning')
  - suspensions_12m: XCOUNT('listing', 'listing_events', within_months=12, event_type='listing_quality_reviewed', quality_outcome='suspension')
  - na_weight: K('not_assessed_weight_clean') if (warnings_12m == 0 and suspensions_12m == 0) else (K('not_assessed_weight_warned')
      if (warnings_12m >= 1 and suspensions_12m == 0) else K('not_assessed_weight_standard'))
  - rated_sum_3m: XSUM('listing', 'listing_events', 'average_rating', within_months=3, event_type='listing_quality_reviewed',
      quality_outcome='pass') + XSUM('listing', 'listing_events', 'average_rating', within_months=3, event_type='listing_quality_reviewed',
      quality_outcome='warning')
  - rated_count_3m: XCOUNT('listing', 'listing_events', within_months=3, event_type='listing_quality_reviewed', quality_outcome='pass')
      + XCOUNT('listing', 'listing_events', within_months=3, event_type='listing_quality_reviewed', quality_outcome='warning')
  - na_sum_3m: XSUM('listing', 'listing_events', 'average_rating', within_months=3, event_type='listing_quality_reviewed',
      quality_outcome='not_assessed')
  - na_count_3m: XCOUNT('listing', 'listing_events', within_months=3, event_type='listing_quality_reviewed', quality_outcome='not_assessed')
  - rated_sum_6m: XSUM('listing', 'listing_events', 'average_rating', within_months=6, event_type='listing_quality_reviewed',
      quality_outcome='pass') + XSUM('listing', 'listing_events', 'average_rating', within_months=6, event_type='listing_quality_reviewed',
      quality_outcome='warning')
  - rated_count_6m: XCOUNT('listing', 'listing_events', within_months=6, event_type='listing_quality_reviewed', quality_outcome='pass')
      + XCOUNT('listing', 'listing_events', within_months=6, event_type='listing_quality_reviewed', quality_outcome='warning')
  - na_sum_6m: XSUM('listing', 'listing_events', 'average_rating', within_months=6, event_type='listing_quality_reviewed',
      quality_outcome='not_assessed')
  - na_count_6m: XCOUNT('listing', 'listing_events', within_months=6, event_type='listing_quality_reviewed', quality_outcome='not_assessed')
  - rated_sum_9m: XSUM('listing', 'listing_events', 'average_rating', within_months=9, event_type='listing_quality_reviewed',
      quality_outcome='pass') + XSUM('listing', 'listing_events', 'average_rating', within_months=9, event_type='listing_quality_reviewed',
      quality_outcome='warning')
  - rated_count_9m: XCOUNT('listing', 'listing_events', within_months=9, event_type='listing_quality_reviewed', quality_outcome='pass')
      + XCOUNT('listing', 'listing_events', within_months=9, event_type='listing_quality_reviewed', quality_outcome='warning')
  - na_sum_9m: XSUM('listing', 'listing_events', 'average_rating', within_months=9, event_type='listing_quality_reviewed',
      quality_outcome='not_assessed')
  - na_count_9m: XCOUNT('listing', 'listing_events', within_months=9, event_type='listing_quality_reviewed', quality_outcome='not_assessed')
  - round1_num: rated_sum_3m + na_weight * na_sum_3m
  - round1_den: rated_count_3m + na_weight * na_count_3m
  - round2_num: (rated_sum_6m - rated_sum_3m) + na_weight * (na_sum_6m - na_sum_3m)
  - round2_den: (rated_count_6m - rated_count_3m) + na_weight * (na_count_6m - na_count_3m)
  - round3_num: (rated_sum_9m - rated_sum_6m) + na_weight * (na_sum_9m - na_sum_6m)
  - round3_den: (rated_count_9m - rated_count_6m) + na_weight * (na_count_9m - na_count_6m)
  - use_round2: rating_window >= 6 and round2_den > 0
  - use_round3: rating_window >= 9 and round3_den > 0
  - pooled_rating: (round1_num + (round2_num if rating_window >= 6 else 0) + (round3_num if rating_window >= 9 else 0))
      / MX(0.000001, round1_den + (round2_den if rating_window >= 6 else 0) + (round3_den if rating_window >= 9 else 0))
  - per_round_rating: ((round1_num / round1_den if round1_den > 0 else 0) + (round2_num / round2_den if use_round2 else
      0) + (round3_num / round3_den if use_round3 else 0)) / MX(1, (1 if round1_den > 0 else 0) + (1 if use_round2 else
      0) + (1 if use_round3 else 0))
  - latest_round_rating: round1_num / round1_den if round1_den > 0 else 0
  - new_in_window: XCOUNT('listing', 'listings', within_months=rating_window, date_field='first_listed_date', status='listed')
  - listing_rating: RND(per_round_rating, 2) if new_in_window >= K('new_listing_count_recent') else (RND(latest_round_rating,
      2) if new_in_window == 1 else RND(pooled_rating, 2))
  - qualifies_plus: live_count >= P('professional_plus_min_live_listings') and listing_rating >= P('professional_plus_min_avg_rating')
  - result: '''Professional Host Plus'' if qualifies_plus else ''Professional Host'''
  compute_basis:
    listed_count: for any other account whose restricted until date falls within the 12 months before the enrollment, it
      is the listed listings only
    snoozed_count: The standard live-listing count is the number of the account's listings that are listed or snoozed
    live_count_std: The standard live-listing count is the number of the account's listings that are listed or snoozed
    pending_reinstatements: for an account with registration-suspended listings whose reinstatement requests are submitted
      and still undecided, it is the listed and snoozed listings plus one listing for each such request
    live_count: 'The live-listing count of an enrollment is worked out by one of three methods: for an account with registration-suspended
      listings whose reinstatement requests are submitted and still undecided, it is the listed and snoozed listings plus
      one listing for each such request; for any other account whose restricted until date falls within the 12 months before
      the enrollment, it is the listed listings only; for every other account it is the standard live-listing count.'
    account_months: for an account opened at least long_tenure_months whole calendar months before it
    rating_window: The listing rating covers the listing quality assessments dated within rating_window_long_months months
      before the enrollment for an account opened at least long_tenure_months whole calendar months before it, within rating_window_mid_months
      months for an account opened at least mid_tenure_months but fewer than long_tenure_months whole months before it,
      and within the standard rating_window_standard_months months otherwise.
    warnings_12m: for an account none of whose listing quality assessments dated within the 12 months before the enrollment
      had a warning or suspension outcome
    suspensions_12m: with at least one warning outcome but no suspension outcome in those 12 months
    na_weight: In the listing rating each rating recorded at an assessment whose outcome is not_assessed counts with weight
      not_assessed_weight_clean for an account none of whose listing quality assessments dated within the 12 months before
      the enrollment had a warning or suspension outcome, with weight not_assessed_weight_warned for an account with at
      least one warning outcome but no suspension outcome in those 12 months, and with the standard weight not_assessed_weight_standard
      otherwise; every other rating counts with weight 1.
    rated_sum_3m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    rated_count_3m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    na_sum_3m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    na_count_3m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    rated_sum_6m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    rated_count_6m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    na_sum_6m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    na_count_6m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    rated_sum_9m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    rated_count_9m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    na_sum_9m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    na_count_9m: A window of a number of months holds the records dated fewer than that many whole calendar months before
      the date of the enrollment, and a round is the set of listing quality assessments dated in the same calendar quarter.
    round1_num: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    round1_den: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    round2_num: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    round2_den: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    round3_num: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    round3_den: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    use_round2: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    use_round3: the weighted average of each round in the window is taken on its own and the rounds' averages are averaged,
      a round with no weighted rating being left out
    pooled_rating: for every other account every weighted rating in the window is averaged together
    per_round_rating: the weighted average of each round in the window is taken on its own and the rounds' averages are
      averaged, a round with no weighted rating being left out
    latest_round_rating: for an account with exactly one such listing, it is the weighted average of the latest round in
      the window alone
    new_in_window: for an account with at least new_listing_count_recent listed listings first listed within the rating's
      window
    listing_rating: 'The listing rating is aggregated by one of three methods: for an account with at least new_listing_count_recent
      listed listings first listed within the rating''s window, the weighted average of each round in the window is taken
      on its own and the rounds'' averages are averaged, a round with no weighted rating being left out; for an account
      with exactly one such listing, it is the weighted average of the latest round in the window alone; for every other
      account every weighted rating in the window is averaged together. The listing rating is rounded half up to 2 decimal
      places only at the end.'
    qualifies_plus: An enrollment places the account in Professional Host Plus when its live-listing count is at least professional_plus_min_live_listings
      and its listing rating is at least professional_plus_min_avg_rating; otherwise the account stays a Professional Host.
    result: An enrollment places the account in Professional Host Plus when its live-listing count is at least professional_plus_min_live_listings
      and its listing rating is at least professional_plus_min_avg_rating; otherwise the account stays a Professional Host.
  factors:
  - id: pending_reinstatement_live_count
    effect: method
    decides: live_count
    bindings:
    - pending_reinstatements
    - live_count
    ladder:
    - when: the account has registration-suspended listings whose reinstatement requests are submitted and still undecided
      method: the live-listing count is the listed and snoozed listings plus one listing for each such request
    - when: the account has no such request and its restricted until date falls within the 12 months before the enrollment
      method: the live-listing count is the listed listings only
    - when: otherwise
      method: the live-listing count is the listed and snoozed listings
    baseline:
      live_count: live_count_std
    evidence:
    - cross_category
    - date
    cross_difficulty: listing
  - id: tenure_rating_window
    effect: parameter
    decides: rating_window
    bindings:
    - account_months
    - rating_window
    ladder:
    - when: the account was opened at least long_tenure_months whole calendar months before the enrollment
      value: K('rating_window_long_months')
    - when: the account was opened at least mid_tenure_months but fewer than long_tenure_months whole months before
      value: K('rating_window_mid_months')
    - when: otherwise
      value: K('rating_window_standard_months')
    baseline:
      rating_window: K('rating_window_standard_months')
    evidence:
    - date
    cross_difficulty: null
  - id: quality_record_not_assessed_weight
    effect: parameter
    decides: na_weight
    bindings:
    - warnings_12m
    - suspensions_12m
    - na_weight
    ladder:
    - when: no listing quality assessment dated within the 12 months before the enrollment had a warning outcome AND none
        had a suspension outcome
      value: K('not_assessed_weight_clean')
    - when: at least one warning outcome AND no suspension outcome within those 12 months
      value: K('not_assessed_weight_warned')
    - when: otherwise
      value: K('not_assessed_weight_standard')
    baseline:
      na_weight: K('not_assessed_weight_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: listing
  - id: new_listing_round_averaging
    effect: method
    decides: listing_rating
    bindings:
    - rated_sum_3m
    - rated_count_3m
    - na_sum_3m
    - na_count_3m
    - rated_sum_6m
    - rated_count_6m
    - na_sum_6m
    - na_count_6m
    - rated_sum_9m
    - rated_count_9m
    - na_sum_9m
    - na_count_9m
    - round1_num
    - round1_den
    - round2_num
    - round2_den
    - round3_num
    - round3_den
    - use_round2
    - use_round3
    - pooled_rating
    - per_round_rating
    - latest_round_rating
    - new_in_window
    - listing_rating
    ladder:
    - when: at least new_listing_count_recent listed listings were first listed within the rating's window
      method: each round's weighted average is taken on its own and the round averages are averaged
    - when: exactly one listed listing was first listed within the window
      method: the weighted average of the latest round in the window alone
    - when: otherwise
      method: every weighted rating in the window averaged together
    baseline:
      listing_rating: RND(pooled_rating, 2)
    evidence:
    - cross_category
    - date
    cross_difficulty: listing
  baseline:
    rule: An enrollment places the account in Professional Host Plus when its live-listing count is at least professional_plus_min_live_listings
      and its listing rating is at least professional_plus_min_avg_rating; otherwise the account stays a Professional Host.
      The standard live-listing count is the number of the account's listings that are listed or snoozed, and the standard
      listing rating is the average of every rating recorded at the account's listing quality assessments dated within the
      rating_window_standard_months months before the enrollment, each rating counted once, rounded half up to 2 decimal
      places.
    params:
    - professional_plus_min_live_listings
    - professional_plus_min_avg_rating
  inputs:
    history:
    - category: listing
      table: listings
      aggregate: count
      field: listing_id
      filters:
        status: listed
    - category: listing
      table: listing_reinstatement_requests
      aggregate: count
      field: reinstatement_request_id
      filters:
        request_status: submitted
        suspension_reason: registration
    - category: listing
      table: listing_events
      aggregate: sum
      field: average_rating
      within_months: 9
      filters:
        event_type: listing_quality_reviewed
    - category: listing
      table: listing_events
      aggregate: count
      field: listing_event_id
      within_months: 12
      filters:
        event_type: listing_quality_reviewed
        quality_outcome: warning
    - category: listing
      table: listings
      aggregate: count
      field: listing_id
      within_months: 9
      filters:
        status: listed
    cross_category:
    - listing
- id: host_ext_professional_fee_rerating
  base_policy_refs:
  - host_evt_service_fee
  - host_tier_assignment
  overwrite:
  - base_policy: host_evt_service_fee
    superseded_clause: The percentage is host_service_fee_pct of the account's tier when the stay's fee_structure equals
      the tier's fee_structure
    replaced_by: A stay's host service fee is assessed at host_service_fee_pct of the account's tier when the stay's fee_structure
      equals the tier's fee_structure, and a re-rated fee replaces that percentage only for a stay re-rated under this rule.
  - base_policy: host_tier_assignment
    superseded_clause: A tier change applies to stays booked after it
    replaced_by: When an account holds a professional tier whose host_service_fee_pct is lower than the percentage its stays
      were assessed at, the host service fee on each stay assessed on or after the tier start is re-rated and the difference
      is refunded, one refund for each stay, the most recently assessed stay first.
  trigger: on_request
  subject:
  - host_service_fee_refunded
  computes: amount
  target_tool: refund_rerated_host_fee_9248fd19
  params:
    backdate_days: 30
    backdate_window_days: 90
    large_booking_base: 5000.0
    mid_booking_base: 2500.0
    large_booking_pct: 14.5
    mid_booking_pct: 14.75
    long_tenure_months: 60
    mid_tenure_months: 36
    long_tenure_discount_pct: 0.25
    mid_tenure_discount_pct: 0.1
    instant_book_high_share_pct: 75
    instant_book_mid_share_pct: 50
    instant_book_high_discount_pct: 0.2
    instant_book_mid_discount_pct: 0.1
    cover_plus_discount_pct: 0.15
    cover_standard_discount_pct: 0.05
  rule: 'When an account holds a professional tier whose host_service_fee_pct is lower than the percentage its stays were
    assessed at, the host service fee on each stay assessed on or after the tier start is re-rated and the difference is
    refunded, one refund for each stay, the most recently assessed stay first. A stay''s host service fee is assessed at
    host_service_fee_pct of the account''s tier when the stay''s fee_structure equals the tier''s fee_structure, and a re-rated
    fee replaces that percentage only for a stay re-rated under this rule. A host service fee is not re-rated until the
    account holds the professional tier that its live listings and listing ratings qualify it for. A re-rating refund for
    a stay, booked with no host-funded guest refund behind it, is the host service fee assessed on the stay, less any host
    service fee already refunded on it, less the re-rated fee, and never below zero, rounded half up to the cent. The re-rated
    fee is the stay''s host-fee base as assessed times the re-rated percentage, rounded half up to the cent. The standard
    re-rated percentage is the host_service_fee_pct of the account''s tier. The standard tier start is the date of the move
    into the tier, and a stay is re-rated when it was assessed on or after the tier start and the tier''s host_service_fee_pct
    is lower than the percentage the stay was assessed at, which is the fee assessed divided by the stay''s host-fee base.
    The tier start of a re-rating is worked out by one of three methods, the account''s qualifying date being the first-listed
    date of its most recently first-listed listing that is listed: when the account qualified fewer than backdate_days calendar
    days before the move, the tier start is the qualifying date; when it qualified at least backdate_days but fewer than
    backdate_window_days calendar days before the move, the tier start is backdate_days calendar days before the date of
    the move; otherwise the tier start is the standard one. The re-rated percentage starts from large_booking_pct for a
    stay whose host-fee base is at least large_booking_base, from mid_booking_pct for a stay whose host-fee base is at least
    mid_booking_base but below large_booking_base, and from the standard re-rated percentage otherwise. A tenure discount
    of long_tenure_discount_pct percentage points comes off it for an account opened at least long_tenure_months whole calendar
    months before the re-rating, mid_tenure_discount_pct points for an account opened at least mid_tenure_months but fewer
    than long_tenure_months whole months before, and none otherwise. An Instant Book discount of instant_book_high_discount_pct
    points comes off it when at least instant_book_high_share_pct percent of the account''s listed and snoozed listings
    have Instant Book on, instant_book_mid_discount_pct points when at least instant_book_mid_share_pct percent but fewer
    than instant_book_high_share_pct percent do, and none otherwise. A HostCover discount of cover_plus_discount_pct points
    comes off it when the account''s active HostCover plans at HostCover Plus, HostCover Premier, HostCover Elite or HostCover
    Estate number at least its listed and snoozed listings, cover_standard_discount_pct points when they number fewer but,
    counted together with its active HostCover Standard plans, at least its listed and snoozed listings, and none otherwise.
    Every discount comes off the starting percentage once, and the discounts are all taken off before the re-rated fee is
    worked out.'
  prerequisite:
  - problem: host_ext_professional_plus_enrollment
    kind: value_input
    gate: tier_pct
    form: state
    policy_source: A host service fee is not re-rated until the account holds the professional tier that its live listings
      and listing ratings qualify it for.
    condition: host_accounts.variant_name equals the professional tier that the enrollment computation over the account's
      listings, reinstatement requests and listing quality assessments gives it (Professional Host Plus when its live-listing
      count and listing rating meet professional_plus_min_live_listings and professional_plus_min_avg_rating).
    resolved_by: enroll_professional_tier_a874e389
    effect: tier_pct becomes the host_service_fee_pct of the tier the enrollment gives (15.00 for Professional Host Plus
      instead of 15.50 for Professional Host), which opens the re-rating gate, and last_tier_change_date becomes the date
      of the move, from which the tier start is worked out.
  cross_category:
  - category: listing
    as: history
    reads:
    - listings.status
    - listings.instant_book
    - listings.first_listed_date
    note: The Instant Book discount and the tier start read the host's own listings.
  - category: protect
    as: branch
    reads:
    - protection_plans.variant_name
    - protection_plans.status
    note: The HostCover discount reads the levels of the host's active HostCover plans.
  compute:
  - stay_ref: LATEST('host_account_events', 'stay_id', event_type='host_service_fee_assessed')
  - stay_checkin: LATEST('host_account_events', 'event_date', event_type='host_service_fee_assessed')
  - stay_fee: SUM('host_account_events', 'amount', event_type='host_service_fee_assessed', stay_id=stay_ref)
  - stay_fee_refunded: SUM('host_account_events', 'amount', event_type='host_service_fee_refunded', stay_id=stay_ref)
  - tier_pct: P('host_service_fee_pct')
  - moved_on: F('last_tier_change_date')
  - qualifying_date: XLATEST('listing', 'listings', 'first_listed_date', date_field='first_listed_date', status='listed')
  - in_effect: DAYS(qualifying_date, stay_checkin) >= 0 if DAYS(qualifying_date, moved_on) < K('backdate_days') else (DAYS(stay_checkin,
      moved_on) <= K('backdate_days') if DAYS(qualifying_date, moved_on) < K('backdate_window_days') else DAYS(moved_on,
      stay_checkin) >= 0)
  - stay_base: SUM('host_account_events', 'fee_base_amount', event_type='host_service_fee_assessed', stay_id=stay_ref)
  - start_pct: K('large_booking_pct') if stay_base >= K('large_booking_base') else (K('mid_booking_pct') if stay_base >=
      K('mid_booking_base') else tier_pct)
  - account_months: MONTHS(F('opened_date'), NOW)
  - tenure_discount: K('long_tenure_discount_pct') if account_months >= K('long_tenure_months') else (K('mid_tenure_discount_pct')
      if account_months >= K('mid_tenure_months') else 0.0)
  - live_listings: XCOUNT('listing', 'listings', status='listed') + XCOUNT('listing', 'listings', status='snoozed')
  - instant_live: XCOUNT('listing', 'listings', status='listed', instant_book=True) + XCOUNT('listing', 'listings', status='snoozed',
      instant_book=True)
  - instant_discount: K('instant_book_high_discount_pct') if instant_live * 100 >= K('instant_book_high_share_pct') * live_listings
      else (K('instant_book_mid_discount_pct') if instant_live * 100 >= K('instant_book_mid_share_pct') * live_listings
      else 0.0)
  - plus_plans: XCOUNT('protect', 'protection_plans', status='active', variant_name='HostCover Plus') + XCOUNT('protect',
      'protection_plans', status='active', variant_name='HostCover Premier') + XCOUNT('protect', 'protection_plans', status='active',
      variant_name='HostCover Elite') + XCOUNT('protect', 'protection_plans', status='active', variant_name='HostCover Estate')
  - standard_plans: XCOUNT('protect', 'protection_plans', status='active', variant_name='HostCover Standard')
  - cover_discount: K('cover_plus_discount_pct') if plus_plans >= live_listings else (K('cover_standard_discount_pct') if
      plus_plans + standard_plans >= live_listings else 0.0)
  - rerated_pct: start_pct - tenure_discount - instant_discount - cover_discount
  - rerated_fee: RND(stay_base * rerated_pct / 100, 2)
  - result: RND(MX(0, stay_fee - stay_fee_refunded - rerated_fee), 2) if (in_effect and tier_pct < stay_fee * 100 / MX(1,
      stay_base)) else 0.0
  compute_basis:
    stay_ref: one refund for each stay, the most recently assessed stay first
    stay_checkin: a stay is re-rated when it was assessed on or after the tier start
    stay_fee: A re-rating refund for a stay, booked with no host-funded guest refund behind it, is the host service fee
      assessed on the stay, less any host service fee already refunded on it, less the re-rated fee, and never below zero,
      rounded half up to the cent.
    stay_fee_refunded: less any host service fee already refunded on it
    tier_pct: The standard re-rated percentage is the host_service_fee_pct of the account's tier.
    moved_on: The standard tier start is the date of the move into the tier
    qualifying_date: the account's qualifying date being the first-listed date of its most recently first-listed listing
      that is listed
    in_effect: 'The tier start of a re-rating is worked out by one of three methods, the account''s qualifying date being
      the first-listed date of its most recently first-listed listing that is listed: when the account qualified fewer than
      backdate_days calendar days before the move, the tier start is the qualifying date; when it qualified at least backdate_days
      but fewer than backdate_window_days calendar days before the move, the tier start is backdate_days calendar days before
      the date of the move; otherwise the tier start is the standard one.'
    stay_base: The re-rated fee is the stay's host-fee base as assessed times the re-rated percentage, rounded half up to
      the cent.
    start_pct: The re-rated percentage starts from large_booking_pct for a stay whose host-fee base is at least large_booking_base,
      from mid_booking_pct for a stay whose host-fee base is at least mid_booking_base but below large_booking_base, and
      from the standard re-rated percentage otherwise.
    account_months: for an account opened at least long_tenure_months whole calendar months before the re-rating
    tenure_discount: A tenure discount of long_tenure_discount_pct percentage points comes off it for an account opened
      at least long_tenure_months whole calendar months before the re-rating, mid_tenure_discount_pct points for an account
      opened at least mid_tenure_months but fewer than long_tenure_months whole months before, and none otherwise.
    live_listings: the account's listed and snoozed listings
    instant_live: of the account's listed and snoozed listings have Instant Book on
    instant_discount: An Instant Book discount of instant_book_high_discount_pct points comes off it when at least instant_book_high_share_pct
      percent of the account's listed and snoozed listings have Instant Book on, instant_book_mid_discount_pct points when
      at least instant_book_mid_share_pct percent but fewer than instant_book_high_share_pct percent do, and none otherwise.
    plus_plans: the account's active HostCover plans at HostCover Plus, HostCover Premier, HostCover Elite or HostCover
      Estate number at least its listed and snoozed listings
    standard_plans: counted together with its active HostCover Standard plans, at least its listed and snoozed listings
    cover_discount: A HostCover discount of cover_plus_discount_pct points comes off it when the account's active HostCover
      plans at HostCover Plus, HostCover Premier, HostCover Elite or HostCover Estate number at least its listed and snoozed
      listings, cover_standard_discount_pct points when they number fewer but, counted together with its active HostCover
      Standard plans, at least its listed and snoozed listings, and none otherwise.
    rerated_pct: Every discount comes off the starting percentage once, and the discounts are all taken off before the re-rated
      fee is worked out.
    rerated_fee: The re-rated fee is the stay's host-fee base as assessed times the re-rated percentage, rounded half up
      to the cent.
    result: a stay is re-rated when it was assessed on or after the tier start and the tier's host_service_fee_pct is lower
      than the percentage the stay was assessed at, which is the fee assessed divided by the stay's host-fee base
  factors:
  - id: qualifying_date_tier_start
    effect: method
    decides: in_effect
    bindings:
    - moved_on
    - qualifying_date
    - in_effect
    ladder:
    - when: the account qualified fewer than backdate_days calendar days before the move
      method: the tier start is the qualifying date (first-listed date of the most recently first-listed listed listing);
        a stay assessed on or after it is re-rated
    - when: the account qualified at least backdate_days but fewer than backdate_window_days calendar days before the move
      method: the tier start is backdate_days calendar days before the date of the move
    - when: otherwise
      method: the tier start is the date of the move into the tier
    baseline:
      in_effect: DAYS(moved_on, stay_checkin) >= 0
    evidence:
    - cross_category
    - date
    cross_difficulty: listing
  - id: booking_size_start_pct
    effect: parameter
    decides: start_pct
    bindings:
    - stay_base
    - start_pct
    ladder:
    - when: the stay's host-fee base is at least large_booking_base
      value: K('large_booking_pct')
    - when: the stay's host-fee base is at least mid_booking_base but below large_booking_base
      value: K('mid_booking_pct')
    - when: otherwise
      value: the tier's host_service_fee_pct
    baseline:
      start_pct: tier_pct
    evidence:
    - history
    cross_difficulty: null
  - id: account_tenure_discount
    effect: parameter
    decides: tenure_discount
    bindings:
    - account_months
    - tenure_discount
    ladder:
    - when: the account was opened at least long_tenure_months whole calendar months before the re-rating
      value: K('long_tenure_discount_pct')
    - when: the account was opened at least mid_tenure_months but fewer than long_tenure_months whole months before
      value: K('mid_tenure_discount_pct')
    - when: otherwise
      value: no tenure discount (0.00)
    baseline:
      tenure_discount: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: instant_book_discount
    effect: parameter
    decides: instant_discount
    bindings:
    - live_listings
    - instant_live
    - instant_discount
    ladder:
    - when: at least instant_book_high_share_pct percent of the listed and snoozed listings have Instant Book on
      value: K('instant_book_high_discount_pct')
    - when: at least instant_book_mid_share_pct percent but fewer than instant_book_high_share_pct percent have it on
      value: K('instant_book_mid_discount_pct')
    - when: otherwise
      value: no Instant Book discount (0.00)
    baseline:
      instant_discount: '0.0'
    evidence:
    - cross_category
    cross_difficulty: listing
  - id: hostcover_discount
    effect: parameter
    decides: cover_discount
    bindings:
    - plus_plans
    - standard_plans
    - cover_discount
    ladder:
    - when: the active HostCover plans at Plus, Premier, Elite or Estate number at least the listed and snoozed listings
      value: K('cover_plus_discount_pct')
    - when: they number fewer, but with the active HostCover Standard plans at least the listed and snoozed listings
      value: K('cover_standard_discount_pct')
    - when: otherwise
      value: no HostCover discount (0.00)
    baseline:
      cover_discount: '0.0'
    evidence:
    - cross_category
    cross_difficulty: protect
  baseline:
    rule: A re-rating refund for a stay, booked with no host-funded guest refund behind it, is the host service fee assessed
      on the stay, less any host service fee already refunded on it, less the re-rated fee, and never below zero, rounded
      half up to the cent. The re-rated fee is the stay's host-fee base as assessed times the re-rated percentage, rounded
      half up to the cent. The standard re-rated percentage is the host_service_fee_pct of the account's tier. The standard
      tier start is the date of the move into the tier, and a stay is re-rated when it was assessed on or after the tier
      start and the tier's host_service_fee_pct is lower than the percentage the stay was assessed at, which is the fee
      assessed divided by the stay's host-fee base.
    params:
    - host_service_fee_pct
  inputs:
    history:
    - table: host_account_events
      aggregate: latest
      field: stay_id
      filters:
        event_type: host_service_fee_assessed
    - table: host_account_events
      aggregate: sum
      field: amount
      filters:
        event_type: host_service_fee_assessed
    - table: host_account_events
      aggregate: sum
      field: fee_base_amount
      filters:
        event_type: host_service_fee_assessed
    - table: host_account_events
      aggregate: sum
      field: amount
      filters:
        event_type: host_service_fee_refunded
    - category: listing
      table: listings
      aggregate: latest
      field: first_listed_date
      filters:
        status: listed
    - category: listing
      table: listings
      aggregate: count
      field: listing_id
      filters:
        status: listed
        instant_book: true
    - category: protect
      table: protection_plans
      aggregate: count
      field: protection_plan_id
      filters:
        status: active
    cross_category:
    - listing
    - protect
