  - type: host_account_opened
    target: host_accounts
    mutation: create
    meaning: A customer opens a host account to list spaces on Roamhaven.
    grain: one row per host account
    fields:
      host_account_id: reference number of the new host account
      customer_id: the host
      variant_name: Starter Host at opening (Professional Host when a registered business opens the account)
      status: pending_verification at opening
      opened_date: date opened
      business_name: registered business name exactly as registered; empty for an individual
      taxpayer_info_status: not_provided at opening unless a form is supplied
      tax_residency: us or non_us
    triggers: []
  - type: host_account_verified
    target: host_accounts
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: The host's identity verification completes.
    grain: one row per host account
    fields:
      host_account_id: the account
      status: becomes active
      verified_date: date verified
    triggers: []
  - type: host_account_restricted
    target: host_accounts
    mutation: {transition: {from: active, to: restricted}}
    meaning: The account is barred from new bookings for a period.
    grain: one row per host account
    fields:
      host_account_id: the account
      status: becomes restricted
      restricted_until: last day of the restriction
    triggers: []
  - type: host_restriction_lifted
    target: host_accounts
    mutation: {transition: {from: restricted, to: active}}
    meaning: A restriction ends and the account accepts bookings again.
    grain: one row per host account
    fields:
      host_account_id: the account
      status: becomes active
    triggers: []
  - type: host_account_suspended
    target: host_accounts
    mutation: {transition: [{from: active, to: suspended}, {from: restricted, to: suspended}]}
    meaning: Trust and safety suspends the host account.
    grain: one row per host account
    fields:
      host_account_id: the account
      status: becomes suspended
      suspended_date: date suspended
    triggers:
      - event: listing:listing_suspended
        map: {suspension_reason: host_account}
      - event: payout:payout_hold_placed
        map: {hold_reason: account_suspension}
  - type: host_account_reinstated
    target: host_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended host account is reinstated after an approved appeal.
    grain: one row per host account
    fields:
      host_account_id: the account
      status: becomes active
    triggers:
      - event: payout:payout_hold_released
        map: {hold_reason: account_suspension}
  - type: host_account_deactivated
    target: host_accounts
    mutation: {transition: [{from: active, to: deactivated}, {from: pending_verification, to: deactivated}, {from: suspended, to: deactivated}]}
    meaning: The host account is closed, by the host or permanently by Roamhaven.
    grain: one row per host account
    fields:
      host_account_id: the account
      status: becomes deactivated
      deactivated_date: date closed
    triggers: []
  - type: host_tier_updated
    target: host_accounts
    mutation: update
    meaning: The account moves to another host tier.
    grain: one row per host account (each change rewrites the current tier)
    fields:
      host_account_id: the account
      variant_name: the new tier
      superhost_since: date Superhost was first awarded in the current run; empty when not a Superhost
      last_tier_change_date: date of this change
    triggers: []
  - type: host_taxpayer_info_updated
    target: host_accounts
    mutation: update
    meaning: The host supplies or replaces taxpayer information.
    grain: one row per host account
    fields:
      host_account_id: the account
      taxpayer_info_status: w9_on_file or w8_on_file
    triggers: []
  - type: host_service_fee_assessed
    target: host_account_events
    meaning: The host service fee on one stay is assessed at check-in and withheld from the host's earnings.
    grain: one row per stay
    distinguish_by: [stay_id]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date assessed
      stay_id: the stay
      fee_base_amount: the host-fee base of the stay
      amount: fee assessed, positive
    account: host_fees
    direction: in
    triggers: []
  - type: host_service_fee_refunded
    target: host_account_events
    meaning: Part of a stay's host service fee is refunded because host-funded guest refunds followed the payout release.
    grain: one row per stay per refund date
    distinguish_by: [stay_id, event_date]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date refunded
      stay_id: the stay
      fee_base_amount: the host-funded amount refunded to the guest
      amount: fee refunded, positive
    account: host_fees
    direction: out
    triggers: []
  - type: host_cancellation_recorded
    target: host_account_events
    meaning: A host cancellation of a confirmed stay is recorded against the account with its timing band.
    grain: one row per cancelled stay
    distinguish_by: [stay_id]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date of the cancellation
      stay_id: the cancelled stay
      penalty_band: more_than_30_days, 30_days_to_48_hours or under_48_hours
      initiated_by: host, or roamhaven when Roamhaven cancelled the stay itself
    triggers: []
  - type: host_cancellation_penalty_charged
    target: host_account_events
    meaning: The cancellation penalty for one host-cancelled stay is charged to the host.
    grain: one row per cancelled stay
    distinguish_by: [stay_id]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date charged
      stay_id: the cancelled stay
      penalty_band: timing band applied
      fee_base_amount: penalty base of the cancelled stay
      amount: penalty charged, positive
    account: cancellation_penalties
    direction: in
    triggers:
      - event: payout:payout_deduction_applied
        map: {stay_id: stay_id, amount: amount, deduction_type: cancellation_penalty}
  - type: host_cancellation_penalty_waived
    target: host_account_events
    meaning: A charged cancellation penalty is waived on an approved appeal and given back to the host.
    grain: one row per cancelled stay
    distinguish_by: [stay_id]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date waived
      stay_id: the cancelled stay
      appeal_id: the approved penalty appeal
      waiver_reason: the documented reason accepted
      original_event_id: the penalty charge being waived
      amount: penalty waived, positive
    account: cancellation_penalties
    direction: out
    triggers:
      - event: payout:payout_adjustment_credited
        map: {stay_id: stay_id, amount: amount, credit_type: penalty_waiver}
  - type: host_policy_strike_recorded
    target: host_account_events
    meaning: Trust and safety records a confirmed breach of Roamhaven's host standards as a strike.
    grain: one row per confirmed breach
    distinguish_by: [strike_type, event_date, stay_id]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date the breach was confirmed
      strike_type: party_violation, discrimination, off_platform_payment, misrepresentation, safety_violation or review_manipulation
      stay_id: the stay concerned; empty when the breach is not tied to a stay
    triggers: []
  - type: host_superhost_assessed
    target: host_account_events
    meaning: The quarterly Superhost assessment of an individual host is recorded with its metrics and outcome.
    grain: one row per account per quarter
    distinguish_by: [assessment_quarter]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: assessment date
      assessment_quarter: quarter assessed
      average_rating: average guest rating over the lookback
      response_rate_pct: message response rate over the lookback, from the messaging system
      cancellation_rate_pct: host cancellation rate over the lookback
      stays_12m: completed stays in the lookback
      nights_12m: completed nights in the lookback
      assessment_outcome: met or not_met
      tier_change: promoted, demoted or unchanged
    triggers:
      - event: host:host_tier_updated
        when: {tier_change: [promoted, demoted]}
        map: {host_account_id: host_account_id}
  - type: host_travel_credit_issued
    target: host_account_events
    meaning: A Superhost receives the Roamhaven travel credit earned by consecutive met assessments.
    grain: one row per earned credit
    distinguish_by: [assessment_quarter]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date issued
      assessment_quarter: the met assessment that completed the run
      amount: credit issued
    triggers: []
  - type: host_tax_form_issued
    target: host_account_events
    meaning: A Form 1099-K is issued to the host for a calendar year.
    grain: one row per account per tax year
    distinguish_by: [tax_year]
    fields:
      host_account_id: the account
      customer_id: the host
      event_date: date issued
      tax_year: the calendar year reported
      amount: gross payouts reported
      transaction_count: payout transactions in the year
    triggers: []

measures:
  - id: host_msr_cancellation_rate_365d
    window: the cancellation_rate_lookback_days calendar days ending on the day of the evaluation
    measure: 100 times the count of host_cancellation_recorded rows of the account dated in the window whose penalty was not waived and whose initiated_by is host, divided by the count of the account's stays (any status other than requested, declined or expired) whose check_in_date falls in the window plus those cancelled host cancellations, rounded half up to 2 decimals
  - id: host_msr_completed_stays_365d
    window: the superhost_lookback_days calendar days ending on the day before the assessment date
    measure: count of the account's stays with status completed whose check_out_date falls in the window
  - id: host_msr_completed_nights_365d
    window: the superhost_lookback_days calendar days ending on the day before the assessment date
    measure: sum of nights over the account's stays with status completed whose check_out_date falls in the window
  - id: host_msr_avg_rating_365d
    window: the superhost_lookback_days calendar days ending on the day before the assessment date
    measure: mean of guest ratings (stay_review_submitted, reviewer_role guest) on the account's stays whose posted_at date falls in the window, rounded half up to 2 decimals
  - id: host_msr_strikes_365d
    window: the strike_lookback_days calendar days ending on the date of the newest strike
    measure: count of host_policy_strike_recorded rows of the account dated in the window whose strike was not overturned by an approved policy_strike appeal
  - id: host_msr_consecutive_met_quarters
    window: the account's Superhost assessments in quarter order, ending with the newest
    measure: number of consecutive host_superhost_assessed rows with assessment_outcome met counted back from the newest, restarting after each travel credit issued

policies:
  - id: host_agg_multi_holding
    subject: [host_account_opened]
    rule: >-
      A customer may hold only one host account; every listing, co-host seat and payout method of the customer hangs
      from it. A second account requested by a customer who already has a host account in any status other than
      deactivated is not opened, and a customer whose host account was deactivated by Roamhaven after a suspension may
      not open a new one. A business is one customer with a business_name on its single account.
    eligibility: []
    params:
      max_per_customer: 1
  - id: host_tier_assignment
    subject: [host_tier_updated, host_superhost_assessed]
    rule: >-
      The tier of a host account is decided in this order of precedence, the first that applies winning: Enterprise
      Partner for an account with a signed partner agreement and at least enterprise_min_live_listings live listings;
      Professional Host Plus for an account with at least professional_plus_min_live_listings live listings and an
      average guest rating of at least professional_plus_min_avg_rating; Professional Host for an account with a
      business_name or at least professional_min_live_listings live listings; then, for individual accounts, Superhost,
      Standard Host or Starter Host. A Starter Host becomes a Standard Host once the account is at least
      starter_graduation_min_account_days old and has starter_graduation_min_stays completed stays. Individual Standard
      Hosts and Superhosts are assessed on the superhost_assessment_schedule dates over superhost_lookback_days: the
      assessment is met when the average rating (host_msr_avg_rating_365d) is at least superhost_min_avg_rating, the
      response rate recorded by the messaging system is at least superhost_min_response_rate_pct, the cancellation rate
      (host_msr_cancellation_rate_365d) is below superhost_max_cancellation_rate_pct, and either completed stays
      (host_msr_completed_stays_365d) reach superhost_min_stays_12m or completed stays reach superhost_alt_min_stays_12m
      with completed nights (host_msr_completed_nights_365d) reaching superhost_alt_min_nights_12m. A met assessment
      promotes a Standard Host to Superhost; a not-met assessment demotes a Superhost to Standard Host; otherwise the
      tier is unchanged. Superhost is lost at once on suspension when superhost_loss_on_suspension is true. A tier change
      applies to stays booked after it; stays already booked keep the fee_structure frozen on them.
    eligibility: []
    measures: [host_msr_avg_rating_365d, host_msr_cancellation_rate_365d, host_msr_completed_stays_365d, host_msr_completed_nights_365d]
    formula:
      superhost_met: host_msr_avg_rating_365d >= superhost_min_avg_rating and response_rate_pct >= superhost_min_response_rate_pct and host_msr_cancellation_rate_365d < superhost_max_cancellation_rate_pct and (host_msr_completed_stays_365d >= superhost_min_stays_12m or (host_msr_completed_stays_365d >= superhost_alt_min_stays_12m and host_msr_completed_nights_365d >= superhost_alt_min_nights_12m))
  - id: host_evt_service_fee
    subject: [host_service_fee_assessed, host_service_fee_refunded]
    rule: >-
      The host service fee is assessed once per stay at check-in on the host-fee base (nightly_subtotal, cleaning_fee,
      pet_fee_total and extra_guest_fee_total of the stay as booked or last altered) and withheld from the host's
      earnings. The percentage is host_service_fee_pct of the account's tier when the stay's fee_structure equals the
      tier's fee_structure; split_fee_host_pct when a split_fee stay is assessed while the tier carries a host-only fee;
      and host_only_fee_default_pct when a host_only_fee stay is assessed while the tier carries a split fee. The host
      service fee for a stay is assessed only once. When guest refunds funded_by host are issued after the payout
      release, the host service fee is refunded at the same percentage on the refunded host-funded amount, and the total
      refunded never exceeds the fee assessed on the stay. A stay cancelled by the guest before check-in is assessed
      on the host-funded amount the guest did not get back, when that amount is released on the original check-in
      schedule; a stay cancelled by the host is never assessed.
    eligibility:
      - id: one_fee_per_stay
        applies_to: [host_service_fee_assessed]
        kind: dedup
        condition: The host service fee for a stay is assessed only once.
        evidence_fields: [host_account_events.stay_id, host_account_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_account_events.stay_id]
          action_bindings:
            host_account_events.stay_id: stay_id
        dedup_contract:
          table: host_account_events
          mode: separate_record
          object_bindings: {stay_id: stay_id}
          duplicate_filters: {event_type: [host_service_fee_assessed]}
          distinct_fields: []
    params:
      per_tier:
        Starter Host: {host_service_fee_pct: "=host_service_fee_pct"}
        Standard Host: {host_service_fee_pct: "=host_service_fee_pct"}
        Superhost: {host_service_fee_pct: "=host_service_fee_pct"}
        Professional Host: {host_service_fee_pct: "=host_service_fee_pct"}
        Professional Host Plus: {host_service_fee_pct: "=host_service_fee_pct"}
        Enterprise Partner: {host_service_fee_pct: "=host_service_fee_pct"}
    formula:
      amount: round(fee_base_amount * host_service_fee_pct / 100, 2)
  - id: host_evt_cancellation_penalty
    subject: [host_cancellation_recorded, host_cancellation_penalty_charged]
    rule: >-
      Every host cancellation of a confirmed stay is recorded against the account with its timing band, counted in
      whole calendar days from the date of the cancellation to the stay's check_in_date: more_than_30_days when 31 or
      more days remain, 30_days_to_48_hours when 2 to 30 days remain, and under_48_hours when 1 day or less remains. The
      penalty base is the cancelled stay's nightly_subtotal, cleaning_fee, pet_fee_total and extra_guest_fee_total. The
      penalty is the band's percentage of the base (cancel_penalty_pct_over_30_days,
      cancel_penalty_pct_30_days_to_48_hours or cancel_penalty_pct_under_48_hours), raised to cancel_penalty_min_usd
      when lower and cut to cancel_penalty_max_usd when higher, and it is recovered from the host's next payouts. No
      penalty is charged when the cancellation's initiated_by is roamhaven, or when a major_disruptive_event request on
      the stay has been approved under the Stays charter. A penalty for the same cancelled stay is charged only once.
      A penalty is never reduced at charging time for any reason the host gives; a documented reason is heard only
      through a penalty appeal under host_evt_penalty_waiver.
    eligibility:
      - id: one_penalty_per_stay
        applies_to: [host_cancellation_penalty_charged]
        kind: dedup
        condition: A penalty for the same cancelled stay is charged only once.
        evidence_fields: [host_account_events.stay_id, host_account_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_account_events.stay_id]
          action_bindings:
            host_account_events.stay_id: stay_id
        dedup_contract:
          table: host_account_events
          mode: separate_record
          object_bindings: {stay_id: stay_id}
          duplicate_filters: {event_type: [host_cancellation_penalty_charged]}
          distinct_fields: []
    formula:
      when_not: initiated_by == "roamhaven"
      amount: 'min(max(round(fee_base_amount * (cancel_penalty_pct_over_30_days if penalty_band == "more_than_30_days" else (cancel_penalty_pct_30_days_to_48_hours if penalty_band == "30_days_to_48_hours" else cancel_penalty_pct_under_48_hours)) / 100, 2), cancel_penalty_min_usd), cancel_penalty_max_usd)'
  - id: host_evt_penalty_waiver
    subject: [host_cancellation_penalty_waived]
    rule: >-
      A host who cancelled for a documented reason in penalty_waiver_reasons (an extenuating circumstance, a guest's
      breach of house rules, a major disruptive event, or a safety concern) appeals the penalty through a
      cancellation_penalty appeal naming the penalty charge as its related event. A penalty is waived only when the
      penalty appeal has been approved. The penalty appeal must have been submitted within penalty_waiver_request_days
      calendar days after the host cancellation; the days are counted from the cancellation's event_date to the date part
      of the appeal's submitted_at, and an appeal on the last day stands. An approved waiver gives back the whole penalty
      charged, never part of it, is booked once per cancelled stay, and the waived cancellation is no longer counted in
      host_msr_cancellation_rate_365d; the calendar block on the cancelled nights stays.
    eligibility:
      - id: penalty_appeal_approved
        applies_to: [host_cancellation_penalty_waived]
        kind: state
        condition: A penalty is waived only when the penalty appeal has been approved.
        evidence_fields: [host_appeals.appeal_status, host_appeals.appeal_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_appeals.appeal_id]
          action_bindings:
            host_appeals.appeal_id: appeal_id
        state_contract:
          field: host_appeals.appeal_status
          allowed: [approved]
      - id: penalty_appeal_in_time
        applies_to: [host_cancellation_penalty_waived]
        kind: time
        condition: The penalty appeal must have been submitted within penalty_waiver_request_days calendar days after the host cancellation; the days are counted from the cancellation's event_date to the date part of the appeal's submitted_at, and an appeal on the last day stands.
        evidence_fields: [host_account_events.event_date, host_appeals.submitted_at, host_appeals.appeal_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_appeals.appeal_id]
          action_bindings:
            host_appeals.appeal_id: appeal_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the host cancellation
          anchor_source: host_account_events.event_date
          relation: not_after
          duration_source: variants.penalty_waiver_request_days
          unit: calendar_days
          counting_rule: the days are counted from the cancellation's event_date to the date part of the appeal's submitted_at, and an appeal on the last day stands.
          boundary: inclusive
  - id: host_evt_cancellation_rate_restriction
    subject: [host_account_restricted, host_restriction_lifted]
    rule: >-
      After every host cancellation the account's cancellation rate (host_msr_cancellation_rate_365d) is evaluated once
      the account has at least cancellation_rate_min_stays stays in the lookback. A rate at or above the tier's
      cancellation_restriction_rate_pct restricts the account for cancellation_restriction_days calendar days
      (restricted_until is the restriction date plus that many days minus one), during which its listings accept no new
      bookings while confirmed stays continue. Reaching restriction_strike_count strikes in the strike lookback also
      restricts the account for the same period. A restriction is lifted only after the restricted_until date has
      passed; the restriction ends at the end of restricted_until, so it may be lifted from the following calendar day,
      unless an account_restriction appeal is approved earlier, in which case it is lifted on approval.
    eligibility:
      - id: restriction_period_over
        applies_to: [host_restriction_lifted]
        kind: time
        condition: A restriction is lifted only after the restricted_until date has passed; the restriction ends at the end of restricted_until, so it may be lifted from the following calendar day, unless an account_restriction appeal is approved earlier, in which case it is lifted on approval.
        evidence_fields: [host_accounts.restricted_until, host_accounts.host_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_accounts.host_account_id]
          action_bindings:
            host_accounts.host_account_id: host_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the restricted_until date
          anchor_source: host_accounts.restricted_until
          relation: not_before
          duration_source: params.lift_offset_days
          unit: calendar_days
          counting_rule: the restriction ends at the end of restricted_until, so it may be lifted from the following calendar day
          boundary: inclusive
    measures: [host_msr_cancellation_rate_365d]
    params:
      lift_offset_days: 1
      per_tier:
        Starter Host: {cancellation_restriction_rate_pct: "=cancellation_restriction_rate_pct"}
        Standard Host: {cancellation_restriction_rate_pct: "=cancellation_restriction_rate_pct"}
        Superhost: {cancellation_restriction_rate_pct: "=cancellation_restriction_rate_pct"}
        Professional Host: {cancellation_restriction_rate_pct: "=cancellation_restriction_rate_pct"}
        Professional Host Plus: {cancellation_restriction_rate_pct: "=cancellation_restriction_rate_pct"}
        Enterprise Partner: {cancellation_restriction_rate_pct: "=cancellation_restriction_rate_pct"}
  - id: host_evt_strikes_and_suspension
    subject: [host_policy_strike_recorded, host_account_suspended]
    rule: >-
      A strike is recorded only on a breach confirmed by Roamhaven's trust and safety team; a guest complaint or a
      host's own account is never a strike by itself. Strikes are counted over strike_lookback_days
      (host_msr_strikes_365d). A strike of a type in immediate_suspension_strike_types suspends the account on its first
      occurrence; otherwise reaching suspension_strike_count strikes suspends the account, and reaching
      restriction_strike_count restricts it under host_evt_cancellation_rate_restriction. A suspension suspends every
      listing of the account with suspension_reason host_account, holds every payout when suspension_holds_payouts is
      true, ends Superhost status, and leaves confirmed stays to be cancelled by Roamhaven and refunded as host
      cancellations with initiated_by roamhaven. A strike overturned by an approved policy_strike appeal no longer
      counts.
    eligibility: []
    measures: [host_msr_strikes_365d]
  - id: host_evt_appeals_and_reinstatement
    subject: [host_account_reinstated, host_account_deactivated]
    rule: >-
      A host may appeal a suspension, a restriction, a strike or a penalty once (appeals_per_decision) through a host
      appeal, which Roamhaven decides within the tier's appeal_decision_business_days. A suspended account is reinstated
      only when its account_suspension appeal has been approved. The suspension appeal must have been submitted within
      appeal_window_days calendar days after the suspension; the days are counted from suspended_date to the date part
      of submitted_at, and an appeal on the last day stands. Reinstatement restores the account to active, releases the
      payout holds placed for the suspension, and lets the host reinstate suspended listings under the Listings charter;
      it does not restore Superhost status, which returns only through a later met assessment. A suspension becomes
      permanent and the account is deactivated by Roamhaven when the appeal is denied or no appeal was submitted in the
      window. A host may close an active account only when none of its stays is requested, confirmed or checked in.
    eligibility:
      - id: suspension_appeal_approved
        applies_to: [host_account_reinstated]
        kind: state
        condition: A suspended account is reinstated only when its account_suspension appeal has been approved.
        evidence_fields: [host_appeals.appeal_status, host_appeals.appeal_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_appeals.appeal_id]
          action_bindings:
            host_appeals.appeal_id: appeal_id
        state_contract:
          field: host_appeals.appeal_status
          allowed: [approved]
      - id: suspension_appeal_in_time
        applies_to: [host_account_reinstated]
        kind: time
        condition: The suspension appeal must have been submitted within appeal_window_days calendar days after the suspension; the days are counted from suspended_date to the date part of submitted_at, and an appeal on the last day stands.
        evidence_fields: [host_accounts.suspended_date, host_appeals.submitted_at, host_appeals.appeal_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_appeals.appeal_id]
          action_bindings:
            host_appeals.appeal_id: appeal_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension
          anchor_source: host_accounts.suspended_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: the days are counted from suspended_date to the date part of submitted_at, and an appeal on the last day stands.
          boundary: inclusive
      - id: closure_without_open_stays
        applies_to: [host_account_deactivated]
        kind: state
        condition: A host may close an active account only when none of its stays is requested, confirmed or checked in.
        evidence_fields: [stays.status, stays.host_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [stays.host_account_id]
          action_bindings:
            stays.host_account_id: host_account_id
        state_contract:
          field: stays.status
          allowed: [completed, cancelled_by_guest, cancelled_by_host, declined, expired]
  - id: host_evt_verification_and_tax_info
    subject: [host_account_opened, host_account_verified, host_taxpayer_info_updated, host_tax_form_issued]
    rule: >-
      A new host account starts in pending_verification and must complete identity verification within
      identity_verification_deadline_days calendar days after opening, or it is deactivated. A host account is verified
      only within identity_verification_deadline_days calendar days after the account was opened; the days are counted
      from opened_date, and verification on the last day stands. Taxpayer information is a W-9 for a host whose
      tax_residency is us and a W-8 for a host whose tax_residency is non_us; where
      taxpayer_info_required_before_payout is true, payouts released while taxpayer_info_status is not_provided carry
      the withholding set out in the Payouts charter. A Form 1099-K is issued for a calendar year when the account's
      gross payouts in that year exceed form_1099k_threshold_usd and its payout transactions exceed
      form_1099k_min_transactions, both conditions together; at most one form is issued per account per tax year.
    eligibility:
      - id: verification_deadline
        applies_to: [host_account_verified]
        kind: time
        condition: A host account is verified only within identity_verification_deadline_days calendar days after the account was opened; the days are counted from opened_date, and verification on the last day stands.
        evidence_fields: [host_accounts.opened_date, host_accounts.host_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_accounts.host_account_id]
          action_bindings:
            host_accounts.host_account_id: host_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account was opened
          anchor_source: host_accounts.opened_date
          relation: not_after
          duration_source: variants.identity_verification_deadline_days
          unit: calendar_days
          counting_rule: the days are counted from opened_date, and verification on the last day stands.
          boundary: inclusive
  - id: host_evt_superhost_travel_credit
    subject: [host_travel_credit_issued]
    rule: >-
      A Superhost whose run of consecutive met assessments (host_msr_consecutive_met_quarters) reaches
      superhost_credit_consecutive_quarters receives one Roamhaven travel credit of superhost_travel_credit_usd, and the
      run then restarts. Only a tier whose superhost_travel_credit_usd is above 0.00 earns the credit; a host who is not a
      Superhost on the day of the completing assessment earns nothing for the run. The credit is issued once per
      completing assessment, is not cash, and is never paid to a payout method.
    eligibility:
      - id: one_credit_per_run
        applies_to: [host_travel_credit_issued]
        kind: dedup
        condition: The credit is issued once per completing assessment, is not cash, and is never paid to a payout method.
        evidence_fields: [host_account_events.host_account_id, host_account_events.assessment_quarter, host_account_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [host_account_events.host_account_id, host_account_events.assessment_quarter]
          action_bindings:
            host_account_events.host_account_id: host_account_id
            host_account_events.assessment_quarter: assessment_quarter
        dedup_contract:
          table: host_account_events
          mode: separate_record
          object_bindings: {host_account_id: host_account_id, assessment_quarter: assessment_quarter}
          duplicate_filters: {event_type: [host_travel_credit_issued]}
          distinct_fields: []
    measures: [host_msr_consecutive_met_quarters]

# ============================================================================
# extended_policies (erl-task-instantiate, difficulty host_standing_and_penalties) - rework round 2
# ============================================================================
extended_policies:
- id: host_ext_superhost_redecision
  base_policy_refs:
  - host_tier_assignment
  - host_evt_appeals_and_reinstatement
  - host_evt_strikes_and_suspension
  overwrite:
  - base_policy: host_evt_appeals_and_reinstatement
    superseded_clause: it does not restore Superhost status, which returns only through a later met assessment
    replaced_by: An individual host account whose Superhost assessment fell on a scheduled assessment date while the account
      was suspended has that assessment decided again once its account_suspension appeal stands approved, under the standards
      below; the decision is recorded on the assessment as its outcome and tier effect, and the account's tier follows it.
  - base_policy: host_tier_assignment
    superseded_clause: the assessment is met when the average rating (host_msr_avg_rating_365d) is at least superhost_min_avg_rating,
      the response rate recorded by the messaging system is at least superhost_min_response_rate_pct, the cancellation rate
      (host_msr_cancellation_rate_365d) is below superhost_max_cancellation_rate_pct, and either completed stays (host_msr_completed_stays_365d)
      reach superhost_min_stays_12m or completed stays reach superhost_alt_min_stays_12m with completed nights (host_msr_completed_nights_365d)
      reaching superhost_alt_min_nights_12m
    replaced_by: The decision meets the Superhost standards when the decision's rating figure is at least superhost_min_avg_rating,
      the decision's response figure is at least superhost_min_response_rate_pct, the assessment's recorded cancellation
      rate is below superhost_max_cancellation_rate_pct, and the decision's stays figure reaches superhost_min_stays_12m
      or reaches superhost_alt_min_stays_12m with the assessment's recorded completed nights reaching superhost_alt_min_nights_12m.
  trigger: state_due
  subject:
  - host_tier_updated
  computes: variant_name
  target_tool: apply_superhost_decision_f25b833f
  params:
    long_suspension_days: 14
    short_suspension_grace_days: 3
    full_run_met_assessments: 3
    long_tenure_met_assessments: 8
    mid_tenure_met_assessments: 4
  rule: 'An individual host account whose Superhost assessment fell on a scheduled assessment date while the account was
    suspended has that assessment decided again once its account_suspension appeal stands approved, under the standards
    below; the decision is recorded on the assessment as its outcome and tier effect, and the account''s tier follows it.
    The thresholds of the decision are the published Superhost standards; what this rule settles is the figures they are
    compared with, because the recorded figures of an assessment that fell inside a suspension cover days on which the host
    could not host or answer guests. The decision meets the Superhost standards when the decision''s rating figure is at
    least superhost_min_avg_rating, the decision''s response figure is at least superhost_min_response_rate_pct, the assessment''s
    recorded cancellation rate is below superhost_max_cancellation_rate_pct, and the decision''s stays figure reaches superhost_min_stays_12m
    or reaches superhost_alt_min_stays_12m with the assessment''s recorded completed nights reaching superhost_alt_min_nights_12m.
    The standard rating figure is the average rating recorded at the decided assessment, the standard response figure is
    the decided assessment''s response rate, the decided assessment''s response rate is in the standard case its recorded
    response rate, and the standard stays figure is the completed stays recorded at the decided assessment. A met decision
    records the assessment as met with the tier effect promoted and gives the account the Superhost tier, with Superhost
    status counted from the date of the decision; any other decision records it as not met with the tier effect unchanged
    and leaves the account a Standard Host. The decided assessment''s response rate is worked out by one of three methods:
    for an account whose most recent suspension lasted at least long_suspension_days calendar days, counted from its suspended
    date to the date its account_suspension appeal was approved, and that had a policy strike overturned on a policy_strike
    appeal approved within the 12 months before the decision, it is the recorded response rate prorated to the lookback
    days outside the suspension, that is the recorded rate times superhost_lookback_days divided by superhost_lookback_days
    less the suspension days that fall inside the assessment''s lookback, capped at 100; for an account whose most recent
    suspension lasted at least 1 but fewer than long_suspension_days such days and that had a policy strike overturned in
    the same way, it is the recorded rate prorated in the same way over only the suspension days inside the lookback beyond
    the first short_suspension_grace_days; for every other account it is the recorded response rate; each prorated rate
    is rounded half up to 2 decimal places. The suspension days inside an assessment''s lookback are counted from the suspended
    date to the assessment date, and never more than the length of the suspension. The decision''s response figure is the
    average of the response rates of all of the account''s Superhost assessments dated within the 12 months before the decision,
    the decided assessment''s rate taken as worked out above, when at least full_run_met_assessments of the assessments
    dated within those 12 months were recorded as met; it is the same average over the assessments dated within the 6 months
    before the decision when one or two of them were; for every other account it is the standard response figure. A window
    of a number of months holds the records dated fewer than that many whole calendar months before the date of the decision,
    and each average is rounded half up to 2 decimal places. The decision''s rating figure is the average of the average
    ratings recorded at the account''s Superhost assessments dated within the 12 months before the decision for an account
    with at least long_tenure_met_assessments Superhost assessments recorded as met over its whole history, the average
    of those recorded at its assessments dated within the 6 months before the decision for an account with at least mid_tenure_met_assessments
    but fewer than long_tenure_met_assessments such assessments, and the standard rating figure otherwise. The decision''s
    stays figure is the larger of the completed stays recorded at the decided assessment and at the assessment before it,
    the other assessment dated within the 6 months before the decision, when the suspension days inside the decided assessment''s
    lookback number at least long_suspension_days; it is the average of the completed stays recorded at those two assessments,
    rounded down to a whole stay, when they number at least 1 but fewer than long_suspension_days; it is the standard stays
    figure otherwise.'
  prerequisite: []
  cross_category: []
  compute:
  - asmt_date: LATEST('host_account_events', 'event_date', event_type='host_superhost_assessed')
  - asmt_rating: LATEST('host_account_events', 'average_rating', event_type='host_superhost_assessed')
  - asmt_response: LATEST('host_account_events', 'response_rate_pct', event_type='host_superhost_assessed')
  - asmt_cancel_rate: LATEST('host_account_events', 'cancellation_rate_pct', event_type='host_superhost_assessed')
  - asmt_stays: LATEST('host_account_events', 'stays_12m', event_type='host_superhost_assessed')
  - asmt_nights: LATEST('host_account_events', 'nights_12m', event_type='host_superhost_assessed')
  - suspension_lifted_on: LATEST('host_appeals', 'decided_at', date_field='decided_at', appeal_type='account_suspension',
      appeal_status='approved')
  - suspension_days: DAYS(F('suspended_date'), suspension_lifted_on) if (F('suspended_date') and suspension_lifted_on) else
      0
  - lookback_suspension_days: MN(DAYS(F('suspended_date'), asmt_date), DAYS(F('suspended_date'), suspension_lifted_on))
      if (F('suspended_date') and suspension_lifted_on and DAYS(F('suspended_date'), asmt_date) > 0) else 0
  - strikes_overturned: COUNT('host_appeals', within_months=12, date_field='decided_at', appeal_type='policy_strike', appeal_status='approved')
  - decided_rate: MN(100, RND(asmt_response * P('superhost_lookback_days') / (P('superhost_lookback_days') - lookback_suspension_days),
      2)) if (suspension_days >= K('long_suspension_days') and strikes_overturned >= 1) else (MN(100, RND(asmt_response
      * P('superhost_lookback_days') / (P('superhost_lookback_days') - MX(0, lookback_suspension_days - K('short_suspension_grace_days'))),
      2)) if (suspension_days >= 1 and suspension_days < K('long_suspension_days') and strikes_overturned >= 1) else asmt_response)
  - met_assessments_12m: COUNT('host_account_events', within_months=12, event_type='host_superhost_assessed', assessment_outcome='met')
  - response_sum_12m: SUM('host_account_events', 'response_rate_pct', within_months=12, event_type='host_superhost_assessed')
  - assessments_12m: COUNT('host_account_events', within_months=12, event_type='host_superhost_assessed')
  - response_sum_6m: SUM('host_account_events', 'response_rate_pct', within_months=6, event_type='host_superhost_assessed')
  - assessments_6m: COUNT('host_account_events', within_months=6, event_type='host_superhost_assessed')
  - response_figure: RND((response_sum_12m - asmt_response + decided_rate) / assessments_12m, 2) if met_assessments_12m
      >= K('full_run_met_assessments') else (RND((response_sum_6m - asmt_response + decided_rate) / assessments_6m, 2) if
      met_assessments_12m >= 1 else decided_rate)
  - met_assessments_all: COUNT('host_account_events', event_type='host_superhost_assessed', assessment_outcome='met')
  - rating_sum_12m: SUM('host_account_events', 'average_rating', within_months=12, event_type='host_superhost_assessed')
  - rating_count_12m: COUNT('host_account_events', within_months=12, event_type='host_superhost_assessed')
  - rating_sum_6m: SUM('host_account_events', 'average_rating', within_months=6, event_type='host_superhost_assessed')
  - rating_count_6m: COUNT('host_account_events', within_months=6, event_type='host_superhost_assessed')
  - rating_figure: RND(rating_sum_12m / rating_count_12m, 2) if met_assessments_all >= K('long_tenure_met_assessments')
      else (RND(rating_sum_6m / rating_count_6m, 2) if met_assessments_all >= K('mid_tenure_met_assessments') else asmt_rating)
  - stays_sum_6m: SUM('host_account_events', 'stays_12m', within_months=6, event_type='host_superhost_assessed')
  - stays_count_6m: COUNT('host_account_events', within_months=6, event_type='host_superhost_assessed')
  - stays_figure: MX(asmt_stays, stays_sum_6m - asmt_stays) if lookback_suspension_days >= K('long_suspension_days') else
      (int(stays_sum_6m / MX(1, stays_count_6m)) if lookback_suspension_days >= 1 else asmt_stays)
  - stays_met: stays_figure >= P('superhost_min_stays_12m') or (stays_figure >= P('superhost_alt_min_stays_12m') and asmt_nights
      >= P('superhost_alt_min_nights_12m'))
  - standards_met: rating_figure >= P('superhost_min_avg_rating') and response_figure >= P('superhost_min_response_rate_pct')
      and asmt_cancel_rate < P('superhost_max_cancellation_rate_pct') and stays_met
  - result: '''Superhost'' if standards_met else ''Standard Host'''
  compute_basis:
    asmt_date: The suspension days inside an assessment's lookback are counted from the suspended date to the assessment
      date, and never more than the length of the suspension.
    asmt_rating: The standard rating figure is the average rating recorded at the decided assessment
    asmt_response: the decided assessment's response rate is in the standard case its recorded response rate
    asmt_cancel_rate: the assessment's recorded cancellation rate is below superhost_max_cancellation_rate_pct
    asmt_stays: the standard stays figure is the completed stays recorded at the decided assessment
    asmt_nights: reaches superhost_alt_min_stays_12m with the assessment's recorded completed nights reaching superhost_alt_min_nights_12m
    suspension_lifted_on: counted from its suspended date to the date its account_suspension appeal was approved
    suspension_days: for an account whose most recent suspension lasted at least long_suspension_days calendar days, counted
      from its suspended date to the date its account_suspension appeal was approved
    lookback_suspension_days: The suspension days inside an assessment's lookback are counted from the suspended date to
      the assessment date, and never more than the length of the suspension.
    strikes_overturned: that had a policy strike overturned on a policy_strike appeal approved within the 12 months before
      the decision
    decided_rate: 'The decided assessment''s response rate is worked out by one of three methods: for an account whose most
      recent suspension lasted at least long_suspension_days calendar days, counted from its suspended date to the date
      its account_suspension appeal was approved, and that had a policy strike overturned on a policy_strike appeal approved
      within the 12 months before the decision, it is the recorded response rate prorated to the lookback days outside the
      suspension, that is the recorded rate times superhost_lookback_days divided by superhost_lookback_days less the suspension
      days that fall inside the assessment''s lookback, capped at 100; for an account whose most recent suspension lasted
      at least 1 but fewer than long_suspension_days such days and that had a policy strike overturned in the same way,
      it is the recorded rate prorated in the same way over only the suspension days inside the lookback beyond the first
      short_suspension_grace_days; for every other account it is the recorded response rate; each prorated rate is rounded
      half up to 2 decimal places.'
    met_assessments_12m: when at least full_run_met_assessments of the assessments dated within those 12 months were recorded
      as met
    response_sum_12m: the average of the response rates of all of the account's Superhost assessments dated within the 12
      months before the decision, the decided assessment's rate taken as worked out above
    assessments_12m: the average of the response rates of all of the account's Superhost assessments dated within the 12
      months before the decision
    response_sum_6m: it is the same average over the assessments dated within the 6 months before the decision when one
      or two of them were
    assessments_6m: it is the same average over the assessments dated within the 6 months before the decision
    response_figure: The decision's response figure is the average of the response rates of all of the account's Superhost
      assessments dated within the 12 months before the decision, the decided assessment's rate taken as worked out above,
      when at least full_run_met_assessments of the assessments dated within those 12 months were recorded as met; it is
      the same average over the assessments dated within the 6 months before the decision when one or two of them were;
      for every other account it is the standard response figure. A window of a number of months holds the records dated
      fewer than that many whole calendar months before the date of the decision, and each average is rounded half up to
      2 decimal places.
    met_assessments_all: for an account with at least long_tenure_met_assessments Superhost assessments recorded as met
      over its whole history
    rating_sum_12m: the average of the average ratings recorded at the account's Superhost assessments dated within the
      12 months before the decision
    rating_count_12m: the average of the average ratings recorded at the account's Superhost assessments dated within the
      12 months before the decision
    rating_sum_6m: the average of those recorded at its assessments dated within the 6 months before the decision
    rating_count_6m: the average of those recorded at its assessments dated within the 6 months before the decision
    rating_figure: The decision's rating figure is the average of the average ratings recorded at the account's Superhost
      assessments dated within the 12 months before the decision for an account with at least long_tenure_met_assessments
      Superhost assessments recorded as met over its whole history, the average of those recorded at its assessments dated
      within the 6 months before the decision for an account with at least mid_tenure_met_assessments but fewer than long_tenure_met_assessments
      such assessments, and the standard rating figure otherwise.
    stays_sum_6m: the larger of the completed stays recorded at the decided assessment and at the assessment before it,
      the other assessment dated within the 6 months before the decision
    stays_count_6m: it is the average of the completed stays recorded at those two assessments, rounded down to a whole
      stay
    stays_figure: The decision's stays figure is the larger of the completed stays recorded at the decided assessment and
      at the assessment before it, the other assessment dated within the 6 months before the decision, when the suspension
      days inside the decided assessment's lookback number at least long_suspension_days; it is the average of the completed
      stays recorded at those two assessments, rounded down to a whole stay, when they number at least 1 but fewer than
      long_suspension_days; it is the standard stays figure otherwise.
    stays_met: the decision's stays figure reaches superhost_min_stays_12m or reaches superhost_alt_min_stays_12m with the
      assessment's recorded completed nights reaching superhost_alt_min_nights_12m
    standards_met: The decision meets the Superhost standards when the decision's rating figure is at least superhost_min_avg_rating,
      the decision's response figure is at least superhost_min_response_rate_pct, the assessment's recorded cancellation
      rate is below superhost_max_cancellation_rate_pct, and the decision's stays figure reaches superhost_min_stays_12m
      or reaches superhost_alt_min_stays_12m with the assessment's recorded completed nights reaching superhost_alt_min_nights_12m.
    result: A met decision records the assessment as met with the tier effect promoted and gives the account the Superhost
      tier, with Superhost status counted from the date of the decision; any other decision records it as not met with the
      tier effect unchanged and leaves the account a Standard Host.
  factors:
  - id: suspension_response_proration
    effect: method
    decides: decided_rate
    bindings:
    - suspension_lifted_on
    - suspension_days
    - strikes_overturned
    - decided_rate
    ladder:
    - when: the most recent suspension lasted at least long_suspension_days calendar days (suspended date to the approval
        of its account_suspension appeal) AND a policy strike was overturned on a policy_strike appeal approved within the
        12 months before the decision
      method: the decided assessment's response rate is its recorded rate times superhost_lookback_days divided by superhost_lookback_days
        less every suspension day inside its lookback, capped at 100, rounded half up to 2 decimals
    - when: the most recent suspension lasted at least 1 but fewer than long_suspension_days calendar days AND a policy
        strike was overturned the same way
      method: the recorded rate is prorated the same way over only the suspension days inside the lookback beyond the first
        short_suspension_grace_days
    - when: otherwise
      method: the decided assessment's response rate is its recorded response rate
    baseline:
      decided_rate: asmt_response
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: run_response_window
    effect: parameter
    decides: response_figure
    bindings:
    - met_assessments_12m
    - response_sum_12m
    - assessments_12m
    - response_sum_6m
    - assessments_6m
    - response_figure
    ladder:
    - when: at least full_run_met_assessments of the account's Superhost assessments dated within the 12 months before the
        decision were recorded as met
      value: 12 months of assessments averaged (every assessment dated within the 12 months before the decision, the decided
        one at its worked-out rate), rounded half up to 2 decimals
    - when: one or two of the assessments dated within the 12 months were recorded as met
      value: 6 months of assessments averaged, the same way
    - when: otherwise
      value: 'no other assessment averaged: the decided assessment''s response rate'
    baseline:
      response_figure: decided_rate
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_rating_window
    effect: parameter
    decides: rating_figure
    bindings:
    - met_assessments_all
    - rating_sum_12m
    - rating_count_12m
    - rating_sum_6m
    - rating_count_6m
    - rating_figure
    ladder:
    - when: the account has at least long_tenure_met_assessments Superhost assessments recorded as met over its whole history
      value: 12 months of assessments averaged (the ratings of the assessments dated within the 12 months before the decision)
    - when: the account has at least mid_tenure_met_assessments but fewer than long_tenure_met_assessments such assessments
      value: 6 months of assessments averaged
    - when: otherwise
      value: the decided assessment's own recorded rating
    baseline:
      rating_figure: asmt_rating
    evidence:
    - history
    cross_difficulty: null
  - id: suspension_stays_figure
    effect: method
    decides: stays_figure
    bindings:
    - lookback_suspension_days
    - stays_sum_6m
    - stays_count_6m
    - stays_figure
    ladder:
    - when: the suspension days inside the decided assessment's lookback number at least long_suspension_days
      method: the stays figure is the larger of the completed stays recorded at the decided assessment and at the assessment
        before it
    - when: the suspension days inside the lookback number at least 1 but fewer than long_suspension_days
      method: the stays figure is the average of the completed stays recorded at those two assessments, rounded down
    - when: otherwise
      method: the stays figure is the completed stays recorded at the decided assessment
    baseline:
      stays_figure: asmt_stays
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: The decision meets the Superhost standards when the decision's rating figure is at least superhost_min_avg_rating,
      the decision's response figure is at least superhost_min_response_rate_pct, the assessment's recorded cancellation
      rate is below superhost_max_cancellation_rate_pct, and the decision's stays figure reaches superhost_min_stays_12m
      or reaches superhost_alt_min_stays_12m with the assessment's recorded completed nights reaching superhost_alt_min_nights_12m.
      The standard rating figure is the average rating recorded at the decided assessment, the standard response figure
      is the decided assessment's response rate, the decided assessment's response rate is in the standard case its recorded
      response rate, and the standard stays figure is the completed stays recorded at the decided assessment. A met decision
      records the assessment as met with the tier effect promoted and gives the account the Superhost tier, with Superhost
      status counted from the date of the decision; any other decision records it as not met with the tier effect unchanged
      and leaves the account a Standard Host.
    params:
    - superhost_min_avg_rating
    - superhost_min_response_rate_pct
    - superhost_max_cancellation_rate_pct
    - superhost_min_stays_12m
    - superhost_alt_min_stays_12m
    - superhost_alt_min_nights_12m
    - superhost_lookback_days
  inputs:
