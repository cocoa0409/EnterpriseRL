    - table: host_account_events
      aggregate: latest
      field: stays_12m
      filters:
        event_type: host_superhost_assessed
    - table: host_account_events
      aggregate: sum
      field: stays_12m
      within_months: 12
      filters:
        event_type: host_superhost_assessed
    - table: host_account_events
      aggregate: sum
      field: response_rate_pct
      within_months: 12
      filters:
        event_type: host_superhost_assessed
