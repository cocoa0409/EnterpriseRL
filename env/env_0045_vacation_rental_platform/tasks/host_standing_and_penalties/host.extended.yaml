- id: host_ext_superhost_travel_credit
  base_policy_refs:
  - host_evt_superhost_travel_credit
  - host_tier_assignment
  overwrite:
  - base_policy: host_evt_superhost_travel_credit
    superseded_clause: A Superhost whose run of consecutive met assessments (host_msr_consecutive_met_quarters) reaches
      superhost_credit_consecutive_quarters receives one Roamhaven travel credit of superhost_travel_credit_usd, and the
      run then restarts.
    replaced_by: The travel credit is the sum of its base amount and its stays bonus, rounded half up to the cent.
  - base_policy: host_evt_superhost_travel_credit
    superseded_clause: a host who is not a Superhost on the day of the completing assessment earns nothing for the run
    replaced_by: whether the host earns it is decided by the tier that the decision recorded on the completing assessment
      gives the account, and only a tier whose superhost_travel_credit_usd is above 0.00 earns it
  trigger: state_due
  subject:
  - host_travel_credit_issued
  computes: amount
  target_tool: claim_superhost_travel_credit_0d8c95c2
  params:
    third_run_multiple: 1.5
    second_run_multiple: 1.25
    high_nights: 100
    mid_nights: 50
    stays_bonus_rate_high: 3.0
    stays_bonus_rate_mid: 2.0
    stays_bonus_rate_standard: 1.0
    long_suspension_days: 14
    response_bonus_high_pct: 92.0
    response_bonus_mid_pct: 88.0
    response_bonus_high: 25.0
    response_bonus_mid: 10.0
    rewards_bonus_top: 40.0
    rewards_bonus_mid: 20.0
    rating_bonus_high_avg: 4.9
    rating_bonus_mid_avg: 4.85
    rating_bonus_high: 20.0
    rating_bonus_mid: 10.0
  rule: 'A Superhost''s run is the number of the account''s consecutive Superhost assessments recorded as met, counted back
    from the newest and restarting after each travel credit issued (host_msr_consecutive_met_quarters). When the run reaches
    superhost_credit_consecutive_quarters, the host earns one travel credit for the run, booked once against the quarter
    of the completing assessment when the host accepts it; whether the host earns it is decided by the tier that the decision
    recorded on the completing assessment gives the account, and only a tier whose superhost_travel_credit_usd is above
    0.00 earns it. On the quarterly assessment schedule a run is complete when the account''s Superhost assessments recorded
    as met and dated within the 12 months before the credit number at least superhost_credit_consecutive_quarters, and the
    credit for an incomplete run is 0.00. The travel credit for a run is fixed only after the account holds the host tier
    that its most recent Superhost assessment earns it. The travel credit is the sum of its base amount and its stays bonus,
    rounded half up to the cent. The standard base amount is the tier''s superhost_travel_credit_usd. The standard stays
    bonus is stays_bonus_rate_standard for each completed stay recorded at the completing assessment. The base amount is
    third_run_multiple times the tier''s superhost_travel_credit_usd for a host who already holds at least two earlier travel
    credits, second_run_multiple times it for a host who holds exactly one earlier travel credit, and the standard base
    amount for any other host, each multiple rounded half up to the cent. The stays bonus is paid per completed stay at
    stays_bonus_rate_high when the completing assessment records at least high_nights completed nights, at stays_bonus_rate_mid
    when it records at least mid_nights but fewer than high_nights completed nights, and at stays_bonus_rate_standard otherwise.
    The completed stays the stays bonus pays on are worked out by one of three methods: for a host whose most recent suspension
    began within the 12 months before the credit and lasted at least long_suspension_days calendar days, counted from its
    suspended date to the date its account_suspension appeal was approved, they are the average of the completed stays recorded
    at the account''s Superhost assessments dated within those 12 months other than the completing assessment; for a host
    whose most recent suspension began within those 12 months and lasted at least 1 but fewer than long_suspension_days
    such days, they are the average of the completed stays recorded at all of the account''s Superhost assessments dated
    within those 12 months; for any other host they are the completed stays recorded at the completing assessment. Each
    such average is rounded down to a whole stay, and a window of 12 months holds the records dated fewer than 12 whole
    calendar months before the date of the credit. A travel credit also carries a response bonus of response_bonus_high
    when the response rates recorded at the account''s Superhost assessments recorded as met and dated within the 12 months
    before the credit average at least response_bonus_high_pct, a response bonus of response_bonus_mid when they average
    at least response_bonus_mid_pct but less than response_bonus_high_pct, and no response bonus otherwise. A travel credit
    also carries a Rewards bonus of rewards_bonus_top for a host who holds an active Roamhaven Rewards membership at Rewards
    Platinum, Rewards Diamond or Rewards Ambassador, a Rewards bonus of rewards_bonus_mid for a host who holds an active
    membership at Rewards Silver or Rewards Gold, and no Rewards bonus otherwise. A travel credit also carries a rating
    bonus of rating_bonus_high when the average ratings recorded at the account''s Superhost assessments recorded as met
    and dated within the 12 months before the credit average at least rating_bonus_high_avg, a rating bonus of rating_bonus_mid
    when they average at least rating_bonus_mid_avg but less than rating_bonus_high_avg, and no rating bonus otherwise.
    The response, Rewards and rating bonuses are added to the base amount and the stays bonus before that sum is rounded.'
  prerequisite:
  - problem: host_ext_superhost_redecision
    kind: value_input
    gate: tier_credit
    form: state
    policy_source: The travel credit for a run is fixed only after the account holds the host tier that its most recent
      Superhost assessment earns it.
    condition: host_accounts.variant_name equals the tier that the decision recorded on the account's most recent host_superhost_assessed
      record gives it (Superhost when that record's assessment_outcome is met); an assessment that fell inside a suspension
      later overturned carries that decision only once it has been decided again on its metrics.
    resolved_by: apply_superhost_decision_f25b833f
    effect: tier_credit becomes the superhost_travel_credit_usd of the tier the decision gives the account (100.00 for Superhost
      instead of 0.00 for Standard Host), and the decided assessment is recorded as met, so the run counted in met_run reaches
      superhost_credit_consecutive_quarters; the credit is earned and its base amount becomes a multiple of 100.00.
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    - status
    note: The Rewards-bonus factor takes its tier from the host's own active Roamhaven Rewards membership (the guest loyalty
      product).
  compute:
  - tier_credit: P('superhost_travel_credit_usd')
  - earlier_credits: COUNT('host_account_events', event_type='host_travel_credit_issued')
  - base_amount: RND(tier_credit * K('third_run_multiple'), 2) if earlier_credits >= 2 else (RND(tier_credit * K('second_run_multiple'),
      2) if earlier_credits >= 1 else tier_credit)
  - completing_nights: LATEST('host_account_events', 'nights_12m', event_type='host_superhost_assessed')
  - stays_bonus_rate: K('stays_bonus_rate_high') if completing_nights >= K('high_nights') else (K('stays_bonus_rate_mid')
      if completing_nights >= K('mid_nights') else K('stays_bonus_rate_standard'))
  - completing_stays: LATEST('host_account_events', 'stays_12m', event_type='host_superhost_assessed')
  - run_stays_sum: SUM('host_account_events', 'stays_12m', within_months=12, event_type='host_superhost_assessed')
  - run_assessments: COUNT('host_account_events', within_months=12, event_type='host_superhost_assessed')
  - suspension_lifted_on: LATEST('host_appeals', 'decided_at', date_field='decided_at', appeal_type='account_suspension',
      appeal_status='approved')
  - run_suspension_days: DAYS(F('suspended_date'), suspension_lifted_on) if (F('suspended_date') and suspension_lifted_on
      and MONTHS(F('suspended_date'), NOW) < 12) else 0
  - stays_counted: int((run_stays_sum - completing_stays) / MX(1, run_assessments - 1)) if run_suspension_days >= K('long_suspension_days')
      else (int(run_stays_sum / MX(1, run_assessments)) if run_suspension_days >= 1 else completing_stays)
  - met_response_sum: SUM('host_account_events', 'response_rate_pct', within_months=12, event_type='host_superhost_assessed',
      assessment_outcome='met')
  - met_response_count: COUNT('host_account_events', within_months=12, event_type='host_superhost_assessed', assessment_outcome='met')
  - response_bonus: K('response_bonus_high') if met_response_sum >= K('response_bonus_high_pct') * MX(1, met_response_count)
      else (K('response_bonus_mid') if met_response_sum >= K('response_bonus_mid_pct') * MX(1, met_response_count) else
      0.0)
  - rewards_tier: CFIELD('rewards', 'variant_name', status='active')
  - rewards_bonus: K('rewards_bonus_top') if (rewards_tier == 'Rewards Platinum' or rewards_tier == 'Rewards Diamond' or
      rewards_tier == 'Rewards Ambassador') else (K('rewards_bonus_mid') if (rewards_tier == 'Rewards Silver' or rewards_tier
      == 'Rewards Gold') else 0.0)
  - met_rating_sum: SUM('host_account_events', 'average_rating', within_months=12, event_type='host_superhost_assessed',
      assessment_outcome='met')
  - met_rating_count: COUNT('host_account_events', within_months=12, event_type='host_superhost_assessed', assessment_outcome='met')
  - rating_bonus: K('rating_bonus_high') if met_rating_sum >= K('rating_bonus_high_avg') * MX(1, met_rating_count) else
      (K('rating_bonus_mid') if met_rating_sum >= K('rating_bonus_mid_avg') * MX(1, met_rating_count) else 0.0)
  - credit_total: base_amount + RND(stays_bonus_rate * stays_counted, 2) + response_bonus + rewards_bonus + rating_bonus
  - met_run: COUNT('host_account_events', within_months=12, event_type='host_superhost_assessed', assessment_outcome='met')
  - result: RND(credit_total, 2) if (tier_credit > 0 and met_run >= P('superhost_credit_consecutive_quarters')) else 0.0
  compute_basis:
    tier_credit: only a tier whose superhost_travel_credit_usd is above 0.00 earns it
    earlier_credits: for a host who already holds at least two earlier travel credits
    base_amount: The base amount is third_run_multiple times the tier's superhost_travel_credit_usd for a host who already
      holds at least two earlier travel credits, second_run_multiple times it for a host who holds exactly one earlier travel
      credit, and the standard base amount for any other host, each multiple rounded half up to the cent.
    completing_nights: when the completing assessment records at least high_nights completed nights
    stays_bonus_rate: The stays bonus is paid per completed stay at stays_bonus_rate_high when the completing assessment
      records at least high_nights completed nights, at stays_bonus_rate_mid when it records at least mid_nights but fewer
      than high_nights completed nights, and at stays_bonus_rate_standard otherwise.
    completing_stays: for any other host they are the completed stays recorded at the completing assessment
    run_stays_sum: the average of the completed stays recorded at all of the account's Superhost assessments dated within
      those 12 months
    run_assessments: the average of the completed stays recorded at all of the account's Superhost assessments dated within
      those 12 months
    suspension_lifted_on: counted from its suspended date to the date its account_suspension appeal was approved
    run_suspension_days: for a host whose most recent suspension began within the 12 months before the credit and lasted
      at least long_suspension_days calendar days, counted from its suspended date to the date its account_suspension appeal
      was approved
    stays_counted: 'The completed stays the stays bonus pays on are worked out by one of three methods: for a host whose
      most recent suspension began within the 12 months before the credit and lasted at least long_suspension_days calendar
      days, counted from its suspended date to the date its account_suspension appeal was approved, they are the average
      of the completed stays recorded at the account''s Superhost assessments dated within those 12 months other than the
      completing assessment; for a host whose most recent suspension began within those 12 months and lasted at least 1
      but fewer than long_suspension_days such days, they are the average of the completed stays recorded at all of the
      account''s Superhost assessments dated within those 12 months; for any other host they are the completed stays recorded
      at the completing assessment. Each such average is rounded down to a whole stay, and a window of 12 months holds the
      records dated fewer than 12 whole calendar months before the date of the credit.'
    met_response_sum: the response rates recorded at the account's Superhost assessments recorded as met and dated within
      the 12 months before the credit
    met_response_count: the response rates recorded at the account's Superhost assessments recorded as met and dated within
      the 12 months before the credit average
    response_bonus: A travel credit also carries a response bonus of response_bonus_high when the response rates recorded
      at the account's Superhost assessments recorded as met and dated within the 12 months before the credit average at
      least response_bonus_high_pct, a response bonus of response_bonus_mid when they average at least response_bonus_mid_pct
      but less than response_bonus_high_pct, and no response bonus otherwise.
    rewards_tier: for a host who holds an active Roamhaven Rewards membership at Rewards Platinum, Rewards Diamond or Rewards
      Ambassador
    rewards_bonus: A travel credit also carries a Rewards bonus of rewards_bonus_top for a host who holds an active Roamhaven
      Rewards membership at Rewards Platinum, Rewards Diamond or Rewards Ambassador, a Rewards bonus of rewards_bonus_mid
      for a host who holds an active membership at Rewards Silver or Rewards Gold, and no Rewards bonus otherwise.
    met_rating_sum: the average ratings recorded at the account's Superhost assessments recorded as met and dated within
      the 12 months before the credit
    met_rating_count: the average ratings recorded at the account's Superhost assessments recorded as met and dated within
      the 12 months before the credit average
    rating_bonus: A travel credit also carries a rating bonus of rating_bonus_high when the average ratings recorded at
      the account's Superhost assessments recorded as met and dated within the 12 months before the credit average at least
      rating_bonus_high_avg, a rating bonus of rating_bonus_mid when they average at least rating_bonus_mid_avg but less
      than rating_bonus_high_avg, and no rating bonus otherwise.
    credit_total: The response, Rewards and rating bonuses are added to the base amount and the stays bonus before that
      sum is rounded.
    result: The travel credit is the sum of its base amount and its stays bonus, rounded half up to the cent.
    met_run: On the quarterly assessment schedule a run is complete when the account's Superhost assessments recorded as
      met and dated within the 12 months before the credit number at least superhost_credit_consecutive_quarters, and the
      credit for an incomplete run is 0.00.
  factors:
  - id: earlier_credits_base_amount
    effect: parameter
    decides: base_amount
    bindings:
    - earlier_credits
    - base_amount
    ladder:
    - when: the host already holds at least two earlier travel credits
      value: third_run_multiple times the tier's superhost_travel_credit_usd
    - when: the host holds exactly one earlier travel credit
      value: second_run_multiple times the tier's superhost_travel_credit_usd
    - when: otherwise
      value: the tier's superhost_travel_credit_usd
    baseline:
      base_amount: tier_credit
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: nights_stays_bonus_rate
    effect: parameter
    decides: stays_bonus_rate
    bindings:
    - completing_nights
    - stays_bonus_rate
    ladder:
    - when: the completing assessment records at least high_nights completed nights
      value: K('stays_bonus_rate_high')
    - when: the completing assessment records at least mid_nights but fewer than high_nights completed nights
      value: K('stays_bonus_rate_mid')
    - when: otherwise
      value: K('stays_bonus_rate_standard')
    baseline:
      stays_bonus_rate: K('stays_bonus_rate_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: suspension_stays_counted
    effect: method
    decides: stays_counted
    bindings:
    - completing_stays
    - run_stays_sum
    - run_assessments
    - suspension_lifted_on
    - run_suspension_days
    - stays_counted
    ladder:
    - when: the host's most recent suspension began within the 12 months before the credit and lasted at least long_suspension_days
        calendar days
      method: the stays counted are the average of the completed stays recorded at the account's Superhost assessments dated
        within those 12 months other than the completing assessment, rounded down to a whole stay
    - when: the host's most recent suspension began within those 12 months and lasted at least 1 but fewer than long_suspension_days
        calendar days
      method: the stays counted are the average of the completed stays recorded at all of the account's Superhost assessments
        dated within those 12 months, rounded down to a whole stay
    - when: otherwise
      method: the stays counted are the completed stays recorded at the completing assessment
    baseline:
      stays_counted: completing_stays
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: met_response_bonus
    effect: parameter
    decides: response_bonus
    bindings:
    - met_response_sum
    - met_response_count
    - response_bonus
    ladder:
    - when: the response rates recorded at the Superhost assessments recorded as met within the 12 months before the credit
        average at least response_bonus_high_pct
      value: K('response_bonus_high')
    - when: they average at least response_bonus_mid_pct but less than response_bonus_high_pct
      value: K('response_bonus_mid')
    - when: otherwise
      value: no response bonus (0.00)
    baseline:
      response_bonus: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: rewards_membership_bonus
    effect: parameter
    decides: rewards_bonus
    bindings:
    - rewards_tier
    - rewards_bonus
    ladder:
    - when: the host holds an active Roamhaven Rewards membership at Rewards Platinum, Rewards Diamond or Rewards Ambassador
      value: K('rewards_bonus_top')
    - when: the host holds an active Roamhaven Rewards membership at Rewards Silver or Rewards Gold
      value: K('rewards_bonus_mid')
    - when: otherwise
      value: no Rewards bonus (0.00)
    baseline:
      rewards_bonus: '0.0'
    evidence:
    - cross_category
    cross_difficulty: rewards
  - id: met_rating_bonus
    effect: parameter
    decides: rating_bonus
    bindings:
    - met_rating_sum
    - met_rating_count
    - rating_bonus
    ladder:
    - when: the average ratings recorded at the Superhost assessments recorded as met within the 12 months before the credit
        average at least rating_bonus_high_avg
      value: K('rating_bonus_high')
    - when: they average at least rating_bonus_mid_avg but less than rating_bonus_high_avg
      value: K('rating_bonus_mid')
    - when: otherwise
      value: no rating bonus (0.00)
    baseline:
      rating_bonus: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The travel credit is the sum of its base amount and its stays bonus, rounded half up to the cent. The standard
      base amount is the tier's superhost_travel_credit_usd. The standard stays bonus is stays_bonus_rate_standard for each
