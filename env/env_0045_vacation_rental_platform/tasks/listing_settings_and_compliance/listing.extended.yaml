            value: "K('clean_sublimit_mid_allowance')"
          - when: "otherwise (that sublimit is above clean_sublimit_mid_max)"
            value: "0"
        baseline:
          clean_sublimit_allowance: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: protect
      - id: cleaning_deductible_allowance
        effect: parameter
        decides: clean_deductible_allowance
        bindings: [plan_clean_deductible, clean_deductible_allowance]
        ladder:
          - when: "the active HostCover level's deductible is at least clean_deductible_high_min"
            value: "K('clean_deductible_high_allowance')"
          - when: "that deductible is at least clean_deductible_mid_min and below clean_deductible_high_min"
            value: "K('clean_deductible_mid_allowance')"
          - when: "otherwise (that deductible is below clean_deductible_mid_min)"
            value: "0"
        baseline:
          clean_deductible_allowance: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: protect
      - id: superhost_cleaning_allowance
        effect: parameter
        decides: superhost_cleaning_allowance
        bindings: [host_tier_now, superhost_months, superhost_cleaning_allowance]
        ladder:
          - when: "the host account's tier is Superhost and superhost_since lies superhost_standing_months or more whole months back"
            value: "K('superhost_long_allowance')"
          - when: "the host account's tier is Superhost and superhost_since lies fewer whole months back"
            value: "K('superhost_short_allowance')"
          - when: "otherwise (any other host tier)"
            value: "0"
        baseline:
          superhost_cleaning_allowance: "0"
        evidence: [cross_category, date]
        cross_difficulty: host
      - id: listing_tenure_allowance
        effect: parameter
        decides: tenure_cleaning_allowance
        bindings: [months_listed, tenure_cleaning_allowance]
        ladder:
          - when: "first_listed_date lies tenure_long_months or more whole months back"
            value: "K('tenure_long_allowance')"
          - when: "first_listed_date lies at least tenure_mid_months and fewer than tenure_long_months whole months back"
            value: "K('tenure_mid_allowance')"
          - when: "otherwise (fewer than tenure_mid_months whole months back)"
            value: "0"
        baseline:
          tenure_cleaning_allowance: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A listing's regular cleaning fee may be no higher than its cleaning-fee ceiling, and a cleaning fee
        standing above that ceiling is reset to the ceiling exactly, the reset being logged as one change of
        the cleaning fee; a cleaning fee at or below the ceiling is left as it stands, and the reset leaves the
        short-stay cleaning fee as it stands. The standard cleaning-fee ceiling is the space type's
        cleaning_fee_max_usd, in US dollars to the cent.
      params: [cleaning_fee_max_usd]
    inputs:
      history:
        - {table: listing_events, aggregate: count, field: listing_event_id, within_months: 24, filters: {event_type: listing_quality_reviewed}}
        - {category: protect, table: protection_claims, aggregate: count, field: claim_id, within_months: 6, filters: {damage_category: deep_cleaning, claim_status: approved}}
        - {category: protect, table: protection_claims, aggregate: sum, field: verified_loss_amount, within_months: 6, filters: {damage_category: deep_cleaning, claim_status: approved}}
      cross_category: [protect, host]
  - id: listing_ext_short_stay_cleaning_fee
    base_policy_refs: [listing_evt_fee_settings, listing_evt_discounts, listing_evt_quality_assessment]
    overwrite:
      - base_policy: listing_evt_fee_settings
        superseded_clause: >-
          must not exceed the regular cleaning fee
        replaced_by: >-
          The short-stay cleaning fee may be set at any amount up to the listing's short-stay ceiling, which is
          the regular cleaning fee on the listing multiplied by the listing's short-stay share, rounded half up
          to the cent at that final step only.
    trigger: on_request
    subject: [listing_pricing_updated, listing_fee_change_logged]
    computes: short_stay_cleaning_fee
    target_tool: save_short_stay_cleaning_fee_f18844b5
    params:
      standard_short_stay_share: 0.50
      typical_stay_min_stays: 10
      damage_two_add: 0.10
      damage_one_add: 0.05
      pet_two_add: 0.06
      pet_one_add: 0.03
      deep_two_add: 0.08
      deep_one_add: 0.04
      two_warning_cut: 0.20
      one_warning_cut: 0.10
    rule: >-
      A short-stay cleaning fee may be set only where the space type's short_stay_cleaning_fee_allowed is
      true, and it replaces the regular cleaning fee on stays of short_stay_max_nights nights or fewer. The
      short-stay cleaning fee exists to keep one- and two-night stays affordable, and a short-stay guest who
      brings a pet pays the pet fee on the same stay, so the per-stay fees of a listing are judged together.
      The short-stay cleaning fee may be set at any amount up to the listing's short-stay ceiling, which is the
      regular cleaning fee on the listing multiplied by the listing's short-stay share, rounded half up to the
      cent at that final step only. A host who asks for the highest short-stay cleaning fee the listing may
      carry has the short-stay ceiling itself saved as the short-stay cleaning fee. The standard short-stay
      share is standard_short_stay_share. The short-stay ceiling is fixed only after the regular cleaning fee
      on the listing stands at or below the listing's cleaning-fee ceiling. A short-stay cleaning fee is not
      added to a listing until the pet fee on that listing stands at or below the listing's pet-fee ceiling.
      Typical-stay base of the short-stay share, read from the most recent Superhost assessment recorded on
      the host account: when that assessment counted typical_stay_min_stays or more completed stays, the base
      is the standard short-stay share plus the standard short-stay share multiplied by short_stay_max_nights
      divided by the account's average stay (its completed nights divided by its completed stays), that last
      fraction counted as 1 when it is above 1; when that assessment counted at least one but fewer than
      typical_stay_min_stays completed stays, the base is the standard short-stay share plus the standard
      short-stay share multiplied by short_stay_max_nights divided by weekly_discount_min_nights; when the host
      account carries no Superhost assessment, or the most recent one counted no completed stays, the base is
      the standard short-stay share alone. Damage
      addition: when two or more HostCover claims in the property_damage category that the claims team
      approved were filed on the listing within the last twenty-four months (fewer than twenty-four whole
      months before the day of the save, counted from the date part of filed_at), damage_two_add is added to the share; when
      exactly one was, damage_one_add is added; when none was, nothing is added. Pet turnover addition: when
      two or more approved HostCover claims in the pet_damage category were filed on the listing within the
      last twenty-four months (fewer than twenty-four whole months before the day of the save), pet_two_add
      is added; when exactly one was, pet_one_add is added; when none was, nothing is added. Deep-cleaning
      turnover addition: when two or more approved HostCover claims in the deep_cleaning category were filed
      on the listing within the last twenty-four months, deep_two_add is added; when exactly one was,
      deep_one_add is added; when none was, nothing is added. Guest-rating cut: when two or more quality
      assessments with outcome warning were recorded on the listing within the last six months (fewer than
      six whole months before the day of the save), two_warning_cut is taken off the share; when exactly one
      was, one_warning_cut is taken off; when none was, nothing is taken off. The short-stay share is the
      typical-stay base plus the three additions minus the guest-rating cut, all combined into one share
      before it is applied once to the regular cleaning fee; a share above 1 is counted as 1, so the
      short-stay ceiling never exceeds the regular cleaning fee.
    prerequisite:
      - problem: listing_ext_cleaning_fee_ceiling
        kind: value_input
        gate: regular_cleaning_fee
        form: state
        policy_source: >-
          The short-stay ceiling is fixed only after the regular cleaning fee on the listing stands at or below
          the listing's cleaning-fee ceiling.
        condition: >-
          listings.cleaning_fee of the listing is at or below the listing's cleaning-fee ceiling on the day of
          the save; a cleaning fee that stood above it has been reset to the ceiling, and that reset is logged
          on the listing as a cleaning_fee change dated that day
        resolved_by: reset_cleaning_fee_77ae9a3d
        effect: >-
          regular_cleaning_fee, the base the short-stay share is applied to, becomes the cleaning fee as reset to
          the cleaning-fee ceiling instead of the fee that stood above it, so the short-stay ceiling is worked
          out on the reset fee
      - problem: listing_ext_pet_fee_ceiling
        kind: state_gate
        gate: listings.pet_fee
        form: state
        policy_source: >-
          A short-stay cleaning fee is not added to a listing until the pet fee on that listing stands at or
          below the listing's pet-fee ceiling.
        condition: >-
          listings.pet_fee of the listing is at or below the listing's pet-fee ceiling on the day of the save;
          a pet fee that stood above it has been reset to the ceiling, and that reset is logged on the listing
          as a pet_fee change dated that day
        resolved_by: reset_pet_fee_f8e15273
        effect: >-
          the gate on adding a short-stay cleaning fee opens: the listing's pet fee no longer stands above its
          pet-fee ceiling once it has been reset to that ceiling
    cross_category:
      - category: host
        as: history
        reads: [host_account_events.stays_12m, host_account_events.nights_12m]
        note: the typical-stay base of the short-stay share reads the completed stays and nights of the most recent Superhost assessment on the host account
      - category: protect
        as: history
        reads: [protection_claims.damage_category, protection_claims.claim_status, protection_claims.filed_at]
        note: the damage, pet turnover and deep-cleaning turnover additions count the listing's approved HostCover claims by category
    compute:
      - regular_cleaning_fee: "F('cleaning_fee')"
      - assessed_stays: "XLATEST('host', 'host_account_events', 'stays_12m', event_type='host_superhost_assessed') or 0"
      - assessed_nights: "XLATEST('host', 'host_account_events', 'nights_12m', event_type='host_superhost_assessed') or 0"
      - short_stay_base_share: "K('standard_short_stay_share') + K('standard_short_stay_share') * MN(1, P('short_stay_max_nights') * assessed_stays / assessed_nights) if assessed_stays >= K('typical_stay_min_stays') else (K('standard_short_stay_share') + K('standard_short_stay_share') * P('short_stay_max_nights') / P('weekly_discount_min_nights') if assessed_stays >= 1 else K('standard_short_stay_share'))"
      - property_damage_24m: "XCOUNT('protect', 'protection_claims', within_months=24, date_field='filed_at', listing_id=HID, damage_category='property_damage', claim_status='approved')"
      - short_stay_damage_add: "K('damage_two_add') if property_damage_24m >= 2 else (K('damage_one_add') if property_damage_24m == 1 else 0)"
      - pet_damage_24m: "XCOUNT('protect', 'protection_claims', within_months=24, date_field='filed_at', listing_id=HID, damage_category='pet_damage', claim_status='approved')"
      - short_stay_pet_add: "K('pet_two_add') if pet_damage_24m >= 2 else (K('pet_one_add') if pet_damage_24m == 1 else 0)"
      - deep_clean_24m: "XCOUNT('protect', 'protection_claims', within_months=24, date_field='filed_at', listing_id=HID, damage_category='deep_cleaning', claim_status='approved')"
      - short_stay_deep_add: "K('deep_two_add') if deep_clean_24m >= 2 else (K('deep_one_add') if deep_clean_24m == 1 else 0)"
      - warnings_6m: "COUNT('listing_events', within_months=6, event_type='listing_quality_reviewed', quality_outcome='warning')"
      - short_stay_rating_cut: "K('two_warning_cut') if warnings_6m >= 2 else (K('one_warning_cut') if warnings_6m == 1 else 0)"
      - short_stay_share: "MN(1, short_stay_base_share + short_stay_damage_add + short_stay_pet_add + short_stay_deep_add - short_stay_rating_cut)"
      - result: "RND(regular_cleaning_fee * short_stay_share, 2)"
    compute_basis:
      regular_cleaning_fee: "The short-stay cleaning fee may be set at any amount up to the listing's short-stay ceiling, which is the regular cleaning fee on the listing multiplied by the listing's short-stay share, rounded half up to the cent at that final step only."
      assessed_stays: "Typical-stay base of the short-stay share, read from the most recent Superhost assessment recorded on the host account"
      assessed_nights: "divided by the account's average stay (its completed nights divided by its completed stays), that last fraction counted as 1 when it is above 1"
      short_stay_base_share: "when that assessment counted typical_stay_min_stays or more completed stays, the base is the standard short-stay share plus the standard short-stay share multiplied by short_stay_max_nights divided by the account's average stay (its completed nights divided by its completed stays), that last fraction counted as 1 when it is above 1; when that assessment counted at least one but fewer than typical_stay_min_stays completed stays, the base is the standard short-stay share plus the standard short-stay share multiplied by short_stay_max_nights divided by weekly_discount_min_nights; when the host account carries no Superhost assessment, or the most recent one counted no completed stays, the base is the standard short-stay share alone."
      property_damage_24m: "when two or more HostCover claims in the property_damage category that the claims team approved were filed on the listing within the last twenty-four months (fewer than twenty-four whole months before the day of the save, counted from the date part of filed_at)"
      short_stay_damage_add: "damage_two_add is added to the share; when exactly one was, damage_one_add is added; when none was, nothing is added."
      pet_damage_24m: "when two or more approved HostCover claims in the pet_damage category were filed on the listing within the last twenty-four months (fewer than twenty-four whole months before the day of the save)"
      short_stay_pet_add: "pet_two_add is added; when exactly one was, pet_one_add is added; when none was, nothing is added."
      deep_clean_24m: "when two or more approved HostCover claims in the deep_cleaning category were filed on the listing within the last twenty-four months"
      short_stay_deep_add: "deep_two_add is added; when exactly one was, deep_one_add is added; when none was, nothing is added."
      warnings_6m: "when two or more quality assessments with outcome warning were recorded on the listing within the last six months (fewer than six whole months before the day of the save)"
      short_stay_rating_cut: "two_warning_cut is taken off the share; when exactly one was, one_warning_cut is taken off; when none was, nothing is taken off."
      short_stay_share: "The short-stay share is the typical-stay base plus the three additions minus the guest-rating cut, all combined into one share before it is applied once to the regular cleaning fee; a share above 1 is counted as 1, so the short-stay ceiling never exceeds the regular cleaning fee."
      result: "The short-stay cleaning fee may be set at any amount up to the listing's short-stay ceiling, which is the regular cleaning fee on the listing multiplied by the listing's short-stay share, rounded half up to the cent at that final step only."
    factors:
      - id: typical_stay_base
        effect: method
        decides: short_stay_base_share
        bindings: [assessed_stays, assessed_nights, short_stay_base_share]
        ladder:
          - when: "the most recent Superhost assessment on the host account counted typical_stay_min_stays or more completed stays"
            method: "the base is the standard short-stay share plus the standard short-stay share times short_stay_max_nights over the account's average stay (completed nights over completed stays), that fraction counted as 1 when above 1"
          - when: "that assessment counted at least one but fewer than typical_stay_min_stays completed stays"
            method: "the base is the standard short-stay share plus the standard short-stay share times short_stay_max_nights over weekly_discount_min_nights"
          - when: "otherwise (no Superhost assessment on the host account, or the most recent one counted no completed stays)"
            method: "the base is the standard short-stay share alone"
        baseline:
          short_stay_base_share: "K('standard_short_stay_share')"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: damage_addition
        effect: parameter
        decides: short_stay_damage_add
        bindings: [property_damage_24m, short_stay_damage_add]
        ladder:
          - when: "two or more approved property_damage HostCover claims filed on the listing within the last twenty-four months"
            value: "K('damage_two_add')"
          - when: "exactly one approved property_damage claim filed in that window"
            value: "K('damage_one_add')"
          - when: "otherwise (none in that window)"
            value: "0"
        baseline:
          short_stay_damage_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: protect
      - id: pet_turnover_addition
        effect: parameter
        decides: short_stay_pet_add
        bindings: [pet_damage_24m, short_stay_pet_add]
        ladder:
          - when: "two or more approved pet_damage HostCover claims filed on the listing within the last twenty-four months"
            value: "K('pet_two_add')"
          - when: "exactly one approved pet_damage claim filed in that window"
            value: "K('pet_one_add')"
          - when: "otherwise (none in that window)"
            value: "0"
        baseline:
          short_stay_pet_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: protect
      - id: deep_cleaning_turnover_addition
        effect: parameter
        decides: short_stay_deep_add
        bindings: [deep_clean_24m, short_stay_deep_add]
        ladder:
          - when: "two or more approved deep_cleaning HostCover claims filed on the listing within the last twenty-four months"
            value: "K('deep_two_add')"
          - when: "exactly one approved deep_cleaning claim filed in that window"
            value: "K('deep_one_add')"
          - when: "otherwise (none in that window)"
            value: "0"
        baseline:
          short_stay_deep_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: protect
      - id: guest_rating_cut
        effect: parameter
        decides: short_stay_rating_cut
        bindings: [warnings_6m, short_stay_rating_cut]
        ladder:
          - when: "two or more quality assessments with outcome warning recorded on the listing within the last six months"
            value: "K('two_warning_cut')"
          - when: "exactly one such warning in that window"
            value: "K('one_warning_cut')"
          - when: "otherwise (no warning in that window)"
            value: "0"
        baseline:
          short_stay_rating_cut: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A short-stay cleaning fee may be set only where the space type's short_stay_cleaning_fee_allowed is
        true, and it replaces the regular cleaning fee on stays of short_stay_max_nights nights or fewer. The
        short-stay cleaning fee may be set at any amount up to the listing's short-stay ceiling, which is the
        regular cleaning fee on the listing multiplied by the listing's short-stay share, rounded half up to
        the cent at that final step only. A host who asks for the highest short-stay cleaning fee the listing
        may carry has the short-stay ceiling itself saved as the short-stay cleaning fee. The standard
        short-stay share is standard_short_stay_share.
      params: [standard_short_stay_share, short_stay_max_nights]
    inputs:
      history:
        - {category: host, table: host_account_events, aggregate: latest, field: stays_12m, filters: {event_type: host_superhost_assessed}}
        - {category: host, table: host_account_events, aggregate: latest, field: nights_12m, filters: {event_type: host_superhost_assessed}}
        - {category: protect, table: protection_claims, aggregate: count, field: claim_id, within_months: 24, filters: {damage_category: property_damage, claim_status: approved}}
        - {category: protect, table: protection_claims, aggregate: count, field: claim_id, within_months: 24, filters: {damage_category: pet_damage, claim_status: approved}}
        - {category: protect, table: protection_claims, aggregate: count, field: claim_id, within_months: 24, filters: {damage_category: deep_cleaning, claim_status: approved}}
        - {table: listing_events, aggregate: count, field: listing_event_id, within_months: 6, filters: {event_type: listing_quality_reviewed, quality_outcome: warning}}
      cross_category: [host, protect]
  - id: listing_ext_minimum_stay_floor
    base_policy_refs: [listing_evt_fee_settings, listing_evt_discounts, listing_evt_safety_standards, listing_evt_reinstatement, listing_evt_quality_assessment]
    overwrite:
      - base_policy: listing_evt_fee_settings
        superseded_clause: >-
          Minimum stay settings must lie between minimum_nights_floor and minimum_nights_ceiling
        replaced_by: >-
          A listing's minimum stay may be no shorter than its minimum-stay floor and no longer than the space
          type's minimum_nights_ceiling, and a minimum stay standing below the floor is raised to the floor
          exactly, the change being logged as one change of the minimum stay; a minimum stay at or above the
          floor is left as it stands.
    trigger: state_due
    subject: [listing_pricing_updated, listing_fee_change_logged]
    computes: minimum_nights
    target_tool: raise_minimum_stay_1aeaa300
    params:
      strike_nights_two: 2
      strike_nights_one: 1
      damage_nights_two: 2
      damage_nights_one: 1
      reinstatement_nights_recent: 2
      reinstatement_nights_older: 1
      clean_record_min_assessments: 3
    rule: >-
      A listing's minimum stay may be no shorter than its minimum-stay floor and no longer than the space
      type's minimum_nights_ceiling, and a minimum stay standing below the floor is raised to the floor
      exactly, the change being logged as one change of the minimum stay; a minimum stay at or above the floor
      is left as it stands. The standard minimum-stay floor is the space type's minimum_nights_floor, in whole
      nights. Because the party ban applies to every space type, a listing whose records show party risk
      carries party-prevention nights on top of the standard minimum-stay floor, each worked out on the day of
      the change. Strike nights: when two or more strikes of type party_violation were recorded on the host
      account within the last twelve months (fewer than twelve whole months before the day of the change),
      the strike nights are strike_nights_two; when exactly one was, they are strike_nights_one; when none
      was, there are no strike nights. Damage nights: when two or more HostCover claims in the
      property_damage category that the claims team approved were filed on the listing within the last twelve
      months (counted from the date part of filed_at), the damage nights are damage_nights_two; when exactly
      one was, they are damage_nights_one; when none was, there are no damage nights. Reinstatement nights:
      the most recent reinstatement request of the listing for a suspension with reason safety that the
      listing review team approved is read, its age counted in whole months from the date part of decided_at
      to the day of the change; when it was decided fewer than twelve whole months back, the reinstatement
      nights are reinstatement_nights_recent; when it was decided at least twelve and fewer than twenty-four
      whole months back, they are reinstatement_nights_older; when there is no such approval, or the most
      recent one is twenty-four whole months old or older, there are no reinstatement nights. The strike, damage and reinstatement nights are first
      added together into the party-prevention nights. Assessment record of the party-prevention nights: when
      at least clean_record_min_assessments quality assessments were recorded on the listing within the last
      twelve months and every one of them has outcome pass, the party-prevention nights are halved and any
      half night is rounded up to a whole night; when any quality assessment recorded on the listing within
      the last twelve months has outcome warning or suspension, the party-prevention nights are doubled;
      otherwise the party-prevention nights are counted as they are. The minimum-stay floor is the standard
      minimum-stay floor plus the party-prevention nights as the assessment record leaves them.
    prerequisite: []
    cross_category:
      - category: host
        as: history
        reads: [host_account_events.event_type, host_account_events.strike_type, host_account_events.event_date]
        note: the strike nights count the party_violation strikes recorded on the host account in the last twelve months
      - category: protect
        as: history
        reads: [protection_claims.damage_category, protection_claims.claim_status, protection_claims.filed_at]
        note: the damage nights count the listing's approved property_damage HostCover claims in the last twelve months
    compute:
      - party_strikes_12m: "XCOUNT('host', 'host_account_events', within_months=12, event_type='host_policy_strike_recorded', strike_type='party_violation')"
      - strike_nights: "K('strike_nights_two') if party_strikes_12m >= 2 else (K('strike_nights_one') if party_strikes_12m == 1 else 0)"
      - party_damage_claims_12m: "XCOUNT('protect', 'protection_claims', within_months=12, date_field='filed_at', listing_id=HID, damage_category='property_damage', claim_status='approved')"
      - damage_nights: "K('damage_nights_two') if party_damage_claims_12m >= 2 else (K('damage_nights_one') if party_damage_claims_12m == 1 else 0)"
      - last_safety_reinstatement: "LATEST('listing_reinstatement_requests', 'decided_at', date_field='decided_at', suspension_reason='safety', request_status='approved')"
      - reinstatement_nights: "(K('reinstatement_nights_recent') if MONTHS(last_safety_reinstatement, NOW) < 12 else (K('reinstatement_nights_older') if MONTHS(last_safety_reinstatement, NOW) < 24 else 0)) if last_safety_reinstatement else 0"
      - party_prevention_nights: "strike_nights + damage_nights + reinstatement_nights"
      - assessments_12m: "COUNT('listing_events', within_months=12, event_type='listing_quality_reviewed')"
      - passes_12m: "COUNT('listing_events', within_months=12, event_type='listing_quality_reviewed', quality_outcome='pass')"
      - troubled_12m: "COUNT('listing_events', within_months=12, event_type='listing_quality_reviewed', quality_outcome='warning') + COUNT('listing_events', within_months=12, event_type='listing_quality_reviewed', quality_outcome='suspension')"
      - recorded_party_nights: "-((-party_prevention_nights) // 2) if (assessments_12m >= K('clean_record_min_assessments') and passes_12m == assessments_12m) else (party_prevention_nights * 2 if troubled_12m >= 1 else party_prevention_nights)"
      - result: "P('minimum_nights_floor') + recorded_party_nights"
    compute_basis:
      party_strikes_12m: "when two or more strikes of type party_violation were recorded on the host account within the last twelve months (fewer than twelve whole months before the day of the change)"
      strike_nights: "the strike nights are strike_nights_two; when exactly one was, they are strike_nights_one; when none was, there are no strike nights."
      party_damage_claims_12m: "when two or more HostCover claims in the property_damage category that the claims team approved were filed on the listing within the last twelve months (counted from the date part of filed_at)"
      damage_nights: "the damage nights are damage_nights_two; when exactly one was, they are damage_nights_one; when none was, there are no damage nights."
      last_safety_reinstatement: "the most recent reinstatement request of the listing for a suspension with reason safety that the listing review team approved is read, its age counted in whole months from the date part of decided_at to the day of the change"
      reinstatement_nights: "when it was decided fewer than twelve whole months back, the reinstatement nights are reinstatement_nights_recent; when it was decided at least twelve and fewer than twenty-four whole months back, they are reinstatement_nights_older; when there is no such approval, or the most recent one is twenty-four whole months old or older, there are no reinstatement nights."
      party_prevention_nights: "The strike, damage and reinstatement nights are first added together into the party-prevention nights."
      assessments_12m: "when at least clean_record_min_assessments quality assessments were recorded on the listing within the last twelve months and every one of them has outcome pass"
      passes_12m: "when at least clean_record_min_assessments quality assessments were recorded on the listing within the last twelve months and every one of them has outcome pass"
      troubled_12m: "when any quality assessment recorded on the listing within the last twelve months has outcome warning or suspension"
      recorded_party_nights: "the party-prevention nights are halved and any half night is rounded up to a whole night; when any quality assessment recorded on the listing within the last twelve months has outcome warning or suspension, the party-prevention nights are doubled; otherwise the party-prevention nights are counted as they are."
      result: "The minimum-stay floor is the standard minimum-stay floor plus the party-prevention nights as the assessment record leaves them."
    factors:
      - id: party_strike_nights
        effect: parameter
        decides: strike_nights
        bindings: [party_strikes_12m, strike_nights]
        ladder:
          - when: "two or more party_violation strikes recorded on the host account within the last twelve months"
            value: "K('strike_nights_two')"
          - when: "exactly one party_violation strike in that window"
            value: "K('strike_nights_one')"
          - when: "otherwise (none in that window)"
            value: "0"
        baseline:
          strike_nights: "0"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: property_damage_nights
        effect: parameter
        decides: damage_nights
        bindings: [party_damage_claims_12m, damage_nights]
        ladder:
          - when: "two or more approved property_damage HostCover claims filed on the listing within the last twelve months"
            value: "K('damage_nights_two')"
          - when: "exactly one such claim in that window"
            value: "K('damage_nights_one')"
          - when: "otherwise (none in that window)"
            value: "0"
        baseline:
          damage_nights: "0"
        evidence: [cross_category, history]
        cross_difficulty: protect
      - id: safety_reinstatement_nights
        effect: parameter
        decides: reinstatement_nights
        bindings: [last_safety_reinstatement, reinstatement_nights]
        ladder:
          - when: "the most recent approved reinstatement after a safety suspension was decided fewer than twelve whole months back"
            value: "K('reinstatement_nights_recent')"
          - when: "it was decided at least twelve and fewer than twenty-four whole months back"
            value: "K('reinstatement_nights_older')"
          - when: "otherwise (no such approval, or twenty-four whole months old or older)"
            value: "0"
        baseline:
          reinstatement_nights: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: party_nights_assessment_record
        effect: method
        decides: recorded_party_nights
        bindings: [assessments_12m, passes_12m, troubled_12m, recorded_party_nights]
        ladder:
          - when: "at least clean_record_min_assessments quality assessments within the last twelve months and every one of them a pass"
            method: "the party-prevention nights are halved, a half night rounded up to a whole night"
          - when: "a quality assessment with outcome warning or suspension within the last twelve months"
            method: "the party-prevention nights are doubled"
          - when: "otherwise"
            method: "the party-prevention nights are counted as they are"
        baseline:
          recorded_party_nights: "party_prevention_nights"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A listing's minimum stay may be no shorter than its minimum-stay floor and no longer than the space
        type's minimum_nights_ceiling, and a minimum stay standing below the floor is raised to the floor
        exactly, the change being logged as one change of the minimum stay; a minimum stay at or above the floor
        is left as it stands. The standard minimum-stay floor is the space type's minimum_nights_floor, in whole
        nights.
      params: [minimum_nights_floor, minimum_nights_ceiling]
    inputs:
      history:
        - {category: host, table: host_account_events, aggregate: count, field: host_event_id, within_months: 12, filters: {event_type: host_policy_strike_recorded, strike_type: party_violation}}
        - {category: protect, table: protection_claims, aggregate: count, field: claim_id, within_months: 12, filters: {damage_category: property_damage, claim_status: approved}}
        - {table: listing_reinstatement_requests, aggregate: latest, field: decided_at, filters: {suspension_reason: safety, request_status: approved}}
        - {table: listing_events, aggregate: count, field: listing_event_id, within_months: 12, filters: {event_type: listing_quality_reviewed}}
      cross_category: [host, protect]
  - id: listing_ext_extra_guest_fee_ceiling
    base_policy_refs: [listing_evt_fee_settings, listing_evt_discounts, listing_evt_safety_standards]
    overwrite:
      - base_policy: listing_evt_fee_settings
        superseded_clause: >-
          extra_guest_fee no higher than extra_guest_fee_max_usd
        replaced_by: >-
          A listing's extra-guest fee may be no higher than its extra-guest ceiling, and a fee standing above that
          ceiling is reset to the ceiling exactly, the reset being logged as one change of the extra-guest fee; a
          fee at or below the ceiling is left as it stands, and the reset leaves the extra-guest threshold as it
          stands.
    trigger: state_due
    subject: [listing_pricing_updated, listing_fee_change_logged]
    computes: extra_guest_fee
    target_tool: reset_extra_guest_fee_9609655d
    params:
      standard_extra_guest_share: 0.70
      damage_window_standard_months: 12
      damage_window_recent_strike_months: 36
      damage_window_older_strike_months: 24
      damage_loss_high: 2500.00
      damage_loss_high_add: 0.15
      damage_loss_low_add: 0.08
      claim_limit_low_max: 5000.00
      claim_limit_mid_max: 25000.00
      claim_limit_low_add: 0.10
      claim_limit_mid_add: 0.05
      income_loss_short_max: 14
      income_loss_none_add: 0.06
      income_loss_short_add: 0.03
    rule: >-
      A listing's extra-guest fee may be no higher than its extra-guest ceiling, and a fee standing above that
      ceiling is reset to the ceiling exactly, the reset being logged as one change of the extra-guest fee; a
      fee at or below the ceiling is left as it stands, and the reset leaves the extra-guest threshold as it
      stands. The per-guest portion of the nightly rate is the listing's nightly rate divided by its
      extra_guest_threshold, the number of guests the nightly rate covers. The standard extra-guest ceiling is
      the per-guest portion multiplied by standard_extra_guest_share, the standard extra-guest share, and it
      never exceeds the space type's extra_guest_fee_max_usd. On top of the standard extra-guest share a
      listing may carry three extra-guest additions, each worked out on the day of the reset. The damage-loss
      addition rests on the verified losses of the HostCover claims in the property_damage category that the
      claims team approved and that were filed on the listing within the damage look-back; the standard
      damage look-back is the last damage_window_standard_months whole months before the day of the reset,
      counted from the date part of filed_at. Damage look-back by party record: because the party ban applies
      to every space type and large extra-guest parties are where party damage arises, when a strike of type
      party_violation was recorded on the host account within the last twelve months (fewer than twelve whole
      months before the day of the reset), the damage look-back is lengthened to the last
      damage_window_recent_strike_months whole months; when no such strike was recorded in the last twelve
      months but one was recorded at least twelve and fewer than twenty-four whole months back, it is the last
      damage_window_older_strike_months whole months; otherwise the standard damage look-back applies.
      Damage-loss addition: the verified losses of those claims within the look-back are added up; when they
      come to damage_loss_high or more, damage_loss_high_add is added to the share; when they are above zero
      but below damage_loss_high, damage_loss_low_add is added; when there are none, nothing is added.
      Per-claim limit addition: when the per-claim limit of the HostCover level the listing's active plan
      holds is at most claim_limit_low_max, claim_limit_low_add is added; when it is above
      claim_limit_low_max and at most claim_limit_mid_max, claim_limit_mid_add is added; when it is above
      claim_limit_mid_max, nothing is added. Income-loss addition: when the HostCover level the listing's
      active plan holds pays no cancelled nights for lost income (its income_loss_max_nights is 0),
      income_loss_none_add is added; when it pays at least one and at most income_loss_short_max nights,
      income_loss_short_add is added; when it pays more, nothing is added. The extra-guest ceiling is the
      per-guest portion multiplied by the standard extra-guest share plus the three extra-guest additions, the
      share being combined first and applied once to the per-guest portion, capped at the space type's
      extra_guest_fee_max_usd and rounded half up to the cent at that final step only.
    prerequisite: []
    cross_category:
      - category: protect
        as: history
        reads: [protection_claims.damage_category, protection_claims.claim_status, protection_claims.filed_at, protection_claims.verified_loss_amount, per_claim_limit_usd, income_loss_max_nights]
        note: the damage-loss addition adds up verified losses of the listing's approved property_damage claims in the look-back, and the per-claim limit and income-loss additions read the level of the listing's active HostCover plan
      - category: host
        as: history
        reads: [host_account_events.event_type, host_account_events.strike_type, host_account_events.event_date]
        note: the damage look-back reads how recently a party_violation strike was recorded on the host account
    compute:
      - nightly_rate_now: "F('nightly_rate')"
      - guests_covered: "F('extra_guest_threshold')"
      - per_guest_portion: "nightly_rate_now / guests_covered"
      - party_strikes_12m: "XCOUNT('host', 'host_account_events', within_months=12, event_type='host_policy_strike_recorded', strike_type='party_violation')"
      - party_strikes_24m: "XCOUNT('host', 'host_account_events', within_months=24, event_type='host_policy_strike_recorded', strike_type='party_violation')"
      - damage_lookback_months: "K('damage_window_recent_strike_months') if party_strikes_12m >= 1 else (K('damage_window_older_strike_months') if party_strikes_24m >= 1 else K('damage_window_standard_months'))"
      - damage_losses: "XSUM('protect', 'protection_claims', 'verified_loss_amount', within_months=damage_lookback_months, date_field='filed_at', listing_id=HID, damage_category='property_damage', claim_status='approved')"
      - damage_loss_add: "K('damage_loss_high_add') if damage_losses >= K('damage_loss_high') else (K('damage_loss_low_add') if damage_losses > 0 else 0)"
      - plan_claim_limit: "CPARAM('protect', 'per_claim_limit_usd', listing_id=HID, status='active')"
      - claim_limit_add: "K('claim_limit_low_add') if plan_claim_limit <= K('claim_limit_low_max') else (K('claim_limit_mid_add') if plan_claim_limit <= K('claim_limit_mid_max') else 0)"
      - plan_income_nights: "CPARAM('protect', 'income_loss_max_nights', listing_id=HID, status='active')"
      - income_loss_add: "K('income_loss_none_add') if plan_income_nights == 0 else (K('income_loss_short_add') if plan_income_nights <= K('income_loss_short_max') else 0)"
      - extra_guest_share: "K('standard_extra_guest_share') + damage_loss_add + claim_limit_add + income_loss_add"
      - result: "RND(MN(P('extra_guest_fee_max_usd'), per_guest_portion * extra_guest_share), 2)"
    compute_basis:
      nightly_rate_now: "The per-guest portion of the nightly rate is the listing's nightly rate divided by its extra_guest_threshold, the number of guests the nightly rate covers."
      guests_covered: "The per-guest portion of the nightly rate is the listing's nightly rate divided by its extra_guest_threshold, the number of guests the nightly rate covers."
      per_guest_portion: "The per-guest portion of the nightly rate is the listing's nightly rate divided by its extra_guest_threshold, the number of guests the nightly rate covers."
      party_strikes_12m: "when a strike of type party_violation was recorded on the host account within the last twelve months (fewer than twelve whole months before the day of the reset)"
      party_strikes_24m: "when no such strike was recorded in the last twelve months but one was recorded at least twelve and fewer than twenty-four whole months back"
      damage_lookback_months: "the damage look-back is lengthened to the last damage_window_recent_strike_months whole months; when no such strike was recorded in the last twelve months but one was recorded at least twelve and fewer than twenty-four whole months back, it is the last damage_window_older_strike_months whole months; otherwise the standard damage look-back applies."
      damage_losses: "the verified losses of those claims within the look-back are added up"
      damage_loss_add: "when they come to damage_loss_high or more, damage_loss_high_add is added to the share; when they are above zero but below damage_loss_high, damage_loss_low_add is added; when there are none, nothing is added."
      plan_claim_limit: "when the per-claim limit of the HostCover level the listing's active plan holds is at most claim_limit_low_max"
      claim_limit_add: "claim_limit_low_add is added; when it is above claim_limit_low_max and at most claim_limit_mid_max, claim_limit_mid_add is added; when it is above claim_limit_mid_max, nothing is added."
      plan_income_nights: "when the HostCover level the listing's active plan holds pays no cancelled nights for lost income (its income_loss_max_nights is 0)"
      income_loss_add: "income_loss_none_add is added; when it pays at least one and at most income_loss_short_max nights, income_loss_short_add is added; when it pays more, nothing is added."
      extra_guest_share: "The extra-guest ceiling is the per-guest portion multiplied by the standard extra-guest share plus the three extra-guest additions, the share being combined first and applied once to the per-guest portion, capped at the space type's extra_guest_fee_max_usd and rounded half up to the cent at that final step only."
      result: "The extra-guest ceiling is the per-guest portion multiplied by the standard extra-guest share plus the three extra-guest additions, the share being combined first and applied once to the per-guest portion, capped at the space type's extra_guest_fee_max_usd and rounded half up to the cent at that final step only."
    factors:
      - id: damage_lookback_by_party_record
        effect: method
        decides: damage_lookback_months
        bindings: [party_strikes_12m, party_strikes_24m, damage_lookback_months]
        ladder:
          - when: "a party_violation strike recorded on the host account within the last twelve months"
            method: "property-damage losses are read over the last damage_window_recent_strike_months whole months"
          - when: "no such strike in the last twelve months, one recorded at least twelve and fewer than twenty-four whole months back"
            method: "property-damage losses are read over the last damage_window_older_strike_months whole months"
          - when: "otherwise"
            method: "property-damage losses are read over the standard look-back of damage_window_standard_months whole months"
        baseline:
          damage_lookback_months: "K('damage_window_standard_months')"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: damage_loss_addition
        effect: parameter
        decides: damage_loss_add
        bindings: [damage_losses, damage_loss_add]
        ladder:
          - when: "verified losses of approved property_damage claims filed on the listing within the look-back come to damage_loss_high or more"
            value: "K('damage_loss_high_add')"
          - when: "those losses are above zero but below damage_loss_high"
            value: "K('damage_loss_low_add')"
          - when: "otherwise (no such loss within the look-back)"
            value: "0"
        baseline:
          damage_loss_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: protect
      - id: per_claim_limit_addition
        effect: parameter
        decides: claim_limit_add
        bindings: [plan_claim_limit, claim_limit_add]
        ladder:
          - when: "the active HostCover level's per-claim limit is at most claim_limit_low_max"
            value: "K('claim_limit_low_add')"
          - when: "it is above claim_limit_low_max and at most claim_limit_mid_max"
            value: "K('claim_limit_mid_add')"
          - when: "otherwise (above claim_limit_mid_max)"
            value: "0"
        baseline:
          claim_limit_add: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: protect
      - id: income_loss_addition
        effect: parameter
        decides: income_loss_add
        bindings: [plan_income_nights, income_loss_add]
        ladder:
          - when: "the active HostCover level pays no cancelled nights for lost income"
            value: "K('income_loss_none_add')"
          - when: "it pays at least one and at most income_loss_short_max nights"
            value: "K('income_loss_short_add')"
          - when: "otherwise (it pays more nights)"
            value: "0"
        baseline:
          income_loss_add: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: protect
    baseline:
      rule: >-
        A listing's extra-guest fee may be no higher than its extra-guest ceiling, and a fee standing above that
        ceiling is reset to the ceiling exactly, the reset being logged as one change of the extra-guest fee; a
        fee at or below the ceiling is left as it stands, and the reset leaves the extra-guest threshold as it
        stands. The per-guest portion of the nightly rate is the listing's nightly rate divided by its
        extra_guest_threshold, the number of guests the nightly rate covers. The standard extra-guest ceiling is
        the per-guest portion multiplied by standard_extra_guest_share, the standard extra-guest share, and it
        never exceeds the space type's extra_guest_fee_max_usd.
      params: [standard_extra_guest_share, extra_guest_fee_max_usd]
    inputs:
      history:
        - {category: host, table: host_account_events, aggregate: count, field: host_event_id, within_months: 24, filters: {event_type: host_policy_strike_recorded, strike_type: party_violation}}
        - {category: protect, table: protection_claims, aggregate: sum, field: verified_loss_amount, within_months: 36, filters: {damage_category: property_damage, claim_status: approved}}
      cross_category: [protect, host]
  - id: listing_ext_pricing_assist_rate
    base_policy_refs: [listing_evt_fee_settings, listing_evt_discounts, listing_evt_quality_assessment]
    overwrite: []
    trigger: on_request
    subject: [listing_pricing_updated, listing_fee_change_logged]
    computes: nightly_rate
    target_tool: save_nightly_rate_d0fc8a90
    params:
      typical_stay_min_stays: 10
      rating_premium_min: 4.80
      rating_premium_reviews: 10
      rating_high_adj: 0.04
      rating_low_adj: 0.02
      demand_high_nights: 250
      demand_mid_nights: 150
      demand_high_adj: 0.04
      demand_mid_adj: 0.02
      superhost_adj: 0.02
      starter_adj: -0.02
      response_high_pct: 98.00
      response_low_pct: 90.00
      response_high_adj: 0.01
      response_low_adj: -0.02
      age_new_months: 12
      age_settled_months: 24
      age_new_adj: -0.03
      age_mid_adj: -0.02
    rule: >-
      Pricing Assist is the nightly rate Roamhaven suggests for a listing; a host may ask for it to be worked
      out and saves it as the listing's nightly rate in person, since the nightly rate is the host's own price.
      Pricing Assist prices the all-in night of a full party: the listing's nightly rate, plus its regular
      cleaning fee spread over the stay length Pricing Assist expects, plus its extra-guest fee multiplied by
      the number of guests by which max_guests exceeds extra_guest_threshold (none when it does not exceed it).
      The standard expected stay length is the listing's minimum stay in nights. The standard suggested
      nightly rate is the listing's current nightly rate, unchanged, kept within the space type's
      nightly_rate_min_usd and nightly_rate_max_usd. A suggested nightly rate is not worked out until the
      minimum stay on the listing stands at or above the listing's minimum-stay floor. The suggested nightly
      rate is fixed only after the extra-guest fee on the listing stands at or below the listing's extra-guest
      ceiling. Expected stay length from the host's booking record, read from the most recent Superhost
      assessment recorded on the host account: when that assessment counted typical_stay_min_stays or more
      completed stays, the cleaning fee is spread over the mean of the listing's minimum stay and the
      account's average stay (its completed nights divided by its completed stays); when it counted at least
      one but fewer than typical_stay_min_stays completed stays, the cleaning fee is spread over the mean of
      the minimum stay and weekly_discount_min_nights; when the host account carries no Superhost assessment,
      or the most recent one counted no completed stays, the standard expected stay length applies. Pricing
      Assist adjustments are fractions of the all-in night, each worked out on the day of the request. Rating
      adjustment, read from the quality assessment recorded on the listing within the last three months
      (fewer than three whole months before the day of the request; assessments run quarterly, so there is at
      most one): when its average rating is at least rating_premium_min and it counted at least
      rating_premium_reviews guest reviews, the rating adjustment is rating_high_adj; when its average is at
      least rating_premium_min but it counted fewer than rating_premium_reviews reviews, it is rating_low_adj;
      otherwise, or with no assessment in those three months, there is no rating adjustment. Demand
      adjustment: when the most recent Superhost assessment on the host account counted demand_high_nights
      completed nights or more, the demand adjustment is demand_high_adj; when it counted at least
      demand_mid_nights and fewer than demand_high_nights, it is demand_mid_adj; when it counted fewer, or the
      host account carries no Superhost assessment, there is no demand adjustment. Superhost adjustment: when
      the host account's tier is Superhost, the Superhost adjustment is superhost_adj; when it is Starter Host,
      it is starter_adj, a reduction; for any other tier there is none. Responsiveness adjustment: when the
      most recent Superhost assessment shows a response rate of at least response_high_pct, the
      responsiveness adjustment is response_high_adj; when it shows a response rate below response_low_pct, it
      is response_low_adj, a reduction; otherwise, or with no Superhost assessment, there is none. Listing age
      adjustment: when the listing's first_listed_date lies fewer than age_new_months whole months before the
      day of the request, the listing age adjustment is age_new_adj, a reduction; when it lies at least
      age_new_months and fewer than age_settled_months whole months back, it is age_mid_adj, a reduction;
      otherwise there is none. The five Pricing Assist adjustments are first added together into one
      adjustment total. The suggested nightly rate is the current nightly rate plus the all-in night
      multiplied by the adjustment total, kept within the space type's nightly_rate_min_usd and
      nightly_rate_max_usd and rounded half up to the cent at that final step only.
    prerequisite:
      - problem: listing_ext_minimum_stay_floor
        kind: value_input
        gate: cleaning_per_night
        form: state
        policy_source: >-
          A suggested nightly rate is not worked out until the minimum stay on the listing stands at or above the
          listing's minimum-stay floor.
        condition: >-
          listings.minimum_nights of the listing is at or above the listing's minimum-stay floor on the day of the
          request; a minimum stay that stood below it has been raised to the floor, and that change is logged on
          the listing as a minimum_nights change dated that day
        resolved_by: raise_minimum_stay_1aeaa300
        effect: >-
          cleaning_per_night, the regular cleaning fee spread over the expected stay length inside the all-in
          night, is worked out on the raised minimum stay, so the all-in night and the suggested nightly rate
          rest on the minimum stay the listing may actually take
      - problem: listing_ext_extra_guest_fee_ceiling
        kind: value_input
        gate: all_in_night
        form: state
        policy_source: >-
          The suggested nightly rate is fixed only after the extra-guest fee on the listing stands at or below the
          listing's extra-guest ceiling.
        condition: >-
          listings.extra_guest_fee of the listing is at or below the listing's extra-guest ceiling on the day of
          the request; a fee that stood above it has been reset to the ceiling, and that reset is logged on the
          listing as an extra_guest_fee change dated that day
        resolved_by: reset_extra_guest_fee_9609655d
        effect: >-
          all_in_night carries the full party's extra-guest charges at the reset extra-guest fee instead of the
          fee that stood above the ceiling, so the suggested nightly rate moves with it
    cross_category:
      - category: host
        as: history
        reads: [variant_name, host_account_events.stays_12m, host_account_events.nights_12m, host_account_events.response_rate_pct]
        note: the expected stay length, demand and responsiveness read the most recent Superhost assessment on the host account, and the Superhost adjustment reads the host account's tier
    compute:
      - current_rate: "F('nightly_rate')"
      - assessed_stays_pa: "XLATEST('host', 'host_account_events', 'stays_12m', event_type='host_superhost_assessed') or 0"
      - assessed_nights: "XLATEST('host', 'host_account_events', 'nights_12m', event_type='host_superhost_assessed') or 0"
      - expected_stay_nights: "(F('minimum_nights') + assessed_nights / assessed_stays_pa) / 2 if assessed_stays_pa >= K('typical_stay_min_stays') else ((F('minimum_nights') + P('weekly_discount_min_nights')) / 2 if assessed_stays_pa >= 1 else F('minimum_nights'))"
      - cleaning_per_night: "F('cleaning_fee') / expected_stay_nights"
      - full_party_extra_guests: "MX(0, F('max_guests') - F('extra_guest_threshold'))"
      - all_in_night: "current_rate + cleaning_per_night + F('extra_guest_fee') * full_party_extra_guests"
      - recent_average_rating: "SUM('listing_events', 'average_rating', within_months=3, event_type='listing_quality_reviewed')"
      - recent_reviews: "SUM('listing_events', 'review_count', within_months=3, event_type='listing_quality_reviewed')"
      - rating_adjustment: "K('rating_high_adj') if (recent_average_rating >= K('rating_premium_min') and recent_reviews >= K('rating_premium_reviews')) else (K('rating_low_adj') if (recent_average_rating >= K('rating_premium_min') and recent_reviews < K('rating_premium_reviews')) else 0)"
      - demand_adjustment: "K('demand_high_adj') if assessed_nights >= K('demand_high_nights') else (K('demand_mid_adj') if assessed_nights >= K('demand_mid_nights') else 0)"
      - host_tier_pa: "CFIELD('host', 'variant_name')"
      - superhost_adjustment: "K('superhost_adj') if host_tier_pa == 'Superhost' else (K('starter_adj') if host_tier_pa == 'Starter Host' else 0)"
      - assessed_response_rate: "XLATEST('host', 'host_account_events', 'response_rate_pct', event_type='host_superhost_assessed') or -1"
      - responsiveness_adjustment: "K('response_high_adj') if assessed_response_rate >= K('response_high_pct') else (K('response_low_adj') if 0 <= assessed_response_rate < K('response_low_pct') else 0)"
      - listing_age_months: "MONTHS(F('first_listed_date'), NOW)"
      - listing_age_adjustment: "K('age_new_adj') if listing_age_months < K('age_new_months') else (K('age_mid_adj') if listing_age_months < K('age_settled_months') else 0)"
      - adjustment_total: "rating_adjustment + demand_adjustment + superhost_adjustment + responsiveness_adjustment + listing_age_adjustment"
      - result: "RND(MN(P('nightly_rate_max_usd'), MX(P('nightly_rate_min_usd'), current_rate + all_in_night * adjustment_total)), 2)"
    compute_basis:
      current_rate: "The standard suggested nightly rate is the listing's current nightly rate, unchanged, kept within the space type's nightly_rate_min_usd and nightly_rate_max_usd."
      assessed_stays_pa: "Expected stay length from the host's booking record, read from the most recent Superhost assessment recorded on the host account"
      assessed_nights: "when the most recent Superhost assessment on the host account counted demand_high_nights completed nights or more"
      expected_stay_nights: "when that assessment counted typical_stay_min_stays or more completed stays, the cleaning fee is spread over the mean of the listing's minimum stay and the account's average stay (its completed nights divided by its completed stays); when it counted at least one but fewer than typical_stay_min_stays completed stays, the cleaning fee is spread over the mean of the minimum stay and weekly_discount_min_nights; when the host account carries no Superhost assessment, or the most recent one counted no completed stays, the standard expected stay length applies."
      cleaning_per_night: "plus its regular cleaning fee spread over the stay length Pricing Assist expects"
      full_party_extra_guests: "plus its extra-guest fee multiplied by the number of guests by which max_guests exceeds extra_guest_threshold (none when it does not exceed it)"
      all_in_night: "Pricing Assist prices the all-in night of a full party: the listing's nightly rate, plus its regular cleaning fee spread over the stay length Pricing Assist expects, plus its extra-guest fee multiplied by the number of guests by which max_guests exceeds extra_guest_threshold (none when it does not exceed it)."
      recent_average_rating: "Rating adjustment, read from the quality assessment recorded on the listing within the last three months (fewer than three whole months before the day of the request; assessments run quarterly, so there is at most one)"
      recent_reviews: "Rating adjustment, read from the quality assessment recorded on the listing within the last three months (fewer than three whole months before the day of the request; assessments run quarterly, so there is at most one)"
      rating_adjustment: "when its average rating is at least rating_premium_min and it counted at least rating_premium_reviews guest reviews, the rating adjustment is rating_high_adj; when its average is at least rating_premium_min but it counted fewer than rating_premium_reviews reviews, it is rating_low_adj; otherwise, or with no assessment in those three months, there is no rating adjustment."
      demand_adjustment: "the demand adjustment is demand_high_adj; when it counted at least demand_mid_nights and fewer than demand_high_nights, it is demand_mid_adj; when it counted fewer, or the host account carries no Superhost assessment, there is no demand adjustment."
      host_tier_pa: "when the host account's tier is Superhost, the Superhost adjustment is superhost_adj"
      superhost_adjustment: "the Superhost adjustment is superhost_adj; when it is Starter Host, it is starter_adj, a reduction; for any other tier there is none."
      assessed_response_rate: "when the most recent Superhost assessment shows a response rate of at least response_high_pct"
      responsiveness_adjustment: "the responsiveness adjustment is response_high_adj; when it shows a response rate below response_low_pct, it is response_low_adj, a reduction; otherwise, or with no Superhost assessment, there is none."
      listing_age_months: "when the listing's first_listed_date lies fewer than age_new_months whole months before the day of the request"
      listing_age_adjustment: "the listing age adjustment is age_new_adj, a reduction; when it lies at least age_new_months and fewer than age_settled_months whole months back, it is age_mid_adj, a reduction; otherwise there is none."
      adjustment_total: "The five Pricing Assist adjustments are first added together into one adjustment total."
      result: "The suggested nightly rate is the current nightly rate plus the all-in night multiplied by the adjustment total, kept within the space type's nightly_rate_min_usd and nightly_rate_max_usd and rounded half up to the cent at that final step only."
    factors:
      - id: expected_stay_length
        effect: method
        decides: expected_stay_nights
        bindings: [assessed_stays_pa, expected_stay_nights]
        ladder:
          - when: "the most recent Superhost assessment on the host account counted typical_stay_min_stays or more completed stays"
            method: "the cleaning fee is spread over the mean of the minimum stay and the account's average stay (completed nights over completed stays)"
          - when: "that assessment counted at least one but fewer than typical_stay_min_stays completed stays"
            method: "the cleaning fee is spread over the mean of the minimum stay and weekly_discount_min_nights"
          - when: "otherwise (no Superhost assessment, or one that counted no completed stays)"
            method: "the cleaning fee is spread over the minimum stay"
        baseline:
          expected_stay_nights: "F('minimum_nights')"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: rating_adjustment
        effect: parameter
        decides: rating_adjustment
        bindings: [recent_average_rating, recent_reviews, rating_adjustment]
        ladder:
          - when: "the assessment of the last three months averages at least rating_premium_min and counted at least rating_premium_reviews guest reviews"
            value: "K('rating_high_adj')"
          - when: "it averages at least rating_premium_min and counted fewer than rating_premium_reviews guest reviews"
            value: "K('rating_low_adj')"
          - when: "otherwise (an average below rating_premium_min, or no assessment in those three months)"
            value: "0"
        baseline:
          rating_adjustment: "0"
        evidence: [history]
        cross_difficulty: null
      - id: demand_adjustment
        effect: parameter
        decides: demand_adjustment
        bindings: [assessed_nights, demand_adjustment]
        ladder:
          - when: "the most recent Superhost assessment counted demand_high_nights completed nights or more"
            value: "K('demand_high_adj')"
          - when: "it counted at least demand_mid_nights and fewer than demand_high_nights"
            value: "K('demand_mid_adj')"
          - when: "otherwise (fewer nights, or no Superhost assessment)"
            value: "0"
        baseline:
          demand_adjustment: "0"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: superhost_adjustment
        effect: parameter
        decides: superhost_adjustment
        bindings: [host_tier_pa, superhost_adjustment]
        ladder:
          - when: "the host account's tier is Superhost"
            value: "K('superhost_adj')"
          - when: "the host account's tier is Starter Host"
            value: "K('starter_adj')"
          - when: "otherwise (any other tier)"
            value: "0"
        baseline:
          superhost_adjustment: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: host
      - id: responsiveness_adjustment
        effect: parameter
        decides: responsiveness_adjustment
        bindings: [assessed_response_rate, responsiveness_adjustment]
        ladder:
          - when: "the most recent Superhost assessment shows a response rate of at least response_high_pct"
            value: "K('response_high_adj')"
          - when: "it shows a response rate below response_low_pct"
            value: "K('response_low_adj')"
          - when: "otherwise (in between, or no Superhost assessment)"
            value: "0"
        baseline:
          responsiveness_adjustment: "0"
        evidence: [cross_category, history]
        cross_difficulty: host
      - id: listing_age_adjustment
        effect: parameter
        decides: listing_age_adjustment
        bindings: [listing_age_months, listing_age_adjustment]
        ladder:
          - when: "first_listed_date lies fewer than age_new_months whole months back"
            value: "K('age_new_adj')"
          - when: "first_listed_date lies at least age_new_months and fewer than age_settled_months whole months back"
            value: "K('age_mid_adj')"
          - when: "otherwise (age_settled_months or more)"
            value: "0"
        baseline:
          listing_age_adjustment: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        Pricing Assist is the nightly rate Roamhaven suggests for a listing; a host may ask for it to be worked
        out and saves it as the listing's nightly rate in person, since the nightly rate is the host's own price.
        Pricing Assist prices the all-in night of a full party: the listing's nightly rate, plus its regular
        cleaning fee spread over the stay length Pricing Assist expects, plus its extra-guest fee multiplied by
        the number of guests by which max_guests exceeds extra_guest_threshold (none when it does not exceed it).
        The standard expected stay length is the listing's minimum stay in nights. The standard suggested
        nightly rate is the listing's current nightly rate, unchanged, kept within the space type's
        nightly_rate_min_usd and nightly_rate_max_usd.
      params: [nightly_rate_min_usd, nightly_rate_max_usd]
    inputs:
      history:
        - {table: listing_events, aggregate: sum, field: average_rating, within_months: 3, filters: {event_type: listing_quality_reviewed}}
        - {category: host, table: host_account_events, aggregate: latest, field: nights_12m, filters: {event_type: host_superhost_assessed}}
        - {category: host, table: host_account_events, aggregate: latest, field: stays_12m, filters: {event_type: host_superhost_assessed}}
        - {category: host, table: host_account_events, aggregate: latest, field: response_rate_pct, filters: {event_type: host_superhost_assessed}}
      cross_category: [host]
