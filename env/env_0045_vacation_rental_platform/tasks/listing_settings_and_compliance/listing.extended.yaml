            method: "pet-damage claims and their losses are read over the last pet_window_busy_months whole months"
          - when: "they counted fewer than pet_window_quiet_reviews guest reviews"
            method: "pet-damage claims and their losses are read over the last pet_window_quiet_months whole months"
