          cleaning_fee no higher than cleaning_fee_max_usd
        replaced_by: >-
          A listing's regular cleaning fee may be no higher than its cleaning-fee ceiling, and a cleaning fee
          standing above that ceiling is reset to the ceiling exactly, the reset being logged as one change of
          the cleaning fee; a cleaning fee at or below the ceiling is left as it stands, and the reset leaves
