    trigger: state_due
    subject: [listing_pricing_updated, listing_fee_change_logged]
    computes: cleaning_fee
    target_tool: reset_cleaning_fee_77ae9a3d
    params:
      deep_window_troubled_months: 6
      deep_window_standard_months: 12
      deep_window_clean_months: 24
      clean_record_min_quarters: 6
