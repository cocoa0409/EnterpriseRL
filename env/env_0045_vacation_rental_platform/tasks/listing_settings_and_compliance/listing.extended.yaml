    rule: >-
      A listing's pet fee may be no higher than its pet-fee ceiling, and a pet fee standing above that
      ceiling is reset to the ceiling exactly, the reset being logged as one change of the pet fee; a pet
      fee at or below the ceiling is left as it stands. The standard pet-fee ceiling is the space type's
      pet_fee_max_usd, in US dollars to the cent. On top of the standard pet-fee ceiling a listing may carry
      three pet-fee allowances, each worked out on the day of the reset; two of them rest on the HostCover
      claims in the pet_damage category that the claims team approved and that were filed on the listing
      within the pet-claim look-back. The standard pet-claim look-back is the last pet_window_standard_months
      whole months before the day of the reset, counted from the date part of filed_at. Pet-claim look-back by
      booking volume: the guest reviews counted by the quality assessments recorded on the listing within the
      last three months (fewer than three whole months before the day of the reset) are added up; when they
      come to pet_window_busy_reviews or more, the look-back is shortened to the last pet_window_busy_months
      whole months, because a busy listing's recent claims already show its pet costs; when they come to
      fewer than pet_window_quiet_reviews, the look-back is lengthened to the last pet_window_quiet_months
      whole months, because a quiet listing needs a longer record; otherwise the standard pet-claim look-back
      applies. Pet-damage claim allowance: when two or more such claims were filed within the look-back, the
      pet-damage claim allowance is pet_claims_two_allowance; when exactly one was, it is
      pet_claims_one_allowance; when none was, there is no pet-damage claim allowance; denied, withdrawn or
      still open claims never count. Pet-damage loss allowance: the verified losses of those same claims are
      added up; when they come to pet_loss_high or more, the pet-damage loss allowance is
      pet_loss_high_allowance; when they are above zero but below pet_loss_high, it is
      pet_loss_low_allowance; when there are none, there is no pet-damage loss allowance. Pet sublimit
      allowance: when the pet-damage sublimit of the HostCover level the listing's active plan holds is at
      most pet_sublimit_low_max, the pet sublimit allowance is pet_sublimit_low_allowance; when that sublimit
      is above pet_sublimit_low_max and at most pet_sublimit_mid_max, it is pet_sublimit_mid_allowance; when it
      is above pet_sublimit_mid_max, there is no pet sublimit allowance. The pet-fee ceiling is the standard
      pet-fee ceiling plus the three pet-fee allowances, rounded half up to the cent at that final step only.
