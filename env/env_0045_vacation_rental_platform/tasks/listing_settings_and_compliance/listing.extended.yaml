# Policy charter of the Listings category at Roamhaven.
# A listing is the contract a host holds for one rentable space. Its tier is the space type, which fixes
# the platform standards the listing must meet (capacity, publishing requirements, fee ceilings, quality
# thresholds, cancellation policies it may offer). The host's own settings — nightly rate, cleaning fee,
# pet and extra-guest fees, discounts, the cancellation policy offered to new bookings, the registration
# number — live on the listing record; each fee change is logged, and calendar blocks, quality
# assessments and regulatory notices are booked in listing_events.

category: listing
display_name: Listings

binding:
  holding_table: listings
  event_tables: [listing_events]
  intake_tables: [listing_reinstatement_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [draft, pending_inspection, listed, snoozed, unlisted, suspended, removed]
  transitions:
    - {from: draft, to: listed, by: user, means: "The host publishes a listing that meets every publishing requirement of its space type."}
    - {from: draft, to: pending_inspection, by: user, means: "The host submits a listing whose space type requires an in-person inspection before publishing."}
    - {from: pending_inspection, to: listed, by: system, means: "The inspection is passed and the listing is published."}
    - {from: listed, to: snoozed, by: user, means: "The host pauses new bookings for a date range; confirmed stays continue."}
    - {from: snoozed, to: listed, by: user, means: "The host ends the snooze, or the snooze end date arrives."}
    - {from: listed, to: unlisted, by: user, means: "The host takes the listing out of search indefinitely; confirmed stays continue."}
    - {from: snoozed, to: unlisted, by: user, means: "The host unlists a snoozed listing."}
    - {from: unlisted, to: listed, by: user, means: "The host relists an unlisted listing."}
    - {from: listed, to: suspended, by: system, means: "Roamhaven suspends the listing for quality, registration, safety or host-account reasons."}
    - {from: snoozed, to: suspended, by: system, means: "Roamhaven suspends a snoozed listing."}
    - {from: unlisted, to: suspended, by: system, means: "Roamhaven suspends an unlisted listing."}
    - {from: suspended, to: listed, by: agent, means: "Support reinstates a suspended listing once its approved reinstatement request and every reinstatement condition are on record."}
    - {from: unlisted, to: removed, by: user, means: "The host permanently deactivates an unlisted listing."}
    - {from: suspended, to: removed, by: system, means: "Roamhaven permanently removes a suspended listing whose reinstatement request was denied."}

accounts: []   # a listing carries no money balance of its own; prices are settings and money moves on stays and payouts

parameter_schema:
  max_guest_capacity: "int, the most guests a listing of this space type may accept (max_guests may not exceed it)"
  min_bedrooms: "int, the fewest bedrooms a listing of this space type must have"
  min_photos_to_publish: "int, photos a listing must carry before it can be published"
  professional_photography_required: "bool, whether the photos must come from a Roamhaven-commissioned photographer"
  in_person_inspection_required: "bool, whether the listing must pass an in-person inspection before publishing"
  inspection_validity_months: "int, calendar months a passed inspection remains valid; 0 where no inspection is required"
  regulatory_class: "enum (hosted | unhosted), the class under which jurisdiction registration rules apply"
  entire_place: "bool, whether the guest has the entire space to themselves"
  smoke_and_co_alarms_required: "bool, whether working smoke and carbon monoxide alarms must be declared before publishing"
  indoor_cameras_allowed: "bool, whether any camera may be placed inside the listing"
  exterior_camera_disclosure_required: "bool, whether exterior cameras and noise monitors must be disclosed on the listing"
  party_ban_applies: "bool, whether the global ban on parties and events applies to the listing"
  nightly_rate_min_usd: "decimal USD, lowest nightly rate the host may set"
  nightly_rate_max_usd: "decimal USD, highest nightly rate the host may set"
  cleaning_fee_max_usd: "decimal USD, highest cleaning fee (per stay) the host may set"
  short_stay_cleaning_fee_allowed: "bool, whether the host may set a lower cleaning fee for short stays"
  short_stay_max_nights: "int, longest stay (nights) charged the short-stay cleaning fee; 0 where not allowed"
  pet_fee_max_usd: "decimal USD, highest pet fee (per stay) the host may set"
  extra_guest_fee_max_usd: "decimal USD, highest extra-guest fee per extra guest per night the host may set"
  fee_change_applies_to: "string, which stays a fee or rate change affects"
  weekly_discount_min_nights: "int, fewest nights for the weekly discount to apply"
  monthly_discount_min_nights: "int, fewest nights for the monthly discount to apply"
  new_listing_promo_pct: "decimal percent off the nightly subtotal under the new-listing promotion; 0.00 where not offered"
  new_listing_promo_max_bookings: "int, stays that may receive the new-listing promotion; 0 where not offered"
  new_listing_promo_window_days: "int, calendar days after first publishing during which a booking may receive the promotion; 0 where not offered"
  early_bird_min_lead_days: "int, fewest calendar days between booking and check-in for the early-bird discount"
  last_minute_max_lead_days: "int, most calendar days between booking and check-in for the last-minute discount"
  discount_selection_rule: "string, how competing discounts on one booking combine"
  minimum_nights_floor: "int, lowest minimum-night setting the host may choose"
  minimum_nights_ceiling: "int, highest minimum-night setting the host may choose"
  quality_min_avg_rating: "decimal stars, average guest rating below which the listing is suspended at a quality assessment"
  quality_warning_avg_rating: "decimal stars, average guest rating below which (and at or above the minimum) the listing receives a quality warning"
  quality_min_reviews: "int, guest reviews in the lookback window needed before a listing is assessed at all"
  quality_lookback_days: "int, calendar days of guest reviews counted at each assessment"
  quality_assessment_schedule: "string, the dates on which quality assessments run"
  quality_suspension_min_days: "int, calendar days a quality-suspended listing stays suspended before it can be reinstated"
  registration_display_required: "bool, whether the jurisdiction registration number must be displayed on the listing"
  registration_notice_cure_days: "int, calendar days after a jurisdiction notice within which a valid registration number must be recorded"
  host_cancel_calendar_block: "bool, whether the nights of a stay the host cancels are blocked on the calendar"
  host_cancel_block_scope: "string, which nights the host-cancellation block covers"
  cancellation_policy_options: "list, the cancellation policies a listing of this space type may offer"
  super_strict_min_host_tiers: "list, host account tiers allowed to choose a Super Strict policy"
  cancellation_policy_change_applies_to: "string, which stays a change of cancellation policy affects"
  location_verification_required: "bool, whether the listing's address must be verified after publishing"
  location_verification_deadline_days: "int, calendar days after first publishing to complete location verification; 0 where not required"
  snooze_keeps_confirmed_stays: "bool, whether snoozing or unlisting leaves confirmed stays in place"
  removal_blocked_by_upcoming_stays: "bool, whether a listing with confirmed, checked-in or requested stays cannot be removed"
  removed_listing_relist_allowed: "bool, whether a removed listing can ever be relisted"
  max_listing_title_chars: "int, longest listing title in characters"
  quality_suspension_honors_confirmed_stays: "bool, whether confirmed stays of a quality-suspended listing go ahead"
  extra_guest_threshold_min: "int, lowest guest count from which the host may start charging the extra-guest fee (the fee applies to each guest beyond the threshold)"
  instant_book_allowed: "bool, whether the host may switch on Instant Book for the listing"

