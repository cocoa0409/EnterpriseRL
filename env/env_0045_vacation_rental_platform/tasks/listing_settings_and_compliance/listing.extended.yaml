      - result: "RND(P('pet_fee_max_usd') + pet_claim_allowance + pet_loss_allowance + pet_sublimit_allowance, 2)"
    compute_basis:
      pet_recent_reviews: "the guest reviews counted by the quality assessments recorded on the listing within the last three months (fewer than three whole months before the day of the reset) are added up"
      pet_lookback_months: "when they come to pet_window_busy_reviews or more, the look-back is shortened to the last pet_window_busy_months whole months, because a busy listing's recent claims already show its pet costs; when they come to fewer than pet_window_quiet_reviews, the look-back is lengthened to the last pet_window_quiet_months whole months, because a quiet listing needs a longer record; otherwise the standard pet-claim look-back applies."
      pet_claims_in_lookback: "two of them rest on the HostCover claims in the pet_damage category that the claims team approved and that were filed on the listing within the pet-claim look-back"
      pet_claim_allowance: "when two or more such claims were filed within the look-back, the pet-damage claim allowance is pet_claims_two_allowance; when exactly one was, it is pet_claims_one_allowance; when none was, there is no pet-damage claim allowance; denied, withdrawn or still open claims never count."
      pet_losses_in_lookback: "the verified losses of those same claims are added up"
      pet_loss_allowance: "when they come to pet_loss_high or more, the pet-damage loss allowance is pet_loss_high_allowance; when they are above zero but below pet_loss_high, it is pet_loss_low_allowance; when there are none, there is no pet-damage loss allowance."
      plan_pet_sublimit: "when the pet-damage sublimit of the HostCover level the listing's active plan holds is at most pet_sublimit_low_max"
      pet_sublimit_allowance: "the pet sublimit allowance is pet_sublimit_low_allowance; when that sublimit is above pet_sublimit_low_max and at most pet_sublimit_mid_max, it is pet_sublimit_mid_allowance; when it is above pet_sublimit_mid_max, there is no pet sublimit allowance."
      result: "The pet-fee ceiling is the standard pet-fee ceiling plus the three pet-fee allowances, rounded half up to the cent at that final step only."
    factors:
