    rule: >-
      A listing's regular cleaning fee may be no higher than its cleaning-fee ceiling, and a cleaning fee
      standing above that ceiling is reset to the ceiling exactly, the reset being logged as one change of the
      cleaning fee; a cleaning fee at or below the ceiling is left as it stands, and the reset leaves the
      short-stay cleaning fee as it stands. The standard cleaning-fee ceiling is the space type's
      cleaning_fee_max_usd, in US dollars to the cent. On top of the standard cleaning-fee ceiling a listing
      may carry five cleaning-fee allowances, each worked out on the day of the reset. The deep-cleaning
      allowance rests on the HostCover claims in the deep_cleaning category that the claims team approved and
      that were filed on the listing within the deep-cleaning look-back; the standard deep-cleaning look-back
      is the last deep_window_standard_months whole months before the day of the reset, counted from the date
      part of filed_at. Deep-cleaning look-back by guest record: when any quality assessment recorded on the
      listing within the last twelve months (fewer than twelve whole months before the day of the reset) has
      outcome warning or suspension, the look-back is shortened to the last deep_window_troubled_months whole
      months, so that only the deep-cleaning costs of the period the guests' complaints describe are credited;
      when at least clean_record_min_quarters quality assessments were recorded on the listing within the last
      twenty-four months and every one of them has outcome pass, the look-back is lengthened to the last
      deep_window_clean_months whole months; otherwise the standard deep-cleaning look-back applies.
      Deep-cleaning allowance: the claims within the look-back are counted and their verified losses added
      up; when two or more such claims were filed or their verified losses add up to deep_clean_large_loss or
      more, the deep-cleaning allowance is deep_clean_high_allowance; when exactly one such claim was filed
      and its verified loss is below deep_clean_large_loss, it is deep_clean_low_allowance; when none was,
      there is no deep-cleaning allowance. Cleaning sublimit allowance: when the deep-cleaning sublimit of the
      HostCover level the listing's active plan holds is at most clean_sublimit_low_max, the cleaning
      sublimit allowance is clean_sublimit_low_allowance; when that sublimit is above clean_sublimit_low_max
      and at most clean_sublimit_mid_max, it is clean_sublimit_mid_allowance; when it is above
      clean_sublimit_mid_max, there is no cleaning sublimit allowance. Cleaning deductible allowance: the host
      bears the plan's deductible on every deep-cleaning claim, so when the deductible of the HostCover level
      the listing's active plan holds is at least clean_deductible_high_min, the cleaning deductible
      allowance is clean_deductible_high_allowance; when it is at least clean_deductible_mid_min and below
      clean_deductible_high_min, it is clean_deductible_mid_allowance; when it is below
      clean_deductible_mid_min, there is no cleaning deductible allowance. Superhost cleaning allowance: when
      the host account's tier is Superhost and its superhost_since date lies superhost_standing_months or more
      whole months before the day of the reset, the Superhost cleaning allowance is superhost_long_allowance;
      when the tier is Superhost and that date lies fewer whole months back, it is superhost_short_allowance;
      for any other tier there is no Superhost cleaning allowance. Listing tenure allowance: when the
      listing's first_listed_date lies tenure_long_months or more whole months before the day of the reset,
      the listing tenure allowance is tenure_long_allowance; when it lies at least tenure_mid_months and
      fewer than tenure_long_months whole months back, it is tenure_mid_allowance; when it lies fewer than
      tenure_mid_months whole months back, there is no listing tenure allowance. The cleaning-fee ceiling is
      the standard cleaning-fee ceiling plus the five cleaning-fee allowances, rounded half up to the cent at
      that final step only.
    prerequisite: []
    cross_category:
