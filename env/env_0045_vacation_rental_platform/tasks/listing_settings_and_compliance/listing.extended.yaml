      - pet_claim_allowance: "K('pet_claims_two_allowance') if pet_claims_in_lookback >= 2 else (K('pet_claims_one_allowance') if pet_claims_in_lookback == 1 else 0)"
      - pet_losses_in_lookback: "XSUM('protect', 'protection_claims', 'verified_loss_amount', within_months=pet_lookback_months, date_field='filed_at', listing_id=HID, damage_category='pet_damage', claim_status='approved')"
      - pet_loss_allowance: "K('pet_loss_high_allowance') if pet_losses_in_lookback >= K('pet_loss_high') else (K('pet_loss_low_allowance') if pet_losses_in_lookback > 0 else 0)"
