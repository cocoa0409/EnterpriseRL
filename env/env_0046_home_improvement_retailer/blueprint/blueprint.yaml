name: env_0046_home_improvement_retailer
company: Ridgeline Home Center

background: |
  Ridgeline Home Center is a home improvement big-box retailer operating 612 warehouse-format stores across 31 states, selling building materials, lumber, flooring, kitchen and bath, appliances, tools, paint and garden supplies to homeowners and to professional contractors.
  Its Customer Care center serves both household shoppers and pro customers by phone and chat in a plain, practical tone, and it looks after the accounts, contracts and orders customers hold with the company rather than individual store purchases.
  Households can hold Ridgeline Consumer Credit, issued with Ridgeline's partner bank: the revolving Ridgeline Consumer Credit Card in the Classic, Preferred and Premier tiers, and the installment Ridgeline Project Loan 66, 78 and 84, each booked as a monthly statement with purchases, payments, interest, fees and credits.
  Businesses can hold Ridgeline Pro Credit: the Ridgeline Pro Revolving Charge and Pro Revolving Charge Plus, and the pay-in-full Ridgeline Commercial Account Net 30, Net 30 Select, Net 45 and Net 60 Enterprise, which bill each purchase as an invoice under a job name and purchase order.
  Pro customers also join Ridgeline ProBuild Rewards, tiered ProBuild Member, Bronze, Silver, Gold, Platinum and Platinum Elite by annual qualifying spend, which accrues perks points and grants volume pricing quotes and tier benefits across the other programs.
  Ridgeline Installation Services sells installed projects through the Ridgeline Carpet Installation, Hard Surface Flooring Installation, Window and Door Installation, Kitchen Cabinet and Countertop Installation, Bath Remodel Installation and Roofing and Siding Installation programs, each held as a contract that starts with an in-home measure and runs through signing, scheduling, installation and closing.
  Ridgeline Tool Rental rents equipment from in-store rental centers under one agreement per item, in six classes from Hand and Power Tools, Floor and Surface Care, Lawn and Landscape and Concrete and Masonry to Aerial and Lifting and Earthmoving and Compact Equipment, billing rental time, damage protection, deposits and return fees.
  Ridgeline Special Order Services orders non-stocked items from vendors for one customer: Catalog Merchandise, Cut-to-Order Flooring, Made-to-Measure Window Coverings, Windows and Exterior Doors, Semi-Custom Cabinetry and Fabricated Countertops, each order billed at placement and tracked from vendor confirmation to pickup or delivery.
  Ridgeline Orders & Delivery covers online and phone orders fulfilled by Ridgeline Ship to Home, Buy Online Pick Up In Store, Ship to Store, Same-Day Delivery, Scheduled Truck Delivery, and Appliance Delivery and Haul-Away.
  Payments for contracts, rentals and orders can be charged to a Ridgeline credit account, so a single kitchen remodel can leave a trail of special order deposits, installation payments and refunds across a customer's consumer card or commercial account.
  Callers range from homeowners juggling a flooring contract and a store card statement to remodelers and property managers who carry a commercial account, a ProBuild membership, several rentals and special orders for active jobs at the same time.
  Many arrive with history already on file: missed or returned payments, prior courtesy waivers, rescheduled installations, vendor delays, damaged deliveries, overdue rentals and disputes that are still open.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: consumer_credit_servicing
    claim:
      categories: [card]
      event_types: [card_payment_posted, card_fee_assessed, card_fee_reversed, card_fee_waived, card_return_credit_posted, card_credit_balance_refunded, card_dispute_credit_posted, card_credit_limit_changed, card_autopay_changed, card_authorized_users_changed, card_account_closed]
    summary: >
      Household cardholders and borrowers call about a Ridgeline Consumer Credit Card (Classic, Preferred or Premier) or a Ridgeline Project Loan (66, 78 or 84) that may be active, suspended, closed or charged off, often while also holding the other kind of account, and they ask to make a payment, question a late or returned payment fee, request a courtesy waiver, ask where a refund from a returned purchase, cancelled installation, special order or rental went, dispute a charge, ask for a credit line increase, change autopay or authorized users, or close the account.
      The records involved are the account (tier, status, opening date, credit line and its last change, balance, draw period end), its statements with minimum payment, due date and days past due, and the purchase, payment, fee, interest, credit and dispute lines that reference one another, plus card_requests for disputes, closures and increases; refunds originate in the selling programs' own records and must be matched to the original purchase they credit.
      The governing rules are shaped by tier and history: payment posting with its cutoff and the per-tier phone payment fee (card_evt_payment_posting), the allocation of amounts above the minimum (card_evt_payment_allocation), first-versus-repeat late fees capped at the minimum due (card_evt_late_fee), the single-event rule for returned payments (card_evt_returned_payment), corrections that are owed regardless of history (card_evt_fee_correction) as distinct from tenure-, window- and count-limited courtesy waivers (card_evt_courtesy_waiver), the statement-anchored dispute window (card_evt_billing_dispute), return credits to the funding account and credit balance refunds (card_evt_return_credit), and increases bounded by tenure, cooldown, clean history, tier maximum and the combined exposure cap (card_credit_line_increase, card_agg_combined_exposure); statements, fees and payments occur in their natural monthly order as background only.
      Payments, fee corrections, waivers, credits and limit changes are agent service actions on a verified account, while consenting to a debit from the customer's bank account, confirming an account closure and other choices only the cardholder can make are the customer's own steps handed over to them.
      Requests no policy decides — reinstating a suspended account early, reversing a charge-off, re-aging a delinquent account, a hardship or settlement plan, changing the APR, or a dispute about a merchant's product quality rather than a billing error — fall outside the charter and go to a human representative as POLICY_NOT_COVERED.

  - name: pro_credit_account_servicing
    claim:
      categories: [trade]
      event_types: [trade_payment_received, trade_fee_assessed, trade_early_pay_discount_applied, trade_tax_credit_posted, trade_return_credit_posted, trade_fee_waived, trade_fee_reversed, trade_dispute_credit_posted, trade_credit_limit_changed, trade_tax_exemption_updated, trade_account_settings_updated, trade_account_closed]
    summary: >
      Contractors, remodelers, property managers and facility buyers call about a Ridgeline Pro Revolving Charge or a Commercial Account (Net 30, Net 30 Select, Net 45 or Net 60 Enterprise), sometimes holding one of each, with accounts that may be active, on hold for past-due or over-limit balances or a sister account's hold, closed or charged off; they want to pay specific invoices, understand why a prompt-payment discount or a late payment charge did or did not apply, get sales tax back on exempt purchases, dispute an invoice, have a refund credited, raise their credit line, change purchase order or buyer settings, or close the account.
      The records involved are the account (tier, status and hold reason, credit line, tax exemption certificate with effective and expiry dates, PO requirement, buyers), its invoices with invoice date, due date, merchandise and tax amounts, job name, PO number and pricing basis including any ProBuild quote, payment lines applied invoice by invoice, statements with past-due balances and days past due, fee and credit lines and trade_requests, read alongside the business's ProBuild membership and quotes.
      The governing rules are tier-dependent: payment application to named invoices then oldest past due (trade_evt_payment_application), the prompt-payment discount window counted from the invoice date and its mutual exclusion with volume-quote pricing (trade_evt_early_pay_discount), late fees versus percentage late payment charges with their grace days (trade_evt_late_charges), tax credits bounded by the certificate's dates and the lookback window (trade_evt_tax_exempt_credit), invoice disputes anchored on the invoice date (trade_evt_invoice_dispute), courtesy waivers with per-tier counts and size caps (trade_evt_courtesy_waiver), corrections (trade_evt_fee_correction), increases with an underwriting threshold (trade_credit_line_increase), and the cross-default and exposure rules across the two accounts (trade_agg_relationship); invoices, statements, holds and releases follow one another in time as background only.
      Applying payments, posting discounts, credits, corrections and settings changes are agent service actions for a verified business, while authorizing a debit, confirming a closure and instructing settings changes must come from an owner, principal or authorized buyer as the charter specifies and are handed to the customer where only they can act.
      Situations the charter does not decide — releasing a hold before the past-due amount clears, negotiating extended terms or a payment plan, changing a personal guarantee, pricing disputes that are really vendor rebate claims, or a credit request above the underwriting threshold that needs a decision now — go to a human representative as POLICY_NOT_COVERED.

  - name: installation_contract_servicing
    claim:
      categories: [install]
      event_types: [install_measure_booked, install_measure_fee_charged, install_contract_signed, install_quote_extended, install_scheduled, install_rescheduled, install_cancelled, install_change_order_billed, install_fee_charged, install_credit_applied, install_payment_received, install_refund_issued]
    summary: >
      Homeowners and small landlords call about installation contracts in the carpet, hard surface flooring, window and door, kitchen cabinet and countertop, bath remodel or roofing and siding programs, at stages from a booked measure to a signed, scheduled, in-progress, completed or cancelled contract, often with more than one program at the same address, materials coming through a linked special order, and payments made on a Ridgeline credit account; they want to book or cancel a measure, sign or extend a quote, rescind or cancel an agreement, reschedule, approve a change order, pay a deposit or balance, or get credits and refunds for missed visits and delays.
      The records involved are the contract (program, status, measure dates and appointment, quote amount and expiry, signing date and channel, contract price, materials and permit status, original and current installation dates, reschedule count, linked special order) and its charge, payment, credit, refund and visit lines and install_requests; whether an earlier step is finished is read from those records, not from the customer's account of it.
      The governing rules vary by program: measure fees and their refund or credit windows (install_measure_booking, install_measure_cancellation, install_measure_fee_credit), quote expiry (install_quote_and_signing), deposits and progress payments (install_payments), the business-day rescission right for in-home signings (install_rescission), materials-dependent cancellation fees and the linked special order boundary (install_cancellation_fees), scheduling prerequisites and notice-based reschedule fees with a reschedule limit (install_scheduling), trip charges, no-show and delay credits that do not stack (install_visits_and_delays, install_agg_same_address), change order limits (install_change_orders) and refunds to the original tender (install_refunds); the measure-quote-sign-schedule-install sequence is the natural order of the domain, stated here as background only.
      Booking measures and installation dates, posting fees, credits, payments and refunds are agent service actions on a verified customer, while signing an agreement or change order, confirming a rescission or cancellation and choosing a remedy are the customer's own steps handed over to them.
      Requests the charter does not decide — cancelling after work has started, disputes over the quality of finished work beyond booking a warranty visit, damage to the home during installation, a change order beyond the re-quote limit that the customer wants priced now, or installer behaviour complaints — go to a human representative as POLICY_NOT_COVERED.

  - name: tool_rental_servicing
    claim:
      categories: [rental]
      event_types: [rental_reserved, rental_cancelled, rental_extended, rental_fee_charged, rental_pro_discount_applied, rental_malfunction_credit_issued, rental_charge_adjusted, rental_payment_received, rental_deposit_collected, rental_deposit_applied, rental_deposit_released, rental_refund_issued]
    summary: >
      Do-it-yourself renters and contractors call about rental agreements across the six equipment classes, from a reservation not yet picked up to equipment on rent, overdue, returned, converted as lost or closed, sometimes with several agreements open, a ProBuild membership whose tier sets a rental discount, or a Pro Credit account that changes the deposit; they want to reserve or cancel, extend before the due-back time, understand the final bill, report a breakdown, dispute damage, cleaning, fuel or accessory charges, or get a deposit or overpayment back.
      The records involved are the agreement (class, status, daily rate, replacement value, pickup, checkout, due-back and return moments, damage protection and insurance certificate, deposit, delivery distance, fuel and hour meter readings, balance and deposit held), its rental time, fee, inspection, discount, credit, deposit, payment and refund lines, and rental_requests, read alongside the renter's ProBuild membership and Pro Credit account status.
      The governing rules are class-dependent: rental time billed as the lowest-cost combination of period rates with a grace period and a weekend special (rental_time_billing), damage protection charged on discounted time with coverage limits, deductibles and exclusions (rental_damage_protection), return fees from the inspection record (rental_return_fees), the ProBuild discount that does not combine with the weekend special (rental_pro_discount, rental_agg_pro_relationship), malfunction credits keyed to the report time (rental_malfunction), extension before the due-back time (rental_extensions), reservation deposits and notice (rental_reservations), overdue and conversion thresholds (rental_overdue_and_conversion), damage dispute windows (rental_damage_disputes) and settlement of deposits against the balance (rental_settlement); reservation, checkout, return, inspection and settlement follow one another as background only.
      Reserving, extending, posting fees, credits, deposit applications and releases, payments and refunds are agent service actions on a verified renter, while cancelling their own reservation, accepting a remedy and authorizing a charge to their own tender are the renter's steps handed over to them.
      Situations the charter does not decide — injury or property damage caused by rented equipment, reversing a conversion after the equipment reappears, theft reports, waiving a mandatory damage protection without a certificate, or rate disputes against the printed rate card — go to a human representative as POLICY_NOT_COVERED.

  - name: special_order_servicing
    claim:
      categories: [special]
      event_types: [special_order_placed, special_payment_received, special_cancelled, special_returned, special_fee_charged, special_credit_applied, special_refund_issued]
    summary: >
      Homeowners and pros call about special orders for catalog merchandise, cut-to-order flooring, made-to-measure window coverings, windows and exterior doors, semi-custom cabinetry or fabricated countertops, at any point from placed and vendor-confirmed through in production, shipped, ready, completed, cancelled or returned, often tied to an installation contract at the same address, priced under a ProBuild quote, or paid on a Ridgeline credit account; they want to place or cancel an order, know what a vendor delay entitles them to, report damage at pickup or delivery, return an item, avoid storage or abandonment charges, or trace a refund.
      The records involved are the order (program, status, order moment and date, order total and pricing basis, promised and estimated ready dates, who measured, template status, vendor milestones, ready and pickup dates, linked installation contract) and its billing, payment, fee, credit, refund and inspection lines and special_requests, read alongside the linked installation contract and the customer's ProBuild membership.
      The governing rules vary by program: placement prerequisites including a Ridgeline measure for made-to-measure work (special_agg_install_link, special_order_placement), deposits (special_payments), the hours-based free cancellation window and fees before production (special_cancellation), the choice between a fee-free cancellation and a capped delay credit when the vendor runs late (special_vendor_delay), damage reported within hours of handover with a reorder-or-allowance choice (special_receipt_and_damage), storage and abandonment after the hold period (special_pickup_storage_abandonment), returns limited to returnable programs with restocking fees and their waivers (special_returns), price protection (special_price_protection) and refunds to the original tender (special_refunds); vendor confirmation, production, shipment, receipt and pickup follow one another as background only.
      Placing orders, posting fees, credits, payments and refunds are agent service actions on a verified customer, while confirming a cancellation or return of their own order and choosing between remedies are the customer's own steps handed over to them.
      Situations the charter does not decide — product defects that surface after the damage window and fall under the manufacturer's warranty, a remake of an item the customer measured themselves, cancelling a non-cancellable order outside any delay remedy, or vendor-specific claims such as freight damage disputes with the carrier — go to a human representative as POLICY_NOT_COVERED.
