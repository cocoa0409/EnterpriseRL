# Ridgeline Installation Services — installed-sales programs sold through the store and in the home,
# measured and installed by licensed, insured independent installers under a Ridgeline installation agreement.
category: install
display_name: Ridgeline Installation Services

binding:
  holding_table: install_contracts
  event_tables: [install_charges]
  intake_tables: [install_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: contract_balance}

lifecycle:
  states: [measure_booked, measured, contracted, scheduled, in_progress, completed, closed, cancelled]
  transitions:
    - {from: measure_booked, to: measured, by: system, means: The installer completes the in-home measure or consultation and the installed-price quote is issued.}
    - {from: measure_booked, to: cancelled, by: user, means: The customer cancels the measure appointment.}
    - {from: measured, to: contracted, by: user, means: The customer signs the installation agreement at the quoted price.}
    - {from: measured, to: cancelled, by: system, means: The quote expires unsigned.}
    - {from: measured, to: cancelled, by: user, means: The customer declines the quote.}
    - {from: contracted, to: scheduled, by: agent, means: An installation date is booked once materials are received and any permit is issued.}
    - {from: contracted, to: cancelled, by: user, means: The customer rescinds or cancels the agreement before installation is scheduled.}
    - {from: scheduled, to: cancelled, by: user, means: The customer cancels a scheduled installation.}
    - {from: scheduled, to: cancelled, by: system, means: Ridgeline cancels the contract after the customer misses the allowed number of installation visits.}
    - {from: scheduled, to: in_progress, by: system, means: The installer starts work on site.}
    - {from: in_progress, to: completed, by: system, means: The installer records the installation as complete.}
    - {from: completed, to: closed, by: system, means: The contract closes once the balance is 0.00 and the completion sign-off is recorded or its sign-off period has passed.}

accounts:
  - key: contract_balance
    unit: USD
    meaning: Amount the customer owes on the contract — measure fee, contract price, change orders, fees and refunds paid out in; payments and credits out (negative means money is owed back to the customer).

parameter_schema:
  measure_fee_usd: Fee for the in-home measure or design consultation, charged and paid when the measure is booked; 0 means a free consultation, USD.
  measure_fee_creditable: Whether the measure fee is credited against the contract price when the agreement is signed within the credit window, boolean.
  measure_fee_credit_window_days: Days after the measure is completed within which signing the agreement earns the measure fee credit, calendar days.
  measure_cancel_notice_hours: Hours before the measure appointment start by which a cancellation refunds the measure fee, hours.
  measure_fee_refundable_on_cancel: Whether the measure fee is refunded when the measure is cancelled with the required notice, boolean.
  measure_appointment_lead_days: Earliest measure appointment, in days after the booking date, calendar days.
  quote_validity_days: Days after the measure is completed that the installed-price quote stays valid (sets quote_expiry_date), calendar days.
  quote_extension_days: Days a quote may be extended once, on request before it expires; 0 means no extension, calendar days.
  min_job_charge_usd: Minimum installed contract price for the program, USD.
  deposit_pct: Deposit due at signing as a percentage of the contract price; 100 means paid in full at signing, percent.
  deposit_min_usd: Minimum deposit due at signing, USD.
  progress_payment_pct: Payment due when work starts as a percentage of the contract price; 0 means none, percent.
  final_payment_due_days_after_completion: Days after completion by which the remaining balance is due, calendar days.
  payment_methods_accepted: Tenders accepted for contract payments (list drawn from cash, check, bank_card, ridgeline_consumer_credit, ridgeline_pro_credit).
  contract_signing_channels: Channels in which the agreement may be signed (list drawn from in_home, in_store, online).
  rescission_days: Business days after signing during which an agreement signed in the customer's home may be cancelled without penalty, business days.
  rescission_min_contract_usd: Contract price at or above which the home-signing cancellation right applies, USD.
  rescission_applies_in_store: Whether the cancellation right also applies to agreements signed in the store or online, boolean.
  cancellation_fee_pct_before_materials: Cancellation fee as a percentage of the contract price when no materials have been ordered, percent.
  cancellation_fee_pct_after_materials: Cancellation fee as a percentage of the contract price once materials are ordered or received, percent.
  cancellation_fee_min_usd: Minimum cancellation fee when a percentage fee applies, USD.
  cancellation_after_start_allowed: Whether the customer may cancel once installation work has started, boolean.
  reschedule_free_notice_hours: Hours before the scheduled installation start by which the customer may reschedule free of charge, hours.
  reschedule_fee_usd: Fee for a customer reschedule made with less notice, or beyond the free reschedule limit, USD.
  max_customer_reschedules: Number of customer reschedules allowed before every further reschedule incurs the reschedule fee regardless of notice, count.
  trip_charge_usd: Charge for an installer visit that cannot proceed because the customer is absent or the site is not ready, or for an out-of-warranty service visit, USD.
  installer_no_show_credit_usd: Credit posted when the installer misses a scheduled installation or warranty visit, USD.
  delay_threshold_days: Days by which installation may start later than the original installation date for reasons on Ridgeline's or the installer's side before the delay remedies apply, calendar days.
  delay_credit_usd: Credit posted when installation starts more than the delay threshold after the original installation date for reasons on Ridgeline's or the installer's side, USD.
  delay_cancellation_fee_waived: Whether the cancellation fee is waived when the customer cancels because of a delay beyond the threshold, boolean.
  labor_warranty_months: Installation labor warranty measured from the completion date, calendar months.
  warranty_transferable: Whether the labor warranty transfers to a later owner of the home, boolean.
  workmanship_claim_response_days: Days within which a warranty service visit is booked after a workmanship claim, calendar days.
  permit_fee_passthrough: Whether the municipal permit fee is billed to the customer at cost, boolean.
  permit_handling_fee_usd: Fee for pulling and managing the permit, charged when a permit is required, USD.
  scheduling_requires_permit_issued: Whether installation can be scheduled only after a required permit is issued, boolean.
  scheduling_requires_materials_received: Whether installation can be scheduled only after all materials are received, boolean.
  min_lead_days_install: Earliest installation date, in days after the later of contract signing and materials receipt, calendar days.
  materials_lead_days_estimate: Typical days from signing to materials receipt quoted to the customer, calendar days.
  haul_away_included: Whether removal and disposal of the old material is included in the contract price, boolean.
  haul_away_fee_usd: Fee for removal and disposal of the old material when it is not included, USD.
  change_order_admin_fee_usd: Administrative fee per signed change order that increases the price, USD.
  change_order_max_pct_without_requote: Largest cumulative increase over the contract price that change orders may add before a new measure and quote are required, percent.
  change_order_sign_days: Days a change order stays open for the customer's signature before it lapses, calendar days.
  final_walkthrough_required: Whether a final walkthrough with the customer is required before the contract can close, boolean.
  punch_list_holdback_pct: Percentage of the contract price the customer may withhold from the final payment while punch-list items recorded at the walkthrough remain open, percent.
  punch_list_resolution_days: Days after completion within which recorded punch-list items are resolved, calendar days.
  completion_signoff_days: Days after completion after which an unsigned completion sign-off is treated as given, calendar days.
  customer_no_show_cancel_count: Number of installation visits missed by the customer after which Ridgeline may cancel the contract with the cancellation fee, count.

