events:
  - type: order_placed
    target: orders
    mutation: create
    meaning: A customer places an online, app or phone order of stocked merchandise under one fulfillment program.
    grain: one row per order
    fields:
      customer_id: The customer who placed the order.
      variant_name: Fulfillment program, as its official full name.
      status: Set to placed on creation.
      order_number: Order number.
      order_placed_at: Moment the order was placed.
      order_date: Date the order was placed.
      merchandise_total: Pre-tax merchandise total.
      delivery_address: Delivery address; empty for pickup.
      promised_date: Promised ready or delivery date.
      delivery_window_start: Start of the booked delivery window.
      delivery_window_end: End of the booked delivery window.
      haul_away_selected: Whether haul-away of the old item was booked.
    triggers:
      - event: order:order_billed
        map: {event_date: order_date, amount: merchandise_total, order_number: order_number}
  - type: order_ready
    target: orders
    mutation: {transition: {from: placed, to: ready}}
    meaning: The order is staged for pickup, shipped, or loaded for its delivery date.
    grain: one row per transaction
    fields:
      status: Set to ready.
      ready_date: Date the order became ready or shipped.
      pickup_deadline_date: Last day a pickup order is held; empty for deliveries.
    triggers: []
  - type: order_dispatched
    target: orders
    mutation: {transition: {from: ready, to: out_for_delivery}}
    meaning: The order leaves for delivery.
    grain: one row per transaction
    fields:
      status: Set to out_for_delivery.
    triggers: []
  - type: order_fulfilled
    target: orders
    mutation: {transition: [{from: ready, to: fulfilled}, {from: out_for_delivery, to: fulfilled}]}
    meaning: The order is picked up or delivered.
    grain: one row per transaction
    fields:
      status: Set to fulfilled.
      fulfilled_at: Moment of pickup or delivery.
      fulfilled_date: Date of pickup or delivery.
    triggers: []
  - type: order_delivery_failed
    target: orders
    mutation: {transition: {from: out_for_delivery, to: ready}}
    meaning: A delivery attempt fails and the order returns to the store.
    grain: one row per transaction
    fields:
      status: Set back to ready.
      failed_delivery_count: Failed delivery attempts after this one.
    triggers: []
  - type: order_cancelled
    target: orders
    mutation: {transition: [{from: placed, to: cancelled}, {from: ready, to: cancelled}]}
    meaning: The order is cancelled by the customer, or by the system for an unclaimed pickup, exhausted delivery attempts or a long backorder.
    grain: one row per transaction
    fields:
      status: Set to cancelled.
      cancelled_date: Date of cancellation.
      cancellation_reason: Why the order was cancelled.
    triggers:
      - event: order:order_credit_applied
        map: {credit_type: order_cancellation, event_date: cancelled_date}
  - type: order_fully_returned
    target: orders
    mutation: {transition: {from: fulfilled, to: returned}}
    meaning: The last item of the order has been returned.
    grain: one row per transaction
    fields:
      status: Set to returned.
    triggers: []
  - type: order_delivery_rescheduled
    target: orders
    mutation: update
    meaning: A delivery window is moved, or a pickup hold is extended.
    grain: one row per transaction
    fields:
      delivery_window_start: Start of the new delivery window.
      delivery_window_end: End of the new delivery window.
      reschedule_count: Customer reschedules after the change.
      pickup_deadline_date: New last day of a pickup hold.
    triggers: []
  - type: order_billed
    target: order_events
    meaning: The merchandise total is billed when the order is placed.
    grain: one row per order
    distinguish_by: [order_number]
    fields:
      order_number: Order number.
      event_date: Date billed.
      amount: Merchandise total, positive.
    account: order_balance
    direction: in
    triggers:
      - event: order:order_payment_received
        map: {event_date: event_date, order_number: order_number}
  - type: order_fee_charged
    target: order_events
    meaning: A delivery, haul-away, basic install, redelivery, mail-return or return pickup charge is billed.
    grain: one row per fee type per date
    distinguish_by: [fee_type, event_date]
    fields:
      order_number: Order number.
      event_date: Date billed.
      fee_type: Which charge.
      amount: Charge amount, positive.
    account: order_balance
    direction: in
    triggers: []
  - type: order_payment_received
    target: order_events
    meaning: The order is paid.
    grain: one row per payment
    distinguish_by: [event_date, payment_method, amount]
    fields:
      order_number: Order number.
      event_date: Date of the payment.
      amount: Amount paid, positive.
      payment_method: Tender used.
    account: order_balance
    direction: out
    triggers:
      - event: card:card_purchase_posted
        when: {payment_method: ridgeline_consumer_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number, purchase_channel: online}
      - event: trade:trade_invoice_posted
        when: {payment_method: ridgeline_pro_credit}
        map: {transaction_date: event_date, invoice_date: event_date, amount: amount, purchase_channel: online}
  - type: order_return_credited
    target: order_events
    meaning: Returned items are credited against the order.
    grain: one row per return receipt
    distinguish_by: [return_receipt_number]
    fields:
      order_number: Order number.
      event_date: Date of the return.
      amount: Price of the returned items, positive.
      return_receipt_number: Return receipt number.
      item_category: Category of the returned items.
      return_reason: Reason for the return.
      return_channel: How the items came back.
    account: order_balance
    direction: out
    triggers:
      - event: order:order_refund_issued
        map: {event_date: event_date, amount: amount}
  - type: order_credit_applied
    target: order_events
    meaning: A credit reduces what the customer owes — cancellation of the order total, price adjustment, missed delivery window, delivery charge refund or late shipment refund.
    grain: one row per credit type per date
    distinguish_by: [credit_type, event_date]
    fields:
      order_number: Order number.
      event_date: Date the credit posts.
      credit_type: Which credit.
      amount: Credit amount, positive.
      order_request_id: The request the credit arises from, when any.
    account: order_balance
    direction: out
    triggers: []
  - type: order_refund_issued
    target: order_events
    meaning: Money paid on the order is refunded to the tender it was paid with.
    grain: one row per refund per return receipt or credit
    distinguish_by: [event_date, amount, refund_method]
    fields:
      order_number: Order number.
      event_date: Date the refund is issued.
      amount: Amount refunded, positive.
      refund_method: Tender refunded to.
      original_event_id: The order_payment_received row refunded.
    account: order_balance
    direction: in
    triggers:
      - event: card:card_return_credit_posted
        when: {refund_method: ridgeline_consumer_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number}
      - event: trade:trade_return_credit_posted
        when: {refund_method: ridgeline_pro_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number}
  - type: order_delivery_attempt_recorded
    target: order_events
    meaning: The driver or crew records the outcome of a delivery attempt.
    grain: one row per delivery attempt
    distinguish_by: [event_date, attempt_number]
    fields:
      order_number: Order number.
      event_date: Date of the attempt.
      amount: 0.00 — an attempt record moves no money.
      attempt_number: Attempt number on the order.
      attempt_outcome: What happened.
      arrived_at: Moment the truck arrived.
    triggers:
      - event: order:order_fee_charged
        when: {attempt_outcome: customer_absent}
        map: {fee_type: redelivery_fee, event_date: event_date}
      - event: order:order_credit_applied
        when: {attempt_outcome: [delivered_late, truck_missed_window]}
        map: {credit_type: missed_window_credit, event_date: event_date}

measures:
  - id: order_msr_net_paid
    window: Life of the order up to the frozen date.
    measure: Sum of order_payment_received amounts minus order_refund_issued amounts on the order.
  - id: order_msr_same_day_deliveries
    window: One delivery date, across the customer's orders to the same delivery_address.
    measure: Count of the customer's orders with a delivery charge already billed for that delivery date and address.

policies:
  - id: order_agg_multi_holding
    subject: [order_placed]
    rule: >-
      A customer may hold any number of orders, each under one fulfillment program; an order mixing pickup and delivery items is split into one order per program at checkout.
    eligibility: []
    params:
      max_per_customer: null

  - id: order_agg_same_day_delivery
    subject: [order_fee_charged]
    rule: >-
      Orders of one customer delivered by Ridgeline trucks to the same address on the same day are charged one delivery charge: when order_msr_same_day_deliveries is already one or more, no further delivery charge is billed for that date and address, and the charge kept is the highest delivery_fee_usd among those orders.
      Haul-away and basic install charges are billed per order regardless of consolidation, and shipped orders are never consolidated.
    eligibility: []
    measures: [order_msr_same_day_deliveries]

  - id: order_placement_and_payment
    subject: [order_placed, order_billed, order_payment_received, order_ready, order_dispatched, order_fulfilled]
    rule: >-
      An order is accepted only when the merchandise total is at least order_min_usd and the item meets the program's entry_gate; a same-day order must be placed by same_day_order_cutoff local time.
      The order is paid in full at placement on one of payment_methods_accepted; an order paid with a Ridgeline Consumer Credit account posts as a purchase there and one paid with Ridgeline Pro Credit posts as an invoice.
      The delivery charge is delivery_fee_usd, waived when free_delivery_threshold_usd is above 0.00 and the merchandise total is at or above it, reduced by the customer's ProBuild order_delivery_discount_pct where pro_delivery_discount_applies is true and the membership is active on the order date, and billed with haul-away (haul_away_fee_usd, offered only where haul_away_available is true) and basic install (basic_install_fee_usd) when booked.
      Truck and same-day deliveries are made only within delivery_distance_max_miles miles of the fulfilling store, in a booked window of delivery_window_hours hours.
      Items or quantities may be changed within order_edit_window_minutes minutes after order_placed_at; a pickup order is ready within pickup_ready_hours hours, and a shipped or scheduled order is promised ship_lead_days days after the order date.
      Where substitution_allowed is true an out-of-stock item may be replaced only with the customer's consent; an item on backorder more than backorder_auto_cancel_days days past the promised date cancels the order with a full refund.
    eligibility: []
    params:
      per_tier:
        Ridgeline Ship to Home: {delivery_fee_usd: "=delivery_fee_usd", free_delivery_threshold_usd: "=free_delivery_threshold_usd", order_min_usd: "=order_min_usd"}
        Ridgeline Buy Online Pick Up In Store: {delivery_fee_usd: "=delivery_fee_usd", free_delivery_threshold_usd: "=free_delivery_threshold_usd", order_min_usd: "=order_min_usd"}
        Ridgeline Ship to Store: {delivery_fee_usd: "=delivery_fee_usd", free_delivery_threshold_usd: "=free_delivery_threshold_usd", order_min_usd: "=order_min_usd"}
        Ridgeline Same-Day Delivery: {delivery_fee_usd: "=delivery_fee_usd", free_delivery_threshold_usd: "=free_delivery_threshold_usd", order_min_usd: "=order_min_usd"}
        Ridgeline Scheduled Truck Delivery: {delivery_fee_usd: "=delivery_fee_usd", free_delivery_threshold_usd: "=free_delivery_threshold_usd", order_min_usd: "=order_min_usd"}
        Ridgeline Appliance Delivery and Haul-Away: {delivery_fee_usd: "=delivery_fee_usd", free_delivery_threshold_usd: "=free_delivery_threshold_usd", order_min_usd: "=order_min_usd"}
    formula:
      delivery_charge: 0 if (free_delivery_threshold_usd > 0 and merchandise_total >= free_delivery_threshold_usd) else delivery_fee_usd

  - id: order_cancellation
    subject: [order_cancelled, order_credit_applied]
    rule: >-
      The customer may cancel an order by their own confirmation while its status is placed, or ready but not yet dispatched or picked up, where cancel_before_ready_allowed is true; once out for delivery it can only be refused at the door or returned.
      On cancellation the order total is reversed (credit_type order_cancellation), and the delivery charge is refunded as credit_type delivery_fee_refund only where delivery_fee_refundable_on_cancel is true; every payment is refunded to its tender.
      The system cancels a pickup order not collected by pickup_deadline_date, an order whose failed attempts reach delivery_attempts_before_cancel (redelivery fees are not refunded), and a backordered order under order_placement_and_payment.
    eligibility: []
    params:
      per_tier:
        Ridgeline Ship to Home: {delivery_fee_refundable_on_cancel: "=delivery_fee_refundable_on_cancel", delivery_attempts_before_cancel: "=delivery_attempts_before_cancel"}
        Ridgeline Buy Online Pick Up In Store: {delivery_fee_refundable_on_cancel: "=delivery_fee_refundable_on_cancel", delivery_attempts_before_cancel: "=delivery_attempts_before_cancel"}
        Ridgeline Ship to Store: {delivery_fee_refundable_on_cancel: "=delivery_fee_refundable_on_cancel", delivery_attempts_before_cancel: "=delivery_attempts_before_cancel"}
        Ridgeline Same-Day Delivery: {delivery_fee_refundable_on_cancel: "=delivery_fee_refundable_on_cancel", delivery_attempts_before_cancel: "=delivery_attempts_before_cancel"}
        Ridgeline Scheduled Truck Delivery: {delivery_fee_refundable_on_cancel: "=delivery_fee_refundable_on_cancel", delivery_attempts_before_cancel: "=delivery_attempts_before_cancel"}
        Ridgeline Appliance Delivery and Haul-Away: {delivery_fee_refundable_on_cancel: "=delivery_fee_refundable_on_cancel", delivery_attempts_before_cancel: "=delivery_attempts_before_cancel"}

  - id: order_pickup
    subject: [order_fulfilled, order_delivery_rescheduled]
    rule: >-
      A pickup order is held until pickup_deadline_date, which is the ready_date plus pickup_hold_days days, and may be extended once by pickup_extension_days days on request before it lapses.
      It may be collected at the service desk, at the curb where curbside_available is true, or from a locker where pickup_locker_available is true, by the customer or, where pickup_by_third_party_allowed is true, by the alternate person named on the order, with photo ID where pickup_id_required is true.
    eligibility: []
    params:
      per_tier:
        Ridgeline Ship to Home: {pickup_hold_days: "=pickup_hold_days", pickup_extension_days: "=pickup_extension_days"}
        Ridgeline Buy Online Pick Up In Store: {pickup_hold_days: "=pickup_hold_days", pickup_extension_days: "=pickup_extension_days"}
        Ridgeline Ship to Store: {pickup_hold_days: "=pickup_hold_days", pickup_extension_days: "=pickup_extension_days"}
        Ridgeline Same-Day Delivery: {pickup_hold_days: "=pickup_hold_days", pickup_extension_days: "=pickup_extension_days"}
        Ridgeline Scheduled Truck Delivery: {pickup_hold_days: "=pickup_hold_days", pickup_extension_days: "=pickup_extension_days"}
        Ridgeline Appliance Delivery and Haul-Away: {pickup_hold_days: "=pickup_hold_days", pickup_extension_days: "=pickup_extension_days"}

  - id: order_delivery_service
    subject: [order_delivery_attempt_recorded, order_delivery_failed, order_delivery_rescheduled, order_fee_charged, order_credit_applied]
    rule: >-
      A delivery arriving more than missed_window_threshold_minutes minutes after delivery_window_end, or a truck that misses the booked window, earns missed_window_credit_usd once per order.
      A delivery that cannot be completed because no adult was present or the site was inaccessible incurs redelivery_fee_usd, and the order is held at the store for store_hold_after_failed_delivery_days days for redelivery or pickup.
      A delivery window can be moved only while the order status is placed or ready.
      A delivery may be moved free when the request is made at least delivery_reschedule_notice_hours hours before delivery_window_start and reschedule_count is below delivery_reschedule_limit; any other move incurs redelivery_fee_usd.
      A shipped order arriving more than late_shipment_threshold_days days after the promised date has its shipping charge refunded as credit_type late_shipment_refund.
      The missed-window credit and a delivery charge refund are not combined on one order when missed_window_credit_stackable is false: the customer receives the larger of the two.
    eligibility:
      - id: movable_status
        applies_to: [order_delivery_rescheduled]
        kind: state
        condition: A delivery window can be moved only while the order status is placed or ready.
        evidence_fields: [orders.order_id, orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        state_contract:
          field: orders.status
          allowed: [placed, ready]
    params:
      per_tier:
        Ridgeline Ship to Home: {missed_window_credit_usd: "=missed_window_credit_usd", redelivery_fee_usd: "=redelivery_fee_usd", delivery_reschedule_notice_hours: "=delivery_reschedule_notice_hours"}
        Ridgeline Buy Online Pick Up In Store: {missed_window_credit_usd: "=missed_window_credit_usd", redelivery_fee_usd: "=redelivery_fee_usd", delivery_reschedule_notice_hours: "=delivery_reschedule_notice_hours"}
        Ridgeline Ship to Store: {missed_window_credit_usd: "=missed_window_credit_usd", redelivery_fee_usd: "=redelivery_fee_usd", delivery_reschedule_notice_hours: "=delivery_reschedule_notice_hours"}
        Ridgeline Same-Day Delivery: {missed_window_credit_usd: "=missed_window_credit_usd", redelivery_fee_usd: "=redelivery_fee_usd", delivery_reschedule_notice_hours: "=delivery_reschedule_notice_hours"}
        Ridgeline Scheduled Truck Delivery: {missed_window_credit_usd: "=missed_window_credit_usd", redelivery_fee_usd: "=redelivery_fee_usd", delivery_reschedule_notice_hours: "=delivery_reschedule_notice_hours"}
        Ridgeline Appliance Delivery and Haul-Away: {missed_window_credit_usd: "=missed_window_credit_usd", redelivery_fee_usd: "=redelivery_fee_usd", delivery_reschedule_notice_hours: "=delivery_reschedule_notice_hours"}

  - id: order_returns
    subject: [order_return_credited, order_fee_charged, order_credit_applied, order_fully_returned]
    rule: >-
      Items may be returned within the days set for their item_category in return_window_days_by_category, counted from fulfilled_date as day 0; a category set to 0 is not returnable, and a return on the last day qualifies.
      The return must be made no later than the item category's return window after the order was fulfilled.
      Returns are accepted at any store, by mail where return_by_mail_allowed is true (return_by_mail_fee_usd deducted), or by home pickup for truck and appliance deliveries (return_pickup_fee_usd); both fees are waived when defective_return_fee_waived is true and the reason is defective, damaged_in_delivery or wrong_item.
      Damage to a delivered appliance is covered only when reported within appliance_damage_report_hours hours after delivery, or refused at the door where inspect_on_delivery is true.
      The delivery charge is refunded with a return only for the reasons in delivery_fee_refund_on_return_reasons.
      The refund goes to the tender of the order payment; when every item has been returned the order status becomes returned.
    eligibility:
      - id: within_return_window
        applies_to: [order_return_credited]
        kind: time
        condition: The return must be made no later than the item category's return window after the order was fulfilled.
        evidence_fields: [orders.order_id, orders.fulfilled_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the order was fulfilled
          anchor_source: orders.fulfilled_date
          relation: not_after
          duration_source: variants.return_window_days_by_category
          unit: calendar_days
          counting_rule: Items may be returned within the days set for their item_category in return_window_days_by_category, counted from fulfilled_date as day 0; a category set to 0 is not returnable, and a return on the last day qualifies.
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Ship to Home: {return_window_days_by_category: "=return_window_days_by_category", return_by_mail_fee_usd: "=return_by_mail_fee_usd", return_pickup_fee_usd: "=return_pickup_fee_usd"}
        Ridgeline Buy Online Pick Up In Store: {return_window_days_by_category: "=return_window_days_by_category", return_by_mail_fee_usd: "=return_by_mail_fee_usd", return_pickup_fee_usd: "=return_pickup_fee_usd"}
        Ridgeline Ship to Store: {return_window_days_by_category: "=return_window_days_by_category", return_by_mail_fee_usd: "=return_by_mail_fee_usd", return_pickup_fee_usd: "=return_pickup_fee_usd"}
        Ridgeline Same-Day Delivery: {return_window_days_by_category: "=return_window_days_by_category", return_by_mail_fee_usd: "=return_by_mail_fee_usd", return_pickup_fee_usd: "=return_pickup_fee_usd"}
        Ridgeline Scheduled Truck Delivery: {return_window_days_by_category: "=return_window_days_by_category", return_by_mail_fee_usd: "=return_by_mail_fee_usd", return_pickup_fee_usd: "=return_pickup_fee_usd"}
        Ridgeline Appliance Delivery and Haul-Away: {return_window_days_by_category: "=return_window_days_by_category", return_by_mail_fee_usd: "=return_by_mail_fee_usd", return_pickup_fee_usd: "=return_pickup_fee_usd"}

  - id: order_price_adjustment
    subject: [order_credit_applied]
    rule: >-
      When Ridgeline lowers its own price on an ordered item within price_adjustment_window_days days after the order date, the difference is credited once per item as credit_type price_adjustment on the customer's request, provided the item has not been returned; clearance, open-box and special buy prices are excluded where price_adjustment_excludes_clearance is true.
      A competitor's lower price on the identical in-stock item is matched only before purchase, where price_match_competitor_allowed is true, and never by a credit after the order.
    eligibility: []
    params:
      per_tier:
        Ridgeline Ship to Home: {price_adjustment_window_days: "=price_adjustment_window_days"}
        Ridgeline Buy Online Pick Up In Store: {price_adjustment_window_days: "=price_adjustment_window_days"}
        Ridgeline Ship to Store: {price_adjustment_window_days: "=price_adjustment_window_days"}
        Ridgeline Same-Day Delivery: {price_adjustment_window_days: "=price_adjustment_window_days"}
        Ridgeline Scheduled Truck Delivery: {price_adjustment_window_days: "=price_adjustment_window_days"}
        Ridgeline Appliance Delivery and Haul-Away: {price_adjustment_window_days: "=price_adjustment_window_days"}

  - id: order_refunds_and_claims
    subject: [order_refund_issued, order_credit_applied]
    rule: >-
      Every refund goes back to the tender of the order payment and references it; the refunds on an order never exceed what was paid, so a refund may not exceed order_msr_net_paid at the time it is issued.
      A shipped order reported not received is investigated when the report is made within lost_package_claim_days days after the promised date; where delivery_photo_proof is true and the photo shows delivery to the address, the claim is declined, and otherwise the order is reshipped or refunded.
      Shipped orders above signature_required_over_usd and truck deliveries where delivery_signature_required is true are delivered only against an adult signature.
    eligibility: []
    measures: [order_msr_net_paid]
    params:
      per_tier:
        Ridgeline Ship to Home: {lost_package_claim_days: "=lost_package_claim_days", signature_required_over_usd: "=signature_required_over_usd"}
        Ridgeline Buy Online Pick Up In Store: {lost_package_claim_days: "=lost_package_claim_days", signature_required_over_usd: "=signature_required_over_usd"}
        Ridgeline Ship to Store: {lost_package_claim_days: "=lost_package_claim_days", signature_required_over_usd: "=signature_required_over_usd"}
        Ridgeline Same-Day Delivery: {lost_package_claim_days: "=lost_package_claim_days", signature_required_over_usd: "=signature_required_over_usd"}
        Ridgeline Scheduled Truck Delivery: {lost_package_claim_days: "=lost_package_claim_days", signature_required_over_usd: "=signature_required_over_usd"}
        Ridgeline Appliance Delivery and Haul-Away: {lost_package_claim_days: "=lost_package_claim_days", signature_required_over_usd: "=signature_required_over_usd"}
