# Ridgeline Orders & Delivery — online, app and phone orders of stocked merchandise and how they are
# fulfilled: shipped, picked up in store, or delivered by Ridgeline trucks and appliance crews.
category: order
display_name: Ridgeline Orders & Delivery

binding:
  holding_table: orders
  event_tables: [order_events]
  intake_tables: [order_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: order_balance}

lifecycle:
  states: [placed, ready, out_for_delivery, fulfilled, cancelled, returned]
  transitions:
    - {from: placed, to: ready, by: system, means: The order is picked and staged for pickup, or shipped by the carrier, or loaded for its delivery date.}
    - {from: ready, to: out_for_delivery, by: system, means: The order leaves on the delivery truck or with the carrier's final-mile driver.}
    - {from: out_for_delivery, to: fulfilled, by: system, means: The order is delivered.}
    - {from: ready, to: fulfilled, by: system, means: The order is picked up in store or at the curb.}
    - {from: out_for_delivery, to: ready, by: system, means: A delivery attempt fails and the order goes back to the store for redelivery.}
    - {from: placed, to: cancelled, by: user, means: The customer cancels the order before it is ready.}
    - {from: ready, to: cancelled, by: user, means: The customer cancels an order awaiting pickup or not yet dispatched.}
    - {from: ready, to: cancelled, by: system, means: An order is cancelled because it was not picked up in time, the delivery attempts ran out, or the item stayed on backorder too long.}
    - {from: placed, to: cancelled, by: system, means: An order is cancelled because the item stayed on backorder too long.}
    - {from: fulfilled, to: returned, by: system, means: Every item of the order has been returned.}

accounts:
  - key: order_balance
    unit: USD
    meaning: Amount the customer owes on the order — merchandise, fees and refunds paid out in; payments and credits out (negative means money is owed back to the customer).

parameter_schema:
  delivery_fee_usd: Delivery or shipping charge per order for the fulfillment program, USD.
  free_delivery_threshold_usd: Merchandise total at or above which the delivery charge is waived; 0 means no threshold, USD.
  order_min_usd: Smallest merchandise total accepted for the program; 0 means none, USD.
  haul_away_available: Whether removal of the customer's old item is offered with delivery, boolean.
  haul_away_fee_usd: Charge for haul-away of the old item, USD.
  basic_install_fee_usd: Charge for basic hookup of a delivered appliance; 0 means not offered or included, USD.
  ship_lead_days: Days from order to promised delivery or ready date for shipped and scheduled orders, calendar days.
  pickup_ready_hours: Hours after the order is placed by which an in-stock pickup order is ready, hours.
  pickup_hold_days: Days after the ready date that a pickup order is held before it is cancelled, calendar days.
  pickup_extension_days: Days a pickup hold may be extended once on request before it lapses, calendar days.
  curbside_available: Whether curbside pickup is offered, boolean.
  pickup_locker_available: Whether pickup from a store pickup locker is offered, boolean.
  pickup_by_third_party_allowed: Whether a person named by the customer may collect the order, boolean.
  pickup_id_required: Whether photo ID matching the order or the named alternate is required at pickup, boolean.
  same_day_order_cutoff: Local time by which an order must be placed for same-day delivery (HH:MM), or not_applicable.
  delivery_window_hours: Length of the delivery window booked, hours; 0 when no window is booked.
  missed_window_threshold_minutes: Minutes after the end of the booked window after which a delivery counts as late, minutes.
  missed_window_credit_usd: Credit when a delivery arrives late or the truck misses the window, USD.
  missed_window_credit_stackable: Whether the missed-window credit may be combined with a delivery fee refund on the same order, boolean.
  late_shipment_threshold_days: Days a shipped order may arrive after its promised date before its shipping charge is refunded; 0 means no such refund, calendar days.
  redelivery_fee_usd: Charge for a second delivery after the customer was absent or the site was inaccessible, USD.
  delivery_reschedule_notice_hours: Hours before the delivery window by which a delivery may be moved free, hours.
  delivery_reschedule_limit: Number of free reschedules allowed per order, count.
  delivery_attempts_before_cancel: Failed delivery attempts after which the order is cancelled and refunded less redelivery fees; 0 means not applicable, count.
  store_hold_after_failed_delivery_days: Days a failed-delivery order is held at the store for redelivery or pickup, calendar days.
  delivery_distance_max_miles: Largest delivery distance from the fulfilling store; 0 means not applicable, miles.
  delivery_signature_required: Whether delivery requires the signature of an adult at the address, boolean.
  signature_required_over_usd: Merchandise total above which a shipped order requires a signature; 0 means never, USD.
  delivery_photo_proof: Whether the driver records a photo at delivery as proof, boolean.
  inspect_on_delivery: Whether the customer inspects the item with the crew and may refuse a damaged item at the door, boolean.
  appliance_damage_report_hours: Hours after delivery within which damage to a delivered appliance must be reported, hours.
  lost_package_claim_days: Days after the promised date within which a shipped order reported not received is investigated and replaced or refunded, calendar days.
  cancel_before_ready_allowed: Whether the customer may cancel before the order is ready, boolean.
  delivery_fee_refundable_on_cancel: Whether the delivery charge is refunded when the order is cancelled before dispatch, boolean.
  pro_delivery_discount_applies: Whether the ProBuild Rewards delivery fee discount applies to this program, boolean.
  payment_methods_accepted: Tenders accepted (list drawn from bank_card, ridgeline_consumer_credit, ridgeline_pro_credit, gift_card).
  order_edit_window_minutes: Minutes after the order is placed during which items or quantities can be changed, minutes.
  substitution_allowed: Whether an out-of-stock item may be substituted with the customer's consent, boolean.
  backorder_auto_cancel_days: Days an item may stay on backorder past its promised date before the order is cancelled and refunded; 0 means not applicable, calendar days.
  return_window_days_by_category: Return window by item category in calendar days counted from fulfillment (mapping item_category -> days; 0 means not returnable).
  return_by_mail_allowed: Whether items may be returned by mail with a prepaid label, boolean.
  return_by_mail_fee_usd: Label charge deducted from a mail return unless the item is defective, damaged or wrong, USD.
  return_pickup_fee_usd: Charge for picking a returned item up from the home unless it is defective, damaged or wrong, USD.
  defective_return_fee_waived: Whether return fees are waived when the item is defective, damaged in delivery or wrong, boolean.
  delivery_fee_refund_on_return_reasons: Return reasons for which the delivery charge is refunded with the return (list).
  price_adjustment_window_days: Days after the order date during which a lower Ridgeline price on the same item is credited, calendar days.
  price_adjustment_excludes_clearance: Whether clearance, open-box and limited-time special buy prices are excluded from price adjustments, boolean.
  price_match_competitor_allowed: Whether a lower in-stock price of a local competitor on the identical item is matched before purchase, boolean.

