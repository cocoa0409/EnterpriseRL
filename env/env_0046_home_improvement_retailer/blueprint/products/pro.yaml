# Ridgeline ProBuild Rewards — the free loyalty and pro pricing program for business customers:
# tiered by annual qualifying spend, earning perks points, volume pricing quotes and tier benefits.
category: pro
display_name: Ridgeline ProBuild Rewards

binding:
  holding_table: pro_memberships
  event_tables: [pro_activity]
  intake_tables: [pro_quotes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {qualifying_spend_ytd: qualifying_spend, perks_balance: perks_points}

lifecycle:
  states: [pending_verification, active, suspended, closed]
  transitions:
    - {from: pending_verification, to: active, by: system, means: The business is verified and the membership becomes active.}
    - {from: pending_verification, to: closed, by: system, means: Business verification is not completed within the verification window.}
    - {from: active, to: suspended, by: system, means: The membership is suspended for program misuse or because the member's Pro Credit account was charged off.}
    - {from: suspended, to: active, by: system, means: The membership is reinstated after review.}
    - {from: active, to: closed, by: user, means: An owner or principal of the business confirms closing the membership.}
    - {from: active, to: closed, by: system, means: The membership is closed after the inactivity period with no qualifying purchase.}
    - {from: suspended, to: closed, by: system, means: A suspended membership is closed after review.}

accounts:
  - key: qualifying_spend
    unit: USD
    meaning: Qualifying spend accumulated in the current program year — purchases in; returns and the year-end reset out.
  - key: perks_points
    unit: points
    meaning: Perks points available — points earned in; points redeemed, expired or reversed on returns out.

parameter_schema:
  points_multiplier: Perks points earned per pre-tax qualifying dollar at this tier, points per USD.
  pro_credit_points_bonus_multiplier: Extra multiplier applied to points on purchases paid with a Ridgeline Pro Credit account, multiplier.
  perk_redemption_block_points: Points redeemed for one perk reward, points.
  perk_value_per_block_usd: Value of one perk reward, USD.
  perk_expiry_days: Days after issue that a perk reward stays usable, calendar days.
  annual_perk_cap_usd: Largest total value of perk rewards issued to a member in one program year, USD.
  perk_stackable_with_volume_quote: Whether a perk reward may be used on a purchase priced under a volume pricing quote, boolean.
  points_expiry_months: Months after the earn date at which unredeemed points expire, calendar months.
  points_pending_days: Days after the purchase before earned points become available to redeem, calendar days.
  max_points_per_year: Largest number of points earned in one program year, points.
  points_balance_may_go_negative: Whether reversing points for a return may take the balance below zero, boolean.
  points_on_rental: Whether tool rental charges earn points, boolean.
  points_on_installation: Whether installation contract payments earn points, boolean.
  points_on_special_orders: Whether special order purchases earn points, boolean.
  points_on_quote_orders: Whether purchases priced under a volume pricing quote earn points, boolean.
  qualifying_excludes_gift_cards: Whether gift card purchases are excluded from qualifying spend and points, boolean.
  enrollment_bonus_points: Points credited once when a new membership is verified, points.
  tier_bonus_points_on_upgrade: Points credited once when the member first reaches this tier in a program year, points.
  referral_bonus_points: Points credited to the referring member when a referred business is verified, points.
  missed_purchase_claim_days: Days after a purchase made without the member number within which it can be added from the receipt, calendar days.
  missed_purchase_claim_max_per_year: Largest number of missed purchases that can be added in one program year, count.
  volume_pricing_min_order_usd: Smallest pre-tax order for which a volume pricing quote may be requested, USD.
  volume_discount_ladder: Volume pricing discount ceiling by order size, a ladder of {min_order_usd, max_discount_pct} steps; the highest step whose min_order_usd the quote total reaches applies (structured).
  volume_quote_excluded_departments: Departments whose items are never volume priced (list).
  job_lot_quote_max_lines: Largest number of lines on one volume pricing quote, count.
  max_open_quotes: Largest number of quotes in requested or priced status at once, count.
  quote_validity_days: Days after pricing that a volume pricing quote may be accepted, calendar days.
  quote_response_hours: Hours within which a requested quote is priced, hours.
  quote_price_hold_days: Days after acceptance within which the quoted items must be purchased at the quoted prices, calendar days.
  quote_revision_limit: Number of times a quote may be revised before it must be requested again, count.
  paint_discount_pct: Discount on paint and paint sundries at the register, percent.
  paint_discount_cap_usd: Largest total paint discount per program year, USD.
  paint_discount_combinable_with_quote: Whether the paint discount applies to paint priced under a volume pricing quote, boolean.
  rental_discount_pct: Discount on Ridgeline Tool Rental rental time for members at this tier, percent.
  special_order_restocking_waived: Whether the restocking fee on returnable special orders is waived for members at this tier, boolean.
  order_delivery_discount_pct: Discount on Ridgeline Orders & Delivery delivery fees for members at this tier, percent.
  dedicated_account_rep: Whether the member is assigned a dedicated pro account representative, boolean.
  max_authorized_purchasers: Largest number of authorized purchasers who may buy under the membership, count.
  purchaser_changes_per_month: Largest number of authorized-purchaser additions or removals per calendar month, count.
  qualification_period_months: Length of the program year over which qualifying spend is counted (the calendar year), months.
  tier_hold_months: Months after the end of a program year during which a tier earned in that year is kept, months.
  downgrade_max_tiers: Largest number of tiers a member drops at one annual evaluation, count.
  mid_year_upgrade: Whether a member moves up as soon as year-to-date qualifying spend reaches a higher tier's threshold, boolean.
  verification_window_days: Days after enrollment within which business verification must be completed, calendar days.
  inactivity_close_months: Months without a qualifying purchase after which the membership is closed, months.
  closure_forfeits_points: Whether unredeemed points are forfeited when the membership closes, boolean.
  suspension_on_trade_chargeoff: Whether the membership is suspended when the member's Ridgeline Pro Credit account is charged off, boolean.
  suspension_review_months: Months after suspension before a suspended membership is reviewed for reinstatement, months.

