events:
  - type: pro_enrolled
    target: pro_memberships
    mutation: create
    meaning: A business enrolls in ProBuild Rewards; the membership awaits business verification.
    grain: one row per membership
    fields:
      customer_id: The pro customer profile of the business.
      variant_name: Starting tier (ProBuild Member).
      status: Set to pending_verification on creation.
      member_number: ProBuild member number issued at enrollment.
      enrolled_date: Date of enrollment.
      program_year: Program year of enrollment (YYYY).
    triggers: []
  - type: pro_verified
    target: pro_memberships
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: The business is verified and the membership becomes active.
    grain: one row per transaction
    fields:
      status: Set to active.
      tier_effective_date: Date the starting tier took effect.
    triggers:
      - event: pro:pro_points_earned
        map: {earn_basis: enrollment_bonus}
  - type: pro_verification_failed
    target: pro_memberships
    mutation: {transition: {from: pending_verification, to: closed}}
    meaning: Verification was not completed in time and the enrollment is closed.
    grain: one row per transaction
    fields:
      status: Set to closed.
      closed_date: Date closed.
    triggers: []
  - type: pro_suspended
    target: pro_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: The membership is suspended.
    grain: one row per transaction
    fields:
      status: Set to suspended.
      suspension_reason: Why the membership was suspended.
      suspended_date: Date of suspension.
    triggers: []
  - type: pro_reinstated
    target: pro_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended membership is reinstated after review.
    grain: one row per transaction
    fields:
      status: Set to active.
      suspension_reason: Reset to none.
    triggers: []
  - type: pro_closed
    target: pro_memberships
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The membership is closed by the member or by the program.
    grain: one row per transaction
    fields:
      status: Set to closed.
      closed_date: Date closed.
    triggers:
      - event: pro:pro_points_expired
        map: {expiry_basis: membership_closed}
  - type: pro_tier_changed
    target: pro_memberships
    mutation: update
    meaning: The member moves to another tier at a mid-year upgrade or the annual evaluation.
    grain: one row per transaction
    fields:
      variant_name: The new tier, as its official full name.
      tier_effective_date: Date the new tier took effect.
    triggers: []
  - type: pro_purchasers_updated
    target: pro_memberships
    mutation: update
    meaning: Authorized purchasers are added or removed.
    grain: one row per transaction
    fields:
      authorized_purchaser_count: Number of authorized purchasers after the change.
    triggers: []
  - type: pro_spend_posted
    target: pro_activity
    meaning: A qualifying purchase is credited to the membership's year-to-date spend.
    grain: one row per purchase receipt or order
    distinguish_by: [purchase_reference]
    fields:
      activity_date: Date the spend was credited.
      purchase_date: Date of the purchase on the receipt.
      purchase_reference: Receipt, order, invoice, contract or agreement number of the purchase.
      purchase_channel: Where the purchase was made.
      amount: Pre-tax qualifying amount, positive.
      pricing_basis: How the purchase was priced.
      pro_quote_id: The volume pricing quote applied, when any.
      tender_type: How the purchase was paid.
      posting_basis: Whether the member number was presented or the purchase was added later from the receipt.
      program_year: Program year credited (YYYY).
    account: qualifying_spend
    direction: in
    triggers: []
  - type: pro_spend_reversed
    target: pro_activity
    meaning: Qualifying spend is reduced for a return or refund.
    grain: one row per return against one purchase
    distinguish_by: [original_activity_id, activity_date]
    fields:
      activity_date: Date of the return.
      amount: Pre-tax amount returned, positive.
      original_activity_id: The pro_spend_posted row of the purchase.
      purchase_reference: Return receipt or credit reference.
      program_year: Program year reduced (YYYY).
    account: qualifying_spend
    direction: out
    triggers:
      - event: pro:pro_points_reversed
        map: {activity_date: activity_date, original_activity_id: original_activity_id}
  - type: pro_year_reset
    target: pro_activity
    meaning: Year-to-date qualifying spend is reset to zero at the end of the program year.
    grain: one row per membership per program year
    distinguish_by: [program_year]
    fields:
      activity_date: Date of the reset (January 1).
      amount: Qualifying spend of the year closed, positive.
      program_year: Program year closed (YYYY).
    account: qualifying_spend
    direction: out
    triggers: []
  - type: pro_points_earned
    target: pro_activity
    meaning: Perks points are credited for a purchase or a bonus.
    grain: one row per earning basis per source purchase or bonus
    distinguish_by: [earn_basis, original_activity_id, program_year]
    fields:
      activity_date: Date the points were credited.
      points: Points credited, positive whole number.
      earn_basis: Why the points were earned.
      original_activity_id: The pro_spend_posted row the points came from; empty for a bonus.
      available_date: Date the points become redeemable.
      program_year: Program year (YYYY).
    account: perks_points
    direction: in
    triggers: []
  - type: pro_points_redeemed
    target: pro_activity
    meaning: Points are redeemed for perk rewards.
    grain: one row per redemption
    distinguish_by: [activity_date, perk_reward_code]
    fields:
      activity_date: Date of the redemption.
      points: Points redeemed, positive.
      amount: Value of perk rewards issued, positive.
      perk_reward_code: Perk reward code issued.
      perk_expiry_date: Last day the perk reward may be used.
      program_year: Program year (YYYY).
    account: perks_points
    direction: out
    triggers: []
  - type: pro_points_expired
    target: pro_activity
    meaning: Unredeemed points expire, or are forfeited when the membership closes.
    grain: one row per expiry basis per date
    distinguish_by: [expiry_basis, activity_date]
    fields:
      activity_date: Date of the expiry.
      points: Points expired, positive.
      expiry_basis: Why the points expired.
      program_year: Program year (YYYY).
    account: perks_points
    direction: out
    triggers: []
  - type: pro_points_reversed
    target: pro_activity
    meaning: Points earned on a purchase are taken back when it is returned.
    grain: one row per return against one purchase
    distinguish_by: [original_activity_id, activity_date]
    fields:
      activity_date: Date of the reversal.
      points: Points reversed, positive.
      original_activity_id: The pro_spend_posted row of the purchase.
      program_year: Program year (YYYY).
    account: perks_points
    direction: out
    triggers: []

measures:
  - id: pro_msr_perks_issued_ytd
    window: Current program year (calendar year of the frozen date).
    measure: Sum of pro_points_redeemed amounts on the membership in the window.
  - id: pro_msr_points_earned_ytd
    window: Current program year.
    measure: Sum of pro_points_earned points on the membership in the window.
  - id: pro_msr_available_points
    window: As of the frozen date.
    measure: perks_balance less points whose available_date is after the frozen date.
  - id: pro_msr_missed_claims_ytd
    window: Current program year.
    measure: Count of pro_spend_posted rows with posting_basis receipt_lookup in the window.
  - id: pro_msr_open_quotes
    window: As of the frozen date.
    measure: Count of the member's pro_quotes in status requested or priced.
  - id: pro_msr_paint_discount_ytd
    window: Current program year.
    measure: Total paint discount taken at the register on purchases credited in the window, as recorded on the receipts.

policies:
  - id: pro_agg_multi_holding
    subject: [pro_enrolled]
    rule: >-
      A business holds at most one ProBuild Rewards membership; a pro customer profile with a membership in status pending_verification, active or suspended cannot enroll again.
      Only a pro customer profile may enroll; a consumer profile is not eligible.
      A closed membership may be replaced by a new enrollment, which starts at ProBuild Member with no points carried over.
    eligibility:
      - id: one_membership
        applies_to: [pro_enrolled]
        kind: dedup
        condition: A business holds at most one ProBuild Rewards membership; a pro customer profile with a membership in status pending_verification, active or suspended cannot enroll again.
        evidence_fields: [pro_memberships.customer_id, pro_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pro_memberships.customer_id]
          action_bindings:
            pro_memberships.customer_id: customer_id
        dedup_contract:
          table: pro_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_verification, active, suspended]}
          distinct_fields: []
      - id: pro_profile
        applies_to: [pro_enrolled]
        kind: state
        condition: Only a pro customer profile may enroll; a consumer profile is not eligible.
        evidence_fields: [customers.customer_id, customers.customer_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        state_contract:
          field: customers.customer_type
          allowed: [pro]
    params:
      max_per_customer: 1

  - id: pro_enrollment_verification
    subject: [pro_enrolled, pro_verified, pro_verification_failed, pro_points_earned]
    rule: >-
      Every enrollment starts at ProBuild Member in status pending_verification and becomes active only when the business is verified (business license, EIN or trade license) within verification_window_days days of enrolled_date; otherwise it is closed.
      On verification enrollment_bonus_points of the starting tier are credited once with earn_basis enrollment_bonus, and the referring member, if any, receives the referral_bonus_points of the referrer's own tier with earn_basis referral_bonus.
      Purchases made while the membership is pending are credited once it becomes active when they are within missed_purchase_claim_days of the purchase.
    eligibility: []
    params:
      per_tier:
        ProBuild Member: {enrollment_bonus_points: "=enrollment_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        ProBuild Bronze: {enrollment_bonus_points: "=enrollment_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        ProBuild Silver: {enrollment_bonus_points: "=enrollment_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        ProBuild Gold: {enrollment_bonus_points: "=enrollment_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        ProBuild Platinum: {enrollment_bonus_points: "=enrollment_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        ProBuild Platinum Elite: {enrollment_bonus_points: "=enrollment_bonus_points", referral_bonus_points: "=referral_bonus_points"}

  - id: pro_tier_evaluation
    subject: [pro_tier_changed, pro_year_reset, pro_points_earned]
    rule: >-
      A member's tier is decided by qualifying spend in the program year (the calendar year, qualification_period_months months) against each tier's entry_gate min_annual_qualifying_spend_usd.
      When mid_year_upgrade is true the member moves up on the day qualifying_spend_ytd first reaches a higher tier's threshold, to the highest tier reached, and receives that tier's tier_bonus_points_on_upgrade once per program year with earn_basis tier_bonus.
      At the annual evaluation on January 1 the tier for the new year is the highest tier whose threshold the closed year's spend reached, but a member never drops more than downgrade_max_tiers tier below the tier held on December 31, and a tier earned during a year is kept for tier_hold_months months after that year ends.
      The year's qualifying spend is then reset to zero by one pro_year_reset row.
      A tier never moves down during a program year, and returns that lower year-to-date spend below a threshold do not undo an upgrade already made.
    eligibility: []
    params:
      per_tier:
        ProBuild Member: {tier_bonus_points_on_upgrade: "=tier_bonus_points_on_upgrade", downgrade_max_tiers: "=downgrade_max_tiers"}
        ProBuild Bronze: {tier_bonus_points_on_upgrade: "=tier_bonus_points_on_upgrade", downgrade_max_tiers: "=downgrade_max_tiers"}
        ProBuild Silver: {tier_bonus_points_on_upgrade: "=tier_bonus_points_on_upgrade", downgrade_max_tiers: "=downgrade_max_tiers"}
        ProBuild Gold: {tier_bonus_points_on_upgrade: "=tier_bonus_points_on_upgrade", downgrade_max_tiers: "=downgrade_max_tiers"}
        ProBuild Platinum: {tier_bonus_points_on_upgrade: "=tier_bonus_points_on_upgrade", downgrade_max_tiers: "=downgrade_max_tiers"}
        ProBuild Platinum Elite: {tier_bonus_points_on_upgrade: "=tier_bonus_points_on_upgrade", downgrade_max_tiers: "=downgrade_max_tiers"}

  - id: pro_spend_tracking
    subject: [pro_spend_posted, pro_spend_reversed]
    rule: >-
      Qualifying spend is the pre-tax amount of purchases made under the member number by the business or its authorized purchasers, in store, at the pro desk, online, on special orders, and on tool rental and installation charges; gift cards never qualify when qualifying_excludes_gift_cards is true.
      Spend is credited only while the membership status is active.
      A purchase made without presenting the member number is added from the receipt only when the claim is made no later than missed_purchase_claim_days calendar days after the purchase date.
      Days are counted as calendar days from the receipt's purchase_date as day 0 to the date of the claim; a claim on the last day qualifies.
      Each receipt, order, invoice, contract or agreement is credited once, and pro_msr_missed_claims_ytd may not exceed missed_purchase_claim_max_per_year.
      A return reverses the qualifying spend of the returned part against the original purchase row, and its points under pro_points_reversal.
    eligibility:
      - id: active_membership
        applies_to: [pro_spend_posted]
        kind: state
        condition: Spend is credited only while the membership status is active.
        evidence_fields: [pro_memberships.pro_membership_id, pro_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pro_memberships.pro_membership_id]
          action_bindings:
            pro_memberships.pro_membership_id: pro_membership_id
        state_contract:
          field: pro_memberships.status
          allowed: [active]
      - id: claim_in_window
        applies_to: [pro_spend_posted]
        kind: time
        condition: A purchase made without presenting the member number is added from the receipt only when the claim is made no later than missed_purchase_claim_days calendar days after the purchase date.
        evidence_fields: [pro_activity.purchase_reference, pro_activity.purchase_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [pro_activity.purchase_reference]
          action_bindings:
            pro_activity.purchase_reference: purchase_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase date
          anchor_source: pro_activity.purchase_date
          relation: not_after
          duration_source: variants.missed_purchase_claim_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the receipt's purchase_date as day 0 to the date of the claim; a claim on the last day qualifies.
          boundary: inclusive
      - id: credited_once
        applies_to: [pro_spend_posted]
        kind: dedup
        condition: Each receipt, order, invoice, contract or agreement is credited once, and pro_msr_missed_claims_ytd may not exceed missed_purchase_claim_max_per_year.
        evidence_fields: [pro_activity.pro_membership_id, pro_activity.purchase_reference, pro_activity.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pro_activity.pro_membership_id, pro_activity.purchase_reference]
          action_bindings:
            pro_activity.pro_membership_id: pro_membership_id
            pro_activity.purchase_reference: purchase_reference
        dedup_contract:
          table: pro_activity
          mode: separate_record
          object_bindings: {pro_membership_id: pro_membership_id, purchase_reference: purchase_reference}
          duplicate_filters: {event_type: [pro_spend_posted]}
          distinct_fields: []
    params:
      per_tier:
        ProBuild Member: {missed_purchase_claim_days: "=missed_purchase_claim_days", missed_purchase_claim_max_per_year: "=missed_purchase_claim_max_per_year"}
        ProBuild Bronze: {missed_purchase_claim_days: "=missed_purchase_claim_days", missed_purchase_claim_max_per_year: "=missed_purchase_claim_max_per_year"}
        ProBuild Silver: {missed_purchase_claim_days: "=missed_purchase_claim_days", missed_purchase_claim_max_per_year: "=missed_purchase_claim_max_per_year"}
        ProBuild Gold: {missed_purchase_claim_days: "=missed_purchase_claim_days", missed_purchase_claim_max_per_year: "=missed_purchase_claim_max_per_year"}
        ProBuild Platinum: {missed_purchase_claim_days: "=missed_purchase_claim_days", missed_purchase_claim_max_per_year: "=missed_purchase_claim_max_per_year"}
        ProBuild Platinum Elite: {missed_purchase_claim_days: "=missed_purchase_claim_days", missed_purchase_claim_max_per_year: "=missed_purchase_claim_max_per_year"}
    measures: [pro_msr_missed_claims_ytd]

  - id: pro_points_earning
    subject: [pro_points_earned]
    rule: >-
      Points on a credited purchase are its pre-tax qualifying amount times points_multiplier, times pro_credit_points_bonus_multiplier when it was paid with a Ridgeline Pro Credit account, rounded down to a whole point, posted with earn_basis purchase and referencing the spend row.
      Tool rental charges earn points only where points_on_rental is true, installation payments only where points_on_installation is true, special orders only where points_on_special_orders is true, and purchases priced under a volume pricing quote only where points_on_quote_orders is true; the tier is the one held on the purchase date.
      Purchase points become redeemable points_pending_days days after the purchase date (available_date); bonus points are available at once.
      pro_msr_points_earned_ytd may not exceed max_points_per_year; points beyond the cap are not credited.
    eligibility: []
    params:
      per_tier:
        ProBuild Member: {points_multiplier: "=points_multiplier", pro_credit_points_bonus_multiplier: "=pro_credit_points_bonus_multiplier", points_on_rental: "=points_on_rental", points_on_quote_orders: "=points_on_quote_orders"}
        ProBuild Bronze: {points_multiplier: "=points_multiplier", pro_credit_points_bonus_multiplier: "=pro_credit_points_bonus_multiplier", points_on_rental: "=points_on_rental", points_on_quote_orders: "=points_on_quote_orders"}
        ProBuild Silver: {points_multiplier: "=points_multiplier", pro_credit_points_bonus_multiplier: "=pro_credit_points_bonus_multiplier", points_on_rental: "=points_on_rental", points_on_quote_orders: "=points_on_quote_orders"}
        ProBuild Gold: {points_multiplier: "=points_multiplier", pro_credit_points_bonus_multiplier: "=pro_credit_points_bonus_multiplier", points_on_rental: "=points_on_rental", points_on_quote_orders: "=points_on_quote_orders"}
        ProBuild Platinum: {points_multiplier: "=points_multiplier", pro_credit_points_bonus_multiplier: "=pro_credit_points_bonus_multiplier", points_on_rental: "=points_on_rental", points_on_quote_orders: "=points_on_quote_orders"}
        ProBuild Platinum Elite: {points_multiplier: "=points_multiplier", pro_credit_points_bonus_multiplier: "=pro_credit_points_bonus_multiplier", points_on_rental: "=points_on_rental", points_on_quote_orders: "=points_on_quote_orders"}
    formula:
      purchase_points: round(amount * points_multiplier * (pro_credit_points_bonus_multiplier if tender_type == "ridgeline_pro_credit" else 1) - 0.5, 0)
    measures: [pro_msr_points_earned_ytd]

  - id: pro_points_redemption
    subject: [pro_points_redeemed]
    rule: >-
      Points are redeemed only in whole blocks of perk_redemption_block_points, each issuing a perk reward worth perk_value_per_block_usd, usable for perk_expiry_days days after issue.
      Points may be redeemed only while the membership status is active.
      Only available points (pro_msr_available_points) can be redeemed, and the value of perk rewards issued in the program year (pro_msr_perks_issued_ytd plus this redemption) may not exceed annual_perk_cap_usd.
      A perk reward may not be used on a purchase priced under a volume pricing quote when perk_stackable_with_volume_quote is false, and an expired perk reward is not reissued.
    eligibility:
      - id: active_membership
        applies_to: [pro_points_redeemed]
        kind: state
        condition: Points may be redeemed only while the membership status is active.
        evidence_fields: [pro_memberships.pro_membership_id, pro_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pro_memberships.pro_membership_id]
          action_bindings:
            pro_memberships.pro_membership_id: pro_membership_id
        state_contract:
          field: pro_memberships.status
          allowed: [active]
    params:
      per_tier:
        ProBuild Member: {perk_redemption_block_points: "=perk_redemption_block_points", annual_perk_cap_usd: "=annual_perk_cap_usd"}
        ProBuild Bronze: {perk_redemption_block_points: "=perk_redemption_block_points", annual_perk_cap_usd: "=annual_perk_cap_usd"}
        ProBuild Silver: {perk_redemption_block_points: "=perk_redemption_block_points", annual_perk_cap_usd: "=annual_perk_cap_usd"}
        ProBuild Gold: {perk_redemption_block_points: "=perk_redemption_block_points", annual_perk_cap_usd: "=annual_perk_cap_usd"}
        ProBuild Platinum: {perk_redemption_block_points: "=perk_redemption_block_points", annual_perk_cap_usd: "=annual_perk_cap_usd"}
        ProBuild Platinum Elite: {perk_redemption_block_points: "=perk_redemption_block_points", annual_perk_cap_usd: "=annual_perk_cap_usd"}
    measures: [pro_msr_available_points, pro_msr_perks_issued_ytd]

  - id: pro_points_reversal
    subject: [pro_points_reversed, pro_points_expired]
    rule: >-
      When a purchase is returned, the points earned on the returned part are reversed in proportion to the pre-tax amount returned, rounded down to a whole point, against the original spend row; when points_balance_may_go_negative is true the reversal applies in full even if the balance falls below zero.
      Points expire points_expiry_months calendar months after their earn date (same day of the month, or the last day when that day does not exist), oldest first, with expiry_basis aged_out.
      When a membership closes and closure_forfeits_points is true, every remaining point is forfeited with expiry_basis membership_closed.
    eligibility: []
    params:
      per_tier:
        ProBuild Member: {points_expiry_months: "=points_expiry_months"}
        ProBuild Bronze: {points_expiry_months: "=points_expiry_months"}
        ProBuild Silver: {points_expiry_months: "=points_expiry_months"}
        ProBuild Gold: {points_expiry_months: "=points_expiry_months"}
        ProBuild Platinum: {points_expiry_months: "=points_expiry_months"}
        ProBuild Platinum Elite: {points_expiry_months: "=points_expiry_months"}

  - id: pro_volume_pricing
    subject: [pro_spend_posted]
    rule: >-
      An active member may request a volume pricing quote, recorded as a pro_quotes record, for a pre-tax order of at least volume_pricing_min_order_usd with no more than job_lot_quote_max_lines lines and no item from volume_quote_excluded_departments; pro_msr_open_quotes may not exceed max_open_quotes.
      The quoted discount may not exceed the max_discount_pct of the highest volume_discount_ladder step whose min_order_usd the quote total reaches, and the quote is priced within quote_response_hours hours.
      A priced quote may be accepted within quote_validity_days days of pricing, revised at most quote_revision_limit times, and once accepted must be purchased within quote_price_hold_days days, after which it expires.
      A purchase priced under a quote carries pricing_basis pro_volume_quote and the pro_quote_id; quote pricing is never combined with the paint discount when paint_discount_combinable_with_quote is false, and on a Ridgeline Pro Credit commercial account it excludes the invoice from the prompt-payment discount.
    eligibility: []
    params:
      per_tier:
        ProBuild Member: {volume_pricing_min_order_usd: "=volume_pricing_min_order_usd", volume_discount_ladder: "=volume_discount_ladder", quote_validity_days: "=quote_validity_days"}
        ProBuild Bronze: {volume_pricing_min_order_usd: "=volume_pricing_min_order_usd", volume_discount_ladder: "=volume_discount_ladder", quote_validity_days: "=quote_validity_days"}
        ProBuild Silver: {volume_pricing_min_order_usd: "=volume_pricing_min_order_usd", volume_discount_ladder: "=volume_discount_ladder", quote_validity_days: "=quote_validity_days"}
        ProBuild Gold: {volume_pricing_min_order_usd: "=volume_pricing_min_order_usd", volume_discount_ladder: "=volume_discount_ladder", quote_validity_days: "=quote_validity_days"}
        ProBuild Platinum: {volume_pricing_min_order_usd: "=volume_pricing_min_order_usd", volume_discount_ladder: "=volume_discount_ladder", quote_validity_days: "=quote_validity_days"}
        ProBuild Platinum Elite: {volume_pricing_min_order_usd: "=volume_pricing_min_order_usd", volume_discount_ladder: "=volume_discount_ladder", quote_validity_days: "=quote_validity_days"}
    measures: [pro_msr_open_quotes]

  - id: pro_tier_benefits
    subject: [pro_spend_posted]
    rule: >-
      Members receive paint_discount_pct off paint and paint sundries at the register, until pro_msr_paint_discount_ytd reaches paint_discount_cap_usd for the program year; the credited spend is the amount after the discount.
      The tier's rental_discount_pct applies to Ridgeline Tool Rental rental time, special_order_restocking_waived to returnable Ridgeline special orders, and order_delivery_discount_pct to Ridgeline Orders & Delivery delivery fees, each under the rules of that program and each only while the membership is active on the relevant date.
      Members at a tier with dedicated_account_rep true are served by an assigned pro account representative.
    eligibility: []
    params:
      per_tier:
        ProBuild Member: {paint_discount_pct: "=paint_discount_pct", rental_discount_pct: "=rental_discount_pct", special_order_restocking_waived: "=special_order_restocking_waived", order_delivery_discount_pct: "=order_delivery_discount_pct"}
        ProBuild Bronze: {paint_discount_pct: "=paint_discount_pct", rental_discount_pct: "=rental_discount_pct", special_order_restocking_waived: "=special_order_restocking_waived", order_delivery_discount_pct: "=order_delivery_discount_pct"}
        ProBuild Silver: {paint_discount_pct: "=paint_discount_pct", rental_discount_pct: "=rental_discount_pct", special_order_restocking_waived: "=special_order_restocking_waived", order_delivery_discount_pct: "=order_delivery_discount_pct"}
        ProBuild Gold: {paint_discount_pct: "=paint_discount_pct", rental_discount_pct: "=rental_discount_pct", special_order_restocking_waived: "=special_order_restocking_waived", order_delivery_discount_pct: "=order_delivery_discount_pct"}
        ProBuild Platinum: {paint_discount_pct: "=paint_discount_pct", rental_discount_pct: "=rental_discount_pct", special_order_restocking_waived: "=special_order_restocking_waived", order_delivery_discount_pct: "=order_delivery_discount_pct"}
        ProBuild Platinum Elite: {paint_discount_pct: "=paint_discount_pct", rental_discount_pct: "=rental_discount_pct", special_order_restocking_waived: "=special_order_restocking_waived", order_delivery_discount_pct: "=order_delivery_discount_pct"}
    measures: [pro_msr_paint_discount_ytd]

  - id: pro_membership_standing
    subject: [pro_suspended, pro_reinstated, pro_closed]
    rule: >-
      A membership is suspended for program misuse (purchases for resale under another business's number, sharing the member number) and, when suspension_on_trade_chargeoff is true, when the member's Ridgeline Pro Credit account is charged off; while suspended no spend or points are credited and no points are redeemed.
      A suspended membership is reviewed suspension_review_months months after suspension and either reinstated or closed.
      An owner or principal may close the membership at any time by their own confirmation, and the program closes a membership with no qualifying purchase for inactivity_close_months months.
    eligibility: []
    params:
      per_tier:
        ProBuild Member: {suspension_review_months: "=suspension_review_months", inactivity_close_months: "=inactivity_close_months"}
        ProBuild Bronze: {suspension_review_months: "=suspension_review_months", inactivity_close_months: "=inactivity_close_months"}
        ProBuild Silver: {suspension_review_months: "=suspension_review_months", inactivity_close_months: "=inactivity_close_months"}
        ProBuild Gold: {suspension_review_months: "=suspension_review_months", inactivity_close_months: "=inactivity_close_months"}
        ProBuild Platinum: {suspension_review_months: "=suspension_review_months", inactivity_close_months: "=inactivity_close_months"}
        ProBuild Platinum Elite: {suspension_review_months: "=suspension_review_months", inactivity_close_months: "=inactivity_close_months"}

  - id: pro_purchasers
    subject: [pro_purchasers_updated]
    rule: >-
      Only an owner or principal of the business may add or remove authorized purchasers.
      authorized_purchaser_count may never exceed max_authorized_purchasers, and at most purchaser_changes_per_month additions or removals are processed in a calendar month.
      Purchasers can be changed only while the membership status is active or suspended.
    eligibility:
      - id: principal_only
        applies_to: [pro_purchasers_updated]
        kind: authorization
        condition: Only an owner or principal of the business may add or remove authorized purchasers.
        evidence_fields: [pro_memberships.pro_membership_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [pro_memberships.pro_membership_id]
          action_bindings:
            pro_memberships.pro_membership_id: pro_membership_id
      - id: open_membership
        applies_to: [pro_purchasers_updated]
        kind: state
        condition: Purchasers can be changed only while the membership status is active or suspended.
        evidence_fields: [pro_memberships.pro_membership_id, pro_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
