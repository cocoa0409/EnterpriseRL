events:
  - type: rental_reserved
    target: rental_agreements
    mutation: create
    meaning: A rental agreement is opened for one equipment item — reserved ahead, or written at the counter for immediate checkout.
    grain: one row per agreement (one equipment item)
    fields:
      customer_id: The renter.
      variant_name: Equipment class, as its official full name.
      status: Set to reserved on creation.
      agreement_number: Rental agreement number.
      store_number: Rental center the equipment is rented from.
      equipment_description: Equipment rented, as on the rate card.
      equipment_asset_number: Asset tag of the unit assigned.
      daily_rate: Daily rate of the item on the rate card at reservation.
      replacement_value: Replacement value of the item printed on the agreement.
      reservation_date: Date the reservation was made.
      scheduled_pickup_at: Pickup time booked.
      delivery_selected: Whether job-site delivery was booked.
      delivery_distance_miles: One-way distance from the store to the job site.
    triggers: []
  - type: rental_checked_out
    target: rental_agreements
    mutation: {transition: {from: reserved, to: on_rent}}
    meaning: The equipment leaves the rental center with the renter or on the delivery truck.
    grain: one row per transaction
    fields:
      status: Set to on_rent.
      checkout_at: Moment the equipment was checked out.
      due_back_at: Moment the equipment is due back.
      damage_protection_elected: Whether damage protection was taken.
      insurance_certificate_on_file: Whether a commercial certificate of insurance was presented.
      deposit_amount: Security deposit collected (0.00 when waived).
      fuel_level_out: Fuel level at checkout in eighths of a tank.
      hour_meter_out: Engine hour meter reading at checkout.
    triggers: []
  - type: rental_extended
    target: rental_agreements
    mutation: update
    meaning: The renter extends the rental before it is due back.
    grain: one row per transaction
    fields:
      due_back_at: New due-back moment.
    triggers: []
  - type: rental_marked_overdue
    target: rental_agreements
    mutation: {transition: {from: on_rent, to: overdue}}
    meaning: Unreturned equipment passes the overdue threshold.
    grain: one row per transaction
    fields:
      status: Set to overdue.
    triggers: []
  - type: rental_returned
    target: rental_agreements
    mutation: {transition: [{from: on_rent, to: returned}, {from: overdue, to: returned}]}
    meaning: The equipment is checked back in at the store or picked up from the job site.
    grain: one row per transaction
    fields:
      status: Set to returned.
      returned_at: Moment of check-in.
      fuel_level_in: Fuel level at return in eighths of a tank.
      hour_meter_in: Engine hour meter reading at return.
    triggers:
      - event: rental:rental_inspection_recorded
        map: {}
      - event: rental:rental_time_charged
        map: {}
  - type: rental_converted
    target: rental_agreements
    mutation: {transition: {from: overdue, to: converted}}
    meaning: Unreturned equipment is treated as lost and charged at replacement value.
    grain: one row per transaction
    fields:
      status: Set to converted.
      closed_date: Date of conversion.
    triggers:
      - event: rental:rental_fee_charged
        map: {fee_type: lost_equipment}
  - type: rental_closed
    target: rental_agreements
    mutation: {transition: [{from: returned, to: closed}, {from: converted, to: closed}]}
    meaning: The agreement is settled and closed.
    grain: one row per transaction
    fields:
      status: Set to closed.
      closed_date: Date the agreement closed.
    triggers: []
  - type: rental_cancelled
    target: rental_agreements
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: A reservation is cancelled by the renter or released after the hold period.
    grain: one row per transaction
    fields:
      status: Set to cancelled.
      cancelled_date: Date of the cancellation or release.
    triggers: []
  - type: rental_time_charged
    target: rental_charges
    meaning: Rental time is billed at return, one row per rate period type in the billed combination.
    grain: one row per rate period type per billing date
    distinguish_by: [rate_period, charge_date]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Billing date (the return date, or the conversion date).
      rate_period: Rate period billed.
      periods_count: Number of periods of that type billed.
      amount: Charge for those periods, positive.
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_damage_protection_charged
    target: rental_charges
    meaning: The damage protection charge is billed on the rental time.
    grain: one row per billing date
    distinguish_by: [charge_date]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Billing date.
      amount: Damage protection charge, positive.
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_fee_charged
    target: rental_charges
    meaning: A rental fee is billed — cleaning, refuelling, engine overtime, delivery, pickup, damage repair, deductible, missing accessory, lost equipment or forfeited reservation.
    grain: one row per fee type per billing date
    distinguish_by: [fee_type, charge_date]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Billing date.
      fee_type: Which fee is billed.
      amount: Fee amount, positive.
      rental_request_id: The request the fee relates to, when any.
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_inspection_recorded
    target: rental_charges
    meaning: The rental center inspects the returned equipment and records its condition.
    grain: one row per inspection (one per return)
    distinguish_by: [charge_date]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Inspection date.
      amount: 0.00 — an inspection moves no money.
      inspection_outcome: Condition found.
      damage_cause: Cause of any damage found.
      repair_cost: Repair cost assessed at the shop labor rate plus parts.
      accessories_missing: Number of accessories not returned.
    triggers:
      - event: rental:rental_fee_charged
        when: {inspection_outcome: needs_cleaning}
        map: {fee_type: cleaning_fee, charge_date: charge_date}
      - event: rental:rental_fee_charged
        when: {inspection_outcome: missing_accessory}
        map: {fee_type: missing_accessory, charge_date: charge_date}
  - type: rental_pro_discount_applied
    target: rental_charges
    meaning: The ProBuild Rewards rental discount is credited against the rental time.
    grain: one row per billing date
    distinguish_by: [charge_date]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Billing date.
      amount: Discount amount, positive.
    account: rental_balance
    direction: out
    triggers: []
  - type: rental_malfunction_credit_issued
    target: rental_charges
    meaning: Rental time lost to a confirmed equipment malfunction is credited.
    grain: one row per malfunction report
    distinguish_by: [rental_request_id]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Date the credit posts.
      amount: Credit amount, positive.
      rental_request_id: The malfunction report.
    account: rental_balance
    direction: out
    triggers: []
  - type: rental_charge_adjusted
    target: rental_charges
    meaning: A damage, cleaning, fuel or missing accessory charge is reduced or removed after a dispute is resolved in the renter's favor.
    grain: one row per adjusted charge
    distinguish_by: [original_charge_id]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Date the adjustment posts.
      amount: Adjustment amount, positive.
      original_charge_id: The rental_fee_charged row adjusted.
      rental_request_id: The damage dispute.
    account: rental_balance
    direction: out
    triggers: []
  - type: rental_payment_received
    target: rental_charges
    meaning: The renter pays toward the agreement, or the deposit is applied to it.
    grain: one row per payment
    distinguish_by: [charge_date, payment_method, amount]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Date of the payment.
      amount: Amount paid, positive.
      payment_method: Tender used, or deposit_applied for an applied deposit.
    account: rental_balance
    direction: out
    triggers:
      - event: card:card_purchase_posted
        when: {payment_method: ridgeline_consumer_credit}
        map: {transaction_date: charge_date, amount: amount, merchant_reference: agreement_number, purchase_channel: tool_rental}
      - event: trade:trade_invoice_posted
        when: {payment_method: ridgeline_pro_credit}
        map: {transaction_date: charge_date, invoice_date: charge_date, amount: amount, purchase_channel: tool_rental}
  - type: rental_deposit_collected
    target: rental_charges
    meaning: A security deposit at checkout, or a reservation deposit, is collected and held.
    grain: one row per deposit kind
    distinguish_by: [deposit_kind]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Date collected.
      amount: Deposit amount, positive.
      deposit_kind: Which deposit.
      deposit_method: Tender the deposit was taken on.
    account: deposit_held
    direction: in
    triggers: []
  - type: rental_deposit_applied
    target: rental_charges
    meaning: A held deposit is applied to the agreement balance.
    grain: one row per deposit kind
    distinguish_by: [deposit_kind]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Date applied.
      amount: Amount applied, positive.
      deposit_kind: Which deposit.
    account: deposit_held
    direction: out
    triggers:
      - event: rental:rental_payment_received
        map: {amount: amount, charge_date: charge_date, payment_method: deposit_applied}
  - type: rental_deposit_released
    target: rental_charges
    meaning: A held deposit, or what is left of it, is released back to the renter's tender.
    grain: one row per deposit kind
    distinguish_by: [deposit_kind]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Date released.
      amount: Amount released, positive.
      deposit_kind: Which deposit.
    account: deposit_held
    direction: out
    triggers: []
  - type: rental_refund_issued
    target: rental_charges
    meaning: An overpayment on the agreement is refunded to the tender of the payment.
    grain: one row per refunded payment
    distinguish_by: [original_charge_id]
    fields:
      agreement_number: Rental agreement number.
      charge_date: Date the refund is issued.
      amount: Amount refunded, positive.
      refund_method: Tender refunded to (the original payment's tender).
      original_charge_id: The rental_payment_received row refunded.
    account: rental_balance
    direction: in
    triggers:
      - event: card:card_return_credit_posted
        when: {refund_method: ridgeline_consumer_credit}
        map: {transaction_date: charge_date, amount: amount, merchant_reference: agreement_number}
      - event: trade:trade_return_credit_posted
        when: {refund_method: ridgeline_pro_credit}
        map: {transaction_date: charge_date, amount: amount, merchant_reference: agreement_number}

measures:
  - id: rental_msr_open_agreements
    window: Portfolio state at the moment of the decision.
    measure: Count of the customer's rental_agreements whose status is reserved, on_rent or overdue.
  - id: rental_msr_time_charges
    window: Life of the agreement up to the billing date.
    measure: Sum of rental_time_charged amounts on the agreement, less rental_pro_discount_applied and rental_malfunction_credit_issued amounts when damage_protection_on_discounted_amount is true.
  - id: rental_msr_net_paid
    window: Life of the agreement up to the frozen date.
    measure: Sum of rental_payment_received amounts on the agreement minus rental_refund_issued amounts.

policies:
  - id: rental_agg_multi_holding
    subject: [rental_reserved]
    rule: >-
      A renter may hold several rental agreements at once, one per equipment item.
      rental_msr_open_agreements may not exceed max_open_agreements_consumer for a consumer profile or max_open_agreements_pro for a pro profile when a new agreement is opened.
      No agreement of the renter may be overdue or converted when a new agreement is opened.
    eligibility:
      - id: no_overdue_or_converted
        applies_to: [rental_reserved]
        kind: state
        condition: No agreement of the renter may be overdue or converted when a new agreement is opened.
        evidence_fields: [rental_agreements.customer_id, rental_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_agreements.customer_id]
          action_bindings:
            rental_agreements.customer_id: customer_id
        state_contract:
          field: rental_agreements.status
          allowed: [reserved, on_rent, returned, closed, cancelled]
    params:
      max_per_customer: null
      max_open_agreements_consumer: 3
      max_open_agreements_pro: 10
    measures: [rental_msr_open_agreements]

  - id: rental_agg_pro_relationship
    subject: [rental_deposit_collected, rental_pro_discount_applied]
    rule: >-
      What a renter holds elsewhere at Ridgeline changes the deposit and the rate on a rental.
      When deposit_waived_for_pro_credit is true and the rental charges are to be paid with a Ridgeline Pro Credit account of the renter whose status is active, no security deposit is collected; an account on hold, closed or charged off does not waive the deposit.
      The ProBuild Rewards rental discount applies only when the renter's ProBuild membership is active on the checkout date, at the discount percentage of the ProBuild tier held on that date (Ridgeline ProBuild Rewards parameter rental_discount_pct).
    eligibility: []

  - id: rental_reservations
    subject: [rental_reserved, rental_cancelled, rental_deposit_collected, rental_deposit_released, rental_fee_charged]
    rule: >-
      A reservation may be made no more than reservation_max_advance_days days ahead of the pickup date, and when reservation_deposit_usd is above 0.00 that deposit is collected as deposit_kind reservation_deposit when the reservation is made.
      Reserved equipment is held for reservation_hold_hours hours after scheduled_pickup_at, after which the system releases the reservation.
      A reservation cancelled at least reservation_cancel_notice_hours hours before scheduled_pickup_at (full 60-minute periods counted back from the pickup time; exactly that many hours qualifies) releases the reservation deposit in full.
      A later cancellation or a no-show forfeits the deposit when reservation_no_show_forfeits_deposit is true — the deposit is applied and an equal rental_fee_charged row with fee_type reservation_forfeit posts — and otherwise releases it.
      At checkout a reservation deposit is applied toward the rental charges at settlement like the security deposit.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_cancel_notice_hours: "=reservation_cancel_notice_hours", reservation_no_show_forfeits_deposit: "=reservation_no_show_forfeits_deposit"}
        Ridgeline Rental Floor and Surface Care: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_cancel_notice_hours: "=reservation_cancel_notice_hours", reservation_no_show_forfeits_deposit: "=reservation_no_show_forfeits_deposit"}
        Ridgeline Rental Lawn and Landscape: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_cancel_notice_hours: "=reservation_cancel_notice_hours", reservation_no_show_forfeits_deposit: "=reservation_no_show_forfeits_deposit"}
        Ridgeline Rental Concrete and Masonry: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_cancel_notice_hours: "=reservation_cancel_notice_hours", reservation_no_show_forfeits_deposit: "=reservation_no_show_forfeits_deposit"}
        Ridgeline Rental Aerial and Lifting: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_cancel_notice_hours: "=reservation_cancel_notice_hours", reservation_no_show_forfeits_deposit: "=reservation_no_show_forfeits_deposit"}
        Ridgeline Rental Earthmoving and Compact Equipment: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_cancel_notice_hours: "=reservation_cancel_notice_hours", reservation_no_show_forfeits_deposit: "=reservation_no_show_forfeits_deposit"}

  - id: rental_checkout
    subject: [rental_checked_out, rental_deposit_collected]
    rule: >-
      Equipment is checked out only to a renter who meets the class entry_gate (minimum age and number of identification documents) and, when operator_orientation_required is true, has completed the operating and safety orientation at the counter.
      A security deposit of deposit_usd is collected at checkout as deposit_kind security_deposit on one of deposit_tenders_accepted, unless waived under rental_agg_pro_relationship.
      Damage protection is offered at checkout and recorded in damage_protection_elected; when damage_protection_mandatory is true it must be taken, except that a renter who presents a commercial certificate of insurance may decline it when damage_protection_waivable_with_coi is true.
      due_back_at is set from the rate period the renter books, and the total period from checkout may not exceed max_agreement_days.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {deposit_usd: "=deposit_usd", damage_protection_mandatory: "=damage_protection_mandatory"}
        Ridgeline Rental Floor and Surface Care: {deposit_usd: "=deposit_usd", damage_protection_mandatory: "=damage_protection_mandatory"}
        Ridgeline Rental Lawn and Landscape: {deposit_usd: "=deposit_usd", damage_protection_mandatory: "=damage_protection_mandatory"}
        Ridgeline Rental Concrete and Masonry: {deposit_usd: "=deposit_usd", damage_protection_mandatory: "=damage_protection_mandatory"}
        Ridgeline Rental Aerial and Lifting: {deposit_usd: "=deposit_usd", damage_protection_mandatory: "=damage_protection_mandatory"}
        Ridgeline Rental Earthmoving and Compact Equipment: {deposit_usd: "=deposit_usd", damage_protection_mandatory: "=damage_protection_mandatory"}

  - id: rental_time_billing
    subject: [rental_time_charged]
    rule: >-
      Rental time runs from checkout_at to returned_at (or to the conversion date for converted equipment) and is billed at return from the item's daily_rate on the agreement.
      The four-hour rate is four_hour_rate_pct_of_daily percent of the daily rate where four_hour_available is true, a day is rental_day_hours hours, the weekly rate is weekly_rate_multiplier times the daily rate and the four-week rate is four_week_rate_multiplier times the daily rate.
      When lowest_cost_combination is true the time out is billed as the lowest-cost combination of those periods that covers it, with one row per period type used.
      A return within return_grace_minutes minutes after the end of a period is not charged for further time; a return later than that moves into the next period.
      Where weekend_special_available is true, equipment checked out on a Saturday and returned no later than one hour after store opening on the following Monday is billed weekend_rate_multiplier times the daily rate instead, when that is lower than the combination.
      Unused time inside a billed period is never refunded (early_return_refund false), and time past due_back_at is billed at the same rates as the rest of the rental.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {four_hour_rate_pct_of_daily: "=four_hour_rate_pct_of_daily", weekly_rate_multiplier: "=weekly_rate_multiplier", four_week_rate_multiplier: "=four_week_rate_multiplier", return_grace_minutes: "=return_grace_minutes"}
        Ridgeline Rental Floor and Surface Care: {four_hour_rate_pct_of_daily: "=four_hour_rate_pct_of_daily", weekly_rate_multiplier: "=weekly_rate_multiplier", four_week_rate_multiplier: "=four_week_rate_multiplier", return_grace_minutes: "=return_grace_minutes"}
        Ridgeline Rental Lawn and Landscape: {four_hour_rate_pct_of_daily: "=four_hour_rate_pct_of_daily", weekly_rate_multiplier: "=weekly_rate_multiplier", four_week_rate_multiplier: "=four_week_rate_multiplier", return_grace_minutes: "=return_grace_minutes"}
        Ridgeline Rental Concrete and Masonry: {four_hour_rate_pct_of_daily: "=four_hour_rate_pct_of_daily", weekly_rate_multiplier: "=weekly_rate_multiplier", four_week_rate_multiplier: "=four_week_rate_multiplier", return_grace_minutes: "=return_grace_minutes"}
        Ridgeline Rental Aerial and Lifting: {four_hour_rate_pct_of_daily: "=four_hour_rate_pct_of_daily", weekly_rate_multiplier: "=weekly_rate_multiplier", four_week_rate_multiplier: "=four_week_rate_multiplier", return_grace_minutes: "=return_grace_minutes"}
        Ridgeline Rental Earthmoving and Compact Equipment: {four_hour_rate_pct_of_daily: "=four_hour_rate_pct_of_daily", weekly_rate_multiplier: "=weekly_rate_multiplier", four_week_rate_multiplier: "=four_week_rate_multiplier", return_grace_minutes: "=return_grace_minutes"}
    formula:
      four_hour_rate: round(daily_rate * four_hour_rate_pct_of_daily / 100, 2)
      weekly_rate: round(daily_rate * weekly_rate_multiplier, 2)
      four_week_rate: round(daily_rate * four_week_rate_multiplier, 2)
      weekend_rate: round(daily_rate * weekend_rate_multiplier, 2)

  - id: rental_pro_discount
    subject: [rental_pro_discount_applied]
    rule: >-
      On a class whose pro_discount_eligible is true, a renter whose ProBuild Rewards membership was active on the checkout date receives that ProBuild tier's rental_discount_pct percent off the rental time charges, posted at return as one rental_pro_discount_applied row and rounded to the nearest cent.
      The discount applies to rental time only, never to damage protection, fees, deposits or lost equipment.
      The ProBuild rental discount and the weekend special are mutually exclusive: rental time billed at the weekend special earns no ProBuild discount.
      A renter without an active membership on the checkout date, including one who enrolls after checkout, receives no discount on that agreement.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {pro_discount_eligible: "=pro_discount_eligible"}
        Ridgeline Rental Floor and Surface Care: {pro_discount_eligible: "=pro_discount_eligible"}
        Ridgeline Rental Lawn and Landscape: {pro_discount_eligible: "=pro_discount_eligible"}
        Ridgeline Rental Concrete and Masonry: {pro_discount_eligible: "=pro_discount_eligible"}
        Ridgeline Rental Aerial and Lifting: {pro_discount_eligible: "=pro_discount_eligible"}
        Ridgeline Rental Earthmoving and Compact Equipment: {pro_discount_eligible: "=pro_discount_eligible"}

  - id: rental_damage_protection
    subject: [rental_damage_protection_charged, rental_fee_charged]
    rule: >-
      When damage_protection_elected is true, damage protection of damage_protection_pct percent is charged on rental_msr_time_charges (rental time after the ProBuild discount and malfunction credits when damage_protection_on_discounted_amount is true, before them otherwise), rounded to the nearest cent, as one row on the billing date.
      With damage protection, accidental damage found at inspection is covered up to damage_protection_covers_up_to_usd per incident: the renter pays damage_protection_deductible_usd (fee_type damage_deductible) plus any repair cost above the coverage limit (fee_type damage_repair).
      Damage protection never covers loss or theft when damage_protection_excludes_theft is true, tire and track damage when damage_protection_excludes_tires_tracks is true, or damage caused by misuse; those repair costs are billed in full as fee_type damage_repair.
      Without damage protection the full assessed repair_cost is billed as fee_type damage_repair.
      Damage protection never covers cleaning, refuelling or missing accessories.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {damage_protection_pct: "=damage_protection_pct", damage_protection_covers_up_to_usd: "=damage_protection_covers_up_to_usd", damage_protection_deductible_usd: "=damage_protection_deductible_usd"}
        Ridgeline Rental Floor and Surface Care: {damage_protection_pct: "=damage_protection_pct", damage_protection_covers_up_to_usd: "=damage_protection_covers_up_to_usd", damage_protection_deductible_usd: "=damage_protection_deductible_usd"}
        Ridgeline Rental Lawn and Landscape: {damage_protection_pct: "=damage_protection_pct", damage_protection_covers_up_to_usd: "=damage_protection_covers_up_to_usd", damage_protection_deductible_usd: "=damage_protection_deductible_usd"}
        Ridgeline Rental Concrete and Masonry: {damage_protection_pct: "=damage_protection_pct", damage_protection_covers_up_to_usd: "=damage_protection_covers_up_to_usd", damage_protection_deductible_usd: "=damage_protection_deductible_usd"}
        Ridgeline Rental Aerial and Lifting: {damage_protection_pct: "=damage_protection_pct", damage_protection_covers_up_to_usd: "=damage_protection_covers_up_to_usd", damage_protection_deductible_usd: "=damage_protection_deductible_usd"}
        Ridgeline Rental Earthmoving and Compact Equipment: {damage_protection_pct: "=damage_protection_pct", damage_protection_covers_up_to_usd: "=damage_protection_covers_up_to_usd", damage_protection_deductible_usd: "=damage_protection_deductible_usd"}
    formula:
      damage_protection_charge: round(rental_msr_time_charges * damage_protection_pct / 100, 2)
      renter_repair_share: damage_protection_deductible_usd + max(0, repair_cost - damage_protection_covers_up_to_usd)
    measures: [rental_msr_time_charges]

  - id: rental_return_fees
    subject: [rental_returned, rental_inspection_recorded, rental_fee_charged]
    rule: >-
      Every returned item is inspected on its return date and the inspection record decides the return fees.
      Equipment returned needing cleaning beyond normal use incurs cleaning_fee_usd, and each accessory not returned incurs accessory_missing_fee_usd.
      Fuel below fuel_level_out is charged fuel_charge_per_eighth_usd per missing eighth plus fuel_service_fee_usd once.
      On metered equipment (engine_hours_per_day above 0), engine hours used (hour_meter_in minus hour_meter_out) above engine_hours_per_day times the billed days are charged at overtime_rate_pct_of_daily_per_hour percent of the daily rate per hour, as fee_type overtime_hours.
      Damage is assessed at shop_labor_rate_usd per hour plus parts and billed under rental_damage_protection.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {cleaning_fee_usd: "=cleaning_fee_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd", engine_hours_per_day: "=engine_hours_per_day"}
        Ridgeline Rental Floor and Surface Care: {cleaning_fee_usd: "=cleaning_fee_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd", engine_hours_per_day: "=engine_hours_per_day"}
        Ridgeline Rental Lawn and Landscape: {cleaning_fee_usd: "=cleaning_fee_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd", engine_hours_per_day: "=engine_hours_per_day"}
        Ridgeline Rental Concrete and Masonry: {cleaning_fee_usd: "=cleaning_fee_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd", engine_hours_per_day: "=engine_hours_per_day"}
        Ridgeline Rental Aerial and Lifting: {cleaning_fee_usd: "=cleaning_fee_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd", engine_hours_per_day: "=engine_hours_per_day"}
        Ridgeline Rental Earthmoving and Compact Equipment: {cleaning_fee_usd: "=cleaning_fee_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd", engine_hours_per_day: "=engine_hours_per_day"}
    formula:
      fuel_charge: (fuel_level_out - fuel_level_in) * fuel_charge_per_eighth_usd + fuel_service_fee_usd if fuel_level_in < fuel_level_out else 0

  - id: rental_delivery
    subject: [rental_fee_charged]
    rule: >-
      Job-site delivery is offered only where delivery_available is true and delivery_distance_miles is no more than delivery_max_miles.
      The delivery charge (fee_type delivery_fee) is delivery_fee_base_usd plus delivery_fee_per_mile_usd per mile of one-way distance, and the pickup charge (fee_type pickup_fee) is pickup_fee_pct_of_delivery percent of the delivery charge; both are billed at return.
      When the delivery truck misses the booked delivery window, rental time starts at the actual delivery time recorded as checkout_at.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {delivery_fee_base_usd: "=delivery_fee_base_usd", delivery_fee_per_mile_usd: "=delivery_fee_per_mile_usd"}
        Ridgeline Rental Floor and Surface Care: {delivery_fee_base_usd: "=delivery_fee_base_usd", delivery_fee_per_mile_usd: "=delivery_fee_per_mile_usd"}
        Ridgeline Rental Lawn and Landscape: {delivery_fee_base_usd: "=delivery_fee_base_usd", delivery_fee_per_mile_usd: "=delivery_fee_per_mile_usd"}
        Ridgeline Rental Concrete and Masonry: {delivery_fee_base_usd: "=delivery_fee_base_usd", delivery_fee_per_mile_usd: "=delivery_fee_per_mile_usd"}
        Ridgeline Rental Aerial and Lifting: {delivery_fee_base_usd: "=delivery_fee_base_usd", delivery_fee_per_mile_usd: "=delivery_fee_per_mile_usd"}
        Ridgeline Rental Earthmoving and Compact Equipment: {delivery_fee_base_usd: "=delivery_fee_base_usd", delivery_fee_per_mile_usd: "=delivery_fee_per_mile_usd"}
    formula:
      delivery_fee: round(delivery_fee_base_usd + delivery_fee_per_mile_usd * delivery_distance_miles, 2)
      pickup_fee: round(delivery_fee * pickup_fee_pct_of_delivery / 100, 2)

  - id: rental_malfunction
    subject: [rental_malfunction_credit_issued]
    rule: >-
      A renter whose equipment stops working reports it as a rental_requests record of request_type malfunction_report, and the report's created_at is the time of the report.
      A malfunction credit posts only when the return inspection recorded inspection_outcome malfunction_confirmed for the equipment.
      When the report was made within malfunction_full_credit_hours hours after checkout_at, the full rental time charged is credited; otherwise the rental time from the report to the return (or to the swap to a replacement unit) is credited, valued at the same rates.
      Equipment found damaged by misuse earns no malfunction credit, and one malfunction report earns at most one credit.
    eligibility:
      - id: malfunction_confirmed
        applies_to: [rental_malfunction_credit_issued]
        kind: state
        condition: A malfunction credit posts only when the return inspection recorded inspection_outcome malfunction_confirmed for the equipment.
        evidence_fields: [rental_charges.rental_agreement_id, rental_charges.inspection_outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_charges.rental_agreement_id]
          action_bindings:
            rental_charges.rental_agreement_id: rental_agreement_id
        state_contract:
          field: rental_charges.inspection_outcome
          allowed: [malfunction_confirmed]
      - id: one_credit_per_report
        applies_to: [rental_malfunction_credit_issued]
        kind: dedup
        condition: Equipment found damaged by misuse earns no malfunction credit, and one malfunction report earns at most one credit.
        evidence_fields: [rental_charges.rental_request_id, rental_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_charges.rental_request_id]
          action_bindings:
            rental_charges.rental_request_id: rental_request_id
        dedup_contract:
          table: rental_charges
          mode: separate_record
          object_bindings: {rental_request_id: rental_request_id}
          duplicate_filters: {event_type: [rental_malfunction_credit_issued]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {malfunction_full_credit_hours: "=malfunction_full_credit_hours"}
        Ridgeline Rental Floor and Surface Care: {malfunction_full_credit_hours: "=malfunction_full_credit_hours"}
        Ridgeline Rental Lawn and Landscape: {malfunction_full_credit_hours: "=malfunction_full_credit_hours"}
        Ridgeline Rental Concrete and Masonry: {malfunction_full_credit_hours: "=malfunction_full_credit_hours"}
        Ridgeline Rental Aerial and Lifting: {malfunction_full_credit_hours: "=malfunction_full_credit_hours"}
        Ridgeline Rental Earthmoving and Compact Equipment: {malfunction_full_credit_hours: "=malfunction_full_credit_hours"}

  - id: rental_extensions
    subject: [rental_extended]
    rule: >-
      A rental can be extended only while the agreement status is on_rent.
      The extension must be requested no later than the due-back time.
      The due-back time is compared to the moment of the request to the minute; a request at or before due_back_at qualifies, and equipment already past due cannot be extended and must be returned or billed as it stands.
      One extension adds no more than extension_max_days days, and the total period from checkout_at may not exceed max_agreement_days.
      An extension changes only due_back_at; the time is billed at return under rental_time_billing.
    eligibility:
      - id: on_rent_only
        applies_to: [rental_extended]
        kind: state
        condition: A rental can be extended only while the agreement status is on_rent.
        evidence_fields: [rental_agreements.rental_agreement_id, rental_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_agreements.rental_agreement_id]
          action_bindings:
            rental_agreements.rental_agreement_id: rental_agreement_id
        state_contract:
          field: rental_agreements.status
          allowed: [on_rent]
      - id: before_due
        applies_to: [rental_extended]
        kind: time
        condition: The extension must be requested no later than the due-back time.
        evidence_fields: [rental_agreements.rental_agreement_id, rental_agreements.due_back_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_agreements.rental_agreement_id]
          action_bindings:
            rental_agreements.rental_agreement_id: rental_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the due-back time
          anchor_source: rental_agreements.due_back_at
          relation: not_after
          duration_source: params.extension_request_grace_hours
          unit: elapsed_hours
          counting_rule: The due-back time is compared to the moment of the request to the minute; a request at or before due_back_at qualifies, and equipment already past due cannot be extended and must be returned or billed as it stands.
          boundary: inclusive
    params:
      extension_request_grace_hours: 0
      per_tier:
        Ridgeline Rental Hand and Power Tools: {extension_max_days: "=extension_max_days", max_agreement_days: "=max_agreement_days"}
        Ridgeline Rental Floor and Surface Care: {extension_max_days: "=extension_max_days", max_agreement_days: "=max_agreement_days"}
        Ridgeline Rental Lawn and Landscape: {extension_max_days: "=extension_max_days", max_agreement_days: "=max_agreement_days"}
        Ridgeline Rental Concrete and Masonry: {extension_max_days: "=extension_max_days", max_agreement_days: "=max_agreement_days"}
        Ridgeline Rental Aerial and Lifting: {extension_max_days: "=extension_max_days", max_agreement_days: "=max_agreement_days"}
        Ridgeline Rental Earthmoving and Compact Equipment: {extension_max_days: "=extension_max_days", max_agreement_days: "=max_agreement_days"}

  - id: rental_overdue_and_conversion
    subject: [rental_marked_overdue, rental_converted, rental_fee_charged]
    rule: >-
      Equipment not returned within overdue_after_hours hours after due_back_at plus return_grace_minutes is marked overdue by the system.
      Equipment overdue for conversion_days_overdue days is treated as lost: the agreement is converted, rental time is billed up to the conversion date, and the replacement_value on the agreement (fee_type lost_equipment) and lost_equipment_admin_fee_usd (fee_type lost_equipment_admin_fee) are billed, with any held deposit applied.
      Equipment returned after conversion is checked in and the lost equipment charges are reversed only by the rental center manager, not by Customer Care.
    eligibility: []
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {overdue_after_hours: "=overdue_after_hours", conversion_days_overdue: "=conversion_days_overdue", lost_equipment_admin_fee_usd: "=lost_equipment_admin_fee_usd"}
        Ridgeline Rental Floor and Surface Care: {overdue_after_hours: "=overdue_after_hours", conversion_days_overdue: "=conversion_days_overdue", lost_equipment_admin_fee_usd: "=lost_equipment_admin_fee_usd"}
        Ridgeline Rental Lawn and Landscape: {overdue_after_hours: "=overdue_after_hours", conversion_days_overdue: "=conversion_days_overdue", lost_equipment_admin_fee_usd: "=lost_equipment_admin_fee_usd"}
        Ridgeline Rental Concrete and Masonry: {overdue_after_hours: "=overdue_after_hours", conversion_days_overdue: "=conversion_days_overdue", lost_equipment_admin_fee_usd: "=lost_equipment_admin_fee_usd"}
        Ridgeline Rental Aerial and Lifting: {overdue_after_hours: "=overdue_after_hours", conversion_days_overdue: "=conversion_days_overdue", lost_equipment_admin_fee_usd: "=lost_equipment_admin_fee_usd"}
        Ridgeline Rental Earthmoving and Compact Equipment: {overdue_after_hours: "=overdue_after_hours", conversion_days_overdue: "=conversion_days_overdue", lost_equipment_admin_fee_usd: "=lost_equipment_admin_fee_usd"}

  - id: rental_damage_disputes
    subject: [rental_charge_adjusted]
    rule: >-
      A renter may dispute a damage repair, deductible, cleaning, fuel or missing accessory charge as a rental_requests record of request_type damage_dispute naming the charge.
      The dispute must be filed no later than damage_dispute_days calendar days after the equipment was returned.
      Days are counted as calendar days from the date part of returned_at as day 0 to the date the dispute is filed; filing on the last day qualifies.
      An adjustment posts only when the damage dispute request has status approved, for the amount approved and never more than the disputed charge; a charge already adjusted cannot be adjusted again.
    eligibility:
      - id: filed_in_time
        applies_to: [rental_charge_adjusted]
        kind: time
        condition: The dispute must be filed no later than damage_dispute_days calendar days after the equipment was returned.
        evidence_fields: [rental_agreements.rental_agreement_id, rental_agreements.returned_at, rental_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_agreements.rental_agreement_id]
          action_bindings:
            rental_agreements.rental_agreement_id: rental_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the equipment was returned
          anchor_source: rental_agreements.returned_at
          relation: not_after
          duration_source: variants.damage_dispute_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the date part of returned_at as day 0 to the date the dispute is filed; filing on the last day qualifies.
          boundary: inclusive
      - id: dispute_approved
        applies_to: [rental_charge_adjusted]
        kind: state
        condition: An adjustment posts only when the damage dispute request has status approved, for the amount approved and never more than the disputed charge; a charge already adjusted cannot be adjusted again.
        evidence_fields: [rental_requests.rental_request_id, rental_requests.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_requests.rental_request_id]
          action_bindings:
            rental_requests.rental_request_id: rental_request_id
        state_contract:
          field: rental_requests.status
          allowed: [approved]
    params:
      per_tier:
        Ridgeline Rental Hand and Power Tools: {damage_dispute_days: "=damage_dispute_days"}
        Ridgeline Rental Floor and Surface Care: {damage_dispute_days: "=damage_dispute_days"}
        Ridgeline Rental Lawn and Landscape: {damage_dispute_days: "=damage_dispute_days"}
        Ridgeline Rental Concrete and Masonry: {damage_dispute_days: "=damage_dispute_days"}
        Ridgeline Rental Aerial and Lifting: {damage_dispute_days: "=damage_dispute_days"}
        Ridgeline Rental Earthmoving and Compact Equipment: {damage_dispute_days: "=damage_dispute_days"}

  - id: rental_settlement
    subject: [rental_payment_received, rental_deposit_applied, rental_deposit_released, rental_refund_issued, rental_closed]
    rule: >-
      At return the agreement is settled: every charge is billed, a held deposit is applied to the balance up to the balance owed and any remainder is released, and the renter pays what is still owed on one of payment_methods_accepted.
      Payments are accepted on agreements whose status is on_rent, overdue, returned or converted.
      When credits leave the agreement overpaid, the overpayment is refunded to the tender of the most recent payment, never above that payment.
      An agreement closes when its balance_due is 0.00 and deposit_held is 0.00.
    eligibility:
      - id: payable_status
        applies_to: [rental_payment_received]
        kind: state
        condition: Payments are accepted on agreements whose status is on_rent, overdue, returned or converted.
        evidence_fields: [rental_agreements.rental_agreement_id, rental_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_agreements.rental_agreement_id]
          action_bindings:
            rental_agreements.rental_agreement_id: rental_agreement_id
        state_contract:
          field: rental_agreements.status
          allowed: [on_rent, overdue, returned, converted]
    measures: [rental_msr_net_paid]
