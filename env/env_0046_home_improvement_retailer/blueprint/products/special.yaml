# Ridgeline Special Order Services — merchandise not stocked in the store, ordered from the vendor for
# one customer: catalog items, cut-to-order flooring, made-to-measure blinds, windows and doors,
# semi-custom cabinetry and fabricated countertops.
category: special
display_name: Ridgeline Special Order Services

binding:
  holding_table: special_orders
  event_tables: [special_order_events]
  intake_tables: [special_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: order_balance}

lifecycle:
  states: [placed, vendor_confirmed, in_production, shipped, ready, completed, cancelled, returned]
  transitions:
    - {from: placed, to: vendor_confirmed, by: system, means: The vendor acknowledges the purchase order and confirms the ship or production date.}
    - {from: vendor_confirmed, to: in_production, by: system, means: The vendor starts making the made-to-order item.}
    - {from: vendor_confirmed, to: shipped, by: system, means: The vendor ships a catalog item from its stock.}
    - {from: in_production, to: shipped, by: system, means: The vendor ships the finished item.}
    - {from: shipped, to: ready, by: system, means: The item is received and checked in at the store and is ready for pickup or delivery.}
    - {from: ready, to: completed, by: system, means: The customer picks the item up or it is delivered.}
    - {from: placed, to: cancelled, by: user, means: The customer cancels the order before the vendor confirms it.}
    - {from: vendor_confirmed, to: cancelled, by: user, means: The customer cancels a confirmed order before production or shipment.}
    - {from: in_production, to: cancelled, by: user, means: The customer cancels an order in production under the vendor-delay remedy.}
    - {from: placed, to: cancelled, by: system, means: The order is cancelled because the vendor did not confirm it in time or cannot supply it.}
    - {from: ready, to: cancelled, by: system, means: An item never picked up is treated as abandoned and returned to the vendor.}
    - {from: completed, to: returned, by: user, means: The customer returns a returnable special order item.}

accounts:
  - key: order_balance
    unit: USD
    meaning: Amount the customer owes on the order — order total, fees and refunds paid out in; payments and credits out (negative means money is owed back to the customer).

parameter_schema:
  deposit_pct: Deposit due when the order is placed, as a percentage of the order total; 100 means paid in full at order, percent.
  deposit_min_usd: Minimum deposit due at order, USD.
  order_min_usd: Smallest order total accepted for the program, USD.
  payment_methods_accepted: Tenders accepted on the order (list drawn from cash, check, bank_card, ridgeline_consumer_credit, ridgeline_pro_credit).
  order_modification_hours: Hours after the order is placed during which it may be changed without cancelling, provided the vendor has not confirmed it, hours.
  free_cancellation_hours: Hours after the order is placed during which it may be cancelled with no fee, provided production has not started and it has not shipped, hours.
  cancellation_fee_pct_before_production: Cancellation fee as a percentage of the order total after the free window and before production or shipment, percent.
  cancellation_fee_min_usd: Minimum cancellation fee when a percentage fee applies, USD.
  cancellable_after_production: Whether the customer may cancel once production has started (outside the vendor-delay remedy), boolean.
  vendor_change_free_cancel: Whether the customer may cancel free when the vendor changes the price, specification or lead time after order, boolean.
  vendor_confirmation_days: Days after order within which the vendor must confirm, failing which the order is cancelled free, calendar days.
  lead_time_days_quoted: Days from the order date to the promised ready date quoted at order, calendar days.
  vendor_delay_threshold_days: Days by which the estimated ready date may pass the promised ready date before the delay remedies apply, calendar days.
  delay_cancellation_in_production_allowed: Whether the delay remedy allows a fee-free cancellation even after production has started, boolean.
  delay_credit_pct: Credit offered, as a percentage of the order total, to a customer who keeps a delayed order instead of cancelling, percent.
  delay_credit_max_usd: Largest delay credit per order, USD.
  pro_measure_required: Whether the order may be placed only from measurements taken by a Ridgeline installer, boolean.
  ridgeline_measure_guarantee: Whether an item that does not fit because of a Ridgeline installer's measurement is remade at no charge, boolean.
  template_visit_required: Whether production may start only after the installer's on-site template is recorded, boolean.
  installation_linked_allowed: Whether the order may be linked to an installation contract as its materials, boolean.
  linked_install_storage_free: Whether an item linked to an installation contract is stored free at the store until its installation date, boolean.
  receipt_inspection_required: Whether the store inspects the item on arrival before it is made ready, boolean.
  receipt_inspection_days: Days after arrival within which the receipt inspection is recorded, calendar days.
  partial_shipment_allowed: Whether the vendor may ship part of the order ahead of the rest, boolean.
  pickup_hold_days: Days after the ready date the item is held free of charge, calendar days.
  storage_fee_per_day_usd: Storage fee per day after the free hold period; 0 means none, USD.
  storage_fee_cap_usd: Largest total storage fee per order, USD.
  abandonment_days: Days after the ready date after which an item not picked up or delivered is treated as abandoned, calendar days.
  abandonment_fee_pct: Fee on an abandoned order as a percentage of the order total, percent.
  home_delivery_available: Whether home delivery is offered for the program, boolean.
  home_delivery_fee_usd: Home delivery charge, USD.
  free_delivery_threshold_usd: Order total at or above which home delivery is free; 0 means no free-delivery threshold, USD.
  delivery_reschedule_notice_hours: Hours before the delivery window by which a delivery may be moved free, hours.
  delivery_reschedule_fee_usd: Fee for moving a delivery with less notice, USD.
  failed_delivery_fee_usd: Fee when a delivery cannot be completed because no one is at the address, USD.
  returnable: Whether the item may be returned after pickup or delivery, boolean.
  return_window_days: Days after pickup or delivery within which a returnable item may be returned, calendar days.
  return_requires_original_packaging: Whether a return must be unused in the original packaging, boolean.
  restocking_fee_pct: Restocking fee on a return as a percentage of the item price, percent.
  restocking_fee_min_usd: Minimum restocking fee when a restocking fee applies, USD.
  restocking_fee_waived_if_defective: Whether no restocking fee applies when the item is returned as defective or wrong, boolean.
  pro_restocking_waiver_eligible: Whether the ProBuild Rewards restocking waiver applies to returns in this program, boolean.
  damage_report_hours: Hours after pickup or delivery within which shipping damage must be reported for a free replacement or allowance, hours.
  damage_allowance_pct: Allowance offered, as a percentage of the item price, to a customer who keeps an item with cosmetic damage; 0 means no allowance offered, percent.
  reorder_for_damaged_free: Whether a damaged or wrong item reported in time is reordered at no charge, boolean.
  reorder_lead_days_if_damaged: Days from the damage report to the new promised ready date of a replacement, calendar days.
  price_protection_days: Days after the order date during which a lower vendor price on the same item is credited; 0 means none, calendar days.
  pro_volume_quote_eligible: Whether the order may be priced under a ProBuild volume pricing quote, boolean.

