events:
  - type: special_order_placed
    target: special_orders
    mutation: create
    meaning: A special order for one vendor item is placed for the customer.
    grain: one row per special order (one vendor purchase order)
    fields:
      customer_id: The customer who placed the order.
      variant_name: Special order program, as its official full name.
      status: Set to placed on creation.
      order_number: Special order number.
      vendor_name: Vendor the item is ordered from.
      item_description: Item ordered, as on the vendor order.
      order_placed_at: Moment the order was placed.
      order_date: Date the order was placed.
      order_total: Price of the order before tax.
      pricing_basis: How the order was priced.
      pro_quote_id: ProBuild quote applied, when pricing_basis is pro_volume_quote.
      fulfillment_method: Store pickup or home delivery.
      delivery_address: Address for a home delivery.
      promised_ready_date: Ready date promised at order.
      estimated_ready_date: Vendor's current estimate of the ready date (equal to the promise at order).
      measured_by: Who took the measurements the order was made from.
      linked_install_contract_id: Installation contract the order supplies, when any.
    triggers:
      - event: special:special_order_billed
        map: {event_date: order_date, amount: order_total, order_number: order_number}
  - type: special_vendor_confirmed
    target: special_orders
    mutation: {transition: {from: placed, to: vendor_confirmed}}
    meaning: The vendor confirms the order.
    grain: one row per transaction
    fields:
      status: Set to vendor_confirmed.
      vendor_confirmed_date: Date the vendor confirmed.
    triggers: []
  - type: special_production_started
    target: special_orders
    mutation: {transition: {from: vendor_confirmed, to: in_production}}
    meaning: The vendor starts making the item.
    grain: one row per transaction
    fields:
      status: Set to in_production.
      production_started_date: Date production started.
    triggers: []
  - type: special_shipped
    target: special_orders
    mutation: {transition: [{from: vendor_confirmed, to: shipped}, {from: in_production, to: shipped}]}
    meaning: The vendor ships the item to the store or the customer.
    grain: one row per transaction
    fields:
      status: Set to shipped.
      shipped_date: Date shipped.
    triggers: []
  - type: special_ready
    target: special_orders
    mutation: {transition: {from: shipped, to: ready}}
    meaning: The item is received, inspected where required, and ready for pickup or delivery.
    grain: one row per transaction
    fields:
      status: Set to ready.
      ready_date: Date the item became ready.
    triggers: []
  - type: special_completed
    target: special_orders
    mutation: {transition: {from: ready, to: completed}}
    meaning: The customer picks the item up or it is delivered.
    grain: one row per transaction
    fields:
      status: Set to completed.
      completed_date: Date of pickup or delivery.
    triggers: []
  - type: special_cancelled
    target: special_orders
    mutation: {transition: [{from: placed, to: cancelled}, {from: vendor_confirmed, to: cancelled}, {from: in_production, to: cancelled}, {from: ready, to: cancelled}]}
    meaning: The order is cancelled by the customer, for lack of vendor confirmation or supply, or as abandoned.
    grain: one row per transaction
    fields:
      status: Set to cancelled.
      cancelled_date: Date the cancellation took effect.
      cancellation_reason: Why the order was cancelled.
    triggers:
      - event: special:special_credit_applied
        map: {credit_type: order_cancellation, event_date: cancelled_date}
  - type: special_returned
    target: special_orders
    mutation: {transition: {from: completed, to: returned}}
    meaning: A returnable item is returned by the customer.
    grain: one row per transaction
    fields:
      status: Set to returned.
      returned_date: Date of the return.
    triggers:
      - event: special:special_credit_applied
        map: {credit_type: merchandise_return, event_date: returned_date}
  - type: special_estimate_revised
    target: special_orders
    mutation: update
    meaning: The vendor revises the estimated ready date.
    grain: one row per transaction
    fields:
      estimated_ready_date: New estimated ready date.
    triggers: []
  - type: special_template_recorded
    target: special_orders
    mutation: update
    meaning: The installer's on-site template for a fabricated item is recorded.
    grain: one row per transaction
    fields:
      template_completed: Whether the template is complete.
    triggers: []
  - type: special_order_billed
    target: special_order_events
    meaning: The order total is billed when the order is placed.
    grain: one row per order
    distinguish_by: [order_number]
    fields:
      order_number: Special order number.
      event_date: Date billed (the order date).
      amount: Order total, positive.
    account: order_balance
    direction: in
    triggers:
      - event: special:special_payment_received
        map: {event_date: event_date, payment_purpose: deposit, order_number: order_number}
  - type: special_payment_received
    target: special_order_events
    meaning: The customer pays a deposit or balance on the order.
    grain: one row per payment
    distinguish_by: [event_date, payment_purpose, payment_method, amount]
    fields:
      order_number: Special order number.
      event_date: Date of the payment.
      amount: Amount paid, positive.
      payment_method: Tender used.
      payment_purpose: What the payment is for.
    account: order_balance
    direction: out
    triggers:
      - event: card:card_purchase_posted
        when: {payment_method: ridgeline_consumer_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number, purchase_channel: special_order}
      - event: trade:trade_invoice_posted
        when: {payment_method: ridgeline_pro_credit}
        map: {transaction_date: event_date, invoice_date: event_date, amount: amount, purchase_channel: special_order}
  - type: special_fee_charged
    target: special_order_events
    meaning: A cancellation, abandonment, restocking, storage, delivery, delivery reschedule or failed delivery fee is charged.
    grain: one row per fee type per date
    distinguish_by: [fee_type, event_date]
    fields:
      order_number: Special order number.
      event_date: Date charged.
      fee_type: Which fee is charged.
      amount: Fee amount, positive.
      storage_days: Days of storage billed (storage fee only).
      special_request_id: The request the fee arises from, when any.
    account: order_balance
    direction: in
    triggers: []
  - type: special_credit_applied
    target: special_order_events
    meaning: A credit reduces what the customer owes — reversal of the order total on cancellation or return, damage allowance, delay credit or price adjustment.
    grain: one row per credit type per order
    distinguish_by: [credit_type, event_date]
    fields:
      order_number: Special order number.
      event_date: Date the credit posts.
      credit_type: Which credit is applied.
      amount: Credit amount, positive.
      special_request_id: The request the credit arises from, when any.
    account: order_balance
    direction: out
    triggers: []
  - type: special_refund_issued
    target: special_order_events
    meaning: Money paid on the order is refunded to the tender it was paid with.
    grain: one row per refunded payment
    distinguish_by: [original_event_id]
    fields:
      order_number: Special order number.
      event_date: Date the refund is issued.
      amount: Amount refunded, positive.
      refund_method: Tender refunded to (the original payment's tender).
      original_event_id: The special_payment_received row refunded.
    account: order_balance
    direction: in
    triggers:
      - event: card:card_return_credit_posted
        when: {refund_method: ridgeline_consumer_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number}
      - event: trade:trade_return_credit_posted
        when: {refund_method: ridgeline_pro_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number}
  - type: special_receipt_inspected
    target: special_order_events
    meaning: The store, or the customer at pickup or delivery, records the condition of the item received.
    grain: one row per inspection point (store receipt or customer handover)
    distinguish_by: [inspection_point]
    fields:
      order_number: Special order number.
      event_date: Date of the inspection or of the customer's damage report.
      amount: 0.00 — an inspection moves no money.
      inspection_point: Where the condition was recorded.
      inspection_condition: Condition found.
      special_request_id: The customer's damage claim, for a handover report.
    triggers: []

measures:
  - id: special_msr_net_paid
    window: Life of the order up to the frozen date.
    measure: Sum of special_payment_received amounts on the order minus special_refund_issued amounts.
  - id: special_msr_delay_days
    window: State of the order at the frozen date.
    measure: Calendar days by which estimated_ready_date (or ready_date once ready) is later than promised_ready_date; 0 when not later.
  - id: special_msr_storage_days
    window: From the day after ready_date plus pickup_hold_days to the earlier of the pickup or delivery date and the frozen date.
    measure: Calendar days of storage beyond the free hold period, excluding days an item linked to an installation contract is held for its installation date when linked_install_storage_free is true.

policies:
  - id: special_agg_multi_holding
    subject: [special_order_placed]
    rule: >-
      A customer may hold any number of special orders; each special order is one vendor item ordered for one customer.
      An order total below the program's order_min_usd is not placed.
    eligibility: []
    params:
      max_per_customer: null

  - id: special_agg_install_link
    subject: [special_order_placed, special_cancelled, special_fee_charged]
    rule: >-
      A special order may be linked to an installation contract as its materials only where installation_linked_allowed is true, and only to a contract of the same customer whose job address matches the delivery address.
      Where pro_measure_required is true, the order may be placed only when the customer holds an installation contract for the item at that address whose status is measured, contracted or scheduled, so that a Ridgeline installer's measurements exist; such an order records measured_by ridgeline_installer.
      When a linked installation contract is cancelled, the linked special order is not cancelled with it: it follows this charter's own cancellation rules from its own status, and an order already in production or shipped is completed to the customer.
      Home delivery charges are not billed on an order linked to an installation contract, because the installer receives the item at the job.
    eligibility:
      - id: measured_install_exists
        applies_to: [special_order_placed]
        kind: state
        condition: Where pro_measure_required is true, the order may be placed only when the customer holds an installation contract for the item at that address whose status is measured, contracted or scheduled, so that a Ridgeline installer's measurements exist; such an order records measured_by ridgeline_installer.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.status, install_contracts.job_address]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: linked_install_contract_id
        state_contract:
          field: install_contracts.status
          allowed: [measured, contracted, scheduled]

  - id: special_order_placement
    subject: [special_order_placed, special_order_billed, special_vendor_confirmed, special_production_started, special_shipped, special_template_recorded]
    rule: >-
      An order is placed for one vendor item at its quoted price; it is priced under a ProBuild volume pricing quote (pricing_basis pro_volume_quote with the pro_quote_id) only where pro_volume_quote_eligible is true, and otherwise at shelf_price.
      The promised_ready_date is the order_date plus lead_time_days_quoted calendar days and never moves; vendor revisions change only estimated_ready_date.
      The order total is billed on the order date, and the deposit under special_payments is taken at the same time.
      The vendor must confirm within vendor_confirmation_days days of the order date, failing which the order is cancelled with cancellation_reason vendor_unconfirmed and every payment is refunded.
      Where template_visit_required is true, production may start only after template_completed is true.
      A catalog item ships from vendor stock after confirmation and a made-to-order item ships after production; the vendor may ship part of an order ahead of the rest only where partial_shipment_allowed is true, and the order becomes ready only when every part has been received.
      An order may be changed without cancelling within order_modification_hours hours after order_placed_at and only while its status is placed; any later change is a cancellation under special_cancellation followed by a new order.
      An item remade because a Ridgeline installer's measurement was wrong is a new order with pricing_basis remake_no_charge and order_total 0.00, where ridgeline_measure_guarantee is true; an item made from the customer's own measurements is never remade at no charge.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Cut-to-Order Flooring: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Windows and Exterior Doors: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Semi-Custom Cabinetry: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Fabricated Countertops: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}

  - id: special_payments
    subject: [special_payment_received]
    rule: >-
      The deposit due at order is the greater of deposit_min_usd and deposit_pct percent of the order total, never more than the order total; the remaining balance is due before the item is released for pickup or delivery.
      Payments are accepted on orders whose status is placed, vendor_confirmed, in_production, shipped or ready.
      The tender must be one of payment_methods_accepted; a payment charged to a Ridgeline Consumer Credit account posts as a purchase on that account and one charged to a Ridgeline Pro Credit account posts as an invoice.
      A payment may not exceed the order's balance_due.
    eligibility:
      - id: payable_status
        applies_to: [special_payment_received]
        kind: state
        condition: Payments are accepted on orders whose status is placed, vendor_confirmed, in_production, shipped or ready.
        evidence_fields: [special_orders.special_order_id, special_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        state_contract:
          field: special_orders.status
          allowed: [placed, vendor_confirmed, in_production, shipped, ready]
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Fabricated Countertops: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
    formula:
      deposit_due: min(order_total, max(deposit_min_usd, round(order_total * deposit_pct / 100, 2)))

  - id: special_cancellation
    subject: [special_cancelled, special_fee_charged, special_credit_applied]
    rule: >-
      The customer may cancel an order whose status is placed or vendor_confirmed, by their own confirmation recorded first as a special_requests record of request_type cancellation; once production has started or the item has shipped the customer may not cancel when cancellable_after_production is false, except under special_vendor_delay.
      A cancellation made within free_cancellation_hours hours after order_placed_at (full 60-minute periods counted from the moment the order was placed; a cancellation at exactly that many hours still qualifies) carries no fee.
      A later cancellation carries a fee of cancellation_fee_pct_before_production percent of the order total, never less than cancellation_fee_min_usd, posted as fee_type cancellation_fee.
      No fee applies when vendor_change_free_cancel is true and the vendor changed the price, specification or lead time after the order, or when the cancellation is made by the system for lack of vendor confirmation or supply.
      On every cancellation the order total is reversed by a special_credit_applied row with credit_type order_cancellation, and special_msr_net_paid less the fee is refunded under special_refunds.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Fabricated Countertops: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
    formula:
      cancellation_fee: max(cancellation_fee_min_usd, round(order_total * cancellation_fee_pct_before_production / 100, 2))
      refund_due: max(0, special_msr_net_paid - cancellation_fee)
    measures: [special_msr_net_paid]

  - id: special_vendor_delay
    subject: [special_estimate_revised, special_cancelled, special_credit_applied]
    rule: >-
      When special_msr_delay_days is above vendor_delay_threshold_days, the customer may choose one delay remedy, never both.
      The first remedy is to cancel with no cancellation fee, from status placed or vendor_confirmed, and from in_production as well where delay_cancellation_in_production_allowed is true; the cancellation_reason is vendor_delay and every payment is refunded.
      The second remedy is to keep the order and receive a delay credit of delay_credit_pct percent of the order total, capped at delay_credit_max_usd, posted once as credit_type delay_credit; a program whose delay_credit_pct is 0 offers no delay credit.
      A customer who took the delay credit may not later cancel fee-free for the same delay, and a delay caused by the customer's own change to the order earns no remedy.
      An order already shipped earns only the delay credit.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Fabricated Countertops: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
    formula:
      delay_credit: min(delay_credit_max_usd, round(order_total * delay_credit_pct / 100, 2))
    measures: [special_msr_delay_days]

  - id: special_receipt_and_damage
    subject: [special_receipt_inspected, special_ready, special_credit_applied]
    rule: >-
      Where receipt_inspection_required is true the store inspects the item within receipt_inspection_days days of arrival and makes it ready only when the condition is good; an item found damaged or wrong at store receipt is reordered from the vendor at no charge and the estimated ready date is revised.
      Shipping damage found by the customer is covered only when it is reported within damage_report_hours hours after pickup or delivery, recorded as a special_receipt_inspected row at inspection_point customer_handover.
      Hours are counted as full 60-minute periods from the start of the completed_date (00:00 store local time) to the report; a report at exactly that many hours qualifies.
      For covered damage the customer chooses one remedy: a free reorder when reorder_for_damaged_free is true, with a new promised date reorder_lead_days_if_damaged days after the report, or, for cosmetic damage only and where damage_allowance_pct is above 0, keeping the item with an allowance of damage_allowance_pct percent of the order total as credit_type damage_allowance.
      Damage reported later, or caused after handover, is not covered.
    eligibility:
      - id: reported_in_time
        applies_to: [special_credit_applied]
        kind: time
        condition: Shipping damage found by the customer is covered only when it is reported within damage_report_hours hours after pickup or delivery, recorded as a special_receipt_inspected row at inspection_point customer_handover.
        evidence_fields: [special_orders.special_order_id, special_orders.completed_date, special_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: pickup or delivery
          anchor_source: special_orders.completed_date
          relation: not_after
          duration_source: variants.damage_report_hours
          unit: elapsed_hours
          counting_rule: Hours are counted as full 60-minute periods from the start of the completed_date (00:00 store local time) to the report; a report at exactly that many hours qualifies.
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Cut-to-Order Flooring: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Windows and Exterior Doors: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Semi-Custom Cabinetry: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Fabricated Countertops: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
    formula:
      damage_allowance: round(order_total * damage_allowance_pct / 100, 2)

  - id: special_pickup_storage_abandonment
    subject: [special_completed, special_fee_charged, special_cancelled]
    rule: >-
      A ready item is held free for pickup_hold_days days after ready_date; after that, where storage_fee_per_day_usd is above 0.00, storage is charged per day for special_msr_storage_days, never more than storage_fee_cap_usd in total, as fee_type storage_fee billed when the item leaves the store.
      An item linked to an installation contract is stored free until its installation date where linked_install_storage_free is true.
      The item is released only when balance_due, including storage, is 0.00.
      An item neither picked up nor delivered abandonment_days days after ready_date is treated as abandoned: the order is cancelled with cancellation_reason abandoned and an abandonment fee of abandonment_fee_pct percent of the order total is charged; the payments less the fee and any storage are refunded.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Cut-to-Order Flooring: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Windows and Exterior Doors: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Semi-Custom Cabinetry: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Fabricated Countertops: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
    formula:
      storage_fee: min(storage_fee_cap_usd, special_msr_storage_days * storage_fee_per_day_usd)
    measures: [special_msr_storage_days]

  - id: special_delivery
    subject: [special_fee_charged]
    rule: >-
      Home delivery is offered only where home_delivery_available is true; its charge is home_delivery_fee_usd, free when free_delivery_threshold_usd is above 0.00 and the order total is at or above it, billed as fee_type home_delivery_fee before release.
      A delivery may be moved free when the request is made at least delivery_reschedule_notice_hours hours before the delivery window; a later move incurs delivery_reschedule_fee_usd.
      A delivery that cannot be completed because no one is at the address incurs failed_delivery_fee_usd and is rebooked.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Fabricated Countertops: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}

  - id: special_returns
    subject: [special_returned, special_fee_charged, special_credit_applied]
    rule: >-
      Only an item whose program has returnable true may be returned; made-to-measure, cut-to-order, custom-built and fabricated items are never returnable except as damaged or wrong under special_receipt_and_damage.
      The return must be made no later than return_window_days calendar days after pickup or delivery.
      Days are counted as calendar days from completed_date as day 0 to the return date; a return on the last day qualifies.
      Where return_requires_original_packaging is true the item must be unused in its original packaging.
      A restocking fee of restocking_fee_pct percent of the order total, never less than restocking_fee_min_usd, is charged as fee_type restocking_fee, except when restocking_fee_waived_if_defective is true and the item is returned as defective or wrong, and except where pro_restocking_waiver_eligible is true and the customer's ProBuild membership is active at a tier whose special_order_restocking_waived is true.
      The order total is reversed as credit_type merchandise_return and the payments less the restocking fee are refunded under special_refunds; the return takes effect on the customer's own confirmation.
    eligibility:
      - id: in_return_window
        applies_to: [special_returned]
        kind: time
        condition: The return must be made no later than return_window_days calendar days after pickup or delivery.
        evidence_fields: [special_orders.special_order_id, special_orders.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: pickup or delivery
          anchor_source: special_orders.completed_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from completed_date as day 0 to the return date; a return on the last day qualifies.
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Cut-to-Order Flooring: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Windows and Exterior Doors: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Semi-Custom Cabinetry: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Fabricated Countertops: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
    formula:
      restocking_fee: max(restocking_fee_min_usd, round(order_total * restocking_fee_pct / 100, 2))

  - id: special_price_protection
    subject: [special_credit_applied]
    rule: >-
      Where price_protection_days is above 0, a lower vendor price on the same item offered by Ridgeline within price_protection_days calendar days after the order date is credited as the difference, once, as credit_type price_adjustment, provided the order has not been cancelled or returned; the customer must ask for it, and an order priced under a ProBuild volume quote earns no price adjustment.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Cut-to-Order Flooring: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Windows and Exterior Doors: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Semi-Custom Cabinetry: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Fabricated Countertops: {price_protection_days: "=price_protection_days"}

  - id: special_refunds
    subject: [special_refund_issued]
    rule: >-
      Every refund goes back to the tender of the payment it refunds and references that special_payment_received row in original_event_id; a refund never exceeds the payment it references, and when a refund spans several payments the most recent are refunded first.
      Refunds are issued only on orders whose status is cancelled, returned or completed.
      A payment row is refunded at most once.
    eligibility:
      - id: refundable_status
        applies_to: [special_refund_issued]
        kind: state
        condition: Refunds are issued only on orders whose status is cancelled, returned or completed.
        evidence_fields: [special_orders.special_order_id, special_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        state_contract:
          field: special_orders.status
          allowed: [cancelled, returned, completed]
      - id: refund_once
        applies_to: [special_refund_issued]
        kind: dedup
        condition: A payment row is refunded at most once.
        evidence_fields: [special_order_events.original_event_id, special_order_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_order_events.original_event_id]
          action_bindings:
            special_order_events.original_event_id: original_event_id
        dedup_contract:
          table: special_order_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [special_refund_issued]}
          distinct_fields: []
