events:
  - type: trade_application_submitted
    target: trade_accounts
    mutation: create
    meaning: A business credit application for one Pro Credit tier is submitted; the account exists in applied status until Commercial Credit decides.
    grain: one row per application (one account record)
    fields:
      customer_id: The pro customer profile of the applying business.
      variant_name: The tier applied for, as its official full name.
      status: Set to applied on creation.
      application_date: Date the application was submitted.
      personal_guarantee_on_file: Whether a principal signed a personal guarantee with the application.
    triggers: []
  - type: trade_account_approved
    target: trade_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: Commercial Credit approves the application and opens the account.
    grain: one row per transaction
    fields:
      status: Set to active.
      opened_date: Date the account opened.
      credit_limit: Credit line assigned.
      account_last4: Last four digits of the account number.
    triggers: []
  - type: trade_application_declined
    target: trade_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: Commercial Credit declines the application.
    grain: one row per transaction
    fields:
      status: Set to declined.
      closed_date: Date of the decline.
    triggers: []
  - type: trade_account_placed_on_hold
    target: trade_accounts
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Charging on the account is stopped for delinquency, an over-limit balance or a sister account's hold.
    grain: one row per transaction
    fields:
      status: Set to on_hold.
      hold_reason: Why the account was placed on hold.
    triggers: []
  - type: trade_account_released
    target: trade_accounts
    mutation: {transition: {from: on_hold, to: active}}
    meaning: Charging is restored after the hold condition clears.
    grain: one row per transaction
    fields:
      status: Set to active.
      hold_reason: Reset to none.
    triggers: []
  - type: trade_account_closed
    target: trade_accounts
    mutation: {transition: [{from: active, to: closed}, {from: on_hold, to: closed}]}
    meaning: The account is closed to new charges, on the business's confirmation or by Commercial Credit for inactivity.
    grain: one row per transaction
    fields:
      status: Set to closed.
      closed_date: Date the closure took effect.
    triggers: []
  - type: trade_account_charged_off
    target: trade_accounts
    mutation: {transition: {from: on_hold, to: charged_off}}
    meaning: The account is charged off and referred to collections.
    grain: one row per transaction
    fields:
      status: Set to charged_off.
      closed_date: Date of the charge-off.
    triggers:
      - event: pro:pro_suspended
        map: {suspension_reason: trade_charge_off, suspended_date: closed_date}
  - type: trade_credit_limit_changed
    target: trade_accounts
    mutation: update
    meaning: The credit line is changed.
    grain: one row per transaction
    fields:
      credit_limit: The new credit line.
      credit_limit_changed_date: Date the new line took effect.
    triggers: []
  - type: trade_tax_exemption_updated
    target: trade_accounts
    mutation: update
    meaning: A sales tax exemption certificate is placed on file, renewed or removed.
    grain: one row per transaction
    fields:
      tax_exempt_certificate_number: Certificate number exactly as printed; empty when removed.
      tax_exempt_effective_date: First date the certificate is valid.
      tax_exempt_expiry_date: Last date the certificate is valid.
    triggers: []
  - type: trade_account_settings_updated
    target: trade_accounts
    mutation: update
    meaning: The business changes its purchase order requirement or its number of authorized buyers.
    grain: one row per transaction
    fields:
      po_required: Whether every invoice must carry a purchase order number.
      authorized_buyer_count: Number of authorized buyers after the change.
    triggers: []
  - type: trade_statement_issued
    target: trade_transactions
    meaning: A monthly account statement closes, fixing the balance, past-due amount and delinquency of the period.
    grain: one row per account per statement period
    distinguish_by: [statement_period]
    fields:
      statement_period: Billing period the statement closes (YYYY-MM).
      statement_date: Closing date of the statement.
      due_date: Payment due date of a revolving statement; empty on a pay-in-full account.
      statement_balance: Balance on the statement.
      minimum_payment_due: Minimum payment due (the full balance on a pay-in-full account).
      past_due_amount: Amount past due as of the statement date.
      days_past_due: Days the oldest unpaid invoice or minimum is past due as of the statement date.
      transaction_date: Same as statement_date.
      amount: 0.00 — a statement moves no money.
    triggers: []
  - type: trade_invoice_posted
    target: trade_transactions
    meaning: A purchase charged to the account is invoiced.
    grain: one row per invoice
    distinguish_by: [invoice_number]
    fields:
      transaction_date: Posting date (same as invoice_date).
      invoice_number: Invoice number exactly as printed.
      invoice_date: Date of the invoice.
      due_date: Due date of the invoice.
      amount: Invoice total including sales tax, positive.
      merchandise_amount: Invoice amount before sales tax.
      sales_tax_amount: Sales tax charged on the invoice.
      job_name: Job name the invoice is tracked under.
      po_number: Purchase order number on the invoice.
      pricing_basis: How the invoice was priced.
      pro_quote_id: The ProBuild volume pricing quote applied, when pricing_basis is pro_volume_quote.
      purchase_channel: Where the purchase was made.
      statement_period: Statement period the invoice falls in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_payment_received
    target: trade_transactions
    meaning: A payment from the business is credited and applied to one invoice (or held on account).
    grain: one row per payment per invoice it is applied to
    distinguish_by: [payment_reference, applied_invoice_number]
    fields:
      transaction_date: Date the payment is credited.
      amount: Amount applied to this invoice (or held on account), positive.
      payment_method: How the payment was made.
      payment_reference: Check number, ACH trace or confirmation reference of the payment exactly as given.
      applied_invoice_number: Invoice the amount is applied to; empty when held on account.
      statement_period: Statement period the payment is credited in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_payment_returned
    target: trade_transactions
    meaning: A payment is returned unpaid by the business's bank and added back.
    grain: one row per returned payment line
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the return posts.
      amount: Amount returned, positive.
      original_transaction_id: The trade_payment_received row returned.
      return_reason: Reason given by the bank.
      statement_period: Statement period the return posts in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_fee_assessed
    target: trade_transactions
    meaning: A late fee, late payment charge, returned payment fee, bank card surcharge or prompt-payment discount recapture is charged.
    grain: one row per fee per fee type per originating statement or payment
    distinguish_by: [fee_type, statement_period, original_transaction_id]
    fields:
      transaction_date: Date the fee posts.
      amount: Fee amount, positive.
      fee_type: Which fee is charged.
      original_transaction_id: The statement row (late fee, late payment charge), payment row (returned payment fee, surcharge) or discount row (discount recapture) the fee arises from.
      statement_period: Statement period the fee relates to (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_interest_charged
    target: trade_transactions
    meaning: Interest on a carried revolving balance is charged for a statement period.
    grain: one row per account per statement period
    distinguish_by: [statement_period]
    fields:
      transaction_date: Date the interest posts (statement date).
      amount: Interest amount, positive.
      statement_period: Statement period charged (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_early_pay_discount_applied
    target: trade_transactions
    meaning: A prompt-payment discount is credited to an invoice paid in full within the discount days.
    grain: one row per invoice
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the discount posts (the date of the payment that settled the invoice).
      amount: Discount amount, positive.
      original_transaction_id: The trade_invoice_posted row discounted.
      invoice_number: Invoice number discounted.
      statement_period: Statement period the discount posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_tax_credit_posted
    target: trade_transactions
    meaning: Sales tax charged on a purchase that was exempt is credited back.
    grain: one row per invoice
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the credit posts.
      amount: Sales tax credited, positive.
      original_transaction_id: The trade_invoice_posted row whose tax is credited.
      invoice_number: Invoice number credited.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_return_credit_posted
    target: trade_transactions
    meaning: A refund for returned merchandise, a cancelled order or a refunded service charged to the account is credited to the originating invoice.
    grain: one row per refund per original invoice
    distinguish_by: [original_transaction_id, merchant_reference]
    fields:
      transaction_date: Date the credit posts.
      amount: Credit amount, positive.
      original_transaction_id: The trade_invoice_posted row credited.
      invoice_number: Invoice number credited.
      merchant_reference: Return receipt, order, contract or agreement number of the refund.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_fee_waived
    target: trade_transactions
    meaning: A correctly charged late fee or late payment charge is waived as a courtesy.
    grain: one row per waived charge
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the waiver posts.
      amount: Amount waived (the full charge), positive.
      original_transaction_id: The trade_fee_assessed row waived.
      statement_period: Statement period the waiver posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_fee_reversed
    target: trade_transactions
    meaning: A fee that should not have been charged is reversed in full as a correction.
    grain: one row per reversed fee
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the reversal posts.
      amount: Amount reversed (the full fee), positive.
      original_transaction_id: The trade_fee_assessed row reversed.
      reversal_reason: Why the fee is reversed.
      statement_period: Statement period the reversal posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_dispute_credit_posted
    target: trade_transactions
    meaning: An invoice dispute resolved in the business's favor credits the disputed amount.
    grain: one row per resolved dispute
    distinguish_by: [original_transaction_id, trade_request_id]
    fields:
      transaction_date: Date the credit posts.
      amount: Disputed amount credited, positive.
      original_transaction_id: The disputed trade_invoice_posted row.
      invoice_number: Invoice number disputed.
      trade_request_id: The invoice dispute request.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_credit_balance_refunded
    target: trade_transactions
    meaning: A credit balance on the account is paid back to the business.
    grain: one row per credit balance refund
    distinguish_by: [transaction_date, amount]
    fields:
      transaction_date: Date the refund is issued.
      amount: Refunded credit balance, positive.
      statement_period: Statement period the refund posts in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []

measures:
  - id: trade_msr_invoice_open_balance
    window: Life of one invoice up to the frozen date.
    measure: The invoice's amount minus every trade_payment_received amount applied to its invoice_number (less any of those returned), and minus every trade_early_pay_discount_applied, trade_tax_credit_posted, trade_return_credit_posted and trade_dispute_credit_posted row referencing it.
  - id: trade_msr_past_due_invoice_balance
    window: Invoices on the account as of the statement date (or frozen date) being decided.
    measure: Sum of trade_msr_invoice_open_balance over invoices whose due_date plus late_charge_grace_days is before that date, excluding invoices under an open invoice dispute when dispute_holds_late_charge is true.
  - id: trade_msr_courtesy_waivers_12_months
    window: Rolling 12 calendar months ending on the date of the request (frozen date), by transaction_date.
    measure: Count of trade_fee_waived rows on the account in the window.
  - id: trade_msr_negative_history
    window: The cli_clean_history_months calendar months ending on the date of the request (frozen date).
    measure: Count of trade_fee_assessed rows with fee_type late_fee or late_payment_charge not reversed as posting_error, plus statements showing days_past_due at or above on_hold_days_past_due, in the window.
  - id: trade_msr_other_open_credit_limits
    window: Portfolio state at the moment of the decision.
    measure: Sum of credit_limit over the customer's other trade_accounts (the account being decided excluded) whose status is active or on_hold.
  - id: trade_msr_months_since_activity
    window: From the latest trade_invoice_posted or trade_payment_received transaction_date on the account to the frozen date.
    measure: Whole calendar months since the account's last invoice or payment.

policies:
  - id: trade_agg_multi_holding
    subject: [trade_application_submitted]
    rule: >-
      A business may hold at most two Ridgeline Pro Credit accounts at a time: at most one revolving account (Pro Revolving Charge or Pro Revolving Charge Plus) and at most one pay-in-full commercial account (any Commercial Account tier).
      Pro Credit accounts are opened only for pro customer profiles; a consumer profile applies for Ridgeline Consumer Credit instead.
      An account counts toward the limit while its status is applied, active or on_hold.
      A business may not apply for a revolving account while another revolving account in its name is applied, active or on_hold, and may not apply for a commercial account while another commercial account in its name is applied, active or on_hold.
      No Pro Credit account in the business's name may be in charged_off status when a new application is submitted.
    eligibility:
      - id: one_per_kind
        applies_to: [trade_application_submitted]
        kind: dedup
        condition: A business may not apply for a revolving account while another revolving account in its name is applied, active or on_hold, and may not apply for a commercial account while another commercial account in its name is applied, active or on_hold.
        evidence_fields: [trade_accounts.customer_id, trade_accounts.variant_name, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.customer_id]
          action_bindings:
            trade_accounts.customer_id: customer_id
        dedup_contract:
          table: trade_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, on_hold]}
          distinct_fields: [variant_name]
      - id: pro_profile
        applies_to: [trade_application_submitted]
        kind: state
        condition: Pro Credit accounts are opened only for pro customer profiles; a consumer profile applies for Ridgeline Consumer Credit instead.
        evidence_fields: [customers.customer_id, customers.customer_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        state_contract:
          field: customers.customer_type
          allowed: [pro]
      - id: no_charge_off
        applies_to: [trade_application_submitted]
        kind: state
        condition: No Pro Credit account in the business's name may be in charged_off status when a new application is submitted.
        evidence_fields: [trade_accounts.customer_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.customer_id]
          action_bindings:
            trade_accounts.customer_id: customer_id
        state_contract:
          field: trade_accounts.status
          allowed: [applied, active, on_hold, closed, declined]
    params:
      max_per_customer: 2
      max_revolving_per_customer: 1
      max_commercial_per_customer: 1

  - id: trade_agg_relationship
    subject: [trade_account_approved, trade_credit_limit_changed, trade_account_placed_on_hold, trade_account_released]
    rule: >-
      The two Pro Credit accounts of one business are managed as one credit relationship.
      The sum of credit_limit over the business's accounts whose status is active or on_hold may not exceed relationship_exposure_cap_usd; an approval or increase that would exceed it is reduced to the cap minus trade_msr_other_open_credit_limits, rounded down to cli_rounding_increment_usd, and is not granted when the reduced line is below the tier's credit_line_min_usd.
      Cross-default: when either account of the business is placed on hold for delinquency or over-limit, its other active account is placed on hold the same day with hold_reason sister_account_hold.
      An account on hold for sister_account_hold is released the same day the sister account is released, and is never released while the sister account remains on hold.
    eligibility: []
    params:
      relationship_exposure_cap_usd: 1250000.00
    formula:
      headroom_usd: relationship_exposure_cap_usd - trade_msr_other_open_credit_limits
    measures: [trade_msr_other_open_credit_limits]

  - id: trade_application_decision
    subject: [trade_application_submitted, trade_account_approved, trade_application_declined]
    rule: >-
      An application names one tier and is approved only when the business meets every entry_gate value of that tier — years in business at or above min_years_in_business, a business credit score at or above min_business_credit_score and annual revenue at or above min_annual_revenue_usd — and, where personal_guarantee_required is true, a principal's personal guarantee is on file.
      Otherwise it is declined; a lower tier is never substituted on the same application.
      On approval Commercial Credit assigns a line between the tier's credit_line_min_usd and credit_line_max_usd, subject to trade_agg_relationship.
      Approval and decline are Commercial Credit decisions recorded by the system; Customer Care may submit an application but never decides one.
    eligibility: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Pro Revolving Charge Plus: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 30: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 30 Select: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 45: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}

  - id: trade_evt_invoicing
    subject: [trade_invoice_posted, trade_statement_issued, trade_interest_charged]
    rule: >-
      Every purchase charged to a Pro Credit account is invoiced separately; a commercial account invoice is due payment_terms_days calendar days after its invoice_date, and a revolving account's invoices are billed together on the monthly statement, due statement_due_offset_days after the statement date.
      When po_required is true on the account, a purchase without a purchase order number is not charged to the account; job names are limited to job_name_max_active active names.
      A purchase is invoiced tax-exempt only when a valid exemption certificate is on file for the invoice date; otherwise sales tax is charged and may later be credited under trade_evt_tax_exempt_credit.
      A charge is authorized only while the account status is active and the new balance stays within the credit line plus overlimit_tolerance_pct percent.
      pricing_basis records how each invoice was priced: shelf_price, pro_volume_quote with the pro_quote_id of the ProBuild quote applied, or contract_price for prices fixed in an installation or special order agreement.
      A revolving statement's minimum payment due is the full balance when below min_payment_floor_usd, and otherwise the greater of min_payment_floor_usd and min_payment_pct_of_balance percent of the balance; a pay-in-full statement's minimum is its full balance (min_payment_pct_of_balance of 100).
      Interest is charged only on a revolving account, on the carried balance at purchase_apr_pct divided by interest_day_count_basis per day, not when the previous statement balance was paid in full within grace_period_days, and never less than min_interest_charge_usd when above zero.
    eligibility: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Pro Revolving Charge Plus: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 30: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 30 Select: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 45: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 60 Enterprise: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
    formula:
      daily_periodic_rate: purchase_apr_pct / 100 / interest_day_count_basis

  - id: trade_evt_payment_application
    subject: [trade_payment_received, trade_fee_assessed]
    rule: >-
      A payment received by payment_cutoff_time_et Eastern Time on a business day is credited that day, and otherwise on the next business day.
      The payment method must be one of the tier's payment_methods_accepted.
      An owner, principal or authorized buyer of the business must authorize the debit before a phone payment is posted.
      Payments are accepted on accounts whose status is active, on_hold, closed or charged_off.
      A payment is applied first to the invoices the business names in its remittance, up to each invoice's trade_msr_invoice_open_balance; any amount not directed by the remittance goes to the oldest past-due invoice first and then to the oldest open invoice by invoice_date; whatever remains after every open invoice is settled is held on account with an empty applied_invoice_number.
      Each invoice the payment touches is recorded as its own trade_payment_received row under the same payment_reference.
      A payment made with a third-party bank card incurs a surcharge of bank_card_surcharge_pct percent of the payment, posted as a trade_fee_assessed row with fee_type card_payment_surcharge referencing the first payment row; no surcharge is charged on a tier whose rate is 0.
    eligibility:
      - id: debit_authorized
        applies_to: [trade_payment_received]
        kind: authorization
        condition: An owner, principal or authorized buyer of the business must authorize the debit before a phone payment is posted.
        evidence_fields: [trade_accounts.trade_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
      - id: payable_status
        applies_to: [trade_payment_received]
        kind: state
        condition: Payments are accepted on accounts whose status is active, on_hold, closed or charged_off.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active, on_hold, closed, charged_off]
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Pro Revolving Charge Plus: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 30: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 30 Select: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 45: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 60 Enterprise: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
    formula:
      surcharge: round(amount * bank_card_surcharge_pct / 100, 2)
    measures: [trade_msr_invoice_open_balance]

  - id: trade_evt_early_pay_discount
    subject: [trade_early_pay_discount_applied]
    rule: >-
      On a tier whose early_pay_discount_days is above 0, an invoice paid in full earns a prompt-payment discount of early_pay_discount_pct percent of its merchandise_amount, and of its sales tax as well only when early_pay_discount_on_tax is true, rounded to the nearest cent.
      The invoice must be paid in full no later than early_pay_discount_days calendar days after the invoice date.
      Days are counted as calendar days from the invoice_date as day 0 to the transaction_date of the payment that brings the invoice's open balance to the discounted amount; payment on the last day of the window qualifies.
      Paid in full means the payments applied to the invoice equal its amount less the discount, so the discount and those payments together settle the invoice.
      The prompt-payment discount and ProBuild volume pricing are mutually exclusive: when early_pay_discount_excludes_quote_pricing is true, an invoice whose pricing_basis is pro_volume_quote earns no discount.
      When early_pay_requires_no_past_due is true, the discount is earned only when no other invoice on the account was past due on the payment date.
      An invoice receives at most one prompt-payment discount, and a discount already posted is not lost when a later invoice goes past due; it is recaptured only when the payment that earned it is returned.
    eligibility:
      - id: paid_in_window
        applies_to: [trade_early_pay_discount_applied]
        kind: time
        condition: The invoice must be paid in full no later than early_pay_discount_days calendar days after the invoice date.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.invoice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: trade_transactions.invoice_date
          relation: not_after
          duration_source: variants.early_pay_discount_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the invoice_date as day 0 to the transaction_date of the payment that brings the invoice's open balance to the discounted amount; payment on the last day of the window qualifies.
          boundary: inclusive
      - id: one_discount_per_invoice
        applies_to: [trade_early_pay_discount_applied]
        kind: dedup
        condition: An invoice receives at most one prompt-payment discount, and a discount already posted is not lost when a later invoice goes past due; it is recaptured only when the payment that earned it is returned.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_early_pay_discount_applied]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Pro Revolving Charge Plus: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 30: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 30 Select: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 45: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 60 Enterprise: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
    formula:
      when_not: pricing_basis == "pro_volume_quote" and early_pay_discount_excludes_quote_pricing
      discount: round((merchandise_amount + (sales_tax_amount if early_pay_discount_on_tax else 0)) * early_pay_discount_pct / 100, 2)
      payment_to_settle: amount - discount

  - id: trade_evt_late_charges
    subject: [trade_fee_assessed]
    rule: >-
      On a revolving account a late fee (fee_type late_fee) of late_fee_usd posts on the day after a statement due date when the payments credited from the statement date through the due date total less than that statement's minimum_payment_due.
      On a pay-in-full account a late payment charge (fee_type late_payment_charge) posts on each statement date when trade_msr_past_due_invoice_balance is above zero: late_charge_monthly_pct percent of that balance, rounded to the nearest cent, and never less than late_charge_min_usd.
      Both reference the statement row in original_transaction_id and carry its statement_period.
      At most one late fee or late payment charge is charged for any one statement period.
      An invoice under an open dispute is left out of the past-due balance while dispute_holds_late_charge is true.
    eligibility:
      - id: one_per_period
        applies_to: [trade_fee_assessed]
        kind: dedup
        condition: At most one late fee or late payment charge is charged for any one statement period.
        evidence_fields: [trade_transactions.trade_account_id, trade_transactions.statement_period, trade_transactions.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_account_id, trade_transactions.statement_period]
          action_bindings:
            trade_transactions.trade_account_id: trade_account_id
            trade_transactions.statement_period: statement_period
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {trade_account_id: trade_account_id, statement_period: statement_period}
          duplicate_filters: {fee_type: [late_fee, late_payment_charge]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Pro Revolving Charge Plus: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 30: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 30 Select: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 45: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 60 Enterprise: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
    formula:
      when: revolving_balance_allowed == false
      late_payment_charge: max(late_charge_min_usd, round(trade_msr_past_due_invoice_balance * late_charge_monthly_pct / 100, 2))
    measures: [trade_msr_past_due_invoice_balance]

  - id: trade_evt_returned_payment
    subject: [trade_payment_returned, trade_fee_assessed]
    rule: >-
      When the business's bank returns a payment unpaid, every trade_payment_received row of that payment is added back as its own trade_payment_returned row referencing it, and the invoices it had settled reopen.
      A prompt-payment discount earned by a returned payment is recaptured by a trade_fee_assessed row with fee_type discount_recapture for the full discount, referencing the trade_early_pay_discount_applied row; a replacement payment does not re-earn the discount.
      A payment line that already has a trade_payment_returned row cannot be returned again.
      One returned payment fee (fee_type returned_payment_fee) of returned_payment_fee_usd is charged per returned payment, referencing its first returned line.
    eligibility:
      - id: return_once
        applies_to: [trade_payment_returned]
        kind: dedup
        condition: A payment line that already has a trade_payment_returned row cannot be returned again.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_payment_returned]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Pro Revolving Charge Plus: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 30: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 30 Select: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 45: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {returned_payment_fee_usd: "=returned_payment_fee_usd"}

  - id: trade_evt_tax_exempt_credit
    subject: [trade_tax_credit_posted]
    rule: >-
      Sales tax charged on an invoice is credited back in full when the purchase was exempt: the account had an exemption certificate whose tax_exempt_effective_date is on or before the invoice_date and whose tax_exempt_expiry_date is on or after the invoice_date, and tax_exempt_purchases_allowed is true.
      A certificate placed on file after the purchase covers that purchase only when its effective date is on or before the invoice_date; a certificate that took effect later never covers it.
      The credit must be requested no later than tax_credit_lookback_days calendar days after the invoice date.
      Days are counted as calendar days from the invoice_date as day 0 to the date of the request; a request on the last day qualifies and a later one does not.
      The credit equals the invoice's sales_tax_amount less any part of that tax already credited by a return credit, and an invoice receives at most one tax credit.
    eligibility:
      - id: request_in_lookback
        applies_to: [trade_tax_credit_posted]
        kind: time
        condition: The credit must be requested no later than tax_credit_lookback_days calendar days after the invoice date.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.invoice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: trade_transactions.invoice_date
          relation: not_after
          duration_source: variants.tax_credit_lookback_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the invoice_date as day 0 to the date of the request; a request on the last day qualifies and a later one does not.
          boundary: inclusive
      - id: one_tax_credit
        applies_to: [trade_tax_credit_posted]
        kind: dedup
        condition: The credit equals the invoice's sales_tax_amount less any part of that tax already credited by a return credit, and an invoice receives at most one tax credit.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_tax_credit_posted]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Pro Revolving Charge Plus: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 30: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 30 Select: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 45: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 60 Enterprise: {tax_credit_lookback_days: "=tax_credit_lookback_days"}

  - id: trade_evt_return_credit
    subject: [trade_return_credit_posted, trade_credit_balance_refunded]
    rule: >-
      A refund for merchandise, an order, a service or a rental that was charged to a Pro Credit account is credited to the same account against the invoice that charged it, referencing that invoice row in original_transaction_id and its invoice_number; it is never paid out in cash and never moved to another account.
      The amount is the refund decided under the selling program's own rules, and the credits referencing one invoice may never total more than that invoice's amount.
      A return credit is accepted on accounts whose status is active, on_hold, closed or charged_off.
      A credit against an invoice that is still open reduces that invoice's open balance; a credit against an invoice already paid leaves a credit on account that the next payment application absorbs.
      When the account carries a credit balance above credit_balance_refund_threshold_usd, an owner or principal may ask for it to be refunded in full as one trade_credit_balance_refunded row; a credit balance at or below the threshold stays on the account.
    eligibility:
      - id: creditable_status
        applies_to: [trade_return_credit_posted]
        kind: state
        condition: A return credit is accepted on accounts whose status is active, on_hold, closed or charged_off.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active, on_hold, closed, charged_off]
      - id: refund_requested
        applies_to: [trade_credit_balance_refunded]
        kind: caller_fact
        condition: When the account carries a credit balance above credit_balance_refund_threshold_usd, an owner or principal may ask for it to be refunded in full as one trade_credit_balance_refunded row; a credit balance at or below the threshold stays on the account.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.current_balance]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id

  - id: trade_evt_courtesy_waiver
    subject: [trade_fee_waived]
    rule: >-
      A correctly charged late fee or late payment charge may be waived in full as a courtesy at the request of an owner, principal or authorized buyer; returned payment fees, bank card surcharges and discount recaptures are never waived as a courtesy.
      The account status must be active at the time of the request.
      The waiver must be requested no more than courtesy_waiver_request_window_days calendar days after the charge was posted.
      Days are counted as calendar days from the charge's transaction_date as day 0 to the date of the request, and a request on the last day still qualifies.
      trade_msr_courtesy_waivers_12_months must be below courtesy_waiver_per_12_months, and a charge larger than courtesy_waiver_max_usd is not waivable in whole or in part.
      A charge that already has a trade_fee_waived or trade_fee_reversed row referencing it cannot be waived.
      When the charge is owed a correction under trade_evt_fee_correction, the correction applies instead and no courtesy waiver is used.
    eligibility:
      - id: active_account
        applies_to: [trade_fee_waived]
        kind: state
        condition: The account status must be active at the time of the request.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active]
      - id: request_window
        applies_to: [trade_fee_waived]
        kind: time
        condition: The waiver must be requested no more than courtesy_waiver_request_window_days calendar days after the charge was posted.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.transaction_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the charge was posted
          anchor_source: trade_transactions.transaction_date
          relation: not_after
          duration_source: variants.courtesy_waiver_request_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the charge's transaction_date as day 0 to the date of the request, and a request on the last day still qualifies.
          boundary: inclusive
      - id: not_already_waived
        applies_to: [trade_fee_waived]
        kind: dedup
        condition: A charge that already has a trade_fee_waived or trade_fee_reversed row referencing it cannot be waived.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_fee_waived, trade_fee_reversed]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Pro Revolving Charge Plus: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 30: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 30 Select: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 45: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
    formula:
      eligible: trade_msr_courtesy_waivers_12_months < courtesy_waiver_per_12_months and amount <= courtesy_waiver_max_usd
    measures: [trade_msr_courtesy_waivers_12_months]

  - id: trade_evt_fee_correction
    subject: [trade_fee_reversed]
    rule: >-
      A fee that should not have been charged is reversed in full by one trade_fee_reversed row referencing it.
      The reversal_reason is posting_error for a late fee whose minimum was in fact covered by the due date, a late payment charge computed on an invoice that was in fact paid by its due date plus late_charge_grace_days, a surcharge on a payment not made by bank card, or a returned payment fee on a payment not in fact returned; it is dispute_resolved for a late payment charge or late fee that arose solely from an invoice later resolved in the business's favor, reversed in full when the disputed invoice was the only past-due amount.
      A correction is owed regardless of tier, waiver history or how long ago the fee posted, and it does not use up a courtesy waiver.
      A fee row that already has a trade_fee_reversed or trade_fee_waived row referencing it cannot be reversed again.
    eligibility:
      - id: not_already_reversed
        applies_to: [trade_fee_reversed]
        kind: dedup
        condition: A fee row that already has a trade_fee_reversed or trade_fee_waived row referencing it cannot be reversed again.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_fee_reversed, trade_fee_waived]}
          distinct_fields: []

  - id: trade_evt_invoice_dispute
    subject: [trade_dispute_credit_posted]
    rule: >-
      An invoice dispute (wrong price, wrong quantity, merchandise not received, unauthorized buyer) is filed as a trade_requests record of request_type invoice_dispute naming the invoice row in disputed_transaction_id and the disputed_amount.
      It is accepted only when the dispute is filed no more than invoice_dispute_window_days calendar days after the invoice date.
      Days are counted as calendar days from the invoice_date as day 0 to the date the dispute is filed; filing on the last day is timely.
      It is resolved within dispute_resolution_max_days; while open, the disputed amount is left out of the past-due balance and of hold decisions when dispute_holds_late_charge is true, and the undisputed part of the invoice remains due on its due date.
      A dispute credit posts only when the invoice dispute request has status approved; it credits the disputed amount against the invoice, referencing the invoice row and the request.
      A pricing dispute on an invoice whose pricing_basis is pro_volume_quote is decided against the quoted prices of the referenced ProBuild quote, not shelf prices.
      One invoice receives at most one dispute credit.
    eligibility:
      - id: filed_in_window
        applies_to: [trade_dispute_credit_posted]
        kind: time
        condition: It is accepted only when the dispute is filed no more than invoice_dispute_window_days calendar days after the invoice date.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.invoice_date, trade_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: trade_transactions.invoice_date
          relation: not_after
          duration_source: variants.invoice_dispute_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the invoice_date as day 0 to the date the dispute is filed; filing on the last day is timely.
          boundary: inclusive
      - id: dispute_approved
        applies_to: [trade_dispute_credit_posted]
        kind: state
        condition: A dispute credit posts only when the invoice dispute request has status approved; it credits the disputed amount against the invoice, referencing the invoice row and the request.
        evidence_fields: [trade_requests.trade_request_id, trade_requests.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_requests.trade_request_id]
          action_bindings:
            trade_requests.trade_request_id: trade_request_id
        state_contract:
          field: trade_requests.status
          allowed: [approved]
      - id: one_dispute_credit
        applies_to: [trade_dispute_credit_posted]
        kind: dedup
        condition: One invoice receives at most one dispute credit.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_dispute_credit_posted]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Pro Revolving Charge Plus: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 30: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 30 Select: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 45: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 60 Enterprise: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}

  - id: trade_credit_line_increase
    subject: [trade_credit_limit_changed]
    rule: >-
      A credit line increase is decided only on a request from an owner or principal, recorded as a trade_requests record of request_type credit_limit_increase with the requested_credit_limit.
      The account status must be active when the increase is decided.
      The account must have been open for at least cli_min_months_on_book full calendar months since the account was opened.
      At least cli_cooldown_months full calendar months must have passed since the last credit line change, counted from credit_limit_changed_date; when credit_limit_changed_date is empty the cooldown is met.
      Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist.
      trade_msr_negative_history, counted over the cli_clean_history_months months before the request, must be zero.
      A requested line above cli_financials_threshold_usd is not decided by Customer Care: the request stays submitted for Commercial Credit underwriting and no line change is made.
      Otherwise the new line is the lowest of the requested_credit_limit, the current credit_limit increased by cli_max_increase_pct percent, the tier's credit_line_max_usd and the headroom under trade_agg_relationship, rounded down to cli_rounding_increment_usd; no increase is granted when that figure is not above the current line.
    eligibility:
      - id: active_account
        applies_to: [trade_credit_limit_changed]
        kind: state
        condition: The account status must be active when the increase is decided.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active]
      - id: tenure
        applies_to: [trade_credit_limit_changed]
        kind: time
        condition: The account must have been open for at least cli_min_months_on_book full calendar months since the account was opened.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account was opened
          anchor_source: trade_accounts.opened_date
          relation: not_before
          duration_source: variants.cli_min_months_on_book
          unit: calendar_months
          counting_rule: "Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist."
          boundary: inclusive
      - id: cooldown
        applies_to: [trade_credit_limit_changed]
        kind: time
        condition: At least cli_cooldown_months full calendar months must have passed since the last credit line change, counted from credit_limit_changed_date; when credit_limit_changed_date is empty the cooldown is met.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.credit_limit_changed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: since the last credit line change
          anchor_source: trade_accounts.credit_limit_changed_date
          relation: not_before
          duration_source: variants.cli_cooldown_months
          unit: calendar_months
          counting_rule: "Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist."
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Pro Revolving Charge Plus: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 30: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 30 Select: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 45: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
    formula:
      max_new_limit: min(credit_line_max_usd, round(credit_limit * (1 + cli_max_increase_pct / 100), 2), relationship_exposure_cap_usd - trade_msr_other_open_credit_limits)
    measures: [trade_msr_negative_history, trade_msr_other_open_credit_limits]

  - id: trade_account_standing
    subject: [trade_account_placed_on_hold, trade_account_released, trade_account_charged_off]
    rule: >-
      Account standing is changed only by the system from statement and balance records.
      An active account is placed on hold with hold_reason past_due when a statement shows days_past_due at or above on_hold_days_past_due, and with hold_reason over_limit when the balance exceeds the credit line by more than overlimit_tolerance_pct percent; sister-account holds follow trade_agg_relationship.
      An account on hold for past_due is released only when every past-due amount is paid (release_requires_full_past_due), and one on hold for over_limit when the balance is back within the credit line; a partial payment never releases a hold.
      An account on hold is charged off when a statement shows days_past_due at or above charge_off_days_past_due.
      Customer Care cannot release a hold early or reverse a charge-off; a payment that clears the past-due amount is credited and the release follows from the records.
    eligibility: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Pro Revolving Charge Plus: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 30: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 30 Select: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 45: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 60 Enterprise: {on_hold_days_past_due: "=on_hold_days_past_due"}

  - id: trade_account_closure
    subject: [trade_account_closed]
    rule: >-
      An owner or principal of the business may close a Pro Credit account, recorded as a trade_requests record of request_type account_closure; an authorized buyer may not.
      Closure takes effect only on the confirmation of an owner or principal of the business.
      When closure_requires_zero_balance is true the closure takes effect on the day the balance reaches 0.00 and new charges are stopped from the request date; when it is false the account closes on confirmation and the balance is repaid under the existing terms.
      Commercial Credit closes an account when trade_msr_months_since_activity reaches inactivity_closure_months.
      A closed account cannot be reopened; the business applies again under trade_agg_multi_holding.
    eligibility:
      - id: principal_confirms
        applies_to: [trade_account_closed]
        kind: authorization
        condition: Closure takes effect only on the confirmation of an owner or principal of the business.
        evidence_fields: [trade_requests.trade_request_id, trade_requests.trade_account_id, trade_requests.request_type]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [trade_requests.trade_account_id]
          action_bindings:
            trade_requests.trade_account_id: trade_account_id
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Pro Revolving Charge Plus: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 30: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 30 Select: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 45: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 60 Enterprise: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
    measures: [trade_msr_months_since_activity]

  - id: trade_account_settings
    subject: [trade_tax_exemption_updated, trade_account_settings_updated]
    rule: >-
      Only an owner or principal of the business may change the purchase order requirement, the number of authorized buyers or the tax exemption on file.
      Settings may be changed while the account status is active or on_hold.
      authorized_buyer_count may never exceed the tier's authorized_buyer_max, and po_required may be set to true only on a tier whose po_required_option is true.
      A tax exemption certificate is placed on file with its number exactly as printed, its effective date and its expiry date as stated on the certificate; an expired certificate is not placed on file, and a renewal replaces the earlier certificate's dates.
      Placing a certificate on file never changes invoices already posted; tax already charged is credited only under trade_evt_tax_exempt_credit.
    eligibility:
      - id: principal_instruction
        applies_to: [trade_tax_exemption_updated, trade_account_settings_updated]
        kind: authorization
        condition: Only an owner or principal of the business may change the purchase order requirement, the number of authorized buyers or the tax exemption on file.
        evidence_fields: [trade_accounts.trade_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
      - id: open_account
        applies_to: [trade_tax_exemption_updated, trade_account_settings_updated]
        kind: state
        condition: Settings may be changed while the account status is active or on_hold.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active, on_hold]
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Pro Revolving Charge Plus: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 30: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 30 Select: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 45: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 60 Enterprise: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
