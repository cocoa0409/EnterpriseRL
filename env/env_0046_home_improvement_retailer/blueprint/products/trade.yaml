# Ridgeline Pro Credit — business credit for contractors, remodelers, property managers and facility
# buyers: revolving pro charge accounts and pay-in-full commercial accounts billed by invoice.
category: trade
display_name: Ridgeline Pro Credit

binding:
  holding_table: trade_accounts
  event_tables: [trade_transactions]
  intake_tables: [trade_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: outstanding_balance}

lifecycle:
  states: [applied, active, on_hold, closed, declined, charged_off]
  transitions:
    - {from: applied, to: active, by: system, means: Commercial Credit approves the business application, assigns the credit line and opens the account.}
    - {from: applied, to: declined, by: system, means: Commercial Credit declines the business application.}
    - {from: active, to: on_hold, by: system, means: Charging is stopped because the account reached the on-hold days-past-due threshold, went over its line beyond tolerance, or a sister account of the same business went on hold.}
    - {from: on_hold, to: active, by: system, means: Charging is restored once every past-due amount is paid and the balance is back within the line.}
    - {from: active, to: closed, by: user, means: An owner or principal of the business confirms closure of the account.}
    - {from: on_hold, to: closed, by: user, means: An owner or principal confirms closure of an account that is on hold.}
    - {from: active, to: closed, by: system, means: Commercial Credit closes an account with no purchase or payment for the inactivity period.}
    - {from: on_hold, to: charged_off, by: system, means: The account is charged off at the charge-off days-past-due threshold and referred to collections.}

accounts:
  - key: outstanding_balance
    unit: USD
    meaning: Amount the business owes on the account — invoices, fees and returned payments in; payments, early-pay discounts, tax credits, return credits, fee waivers, corrections and dispute credits out.

parameter_schema:
  credit_line_min_usd: Lowest credit line assigned at this tier, USD.
  credit_line_max_usd: Highest credit line this tier can carry, including after an increase, USD.
  payment_terms_days: Days from the invoice date (commercial account) or statement date (revolving) to the due date, calendar days.
  revolving_balance_allowed: Whether the business may carry a balance from month to month by paying a minimum (true) or must pay every invoice in full by its due date (false), boolean.
  purchase_apr_pct: Annual percentage rate on a carried revolving balance; 0 on a pay-in-full account, percent per year.
  interest_day_count_basis: Days in the year used to turn the APR into a daily periodic rate, days.
  min_interest_charge_usd: Minimum interest charge when computed interest is above zero but below it; 0 means none, USD.
  grace_period_days: Days after the statement date by which paying the full statement balance avoids interest on a revolving account; 0 on a pay-in-full account, days.
  min_payment_pct_of_balance: Percentage of the statement balance due as the minimum payment; 100 means the full statement balance is due, percent.
  min_payment_floor_usd: Lowest minimum payment on a revolving statement whose balance is at or above it; 0 on a pay-in-full account, USD.
  statement_due_offset_days: Days from the revolving statement date to its payment due date; 0 on a pay-in-full account, whose invoices carry their own due dates, days.
  payment_cutoff_time_et: Eastern Time cutoff on a business day for a payment to be credited that day (HH:MM, 24-hour clock).
  late_fee_usd: Flat late fee on a revolving statement whose minimum was not paid by the due date; 0 on a pay-in-full account, USD.
  late_charge_monthly_pct: Monthly late payment charge on the past-due invoice balance of a pay-in-full account; 0 on a revolving account, percent per month.
  late_charge_min_usd: Minimum late payment charge on a statement that has a past-due invoice balance, USD.
  late_charge_grace_days: Days after an invoice's due date before it counts as past due for the late payment charge, calendar days.
  early_pay_discount_pct: Prompt-payment discount on an invoice paid in full within the discount days, percent of the invoice's merchandise amount.
  early_pay_discount_days: Days from the invoice date within which full payment earns the prompt-payment discount; 0 means no discount offered, calendar days.
  early_pay_discount_excludes_quote_pricing: Whether invoices priced under a ProBuild volume pricing quote are excluded from the prompt-payment discount, boolean.
  early_pay_discount_on_tax: Whether the prompt-payment discount is computed on the sales tax as well as the merchandise, boolean.
  early_pay_requires_no_past_due: Whether the prompt-payment discount is earned only when the account has no past-due invoice on the payment date, boolean.
  returned_payment_fee_usd: Fee charged when a payment is returned unpaid, USD.
  payment_methods_accepted: Payment methods accepted on the account (list drawn from ach, check, wire, bank_card, phone_ach).
  bank_card_surcharge_pct: Surcharge on a payment made with a third-party bank card, percent of the payment.
  on_hold_days_past_due: Days past due of the oldest unpaid invoice or minimum at which charging is stopped (account placed on hold), days.
  charge_off_days_past_due: Days past due at which the account is charged off, days.
  release_requires_full_past_due: Whether an on-hold account is released only when every past-due amount is paid (no partial release), boolean.
  overlimit_tolerance_pct: Percentage above the credit line the balance may reach before the account goes on hold, percent.
  authorized_buyer_max: Maximum number of authorized buyers (employees with purchasing authority) on the account, count.
  job_name_max_active: Maximum number of active job names under which invoices can be tracked, count.
  po_required_option: Whether the business may require a purchase order number on every invoice, boolean.
  tax_exempt_purchases_allowed: Whether purchases may be made tax-exempt with a valid exemption certificate on file, boolean.
  tax_credit_lookback_days: Days after the invoice date within which sales tax charged on an exempt purchase can be credited back, calendar days.
  invoice_dispute_window_days: Days after the invoice date within which an invoice may be disputed, calendar days.
  dispute_resolution_max_days: Maximum days from filing within which an invoice dispute is resolved, calendar days.
  dispute_holds_late_charge: Whether a disputed invoice is left out of the past-due balance for late charges and holds while the dispute is open, boolean.
  personal_guarantee_required: Whether a personal guarantee from a principal is required to open the account, boolean.
  cli_min_months_on_book: Full months the account must have been open before a credit line increase, months.
  cli_cooldown_months: Full months after the last credit line change before another increase, months.
  cli_max_increase_pct: Largest increase in one credit line increase as a percentage of the current line, percent.
  cli_financials_threshold_usd: Requested new line above which business financial statements are required and the request is referred to Commercial Credit underwriting, USD.
  cli_rounding_increment_usd: Increment to which a new credit line is rounded down, USD.
  cli_clean_history_months: Months before the request that must contain no late fee, late payment charge or hold, months.
  courtesy_waiver_per_12_months: Number of courtesy waivers of a late fee or late payment charge in any rolling 12 months, count.
  courtesy_waiver_max_usd: Largest single late fee or late payment charge that may be waived as a courtesy (larger charges are not waivable), USD.
  courtesy_waiver_request_window_days: Days after the charge posts during which a courtesy waiver may be requested, calendar days.
  inactivity_closure_months: Months with no purchase and no payment after which the account may be closed by Commercial Credit, months.
  closure_requires_zero_balance: Whether a closure request takes effect only once the balance is 0.00 (true) or immediately with the balance repaid under existing terms (false), boolean.
  credit_balance_refund_threshold_usd: Credit balance above which the business may ask for a refund of the credit balance, USD.

