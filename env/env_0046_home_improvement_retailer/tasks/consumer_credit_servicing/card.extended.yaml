events:
  - type: card_application_submitted
    target: card_accounts
    mutation: create
    meaning: An application for one consumer credit tier is submitted for the customer; the account record exists in applied status until the bank decides.
    grain: one row per application (one account record)
    fields:
      customer_id: The applicant's customer profile.
      variant_name: The tier applied for, as its official full name.
      status: Set to applied on creation.
      application_date: Date the application was submitted.
      autopay_enrolled: Whether autopay was chosen on the application.
      autopay_option: The autopay amount option chosen on the application, or none.
    triggers: []
  - type: card_account_approved
    target: card_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: The bank approves the application and opens the account with its credit line or loan amount.
    grain: one row per transaction
    fields:
      status: Set to active.
      opened_date: Date the account was opened.
      credit_limit: Credit line (revolving) or approved loan amount (Project Loan) assigned.
      account_last4: Last four digits of the new account number.
      statement_closing_day: Day of month on which statements close.
      draw_period_end_date: Last day purchases may be drawn on a Project Loan; empty for a revolving card.
    triggers: []
  - type: card_application_declined
    target: card_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: The bank declines the application.
    grain: one row per transaction
    fields:
      status: Set to declined.
      closed_date: Date of the decline.
    triggers: []
  - type: card_account_suspended
    target: card_accounts
    mutation: {transition: {from: active, to: suspended}}
    meaning: Charging or drawing privileges are suspended for delinquency.
    grain: one row per transaction
    fields:
      status: Set to suspended.
    triggers: []
  - type: card_account_reinstated
    target: card_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: Charging or drawing privileges are restored after the account is brought current and stays current.
    grain: one row per transaction
    fields:
      status: Set to active.
    triggers: []
  - type: card_account_closed
    target: card_accounts
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The account is closed to new purchases and draws, by the cardholder's confirmation or by the bank for inactivity or loan payoff.
    grain: one row per transaction
    fields:
      status: Set to closed.
      closed_date: Date the closure took effect.
    triggers: []
  - type: card_account_charged_off
    target: card_accounts
    mutation: {transition: {from: suspended, to: charged_off}}
    meaning: The bank charges off a seriously delinquent account.
    grain: one row per transaction
    fields:
      status: Set to charged_off.
      closed_date: Date of the charge-off.
    triggers: []
  - type: card_credit_limit_changed
    target: card_accounts
    mutation: update
    meaning: The credit line of a revolving card is changed.
    grain: one row per transaction
    fields:
      credit_limit: The new credit line.
      credit_limit_changed_date: Date the new line took effect.
    triggers: []
  - type: card_autopay_changed
    target: card_accounts
    mutation: update
    meaning: The cardholder enrolls in, changes or cancels automatic payments.
    grain: one row per transaction
    fields:
      autopay_enrolled: Whether autopay is on after the change.
      autopay_option: The autopay amount option after the change (none when cancelled).
      autopay_fixed_amount: The fixed draft amount when autopay_option is fixed_amount; 0.00 otherwise.
    triggers: []
  - type: card_authorized_users_changed
    target: card_accounts
    mutation: update
    meaning: The primary cardholder adds or removes authorized users.
    grain: one row per transaction
    fields:
      authorized_user_count: Number of authorized users on the account after the change.
    triggers: []
  - type: card_statement_issued
    target: card_transactions
    meaning: A monthly billing statement closes and is issued, fixing the balance, minimum payment, due date and delinquency of that period.
    grain: one row per account per statement period
    distinguish_by: [statement_period]
    fields:
      statement_period: Billing period the statement closes (YYYY-MM).
      statement_date: Closing date of the statement.
      due_date: Payment due date of the statement.
      statement_balance: New balance on the statement.
      minimum_payment_due: Minimum payment due by the due date.
      past_due_amount: Unpaid minimum from earlier statements included in the minimum.
      days_past_due: Days the account is past due as of the statement date.
      transaction_date: Same as statement_date.
      amount: 0.00 — a statement moves no money.
    triggers: []
  - type: card_purchase_posted
    target: card_transactions
    meaning: A purchase (revolving card) or draw (Project Loan) is charged to the account.
    grain: one row per charged purchase or draw, per receipt or order
    distinguish_by: [merchant_reference, transaction_date, plan_code]
    fields:
      transaction_date: Posting date of the purchase.
      amount: Amount charged, after any everyday discount, positive.
      plan_code: Financing plan the purchase carries.
      promo_end_date: Last day of the promotional period; empty for revolving_standard and loan_draw.
      merchant_reference: Receipt, order, contract or agreement number the purchase came from.
      purchase_channel: Where the purchase was made.
      statement_period: Statement period the purchase falls in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: card_payment_posted
    target: card_transactions
    meaning: A payment from the cardholder is credited to the account.
    grain: one row per payment credited
    distinguish_by: [transaction_date, amount, payment_channel, funding_account_last4]
    fields:
      transaction_date: Date the payment is credited (after cutoff and business-day rules).
      amount: Payment amount, positive.
      payment_channel: How the payment was made.
      funding_account_last4: Last four digits of the bank account the payment was drawn on.
      excess_allocation: Basis on which the amount above the minimum was allocated.
      statement_period: Statement period the payment is credited in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: card_payment_returned
    target: card_transactions
    meaning: A payment is returned unpaid by the cardholder's bank and its amount is added back to the balance.
    grain: one row per returned payment
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the return is posted.
      amount: Amount of the returned payment, positive.
      original_transaction_id: The card_payment_posted row being returned.
      return_reason: Reason given by the cardholder's bank.
      statement_period: Statement period the return posts in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: card_fee_assessed
    target: card_transactions
    meaning: A late fee, returned payment fee or phone payment fee is charged.
    grain: one row per fee charged, per fee type per originating statement or payment
    distinguish_by: [fee_type, statement_period, original_transaction_id]
    fields:
      transaction_date: Date the fee posts.
      amount: Fee amount, positive.
      fee_type: Which fee is charged.
      original_transaction_id: The statement row (late fee) or payment row (returned payment fee, phone payment fee) the fee arises from.
      statement_period: Statement period the fee relates to (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: card_interest_charged
    target: card_transactions
    meaning: Interest for a statement period, or deferred interest on an expired promotion, is charged.
    grain: one row per interest type per plan per statement period
    distinguish_by: [interest_type, statement_period, plan_code]
    fields:
      transaction_date: Date the interest posts (statement closing date).
      amount: Interest amount, positive.
      interest_type: Ordinary purchase interest or assessed deferred interest.
      plan_code: Balance the interest accrued on.
      statement_period: Statement period charged (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: card_return_credit_posted
    target: card_transactions
    meaning: A refund for returned merchandise, a cancelled order or a refunded service is credited back to the account that paid for it.
    grain: one row per refund credited, per original purchase per refund date
    distinguish_by: [original_transaction_id, merchant_reference, transaction_date]
    fields:
      transaction_date: Date the credit posts.
      amount: Credit amount, positive.
      original_transaction_id: The card_purchase_posted row being credited.
      merchant_reference: Receipt, order, contract or agreement number of the refund.
      plan_code: Plan of the original purchase.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: card_fee_reversed
    target: card_transactions
    meaning: A fee that should not have been charged is reversed in full as a correction.
    grain: one row per reversed fee
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the reversal posts.
      amount: Amount reversed (the full fee), positive.
      original_transaction_id: The card_fee_assessed row being reversed.
      reversal_reason: Why the fee is reversed.
      statement_period: Statement period the reversal posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: card_fee_waived
    target: card_transactions
    meaning: A correctly charged late fee is waived as a one-time courtesy.
    grain: one row per waived fee
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the waiver posts.
      amount: Amount waived (the full late fee), positive.
      original_transaction_id: The card_fee_assessed late fee row being waived.
      statement_period: Statement period the waiver posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: card_dispute_credit_posted
    target: card_transactions
    meaning: A billing error dispute resolved in the cardholder's favor credits the disputed amount and its interest.
    grain: one row per resolved dispute
    distinguish_by: [original_transaction_id, card_request_id]
    fields:
      transaction_date: Date the credit posts.
      amount: Disputed amount plus interest charged on it, positive.
      original_transaction_id: The disputed card_purchase_posted row.
      card_request_id: The billing dispute request.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: card_credit_balance_refunded
    target: card_transactions
    meaning: A credit balance on the account is paid back to the cardholder.
    grain: one row per credit balance refund
    distinguish_by: [transaction_date, amount]
    fields:
      transaction_date: Date the refund is issued.
      amount: Refunded credit balance, positive (it brings a negative balance back to zero).
      statement_period: Statement period the refund posts in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []

measures:
  - id: card_msr_late_fees_lookback_cycles
    window: The late_fee_repeat_lookback_cycles statement periods immediately before the statement period of the late fee being decided (that period itself excluded).
    measure: Count of card_fee_assessed rows with fee_type late_fee on the account in the window, excluding any that have a card_fee_reversed row with reversal_reason posting_error referencing them.
  - id: card_msr_late_fees_12_months
    window: Rolling 12 calendar months ending on the date of the request being decided (frozen date), by transaction_date.
    measure: Count of card_fee_assessed rows with fee_type late_fee on the account in the window, excluding those reversed with reversal_reason posting_error.
  - id: card_msr_late_fees_clean_history
    window: The cli_clean_history_months calendar months ending on the date of the request (frozen date), by transaction_date.
    measure: Count of card_fee_assessed rows with fee_type late_fee on the account in the window, excluding those reversed with reversal_reason posting_error.
  - id: card_msr_courtesy_waivers_12_months
    window: Rolling 12 calendar months ending on the date of the request (frozen date), by transaction_date.
    measure: Count of card_fee_waived rows on the account in the window.
  - id: card_msr_other_open_credit_limits
    window: Portfolio state at the moment of the decision.
    measure: Sum of credit_limit over the customer's other card_accounts (the account being decided excluded) whose status is active or suspended.
  - id: card_msr_ontime_payment_streak
    window: Statements issued after the most recent statement whose past_due_amount was above zero.
    measure: Number of consecutive statements, counted back from the latest, whose minimum_payment_due was covered by payments credited on or before their due_date.
  - id: card_msr_months_since_activity
    window: From the latest card_purchase_posted or card_payment_posted transaction_date on the account to the frozen date.
    measure: Whole calendar months elapsed since the account's last purchase or payment.

policies:
  - id: card_agg_multi_holding
    subject: [card_application_submitted]
    rule: >-
      A customer may hold at most two Ridgeline Consumer Credit accounts at a time, and never two of the same kind:
      at most one revolving card (Classic, Preferred or Premier) and at most one Project Loan (66, 78 or 84).
      An account counts toward the limit while its status is applied, active or suspended; closed, declined and charged-off accounts do not count.
      A customer may not apply for a revolving card while another revolving card in their name is applied, active or suspended, and may not apply for a Project Loan while another Project Loan in their name is applied, active or suspended.
      No account in the customer's name may be in charged_off status when a new application is submitted.
      Moving to a different revolving tier is never done by opening a second revolving card; a cardholder who wants a different revolving tier closes the current card first or keeps it.
    eligibility:
      - id: one_per_kind
        applies_to: [card_application_submitted]
        kind: dedup
        condition: A customer may not apply for a revolving card while another revolving card in their name is applied, active or suspended, and may not apply for a Project Loan while another Project Loan in their name is applied, active or suspended.
        evidence_fields: [card_accounts.customer_id, card_accounts.variant_name, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.customer_id]
          action_bindings:
            card_accounts.customer_id: customer_id
        dedup_contract:
          table: card_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, suspended]}
          distinct_fields: [variant_name]
      - id: no_charge_off
        applies_to: [card_application_submitted]
        kind: state
        condition: No account in the customer's name may be in charged_off status when a new application is submitted.
        evidence_fields: [card_accounts.customer_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.customer_id]
          action_bindings:
            card_accounts.customer_id: customer_id
        state_contract:
          field: card_accounts.status
          allowed: [applied, active, suspended, closed, declined]
    params:
      max_per_customer: 2
      max_revolving_per_customer: 1
      max_project_loans_per_customer: 1

  - id: card_agg_combined_exposure
    subject: [card_account_approved, card_credit_limit_changed]
    rule: >-
      The combined credit extended to one customer across all Ridgeline Consumer Credit accounts — the sum of credit_limit over every account in their name whose status is active or suspended — may not exceed combined_exposure_cap_usd.
      When an approval or a credit line increase would take the combined total above the cap, the new line is reduced to the cap minus card_msr_other_open_credit_limits, rounded down to the tier's cli_rounding_increment_usd.
      If that reduced figure is below the tier's credit_line_min_usd, an application is declined and an increase is not granted.
      Closed, declined and charged-off accounts never count toward the cap, and the account being decided is measured at its proposed new line.
    eligibility: []
    params:
      combined_exposure_cap_usd: 75000.00
    formula:
      headroom_usd: combined_exposure_cap_usd - card_msr_other_open_credit_limits
    measures: [card_msr_other_open_credit_limits]

  - id: card_application_decision
    subject: [card_application_submitted, card_account_approved, card_application_declined]
    rule: >-
      An application names exactly one tier and is approved only when the applicant meets every entry_gate value of that tier: a credit score at or above min_credit_score, an age at or above min_applicant_age and a stated annual income at or above min_annual_income_usd.
      Otherwise the application is declined; the bank never substitutes a lower tier on the same application, and the applicant may submit a new application for another tier after a decline.
      On approval the bank assigns a credit line (revolving card) or loan amount (Project Loan) between the tier's credit_line_min_usd and credit_line_max_usd, subject to card_agg_combined_exposure, and sets statement_closing_day.
      For a Project Loan the draw_period_end_date is the opening date plus draw_period_months calendar months, on the same day of the month, or on the last day of that month when that day does not exist.
      No tier charges an annual fee (annual_fee_usd), and no tier charges a prepayment penalty (prepayment_penalty_usd).
      An autopay option chosen on the application must be one of the tier's autopay_options.
      Approval and decline are decisions of the issuing bank recorded by the system; Customer Care may submit an application on the applicant's behalf but never approves or declines one.
    eligibility: []
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", draw_period_months: "=draw_period_months"}
        Ridgeline Consumer Credit Card Preferred: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", draw_period_months: "=draw_period_months"}
        Ridgeline Consumer Credit Card Premier: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", draw_period_months: "=draw_period_months"}
        Ridgeline Project Loan 66: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", draw_period_months: "=draw_period_months"}
        Ridgeline Project Loan 78: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", draw_period_months: "=draw_period_months"}
        Ridgeline Project Loan 84: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", draw_period_months: "=draw_period_months"}

  - id: card_evt_statement_minimum
    subject: [card_statement_issued]
    rule: >-
      A statement is issued for every statement period on the account's statement_closing_day, and its due_date is the statement_date plus statement_due_offset_days calendar days.
      On a revolving card the minimum payment due is the full new balance when the statement balance is below min_payment_floor_usd, and otherwise the greater of min_payment_floor_usd and min_payment_pct_of_balance percent of the statement balance rounded to the nearest cent; when min_payment_includes_past_due is true the past_due_amount is added on top.
      On a Project Loan the minimum payment due during the draw period is the interest charged on that statement when draw_period_interest_only is true, and after the draw period it is the fixed monthly installment that repays the balance outstanding at draw_period_end_date over loan_term_months at purchase_apr_pct, plus any past_due_amount.
      Any amount under an open billing dispute is left out of the balance used for the minimum.
      A statement with a zero or credit balance has a minimum payment due of 0.00.
      The days_past_due on a statement is the number of calendar days from the earliest due date whose minimum remains unpaid to the statement date, and 0 when every earlier minimum was covered.
    eligibility: []
    formula:
      when: draw_period_months == 0
      minimum_payment_due: (statement_balance if statement_balance < min_payment_floor_usd else max(min_payment_floor_usd, round(statement_balance * min_payment_pct_of_balance / 100, 2))) + past_due_amount

  - id: card_evt_payment_posting
    subject: [card_payment_posted, card_fee_assessed]
    rule: >-
      A payment received by payment_cutoff_time_et Eastern Time on a business day is credited that day; a payment received after the cutoff, or on a Saturday, Sunday or federal holiday, is credited on the next business day, and the credit date is the transaction_date.
      A one-time payment may be made online, by mail, at any store register, or through a phone representative, and autopay drafts post on the due date.
      The cardholder must authorize the debit from the named bank account before a phone payment is posted.
      Payments are accepted on accounts whose status is active, suspended, closed or charged_off.
      A one-time payment may not exceed the account's current_balance.
      A payment taken through a phone representative (payment_channel phone_agent) incurs the tier's phone_agent_payment_fee_usd, posted as a card_fee_assessed row with fee_type phone_payment_fee that references the payment row in original_transaction_id; online, autopay, mail and in-store payments never incur it, and no phone payment fee row is posted on a tier whose fee is 0.00.
    eligibility:
      - id: debit_authorized
        applies_to: [card_payment_posted]
        kind: authorization
        condition: The cardholder must authorize the debit from the named bank account before a phone payment is posted.
        evidence_fields: [card_accounts.card_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
      - id: payable_status
        applies_to: [card_payment_posted]
        kind: state
        condition: Payments are accepted on accounts whose status is active, suspended, closed or charged_off.
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active, suspended, closed, charged_off]
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {phone_agent_payment_fee_usd: "=phone_agent_payment_fee_usd", payment_cutoff_time_et: "=payment_cutoff_time_et"}
        Ridgeline Consumer Credit Card Preferred: {phone_agent_payment_fee_usd: "=phone_agent_payment_fee_usd", payment_cutoff_time_et: "=payment_cutoff_time_et"}
        Ridgeline Consumer Credit Card Premier: {phone_agent_payment_fee_usd: "=phone_agent_payment_fee_usd", payment_cutoff_time_et: "=payment_cutoff_time_et"}
        Ridgeline Project Loan 66: {phone_agent_payment_fee_usd: "=phone_agent_payment_fee_usd", payment_cutoff_time_et: "=payment_cutoff_time_et"}
        Ridgeline Project Loan 78: {phone_agent_payment_fee_usd: "=phone_agent_payment_fee_usd", payment_cutoff_time_et: "=payment_cutoff_time_et"}
        Ridgeline Project Loan 84: {phone_agent_payment_fee_usd: "=phone_agent_payment_fee_usd", payment_cutoff_time_et: "=payment_cutoff_time_et"}

  - id: card_evt_payment_allocation
    subject: [card_payment_posted]
    rule: >-
      The part of a payment up to the minimum payment due is applied at the bank's discretion, and the part above the minimum is allocated on exactly one basis, recorded in excess_allocation.
      The basis is promo_expiry_window when any deferred-interest balance on the account has a promo_end_date within the promo_allocation_cycles_before_expiry billing cycles that end on or before that date; the excess then goes first to that promotional balance, to the one ending soonest when several qualify.
      Otherwise the basis is deferred_promo_requested when the cardholder asks, when making the payment, that the excess go to a deferred-interest balance they name; the excess then goes to that balance.
      Otherwise the basis is highest_apr_first, and the excess goes to the balance with the highest APR first, then to the next highest.
      The expiry window takes precedence over a cardholder request, and a request made after the payment is credited does not reallocate it.
      A Project Loan has a single balance, and its payments record single_balance.
    eligibility: []

  - id: card_evt_promo_financing
    subject: [card_purchase_posted, card_interest_charged]
    rule: >-
      A single purchase charged to a revolving card may carry one special financing plan chosen at the register: deferred_6 when the purchase is at least deferred_6_min_purchase_usd and deferred_6_available is true; deferred_12 when it is at least deferred_12_min_purchase_usd and deferred_12_available is true; deferred_24 when it is at least deferred_24_min_purchase_usd and deferred_24_available is true; fixed_apr_84 at reduced_apr_84_pct with 84 equal monthly payments when it is at least reduced_apr_84_min_purchase_usd and reduced_apr_84_available is true.
      With no choice, or no qualifying plan, the purchase is revolving_standard.
      Special financing and the everyday discount are mutually exclusive on the same purchase (everyday_discount_combinable_with_promo): a purchase posted with any plan other than revolving_standard received no everyday discount, and a revolving_standard purchase received everyday_discount_pct off at the register, so its posted amount is already net of the discount.
      The promo_end_date is the posting date plus the plan's 6, 12 or 24 months, on the same day of the month, or on the last day of that month when that day does not exist.
      Deferred interest accrues on a deferred-interest purchase from its posting date at purchase_apr_pct but is not charged when the promotional balance is paid in full by the promo_end_date; when any of it is unpaid at the end of the promo_end_date, all interest accrued on the full original promotional amount is charged on the next statement as a card_interest_charged row with interest_type deferred_interest_assessed and the promotion's plan_code.
      Project Loan purchases post with plan_code loan_draw and may post only on or before draw_period_end_date.
    eligibility: []
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {deferred_6_available: "=deferred_6_available", deferred_12_available: "=deferred_12_available", deferred_24_available: "=deferred_24_available", reduced_apr_84_available: "=reduced_apr_84_available"}
        Ridgeline Consumer Credit Card Preferred: {deferred_6_available: "=deferred_6_available", deferred_12_available: "=deferred_12_available", deferred_24_available: "=deferred_24_available", reduced_apr_84_available: "=reduced_apr_84_available"}
        Ridgeline Consumer Credit Card Premier: {deferred_6_available: "=deferred_6_available", deferred_12_available: "=deferred_12_available", deferred_24_available: "=deferred_24_available", reduced_apr_84_available: "=reduced_apr_84_available"}
        Ridgeline Project Loan 66: {deferred_6_available: "=deferred_6_available", deferred_12_available: "=deferred_12_available", deferred_24_available: "=deferred_24_available", reduced_apr_84_available: "=reduced_apr_84_available"}
        Ridgeline Project Loan 78: {deferred_6_available: "=deferred_6_available", deferred_12_available: "=deferred_12_available", deferred_24_available: "=deferred_24_available", reduced_apr_84_available: "=reduced_apr_84_available"}
        Ridgeline Project Loan 84: {deferred_6_available: "=deferred_6_available", deferred_12_available: "=deferred_12_available", deferred_24_available: "=deferred_24_available", reduced_apr_84_available: "=reduced_apr_84_available"}

  - id: card_evt_interest
    subject: [card_interest_charged]
    rule: >-
      Purchase interest (interest_type purchase_interest) on a revolving balance is the average daily balance of that balance in the statement period multiplied by the daily periodic rate (purchase_apr_pct divided by 100 and by interest_day_count_basis) and by the number of days in the period, rounded to the nearest cent.
      No purchase interest is charged on new purchases when the previous statement balance was paid in full by its due date, which falls grace_period_days after the statement date.
      When the interest computed for a period is above zero but below min_interest_charge_usd, min_interest_charge_usd is charged instead.
      A Project Loan accrues simple daily interest at its fixed APR from each draw's posting date, with no grace period and no minimum interest charge.
      No interest accrues on an amount while it is under an open billing dispute.
    eligibility: []
    formula:
      daily_periodic_rate: purchase_apr_pct / 100 / interest_day_count_basis

  - id: card_evt_late_fee
    subject: [card_fee_assessed]
    rule: >-
      A late fee (fee_type late_fee) posts on the day after a payment due date when the payments credited from the statement date through the due date total less than that statement's minimum_payment_due; it references the statement row in original_transaction_id and carries that statement's statement_period.
      No late fee is charged when the minimum payment due was 0.00, and a payment later returned unpaid does not count as credited.
      At most one late fee is charged for any one statement period.
      The fee is late_fee_repeat_usd when card_msr_late_fees_lookback_cycles (late fees in the late_fee_repeat_lookback_cycles statement periods before this one) is one or more, and late_fee_first_usd otherwise; when late_fee_capped_at_min_due is true the fee is the lower of that amount and the statement's minimum payment due.
    eligibility:
      - id: one_late_fee_per_period
        applies_to: [card_fee_assessed]
        kind: dedup
        condition: At most one late fee is charged for any one statement period.
        evidence_fields: [card_transactions.card_account_id, card_transactions.statement_period, card_transactions.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_account_id, card_transactions.statement_period]
          action_bindings:
            card_transactions.card_account_id: card_account_id
            card_transactions.statement_period: statement_period
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {card_account_id: card_account_id, statement_period: statement_period}
          duplicate_filters: {fee_type: [late_fee]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", late_fee_capped_at_min_due: "=late_fee_capped_at_min_due"}
        Ridgeline Consumer Credit Card Preferred: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", late_fee_capped_at_min_due: "=late_fee_capped_at_min_due"}
        Ridgeline Consumer Credit Card Premier: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", late_fee_capped_at_min_due: "=late_fee_capped_at_min_due"}
        Ridgeline Project Loan 66: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", late_fee_capped_at_min_due: "=late_fee_capped_at_min_due"}
        Ridgeline Project Loan 78: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", late_fee_capped_at_min_due: "=late_fee_capped_at_min_due"}
        Ridgeline Project Loan 84: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", late_fee_capped_at_min_due: "=late_fee_capped_at_min_due"}
    formula:
      base_fee: late_fee_repeat_usd if card_msr_late_fees_lookback_cycles >= 1 else late_fee_first_usd
      late_fee: min(base_fee, minimum_payment_due) if late_fee_capped_at_min_due else base_fee
    measures: [card_msr_late_fees_lookback_cycles]

  - id: card_evt_returned_payment
    subject: [card_payment_returned, card_fee_assessed]
    rule: >-
      When the cardholder's bank returns a payment unpaid, its amount is added back to the balance as a card_payment_returned row that references the payment row in original_transaction_id and records the bank's return_reason.
      A payment that already has a card_payment_returned row cannot be returned again.
      A returned payment fee (fee_type returned_payment_fee) of returned_payment_fee_usd is charged, referencing the returned payment row, with two exceptions.
      First, when single_event_fee_rule is true and the return leaves a statement's minimum payment due unpaid as of its due date, only the late fee for that statement is charged and no returned payment fee is charged for that payment.
      Second, when late_fee_capped_at_min_due is true the returned payment fee may not exceed the minimum payment due of the statement the payment was made toward.
    eligibility:
      - id: return_once
        applies_to: [card_payment_returned]
        kind: dedup
        condition: A payment that already has a card_payment_returned row cannot be returned again.
        evidence_fields: [card_transactions.original_transaction_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.original_transaction_id]
          action_bindings:
            card_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [card_payment_returned]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Consumer Credit Card Preferred: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Consumer Credit Card Premier: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Project Loan 66: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Project Loan 78: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Project Loan 84: {returned_payment_fee_usd: "=returned_payment_fee_usd"}

  - id: card_evt_fee_correction
    subject: [card_fee_reversed]
    rule: >-
      A fee that should not have been charged is reversed in full, never in part, by one card_fee_reversed row referencing the fee row in original_transaction_id.
      The reversal_reason is posting_error for a late fee whose statement minimum was in fact covered by payments credited on or before that statement's due_date, for a returned payment fee whose payment was not in fact returned, and for a phone payment fee on a payment that was not taken through a phone representative.
      The reversal_reason is dispute_resolved for a late fee or returned payment fee that arose solely because a disputed amount, later resolved in the cardholder's favor, was left unpaid.
      A correction is owed regardless of tier, months on book, courtesy waiver history or how long ago the fee posted, and it does not use up a courtesy waiver.
      A fee row that already has a card_fee_reversed or card_fee_waived row referencing it cannot be reversed again.
      Interest is not adjusted by a fee correction.
    eligibility:
      - id: not_already_reversed
        applies_to: [card_fee_reversed]
        kind: dedup
        condition: A fee row that already has a card_fee_reversed or card_fee_waived row referencing it cannot be reversed again.
        evidence_fields: [card_transactions.original_transaction_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.original_transaction_id]
          action_bindings:
            card_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [card_fee_reversed, card_fee_waived]}
          distinct_fields: []

  - id: card_evt_courtesy_waiver
    subject: [card_fee_waived]
    rule: >-
      A correctly charged late fee may be waived in full as a courtesy at the cardholder's request; returned payment fees and phone payment fees are never waived as a courtesy.
      The account status must be active at the time of the request.
      The account must have been open for at least courtesy_waiver_min_months_on_book full calendar months since the account was opened.
      Months on book are counted in whole calendar months from opened_date: the account reaches N months on the same day of the month N months later, or on the last day of that month when that day does not exist.
      The waiver must be requested no more than courtesy_waiver_request_window_days calendar days after the late fee was posted.
      Days are counted as calendar days from the late fee's transaction_date as day 0 to the date of the request, and a request on the last day of the window still qualifies.
      card_msr_courtesy_waivers_12_months must be below courtesy_waiver_per_12_months, and card_msr_late_fees_12_months, counting the fee being waived, must be exactly one.
      A late fee that already has a card_fee_reversed or card_fee_waived row referencing it cannot be waived.
      When the fee is owed a correction under card_evt_fee_correction, the correction applies instead and no courtesy waiver is used.
    eligibility:
      - id: active_account
        applies_to: [card_fee_waived]
        kind: state
        condition: The account status must be active at the time of the request.
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active]
      - id: tenure
        applies_to: [card_fee_waived]
        kind: time
        condition: The account must have been open for at least courtesy_waiver_min_months_on_book full calendar months since the account was opened.
        evidence_fields: [card_accounts.card_account_id, card_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account was opened
          anchor_source: card_accounts.opened_date
          relation: not_before
          duration_source: variants.courtesy_waiver_min_months_on_book
          unit: calendar_months
          counting_rule: "Months on book are counted in whole calendar months from opened_date: the account reaches N months on the same day of the month N months later, or on the last day of that month when that day does not exist."
          boundary: inclusive
      - id: request_window
        applies_to: [card_fee_waived]
        kind: time
        condition: The waiver must be requested no more than courtesy_waiver_request_window_days calendar days after the late fee was posted.
        evidence_fields: [card_transactions.card_transaction_id, card_transactions.transaction_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_transaction_id]
          action_bindings:
            card_transactions.card_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the late fee was posted
          anchor_source: card_transactions.transaction_date
          relation: not_after
          duration_source: variants.courtesy_waiver_request_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the late fee's transaction_date as day 0 to the date of the request, and a request on the last day of the window still qualifies.
          boundary: inclusive
      - id: not_already_waived
        applies_to: [card_fee_waived]
        kind: dedup
        condition: A late fee that already has a card_fee_reversed or card_fee_waived row referencing it cannot be waived.
        evidence_fields: [card_transactions.original_transaction_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.original_transaction_id]
          action_bindings:
            card_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [card_fee_reversed, card_fee_waived]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_min_months_on_book: "=courtesy_waiver_min_months_on_book"}
        Ridgeline Consumer Credit Card Preferred: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_min_months_on_book: "=courtesy_waiver_min_months_on_book"}
        Ridgeline Consumer Credit Card Premier: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_min_months_on_book: "=courtesy_waiver_min_months_on_book"}
        Ridgeline Project Loan 66: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_min_months_on_book: "=courtesy_waiver_min_months_on_book"}
        Ridgeline Project Loan 78: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_min_months_on_book: "=courtesy_waiver_min_months_on_book"}
        Ridgeline Project Loan 84: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_min_months_on_book: "=courtesy_waiver_min_months_on_book"}
    formula:
      eligible: card_msr_courtesy_waivers_12_months < courtesy_waiver_per_12_months and card_msr_late_fees_12_months == 1
    measures: [card_msr_courtesy_waivers_12_months, card_msr_late_fees_12_months]

  - id: card_evt_return_credit
    subject: [card_return_credit_posted, card_credit_balance_refunded]
    rule: >-
      A refund for returned merchandise, a cancelled order or a refunded service that was paid with a Ridgeline Consumer Credit account is credited to the same account that was charged for the original purchase, never to another account of the customer and never paid out in cash; it references the original card_purchase_posted row in original_transaction_id and carries that purchase's plan_code and the merchant_reference of the refund.
      The credit amount is the refund decided under the selling program's own rules, and the credits referencing one purchase may never total more than that purchase's amount.
      A return credit is accepted on accounts whose status is active, suspended, closed or charged_off.
      A credit against a promotional purchase reduces that promotional balance and the base on which deferred interest could be assessed.
      On a Project Loan, a credit posted on or before draw_period_end_date restores the amount available to draw when return_restores_draw_availability is true; a credit after the draw period reduces principal only and the fixed installment is not recalculated.
      When credits leave the account with a credit balance above credit_balance_refund_threshold_usd, the cardholder may ask for the credit balance to be refunded, and it is refunded in full as one card_credit_balance_refunded row; a credit balance at or below the threshold stays on the account and absorbs future charges.
    eligibility:
      - id: creditable_status
        applies_to: [card_return_credit_posted]
        kind: state
        condition: A return credit is accepted on accounts whose status is active, suspended, closed or charged_off.
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active, suspended, closed, charged_off]
      - id: refund_requested
        applies_to: [card_credit_balance_refunded]
        kind: caller_fact
        condition: When credits leave the account with a credit balance above credit_balance_refund_threshold_usd, the cardholder may ask for the credit balance to be refunded, and it is refunded in full as one card_credit_balance_refunded row; a credit balance at or below the threshold stays on the account and absorbs future charges.
        evidence_fields: [card_accounts.card_account_id, card_accounts.current_balance]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id

  - id: card_evt_billing_dispute
    subject: [card_dispute_credit_posted]
    rule: >-
      A billing error dispute is filed as a card_requests record of request_type billing_dispute that names the disputed card_purchase_posted row in disputed_transaction_id and the disputed_amount.
      It is accepted only when the dispute is filed no more than dispute_window_days calendar days after the statement on which the disputed charge first appeared was issued.
      The window is counted in calendar days from that statement's statement_date as day 0, a dispute filed on the last day of the window is timely, and one filed later is not accepted.
      The dispute is acknowledged within dispute_acknowledge_days and resolved within dispute_resolution_max_days of filing; while it is open the disputed amount is left out of the minimum payment, accrues no interest and cannot make the account delinquent, and the undisputed balance must still be paid.
      A dispute credit posts only when the billing dispute request has status approved; it credits the disputed amount plus any interest charged on it, references the purchase in original_transaction_id and the request in card_request_id, and fees caused solely by the disputed amount are reversed separately under card_evt_fee_correction.
      When the request is declined no credit posts and the amount re-enters the next statement.
      Only the part of a charge not already credited by a return credit can be disputed, and one purchase receives at most one dispute credit.
    eligibility:
      - id: filed_in_window
        applies_to: [card_dispute_credit_posted]
        kind: time
        condition: It is accepted only when the dispute is filed no more than dispute_window_days calendar days after the statement on which the disputed charge first appeared was issued.
        evidence_fields: [card_transactions.card_transaction_id, card_transactions.statement_date, card_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_transaction_id]
          action_bindings:
            card_transactions.card_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the statement on which the disputed charge first appeared was issued
          anchor_source: card_transactions.statement_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days from that statement's statement_date as day 0, a dispute filed on the last day of the window is timely, and one filed later is not accepted.
          boundary: inclusive
      - id: dispute_approved
        applies_to: [card_dispute_credit_posted]
        kind: state
        condition: A dispute credit posts only when the billing dispute request has status approved; it credits the disputed amount plus any interest charged on it, references the purchase in original_transaction_id and the request in card_request_id, and fees caused solely by the disputed amount are reversed separately under card_evt_fee_correction.
        evidence_fields: [card_requests.card_request_id, card_requests.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_requests.card_request_id]
          action_bindings:
            card_requests.card_request_id: card_request_id
        state_contract:
          field: card_requests.status
          allowed: [approved]
      - id: one_credit_per_purchase
        applies_to: [card_dispute_credit_posted]
        kind: dedup
        condition: Only the part of a charge not already credited by a return credit can be disputed, and one purchase receives at most one dispute credit.
        evidence_fields: [card_transactions.original_transaction_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.original_transaction_id]
          action_bindings:
            card_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [card_dispute_credit_posted]}
          distinct_fields: []

  - id: card_credit_line_increase
    subject: [card_credit_limit_changed]
    rule: >-
      A credit line increase is granted only on the cardholder's own request, recorded as a card_requests record of request_type credit_limit_increase with the requested_credit_limit.
      The account status must be active when the increase is decided.
      The account must have been open for at least cli_min_months_on_book full calendar months since the account was opened.
      At least cli_cooldown_months full calendar months must have passed since the last credit line change, counted from credit_limit_changed_date; when credit_limit_changed_date is empty the line has never changed and the cooldown is met.
      Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist.
      card_msr_late_fees_clean_history must be zero.
      The new line is the lowest of the requested_credit_limit, the current credit_limit increased by cli_max_increase_pct percent, the tier's credit_line_max_usd and the headroom left under card_agg_combined_exposure, rounded down to cli_rounding_increment_usd; when that figure is not above the current credit_limit no increase is granted.
      A tier whose cli_max_increase_pct is 0 (every Project Loan) never receives an increase.
      An increase never moves the account to another tier, and decreases are made only by the bank.
    eligibility:
      - id: active_account
        applies_to: [card_credit_limit_changed]
        kind: state
        condition: The account status must be active when the increase is decided.
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active]
      - id: tenure
        applies_to: [card_credit_limit_changed]
        kind: time
        condition: The account must have been open for at least cli_min_months_on_book full calendar months since the account was opened.
        evidence_fields: [card_accounts.card_account_id, card_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account was opened
          anchor_source: card_accounts.opened_date
          relation: not_before
          duration_source: variants.cli_min_months_on_book
          unit: calendar_months
          counting_rule: "Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist."
          boundary: inclusive
      - id: cooldown
        applies_to: [card_credit_limit_changed]
        kind: time
        condition: At least cli_cooldown_months full calendar months must have passed since the last credit line change, counted from credit_limit_changed_date; when credit_limit_changed_date is empty the line has never changed and the cooldown is met.
        evidence_fields: [card_accounts.card_account_id, card_accounts.credit_limit_changed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: since the last credit line change
          anchor_source: card_accounts.credit_limit_changed_date
          relation: not_before
          duration_source: variants.cli_cooldown_months
          unit: calendar_months
          counting_rule: "Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist."
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {cli_max_increase_pct: "=cli_max_increase_pct", cli_clean_history_months: "=cli_clean_history_months"}
        Ridgeline Consumer Credit Card Preferred: {cli_max_increase_pct: "=cli_max_increase_pct", cli_clean_history_months: "=cli_clean_history_months"}
        Ridgeline Consumer Credit Card Premier: {cli_max_increase_pct: "=cli_max_increase_pct", cli_clean_history_months: "=cli_clean_history_months"}
        Ridgeline Project Loan 66: {cli_max_increase_pct: "=cli_max_increase_pct", cli_clean_history_months: "=cli_clean_history_months"}
        Ridgeline Project Loan 78: {cli_max_increase_pct: "=cli_max_increase_pct", cli_clean_history_months: "=cli_clean_history_months"}
        Ridgeline Project Loan 84: {cli_max_increase_pct: "=cli_max_increase_pct", cli_clean_history_months: "=cli_clean_history_months"}
    formula:
      max_new_limit: min(credit_line_max_usd, round(credit_limit * (1 + cli_max_increase_pct / 100), 2), combined_exposure_cap_usd - card_msr_other_open_credit_limits)
    measures: [card_msr_late_fees_clean_history, card_msr_other_open_credit_limits]

  - id: card_autopay_management
    subject: [card_autopay_changed]
    rule: >-
      Autopay is enrolled, changed or cancelled only on the cardholder's own instruction.
      Autopay can be enrolled or changed on accounts whose status is active or suspended.
      The option chosen must be one of the tier's autopay_options; with fixed_amount the draft is the greater of autopay_fixed_amount and the minimum payment due, and with statement_balance it is the full statement balance.
      A change made at least autopay_change_lead_days business days (Monday to Friday, excluding federal holidays) before the next payment due date applies to that due date, and a later change applies from the following due date.
      Cancelling sets autopay_enrolled to false, autopay_option to none and autopay_fixed_amount to 0.00.
      Autopay drafts post as card_payment_posted rows with payment_channel autopay on the due date and never incur a phone payment fee.
    eligibility:
      - id: cardholder_instruction
        applies_to: [card_autopay_changed]
        kind: authorization
        condition: Autopay is enrolled, changed or cancelled only on the cardholder's own instruction.
        evidence_fields: [card_accounts.card_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
      - id: open_account
        applies_to: [card_autopay_changed]
        kind: state
        condition: Autopay can be enrolled or changed on accounts whose status is active or suspended.
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active, suspended]
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {autopay_options: "=autopay_options"}
        Ridgeline Consumer Credit Card Preferred: {autopay_options: "=autopay_options"}
        Ridgeline Consumer Credit Card Premier: {autopay_options: "=autopay_options"}
        Ridgeline Project Loan 66: {autopay_options: "=autopay_options"}
        Ridgeline Project Loan 78: {autopay_options: "=autopay_options"}
        Ridgeline Project Loan 84: {autopay_options: "=autopay_options"}

  - id: card_authorized_users
    subject: [card_authorized_users_changed]
    rule: >-
      Only the primary cardholder may add or remove authorized users; an authorized user may make purchases but cannot make account changes.
      Authorized users can be added only while the account status is active.
      The number of authorized users may never exceed the tier's authorized_user_max, each must be at least authorized_user_min_age years old on the day added, and at most authorized_user_change_limit_per_cycle additions or removals are processed in one statement period.
      Project Loans have no authorized users.
      Removing an authorized user is allowed in any open status and does not count against the limit of additions.
    eligibility:
      - id: active_for_additions
        applies_to: [card_authorized_users_changed]
        kind: state
        condition: Authorized users can be added only while the account status is active.
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        state_contract:
          field: card_accounts.status
          allowed: [active]
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {authorized_user_max: "=authorized_user_max"}
        Ridgeline Consumer Credit Card Preferred: {authorized_user_max: "=authorized_user_max"}
        Ridgeline Consumer Credit Card Premier: {authorized_user_max: "=authorized_user_max"}
        Ridgeline Project Loan 66: {authorized_user_max: "=authorized_user_max"}
        Ridgeline Project Loan 78: {authorized_user_max: "=authorized_user_max"}
        Ridgeline Project Loan 84: {authorized_user_max: "=authorized_user_max"}

  - id: card_account_standing
    subject: [card_account_suspended, card_account_reinstated, card_account_charged_off]
    rule: >-
      Account standing follows the delinquency recorded on statements and is changed only by the system.
      An active account is suspended when a statement shows days_past_due at or above suspension_days_past_due; no new purchases or draws are authorized while it is suspended.
      A suspended account is reinstated when its latest statement shows a past_due_amount of 0.00 and card_msr_ontime_payment_streak is at least reinstatement_consecutive_ontime_payments.
      A suspended account is charged off when a statement shows days_past_due at or above charge_off_days_past_due.
      Customer Care cannot reinstate an account early, reverse a suspension or reverse a charge-off; a payment toward a charged-off balance is accepted but does not reopen the account.
    eligibility: []
    params:
      per_tier:
        Ridgeline Consumer Credit Card Classic: {reinstatement_consecutive_ontime_payments: "=reinstatement_consecutive_ontime_payments", charge_off_days_past_due: "=charge_off_days_past_due"}
        Ridgeline Consumer Credit Card Preferred: {reinstatement_consecutive_ontime_payments: "=reinstatement_consecutive_ontime_payments", charge_off_days_past_due: "=charge_off_days_past_due"}
        Ridgeline Consumer Credit Card Premier: {reinstatement_consecutive_ontime_payments: "=reinstatement_consecutive_ontime_payments", charge_off_days_past_due: "=charge_off_days_past_due"}
        Ridgeline Project Loan 66: {reinstatement_consecutive_ontime_payments: "=reinstatement_consecutive_ontime_payments", charge_off_days_past_due: "=charge_off_days_past_due"}
        Ridgeline Project Loan 78: {reinstatement_consecutive_ontime_payments: "=reinstatement_consecutive_ontime_payments", charge_off_days_past_due: "=charge_off_days_past_due"}
        Ridgeline Project Loan 84: {reinstatement_consecutive_ontime_payments: "=reinstatement_consecutive_ontime_payments", charge_off_days_past_due: "=charge_off_days_past_due"}
    measures: [card_msr_ontime_payment_streak]

  - id: card_account_closure
    subject: [card_account_closed]
    rule: >-
      The primary cardholder may close their account at any time, recorded as a card_requests record of request_type account_closure.
      Closure takes effect only on the primary cardholder's own confirmation.
      When closure_with_balance_allowed is true an account may be closed with a balance owed; the balance is then repaid under the existing terms, promotional plans keep their terms and end dates, and authorized users are removed.
      A closed account cannot be reopened; the customer applies again under card_agg_multi_holding.
      The bank closes a revolving account when card_msr_months_since_activity reaches inactivity_closure_months on a tier where that value is above 0, and closes a Project Loan whose draw period has ended once its balance reaches 0.00.
    eligibility:
      - id: holder_confirms
        applies_to: [card_account_closed]
        kind: authorization
        condition: Closure takes effect only on the primary cardholder's own confirmation.
        evidence_fields: [card_requests.card_request_id, card_requests.card_account_id, card_requests.request_type]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [card_requests.card_account_id]
          action_bindings:
            card_requests.card_account_id: card_account_id
    measures: [card_msr_months_since_activity]

extended_policies:
  - id: card_ext_refund_credit
    base_policy_refs: [card_evt_return_credit]
    overwrite:
      - base_policy: card_evt_return_credit
        superseded_clause: >-
          The credit amount is the refund decided under the selling program's own rules
        replaced_by: >-
          The return credit posted is the uncredited refund plus a late-posting allowance, rounded to the nearest cent.
    trigger: state_due
    subject: [card_return_credit_posted]
    computes: amount
    target_tool: post_refund_return_credit_59e816eb
    params:
      refund_window_months: 3
      long_tenure_months: 60
      mid_tenure_months: 24
      allowance_rate_mid_pct: 12.0
      allowance_rate_base_pct: 6.0
      month_days: 30
      fortnight_days: 14
      flat_month_usd: 15.0
      flat_fortnight_usd: 7.5
      spend_window_months: 12
      spend_high_usd: 5000.0
      spend_mid_usd: 1500.0
      mult_high: 2.0
      mult_mid: 1.5
      day_basis: 365
    rule: >-
      When a Ridgeline selling program has issued a refund to the Ridgeline Consumer Credit tender in the customer's name and the account does not yet carry it, one return credit is posted for it, referencing the purchase the refund credits and carrying that purchase's plan code and the order number of the refund.
      The return credit posted is the uncredited refund plus a late-posting allowance, rounded to the nearest cent.
      The uncredited refund is the total of the special order refunds issued to the Ridgeline Consumer Credit tender in the customer's name in the last 3 months (dated less than 3 full months before today), less the return credits posted on the account in the same 3 months, and never below zero.
      As the standard computation, the late-posting allowance is the uncredited refund multiplied by 6 percent a year and by the calendar days from the latest of those refund dates to today, divided by 365 and rounded to the nearest cent.
      In general the late-posting allowance is worked out on the uncredited refund in this order: first the interest allowance is the uncredited refund multiplied by the allowance rate divided by 100 and by the late-posting days, divided by 365 and rounded to the nearest cent; then the flat courtesy is added to that interest allowance; then that sum is multiplied by the allowance multiplier and rounded to the nearest cent.
      The allowance rate is the account's purchase APR when the account is a Preferred or Premier card open 60 full months or more; it is 12 percent a year when the account is a Preferred or Premier card open at least 24 but fewer than 60 full months; on every other account it is 6 percent a year.
      The late-posting days are the calendar days from the day the late-posting clock starts to today: when the refunds to the Ridgeline Consumer Credit tender in the 3 months are the payout of vendor-delay credits, that is, the vendor-delay credits the special order program applied in the same 3 months total exactly the same amount as those refunds, the clock starts on the latest of those delay-credit dates; when that does not hold but the order-cancellation credits applied in the same 3 months total exactly the same amount as those refunds, the clock starts on the latest of those cancellation-credit dates; otherwise the clock starts on the latest refund date.
      The flat courtesy is 15.00 when 30 or more calendar days have passed from the latest refund date to today, 7.50 when 14 to 29 calendar days have passed, and nothing when fewer than 14 calendar days have passed.
      The allowance multiplier is 2 when the account's purchases made through special orders in the last 12 months (dated less than 12 full months before today) total 5,000.00 or more, 1.5 when they total 1,500.00 or more but less than 5,000.00, and 1 when they total less than 1,500.00.
    prerequisite: []
    cross_category:
      - category: special
        as: history
        reads: [special_order_events.amount, special_order_events.event_date, special_order_events.event_type, special_order_events.refund_method, special_order_events.credit_type]
        note: The uncredited refund and the late-posting clock (a cross-difficulty method factor) are read from the customer's special order ledger - its refunds to the Ridgeline Consumer Credit tender and its vendor-delay and order-cancellation credits.
    compute:
      - prog_refunds: "XSUM('special','special_order_events','amount', within_months=K('refund_window_months'), date_field='event_date', event_type='special_refund_issued', refund_method='ridgeline_consumer_credit')"
      - posted_credits: "SUM('card_transactions','amount', within_months=K('refund_window_months'), date_field='transaction_date', event_type='card_return_credit_posted')"
      - uncredited: "MX(0, RND(prog_refunds - posted_credits, 2))"
      - refund_date: "XLATEST('special','special_order_events','event_date', date_field='event_date', event_type='special_refund_issued', refund_method='ridgeline_consumer_credit')"
      - tenure_months: "MONTHS(F('opened_date'), NOW)"
      - allowance_rate_pct: "P('purchase_apr_pct') if ((F('variant_name') == 'Ridgeline Consumer Credit Card Preferred' or F('variant_name') == 'Ridgeline Consumer Credit Card Premier') and tenure_months >= K('long_tenure_months')) else (K('allowance_rate_mid_pct') if ((F('variant_name') == 'Ridgeline Consumer Credit Card Preferred' or F('variant_name') == 'Ridgeline Consumer Credit Card Premier') and tenure_months >= K('mid_tenure_months')) else K('allowance_rate_base_pct'))"
      - delay_credits: "XSUM('special','special_order_events','amount', within_months=K('refund_window_months'), date_field='event_date', event_type='special_credit_applied', credit_type='delay_credit')"
      - cancel_credits: "XSUM('special','special_order_events','amount', within_months=K('refund_window_months'), date_field='event_date', event_type='special_credit_applied', credit_type='order_cancellation')"
      - delay_credit_date: "XLATEST('special','special_order_events','event_date', date_field='event_date', event_type='special_credit_applied', credit_type='delay_credit')"
      - cancel_credit_date: "XLATEST('special','special_order_events','event_date', date_field='event_date', event_type='special_credit_applied', credit_type='order_cancellation')"
      - clock_start: "delay_credit_date if (delay_credits > 0 and RND(delay_credits - prog_refunds, 2) == 0) else (cancel_credit_date if (cancel_credits > 0 and RND(cancel_credits - prog_refunds, 2) == 0) else refund_date)"
      - days_late: "DAYS(clock_start, NOW)"
      - flat_courtesy: "K('flat_month_usd') if DAYS(refund_date, NOW) >= K('month_days') else (K('flat_fortnight_usd') if DAYS(refund_date, NOW) >= K('fortnight_days') else 0)"
      - so_spend: "SUM('card_transactions','amount', within_months=K('spend_window_months'), date_field='transaction_date', event_type='card_purchase_posted', purchase_channel='special_order')"
      - allowance_multiplier: "K('mult_high') if so_spend >= K('spend_high_usd') else (K('mult_mid') if so_spend >= K('spend_mid_usd') else 1)"
      - interest_allowance: "RND(uncredited * allowance_rate_pct / 100 * days_late / K('day_basis'), 2)"
      - allowance: "RND((interest_allowance + flat_courtesy) * allowance_multiplier, 2)"
      - result: "RND(uncredited + allowance, 2)"
    compute_basis:
      prog_refunds: "The uncredited refund is the total of the special order refunds issued to the Ridgeline Consumer Credit tender in the customer's name in the last 3 months (dated less than 3 full months before today), less the return credits posted on the account in the same 3 months, and never below zero."
      posted_credits: "less the return credits posted on the account in the same 3 months"
      uncredited: "and never below zero."
      refund_date: "the calendar days from the latest of those refund dates to today"
      tenure_months: "open 60 full months or more"
      allowance_rate_pct: "The allowance rate is the account's purchase APR when the account is a Preferred or Premier card open 60 full months or more; it is 12 percent a year when the account is a Preferred or Premier card open at least 24 but fewer than 60 full months; on every other account it is 6 percent a year."
      delay_credits: "the vendor-delay credits the special order program applied in the same 3 months total exactly the same amount as those refunds"
      cancel_credits: "the order-cancellation credits applied in the same 3 months total exactly the same amount as those refunds"
      delay_credit_date: "the clock starts on the latest of those delay-credit dates"
      cancel_credit_date: "the clock starts on the latest of those cancellation-credit dates"
      clock_start: "otherwise the clock starts on the latest refund date."
      days_late: "The late-posting days are the calendar days from the day the late-posting clock starts to today"
      flat_courtesy: "The flat courtesy is 15.00 when 30 or more calendar days have passed from the latest refund date to today, 7.50 when 14 to 29 calendar days have passed, and nothing when fewer than 14 calendar days have passed."
      so_spend: "the account's purchases made through special orders in the last 12 months (dated less than 12 full months before today)"
      allowance_multiplier: "The allowance multiplier is 2 when the account's purchases made through special orders in the last 12 months (dated less than 12 full months before today) total 5,000.00 or more, 1.5 when they total 1,500.00 or more but less than 5,000.00, and 1 when they total less than 1,500.00."
      interest_allowance: "first the interest allowance is the uncredited refund multiplied by the allowance rate divided by 100 and by the late-posting days, divided by 365 and rounded to the nearest cent"
      allowance: "then the flat courtesy is added to that interest allowance; then that sum is multiplied by the allowance multiplier and rounded to the nearest cent."
      result: "The return credit posted is the uncredited refund plus a late-posting allowance, rounded to the nearest cent."
    factors:
      - id: allowance_rate
        effect: parameter
        decides: allowance_rate_pct
        bindings: [tenure_months, allowance_rate_pct]
        ladder:
          - when: "the account is a Preferred or Premier card and has been open 60 full months or more"
            value: "P('purchase_apr_pct')"
          - when: "the account is a Preferred or Premier card and has been open at least 24 but fewer than 60 full months"
            value: "K('allowance_rate_mid_pct')"
          - when: "otherwise"
            value: "K('allowance_rate_base_pct')"
        baseline:
          allowance_rate_pct: "K('allowance_rate_base_pct')"
        evidence: [tier_param, date]
        cross_difficulty: null
      - id: late_posting_clock
        effect: method
        decides: days_late
        bindings: [delay_credits, cancel_credits, delay_credit_date, cancel_credit_date, clock_start, days_late]
        ladder:
          - when: "the card-tender refunds of the last 3 months are the payout of vendor-delay credits: the vendor-delay credits applied in those 3 months total exactly the refunds"
            method: "the late-posting days are counted in calendar days from the latest of those delay-credit dates to today"
          - when: "not the payout of delay credits, and the order-cancellation credits applied in those 3 months total exactly the refunds"
            method: "the late-posting days are counted in calendar days from the latest of those cancellation-credit dates to today"
          - when: "otherwise"
            method: "the late-posting days are counted in calendar days from the latest refund date to today"
        baseline:
          days_late: "DAYS(refund_date, NOW)"
        evidence: [cross_category, date]
        cross_difficulty: special
      - id: flat_courtesy
        effect: parameter
        decides: flat_courtesy
        bindings: [flat_courtesy]
        ladder:
          - when: "30 or more calendar days have passed from the latest refund date to today"
            value: "K('flat_month_usd')"
          - when: "14 to 29 calendar days have passed from the latest refund date to today"
            value: "K('flat_fortnight_usd')"
          - when: "otherwise (fewer than 14 days)"
            value: "0"
        baseline:
          flat_courtesy: "0"
        evidence: [date]
        cross_difficulty: null
      - id: allowance_multiplier
        effect: parameter
        decides: allowance_multiplier
        bindings: [so_spend, allowance_multiplier]
        ladder:
          - when: "the account's special-order purchases in the last 12 months total 5,000.00 or more"
            value: "K('mult_high')"
          - when: "they total 1,500.00 or more but less than 5,000.00"
            value: "K('mult_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          allowance_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The return credit posted is the uncredited refund plus a late-posting allowance, rounded to the nearest cent.
        The uncredited refund is the total of the special order refunds issued to the Ridgeline Consumer Credit tender in the customer's name in the last 3 months (dated less than 3 full months before today), less the return credits posted on the account in the same 3 months, and never below zero.
        As the standard computation, the late-posting allowance is the uncredited refund multiplied by 6 percent a year and by the calendar days from the latest of those refund dates to today, divided by 365 and rounded to the nearest cent.
      params: [refund_window_months, allowance_rate_base_pct, day_basis]
    inputs:
      history:
        - {category: special, table: special_order_events, aggregate: sum, field: amount, within_months: 3, filters: {event_type: special_refund_issued, refund_method: ridgeline_consumer_credit}}
        - {category: special, table: special_order_events, aggregate: latest, field: event_date, filters: {event_type: special_credit_applied}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: card_return_credit_posted}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase_posted, purchase_channel: special_order}}
      cross_category: [special]

  - id: card_ext_promo_autopay
    base_policy_refs: [card_autopay_management, card_evt_promo_financing, card_evt_payment_allocation]
    overwrite: []
    trigger: on_request
    subject: [card_autopay_changed]
    computes: autopay_fixed_amount
    target_tool: set_autopay_payoff_plan_7f80aff1
    params:
      risk_months: 12
      half: 0.5
      three_quarter: 0.75
      long_tenure_months: 36
      mid_tenure_months: 12
      margin_long_pct: 1.0
      margin_mid_pct: 2.5
      margin_std_pct: 5.0
      recent_months: 3
      addon_threshold_usd: 500.0
      addon_high_usd: 40.0
      addon_low_usd: 20.0
      open_order_threshold_usd: 1000.0
      cushion_high_usd: 50.0
      cushion_low_usd: 25.0
    rule: >-
      A cardholder who asks for automatic payments that pay off the account's deferred-interest balance before its promotion ends is enrolled in autopay with the fixed-amount option, and the fixed draft amount is the plan amount worked out here; each draft is then the greater of that fixed amount and the minimum payment due, as the autopay terms provide.
      The plan's fixed draft amount is not worked out until every special order refund issued to the Ridgeline Consumer Credit tender in the customer's name in the last 3 months stands on the account as a return credit.
      The deferred-interest balance is the posted amount of every purchase on a 6, 12 or 24 month deferred-interest plan, less every return credit carrying one of those plan codes, less every payment the account records as allocated to a deferred-interest balance at the cardholder's request or within a promotion's expiry window, each such payment counted at its full amount, and never below zero.
      The plan's end date is the earliest, across the deferred-interest plans the account carries, of the promotional end date of the most recently posted purchase on that plan.
      The plan's due dates are the monthly payment due dates on the same day of the month as the latest statement's due date, from the first one after today through the plan's end date; the latest statement's due date itself counts only when it falls after today.
      As the standard computation, the fixed draft amount is the deferred-interest balance increased by 5 percent and divided by the number of the plan's due dates, rounded up to the next whole dollar.
      In general the fixed draft amount is worked out in this order: first the deferred-interest balance is increased by the plan margin percentage; then that figure is divided by the number of plan drafts and rounded up to the next whole dollar; then the spending add-on and the open-order cushion are added to that whole-dollar figure.
      The number of plan drafts is the number of the plan's due dates halved and rounded up to a whole number when a payment on the account was returned unpaid in the last 12 months (dated less than 12 full months before today); it is that number multiplied by 0.75 and rounded down to a whole number when no payment was returned unpaid in the last 12 months but a late fee was charged on the account in that time; otherwise it is the full number of the plan's due dates; it is never fewer than 1.
      The plan margin is 1 percent on a Preferred or Premier card open 36 full months or more, 2.5 percent on a Preferred or Premier card open at least 12 but fewer than 36 full months, and 5 percent on every other account.
      The spending add-on is 40.00 when the account's standard-plan purchases in the last 3 months (dated less than 3 full months before today) total 500.00 or more, 20.00 when they total more than zero but less than 500.00, and nothing when there are none.
      The open-order cushion is 50.00 when the balance due on the customer's special orders that are in production, shipped or ready totals 1,000.00 or more, 25.00 when that balance due is more than zero but less than 1,000.00, and nothing when there is none.
    prerequisite:
      - problem: card_ext_refund_credit
        kind: value_input
        gate: promo_credits
        form: state
        policy_source: >-
          The plan's fixed draft amount is not worked out until every special order refund issued to the Ridgeline Consumer Credit tender in the customer's name in the last 3 months stands on the account as a return credit.
        condition: >-
          For every special order refund issued to the Ridgeline Consumer Credit tender in the customer's name in the last 3 months, the account carries a return credit posted in that window, so the uncredited refund is zero.
        resolved_by: post_refund_return_credit_59e816eb
        effect: >-
          The return credit posted against the deferred-interest purchase carries that purchase's deferred plan code, so the return credits on deferred-interest plans grow by the credit amount and the deferred-interest balance the plan divides falls by the same amount.
    cross_category:
      - category: special
        as: branch
        reads: [balance_due, status]
        note: The open-order cushion (a cross-difficulty parameter factor) is decided from the balance due on the customer's special orders in production, shipped or ready.
    compute:
      - promo_posted: "SUM('card_transactions','amount', event_type='card_purchase_posted', plan_code='deferred_6') + SUM('card_transactions','amount', event_type='card_purchase_posted', plan_code='deferred_12') + SUM('card_transactions','amount', event_type='card_purchase_posted', plan_code='deferred_24')"
      - promo_credits: "SUM('card_transactions','amount', event_type='card_return_credit_posted', plan_code='deferred_6') + SUM('card_transactions','amount', event_type='card_return_credit_posted', plan_code='deferred_12') + SUM('card_transactions','amount', event_type='card_return_credit_posted', plan_code='deferred_24')"
      - promo_payments: "SUM('card_transactions','amount', event_type='card_payment_posted', excess_allocation='deferred_promo_requested') + SUM('card_transactions','amount', event_type='card_payment_posted', excess_allocation='promo_expiry_window')"
      - promo_balance: "MX(0, RND(promo_posted - promo_credits - promo_payments, 2))"
      - end6: "LATEST('card_transactions','promo_end_date', date_field='transaction_date', event_type='card_purchase_posted', plan_code='deferred_6')"
      - end12: "LATEST('card_transactions','promo_end_date', date_field='transaction_date', event_type='card_purchase_posted', plan_code='deferred_12')"
      - end24: "LATEST('card_transactions','promo_end_date', date_field='transaction_date', event_type='card_purchase_posted', plan_code='deferred_24')"
      - plan_end: "MN(end6 if end6 else '9999-12-31', end12 if end12 else '9999-12-31', end24 if end24 else '9999-12-31')"
      - latest_due: "LATEST('card_transactions','due_date', date_field='statement_date', event_type='card_statement_issued')"
      - due_dates_total: "MX(0, MONTHS(latest_due, plan_end) + 1 - (0 if DAYS(NOW, latest_due) > 0 else 1))"
      - returned_12: "COUNT('card_transactions', within_months=K('risk_months'), date_field='transaction_date', event_type='card_payment_returned')"
      - late_12: "COUNT('card_transactions', within_months=K('risk_months'), date_field='transaction_date', event_type='card_fee_assessed', fee_type='late_fee')"
      - drafts: "MX(1, -((-(due_dates_total * K('half'))) // 1)) if returned_12 >= 1 else (MX(1, int(due_dates_total * K('three_quarter'))) if late_12 >= 1 else MX(1, due_dates_total))"
      - plan_tenure: "MONTHS(F('opened_date'), NOW)"
      - margin_pct: "K('margin_long_pct') if ((F('variant_name') == 'Ridgeline Consumer Credit Card Preferred' or F('variant_name') == 'Ridgeline Consumer Credit Card Premier') and plan_tenure >= K('long_tenure_months')) else (K('margin_mid_pct') if ((F('variant_name') == 'Ridgeline Consumer Credit Card Preferred' or F('variant_name') == 'Ridgeline Consumer Credit Card Premier') and plan_tenure >= K('mid_tenure_months')) else K('margin_std_pct'))"
      - recent_standard: "SUM('card_transactions','amount', within_months=K('recent_months'), date_field='transaction_date', event_type='card_purchase_posted', plan_code='revolving_standard')"
      - addon: "K('addon_high_usd') if recent_standard >= K('addon_threshold_usd') else (K('addon_low_usd') if recent_standard > 0 else 0)"
      - open_order_due: "(CFIELD('special','balance_due', status='in_production') or 0) + (CFIELD('special','balance_due', status='shipped') or 0) + (CFIELD('special','balance_due', status='ready') or 0)"
      - cushion: "K('cushion_high_usd') if open_order_due >= K('open_order_threshold_usd') else (K('cushion_low_usd') if open_order_due > 0 else 0)"
      - whole_dollar_draft: "-((-(promo_balance * (1 + margin_pct / 100) / drafts)) // 1)"
      - result: "RND(whole_dollar_draft + addon + cushion, 2)"
    compute_basis:
      promo_posted: "The deferred-interest balance is the posted amount of every purchase on a 6, 12 or 24 month deferred-interest plan"
      promo_credits: "less every return credit carrying one of those plan codes"
      promo_payments: "less every payment the account records as allocated to a deferred-interest balance at the cardholder's request or within a promotion's expiry window, each such payment counted at its full amount"
      promo_balance: "and never below zero."
      end6: "the promotional end date of the most recently posted purchase on that plan."
      end12: "the promotional end date of the most recently posted purchase on that plan."
      end24: "the promotional end date of the most recently posted purchase on that plan."
      plan_end: "The plan's end date is the earliest, across the deferred-interest plans the account carries, of the promotional end date of the most recently posted purchase on that plan."
      latest_due: "the monthly payment due dates on the same day of the month as the latest statement's due date"
      due_dates_total: "from the first one after today through the plan's end date; the latest statement's due date itself counts only when it falls after today."
      returned_12: "when a payment on the account was returned unpaid in the last 12 months (dated less than 12 full months before today)"
      late_12: "but a late fee was charged on the account in that time"
      drafts: "The number of plan drafts is the number of the plan's due dates halved and rounded up to a whole number when a payment on the account was returned unpaid in the last 12 months (dated less than 12 full months before today); it is that number multiplied by 0.75 and rounded down to a whole number when no payment was returned unpaid in the last 12 months but a late fee was charged on the account in that time; otherwise it is the full number of the plan's due dates; it is never fewer than 1."
      plan_tenure: "open 36 full months or more"
      margin_pct: "The plan margin is 1 percent on a Preferred or Premier card open 36 full months or more, 2.5 percent on a Preferred or Premier card open at least 12 but fewer than 36 full months, and 5 percent on every other account."
      recent_standard: "the account's standard-plan purchases in the last 3 months (dated less than 3 full months before today)"
      addon: "The spending add-on is 40.00 when the account's standard-plan purchases in the last 3 months (dated less than 3 full months before today) total 500.00 or more, 20.00 when they total more than zero but less than 500.00, and nothing when there are none."
      open_order_due: "the balance due on the customer's special orders that are in production, shipped or ready"
      cushion: "The open-order cushion is 50.00 when the balance due on the customer's special orders that are in production, shipped or ready totals 1,000.00 or more, 25.00 when that balance due is more than zero but less than 1,000.00, and nothing when there is none."
      whole_dollar_draft: "first the deferred-interest balance is increased by the plan margin percentage; then that figure is divided by the number of plan drafts and rounded up to the next whole dollar"
      result: "then the spending add-on and the open-order cushion are added to that whole-dollar figure."
    factors:
      - id: plan_horizon
        effect: method
        decides: drafts
        bindings: [returned_12, late_12, drafts]
        ladder:
          - when: "a payment on the account was returned unpaid in the last 12 months"
            method: "the drafts are the plan's due dates halved and rounded up to a whole number, never fewer than 1"
          - when: "no payment returned unpaid in the last 12 months, but a late fee was charged in that time"
            method: "the drafts are the plan's due dates multiplied by 0.75 and rounded down to a whole number, never fewer than 1"
          - when: "otherwise"
            method: "the drafts are every one of the plan's due dates through the plan's end date"
        baseline:
          drafts: "MX(1, due_dates_total)"
        evidence: [history]
        cross_difficulty: null
      - id: plan_margin
        effect: parameter
        decides: margin_pct
        bindings: [plan_tenure, margin_pct]
        ladder:
          - when: "a Preferred or Premier card open 36 full months or more"
            value: "K('margin_long_pct')"
          - when: "a Preferred or Premier card open at least 12 but fewer than 36 full months"
            value: "K('margin_mid_pct')"
          - when: "otherwise"
            value: "K('margin_std_pct')"
        baseline:
          margin_pct: "K('margin_std_pct')"
        evidence: [tier_param, date]
        cross_difficulty: null
      - id: spending_addon
        effect: parameter
        decides: addon
        bindings: [recent_standard, addon]
        ladder:
          - when: "standard-plan purchases in the last 3 months total 500.00 or more"
            value: "K('addon_high_usd')"
          - when: "standard-plan purchases in the last 3 months total more than zero but less than 500.00"
            value: "K('addon_low_usd')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          addon: "0"
        evidence: [history]
        cross_difficulty: null
      - id: open_order_cushion
        effect: parameter
        decides: cushion
        bindings: [open_order_due, cushion]
        ladder:
          - when: "the customer's special orders in production, shipped or ready carry a balance due totalling 1,000.00 or more"
            value: "K('cushion_high_usd')"
          - when: "that balance due is more than zero but less than 1,000.00"
            value: "K('cushion_low_usd')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          cushion: "0"
        evidence: [cross_category]
        cross_difficulty: special
    baseline:
      rule: >-
        The deferred-interest balance is the posted amount of every purchase on a 6, 12 or 24 month deferred-interest plan, less every return credit carrying one of those plan codes, less every payment the account records as allocated to a deferred-interest balance at the cardholder's request or within a promotion's expiry window, each such payment counted at its full amount, and never below zero.
        The plan's end date is the earliest, across the deferred-interest plans the account carries, of the promotional end date of the most recently posted purchase on that plan.
        The plan's due dates are the monthly payment due dates on the same day of the month as the latest statement's due date, from the first one after today through the plan's end date; the latest statement's due date itself counts only when it falls after today.
        As the standard computation, the fixed draft amount is the deferred-interest balance increased by 5 percent and divided by the number of the plan's due dates, rounded up to the next whole dollar.
      params: [margin_std_pct]
    inputs:
      history:
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: card_purchase_posted, plan_code: deferred_12}}
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: card_return_credit_posted, plan_code: deferred_12}}
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: card_payment_posted, excess_allocation: deferred_promo_requested}}
        - {table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 12, filters: {event_type: card_fee_assessed, fee_type: late_fee}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: card_purchase_posted, plan_code: revolving_standard}}
      cross_category: [special]

  - id: card_ext_late_fee
    base_policy_refs: [card_evt_late_fee, card_evt_payment_posting, card_evt_returned_payment]
    overwrite:
      - base_policy: card_evt_late_fee
        superseded_clause: >-
          The fee is late_fee_repeat_usd when card_msr_late_fees_lookback_cycles (late fees in the late_fee_repeat_lookback_cycles statement periods before this one) is one or more, and late_fee_first_usd otherwise; when late_fee_capped_at_min_due is true the fee is the lower of that amount and the statement's minimum payment due.
        replaced_by: >-
          In general the late fee is worked out in this order: first the fee level and the balance add-on are added; then the lapse treatment is applied to that sum; then the project relief is subtracted; then, on a tier whose late fee is capped at the minimum payment due, the result is limited to the latest statement's minimum payment due; the late fee is never below zero and is kept to the cent.
    trigger: state_due
    subject: [card_fee_assessed]
    computes: amount
    target_tool: post_missed_payment_late_fee_0b17ca39
    params:
      lookback_months: 6
      clean_months: 24
      long_tenure_months: 60
      established_fee_usd: 25.0
      balance_high_usd: 5000.0
      balance_mid_usd: 1000.0
      balance_add_high_usd: 4.0
      balance_add_mid_usd: 2.0
      autopay_months: 6
      lapse_high_count: 5
      lapse_mid_count: 3
      half: 0.5
      three_quarter: 0.75
      project_months: 12
      relief_major_count: 3
      relief_major_usd: 4.0
      relief_minor_usd: 2.0
    rule: >-
      When the payments credited from a statement's date through its due date total less than that statement's minimum payment due, one late fee is owed for that statement period; it posts on the day after the due date, references the statement and carries that statement's period.
      The figures used are those of the latest statement issued, and every count below covers the account's own ledger lines dated less than the stated number of full months before today.
      As the standard computation, the late fee is the tier's first late fee, limited to the latest statement's minimum payment due on a tier whose late fee is capped at the minimum payment due.
      In general the late fee is worked out in this order: first the fee level and the balance add-on are added; then the lapse treatment is applied to that sum; then the project relief is subtracted; then, on a tier whose late fee is capped at the minimum payment due, the result is limited to the latest statement's minimum payment due; the late fee is never below zero and is kept to the cent.
      The fee level is the tier's repeat late fee when a late fee was charged or a payment was returned unpaid on the account in the last 6 months; it is 25.00 when no late fee was charged in the last 24 months, no payment was returned unpaid in the last 6 months and the account has been open 60 full months or more; otherwise it is the tier's first late fee.
      The balance add-on is 4.00 when the latest statement balance is 5,000.00 or more, 2.00 when it is 1,000.00 or more but less than 5,000.00, and nothing when it is less than 1,000.00.
      The lapse treatment depends on how the account was being paid: when 5 or more of the payments credited in the last 6 months were autopay drafts, the sum of the fee level and the balance add-on is halved and rounded down to a whole dollar; when 3 or 4 of them were, that sum is multiplied by 0.75 and rounded up to a whole dollar; otherwise that sum is taken as it stands.
      The project relief is 4.00 when 3 or more payments toward the customer's Ridgeline installation contracts were charged to Ridgeline Consumer Credit in the last 12 months, 2.00 when 1 or 2 were, and nothing when none were.
    prerequisite: []
    cross_category:
      - category: install
        as: history
        reads: [install_charges.event_type, install_charges.payment_method, install_charges.charge_date]
        note: The project relief (a cross-difficulty parameter factor) is decided from the count of the customer's installation-contract payments charged to Ridgeline Consumer Credit in the last 12 months.
    compute:
      - late_6: "COUNT('card_transactions', within_months=K('lookback_months'), date_field='transaction_date', event_type='card_fee_assessed', fee_type='late_fee')"
      - returned_6: "COUNT('card_transactions', within_months=K('lookback_months'), date_field='transaction_date', event_type='card_payment_returned')"
      - late_24: "COUNT('card_transactions', within_months=K('clean_months'), date_field='transaction_date', event_type='card_fee_assessed', fee_type='late_fee')"
      - fee_tenure: "MONTHS(F('opened_date'), NOW)"
      - fee_level: "P('late_fee_repeat_usd') if (late_6 >= 1 or returned_6 >= 1) else (K('established_fee_usd') if (late_24 == 0 and returned_6 == 0 and fee_tenure >= K('long_tenure_months')) else P('late_fee_first_usd'))"
      - stmt_balance: "LATEST('card_transactions','statement_balance', date_field='statement_date', event_type='card_statement_issued')"
      - balance_add: "K('balance_add_high_usd') if stmt_balance >= K('balance_high_usd') else (K('balance_add_mid_usd') if stmt_balance >= K('balance_mid_usd') else 0)"
      - autopay_6: "COUNT('card_transactions', within_months=K('autopay_months'), date_field='transaction_date', event_type='card_payment_posted', payment_channel='autopay')"
      - lapse_fee: "int((fee_level + balance_add) * K('half')) if autopay_6 >= K('lapse_high_count') else (-((-((fee_level + balance_add) * K('three_quarter'))) // 1) if autopay_6 >= K('lapse_mid_count') else (fee_level + balance_add))"
      - project_payments: "XCOUNT('install','install_charges', within_months=K('project_months'), date_field='charge_date', event_type='install_payment_received', payment_method='ridgeline_consumer_credit')"
      - project_relief: "K('relief_major_usd') if project_payments >= K('relief_major_count') else (K('relief_minor_usd') if project_payments >= 1 else 0)"
      - min_due: "LATEST('card_transactions','minimum_payment_due', date_field='statement_date', event_type='card_statement_issued')"
      - relieved: "lapse_fee - project_relief"
      - result: "RND(MX(0, MN(relieved, min_due) if P('late_fee_capped_at_min_due') else relieved), 2)"
    compute_basis:
      late_6: "when a late fee was charged or a payment was returned unpaid on the account in the last 6 months"
      returned_6: "or a payment was returned unpaid on the account in the last 6 months"
      late_24: "when no late fee was charged in the last 24 months"
      fee_tenure: "the account has been open 60 full months or more"
      fee_level: "The fee level is the tier's repeat late fee when a late fee was charged or a payment was returned unpaid on the account in the last 6 months; it is 25.00 when no late fee was charged in the last 24 months, no payment was returned unpaid in the last 6 months and the account has been open 60 full months or more; otherwise it is the tier's first late fee."
      stmt_balance: "The figures used are those of the latest statement issued"
      balance_add: "The balance add-on is 4.00 when the latest statement balance is 5,000.00 or more, 2.00 when it is 1,000.00 or more but less than 5,000.00, and nothing when it is less than 1,000.00."
      autopay_6: "when 5 or more of the payments credited in the last 6 months were autopay drafts"
      lapse_fee: "when 5 or more of the payments credited in the last 6 months were autopay drafts, the sum of the fee level and the balance add-on is halved and rounded down to a whole dollar; when 3 or 4 of them were, that sum is multiplied by 0.75 and rounded up to a whole dollar; otherwise that sum is taken as it stands."
      project_payments: "payments toward the customer's Ridgeline installation contracts were charged to Ridgeline Consumer Credit in the last 12 months"
      project_relief: "The project relief is 4.00 when 3 or more payments toward the customer's Ridgeline installation contracts were charged to Ridgeline Consumer Credit in the last 12 months, 2.00 when 1 or 2 were, and nothing when none were."
      min_due: "limited to the latest statement's minimum payment due"
      relieved: "then the project relief is subtracted"
      result: "then, on a tier whose late fee is capped at the minimum payment due, the result is limited to the latest statement's minimum payment due; the late fee is never below zero and is kept to the cent."
    factors:
      - id: fee_level
        effect: parameter
        decides: fee_level
        bindings: [late_6, returned_6, late_24, fee_tenure, fee_level]
        ladder:
          - when: "a late fee was charged or a payment was returned unpaid on the account in the last 6 months"
            value: "P('late_fee_repeat_usd')"
          - when: "no late fee in the last 24 months, no payment returned unpaid in the last 6 months, and the account open 60 full months or more"
            value: "K('established_fee_usd')"
          - when: "otherwise"
            value: "P('late_fee_first_usd')"
        baseline:
          fee_level: "P('late_fee_first_usd')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: balance_addon
        effect: parameter
        decides: balance_add
        bindings: [stmt_balance, balance_add]
        ladder:
          - when: "the latest statement balance is 5,000.00 or more"
            value: "K('balance_add_high_usd')"
          - when: "the latest statement balance is 1,000.00 or more but less than 5,000.00"
            value: "K('balance_add_mid_usd')"
          - when: "otherwise (less than 1,000.00)"
            value: "0"
        baseline:
          balance_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: lapse_treatment
        effect: method
        decides: lapse_fee
        bindings: [autopay_6, lapse_fee]
        ladder:
          - when: "5 or more of the payments credited in the last 6 months were autopay drafts"
            method: "the fee level plus the balance add-on is halved and rounded down to a whole dollar"
          - when: "3 or 4 of the payments credited in the last 6 months were autopay drafts"
            method: "the fee level plus the balance add-on is multiplied by 0.75 and rounded up to a whole dollar"
          - when: "otherwise"
            method: "the fee level plus the balance add-on is taken as it stands"
        baseline:
          lapse_fee: "fee_level + balance_add"
        evidence: [history]
        cross_difficulty: null
      - id: project_relief
        effect: parameter
        decides: project_relief
        bindings: [project_payments, project_relief]
        ladder:
          - when: "3 or more installation-contract payments charged to Ridgeline Consumer Credit in the last 12 months"
            value: "K('relief_major_usd')"
          - when: "1 or 2 such payments in the last 12 months"
            value: "K('relief_minor_usd')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          project_relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: install
    baseline:
      rule: >-
        The figures used are those of the latest statement issued, and every count below covers the account's own ledger lines dated less than the stated number of full months before today.
        As the standard computation, the late fee is the tier's first late fee, limited to the latest statement's minimum payment due on a tier whose late fee is capped at the minimum payment due.
      params: [late_fee_first_usd, late_fee_capped_at_min_due]
    inputs:
      history:
        - {table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 6, filters: {event_type: card_fee_assessed, fee_type: late_fee}}
        - {table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 6, filters: {event_type: card_payment_posted, payment_channel: autopay}}
        - {table: card_transactions, aggregate: latest, field: statement_balance, filters: {event_type: card_statement_issued}}
        - {category: install, table: install_charges, aggregate: count, field: install_charge_id, within_months: 12, filters: {event_type: install_payment_received, payment_method: ridgeline_consumer_credit}}
      cross_category: [install]

  - id: card_ext_good_standing_payment
    base_policy_refs: [card_evt_payment_posting, card_evt_payment_allocation, card_evt_statement_minimum, card_evt_billing_dispute]
    overwrite: []
    trigger: on_request
    subject: [card_payment_posted]
    computes: amount
    target_tool: authorize_phone_payment_1fdda3b1
    params:
      period_months: 1
      util_low_pct: 25.0
      util_mid_pct: 50.0
      bridge_low_pct: 6.0
      bridge_mid_pct: 13.5
      gap_far_days: 30
      gap_near_days: 15
      no_payment_gap_days: 9999
      return_window_months: 24
      cushion_two_count: 2
      cushion_two_usd: 25.0
      cushion_one_usd: 10.0
      day_basis: 365
    rule: >-
      A cardholder who missed a minimum payment and asks to pay what returns the account to good standing makes one payment of the good-standing amount, authorizing the debit from the bank account they name; the latest statement's figures are those of the most recent statement issued, and a payment or a late fee counts as being in the last month when it is dated less than one full month before today.
      The good-standing amount is fixed only after the late fee owed for the missed due date stands on the account.
      As the standard computation, the good-standing amount is the unpaid minimum plus the late fees posted in the last month plus the interest bridge, rounded to the nearest cent, where the unpaid minimum is the latest statement's minimum payment due less the payments credited in the last month, never below zero, and the interest bridge is the unpaid minimum multiplied by the account's purchase APR divided by 100 and by the calendar days from the latest statement's due date to today, divided by 365 and rounded to the nearest cent.
      In general the owed minimum, the bridge rate and the bridge days are set as follows, the unpaid minimum is the owed minimum less the payments credited in the last month, never below zero, the interest bridge is the unpaid minimum multiplied by the bridge rate divided by 100 and by the bridge days, divided by 365 and rounded to the nearest cent, and the good-standing amount is the unpaid minimum plus the late fees posted in the last month plus the interest bridge plus the re-presentment cushion, rounded to the nearest cent.
      The owed minimum on a revolving card (a tier with a minimum-payment percentage above zero) is recomputed when a billing dispute on the account is still open (submitted and not yet decided): the minimum-payment formula is applied to the latest statement balance less the open disputed amounts, giving the greater of the tier's minimum payment floor (or that reduced balance itself when it is smaller) and the tier's minimum-payment percentage of that reduced balance rounded to the nearest cent, plus the latest statement's past-due amount; with no open dispute but return credits posted in the last month, it is recomputed the same way on the latest statement balance less those credits; otherwise the owed minimum is the latest statement's minimum payment due.
      The bridge rate is 6 percent a year when the latest statement balance is under 25 percent of the credit line, 13.5 percent a year when it is at least 25 but under 50 percent of the credit line, and the account's purchase APR otherwise.
      The bridge days are counted in calendar days to today: from the latest statement date when no payment has ever been credited or the most recent payment credited came more than 30 days before the latest statement's due date; from the date of that most recent payment when it came 15 to 30 days before that due date; otherwise from that due date.
      The re-presentment cushion is 25.00 when 2 or more payments on the account were returned unpaid in the last 24 months (dated less than 24 full months before today), 10.00 when 1 was, and nothing when none was.
    prerequisite:
      - problem: card_ext_late_fee
        kind: value_input
        gate: period_late_fee
        form: state
        policy_source: >-
          The good-standing amount is fixed only after the late fee owed for the missed due date stands on the account.
        condition: >-
          The account carries a late fee line for the statement period whose due date passed with its minimum unpaid, so the late fees posted in the last month include it.
        resolved_by: post_missed_payment_late_fee_0b17ca39
        effect: >-
          The late fee line written for the missed due date is dated today, so the late fees posted in the last month rise by its amount and the good-standing amount rises by the same amount.
    cross_category: []
    compute:
      - stmt_bal: "LATEST('card_transactions','statement_balance', date_field='statement_date', event_type='card_statement_issued')"
      - stmt_min: "LATEST('card_transactions','minimum_payment_due', date_field='statement_date', event_type='card_statement_issued')"
      - stmt_past_due: "LATEST('card_transactions','past_due_amount', date_field='statement_date', event_type='card_statement_issued')"
      - stmt_date: "LATEST('card_transactions','statement_date', date_field='statement_date', event_type='card_statement_issued')"
      - stmt_due: "LATEST('card_transactions','due_date', date_field='statement_date', event_type='card_statement_issued')"
      - open_disputed: "SUM('card_requests','disputed_amount', date_field='created_at', request_type='billing_dispute', status='submitted')"
      - recent_credits: "SUM('card_transactions','amount', within_months=K('period_months'), date_field='transaction_date', event_type='card_return_credit_posted')"
      - owed_minimum: "(MX(MN(P('min_payment_floor_usd'), stmt_bal - open_disputed), RND((stmt_bal - open_disputed) * P('min_payment_pct_of_balance') / 100, 2)) + stmt_past_due) if (open_disputed > 0 and P('min_payment_pct_of_balance') > 0) else ((MX(MN(P('min_payment_floor_usd'), stmt_bal - recent_credits), RND((stmt_bal - recent_credits) * P('min_payment_pct_of_balance') / 100, 2)) + stmt_past_due) if (recent_credits > 0 and P('min_payment_pct_of_balance') > 0) else stmt_min)"
      - paid_since: "SUM('card_transactions','amount', within_months=K('period_months'), date_field='transaction_date', event_type='card_payment_posted')"
      - unpaid_min: "MX(0, RND(owed_minimum - paid_since, 2))"
      - period_late_fee: "SUM('card_transactions','amount', within_months=K('period_months'), date_field='transaction_date', event_type='card_fee_assessed', fee_type='late_fee')"
      - utilization_pct: "RND(LATEST('card_transactions','statement_balance', date_field='statement_date', event_type='card_statement_issued') / F('credit_limit') * 100, 2)"
      - bridge_rate_pct: "K('bridge_low_pct') if utilization_pct < K('util_low_pct') else (K('bridge_mid_pct') if utilization_pct < K('util_mid_pct') else P('purchase_apr_pct'))"
      - last_payment_date: "LATEST('card_transactions','transaction_date', date_field='transaction_date', event_type='card_payment_posted')"
      - payment_gap: "DAYS(last_payment_date, stmt_due) if last_payment_date else K('no_payment_gap_days')"
      - bridge_days: "DAYS(stmt_date, NOW) if payment_gap > K('gap_far_days') else (DAYS(last_payment_date, NOW) if payment_gap >= K('gap_near_days') else DAYS(stmt_due, NOW))"
      - interest_bridge: "RND(unpaid_min * bridge_rate_pct / 100 * bridge_days / K('day_basis'), 2)"
      - returned_24: "COUNT('card_transactions', within_months=K('return_window_months'), date_field='transaction_date', event_type='card_payment_returned')"
      - cushion: "K('cushion_two_usd') if returned_24 >= K('cushion_two_count') else (K('cushion_one_usd') if returned_24 >= 1 else 0)"
      - result: "RND(unpaid_min + period_late_fee + interest_bridge + cushion, 2)"
    compute_basis:
      stmt_bal: "the latest statement's figures are those of the most recent statement issued"
      stmt_min: "otherwise the owed minimum is the latest statement's minimum payment due."
      stmt_past_due: "plus the latest statement's past-due amount"
      stmt_date: "from the latest statement date"
      stmt_due: "otherwise from that due date."
      open_disputed: "when a billing dispute on the account is still open (submitted and not yet decided)"
      recent_credits: "with no open dispute but return credits posted in the last month"
      owed_minimum: "The owed minimum on a revolving card (a tier with a minimum-payment percentage above zero) is recomputed when a billing dispute on the account is still open (submitted and not yet decided): the minimum-payment formula is applied to the latest statement balance less the open disputed amounts, giving the greater of the tier's minimum payment floor (or that reduced balance itself when it is smaller) and the tier's minimum-payment percentage of that reduced balance rounded to the nearest cent, plus the latest statement's past-due amount; with no open dispute but return credits posted in the last month, it is recomputed the same way on the latest statement balance less those credits; otherwise the owed minimum is the latest statement's minimum payment due."
      paid_since: "a payment or a late fee counts as being in the last month when it is dated less than one full month before today."
      unpaid_min: "the unpaid minimum is the owed minimum less the payments credited in the last month, never below zero"
      period_late_fee: "plus the late fees posted in the last month"
      utilization_pct: "when the latest statement balance is under 25 percent of the credit line"
      bridge_rate_pct: "The bridge rate is 6 percent a year when the latest statement balance is under 25 percent of the credit line, 13.5 percent a year when it is at least 25 but under 50 percent of the credit line, and the account's purchase APR otherwise."
      last_payment_date: "the most recent payment credited"
      payment_gap: "when no payment has ever been credited or the most recent payment credited came more than 30 days before the latest statement's due date"
      bridge_days: "The bridge days are counted in calendar days to today: from the latest statement date when no payment has ever been credited or the most recent payment credited came more than 30 days before the latest statement's due date; from the date of that most recent payment when it came 15 to 30 days before that due date; otherwise from that due date."
      interest_bridge: "the interest bridge is the unpaid minimum multiplied by the bridge rate divided by 100 and by the bridge days, divided by 365 and rounded to the nearest cent"
      returned_24: "when 2 or more payments on the account were returned unpaid in the last 24 months (dated less than 24 full months before today)"
      cushion: "The re-presentment cushion is 25.00 when 2 or more payments on the account were returned unpaid in the last 24 months (dated less than 24 full months before today), 10.00 when 1 was, and nothing when none was."
      result: "the good-standing amount is the unpaid minimum plus the late fees posted in the last month plus the interest bridge plus the re-presentment cushion, rounded to the nearest cent."
    factors:
      - id: owed_minimum_basis
        effect: method
        decides: owed_minimum
        bindings: [open_disputed, recent_credits, owed_minimum]
        ladder:
          - when: "a revolving card with a billing dispute still open (submitted, not yet decided)"
            method: "the minimum-payment formula is re-applied to the latest statement balance less the open disputed amounts, plus the past-due amount"
          - when: "no open dispute, but return credits posted in the last month"
            method: "the minimum-payment formula is re-applied to the latest statement balance less those credits, plus the past-due amount"
          - when: "otherwise"
            method: "the latest statement's printed minimum payment due is used"
        baseline:
          owed_minimum: "stmt_min"
        evidence: [history]
        cross_difficulty: null
      - id: bridge_rate
        effect: parameter
        decides: bridge_rate_pct
        bindings: [utilization_pct, bridge_rate_pct]
        ladder:
          - when: "the latest statement balance is under 25 percent of the credit line"
            value: "K('bridge_low_pct')"
          - when: "it is at least 25 but under 50 percent of the credit line"
            value: "K('bridge_mid_pct')"
          - when: "otherwise"
            value: "P('purchase_apr_pct')"
        baseline:
          bridge_rate_pct: "P('purchase_apr_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: bridge_days
        effect: method
        decides: bridge_days
        bindings: [last_payment_date, payment_gap, bridge_days]
        ladder:
          - when: "no payment ever credited, or the most recent payment came more than 30 days before the latest statement's due date"
            method: "the bridge days run from the latest statement date to today"
          - when: "the most recent payment came 15 to 30 days before that due date"
            method: "the bridge days run from the date of that payment to today"
          - when: "otherwise"
            method: "the bridge days run from the latest statement's due date to today"
        baseline:
          bridge_days: "DAYS(stmt_due, NOW)"
        evidence: [history, date]
        cross_difficulty: null
      - id: representment_cushion
        effect: parameter
        decides: cushion
        bindings: [returned_24, cushion]
        ladder:
          - when: "2 or more payments returned unpaid in the last 24 months"
            value: "K('cushion_two_usd')"
          - when: "exactly 1 payment returned unpaid in the last 24 months"
            value: "K('cushion_one_usd')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          cushion: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        As the standard computation, the good-standing amount is the unpaid minimum plus the late fees posted in the last month plus the interest bridge, rounded to the nearest cent, where the unpaid minimum is the latest statement's minimum payment due less the payments credited in the last month, never below zero, and the interest bridge is the unpaid minimum multiplied by the account's purchase APR divided by 100 and by the calendar days from the latest statement's due date to today, divided by 365 and rounded to the nearest cent.
      params: [purchase_apr_pct, day_basis, period_months]
    inputs:
      history:
        - {table: card_transactions, aggregate: latest, field: minimum_payment_due, filters: {event_type: card_statement_issued}}
        - {table: card_requests, aggregate: sum, field: disputed_amount, filters: {request_type: billing_dispute, status: submitted}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: card_fee_assessed, fee_type: late_fee}}
        - {table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 24, filters: {event_type: card_payment_returned}}
      cross_category: []
