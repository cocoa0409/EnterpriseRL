# Ridgeline Consumer Credit — the household credit program (revolving card and project loan)
# issued for Ridgeline Home Center by its partner bank and serviced by Ridgeline Customer Care.
category: card
display_name: Ridgeline Consumer Credit

binding:
  holding_table: card_accounts
  event_tables: [card_transactions]
  intake_tables: [card_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: outstanding_balance}

lifecycle:
  states: [applied, active, suspended, closed, declined, charged_off]
  transitions:
    - {from: applied, to: active, by: system, means: The issuing bank approves the application, assigns the credit line or loan amount and opens the account.}
    - {from: applied, to: declined, by: system, means: The issuing bank declines the application; the account never opens.}
    - {from: active, to: suspended, by: system, means: Charging privileges are suspended because the account has reached the suspension days-past-due threshold.}
    - {from: suspended, to: active, by: system, means: Charging privileges are restored after the past-due amount is cleared and the required run of on-time payments is posted.}
    - {from: active, to: closed, by: user, means: The cardholder confirms closure of their own account; any balance is repaid under the existing terms.}
    - {from: suspended, to: closed, by: user, means: The cardholder confirms closure of a suspended account; the balance is repaid under the existing terms.}
    - {from: active, to: closed, by: system, means: The bank closes a revolving account that has had no purchase or payment activity for the inactivity period.}
    - {from: suspended, to: charged_off, by: system, means: The bank charges off the account once it reaches the charge-off days-past-due threshold.}

accounts:
  - key: outstanding_balance
    unit: USD
    meaning: Amount the cardholder owes on the account — purchases, loan draws, interest and fees in; payments, return credits, fee reversals and dispute credits out.

parameter_schema:
  credit_line_min_usd: Lowest credit line (revolving) or loan amount (project loan) the bank assigns at this tier, USD.
  credit_line_max_usd: Highest credit line or loan amount this tier can carry, including after any credit line increase, USD.
  purchase_apr_pct: Standard annual percentage rate on purchases (revolving, variable) or the fixed loan APR (project loan), percent per year.
  interest_day_count_basis: Number of days in the year used to turn the APR into a daily periodic rate, days.
  min_interest_charge_usd: Minimum interest charge — when computed interest for a statement period is above zero but below this amount, this amount is charged instead; 0 means no minimum, USD.
  grace_period_days: Days after the statement closing date by which paying the full statement balance avoids interest on new purchases; 0 means no grace period, days.
  statement_due_offset_days: Days from the statement closing date to the payment due date, calendar days.
  payment_cutoff_time_et: Eastern Time cutoff on a business day for a payment to be credited that day (HH:MM, 24-hour clock).
  min_payment_pct_of_balance: Percentage of the new statement balance used in the minimum payment calculation (revolving); 0 for an installment loan, percent.
  min_payment_floor_usd: Lowest minimum payment due on a revolving statement with a balance at or above it (a smaller balance is due in full); 0 for an installment loan, USD.
  min_payment_includes_past_due: Whether any unpaid past-due amount from the prior statement is added to the minimum payment due, boolean.
  late_fee_first_usd: Late fee when no other late fee was charged in the lookback cycles, USD.
  late_fee_repeat_usd: Late fee when another late fee was charged within the lookback cycles, USD.
  late_fee_repeat_lookback_cycles: Number of prior statement periods searched for an earlier late fee when choosing between the first and repeat late fee, statement periods.
  late_fee_capped_at_min_due: Whether a late fee may never exceed the minimum payment due on the statement it relates to, boolean.
  returned_payment_fee_usd: Fee charged when a payment is returned unpaid by the cardholder's bank, USD.
  single_event_fee_rule: Whether a late fee and a returned payment fee may not both be charged for the same missed payment (only the late fee is charged), boolean.
  courtesy_waiver_per_12_months: Number of courtesy late-fee waivers the account may receive in any rolling 12-month window, count.
  courtesy_waiver_min_months_on_book: Full months the account must have been open before a courtesy late-fee waiver can be granted, months.
  courtesy_waiver_request_window_days: Calendar days after a late fee posts during which a courtesy waiver may be requested, days.
  phone_agent_payment_fee_usd: Fee for a one-time payment taken by a phone representative (online and autopay payments are free), USD.
  deferred_6_min_purchase_usd: Minimum single qualifying purchase for 6-month deferred-interest financing, USD.
  deferred_6_available: Whether 6-month deferred-interest financing is offered on this tier, boolean.
  deferred_12_min_purchase_usd: Minimum single qualifying purchase for 12-month deferred-interest financing, USD.
  deferred_12_available: Whether 12-month deferred-interest financing is offered on this tier, boolean.
  deferred_24_min_purchase_usd: Minimum single qualifying purchase for 24-month deferred-interest financing, USD.
  deferred_24_available: Whether 24-month deferred-interest financing is offered on this tier, boolean.
  reduced_apr_84_min_purchase_usd: Minimum single qualifying purchase for 84 fixed monthly payments at the reduced APR, USD.
  reduced_apr_84_pct: Fixed reduced APR applied to an 84-month fixed-payment purchase, percent per year.
  reduced_apr_84_available: Whether 84-month reduced-APR financing is offered on this tier, boolean.
  everyday_discount_pct: Instant discount taken at the register on a purchase charged to the card when no special financing is chosen, percent.
  everyday_discount_combinable_with_promo: Whether the everyday discount may be combined with special financing on the same purchase, boolean.
  promo_allocation_cycles_before_expiry: Number of billing cycles before a deferred-interest promotion ends during which payment amounts above the minimum go first to that promotional balance, billing cycles.
  draw_period_months: Months after loan opening during which purchases may be drawn against a project loan; 0 for a revolving card, months.
  loan_term_months: Number of monthly installments in the repayment period after the draw period ends; 0 for a revolving card, months.
  draw_period_interest_only: Whether payments due during the draw period are interest-only, boolean.
  prepayment_penalty_usd: Charge for paying the balance off early, USD.
  return_restores_draw_availability: Whether a return credit posted during the draw period restores the amount available to draw, boolean.
  authorized_user_max: Maximum number of authorized users the primary cardholder may add, count.
  authorized_user_min_age: Minimum age of an authorized user, years.
  annual_fee_usd: Annual fee charged for the account, USD.
  cli_min_months_on_book: Full months the account must have been open before a credit line increase can be granted, months.
  cli_cooldown_months: Full months that must pass after the last credit line change before another increase, months.
  cli_max_increase_pct: Largest increase allowed in one credit line increase, as a percentage of the current line; 0 means increases are not offered, percent.
  cli_clean_history_months: Months immediately before the request that must contain no late fee for a credit line increase, months.
  cli_rounding_increment_usd: Increment to which a new credit line is rounded down, USD.
  suspension_days_past_due: Days past due at which charging or drawing privileges are suspended, days.
  charge_off_days_past_due: Days past due at which the account is charged off, days.
  reinstatement_consecutive_ontime_payments: Consecutive on-time minimum payments required, after the past-due amount is cleared, before a suspended account is reinstated, count.
  dispute_window_days: Days after the statement on which a charge first appeared was issued during which a billing error dispute may be filed, calendar days.
  dispute_acknowledge_days: Days within which a billing error dispute must be acknowledged in writing, calendar days.
  dispute_resolution_max_days: Maximum days from filing within which a billing error dispute is resolved, calendar days.
  inactivity_closure_months: Months with no purchase and no payment after which the bank may close a revolving account; 0 means the bank never closes for inactivity, months.
  closure_with_balance_allowed: Whether the cardholder may close the account while a balance is still owed, boolean.
  autopay_options: Automatic payment amounts the cardholder may choose on this tier (list drawn from minimum_due, statement_balance, fixed_amount).
  autopay_change_lead_days: Business days before a payment due date by which an autopay enrollment or change must be made to apply to that due date, business days.
  credit_balance_refund_threshold_usd: Credit balance above which the cardholder may ask for a refund of the credit balance, USD.
  authorized_user_change_limit_per_cycle: Maximum number of authorized-user additions or removals processed per statement period, count.

