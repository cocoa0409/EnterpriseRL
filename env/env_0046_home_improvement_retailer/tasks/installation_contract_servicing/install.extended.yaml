        bindings: [timing_start_date, payment_lag_days, timing_rate]
        ladder:
          - when: "the payment is made on the day work started"
            value: "K('start_day_rate')"
          - when: "the payment is made more than the late-start-payment days after work started"
            value: "K('late_start_payment_rate')"
          - when: "otherwise"
            value: "0"
        baseline:
          timing_rate: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: change_order_collection
        effect: method
        decides: change_order_collection
        bindings: [change_orders_billed, latest_change_date, collection_start_date, change_order_collection]
        ladder:
          - when: "change orders are billed AND the latest was billed before the date work started"
            method: "every change order billed is collected in full"
          - when: "change orders are billed AND the latest was billed on or after the date work started"
            method: "the program's progress payment percentage of every change order billed is collected, rounded to the cent"
          - when: "otherwise (no change order billed)"
            method: "no change order collection"
        baseline:
          change_order_collection: "0.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The start-of-work payment is the program's progress payment percentage of the contract price billed, rounded to the cent, plus the uncovered fees, which are every fee charged on the contract less every payment made on it for fees, rounded to the cent.
      params: [progress_payment_pct]
    inputs:
      history:
        - {table: install_charges, aggregate: sum, field: amount, filters: {event_type: install_fee_charged}}
        - {table: install_charges, aggregate: sum, field: amount, filters: {event_type: install_change_order_billed}}
        - {table: install_charges, aggregate: latest, field: visit_date, filters: {event_type: install_visit_recorded, visit_outcome: completed_as_scheduled}}
      cross_category: [card]
