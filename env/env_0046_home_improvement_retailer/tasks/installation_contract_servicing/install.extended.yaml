  - id: install_ext_trip_charge
    base_policy_refs: [install_agg_same_address, install_cancellation_fees, install_scheduling, install_visits_and_delays, install_change_orders, install_permits_and_haul_away]
    overwrite:
      - base_policy: install_visits_and_delays
        superseded_clause: >-
          An installation or warranty visit that cannot proceed because the customer was absent (customer_no_show) or the site was not ready (site_not_ready) incurs trip_charge_usd, subject to install_agg_same_address.
        replaced_by: >-
          The failed-visit trip charge posts as one trip charge line on the contract, referencing the visit record it arises from, at the amount this rule fixes.
    trigger: state_due
    subject: [install_fee_charged]
    computes: charge_amount
    target_tool: post_trip_charge_9239fb96
    params:
      first_occurrence_share: 0.5
      repeat_occurrence_count: 3
      repeat_occurrence_multiple: 1.5
      late_return_days: 60
      late_return_share: 0.5
      same_day_call_share: 0.75
      earlier_call_share: 0.5
      large_job_floor: 15000.00
      large_job_multiple: 1.25
      small_job_ceiling: 3000.00
      small_job_share: 0.75
      staged_materials_days: 14
      staged_materials_multiple: 1.15
      unstaged_materials_share: 0.8
    rule: >-
      This rule fixes the failed-visit trip charge owed when an installation or warranty visit could not proceed because the customer was absent or the site was not ready, charged for the most recent such visit recorded on the contract.
      The failed-visit trip charge posts as one trip charge line on the contract, referencing the visit record it arises from, at the amount this rule fixes.
      The failed-visit trip charge is the program's trip charge for the installation program on the contract, rounded to the cent.
      The failed-visit trip charge is worked out in this order: first its visit-day amount is fixed by the visit-day rule; that amount is then multiplied once by the product of the occurrence share, the advance-call share, the crew-size share and the staged-materials share, and the product is rounded to the cent only at the end.
      Visit-day rule: when the failed visit fell on the original installation date recorded on the contract, the opening crew block is lost and the visit-day amount is the program's trip charge plus the program's reschedule fee; when the failed visit fell more than the late-return days after the original installation date, the visit-day amount is the program's trip charge multiplied by the late-return share and rounded to the cent; on any other day the visit-day amount is the program's trip charge.
      Occurrence share of the failed-visit trip charge: the occurrences are every visit on the contract at which the customer was absent or the site was not ready; a contract with exactly one such visit takes the first-occurrence share, a contract with at least the repeat-occurrence count of such visits takes the repeat-occurrence multiple, and any other contract takes an occurrence share of 1.
      Advance-call share of the failed-visit trip charge: an advance call is the most recent customer reschedule request on the contract that was declined; when it was registered on the date of the failed visit the same-day call share applies, when it was registered one or more days before the failed visit the earlier-call share applies, and with no declined reschedule request registered on or before the failed visit the advance-call share is 1.
      Crew-size share of the failed-visit trip charge: the contract price billed on the contract is read from its contract billing line; a contract price at or above the large-job floor takes the large-job multiple, a contract price below the small-job ceiling takes the small-job share, and any other contract price takes a crew-size share of 1.
      Staged-materials share of the failed-visit trip charge: the staging days are the calendar days from the date all materials were received to the failed visit; staging days of at least the staged-materials days take the staged-materials multiple, materials received after the failed visit (negative staging days) take the unstaged-materials share, and any other staging takes a staged-materials share of 1.
    prerequisite: []
    cross_category: []
    compute:
      - prog_trip: "P('trip_charge_usd')"
      - prog_reschedule: "P('reschedule_fee_usd')"
      - failed_visit_date: "MX(LATEST('install_charges', 'visit_date', date_field='visit_date', event_type='install_visit_recorded', visit_outcome='customer_no_show') or '', LATEST('install_charges', 'visit_date', date_field='visit_date', event_type='install_visit_recorded', visit_outcome='site_not_ready') or '')"
      - days_after_original: "DAYS(F('original_install_date'), failed_visit_date)"
      - visit_day_amount: "prog_trip + prog_reschedule if days_after_original == 0 else (RND(prog_trip * K('late_return_share'), 2) if days_after_original > K('late_return_days') else prog_trip)"
      - absent_occurrences: "COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='customer_no_show')"
      - unready_occurrences: "COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='site_not_ready')"
      - occurrence_share: "K('first_occurrence_share') if absent_occurrences + unready_occurrences == 1 else (K('repeat_occurrence_multiple') if absent_occurrences + unready_occurrences >= K('repeat_occurrence_count') else 1.0)"
      - declined_call_registered: "LATEST('install_requests', 'created_at', date_field='created_at', request_type='reschedule', status='declined')"
      - call_gap_days: "DAYS(declined_call_registered, failed_visit_date) if declined_call_registered else -1"
      - advance_call_share: "K('same_day_call_share') if call_gap_days == 0 else (K('earlier_call_share') if call_gap_days >= 1 else 1.0)"
      - trip_billed_price: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_contract_billed')"
      - crew_size_share: "K('large_job_multiple') if trip_billed_price >= K('large_job_floor') else (K('small_job_share') if trip_billed_price < K('small_job_ceiling') else 1.0)"
      - staging_days: "DAYS(F('materials_received_date'), failed_visit_date) if F('materials_received_date') else 0"
      - staged_materials_share: "K('staged_materials_multiple') if staging_days >= K('staged_materials_days') else (K('unstaged_materials_share') if staging_days < 0 else 1.0)"
      - result: "RND(visit_day_amount * occurrence_share * advance_call_share * crew_size_share * staged_materials_share, 2)"
    compute_basis:
      prog_trip: "The failed-visit trip charge is the program's trip charge for the installation program on the contract, rounded to the cent."
      prog_reschedule: "the visit-day amount is the program's trip charge plus the program's reschedule fee"
      failed_visit_date: "charged for the most recent such visit recorded on the contract"
      days_after_original: "when the failed visit fell on the original installation date recorded on the contract"
      visit_day_amount: "Visit-day rule: when the failed visit fell on the original installation date recorded on the contract, the opening crew block is lost and the visit-day amount is the program's trip charge plus the program's reschedule fee; when the failed visit fell more than the late-return days after the original installation date, the visit-day amount is the program's trip charge multiplied by the late-return share and rounded to the cent; on any other day the visit-day amount is the program's trip charge."
      absent_occurrences: "the occurrences are every visit on the contract at which the customer was absent or the site was not ready"
      unready_occurrences: "the occurrences are every visit on the contract at which the customer was absent or the site was not ready"
      occurrence_share: "a contract with exactly one such visit takes the first-occurrence share, a contract with at least the repeat-occurrence count of such visits takes the repeat-occurrence multiple, and any other contract takes an occurrence share of 1."
      declined_call_registered: "an advance call is the most recent customer reschedule request on the contract that was declined"
      call_gap_days: "when it was registered on the date of the failed visit the same-day call share applies, when it was registered one or more days before the failed visit the earlier-call share applies"
      advance_call_share: "Advance-call share of the failed-visit trip charge: an advance call is the most recent customer reschedule request on the contract that was declined; when it was registered on the date of the failed visit the same-day call share applies, when it was registered one or more days before the failed visit the earlier-call share applies, and with no declined reschedule request registered on or before the failed visit the advance-call share is 1."
      trip_billed_price: "the contract price billed on the contract is read from its contract billing line"
      crew_size_share: "a contract price at or above the large-job floor takes the large-job multiple, a contract price below the small-job ceiling takes the small-job share, and any other contract price takes a crew-size share of 1."
      staging_days: "the staging days are the calendar days from the date all materials were received to the failed visit"
      staged_materials_share: "staging days of at least the staged-materials days take the staged-materials multiple, materials received after the failed visit (negative staging days) take the unstaged-materials share, and any other staging takes a staged-materials share of 1."
      result: "that amount is then multiplied once by the product of the occurrence share, the advance-call share, the crew-size share and the staged-materials share, and the product is rounded to the cent only at the end."
    factors:
      - id: visit_day
        effect: method
        decides: visit_day_amount
        bindings: [failed_visit_date, days_after_original, visit_day_amount]
        ladder:
          - when: "the failed visit fell on the original installation date"
            method: "the visit-day amount is the program's trip charge plus the program's reschedule fee"
          - when: "the failed visit fell more than the late-return days after the original installation date"
            method: "the visit-day amount is the program's trip charge multiplied by the late-return share, rounded to the cent"
          - when: "otherwise"
            method: "the visit-day amount is the program's trip charge"
        baseline:
          visit_day_amount: "prog_trip"
        evidence: [history, date]
        cross_difficulty: null
      - id: occurrence
        effect: parameter
        decides: occurrence_share
        bindings: [absent_occurrences, unready_occurrences, occurrence_share]
        ladder:
          - when: "exactly one visit on the contract at which the customer was absent or the site was not ready"
            value: "K('first_occurrence_share')"
          - when: "at least the repeat-occurrence count of such visits"
            value: "K('repeat_occurrence_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          occurrence_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: advance_call
        effect: parameter
        decides: advance_call_share
        bindings: [declined_call_registered, call_gap_days, advance_call_share]
        ladder:
          - when: "the most recent declined customer reschedule request was registered on the date of the failed visit"
            value: "K('same_day_call_share')"
          - when: "it was registered one or more days before the failed visit"
            value: "K('earlier_call_share')"
          - when: "otherwise (no declined reschedule request on or before the failed visit)"
            value: "1"
        baseline:
          advance_call_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: crew_size
        effect: parameter
        decides: crew_size_share
        bindings: [trip_billed_price, crew_size_share]
        ladder:
          - when: "the contract price billed is at or above the large-job floor"
            value: "K('large_job_multiple')"
          - when: "the contract price billed is below the small-job ceiling"
            value: "K('small_job_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          crew_size_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: staged_materials
        effect: parameter
        decides: staged_materials_share
        bindings: [staging_days, staged_materials_share]
        ladder:
          - when: "materials were received at least the staged-materials days before the failed visit"
            value: "K('staged_materials_multiple')"
          - when: "materials were received after the failed visit"
            value: "K('unstaged_materials_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          staged_materials_share: "1.0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The failed-visit trip charge is the program's trip charge for the installation program on the contract, rounded to the cent.
      params: [trip_charge_usd]
    inputs:
      history:
        - {table: install_charges, aggregate: latest, field: visit_date, filters: {event_type: install_visit_recorded}}
        - {table: install_charges, aggregate: count, field: install_charge_id, filters: {event_type: install_visit_recorded}}
        - {table: install_requests, aggregate: latest, field: created_at, filters: {request_type: reschedule, status: declined}}
        - {table: install_charges, aggregate: sum, field: amount, filters: {event_type: install_contract_billed}}
      cross_category: []

  - id: install_ext_change_order_fee
    base_policy_refs: [install_agg_same_address, install_cancellation_fees, install_scheduling, install_visits_and_delays, install_change_orders, install_permits_and_haul_away]
    overwrite:
      - base_policy: install_change_orders
        superseded_clause: >-
          A signed increase posts as an install_change_order_billed row with the next change_order_number and incurs change_order_admin_fee_usd
        replaced_by: >-
          The change order administration fee posts as one administration fee line on the contract, referencing the change order request it arises from, at the amount this rule fixes.
    trigger: state_due
    subject: [install_fee_charged]
    computes: fee_amount
    target_tool: post_change_order_fee_b62b1022
    params:
      same_day_signing_share: 0.8
      last_day_signing_multiple: 1.2
      first_change_share: 0.8
      third_change_count: 3
      third_change_multiple: 1.5
      large_change_floor: 1500.00
      per_thousand_usd: 10.00
      small_change_ceiling: 250.00
      small_change_share: 0.5
      permit_amendment_multiple: 1.2
      later_permit_multiple: 1.1
    rule: >-
      This rule fixes the change order administration fee owed for a signed change order that increases the contract price, charged for the most recent change order billed on the contract.
      The change order administration fee posts as one administration fee line on the contract, referencing the change order request it arises from, at the amount this rule fixes.
      The change order administration fee is the program's change order administration fee for the installation program on the contract, rounded to the cent.
      The change order administration fee is worked out in this order: first its scaled amount is fixed by the change-size rule; that amount is then multiplied once by the product of the signing-speed share, the change-sequence share and the permit-amendment share, and the product is rounded to the cent only at the end.
      Change-size rule: when the change order's billed increase is above the large-change floor, the scaled amount is the program's change order administration fee plus the per-thousand charge for every full 1,000.00 of the increase; when the increase is below the small-change ceiling, the scaled amount is the program's change order administration fee multiplied by the small-change share and rounded to the cent; any other increase takes the program's change order administration fee as the scaled amount.
      Signing-speed share of the change order administration fee: the signing gap is the calendar days from the date part of the change order request's registration to the date the change order was billed; a signing gap of 0 days takes the same-day signing share, a signing gap equal to the program's change order signing days takes the last-day signing multiple, and any other signing gap takes a signing-speed share of 1.
      Change-sequence share of the change order administration fee: the sequence is the number of change orders billed on the contract; exactly one takes the first-change share, at least the third-change count takes the third-change multiple, and any other number takes a change-sequence share of 1.
      Permit-amendment share of the change order administration fee: when a permit fee line stands on the contract dated before the change order was billed, the permit on file must be amended and the permit-amendment multiple applies; when the contract's permit fee line is dated on or after the change order's billing date, the later-permit multiple applies; a contract with no permit fee line takes a permit-amendment share of 1.
    prerequisite: []
    cross_category: []
    compute:
      - prog_admin_fee: "P('change_order_admin_fee_usd')"
      - latest_change_amount: "LATEST('install_charges', 'amount', date_field='charge_date', event_type='install_change_order_billed')"
      - scaled_admin_amount: "prog_admin_fee + K('per_thousand_usd') * int(latest_change_amount / 1000) if latest_change_amount > K('large_change_floor') else (RND(prog_admin_fee * K('small_change_share'), 2) if latest_change_amount < K('small_change_ceiling') else prog_admin_fee)"
      - change_request_registered: "LATEST('install_requests', 'created_at', date_field='created_at', request_type='change_order')"
      - change_billed_date: "LATEST('install_charges', 'charge_date', date_field='charge_date', event_type='install_change_order_billed')"
      - signing_gap_days: "DAYS(change_request_registered, change_billed_date)"
      - signing_speed_share: "K('same_day_signing_share') if signing_gap_days == 0 else (K('last_day_signing_multiple') if signing_gap_days == P('change_order_sign_days') else 1.0)"
      - change_order_count: "COUNT('install_charges', date_field='charge_date', event_type='install_change_order_billed')"
      - change_sequence_share: "K('first_change_share') if change_order_count == 1 else (K('third_change_multiple') if change_order_count >= K('third_change_count') else 1.0)"
      - permit_line_date: "LATEST('install_charges', 'charge_date', date_field='charge_date', event_type='install_fee_charged', fee_type='permit_fee')"
      - permit_line_count: "COUNT('install_charges', date_field='charge_date', event_type='install_fee_charged', fee_type='permit_fee')"
      - permit_before_change: "DAYS(permit_line_date, change_billed_date) if permit_line_date else 0"
      - permit_amendment_share: "K('permit_amendment_multiple') if (permit_line_count > 0 and permit_before_change > 0) else (K('later_permit_multiple') if permit_line_count > 0 else 1.0)"
      - result: "RND(scaled_admin_amount * signing_speed_share * change_sequence_share * permit_amendment_share, 2)"
    compute_basis:
      prog_admin_fee: "The change order administration fee is the program's change order administration fee for the installation program on the contract, rounded to the cent."
      latest_change_amount: "charged for the most recent change order billed on the contract"
      scaled_admin_amount: "Change-size rule: when the change order's billed increase is above the large-change floor, the scaled amount is the program's change order administration fee plus the per-thousand charge for every full 1,000.00 of the increase; when the increase is below the small-change ceiling, the scaled amount is the program's change order administration fee multiplied by the small-change share and rounded to the cent; any other increase takes the program's change order administration fee as the scaled amount."
      change_request_registered: "the signing gap is the calendar days from the date part of the change order request's registration to the date the change order was billed"
      change_billed_date: "the date the change order was billed"
      signing_gap_days: "the signing gap is the calendar days from the date part of the change order request's registration to the date the change order was billed"
      signing_speed_share: "a signing gap of 0 days takes the same-day signing share, a signing gap equal to the program's change order signing days takes the last-day signing multiple, and any other signing gap takes a signing-speed share of 1."
      change_order_count: "the sequence is the number of change orders billed on the contract"
      change_sequence_share: "exactly one takes the first-change share, at least the third-change count takes the third-change multiple, and any other number takes a change-sequence share of 1."
      permit_line_date: "when a permit fee line stands on the contract dated before the change order was billed"
      permit_line_count: "a contract with no permit fee line takes a permit-amendment share of 1."
      permit_before_change: "when the contract's permit fee line is dated on or after the change order's billing date"
      permit_amendment_share: "Permit-amendment share of the change order administration fee: when a permit fee line stands on the contract dated before the change order was billed, the permit on file must be amended and the permit-amendment multiple applies; when the contract's permit fee line is dated on or after the change order's billing date, the later-permit multiple applies; a contract with no permit fee line takes a permit-amendment share of 1."
      result: "that amount is then multiplied once by the product of the signing-speed share, the change-sequence share and the permit-amendment share, and the product is rounded to the cent only at the end."
    factors:
      - id: change_size
        effect: method
        decides: scaled_admin_amount
        bindings: [latest_change_amount, scaled_admin_amount]
        ladder:
          - when: "the change order's billed increase is above the large-change floor"
            method: "the scaled amount is the program's administration fee plus the per-thousand charge for every full 1,000.00 of the increase"
          - when: "the increase is below the small-change ceiling"
            method: "the scaled amount is the program's administration fee multiplied by the small-change share, rounded to the cent"
          - when: "otherwise"
            method: "the scaled amount is the program's administration fee"
        baseline:
          scaled_admin_amount: "prog_admin_fee"
        evidence: [history]
        cross_difficulty: null
      - id: signing_speed
        effect: parameter
        decides: signing_speed_share
        bindings: [change_request_registered, change_billed_date, signing_gap_days, signing_speed_share]
        ladder:
          - when: "the change order was billed on the day its request was registered"
            value: "K('same_day_signing_share')"
          - when: "the change order was billed on the last of the program's change order signing days"
            value: "K('last_day_signing_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          signing_speed_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: change_sequence
        effect: parameter
        decides: change_sequence_share
        bindings: [change_order_count, change_sequence_share]
        ladder:
          - when: "exactly one change order billed on the contract"
            value: "K('first_change_share')"
          - when: "at least the third-change count of change orders billed"
            value: "K('third_change_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          change_sequence_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: permit_amendment
        effect: parameter
        decides: permit_amendment_share
        bindings: [permit_line_date, permit_line_count, permit_before_change, permit_amendment_share]
        ladder:
          - when: "a permit fee line stands on the contract dated before the change order was billed"
            value: "K('permit_amendment_multiple')"
          - when: "the contract's permit fee line is dated on or after the change order's billing date"
            value: "K('later_permit_multiple')"
          - when: "otherwise (no permit fee line)"
            value: "1"
        baseline:
          permit_amendment_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The change order administration fee is the program's change order administration fee for the installation program on the contract, rounded to the cent.
      params: [change_order_admin_fee_usd]
    inputs:
      history:
        - {table: install_charges, aggregate: latest, field: amount, filters: {event_type: install_change_order_billed}}
        - {table: install_charges, aggregate: count, field: install_charge_id, filters: {event_type: install_change_order_billed}}
        - {table: install_requests, aggregate: latest, field: created_at, filters: {request_type: change_order}}
        - {table: install_charges, aggregate: latest, field: charge_date, filters: {event_type: install_fee_charged, fee_type: permit_fee}}
      cross_category: []

  - id: install_ext_permit_handling_fee
    base_policy_refs: [install_agg_same_address, install_cancellation_fees, install_scheduling, install_visits_and_delays, install_change_orders, install_permits_and_haul_away]
    overwrite:
      - base_policy: install_permits_and_haul_away
        superseded_clause: >-
          and permit_handling_fee_usd as a row with fee_type permit_handling_fee, both on the date the permit is issued
        replaced_by: >-
          The permit handling fee posts as one permit handling fee line on the contract at the amount this rule fixes.
    trigger: state_due
    subject: [install_fee_charged]
    computes: fee_amount
    target_tool: post_permit_handling_fee_ee01a5f4
    params:
      major_permit_floor: 500.00
      major_permit_pct: 5
      minor_permit_ceiling: 100.00
      minor_permit_share: 0.5
      slow_issue_days: 30
      slow_issue_multiple: 1.2
      quick_issue_days: 7
      quick_issue_share: 0.9
      quick_signing_days: 7
      quick_signing_share: 0.9
      late_signing_days: 21
      late_signing_multiple: 1.1
      long_hold_days: 21
      long_hold_multiple: 1.1
      rush_inspection_days: 7
      rush_inspection_multiple: 1.25
      reinspection_multiple: 1.25
      installer_miss_share: 0.9
      paid_permit_share: 0.9
      unpaid_permit_days: 30
      unpaid_permit_multiple: 1.1
    rule: >-
      This rule fixes the permit handling fee owed on a contract whose permit has been issued and whose permit fee is passed through at cost.
      The permit handling fee posts as one permit handling fee line on the contract at the amount this rule fixes.
      The permit handling fee is the program's permit handling fee for the installation program on the contract, rounded to the cent.
      The permit handling fee is worked out in this order: first its permit-size amount is fixed by the permit-size rule; that amount is then multiplied once by the product of the issue-time share, the signing-lead share, the permit-hold share, the re-inspection share and the permit-payment share, and the product is rounded to the cent only at the end.
      Permit-size rule: the permit fee at cost is every permit fee line charged on the contract; when it is at or above the major-permit floor, the permit-size amount is the program's permit handling fee plus the major-permit percentage of the permit fee at cost; when it is above 0 and below the minor-permit ceiling, the permit-size amount is the program's permit handling fee multiplied by the minor-permit share and rounded to the cent; otherwise the permit-size amount is the program's permit handling fee.
      Issue-time share of the permit handling fee: the issue time is the calendar days from the contract signing date to the date of the permit fee line; an issue time of more than the slow-issue days takes the slow-issue multiple, an issue time of at most the quick-issue days takes the quick-issue share, and any other issue time takes an issue-time share of 1.
      Signing-lead share of the permit handling fee: the signing lead is the calendar days from the measure completion date to the contract signing date; a signing lead of at most the quick-signing days takes the quick-signing share, a signing lead of more than the late-signing days takes the late-signing multiple, and any other signing lead takes a signing-lead share of 1.
      Permit-hold share of the permit handling fee: the permit hold is the calendar days from the date of the permit fee line to the original installation date; a permit hold of more than the long-hold days takes the long-hold multiple, a permit hold of at most the rush-inspection days takes the rush-inspection multiple, and any other permit hold takes a permit-hold share of 1.
      Re-inspection share of the permit handling fee: when the contract records a visit at which the customer was absent or the site was not ready and no installer no-show visit, the inspection booking is redone and the re-inspection multiple applies; when it records an installer no-show visit and no such customer-side visit, the installer-miss share applies; on any other contract the re-inspection share is 1.
      Permit-payment share of the permit handling fee: when the payments made on the contract for fees cover the permit fee at cost, the paid-permit share applies; when they do not and more than the unpaid-permit days have passed since the date of the permit fee line, the unpaid-permit multiple applies; otherwise the permit-payment share is 1.
    prerequisite: []
    cross_category: []
    compute:
      - prog_handling_fee: "P('permit_handling_fee_usd')"
      - permit_fee_at_cost: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_fee_charged', fee_type='permit_fee')"
      - permit_size_amount: "prog_handling_fee + RND(permit_fee_at_cost * K('major_permit_pct') / 100, 2) if permit_fee_at_cost >= K('major_permit_floor') else (RND(prog_handling_fee * K('minor_permit_share'), 2) if (permit_fee_at_cost > 0 and permit_fee_at_cost < K('minor_permit_ceiling')) else prog_handling_fee)"
      - permit_issue_date: "LATEST('install_charges', 'charge_date', date_field='charge_date', event_type='install_fee_charged', fee_type='permit_fee')"
      - issue_time_days: "DAYS(F('contract_signed_date'), permit_issue_date)"
      - issue_time_share: "K('slow_issue_multiple') if issue_time_days > K('slow_issue_days') else (K('quick_issue_share') if issue_time_days <= K('quick_issue_days') else 1.0)"
      - signing_lead_days: "DAYS(F('measure_completed_date'), F('contract_signed_date'))"
      - signing_lead_share: "K('quick_signing_share') if signing_lead_days <= K('quick_signing_days') else (K('late_signing_multiple') if signing_lead_days > K('late_signing_days') else 1.0)"
      - hold_issue_date: "LATEST('install_charges', 'charge_date', date_field='charge_date', event_type='install_fee_charged', fee_type='permit_fee')"
      - permit_hold_days: "DAYS(hold_issue_date, F('original_install_date'))"
      - permit_hold_share: "K('long_hold_multiple') if permit_hold_days > K('long_hold_days') else (K('rush_inspection_multiple') if permit_hold_days <= K('rush_inspection_days') else 1.0)"
      - customer_side_visits: "COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='customer_no_show') + COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='site_not_ready')"
      - installer_side_visits: "COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='installer_no_show')"
      - reinspection_share: "K('reinspection_multiple') if (customer_side_visits > 0 and installer_side_visits == 0) else (K('installer_miss_share') if (installer_side_visits > 0 and customer_side_visits == 0) else 1.0)"
      - fee_payments_made: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_payment_received', payment_purpose='fee')"
      - days_since_permit_line: "DAYS(permit_issue_date, NOW)"
      - permit_payment_share: "K('paid_permit_share') if (permit_fee_at_cost > 0 and fee_payments_made >= permit_fee_at_cost) else (K('unpaid_permit_multiple') if (fee_payments_made < permit_fee_at_cost and days_since_permit_line > K('unpaid_permit_days')) else 1.0)"
      - result: "RND(permit_size_amount * issue_time_share * signing_lead_share * permit_hold_share * reinspection_share * permit_payment_share, 2)"
    compute_basis:
      prog_handling_fee: "The permit handling fee is the program's permit handling fee for the installation program on the contract, rounded to the cent."
      permit_fee_at_cost: "the permit fee at cost is every permit fee line charged on the contract"
      permit_size_amount: "Permit-size rule: the permit fee at cost is every permit fee line charged on the contract; when it is at or above the major-permit floor, the permit-size amount is the program's permit handling fee plus the major-permit percentage of the permit fee at cost; when it is above 0 and below the minor-permit ceiling, the permit-size amount is the program's permit handling fee multiplied by the minor-permit share and rounded to the cent; otherwise the permit-size amount is the program's permit handling fee."
      permit_issue_date: "the issue time is the calendar days from the contract signing date to the date of the permit fee line"
      issue_time_days: "the issue time is the calendar days from the contract signing date to the date of the permit fee line"
      issue_time_share: "an issue time of more than the slow-issue days takes the slow-issue multiple, an issue time of at most the quick-issue days takes the quick-issue share, and any other issue time takes an issue-time share of 1."
      signing_lead_days: "the signing lead is the calendar days from the measure completion date to the contract signing date"
      signing_lead_share: "a signing lead of at most the quick-signing days takes the quick-signing share, a signing lead of more than the late-signing days takes the late-signing multiple, and any other signing lead takes a signing-lead share of 1."
      hold_issue_date: "the permit hold is the calendar days from the date of the permit fee line to the original installation date"
      permit_hold_days: "the permit hold is the calendar days from the date of the permit fee line to the original installation date"
      permit_hold_share: "a permit hold of more than the long-hold days takes the long-hold multiple, a permit hold of at most the rush-inspection days takes the rush-inspection multiple, and any other permit hold takes a permit-hold share of 1."
      customer_side_visits: "when the contract records a visit at which the customer was absent or the site was not ready and no installer no-show visit"
      installer_side_visits: "when it records an installer no-show visit and no such customer-side visit"
      reinspection_share: "Re-inspection share of the permit handling fee: when the contract records a visit at which the customer was absent or the site was not ready and no installer no-show visit, the inspection booking is redone and the re-inspection multiple applies; when it records an installer no-show visit and no such customer-side visit, the installer-miss share applies; on any other contract the re-inspection share is 1."
      fee_payments_made: "when the payments made on the contract for fees cover the permit fee at cost"
      days_since_permit_line: "more than the unpaid-permit days have passed since the date of the permit fee line"
      permit_payment_share: "Permit-payment share of the permit handling fee: when the payments made on the contract for fees cover the permit fee at cost, the paid-permit share applies; when they do not and more than the unpaid-permit days have passed since the date of the permit fee line, the unpaid-permit multiple applies; otherwise the permit-payment share is 1."
      result: "that amount is then multiplied once by the product of the issue-time share, the signing-lead share, the permit-hold share, the re-inspection share and the permit-payment share, and the product is rounded to the cent only at the end."
    factors:
      - id: permit_size
        effect: method
        decides: permit_size_amount
        bindings: [permit_fee_at_cost, permit_size_amount]
        ladder:
          - when: "the permit fee at cost is at or above the major-permit floor"
            method: "the permit-size amount is the program's permit handling fee plus the major-permit percentage of the permit fee at cost"
          - when: "the permit fee at cost is above 0 and below the minor-permit ceiling"
            method: "the permit-size amount is the program's permit handling fee multiplied by the minor-permit share, rounded to the cent"
          - when: "otherwise"
            method: "the permit-size amount is the program's permit handling fee"
        baseline:
          permit_size_amount: "prog_handling_fee"
        evidence: [history]
        cross_difficulty: null
      - id: issue_time
        effect: parameter
        decides: issue_time_share
        bindings: [permit_issue_date, issue_time_days, issue_time_share]
        ladder:
          - when: "more than the slow-issue days from signing to the permit fee line"
            value: "K('slow_issue_multiple')"
          - when: "at most the quick-issue days from signing to the permit fee line"
            value: "K('quick_issue_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          issue_time_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: signing_lead
        effect: parameter
        decides: signing_lead_share
        bindings: [signing_lead_days, signing_lead_share]
        ladder:
          - when: "at most the quick-signing days from measure completion to signing"
            value: "K('quick_signing_share')"
          - when: "more than the late-signing days from measure completion to signing"
            value: "K('late_signing_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          signing_lead_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: permit_hold
        effect: parameter
        decides: permit_hold_share
        bindings: [hold_issue_date, permit_hold_days, permit_hold_share]
        ladder:
          - when: "more than the long-hold days from the permit fee line to the original installation date"
            value: "K('long_hold_multiple')"
          - when: "at most the rush-inspection days from the permit fee line to the original installation date"
            value: "K('rush_inspection_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          permit_hold_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: reinspection
        effect: parameter
        decides: reinspection_share
        bindings: [customer_side_visits, installer_side_visits, reinspection_share]
        ladder:
          - when: "a visit at which the customer was absent or the site was not ready AND no installer no-show visit"
            value: "K('reinspection_multiple')"
          - when: "an installer no-show visit AND no customer-side failed visit"
            value: "K('installer_miss_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          reinspection_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: permit_payment
        effect: parameter
        decides: permit_payment_share
        bindings: [fee_payments_made, days_since_permit_line, permit_payment_share]
        ladder:
          - when: "fee payments on the contract cover the permit fee at cost"
            value: "K('paid_permit_share')"
          - when: "fee payments do not cover it AND more than the unpaid-permit days have passed since the permit fee line"
            value: "K('unpaid_permit_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          permit_payment_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The permit handling fee is the program's permit handling fee for the installation program on the contract, rounded to the cent.
      params: [permit_handling_fee_usd]
    inputs:
      history:
        - {table: install_charges, aggregate: sum, field: amount, filters: {event_type: install_fee_charged, fee_type: permit_fee}}
        - {table: install_charges, aggregate: count, field: install_charge_id, filters: {event_type: install_visit_recorded}}
        - {table: install_charges, aggregate: sum, field: amount, filters: {event_type: install_payment_received, payment_purpose: fee}}
      cross_category: []

  - id: install_ext_progress_payment
    base_policy_refs: [install_payments, install_completion_and_closure]
    overwrite:
      - base_policy: install_payments
        superseded_clause: >-
          A progress payment of progress_payment_pct percent of the contract price is due on the day work starts
        replaced_by: >-
          The start-of-work payment is the amount this rule fixes: the progress share, plus the start-day timing adjustment, plus the change order collection, plus the uncovered fees.
    trigger: on_request
    subject: [install_payment_received]
    computes: payment_amount
    target_tool: pay_progress_payment_cb1125dd
    params:
      full_loan_share: 0.5
      partial_loan_share: 0.75
      start_day_rate: -0.01
      late_start_payment_days: 7
      late_start_payment_rate: 0.015
      long_wait_days: 60
      long_wait_share: 0.95
      short_wait_days: 30
      short_wait_multiple: 1.05
    rule: >-
      This rule fixes the start-of-work payment a customer makes on a contract whose status is in_progress, charged to the customer's own bank card.
      The start-of-work payment is not worked out until every installation visit on the contract at which the customer was absent or the site was not ready carries its trip charge line.
      The start-of-work payment is fixed only after every signed change order that raises the contract price carries its administration fee line.
      Before the start-of-work payment is fixed, an issued permit whose fee is passed through at cost must carry its permit handling fee line on the contract.
      The start-of-work payment is the program's progress payment percentage of the contract price billed, rounded to the cent, plus the uncovered fees, which are every fee charged on the contract less every payment made on it for fees, rounded to the cent.
      The start-of-work payment is the amount this rule fixes: the progress share, plus the start-day timing adjustment, plus the change order collection, plus the uncovered fees.
      The progress share is the program's progress payment percentage of the contract price billed, multiplied once by the product of the financing share and the wait share, and rounded to the cent; the start-day timing adjustment is the timing rate applied to that rounded progress share and rounded to the cent; the four parts are then added and the sum rounded to the cent.
      Financing share of the start-of-work payment: the customer's active Ridgeline Consumer Credit account that carries a draw period end date is their Project Loan; when its draw period end date is after today and its approved amount is at least the contract price billed, the full-loan share applies; when its draw period end date is after today and its approved amount is below the contract price billed, the partial-loan share applies; with no such open Project Loan the financing share is 1.
      Wait share of the start-of-work payment: the wait is the calendar days from the contract signing date to the date of the installation visit at which work started; a wait of more than the long-wait days takes the long-wait share, a wait of at most the short-wait days takes the short-wait multiple, and any other wait takes a wait share of 1.
      Start-day timing rate of the start-of-work payment: the payment lag is the calendar days from the date of the installation visit at which work started to today; a payment lag of 0 days takes the start-day rate, a payment lag of more than the late-start-payment days takes the late-start-payment rate, and any other payment lag takes a rate of 0; a negative adjustment lowers the payment.
      Change order collection with the start-of-work payment: when the change orders billed on the contract were billed, the latest of them before the date work started, every change order billed is collected in full; when the latest change order was billed on or after the date work started, the program's progress payment percentage of every change order billed is collected, rounded to the cent; a contract with no change order billed has no change order collection, its change orders being left to the final payment.
    prerequisite:
      - problem: install_ext_trip_charge
        kind: value_input
        gate: fee_total
        form: state
        policy_source: >-
          The start-of-work payment is not worked out until every installation visit on the contract at which the customer was absent or the site was not ready carries its trip charge line.
        condition: >-
          Every install_visit_recorded line of the contract with visit_outcome customer_no_show or site_not_ready is referenced by an install_fee_charged line of fee_type trip_charge.
        resolved_by: post_trip_charge_9239fb96
        effect: >-
          Once the trip charge line stands, every fee charged (fee_total) includes it and the uncovered fees, and so the start-of-work payment, rise by its amount.
      - problem: install_ext_change_order_fee
        kind: value_input
        gate: fee_total
        form: state
        policy_source: >-
          The start-of-work payment is fixed only after every signed change order that raises the contract price carries its administration fee line.
        condition: >-
          Every install_change_order_billed line of the contract has an install_fee_charged line of fee_type change_order_admin_fee referencing the same change order request.
        resolved_by: post_change_order_fee_b62b1022
        effect: >-
          Once the administration fee line stands, every fee charged (fee_total) includes it and the uncovered fees, and so the start-of-work payment, rise by its amount.
      - problem: install_ext_permit_handling_fee
        kind: value_input
        gate: fee_total
        form: state
        policy_source: >-
          Before the start-of-work payment is fixed, an issued permit whose fee is passed through at cost must carry its permit handling fee line on the contract.
        condition: >-
          A contract whose permit_status is issued and whose program passes the permit fee through has an install_fee_charged line of fee_type permit_handling_fee.
        resolved_by: post_permit_handling_fee_ee01a5f4
        effect: >-
          Once the permit handling fee line stands, every fee charged (fee_total) includes it and the uncovered fees, and so the start-of-work payment, rise by its amount.
    cross_category:
      - category: card
        as: branch
        reads: [status, draw_period_end_date, credit_limit]
        note: The financing share is decided from the customer's active Ridgeline Project Loan, its draw period end date and its approved amount.
    compute:
      - pp_billed_price: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_contract_billed')"
      - fee_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_fee_charged')"
      - fee_payments: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_payment_received', payment_purpose='fee')"
      - uncovered_fees: "RND(fee_total - fee_payments, 2)"
      - loan_draw_end: "CFIELD('card', 'draw_period_end_date', status='active')"
      - loan_amount: "CFIELD('card', 'credit_limit', status='active')"
      - financing_share: "K('full_loan_share') if ((loan_draw_end or '') > NOW and loan_amount >= pp_billed_price) else (K('partial_loan_share') if ((loan_draw_end or '') > NOW and loan_amount < pp_billed_price) else 1.0)"
      - work_start_date: "LATEST('install_charges', 'visit_date', date_field='visit_date', event_type='install_visit_recorded', visit_type='installation', visit_outcome='completed_as_scheduled')"
      - wait_days: "DAYS(F('contract_signed_date'), work_start_date)"
      - wait_share: "K('long_wait_share') if wait_days > K('long_wait_days') else (K('short_wait_multiple') if wait_days <= K('short_wait_days') else 1.0)"
      - progress_share: "RND(pp_billed_price * P('progress_payment_pct') / 100 * financing_share * wait_share, 2)"
      - timing_start_date: "LATEST('install_charges', 'visit_date', date_field='visit_date', event_type='install_visit_recorded', visit_type='installation', visit_outcome='completed_as_scheduled')"
      - payment_lag_days: "DAYS(timing_start_date, NOW)"
      - timing_rate: "K('start_day_rate') if payment_lag_days == 0 else (K('late_start_payment_rate') if payment_lag_days > K('late_start_payment_days') else 0.0)"
      - timing_adjustment: "RND(progress_share * timing_rate, 2)"
      - change_orders_billed: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_change_order_billed')"
      - latest_change_date: "LATEST('install_charges', 'charge_date', date_field='charge_date', event_type='install_change_order_billed')"
      - collection_start_date: "LATEST('install_charges', 'visit_date', date_field='visit_date', event_type='install_visit_recorded', visit_type='installation', visit_outcome='completed_as_scheduled')"
      - change_order_collection: "change_orders_billed if (change_orders_billed > 0 and DAYS(latest_change_date, collection_start_date) > 0) else (RND(change_orders_billed * P('progress_payment_pct') / 100, 2) if change_orders_billed > 0 else 0.0)"
      - result: "RND(progress_share + timing_adjustment + change_order_collection + uncovered_fees, 2)"
    compute_basis:
