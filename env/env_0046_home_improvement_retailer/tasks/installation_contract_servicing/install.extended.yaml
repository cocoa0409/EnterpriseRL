      payment_lag_days: "the payment lag is the calendar days from the date of the installation visit at which work started to today"
      timing_rate: "a payment lag of 0 days takes the start-day rate, a payment lag of more than the late-start-payment days takes the late-start-payment rate, and any other payment lag takes a rate of 0"
      timing_adjustment: "the start-day timing adjustment is the timing rate applied to that rounded progress share and rounded to the cent"
      change_orders_billed: "every change order billed is collected in full"
      latest_change_date: "the latest of them before the date work started"
      collection_start_date: "when the latest change order was billed on or after the date work started"
      change_order_collection: "Change order collection with the start-of-work payment: when the change orders billed on the contract were billed, the latest of them before the date work started, every change order billed is collected in full; when the latest change order was billed on or after the date work started, the program's progress payment percentage of every change order billed is collected, rounded to the cent; a contract with no change order billed has no change order collection, its change orders being left to the final payment."
      result: "the four parts are then added and the sum rounded to the cent."
    factors:
