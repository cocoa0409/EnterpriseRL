        evidence: [cross_category]
        cross_difficulty: special
      - id: settlement_timing
        effect: parameter
        decides: settlement_rate
        bindings: [settlement_days_since_completion, settlement_rate]
        ladder:
          - when: "the settlement falls within the program's final payment due days after completion"
            value: "K('prompt_settlement_rate')"
          - when: "the settlement falls more than the late-settlement grace days after the end of the due period"
            value: "K('late_settlement_rate')"
          - when: "otherwise"
            value: "0"
        baseline:
          settlement_rate: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: change_order_fee_forgiveness
        effect: parameter
        decides: forgiveness_share
        bindings: [change_order_admin_fees, change_order_increase_pct, forgiveness_share]
        ladder:
          - when: "the change order increase is above 0 and below the small-change percentage AND administration fees are charged"
            value: "1 (the whole fee)"
          - when: "the change order increase is at or above the small-change percentage and below the mid-change percentage AND administration fees are charged"
            value: "K('mid_change_forgiveness_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          forgiveness_share: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: materials_lateness
        effect: parameter
        decides: lateness_allowance
        bindings: [linked_promised_ready, linked_ready, linked_delay_threshold, materials_late_days, lateness_allowance]
        ladder:
          - when: "the materials lateness is more than the long-lateness days AND no more than the special order program's vendor delay threshold"
            value: "K('long_lateness_allowance_usd')"
          - when: "the materials lateness is above 0 and no more than the long-lateness days AND no more than that threshold"
            value: "K('short_lateness_allowance_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          lateness_allowance: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: special
    baseline:
      rule: >-
        The final settlement payment is the open balance of the contract: the contract price billed, plus every change order billed, every measure fee charged and every fee charged, plus every refund paid out, less every payment received and every credit applied, all read from the contract's lines and rounded to the cent.
      params: []
    inputs:
