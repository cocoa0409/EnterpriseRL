events:
  - type: install_measure_booked
    target: install_contracts
    mutation: create
    meaning: A customer books an in-home measure or design consultation for one installation program at one job address, opening the contract record.
    grain: one row per program per job address booking (one contract record)
    fields:
      customer_id: The customer who booked the measure.
      variant_name: The installation program, as its official full name.
      status: Set to measure_booked on creation.
      contract_number: Contract number assigned at booking.
      job_address: Address of the home where the work will be done.
      measure_booked_date: Date the measure was booked.
      measure_appointment_at: Start of the measure appointment.
    triggers: []
  - type: install_measure_completed
    target: install_contracts
    mutation: {transition: {from: measure_booked, to: measured}}
    meaning: The installer completes the measure and the installed-price quote is issued.
    grain: one row per transaction
    fields:
      status: Set to measured.
      measure_completed_date: Date the measure was completed.
      quote_amount: Installed price quoted.
      quote_expiry_date: Last day the quote may be signed.
      permit_status: Whether a permit is required for the job.
    triggers: []
  - type: install_contract_signed
    target: install_contracts
    mutation: {transition: {from: measured, to: contracted}}
    meaning: The customer signs the installation agreement at the quoted price.
    grain: one row per transaction
    fields:
      status: Set to contracted.
      contract_signed_date: Date the agreement was signed.
      contract_signed_channel: Where the agreement was signed.
      contract_price: Contract price agreed (the quote amount).
    triggers:
      - event: install:install_contract_billed
        map: {amount: contract_price, charge_date: contract_signed_date}
  - type: install_scheduled
    target: install_contracts
    mutation: {transition: {from: contracted, to: scheduled}}
    meaning: An installation date and arrival window are booked.
    grain: one row per transaction
    fields:
      status: Set to scheduled.
      scheduled_install_at: Start of the booked arrival window.
      original_install_date: First installation date booked on the contract (set only on the first booking).
    triggers: []
  - type: install_rescheduled
    target: install_contracts
    mutation: update
    meaning: A scheduled installation is moved to another date, at the customer's request or on Ridgeline's side.
    grain: one row per transaction
    fields:
      scheduled_install_at: Start of the new arrival window.
      customer_reschedule_count: Number of customer-requested reschedules after the change.
    triggers: []
  - type: install_materials_updated
    target: install_contracts
    mutation: update
    meaning: The status of the job's materials or permit changes.
    grain: one row per transaction
    fields:
      materials_status: Status of the materials after the change.
      permit_status: Status of the permit after the change.
      permit_fee_amount: Municipal permit fee billed by the permit office.
    triggers: []
  - type: install_quote_extended
    target: install_contracts
    mutation: update
    meaning: An unexpired quote is extended once at the customer's request.
    grain: one row per transaction
    fields:
      quote_expiry_date: New last day the quote may be signed.
    triggers: []
  - type: install_started
    target: install_contracts
    mutation: {transition: {from: scheduled, to: in_progress}}
    meaning: The installer starts work on site.
    grain: one row per transaction
    fields:
      status: Set to in_progress.
    triggers: []
  - type: install_completed
    target: install_contracts
    mutation: {transition: {from: in_progress, to: completed}}
    meaning: The installer records the installation as complete.
    grain: one row per transaction
    fields:
      status: Set to completed.
      completed_date: Date the installation was completed.
      punch_list_open: Whether punch-list items were recorded at the walkthrough.
    triggers: []
  - type: install_closed
    target: install_contracts
    mutation: {transition: {from: completed, to: closed}}
    meaning: The contract closes after payment in full and sign-off.
    grain: one row per transaction
    fields:
      status: Set to closed.
      closed_date: Date the contract closed.
      completion_signed_off: Whether the customer signed the completion certificate (false when the sign-off period passed unsigned).
    triggers: []
  - type: install_cancelled
    target: install_contracts
    mutation: {transition: [{from: measure_booked, to: cancelled}, {from: measured, to: cancelled}, {from: contracted, to: cancelled}, {from: scheduled, to: cancelled}]}
    meaning: The contract is cancelled before work starts — measure cancelled, quote expired or declined, agreement rescinded or cancelled.
    grain: one row per transaction
    fields:
      status: Set to cancelled.
      cancelled_date: Date the cancellation took effect.
      cancellation_reason: Why the contract was cancelled.
    triggers: []
  - type: install_measure_fee_charged
    target: install_charges
    meaning: The measure or design consultation fee is charged at booking.
    grain: one row per contract
    distinguish_by: [contract_number]
    fields:
      contract_number: Contract number.
      charge_date: Date charged (the booking date).
      amount: Measure fee, positive.
    account: contract_balance
    direction: in
    triggers:
      - event: install:install_payment_received
        map: {amount: amount, charge_date: charge_date, payment_purpose: measure_fee}
  - type: install_contract_billed
    target: install_charges
    meaning: The contract price is billed when the agreement is signed.
    grain: one row per contract
    distinguish_by: [contract_number]
    fields:
      contract_number: Contract number.
      charge_date: Date billed (the signing date).
      amount: Contract price, positive.
    account: contract_balance
    direction: in
    triggers:
      - event: install:install_payment_received
        map: {charge_date: charge_date, payment_purpose: deposit}
  - type: install_change_order_billed
    target: install_charges
    meaning: A signed change order that increases the scope is billed.
    grain: one row per signed change order
    distinguish_by: [change_order_number]
    fields:
      contract_number: Contract number.
      change_order_number: Change order number on the contract.
      charge_date: Date the change order was signed.
      amount: Price increase of the change order, positive.
      install_request_id: The change order request.
    account: contract_balance
    direction: in
    triggers:
      - event: install:install_fee_charged
        map: {charge_date: charge_date, fee_type: change_order_admin_fee, install_request_id: install_request_id}
  - type: install_fee_charged
    target: install_charges
    meaning: A reschedule fee, trip charge, cancellation fee, permit fee, permit handling fee, haul-away fee or change order fee is charged.
    grain: one row per fee type per date per originating request
    distinguish_by: [fee_type, charge_date, install_request_id]
    fields:
      contract_number: Contract number.
      fee_type: Which fee is charged.
      charge_date: Date charged.
      amount: Fee amount, positive.
      install_request_id: The request the fee arises from (reschedule, cancellation, change order); empty for visit and permit fees.
    account: contract_balance
    direction: in
    triggers: []
  - type: install_payment_received
    target: install_charges
    meaning: The customer pays toward the contract.
    grain: one row per payment
    distinguish_by: [charge_date, payment_purpose, amount, payment_method]
    fields:
      contract_number: Contract number.
      charge_date: Date of the payment.
      amount: Amount paid, positive.
      payment_method: Tender used.
      payment_purpose: What the payment is for.
    account: contract_balance
    direction: out
    triggers:
      - event: card:card_purchase_posted
        when: {payment_method: ridgeline_consumer_credit}
        map: {transaction_date: charge_date, amount: amount, merchant_reference: contract_number, purchase_channel: installation}
      - event: trade:trade_invoice_posted
        when: {payment_method: ridgeline_pro_credit}
        map: {transaction_date: charge_date, invoice_date: charge_date, amount: amount, purchase_channel: installation, pricing_basis: contract_price}
  - type: install_credit_applied
    target: install_charges
    meaning: A credit reduces what the customer owes — measure fee credit, installer no-show credit, delay credit or change order reduction.
    grain: one row per credit type per originating charge or visit
    distinguish_by: [credit_type, original_charge_id, charge_date]
    fields:
      contract_number: Contract number.
      credit_type: Which credit is applied.
      charge_date: Date the credit posts.
      amount: Credit amount, positive.
      original_charge_id: The measure fee row (measure fee credit), visit row (no-show credit) or change order row (reduction) the credit arises from; empty for a delay credit.
    account: contract_balance
    direction: out
    triggers: []
  - type: install_refund_issued
    target: install_charges
    meaning: Money paid on the contract is refunded to the tender it was paid with.
    grain: one row per refunded payment
    distinguish_by: [original_charge_id, refund_reason]
    fields:
      contract_number: Contract number.
      charge_date: Date the refund is issued.
      amount: Amount refunded, positive (it brings an overpaid balance back toward zero).
      refund_method: Tender the refund goes back to (the tender of the original payment).
      refund_reason: Why money is refunded.
      original_charge_id: The install_payment_received row refunded.
    account: contract_balance
    direction: in
    triggers:
      - event: card:card_return_credit_posted
        when: {refund_method: ridgeline_consumer_credit}
        map: {transaction_date: charge_date, amount: amount, merchant_reference: contract_number}
      - event: trade:trade_return_credit_posted
        when: {refund_method: ridgeline_pro_credit}
        map: {transaction_date: charge_date, amount: amount, merchant_reference: contract_number}
  - type: install_visit_recorded
    target: install_charges
    meaning: The outcome of a measure, installation or warranty service visit is recorded by the installer.
    grain: one row per visit (contract, visit date, visit type)
    distinguish_by: [visit_date, visit_type]
    fields:
      contract_number: Contract number.
      charge_date: Same as visit_date.
      amount: 0.00 — a visit record moves no money.
      visit_date: Date of the visit.
      visit_type: Kind of visit.
      visit_outcome: What happened at the visit.
      warranty_status: Whether a warranty service visit fell inside the labor warranty.
      install_request_id: The workmanship claim a warranty visit answers; empty otherwise.
    triggers:
      - event: install:install_fee_charged
        when: {visit_outcome: [customer_no_show, site_not_ready], visit_type: [installation, warranty_service]}
        map: {fee_type: trip_charge, charge_date: visit_date}
      - event: install:install_fee_charged
        when: {visit_type: warranty_service, warranty_status: out_of_warranty}
        map: {fee_type: trip_charge, charge_date: visit_date, install_request_id: install_request_id}
      - event: install:install_credit_applied
        when: {visit_outcome: installer_no_show, visit_type: [installation, warranty_service]}
        map: {credit_type: installer_no_show_credit, charge_date: visit_date}

measures:
  - id: install_msr_net_paid
    window: Life of the contract up to the frozen date.
    measure: Sum of install_payment_received amounts on the contract minus the sum of install_refund_issued amounts.
  - id: install_msr_change_order_increase
    window: Life of the contract up to the frozen date.
    measure: Sum of install_change_order_billed amounts minus install_credit_applied amounts with credit_type change_order_reduction, as a percentage of contract_price.
  - id: install_msr_customer_no_shows
    window: Life of the contract up to the frozen date.
    measure: Count of install_visit_recorded rows with visit_type installation and visit_outcome customer_no_show.
  - id: install_msr_no_show_credits
    window: Life of the contract up to the frozen date.
    measure: Sum of install_credit_applied amounts with credit_type installer_no_show_credit on the contract.
  - id: install_msr_address_trip_charges_same_day
    window: One visit date, across every contract of the customer at the same job_address.
    measure: Count of install_fee_charged rows with fee_type trip_charge already posted for that visit_date on the customer's contracts sharing the job_address.

policies:
  - id: install_agg_multi_holding
    subject: [install_measure_booked]
    rule: >-
      A customer may hold any number of installation contracts, across programs and job addresses.
      A customer may not book a measure for a program at a job address while another contract for the same program at the same job address is open in status measure_booked, measured, contracted, scheduled, in_progress or completed.
      A cancelled or closed contract never blocks a new booking; a customer whose quote expired books a new measure.
    eligibility:
      - id: one_open_per_program_address
        applies_to: [install_measure_booked]
        kind: dedup
        condition: A customer may not book a measure for a program at a job address while another contract for the same program at the same job address is open in status measure_booked, measured, contracted, scheduled, in_progress or completed.
        evidence_fields: [install_contracts.customer_id, install_contracts.variant_name, install_contracts.job_address, install_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.customer_id, install_contracts.variant_name, install_contracts.job_address]
          action_bindings:
            install_contracts.customer_id: customer_id
            install_contracts.variant_name: variant_name
            install_contracts.job_address: job_address
        dedup_contract:
          table: install_contracts
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name, job_address: job_address}
          duplicate_filters: {status: [measure_booked, measured, contracted, scheduled, in_progress, completed]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: install_agg_same_address
    subject: [install_fee_charged, install_credit_applied]
    rule: >-
      A customer's contracts at the same job address are coordinated as one project when their installers visit on the same day.
      At most one trip charge is posted per job address per visit date across all of the customer's contracts: when install_msr_address_trip_charges_same_day is already one or more, no further trip charge posts for that date, and the one posted is the highest trip_charge_usd among the programs visited.
      An installer no-show credit is posted per contract whose visit was missed, since each program's installer is booked separately.
      A delay in one program's installation never triggers the delay remedies of another program at the same address unless that program's own installation start is delayed.
    eligibility: []
    measures: [install_msr_address_trip_charges_same_day]

  - id: install_measure_booking
    subject: [install_measure_booked, install_measure_fee_charged, install_measure_completed]
    rule: >-
      A measure is booked for one program at one job address, and the job site must meet the program's entry_gate (site type and minimum project size) as stated by the customer.
      The measure appointment may be no earlier than measure_appointment_lead_days calendar days after the booking date.
      When measure_fee_usd is above 0.00 the fee is charged on the booking date as one install_measure_fee_charged row and paid at booking; a program whose measure_fee_usd is 0.00 offers a free consultation and posts no fee row.
      At the measure the installer issues the installed-price quote; its quote_expiry_date is the measure_completed_date plus quote_validity_days calendar days, and the measure records whether a permit is required.
      A customer who misses the measure appointment forfeits the measure fee and must book again.
    eligibility: []
    params:
      per_tier:
        Ridgeline Carpet Installation: {measure_fee_usd: "=measure_fee_usd", quote_validity_days: "=quote_validity_days"}
        Ridgeline Hard Surface Flooring Installation: {measure_fee_usd: "=measure_fee_usd", quote_validity_days: "=quote_validity_days"}
        Ridgeline Window and Door Installation: {measure_fee_usd: "=measure_fee_usd", quote_validity_days: "=quote_validity_days"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {measure_fee_usd: "=measure_fee_usd", quote_validity_days: "=quote_validity_days"}
        Ridgeline Bath Remodel Installation: {measure_fee_usd: "=measure_fee_usd", quote_validity_days: "=quote_validity_days"}
        Ridgeline Roofing and Siding Installation: {measure_fee_usd: "=measure_fee_usd", quote_validity_days: "=quote_validity_days"}

  - id: install_measure_cancellation
    subject: [install_cancelled, install_refund_issued]
    rule: >-
      A customer may cancel a booked measure at any time before it takes place, by their own confirmation, and the contract is cancelled with cancellation_reason measure_cancelled.
      The measure fee is refunded in full, as an install_refund_issued row with refund_reason measure_cancelled referencing the measure fee payment, when measure_fee_refundable_on_cancel is true and the cancellation is made at least measure_cancel_notice_hours hours before measure_appointment_at; hours are counted as full 60-minute periods back from the appointment start, and a cancellation exactly measure_cancel_notice_hours hours before still qualifies.
      A cancellation made with less notice, or a missed appointment, forfeits the fee and no refund posts.
      Moving the measure to another date is not a cancellation and keeps the fee paid.
    eligibility: []
    params:
      per_tier:
        Ridgeline Carpet Installation: {measure_cancel_notice_hours: "=measure_cancel_notice_hours", measure_fee_refundable_on_cancel: "=measure_fee_refundable_on_cancel"}
        Ridgeline Hard Surface Flooring Installation: {measure_cancel_notice_hours: "=measure_cancel_notice_hours", measure_fee_refundable_on_cancel: "=measure_fee_refundable_on_cancel"}
        Ridgeline Window and Door Installation: {measure_cancel_notice_hours: "=measure_cancel_notice_hours", measure_fee_refundable_on_cancel: "=measure_fee_refundable_on_cancel"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {measure_cancel_notice_hours: "=measure_cancel_notice_hours", measure_fee_refundable_on_cancel: "=measure_fee_refundable_on_cancel"}
        Ridgeline Bath Remodel Installation: {measure_cancel_notice_hours: "=measure_cancel_notice_hours", measure_fee_refundable_on_cancel: "=measure_fee_refundable_on_cancel"}
        Ridgeline Roofing and Siding Installation: {measure_cancel_notice_hours: "=measure_cancel_notice_hours", measure_fee_refundable_on_cancel: "=measure_fee_refundable_on_cancel"}

  - id: install_measure_fee_credit
    subject: [install_credit_applied]
    rule: >-
      On a program whose measure_fee_creditable is true, the measure fee paid on a contract is credited against that same contract's price as an install_credit_applied row with credit_type measure_fee_credit referencing the measure fee row.
      The agreement must be signed no later than measure_fee_credit_window_days calendar days after the measure was completed.
      Days are counted as calendar days from measure_completed_date as day 0 to contract_signed_date; signing on the last day of the window qualifies.
      A measure fee credit is applied at most once per contract and only to the contract that charged the fee; it is never transferred to another program or address, never paid out in cash, and it is void when the agreement is rescinded.
      The credit equals the measure fee charged on the contract.
    eligibility:
      - id: signed_in_window
        applies_to: [install_credit_applied]
        kind: time
        condition: The agreement must be signed no later than measure_fee_credit_window_days calendar days after the measure was completed.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.measure_completed_date, install_contracts.contract_signed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the measure was completed
          anchor_source: install_contracts.measure_completed_date
          relation: not_after
          duration_source: variants.measure_fee_credit_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from measure_completed_date as day 0 to contract_signed_date; signing on the last day of the window qualifies.
          boundary: inclusive
      - id: once_per_contract
        applies_to: [install_credit_applied]
        kind: dedup
        condition: A measure fee credit is applied at most once per contract and only to the contract that charged the fee; it is never transferred to another program or address, never paid out in cash, and it is void when the agreement is rescinded.
        evidence_fields: [install_charges.install_contract_id, install_charges.credit_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_charges.install_contract_id]
          action_bindings:
            install_charges.install_contract_id: install_contract_id
        dedup_contract:
          table: install_charges
          mode: separate_record
          object_bindings: {install_contract_id: install_contract_id}
          duplicate_filters: {credit_type: [measure_fee_credit]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Carpet Installation: {measure_fee_creditable: "=measure_fee_creditable", measure_fee_credit_window_days: "=measure_fee_credit_window_days"}
        Ridgeline Hard Surface Flooring Installation: {measure_fee_creditable: "=measure_fee_creditable", measure_fee_credit_window_days: "=measure_fee_credit_window_days"}
        Ridgeline Window and Door Installation: {measure_fee_creditable: "=measure_fee_creditable", measure_fee_credit_window_days: "=measure_fee_credit_window_days"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {measure_fee_creditable: "=measure_fee_creditable", measure_fee_credit_window_days: "=measure_fee_credit_window_days"}
        Ridgeline Bath Remodel Installation: {measure_fee_creditable: "=measure_fee_creditable", measure_fee_credit_window_days: "=measure_fee_credit_window_days"}
        Ridgeline Roofing and Siding Installation: {measure_fee_creditable: "=measure_fee_creditable", measure_fee_credit_window_days: "=measure_fee_credit_window_days"}

  - id: install_quote_and_signing
    subject: [install_contract_signed, install_contract_billed, install_quote_extended]
    rule: >-
      The agreement is signed only by the customer, at the quote_amount, and the contract_price may not be below min_job_charge_usd.
      The agreement must be signed no later than the quote_expiry_date.
      The quote_expiry_date counts as a whole calendar day, so signing on that date qualifies and signing after it does not; an expired quote is cancelled by the system with cancellation_reason quote_expired and the customer books a new measure.
      The signing channel must be one of the program's contract_signing_channels.
      Before the quote expires the customer may ask once for an extension of quote_extension_days calendar days, which moves quote_expiry_date; a program whose quote_extension_days is 0 offers no extension, and an expired quote cannot be extended.
      On signing the contract price is billed as one install_contract_billed row on the signing date.
    eligibility:
      - id: signed_before_expiry
        applies_to: [install_contract_signed]
        kind: time
        condition: The agreement must be signed no later than the quote_expiry_date.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.quote_expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the quote_expiry_date
          anchor_source: install_contracts.quote_expiry_date
          relation: not_after
          duration_source: params.signing_grace_days
          unit: calendar_days
          counting_rule: The quote_expiry_date counts as a whole calendar day, so signing on that date qualifies and signing after it does not; an expired quote is cancelled by the system with cancellation_reason quote_expired and the customer books a new measure.
          boundary: inclusive
      - id: customer_signs
        applies_to: [install_contract_signed]
        kind: authorization
        condition: The agreement is signed only by the customer, at the quote_amount, and the contract_price may not be below min_job_charge_usd.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.quote_amount]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
    params:
      signing_grace_days: 0
      per_tier:
        Ridgeline Carpet Installation: {quote_extension_days: "=quote_extension_days", min_job_charge_usd: "=min_job_charge_usd"}
        Ridgeline Hard Surface Flooring Installation: {quote_extension_days: "=quote_extension_days", min_job_charge_usd: "=min_job_charge_usd"}
        Ridgeline Window and Door Installation: {quote_extension_days: "=quote_extension_days", min_job_charge_usd: "=min_job_charge_usd"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {quote_extension_days: "=quote_extension_days", min_job_charge_usd: "=min_job_charge_usd"}
        Ridgeline Bath Remodel Installation: {quote_extension_days: "=quote_extension_days", min_job_charge_usd: "=min_job_charge_usd"}
        Ridgeline Roofing and Siding Installation: {quote_extension_days: "=quote_extension_days", min_job_charge_usd: "=min_job_charge_usd"}

  - id: install_payments
    subject: [install_payment_received, install_contract_billed]
    rule: >-
      The deposit due at signing is the greater of deposit_min_usd and deposit_pct percent of the contract price, never more than the contract price, less any measure fee credit applied at signing.
      A progress payment of progress_payment_pct percent of the contract price is due on the day work starts, and the remaining balance is due within final_payment_due_days_after_completion days after completion, subject to the punch-list holdback.
      Payments are accepted on contracts whose status is measure_booked, contracted, scheduled, in_progress or completed.
      The tender must be one of payment_methods_accepted; a payment charged to a Ridgeline Consumer Credit account posts as a purchase on that account and one charged to a Ridgeline Pro Credit account posts as an invoice with pricing_basis contract_price.
      A payment may not exceed the contract's balance_due at the time it is taken.
    eligibility:
      - id: payable_status
        applies_to: [install_payment_received]
        kind: state
        condition: Payments are accepted on contracts whose status is measure_booked, contracted, scheduled, in_progress or completed.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
        state_contract:
          field: install_contracts.status
          allowed: [measure_booked, contracted, scheduled, in_progress, completed]
    params:
      per_tier:
        Ridgeline Carpet Installation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", progress_payment_pct: "=progress_payment_pct"}
        Ridgeline Hard Surface Flooring Installation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", progress_payment_pct: "=progress_payment_pct"}
        Ridgeline Window and Door Installation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", progress_payment_pct: "=progress_payment_pct"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", progress_payment_pct: "=progress_payment_pct"}
        Ridgeline Bath Remodel Installation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", progress_payment_pct: "=progress_payment_pct"}
        Ridgeline Roofing and Siding Installation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", progress_payment_pct: "=progress_payment_pct"}
    formula:
      deposit_due: min(contract_price, max(deposit_min_usd, round(contract_price * deposit_pct / 100, 2)))
      progress_due: round(contract_price * progress_payment_pct / 100, 2)

  - id: install_rescission
    subject: [install_cancelled, install_refund_issued]
    rule: >-
      An agreement signed in the customer's home (contract_signed_channel in_home) with a contract_price at or above rescission_min_contract_usd may be cancelled by the customer without any cancellation fee during the rescission period; when rescission_applies_in_store is false, agreements signed in the store or online carry no rescission right and follow install_cancellation_fees.
      A rescission is accepted only when the customer cancels within rescission_days business days after the agreement was signed.
      Business days are every calendar day except Sundays and federal holidays; the period runs through midnight at the end of the rescission_days-th business day after contract_signed_date, the signing date itself not counted.
      On rescission the contract is cancelled with cancellation_reason rescinded, every contract payment (deposit and any progress payment) is refunded in full to its original tender with refund_reason rescission, and any measure fee credit on the contract is void; the measure fee itself was a separate purchase and is not refunded.
      A rescission takes effect only on the customer's own confirmation.
    eligibility:
      - id: within_rescission_period
        applies_to: [install_cancelled]
        kind: time
        condition: A rescission is accepted only when the customer cancels within rescission_days business days after the agreement was signed.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.contract_signed_date, install_contracts.contract_signed_channel]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement was signed
          anchor_source: install_contracts.contract_signed_date
          relation: not_after
          duration_source: variants.rescission_days
          unit: business_days
          counting_rule: Business days are every calendar day except Sundays and federal holidays; the period runs through midnight at the end of the rescission_days-th business day after contract_signed_date, the signing date itself not counted.
          boundary: inclusive
      - id: customer_confirms
        applies_to: [install_cancelled]
        kind: authorization
        condition: A rescission takes effect only on the customer's own confirmation.
        evidence_fields: [install_requests.install_request_id, install_requests.install_contract_id, install_requests.request_type]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [install_requests.install_contract_id]
          action_bindings:
            install_requests.install_contract_id: install_contract_id
    params:
      per_tier:
        Ridgeline Carpet Installation: {rescission_days: "=rescission_days", rescission_min_contract_usd: "=rescission_min_contract_usd"}
        Ridgeline Hard Surface Flooring Installation: {rescission_days: "=rescission_days", rescission_min_contract_usd: "=rescission_min_contract_usd"}
        Ridgeline Window and Door Installation: {rescission_days: "=rescission_days", rescission_min_contract_usd: "=rescission_min_contract_usd"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {rescission_days: "=rescission_days", rescission_min_contract_usd: "=rescission_min_contract_usd"}
        Ridgeline Bath Remodel Installation: {rescission_days: "=rescission_days", rescission_min_contract_usd: "=rescission_min_contract_usd"}
        Ridgeline Roofing and Siding Installation: {rescission_days: "=rescission_days", rescission_min_contract_usd: "=rescission_min_contract_usd"}

  - id: install_cancellation_fees
    subject: [install_cancelled, install_fee_charged, install_refund_issued]
    rule: >-
      Outside a rescission, a contract in status contracted or scheduled may be cancelled by the customer's own confirmation, recorded first as an install_requests record of request_type cancellation; once work has started (in_progress) the customer may not cancel when cancellation_after_start_allowed is false.
      The cancellation fee is cancellation_fee_pct_before_materials percent of the contract price while materials_status is not_ordered, and cancellation_fee_pct_after_materials percent once materials_status is ordered or received, in either case never less than cancellation_fee_min_usd; when the applicable percentage is 0 no cancellation fee is charged at all.
      When the contract's materials are supplied through a linked special order (linked_special_order_id is not empty), the installation cancellation fee is computed with cancellation_fee_pct_before_materials, and the materials themselves are cancelled or returned under the special order's own rules.
      No cancellation fee is charged when delay_cancellation_fee_waived is true and the customer cancels because installation has not started within delay_threshold_days after the original_install_date for reasons on Ridgeline's or the installer's side.
      The fee posts as one install_fee_charged row with fee_type cancellation_fee referencing the cancellation request, and the refund is install_msr_net_paid less the cancellation fee and less the measure fee paid (a measure fee is never refunded on a contract cancellation), refunded to the tender of the payments with refund_reason cancellation; when the fee exceeds what was paid, the difference remains owed.
    eligibility: []
    params:
      per_tier:
        Ridgeline Carpet Installation: {cancellation_fee_pct_before_materials: "=cancellation_fee_pct_before_materials", cancellation_fee_pct_after_materials: "=cancellation_fee_pct_after_materials", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Hard Surface Flooring Installation: {cancellation_fee_pct_before_materials: "=cancellation_fee_pct_before_materials", cancellation_fee_pct_after_materials: "=cancellation_fee_pct_after_materials", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Window and Door Installation: {cancellation_fee_pct_before_materials: "=cancellation_fee_pct_before_materials", cancellation_fee_pct_after_materials: "=cancellation_fee_pct_after_materials", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {cancellation_fee_pct_before_materials: "=cancellation_fee_pct_before_materials", cancellation_fee_pct_after_materials: "=cancellation_fee_pct_after_materials", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Bath Remodel Installation: {cancellation_fee_pct_before_materials: "=cancellation_fee_pct_before_materials", cancellation_fee_pct_after_materials: "=cancellation_fee_pct_after_materials", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Roofing and Siding Installation: {cancellation_fee_pct_before_materials: "=cancellation_fee_pct_before_materials", cancellation_fee_pct_after_materials: "=cancellation_fee_pct_after_materials", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
    formula:
      fee_pct: cancellation_fee_pct_before_materials if materials_status == "not_ordered" else cancellation_fee_pct_after_materials
      cancellation_fee: 0 if fee_pct == 0 else max(cancellation_fee_min_usd, round(contract_price * fee_pct / 100, 2))
      refund_due: max(0, install_msr_net_paid - cancellation_fee - measure_fee_usd)
    measures: [install_msr_net_paid]

  - id: install_scheduling
    subject: [install_scheduled, install_rescheduled, install_materials_updated, install_fee_charged]
    rule: >-
      An installation is scheduled only after materials_status is received when scheduling_requires_materials_received is true, and only after permit_status is issued when the job requires a permit and scheduling_requires_permit_issued is true.
      The installation date may be no earlier than min_lead_days_install calendar days after the later of contract_signed_date and materials_received_date, and the first date booked is kept as original_install_date.
      A booked installation can be moved only while the contract status is scheduled.
      A customer reschedule is free when it is requested at least reschedule_free_notice_hours hours before scheduled_install_at (full 60-minute periods counted back from the window start; exactly that many hours qualifies) and the contract's customer_reschedule_count before the request is below max_customer_reschedules; otherwise one install_fee_charged row with fee_type reschedule_fee posts, referencing the reschedule request.
      materials_lead_days_estimate is the typical time to materials receipt quoted to the customer at signing and is never a promised date.
      Every customer reschedule adds one to customer_reschedule_count; a reschedule made on Ridgeline's or the installer's side never incurs a fee and is not counted.
      Materials and permit status are recorded by the store and the permit office, never on the customer's say-so.
    eligibility:
      - id: scheduled_only
        applies_to: [install_rescheduled]
        kind: state
        condition: A booked installation can be moved only while the contract status is scheduled.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
        state_contract:
          field: install_contracts.status
          allowed: [scheduled]
    params:
      per_tier:
        Ridgeline Carpet Installation: {reschedule_free_notice_hours: "=reschedule_free_notice_hours", reschedule_fee_usd: "=reschedule_fee_usd", max_customer_reschedules: "=max_customer_reschedules", min_lead_days_install: "=min_lead_days_install"}
        Ridgeline Hard Surface Flooring Installation: {reschedule_free_notice_hours: "=reschedule_free_notice_hours", reschedule_fee_usd: "=reschedule_fee_usd", max_customer_reschedules: "=max_customer_reschedules", min_lead_days_install: "=min_lead_days_install"}
        Ridgeline Window and Door Installation: {reschedule_free_notice_hours: "=reschedule_free_notice_hours", reschedule_fee_usd: "=reschedule_fee_usd", max_customer_reschedules: "=max_customer_reschedules", min_lead_days_install: "=min_lead_days_install"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {reschedule_free_notice_hours: "=reschedule_free_notice_hours", reschedule_fee_usd: "=reschedule_fee_usd", max_customer_reschedules: "=max_customer_reschedules", min_lead_days_install: "=min_lead_days_install"}
        Ridgeline Bath Remodel Installation: {reschedule_free_notice_hours: "=reschedule_free_notice_hours", reschedule_fee_usd: "=reschedule_fee_usd", max_customer_reschedules: "=max_customer_reschedules", min_lead_days_install: "=min_lead_days_install"}
        Ridgeline Roofing and Siding Installation: {reschedule_free_notice_hours: "=reschedule_free_notice_hours", reschedule_fee_usd: "=reschedule_fee_usd", max_customer_reschedules: "=max_customer_reschedules", min_lead_days_install: "=min_lead_days_install"}

  - id: install_visits_and_delays
    subject: [install_visit_recorded, install_fee_charged, install_credit_applied, install_started, install_cancelled]
    rule: >-
      The installer records every measure, installation and warranty service visit with its outcome; the record, not the customer's or the installer's later account, decides what follows.
      An installation or warranty visit that cannot proceed because the customer was absent (customer_no_show) or the site was not ready (site_not_ready) incurs trip_charge_usd, subject to install_agg_same_address.
      A scheduled installation or warranty visit the installer missed (installer_no_show) earns installer_no_show_credit_usd, and the visit is rebooked without any reschedule fee.
      When installation starts more than delay_threshold_days calendar days after original_install_date and no customer reschedule, customer no-show or site-not-ready visit occurred in between, the delay is on Ridgeline's or the installer's side and earns delay_credit_usd; the delay credit and installer no-show credits on the same contract do not stack — the customer receives the larger, so the delay credit posted is delay_credit_usd less the no-show credits already posted, and none when that is not above zero.
      When install_msr_customer_no_shows reaches customer_no_show_cancel_count, Ridgeline may cancel the contract with cancellation_reason customer_no_show and the cancellation fee of install_cancellation_fees.
    eligibility: []
    params:
      per_tier:
        Ridgeline Carpet Installation: {trip_charge_usd: "=trip_charge_usd", installer_no_show_credit_usd: "=installer_no_show_credit_usd", delay_credit_usd: "=delay_credit_usd", delay_threshold_days: "=delay_threshold_days"}
        Ridgeline Hard Surface Flooring Installation: {trip_charge_usd: "=trip_charge_usd", installer_no_show_credit_usd: "=installer_no_show_credit_usd", delay_credit_usd: "=delay_credit_usd", delay_threshold_days: "=delay_threshold_days"}
        Ridgeline Window and Door Installation: {trip_charge_usd: "=trip_charge_usd", installer_no_show_credit_usd: "=installer_no_show_credit_usd", delay_credit_usd: "=delay_credit_usd", delay_threshold_days: "=delay_threshold_days"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {trip_charge_usd: "=trip_charge_usd", installer_no_show_credit_usd: "=installer_no_show_credit_usd", delay_credit_usd: "=delay_credit_usd", delay_threshold_days: "=delay_threshold_days"}
        Ridgeline Bath Remodel Installation: {trip_charge_usd: "=trip_charge_usd", installer_no_show_credit_usd: "=installer_no_show_credit_usd", delay_credit_usd: "=delay_credit_usd", delay_threshold_days: "=delay_threshold_days"}
        Ridgeline Roofing and Siding Installation: {trip_charge_usd: "=trip_charge_usd", installer_no_show_credit_usd: "=installer_no_show_credit_usd", delay_credit_usd: "=delay_credit_usd", delay_threshold_days: "=delay_threshold_days"}
    formula:
      delay_credit_due: max(0, delay_credit_usd - install_msr_no_show_credits)
    measures: [install_msr_customer_no_shows, install_msr_no_show_credits]

  - id: install_change_orders
    subject: [install_change_order_billed, install_credit_applied, install_fee_charged]
    rule: >-
      A change to the scope of a signed contract is made only by a change order the customer signs, requested as an install_requests record of request_type change_order with the change_order_amount priced by the installer.
      Change orders are accepted while the contract status is contracted, scheduled or in_progress.
      The customer must sign the change order no later than change_order_sign_days calendar days after the change order request was created.
      Days are counted as calendar days from the date part of the request's created_at as day 0 to the signing date; an unsigned change order lapses after the last day and changes nothing.
      A signed increase posts as an install_change_order_billed row with the next change_order_number and incurs change_order_admin_fee_usd; a signed reduction posts as an install_credit_applied row with credit_type change_order_reduction and no fee.
      When install_msr_change_order_increase, counting the new change order, would exceed change_order_max_pct_without_requote percent, the change cannot be made by change order and a new measure and quote are required.
      Only the customer who holds the contract may sign a change order.
    eligibility:
      - id: open_contract
        applies_to: [install_change_order_billed]
        kind: state
        condition: Change orders are accepted while the contract status is contracted, scheduled or in_progress.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
        state_contract:
          field: install_contracts.status
          allowed: [contracted, scheduled, in_progress]
      - id: signed_in_time
        applies_to: [install_change_order_billed]
        kind: time
        condition: The customer must sign the change order no later than change_order_sign_days calendar days after the change order request was created.
        evidence_fields: [install_requests.install_request_id, install_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_requests.install_request_id]
          action_bindings:
            install_requests.install_request_id: install_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the change order request was created
          anchor_source: install_requests.created_at
          relation: not_after
          duration_source: variants.change_order_sign_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the date part of the request's created_at as day 0 to the signing date; an unsigned change order lapses after the last day and changes nothing.
          boundary: inclusive
      - id: holder_signs
        applies_to: [install_change_order_billed, install_credit_applied]
        kind: authorization
        condition: Only the customer who holds the contract may sign a change order.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
    params:
      per_tier:
        Ridgeline Carpet Installation: {change_order_admin_fee_usd: "=change_order_admin_fee_usd", change_order_max_pct_without_requote: "=change_order_max_pct_without_requote"}
        Ridgeline Hard Surface Flooring Installation: {change_order_admin_fee_usd: "=change_order_admin_fee_usd", change_order_max_pct_without_requote: "=change_order_max_pct_without_requote"}
        Ridgeline Window and Door Installation: {change_order_admin_fee_usd: "=change_order_admin_fee_usd", change_order_max_pct_without_requote: "=change_order_max_pct_without_requote"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {change_order_admin_fee_usd: "=change_order_admin_fee_usd", change_order_max_pct_without_requote: "=change_order_max_pct_without_requote"}
        Ridgeline Bath Remodel Installation: {change_order_admin_fee_usd: "=change_order_admin_fee_usd", change_order_max_pct_without_requote: "=change_order_max_pct_without_requote"}
        Ridgeline Roofing and Siding Installation: {change_order_admin_fee_usd: "=change_order_admin_fee_usd", change_order_max_pct_without_requote: "=change_order_max_pct_without_requote"}
    measures: [install_msr_change_order_increase]

  - id: install_permits_and_haul_away
    subject: [install_materials_updated, install_fee_charged]
    rule: >-
      Whether a job needs a permit is recorded at the measure; when it does, Ridgeline pulls the permit and permit_status moves from required_pending to issued when the permit office issues it.
      When permit_fee_passthrough is true, the municipal permit fee recorded in permit_fee_amount is billed at cost as an install_fee_charged row with fee_type permit_fee, and permit_handling_fee_usd as a row with fee_type permit_handling_fee, both on the date the permit is issued; no permit fee rows post for a job that needs no permit.
      Removal and disposal of the old material is part of the contract price when haul_away_included is true; otherwise haul_away_fee_usd is billed as fee_type haul_away_fee on the installation date when the customer chose removal.
    eligibility: []
    params:
      per_tier:
        Ridgeline Carpet Installation: {permit_fee_passthrough: "=permit_fee_passthrough", permit_handling_fee_usd: "=permit_handling_fee_usd", haul_away_fee_usd: "=haul_away_fee_usd"}
        Ridgeline Hard Surface Flooring Installation: {permit_fee_passthrough: "=permit_fee_passthrough", permit_handling_fee_usd: "=permit_handling_fee_usd", haul_away_fee_usd: "=haul_away_fee_usd"}
        Ridgeline Window and Door Installation: {permit_fee_passthrough: "=permit_fee_passthrough", permit_handling_fee_usd: "=permit_handling_fee_usd", haul_away_fee_usd: "=haul_away_fee_usd"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {permit_fee_passthrough: "=permit_fee_passthrough", permit_handling_fee_usd: "=permit_handling_fee_usd", haul_away_fee_usd: "=haul_away_fee_usd"}
        Ridgeline Bath Remodel Installation: {permit_fee_passthrough: "=permit_fee_passthrough", permit_handling_fee_usd: "=permit_handling_fee_usd", haul_away_fee_usd: "=haul_away_fee_usd"}
        Ridgeline Roofing and Siding Installation: {permit_fee_passthrough: "=permit_fee_passthrough", permit_handling_fee_usd: "=permit_handling_fee_usd", haul_away_fee_usd: "=haul_away_fee_usd"}

  - id: install_completion_and_closure
    subject: [install_started, install_completed, install_closed]
    rule: >-
      Work starts and completes only as recorded by the installer.
      When final_walkthrough_required is true a walkthrough is held at completion and any open items are recorded as a punch list; while punch_list_open is true the customer may withhold up to punch_list_holdback_pct percent of the contract price from the final payment, and the punch list is resolved within punch_list_resolution_days days of completion, after which the withheld amount is due.
      The remaining balance is due within final_payment_due_days_after_completion days after completed_date.
      A contract closes when its balance_due is 0.00 and the customer has signed the completion certificate, or completion_signoff_days days have passed since completed_date without a signed certificate; a contract with a balance owed never closes.
      An overpayment found at closing is refunded to the tender it was paid with, with refund_reason overpayment.
    eligibility: []
    params:
      per_tier:
        Ridgeline Carpet Installation: {punch_list_holdback_pct: "=punch_list_holdback_pct", completion_signoff_days: "=completion_signoff_days", final_payment_due_days_after_completion: "=final_payment_due_days_after_completion"}
        Ridgeline Hard Surface Flooring Installation: {punch_list_holdback_pct: "=punch_list_holdback_pct", completion_signoff_days: "=completion_signoff_days", final_payment_due_days_after_completion: "=final_payment_due_days_after_completion"}
        Ridgeline Window and Door Installation: {punch_list_holdback_pct: "=punch_list_holdback_pct", completion_signoff_days: "=completion_signoff_days", final_payment_due_days_after_completion: "=final_payment_due_days_after_completion"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {punch_list_holdback_pct: "=punch_list_holdback_pct", completion_signoff_days: "=completion_signoff_days", final_payment_due_days_after_completion: "=final_payment_due_days_after_completion"}
        Ridgeline Bath Remodel Installation: {punch_list_holdback_pct: "=punch_list_holdback_pct", completion_signoff_days: "=completion_signoff_days", final_payment_due_days_after_completion: "=final_payment_due_days_after_completion"}
        Ridgeline Roofing and Siding Installation: {punch_list_holdback_pct: "=punch_list_holdback_pct", completion_signoff_days: "=completion_signoff_days", final_payment_due_days_after_completion: "=final_payment_due_days_after_completion"}
    formula:
      holdback_max: round(contract_price * punch_list_holdback_pct / 100, 2)

  - id: install_workmanship_warranty
    subject: [install_visit_recorded]
    rule: >-
      Installation labor is warranted for labor_warranty_months calendar months from completed_date; a workmanship claim is filed as an install_requests record of request_type workmanship_claim on a contract whose status is completed or closed.
      A claim filed on or before the date labor_warranty_months calendar months after completed_date (same day of the month, or the last day of that month when that day does not exist) is in_warranty: a warranty service visit is booked within workmanship_claim_response_days days at no charge.
      A later claim is out_of_warranty: the service visit incurs trip_charge_usd and any repair is quoted separately.
      A claim is accepted from the customer who holds the contract, or from a later owner of the home only when warranty_transferable is true.
      Damage from causes other than the installation workmanship (product defects, water, misuse) is not covered by the labor warranty.
    eligibility:
      - id: claimant_entitled
        applies_to: [install_visit_recorded]
        kind: caller_fact
        condition: A claim is accepted from the customer who holds the contract, or from a later owner of the home only when warranty_transferable is true.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.customer_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
    params:
      per_tier:
        Ridgeline Carpet Installation: {labor_warranty_months: "=labor_warranty_months", warranty_transferable: "=warranty_transferable", workmanship_claim_response_days: "=workmanship_claim_response_days"}
        Ridgeline Hard Surface Flooring Installation: {labor_warranty_months: "=labor_warranty_months", warranty_transferable: "=warranty_transferable", workmanship_claim_response_days: "=workmanship_claim_response_days"}
        Ridgeline Window and Door Installation: {labor_warranty_months: "=labor_warranty_months", warranty_transferable: "=warranty_transferable", workmanship_claim_response_days: "=workmanship_claim_response_days"}
        Ridgeline Kitchen Cabinet and Countertop Installation: {labor_warranty_months: "=labor_warranty_months", warranty_transferable: "=warranty_transferable", workmanship_claim_response_days: "=workmanship_claim_response_days"}
        Ridgeline Bath Remodel Installation: {labor_warranty_months: "=labor_warranty_months", warranty_transferable: "=warranty_transferable", workmanship_claim_response_days: "=workmanship_claim_response_days"}
        Ridgeline Roofing and Siding Installation: {labor_warranty_months: "=labor_warranty_months", warranty_transferable: "=warranty_transferable", workmanship_claim_response_days: "=workmanship_claim_response_days"}

  - id: install_refunds
    subject: [install_refund_issued]
    rule: >-
      Every refund goes back to the tender of the payment it refunds and references that install_payment_received row in original_charge_id; a refund never exceeds the payment it references and is never issued in cash for a card or Pro Credit payment.
      Refunds are issued only on contracts whose status is cancelled, completed or closed.
      A payment row is refunded at most once; when a refund is owed across several payments, the most recent payments are refunded first.
    eligibility:
      - id: refundable_status
        applies_to: [install_refund_issued]
        kind: state
        condition: Refunds are issued only on contracts whose status is cancelled, completed or closed.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: install_contract_id
        state_contract:
          field: install_contracts.status
          allowed: [cancelled, completed, closed]
      - id: refund_once
        applies_to: [install_refund_issued]
        kind: dedup
        condition: A payment row is refunded at most once; when a refund is owed across several payments, the most recent payments are refunded first.
        evidence_fields: [install_charges.original_charge_id, install_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_charges.original_charge_id]
          action_bindings:
            install_charges.original_charge_id: original_charge_id
        dedup_contract:
          table: install_charges
          mode: separate_record
          object_bindings: {original_charge_id: original_charge_id}
          duplicate_filters: {event_type: [install_refund_issued]}
          distinct_fields: []

extended_policies:
  - id: install_ext_reschedule_fee
    base_policy_refs: [install_agg_same_address, install_cancellation_fees, install_scheduling, install_visits_and_delays, install_change_orders, install_permits_and_haul_away]
    overwrite:
      - base_policy: install_scheduling
        superseded_clause: >-
          otherwise one install_fee_charged row with fee_type reschedule_fee posts, referencing the reschedule request.
        replaced_by: >-
          The customer reschedule fee posts as one reschedule fee line on the contract, referencing the reschedule request it arises from, at the amount this rule fixes.
    trigger: state_due
    subject: [install_fee_charged]
    computes: fee_amount
    target_tool: post_reschedule_fee_05a0220d
    params:
      next_day_multiple: 1.5
      premier_share: 0.5
      preferred_share: 0.75
      goodwill_share: 0.5
      repeat_disruption_multiple: 1.25
      large_job_floor: 15000.00
      large_job_multiple: 1.5
      small_job_ceiling: 2500.00
      small_job_share: 0.9
      same_week_days: 7
      same_week_share: 0.8
      long_move_floor: 28
      long_move_multiple: 1.25
    rule: >-
      This rule fixes the customer reschedule fee owed for a customer reschedule of a booked installation that the scheduling rules do not make free; a customer reschedule those rules make free carries no customer reschedule fee and is outside this rule.
      The customer reschedule fee is charged for the most recent customer reschedule request on the contract that was carried out (request status completed).
      The customer reschedule fee posts as one reschedule fee line on the contract, referencing the reschedule request it arises from, at the amount this rule fixes.
      The customer reschedule fee is the program's reschedule fee for the installation program on the contract, rounded to the cent.
      The customer reschedule fee is worked out in this order: first its starting amount is fixed by the notice rule; that starting amount is then multiplied once by the product of the cardholder share, the job-history share, the job-size share and the move-distance share, and the product is rounded to the cent only at the end; no share is rounded on its own.
      Notice rule: the reschedule notice is the number of calendar days from the date the reschedule request was registered to the original installation date recorded on the contract.
      With a reschedule notice of 0 days (the request was registered on the original installation date itself) the crew is already committed, and the starting amount of the customer reschedule fee is the program's reschedule fee plus the program's trip charge; with a reschedule notice of exactly 1 day the starting amount is the program's reschedule fee multiplied by the next-day notice multiple and rounded to the cent; with a reschedule notice of 2 days or more the starting amount is the program's reschedule fee.
      Cardholder share of the customer reschedule fee: the Premier cardholder share applies to a customer who holds an active Ridgeline Consumer Credit Card Premier account and has no late fee assessed on any of their Ridgeline Consumer Credit accounts less than 12 whole months before today; the Preferred cardholder share applies to a customer who holds an active Ridgeline Consumer Credit Card Preferred account and has no such late fee in that period; every other customer pays a cardholder share of 1.
      Job-history share of the customer reschedule fee: the goodwill share applies when the contract records an installer no-show visit and no visit at which the customer was absent or the site was not ready; the repeat-disruption multiple applies when the contract records a visit at which the customer was absent or the site was not ready and no installer no-show visit; on any other contract the job-history share is 1.
      Job-size share of the customer reschedule fee: the contract price billed on the contract is read from its contract billing line; a contract price at or above the large-job floor takes the large-job multiple, a contract price below the small-job ceiling takes the small-job share, and any other contract price takes a job-size share of 1.
      Move-distance share of the customer reschedule fee: the move distance is the number of calendar days from the original installation date to the new installation date the reschedule request asked for; a move distance of at most the same-week days takes the same-week share, a move distance of more than the long-move floor takes the long-move multiple, and any other move distance takes a move-distance share of 1.
    prerequisite: []
    cross_category:
      - category: card
        as: history
        reads: [variant_name, status, card_transactions.event_type, card_transactions.fee_type, card_transactions.transaction_date]
        note: The cardholder share is decided from the customer's active revolving card tier and the late fees on their Ridgeline Consumer Credit ledger in the last 12 months.
    compute:
      - prog_fee: "P('reschedule_fee_usd')"
      - prog_trip: "P('trip_charge_usd')"
      - request_registered: "LATEST('install_requests', 'created_at', date_field='created_at', request_type='reschedule', status='completed')"
      - notice_days: "DAYS(request_registered, F('original_install_date'))"
      - notice_start_amount: "prog_fee + prog_trip if notice_days <= 0 else (RND(prog_fee * K('next_day_multiple'), 2) if notice_days == 1 else prog_fee)"
      - card_late_fees_12m: "XCOUNT('card', 'card_transactions', within_months=12, date_field='transaction_date', event_type='card_fee_assessed', fee_type='late_fee')"
      - holds_premier: "EXISTS('card', variant_name='Ridgeline Consumer Credit Card Premier', status='active')"
      - holds_preferred: "EXISTS('card', variant_name='Ridgeline Consumer Credit Card Preferred', status='active')"
      - cardholder_share: "K('premier_share') if (holds_premier and card_late_fees_12m == 0) else (K('preferred_share') if (holds_preferred and card_late_fees_12m == 0) else 1.0)"
      - installer_missed_visits: "COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='installer_no_show')"
      - customer_absent_visits: "COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='customer_no_show')"
      - site_unready_visits: "COUNT('install_charges', date_field='charge_date', event_type='install_visit_recorded', visit_outcome='site_not_ready')"
      - job_history_share: "K('goodwill_share') if (installer_missed_visits > 0 and customer_absent_visits + site_unready_visits == 0) else (K('repeat_disruption_multiple') if (customer_absent_visits + site_unready_visits > 0 and installer_missed_visits == 0) else 1.0)"
      - billed_contract_price: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_contract_billed')"
      - job_size_share: "K('large_job_multiple') if billed_contract_price >= K('large_job_floor') else (K('small_job_share') if billed_contract_price < K('small_job_ceiling') else 1.0)"
      - requested_new_date: "LATEST('install_requests', 'requested_date', date_field='created_at', request_type='reschedule', status='completed')"
      - move_days: "DAYS(F('original_install_date'), requested_new_date)"
      - move_distance_share: "K('same_week_share') if move_days <= K('same_week_days') else (K('long_move_multiple') if move_days > K('long_move_floor') else 1.0)"
      - result: "RND(notice_start_amount * cardholder_share * job_history_share * job_size_share * move_distance_share, 2)"
    compute_basis:
      prog_fee: "The customer reschedule fee is the program's reschedule fee for the installation program on the contract, rounded to the cent."
      prog_trip: "the starting amount of the customer reschedule fee is the program's reschedule fee plus the program's trip charge"
      request_registered: "The customer reschedule fee is charged for the most recent customer reschedule request on the contract that was carried out (request status completed)."
      notice_days: "the reschedule notice is the number of calendar days from the date the reschedule request was registered to the original installation date recorded on the contract."
      notice_start_amount: "With a reschedule notice of 0 days (the request was registered on the original installation date itself) the crew is already committed, and the starting amount of the customer reschedule fee is the program's reschedule fee plus the program's trip charge; with a reschedule notice of exactly 1 day the starting amount is the program's reschedule fee multiplied by the next-day notice multiple and rounded to the cent; with a reschedule notice of 2 days or more the starting amount is the program's reschedule fee."
      card_late_fees_12m: "has no late fee assessed on any of their Ridgeline Consumer Credit accounts less than 12 whole months before today"
      holds_premier: "a customer who holds an active Ridgeline Consumer Credit Card Premier account"
      holds_preferred: "a customer who holds an active Ridgeline Consumer Credit Card Preferred account"
      cardholder_share: "Cardholder share of the customer reschedule fee: the Premier cardholder share applies to a customer who holds an active Ridgeline Consumer Credit Card Premier account and has no late fee assessed on any of their Ridgeline Consumer Credit accounts less than 12 whole months before today; the Preferred cardholder share applies to a customer who holds an active Ridgeline Consumer Credit Card Preferred account and has no such late fee in that period; every other customer pays a cardholder share of 1."
      installer_missed_visits: "the contract records an installer no-show visit"
      customer_absent_visits: "a visit at which the customer was absent or the site was not ready"
      site_unready_visits: "a visit at which the customer was absent or the site was not ready"
      job_history_share: "Job-history share of the customer reschedule fee: the goodwill share applies when the contract records an installer no-show visit and no visit at which the customer was absent or the site was not ready; the repeat-disruption multiple applies when the contract records a visit at which the customer was absent or the site was not ready and no installer no-show visit; on any other contract the job-history share is 1."
      billed_contract_price: "the contract price billed on the contract is read from its contract billing line"
      job_size_share: "a contract price at or above the large-job floor takes the large-job multiple, a contract price below the small-job ceiling takes the small-job share, and any other contract price takes a job-size share of 1."
      requested_new_date: "the new installation date the reschedule request asked for"
      move_days: "the move distance is the number of calendar days from the original installation date to the new installation date the reschedule request asked for"
      move_distance_share: "a move distance of at most the same-week days takes the same-week share, a move distance of more than the long-move floor takes the long-move multiple, and any other move distance takes a move-distance share of 1."
      result: "that starting amount is then multiplied once by the product of the cardholder share, the job-history share, the job-size share and the move-distance share, and the product is rounded to the cent only at the end; no share is rounded on its own."
    factors:
      - id: reschedule_notice
        effect: method
        decides: notice_start_amount
        bindings: [request_registered, notice_days, notice_start_amount]
        ladder:
          - when: "the reschedule request was registered on the original installation date itself (a reschedule notice of 0 days)"
            method: "the starting amount is the program's reschedule fee plus the program's trip charge"
          - when: "the reschedule request was registered the day before the original installation date (a reschedule notice of exactly 1 day)"
            method: "the starting amount is the program's reschedule fee multiplied by the next-day notice multiple, rounded to the cent"
          - when: "otherwise (a reschedule notice of 2 days or more)"
            method: "the starting amount is the program's reschedule fee"
        baseline:
          notice_start_amount: "prog_fee"
        evidence: [history, date]
        cross_difficulty: null
      - id: cardholder_courtesy
        effect: parameter
        decides: cardholder_share
        bindings: [card_late_fees_12m, holds_premier, holds_preferred, cardholder_share]
        ladder:
          - when: "an active Ridgeline Consumer Credit Card Premier account AND no late fee on the customer's Ridgeline Consumer Credit accounts less than 12 whole months before today"
            value: "K('premier_share')"
          - when: "an active Ridgeline Consumer Credit Card Preferred account AND no such late fee in that period"
            value: "K('preferred_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          cardholder_share: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: job_history
        effect: parameter
        decides: job_history_share
        bindings: [installer_missed_visits, customer_absent_visits, site_unready_visits, job_history_share]
        ladder:
          - when: "the contract records an installer no-show visit AND no visit at which the customer was absent or the site was not ready"
            value: "K('goodwill_share')"
          - when: "the contract records a visit at which the customer was absent or the site was not ready AND no installer no-show visit"
            value: "K('repeat_disruption_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          job_history_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: job_size
        effect: parameter
        decides: job_size_share
        bindings: [billed_contract_price, job_size_share]
        ladder:
          - when: "the contract price billed is at or above the large-job floor"
            value: "K('large_job_multiple')"
          - when: "the contract price billed is below the small-job ceiling"
            value: "K('small_job_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          job_size_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: move_distance
        effect: parameter
        decides: move_distance_share
        bindings: [requested_new_date, move_days, move_distance_share]
        ladder:
          - when: "the new installation date asked for is at most the same-week days after the original installation date"
            value: "K('same_week_share')"
          - when: "the new installation date asked for is more than the long-move floor days after the original installation date"
            value: "K('long_move_multiple')"
          - when: "otherwise"
            value: "1"
        baseline:
          move_distance_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The customer reschedule fee is the program's reschedule fee for the installation program on the contract, rounded to the cent.
      params: [reschedule_fee_usd]
    inputs:
      history:
        - {table: install_requests, aggregate: latest, field: created_at, filters: {request_type: reschedule, status: completed}}
        - {table: install_requests, aggregate: latest, field: requested_date, filters: {request_type: reschedule, status: completed}}
        - {table: install_charges, aggregate: count, field: install_charge_id, filters: {event_type: install_visit_recorded}}
        - {table: install_charges, aggregate: sum, field: amount, filters: {event_type: install_contract_billed}}
        - {category: card, table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 12, filters: {event_type: card_fee_assessed, fee_type: late_fee}}
      cross_category: [card]

  - id: install_ext_final_payment
    base_policy_refs: [install_payments, install_completion_and_closure]
    overwrite:
      - base_policy: install_payments
        superseded_clause: >-
          and the remaining balance is due within final_payment_due_days_after_completion days after completion, subject to the punch-list holdback.
        replaced_by: >-
          The final settlement payment is the amount this rule fixes: the open balance of the contract, less the punch-list holdback, the project bundle allowance, the change order fee forgiveness and the materials lateness allowance, plus the settlement timing adjustment.
      - base_policy: install_completion_and_closure
        superseded_clause: >-
          while punch_list_open is true the customer may withhold up to punch_list_holdback_pct percent of the contract price from the final payment
        replaced_by: >-
          Punch-list holdback on the final settlement payment: while the punch list recorded at the walkthrough is open and no more than the program's punch-list resolution days have passed since the completion date, the full holdback share applies; while the punch list is open after that period, the late punch-list share applies; when no punch list is open the holdback share is 0.
    trigger: on_request
    subject: [install_payment_received]
    computes: payment_amount
    target_tool: pay_final_balance_37ea441b
    params:
      late_punch_list_share: 0.5
      bundle_floor: 10000.00
      bundle_pct: 2
      bundle_flat_usd: 100.00
      prompt_settlement_rate: -0.005
      late_settlement_rate: 0.015
      late_settlement_grace_days: 30
      small_change_pct: 5
      mid_change_pct: 10
      mid_change_forgiveness_share: 0.5
      long_lateness_days: 14
      long_lateness_allowance_usd: 150.00
      short_lateness_allowance_usd: 75.00
    rule: >-
      This rule fixes the final settlement payment a customer makes on a contract whose status is completed, charged to the customer's own bank card.
      The final settlement payment is worked out only after every customer reschedule recorded on the contract carries the reschedule fee line owed for it.
      The final settlement payment is the open balance of the contract: the contract price billed, plus every change order billed, every measure fee charged and every fee charged, plus every refund paid out, less every payment received and every credit applied, all read from the contract's lines and rounded to the cent.
      The final settlement payment is the amount this rule fixes: the open balance of the contract, less the punch-list holdback, the project bundle allowance, the change order fee forgiveness and the materials lateness allowance, plus the settlement timing adjustment.
      Each of those amounts is worked out on its own base and rounded to the cent, and they are then combined once with the open balance; the final settlement payment is rounded to the cent at the end.
      The punch-list holdback is the program's punch-list holdback percentage of the contract price billed, multiplied by the holdback share.
      Punch-list holdback on the final settlement payment: while the punch list recorded at the walkthrough is open and no more than the program's punch-list resolution days have passed since the completion date, the full holdback share applies; while the punch list is open after that period, the late punch-list share applies; when no punch list is open the holdback share is 0.
      Project bundle allowance on the final settlement payment: when the special order linked to the contract as its materials is completed and its order total is at or above the bundle floor, the allowance is the bundle percentage of that special order's order total, rounded to the cent; when the linked special order is completed with an order total below the bundle floor, the allowance is the flat bundle allowance; when no completed special order is linked to the contract there is no project bundle allowance.
      Settlement timing adjustment on the final settlement payment: the days since completion are the calendar days from the completion date to today; a settlement within the program's final payment due days takes the prompt settlement rate, a settlement more than the late-settlement grace days after the end of that due period takes the late settlement rate, and any other settlement takes a rate of 0; the adjustment is that rate applied to the contract price billed, rounded to the cent, and a negative adjustment lowers the payment.
      Change order fee forgiveness on the final settlement payment: the change order increase is every change order billed as a percentage of the contract price billed; when the increase is above 0 and below the small-change percentage, the whole of the change order administration fees charged on the contract is forgiven; when the increase is at or above the small-change percentage and below the mid-change percentage, the mid-change forgiveness share of those fees is forgiven; otherwise nothing is forgiven.
      Materials lateness allowance on the final settlement payment: the materials lateness is the calendar days from the linked special order's promised ready date to its ready date, and the special order program's vendor delay threshold marks the lateness that program's own delay remedies take over; when the materials lateness is more than the long-lateness days and no more than that threshold, the long lateness allowance applies; when it is above 0 and no more than both the long-lateness days and that threshold, the short lateness allowance applies; otherwise there is no materials lateness allowance.
    prerequisite:
      - problem: install_ext_reschedule_fee
        kind: value_input
        gate: fee_total
        form: state
        policy_source: >-
          The final settlement payment is worked out only after every customer reschedule recorded on the contract carries the reschedule fee line owed for it.
        condition: >-
          Every completed customer reschedule request on the contract that the scheduling rules do not make free is referenced by an install_fee_charged line of fee_type reschedule_fee on the contract.
        resolved_by: post_reschedule_fee_05a0220d
        effect: >-
          Once the reschedule fee line stands on the contract, every fee charged (fee_total) includes it, so the open balance and the final settlement payment rise by the amount of that line.
    cross_category:
      - category: special
        as: branch
        reads: [status, order_total, promised_ready_date, ready_date, linked_install_contract_id, vendor_delay_threshold_days]
        note: The project bundle allowance and the materials lateness allowance are decided from the special order linked to the contract as its materials.
    compute:
      - contract_billed_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_contract_billed')"
      - change_order_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_change_order_billed')"
      - measure_fee_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_measure_fee_charged')"
      - fee_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_fee_charged')"
      - payment_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_payment_received')"
      - credit_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_credit_applied')"
      - refund_total: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_refund_issued')"
      - open_balance: "RND(contract_billed_total + change_order_total + measure_fee_total + fee_total + refund_total - payment_total - credit_total, 2)"
      - holdback_days_since_completion: "DAYS(F('completed_date'), NOW)"
      - holdback_share: "1.0 if (F('punch_list_open') == True and holdback_days_since_completion <= P('punch_list_resolution_days')) else (K('late_punch_list_share') if F('punch_list_open') == True else 0.0)"
      - holdback_amount: "RND(contract_billed_total * P('punch_list_holdback_pct') / 100 * holdback_share, 2)"
      - linked_order_total: "CFIELD('special', 'order_total', linked_install_contract_id=HID, status='completed')"
      - linked_order_completed: "EXISTS('special', linked_install_contract_id=HID, status='completed')"
      - bundle_allowance: "RND(linked_order_total * K('bundle_pct') / 100, 2) if (linked_order_completed and linked_order_total >= K('bundle_floor')) else (K('bundle_flat_usd') if (linked_order_completed and linked_order_total > 0) else 0.0)"
      - settlement_days_since_completion: "DAYS(F('completed_date'), NOW)"
      - settlement_rate: "K('prompt_settlement_rate') if settlement_days_since_completion <= P('final_payment_due_days_after_completion') else (K('late_settlement_rate') if settlement_days_since_completion > P('final_payment_due_days_after_completion') + K('late_settlement_grace_days') else 0.0)"
      - settlement_adjustment: "RND(contract_billed_total * settlement_rate, 2)"
      - change_order_admin_fees: "SUM('install_charges', 'amount', date_field='charge_date', event_type='install_fee_charged', fee_type='change_order_admin_fee')"
      - change_order_increase_pct: "change_order_total / contract_billed_total * 100 if contract_billed_total > 0 else 0"
      - forgiveness_share: "1.0 if (change_order_increase_pct > 0 and change_order_increase_pct < K('small_change_pct') and change_order_admin_fees > 0) else (K('mid_change_forgiveness_share') if (change_order_increase_pct >= K('small_change_pct') and change_order_increase_pct < K('mid_change_pct') and change_order_admin_fees > 0) else 0.0)"
      - fee_forgiveness: "RND(change_order_admin_fees * forgiveness_share, 2)"
      - linked_promised_ready: "CFIELD('special', 'promised_ready_date', linked_install_contract_id=HID)"
      - linked_ready: "CFIELD('special', 'ready_date', linked_install_contract_id=HID)"
      - linked_delay_threshold: "CPARAM('special', 'vendor_delay_threshold_days', linked_install_contract_id=HID)"
      - materials_late_days: "DAYS(linked_promised_ready, linked_ready) if (linked_promised_ready and linked_ready) else 0"
      - lateness_allowance: "K('long_lateness_allowance_usd') if (materials_late_days > K('long_lateness_days') and materials_late_days <= (linked_delay_threshold or 0)) else (K('short_lateness_allowance_usd') if (materials_late_days > 0 and materials_late_days <= K('long_lateness_days') and materials_late_days <= (linked_delay_threshold or 0)) else 0.0)"
      - result: "RND(open_balance - holdback_amount - bundle_allowance - fee_forgiveness - lateness_allowance + settlement_adjustment, 2)"
    compute_basis:
      contract_billed_total: "the contract price billed"
      change_order_total: "plus every change order billed"
      measure_fee_total: "every measure fee charged"
      fee_total: "every fee charged"
      payment_total: "less every payment received"
      credit_total: "every credit applied"
      refund_total: "plus every refund paid out"
      open_balance: "The final settlement payment is the open balance of the contract: the contract price billed, plus every change order billed, every measure fee charged and every fee charged, plus every refund paid out, less every payment received and every credit applied, all read from the contract's lines and rounded to the cent."
      holdback_days_since_completion: "no more than the program's punch-list resolution days have passed since the completion date"
      holdback_share: "Punch-list holdback on the final settlement payment: while the punch list recorded at the walkthrough is open and no more than the program's punch-list resolution days have passed since the completion date, the full holdback share applies; while the punch list is open after that period, the late punch-list share applies; when no punch list is open the holdback share is 0."
      holdback_amount: "The punch-list holdback is the program's punch-list holdback percentage of the contract price billed, multiplied by the holdback share."
      linked_order_total: "its order total is at or above the bundle floor"
      linked_order_completed: "when the special order linked to the contract as its materials is completed"
      bundle_allowance: "Project bundle allowance on the final settlement payment: when the special order linked to the contract as its materials is completed and its order total is at or above the bundle floor, the allowance is the bundle percentage of that special order's order total, rounded to the cent; when the linked special order is completed with an order total below the bundle floor, the allowance is the flat bundle allowance; when no completed special order is linked to the contract there is no project bundle allowance."
      settlement_days_since_completion: "the days since completion are the calendar days from the completion date to today"
      settlement_rate: "a settlement within the program's final payment due days takes the prompt settlement rate, a settlement more than the late-settlement grace days after the end of that due period takes the late settlement rate, and any other settlement takes a rate of 0"
      settlement_adjustment: "the adjustment is that rate applied to the contract price billed, rounded to the cent, and a negative adjustment lowers the payment."
      change_order_admin_fees: "the whole of the change order administration fees charged on the contract is forgiven"
      change_order_increase_pct: "the change order increase is every change order billed as a percentage of the contract price billed"
      forgiveness_share: "when the increase is above 0 and below the small-change percentage, the whole of the change order administration fees charged on the contract is forgiven; when the increase is at or above the small-change percentage and below the mid-change percentage, the mid-change forgiveness share of those fees is forgiven; otherwise nothing is forgiven."
      fee_forgiveness: "Change order fee forgiveness on the final settlement payment"
      linked_promised_ready: "the materials lateness is the calendar days from the linked special order's promised ready date to its ready date"
      linked_ready: "the materials lateness is the calendar days from the linked special order's promised ready date to its ready date"
      linked_delay_threshold: "the special order program's vendor delay threshold marks the lateness that program's own delay remedies take over"
      materials_late_days: "the materials lateness is the calendar days from the linked special order's promised ready date to its ready date"
      lateness_allowance: "when the materials lateness is more than the long-lateness days and no more than that threshold, the long lateness allowance applies; when it is above 0 and no more than both the long-lateness days and that threshold, the short lateness allowance applies; otherwise there is no materials lateness allowance."
      result: "Each of those amounts is worked out on its own base and rounded to the cent, and they are then combined once with the open balance; the final settlement payment is rounded to the cent at the end."
    factors:
      - id: punch_list_holdback
        effect: parameter
        decides: holdback_share
        bindings: [holdback_days_since_completion, holdback_share]
        ladder:
          - when: "the punch list recorded at the walkthrough is open AND no more than the program's punch-list resolution days have passed since the completion date"
            value: "1 (the full holdback share)"
          - when: "the punch list is open after the punch-list resolution period"
            value: "K('late_punch_list_share')"
          - when: "otherwise (no punch list open)"
            value: "0"
        baseline:
          holdback_share: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: project_bundle
        effect: method
        decides: bundle_allowance
        bindings: [linked_order_total, linked_order_completed, bundle_allowance]
        ladder:
          - when: "the linked special order is completed AND its order total is at or above the bundle floor"
            method: "the allowance is the bundle percentage of the special order's order total, rounded to the cent"
          - when: "the linked special order is completed AND its order total is below the bundle floor"
            method: "the allowance is the flat bundle allowance"
          - when: "otherwise (no completed linked special order)"
            method: "no project bundle allowance"
        baseline:
