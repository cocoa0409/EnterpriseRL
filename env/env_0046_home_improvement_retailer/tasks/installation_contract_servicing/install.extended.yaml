      wait_days: "the wait is the calendar days from the contract signing date to the date of the installation visit at which work started"
      wait_share: "a wait of more than the long-wait days takes the long-wait share, a wait of at most the short-wait days takes the short-wait multiple, and any other wait takes a wait share of 1."
      progress_share: "The progress share is the program's progress payment percentage of the contract price billed, multiplied once by the product of the financing share and the wait share, and rounded to the cent"
