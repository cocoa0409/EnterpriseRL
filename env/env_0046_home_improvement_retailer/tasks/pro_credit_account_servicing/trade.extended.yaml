events:
  - type: trade_application_submitted
    target: trade_accounts
    mutation: create
    meaning: A business credit application for one Pro Credit tier is submitted; the account exists in applied status until Commercial Credit decides.
    grain: one row per application (one account record)
    fields:
      customer_id: The pro customer profile of the applying business.
      variant_name: The tier applied for, as its official full name.
      status: Set to applied on creation.
      application_date: Date the application was submitted.
      personal_guarantee_on_file: Whether a principal signed a personal guarantee with the application.
    triggers: []
  - type: trade_account_approved
    target: trade_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: Commercial Credit approves the application and opens the account.
    grain: one row per transaction
    fields:
      status: Set to active.
      opened_date: Date the account opened.
      credit_limit: Credit line assigned.
      account_last4: Last four digits of the account number.
    triggers: []
  - type: trade_application_declined
    target: trade_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: Commercial Credit declines the application.
    grain: one row per transaction
    fields:
      status: Set to declined.
      closed_date: Date of the decline.
    triggers: []
  - type: trade_account_placed_on_hold
    target: trade_accounts
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Charging on the account is stopped for delinquency, an over-limit balance or a sister account's hold.
    grain: one row per transaction
    fields:
      status: Set to on_hold.
      hold_reason: Why the account was placed on hold.
    triggers: []
  - type: trade_account_released
    target: trade_accounts
    mutation: {transition: {from: on_hold, to: active}}
    meaning: Charging is restored after the hold condition clears.
    grain: one row per transaction
    fields:
      status: Set to active.
      hold_reason: Reset to none.
    triggers: []
  - type: trade_account_closed
    target: trade_accounts
    mutation: {transition: [{from: active, to: closed}, {from: on_hold, to: closed}]}
    meaning: The account is closed to new charges, on the business's confirmation or by Commercial Credit for inactivity.
    grain: one row per transaction
    fields:
      status: Set to closed.
      closed_date: Date the closure took effect.
    triggers: []
  - type: trade_account_charged_off
    target: trade_accounts
    mutation: {transition: {from: on_hold, to: charged_off}}
    meaning: The account is charged off and referred to collections.
    grain: one row per transaction
    fields:
      status: Set to charged_off.
      closed_date: Date of the charge-off.
    triggers:
      - event: pro:pro_suspended
        map: {suspension_reason: trade_charge_off, suspended_date: closed_date}
  - type: trade_credit_limit_changed
    target: trade_accounts
    mutation: update
    meaning: The credit line is changed.
    grain: one row per transaction
    fields:
      credit_limit: The new credit line.
      credit_limit_changed_date: Date the new line took effect.
    triggers: []
  - type: trade_tax_exemption_updated
    target: trade_accounts
    mutation: update
    meaning: A sales tax exemption certificate is placed on file, renewed or removed.
    grain: one row per transaction
    fields:
      tax_exempt_certificate_number: Certificate number exactly as printed; empty when removed.
      tax_exempt_effective_date: First date the certificate is valid.
      tax_exempt_expiry_date: Last date the certificate is valid.
    triggers: []
  - type: trade_account_settings_updated
    target: trade_accounts
    mutation: update
    meaning: The business changes its purchase order requirement or its number of authorized buyers.
    grain: one row per transaction
    fields:
      po_required: Whether every invoice must carry a purchase order number.
      authorized_buyer_count: Number of authorized buyers after the change.
    triggers: []
  - type: trade_statement_issued
    target: trade_transactions
    meaning: A monthly account statement closes, fixing the balance, past-due amount and delinquency of the period.
    grain: one row per account per statement period
    distinguish_by: [statement_period]
    fields:
      statement_period: Billing period the statement closes (YYYY-MM).
      statement_date: Closing date of the statement.
      due_date: Payment due date of a revolving statement; empty on a pay-in-full account.
      statement_balance: Balance on the statement.
      minimum_payment_due: Minimum payment due (the full balance on a pay-in-full account).
      past_due_amount: Amount past due as of the statement date.
      days_past_due: Days the oldest unpaid invoice or minimum is past due as of the statement date.
      transaction_date: Same as statement_date.
      amount: 0.00 — a statement moves no money.
    triggers: []
  - type: trade_invoice_posted
    target: trade_transactions
    meaning: A purchase charged to the account is invoiced.
    grain: one row per invoice
    distinguish_by: [invoice_number]
    fields:
      transaction_date: Posting date (same as invoice_date).
      invoice_number: Invoice number exactly as printed.
      invoice_date: Date of the invoice.
      due_date: Due date of the invoice.
      amount: Invoice total including sales tax, positive.
      merchandise_amount: Invoice amount before sales tax.
      sales_tax_amount: Sales tax charged on the invoice.
      job_name: Job name the invoice is tracked under.
      po_number: Purchase order number on the invoice.
      pricing_basis: How the invoice was priced.
      pro_quote_id: The ProBuild volume pricing quote applied, when pricing_basis is pro_volume_quote.
      purchase_channel: Where the purchase was made.
      statement_period: Statement period the invoice falls in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_payment_received
    target: trade_transactions
    meaning: A payment from the business is credited and applied to one invoice (or held on account).
    grain: one row per payment per invoice it is applied to
    distinguish_by: [payment_reference, applied_invoice_number]
    fields:
      transaction_date: Date the payment is credited.
      amount: Amount applied to this invoice (or held on account), positive.
      payment_method: How the payment was made.
      payment_reference: Check number, ACH trace or confirmation reference of the payment exactly as given.
      applied_invoice_number: Invoice the amount is applied to; empty when held on account.
      statement_period: Statement period the payment is credited in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_payment_returned
    target: trade_transactions
    meaning: A payment is returned unpaid by the business's bank and added back.
    grain: one row per returned payment line
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the return posts.
      amount: Amount returned, positive.
      original_transaction_id: The trade_payment_received row returned.
      return_reason: Reason given by the bank.
      statement_period: Statement period the return posts in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_fee_assessed
    target: trade_transactions
    meaning: A late fee, late payment charge, returned payment fee, bank card surcharge or prompt-payment discount recapture is charged.
    grain: one row per fee per fee type per originating statement or payment
    distinguish_by: [fee_type, statement_period, original_transaction_id]
    fields:
      transaction_date: Date the fee posts.
      amount: Fee amount, positive.
      fee_type: Which fee is charged.
      original_transaction_id: The statement row (late fee, late payment charge), payment row (returned payment fee, surcharge) or discount row (discount recapture) the fee arises from.
      statement_period: Statement period the fee relates to (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_interest_charged
    target: trade_transactions
    meaning: Interest on a carried revolving balance is charged for a statement period.
    grain: one row per account per statement period
    distinguish_by: [statement_period]
    fields:
      transaction_date: Date the interest posts (statement date).
      amount: Interest amount, positive.
      statement_period: Statement period charged (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []
  - type: trade_early_pay_discount_applied
    target: trade_transactions
    meaning: A prompt-payment discount is credited to an invoice paid in full within the discount days.
    grain: one row per invoice
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the discount posts (the date of the payment that settled the invoice).
      amount: Discount amount, positive.
      original_transaction_id: The trade_invoice_posted row discounted.
      invoice_number: Invoice number discounted.
      statement_period: Statement period the discount posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_tax_credit_posted
    target: trade_transactions
    meaning: Sales tax charged on a purchase that was exempt is credited back.
    grain: one row per invoice
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the credit posts.
      amount: Sales tax credited, positive.
      original_transaction_id: The trade_invoice_posted row whose tax is credited.
      invoice_number: Invoice number credited.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_return_credit_posted
    target: trade_transactions
    meaning: A refund for returned merchandise, a cancelled order or a refunded service charged to the account is credited to the originating invoice.
    grain: one row per refund per original invoice
    distinguish_by: [original_transaction_id, merchant_reference]
    fields:
      transaction_date: Date the credit posts.
      amount: Credit amount, positive.
      original_transaction_id: The trade_invoice_posted row credited.
      invoice_number: Invoice number credited.
      merchant_reference: Return receipt, order, contract or agreement number of the refund.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_fee_waived
    target: trade_transactions
    meaning: A correctly charged late fee or late payment charge is waived as a courtesy.
    grain: one row per waived charge
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the waiver posts.
      amount: Amount waived (the full charge), positive.
      original_transaction_id: The trade_fee_assessed row waived.
      statement_period: Statement period the waiver posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_fee_reversed
    target: trade_transactions
    meaning: A fee that should not have been charged is reversed in full as a correction.
    grain: one row per reversed fee
    distinguish_by: [original_transaction_id]
    fields:
      transaction_date: Date the reversal posts.
      amount: Amount reversed (the full fee), positive.
      original_transaction_id: The trade_fee_assessed row reversed.
      reversal_reason: Why the fee is reversed.
      statement_period: Statement period the reversal posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_dispute_credit_posted
    target: trade_transactions
    meaning: An invoice dispute resolved in the business's favor credits the disputed amount.
    grain: one row per resolved dispute
    distinguish_by: [original_transaction_id, trade_request_id]
    fields:
      transaction_date: Date the credit posts.
      amount: Disputed amount credited, positive.
      original_transaction_id: The disputed trade_invoice_posted row.
      invoice_number: Invoice number disputed.
      trade_request_id: The invoice dispute request.
      statement_period: Statement period the credit posts in (YYYY-MM).
    account: outstanding_balance
    direction: out
    triggers: []
  - type: trade_credit_balance_refunded
    target: trade_transactions
    meaning: A credit balance on the account is paid back to the business.
    grain: one row per credit balance refund
    distinguish_by: [transaction_date, amount]
    fields:
      transaction_date: Date the refund is issued.
      amount: Refunded credit balance, positive.
      statement_period: Statement period the refund posts in (YYYY-MM).
    account: outstanding_balance
    direction: in
    triggers: []

measures:
  - id: trade_msr_invoice_open_balance
    window: Life of one invoice up to the frozen date.
    measure: The invoice's amount minus every trade_payment_received amount applied to its invoice_number (less any of those returned), and minus every trade_early_pay_discount_applied, trade_tax_credit_posted, trade_return_credit_posted and trade_dispute_credit_posted row referencing it.
  - id: trade_msr_past_due_invoice_balance
    window: Invoices on the account as of the statement date (or frozen date) being decided.
    measure: Sum of trade_msr_invoice_open_balance over invoices whose due_date plus late_charge_grace_days is before that date, excluding invoices under an open invoice dispute when dispute_holds_late_charge is true.
  - id: trade_msr_courtesy_waivers_12_months
    window: Rolling 12 calendar months ending on the date of the request (frozen date), by transaction_date.
    measure: Count of trade_fee_waived rows on the account in the window.
  - id: trade_msr_negative_history
    window: The cli_clean_history_months calendar months ending on the date of the request (frozen date).
    measure: Count of trade_fee_assessed rows with fee_type late_fee or late_payment_charge not reversed as posting_error, plus statements showing days_past_due at or above on_hold_days_past_due, in the window.
  - id: trade_msr_other_open_credit_limits
    window: Portfolio state at the moment of the decision.
    measure: Sum of credit_limit over the customer's other trade_accounts (the account being decided excluded) whose status is active or on_hold.
  - id: trade_msr_months_since_activity
    window: From the latest trade_invoice_posted or trade_payment_received transaction_date on the account to the frozen date.
    measure: Whole calendar months since the account's last invoice or payment.

policies:
  - id: trade_agg_multi_holding
    subject: [trade_application_submitted]
    rule: >-
      A business may hold at most two Ridgeline Pro Credit accounts at a time: at most one revolving account (Pro Revolving Charge or Pro Revolving Charge Plus) and at most one pay-in-full commercial account (any Commercial Account tier).
      Pro Credit accounts are opened only for pro customer profiles; a consumer profile applies for Ridgeline Consumer Credit instead.
      An account counts toward the limit while its status is applied, active or on_hold.
      A business may not apply for a revolving account while another revolving account in its name is applied, active or on_hold, and may not apply for a commercial account while another commercial account in its name is applied, active or on_hold.
      No Pro Credit account in the business's name may be in charged_off status when a new application is submitted.
    eligibility:
      - id: one_per_kind
        applies_to: [trade_application_submitted]
        kind: dedup
        condition: A business may not apply for a revolving account while another revolving account in its name is applied, active or on_hold, and may not apply for a commercial account while another commercial account in its name is applied, active or on_hold.
        evidence_fields: [trade_accounts.customer_id, trade_accounts.variant_name, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.customer_id]
          action_bindings:
            trade_accounts.customer_id: customer_id
        dedup_contract:
          table: trade_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, on_hold]}
          distinct_fields: [variant_name]
      - id: pro_profile
        applies_to: [trade_application_submitted]
        kind: state
        condition: Pro Credit accounts are opened only for pro customer profiles; a consumer profile applies for Ridgeline Consumer Credit instead.
        evidence_fields: [customers.customer_id, customers.customer_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        state_contract:
          field: customers.customer_type
          allowed: [pro]
      - id: no_charge_off
        applies_to: [trade_application_submitted]
        kind: state
        condition: No Pro Credit account in the business's name may be in charged_off status when a new application is submitted.
        evidence_fields: [trade_accounts.customer_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.customer_id]
          action_bindings:
            trade_accounts.customer_id: customer_id
        state_contract:
          field: trade_accounts.status
          allowed: [applied, active, on_hold, closed, declined]
    params:
      max_per_customer: 2
      max_revolving_per_customer: 1
      max_commercial_per_customer: 1

  - id: trade_agg_relationship
    subject: [trade_account_approved, trade_credit_limit_changed, trade_account_placed_on_hold, trade_account_released]
    rule: >-
      The two Pro Credit accounts of one business are managed as one credit relationship.
      The sum of credit_limit over the business's accounts whose status is active or on_hold may not exceed relationship_exposure_cap_usd; an approval or increase that would exceed it is reduced to the cap minus trade_msr_other_open_credit_limits, rounded down to cli_rounding_increment_usd, and is not granted when the reduced line is below the tier's credit_line_min_usd.
      Cross-default: when either account of the business is placed on hold for delinquency or over-limit, its other active account is placed on hold the same day with hold_reason sister_account_hold.
      An account on hold for sister_account_hold is released the same day the sister account is released, and is never released while the sister account remains on hold.
    eligibility: []
    params:
      relationship_exposure_cap_usd: 1250000.00
    formula:
      headroom_usd: relationship_exposure_cap_usd - trade_msr_other_open_credit_limits
    measures: [trade_msr_other_open_credit_limits]

  - id: trade_application_decision
    subject: [trade_application_submitted, trade_account_approved, trade_application_declined]
    rule: >-
      An application names one tier and is approved only when the business meets every entry_gate value of that tier — years in business at or above min_years_in_business, a business credit score at or above min_business_credit_score and annual revenue at or above min_annual_revenue_usd — and, where personal_guarantee_required is true, a principal's personal guarantee is on file.
      Otherwise it is declined; a lower tier is never substituted on the same application.
      On approval Commercial Credit assigns a line between the tier's credit_line_min_usd and credit_line_max_usd, subject to trade_agg_relationship.
      Approval and decline are Commercial Credit decisions recorded by the system; Customer Care may submit an application but never decides one.
    eligibility: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Pro Revolving Charge Plus: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 30: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 30 Select: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 45: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {personal_guarantee_required: "=personal_guarantee_required", credit_line_max_usd: "=credit_line_max_usd"}

  - id: trade_evt_invoicing
    subject: [trade_invoice_posted, trade_statement_issued, trade_interest_charged]
    rule: >-
      Every purchase charged to a Pro Credit account is invoiced separately; a commercial account invoice is due payment_terms_days calendar days after its invoice_date, and a revolving account's invoices are billed together on the monthly statement, due statement_due_offset_days after the statement date.
      When po_required is true on the account, a purchase without a purchase order number is not charged to the account; job names are limited to job_name_max_active active names.
      A purchase is invoiced tax-exempt only when a valid exemption certificate is on file for the invoice date; otherwise sales tax is charged and may later be credited under trade_evt_tax_exempt_credit.
      A charge is authorized only while the account status is active and the new balance stays within the credit line plus overlimit_tolerance_pct percent.
      pricing_basis records how each invoice was priced: shelf_price, pro_volume_quote with the pro_quote_id of the ProBuild quote applied, or contract_price for prices fixed in an installation or special order agreement.
      A revolving statement's minimum payment due is the full balance when below min_payment_floor_usd, and otherwise the greater of min_payment_floor_usd and min_payment_pct_of_balance percent of the balance; a pay-in-full statement's minimum is its full balance (min_payment_pct_of_balance of 100).
      Interest is charged only on a revolving account, on the carried balance at purchase_apr_pct divided by interest_day_count_basis per day, not when the previous statement balance was paid in full within grace_period_days, and never less than min_interest_charge_usd when above zero.
    eligibility: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Pro Revolving Charge Plus: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 30: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 30 Select: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 45: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
        Ridgeline Commercial Account Net 60 Enterprise: {payment_terms_days: "=payment_terms_days", overlimit_tolerance_pct: "=overlimit_tolerance_pct"}
    formula:
      daily_periodic_rate: purchase_apr_pct / 100 / interest_day_count_basis

  - id: trade_evt_payment_application
    subject: [trade_payment_received, trade_fee_assessed]
    rule: >-
      A payment received by payment_cutoff_time_et Eastern Time on a business day is credited that day, and otherwise on the next business day.
      The payment method must be one of the tier's payment_methods_accepted.
      An owner, principal or authorized buyer of the business must authorize the debit before a phone payment is posted.
      Payments are accepted on accounts whose status is active, on_hold, closed or charged_off.
      A payment is applied first to the invoices the business names in its remittance, up to each invoice's trade_msr_invoice_open_balance; any amount not directed by the remittance goes to the oldest past-due invoice first and then to the oldest open invoice by invoice_date; whatever remains after every open invoice is settled is held on account with an empty applied_invoice_number.
      Each invoice the payment touches is recorded as its own trade_payment_received row under the same payment_reference.
      A payment made with a third-party bank card incurs a surcharge of bank_card_surcharge_pct percent of the payment, posted as a trade_fee_assessed row with fee_type card_payment_surcharge referencing the first payment row; no surcharge is charged on a tier whose rate is 0.
    eligibility:
      - id: debit_authorized
        applies_to: [trade_payment_received]
        kind: authorization
        condition: An owner, principal or authorized buyer of the business must authorize the debit before a phone payment is posted.
        evidence_fields: [trade_accounts.trade_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
      - id: payable_status
        applies_to: [trade_payment_received]
        kind: state
        condition: Payments are accepted on accounts whose status is active, on_hold, closed or charged_off.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active, on_hold, closed, charged_off]
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Pro Revolving Charge Plus: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 30: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 30 Select: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 45: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
        Ridgeline Commercial Account Net 60 Enterprise: {payment_methods_accepted: "=payment_methods_accepted", bank_card_surcharge_pct: "=bank_card_surcharge_pct"}
    formula:
      surcharge: round(amount * bank_card_surcharge_pct / 100, 2)
    measures: [trade_msr_invoice_open_balance]

  - id: trade_evt_early_pay_discount
    subject: [trade_early_pay_discount_applied]
    rule: >-
      On a tier whose early_pay_discount_days is above 0, an invoice paid in full earns a prompt-payment discount of early_pay_discount_pct percent of its merchandise_amount, and of its sales tax as well only when early_pay_discount_on_tax is true, rounded to the nearest cent.
      The invoice must be paid in full no later than early_pay_discount_days calendar days after the invoice date.
      Days are counted as calendar days from the invoice_date as day 0 to the transaction_date of the payment that brings the invoice's open balance to the discounted amount; payment on the last day of the window qualifies.
      Paid in full means the payments applied to the invoice equal its amount less the discount, so the discount and those payments together settle the invoice.
      The prompt-payment discount and ProBuild volume pricing are mutually exclusive: when early_pay_discount_excludes_quote_pricing is true, an invoice whose pricing_basis is pro_volume_quote earns no discount.
      When early_pay_requires_no_past_due is true, the discount is earned only when no other invoice on the account was past due on the payment date.
      An invoice receives at most one prompt-payment discount, and a discount already posted is not lost when a later invoice goes past due; it is recaptured only when the payment that earned it is returned.
    eligibility:
      - id: paid_in_window
        applies_to: [trade_early_pay_discount_applied]
        kind: time
        condition: The invoice must be paid in full no later than early_pay_discount_days calendar days after the invoice date.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.invoice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: trade_transactions.invoice_date
          relation: not_after
          duration_source: variants.early_pay_discount_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the invoice_date as day 0 to the transaction_date of the payment that brings the invoice's open balance to the discounted amount; payment on the last day of the window qualifies.
          boundary: inclusive
      - id: one_discount_per_invoice
        applies_to: [trade_early_pay_discount_applied]
        kind: dedup
        condition: An invoice receives at most one prompt-payment discount, and a discount already posted is not lost when a later invoice goes past due; it is recaptured only when the payment that earned it is returned.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_early_pay_discount_applied]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Pro Revolving Charge Plus: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 30: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 30 Select: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 45: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
        Ridgeline Commercial Account Net 60 Enterprise: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days", early_pay_requires_no_past_due: "=early_pay_requires_no_past_due"}
    formula:
      when_not: pricing_basis == "pro_volume_quote" and early_pay_discount_excludes_quote_pricing
      discount: round((merchandise_amount + (sales_tax_amount if early_pay_discount_on_tax else 0)) * early_pay_discount_pct / 100, 2)
      payment_to_settle: amount - discount

  - id: trade_evt_late_charges
    subject: [trade_fee_assessed]
    rule: >-
      On a revolving account a late fee (fee_type late_fee) of late_fee_usd posts on the day after a statement due date when the payments credited from the statement date through the due date total less than that statement's minimum_payment_due.
      On a pay-in-full account a late payment charge (fee_type late_payment_charge) posts on each statement date when trade_msr_past_due_invoice_balance is above zero: late_charge_monthly_pct percent of that balance, rounded to the nearest cent, and never less than late_charge_min_usd.
      Both reference the statement row in original_transaction_id and carry its statement_period.
      At most one late fee or late payment charge is charged for any one statement period.
      An invoice under an open dispute is left out of the past-due balance while dispute_holds_late_charge is true.
    eligibility:
      - id: one_per_period
        applies_to: [trade_fee_assessed]
        kind: dedup
        condition: At most one late fee or late payment charge is charged for any one statement period.
        evidence_fields: [trade_transactions.trade_account_id, trade_transactions.statement_period, trade_transactions.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_account_id, trade_transactions.statement_period]
          action_bindings:
            trade_transactions.trade_account_id: trade_account_id
            trade_transactions.statement_period: statement_period
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {trade_account_id: trade_account_id, statement_period: statement_period}
          duplicate_filters: {fee_type: [late_fee, late_payment_charge]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Pro Revolving Charge Plus: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 30: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 30 Select: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 45: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
        Ridgeline Commercial Account Net 60 Enterprise: {late_fee_usd: "=late_fee_usd", late_charge_monthly_pct: "=late_charge_monthly_pct", late_charge_grace_days: "=late_charge_grace_days"}
    formula:
      when: revolving_balance_allowed == false
      late_payment_charge: max(late_charge_min_usd, round(trade_msr_past_due_invoice_balance * late_charge_monthly_pct / 100, 2))
    measures: [trade_msr_past_due_invoice_balance]

  - id: trade_evt_returned_payment
    subject: [trade_payment_returned, trade_fee_assessed]
    rule: >-
      When the business's bank returns a payment unpaid, every trade_payment_received row of that payment is added back as its own trade_payment_returned row referencing it, and the invoices it had settled reopen.
      A prompt-payment discount earned by a returned payment is recaptured by a trade_fee_assessed row with fee_type discount_recapture for the full discount, referencing the trade_early_pay_discount_applied row; a replacement payment does not re-earn the discount.
      A payment line that already has a trade_payment_returned row cannot be returned again.
      One returned payment fee (fee_type returned_payment_fee) of returned_payment_fee_usd is charged per returned payment, referencing its first returned line.
    eligibility:
      - id: return_once
        applies_to: [trade_payment_returned]
        kind: dedup
        condition: A payment line that already has a trade_payment_returned row cannot be returned again.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_payment_returned]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Pro Revolving Charge Plus: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 30: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 30 Select: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 45: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {returned_payment_fee_usd: "=returned_payment_fee_usd"}

  - id: trade_evt_tax_exempt_credit
    subject: [trade_tax_credit_posted]
    rule: >-
      Sales tax charged on an invoice is credited back in full when the purchase was exempt: the account had an exemption certificate whose tax_exempt_effective_date is on or before the invoice_date and whose tax_exempt_expiry_date is on or after the invoice_date, and tax_exempt_purchases_allowed is true.
      A certificate placed on file after the purchase covers that purchase only when its effective date is on or before the invoice_date; a certificate that took effect later never covers it.
      The credit must be requested no later than tax_credit_lookback_days calendar days after the invoice date.
      Days are counted as calendar days from the invoice_date as day 0 to the date of the request; a request on the last day qualifies and a later one does not.
      The credit equals the invoice's sales_tax_amount less any part of that tax already credited by a return credit, and an invoice receives at most one tax credit.
    eligibility:
      - id: request_in_lookback
        applies_to: [trade_tax_credit_posted]
        kind: time
        condition: The credit must be requested no later than tax_credit_lookback_days calendar days after the invoice date.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.invoice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: trade_transactions.invoice_date
          relation: not_after
          duration_source: variants.tax_credit_lookback_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the invoice_date as day 0 to the date of the request; a request on the last day qualifies and a later one does not.
          boundary: inclusive
      - id: one_tax_credit
        applies_to: [trade_tax_credit_posted]
        kind: dedup
        condition: The credit equals the invoice's sales_tax_amount less any part of that tax already credited by a return credit, and an invoice receives at most one tax credit.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_tax_credit_posted]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Pro Revolving Charge Plus: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 30: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 30 Select: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 45: {tax_credit_lookback_days: "=tax_credit_lookback_days"}
        Ridgeline Commercial Account Net 60 Enterprise: {tax_credit_lookback_days: "=tax_credit_lookback_days"}

  - id: trade_evt_return_credit
    subject: [trade_return_credit_posted, trade_credit_balance_refunded]
    rule: >-
      A refund for merchandise, an order, a service or a rental that was charged to a Pro Credit account is credited to the same account against the invoice that charged it, referencing that invoice row in original_transaction_id and its invoice_number; it is never paid out in cash and never moved to another account.
      The amount is the refund decided under the selling program's own rules, and the credits referencing one invoice may never total more than that invoice's amount.
      A return credit is accepted on accounts whose status is active, on_hold, closed or charged_off.
      A credit against an invoice that is still open reduces that invoice's open balance; a credit against an invoice already paid leaves a credit on account that the next payment application absorbs.
      When the account carries a credit balance above credit_balance_refund_threshold_usd, an owner or principal may ask for it to be refunded in full as one trade_credit_balance_refunded row; a credit balance at or below the threshold stays on the account.
    eligibility:
      - id: creditable_status
        applies_to: [trade_return_credit_posted]
        kind: state
        condition: A return credit is accepted on accounts whose status is active, on_hold, closed or charged_off.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active, on_hold, closed, charged_off]
      - id: refund_requested
        applies_to: [trade_credit_balance_refunded]
        kind: caller_fact
        condition: When the account carries a credit balance above credit_balance_refund_threshold_usd, an owner or principal may ask for it to be refunded in full as one trade_credit_balance_refunded row; a credit balance at or below the threshold stays on the account.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.current_balance]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id

  - id: trade_evt_courtesy_waiver
    subject: [trade_fee_waived]
    rule: >-
      A correctly charged late fee or late payment charge may be waived in full as a courtesy at the request of an owner, principal or authorized buyer; returned payment fees, bank card surcharges and discount recaptures are never waived as a courtesy.
      The account status must be active at the time of the request.
      The waiver must be requested no more than courtesy_waiver_request_window_days calendar days after the charge was posted.
      Days are counted as calendar days from the charge's transaction_date as day 0 to the date of the request, and a request on the last day still qualifies.
      trade_msr_courtesy_waivers_12_months must be below courtesy_waiver_per_12_months, and a charge larger than courtesy_waiver_max_usd is not waivable in whole or in part.
      A charge that already has a trade_fee_waived or trade_fee_reversed row referencing it cannot be waived.
      When the charge is owed a correction under trade_evt_fee_correction, the correction applies instead and no courtesy waiver is used.
    eligibility:
      - id: active_account
        applies_to: [trade_fee_waived]
        kind: state
        condition: The account status must be active at the time of the request.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active]
      - id: request_window
        applies_to: [trade_fee_waived]
        kind: time
        condition: The waiver must be requested no more than courtesy_waiver_request_window_days calendar days after the charge was posted.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.transaction_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the charge was posted
          anchor_source: trade_transactions.transaction_date
          relation: not_after
          duration_source: variants.courtesy_waiver_request_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the charge's transaction_date as day 0 to the date of the request, and a request on the last day still qualifies.
          boundary: inclusive
      - id: not_already_waived
        applies_to: [trade_fee_waived]
        kind: dedup
        condition: A charge that already has a trade_fee_waived or trade_fee_reversed row referencing it cannot be waived.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_fee_waived, trade_fee_reversed]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Pro Revolving Charge Plus: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 30: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 30 Select: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 45: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {courtesy_waiver_per_12_months: "=courtesy_waiver_per_12_months", courtesy_waiver_max_usd: "=courtesy_waiver_max_usd"}
    formula:
      eligible: trade_msr_courtesy_waivers_12_months < courtesy_waiver_per_12_months and amount <= courtesy_waiver_max_usd
    measures: [trade_msr_courtesy_waivers_12_months]

  - id: trade_evt_fee_correction
    subject: [trade_fee_reversed]
    rule: >-
      A fee that should not have been charged is reversed in full by one trade_fee_reversed row referencing it.
      The reversal_reason is posting_error for a late fee whose minimum was in fact covered by the due date, a late payment charge computed on an invoice that was in fact paid by its due date plus late_charge_grace_days, a surcharge on a payment not made by bank card, or a returned payment fee on a payment not in fact returned; it is dispute_resolved for a late payment charge or late fee that arose solely from an invoice later resolved in the business's favor, reversed in full when the disputed invoice was the only past-due amount.
      A correction is owed regardless of tier, waiver history or how long ago the fee posted, and it does not use up a courtesy waiver.
      A fee row that already has a trade_fee_reversed or trade_fee_waived row referencing it cannot be reversed again.
    eligibility:
      - id: not_already_reversed
        applies_to: [trade_fee_reversed]
        kind: dedup
        condition: A fee row that already has a trade_fee_reversed or trade_fee_waived row referencing it cannot be reversed again.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_fee_reversed, trade_fee_waived]}
          distinct_fields: []

  - id: trade_evt_invoice_dispute
    subject: [trade_dispute_credit_posted]
    rule: >-
      An invoice dispute (wrong price, wrong quantity, merchandise not received, unauthorized buyer) is filed as a trade_requests record of request_type invoice_dispute naming the invoice row in disputed_transaction_id and the disputed_amount.
      It is accepted only when the dispute is filed no more than invoice_dispute_window_days calendar days after the invoice date.
      Days are counted as calendar days from the invoice_date as day 0 to the date the dispute is filed; filing on the last day is timely.
      It is resolved within dispute_resolution_max_days; while open, the disputed amount is left out of the past-due balance and of hold decisions when dispute_holds_late_charge is true, and the undisputed part of the invoice remains due on its due date.
      A dispute credit posts only when the invoice dispute request has status approved; it credits the disputed amount against the invoice, referencing the invoice row and the request.
      A pricing dispute on an invoice whose pricing_basis is pro_volume_quote is decided against the quoted prices of the referenced ProBuild quote, not shelf prices.
      One invoice receives at most one dispute credit.
    eligibility:
      - id: filed_in_window
        applies_to: [trade_dispute_credit_posted]
        kind: time
        condition: It is accepted only when the dispute is filed no more than invoice_dispute_window_days calendar days after the invoice date.
        evidence_fields: [trade_transactions.trade_transaction_id, trade_transactions.invoice_date, trade_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.trade_transaction_id]
          action_bindings:
            trade_transactions.trade_transaction_id: original_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: trade_transactions.invoice_date
          relation: not_after
          duration_source: variants.invoice_dispute_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the invoice_date as day 0 to the date the dispute is filed; filing on the last day is timely.
          boundary: inclusive
      - id: dispute_approved
        applies_to: [trade_dispute_credit_posted]
        kind: state
        condition: A dispute credit posts only when the invoice dispute request has status approved; it credits the disputed amount against the invoice, referencing the invoice row and the request.
        evidence_fields: [trade_requests.trade_request_id, trade_requests.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_requests.trade_request_id]
          action_bindings:
            trade_requests.trade_request_id: trade_request_id
        state_contract:
          field: trade_requests.status
          allowed: [approved]
      - id: one_dispute_credit
        applies_to: [trade_dispute_credit_posted]
        kind: dedup
        condition: One invoice receives at most one dispute credit.
        evidence_fields: [trade_transactions.original_transaction_id, trade_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_transactions.original_transaction_id]
          action_bindings:
            trade_transactions.original_transaction_id: original_transaction_id
        dedup_contract:
          table: trade_transactions
          mode: separate_record
          object_bindings: {original_transaction_id: original_transaction_id}
          duplicate_filters: {event_type: [trade_dispute_credit_posted]}
          distinct_fields: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Pro Revolving Charge Plus: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 30: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 30 Select: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 45: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}
        Ridgeline Commercial Account Net 60 Enterprise: {invoice_dispute_window_days: "=invoice_dispute_window_days", dispute_resolution_max_days: "=dispute_resolution_max_days"}

  - id: trade_credit_line_increase
    subject: [trade_credit_limit_changed]
    rule: >-
      A credit line increase is decided only on a request from an owner or principal, recorded as a trade_requests record of request_type credit_limit_increase with the requested_credit_limit.
      The account status must be active when the increase is decided.
      The account must have been open for at least cli_min_months_on_book full calendar months since the account was opened.
      At least cli_cooldown_months full calendar months must have passed since the last credit line change, counted from credit_limit_changed_date; when credit_limit_changed_date is empty the cooldown is met.
      Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist.
      trade_msr_negative_history, counted over the cli_clean_history_months months before the request, must be zero.
      A requested line above cli_financials_threshold_usd is not decided by Customer Care: the request stays submitted for Commercial Credit underwriting and no line change is made.
      Otherwise the new line is the lowest of the requested_credit_limit, the current credit_limit increased by cli_max_increase_pct percent, the tier's credit_line_max_usd and the headroom under trade_agg_relationship, rounded down to cli_rounding_increment_usd; no increase is granted when that figure is not above the current line.
    eligibility:
      - id: active_account
        applies_to: [trade_credit_limit_changed]
        kind: state
        condition: The account status must be active when the increase is decided.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active]
      - id: tenure
        applies_to: [trade_credit_limit_changed]
        kind: time
        condition: The account must have been open for at least cli_min_months_on_book full calendar months since the account was opened.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account was opened
          anchor_source: trade_accounts.opened_date
          relation: not_before
          duration_source: variants.cli_min_months_on_book
          unit: calendar_months
          counting_rule: "Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist."
          boundary: inclusive
      - id: cooldown
        applies_to: [trade_credit_limit_changed]
        kind: time
        condition: At least cli_cooldown_months full calendar months must have passed since the last credit line change, counted from credit_limit_changed_date; when credit_limit_changed_date is empty the cooldown is met.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.credit_limit_changed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: since the last credit line change
          anchor_source: trade_accounts.credit_limit_changed_date
          relation: not_before
          duration_source: variants.cli_cooldown_months
          unit: calendar_months
          counting_rule: "Months are counted in whole calendar months: N months are complete on the same day of the month N months later, or on the last day of that month when that day does not exist."
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Pro Revolving Charge Plus: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 30: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 30 Select: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 45: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
        Ridgeline Commercial Account Net 60 Enterprise: {cli_max_increase_pct: "=cli_max_increase_pct", cli_financials_threshold_usd: "=cli_financials_threshold_usd"}
    formula:
      max_new_limit: min(credit_line_max_usd, round(credit_limit * (1 + cli_max_increase_pct / 100), 2), relationship_exposure_cap_usd - trade_msr_other_open_credit_limits)
    measures: [trade_msr_negative_history, trade_msr_other_open_credit_limits]

  - id: trade_account_standing
    subject: [trade_account_placed_on_hold, trade_account_released, trade_account_charged_off]
    rule: >-
      Account standing is changed only by the system from statement and balance records.
      An active account is placed on hold with hold_reason past_due when a statement shows days_past_due at or above on_hold_days_past_due, and with hold_reason over_limit when the balance exceeds the credit line by more than overlimit_tolerance_pct percent; sister-account holds follow trade_agg_relationship.
      An account on hold for past_due is released only when every past-due amount is paid (release_requires_full_past_due), and one on hold for over_limit when the balance is back within the credit line; a partial payment never releases a hold.
      An account on hold is charged off when a statement shows days_past_due at or above charge_off_days_past_due.
      Customer Care cannot release a hold early or reverse a charge-off; a payment that clears the past-due amount is credited and the release follows from the records.
    eligibility: []
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Pro Revolving Charge Plus: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 30: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 30 Select: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 45: {on_hold_days_past_due: "=on_hold_days_past_due"}
        Ridgeline Commercial Account Net 60 Enterprise: {on_hold_days_past_due: "=on_hold_days_past_due"}

  - id: trade_account_closure
    subject: [trade_account_closed]
    rule: >-
      An owner or principal of the business may close a Pro Credit account, recorded as a trade_requests record of request_type account_closure; an authorized buyer may not.
      Closure takes effect only on the confirmation of an owner or principal of the business.
      When closure_requires_zero_balance is true the closure takes effect on the day the balance reaches 0.00 and new charges are stopped from the request date; when it is false the account closes on confirmation and the balance is repaid under the existing terms.
      Commercial Credit closes an account when trade_msr_months_since_activity reaches inactivity_closure_months.
      A closed account cannot be reopened; the business applies again under trade_agg_multi_holding.
    eligibility:
      - id: principal_confirms
        applies_to: [trade_account_closed]
        kind: authorization
        condition: Closure takes effect only on the confirmation of an owner or principal of the business.
        evidence_fields: [trade_requests.trade_request_id, trade_requests.trade_account_id, trade_requests.request_type]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [trade_requests.trade_account_id]
          action_bindings:
            trade_requests.trade_account_id: trade_account_id
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Pro Revolving Charge Plus: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 30: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 30 Select: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 45: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
        Ridgeline Commercial Account Net 60 Enterprise: {closure_requires_zero_balance: "=closure_requires_zero_balance"}
    measures: [trade_msr_months_since_activity]

  - id: trade_account_settings
    subject: [trade_tax_exemption_updated, trade_account_settings_updated]
    rule: >-
      Only an owner or principal of the business may change the purchase order requirement, the number of authorized buyers or the tax exemption on file.
      Settings may be changed while the account status is active or on_hold.
      authorized_buyer_count may never exceed the tier's authorized_buyer_max, and po_required may be set to true only on a tier whose po_required_option is true.
      A tax exemption certificate is placed on file with its number exactly as printed, its effective date and its expiry date as stated on the certificate; an expired certificate is not placed on file, and a renewal replaces the earlier certificate's dates.
      Placing a certificate on file never changes invoices already posted; tax already charged is credited only under trade_evt_tax_exempt_credit.
    eligibility:
      - id: principal_instruction
        applies_to: [trade_tax_exemption_updated, trade_account_settings_updated]
        kind: authorization
        condition: Only an owner or principal of the business may change the purchase order requirement, the number of authorized buyers or the tax exemption on file.
        evidence_fields: [trade_accounts.trade_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
      - id: open_account
        applies_to: [trade_tax_exemption_updated, trade_account_settings_updated]
        kind: state
        condition: Settings may be changed while the account status is active or on_hold.
        evidence_fields: [trade_accounts.trade_account_id, trade_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_accounts.trade_account_id]
          action_bindings:
            trade_accounts.trade_account_id: trade_account_id
        state_contract:
          field: trade_accounts.status
          allowed: [active, on_hold]
    params:
      per_tier:
        Ridgeline Pro Revolving Charge: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Pro Revolving Charge Plus: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 30: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 30 Select: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 45: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}
        Ridgeline Commercial Account Net 60 Enterprise: {authorized_buyer_max: "=authorized_buyer_max", po_required_option: "=po_required_option"}

extended_policies:
  - id: trade_ext_dispute_settlement_credit
    base_policy_refs: [trade_evt_invoice_dispute]
    overwrite:
      - base_policy: trade_evt_invoice_dispute
        superseded_clause: >-
          it credits the disputed amount against the invoice, referencing the invoice row and the request.
        replaced_by: >-
          The dispute settlement credit is the disputed amount plus the sales tax added back on the disputed amount, plus the slow-resolution goodwill, plus the price-protection credit, plus the dispute handling credit, plus the first-dispute courtesy, rounded to the nearest cent once on that total.
    trigger: state_due
    subject: [trade_dispute_credit_posted]
    computes: credit_amount
    target_tool: post_dispute_credit_3cc5c337
    params:
      early_filing_days: 30
      clock_tenure_months: 60
      goodwill_rate_gold: 0.10
      goodwill_rate_silver: 0.05
      protection_rate_quote: 10
      protection_rate_contract: 5
      handling_min_dispute_usd: 1500.00
      handling_tenure_months: 60
      handling_credit_long_usd: 75.00
      handling_credit_short_usd: 40.00
      first_dispute_window_months: 24
      first_dispute_rate_gold: 2
      first_dispute_rate_other: 1
    rule: >-
      An invoice dispute that Commercial Credit has resolved in the business's favor is settled by one dispute credit against the disputed invoice; a dispute credit posts only when the invoice dispute request has status approved, and it references the disputed invoice and the request.
      The standard dispute settlement credit is the disputed amount recorded on the approved invoice dispute request, credited in full against the disputed invoice and rounded to the nearest cent.
      The dispute settlement credit is the disputed amount plus the sales tax added back on the disputed amount, plus the slow-resolution goodwill, plus the price-protection credit, plus the dispute handling credit, plus the first-dispute courtesy, rounded to the nearest cent once on that total.
      The sales tax added back on the disputed amount is set by the disputed invoice and the dispute category: when the disputed invoice charged sales tax and the dispute is for a wrong price or a wrong quantity, the disputed amount is treated as merchandise and the tax added back is the disputed amount times the invoice's sales tax divided by its merchandise amount; when the disputed invoice charged sales tax and the dispute is for merchandise not received or an unauthorized buyer, the disputed amount is treated as part of the invoice total and the tax added back is the disputed amount times the invoice's sales tax divided by the invoice total; when the disputed invoice charged no sales tax, no tax is added back.
      The resolution clock of a dispute is counted in calendar days to the date the request was approved: when the dispute was filed no more than the early-filing days after the invoice date and the account has been open at least the clock tenure in whole months, the clock runs from the invoice date; when the dispute was filed no more than the early-filing days after the invoice date and the account has been open less than the clock tenure, the clock runs from the day after the filing date; when the dispute was filed later than the early-filing days after the invoice date, the clock runs from the filing date.
      The days of slow resolution are the days on the resolution clock beyond the tier's dispute resolution maximum, never below zero.
      The slow-resolution goodwill rate is set by the business's ProBuild Rewards membership: when the days of slow resolution are above zero and the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold goodwill rate per day; when the days of slow resolution are above zero and the business holds an active Silver membership, it is the Silver goodwill rate per day; in every other case it is zero.
      The slow-resolution goodwill is the disputed amount times the slow-resolution goodwill rate times the days of slow resolution, divided by one hundred.
      The price-protection rate is set by how the disputed invoice was priced: when the invoice was priced under a ProBuild volume pricing quote and the dispute is for a wrong price, it is the quote price-protection rate; when the invoice was priced at a contract price fixed in an installation or special order agreement and the dispute is for a wrong price, it is the contract price-protection rate; in every other case it is zero.
      The price-protection credit is the disputed amount times the price-protection rate divided by one hundred.
      The dispute handling credit is set by the size of the dispute and the age of the account: when the disputed amount is at least the handling minimum and the account has been open at least the handling tenure in whole months, it is the long-standing handling credit; when the disputed amount is at least the handling minimum and the account has been open less than the handling tenure, it is the newer-account handling credit; when the disputed amount is below the handling minimum, it is zero.
      The first-dispute courtesy rate is set by the account's dispute record and the ProBuild membership: when the approved dispute is the only invoice dispute filed on the account in the first-dispute window of whole calendar months and the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold first-dispute rate; when it is the only invoice dispute filed in that window and the business holds no Gold or higher membership, it is the standard first-dispute rate; when another invoice dispute was filed in that window, it is zero.
      The first-dispute courtesy is the disputed amount times the first-dispute courtesy rate divided by one hundred.
      Account age is counted in whole calendar months from the account's opening date to the date the credit is posted.
    prerequisite: []
    cross_category:
      - category: pro
        as: branch
        reads: [variant_name, status]
        note: The slow-resolution goodwill rate is decided from the tier of the business's active ProBuild Rewards membership.
    compute:
      - disputed: "LATEST('trade_requests','disputed_amount', date_field='created_at', request_type='invoice_dispute', status='approved')"
      - inv_id: "LATEST('trade_requests','disputed_transaction_id', date_field='created_at', request_type='invoice_dispute', status='approved')"
      - category: "LATEST('trade_requests','dispute_category', date_field='created_at', request_type='invoice_dispute', status='approved')"
      - filed_on: "LATEST('trade_requests','created_at', date_field='created_at', request_type='invoice_dispute', status='approved')"
      - approved_on: "LATEST('trade_requests','resolved_date', date_field='created_at', request_type='invoice_dispute', status='approved')"
      - opened_months: "MONTHS(F('opened_date'), NOW)"
      - inv_tax: "SUM('trade_transactions','sales_tax_amount', date_field='transaction_date', event_type='trade_invoice_posted', trade_transaction_id=inv_id)"
      - inv_merch: "SUM('trade_transactions','merchandise_amount', date_field='transaction_date', event_type='trade_invoice_posted', trade_transaction_id=inv_id)"
      - inv_total: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_invoice_posted', trade_transaction_id=inv_id)"
      - tax_back: "disputed * inv_tax / inv_merch if (inv_tax > 0 and (category == 'wrong_price' or category == 'wrong_quantity')) else (disputed * inv_tax / inv_total if inv_tax > 0 else 0)"
      - inv_date: "LATEST('trade_transactions','invoice_date', date_field='transaction_date', event_type='trade_invoice_posted', trade_transaction_id=inv_id)"
      - clock_days: "DAYS(inv_date, approved_on) if (DAYS(inv_date, filed_on) <= K('early_filing_days') and opened_months >= K('clock_tenure_months')) else (DAYS(filed_on, approved_on) - 1 if DAYS(inv_date, filed_on) <= K('early_filing_days') else DAYS(filed_on, approved_on))"
      - slow_days: "MX(0, clock_days - P('dispute_resolution_max_days'))"
      - pro_tier: "CFIELD('pro','variant_name', status='active')"
      - gold_plus: "pro_tier == 'ProBuild Gold' or pro_tier == 'ProBuild Platinum' or pro_tier == 'ProBuild Platinum Elite'"
      - goodwill_rate: "K('goodwill_rate_gold') if (slow_days > 0 and gold_plus) else (K('goodwill_rate_silver') if (slow_days > 0 and pro_tier == 'ProBuild Silver') else 0)"
      - inv_basis: "LATEST('trade_transactions','pricing_basis', date_field='transaction_date', event_type='trade_invoice_posted', trade_transaction_id=inv_id)"
      - protection_rate: "K('protection_rate_quote') if (inv_basis == 'pro_volume_quote' and category == 'wrong_price') else (K('protection_rate_contract') if (inv_basis == 'contract_price' and category == 'wrong_price') else 0)"
      - handling_credit: "K('handling_credit_long_usd') if (disputed >= K('handling_min_dispute_usd') and MONTHS(F('opened_date'), NOW) >= K('handling_tenure_months')) else (K('handling_credit_short_usd') if disputed >= K('handling_min_dispute_usd') else 0)"
      - disputes_window: "COUNT('trade_requests', within_months=K('first_dispute_window_months'), date_field='created_at', request_type='invoice_dispute')"
      - courtesy_tier: "CFIELD('pro','variant_name', status='active')"
      - first_dispute_rate: "K('first_dispute_rate_gold') if (disputes_window <= 1 and (courtesy_tier == 'ProBuild Gold' or courtesy_tier == 'ProBuild Platinum' or courtesy_tier == 'ProBuild Platinum Elite')) else (K('first_dispute_rate_other') if disputes_window <= 1 else 0)"
      - result: "RND(disputed + tax_back + disputed * goodwill_rate * slow_days / 100 + disputed * protection_rate / 100 + handling_credit + disputed * first_dispute_rate / 100, 2)"
    compute_basis:
      disputed: "The standard dispute settlement credit is the disputed amount recorded on the approved invoice dispute request, credited in full against the disputed invoice and rounded to the nearest cent."
      inv_id: "a dispute credit posts only when the invoice dispute request has status approved, and it references the disputed invoice and the request."
      category: "The sales tax added back on the disputed amount is set by the disputed invoice and the dispute category"
      filed_on: "when the dispute was filed later than the early-filing days after the invoice date, the clock runs from the filing date."
      approved_on: "The resolution clock of a dispute is counted in calendar days to the date the request was approved"
      opened_months: "Account age is counted in whole calendar months from the account's opening date to the date the credit is posted."
      inv_tax: "when the disputed invoice charged sales tax and the dispute is for a wrong price or a wrong quantity, the disputed amount is treated as merchandise and the tax added back is the disputed amount times the invoice's sales tax divided by its merchandise amount"
      inv_merch: "the tax added back is the disputed amount times the invoice's sales tax divided by its merchandise amount"
      inv_total: "the tax added back is the disputed amount times the invoice's sales tax divided by the invoice total"
      tax_back: "when the disputed invoice charged sales tax and the dispute is for a wrong price or a wrong quantity, the disputed amount is treated as merchandise and the tax added back is the disputed amount times the invoice's sales tax divided by its merchandise amount; when the disputed invoice charged sales tax and the dispute is for merchandise not received or an unauthorized buyer, the disputed amount is treated as part of the invoice total and the tax added back is the disputed amount times the invoice's sales tax divided by the invoice total; when the disputed invoice charged no sales tax, no tax is added back."
      inv_date: "when the dispute was filed no more than the early-filing days after the invoice date and the account has been open at least the clock tenure in whole months, the clock runs from the invoice date"
      clock_days: "when the dispute was filed no more than the early-filing days after the invoice date and the account has been open at least the clock tenure in whole months, the clock runs from the invoice date; when the dispute was filed no more than the early-filing days after the invoice date and the account has been open less than the clock tenure, the clock runs from the day after the filing date; when the dispute was filed later than the early-filing days after the invoice date, the clock runs from the filing date."
      slow_days: "The days of slow resolution are the days on the resolution clock beyond the tier's dispute resolution maximum, never below zero."
      pro_tier: "The slow-resolution goodwill rate is set by the business's ProBuild Rewards membership"
      gold_plus: "the business holds an active Gold, Platinum or Platinum Elite membership"
      goodwill_rate: "when the days of slow resolution are above zero and the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold goodwill rate per day; when the days of slow resolution are above zero and the business holds an active Silver membership, it is the Silver goodwill rate per day; in every other case it is zero."
      inv_basis: "The price-protection rate is set by how the disputed invoice was priced"
      protection_rate: "when the invoice was priced under a ProBuild volume pricing quote and the dispute is for a wrong price, it is the quote price-protection rate; when the invoice was priced at a contract price fixed in an installation or special order agreement and the dispute is for a wrong price, it is the contract price-protection rate; in every other case it is zero."
      handling_credit: "when the disputed amount is at least the handling minimum and the account has been open at least the handling tenure in whole months, it is the long-standing handling credit; when the disputed amount is at least the handling minimum and the account has been open less than the handling tenure, it is the newer-account handling credit; when the disputed amount is below the handling minimum, it is zero."
      courtesy_tier: "the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold first-dispute rate"
      disputes_window: "when the approved dispute is the only invoice dispute filed on the account in the first-dispute window of whole calendar months"
      first_dispute_rate: "when the approved dispute is the only invoice dispute filed on the account in the first-dispute window of whole calendar months and the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold first-dispute rate; when it is the only invoice dispute filed in that window and the business holds no Gold or higher membership, it is the standard first-dispute rate; when another invoice dispute was filed in that window, it is zero."
      result: "The dispute settlement credit is the disputed amount plus the sales tax added back on the disputed amount, plus the slow-resolution goodwill, plus the price-protection credit, plus the dispute handling credit, plus the first-dispute courtesy, rounded to the nearest cent once on that total."
    factors:
      - id: dispute_tax_add_back
        effect: method
        decides: tax_back
        bindings: [inv_tax, inv_merch, inv_total, tax_back]
        ladder:
          - when: "the disputed invoice charged sales tax and the dispute is for a wrong price or a wrong quantity"
            method: "the disputed amount is treated as merchandise: tax added back = disputed amount x invoice sales tax / invoice merchandise amount"
          - when: "the disputed invoice charged sales tax and the dispute is for merchandise not received or an unauthorized buyer"
            method: "the disputed amount is treated as part of the invoice total: tax added back = disputed amount x invoice sales tax / invoice total"
          - when: "otherwise (the disputed invoice charged no sales tax)"
            method: "no tax is added back"
        baseline:
          tax_back: "0"
        evidence: [history]
        cross_difficulty: null
      - id: dispute_resolution_clock
        effect: method
        decides: clock_days
        bindings: [inv_date, clock_days]
        ladder:
          - when: "the dispute was filed no more than the early-filing days after the invoice date and the account has been open at least the clock tenure"
            method: "the resolution clock runs from the invoice date to the approval date"
          - when: "the dispute was filed no more than the early-filing days after the invoice date and the account has been open less than the clock tenure"
            method: "the resolution clock runs from the day after the filing date to the approval date"
          - when: "otherwise (the dispute was filed later than the early-filing days after the invoice date)"
            method: "the resolution clock runs from the filing date to the approval date"
        baseline:
          clock_days: "DAYS(filed_on, approved_on)"
        evidence: [history, date]
        cross_difficulty: null
      - id: slow_resolution_goodwill
        effect: parameter
        decides: goodwill_rate
        bindings: [pro_tier, gold_plus, goodwill_rate]
        ladder:
          - when: "days of slow resolution above zero and an active Gold, Platinum or Platinum Elite ProBuild membership"
            value: "K('goodwill_rate_gold')"
          - when: "days of slow resolution above zero and an active Silver ProBuild membership"
            value: "K('goodwill_rate_silver')"
          - when: "otherwise"
            value: "0"
        baseline:
          goodwill_rate: "0"
        evidence: [cross_category, date]
        cross_difficulty: pro
      - id: dispute_price_protection
        effect: parameter
        decides: protection_rate
        bindings: [inv_basis, protection_rate]
        ladder:
          - when: "the invoice was priced under a ProBuild volume pricing quote and the dispute is for a wrong price"
            value: "K('protection_rate_quote')"
          - when: "the invoice was priced at a contract price and the dispute is for a wrong price"
            value: "K('protection_rate_contract')"
          - when: "otherwise"
            value: "0"
        baseline:
          protection_rate: "0"
        evidence: [history]
        cross_difficulty: null
      - id: dispute_handling_credit
        effect: parameter
        decides: handling_credit
        bindings: [handling_credit]
        ladder:
          - when: "disputed amount at least the handling minimum and the account open at least the handling tenure"
            value: "K('handling_credit_long_usd')"
          - when: "disputed amount at least the handling minimum and the account open less than the handling tenure"
            value: "K('handling_credit_short_usd')"
          - when: "otherwise (disputed amount below the handling minimum)"
            value: "0"
        baseline:
          handling_credit: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: first_dispute_courtesy
        effect: parameter
        decides: first_dispute_rate
        bindings: [disputes_window, courtesy_tier, first_dispute_rate]
        ladder:
          - when: "the approved dispute is the only invoice dispute filed in the first-dispute window and an active Gold, Platinum or Platinum Elite ProBuild membership"
            value: "K('first_dispute_rate_gold')"
          - when: "the only invoice dispute filed in the window and no Gold or higher membership"
            value: "K('first_dispute_rate_other')"
          - when: "otherwise (another invoice dispute filed in the window)"
            value: "0"
        baseline:
          first_dispute_rate: "0"
        evidence: [history, cross_category]
        cross_difficulty: pro
    baseline:
      rule: >-
        The standard dispute settlement credit is the disputed amount recorded on the approved invoice dispute request, credited in full against the disputed invoice and rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: trade_requests, aggregate: latest, field: disputed_amount, filters: {request_type: invoice_dispute, status: approved}}
        - {table: trade_transactions, aggregate: sum, field: sales_tax_amount, filters: {event_type: trade_invoice_posted}}
        - {table: trade_transactions, aggregate: latest, field: pricing_basis, filters: {event_type: trade_invoice_posted}}
      cross_category: [pro]

  - id: trade_ext_statement_late_charge
    base_policy_refs: [trade_evt_payment_application, trade_evt_late_charges, trade_evt_returned_payment]
    overwrite:
      - base_policy: trade_evt_late_charges
        superseded_clause: >-
          On a pay-in-full account a late payment charge (fee_type late_payment_charge) posts on each statement date when trade_msr_past_due_invoice_balance is above zero: late_charge_monthly_pct percent of that balance, rounded to the nearest cent, and never less than late_charge_min_usd.
        replaced_by: >-
          The statement late payment charge is the late charge base times the applied late charge rate divided by one hundred, times the late charge month share, rounded to the nearest cent once at the end, and never less than the tier's minimum late payment charge when the late charge base is above zero.
    trigger: state_due
    subject: [trade_fee_assessed]
    computes: charge_amount
    target_tool: assess_late_payment_charge_c9e93ff5
    params:
      standing_cut_gold_pct: 0.50
      standing_cut_silver_pct: 0.25
      standing_other_charge_limit: 1
      volume_spend_usd: 100000.00
      volume_tenure_months: 60
      volume_cut_long_pct: 0.10
      volume_cut_short_pct: 0.05
      dispute_relief_gold_pct: 0.25
      dispute_relief_other_pct: 0.10
      proration_dpd_limit: 30
      proration_half_share: 0.5
      days_enroll_months: 60
      allowance_steady_payment_lines: 12
      allowance_long_usd: 1000.00
      allowance_short_usd: 500.00
    rule: >-
      On a pay-in-full account, a late payment charge is owed for the latest closed statement when that statement shows more days past due than the tier's late charge grace days and no late payment charge carries its statement period yet; the charge is assessed against that statement row and carries that statement's period, and a statement whose period already carries a late payment charge, or that shows no more days past due than the grace days, is charged nothing.
      The standard late payment charge for a closed statement is the statement's past-due amount times the tier's monthly late payment charge percentage divided by one hundred, rounded to the nearest cent, and never less than the tier's minimum late payment charge when the past-due amount is above zero.
      The statement late payment charge is the late charge base times the applied late charge rate divided by one hundred, times the late charge month share, rounded to the nearest cent once at the end, and never less than the tier's minimum late payment charge when the late charge base is above zero.
      The late charge base is the statement's past-due amount less the small-balance allowance, never below zero.
      The small-balance allowance is set by the account's payment record over the last 24 months: when no payment on the account has been returned in the last 24 months and at least the steady-payer count of payment lines were credited in those 24 months, it is the steady-payer allowance; when no payment has been returned in the last 24 months and fewer payment lines than the steady-payer count were credited, it is the standard allowance; when a payment has been returned in the last 24 months, it is zero.
      The applied late charge rate is the tier's monthly late payment charge percentage less the standing reduction, the volume reduction and the dispute relief, never below zero; the three reductions are each taken from the tier's percentage and are added together, not applied one after another.
      The standing reduction is set by the business's ProBuild Rewards membership and its late charge record: when the business holds an active Gold, Platinum or Platinum Elite membership and the account carries no more than the standing limit of other late payment charges posted in the last 12 months, it is the Gold standing reduction; when the business holds an active Silver membership and the account carries no more than the standing limit of other late payment charges posted in the last 12 months, it is the Silver standing reduction; in every other case it is zero.
      The volume reduction is set by ProBuild qualifying spend and account age: when the business's ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the volume spend threshold and the account has been open at least the volume tenure in whole months, it is the long-standing volume reduction; when that net spend is at least the volume spend threshold and the account has been open less than the volume tenure, it is the newer-account volume reduction; when that net spend is below the threshold, it is zero.
      The dispute relief is set by the most recently filed invoice dispute on the account: when that dispute was filed on or before the statement date and was still unresolved on the statement date and the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold dispute relief; when that dispute was open on the statement date in the same way and the business holds no Gold or higher membership, it is the standard dispute relief; when no dispute was open on the statement date, it is zero.
      The late charge month share is set by the statement's days past due and the account's tier: when the statement shows fewer days past due than the proration limit and the account is a Commercial Account Net 45 or Net 60 Enterprise, it is the days counted for the late charge divided by 30; when the statement shows fewer days past due than the proration limit and the account is any other tier, it is the half-month share; when the statement shows the proration limit of days past due or more, it is one full month.
      The days counted for the late charge are set by the ProBuild membership's age and service level: when the membership has been enrolled at least the enrollment threshold in whole months and carries a dedicated pro account representative, they are the statement's days past due less the tier's late charge grace days; when the membership has been enrolled at least the enrollment threshold and carries no dedicated representative, they are the statement's days past due less half the tier's late charge grace days, the half rounded down to a whole day; in every other case they are the statement's days past due; never below zero.
      Account age is counted in whole calendar months from the account's opening date to the date the charge is assessed, and the 12-month and 24-month windows are counted back from that date in whole calendar months.
    prerequisite: []
    cross_category:
      - category: pro
        as: history
        reads: [variant_name, status, enrolled_date, dedicated_account_rep, pro_activity.amount]
        note: The standing reduction reads the membership tier, the volume reduction reads 12 months of ProBuild spend lines, and the days counted read the membership's enrollment date and dedicated-representative benefit.
    compute:
      - stmt_pd: "LATEST('trade_transactions','past_due_amount', date_field='transaction_date', event_type='trade_statement_issued')"
      - stmt_date: "LATEST('trade_transactions','statement_date', date_field='transaction_date', event_type='trade_statement_issued')"
      - stmt_period: "LATEST('trade_transactions','statement_period', date_field='transaction_date', event_type='trade_statement_issued')"
      - period_charges: "COUNT('trade_transactions', date_field='transaction_date', event_type='trade_fee_assessed', fee_type='late_payment_charge', statement_period=stmt_period)"
      - opened_months: "MONTHS(F('opened_date'), NOW)"
      - returned_24: "COUNT('trade_transactions', within_months=24, date_field='transaction_date', event_type='trade_payment_returned')"
      - payment_lines_24: "COUNT('trade_transactions', within_months=24, date_field='transaction_date', event_type='trade_payment_received')"
      - allowance: "K('allowance_long_usd') if (returned_24 == 0 and payment_lines_24 >= K('allowance_steady_payment_lines')) else (K('allowance_short_usd') if returned_24 == 0 else 0)"
      - charge_base: "MX(0, stmt_pd - allowance)"
      - pro_tier: "CFIELD('pro','variant_name', status='active')"
      - gold_plus: "pro_tier == 'ProBuild Gold' or pro_tier == 'ProBuild Platinum' or pro_tier == 'ProBuild Platinum Elite'"
      - other_charges_12: "COUNT('trade_transactions', within_months=12, date_field='transaction_date', event_type='trade_fee_assessed', fee_type='late_payment_charge')"
      - standing_cut: "K('standing_cut_gold_pct') if (gold_plus and other_charges_12 <= K('standing_other_charge_limit')) else (K('standing_cut_silver_pct') if (pro_tier == 'ProBuild Silver' and other_charges_12 <= K('standing_other_charge_limit')) else 0)"
      - spend_12: "XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_posted') - XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_reversed')"
      - volume_cut: "K('volume_cut_long_pct') if (spend_12 >= K('volume_spend_usd') and opened_months >= K('volume_tenure_months')) else (K('volume_cut_short_pct') if spend_12 >= K('volume_spend_usd') else 0)"
      - dispute_filed: "LATEST('trade_requests','created_at', date_field='created_at', request_type='invoice_dispute')"
      - dispute_closed: "LATEST('trade_requests','resolved_date', date_field='created_at', request_type='invoice_dispute')"
      - dispute_open: "dispute_filed != None and DAYS(dispute_filed, stmt_date) >= 0 and (not dispute_closed or DAYS(stmt_date, dispute_closed) > 0)"
      - relief_tier: "CFIELD('pro','variant_name', status='active')"
      - dispute_relief: "K('dispute_relief_gold_pct') if (dispute_open and (relief_tier == 'ProBuild Gold' or relief_tier == 'ProBuild Platinum' or relief_tier == 'ProBuild Platinum Elite')) else (K('dispute_relief_other_pct') if dispute_open else 0)"
      - applied_rate: "MX(0, P('late_charge_monthly_pct') - standing_cut - volume_cut - dispute_relief)"
      - stmt_dpd: "LATEST('trade_transactions','days_past_due', date_field='transaction_date', event_type='trade_statement_issued')"
      - enrolled_months: "MONTHS(CFIELD('pro','enrolled_date', status='active'), NOW)"
      - has_rep: "CPARAM('pro','dedicated_account_rep', status='active') == True"
      - days_counted: "MX(0, stmt_dpd - P('late_charge_grace_days')) if (enrolled_months >= K('days_enroll_months') and has_rep) else (MX(0, stmt_dpd - int(P('late_charge_grace_days') / 2)) if enrolled_months >= K('days_enroll_months') else stmt_dpd)"
      - month_share: "days_counted / 30 if (stmt_dpd < K('proration_dpd_limit') and (F('variant_name') == 'Ridgeline Commercial Account Net 45' or F('variant_name') == 'Ridgeline Commercial Account Net 60 Enterprise')) else (K('proration_half_share') if stmt_dpd < K('proration_dpd_limit') else 1)"
      - raw_charge: "charge_base * applied_rate / 100 * month_share"
      - charge_owed: "stmt_dpd > P('late_charge_grace_days') and period_charges == 0"
      - result: "RND(MX(P('late_charge_min_usd'), raw_charge), 2) if (charge_base > 0 and charge_owed) else 0"
    compute_basis:
      stmt_pd: "The late charge base is the statement's past-due amount less the small-balance allowance, never below zero."
      stmt_date: "when that dispute was filed on or before the statement date and was still unresolved on the statement date"
      stmt_period: "the charge is assessed against that statement row and carries that statement's period"
      period_charges: "no late payment charge carries its statement period yet"
      opened_months: "Account age is counted in whole calendar months from the account's opening date to the date the charge is assessed, and the 12-month and 24-month windows are counted back from that date in whole calendar months."
      returned_24: "when no payment on the account has been returned in the last 24 months"
      payment_lines_24: "at least the steady-payer count of payment lines were credited in those 24 months"
      allowance: "when no payment on the account has been returned in the last 24 months and at least the steady-payer count of payment lines were credited in those 24 months, it is the steady-payer allowance; when no payment has been returned in the last 24 months and fewer payment lines than the steady-payer count were credited, it is the standard allowance; when a payment has been returned in the last 24 months, it is zero."
      charge_base: "The late charge base is the statement's past-due amount less the small-balance allowance, never below zero."
      pro_tier: "The standing reduction is set by the business's ProBuild Rewards membership and its late charge record"
      gold_plus: "the business holds an active Gold, Platinum or Platinum Elite membership"
      other_charges_12: "the account carries no more than the standing limit of other late payment charges posted in the last 12 months"
      standing_cut: "when the business holds an active Gold, Platinum or Platinum Elite membership and the account carries no more than the standing limit of other late payment charges posted in the last 12 months, it is the Gold standing reduction; when the business holds an active Silver membership and the account carries no more than the standing limit of other late payment charges posted in the last 12 months, it is the Silver standing reduction; in every other case it is zero."
      spend_12: "the business's ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months"
      volume_cut: "when the business's ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the volume spend threshold and the account has been open at least the volume tenure in whole months, it is the long-standing volume reduction; when that net spend is at least the volume spend threshold and the account has been open less than the volume tenure, it is the newer-account volume reduction; when that net spend is below the threshold, it is zero."
      dispute_filed: "The dispute relief is set by the most recently filed invoice dispute on the account"
      dispute_closed: "was still unresolved on the statement date"
      dispute_open: "when that dispute was filed on or before the statement date and was still unresolved on the statement date"
      relief_tier: "and the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold dispute relief"
      dispute_relief: "when that dispute was filed on or before the statement date and was still unresolved on the statement date and the business holds an active Gold, Platinum or Platinum Elite membership, it is the Gold dispute relief; when that dispute was open on the statement date in the same way and the business holds no Gold or higher membership, it is the standard dispute relief; when no dispute was open on the statement date, it is zero."
      applied_rate: "The applied late charge rate is the tier's monthly late payment charge percentage less the standing reduction, the volume reduction and the dispute relief, never below zero; the three reductions are each taken from the tier's percentage and are added together, not applied one after another."
      stmt_dpd: "The late charge month share is set by the statement's days past due and the account's tier"
      enrolled_months: "when the membership has been enrolled at least the enrollment threshold in whole months"
      has_rep: "carries a dedicated pro account representative"
      days_counted: "when the membership has been enrolled at least the enrollment threshold in whole months and carries a dedicated pro account representative, they are the statement's days past due less the tier's late charge grace days; when the membership has been enrolled at least the enrollment threshold and carries no dedicated representative, they are the statement's days past due less half the tier's late charge grace days, the half rounded down to a whole day; in every other case they are the statement's days past due; never below zero."
      month_share: "when the statement shows fewer days past due than the proration limit and the account is a Commercial Account Net 45 or Net 60 Enterprise, it is the days counted for the late charge divided by 30; when the statement shows fewer days past due than the proration limit and the account is any other tier, it is the half-month share; when the statement shows the proration limit of days past due or more, it is one full month."
      raw_charge: "The statement late payment charge is the late charge base times the applied late charge rate divided by one hundred, times the late charge month share"
      charge_owed: "a late payment charge is owed for the latest closed statement when that statement shows more days past due than the tier's late charge grace days and no late payment charge carries its statement period yet"
      result: "rounded to the nearest cent once at the end, and never less than the tier's minimum late payment charge when the late charge base is above zero."
    factors:
      - id: late_charge_standing_reduction
        effect: parameter
        decides: standing_cut
        bindings: [pro_tier, gold_plus, other_charges_12, standing_cut]
        ladder:
          - when: "an active Gold, Platinum or Platinum Elite ProBuild membership and no more than the standing limit of other late payment charges in the last 12 months"
            value: "K('standing_cut_gold_pct')"
          - when: "an active Silver ProBuild membership and no more than the standing limit of other late payment charges in the last 12 months"
            value: "K('standing_cut_silver_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_cut: "0"
        evidence: [cross_category, history]
        cross_difficulty: pro
      - id: late_charge_volume_reduction
        effect: parameter
        decides: volume_cut
        bindings: [spend_12, volume_cut]
        ladder:
          - when: "12-month net ProBuild spend at least the volume threshold and the account open at least the volume tenure"
            value: "K('volume_cut_long_pct')"
          - when: "12-month net ProBuild spend at least the volume threshold and the account open less than the volume tenure"
            value: "K('volume_cut_short_pct')"
          - when: "otherwise (net spend below the threshold)"
            value: "0"
        baseline:
          volume_cut: "0"
        evidence: [cross_category, date]
        cross_difficulty: pro
      - id: late_charge_dispute_relief
        effect: parameter
        decides: dispute_relief
        bindings: [dispute_filed, dispute_closed, dispute_open, relief_tier, dispute_relief]
        ladder:
          - when: "the most recently filed invoice dispute was open on the statement date and the business holds an active Gold, Platinum or Platinum Elite membership"
            value: "K('dispute_relief_gold_pct')"
          - when: "that dispute was open on the statement date and the business holds no Gold or higher membership"
            value: "K('dispute_relief_other_pct')"
          - when: "otherwise (no dispute open on the statement date)"
            value: "0"
        baseline:
          dispute_relief: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: pro
      - id: late_charge_small_balance_allowance
        effect: parameter
        decides: allowance
        bindings: [returned_24, payment_lines_24, allowance]
        ladder:
          - when: "no returned payment in the last 24 months and at least the steady-payer count of payment lines in those 24 months"
            value: "K('allowance_long_usd')"
          - when: "no returned payment in the last 24 months and fewer payment lines than the steady-payer count"
            value: "K('allowance_short_usd')"
          - when: "otherwise (a payment returned in the last 24 months)"
            value: "0"
        baseline:
          allowance: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_charge_month_share
        effect: method
        decides: month_share
        bindings: [stmt_dpd, month_share]
        ladder:
          - when: "fewer days past due than the proration limit on a Commercial Account Net 45 or Net 60 Enterprise"
            method: "the monthly rate is prorated: days counted for the late charge divided by 30"
          - when: "fewer days past due than the proration limit on any other tier"
            method: "a flat half-month share of the monthly rate"
          - when: "otherwise (the proration limit of days past due or more)"
            method: "one full month of the monthly rate"
        baseline:
          month_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: late_charge_days_counted
        effect: method
        decides: days_counted
        bindings: [enrolled_months, has_rep, days_counted]
        ladder:
          - when: "ProBuild membership enrolled at least the enrollment threshold and carrying a dedicated pro account representative"
            method: "days are counted from the end of the grace period: days past due less the tier's grace days"
          - when: "ProBuild membership enrolled at least the enrollment threshold with no dedicated representative"
            method: "days are counted from halfway through the grace period: days past due less half the grace days, rounded down"
          - when: "otherwise"
            method: "days are counted from the due date: the statement's days past due"
        baseline:
          days_counted: "stmt_dpd"
        evidence: [cross_category, date]
        cross_difficulty: pro
    baseline:
      rule: >-
        The standard late payment charge for a closed statement is the statement's past-due amount times the tier's monthly late payment charge percentage divided by one hundred, rounded to the nearest cent, and never less than the tier's minimum late payment charge when the past-due amount is above zero.
      params: [late_charge_monthly_pct, late_charge_min_usd]
    inputs:
      history:
        - {table: trade_transactions, aggregate: latest, field: past_due_amount, filters: {event_type: trade_statement_issued}}
        - {table: trade_transactions, aggregate: count, within_months: 12, filters: {event_type: trade_fee_assessed, fee_type: late_payment_charge}}
        - {table: trade_transactions, aggregate: count, within_months: 24, filters: {event_type: trade_payment_returned}}
        - {category: pro, table: pro_activity, aggregate: sum, field: amount, within_months: 12, filters: {event_type: pro_spend_posted}}
      cross_category: [pro]

  - id: trade_ext_phone_payoff
    base_policy_refs: [trade_evt_payment_application]
    overwrite:
      - base_policy: trade_evt_payment_application
        superseded_clause: >-
          Each invoice the payment touches is recorded as its own trade_payment_received row under the same payment_reference.
        replaced_by: >-
          A payoff payment is recorded as one payment line held on account under its payment reference, and it is applied to the open invoices and charges on the next statement.
      - base_policy: trade_evt_payment_application
        superseded_clause: >-
          A payment is applied first to the invoices the business names in its remittance, up to each invoice's trade_msr_invoice_open_balance; any amount not directed by the remittance goes to the oldest past-due invoice first and then to the oldest open invoice by invoice_date; whatever remains after every open invoice is settled is held on account with an empty applied_invoice_number.
        replaced_by: >-
          A payoff payment is recorded as one payment line held on account under its payment reference, and it is applied to the open invoices and charges on the next statement.
      - base_policy: trade_evt_payment_application
        superseded_clause: >-
          An owner, principal or authorized buyer of the business must authorize the debit before a phone payment is posted.
        replaced_by: >-
          When an owner, principal or authorized buyer of a business holding a pay-in-full commercial account asks to pay the account off in full by phone, the payoff payment is one debit from the business's bank account by phone ACH for the payoff figure, authorized and submitted by the business itself.
    trigger: on_request
    subject: [trade_payment_received]
    computes: payment_amount
    target_tool: submit_payoff_payment_22b2623b
    params:
      regular_payment_count: 6
      regular_cut_guaranteed_pct: 0.50
      regular_cut_other_pct: 0.25
      repeat_charge_count: 2
      repeat_dpd_threshold: 15
      repeat_load_high_pct: 0.25
      repeat_load_low_pct: 0.10
      accrual_start_dpd_limit: 30
      accrual_start_tenure_months: 60
      tolerance_spend_usd: 100000.00
      tolerance_high_usd: 40.00
      tolerance_low_usd: 20.00
    rule: >-
      When an owner, principal or authorized buyer of a business holding a pay-in-full commercial account asks to pay the account off in full by phone, the payoff payment is one debit from the business's bank account by phone ACH for the payoff figure, authorized and submitted by the business itself.
      A payoff payment is recorded as one payment line held on account under its payment reference, and it is applied to the open invoices and charges on the next statement.
      The payoff figure is fixed only after the latest closed statement, when it shows more days past due than the tier's late charge grace days, carries a late payment charge on the ledger.
      The payoff figure is not fixed until every invoice dispute standing approved on the account has its dispute credit on the ledger.
      The standard payoff figure is the account's ledger balance plus the interim late charge accrued on the past-due amount shown on the latest closed statement at the tier's monthly late payment charge percentage, counted in actual days from the statement date to the payment date on a 360-day year of twelve months, rounded to the nearest cent once on the total.
      The account's ledger balance is every invoice, fee, interest charge, returned payment and credit balance refund on the account, less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account.
      The interim payoff accrual is the latest statement's past-due amount times the payoff accrual rate divided by one hundred, times twelve, times the payoff accrual year fraction, less the payoff accrual tolerance, never below zero; the payoff figure is the ledger balance plus the interim payoff accrual, rounded to the nearest cent once on the total.
      The payoff accrual rate is the tier's monthly late payment charge percentage less the regular-payer reduction plus the repeat-lateness loading, never below zero.
      The regular-payer reduction is set by the account's payment record and guarantee: when at least the regular payment count of payment lines were credited to the account in the last 12 months and a principal's personal guarantee is on file, it is the guaranteed regular-payer reduction; when at least that many payment lines were credited in the last 12 months and no personal guarantee is on file, it is the standard regular-payer reduction; when fewer were credited, it is zero.
      The repeat-lateness loading is set by the account's late payment charges and the latest statement's delinquency: when the account carries at least the repeat charge count of late payment charges posted in the last 12 months and the latest statement shows at least the repeat days threshold of days past due, it is the high repeat-lateness loading; when the account carries at least the repeat charge count of late payment charges in the last 12 months and the latest statement shows fewer days past due than that threshold, it is the low repeat-lateness loading; when the account carries fewer late payment charges in the last 12 months, it is zero.
      The day the interim payoff accrual starts is set by the latest statement's delinquency and the account's age: when the latest statement shows no more than the accrual-start days past due and the account has been open at least the accrual-start tenure in whole months, accrual starts once the tier's late charge grace days after the statement date have passed; when the latest statement shows no more than the accrual-start days past due and the account has been open less than the accrual-start tenure, accrual starts on the day after the statement date; when the latest statement shows more days past due than that, accrual starts on the statement date; the accrued days run to the payment date and are never below zero.
      The payoff accrual year fraction is set by the account's tier: on a Commercial Account Net 45 or Net 60 Enterprise it is the accrued days divided by 365; on a Commercial Account Net 30 Select it is the number of half-month periods begun in the accrued days, each half-month counted as one twenty-fourth of a year; on a Commercial Account Net 30 it is the accrued days divided by 360.
      The payoff accrual tolerance is set by the business's ProBuild Rewards membership: when the membership carries a dedicated pro account representative and the business's ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the tolerance spend threshold, it is the high payoff tolerance; when the membership carries a dedicated pro account representative and that net spend is below the threshold, it is the low payoff tolerance; when the membership carries no dedicated representative, it is zero.
      Account age is counted in whole calendar months from the account's opening date to the payment date, and the 12-month windows are counted back from the payment date in whole calendar months.
    prerequisite:
      - problem: trade_ext_statement_late_charge
        kind: value_input
        gate: fees
        form: state
        policy_source: >-
          The payoff figure is fixed only after the latest closed statement, when it shows more days past due than the tier's late charge grace days, carries a late payment charge on the ledger.
        condition: >-
          When the latest trade_statement_issued row of the account shows days_past_due above the tier's late_charge_grace_days, a trade_fee_assessed row of fee_type late_payment_charge carries that statement's statement_period.
        resolved_by: assess_late_payment_charge_c9e93ff5
        effect: >-
          The late payment charge assessed for the latest closed statement enters the fees sum of the ledger balance and raises the count of late payment charges in the last 12 months that the repeat-lateness loading reads, so both the ledger balance and the payoff accrual rate change.
      - problem: trade_ext_dispute_settlement_credit
        kind: value_input
        gate: dispute_credits
        form: state
        policy_source: >-
          The payoff figure is not fixed until every invoice dispute standing approved on the account has its dispute credit on the ledger.
        condition: >-
          Every trade_requests row of request_type invoice_dispute and status approved on the account is referenced by a trade_dispute_credit_posted row carrying its trade_request_id.
        resolved_by: post_dispute_credit_3cc5c337
        effect: >-
          The dispute settlement credit enters the dispute credits sum of the ledger balance and lowers the ledger balance by its amount.
    cross_category:
      - category: pro
        as: history
        reads: [dedicated_account_rep, status, pro_activity.amount]
        note: The payoff accrual tolerance reads the membership's dedicated-representative benefit and 12 months of ProBuild spend lines.
    compute:
      - invoices: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_invoice_posted')"
      - fees: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_fee_assessed')"
      - interest: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_interest_charged')"
      - returned: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_payment_returned')"
      - refunded: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_credit_balance_refunded')"
      - payments: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_payment_received')"
      - discounts: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_early_pay_discount_applied')"
      - tax_credits: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_tax_credit_posted')"
      - return_credits: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_return_credit_posted')"
      - waivers: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_fee_waived')"
      - reversals: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_fee_reversed')"
      - dispute_credits: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_dispute_credit_posted')"
      - ledger_balance: "invoices + fees + interest + returned + refunded - payments - discounts - tax_credits - return_credits - waivers - reversals - dispute_credits"
      - stmt_pd: "LATEST('trade_transactions','past_due_amount', date_field='transaction_date', event_type='trade_statement_issued')"
      - stmt_date: "LATEST('trade_transactions','statement_date', date_field='transaction_date', event_type='trade_statement_issued')"
      - stmt_dpd: "LATEST('trade_transactions','days_past_due', date_field='transaction_date', event_type='trade_statement_issued')"
      - payment_lines_12: "COUNT('trade_transactions', within_months=12, date_field='transaction_date', event_type='trade_payment_received')"
      - regular_cut: "K('regular_cut_guaranteed_pct') if (payment_lines_12 >= K('regular_payment_count') and F('personal_guarantee_on_file') == True) else (K('regular_cut_other_pct') if payment_lines_12 >= K('regular_payment_count') else 0)"
      - late_charges_12: "COUNT('trade_transactions', within_months=12, date_field='transaction_date', event_type='trade_fee_assessed', fee_type='late_payment_charge')"
      - repeat_load: "K('repeat_load_high_pct') if (late_charges_12 >= K('repeat_charge_count') and stmt_dpd >= K('repeat_dpd_threshold')) else (K('repeat_load_low_pct') if late_charges_12 >= K('repeat_charge_count') else 0)"
      - accrual_rate: "MX(0, P('late_charge_monthly_pct') - regular_cut + repeat_load)"
      - opened_months: "MONTHS(F('opened_date'), NOW)"
      - accrued_days: "MX(0, DAYS(stmt_date, NOW) - P('late_charge_grace_days')) if (stmt_dpd <= K('accrual_start_dpd_limit') and opened_months >= K('accrual_start_tenure_months')) else (MX(0, DAYS(stmt_date, NOW) - 1) if stmt_dpd <= K('accrual_start_dpd_limit') else MX(0, DAYS(stmt_date, NOW)))"
      - year_fraction: "accrued_days / 365 if (F('variant_name') == 'Ridgeline Commercial Account Net 45' or F('variant_name') == 'Ridgeline Commercial Account Net 60 Enterprise') else (int((accrued_days + 14) / 15) / 24 if F('variant_name') == 'Ridgeline Commercial Account Net 30 Select' else accrued_days / 360)"
      - has_rep: "CPARAM('pro','dedicated_account_rep', status='active') == True"
      - spend_12: "XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_posted') - XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_reversed')"
      - tolerance: "K('tolerance_high_usd') if (has_rep and spend_12 >= K('tolerance_spend_usd')) else (K('tolerance_low_usd') if has_rep else 0)"
      - accrual: "MX(0, stmt_pd * accrual_rate / 100 * 12 * year_fraction - tolerance)"
      - result: "RND(ledger_balance + accrual, 2)"
    compute_basis:
      invoices: "The account's ledger balance is every invoice, fee, interest charge, returned payment and credit balance refund on the account, less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      fees: "The account's ledger balance is every invoice, fee, interest charge, returned payment and credit balance refund on the account"
      interest: "every invoice, fee, interest charge, returned payment and credit balance refund on the account"
      returned: "every invoice, fee, interest charge, returned payment and credit balance refund on the account"
      refunded: "every invoice, fee, interest charge, returned payment and credit balance refund on the account"
      payments: "less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      discounts: "less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      tax_credits: "less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      return_credits: "less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      waivers: "less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      reversals: "less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      dispute_credits: "less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account."
      stmt_pd: "The interim payoff accrual is the latest statement's past-due amount times the payoff accrual rate divided by one hundred"
      stmt_date: "counted in actual days from the statement date to the payment date"
      stmt_dpd: "The repeat-lateness loading is set by the account's late payment charges and the latest statement's delinquency"
      payment_lines_12: "when at least the regular payment count of payment lines were credited to the account in the last 12 months"
      regular_cut: "when at least the regular payment count of payment lines were credited to the account in the last 12 months and a principal's personal guarantee is on file, it is the guaranteed regular-payer reduction; when at least that many payment lines were credited in the last 12 months and no personal guarantee is on file, it is the standard regular-payer reduction; when fewer were credited, it is zero."
      late_charges_12: "when the account carries at least the repeat charge count of late payment charges posted in the last 12 months"
      repeat_load: "when the account carries at least the repeat charge count of late payment charges posted in the last 12 months and the latest statement shows at least the repeat days threshold of days past due, it is the high repeat-lateness loading; when the account carries at least the repeat charge count of late payment charges in the last 12 months and the latest statement shows fewer days past due than that threshold, it is the low repeat-lateness loading; when the account carries fewer late payment charges in the last 12 months, it is zero."
      accrual_rate: "The payoff accrual rate is the tier's monthly late payment charge percentage less the regular-payer reduction plus the repeat-lateness loading, never below zero."
      opened_months: "Account age is counted in whole calendar months from the account's opening date to the payment date, and the 12-month windows are counted back from the payment date in whole calendar months."
      accrued_days: "when the latest statement shows no more than the accrual-start days past due and the account has been open at least the accrual-start tenure in whole months, accrual starts once the tier's late charge grace days after the statement date have passed; when the latest statement shows no more than the accrual-start days past due and the account has been open less than the accrual-start tenure, accrual starts on the day after the statement date; when the latest statement shows more days past due than that, accrual starts on the statement date; the accrued days run to the payment date and are never below zero."
      year_fraction: "on a Commercial Account Net 45 or Net 60 Enterprise it is the accrued days divided by 365; on a Commercial Account Net 30 Select it is the number of half-month periods begun in the accrued days, each half-month counted as one twenty-fourth of a year; on a Commercial Account Net 30 it is the accrued days divided by 360."
      has_rep: "when the membership carries a dedicated pro account representative"
      spend_12: "the business's ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months"
      tolerance: "when the membership carries a dedicated pro account representative and the business's ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the tolerance spend threshold, it is the high payoff tolerance; when the membership carries a dedicated pro account representative and that net spend is below the threshold, it is the low payoff tolerance; when the membership carries no dedicated representative, it is zero."
      accrual: "The interim payoff accrual is the latest statement's past-due amount times the payoff accrual rate divided by one hundred, times twelve, times the payoff accrual year fraction, less the payoff accrual tolerance, never below zero"
      result: "the payoff figure is the ledger balance plus the interim payoff accrual, rounded to the nearest cent once on the total."
    factors:
      - id: payoff_regular_payer_reduction
        effect: parameter
        decides: regular_cut
        bindings: [payment_lines_12, regular_cut]
        ladder:
          - when: "at least the regular payment count of payment lines in the last 12 months and a personal guarantee on file"
            value: "K('regular_cut_guaranteed_pct')"
          - when: "at least the regular payment count of payment lines in the last 12 months and no personal guarantee on file"
            value: "K('regular_cut_other_pct')"
          - when: "otherwise (fewer payment lines)"
            value: "0"
        baseline:
          regular_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: payoff_repeat_lateness_loading
        effect: parameter
        decides: repeat_load
        bindings: [late_charges_12, repeat_load]
        ladder:
          - when: "at least the repeat charge count of late payment charges in the last 12 months and at least the repeat days threshold of days past due on the latest statement"
            value: "K('repeat_load_high_pct')"
          - when: "at least the repeat charge count of late payment charges in the last 12 months and fewer days past due than the threshold"
            value: "K('repeat_load_low_pct')"
          - when: "otherwise (fewer late payment charges)"
            value: "0"
        baseline:
          repeat_load: "0"
        evidence: [history]
        cross_difficulty: null
      - id: payoff_accrual_start
        effect: method
        decides: accrued_days
        bindings: [accrued_days]
        ladder:
          - when: "no more than the accrual-start days past due on the latest statement and the account open at least the accrual-start tenure"
            method: "accrual starts after the tier's grace days following the statement date"
          - when: "no more than the accrual-start days past due and the account open less than the accrual-start tenure"
            method: "accrual starts on the day after the statement date"
          - when: "otherwise (more days past due)"
            method: "accrual starts on the statement date"
        baseline:
          accrued_days: "MX(0, DAYS(stmt_date, NOW))"
        evidence: [date]
        cross_difficulty: null
      - id: payoff_accrual_day_count
        effect: method
        decides: year_fraction
        bindings: [stmt_date, year_fraction]
        ladder:
          - when: "the account is a Commercial Account Net 45 or Net 60 Enterprise"
            method: "actual accrued days over a 365-day year"
          - when: "the account is a Commercial Account Net 30 Select"
            method: "half-month periods begun, each one twenty-fourth of a year"
          - when: "otherwise (a Commercial Account Net 30)"
            method: "actual accrued days over a 360-day year"
        baseline:
          year_fraction: "accrued_days / 360"
        evidence: [date]
        cross_difficulty: null
      - id: payoff_accrual_tolerance
        effect: parameter
        decides: tolerance
        bindings: [has_rep, spend_12, tolerance]
        ladder:
          - when: "a dedicated pro account representative on the membership and 12-month net ProBuild spend at least the tolerance threshold"
            value: "K('tolerance_high_usd')"
          - when: "a dedicated pro account representative and 12-month net ProBuild spend below the threshold"
            value: "K('tolerance_low_usd')"
          - when: "otherwise (no dedicated representative)"
            value: "0"
        baseline:
          tolerance: "0"
        evidence: [cross_category]
        cross_difficulty: pro
    baseline:
      rule: >-
        The standard payoff figure is the account's ledger balance plus the interim late charge accrued on the past-due amount shown on the latest closed statement at the tier's monthly late payment charge percentage, counted in actual days from the statement date to the payment date on a 360-day year of twelve months, rounded to the nearest cent once on the total.
        The account's ledger balance is every invoice, fee, interest charge, returned payment and credit balance refund on the account, less every payment, prompt-payment discount, tax credit, return credit, fee waiver, fee reversal and dispute credit on the account.
      params: [late_charge_monthly_pct]
    inputs:
      history:
        - {table: trade_transactions, aggregate: sum, field: amount, filters: {event_type: trade_invoice_posted}}
        - {table: trade_transactions, aggregate: sum, field: amount, filters: {event_type: trade_payment_received}}
        - {table: trade_transactions, aggregate: count, within_months: 12, filters: {event_type: trade_fee_assessed, fee_type: late_payment_charge}}
        - {table: trade_transactions, aggregate: latest, field: past_due_amount, filters: {event_type: trade_statement_issued}}
        - {category: pro, table: pro_activity, aggregate: sum, field: amount, within_months: 12, filters: {event_type: pro_spend_posted}}
      cross_category: [pro]

  - id: trade_ext_credit_line_sizing
    base_policy_refs: [trade_agg_relationship, trade_credit_line_increase]
    overwrite:
      - base_policy: trade_credit_line_increase
        superseded_clause: >-
          trade_msr_negative_history, counted over the cli_clean_history_months months before the request, must be zero.
        replaced_by: >-
          The late-charge share of a line increase is set by the number of late payment charges posted on the account in the late-charge count window: when exactly one was posted, it is the single-charge share; when two or more were posted, it is the multiple-charge share; when none was posted, the increase is granted in full.
      - base_policy: trade_credit_line_increase
        superseded_clause: >-
          Otherwise the new line is the lowest of the requested_credit_limit, the current credit_limit increased by cli_max_increase_pct percent, the tier's credit_line_max_usd and the headroom under trade_agg_relationship, rounded down to cli_rounding_increment_usd; no increase is granted when that figure is not above the current line.
        replaced_by: >-
          The new credit line is the current line plus the line increase, rounded down to the tier's credit line rounding increment, and then limited to the lowest of that figure, the requested line on the submitted request and the tier's maximum credit line; no increase is granted when that figure is not above the current line.
    trigger: on_request
    subject: [trade_credit_limit_changed]
    computes: new_credit_limit
    target_tool: decide_credit_line_increase_746194e9
    params:
      pct_spend_top_usd: 150000.00
      pct_add_top: 10
      pct_spend_mid_usd: 50000.00
      pct_add_mid: 5
      window_short_months: 6
      window_rep_tenure_months: 60
      window_open_tenure_months: 24
      window_established_months: 9
      share_single_charge: 0.80
      share_multiple_charges: 0.50
      seasoning_top_points: 5
      seasoning_top_tenure_months: 84
      seasoning_top_enroll_months: 60
      seasoning_mid_points: 2.5
      seasoning_mid_tenure_months: 36
      seasoning_mid_enroll_months: 24
      guarantee_share_long: 1.10
      guarantee_addition_usd: 2500.00
      guarantee_tenure_months: 60
      usage_multiplier_rep: 1.15
      usage_multiplier_other: 1.05
    rule: >-
      A credit line increase requested by an owner or principal and recorded as a submitted credit line increase request is decided by Customer Care when the requested line does not exceed the tier's financials threshold, and the decision approves the request and sets the new line in one step.
      A new credit line is not decided until the ledger shows a payment credited after the latest statement date that at least equals that statement's past-due amount.
      The standard line increase is the current credit line times the tier's maximum increase percentage divided by one hundred.
      The new credit line is the current line plus the line increase, rounded down to the tier's credit line rounding increment, and then limited to the lowest of that figure, the requested line on the submitted request and the tier's maximum credit line; no increase is granted when that figure is not above the current line.
      The core line increase is the current credit line times the sum of the increase percentage and the seasoning points, divided by one hundred, then multiplied by the late-charge share and the usage multiplier; the multiplications act on that one product, in any order.
      The increase percentage is set by the business's ProBuild Rewards membership and spend: when the business holds an active Gold, Platinum or Platinum Elite membership and its ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the top spend threshold, it is the tier's maximum increase percentage plus the top percentage addition; when the business holds an active Silver or higher membership with that net spend at least the middle spend threshold and does not meet the first condition, it is the tier's maximum increase percentage plus the middle percentage addition; in every other case it is the tier's maximum increase percentage.
      The late-charge share of a line increase is set by the number of late payment charges posted on the account in the late-charge count window: when exactly one was posted, it is the single-charge share; when two or more were posted, it is the multiple-charge share; when none was posted, the increase is granted in full.
      The late-charge count window is set by the membership's service level and the account's age: when the business's ProBuild membership carries a dedicated pro account representative and the account has been open at least the representative tenure in whole months, the window is the short window of whole calendar months back from the decision date; when the account has been open at least the open-account tenure and does not meet the first condition, the window is the established-account window of whole calendar months back from the decision date; in every other case the window is the tier's clean-history months.
      The seasoning points are set by the ages of the account and of the ProBuild membership: when the account has been open at least the top seasoning tenure and the membership has been enrolled at least the top enrollment age, both in whole months, they are the top seasoning points; when the account has been open at least the middle seasoning tenure and the membership enrolled at least the middle enrollment age, and the first condition is not met, they are the middle seasoning points; in every other case they are zero.
      The line increase is set from the core line increase by the personal guarantee and the account's age: when a principal's personal guarantee is on file and the account has been open at least the guarantee tenure in whole months, the core line increase is multiplied by the guarantee share; when a personal guarantee is on file and the account has been open less than the guarantee tenure, the guarantee addition is added to the core line increase as a flat amount; when no personal guarantee is on file, the line increase is the core line increase.
      The usage multiplier is set by the highest statement balance on record for the account: when that balance is above the current credit line and the business's ProBuild membership carries a dedicated pro account representative, it is the representative usage multiplier; when that balance is above the current credit line and there is no dedicated representative, it is the standard usage multiplier; when no statement balance on record is above the current line, it is one.
      Account and membership ages are counted in whole calendar months to the decision date, and every month window is counted back from the decision date in whole calendar months.
    prerequisite:
      - problem: trade_ext_phone_payoff
        kind: state_gate
        gate: trade_transactions.amount
        form: state
        policy_source: >-
          A new credit line is not decided until the ledger shows a payment credited after the latest statement date that at least equals that statement's past-due amount.
        condition: >-
          A trade_payment_received row dated after the statement_date of the latest trade_statement_issued row stands on the account with an amount at least that statement's past_due_amount.
        resolved_by: submit_payoff_payment_22b2623b
        effect: >-
          Once the payoff payment line stands on the ledger, the latest statement's past-due amount is covered and the increase may be decided and the new line set.
    cross_category:
      - category: pro
        as: history
        reads: [variant_name, status, enrolled_date, dedicated_account_rep, pro_activity.amount]
        note: The increase percentage reads the membership tier and 12 months of ProBuild spend lines; the seasoning points read the enrollment date; the count window and the usage multiplier read the dedicated-representative benefit.
    compute:
      - current_line: "F('credit_limit')"
      - requested_line: "LATEST('trade_requests','requested_credit_limit', date_field='created_at', request_type='credit_limit_increase', status='submitted')"
      - opened_months: "MONTHS(F('opened_date'), NOW)"
      - pro_tier: "CFIELD('pro','variant_name', status='active')"
      - gold_plus: "pro_tier == 'ProBuild Gold' or pro_tier == 'ProBuild Platinum' or pro_tier == 'ProBuild Platinum Elite'"
      - silver_plus: "gold_plus or pro_tier == 'ProBuild Silver'"
      - spend_12: "XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_posted') - XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_reversed')"
      - increase_pct: "P('cli_max_increase_pct') + K('pct_add_top') if (gold_plus and spend_12 >= K('pct_spend_top_usd')) else (P('cli_max_increase_pct') + K('pct_add_mid') if (silver_plus and spend_12 >= K('pct_spend_mid_usd')) else P('cli_max_increase_pct'))"
      - has_rep: "CPARAM('pro','dedicated_account_rep', status='active') == True"
      - count_window: "K('window_short_months') if (has_rep and opened_months >= K('window_rep_tenure_months')) else (K('window_established_months') if opened_months >= K('window_open_tenure_months') else P('cli_clean_history_months'))"
      - late_charges_window: "COUNT('trade_transactions', within_months=count_window, date_field='transaction_date', event_type='trade_fee_assessed', fee_type='late_payment_charge')"
      - late_charge_share: "K('share_single_charge') if late_charges_window == 1 else (K('share_multiple_charges') if late_charges_window >= 2 else 1)"
      - enrolled_months: "MONTHS(CFIELD('pro','enrolled_date', status='active'), NOW)"
      - seasoning_points: "K('seasoning_top_points') if (opened_months >= K('seasoning_top_tenure_months') and enrolled_months >= K('seasoning_top_enroll_months')) else (K('seasoning_mid_points') if (opened_months >= K('seasoning_mid_tenure_months') and enrolled_months >= K('seasoning_mid_enroll_months')) else 0)"
      - peak_balance: "MAX('trade_transactions','statement_balance', event_type='trade_statement_issued')"
      - usage_multiplier: "K('usage_multiplier_rep') if (peak_balance > current_line and has_rep) else (K('usage_multiplier_other') if peak_balance > current_line else 1)"
      - core_increase: "current_line * (increase_pct + seasoning_points) / 100 * late_charge_share * usage_multiplier"
      - line_increase: "core_increase * K('guarantee_share_long') if (F('personal_guarantee_on_file') == True and MONTHS(F('opened_date'), NOW) >= K('guarantee_tenure_months')) else (core_increase + K('guarantee_addition_usd') if F('personal_guarantee_on_file') == True else core_increase)"
      - stepped_line: "int((current_line + line_increase) / P('cli_rounding_increment_usd')) * P('cli_rounding_increment_usd')"
      - limited_line: "MN(stepped_line, requested_line, P('credit_line_max_usd'))"
      - result: "limited_line if limited_line > current_line else current_line"
    compute_basis:
      current_line: "The standard line increase is the current credit line times the tier's maximum increase percentage divided by one hundred."
      requested_line: "the requested line on the submitted request"
      opened_months: "Account and membership ages are counted in whole calendar months to the decision date, and every month window is counted back from the decision date in whole calendar months."
      pro_tier: "The increase percentage is set by the business's ProBuild Rewards membership and spend"
      gold_plus: "when the business holds an active Gold, Platinum or Platinum Elite membership"
      silver_plus: "when the business holds an active Silver or higher membership"
      spend_12: "its ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months"
      increase_pct: "when the business holds an active Gold, Platinum or Platinum Elite membership and its ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the top spend threshold, it is the tier's maximum increase percentage plus the top percentage addition; when the business holds an active Silver or higher membership with that net spend at least the middle spend threshold and does not meet the first condition, it is the tier's maximum increase percentage plus the middle percentage addition; in every other case it is the tier's maximum increase percentage."
      has_rep: "when the business's ProBuild membership carries a dedicated pro account representative"
      count_window: "when the business's ProBuild membership carries a dedicated pro account representative and the account has been open at least the representative tenure in whole months, the window is the short window of whole calendar months back from the decision date; when the account has been open at least the open-account tenure and does not meet the first condition, the window is the established-account window of whole calendar months back from the decision date; in every other case the window is the tier's clean-history months."
      late_charges_window: "the number of late payment charges posted on the account in the late-charge count window"
      late_charge_share: "when exactly one was posted, it is the single-charge share; when two or more were posted, it is the multiple-charge share; when none was posted, the increase is granted in full."
      enrolled_months: "the membership has been enrolled at least the top enrollment age"
      seasoning_points: "when the account has been open at least the top seasoning tenure and the membership has been enrolled at least the top enrollment age, both in whole months, they are the top seasoning points; when the account has been open at least the middle seasoning tenure and the membership enrolled at least the middle enrollment age, and the first condition is not met, they are the middle seasoning points; in every other case they are zero."
      peak_balance: "The usage multiplier is set by the highest statement balance on record for the account"
      usage_multiplier: "when that balance is above the current credit line and the business's ProBuild membership carries a dedicated pro account representative, it is the representative usage multiplier; when that balance is above the current credit line and there is no dedicated representative, it is the standard usage multiplier; when no statement balance on record is above the current line, it is one."
      core_increase: "The core line increase is the current credit line times the sum of the increase percentage and the seasoning points, divided by one hundred, then multiplied by the late-charge share and the usage multiplier; the multiplications act on that one product, in any order."
      line_increase: "when a principal's personal guarantee is on file and the account has been open at least the guarantee tenure in whole months, the core line increase is multiplied by the guarantee share; when a personal guarantee is on file and the account has been open less than the guarantee tenure, the guarantee addition is added to the core line increase as a flat amount; when no personal guarantee is on file, the line increase is the core line increase."
      stepped_line: "The new credit line is the current line plus the line increase, rounded down to the tier's credit line rounding increment"
      limited_line: "and then limited to the lowest of that figure, the requested line on the submitted request and the tier's maximum credit line"
      result: "no increase is granted when that figure is not above the current line."
    factors:
      - id: line_increase_percentage
        effect: parameter
        decides: increase_pct
        bindings: [spend_12, increase_pct]
        ladder:
          - when: "an active Gold, Platinum or Platinum Elite ProBuild membership and 12-month net ProBuild spend at least the top spend threshold"
            value: "P('cli_max_increase_pct') + K('pct_add_top')"
          - when: "an active Silver or higher ProBuild membership with 12-month net spend at least the middle threshold, not meeting the first condition"
            value: "P('cli_max_increase_pct') + K('pct_add_mid')"
          - when: "otherwise"
            value: "P('cli_max_increase_pct')"
        baseline:
          increase_pct: "P('cli_max_increase_pct')"
        evidence: [cross_category, tier_param]
        cross_difficulty: pro
      - id: line_late_charge_share
        effect: parameter
        decides: late_charge_share
        bindings: [late_charges_window, late_charge_share]
        ladder:
          - when: "exactly one late payment charge posted in the late-charge count window"
            value: "K('share_single_charge')"
          - when: "two or more late payment charges posted in the window"
            value: "K('share_multiple_charges')"
          - when: "otherwise (none posted)"
            value: "1"
        baseline:
          late_charge_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: line_late_charge_window
        effect: parameter
        decides: count_window
        bindings: [has_rep, count_window]
        ladder:
          - when: "a dedicated pro account representative on the ProBuild membership and the account open at least the representative tenure"
            value: "K('window_short_months')"
          - when: "the account open at least the open-account tenure, not meeting the first condition"
            value: "K('window_established_months')"
          - when: "otherwise"
            value: "P('cli_clean_history_months')"
        baseline:
          count_window: "P('cli_clean_history_months')"
        evidence: [cross_category, date]
        cross_difficulty: pro
      - id: line_seasoning_points
        effect: parameter
        decides: seasoning_points
        bindings: [enrolled_months, seasoning_points]
        ladder:
          - when: "account open at least the top seasoning tenure and ProBuild membership enrolled at least the top enrollment age"
            value: "K('seasoning_top_points')"
          - when: "account open at least the middle seasoning tenure and membership enrolled at least the middle enrollment age, not meeting the first condition"
            value: "K('seasoning_mid_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          seasoning_points: "0"
        evidence: [cross_category, date]
        cross_difficulty: pro
      - id: line_guarantee_share
        effect: method
        decides: line_increase
        bindings: [line_increase]
        ladder:
          - when: "a personal guarantee on file and the account open at least the guarantee tenure"
            method: "the core line increase is multiplied by the guarantee share"
          - when: "a personal guarantee on file and the account open less than the guarantee tenure"
            method: "the guarantee addition is added to the core line increase as a flat amount"
          - when: "otherwise (no personal guarantee on file)"
            method: "the line increase is the core line increase, unchanged"
        baseline:
          line_increase: "core_increase"
        evidence: [date]
        cross_difficulty: null
      - id: line_usage_multiplier
        effect: parameter
        decides: usage_multiplier
        bindings: [peak_balance, usage_multiplier]
        ladder:
          - when: "highest statement balance on record above the current line and a dedicated pro account representative on the membership"
            value: "K('usage_multiplier_rep')"
          - when: "highest statement balance on record above the current line and no dedicated representative"
            value: "K('usage_multiplier_other')"
          - when: "otherwise (no statement balance above the current line)"
            value: "1"
        baseline:
          usage_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard line increase is the current credit line times the tier's maximum increase percentage divided by one hundred.
        The new credit line is the current line plus the line increase, rounded down to the tier's credit line rounding increment, and then limited to the lowest of that figure, the requested line on the submitted request and the tier's maximum credit line; no increase is granted when that figure is not above the current line.
      params: [cli_max_increase_pct, cli_rounding_increment_usd, credit_line_max_usd]
    inputs:
      history:
        - {table: trade_requests, aggregate: latest, field: requested_credit_limit, filters: {request_type: credit_limit_increase, status: submitted}}
        - {table: trade_transactions, aggregate: count, filters: {event_type: trade_fee_assessed, fee_type: late_payment_charge}}
        - {table: trade_transactions, aggregate: max, field: statement_balance, filters: {event_type: trade_statement_issued}}
        - {category: pro, table: pro_activity, aggregate: sum, field: amount, within_months: 12, filters: {event_type: pro_spend_posted}}
      cross_category: [pro]

  - id: trade_ext_late_fee_rerating
    base_policy_refs: [trade_evt_fee_correction, trade_evt_late_charges]
    overwrite:
      - base_policy: trade_evt_fee_correction
        superseded_clause: >-
          A fee that should not have been charged is reversed in full by one trade_fee_reversed row referencing it.
        replaced_by: >-
          When the most recent late fee posted on a revolving account is above its re-rated amount, the excess is reversed as a posting error by one correction entry referencing that late fee; the late fee correction is the posted late fee less the re-rated late fee, never below zero.
      - base_policy: trade_evt_late_charges
        superseded_clause: >-
          On a revolving account a late fee (fee_type late_fee) of late_fee_usd posts on the day after a statement due date when the payments credited from the statement date through the due date total less than that statement's minimum_payment_due.
        replaced_by: >-
          The re-rated late fee is the scheduled late fee less the ProBuild member reduction and the tenure reduction, never below zero, multiplied by the lateness share and rounded to the nearest cent.
    trigger: state_due
    subject: [trade_fee_reversed]
    computes: reversal_amount
    target_tool: reverse_late_fee_excess_4d4f7d34
    params:
      first_fee_usd: 25.00
      first_fee_tenure_months: 12
      second_fee_usd: 32.00
      repeat_window_member_months: 6
      repeat_window_member_tenure_months: 60
      repeat_window_standard_months: 12
      repeat_window_open_months: 24
      repeat_window_newer_months: 24
      member_spend_usd: 10000.00
      member_cut_silver_usd: 5.00
      member_cut_basic_usd: 2.00
      tenure_cut_long_usd: 4.00
      tenure_cut_mid_usd: 2.00
      tenure_long_months: 60
      tenure_mid_months: 24
      brief_lateness_days: 5
      lateness_proration_days: 10
      lateness_share_other: 0.75
    rule: >-
      A late fee on a revolving account is owed on the day after a statement due date when the payments credited from the statement date through the due date total less than that statement's minimum payment due.
      When the most recent late fee posted on a revolving account is above its re-rated amount, the excess is reversed as a posting error by one correction entry referencing that late fee; the late fee correction is the posted late fee less the re-rated late fee, never below zero.
      The standard re-rated late fee is the tier's late fee, so a late fee posted at the tier's late fee needs no correction.
      The re-rated late fee is the scheduled late fee less the ProBuild member reduction and the tenure reduction, never below zero, multiplied by the lateness share and rounded to the nearest cent.
      The scheduled late fee is set by the account's other late fees in the repeat window: when no other late fee was posted on the account in the repeat window and the account has been open at least the first-fee tenure in whole months, it is the first-time late fee; when exactly one other late fee was posted in the repeat window, it is the second-time late fee; in every other case it is the tier's late fee.
      The repeat window is set by the ProBuild membership and the account's age: when the business holds an active Silver, Gold, Platinum or Platinum Elite membership and the account has been open at least the member window tenure in whole months, it is the member window of whole calendar months back from the correction date; when the account has been open at least the open-account tenure and does not meet the first condition, it is the standard window; in every other case it is the newer-account window.
      The ProBuild member reduction is set by the membership and its spend: when the business holds an active Silver or higher membership and its ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the member spend threshold, it is the Silver member reduction; when the business holds an active ProBuild Member or Bronze membership with that net spend at least the threshold, it is the basic member reduction; in every other case it is zero.
      The tenure reduction is set by the account's age and returned payments: when the account has been open at least the long tenure in whole months and no payment on the account was returned in the last 24 months, it is the long-tenure reduction; when the account has been open at least the middle tenure, short of the long tenure, and no payment was returned in the last 24 months, it is the middle-tenure reduction; in every other case it is zero.
      The lateness share is set by how far past due the latest closed statement shows the account and by the guarantee: when the latest statement shows no more than the brief lateness days past due and a principal's personal guarantee is on file, the fee is prorated and the lateness share is the statement's days past due divided by the lateness proration days; when it shows no more than the brief lateness days past due and no personal guarantee is on file, it is the flat standard lateness share; when it shows more days past due, it is one.
      Account age is counted in whole calendar months from the account's opening date to the correction date, and every month window is counted back from the correction date in whole calendar months.
    prerequisite: []
    cross_category:
      - category: pro
        as: history
        reads: [variant_name, status, pro_activity.amount]
        note: The repeat window and the member reduction read the membership tier; the member reduction reads 12 months of ProBuild spend lines.
    compute:
      - fee_posted: "LATEST('trade_transactions','amount', date_field='transaction_date', event_type='trade_fee_assessed', fee_type='late_fee')"
      - opened_months: "MONTHS(F('opened_date'), NOW)"
      - pro_tier: "CFIELD('pro','variant_name', status='active')"
      - silver_plus: "pro_tier == 'ProBuild Silver' or pro_tier == 'ProBuild Gold' or pro_tier == 'ProBuild Platinum' or pro_tier == 'ProBuild Platinum Elite'"
      - repeat_window: "K('repeat_window_member_months') if (silver_plus and opened_months >= K('repeat_window_member_tenure_months')) else (K('repeat_window_standard_months') if opened_months >= K('repeat_window_open_months') else K('repeat_window_newer_months'))"
      - other_fees: "COUNT('trade_transactions', within_months=repeat_window, date_field='transaction_date', event_type='trade_fee_assessed', fee_type='late_fee') - 1"
      - scheduled_fee: "K('first_fee_usd') if (other_fees == 0 and opened_months >= K('first_fee_tenure_months')) else (K('second_fee_usd') if other_fees == 1 else P('late_fee_usd'))"
      - spend_12: "XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_posted') - XSUM('pro','pro_activity','amount', within_months=12, date_field='activity_date', event_type='pro_spend_reversed')"
      - member_cut: "K('member_cut_silver_usd') if (silver_plus and spend_12 >= K('member_spend_usd')) else (K('member_cut_basic_usd') if ((pro_tier == 'ProBuild Member' or pro_tier == 'ProBuild Bronze') and spend_12 >= K('member_spend_usd')) else 0)"
      - returned_24: "COUNT('trade_transactions', within_months=24, date_field='transaction_date', event_type='trade_payment_returned')"
      - tenure_cut: "K('tenure_cut_long_usd') if (opened_months >= K('tenure_long_months') and returned_24 == 0) else (K('tenure_cut_mid_usd') if (opened_months >= K('tenure_mid_months') and returned_24 == 0) else 0)"
      - stmt_dpd: "LATEST('trade_transactions','days_past_due', date_field='transaction_date', event_type='trade_statement_issued')"
      - lateness_share: "stmt_dpd / K('lateness_proration_days') if (stmt_dpd <= K('brief_lateness_days') and F('personal_guarantee_on_file') == True) else (K('lateness_share_other') if stmt_dpd <= K('brief_lateness_days') else 1)"
      - rerated_fee: "RND(MX(0, scheduled_fee - member_cut - tenure_cut) * lateness_share, 2)"
      - result: "RND(fee_posted - rerated_fee, 2) if fee_posted > rerated_fee else 0"
    compute_basis:
      fee_posted: "the late fee correction is the posted late fee less the re-rated late fee, never below zero."
      opened_months: "Account age is counted in whole calendar months from the account's opening date to the correction date, and every month window is counted back from the correction date in whole calendar months."
      pro_tier: "The repeat window is set by the ProBuild membership and the account's age"
      silver_plus: "when the business holds an active Silver, Gold, Platinum or Platinum Elite membership"
      repeat_window: "when the business holds an active Silver, Gold, Platinum or Platinum Elite membership and the account has been open at least the member window tenure in whole months, it is the member window of whole calendar months back from the correction date; when the account has been open at least the open-account tenure and does not meet the first condition, it is the standard window; in every other case it is the newer-account window."
      other_fees: "The scheduled late fee is set by the account's other late fees in the repeat window"
      scheduled_fee: "when no other late fee was posted on the account in the repeat window and the account has been open at least the first-fee tenure in whole months, it is the first-time late fee; when exactly one other late fee was posted in the repeat window, it is the second-time late fee; in every other case it is the tier's late fee."
      spend_12: "its ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months"
      member_cut: "when the business holds an active Silver or higher membership and its ProBuild qualifying spend posted in the last 12 months, net of spend reversed in the same 12 months, is at least the member spend threshold, it is the Silver member reduction; when the business holds an active ProBuild Member or Bronze membership with that net spend at least the threshold, it is the basic member reduction; in every other case it is zero."
      returned_24: "no payment on the account was returned in the last 24 months"
      tenure_cut: "when the account has been open at least the long tenure in whole months and no payment on the account was returned in the last 24 months, it is the long-tenure reduction; when the account has been open at least the middle tenure, short of the long tenure, and no payment was returned in the last 24 months, it is the middle-tenure reduction; in every other case it is zero."
      stmt_dpd: "The lateness share is set by how far past due the latest closed statement shows the account and by the guarantee"
      lateness_share: "when the latest statement shows no more than the brief lateness days past due and a principal's personal guarantee is on file, the fee is prorated and the lateness share is the statement's days past due divided by the lateness proration days; when it shows no more than the brief lateness days past due and no personal guarantee is on file, it is the flat standard lateness share; when it shows more days past due, it is one."
      rerated_fee: "The re-rated late fee is the scheduled late fee less the ProBuild member reduction and the tenure reduction, never below zero, multiplied by the lateness share and rounded to the nearest cent."
      result: "When the most recent late fee posted on a revolving account is above its re-rated amount, the excess is reversed as a posting error by one correction entry referencing that late fee; the late fee correction is the posted late fee less the re-rated late fee, never below zero."
    factors:
      - id: late_fee_schedule
        effect: parameter
        decides: scheduled_fee
        bindings: [other_fees, scheduled_fee]
        ladder:
          - when: "no other late fee in the repeat window and the account open at least the first-fee tenure"
            value: "K('first_fee_usd')"
          - when: "exactly one other late fee in the repeat window"
            value: "K('second_fee_usd')"
          - when: "otherwise"
            value: "P('late_fee_usd')"
        baseline:
          scheduled_fee: "P('late_fee_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: late_fee_repeat_window
        effect: parameter
        decides: repeat_window
        bindings: [pro_tier, silver_plus, repeat_window]
        ladder:
          - when: "an active Silver or higher ProBuild membership and the account open at least the member window tenure"
            value: "K('repeat_window_member_months')"
          - when: "the account open at least the open-account tenure, not meeting the first condition"
            value: "K('repeat_window_standard_months')"
          - when: "otherwise"
            value: "K('repeat_window_newer_months')"
        baseline:
          repeat_window: "K('repeat_window_newer_months')"
        evidence: [cross_category, date]
        cross_difficulty: pro
      - id: late_fee_member_reduction
        effect: parameter
        decides: member_cut
        bindings: [spend_12, member_cut]
        ladder:
          - when: "an active Silver or higher ProBuild membership and 12-month net ProBuild spend at least the member spend threshold"
            value: "K('member_cut_silver_usd')"
          - when: "an active ProBuild Member or Bronze membership and 12-month net spend at least the threshold"
            value: "K('member_cut_basic_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          member_cut: "0"
        evidence: [cross_category]
        cross_difficulty: pro
      - id: late_fee_tenure_reduction
        effect: parameter
        decides: tenure_cut
        bindings: [returned_24, tenure_cut]
        ladder:
          - when: "account open at least the long tenure and no returned payment in the last 24 months"
            value: "K('tenure_cut_long_usd')"
          - when: "account open at least the middle tenure, short of the long tenure, and no returned payment in the last 24 months"
            value: "K('tenure_cut_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_cut: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_fee_lateness_share
        effect: method
        decides: lateness_share
        bindings: [stmt_dpd, lateness_share]
        ladder:
          - when: "the latest statement shows no more than the brief lateness days past due and a personal guarantee is on file"
            method: "the fee is prorated by days late: the statement's days past due divided by the lateness proration days"
          - when: "no more than the brief lateness days past due and no personal guarantee on file"
            method: "a flat standard lateness share of the fee, whatever the days late"
          - when: "otherwise (more days past due)"
            method: "the fee is charged whole"
        baseline:
          lateness_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard re-rated late fee is the tier's late fee, so a late fee posted at the tier's late fee needs no correction.
      params: [late_fee_usd]
    inputs:
      history:
        - {table: trade_transactions, aggregate: latest, field: amount, filters: {event_type: trade_fee_assessed, fee_type: late_fee}}
        - {table: trade_transactions, aggregate: count, filters: {event_type: trade_fee_assessed, fee_type: late_fee}}
        - {table: trade_transactions, aggregate: count, within_months: 24, filters: {event_type: trade_payment_returned}}
        - {category: pro, table: pro_activity, aggregate: sum, field: amount, within_months: 12, filters: {event_type: pro_spend_posted}}
      cross_category: [pro]

  - id: trade_ext_statement_minimum_payment
    base_policy_refs: [trade_evt_payment_application, trade_evt_invoicing]
    overwrite:
      - base_policy: trade_evt_payment_application
        superseded_clause: >-
          An owner, principal or authorized buyer of the business must authorize the debit before a phone payment is posted.
        replaced_by: >-
          When an owner, principal or authorized buyer of a business holding a revolving Pro Credit account asks to make the payment that satisfies the latest statement's minimum, the payment is one debit from the business's bank account by phone ACH, authorized and submitted by the business itself.
      - base_policy: trade_evt_payment_application
        superseded_clause: >-
          Each invoice the payment touches is recorded as its own trade_payment_received row under the same payment_reference.
        replaced_by: >-
          A minimum-satisfying payment is recorded as one payment line held on account under its payment reference, and it is applied on the next statement.
      - base_policy: trade_evt_payment_application
        superseded_clause: >-
          A payment is applied first to the invoices the business names in its remittance, up to each invoice's trade_msr_invoice_open_balance; any amount not directed by the remittance goes to the oldest past-due invoice first and then to the oldest open invoice by invoice_date; whatever remains after every open invoice is settled is held on account with an empty applied_invoice_number.
        replaced_by: >-
          A minimum-satisfying payment is recorded as one payment line held on account under its payment reference, and it is applied on the next statement.
      - base_policy: trade_evt_invoicing
        superseded_clause: >-
          A revolving statement's minimum payment due is the full balance when below min_payment_floor_usd, and otherwise the greater of min_payment_floor_usd and min_payment_pct_of_balance percent of the balance
        replaced_by: >-
          The recomputed minimum is the adjusted statement balance in full when it is below the preferred minimum floor, and otherwise the greater of the preferred minimum floor and the preferred minimum percentage of the adjusted statement balance, that percentage figure rounded to the nearest cent.
    trigger: on_request
    subject: [trade_payment_received]
    computes: payment_amount
    target_tool: submit_minimum_payment_92c17bdd
    params:
      pct_member_tenure_months: 60
      pct_cut_long: 1.00
      pct_cut_short: 0.50
      floor_tenure_months: 36
      floor_long_usd: 25.00
      floor_short_usd: 35.00
      steady_payment_lines: 10
    rule: >-
      When an owner, principal or authorized buyer of a business holding a revolving Pro Credit account asks to make the payment that satisfies the latest statement's minimum, the payment is one debit from the business's bank account by phone ACH, authorized and submitted by the business itself.
      A minimum-satisfying payment is recorded as one payment line held on account under its payment reference, and it is applied on the next statement.
      The minimum-satisfying payment is fixed only after the most recent late fee on the account, when it stands above its re-rated amount, carries a correction entry on the ledger.
      The standard minimum-satisfying payment is the latest statement's printed minimum payment due plus that statement's past-due amount, less the payments credited since the statement date, never below zero, rounded to the nearest cent.
      The minimum-satisfying payment is the minimum used plus the latest statement's past-due amount, less the payments credited since the statement date, never below zero, rounded to the nearest cent once at the end.
      Entries posted since the statement date are the ledger entries carrying the statement period of the newest ledger entry, when that period is later than the latest statement's period.
      The netted credits are set by the account's returned payments and guarantee: when no payment on the account was returned in the last 24 months and a principal's personal guarantee is on file, they are every fee reversal, fee waiver, dispute credit, tax credit and return credit posted since the statement date; when no payment was returned in the last 24 months and no personal guarantee is on file, they are the fee reversals and fee waivers posted since the statement date; when a payment was returned in the last 24 months, nothing is netted.
      The adjusted statement balance is the latest statement's balance less the netted credits, never below zero.
      The preferred minimum percentage is set by the ProBuild membership and the account's age: when the business holds an active Silver, Gold, Platinum or Platinum Elite membership and the account has been open at least the member percentage tenure in whole months, it is the tier's minimum payment percentage less the long-standing member cut; when the business holds such a membership and the account has been open less than that tenure, it is the tier's minimum payment percentage less the newer member cut; in every other case it is the tier's minimum payment percentage.
      The preferred minimum floor is set by the guarantee and the account's age: when a principal's personal guarantee is on file and the account has been open at least the floor tenure in whole months, it is the long-standing floor; when a personal guarantee is on file and the account has been open less than the floor tenure, it is the newer-account floor; when no personal guarantee is on file, it is the tier's minimum payment floor.
      The recomputed minimum is the adjusted statement balance in full when it is below the preferred minimum floor, and otherwise the greater of the preferred minimum floor and the preferred minimum percentage of the adjusted statement balance, that percentage figure rounded to the nearest cent.
      The minimum used is set by the account's payment record and the ProBuild membership: when at least the steady-payer count of payment lines were credited to the account in the last 12 months and the business holds an active Silver or higher membership, it is the lower of the recomputed minimum and the printed minimum; when at least that many payment lines were credited in the last 12 months and the business holds no Silver or higher membership, it is the recomputed minimum; when fewer were credited, it is the printed minimum.
      Account age is counted in whole calendar months from the account's opening date to the payment date, and every month window is counted back from the payment date in whole calendar months.
    prerequisite:
      - problem: trade_ext_late_fee_rerating
        kind: value_input
        gate: reversals_since
        form: state
        policy_source: >-
          The minimum-satisfying payment is fixed only after the most recent late fee on the account, when it stands above its re-rated amount, carries a correction entry on the ledger.
        condition: >-
          When the most recent trade_fee_assessed row of fee_type late_fee on the account has an amount above its re-rated late fee, a trade_fee_reversed row references it.
        resolved_by: reverse_late_fee_excess_4d4f7d34
        effect: >-
          The late fee correction posts after the latest statement date, so it enters the fee reversals netted from the latest statement's balance; the adjusted statement balance, the recomputed minimum and the payment fall accordingly.
    cross_category:
      - category: pro
        as: branch
        reads: [variant_name, status]
        note: The preferred minimum percentage and the minimum used read the tier of the business's active ProBuild Rewards membership.
    compute:
      - stmt_period: "LATEST('trade_transactions','statement_period', date_field='transaction_date', event_type='trade_statement_issued')"
      - stmt_balance: "LATEST('trade_transactions','statement_balance', date_field='transaction_date', event_type='trade_statement_issued')"
      - printed_minimum: "LATEST('trade_transactions','minimum_payment_due', date_field='transaction_date', event_type='trade_statement_issued')"
      - stmt_past_due: "LATEST('trade_transactions','past_due_amount', date_field='transaction_date', event_type='trade_statement_issued')"
      - open_period: "LATEST('trade_transactions','statement_period', date_field='transaction_date')"
      - reversals_since: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_fee_reversed', statement_period=open_period) if open_period > stmt_period else 0"
      - waivers_since: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_fee_waived', statement_period=open_period) if open_period > stmt_period else 0"
      - credits_since: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_dispute_credit_posted', statement_period=open_period) + SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_tax_credit_posted', statement_period=open_period) + SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_return_credit_posted', statement_period=open_period) if open_period > stmt_period else 0"
      - returned_24: "COUNT('trade_transactions', within_months=24, date_field='transaction_date', event_type='trade_payment_returned')"
      - netted_credits: "reversals_since + waivers_since + credits_since if (returned_24 == 0 and F('personal_guarantee_on_file') == True) else (reversals_since + waivers_since if returned_24 == 0 else 0)"
      - adjusted_balance: "MX(0, stmt_balance - netted_credits)"
      - opened_months: "MONTHS(F('opened_date'), NOW)"
      - pro_tier: "CFIELD('pro','variant_name', status='active')"
      - silver_plus: "pro_tier == 'ProBuild Silver' or pro_tier == 'ProBuild Gold' or pro_tier == 'ProBuild Platinum' or pro_tier == 'ProBuild Platinum Elite'"
      - minimum_pct: "P('min_payment_pct_of_balance') - K('pct_cut_long') if (silver_plus and opened_months >= K('pct_member_tenure_months')) else (P('min_payment_pct_of_balance') - K('pct_cut_short') if silver_plus else P('min_payment_pct_of_balance'))"
      - minimum_floor: "K('floor_long_usd') if (F('personal_guarantee_on_file') == True and MONTHS(F('opened_date'), NOW) >= K('floor_tenure_months')) else (K('floor_short_usd') if F('personal_guarantee_on_file') == True else P('min_payment_floor_usd'))"
      - recomputed_minimum: "adjusted_balance if adjusted_balance < minimum_floor else MX(minimum_floor, RND(adjusted_balance * minimum_pct / 100, 2))"
      - payment_lines_12: "COUNT('trade_transactions', within_months=12, date_field='transaction_date', event_type='trade_payment_received')"
      - minimum_used: "MN(recomputed_minimum, printed_minimum) if (payment_lines_12 >= K('steady_payment_lines') and silver_plus) else (recomputed_minimum if payment_lines_12 >= K('steady_payment_lines') else printed_minimum)"
      - payments_since: "SUM('trade_transactions','amount', date_field='transaction_date', event_type='trade_payment_received', statement_period=open_period) if open_period > stmt_period else 0"
      - result: "RND(MX(0, minimum_used + stmt_past_due - payments_since), 2)"
    compute_basis:
      stmt_period: "Entries posted since the statement date are the ledger entries carrying the statement period of the newest ledger entry, when that period is later than the latest statement's period."
      stmt_balance: "The adjusted statement balance is the latest statement's balance less the netted credits, never below zero."
      printed_minimum: "The standard minimum-satisfying payment is the latest statement's printed minimum payment due plus that statement's past-due amount, less the payments credited since the statement date, never below zero, rounded to the nearest cent."
      stmt_past_due: "The minimum-satisfying payment is the minimum used plus the latest statement's past-due amount, less the payments credited since the statement date, never below zero, rounded to the nearest cent once at the end."
      open_period: "Entries posted since the statement date are the ledger entries carrying the statement period of the newest ledger entry, when that period is later than the latest statement's period."
      reversals_since: "they are the fee reversals and fee waivers posted since the statement date"
      waivers_since: "they are the fee reversals and fee waivers posted since the statement date"
      credits_since: "they are every fee reversal, fee waiver, dispute credit, tax credit and return credit posted since the statement date"
      returned_24: "when no payment on the account was returned in the last 24 months"
      netted_credits: "when no payment on the account was returned in the last 24 months and a principal's personal guarantee is on file, they are every fee reversal, fee waiver, dispute credit, tax credit and return credit posted since the statement date; when no payment was returned in the last 24 months and no personal guarantee is on file, they are the fee reversals and fee waivers posted since the statement date; when a payment was returned in the last 24 months, nothing is netted."
      adjusted_balance: "The adjusted statement balance is the latest statement's balance less the netted credits, never below zero."
      opened_months: "Account age is counted in whole calendar months from the account's opening date to the payment date, and every month window is counted back from the payment date in whole calendar months."
      pro_tier: "The preferred minimum percentage is set by the ProBuild membership and the account's age"
      silver_plus: "when the business holds an active Silver, Gold, Platinum or Platinum Elite membership"
      minimum_pct: "when the business holds an active Silver, Gold, Platinum or Platinum Elite membership and the account has been open at least the member percentage tenure in whole months, it is the tier's minimum payment percentage less the long-standing member cut; when the business holds such a membership and the account has been open less than that tenure, it is the tier's minimum payment percentage less the newer member cut; in every other case it is the tier's minimum payment percentage."
      minimum_floor: "when a principal's personal guarantee is on file and the account has been open at least the floor tenure in whole months, it is the long-standing floor; when a personal guarantee is on file and the account has been open less than the floor tenure, it is the newer-account floor; when no personal guarantee is on file, it is the tier's minimum payment floor."
      recomputed_minimum: "The recomputed minimum is the adjusted statement balance in full when it is below the preferred minimum floor, and otherwise the greater of the preferred minimum floor and the preferred minimum percentage of the adjusted statement balance, that percentage figure rounded to the nearest cent."
      payment_lines_12: "when at least the steady-payer count of payment lines were credited to the account in the last 12 months"
      minimum_used: "when at least the steady-payer count of payment lines were credited to the account in the last 12 months and the business holds an active Silver or higher membership, it is the lower of the recomputed minimum and the printed minimum; when at least that many payment lines were credited in the last 12 months and the business holds no Silver or higher membership, it is the recomputed minimum; when fewer were credited, it is the printed minimum."
      payments_since: "less the payments credited since the statement date"
      result: "The minimum-satisfying payment is the minimum used plus the latest statement's past-due amount, less the payments credited since the statement date, never below zero, rounded to the nearest cent once at the end."
    factors:
      - id: minimum_preferred_percentage
        effect: parameter
        decides: minimum_pct
        bindings: [pro_tier, silver_plus, minimum_pct]
        ladder:
          - when: "an active Silver or higher ProBuild membership and the account open at least the member percentage tenure"
            value: "P('min_payment_pct_of_balance') - K('pct_cut_long')"
          - when: "an active Silver or higher ProBuild membership and the account open less than that tenure"
            value: "P('min_payment_pct_of_balance') - K('pct_cut_short')"
          - when: "otherwise"
            value: "P('min_payment_pct_of_balance')"
        baseline:
          minimum_pct: "P('min_payment_pct_of_balance')"
        evidence: [cross_category, date]
        cross_difficulty: pro
      - id: minimum_preferred_floor
        effect: parameter
        decides: minimum_floor
        bindings: [minimum_floor]
        ladder:
          - when: "a personal guarantee on file and the account open at least the floor tenure"
            value: "K('floor_long_usd')"
          - when: "a personal guarantee on file and the account open less than the floor tenure"
            value: "K('floor_short_usd')"
          - when: "otherwise (no personal guarantee on file)"
            value: "P('min_payment_floor_usd')"
        baseline:
          minimum_floor: "P('min_payment_floor_usd')"
        evidence: [date]
        cross_difficulty: null
      - id: minimum_selection
        effect: method
        decides: minimum_used
        bindings: [payment_lines_12, minimum_used]
        ladder:
          - when: "at least the steady-payer count of payment lines in the last 12 months and an active Silver or higher ProBuild membership"
            method: "the lower of the recomputed minimum and the printed minimum is used"
          - when: "at least the steady-payer count of payment lines in the last 12 months and no Silver or higher membership"
            method: "the recomputed minimum is used"
          - when: "otherwise (fewer payment lines)"
            method: "the printed minimum on the statement is used"
        baseline:
          minimum_used: "printed_minimum"
        evidence: [history]
        cross_difficulty: null
      - id: minimum_netted_credits
        effect: method
        decides: netted_credits
        bindings: [returned_24, netted_credits]
        ladder:
          - when: "no returned payment in the last 24 months and a personal guarantee on file"
            method: "every fee reversal, fee waiver, dispute credit, tax credit and return credit posted since the statement is netted from its balance"
          - when: "no returned payment in the last 24 months and no personal guarantee on file"
            method: "only the fee reversals and fee waivers posted since the statement are netted"
          - when: "otherwise (a returned payment in the last 24 months)"
            method: "nothing is netted; the statement balance stands as printed"
        baseline:
          netted_credits: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard minimum-satisfying payment is the latest statement's printed minimum payment due plus that statement's past-due amount, less the payments credited since the statement date, never below zero, rounded to the nearest cent.
      params: [min_payment_pct_of_balance, min_payment_floor_usd]
    inputs:
      history:
        - {table: trade_transactions, aggregate: latest, field: statement_balance, filters: {event_type: trade_statement_issued}}
        - {table: trade_transactions, aggregate: sum, field: amount, filters: {event_type: trade_fee_reversed}}
        - {table: trade_transactions, aggregate: count, within_months: 12, filters: {event_type: trade_payment_received}}
        - {table: trade_transactions, aggregate: count, within_months: 24, filters: {event_type: trade_payment_returned}}
      cross_category: [pro]
