events:
  - type: special_order_placed
    target: special_orders
    mutation: create
    meaning: A special order for one vendor item is placed for the customer.
    grain: one row per special order (one vendor purchase order)
    fields:
      customer_id: The customer who placed the order.
      variant_name: Special order program, as its official full name.
      status: Set to placed on creation.
      order_number: Special order number.
      vendor_name: Vendor the item is ordered from.
      item_description: Item ordered, as on the vendor order.
      order_placed_at: Moment the order was placed.
      order_date: Date the order was placed.
      order_total: Price of the order before tax.
      pricing_basis: How the order was priced.
      pro_quote_id: ProBuild quote applied, when pricing_basis is pro_volume_quote.
      fulfillment_method: Store pickup or home delivery.
      delivery_address: Address for a home delivery.
      promised_ready_date: Ready date promised at order.
      estimated_ready_date: Vendor's current estimate of the ready date (equal to the promise at order).
      measured_by: Who took the measurements the order was made from.
      linked_install_contract_id: Installation contract the order supplies, when any.
    triggers:
      - event: special:special_order_billed
        map: {event_date: order_date, amount: order_total, order_number: order_number}
  - type: special_vendor_confirmed
    target: special_orders
    mutation: {transition: {from: placed, to: vendor_confirmed}}
    meaning: The vendor confirms the order.
    grain: one row per transaction
    fields:
      status: Set to vendor_confirmed.
      vendor_confirmed_date: Date the vendor confirmed.
    triggers: []
  - type: special_production_started
    target: special_orders
    mutation: {transition: {from: vendor_confirmed, to: in_production}}
    meaning: The vendor starts making the item.
    grain: one row per transaction
    fields:
      status: Set to in_production.
      production_started_date: Date production started.
    triggers: []
  - type: special_shipped
    target: special_orders
    mutation: {transition: [{from: vendor_confirmed, to: shipped}, {from: in_production, to: shipped}]}
    meaning: The vendor ships the item to the store or the customer.
    grain: one row per transaction
    fields:
      status: Set to shipped.
      shipped_date: Date shipped.
    triggers: []
  - type: special_ready
    target: special_orders
    mutation: {transition: {from: shipped, to: ready}}
    meaning: The item is received, inspected where required, and ready for pickup or delivery.
    grain: one row per transaction
    fields:
      status: Set to ready.
      ready_date: Date the item became ready.
    triggers: []
  - type: special_completed
    target: special_orders
    mutation: {transition: {from: ready, to: completed}}
    meaning: The customer picks the item up or it is delivered.
    grain: one row per transaction
    fields:
      status: Set to completed.
      completed_date: Date of pickup or delivery.
    triggers: []
  - type: special_cancelled
    target: special_orders
    mutation: {transition: [{from: placed, to: cancelled}, {from: vendor_confirmed, to: cancelled}, {from: in_production, to: cancelled}, {from: ready, to: cancelled}]}
    meaning: The order is cancelled by the customer, for lack of vendor confirmation or supply, or as abandoned.
    grain: one row per transaction
    fields:
      status: Set to cancelled.
      cancelled_date: Date the cancellation took effect.
      cancellation_reason: Why the order was cancelled.
    triggers:
      - event: special:special_credit_applied
        map: {credit_type: order_cancellation, event_date: cancelled_date}
  - type: special_returned
    target: special_orders
    mutation: {transition: {from: completed, to: returned}}
    meaning: A returnable item is returned by the customer.
    grain: one row per transaction
    fields:
      status: Set to returned.
      returned_date: Date of the return.
    triggers:
      - event: special:special_credit_applied
        map: {credit_type: merchandise_return, event_date: returned_date}
  - type: special_estimate_revised
    target: special_orders
    mutation: update
    meaning: The vendor revises the estimated ready date.
    grain: one row per transaction
    fields:
      estimated_ready_date: New estimated ready date.
    triggers: []
  - type: special_template_recorded
    target: special_orders
    mutation: update
    meaning: The installer's on-site template for a fabricated item is recorded.
    grain: one row per transaction
    fields:
      template_completed: Whether the template is complete.
    triggers: []
  - type: special_order_billed
    target: special_order_events
    meaning: The order total is billed when the order is placed.
    grain: one row per order
    distinguish_by: [order_number]
    fields:
      order_number: Special order number.
      event_date: Date billed (the order date).
      amount: Order total, positive.
    account: order_balance
    direction: in
    triggers:
      - event: special:special_payment_received
        map: {event_date: event_date, payment_purpose: deposit, order_number: order_number}
  - type: special_payment_received
    target: special_order_events
    meaning: The customer pays a deposit or balance on the order.
    grain: one row per payment
    distinguish_by: [event_date, payment_purpose, payment_method, amount]
    fields:
      order_number: Special order number.
      event_date: Date of the payment.
      amount: Amount paid, positive.
      payment_method: Tender used.
      payment_purpose: What the payment is for.
    account: order_balance
    direction: out
    triggers:
      - event: card:card_purchase_posted
        when: {payment_method: ridgeline_consumer_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number, purchase_channel: special_order}
      - event: trade:trade_invoice_posted
        when: {payment_method: ridgeline_pro_credit}
        map: {transaction_date: event_date, invoice_date: event_date, amount: amount, purchase_channel: special_order}
  - type: special_fee_charged
    target: special_order_events
    meaning: A cancellation, abandonment, restocking, storage, delivery, delivery reschedule or failed delivery fee is charged.
    grain: one row per fee type per date
    distinguish_by: [fee_type, event_date]
    fields:
      order_number: Special order number.
      event_date: Date charged.
      fee_type: Which fee is charged.
      amount: Fee amount, positive.
      storage_days: Days of storage billed (storage fee only).
      special_request_id: The request the fee arises from, when any.
    account: order_balance
    direction: in
    triggers: []
  - type: special_credit_applied
    target: special_order_events
    meaning: A credit reduces what the customer owes — reversal of the order total on cancellation or return, damage allowance, delay credit or price adjustment.
    grain: one row per credit type per order
    distinguish_by: [credit_type, event_date]
    fields:
      order_number: Special order number.
      event_date: Date the credit posts.
      credit_type: Which credit is applied.
      amount: Credit amount, positive.
      special_request_id: The request the credit arises from, when any.
    account: order_balance
    direction: out
    triggers: []
  - type: special_refund_issued
    target: special_order_events
    meaning: Money paid on the order is refunded to the tender it was paid with.
    grain: one row per refunded payment
    distinguish_by: [original_event_id]
    fields:
      order_number: Special order number.
      event_date: Date the refund is issued.
      amount: Amount refunded, positive.
      refund_method: Tender refunded to (the original payment's tender).
      original_event_id: The special_payment_received row refunded.
    account: order_balance
    direction: in
    triggers:
      - event: card:card_return_credit_posted
        when: {refund_method: ridgeline_consumer_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number}
      - event: trade:trade_return_credit_posted
        when: {refund_method: ridgeline_pro_credit}
        map: {transaction_date: event_date, amount: amount, merchant_reference: order_number}
  - type: special_receipt_inspected
    target: special_order_events
    meaning: The store, or the customer at pickup or delivery, records the condition of the item received.
    grain: one row per inspection point (store receipt or customer handover)
    distinguish_by: [inspection_point]
    fields:
      order_number: Special order number.
      event_date: Date of the inspection or of the customer's damage report.
      amount: 0.00 — an inspection moves no money.
      inspection_point: Where the condition was recorded.
      inspection_condition: Condition found.
      special_request_id: The customer's damage claim, for a handover report.
    triggers: []

measures:
  - id: special_msr_net_paid
    window: Life of the order up to the frozen date.
    measure: Sum of special_payment_received amounts on the order minus special_refund_issued amounts.
  - id: special_msr_delay_days
    window: State of the order at the frozen date.
    measure: Calendar days by which estimated_ready_date (or ready_date once ready) is later than promised_ready_date; 0 when not later.
  - id: special_msr_storage_days
    window: From the day after ready_date plus pickup_hold_days to the earlier of the pickup or delivery date and the frozen date.
    measure: Calendar days of storage beyond the free hold period, excluding days an item linked to an installation contract is held for its installation date when linked_install_storage_free is true.

policies:
  - id: special_agg_multi_holding
    subject: [special_order_placed]
    rule: >-
      A customer may hold any number of special orders; each special order is one vendor item ordered for one customer.
      An order total below the program's order_min_usd is not placed.
    eligibility: []
    params:
      max_per_customer: null

  - id: special_agg_install_link
    subject: [special_order_placed, special_cancelled, special_fee_charged]
    rule: >-
      A special order may be linked to an installation contract as its materials only where installation_linked_allowed is true, and only to a contract of the same customer whose job address matches the delivery address.
      Where pro_measure_required is true, the order may be placed only when the customer holds an installation contract for the item at that address whose status is measured, contracted or scheduled, so that a Ridgeline installer's measurements exist; such an order records measured_by ridgeline_installer.
      When a linked installation contract is cancelled, the linked special order is not cancelled with it: it follows this charter's own cancellation rules from its own status, and an order already in production or shipped is completed to the customer.
      Home delivery charges are not billed on an order linked to an installation contract, because the installer receives the item at the job.
    eligibility:
      - id: measured_install_exists
        applies_to: [special_order_placed]
        kind: state
        condition: Where pro_measure_required is true, the order may be placed only when the customer holds an installation contract for the item at that address whose status is measured, contracted or scheduled, so that a Ridgeline installer's measurements exist; such an order records measured_by ridgeline_installer.
        evidence_fields: [install_contracts.install_contract_id, install_contracts.status, install_contracts.job_address]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_contracts.install_contract_id]
          action_bindings:
            install_contracts.install_contract_id: linked_install_contract_id
        state_contract:
          field: install_contracts.status
          allowed: [measured, contracted, scheduled]

  - id: special_order_placement
    subject: [special_order_placed, special_order_billed, special_vendor_confirmed, special_production_started, special_shipped, special_template_recorded]
    rule: >-
      An order is placed for one vendor item at its quoted price; it is priced under a ProBuild volume pricing quote (pricing_basis pro_volume_quote with the pro_quote_id) only where pro_volume_quote_eligible is true, and otherwise at shelf_price.
      The promised_ready_date is the order_date plus lead_time_days_quoted calendar days and never moves; vendor revisions change only estimated_ready_date.
      The order total is billed on the order date, and the deposit under special_payments is taken at the same time.
      The vendor must confirm within vendor_confirmation_days days of the order date, failing which the order is cancelled with cancellation_reason vendor_unconfirmed and every payment is refunded.
      Where template_visit_required is true, production may start only after template_completed is true.
      A catalog item ships from vendor stock after confirmation and a made-to-order item ships after production; the vendor may ship part of an order ahead of the rest only where partial_shipment_allowed is true, and the order becomes ready only when every part has been received.
      An order may be changed without cancelling within order_modification_hours hours after order_placed_at and only while its status is placed; any later change is a cancellation under special_cancellation followed by a new order.
      An item remade because a Ridgeline installer's measurement was wrong is a new order with pricing_basis remake_no_charge and order_total 0.00, where ridgeline_measure_guarantee is true; an item made from the customer's own measurements is never remade at no charge.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Cut-to-Order Flooring: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Windows and Exterior Doors: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Semi-Custom Cabinetry: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}
        Ridgeline Special Order Fabricated Countertops: {lead_time_days_quoted: "=lead_time_days_quoted", order_modification_hours: "=order_modification_hours"}

  - id: special_payments
    subject: [special_payment_received]
    rule: >-
      The deposit due at order is the greater of deposit_min_usd and deposit_pct percent of the order total, never more than the order total; the remaining balance is due before the item is released for pickup or delivery.
      Payments are accepted on orders whose status is placed, vendor_confirmed, in_production, shipped or ready.
      The tender must be one of payment_methods_accepted; a payment charged to a Ridgeline Consumer Credit account posts as a purchase on that account and one charged to a Ridgeline Pro Credit account posts as an invoice.
      A payment may not exceed the order's balance_due.
    eligibility:
      - id: payable_status
        applies_to: [special_payment_received]
        kind: state
        condition: Payments are accepted on orders whose status is placed, vendor_confirmed, in_production, shipped or ready.
        evidence_fields: [special_orders.special_order_id, special_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        state_contract:
          field: special_orders.status
          allowed: [placed, vendor_confirmed, in_production, shipped, ready]
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
        Ridgeline Special Order Fabricated Countertops: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd"}
    formula:
      deposit_due: min(order_total, max(deposit_min_usd, round(order_total * deposit_pct / 100, 2)))

  - id: special_cancellation
    subject: [special_cancelled, special_fee_charged, special_credit_applied]
    rule: >-
      The customer may cancel an order whose status is placed or vendor_confirmed, by their own confirmation recorded first as a special_requests record of request_type cancellation; once production has started or the item has shipped the customer may not cancel when cancellable_after_production is false, except under special_vendor_delay.
      A cancellation made within free_cancellation_hours hours after order_placed_at (full 60-minute periods counted from the moment the order was placed; a cancellation at exactly that many hours still qualifies) carries no fee.
      A later cancellation carries a fee of cancellation_fee_pct_before_production percent of the order total, never less than cancellation_fee_min_usd, posted as fee_type cancellation_fee.
      No fee applies when vendor_change_free_cancel is true and the vendor changed the price, specification or lead time after the order, or when the cancellation is made by the system for lack of vendor confirmation or supply.
      On every cancellation the order total is reversed by a special_credit_applied row with credit_type order_cancellation, and special_msr_net_paid less the fee is refunded under special_refunds.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
        Ridgeline Special Order Fabricated Countertops: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct_before_production: "=cancellation_fee_pct_before_production", cancellation_fee_min_usd: "=cancellation_fee_min_usd"}
    formula:
      cancellation_fee: max(cancellation_fee_min_usd, round(order_total * cancellation_fee_pct_before_production / 100, 2))
      refund_due: max(0, special_msr_net_paid - cancellation_fee)
    measures: [special_msr_net_paid]

  - id: special_vendor_delay
    subject: [special_estimate_revised, special_cancelled, special_credit_applied]
    rule: >-
      When special_msr_delay_days is above vendor_delay_threshold_days, the customer may choose one delay remedy, never both.
      The first remedy is to cancel with no cancellation fee, from status placed or vendor_confirmed, and from in_production as well where delay_cancellation_in_production_allowed is true; the cancellation_reason is vendor_delay and every payment is refunded.
      The second remedy is to keep the order and receive a delay credit of delay_credit_pct percent of the order total, capped at delay_credit_max_usd, posted once as credit_type delay_credit; a program whose delay_credit_pct is 0 offers no delay credit.
      A customer who took the delay credit may not later cancel fee-free for the same delay, and a delay caused by the customer's own change to the order earns no remedy.
      An order already shipped earns only the delay credit.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
        Ridgeline Special Order Fabricated Countertops: {vendor_delay_threshold_days: "=vendor_delay_threshold_days", delay_credit_pct: "=delay_credit_pct", delay_credit_max_usd: "=delay_credit_max_usd"}
    formula:
      delay_credit: min(delay_credit_max_usd, round(order_total * delay_credit_pct / 100, 2))
    measures: [special_msr_delay_days]

  - id: special_receipt_and_damage
    subject: [special_receipt_inspected, special_ready, special_credit_applied]
    rule: >-
      Where receipt_inspection_required is true the store inspects the item within receipt_inspection_days days of arrival and makes it ready only when the condition is good; an item found damaged or wrong at store receipt is reordered from the vendor at no charge and the estimated ready date is revised.
      Shipping damage found by the customer is covered only when it is reported within damage_report_hours hours after pickup or delivery, recorded as a special_receipt_inspected row at inspection_point customer_handover.
      Hours are counted as full 60-minute periods from the start of the completed_date (00:00 store local time) to the report; a report at exactly that many hours qualifies.
      For covered damage the customer chooses one remedy: a free reorder when reorder_for_damaged_free is true, with a new promised date reorder_lead_days_if_damaged days after the report, or, for cosmetic damage only and where damage_allowance_pct is above 0, keeping the item with an allowance of damage_allowance_pct percent of the order total as credit_type damage_allowance.
      Damage reported later, or caused after handover, is not covered.
    eligibility:
      - id: reported_in_time
        applies_to: [special_credit_applied]
        kind: time
        condition: Shipping damage found by the customer is covered only when it is reported within damage_report_hours hours after pickup or delivery, recorded as a special_receipt_inspected row at inspection_point customer_handover.
        evidence_fields: [special_orders.special_order_id, special_orders.completed_date, special_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: pickup or delivery
          anchor_source: special_orders.completed_date
          relation: not_after
          duration_source: variants.damage_report_hours
          unit: elapsed_hours
          counting_rule: Hours are counted as full 60-minute periods from the start of the completed_date (00:00 store local time) to the report; a report at exactly that many hours qualifies.
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Cut-to-Order Flooring: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Windows and Exterior Doors: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Semi-Custom Cabinetry: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
        Ridgeline Special Order Fabricated Countertops: {damage_report_hours: "=damage_report_hours", damage_allowance_pct: "=damage_allowance_pct"}
    formula:
      damage_allowance: round(order_total * damage_allowance_pct / 100, 2)

  - id: special_pickup_storage_abandonment
    subject: [special_completed, special_fee_charged, special_cancelled]
    rule: >-
      A ready item is held free for pickup_hold_days days after ready_date; after that, where storage_fee_per_day_usd is above 0.00, storage is charged per day for special_msr_storage_days, never more than storage_fee_cap_usd in total, as fee_type storage_fee billed when the item leaves the store.
      An item linked to an installation contract is stored free until its installation date where linked_install_storage_free is true.
      The item is released only when balance_due, including storage, is 0.00.
      An item neither picked up nor delivered abandonment_days days after ready_date is treated as abandoned: the order is cancelled with cancellation_reason abandoned and an abandonment fee of abandonment_fee_pct percent of the order total is charged; the payments less the fee and any storage are refunded.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Cut-to-Order Flooring: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Windows and Exterior Doors: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Semi-Custom Cabinetry: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
        Ridgeline Special Order Fabricated Countertops: {pickup_hold_days: "=pickup_hold_days", storage_fee_per_day_usd: "=storage_fee_per_day_usd", abandonment_days: "=abandonment_days", abandonment_fee_pct: "=abandonment_fee_pct"}
    formula:
      storage_fee: min(storage_fee_cap_usd, special_msr_storage_days * storage_fee_per_day_usd)
    measures: [special_msr_storage_days]

  - id: special_delivery
    subject: [special_fee_charged]
    rule: >-
      Home delivery is offered only where home_delivery_available is true; its charge is home_delivery_fee_usd, free when free_delivery_threshold_usd is above 0.00 and the order total is at or above it, billed as fee_type home_delivery_fee before release.
      A delivery may be moved free when the request is made at least delivery_reschedule_notice_hours hours before the delivery window; a later move incurs delivery_reschedule_fee_usd.
      A delivery that cannot be completed because no one is at the address incurs failed_delivery_fee_usd and is rebooked.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Cut-to-Order Flooring: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Windows and Exterior Doors: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Semi-Custom Cabinetry: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}
        Ridgeline Special Order Fabricated Countertops: {home_delivery_fee_usd: "=home_delivery_fee_usd", delivery_reschedule_fee_usd: "=delivery_reschedule_fee_usd", failed_delivery_fee_usd: "=failed_delivery_fee_usd"}

  - id: special_returns
    subject: [special_returned, special_fee_charged, special_credit_applied]
    rule: >-
      Only an item whose program has returnable true may be returned; made-to-measure, cut-to-order, custom-built and fabricated items are never returnable except as damaged or wrong under special_receipt_and_damage.
      The return must be made no later than return_window_days calendar days after pickup or delivery.
      Days are counted as calendar days from completed_date as day 0 to the return date; a return on the last day qualifies.
      Where return_requires_original_packaging is true the item must be unused in its original packaging.
      A restocking fee of restocking_fee_pct percent of the order total, never less than restocking_fee_min_usd, is charged as fee_type restocking_fee, except when restocking_fee_waived_if_defective is true and the item is returned as defective or wrong, and except where pro_restocking_waiver_eligible is true and the customer's ProBuild membership is active at a tier whose special_order_restocking_waived is true.
      The order total is reversed as credit_type merchandise_return and the payments less the restocking fee are refunded under special_refunds; the return takes effect on the customer's own confirmation.
    eligibility:
      - id: in_return_window
        applies_to: [special_returned]
        kind: time
        condition: The return must be made no later than return_window_days calendar days after pickup or delivery.
        evidence_fields: [special_orders.special_order_id, special_orders.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: pickup or delivery
          anchor_source: special_orders.completed_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from completed_date as day 0 to the return date; a return on the last day qualifies.
          boundary: inclusive
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Cut-to-Order Flooring: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Windows and Exterior Doors: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Semi-Custom Cabinetry: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
        Ridgeline Special Order Fabricated Countertops: {returnable: "=returnable", return_window_days: "=return_window_days", restocking_fee_pct: "=restocking_fee_pct"}
    formula:
      restocking_fee: max(restocking_fee_min_usd, round(order_total * restocking_fee_pct / 100, 2))

  - id: special_price_protection
    subject: [special_credit_applied]
    rule: >-
      Where price_protection_days is above 0, a lower vendor price on the same item offered by Ridgeline within price_protection_days calendar days after the order date is credited as the difference, once, as credit_type price_adjustment, provided the order has not been cancelled or returned; the customer must ask for it, and an order priced under a ProBuild volume quote earns no price adjustment.
    eligibility: []
    params:
      per_tier:
        Ridgeline Special Order Catalog Merchandise: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Cut-to-Order Flooring: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Made-to-Measure Window Coverings: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Windows and Exterior Doors: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Semi-Custom Cabinetry: {price_protection_days: "=price_protection_days"}
        Ridgeline Special Order Fabricated Countertops: {price_protection_days: "=price_protection_days"}

  - id: special_refunds
    subject: [special_refund_issued]
    rule: >-
      Every refund goes back to the tender of the payment it refunds and references that special_payment_received row in original_event_id; a refund never exceeds the payment it references, and when a refund spans several payments the most recent are refunded first.
      Refunds are issued only on orders whose status is cancelled, returned or completed.
      A payment row is refunded at most once.
    eligibility:
      - id: refundable_status
        applies_to: [special_refund_issued]
        kind: state
        condition: Refunds are issued only on orders whose status is cancelled, returned or completed.
        evidence_fields: [special_orders.special_order_id, special_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_orders.special_order_id]
          action_bindings:
            special_orders.special_order_id: special_order_id
        state_contract:
          field: special_orders.status
          allowed: [cancelled, returned, completed]
      - id: refund_once
        applies_to: [special_refund_issued]
        kind: dedup
        condition: A payment row is refunded at most once.
        evidence_fields: [special_order_events.original_event_id, special_order_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [special_order_events.original_event_id]
          action_bindings:
            special_order_events.original_event_id: original_event_id
        dedup_contract:
          table: special_order_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [special_refund_issued]}
          distinct_fields: []

extended_policies:
  - id: special_ext_prepaid_delivery_charge
    base_policy_refs: [special_agg_install_link, special_cancellation, special_pickup_storage_abandonment, special_delivery, special_returns]
    overwrite:
      - base_policy: special_delivery
        superseded_clause: >-
          its charge is home_delivery_fee_usd, free when free_delivery_threshold_usd is above 0.00 and the order total is at or above it, billed as fee_type home_delivery_fee before release.
        replaced_by: >-
          For a delivered order the charge is worked out as follows, and the result replaces the flat program charge for that delivery.
    trigger: state_due
    subject: [special_fee_charged]
    computes: delivery_charge
    target_tool: bill_prepaid_delivery_3669e7a4
    params:
      load_multiple: 10
      load_step_usd: 1000.00
      load_surcharge_usd: 15.00
      small_multiple: 3
      small_order_pct: 8
      functional_share: 0
      cosmetic_share: 0.5
      late_share_long: 0.6
      late_share_short: 0.8
      busy_lines: 3
      busy_member_pct: 50
      light_member_pct: 10
      crew_site_share: 0.75
      surveyed_site_share: 0.9
    rule: >-
      This policy covers the home delivery charge on an order in a program whose deposit_pct is 100 (paid in full when the order is placed) that Ridgeline has delivered to the customer's address.
      The standard home delivery charge is the program's home_delivery_fee_usd, billed once on the order as fee_type home_delivery_fee.
      The charge is 0.00 when free_delivery_threshold_usd is above 0.00 and the order total billed is at or above it, and no home delivery charge is billed on an order linked to an installation contract.
      For a delivered order the charge is worked out as follows, and the result replaces the flat program charge for that delivery.
      The base delivery charge depends on the order total billed on the order: an order whose billed total is at least load_multiple times the program's order_min_usd is charged the program's home_delivery_fee_usd plus load_surcharge_usd for every full load_step_usd of billed total above load_multiple times order_min_usd; an order whose billed total is below small_multiple times order_min_usd is charged small_order_pct percent of the billed total, rounded to the cent and never more than home_delivery_fee_usd; any other order is charged home_delivery_fee_usd.
      The handover share depends on the condition recorded at the customer handover: where a customer handover inspection on the order recorded damaged_functional or wrong_item the handover share is functional_share; where the customer handover inspections recorded damaged_cosmetic and neither damaged_functional nor wrong_item, the handover share is cosmetic_share; otherwise the handover share is 1.
      The lateness share depends on the calendar days by which ready_date is later than promised_ready_date: more than twice vendor_delay_threshold_days gives late_share_long; more than vendor_delay_threshold_days but not more than twice vendor_delay_threshold_days gives late_share_short; otherwise the lateness share is 1.
      The member delivery discount depends on the customer's Ridgeline ProBuild Rewards membership: an active membership with at least busy_lines spend lines posted from special orders in the last 12 months gives busy_member_pct; an active membership with fewer than busy_lines such lines gives light_member_pct; otherwise the member delivery discount is 0 percent.
      The job-site share depends on the customer's Ridgeline installation contract whose job address is the delivery address: a contract there whose status is scheduled or in_progress gives crew_site_share; a contract there whose status is measured or contracted gives surveyed_site_share; otherwise the job-site share is 1.
      The charge billed is the base delivery charge multiplied by the handover share, by the lateness share, by the job-site share and by one minus the member delivery discount divided by 100, all four applied to the base delivery charge in a single product that is rounded once, to the nearest cent.
    prerequisite: []
    cross_category:
      - category: pro
        as: history
        reads: [status, pro_activity.event_type, pro_activity.purchase_channel, pro_activity.activity_date]
        note: The member delivery discount tier is decided from the ProBuild membership status and its special-order spend lines in the last 12 months.
      - category: install
        as: branch
        reads: [status, job_address]
        note: The job-site share is decided from the status of the customer's installation contract at the delivery address.
    compute:
      - billed_total: "SUM('special_order_events', 'amount', event_type='special_order_billed')"
      - std_fee: "P('home_delivery_fee_usd')"
      - base_charge: "(std_fee + K('load_surcharge_usd') * int((billed_total - K('load_multiple') * P('order_min_usd')) / K('load_step_usd'))) if billed_total >= K('load_multiple') * P('order_min_usd') else (MN(std_fee, RND(billed_total * K('small_order_pct') / 100, 2)) if billed_total < K('small_multiple') * P('order_min_usd') else std_fee)"
      - handover_bad: "COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='customer_handover', inspection_condition='damaged_functional') + COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='customer_handover', inspection_condition='wrong_item')"
      - handover_cosmetic: "COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='customer_handover', inspection_condition='damaged_cosmetic')"
      - handover_share: "K('functional_share') if handover_bad > 0 else (K('cosmetic_share') if handover_cosmetic > 0 else 1)"
      - late_days: "DAYS(F('promised_ready_date'), F('ready_date'))"
      - late_share: "K('late_share_long') if late_days > 2 * P('vendor_delay_threshold_days') else (K('late_share_short') if late_days > P('vendor_delay_threshold_days') else 1)"
      - member_status: "CFIELD('pro', 'status')"
      - member_lines: "XCOUNT('pro', 'pro_activity', within_months=12, date_field='activity_date', event_type='pro_spend_posted', purchase_channel='special_order')"
      - member_discount: "K('busy_member_pct') if (member_status == 'active' and member_lines >= K('busy_lines')) else (K('light_member_pct') if (member_status == 'active' and member_lines < K('busy_lines')) else 0)"
      - site_status: "CFIELD('install', 'status', job_address=F('delivery_address'))"
      - site_share: "K('crew_site_share') if (site_status == 'scheduled' or site_status == 'in_progress') else (K('surveyed_site_share') if (site_status == 'measured' or site_status == 'contracted') else 1)"
      - no_charge: "1 if (F('linked_install_contract_id') or (P('free_delivery_threshold_usd') > 0 and billed_total >= P('free_delivery_threshold_usd'))) else 0"
      - result: "0 if no_charge == 1 else RND(base_charge * handover_share * late_share * site_share * (1 - member_discount / 100), 2)"
    compute_basis:
      billed_total: "The base delivery charge depends on the order total billed on the order"
      std_fee: "The standard home delivery charge is the program's home_delivery_fee_usd, billed once on the order as fee_type home_delivery_fee."
      base_charge: "an order whose billed total is at least load_multiple times the program's order_min_usd is charged the program's home_delivery_fee_usd plus load_surcharge_usd for every full load_step_usd of billed total above load_multiple times order_min_usd; an order whose billed total is below small_multiple times order_min_usd is charged small_order_pct percent of the billed total, rounded to the cent and never more than home_delivery_fee_usd; any other order is charged home_delivery_fee_usd."
      handover_bad: "where a customer handover inspection on the order recorded damaged_functional or wrong_item the handover share is functional_share"
      handover_cosmetic: "where the customer handover inspections recorded damaged_cosmetic and neither damaged_functional nor wrong_item, the handover share is cosmetic_share"
      handover_share: "The handover share depends on the condition recorded at the customer handover: where a customer handover inspection on the order recorded damaged_functional or wrong_item the handover share is functional_share; where the customer handover inspections recorded damaged_cosmetic and neither damaged_functional nor wrong_item, the handover share is cosmetic_share; otherwise the handover share is 1."
      late_days: "The lateness share depends on the calendar days by which ready_date is later than promised_ready_date"
      late_share: "more than twice vendor_delay_threshold_days gives late_share_long; more than vendor_delay_threshold_days but not more than twice vendor_delay_threshold_days gives late_share_short; otherwise the lateness share is 1."
      member_status: "The member delivery discount depends on the customer's Ridgeline ProBuild Rewards membership"
      member_lines: "an active membership with at least busy_lines spend lines posted from special orders in the last 12 months"
      member_discount: "an active membership with at least busy_lines spend lines posted from special orders in the last 12 months gives busy_member_pct; an active membership with fewer than busy_lines such lines gives light_member_pct; otherwise the member delivery discount is 0 percent."
      site_status: "The job-site share depends on the customer's Ridgeline installation contract whose job address is the delivery address"
      site_share: "a contract there whose status is scheduled or in_progress gives crew_site_share; a contract there whose status is measured or contracted gives surveyed_site_share; otherwise the job-site share is 1."
      no_charge: "The charge is 0.00 when free_delivery_threshold_usd is above 0.00 and the order total billed is at or above it, and no home delivery charge is billed on an order linked to an installation contract."
      result: "The charge billed is the base delivery charge multiplied by the handover share, by the lateness share, by the job-site share and by one minus the member delivery discount divided by 100, all four applied to the base delivery charge in a single product that is rounded once, to the nearest cent."
    factors:
      - id: order_size_basis
        effect: method
        decides: base_charge
        bindings: [billed_total, base_charge]
        ladder:
          - when: "the billed order total is at least load_multiple times the program's order_min_usd"
            method: "the program's home_delivery_fee_usd plus load_surcharge_usd for every full load_step_usd of billed total above that mark"
          - when: "the billed order total is below small_multiple times the program's order_min_usd"
            method: "small_order_pct percent of the billed total, rounded to the cent, never more than home_delivery_fee_usd"
          - when: "otherwise"
            method: "the flat home_delivery_fee_usd"
        baseline:
          base_charge: "std_fee"
        evidence: [history]
        cross_difficulty: null
      - id: handover_condition_share
        effect: parameter
        decides: handover_share
        bindings: [handover_bad, handover_cosmetic, handover_share]
        ladder:
          - when: "a customer handover inspection recorded damaged_functional or wrong_item"
            value: "K('functional_share')"
          - when: "the customer handover inspections recorded damaged_cosmetic and neither damaged_functional nor wrong_item"
            value: "K('cosmetic_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          handover_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: vendor_lateness_share
        effect: parameter
        decides: late_share
        bindings: [late_days, late_share]
        ladder:
          - when: "ready_date is more than twice vendor_delay_threshold_days later than promised_ready_date"
            value: "K('late_share_long')"
          - when: "ready_date is more than vendor_delay_threshold_days but not more than twice vendor_delay_threshold_days later than promised_ready_date"
            value: "K('late_share_short')"
          - when: "otherwise"
            value: "1"
        baseline:
          late_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: probuild_delivery_discount
        effect: parameter
        decides: member_discount
        bindings: [member_status, member_lines, member_discount]
        ladder:
          - when: "the ProBuild membership is active and at least busy_lines special-order spend lines were posted in the last 12 months"
            value: "K('busy_member_pct')"
          - when: "the ProBuild membership is active and fewer than busy_lines special-order spend lines were posted in the last 12 months"
            value: "K('light_member_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          member_discount: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: job_site_share
        effect: parameter
        decides: site_share
        bindings: [site_status, site_share]
        ladder:
          - when: "the customer's installation contract at the delivery address is scheduled or in_progress"
            value: "K('crew_site_share')"
          - when: "the customer's installation contract at the delivery address is measured or contracted"
            value: "K('surveyed_site_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          site_share: "1"
        evidence: [cross_category]
        cross_difficulty: install
    baseline:
      rule: >-
        The standard home delivery charge is the program's home_delivery_fee_usd, billed once on the order as fee_type home_delivery_fee.
        The charge is 0.00 when free_delivery_threshold_usd is above 0.00 and the order total billed is at or above it, and no home delivery charge is billed on an order linked to an installation contract.
      params: [home_delivery_fee_usd, free_delivery_threshold_usd]
    inputs:
      history:
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_order_billed}}
        - {table: special_order_events, aggregate: count, field: special_order_event_id, filters: {event_type: special_receipt_inspected, inspection_point: customer_handover, inspection_condition: damaged_cosmetic}}
        - {category: pro, table: pro_activity, aggregate: count, field: pro_activity_id, within_months: 12, filters: {event_type: pro_spend_posted, purchase_channel: special_order}}
      cross_category: [pro, install]
  - id: special_ext_prepaid_damage_allowance
    base_policy_refs: [special_cancellation, special_vendor_delay, special_receipt_and_damage, special_returns, special_price_protection]
    overwrite:
      - base_policy: special_receipt_and_damage
        superseded_clause: >-
          keeping the item with an allowance of damage_allowance_pct percent of the order total as credit_type damage_allowance.
        replaced_by: >-
          Where the rules below apply, the allowance is worked out as follows instead of the standard allowance.
    trigger: on_request
    subject: [special_credit_applied]
    computes: allowance_amount
    target_tool: accept_damage_allowance_e64dc664
    params:
      gold_spend_usd: 25000.00
      silver_spend_usd: 10000.00
      top_member_rate: 13
      mid_member_rate: 11.5
      same_day_bonus: 1.5
      next_day_bonus: 0.75
      long_account_months: 60
      long_account_bonus: 1
      new_account_bonus: 0.5
      truck_damage_mult: 1.2
      unchecked_damage_mult: 1.1
      long_wait_days: 14
      short_wait_days: 7
      long_wait_mult: 1.1
      short_wait_mult: 1.05
      late_goodwill_usd: 25.00
    rule: >-
      This policy covers the damage allowance on an order in a program whose deposit_pct is 100 (paid in full when the order is placed) when covered cosmetic damage was reported at the customer handover and the customer chooses to keep the item, booked once as credit_type damage_allowance against that damage claim.
      The allowance on a delivered order is fixed only after the home delivery charge owed for that delivery stands on the order as a fee line.
      The standard allowance is damage_allowance_pct percent of the delivered price, where the delivered price is the order total billed plus every home delivery fee billed on the order, rounded to the nearest cent.
      Where the rules below apply, the allowance is worked out as follows instead of the standard allowance.
      The allowance rate, in percent, is the member rate plus the report bonus plus the credit-account bonus.
      The member rate depends on the customer's Ridgeline ProBuild Rewards membership: an active membership whose qualifying spend this program year is at least gold_spend_usd gives top_member_rate; an active membership whose qualifying spend this program year is at least silver_spend_usd but below gold_spend_usd gives mid_member_rate; otherwise the member rate is damage_allowance_pct.
      The report bonus depends on the day the damage claim was registered, counted in calendar days from completed_date: a claim registered on completed_date itself gives same_day_bonus; a claim registered on the next calendar day gives next_day_bonus; otherwise the report bonus is 0.
      The credit-account bonus depends on the customer's Ridgeline Pro Credit account: an active account opened at least long_account_months whole months before today gives long_account_bonus; an active account opened fewer than long_account_months whole months before today gives new_account_bonus; otherwise the credit-account bonus is 0.
      The delivery-damage multiplier depends on where the damage arose: an order delivered to the customer's address whose store receipt inspection recorded good gives truck_damage_mult; an order delivered to the customer's address with no store receipt inspection on record gives unchecked_damage_mult; otherwise the delivery-damage multiplier is 1.
      The store-wait multiplier depends on the calendar days from ready_date to completed_date: more than long_wait_days gives long_wait_mult; more than short_wait_days but not more than long_wait_days gives short_wait_mult; otherwise the store-wait multiplier is 1.
      First the delivered price is multiplied by the allowance rate divided by 100, by the delivery-damage multiplier and by the store-wait multiplier, in one product, and that product is rounded to the nearest cent.
      That rounded amount is then adjusted for the vendor's lateness, measured as the calendar days by which ready_date is later than promised_ready_date: when the lateness is more than twice vendor_delay_threshold_days the amount is increased by half of itself and rounded to the nearest cent; when it is more than vendor_delay_threshold_days but not more than twice vendor_delay_threshold_days a flat late_goodwill_usd is added to it; otherwise the amount is left as it is.
      The adjusted amount is the allowance booked.
    prerequisite:
      - problem: special_ext_prepaid_delivery_charge
        kind: value_input
        gate: delivery_billed
        form: state
        policy_source: >-
          The allowance on a delivered order is fixed only after the home delivery charge owed for that delivery stands on the order as a fee line.
        condition: >-
          A special_fee_charged line with fee_type home_delivery_fee stands on the delivered order, so the delivered price includes the delivery charge.
        resolved_by: bill_prepaid_delivery_3669e7a4
        effect: >-
          Once the home delivery fee line is booked, delivery_billed rises from 0.00 to the delivery charge, so the delivered price and every figure computed on it rise with it.
    cross_category:
      - category: pro
        as: branch
        reads: [status, qualifying_spend_ytd]
        note: The member rate tier is decided from the ProBuild membership status and its qualifying spend this program year.
      - category: trade
        as: branch
        reads: [status, opened_date]
        note: The credit-account bonus tier is decided from the Pro Credit account status and the months since it was opened.
    compute:
      - billed_total: "SUM('special_order_events', 'amount', event_type='special_order_billed')"
      - delivery_billed: "SUM('special_order_events', 'amount', event_type='special_fee_charged', fee_type='home_delivery_fee')"
      - delivered_price: "billed_total + delivery_billed"
      - member_status: "CFIELD('pro', 'status')"
      - member_spend: "CFIELD('pro', 'qualifying_spend_ytd')"
      - member_rate: "K('top_member_rate') if (member_status == 'active' and member_spend >= K('gold_spend_usd')) else (K('mid_member_rate') if (member_status == 'active' and member_spend >= K('silver_spend_usd')) else P('damage_allowance_pct'))"
      - claim_created: "LATEST('special_requests', 'created_at', date_field='created_at', request_type='damage_claim')"
      - report_lag: "DAYS(F('completed_date'), claim_created)"
      - report_bonus: "K('same_day_bonus') if report_lag == 0 else (K('next_day_bonus') if report_lag == 1 else 0)"
      - account_status: "CFIELD('trade', 'status')"
      - account_opened: "CFIELD('trade', 'opened_date')"
      - account_bonus: "K('long_account_bonus') if (account_status == 'active' and MONTHS(account_opened, NOW) >= K('long_account_months')) else (K('new_account_bonus') if (account_status == 'active' and MONTHS(account_opened, NOW) < K('long_account_months')) else 0)"
      - allowance_rate: "member_rate + report_bonus + account_bonus"
      - receipt_good: "COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='store_receipt', inspection_condition='good')"
      - receipt_any: "COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='store_receipt')"
      - damage_mult: "K('truck_damage_mult') if (F('fulfillment_method') == 'home_delivery' and receipt_good > 0) else (K('unchecked_damage_mult') if (F('fulfillment_method') == 'home_delivery' and receipt_any == 0) else 1)"
      - wait_days: "DAYS(F('ready_date'), F('completed_date'))"
      - wait_mult: "K('long_wait_mult') if wait_days > K('long_wait_days') else (K('short_wait_mult') if wait_days > K('short_wait_days') else 1)"
      - core_amount: "RND(delivered_price * allowance_rate / 100 * damage_mult * wait_mult, 2)"
      - late_days: "DAYS(F('promised_ready_date'), F('ready_date'))"
      - adjusted_amount: "RND(core_amount * 1.5, 2) if late_days > 2 * P('vendor_delay_threshold_days') else (RND(core_amount + K('late_goodwill_usd'), 2) if late_days > P('vendor_delay_threshold_days') else core_amount)"
      - result: "adjusted_amount"
    compute_basis:
      billed_total: "the delivered price is the order total billed plus every home delivery fee billed on the order"
      delivery_billed: "the delivered price is the order total billed plus every home delivery fee billed on the order"
      member_status: "The member rate depends on the customer's Ridgeline ProBuild Rewards membership"
      member_spend: "an active membership whose qualifying spend this program year is at least gold_spend_usd gives top_member_rate"
      member_rate: "an active membership whose qualifying spend this program year is at least gold_spend_usd gives top_member_rate; an active membership whose qualifying spend this program year is at least silver_spend_usd but below gold_spend_usd gives mid_member_rate; otherwise the member rate is damage_allowance_pct."
      claim_created: "The report bonus depends on the day the damage claim was registered, counted in calendar days from completed_date"
      report_lag: "The report bonus depends on the day the damage claim was registered, counted in calendar days from completed_date"
      report_bonus: "a claim registered on completed_date itself gives same_day_bonus; a claim registered on the next calendar day gives next_day_bonus; otherwise the report bonus is 0."
      account_status: "The credit-account bonus depends on the customer's Ridgeline Pro Credit account"
      account_opened: "an active account opened at least long_account_months whole months before today gives long_account_bonus"
      account_bonus: "an active account opened at least long_account_months whole months before today gives long_account_bonus; an active account opened fewer than long_account_months whole months before today gives new_account_bonus; otherwise the credit-account bonus is 0."
      allowance_rate: "The allowance rate, in percent, is the member rate plus the report bonus plus the credit-account bonus."
      receipt_good: "an order delivered to the customer's address whose store receipt inspection recorded good gives truck_damage_mult"
      receipt_any: "an order delivered to the customer's address with no store receipt inspection on record gives unchecked_damage_mult"
      damage_mult: "The delivery-damage multiplier depends on where the damage arose: an order delivered to the customer's address whose store receipt inspection recorded good gives truck_damage_mult; an order delivered to the customer's address with no store receipt inspection on record gives unchecked_damage_mult; otherwise the delivery-damage multiplier is 1."
      wait_days: "The store-wait multiplier depends on the calendar days from ready_date to completed_date"
      wait_mult: "more than long_wait_days gives long_wait_mult; more than short_wait_days but not more than long_wait_days gives short_wait_mult; otherwise the store-wait multiplier is 1."
      core_amount: "First the delivered price is multiplied by the allowance rate divided by 100, by the delivery-damage multiplier and by the store-wait multiplier, in one product, and that product is rounded to the nearest cent."
      late_days: "That rounded amount is then adjusted for the vendor's lateness, measured as the calendar days by which ready_date is later than promised_ready_date"
      adjusted_amount: "when the lateness is more than twice vendor_delay_threshold_days the amount is increased by half of itself and rounded to the nearest cent; when it is more than vendor_delay_threshold_days but not more than twice vendor_delay_threshold_days a flat late_goodwill_usd is added to it; otherwise the amount is left as it is."
      result: "The adjusted amount is the allowance booked."
    factors:
      - id: probuild_member_rate
        effect: parameter
        decides: member_rate
        bindings: [member_status, member_spend, member_rate]
        ladder:
          - when: "the ProBuild membership is active and its qualifying spend this program year is at least gold_spend_usd"
            value: "K('top_member_rate')"
          - when: "the ProBuild membership is active and its qualifying spend this program year is at least silver_spend_usd but below gold_spend_usd"
            value: "K('mid_member_rate')"
          - when: "otherwise"
            value: "P('damage_allowance_pct')"
        baseline:
          member_rate: "P('damage_allowance_pct')"
        evidence: [cross_category]
        cross_difficulty: null
      - id: report_day_bonus
        effect: parameter
        decides: report_bonus
        bindings: [claim_created, report_lag, report_bonus]
        ladder:
          - when: "the damage claim was registered on completed_date"
            value: "K('same_day_bonus')"
          - when: "the damage claim was registered on the calendar day after completed_date"
            value: "K('next_day_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          report_bonus: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: credit_account_bonus
        effect: parameter
        decides: account_bonus
        bindings: [account_status, account_opened, account_bonus]
        ladder:
          - when: "the Pro Credit account is active and was opened at least long_account_months whole months before today"
            value: "K('long_account_bonus')"
          - when: "the Pro Credit account is active and was opened fewer than long_account_months whole months before today"
            value: "K('new_account_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          account_bonus: "0"
        evidence: [cross_category, date]
        cross_difficulty: trade
      - id: delivery_damage_multiplier
        effect: parameter
        decides: damage_mult
        bindings: [receipt_good, receipt_any, damage_mult]
        ladder:
          - when: "the order was delivered to the customer's address and its store receipt inspection recorded good"
            value: "K('truck_damage_mult')"
          - when: "the order was delivered to the customer's address and no store receipt inspection is on record"
            value: "K('unchecked_damage_mult')"
          - when: "otherwise"
            value: "1"
        baseline:
          damage_mult: "1"
        evidence: [history]
        cross_difficulty: null
      - id: store_wait_multiplier
        effect: parameter
        decides: wait_mult
        bindings: [wait_days, wait_mult]
        ladder:
          - when: "more than long_wait_days calendar days passed from ready_date to completed_date"
            value: "K('long_wait_mult')"
          - when: "more than short_wait_days but not more than long_wait_days calendar days passed from ready_date to completed_date"
            value: "K('short_wait_mult')"
          - when: "otherwise"
            value: "1"
        baseline:
          wait_mult: "1"
        evidence: [date]
        cross_difficulty: null
      - id: vendor_lateness_adjustment
        effect: method
        decides: adjusted_amount
        bindings: [late_days, adjusted_amount]
        ladder:
          - when: "ready_date is more than twice vendor_delay_threshold_days later than promised_ready_date"
            method: "the rounded amount is increased by half of itself and rounded to the nearest cent"
          - when: "ready_date is more than vendor_delay_threshold_days but not more than twice vendor_delay_threshold_days later than promised_ready_date"
            method: "a flat late_goodwill_usd is added to the rounded amount"
          - when: "otherwise"
            method: "the rounded amount is left as it is"
        baseline:
          adjusted_amount: "core_amount"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard allowance is damage_allowance_pct percent of the delivered price, where the delivered price is the order total billed plus every home delivery fee billed on the order, rounded to the nearest cent.
      params: [damage_allowance_pct]
    inputs:
      history:
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_order_billed}}
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_fee_charged, fee_type: home_delivery_fee}}
        - {table: special_order_events, aggregate: count, field: special_order_event_id, filters: {event_type: special_receipt_inspected, inspection_point: store_receipt}}
        - {table: special_requests, aggregate: latest, field: created_at, filters: {request_type: damage_claim}}
      cross_category: [pro, trade]
  - id: special_ext_deposit_delivery_charge
    base_policy_refs: [special_agg_install_link, special_cancellation, special_pickup_storage_abandonment, special_delivery, special_returns]
    overwrite:
      - base_policy: special_delivery
        superseded_clause: >-
          its charge is home_delivery_fee_usd, free when free_delivery_threshold_usd is above 0.00 and the order total is at or above it, billed as fee_type home_delivery_fee before release.
        replaced_by: >-
          On a deposit-program order the delivery charge is set by the rules below, which take the place of the flat program charge.
    trigger: state_due
    subject: [special_fee_charged]
    computes: delivery_charge
    target_tool: bill_deposit_delivery_6add7fad
    params:
      value_multiple: 3
      value_rate_pct: 3.5
      light_multiple: 1.5
      light_discount_usd: 30.00
      long_late_share: 0.5
      short_late_share: 0.75
      bad_handover_share: 0
      scuffed_handover_share: 0.75
      tenure_months: 60
      tenured_card_share: 0.85
      newer_card_share: 0.9
    rule: >-
      This policy covers the home delivery charge on an order in a program whose deposit_pct is 50 (a deposit at order, the balance before release) that Ridgeline has delivered to the customer's address and that is not linked to an installation contract.
      The usual delivery charge for a delivered deposit-program order is the program's home_delivery_fee_usd, billed once as fee_type home_delivery_fee.
      On a deposit-program order the delivery charge is set by the rules below, which take the place of the flat program charge.
      The load charge depends on the order total billed on the order: a billed total of at least value_multiple times the program's order_min_usd is charged the greater of home_delivery_fee_usd and value_rate_pct percent of the billed total, that percentage rounded to the cent; a billed total below light_multiple times order_min_usd is charged home_delivery_fee_usd less light_discount_usd; any other billed total is charged home_delivery_fee_usd.
      The late-arrival share depends on the calendar days by which ready_date is later than promised_ready_date: more than twice vendor_delay_threshold_days gives long_late_share; more than vendor_delay_threshold_days and not more than twice it gives short_late_share; otherwise the late-arrival share is 1.
      The condition share depends on the customer handover inspection: a handover inspection that recorded damaged_functional or wrong_item gives bad_handover_share; a handover inspection that recorded damaged_cosmetic, with none recording damaged_functional or wrong_item, gives scuffed_handover_share; otherwise the condition share is 1.
      The cardholder share depends on the customer's Ridgeline Consumer Credit account: an active account opened at least tenure_months whole months before today gives tenured_card_share; an active account opened fewer than tenure_months whole months before today gives newer_card_share; otherwise the cardholder share is 1.
      The delivery charge billed is the load charge times the late-arrival share, times the condition share, times the cardholder share, computed as one product on the load charge and rounded once to the nearest cent.
    prerequisite: []
    cross_category:
      - category: card
        as: branch
        reads: [status, opened_date]
        note: The cardholder share tier is decided from the consumer credit account status and the months since it opened.
    compute:
      - billed_total: "SUM('special_order_events', 'amount', event_type='special_order_billed')"
      - program_fee: "P('home_delivery_fee_usd')"
      - load_charge: "MX(program_fee, RND(billed_total * K('value_rate_pct') / 100, 2)) if billed_total >= K('value_multiple') * P('order_min_usd') else ((program_fee - K('light_discount_usd')) if billed_total < K('light_multiple') * P('order_min_usd') else program_fee)"
      - arrival_late_days: "DAYS(F('promised_ready_date'), F('ready_date'))"
      - arrival_share: "K('long_late_share') if arrival_late_days > 2 * P('vendor_delay_threshold_days') else (K('short_late_share') if arrival_late_days > P('vendor_delay_threshold_days') else 1)"
      - bad_handovers: "COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='customer_handover', inspection_condition='damaged_functional') + COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='customer_handover', inspection_condition='wrong_item')"
      - scuffed_handovers: "COUNT('special_order_events', event_type='special_receipt_inspected', inspection_point='customer_handover', inspection_condition='damaged_cosmetic')"
      - condition_share: "K('bad_handover_share') if bad_handovers > 0 else (K('scuffed_handover_share') if scuffed_handovers > 0 else 1)"
      - card_status: "CFIELD('card', 'status')"
      - card_opened: "CFIELD('card', 'opened_date')"
      - cardholder_share: "K('tenured_card_share') if (card_status == 'active' and MONTHS(card_opened, NOW) >= K('tenure_months')) else (K('newer_card_share') if (card_status == 'active' and MONTHS(card_opened, NOW) < K('tenure_months')) else 1)"
      - result: "0 if F('linked_install_contract_id') else RND(load_charge * arrival_share * condition_share * cardholder_share, 2)"
    compute_basis:
      billed_total: "The load charge depends on the order total billed on the order"
      program_fee: "The usual delivery charge for a delivered deposit-program order is the program's home_delivery_fee_usd, billed once as fee_type home_delivery_fee."
      load_charge: "a billed total of at least value_multiple times the program's order_min_usd is charged the greater of home_delivery_fee_usd and value_rate_pct percent of the billed total, that percentage rounded to the cent; a billed total below light_multiple times order_min_usd is charged home_delivery_fee_usd less light_discount_usd; any other billed total is charged home_delivery_fee_usd."
      arrival_late_days: "The late-arrival share depends on the calendar days by which ready_date is later than promised_ready_date"
      arrival_share: "more than twice vendor_delay_threshold_days gives long_late_share; more than vendor_delay_threshold_days and not more than twice it gives short_late_share; otherwise the late-arrival share is 1."
      bad_handovers: "a handover inspection that recorded damaged_functional or wrong_item gives bad_handover_share"
      scuffed_handovers: "a handover inspection that recorded damaged_cosmetic, with none recording damaged_functional or wrong_item, gives scuffed_handover_share"
      condition_share: "The condition share depends on the customer handover inspection: a handover inspection that recorded damaged_functional or wrong_item gives bad_handover_share; a handover inspection that recorded damaged_cosmetic, with none recording damaged_functional or wrong_item, gives scuffed_handover_share; otherwise the condition share is 1."
      card_status: "The cardholder share depends on the customer's Ridgeline Consumer Credit account"
      card_opened: "an active account opened at least tenure_months whole months before today gives tenured_card_share"
      cardholder_share: "an active account opened at least tenure_months whole months before today gives tenured_card_share; an active account opened fewer than tenure_months whole months before today gives newer_card_share; otherwise the cardholder share is 1."
      result: "The delivery charge billed is the load charge times the late-arrival share, times the condition share, times the cardholder share, computed as one product on the load charge and rounded once to the nearest cent."
    factors:
      - id: load_value_basis
        effect: method
        decides: load_charge
        bindings: [billed_total, load_charge]
        ladder:
          - when: "the billed order total is at least value_multiple times the program's order_min_usd"
            method: "the greater of home_delivery_fee_usd and value_rate_pct percent of the billed total"
          - when: "the billed order total is below light_multiple times the program's order_min_usd"
            method: "home_delivery_fee_usd less light_discount_usd"
          - when: "otherwise"
            method: "the flat home_delivery_fee_usd"
        baseline:
          load_charge: "program_fee"
        evidence: [history]
        cross_difficulty: null
      - id: late_arrival_share
        effect: parameter
        decides: arrival_share
        bindings: [arrival_late_days, arrival_share]
        ladder:
          - when: "ready_date is more than twice vendor_delay_threshold_days after promised_ready_date"
            value: "K('long_late_share')"
          - when: "ready_date is more than vendor_delay_threshold_days and not more than twice it after promised_ready_date"
            value: "K('short_late_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          arrival_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: handover_condition_share
        effect: parameter
        decides: condition_share
        bindings: [bad_handovers, scuffed_handovers, condition_share]
        ladder:
          - when: "a customer handover inspection recorded damaged_functional or wrong_item"
            value: "K('bad_handover_share')"
          - when: "a customer handover inspection recorded damaged_cosmetic and none recorded damaged_functional or wrong_item"
            value: "K('scuffed_handover_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          condition_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: cardholder_tenure_share
        effect: parameter
        decides: cardholder_share
        bindings: [card_status, card_opened, cardholder_share]
        ladder:
          - when: "the Ridgeline Consumer Credit account is active and opened at least tenure_months whole months before today"
            value: "K('tenured_card_share')"
          - when: "the Ridgeline Consumer Credit account is active and opened fewer than tenure_months whole months before today"
            value: "K('newer_card_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          cardholder_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: card
    baseline:
      rule: >-
        The usual delivery charge for a delivered deposit-program order is the program's home_delivery_fee_usd, billed once as fee_type home_delivery_fee.
      params: [home_delivery_fee_usd]
    inputs:
      history:
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_order_billed}}
        - {table: special_order_events, aggregate: count, field: special_order_event_id, filters: {event_type: special_receipt_inspected, inspection_point: customer_handover}}
      cross_category: [card]
  - id: special_ext_deposit_damage_allowance
    base_policy_refs: [special_cancellation, special_vendor_delay, special_receipt_and_damage, special_returns, special_price_protection]
    overwrite:
      - base_policy: special_receipt_and_damage
        superseded_clause: >-
          keeping the item with an allowance of damage_allowance_pct percent of the order total as credit_type damage_allowance.
        replaced_by: >-
          For a deposit-program order the allowance is set by the rules below in place of that plain percentage.
    trigger: state_due
    subject: [special_credit_applied]
    computes: allowance_amount
    target_tool: post_damage_allowance_1c94fd89
    params:
      onsite_rate: 10
      self_install_rate: 16
      same_day_report_mult: 1.1
      next_day_report_mult: 1.05
      long_hold_days: 45
      mid_hold_days: 21
      long_hold_mult: 1.1
      mid_hold_mult: 1.05
      lateness_goodwill_usd: 75.00
    rule: >-
      This policy covers the damage allowance on an order in a program whose deposit_pct is 50 when covered cosmetic damage was reported at the customer handover and the customer's damage claim already records the choice to keep the item with an allowance; the allowance is booked once as credit_type damage_allowance against that claim.
      The plain allowance is damage_allowance_pct percent of the order total billed on the order, rounded to the nearest cent.
      For a deposit-program order the allowance is set by the rules below in place of that plain percentage.
      The allowance percentage depends on the status of the customer's Ridgeline installation contract at the delivery address: a contract there that is scheduled or in_progress, so a Ridgeline installer will handle the item on site, gives onsite_rate; a contract there that is cancelled, so the customer installs and touches up the item without a Ridgeline crew, gives self_install_rate; otherwise the percentage is damage_allowance_pct.
      The report multiplier depends on when the damage claim was registered, in calendar days from completed_date: a claim registered on completed_date itself, while the delivery or pickup is still fresh, gives same_day_report_mult; a claim registered on the next calendar day gives next_day_report_mult; otherwise the report multiplier is 1.
      The holding multiplier depends on the calendar days from ready_date to completed_date: more than long_hold_days gives long_hold_mult; more than mid_hold_days and not more than long_hold_days gives mid_hold_mult; otherwise the holding multiplier is 1.
      The billed order total is multiplied by the allowance percentage divided by 100, by the report multiplier and by the holding multiplier in one product, and the product is rounded to the nearest cent.
      The rounded figure is then settled against the vendor's lateness, the calendar days by which ready_date is later than promised_ready_date: beyond twice vendor_delay_threshold_days the figure is raised by one half of itself and rounded to the nearest cent; beyond vendor_delay_threshold_days but not beyond twice it, lateness_goodwill_usd is added to the figure; otherwise the figure stands.
      The settled figure is the allowance booked.
    prerequisite: []
    cross_category:
      - category: install
        as: branch
        reads: [status, job_address]
        note: The allowance percentage tier is decided from the status of the installation contract at the delivery address.
    compute:
      - order_billed: "SUM('special_order_events', 'amount', event_type='special_order_billed')"
      - job_status: "CFIELD('install', 'status', job_address=F('delivery_address'))"
      - allowance_pct: "K('onsite_rate') if (job_status == 'scheduled' or job_status == 'in_progress') else (K('self_install_rate') if job_status == 'cancelled' else P('damage_allowance_pct'))"
      - claim_registered: "LATEST('special_requests', 'created_at', date_field='created_at', request_type='damage_claim')"
      - report_gap: "DAYS(F('completed_date'), claim_registered)"
      - report_mult: "K('same_day_report_mult') if report_gap == 0 else (K('next_day_report_mult') if report_gap == 1 else 1)"
      - held_days: "DAYS(F('ready_date'), F('completed_date'))"
      - holding_mult: "K('long_hold_mult') if held_days > K('long_hold_days') else (K('mid_hold_mult') if held_days > K('mid_hold_days') else 1)"
      - plain_figure: "RND(order_billed * allowance_pct / 100 * report_mult * holding_mult, 2)"
      - vendor_late_days: "DAYS(F('promised_ready_date'), F('ready_date'))"
      - settled_figure: "RND(plain_figure * 1.5, 2) if vendor_late_days > 2 * P('vendor_delay_threshold_days') else (RND(plain_figure + K('lateness_goodwill_usd'), 2) if vendor_late_days > P('vendor_delay_threshold_days') else plain_figure)"
      - result: "settled_figure"
    compute_basis:
      order_billed: "The plain allowance is damage_allowance_pct percent of the order total billed on the order, rounded to the nearest cent."
      job_status: "The allowance percentage depends on the status of the customer's Ridgeline installation contract at the delivery address"
      allowance_pct: "a contract there that is scheduled or in_progress, so a Ridgeline installer will handle the item on site, gives onsite_rate; a contract there that is cancelled, so the customer installs and touches up the item without a Ridgeline crew, gives self_install_rate; otherwise the percentage is damage_allowance_pct."
      claim_registered: "The report multiplier depends on when the damage claim was registered, in calendar days from completed_date"
      report_gap: "The report multiplier depends on when the damage claim was registered, in calendar days from completed_date"
      report_mult: "a claim registered on completed_date itself, while the delivery or pickup is still fresh, gives same_day_report_mult; a claim registered on the next calendar day gives next_day_report_mult; otherwise the report multiplier is 1."
      held_days: "The holding multiplier depends on the calendar days from ready_date to completed_date"
      holding_mult: "more than long_hold_days gives long_hold_mult; more than mid_hold_days and not more than long_hold_days gives mid_hold_mult; otherwise the holding multiplier is 1."
      plain_figure: "The billed order total is multiplied by the allowance percentage divided by 100, by the report multiplier and by the holding multiplier in one product, and the product is rounded to the nearest cent."
      vendor_late_days: "The rounded figure is then settled against the vendor's lateness, the calendar days by which ready_date is later than promised_ready_date"
      settled_figure: "beyond twice vendor_delay_threshold_days the figure is raised by one half of itself and rounded to the nearest cent; beyond vendor_delay_threshold_days but not beyond twice it, lateness_goodwill_usd is added to the figure; otherwise the figure stands."
      result: "The settled figure is the allowance booked."
    factors:
      - id: installation_status_rate
        effect: parameter
        decides: allowance_pct
        bindings: [job_status, allowance_pct]
        ladder:
          - when: "the installation contract at the delivery address is scheduled or in_progress"
            value: "K('onsite_rate')"
          - when: "the installation contract at the delivery address is cancelled"
            value: "K('self_install_rate')"
          - when: "otherwise"
            value: "P('damage_allowance_pct')"
        baseline:
          allowance_pct: "P('damage_allowance_pct')"
        evidence: [cross_category]
        cross_difficulty: install
      - id: report_timing_multiplier
        effect: parameter
        decides: report_mult
        bindings: [claim_registered, report_gap, report_mult]
        ladder:
          - when: "the damage claim was registered on completed_date"
            value: "K('same_day_report_mult')"
          - when: "the damage claim was registered on the calendar day after completed_date"
            value: "K('next_day_report_mult')"
          - when: "otherwise"
            value: "1"
        baseline:
          report_mult: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: holding_multiplier
        effect: parameter
        decides: holding_mult
        bindings: [held_days, holding_mult]
        ladder:
          - when: "more than long_hold_days calendar days passed from ready_date to completed_date"
            value: "K('long_hold_mult')"
          - when: "more than mid_hold_days and not more than long_hold_days calendar days passed from ready_date to completed_date"
            value: "K('mid_hold_mult')"
          - when: "otherwise"
            value: "1"
        baseline:
          holding_mult: "1"
        evidence: [date]
        cross_difficulty: null
      - id: lateness_settlement
        effect: method
        decides: settled_figure
        bindings: [vendor_late_days, settled_figure]
        ladder:
          - when: "ready_date is beyond twice vendor_delay_threshold_days after promised_ready_date"
            method: "the rounded figure is raised by one half of itself and rounded to the nearest cent"
          - when: "ready_date is beyond vendor_delay_threshold_days but not beyond twice it after promised_ready_date"
            method: "lateness_goodwill_usd is added to the rounded figure"
          - when: "otherwise"
            method: "the rounded figure stands"
        baseline:
          settled_figure: "plain_figure"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The plain allowance is damage_allowance_pct percent of the order total billed on the order, rounded to the nearest cent.
      params: [damage_allowance_pct]
    inputs:
      history:
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_order_billed}}
        - {table: special_requests, aggregate: latest, field: created_at, filters: {request_type: damage_claim}}
      cross_category: [install]
  - id: special_ext_storage_fee
    base_policy_refs: [special_agg_install_link, special_cancellation, special_pickup_storage_abandonment, special_delivery, special_returns]
    overwrite:
      - base_policy: special_pickup_storage_abandonment
        superseded_clause: >-
          A ready item is held free for pickup_hold_days days after ready_date; after that, where storage_fee_per_day_usd is above 0.00, storage is charged per day for special_msr_storage_days, never more than storage_fee_cap_usd in total, as fee_type storage_fee billed when the item leaves the store.
        replaced_by: >-
          The storage charge billed when the item leaves the store is set by the rules below in place of that day count and rate.
    trigger: state_due
    subject: [special_fee_charged]
    computes: storage_fee
    target_tool: bill_storage_fee_4a2244a6
    params:
      late_hold_long_days: 14
      late_hold_short_days: 7
      receipt_hold_long_days: 4
      receipt_hold_short_days: 2
      weekly_long_from_days: 21
      weekly_short_from_days: 7
      weekly_long_paid_days: 5
      weekly_short_paid_days: 6
      project_purchases: 2
      card_rate_share_high: 0.75
      card_rate_share_low: 0.9
      large_order_multiple: 4
      mid_order_multiple: 2
      large_order_share: 0.85
      mid_order_share: 0.95
      quoted_paid_share: 0.8
      quoted_unpaid_share: 0.9
    rule: >-
      This policy covers the storage charge on an order in a program whose deposit_pct is 50 and whose storage_fee_per_day_usd is above 0.00, not linked to an installation contract, once the item has left the store.
      The ordinary storage charge counts the calendar days from ready_date to completed_date (to today while the item is still at the store), less pickup_hold_days, never below zero, and charges storage_fee_per_day_usd for each of those days, never more than storage_fee_cap_usd, as one fee_type storage_fee line rounded to the nearest cent.
      The storage charge billed when the item leaves the store is set by the rules below in place of that day count and rate.
      The free hold is pickup_hold_days plus a late-arrival extension plus a receipt extension, in days.
      The late-arrival extension depends on the calendar days by which ready_date is later than promised_ready_date: more than twice vendor_delay_threshold_days adds late_hold_long_days; more than vendor_delay_threshold_days and not more than twice it adds late_hold_short_days; otherwise it adds nothing.
      The receipt extension depends on the calendar days from shipped_date to the store receipt inspection: more than twice receipt_inspection_days adds receipt_hold_long_days; more than receipt_inspection_days and not more than twice it adds receipt_hold_short_days; otherwise it adds nothing.
      The storage days are the calendar days from ready_date to completed_date (to today while the item is still at the store) less the free hold, never below zero.
      The storage days are converted into billable days by the length of the stay: storage days of at least weekly_long_from_days are billed as weekly_long_paid_days for every full 7 days plus each remaining day; storage days of at least weekly_short_from_days but fewer than weekly_long_from_days are billed as weekly_short_paid_days for every full 7 days plus each remaining day; fewer storage days are billed one for one.
      The cardholder rate share depends on the customer's Ridgeline Consumer Credit account: an active account with at least project_purchases purchases posted from special orders or installations in the last 12 months gives card_rate_share_high; an active account with fewer such purchases gives card_rate_share_low; otherwise the share is 1.
      The order-size share depends on the order total billed on the order: at least large_order_multiple times order_min_usd gives large_order_share; at least mid_order_multiple times order_min_usd but below large_order_multiple times it gives mid_order_share; otherwise the share is 1.
      The quoted-installation share depends on the customer's Ridgeline installation contract at the delivery address: a cancelled contract on which the customer made payments gives quoted_paid_share; a cancelled contract with no payments gives quoted_unpaid_share; otherwise the share is 1.
      The storage charge is the billable days times storage_fee_per_day_usd times the cardholder rate share, the order-size share and the quoted-installation share, as one product rounded to the nearest cent, never more than storage_fee_cap_usd. The storage fee line records the billable days as its days of storage billed.
    prerequisite: []
    cross_category:
      - category: card
        as: history
        reads: [status, card_transactions.event_type, card_transactions.purchase_channel, card_transactions.transaction_date]
        note: The cardholder rate share tier is decided from the consumer credit account status and its special-order and installation purchases in the last 12 months.
      - category: install
        as: history
        reads: [status, job_address, install_charges.event_type, install_charges.amount]
        note: The quoted-installation share tier is decided from the installation contract at the delivery address and the payments made on the customer's installation contracts.
    compute:
      - arrival_lag: "DAYS(F('promised_ready_date'), F('ready_date'))"
      - late_hold: "K('late_hold_long_days') if arrival_lag > 2 * P('vendor_delay_threshold_days') else (K('late_hold_short_days') if arrival_lag > P('vendor_delay_threshold_days') else 0)"
      - receipt_date: "LATEST('special_order_events', 'event_date', event_type='special_receipt_inspected', inspection_point='store_receipt')"
      - receipt_lag: "DAYS(F('shipped_date'), receipt_date)"
      - receipt_hold: "K('receipt_hold_long_days') if receipt_lag > 2 * P('receipt_inspection_days') else (K('receipt_hold_short_days') if receipt_lag > P('receipt_inspection_days') else 0)"
      - free_hold: "P('pickup_hold_days') + late_hold + receipt_hold"
      - stay_end: "F('completed_date') if F('completed_date') else NOW"
      - storage_days: "MX(0, DAYS(F('ready_date'), stay_end) - free_hold)"
      - billable_days: "(int(storage_days / 7) * K('weekly_long_paid_days') + storage_days - int(storage_days / 7) * 7) if storage_days >= K('weekly_long_from_days') else ((int(storage_days / 7) * K('weekly_short_paid_days') + storage_days - int(storage_days / 7) * 7) if storage_days >= K('weekly_short_from_days') else storage_days)"
      - card_state: "CFIELD('card', 'status')"
      - project_buys: "XCOUNT('card', 'card_transactions', within_months=12, date_field='transaction_date', event_type='card_purchase_posted', purchase_channel='special_order') + XCOUNT('card', 'card_transactions', within_months=12, date_field='transaction_date', event_type='card_purchase_posted', purchase_channel='installation')"
      - card_rate_share: "K('card_rate_share_high') if (card_state == 'active' and project_buys >= K('project_purchases')) else (K('card_rate_share_low') if (card_state == 'active' and project_buys < K('project_purchases')) else 1)"
      - billed_amount: "SUM('special_order_events', 'amount', event_type='special_order_billed')"
      - size_share: "K('large_order_share') if billed_amount >= K('large_order_multiple') * P('order_min_usd') else (K('mid_order_share') if billed_amount >= K('mid_order_multiple') * P('order_min_usd') else 1)"
      - quote_status: "CFIELD('install', 'status', job_address=F('delivery_address'))"
      - quote_contract: "CFIELD('install', 'install_contract_id', job_address=F('delivery_address'))"
      - quote_payments: "XSUM('install', 'install_charges', 'amount', event_type='install_payment_received', install_contract_id=quote_contract)"
      - install_share: "K('quoted_paid_share') if (quote_status == 'cancelled' and quote_payments > 0) else (K('quoted_unpaid_share') if (quote_status == 'cancelled' and quote_payments <= 0) else 1)"
      - result: "0 if (P('storage_fee_per_day_usd') <= 0 or F('linked_install_contract_id')) else MN(P('storage_fee_cap_usd'), RND(billable_days * P('storage_fee_per_day_usd') * card_rate_share * size_share * install_share, 2))"
    compute_basis:
      arrival_lag: "The late-arrival extension depends on the calendar days by which ready_date is later than promised_ready_date"
      late_hold: "more than twice vendor_delay_threshold_days adds late_hold_long_days; more than vendor_delay_threshold_days and not more than twice it adds late_hold_short_days; otherwise it adds nothing."
      receipt_date: "The receipt extension depends on the calendar days from shipped_date to the store receipt inspection"
      receipt_lag: "The receipt extension depends on the calendar days from shipped_date to the store receipt inspection"
      receipt_hold: "more than twice receipt_inspection_days adds receipt_hold_long_days; more than receipt_inspection_days and not more than twice it adds receipt_hold_short_days; otherwise it adds nothing."
      free_hold: "The free hold is pickup_hold_days plus a late-arrival extension plus a receipt extension, in days."
      stay_end: "The storage days are the calendar days from ready_date to completed_date (to today while the item is still at the store) less the free hold, never below zero."
      storage_days: "The storage days are the calendar days from ready_date to completed_date (to today while the item is still at the store) less the free hold, never below zero."
      billable_days: "storage days of at least weekly_long_from_days are billed as weekly_long_paid_days for every full 7 days plus each remaining day; storage days of at least weekly_short_from_days but fewer than weekly_long_from_days are billed as weekly_short_paid_days for every full 7 days plus each remaining day; fewer storage days are billed one for one."
      card_state: "The cardholder rate share depends on the customer's Ridgeline Consumer Credit account"
      project_buys: "an active account with at least project_purchases purchases posted from special orders or installations in the last 12 months gives card_rate_share_high"
      card_rate_share: "an active account with at least project_purchases purchases posted from special orders or installations in the last 12 months gives card_rate_share_high; an active account with fewer such purchases gives card_rate_share_low; otherwise the share is 1."
      billed_amount: "The order-size share depends on the order total billed on the order"
      size_share: "at least large_order_multiple times order_min_usd gives large_order_share; at least mid_order_multiple times order_min_usd but below large_order_multiple times it gives mid_order_share; otherwise the share is 1."
      quote_status: "The quoted-installation share depends on the customer's Ridgeline installation contract at the delivery address"
      quote_contract: "The quoted-installation share depends on the customer's Ridgeline installation contract at the delivery address"
      quote_payments: "a cancelled contract on which the customer made payments gives quoted_paid_share"
      install_share: "a cancelled contract on which the customer made payments gives quoted_paid_share; a cancelled contract with no payments gives quoted_unpaid_share; otherwise the share is 1."
      result: "The storage charge is the billable days times storage_fee_per_day_usd times the cardholder rate share, the order-size share and the quoted-installation share, as one product rounded to the nearest cent, never more than storage_fee_cap_usd. The storage fee line records the billable days as its days of storage billed."
    factors:
      - id: late_arrival_hold
        effect: parameter
        decides: late_hold
        bindings: [arrival_lag, late_hold]
        ladder:
          - when: "ready_date is more than twice vendor_delay_threshold_days after promised_ready_date"
            value: "K('late_hold_long_days')"
          - when: "ready_date is more than vendor_delay_threshold_days and not more than twice it after promised_ready_date"
            value: "K('late_hold_short_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          late_hold: "0"
        evidence: [date]
        cross_difficulty: null
      - id: receipt_delay_hold
        effect: parameter
        decides: receipt_hold
        bindings: [receipt_date, receipt_lag, receipt_hold]
        ladder:
          - when: "the store receipt inspection came more than twice receipt_inspection_days after shipped_date"
            value: "K('receipt_hold_long_days')"
          - when: "the store receipt inspection came more than receipt_inspection_days and not more than twice it after shipped_date"
            value: "K('receipt_hold_short_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          receipt_hold: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: weekly_day_count
        effect: method
        decides: billable_days
        bindings: [stay_end, storage_days, billable_days]
        ladder:
          - when: "the storage days are at least weekly_long_from_days"
            method: "weekly_long_paid_days billed for every full 7 storage days plus each remaining day"
          - when: "the storage days are at least weekly_short_from_days and fewer than weekly_long_from_days"
            method: "weekly_short_paid_days billed for every full 7 storage days plus each remaining day"
          - when: "otherwise"
            method: "every storage day billed"
        baseline:
          billable_days: "storage_days"
        evidence: [date]
        cross_difficulty: null
      - id: cardholder_project_share
        effect: parameter
        decides: card_rate_share
        bindings: [card_state, project_buys, card_rate_share]
        ladder:
          - when: "the Ridgeline Consumer Credit account is active and at least project_purchases special-order or installation purchases posted in the last 12 months"
            value: "K('card_rate_share_high')"
          - when: "the Ridgeline Consumer Credit account is active and fewer than project_purchases such purchases posted in the last 12 months"
            value: "K('card_rate_share_low')"
          - when: "otherwise"
            value: "1"
        baseline:
          card_rate_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: order_size_share
        effect: parameter
        decides: size_share
        bindings: [billed_amount, size_share]
        ladder:
          - when: "the billed order total is at least large_order_multiple times order_min_usd"
            value: "K('large_order_share')"
          - when: "the billed order total is at least mid_order_multiple times order_min_usd but below large_order_multiple times it"
            value: "K('mid_order_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          size_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: quoted_installation_share
        effect: parameter
        decides: install_share
        bindings: [quote_status, quote_contract, quote_payments, install_share]
        ladder:
          - when: "the installation contract at the delivery address is cancelled and the customer made payments on that contract"
            value: "K('quoted_paid_share')"
          - when: "the installation contract at the delivery address is cancelled and no payments were made on that contract"
            value: "K('quoted_unpaid_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          install_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: install
    baseline:
      rule: >-
        The ordinary storage charge counts the calendar days from ready_date to completed_date (to today while the item is still at the store), less pickup_hold_days, never below zero, and charges storage_fee_per_day_usd for each of those days, never more than storage_fee_cap_usd, as one fee_type storage_fee line rounded to the nearest cent.
      params: [pickup_hold_days, storage_fee_per_day_usd, storage_fee_cap_usd]
    inputs:
      history:
        - {table: special_order_events, aggregate: latest, field: event_date, filters: {event_type: special_receipt_inspected, inspection_point: store_receipt}}
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_order_billed}}
        - {category: card, table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 12, filters: {event_type: card_purchase_posted, purchase_channel: special_order}}
        - {category: card, table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 12, filters: {event_type: card_purchase_posted, purchase_channel: installation}}
        - {category: install, table: install_charges, aggregate: sum, field: amount, filters: {event_type: install_payment_received}}
      cross_category: [card, install]
  - id: special_ext_delay_credit
    base_policy_refs: [special_cancellation, special_vendor_delay, special_receipt_and_damage, special_returns, special_price_protection]
    overwrite:
      - base_policy: special_vendor_delay
        superseded_clause: >-
          receive a delay credit of delay_credit_pct percent of the order total, capped at delay_credit_max_usd, posted once as credit_type delay_credit
        replaced_by: >-
          On a deposit-program order the delay credit is worked out by the rules below rather than as delay_credit_pct percent of the order total.
    trigger: on_request
    subject: [special_credit_applied]
    computes: credit_amount
    target_tool: accept_delay_credit_eaface8f
    params:
      long_delay_rate: 7.5
      mid_delay_rate: 6
      mid_delay_factor: 1.5
      prompt_days: 7
      recent_days: 30
      prompt_bonus: 1
      recent_bonus: 0.5
      heavy_allowance_pct: 20
      heavy_allowance_cut: 1
      light_allowance_cut: 0.5
      install_lost_bonus: 1.5
      install_cancel_bonus: 0.5
      long_build_days: 60
      mid_build_days: 30
      long_build_bonus: 1
      mid_build_bonus: 0.5
      long_wait_days: 45
      short_wait_days: 21
      wait_deduction_usd: 25.00
    rule: >-
      This policy covers the delay credit on an order in a program whose deposit_pct is 50 when special_msr_delay_days is above vendor_delay_threshold_days and the customer chooses to keep the order and take the credit; it is posted once as credit_type delay_credit.
      The delay credit is not worked out until every damage allowance owed for a damage claim registered on the order stands as a credit on it.
      Before the delay credit is fixed, the home delivery charge owed for a delivered order must stand on the order as a fee line.
      A delay credit on an order the store has released is booked only after the storage charge owed for the days held past the free hold period stands on the order.
      The credit base is the order total billed plus every home delivery fee billed on the order, less every damage allowance credited on it.
      The standard delay credit is delay_credit_pct percent of the credit base, rounded to the nearest cent and never more than delay_credit_max_usd.
      On a deposit-program order the delay credit is worked out by the rules below rather than as delay_credit_pct percent of the order total.
      The credit rate, in percent, is the delay rate plus the prompt bonus, less the allowance cut, plus the installation bonus, plus the production bonus.
      The delay rate depends on special_msr_delay_days: more than twice vendor_delay_threshold_days gives long_delay_rate; more than mid_delay_factor times vendor_delay_threshold_days and not more than twice it gives mid_delay_rate; otherwise the delay rate is delay_credit_pct.
      The prompt bonus depends on the calendar days from completed_date to today: no more than prompt_days gives prompt_bonus; more than prompt_days and no more than recent_days gives recent_bonus; otherwise, or while the item has not been handed over, it is 0.
      The allowance cut depends on the damage allowances credited on the order: allowances totalling at least heavy_allowance_pct percent of the order total billed give heavy_allowance_cut; allowances totalling less than that but above 0.00 give light_allowance_cut; otherwise the cut is 0.
      The installation bonus depends on the customer's Ridgeline installation contract at the delivery address: a contract cancelled after promised_ready_date gives install_lost_bonus; a contract cancelled on or before promised_ready_date gives install_cancel_bonus; otherwise the bonus is 0.
      The production bonus depends on the calendar days from production_started_date to shipped_date: more than long_build_days gives long_build_bonus; more than mid_build_days and not more than long_build_days gives mid_build_bonus; otherwise it is 0.
      The credit base is multiplied by the credit rate divided by 100, rounded to the nearest cent and held to no more than delay_credit_max_usd.
      That capped figure is then settled for the customer's own wait, the calendar days from ready_date to completed_date: more than long_wait_days halves it, rounded to the nearest cent; more than short_wait_days and not more than long_wait_days takes wait_deduction_usd off it, never below zero; otherwise it stands.
      The settled figure is the delay credit posted.
    prerequisite:
      - problem: special_ext_deposit_damage_allowance
        kind: value_input
        gate: allowances
        form: state
        policy_source: >-
          The delay credit is not worked out until every damage allowance owed for a damage claim registered on the order stands as a credit on it.
        condition: >-
          Every damage_claim on the order whose remedy is a kept item with an allowance has its special_credit_applied line with credit_type damage_allowance on the order.
        resolved_by: post_damage_allowance_1c94fd89
        effect: >-
          Once the allowance credit is booked, allowances rises from 0.00 to the allowance, which lowers the credit base and moves the allowance cut off its zero tier.
      - problem: special_ext_deposit_delivery_charge
        kind: value_input
        gate: delivery_fees
        form: state
        policy_source: >-
          Before the delay credit is fixed, the home delivery charge owed for a delivered order must stand on the order as a fee line.
        condition: >-
          A special_fee_charged line with fee_type home_delivery_fee stands on the delivered order.
        resolved_by: bill_deposit_delivery_6add7fad
        effect: >-
          Once the home delivery fee line is booked, delivery_fees rises from 0.00 to the delivery charge and the credit base rises by it.
      - problem: special_ext_storage_fee
        kind: state_gate
        gate: special_order_events.fee_type
        form: state
        policy_source: >-
          A delay credit on an order the store has released is booked only after the storage charge owed for the days held past the free hold period stands on the order.
        condition: >-
          A special_fee_charged line with fee_type storage_fee stands on a released order that was held past its free hold period.
        resolved_by: bill_storage_fee_4a2244a6
        effect: >-
          Once the storage fee line is booked, the released order carries every charge it owes, and the delay credit may be booked.
    cross_category:
      - category: install
        as: branch
        reads: [status, cancelled_date, job_address]
        note: The installation bonus tier is decided from the status and cancellation date of the installation contract at the delivery address.
    compute:
      - bill_total: "SUM('special_order_events', 'amount', event_type='special_order_billed')"
      - delivery_fees: "SUM('special_order_events', 'amount', event_type='special_fee_charged', fee_type='home_delivery_fee')"
      - allowances: "SUM('special_order_events', 'amount', event_type='special_credit_applied', credit_type='damage_allowance')"
      - credit_base: "bill_total + delivery_fees - allowances"
      - late_by: "DAYS(F('promised_ready_date'), F('ready_date') if F('ready_date') else F('estimated_ready_date'))"
      - delay_rate: "K('long_delay_rate') if late_by > 2 * P('vendor_delay_threshold_days') else (K('mid_delay_rate') if late_by > K('mid_delay_factor') * P('vendor_delay_threshold_days') else P('delay_credit_pct'))"
      - prompt_bonus_pct: "0 if not F('completed_date') else (K('prompt_bonus') if DAYS(F('completed_date'), NOW) <= K('prompt_days') else (K('recent_bonus') if DAYS(F('completed_date'), NOW) <= K('recent_days') else 0))"
      - allowance_cut: "K('heavy_allowance_cut') if allowances >= K('heavy_allowance_pct') / 100 * bill_total else (K('light_allowance_cut') if allowances > 0 else 0)"
      - job_state: "CFIELD('install', 'status', job_address=F('delivery_address'))"
      - job_cancelled_on: "CFIELD('install', 'cancelled_date', job_address=F('delivery_address'))"
      - install_bonus: "K('install_lost_bonus') if (job_state == 'cancelled' and DAYS(F('promised_ready_date'), job_cancelled_on) > 0) else (K('install_cancel_bonus') if (job_state == 'cancelled' and DAYS(F('promised_ready_date'), job_cancelled_on) <= 0) else 0)"
      - build_days: "DAYS(F('production_started_date'), F('shipped_date'))"
      - production_bonus: "K('long_build_bonus') if build_days > K('long_build_days') else (K('mid_build_bonus') if build_days > K('mid_build_days') else 0)"
      - credit_rate: "delay_rate + prompt_bonus_pct - allowance_cut + install_bonus + production_bonus"
      - capped_credit: "MN(P('delay_credit_max_usd'), RND(credit_base * credit_rate / 100, 2))"
      - own_wait: "DAYS(F('ready_date'), F('completed_date')) if F('completed_date') else 0"
      - settled_credit: "RND(capped_credit / 2, 2) if own_wait > K('long_wait_days') else (MX(0, RND(capped_credit - K('wait_deduction_usd'), 2)) if own_wait > K('short_wait_days') else capped_credit)"
      - result: "settled_credit"
    compute_basis:
      bill_total: "The credit base is the order total billed plus every home delivery fee billed on the order, less every damage allowance credited on it."
      delivery_fees: "The credit base is the order total billed plus every home delivery fee billed on the order, less every damage allowance credited on it."
      allowances: "The credit base is the order total billed plus every home delivery fee billed on the order, less every damage allowance credited on it."
      credit_base: "The credit base is the order total billed plus every home delivery fee billed on the order, less every damage allowance credited on it."
      late_by: "The delay rate depends on special_msr_delay_days"
      delay_rate: "more than twice vendor_delay_threshold_days gives long_delay_rate; more than mid_delay_factor times vendor_delay_threshold_days and not more than twice it gives mid_delay_rate; otherwise the delay rate is delay_credit_pct."
      prompt_bonus_pct: "The prompt bonus depends on the calendar days from completed_date to today: no more than prompt_days gives prompt_bonus; more than prompt_days and no more than recent_days gives recent_bonus; otherwise, or while the item has not been handed over, it is 0."
      allowance_cut: "The allowance cut depends on the damage allowances credited on the order: allowances totalling at least heavy_allowance_pct percent of the order total billed give heavy_allowance_cut; allowances totalling less than that but above 0.00 give light_allowance_cut; otherwise the cut is 0."
      job_state: "The installation bonus depends on the customer's Ridgeline installation contract at the delivery address"
      job_cancelled_on: "a contract cancelled after promised_ready_date gives install_lost_bonus"
      install_bonus: "a contract cancelled after promised_ready_date gives install_lost_bonus; a contract cancelled on or before promised_ready_date gives install_cancel_bonus; otherwise the bonus is 0."
      build_days: "The production bonus depends on the calendar days from production_started_date to shipped_date"
      production_bonus: "more than long_build_days gives long_build_bonus; more than mid_build_days and not more than long_build_days gives mid_build_bonus; otherwise it is 0."
      credit_rate: "The credit rate, in percent, is the delay rate plus the prompt bonus, less the allowance cut, plus the installation bonus, plus the production bonus."
      capped_credit: "The credit base is multiplied by the credit rate divided by 100, rounded to the nearest cent and held to no more than delay_credit_max_usd."
      own_wait: "That capped figure is then settled for the customer's own wait, the calendar days from ready_date to completed_date"
      settled_credit: "more than long_wait_days halves it, rounded to the nearest cent; more than short_wait_days and not more than long_wait_days takes wait_deduction_usd off it, never below zero; otherwise it stands."
      result: "The settled figure is the delay credit posted."
    factors:
      - id: delay_length_rate
        effect: parameter
        decides: delay_rate
        bindings: [late_by, delay_rate]
        ladder:
          - when: "special_msr_delay_days is more than twice vendor_delay_threshold_days"
            value: "K('long_delay_rate')"
          - when: "special_msr_delay_days is more than mid_delay_factor times vendor_delay_threshold_days and not more than twice it"
            value: "K('mid_delay_rate')"
          - when: "otherwise"
            value: "P('delay_credit_pct')"
        baseline:
          delay_rate: "P('delay_credit_pct')"
        evidence: [date]
        cross_difficulty: null
      - id: prompt_claim_bonus
        effect: parameter
        decides: prompt_bonus_pct
        bindings: [prompt_bonus_pct]
        ladder:
          - when: "the item was handed over no more than prompt_days calendar days before today"
            value: "K('prompt_bonus')"
          - when: "the item was handed over more than prompt_days and no more than recent_days calendar days before today"
            value: "K('recent_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          prompt_bonus_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: allowance_cut_rate
        effect: parameter
        decides: allowance_cut
        bindings: [allowances, allowance_cut]
        ladder:
          - when: "damage allowances credited on the order total at least heavy_allowance_pct percent of the order total billed"
            value: "K('heavy_allowance_cut')"
          - when: "damage allowances credited on the order total less than heavy_allowance_pct percent of the order total billed but above 0.00"
            value: "K('light_allowance_cut')"
          - when: "otherwise"
            value: "0"
        baseline:
          allowance_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: lost_installation_bonus
        effect: parameter
        decides: install_bonus
        bindings: [job_state, job_cancelled_on, install_bonus]
        ladder:
          - when: "the installation contract at the delivery address was cancelled after promised_ready_date"
            value: "K('install_lost_bonus')"
          - when: "the installation contract at the delivery address was cancelled on or before promised_ready_date"
            value: "K('install_cancel_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          install_bonus: "0"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: production_length_bonus
        effect: parameter
        decides: production_bonus
        bindings: [build_days, production_bonus]
        ladder:
          - when: "more than long_build_days calendar days passed from production_started_date to shipped_date"
            value: "K('long_build_bonus')"
          - when: "more than mid_build_days and not more than long_build_days calendar days passed from production_started_date to shipped_date"
            value: "K('mid_build_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          production_bonus: "0"
        evidence: [date]
        cross_difficulty: null
      - id: own_wait_settlement
        effect: method
        decides: settled_credit
        bindings: [own_wait, settled_credit]
        ladder:
          - when: "more than long_wait_days calendar days passed from ready_date to completed_date"
            method: "the capped figure is halved and rounded to the nearest cent"
          - when: "more than short_wait_days and not more than long_wait_days calendar days passed from ready_date to completed_date"
            method: "wait_deduction_usd is taken off the capped figure, never below zero"
          - when: "otherwise"
            method: "the capped figure stands"
        baseline:
          settled_credit: "capped_credit"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The credit base is the order total billed plus every home delivery fee billed on the order, less every damage allowance credited on it.
        The standard delay credit is delay_credit_pct percent of the credit base, rounded to the nearest cent and never more than delay_credit_max_usd.
      params: [delay_credit_pct, delay_credit_max_usd]
    inputs:
      history:
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_order_billed}}
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_fee_charged, fee_type: home_delivery_fee}}
        - {table: special_order_events, aggregate: sum, field: amount, filters: {event_type: special_credit_applied, credit_type: damage_allowance}}
      cross_category: [install]
