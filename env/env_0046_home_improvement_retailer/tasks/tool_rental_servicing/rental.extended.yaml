# Ridgeline Tool Rental — in-store rental centers renting tools and equipment by the four hours, day,
# week and four weeks under a rental agreement for one equipment item.
category: rental
display_name: Ridgeline Tool Rental

binding:
  holding_table: rental_agreements
  event_tables: [rental_charges]
  intake_tables: [rental_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: rental_balance, deposit_held: deposit_held}

lifecycle:
  states: [reserved, on_rent, overdue, returned, converted, closed, cancelled]
  transitions:
    - {from: reserved, to: on_rent, by: system, means: The equipment is checked out to the renter at the rental counter or delivered to the job site.}
    - {from: reserved, to: cancelled, by: user, means: The renter cancels the reservation.}
    - {from: reserved, to: cancelled, by: system, means: The reservation is released because the renter did not pick up within the hold period.}
    - {from: on_rent, to: overdue, by: system, means: The equipment was not returned within the overdue threshold after its due-back time.}
    - {from: on_rent, to: returned, by: system, means: The equipment is checked in at the store or picked up from the job site.}
    - {from: overdue, to: returned, by: system, means: Overdue equipment is checked in.}
    - {from: overdue, to: converted, by: system, means: Unreturned equipment is treated as lost and charged at replacement value.}
    - {from: returned, to: closed, by: system, means: The agreement is settled — balance 0.00 and deposit applied or released.}
    - {from: converted, to: closed, by: system, means: A converted agreement is settled once the replacement charge is paid.}

accounts:
  - key: rental_balance
    unit: USD
    meaning: Amount the renter owes on the agreement — rental time, damage protection, fees and refunds paid out in; payments (including an applied deposit) and credits out.
  - key: deposit_held
    unit: USD
    meaning: Security or reservation deposit currently held on the agreement — collected in; applied to the balance or released out.

parameter_schema:
  four_hour_available: Whether a four-hour rate period is offered for this equipment class, boolean.
  four_hour_rate_pct_of_daily: Four-hour rate as a percentage of the item's daily rate, percent.
  weekly_rate_multiplier: Weekly (7 x 24 hours) rate as a multiple of the item's daily rate, multiplier.
  four_week_rate_multiplier: Four-week (28 x 24 hours) rate as a multiple of the item's daily rate, multiplier.
  rental_day_hours: Length of one daily rate period counted from checkout, hours.
  return_grace_minutes: Minutes after the end of a rate period within which a return is not charged for further time, minutes.
  lowest_cost_combination: Whether rental time is billed as the lowest-cost combination of four-hour, daily, weekly and four-week periods covering the time out, boolean.
  weekend_special_available: Whether the weekend special is offered (checkout on Saturday, return by one hour after Monday store opening), boolean.
  weekend_rate_multiplier: Weekend special charge as a multiple of the item's daily rate, multiplier.
  damage_protection_pct: Damage protection charge as a percentage of the rental time charges, percent.
  damage_protection_mandatory: Whether damage protection must be taken (unless waived by a certificate of insurance where allowed), boolean.
  damage_protection_waivable_with_coi: Whether a renter with a commercial certificate of insurance on file may decline mandatory damage protection, boolean.
  damage_protection_covers_up_to_usd: Largest repair cost per incident that damage protection covers for accidental damage, USD.
  damage_protection_deductible_usd: Amount per incident the renter pays even with damage protection, USD.
  damage_protection_excludes_theft: Whether loss and theft are excluded from damage protection, boolean.
  damage_protection_excludes_tires_tracks: Whether tire and track damage is excluded from damage protection, boolean.
  damage_protection_on_discounted_amount: Whether damage protection is computed on rental time after the ProBuild discount (true) or before it (false), boolean.
  deposit_usd: Security deposit collected at checkout, USD.
  deposit_waived_for_pro_credit: Whether the security deposit is waived when the rental is charged to a Ridgeline Pro Credit account in active status, boolean.
  deposit_tenders_accepted: Tenders accepted for a security or reservation deposit (list drawn from cash, bank_card).
  payment_methods_accepted: Tenders accepted for rental charges (list drawn from cash, bank_card, ridgeline_consumer_credit, ridgeline_pro_credit).
  reservation_max_advance_days: How far ahead of pickup a reservation may be made, calendar days.
  reservation_hold_hours: Hours after the scheduled pickup time that reserved equipment is held before the reservation is released, hours.
  reservation_deposit_usd: Deposit collected when the reservation is made; 0 means none, USD.
  reservation_cancel_notice_hours: Hours before the scheduled pickup by which a reservation may be cancelled with the reservation deposit released, hours.
  reservation_no_show_forfeits_deposit: Whether the reservation deposit is forfeited on a late cancellation or a no-show, boolean.
  operator_orientation_required: Whether the renter must complete the operating and safety orientation before checkout, boolean.
  cleaning_fee_usd: Fee when equipment is returned needing cleaning beyond normal use, USD.
  fuel_charge_per_eighth_usd: Refuelling charge per eighth of a tank below the level at checkout, USD.
  fuel_service_fee_usd: Service fee added once when any refuelling charge applies, USD.
  engine_hours_per_day: Engine hours included per billed day on metered equipment; 0 means unmetered, hours.
  overtime_rate_pct_of_daily_per_hour: Charge per engine hour above the included hours, as a percentage of the daily rate, percent.
  delivery_available: Whether job-site delivery and pickup are offered for the class, boolean.
  delivery_fee_base_usd: Base charge for delivery to the job site, USD.
  delivery_fee_per_mile_usd: Charge per mile of one-way distance from the store to the job site, USD.
  delivery_max_miles: Largest one-way distance served by delivery, miles.
  pickup_fee_pct_of_delivery: Charge for picking the equipment up from the job site, as a percentage of the delivery charge, percent.
  overdue_after_hours: Hours after the due-back time (plus grace) after which unreturned equipment is marked overdue, hours.
  conversion_days_overdue: Days in overdue status after which unreturned equipment is treated as lost and converted, calendar days.
  lost_equipment_admin_fee_usd: Administrative fee added to the replacement value of converted or lost equipment, USD.
  accessory_missing_fee_usd: Charge per accessory (blade, bit, hose, pad) not returned, USD.
  shop_labor_rate_usd: Hourly shop labor rate at which repairs of damage are assessed, USD per hour.
  damage_dispute_days: Days after return within which the renter may dispute a damage, cleaning, fuel or missing accessory charge, calendar days.
  malfunction_full_credit_hours: Hours after checkout within which a reported and confirmed equipment malfunction earns credit of the full rental time, hours.
  early_return_refund: Whether unused time inside a billed period is refunded when equipment comes back early, boolean.
  extension_max_days: Largest number of days one extension may add to the due-back time, calendar days.
  max_agreement_days: Longest total rental period one agreement may run before a new agreement is required, calendar days.
  pro_discount_eligible: Whether rental time in this class earns the ProBuild Rewards rental discount, boolean.

