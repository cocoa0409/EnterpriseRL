  - id: rental_ext_refuelling_charge
    base_policy_refs: [rental_reservations, rental_damage_protection, rental_return_fees, rental_delivery, rental_overdue_and_conversion]
    overwrite:
      - base_policy: rental_return_fees
        superseded_clause: >-
          Fuel below fuel_level_out is charged fuel_charge_per_eighth_usd per missing eighth plus fuel_service_fee_usd once.
        replaced_by: >-
          The refuelling charge is the eighths missing multiplied by the class price per eighth, plus the class refuelling service fee once when any eighth is missing, rounded to the nearest cent once at the end.
    trigger: state_due
    subject: [rental_fee_charged]
    computes: fuel_amount
    target_tool: bill_refuelling_charge_2bf37336
    params:
      refill_from_eighths: 5
      refill_min_days: 7
      refill_price_pct: 85.0
      top_up_max_eighths: 2
      premier_fuel_mult: 0.90
      preferred_fuel_mult: 0.95
      four_week_fuel_mult: 0.90
      weekly_fuel_mult: 0.95
      early_return_mult: 0.90
      on_time_return_mult: 0.95
    rule: >-
      Equipment returned with less fuel than at checkout is billed a refuelling charge once per agreement as one refuelling line; equipment returned with at least the fuel it went out with carries none.
      The eighths missing are the fuel level at checkout less the fuel level at return, in eighths of a tank, and never below zero.
      The refuelling charge is the eighths missing multiplied by the class price per eighth, plus the class refuelling service fee once when any eighth is missing, rounded to the nearest cent once at the end.
      How the refuelling is priced depends on the shortfall: when 5 or more eighths are missing and the unit was out 7 or more calendar days, counted from the checkout date to the return date, the refuelling is priced as a full-tank refill at 85 percent of eight eighths at the class price per eighth, plus the service fee once; when 1 or 2 eighths are missing, the eighths missing are charged at the class price per eighth with no service fee; in every other case the eighths missing are charged at the class price per eighth plus the service fee once.
      The Ridgeline Consumer Credit tier lowers the refuelling charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, it is multiplied by 0.90; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.95; in every other case it is unchanged.
      Long rentals pay the contract fuel price: on an agreement whose rental time includes a four-week period the refuelling charge is multiplied by 0.90; on one whose rental time includes weekly periods but no four-week period, by 0.95; on one billed in daily periods only, it is unchanged.
      Returning on schedule lowers the refuelling charge: equipment returned on a calendar day before the due-back date has it multiplied by 0.90; equipment returned on the due-back date, by 0.95; equipment returned after the due-back date keeps it unchanged.
      The three multipliers act one after the other on the priced refuelling, service fee included, and the rounding to the cent is made only on the final figure.
    prerequisite: []
    cross_category:
      - category: card
        as: branch
        reads: [status, variant_name]
        note: The Ridgeline Consumer Credit tier and status decide the cardholder fuel multiplier.
    compute:
      - eighths: "MX(0, F('fuel_level_out') - F('fuel_level_in'))"
      - days_out_f: "DAYS(F('checkout_at'), F('returned_at'))"
      - fuel_core: "(K('refill_price_pct') / 100 * 8 * P('fuel_charge_per_eighth_usd') + P('fuel_service_fee_usd')) if (eighths >= K('refill_from_eighths') and days_out_f >= K('refill_min_days')) else ((eighths * P('fuel_charge_per_eighth_usd')) if (eighths >= 1 and eighths <= K('top_up_max_eighths')) else ((eighths * P('fuel_charge_per_eighth_usd') + P('fuel_service_fee_usd')) if eighths > 0 else 0))"
      - card_status_f: "CFIELD('card','status')"
      - card_tier_f: "CFIELD('card','variant_name')"
      - card_mult_f: "K('premier_fuel_mult') if (card_status_f == 'active' and card_tier_f == 'Ridgeline Consumer Credit Card Premier') else (K('preferred_fuel_mult') if (card_status_f == 'active' and card_tier_f == 'Ridgeline Consumer Credit Card Preferred') else 1)"
      - f_four_week: "COUNT('rental_charges', event_type='rental_time_charged', rate_period='four_week')"
      - f_weekly: "COUNT('rental_charges', event_type='rental_time_charged', rate_period='weekly')"
      - contract_mult: "K('four_week_fuel_mult') if f_four_week > 0 else (K('weekly_fuel_mult') if f_weekly > 0 else 1)"
      - return_gap: "DAYS(F('returned_at'), F('due_back_at'))"
      - schedule_mult: "K('early_return_mult') if return_gap >= 1 else (K('on_time_return_mult') if return_gap == 0 else 1)"
      - result: "RND(fuel_core * card_mult_f * contract_mult * schedule_mult, 2)"
    compute_basis:
      eighths: "The eighths missing are the fuel level at checkout less the fuel level at return, in eighths of a tank, and never below zero."
      days_out_f: "How the refuelling is priced depends on the shortfall: when 5 or more eighths are missing and the unit was out 7 or more calendar days, counted from the checkout date to the return date, the refuelling is priced as a full-tank refill at 85 percent of eight eighths at the class price per eighth, plus the service fee once; when 1 or 2 eighths are missing, the eighths missing are charged at the class price per eighth with no service fee; in every other case the eighths missing are charged at the class price per eighth plus the service fee once."
      fuel_core: "How the refuelling is priced depends on the shortfall: when 5 or more eighths are missing and the unit was out 7 or more calendar days, counted from the checkout date to the return date, the refuelling is priced as a full-tank refill at 85 percent of eight eighths at the class price per eighth, plus the service fee once; when 1 or 2 eighths are missing, the eighths missing are charged at the class price per eighth with no service fee; in every other case the eighths missing are charged at the class price per eighth plus the service fee once."
      card_status_f: "The Ridgeline Consumer Credit tier lowers the refuelling charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, it is multiplied by 0.90; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.95; in every other case it is unchanged."
      card_tier_f: "The Ridgeline Consumer Credit tier lowers the refuelling charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, it is multiplied by 0.90; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.95; in every other case it is unchanged."
      card_mult_f: "The Ridgeline Consumer Credit tier lowers the refuelling charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, it is multiplied by 0.90; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.95; in every other case it is unchanged."
      f_four_week: "Long rentals pay the contract fuel price: on an agreement whose rental time includes a four-week period the refuelling charge is multiplied by 0.90; on one whose rental time includes weekly periods but no four-week period, by 0.95; on one billed in daily periods only, it is unchanged."
      f_weekly: "Long rentals pay the contract fuel price: on an agreement whose rental time includes a four-week period the refuelling charge is multiplied by 0.90; on one whose rental time includes weekly periods but no four-week period, by 0.95; on one billed in daily periods only, it is unchanged."
      contract_mult: "Long rentals pay the contract fuel price: on an agreement whose rental time includes a four-week period the refuelling charge is multiplied by 0.90; on one whose rental time includes weekly periods but no four-week period, by 0.95; on one billed in daily periods only, it is unchanged."
      return_gap: "Returning on schedule lowers the refuelling charge: equipment returned on a calendar day before the due-back date has it multiplied by 0.90; equipment returned on the due-back date, by 0.95; equipment returned after the due-back date keeps it unchanged."
      schedule_mult: "Returning on schedule lowers the refuelling charge: equipment returned on a calendar day before the due-back date has it multiplied by 0.90; equipment returned on the due-back date, by 0.95; equipment returned after the due-back date keeps it unchanged."
      result: "The three multipliers act one after the other on the priced refuelling, service fee included, and the rounding to the cent is made only on the final figure."
    factors:
      - id: refuel_pricing_method
        effect: method
        decides: fuel_core
        bindings: [days_out_f, fuel_core]
        ladder:
          - when: "5 or more eighths are missing and the unit was out 7 or more calendar days"
            method: "full-tank refill price: 85 percent of eight eighths at the class price, plus the service fee once"
          - when: "1 or 2 eighths are missing"
            method: "the eighths missing at the class price, no service fee"
          - when: "otherwise"
            method: "the eighths missing at the class price plus the service fee once"
        baseline: {fuel_core: "(eighths * P('fuel_charge_per_eighth_usd') + P('fuel_service_fee_usd')) if eighths > 0 else 0"}
        evidence: [date]
        cross_difficulty: null
      - id: consumer_credit_fuel_multiplier
        effect: parameter
        decides: card_mult_f
        bindings: [card_status_f, card_tier_f, card_mult_f]
        ladder:
          - when: "the Ridgeline Consumer Credit account is active at the Premier tier"
            value: "K('premier_fuel_mult') = 0.90"
          - when: "the account is active at the Preferred tier"
            value: "K('preferred_fuel_mult') = 0.95"
          - when: "otherwise"
            value: "1"
        baseline: {card_mult_f: "1"}
        evidence: [cross_category]
        cross_difficulty: card
      - id: contract_fuel_multiplier
        effect: parameter
        decides: contract_mult
        bindings: [f_four_week, f_weekly, contract_mult]
        ladder:
          - when: "the rental time includes a four-week period"
            value: "K('four_week_fuel_mult') = 0.90"
          - when: "the rental time includes weekly periods but no four-week period"
            value: "K('weekly_fuel_mult') = 0.95"
          - when: "otherwise (daily periods only)"
            value: "1"
        baseline: {contract_mult: "1"}
        evidence: [history]
        cross_difficulty: null
      - id: return_schedule_multiplier
        effect: parameter
        decides: schedule_mult
        bindings: [return_gap, schedule_mult]
        ladder:
          - when: "returned on a calendar day before the due-back date"
            value: "K('early_return_mult') = 0.90"
          - when: "returned on the due-back date"
            value: "K('on_time_return_mult') = 0.95"
          - when: "otherwise (after the due-back date)"
            value: "1"
        baseline: {schedule_mult: "1"}
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        Equipment returned with less fuel than at checkout is billed a refuelling charge once per agreement as one refuelling line; equipment returned with at least the fuel it went out with carries none.
        The eighths missing are the fuel level at checkout less the fuel level at return, in eighths of a tank, and never below zero.
        The refuelling charge is the eighths missing multiplied by the class price per eighth, plus the class refuelling service fee once when any eighth is missing, rounded to the nearest cent once at the end.
      params: [fuel_charge_per_eighth_usd, fuel_service_fee_usd]
    inputs:
      history:
        - {table: rental_charges, aggregate: count, field: rental_charge_id, filters: {event_type: rental_time_charged}}
      cross_category: [card]
  - id: rental_ext_protected_damage_adjustment
    base_policy_refs: [rental_damage_disputes, rental_damage_protection, rental_return_fees]
    overwrite:
      - base_policy: rental_damage_disputes
        superseded_clause: >-
          An adjustment posts only when the damage dispute request has status approved, for the amount approved and never more than the disputed charge; a charge already adjusted cannot be adjusted again.
        replaced_by: >-
          On an agreement with damage protection, a damage repair charge named by a damage dispute whose status is approved is adjusted once, by the disputed charge less the excess the renter keeps, never more than the disputed charge, and a charge already adjusted is not adjusted again
      - base_policy: rental_damage_protection
        superseded_clause: >-
          With damage protection, accidental damage found at inspection is covered up to damage_protection_covers_up_to_usd per incident: the renter pays damage_protection_deductible_usd (fee_type damage_deductible) plus any repair cost above the coverage limit (fee_type damage_repair).
        replaced_by: >-
          The protected repair cost is the disputed damage repair charge less the missing-accessory charge, the refuelling charge and the damage deductible standing on the agreement, and never below zero.
    trigger: state_due
    subject: [rental_charge_adjusted]
    computes: adjustment_amount
    target_tool: accept_damage_adjustment_c3a91d5f
    params:
      premier_cover_usd: 2500.00
      preferred_cover_usd: 1000.00
      dp_paid_high_usd: 150.00
      dp_paid_mid_usd: 75.00
      dp_cover_high_usd: 1000.00
      dp_cover_mid_usd: 500.00
      spend_high_usd: 5000.00
      spend_mid_usd: 2000.00
      spend_cover_high_usd: 1500.00
      spend_cover_mid_usd: 500.00
      rentals_banded_from: 3
      band_usd: 500.00
      band_share_pct: 50.0
      flat_share_pct: 75.0
      prompt_fast_days: 3
      prompt_slow_days: 7
      prompt_fast_credit_usd: 100.00
      prompt_slow_credit_usd: 50.00
      on_time_credit_usd: 150.00
      one_day_credit_usd: 75.00
    rule: >-
      On an agreement with damage protection, a damage repair charge named by a damage dispute whose status is approved is adjusted once, by the disputed charge less the excess the renter keeps, never more than the disputed charge, and a charge already adjusted is not adjusted again; the adjustment takes effect when the renter accepts it as the remedy for the dispute.
      The adjustment on an approved damage dispute is fixed only after the agreement carries the damage deductible line owed for the incident.
      No adjustment on an approved damage dispute is booked until the agreement carries the missing-accessory charge owed from the return inspection.
      Before the adjustment on an approved damage dispute is worked out, the agreement must carry the refuelling charge owed for its fuel reading at return.
      The disputed charge is the damage repair line the approved dispute names.
      No adjustment is due under this rule when the approved dispute was filed more calendar days after the return date than the class's dispute window allows, or when the return inspection recorded a damage cause other than accidental, since misuse, loss or theft and tire or track damage stay billed in full.
      The shop's assessed repair cost covers everything needed to put the unit back in rental condition, including accessories not returned and the fuel used in testing; damage protection never covers those and never covers the deductible, so they are taken off before the coverage limit applies.
      The protected repair cost is the disputed damage repair charge less the missing-accessory charge, the refuelling charge and the damage deductible standing on the agreement, and never below zero.
      The protection limit of the agreement is the class coverage limit of damage protection.
      The excess the renter keeps is the protected repair cost above the protection limit of the agreement, and never below zero.
      The adjustment is the disputed damage repair charge less the excess the renter keeps, rounded to the nearest cent once at the end, half a cent rounding up.
      The Ridgeline Consumer Credit tier raises the protection limit of the agreement: a renter whose Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier adds 2,500.00 dollars; one whose account is active at the Ridgeline Consumer Credit Card Preferred tier adds 1,000.00 dollars; any other renter adds nothing.
      The protection paid raises the protection limit of the agreement: when the damage protection charges billed on the agreement total 150.00 dollars or more, 1,000.00 dollars are added; when they total 75.00 dollars or more but less than 150.00 dollars, 500.00 dollars are added; when they total less than 75.00 dollars, nothing is added.
      Card spend raises the protection limit of the agreement: when the purchases posted to the renter's Ridgeline Consumer Credit account in the last 12 months total 5,000.00 dollars or more, 1,500.00 dollars are added; when they total 2,000.00 dollars or more but less than 5,000.00 dollars, 500.00 dollars are added; when they total less than 2,000.00 dollars, nothing is added.
      How much of the excess the renter keeps depends on the renter's rental history on the card: a renter whose Ridgeline Consumer Credit account shows 3 or more tool rental purchases posted in the last 24 months keeps the first 500.00 dollars of the excess in full and 50 percent of the excess above 500.00 dollars, the two parts added; a renter whose account shows 1 or 2 such purchases keeps 75 percent of the whole excess; any other renter keeps the whole excess.
      A prompt dispute lowers the excess the renter keeps: when the approved dispute was filed within 3 calendar days of the return date, 100.00 dollars are taken off it; when the approved dispute was filed 4 to 7 calendar days after the return date, 50.00 dollars are taken off; when it was filed later, nothing is taken off.
      Returning on schedule lowers the excess the renter keeps: equipment returned on or before the due-back date takes 150.00 dollars off it; equipment returned on the calendar day right after the due-back date takes 75.00 dollars off; equipment returned later takes nothing off.
      The two amounts taken off are subtracted after the renter's share of the excess has been figured, and the excess the renter keeps never goes below zero.
      A purchase falls in the last 12 or 24 months when it is dated fewer than 12 or 24 whole calendar months before the day the adjustment is booked.
    prerequisite:
      - problem: rental_ext_damage_deductible
        kind: value_input
        gate: ded_b
        form: state
        policy_source: >-
          The adjustment on an approved damage dispute is fixed only after the agreement carries the damage deductible line owed for the incident.
        condition: >-
          On an agreement with damage protection whose inspection found accidental damage, the agreement's ledger carries the damage deductible line computed under the damage deductible rule.
        resolved_by: bill_damage_deductible_c7701c46
        effect: >-
          The damage deductible standing on the agreement is taken off the protected repair cost, so billing it lowers the excess the renter keeps and raises the adjustment.
      - problem: rental_ext_missing_accessory_charge
        kind: value_input
        gate: acc_b
        form: state
        policy_source: >-
          No adjustment on an approved damage dispute is booked until the agreement carries the missing-accessory charge owed from the return inspection.
        condition: >-
          When the return inspection counted accessories not returned, the agreement's ledger carries the missing-accessory line computed under the missing-accessory rule.
        resolved_by: bill_missing_accessories_12fefdd6
        effect: >-
          The missing-accessory charge standing on the agreement is taken off the protected repair cost, so billing it lowers the excess the renter keeps and raises the adjustment.
      - problem: rental_ext_refuelling_charge
        kind: value_input
        gate: fuel_b
        form: state
        policy_source: >-
          Before the adjustment on an approved damage dispute is worked out, the agreement must carry the refuelling charge owed for its fuel reading at return.
        condition: >-
          When the fuel level at return is below the fuel level at checkout, the agreement's ledger carries the refuelling line computed under the refuelling rule.
        resolved_by: bill_refuelling_charge_2bf37336
        effect: >-
          The refuelling charge standing on the agreement is taken off the protected repair cost, so billing it lowers the excess the renter keeps and raises the adjustment.
    cross_category:
      - category: card
        as: history
        reads: [status, variant_name, card_transactions.amount, card_transactions.purchase_channel]
        note: The Ridgeline Consumer Credit tier, its purchases in the last 12 months and its tool rental purchases in the last 24 months decide two limit additions and the excess-sharing method.
    compute:
      - disputed_charge: "MAX('rental_charges','amount', event_type='rental_fee_charged', fee_type='damage_repair', rental_charge_id=LATEST('rental_requests','disputed_charge_id', date_field='created_at', request_type='damage_dispute', status='approved'))"
      - in_window_j: "1 if DAYS(F('returned_at'), LATEST('rental_requests','created_at', date_field='created_at', request_type='damage_dispute', status='approved')) <= P('damage_dispute_days') else 0"
      - accidental_j: "COUNT('rental_charges', event_type='rental_inspection_recorded', damage_cause='accidental')"
      - approved_disputes: "COUNT('rental_requests', request_type='damage_dispute', status='approved')"
      - already_adjusted: "SUM('rental_charges','amount', event_type='rental_charge_adjusted')"
      - acc_b: "SUM('rental_charges','amount', event_type='rental_fee_charged', fee_type='missing_accessory')"
      - fuel_b: "SUM('rental_charges','amount', event_type='rental_fee_charged', fee_type='fuel_charge')"
      - ded_b: "SUM('rental_charges','amount', event_type='rental_fee_charged', fee_type='damage_deductible')"
      - protected_cost: "MX(0, disputed_charge - acc_b - fuel_b - ded_b)"
      - card_status_j: "CFIELD('card','status')"
      - card_tier_j: "CFIELD('card','variant_name')"
      - tier_cover: "K('premier_cover_usd') if (card_status_j == 'active' and card_tier_j == 'Ridgeline Consumer Credit Card Premier') else (K('preferred_cover_usd') if (card_status_j == 'active' and card_tier_j == 'Ridgeline Consumer Credit Card Preferred') else 0)"
      - dp_paid: "SUM('rental_charges','amount', event_type='rental_damage_protection_charged')"
      - dp_cover: "K('dp_cover_high_usd') if dp_paid >= K('dp_paid_high_usd') else (K('dp_cover_mid_usd') if dp_paid >= K('dp_paid_mid_usd') else 0)"
      - card_spend_12: "XSUM('card','card_transactions','amount', within_months=12, date_field='transaction_date', event_type='card_purchase_posted')"
      - spend_cover: "K('spend_cover_high_usd') if card_spend_12 >= K('spend_high_usd') else (K('spend_cover_mid_usd') if card_spend_12 >= K('spend_mid_usd') else 0)"
      - protection_limit: "P('damage_protection_covers_up_to_usd') + tier_cover + dp_cover + spend_cover"
      - excess: "MX(0, protected_cost - protection_limit)"
      - card_rentals_24: "XCOUNT('card','card_transactions', within_months=24, date_field='transaction_date', event_type='card_purchase_posted', purchase_channel='tool_rental')"
      - kept_share: "(MN(excess, K('band_usd')) + K('band_share_pct') / 100 * MX(0, excess - K('band_usd'))) if card_rentals_24 >= K('rentals_banded_from') else ((K('flat_share_pct') / 100 * excess) if card_rentals_24 >= 1 else excess)"
      - dispute_filed_at: "LATEST('rental_requests','created_at', date_field='created_at', request_type='damage_dispute', status='approved')"
      - filed_days: "DAYS(F('returned_at'), dispute_filed_at)"
      - prompt_credit: "K('prompt_fast_credit_usd') if filed_days <= K('prompt_fast_days') else (K('prompt_slow_credit_usd') if filed_days <= K('prompt_slow_days') else 0)"
      - late_days_j: "DAYS(F('due_back_at'), F('returned_at'))"
      - schedule_credit: "K('on_time_credit_usd') if late_days_j <= 0 else (K('one_day_credit_usd') if late_days_j == 1 else 0)"
      - kept_excess: "MX(0, kept_share - prompt_credit - schedule_credit)"
      - result: "RND(int((disputed_charge - kept_excess) * 100 + 0.5 + 0.000001) / 100, 2) if (approved_disputes >= 1 and in_window_j == 1 and accidental_j >= 1 and F('damage_protection_elected') and already_adjusted == 0) else 0"
