    factors:
      - id: lost_day_counting
        effect: method
        decides: lost_days
        bindings: [lost_days]
        ladder:
          - when: "Ridgeline delivered the unit to the job site"
            method: "calendar days from report date to return date, both dates counted"
          - when: "the renter collected the unit and returned it on a calendar day after the due-back date"
            method: "calendar days from report date to due-back date"
          - when: "otherwise"
            method: "calendar days from report date to return date"
        baseline: {lost_days: "rental_days_c if DAYS(F('checkout_at'), report_at) == 0 else DAYS(report_at, F('returned_at'))"}
        evidence: [date]
        cross_difficulty: null
      - id: account_goodwill_days
        effect: parameter
        decides: goodwill_days
        bindings: [pc_status_c, gold_up_c, goodwill_days]
        ladder:
          - when: "the Pro Credit account is active and the renter holds an active ProBuild membership at Gold, Platinum or Platinum Elite"
            value: "K('goodwill_full_days') = 1 day"
          - when: "the renter has one of those two but not both"
            value: "K('goodwill_half_days') = half a day"
          - when: "otherwise (neither)"
            value: "0 days"
        baseline: {goodwill_days: "0"}
        evidence: [cross_category]
        cross_difficulty: trade
      - id: long_outage_days
        effect: parameter
        decides: disruption_days
        bindings: [outage_days, disruption_days]
        ladder:
          - when: "three times the calendar days from report date to return date is at least the rental days"
            value: "K('disruption_high_days') = half a day"
          - when: "less than that, but five times those days is at least the rental days"
            value: "K('disruption_mid_days') = a quarter day"
          - when: "otherwise"
            value: "0 days"
        baseline: {disruption_days: "0"}
        evidence: [date, history]
        cross_difficulty: null
      - id: repeat_failure_multiplier
        effect: parameter
        decides: repeat_mult
        bindings: [report_count, repeat_mult]
        ladder:
          - when: "the agreement carries three or more malfunction reports"
            value: "K('repeat_mult_three') = 1.20"
          - when: "the agreement carries exactly two malfunction reports"
            value: "K('repeat_mult_two') = 1.10"
          - when: "otherwise (a single report)"
            value: "1"
        baseline: {repeat_mult: "1"}
        evidence: [history]
