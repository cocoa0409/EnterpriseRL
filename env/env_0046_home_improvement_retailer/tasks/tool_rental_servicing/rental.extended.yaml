    compute:
      - report_at: "LATEST('rental_requests','created_at', date_field='created_at', request_type='malfunction_report')"
      - confirmed_c: "COUNT('rental_charges', event_type='rental_inspection_recorded', inspection_outcome='malfunction_confirmed')"
      - misuse_c: "COUNT('rental_charges', event_type='rental_inspection_recorded', damage_cause='misuse')"
      - eligible_c: "1 if (confirmed_c >= 1 and misuse_c == 0) else 0"
      - time_billed_c: "SUM('rental_charges','amount', event_type='rental_time_charged')"
      - c_daily_n: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='daily')"
      - c_weekly_n: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='weekly')"
      - c_four_week_n: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='four_week')"
      - c_four_hour_n: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='four_hour')"
      - c_weekend_n: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='weekend_special')"
      - rental_days_c: "c_daily_n + 7 * c_weekly_n + 28 * c_four_week_n + 0.5 * c_four_hour_n + 2 * c_weekend_n"
      - ot_posted: "SUM('rental_charges','amount', event_type='rental_fee_charged', fee_type='overtime_hours')"
      - disc_posted: "SUM('rental_charges','amount', event_type='rental_pro_discount_applied')"
      - net_daily: "(time_billed_c + ot_posted - disc_posted) / rental_days_c"
      - lost_days: "rental_days_c if DAYS(F('checkout_at'), report_at) == 0 else ((DAYS(report_at, F('returned_at')) + 1) if F('delivery_selected') else (DAYS(report_at, F('due_back_at')) if DAYS(F('due_back_at'), F('returned_at')) >= 1 else DAYS(report_at, F('returned_at'))))"
      - pc_status_c: "CFIELD('trade','status')"
      - gold_up_c: "EXISTS('pro', status='active', variant_name='ProBuild Gold') or EXISTS('pro', status='active', variant_name='ProBuild Platinum') or EXISTS('pro', status='active', variant_name='ProBuild Platinum Elite')"
      - goodwill_days: "K('goodwill_full_days') if (pc_status_c == 'active' and gold_up_c) else (K('goodwill_half_days') if (pc_status_c == 'active' or gold_up_c) else 0)"
      - outage_days: "DAYS(report_at, F('returned_at'))"
      - disruption_days: "K('disruption_high_days') if K('disruption_high_parts') * outage_days >= rental_days_c else (K('disruption_mid_days') if K('disruption_mid_parts') * outage_days >= rental_days_c else 0)"
      - report_count: "COUNT('rental_requests', request_type='malfunction_report')"
      - repeat_mult: "K('repeat_mult_three') if report_count >= 3 else (K('repeat_mult_two') if report_count == 2 else 1)"
      - pb_rental_lines: "XCOUNT('pro','pro_activity', within_months=12, date_field='activity_date', event_type='pro_spend_posted', purchase_channel='tool_rental')"
      - loyalty_mult: "K('loyalty_mult_high') if pb_rental_lines >= K('loyalty_lines_high') else (K('loyalty_mult_mid') if pb_rental_lines >= K('loyalty_lines_mid') else 1)"
      - credited_days: "lost_days + goodwill_days + disruption_days"
      - pc_invoices_c: "XCOUNT('trade','trade_transactions', within_months=12, date_field='transaction_date', event_type='trade_invoice_posted', purchase_channel='tool_rental')"
      - volume_mult: "K('volume_mult_high') if pc_invoices_c >= K('volume_invoices_high') else (K('volume_mult_mid') if pc_invoices_c >= 1 else 1)"
      - result: "RND(credited_days * net_daily * repeat_mult * loyalty_mult * volume_mult, 2) if eligible_c == 1 else 0"
