  - id: rental_ext_missing_accessory_charge
    base_policy_refs: [rental_reservations, rental_damage_protection, rental_return_fees, rental_delivery, rental_overdue_and_conversion]
    overwrite:
      - base_policy: rental_return_fees
        superseded_clause: >-
          Equipment returned needing cleaning beyond normal use incurs cleaning_fee_usd, and each accessory not returned incurs accessory_missing_fee_usd.
        replaced_by: >-
          The missing-accessory charge is the accessories charged multiplied by the class charge per accessory not returned, rounded to the nearest cent once at the end.
    trigger: state_due
    subject: [rental_fee_charged]
    computes: accessory_amount
    target_tool: bill_missing_accessories_12fefdd6
    params:
      set_count_from: 4
      forgive_one_from: 2
      premier_mult: 0.75
      preferred_mult: 0.90
      four_week_mult: 1.20
      weekly_mult: 1.10
      bundle_major_usd: 10000.00
      bundle_mid_usd: 2500.00
      bundle_major_mult: 0.50
      bundle_mid_mult: 0.75
    rule: >-
      Accessories the return inspection counted as not returned are billed once per agreement as one missing-accessory line, whatever condition the inspection recorded for the unit itself; damage protection never covers them, and equipment returned needing cleaning beyond normal use still incurs the class cleaning fee.
      The accessories charged are the accessories the return inspection counted as not returned.
      The missing-accessory charge is the accessories charged multiplied by the class charge per accessory not returned, rounded to the nearest cent once at the end.
      How the missing accessories are counted depends on how many are missing: when 4 or more are missing they are charged by the matched pair, that is half the number missing rounded up to a whole accessory; when 2 or 3 are missing, the first one is not charged and the rest are; when a single accessory is missing, it is charged.
      The Ridgeline Consumer Credit tier lowers the charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, the charge is multiplied by 0.75; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.90; in every other case it is unchanged.
      Long rentals carry an attachment surcharge: on an agreement whose rental time includes a four-week period the charge is multiplied by 1.20; on one whose rental time includes weekly periods but no four-week period, by 1.10; on one billed in daily periods only, it is unchanged.
      A heavy repair takes in the accessories: when the repair cost assessed at the same inspection is 10,000.00 dollars or more, the charge is multiplied by 0.50; when it is 2,500.00 dollars or more but below 10,000.00 dollars, by 0.75; when it is below 2,500.00 dollars, it is unchanged.
      The three multipliers act one after the other on the accessories charged multiplied by the class charge per accessory, and the rounding to the cent is made only on the final figure.
    prerequisite: []
    cross_category:
      - category: card
        as: branch
        reads: [status, variant_name]
        note: The Ridgeline Consumer Credit tier and status decide the cardholder multiplier.
    compute:
      - acc_count: "MAX('rental_charges','accessories_missing', event_type='rental_inspection_recorded')"
      - charged_count: "int((acc_count + 1) / 2) if acc_count >= K('set_count_from') else ((acc_count - 1) if acc_count >= K('forgive_one_from') else acc_count)"
      - card_status_a: "CFIELD('card','status')"
      - card_tier_a: "CFIELD('card','variant_name')"
      - card_mult_a: "K('premier_mult') if (card_status_a == 'active' and card_tier_a == 'Ridgeline Consumer Credit Card Premier') else (K('preferred_mult') if (card_status_a == 'active' and card_tier_a == 'Ridgeline Consumer Credit Card Preferred') else 1)"
      - a_four_week: "COUNT('rental_charges', event_type='rental_time_charged', rate_period='four_week')"
      - a_weekly: "COUNT('rental_charges', event_type='rental_time_charged', rate_period='weekly')"
      - length_mult: "K('four_week_mult') if a_four_week > 0 else (K('weekly_mult') if a_weekly > 0 else 1)"
      - repair_cost_a: "MAX('rental_charges','repair_cost', event_type='rental_inspection_recorded')"
      - bundle_mult: "K('bundle_major_mult') if repair_cost_a >= K('bundle_major_usd') else (K('bundle_mid_mult') if repair_cost_a >= K('bundle_mid_usd') else 1)"
      - result: "RND(charged_count * P('accessory_missing_fee_usd') * card_mult_a * length_mult * bundle_mult, 2)"
    compute_basis:
      acc_count: "The accessories charged are the accessories the return inspection counted as not returned."
      charged_count: "How the missing accessories are counted depends on how many are missing: when 4 or more are missing they are charged by the matched pair, that is half the number missing rounded up to a whole accessory; when 2 or 3 are missing, the first one is not charged and the rest are; when a single accessory is missing, it is charged."
      card_status_a: "The Ridgeline Consumer Credit tier lowers the charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, the charge is multiplied by 0.75; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.90; in every other case it is unchanged."
      card_tier_a: "The Ridgeline Consumer Credit tier lowers the charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, the charge is multiplied by 0.75; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.90; in every other case it is unchanged."
      card_mult_a: "The Ridgeline Consumer Credit tier lowers the charge: when the renter's Ridgeline Consumer Credit account is active at the Ridgeline Consumer Credit Card Premier tier, the charge is multiplied by 0.75; when it is active at the Ridgeline Consumer Credit Card Preferred tier, by 0.90; in every other case it is unchanged."
      a_four_week: "Long rentals carry an attachment surcharge: on an agreement whose rental time includes a four-week period the charge is multiplied by 1.20; on one whose rental time includes weekly periods but no four-week period, by 1.10; on one billed in daily periods only, it is unchanged."
      a_weekly: "Long rentals carry an attachment surcharge: on an agreement whose rental time includes a four-week period the charge is multiplied by 1.20; on one whose rental time includes weekly periods but no four-week period, by 1.10; on one billed in daily periods only, it is unchanged."
      length_mult: "Long rentals carry an attachment surcharge: on an agreement whose rental time includes a four-week period the charge is multiplied by 1.20; on one whose rental time includes weekly periods but no four-week period, by 1.10; on one billed in daily periods only, it is unchanged."
      repair_cost_a: "A heavy repair takes in the accessories: when the repair cost assessed at the same inspection is 10,000.00 dollars or more, the charge is multiplied by 0.50; when it is 2,500.00 dollars or more but below 10,000.00 dollars, by 0.75; when it is below 2,500.00 dollars, it is unchanged."
      bundle_mult: "A heavy repair takes in the accessories: when the repair cost assessed at the same inspection is 10,000.00 dollars or more, the charge is multiplied by 0.50; when it is 2,500.00 dollars or more but below 10,000.00 dollars, by 0.75; when it is below 2,500.00 dollars, it is unchanged."
      result: "The three multipliers act one after the other on the accessories charged multiplied by the class charge per accessory, and the rounding to the cent is made only on the final figure."
    factors:
      - id: accessory_counting
        effect: method
        decides: charged_count
        bindings: [acc_count, charged_count]
        ladder:
          - when: "4 or more accessories are missing"
            method: "charged by the matched pair: half the number missing, rounded up"
          - when: "2 or 3 accessories are missing"
            method: "the first one is not charged, the rest are"
          - when: "otherwise (a single accessory)"
            method: "each accessory missing is charged"
        baseline: {charged_count: "acc_count"}
        evidence: [history]
        cross_difficulty: null
      - id: consumer_credit_tier_multiplier
        effect: parameter
        decides: card_mult_a
        bindings: [card_status_a, card_tier_a, card_mult_a]
        ladder:
          - when: "the Ridgeline Consumer Credit account is active at the Premier tier"
            value: "K('premier_mult') = 0.75"
          - when: "the account is active at the Preferred tier"
            value: "K('preferred_mult') = 0.90"
          - when: "otherwise"
            value: "1"
        baseline: {card_mult_a: "1"}
        evidence: [cross_category]
        cross_difficulty: card
      - id: attachment_length_surcharge
        effect: parameter
        decides: length_mult
        bindings: [a_four_week, a_weekly, length_mult]
        ladder:
          - when: "the rental time includes a four-week period"
            value: "K('four_week_mult') = 1.20"
          - when: "the rental time includes weekly periods but no four-week period"
            value: "K('weekly_mult') = 1.10"
          - when: "otherwise (daily periods only)"
            value: "1"
        baseline: {length_mult: "1"}
        evidence: [history]
        cross_difficulty: null
      - id: heavy_repair_multiplier
        effect: parameter
        decides: bundle_mult
        bindings: [repair_cost_a, bundle_mult]
        ladder:
          - when: "the repair cost assessed at the same inspection is 10,000.00 dollars or more"
            value: "K('bundle_major_mult') = 0.50"
          - when: "it is 2,500.00 dollars or more but below 10,000.00 dollars"
            value: "K('bundle_mid_mult') = 0.75"
          - when: "otherwise"
            value: "1"
        baseline: {bundle_mult: "1"}
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Accessories the return inspection counted as not returned are billed once per agreement as one missing-accessory line, whatever condition the inspection recorded for the unit itself; damage protection never covers them, and equipment returned needing cleaning beyond normal use still incurs the class cleaning fee.
        The accessories charged are the accessories the return inspection counted as not returned.
        The missing-accessory charge is the accessories charged multiplied by the class charge per accessory not returned, rounded to the nearest cent once at the end.
      params: [accessory_missing_fee_usd]
    inputs:
      history:
        - {table: rental_charges, aggregate: max, field: accessories_missing, filters: {event_type: rental_inspection_recorded}}
        - {table: rental_charges, aggregate: count, field: rental_charge_id, filters: {event_type: rental_time_charged}}
