  # ---------------------------------------------------------------- task 1 ---
  - id: rental_ext_damage_deductible
    base_policy_refs: [rental_reservations, rental_damage_protection, rental_return_fees, rental_delivery, rental_overdue_and_conversion]
    overwrite:
      - base_policy: rental_damage_protection
        superseded_clause: >-
          With damage protection, accidental damage found at inspection is covered up to damage_protection_covers_up_to_usd per incident: the renter pays damage_protection_deductible_usd (fee_type damage_deductible) plus any repair cost above the coverage limit (fee_type damage_repair).
        replaced_by: >-
          On an agreement with damage protection whose return inspection found accidental damage with a repair cost above zero, the renter owes the damage deductible for the incident, billed once per agreement as one deductible line.
    trigger: state_due
    subject: [rental_fee_charged]
    computes: deductible_amount
    target_tool: bill_damage_deductible_c7701c46
    params:
      major_repair_usd: 10000.00
      major_share_pct: 2.0
      minor_repair_usd: 1500.00
      minor_share_pct: 25.0
      clean_card_mult: 0.60
      late_card_mult: 0.85
      tenure_long_months: 96
      tenure_mid_months: 36
      tenure_mult_long: 0.90
      tenure_mult_mid: 0.95
      light_hours_per_day: 4
      heavy_hours_per_day: 8
      light_use_mult: 0.90
      heavy_use_mult: 1.10
      lead_long_days: 7
      lead_short_days: 3
      lead_mult_long: 0.95
      lead_mult_short: 0.975
    rule: >-
      On an agreement with damage protection whose return inspection found accidental damage with a repair cost above zero, the renter owes the damage deductible for the incident, billed once per agreement as one deductible line.
      The damage deductible is the class deductible for damage protection, never more than the repair cost assessed at the return inspection, and it is rounded to the nearest cent once at the end.
      Agreements without damage protection, and inspections that found no accidental damage, carry no damage deductible.
      The size of the repair sets how the damage deductible is figured: when the repair cost assessed at inspection is 10,000.00 dollars or more, the deductible is the class deductible plus 2 percent of the repair cost above 10,000.00 dollars; when the repair cost is below 1,500.00 dollars, the deductible is 25 percent of the repair cost; when the repair cost is 1,500.00 dollars or more but below 10,000.00 dollars, the deductible is the class deductible.
      Ridgeline Consumer Credit standing lowers the deductible: when the renter's Ridgeline Consumer Credit account is active and shows no late fee assessed in the last 12 months, the deductible is multiplied by 0.60; when the account is active and shows one or more late fees assessed in the last 12 months, by 0.85; when the renter holds no active Ridgeline Consumer Credit account, it is unchanged.
      Cardholder tenure lowers the deductible: when the renter's Ridgeline Consumer Credit account was opened at least 96 whole calendar months before the day the deductible is billed, the deductible is multiplied by 0.90; at least 36 but fewer than 96 whole calendar months before, by 0.95; fewer than 36 whole calendar months before, or with no such account, it is unchanged.
      How hard the unit was worked moves the deductible: on metered equipment whose engine hours used average fewer than 4 hours per day of the deductible's day count, the deductible is multiplied by 0.90; on metered equipment averaging 8 or more such hours, by 1.10; on metered equipment averaging 4 to under 8 hours, and on unmetered equipment, it is unchanged.
      The day count of the deductible is the daily periods billed, plus 7 for each weekly period, 28 for each four-week period, half a day for each four-hour period and 2 for a weekend special.
      Booking ahead lowers the deductible: a reservation made at least 7 calendar days before the scheduled pickup date has the deductible multiplied by 0.95; one made 3 to 6 calendar days before, by 0.975; one made fewer than 3 calendar days before keeps it unchanged.
      A late fee falls in the last 12 months when it is dated fewer than 12 whole calendar months before the day the deductible is billed.
      The multipliers act one after the other on the deductible the size of the repair sets, the cap at the repair cost is applied to that product, and the rounding to the cent is made only on the final figure.
    prerequisite: []
    cross_category:
      - category: card
        as: history
        reads: [status, opened_date, card_transactions.fee_type]
        note: The Ridgeline Consumer Credit account status, its late fees in the last 12 months and its opening date decide two multipliers of the deductible.
    compute:
      - dp_elected_d: "1 if F('damage_protection_elected') else 0"
      - accidental_d: "COUNT('rental_charges', event_type='rental_inspection_recorded', damage_cause='accidental')"
      - repair_cost_d: "MAX('rental_charges','repair_cost', event_type='rental_inspection_recorded')"
      - covered_incident: "1 if (dp_elected_d == 1 and accidental_d >= 1 and repair_cost_d > 0) else 0"
      - sev_amount: "(P('damage_protection_deductible_usd') + K('major_share_pct') / 100 * (repair_cost_d - K('major_repair_usd'))) if repair_cost_d >= K('major_repair_usd') else ((K('minor_share_pct') / 100 * repair_cost_d) if repair_cost_d < K('minor_repair_usd') else P('damage_protection_deductible_usd'))"
      - card_status_d: "CFIELD('card','status')"
      - late_fees_12: "XCOUNT('card','card_transactions', within_months=12, date_field='transaction_date', event_type='card_fee_assessed', fee_type='late_fee')"
      - card_mult_d: "K('clean_card_mult') if (card_status_d == 'active' and late_fees_12 == 0) else (K('late_card_mult') if (card_status_d == 'active' and late_fees_12 >= 1) else 1)"
      - card_months: "MONTHS(CFIELD('card','opened_date'), NOW) if EXISTS('card') else 0"
      - tenure_mult_d: "K('tenure_mult_long') if card_months >= K('tenure_long_months') else (K('tenure_mult_mid') if card_months >= K('tenure_mid_months') else 1)"
      - u_daily: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='daily')"
      - u_weekly: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='weekly')"
      - u_four_week: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='four_week')"
      - u_four_hour: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='four_hour')"
      - u_weekend: "SUM('rental_charges','periods_count', event_type='rental_time_charged', rate_period='weekend_special')"
      - u_days: "u_daily + 7 * u_weekly + 28 * u_four_week + 0.5 * u_four_hour + 2 * u_weekend"
      - hours_per_day: "(F('hour_meter_in') - F('hour_meter_out')) / u_days if u_days > 0 else 0"
