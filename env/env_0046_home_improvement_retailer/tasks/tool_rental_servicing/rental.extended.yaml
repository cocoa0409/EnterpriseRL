  - id: rental_ext_downtime_credit
    base_policy_refs: [rental_malfunction, rental_time_billing, rental_pro_discount, rental_return_fees]
    overwrite:
      - base_policy: rental_malfunction
        superseded_clause: >-
          When the report was made within malfunction_full_credit_hours hours after checkout_at, the full rental time charged is credited; otherwise the rental time from the report to the return (or to the swap to a replacement unit) is credited, valued at the same rates.
        replaced_by: >-
          The downtime credit is the lost days multiplied by the net daily rental cost, rounded to the nearest cent once at the end.
    trigger: state_due
    subject: [rental_malfunction_credit_issued]
    computes: credit_amount
    target_tool: accept_downtime_credit_2dc14db7
    params:
      goodwill_full_days: 1.0
      goodwill_half_days: 0.5
      disruption_high_days: 0.5
      disruption_mid_days: 0.25
      disruption_high_parts: 3
      disruption_mid_parts: 5
      repeat_mult_three: 1.20
      repeat_mult_two: 1.10
      loyalty_lines_high: 5
      loyalty_lines_mid: 2
      loyalty_mult_high: 1.10
      loyalty_mult_mid: 1.05
      volume_invoices_high: 4
      volume_mult_high: 1.05
      volume_mult_mid: 1.02
    rule: >-
      A downtime credit is owed on an agreement whose return inspection recorded the malfunction as confirmed and found no damage caused by misuse; it is booked once per agreement, against the most recent malfunction report on the agreement, and it takes effect when the renter accepts it as the remedy for the breakdown.
      The downtime credit is fixed only after the agreement carries the ProBuild rental discount entry owed on its rental time.
      The downtime credit is not worked out until the agreement carries the engine overtime charge owed for its hour meter reading at return.
      The rental days of the downtime credit are the daily periods billed, plus 7 for each weekly period, 28 for each four-week period, half a day for each four-hour period and 2 for a weekend special.
      The net daily rental cost is the rental time billed plus the engine overtime charge billed, less the ProBuild rental discount posted, divided by the rental days of the downtime credit.
      When the most recent malfunction report was made on the checkout date, the lost days are all the rental days of the downtime credit; otherwise the lost days are the calendar days from the date of the most recent malfunction report to the return date.
      The downtime credit is the lost days multiplied by the net daily rental cost, rounded to the nearest cent once at the end.
      How the lost days are counted after a report made later than the checkout date depends on how the unit came back: for a unit Ridgeline delivered to the job site, the lost days are the calendar days from the report date to the return date with both dates counted; for a unit the renter collected, returned on a calendar day after the due-back date, the lost days are the calendar days from the report date to the due-back date; for any other unit, the lost days are the calendar days from the report date to the return date.
      Account goodwill adds days to the lost days: a renter whose Ridgeline Pro Credit account is active and who also holds an active ProBuild membership at the Gold, Platinum or Platinum Elite tier receives 1 extra day; a renter who has one of those two but not both receives half a day; a renter who has neither receives none.
      A long outage adds days to the lost days: when three times the calendar days from the report date to the return date is at least the rental days of the downtime credit, half a day is added; when it is less than that but five times those calendar days is at least the rental days of the downtime credit, a quarter day is added; when five times those calendar days is less than the rental days of the downtime credit, none is added.
      Repeat failures raise the credit: on an agreement carrying three or more malfunction reports the credit is multiplied by 1.20; on one carrying exactly two, by 1.10; on one carrying a single report, it is unchanged.
      ProBuild rental activity raises the credit: when the renter's ProBuild membership shows 5 or more tool rental spend postings dated fewer than 12 whole calendar months before the day the credit is booked, the credit is multiplied by 1.10; when it shows 2 to 4 such postings, by 1.05; when it shows fewer than 2, it is unchanged.
      Pro Credit rental volume raises the credit: when the renter's Ridgeline Pro Credit account carries 4 or more tool rental invoices dated fewer than 12 whole calendar months before the day the credit is booked, the credit is multiplied by 1.05; when it carries 1 to 3 such invoices, by 1.02; when it carries none, it is unchanged.
      The extra days are added to the lost days before the multiplication by the net daily rental cost, the three multipliers then act one after the other on that product, and the rounding to the cent is made only on the final figure.
    prerequisite:
      - problem: rental_ext_probuild_rental_discount
        kind: value_input
        gate: disc_posted
        form: state
        policy_source: >-
          The downtime credit is fixed only after the agreement carries the ProBuild rental discount entry owed on its rental time.
        condition: >-
          For a renter whose ProBuild membership was active on the checkout date, the agreement's ledger carries the ProBuild rental discount line computed under the ProBuild rental discount rule.
        resolved_by: post_probuild_rental_discount_391bfaed
        effect: >-
          The ProBuild rental discount posted enters the net daily rental cost with a minus sign, so posting it lowers the net daily rental cost and the credit.
      - problem: rental_ext_engine_overtime_charge
        kind: value_input
        gate: ot_posted
        form: state
        policy_source: >-
          The downtime credit is not worked out until the agreement carries the engine overtime charge owed for its hour meter reading at return.
        condition: >-
          For metered equipment, the agreement's ledger carries the engine overtime line computed under the engine overtime rule from the hour meter readings at checkout and return.
        resolved_by: bill_engine_overtime_13bb4269
        effect: >-
          The engine overtime charge billed enters the net daily rental cost with a plus sign, so billing it raises the net daily rental cost and the credit.
    cross_category:
      - category: trade
        as: branch
        reads: [status, trade_transactions.purchase_channel]
        note: The Pro Credit account status decides the goodwill days together with the ProBuild tier, and its tool rental invoices decide the volume multiplier.
      - category: pro
