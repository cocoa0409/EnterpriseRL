    baseline:
      rule: >-
        The protected repair cost is the disputed damage repair charge less the missing-accessory charge, the refuelling charge and the damage deductible standing on the agreement, and never below zero.
        The protection limit of the agreement is the class coverage limit of damage protection.
        The excess the renter keeps is the protected repair cost above the protection limit of the agreement, and never below zero.
        The adjustment is the disputed damage repair charge less the excess the renter keeps, rounded to the nearest cent once at the end, half a cent rounding up.
      params: [damage_protection_covers_up_to_usd]
    inputs:
      history:
        - {table: rental_charges, aggregate: max, field: amount, filters: {event_type: rental_fee_charged, fee_type: damage_repair}}
        - {table: rental_charges, aggregate: sum, field: amount, filters: {event_type: rental_fee_charged}}
        - {table: rental_charges, aggregate: sum, field: amount, filters: {event_type: rental_damage_protection_charged}}
        - {table: rental_requests, aggregate: latest, field: created_at, filters: {request_type: damage_dispute}}
        - {category: card, table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase_posted}}
        - {category: card, table: card_transactions, aggregate: count, field: card_transaction_id, within_months: 24, filters: {event_type: card_purchase_posted, purchase_channel: tool_rental}}
      cross_category: [card]
