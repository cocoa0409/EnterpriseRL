name: env_0047_pharmacy_benefit_manager
company: Northbridge Rx

background: |
  Northbridge Rx is a mid-sized independent pharmacy benefit manager headquartered in Columbus, Ohio, administering prescription drug coverage for about 640 employer, union and public-sector plan sponsors and roughly 4.1 million covered members across all fifty states, with its own Northbridge Rx Home Delivery Pharmacy in Grove City and Northbridge Specialty Pharmacy in Louisville.
  Its member and sponsor services center speaks in a plain, patient and precise voice, because callers are often sick, worried about cost, or administering benefits for thousands of employees.
  Every covered member holds a Pharmacy Benefit Plan enrollment under one of six plan designs — Northbridge Rx HSA Saver, Northbridge Rx Basic, Northbridge Rx Value, Northbridge Rx Select, Northbridge Rx Plus and Northbridge Rx Premier — which carries the member's deductible and out-of-pocket accumulators for the plan year and is booked through an accumulator ledger fed by every pharmacy claim, medical carrier feed and correction.
  Each member's drugs are governed by a Formulary Benefit assignment to the Northbridge Exclusive Formulary, Northbridge Value Formulary, Northbridge Standard Formulary, Northbridge Preferred Drug List, Northbridge Broad Formulary or Northbridge Open Formulary, under which formulary exception cases, transition fills and formulary change notices are recorded.
  Retail fills run through a Retail Pharmacy Network Benefit on the Northbridge Performance Network, Northbridge Essential Network, Northbridge National Network, Northbridge Preferred Savings Network, Northbridge Retail90 Network or Northbridge Open Choice Network, which books paid and reversed retail claims, refill overrides and paper-claim reimbursements.
  Members who fill by mail hold a Home Delivery Pharmacy account under Northbridge Home Delivery Voluntary, Northbridge Home Delivery Standard, Northbridge Home Delivery Maintenance 90, Northbridge Home Delivery Advantage, Northbridge Maintenance Choice or Northbridge Home Delivery Premier, with prescriptions on file, orders, shipments, a running balance, payments, credits and service requests.
  Members on biologic, oral oncology or HIV therapies hold one Specialty Pharmacy Program enrollment per therapy under Northbridge Specialty Open Access, Northbridge Specialty Preferred, Northbridge Specialty Exclusive, Northbridge Specialty Exclusive with Copay Assist, Northbridge Specialty Care Management or Northbridge Specialty Total Care, booking scheduled and shipped fills, manufacturer copay assistance, payments and care contacts.
  Prior authorizations, step therapy and quantity limit exceptions are handled under each member's Utilization Management Program — Northbridge Clinical Essentials, Northbridge Clinical Standard, Northbridge Clinical Advanced, Northbridge Clinical Advanced Plus, Northbridge Clinical Comprehensive or Northbridge Clinical Comprehensive Specialty — as review cases that end in authorizations with effective and expiration dates.
  Denied reviews, exceptions and paper claims can be appealed through the member's Member Appeals Program, administered as Northbridge Appeals Level One Delegated, Northbridge Appeals Two-Level Delegated, Northbridge Appeals Single-Level with External Review, Northbridge Appeals Two-Level with External Review, Northbridge Appeals State-Regulated Insured or Northbridge Appeals Full Fiduciary Delegation.
  Plan sponsors hold a PBM Services Agreement priced as Northbridge Traditional Pricing, Northbridge Pass-Through Pricing, Northbridge Transparent Cost-Plus, Northbridge Rebate Guarantee Plus, Northbridge Enterprise Value or Northbridge Coalition Purchasing, booked through claims and fee invoices, payments, credit memos, quarterly rebate accruals, eligibility file loads and audit findings.
  The plan design, formulary, retail network, review package and appeal package a member holds are the ones their sponsor elected, so two members of the same sponsor share them while a member's home delivery and specialty records are their own.
  Most callers are members or family members asking about a claim that rejected or cost more than expected, a prescription that needs approval, a home delivery order that is held or late, or a specialty medication whose delivery or copay card needs attention.
  A typical member has been covered for one to four plan years, fills two to six maintenance drugs at retail or by mail, and brings a history of paid and reversed claims, accumulator postings, past approvals and denials, and sometimes an open case or an unpaid balance.
  Families often hold several enrollments under one subscriber, and members on specialty therapy usually also hold retail and home delivery records for their other medicines.
  Sponsor callers are benefits managers and finance staff asking about invoices, rebates, eligibility files, audits and contract terms.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoffs

difficulties:
  - name: retail_claims_and_reimbursements
    claim:
      categories: [retail]
      event_types: [retail_claim_paid, retail_claim_reversed, retail_override_granted, retail_dmr_submitted, retail_dmr_approved, retail_dmr_denied, retail_dmr_paid, retail_maintenance_choice, retail_lockin_pharmacy_change]
    summary: >
      Members and family members call about what happened at the retail pharmacy counter: a refill that rejected as too soon before a trip, a medication that was lost or stolen, a dose that was raised, a fill that was priced higher than expected, a prescription they paid for in cash while away from a network pharmacy or abroad, or a maintenance drug that suddenly cost the full price, and the setting varies with the retail network tier, whether the benefit is active, locked in or already terminated, the member's plan design and accumulators, and the claim, override and paper-claim history of the plan year.
      The records involved are the retail benefit, the paid and reversed retail claims with their cost-share breakdown, the overrides granted per prescription and the paper-claim submissions with their decisions and payments, read together with the plan enrollment and accumulator ledger, the formulary status of the drug and any coverage review approval in force on the date of service.
      The governing rules are tier-dependent: day-supply bands and preferred-pharmacy reductions under retail_claim_cost_share, refill thresholds and accumulation under retail_refill_too_soon, per-year override quotas, lead times and police-report requirements under retail_evt_override, maintenance courtesy fills, penalties and opt-out under retail_maintenance_program (including the Maintenance Choice coupling with home delivery), one-time reversal and the reprocessing window under retail_evt_claim_reversal, filing limits, pricing and denial reasons under retail_evt_dmr, approval-before-payment under retail_evt_dmr_payment, and lock-in pharmacy changes under retail_lockin, with the plan's deductible, cost-share and run-out rules feeding the numbers; in the natural course a claim pays or rejects first, an override or reprocessing follows, and a paper claim is decided before it is paid.
      Granting overrides, reprocessing claims and deciding and paying paper claims are agent service actions on a verified account, while recording a maintenance-medication choice or asking to change the lock-in pharmacy are the member's own elections that the agent hands over for the member to make.
      Requests no retail rule can decide — such as reimbursing a drug bought from an online seller that is not a pharmacy, overriding a controlled-substance refill edit for a member who is not locked in and has no qualifying override, or paying a pharmacy's price dispute directly — fall outside the policy and are handed to a human as POLICY_NOT_COVERED.

  - name: coverage_reviews_prior_auth_step_therapy
    claim:
      categories: [review]
      event_types: [review_case_opened, review_case_info_requested, review_case_info_received, review_case_approved, review_case_denied, review_case_withdrawn, review_case_auto_approved, review_auth_granted, review_auth_terminated]
    summary: >
      Members, caregivers and authorized representatives call because a drug rejected for needing prior authorization, failed a step therapy edit or exceeded a quantity limit, because an approval is about to expire, or because they are new to Northbridge Rx and were approved for the drug at their previous carrier, and the setting varies with the member's review package tier, whether the program is active or terminated, which drugs that package manages, the member's claims history for prerequisite and target drugs, and any cases or authorizations already on file.
      The records involved are the review program, the review case events (opening, information requests and receipts, decisions, withdrawals, automated step approvals) and the authorizations with their effective and expiration dates, read together with retail, home delivery and specialty claims history, the member's formulary and plan enrollment, and any appeal decisions that put an authorization in force.
      The governing rules are tier-dependent: which drugs need review under review_requirements, intake, urgency and one-open-case limits under review_evt_case_intake, decision timeframes, information-request waits and single decisions under review_evt_decision, step protocols, lookback, minimum trial supply and grandfathering under review_step_therapy, quantity ceilings under review_quantity_limit, approval lengths, retro effective dates, renewal windows and automatic renewal under review_authorization_period, continuity-of-care windows under review_continuity_of_care, and early ends under review_evt_auth_termination; in the natural course a case is opened, information is gathered, a decision is made and an authorization follows from an approval.
      Opening, pending, deciding and recording authorizations are agent service actions on a verified account, while withdrawing a case the member opened is the member's own decision handed over to them, and the prescriber's clinical information is never something the member can supply in the prescriber's place.
      Requests outside every review rule — such as approving a drug the formulary excludes, honoring a prior carrier's approval after the continuity window, or granting coverage for an indication with no compendia support — are handed to a human as POLICY_NOT_COVERED.

  - name: formulary_exceptions_and_transition
    claim:
      categories: [formulary]
      event_types: [formulary_exception_requested, formulary_exception_statement_received, formulary_exception_approved, formulary_exception_denied, formulary_exception_withdrawn, formulary_external_review_requested, formulary_external_review_decided, formulary_transition_fill]
    summary: >
      Members call because a drug they take is not on their formulary, sits on a higher tier than they can afford, was removed or moved up during the year, or rejected right after they joined a new plan or their sponsor switched formularies, and the setting varies with the formulary tier (closed or open, four or five cost-share tiers, which drugs are NF or excluded), how long the member has been on the formulary, their claims history with formulary alternatives, and the exception cases, transition fills and notices already on file.
      The records involved are the formulary assignment with its transition start date, the exception case events from request through prescriber statement, decision, withdrawal and external review, the transition fills and the change notices, read together with retail, home delivery and specialty claims history, the plan's cost-share tiers and the member's appeal program.
      The governing rules are tier-dependent: coverage status by drug code under formulary_drug_coverage, eligible and target tiers under formulary_tier_exception, alternative trials, contraindication and stable-patient grounds and the one-open-request limit under formulary_nonformulary_exception, statement-before-approval, decision clocks, missing-statement waits and single decisions under formulary_evt_exception_timeline, approval length, strength coverage and renewal under formulary_evt_exception_duration, independent review after denial under formulary_external_exception_review, transition windows and per-drug quotas under formulary_transition_supply, and grandfathering under formulary_midyear_change; in the natural course a request is opened, the prescriber's statement arrives, and only then is it decided.
      Recording requests, statements, decisions, transition fills and external review events are agent service actions on a verified account, while withdrawing a request and asking for external review after a denial are the member's own choices that the agent hands over to them.
      Requests no formulary rule decides — such as covering a plan-excluded weight-loss drug by exception, lowering a specialty drug's tier where the formulary allows no specialty tier exception, or extending a transition window — are handed to a human as POLICY_NOT_COVERED.

  - name: home_delivery_orders_and_billing
    claim:
      categories: [mail]
      event_types: [mail_activate, mail_release, mail_close, mail_preferences_update, mail_rx_received, mail_order_placed, mail_order_shipped, mail_order_cancelled, mail_order_replaced, mail_shipping_charged, mail_payment_posted, mail_credit_issued, mail_refund_issued]
    summary: >
      Members call about home delivery: moving a retail prescription to mail, an order that has not shipped because the account is on hold, a balance they want to pay or spread out, a package that never arrived or arrived warm, a charge they think is wrong, a credit they expected back, automatic refills, or closing the account, and the setting varies with the home delivery program tier, the account status and hold reason, the balance against the credit limit, the prescriptions on file and their refills and expiration, and the order, payment and replacement history of the plan year.
      The records involved are the home delivery account with its balance, the prescriptions on file, the order events (placed, shipped, cancelled, replaced, shipping charges), the payments, credits and refunds, and the service requests for transfers, payment plans and closure, read together with the member's plan cost share, formulary tier and retail network.
      The governing rules are tier-dependent: day-supply multipliers and zero-copay generics under mail_order_cost_share, prescription validity, refill timing and one open order per prescription under mail_evt_order_dispense, credit limits, holds and their release under mail_evt_credit_hold, payments under mail_evt_payment, payment plan thresholds and lengths under mail_payment_plan, transfer-request-before-receipt under mail_rx_transfer, automatic refills under mail_auto_refill, shipping fees under mail_shipping, report windows and replacement quotas under mail_evt_replacement, cancellation and credits under mail_evt_cancel_credit, credit-balance refunds under mail_credit_balance_refund, and closure under mail_account_closure; in the natural course a prescription reaches the pharmacy before an order is placed, and a balance is settled before a held order ships.
      Placing, shipping, cancelling and replacing orders, posting payments and credits and releasing holds are agent service actions on a verified account, while choosing a payment plan, enrolling in automatic refills, confirming a closure and paying with their own card are the member's own actions that the agent hands over to them.
      Requests outside every home delivery rule — such as taking back dispensed medication for credit, shipping to an address abroad, or transferring a Schedule II prescription from a retail pharmacy — are handed to a human as POLICY_NOT_COVERED.

  - name: specialty_enrollment_and_assistance
    claim:
      categories: [specialty]
      event_types: [specialty_start_verification, specialty_activate, specialty_hold, specialty_resume, specialty_decline, specialty_disenroll, specialty_program_update, specialty_fill_scheduled, specialty_fill_shipped, specialty_fill_reshipped, specialty_assistance_loaded, specialty_assistance_applied, specialty_payment_posted, specialty_care_contact]
    summary: >
      Members on specialty therapies and their caregivers call about getting started after a referral, a first shipment that is waiting on approval, a copay card or maximizer program, a delivery that was missed or arrived warm, a therapy paused for a hospital stay, a balance that is holding shipments, or moving the prescription to another pharmacy, and the setting varies with the specialty program tier, the enrollment status and hold reason, the number of therapies the member holds, the manufacturer assistance remaining, and the fill, payment and care history.
      The records involved are the specialty enrollments with their assistance balance and balance due, the scheduled, shipped and reshipped fills, the assistance and payment ledger, the care contacts and the service requests for transfers and disenrollment, read together with the member's coverage review authorizations, formulary status, plan accumulators and accumulator program.
      The governing rules are tier-dependent: one enrollment per drug and combined credit limits under specialty_agg_multi_holding and specialty_agg_therapy_coordination, exclusivity and courtesy fills under specialty_exclusivity, referral expiry under specialty_referral_intake, activation prerequisites under specialty_activation, assistance coordination, variable copay floors and maximizer pricing under specialty_cost_share_assistance and specialty_maximizer, consent-before-load under specialty_evt_assistance, split fills under specialty_split_fill, scheduling, shipping and biosimilar incentives under specialty_evt_fill, reship windows and quotas under specialty_evt_reship, hold causes and maximum length under specialty_hold_rules, and transfer-out under specialty_disenrollment_transfer; in the natural course benefits are verified before activation, consent precedes assistance, and a fill is scheduled before it ships.
      Verifying benefits, activating, holding and resuming enrollments, scheduling and shipping fills, applying assistance and recording care contacts are agent service actions on a verified account, while consenting to a copay program, enrolling in the maximizer, declining the program and confirming a transfer or disenrollment are the member's own decisions that the agent hands over to them.
      Requests no specialty rule decides — such as applying one drug's manufacturer card to another therapy, shipping a specialty drug abroad, or waiving a balance outside the listed credits — are handed to a human as POLICY_NOT_COVERED.
