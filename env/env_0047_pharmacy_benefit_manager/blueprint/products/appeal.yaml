category: appeal
display_name: Member Appeals Program

binding:
  holding_table: appeal_programs
  event_tables: [appeal_cases]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_effective, active, runout, closed]
  transitions:
    - {from: pending_effective, to: active, by: system, means: Plan coverage takes effect and appeal rights apply.}
    - {from: pending_effective, to: closed, by: system, means: The future-dated plan enrollment is cancelled before it takes effect.}
    - {from: active, to: runout, by: system, means: Plan coverage ends; denials from covered dates stay appealable during runout.}
    - {from: runout, to: active, by: system, means: A COBRA reinstatement restores coverage.}
    - {from: runout, to: closed, by: system, means: The runout period ends.}

accounts: []

parameter_schema:
  internal_levels: number of internal appeal levels before the internal process is exhausted
  level1_decided_by: who decides a first-level appeal; enum
  level2_decided_by: 'who decides a second-level appeal: northbridge, plan_sponsor (the sponsor keeps final fiduciary authority) or not_applicable (single level); enum'
  filing_limit_days: calendar days after the denial notice date (notice date as day zero) within which a first-level appeal must be filed
  level2_filing_limit_days: calendar days after the first-level decision (decision date as day zero) within which a second-level appeal must be filed (0 where single level)
  pre_service_decision_days: calendar days from filing within which each internal level decides a standard pre-service appeal
  post_service_decision_days: calendar days from filing within which each internal level decides a post-service (already paid by the member) appeal
  urgent_decision_hours: hours from filing within which an urgent appeal is decided across all internal levels
  urgent_requires_prescriber_attestation: an appeal is urgent only on the prescriber's attestation (or a physician with knowledge of the condition); boolean
  oral_urgent_appeal_allowed: urgent appeals may be filed by phone; boolean
  oral_standard_appeal_allowed: standard appeals may be filed by phone instead of in writing; boolean
  representative_form_required: an appeal filed by someone other than the member or the prescriber needs an appointment-of-representative form; boolean
  info_response_days: calendar days the appellant has to send information the reviewer asks for (request date as day zero)
  decision_extension_days: one extension in calendar days allowed for a standard post-service appeal when the appellant is asked for missing information
  acknowledgment_business_days: business days after filing within which the appeal is acknowledged in writing
  clinical_peer_reviewer_required: an appeal of a clinical denial is decided by a clinical peer who took no part in the original denial; boolean
  independent_reviewer_each_level: each level is decided by a reviewer who decided no earlier level and is not subordinate to one; boolean
  case_file_access_free: the appellant may obtain the case file and criteria free of charge; boolean
  new_evidence_shared_before_decision: new evidence or rationale relied on at appeal is sent to the appellant before the decision; boolean
  concurrent_care_continuation: an ongoing therapy whose coverage is reduced or ended stays covered while an appeal of that decision is pending; boolean
  external_review_available: a final internal denial may go to external review; boolean
  external_review_process: 'external review route: federal_iro (independent review organization under the federal process), state_process (the state insurance department''s process) or none; enum'
  external_review_filing_months: months after the final internal denial notice within which external review must be requested (0 where not available)
  external_standard_decision_days: calendar days from the reviewer's receipt within which a standard external review is decided (0 where not available)
  external_expedited_decision_hours: hours within which an expedited external review is decided (0 where not available)
  external_review_fee: fee charged to the member to file external review, refunded when the denial is overturned, USD
  external_review_scope: 'denials eligible for external review: medical_judgment (medical necessity, appropriateness, experimental status) or all_adverse; enum'
  expedited_external_concurrent_with_internal: an urgent case may go to expedited external review at the same time as the urgent internal appeal; boolean
  deemed_exhaustion: when the plan does not follow the claims procedure the member may go straight to external review; boolean
  overturn_effectuation_hours: hours after an overturn within which coverage is put in effect for a pre-service appeal
  overturn_post_service_payment_days: calendar days after an overturn within which a post-service reimbursement is paid
  overturn_external_effectuation_hours: hours after an external overturn within which coverage is put in effect
  appeal_subjects: denials that may be appealed through this program
  one_open_appeal_per_denial: only one undecided appeal per denied record and level; boolean
  withdrawal_allowed: the appellant may withdraw an undecided appeal; boolean
  withdrawal_refile_within_limit: a withdrawn appeal may be refiled if the filing limit has not passed; boolean
  non_english_notice_threshold_pct: share of a county's population literate only in one non-English language at which notices carry a statement of language assistance in that language, percent
  runout_after_coverage_days: calendar days after the coverage end date during which the appeal program stays in runout so denials from covered dates can still be appealed
  ombudsman_referral: the denial notice names the state consumer assistance program; boolean
  sponsor_level2_decision_days: calendar days the plan sponsor has to decide a second-level appeal it keeps (0 where Northbridge decides)
  sponsor_case_file_transfer_business_days: business days to send a second-level case file to the plan sponsor (0 where Northbridge decides)
  grievance_resolution_days: calendar days to resolve a service complaint that is not an appeal of a denial
  record_retention_years: years appeal case files are kept
  urgent_intake_24x7: urgent appeals are taken around the clock; boolean
  pre_service_default_when_unclear: an appeal whose timing is unclear is handled as pre-service; boolean
  external_decision_binding: an external reviewer's overturn binds the plan; boolean
  level1_acknowledges_urgency_downgrade: an appeal filed as urgent without the required attestation is handled as standard and the appellant told so in the acknowledgment; boolean
  retro_reimbursement_on_overturn: a member who paid for the drug while the appeal was pending is reimbursed at the network rate less normal cost share after an overturn; boolean

