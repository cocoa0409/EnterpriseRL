events:
  - type: appeal_enroll
    target: appeal_programs
    mutation: create
    meaning: An appeal program is opened for a member when the plan enrollment is created.
    grain: one row per plan enrollment
    fields:
      customer_id: covered member
      plan_enrollment_id: plan enrollment it belongs to
      variant_name: appeal package the sponsor elected
      effective_date: plan coverage effective date
    triggers: []
  - type: appeal_activate
    target: appeal_programs
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: Appeal rights take effect with plan coverage.
    grain: one row per transaction
    fields:
      effective_date: the effective date reached
    triggers: []
  - type: appeal_cancel
    target: appeal_programs
    mutation: {transition: {from: pending_effective, to: closed}}
    meaning: The program closes because the enrollment was cancelled before it took effect.
    grain: one row per transaction
    fields:
      end_date: day before the cancelled effective date
    triggers: []
  - type: appeal_runout
    target: appeal_programs
    mutation: {transition: {from: active, to: runout}}
    meaning: Plan coverage ended and the program enters runout.
    grain: one row per transaction
    fields:
      end_date: last day of plan coverage
    triggers: []
  - type: appeal_reinstate
    target: appeal_programs
    mutation: {transition: {from: runout, to: active}}
    meaning: A COBRA reinstatement restores the program.
    grain: one row per transaction
    fields:
      end_date: cleared, because coverage continues
    triggers: []
  - type: appeal_close
    target: appeal_programs
    mutation: {transition: {from: runout, to: closed}}
    meaning: The runout period ends and the program closes.
    grain: one row per transaction
    fields:
      end_date: unchanged last day of coverage, restated
    triggers: []
  - type: appeal_filed
    target: appeal_cases
    meaning: An appeal of one denial is filed at one level.
    grain: one row per appeal filed at one level for one denied record
    distinguish_by: [denied_record_id, appeal_level, event_at]
    fields:
      appeal_level: level filed
      appeal_subject: kind of denial
      denied_record_id: the denied record
      denial_notice_date: date of the denial being appealed
      drug_name: drug
      appeal_priority: standard or urgent
      service_timing: pre or post service
      requested_by: who filed
      event_at: moment filed
    triggers: []
  - type: appeal_info_requested
    target: appeal_cases
    meaning: The reviewer asks the appellant for information needed to decide.
    grain: one row per information request on one appeal
    distinguish_by: [source_appeal_id, event_at]
    fields:
      source_appeal_id: the appeal
      appeal_level: its level
      drug_name: drug
      event_at: moment of the request
    triggers: []
  - type: appeal_upheld
    target: appeal_cases
    meaning: An internal appeal is decided and the denial stands.
    grain: one row per internal decision upholding one appeal
    distinguish_by: [source_appeal_id]
    fields:
      source_appeal_id: the appeal
      appeal_level: its level
      appeal_subject: kind of denial
      denied_record_id: the denied record
      drug_name: drug
      decision_reason: reason
      event_at: moment of decision
    triggers: []
  - type: appeal_overturned
    target: appeal_cases
    meaning: An internal appeal is decided in the member's favour and the denial is reversed.
    grain: one row per internal decision overturning one appeal
    distinguish_by: [source_appeal_id]
    fields:
      source_appeal_id: the appeal
      appeal_level: its level
      appeal_subject: kind of denial
      denied_record_id: the denied record
      drug_name: drug
      decision_reason: reason
      event_at: moment of decision
    triggers:
      - event: review:review_auth_granted
        when: {appeal_subject: coverage_review_denial}
        map: {source_case_id: denied_record_id, drug_name: drug_name, auth_basis: appeal_overturn}
      - event: formulary:formulary_exception_approved
        when: {appeal_subject: formulary_exception_denial}
        map: {source_exception_id: denied_record_id, drug_name: drug_name, decision_reason: appeal_overturned}
      - event: retail:retail_dmr_approved
        when: {appeal_subject: paper_claim_denial}
        map: {source_reimbursement_id: denied_record_id, drug_name: drug_name, decision_reason: approved_network_rate}
  - type: appeal_withdrawn
    target: appeal_cases
    meaning: The appellant withdraws an undecided appeal.
    grain: one row per withdrawn appeal
    distinguish_by: [source_appeal_id]
    fields:
      source_appeal_id: the appeal
      appeal_level: its level
      requested_by: who withdrew it
      event_at: moment of withdrawal
    triggers: []
  - type: appeal_external_requested
    target: appeal_cases
    meaning: The member asks for external review of a final internal denial.
    grain: one row per external review request on one denied record
    distinguish_by: [denied_record_id, event_at]
    fields:
      appeal_level: external
      appeal_subject: kind of denial
      denied_record_id: the denied record
      denial_notice_date: date of the final internal decision
      drug_name: drug
      appeal_priority: standard or expedited (urgent)
      requested_by: who asked
      event_at: moment requested
    triggers: []
  - type: appeal_external_decided
    target: appeal_cases
    meaning: The external reviewer returns its decision.
    grain: one row per external decision
    distinguish_by: [source_appeal_id]
    fields:
      source_appeal_id: the external review request
      appeal_subject: kind of denial
      denied_record_id: the denied record
      drug_name: drug
      review_outcome: upheld or overturned
      event_at: moment received
    triggers:
      - event: review:review_auth_granted
        when: {review_outcome: overturned, appeal_subject: coverage_review_denial}
        map: {source_case_id: denied_record_id, drug_name: drug_name, auth_basis: appeal_overturn}
      - event: formulary:formulary_exception_approved
        when: {review_outcome: overturned, appeal_subject: formulary_exception_denial}
        map: {source_exception_id: denied_record_id, drug_name: drug_name, decision_reason: iro_overturned}
      - event: retail:retail_dmr_approved
        when: {review_outcome: overturned, appeal_subject: paper_claim_denial}
        map: {source_reimbursement_id: denied_record_id, drug_name: drug_name, decision_reason: approved_network_rate}

measures:
  - id: appeal_msr_open_appeals_for_denial
    window: all time up to frozen_time
    measure: count of appeal_filed rows for the same denied_record_id and appeal_level that have no appeal_upheld, appeal_overturned or appeal_withdrawn row pointing at them

policies:
  - id: appeal_agg_multi_holding
    subject: [appeal_enroll]
    rule: >-
      A member holds at most one appeal program that is not closed, tied to their plan enrollment.
      A new appeal program may be opened only when no appeal program of that member is pending_effective, active or runout.
    eligibility:
      - id: one_open_program
        applies_to: [appeal_enroll]
        kind: dedup
        condition: A new appeal program may be opened only when no appeal program of that member is pending_effective, active or runout.
        evidence_fields: [appeal_programs.customer_id, appeal_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_programs.customer_id]
          action_bindings:
            appeal_programs.customer_id: customer_id
        dedup_contract:
          table: appeal_programs
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_effective, active, runout]}
          distinct_fields: [effective_date]
    params:
      max_per_customer: 1

  - id: appeal_evt_filing
    subject: [appeal_filed]
    rule: >-
      An appeal may be filed by the member, the prescriber, or an authorized representative with an appointment-of-representative form on file when representative_form_required is true, against a denial listed in appeal_subjects: a denied coverage review case, a denied formulary exception, or a denied paper claim.
      A first-level appeal must be filed no later than filing_limit_days calendar days after the denial notice date, the notice date being day zero; a later filing is upheld with filed_late without review of the merits.
      An appeal can be filed only for a denial that exists on the member's records.
      While one_open_appeal_per_denial is true, only one undecided appeal may exist per denied record and level: an appeal may be filed only when no appeal at the same level for the same denied record is still undecided.
      Urgent appeals may be filed by phone when oral_urgent_appeal_allowed is true; standard appeals by phone only when oral_standard_appeal_allowed is true, otherwise in writing; an appeal is urgent only on the prescriber's attestation while urgent_requires_prescriber_attestation is true.
      The appeal is acknowledged within acknowledgment_business_days business days.
    eligibility:
      - id: filed_in_time
        applies_to: [appeal_filed]
        kind: time
        condition: A first-level appeal must be filed no later than filing_limit_days calendar days after the denial notice date, the notice date being day zero; a later filing is upheld with filed_late without review of the merits.
        evidence_fields: [appeal_cases.denial_notice_date, appeal_cases.denied_record_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.denied_record_id]
          action_bindings:
            appeal_cases.denied_record_id: denied_record_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the denial notice date
          anchor_source: appeal_cases.denial_notice_date
          relation: not_after
          duration_source: variants.filing_limit_days
          unit: calendar_days
          counting_rule: the notice date being day zero
          boundary: inclusive
      - id: denial_exists
        applies_to: [appeal_filed]
        kind: authorization
        condition: An appeal can be filed only for a denial that exists on the member's records.
        evidence_fields: [review_cases.review_case_id, formulary_exceptions.formulary_exception_id, retail_reimbursements.retail_reimbursement_id, appeal_cases.denied_record_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.denied_record_id]
          action_bindings:
            appeal_cases.denied_record_id: denied_record_id
      - id: one_open_appeal
        applies_to: [appeal_filed]
        kind: dedup
        condition: an appeal may be filed only when no appeal at the same level for the same denied record is still undecided.
        evidence_fields: [appeal_cases.denied_record_id, appeal_cases.appeal_level, appeal_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.denied_record_id, appeal_cases.appeal_level]
          action_bindings:
            appeal_cases.denied_record_id: denied_record_id
            appeal_cases.appeal_level: appeal_level
        dedup_contract:
          table: appeal_cases
          mode: separate_record
          object_bindings: {denied_record_id: denied_record_id, appeal_level: appeal_level}
          duplicate_filters: {event_type: [appeal_filed]}
          distinct_fields: [event_at]
    measures: [appeal_msr_open_appeals_for_denial]

  - id: appeal_levels
    subject: [appeal_filed, appeal_upheld, appeal_overturned]
    rule: >-
      A package with internal_levels of two lets a member whose first-level appeal is upheld file a second-level appeal no later than level2_filing_limit_days calendar days after the first-level decision, the decision date being day zero; a single-level package exhausts the internal process at the first decision.
      Level 1 is decided by the party level1_decided_by names; level 2 is decided by whoever level2_decided_by names, and when that is the plan sponsor the case file goes to the sponsor within sponsor_case_file_transfer_business_days business days and the sponsor decides within sponsor_level2_decision_days.
      Each level is decided by a reviewer independent of every earlier decision when independent_reviewer_each_level is true, and a clinical denial is reviewed by a clinical peer when clinical_peer_reviewer_required is true.
      A second-level appeal may be filed only after a first-level appeal on the same denied record has been upheld.
    eligibility:
      - id: level2_after_level1_upheld
        applies_to: [appeal_filed]
        kind: authorization
        condition: A second-level appeal may be filed only after a first-level appeal on the same denied record has been upheld.
        evidence_fields: [appeal_cases.denied_record_id, appeal_cases.appeal_level, appeal_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.denied_record_id]
          action_bindings:
            appeal_cases.denied_record_id: denied_record_id
    params:
      per_tier:
        Northbridge Appeals Level One Delegated: {levels: "=internal_levels", level2_by: "=level2_decided_by", level2_filing: "=level2_filing_limit_days"}
        Northbridge Appeals Two-Level Delegated: {levels: "=internal_levels", level2_by: "=level2_decided_by", level2_filing: "=level2_filing_limit_days"}
        Northbridge Appeals Single-Level with External Review: {levels: "=internal_levels", level2_by: "=level2_decided_by", level2_filing: "=level2_filing_limit_days"}
        Northbridge Appeals Two-Level with External Review: {levels: "=internal_levels", level2_by: "=level2_decided_by", level2_filing: "=level2_filing_limit_days"}
        Northbridge Appeals State-Regulated Insured: {levels: "=internal_levels", level2_by: "=level2_decided_by", level2_filing: "=level2_filing_limit_days"}
        Northbridge Appeals Full Fiduciary Delegation: {levels: "=internal_levels", level2_by: "=level2_decided_by", level2_filing: "=level2_filing_limit_days"}

  - id: appeal_evt_decision
    subject: [appeal_info_requested, appeal_upheld, appeal_overturned]
    rule: >-
      Each internal level decides a standard pre-service appeal within pre_service_decision_days and a post-service appeal within post_service_decision_days calendar days of filing; an urgent appeal is decided within urgent_decision_hours across all levels.
      When information is missing the appellant is asked for it and has info_response_days to send it; a standard post-service decision may then take one extension of decision_extension_days.
      New evidence relied on at appeal is shared with the appellant before the decision when new_evidence_shared_before_decision is true, and the case file is free when case_file_access_free is true.
      An appeal is overturned with criteria_met_on_appeal or new_information when the record, including anything submitted on appeal, meets the criteria the original denial applied; otherwise it is upheld with criteria_not_met.
      An appeal of something that is not a denial (for example a request that was withdrawn) is upheld with not_appealable.
      An appeal takes exactly one decision: an appeal may be decided only when it has no decision or withdrawal yet.
    eligibility:
      - id: decide_once
        applies_to: [appeal_upheld, appeal_overturned]
        kind: dedup
        condition: an appeal may be decided only when it has no decision or withdrawal yet.
        evidence_fields: [appeal_cases.source_appeal_id, appeal_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.source_appeal_id]
          action_bindings:
            appeal_cases.source_appeal_id: source_appeal_id
        dedup_contract:
          table: appeal_cases
          mode: separate_record
          object_bindings: {source_appeal_id: source_appeal_id}
          duplicate_filters: {event_type: [appeal_upheld, appeal_overturned, appeal_withdrawn]}
          distinct_fields: []

  - id: appeal_overturn_effectuation
    subject: [appeal_overturned, appeal_external_decided]
    rule: >-
      An overturn reverses the original denial on its own record: a coverage review denial becomes an authorization with auth_basis appeal_overturn, a formulary exception denial becomes an approval, and a paper-claim denial becomes an approved reimbursement.
      The approval runs for the period the original program's rules set from the overturn date, and coverage is put in effect within overturn_effectuation_hours of an internal overturn or overturn_external_effectuation_hours of an external one.
      When retro_reimbursement_on_overturn is true a member who paid for the drug while the appeal was pending is reimbursed through a paper claim, paid within overturn_post_service_payment_days.
    eligibility: []

  - id: appeal_external_review
    subject: [appeal_external_requested, appeal_external_decided]
    rule: >-
      When external_review_available is true a member whose internal appeals are exhausted (or deemed exhausted when deemed_exhaustion is true) may request external review through external_review_process, for a denial within external_review_scope.
      External review must be requested no later than external_review_filing_months months after the final internal decision, the expiry falling on the same day-of-month that many months later or on the last day of the month when that day does not exist.
      An external review may be requested only after the internal appeals on the same denied record are exhausted.
      A standard external review is decided within external_standard_decision_days of the reviewer's receipt and an expedited one within external_expedited_decision_hours; when expedited_external_concurrent_with_internal is true an urgent case may go to expedited external review while the urgent internal appeal is pending.
      The member pays external_review_fee, refunded if the denial is overturned; an overturn binds the plan when external_decision_binding is true.
    eligibility:
      - id: internal_exhausted
        applies_to: [appeal_external_requested]
        kind: authorization
        condition: An external review may be requested only after the internal appeals on the same denied record are exhausted.
        evidence_fields: [appeal_cases.denied_record_id, appeal_cases.appeal_level, appeal_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.denied_record_id]
          action_bindings:
            appeal_cases.denied_record_id: denied_record_id
      - id: external_in_time
        applies_to: [appeal_external_requested]
        kind: time
        condition: External review must be requested no later than external_review_filing_months months after the final internal decision, the expiry falling on the same day-of-month that many months later or on the last day of the month when that day does not exist.
        evidence_fields: [appeal_cases.denial_notice_date, appeal_cases.denied_record_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.denied_record_id]
          action_bindings:
            appeal_cases.denied_record_id: denied_record_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the final internal decision
          anchor_source: appeal_cases.denial_notice_date
          relation: not_after
          duration_source: variants.external_review_filing_months
          unit: calendar_months
          counting_rule: the expiry falling on the same day-of-month that many months later or on the last day of the month when that day does not exist
          boundary: inclusive
    params:
      per_tier:
        Northbridge Appeals Level One Delegated: {available: "=external_review_available", process: "=external_review_process", fee: "=external_review_fee"}
        Northbridge Appeals Two-Level Delegated: {available: "=external_review_available", process: "=external_review_process", fee: "=external_review_fee"}
        Northbridge Appeals Single-Level with External Review: {available: "=external_review_available", process: "=external_review_process", fee: "=external_review_fee"}
        Northbridge Appeals Two-Level with External Review: {available: "=external_review_available", process: "=external_review_process", fee: "=external_review_fee"}
        Northbridge Appeals State-Regulated Insured: {available: "=external_review_available", process: "=external_review_process", fee: "=external_review_fee"}
        Northbridge Appeals Full Fiduciary Delegation: {available: "=external_review_available", process: "=external_review_process", fee: "=external_review_fee"}

  - id: appeal_concurrent_care
    subject: [appeal_filed]
    rule: >-
      When concurrent_care_continuation is true and the appeal concerns an ongoing therapy whose coverage was reduced or ended (a renewal denial or a mid-year removal), the drug stays covered at its prior status while the appeal is pending; coverage of a new therapy never continues during an appeal.
    eligibility: []

  - id: appeal_withdrawal
    subject: [appeal_withdrawn]
    rule: >-
      When withdrawal_allowed is true the appellant may withdraw an undecided appeal; a withdrawn appeal takes no decision and may be refiled while the original filing limit has not passed when withdrawal_refile_within_limit is true.
      An appeal may be withdrawn only when it has no decision or earlier withdrawal.
    eligibility:
      - id: withdraw_undecided
        applies_to: [appeal_withdrawn]
        kind: dedup
        condition: An appeal may be withdrawn only when it has no decision or earlier withdrawal.
        evidence_fields: [appeal_cases.source_appeal_id, appeal_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.source_appeal_id]
          action_bindings:
            appeal_cases.source_appeal_id: source_appeal_id
        dedup_contract:
          table: appeal_cases
          mode: separate_record
          object_bindings: {source_appeal_id: source_appeal_id}
          duplicate_filters: {event_type: [appeal_upheld, appeal_overturned, appeal_withdrawn]}
          distinct_fields: []

  - id: appeal_lifecycle
    subject: [appeal_enroll, appeal_activate, appeal_cancel, appeal_runout, appeal_reinstate, appeal_close]
    rule: >-
      The appeal program follows the plan enrollment: it opens with it, takes effect on its effective date, and enters runout when coverage ends, staying there for runout_after_coverage_days so denials from covered dates can still be appealed; it then closes.
      Notices carry language assistance where non_english_notice_threshold_pct is met, name the state consumer assistance program when ombudsman_referral is true, and case files are kept record_retention_years years.
      Service complaints that are not appeals of a denial are resolved within grievance_resolution_days.
      Urgent appeals are taken around the clock when urgent_intake_24x7 is true; an appeal whose timing is unclear is handled as pre-service when pre_service_default_when_unclear is true, and one filed as urgent without the required attestation is handled as standard when level1_acknowledges_urgency_downgrade is true.
    eligibility: []
