events:
  - type: formulary_assign
    target: formulary_assignments
    mutation: create
    meaning: A formulary assignment is opened for a member when the plan enrollment is created.
    grain: one row per plan enrollment
    fields:
      customer_id: covered member
      plan_enrollment_id: plan enrollment the assignment belongs to
      variant_name: formulary the sponsor elected
      effective_date: plan coverage effective date
      transition_start_date: equal to the effective date
    triggers: []
  - type: formulary_activate
    target: formulary_assignments
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: The formulary assignment takes effect with the plan coverage.
    grain: one row per transaction
    fields:
      effective_date: the effective date reached
    triggers: []
  - type: formulary_terminate
    target: formulary_assignments
    mutation:
      transition:
        - {from: active, to: terminated}
        - {from: pending_effective, to: terminated}
    meaning: The formulary assignment ends because plan coverage ended or was cancelled.
    grain: one row per transaction
    fields:
      end_date: last day of plan coverage
    triggers: []
  - type: formulary_reinstate
    target: formulary_assignments
    mutation: {transition: {from: terminated, to: active}}
    meaning: The formulary assignment is restored by a COBRA reinstatement of the plan enrollment.
    grain: one row per transaction
    fields:
      end_date: cleared, because coverage continues
    triggers: []
  - type: formulary_reassign
    target: formulary_assignments
    mutation: update
    meaning: The sponsor moves its members to a different formulary, normally at plan year renewal.
    grain: one row per transaction
    fields:
      variant_name: the new formulary
      formulary_change_date: date the new formulary takes effect
      transition_start_date: equal to the formulary change date
    triggers: []
  - type: formulary_exception_requested
    target: formulary_exceptions
    meaning: A tier or non-formulary exception request is received for one drug.
    grain: one row per exception request for one drug
    distinguish_by: [drug_name, exception_type, event_at]
    fields:
      drug_name: drug requested
      drug_strength: strength and form prescribed
      exception_type: tier or non-formulary exception
      review_priority: standard or expedited
      requested_by: member, prescriber or authorized representative
      prescriber_npi: prescriber NPI
      event_at: moment the request was received
    triggers: []
  - type: formulary_exception_statement_received
    target: formulary_exceptions
    meaning: The prescriber supporting statement for an open exception request is received.
    grain: one row per statement received for one request
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the request the statement supports
      drug_name: drug of the request
      exception_type: type of the request
      review_priority: priority attested by the prescriber (an expedited attestation upgrades a standard request)
      prescriber_npi: NPI of the prescriber giving the statement
      statement_basis: clinical ground stated
      event_at: moment the statement was received
    triggers: []
  - type: formulary_exception_approved
    target: formulary_exceptions
    meaning: An exception request is approved and the drug is covered at the approved tier for the approval period.
    grain: one row per approval of one request
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the request approved
      drug_name: drug of the request
      exception_type: type of the request
      review_priority: priority under which it was decided
      decision_reason: criteria_met, iro_overturned or appeal_overturned
      approved_tier: tier at which the drug is covered
      approval_effective_date: first day of the approval
      approval_expiration_date: last day of the approval
      event_at: moment of the decision
    triggers: []
  - type: formulary_exception_denied
    target: formulary_exceptions
    meaning: An exception request is denied.
    grain: one row per denial of one request
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the request denied
      drug_name: drug of the request
      exception_type: type of the request
      review_priority: priority under which it was decided
      decision_reason: reason for the denial
      event_at: moment of the decision
    triggers: []
  - type: formulary_exception_withdrawn
    target: formulary_exceptions
    meaning: The requester withdraws an exception request before it is decided.
    grain: one row per withdrawn request
    distinguish_by: [source_exception_id]
    fields:
      source_exception_id: the request withdrawn
      drug_name: drug of the request
      requested_by: who withdrew it (must be the requester or the member)
      event_at: moment of the withdrawal
    triggers: []
  - type: formulary_external_review_requested
    target: formulary_exceptions
    meaning: The member, representative or prescriber asks for an independent external exception review of a denied exception.
    grain: one row per external review request on one denial
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the original request whose denial is reviewed
      drug_name: drug of the request
      review_priority: standard or expedited external review
      requested_by: who asked for the review
      event_at: moment the review request was received
    triggers: []
  - type: formulary_external_review_decided
    target: formulary_exceptions
    meaning: The independent review organization returns its decision on an external exception review.
    grain: one row per external review decision
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the original request reviewed
      drug_name: drug of the request
      review_outcome: upheld or overturned
      event_at: moment the decision was received
    triggers:
      - event: formulary:formulary_exception_approved
        when: {review_outcome: overturned}
        map: {source_exception_id: source_exception_id, drug_name: drug_name, decision_reason: iro_overturned}
  - type: formulary_transition_fill
    target: formulary_transition_fills
    meaning: A temporary transition supply of a non-formulary drug is allowed for a member in a transition window.
    grain: one row per transition fill of one drug
    distinguish_by: [drug_name, fill_date]
    fields:
      drug_name: drug dispensed
      drug_strength: strength dispensed
      fill_date: date of service
      days_supply: days supply dispensed
      transition_basis: new enrollment or formulary change
      dispensing_channel: retail, home delivery or specialty
    triggers: []
  - type: formulary_change_notice
    target: formulary_notices
    meaning: An affected member is notified of a formulary change to a drug they take.
    grain: one row per drug change notified to one member
    distinguish_by: [drug_name, change_effective_date]
    fields:
      drug_name: drug changing
      change_type: kind of change
      new_status: status after the change
      notice_date: date notice was sent
      change_effective_date: date the change takes effect
    triggers: []

measures:
  - id: formulary_msr_transition_fills_in_window
    window: the member's current transition window, from transition_start_date as day 1 through day transition_window_days
    measure: count of formulary_transition_fill rows on this assignment for the same drug_name with fill_date inside the window
  - id: formulary_msr_alternative_trials
    window: alternative_trial_lookback_days calendar days ending on the exception request date (request date as day zero)
    measure: number of distinct formulary drugs in the requested drug's therapeutic class whose paid retail claims, shipped home delivery orders and shipped specialty fills for the member add up to at least alternative_trial_min_days_supply days supply

policies:
  - id: formulary_agg_multi_holding
    subject: [formulary_assign]
    rule: >-
      A member holds at most one formulary assignment that is not terminated, tied to their single open plan enrollment.
      A new assignment may be opened only when no assignment of that member is pending_effective or active.
      A change of formulary for an existing member is a reassignment of the same assignment, never a second assignment.
    eligibility:
      - id: one_open_assignment
        applies_to: [formulary_assign]
        kind: dedup
        condition: A new assignment may be opened only when no assignment of that member is pending_effective or active.
        evidence_fields: [formulary_assignments.customer_id, formulary_assignments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.customer_id]
          action_bindings:
            formulary_assignments.customer_id: customer_id
        dedup_contract:
          table: formulary_assignments
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_effective, active]}
          distinct_fields: [effective_date]
    params:
      max_per_customer: 1

  - id: formulary_drug_coverage
    subject: [formulary_assign, formulary_activate, formulary_reassign]
    rule: >-
      A drug's coverage status for a member is its code in the drug_list of the formulary the member's assignment holds on the date of service: a numeric code is the cost-share tier charged under the plan's cost-share rules, NF is non-formulary and EX is a plan exclusion.
      On a closed formulary an NF drug is not covered unless an exception approval is in force on the date of service; on an open formulary an NF or unlisted drug is covered at nf_exception_brand_tier without an exception.
      An EX drug is never covered, by exception or by transition fill, while excluded_drug_exception_allowed is false.
      A brand with an OTC equivalent is excluded when otc_equivalent_exclusion is true, compounded prescriptions follow compounded_drug_coverage, and a newly launched drug is treated as NF for new_to_market_review_days.
      A drug whose allowed cost per 30-day supply exceeds specialty_cost_threshold_monthly is placed on a specialty tier.
      When biosimilar_preferred is true the drug list prefers the interchangeable biosimilar over the reference biologic, as the codes show.
      A drug approved under an exception keeps the quantity limits of the member's utilization management program while exception_quantity_limits_still_apply is true.
    eligibility: []
    params:
      per_tier:
        Northbridge Exclusive Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Value Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Standard Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Preferred Drug List: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Broad Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Open Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}

  - id: formulary_tier_exception
    subject: [formulary_exception_requested, formulary_exception_approved, formulary_exception_denied]
    rule: >-
      A tier exception covers a formulary drug at a lower cost-share tier.
      It is available only when tier_exception_allowed is true and the drug's current code is one of tier_exception_eligible_tiers; the approved tier is the one tier_exception_target_tier maps it to.
      It is denied with tier_not_exceptionable when the drug's tier is not eligible (including every specialty tier not listed), with generic_equivalent_available when tier_exception_requires_no_generic_equivalent is true and an A-rated generic is covered at tier 1, and with already_covered when the drug is already at or below the target tier.
      It is approved with criteria_met when the prescriber supporting statement states that the preferred alternatives on the lower tier would be ineffective, have caused an adverse effect, or are contraindicated.
      A tier exception may be requested only while the member's formulary assignment is active.
    eligibility:
      - id: tier_exception_active_assignment
        applies_to: [formulary_exception_requested]
        kind: state
        condition: A tier exception may be requested only while the member's formulary assignment is active.
        evidence_fields: [formulary_assignments.status, formulary_assignments.formulary_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.formulary_assignment_id]
          action_bindings:
            formulary_assignments.formulary_assignment_id: formulary_assignment_id
        state_contract:
          field: formulary_assignments.status
          allowed: [active]
    params:
      per_tier:
        Northbridge Exclusive Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Value Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Standard Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Preferred Drug List: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Broad Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Open Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}

  - id: formulary_nonformulary_exception
    subject: [formulary_exception_requested, formulary_exception_approved, formulary_exception_denied]
    rule: >-
      A non-formulary exception covers a drug coded NF on the member's formulary and is available only when nonformulary_exception_allowed is true; a request for a drug coded EX is denied with excluded_drug, and a request for a drug that is already covered is denied with already_covered.
      It is approved with criteria_met on one of three grounds stated in the prescriber supporting statement: the member has tried and failed at least nf_exception_alternatives_required different formulary alternatives in the same therapeutic class (formulary_msr_alternative_trials, counting only trials found in Northbridge Rx pharmacy claims history within alternative_trial_lookback_days with at least alternative_trial_min_days_supply days supply each); every formulary alternative is contraindicated; or, when stable_patient_continuation is true, the member has been stable on the requested drug throughout the lookback period.
      When the statement relies on failed alternatives but claims history shows fewer qualifying trials than required, the request is denied with alternatives_not_tried.
      An approved non-specialty drug is covered at nf_exception_brand_tier and an approved specialty drug at nf_exception_specialty_tier.
      Only one exception request per drug may be open at a time: a new request may be opened only when the member has no request for the same drug that is still undecided or whose approval is still in force.
    eligibility:
      - id: one_open_request_per_drug
        applies_to: [formulary_exception_requested]
        kind: dedup
        condition: a new request may be opened only when the member has no request for the same drug that is still undecided or whose approval is still in force.
        evidence_fields: [formulary_exceptions.customer_id, formulary_exceptions.drug_name, formulary_exceptions.event_type, formulary_exceptions.approval_expiration_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.customer_id, formulary_exceptions.drug_name]
          action_bindings:
            formulary_exceptions.customer_id: customer_id
            formulary_exceptions.drug_name: drug_name
        dedup_contract:
          table: formulary_exceptions
          mode: separate_record
          object_bindings: {customer_id: customer_id, drug_name: drug_name}
          duplicate_filters: {event_type: [formulary_exception_requested, formulary_exception_approved]}
          distinct_fields: [event_at, approval_expiration_date]
    measures: [formulary_msr_alternative_trials]
    formula:
      approve_on_trials: "formulary_msr_alternative_trials >= nf_exception_alternatives_required"

  - id: formulary_evt_exception_timeline
    subject: [formulary_exception_statement_received, formulary_exception_approved, formulary_exception_denied]
    rule: >-
      An exception request is decided only on a prescriber supporting statement: no request may be approved before a statement for it has been received.
      A request may be opened by the prescriber, by the member when member_initiated_request_allowed is true, or by an authorized representative with an appointment-of-representative form on file when authorized_representative_form_required is true; expedited requests are taken around the clock when exception_intake_24x7 is true.
      The decision clock starts at the event named by exception_clock_start, and the decision is due within exception_standard_decision_hours for a standard request or exception_expedited_decision_hours for an expedited one; a prescriber's expedited attestation on the statement makes the request expedited.
      When no statement has arrived by the end of prescriber_statement_wait_days calendar days after the request was received, counting the request date as day zero, the request is denied with missing_prescriber_statement.
      A denial for a missing statement may be recorded only after prescriber_statement_wait_days calendar days have fully elapsed since the request was received.
      A request that has already been approved, denied or withdrawn takes no further decision; a new request starts a new case.
    eligibility:
      - id: statement_before_approval
        applies_to: [formulary_exception_approved]
        kind: authorization
        condition: no request may be approved before a statement for it has been received.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id
      - id: decide_once
        applies_to: [formulary_exception_approved, formulary_exception_denied]
        kind: dedup
        condition: A request that has already been approved, denied or withdrawn takes no further decision; a new request starts a new case.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id
        dedup_contract:
          table: formulary_exceptions
          mode: separate_record
          object_bindings: {source_exception_id: source_exception_id}
          duplicate_filters: {event_type: [formulary_exception_approved, formulary_exception_denied, formulary_exception_withdrawn]}
          distinct_fields: [event_at]
      - id: wait_elapsed_before_missing_statement_denial
        applies_to: [formulary_exception_denied]
        kind: time
        condition: A denial for a missing statement may be recorded only after prescriber_statement_wait_days calendar days have fully elapsed since the request was received.
        evidence_fields: [formulary_exceptions.event_at, formulary_exceptions.formulary_exception_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.formulary_exception_id]
          action_bindings:
            formulary_exceptions.formulary_exception_id: source_exception_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the request was received
          anchor_source: formulary_exceptions.event_at
          relation: not_before
          duration_source: variants.prescriber_statement_wait_days
          unit: calendar_days
          counting_rule: counting the request date as day zero
          boundary: exclusive

  - id: formulary_evt_exception_duration
    subject: [formulary_exception_approved]
    rule: >-
      A standard approval is effective on the decision date and runs for exception_approval_months calendar months, its expiration date being the day before the same day-of-month that many months later (falling back to the last day of the month when that day does not exist); an expedited approval runs expedited_exception_duration_days calendar days with the decision date as day 1.
      An approval covers only the drug and strength requested unless exception_covers_strength_changes is true, in which case it also covers other strengths of the same drug.
      A renewal is a new request; it may be opened from exception_renewal_lead_days calendar days before the current approval's expiration date, and when approved its effective date is the day after the current expiration date.
      Cost share paid under an approved exception counts toward the out-of-pocket maximum when exception_cost_share_counts_to_oop is true.
      Approved exceptions survive a formulary reassignment only through the end of the plan year in which the reassignment happens.
    eligibility: []

  - id: formulary_external_exception_review
    subject: [formulary_external_review_requested, formulary_external_review_decided, formulary_exception_approved]
    rule: >-
      When external_exception_review_allowed is true a denied exception may be sent to an independent review organization at the request of the member, an authorized representative or the prescriber.
      An external exception review may be requested only for a request whose latest decision is a denial.
      The reviewer decides within external_exception_review_standard_hours, or external_exception_review_expedited_hours for an expedited review, from receipt.
      An overturned decision is binding: the exception is approved with decision_reason iro_overturned at the tier the exception policies set, for the period formulary_evt_exception_duration sets; an upheld decision ends the exception case, and the member's remaining rights run through the plan's appeal program.
    eligibility:
      - id: review_only_after_denial
        applies_to: [formulary_external_review_requested]
        kind: authorization
        condition: An external exception review may be requested only for a request whose latest decision is a denial.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id

  - id: formulary_exception_withdrawal
    subject: [formulary_exception_withdrawn]
    rule: >-
      The requester, or the member on whose behalf the request was made, may withdraw an exception request at any time before it is decided; a withdrawn request is never decided afterwards and coverage stays as the drug list sets it.
      A request may be withdrawn only when no approval, denial or earlier withdrawal exists for it.
    eligibility:
      - id: withdraw_undecided_only
        applies_to: [formulary_exception_withdrawn]
        kind: dedup
        condition: A request may be withdrawn only when no approval, denial or earlier withdrawal exists for it.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id
        dedup_contract:
          table: formulary_exceptions
          mode: separate_record
          object_bindings: {source_exception_id: source_exception_id}
          duplicate_filters: {event_type: [formulary_exception_approved, formulary_exception_denied, formulary_exception_withdrawn]}
          distinct_fields: [event_at]

  - id: formulary_transition_supply
    subject: [formulary_transition_fill]
    rule: >-
      When transition_fill_allowed is true, a member who is new to the formulary, or who was moved to it by a sponsor formulary change while transition_applies_to_formulary_change is true, may receive a temporary supply of an NF drug they were already taking.
      The transition start date is the formulary change date when the assignment has been moved to this formulary by a sponsor change, and otherwise the formulary effective date; it is recorded on the assignment as transition_start_date.
      A transition fill is allowed only on a date of service no later than transition_window_days calendar days after the transition start date, counting that date as day 1.
      Each fill is limited to transition_fill_days_supply days supply and to transition_fills_per_drug fills of the same drug per window (formulary_msr_transition_fills_in_window); the fill is charged at nf_transition_tier.
      Drugs coded EX never receive a transition fill, and a drug that is covered on the formulary does not need one.
      A transition notice explaining the need for an exception or a switch goes to the member within transition_notice_business_days business days of the fill.
      A transition fill may be allowed only while the formulary assignment is active.
    eligibility:
      - id: within_transition_window
        applies_to: [formulary_transition_fill]
        kind: time
        condition: A transition fill is allowed only on a date of service no later than transition_window_days calendar days after the transition start date, counting that date as day 1.
        evidence_fields: [formulary_assignments.transition_start_date, formulary_assignments.formulary_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.formulary_assignment_id]
          action_bindings:
            formulary_assignments.formulary_assignment_id: formulary_assignment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the transition start date
          anchor_source: formulary_assignments.transition_start_date
          relation: not_after
          duration_source: variants.transition_window_days
          unit: calendar_days
          counting_rule: counting that date as day 1
          boundary: inclusive
      - id: transition_active_assignment
        applies_to: [formulary_transition_fill]
        kind: state
        condition: A transition fill may be allowed only while the formulary assignment is active.
        evidence_fields: [formulary_assignments.status, formulary_assignments.formulary_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.formulary_assignment_id]
          action_bindings:
            formulary_assignments.formulary_assignment_id: formulary_assignment_id
        state_contract:
          field: formulary_assignments.status
          allowed: [active]
    measures: [formulary_msr_transition_fills_in_window]

  - id: formulary_midyear_change
    subject: [formulary_change_notice, formulary_reassign]
    rule: >-
      A negative change during the plan year (a drug moved to NF, excluded, or raised to a higher tier) is notified to every member with a paid claim for the drug in the grandfathering_claim_lookback_days before the change, at least midyear_negative_change_notice_days calendar days before the change effective date.
      When midyear_change_grandfathering is true those members keep the drug's prior status through the end of the plan year; otherwise the change applies to them on its effective date.
      Positive changes (a lower tier or a newly added drug) take effect on approval without notice while positive_change_effective_immediately is true.
      The drug list changes on the formulary_update_cycle, and a sponsor's move to a different formulary takes effect at plan year renewal with a new transition window for affected members.
      Notices are generated from the change schedule; a change whose notice was not sent on time takes effect for affected members only once the full notice period has run from the date the notice was actually sent.
    eligibility: []

  - id: formulary_lifecycle
    subject: [formulary_assign, formulary_activate, formulary_terminate, formulary_reinstate]
    rule: >-
      The formulary assignment follows the plan enrollment: it opens with it, takes effect on its effective date, ends on its coverage end date and is restored by a COBRA reinstatement.
      No exception is decided, and no transition fill allowed, for a date of service when the assignment is not active.
      Exception approvals already in force when coverage ends lapse with the coverage; on COBRA reinstatement they resume through their original expiration date.
    eligibility: []
