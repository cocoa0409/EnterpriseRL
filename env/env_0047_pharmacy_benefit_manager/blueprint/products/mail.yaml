category: mail
display_name: Home Delivery Pharmacy

binding:
  holding_table: mail_accounts
  event_tables: [mail_prescriptions, mail_orders, mail_payments]
  intake_tables: [mail_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: home_delivery_balance}

lifecycle:
  states: [registered, active, on_hold, closed]
  transitions:
    - {from: registered, to: active, by: agent, means: The account is completed with a verified shipping address and a payment method (or the member's choice to be billed) and can dispense.}
    - {from: active, to: on_hold, by: system, means: An order would take the balance above the credit limit, a card charge is declined after retries, or the shipping address fails verification.}
    - {from: on_hold, to: active, by: agent, means: The cause of the hold is cleared (payment brings the balance within limit, a payment plan is set up, a working card or a verified address is recorded).}
    - {from: registered, to: closed, by: user, means: The member confirms closing an account that never dispensed.}
    - {from: active, to: closed, by: user, means: The member confirms a closure request.}
    - {from: on_hold, to: closed, by: user, means: The member confirms a closure request while on hold.}

accounts:
  - key: home_delivery_balance
    unit: USD
    meaning: Amount the member owes the home delivery pharmacy; raised by order and shipping charges and by refunds of credit balances, lowered by payments and credits.

parameter_schema:
  max_days_supply_mail: maximum days supply per home delivery fill
  min_days_supply_mail: minimum days supply per home delivery fill of a maintenance drug (shorter supplies are dispensed only for a first fill or a dose titration)
  band_31_60_multiplier: multiple of the plan's 30-day cost share charged for a 31-60 day home delivery supply
  t1_61_100_multiplier: multiple of the plan's 30-day tier 1 cost share charged for a 61-100 day home delivery supply
  t2_61_100_multiplier: multiple of the plan's 30-day tier 2 cost share charged for a 61-100 day home delivery supply
  t3_61_100_multiplier: multiple of the plan's 30-day tier 3 cost share charged for a 61-100 day home delivery supply
  t1_zero_cost_share: tier 1 generics are dispensed at zero member cost share by home delivery (deductible still applies where the plan applies it to tier 1); boolean
  specialty_dispensed_by_mail: specialty-tier drugs may be dispensed by home delivery (otherwise they are referred to the specialty pharmacy program); boolean
  standard_shipping_fee: fee for standard shipping, USD
  standard_shipping_business_days: business days in transit for standard shipping after dispensing
  two_day_shipping_fee: fee for two-day shipping requested by the member, USD
  overnight_shipping_fee: fee for overnight shipping requested by the member, USD
  cold_chain_shipping_fee: fee for refrigerated (cold-chain) packaging and expedited carrier required by the drug, USD
  credit_limit: outstanding balance the account may carry; an order whose charge would take the balance due above this amount is held, USD
  order_hold_cancel_days: calendar days an order may stay held for payment before it is cancelled, counting the hold date as day zero
  payment_due_days: calendar days after shipment within which an order's charge is due
  payment_plan_available: a balance may be paid in monthly installments under a payment plan; boolean
  payment_plan_min_balance: minimum balance due that qualifies for a payment plan, USD (0.00 where no plan is offered)
  payment_plan_max_months: maximum number of monthly installments in a payment plan (0 where no plan is offered)
  payment_plan_hold_exempt: orders are not held for balance while a payment plan is in good standing; boolean
  auto_refill_available: the member may enroll prescriptions in automatic refills; boolean
  auto_refill_lead_days: days of supply remaining at which an automatic refill is processed
  auto_refill_excluded_drugs: drugs never eligible for automatic refills
  refill_eligibility_fraction: fraction of the previous home delivery fill's days supply that must have elapsed before a refill can be dispensed
  new_rx_processing_business_days: business days to process and dispense a new prescription after it is received
  refill_processing_business_days: business days to process and dispense a refill order
  rx_transfer_allowed: prescriptions may be transferred in from a retail pharmacy; boolean
  rx_transfer_processing_business_days: business days for the home delivery pharmacy to obtain a transferred prescription from the retail pharmacy
  rx_transfer_controlled_allowed: Schedule II controlled substances may be transferred (they never may; a new prescription is required); boolean
  controlled_dispensed_by_mail: controlled substances may be dispensed by home delivery with adult signature on delivery; boolean
  signature_required_controlled: an adult signature is required on delivery of a controlled substance; boolean
  rx_valid_months: months after the written date that a non-controlled prescription remains fillable
  controlled_rx_valid_days: calendar days after the written date that a Schedule II prescription remains fillable
  lost_shipment_report_days: calendar days after the expected delivery date within which a lost or damaged shipment must be reported for a free replacement
  replacements_per_plan_year: free replacement shipments for lost or damaged packages per account per plan year (pharmacy errors never count)
  returns_accepted: dispensed medication can be returned for credit (it cannot under pharmacy law; only pharmacy errors are credited); boolean
  pharmacy_error_full_credit: an order dispensed in error is credited in full and re-dispensed at no charge; boolean
  order_cancel_cutoff: last order stage at which the member may cancel an order; enum
  credit_balance_refund_threshold: credit balance above which the credit is refunded to the payment method on file, USD
  credit_balance_refund_days: calendar days after a credit balance arises within which it is refunded
  card_decline_retries: automatic retries of a declined card before the account is placed on hold
  hsa_fsa_card_accepted: HSA and FSA debit cards are accepted as payment method; boolean
  apo_fpo_shipping: orders ship to APO/FPO/DPO military addresses; boolean
  international_shipping: orders ship to addresses outside the United States; boolean
  pharmacist_access_24x7: a pharmacist is reachable by phone around the clock; boolean
  retail_90_at_mail_cost_share: participating retail pharmacies may dispense a 61-90 day maintenance supply at the home delivery cost share (Maintenance Choice); boolean
  small_balance_writeoff: balance due at or below which the remainder is written off when the account closes, USD
  closure_confirmation_days: calendar days the member has to confirm an account closure request before it lapses
  statement_cycle: how often a balance statement is sent while a balance is due; enum
  temperature_sensitive_packaging: temperature-sensitive drugs ship with insulated packaging and cold packs; boolean

