events:
  - type: plan_enroll
    target: plan_enrollments
    mutation: create
    meaning: The sponsor eligibility file adds a member to a pharmacy plan design and an enrollment is opened.
    grain: one row per member enrollment under one sponsor plan
    fields:
      customer_id: covered member
      sponsor_customer_id: sponsor providing the coverage
      variant_name: plan design elected by the sponsor
      coverage_level: coverage level elected by the subscriber
      coverage_effective_date: first day of coverage
      plan_year_start_date: first day of the plan year in which coverage starts
    triggers:
      - event: formulary:formulary_assign
        map: {customer_id: customer_id, plan_enrollment_id: plan_enrollment_id, effective_date: coverage_effective_date, transition_start_date: coverage_effective_date}
      - event: retail:retail_enroll
        map: {customer_id: customer_id, plan_enrollment_id: plan_enrollment_id, effective_date: coverage_effective_date}
      - event: review:review_enroll
        map: {customer_id: customer_id, plan_enrollment_id: plan_enrollment_id, effective_date: coverage_effective_date}
      - event: appeal:appeal_enroll
        map: {customer_id: customer_id, plan_enrollment_id: plan_enrollment_id, effective_date: coverage_effective_date}
  - type: plan_activate
    target: plan_enrollments
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: Coverage reaches its effective date and starts adjudicating claims.
    grain: one row per transaction
    fields:
      coverage_effective_date: the effective date that was reached
    triggers:
      - event: formulary:formulary_activate
        map: {effective_date: coverage_effective_date}
      - event: retail:retail_activate
        map: {effective_date: coverage_effective_date}
      - event: review:review_activate
        map: {effective_date: coverage_effective_date}
      - event: appeal:appeal_activate
        map: {effective_date: coverage_effective_date}
  - type: plan_cancel_pending
    target: plan_enrollments
    mutation: {transition: {from: pending_effective, to: terminated}}
    meaning: A future-dated enrollment is cancelled by the sponsor before it takes effect.
    grain: one row per transaction
    fields:
      coverage_end_date: set equal to the day before the cancelled effective date
    triggers:
      - event: formulary:formulary_terminate
        map: {end_date: coverage_end_date}
      - event: retail:retail_terminate
        map: {end_date: coverage_end_date}
      - event: review:review_terminate
        map: {end_date: coverage_end_date}
      - event: appeal:appeal_cancel
        map: {end_date: coverage_end_date}
  - type: plan_terminate
    target: plan_enrollments
    mutation: {transition: {from: active, to: terminated}}
    meaning: The sponsor eligibility file ends the member's coverage.
    grain: one row per transaction
    fields:
      coverage_end_date: last day of coverage stated on the eligibility file
    triggers:
      - event: formulary:formulary_terminate
        map: {end_date: coverage_end_date}
      - event: retail:retail_terminate
        map: {end_date: coverage_end_date}
      - event: review:review_terminate
        map: {end_date: coverage_end_date}
      - event: specialty:specialty_hold
        map: {hold_reason: coverage_terminated}
      - event: appeal:appeal_runout
        map: {end_date: coverage_end_date}
  - type: plan_cobra_reinstate
    target: plan_enrollments
    mutation: {transition: {from: terminated, to: cobra_continuation}}
    meaning: A timely COBRA election reinstates the terminated enrollment without a gap.
    grain: one row per transaction
    fields:
      coverage_end_date: cleared, because coverage continues
      cobra_end_date: last day of the COBRA continuation period
    triggers:
      - event: formulary:formulary_reinstate
        map: {end_date: coverage_end_date}
      - event: retail:retail_reinstate
        map: {end_date: coverage_end_date}
      - event: review:review_reinstate
        map: {end_date: coverage_end_date}
      - event: appeal:appeal_reinstate
        map: {end_date: coverage_end_date}
  - type: plan_cobra_grace_start
    target: plan_enrollments
    mutation: {transition: {from: cobra_continuation, to: cobra_grace}}
    meaning: A COBRA premium passes its due date unpaid and the enrollment enters the premium grace period.
    grain: one row per transaction
    fields:
      cobra_end_date: unchanged COBRA end date, restated on the record
    triggers: []
  - type: plan_cobra_grace_cure
    target: plan_enrollments
    mutation: {transition: {from: cobra_grace, to: cobra_continuation}}
    meaning: The overdue COBRA premium is paid within grace and continuation resumes.
    grain: one row per transaction
    fields:
      cobra_end_date: unchanged COBRA end date, restated on the record
    triggers: []
  - type: plan_cobra_end
    target: plan_enrollments
    mutation:
      transition:
        - {from: cobra_grace, to: terminated}
        - {from: cobra_continuation, to: terminated}
    meaning: COBRA continuation ends, either for non-payment after grace or at the end of the continuation period.
    grain: one row per transaction
    fields:
      coverage_end_date: last day of COBRA coverage (the last paid-through day, or the COBRA end date)
    triggers:
      - event: formulary:formulary_terminate
        map: {end_date: coverage_end_date}
      - event: retail:retail_terminate
        map: {end_date: coverage_end_date}
      - event: review:review_terminate
        map: {end_date: coverage_end_date}
      - event: specialty:specialty_hold
        map: {hold_reason: coverage_terminated}
      - event: appeal:appeal_runout
        map: {end_date: coverage_end_date}
  - type: plan_cob_update
    target: plan_enrollments
    mutation: update
    meaning: The member's other-coverage (coordination of benefits) status is recorded or confirmed.
    grain: one row per transaction
    fields:
      other_coverage: the coordination-of-benefits status confirmed with the member
      other_coverage_verified_date: date of the confirmation
    triggers: []
  - type: plan_ded_post
    target: plan_accumulator_ledger
    meaning: An amount is credited to the member's deductible accumulator (pharmacy claim, medical feed, prior-carrier transfer, fourth-quarter carryover or manual correction).
    grain: one row per source record per accumulator credit
    distinguish_by: [source_type, source_reference_id, accrual_date, funding_source]
    fields:
      amount: amount credited to the deductible
      accrual_date: date the amount accrues to
      plan_year: plan year of the credit
      source_type: what produced the credit
      source_reference_id: originating record
      channel: dispensing channel or medical
      funding_source: member-paid or manufacturer-assistance-funded portion
      formulary_tier: tier of the source claim
      claim_allowed_amount: allowed amount of the source claim
    account: deductible
    direction: in
    triggers: []
  - type: plan_oop_post
    target: plan_accumulator_ledger
    meaning: An amount is credited to the member's out-of-pocket accumulator.
    grain: one row per source record per accumulator credit
    distinguish_by: [source_type, source_reference_id, accrual_date, funding_source]
    fields:
      amount: amount credited to out-of-pocket
      accrual_date: date the amount accrues to
      plan_year: plan year of the credit
      source_type: what produced the credit
      source_reference_id: originating record
      channel: dispensing channel or medical
      funding_source: member-paid or manufacturer-assistance-funded portion
      formulary_tier: tier of the source claim
      claim_allowed_amount: allowed amount of the source claim
    account: out_of_pocket
    direction: in
    triggers: []
  - type: plan_ded_reverse
    target: plan_accumulator_ledger
    meaning: A deductible credit is taken back because its source claim was reversed or a correction lowers the deductible met.
    grain: one row per reversed source record and funding source
    distinguish_by: [source_type, source_reference_id, accrual_date, funding_source]
    fields:
      amount: amount removed from the deductible (equal to the credit being reversed, or the corrected difference)
      accrual_date: date of service of the reversed claim, or the correction posting date
      plan_year: plan year the reversal belongs to
      source_type: pharmacy_claim for claim reversals, manual_correction for corrections
      source_reference_id: the reversed claim, order or fill id (or the corrected ledger entry id)
      channel: channel of the reversed claim
      funding_source: funding of the reversed portion
      formulary_tier: tier of the reversed claim
      claim_allowed_amount: allowed amount of the reversed claim
    account: deductible
    direction: out
    triggers: []
  - type: plan_oop_reverse
    target: plan_accumulator_ledger
    meaning: An out-of-pocket credit is taken back because its source claim was reversed or a correction lowers out-of-pocket met.
    grain: one row per reversed source record and funding source
    distinguish_by: [source_type, source_reference_id, accrual_date, funding_source]
    fields:
      amount: amount removed from out-of-pocket
      accrual_date: date of service of the reversed claim, or the correction posting date
      plan_year: plan year the reversal belongs to
      source_type: pharmacy_claim for claim reversals, manual_correction for corrections
      source_reference_id: the reversed claim, order or fill id (or the corrected ledger entry id)
      channel: channel of the reversed claim
      funding_source: funding of the reversed portion
      formulary_tier: tier of the reversed claim
      claim_allowed_amount: allowed amount of the reversed claim
    account: out_of_pocket
    direction: out
    triggers: []
  - type: plan_ded_reset
    target: plan_accumulator_ledger
    meaning: The deductible accumulator is brought back to zero at the start of a new plan year.
    grain: one row per enrollment per plan year
    distinguish_by: [plan_year]
    fields:
      amount: the full deductible met at the close of the prior plan year
      accrual_date: first day of the new plan year
      plan_year: the new plan year
      source_type: plan_year_reset
    account: deductible
    direction: out
    triggers: []
  - type: plan_oop_reset
    target: plan_accumulator_ledger
    meaning: The out-of-pocket accumulator is brought back to zero at the start of a new plan year.
    grain: one row per enrollment per plan year
    distinguish_by: [plan_year]
    fields:
      amount: the full out-of-pocket met at the close of the prior plan year
      accrual_date: first day of the new plan year
      plan_year: the new plan year
      source_type: plan_year_reset
    account: out_of_pocket
    direction: out
    triggers: []
  - type: plan_id_card_reissue
    target: plan_service_records
    meaning: A replacement prescription ID card is issued to the member.
    grain: one row per replacement card issued
    distinguish_by: [request_date, card_reason, delivery_method]
    fields:
      request_date: date the replacement was requested
      card_reason: why a replacement is needed
      delivery_method: mailed card or digital wallet card
    triggers: []
  - type: plan_cob_questionnaire
    target: plan_service_records
    meaning: A coordination-of-benefits questionnaire cycle is recorded (sent, or returned with the member's answer).
    grain: one row per questionnaire cycle outcome
    distinguish_by: [request_date, cob_response]
    fields:
      request_date: date the questionnaire was sent or the answer received
      cob_response: the member's answer, or not_returned
    triggers:
      - event: plan:plan_cob_update
        when: {cob_response: [no_other_coverage, other_coverage_reported]}
        map: {other_coverage_verified_date: request_date}

measures:
  - id: plan_msr_family_deductible_ytd
    window: current plan year, from plan_year_start_date through frozen_time, inclusive
    measure: sum of amount over plan_ded_post minus plan_ded_reverse rows (excluding plan_ded_reset) for every plan enrollment whose member shares the same subscriber_customer_id
  - id: plan_msr_family_oop_ytd
    window: current plan year, from plan_year_start_date through frozen_time, inclusive
    measure: sum of amount over plan_oop_post minus plan_oop_reverse rows (excluding plan_oop_reset) for every plan enrollment whose member shares the same subscriber_customer_id
  - id: plan_msr_mailed_cards_ytd
    window: current plan year, from plan_year_start_date through frozen_time, inclusive
    measure: count of plan_id_card_reissue rows on this enrollment with delivery_method = mail

policies:
  - id: plan_agg_multi_holding
    subject: [plan_enroll]
    rule: >-
      A member holds at most one Pharmacy Benefit Plan enrollment that is not terminated at any time; enrollments in terminated status stay on file as history and do not count toward the cap.
      A new enrollment may be opened for a member only when no enrollment of that member is pending_effective, active, cobra_continuation or cobra_grace.
      A sponsor that moves a member to a different plan design at renewal does so by ending the old enrollment and opening a new one, and accumulators move with the member under plan_prior_carrier_transfer.
    eligibility:
      - id: no_open_enrollment
        applies_to: [plan_enroll]
        kind: dedup
        condition: A new enrollment may be opened for a member only when no enrollment of that member is pending_effective, active, cobra_continuation or cobra_grace.
        evidence_fields: [plan_enrollments.customer_id, plan_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_enrollments.customer_id]
          action_bindings:
            plan_enrollments.customer_id: customer_id
        dedup_contract:
          table: plan_enrollments
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_effective, active, cobra_continuation, cobra_grace]}
          distinct_fields: [coverage_effective_date]
    params:
      max_per_customer: 1

  - id: plan_cost_share
    subject: [plan_oop_post]
    rule: >-
      The member's cost share on a covered pharmacy claim after any deductible portion is set by the formulary tier at which the claim adjudicated and the plan design's tier parameters (t1_ through t5_ basis, copay, coinsurance_rate, coinsurance_min, coinsurance_max).
      For a copay tier the member pays the tier copay for a 30-day retail supply, but never more than the claim's allowed amount (lesser-of pricing).
      For a coinsurance tier the member pays the coinsurance rate times the allowed amount, raised to the per-fill minimum and lowered to the per-fill maximum where those are non-zero, and never more than the allowed amount; a zero maximum means no per-fill cap.
      Covered insulin is charged the lesser of the tier cost share and insulin_cap_30day per 30-day supply; when aca_preventive_zero_cost_share is true ACA preventive drugs are charged zero, and when vaccine_zero_cost_at_network_pharmacy is true ACIP vaccines at a network pharmacy are charged zero.
      OTC products are covered at tier 1 only when otc_covered_with_prescription is true and a prescription is on file; otherwise they are not covered and nothing posts.
      When daw_member_penalty is true and the member asks for a brand with an A-rated generic available, the member also pays the brand-generic cost difference, waived only when daw1_prescriber_waiver is true and the prescriber marked dispense-as-written; that difference does not post to out-of-pocket while daw_penalty_counts_to_oop is false.
      Every computed cost share is rounded per member_cost_share_rounding, and the out-of-pocket posting equals the cost share actually charged (including any deductible portion when oop_includes_deductible is true).
      Day-supply multiples for 90-day retail, home delivery and specialty fills are set by the dispensing channel's own program rules, which start from this 30-day cost share.
    eligibility: []
    params:
      per_tier:
        Northbridge Rx HSA Saver: {generic_basis: "=t1_basis", generic_copay: "=t1_copay", generic_rate: "=t1_coinsurance_rate"}
        Northbridge Rx Basic: {generic_basis: "=t1_basis", generic_copay: "=t1_copay", generic_rate: "=t1_coinsurance_rate"}
        Northbridge Rx Value: {generic_basis: "=t1_basis", generic_copay: "=t1_copay", generic_rate: "=t1_coinsurance_rate"}
        Northbridge Rx Select: {generic_basis: "=t1_basis", generic_copay: "=t1_copay", generic_rate: "=t1_coinsurance_rate"}
        Northbridge Rx Plus: {generic_basis: "=t1_basis", generic_copay: "=t1_copay", generic_rate: "=t1_coinsurance_rate"}
        Northbridge Rx Premier: {generic_basis: "=t1_basis", generic_copay: "=t1_copay", generic_rate: "=t1_coinsurance_rate"}
    formula:
      t1_share: "min(t1_copay, claim_allowed_amount) if t1_basis == 'copay' else min(max(claim_allowed_amount * t1_coinsurance_rate, t1_coinsurance_min), t1_coinsurance_max if t1_coinsurance_max > 0 else claim_allowed_amount, claim_allowed_amount)"
      t2_share: "min(t2_copay, claim_allowed_amount) if t2_basis == 'copay' else min(max(claim_allowed_amount * t2_coinsurance_rate, t2_coinsurance_min), t2_coinsurance_max if t2_coinsurance_max > 0 else claim_allowed_amount, claim_allowed_amount)"
      t3_share: "min(t3_copay, claim_allowed_amount) if t3_basis == 'copay' else min(max(claim_allowed_amount * t3_coinsurance_rate, t3_coinsurance_min), t3_coinsurance_max if t3_coinsurance_max > 0 else claim_allowed_amount, claim_allowed_amount)"
      t4_share: "min(t4_copay, claim_allowed_amount) if t4_basis == 'copay' else min(max(claim_allowed_amount * t4_coinsurance_rate, t4_coinsurance_min), t4_coinsurance_max if t4_coinsurance_max > 0 else claim_allowed_amount, claim_allowed_amount)"
      t5_share: "min(t5_copay, claim_allowed_amount) if t5_basis == 'copay' else min(max(claim_allowed_amount * t5_coinsurance_rate, t5_coinsurance_min), t5_coinsurance_max if t5_coinsurance_max > 0 else claim_allowed_amount, claim_allowed_amount)"
      insulin_share: "min(t2_share, insulin_cap_30day)"

  - id: plan_deductible
    subject: [plan_ded_post]
    rule: >-
      A claim on a formulary tier listed in deductible_applies_to_tiers is paid in full by the member, up to the claim's allowed amount, until the deductible is met; only then does tier cost share under plan_cost_share apply to the rest of the claim and to later claims.
      Drugs on the Northbridge Rx Preventive Drug List skip the deductible when preventive_list_bypasses_deductible is true, and covered insulin skips it when insulin_bypasses_deductible is true; claims on tiers not listed never touch the deductible.
      For employee_only coverage the deductible remaining is deductible_individual minus deductible met; for any other coverage level the family amount applies as set out in plan_agg_family_accumulation.
      The deductible portion of a claim is the lesser of the allowed amount and the deductible remaining at the moment the claim adjudicates, claims taking their order from date of service and then adjudication time; a design whose deductible is zero posts nothing to the deductible.
      Only pharmacy claims for dates of service on or after the current plan_year_start_date count toward the current plan year's deductible.
    eligibility: []
    params:
      per_tier:
        Northbridge Rx HSA Saver: {individual: "=deductible_individual", family: "=deductible_family", embedded: "=deductible_embedded", tiers: "=deductible_applies_to_tiers"}
        Northbridge Rx Basic: {individual: "=deductible_individual", family: "=deductible_family", embedded: "=deductible_embedded", tiers: "=deductible_applies_to_tiers"}
        Northbridge Rx Value: {individual: "=deductible_individual", family: "=deductible_family", embedded: "=deductible_embedded", tiers: "=deductible_applies_to_tiers"}
        Northbridge Rx Select: {individual: "=deductible_individual", family: "=deductible_family", embedded: "=deductible_embedded", tiers: "=deductible_applies_to_tiers"}
        Northbridge Rx Plus: {individual: "=deductible_individual", family: "=deductible_family", embedded: "=deductible_embedded", tiers: "=deductible_applies_to_tiers"}
        Northbridge Rx Premier: {individual: "=deductible_individual", family: "=deductible_family", embedded: "=deductible_embedded", tiers: "=deductible_applies_to_tiers"}
    formula:
      deductible_remaining_individual: "max(deductible_individual - deductible_met, 0)"
      deductible_portion: "min(claim_allowed_amount, deductible_remaining_individual)"

  - id: plan_agg_family_accumulation
    subject: [plan_ded_post, plan_oop_post]
    rule: >-
      Family accumulators combine every plan enrollment whose member shares the same subscriber_customer_id and whose coverage level is not employee_only, counted over the current plan year (plan_msr_family_deductible_ytd and plan_msr_family_oop_ytd).
      When deductible_embedded is true, a member's deductible is met at the lower of reaching deductible_individual on their own postings or the family reaching deductible_family; when it is false (aggregate), no family member is past the deductible until the family total reaches deductible_family.
      Out-of-pocket is always embedded: a member's cost share drops to zero at the lower of their own oop_max_individual or the family reaching oop_max_family.
      A family member's posting never exceeds the family amount remaining, so the family total can equal but never pass the family amount.
    eligibility: []
    measures: [plan_msr_family_deductible_ytd, plan_msr_family_oop_ytd]
    formula:
      family_deductible_remaining: "max(deductible_family - plan_msr_family_deductible_ytd, 0)"
      family_oop_remaining: "max(oop_max_family - plan_msr_family_oop_ytd, 0)"

  - id: plan_oop_max
    subject: [plan_oop_post]
    rule: >-
      Once out-of-pocket met reaches oop_max_individual for the member, or the family reaches oop_max_family under plan_agg_family_accumulation, every further covered claim in the same plan year is charged zero member cost share.
      A claim that crosses the maximum is charged only the out-of-pocket remaining, and the posting equals that remainder.
      Amounts that never count toward out-of-pocket (the brand-generic difference while daw_penalty_counts_to_oop is false, non-covered drugs, and manufacturer assistance under accumulator_adjustment) are still charged after the maximum is reached.
    eligibility: []
    formula:
      oop_remaining_individual: "max(oop_max_individual - oop_met, 0)"

  - id: plan_evt_accumulator_reversal
    subject: [plan_ded_reverse, plan_oop_reverse]
    rule: >-
      When a pharmacy claim, home delivery order charge or specialty fill charge is reversed or credited for pharmacy error, each accumulator posting made from that source record is reversed for exactly the amount originally posted, under the same source_reference_id, with funding_source member_paid.
      A copay-assistance back-out under plan_copay_assistance_accumulation is a separate reversal of the same source record with funding_source manufacturer_assistance.
      A reversal may be posted only when a posting for the same source record exists on the same accumulator and no reversal with the same funding source has already been posted for it.
      Reversing a claim after the plan year has closed lowers that closed year's accumulators only while plan_accumulator_correction allows prior-year corrections; it never touches the new plan year.
    eligibility:
      - id: reverse_once
        applies_to: [plan_ded_reverse, plan_oop_reverse]
        kind: dedup
        condition: A reversal may be posted only when a posting for the same source record exists on the same accumulator and no reversal with the same funding source has already been posted for it.
        evidence_fields: [plan_accumulator_ledger.source_reference_id, plan_accumulator_ledger.event_type, plan_accumulator_ledger.funding_source]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_accumulator_ledger.source_reference_id]
          action_bindings:
            plan_accumulator_ledger.source_reference_id: source_reference_id
        dedup_contract:
          table: plan_accumulator_ledger
          mode: separate_record
          object_bindings: {source_reference_id: source_reference_id}
          duplicate_filters: {event_type: [plan_ded_reverse, plan_oop_reverse]}
          distinct_fields: [event_type, funding_source]

  - id: plan_integrated_feed
    subject: [plan_ded_post, plan_oop_post]
    rule: >-
      Medical-claim feed postings (source_type medical_claim_feed, channel medical) are accepted only for designs whose accumulator_integration is integrated_medical; separate_rx designs never take medical amounts and a medical carrier's statement for such a member is not posted.
      Feeds arrive every medical_feed_interval_days calendar days and post with the medical service date as accrual_date; a medical amount posts to out-of-pocket and, to the extent the deductible is not yet met, to the deductible.
      A member who reports medical spending not yet visible is told it posts with the next scheduled feed; agents do not key medical amounts by hand.
    eligibility: []

  - id: plan_copay_assistance_accumulation
    subject: [plan_ded_post, plan_oop_post, plan_ded_reverse, plan_oop_reverse]
    rule: >-
      At adjudication the claim's full member cost share posts to the deductible and out-of-pocket with funding_source member_paid, whoever later pays it.
      When manufacturer copay assistance then pays part of that cost share, accumulator_adjustment_program decides what happens: under standard nothing further posts, so the assisted amount keeps counting; under accumulator_adjustment the assisted amount is backed out by reversal postings with funding_source manufacturer_assistance under the same source record, the part of the assistance that paid the deductible portion coming off the deductible and the whole assisted amount coming off out-of-pocket.
      A back-out never exceeds what the claim posted, and it is the only kind of reversal that leaves the claim itself standing.
      Because HSA-qualified designs must charge the member the deductible from their own funds, every design whose plan_design_type is hdhp_hsa runs accumulator_adjustment.
    eligibility: []

  - id: plan_year_reset
    subject: [plan_ded_reset, plan_oop_reset, plan_ded_post]
    rule: >-
      On the first day of each plan year the deductible and out-of-pocket accumulators are each reset by one posting equal to the amount met at the close of the prior plan year, dated that first day.
      When q4_deductible_carryover is true, deductible amounts the member paid on claims dated from the first day of month q4_carryover_start_month through the last day of the prior plan year are credited as a plan_ded_post with source_type q4_carryover on the first day of the new plan year; out-of-pocket never carries over.
      The carryover months run from the first day of month q4_carryover_start_month through the last day of the prior plan year, counted in calendar dates.
      A carryover credit may be posted only on the first day of the new plan year or later and only from claims whose date of service falls in the carryover months of the immediately preceding plan year.
    eligibility:
      - id: carryover_from_prior_q4
        applies_to: [plan_ded_post]
        kind: time
        condition: A carryover credit may be posted only on the first day of the new plan year or later and only from claims whose date of service falls in the carryover months of the immediately preceding plan year.
        evidence_fields: [plan_enrollments.plan_year_start_date, plan_accumulator_ledger.accrual_date, plan_accumulator_ledger.source_reference_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_accumulator_ledger.source_reference_id]
          action_bindings:
            plan_accumulator_ledger.source_reference_id: source_reference_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the first day of the new plan year
          anchor_source: plan_enrollments.plan_year_start_date
          relation: not_before
          duration_source: params.carryover_posting_offset_days
          unit: calendar_days
          counting_rule: The carryover months run from the first day of month q4_carryover_start_month through the last day of the prior plan year, counted in calendar dates.
          boundary: inclusive
    params:
      carryover_posting_offset_days: 0

  - id: plan_prior_carrier_transfer
    subject: [plan_ded_post, plan_oop_post]
    rule: >-
      When prior_carrier_accumulator_credit is true, deductible and out-of-pocket the member met under a prior pharmacy carrier in the same plan year are credited once, as postings with source_type prior_carrier_transfer, dated the coverage effective date.
      The credit is posted only from the prior carrier's accumulator statement and never from the member's own estimate.
      The statement must be received no later than prior_carrier_credit_request_days calendar days after the coverage effective date, counted with the effective date as day zero; a statement received after that day is not credited.
      Amounts from a prior plan year, or exceeding this design's deductible or out-of-pocket maximum, are credited only up to those maximums.
    eligibility:
      - id: statement_on_time
        applies_to: [plan_ded_post, plan_oop_post]
        kind: time
        condition: The statement must be received no later than prior_carrier_credit_request_days calendar days after the coverage effective date, counted with the effective date as day zero; a statement received after that day is not credited.
        evidence_fields: [plan_enrollments.coverage_effective_date, plan_enrollments.plan_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_enrollments.plan_enrollment_id]
          action_bindings:
            plan_enrollments.plan_enrollment_id: plan_enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the coverage effective date
          anchor_source: plan_enrollments.coverage_effective_date
          relation: not_after
          duration_source: variants.prior_carrier_credit_request_days
          unit: calendar_days
          counting_rule: counted with the effective date as day zero
          boundary: inclusive

  - id: plan_accumulator_correction
    subject: [plan_ded_post, plan_oop_post, plan_ded_reverse, plan_oop_reverse]
    rule: >-
      A manual correction (source_type manual_correction) fixes an accumulator that does not equal what the claims of record support, posting the difference as a credit or a reversal that references the ledger entry being corrected.
      A correction for the current plan year may be posted at any time while the enrollment is not terminated; a correction for a prior plan year may be posted only within prior_year_accumulator_correction_days calendar days after the last day of that plan year, counted with the last day as day zero.
      The last day of a prior plan year is the day before the enrollment's current plan_year_start_date.
      A correction is never posted from the member's statement alone; it requires a claim, feed or statement of record that the accumulator fails to reflect.
    eligibility:
      - id: prior_year_window
        applies_to: [plan_ded_post, plan_oop_post, plan_ded_reverse, plan_oop_reverse]
        kind: time
        condition: a correction for a prior plan year may be posted only within prior_year_accumulator_correction_days calendar days after the last day of that plan year, counted with the last day as day zero.
        evidence_fields: [plan_enrollments.plan_year_start_date, plan_accumulator_ledger.plan_year, plan_accumulator_ledger.source_reference_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_accumulator_ledger.source_reference_id]
          action_bindings:
            plan_accumulator_ledger.source_reference_id: source_reference_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the last day of that plan year
          anchor_source: plan_enrollments.plan_year_start_date
          relation: not_after
          duration_source: variants.prior_year_accumulator_correction_days
          unit: calendar_days
          counting_rule: counted with the last day as day zero
          boundary: inclusive

  - id: plan_coverage_lifecycle
    subject: [plan_enroll, plan_activate, plan_cancel_pending, plan_terminate]
    rule: >-
      Enrollment, activation and termination follow the sponsor eligibility file only; member services never opens, activates or ends a plan enrollment on a member's request.
      An enrollment opens pending_effective and becomes active on its coverage effective date; a future-dated enrollment cancelled by the sponsor before that date ends without ever being active.
      A termination may be dated back no more than retro_termination_limit_days before the day the termination record is received; claims paid for dates of service after the coverage end date are reversed and the member is billed by the dispensing pharmacy.
      A dependent child's coverage ends at the end of the month in which the child reaches dependent_age_limit.
      Reimbursement requests for dates of service while covered remain payable for claims_runout_days calendar days after the coverage end date.
    eligibility: []

  - id: plan_cobra
    subject: [plan_cobra_reinstate, plan_cobra_grace_start, plan_cobra_grace_cure, plan_cobra_end]
    rule: >-
      COBRA events come from the sponsor's COBRA administrator; Northbridge Rx records them and does not take elections or premiums itself.
      The COBRA election notice is never dated before the coverage end date, so the election window runs from the notice date.
      A COBRA election reinstates the enrollment only when it is received no later than cobra_election_window_days calendar days after the COBRA election notice date, counted with the notice date as day zero.
      Coverage then resumes the day after the coverage end date with accumulators intact, and continuation lasts at most cobra_max_months from that day.
      An unpaid monthly premium moves the enrollment to cobra_grace and claims pend; a premium received within cobra_premium_grace_days calendar days of its due date restores cobra_continuation, otherwise coverage ends on the last paid-through day.
    eligibility:
      - id: election_on_time
        applies_to: [plan_cobra_reinstate]
        kind: time
        condition: A COBRA election reinstates the enrollment only when it is received no later than cobra_election_window_days calendar days after the COBRA election notice date, counted with the notice date as day zero.
        evidence_fields: [plan_enrollments.cobra_notice_date, plan_enrollments.plan_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_enrollments.plan_enrollment_id]
          action_bindings:
            plan_enrollments.plan_enrollment_id: plan_enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the COBRA election notice date
          anchor_source: plan_enrollments.cobra_notice_date
          relation: not_after
          duration_source: variants.cobra_election_window_days
          unit: calendar_days
          counting_rule: counted with the notice date as day zero
          boundary: inclusive

  - id: plan_cob
    subject: [plan_cob_update, plan_cob_questionnaire]
    rule: >-
      A coordination-of-benefits questionnaire is sent every cob_questionnaire_interval_months months; when it is not returned within cob_response_days calendar days of being sent the cycle is recorded as not_returned and claims pend for other-coverage review until the member answers.
      A returned answer is recorded and the enrollment's other_coverage and other_coverage_verified_date are updated from it; an agent may also record an answer the member gives by phone.
      When other coverage is primary, Northbridge Rx pays as secondary using cob_method; when the member is Medicare-primary for prescriptions, Northbridge Rx pays secondary to Part D.
      Other coverage may be recorded only for an enrollment that is active, cobra_continuation or cobra_grace.
    eligibility:
      - id: cob_open_enrollment
        applies_to: [plan_cob_update, plan_cob_questionnaire]
        kind: state
        condition: Other coverage may be recorded only for an enrollment that is active, cobra_continuation or cobra_grace.
        evidence_fields: [plan_enrollments.status, plan_enrollments.plan_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_enrollments.plan_enrollment_id]
          action_bindings:
            plan_enrollments.plan_enrollment_id: plan_enrollment_id
        state_contract:
          field: plan_enrollments.status
          allowed: [active, cobra_continuation, cobra_grace]

  - id: plan_id_card
    subject: [plan_id_card_reissue]
    rule: >-
      A replacement ID card is issued on request to a member whose enrollment is active, cobra_continuation or pending_effective.
      Mailed replacements are limited to id_card_mail_reissue_limit per member per plan year (plan_msr_mailed_cards_ytd) and arrive in id_card_mail_delivery_business_days business days; once the limit is reached further replacements are issued to the digital wallet only, which is never limited.
      A card is never mailed to an address other than the one on file.
      A replacement card may be issued only while the enrollment is pending_effective, active or cobra_continuation.
    eligibility:
      - id: card_for_covered_member
        applies_to: [plan_id_card_reissue]
        kind: state
        condition: A replacement card may be issued only while the enrollment is pending_effective, active or cobra_continuation.
        evidence_fields: [plan_enrollments.status, plan_enrollments.plan_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_enrollments.plan_enrollment_id]
          action_bindings:
            plan_enrollments.plan_enrollment_id: plan_enrollment_id
        state_contract:
          field: plan_enrollments.status
          allowed: [pending_effective, active, cobra_continuation]
    measures: [plan_msr_mailed_cards_ytd]
