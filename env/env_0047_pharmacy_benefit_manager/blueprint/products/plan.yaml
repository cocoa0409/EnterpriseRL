category: plan
display_name: Pharmacy Benefit Plan

binding:
  holding_table: plan_enrollments
  event_tables: [plan_accumulator_ledger, plan_service_records]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deductible_met: deductible, oop_met: out_of_pocket}

lifecycle:
  states: [pending_effective, active, cobra_continuation, cobra_grace, terminated]
  transitions:
    - {from: pending_effective, to: active, by: system, means: The coverage effective date on the sponsor eligibility file is reached and the enrollment begins adjudicating claims.}
    - {from: pending_effective, to: terminated, by: system, means: The sponsor eligibility file cancels a future-dated enrollment before it ever takes effect.}
    - {from: active, to: terminated, by: system, means: The sponsor eligibility file ends coverage (termination of employment, loss of dependent status or sponsor plan change).}
    - {from: terminated, to: cobra_continuation, by: system, means: A timely COBRA election received from the sponsor's COBRA administrator reinstates coverage back to the day after the coverage end date.}
    - {from: cobra_continuation, to: cobra_grace, by: system, means: A monthly COBRA premium is past its due date; claims pend while the premium grace period runs.}
    - {from: cobra_grace, to: cobra_continuation, by: system, means: The overdue COBRA premium is received within the grace period.}
    - {from: cobra_grace, to: terminated, by: system, means: The grace period ends without the premium and COBRA coverage terminates.}
    - {from: cobra_continuation, to: terminated, by: system, means: The COBRA continuation period ends or the member drops COBRA through the administrator.}

accounts:
  - key: deductible
    unit: USD
    meaning: Deductible met by the member in the current plan year; raised by deductible postings and lowered by reversals and the plan-year reset.
  - key: out_of_pocket
    unit: USD
    meaning: Out-of-pocket cost share met by the member in the current plan year toward the out-of-pocket maximum; raised by postings and lowered by reversals and the plan-year reset.

parameter_schema:
  plan_design_type: 'benefit design family of the plan: hdhp_hsa (HSA-qualified high-deductible), deductible_copay (pharmacy deductible then copays), copay_only (no pharmacy deductible); enum'
  deductible_individual: individual annual deductible for the plan year, USD
  deductible_family: family annual deductible for the plan year (all family enrollments of one subscriber combined), USD
  deductible_embedded: true = each member stops paying deductible once the individual amount is met even if the family amount is not; false = aggregate (no member is past deductible until the family amount is met when coverage is not employee_only); boolean
  deductible_applies_to_tiers: list of formulary tiers (1-5) whose claims are subject to the deductible; empty list = no deductible applies
  preventive_list_bypasses_deductible: drugs on the Northbridge Rx Preventive Drug List skip the deductible and go straight to tier cost share; boolean
  insulin_bypasses_deductible: insulin products skip the deductible and are charged the insulin cap; boolean
  oop_max_individual: individual annual out-of-pocket maximum for the plan year, USD
  oop_max_family: family annual out-of-pocket maximum for the plan year, USD
  oop_includes_deductible: amounts paid toward the deductible also count toward the out-of-pocket maximum; boolean
  accumulator_integration: integrated_medical = deductible and out-of-pocket are shared with the sponsor's medical carrier and fed in; separate_rx = pharmacy-only accumulators; enum
  medical_feed_interval_days: interval in calendar days between inbound medical-carrier accumulator feeds; 0 = no feed (separate_rx designs)
  t1_basis: 'tier 1 (generic) cost-share basis: copay or coinsurance; enum'
  t1_copay: tier 1 flat copay per 30-day retail supply when basis is copay, USD (0.00 when basis is coinsurance)
  t1_coinsurance_rate: tier 1 coinsurance as a fraction of the allowed amount when basis is coinsurance (0.00 when copay)
  t1_coinsurance_min: tier 1 per-fill coinsurance minimum, USD (0.00 = no minimum)
  t1_coinsurance_max: tier 1 per-fill coinsurance maximum, USD (0.00 = no per-fill maximum)
  t2_basis: 'tier 2 (preferred brand) cost-share basis: copay or coinsurance; enum'
  t2_copay: tier 2 flat copay per 30-day retail supply, USD (0.00 when basis is coinsurance)
  t2_coinsurance_rate: tier 2 coinsurance fraction of the allowed amount (0.00 when copay)
  t2_coinsurance_min: tier 2 per-fill coinsurance minimum, USD (0.00 = no minimum)
  t2_coinsurance_max: tier 2 per-fill coinsurance maximum, USD (0.00 = no per-fill maximum)
  t3_basis: 'tier 3 (non-preferred brand) cost-share basis: copay or coinsurance; enum'
  t3_copay: tier 3 flat copay per 30-day retail supply, USD (0.00 when basis is coinsurance)
  t3_coinsurance_rate: tier 3 coinsurance fraction of the allowed amount (0.00 when copay)
  t3_coinsurance_min: tier 3 per-fill coinsurance minimum, USD (0.00 = no minimum)
  t3_coinsurance_max: tier 3 per-fill coinsurance maximum, USD (0.00 = no per-fill maximum)
  t4_basis: 'tier 4 (preferred specialty) cost-share basis: copay or coinsurance; enum'
  t4_copay: tier 4 flat copay per 30-day supply, USD (0.00 when basis is coinsurance)
  t4_coinsurance_rate: tier 4 coinsurance fraction of the allowed amount (0.00 when copay)
  t4_coinsurance_min: tier 4 per-fill coinsurance minimum, USD (0.00 = no minimum)
  t4_coinsurance_max: tier 4 per-fill coinsurance maximum, USD (0.00 = no per-fill maximum)
  t5_basis: 'tier 5 (non-preferred specialty) cost-share basis: copay or coinsurance; enum'
  t5_copay: tier 5 flat copay per 30-day supply, USD (0.00 when basis is coinsurance)
  t5_coinsurance_rate: tier 5 coinsurance fraction of the allowed amount (0.00 when copay)
  t5_coinsurance_min: tier 5 per-fill coinsurance minimum, USD (0.00 = no minimum)
  t5_coinsurance_max: tier 5 per-fill coinsurance maximum, USD (0.00 = no per-fill maximum)
  insulin_cap_30day: maximum member cost share for a 30-day supply of a covered insulin product, USD
  aca_preventive_zero_cost_share: ACA preventive-service drugs (e.g. generic contraceptives, low-dose statins for adults 40-75, tobacco cessation) are covered at zero member cost share; boolean
  daw_member_penalty: when a member requests a brand drug for which an A-rated generic is available (DAW 2), the member pays the brand-generic cost difference in addition to the generic copay; boolean
  daw1_prescriber_waiver: the brand-generic difference is waived when the prescriber marks the prescription dispense-as-written (DAW 1); boolean
  daw_penalty_counts_to_oop: the brand-generic difference counts toward the out-of-pocket maximum; boolean
  q4_deductible_carryover: deductible amounts incurred in the last calendar quarter of a plan year are credited to the next plan year's deductible; boolean
  q4_carryover_start_month: first calendar month of the fourth-quarter carryover period (month number 1-12)
  accumulator_adjustment_program: standard = manufacturer copay-assistance payments count toward deductible and out-of-pocket; accumulator_adjustment = only the member's own payments count; enum
  prior_carrier_accumulator_credit: deductible and out-of-pocket already met under a prior pharmacy carrier in the same plan year are credited on takeover; boolean
  prior_carrier_credit_request_days: calendar days after the coverage effective date within which a prior-carrier accumulator statement must be received to be credited
  prior_year_accumulator_correction_days: calendar days after the last day of a plan year during which that plan year's accumulators may still be corrected
  retro_termination_limit_days: maximum calendar days a sponsor eligibility termination may be dated back before the date the termination record is received
  claims_runout_days: calendar days after the coverage end date during which reimbursement requests for dates of service while covered are still accepted
  cobra_max_months: maximum COBRA continuation period in months for a termination of employment or reduction of hours
  cobra_election_window_days: calendar days from the later of the coverage end date and the COBRA election notice date within which a COBRA election reinstates coverage
  cobra_premium_grace_days: calendar days after a COBRA premium due date during which the premium may be paid before coverage terminates
  dependent_age_limit: age at which a child dependent's coverage ends (coverage runs through the end of the month of that birthday)
  id_card_mail_reissue_limit: maximum mailed replacement ID cards per member per plan year (digital wallet cards are unlimited)
  id_card_mail_delivery_business_days: business days for a mailed replacement ID card to arrive
  cob_questionnaire_interval_months: months between coordination-of-benefits questionnaires sent to a member
  cob_response_days: calendar days a member has to return a coordination-of-benefits questionnaire before claims pend for other-coverage review
  cob_method: 'secondary-payer method when Northbridge Rx is secondary: standard_cob (pays up to its normal benefit), non_duplication (pays only the excess of its benefit over the primary payment), carve_out (reduces its benefit by the primary payment); enum'
  otc_covered_with_prescription: over-the-counter products on the covered OTC list are covered at tier 1 when prescribed; boolean
  vaccine_zero_cost_at_network_pharmacy: ACIP-recommended vaccines given at a network pharmacy are covered at zero member cost share; boolean
  member_cost_share_rounding: rounding applied to every computed member cost share; enum

