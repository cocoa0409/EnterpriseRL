events:
  - type: review_enroll
    target: review_programs
    mutation: create
    meaning: A review program is opened for a member when the plan enrollment is created.
    grain: one row per plan enrollment
    fields:
      customer_id: covered member
      plan_enrollment_id: plan enrollment it belongs to
      variant_name: review package the sponsor elected
      effective_date: plan coverage effective date
    triggers: []
  - type: review_activate
    target: review_programs
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: The review package takes effect with the plan coverage.
    grain: one row per transaction
    fields:
      effective_date: the effective date reached
    triggers: []
  - type: review_terminate
    target: review_programs
    mutation:
      transition:
        - {from: active, to: terminated}
        - {from: pending_effective, to: terminated}
    meaning: The review program ends because plan coverage ended or was cancelled.
    grain: one row per transaction
    fields:
      end_date: last day of plan coverage
    triggers: []
  - type: review_reinstate
    target: review_programs
    mutation: {transition: {from: terminated, to: active}}
    meaning: The review program is restored by a COBRA reinstatement.
    grain: one row per transaction
    fields:
      end_date: cleared, because coverage continues
    triggers: []
  - type: review_reassign
    target: review_programs
    mutation: update
    meaning: The sponsor moves its members to a different review package, normally at plan year renewal.
    grain: one row per transaction
    fields:
      variant_name: the new review package
    triggers: []
  - type: review_case_opened
    target: review_cases
    meaning: A coverage review request for one drug is received.
    grain: one row per review request for one drug and review type
    distinguish_by: [drug_name, review_type, event_at]
    fields:
      drug_name: drug
      drug_strength: strength
      review_type: kind of review
      is_renewal: whether it renews an approval
      review_priority: standard or urgent
      requested_by: who asked
      prescriber_npi: prescriber
      diagnosis_code: diagnosis given
      criteria_basis: ground relied on
      requested_quantity_per_30: quantity requested for a quantity limit exception
      event_at: moment received
    triggers: []
  - type: review_case_info_requested
    target: review_cases
    meaning: The reviewer asks the prescriber for missing clinical information and the case pends.
    grain: one row per information request on one case
    distinguish_by: [source_case_id, event_at]
    fields:
      source_case_id: the case
      drug_name: drug of the case
      review_type: type of the case
      event_at: moment of the request
    triggers: []
  - type: review_case_info_received
    target: review_cases
    meaning: Requested clinical information is received from the prescriber.
    grain: one row per information receipt on one case
    distinguish_by: [source_case_id, event_at]
    fields:
      source_case_id: the case
      drug_name: drug of the case
      review_type: type of the case
      diagnosis_code: diagnosis documented
      criteria_basis: ground the information supports
      review_priority: priority after any urgency attestation
      event_at: moment received
    triggers: []
  - type: review_case_approved
    target: review_cases
    meaning: A review case is approved.
    grain: one row per approval of one case
    distinguish_by: [source_case_id]
    fields:
      source_case_id: the case
      drug_name: drug of the case
      review_type: type of the case
      is_renewal: whether it renews an approval
      requested_quantity_per_30: quantity approved for a quantity limit exception
      decision_reason: criteria_met
      event_at: moment of decision
    triggers:
      - event: review:review_auth_granted
        when: {review_type: prior_authorization}
        map: {source_case_id: source_case_id, drug_name: drug_name, authorization_type: prior_authorization, auth_basis: clinical_review}
      - event: review:review_auth_granted
        when: {review_type: step_therapy_exception}
        map: {source_case_id: source_case_id, drug_name: drug_name, authorization_type: step_therapy, auth_basis: clinical_review}
      - event: review:review_auth_granted
        when: {review_type: quantity_limit_exception}
        map: {source_case_id: source_case_id, drug_name: drug_name, authorization_type: quantity_limit, auth_basis: clinical_review, approved_quantity_per_30: requested_quantity_per_30}
  - type: review_case_denied
    target: review_cases
    meaning: A review case is denied.
    grain: one row per denial of one case
    distinguish_by: [source_case_id]
    fields:
      source_case_id: the case
      drug_name: drug of the case
      review_type: type of the case
      decision_reason: reason for the denial
      event_at: moment of decision
    triggers: []
  - type: review_case_withdrawn
    target: review_cases
    meaning: The requester withdraws an undecided case.
    grain: one row per withdrawn case
    distinguish_by: [source_case_id]
    fields:
      source_case_id: the case
      drug_name: drug of the case
      requested_by: who withdrew it
      event_at: moment of withdrawal
    triggers: []
  - type: review_case_auto_approved
    target: review_cases
    meaning: A step edit is satisfied automatically from claims history when the target drug is billed, without a manual case.
    grain: one row per automated step approval for one drug
    distinguish_by: [drug_name, event_at]
    fields:
      drug_name: target drug
      review_type: step_therapy_exception
      criteria_basis: step_drugs_tried
      decision_reason: criteria_met
      event_at: moment of the automated check
    triggers:
      - event: review:review_auth_granted
        map: {source_case_id: review_case_id, drug_name: drug_name, authorization_type: step_therapy, auth_basis: automated_step}
  - type: review_auth_granted
    target: review_authorizations
    meaning: An authorization is put in force for one drug for a defined period.
    grain: one row per authorization period granted
    distinguish_by: [drug_name, authorization_type, effective_date]
    fields:
      source_case_id: case that produced it
      drug_name: drug
      authorization_type: edit satisfied
      auth_basis: how it came about
      approved_quantity_per_30: approved quantity for a quantity limit exception
      effective_date: first day in force
      expiration_date: last day in force
    triggers: []
  - type: review_auth_terminated
    target: review_authorizations
    meaning: An authorization in force is ended before its expiration date.
    grain: one row per authorization ended
    distinguish_by: [source_authorization_id]
    fields:
      source_authorization_id: the authorization ended
      drug_name: drug
      authorization_type: edit it satisfied
      expiration_date: new last day in force
      termination_reason: why it ended
    triggers: []

measures:
  - id: review_msr_step_trials
    window: step_lookback_days calendar days ending on the date the step is evaluated (that date as day zero)
    measure: number of distinct prerequisite drugs of the target's step protocol for which the member's paid, unreversed retail claims, shipped home delivery orders and shipped specialty fills add up to at least step_trial_min_days_supply days supply
  - id: review_msr_target_recent_claim
    window: step_grandfathering_days calendar days ending on the claim date (claim date as day zero)
    measure: whether at least one paid, unreversed claim (retail, home delivery or specialty) for the target drug itself exists

policies:
  - id: review_agg_multi_holding
    subject: [review_enroll]
    rule: >-
      A member holds at most one review program that is not terminated, tied to their open plan enrollment.
      A new review program may be opened only when no review program of that member is pending_effective or active.
    eligibility:
      - id: one_open_program
        applies_to: [review_enroll]
        kind: dedup
        condition: A new review program may be opened only when no review program of that member is pending_effective or active.
        evidence_fields: [review_programs.customer_id, review_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_programs.customer_id]
          action_bindings:
            review_programs.customer_id: customer_id
        dedup_contract:
          table: review_programs
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_effective, active]}
          distinct_fields: [effective_date]
    params:
      max_per_customer: 1

  - id: review_requirements
    subject: [review_case_opened, review_case_denied]
    rule: >-
      A drug needs a prior authorization when it is in the package's pa_required_drugs, a step therapy approval when it is a target in step_therapy_protocols, and a quantity limit exception only when a claim asks for more than its quantity_limits entry per rolling 30 days.
      A request for a drug and review type that the package does not require is denied with no_review_required and the member is told the drug needs no review; a request for a drug the formulary excludes is denied with not_a_covered_use, because review cannot cover an excluded drug.
      Diagnosis codes are required on reviews of drugs in diagnosis_required_drugs, and an off-label use is approvable only with compendia support when off_label_compendia_required is true.
      A review approval never changes the drug's formulary tier; a non-formulary drug still needs a formulary exception.
    eligibility: []
    params:
      per_tier:
        Northbridge Clinical Essentials: {pa: "=pa_required_drugs", steps: "=step_therapy_protocols", ql: "=quantity_limits"}
        Northbridge Clinical Standard: {pa: "=pa_required_drugs", steps: "=step_therapy_protocols", ql: "=quantity_limits"}
        Northbridge Clinical Advanced: {pa: "=pa_required_drugs", steps: "=step_therapy_protocols", ql: "=quantity_limits"}
        Northbridge Clinical Advanced Plus: {pa: "=pa_required_drugs", steps: "=step_therapy_protocols", ql: "=quantity_limits"}
        Northbridge Clinical Comprehensive: {pa: "=pa_required_drugs", steps: "=step_therapy_protocols", ql: "=quantity_limits"}
        Northbridge Clinical Comprehensive Specialty: {pa: "=pa_required_drugs", steps: "=step_therapy_protocols", ql: "=quantity_limits"}

  - id: review_evt_case_intake
    subject: [review_case_opened, review_case_withdrawn]
    rule: >-
      A case is opened by the prescriber or, when member_initiated_review_allowed is true, by the member or an authorized representative, for one drug and one review type; the prescriber's clinical information is required to decide it whoever opens it.
      A case is urgent only on the prescriber's attestation while urgent_attestation_required is true; a member's own statement of urgency does not make it urgent, and when urgent_downgrade_allowed is true a request filed as urgent without that attestation is handled as standard.
      A case may be opened only while the member's review program is active.
      While one_open_case_per_drug_type is true, only one undecided case may exist for the same member, drug and review type: a new case may be opened only when no case for the same drug and review type is still undecided.
      An undecided case may be withdrawn by its requester or the member when withdrawal_allowed is true; a withdrawn case is never decided.
    eligibility:
      - id: case_on_active_program
        applies_to: [review_case_opened]
        kind: state
        condition: A case may be opened only while the member's review program is active.
        evidence_fields: [review_programs.status, review_programs.review_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_programs.review_program_id]
          action_bindings:
            review_programs.review_program_id: review_program_id
        state_contract:
          field: review_programs.status
          allowed: [active]
      - id: one_undecided_case
        applies_to: [review_case_opened]
        kind: dedup
        condition: a new case may be opened only when no case for the same drug and review type is still undecided.
        evidence_fields: [review_cases.customer_id, review_cases.drug_name, review_cases.review_type, review_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_cases.customer_id, review_cases.drug_name, review_cases.review_type]
          action_bindings:
            review_cases.customer_id: customer_id
            review_cases.drug_name: drug_name
            review_cases.review_type: review_type
        dedup_contract:
          table: review_cases
          mode: separate_record
          object_bindings: {customer_id: customer_id, drug_name: drug_name, review_type: review_type}
          duplicate_filters: {event_type: [review_case_opened]}
          distinct_fields: [event_at]
      - id: withdraw_undecided
        applies_to: [review_case_withdrawn]
        kind: dedup
        condition: An undecided case may be withdrawn by its requester or the member when withdrawal_allowed is true; a withdrawn case is never decided.
        evidence_fields: [review_cases.source_case_id, review_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_cases.source_case_id]
          action_bindings:
            review_cases.source_case_id: source_case_id
        dedup_contract:
          table: review_cases
          mode: separate_record
          object_bindings: {source_case_id: source_case_id}
          duplicate_filters: {event_type: [review_case_approved, review_case_denied, review_case_withdrawn]}
          distinct_fields: []

  - id: review_evt_decision
    subject: [review_case_info_requested, review_case_info_received, review_case_approved, review_case_denied]
    rule: >-
      A standard case is decided within standard_decision_hours and an urgent case within urgent_decision_hours of its receipt.
      When the clinical information needed to apply the criteria is missing, the reviewer makes info_request_attempts outreach attempts and the case pends; it is decided as soon as the information is received.
      A case with an information request outstanding may be denied for missing information only after info_request_wait_days calendar days have fully elapsed since the information request, counting the request date as day zero.
      A case is approved with criteria_met when the clinical information on file meets the package's criteria for the drug and review type, and denied with criteria_not_met, step_not_satisfied or missing_clinical_information otherwise; a request for a drug that already has an approval of the same type in force is denied with already_approved unless it is a renewal inside the renewal window.
      While case_decision_once is true a case takes exactly one decision: a case may be decided only when it has no approval, denial or withdrawal yet.
      Approvals may be made by a reviewer at pharmacist_review_level or above; an urgent denial needs a physician reviewer when physician_review_for_denial_of_urgent is true.
    eligibility:
      - id: wait_before_missing_info_denial
        applies_to: [review_case_denied]
        kind: time
        condition: A case with an information request outstanding may be denied for missing information only after info_request_wait_days calendar days have fully elapsed since the information request, counting the request date as day zero.
        evidence_fields: [review_cases.event_at, review_cases.source_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_cases.source_case_id]
          action_bindings:
            review_cases.source_case_id: source_case_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the information request
          anchor_source: review_cases.event_at
          relation: not_before
          duration_source: variants.info_request_wait_days
          unit: calendar_days
          counting_rule: counting the request date as day zero
          boundary: exclusive
      - id: decide_once
        applies_to: [review_case_approved, review_case_denied]
        kind: dedup
        condition: a case may be decided only when it has no approval, denial or withdrawal yet.
        evidence_fields: [review_cases.source_case_id, review_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_cases.source_case_id]
          action_bindings:
            review_cases.source_case_id: source_case_id
        dedup_contract:
          table: review_cases
          mode: separate_record
          object_bindings: {source_case_id: source_case_id}
          duplicate_filters: {event_type: [review_case_approved, review_case_denied, review_case_withdrawn]}
          distinct_fields: []

  - id: review_step_therapy
    subject: [review_case_auto_approved, review_case_approved, review_case_denied]
    rule: >-
      A step therapy target is covered once the member has tried the protocol's prerequisites: at least trials_required different prerequisite drugs, each with at least step_trial_min_days_supply days supply in Northbridge Rx claims history within step_lookback_days before the date the step is evaluated (review_msr_step_trials), trials_required being the protocol entry's own count.
      A member with a paid claim for the target drug itself within step_grandfathering_days before the claim date (review_msr_target_recent_claim) is exempt from the step.
      When automated_step_check is true and the history satisfies the step (or the member is grandfathered), the approval is recorded automatically when the drug is billed, as an auto-approved case event when auto_approval_creates_case_record is true; otherwise a step therapy exception case is needed.
      A step therapy exception case is approved with criteria_met when the trials are found in claims history, when the prescriber documents trials outside Northbridge Rx history (another carrier's claims or samples) with dates and days supply, or when every prerequisite is contraindicated; otherwise it is denied with step_not_satisfied.
      An automated step approval may be recorded only when the claims history satisfies the step or the member is grandfathered.
    eligibility:
      - id: history_satisfies_step
        applies_to: [review_case_auto_approved]
        kind: authorization
        condition: An automated step approval may be recorded only when the claims history satisfies the step or the member is grandfathered.
        evidence_fields: [retail_claims.customer_id, retail_claims.drug_name, retail_claims.date_of_service, retail_claims.days_supply, review_cases.drug_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retail_claims.customer_id, review_cases.drug_name]
          action_bindings:
            retail_claims.customer_id: customer_id
            review_cases.drug_name: drug_name
    measures: [review_msr_step_trials, review_msr_target_recent_claim]
    params:
      trials_required: "=step_therapy_protocols"
    formula:
      step_satisfied: "review_msr_step_trials >= trials_required"

  - id: review_quantity_limit
    subject: [review_case_approved, review_case_denied]
    rule: >-
      A quantity limit exception is approved with criteria_met when the prescriber documents medical necessity for a quantity above the drug's quantity_limits entry, up to ql_exception_max_multiple times that limit per rolling 30 days; a request above that multiple is approved only up to it, and the approved quantity is recorded on the authorization.
      The drug_quantity_limit is the drug's entry in quantity_limits; opioid claims above the network's daily MME limit are reviewed as quantity limit exceptions when opioid_mme_review is true.
      Quantity is counted per ql_basis.
    eligibility: []
    params:
      drug_quantity_limit: "=quantity_limits"
    formula:
      approved_quantity_per_30: "min(requested_quantity_per_30, drug_quantity_limit * ql_exception_max_multiple)"

  - id: review_authorization_period
    subject: [review_auth_granted]
    rule: >-
      A new prior authorization runs pa_approval_months from its effective date, or the months initial_approval_month_overrides gives for the drug; a renewal runs renewal_approval_months; a step approval runs step_approval_months; a quantity limit exception runs ql_approval_months.
      The expiration date is the day before the same day-of-month that many months later, falling back to the last day of the month when that day does not exist.
      The effective date is the decision date, except that it may be set back up to retro_effective_days calendar days before the decision date to cover a fill the member already paid for, and a renewal approved before the current approval expires takes effect per renewal_effective_basis, the day after the current expiration date.
      An approval covers only the strength requested unless approval_covers_strength_changes is true.
      A renewal case may be opened from renewal_window_days before the current expiration date; when renewal_requires_new_clinicals is true it needs documented response to therapy, and a weight-management GLP-1 renewal needs documented loss of at least glp1_weight_renewal_min_loss of baseline weight.
      When auto_renewal_chronic is true, approvals for drugs in auto_renewal_drugs with continuous paid claims renew automatically with auth_basis auto_renewal.
      At most maximum_open_auths_per_drug approval of the same type is in force for a drug at any time, so a renewal granted early takes effect only the day after the current one expires.
    eligibility: []

  - id: review_continuity_of_care
    subject: [review_auth_granted]
    rule: >-
      A new member who had an approval for a drug at their prior pharmacy carrier keeps coverage for it without a new review for continuity_approval_days from the review program effective date, provided the prior carrier's approval letter is on file and, when continuity_requires_prior_claims is true, prior-carrier claims history for the drug is too.
      A continuity-of-care approval may be granted only within continuity_of_care_days calendar days of the review program effective date, counting that date as day 1.
      The member must obtain a regular approval before the continuity approval ends.
    eligibility:
      - id: continuity_window
        applies_to: [review_auth_granted]
        kind: time
        condition: A continuity-of-care approval may be granted only within continuity_of_care_days calendar days of the review program effective date, counting that date as day 1.
        evidence_fields: [review_programs.effective_date, review_programs.review_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_programs.review_program_id]
          action_bindings:
            review_programs.review_program_id: review_program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the review program effective date
          anchor_source: review_programs.effective_date
          relation: not_after
          duration_source: variants.continuity_of_care_days
          unit: calendar_days
          counting_rule: counting that date as day 1
          boundary: inclusive

  - id: review_evt_auth_termination
    subject: [review_auth_terminated]
    rule: >-
      An authorization ends early only when plan coverage ends (coverage_ended, while auth_ends_with_coverage is true), when a renewal replaces it (replaced_by_renewal), or when the prescriber asks to end it because therapy stopped (prescriber_request); a member's request alone never ends it.
      An authorization may be ended only once, by naming the granted authorization it ends.
      On a COBRA reinstatement approvals ended for coverage_ended resume through their original expiration date; when the sponsor changes review package, approvals in force carry over while auth_carryover_on_package_change is true.
    eligibility:
      - id: terminate_once
        applies_to: [review_auth_terminated]
        kind: dedup
        condition: An authorization may be ended only once, by naming the granted authorization it ends.
        evidence_fields: [review_authorizations.source_authorization_id, review_authorizations.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [review_authorizations.source_authorization_id]
          action_bindings:
            review_authorizations.source_authorization_id: source_authorization_id
        dedup_contract:
          table: review_authorizations
          mode: separate_record
          object_bindings: {source_authorization_id: source_authorization_id}
          duplicate_filters: {event_type: [review_auth_terminated]}
          distinct_fields: []

  - id: review_specialty_guideline
    subject: [review_case_approved, review_case_denied]
    rule: >-
      When specialty_guideline_management is true, a renewal of a specialty drug is approved only with documented response to therapy (criteria_basis documented_response) and a dose within the labeled range; otherwise it is denied with criteria_not_met and the member's specialty enrollment goes on hold when the current approval expires.
      When it is false, specialty renewals follow the general renewal rule.
    eligibility: []

  - id: review_lifecycle
    subject: [review_enroll, review_activate, review_terminate, review_reinstate, review_reassign]
    rule: >-
      The review program follows the plan enrollment: it opens with it, takes effect on its effective date, ends with it and is restored by a COBRA reinstatement; member services never opens or ends it on request.
      A sponsor's change of package takes effect at plan year renewal, and the new package's requirements apply to claims from that date, subject to approvals carried over.
      Electronic requests are accepted when epa_supported is true, urgent reviews are taken around the clock when urgent_intake_24x7 is true, criteria follow clinical_criteria_source, and when denial_notice_includes_alternatives is true a denial lists the formulary alternatives that need no review.
    eligibility: []
