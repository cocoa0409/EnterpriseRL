category: sponsor
display_name: PBM Services Agreement

binding:
  holding_table: sponsor_agreements
  event_tables: [sponsor_invoices, sponsor_rebates, sponsor_operations]
  intake_tables: [sponsor_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {receivable_balance: sponsor_receivable, rebate_balance: rebate_payable}

lifecycle:
  states: [pending_implementation, active, termination_pending, terminated]
  transitions:
    - {from: pending_implementation, to: active, by: system, means: The go-live date is reached and claims start adjudicating under the agreement.}
    - {from: pending_implementation, to: terminated, by: user, means: The sponsor confirms cancelling the agreement before go-live.}
    - {from: active, to: termination_pending, by: user, means: The sponsor confirms a written notice of termination.}
    - {from: termination_pending, to: active, by: user, means: The sponsor confirms rescinding its termination notice before the termination date.}
    - {from: termination_pending, to: terminated, by: system, means: The termination date is reached.}

accounts:
  - key: sponsor_receivable
    unit: USD
    meaning: Amount the plan sponsor owes Northbridge Rx for claims and fees; raised by invoices and late charges and lowered by payments and credit memos.
  - key: rebate_payable
    unit: USD
    meaning: Manufacturer rebates and guarantee amounts owed to the sponsor and not yet paid; raised by quarterly accruals and lowered by payments and offsets.

parameter_schema:
  pricing_model: 'how drug cost is billed: spread (fixed guaranteed rates billed regardless of pharmacy reimbursement), pass_through (billed exactly what the pharmacy is paid, plus fees) or cost_plus (acquisition cost plus a markup and a flat dispensing fee); enum'
  admin_fee_pepm: administrative fee per enrolled employee (subscriber) per month, USD
  clinical_program_fee_pepm: fee per enrolled employee per month for clinical programs (utilization management, specialty care management), USD
  brand_retail_awp_discount: guaranteed discount off average wholesale price for brand retail claims, fraction (0.00 under cost-plus)
  generic_retail_effective_rate: guaranteed effective discount off average wholesale price across generic retail claims, fraction (0.00 under cost-plus)
  brand_mail_awp_discount: guaranteed discount off average wholesale price for brand home delivery claims, fraction (0.00 under cost-plus)
  generic_mail_effective_rate: guaranteed effective discount off average wholesale price across generic home delivery claims, fraction (0.00 under cost-plus)
  specialty_awp_discount: guaranteed discount off average wholesale price for specialty claims, fraction (0.00 under cost-plus)
  retail_dispensing_fee: dispensing fee per retail claim billed to the sponsor, USD
  mail_dispensing_fee: dispensing fee per home delivery claim billed to the sponsor, USD
  cost_plus_markup: markup over acquisition cost on cost-plus claims, fraction (0.00 for other models)
  rebate_passthrough_share: share of manufacturer rebates passed to the sponsor, fraction
  rebate_guarantee_brand_retail: minimum rebate guaranteed per brand retail prescription, USD (0.00 = no guarantee)
  rebate_guarantee_brand_mail: minimum rebate guaranteed per brand home delivery prescription, USD (0.00 = no guarantee)
  rebate_guarantee_specialty: minimum rebate guaranteed per specialty prescription, USD (0.00 = no guarantee)
  rebate_guarantee_formularies: formularies the sponsor's members must be on for the rebate guarantee to apply
  rebate_payment_frequency: how often rebates are paid; enum
  rebate_payment_lag_days: calendar days after a calendar quarter ends within which that quarter's rebates are paid
  rebate_true_up_days: calendar days after the contract year ends within which the annual rebate guarantee true-up is paid
  rebate_offset_allowed: the sponsor may elect to apply a rebate payment as a credit against open invoices; boolean
  invoice_cycle: claims invoicing cycle; enum
  payment_terms_days: calendar days after the invoice date within which an invoice is due
  late_payment_interest_monthly: interest per month on an invoice amount unpaid past the grace period, fraction
  late_charge_grace_days: calendar days after the due date before late interest is charged
  claims_funding_deposit_weeks: weeks of average claims cost held as a funding deposit (0 = none)
  pg_call_answer_seconds: average speed-to-answer guaranteed on member service calls, seconds
  pg_call_answer_penalty: credit to the sponsor for missing the speed-to-answer guarantee in a contract year, USD
  pg_claims_accuracy: claims financial accuracy guaranteed, fraction
  pg_claims_accuracy_penalty: credit for missing the claims accuracy guarantee in a contract year, USD
  pg_mail_turnaround_days: business days guaranteed to dispense clean home delivery prescriptions
  pg_mail_turnaround_penalty: credit for missing the home delivery turnaround guarantee in a contract year, USD
  pg_credit_payment_days: calendar days after the contract year ends within which performance guarantee credits are issued
  eligibility_file_frequency: how often the sponsor sends eligibility files; enum
  eligibility_error_threshold: share of records rejected above which a whole eligibility file is held for the sponsor to correct, fraction
  eligibility_load_business_days: business days to load a clean eligibility file
  audit_rights_per_year: claims audits the sponsor may start per contract year
  audit_lookback_months: months of claims an audit may cover, ending on the audit notice date
  audit_notice_days: calendar days of written notice before an audit starts
  initial_term_months: initial contract term in months from go-live
  renewal_term_months: automatic renewal term in months after the initial term
  termination_notice_days: calendar days of written notice required to terminate without cause
  early_termination_fee_pepm: fee per enrolled employee for each month remaining in the initial term when terminated without cause before it ends, USD
  implementation_credit_per_employee: one-time implementation credit per enrolled employee at go-live, USD
  implementation_lead_days: minimum calendar days from signing to go-live
  market_check_months: months between market checks of pricing guarantees (0 = none)
  invoice_dispute_window_days: calendar days after the invoice date within which an invoice may be disputed
  dispute_resolution_days: calendar days to resolve a timely invoice dispute
  claims_data_feed_frequency: how often claims data is sent to the sponsor's vendors; enum
  account_management: account management model; enum
  specialty_exclusive_required: the pricing tier requires members to be on an exclusive specialty program; boolean

