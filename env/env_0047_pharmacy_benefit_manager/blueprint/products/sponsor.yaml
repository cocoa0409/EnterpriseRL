events:
  - type: sponsor_contract
    target: sponsor_agreements
    mutation: create
    meaning: A plan sponsor signs a PBM services agreement.
    grain: one row per agreement
    fields:
      customer_id: plan sponsor
      variant_name: pricing arrangement
      funding_arrangement: funding of the sponsor's plan
      signed_date: signing date
      go_live_date: agreed go-live date
      renewal_date: end of the initial term
      covered_employees: employees expected at go-live
      receivable_balance: 0.00 at signing
      rebate_balance: 0.00 at signing
    triggers: []
  - type: sponsor_go_live
    target: sponsor_agreements
    mutation: {transition: {from: pending_implementation, to: active}}
    meaning: The agreement goes live.
    grain: one row per transaction
    fields:
      go_live_date: actual go-live date
    triggers: []
  - type: sponsor_cancel_implementation
    target: sponsor_agreements
    mutation: {transition: {from: pending_implementation, to: terminated}}
    meaning: The sponsor cancels before go-live.
    grain: one row per transaction
    fields:
      termination_date: date of cancellation
    triggers: []
  - type: sponsor_give_notice
    target: sponsor_agreements
    mutation: {transition: {from: active, to: termination_pending}}
    meaning: The sponsor's termination notice takes effect on the agreement.
    grain: one row per transaction
    fields:
      termination_notice_date: date the notice was received
      termination_date: last day of the agreement
    triggers: []
  - type: sponsor_rescind_notice
    target: sponsor_agreements
    mutation: {transition: {from: termination_pending, to: active}}
    meaning: The sponsor withdraws its termination notice.
    grain: one row per transaction
    fields:
      termination_notice_date: cleared
      termination_date: cleared
    triggers: []
  - type: sponsor_terminate
    target: sponsor_agreements
    mutation: {transition: {from: termination_pending, to: terminated}}
    meaning: The agreement ends on its termination date.
    grain: one row per transaction
    fields:
      termination_date: last day of the agreement
    triggers: []
  - type: sponsor_renew
    target: sponsor_agreements
    mutation: update
    meaning: The agreement renews automatically for another term.
    grain: one row per transaction
    fields:
      renewal_date: end of the new term
    triggers: []
  - type: sponsor_lives_update
    target: sponsor_agreements
    mutation: update
    meaning: The enrolled employee count is refreshed from an eligibility load.
    grain: one row per transaction
    fields:
      covered_employees: employees on the latest load
    triggers: []
  - type: sponsor_claims_invoice
    target: sponsor_invoices
    meaning: Claims adjudicated in a billing period are invoiced to the sponsor.
    grain: one row per claims billing period
    distinguish_by: [billing_period_start, billing_period_end]
    fields:
      billing_period_start: first day of the period
      billing_period_end: last day of the period
      entry_date: invoice date
      due_date: due date
      amount: amount invoiced
      claim_count: claims billed
    account: sponsor_receivable
    direction: in
    triggers: []
  - type: sponsor_admin_invoice
    target: sponsor_invoices
    meaning: Monthly administrative and clinical program fees are invoiced.
    grain: one row per month of fees
    distinguish_by: [billing_period_start, billing_period_end]
    fields:
      billing_period_start: first day of the month
      billing_period_end: last day of the month
      entry_date: invoice date
      due_date: due date
      amount: fees invoiced
      employee_months: employee-months billed
    account: sponsor_receivable
    direction: in
    triggers: []
  - type: sponsor_late_charge
    target: sponsor_invoices
    meaning: Late payment interest is charged on an overdue invoice.
    grain: one row per overdue invoice per month of lateness
    distinguish_by: [source_invoice_id, entry_date]
    fields:
      source_invoice_id: the overdue invoice
      entry_date: date charged
      amount: interest charged
    account: sponsor_receivable
    direction: in
    triggers: []
  - type: sponsor_payment
    target: sponsor_invoices
    meaning: A sponsor payment is applied to an invoice.
    grain: one row per payment applied to one invoice
    distinguish_by: [source_invoice_id, entry_date, amount]
    fields:
      source_invoice_id: invoice paid
      entry_date: payment date
      amount: amount applied
      payment_method: instrument
    account: sponsor_receivable
    direction: out
    triggers: []
  - type: sponsor_credit_memo
    target: sponsor_invoices
    meaning: A credit lowers the sponsor's receivable (performance guarantee, billing error, rebate offset or implementation credit).
    grain: one row per credit applied to one invoice
    distinguish_by: [source_invoice_id, credit_reason, entry_date]
    fields:
      source_invoice_id: invoice credited
      entry_date: credit date
      amount: amount credited
      credit_reason: reason
    account: sponsor_receivable
    direction: out
    triggers: []
  - type: sponsor_rebate_accrual
    target: sponsor_rebates
    meaning: The sponsor's share of a quarter's rebates (or the guarantee, when higher) is accrued.
    grain: one row per agreement per calendar quarter
    distinguish_by: [rebate_quarter]
    fields:
      rebate_quarter: quarter earned
      brand_retail_rx: brand retail prescriptions
      brand_mail_rx: brand home delivery prescriptions
      specialty_rx: specialty prescriptions
      entry_date: accrual date
      amount: amount accrued
    account: rebate_payable
    direction: in
    triggers: []
  - type: sponsor_rebate_payment
    target: sponsor_rebates
    meaning: An accrued quarter's rebates are paid to the sponsor.
    grain: one row per payment of one accrual
    distinguish_by: [source_rebate_id]
    fields:
      source_rebate_id: accrual paid
      rebate_quarter: quarter
      entry_date: payment date
      amount: amount paid
    account: rebate_payable
    direction: out
    triggers: []
  - type: sponsor_rebate_offset
    target: sponsor_rebates
    meaning: At the sponsor's election, an accrued quarter's rebates are applied as a credit against an open invoice instead of paid.
    grain: one row per accrual applied to one invoice
    distinguish_by: [source_rebate_id, source_invoice_id]
    fields:
      source_rebate_id: accrual applied
      source_invoice_id: invoice credited
      rebate_quarter: quarter
      entry_date: offset date
      amount: amount applied
    account: rebate_payable
    direction: out
    triggers:
      - event: sponsor:sponsor_credit_memo
        map: {source_invoice_id: source_invoice_id, entry_date: entry_date, amount: amount, credit_reason: rebate_offset}
  - type: sponsor_eligibility_load
    target: sponsor_operations
    meaning: A sponsor eligibility file is received and loaded or held.
    grain: one row per eligibility file
    distinguish_by: [file_date, records_received]
    fields:
      file_date: date received
      records_received: records in the file
      records_rejected: records rejected
      load_outcome: loaded or held
    triggers:
      - event: sponsor:sponsor_lives_update
        when: {load_outcome: loaded}
        map: {}
  - type: sponsor_audit_finding
    target: sponsor_operations
    meaning: A completed claims audit reports a finding owed to the sponsor.
    grain: one row per audit report
    distinguish_by: [audit_period_start, audit_period_end]
    fields:
      file_date: audit report date
      audit_period_start: first claim date audited
      audit_period_end: last claim date audited
      finding_amount: amount owed to the sponsor
    triggers: []

measures:
  - id: sponsor_msr_audits_this_year
    window: current contract year, from the latest anniversary of go_live_date through frozen_time
    measure: count of audit_request service requests on this agreement that are not cancelled

policies:
  - id: sponsor_agg_multi_holding
    subject: [sponsor_contract]
    rule: >-
      A plan sponsor holds at most one PBM services agreement that is not terminated; a change of pricing arrangement is made at renewal by amendment of the same agreement, never by a second one.
      A new agreement may be signed only when the sponsor has no agreement that is pending_implementation, active or termination_pending.
    eligibility:
      - id: one_open_agreement
        applies_to: [sponsor_contract]
        kind: dedup
        condition: A new agreement may be signed only when the sponsor has no agreement that is pending_implementation, active or termination_pending.
        evidence_fields: [sponsor_agreements.customer_id, sponsor_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sponsor_agreements.customer_id]
          action_bindings:
            sponsor_agreements.customer_id: customer_id
        dedup_contract:
          table: sponsor_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_implementation, active, termination_pending]}
          distinct_fields: [signed_date]
    params:
      max_per_customer: 1

  - id: sponsor_pricing
    subject: [sponsor_claims_invoice, sponsor_admin_invoice]
    rule: >-
      Under spread pricing claims are billed at the guaranteed rates (brand_retail_awp_discount, generic_retail_effective_rate, brand_mail_awp_discount, generic_mail_effective_rate, specialty_awp_discount) plus retail_dispensing_fee or mail_dispensing_fee, whatever the pharmacy was paid; under pass_through they are billed at exactly what the pharmacy was paid, with the same rates guaranteed in aggregate and any shortfall credited at the annual reconciliation; under cost_plus they are billed at acquisition cost times one plus cost_plus_markup plus the dispensing fee.
      Each claims invoice covers one invoice_cycle period, and the member cost share collected by the pharmacy is never billed to the sponsor.
      The administrative invoice for a month is admin_fee_pepm plus clinical_program_fee_pepm times the employee-months enrolled.
      Market checks of the pricing guarantees run every market_check_months months when that is not zero.
      A claims period or fee month is invoiced only once.
    eligibility:
      - id: invoice_period_once
        applies_to: [sponsor_claims_invoice, sponsor_admin_invoice]
        kind: dedup
        condition: A claims period or fee month is invoiced only once.
        evidence_fields: [sponsor_invoices.sponsor_agreement_id, sponsor_invoices.billing_period_start, sponsor_invoices.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sponsor_invoices.sponsor_agreement_id, sponsor_invoices.billing_period_start]
          action_bindings:
            sponsor_invoices.sponsor_agreement_id: sponsor_agreement_id
            sponsor_invoices.billing_period_start: billing_period_start
        dedup_contract:
          table: sponsor_invoices
          mode: separate_record
          object_bindings: {sponsor_agreement_id: sponsor_agreement_id, billing_period_start: billing_period_start}
          duplicate_filters: {event_type: [sponsor_claims_invoice, sponsor_admin_invoice]}
          distinct_fields: [event_type]
    params:
      per_tier:
        Northbridge Traditional Pricing: {admin: "=admin_fee_pepm", clinical: "=clinical_program_fee_pepm", model: "=pricing_model"}
        Northbridge Pass-Through Pricing: {admin: "=admin_fee_pepm", clinical: "=clinical_program_fee_pepm", model: "=pricing_model"}
        Northbridge Transparent Cost-Plus: {admin: "=admin_fee_pepm", clinical: "=clinical_program_fee_pepm", model: "=pricing_model"}
        Northbridge Rebate Guarantee Plus: {admin: "=admin_fee_pepm", clinical: "=clinical_program_fee_pepm", model: "=pricing_model"}
        Northbridge Enterprise Value: {admin: "=admin_fee_pepm", clinical: "=clinical_program_fee_pepm", model: "=pricing_model"}
        Northbridge Coalition Purchasing: {admin: "=admin_fee_pepm", clinical: "=clinical_program_fee_pepm", model: "=pricing_model"}
    formula:
      admin_invoice_amount: "(admin_fee_pepm + clinical_program_fee_pepm) * employee_months"

  - id: sponsor_evt_payment_terms
    subject: [sponsor_payment, sponsor_late_charge]
    rule: >-
      Each invoice is due payment_terms_days calendar days after its invoice date; payments are applied to the invoice they name.
      Late interest of late_payment_interest_monthly per month is charged on the unpaid amount of an invoice only once late_charge_grace_days calendar days have passed after its due date, the due date being day zero, and at most once per invoice per calendar month.
      A claims funding deposit of claims_funding_deposit_weeks weeks of average claims cost is held and is not applied to invoices until the agreement ends.
    eligibility:
      - id: grace_passed
        applies_to: [sponsor_late_charge]
        kind: time
        condition: Late interest of late_payment_interest_monthly per month is charged on the unpaid amount of an invoice only once late_charge_grace_days calendar days have passed after its due date, the due date being day zero, and at most once per invoice per calendar month.
        evidence_fields: [sponsor_invoices.due_date, sponsor_invoices.sponsor_invoice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sponsor_invoices.sponsor_invoice_id]
          action_bindings:
            sponsor_invoices.sponsor_invoice_id: source_invoice_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its due date
          anchor_source: sponsor_invoices.due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: the due date being day zero
          boundary: exclusive

  - id: sponsor_rebates
    subject: [sponsor_rebate_accrual, sponsor_rebate_payment, sponsor_rebate_offset]
    rule: >-
      Each quarter the sponsor accrues rebate_passthrough_share of the manufacturer rebates on its claims; where the agreement has rebate guarantees, the accrual is at least the guaranteed amounts times the quarter's brand retail, brand home delivery and specialty prescriptions.
      The rebate guarantees apply only while every member of the sponsor is on a formulary in rebate_guarantee_formularies and, when specialty_exclusive_required is true, on an exclusive specialty program; otherwise the quarter accrues the pass-through share only.
      Rebates are paid at rebate_payment_frequency: a quarter's accrual is paid within rebate_payment_lag_days after the quarter ends, and the annual guarantee true-up within rebate_true_up_days after the contract year ends.
      When rebate_offset_allowed is true and the sponsor elects it, an accrual is applied as a credit memo against a named open invoice instead of paid.
      Each accrual is settled once, by payment or by offset.
    eligibility:
      - id: settle_once
        applies_to: [sponsor_rebate_payment, sponsor_rebate_offset]
        kind: dedup
        condition: Each accrual is settled once, by payment or by offset.
        evidence_fields: [sponsor_rebates.source_rebate_id, sponsor_rebates.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sponsor_rebates.source_rebate_id]
          action_bindings:
            sponsor_rebates.source_rebate_id: source_rebate_id
        dedup_contract:
          table: sponsor_rebates
          mode: separate_record
          object_bindings: {source_rebate_id: source_rebate_id}
          duplicate_filters: {event_type: [sponsor_rebate_payment, sponsor_rebate_offset]}
          distinct_fields: []
    formula:
      guaranteed_accrual: "rebate_guarantee_brand_retail * brand_retail_rx + rebate_guarantee_brand_mail * brand_mail_rx + rebate_guarantee_specialty * specialty_rx"

  - id: sponsor_performance_guarantees
    subject: [sponsor_credit_memo]
    rule: >-
      Performance is measured over each contract year: average speed to answer against pg_call_answer_seconds, claims financial accuracy against pg_claims_accuracy, and home delivery turnaround against pg_mail_turnaround_days.
      Each missed guarantee earns the sponsor its penalty (pg_call_answer_penalty, pg_claims_accuracy_penalty, pg_mail_turnaround_penalty) as a credit memo within pg_credit_payment_days after the contract year ends; guarantees met earn nothing and penalties never exceed the listed amounts.
      Billing errors are credited when an invoice dispute is upheld, and the implementation credit of implementation_credit_per_employee per enrolled employee is credited on the first administrative invoice after go-live.
    eligibility: []

  - id: sponsor_eligibility
    subject: [sponsor_eligibility_load, sponsor_lives_update]
    rule: >-
      The sponsor sends eligibility files at eligibility_file_frequency; a file whose rejected records exceed eligibility_error_threshold of its records is held for the sponsor to correct and nothing in it is loaded, otherwise it loads within eligibility_load_business_days business days and the enrolled employee count is refreshed.
      Member enrollments, terminations and COBRA events come only from loaded files, and the sponsor answers for the accuracy of what it sends.
    eligibility: []
    formula:
      held: "records_rejected > records_received * eligibility_error_threshold"

  - id: sponsor_audit
    subject: [sponsor_audit_finding, sponsor_credit_memo]
    rule: >-
      The sponsor may start audit_rights_per_year claims audits per contract year (sponsor_msr_audits_this_year), with audit_notice_days written notice, covering at most audit_lookback_months months of claims ending on the notice date.
      An audit finding owed to the sponsor is credited as a billing_error credit memo.
      An audit request is accepted only when the sponsor has not used its audits for the contract year.
    eligibility:
      - id: audit_quota
        applies_to: [sponsor_audit_finding]
        kind: authorization
        condition: An audit request is accepted only when the sponsor has not used its audits for the contract year.
        evidence_fields: [sponsor_service_requests.sponsor_agreement_id, sponsor_service_requests.request_type, sponsor_service_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sponsor_service_requests.sponsor_agreement_id]
          action_bindings:
            sponsor_service_requests.sponsor_agreement_id: sponsor_agreement_id
    measures: [sponsor_msr_audits_this_year]

  - id: sponsor_termination
    subject: [sponsor_give_notice, sponsor_rescind_notice, sponsor_terminate, sponsor_cancel_implementation, sponsor_renew]
    rule: >-
      Termination is the sponsor's own decision: a termination notice is taken as a service request and becomes effective on the agreement only when the sponsor confirms it in writing.
      The termination date is no earlier than termination_notice_days calendar days after the notice is received; terminating without cause before the end of the initial_term_months initial term costs early_termination_fee_pepm per enrolled employee for each remaining month.
      The sponsor may rescind its notice before the termination date; the agreement otherwise renews automatically for renewal_term_months at each renewal date.
      A sponsor may cancel before go-live, which ends the agreement without an early termination fee.
      A notice takes effect on the agreement only after a termination_notice request has been taken from the sponsor.
    eligibility:
      - id: notice_request_first
        applies_to: [sponsor_give_notice]
        kind: authorization
        condition: A notice takes effect on the agreement only after a termination_notice request has been taken from the sponsor.
        evidence_fields: [sponsor_service_requests.sponsor_agreement_id, sponsor_service_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sponsor_service_requests.sponsor_agreement_id]
          action_bindings:
            sponsor_service_requests.sponsor_agreement_id: sponsor_agreement_id

  - id: sponsor_implementation
    subject: [sponsor_contract, sponsor_go_live]
    rule: >-
      Go-live is at least implementation_lead_days calendar days after signing; the funding arrangement and expected employees are recorded at signing and the sponsor's enrolled employees must meet the tier's entry threshold.
      Account management follows account_management and claims data goes to the sponsor's vendors at claims_data_feed_frequency.
    eligibility: []

  - id: sponsor_invoice_dispute
    subject: [sponsor_credit_memo]
    rule: >-
      The sponsor may dispute an invoice no later than invoice_dispute_window_days calendar days after the invoice date, the invoice date being day zero; a timely dispute is resolved within dispute_resolution_days and an upheld dispute is credited as a billing_error credit memo against that invoice.
      A late dispute is not accepted, and the disputed amount stays due while the dispute is open.
    eligibility:
      - id: dispute_in_window
        applies_to: [sponsor_credit_memo]
        kind: time
        condition: The sponsor may dispute an invoice no later than invoice_dispute_window_days calendar days after the invoice date, the invoice date being day zero; a timely dispute is resolved within dispute_resolution_days and an upheld dispute is credited as a billing_error credit memo against that invoice.
        evidence_fields: [sponsor_invoices.entry_date, sponsor_invoices.sponsor_invoice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sponsor_invoices.sponsor_invoice_id]
          action_bindings:
            sponsor_invoices.sponsor_invoice_id: source_invoice_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: sponsor_invoices.entry_date
          relation: not_after
          duration_source: variants.invoice_dispute_window_days
          unit: calendar_days
          counting_rule: the invoice date being day zero
          boundary: inclusive
