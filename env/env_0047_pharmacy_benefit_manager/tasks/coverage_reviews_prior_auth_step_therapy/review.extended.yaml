events:
- type: review_enroll
  target: review_programs
  mutation: create
  meaning: A review program is opened for a member when the plan enrollment is created.
  grain: one row per plan enrollment
  fields: {customer_id: covered member, plan_enrollment_id: plan enrollment it belongs to, variant_name: review package the sponsor elected, effective_date: plan coverage effective date}
  triggers: []
- type: review_activate
  target: review_programs
  mutation:
    transition: {from: pending_effective, to: active}
  meaning: The review package takes effect with the plan coverage.
  grain: one row per transaction
  fields: {effective_date: the effective date reached}
  triggers: []
- type: review_terminate
  target: review_programs
  mutation:
    transition:
    - {from: active, to: terminated}
    - {from: pending_effective, to: terminated}
  meaning: The review program ends because plan coverage ended or was cancelled.
  grain: one row per transaction
  fields: {end_date: last day of plan coverage}
  triggers: []
- type: review_reinstate
  target: review_programs
  mutation:
    transition: {from: terminated, to: active}
  meaning: The review program is restored by a COBRA reinstatement.
  grain: one row per transaction
  fields: {end_date: 'cleared, because coverage continues'}
  triggers: []
- type: review_reassign
  target: review_programs
  mutation: update
  meaning: The sponsor moves its members to a different review package, normally at plan year renewal.
  grain: one row per transaction
  fields: {variant_name: the new review package}
  triggers: []
- type: review_case_opened
  target: review_cases
  meaning: A coverage review request for one drug is received.
  grain: one row per review request for one drug and review type
  distinguish_by: [drug_name, review_type, event_at]
  fields: {drug_name: drug, drug_strength: strength, review_type: kind of review, is_renewal: whether it renews an approval, review_priority: standard or urgent, requested_by: who asked, prescriber_npi: prescriber, diagnosis_code: diagnosis given, criteria_basis: ground relied on, requested_quantity_per_30: quantity requested for a quantity limit exception, event_at: moment received}
  triggers: []
- type: review_case_info_requested
  target: review_cases
  meaning: The reviewer asks the prescriber for missing clinical information and the case pends.
  grain: one row per information request on one case
  distinguish_by: [source_case_id, event_at]
  fields: {source_case_id: the case, drug_name: drug of the case, review_type: type of the case, event_at: moment of the request}
  triggers: []
- type: review_case_info_received
  target: review_cases
  meaning: Requested clinical information is received from the prescriber.
  grain: one row per information receipt on one case
  distinguish_by: [source_case_id, event_at]
  fields: {source_case_id: the case, drug_name: drug of the case, review_type: type of the case, diagnosis_code: diagnosis documented, criteria_basis: ground the information supports, review_priority: priority after any urgency attestation, event_at: moment received}
  triggers: []
- type: review_case_approved
  target: review_cases
  meaning: A review case is approved.
  grain: one row per approval of one case
  distinguish_by: [source_case_id]
  fields: {source_case_id: the case, drug_name: drug of the case, review_type: type of the case, is_renewal: whether it renews an approval, requested_quantity_per_30: quantity approved for a quantity limit exception, decision_reason: criteria_met, event_at: moment of decision}
  triggers:
  - event: review:review_auth_granted
    when: {review_type: prior_authorization}
    map: {source_case_id: source_case_id, drug_name: drug_name, authorization_type: prior_authorization, auth_basis: clinical_review}
  - event: review:review_auth_granted
    when: {review_type: step_therapy_exception}
    map: {source_case_id: source_case_id, drug_name: drug_name, authorization_type: step_therapy, auth_basis: clinical_review}
  - event: review:review_auth_granted
    when: {review_type: quantity_limit_exception}
    map: {source_case_id: source_case_id, drug_name: drug_name, authorization_type: quantity_limit, auth_basis: clinical_review, approved_quantity_per_30: requested_quantity_per_30}
- type: review_case_denied
  target: review_cases
  meaning: A review case is denied.
  grain: one row per denial of one case
  distinguish_by: [source_case_id]
  fields: {source_case_id: the case, drug_name: drug of the case, review_type: type of the case, decision_reason: reason for the denial, event_at: moment of decision}
  triggers: []
- type: review_case_withdrawn
  target: review_cases
  meaning: The requester withdraws an undecided case.
  grain: one row per withdrawn case
  distinguish_by: [source_case_id]
  fields: {source_case_id: the case, drug_name: drug of the case, requested_by: who withdrew it, event_at: moment of withdrawal}
  triggers: []
- type: review_case_auto_approved
  target: review_cases
  meaning: A step edit is satisfied automatically from claims history when the target drug is billed, without a manual case.
  grain: one row per automated step approval for one drug
  distinguish_by: [drug_name, event_at]
  fields: {drug_name: target drug, review_type: step_therapy_exception, criteria_basis: step_drugs_tried, decision_reason: criteria_met, event_at: moment of the automated check}
  triggers:
  - event: review:review_auth_granted
    map: {source_case_id: review_case_id, drug_name: drug_name, authorization_type: step_therapy, auth_basis: automated_step}
- type: review_auth_granted
  target: review_authorizations
  meaning: An authorization is put in force for one drug for a defined period.
  grain: one row per authorization period granted
  distinguish_by: [drug_name, authorization_type, effective_date]
  fields: {source_case_id: case that produced it, drug_name: drug, authorization_type: edit satisfied, auth_basis: how it came about, approved_quantity_per_30: approved quantity for a quantity limit exception, effective_date: first day in force, expiration_date: last day in force}
  triggers: []
- type: review_auth_terminated
  target: review_authorizations
  meaning: An authorization in force is ended before its expiration date.
  grain: one row per authorization ended
  distinguish_by: [source_authorization_id]
  fields: {source_authorization_id: the authorization ended, drug_name: drug, authorization_type: edit it satisfied, expiration_date: new last day in force, termination_reason: why it ended}
  triggers: []
measures:
- {id: review_msr_step_trials, window: step_lookback_days calendar days ending on the date the step is evaluated (that date as day zero), measure: 'number of distinct prerequisite drugs of the target''s step protocol for which the member''s paid, unreversed retail claims, shipped home delivery orders and shipped specialty fills add up to at least step_trial_min_days_supply days supply'}
- {id: review_msr_target_recent_claim, window: step_grandfathering_days calendar days ending on the claim date (claim date as day zero), measure: 'whether at least one paid, unreversed claim (retail, home delivery or specialty) for the target drug itself exists'}
policies:
- id: review_agg_multi_holding
  subject: [review_enroll]
  rule: A member holds at most one review program that is not terminated, tied to their open plan enrollment. A new review program may be opened only when no review program of that member is pending_effective or active.
  eligibility:
  - id: one_open_program
    applies_to: [review_enroll]
    kind: dedup
    condition: A new review program may be opened only when no review program of that member is pending_effective or active.
    evidence_fields: [review_programs.customer_id, review_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_programs.customer_id]
      action_bindings: {review_programs.customer_id: customer_id}
    dedup_contract:
      table: review_programs
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [pending_effective, active]
      distinct_fields: [effective_date]
  params: {max_per_customer: 1}
- id: review_requirements
  subject: [review_case_opened, review_case_denied]
  rule: A drug needs a prior authorization when it is in the package's pa_required_drugs, a step therapy approval when it is a target in step_therapy_protocols, and a quantity limit exception only when a claim asks for more than its quantity_limits entry per rolling 30 days. A request for a drug and review type that the package does not require is denied with no_review_required and the member is told the drug needs no review; a request for a drug the formulary excludes is denied with not_a_covered_use, because review cannot cover an excluded drug. Diagnosis codes are required on reviews of drugs in diagnosis_required_drugs, and an off-label use is approvable only with compendia support when off_label_compendia_required is true. A review approval never changes the drug's formulary tier; a non-formulary drug still needs a formulary exception.
  eligibility: []
  params:
    per_tier:
      Northbridge Clinical Essentials: {pa: =pa_required_drugs, steps: =step_therapy_protocols, ql: =quantity_limits}
      Northbridge Clinical Standard: {pa: =pa_required_drugs, steps: =step_therapy_protocols, ql: =quantity_limits}
      Northbridge Clinical Advanced: {pa: =pa_required_drugs, steps: =step_therapy_protocols, ql: =quantity_limits}
      Northbridge Clinical Advanced Plus: {pa: =pa_required_drugs, steps: =step_therapy_protocols, ql: =quantity_limits}
      Northbridge Clinical Comprehensive: {pa: =pa_required_drugs, steps: =step_therapy_protocols, ql: =quantity_limits}
      Northbridge Clinical Comprehensive Specialty: {pa: =pa_required_drugs, steps: =step_therapy_protocols, ql: =quantity_limits}
- id: review_evt_case_intake
  subject: [review_case_opened, review_case_withdrawn]
  rule: 'A case is opened by the prescriber or, when member_initiated_review_allowed is true, by the member or an authorized representative, for one drug and one review type; the prescriber''s clinical information is required to decide it whoever opens it. A case is urgent only on the prescriber''s attestation while urgent_attestation_required is true; a member''s own statement of urgency does not make it urgent, and when urgent_downgrade_allowed is true a request filed as urgent without that attestation is handled as standard. A case may be opened only while the member''s review program is active. While one_open_case_per_drug_type is true, only one undecided case may exist for the same member, drug and review type: a new case may be opened only when no case for the same drug and review type is still undecided. An undecided case may be withdrawn by its requester or the member when withdrawal_allowed is true; a withdrawn case is never decided.'
  eligibility:
  - id: case_on_active_program
    applies_to: [review_case_opened]
    kind: state
    condition: A case may be opened only while the member's review program is active.
    evidence_fields: [review_programs.status, review_programs.review_program_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_programs.review_program_id]
      action_bindings: {review_programs.review_program_id: review_program_id}
    state_contract:
      field: review_programs.status
      allowed: [active]
  - id: one_undecided_case
    applies_to: [review_case_opened]
    kind: dedup
    condition: a new case may be opened only when no case for the same drug and review type is still undecided.
    evidence_fields: [review_cases.customer_id, review_cases.drug_name, review_cases.review_type, review_cases.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_cases.customer_id, review_cases.drug_name, review_cases.review_type]
      action_bindings: {review_cases.customer_id: customer_id, review_cases.drug_name: drug_name, review_cases.review_type: review_type}
    dedup_contract:
      table: review_cases
      mode: separate_record
      object_bindings: {customer_id: customer_id, drug_name: drug_name, review_type: review_type}
      duplicate_filters:
        event_type: [review_case_opened]
      distinct_fields: [event_at]
  - id: withdraw_undecided
    applies_to: [review_case_withdrawn]
    kind: dedup
    condition: An undecided case may be withdrawn by its requester or the member when withdrawal_allowed is true; a withdrawn case is never decided.
    evidence_fields: [review_cases.source_case_id, review_cases.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_cases.source_case_id]
      action_bindings: {review_cases.source_case_id: source_case_id}
    dedup_contract:
      table: review_cases
      mode: separate_record
      object_bindings: {source_case_id: source_case_id}
      duplicate_filters:
        event_type: [review_case_approved, review_case_denied, review_case_withdrawn]
      distinct_fields: []
- id: review_evt_decision
  subject: [review_case_info_requested, review_case_info_received, review_case_approved, review_case_denied]
  rule: 'A standard case is decided within standard_decision_hours and an urgent case within urgent_decision_hours of its receipt. When the clinical information needed to apply the criteria is missing, the reviewer makes info_request_attempts outreach attempts and the case pends; it is decided as soon as the information is received. A case with an information request outstanding may be denied for missing information only after info_request_wait_days calendar days have fully elapsed since the information request, counting the request date as day zero. A case is approved with criteria_met when the clinical information on file meets the package''s criteria for the drug and review type, and denied with criteria_not_met, step_not_satisfied or missing_clinical_information otherwise; a request for a drug that already has an approval of the same type in force is denied with already_approved unless it is a renewal inside the renewal window. While case_decision_once is true a case takes exactly one decision: a case may be decided only when it has no approval, denial or withdrawal yet. Approvals may be made by a reviewer at pharmacist_review_level or above; an urgent denial needs a physician reviewer when physician_review_for_denial_of_urgent is true.'
  eligibility:
  - id: wait_before_missing_info_denial
    applies_to: [review_case_denied]
    kind: time
    condition: A case with an information request outstanding may be denied for missing information only after info_request_wait_days calendar days have fully elapsed since the information request, counting the request date as day zero.
    evidence_fields: [review_cases.event_at, review_cases.source_case_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_cases.source_case_id]
      action_bindings: {review_cases.source_case_id: source_case_id}
    temporal_basis: {clock: frozen_time, anchor_event: the information request, anchor_source: review_cases.event_at, relation: not_before, duration_source: variants.info_request_wait_days, unit: calendar_days, counting_rule: counting the request date as day zero, boundary: exclusive}
  - id: decide_once
    applies_to: [review_case_approved, review_case_denied]
    kind: dedup
    condition: a case may be decided only when it has no approval, denial or withdrawal yet.
    evidence_fields: [review_cases.source_case_id, review_cases.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_cases.source_case_id]
      action_bindings: {review_cases.source_case_id: source_case_id}
    dedup_contract:
      table: review_cases
      mode: separate_record
      object_bindings: {source_case_id: source_case_id}
      duplicate_filters:
        event_type: [review_case_approved, review_case_denied, review_case_withdrawn]
      distinct_fields: []
- id: review_step_therapy
  subject: [review_case_auto_approved, review_case_approved, review_case_denied]
  rule: 'A step therapy target is covered once the member has tried the protocol''s prerequisites: at least trials_required different prerequisite drugs, each with at least step_trial_min_days_supply days supply in Northbridge Rx claims history within step_lookback_days before the date the step is evaluated (review_msr_step_trials), trials_required being the protocol entry''s own count. A member with a paid claim for the target drug itself within step_grandfathering_days before the claim date (review_msr_target_recent_claim) is exempt from the step. When automated_step_check is true and the history satisfies the step (or the member is grandfathered), the approval is recorded automatically when the drug is billed, as an auto-approved case event when auto_approval_creates_case_record is true; otherwise a step therapy exception case is needed. A step therapy exception case is approved with criteria_met when the trials are found in claims history, when the prescriber documents trials outside Northbridge Rx history (another carrier''s claims or samples) with dates and days supply, or when every prerequisite is contraindicated; otherwise it is denied with step_not_satisfied. An automated step approval may be recorded only when the claims history satisfies the step or the member is grandfathered.'
  eligibility:
  - id: history_satisfies_step
    applies_to: [review_case_auto_approved]
    kind: authorization
    condition: An automated step approval may be recorded only when the claims history satisfies the step or the member is grandfathered.
    evidence_fields: [retail_claims.customer_id, retail_claims.drug_name, retail_claims.date_of_service, retail_claims.days_supply, review_cases.drug_name]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [retail_claims.customer_id, review_cases.drug_name]
      action_bindings: {retail_claims.customer_id: customer_id, review_cases.drug_name: drug_name}
  measures: [review_msr_step_trials, review_msr_target_recent_claim]
  params: {trials_required: =step_therapy_protocols}
  formula: {step_satisfied: review_msr_step_trials >= trials_required}
- id: review_quantity_limit
  subject: [review_case_approved, review_case_denied]
  rule: A quantity limit exception is approved with criteria_met when the prescriber documents medical necessity for a quantity above the drug's quantity_limits entry, up to ql_exception_max_multiple times that limit per rolling 30 days; a request above that multiple is approved only up to it, and the approved quantity is recorded on the authorization. The drug_quantity_limit is the drug's entry in quantity_limits; opioid claims above the network's daily MME limit are reviewed as quantity limit exceptions when opioid_mme_review is true. Quantity is counted per ql_basis.
  eligibility: []
  params: {drug_quantity_limit: =quantity_limits}
  formula: {approved_quantity_per_30: 'min(requested_quantity_per_30, drug_quantity_limit * ql_exception_max_multiple)'}
- id: review_authorization_period
  subject: [review_auth_granted]
  rule: A new prior authorization runs pa_approval_months from its effective date, or the months initial_approval_month_overrides gives for the drug; a renewal runs renewal_approval_months; a step approval runs step_approval_months; a quantity limit exception runs ql_approval_months. The expiration date is the day before the same day-of-month that many months later, falling back to the last day of the month when that day does not exist. The effective date is the decision date, except that it may be set back up to retro_effective_days calendar days before the decision date to cover a fill the member already paid for, and a renewal approved before the current approval expires takes effect per renewal_effective_basis, the day after the current expiration date. An approval covers only the strength requested unless approval_covers_strength_changes is true. A renewal case may be opened from renewal_window_days before the current expiration date; when renewal_requires_new_clinicals is true it needs documented response to therapy, and a weight-management GLP-1 renewal needs documented loss of at least glp1_weight_renewal_min_loss of baseline weight. When auto_renewal_chronic is true, approvals for drugs in auto_renewal_drugs with continuous paid claims renew automatically with auth_basis auto_renewal. At most maximum_open_auths_per_drug approval of the same type is in force for a drug at any time, so a renewal granted early takes effect only the day after the current one expires.
  eligibility: []
- id: review_continuity_of_care
  subject: [review_auth_granted]
  rule: A new member who had an approval for a drug at their prior pharmacy carrier keeps coverage for it without a new review for continuity_approval_days from the review program effective date, provided the prior carrier's approval letter is on file and, when continuity_requires_prior_claims is true, prior-carrier claims history for the drug is too. A continuity-of-care approval may be granted only within continuity_of_care_days calendar days of the review program effective date, counting that date as day 1. The member must obtain a regular approval before the continuity approval ends.
  eligibility:
  - id: continuity_window
    applies_to: [review_auth_granted]
    kind: time
    condition: A continuity-of-care approval may be granted only within continuity_of_care_days calendar days of the review program effective date, counting that date as day 1.
    evidence_fields: [review_programs.effective_date, review_programs.review_program_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_programs.review_program_id]
      action_bindings: {review_programs.review_program_id: review_program_id}
    temporal_basis: {clock: frozen_time, anchor_event: the review program effective date, anchor_source: review_programs.effective_date, relation: not_after, duration_source: variants.continuity_of_care_days, unit: calendar_days, counting_rule: counting that date as day 1, boundary: inclusive}
- id: review_evt_auth_termination
  subject: [review_auth_terminated]
  rule: An authorization ends early only when plan coverage ends (coverage_ended, while auth_ends_with_coverage is true), when a renewal replaces it (replaced_by_renewal), or when the prescriber asks to end it because therapy stopped (prescriber_request); a member's request alone never ends it. An authorization may be ended only once, by naming the granted authorization it ends. On a COBRA reinstatement approvals ended for coverage_ended resume through their original expiration date; when the sponsor changes review package, approvals in force carry over while auth_carryover_on_package_change is true.
  eligibility:
  - id: terminate_once
    applies_to: [review_auth_terminated]
    kind: dedup
    condition: An authorization may be ended only once, by naming the granted authorization it ends.
    evidence_fields: [review_authorizations.source_authorization_id, review_authorizations.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [review_authorizations.source_authorization_id]
      action_bindings: {review_authorizations.source_authorization_id: source_authorization_id}
    dedup_contract:
      table: review_authorizations
      mode: separate_record
      object_bindings: {source_authorization_id: source_authorization_id}
      duplicate_filters:
        event_type: [review_auth_terminated]
      distinct_fields: []
- id: review_specialty_guideline
  subject: [review_case_approved, review_case_denied]
  rule: When specialty_guideline_management is true, a renewal of a specialty drug is approved only with documented response to therapy (criteria_basis documented_response) and a dose within the labeled range; otherwise it is denied with criteria_not_met and the member's specialty enrollment goes on hold when the current approval expires. When it is false, specialty renewals follow the general renewal rule.
  eligibility: []
- id: review_lifecycle
  subject: [review_enroll, review_activate, review_terminate, review_reinstate, review_reassign]
  rule: 'The review program follows the plan enrollment: it opens with it, takes effect on its effective date, ends with it and is restored by a COBRA reinstatement; member services never opens or ends it on request. A sponsor''s change of package takes effect at plan year renewal, and the new package''s requirements apply to claims from that date, subject to approvals carried over. Electronic requests are accepted when epa_supported is true, urgent reviews are taken around the clock when urgent_intake_24x7 is true, criteria follow clinical_criteria_source, and when denial_notice_includes_alternatives is true a denial lists the formulary alternatives that need no review.'
  eligibility: []
extended_policies:
- id: review_ext_member_request_quantity
  base_policy_refs: [review_requirements, review_evt_case_intake, review_quantity_limit]
  overwrite: []
  trigger: on_request
  subject: [review_case_opened]
  computes: requested_quantity_per_30
  target_tool: file_coverage_review_request_fd0cbfbe
  params: {long_supply_days: 34, steady_shipments: 3, switch_window_days: 90, fresh_fill_days: 7, major_increase_ratio: 1.5, titration_major_units: 2, titration_minor_units: 1, limit_sumatriptan: 9, limit_nurtec: 8, limit_ubrelvy: 16, cap_share_case_only: 0.875, cap_share_default: 0.75}
  rule: 'This rule sets the quantity a member-filed first-time quantity limit exception request asks for on the acute migraine drugs that carry a quantity limit (sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days); a renewal request, a prior authorization request and a step therapy exception request carry no requested quantity under it. The drug is the drug of the member''s most recent quantity limit exception case event. Windows of months in this rule end on the filing date: a record dated within the last N months is dated after the same day of the month N months before the filing date. The member-filed request asks for the quantity per rolling 30 days that the member''s newest prescription for the drug on file at Northbridge Rx Home Delivery directs: its quantity per fill multiplied by 30 and divided by its days supply per fill, rounded to three decimal places only at the end. When the member holds no prescription for the drug at home delivery, the quantity and days supply of the member''s most recent paid retail fill of the drug stand in for the prescription''s. The request never asks for more than the member-request ceiling, which is the drug''s limit times three quarters of the package''s maximum exception multiple. The days that divide the prescription''s quantity follow the refill cycle the member is on: a member enrolled in automatic home delivery refills whose prescription is written for more than a 34-day supply has the prescription''s days supply less the home delivery program''s automatic refill lead days as the divisor, because an automatic refill is placed when that many days of supply remain; a member not enrolled in automatic refills who had at least 3 home delivery shipments of the drug in the last six months has the prescription''s days supply times the home delivery program''s refill eligibility fraction as the divisor, because such a member refills as soon as a refill becomes eligible; every other member has the prescription''s days supply as the divisor. A member who opened the home delivery account within the last 90 days is moving from retail, and the retail fill still running is added to the request so that the first home delivery fill does not reject inside the same rolling 30 days: when the most recent paid retail fill of the drug was dispensed at least 7 days before the filing date and its days supply has not yet run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply; when that fill was dispensed fewer than 7 days before the filing date, its whole quantity is added; when the account was opened earlier than 90 days before, or the retail fill''s days supply has already run out, nothing is added. A transition allowance covers a direction change: when the newest home delivery prescription was written after the most recent paid retail fill and directs at least 1.5 times the quantity per 30 days that fill supplied, 2 units are added; when it was written after that fill and directs more than that fill supplied but less than 1.5 times as much, 1 unit is added; otherwise nothing is added. The member-request ceiling uses the whole of the package''s maximum exception multiple in place of three quarters of it when the member held a quantity limit authorization for the drug that took effect within the last 24 months, and uses seven eighths of it when the member had no such authorization but had a quantity limit exception case for the drug opened within the last 24 months; a member with neither keeps three quarters of it. The quantity asked for is the prescription''s quantity per 30 days on the divisor that applies, plus the retail fill added for a move from retail, plus the transition allowance, rounded to three decimal places and then compared with the member-request ceiling, the smaller of the two being recorded.'
  baseline:
    rule: 'The member-filed request asks for the quantity per rolling 30 days that the member''s newest prescription for the drug on file at Northbridge Rx Home Delivery directs: its quantity per fill multiplied by 30 and divided by its days supply per fill, rounded to three decimal places only at the end. When the member holds no prescription for the drug at home delivery, the quantity and days supply of the member''s most recent paid retail fill of the drug stand in for the prescription''s. The request never asks for more than the member-request ceiling, which is the drug''s limit times three quarters of the package''s maximum exception multiple.'
    params: [cap_share_default, ql_exception_max_multiple, limit_sumatriptan, limit_nurtec, limit_ubrelvy]
  prerequisite: []
  cross_category:
  - category: mail
    as: history
    reads: [mail_accounts.opened_date, mail_accounts.auto_refill_enrolled, mail_prescriptions.written_date, mail_prescriptions.quantity_per_fill, mail_prescriptions.days_supply_per_fill, mail_orders.order_date]
    note: The refill-cycle factor reads the home delivery account's automatic refill enrollment, its program's lead days and eligibility fraction and the shipment count; the move-from-retail factor reads the account's opened date.
  - category: retail
    as: history
    reads: [retail_claims.date_of_service, retail_claims.quantity, retail_claims.days_supply]
    note: The move-from-retail and transition factors read the most recent paid retail fill of the drug.
  compute:
  - {drug: 'LATEST(''review_cases'', ''drug_name'', date_field=''event_at'', review_type=''quantity_limit_exception'')'}
  - {limit: K('limit_sumatriptan') if drug == 'sumatriptan' else (K('limit_nurtec') if drug == 'Nurtec ODT' else K('limit_ubrelvy'))}
  - {rx_written: 'XLATEST(''mail'', ''mail_prescriptions'', ''written_date'', date_field=''written_date'', drug_name=drug)'}
  - {last_fill_date: 'XLATEST(''retail'', ''retail_claims'', ''date_of_service'', date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {last_fill_qty: 'XLATEST(''retail'', ''retail_claims'', ''quantity'', date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {last_fill_days: 'XLATEST(''retail'', ''retail_claims'', ''days_supply'', date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {basis_qty: 'XLATEST(''mail'', ''mail_prescriptions'', ''quantity_per_fill'', date_field=''written_date'', drug_name=drug) if rx_written != None else last_fill_qty'}
  - {basis_days: 'XLATEST(''mail'', ''mail_prescriptions'', ''days_supply_per_fill'', date_field=''written_date'', drug_name=drug) if rx_written != None else last_fill_days'}
  - {auto_refill: 'CFIELD(''mail'', ''auto_refill_enrolled'')'}
  - {lead_days: 'CPARAM(''mail'', ''auto_refill_lead_days'')'}
  - {eligibility_fraction: 'CPARAM(''mail'', ''refill_eligibility_fraction'')'}
  - {shipments_6m: 'XCOUNT(''mail'', ''mail_orders'', within_months=6, date_field=''order_date'', drug_name=drug, event_type=''mail_order_shipped'')'}
  - {cycle_days: basis_days - lead_days if (auto_refill == True and basis_days > K('long_supply_days')) else (basis_days * eligibility_fraction if (auto_refill != True and shipments_6m >= K('steady_shipments')) else basis_days)}
  - {mail_opened: 'CFIELD(''mail'', ''opened_date'')'}
  - {switching: 'mail_opened != None and DAYS(mail_opened, NOW) <= K(''switch_window_days'')'}
  - {fill_age: 'DAYS(last_fill_date, NOW)'}
  - {retail_carryover: last_fill_qty * (last_fill_days - fill_age) / last_fill_days if (switching and fill_age >= K('fresh_fill_days') and fill_age < last_fill_days) else (last_fill_qty if (switching and fill_age < K('fresh_fill_days')) else 0)}
  - {direction_30: basis_qty * 30 / basis_days}
  - {fill_30: last_fill_qty * 30 / last_fill_days}
  - {rx_after_fill: 'rx_written != None and DAYS(last_fill_date, rx_written) > 0'}
  - {transition_units: K('titration_major_units') if (rx_after_fill and direction_30 >= fill_30 * K('major_increase_ratio')) else (K('titration_minor_units') if (rx_after_fill and direction_30 > fill_30 and direction_30 < fill_30 * K('major_increase_ratio')) else 0)}
  - {prior_authorizations: 'COUNT(''review_authorizations'', within_months=24, date_field=''effective_date'', event_type=''review_auth_granted'', drug_name=drug, authorization_type=''quantity_limit'')'}
  - {prior_cases: 'COUNT(''review_cases'', within_months=24, date_field=''event_at'', event_type=''review_case_opened'', drug_name=drug, review_type=''quantity_limit_exception'')'}
  - {ceiling_multiple: P('ql_exception_max_multiple') if prior_authorizations >= 1 else (P('ql_exception_max_multiple') * K('cap_share_case_only') if prior_cases >= 1 else P('ql_exception_max_multiple') * K('cap_share_default'))}
  - {asked: 'RND(basis_qty * 30 / cycle_days + retail_carryover + transition_units, 3)'}
  - {result: 'MN(asked, RND(limit * ceiling_multiple, 3))'}
  compute_basis: {drug: The drug is the drug of the member's most recent quantity limit exception case event., limit: 'sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days', rx_written: The member-filed request asks for the quantity per rolling 30 days that the member's newest prescription for the drug on file at Northbridge Rx Home Delivery directs, last_fill_date: 'When the member holds no prescription for the drug at home delivery, the quantity and days supply of the member''s most recent paid retail fill of the drug stand in for the prescription''s.', last_fill_qty: 'When the member holds no prescription for the drug at home delivery, the quantity and days supply of the member''s most recent paid retail fill of the drug stand in for the prescription''s.', last_fill_days: 'When the member holds no prescription for the drug at home delivery, the quantity and days supply of the member''s most recent paid retail fill of the drug stand in for the prescription''s.', basis_qty: its quantity per fill multiplied by 30 and divided by its days supply per fill, basis_days: its quantity per fill multiplied by 30 and divided by its days supply per fill, auto_refill: a member enrolled in automatic home delivery refills whose prescription is written for more than a 34-day supply has the prescription's days supply less the home delivery program's automatic refill lead days as the divisor, lead_days: 'the prescription''s days supply less the home delivery program''s automatic refill lead days as the divisor, because an automatic refill is placed when that many days of supply remain', eligibility_fraction: 'has the prescription''s days supply times the home delivery program''s refill eligibility fraction as the divisor, because such a member refills as soon as a refill becomes eligible', shipments_6m: a member not enrolled in automatic refills who had at least 3 home delivery shipments of the drug in the last six months, cycle_days: 'The days that divide the prescription''s quantity follow the refill cycle the member is on: a member enrolled in automatic home delivery refills whose prescription is written for more than a 34-day supply has the prescription''s days supply less the home delivery program''s automatic refill lead days as the divisor, because an automatic refill is placed when that many days of supply remain; a member not enrolled in automatic refills who had at least 3 home delivery shipments of the drug in the last six months has the prescription''s days supply times the home delivery program''s refill eligibility fraction as the divisor, because such a member refills as soon as a refill becomes eligible; every other member has the prescription''s days supply as the divisor.', mail_opened: A member who opened the home delivery account within the last 90 days is moving from retail, switching: A member who opened the home delivery account within the last 90 days is moving from retail, fill_age: when the most recent paid retail fill of the drug was dispensed at least 7 days before the filing date and its days supply has not yet run out, retail_carryover: 'when the most recent paid retail fill of the drug was dispensed at least 7 days before the filing date and its days supply has not yet run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply; when that fill was dispensed fewer than 7 days before the filing date, its whole quantity is added; when the account was opened earlier than 90 days before, or the retail fill''s days supply has already run out, nothing is added.', rx_after_fill: when the newest home delivery prescription was written after the most recent paid retail fill, transition_units: 'A transition allowance covers a direction change: when the newest home delivery prescription was written after the most recent paid retail fill and directs at least 1.5 times the quantity per 30 days that fill supplied, 2 units are added; when it was written after that fill and directs more than that fill supplied but less than 1.5 times as much, 1 unit is added; otherwise nothing is added.', prior_authorizations: when the member held a quantity limit authorization for the drug that took effect within the last 24 months, prior_cases: when the member had no such authorization but had a quantity limit exception case for the drug opened within the last 24 months, ceiling_multiple: 'The member-request ceiling uses the whole of the package''s maximum exception multiple in place of three quarters of it when the member held a quantity limit authorization for the drug that took effect within the last 24 months, and uses seven eighths of it when the member had no such authorization but had a quantity limit exception case for the drug opened within the last 24 months; a member with neither keeps three quarters of it.', asked: 'The quantity asked for is the prescription''s quantity per 30 days on the divisor that applies, plus the retail fill added for a move from retail, plus the transition allowance, rounded to three decimal places', result: 'and then compared with the member-request ceiling, the smaller of the two being recorded.'}
  factors:
  - id: refill_cycle_divisor
    effect: method
    decides: cycle_days
    bindings: [auto_refill, lead_days, eligibility_fraction, shipments_6m, cycle_days]
    ladder:
    - {when: the member is enrolled in automatic home delivery refills and the prescription is written for more than a 34-day supply, method: the divisor is the prescription's days supply less the home delivery program's automatic refill lead days}
    - {when: the member is not enrolled in automatic refills and had at least 3 home delivery shipments of the drug in the last six months, method: the divisor is the prescription's days supply times the home delivery program's refill eligibility fraction}
    - {when: otherwise, method: the divisor is the prescription's days supply}
    baseline: {cycle_days: basis_days}
    evidence: [cross_category, history]
    cross_difficulty: mail
  - id: retail_carryover_on_move
    effect: method
    decides: retail_carryover
    bindings: [mail_opened, switching, fill_age, retail_carryover]
    ladder:
    - {when: the home delivery account was opened within the last 90 days and the most recent paid retail fill was dispensed at least 7 days before the filing date with days supply still remaining, method: 'the unused part of that fill is added: its quantity times the days of supply remaining divided by its days supply'}
    - {when: the home delivery account was opened within the last 90 days and the most recent paid retail fill was dispensed fewer than 7 days before the filing date, method: the whole quantity of that fill is added}
    - {when: otherwise, method: nothing is added}
    baseline: {retail_carryover: '0'}
    evidence: [cross_category, date, history]
    cross_difficulty: mail
  - id: direction_change_allowance
    effect: parameter
    decides: transition_units
    bindings: [rx_after_fill, transition_units]
    ladder:
    - {when: the newest home delivery prescription was written after the most recent paid retail fill and directs at least 1.5 times that fill's quantity per 30 days, value: K('titration_major_units')}
    - {when: the newest home delivery prescription was written after the most recent paid retail fill and directs more than that fill's quantity per 30 days but less than 1.5 times it, value: K('titration_minor_units')}
    - {when: otherwise, value: '0'}
    baseline: {transition_units: '0'}
    evidence: [cross_category, date]
    cross_difficulty: null
  - id: member_request_ceiling_multiple
    effect: parameter
    decides: ceiling_multiple
    bindings: [prior_authorizations, prior_cases, ceiling_multiple]
    ladder:
    - {when: a quantity limit authorization for the drug took effect within the last 24 months, value: P('ql_exception_max_multiple')}
    - {when: 'no such authorization, but a quantity limit exception case for the drug was opened within the last 24 months', value: P('ql_exception_max_multiple') * K('cap_share_case_only')}
    - {when: otherwise, value: P('ql_exception_max_multiple') * K('cap_share_default')}
    baseline: {ceiling_multiple: P('ql_exception_max_multiple') * K('cap_share_default')}
    evidence: [history]
    cross_difficulty: null
  inputs:
    history:
    - table: review_authorizations
      aggregate: count
      field: review_authorization_id
      within_months: 24
      filters: {event_type: review_auth_granted, authorization_type: quantity_limit}
    - table: review_cases
      aggregate: count
      field: review_case_id
      within_months: 24
      filters: {event_type: review_case_opened, review_type: quantity_limit_exception}
    - category: mail
      table: mail_orders
      aggregate: count
      field: mail_order_id
      within_months: 6
      filters: {event_type: mail_order_shipped}
    - category: retail
      table: retail_claims
      aggregate: latest
      field: quantity
      filters: {event_type: retail_claim_paid}
    cross_category: [mail, retail]
- id: review_ext_exception_approved_quantity
  base_policy_refs: [review_evt_decision, review_step_therapy, review_quantity_limit, review_specialty_guideline, review_authorization_period]
  overwrite:
  - {base_policy: review_quantity_limit, superseded_clause: up to ql_exception_max_multiple times that limit per rolling 30 days; a request above that multiple is approved only up to it, replaced_by: The approved quantity of a first-time quantity limit exception on an acute migraine drug is the smaller of the quantity the undecided request asks for and the approval ceiling.}
  trigger: on_request
  subject: [review_case_approved]
  computes: approved_quantity_per_30
  target_tool: approve_quantity_exception_611b3a5d
  params: {overuse_days_high: 30, overuse_scale_moderate: 0.9, preventive_units_established: 2, preventive_units_starting: 1, preventive_fills_established: 3, lapsed_recent_units: 2, lapsed_older_units: 1, cash_claims_repeat: 2, cash_units_repeat: 2, cash_units_single: 1, limit_sumatriptan: 9, limit_nurtec: 8, limit_ubrelvy: 16, partial_share: 0.875, default_share: 0.75}
  rule: 'This rule decides the approved quantity per rolling 30 days when a first-time quantity limit exception request on an acute migraine drug (sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days) is approved on the prescriber''s clinical information on file; the authorization it puts in force takes effect on the decision date and runs the package''s quantity limit approval months under the general approval-period rule. The approved quantity of a first-time quantity limit exception is not fixed until the records carry an undecided first-time quantity limit exception request for the drug. The drug is the drug of the member''s most recent quantity limit exception case event, and the request is undecided while no approval, denial or withdrawal for the drug is recorded after its opening. The approved quantity of a first-time quantity limit exception on an acute migraine drug is the smaller of the quantity the undecided request asks for and the approval ceiling. The approval ceiling is the drug''s limit times three quarters of the package''s maximum exception multiple, rounded down to a whole unit. Windows of months in this rule end on the decision date: a record dated within the last N months is dated after the same day of the month N months before the decision date. The multiple applied to the limit rests on the diagnosis on the prescriber''s most recent clinical information for the drug and on the member''s paid retail fills of the drug: a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719) together with paid retail fills reaching the full limit in each of the last three months (the fills dated within the last month, those dated within the last two months but not the last month, and those dated within the last three months but not the last two) takes the package''s maximum exception multiple; a chronic migraine diagnosis without fills reaching the limit in each of those months, or fills reaching the limit in each of those months under another diagnosis, takes seven eighths of it; any other member takes three quarters of it. Concurrent opioid use changes how the ceiling is worked out from the limit times the multiple: when the member''s paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, one unit for each average monthly opioid day (those days supply divided by 3) is subtracted from it, a day of opioid treatment displacing one acute migraine dose; when they add up to between 1 and 29 days supply, it is multiplied by 0.9; when there is no such fill, it is used as it stands. A member on migraine prevention receives a preventive allowance added to the ceiling: a Nurtec ODT quantity limit authorization that took effect within the last 12 months together with at least 3 paid retail fills of Nurtec ODT dated within the last three months adds 2 units; such an authorization with fewer than 3 such fills, or at least one such fill without such an authorization, adds 1 unit; neither adds nothing. A lapsed approval shows need already established: a quantity limit authorization for the drug whose last day in force fell within the last 6 months adds 2 units; one whose last day fell within the last 12 months but not the last 6 adds 1 unit; no quantity limit authorization for the drug ending within the last 12 months adds nothing. Cash purchases show need beyond the limit: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 6 months, add 2 units; exactly 1 such denial adds 1 unit; none adds nothing. The ceiling is the limit times the multiple as worked out for opioid use, plus the preventive allowance, plus the lapsed-approval units, plus the cash-purchase units, rounded down to a whole unit only at the end.'
  baseline:
    rule: The approved quantity of a first-time quantity limit exception on an acute migraine drug is the smaller of the quantity the undecided request asks for and the approval ceiling. The approval ceiling is the drug's limit times three quarters of the package's maximum exception multiple, rounded down to a whole unit.
    params: [default_share, ql_exception_max_multiple, limit_sumatriptan, limit_nurtec, limit_ubrelvy]
  prerequisite:
  - {problem: review_ext_member_request_quantity, kind: value_input, gate: requested_qty, form: state, policy_source: The approved quantity of a first-time quantity limit exception is not fixed until the records carry an undecided first-time quantity limit exception request for the drug., condition: 'review_cases holds a review_case_opened row for the drug with review_type quantity_limit_exception and is_renewal false that has no approval, denial or withdrawal row after it.', resolved_by: file_coverage_review_request_fd0cbfbe, effect: The requested_qty binding reads the quantity the undecided first-time request asks for; with no undecided request it is 0 and nothing can be approved.}
  cross_category:
  - category: retail
    as: history
    reads: [retail_claims.quantity, retail_claims.days_supply, retail_claims.date_of_service, retail_reimbursements.decision_reason, retail_reimbursements.received_date]
    note: The multiple factor reads monthly paid retail fills of the drug; the opioid factor reads oxycodone-acetaminophen days supply; the preventive factor reads Nurtec ODT fills; the cash-purchase factor reads paper claims denied for a required coverage review.
  compute:
  - {drug: 'LATEST(''review_cases'', ''drug_name'', date_field=''event_at'', review_type=''quantity_limit_exception'')'}
  - {limit: K('limit_sumatriptan') if drug == 'sumatriptan' else (K('limit_nurtec') if drug == 'Nurtec ODT' else K('limit_ubrelvy'))}
  - {opened_at: 'LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_opened'', drug_name=drug, review_type=''quantity_limit_exception'', is_renewal=False)'}
  - {decided_at: 'max(LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_approved'', drug_name=drug) or '''', LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_denied'', drug_name=drug) or '''', LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_withdrawn'', drug_name=drug) or '''')'}
  - {requested_qty: 'LATEST(''review_cases'', ''requested_quantity_per_30'', date_field=''event_at'', event_type=''review_case_opened'', drug_name=drug, review_type=''quantity_limit_exception'', is_renewal=False) if (opened_at != None and opened_at > decided_at) else 0'}
  - {diagnosis: 'LATEST(''review_cases'', ''diagnosis_code'', date_field=''event_at'', event_type=''review_case_info_received'', drug_name=drug)'}
  - {chronic: diagnosis == 'G43.701' or diagnosis == 'G43.709' or diagnosis == 'G43.711' or diagnosis == 'G43.719'}
  - {fills_1m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=1, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {fills_2m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=2, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {fills_3m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=3, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {full_months: fills_1m >= limit and fills_2m - fills_1m >= limit and fills_3m - fills_2m >= limit}
  - {multiple: P('ql_exception_max_multiple') if (chronic and full_months) else (P('ql_exception_max_multiple') * K('partial_share') if ((chronic and not full_months) or (full_months and not chronic)) else P('ql_exception_max_multiple') * K('default_share'))}
  - {opioid_days: 'XSUM(''retail'', ''retail_claims'', ''days_supply'', within_months=3, date_field=''date_of_service'', drug_name=''oxycodone-acetaminophen'', event_type=''retail_claim_paid'')'}
  - {limit_times_multiple: limit * multiple}
  - {opioid_adjusted: limit_times_multiple - opioid_days / 3 if opioid_days >= K('overuse_days_high') else (limit_times_multiple * K('overuse_scale_moderate') if opioid_days > 0 else limit_times_multiple)}
  - {preventive_authorizations: 'COUNT(''review_authorizations'', within_months=12, date_field=''effective_date'', event_type=''review_auth_granted'', drug_name=''Nurtec ODT'', authorization_type=''quantity_limit'')'}
  - {preventive_fills: 'XCOUNT(''retail'', ''retail_claims'', within_months=3, date_field=''date_of_service'', drug_name=''Nurtec ODT'', event_type=''retail_claim_paid'')'}
  - {preventive_units: K('preventive_units_established') if (preventive_authorizations >= 1 and preventive_fills >= K('preventive_fills_established')) else (K('preventive_units_starting') if ((preventive_authorizations >= 1 and preventive_fills < K('preventive_fills_established')) or (preventive_authorizations == 0 and preventive_fills >= 1)) else 0)}
  - {lapsed_6m: 'COUNT(''review_authorizations'', within_months=6, date_field=''expiration_date'', event_type=''review_auth_granted'', drug_name=drug, authorization_type=''quantity_limit'')'}
  - {lapsed_12m: 'COUNT(''review_authorizations'', within_months=12, date_field=''expiration_date'', event_type=''review_auth_granted'', drug_name=drug, authorization_type=''quantity_limit'')'}
  - {lapsed_units: K('lapsed_recent_units') if lapsed_6m >= 1 else (K('lapsed_older_units') if lapsed_12m >= 1 else 0)}
  - {cash_denials: 'XCOUNT(''retail'', ''retail_reimbursements'', within_months=6, date_field=''received_date'', drug_name=drug, event_type=''retail_dmr_denied'', decision_reason=''coverage_review_required'')'}
  - {cash_units: K('cash_units_repeat') if cash_denials >= K('cash_claims_repeat') else (K('cash_units_single') if cash_denials == 1 else 0)}
  - {ceiling: int(opioid_adjusted + preventive_units + lapsed_units + cash_units)}
  - {result: 'MN(requested_qty, ceiling)'}
  compute_basis: {drug: The drug is the drug of the member's most recent quantity limit exception case event, limit: 'sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days', opened_at: 'the request is undecided while no approval, denial or withdrawal for the drug is recorded after its opening.', decided_at: 'the request is undecided while no approval, denial or withdrawal for the drug is recorded after its opening.', requested_qty: The approved quantity of a first-time quantity limit exception is not fixed until the records carry an undecided first-time quantity limit exception request for the drug., diagnosis: The multiple applied to the limit rests on the diagnosis on the prescriber's most recent clinical information for the drug and on the member's paid retail fills of the drug, chronic: 'a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719)', fills_1m: 'the fills dated within the last month, those dated within the last two months but not the last month, and those dated within the last three months but not the last two', fills_2m: 'the fills dated within the last month, those dated within the last two months but not the last month, and those dated within the last three months but not the last two', fills_3m: 'the fills dated within the last month, those dated within the last two months but not the last month, and those dated within the last three months but not the last two', full_months: paid retail fills reaching the full limit in each of the last three months, multiple: 'a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719) together with paid retail fills reaching the full limit in each of the last three months (the fills dated within the last month, those dated within the last two months but not the last month, and those dated within the last three months but not the last two) takes the package''s maximum exception multiple; a chronic migraine diagnosis without fills reaching the limit in each of those months, or fills reaching the limit in each of those months under another diagnosis, takes seven eighths of it; any other member takes three quarters of it.', opioid_days: when the member's paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, limit_times_multiple: The ceiling is the limit times the multiple as worked out for opioid use, opioid_adjusted: 'Concurrent opioid use changes how the ceiling is worked out from the limit times the multiple: when the member''s paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, one unit for each average monthly opioid day (those days supply divided by 3) is subtracted from it, a day of opioid treatment displacing one acute migraine dose; when they add up to between 1 and 29 days supply, it is multiplied by 0.9; when there is no such fill, it is used as it stands.', preventive_authorizations: a Nurtec ODT quantity limit authorization that took effect within the last 12 months, preventive_fills: at least 3 paid retail fills of Nurtec ODT dated within the last three months, preventive_units: 'A member on migraine prevention receives a preventive allowance added to the ceiling: a Nurtec ODT quantity limit authorization that took effect within the last 12 months together with at least 3 paid retail fills of Nurtec ODT dated within the last three months adds 2 units; such an authorization with fewer than 3 such fills, or at least one such fill without such an authorization, adds 1 unit; neither adds nothing.', lapsed_6m: a quantity limit authorization for the drug whose last day in force fell within the last 6 months adds 2 units, lapsed_12m: one whose last day fell within the last 12 months but not the last 6 adds 1 unit, lapsed_units: 'A lapsed approval shows need already established: a quantity limit authorization for the drug whose last day in force fell within the last 6 months adds 2 units; one whose last day fell within the last 12 months but not the last 6 adds 1 unit; no quantity limit authorization for the drug ending within the last 12 months adds nothing.', cash_denials: '2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 6 months', cash_units: 'Cash purchases show need beyond the limit: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 6 months, add 2 units; exactly 1 such denial adds 1 unit; none adds nothing.', ceiling: 'The ceiling is the limit times the multiple as worked out for opioid use, plus the preventive allowance, plus the lapsed-approval units, plus the cash-purchase units, rounded down to a whole unit only at the end.', result: The approved quantity of a first-time quantity limit exception on an acute migraine drug is the smaller of the quantity the undecided request asks for and the approval ceiling.}
  factors:
  - id: diagnosis_and_fill_multiple
    effect: parameter
    decides: multiple
    bindings: [diagnosis, chronic, fills_1m, fills_2m, fills_3m, full_months, multiple]
    ladder:
    - {when: a chronic migraine diagnosis on the prescriber's most recent clinical information and paid retail fills reaching the limit in each of the last three months, value: P('ql_exception_max_multiple')}
    - {when: 'a chronic migraine diagnosis without fills reaching the limit in each of those months, or fills reaching the limit in each of those months under another diagnosis', value: P('ql_exception_max_multiple') * K('partial_share')}
    - {when: otherwise, value: P('ql_exception_max_multiple') * K('default_share')}
    baseline: {multiple: P('ql_exception_max_multiple') * K('default_share')}
    evidence: [history, cross_category]
    cross_difficulty: retail
  - id: concurrent_opioid_method
    effect: method
    decides: opioid_adjusted
    bindings: [opioid_days, opioid_adjusted]
    ladder:
    - {when: paid oxycodone-acetaminophen retail fills within the last three months add up to 30 or more days supply, method: the average monthly opioid days (the days supply divided by 3) are subtracted from the limit times the multiple}
    - {when: those fills add up to between 1 and 29 days supply, method: the limit times the multiple is multiplied by 0.9}
    - {when: otherwise, method: the limit times the multiple is used as it stands}
    baseline: {opioid_adjusted: limit_times_multiple}
    evidence: [cross_category, history]
    cross_difficulty: retail
  - id: preventive_allowance
    effect: parameter
    decides: preventive_units
    bindings: [preventive_authorizations, preventive_fills, preventive_units]
    ladder:
    - {when: a Nurtec ODT quantity limit authorization that took effect within the last 12 months and at least 3 paid Nurtec ODT retail fills within the last three months, value: K('preventive_units_established')}
    - {when: 'such an authorization with fewer than 3 such fills, or at least one such fill without such an authorization', value: K('preventive_units_starting')}
    - {when: otherwise, value: '0'}
    baseline: {preventive_units: '0'}
    evidence: [history, cross_category]
    cross_difficulty: retail
  - id: lapsed_approval_units
    effect: parameter
    decides: lapsed_units
    bindings: [lapsed_6m, lapsed_12m, lapsed_units]
    ladder:
    - {when: a quantity limit authorization for the drug whose last day in force fell within the last 6 months, value: K('lapsed_recent_units')}
    - {when: a quantity limit authorization for the drug whose last day in force fell within the last 12 months but not the last 6, value: K('lapsed_older_units')}
    - {when: otherwise, value: '0'}
    baseline: {lapsed_units: '0'}
    evidence: [history, date]
    cross_difficulty: null
  - id: cash_purchase_units
    effect: parameter
    decides: cash_units
    bindings: [cash_denials, cash_units]
    ladder:
    - {when: '2 or more paper claims for the drug denied because a coverage review was required, dated within the last 6 months', value: K('cash_units_repeat')}
    - {when: exactly 1 such denial within the last 6 months, value: K('cash_units_single')}
    - {when: otherwise, value: '0'}
    baseline: {cash_units: '0'}
    evidence: [cross_category, history]
    cross_difficulty: retail
  inputs:
    history:
    - table: review_cases
      aggregate: latest
      field: requested_quantity_per_30
      filters: {event_type: review_case_opened, review_type: quantity_limit_exception}
    - table: review_authorizations
      aggregate: count
      field: review_authorization_id
      within_months: 12
      filters: {event_type: review_auth_granted, authorization_type: quantity_limit}
    - category: retail
      table: retail_claims
      aggregate: sum
      field: quantity
      within_months: 3
      filters: {event_type: retail_claim_paid}
