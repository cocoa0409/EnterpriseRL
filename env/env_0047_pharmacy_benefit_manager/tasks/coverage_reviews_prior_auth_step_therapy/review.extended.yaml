category: review
display_name: Utilization Management Program
binding:
  holding_table: review_programs
  event_tables: [review_cases, review_authorizations]
  status_field: status
  variant_field: variant_name
lifecycle:
  states: [pending_effective, active, terminated]
  transitions:
  - {from: pending_effective, to: active, by: system, means: The plan coverage effective date is reached and the review package starts governing claims.}
  - {from: pending_effective, to: terminated, by: system, means: The future-dated plan enrollment is cancelled before it takes effect.}
  - {from: active, to: terminated, by: system, means: Plan coverage ends and the review program ends with it.}
  - {from: terminated, to: active, by: system, means: A COBRA reinstatement restores the review program.}
accounts: []
parameter_schema: {pa_required_drugs: drugs from the Northbridge Rx drug master list that need a prior authorization approval before they are covered, step_therapy_protocols: 'mapping of step-therapy target drug -> {prerequisites: drugs that must have been tried first, trials_required: how many different prerequisites}', quantity_limits: mapping of drug -> maximum covered quantity (units) per rolling 30 days without a quantity limit exception, step_lookback_days: calendar days before the date the step is evaluated (that date as day zero) in which a prerequisite trial must appear in claims history (0 where there is no step program), step_trial_min_days_supply: minimum cumulative days supply of a prerequisite drug that counts as a trial (0 where there is no step program), automated_step_check: 'the step edit is checked automatically against claims history when the target drug is billed, and an approval is created without a case when it is satisfied; boolean', step_grandfathering_days: calendar days before the claim (claim date as day zero) in which a paid claim for the target drug itself exempts the member from the step edit (0 = no grandfathering), pa_approval_months: default months a prior authorization approval runs from its effective date, initial_approval_month_overrides: mapping of drug -> months for a first-time approval that differ from pa_approval_months (renewals use renewal_approval_months), renewal_approval_months: months a renewal approval runs from its effective date, step_approval_months: months a step therapy approval (manual or automated) runs from its effective date, ql_approval_months: months a quantity limit exception approval runs from its effective date, ql_exception_max_multiple: highest approvable quantity as a multiple of the drug's quantity limit, renewal_window_days: calendar days before an approval's expiration date from which a renewal case may be opened, renewal_requires_new_clinicals: a renewal needs current clinical documentation of response to therapy; boolean, glp1_weight_renewal_min_loss: minimum fraction of baseline body weight lost that a weight-management GLP-1 renewal must document, auto_renewal_chronic: approvals for drugs with continuous paid claims over the approval period renew automatically without a case; boolean, auto_renewal_drugs: drugs eligible for automatic renewal where auto_renewal_chronic is true, standard_decision_hours: hours from receipt of the case within which a standard review is decided, urgent_decision_hours: hours from receipt of the case within which an urgent review is decided, urgent_attestation_required: 'a review is urgent only when the prescriber attests that the standard timeframe could seriously jeopardize the member''s life, health or ability to regain maximum function; boolean', urgent_downgrade_allowed: a reviewer may handle a request without a prescriber urgency attestation as standard; boolean, info_request_attempts: outreach attempts to the prescriber for missing clinical information before the case is decided on what is on file, info_request_wait_days: calendar days after the information request (request date as day zero) to wait for clinical information before deciding on what is on file, member_initiated_review_allowed: a member or authorized representative may open a review; the prescriber's clinical information is still required; boolean, one_open_case_per_drug_type: 'at most one undecided case per member, drug and review type; boolean', retro_effective_days: calendar days before the decision date that an approval's effective date may be set back to cover a fill the member already paid for (0 = no retro approvals), approval_covers_strength_changes: an approval carries over to other strengths of the same drug; boolean, continuity_of_care_days: calendar days from the review program effective date (that date as day 1) during which a new member's prior-carrier approval is honored, continuity_requires_prior_claims: continuity of care needs prior-carrier claims history for the drug in addition to the prior-carrier approval letter; boolean, continuity_approval_days: calendar days a continuity-of-care approval runs from the review program effective date (that date as day 1), auth_carryover_on_package_change: approvals in force carry over when the sponsor changes the review package; boolean, auth_ends_with_coverage: approvals end on the last day of plan coverage and resume through their original expiration date on COBRA reinstatement; boolean, specialty_guideline_management: specialty approvals are checked at renewal against dosing guidelines and documented response; boolean, off_label_compendia_required: an off-label use is approvable only with support in a recognized compendium; boolean, opioid_mme_review: opioid claims above the network's daily MME limit can be approved by a quantity limit exception; boolean, ql_basis: how the quantity limit period is counted; enum, epa_supported: electronic prior authorization from the prescriber's system is accepted; boolean, urgent_intake_24x7: urgent reviews are taken and decided around the clock including weekends and holidays; boolean, clinical_criteria_source: criteria the reviews apply; enum, denial_notice_includes_alternatives: a denial lists the formulary alternatives that need no review; boolean, withdrawal_allowed: the requester may withdraw an undecided case; boolean, pharmacist_review_level: lowest reviewer who may approve; denials are always made by a pharmacist or physician; enum, physician_review_for_denial_of_urgent: an urgent denial needs a physician reviewer; boolean, case_decision_once: a case takes exactly one decision; a new request starts a new case; boolean, auto_approval_creates_case_record: an automated step approval is recorded as an auto-approved case event; boolean, diagnosis_required_drugs: drugs whose review requires an ICD-10-CM diagnosis code on the case, maximum_open_auths_per_drug: approvals of the same type in force at the same time for one drug, renewal_effective_basis: a renewal's effective date; enum}
