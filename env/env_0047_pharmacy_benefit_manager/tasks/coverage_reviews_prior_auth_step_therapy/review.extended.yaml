- id: review_ext_continuity_quantity
  base_policy_refs: [review_authorization_period, review_continuity_of_care, review_quantity_limit]
  overwrite: []
  trigger: state_due
  subject: [review_auth_granted]
  computes: approved_quantity_per_30
  target_tool: grant_continuity_authorization_38eb93b7
  params: {strength_ratio_down: 0.5, strength_ratio_up: 2, cash_units_repeat: 3, cash_units_single: 1, move_window_days: 60, limit_sumatriptan: 9, limit_nurtec: 8, limit_ubrelvy: 16, partial_share: 0.875, default_share: 0.75, fresh_fill_days: 7}
  rule: 'This rule sets the quantity per rolling 30 days a continuity-of-care quantity limit authorization carries for an acute migraine drug (sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days) when a new member''s prior carrier''s approval for the drug is on file, that is, when the member''s case for the drug relies on the prior carrier''s approval; the authorization runs from the review program effective date for the package''s continuity approval days and is granted only inside the continuity window. Windows of months in this rule end on the grant date: a record dated within the last N months is dated after the same day of the month N months before the grant date. A continuity-of-care quantity limit authorization carries the quantity per rolling 30 days that the prior carrier''s approval on file states, being the quantity asked for on the member''s case relying on that approval, but never more than the continuity ceiling, which is the drug''s limit times three quarters of the package''s maximum exception multiple. The prior carrier''s quantity is counted in tablets of the strength the member now fills at Northbridge Rx retail by multiplying it by a strength ratio: the ratio is 0.5 when the approval on file is for the 50 mg tablet and the member''s most recent paid retail fill is the 100 mg tablet, 2 when the approval on file is for the 100 mg tablet and the most recent paid retail fill is the 50 mg tablet, and 1 otherwise. Cash purchases made while the continuity coverage was missing are carried into it: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 3 months, add 3 units; exactly 1 such denial adds 1 unit; none adds nothing. A member moving to home delivery has the retail fill still running carried into the continuity quantity: with a home delivery account opened within the last 60 days, when the most recent paid retail fill of the drug was dispensed at least 7 days before the grant date and its days supply has not run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply; when that fill was dispensed fewer than 7 days before the grant date, its whole quantity is added; an account opened earlier, no home delivery account, or a fill whose supply has run out adds nothing. The continuity ceiling uses the whole of the package''s maximum exception multiple in place of three quarters of it when the prior carrier''s claims history for the drug has been received on the member''s case and the member''s paid retail fills of the drug reached the limit both in the last month and in the month before it (fills dated within the last two months but not the last month); it uses seven eighths of it when exactly one of those two holds; a member with neither keeps three quarters of it. The quantity carried is the prior carrier''s quantity as counted in the current strength, plus the cash-purchase units, plus the running retail fill carried in, rounded to three decimal places and then compared with the continuity ceiling, the smaller of the two being recorded.'
  baseline:
    rule: A continuity-of-care quantity limit authorization carries the quantity per rolling 30 days that the prior carrier's approval on file states, being the quantity asked for on the member's case relying on that approval, but never more than the continuity ceiling, which is the drug's limit times three quarters of the package's maximum exception multiple.
    params: [default_share, ql_exception_max_multiple, limit_sumatriptan, limit_nurtec, limit_ubrelvy]
  prerequisite: []
  cross_category:
  - category: retail
    as: history
    reads: [retail_claims.drug_strength, retail_claims.date_of_service, retail_claims.days_supply, retail_claims.quantity, retail_reimbursements.decision_reason, retail_reimbursements.received_date]
    note: The strength factor reads the latest paid retail fill's strength; the cash factor reads paper-claim denials; the move factor reads whether the latest fill is still running; the ceiling factor reads monthly paid fills.
  - category: mail
    as: existence
    reads: [mail_accounts.opened_date]
    note: The move allowance reads when the home delivery account was opened.
  compute:
  - {drug: 'LATEST(''review_cases'', ''drug_name'', date_field=''event_at'', event_type=''review_case_opened'', criteria_basis=''prior_carrier_approval'')'}
  - {limit: K('limit_sumatriptan') if drug == 'sumatriptan' else (K('limit_nurtec') if drug == 'Nurtec ODT' else K('limit_ubrelvy'))}
  - {letter_case: 'LATEST(''review_cases'', ''review_case_id'', date_field=''event_at'', event_type=''review_case_opened'', criteria_basis=''prior_carrier_approval'', drug_name=drug)'}
  - {letter_qty: 'LATEST(''review_cases'', ''requested_quantity_per_30'', date_field=''event_at'', review_case_id=letter_case)'}
  - {letter_strength: 'LATEST(''review_cases'', ''drug_strength'', date_field=''event_at'', review_case_id=letter_case)'}
  - {current_strength: 'XLATEST(''retail'', ''retail_claims'', ''drug_strength'', date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {strength_ratio: K('strength_ratio_down') if (letter_strength == '50 mg tablet' and current_strength == '100 mg tablet') else (K('strength_ratio_up') if (letter_strength == '100 mg tablet' and current_strength == '50 mg tablet') else 1)}
  - {counted_qty: letter_qty * strength_ratio}
  - {cash_denials: 'XCOUNT(''retail'', ''retail_reimbursements'', within_months=3, date_field=''received_date'', drug_name=drug, event_type=''retail_dmr_denied'', decision_reason=''coverage_review_required'')'}
  - {cash_units: K('cash_units_repeat') if cash_denials >= 2 else (K('cash_units_single') if cash_denials == 1 else 0)}
  - {last_fill_date: 'XLATEST(''retail'', ''retail_claims'', ''date_of_service'', date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {last_fill_days: 'XLATEST(''retail'', ''retail_claims'', ''days_supply'', date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {last_fill_qty: 'XLATEST(''retail'', ''retail_claims'', ''quantity'', date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {mail_opened: 'CFIELD(''mail'', ''opened_date'')'}
  - {recent_account: 'mail_opened != None and DAYS(mail_opened, NOW) <= K(''move_window_days'')'}
  - {fill_age: 'DAYS(last_fill_date, NOW)'}
  - {move_units: last_fill_qty * (last_fill_days - fill_age) / last_fill_days if (recent_account and fill_age >= K('fresh_fill_days') and fill_age < last_fill_days) else (last_fill_qty if (recent_account and fill_age < K('fresh_fill_days')) else 0)}
  - {prior_claims_received: 'COUNT(''review_cases'', event_type=''review_case_info_received'', drug_name=drug, criteria_basis=''prior_carrier_approval'')'}
  - {fills_1m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=1, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {fills_2m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=2, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {at_limit_both: fills_1m >= limit and fills_2m - fills_1m >= limit}
  - {ceiling_multiple: P('ql_exception_max_multiple') if (prior_claims_received >= 1 and at_limit_both) else (P('ql_exception_max_multiple') * K('partial_share') if ((prior_claims_received >= 1 and not at_limit_both) or (prior_claims_received == 0 and at_limit_both)) else P('ql_exception_max_multiple') * K('default_share'))}
  - {carried: 'RND(counted_qty + cash_units + move_units, 3)'}
  - {result: 'MN(carried, RND(limit * ceiling_multiple, 3))'}
  compute_basis: {drug: when the member's case for the drug relies on the prior carrier's approval, limit: 'sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days', letter_case: being the quantity asked for on the member's case relying on that approval, letter_qty: 'A continuity-of-care quantity limit authorization carries the quantity per rolling 30 days that the prior carrier''s approval on file states, being the quantity asked for on the member''s case relying on that approval', letter_strength: when the approval on file is for the 50 mg tablet and the member's most recent paid retail fill is the 100 mg tablet, current_strength: The prior carrier's quantity is counted in tablets of the strength the member now fills at Northbridge Rx retail, cash_denials: '2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 3 months', cash_units: 'Cash purchases made while the continuity coverage was missing are carried into it: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 3 months, add 3 units; exactly 1 such denial adds 1 unit; none adds nothing.', last_fill_date: 'when the most recent paid retail fill of the drug was dispensed at least 7 days before the grant date and its days supply has not run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply', last_fill_days: 'when the most recent paid retail fill of the drug was dispensed at least 7 days before the grant date and its days supply has not run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply', mail_opened: with a home delivery account opened within the last 60 days, recent_account: with a home delivery account opened within the last 60 days, move_units: 'A member moving to home delivery has the retail fill still running carried into the continuity quantity: with a home delivery account opened within the last 60 days, when the most recent paid retail fill of the drug was dispensed at least 7 days before the grant date and its days supply has not run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply; when that fill was dispensed fewer than 7 days before the grant date, its whole quantity is added; an account opened earlier, no home delivery account, or a fill whose supply has run out adds nothing.', prior_claims_received: when the prior carrier's claims history for the drug has been received on the member's case, fills_1m: the member's paid retail fills of the drug reached the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), fills_2m: the member's paid retail fills of the drug reached the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), at_limit_both: the member's paid retail fills of the drug reached the limit both in the last month and in the month before it, ceiling_multiple: The continuity ceiling uses the whole of the package's maximum exception multiple in place of three quarters of it when the prior carrier's claims history for the drug has been received on the member's case and the member's paid retail fills of the drug reached the limit both in the last month and in the month before it (fills dated within the last two months but not the last month); it uses seven eighths of it when exactly one of those two holds; a member with neither keeps three quarters of it., carried: 'The quantity carried is the prior carrier''s quantity as counted in the current strength, plus the cash-purchase units, plus the running retail fill carried in, rounded to three decimal places', result: 'and then compared with the continuity ceiling, the smaller of the two being recorded.', strength_ratio: 'The prior carrier''s quantity is counted in tablets of the strength the member now fills at Northbridge Rx retail by multiplying it by a strength ratio: the ratio is 0.5 when the approval on file is for the 50 mg tablet and the member''s most recent paid retail fill is the 100 mg tablet, 2 when the approval on file is for the 100 mg tablet and the most recent paid retail fill is the 50 mg tablet, and 1 otherwise.', counted_qty: The prior carrier's quantity is counted in tablets of the strength the member now fills at Northbridge Rx retail by multiplying it by a strength ratio, last_fill_qty: 'when the most recent paid retail fill of the drug was dispensed at least 7 days before the grant date and its days supply has not run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply', fill_age: 'when the most recent paid retail fill of the drug was dispensed at least 7 days before the grant date and its days supply has not run out, the unused part of that fill is added, being its quantity times the days of its supply still remaining divided by its days supply'}
  factors:
  - id: current_strength_count
    effect: parameter
    decides: strength_ratio
    bindings: [letter_strength, current_strength, strength_ratio]
    ladder:
    - {when: the prior carrier's approval is for the 50 mg tablet and the most recent paid retail fill is the 100 mg tablet, value: K('strength_ratio_down')}
    - {when: the prior carrier's approval is for the 100 mg tablet and the most recent paid retail fill is the 50 mg tablet, value: K('strength_ratio_up')}
    - {when: otherwise, value: '1'}
    baseline: {strength_ratio: '1'}
    evidence: [history, cross_category]
    cross_difficulty: retail
  - id: continuity_cash_units
    effect: parameter
    decides: cash_units
    bindings: [cash_denials, cash_units]
    ladder:
    - {when: '2 or more paper claims for the drug denied because a coverage review was required, dated within the last 3 months', value: K('cash_units_repeat')}
    - {when: exactly 1 such denial within the last 3 months, value: K('cash_units_single')}
    - {when: otherwise, value: '0'}
    baseline: {cash_units: '0'}
    evidence: [cross_category, history]
    cross_difficulty: retail
  - id: home_delivery_move_allowance
    effect: method
    decides: move_units
    bindings: [mail_opened, recent_account, fill_age, move_units]
    ladder:
    - {when: a home delivery account opened within the last 60 days and the most recent paid retail fill dispensed at least 7 days before the grant date with days supply remaining, method: 'the unused part of that fill is added: its quantity times the days of supply remaining divided by its days supply'}
    - {when: a home delivery account opened within the last 60 days and the most recent paid retail fill dispensed fewer than 7 days before the grant date, method: the whole quantity of that fill is added}
    - {when: otherwise, method: nothing is added}
    baseline: {move_units: '0'}
    evidence: [cross_category, date]
    cross_difficulty: mail
  - id: continuity_ceiling_multiple
    effect: parameter
    decides: ceiling_multiple
    bindings: [prior_claims_received, fills_1m, fills_2m, at_limit_both, ceiling_multiple]
    ladder:
    - {when: the prior carrier's claims history has been received and paid retail fills reached the limit in both of the last two months, value: P('ql_exception_max_multiple')}
    - {when: exactly one of those two holds, value: P('ql_exception_max_multiple') * K('partial_share')}
    - {when: otherwise, value: P('ql_exception_max_multiple') * K('default_share')}
    baseline: {ceiling_multiple: P('ql_exception_max_multiple') * K('default_share')}
    evidence: [history, cross_category]
    cross_difficulty: retail
  inputs:
    history:
    - table: review_cases
      aggregate: count
      field: review_case_id
      filters: {event_type: review_case_info_received, criteria_basis: prior_carrier_approval}
    - category: retail
      table: retail_claims
      aggregate: sum
      field: quantity
      within_months: 2
      filters: {event_type: retail_claim_paid}
    - category: retail
      table: retail_reimbursements
      aggregate: count
      field: retail_reimbursement_id
      within_months: 3
      filters: {event_type: retail_dmr_denied, decision_reason: coverage_review_required}
    cross_category: [retail, mail]
- id: review_ext_renewal_request_quantity
  base_policy_refs: [review_requirements, review_evt_case_intake, review_authorization_period]
  overwrite: []
  trigger: on_request
  subject: [review_case_opened]
  computes: requested_quantity_per_30
  target_tool: file_renewal_request_18124eb7
  params: {long_supply_days: 34, steady_shipments: 3, margin_both_months: 0.5, margin_one_month: 0.25, renewal_cash_repeat: 1, renewal_cash_single: 0.5, growth_full: 1.25, growth_partial: 1.15, growth_default: 1.1, limit_sumatriptan: 9, limit_nurtec: 8, limit_ubrelvy: 16}
  rule: 'This rule sets the quantity a member-filed renewal request asks for when the member renews the quantity limit authorization in force for an acute migraine drug (sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days), whatever produced that authorization; a first-time request carries no quantity under it. The quantity a member-filed renewal request asks for is not fixed until the records carry a continuity-of-care authorization for every prior carrier''s approval on file for the drug. The drug is the drug of the member''s most recent quantity limit exception case event, and the authorization being renewed is the member''s quantity limit authorization for the drug with the latest effective date. Windows of months in this rule end on the filing date: a record dated within the last N months is dated after the same day of the month N months before the filing date. A member-filed renewal request asks for the quantity per rolling 30 days approved on the authorization being renewed, never more than the renewal ceiling, which is that approved quantity times 1.1, rounded to three decimal places only at the end. The renewed quantity follows the refill cycle the member is on at home delivery: a member enrolled in automatic home delivery refills whose newest home delivery prescription for the drug is written for more than a 34-day supply has the approved quantity multiplied by that prescription''s days supply and divided by its days supply less the home delivery program''s automatic refill lead days; a member not enrolled in automatic refills who had at least 3 home delivery shipments of the drug in the last six months has the approved quantity divided by the home delivery program''s refill eligibility fraction; every other member has the approved quantity as it stands. A use margin is added when the member has been filling at the limit: paid retail fills of the drug reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month) add 0.5 unit; reaching it in exactly one of those two months adds 0.25 unit; otherwise nothing is added. Cash purchases are added: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 2 months, add 1 unit; exactly 1 such denial adds 0.5 unit; none adds nothing. The renewal ceiling uses 1.25 in place of 1.1 when clinical information for the drug was received within the last month and the most recent clinical information carries a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719), and uses 1.15 when exactly one of those two holds; a member with neither keeps 1.1. The quantity asked for is the renewed quantity on the refill cycle, plus the use margin, plus the cash-purchase units, rounded to three decimal places and then compared with the renewal ceiling, the smaller of the two being recorded.'
  baseline:
    rule: A member-filed renewal request asks for the quantity per rolling 30 days approved on the authorization being renewed, never more than the renewal ceiling, which is that approved quantity times 1.1, rounded to three decimal places only at the end.
    params: [growth_default]
  prerequisite:
  - {problem: review_ext_continuity_quantity, kind: value_input, gate: renewed_qty, form: state, policy_source: The quantity a member-filed renewal request asks for is not fixed until the records carry a continuity-of-care authorization for every prior carrier's approval on file for the drug., condition: 'For every review_cases opening of the drug with criteria_basis prior_carrier_approval, review_authorizations holds a review_auth_granted row for the drug with auth_basis continuity_of_care.', resolved_by: grant_continuity_authorization_38eb93b7, effect: 'The renewed_qty binding reads the approved quantity of the member''s latest quantity limit authorization for the drug, which is the continuity-of-care authorization once it is recorded; with none on record it is 0.'}
  cross_category:
  - category: mail
    as: history
    reads: [mail_accounts.auto_refill_enrolled, mail_prescriptions.days_supply_per_fill, mail_orders.order_date]
    note: The refill-cycle factor reads automatic refill enrollment, the program's lead days and eligibility fraction, the newest prescription's days supply and the shipment count.
  - category: retail
    as: history
    reads: [retail_claims.quantity, retail_claims.date_of_service, retail_reimbursements.decision_reason, retail_reimbursements.received_date]
    note: The use margin reads monthly paid fills; the cash factor reads paper-claim denials.
  compute:
  - {drug: 'LATEST(''review_cases'', ''drug_name'', date_field=''event_at'', review_type=''quantity_limit_exception'')'}
  - {limit: K('limit_sumatriptan') if drug == 'sumatriptan' else (K('limit_nurtec') if drug == 'Nurtec ODT' else K('limit_ubrelvy'))}
  - {renewed_qty: 'LATEST(''review_authorizations'', ''approved_quantity_per_30'', date_field=''effective_date'', event_type=''review_auth_granted'', drug_name=drug, authorization_type=''quantity_limit'') or 0'}
  - {auto_refill: 'CFIELD(''mail'', ''auto_refill_enrolled'')'}
  - {lead_days: 'CPARAM(''mail'', ''auto_refill_lead_days'')'}
  - {eligibility_fraction: 'CPARAM(''mail'', ''refill_eligibility_fraction'')'}
  - {rx_days: 'XLATEST(''mail'', ''mail_prescriptions'', ''days_supply_per_fill'', date_field=''written_date'', drug_name=drug)'}
  - {shipments_6m: 'XCOUNT(''mail'', ''mail_orders'', within_months=6, date_field=''order_date'', drug_name=drug, event_type=''mail_order_shipped'')'}
  - {cycle_qty: renewed_qty * rx_days / (rx_days - lead_days) if (auto_refill == True and rx_days != None and rx_days > K('long_supply_days')) else (renewed_qty / eligibility_fraction if (auto_refill != True and shipments_6m >= K('steady_shipments')) else renewed_qty)}
  - {fills_1m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=1, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {fills_2m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=2, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {use_margin: K('margin_both_months') if (fills_1m >= limit and fills_2m - fills_1m >= limit) else (K('margin_one_month') if ((fills_1m >= limit and fills_2m - fills_1m < limit) or (fills_1m < limit and fills_2m - fills_1m >= limit)) else 0)}
  - {cash_denials: 'XCOUNT(''retail'', ''retail_reimbursements'', within_months=2, date_field=''received_date'', drug_name=drug, event_type=''retail_dmr_denied'', decision_reason=''coverage_review_required'')'}
  - {cash_units: K('renewal_cash_repeat') if cash_denials >= 2 else (K('renewal_cash_single') if cash_denials == 1 else 0)}
  - {recent_clinicals: 'COUNT(''review_cases'', within_months=1, date_field=''event_at'', event_type=''review_case_info_received'', drug_name=drug)'}
  - {latest_diagnosis: 'LATEST(''review_cases'', ''diagnosis_code'', date_field=''event_at'', event_type=''review_case_info_received'', drug_name=drug)'}
  - {chronic: latest_diagnosis == 'G43.701' or latest_diagnosis == 'G43.709' or latest_diagnosis == 'G43.711' or latest_diagnosis == 'G43.719'}
  - {growth: K('growth_full') if (recent_clinicals >= 1 and chronic) else (K('growth_partial') if ((recent_clinicals >= 1 and not chronic) or (recent_clinicals == 0 and chronic)) else K('growth_default'))}
  - {asked: 'RND(cycle_qty + use_margin + cash_units, 3)'}
  - {result: 'MN(asked, RND(renewed_qty * growth, 3))'}
  compute_basis: {drug: The drug is the drug of the member's most recent quantity limit exception case event, limit: 'sumatriptan, whose limit is 9 units, Nurtec ODT, whose limit is 8 units, and Ubrelvy, whose limit is 16 units per rolling 30 days', renewed_qty: the authorization being renewed is the member's quantity limit authorization for the drug with the latest effective date., auto_refill: a member enrolled in automatic home delivery refills whose newest home delivery prescription for the drug is written for more than a 34-day supply, lead_days: divided by its days supply less the home delivery program's automatic refill lead days, eligibility_fraction: has the approved quantity divided by the home delivery program's refill eligibility fraction, rx_days: has the approved quantity multiplied by that prescription's days supply, shipments_6m: a member not enrolled in automatic refills who had at least 3 home delivery shipments of the drug in the last six months, cycle_qty: 'The renewed quantity follows the refill cycle the member is on at home delivery: a member enrolled in automatic home delivery refills whose newest home delivery prescription for the drug is written for more than a 34-day supply has the approved quantity multiplied by that prescription''s days supply and divided by its days supply less the home delivery program''s automatic refill lead days; a member not enrolled in automatic refills who had at least 3 home delivery shipments of the drug in the last six months has the approved quantity divided by the home delivery program''s refill eligibility fraction; every other member has the approved quantity as it stands.', fills_1m: paid retail fills of the drug reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), fills_2m: paid retail fills of the drug reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), use_margin: 'A use margin is added when the member has been filling at the limit: paid retail fills of the drug reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month) add 0.5 unit; reaching it in exactly one of those two months adds 0.25 unit; otherwise nothing is added.', cash_denials: '2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 2 months', cash_units: 'Cash purchases are added: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 2 months, add 1 unit; exactly 1 such denial adds 0.5 unit; none adds nothing.', recent_clinicals: when clinical information for the drug was received within the last month, latest_diagnosis: 'the most recent clinical information carries a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719)', chronic: 'the most recent clinical information carries a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719)', growth: 'The renewal ceiling uses 1.25 in place of 1.1 when clinical information for the drug was received within the last month and the most recent clinical information carries a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719), and uses 1.15 when exactly one of those two holds; a member with neither keeps 1.1.', asked: 'The quantity asked for is the renewed quantity on the refill cycle, plus the use margin, plus the cash-purchase units, rounded to three decimal places', result: 'and then compared with the renewal ceiling, the smaller of the two being recorded.'}
  factors:
  - id: renewal_refill_cycle
    effect: method
    decides: cycle_qty
    bindings: [auto_refill, lead_days, eligibility_fraction, rx_days, shipments_6m, cycle_qty]
    ladder:
    - {when: enrolled in automatic home delivery refills and the newest home delivery prescription is written for more than a 34-day supply, method: the approved quantity is multiplied by the prescription's days supply and divided by that days supply less the automatic refill lead days}
    - {when: not enrolled in automatic refills and at least 3 home delivery shipments of the drug in the last six months, method: the approved quantity is divided by the home delivery program's refill eligibility fraction}
    - {when: otherwise, method: the approved quantity is used as it stands}
    baseline: {cycle_qty: renewed_qty}
    evidence: [cross_category, history]
    cross_difficulty: mail
  - id: renewal_use_margin
    effect: parameter
    decides: use_margin
    bindings: [fills_1m, fills_2m, use_margin]
    ladder:
    - {when: paid retail fills reached the limit both in the last month and in the month before it, value: K('margin_both_months')}
    - {when: paid retail fills reached the limit in exactly one of those two months, value: K('margin_one_month')}
    - {when: otherwise, value: '0'}
    baseline: {use_margin: '0'}
    evidence: [cross_category, history]
    cross_difficulty: retail
  - id: renewal_cash_units
    effect: parameter
    decides: cash_units
    bindings: [cash_denials, cash_units]
    ladder:
    - {when: '2 or more paper claims for the drug denied because a coverage review was required, dated within the last 2 months', value: K('renewal_cash_repeat')}
    - {when: exactly 1 such denial within the last 2 months, value: K('renewal_cash_single')}
    - {when: otherwise, value: '0'}
    baseline: {cash_units: '0'}
    evidence: [cross_category, history]
    cross_difficulty: retail
  - id: renewal_growth_multiple
    effect: parameter
    decides: growth
    bindings: [recent_clinicals, latest_diagnosis, chronic, growth]
    ladder:
    - {when: clinical information received within the last month and a chronic migraine diagnosis on the most recent clinical information, value: K('growth_full')}
    - {when: exactly one of those two holds, value: K('growth_partial')}
    - {when: otherwise, value: K('growth_default')}
    baseline: {growth: K('growth_default')}
    evidence: [history]
    cross_difficulty: null
  inputs:
    history:
    - table: review_authorizations
      aggregate: latest
      field: approved_quantity_per_30
      filters: {event_type: review_auth_granted, authorization_type: quantity_limit}
    - table: review_cases
      aggregate: count
      field: review_case_id
      within_months: 1
      filters: {event_type: review_case_info_received}
    - category: mail
      table: mail_orders
      aggregate: count
      field: mail_order_id
      within_months: 6
      filters: {event_type: mail_order_shipped}
    - category: retail
      table: retail_claims
      aggregate: sum
      field: quantity
      within_months: 2
      filters: {event_type: retail_claim_paid}
    - category: retail
      table: retail_reimbursements
      aggregate: count
      field: retail_reimbursement_id
      within_months: 2
      filters: {event_type: retail_dmr_denied, decision_reason: coverage_review_required}
    cross_category: [mail, retail]
- id: review_ext_renewal_approved_quantity
  base_policy_refs: [review_evt_decision, review_step_therapy, review_quantity_limit, review_specialty_guideline, review_authorization_period]
  overwrite:
  - {base_policy: review_quantity_limit, superseded_clause: up to ql_exception_max_multiple times that limit per rolling 30 days; a request above that multiple is approved only up to it, replaced_by: The approved quantity of a quantity limit renewal on an acute migraine drug is the smaller of the quantity the undecided renewal request asks for and the renewal approval ceiling.}
  trigger: on_request
  subject: [review_case_approved]
  computes: approved_quantity_per_30
  target_tool: approve_quantity_renewal_696a9005
  params: {overuse_days_high: 30, overuse_scale_moderate: 0.9, pool_divisor: 4, pool_scale: 0.95, continuity_units_documented: 2, continuity_units_letter_only: 1, response_units_documented: 2, response_units_necessity: 1, cash_units_repeat: 2, cash_units_single: 1, limit_sumatriptan: 9, limit_nurtec: 8, limit_ubrelvy: 16, partial_share: 0.875, default_share: 0.75}
  rule: 'This rule decides the approved quantity per rolling 30 days when a renewal request for a quantity limit authorization on sumatriptan or Ubrelvy (sumatriptan''s limit is 9 units and Ubrelvy''s is 16 units per rolling 30 days; Nurtec ODT, whose limit is 8 units, is renewed under the same terms without the other-drug adjustment) is approved; the renewal takes effect the day after the authorization being renewed expires and runs the package''s renewal approval months under the general approval-period rule. The approved quantity of a quantity limit renewal is fixed only after the records carry an undecided renewal request for the drug. The approval ceiling of a quantity limit renewal is worked out only after the records carry the authorization owed for every appeal overturned on the other acute migraine drug. The drug is the drug of the member''s most recent renewal request, the request is undecided while no approval, denial or withdrawal for the drug is recorded after its opening, and the authorization being renewed is the member''s quantity limit authorization for the drug with the latest effective date. Windows of months in this rule end on the decision date: a record dated within the last N months is dated after the same day of the month N months before the decision date. The approved quantity of a quantity limit renewal on an acute migraine drug is the smaller of the quantity the undecided renewal request asks for and the renewal approval ceiling. The renewal approval ceiling is the drug''s limit times three quarters of the package''s maximum exception multiple, rounded down to a whole unit. The multiple applied to the limit rests on the most recent clinical information for the drug and the member''s paid retail fills of it: a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719) together with paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month) takes the package''s maximum exception multiple; a chronic migraine diagnosis without such fills in both months, or such fills in both months under another diagnosis, takes seven eighths of it; any other member takes three quarters of it. Concurrent opioid use changes how the ceiling is worked out from the limit times the multiple: when the member''s paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, one unit for each average monthly opioid day (those days supply divided by 3) is subtracted from it, a day of opioid treatment displacing one acute migraine dose; when they add up to between 1 and 29 days supply, it is multiplied by 0.9; when there is no such fill, it is used as it stands. The other acute migraine drug (Ubrelvy for a sumatriptan renewal, sumatriptan for a Ubrelvy renewal, none for a Nurtec ODT renewal) then changes how the ceiling is worked out from the result of the opioid step: when the member holds a quantity limit authorization for the other drug in force on the decision date with an approved quantity above that drug''s limit, one quarter of that approved quantity is subtracted; when the member holds such an authorization at or below that drug''s limit, or has at least one paid retail fill of the other drug dated within the last three months, the result is multiplied by 0.95; otherwise it is used as it stands. A renewal that replaces a continuity-of-care authorization receives a transition allowance: when the authorization being renewed is a continuity-of-care authorization and the prior carrier''s claims history for the drug has been received, 2 units are added; when it is a continuity-of-care authorization without that history, 1 unit is added; any other renewal adds nothing. The most recent clinical information for the drug adds a response allowance: clinical information whose ground is documented response to therapy adds 2 units; clinical information whose ground is that the quantity is medically necessary adds 1 unit; any other ground, or no clinical information, adds nothing. Cash purchases show need beyond the limit: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 6 months, add 2 units; exactly 1 such denial adds 1 unit; none adds nothing. The ceiling is the limit times the multiple as worked out for opioid use and then for the other acute migraine drug, plus the transition allowance, plus the response allowance, plus the cash-purchase units, rounded down to a whole unit only at the end.'
  baseline:
    rule: The approved quantity of a quantity limit renewal on an acute migraine drug is the smaller of the quantity the undecided renewal request asks for and the renewal approval ceiling. The renewal approval ceiling is the drug's limit times three quarters of the package's maximum exception multiple, rounded down to a whole unit.
    params: [default_share, ql_exception_max_multiple, limit_sumatriptan, limit_nurtec, limit_ubrelvy]
  prerequisite:
  - {problem: review_ext_renewal_request_quantity, kind: value_input, gate: requested_qty, form: state, policy_source: The approved quantity of a quantity limit renewal is fixed only after the records carry an undecided renewal request for the drug., condition: 'review_cases holds a review_case_opened row for the drug with is_renewal true that has no approval, denial or withdrawal row after it.', resolved_by: file_renewal_request_18124eb7, effect: The requested_qty binding reads the quantity the undecided renewal request asks for; with none on record it is 0 and nothing can be approved.}
  - {problem: review_ext_overturn_quantity, kind: value_input, gate: other_authorized_qty, form: state, policy_source: The approval ceiling of a quantity limit renewal is worked out only after the records carry the authorization owed for every appeal overturned on the other acute migraine drug., condition: 'For every appeal_cases appeal_overturned row on a coverage review denial of the other acute migraine drug, review_authorizations holds a review_auth_granted row for that drug with auth_basis appeal_overturn.', resolved_by: grant_overturn_authorization_6da113c2, effect: 'The other_authorized_qty binding becomes the approved quantity of the other drug''s authorization put in force by the overturn, which moves the other-drug step from a 0.95 multiplier to subtracting one quarter of that quantity.'}
  cross_category:
  - category: retail
    as: history
    reads: [retail_claims.quantity, retail_claims.days_supply, retail_claims.date_of_service, retail_reimbursements.decision_reason, retail_reimbursements.received_date]
    note: The multiple reads monthly paid fills of the drug; the opioid step reads oxycodone-acetaminophen days supply; the other-drug step reads fills of the other acute drug; the cash factor reads paper-claim denials.
  compute:
  - {drug: 'LATEST(''review_cases'', ''drug_name'', date_field=''event_at'', event_type=''review_case_opened'', is_renewal=True)'}
  - {limit: K('limit_sumatriptan') if drug == 'sumatriptan' else (K('limit_nurtec') if drug == 'Nurtec ODT' else K('limit_ubrelvy'))}
  - {opened_at: 'LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_opened'', drug_name=drug, is_renewal=True)'}
  - {decided_at: 'max(LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_approved'', drug_name=drug) or '''', LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_denied'', drug_name=drug) or '''', LATEST(''review_cases'', ''event_at'', date_field=''event_at'', event_type=''review_case_withdrawn'', drug_name=drug) or '''')'}
  - {requested_qty: 'LATEST(''review_cases'', ''requested_quantity_per_30'', date_field=''event_at'', event_type=''review_case_opened'', drug_name=drug, is_renewal=True) if (opened_at != None and opened_at > decided_at) else 0'}
  - {diagnosis: 'LATEST(''review_cases'', ''diagnosis_code'', date_field=''event_at'', event_type=''review_case_info_received'', drug_name=drug)'}
  - {chronic: diagnosis == 'G43.701' or diagnosis == 'G43.709' or diagnosis == 'G43.711' or diagnosis == 'G43.719'}
  - {fills_1m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=1, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {fills_2m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=2, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {both_months: fills_1m >= limit and fills_2m - fills_1m >= limit}
  - {multiple: P('ql_exception_max_multiple') if (chronic and both_months) else (P('ql_exception_max_multiple') * K('partial_share') if ((chronic and not both_months) or (both_months and not chronic)) else P('ql_exception_max_multiple') * K('default_share'))}
  - {opioid_days: 'XSUM(''retail'', ''retail_claims'', ''days_supply'', within_months=3, date_field=''date_of_service'', drug_name=''oxycodone-acetaminophen'', event_type=''retail_claim_paid'')'}
  - {limit_times_multiple: limit * multiple}
  - {opioid_adjusted: limit_times_multiple - opioid_days / 3 if opioid_days >= K('overuse_days_high') else (limit_times_multiple * K('overuse_scale_moderate') if opioid_days > 0 else limit_times_multiple)}
  - {other_drug: '''Ubrelvy'' if drug == ''sumatriptan'' else (''sumatriptan'' if drug == ''Ubrelvy'' else ''none'')'}
  - {other_limit: K('limit_ubrelvy') if other_drug == 'Ubrelvy' else K('limit_sumatriptan')}
  - {other_expiration: 'LATEST(''review_authorizations'', ''expiration_date'', date_field=''effective_date'', event_type=''review_auth_granted'', drug_name=other_drug, authorization_type=''quantity_limit'')'}
  - {other_authorized_qty: 'LATEST(''review_authorizations'', ''approved_quantity_per_30'', date_field=''effective_date'', event_type=''review_auth_granted'', drug_name=other_drug, authorization_type=''quantity_limit'') if (other_expiration != None and other_expiration >= NOW) else 0'}
  - {other_fills: 'XCOUNT(''retail'', ''retail_claims'', within_months=3, date_field=''date_of_service'', drug_name=other_drug, event_type=''retail_claim_paid'')'}
  - {other_drug_adjusted: opioid_adjusted - other_authorized_qty / K('pool_divisor') if other_authorized_qty > other_limit else (opioid_adjusted * K('pool_scale') if (other_authorized_qty > 0 or other_fills >= 1) else opioid_adjusted)}
  - {renewed_basis: 'LATEST(''review_authorizations'', ''auth_basis'', date_field=''effective_date'', event_type=''review_auth_granted'', drug_name=drug, authorization_type=''quantity_limit'')'}
  - {prior_claims_received: 'COUNT(''review_cases'', event_type=''review_case_info_received'', drug_name=drug, criteria_basis=''prior_carrier_approval'')'}
  - {transition_units: K('continuity_units_documented') if (renewed_basis == 'continuity_of_care' and prior_claims_received >= 1) else (K('continuity_units_letter_only') if (renewed_basis == 'continuity_of_care' and prior_claims_received == 0) else 0)}
  - {response_basis: 'LATEST(''review_cases'', ''criteria_basis'', date_field=''event_at'', event_type=''review_case_info_received'', drug_name=drug)'}
  - {response_units: K('response_units_documented') if response_basis == 'documented_response' else (K('response_units_necessity') if response_basis == 'quantity_medically_necessary' else 0)}
  - {cash_denials: 'XCOUNT(''retail'', ''retail_reimbursements'', within_months=6, date_field=''received_date'', drug_name=drug, event_type=''retail_dmr_denied'', decision_reason=''coverage_review_required'')'}
  - {cash_units: K('cash_units_repeat') if cash_denials >= 2 else (K('cash_units_single') if cash_denials == 1 else 0)}
  - {ceiling: int(other_drug_adjusted + transition_units + response_units + cash_units)}
  - {result: 'MN(requested_qty, ceiling)'}
  compute_basis: {drug: The drug is the drug of the member's most recent renewal request, limit: 'sumatriptan''s limit is 9 units and Ubrelvy''s is 16 units per rolling 30 days; Nurtec ODT, whose limit is 8 units', opened_at: 'the request is undecided while no approval, denial or withdrawal for the drug is recorded after its opening', decided_at: 'the request is undecided while no approval, denial or withdrawal for the drug is recorded after its opening', requested_qty: The approved quantity of a quantity limit renewal is fixed only after the records carry an undecided renewal request for the drug., diagnosis: The multiple applied to the limit rests on the most recent clinical information for the drug and the member's paid retail fills of it, chronic: 'a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719)', fills_1m: paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), fills_2m: paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), both_months: paid retail fills reaching the limit both in the last month and in the month before it, multiple: 'a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719) together with paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month) takes the package''s maximum exception multiple; a chronic migraine diagnosis without such fills in both months, or such fills in both months under another diagnosis, takes seven eighths of it; any other member takes three quarters of it.', opioid_days: when the member's paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, limit_times_multiple: The ceiling is the limit times the multiple as worked out for opioid use and then for the other acute migraine drug, opioid_adjusted: 'Concurrent opioid use changes how the ceiling is worked out from the limit times the multiple: when the member''s paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, one unit for each average monthly opioid day (those days supply divided by 3) is subtracted from it, a day of opioid treatment displacing one acute migraine dose; when they add up to between 1 and 29 days supply, it is multiplied by 0.9; when there is no such fill, it is used as it stands.', other_drug: 'The other acute migraine drug (Ubrelvy for a sumatriptan renewal, sumatriptan for a Ubrelvy renewal, none for a Nurtec ODT renewal)', other_limit: with an approved quantity above that drug's limit, other_expiration: a quantity limit authorization for the other drug in force on the decision date, other_authorized_qty: The approval ceiling of a quantity limit renewal is worked out only after the records carry the authorization owed for every appeal overturned on the other acute migraine drug., other_fills: or has at least one paid retail fill of the other drug dated within the last three months, other_drug_adjusted: 'The other acute migraine drug (Ubrelvy for a sumatriptan renewal, sumatriptan for a Ubrelvy renewal, none for a Nurtec ODT renewal) then changes how the ceiling is worked out from the result of the opioid step: when the member holds a quantity limit authorization for the other drug in force on the decision date with an approved quantity above that drug''s limit, one quarter of that approved quantity is subtracted; when the member holds such an authorization at or below that drug''s limit, or has at least one paid retail fill of the other drug dated within the last three months, the result is multiplied by 0.95; otherwise it is used as it stands.', renewed_basis: when the authorization being renewed is a continuity-of-care authorization, prior_claims_received: the prior carrier's claims history for the drug has been received, transition_units: 'A renewal that replaces a continuity-of-care authorization receives a transition allowance: when the authorization being renewed is a continuity-of-care authorization and the prior carrier''s claims history for the drug has been received, 2 units are added; when it is a continuity-of-care authorization without that history, 1 unit is added; any other renewal adds nothing.', response_basis: The most recent clinical information for the drug adds a response allowance, response_units: 'The most recent clinical information for the drug adds a response allowance: clinical information whose ground is documented response to therapy adds 2 units; clinical information whose ground is that the quantity is medically necessary adds 1 unit; any other ground, or no clinical information, adds nothing.', cash_denials: '2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 6 months', cash_units: 'Cash purchases show need beyond the limit: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 6 months, add 2 units; exactly 1 such denial adds 1 unit; none adds nothing.', ceiling: 'The ceiling is the limit times the multiple as worked out for opioid use and then for the other acute migraine drug, plus the transition allowance, plus the response allowance, plus the cash-purchase units, rounded down to a whole unit only at the end.', result: The approved quantity of a quantity limit renewal on an acute migraine drug is the smaller of the quantity the undecided renewal request asks for and the renewal approval ceiling.}
  factors:
  - id: renewal_diagnosis_fill_multiple
    effect: parameter
    decides: multiple
    bindings: [diagnosis, chronic, fills_1m, fills_2m, both_months, multiple]
    ladder:
    - {when: a chronic migraine diagnosis on the most recent clinical information and paid retail fills reaching the limit in both of the last two months, value: P('ql_exception_max_multiple')}
    - {when: 'a chronic migraine diagnosis without such fills in both months, or such fills in both months under another diagnosis', value: P('ql_exception_max_multiple') * K('partial_share')}
    - {when: otherwise, value: P('ql_exception_max_multiple') * K('default_share')}
    baseline: {multiple: P('ql_exception_max_multiple') * K('default_share')}
    evidence: [history, cross_category]
    cross_difficulty: retail
  - id: renewal_opioid_method
    effect: method
    decides: opioid_adjusted
    bindings: [opioid_days, opioid_adjusted]
    ladder:
    - {when: paid oxycodone-acetaminophen retail fills within the last three months add up to 30 or more days supply, method: the average monthly opioid days are subtracted from the limit times the multiple}
    - {when: those fills add up to between 1 and 29 days supply, method: the limit times the multiple is multiplied by 0.9}
    - {when: otherwise, method: the limit times the multiple is used as it stands}
    baseline: {opioid_adjusted: limit_times_multiple}
    evidence: [cross_category, history]
    cross_difficulty: retail
  - id: other_acute_drug_method
    effect: method
    decides: other_drug_adjusted
    bindings: [other_drug, other_limit, other_expiration, other_authorized_qty, other_fills, other_drug_adjusted]
    ladder:
    - {when: a quantity limit authorization for the other acute migraine drug in force with an approved quantity above that drug's limit, method: one quarter of that approved quantity is subtracted}
    - {when: 'such an authorization at or below that drug''s limit, or at least one paid retail fill of the other drug within the last three months', method: the result of the opioid step is multiplied by 0.95}
    - {when: otherwise, method: the result of the opioid step is used as it stands}
    baseline: {other_drug_adjusted: opioid_adjusted}
    evidence: [history, cross_category, date]
    cross_difficulty: retail
  - id: continuity_transition_allowance
    effect: parameter
    decides: transition_units
    bindings: [renewed_basis, prior_claims_received, transition_units]
    ladder:
    - {when: the authorization being renewed is a continuity-of-care authorization and the prior carrier's claims history has been received, value: K('continuity_units_documented')}
    - {when: the authorization being renewed is a continuity-of-care authorization without that history, value: K('continuity_units_letter_only')}
    - {when: otherwise, value: '0'}
    baseline: {transition_units: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: clinical_response_allowance
    effect: parameter
    decides: response_units
    bindings: [response_basis, response_units]
    ladder:
    - {when: the most recent clinical information's ground is documented response to therapy, value: K('response_units_documented')}
    - {when: its ground is that the quantity is medically necessary, value: K('response_units_necessity')}
    - {when: otherwise, value: '0'}
    baseline: {response_units: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: renewal_cash_purchase_units
    effect: parameter
    decides: cash_units
    bindings: [cash_denials, cash_units]
    ladder:
    - {when: '2 or more paper claims for the drug denied because a coverage review was required, dated within the last 6 months', value: K('cash_units_repeat')}
    - {when: exactly 1 such denial within the last 6 months, value: K('cash_units_single')}
    - {when: otherwise, value: '0'}
    baseline: {cash_units: '0'}
    evidence: [cross_category, history]
    cross_difficulty: retail
  inputs:
    history:
    - table: review_cases
      aggregate: latest
      field: requested_quantity_per_30
      filters: {event_type: review_case_opened, is_renewal: true}
    - table: review_authorizations
      aggregate: latest
      field: approved_quantity_per_30
      filters: {event_type: review_auth_granted, authorization_type: quantity_limit}
    - table: review_cases
      aggregate: count
      field: review_case_id
      filters: {event_type: review_case_info_received, criteria_basis: prior_carrier_approval}
    - category: retail
      table: retail_claims
      aggregate: sum
      field: quantity
      within_months: 2
      filters: {event_type: retail_claim_paid}
    - category: retail
      table: retail_claims
      aggregate: sum
      field: days_supply
      within_months: 3
      filters: {event_type: retail_claim_paid, drug_name: oxycodone-acetaminophen}
    - category: retail
      table: retail_reimbursements
      aggregate: count
      field: retail_reimbursement_id
      within_months: 6
      filters: {event_type: retail_dmr_denied, decision_reason: coverage_review_required}
    cross_category: [retail]
- id: review_ext_overturn_quantity
  base_policy_refs: [review_authorization_period, review_continuity_of_care, review_quantity_limit]
  overwrite:
  - {base_policy: review_quantity_limit, superseded_clause: up to ql_exception_max_multiple times that limit per rolling 30 days; a request above that multiple is approved only up to it, replaced_by: The authorization put in force for an overturned quantity limit denial on an acute migraine drug carries the smaller of the quantity the denied request asked for and the overturn ceiling.}
  trigger: state_due
  subject: [review_auth_granted]
  computes: approved_quantity_per_30
  target_tool: grant_overturn_authorization_6da113c2
  params: {overuse_days_high: 30, overuse_scale_moderate: 0.9, triptan_tablets_per_treatment: 2, pool_scale: 0.95, ground_units_new_information: 2, ground_units_criteria_met: 1, level_units_higher: 2, level_units_prescriber: 1, cash_units_repeat: 2, cash_units_single: 1, limit_sumatriptan: 9, limit_nurtec: 8, limit_ubrelvy: 16, partial_share: 0.875, default_share: 0.75}
  rule: 'This rule sets the quantity per rolling 30 days of the authorization put in force when a member''s appeal overturns the denial of a quantity limit exception request on an acute migraine drug (sumatriptan, whose limit is 9 units, Ubrelvy, whose limit is 16 units, or Nurtec ODT, whose limit is 8 units per rolling 30 days); the authorization runs from the overturn date for the package''s quantity limit approval months under the general approval-period rule. The drug and the denied request are those of the member''s most recent overturned appeal of a coverage review denial. Windows of months in this rule end on the date the authorization is put in force: a record dated within the last N months is dated after the same day of the month N months before that date. The authorization put in force for an overturned quantity limit denial on an acute migraine drug carries the smaller of the quantity the denied request asked for and the overturn ceiling. The overturn ceiling is the drug''s limit times three quarters of the package''s maximum exception multiple, rounded down to a whole unit. The multiple applied to the limit rests on the diagnosis on the denied request and on the member''s paid retail fills of the drug: a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719) together with paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month) takes the package''s maximum exception multiple; a chronic migraine diagnosis without such fills in both months, or such fills in both months under another diagnosis, takes seven eighths of it; any other member takes three quarters of it. Concurrent opioid use changes how the ceiling is worked out from the limit times the multiple: when the member''s paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, one unit for each average monthly opioid day (those days supply divided by 3) is subtracted from it, a day of opioid treatment displacing one acute migraine dose; when they add up to between 1 and 29 days supply, it is multiplied by 0.9; when there is no such fill, it is used as it stands. Concurrent triptan treatment then changes how the ceiling of a gepant (Ubrelvy or Nurtec ODT) is worked out from the result of the opioid step: when the drug is a gepant and the member has paid sumatriptan retail fills both in the last month and in the month before it, the average monthly sumatriptan tablets over those two months divided by 2, the tablets of one triptan treatment, are subtracted; when the drug is a gepant and the member has paid sumatriptan fills in exactly one of those two months, the result is multiplied by 0.95; otherwise, and always for a sumatriptan overturn, it is used as it stands. The ground of the overturn adds units: an appeal overturned on new information adds 2 units; one overturned because the criteria were met on appeal adds 1 unit; any other ground adds nothing. The appeal''s path adds units: an overturn at the second level or by external review adds 2 units; a first-level overturn of an appeal filed by the prescriber adds 1 unit; a first-level overturn of an appeal filed by the member or a representative adds nothing. Cash purchases show need beyond the limit: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 3 months, add 2 units; exactly 1 such denial adds 1 unit; none adds nothing. The ceiling is the limit times the multiple as worked out for opioid use and then for triptan treatment, plus the overturn-ground units, plus the appeal-path units, plus the cash-purchase units, rounded down to a whole unit only at the end.'
  baseline:
    rule: The authorization put in force for an overturned quantity limit denial on an acute migraine drug carries the smaller of the quantity the denied request asked for and the overturn ceiling. The overturn ceiling is the drug's limit times three quarters of the package's maximum exception multiple, rounded down to a whole unit.
    params: [default_share, limit_nurtec, limit_sumatriptan, limit_ubrelvy, ql_exception_max_multiple]
  prerequisite: []
  cross_category:
  - category: appeal
    as: history
    reads: [appeal_cases.drug_name, appeal_cases.denied_record_id, appeal_cases.decision_reason, appeal_cases.appeal_level, appeal_cases.requested_by]
    note: The overturned appeal names the drug and the denied request, and its ground and path decide two of the unit factors.
  - category: retail
    as: history
    reads: [retail_claims.quantity, retail_claims.days_supply, retail_claims.date_of_service, retail_reimbursements.decision_reason, retail_reimbursements.received_date]
    note: The multiple reads monthly paid fills of the drug; the opioid and triptan steps read oxycodone-acetaminophen and sumatriptan fills; the cash factor reads paper-claim denials.
  compute:
  - {drug: 'XLATEST(''appeal'', ''appeal_cases'', ''drug_name'', date_field=''event_at'', event_type=''appeal_overturned'', appeal_subject=''coverage_review_denial'')'}
  - {denied_case: 'XLATEST(''appeal'', ''appeal_cases'', ''denied_record_id'', date_field=''event_at'', event_type=''appeal_overturned'', appeal_subject=''coverage_review_denial'')'}
  - {limit: K('limit_ubrelvy') if drug == 'Ubrelvy' else (K('limit_nurtec') if drug == 'Nurtec ODT' else K('limit_sumatriptan'))}
  - {requested_qty: 'SUM(''review_cases'', ''requested_quantity_per_30'', review_case_id=denied_case, event_type=''review_case_opened'')'}
  - {diagnosis: 'LATEST(''review_cases'', ''diagnosis_code'', date_field=''event_at'', review_case_id=denied_case)'}
  - {chronic: diagnosis == 'G43.701' or diagnosis == 'G43.709' or diagnosis == 'G43.711' or diagnosis == 'G43.719'}
  - {fills_1m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=1, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {fills_2m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=2, date_field=''date_of_service'', drug_name=drug, event_type=''retail_claim_paid'')'}
  - {both_months: fills_1m >= limit and fills_2m - fills_1m >= limit}
  - {multiple: P('ql_exception_max_multiple') if (chronic and both_months) else (P('ql_exception_max_multiple') * K('partial_share') if ((chronic and not both_months) or (both_months and not chronic)) else P('ql_exception_max_multiple') * K('default_share'))}
  - {opioid_days: 'XSUM(''retail'', ''retail_claims'', ''days_supply'', within_months=3, date_field=''date_of_service'', drug_name=''oxycodone-acetaminophen'', event_type=''retail_claim_paid'')'}
  - {limit_times_multiple: limit * multiple}
  - {opioid_adjusted: limit_times_multiple - opioid_days / 3 if opioid_days >= K('overuse_days_high') else (limit_times_multiple * K('overuse_scale_moderate') if opioid_days > 0 else limit_times_multiple)}
  - {triptan_1m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=1, date_field=''date_of_service'', drug_name=''sumatriptan'', event_type=''retail_claim_paid'')'}
  - {triptan_2m: 'XSUM(''retail'', ''retail_claims'', ''quantity'', within_months=2, date_field=''date_of_service'', drug_name=''sumatriptan'', event_type=''retail_claim_paid'')'}
  - {triptan_adjusted: opioid_adjusted - triptan_2m / 2 / K('triptan_tablets_per_treatment') if (drug != 'sumatriptan' and triptan_1m > 0 and triptan_2m - triptan_1m > 0) else (opioid_adjusted * K('pool_scale') if (drug != 'sumatriptan' and ((triptan_1m > 0 and triptan_2m - triptan_1m == 0) or (triptan_1m == 0 and triptan_2m - triptan_1m > 0))) else opioid_adjusted)}
  - {overturn_ground: 'XLATEST(''appeal'', ''appeal_cases'', ''decision_reason'', date_field=''event_at'', event_type=''appeal_overturned'', appeal_subject=''coverage_review_denial'')'}
  - {ground_units: K('ground_units_new_information') if overturn_ground == 'new_information' else (K('ground_units_criteria_met') if overturn_ground == 'criteria_met_on_appeal' else 0)}
  - {overturn_level: 'XLATEST(''appeal'', ''appeal_cases'', ''appeal_level'', date_field=''event_at'', event_type=''appeal_overturned'', appeal_subject=''coverage_review_denial'')'}
  - {appeal_filer: 'XLATEST(''appeal'', ''appeal_cases'', ''requested_by'', date_field=''event_at'', event_type=''appeal_filed'', denied_record_id=denied_case)'}
  - {path_units: K('level_units_higher') if (overturn_level == 'level_2' or overturn_level == 'external') else (K('level_units_prescriber') if (overturn_level == 'level_1' and appeal_filer == 'prescriber') else 0)}
  - {cash_denials: 'XCOUNT(''retail'', ''retail_reimbursements'', within_months=3, date_field=''received_date'', drug_name=drug, event_type=''retail_dmr_denied'', decision_reason=''coverage_review_required'')'}
  - {cash_units: K('cash_units_repeat') if cash_denials >= 2 else (K('cash_units_single') if cash_denials == 1 else 0)}
  - {ceiling: int(triptan_adjusted + ground_units + path_units + cash_units)}
  - {result: 'MN(requested_qty, ceiling)'}
  compute_basis: {drug: The drug and the denied request are those of the member's most recent overturned appeal of a coverage review denial., denied_case: The drug and the denied request are those of the member's most recent overturned appeal of a coverage review denial., limit: 'sumatriptan, whose limit is 9 units, Ubrelvy, whose limit is 16 units, or Nurtec ODT, whose limit is 8 units per rolling 30 days', requested_qty: carries the smaller of the quantity the denied request asked for and the overturn ceiling, diagnosis: The multiple applied to the limit rests on the diagnosis on the denied request and on the member's paid retail fills of the drug, chronic: 'a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719)', fills_1m: paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), fills_2m: paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month), both_months: paid retail fills reaching the limit both in the last month and in the month before it, multiple: 'a chronic migraine diagnosis (ICD-10-CM G43.701, G43.709, G43.711 or G43.719) together with paid retail fills reaching the limit both in the last month and in the month before it (fills dated within the last two months but not the last month) takes the package''s maximum exception multiple; a chronic migraine diagnosis without such fills in both months, or such fills in both months under another diagnosis, takes seven eighths of it; any other member takes three quarters of it.', opioid_days: when the member's paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, limit_times_multiple: The ceiling is the limit times the multiple as worked out for opioid use and then for triptan treatment, opioid_adjusted: 'Concurrent opioid use changes how the ceiling is worked out from the limit times the multiple: when the member''s paid oxycodone-acetaminophen retail fills dated within the last three months add up to 30 or more days supply, one unit for each average monthly opioid day (those days supply divided by 3) is subtracted from it, a day of opioid treatment displacing one acute migraine dose; when they add up to between 1 and 29 days supply, it is multiplied by 0.9; when there is no such fill, it is used as it stands.', triptan_1m: when the drug is a gepant and the member has paid sumatriptan retail fills both in the last month and in the month before it, triptan_2m: 'the average monthly sumatriptan tablets over those two months divided by 2, the tablets of one triptan treatment', triptan_adjusted: 'Concurrent triptan treatment then changes how the ceiling of a gepant (Ubrelvy or Nurtec ODT) is worked out from the result of the opioid step: when the drug is a gepant and the member has paid sumatriptan retail fills both in the last month and in the month before it, the average monthly sumatriptan tablets over those two months divided by 2, the tablets of one triptan treatment, are subtracted; when the drug is a gepant and the member has paid sumatriptan fills in exactly one of those two months, the result is multiplied by 0.95; otherwise, and always for a sumatriptan overturn, it is used as it stands.', overturn_ground: The ground of the overturn adds units, ground_units: 'The ground of the overturn adds units: an appeal overturned on new information adds 2 units; one overturned because the criteria were met on appeal adds 1 unit; any other ground adds nothing.', overturn_level: an overturn at the second level or by external review adds 2 units, appeal_filer: a first-level overturn of an appeal filed by the prescriber adds 1 unit, path_units: 'The appeal''s path adds units: an overturn at the second level or by external review adds 2 units; a first-level overturn of an appeal filed by the prescriber adds 1 unit; a first-level overturn of an appeal filed by the member or a representative adds nothing.', cash_denials: '2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 3 months', cash_units: 'Cash purchases show need beyond the limit: 2 or more paper claims for the drug denied because a coverage review was required, with the denial dated within the last 3 months, add 2 units; exactly 1 such denial adds 1 unit; none adds nothing.', ceiling: 'The ceiling is the limit times the multiple as worked out for opioid use and then for triptan treatment, plus the overturn-ground units, plus the appeal-path units, plus the cash-purchase units, rounded down to a whole unit only at the end.', result: The authorization put in force for an overturned quantity limit denial on an acute migraine drug carries the smaller of the quantity the denied request asked for and the overturn ceiling.}
  factors:
  - id: overturn_diagnosis_fill_multiple
    effect: parameter
    decides: multiple
    bindings: [diagnosis, chronic, fills_1m, fills_2m, both_months, multiple]
    ladder:
    - {when: a chronic migraine diagnosis on the denied request and paid retail fills reaching the limit in both of the last two months, value: P('ql_exception_max_multiple')}
    - {when: 'a chronic migraine diagnosis without such fills in both months, or such fills in both months under another diagnosis', value: P('ql_exception_max_multiple') * K('partial_share')}
    - {when: otherwise, value: P('ql_exception_max_multiple') * K('default_share')}
    baseline: {multiple: P('ql_exception_max_multiple') * K('default_share')}
    evidence: [history, cross_category]
    cross_difficulty: retail
  - id: overturn_opioid_method
    effect: method
    decides: opioid_adjusted
    bindings: [opioid_days, opioid_adjusted]
    ladder:
    - {when: paid oxycodone-acetaminophen retail fills within the last three months add up to 30 or more days supply, method: the average monthly opioid days are subtracted from the limit times the multiple}
    - {when: those fills add up to between 1 and 29 days supply, method: the limit times the multiple is multiplied by 0.9}
    - {when: otherwise, method: the limit times the multiple is used as it stands}
    baseline: {opioid_adjusted: limit_times_multiple}
    evidence: [cross_category, history]
    cross_difficulty: retail
  - id: concurrent_triptan_method
    effect: method
    decides: triptan_adjusted
    bindings: [triptan_1m, triptan_2m, triptan_adjusted]
    ladder:
    - {when: a gepant overturn with paid sumatriptan retail fills both in the last month and in the month before it, method: the average monthly sumatriptan tablets over the two months divided by 2 are subtracted}
    - {when: a gepant overturn with paid sumatriptan fills in exactly one of those two months, method: the result of the opioid step is multiplied by 0.95}
    - {when: 'otherwise, including every sumatriptan overturn', method: the result of the opioid step is used as it stands}
    baseline: {triptan_adjusted: opioid_adjusted}
    evidence: [cross_category, history]
    cross_difficulty: retail
  - id: overturn_ground_units
    effect: parameter
    decides: ground_units
    bindings: [overturn_ground, ground_units]
    ladder:
    - {when: the appeal was overturned on new information, value: K('ground_units_new_information')}
    - {when: the appeal was overturned because the criteria were met on appeal, value: K('ground_units_criteria_met')}
    - {when: otherwise, value: '0'}
    baseline: {ground_units: '0'}
    evidence: [cross_category]
    cross_difficulty: null
  - id: appeal_path_units
    effect: parameter
    decides: path_units
    bindings: [overturn_level, appeal_filer, path_units]
    ladder:
    - {when: the overturn came at the second level or by external review, value: K('level_units_higher')}
    - {when: a first-level overturn of an appeal the prescriber filed, value: K('level_units_prescriber')}
    - {when: otherwise, value: '0'}
    baseline: {path_units: '0'}
    evidence: [cross_category]
    cross_difficulty: null
  - id: overturn_cash_units
    effect: parameter
    decides: cash_units
    bindings: [cash_denials, cash_units]
    ladder:
    - {when: '2 or more paper claims for the drug denied because a coverage review was required, dated within the last 3 months', value: K('cash_units_repeat')}
    - {when: exactly 1 such denial within the last 3 months, value: K('cash_units_single')}
    - {when: otherwise, value: '0'}
    baseline: {cash_units: '0'}
    evidence: [cross_category, history]
    cross_difficulty: retail
  inputs:
    history:
    - table: review_cases
      aggregate: sum
      field: requested_quantity_per_30
      filters: {event_type: review_case_opened}
    - category: appeal
      table: appeal_cases
      aggregate: latest
      field: decision_reason
      filters: {event_type: appeal_overturned}
    - category: retail
      table: retail_claims
      aggregate: sum
      field: quantity
      within_months: 2
      filters: {event_type: retail_claim_paid}
    - category: retail
      table: retail_claims
      aggregate: sum
      field: days_supply
      within_months: 3
      filters: {event_type: retail_claim_paid, drug_name: oxycodone-acetaminophen}
    - category: retail
      table: retail_reimbursements
      aggregate: count
      field: retail_reimbursement_id
      within_months: 3
      filters: {event_type: retail_dmr_denied, decision_reason: coverage_review_required}
    cross_category: [appeal, retail]
