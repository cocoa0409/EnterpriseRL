      cross_category: [mail, retail, review]
  - id: formulary_ext_standard_nf_approval_months
    base_policy_refs: [formulary_evt_exception_duration, formulary_evt_exception_timeline, formulary_nonformulary_exception, formulary_tier_exception, formulary_external_exception_review]
    overwrite:
      - base_policy: formulary_evt_exception_duration
        superseded_clause: >-
          A standard approval is effective on the decision date and runs for exception_approval_months calendar months
        replaced_by: >-
          A standard non-formulary exception approval is effective on the decision date and runs for the approval period worked out below, a whole number of calendar months, its expiration date being the day before the same day-of-month that many months later (falling back to the last day of the month when that day does not exist).
    trigger: state_due
    subject: [formulary_exception_approved]
    computes: approval_months
    target_tool: approve_standard_nonformulary_exception_57f550b5
    params:
      plan_year_months: 12
      tail_quarter_months: 3
      tail_half_months: 6
      half_year_months: 6
      first_pa_shortening_months: 6
      first_shortening_months: 3
      recent_alt_denial_months: 3
      recent_other_denial_months: 1
      denial_lookback_months: 12
      trial_lookback_months: 6
      extra_trial_months: 3
      exact_trial_months: 1
      ql_pa_review_months: 2
      ql_review_months: 1
      late_week_days: 7
      late_week_credit_months: 2
      late_credit_months: 1
    rule: >-
      When a standard non-formulary exception request is approved, the length of the approval is worked out from the member's records as follows.
      A standard non-formulary exception approval is effective on the decision date and runs for the approval period worked out below, a whole number of calendar months, its expiration date being the day before the same day-of-month that many months later (falling back to the last day of the month when that day does not exist).
      The standard non-formulary approval period is the formulary's standard approval length in months, and it is never shorter than one month.
      The starting period follows the member's plan year: when no more than the tail-quarter months of the current plan year remain (the plan year's twelve months less the whole months from the plan year start date to the decision date), the starting period is those remaining months plus the plan-year months, so that the approval ends with the next plan year; when more than the tail-quarter months but no more than the tail-half months remain, the starting period is those remaining months plus the half-year months; in every other case the starting period is the formulary's standard approval length.
      A first-approval shortening is applied when the member has never held an approval for the drug: when no approval of an exception for the drug is on record and the drug is on the prior-authorization list of the member's review package, the first-approval prior-authorization shortening is taken off; when no approval is on record and the drug is not on that list, the first-approval shortening is taken off; in every other case nothing is taken off.
      A recent-denial shortening is applied when the drug was refused within the denial lookback (fewer whole months before the decision date than the lookback): when such a denial was recorded for alternatives not tried, the recent alternatives-denial shortening is taken off; when such a denial was recorded for any other reason and none for alternatives not tried, the recent other-denial shortening is taken off; in every other case nothing is taken off.
      A trial credit is added for the formulary alternatives the member has tried: the alternatives tried are the formulary alternatives in the drug's therapeutic class (for an acute-migraine drug, sumatriptan and Nurtec ODT) whose paid retail fills within the trial lookback (fewer whole months before the decision date than the lookback) add up to at least the formulary's minimum trial days supply; when the alternatives tried exceed the formulary's required number of alternatives, the extra-trial credit is added; when they equal the required number, the exact-trial credit is added; in every other case no trial credit is added.
      A quantity-limit review shortening is applied to drugs the member's review package limits: when the drug is on the package's quantity-limit list and also on its prior-authorization list, the quantity-limit prior-authorization shortening is taken off; when it is on the quantity-limit list only, the quantity-limit shortening is taken off; in every other case nothing is taken off.
      A late-decision credit is added when the decision is made after it fell due, the due date being the date of the latest supporting statement for the drug plus the formulary's standard decision hours divided by twenty-four: when the decision date is at least the late-week days after the due date, the late-week credit is added; when it is at least one day but fewer than the late-week days after the due date, the late credit is added; in every other case no late-decision credit is added.
      The order is fixed: the starting period comes first; the first-approval, recent-denial and quantity-limit shortenings are taken off it and the trial and late-decision credits are added to it; only then is the floor of one month applied, and the result is a whole number of months.
    prerequisite: []
    cross_category:
      - category: plan
        as: branch
        reads: [plan_year_start_date]
        note: The plan year start date of the member's plan enrollment decides the starting period.
      - category: review
        as: branch
        reads: [variant_name]
        note: The review package's prior-authorization and quantity-limit lists decide the first-approval and quantity-limit shortenings.
      - category: retail
        as: history
        reads: [retail_claims.days_supply, retail_claims.date_of_service]
        note: Paid retail fills of sumatriptan and Nurtec ODT within the trial lookback decide the trial credit.
    compute:
      - py_start: "CFIELD('plan','plan_year_start_date')"
      - months_left: "K('plan_year_months') - MONTHS(py_start, NOW)"
      - nf_period: "(months_left + K('plan_year_months')) if months_left <= K('tail_quarter_months') else ((months_left + K('half_year_months')) if months_left <= K('tail_half_months') else P('exception_approval_months'))"
      - nf_prior_approvals: "COUNT('formulary_exceptions', event_type='formulary_exception_approved', drug_name='Ubrelvy')"
      - nf_pa_listed: "'Ubrelvy' in CPARAM('review','pa_required_drugs')"
      - first_cut: "K('first_pa_shortening_months') if (nf_prior_approvals == 0 and nf_pa_listed) else (K('first_shortening_months') if (nf_prior_approvals == 0 and not nf_pa_listed) else 0)"
      - denials_alt: "COUNT('formulary_exceptions', within_months=K('denial_lookback_months'), date_field='event_at', event_type='formulary_exception_denied', drug_name='Ubrelvy', decision_reason='alternatives_not_tried')"
      - denials_all: "COUNT('formulary_exceptions', within_months=K('denial_lookback_months'), date_field='event_at', event_type='formulary_exception_denied', drug_name='Ubrelvy')"
      - denial_cut: "K('recent_alt_denial_months') if denials_alt > 0 else (K('recent_other_denial_months') if denials_all > 0 else 0)"
      - suma_days: "XSUM('retail','retail_claims','days_supply', within_months=K('trial_lookback_months'), date_field='date_of_service', event_type='retail_claim_paid', drug_name='sumatriptan')"
      - nurtec_days: "XSUM('retail','retail_claims','days_supply', within_months=K('trial_lookback_months'), date_field='date_of_service', event_type='retail_claim_paid', drug_name='Nurtec ODT')"
      - trials: "(1 if suma_days >= P('alternative_trial_min_days_supply') else 0) + (1 if nurtec_days >= P('alternative_trial_min_days_supply') else 0)"
      - trial_credit: "K('extra_trial_months') if trials > P('nf_exception_alternatives_required') else (K('exact_trial_months') if trials == P('nf_exception_alternatives_required') else 0)"
      - ql_listed: "'Ubrelvy' in CPARAM('review','quantity_limits')"
      - ql_cut: "K('ql_pa_review_months') if (ql_listed and nf_pa_listed) else (K('ql_review_months') if ql_listed else 0)"
      - nf_stmt_at: "LATEST('formulary_exceptions','event_at', date_field='event_at', event_type='formulary_exception_statement_received', drug_name='Ubrelvy')"
      - nf_days_late: "DAYS(nf_stmt_at, NOW) - P('exception_standard_decision_hours') / 24"
      - nf_late_credit: "K('late_week_credit_months') if nf_days_late >= K('late_week_days') else (K('late_credit_months') if nf_days_late >= 1 else 0)"
      - raw_months: "nf_period - first_cut - denial_cut - ql_cut + trial_credit + nf_late_credit"
      - result: "int(MX(1, raw_months))"
    compute_basis:
      py_start: "when no more than the tail-quarter months of the current plan year remain (the plan year's twelve months less the whole months from the plan year start date to the decision date), the starting period is those remaining months plus the plan-year months, so that the approval ends with the next plan year"
      months_left: "when no more than the tail-quarter months of the current plan year remain (the plan year's twelve months less the whole months from the plan year start date to the decision date), the starting period is those remaining months plus the plan-year months, so that the approval ends with the next plan year"
      nf_period: "The starting period follows the member's plan year: when no more than the tail-quarter months of the current plan year remain (the plan year's twelve months less the whole months from the plan year start date to the decision date), the starting period is those remaining months plus the plan-year months, so that the approval ends with the next plan year; when more than the tail-quarter months but no more than the tail-half months remain, the starting period is those remaining months plus the half-year months; in every other case the starting period is the formulary's standard approval length."
      nf_prior_approvals: "when no approval of an exception for the drug is on record and the drug is on the prior-authorization list of the member's review package, the first-approval prior-authorization shortening is taken off"
      nf_pa_listed: "when no approval of an exception for the drug is on record and the drug is on the prior-authorization list of the member's review package, the first-approval prior-authorization shortening is taken off"
      first_cut: "A first-approval shortening is applied when the member has never held an approval for the drug: when no approval of an exception for the drug is on record and the drug is on the prior-authorization list of the member's review package, the first-approval prior-authorization shortening is taken off; when no approval is on record and the drug is not on that list, the first-approval shortening is taken off; in every other case nothing is taken off."
      denials_alt: "when such a denial was recorded for alternatives not tried, the recent alternatives-denial shortening is taken off"
      denials_all: "when such a denial was recorded for any other reason and none for alternatives not tried, the recent other-denial shortening is taken off"
      denial_cut: "A recent-denial shortening is applied when the drug was refused within the denial lookback (fewer whole months before the decision date than the lookback): when such a denial was recorded for alternatives not tried, the recent alternatives-denial shortening is taken off; when such a denial was recorded for any other reason and none for alternatives not tried, the recent other-denial shortening is taken off; in every other case nothing is taken off."
      suma_days: "the alternatives tried are the formulary alternatives in the drug's therapeutic class (for an acute-migraine drug, sumatriptan and Nurtec ODT) whose paid retail fills within the trial lookback (fewer whole months before the decision date than the lookback) add up to at least the formulary's minimum trial days supply"
      nurtec_days: "the alternatives tried are the formulary alternatives in the drug's therapeutic class (for an acute-migraine drug, sumatriptan and Nurtec ODT) whose paid retail fills within the trial lookback (fewer whole months before the decision date than the lookback) add up to at least the formulary's minimum trial days supply"
      trials: "the alternatives tried are the formulary alternatives in the drug's therapeutic class (for an acute-migraine drug, sumatriptan and Nurtec ODT) whose paid retail fills within the trial lookback (fewer whole months before the decision date than the lookback) add up to at least the formulary's minimum trial days supply"
      trial_credit: "A trial credit is added for the formulary alternatives the member has tried: the alternatives tried are the formulary alternatives in the drug's therapeutic class (for an acute-migraine drug, sumatriptan and Nurtec ODT) whose paid retail fills within the trial lookback (fewer whole months before the decision date than the lookback) add up to at least the formulary's minimum trial days supply; when the alternatives tried exceed the formulary's required number of alternatives, the extra-trial credit is added; when they equal the required number, the exact-trial credit is added; in every other case no trial credit is added."
      ql_listed: "when the drug is on the package's quantity-limit list and also on its prior-authorization list, the quantity-limit prior-authorization shortening is taken off"
      ql_cut: "A quantity-limit review shortening is applied to drugs the member's review package limits: when the drug is on the package's quantity-limit list and also on its prior-authorization list, the quantity-limit prior-authorization shortening is taken off; when it is on the quantity-limit list only, the quantity-limit shortening is taken off; in every other case nothing is taken off."
      nf_stmt_at: "A late-decision credit is added when the decision is made after it fell due, the due date being the date of the latest supporting statement for the drug plus the formulary's standard decision hours divided by twenty-four"
      nf_days_late: "A late-decision credit is added when the decision is made after it fell due, the due date being the date of the latest supporting statement for the drug plus the formulary's standard decision hours divided by twenty-four"
      nf_late_credit: "when the decision date is at least the late-week days after the due date, the late-week credit is added; when it is at least one day but fewer than the late-week days after the due date, the late credit is added; in every other case no late-decision credit is added."
      raw_months: "The order is fixed: the starting period comes first; the first-approval, recent-denial and quantity-limit shortenings are taken off it and the trial and late-decision credits are added to it; only then is the floor of one month applied, and the result is a whole number of months."
      result: "The standard non-formulary approval period is the formulary's standard approval length in months, and it is never shorter than one month."
    factors:
      - id: plan_year_starting_period
        effect: method
        decides: nf_period
        bindings: [py_start, months_left, nf_period]
        ladder:
          - when: "no more than the tail-quarter months of the current plan year remain"
            method: "run to the end of the next plan year: remaining months plus the plan-year months"
          - when: "more than the tail-quarter months but no more than the tail-half months remain"
            method: "remaining months plus the half-year months"
          - when: "otherwise"
            method: "the formulary's standard approval length"
        baseline:
          nf_period: "P('exception_approval_months')"
        evidence: [cross_category, date]
        cross_difficulty: plan
      - id: first_approval_shortening
        effect: parameter
        decides: first_cut
        bindings: [nf_prior_approvals, nf_pa_listed, first_cut]
        ladder:
          - when: "no approval of an exception for the drug on record AND the drug is on the review package's prior-authorization list"
            value: "K('first_pa_shortening_months') off"
          - when: "no approval of an exception for the drug on record AND the drug is not on that list"
            value: "K('first_shortening_months') off"
          - when: "otherwise"
            value: "0"
        baseline:
          first_cut: "0"
        evidence: [history, cross_category]
        cross_difficulty: review
      - id: recent_denial_shortening
        effect: parameter
        decides: denial_cut
        bindings: [denials_alt, denials_all, denial_cut]
        ladder:
          - when: "a denial of the drug for alternatives not tried within the denial lookback"
            value: "K('recent_alt_denial_months') off"
          - when: "a denial of the drug for another reason within the lookback, none for alternatives not tried"
            value: "K('recent_other_denial_months') off"
          - when: "otherwise"
            value: "0"
        baseline:
          denial_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: alternative_trial_credit
        effect: parameter
        decides: trial_credit
        bindings: [suma_days, nurtec_days, trials, trial_credit]
        ladder:
          - when: "the alternatives tried exceed the formulary's required number"
            value: "K('extra_trial_months')"
          - when: "the alternatives tried equal the required number"
            value: "K('exact_trial_months')"
          - when: "otherwise"
            value: "0"
        baseline:
          trial_credit: "0"
        evidence: [cross_category, history, tier_param]
        cross_difficulty: retail
      - id: quantity_limit_review_shortening
        effect: parameter
        decides: ql_cut
        bindings: [ql_listed, ql_cut]
        ladder:
          - when: "the drug is on the review package's quantity-limit list AND on its prior-authorization list"
            value: "K('ql_pa_review_months') off"
          - when: "the drug is on the quantity-limit list only"
            value: "K('ql_review_months') off"
          - when: "otherwise"
            value: "0"
        baseline:
          ql_cut: "0"
        evidence: [cross_category]
        cross_difficulty: review
      - id: late_nf_decision_credit
        effect: parameter
        decides: nf_late_credit
        bindings: [nf_stmt_at, nf_days_late, nf_late_credit]
        ladder:
          - when: "decided at least the late-week days after the due date"
            value: "K('late_week_credit_months')"
          - when: "decided at least one day but fewer than the late-week days after the due date"
            value: "K('late_credit_months')"
          - when: "otherwise"
            value: "0"
        baseline:
          nf_late_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard non-formulary approval period is the formulary's standard approval length in months, and it is never shorter than one month.
      params: [exception_approval_months]
    inputs:
      history:
        - {table: formulary_exceptions, aggregate: count, field: formulary_exception_id, within_months: 12, filters: {event_type: formulary_exception_denied, drug_name: Ubrelvy}}
        - {table: formulary_exceptions, aggregate: latest, field: event_at, filters: {event_type: formulary_exception_statement_received, drug_name: Ubrelvy}}
        - {category: retail, table: retail_claims, aggregate: sum, field: days_supply, within_months: 6, filters: {event_type: retail_claim_paid, drug_name: sumatriptan}}
        - {category: retail, table: retail_claims, aggregate: sum, field: days_supply, within_months: 6, filters: {event_type: retail_claim_paid, drug_name: Nurtec ODT}}
      cross_category: [plan, review, retail]
  - id: formulary_ext_tier_approval_months
    base_policy_refs: [formulary_evt_exception_duration, formulary_evt_exception_timeline, formulary_nonformulary_exception, formulary_tier_exception, formulary_external_exception_review]
    overwrite:
      - base_policy: formulary_evt_exception_duration
        superseded_clause: >-
          A standard approval is effective on the decision date and runs for exception_approval_months calendar months
        replaced_by: >-
          A tier exception approval is effective on the decision date and runs for the tier approval period worked out below, a whole number of calendar months, its expiration date being the day before the same day-of-month that many months later (falling back to the last day of the month when that day does not exist).
    trigger: state_due
    subject: [formulary_exception_approved]
    computes: approval_months
    target_tool: approve_tier_exception_8a527f11
    params:
      alignment_min_months: 6
      renewal_cycle_months: 12
      stable_lookback_months: 12
      stable_fill_count: 3
      stable_fill_credit_months: 3
      some_fill_credit_months: 1
      preferred_trial_lookback_months: 12
      repeat_trial_credit_months: 2
      single_trial_credit_months: 1
      contraindication_credit_months: 6
      adverse_effect_credit_months: 3
      tier_late_week_days: 7
      tier_late_week_credit_months: 2
      tier_late_credit_months: 1
    rule: >-
      When a tier exception request decided on the standard timeframe is approved, the length of the approval is worked out from the member's records as follows.
      A tier exception approval's period is fixed only after every non-formulary exception request of the member that fell due earlier than the tier exception request carries a decision on record.
      For this ordering a request falls due at its latest supporting statement plus the formulary's decision hours for the request's priority.
      A tier exception approval is effective on the decision date and runs for the tier approval period worked out below, a whole number of calendar months, its expiration date being the day before the same day-of-month that many months later (falling back to the last day of the month when that day does not exist).
      The standard tier approval period is the formulary's standard approval length in months, and it is never shorter than one month.
      The starting tier period is aligned with the member's other exception approvals so that they come up for renewal together: when an exception approval is in force on the decision date and the latest expiration date among the member's approvals is at least the alignment minimum of whole months after the decision date, the starting tier period is those whole months plus one, so that it ends in the same month; when an approval is in force but its latest expiration is fewer whole months away than the alignment minimum, the starting tier period is those whole months plus one plus the renewal cycle; in every other case the starting tier period is the formulary's standard approval length.
      A stable-use credit is added for members who keep filling the drug by home delivery: when the member's shipped home delivery orders of the drug within the stable lookback (fewer whole months before the decision date than the lookback) number at least the stable fill count, the stable-fill credit is added; when there is at least one such shipment but fewer than that count, the some-fill credit is added; in every other case no stable-use credit is added.
      A preferred-alternative trial credit is added for tries of the lower-tier formulary alternative in the drug's class (for a triple-therapy inhaler, Trelegy Ellipta): when the member has two or more paid retail fills of it within the preferred-trial lookback, the repeat-trial credit is added; when the member has exactly one such fill, the single-trial credit is added; in every other case no trial credit is added.
      A clinical-ground credit follows the ground on the latest supporting statement for the drug: when that statement says the lower-tier alternatives are contraindicated, the contraindication credit is added; when it says they caused an adverse effect, the adverse-effect credit is added; in every other case no clinical-ground credit is added.
      A late tier-decision credit is added when the tier decision is made after it fell due, the due date being the date of the latest supporting statement for the drug plus the formulary's standard decision hours divided by twenty-four: when the decision date is at least the tier late-week days after the due date, the tier late-week credit is added; when it is at least one day but fewer than those days after the due date, the tier late credit is added; in every other case no late tier-decision credit is added.
      The order is fixed: the starting tier period comes first; the stable-use, preferred-alternative trial, clinical-ground and late tier-decision credits are added to it; only then is the floor of one month applied, and the result is a whole number of months.
    prerequisite:
      - problem: formulary_ext_standard_nf_approval_months
        kind: value_input
        gate: tier_period
        form: state
        policy_source: >-
          A tier exception approval's period is fixed only after every non-formulary exception request of the member that fell due earlier than the tier exception request carries a decision on record.
        condition: >-
          formulary_exceptions holds, for every formulary_exception_requested row of exception_type non_formulary_exception whose latest statement plus the decision hours of its own priority fell before the tier request's due time, a formulary_exception_approved, formulary_exception_denied or formulary_exception_withdrawn row with that request as source_exception_id.
        resolved_by: approve_standard_nonformulary_exception_57f550b5
        effect: >-
          Once the earlier-due non-formulary request is decided by approval, that approval is in force and its expiration date enters the alignment, so the starting tier period becomes the whole months to that expiration plus one instead of the formulary's standard approval length.
    cross_category:
      - category: mail
        as: history
        reads: [mail_orders.order_date, mail_orders.event_type]
        note: Shipped home delivery orders of the drug within the stable lookback decide the stable-use credit.
      - category: retail
        as: history
        reads: [retail_claims.date_of_service, retail_claims.event_type]
        note: Paid retail fills of Trelegy Ellipta within the preferred-trial lookback decide the preferred-alternative trial credit.
    compute:
      - appr_count: "COUNT('formulary_exceptions', event_type='formulary_exception_approved')"
      - latest_appr_exp: "LATEST('formulary_exceptions','approval_expiration_date', date_field='approval_expiration_date', event_type='formulary_exception_approved')"
      - appr_in_force: "appr_count > 0 and DAYS(NOW, latest_appr_exp) >= 0"
      - months_to_exp: "MONTHS(NOW, latest_appr_exp) if appr_in_force else 0"
      - tier_period: "(months_to_exp + 1) if (appr_in_force and months_to_exp >= K('alignment_min_months')) else ((months_to_exp + 1 + K('renewal_cycle_months')) if appr_in_force else P('exception_approval_months'))"
      - hd_fills: "XCOUNT('mail','mail_orders', within_months=K('stable_lookback_months'), date_field='order_date', event_type='mail_order_shipped', drug_name='Breztri Aerosphere')"
      - stable_credit: "K('stable_fill_credit_months') if hd_fills >= K('stable_fill_count') else (K('some_fill_credit_months') if hd_fills >= 1 else 0)"
      - pref_fills: "XCOUNT('retail','retail_claims', within_months=K('preferred_trial_lookback_months'), date_field='date_of_service', event_type='retail_claim_paid', drug_name='Trelegy Ellipta')"
      - pref_trial_credit: "K('repeat_trial_credit_months') if pref_fills >= 2 else (K('single_trial_credit_months') if pref_fills == 1 else 0)"
      - tier_ground: "LATEST('formulary_exceptions','statement_basis', date_field='event_at', event_type='formulary_exception_statement_received', drug_name='Breztri Aerosphere')"
      - ground_credit: "K('contraindication_credit_months') if tier_ground == 'alternatives_contraindicated' else (K('adverse_effect_credit_months') if tier_ground == 'alternatives_adverse_effect' else 0)"
      - tier_stmt_at: "LATEST('formulary_exceptions','event_at', date_field='event_at', event_type='formulary_exception_statement_received', drug_name='Breztri Aerosphere')"
      - tier_days_late: "DAYS(tier_stmt_at, NOW) - P('exception_standard_decision_hours') / 24"
      - tier_late_credit: "K('tier_late_week_credit_months') if tier_days_late >= K('tier_late_week_days') else (K('tier_late_credit_months') if tier_days_late >= 1 else 0)"
      - raw_tier_months: "tier_period + stable_credit + pref_trial_credit + ground_credit + tier_late_credit"
      - result: "int(MX(1, raw_tier_months))"
    compute_basis:
      appr_count: "when an exception approval is in force on the decision date and the latest expiration date among the member's approvals is at least the alignment minimum of whole months after the decision date, the starting tier period is those whole months plus one, so that it ends in the same month"
      latest_appr_exp: "when an exception approval is in force on the decision date and the latest expiration date among the member's approvals is at least the alignment minimum of whole months after the decision date, the starting tier period is those whole months plus one, so that it ends in the same month"
      appr_in_force: "when an exception approval is in force on the decision date and the latest expiration date among the member's approvals is at least the alignment minimum of whole months after the decision date, the starting tier period is those whole months plus one, so that it ends in the same month"
      months_to_exp: "when an exception approval is in force on the decision date and the latest expiration date among the member's approvals is at least the alignment minimum of whole months after the decision date, the starting tier period is those whole months plus one, so that it ends in the same month"
      tier_period: "The starting tier period is aligned with the member's other exception approvals so that they come up for renewal together: when an exception approval is in force on the decision date and the latest expiration date among the member's approvals is at least the alignment minimum of whole months after the decision date, the starting tier period is those whole months plus one, so that it ends in the same month; when an approval is in force but its latest expiration is fewer whole months away than the alignment minimum, the starting tier period is those whole months plus one plus the renewal cycle; in every other case the starting tier period is the formulary's standard approval length."
      hd_fills: "when the member's shipped home delivery orders of the drug within the stable lookback (fewer whole months before the decision date than the lookback) number at least the stable fill count, the stable-fill credit is added"
      stable_credit: "A stable-use credit is added for members who keep filling the drug by home delivery: when the member's shipped home delivery orders of the drug within the stable lookback (fewer whole months before the decision date than the lookback) number at least the stable fill count, the stable-fill credit is added; when there is at least one such shipment but fewer than that count, the some-fill credit is added; in every other case no stable-use credit is added."
      pref_fills: "when the member has two or more paid retail fills of it within the preferred-trial lookback, the repeat-trial credit is added"
      pref_trial_credit: "A preferred-alternative trial credit is added for tries of the lower-tier formulary alternative in the drug's class (for a triple-therapy inhaler, Trelegy Ellipta): when the member has two or more paid retail fills of it within the preferred-trial lookback, the repeat-trial credit is added; when the member has exactly one such fill, the single-trial credit is added; in every other case no trial credit is added."
      tier_ground: "A clinical-ground credit follows the ground on the latest supporting statement for the drug"
      ground_credit: "A clinical-ground credit follows the ground on the latest supporting statement for the drug: when that statement says the lower-tier alternatives are contraindicated, the contraindication credit is added; when it says they caused an adverse effect, the adverse-effect credit is added; in every other case no clinical-ground credit is added."
      tier_stmt_at: "A late tier-decision credit is added when the tier decision is made after it fell due, the due date being the date of the latest supporting statement for the drug plus the formulary's standard decision hours divided by twenty-four"
      tier_days_late: "A late tier-decision credit is added when the tier decision is made after it fell due, the due date being the date of the latest supporting statement for the drug plus the formulary's standard decision hours divided by twenty-four"
      tier_late_credit: "when the decision date is at least the tier late-week days after the due date, the tier late-week credit is added; when it is at least one day but fewer than those days after the due date, the tier late credit is added; in every other case no late tier-decision credit is added."
      raw_tier_months: "The order is fixed: the starting tier period comes first; the stable-use, preferred-alternative trial, clinical-ground and late tier-decision credits are added to it; only then is the floor of one month applied, and the result is a whole number of months."
      result: "The standard tier approval period is the formulary's standard approval length in months, and it is never shorter than one month."
    factors:
