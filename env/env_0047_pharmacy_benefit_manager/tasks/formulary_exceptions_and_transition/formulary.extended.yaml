        effect: method
        decides: tier_period
        bindings: [appr_count, latest_appr_exp, appr_in_force, months_to_exp, tier_period]
        ladder:
          - when: "an exception approval is in force AND the latest approval expiration is at least the alignment minimum of whole months away"
            method: "end in the same month as that approval: whole months to its expiration plus one"
          - when: "an exception approval is in force AND its latest expiration is fewer whole months away than the alignment minimum"
            method: "whole months to that expiration plus one plus the renewal cycle"
          - when: "otherwise"
