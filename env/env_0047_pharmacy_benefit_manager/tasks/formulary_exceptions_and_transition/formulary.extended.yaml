      ts_rt_days: "when the records carry a retail transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that retail supply's last day (its days supply less the days from its fill date to the handling date), rounded down to whole dose cycles"
      ts_rt_date: "when the records carry a retail transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that retail supply's last day (its days supply less the days from its fill date to the handling date), rounded down to whole dose cycles"
      ts_sp2_n: "when no such retail supply is running but the records carry a specialty transition supply of another drug dated inside the window that is still running, the starting length is the days through that specialty supply's last day, rounded down to whole dose cycles in the same way"
      ts_sp2_days: "when no such retail supply is running but the records carry a specialty transition supply of another drug dated inside the window that is still running, the starting length is the days through that specialty supply's last day, rounded down to whole dose cycles in the same way"
      ts_sp2_date: "when no such retail supply is running but the records carry a specialty transition supply of another drug dated inside the window that is still running, the starting length is the days through that specialty supply's last day, rounded down to whole dose cycles in the same way"
      rt_run: "when the records carry a retail transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that retail supply's last day (its days supply less the days from its fill date to the handling date), rounded down to whole dose cycles"
      sp2_run: "when no such retail supply is running but the records carry a specialty transition supply of another drug dated inside the window that is still running, the starting length is the days through that specialty supply's last day, rounded down to whole dose cycles in the same way"
      hd_sync_len: "The starting length of a home-delivery transition supply is set in whole dose cycles against the member's other transition supplies: when the records carry a retail transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that retail supply's last day (its days supply less the days from its fill date to the handling date), rounded down to whole dose cycles; when no such retail supply is running but the records carry a specialty transition supply of another drug dated inside the window that is still running, the starting length is the days through that specialty supply's last day, rounded down to whole dose cycles in the same way; in every other case the starting length is the formulary's maximum days supply for one transition fill."
      req_n: "when the records carry more exception requests for the drug than decisions and withdrawals on them and the latest request is expedited, the expedited pending extension is added"
      dec_n: "when the records carry more exception requests for the drug than decisions and withdrawals on them and the latest request is expedited, the expedited pending extension is added"
      req_prio: "when they carry such an undecided request and the latest request is standard, the standard pending extension is added"
      pending_ext: "A pending-request extension is added while an exception request for the drug awaits its decision: when the records carry more exception requests for the drug than decisions and withdrawals on them and the latest request is expedited, the expedited pending extension is added; when they carry such an undecided request and the latest request is standard, the standard pending extension is added; in every other case no pending-request extension is added."
      mo_left: "when that order has days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date) and the share of it already elapsed has reached the home delivery program's refill eligibility fraction, only the whole dose cycles still on hand are deducted (the days not yet elapsed divided by the dose-cycle length, rounded down to a whole number and multiplied by that length)"
      refill_frac: "when that order has days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date) and the share of it already elapsed has reached the home delivery program's refill eligibility fraction, only the whole dose cycles still on hand are deducted (the days not yet elapsed divided by the dose-cycle length, rounded down to a whole number and multiplied by that length)"
      hd_onhand: "Supply of the drug still on hand from the member's latest shipped home delivery order is deducted: when that order has days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date) and the share of it already elapsed has reached the home delivery program's refill eligibility fraction, only the whole dose cycles still on hand are deducted (the days not yet elapsed divided by the dose-cycle length, rounded down to a whole number and multiplied by that length); when it has days not yet elapsed but the share already elapsed is below that fraction, all the days not yet elapsed are deducted; in every other case nothing is deducted for it."
      mo_method: "when the member's latest shipped home delivery order of the drug went by cold-chain shipping, the standard shipping time of the member's home delivery program in business days is added"
      ship_allow: "A shipping allowance is added for the time the shipment takes: when the member's latest shipped home delivery order of the drug went by cold-chain shipping, the standard shipping time of the member's home delivery program in business days is added; when it went by standard shipping, the standard-shipping allowance is added; in every other case no shipping allowance is added."
      mo_strength: "when the home delivery pharmacy received a prescription for the drug after the latest shipped order at a strength different from that order's, the program's new-prescription processing time in business days is added"
      rx_recv: "when the home delivery pharmacy received a prescription for the drug after the latest shipped order at a strength different from that order's, the program's new-prescription processing time in business days is added"
      rx_strength: "when the home delivery pharmacy received a prescription for the drug after the latest shipped order at a strength different from that order's, the program's new-prescription processing time in business days is added"
      proc_allow: "A prescription processing allowance is added for the time the home delivery pharmacy needs before it ships: when the home delivery pharmacy received a prescription for the drug after the latest shipped order at a strength different from that order's, the program's new-prescription processing time in business days is added; when no such new-strength prescription is on file but the drug has a prescription on file at the home delivery pharmacy, the program's refill processing time in business days is added; in every other case no processing allowance is added."
      raw_days: "The order is fixed: the starting length comes first; the pending-request extension, the shipping allowance and the processing allowance are added to it and the home-delivery on-hand deduction is subtracted from it; only then are the floor of zero and the cap of the formulary's maximum days supply for one transition fill applied, and the result is taken as a whole number of days."
      result: "The standard home-delivery transition supply runs for the formulary's maximum days supply for one transition fill, never less than zero and never more than that maximum."
    factors:
      - id: home_delivery_cycle_alignment
        effect: method
        decides: hd_sync_len
        bindings: [ts_rt_n, ts_rt_days, ts_rt_date, ts_sp2_n, ts_sp2_days, ts_sp2_date, rt_run, sp2_run, hd_sync_len]
        ladder:
          - when: "a retail transition supply of another drug dated inside the current window is still running on the handling date"
            method: "start from the days through that retail supply's last day, rounded down to whole dose cycles"
          - when: "no retail transition supply is running AND a specialty transition supply of another drug dated inside the window is still running"
            method: "start from the days through that specialty supply's last day, rounded down to whole dose cycles"
          - when: "otherwise"
            method: "start from the formulary's maximum days supply for one transition fill"
        baseline:
          hd_sync_len: "P('transition_fill_days_supply')"
        evidence: [history, date]
        cross_difficulty: null
      - id: pending_request_extension
        effect: parameter
        decides: pending_ext
        bindings: [req_n, dec_n, req_prio, pending_ext]
        ladder:
          - when: "an exception request for the drug is undecided (more requests than decisions and withdrawals) AND the latest request is expedited"
            value: "K('pending_expedited_extension_days')"
          - when: "an exception request for the drug is undecided AND the latest request is standard"
            value: "K('pending_standard_extension_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          pending_ext: "0"
        evidence: [history]
        cross_difficulty: null
      - id: home_delivery_onhand_deduction
        effect: method
        decides: hd_onhand
        bindings: [mo_left, refill_frac, hd_onhand]
        ladder:
          - when: "the latest shipped order has days not yet elapsed AND the share elapsed has reached the program's refill eligibility fraction"
            method: "deduct only the whole dose cycles still on hand"
          - when: "the latest shipped order has days not yet elapsed AND the share elapsed is below that fraction"
            method: "deduct all the days not yet elapsed"
          - when: "otherwise"
            method: "deduct nothing"
        baseline:
          hd_onhand: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: mail
      - id: home_delivery_shipping_allowance
        effect: parameter
        decides: ship_allow
        bindings: [mo_method, ship_allow]
        ladder:
          - when: "the latest shipped order of the drug went by cold-chain shipping"
            value: "CPARAM('mail','standard_shipping_business_days')"
          - when: "the latest shipped order went by standard shipping"
            value: "K('standard_ship_allowance_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          ship_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: mail
      - id: prescription_processing_allowance
        effect: parameter
        decides: proc_allow
        bindings: [mo_strength, rx_recv, rx_strength, proc_allow]
        ladder:
          - when: "a prescription for the drug was received after the latest shipped order AND its strength differs from that order's"
            value: "CPARAM('mail','new_rx_processing_business_days')"
          - when: "no such new-strength prescription AND the drug has a prescription on file at the home delivery pharmacy"
            value: "CPARAM('mail','refill_processing_business_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          proc_allow: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: mail
