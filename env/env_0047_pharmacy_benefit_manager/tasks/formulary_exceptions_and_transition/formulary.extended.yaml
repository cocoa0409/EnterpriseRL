  - id: formulary_ext_expedited_approval_days
    base_policy_refs: [formulary_evt_exception_duration, formulary_evt_exception_timeline, formulary_nonformulary_exception, formulary_tier_exception, formulary_external_exception_review]
    overwrite:
      - base_policy: formulary_evt_exception_duration
        superseded_clause: >-
          an expedited approval runs expedited_exception_duration_days calendar days with the decision date as day 1
        replaced_by: >-
          An expedited approval is effective on the decision date and runs for the exigency period worked out below, counted in calendar days with the decision date as day 1.
    trigger: state_due
    subject: [formulary_exception_approved]
    computes: approval_days
    target_tool: approve_expedited_exception_8cc2ac55
    params:
      bridge_expedited_review_days: 2
      bridge_standard_review_days: 4
      late_cap_days: 3
      concurrent_route_days: 2
      established_lookback_months: 12
      established_fill_count: 6
      established_credit_days: 5
      returning_credit_days: 2
      recent_approval_months: 3
      recent_approval_credit_days: 5
      older_approval_credit_days: 2
    rule: >-
      When an expedited exception request is approved, the length of the exigency approval is worked out from the member's records as follows.
      An expedited approval's period is fixed only after the member has said whether they want an independent review of every earlier denial of the same drug.
      An expedited approval is not recorded until every tier exception request of the member whose decision fell due earlier than the expedited request carries a decision on record.
      An expedited approval is not recorded until every standard non-formulary exception request of the member whose decision fell due earlier than the expedited request carries a decision on record.
      For the expedited queue a request falls due at its latest supporting statement plus the formulary's standard or expedited decision hours, according to the request's priority.
      An expedited approval is effective on the decision date and runs for the exigency period worked out below, counted in calendar days with the decision date as day 1.
      The standard exigency period is the formulary's expedited approval length in calendar days, and it is never shorter than one day.
      A review bridge is added while an independent review of an earlier denial of the drug is pending, so that coverage does not lapse before the reviewer decides: when the records carry more external review requests for the drug than external review decisions and the latest request is expedited, the expedited-review bridge is added; when such a review is pending and the latest request is standard, the standard-review bridge is added; in every other case no review bridge is added.
      Supply still on hand from the member's latest shipped specialty fill of the drug is added so that the exigency period starts counting covered fills only once it is used up: when that fill went to the member's home, its days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are added; when it went to the prescriber's office, only whole weeks of those days (rounded down) are added; in every other case nothing is added.
      A late-decision allowance is added when the expedited decision is made after it fell due, the due date being the date of the latest expedited supporting statement for the drug plus the formulary's expedited decision hours divided by twenty-four: when the decision date is at least the late cap of days after the due date, the late cap is added; when it is at least one day but fewer than the late cap of days after the due date, those days late are added; in every other case no late-decision allowance is added.
      An appeal-route allowance is added according to how the member's appeal program handles an urgent dispute: when the appeal program offers external review and lets an expedited external review run alongside the internal appeal, the concurrent-route allowance is added; when it offers external review but only after the internal appeal, the program's urgent internal appeal hours divided by twenty-four are added; in every other case no appeal-route allowance is added.
      An established-therapy credit is added for members already being supplied the drug by the specialty pharmacy: when the member's shipped specialty fills of the drug within the established lookback (fewer whole months before the handling date than the lookback) number at least the established fill count, the established credit is added; when there is at least one such fill but fewer than that count, the returning credit is added; in every other case no established-therapy credit is added.
      A continuation credit is added for members whose earlier exception approval for the drug has run out: when an approval of an exception for the drug is on record and its latest expiration date has passed fewer than the recent-approval months (whole months) before the handling date, the recent-approval credit is added; when such an approval is on record and its latest expiration passed longer ago, the older-approval credit is added; in every other case no continuation credit is added.
      The order is fixed: the standard exigency period comes first; the review bridge, the on-hand supply, the late-decision allowance, the appeal-route allowance, the established-therapy credit and the continuation credit are added to it; only then is the floor of one day applied, and the result is a whole number of days.
    prerequisite:
      - problem: formulary_ext_external_review_priority
        kind: value_input
        gate: review_bridge
        form: action
        policy_source: >-
          An expedited approval's period is fixed only after the member has said whether they want an independent review of every earlier denial of the same drug.
        fallback_reason: >-
          The depended-on step is the member's own election. When the member asks for review it leaves an external review request on record, but when the member declines nothing is recorded, so no record-visible state separates a member who declined from a member who was never asked; the period can only wait on the member having made the election.
        condition: >-
          For every formulary_exception_denied row on the drug that the member elects to take to independent review, formulary_exceptions holds a formulary_external_review_requested row with that denied request as source_exception_id; for a denial the member declines to take to review, nothing is recorded.
        resolved_by: request_external_exception_review_e71b5dce
        effect: >-
          Once the member's external review request is on record and undecided, the review bridge becomes the expedited-review or the standard-review bridge according to its priority, instead of nothing.
      - problem: formulary_ext_tier_approval_months
        kind: state_gate
        gate: formulary_exceptions.event_type
        form: state
        policy_source: >-
          An expedited approval is not recorded until every tier exception request of the member whose decision fell due earlier than the expedited request carries a decision on record.
        condition: >-
          Every formulary_exception_requested row of exception_type tier_exception whose latest statement plus the decision hours of its own priority fell before the expedited request's due time has a formulary_exception_approved, formulary_exception_denied or formulary_exception_withdrawn row with it as source_exception_id.
        resolved_by: approve_tier_exception_8a527f11
        effect: >-
          Once the earlier-due tier exception request carries its approval, the queue condition of the expedited approval holds and it may be recorded.
      - problem: formulary_ext_standard_nf_approval_months
        kind: state_gate
        gate: formulary_exceptions.event_type
        form: state
        policy_source: >-
          An expedited approval is not recorded until every standard non-formulary exception request of the member whose decision fell due earlier than the expedited request carries a decision on record.
        condition: >-
          Every formulary_exception_requested row of exception_type non_formulary_exception with review_priority standard whose latest statement plus the decision hours of its own priority fell before the expedited request's due time has a formulary_exception_approved, formulary_exception_denied or formulary_exception_withdrawn row with it as source_exception_id.
        resolved_by: approve_standard_nonformulary_exception_57f550b5
        effect: >-
          Once the earlier-due standard non-formulary request carries its approval, the queue condition of the expedited approval holds and it may be recorded.
    cross_category:
      - category: specialty
        as: history
        reads: [specialty_fills.days_supply, specialty_fills.ship_date, specialty_fills.delivery_location, specialty_fills.event_type]
        note: The latest shipped specialty fill sets the on-hand supply and the count of shipped fills in the established lookback sets the established-therapy credit.
      - category: appeal
        as: branch
        reads: [variant_name]
        note: The appeal program's external review availability, concurrency and urgent appeal hours decide the appeal-route allowance.
    compute:
      - xr_req_n: "COUNT('formulary_exceptions', event_type='formulary_external_review_requested', drug_name='Rinvoq')"
      - xr_dec_n: "COUNT('formulary_exceptions', event_type='formulary_external_review_decided', drug_name='Rinvoq')"
      - xr_prio: "LATEST('formulary_exceptions','review_priority', date_field='event_at', event_type='formulary_external_review_requested', drug_name='Rinvoq')"
      - review_bridge: "K('bridge_expedited_review_days') if (xr_req_n > xr_dec_n and xr_prio == 'expedited') else (K('bridge_standard_review_days') if (xr_req_n > xr_dec_n and xr_prio == 'standard') else 0)"
      - ex_days: "XLATEST('specialty','specialty_fills','days_supply', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Rinvoq')"
      - ex_ship: "XLATEST('specialty','specialty_fills','ship_date', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Rinvoq')"
      - ex_loc: "XLATEST('specialty','specialty_fills','delivery_location', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Rinvoq')"
      - ex_left: "MX(0, ex_days - DAYS(ex_ship, NOW))"
      - onhand_add: "ex_left if ex_loc == 'home' else (int(ex_left / 7) * 7 if ex_loc == 'prescriber_office' else 0)"
      - ex_stmt_at: "LATEST('formulary_exceptions','event_at', date_field='event_at', event_type='formulary_exception_statement_received', drug_name='Rinvoq', review_priority='expedited')"
      - ex_days_late: "DAYS(ex_stmt_at, NOW) - P('exception_expedited_decision_hours') / 24"
      - late_allow: "K('late_cap_days') if ex_days_late >= K('late_cap_days') else (ex_days_late if ex_days_late >= 1 else 0)"
      - ap_ext: "CPARAM('appeal','external_review_available')"
      - ap_concurrent: "CPARAM('appeal','expedited_external_concurrent_with_internal')"
      - ap_urgent_h: "CPARAM('appeal','urgent_decision_hours')"
      - route_allow: "K('concurrent_route_days') if (ap_ext == True and ap_concurrent == True) else (ap_urgent_h / 24 if (ap_ext == True and ap_concurrent == False) else 0)"
      - est_fills: "XCOUNT('specialty','specialty_fills', within_months=K('established_lookback_months'), date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Rinvoq')"
      - est_credit: "K('established_credit_days') if est_fills >= K('established_fill_count') else (K('returning_credit_days') if est_fills >= 1 else 0)"
      - prev_appr_n: "COUNT('formulary_exceptions', event_type='formulary_exception_approved', drug_name='Rinvoq')"
      - prev_appr_exp: "LATEST('formulary_exceptions','approval_expiration_date', date_field='approval_expiration_date', event_type='formulary_exception_approved', drug_name='Rinvoq')"
      - cont_credit: "K('recent_approval_credit_days') if (prev_appr_n > 0 and DAYS(prev_appr_exp, NOW) > 0 and MONTHS(prev_appr_exp, NOW) < K('recent_approval_months')) else (K('older_approval_credit_days') if (prev_appr_n > 0 and DAYS(prev_appr_exp, NOW) > 0) else 0)"
      - raw_exigency: "P('expedited_exception_duration_days') + review_bridge + onhand_add + late_allow + route_allow + est_credit + cont_credit"
      - result: "int(MX(1, raw_exigency))"
    compute_basis:
      xr_req_n: "when the records carry more external review requests for the drug than external review decisions and the latest request is expedited, the expedited-review bridge is added"
      xr_dec_n: "when the records carry more external review requests for the drug than external review decisions and the latest request is expedited, the expedited-review bridge is added"
      xr_prio: "when such a review is pending and the latest request is standard, the standard-review bridge is added"
      review_bridge: "A review bridge is added while an independent review of an earlier denial of the drug is pending, so that coverage does not lapse before the reviewer decides: when the records carry more external review requests for the drug than external review decisions and the latest request is expedited, the expedited-review bridge is added; when such a review is pending and the latest request is standard, the standard-review bridge is added; in every other case no review bridge is added."
      ex_days: "when that fill went to the member's home, its days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are added"
      ex_ship: "when that fill went to the member's home, its days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are added"
      ex_loc: "when it went to the prescriber's office, only whole weeks of those days (rounded down) are added"
      ex_left: "when that fill went to the member's home, its days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are added"
      onhand_add: "Supply still on hand from the member's latest shipped specialty fill of the drug is added so that the exigency period starts counting covered fills only once it is used up: when that fill went to the member's home, its days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are added; when it went to the prescriber's office, only whole weeks of those days (rounded down) are added; in every other case nothing is added."
      ex_stmt_at: "A late-decision allowance is added when the expedited decision is made after it fell due, the due date being the date of the latest expedited supporting statement for the drug plus the formulary's expedited decision hours divided by twenty-four"
      ex_days_late: "A late-decision allowance is added when the expedited decision is made after it fell due, the due date being the date of the latest expedited supporting statement for the drug plus the formulary's expedited decision hours divided by twenty-four"
      late_allow: "when the decision date is at least the late cap of days after the due date, the late cap is added; when it is at least one day but fewer than the late cap of days after the due date, those days late are added; in every other case no late-decision allowance is added."
      ap_ext: "when the appeal program offers external review and lets an expedited external review run alongside the internal appeal, the concurrent-route allowance is added"
      ap_concurrent: "when the appeal program offers external review and lets an expedited external review run alongside the internal appeal, the concurrent-route allowance is added"
      ap_urgent_h: "when it offers external review but only after the internal appeal, the program's urgent internal appeal hours divided by twenty-four are added"
      route_allow: "An appeal-route allowance is added according to how the member's appeal program handles an urgent dispute: when the appeal program offers external review and lets an expedited external review run alongside the internal appeal, the concurrent-route allowance is added; when it offers external review but only after the internal appeal, the program's urgent internal appeal hours divided by twenty-four are added; in every other case no appeal-route allowance is added."
      est_fills: "when the member's shipped specialty fills of the drug within the established lookback (fewer whole months before the handling date than the lookback) number at least the established fill count, the established credit is added"
      est_credit: "An established-therapy credit is added for members already being supplied the drug by the specialty pharmacy: when the member's shipped specialty fills of the drug within the established lookback (fewer whole months before the handling date than the lookback) number at least the established fill count, the established credit is added; when there is at least one such fill but fewer than that count, the returning credit is added; in every other case no established-therapy credit is added."
      prev_appr_n: "when an approval of an exception for the drug is on record and its latest expiration date has passed fewer than the recent-approval months (whole months) before the handling date, the recent-approval credit is added"
      prev_appr_exp: "when an approval of an exception for the drug is on record and its latest expiration date has passed fewer than the recent-approval months (whole months) before the handling date, the recent-approval credit is added"
      cont_credit: "A continuation credit is added for members whose earlier exception approval for the drug has run out: when an approval of an exception for the drug is on record and its latest expiration date has passed fewer than the recent-approval months (whole months) before the handling date, the recent-approval credit is added; when such an approval is on record and its latest expiration passed longer ago, the older-approval credit is added; in every other case no continuation credit is added."
      raw_exigency: "The order is fixed: the standard exigency period comes first; the review bridge, the on-hand supply, the late-decision allowance, the appeal-route allowance, the established-therapy credit and the continuation credit are added to it; only then is the floor of one day applied, and the result is a whole number of days."
      result: "The standard exigency period is the formulary's expedited approval length in calendar days, and it is never shorter than one day."
    factors:
      - id: pending_review_bridge
        effect: parameter
        decides: review_bridge
        bindings: [xr_req_n, xr_dec_n, xr_prio, review_bridge]
        ladder:
          - when: "an external review of the drug is pending (more review requests than review decisions) AND the latest request is expedited"
            value: "K('bridge_expedited_review_days')"
          - when: "such a review is pending AND the latest request is standard"
            value: "K('bridge_standard_review_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          review_bridge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: exigency_onhand_supply
        effect: method
        decides: onhand_add
        bindings: [ex_days, ex_ship, ex_loc, ex_left, onhand_add]
        ladder:
          - when: "the latest shipped specialty fill went to the member's home"
            method: "add its days not yet elapsed on the handling date"
          - when: "the latest shipped specialty fill went to the prescriber's office"
            method: "add only whole weeks of its days not yet elapsed (rounded down)"
          - when: "otherwise"
            method: "add nothing"
        baseline:
          onhand_add: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: specialty
      - id: late_expedited_decision_allowance
        effect: parameter
        decides: late_allow
        bindings: [ex_stmt_at, ex_days_late, late_allow]
        ladder:
          - when: "decided at least the late cap of days after the due date"
            value: "K('late_cap_days')"
          - when: "decided at least one day but fewer than the late cap of days after the due date"
            value: "the whole days late"
          - when: "otherwise"
            value: "0"
        baseline:
          late_allow: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: appeal_route_allowance
        effect: parameter
        decides: route_allow
        bindings: [ap_ext, ap_concurrent, ap_urgent_h, route_allow]
        ladder:
          - when: "the appeal program offers external review AND lets an expedited external review run alongside the internal appeal"
            value: "K('concurrent_route_days')"
          - when: "the appeal program offers external review AND only after the internal appeal"
            value: "CPARAM('appeal','urgent_decision_hours') / 24"
          - when: "otherwise"
            value: "0"
        baseline:
          route_allow: "0"
        evidence: [cross_category]
        cross_difficulty: appeal
      - id: established_therapy_credit
        effect: parameter
        decides: est_credit
        bindings: [est_fills, est_credit]
        ladder:
          - when: "shipped specialty fills of the drug within the established lookback number at least the established fill count"
            value: "K('established_credit_days')"
          - when: "at least one such fill but fewer than that count"
            value: "K('returning_credit_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          est_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: specialty
      - id: continuation_credit
        effect: parameter
        decides: cont_credit
        bindings: [prev_appr_n, prev_appr_exp, cont_credit]
        ladder:
          - when: "an earlier approval for the drug is on record AND its latest expiration passed fewer than the recent-approval months ago"
            value: "K('recent_approval_credit_days')"
          - when: "an earlier approval for the drug is on record AND its latest expiration passed longer ago"
            value: "K('older_approval_credit_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          cont_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard exigency period is the formulary's expedited approval length in calendar days, and it is never shorter than one day.
      params: [expedited_exception_duration_days]
    inputs:
      history:
        - {table: formulary_exceptions, aggregate: count, field: formulary_exception_id, filters: {event_type: formulary_external_review_requested, drug_name: Rinvoq}}
        - {table: formulary_exceptions, aggregate: latest, field: approval_expiration_date, filters: {event_type: formulary_exception_approved, drug_name: Rinvoq}}
        - {category: specialty, table: specialty_fills, aggregate: count, field: specialty_fill_id, within_months: 12, filters: {event_type: specialty_fill_shipped, drug_name: Rinvoq}}
      cross_category: [specialty, appeal]
