  - id: formulary_ext_external_review_priority
    base_policy_refs: [formulary_external_exception_review]
    overwrite: []
    trigger: on_request
    subject: [formulary_external_review_requested]
    computes: review_priority
    target_tool: request_external_exception_review_e71b5dce
    params:
      review_reship_lookback_months: 6
      temperature_reserve_days: 2
      missed_delivery_reserve_days: 1
      pa_renewal_window_days: 30
      retail_pickup_review_days: 1
    rule: >-
      When a member asks for an independent external review of a denied exception, the review's priority is set from the member's records by comparing the days of the drug the member has left with the days a standard independent review would take, as follows.
      The days of the drug left are the days supply of the member's latest shipped specialty fill of the drug less the days from its ship date to the handling date.
      The days a standard independent review takes are the formulary's standard external review hours divided by twenty-four.
      An external exception review is expedited when the days of the drug left are fewer than the days a standard independent review takes, and standard otherwise.
      A delivery-failure reserve is taken off the days of the drug left: when a replacement shipment of the drug was sent within the review reship lookback (fewer whole months before the handling date than the lookback) because of a temperature excursion, the temperature reserve is taken off; when no such replacement was sent for a temperature excursion but one was sent within the lookback because of a missed delivery, the missed-delivery reserve is taken off; in every other case nothing is taken off.
      A prior-authorization wait is added to the days of a standard independent review when the drug also needs prior authorization: when the drug is on the prior-authorization list of the member's review package and no prior authorization for it is in force on the handling date, the package's urgent decision hours divided by twenty-four are added; when it is on that list and the prior authorization in force expires within the prior-authorization renewal window (no more days after the handling date than that window), the package's standard decision hours divided by twenty-four are added; in every other case no prior-authorization wait is added.
      An effectuation wait is added for carrying out an overturned decision under the member's appeal program: when the appeal program offers external review and sets external effectuation hours, those hours divided by twenty-four are added; when the appeal program offers no external review, its internal effectuation hours divided by twenty-four are added; in every other case no effectuation wait is added.
      The ready day, by which the drug could reach the member, is reckoned on the dispensing pharmacy's own calendar: every wait above is a number of calendar days counted from the handling date, as the independent reviewer's, the review package's and the appeal program's hours define them, and their sum fixes the ready day; when the latest shipped fill was dispensed by Northbridge Specialty Pharmacy, which ships only Monday through Friday, a ready day that falls on a Saturday or a Sunday is moved to the following Monday and the specialty program's delivery scheduling lead, which is counted in business days, is then counted forward from that day over Mondays through Fridays only; when the latest shipped fill was dispensed by a retail pharmacy, a ready day that falls on a Sunday is moved to the following Monday and the retail pickup wait is added; in every other case the ready day is taken as it falls.
      The comparison is made only after the prior-authorization and effectuation waits have been added to the days of a standard independent review, the ready day has been placed on the dispensing pharmacy's calendar and the reserve has been taken off the days of the drug left; a review whose days left, after the reserve, are fewer than the days from the handling date to that day is expedited, and any other review is standard.
    prerequisite: []
    cross_category:
      - category: specialty
        as: history
        reads: [specialty_fills.days_supply, specialty_fills.ship_date, specialty_fills.dispensing_pharmacy, specialty_fills.reship_reason, variant_name]
        note: The latest shipped fill sets the days left and the dispensing pharmacy's calendar; reshipments set the delivery-failure reserve; the program's scheduling lead enters the counted wait.
      - category: review
        as: branch
        reads: [variant_name, review_authorizations.expiration_date]
        note: The package's prior-authorization list and decision hours and the member's prior authorization for the drug decide the prior-authorization wait.
      - category: appeal
        as: branch
        reads: [variant_name]
        note: The appeal program's external review availability and effectuation hours decide the effectuation wait.
    compute:
      - rv_days: "XLATEST('specialty','specialty_fills','days_supply', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Rinvoq')"
      - rv_ship: "XLATEST('specialty','specialty_fills','ship_date', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Rinvoq')"
      - rv_left: "rv_days - DAYS(rv_ship, NOW)"
      - review_days: "P('external_exception_review_standard_hours') / 24"
      - rr_temp: "XCOUNT('specialty','specialty_fills', within_months=K('review_reship_lookback_months'), date_field='ship_date', event_type='specialty_fill_reshipped', drug_name='Rinvoq', reship_reason='temperature_excursion')"
      - rr_missed: "XCOUNT('specialty','specialty_fills', within_months=K('review_reship_lookback_months'), date_field='ship_date', event_type='specialty_fill_reshipped', drug_name='Rinvoq', reship_reason='missed_delivery')"
      - review_reserve: "K('temperature_reserve_days') if rr_temp > 0 else (K('missed_delivery_reserve_days') if rr_missed > 0 else 0)"
      - rv_pa_listed: "'Rinvoq' in CPARAM('review','pa_required_drugs')"
      - rv_pa_exp: "XLATEST('review','review_authorizations','expiration_date', date_field='expiration_date', event_type='review_auth_granted', drug_name='Rinvoq', authorization_type='prior_authorization')"
      - pa_wait: "CPARAM('review','urgent_decision_hours') / 24 if (rv_pa_listed and (rv_pa_exp == None or DAYS(NOW, rv_pa_exp) < 0)) else (CPARAM('review','standard_decision_hours') / 24 if (rv_pa_listed and DAYS(NOW, rv_pa_exp) <= K('pa_renewal_window_days')) else 0)"
      - ap_external: "CPARAM('appeal','external_review_available')"
      - ap_ext_hours: "CPARAM('appeal','overturn_external_effectuation_hours')"
      - ap_int_hours: "CPARAM('appeal','overturn_effectuation_hours')"
      - effect_wait: "ap_ext_hours / 24 if (ap_external == True and ap_ext_hours > 0) else (ap_int_hours / 24 if ap_external == False else 0)"
      - review_base: "review_days + pa_wait + effect_wait"
      - rv_pharm: "XLATEST('specialty','specialty_fills','dispensing_pharmacy', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Rinvoq')"
      - rv_lead: "CPARAM('specialty','delivery_scheduling_lead_business_days', therapy_drug='Rinvoq')"
      - rv_now_weekday: "DAYS('2026-01-05', NOW) % 7"
      - rv_ready_weekday: "(rv_now_weekday + int(review_base)) % 7"
      - rv_roll: "2 if rv_ready_weekday == 5 else (1 if rv_ready_weekday == 6 else 0)"
      - rv_start_weekday: "(rv_ready_weekday + rv_roll) % 7"
      - review_total: "(review_base + rv_roll + rv_lead + 2 * int((rv_start_weekday + rv_lead) / 5)) if rv_pharm == 'northbridge_specialty_pharmacy' else ((review_base + (1 if rv_ready_weekday == 6 else 0) + K('retail_pickup_review_days')) if rv_pharm == 'retail_pharmacy' else review_base)"
      - review_net_left: "rv_left - review_reserve"
      - result: "'expedited' if review_net_left < review_total else 'standard'"
    compute_basis:
