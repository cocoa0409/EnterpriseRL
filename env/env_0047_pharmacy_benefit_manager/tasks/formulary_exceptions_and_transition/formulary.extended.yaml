category: formulary
display_name: Formulary Benefit

binding:
  holding_table: formulary_assignments
  event_tables: [formulary_exceptions, formulary_transition_fills, formulary_notices]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_effective, active, terminated]
  transitions:
    - {from: pending_effective, to: active, by: system, means: The plan coverage effective date is reached and the formulary starts governing claims.}
    - {from: pending_effective, to: terminated, by: system, means: The future-dated plan enrollment is cancelled before it takes effect.}
    - {from: active, to: terminated, by: system, means: Plan coverage ends and the formulary assignment ends with it.}
    - {from: terminated, to: active, by: system, means: A COBRA reinstatement restores the plan enrollment and the formulary assignment with it.}

accounts: []

parameter_schema:
  formulary_structure: closed = a drug coded NF is not covered unless a formulary exception is approved (the member pays the pharmacy's discounted cash price); open = drugs not on the list are covered at nf_exception_brand_tier without an exception; enum
  cost_share_tier_count: number of member cost-share tiers the formulary uses (4 = tiers 1-4 with a single specialty tier; 5 = tiers 1-5)
  drug_list: 'per-drug mapping of every drug in the Northbridge Rx drug master list to its formulary status: ''1''-''5'' = covered at that cost-share tier, ''NF'' = non-formulary, ''EX'' = plan exclusion (never covered, not exceptionable)'
  tier_exception_allowed: a tier exception (covering a formulary drug at a lower cost-share tier) may be requested; boolean
  tier_exception_eligible_tiers: list of cost-share tiers from which a tier exception may lower a drug
  tier_exception_target_tier: mapping of eligible tier -> the tier at which an approved tier exception covers the drug
  tier_exception_requires_no_generic_equivalent: a tier exception is not available for a brand whose A-rated generic is covered at tier 1; boolean
  nonformulary_exception_allowed: a non-formulary exception (covering an NF drug) may be requested; boolean
  nf_exception_brand_tier: cost-share tier at which an approved non-formulary exception covers a non-specialty drug (also the tier for non-listed drugs on an open formulary)
  nf_exception_specialty_tier: cost-share tier at which an approved non-formulary exception covers a specialty drug
  nf_exception_alternatives_required: number of different formulary alternatives in the same therapeutic class the member must have tried and failed before a non-formulary exception is approved on the failure ground
  alternative_trial_lookback_days: calendar days before the exception request (request date as day zero) within which a qualifying trial of a formulary alternative must appear in pharmacy claims history
  alternative_trial_min_days_supply: minimum cumulative days supply of an alternative that counts as a trial
  stable_patient_continuation: a non-formulary exception may be approved for a member already stable on the drug for the lookback period, without alternative trials; boolean
  excluded_drug_exception_allowed: a drug coded EX can be covered through an exception; boolean
  exception_standard_decision_hours: hours from the start of the decision clock within which a standard exception request must be decided
  exception_expedited_decision_hours: hours from the start of the decision clock within which an expedited exception request must be decided
  exception_clock_start: event that starts the exception decision clock; enum
  prescriber_statement_wait_days: calendar days after a request is received (request date as day zero) to wait for the prescriber supporting statement before the request is denied for missing information
  exception_approval_months: months a standard exception approval remains in force, counted from the approval effective date (month-end fallback applies)
  expedited_exception_duration_days: calendar days an expedited exception approval remains in force (the exigency period)
  exception_renewal_lead_days: calendar days before an approval's expiration date from which a renewal request is accepted
  exception_covers_strength_changes: an approved exception carries over to a different strength of the same drug; boolean
  member_initiated_request_allowed: a member (or authorized representative) may open an exception request; the prescriber statement is still required; boolean
  authorized_representative_form_required: a representative other than the prescriber must have an appointment-of-representative form on file; boolean
  exception_intake_24x7: expedited requests are accepted around the clock including weekends and holidays; boolean
  external_exception_review_allowed: a denied exception may go to external exception review by an independent review organization; boolean
  external_exception_review_standard_hours: hours from receipt within which the independent reviewer decides a standard external exception review
  external_exception_review_expedited_hours: hours from receipt within which the independent reviewer decides an expedited external exception review
  exception_cost_share_counts_to_oop: cost share paid under an approved exception counts toward the out-of-pocket maximum; boolean
  transition_fill_allowed: a temporary transition supply of a non-formulary drug is allowed during the transition window; boolean
  transition_window_days: calendar days from the formulary effective date (or the formulary change date) during which transition fills are allowed (that date as day 1)
  transition_fill_days_supply: maximum days supply of one transition fill
  transition_fills_per_drug: maximum transition fills of the same drug per transition window
  transition_applies_to_formulary_change: members moved to this formulary by a sponsor formulary change also get a transition window; boolean
  nf_transition_tier: cost-share tier charged on a transition fill of a non-formulary drug
  transition_notice_business_days: business days after a transition fill within which the member is sent a transition notice
  midyear_negative_change_notice_days: calendar days before a mid-year negative change (removal, tier increase) takes effect that affected members are notified
  midyear_change_grandfathering: members with a paid claim for the drug in the lookback before a mid-year negative change keep the prior status until plan year end; boolean
  grandfathering_claim_lookback_days: calendar days before the change effective date in which a paid claim makes a member a current user for grandfathering
  positive_change_effective_immediately: tier decreases and additions take effect on P&T approval without notice; boolean
  formulary_update_cycle: how often the drug list is updated after Pharmacy & Therapeutics review; enum
  new_to_market_review_days: calendar days a newly launched drug stays non-formulary pending P&T review (0 = covered at nf_exception_brand_tier on launch)
  biosimilar_preferred: interchangeable biosimilars are preferred over the reference biologic, which moves to NF or the non-preferred specialty tier; boolean
  specialty_cost_threshold_monthly: allowed cost per 30-day supply above which a drug is placed on a specialty tier, USD
  otc_equivalent_exclusion: brand products with an OTC equivalent in the same strength are excluded; boolean
  compounded_drug_coverage: how compounded prescriptions are covered; enum
  exception_quantity_limits_still_apply: quantity limits of the member's utilization management program still apply to a drug covered by an exception; boolean

