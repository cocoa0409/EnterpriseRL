  - id: formulary_ext_member_request_priority
    base_policy_refs: [formulary_nonformulary_exception, formulary_tier_exception]
    overwrite: []
    trigger: on_request
    subject: [formulary_exception_requested]
    computes: review_priority
    target_tool: submit_member_exception_request_38483004
    params:
      statement_lookback_months: 12
      engaged_prescriber_wait_days: 5
      prescriber_case_lookback_months: 12
      auth_renewal_window_days: 30
      reserve_mail_days: 3
      reserve_retail_days: 1
    rule: >-
      When a member opens an exception request on their own behalf, the request's priority is set from the member's records by comparing the days of the drug the member has left with the days the member would wait for a standard decision, as follows.
      The days left are the days supply of the member's latest fill of the drug (the latest shipped home delivery order, or the latest paid retail fill when that is more recent) less the days from that fill's ship date or date of service to the handling date.
      The days a member waits for a standard decision are the formulary's standard decision hours divided by twenty-four.
      A member's own request is expedited when the days left are fewer than the days the member waits for a standard decision, and standard otherwise.
      A statement wait is added to the member's wait, because a request the member opens still needs the prescriber's supporting statement: when no supporting statement for the drug has been received on any of the member's requests within the statement lookback (fewer whole months before the handling date than the lookback) and the latest coverage review case for the drug opened for the member was not opened by the prescriber on the member's latest home delivery prescription for the drug within the prescriber-case lookback, the formulary's full wait for a prescriber statement in days is added; when no such statement has been received but that latest review case was opened by that prescriber within the prescriber-case lookback (so the clinical file is already with Northbridge Rx), the engaged-prescriber wait is added; in every other case no statement wait is added.
      A review wait is added when the drug also needs prior authorization: when the drug is on the prior-authorization list of the member's review package and no prior authorization for it is in force on the handling date, the package's standard decision hours divided by twenty-four are added; when it is on that list and the prior authorization in force expires within the authorization renewal window (no more days after the handling date than that window), the package's urgent decision hours divided by twenty-four are added; in every other case no review wait is added.
      The ready day, by which the member could have the drug in hand, is reckoned on the dispensing channel's own calendar: every wait above is a number of calendar days counted from the handling date, as the formulary, the review package and the prescriber statement define them, and their sum fixes the ready day; when the member's latest fill of the drug was a home delivery order, a ready day that falls on a Saturday or a Sunday is moved to the following Monday, because the home delivery pharmacy ships only Monday through Friday; when the latest fill was at a retail pharmacy, a ready day that falls on a Sunday is moved to the following Monday, because network pharmacies dispense Monday through Saturday; in every other case the ready day is taken as it falls.
      A safety reserve is taken off the days left for maintenance drugs: when the drug is on the member's retail network maintenance list and the latest fill was a home delivery order, the home delivery reserve is taken off; when it is on that list and the latest fill was at a retail pharmacy, the retail reserve is taken off; in every other case no reserve is taken off.
      The comparison is made only after the statement and review waits have been added to the days of a standard decision, the ready day has been moved by the dispensing channel's calendar and the reserve has been taken off the days left; a request whose days left, after the reserve, are fewer than the days from the handling date to that ready day is expedited, and any other request is standard.
    prerequisite: []
    cross_category:
      - category: mail
        as: history
        reads: [mail_orders.days_supply, mail_orders.order_date, mail_prescriptions.prescriber_npi]
        note: The member's latest shipped home delivery order of the drug sets the days left and the channel calendar; the latest home delivery prescription names the prescriber for the statement wait.
      - category: retail
        as: branch
        reads: [retail_claims.days_supply, retail_claims.date_of_service, variant_name]
        note: A more recent paid retail fill would set the days left and the retail calendar instead; the network's maintenance list decides the safety reserve.
      - category: review
        as: history
        reads: [variant_name, review_authorizations.expiration_date, review_cases.prescriber_npi, review_cases.event_at]
        note: The review package's prior-authorization list and decision hours, the member's prior authorization for the drug and the prescriber's review cases for the drug decide the review wait and the statement wait.
    compute:
      - hd_last_days: "XLATEST('mail','mail_orders','days_supply', date_field='order_date', event_type='mail_order_shipped', drug_name='Mounjaro')"
      - hd_last_date: "XLATEST('mail','mail_orders','order_date', date_field='order_date', event_type='mail_order_shipped', drug_name='Mounjaro')"
      - rt_last_days: "XLATEST('retail','retail_claims','days_supply', date_field='date_of_service', event_type='retail_claim_paid', drug_name='Mounjaro')"
      - rt_last_date: "XLATEST('retail','retail_claims','date_of_service', date_field='date_of_service', event_type='retail_claim_paid', drug_name='Mounjaro')"
      - last_at_retail: "rt_last_date != None and (hd_last_date == None or DAYS(hd_last_date, rt_last_date) > 0)"
      - last_by_mail: "hd_last_date != None and not last_at_retail"
      - days_left: "(rt_last_days - DAYS(rt_last_date, NOW)) if last_at_retail else ((hd_last_days - DAYS(hd_last_date, NOW)) if last_by_mail else 0)"
      - decision_days: "P('exception_standard_decision_hours') / 24"
      - stmt_n: "COUNT('formulary_exceptions', within_months=K('statement_lookback_months'), date_field='event_at', event_type='formulary_exception_statement_received', drug_name='Mounjaro')"
      - cur_rx_npi: "XLATEST('mail','mail_prescriptions','prescriber_npi', date_field='received_date', drug_name='Mounjaro')"
      - case_npi: "XLATEST('review','review_cases','prescriber_npi', date_field='event_at', event_type='review_case_opened', drug_name='Mounjaro')"
      - case_at: "XLATEST('review','review_cases','event_at', date_field='event_at', event_type='review_case_opened', drug_name='Mounjaro')"
      - engaged: "case_npi != None and case_npi == cur_rx_npi and MONTHS(case_at, NOW) < K('prescriber_case_lookback_months')"
      - wait_days: "P('prescriber_statement_wait_days') if (stmt_n == 0 and not engaged) else (K('engaged_prescriber_wait_days') if (stmt_n == 0 and engaged) else 0)"
      - pa_listed: "'Mounjaro' in CPARAM('review','pa_required_drugs')"
      - pa_exp: "XLATEST('review','review_authorizations','expiration_date', date_field='expiration_date', event_type='review_auth_granted', drug_name='Mounjaro', authorization_type='prior_authorization')"
      - review_wait: "CPARAM('review','standard_decision_hours') / 24 if (pa_listed and (pa_exp == None or DAYS(NOW, pa_exp) < 0)) else (CPARAM('review','urgent_decision_hours') / 24 if (pa_listed and DAYS(NOW, pa_exp) <= K('auth_renewal_window_days')) else 0)"
      - base_wait: "decision_days + wait_days + review_wait"
      - now_weekday: "DAYS('2026-01-05', NOW) % 7"
      - ready_weekday: "(now_weekday + int(base_wait)) % 7"
      - counted_wait: "(base_wait + (2 if ready_weekday == 5 else (1 if ready_weekday == 6 else 0))) if last_by_mail else ((base_wait + (1 if ready_weekday == 6 else 0)) if last_at_retail else base_wait)"
      - maint_listed: "'Mounjaro' in CPARAM('retail','maintenance_drugs')"
      - reserve_days: "K('reserve_mail_days') if (maint_listed and last_by_mail) else (K('reserve_retail_days') if (maint_listed and last_at_retail) else 0)"
      - net_left: "days_left - reserve_days"
      - result: "'expedited' if net_left < counted_wait else 'standard'"
    compute_basis:
