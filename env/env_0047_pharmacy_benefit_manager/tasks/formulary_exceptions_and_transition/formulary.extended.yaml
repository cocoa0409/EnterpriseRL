events:
  - type: formulary_assign
    target: formulary_assignments
    mutation: create
    meaning: A formulary assignment is opened for a member when the plan enrollment is created.
    grain: one row per plan enrollment
    fields:
      customer_id: covered member
      plan_enrollment_id: plan enrollment the assignment belongs to
      variant_name: formulary the sponsor elected
      effective_date: plan coverage effective date
      transition_start_date: equal to the effective date
    triggers: []
  - type: formulary_activate
    target: formulary_assignments
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: The formulary assignment takes effect with the plan coverage.
    grain: one row per transaction
    fields:
      effective_date: the effective date reached
    triggers: []
  - type: formulary_terminate
    target: formulary_assignments
    mutation:
      transition:
        - {from: active, to: terminated}
        - {from: pending_effective, to: terminated}
    meaning: The formulary assignment ends because plan coverage ended or was cancelled.
    grain: one row per transaction
    fields:
      end_date: last day of plan coverage
    triggers: []
  - type: formulary_reinstate
    target: formulary_assignments
    mutation: {transition: {from: terminated, to: active}}
    meaning: The formulary assignment is restored by a COBRA reinstatement of the plan enrollment.
    grain: one row per transaction
    fields:
      end_date: cleared, because coverage continues
    triggers: []
  - type: formulary_reassign
    target: formulary_assignments
    mutation: update
    meaning: The sponsor moves its members to a different formulary, normally at plan year renewal.
    grain: one row per transaction
    fields:
      variant_name: the new formulary
      formulary_change_date: date the new formulary takes effect
      transition_start_date: equal to the formulary change date
    triggers: []
  - type: formulary_exception_requested
    target: formulary_exceptions
    meaning: A tier or non-formulary exception request is received for one drug.
    grain: one row per exception request for one drug
    distinguish_by: [drug_name, exception_type, event_at]
    fields:
      drug_name: drug requested
      drug_strength: strength and form prescribed
      exception_type: tier or non-formulary exception
      review_priority: standard or expedited
      requested_by: member, prescriber or authorized representative
      prescriber_npi: prescriber NPI
      event_at: moment the request was received
    triggers: []
  - type: formulary_exception_statement_received
    target: formulary_exceptions
    meaning: The prescriber supporting statement for an open exception request is received.
    grain: one row per statement received for one request
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the request the statement supports
      drug_name: drug of the request
      exception_type: type of the request
      review_priority: priority attested by the prescriber (an expedited attestation upgrades a standard request)
      prescriber_npi: NPI of the prescriber giving the statement
      statement_basis: clinical ground stated
      event_at: moment the statement was received
    triggers: []
  - type: formulary_exception_approved
    target: formulary_exceptions
    meaning: An exception request is approved and the drug is covered at the approved tier for the approval period.
    grain: one row per approval of one request
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the request approved
      drug_name: drug of the request
      exception_type: type of the request
      review_priority: priority under which it was decided
      decision_reason: criteria_met, iro_overturned or appeal_overturned
      approved_tier: tier at which the drug is covered
      approval_effective_date: first day of the approval
      approval_expiration_date: last day of the approval
      event_at: moment of the decision
    triggers: []
  - type: formulary_exception_denied
    target: formulary_exceptions
    meaning: An exception request is denied.
    grain: one row per denial of one request
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the request denied
      drug_name: drug of the request
      exception_type: type of the request
      review_priority: priority under which it was decided
      decision_reason: reason for the denial
      event_at: moment of the decision
    triggers: []
  - type: formulary_exception_withdrawn
    target: formulary_exceptions
    meaning: The requester withdraws an exception request before it is decided.
    grain: one row per withdrawn request
    distinguish_by: [source_exception_id]
    fields:
      source_exception_id: the request withdrawn
      drug_name: drug of the request
      requested_by: who withdrew it (must be the requester or the member)
      event_at: moment of the withdrawal
    triggers: []
  - type: formulary_external_review_requested
    target: formulary_exceptions
    meaning: The member, representative or prescriber asks for an independent external exception review of a denied exception.
    grain: one row per external review request on one denial
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the original request whose denial is reviewed
      drug_name: drug of the request
      review_priority: standard or expedited external review
      requested_by: who asked for the review
      event_at: moment the review request was received
    triggers: []
  - type: formulary_external_review_decided
    target: formulary_exceptions
    meaning: The independent review organization returns its decision on an external exception review.
    grain: one row per external review decision
    distinguish_by: [source_exception_id, event_at]
    fields:
      source_exception_id: the original request reviewed
      drug_name: drug of the request
      review_outcome: upheld or overturned
      event_at: moment the decision was received
    triggers:
      - event: formulary:formulary_exception_approved
        when: {review_outcome: overturned}
        map: {source_exception_id: source_exception_id, drug_name: drug_name, decision_reason: iro_overturned}
  - type: formulary_transition_fill
    target: formulary_transition_fills
    meaning: A temporary transition supply of a non-formulary drug is allowed for a member in a transition window.
    grain: one row per transition fill of one drug
    distinguish_by: [drug_name, fill_date]
    fields:
      drug_name: drug dispensed
      drug_strength: strength dispensed
      fill_date: date of service
      days_supply: days supply dispensed
      transition_basis: new enrollment or formulary change
      dispensing_channel: retail, home delivery or specialty
    triggers: []
  - type: formulary_change_notice
    target: formulary_notices
    meaning: An affected member is notified of a formulary change to a drug they take.
    grain: one row per drug change notified to one member
    distinguish_by: [drug_name, change_effective_date]
    fields:
      drug_name: drug changing
      change_type: kind of change
      new_status: status after the change
      notice_date: date notice was sent
      change_effective_date: date the change takes effect
    triggers: []

measures:
  - id: formulary_msr_transition_fills_in_window
    window: the member's current transition window, from transition_start_date as day 1 through day transition_window_days
    measure: count of formulary_transition_fill rows on this assignment for the same drug_name with fill_date inside the window
  - id: formulary_msr_alternative_trials
    window: alternative_trial_lookback_days calendar days ending on the exception request date (request date as day zero)
    measure: number of distinct formulary drugs in the requested drug's therapeutic class whose paid retail claims, shipped home delivery orders and shipped specialty fills for the member add up to at least alternative_trial_min_days_supply days supply

policies:
  - id: formulary_agg_multi_holding
    subject: [formulary_assign]
    rule: >-
      A member holds at most one formulary assignment that is not terminated, tied to their single open plan enrollment.
      A new assignment may be opened only when no assignment of that member is pending_effective or active.
      A change of formulary for an existing member is a reassignment of the same assignment, never a second assignment.
    eligibility:
      - id: one_open_assignment
        applies_to: [formulary_assign]
        kind: dedup
        condition: A new assignment may be opened only when no assignment of that member is pending_effective or active.
        evidence_fields: [formulary_assignments.customer_id, formulary_assignments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.customer_id]
          action_bindings:
            formulary_assignments.customer_id: customer_id
        dedup_contract:
          table: formulary_assignments
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_effective, active]}
          distinct_fields: [effective_date]
    params:
      max_per_customer: 1

  - id: formulary_drug_coverage
    subject: [formulary_assign, formulary_activate, formulary_reassign]
    rule: >-
      A drug's coverage status for a member is its code in the drug_list of the formulary the member's assignment holds on the date of service: a numeric code is the cost-share tier charged under the plan's cost-share rules, NF is non-formulary and EX is a plan exclusion.
      On a closed formulary an NF drug is not covered unless an exception approval is in force on the date of service; on an open formulary an NF or unlisted drug is covered at nf_exception_brand_tier without an exception.
      An EX drug is never covered, by exception or by transition fill, while excluded_drug_exception_allowed is false.
      A brand with an OTC equivalent is excluded when otc_equivalent_exclusion is true, compounded prescriptions follow compounded_drug_coverage, and a newly launched drug is treated as NF for new_to_market_review_days.
      A drug whose allowed cost per 30-day supply exceeds specialty_cost_threshold_monthly is placed on a specialty tier.
      When biosimilar_preferred is true the drug list prefers the interchangeable biosimilar over the reference biologic, as the codes show.
      A drug approved under an exception keeps the quantity limits of the member's utilization management program while exception_quantity_limits_still_apply is true.
    eligibility: []
    params:
      per_tier:
        Northbridge Exclusive Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Value Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Standard Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Preferred Drug List: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Broad Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}
        Northbridge Open Formulary: {structure: "=formulary_structure", tier_count: "=cost_share_tier_count"}

  - id: formulary_tier_exception
    subject: [formulary_exception_requested, formulary_exception_approved, formulary_exception_denied]
    rule: >-
      A tier exception covers a formulary drug at a lower cost-share tier.
      It is available only when tier_exception_allowed is true and the drug's current code is one of tier_exception_eligible_tiers; the approved tier is the one tier_exception_target_tier maps it to.
      It is denied with tier_not_exceptionable when the drug's tier is not eligible (including every specialty tier not listed), with generic_equivalent_available when tier_exception_requires_no_generic_equivalent is true and an A-rated generic is covered at tier 1, and with already_covered when the drug is already at or below the target tier.
      It is approved with criteria_met when the prescriber supporting statement states that the preferred alternatives on the lower tier would be ineffective, have caused an adverse effect, or are contraindicated.
      A tier exception may be requested only while the member's formulary assignment is active.
    eligibility:
      - id: tier_exception_active_assignment
        applies_to: [formulary_exception_requested]
        kind: state
        condition: A tier exception may be requested only while the member's formulary assignment is active.
        evidence_fields: [formulary_assignments.status, formulary_assignments.formulary_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.formulary_assignment_id]
          action_bindings:
            formulary_assignments.formulary_assignment_id: formulary_assignment_id
        state_contract:
          field: formulary_assignments.status
          allowed: [active]
    params:
      per_tier:
        Northbridge Exclusive Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Value Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Standard Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Preferred Drug List: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Broad Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}
        Northbridge Open Formulary: {allowed: "=tier_exception_allowed", eligible: "=tier_exception_eligible_tiers", target: "=tier_exception_target_tier"}

  - id: formulary_nonformulary_exception
    subject: [formulary_exception_requested, formulary_exception_approved, formulary_exception_denied]
    rule: >-
      A non-formulary exception covers a drug coded NF on the member's formulary and is available only when nonformulary_exception_allowed is true; a request for a drug coded EX is denied with excluded_drug, and a request for a drug that is already covered is denied with already_covered.
      It is approved with criteria_met on one of three grounds stated in the prescriber supporting statement: the member has tried and failed at least nf_exception_alternatives_required different formulary alternatives in the same therapeutic class (formulary_msr_alternative_trials, counting only trials found in Northbridge Rx pharmacy claims history within alternative_trial_lookback_days with at least alternative_trial_min_days_supply days supply each); every formulary alternative is contraindicated; or, when stable_patient_continuation is true, the member has been stable on the requested drug throughout the lookback period.
      When the statement relies on failed alternatives but claims history shows fewer qualifying trials than required, the request is denied with alternatives_not_tried.
      An approved non-specialty drug is covered at nf_exception_brand_tier and an approved specialty drug at nf_exception_specialty_tier.
      Only one exception request per drug may be open at a time: a new request may be opened only when the member has no request for the same drug that is still undecided or whose approval is still in force.
    eligibility:
      - id: one_open_request_per_drug
        applies_to: [formulary_exception_requested]
        kind: dedup
        condition: a new request may be opened only when the member has no request for the same drug that is still undecided or whose approval is still in force.
        evidence_fields: [formulary_exceptions.customer_id, formulary_exceptions.drug_name, formulary_exceptions.event_type, formulary_exceptions.approval_expiration_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.customer_id, formulary_exceptions.drug_name]
          action_bindings:
            formulary_exceptions.customer_id: customer_id
            formulary_exceptions.drug_name: drug_name
        dedup_contract:
          table: formulary_exceptions
          mode: separate_record
          object_bindings: {customer_id: customer_id, drug_name: drug_name}
          duplicate_filters: {event_type: [formulary_exception_requested, formulary_exception_approved]}
          distinct_fields: [event_at, approval_expiration_date]
    measures: [formulary_msr_alternative_trials]
    formula:
      approve_on_trials: "formulary_msr_alternative_trials >= nf_exception_alternatives_required"

  - id: formulary_evt_exception_timeline
    subject: [formulary_exception_statement_received, formulary_exception_approved, formulary_exception_denied]
    rule: >-
      An exception request is decided only on a prescriber supporting statement: no request may be approved before a statement for it has been received.
      A request may be opened by the prescriber, by the member when member_initiated_request_allowed is true, or by an authorized representative with an appointment-of-representative form on file when authorized_representative_form_required is true; expedited requests are taken around the clock when exception_intake_24x7 is true.
      The decision clock starts at the event named by exception_clock_start, and the decision is due within exception_standard_decision_hours for a standard request or exception_expedited_decision_hours for an expedited one; a prescriber's expedited attestation on the statement makes the request expedited.
      When no statement has arrived by the end of prescriber_statement_wait_days calendar days after the request was received, counting the request date as day zero, the request is denied with missing_prescriber_statement.
      A denial for a missing statement may be recorded only after prescriber_statement_wait_days calendar days have fully elapsed since the request was received.
      A request that has already been approved, denied or withdrawn takes no further decision; a new request starts a new case.
    eligibility:
      - id: statement_before_approval
        applies_to: [formulary_exception_approved]
        kind: authorization
        condition: no request may be approved before a statement for it has been received.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id
      - id: decide_once
        applies_to: [formulary_exception_approved, formulary_exception_denied]
        kind: dedup
        condition: A request that has already been approved, denied or withdrawn takes no further decision; a new request starts a new case.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id
        dedup_contract:
          table: formulary_exceptions
          mode: separate_record
          object_bindings: {source_exception_id: source_exception_id}
          duplicate_filters: {event_type: [formulary_exception_approved, formulary_exception_denied, formulary_exception_withdrawn]}
          distinct_fields: [event_at]
      - id: wait_elapsed_before_missing_statement_denial
        applies_to: [formulary_exception_denied]
        kind: time
        condition: A denial for a missing statement may be recorded only after prescriber_statement_wait_days calendar days have fully elapsed since the request was received.
        evidence_fields: [formulary_exceptions.event_at, formulary_exceptions.formulary_exception_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.formulary_exception_id]
          action_bindings:
            formulary_exceptions.formulary_exception_id: source_exception_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the request was received
          anchor_source: formulary_exceptions.event_at
          relation: not_before
          duration_source: variants.prescriber_statement_wait_days
          unit: calendar_days
          counting_rule: counting the request date as day zero
          boundary: exclusive

  - id: formulary_evt_exception_duration
    subject: [formulary_exception_approved]
    rule: >-
      A standard approval is effective on the decision date and runs for exception_approval_months calendar months, its expiration date being the day before the same day-of-month that many months later (falling back to the last day of the month when that day does not exist); an expedited approval runs expedited_exception_duration_days calendar days with the decision date as day 1.
      An approval covers only the drug and strength requested unless exception_covers_strength_changes is true, in which case it also covers other strengths of the same drug.
      A renewal is a new request; it may be opened from exception_renewal_lead_days calendar days before the current approval's expiration date, and when approved its effective date is the day after the current expiration date.
      Cost share paid under an approved exception counts toward the out-of-pocket maximum when exception_cost_share_counts_to_oop is true.
      Approved exceptions survive a formulary reassignment only through the end of the plan year in which the reassignment happens.
    eligibility: []

  - id: formulary_external_exception_review
    subject: [formulary_external_review_requested, formulary_external_review_decided, formulary_exception_approved]
    rule: >-
      When external_exception_review_allowed is true a denied exception may be sent to an independent review organization at the request of the member, an authorized representative or the prescriber.
      An external exception review may be requested only for a request whose latest decision is a denial.
      The reviewer decides within external_exception_review_standard_hours, or external_exception_review_expedited_hours for an expedited review, from receipt.
      An overturned decision is binding: the exception is approved with decision_reason iro_overturned at the tier the exception policies set, for the period formulary_evt_exception_duration sets; an upheld decision ends the exception case, and the member's remaining rights run through the plan's appeal program.
    eligibility:
      - id: review_only_after_denial
        applies_to: [formulary_external_review_requested]
        kind: authorization
        condition: An external exception review may be requested only for a request whose latest decision is a denial.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id

  - id: formulary_exception_withdrawal
    subject: [formulary_exception_withdrawn]
    rule: >-
      The requester, or the member on whose behalf the request was made, may withdraw an exception request at any time before it is decided; a withdrawn request is never decided afterwards and coverage stays as the drug list sets it.
      A request may be withdrawn only when no approval, denial or earlier withdrawal exists for it.
    eligibility:
      - id: withdraw_undecided_only
        applies_to: [formulary_exception_withdrawn]
        kind: dedup
        condition: A request may be withdrawn only when no approval, denial or earlier withdrawal exists for it.
        evidence_fields: [formulary_exceptions.source_exception_id, formulary_exceptions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_exceptions.source_exception_id]
          action_bindings:
            formulary_exceptions.source_exception_id: source_exception_id
        dedup_contract:
          table: formulary_exceptions
          mode: separate_record
          object_bindings: {source_exception_id: source_exception_id}
          duplicate_filters: {event_type: [formulary_exception_approved, formulary_exception_denied, formulary_exception_withdrawn]}
          distinct_fields: [event_at]

  - id: formulary_transition_supply
    subject: [formulary_transition_fill]
    rule: >-
      When transition_fill_allowed is true, a member who is new to the formulary, or who was moved to it by a sponsor formulary change while transition_applies_to_formulary_change is true, may receive a temporary supply of an NF drug they were already taking.
      The transition start date is the formulary change date when the assignment has been moved to this formulary by a sponsor change, and otherwise the formulary effective date; it is recorded on the assignment as transition_start_date.
      A transition fill is allowed only on a date of service no later than transition_window_days calendar days after the transition start date, counting that date as day 1.
      Each fill is limited to transition_fill_days_supply days supply and to transition_fills_per_drug fills of the same drug per window (formulary_msr_transition_fills_in_window); the fill is charged at nf_transition_tier.
      Drugs coded EX never receive a transition fill, and a drug that is covered on the formulary does not need one.
      A transition notice explaining the need for an exception or a switch goes to the member within transition_notice_business_days business days of the fill.
      A transition fill may be allowed only while the formulary assignment is active.
    eligibility:
      - id: within_transition_window
        applies_to: [formulary_transition_fill]
        kind: time
        condition: A transition fill is allowed only on a date of service no later than transition_window_days calendar days after the transition start date, counting that date as day 1.
        evidence_fields: [formulary_assignments.transition_start_date, formulary_assignments.formulary_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.formulary_assignment_id]
          action_bindings:
            formulary_assignments.formulary_assignment_id: formulary_assignment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the transition start date
          anchor_source: formulary_assignments.transition_start_date
          relation: not_after
          duration_source: variants.transition_window_days
          unit: calendar_days
          counting_rule: counting that date as day 1
          boundary: inclusive
      - id: transition_active_assignment
        applies_to: [formulary_transition_fill]
        kind: state
        condition: A transition fill may be allowed only while the formulary assignment is active.
        evidence_fields: [formulary_assignments.status, formulary_assignments.formulary_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [formulary_assignments.formulary_assignment_id]
          action_bindings:
            formulary_assignments.formulary_assignment_id: formulary_assignment_id
        state_contract:
          field: formulary_assignments.status
          allowed: [active]
    measures: [formulary_msr_transition_fills_in_window]

  - id: formulary_midyear_change
    subject: [formulary_change_notice, formulary_reassign]
    rule: >-
      A negative change during the plan year (a drug moved to NF, excluded, or raised to a higher tier) is notified to every member with a paid claim for the drug in the grandfathering_claim_lookback_days before the change, at least midyear_negative_change_notice_days calendar days before the change effective date.
      When midyear_change_grandfathering is true those members keep the drug's prior status through the end of the plan year; otherwise the change applies to them on its effective date.
      Positive changes (a lower tier or a newly added drug) take effect on approval without notice while positive_change_effective_immediately is true.
      The drug list changes on the formulary_update_cycle, and a sponsor's move to a different formulary takes effect at plan year renewal with a new transition window for affected members.
      Notices are generated from the change schedule; a change whose notice was not sent on time takes effect for affected members only once the full notice period has run from the date the notice was actually sent.
    eligibility: []

  - id: formulary_lifecycle
    subject: [formulary_assign, formulary_activate, formulary_terminate, formulary_reinstate]
    rule: >-
      The formulary assignment follows the plan enrollment: it opens with it, takes effect on its effective date, ends on its coverage end date and is restored by a COBRA reinstatement.
      No exception is decided, and no transition fill allowed, for a date of service when the assignment is not active.
      Exception approvals already in force when coverage ends lapse with the coverage; on COBRA reinstatement they resume through their original expiration date.
    eligibility: []

extended_policies:
  - id: formulary_ext_specialty_transition_days
    base_policy_refs: [formulary_transition_supply]
    overwrite: []
    trigger: state_due
    subject: [formulary_transition_fill]
    computes: days_supply
    target_tool: record_specialty_transition_supply_d4f54566
    params:
      switch_cycles_with_waiver: 1
      switch_cycles_without_waiver: 2
      cold_chain_home_days: 2
      cold_chain_office_days: 1
      reship_lookback_months: 6
      temperature_buffer_days: 2
      missed_delivery_buffer_days: 1
      scheduling_lead_threshold_days: 3
      short_lead_allowance_days: 1
    rule: >-
      A specialty transition supply is the temporary supply of a non-formulary specialty drug that the specialty pharmacy dispenses to a member inside the member's transition window, and its days supply is worked out from the member's specialty records as follows.
      The standard specialty transition supply covers as many dose cycles as the member's latest shipped specialty fill of the drug contained.
      One dose cycle is the days supply of that latest shipped fill divided by its quantity.
      The days supply of the specialty transition supply is the number of dose cycles multiplied by the length of one dose cycle, never less than zero and never more than the formulary's maximum days supply for one transition fill.
      The number of dose cycles depends on a move to a preferred biosimilar: when the formulary prefers interchangeable biosimilars and the member's specialty program pairs the drug with a preferred biosimilar and pays a biosimilar switch waiver, the specialty transition supply covers the switch-with-waiver number of dose cycles; when the formulary prefers interchangeable biosimilars and the program pairs the drug with a preferred biosimilar but pays no switch waiver, it covers the switch-without-waiver number of dose cycles; in every other case it covers as many dose cycles as the latest shipped fill contained.
      A cold-chain delivery allowance is added for refrigerated drugs: when the drug is on the specialty program's cold-chain list and the latest shipped fill went to the member's home, the home cold-chain allowance is added; when the drug is on that list and the latest shipped fill went to the prescriber's office, the office cold-chain allowance is added; in every other case no cold-chain allowance is added.
      A biosimilar review allowance is added when the paired preferred biosimilar needs prior authorization: when the specialty program pairs the drug with that biosimilar, the biosimilar is on the prior-authorization list of the member's review package and no authorization for it has ever been granted to the member, the package's standard review time expressed in days (its standard decision hours divided by twenty-four) is added; when the program pairs the drug with it, it is on that list and an authorization for it was granted but the latest such authorization has expired before the handling date, the package's urgent review time expressed in days (its urgent decision hours divided by twenty-four) is added; in every other case no biosimilar review allowance is added.
      A delivery-failure buffer is added for members whose recent specialty deliveries failed: when a replacement shipment of the drug was sent within the reship lookback (fewer whole months before the handling date than the lookback) because of a temperature excursion, the temperature buffer is added; when no such replacement was sent for a temperature excursion but one was sent within the reship lookback because of a missed delivery, the missed-delivery buffer is added; in every other case no delivery-failure buffer is added.
      A scheduling allowance covers the time the specialty pharmacy needs to book a delivery: when the latest shipped fill was dispensed by Northbridge Specialty Pharmacy and the specialty program's delivery scheduling lead is at least the scheduling-lead threshold, that scheduling lead (counted as days) is added; when the latest shipped fill was dispensed by Northbridge Specialty Pharmacy and the scheduling lead is shorter than the threshold, the short-lead allowance is added; in every other case no scheduling allowance is added.
      Supply still on hand from the latest shipped fill is deducted: when that fill went to the member's home, the days of it not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are deducted; when it went to the prescriber's office, only the whole dose cycles still on hand are deducted (the days not yet elapsed, never less than zero, divided by the length of one dose cycle, rounded down to a whole number and multiplied by that length); in every other case nothing is deducted.
      The order is fixed: first the number of dose cycles is multiplied by the length of one dose cycle; then the cold-chain allowance, the biosimilar review allowance, the delivery-failure buffer and the scheduling allowance are added to that product; then the on-hand deduction is subtracted; only then are the floor of zero and the cap of the formulary's maximum days supply for one transition fill applied, and the result is taken as a whole number of days.
    prerequisite: []
    cross_category:
      - category: specialty
        as: history
        reads: [specialty_fills.days_supply, specialty_fills.quantity, specialty_fills.ship_date, specialty_fills.delivery_location, specialty_fills.dispensing_pharmacy, specialty_fills.reship_reason, variant_name]
        note: The member's shipped and reshipped specialty fills and the specialty program's biosimilar pairing, switch waiver, cold-chain list and scheduling lead decide the dose cycles, the cold-chain allowance, the delivery-failure buffer and the scheduling allowance.
      - category: review
        as: branch
        reads: [variant_name, review_authorizations.expiration_date, review_authorizations.event_type]
        note: The review package's prior-authorization list and decision hours and the member's authorizations for the paired biosimilar decide the biosimilar review allowance.
    compute:
      - sp_days: "XLATEST('specialty','specialty_fills','days_supply', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Humira')"
      - sp_qty: "XLATEST('specialty','specialty_fills','quantity', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Humira')"
      - sp_ship: "XLATEST('specialty','specialty_fills','ship_date', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Humira')"
      - sp_loc: "XLATEST('specialty','specialty_fills','delivery_location', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Humira')"
      - sp_pharm: "XLATEST('specialty','specialty_fills','dispensing_pharmacy', date_field='ship_date', event_type='specialty_fill_shipped', drug_name='Humira')"
      - cycle_len: "sp_days / sp_qty"
      - waiver_months: "CPARAM('specialty','biosimilar_switch_waiver_months', therapy_drug='Humira')"
      - paired: "'Humira' in CPARAM('specialty','biosimilar_pairs', therapy_drug='Humira')"
      - cycles: "K('switch_cycles_with_waiver') if (P('biosimilar_preferred') == True and paired and waiver_months > 0) else (K('switch_cycles_without_waiver') if (P('biosimilar_preferred') == True and paired and waiver_months == 0) else sp_qty)"
      - cold_listed: "'Humira' in CPARAM('specialty','cold_chain_drugs', therapy_drug='Humira')"
      - cold_allow: "K('cold_chain_home_days') if (cold_listed and sp_loc == 'home') else (K('cold_chain_office_days') if (cold_listed and sp_loc == 'prescriber_office') else 0)"
      - bio_pa_listed: "'adalimumab-adaz' in CPARAM('review','pa_required_drugs')"
      - bio_auths: "XCOUNT('review','review_authorizations', event_type='review_auth_granted', drug_name='adalimumab-adaz')"
      - bio_last_exp: "XLATEST('review','review_authorizations','expiration_date', date_field='expiration_date', event_type='review_auth_granted', drug_name='adalimumab-adaz')"
      - review_allow: "CPARAM('review','standard_decision_hours') / 24 if (paired and bio_pa_listed and bio_auths == 0) else (CPARAM('review','urgent_decision_hours') / 24 if (paired and bio_pa_listed and bio_auths > 0 and DAYS(bio_last_exp, NOW) > 0) else 0)"
      - reship_temp: "XCOUNT('specialty','specialty_fills', within_months=K('reship_lookback_months'), date_field='ship_date', event_type='specialty_fill_reshipped', drug_name='Humira', reship_reason='temperature_excursion')"
      - reship_missed: "XCOUNT('specialty','specialty_fills', within_months=K('reship_lookback_months'), date_field='ship_date', event_type='specialty_fill_reshipped', drug_name='Humira', reship_reason='missed_delivery')"
      - reship_buffer: "K('temperature_buffer_days') if reship_temp > 0 else (K('missed_delivery_buffer_days') if reship_missed > 0 else 0)"
      - sched_lead: "CPARAM('specialty','delivery_scheduling_lead_business_days', therapy_drug='Humira')"
      - sched_allow: "sched_lead if (sp_pharm == 'northbridge_specialty_pharmacy' and sched_lead >= K('scheduling_lead_threshold_days')) else (K('short_lead_allowance_days') if sp_pharm == 'northbridge_specialty_pharmacy' else 0)"
      - left_days: "sp_days - DAYS(sp_ship, NOW)"
      - onhand_cut: "MX(0, left_days) if sp_loc == 'home' else (int(MX(0, left_days) / cycle_len) * cycle_len if sp_loc == 'prescriber_office' else 0)"
      - raw_days: "cycles * cycle_len + cold_allow + review_allow + reship_buffer + sched_allow - onhand_cut"
      - result: "int(MN(P('transition_fill_days_supply'), MX(0, raw_days)))"
    compute_basis:
      sp_days: "One dose cycle is the days supply of that latest shipped fill divided by its quantity."
      sp_qty: "The standard specialty transition supply covers as many dose cycles as the member's latest shipped specialty fill of the drug contained."
      sp_ship: "when that fill went to the member's home, the days of it not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are deducted"
      sp_loc: "when the drug is on the specialty program's cold-chain list and the latest shipped fill went to the member's home, the home cold-chain allowance is added"
      sp_pharm: "when the latest shipped fill was dispensed by Northbridge Specialty Pharmacy and the specialty program's delivery scheduling lead is at least the scheduling-lead threshold, that scheduling lead (counted as days) is added"
      cycle_len: "One dose cycle is the days supply of that latest shipped fill divided by its quantity."
      waiver_months: "when the formulary prefers interchangeable biosimilars and the member's specialty program pairs the drug with a preferred biosimilar and pays a biosimilar switch waiver, the specialty transition supply covers the switch-with-waiver number of dose cycles"
      paired: "when the formulary prefers interchangeable biosimilars and the program pairs the drug with a preferred biosimilar but pays no switch waiver, it covers the switch-without-waiver number of dose cycles"
      cycles: "The number of dose cycles depends on a move to a preferred biosimilar: when the formulary prefers interchangeable biosimilars and the member's specialty program pairs the drug with a preferred biosimilar and pays a biosimilar switch waiver, the specialty transition supply covers the switch-with-waiver number of dose cycles; when the formulary prefers interchangeable biosimilars and the program pairs the drug with a preferred biosimilar but pays no switch waiver, it covers the switch-without-waiver number of dose cycles; in every other case it covers as many dose cycles as the latest shipped fill contained."
      cold_listed: "when the drug is on the specialty program's cold-chain list and the latest shipped fill went to the member's home, the home cold-chain allowance is added"
      cold_allow: "A cold-chain delivery allowance is added for refrigerated drugs: when the drug is on the specialty program's cold-chain list and the latest shipped fill went to the member's home, the home cold-chain allowance is added; when the drug is on that list and the latest shipped fill went to the prescriber's office, the office cold-chain allowance is added; in every other case no cold-chain allowance is added."
      bio_pa_listed: "when the specialty program pairs the drug with that biosimilar, the biosimilar is on the prior-authorization list of the member's review package and no authorization for it has ever been granted to the member, the package's standard review time expressed in days (its standard decision hours divided by twenty-four) is added"
      bio_auths: "when the specialty program pairs the drug with that biosimilar, the biosimilar is on the prior-authorization list of the member's review package and no authorization for it has ever been granted to the member, the package's standard review time expressed in days (its standard decision hours divided by twenty-four) is added"
      bio_last_exp: "when the program pairs the drug with it, it is on that list and an authorization for it was granted but the latest such authorization has expired before the handling date, the package's urgent review time expressed in days (its urgent decision hours divided by twenty-four) is added"
      review_allow: "A biosimilar review allowance is added when the paired preferred biosimilar needs prior authorization: when the specialty program pairs the drug with that biosimilar, the biosimilar is on the prior-authorization list of the member's review package and no authorization for it has ever been granted to the member, the package's standard review time expressed in days (its standard decision hours divided by twenty-four) is added; when the program pairs the drug with it, it is on that list and an authorization for it was granted but the latest such authorization has expired before the handling date, the package's urgent review time expressed in days (its urgent decision hours divided by twenty-four) is added; in every other case no biosimilar review allowance is added."
      reship_temp: "when a replacement shipment of the drug was sent within the reship lookback (fewer whole months before the handling date than the lookback) because of a temperature excursion, the temperature buffer is added"
      reship_missed: "when no such replacement was sent for a temperature excursion but one was sent within the reship lookback because of a missed delivery, the missed-delivery buffer is added"
      reship_buffer: "A delivery-failure buffer is added for members whose recent specialty deliveries failed: when a replacement shipment of the drug was sent within the reship lookback (fewer whole months before the handling date than the lookback) because of a temperature excursion, the temperature buffer is added; when no such replacement was sent for a temperature excursion but one was sent within the reship lookback because of a missed delivery, the missed-delivery buffer is added; in every other case no delivery-failure buffer is added."
      sched_lead: "when the latest shipped fill was dispensed by Northbridge Specialty Pharmacy and the specialty program's delivery scheduling lead is at least the scheduling-lead threshold, that scheduling lead (counted as days) is added"
      sched_allow: "A scheduling allowance covers the time the specialty pharmacy needs to book a delivery: when the latest shipped fill was dispensed by Northbridge Specialty Pharmacy and the specialty program's delivery scheduling lead is at least the scheduling-lead threshold, that scheduling lead (counted as days) is added; when the latest shipped fill was dispensed by Northbridge Specialty Pharmacy and the scheduling lead is shorter than the threshold, the short-lead allowance is added; in every other case no scheduling allowance is added."
      left_days: "when that fill went to the member's home, the days of it not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are deducted"
      onhand_cut: "Supply still on hand from the latest shipped fill is deducted: when that fill went to the member's home, the days of it not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date, never less than zero) are deducted; when it went to the prescriber's office, only the whole dose cycles still on hand are deducted (the days not yet elapsed, never less than zero, divided by the length of one dose cycle, rounded down to a whole number and multiplied by that length); in every other case nothing is deducted."
      raw_days: "The order is fixed: first the number of dose cycles is multiplied by the length of one dose cycle; then the cold-chain allowance, the biosimilar review allowance, the delivery-failure buffer and the scheduling allowance are added to that product; then the on-hand deduction is subtracted; only then are the floor of zero and the cap of the formulary's maximum days supply for one transition fill applied, and the result is taken as a whole number of days."
      result: "The days supply of the specialty transition supply is the number of dose cycles multiplied by the length of one dose cycle, never less than zero and never more than the formulary's maximum days supply for one transition fill."
    factors:
      - id: biosimilar_switch_cycles
        effect: parameter
        decides: cycles
        bindings: [waiver_months, paired, cycles]
        ladder:
          - when: "the formulary prefers interchangeable biosimilars AND the member's specialty program pairs the drug with a preferred biosimilar AND that program pays a biosimilar switch waiver"
            value: "K('switch_cycles_with_waiver') dose cycles"
          - when: "the formulary prefers interchangeable biosimilars AND the program pairs the drug with a preferred biosimilar AND that program pays no switch waiver"
            value: "K('switch_cycles_without_waiver') dose cycles"
          - when: "otherwise"
            value: "the dose cycles the latest shipped fill contained (its quantity)"
        baseline:
          cycles: "sp_qty"
        evidence: [tier_param, cross_category]
        cross_difficulty: specialty
      - id: specialty_cold_chain_allowance
        effect: parameter
        decides: cold_allow
        bindings: [cold_listed, cold_allow]
        ladder:
          - when: "the drug is on the specialty program's cold-chain list AND the latest shipped fill went to the member's home"
            value: "K('cold_chain_home_days')"
          - when: "the drug is on the cold-chain list AND the latest shipped fill went to the prescriber's office"
            value: "K('cold_chain_office_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          cold_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: specialty
      - id: biosimilar_review_allowance
        effect: parameter
        decides: review_allow
        bindings: [bio_pa_listed, bio_auths, bio_last_exp, review_allow]
        ladder:
          - when: "the program pairs the drug with a preferred biosimilar AND that biosimilar is on the review package's prior-authorization list AND no authorization for it has ever been granted to the member"
            value: "CPARAM('review','standard_decision_hours') / 24"
          - when: "the program pairs the drug with a preferred biosimilar AND that biosimilar is on that list AND an authorization for it was granted AND the latest such authorization expired before the handling date"
            value: "CPARAM('review','urgent_decision_hours') / 24"
          - when: "otherwise"
            value: "0"
        baseline:
          review_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: review
      - id: delivery_failure_buffer
        effect: parameter
        decides: reship_buffer
        bindings: [reship_temp, reship_missed, reship_buffer]
        ladder:
          - when: "a replacement shipment of the drug was sent within the reship lookback because of a temperature excursion"
            value: "K('temperature_buffer_days')"
          - when: "no temperature-excursion replacement within the lookback, but a replacement was sent within it because of a missed delivery"
            value: "K('missed_delivery_buffer_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          reship_buffer: "0"
        evidence: [history, cross_category]
        cross_difficulty: specialty
      - id: specialty_scheduling_allowance
        effect: parameter
        decides: sched_allow
        bindings: [sched_lead, sched_allow]
        ladder:
          - when: "the latest shipped fill was dispensed by Northbridge Specialty Pharmacy AND the program's delivery scheduling lead is at least the scheduling-lead threshold"
            value: "the program's delivery scheduling lead, counted as days"
          - when: "the latest shipped fill was dispensed by Northbridge Specialty Pharmacy AND the scheduling lead is shorter than the threshold"
            value: "K('short_lead_allowance_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          sched_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: specialty
      - id: specialty_onhand_deduction
        effect: method
        decides: onhand_cut
        bindings: [left_days, onhand_cut]
        ladder:
          - when: "the latest shipped fill went to the member's home"
            method: "deduct the days of that fill not yet elapsed on the handling date (days supply less days since the ship date, floored at zero)"
          - when: "the latest shipped fill went to the prescriber's office"
            method: "deduct only whole dose cycles still on hand (days not yet elapsed divided by the dose-cycle length, rounded down, times that length)"
          - when: "otherwise"
            method: "deduct nothing"
        baseline:
          onhand_cut: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard specialty transition supply covers as many dose cycles as the member's latest shipped specialty fill of the drug contained.
        One dose cycle is the days supply of that latest shipped fill divided by its quantity.
        The days supply of the specialty transition supply is the number of dose cycles multiplied by the length of one dose cycle, never less than zero and never more than the formulary's maximum days supply for one transition fill.
      params: [transition_fill_days_supply]
    inputs:
      history:
        - {category: specialty, table: specialty_fills, aggregate: latest, field: days_supply, filters: {event_type: specialty_fill_shipped, drug_name: Humira}}
        - {category: specialty, table: specialty_fills, aggregate: count, field: specialty_fill_id, within_months: 6, filters: {event_type: specialty_fill_reshipped, drug_name: Humira}}
        - {category: review, table: review_authorizations, aggregate: count, field: review_authorization_id, filters: {event_type: review_auth_granted, drug_name: adalimumab-adaz}}
      cross_category: [specialty, review]
  - id: formulary_ext_retail_transition_days
    base_policy_refs: [formulary_transition_supply]
    overwrite: []
    trigger: state_due
    subject: [formulary_transition_fill]
    computes: days_supply
    target_tool: record_retail_transition_supply_5b1515b2
    params:
      missing_notice_extension_days: 14
      maintenance_choice_grace_days: 5
    rule: >-
      A retail transition supply is the temporary supply of a non-formulary drug that a network retail pharmacy dispenses to a member inside the member's transition window, and its days supply is worked out from the member's records as follows.
      A retail transition supply's days supply is fixed only after the records carry, for every non-formulary drug whose specialty shipments to the member were still running on the transition start date, a specialty transition supply dated inside the current transition window.
      The standard retail transition supply runs for the formulary's maximum days supply for one transition fill, never less than zero and never more than that maximum.
      The starting length of a retail transition supply follows the member's other transition supplies so that they run out together: when the records carry a specialty transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that supply's last day (its days supply less the days from its fill date to the handling date); when no such specialty supply is running but the records carry a home-delivery transition supply of another drug dated inside the window that is still running, the starting length is the days from the handling date through that supply's last day, counted the same way; in every other case the starting length is the formulary's maximum days supply for one transition fill.
      Supply of the drug still on hand from the member's latest paid retail fill is deducted: when that fill has days not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date) and the share of it already elapsed has reached the retail network's early-refill threshold for non-controlled drugs, the days not yet elapsed are deducted; when it has days not yet elapsed but the share already elapsed is below that threshold, the days not yet elapsed are deducted together with the network's refill tolerance (the fill's days supply multiplied by one minus the threshold, rounded down to whole days); in every other case nothing is deducted for it.
      Supply the member obtained outside the transition benefit since the transition window opened is deducted: when the member has submitted a paper claim for the drug with a date of service on or after the transition start date, the days of that purchase not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date, never less than zero) are deducted; when there is no such paper claim but a retail emergency-supply override for the drug was granted on or after the transition start date, the days of the override supply not yet elapsed on the handling date (the days supply it allowed less the days from its granted date to the handling date, never less than zero) are deducted; in every other case nothing is deducted for outside supply.
      A late-notice extension is added when the member was not told of the change in time: when the member was moved to the formulary by a sponsor formulary change and the records carry no formulary change notice for the drug, the missing-notice extension is added; when the latest change notice for the drug was sent fewer days before its change effective date than the formulary's advance-notice period for negative changes, the shortfall (that advance-notice period less the days from the notice date to the change effective date) is added; in every other case no late-notice extension is added.
      A home-delivery bridge is added for maintenance drugs that are moving to the mail: when the member's retail maintenance choice is home delivery and the drug is on the retail network's maintenance list, the standard shipping time of the member's home delivery program in business days is added; when the maintenance choice is still undecided, the drug is on the maintenance list and the network applies its maintenance rule after the courtesy fills (whether that rule sends the drug to home delivery only or to home delivery or a ninety-day retail fill), the maintenance-choice grace is added; in every other case no home-delivery bridge is added.
      The order is fixed: the starting length comes first; the retail on-hand deduction and the outside-supply deduction are subtracted from it and the late-notice extension and the home-delivery bridge are added to it; only then are the floor of zero and the cap of the formulary's maximum days supply for one transition fill applied, and the result is taken as a whole number of days.
    prerequisite:
      - problem: formulary_ext_specialty_transition_days
        kind: value_input
        gate: sync_len
        form: state
        policy_source: >-
          A retail transition supply's days supply is fixed only after the records carry, for every non-formulary drug whose specialty shipments to the member were still running on the transition start date, a specialty transition supply dated inside the current transition window.
        condition: >-
          formulary_transition_fills holds, under the member's assignment, for every non-formulary drug a row for that drug with dispensing_channel specialty and a fill_date on or after the assignment's transition_start_date, the drugs being those whose latest shipped specialty fill (ship date plus days supply) still ran on the transition start date.
        resolved_by: record_specialty_transition_supply_d4f54566
        effect: >-
          Once the specialty transition supply is on record and still running, the starting length of the retail transition supply becomes the days through that specialty supply's last day instead of the formulary's maximum days supply for one transition fill.
    cross_category:
      - category: retail
        as: history
        reads: [retail_claims.days_supply, retail_claims.date_of_service, retail_reimbursements.date_of_service, retail_reimbursements.days_supply, retail_overrides.granted_date, retail_overrides.days_supply_allowed, maintenance_choice, variant_name]
        note: The member's latest paid retail fill, paper claims and emergency overrides for the drug, the network's early-refill threshold and maintenance list and the member's maintenance choice decide the retail on-hand deduction, the outside-supply deduction and the home-delivery bridge.
      - category: mail
        as: branch
        reads: [variant_name]
        note: The standard shipping time of the member's home delivery program sizes the home-delivery bridge.
    compute:
      - ts_sp_n: "COUNT('formulary_transition_fills', dispensing_channel='specialty')"
      - ts_sp_days: "LATEST('formulary_transition_fills','days_supply', date_field='fill_date', dispensing_channel='specialty')"
      - ts_sp_date: "LATEST('formulary_transition_fills','fill_date', date_field='fill_date', dispensing_channel='specialty')"
      - ts_hd_n: "COUNT('formulary_transition_fills', dispensing_channel='home_delivery')"
      - ts_hd_days: "LATEST('formulary_transition_fills','days_supply', date_field='fill_date', dispensing_channel='home_delivery')"
      - ts_hd_date: "LATEST('formulary_transition_fills','fill_date', date_field='fill_date', dispensing_channel='home_delivery')"
      - sp_run: "(ts_sp_days - DAYS(ts_sp_date, NOW)) if (ts_sp_n > 0 and DAYS(F('transition_start_date'), ts_sp_date) >= 0) else 0"
      - hd_run: "(ts_hd_days - DAYS(ts_hd_date, NOW)) if (ts_hd_n > 0 and DAYS(F('transition_start_date'), ts_hd_date) >= 0) else 0"
      - sync_len: "sp_run if sp_run > 0 else (hd_run if hd_run > 0 else P('transition_fill_days_supply'))"
      - rx_days: "XLATEST('retail','retail_claims','days_supply', date_field='date_of_service', event_type='retail_claim_paid', drug_name='Xarelto')"
      - rx_dos: "XLATEST('retail','retail_claims','date_of_service', date_field='date_of_service', event_type='retail_claim_paid', drug_name='Xarelto')"
      - rx_left: "rx_days - DAYS(rx_dos, NOW)"
      - refill_thr: "CPARAM('retail','early_refill_threshold_noncontrolled')"
      - retail_onhand: "rx_left if (rx_left > 0 and DAYS(rx_dos, NOW) / rx_days >= refill_thr) else ((rx_left + int(rx_days * (1 - refill_thr))) if rx_left > 0 else 0)"
      - dmr_dos: "XLATEST('retail','retail_reimbursements','date_of_service', date_field='date_of_service', event_type='retail_dmr_submitted', drug_name='Xarelto')"
      - dmr_days: "XLATEST('retail','retail_reimbursements','days_supply', date_field='date_of_service', event_type='retail_dmr_submitted', drug_name='Xarelto')"
      - emg_date: "XLATEST('retail','retail_overrides','granted_date', date_field='granted_date', override_type='emergency_supply', drug_name='Xarelto')"
      - emg_days: "XLATEST('retail','retail_overrides','days_supply_allowed', date_field='granted_date', override_type='emergency_supply', drug_name='Xarelto')"
      - outside_cut: "MX(0, dmr_days - DAYS(dmr_dos, NOW)) if (dmr_dos != None and DAYS(F('transition_start_date'), dmr_dos) >= 0) else (MX(0, emg_days - DAYS(emg_date, NOW)) if (emg_date != None and DAYS(F('transition_start_date'), emg_date) >= 0) else 0)"
      - ntc_n: "COUNT('formulary_notices', drug_name='Xarelto')"
      - ntc_date: "LATEST('formulary_notices','notice_date', date_field='notice_date', drug_name='Xarelto')"
      - ntc_eff: "LATEST('formulary_notices','change_effective_date', date_field='notice_date', drug_name='Xarelto')"
      - notice_ext: "K('missing_notice_extension_days') if (ntc_n == 0 and F('formulary_change_date') != '') else ((P('midyear_negative_change_notice_days') - DAYS(ntc_date, ntc_eff)) if (ntc_n > 0 and DAYS(ntc_date, ntc_eff) < P('midyear_negative_change_notice_days')) else 0)"
      - m_choice: "CFIELD('retail','maintenance_choice')"
      - m_listed: "'Xarelto' in CPARAM('retail','maintenance_drugs')"
      - m_program: "CPARAM('retail','maintenance_program')"
      - mail_bridge: "CPARAM('mail','standard_shipping_business_days') if (m_choice == 'home_delivery' and m_listed) else (K('maintenance_choice_grace_days') if (m_choice == 'undecided' and m_listed and (m_program == 'mandatory_after_courtesy' or m_program == 'retail90_or_mail')) else 0)"
      - raw_days: "sync_len - retail_onhand - outside_cut + notice_ext + mail_bridge"
      - result: "int(MN(P('transition_fill_days_supply'), MX(0, raw_days)))"
    compute_basis:
      ts_sp_n: "when the records carry a specialty transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that supply's last day (its days supply less the days from its fill date to the handling date)"
      ts_sp_days: "when the records carry a specialty transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that supply's last day (its days supply less the days from its fill date to the handling date)"
      ts_sp_date: "when the records carry a specialty transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that supply's last day (its days supply less the days from its fill date to the handling date)"
      ts_hd_n: "when no such specialty supply is running but the records carry a home-delivery transition supply of another drug dated inside the window that is still running, the starting length is the days from the handling date through that supply's last day, counted the same way"
      ts_hd_days: "when no such specialty supply is running but the records carry a home-delivery transition supply of another drug dated inside the window that is still running, the starting length is the days from the handling date through that supply's last day, counted the same way"
      ts_hd_date: "when no such specialty supply is running but the records carry a home-delivery transition supply of another drug dated inside the window that is still running, the starting length is the days from the handling date through that supply's last day, counted the same way"
      sp_run: "when the records carry a specialty transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that supply's last day (its days supply less the days from its fill date to the handling date)"
      hd_run: "when no such specialty supply is running but the records carry a home-delivery transition supply of another drug dated inside the window that is still running, the starting length is the days from the handling date through that supply's last day, counted the same way"
      sync_len: "The starting length of a retail transition supply follows the member's other transition supplies so that they run out together: when the records carry a specialty transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that supply's last day (its days supply less the days from its fill date to the handling date); when no such specialty supply is running but the records carry a home-delivery transition supply of another drug dated inside the window that is still running, the starting length is the days from the handling date through that supply's last day, counted the same way; in every other case the starting length is the formulary's maximum days supply for one transition fill."
      rx_days: "Supply of the drug still on hand from the member's latest paid retail fill is deducted"
      rx_dos: "when that fill has days not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date) and the share of it already elapsed has reached the retail network's early-refill threshold for non-controlled drugs, the days not yet elapsed are deducted"
      rx_left: "when that fill has days not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date) and the share of it already elapsed has reached the retail network's early-refill threshold for non-controlled drugs, the days not yet elapsed are deducted"
      refill_thr: "when that fill has days not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date) and the share of it already elapsed has reached the retail network's early-refill threshold for non-controlled drugs, the days not yet elapsed are deducted"
      retail_onhand: "Supply of the drug still on hand from the member's latest paid retail fill is deducted: when that fill has days not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date) and the share of it already elapsed has reached the retail network's early-refill threshold for non-controlled drugs, the days not yet elapsed are deducted; when it has days not yet elapsed but the share already elapsed is below that threshold, the days not yet elapsed are deducted together with the network's refill tolerance (the fill's days supply multiplied by one minus the threshold, rounded down to whole days); in every other case nothing is deducted for it."
      dmr_dos: "when the member has submitted a paper claim for the drug with a date of service on or after the transition start date, the days of that purchase not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date, never less than zero) are deducted"
      dmr_days: "when the member has submitted a paper claim for the drug with a date of service on or after the transition start date, the days of that purchase not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date, never less than zero) are deducted"
      emg_date: "when there is no such paper claim but a retail emergency-supply override for the drug was granted on or after the transition start date, the days of the override supply not yet elapsed on the handling date (the days supply it allowed less the days from its granted date to the handling date, never less than zero) are deducted"
      emg_days: "when there is no such paper claim but a retail emergency-supply override for the drug was granted on or after the transition start date, the days of the override supply not yet elapsed on the handling date (the days supply it allowed less the days from its granted date to the handling date, never less than zero) are deducted"
      outside_cut: "Supply the member obtained outside the transition benefit since the transition window opened is deducted: when the member has submitted a paper claim for the drug with a date of service on or after the transition start date, the days of that purchase not yet elapsed on the handling date (its days supply less the days from its date of service to the handling date, never less than zero) are deducted; when there is no such paper claim but a retail emergency-supply override for the drug was granted on or after the transition start date, the days of the override supply not yet elapsed on the handling date (the days supply it allowed less the days from its granted date to the handling date, never less than zero) are deducted; in every other case nothing is deducted for outside supply."
      ntc_n: "when the member was moved to the formulary by a sponsor formulary change and the records carry no formulary change notice for the drug, the missing-notice extension is added"
      ntc_date: "when the latest change notice for the drug was sent fewer days before its change effective date than the formulary's advance-notice period for negative changes, the shortfall (that advance-notice period less the days from the notice date to the change effective date) is added"
      ntc_eff: "when the latest change notice for the drug was sent fewer days before its change effective date than the formulary's advance-notice period for negative changes, the shortfall (that advance-notice period less the days from the notice date to the change effective date) is added"
      notice_ext: "A late-notice extension is added when the member was not told of the change in time: when the member was moved to the formulary by a sponsor formulary change and the records carry no formulary change notice for the drug, the missing-notice extension is added; when the latest change notice for the drug was sent fewer days before its change effective date than the formulary's advance-notice period for negative changes, the shortfall (that advance-notice period less the days from the notice date to the change effective date) is added; in every other case no late-notice extension is added."
      m_choice: "when the member's retail maintenance choice is home delivery and the drug is on the retail network's maintenance list, the standard shipping time of the member's home delivery program in business days is added"
      m_listed: "when the member's retail maintenance choice is home delivery and the drug is on the retail network's maintenance list, the standard shipping time of the member's home delivery program in business days is added"
      m_program: "when the maintenance choice is still undecided, the drug is on the maintenance list and the network applies its maintenance rule after the courtesy fills (whether that rule sends the drug to home delivery only or to home delivery or a ninety-day retail fill), the maintenance-choice grace is added"
      mail_bridge: "A home-delivery bridge is added for maintenance drugs that are moving to the mail: when the member's retail maintenance choice is home delivery and the drug is on the retail network's maintenance list, the standard shipping time of the member's home delivery program in business days is added; when the maintenance choice is still undecided, the drug is on the maintenance list and the network applies its maintenance rule after the courtesy fills (whether that rule sends the drug to home delivery only or to home delivery or a ninety-day retail fill), the maintenance-choice grace is added; in every other case no home-delivery bridge is added."
      raw_days: "The order is fixed: the starting length comes first; the retail on-hand deduction and the outside-supply deduction are subtracted from it and the late-notice extension and the home-delivery bridge are added to it; only then are the floor of zero and the cap of the formulary's maximum days supply for one transition fill applied, and the result is taken as a whole number of days."
      result: "The standard retail transition supply runs for the formulary's maximum days supply for one transition fill, never less than zero and never more than that maximum."
    factors:
      - id: retail_run_out_alignment
        effect: method
        decides: sync_len
        bindings: [ts_sp_n, ts_sp_days, ts_sp_date, ts_hd_n, ts_hd_days, ts_hd_date, sp_run, hd_run, sync_len]
        ladder:
          - when: "a specialty transition supply of another drug dated inside the current window is still running on the handling date"
            method: "start from the days through that specialty supply's last day"
          - when: "no specialty transition supply is running AND a home-delivery transition supply of another drug dated inside the window is still running"
            method: "start from the days through that home-delivery supply's last day"
          - when: "otherwise"
            method: "start from the formulary's maximum days supply for one transition fill"
        baseline:
          sync_len: "P('transition_fill_days_supply')"
        evidence: [history, date]
        cross_difficulty: null
      - id: retail_onhand_deduction
        effect: method
        decides: retail_onhand
        bindings: [rx_days, rx_dos, rx_left, refill_thr, retail_onhand]
        ladder:
          - when: "the latest paid retail fill has days not yet elapsed AND the share elapsed has reached the network's early-refill threshold"
            method: "deduct the days not yet elapsed"
          - when: "the latest paid retail fill has days not yet elapsed AND the share elapsed is below that threshold"
            method: "deduct the days not yet elapsed plus the network's refill tolerance (days supply times one minus the threshold, rounded down)"
          - when: "otherwise"
            method: "deduct nothing"
        baseline:
          retail_onhand: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: retail
      - id: outside_supply_deduction
        effect: parameter
        decides: outside_cut
        bindings: [dmr_dos, dmr_days, emg_date, emg_days, outside_cut]
        ladder:
          - when: "a paper claim for the drug carries a date of service on or after the transition start date"
            value: "the days of that purchase not yet elapsed on the handling date"
          - when: "no such paper claim AND a retail emergency-supply override for the drug was granted on or after the transition start date"
            value: "the days of the override supply not yet elapsed on the handling date"
          - when: "otherwise"
            value: "0"
        baseline:
          outside_cut: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: retail
      - id: late_notice_extension
        effect: parameter
        decides: notice_ext
        bindings: [ntc_n, ntc_date, ntc_eff, notice_ext]
        ladder:
          - when: "the assignment carries a sponsor formulary change date AND no formulary change notice for the drug is on record"
            value: "K('missing_notice_extension_days')"
          - when: "the latest change notice for the drug was sent with fewer days' lead than the formulary's advance-notice period for negative changes"
            value: "the shortfall: that period less the notice's actual lead in days"
          - when: "otherwise"
            value: "0"
        baseline:
          notice_ext: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: home_delivery_bridge
        effect: parameter
        decides: mail_bridge
        bindings: [m_choice, m_listed, m_program, mail_bridge]
        ladder:
          - when: "the member's retail maintenance choice is home delivery AND the drug is on the network's maintenance list"
            value: "CPARAM('mail','standard_shipping_business_days')"
          - when: "the maintenance choice is undecided AND the drug is on the maintenance list AND the network applies its maintenance rule after the courtesy fills"
            value: "K('maintenance_choice_grace_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          mail_bridge: "0"
        evidence: [cross_category]
        cross_difficulty: retail
    baseline:
      rule: >-
        The standard retail transition supply runs for the formulary's maximum days supply for one transition fill, never less than zero and never more than that maximum.
      params: [transition_fill_days_supply]
    inputs:
      history:
        - {table: formulary_transition_fills, aggregate: count, field: formulary_transition_fill_id, filters: {dispensing_channel: specialty}}
        - {table: formulary_notices, aggregate: count, field: formulary_notice_id, filters: {drug_name: Xarelto}}
        - {category: retail, table: retail_claims, aggregate: latest, field: days_supply, filters: {event_type: retail_claim_paid, drug_name: Xarelto}}
        - {category: retail, table: retail_reimbursements, aggregate: latest, field: days_supply, filters: {event_type: retail_dmr_submitted, drug_name: Xarelto}}
      cross_category: [retail, mail]
  - id: formulary_ext_home_delivery_transition_days
    base_policy_refs: [formulary_transition_supply]
    overwrite: []
    trigger: state_due
    subject: [formulary_transition_fill]
    computes: days_supply
    target_tool: record_home_delivery_transition_supply_6840b972
    params:
      pending_expedited_extension_days: 3
      pending_standard_extension_days: 7
      standard_ship_allowance_days: 2
    rule: >-
      A home-delivery transition supply is the temporary supply of a non-formulary drug that the home delivery pharmacy ships to a member inside the member's transition window, and its days supply is worked out from the member's records as follows.
      A home-delivery transition supply is not dispensed until the records carry an exception request for the drug received on or after the transition start date.
      A home-delivery transition supply's days supply is fixed only after the records carry, for every non-formulary drug whose retail fills were still running on the transition start date, a retail transition supply dated inside the current transition window.
      The standard home-delivery transition supply runs for the formulary's maximum days supply for one transition fill, never less than zero and never more than that maximum.
      One dose cycle of the drug is the days supply of the member's latest shipped home delivery order of it divided by that order's quantity.
      The starting length of a home-delivery transition supply is set in whole dose cycles against the member's other transition supplies: when the records carry a retail transition supply of another drug dated inside the current transition window that is still running on the handling date, the starting length is the days from the handling date through that retail supply's last day (its days supply less the days from its fill date to the handling date), rounded down to whole dose cycles; when no such retail supply is running but the records carry a specialty transition supply of another drug dated inside the window that is still running, the starting length is the days through that specialty supply's last day, rounded down to whole dose cycles in the same way; in every other case the starting length is the formulary's maximum days supply for one transition fill.
      A pending-request extension is added while an exception request for the drug awaits its decision: when the records carry more exception requests for the drug than decisions and withdrawals on them and the latest request is expedited, the expedited pending extension is added; when they carry such an undecided request and the latest request is standard, the standard pending extension is added; in every other case no pending-request extension is added.
      Supply of the drug still on hand from the member's latest shipped home delivery order is deducted: when that order has days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date) and the share of it already elapsed has reached the home delivery program's refill eligibility fraction, only the whole dose cycles still on hand are deducted (the days not yet elapsed divided by the dose-cycle length, rounded down to a whole number and multiplied by that length); when it has days not yet elapsed but the share already elapsed is below that fraction, all the days not yet elapsed are deducted; in every other case nothing is deducted for it.
      A shipping allowance is added for the time the shipment takes: when the member's latest shipped home delivery order of the drug went by cold-chain shipping, the standard shipping time of the member's home delivery program in business days is added; when it went by standard shipping, the standard-shipping allowance is added; in every other case no shipping allowance is added.
      A prescription processing allowance is added for the time the home delivery pharmacy needs before it ships: when the home delivery pharmacy received a prescription for the drug after the latest shipped order at a strength different from that order's, the program's new-prescription processing time in business days is added; when no such new-strength prescription is on file but the drug has a prescription on file at the home delivery pharmacy, the program's refill processing time in business days is added; in every other case no processing allowance is added.
      The order is fixed: the starting length comes first; the pending-request extension, the shipping allowance and the processing allowance are added to it and the home-delivery on-hand deduction is subtracted from it; only then are the floor of zero and the cap of the formulary's maximum days supply for one transition fill applied, and the result is taken as a whole number of days.
    prerequisite:
      - problem: formulary_ext_retail_transition_days
        kind: value_input
        gate: hd_sync_len
        form: state
        policy_source: >-
          A home-delivery transition supply's days supply is fixed only after the records carry, for every non-formulary drug whose retail fills were still running on the transition start date, a retail transition supply dated inside the current transition window.
        condition: >-
          formulary_transition_fills holds, under the member's assignment, for every non-formulary drug a row for that drug with dispensing_channel retail and a fill_date on or after the assignment's transition_start_date, the drugs being those whose latest paid retail claim (date of service plus days supply) still ran on the transition start date.
        resolved_by: record_retail_transition_supply_5b1515b2
        effect: >-
          Once the retail transition supply is on record and still running, the starting length of the home-delivery transition supply becomes the days through that retail supply's last day rounded down to whole dose cycles, instead of the days through a specialty supply or the formulary's maximum days supply for one transition fill.
      - problem: formulary_ext_member_request_priority
        kind: value_input
        gate: pending_ext
        form: state
        policy_source: >-
          A home-delivery transition supply is not dispensed until the records carry an exception request for the drug received on or after the transition start date.
        condition: >-
          formulary_exceptions holds, under the member's assignment, a formulary_exception_requested row for the drug whose event_at falls on or after the assignment's transition_start_date.
        resolved_by: submit_member_exception_request_38483004
        effect: >-
          Once that request is on record and undecided, the pending-request extension of the home-delivery transition supply becomes the expedited or the standard pending extension according to the request's priority, instead of nothing.
    cross_category:
      - category: mail
        as: history
        reads: [mail_orders.days_supply, mail_orders.quantity, mail_orders.order_date, mail_orders.shipping_method, mail_orders.drug_strength, mail_prescriptions.received_date, mail_prescriptions.drug_strength, variant_name]
        note: The member's latest shipped home delivery order and prescriptions on file for the drug, and the home delivery program's refill eligibility fraction, shipping and processing times, decide the dose cycle, the home-delivery on-hand deduction, the shipping allowance and the processing allowance.
    compute:
      - mo_days: "XLATEST('mail','mail_orders','days_supply', date_field='order_date', event_type='mail_order_shipped', drug_name='Mounjaro')"
      - mo_qty: "XLATEST('mail','mail_orders','quantity', date_field='order_date', event_type='mail_order_shipped', drug_name='Mounjaro')"
      - mo_date: "XLATEST('mail','mail_orders','order_date', date_field='order_date', event_type='mail_order_shipped', drug_name='Mounjaro')"
      - hd_cycle: "mo_days / mo_qty"
      - ts_rt_n: "COUNT('formulary_transition_fills', dispensing_channel='retail')"
      - ts_rt_days: "LATEST('formulary_transition_fills','days_supply', date_field='fill_date', dispensing_channel='retail')"
      - ts_rt_date: "LATEST('formulary_transition_fills','fill_date', date_field='fill_date', dispensing_channel='retail')"
      - ts_sp2_n: "COUNT('formulary_transition_fills', dispensing_channel='specialty')"
      - ts_sp2_days: "LATEST('formulary_transition_fills','days_supply', date_field='fill_date', dispensing_channel='specialty')"
      - ts_sp2_date: "LATEST('formulary_transition_fills','fill_date', date_field='fill_date', dispensing_channel='specialty')"
      - rt_run: "(ts_rt_days - DAYS(ts_rt_date, NOW)) if (ts_rt_n > 0 and DAYS(F('transition_start_date'), ts_rt_date) >= 0) else 0"
      - sp2_run: "(ts_sp2_days - DAYS(ts_sp2_date, NOW)) if (ts_sp2_n > 0 and DAYS(F('transition_start_date'), ts_sp2_date) >= 0) else 0"
      - hd_sync_len: "int(rt_run / hd_cycle) * hd_cycle if rt_run > 0 else (int(sp2_run / hd_cycle) * hd_cycle if sp2_run > 0 else P('transition_fill_days_supply'))"
      - req_n: "COUNT('formulary_exceptions', event_type='formulary_exception_requested', drug_name='Mounjaro')"
      - dec_n: "COUNT('formulary_exceptions', event_type='formulary_exception_approved', drug_name='Mounjaro') + COUNT('formulary_exceptions', event_type='formulary_exception_denied', drug_name='Mounjaro') + COUNT('formulary_exceptions', event_type='formulary_exception_withdrawn', drug_name='Mounjaro')"
      - req_prio: "LATEST('formulary_exceptions','review_priority', date_field='event_at', event_type='formulary_exception_requested', drug_name='Mounjaro')"
      - pending_ext: "K('pending_expedited_extension_days') if (req_n > dec_n and req_prio == 'expedited') else (K('pending_standard_extension_days') if (req_n > dec_n and req_prio == 'standard') else 0)"
      - mo_left: "mo_days - DAYS(mo_date, NOW)"
      - refill_frac: "CPARAM('mail','refill_eligibility_fraction')"
      - hd_onhand: "int(mo_left / hd_cycle) * hd_cycle if (mo_left > 0 and DAYS(mo_date, NOW) / mo_days >= refill_frac) else (mo_left if mo_left > 0 else 0)"
      - mo_method: "XLATEST('mail','mail_orders','shipping_method', date_field='order_date', event_type='mail_order_shipped', drug_name='Mounjaro')"
      - ship_allow: "CPARAM('mail','standard_shipping_business_days') if mo_method == 'cold_chain' else (K('standard_ship_allowance_days') if mo_method == 'standard' else 0)"
      - mo_strength: "XLATEST('mail','mail_orders','drug_strength', date_field='order_date', event_type='mail_order_shipped', drug_name='Mounjaro')"
      - rx_recv: "XLATEST('mail','mail_prescriptions','received_date', date_field='received_date', drug_name='Mounjaro')"
      - rx_strength: "XLATEST('mail','mail_prescriptions','drug_strength', date_field='received_date', drug_name='Mounjaro')"
      - proc_allow: "CPARAM('mail','new_rx_processing_business_days') if (rx_recv != None and DAYS(mo_date, rx_recv) > 0 and rx_strength != mo_strength) else (CPARAM('mail','refill_processing_business_days') if rx_recv != None else 0)"
      - raw_days: "hd_sync_len + pending_ext + ship_allow + proc_allow - hd_onhand"
      - result: "int(MN(P('transition_fill_days_supply'), MX(0, raw_days)))"
    compute_basis:
      mo_days: "One dose cycle of the drug is the days supply of the member's latest shipped home delivery order of it divided by that order's quantity."
      mo_qty: "One dose cycle of the drug is the days supply of the member's latest shipped home delivery order of it divided by that order's quantity."
      mo_date: "when that order has days not yet elapsed on the handling date (its days supply less the days from its ship date to the handling date) and the share of it already elapsed has reached the home delivery program's refill eligibility fraction, only the whole dose cycles still on hand are deducted (the days not yet elapsed divided by the dose-cycle length, rounded down to a whole number and multiplied by that length)"
      hd_cycle: "One dose cycle of the drug is the days supply of the member's latest shipped home delivery order of it divided by that order's quantity."
