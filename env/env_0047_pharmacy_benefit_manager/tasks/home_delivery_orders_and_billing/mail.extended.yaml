        superseded_clause: >-
          it is credited back with reason shipping_fee_waived when the shipment misses its promised delivery because of the pharmacy or carrier
        replaced_by: >-
          The booked fee is first multiplied by the cause share and then by the replacement-travel share; the goodwill amount, the bridge allowance and the lost-supply allowance are then added to that returned portion; only the final amount is rounded to the nearest cent.
    trigger: state_due
