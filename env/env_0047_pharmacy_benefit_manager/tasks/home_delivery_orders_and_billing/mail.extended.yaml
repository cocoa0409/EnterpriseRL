events:
  - type: mail_register
    target: mail_accounts
    mutation: create
    meaning: A member registers for home delivery, or the first prescription for them arrives and the account is set up.
    grain: one row per account
    fields:
      customer_id: member
      variant_name: home delivery program the sponsor elected
      opened_date: registration date
      payment_method_on_file: payment method given at registration, or none
      shipping_zip: ZIP of the shipping address
      auto_refill_enrolled: false at registration unless the member opts in
      hold_reason: none
      payment_plan_months: 0
      balance_due: 0.00 at registration
    triggers: []
  - type: mail_activate
    target: mail_accounts
    mutation: {transition: {from: registered, to: active}}
    meaning: The account is completed and can dispense.
    grain: one row per transaction
    fields:
      payment_method_on_file: payment method confirmed
      shipping_zip: verified shipping ZIP
    triggers: []
  - type: mail_hold
    target: mail_accounts
    mutation: {transition: {from: active, to: on_hold}}
    meaning: The account is placed on hold and pending orders stop shipping.
    grain: one row per transaction
    fields:
      hold_reason: cause of the hold
    triggers: []
  - type: mail_release
    target: mail_accounts
    mutation: {transition: {from: on_hold, to: active}}
    meaning: The hold is cleared and held orders resume.
    grain: one row per transaction
    fields:
      hold_reason: none
    triggers: []
  - type: mail_close
    target: mail_accounts
    mutation:
      transition:
        - {from: registered, to: closed}
        - {from: active, to: closed}
        - {from: on_hold, to: closed}
    meaning: The member confirms closure of the home delivery account.
    grain: one row per transaction
    fields:
      closed_date: date of closure
    triggers: []
  - type: mail_preferences_update
    target: mail_accounts
    mutation: update
    meaning: The member changes automatic refill enrollment, payment method, shipping ZIP or payment plan on the account.
    grain: one row per transaction
    fields:
      auto_refill_enrolled: new automatic refill choice
      payment_method_on_file: new payment method type
      shipping_zip: new shipping ZIP
      payment_plan_months: installments of a payment plan put in place, or 0 when it ends
    triggers: []
  - type: mail_rx_received
    target: mail_prescriptions
    meaning: A prescription reaches the home delivery pharmacy (electronic, fax, mail-in or transfer from a retail pharmacy).
    grain: one row per prescription received
    distinguish_by: [rx_number]
    fields:
      rx_number: home delivery prescription number
      drug_name: drug
      drug_strength: strength
      prescriber_npi: prescriber
      rx_source: route of receipt
      transferred_from_npi: retail pharmacy for a transfer
      written_date: written date
      expiration_date: last fillable date
      refills_authorized: refills authorized
      quantity_per_fill: quantity per fill
      days_supply_per_fill: days supply per fill
      received_date: date received
    triggers: []
  - type: mail_order_placed
    target: mail_orders
    meaning: An order to fill one prescription is placed (new prescription, member request or automatic refill).
    grain: one row per order of one prescription fill
    distinguish_by: [mail_prescription_id, fill_number, order_source]
    fields:
      mail_prescription_id: prescription filled
      fill_number: fill sequence
      order_date: date placed
      order_source: what initiated it
      drug_name: drug
      drug_strength: strength
      days_supply: days supply requested
      shipping_method: shipping method chosen
    triggers: []
  - type: mail_order_shipped
    target: mail_orders
    meaning: A placed order is dispensed and shipped, and the member charge is added to the balance.
    grain: one row per shipped order
    distinguish_by: [source_order_id]
    fields:
      source_order_id: the order shipped
      mail_prescription_id: prescription filled
      fill_number: fill sequence
      order_date: ship date
      drug_name: drug
      quantity: quantity dispensed
      days_supply: days supply dispensed
      formulary_tier: tier adjudicated
      shipping_method: shipping method used
      allowed_amount: allowed cost
      deductible_amount: deductible portion
      copay_amount: cost share after deductible
      member_charge_amount: member charge
      accumulator_amount: out-of-pocket portion
      tracking_number: carrier tracking number
    account: home_delivery_balance
    direction: in
    triggers:
      - event: plan:plan_ded_post
        when: {deductible_amount: {not: 0}}
        map: {amount: deductible_amount, accrual_date: order_date, source_type: pharmacy_claim, source_reference_id: source_order_id, channel: home_delivery, funding_source: member_paid, formulary_tier: formulary_tier, claim_allowed_amount: allowed_amount}
      - event: plan:plan_oop_post
        when: {accumulator_amount: {not: 0}}
        map: {amount: accumulator_amount, accrual_date: order_date, source_type: pharmacy_claim, source_reference_id: source_order_id, channel: home_delivery, funding_source: member_paid, formulary_tier: formulary_tier, claim_allowed_amount: allowed_amount}
  - type: mail_shipping_charged
    target: mail_orders
    meaning: A fee for member-requested expedited shipping is added to the balance for one shipped order.
    grain: one row per shipping fee charged on one order
    distinguish_by: [source_order_id, shipping_method]
    fields:
      source_order_id: the order the fee belongs to
      order_date: date charged
      shipping_method: two_day or overnight
      shipping_fee: fee charged
    account: home_delivery_balance
    direction: in
    triggers: []
  - type: mail_order_cancelled
    target: mail_orders
    meaning: A placed order is cancelled before dispensing.
    grain: one row per cancelled order
    distinguish_by: [source_order_id]
    fields:
      source_order_id: the order cancelled
      mail_prescription_id: prescription of the order
      order_date: cancellation date
      drug_name: drug
      cancel_reason: why it was cancelled
    triggers: []
  - type: mail_order_replaced
    target: mail_orders
    meaning: A replacement of a shipped order is sent at no charge because it was lost, damaged, temperature-compromised or dispensed in error.
    grain: one row per replacement shipment of one order
    distinguish_by: [source_order_id, replacement_reason]
    fields:
      source_order_id: the original order replaced
      mail_prescription_id: prescription of the order
      order_date: date the replacement shipped
      order_source: replacement
      drug_name: drug
      quantity: quantity replaced
      days_supply: days supply replaced
      replacement_reason: why it was replaced
      tracking_number: tracking number of the replacement
    triggers: []
  - type: mail_payment_posted
    target: mail_payments
    meaning: A member payment is applied to the balance.
    grain: one row per payment
    distinguish_by: [payment_date, amount, payment_method, installment_number]
    fields:
      payment_date: posting date
      amount: amount paid
      payment_method: instrument used
      installment_number: installment sequence, or 0
    account: home_delivery_balance
    direction: out
    triggers: []
  - type: mail_credit_issued
    target: mail_payments
    meaning: A credit lowers the balance (pharmacy error, waived shipping fee, or small balance written off at closure).
    grain: one row per credit for one order or one closure
    distinguish_by: [source_order_id, credit_reason, payment_date]
    fields:
      source_order_id: the order credited (empty for a small-balance write-off)
      payment_date: posting date
      amount: amount credited
      credit_reason: reason for the credit
      deductible_amount: deductible portion of a pharmacy-error credit
      accumulator_amount: out-of-pocket portion of a pharmacy-error credit
    account: home_delivery_balance
    direction: out
    triggers:
      - event: plan:plan_ded_reverse
        when: {credit_reason: pharmacy_error, deductible_amount: {not: 0}}
        map: {amount: deductible_amount, accrual_date: payment_date, source_type: pharmacy_claim, source_reference_id: source_order_id, channel: home_delivery}
      - event: plan:plan_oop_reverse
        when: {credit_reason: pharmacy_error, accumulator_amount: {not: 0}}
        map: {amount: accumulator_amount, accrual_date: payment_date, source_type: pharmacy_claim, source_reference_id: source_order_id, channel: home_delivery}
  - type: mail_refund_issued
    target: mail_payments
    meaning: A credit balance is refunded to the member's payment method, bringing the balance back toward zero.
    grain: one row per refund
    distinguish_by: [payment_date, amount]
    fields:
      payment_date: refund date
      amount: amount refunded
      payment_method: instrument refunded to
    account: home_delivery_balance
    direction: in
    triggers: []

measures:
  - id: mail_msr_replacements_ytd
    window: current plan year of the member's plan enrollment, from plan_year_start_date through frozen_time, inclusive
    measure: count of mail_order_replaced rows on this account whose replacement_reason is lost_in_transit, damaged or temperature_excursion
  - id: mail_msr_days_since_last_fill
    window: from the order_date of the latest mail_order_shipped row for the same mail_prescription_id through frozen_time
    measure: calendar days elapsed, compared with the days_supply of that shipped row

policies:
  - id: mail_agg_multi_holding
    subject: [mail_register]
    rule: >-
      A member holds at most one home delivery account that is not closed; family members each hold their own.
      A new account may be registered only when the member has no account that is registered, active or on_hold.
    eligibility:
      - id: one_open_account
        applies_to: [mail_register]
        kind: dedup
        condition: A new account may be registered only when the member has no account that is registered, active or on_hold.
        evidence_fields: [mail_accounts.customer_id, mail_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_accounts.customer_id]
          action_bindings:
            mail_accounts.customer_id: customer_id
        dedup_contract:
          table: mail_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [registered, active, on_hold]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 1

  - id: mail_order_cost_share
    subject: [mail_order_shipped]
    rule: >-
      A home delivery order starts from the plan's 30-day cost share for the drug's formulary tier (after any deductible portion, set by the plan's deductible rule).
      A supply of 30 days or fewer is charged one 30-day cost share; 31 to 60 days is charged band_31_60_multiplier times it; 61 days up to max_days_supply_mail is charged t1_61_100_multiplier, t2_61_100_multiplier or t3_61_100_multiplier times it for tiers 1, 2 and 3.
      When t1_zero_cost_share is true a tier 1 order is charged nothing beyond any deductible portion.
      Specialty-tier drugs are not dispensed by home delivery while specialty_dispensed_by_mail is false; such an order is cancelled with reason not_covered and the member is referred to the specialty pharmacy program.
      When retail_90_at_mail_cost_share is true, a 61-90 day maintenance supply filled at a participating retail pharmacy is charged this home delivery cost share.
      The member charge is never more than the allowed amount, and member_charge_amount is deductible_amount plus copay_amount; shipping fees are charged separately and never count toward the deductible or out-of-pocket.
    eligibility: []
    params:
      per_tier:
        Northbridge Home Delivery Voluntary: {t1: "=t1_61_100_multiplier", t2: "=t2_61_100_multiplier", t3: "=t3_61_100_multiplier"}
        Northbridge Home Delivery Standard: {t1: "=t1_61_100_multiplier", t2: "=t2_61_100_multiplier", t3: "=t3_61_100_multiplier"}
        Northbridge Home Delivery Maintenance 90: {t1: "=t1_61_100_multiplier", t2: "=t2_61_100_multiplier", t3: "=t3_61_100_multiplier"}
        Northbridge Home Delivery Advantage: {t1: "=t1_61_100_multiplier", t2: "=t2_61_100_multiplier", t3: "=t3_61_100_multiplier"}
        Northbridge Maintenance Choice: {t1: "=t1_61_100_multiplier", t2: "=t2_61_100_multiplier", t3: "=t3_61_100_multiplier"}
        Northbridge Home Delivery Premier: {t1: "=t1_61_100_multiplier", t2: "=t2_61_100_multiplier", t3: "=t3_61_100_multiplier"}
    formula:
      member_charge_amount: "min(deductible_amount + copay_amount, allowed_amount)"

  - id: mail_evt_order_dispense
    subject: [mail_order_placed, mail_order_shipped]
    rule: >-
      An order is placed only against a prescription on file at the home delivery pharmacy (mail_rx_received) that has not passed its expiration date (rx_valid_months after the written date, or controlled_rx_valid_days for a Schedule II drug) and has a fill remaining (fill_number not above refills_authorized).
      An order can be placed only for a prescription already on file for this account.
      A refill ships only once the fraction refill_eligibility_fraction of the previous shipped fill's days supply has elapsed (mail_msr_days_since_last_fill), and each fill is between min_days_supply_mail (except a first fill or a dose titration) and max_days_supply_mail days.
      A prescription has at most one open order: a new order may be placed only when no placed order for the same prescription is still unshipped and uncancelled.
      An order ships only while the account is active; while it is on_hold, placed orders wait, and an order still held order_hold_cancel_days after the hold date is cancelled with reason hold_expired.
      New prescriptions dispense within new_rx_processing_business_days and refills within refill_processing_business_days business days, then travel standard_shipping_business_days unless expedited.
      Controlled substances are dispensed only while controlled_dispensed_by_mail is true and with adult signature when signature_required_controlled is true.
    eligibility:
      - id: rx_on_file
        applies_to: [mail_order_placed]
        kind: authorization
        condition: An order can be placed only for a prescription already on file for this account.
        evidence_fields: [mail_prescriptions.mail_prescription_id, mail_prescriptions.expiration_date, mail_prescriptions.refills_authorized]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_prescriptions.mail_prescription_id]
          action_bindings:
            mail_prescriptions.mail_prescription_id: mail_prescription_id
      - id: one_open_order
        applies_to: [mail_order_placed]
        kind: dedup
        condition: a new order may be placed only when no placed order for the same prescription is still unshipped and uncancelled.
        evidence_fields: [mail_orders.mail_prescription_id, mail_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_orders.mail_prescription_id]
          action_bindings:
            mail_orders.mail_prescription_id: mail_prescription_id
        dedup_contract:
          table: mail_orders
          mode: separate_record
          object_bindings: {mail_prescription_id: mail_prescription_id}
          duplicate_filters: {event_type: [mail_order_placed]}
          distinct_fields: [fill_number]
      - id: ship_only_when_active
        applies_to: [mail_order_shipped]
        kind: state
        condition: An order ships only while the account is active; while it is on_hold, placed orders wait, and an order still held order_hold_cancel_days after the hold date is cancelled with reason hold_expired.
        evidence_fields: [mail_accounts.status, mail_accounts.mail_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_accounts.mail_account_id]
          action_bindings:
            mail_accounts.mail_account_id: mail_account_id
        state_contract:
          field: mail_accounts.status
          allowed: [active]
    measures: [mail_msr_days_since_last_fill]

  - id: mail_evt_credit_hold
    subject: [mail_hold, mail_release, mail_order_shipped]
    rule: >-
      Before an order ships, its member charge is added to the current balance due; when the result would exceed credit_limit the account is placed on hold with hold_reason balance_over_limit, unless a payment plan is in good standing and payment_plan_hold_exempt is true.
      A card that declines is retried card_decline_retries times before the account is placed on hold with payment_declined; a shipping address that fails verification places it on hold with address_unverified.
      The hold is released once its cause is cleared: for balance_over_limit, when payments bring the balance due plus the held orders' charges to credit_limit or less, or when a payment plan is set up; for payment_declined, when a working payment method is recorded and the overdue amount is collected; for address_unverified, when a verified address is recorded.
      A hold may be released only while the account is on_hold and only after the recorded cause has been cleared.
    eligibility:
      - id: release_after_cause_cleared
        applies_to: [mail_release]
        kind: authorization
        condition: A hold may be released only while the account is on_hold and only after the recorded cause has been cleared.
        evidence_fields: [mail_accounts.hold_reason, mail_accounts.balance_due, mail_accounts.mail_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_accounts.mail_account_id]
          action_bindings:
            mail_accounts.mail_account_id: mail_account_id
    formula:
      hold_required: "balance_due + member_charge_amount > credit_limit"

  - id: mail_evt_payment
    subject: [mail_payment_posted]
    rule: >-
      A payment lowers the balance due by its amount and is applied to the oldest charges first; a payment larger than the balance due leaves a credit balance.
      Payments are taken by credit card, debit card, check or, when hsa_fsa_card_accepted is true, an HSA or FSA card; each order charge is due within payment_due_days of shipment.
      A payment made as an installment of a payment plan carries its installment_number; other payments carry 0.
      A payment may be taken only on an account that is not closed.
    eligibility:
      - id: pay_open_account
        applies_to: [mail_payment_posted]
        kind: state
        condition: A payment may be taken only on an account that is not closed.
        evidence_fields: [mail_accounts.status, mail_accounts.mail_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_accounts.mail_account_id]
          action_bindings:
            mail_accounts.mail_account_id: mail_account_id
        state_contract:
          field: mail_accounts.status
          allowed: [registered, active, on_hold]

  - id: mail_payment_plan
    subject: [mail_preferences_update, mail_release]
    rule: >-
      When payment_plan_available is true a member whose balance due is at least payment_plan_min_balance may ask to pay it in up to payment_plan_max_months monthly installments; the request is taken as a payment_plan service request and the plan starts when the member confirms it.
      The installment amount is the balance due divided by the number of months chosen, rounded up to the cent, and the first installment is collected when the plan starts.
      A payment plan may be set up only when the balance due is at least payment_plan_min_balance and the months requested do not exceed payment_plan_max_months.
      While the plan is in good standing and payment_plan_hold_exempt is true, a balance_over_limit hold is released and new orders are not held for balance; a missed installment ends the plan.
    eligibility:
      - id: plan_threshold
        applies_to: [mail_preferences_update]
        kind: authorization
        condition: A payment plan may be set up only when the balance due is at least payment_plan_min_balance and the months requested do not exceed payment_plan_max_months.
        evidence_fields: [mail_accounts.balance_due, mail_accounts.mail_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_accounts.mail_account_id]
          action_bindings:
            mail_accounts.mail_account_id: mail_account_id
    formula:
      plan_monthly_amount: "balance_due / payment_plan_months"

  - id: mail_rx_transfer
    subject: [mail_rx_received]
    rule: >-
      When rx_transfer_allowed is true, a member may ask to move a prescription with refills remaining from a retail pharmacy to home delivery; the request is taken as an rx_transfer service request naming the drug, the retail pharmacy NPI and the retail prescription number, and the home delivery pharmacy obtains it within rx_transfer_processing_business_days business days.
      Schedule II controlled substances are never transferred (rx_transfer_controlled_allowed is false); the member needs a new prescription sent directly.
      A transferred prescription is recorded on file with rx_source transfer_from_retail and the retail pharmacy's NPI, keeping its original written date and expiration date and only the refills remaining at the retail pharmacy.
      A prescription received directly from the prescriber is recorded with its own route, and a prescription past its expiration date is not accepted.
      A transferred prescription can be recorded only for a transfer request already taken on this account.
    eligibility:
      - id: transfer_requested_first
        applies_to: [mail_rx_received]
        kind: authorization
        condition: A transferred prescription can be recorded only for a transfer request already taken on this account.
        evidence_fields: [mail_service_requests.mail_account_id, mail_service_requests.request_type, mail_service_requests.drug_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_service_requests.mail_account_id, mail_service_requests.drug_name]
          action_bindings:
            mail_service_requests.mail_account_id: mail_account_id
            mail_service_requests.drug_name: drug_name

  - id: mail_auto_refill
    subject: [mail_preferences_update, mail_order_placed]
    rule: >-
      When auto_refill_available is true the member may enroll in automatic refills; an enrolled prescription is placed as an auto_refill order when auto_refill_lead_days of supply remain, provided a fill remains and the prescription has not expired.
      Drugs in auto_refill_excluded_drugs are never refilled automatically.
      Enrollment and withdrawal are recorded only at the member's own request, and preferences may be changed only while the account is registered, active or on_hold.
    eligibility:
      - id: preferences_open_account
        applies_to: [mail_preferences_update]
        kind: state
        condition: preferences may be changed only while the account is registered, active or on_hold.
        evidence_fields: [mail_accounts.status, mail_accounts.mail_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_accounts.mail_account_id]
          action_bindings:
            mail_accounts.mail_account_id: mail_account_id
        state_contract:
          field: mail_accounts.status
          allowed: [registered, active, on_hold]

  - id: mail_shipping
    subject: [mail_shipping_charged]
    rule: >-
      Standard shipping costs standard_shipping_fee; when the member asks for two-day or overnight shipping, two_day_shipping_fee or overnight_shipping_fee is charged as a separate charge on that order.
      Temperature-sensitive drugs ship in insulated packaging with cold packs when temperature_sensitive_packaging is true, and drugs that must ship cold go cold_chain at cold_chain_shipping_fee, and that is never treated as a member-requested upgrade.
      Orders ship to US addresses including APO/FPO when apo_fpo_shipping is true and never abroad while international_shipping is false.
      An expedited fee is charged at most once per order; it is credited back with reason shipping_fee_waived when the shipment misses its promised delivery because of the pharmacy or carrier.
    eligibility:
      - id: one_fee_per_order
        applies_to: [mail_shipping_charged]
        kind: dedup
        condition: An expedited fee is charged at most once per order; it is credited back with reason shipping_fee_waived when the shipment misses its promised delivery because of the pharmacy or carrier.
        evidence_fields: [mail_orders.source_order_id, mail_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_orders.source_order_id]
          action_bindings:
            mail_orders.source_order_id: source_order_id
        dedup_contract:
          table: mail_orders
          mode: separate_record
          object_bindings: {source_order_id: source_order_id}
          duplicate_filters: {event_type: [mail_shipping_charged]}
          distinct_fields: []

  - id: mail_evt_replacement
    subject: [mail_order_replaced]
    rule: >-
      A shipment reported lost, damaged or temperature-compromised is replaced at no charge when it is reported no later than lost_shipment_report_days calendar days after its expected delivery date, the expected delivery date being day zero; a report made later is not replaced free and the member orders a refill under the refill rules.
      The expected delivery date is the ship date plus the transit business days of the shipping method used.
      Free replacements for lost, damaged or temperature-compromised shipments are limited to replacements_per_plan_year per account per plan year (mail_msr_replacements_ytd); beyond that the member pays for a new fill.
      An order dispensed in error is always replaced and, when pharmacy_error_full_credit is true, its charge is credited in full; medication is never taken back for credit while returns_accepted is false.
      Each shipped order is replaced at most once for the same reason.
    eligibility:
      - id: report_on_time
        applies_to: [mail_order_replaced]
        kind: time
        condition: A shipment reported lost, damaged or temperature-compromised is replaced at no charge when it is reported no later than lost_shipment_report_days calendar days after its expected delivery date, the expected delivery date being day zero; a report made later is not replaced free and the member orders a refill under the refill rules.
        evidence_fields: [mail_orders.order_date, mail_orders.shipping_method, mail_orders.source_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_orders.source_order_id]
          action_bindings:
            mail_orders.source_order_id: source_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its expected delivery date
          anchor_source: mail_orders.order_date
          relation: not_after
          duration_source: variants.lost_shipment_report_days
          unit: calendar_days
          counting_rule: the expected delivery date being day zero
          boundary: inclusive
      - id: replace_once_per_reason
        applies_to: [mail_order_replaced]
        kind: dedup
        condition: Each shipped order is replaced at most once for the same reason.
        evidence_fields: [mail_orders.source_order_id, mail_orders.replacement_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_orders.source_order_id]
          action_bindings:
            mail_orders.source_order_id: source_order_id
        dedup_contract:
          table: mail_orders
          mode: separate_record
          object_bindings: {source_order_id: source_order_id}
          duplicate_filters: {event_type: [mail_order_replaced]}
          distinct_fields: [replacement_reason]
    measures: [mail_msr_replacements_ytd]

  - id: mail_evt_cancel_credit
    subject: [mail_order_cancelled, mail_credit_issued]
    rule: >-
      A member may cancel an order up to order_cancel_cutoff; once dispensed it cannot be cancelled, and dispensed medication is never returned for credit.
      An order may be cancelled only when it has neither shipped nor been cancelled already.
      A cancelled order is never charged; a pharmacy-error credit equals the full member charge of the credited order and reverses its deductible and out-of-pocket postings.
      A small balance at or below small_balance_writeoff is credited with reason small_balance_writeoff only when the account closes.
    eligibility:
      - id: cancel_before_dispense
        applies_to: [mail_order_cancelled]
        kind: dedup
        condition: An order may be cancelled only when it has neither shipped nor been cancelled already.
        evidence_fields: [mail_orders.source_order_id, mail_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_orders.source_order_id]
          action_bindings:
            mail_orders.source_order_id: source_order_id
        dedup_contract:
          table: mail_orders
          mode: separate_record
          object_bindings: {source_order_id: source_order_id}
          duplicate_filters: {event_type: [mail_order_shipped, mail_order_cancelled]}
          distinct_fields: []

  - id: mail_credit_balance_refund
    subject: [mail_refund_issued]
    rule: >-
      A credit balance larger than credit_balance_refund_threshold is refunded to the payment method on file within credit_balance_refund_days calendar days of arising; a smaller credit stays on the account and is used against the next order.
      On closure any credit balance is refunded regardless of size, to the payment method on file or by check when none is on file.
      A refund never exceeds the credit balance, so a refund may be issued only while the balance due is below zero.
    eligibility:
      - id: refund_only_credit
        applies_to: [mail_refund_issued]
        kind: authorization
        condition: A refund never exceeds the credit balance, so a refund may be issued only while the balance due is below zero.
        evidence_fields: [mail_accounts.balance_due, mail_accounts.mail_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_accounts.mail_account_id]
          action_bindings:
            mail_accounts.mail_account_id: mail_account_id

  - id: mail_account_closure
    subject: [mail_close]
    rule: >-
      Closing a home delivery account is the member's own decision: the agent takes an account_closure service request, and the account closes only when the member confirms it within closure_confirmation_days calendar days; an unconfirmed request lapses.
      An account can close only when its balance due is zero after any small_balance_writeoff credit and any credit-balance refund; a member who still owes more than small_balance_writeoff must pay it first.
      Open orders are cancelled at closure, automatic refills stop, and prescriptions on file remain transferable to a retail pharmacy.
      An account may be closed only after a closure request has been taken and only when its balance due is zero.
    eligibility:
      - id: closure_requested_and_settled
        applies_to: [mail_close]
        kind: authorization
        condition: An account may be closed only after a closure request has been taken and only when its balance due is zero.
        evidence_fields: [mail_service_requests.request_type, mail_service_requests.mail_account_id, mail_accounts.balance_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mail_service_requests.mail_account_id]
          action_bindings:
            mail_service_requests.mail_account_id: mail_account_id

  - id: mail_lifecycle
    subject: [mail_register, mail_activate]
    rule: >-
      An account is registered when the member signs up or the first prescription for them arrives, and is activated once a verified shipping address and a payment method (or the member's choice to be billed by statement) are recorded; a registered account dispenses nothing.
      The account belongs to the member and survives plan changes; its program tier is the one the member's current sponsor elected, and orders are adjudicated under the plan coverage in force on the ship date.
      A pharmacist is reachable around the clock when pharmacist_access_24x7 is true, and a balance statement is sent at statement_cycle while a balance is due.
    eligibility: []

extended_policies:
  - id: mail_ext_expedited_fee_catchup
    base_policy_refs: [mail_shipping]
    overwrite:
      - base_policy: mail_shipping
        superseded_clause: >-
          Standard shipping costs standard_shipping_fee; when the member asks for two-day or overnight shipping, two_day_shipping_fee or overnight_shipping_fee is charged as a separate charge on that order.
        replaced_by: >-
          The expedited fee follows the shipping method the member asked for on the placed order: an order the member asked to ship overnight is charged the program's overnight shipping fee, an order that went in cold-chain packaging is charged no expedited fee, because cold-chain shipping is required by the drug and is never a member-requested upgrade, and any other expedited order is charged the program's two-day shipping fee.
    trigger: state_due
    subject: [mail_shipping_charged]
    computes: shipping_fee
    target_tool: book_expedited_fee_b4b37c53
    params:
      saturday_overnight_surcharge: 8.0
      saturday_two_day_surcharge: 4.0
      remote_overnight_surcharge: 15.0
      remote_two_day_surcharge: 7.5
      frequent_high_count: 4
      frequent_low_count: 2
      frequent_high_discount: 0.25
      frequent_low_discount: 0.1
      long_standing_months: 60
      new_account_months: 12
      long_window_months: 24
      standard_window_months: 12
      short_window_months: 6
      late_booking_full_days: 30
      late_booking_cutoff_days: 60
      late_booking_daily_reduction: 0.01
    rule: >
      When the account's most recent shipment went out by an expedited method the member asked for and no expedited fee
      is booked on that order, the missing fee is booked now as one separate charge on that order.
      An expedited shipment the member asked for that carries no booked fee is charged the program's two-day shipping fee as one separate charge on that order, rounded to the nearest cent.
      The expedited fee follows the shipping method the member asked for on the placed order: an order the member asked to ship overnight is charged the program's overnight shipping fee, an order that went in cold-chain packaging is charged no expedited fee, because cold-chain shipping is required by the drug and is never a member-requested upgrade, and any other expedited order is charged the program's two-day shipping fee.
      A Saturday-delivery surcharge is added for the carrier's weekend handling: 8.00 when the member asked for overnight shipping and the order shipped on a Friday, 4.00 when the member asked for two-day shipping and the order shipped on a Thursday, and nothing in every other case.
      A remote-destination surcharge is added when the shipping ZIP code on the account lies in Alaska (99500 through 99999) or Hawaii (96700 through 96899): 15.00 when the shipment went out overnight to such a ZIP code, 7.50 when it went out two-day to such a ZIP code, and nothing in every other case.
      A frequent-expedite discount is taken off the fee and its surcharges together: 25 percent when four or more expedited fees are booked on the account within the review window, 10 percent when two or three are, and none when fewer than two are.
      The review window for the frequent-expedite discount depends on how long the account has been open on the handling date: for an account open 60 whole months or more the window covers expedited fees dated less than 24 whole months before the handling date, for an account open less than 12 whole months it covers those dated less than 6 whole months before, and for every other account it covers those dated less than 12 whole months before.
      A fee booked late is figured by how many calendar days separate the ship date from the handling date: within 30 days the fee is booked in full; from 31 through 60 days it is prorated, reduced by one percent of the fee for every day beyond the 30th; and after 60 days it is written off and no fee is booked.
      The fee, the Saturday surcharge and the remote surcharge are first added together; the discount is then taken off that sum; the late-booking share is then applied to the discounted amount; only the final amount is rounded to the nearest cent.
    prerequisite: []
    cross_category: []
    compute:
      - fx_src: "LATEST('mail_orders','source_order_id', date_field='order_date', event_type='mail_order_shipped')"
      - fx_ship_date: "LATEST('mail_orders','order_date', date_field='order_date', event_type='mail_order_shipped')"
      - fx_requested: "LATEST('mail_orders','shipping_method', date_field='order_date', event_type='mail_order_placed', mail_order_id=fx_src)"
      - fx_fee: "P('overnight_shipping_fee') if fx_requested == 'overnight' else (0.0 if fx_requested == 'cold_chain' else P('two_day_shipping_fee'))"
      - fx_weekday: "DAYS('2021-01-01', fx_ship_date) % 7"
      - fx_saturday: "K('saturday_overnight_surcharge') if (fx_requested == 'overnight' and fx_weekday == 0) else (K('saturday_two_day_surcharge') if (fx_requested == 'two_day' and fx_weekday == 6) else 0.0)"
      - fx_remote: "K('remote_overnight_surcharge') if (LATEST('mail_orders','shipping_method', date_field='order_date', event_type='mail_order_shipped') == 'overnight' and ('99500' <= F('shipping_zip') <= '99999' or '96700' <= F('shipping_zip') <= '96899')) else (K('remote_two_day_surcharge') if (LATEST('mail_orders','shipping_method', date_field='order_date', event_type='mail_order_shipped') == 'two_day' and ('99500' <= F('shipping_zip') <= '99999' or '96700' <= F('shipping_zip') <= '96899')) else 0.0)"
      - fx_tenure: "MONTHS(F('opened_date'), NOW)"
      - fx_window: "K('long_window_months') if fx_tenure >= K('long_standing_months') else (K('short_window_months') if fx_tenure < K('new_account_months') else K('standard_window_months'))"
      - fx_fee_count: "COUNT('mail_orders', within_months=fx_window, date_field='order_date', event_type='mail_shipping_charged')"
      - fx_discount: "K('frequent_high_discount') if fx_fee_count >= K('frequent_high_count') else (K('frequent_low_discount') if fx_fee_count >= K('frequent_low_count') else 0.0)"
      - fx_age: "DAYS(fx_ship_date, NOW)"
      - fx_late_share: "0.0 if fx_age > K('late_booking_cutoff_days') else ((1 - K('late_booking_daily_reduction') * (fx_age - K('late_booking_full_days'))) if fx_age > K('late_booking_full_days') else 1.0)"
      - result: "RND((fx_fee + fx_saturday + fx_remote) * (1 - fx_discount) * fx_late_share, 2)"
    compute_basis:
