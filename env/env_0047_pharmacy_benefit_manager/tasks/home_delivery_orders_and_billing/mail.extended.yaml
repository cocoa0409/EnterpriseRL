    rule: >
      When a shipment the member paid to expedite has been replaced because it was lost in transit, damaged or
      temperature-compromised and no missed-delivery credit is posted for that order, the missed-delivery credit is posted
      now against that order, worked out on the account's most recent replacement shipment.
      The missed-delivery credit returns the full expedited fee booked on the replaced shipment, rounded to the nearest cent.
      The share of the booked fee returned depends on why the shipment was replaced: half when it arrived damaged, because a damaged package still arrived on the promised day, three quarters when it arrived temperature-compromised, and all of it when it was lost in transit.
      The share returned is further adjusted by how the replacement travelled: half when the replacement went out overnight at no charge, three quarters when it went out two-day at no charge, and no adjustment when it went out by standard or cold-chain shipping.
      A repeat-failure goodwill amount is added by the number of the account's replacements for loss, damage or temperature (replacements for a pharmacy dispensing error are not counted) within the failure review window: 20.00 for three or more such replacements, 10.00 for exactly two, and nothing for fewer than two.
      The failure review window depends on how long the account has been open on the handling date: for an account open 60 whole months or more it covers replacements dated less than 24 whole months before the handling date, for an account open less than 12 whole months it covers replacements dated less than 6 whole months before, and for every other account it covers replacements dated less than 12 whole months before.
      A retail bridge allowance is added for a supply of the same drug bought at a retail pharmacy while the replacement was on its way, counted as paid retail claims for the replaced drug dated less than two whole months before the handling date: 15.00 for two or more such claims, 7.50 for exactly one, and nothing for none.
      A lost-supply allowance is added by the days supply of the replaced shipment: for a supply of 61 days or more it is figured per day, 0.05 for each day of the replaced supply; for a supply of 31 through 60 days it is a flat 2.50; and for a supply of 30 days or fewer there is none.
      The booked fee is first multiplied by the cause share and then by the replacement-travel share; the goodwill amount, the bridge allowance and the lost-supply allowance are then added to that returned portion; only the final amount is rounded to the nearest cent.
