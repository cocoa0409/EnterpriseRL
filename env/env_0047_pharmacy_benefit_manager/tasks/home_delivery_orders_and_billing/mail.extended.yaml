      - wv_repl_method: "LATEST('mail_orders','shipping_method', date_field='order_date', event_type='mail_order_replaced')"
      - wv_travel_share: "K('overnight_replacement_share') if wv_repl_method == 'overnight' else (K('two_day_replacement_share') if wv_repl_method == 'two_day' else 1.0)"
      - wv_tenure: "MONTHS(F('opened_date'), NOW)"
      - wv_window: "K('long_window_months') if wv_tenure >= K('long_standing_months') else (K('short_window_months') if wv_tenure < K('new_account_months') else K('standard_window_months'))"
      - wv_fail_count: "COUNT('mail_orders', within_months=wv_window, date_field='order_date', event_type='mail_order_replaced') - COUNT('mail_orders', within_months=wv_window, date_field='order_date', event_type='mail_order_replaced', replacement_reason='pharmacy_error')"
      - wv_goodwill: "K('repeat_high_goodwill') if wv_fail_count >= K('repeat_high_count') else (K('repeat_low_goodwill') if wv_fail_count >= K('repeat_low_count') else 0.0)"
      - wv_drug: "LATEST('mail_orders','drug_name', date_field='order_date', event_type='mail_order_replaced')"
      - wv_bridge_count: "XCOUNT('retail','retail_claims', within_months=2, date_field='date_of_service', event_type='retail_claim_paid', drug_name=wv_drug)"
      - wv_bridge: "K('bridge_two_claims') if wv_bridge_count >= 2 else (K('bridge_one_claim') if wv_bridge_count == 1 else 0.0)"
      - wv_days: "LATEST('mail_orders','days_supply', date_field='order_date', event_type='mail_order_shipped', source_order_id=wv_src)"
      - wv_supply: "K('per_day_allowance') * wv_days if wv_days >= K('long_supply_days') else (K('mid_supply_allowance') if wv_days >= K('mid_supply_days') else 0.0)"
      - result: "RND(wv_fee_booked * wv_cause_share * wv_travel_share + wv_goodwill + wv_bridge + wv_supply, 2)"
    compute_basis:
