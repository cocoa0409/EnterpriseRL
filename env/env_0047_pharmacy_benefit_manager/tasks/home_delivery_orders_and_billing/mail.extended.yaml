  - id: mail_ext_plan_down_payment
    base_policy_refs: [mail_evt_payment, mail_payment_plan]
    overwrite:
      - base_policy: mail_payment_plan
        superseded_clause: >-
          the first installment is collected when the plan starts
        replaced_by: >-
          Every payment plan carries a down payment collected from the member, and the plan's first installment falls due one month after the plan starts.
    trigger: on_request
    subject: [mail_payment_posted]
    computes: amount
    target_tool: pay_plan_down_payment_b796ac1b
    params:
      standard_rate: 0.1
      one_ended_rate: 0.25
      two_ended_rate: 0.35
      long_tenure_months: 60
      mid_tenure_months: 36
      per_year_cut: 0.005
      mid_tenure_cut: 0.02
      specialty_high_balance: 250.0
      specialty_high_cut: 0.05
      specialty_low_cut: 0.025
      new_account_months: 12
      long_window_months: 24
      standard_window_months: 12
      short_window_months: 6
      card_high_count: 6
      card_high_cut: 0.03
      card_low_cut: 0.01
      two_completed_cut: 0.04
      one_completed_cut: 0.02
      minimum_rate: 0.05
    rule: >
      When a member asks to pay the balance in monthly installments, a down payment is taken from the member.
      Every payment plan carries a down payment collected from the member, and the plan's first installment falls due one month after the plan starts.
      The down payment is fixed only after the account's most recent shipment, when it went out by an overnight or two-day service the member asked for, carries a booked expedited fee.
      The down payment is not fixed until the account's most recent replacement, when it replaced a shipment the member paid to expedite, carries a posted missed-delivery credit.
      The down payment is 10 percent of the balance due on the handling date, rounded to the nearest cent.
      The down-payment rate starts from the account's plan history: 35 percent when two or more payment-plan requests on the account are recorded as cancelled (the record of a plan that ended early because an installment was missed) and were requested less than 24 whole months before the handling date, 25 percent when exactly one such request is, and 10 percent when none is.
      The rate is reduced for account tenure: for an account open 60 whole months or more the reduction is figured per year, half a point for each whole year the account has been open; for an account open 36 through 59 whole months it is a flat 2 points; and an account open less than 36 whole months gets no reduction.
      The rate is reduced when the member also owes Northbridge Specialty Pharmacy: by 5 points when the balance due on the member's active specialty enrollment is 250.00 or more, by 2.5 points when that balance is above zero but under 250.00, and not at all when nothing is owed there.
      The rate is reduced for a card on file backed by card payments in the card review window: by 3 points when a credit, debit or HSA/FSA card is on file and six or more payments by such cards posted in the window, by 1 point when a card is on file and one to five such payments posted in the window, and not at all in every other case.
      The card review window depends on how long the account has been open on the handling date: for an account open 60 whole months or more it covers card payments dated less than 24 whole months before the handling date, for an account open less than 12 whole months it covers card payments dated less than 6 whole months before, and for every other account it covers card payments dated less than 12 whole months before.
      The rate is reduced for payment plans the member confirmed, recorded as completed payment-plan requests, that were requested less than 48 whole months before the handling date: by 4 points for two or more such requests, by 2 points for exactly one, and not at all for none.
      The reductions are subtracted from the starting rate, the resulting rate is never below 5 percent, and that rate is applied once to the balance due; only the final amount is rounded to the nearest cent.
    prerequisite:
      - problem: mail_ext_expedited_fee_catchup
        kind: value_input
        gate: dn_balance
        form: state
        policy_source: >-
          The down payment is fixed only after the account's most recent shipment, when it went out by an overnight or two-day service the member asked for, carries a booked expedited fee.
        condition: >-
          When the placed order of the account's most recent shipment asked for overnight or two-day shipping, a
          shipping-charge entry is booked against that order.
        resolved_by: book_expedited_fee_b4b37c53
        effect: >-
          Booking the missing expedited fee raises the balance due the down-payment rate is applied to, so the down payment
          rises by the rate times the fee booked.
      - problem: mail_ext_missed_delivery_credit
        kind: value_input
        gate: dn_balance
        form: state
        policy_source: >-
          The down payment is not fixed until the account's most recent replacement, when it replaced a shipment the member paid to expedite, carries a posted missed-delivery credit.
        condition: >-
          When the order replaced by the account's most recent replacement (for loss, damage or temperature) carries a booked
          expedited fee, a shipping-fee credit is also posted against that order.
        resolved_by: credit_missed_delivery_02a65815
        effect: >-
          Posting the missed-delivery credit lowers the balance due the down-payment rate is applied to, so the down payment
          falls by the rate times the credit posted.
    cross_category:
      - category: specialty
        as: branch
        reads: [balance_due, status]
        note: The specialty reduction reads the balance due on the member's active specialty enrollment.
    compute:
      - dn_balance: "F('balance_due')"
      - dn_ended: "COUNT('mail_service_requests', within_months=24, date_field='request_date', request_type='payment_plan', request_status='cancelled')"
      - dn_start_rate: "K('two_ended_rate') if dn_ended >= 2 else (K('one_ended_rate') if dn_ended == 1 else K('standard_rate'))"
      - dn_tenure: "MONTHS(F('opened_date'), NOW)"
      - dn_tenure_cut: "K('per_year_cut') * (dn_tenure // 12) if dn_tenure >= K('long_tenure_months') else (K('mid_tenure_cut') if dn_tenure >= K('mid_tenure_months') else 0.0)"
      - dn_spec_balance: "CFIELD('specialty','balance_due', status='active') or 0.0"
      - dn_spec_cut: "K('specialty_high_cut') if dn_spec_balance >= K('specialty_high_balance') else (K('specialty_low_cut') if dn_spec_balance > 0 else 0.0)"
      - dn_window: "K('long_window_months') if MONTHS(F('opened_date'), NOW) >= K('long_tenure_months') else (K('short_window_months') if MONTHS(F('opened_date'), NOW) < K('new_account_months') else K('standard_window_months'))"
      - dn_card_count: "COUNT('mail_payments', within_months=dn_window, date_field='payment_date', event_type='mail_payment_posted', payment_method='credit_card') + COUNT('mail_payments', within_months=dn_window, date_field='payment_date', event_type='mail_payment_posted', payment_method='debit_card') + COUNT('mail_payments', within_months=dn_window, date_field='payment_date', event_type='mail_payment_posted', payment_method='hsa_fsa_card')"
      - dn_card_cut: "K('card_high_cut') if (F('payment_method_on_file') != 'none' and dn_card_count >= K('card_high_count')) else (K('card_low_cut') if (F('payment_method_on_file') != 'none' and dn_card_count >= 1) else 0.0)"
      - dn_completed: "COUNT('mail_service_requests', within_months=48, date_field='request_date', request_type='payment_plan', request_status='completed')"
      - dn_completed_cut: "K('two_completed_cut') if dn_completed >= 2 else (K('one_completed_cut') if dn_completed == 1 else 0.0)"
      - dn_rate: "MX(dn_start_rate - dn_tenure_cut - dn_spec_cut - dn_card_cut - dn_completed_cut, K('minimum_rate'))"
      - result: "RND(dn_balance * dn_rate, 2)"
    compute_basis:
      dn_balance: "The down payment is 10 percent of the balance due on the handling date, rounded to the nearest cent."
      dn_ended: "35 percent when two or more payment-plan requests on the account are recorded as cancelled (the record of a plan that ended early because an installment was missed) and were requested less than 24 whole months before the handling date"
      dn_start_rate: "The down-payment rate starts from the account's plan history: 35 percent when two or more payment-plan requests on the account are recorded as cancelled (the record of a plan that ended early because an installment was missed) and were requested less than 24 whole months before the handling date, 25 percent when exactly one such request is, and 10 percent when none is."
      dn_tenure: "The rate is reduced for account tenure"
      dn_tenure_cut: "for an account open 60 whole months or more the reduction is figured per year, half a point for each whole year the account has been open; for an account open 36 through 59 whole months it is a flat 2 points; and an account open less than 36 whole months gets no reduction."
      dn_spec_balance: "The rate is reduced when the member also owes Northbridge Specialty Pharmacy"
      dn_spec_cut: "by 5 points when the balance due on the member's active specialty enrollment is 250.00 or more, by 2.5 points when that balance is above zero but under 250.00, and not at all when nothing is owed there."
      dn_window: "for an account open 60 whole months or more it covers card payments dated less than 24 whole months before the handling date, for an account open less than 12 whole months it covers card payments dated less than 6 whole months before, and for every other account it covers card payments dated less than 12 whole months before."
      dn_card_count: "six or more payments by such cards posted in the window"
      dn_card_cut: "The rate is reduced for a card on file backed by card payments in the card review window: by 3 points when a credit, debit or HSA/FSA card is on file and six or more payments by such cards posted in the window, by 1 point when a card is on file and one to five such payments posted in the window, and not at all in every other case."
      dn_completed: "The rate is reduced for payment plans the member confirmed, recorded as completed payment-plan requests, that were requested less than 48 whole months before the handling date"
      dn_completed_cut: "by 4 points for two or more completed plans, by 2 points for exactly one, and not at all for none."
      dn_rate: "The reductions are subtracted from the starting rate, the resulting rate is never below 5 percent, and that rate is applied once to the balance due"
      result: "only the final amount is rounded to the nearest cent."
    factors:
      - id: plan_history_start_rate
        effect: parameter
        decides: dn_start_rate
        bindings: [dn_ended, dn_start_rate]
        ladder:
          - when: "two or more payment-plan requests recorded as cancelled were requested less than 24 whole months ago"
            value: "K('two_ended_rate')"
          - when: "exactly one such cancelled request"
            value: "K('one_ended_rate')"
          - when: "otherwise"
            value: "K('standard_rate')"
        baseline:
          dn_start_rate: "K('standard_rate')"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_rate_reduction
        effect: method
        decides: dn_tenure_cut
        bindings: [dn_tenure, dn_tenure_cut]
        ladder:
          - when: "the account has been open 60 whole months or more"
            method: "the reduction is figured per year: half a point times the whole years the account has been open"
          - when: "the account has been open 36 through 59 whole months"
            method: "the reduction is a flat 2 points, whatever the years open"
          - when: "otherwise"
            method: "no reduction is figured"
        baseline:
          dn_tenure_cut: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: specialty_balance_reduction
        effect: parameter
        decides: dn_spec_cut
        bindings: [dn_spec_balance, dn_spec_cut]
        ladder:
          - when: "the active specialty enrollment carries a balance due of 250.00 or more"
            value: "K('specialty_high_cut')"
          - when: "the active specialty enrollment carries a balance due above zero but under 250.00"
            value: "K('specialty_low_cut')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          dn_spec_cut: "0.0"
        evidence: [cross_category]
        cross_difficulty: specialty
      - id: card_review_window
        effect: parameter
        decides: dn_window
        bindings: [dn_window]
        ladder:
          - when: "the account has been open 60 whole months or more"
            value: "K('long_window_months') (24 whole months)"
          - when: "the account has been open less than 12 whole months"
            value: "K('short_window_months') (6 whole months)"
          - when: "otherwise"
            value: "K('standard_window_months') (12 whole months)"
        baseline:
          dn_window: "K('standard_window_months')"
        evidence: [date]
        cross_difficulty: null
      - id: card_payment_reduction
        effect: parameter
        decides: dn_card_cut
        bindings: [dn_card_count, dn_card_cut]
        ladder:
          - when: "a card is on file and six or more card payments posted in the card review window"
            value: "K('card_high_cut')"
          - when: "a card is on file and one to five card payments posted in the card review window"
            value: "K('card_low_cut')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          dn_card_cut: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: completed_plan_reduction
        effect: parameter
        decides: dn_completed_cut
        bindings: [dn_completed, dn_completed_cut]
        ladder:
          - when: "two or more payment-plan requests recorded as completed were requested less than 48 whole months ago"
            value: "K('two_completed_cut')"
          - when: "exactly one such completed request"
            value: "K('one_completed_cut')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          dn_completed_cut: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The down payment is 10 percent of the balance due on the handling date, rounded to the nearest cent.
      params: [standard_rate]
    inputs:
      history:
        - {table: mail_service_requests, aggregate: count, field: mail_service_request_id, within_months: 48, filters: {request_type: payment_plan}}
        - {table: mail_payments, aggregate: count, field: mail_payment_id, within_months: 24, filters: {event_type: mail_payment_posted}}
      cross_category: [specialty]
  - id: mail_ext_installment_terms
    base_policy_refs: [mail_payment_plan, mail_auto_refill]
    overwrite:
      - base_policy: mail_payment_plan
        superseded_clause: >-
          may ask to pay it in up to payment_plan_max_months monthly installments
        replaced_by: >-
          A payment plan runs three months and its monthly installment is the balance due divided by the plan's months, rounded up to the cent.
      - base_policy: mail_payment_plan
        superseded_clause: >-
          The installment amount is the balance due divided by the number of months chosen, rounded up to the cent
        replaced_by: >-
          The financed amount, plus the re-enrollment charge and less the automatic-payment credit, is divided by the plan's months, and only that quotient is rounded up to the cent.
    trigger: on_request
    subject: [mail_preferences_update]
    computes: plan_monthly_amount
    target_tool: confirm_payment_plan_4c427b9b
    params:
      standard_months: 3
      long_history_months: 120
      long_history_shipments: 6
      mid_history_months: 12
      mid_history_shipments: 2
      specialty_high_balance: 500.0
      reenroll_recent_charge: 15.0
      reenroll_older_charge: 7.5
      autopay_high_credit: 5.0
      autopay_low_credit: 2.5
    rule: >
      When the member confirms a payment plan, the plan's length in months and its monthly installment are recorded on the
      account.
      The installment terms are not fixed until the member has made the plan's down payment.
      A payment plan runs three months and its monthly installment is the balance due divided by the plan's months, rounded up to the cent.
      A plan is lengthened for an established account: by two months when the account has been open 120 whole months or more and shows six or more shipped orders (replacement shipments are not counted) dated less than 12 whole months before the handling date, by one month when the account has been open at least 12 whole months and shows at least two such shipments without meeting the two-month test, and not at all in every other case.
      A plan is lengthened when the member also owes Northbridge Specialty Pharmacy: by two months when the balance due on the member's active specialty enrollment is 500.00 or more, by one month when that balance is above zero but under 500.00, and not at all when nothing is owed there.
      A plan is lengthened by the design of the member's pharmacy benefit plan: by two months for a high-deductible HSA design, by one month for a deductible-and-copay design, and not at all for a copay-only design.
      The plan never runs longer than the program's maximum plan length.
      The amount the plan finances depends on what is already on the balance: when member charges for shipments dated less than one whole month before the handling date are on the account, the plan finances the balance due less those charges, which are billed on their normal terms; when no such charges are present but expedited fees dated less than one whole month before the handling date are, the plan finances the balance due less those fees, which are billed on their normal terms; otherwise the plan finances the whole balance due.
      A re-enrollment charge is added to the financed amount: 15.00 when a payment-plan request on the account recorded as cancelled (the record of a plan that ended early because an installment was missed) was requested less than 24 whole months before the handling date, 7.50 when the most recent such request was made 24 through 47 whole months before, and nothing in every other case.
      An automatic-payment credit is taken off the financed amount when a credit, debit or HSA/FSA card is on file: 5.00 when two or more automatic refill orders were placed less than 12 whole months before the handling date, 2.50 when exactly one was, and nothing when none was or when no card is on file.
      The financed amount, plus the re-enrollment charge and less the automatic-payment credit, is divided by the plan's months, and only that quotient is rounded up to the cent.
    prerequisite:
      - problem: mail_ext_plan_down_payment
        kind: value_input
        gate: pl_balance
        form: action
        policy_source: >-
          The installment terms are not fixed until the member has made the plan's down payment.
        fallback_reason: >-
          The down payment posts as an ordinary member payment with no installment number and no marker of its purpose, so
          the payment records cannot tell it apart from any other member payment; the only record-visible trace, a lower
          balance due, is also left by every other payment and credit, so no state singles out the write this result
          waits on.
        condition: >-
          A member payment equal to the plan's down payment has posted on the account on the handling date, lowering the
          balance due the plan finances.
        resolved_by: pay_plan_down_payment_b796ac1b
        effect: >-
          The down payment lowers the balance due, and with it the financed amount and the monthly installment.
    cross_category:
      - category: specialty
        as: branch
        reads: [balance_due, status]
        note: The specialty lengthening reads the balance due on the member's active specialty enrollment.
      - category: plan
        as: branch
        reads: [plan_design_type]
        note: The plan-design lengthening reads the design type of the member's active pharmacy benefit plan.
    compute:
      - pl_balance: "F('balance_due')"
      - pl_tenure: "MONTHS(F('opened_date'), NOW)"
      - pl_shipments: "COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_shipped')"
      - pl_history_months: "2 if (pl_tenure >= K('long_history_months') and pl_shipments >= K('long_history_shipments')) else (1 if (pl_tenure >= K('mid_history_months') and pl_shipments >= K('mid_history_shipments')) else 0)"
      - pl_spec_balance: "CFIELD('specialty','balance_due', status='active') or 0.0"
      - pl_spec_months: "2 if pl_spec_balance >= K('specialty_high_balance') else (1 if pl_spec_balance > 0 else 0)"
      - pl_design: "CPARAM('plan','plan_design_type', status='active')"
      - pl_design_months: "2 if pl_design == 'hdhp_hsa' else (1 if pl_design == 'deductible_copay' else 0)"
      - pl_months: "MN(K('standard_months') + pl_history_months + pl_spec_months + pl_design_months, P('payment_plan_max_months'))"
      - pl_recent_charges: "SUM('mail_orders','member_charge_amount', within_months=1, date_field='order_date', event_type='mail_order_shipped')"
      - pl_recent_fees: "SUM('mail_orders','shipping_fee', within_months=1, date_field='order_date', event_type='mail_shipping_charged')"
      - pl_financed: "pl_balance - pl_recent_charges if pl_recent_charges > 0 else (pl_balance - pl_recent_fees if pl_recent_fees > 0 else pl_balance)"
      - pl_ended_recent: "COUNT('mail_service_requests', within_months=24, date_field='request_date', request_type='payment_plan', request_status='cancelled')"
      - pl_reenroll: "K('reenroll_recent_charge') if pl_ended_recent >= 1 else (K('reenroll_older_charge') if COUNT('mail_service_requests', within_months=48, date_field='request_date', request_type='payment_plan', request_status='cancelled') >= 1 else 0.0)"
      - pl_autopay: "K('autopay_high_credit') if (F('payment_method_on_file') != 'none' and COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_placed', order_source='auto_refill') >= 2) else (K('autopay_low_credit') if (F('payment_method_on_file') != 'none' and COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_placed', order_source='auto_refill') == 1) else 0.0)"
      - result: "int(RND((pl_financed + pl_reenroll - pl_autopay) / pl_months * 100, 6) + 0.999999) / 100"
    compute_basis:
      pl_balance: "A payment plan runs three months and its monthly installment is the balance due divided by the plan's months, rounded up to the cent."
      pl_tenure: "A plan is lengthened for an established account"
      pl_shipments: "shows six or more shipped orders (replacement shipments are not counted) dated less than 12 whole months before the handling date"
      pl_history_months: "by two months when the account has been open 120 whole months or more and shows six or more shipped orders (replacement shipments are not counted) dated less than 12 whole months before the handling date, by one month when the account has been open at least 12 whole months and shows at least two such shipments without meeting the two-month test, and not at all in every other case."
      pl_spec_balance: "A plan is lengthened when the member also owes Northbridge Specialty Pharmacy"
      pl_spec_months: "by two months when the balance due on the member's active specialty enrollment is 500.00 or more, by one month when that balance is above zero but under 500.00, and not at all when nothing is owed there."
      pl_design: "A plan is lengthened by the design of the member's pharmacy benefit plan"
      pl_design_months: "by two months for a high-deductible HSA design, by one month for a deductible-and-copay design, and not at all for a copay-only design."
      pl_months: "The plan never runs longer than the program's maximum plan length."
      pl_recent_charges: "when member charges for shipments dated less than one whole month before the handling date are on the account, the plan finances the balance due less those charges, which are billed on their normal terms"
      pl_recent_fees: "when no such charges are present but expedited fees dated less than one whole month before the handling date are, the plan finances the balance due less those fees, which are billed on their normal terms"
      pl_financed: "The amount the plan finances depends on what is already on the balance: when member charges for shipments dated less than one whole month before the handling date are on the account, the plan finances the balance due less those charges, which are billed on their normal terms; when no such charges are present but expedited fees dated less than one whole month before the handling date are, the plan finances the balance due less those fees, which are billed on their normal terms; otherwise the plan finances the whole balance due."
      pl_ended_recent: "15.00 when a payment-plan request on the account recorded as cancelled (the record of a plan that ended early because an installment was missed) was requested less than 24 whole months before the handling date"
      pl_reenroll: "A re-enrollment charge is added to the financed amount: 15.00 when a payment-plan request on the account recorded as cancelled (the record of a plan that ended early because an installment was missed) was requested less than 24 whole months before the handling date, 7.50 when the most recent such request was made 24 through 47 whole months before, and nothing in every other case."
      pl_autopay: "An automatic-payment credit is taken off the financed amount when a credit, debit or HSA/FSA card is on file: 5.00 when two or more automatic refill orders were placed less than 12 whole months before the handling date, 2.50 when exactly one was, and nothing when none was or when no card is on file."
      result: "The financed amount, plus the re-enrollment charge and less the automatic-payment credit, is divided by the plan's months, and only that quotient is rounded up to the cent."
    factors:
      - id: account_history_lengthening
        effect: parameter
        decides: pl_history_months
        bindings: [pl_tenure, pl_shipments, pl_history_months]
        ladder:
          - when: "the account has been open 120 whole months or more and shows six or more shipments in the last 12 whole months"
            value: "2 months"
          - when: "the account has been open at least 12 whole months and shows at least two shipments in the last 12 whole months, without meeting the first tier"
            value: "1 month"
          - when: "otherwise"
            value: "0 months"
        baseline:
          pl_history_months: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: specialty_balance_lengthening
        effect: parameter
        decides: pl_spec_months
        bindings: [pl_spec_balance, pl_spec_months]
        ladder:
          - when: "the active specialty enrollment carries a balance due of 500.00 or more"
            value: "2 months"
          - when: "the active specialty enrollment carries a balance due above zero but under 500.00"
            value: "1 month"
          - when: "otherwise"
            value: "0 months"
        baseline:
          pl_spec_months: "0"
        evidence: [cross_category]
        cross_difficulty: specialty
      - id: benefit_design_lengthening
        effect: parameter
        decides: pl_design_months
        bindings: [pl_design, pl_design_months]
        ladder:
          - when: "the member's active pharmacy benefit plan has a high-deductible HSA design"
            value: "2 months"
          - when: "the member's active pharmacy benefit plan has a deductible-and-copay design"
            value: "1 month"
          - when: "otherwise (copay-only design)"
            value: "0 months"
        baseline:
          pl_design_months: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: financed_amount_basis
        effect: method
        decides: pl_financed
        bindings: [pl_recent_charges, pl_recent_fees, pl_financed]
        ladder:
          - when: "member charges for shipments dated less than one whole month before the handling date are on the account"
            method: "the plan finances the balance due less those charges"
          - when: "no such charges are present but expedited fees dated less than one whole month before the handling date are"
            method: "the plan finances the balance due less those fees"
          - when: "otherwise"
            method: "the plan finances the whole balance due"
        baseline:
          pl_financed: "pl_balance"
        evidence: [history]
        cross_difficulty: null
      - id: reenrollment_charge
        effect: parameter
        decides: pl_reenroll
        bindings: [pl_ended_recent, pl_reenroll]
        ladder:
          - when: "a payment-plan request recorded as cancelled was made less than 24 whole months before the handling date"
            value: "K('reenroll_recent_charge')"
          - when: "the most recent such plan was requested 24 through 47 whole months before the handling date"
            value: "K('reenroll_older_charge')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          pl_reenroll: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: automatic_payment_credit
        effect: parameter
        decides: pl_autopay
        bindings: [pl_autopay]
        ladder:
          - when: "a card is on file and two or more automatic refill orders were placed in the last 12 whole months"
            value: "K('autopay_high_credit')"
          - when: "a card is on file and exactly one automatic refill order was placed in the last 12 whole months"
            value: "K('autopay_low_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          pl_autopay: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A payment plan runs three months and its monthly installment is the balance due divided by the plan's months, rounded up to the cent.
      params: [standard_months]
    inputs:
      history:
        - {table: mail_orders, aggregate: count, field: mail_order_id, within_months: 12, filters: {event_type: mail_order_shipped}}
        - {table: mail_orders, aggregate: sum, field: shipping_fee, within_months: 1, filters: {event_type: mail_shipping_charged}}
        - {table: mail_service_requests, aggregate: count, field: mail_service_request_id, within_months: 48, filters: {request_type: payment_plan}}
      cross_category: [specialty, plan]
  - id: mail_ext_dispensing_delay_credit
    base_policy_refs: [mail_evt_cancel_credit, mail_shipping, mail_evt_order_dispense]
    overwrite:
      - base_policy: mail_shipping
        superseded_clause: >-
          it is credited back with reason shipping_fee_waived when the shipment misses its promised delivery because of the pharmacy or carrier
        replaced_by: >-
          The returned portion of the booked fee and the courtesy amounts are added together, and only that sum is rounded to the nearest cent.
    trigger: state_due
    subject: [mail_credit_issued]
    computes: amount
    target_tool: credit_dispensing_delay_47b21103
    params:
      per_day_share: 0.25
      mid_delay_share: 0.75
      long_standing_months: 60
      new_account_months: 12
      long_window_months: 24
      standard_window_months: 12
      short_window_months: 6
      prior_two_credits: 15.0
      prior_one_credit: 7.5
      bridge_two_claims: 12.0
      bridge_one_claim: 6.0
      remote_overnight_courtesy: 5.0
      remote_two_day_courtesy: 2.5
      new_prescription_courtesy: 4.0
      auto_refill_courtesy: 2.0
    rule: >
      When the account's most recent shipment went out by an expedited method the member paid for, was dispensed later than
      the pharmacy's processing promise and carries no shipping-fee credit, a dispensing-delay credit is posted now against
      that order.
      The processing promise is the program's new-prescription processing business days for an order placed for a new prescription and the program's refill processing business days for any other order, and the dispensing delay is the number of business days (Monday through Friday) from the order date to the ship date, counting the ship date and not the order date, less those promised business days.
      The dispensing-delay credit returns the full expedited fee booked on the delayed order, rounded to the nearest cent.
      The share of the booked fee returned depends on the dispensing delay: for a delay of one or two business days it is figured per day, a quarter of the fee for each business day of delay; for a delay of three or four business days it is a flat three quarters; and for a delay of five business days or more it is all of the fee.
      A prior-failure courtesy amount is added by the number of shipping-fee credits already posted on the account within the prior-credit window: 15.00 for two or more, 7.50 for exactly one, and nothing for none.
      The prior-credit window depends on how long the account has been open on the handling date: for an account open 60 whole months or more it covers shipping-fee credits dated less than 24 whole months before the handling date, for an account open less than 12 whole months it covers credits dated less than 6 whole months before, and for every other account it covers credits dated less than 12 whole months before.
      A retail bridge courtesy amount is added for a supply of the delayed drug bought at a retail pharmacy, counted as paid retail claims for that drug dated less than three whole months before the handling date: 12.00 for two or more such claims, 6.00 for exactly one, and nothing for none.
      A remote-destination courtesy amount is added when the account's shipping ZIP code lies in Alaska (99500 through 99999) or Hawaii (96700 through 96899): 5.00 when the delayed order went out overnight to such a ZIP code, 2.50 when it went out two-day to such a ZIP code, and nothing in every other case.
      An order-origin courtesy amount is added by what initiated the delayed order: 4.00 for an order placed for a new prescription, 2.00 for an automatic refill order, and nothing for any other order.
      The returned portion of the booked fee and the courtesy amounts are added together, and only that sum is rounded to the nearest cent.
    prerequisite: []
    cross_category:
      - category: retail
        as: history
        reads: [retail_claims.event_type, retail_claims.drug_name, retail_claims.date_of_service]
        note: The retail bridge courtesy counts the member's paid retail claims for the delayed drug in the last three months.
    compute:
      - lt_src: "LATEST('mail_orders','source_order_id', date_field='order_date', event_type='mail_order_shipped')"
      - lt_ship: "LATEST('mail_orders','order_date', date_field='order_date', event_type='mail_order_shipped')"
      - lt_fee: "SUM('mail_orders','shipping_fee', event_type='mail_shipping_charged', source_order_id=lt_src)"
      - lt_promise: "P('new_rx_processing_business_days') if LATEST('mail_orders','order_source', date_field='order_date', event_type='mail_order_placed', mail_order_id=lt_src) == 'new_prescription' else P('refill_processing_business_days')"
      - lt_order: "LATEST('mail_orders','order_date', date_field='order_date', event_type='mail_order_placed', mail_order_id=lt_src)"
      - lt_span: "DAYS(lt_order, lt_ship)"
      - lt_weekday: "DAYS('2021-01-04', lt_order) % 7"
      - lt_bdays: "5 * (lt_span // 7) + ((lt_span % 7 >= 1) and ((lt_weekday + 1) % 7 < 5)) + ((lt_span % 7 >= 2) and ((lt_weekday + 2) % 7 < 5)) + ((lt_span % 7 >= 3) and ((lt_weekday + 3) % 7 < 5)) + ((lt_span % 7 >= 4) and ((lt_weekday + 4) % 7 < 5)) + ((lt_span % 7 >= 5) and ((lt_weekday + 5) % 7 < 5)) + ((lt_span % 7 >= 6) and ((lt_weekday + 6) % 7 < 5))"
      - lt_delay: "lt_bdays - lt_promise"
      - lt_delay_share: "K('per_day_share') * lt_delay if lt_delay <= 2 else (K('mid_delay_share') if lt_delay <= 4 else 1.0)"
      - lt_window: "K('long_window_months') if MONTHS(F('opened_date'), NOW) >= K('long_standing_months') else (K('short_window_months') if MONTHS(F('opened_date'), NOW) < K('new_account_months') else K('standard_window_months'))"
      - lt_prior_credits: "COUNT('mail_payments', within_months=lt_window, date_field='payment_date', event_type='mail_credit_issued', credit_reason='shipping_fee_waived')"
      - lt_prior_courtesy: "K('prior_two_credits') if lt_prior_credits >= 2 else (K('prior_one_credit') if lt_prior_credits == 1 else 0.0)"
      - lt_drug: "LATEST('mail_orders','drug_name', date_field='order_date', event_type='mail_order_shipped')"
      - lt_bridge_count: "XCOUNT('retail','retail_claims', within_months=3, date_field='date_of_service', event_type='retail_claim_paid', drug_name=lt_drug)"
      - lt_bridge: "K('bridge_two_claims') if lt_bridge_count >= 2 else (K('bridge_one_claim') if lt_bridge_count == 1 else 0.0)"
      - lt_remote: "K('remote_overnight_courtesy') if (LATEST('mail_orders','shipping_method', date_field='order_date', event_type='mail_order_shipped') == 'overnight' and ('99500' <= F('shipping_zip') <= '99999' or '96700' <= F('shipping_zip') <= '96899')) else (K('remote_two_day_courtesy') if (LATEST('mail_orders','shipping_method', date_field='order_date', event_type='mail_order_shipped') == 'two_day' and ('99500' <= F('shipping_zip') <= '99999' or '96700' <= F('shipping_zip') <= '96899')) else 0.0)"
      - lt_origin: "K('new_prescription_courtesy') if LATEST('mail_orders','order_source', date_field='order_date', event_type='mail_order_placed', mail_order_id=lt_src) == 'new_prescription' else (K('auto_refill_courtesy') if LATEST('mail_orders','order_source', date_field='order_date', event_type='mail_order_placed', mail_order_id=lt_src) == 'auto_refill' else 0.0)"
      - result: "RND(lt_fee * lt_delay_share + lt_prior_courtesy + lt_bridge + lt_remote + lt_origin, 2)"
    compute_basis:
      lt_src: "a dispensing-delay credit is posted now against that order."
      lt_ship: "the dispensing delay is the number of business days (Monday through Friday) from the order date to the ship date, counting the ship date and not the order date, less those promised business days."
      lt_fee: "The dispensing-delay credit returns the full expedited fee booked on the delayed order, rounded to the nearest cent."
      lt_promise: "The processing promise is the program's new-prescription processing business days for an order placed for a new prescription and the program's refill processing business days for any other order"
      lt_order: "the dispensing delay is the number of business days (Monday through Friday) from the order date to the ship date"
      lt_span: "the number of business days (Monday through Friday) from the order date to the ship date, counting the ship date and not the order date"
      lt_weekday: "business days (Monday through Friday)"
      lt_bdays: "the number of business days (Monday through Friday) from the order date to the ship date, counting the ship date and not the order date"
      lt_delay: "less those promised business days."
      lt_delay_share: "The share of the booked fee returned depends on the dispensing delay: for a delay of one or two business days it is figured per day, a quarter of the fee for each business day of delay; for a delay of three or four business days it is a flat three quarters; and for a delay of five business days or more it is all of the fee."
      lt_window: "for an account open 60 whole months or more it covers shipping-fee credits dated less than 24 whole months before the handling date, for an account open less than 12 whole months it covers credits dated less than 6 whole months before, and for every other account it covers credits dated less than 12 whole months before."
      lt_prior_credits: "A prior-failure courtesy amount is added by the number of shipping-fee credits already posted on the account within the prior-credit window"
      lt_prior_courtesy: "15.00 for two or more, 7.50 for exactly one, and nothing for none."
      lt_drug: "counted as paid retail claims for that drug dated less than three whole months before the handling date"
      lt_bridge_count: "A retail bridge courtesy amount is added for a supply of the delayed drug bought at a retail pharmacy, counted as paid retail claims for that drug dated less than three whole months before the handling date"
      lt_bridge: "12.00 for two or more such claims, 6.00 for exactly one, and nothing for none."
      lt_remote: "A remote-destination courtesy amount is added when the account's shipping ZIP code lies in Alaska (99500 through 99999) or Hawaii (96700 through 96899): 5.00 when the delayed order went out overnight to such a ZIP code, 2.50 when it went out two-day to such a ZIP code, and nothing in every other case."
      lt_origin: "An order-origin courtesy amount is added by what initiated the delayed order: 4.00 for an order placed for a new prescription, 2.00 for an automatic refill order, and nothing for any other order."
      result: "The returned portion of the booked fee and the courtesy amounts are added together, and only that sum is rounded to the nearest cent."
    factors:
      - id: dispensing_delay_share
        effect: method
        decides: lt_delay_share
        bindings: [lt_span, lt_weekday, lt_bdays, lt_delay, lt_delay_share]
        ladder:
          - when: "the dispensing delay is one or two business days"
            method: "the share is figured per day: a quarter of the fee times the business days of delay"
          - when: "the dispensing delay is three or four business days"
            method: "the share is a flat three quarters, whatever the days"
          - when: "otherwise (five business days or more)"
            method: "the whole booked fee is returned"
        baseline:
          lt_delay_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: prior_credit_window
        effect: parameter
        decides: lt_window
        bindings: [lt_window]
        ladder:
          - when: "the account has been open 60 whole months or more"
            value: "K('long_window_months') (24 whole months)"
          - when: "the account has been open less than 12 whole months"
            value: "K('short_window_months') (6 whole months)"
          - when: "otherwise"
            value: "K('standard_window_months') (12 whole months)"
        baseline:
          lt_window: "K('standard_window_months')"
        evidence: [date]
        cross_difficulty: null
      - id: prior_failure_courtesy
        effect: parameter
        decides: lt_prior_courtesy
        bindings: [lt_prior_credits, lt_prior_courtesy]
        ladder:
          - when: "two or more shipping-fee credits fall in the prior-credit window"
            value: "K('prior_two_credits')"
          - when: "exactly one shipping-fee credit falls in the prior-credit window"
            value: "K('prior_one_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          lt_prior_courtesy: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: retail_bridge_courtesy
        effect: parameter
        decides: lt_bridge
        bindings: [lt_drug, lt_bridge_count, lt_bridge]
        ladder:
          - when: "two or more paid retail claims for the delayed drug are dated less than three whole months before the handling date"
            value: "K('bridge_two_claims')"
          - when: "exactly one such paid retail claim"
            value: "K('bridge_one_claim')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          lt_bridge: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: retail
      - id: remote_destination_courtesy
        effect: parameter
        decides: lt_remote
        bindings: [lt_remote]
        ladder:
          - when: "the delayed order went out overnight and the shipping ZIP code lies in Alaska or Hawaii"
            value: "K('remote_overnight_courtesy')"
          - when: "the delayed order went out two-day and the shipping ZIP code lies in Alaska or Hawaii"
            value: "K('remote_two_day_courtesy')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          lt_remote: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: order_origin_courtesy
        effect: parameter
        decides: lt_origin
        bindings: [lt_origin]
        ladder:
          - when: "the delayed order was placed for a new prescription"
            value: "K('new_prescription_courtesy')"
          - when: "the delayed order was an automatic refill"
            value: "K('auto_refill_courtesy')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          lt_origin: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The dispensing-delay credit returns the full expedited fee booked on the delayed order, rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: mail_orders, aggregate: latest, field: source_order_id, filters: {event_type: mail_order_shipped}}
        - {table: mail_orders, aggregate: sum, field: shipping_fee, filters: {event_type: mail_shipping_charged}}
        - {table: mail_payments, aggregate: count, field: mail_payment_id, within_months: 24, filters: {event_type: mail_credit_issued}}
        - {category: retail, table: retail_claims, aggregate: count, field: retail_claim_id, within_months: 3, filters: {event_type: retail_claim_paid}}
      cross_category: [retail]
  - id: mail_ext_installment_catchup
    base_policy_refs: [mail_evt_payment, mail_payment_plan]
    overwrite:
      - base_policy: mail_payment_plan
        superseded_clause: >-
          a missed installment ends the plan
        replaced_by: >-
          Installments of a payment plan fall due monthly, the first one month after the plan's request date, so the number fallen due is the number of whole months from the plan's request date to the handling date; an installment unpaid on its due date is overdue, and the plan ends only when an installment stays unpaid 60 calendar days after its due date.
    trigger: state_due
    subject: [mail_payment_posted]
    computes: amount
    target_tool: pay_plan_installment_04171a93
    params:
      late_high_days: 50
      late_low_days: 31
      late_high: 10.0
      late_low: 5.0
      hsa_grace_days: 10
      card_grace_days: 5
      long_tenure_months: 60
      mid_tenure_months: 24
      tenure_high_waiver: 0.5
      tenure_mid_waiver: 0.25
      specialty_high_balance: 250.0
      specialty_high_waiver: 0.25
      specialty_low_waiver: 0.1
      autopay_high: 0.5
      autopay_low: 0.25
    rule: >
      When installments of the payment plan in force on the account (the account records a plan length) have fallen due
      unpaid, the member catches the plan up with an installment payment.
      Installments of a payment plan fall due monthly, the first one month after the plan's request date, so the number fallen due is the number of whole months from the plan's request date to the handling date; an installment unpaid on its due date is overdue, and the plan ends only when an installment stays unpaid 60 calendar days after its due date.
      The installment catch-up is one scheduled installment at the monthly installment recorded on the confirmed plan, rounded to the nearest cent.
      The number of installments collected depends on how far behind the plan is: every overdue installment when two or more are overdue, the overdue installment together with the plan's final installment when exactly one is overdue and only the final installment remains after it, and the one overdue installment in every other case.
      A late charge is added by the calendar days that have passed since the plan's last installment payment, less a card-processing grace: 10.00 for 50 days or more, 5.00 for 31 through 49 days, and nothing for 30 days or fewer.
      The card-processing grace depends on the card that paid the plan's last installment: 10 days for an HSA/FSA card, 5 days for a credit or debit card, and none for any other payment.
      Part of the late charge is waived for a long-standing account with no failed plan: half of the late charge when the account has been open 60 whole months or more and no payment-plan request on it recorded as cancelled was made in the 48 whole months before the handling date, a quarter of the late charge when it has been open 24 through 59 whole months with no such cancelled request, and nothing in every other case.
      A further part of the late charge is waived when the member also owes Northbridge Specialty Pharmacy: a quarter of the original late charge when the balance due on the member's active specialty enrollment is 250.00 or more, a tenth of the original late charge when that balance is above zero but under 250.00, and nothing when nothing is owed there; both waived parts are shares of the original late charge, so they are added together and taken off that charge once.
      An automatic-refill credit is then taken off the waived late charge: 0.50 when the member is enrolled in automatic refills and two or more automatic refill orders were placed less than 12 whole months before the handling date, 0.25 when the member is enrolled with exactly one such order, and nothing in every other case; the late charge never falls below zero.
      The installments collected are added to the late charge left after the waivers and the automatic-refill credit, and only that sum is rounded to the nearest cent.
    prerequisite: []
    cross_category:
      - category: specialty
        as: branch
        reads: [balance_due, status]
        note: The specialty waiver reads the balance due on the member's active specialty enrollment.
    compute:
      - in_monthly: "LATEST('mail_service_requests','plan_monthly_amount', date_field='request_date', request_type='payment_plan', request_status='completed')"
      - in_months: "LATEST('mail_service_requests','plan_months', date_field='request_date', request_type='payment_plan', request_status='completed')"
      - in_start: "LATEST('mail_service_requests','request_date', date_field='request_date', request_type='payment_plan', request_status='completed')"
      - in_paid: "int(MAX('mail_payments','installment_number', event_type='mail_payment_posted'))"
      - in_due: "MONTHS(in_start, NOW)"
      - in_count: "(in_due - in_paid) if in_due - in_paid >= 2 else (2 if (in_due - in_paid == 1 and in_months - in_due == 1) else 1)"
      - in_last_date: "LATEST('mail_payments','payment_date', date_field='payment_date', event_type='mail_payment_posted', installment_number=in_paid)"
      - in_grace: "K('hsa_grace_days') if LATEST('mail_payments','payment_method', date_field='payment_date', event_type='mail_payment_posted', installment_number=in_paid) == 'hsa_fsa_card' else (K('card_grace_days') if (LATEST('mail_payments','payment_method', date_field='payment_date', event_type='mail_payment_posted', installment_number=in_paid) == 'credit_card' or LATEST('mail_payments','payment_method', date_field='payment_date', event_type='mail_payment_posted', installment_number=in_paid) == 'debit_card') else 0)"
      - in_late: "K('late_high') if DAYS(in_last_date, NOW) - in_grace >= K('late_high_days') else (K('late_low') if DAYS(in_last_date, NOW) - in_grace >= K('late_low_days') else 0.0)"
      - in_tenure_waiver: "K('tenure_high_waiver') if (MONTHS(F('opened_date'), NOW) >= K('long_tenure_months') and COUNT('mail_service_requests', within_months=48, date_field='request_date', request_type='payment_plan', request_status='cancelled') == 0) else (K('tenure_mid_waiver') if (MONTHS(F('opened_date'), NOW) >= K('mid_tenure_months') and COUNT('mail_service_requests', within_months=48, date_field='request_date', request_type='payment_plan', request_status='cancelled') == 0) else 0.0)"
      - in_spec_balance: "CFIELD('specialty','balance_due', status='active') or 0.0"
      - in_spec_waiver: "K('specialty_high_waiver') if in_spec_balance >= K('specialty_high_balance') else (K('specialty_low_waiver') if in_spec_balance > 0 else 0.0)"
      - in_autopay: "K('autopay_high') if (F('auto_refill_enrolled') == True and COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_placed', order_source='auto_refill') >= 2) else (K('autopay_low') if (F('auto_refill_enrolled') == True and COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_placed', order_source='auto_refill') == 1) else 0.0)"
      - result: "RND(in_count * in_monthly + MX(in_late * (1 - in_tenure_waiver - in_spec_waiver) - in_autopay, 0.0), 2)"
    compute_basis:
      in_monthly: "The installment catch-up is one scheduled installment at the monthly installment recorded on the confirmed plan, rounded to the nearest cent."
      in_months: "the overdue installment together with the plan's final installment when exactly one is overdue and only the final installment remains after it"
      in_start: "Installments of a payment plan fall due monthly, the first one month after the plan's request date"
      in_paid: "an installment unpaid on its due date is overdue"
      in_due: "so the number fallen due is the number of whole months from the plan's request date to the handling date"
      in_count: "The number of installments collected depends on how far behind the plan is: every overdue installment when two or more are overdue, the overdue installment together with the plan's final installment when exactly one is overdue and only the final installment remains after it, and the one overdue installment in every other case."
      in_last_date: "A late charge is added by the calendar days that have passed since the plan's last installment payment, less a card-processing grace"
      in_grace: "The card-processing grace depends on the card that paid the plan's last installment: 10 days for an HSA/FSA card, 5 days for a credit or debit card, and none for any other payment."
      in_late: "10.00 for 50 days or more, 5.00 for 31 through 49 days, and nothing for 30 days or fewer."
      in_tenure_waiver: "Part of the late charge is waived for a long-standing account with no failed plan: half of the late charge when the account has been open 60 whole months or more and no payment-plan request on it recorded as cancelled was made in the 48 whole months before the handling date, a quarter of the late charge when it has been open 24 through 59 whole months with no such cancelled request, and nothing in every other case."
      in_spec_balance: "A further part of the late charge is waived when the member also owes Northbridge Specialty Pharmacy"
      in_spec_waiver: "a quarter of the original late charge when the balance due on the member's active specialty enrollment is 250.00 or more, a tenth of the original late charge when that balance is above zero but under 250.00, and nothing when nothing is owed there; both waived parts are shares of the original late charge, so they are added together and taken off that charge once."
      in_autopay: "An automatic-refill credit is then taken off the waived late charge: 0.50 when the member is enrolled in automatic refills and two or more automatic refill orders were placed less than 12 whole months before the handling date, 0.25 when the member is enrolled with exactly one such order, and nothing in every other case; the late charge never falls below zero."
      result: "The installments collected are added to the late charge left after the waivers and the automatic-refill credit, and only that sum is rounded to the nearest cent."
    factors:
      - id: installments_collected
        effect: method
        decides: in_count
        bindings: [in_due, in_count]
        ladder:
          - when: "two or more installments are overdue"
            method: "every overdue installment is collected"
          - when: "exactly one installment is overdue and only the plan's final installment remains after it"
            method: "the overdue installment and the final installment are collected together, closing the plan"
          - when: "otherwise"
            method: "the one overdue installment is collected"
        baseline:
          in_count: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: installment_late_charge
        effect: parameter
        decides: in_late
        bindings: [in_last_date, in_late]
        ladder:
          - when: "50 or more days since the last installment payment, after the card-processing grace"
            value: "K('late_high')"
          - when: "31 through 49 days, after the grace"
            value: "K('late_low')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          in_late: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: card_processing_grace
        effect: parameter
        decides: in_grace
        bindings: [in_grace]
        ladder:
          - when: "the plan's last installment was paid with an HSA/FSA card"
            value: "K('hsa_grace_days') days"
          - when: "the plan's last installment was paid with a credit or debit card"
            value: "K('card_grace_days') days"
          - when: "otherwise"
            value: "0 days"
        baseline:
          in_grace: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_late_waiver
        effect: parameter
        decides: in_tenure_waiver
        bindings: [in_tenure_waiver]
        ladder:
          - when: "the account has been open 60 whole months or more and no payment-plan request on it recorded as cancelled in the last 48 whole months"
            value: "K('tenure_high_waiver')"
          - when: "the account has been open 24 through 59 whole months and no payment-plan request on it recorded as cancelled in the last 48 whole months"
            value: "K('tenure_mid_waiver')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          in_tenure_waiver: "0.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: specialty_late_waiver
        effect: parameter
        decides: in_spec_waiver
        bindings: [in_spec_balance, in_spec_waiver]
        ladder:
          - when: "the active specialty enrollment carries a balance due of 250.00 or more"
            value: "K('specialty_high_waiver')"
          - when: "the active specialty enrollment carries a balance due above zero but under 250.00"
            value: "K('specialty_low_waiver')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          in_spec_waiver: "0.0"
        evidence: [cross_category]
        cross_difficulty: specialty
      - id: automatic_refill_late_credit
        effect: parameter
        decides: in_autopay
        bindings: [in_autopay]
        ladder:
          - when: "enrolled in automatic refills and two or more automatic refill orders in the last 12 whole months"
            value: "K('autopay_high')"
          - when: "enrolled in automatic refills and exactly one automatic refill order in the last 12 whole months"
            value: "K('autopay_low')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          in_autopay: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The installment catch-up is one scheduled installment at the monthly installment recorded on the confirmed plan, rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: mail_service_requests, aggregate: latest, field: plan_monthly_amount, filters: {request_type: payment_plan, request_status: completed}}
        - {table: mail_payments, aggregate: max, field: installment_number, filters: {event_type: mail_payment_posted}}
        - {table: mail_orders, aggregate: count, field: mail_order_id, within_months: 12, filters: {order_source: auto_refill}}
      cross_category: [specialty]
  - id: mail_ext_past_due_settlement
    base_policy_refs: [mail_evt_payment]
    overwrite:
      - base_policy: mail_evt_payment
        superseded_clause: >-
          each order charge is due within payment_due_days of shipment
        replaced_by: >-
          A charge falls past due after a waiting period that depends on how the member last paid: two whole months after shipment when the member's most recent payment was made with an HSA/FSA card, because such card charges need claim substantiation; as soon as it ships when the most recent payment was made by check, because check payers are billed by statement with charges due on receipt; and one whole month after shipment in every other case.
    trigger: on_request
    subject: [mail_payment_posted]
    computes: amount
    target_tool: pay_past_due_balance_de0abde8
    params:
      volume_high_count: 8
      volume_low_count: 4
      per_order_rate: 0.005
      volume_low_rate: 0.02
      choice_home_delivery_rate: 0.03
      choice_retail_90_rate: 0.01
      long_tenure_months: 60
      mid_tenure_months: 36
      tenure_high_rate: 0.03
      tenure_mid_rate: 0.015
      card_high_count: 3
      card_high_rate: 0.02
      card_low_rate: 0.01
      refill_high_rate: 0.01
      refill_low_rate: 0.005
    rule: >
      When a member asks to bring the home delivery account current, the member pays the past-due settlement.
      The past-due settlement is taken only after no installment of the member's payment plan stands unpaid past its due date.
      The past-due settlement is not worked out until the account's most recent shipment, when the member paid to expedite it and the pharmacy dispensed it later than its processing promise, carries a posted dispensing-delay credit.
      The settlement period is counted in whole months from the member's current payment plan: it covers entries dated less than N whole months before the handling date, N being one more than the number of whole months from the plan's request date to the handling date; entries dated earlier than that belong to the balance the plan financed and are never part of the settlement.
      The past-due settlement is the member charges and expedited fees of the settlement period that are at least one whole month old on the handling date, less the credits and the payments other than plan installments posted in the settlement period (payments other than installments posted on the plan's request date, which are the plan's down payment, are not counted), never below zero and rounded to the nearest cent.
      A charge falls past due after a waiting period that depends on how the member last paid: two whole months after shipment when the member's most recent payment was made with an HSA/FSA card, because such card charges need claim substantiation; as soon as it ships when the most recent payment was made by check, because check payers are billed by statement with charges due on receipt; and one whole month after shipment in every other case.
      A settlement courtesy reduction is given to a member who settles the past-due amount in full, at the sum of the following rates.
      A shipment-volume rate: for 8 or more shipped orders (replacement shipments are not counted) dated less than 12 whole months before the handling date it is figured per order, half a percent for each such order; for 4 to 7 such orders it is a flat 2 percent; and fewer orders earn nothing.
      A maintenance-choice rate: 3 percent when the member's active retail pharmacy benefit records home delivery as the maintenance medication choice, 1 percent when it records a 90-day retail supply, and nothing for any other choice.
      A tenure rate: 3 percent when the account has been open 60 whole months or more, 1.5 percent when it has been open 36 through 59 whole months, and nothing otherwise.
      A card-history rate: 2 percent when a credit, debit or HSA/FSA card is on file and three or more payments by such cards are dated less than 12 whole months before the handling date, 1 percent when a card is on file and one or two such payments are, and nothing otherwise.
      An automatic-refill rate: 1 percent when the member is enrolled in automatic refills and two or more automatic refill orders were placed less than 12 whole months before the handling date, half a percent when the member is enrolled with exactly one such order, and nothing otherwise.
      The courtesy rates are added together and applied once to the past-due amount, and only that result is rounded to the nearest cent.
    prerequisite:
      - problem: mail_ext_installment_catchup
        kind: state_gate
        gate: mail_payments.installment_number
        form: state
        policy_source: >-
          The past-due settlement is taken only after no installment of the member's payment plan stands unpaid past its due date.
        condition: >-
          The highest installment number posted on the account is at least the number of installments fallen due under the
          confirmed payment plan (whole months from the plan's request date to the handling date).
        resolved_by: pay_plan_installment_04171a93
        effect: >-
          Posting the overdue installments lifts the highest posted installment number to or past the installments fallen
          due, so the plan stands current and the settlement may be taken.
      - problem: mail_ext_dispensing_delay_credit
        kind: value_input
        gate: pd_credits
        form: state
        policy_source: >-
          The past-due settlement is not worked out until the account's most recent shipment, when the member paid to expedite it and the pharmacy dispensed it later than its processing promise, carries a posted dispensing-delay credit.
        condition: >-
          When the account's most recent shipment went out by an expedited service the member paid for and its ship date is
          more business days after its order date than the program's processing days, a shipping-fee credit is posted
          against that order.
        resolved_by: credit_dispensing_delay_47b21103
        effect: >-
          Posting the dispensing-delay credit adds it to the credits of the settlement period, lowering the past-due amount
          and the settlement by that credit less the courtesy reduction on it.
    cross_category:
      - category: retail
        as: branch
        reads: [maintenance_choice, status]
        note: The maintenance-choice rate reads the maintenance medication choice on the member's active retail benefit.
    compute:
      - pd_start: "LATEST('mail_service_requests','request_date', date_field='request_date', request_type='payment_plan', request_status='completed')"
      - pd_span: "MONTHS(pd_start, NOW) + 1"
      - pd_window: "2 if LATEST('mail_payments','payment_method', date_field='payment_date', event_type='mail_payment_posted') == 'hsa_fsa_card' else (0 if LATEST('mail_payments','payment_method', date_field='payment_date', event_type='mail_payment_posted') == 'check' else 1)"
      - pd_charges: "SUM('mail_orders','member_charge_amount', within_months=pd_span, date_field='order_date', event_type='mail_order_shipped') - SUM('mail_orders','member_charge_amount', within_months=pd_window, date_field='order_date', event_type='mail_order_shipped')"
      - pd_fees: "SUM('mail_orders','shipping_fee', within_months=pd_span, date_field='order_date', event_type='mail_shipping_charged') - SUM('mail_orders','shipping_fee', within_months=pd_window, date_field='order_date', event_type='mail_shipping_charged')"
      - pd_credits: "SUM('mail_payments','amount', within_months=pd_span, date_field='payment_date', event_type='mail_credit_issued')"
      - pd_payments: "SUM('mail_payments','amount', within_months=pd_span, date_field='payment_date', event_type='mail_payment_posted', installment_number=0) - SUM('mail_payments','amount', event_type='mail_payment_posted', installment_number=0, payment_date=pd_start)"
      - pd_core: "MX(pd_charges + pd_fees - pd_credits - pd_payments, 0.0)"
      - pd_volume: "K('per_order_rate') * COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_shipped') if COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_shipped') >= K('volume_high_count') else (K('volume_low_rate') if COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_shipped') >= K('volume_low_count') else 0.0)"
      - pd_choice: "K('choice_home_delivery_rate') if CFIELD('retail','maintenance_choice', status='active') == 'home_delivery' else (K('choice_retail_90_rate') if CFIELD('retail','maintenance_choice', status='active') == 'retail_90' else 0.0)"
      - pd_tenure: "K('tenure_high_rate') if MONTHS(F('opened_date'), NOW) >= K('long_tenure_months') else (K('tenure_mid_rate') if MONTHS(F('opened_date'), NOW) >= K('mid_tenure_months') else 0.0)"
      - pd_card: "K('card_high_rate') if (F('payment_method_on_file') != 'none' and COUNT('mail_payments', within_months=12, date_field='payment_date', event_type='mail_payment_posted', payment_method='credit_card') + COUNT('mail_payments', within_months=12, date_field='payment_date', event_type='mail_payment_posted', payment_method='debit_card') + COUNT('mail_payments', within_months=12, date_field='payment_date', event_type='mail_payment_posted', payment_method='hsa_fsa_card') >= K('card_high_count')) else (K('card_low_rate') if (F('payment_method_on_file') != 'none' and COUNT('mail_payments', within_months=12, date_field='payment_date', event_type='mail_payment_posted', payment_method='credit_card') + COUNT('mail_payments', within_months=12, date_field='payment_date', event_type='mail_payment_posted', payment_method='debit_card') + COUNT('mail_payments', within_months=12, date_field='payment_date', event_type='mail_payment_posted', payment_method='hsa_fsa_card') >= 1) else 0.0)"
      - pd_refill: "K('refill_high_rate') if (F('auto_refill_enrolled') == True and COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_placed', order_source='auto_refill') >= 2) else (K('refill_low_rate') if (F('auto_refill_enrolled') == True and COUNT('mail_orders', within_months=12, date_field='order_date', event_type='mail_order_placed', order_source='auto_refill') == 1) else 0.0)"
      - result: "RND(pd_core * (1 - pd_volume - pd_choice - pd_tenure - pd_card - pd_refill), 2)"
    compute_basis:
      pd_start: "The settlement period is counted in whole months from the member's current payment plan"
      pd_span: "it covers entries dated less than N whole months before the handling date, N being one more than the number of whole months from the plan's request date to the handling date; entries dated earlier than that belong to the balance the plan financed and are never part of the settlement."
      pd_window: "A charge falls past due after a waiting period that depends on how the member last paid: two whole months after shipment when the member's most recent payment was made with an HSA/FSA card, because such card charges need claim substantiation; as soon as it ships when the most recent payment was made by check, because check payers are billed by statement with charges due on receipt; and one whole month after shipment in every other case."
      pd_charges: "The past-due settlement is the member charges and expedited fees of the settlement period that are at least one whole month old on the handling date"
      pd_fees: "The past-due settlement is the member charges and expedited fees of the settlement period that are at least one whole month old on the handling date"
      pd_credits: "less the credits and the payments other than plan installments posted in the settlement period"
      pd_payments: "less the credits and the payments other than plan installments posted in the settlement period (payments other than installments posted on the plan's request date, which are the plan's down payment, are not counted)"
      pd_core: "never below zero and rounded to the nearest cent."
      pd_volume: "A shipment-volume rate: for 8 or more shipped orders (replacement shipments are not counted) dated less than 12 whole months before the handling date it is figured per order, half a percent for each such order; for 4 to 7 such orders it is a flat 2 percent; and fewer orders earn nothing."
      pd_choice: "A maintenance-choice rate: 3 percent when the member's active retail pharmacy benefit records home delivery as the maintenance medication choice, 1 percent when it records a 90-day retail supply, and nothing for any other choice."
      pd_tenure: "A tenure rate: 3 percent when the account has been open 60 whole months or more, 1.5 percent when it has been open 36 through 59 whole months, and nothing otherwise."
      pd_card: "A card-history rate: 2 percent when a credit, debit or HSA/FSA card is on file and three or more payments by such cards are dated less than 12 whole months before the handling date, 1 percent when a card is on file and one or two such payments are, and nothing otherwise."
      pd_refill: "An automatic-refill rate: 1 percent when the member is enrolled in automatic refills and two or more automatic refill orders were placed less than 12 whole months before the handling date, half a percent when the member is enrolled with exactly one such order, and nothing otherwise."
      result: "The courtesy rates are added together and applied once to the past-due amount, and only that result is rounded to the nearest cent."
    factors:
      - id: past_due_waiting_period
        effect: parameter
        decides: pd_window
        bindings: [pd_window]
        ladder:
          - when: "the member's most recent payment was made with an HSA/FSA card"
            value: "2 whole months"
          - when: "the member's most recent payment was made by check"
            value: "0 whole months (past due on shipment)"
          - when: "otherwise"
            value: "1 whole month"
        baseline:
          pd_window: "1"
        evidence: [history]
        cross_difficulty: null
      - id: shipment_volume_rate
        effect: method
        decides: pd_volume
        bindings: [pd_volume]
        ladder:
          - when: "8 or more shipped orders in the last 12 whole months"
            method: "the rate is figured per order: half a percent times the shipped orders counted"
          - when: "4 to 7 shipped orders in the last 12 whole months"
            method: "the rate is a flat 2 percent, whatever the count"
          - when: "otherwise"
            method: "no rate is figured"
        baseline:
          pd_volume: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: maintenance_choice_rate
        effect: parameter
        decides: pd_choice
        bindings: [pd_choice]
        ladder:
          - when: "the active retail benefit records home delivery as the maintenance medication choice"
            value: "K('choice_home_delivery_rate')"
          - when: "the active retail benefit records a 90-day retail supply as the maintenance medication choice"
            value: "K('choice_retail_90_rate')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          pd_choice: "0.0"
        evidence: [cross_category]
        cross_difficulty: retail
      - id: account_tenure_rate
        effect: parameter
        decides: pd_tenure
        bindings: [pd_tenure]
        ladder:
          - when: "the account has been open 60 whole months or more"
            value: "K('tenure_high_rate')"
          - when: "the account has been open 36 through 59 whole months"
            value: "K('tenure_mid_rate')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          pd_tenure: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: card_history_rate
        effect: parameter
        decides: pd_card
        bindings: [pd_card]
        ladder:
          - when: "a card is on file and three or more card payments in the last 12 whole months"
            value: "K('card_high_rate')"
          - when: "a card is on file and one or two card payments in the last 12 whole months"
            value: "K('card_low_rate')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          pd_card: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: automatic_refill_rate
        effect: parameter
        decides: pd_refill
        bindings: [pd_refill]
        ladder:
          - when: "enrolled in automatic refills and two or more automatic refill orders in the last 12 whole months"
            value: "K('refill_high_rate')"
          - when: "enrolled in automatic refills and exactly one automatic refill order in the last 12 whole months"
            value: "K('refill_low_rate')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          pd_refill: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The past-due settlement is the member charges and expedited fees of the settlement period that are at least one whole month old on the handling date, less the credits and the payments other than plan installments posted in the settlement period (payments other than installments posted on the plan's request date, which are the plan's down payment, are not counted), never below zero and rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: mail_orders, aggregate: sum, field: member_charge_amount, within_months: 4, filters: {event_type: mail_order_shipped}}
        - {table: mail_orders, aggregate: sum, field: shipping_fee, within_months: 4, filters: {event_type: mail_shipping_charged}}
        - {table: mail_payments, aggregate: sum, field: amount, within_months: 4, filters: {event_type: mail_credit_issued}}
      cross_category: [retail]
