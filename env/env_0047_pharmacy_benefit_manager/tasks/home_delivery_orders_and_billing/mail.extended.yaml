      - wv_fee_booked: "SUM('mail_orders','shipping_fee', event_type='mail_shipping_charged', source_order_id=wv_src)"
      - wv_reason: "LATEST('mail_orders','replacement_reason', date_field='order_date', event_type='mail_order_replaced')"
