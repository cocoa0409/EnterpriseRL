      fx_weekday: "8.00 when the member asked for overnight shipping and the order shipped on a Friday, 4.00 when the member asked for two-day shipping and the order shipped on a Thursday"
      fx_saturday: "A Saturday-delivery surcharge is added for the carrier's weekend handling: 8.00 when the member asked for overnight shipping and the order shipped on a Friday, 4.00 when the member asked for two-day shipping and the order shipped on a Thursday, and nothing in every other case."
      fx_remote: "A remote-destination surcharge is added when the shipping ZIP code on the account lies in Alaska (99500 through 99999) or Hawaii (96700 through 96899): 15.00 when the shipment went out overnight to such a ZIP code, 7.50 when it went out two-day to such a ZIP code, and nothing in every other case."
      fx_tenure: "The review window for the frequent-expedite discount depends on how long the account has been open on the handling date"
      fx_window: "for an account open 60 whole months or more the window covers expedited fees dated less than 24 whole months before the handling date, for an account open less than 12 whole months it covers those dated less than 6 whole months before, and for every other account it covers those dated less than 12 whole months before."
      fx_fee_count: "when four or more expedited fees are booked on the account within the review window"
      fx_discount: "A frequent-expedite discount is taken off the fee and its surcharges together: 25 percent when four or more expedited fees are booked on the account within the review window, 10 percent when two or three are, and none when fewer than two are."
      fx_age: "A fee booked late is figured by how many calendar days separate the ship date from the handling date"
      fx_late_share: "within 30 days the fee is booked in full; from 31 through 60 days it is prorated, reduced by one percent of the fee for every day beyond the 30th; and after 60 days it is written off and no fee is booked."
      result: "The fee, the Saturday surcharge and the remote surcharge are first added together; the discount is then taken off that sum; the late-booking share is then applied to the discounted amount; only the final amount is rounded to the nearest cent."
    factors:
