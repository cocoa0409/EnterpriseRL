        ladder:
          - when: "the receipt is for a purchase made outside the United States"
            value: "the receipt's days supply limited to P('max_days_supply_retail')"
          - when: "the receipt is for an out-of-network fill in the United States and the network's oon_coverage is emergency_only"
            value: "the receipt's days supply limited to P('oon_emergency_days_supply_max')"
          - when: "otherwise"
            value: "the receipt's days supply"
        baseline:
          days_capped: "clm_days"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: previous_fill_overlap
        effect: method
        decides: paid_days
        bindings: [net_count, net_dos, net_days, refill_threshold, elapsed, overlap, paid_days]
        ladder:
          - when: "the receipt's date of service came before the refill threshold of the member's most recent paid network claim for the drug"
            method: "the whole overlap is taken off the reimbursed days"
          - when: "the receipt's date of service came on or after that refill threshold and the overlap exceeds early_refill_accumulation_limit_days"
            method: "only the overlap beyond early_refill_accumulation_limit_days is taken off the reimbursed days"
          - when: "otherwise, or no paid network claim for the drug"
            method: "the reimbursed days are kept as settled"
        baseline:
          paid_days: "days_capped"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: allowed_amount_basis
        effect: method
        decides: allowed
        bindings: [net_allowed, per_day, allowed]
        ladder:
          - when: "the receipt is for a purchase made outside the United States"
            method: "the amount on the receipt, prorated to the reimbursed days and multiplied by oon_reimbursement_rate"
          - when: "the receipt is for an out-of-network fill in the United States"
            method: "the network rate per day times the reimbursed days, multiplied by oon_reimbursement_rate"
          - when: "otherwise (a fill at a network pharmacy)"
            method: "the network rate per day times the reimbursed days"
        baseline:
          allowed: "RND(per_day * paid_days, 2)"
        evidence: [history]
        cross_difficulty: null
      - id: accumulator_cost_share
        effect: parameter
        decides: cost_share
        bindings: [oop_met, oop_max, cost_share]
        ladder:
          - when: "the out-of-pocket met on the member's active plan enrollment has reached the plan's individual out-of-pocket maximum"
            value: "0"
          - when: "the out-of-pocket maximum is not reached and the drug is an insulin product"
            value: "the deductible portion plus the lesser of the insulin cap per 30 days times the day-supply multiple and the tier cost share"
          - when: "otherwise"
            value: "the deductible portion plus the tier cost share"
        baseline:
          cost_share: "ded_part + tier_cs"
        evidence: [cross_category]
        cross_difficulty: null
    inputs:
      history:
        - {table: retail_reimbursements, aggregate: latest, field: days_supply, filters: {event_type: retail_dmr_submitted}}
        - {table: retail_claims, aggregate: latest, field: allowed_amount, filters: {event_type: retail_claim_paid}}
        - {table: retail_claims, aggregate: count, field: retail_claim_id, filters: {event_type: retail_claim_paid}}
      cross_category: [plan]

  - id: retail_ext_review_bridge_supply
    base_policy_refs: [retail_evt_override, retail_refill_too_soon]
    overwrite:
      - base_policy: retail_evt_override
        superseded_clause: >-
          An emergency supply of emergency_supply_days days is granted only while a coverage review for that drug is pending, at most emergency_supply_per_drug_per_year times per drug per plan year.
        replaced_by: >-
          An emergency supply is granted only while a coverage review for that drug is pending, at most emergency_supply_per_drug_per_year times per drug per plan year, and the days it allows are the review bridge worked out below.
    trigger: state_due
    subject: [retail_override_granted]
    computes: days_supply_allowed
    target_tool: grant_review_bridge_supply_635c815d
    params:
      urgent_bridge_reduction_days: 2
      member_request_bridge_days: 7
      mail_transit_bridge_days: 5
      mail_hold_bridge_days: 12
    rule: >-
      An emergency supply is granted only while a coverage review for that drug is pending, at most emergency_supply_per_drug_per_year times per drug per plan year, and the days it allows are the review bridge worked out below.
      The review bridge is for the drug of the member's most recently opened coverage review case, and it is recorded against the prescription number of the member's most recent paid network claim for that drug.
      The review bridge is not worked out until every paper claim filed on the benefit for the drug under review carries its decision.
      The base bridge days are emergency_supply_days.
      The information extension of the bridge and the delivery extension of the bridge are zero days.
      The bridge horizon is the base bridge days plus the information extension of the bridge plus the delivery extension of the bridge.
      The supply on hand for the bridge is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug, or zero with no such claim.
      The review bridge is the bridge horizon less the supply on hand for the bridge, never below zero, in whole days.
      The base bridge days depend on how the case was opened: when the case is urgent and was opened by the prescriber, they are emergency_supply_days less urgent_bridge_reduction_days, but never fewer than one day; when the case is standard and was opened by the member or an authorized representative, they are member_request_bridge_days; otherwise they are emergency_supply_days.
      The information extension of the bridge counts the information requests on the drug's coverage review cases that have no matching receipt of information: with two or more outstanding it is twice the review program's info_request_wait_days, with exactly one outstanding it is the review program's info_request_wait_days, and with none it is zero days.
      The delivery extension of the bridge depends on the member's home delivery pharmacy: when a prescription for the drug is on file there and the home delivery account is active, it is mail_transit_bridge_days; when a prescription for the drug is on file there and the account is on hold, it is mail_hold_bridge_days; otherwise it is zero days.
      The supply on hand for the bridge is anchored on the fill the member actually holds of the drug under review: when an approved paper claim for the drug has a date of service later than every paid network claim for it, the days not yet run out of that paper-claim fill are counted, an approved paper claim being a fill on its date of service; when, with no such paper claim, the member's most recent paid network claim for the drug carries a reversal, nothing is counted because that fill was never dispensed; otherwise the days not yet run out of the most recent paid network claim are counted.
      All of these are whole days and nothing is rounded.
    baseline:
      rule: >-
        The base bridge days are emergency_supply_days.
        The information extension of the bridge and the delivery extension of the bridge are zero days.
        The bridge horizon is the base bridge days plus the information extension of the bridge plus the delivery extension of the bridge.
        The supply on hand for the bridge is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug, or zero with no such claim.
        The review bridge is the bridge horizon less the supply on hand for the bridge, never below zero, in whole days.
      params: [emergency_supply_days]
    prerequisite:
      - problem: retail_ext_paper_claim_reimbursement
        kind: value_input
        gate: on_hand
        form: state
        policy_source: >-
          The review bridge is not worked out until every paper claim filed on the benefit for the drug under review carries its decision.
        condition: >-
          every retail_dmr_submitted row on the retail benefit for the drug under review has a retail_dmr_approved or retail_dmr_denied row whose source_reimbursement_id points at it
        resolved_by: approve_paper_claim_1f52e397
        effect: >-
          once the paper claim is approved, its fill counts in the supply on hand for the bridge (on_hand), which the review bridge nets against the bridge horizon
    cross_category:
      - category: review
        as: history
        reads: [review_cases.drug_name, review_cases.review_priority, review_cases.requested_by, review_cases.event_type, info_request_wait_days]
        note: the base-bridge-days and information-extension factors read the member's coverage review cases and the review program's information wait.
      - category: mail
        as: branch
        reads: [status, mail_prescriptions.drug_name]
        note: the delivery-extension factor reads whether the drug is on file at home delivery and the account status.
    compute:
      - case_drug: "XLATEST('review', 'review_cases', 'drug_name', date_field='event_at', event_type='review_case_opened')"
      - case_prio: "XLATEST('review', 'review_cases', 'review_priority', date_field='event_at', event_type='review_case_opened')"
      - case_by: "XLATEST('review', 'review_cases', 'requested_by', date_field='event_at', event_type='review_case_opened')"
      - status_days: "MX(1, P('emergency_supply_days') - K('urgent_bridge_reduction_days')) if case_prio == 'urgent' and case_by == 'prescriber' else (K('member_request_bridge_days') if case_prio == 'standard' and case_by != 'prescriber' else P('emergency_supply_days'))"
      - req_n: "XCOUNT('review', 'review_cases', event_type='review_case_info_requested', drug_name=case_drug)"
      - rec_n: "XCOUNT('review', 'review_cases', event_type='review_case_info_received', drug_name=case_drug)"
      - info_days: "CPARAM('review', 'info_request_wait_days', status='active') * 2 if req_n - rec_n >= 2 else (CPARAM('review', 'info_request_wait_days', status='active') if req_n - rec_n == 1 else 0)"
      - mail_rx: "XCOUNT('mail', 'mail_prescriptions', drug_name=case_drug)"
      - mail_status: "CFIELD('mail', 'status')"
      - ship_days: "K('mail_transit_bridge_days') if mail_rx > 0 and mail_status == 'active' else (K('mail_hold_bridge_days') if mail_rx > 0 and mail_status == 'on_hold' else 0)"
      - horizon: "status_days + info_days + ship_days"
      - n_count: "COUNT('retail_claims', event_type='retail_claim_paid', drug_name=case_drug)"
      - n_id: "LATEST('retail_claims', 'retail_claim_id', date_field='date_of_service', event_type='retail_claim_paid', drug_name=case_drug)"
      - n_rev: "COUNT('retail_claims', event_type='retail_claim_reversed', original_claim_id=n_id)"
      - n_dos: "LATEST('retail_claims', 'date_of_service', date_field='date_of_service', event_type='retail_claim_paid', drug_name=case_drug)"
      - n_days: "LATEST('retail_claims', 'days_supply', date_field='date_of_service', event_type='retail_claim_paid', drug_name=case_drug)"
      - p_count: "COUNT('retail_reimbursements', event_type='retail_dmr_approved', drug_name=case_drug)"
      - p_dos: "LATEST('retail_reimbursements', 'date_of_service', date_field='date_of_service', event_type='retail_dmr_approved', drug_name=case_drug)"
      - p_days: "LATEST('retail_reimbursements', 'days_supply', date_field='date_of_service', event_type='retail_dmr_approved', drug_name=case_drug)"
      - on_hand: "MX(0, p_days - DAYS(p_dos, NOW)) if p_count > 0 and (n_count == 0 or p_dos > n_dos) else (0 if n_count > 0 and n_rev > 0 else (MX(0, n_days - DAYS(n_dos, NOW)) if n_count > 0 else 0))"
      - bridge: "MX(0, horizon - on_hand)"
      - result: "bridge"
    compute_basis:
      case_drug: "The review bridge is for the drug of the member's most recently opened coverage review case"
      case_prio: "when the case is urgent and was opened by the prescriber, they are emergency_supply_days less urgent_bridge_reduction_days, but never fewer than one day"
      case_by: "when the case is standard and was opened by the member or an authorized representative, they are member_request_bridge_days"
      status_days: "The base bridge days depend on how the case was opened: when the case is urgent and was opened by the prescriber, they are emergency_supply_days less urgent_bridge_reduction_days, but never fewer than one day; when the case is standard and was opened by the member or an authorized representative, they are member_request_bridge_days; otherwise they are emergency_supply_days."
      req_n: "The information extension of the bridge counts the information requests on the drug's coverage review cases that have no matching receipt of information"
      rec_n: "The information extension of the bridge counts the information requests on the drug's coverage review cases that have no matching receipt of information"
      info_days: "with two or more outstanding it is twice the review program's info_request_wait_days, with exactly one outstanding it is the review program's info_request_wait_days, and with none it is zero days."
      mail_rx: "when a prescription for the drug is on file there and the home delivery account is active, it is mail_transit_bridge_days"
      mail_status: "when a prescription for the drug is on file there and the account is on hold, it is mail_hold_bridge_days"
      ship_days: "The delivery extension of the bridge depends on the member's home delivery pharmacy: when a prescription for the drug is on file there and the home delivery account is active, it is mail_transit_bridge_days; when a prescription for the drug is on file there and the account is on hold, it is mail_hold_bridge_days; otherwise it is zero days."
      horizon: "The bridge horizon is the base bridge days plus the information extension of the bridge plus the delivery extension of the bridge."
      n_count: "of the member's most recent paid network claim for the drug, or zero with no such claim."
      n_id: "the member's most recent paid network claim for the drug carries a reversal"
      n_rev: "when, with no such paper claim, the member's most recent paid network claim for the drug carries a reversal, nothing is counted because that fill was never dispensed"
      n_dos: "The supply on hand for the bridge is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug"
      n_days: "The supply on hand for the bridge is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug"
      p_count: "an approved paper claim being a fill on its date of service"
      p_dos: "when an approved paper claim for the drug has a date of service later than every paid network claim for it, the days not yet run out of that paper-claim fill are counted"
      p_days: "the days not yet run out of that paper-claim fill are counted"
      on_hand: "The supply on hand for the bridge is anchored on the fill the member actually holds of the drug under review: when an approved paper claim for the drug has a date of service later than every paid network claim for it, the days not yet run out of that paper-claim fill are counted, an approved paper claim being a fill on its date of service; when, with no such paper claim, the member's most recent paid network claim for the drug carries a reversal, nothing is counted because that fill was never dispensed; otherwise the days not yet run out of the most recent paid network claim are counted."
      bridge: "The review bridge is the bridge horizon less the supply on hand for the bridge, never below zero, in whole days."
      result: "All of these are whole days and nothing is rounded."
    factors:
      - id: case_opening_bridge
        effect: parameter
        decides: status_days
        bindings: [case_prio, case_by, status_days]
        ladder:
          - when: "the pending case is urgent and was opened by the prescriber"
            value: "emergency_supply_days less K('urgent_bridge_reduction_days'), at least one day"
          - when: "the pending case is standard and was opened by the member or an authorized representative"
            value: "K('member_request_bridge_days')"
          - when: "otherwise"
            value: "P('emergency_supply_days')"
        baseline:
          status_days: "P('emergency_supply_days')"
        evidence: [cross_category, history]
        cross_difficulty: review
      - id: information_request_extension
        effect: parameter
        decides: info_days
        bindings: [req_n, rec_n, info_days]
        ladder:
          - when: "two or more information requests on the drug's review cases have no matching receipt"
            value: "2 x the review program's info_request_wait_days"
          - when: "exactly one information request is outstanding"
            value: "the review program's info_request_wait_days"
          - when: "otherwise"
            value: "0"
        baseline:
          info_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: review
      - id: home_delivery_extension
        effect: parameter
        decides: ship_days
        bindings: [mail_rx, mail_status, ship_days]
        ladder:
          - when: "a prescription for the drug is on file at home delivery and the home delivery account is active"
            value: "K('mail_transit_bridge_days')"
          - when: "a prescription for the drug is on file at home delivery and the account is on hold"
            value: "K('mail_hold_bridge_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          ship_days: "0"
        evidence: [cross_category]
        cross_difficulty: mail
      - id: bridge_supply_anchor
        effect: method
        decides: on_hand
        bindings: [n_id, n_rev, p_count, p_dos, p_days, on_hand]
        ladder:
          - when: "an approved paper claim for the drug is dated later than every paid network claim for it"
            method: "count the days not yet run out of that paper-claim fill"
          - when: "no such paper claim, and the most recent paid network claim carries a reversal"
            method: "count nothing (the fill was never dispensed)"
          - when: "otherwise"
            method: "count the days not yet run out of the most recent paid network claim"
        baseline:
          on_hand: "MX(0, n_days - DAYS(n_dos, NOW)) if n_count > 0 else 0"
        evidence: [history, date]
        cross_difficulty: null
    inputs:
      history:
        - {table: retail_claims, aggregate: latest, field: date_of_service, filters: {event_type: retail_claim_paid}}
        - {table: retail_reimbursements, aggregate: latest, field: date_of_service, filters: {event_type: retail_dmr_approved}}
        - {category: review, table: review_cases, aggregate: count, field: review_case_id, filters: {event_type: review_case_info_requested}}
        - {category: mail, table: mail_prescriptions, aggregate: count, field: mail_prescription_id, filters: {}}
      cross_category: [review, mail]

  - id: retail_ext_vacation_supply_days
    base_policy_refs: [retail_evt_override, retail_refill_too_soon]
    overwrite: []
    trigger: on_request
    subject: [retail_override_granted]
    computes: days_supply_allowed
    target_tool: request_vacation_supply_35815dad
    params:
      pending_review_vacation_share: 0.67
      recent_vacation_reduction_days: 15
      earlier_vacation_reduction_days: 5
      early_grace_days: 7
    rule: >-
      A member who is travelling records their own vacation supply request, giving the departure date, and the days of the vacation supply are worked out from the member's records for the drug of the member's most recent paid network claim, recorded against that claim's prescription number.
      The vacation supply is fixed only after the benefit carries an emergency supply for the drug for each of its coverage reviews still awaiting decision.
      A vacation supply is not sized until each paper claim on the benefit for the drug has been decided.
      The vacation ceiling is vacation_override_max_days_supply.
      The supply on hand for the vacation is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug, or zero with no such claim.
      The vacation supply is the vacation ceiling less the supply on hand for the vacation, never below zero, in whole days.
      The supply on hand for the vacation is anchored on the fill the member actually holds: when an approved paper claim for the drug has a date of service later than every paid network claim for the drug, the days not yet run out of that paper-claim fill are counted; when, with no such paper claim, the most recent paid network claim carries a reversal, nothing is counted because that fill was never dispensed; otherwise the days not yet run out of the most recent paid network claim are counted.
      Supply already authorised for the drug is also taken off the vacation supply: when an emergency supply for the drug was granted within the last seven days and no claim has used it yet, its full days are taken off; when the most recent emergency supply for the drug has already been used by a claim, the days of that claim not yet run out are taken off; otherwise nothing is taken off.
      The vacation ceiling depends on the drug's coverage review: when the drug's latest approval has expired and a coverage review case for the drug is still awaiting decision, the vacation ceiling is vacation_override_max_days_supply multiplied by pending_review_vacation_share, rounded down to whole days; when the latest approval is still in force and expires sooner than vacation_override_max_days_supply days from today, the vacation ceiling is the days from today to that expiration date; otherwise it is vacation_override_max_days_supply.
      Recent vacation supplies reduce the vacation supply: when a vacation supply for the drug was granted in the last six months, recent_vacation_reduction_days are taken off; when the most recent one was granted six to twelve months ago, earlier_vacation_reduction_days are taken off; otherwise nothing is taken off.
      Early days carried by a paper-claim fill reduce the vacation supply, because a fill bought outside the network never passed the refill-too-soon edit: the carried early days are the days of the most recent paid network claim not yet run out on the date of service of a later approved paper claim for the drug, counted only when that paper claim falls within early_refill_accumulation_window_days of today; when the carried early days exceed early_refill_accumulation_limit_days all of them are taken off; when they exceed early_grace_days but not that limit, the carried early days beyond early_grace_days are taken off; otherwise nothing is taken off.
      All reductions are subtracted together from the vacation ceiling in one step, the result is never below zero, and every quantity is in whole days; apart from rounding the pending-review ceiling down, nothing is rounded.
    baseline:
      rule: >-
        The vacation ceiling is vacation_override_max_days_supply.
        The supply on hand for the vacation is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug, or zero with no such claim.
        The vacation supply is the vacation ceiling less the supply on hand for the vacation, never below zero, in whole days.
      params: [vacation_override_max_days_supply]
    prerequisite:
      - problem: retail_ext_review_bridge_supply
        kind: value_input
        gate: pending
        form: state
        policy_source: >-
          The vacation supply is fixed only after the benefit carries an emergency supply for the drug for each of its coverage reviews still awaiting decision.
        condition: >-
          a retail_overrides row of override_type emergency_supply for the drug stands on the retail benefit while a review_cases opening row for the drug has no decision row
        resolved_by: grant_review_bridge_supply_635c815d
        effect: >-
          the granted emergency supply is authorised supply that the vacation supply takes off (pending), lowering days_supply_allowed by the bridge days
      - problem: retail_ext_paper_claim_reimbursement
        kind: value_input
        gate: on_hand
        form: state
        policy_source: >-
          A vacation supply is not sized until each paper claim on the benefit for the drug has been decided.
        condition: >-
          every retail_dmr_submitted row on the retail benefit for the drug has a retail_dmr_approved or retail_dmr_denied row pointing at it
        resolved_by: approve_paper_claim_1f52e397
        effect: >-
          once the paper claim is approved its fill anchors the supply on hand for the vacation (on_hand) and its carried early days are counted (early_ded)
    cross_category:
      - category: review
        as: history
        reads: [review_authorizations.expiration_date, review_cases.event_type, review_cases.drug_name]
        note: the vacation-ceiling factor reads the drug's latest approval and whether a review case is still awaiting decision.
    compute:
      - vac_drug: "LATEST('retail_claims', 'drug_name', date_field='date_of_service', event_type='retail_claim_paid')"
      - n_count: "COUNT('retail_claims', event_type='retail_claim_paid', drug_name=vac_drug)"
      - n_id: "LATEST('retail_claims', 'retail_claim_id', date_field='date_of_service', event_type='retail_claim_paid', drug_name=vac_drug)"
      - n_dos: "LATEST('retail_claims', 'date_of_service', date_field='date_of_service', event_type='retail_claim_paid', drug_name=vac_drug)"
      - n_days: "LATEST('retail_claims', 'days_supply', date_field='date_of_service', event_type='retail_claim_paid', drug_name=vac_drug)"
      - n_rev: "COUNT('retail_claims', event_type='retail_claim_reversed', original_claim_id=n_id)"
      - p_count: "COUNT('retail_reimbursements', event_type='retail_dmr_approved', drug_name=vac_drug)"
      - p_dos: "LATEST('retail_reimbursements', 'date_of_service', date_field='date_of_service', event_type='retail_dmr_approved', drug_name=vac_drug)"
      - p_days: "LATEST('retail_reimbursements', 'days_supply', date_field='date_of_service', event_type='retail_dmr_approved', drug_name=vac_drug)"
      - on_hand: "MX(0, p_days - DAYS(p_dos, NOW)) if p_count > 0 and (n_count == 0 or p_dos > n_dos) else (0 if n_count > 0 and n_rev > 0 else (MX(0, n_days - DAYS(n_dos, NOW)) if n_count > 0 else 0))"
      - br_count: "COUNT('retail_overrides', override_type='emergency_supply', drug_name=vac_drug)"
      - br_id: "LATEST('retail_overrides', 'retail_override_id', date_field='granted_date', override_type='emergency_supply', drug_name=vac_drug)"
      - br_granted: "LATEST('retail_overrides', 'granted_date', date_field='granted_date', override_type='emergency_supply', drug_name=vac_drug)"
      - br_days: "LATEST('retail_overrides', 'days_supply_allowed', date_field='granted_date', override_type='emergency_supply', drug_name=vac_drug)"
      - br_used: "COUNT('retail_claims', event_type='retail_claim_paid', override_reference_id=br_id)"
      - bu_dos: "LATEST('retail_claims', 'date_of_service', date_field='date_of_service', event_type='retail_claim_paid', override_reference_id=br_id)"
      - bu_days: "LATEST('retail_claims', 'days_supply', date_field='date_of_service', event_type='retail_claim_paid', override_reference_id=br_id)"
      - pending: "br_days if br_count > 0 and br_used == 0 and DAYS(br_granted, NOW) <= 7 else (MX(0, bu_days - DAYS(bu_dos, NOW)) if br_count > 0 and br_used > 0 else 0)"
      - auth_exp: "XLATEST('review', 'review_authorizations', 'expiration_date', date_field='effective_date', event_type='review_auth_granted', drug_name=vac_drug)"
      - open_n: "XCOUNT('review', 'review_cases', event_type='review_case_opened', drug_name=vac_drug)"
      - dec_n: "XCOUNT('review', 'review_cases', event_type='review_case_approved', drug_name=vac_drug) + XCOUNT('review', 'review_cases', event_type='review_case_denied', drug_name=vac_drug) + XCOUNT('review', 'review_cases', event_type='review_case_withdrawn', drug_name=vac_drug) + XCOUNT('review', 'review_cases', event_type='review_case_auto_approved', drug_name=vac_drug)"
      - ceiling: "int(P('vacation_override_max_days_supply') * K('pending_review_vacation_share')) if auth_exp != None and auth_exp < NOW and open_n - dec_n > 0 else (DAYS(NOW, auth_exp) if auth_exp != None and auth_exp >= NOW and DAYS(NOW, auth_exp) < P('vacation_override_max_days_supply') else P('vacation_override_max_days_supply'))"
      - rv6: "COUNT('retail_overrides', within_months=6, date_field='granted_date', override_type='vacation_supply', drug_name=vac_drug)"
      - rv12: "COUNT('retail_overrides', within_months=12, date_field='granted_date', override_type='vacation_supply', drug_name=vac_drug)"
      - repeat_ded: "K('recent_vacation_reduction_days') if rv6 > 0 else (K('earlier_vacation_reduction_days') if rv12 > 0 else 0)"
      - carried: "MX(0, n_days - DAYS(n_dos, p_dos)) if p_count > 0 and n_count > 0 and p_dos > n_dos and DAYS(p_dos, NOW) <= P('early_refill_accumulation_window_days') else 0"
      - early_ded: "carried if carried > P('early_refill_accumulation_limit_days') else (carried - K('early_grace_days') if carried > K('early_grace_days') else 0)"
      - result: "MX(0, ceiling - on_hand - pending - repeat_ded - early_ded)"
    compute_basis:
      vac_drug: "the days of the vacation supply are worked out from the member's records for the drug of the member's most recent paid network claim, recorded against that claim's prescription number."
      n_count: "or zero with no such claim."
      n_id: "when, with no such paper claim, the most recent paid network claim carries a reversal, nothing is counted because that fill was never dispensed"
      n_dos: "The supply on hand for the vacation is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug"
      n_days: "The supply on hand for the vacation is the days not yet run out, as of today and counting the fill's date of service as day zero, of the member's most recent paid network claim for the drug"
      n_rev: "when, with no such paper claim, the most recent paid network claim carries a reversal, nothing is counted because that fill was never dispensed"
      p_count: "when an approved paper claim for the drug has a date of service later than every paid network claim for the drug, the days not yet run out of that paper-claim fill are counted"
      p_dos: "when an approved paper claim for the drug has a date of service later than every paid network claim for the drug, the days not yet run out of that paper-claim fill are counted"
      p_days: "the days not yet run out of that paper-claim fill are counted"
      on_hand: "The supply on hand for the vacation is anchored on the fill the member actually holds: when an approved paper claim for the drug has a date of service later than every paid network claim for the drug, the days not yet run out of that paper-claim fill are counted; when, with no such paper claim, the most recent paid network claim carries a reversal, nothing is counted because that fill was never dispensed; otherwise the days not yet run out of the most recent paid network claim are counted."
      br_count: "when an emergency supply for the drug was granted within the last seven days and no claim has used it yet, its full days are taken off"
      br_id: "when the most recent emergency supply for the drug has already been used by a claim, the days of that claim not yet run out are taken off"
      br_granted: "when an emergency supply for the drug was granted within the last seven days and no claim has used it yet, its full days are taken off"
      br_days: "when an emergency supply for the drug was granted within the last seven days and no claim has used it yet, its full days are taken off"
      br_used: "and no claim has used it yet"
      bu_dos: "when the most recent emergency supply for the drug has already been used by a claim, the days of that claim not yet run out are taken off"
      bu_days: "when the most recent emergency supply for the drug has already been used by a claim, the days of that claim not yet run out are taken off"
      pending: "Supply already authorised for the drug is also taken off the vacation supply: when an emergency supply for the drug was granted within the last seven days and no claim has used it yet, its full days are taken off; when the most recent emergency supply for the drug has already been used by a claim, the days of that claim not yet run out are taken off; otherwise nothing is taken off."
      auth_exp: "when the drug's latest approval has expired and a coverage review case for the drug is still awaiting decision, the vacation ceiling is vacation_override_max_days_supply multiplied by pending_review_vacation_share, rounded down to whole days"
      open_n: "a coverage review case for the drug is still awaiting decision"
      dec_n: "a coverage review case for the drug is still awaiting decision"
      ceiling: "The vacation ceiling depends on the drug's coverage review: when the drug's latest approval has expired and a coverage review case for the drug is still awaiting decision, the vacation ceiling is vacation_override_max_days_supply multiplied by pending_review_vacation_share, rounded down to whole days; when the latest approval is still in force and expires sooner than vacation_override_max_days_supply days from today, the vacation ceiling is the days from today to that expiration date; otherwise it is vacation_override_max_days_supply."
      rv6: "when a vacation supply for the drug was granted in the last six months, recent_vacation_reduction_days are taken off"
      rv12: "when the most recent one was granted six to twelve months ago, earlier_vacation_reduction_days are taken off"
      repeat_ded: "Recent vacation supplies reduce the vacation supply: when a vacation supply for the drug was granted in the last six months, recent_vacation_reduction_days are taken off; when the most recent one was granted six to twelve months ago, earlier_vacation_reduction_days are taken off; otherwise nothing is taken off."
      carried: "the carried early days are the days of the most recent paid network claim not yet run out on the date of service of a later approved paper claim for the drug, counted only when that paper claim falls within early_refill_accumulation_window_days of today"
      early_ded: "when the carried early days exceed early_refill_accumulation_limit_days all of them are taken off; when they exceed early_grace_days but not that limit, the carried early days beyond early_grace_days are taken off; otherwise nothing is taken off."
      result: "All reductions are subtracted together from the vacation ceiling in one step, the result is never below zero, and every quantity is in whole days; apart from rounding the pending-review ceiling down, nothing is rounded."
    factors:
      - id: held_fill_anchor
        effect: method
        decides: on_hand
        bindings: [n_id, n_rev, p_count, p_dos, p_days, on_hand]
        ladder:
          - when: "an approved paper claim for the drug is dated later than every paid network claim for it"
            method: "count the days not yet run out of that paper-claim fill"
          - when: "no such paper claim, and the most recent paid network claim carries a reversal"
            method: "count nothing (the fill was never dispensed)"
          - when: "otherwise"
            method: "count the days not yet run out of the most recent paid network claim"
        baseline:
          on_hand: "MX(0, n_days - DAYS(n_dos, NOW)) if n_count > 0 else 0"
        evidence: [history, date]
        cross_difficulty: null
      - id: authorised_supply_offset
        effect: method
        decides: pending
        bindings: [br_count, br_id, br_granted, br_days, br_used, bu_dos, bu_days, pending]
        ladder:
          - when: "an emergency supply for the drug was granted within the last seven days and no claim has used it"
            method: "take off its full days"
          - when: "the most recent emergency supply for the drug has already been used by a claim"
            method: "take off the days of that claim not yet run out"
          - when: "otherwise"
            method: "take off nothing"
        baseline:
          pending: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: review_status_ceiling
        effect: parameter
        decides: ceiling
        bindings: [auth_exp, open_n, dec_n, ceiling]
        ladder:
          - when: "the drug's latest approval has expired and a review case for the drug is still awaiting decision"
            value: "vacation_override_max_days_supply x K('pending_review_vacation_share'), rounded down"
          - when: "the latest approval is in force and expires sooner than vacation_override_max_days_supply days from today"
            value: "the days from today to the approval's expiration date"
          - when: "otherwise"
            value: "P('vacation_override_max_days_supply')"
        baseline:
          ceiling: "P('vacation_override_max_days_supply')"
        evidence: [cross_category, date]
        cross_difficulty: review
      - id: recent_vacation_reduction
        effect: parameter
        decides: repeat_ded
        bindings: [rv6, rv12, repeat_ded]
        ladder:
          - when: "a vacation supply for the drug was granted in the last six months"
            value: "K('recent_vacation_reduction_days')"
          - when: "the most recent vacation supply for the drug was granted six to twelve months ago"
            value: "K('earlier_vacation_reduction_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_ded: "0"
        evidence: [history]
        cross_difficulty: null
      - id: carried_early_days
        effect: method
        decides: early_ded
        bindings: [carried, early_ded]
        ladder:
          - when: "the carried early days exceed early_refill_accumulation_limit_days"
            method: "take off all carried early days"
          - when: "the carried early days exceed early_grace_days but not early_refill_accumulation_limit_days"
            method: "take off only the carried early days beyond early_grace_days"
          - when: "otherwise"
            method: "take off nothing"
        baseline:
          early_ded: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
    inputs:
      history:
        - {table: retail_claims, aggregate: latest, field: date_of_service, filters: {event_type: retail_claim_paid}}
        - {table: retail_overrides, aggregate: count, field: retail_override_id, within_months: 6, filters: {override_type: vacation_supply}}
        - {table: retail_reimbursements, aggregate: latest, field: date_of_service, filters: {event_type: retail_dmr_approved}}
        - {category: review, table: review_authorizations, aggregate: latest, field: expiration_date, filters: {event_type: review_auth_granted}}
      cross_category: [review]

  - id: retail_ext_dose_change_supply
    base_policy_refs: [retail_evt_override, retail_refill_too_soon]
    overwrite: []
    trigger: state_due
    subject: [retail_override_granted]
    computes: days_supply_allowed
    target_tool: grant_dose_change_override_e9e89c2d
    params:
      weekend_allowance_days: 2
      expedited_transit_days: 2
    rule: >-
      A dose-change override is granted when dose_change_override_allowed is true and the new prescription at the higher dose is on file, for the drug of the member's most recent quantity-limit approval, recorded against the prescription number of that new prescription, and the days it allows are the dose-change supply worked out here.
      The fill being re-dosed is the member's most recent paid retail claim for the drug.
      The days of the fill being re-dosed run from its date of service, that date being day zero.
      The dose-change supply is the days supply of the fill being re-dosed.
      The fill being re-dosed depends on where the member's supply came from: when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the fill being re-dosed; when, with no such shipment, the most recent paid retail claim carries a reversal, no supply was dispensed and the fill being re-dosed counts zero days; otherwise it is the most recent paid retail claim.
      The days of a home delivery shipment run from its delivery rather than its shipment: when the fill being re-dosed is a shipment sent by standard shipping, they start the home delivery program's standard_shipping_business_days plus weekend_allowance_days, counted as calendar days, after the shipment date; when it was sent by two-day, overnight or cold-chain shipping, they start expedited_transit_days calendar days after the shipment date; a retail fill starts on its date of service.
      The new quantity per 30 days depends on the drug's coverage review: when a quantity-limit approval for the drug is in force and took effect after the date of the fill being re-dosed, it is that approval's approved quantity per 30 days; when instead a quantity-limit exception case for the drug opened after that date is still awaiting decision, it is the quantity per 30 days that case requests; otherwise it is the quantity per 30 days of the fill being re-dosed.
      The re-dosing date depends on the drug's coverage review: when a quantity-limit approval for the drug is in force and took effect after the date of the fill being re-dosed, it is that approval's effective date; when instead a quantity-limit exception case for the drug opened after that date is still awaiting decision, it is the date that case was opened; otherwise it is today.
      The dose-change end date is the date the fill being re-dosed would have run out under its own dosing, taken as a share of its days supply rounded down to whole days: for a controlled substance the share is early_refill_threshold_controlled; for a drug that is not a controlled substance and carries a quantity limit in the member's review package the share is the whole days supply; for any other drug it is early_refill_threshold_noncontrolled.
      The dose-change shortfall is worked out as follows: the days of the fill being re-dosed still left on the re-dosing date are re-counted at the new quantity per 30 days (multiplied by the old quantity per 30 days and divided by the new one, rounded down to whole days), and the dose-change shortfall is the days from the re-dosing date to the dose-change end date less those re-counted days, never below zero.
      The dose-change supply then depends on the length of the fill being re-dosed: for a fill of 61 days or more it is the dose-change shortfall, so the member stays on the long fill's cycle; for a fill of 35 to 60 days it is the dose-change shortfall rounded up to a whole multiple of 30 days; for a fill of 34 days or fewer it is the days supply of the fill being re-dosed.
      All quantities are whole calendar days.
    baseline:
      rule: >-
        The fill being re-dosed is the member's most recent paid retail claim for the drug.
        The days of the fill being re-dosed run from its date of service, that date being day zero.
        The dose-change supply is the days supply of the fill being re-dosed.
      params: []
    prerequisite: []
    cross_category:
      - category: review
        as: history
        reads: [review_authorizations.drug_name, review_authorizations.approved_quantity_per_30, review_authorizations.effective_date, review_authorizations.expiration_date, review_cases.requested_quantity_per_30, review_cases.event_at, quantity_limits]
        note: the new-quantity factor and the re-dosing-date factor read the drug's quantity-limit approval or pending quantity-limit case.
      - category: mail
        as: history
        reads: [mail_orders.order_date, mail_orders.days_supply, mail_orders.quantity, mail_orders.shipping_method, standard_shipping_business_days]
        note: the fill-source and delivery-timing factors read the member's home delivery shipments of the drug.
    compute:
      - dc_drug: "XLATEST('review', 'review_authorizations', 'drug_name', date_field='effective_date', event_type='review_auth_granted', authorization_type='quantity_limit')"
      - r_count: "COUNT('retail_claims', event_type='retail_claim_paid', drug_name=dc_drug)"
      - r_id: "LATEST('retail_claims', 'retail_claim_id', date_field='date_of_service', event_type='retail_claim_paid', drug_name=dc_drug)"
      - r_dos: "LATEST('retail_claims', 'date_of_service', date_field='date_of_service', event_type='retail_claim_paid', drug_name=dc_drug)"
      - r_days: "LATEST('retail_claims', 'days_supply', date_field='date_of_service', event_type='retail_claim_paid', drug_name=dc_drug)"
      - r_qty: "LATEST('retail_claims', 'quantity', date_field='date_of_service', event_type='retail_claim_paid', drug_name=dc_drug)"
      - r_rev: "COUNT('retail_claims', event_type='retail_claim_reversed', original_claim_id=r_id)"
      - m_count: "XCOUNT('mail', 'mail_orders', event_type='mail_order_shipped', drug_name=dc_drug)"
      - m_dos: "XLATEST('mail', 'mail_orders', 'order_date', date_field='order_date', event_type='mail_order_shipped', drug_name=dc_drug)"
      - m_days: "XLATEST('mail', 'mail_orders', 'days_supply', date_field='order_date', event_type='mail_order_shipped', drug_name=dc_drug)"
      - m_qty: "XLATEST('mail', 'mail_orders', 'quantity', date_field='order_date', event_type='mail_order_shipped', drug_name=dc_drug)"
      - m_ship: "XLATEST('mail', 'mail_orders', 'shipping_method', date_field='order_date', event_type='mail_order_shipped', drug_name=dc_drug)"
      - from_mail: "m_count > 0 and (r_dos == None or m_dos > r_dos or r_rev > 0)"
      - src_dos: "m_dos if from_mail else r_dos"
      - src_days: "m_days if from_mail else (0 if r_count > 0 and r_rev > 0 else r_days)"
      - src_qty: "m_qty if from_mail else r_qty"
      - transit: "CPARAM('mail', 'standard_shipping_business_days') + K('weekend_allowance_days') if from_mail and m_ship == 'standard' else (K('expedited_transit_days') if from_mail and m_ship != 'standard' else 0)"
      - q_old: "src_qty * 30 / src_days if src_days > 0 else 0"
      - ql_eff: "XLATEST('review', 'review_authorizations', 'effective_date', date_field='effective_date', event_type='review_auth_granted', authorization_type='quantity_limit', drug_name=dc_drug)"
      - ql_exp: "XLATEST('review', 'review_authorizations', 'expiration_date', date_field='effective_date', event_type='review_auth_granted', authorization_type='quantity_limit', drug_name=dc_drug)"
      - ql_qty: "XLATEST('review', 'review_authorizations', 'approved_quantity_per_30', date_field='effective_date', event_type='review_auth_granted', authorization_type='quantity_limit', drug_name=dc_drug)"
      - ql_case_n: "XCOUNT('review', 'review_cases', event_type='review_case_opened', review_type='quantity_limit_exception', drug_name=dc_drug) - XCOUNT('review', 'review_cases', event_type='review_case_approved', review_type='quantity_limit_exception', drug_name=dc_drug) - XCOUNT('review', 'review_cases', event_type='review_case_denied', review_type='quantity_limit_exception', drug_name=dc_drug) - XCOUNT('review', 'review_cases', event_type='review_case_withdrawn', review_type='quantity_limit_exception', drug_name=dc_drug)"
      - ql_case_at: "XLATEST('review', 'review_cases', 'event_at', date_field='event_at', event_type='review_case_opened', review_type='quantity_limit_exception', drug_name=dc_drug)"
      - ql_case_qty: "XLATEST('review', 'review_cases', 'requested_quantity_per_30', date_field='event_at', event_type='review_case_opened', review_type='quantity_limit_exception', drug_name=dc_drug)"
      - approval_after: "ql_eff != None and ql_eff <= NOW and ql_exp >= NOW and ql_eff > src_dos"
      - case_after: "ql_case_n > 0 and ql_case_at != None and ql_case_at > src_dos"
      - q_new: "ql_qty if approval_after else (ql_case_qty if case_after else q_old)"
      - start_off: "0 - DAYS(ql_eff, NOW) if approval_after else (0 - DAYS(ql_case_at, NOW) if case_after else 0)"
      - share: "P('early_refill_threshold_controlled') if dc_drug in P('controlled_substance_drugs') else (1.0 if dc_drug in CPARAM('review', 'quantity_limits', status='active') else P('early_refill_threshold_noncontrolled'))"
      - end_off: "transit - DAYS(src_dos, NOW) + int(src_days * share)"
      - rem_start: "MX(0, transit + src_days - DAYS(src_dos, NOW) - start_off)"
      - recount: "int(rem_start * q_old / q_new) if q_new > 0 else 0"
      - shortfall: "MX(0, end_off - start_off - recount)"
      - dc_days: "shortfall if src_days >= 61 else (((shortfall + 29) // 30) * 30 if src_days >= 35 else src_days)"
      - result: "dc_days"
    compute_basis:
      dc_drug: "for the drug of the member's most recent quantity-limit approval"
      r_count: "otherwise it is the most recent paid retail claim."
      r_id: "when, with no such shipment, the most recent paid retail claim carries a reversal, no supply was dispensed and the fill being re-dosed counts zero days"
      r_dos: "The fill being re-dosed is the member's most recent paid retail claim for the drug."
      r_days: "The dose-change supply is the days supply of the fill being re-dosed."
      r_qty: "otherwise it is the quantity per 30 days of the fill being re-dosed."
      r_rev: "when, with no such shipment, the most recent paid retail claim carries a reversal, no supply was dispensed and the fill being re-dosed counts zero days"
      m_count: "when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the fill being re-dosed"
