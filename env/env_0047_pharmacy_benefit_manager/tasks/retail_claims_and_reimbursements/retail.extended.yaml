        The allowed amount of the paper claim is the network rate per day of the paper claim multiplied by the reimbursed days of the paper claim, rounded to the cent.
        The day-supply multiple of the reimbursed days of the paper claim is one for 34 days or fewer and band_35_60_multiplier for 35 to 60 days; above 60 days it is band_61_90_multiplier where retail_90_allowed is true, and otherwise one 30-day cost share for every 30 days or part of 30 days, so a paper claim is priced on its reimbursed days rather than rejected for its length.
        The deductible portion of the paper claim is, when the receipt's formulary tier is one the plan's deductible applies to and the drug is not an insulin product exempted from the deductible, the lesser of the allowed amount of the paper claim and the member's own deductible remaining (the plan's individual deductible less the deductible met on the member's active plan enrollment), rounded to the cent; otherwise it is zero; a paper claim is decided on the member's own enrollment record alone, so neither the family accumulation nor the Preventive Drug List exemption of the plan's deductible rule is applied to it.
        The tier cost share of the paper claim is the 30-day cost share the member's Pharmacy Benefit Plan sets for the receipt's formulary tier, applied to what the deductible portion leaves: where that tier's basis is copay, the tier copay multiplied by the day-supply multiple, but never more than the allowed amount of the paper claim less its deductible portion, rounded to the cent; where it is coinsurance, the tier coinsurance rate multiplied by the allowed amount of the paper claim less its deductible portion, raised to the tier's per-fill coinsurance minimum and lowered to its per-fill coinsurance maximum where those are not zero, and never more than the allowed amount of the paper claim less its deductible portion, rounded to the cent.
        The member cost share of the paper claim is its deductible portion plus its tier cost share.
        The reimbursement approved on the paper claim is the lesser of the allowed amount of the paper claim and the amount on the receipt, less the member cost share of the paper claim, never below zero, rounded to the cent.
      params: [band_35_60_multiplier, band_61_90_multiplier]
    prerequisite: []
    cross_category:
      - category: plan
        as: branch
        reads: [oop_met, oop_max_individual, deductible_met, deductible_individual, deductible_applies_to_tiers, insulin_bypasses_deductible, t1_basis, t1_copay, t1_coinsurance_rate, t2_basis, t2_copay, t2_coinsurance_rate, t3_basis, t3_copay, t3_coinsurance_rate, t4_basis, t4_copay, t4_coinsurance_rate, t5_basis, t5_copay, t5_coinsurance_rate, t1_coinsurance_min, t1_coinsurance_max, t2_coinsurance_min, t2_coinsurance_max, t3_coinsurance_min, t3_coinsurance_max, t4_coinsurance_min, t4_coinsurance_max, t5_coinsurance_min, t5_coinsurance_max, insulin_cap_30day]
        note: the member-cost-share factor reads the out-of-pocket met and the tier cost-share parameters of the member's active plan enrollment.
    compute:
      - clm_drug: "LATEST('retail_reimbursements', 'drug_name', date_field='received_date', event_type='retail_dmr_submitted')"
      - clm_dos: "LATEST('retail_reimbursements', 'date_of_service', date_field='received_date', event_type='retail_dmr_submitted')"
      - clm_days: "LATEST('retail_reimbursements', 'days_supply', date_field='received_date', event_type='retail_dmr_submitted')"
      - clm_paid: "LATEST('retail_reimbursements', 'submitted_amount', date_field='received_date', event_type='retail_dmr_submitted')"
      - clm_tier: "LATEST('retail_reimbursements', 'formulary_tier', date_field='received_date', event_type='retail_dmr_submitted')"
      - clm_foreign: "LATEST('retail_reimbursements', 'foreign_purchase', date_field='received_date', event_type='retail_dmr_submitted')"
      - clm_network: "LATEST('retail_reimbursements', 'pharmacy_network_status', date_field='received_date', event_type='retail_dmr_submitted')"
      - days_capped: "MN(clm_days, P('max_days_supply_retail')) if clm_foreign == True else (MN(clm_days, P('oon_emergency_days_supply_max')) if clm_network == 'out_of_network' and P('oon_coverage') == 'emergency_only' else clm_days)"
      - net_count: "COUNT('retail_claims', event_type='retail_claim_paid', drug_name=clm_drug)"
      - net_dos: "LATEST('retail_claims', 'date_of_service', date_field='date_of_service', event_type='retail_claim_paid', drug_name=clm_drug)"
      - net_days: "LATEST('retail_claims', 'days_supply', date_field='date_of_service', event_type='retail_claim_paid', drug_name=clm_drug)"
      - refill_threshold: "P('early_refill_threshold_controlled') if clm_drug in P('controlled_substance_drugs') else P('early_refill_threshold_noncontrolled')"
      - elapsed: "DAYS(net_dos, clm_dos) if net_count > 0 else 0"
      - overlap: "MX(0, net_days - elapsed) if net_count > 0 else 0"
      - paid_days: "days_capped - overlap if net_count > 0 and elapsed < net_days * refill_threshold else (days_capped - (overlap - P('early_refill_accumulation_limit_days')) if overlap > P('early_refill_accumulation_limit_days') else days_capped)"
      - net_allowed: "LATEST('retail_claims', 'allowed_amount', date_field='date_of_service', event_type='retail_claim_paid', drug_name=clm_drug)"
      - per_day: "net_allowed / net_days if net_count > 0 else clm_paid / clm_days"
      - allowed: "RND(clm_paid * paid_days / clm_days * P('oon_reimbursement_rate'), 2) if clm_foreign == True else (RND(per_day * paid_days * P('oon_reimbursement_rate'), 2) if clm_network == 'out_of_network' else RND(per_day * paid_days, 2))"
      - units: "1 if paid_days <= 34 else (P('band_35_60_multiplier') if paid_days <= 60 else (P('band_61_90_multiplier') if P('retail_90_allowed') else (paid_days + 29) // 30))"
      - tier_basis: "CPARAM('plan', 't1_basis', status='active') if clm_tier == '1' else (CPARAM('plan', 't2_basis', status='active') if clm_tier == '2' else (CPARAM('plan', 't3_basis', status='active') if clm_tier == '3' else (CPARAM('plan', 't4_basis', status='active') if clm_tier == '4' else CPARAM('plan', 't5_basis', status='active'))))"
      - tier_copay: "CPARAM('plan', 't1_copay', status='active') if clm_tier == '1' else (CPARAM('plan', 't2_copay', status='active') if clm_tier == '2' else (CPARAM('plan', 't3_copay', status='active') if clm_tier == '3' else (CPARAM('plan', 't4_copay', status='active') if clm_tier == '4' else CPARAM('plan', 't5_copay', status='active'))))"
      - tier_rate: "CPARAM('plan', 't1_coinsurance_rate', status='active') if clm_tier == '1' else (CPARAM('plan', 't2_coinsurance_rate', status='active') if clm_tier == '2' else (CPARAM('plan', 't3_coinsurance_rate', status='active') if clm_tier == '3' else (CPARAM('plan', 't4_coinsurance_rate', status='active') if clm_tier == '4' else CPARAM('plan', 't5_coinsurance_rate', status='active'))))"
      - is_insulin: "clm_drug == 'Lantus' or clm_drug == 'insulin glargine-yfgn'"
      - ded_left: "MX(0, CPARAM('plan', 'deductible_individual', status='active') - CFIELD('plan', 'deductible_met', status='active'))"
      - ded_part: "RND(MN(allowed, ded_left), 2) if clm_tier != 'not_applicable' and int(clm_tier) in CPARAM('plan', 'deductible_applies_to_tiers', status='active') and not (is_insulin and CPARAM('plan', 'insulin_bypasses_deductible', status='active')) else 0"
      - tier_min: "CPARAM('plan', 't1_coinsurance_min', status='active') if clm_tier == '1' else (CPARAM('plan', 't2_coinsurance_min', status='active') if clm_tier == '2' else (CPARAM('plan', 't3_coinsurance_min', status='active') if clm_tier == '3' else (CPARAM('plan', 't4_coinsurance_min', status='active') if clm_tier == '4' else CPARAM('plan', 't5_coinsurance_min', status='active'))))"
      - tier_max: "CPARAM('plan', 't1_coinsurance_max', status='active') if clm_tier == '1' else (CPARAM('plan', 't2_coinsurance_max', status='active') if clm_tier == '2' else (CPARAM('plan', 't3_coinsurance_max', status='active') if clm_tier == '3' else (CPARAM('plan', 't4_coinsurance_max', status='active') if clm_tier == '4' else CPARAM('plan', 't5_coinsurance_max', status='active'))))"
      - coins_low: "MX(tier_rate * (allowed - ded_part), tier_min) if tier_min > 0 else tier_rate * (allowed - ded_part)"
      - coins_cap: "MN(coins_low, tier_max) if tier_max > 0 else coins_low"
      - tier_cs: "RND(MN(tier_copay * units, allowed - ded_part), 2) if tier_basis == 'copay' else RND(MN(coins_cap, allowed - ded_part), 2)"
      - oop_met: "CFIELD('plan', 'oop_met', status='active')"
      - oop_max: "CPARAM('plan', 'oop_max_individual', status='active')"
      - cost_share: "0 if oop_met >= oop_max else (ded_part + MN(RND(CPARAM('plan', 'insulin_cap_30day', status='active') * units, 2), tier_cs) if is_insulin else ded_part + tier_cs)"
      - result: "RND(MX(0, MN(allowed, clm_paid) - cost_share), 2)"
