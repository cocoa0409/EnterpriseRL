category: retail
display_name: Retail Pharmacy Network Benefit

binding:
  holding_table: retail_benefits
  event_tables: [retail_claims, retail_overrides, retail_reimbursements]
  status_field: status
  variant_field: variant_name
  quantity_fields: {reimbursement_balance: reimbursement_due}

lifecycle:
  states: [pending_effective, active, lock_in, terminated]
  transitions:
    - {from: pending_effective, to: active, by: system, means: The plan coverage effective date is reached and the member can fill at network pharmacies.}
    - {from: pending_effective, to: terminated, by: system, means: The future-dated plan enrollment is cancelled before it takes effect.}
    - {from: active, to: terminated, by: system, means: Plan coverage ends and retail coverage ends with it.}
    - {from: lock_in, to: terminated, by: system, means: Plan coverage ends while the member is locked in.}
    - {from: terminated, to: active, by: system, means: A COBRA reinstatement restores retail coverage.}
    - {from: active, to: lock_in, by: system, means: The controlled-substance safety review places the member in pharmacy lock-in.}
    - {from: lock_in, to: active, by: system, means: The lock-in period ends or the safety review releases the member.}

accounts:
  - key: member_cost_share
    unit: USD
    meaning: Member cost share paid at network pharmacies on retail claims; raised by paid claims and lowered by reversals.
  - key: reimbursement_due
    unit: USD
    meaning: Approved paper-claim reimbursement owed to the member and not yet paid; raised by approvals and lowered by payments.

parameter_schema:
  network_pharmacy_count: approximate number of contracted retail pharmacies in the network (informational, quoted to members)
  preferred_pharmacy_subnetwork: the network has a preferred-pharmacy subset with lower member cost share; boolean
  preferred_reduction_t1: amount the member's tier 1 cost share is reduced at a preferred pharmacy per 30-day supply, USD (never below 0.00)
  preferred_reduction_t2: amount the member's tier 2 cost share is reduced at a preferred pharmacy per 30-day supply, USD
  preferred_reduction_t3: amount the member's tier 3 cost share is reduced at a preferred pharmacy per 30-day supply, USD
  oon_coverage: 'out-of-network retail coverage: emergency_only (only urgent fills while away from any network pharmacy, reimbursed by paper claim) or covered_with_penalty (any out-of-network fill reimbursed at oon_reimbursement_rate); enum'
  oon_reimbursement_rate: fraction of the network allowed amount used as the allowed amount for an out-of-network fill
  oon_emergency_days_supply_max: maximum days supply reimbursed for an emergency out-of-network fill
  max_days_supply_retail: maximum days supply per retail fill
  retail_90_allowed: a 61-90 day supply may be filled at a retail pharmacy; boolean
  band_35_60_multiplier: multiple of the 30-day cost share charged for a 35-60 day retail supply (fills of 1-34 days are one 30-day cost share)
  band_61_90_multiplier: multiple of the 30-day cost share charged for a 61-90 day retail supply (0.0 where retail_90_allowed is false)
  maintenance_program: 'maintenance-medication rule at retail: mandatory_after_courtesy (after the courtesy fills a 30-day retail fill of a maintenance drug carries the maintenance penalty), retail90_or_mail (after the courtesy fills a maintenance drug must be filled as 90 days at retail or by home delivery), none; enum'
  maintenance_courtesy_fills: 30-day retail fills of the same maintenance drug allowed per plan year before the maintenance rule applies (0 where maintenance_program is none)
  maintenance_penalty: 'what the member pays on a 30-day retail maintenance fill after the courtesy fills: full_cost (the full allowed amount, not counted toward deductible or out-of-pocket), double_copay (twice the 30-day cost share), reject (claim rejects; must be filled as 90 days at retail or home delivery), none; enum'
  maintenance_opt_out_allowed: the member may elect to keep filling 30-day maintenance supplies at retail at the normal cost share by recording an opt-out choice; boolean
  maintenance_drugs: drugs from the Northbridge Rx drug master list treated as maintenance medications
  controlled_substance_drugs: drugs from the Northbridge Rx drug master list that are DEA-scheduled controlled substances (all are opioids for the opioid edits)
  early_refill_threshold_noncontrolled: fraction of the previous fill's days supply that must have elapsed before a non-controlled drug can be refilled
  early_refill_threshold_controlled: fraction of the previous fill's days supply that must have elapsed before a controlled substance can be refilled
  early_refill_accumulation_limit_days: maximum extra days supply a member may accumulate through early refills of one drug within the accumulation window
  early_refill_accumulation_window_days: rolling window in calendar days over which accumulated early-refill days are counted
  vacation_override_per_plan_year: vacation-supply overrides allowed per drug per plan year
  vacation_override_max_days_supply: maximum days supply a vacation override allows in one fill
  vacation_override_lead_days: earliest number of calendar days before the departure date that a vacation override may be granted
  lost_stolen_override_per_plan_year: lost, stolen or damaged medication overrides allowed per drug per plan year
  lost_stolen_controlled_allowed: a lost or stolen controlled substance may be replaced by override; boolean
  lost_stolen_controlled_police_report: a lost or stolen controlled-substance override requires a police report number; boolean
  dose_change_override_allowed: an early refill is allowed when the prescriber increased the dose and the new prescription is on file; boolean
  emergency_supply_days: days supply of an emergency override for a drug whose coverage review is pending
  emergency_supply_per_drug_per_year: emergency supply overrides allowed per drug per plan year
  opioid_initial_days_supply_limit: maximum days supply of a first opioid fill for a member with no opioid claim in the opioid-naive lookback
  opioid_naive_lookback_days: calendar days with no paid opioid claim that make a member opioid-naive
  opioid_mme_daily_limit: daily morphine milligram equivalent above which an opioid claim rejects without a coverage review
  controlled_lockin_allowed: the network runs a controlled-substance pharmacy lock-in program; boolean
  lockin_trigger_prescribers: number of different prescribers of controlled substances within the trigger window that qualifies a member for lock-in review
  lockin_trigger_pharmacies: number of different pharmacies dispensing controlled substances within the trigger window that qualifies a member for lock-in review
  lockin_trigger_window_days: rolling window in calendar days for the lock-in trigger counts
  lockin_period_months: length of a lock-in period in months from the lock-in start date
  lockin_pharmacy_changes_per_period: member-requested changes of the lock-in pharmacy allowed per lock-in period (a pharmacy closure never counts)
  dmr_filing_limit_days: calendar days after the date of service within which a direct member reimbursement (paper claim) must be received
  dmr_processing_days: calendar days from receipt within which a paper claim is decided and, if approved, paid
  dmr_reimbursement_basis: 'how a paper claim is priced: the network allowed amount (or the out-of-network allowed amount) for the drug, capped at what the member paid, less the member cost share the plan would have charged; enum'
  dmr_minimum_payment: reimbursements below this amount are approved but no payment is issued, USD
  dmr_receipt_required: an itemized pharmacy receipt showing drug, NDC, quantity, days supply and amount paid is required; boolean
  dmr_foreign_claims_covered: emergency fills purchased outside the United States may be reimbursed; boolean
  dmr_payment_methods: payment methods for approved paper claims; direct deposit is used when banking details are on file
  return_to_stock_days: calendar days after the date of service after which a fill not picked up is reversed by the pharmacy
  claim_reprocessing_window_days: calendar days after the date of service within which Northbridge Rx may reverse and re-adjudicate a paid claim to correct the member cost share
  pharmacy_refund_days: calendar days after a re-adjudication within which the network pharmacy must refund the member's overpayment
  lesser_of_usual_and_customary: the member pays the lesser of the computed cost share and the pharmacy's usual and customary cash price; boolean
  copay_card_secondary_billing: network pharmacies may bill a manufacturer copay card as secondary payer on a retail claim; boolean

