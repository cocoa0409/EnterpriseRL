      from_mail: "when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the fill being re-dosed"
      src_dos: "The fill being re-dosed depends on where the member's supply came from"
