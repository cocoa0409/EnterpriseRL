        decides: transit
        bindings: [m_ship, transit]
        ladder:
          - when: "the fill being re-dosed is a home delivery shipment sent by standard shipping"
            value: "CPARAM('mail', 'standard_shipping_business_days') + K('weekend_allowance_days') calendar days"
          - when: "the fill being re-dosed is a home delivery shipment sent two-day, overnight or cold chain"
            value: "K('expedited_transit_days')"
          - when: "otherwise (a retail fill)"
            value: "0"
        baseline:
          transit: "0"
        evidence: [cross_category]
        cross_difficulty: mail
      - id: new_quantity_source
        effect: parameter
        decides: q_new
        bindings: [ql_eff, ql_exp, ql_qty, ql_case_n, ql_case_qty, approval_after, q_new]
        ladder:
          - when: "a quantity-limit approval for the drug is in force and took effect after the date of the fill being re-dosed"
            value: "the approval's approved quantity per 30 days"
          - when: "a quantity-limit exception case for the drug opened after that date is still awaiting decision"
            value: "the case's requested quantity per 30 days"
          - when: "otherwise"
            value: "the quantity per 30 days of the fill being re-dosed"
        baseline:
          q_new: "q_old"
        evidence: [cross_category, date]
        cross_difficulty: review
      - id: re_dosing_date
        effect: parameter
        decides: start_off
        bindings: [ql_case_at, case_after, start_off]
        ladder:
          - when: "a quantity-limit approval for the drug is in force and took effect after the date of the fill being re-dosed"
            value: "the approval's effective date"
          - when: "a quantity-limit exception case for the drug opened after that date is still awaiting decision"
            value: "the date that case was opened"
          - when: "otherwise"
            value: "today"
        baseline:
          start_off: "0"
        evidence: [cross_category, date]
        cross_difficulty: review
      - id: dose_change_end_share
        effect: parameter
        decides: share
        bindings: [share]
        ladder:
          - when: "the drug is a controlled substance"
            value: "P('early_refill_threshold_controlled')"
          - when: "the drug is not controlled and carries a quantity limit in the member's review package"
            value: "1.0 (the whole days supply)"
          - when: "otherwise"
            value: "P('early_refill_threshold_noncontrolled')"
        baseline:
          share: "P('early_refill_threshold_noncontrolled')"
        evidence: [cross_category, tier_param]
        cross_difficulty: review
      - id: fill_length_sizing
        effect: method
        decides: dc_days
        bindings: [r_days, dc_days]
        ladder:
          - when: "the fill being re-dosed is 61 days or more"
            method: "the dose-change shortfall (keep the long fill's cycle)"
          - when: "the fill being re-dosed is 35 to 60 days"
            method: "the dose-change shortfall rounded up to a whole multiple of 30 days"
          - when: "otherwise (34 days or fewer)"
            method: "the full days supply of the fill being re-dosed"
        baseline:
          dc_days: "src_days"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: retail_claims, aggregate: latest, field: date_of_service, filters: {event_type: retail_claim_paid}}
        - {category: mail, table: mail_orders, aggregate: latest, field: order_date, filters: {event_type: mail_order_shipped}}
        - {category: review, table: review_authorizations, aggregate: latest, field: approved_quantity_per_30, filters: {authorization_type: quantity_limit}}
      cross_category: [review, mail]

  - id: retail_ext_lost_stolen_replacement
    base_policy_refs: [retail_evt_override, retail_refill_too_soon]
    overwrite: []
    trigger: on_request
    subject: [retail_override_granted]
    computes: days_supply_allowed
    target_tool: report_lost_stolen_replacement_dcea41b5
    params:
      weekend_allowance_days: 2
      same_drug_loss_reduction_days: 7
      other_drug_loss_reduction_days: 3
      repeat_override_share: 0.5
      single_override_share: 0.75
      expedited_transit_days: 2
    rule: >-
      A member whose medication was lost, stolen or damaged reports it themselves, and the replacement is recorded for the drug of the member's most recent home delivery shipment against the prescription number the member's network pharmacy holds for it; the days it allows are the replacement supply worked out here.
      A replacement for lost, stolen or damaged medication is sized only after the benefit carries a dose-change override for every quantity-limit approval that raised the drug's quantity since its most recent fill.
      The lost supply is the member's most recent paid retail claim for the drug, and its days run from its date of service, that date being day zero.
      The lost days are the days of the lost supply not yet run out today.
      The replacement supply is the lost days, never below zero, in whole days.
      The lost supply depends on where the member's medication came from: when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the lost supply; when, with no such shipment, the most recent paid retail claim carries a reversal, nothing was dispensed and the lost supply counts zero days; otherwise it is the most recent paid retail claim.
      A home delivery shipment's days are counted from its arrival: after a standard shipment they start the home delivery program's standard_shipping_business_days plus weekend_allowance_days, counted as calendar days, after the shipment date; after a two-day, overnight or cold-chain shipment they start expedited_transit_days calendar days after it; a retail fill's days start on its date of service.
      The lost days are counted at the dosing on record: when a dose-change override for the drug was granted on or after the date of the lost supply, the days of the lost supply left on the effective date of the drug's quantity-limit approval in force are re-counted at that approval's quantity per 30 days (multiplied by the lost supply's quantity per 30 days and divided by the approved one, rounded down to whole days) and the days from that effective date to today are taken off; when instead a quantity-limit exception case for the drug opened after the date of the lost supply is still awaiting decision, the days of the lost supply left on the date that case was opened are re-counted at the quantity per 30 days the case requests (multiplied by the lost supply's quantity per 30 days and divided by the requested one, rounded down to whole days) and the days from that date to today are taken off; otherwise the lost days are the days not yet run out today at the lost supply's own dosing.
      Earlier losses reduce the replacement: when a lost, stolen or damaged replacement was granted for the same drug in the last twelve months, same_drug_loss_reduction_days are taken off the lost days; when one was granted only for another drug in the last twelve months, other_drug_loss_reduction_days are taken off; otherwise nothing is taken off.
      Earlier early-fill overrides for the drug shrink what is replaced: when two or more overrides of any type were granted for the drug in the last twelve months, the replacement supply is the reduced lost days multiplied by repeat_override_share; when exactly one was, it is multiplied by single_override_share; otherwise the reduced lost days are replaced in full.
      The reduction is taken off first, the share is applied to what remains, and the replacement supply is rounded down to whole days, never below zero.
    baseline:
      rule: >-
        The lost supply is the member's most recent paid retail claim for the drug, and its days run from its date of service, that date being day zero.
        The lost days are the days of the lost supply not yet run out today.
        The replacement supply is the lost days, never below zero, in whole days.
      params: []
    prerequisite:
      - problem: retail_ext_dose_change_supply
        kind: value_input
        gate: lost_days
        form: state
        policy_source: >-
          A replacement for lost, stolen or damaged medication is sized only after the benefit carries a dose-change override for every quantity-limit approval that raised the drug's quantity since its most recent fill.
        condition: >-
          when a quantity-limit approval raising the drug's quantity per 30 days took effect after the most recent fill of the drug, a retail_overrides row of override_type dose_change for the drug granted on or after that fill stands on the retail benefit
        resolved_by: grant_dose_change_override_e9e89c2d
        effect: >-
          with the dose-change override on record the lost days are re-counted at the approved quantity from the approval's effective date (lost_days), and the override also counts among the early-fill overrides of the last twelve months (share)
    cross_category:
      - category: mail
        as: history
        reads: [mail_orders.drug_name, mail_orders.order_date, mail_orders.days_supply, mail_orders.quantity, mail_orders.shipping_method, standard_shipping_business_days]
        note: the lost-supply-source and arrival-timing factors read the member's home delivery shipments of the drug.
      - category: review
        as: history
        reads: [review_authorizations.approved_quantity_per_30, review_authorizations.effective_date, review_cases.requested_quantity_per_30, review_cases.event_at]
        note: the dosing-on-record factor reads the drug's quantity-limit approval or pending case.
    compute:
      - ls_drug: "XLATEST('mail', 'mail_orders', 'drug_name', date_field='order_date', event_type='mail_order_shipped')"
      - r_count: "COUNT('retail_claims', event_type='retail_claim_paid', drug_name=ls_drug)"
      - r_id: "LATEST('retail_claims', 'retail_claim_id', date_field='date_of_service', event_type='retail_claim_paid', drug_name=ls_drug)"
      - r_dos: "LATEST('retail_claims', 'date_of_service', date_field='date_of_service', event_type='retail_claim_paid', drug_name=ls_drug)"
      - r_days: "LATEST('retail_claims', 'days_supply', date_field='date_of_service', event_type='retail_claim_paid', drug_name=ls_drug)"
      - r_qty: "LATEST('retail_claims', 'quantity', date_field='date_of_service', event_type='retail_claim_paid', drug_name=ls_drug)"
      - r_rev: "COUNT('retail_claims', event_type='retail_claim_reversed', original_claim_id=r_id)"
      - m_count: "XCOUNT('mail', 'mail_orders', event_type='mail_order_shipped', drug_name=ls_drug)"
      - m_dos: "XLATEST('mail', 'mail_orders', 'order_date', date_field='order_date', event_type='mail_order_shipped', drug_name=ls_drug)"
      - m_days: "XLATEST('mail', 'mail_orders', 'days_supply', date_field='order_date', event_type='mail_order_shipped', drug_name=ls_drug)"
      - m_qty: "XLATEST('mail', 'mail_orders', 'quantity', date_field='order_date', event_type='mail_order_shipped', drug_name=ls_drug)"
      - m_ship: "XLATEST('mail', 'mail_orders', 'shipping_method', date_field='order_date', event_type='mail_order_shipped', drug_name=ls_drug)"
      - via_mail: "m_count > 0 and (r_dos == None or m_dos > r_dos or r_rev > 0)"
      - lost_dos: "m_dos if via_mail else r_dos"
      - lost_len: "m_days if via_mail else (0 if r_count > 0 and r_rev > 0 else r_days)"
      - lost_qty: "m_qty if via_mail else r_qty"
      - arrival: "CPARAM('mail', 'standard_shipping_business_days') + K('weekend_allowance_days') if via_mail and m_ship == 'standard' else (K('expedited_transit_days') if via_mail and m_ship != 'standard' else 0)"
      - left_today: "arrival + lost_len - DAYS(lost_dos, NOW)"
      - q_lost: "lost_qty * 30 / lost_len if lost_len > 0 else 0"
      - dc_n: "COUNT('retail_overrides', override_type='dose_change', drug_name=ls_drug)"
      - dc_granted: "LATEST('retail_overrides', 'granted_date', date_field='granted_date', override_type='dose_change', drug_name=ls_drug)"
      - ql_eff: "XLATEST('review', 'review_authorizations', 'effective_date', date_field='effective_date', event_type='review_auth_granted', authorization_type='quantity_limit', drug_name=ls_drug)"
      - ql_qty: "XLATEST('review', 'review_authorizations', 'approved_quantity_per_30', date_field='effective_date', event_type='review_auth_granted', authorization_type='quantity_limit', drug_name=ls_drug)"
      - case_open: "XCOUNT('review', 'review_cases', event_type='review_case_opened', review_type='quantity_limit_exception', drug_name=ls_drug) - XCOUNT('review', 'review_cases', event_type='review_case_approved', review_type='quantity_limit_exception', drug_name=ls_drug) - XCOUNT('review', 'review_cases', event_type='review_case_denied', review_type='quantity_limit_exception', drug_name=ls_drug) - XCOUNT('review', 'review_cases', event_type='review_case_withdrawn', review_type='quantity_limit_exception', drug_name=ls_drug)"
      - case_at: "XLATEST('review', 'review_cases', 'event_at', date_field='event_at', event_type='review_case_opened', review_type='quantity_limit_exception', drug_name=ls_drug)"
      - case_qty: "XLATEST('review', 'review_cases', 'requested_quantity_per_30', date_field='event_at', event_type='review_case_opened', review_type='quantity_limit_exception', drug_name=ls_drug)"
      - lost_days: "int(MX(0, left_today + DAYS(ql_eff, NOW)) * q_lost / ql_qty) - DAYS(ql_eff, NOW) if dc_n > 0 and dc_granted >= lost_dos and ql_eff != None and ql_qty > 0 else (int(MX(0, left_today + DAYS(case_at, NOW)) * q_lost / case_qty) - DAYS(case_at, NOW) if case_open > 0 and case_at != None and case_at > lost_dos and case_qty > 0 else left_today)"
      - ls12_same: "COUNT('retail_overrides', within_months=12, date_field='granted_date', override_type='lost_stolen', drug_name=ls_drug)"
      - ls12_all: "COUNT('retail_overrides', within_months=12, date_field='granted_date', override_type='lost_stolen')"
      - loss_ded: "K('same_drug_loss_reduction_days') if ls12_same > 0 else (K('other_drug_loss_reduction_days') if ls12_all - ls12_same > 0 else 0)"
      - ov12: "COUNT('retail_overrides', within_months=12, date_field='granted_date', drug_name=ls_drug)"
      - repl_share: "K('repeat_override_share') if ov12 >= 2 else (K('single_override_share') if ov12 == 1 else 1)"
      - result: "int(MX(0, lost_days - loss_ded) * repl_share)"
    compute_basis:
      ls_drug: "the replacement is recorded for the drug of the member's most recent home delivery shipment against the prescription number the member's network pharmacy holds for it"
      r_count: "otherwise it is the most recent paid retail claim."
      r_id: "when, with no such shipment, the most recent paid retail claim carries a reversal, nothing was dispensed and the lost supply counts zero days"
      r_dos: "The lost supply is the member's most recent paid retail claim for the drug, and its days run from its date of service, that date being day zero."
      r_days: "The lost supply is the member's most recent paid retail claim for the drug"
      r_qty: "at the lost supply's own dosing"
      r_rev: "when, with no such shipment, the most recent paid retail claim carries a reversal, nothing was dispensed and the lost supply counts zero days"
      m_count: "when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the lost supply"
      m_dos: "when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the lost supply"
      m_days: "when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the lost supply"
      m_qty: "when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the lost supply"
      m_ship: "after a standard shipment they start the home delivery program's standard_shipping_business_days plus weekend_allowance_days, counted as calendar days, after the shipment date; after a two-day, overnight or cold-chain shipment they start expedited_transit_days calendar days after it"
      via_mail: "when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the lost supply"
      lost_dos: "The lost supply depends on where the member's medication came from"
      lost_len: "The lost supply depends on where the member's medication came from: when the member has a home delivery shipment of the drug and it is dated later than the most recent paid retail claim for the drug or that retail claim carries a reversal, the most recent shipment is the lost supply; when, with no such shipment, the most recent paid retail claim carries a reversal, nothing was dispensed and the lost supply counts zero days; otherwise it is the most recent paid retail claim."
      lost_qty: "The lost supply depends on where the member's medication came from"
      arrival: "A home delivery shipment's days are counted from its arrival: after a standard shipment they start the home delivery program's standard_shipping_business_days plus weekend_allowance_days, counted as calendar days, after the shipment date; after a two-day, overnight or cold-chain shipment they start expedited_transit_days calendar days after it; a retail fill's days start on its date of service."
      left_today: "The lost days are the days of the lost supply not yet run out today."
      q_lost: "multiplied by the lost supply's quantity per 30 days and divided by the approved one, rounded down to whole days"
      dc_n: "when a dose-change override for the drug was granted on or after the date of the lost supply"
      dc_granted: "when a dose-change override for the drug was granted on or after the date of the lost supply"
      ql_eff: "the days of the lost supply left on the effective date of the drug's quantity-limit approval in force are re-counted at that approval's quantity per 30 days"
      ql_qty: "re-counted at that approval's quantity per 30 days"
      case_open: "when instead a quantity-limit exception case for the drug opened after the date of the lost supply is still awaiting decision"
      case_at: "the days of the lost supply left on the date that case was opened are re-counted at the quantity per 30 days the case requests"
      case_qty: "multiplied by the lost supply's quantity per 30 days and divided by the requested one, rounded down to whole days"
      lost_days: "The lost days are counted at the dosing on record: when a dose-change override for the drug was granted on or after the date of the lost supply, the days of the lost supply left on the effective date of the drug's quantity-limit approval in force are re-counted at that approval's quantity per 30 days (multiplied by the lost supply's quantity per 30 days and divided by the approved one, rounded down to whole days) and the days from that effective date to today are taken off; when instead a quantity-limit exception case for the drug opened after the date of the lost supply is still awaiting decision, the days of the lost supply left on the date that case was opened are re-counted at the quantity per 30 days the case requests (multiplied by the lost supply's quantity per 30 days and divided by the requested one, rounded down to whole days) and the days from that date to today are taken off; otherwise the lost days are the days not yet run out today at the lost supply's own dosing."
      ls12_same: "when a lost, stolen or damaged replacement was granted for the same drug in the last twelve months, same_drug_loss_reduction_days are taken off the lost days"
      ls12_all: "when one was granted only for another drug in the last twelve months, other_drug_loss_reduction_days are taken off"
      loss_ded: "Earlier losses reduce the replacement: when a lost, stolen or damaged replacement was granted for the same drug in the last twelve months, same_drug_loss_reduction_days are taken off the lost days; when one was granted only for another drug in the last twelve months, other_drug_loss_reduction_days are taken off; otherwise nothing is taken off."
      ov12: "when two or more overrides of any type were granted for the drug in the last twelve months"
      repl_share: "Earlier early-fill overrides for the drug shrink what is replaced: when two or more overrides of any type were granted for the drug in the last twelve months, the replacement supply is the reduced lost days multiplied by repeat_override_share; when exactly one was, it is multiplied by single_override_share; otherwise the reduced lost days are replaced in full."
      result: "The reduction is taken off first, the share is applied to what remains, and the replacement supply is rounded down to whole days, never below zero."
    factors:
      - id: lost_supply_source
        effect: method
        decides: lost_len
        bindings: [r_id, r_rev, m_count, m_dos, m_days, m_qty, via_mail, lost_dos, lost_len, lost_qty]
        ladder:
          - when: "a home delivery shipment of the drug exists and is dated later than the most recent paid retail claim, or that retail claim carries a reversal"
            method: "take the most recent shipment as the lost supply"
          - when: "no such shipment, and the most recent paid retail claim carries a reversal"
            method: "count zero days (nothing was dispensed)"
          - when: "otherwise"
            method: "take the most recent paid retail claim"
        baseline:
          lost_dos: "r_dos"
          lost_len: "r_days"
          lost_qty: "r_qty"
        evidence: [history, cross_category]
        cross_difficulty: mail
      - id: arrival_timing
        effect: parameter
        decides: arrival
        bindings: [m_ship, arrival]
        ladder:
          - when: "the lost supply is a home delivery shipment sent by standard shipping"
            value: "CPARAM('mail', 'standard_shipping_business_days') + K('weekend_allowance_days') calendar days"
          - when: "the lost supply is a home delivery shipment sent two-day, overnight or cold chain"
            value: "K('expedited_transit_days')"
          - when: "otherwise (a retail fill)"
            value: "0"
        baseline:
          arrival: "0"
        evidence: [cross_category]
        cross_difficulty: mail
      - id: dosing_on_record
        effect: parameter
        decides: lost_days
        bindings: [dc_n, dc_granted, ql_eff, ql_qty, case_open, case_at, case_qty, lost_days]
        ladder:
          - when: "a dose-change override for the drug was granted on or after the date of the lost supply"
            value: "the approval's quantity per 30 days, counted from the approval's effective date"
          - when: "a quantity-limit case for the drug opened after the lost supply is still awaiting decision"
            value: "the case's requested quantity per 30 days, counted from the case's opening date"
          - when: "otherwise"
            value: "the lost supply's own quantity per 30 days, counted from today"
        baseline:
          lost_days: "left_today"
        evidence: [history, cross_category, date]
        cross_difficulty: review
      - id: earlier_loss_reduction
        effect: parameter
        decides: loss_ded
        bindings: [ls12_same, ls12_all, loss_ded]
        ladder:
          - when: "a lost, stolen or damaged replacement was granted for the same drug in the last twelve months"
            value: "K('same_drug_loss_reduction_days')"
          - when: "one was granted only for another drug in the last twelve months"
            value: "K('other_drug_loss_reduction_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          loss_ded: "0"
        evidence: [history]
        cross_difficulty: null
      - id: early_fill_override_share
        effect: parameter
        decides: repl_share
        bindings: [ov12, repl_share]
        ladder:
          - when: "two or more overrides of any type were granted for the drug in the last twelve months"
            value: "K('repeat_override_share')"
          - when: "exactly one override was granted for the drug in the last twelve months"
            value: "K('single_override_share')"
          - when: "otherwise"
            value: "1 (replaced in full)"
        baseline:
          repl_share: "1"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: retail_overrides, aggregate: count, field: retail_override_id, within_months: 12, filters: {override_type: lost_stolen}}
        - {table: retail_claims, aggregate: latest, field: date_of_service, filters: {event_type: retail_claim_paid}}
        - {category: mail, table: mail_orders, aggregate: latest, field: order_date, filters: {event_type: mail_order_shipped}}
        - {category: review, table: review_authorizations, aggregate: latest, field: effective_date, filters: {authorization_type: quantity_limit}}
