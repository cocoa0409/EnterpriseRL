category: specialty
display_name: Specialty Pharmacy Program

binding:
  holding_table: specialty_enrollments
  event_tables: [specialty_fills, specialty_ledger, specialty_care_contacts]
  intake_tables: [specialty_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {assistance_balance: copay_assistance, balance_due: specialty_balance}

lifecycle:
  states: [referred, benefits_verification, active, on_hold, discharged]
  transitions:
    - {from: referred, to: benefits_verification, by: agent, means: The referral intake is complete and benefits verification starts.}
    - {from: benefits_verification, to: active, by: agent, means: Coverage is confirmed, the member agrees to enroll and the first delivery can be scheduled.}
    - {from: active, to: on_hold, by: agent, means: Shipments pause because coverage ended, the coverage review lapsed, the member is hospitalized or pausing therapy, or payment is overdue.}
    - {from: on_hold, to: active, by: agent, means: The cause of the hold is cleared and shipments resume.}
    - {from: referred, to: discharged, by: user, means: The member declines the program before verification.}
    - {from: benefits_verification, to: discharged, by: system, means: Coverage cannot be confirmed or the referral expires without activation.}
    - {from: active, to: discharged, by: user, means: The member confirms disenrollment or a transfer of the prescription to another pharmacy.}
    - {from: on_hold, to: discharged, by: system, means: The hold exceeds its maximum length or the prescriber stops the therapy.}

accounts:
  - key: copay_assistance
    unit: USD
    meaning: Manufacturer copay assistance available to the member for this therapy in the program year; raised when the program year's benefit is loaded and lowered as it pays fills.
  - key: specialty_balance
    unit: USD
    meaning: Member cost share owed for shipped specialty fills; raised by shipments and lowered by member payments and assistance payments.

parameter_schema:
  specialty_drugs: drugs from the Northbridge Rx drug master list managed by the specialty program
  cold_chain_drugs: specialty drugs that ship refrigerated
  exclusive_specialty_pharmacy: specialty drugs are covered only when dispensed by Northbridge Specialty Pharmacy once the courtesy fills are used; boolean
  outside_courtesy_fills: fills of a specialty drug at an outside pharmacy covered per drug per plan year before exclusivity applies (0 where exclusivity does not apply)
  outside_pharmacy_coinsurance_add: coinsurance added to the plan's specialty cost share when a specialty drug is filled at an outside specialty pharmacy, as a fraction of the allowed amount
  max_days_supply_specialty: maximum days supply per specialty fill
  ninety_day_drugs: specialty drugs for which a stable member may receive up to max_days_supply_specialty when it exceeds 30
  split_fill_program: first fills of split-fill drugs are dispensed as partial supplies to limit waste if the drug is stopped; boolean
  split_fill_drugs: drugs in the split-fill program
  split_fill_months: number of initial months dispensed as split fills
  split_fill_days_supply: days supply of each partial split fill (0 where no split-fill program)
  split_fill_cost_share_prorated: the member pays a prorated share of the 30-day cost share on each partial fill (days supply / 30); boolean
  copay_assistance_program: 'how manufacturer copay assistance is coordinated: standard_coordination, variable_copay (the plan guarantees a reduced floor once assistance runs out) or maximizer (assistance is drawn evenly across the year and the enrolled member pays maximizer_member_cost_share); enum'
  variable_copay_floor: member cost share per 30-day fill once the member's manufacturer assistance is exhausted, under variable_copay, USD (0.00 where not used)
  maximizer_member_cost_share: member cost share per fill for a member enrolled in the maximizer program, USD
  maximizer_non_enrollee_coinsurance: coinsurance of the allowed amount charged per fill to a member who has not enrolled in the maximizer program by the deadline (0.00 where no maximizer)
  maximizer_enrollment_deadline_days: calendar days after activation (activation date as day zero) within which a member must enroll in the maximizer before the non-enrollee coinsurance applies (0 where no maximizer)
  assistance_enrollment_by_pharmacy: Northbridge Specialty Pharmacy enrolls the member in the manufacturer copay program on their behalf; boolean
  assistance_consent_required: the member's own consent is required before enrollment in a manufacturer copay program; boolean
  assistance_consent_valid_months: months a copay program consent remains valid before it must be renewed
  assistance_reenroll_lead_days: calendar days before the program year renews in which re-enrollment outreach starts
  foundation_referral: members without a manufacturer program are referred to independent charitable foundations; boolean
  referral_expiration_days: calendar days after the referral date (referral date as day zero) after which a referral that never activated is discharged
  benefits_verification_business_days: business days to complete benefits verification after the referral
  onboarding_call_business_days: business days after activation within which the onboarding call is made
  refill_reminder_days_before: days before the current supply runs out that the refill reminder call is made
  delivery_scheduling_lead_business_days: business days before delivery by which a refill must be scheduled
  delivery_signature_required: an adult signature is required on specialty deliveries; boolean
  delivery_to_prescriber_office: deliveries may be sent to the prescriber's office for in-office administration; boolean
  missed_delivery_report_days: calendar days after the scheduled delivery date (that date as day zero) within which a missed, damaged or temperature-compromised delivery must be reported for a free reshipment
  reships_per_plan_year: free reshipments per enrollment per plan year for missed or damaged deliveries (temperature excursions caused by the carrier never count)
  specialty_credit_limit: balance due above which further shipments wait for payment, USD
  specialty_payment_due_days: calendar days after shipment within which the member's cost share is due
  clinical_assessment_interval_days: maximum calendar days between clinical assessments by a specialty pharmacist
  adherence_outreach: members whose proportion of days covered falls below the threshold receive pharmacist outreach; boolean
  adherence_pdc_threshold: proportion of days covered over the last 180 days below which adherence outreach is made
  injection_training_visits: nurse visits for injection training provided at the start of an injectable therapy
  sharps_container_free: a sharps container is shipped free with injectable therapies; boolean
  hold_max_days: calendar days an enrollment may stay on hold (hold start date as day zero) before it is discharged
  biosimilar_switch_waiver_months: months of zero member cost share for a member who switches from a reference biologic to the preferred biosimilar (0 = no incentive)
  biosimilar_pairs: mapping of reference biologic -> preferred biosimilar for the switch incentive
  transfer_out_processing_business_days: business days to transfer an active specialty prescription to another pharmacy at the member's request
  transfer_out_destination: 'pharmacies a specialty prescription may be transferred to while still covered: any_pharmacy, or network_specialty_only; enum'
  care_team_access_24x7: a specialty pharmacist or nurse is reachable around the clock; boolean
  new_start_pharmacist_consult: a pharmacist consultation is completed before the first shipment of a new therapy; boolean
  hospitalization_hold_allowed: an enrollment may be held at the member's or prescriber's request while the member is hospitalized or therapy is paused; boolean
  discharge_letter_business_days: business days after discharge within which the member and prescriber are notified
  cost_share_rounding: rounding applied to every specialty member cost share and assistance amount; enum

