        In the standard reckoning, the member carries no credit, and earlier fills are reckoned over the enrollment's whole history.
      params: []
    inputs:
      history:
        - {table: specialty_ledger, aggregate: sum, field: amount, filters: {event_type: specialty_assistance_applied}}
        - {table: specialty_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: specialty_payment_posted, payment_source: member}}
        - {table: specialty_fills, aggregate: sum, field: cost_share_amount, within_months: 12, filters: {event_type: specialty_fill_shipped}}
      cross_category: [plan]

  - id: specialty_ext_maximizer_draw
    base_policy_refs: [specialty_cost_share_assistance, specialty_evt_assistance, specialty_maximizer]
    overwrite:
      - base_policy: specialty_cost_share_assistance
        superseded_clause: >-
          Under maximizer, an enrolled member pays maximizer_member_cost_share and assistance pays the rest of the cost share up to the assistance balance
        replaced_by: >-
          The maximizer program draw on the latest shipped fill is set by the draw mode that applies to the member, rounded to the nearest cent at the end.
      - base_policy: specialty_maximizer
        superseded_clause: >-
          is charged maximizer_member_cost_share from their next fill
        replaced_by: >-
          A member enrolled in the maximizer is charged the maximizer member cost share on the part of a fill's cost share that the even draw covers, and the part of the fill's cost share above the even draw stays owed by the member.
      - base_policy: specialty_maximizer
        superseded_clause: >-
          and maximizer_member_cost_share afterwards
        replaced_by: >-
          A member enrolled in the maximizer is charged the maximizer member cost share on the part of a fill's cost share that the even draw covers, and the part of the fill's cost share above the even draw stays owed by the member.
      - base_policy: specialty_evt_assistance
        superseded_clause: >-
          never above the fill's cost share or the assistance balance
        replaced_by: >-
          The draw is never above the fill's unpaid remainder, and the benefit it draws on is the benefit available worked out as set out here rather than the assistance balance shown on the enrollment.
    trigger: state_due
    subject: [specialty_assistance_applied]
    computes: amount
    target_tool: apply_maximizer_draw_3be5be4a
    params: {}
    rule: >-
      This rule sets the maximizer program draw, the payment a manufacturer program makes under a maximizer program on the latest shipped fill of a specialty enrollment; enrollments whose program coordinates assistance by standard coordination or variable copay are outside it, and so is a member whose plan backs assisted amounts out of the accumulators.
      A maximizer program year runs from January 1 to December 31 of the program year named on its benefit load.
      The maximizer program draw on the latest shipped fill is set by the draw mode that applies to the member, rounded to the nearest cent at the end.
      A member enrolled in the maximizer is charged the maximizer member cost share on the part of a fill's cost share that the even draw covers, and the part of the fill's cost share above the even draw stays owed by the member.
      The draw is never above the fill's unpaid remainder, and the benefit it draws on is the benefit available worked out as set out here rather than the assistance balance shown on the enrollment.
      The fill's unpaid remainder is its cost share less the payments already posted on it.
      The even draw is the benefit available divided by the number of fills left, where the fills left are the fill being paid plus the whole fill periods that fit in the draw horizon counted in days from today.
      In the standard reckoning, the program pays the lesser of the fill's unpaid remainder and the whole benefit available, without spreading it.
      In the standard reckoning, the benefit available is the assistance balance shown on the enrollment, with nothing taken off for program use at retail pharmacies.
      In the standard reckoning, program draws taken off a benefit load are those of the last 12 months.
      In the standard reckoning, the draw horizon runs from today to the last day of the program year of the latest load.
      In the standard reckoning, a fill period is 30 days.
      When the member is enrolled in the maximizer, the draw is the lesser of the fill's unpaid remainder less the maximizer member cost share and the even draw; when the member is not enrolled and no more than the maximizer enrollment deadline has passed since activation, no draw is made yet, the member's choice still being open; otherwise the draw is the lesser of the fill's unpaid remainder and the whole benefit available.
      When the latest shipped fill shipped within the program year of the latest maximizer benefit load, the benefit available before retail use is that load less the program draws taken off it; when the fill shipped after that program year ended, the benefit available before retail use is zero, the new program year's benefit not having been loaded; otherwise it is the assistance balance shown on the enrollment.
      When today falls within the latest load's program year, the program draws taken off the load are those dated fewer whole months before today than the first day of that program year; when the latest load's program year ended no more than 365 days before today, they are the draws dated no more whole months before today than the load itself; otherwise they are the draws of the last 12 months.
      Program use at a retail pharmacy is the member's payment recorded on a paid retail claim for the same drug, which the network pharmacy bills to the manufacturer program as secondary payer after Northbridge Rx; when a load is on the ledger and paid retail claims for the drug are dated fewer whole months before today than the first day of the load's program year, that program use is taken off the benefit available; when no load is on the ledger and paid retail claims for the drug fall in the last 12 months, that program use is taken off the assistance balance shown on the enrollment; otherwise nothing is taken off.
      When a coverage review approval for the drug is in force today and expires before the last day of the program year, the draw horizon runs from today to the approval's expiration date; when no approval for the drug is in force today but one is on record, the draw horizon is zero days, only the fill being paid counting; otherwise the draw horizon runs from today to the last day of the program year.
      The fill period is the latest fill's days supply when that fill was for more than 30 days; when the drug is on the program's list of drugs filled for up to 90 days and the latest fill was for 30 days or fewer, the fill period is 90 days; otherwise it is 30 days.
      The benefit available, once retail program use is taken off, is never below zero; the even draw is figured from that amount before any rounding, and the payment is rounded to the nearest cent only once, on the final figure.
      The draw is recorded against the program name and program year of the latest load, and it pays the fill's deductible portion first, the part that covers it being recorded as its deductible portion.
    prerequisite: []
    cross_category:
      - category: review
        as: branch
        reads: [review_authorizations.effective_date, review_authorizations.expiration_date]
        note: the draw-horizon factor reads whether an approval for the drug is in force and when it expires.
      - category: retail
        as: history
        reads: [retail_claims.member_paid_amount]
        note: the retail program-use factor reads the member's paid retail claims for the same drug.
    compute:
      - fid: "LATEST('specialty_fills', 'specialty_fill_id', date_field='ship_date', event_type='specialty_fill_shipped')"
      - cs: "LATEST('specialty_fills', 'cost_share_amount', date_field='ship_date', event_type='specialty_fill_shipped')"
      - ds: "LATEST('specialty_fills', 'days_supply', date_field='ship_date', event_type='specialty_fill_shipped')"
      - mx_ship: "LATEST('specialty_fills', 'ship_date', date_field='ship_date', event_type='specialty_fill_shipped')"
      - paid_on_fill: "SUM('specialty_ledger', 'amount', event_type='specialty_payment_posted', specialty_fill_id=fid)"
      - unpaid_fill: "cs - paid_on_fill"
      - mx_load_date: "LATEST('specialty_ledger', 'entry_date', date_field='entry_date', event_type='specialty_assistance_loaded')"
      - mx_load_amt: "LATEST('specialty_ledger', 'amount', date_field='entry_date', event_type='specialty_assistance_loaded')"
      - mx_load_year: "LATEST('specialty_ledger', 'program_year', date_field='entry_date', event_type='specialty_assistance_loaded')"
      - mpy_start: "(mx_load_year + '-01-01') if mx_load_year else NOW"
      - mpy_end: "(mx_load_year + '-12-31') if mx_load_year else NOW"
      - draw_window: "MONTHS(mpy_start, NOW) if (mx_load_year and NOW >= mpy_start and NOW <= mpy_end) else ((MONTHS(mx_load_date, NOW) + 1) if (mx_load_year and NOW > mpy_end and DAYS(mpy_end, NOW) <= 365) else 12)"
      - draws_taken: "SUM('specialty_ledger', 'amount', within_months=draw_window, date_field='entry_date', event_type='specialty_assistance_applied')"
      - benefit_available: "(mx_load_amt - draws_taken) if (mx_load_year and mx_ship >= mpy_start and mx_ship <= mpy_end) else (0 if (mx_load_year and mx_ship > mpy_end) else F('assistance_balance'))"
      - mrm_py: "XSUM('retail', 'retail_claims', 'member_paid_amount', within_months=MONTHS(mpy_start, NOW), date_field='date_of_service', drug_name=F('therapy_drug'), event_type='retail_claim_paid')"
      - mrn_py: "XCOUNT('retail', 'retail_claims', within_months=MONTHS(mpy_start, NOW), date_field='date_of_service', drug_name=F('therapy_drug'), event_type='retail_claim_paid')"
      - mrm_year: "XSUM('retail', 'retail_claims', 'member_paid_amount', within_months=12, date_field='date_of_service', drug_name=F('therapy_drug'), event_type='retail_claim_paid')"
      - mrn_year: "XCOUNT('retail', 'retail_claims', within_months=12, date_field='date_of_service', drug_name=F('therapy_drug'), event_type='retail_claim_paid')"
      - retail_program_use: "mrm_py if (mx_load_year and mrn_py > 0) else (mrm_year if (not mx_load_year and mrn_year > 0) else 0)"
      - available_net: "MX(benefit_available - retail_program_use, 0)"
      - auth_exp: "XLATEST('review', 'review_authorizations', 'expiration_date', date_field='effective_date', drug_name=F('therapy_drug'), event_type='review_auth_granted')"
      - auth_eff: "XLATEST('review', 'review_authorizations', 'effective_date', date_field='effective_date', drug_name=F('therapy_drug'), event_type='review_auth_granted')"
      - horizon_days: "DAYS(NOW, auth_exp) if (auth_exp and DAYS(auth_eff, NOW) >= 0 and DAYS(NOW, auth_exp) >= 0 and DAYS(auth_exp, mpy_end) > 0) else (0 if (auth_exp and (DAYS(NOW, auth_exp) < 0 or DAYS(auth_eff, NOW) < 0)) else DAYS(NOW, mpy_end))"
      - fill_period: "ds if ds > 30 else (90 if (F('therapy_drug') in P('ninety_day_drugs') and ds <= 30) else 30)"
      - fills_left: "1 + int(MX(horizon_days, 0) / fill_period)"
      - even_draw: "available_net / fills_left"
      - draw_mode: "MN(unpaid_fill - P('maximizer_member_cost_share'), even_draw) if F('maximizer_enrolled') == True else (0 if DAYS(F('enrolled_date'), NOW) <= P('maximizer_enrollment_deadline_days') else MN(unpaid_fill, available_net))"
      - result: "RND(MX(draw_mode, 0), 2)"
    compute_basis:
      fid: "the latest shipped fill"
      cs: "The fill's unpaid remainder is its cost share less the payments already posted on it."
      ds: "The fill period is the latest fill's days supply when that fill was for more than 30 days"
      mx_ship: "When the latest shipped fill shipped within the program year of the latest maximizer benefit load"
      paid_on_fill: "The fill's unpaid remainder is its cost share less the payments already posted on it."
      unpaid_fill: "The fill's unpaid remainder is its cost share less the payments already posted on it."
      mx_load_date: "they are the draws dated no more whole months before today than the load itself"
      mx_load_amt: "the benefit available before retail use is that load less the program draws taken off it"
      mx_load_year: "A maximizer program year runs from January 1 to December 31 of the program year named on its benefit load."
      mpy_start: "A maximizer program year runs from January 1 to December 31 of the program year named on its benefit load."
      mpy_end: "A maximizer program year runs from January 1 to December 31 of the program year named on its benefit load."
      draw_window: "When today falls within the latest load's program year, the program draws taken off the load are those dated fewer whole months before today than the first day of that program year; when the latest load's program year ended no more than 365 days before today, they are the draws dated no more whole months before today than the load itself; otherwise they are the draws of the last 12 months."
      draws_taken: "the program draws taken off the load"
      benefit_available: "When the latest shipped fill shipped within the program year of the latest maximizer benefit load, the benefit available before retail use is that load less the program draws taken off it; when the fill shipped after that program year ended, the benefit available before retail use is zero, the new program year's benefit not having been loaded; otherwise it is the assistance balance shown on the enrollment."
      mrm_py: "Program use at a retail pharmacy is the member's payment recorded on a paid retail claim for the same drug, which the network pharmacy bills to the manufacturer program as secondary payer after Northbridge Rx"
      mrn_py: "paid retail claims for the drug are dated fewer whole months before today than the first day of the load's program year"
      mrm_year: "paid retail claims for the drug fall in the last 12 months"
      mrn_year: "paid retail claims for the drug fall in the last 12 months"
      retail_program_use: "when a load is on the ledger and paid retail claims for the drug are dated fewer whole months before today than the first day of the load's program year, that program use is taken off the benefit available; when no load is on the ledger and paid retail claims for the drug fall in the last 12 months, that program use is taken off the assistance balance shown on the enrollment; otherwise nothing is taken off."
      available_net: "The benefit available, once retail program use is taken off, is never below zero"
      auth_exp: "expires before the last day of the program year"
      auth_eff: "When a coverage review approval for the drug is in force today"
      horizon_days: "When a coverage review approval for the drug is in force today and expires before the last day of the program year, the draw horizon runs from today to the approval's expiration date; when no approval for the drug is in force today but one is on record, the draw horizon is zero days, only the fill being paid counting; otherwise the draw horizon runs from today to the last day of the program year."
      fill_period: "The fill period is the latest fill's days supply when that fill was for more than 30 days; when the drug is on the program's list of drugs filled for up to 90 days and the latest fill was for 30 days or fewer, the fill period is 90 days; otherwise it is 30 days."
      fills_left: "the fills left are the fill being paid plus the whole fill periods that fit in the draw horizon counted in days from today"
      even_draw: "The even draw is the benefit available divided by the number of fills left"
      draw_mode: "When the member is enrolled in the maximizer, the draw is the lesser of the fill's unpaid remainder less the maximizer member cost share and the even draw; when the member is not enrolled and no more than the maximizer enrollment deadline has passed since activation, no draw is made yet, the member's choice still being open; otherwise the draw is the lesser of the fill's unpaid remainder and the whole benefit available."
      result: "the payment is rounded to the nearest cent only once, on the final figure"
    factors:
      - id: maximizer_draw_mode
        effect: method
        decides: draw_mode
        bindings: [draw_mode]
        ladder:
          - when: "the member is enrolled in the maximizer"
            method: "the lesser of the unpaid remainder less the maximizer member cost share and the even draw"
          - when: "the member is not enrolled and no more than the enrollment deadline has passed since activation"
            method: "no draw yet (zero)"
          - when: "otherwise"
            method: "the lesser of the unpaid remainder and the whole benefit available, unspread"
        baseline:
          draw_mode: "MN(unpaid_fill, available_net)"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: maximizer_benefit_by_program_year
        effect: method
        decides: benefit_available
        bindings: [mx_ship, mx_load_date, mx_load_amt, mx_load_year, benefit_available]
        ladder:
          - when: "the latest shipped fill shipped within the program year of the latest maximizer benefit load"
            method: "the load less the program draws taken off it"
          - when: "the latest shipped fill shipped after that program year ended"
            method: "zero: the new program year's benefit has not been loaded"
          - when: "otherwise (no load, or a fill shipped before the load's program year)"
            method: "the assistance balance shown on the enrollment"
        baseline:
          benefit_available: "F('assistance_balance')"
        evidence: [history, date]
        cross_difficulty: null
      - id: maximizer_draws_taken_by_program_year
        effect: method
        decides: draw_window
        bindings: [mpy_start, mpy_end, draw_window, draws_taken]
        ladder:
          - when: "today falls within the latest load's program year"
            method: "draws dated fewer whole months before today than the first day of that program year"
          - when: "the latest load's program year ended no more than 365 days before today"
            method: "draws dated no more whole months before today than the load itself"
          - when: "otherwise"
            method: "draws of the last 12 months"
        baseline:
          draw_window: "12"
        evidence: [history, date]
        cross_difficulty: null
      - id: maximizer_retail_program_use
        effect: parameter
        decides: retail_program_use
        bindings: [mrm_py, mrn_py, mrm_year, mrn_year, retail_program_use]
        ladder:
          - when: "a load is on the ledger and paid retail claims for the same drug are dated within its program year window"
            value: "the member's payments recorded on those claims"
          - when: "no load is on the ledger and paid retail claims for the drug fall in the last 12 months"
            value: "the program use on those claims, taken off the assistance balance shown"
          - when: "otherwise"
            value: "zero"
        baseline:
          retail_program_use: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: retail
      - id: maximizer_draw_horizon
        effect: method
        decides: horizon_days
        bindings: [auth_exp, auth_eff, horizon_days]
        ladder:
          - when: "a coverage review approval for the drug is in force today and expires before the last day of the program year"
            method: "days from today to the approval's expiration date"
          - when: "no approval for the drug is in force today but one is on record"
            method: "zero days (only the fill being paid counts)"
          - when: "otherwise"
            method: "days from today to the last day of the program year"
        baseline:
          horizon_days: "DAYS(NOW, mpy_end)"
        evidence: [cross_category, date]
        cross_difficulty: review
      - id: maximizer_fill_period
        effect: parameter
        decides: fill_period
        bindings: [ds, fill_period]
        ladder:
          - when: "the latest fill was for more than 30 days"
            value: "that fill's days supply"
          - when: "the drug is on the program's 90-day list and the latest fill was for 30 days or fewer"
            value: "90"
          - when: "otherwise"
            value: "30"
        baseline:
          fill_period: "30"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The maximizer program draw on the latest shipped fill is set by the draw mode that applies to the member, rounded to the nearest cent at the end.
        The fill's unpaid remainder is its cost share less the payments already posted on it.
        In the standard reckoning, the program pays the lesser of the fill's unpaid remainder and the whole benefit available, without spreading it.
        In the standard reckoning, the benefit available is the assistance balance shown on the enrollment, with nothing taken off for program use at retail pharmacies.
        In the standard reckoning, program draws taken off a benefit load are those of the last 12 months.
        In the standard reckoning, the draw horizon runs from today to the last day of the program year of the latest load.
        In the standard reckoning, a fill period is 30 days.
      params: []
    inputs:
      history:
        - {table: specialty_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: specialty_assistance_applied}}
        - {table: specialty_ledger, aggregate: latest, field: amount, filters: {event_type: specialty_assistance_loaded}}
        - {table: specialty_fills, aggregate: latest, field: cost_share_amount, filters: {event_type: specialty_fill_shipped}}
        - {category: retail, table: retail_claims, aggregate: sum, field: member_paid_amount, within_months: 12, filters: {event_type: retail_claim_paid}}
        - {category: review, table: review_authorizations, aggregate: latest, field: expiration_date, filters: {event_type: review_auth_granted}}
