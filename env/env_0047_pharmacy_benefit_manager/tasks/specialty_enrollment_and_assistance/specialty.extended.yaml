  - id: specialty_ext_member_fill_payment
    base_policy_refs: [specialty_agg_therapy_coordination, specialty_evt_payment, specialty_cost_share_assistance]
    overwrite:
      - base_policy: specialty_cost_share_assistance
        superseded_clause: >-
          once the assistance balance is exhausted the member's cost share per 30-day fill becomes variable_copay_floor when that is lower than the plan's cost share.
        replaced_by: >-
          The member's guaranteed share applies under a variable copay program when the copay card has paid part but not all of the fill's cost share and the variable copay floor is lower than that cost share
    trigger: on_request
    subject: [specialty_payment_posted]
    computes: amount
    target_tool: pay_fill_balance_998729ec
    params: {}
    rule: >-
      This rule sets the member payment that a member makes with their own card on the latest shipped fill of a specialty enrollment whose program coordinates manufacturer assistance by standard coordination or by variable copay and which is not on hold for an overdue payment; earlier fills are settled first under the oldest-first rule, so it covers a payment on the latest shipped fill once no earlier fill of the enrollment is left unpaid.
      The member payment on the latest shipped fill is figured only after the fill carries the copay card payment owed on it.
      The member payment on the latest shipped fill is the fill's unpaid remainder, capped by the member's guaranteed share where one applies, less the member's credit, never below zero and rounded to the nearest cent at the end.
      In the standard reckoning, the fill's unpaid remainder is the balance due shown on the enrollment.
      In the standard reckoning, no guaranteed share applies, so the cap is the unpaid remainder itself.
      In the standard reckoning, the member carries no credit, and earlier fills are reckoned over the enrollment's whole history.
      When the fill's ledger shows card or member payments on it, the fill's unpaid remainder is its total cost share less those payments; when the fill shows no payments and was dispensed by an outside specialty pharmacy or a retail pharmacy, its unpaid remainder is zero, that cost share being settled at the dispensing pharmacy; otherwise the fill's unpaid remainder is the balance due shown on the enrollment.
      The member's guaranteed share applies under a variable copay program when the copay card has paid part but not all of the fill's cost share and the variable copay floor is lower than that cost share; for a partial (split) fill it is the variable copay floor times the fill's days supply divided by 30, for a full fill it is the variable copay floor; otherwise no guaranteed share applies.
      Where a guaranteed share applies, the cap is that share; otherwise the cap is the unpaid remainder.
      The member's credit is the amount by which the member's own payments on earlier fills exceed what those fills left the member to pay after card payments, counting only fills shipped, and payments dated, inside the credit window; when there is no such excess but the balance due shown on the enrollment is below zero, the credit is that amount below zero; otherwise the member carries no credit.
      When the member's plan year began six or fewer whole months before today, the credit window is the last 12 months, so credits from the plan year just ended still count; when it began more than six whole months before today, the credit window runs from no more whole months before today than the plan year's first day; when no plan year is on record, the credit window covers every earlier fill.
      The lesser of the unpaid remainder and the cap is taken first, the credit is then taken off that figure, the result is never below zero, and the payment is rounded to the nearest cent only once, on the final figure.
