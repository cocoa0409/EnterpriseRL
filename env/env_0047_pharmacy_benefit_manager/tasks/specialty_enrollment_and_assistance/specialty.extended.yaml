events:
  - type: specialty_refer
    target: specialty_enrollments
    mutation: create
    meaning: A prescriber referral for one specialty therapy is received and an enrollment is opened.
    grain: one row per therapy referral
    fields:
      customer_id: member
      variant_name: specialty program the sponsor elected
      therapy_drug: drug referred
      therapy_condition: condition treated
      prescriber_npi: referring prescriber
      referral_date: date received
      hold_reason: none
      maximizer_enrolled: false at referral
      assistance_balance: 0.00 at referral
      balance_due: 0.00 at referral
    triggers: []
  - type: specialty_start_verification
    target: specialty_enrollments
    mutation: {transition: {from: referred, to: benefits_verification}}
    meaning: Benefits verification starts for the referral.
    grain: one row per transaction
    fields:
      referral_date: unchanged referral date, restated
    triggers: []
  - type: specialty_activate
    target: specialty_enrollments
    mutation: {transition: {from: benefits_verification, to: active}}
    meaning: The enrollment becomes active and the first delivery can be scheduled.
    grain: one row per transaction
    fields:
      enrolled_date: activation date
    triggers: []
  - type: specialty_hold
    target: specialty_enrollments
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Shipments for the therapy are paused.
    grain: one row per transaction
    fields:
      hold_reason: cause of the hold
      hold_start_date: first day of the hold
    triggers: []
  - type: specialty_resume
    target: specialty_enrollments
    mutation: {transition: {from: on_hold, to: active}}
    meaning: The hold is cleared and shipments resume.
    grain: one row per transaction
    fields:
      hold_reason: none
      hold_start_date: cleared
    triggers: []
  - type: specialty_decline
    target: specialty_enrollments
    mutation: {transition: {from: referred, to: discharged}}
    meaning: The member declines the specialty program before verification.
    grain: one row per transaction
    fields:
      discharge_date: date declined
    triggers: []
  - type: specialty_verification_close
    target: specialty_enrollments
    mutation: {transition: {from: benefits_verification, to: discharged}}
    meaning: Verification ends without activation (coverage not confirmed or referral expired).
    grain: one row per transaction
    fields:
      discharge_date: date closed
    triggers: []
  - type: specialty_disenroll
    target: specialty_enrollments
    mutation: {transition: {from: active, to: discharged}}
    meaning: The member confirms disenrollment or transfer of the prescription out of Northbridge Specialty Pharmacy.
    grain: one row per transaction
    fields:
      discharge_date: date discharged
    triggers: []
  - type: specialty_hold_discharge
    target: specialty_enrollments
    mutation: {transition: {from: on_hold, to: discharged}}
    meaning: A held enrollment is discharged because the hold ran past its maximum or the therapy was stopped.
    grain: one row per transaction
    fields:
      discharge_date: date discharged
    triggers: []
  - type: specialty_program_update
    target: specialty_enrollments
    mutation: update
    meaning: The member's maximizer enrollment or copay program consent is recorded on the enrollment.
    grain: one row per transaction
    fields:
      maximizer_enrolled: maximizer enrollment
      maximizer_enrolled_date: date of maximizer enrollment
      assistance_consent_date: date of copay program consent
    triggers: []
  - type: specialty_fill_scheduled
    target: specialty_fills
    meaning: A specialty fill is scheduled with the member for a delivery date and location.
    grain: one row per scheduled fill
    distinguish_by: [fill_number, scheduled_delivery_date]
    fields:
      fill_number: fill sequence
      dispensing_pharmacy: northbridge_specialty_pharmacy
      drug_name: drug
      drug_strength: strength
      days_supply: days supply to dispense
      split_fill: whether it is a partial fill
      scheduled_delivery_date: delivery date
      delivery_location: delivery location
    triggers: []
  - type: specialty_fill_shipped
    target: specialty_fills
    meaning: A specialty fill is dispensed and shipped (or, for an outside pharmacy, its claim is paid), and the member's cost share is booked.
    grain: one row per fill dispensed
    distinguish_by: [source_fill_id, fill_number, dispensing_pharmacy, ship_date]
    fields:
      source_fill_id: the scheduled fill shipped (empty for an outside-pharmacy fill)
      fill_number: fill sequence
      dispensing_pharmacy: who dispensed
      drug_name: drug
      drug_strength: strength
      quantity: quantity
      days_supply: days supply
      split_fill: partial fill
      ship_date: date shipped or dispensed
      formulary_tier: tier adjudicated
      allowed_amount: allowed cost
      deductible_amount: deductible portion
      copay_amount: cost share after deductible
      cost_share_amount: total cost share
      accumulator_amount: out-of-pocket portion
      plan_paid_amount: plan payment
    account: specialty_balance
    direction: in
    triggers:
      - event: plan:plan_ded_post
        when: {deductible_amount: {not: 0}}
        map: {amount: deductible_amount, accrual_date: ship_date, source_type: pharmacy_claim, source_reference_id: specialty_fill_id, channel: specialty, funding_source: member_paid, formulary_tier: formulary_tier, claim_allowed_amount: allowed_amount}
      - event: plan:plan_oop_post
        when: {accumulator_amount: {not: 0}}
        map: {amount: accumulator_amount, accrual_date: ship_date, source_type: pharmacy_claim, source_reference_id: specialty_fill_id, channel: specialty, funding_source: member_paid, formulary_tier: formulary_tier, claim_allowed_amount: allowed_amount}
  - type: specialty_fill_reshipped
    target: specialty_fills
    meaning: A replacement of a shipped fill is sent at no charge after a missed, damaged or temperature-compromised delivery.
    grain: one row per reshipment of one shipped fill
    distinguish_by: [source_fill_id, reship_reason]
    fields:
      source_fill_id: the shipped fill replaced
      fill_number: fill sequence of the original
      drug_name: drug
      quantity: quantity reshipped
      days_supply: days supply reshipped
      ship_date: reshipment date
      scheduled_delivery_date: new delivery date
      reship_reason: why it was reshipped
    triggers: []
  - type: specialty_assistance_loaded
    target: specialty_ledger
    meaning: The member's manufacturer copay program benefit for the program year is activated on the enrollment.
    grain: one row per program per program year
    distinguish_by: [program_name, program_year]
    fields:
      entry_date: activation date
      amount: remaining annual program benefit available to this member
      program_name: manufacturer program
      program_year: program year
    account: copay_assistance
    direction: in
    triggers: []
  - type: specialty_assistance_applied
    target: specialty_ledger
    meaning: Manufacturer copay assistance pays part or all of the member's cost share on one shipped fill.
    grain: one row per fill paid by assistance
    distinguish_by: [specialty_fill_id, program_name]
    fields:
      specialty_fill_id: the shipped fill paid
      entry_date: date applied
      amount: assistance applied
      program_name: program paying
      program_year: program year
      deductible_portion: part that paid the deductible portion
      accumulator_adjusted: whether the plan backs the assisted amount out of the accumulators
    account: copay_assistance
    direction: out
    triggers:
      - event: specialty:specialty_payment_posted
        map: {specialty_fill_id: specialty_fill_id, entry_date: entry_date, amount: amount, payment_source: manufacturer_assistance, payment_method: copay_card, program_name: program_name}
      - event: plan:plan_oop_reverse
        when: {accumulator_adjusted: true}
        map: {amount: amount, accrual_date: entry_date, source_type: pharmacy_claim, source_reference_id: specialty_fill_id, channel: specialty, funding_source: manufacturer_assistance}
      - event: plan:plan_ded_reverse
        when: {accumulator_adjusted: true, deductible_portion: {not: 0}}
        map: {amount: deductible_portion, accrual_date: entry_date, source_type: pharmacy_claim, source_reference_id: specialty_fill_id, channel: specialty, funding_source: manufacturer_assistance}
  - type: specialty_payment_posted
    target: specialty_ledger
    meaning: A payment toward the member's specialty balance posts (member, manufacturer assistance or foundation grant).
    grain: one row per payment
    distinguish_by: [specialty_fill_id, payment_source, entry_date, amount]
    fields:
      specialty_fill_id: the fill paid
      entry_date: posting date
      amount: amount paid
      payment_source: who paid
      payment_method: instrument
      program_name: program or foundation for assisted payments
    account: specialty_balance
    direction: out
    triggers: []
  - type: specialty_care_contact
    target: specialty_care_contacts
    meaning: A specialty pharmacist or nurse contact with the member is recorded.
    grain: one row per contact attempt
    distinguish_by: [contact_type, contact_date]
    fields:
      contact_type: kind of contact
      contact_date: date
      outcome: result
      pdc_score: adherence measured
    triggers: []

measures:
  - id: specialty_msr_outside_fills_ytd
    window: current plan year of the member's plan enrollment, from plan_year_start_date through frozen_time, inclusive
    measure: count of specialty_fill_shipped rows for the same drug_name whose dispensing_pharmacy is outside_specialty_pharmacy or retail_pharmacy
  - id: specialty_msr_reships_ytd
    window: current plan year of the member's plan enrollment, from plan_year_start_date through frozen_time, inclusive
    measure: count of specialty_fill_reshipped rows on this enrollment whose reship_reason is missed_delivery or damaged
  - id: specialty_msr_split_fills
    window: from enrolled_date through frozen_time
    measure: count of specialty_fill_shipped rows on this enrollment with split_fill true
  - id: specialty_msr_days_since_assessment
    window: from the contact_date of the latest completed clinical_assessment contact on this enrollment through frozen_time
    measure: calendar days elapsed (from enrolled_date when no assessment has been completed)

policies:
  - id: specialty_agg_multi_holding
    subject: [specialty_refer]
    rule: >-
      A member may hold several specialty enrollments, one per specialty drug; there is no cap on the number of therapies.
      A new referral for a drug may be opened only when the member has no enrollment for the same drug that is referred, benefits_verification, active or on_hold.
    eligibility:
      - id: one_open_per_drug
        applies_to: [specialty_refer]
        kind: dedup
        condition: A new referral for a drug may be opened only when the member has no enrollment for the same drug that is referred, benefits_verification, active or on_hold.
        evidence_fields: [specialty_enrollments.customer_id, specialty_enrollments.therapy_drug, specialty_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.customer_id, specialty_enrollments.therapy_drug]
          action_bindings:
            specialty_enrollments.customer_id: customer_id
            specialty_enrollments.therapy_drug: therapy_drug
        dedup_contract:
          table: specialty_enrollments
          mode: separate_record
          object_bindings: {customer_id: customer_id, therapy_drug: therapy_drug}
          duplicate_filters: {status: [referred, benefits_verification, active, on_hold]}
          distinct_fields: [referral_date]
    params:
      max_per_customer: null

  - id: specialty_agg_therapy_coordination
    subject: [specialty_fill_scheduled, specialty_fill_shipped, specialty_payment_posted]
    rule: >-
      Each of a member's specialty enrollments keeps its own fills, assistance and balance; assistance from one drug's manufacturer program never pays another drug's fill.
      The member's specialty_credit_limit applies to the sum of balance_due across all of the member's open specialty enrollments, so a balance on one therapy can hold shipments of another.
      Deliveries for several therapies due within the same delivery_scheduling_lead_business_days window are combined into one shipment on the earliest needed date, with each fill still booked to its own enrollment.
      Cost share from every enrollment counts toward the member's single plan deductible and out-of-pocket.
    eligibility: []
    formula:
      combined_over_limit: "balance_due > specialty_credit_limit"

  - id: specialty_exclusivity
    subject: [specialty_fill_shipped]
    rule: >-
      Drugs in specialty_drugs are managed by the specialty program on every program tier.
      When exclusive_specialty_pharmacy is true, a specialty drug dispensed by an outside specialty or retail pharmacy is covered for at most outside_courtesy_fills fills per drug per plan year (specialty_msr_outside_fills_ytd); later outside fills are not covered and the member pays the pharmacy in full.
      When exclusive_specialty_pharmacy is false any network specialty pharmacy may dispense, and an outside specialty pharmacy fill adds outside_pharmacy_coinsurance_add of the allowed amount to the member's cost share.
      Courtesy fills do not need an enrollment; a member who wants Northbridge Specialty Pharmacy to dispense needs an active enrollment.
    eligibility: []
    params:
      per_tier:
        Northbridge Specialty Open Access: {exclusive: "=exclusive_specialty_pharmacy", courtesy: "=outside_courtesy_fills", outside_add: "=outside_pharmacy_coinsurance_add"}
        Northbridge Specialty Preferred: {exclusive: "=exclusive_specialty_pharmacy", courtesy: "=outside_courtesy_fills", outside_add: "=outside_pharmacy_coinsurance_add"}
        Northbridge Specialty Exclusive: {exclusive: "=exclusive_specialty_pharmacy", courtesy: "=outside_courtesy_fills", outside_add: "=outside_pharmacy_coinsurance_add"}
        Northbridge Specialty Exclusive with Copay Assist: {exclusive: "=exclusive_specialty_pharmacy", courtesy: "=outside_courtesy_fills", outside_add: "=outside_pharmacy_coinsurance_add"}
        Northbridge Specialty Care Management: {exclusive: "=exclusive_specialty_pharmacy", courtesy: "=outside_courtesy_fills", outside_add: "=outside_pharmacy_coinsurance_add"}
        Northbridge Specialty Total Care: {exclusive: "=exclusive_specialty_pharmacy", courtesy: "=outside_courtesy_fills", outside_add: "=outside_pharmacy_coinsurance_add"}
    measures: [specialty_msr_outside_fills_ytd]

  - id: specialty_referral_intake
    subject: [specialty_refer, specialty_start_verification, specialty_decline, specialty_verification_close]
    rule: >-
      A referral comes from the prescriber (electronic prescription, fax or a transfer from another pharmacy) and names one drug and condition; a member cannot self-refer.
      Benefits verification starts within benefits_verification_business_days and confirms the member's plan coverage, the drug's formulary status and any coverage review the drug needs.
      A referral that has not activated by the end of referral_expiration_days calendar days after the referral date, the referral date being day zero, is discharged; the prescriber must refer again.
      The member may decline the program while the enrollment is still referred, which discharges it; declining is the member's own decision.
      A referral may be closed for expiry only after referral_expiration_days calendar days have fully elapsed since the referral date.
    eligibility:
      - id: expiry_elapsed
        applies_to: [specialty_verification_close]
        kind: time
        condition: A referral may be closed for expiry only after referral_expiration_days calendar days have fully elapsed since the referral date.
        evidence_fields: [specialty_enrollments.referral_date, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.specialty_enrollment_id]
          action_bindings:
            specialty_enrollments.specialty_enrollment_id: specialty_enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the referral date
          anchor_source: specialty_enrollments.referral_date
          relation: not_before
          duration_source: variants.referral_expiration_days
          unit: calendar_days
          counting_rule: the referral date being day zero
          boundary: exclusive

  - id: specialty_activation
    subject: [specialty_activate]
    rule: >-
      An enrollment is activated only when all of the following hold on the activation date: the member's plan enrollment is active or cobra_continuation; the drug is covered on the member's formulary or an exception approval for it is in force; when the member's utilization management program requires a coverage review for the drug, an approval for that drug is in force; and the member has agreed to enroll.
      When new_start_pharmacist_consult is true the pharmacist consultation is completed before the first shipment, and injectable therapies get injection_training_visits nurse visits.
      An enrollment can be activated only when a coverage review approval for the drug is in force whenever the member's program requires one.
      The onboarding call is made within onboarding_call_business_days business days after activation.
    eligibility:
      - id: review_approval_in_force
        applies_to: [specialty_activate]
        kind: authorization
        condition: An enrollment can be activated only when a coverage review approval for the drug is in force whenever the member's program requires one.
        evidence_fields: [review_authorizations.customer_id, review_authorizations.drug_name, review_authorizations.effective_date, review_authorizations.expiration_date, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.specialty_enrollment_id]
          action_bindings:
            specialty_enrollments.specialty_enrollment_id: specialty_enrollment_id

  - id: specialty_cost_share_assistance
    subject: [specialty_fill_shipped, specialty_assistance_applied]
    rule: >-
      A specialty fill's cost share starts from the plan's cost share for the drug's specialty tier (after any deductible portion, set by the plan's deductible rule), plus any outside-pharmacy addition, for a 30-day supply; a split fill is charged days_supply / 30 of it when split_fill_cost_share_prorated is true.
      Under standard_coordination, the member's manufacturer assistance pays the lesser of the fill's cost share and the assistance balance, and the member pays the rest.
      Under variable_copay, assistance is applied the same way; once the assistance balance is exhausted the member's cost share per 30-day fill becomes variable_copay_floor when that is lower than the plan's cost share.
      Under maximizer, an enrolled member pays maximizer_member_cost_share and assistance pays the rest of the cost share up to the assistance balance; a member not enrolled by the maximizer deadline is charged maximizer_non_enrollee_coinsurance of the allowed amount instead of the plan's cost share, and assistance may still be applied to it.
      Assistance is applied only to a fill dispensed by Northbridge Specialty Pharmacy and only while the member's consent is on file.
      Every amount is rounded per cost_share_rounding; the assistance applied to the deductible portion is recorded as deductible_portion, the deductible being paid before the copay portion.
      When the member's plan runs accumulator_adjustment the application is recorded with accumulator_adjusted true and the assisted amount is backed out of the plan accumulators; otherwise accumulator_adjusted is false.
    eligibility: []
    params:
      per_tier:
        Northbridge Specialty Open Access: {program: "=copay_assistance_program", floor: "=variable_copay_floor", non_enrollee: "=maximizer_non_enrollee_coinsurance"}
        Northbridge Specialty Preferred: {program: "=copay_assistance_program", floor: "=variable_copay_floor", non_enrollee: "=maximizer_non_enrollee_coinsurance"}
        Northbridge Specialty Exclusive: {program: "=copay_assistance_program", floor: "=variable_copay_floor", non_enrollee: "=maximizer_non_enrollee_coinsurance"}
        Northbridge Specialty Exclusive with Copay Assist: {program: "=copay_assistance_program", floor: "=variable_copay_floor", non_enrollee: "=maximizer_non_enrollee_coinsurance"}
        Northbridge Specialty Care Management: {program: "=copay_assistance_program", floor: "=variable_copay_floor", non_enrollee: "=maximizer_non_enrollee_coinsurance"}
        Northbridge Specialty Total Care: {program: "=copay_assistance_program", floor: "=variable_copay_floor", non_enrollee: "=maximizer_non_enrollee_coinsurance"}
    formula:
      assistance_applied: "min(cost_share_amount, assistance_balance)"
      member_pays: "cost_share_amount - min(cost_share_amount, assistance_balance)"
      non_enrollee_cost_share: "allowed_amount * maximizer_non_enrollee_coinsurance"

  - id: specialty_maximizer
    subject: [specialty_program_update]
    rule: >-
      Under the maximizer program the member enrolls by their own decision; enrollment is recorded on the therapy's enrollment with its date.
      A member who enrolls no later than maximizer_enrollment_deadline_days calendar days after the activation date, the activation date being day zero, is charged maximizer_member_cost_share from their next fill; a member who enrolls later is charged the non-enrollee coinsurance on fills shipped before the enrollment date and maximizer_member_cost_share afterwards.
      Copay program consent is recorded only from the member's own agreement and stays valid for assistance_consent_valid_months; re-enrollment outreach starts assistance_reenroll_lead_days before the program year renews.
      Program choices may be recorded only while the enrollment is benefits_verification, active or on_hold.
    eligibility:
      - id: program_choice_open_enrollment
        applies_to: [specialty_program_update]
        kind: state
        condition: Program choices may be recorded only while the enrollment is benefits_verification, active or on_hold.
        evidence_fields: [specialty_enrollments.status, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.specialty_enrollment_id]
          action_bindings:
            specialty_enrollments.specialty_enrollment_id: specialty_enrollment_id
        state_contract:
          field: specialty_enrollments.status
          allowed: [benefits_verification, active, on_hold]

  - id: specialty_evt_assistance
    subject: [specialty_assistance_loaded, specialty_assistance_applied]
    rule: >-
      When assistance_enrollment_by_pharmacy is true Northbridge Specialty Pharmacy enrolls the member in the drug manufacturer's copay program, but only after the member's consent is recorded while assistance_consent_required is true.
      The program year's remaining benefit is loaded once per program and program year, as stated on the program's enrollment confirmation; a load for a program and year already loaded is never repeated.
      Assistance is applied once per shipped fill, never above the fill's cost share or the assistance balance; when no manufacturer program exists and foundation_referral is true the member is referred to an independent foundation, whose grant payments post as payments with payment_source foundation_grant.
      A program benefit may be loaded only once the member's copay program consent is on file.
    eligibility:
      - id: consent_before_load
        applies_to: [specialty_assistance_loaded]
        kind: authorization
        condition: A program benefit may be loaded only once the member's copay program consent is on file.
        evidence_fields: [specialty_enrollments.assistance_consent_date, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.specialty_enrollment_id]
          action_bindings:
            specialty_enrollments.specialty_enrollment_id: specialty_enrollment_id
      - id: load_once
        applies_to: [specialty_assistance_loaded]
        kind: dedup
        condition: a load for a program and year already loaded is never repeated.
        evidence_fields: [specialty_ledger.specialty_enrollment_id, specialty_ledger.program_name, specialty_ledger.program_year]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_ledger.specialty_enrollment_id, specialty_ledger.program_name, specialty_ledger.program_year]
          action_bindings:
            specialty_ledger.specialty_enrollment_id: specialty_enrollment_id
            specialty_ledger.program_name: program_name
            specialty_ledger.program_year: program_year
        dedup_contract:
          table: specialty_ledger
          mode: separate_record
          object_bindings: {specialty_enrollment_id: specialty_enrollment_id, program_name: program_name, program_year: program_year}
          duplicate_filters: {event_type: [specialty_assistance_loaded]}
          distinct_fields: []

  - id: specialty_split_fill
    subject: [specialty_fill_scheduled, specialty_fill_shipped]
    rule: >-
      When split_fill_program is true, a drug in split_fill_drugs is dispensed during the first split_fill_months months of a new therapy as partial fills of split_fill_days_supply days, with a pharmacist check-in before each partial fill; after that period, or when split_fill_program is false, it is dispensed as full fills.
      A member continuing the same drug from another pharmacy is not a new therapy and gets full fills.
    eligibility: []
    measures: [specialty_msr_split_fills]

  - id: specialty_evt_fill
    subject: [specialty_fill_scheduled, specialty_fill_shipped]
    rule: >-
      A refill reminder call is made refill_reminder_days_before the supply runs out, and the fill is scheduled with the member at least delivery_scheduling_lead_business_days business days before delivery, to home, to the prescriber's office when delivery_to_prescriber_office is true, or to another US address the member gives.
      Each fill is at most max_days_supply_specialty days, and above 30 days only for drugs in ninety_day_drugs; drugs in cold_chain_drugs ship refrigerated and injectables come with a sharps container when sharps_container_free is true; an adult signature is required when delivery_signature_required is true.
      A fill is scheduled or shipped only while the enrollment is active.
      A shipment waits while the member's combined specialty balance due exceeds specialty_credit_limit, and each fill's cost share is due within specialty_payment_due_days of shipment.
      When biosimilar_switch_waiver_months is above zero, a member who moves from a reference biologic to its biosimilar in biosimilar_pairs pays zero cost share on the biosimilar for that many months from the first biosimilar fill.
    eligibility:
      - id: fill_only_when_active
        applies_to: [specialty_fill_scheduled]
        kind: state
        condition: A fill is scheduled or shipped only while the enrollment is active.
        evidence_fields: [specialty_enrollments.status, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.specialty_enrollment_id]
          action_bindings:
            specialty_enrollments.specialty_enrollment_id: specialty_enrollment_id
        state_contract:
          field: specialty_enrollments.status
          allowed: [active]

  - id: specialty_evt_reship
    subject: [specialty_fill_reshipped]
    rule: >-
      A delivery that is missed, damaged or arrives outside its temperature range is reshipped at no charge when the member reports it no later than missed_delivery_report_days calendar days after the scheduled delivery date, that date being day zero.
      Free reshipments for missed or damaged deliveries are limited to reships_per_plan_year per enrollment per plan year (specialty_msr_reships_ytd); temperature excursions are always reshipped and never count.
      Each shipped fill is reshipped at most once for the same reason, and a report after the deadline is handled as an early refill under the plan's rules instead.
    eligibility:
      - id: reported_in_time
        applies_to: [specialty_fill_reshipped]
        kind: time
        condition: A delivery that is missed, damaged or arrives outside its temperature range is reshipped at no charge when the member reports it no later than missed_delivery_report_days calendar days after the scheduled delivery date, that date being day zero.
        evidence_fields: [specialty_fills.scheduled_delivery_date, specialty_fills.specialty_fill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_fills.specialty_fill_id]
          action_bindings:
            specialty_fills.specialty_fill_id: source_fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled delivery date
          anchor_source: specialty_fills.scheduled_delivery_date
          relation: not_after
          duration_source: variants.missed_delivery_report_days
          unit: calendar_days
          counting_rule: that date being day zero
          boundary: inclusive
      - id: reship_once_per_reason
        applies_to: [specialty_fill_reshipped]
        kind: dedup
        condition: Each shipped fill is reshipped at most once for the same reason, and a report after the deadline is handled as an early refill under the plan's rules instead.
        evidence_fields: [specialty_fills.source_fill_id, specialty_fills.reship_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_fills.source_fill_id]
          action_bindings:
            specialty_fills.source_fill_id: source_fill_id
        dedup_contract:
          table: specialty_fills
          mode: separate_record
          object_bindings: {source_fill_id: source_fill_id}
          duplicate_filters: {event_type: [specialty_fill_reshipped]}
          distinct_fields: [reship_reason]
    measures: [specialty_msr_reships_ytd]

  - id: specialty_hold_rules
    subject: [specialty_hold, specialty_resume, specialty_hold_discharge]
    rule: >-
      An enrollment goes on hold when the member's plan coverage ends (coverage_terminated), when the coverage review approval the drug needs expires without renewal (coverage_review_expired), when the member or prescriber asks to pause because of hospitalization or a therapy break and hospitalization_hold_allowed is true (hospitalized, therapy_paused), or when the combined specialty balance stays above specialty_credit_limit past specialty_payment_due_days (payment_overdue).
      A hold is cleared, and the enrollment resumes, only when its own cause is resolved (coverage reinstated, a new approval in force, the member or prescriber confirming therapy restarts, or the balance brought to the credit limit or below).
      An enrollment still on hold after hold_max_days calendar days, the hold start date being day zero, is discharged.
      A held enrollment may be discharged for length of hold only after hold_max_days calendar days have fully elapsed since the hold start date.
    eligibility:
      - id: hold_max_elapsed
        applies_to: [specialty_hold_discharge]
        kind: time
        condition: A held enrollment may be discharged for length of hold only after hold_max_days calendar days have fully elapsed since the hold start date.
        evidence_fields: [specialty_enrollments.hold_start_date, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.specialty_enrollment_id]
          action_bindings:
            specialty_enrollments.specialty_enrollment_id: specialty_enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold start date
          anchor_source: specialty_enrollments.hold_start_date
          relation: not_before
          duration_source: variants.hold_max_days
          unit: calendar_days
          counting_rule: the hold start date being day zero
          boundary: exclusive
      - id: resume_after_cause_resolved
        applies_to: [specialty_resume]
        kind: authorization
        condition: A hold is cleared, and the enrollment resumes, only when its own cause is resolved (coverage reinstated, a new approval in force, the member or prescriber confirming therapy restarts, or the balance brought to the credit limit or below).
        evidence_fields: [specialty_enrollments.hold_reason, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [specialty_enrollments.specialty_enrollment_id]
          action_bindings:
            specialty_enrollments.specialty_enrollment_id: specialty_enrollment_id

  - id: specialty_disenrollment_transfer
    subject: [specialty_disenroll]
    rule: >-
      Leaving Northbridge Specialty Pharmacy is the member's own decision: the agent takes a transfer_out or disenrollment service request and the enrollment is discharged when the member confirms it.
      A transfer goes only to a pharmacy that transfer_out_destination allows and is completed within transfer_out_processing_business_days business days; on an exclusive program the drug is then not covered elsewhere beyond the courtesy fills, which the member is told before confirming.
      Any balance due stays owed after discharge, and the member and prescriber are notified within discharge_letter_business_days business days.
      An enrollment may be discharged at the member's request only after a transfer_out or disenrollment request has been taken for it.
    eligibility:
      - id: request_before_discharge
        applies_to: [specialty_disenroll]
        kind: authorization
        condition: An enrollment may be discharged at the member's request only after a transfer_out or disenrollment request has been taken for it.
        evidence_fields: [specialty_service_requests.specialty_enrollment_id, specialty_service_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [specialty_service_requests.specialty_enrollment_id]
          action_bindings:
            specialty_service_requests.specialty_enrollment_id: specialty_enrollment_id

  - id: specialty_care_management
    subject: [specialty_care_contact]
    rule: >-
      A specialty pharmacist completes a clinical assessment at least every clinical_assessment_interval_days calendar days (specialty_msr_days_since_assessment); when adherence_outreach is true a member whose proportion of days covered falls below adherence_pdc_threshold receives an adherence outreach contact.
      Onboarding calls, refill reminders and injection training are recorded as care contacts with their outcome; the care team is reachable around the clock when care_team_access_24x7 is true.
      Care contacts are made only for enrollments that are active or on_hold.
    eligibility:
      - id: contact_open_enrollment
        applies_to: [specialty_care_contact]
        kind: state
        condition: Care contacts are made only for enrollments that are active or on_hold.
        evidence_fields: [specialty_enrollments.status, specialty_enrollments.specialty_enrollment_id]
        evidence_contract:
          authority: system_record
