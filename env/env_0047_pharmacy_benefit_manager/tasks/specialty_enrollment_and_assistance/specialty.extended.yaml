      - prog: "P('copay_assistance_program')"
      - split: "LATEST('specialty_fills', 'split_fill', date_field='ship_date', event_type='specialty_fill_shipped')"
      - ds: "LATEST('specialty_fills', 'days_supply', date_field='ship_date', event_type='specialty_fill_shipped')"
      - guar: "P('variable_copay_floor') * ds / 30 if (prog == 'variable_copay' and split == True and card_f > 0 and card_f < cs and P('variable_copay_floor') < cs) else (P('variable_copay_floor') if (prog == 'variable_copay' and split == False and card_f > 0 and card_f < cs and P('variable_copay_floor') < cs) else -1)"
      - cap_total: "guar if guar >= 0 else unpaid"
