    params: {}
    rule: >-
      This rule sets the copay card payment that a manufacturer copay card makes on the latest shipped fill of a specialty enrollment whose program coordinates manufacturer assistance by standard coordination or by variable copay; enrollments on a maximizer program are outside it, and so is a member whose plan backs assisted amounts out of the accumulators.
      A card program year runs from January 1 to December 31 of the program year named on its benefit load.
      The copay card payment on the latest shipped fill is the lesser of the card basis and the remaining card benefit, rounded to the nearest cent at the end.
      The copay card payment is never above the fill's cost share, and the benefit it draws on is the remaining card benefit worked out as set out here rather than the assistance balance shown on the enrollment.
      In the standard reckoning, the card basis is the fill's copay portion, that is its total cost share less its deductible portion.
      In the standard reckoning, the remaining card benefit is the assistance balance shown on the enrollment, and no card use at retail pharmacies is taken off it.
      In the standard reckoning, card payments taken off a benefit load are those of the last 12 months.
      The card basis of a fill dispensed by Northbridge Specialty Pharmacy that carries a deductible portion of which the member's own payments on the fill cover less than all is the fill's whole cost share less what the member has already paid on it, the card paying the rest of the deductible portion first; the card basis of a fill dispensed by an outside specialty pharmacy or a retail pharmacy is zero; the card basis of any other fill is its copay portion, the member having paid the deductible portion herself.
      When the latest shipped fill shipped within the program year of the latest benefit load on the enrollment's ledger, the benefit standing before retail use is that load less the card payments taken off it; when the fill shipped after that program year ended, the benefit standing before retail use is zero, the new program year's benefit not having been loaded; otherwise the benefit standing before retail use is the assistance balance shown on the enrollment.
      When today falls within the latest load's program year, the card payments taken off the load are those dated fewer whole months before today than the first day of that program year; when the latest load's program year ended no more than 365 days before today, they are the card payments dated no more whole months before today than the load itself; otherwise they are the card payments of the last 12 months.
      Card use at a retail pharmacy is the member's payment recorded on a paid retail claim for the same drug, which the network pharmacy bills to the manufacturer copay card as secondary payer after Northbridge Rx; when a load is on the ledger and paid retail claims for the drug are dated fewer whole months before today than the first day of the load's program year, the card use on those claims is taken off the benefit; when no load is on the ledger and paid retail claims for the drug fall in the last 12 months, the card use on those claims is taken off the assistance balance shown on the enrollment; otherwise no card use at retail pharmacies is taken off.
      The remaining card benefit, once retail card use is taken off, is never below zero, and the payment is rounded to the nearest cent only once, on the final figure.
      The application is recorded against the program name and program year of the latest load, its deductible portion being the part of the payment that covers the fill's deductible portion.
