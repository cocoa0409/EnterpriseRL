  - id: specialty_ext_hold_release_payment
    base_policy_refs: [specialty_agg_therapy_coordination, specialty_evt_payment, specialty_hold_rules]
    overwrite:
      - base_policy: specialty_hold_rules
        superseded_clause: >-
          or the balance brought to the credit limit or below
        replaced_by: >-
          The hold-release payment is the enrollment's open balance, plus any overpayment returned rather than set against it, less the release target, never below zero, rounded to the nearest cent at the end.
    trigger: on_request
    subject: [specialty_payment_posted]
    computes: amount
    target_tool: pay_hold_release_166e6883
    params: {}
    rule: >-
      This rule sets the hold-release payment, the payment a member makes with their own card to lift a hold that was placed on a specialty enrollment for an overdue payment; it is posted against the latest shipped fill, earlier fills being settled first, and it covers the enrollment's own balance only.
      The hold-release payment is not set until the latest shipped fill carries the maximizer program draw owed on it.
      The hold-release payment is the enrollment's open balance, plus any overpayment returned rather than set against it, less the release target, never below zero, rounded to the nearest cent at the end.
      In the standard reckoning, the enrollment's open balance is the balance due shown on the enrollment.
      In the standard reckoning, no fill's cost share is set aside from the open balance.
      In the standard reckoning, no overpayment is returned.
      In the standard reckoning, the release target is the specialty credit limit.
      When the enrollment's ledger shows shipped fills, the open balance is the total cost share of every shipped fill, less every payment posted on the enrollment by the member, a manufacturer program or a foundation, less the cost share set aside for fills settled at the outside pharmacy that dispensed them; when it shows no shipped fill but shows scheduled fills, the open balance is zero, nothing having been charged yet; otherwise the open balance is the balance due shown on the enrollment.
      For fills dispensed by an outside specialty pharmacy or a retail pharmacy, when no payment on the enrollment's ledger names the latest such fill of either kind, their whole cost share is set aside from the open balance, having been settled at the dispensing pharmacy; when payments on the ledger name the latest such fill of either kind, their cost share less those payments is set aside; when the enrollment has no fill dispensed outside Northbridge Specialty Pharmacy, nothing is set aside.
      An overpayment is returned rather than set against the open balance as follows, the older fills being those shipped 12 or more whole months before today and the older payments those dated 12 or more whole months before today: when the member's own older payments together with the program's older payments exceed the older fills' cost share while the program's older payments alone do not, the member's excess is returned to the member; when the program's older payments alone exceed the older fills' cost share, the program's excess is returned to the program; otherwise nothing is returned.
      When fills have shipped and none shipped fewer than one whole month before today, the release target is zero, the whole open balance being collected; when some fills shipped one or more whole months before today and others shipped fewer than one whole month before today, the release target is the cost share of the fills shipped in that last month, which may stay open; otherwise the release target is the specialty credit limit.
      The returned overpayment is added to the open balance, the release target is then taken off, the result is never below zero, and the payment is rounded to the nearest cent only once, on the final figure.
    prerequisite:
      - problem: specialty_ext_maximizer_draw
        kind: value_input
        gate: open_balance
        form: state
        policy_source: >-
          The hold-release payment is not set until the latest shipped fill carries the maximizer program draw owed on it.
        condition: >-
          The ledger carries a specialty_assistance_applied entry (with its manufacturer payment) naming the latest shipped fill, written by the maximizer draw rule, so the payments set against the shipped cost shares include that draw.
        resolved_by: apply_maximizer_draw_3be5be4a
        effect: >-
          Once the maximizer program draw stands on the latest fill, the payments posted on the enrollment rise by the draw and the open balance, hence the hold-release payment, falls by the same amount.
    cross_category: []
    compute:
      - tot_cs_all: "SUM('specialty_fills', 'cost_share_amount', event_type='specialty_fill_shipped')"
      - n_shipped: "COUNT('specialty_fills', event_type='specialty_fill_shipped')"
      - n_sched: "COUNT('specialty_fills', event_type='specialty_fill_scheduled')"
      - pay_all: "SUM('specialty_ledger', 'amount', event_type='specialty_payment_posted')"
      - rt_cs: "SUM('specialty_fills', 'cost_share_amount', event_type='specialty_fill_shipped', dispensing_pharmacy='retail_pharmacy') + SUM('specialty_fills', 'cost_share_amount', event_type='specialty_fill_shipped', dispensing_pharmacy='outside_specialty_pharmacy')"
      - rt_n: "COUNT('specialty_fills', event_type='specialty_fill_shipped', dispensing_pharmacy='retail_pharmacy') + COUNT('specialty_fills', event_type='specialty_fill_shipped', dispensing_pharmacy='outside_specialty_pharmacy')"
      - rt_last: "LATEST('specialty_fills', 'specialty_fill_id', date_field='ship_date', event_type='specialty_fill_shipped', dispensing_pharmacy='retail_pharmacy')"
      - os_last: "LATEST('specialty_fills', 'specialty_fill_id', date_field='ship_date', event_type='specialty_fill_shipped', dispensing_pharmacy='outside_specialty_pharmacy')"
      - rt_paid: "SUM('specialty_ledger', 'amount', event_type='specialty_payment_posted', specialty_fill_id=rt_last) + SUM('specialty_ledger', 'amount', event_type='specialty_payment_posted', specialty_fill_id=os_last)"
      - set_aside: "rt_cs if (rt_n > 0 and rt_paid == 0) else ((rt_cs - rt_paid) if (rt_n > 0 and rt_paid > 0) else 0)"
      - open_balance: "(tot_cs_all - pay_all - set_aside) if n_shipped > 0 else (0 if n_sched > 0 else F('balance_due'))"
      - cs_old: "SUM('specialty_fills', 'cost_share_amount', event_type='specialty_fill_shipped') - SUM('specialty_fills', 'cost_share_amount', within_months=12, date_field='ship_date', event_type='specialty_fill_shipped')"
      - mem_old: "SUM('specialty_ledger', 'amount', event_type='specialty_payment_posted', payment_source='member') - SUM('specialty_ledger', 'amount', within_months=12, date_field='entry_date', event_type='specialty_payment_posted', payment_source='member')"
      - prog_old: "(pay_all - SUM('specialty_ledger', 'amount', event_type='specialty_payment_posted', payment_source='member')) - (SUM('specialty_ledger', 'amount', within_months=12, date_field='entry_date', event_type='specialty_payment_posted') - SUM('specialty_ledger', 'amount', within_months=12, date_field='entry_date', event_type='specialty_payment_posted', payment_source='member'))"
      - returned: "(mem_old + prog_old - cs_old) if (mem_old + prog_old > cs_old and prog_old <= cs_old) else ((prog_old - cs_old) if prog_old > cs_old else 0)"
      - recent_n: "COUNT('specialty_fills', within_months=1, date_field='ship_date', event_type='specialty_fill_shipped')"
      - recent_cs: "SUM('specialty_fills', 'cost_share_amount', within_months=1, date_field='ship_date', event_type='specialty_fill_shipped')"
      - older_n: "n_shipped - recent_n"
      - release_target: "0 if (n_shipped > 0 and recent_n == 0) else (recent_cs if (older_n > 0 and recent_n > 0) else P('specialty_credit_limit'))"
      - result: "RND(MX(open_balance + returned - release_target, 0), 2)"
    compute_basis:
      tot_cs_all: "the open balance is the total cost share of every shipped fill"
      n_shipped: "When the enrollment's ledger shows shipped fills"
      n_sched: "when it shows no shipped fill but shows scheduled fills, the open balance is zero"
      pay_all: "less every payment posted on the enrollment by the member, a manufacturer program or a foundation"
      rt_cs: "their whole cost share is set aside from the open balance"
      rt_n: "For fills dispensed by an outside specialty pharmacy or a retail pharmacy"
      rt_last: "the latest such fill of either kind"
      os_last: "the latest such fill of either kind"
      rt_paid: "when payments on the ledger name the latest such fill of either kind, their cost share less those payments is set aside"
      set_aside: "For fills dispensed by an outside specialty pharmacy or a retail pharmacy, when no payment on the enrollment's ledger names the latest such fill of either kind, their whole cost share is set aside from the open balance, having been settled at the dispensing pharmacy; when payments on the ledger name the latest such fill of either kind, their cost share less those payments is set aside; when the enrollment has no fill dispensed outside Northbridge Specialty Pharmacy, nothing is set aside."
      open_balance: "When the enrollment's ledger shows shipped fills, the open balance is the total cost share of every shipped fill, less every payment posted on the enrollment by the member, a manufacturer program or a foundation, less the cost share set aside for fills settled at the outside pharmacy that dispensed them; when it shows no shipped fill but shows scheduled fills, the open balance is zero, nothing having been charged yet; otherwise the open balance is the balance due shown on the enrollment."
      cs_old: "the older fills being those shipped 12 or more whole months before today"
      mem_old: "the older payments those dated 12 or more whole months before today: when the member's own older payments"
      prog_old: "together with the program's older payments"
      returned: "An overpayment is returned rather than set against the open balance as follows, the older fills being those shipped 12 or more whole months before today and the older payments those dated 12 or more whole months before today: when the member's own older payments together with the program's older payments exceed the older fills' cost share while the program's older payments alone do not, the member's excess is returned to the member; when the program's older payments alone exceed the older fills' cost share, the program's excess is returned to the program; otherwise nothing is returned."
      recent_n: "none shipped fewer than one whole month before today"
      recent_cs: "the release target is the cost share of the fills shipped in that last month"
      older_n: "some fills shipped one or more whole months before today"
      release_target: "When fills have shipped and none shipped fewer than one whole month before today, the release target is zero, the whole open balance being collected; when some fills shipped one or more whole months before today and others shipped fewer than one whole month before today, the release target is the cost share of the fills shipped in that last month, which may stay open; otherwise the release target is the specialty credit limit."
      result: "The returned overpayment is added to the open balance, the release target is then taken off, the result is never below zero, and the payment is rounded to the nearest cent only once, on the final figure."
    factors:
      - id: hold_open_balance
        effect: method
        decides: open_balance
        bindings: [tot_cs_all, n_shipped, n_sched, open_balance]
        ladder:
          - when: "the enrollment's ledger shows shipped fills"
            method: "total cost share of every shipped fill less every payment posted less the cost share set aside"
          - when: "the ledger shows no shipped fill but shows scheduled fills"
            method: "zero (nothing charged yet)"
          - when: "otherwise"
            method: "the balance due shown on the enrollment"
        baseline:
          open_balance: "F('balance_due')"
        evidence: [history]
        cross_difficulty: null
      - id: outside_fill_set_aside
        effect: method
        decides: set_aside
        bindings: [rt_cs, rt_n, rt_last, os_last, rt_paid, set_aside]
        ladder:
          - when: "the enrollment has fills dispensed by an outside specialty pharmacy or a retail pharmacy and no payment names the latest such fill of either kind"
            method: "set aside their whole cost share"
          - when: "the enrollment has such fills and payments name the latest such fill of either kind"
            method: "set aside their cost share less those payments"
          - when: "otherwise"
            method: "set aside nothing"
        baseline:
          set_aside: "0"
        evidence: [history]
        cross_difficulty: null
      - id: returned_overpayment_on_old_fills
        effect: parameter
        decides: returned
        bindings: [cs_old, mem_old, prog_old, returned]
        ladder:
          - when: "the member's and the program's payments dated 12 or more whole months ago exceed the cost share of fills shipped 12 or more whole months ago while the program's alone do not"
            value: "the member's excess, returned to the member"
          - when: "the program's payments dated 12 or more whole months ago alone exceed that cost share"
            value: "the program's excess, returned to the program"
          - when: "otherwise"
            value: "zero"
        baseline:
          returned: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: hold_release_target
        effect: parameter
        decides: release_target
        bindings: [recent_n, recent_cs, older_n, release_target]
        ladder:
          - when: "fills have shipped and none shipped fewer than one whole month before today"
            value: "zero"
          - when: "some fills shipped one or more whole months before today and others shipped fewer than one whole month before today"
            value: "the cost share of the fills shipped in that last month"
          - when: "otherwise"
            value: "P('specialty_credit_limit')"
        baseline:
          release_target: "P('specialty_credit_limit')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The hold-release payment is the enrollment's open balance, plus any overpayment returned rather than set against it, less the release target, never below zero, rounded to the nearest cent at the end.
        In the standard reckoning, the enrollment's open balance is the balance due shown on the enrollment.
        In the standard reckoning, no fill's cost share is set aside from the open balance.
        In the standard reckoning, no overpayment is returned.
        In the standard reckoning, the release target is the specialty credit limit.
      params: [specialty_credit_limit]
    inputs:
      history:
        - {table: specialty_fills, aggregate: sum, field: cost_share_amount, filters: {event_type: specialty_fill_shipped}}
        - {table: specialty_ledger, aggregate: sum, field: amount, filters: {event_type: specialty_payment_posted}}
        - {table: specialty_fills, aggregate: count, field: specialty_fill_id, within_months: 1, filters: {event_type: specialty_fill_shipped}}
      cross_category: []
