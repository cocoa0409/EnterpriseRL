      - mem_w: "SUM('specialty_ledger', 'amount', within_months=credit_window, date_field='entry_date', event_type='specialty_payment_posted', payment_source='member')"
      - cs_w: "SUM('specialty_fills', 'cost_share_amount', within_months=credit_window, date_field='ship_date', event_type='specialty_fill_shipped')"
      - card_w: "SUM('specialty_ledger', 'amount', within_months=credit_window, date_field='entry_date', event_type='specialty_assistance_applied')"
