name: env_0048_manufactured_home_community_operator
company: Hearthstone Communities

background: |
  Hearthstone Communities is a privately held owner-operator of manufactured housing communities, running six communities with about 2,140 home sites: Willow Bend Estates in Lakeland and Palmetto Shores in Fort Myers, Florida; Saguaro Vista in Mesa, Arizona; Bluebonnet Ridge in Conroe, Texas; Cedar Hollow outside Grand Rapids, Michigan; and Conestoga Meadows in Lancaster County, Pennsylvania.
  Most residents own their manufactured home and lease the land beneath it from Hearthstone, and its centralized resident desk answers their calls by phone and portal chat in a plain, neighborly tone.
  The core product is the Home-Site Lease, priced by lot class: Standard Single-Section Home Site, Preferred Single-Section Home Site, Standard Multi-Section Home Site, Preferred Multi-Section Home Site, Greenbelt Multi-Section Home Site and Lakefront Multi-Section Home Site, held month to month or on twelve- or twenty-four-month terms and billed as site rent on the first of each month.
  Each leased site carries a Utility Pass-Through Service account on the schedule its community's infrastructure supports — the Flat-Rate Water, Sewer & Trash Schedule, Submetered Water Schedule, Submetered Water & Sewer Schedule, Submetered Water, Sewer & Natural Gas Schedule, Submetered Water, Sewer & Propane Schedule or Submetered Electric, Water & Sewer Schedule — read monthly and billed on a separate utility statement.
  Every site also carries a Community Rules & Site Care plan record, from the Self-Maintained Site through the Lawn Mowing Plan, Lawn & Trim Plan, Full Lawn Care Plan, Full Lawn & Snow Care Plan and Complete Site Care Plan, which collects plan fees, rule notices, self-help maintenance charges and pet and vehicle registrations.
  The affiliate Hearthstone Home Finance makes home-only purchase loans on homes in the communities as the Home-Only Loan 7-Year Fixed, 10-Year Fixed, 15-Year Fixed, 20-Year Fixed, 23-Year Fixed and 25-Year Fixed, collected in monthly installments with a hazard-insurance escrow on the longer programs.
  The affiliate Hearthstone Home Sales handles In-Place Home Resale files for residents selling their homes where they sit, through the Resale Approval Service, Owner-Marketed Listing Package, Assisted Resale Listing, Full-Service Resale Brokerage, Full-Service Resale Brokerage Plus and Guaranteed Resale Program, each running the pre-sale inspection and the buyer's residency approval.
  Hearthstone Insurance Agency places Manufactured Home Insurance on residents' homes in six forms, from the Manufactured Home Basic Form - Actual Cash Value up to the Manufactured Home Special Form Plus - Extended Replacement Cost, billed annually, semi-annually, monthly by EFT or through the loan escrow.
  Each community's fenced storage yard rents RV & Boat Storage spaces as the Open Compact Storage Space, Open Standard Storage Space, Open Large Storage Space, Covered Standard Storage Space, Covered Large Storage Space and Enclosed Storage Unit.
  Callers are mostly homeowners aged forty to seventy-five, many of them retirees and seasonal residents at the Florida and Arizona communities and working families at the Texas, Michigan and Pennsylvania ones.
  A typical resident holds a site lease, its utility account and its site-care plan record, and a sizeable minority also carry a Hearthstone home loan, an insurance policy with Hearthstone Home Finance as loss payee, or a storage space.
  Their records carry years of monthly rent and utility charges, payments by autopay, portal, money order or check, occasional late fees and returned payments, renewal offers and rent-increase notices, rule notices and cures, and, for borrowers, installment histories with escrow analyses and the odd deferment.
  Residents call when a statement looks wrong, a deadline is near, a lease term is ending, a home is about to be sold, or a notice has arrived that they do not understand.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: site_lease_rent_and_renewals
    claim:
      categories: [lease]
      event_types: [lease_rent_charge, lease_occupant_charge, lease_late_fee, lease_payment, lease_payment_return, lease_nsf_fee, lease_rent_credit, lease_fee_waiver, lease_early_termination_fee, lease_renewal_offer, lease_renewal, lease_rent_increase_notice, lease_rent_increase, lease_autopay_change, lease_payment_restriction_change, lease_occupant_change, lease_notice_to_vacate, lease_notice_rescission, lease_nonpayment_notice, lease_repayment_agreement]
    summary: >
      Residents call the desk about their home-site lease: a late fee they think is unfair, a returned payment and the certified-funds restriction it triggered, a renewal offer or rent-increase notice whose amount or timing they question, a request to enroll in autopay, add an adult occupant, give or withdraw notice to vacate, or spread past-due rent over a repayment agreement.
      The settings vary across the six lot classes (whose late-fee caps, autopay discounts, renewal increases, holdover basis, term availability and notice periods differ under lease_evt_late_fee, lease_evt_autopay, lease_renewal_terms and lease_vacate_terms), across lease status (active, notice_to_vacate, in_default, closed) and term type, across the community the site lies in (whose rent-increase notice days and nonpayment cure days differ under lease_rent_increase_terms and lease_nonpayment_process), and across ledger history — tenure since move-in, prior courtesy waivers, returned payments in the lookback, earlier repayment agreements and rent increases in the trailing year.
      The records involved are the lease itself, its rent ledger with each charge, payment, return, credit and waiver tied to its source entry, and its notices; the governing rules are state gates on lease status and payment restriction, time gates anchored on the rent due date, move-in date, renewal offer date and notice dates, per-tier quantities read from the lease charter, and windowed counts such as lease_msr_courtesy_waivers and lease_msr_returned_payments, while the domain's natural order runs charge, due date, grace period, late fee, notice and default.
      Waivers, credits, restriction changes and recorded notices are agent service actions on a verified account, while signing a renewal, giving or withdrawing a notice to vacate, authorizing autopay and signing a repayment agreement are the resident's own acts handed over to them; the resident's other Hearthstone holdings (a loan, a resale file, a utility account) can bear on lease questions such as an early-termination fee or a sale closeout but are not written here.
      Requests no lease policy can decide — negotiating an eviction or possession date on a lease in default, disputing site-damage deductions from a deposit, or asking for a rent amount outside the published schedule — go to a human representative as POLICY_NOT_COVERED.
  - name: utility_pass_through_billing
    claim:
      categories: [utility]
      event_types: [utility_meter_read, utility_usage_charge, utility_fixed_charge, utility_admin_fee, utility_late_fee, utility_payment, utility_payment_return, utility_adjustment_credit, utility_meter_test, utility_meter_test_fee, utility_meter_exchange, utility_final_read_order, utility_final_bill, utility_credit_refund]
    summary: >
      Residents call about their utility statement: a water bill that spiked after a leak they have since repaired, a run of estimated reads, a bill they believe was computed on the wrong block rate or sewer cap, a late fee, a meter they want tested, or the final statement and refund after moving out.
      The setting turns on the site's service schedule — fixed by community and section, and differing in which services are submetered, the block rates and sewer cap, the leak-adjustment cap and the meter-test fee under utility_evt_statement_billing, utility_evt_leak_adjustment and utility_meter_accuracy — and on account status (active, final_read_pending, final_billed), the leak location the resident reports, the baseline of earlier actual reads, how many leak adjustments and courtesy waivers were granted in the trailing year, and whether the site's lease is under a certified-funds restriction.
      The records are the utility account, its ledger of reads, charges, payments, credits and meter tests tied by source entry, the resident's service requests, and the lease of the site served; the rules include time gates anchored on the statement date and statement due date, a state gate for meter tests, block-rate and cap computations, a dedup gate on leak adjustments, and windowed measures such as utility_msr_baseline_consumption and utility_msr_estimate_streak, the natural order being read, statement, due date, grace and late fee.
      Adjustment credits, late fees, recorded meter tests and refunds are agent service actions on a verified account, while the leak repair evidence and leak location are facts only the resident can state and the request itself is the resident's own; utility balances never move to the lease ledger.
      Requests no utility policy decides — taking service directly from the public utility, switching to a different schedule, shutting off service, or contesting the public utility's own rates — go to a human representative as POLICY_NOT_COVERED.
  - name: home_loan_servicing
    claim:
      categories: [loan]
      event_types: [loan_installment_payment, loan_partial_payment, loan_suspense_application, loan_escrow_deposit, loan_due_date_advance, loan_late_charge, loan_fee_payment, loan_fee_waiver, loan_payment_return, loan_escrow_reversal, loan_nsf_fee, loan_curtailment, loan_payoff_statement, loan_payoff_payment, loan_deferment_agreement, loan_deferment, loan_deferment_fee, loan_due_date_change, loan_autopay_change, loan_escrow_analysis, loan_escrow_change, loan_insurance_status_change, loan_insurance_lapse_notice]
    summary: >
      Borrowers with Hearthstone Home Finance call about their home loan: a late charge on an installment they think arrived in time, a partial payment sitting in suspense, a returned autopay draft, an escrow increase after the annual analysis, a lapse notice or lender-placed premium after their hazard policy lapsed, a payoff figure for selling or refinancing, a request to defer installments through a hardship, or to change the due day.
      The setting varies across the six programs (whose late-charge caps, escrow requirement, deferment availability, months per deferment, lifetime limits and deferment fees differ under loan_evt_late_charge, loan_escrow_terms and loan_deferment_terms), across loan status (active, delinquent, paid_off, charged_off), and across the installment history — installments paid since funding, days past due, prior deferments and courtesy waivers in the trailing year, returned autopay drafts and the insurance status, which in turn depends on the borrower's Hearthstone or outside hazard policy naming Hearthstone Home Finance as loss payee.
      The records are the loan, its transactions split into principal, interest, escrow and fees with each reversal or waiver tied to its source, its notices and the borrower's requests; the rules are state gates on loan status, time gates anchored on the installment due date and the first lapse notice date, amortization, interest, payoff and escrow computations in the loan charter, and measures such as loan_msr_days_past_due and loan_msr_installments_paid, the natural order being due date, grace, late charge, delinquency, right-to-cure notice and charge-off.
      Payment application, fee waivers, payoff statements and recorded insurance-status changes are agent service actions, while signing a deferment agreement and authorizing autopay are the borrower's own acts handed over to them.
      Requests no loan policy decides — a modification of rate, term or balance, a deferment beyond the program limits, settling a charged-off balance, or anything about repossession — go to a human representative as POLICY_NOT_COVERED.
  - name: in_place_home_sale_approvals
    claim:
      categories: [resale]
      event_types: [resale_file_open, resale_listing_activation, resale_price_change, resale_listing_extension, resale_occupancy_change, resale_inspection, resale_fee_charge, resale_fee_credit, resale_fee_payment, resale_purchase_agreement, resale_offer_acceptance, resale_agreement_cancellation, resale_contract_cancellation, resale_withdrawal, resale_closing, resale_closing_statement, resale_proceeds_deduction]
    summary: >
      Residents selling their homes in place call about their resale file: opening a file under a package, what the pre-sale inspection found and what a re-inspection costs, extending or withdrawing a listing, accepting an offer, why a closing cannot be scheduled yet, what the commission and closing deductions will be, or what happens to the buyer's earnest money when a deal falls through.
      The setting varies across the six packages (whose service fees, commissions and minimums, included re-inspections, listing terms, extension limits, withdrawal fees and inspection-fee credits differ under resale_file_opening_terms, resale_inspection_terms, resale_listing_terms, resale_withdrawal_terms and resale_closing_settlement), across file status (opened, listed, under_contract, closed_sold, withdrawn, expired), and across facts held elsewhere — the seller's lease status and balance, the buyer's own residency application on the same site, a Hearthstone Home Finance lien, the home's occupancy and the community it sits in.
      The records are the resale file, its ledger of charges, payments, credits and closing deductions, its records of inspections, agreements, cancellations and closing statements, and the seller's and buyer's lease records; the rules include authorization gates on the seller's lease and the buyer's approved residency, a state gate requiring a listed home for price changes, extensions and agreements, a time gate anchored on the most recent passed inspection, and commission and proceeds computations, the natural order being opening, inspection, listing, agreement, buyer application, approval and closing.
      Recording inspections, charges, credits and closings are agent service actions, while signing the listing agreement, changing the price, extending, withdrawing and accepting an offer are the seller's own acts handed over to them.
      Requests no resale policy decides — a seller backing out of a signed purchase agreement, a sale whose proceeds would not cover the Hearthstone loan payoff, a sale with the home removed from the community, or a dispute between buyer and seller over the home's condition — go to a human representative as POLICY_NOT_COVERED.
  - name: community_rules_and_site_care_charges
    claim:
      categories: [rules]
      event_types: [rules_violation_notice, rules_cure_confirmation, rules_self_help_charge, rules_repeat_violation_charge, rules_pet_registration_fee, rules_vehicle_permit_fee, rules_registration_change, rules_plan_election, rules_plan_change, rules_plan_fee, rules_payment, rules_charge_waiver, rules_appeal_decision, rules_guest_registration]
    summary: >
      Residents call about community rule charges and their site-care plan: a self-help mowing or debris charge they believe the plan should have covered, a repeat-violation charge, a pet fee on an assistance animal, a permit fee for a third vehicle, an appeal of a charge, a guest who is staying longer than planned, or a wish to move up or down between plans.
      The setting varies across the six plans (whose fees, minimum terms, covered upkeep such as mowing, trimming, snow removal and debris hauls, and self-help administration fees differ under rules_plan_terms, rules_violation_process and rules_self_help_terms), across record status (enrolled, service_suspended, ended), across the community (which decides whether snow plans are offered and whether repeat-violation charges are permitted under rules_repeat_violation_terms), and across notice history — the rule class, cure deadline and outcome of each notice and the count of notices in the trailing window.
      The records are the plan record, its ledger of plan fees, charges, payments and waivers tied to the violation notice or charge they act on, its records of notices, cures, plan elections, guest registrations and appeal decisions, and the resident's appeals; the rules include time gates anchored on the violation notice date, the last plan change date and the charge date, a state gate on plan changes and registrations, a dedup gate on waivers, and measures such as rules_msr_class_notices, the natural order being notice, cure deadline, self-help and charge, appeal and decision.
      Recording notices, outcomes, charges, waivers and registrations are agent service actions, while electing a plan and appealing a charge are the resident's own acts handed over to them; the site's lease decides the community and the plan record's life but is not written here.
      Requests no rules policy decides — noise, conduct or safety complaints against neighbors, eviction for repeated violations, or permission for a structure the rules do not cover — go to a human representative as POLICY_NOT_COVERED.
