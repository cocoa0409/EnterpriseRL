events:
  - type: insurance_quote
    target: insurance_policies
    mutation: create
    meaning: The agency quotes a policy on the resident's home at chosen limits, deductible and payment plan.
    grain: One row per quote.
    fields:
      customer_id: The applicant (the named insured once bound).
      lease_id: Site lease of the home insured.
      variant_name: Policy form quoted.
      home_serial_number: Serial number of the home insured, from its title.
      home_model_year: Model year of the home.
      dwelling_coverage: Dwelling limit quoted.
      aop_deductible: All-other-perils deductible chosen.
      liability_limit: Personal liability limit chosen.
      payment_plan: Payment plan chosen.
      loss_payee: Lienholder named as loss payee, if any.
      annual_premium: Annual premium quoted.
      quoted_date: Date of the quote.
      effective_date: Proposed first day of coverage.
    triggers: []
  - type: insurance_bind
    target: insurance_policies
    mutation: {transition: {from: quoted, to: bound}}
    meaning: The resident accepts the quote and the policy is bound.
    grain: One row per transaction.
    fields:
      status: Set to bound.
      policy_number: Policy number issued by the carrier.
      effective_date: First day of coverage.
      expiration_date: Last day of the term.
    triggers:
      - event: insurance:insurance_policy_fee
        map: {term_start_date: effective_date}
  - type: insurance_quote_expiry
    target: insurance_policies
    mutation: {transition: {from: quoted, to: expired}}
    meaning: The quote lapses unbound.
    grain: One row per transaction.
    fields:
      status: Set to expired.
      ended_date: Day after the last day the quote was valid.
    triggers: []
  - type: insurance_inception
    target: insurance_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage begins on the effective date.
    grain: One row per transaction.
    fields:
      status: Set to in_force.
      loss_payee: Loss payee on the policy as coverage begins.
    triggers:
      - event: loan:loan_insurance_status_change
        when: {loss_payee: hearthstone_home_finance}
        map: {insurance_status: in_force}
  - type: insurance_nonpayment_pending
    target: insurance_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: The notice of cancellation for nonpayment is mailed and the policy awaits payment.
    grain: One row per transaction.
    fields:
      status: Set to pending_cancellation.
      pending_cancel_date: Cancellation date stated in the notice.
    triggers: []
  - type: insurance_payment_cure
    target: insurance_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: The past-due premium is paid before the cancellation date.
    grain: One row per transaction.
    fields:
      status: Set to in_force.
      pending_cancel_date: Cleared.
    triggers: []
  - type: insurance_cancel_nonpayment
    target: insurance_policies
    mutation: {transition: {from: pending_cancellation, to: cancelled}}
    meaning: Coverage ends for nonpayment on the cancellation date.
    grain: One row per transaction.
    fields:
      status: Set to cancelled.
      ended_date: Cancellation date.
      loss_payee: Loss payee on the policy when coverage ended.
    triggers:
      - event: loan:loan_insurance_status_change
        when: {loss_payee: hearthstone_home_finance}
        map: {insurance_status: lapsed}
  - type: insurance_reinstatement
    target: insurance_policies
    mutation: {transition: {from: cancelled, to: in_force}}
    meaning: A policy cancelled for nonpayment is reinstated within the window.
    grain: One row per transaction.
    fields:
      status: Set to in_force.
      ended_date: Cleared.
      loss_payee: Loss payee on the reinstated policy.
    triggers:
      - event: loan:loan_insurance_status_change
        when: {loss_payee: hearthstone_home_finance}
        map: {insurance_status: in_force}
  - type: insurance_cancel_request
    target: insurance_policies
    mutation: {transition: {from: in_force, to: cancelled}}
    meaning: The insured cancels the policy.
    grain: One row per transaction.
    fields:
      status: Set to cancelled.
      ended_date: Cancellation date requested by the insured (no earlier than the request date).
      loss_payee: Loss payee on the policy when coverage ended.
    triggers:
      - event: loan:loan_insurance_status_change
        when: {loss_payee: hearthstone_home_finance}
        map: {insurance_status: lapsed}
      - event: insurance:insurance_return_premium
        map: {txn_date: ended_date}
  - type: insurance_expiration
    target: insurance_policies
    mutation: {transition: {from: in_force, to: expired}}
    meaning: The term ends without the renewal being accepted.
    grain: One row per transaction.
    fields:
      status: Set to expired.
      ended_date: Day after the expiration date.
      loss_payee: Loss payee on the policy when coverage ended.
    triggers:
      - event: loan:loan_insurance_status_change
        when: {loss_payee: hearthstone_home_finance}
        map: {insurance_status: lapsed}
  - type: insurance_nonrenewal
    target: insurance_policies
    mutation: {transition: {from: in_force, to: non_renewed}}
    meaning: The carrier declines to renew and the term ends.
    grain: One row per transaction.
    fields:
      status: Set to non_renewed.
      ended_date: Day after the expiration date.
      loss_payee: Loss payee on the policy when coverage ended.
    triggers:
      - event: loan:loan_insurance_status_change
        when: {loss_payee: hearthstone_home_finance}
        map: {insurance_status: lapsed}
  - type: insurance_renewal
    target: insurance_policies
    mutation: update
    meaning: A new term begins under an accepted renewal.
    grain: One row per transaction.
    fields:
      effective_date: First day of the new term.
      expiration_date: Last day of the new term.
      annual_premium: Annual premium of the new term.
    triggers:
      - event: insurance:insurance_policy_fee
        map: {term_start_date: effective_date}
  - type: insurance_endorsement
    target: insurance_policies
    mutation: update
    meaning: Limits or the deductible are changed mid-term.
    grain: One row per transaction.
    fields:
      dwelling_coverage: Dwelling limit after the change.
      aop_deductible: Deductible after the change.
      liability_limit: Liability limit after the change.
      annual_premium: Annual premium after the change.
    triggers: []
  - type: insurance_account_change
    target: insurance_policies
    mutation: update
    meaning: The loss payee or the payment plan on the policy is changed.
    grain: One row per transaction.
    fields:
      loss_payee: Loss payee after the change.
      payment_plan: Payment plan after the change.
    triggers: []

  - type: insurance_premium_installment
    target: insurance_transactions
    meaning: A premium installment falls due under the payment plan.
    grain: One row per term per installment.
    distinguish_by: [term_start_date, installment_number]
    fields:
      policy_id: Policy billed.
      txn_date: Installment due date.
      term_start_date: First day of the term billed.
      installment_number: Installment within the term (1 for annual).
      amount: Premium billed, positive.
    account: premium_receivable
    direction: in
    triggers: []
  - type: insurance_policy_fee
    target: insurance_transactions
    meaning: The fully earned policy fee is charged for a term.
    grain: One row per term.
    distinguish_by: [term_start_date]
    fields:
      policy_id: Policy billed.
      txn_date: Date charged.
      term_start_date: First day of the term.
      amount: Fee, positive.
    account: premium_receivable
    direction: in
    triggers: []
  - type: insurance_installment_fee
    target: insurance_transactions
    meaning: The installment fee is added to a semi-annual or monthly installment.
    grain: One row per term per installment.
    distinguish_by: [term_start_date, installment_number]
    fields:
      policy_id: Policy billed.
      txn_date: Installment due date.
      term_start_date: First day of the term.
      installment_number: Installment within the term.
      amount: Fee, positive.
    account: premium_receivable
    direction: in
    triggers: []
  - type: insurance_endorsement_premium
    target: insurance_transactions
    meaning: Additional premium for a mid-term coverage increase is charged.
    grain: One row per endorsement.
    distinguish_by: [txn_date]
    fields:
      policy_id: Policy billed.
      txn_date: Effective date of the endorsement.
      amount: Additional premium, positive.
    account: premium_receivable
    direction: in
    triggers: []
  - type: insurance_payment
    target: insurance_transactions
    meaning: The insured pays premium.
    grain: One row per payment.
    distinguish_by: [payment_ref]
    fields:
      policy_id: Policy credited.
      txn_date: Date received.
      amount: Payment, positive.
      payment_channel: Channel used.
      payment_ref: Confirmation or check number of the payment.
    account: premium_receivable
    direction: out
    triggers: []
  - type: insurance_escrow_remittance
    target: insurance_transactions
    meaning: Hearthstone Home Finance pays the term premium from the borrower's escrow.
    grain: One row per term.
    distinguish_by: [term_start_date]
    fields:
      policy_id: Policy credited.
      txn_date: Date received.
      term_start_date: First day of the term paid.
      amount: Premium remitted, positive.
    account: premium_receivable
    direction: out
    triggers: []
  - type: insurance_return_premium
    target: insurance_transactions
    meaning: Unearned premium is credited back on a cancellation or a mid-term coverage decrease.
    grain: One row per cancellation or endorsement.
    distinguish_by: [txn_date, refund_basis]
    fields:
      policy_id: Policy credited.
      txn_date: Cancellation or endorsement effective date.
      refund_basis: How the unearned premium was computed.
      amount: Return premium, positive.
    account: premium_receivable
    direction: out
    triggers: []
  - type: insurance_refund_issued
    target: insurance_transactions
    meaning: A credit balance on the policy is refunded to the insured (or to the escrow that paid it).
    grain: One row per refund.
    distinguish_by: [txn_date]
    fields:
      policy_id: Policy refunded.
      txn_date: Date issued.
      amount: Refund, positive (it brings the credit balance back to zero).
    account: premium_receivable
    direction: in
    triggers: []
  - type: insurance_payment_return
    target: insurance_transactions
    meaning: A premium payment is returned unpaid by the bank and charged back.
    grain: One row per returned payment.
    distinguish_by: [source_txn_id]
    fields:
      policy_id: Policy charged back.
      txn_date: Date of the return.
      source_txn_id: The payment returned.
      amount: Amount charged back, positive.
    account: premium_receivable
    direction: in
    triggers: []

  - type: insurance_cancellation_notice
    target: insurance_notices
    meaning: The notice of cancellation for nonpayment is mailed.
    grain: One row per notice.
    distinguish_by: [notice_date]
    fields:
      policy_id: Policy.
      notice_date: Date mailed.
      effective_date: Cancellation date unless paid.
      amount_due: Past-due premium demanded.
    triggers:
      - event: insurance:insurance_nonpayment_pending
        map: {pending_cancel_date: effective_date}
  - type: insurance_renewal_offer
    target: insurance_notices
    meaning: The renewal offer for the next term is issued.
    grain: One row per term offered.
    distinguish_by: [effective_date]
    fields:
      policy_id: Policy.
      notice_date: Date issued.
      effective_date: First day of the offered term.
      renewal_premium: Annual premium offered.
    triggers: []
  - type: insurance_nonrenewal_notice
    target: insurance_notices
    meaning: The carrier's notice that it will not renew the policy is mailed.
    grain: One row per notice.
    distinguish_by: [notice_date]
    fields:
      policy_id: Policy.
      notice_date: Date mailed.
      effective_date: Last day of coverage (the expiration date).
      notice_reason: Reason given for non-renewal.
    triggers: []

measures:
  - id: insurance_msr_total_discount_pct
    window: The policy's rating facts on the quote, renewal or endorsement date.
    measure: Sum of the discounts that apply — claims_free_discount_pct when paid_claims_count shows no paid claim in claims_free_years, protective_device_discount_pct when a monitored alarm is on file, paid_in_full_discount_pct on the annual plan — capped at max_total_discount_pct.
  - id: insurance_msr_age_factor_pct
    window: The home's age band on the quote or renewal date (the rating year less home_model_year).
    measure: The percent shown for that band in age_rating_ladder.
  - id: insurance_msr_days_in_force
    window: From the effective date of the current term to the cancellation or endorsement date.
    measure: Calendar days of coverage used in the term, counting the effective date and not the cancellation date.

policies:
  - id: insurance_agg_multi_holding
    subject: [insurance_quote]
    rule: >-
      The agency insures the one home a customer lives in on a Hearthstone site, so a customer may hold one open policy or quote at a time.
      The customer has no other policy in quoted, bound, in_force or pending_cancellation status.
    eligibility:
      - id: single_open_policy
        applies_to: [insurance_quote]
        kind: dedup
        condition: The customer has no other policy in quoted, bound, in_force or pending_cancellation status.
        evidence_fields: [insurance_policies.customer_id, insurance_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.customer_id]
          action_bindings:
            insurance_policies.customer_id: customer_id
        dedup_contract:
          table: insurance_policies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [quoted, bound, in_force, pending_cancellation]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: insurance_underwriting
    subject: [insurance_quote, insurance_bind, insurance_quote_expiry, insurance_inception]
    rule: >-
      The agency writes policies only on homes that sit on a Hearthstone site under an approved or active lease held by the applicant.
      The home must meet the form's entry gate (home age, tie-downs, claims history), the dwelling limit must lie between min_dwelling_coverage and max_dwelling_coverage, and the roof may be no older than roof_age_max_years.
      Holding a Hearthstone Home Finance loan changes the minimum: when Hearthstone Home Finance is named loss payee the dwelling limit must be at least the loan's unpaid principal (required by the loan) even if that exceeds the form's usual minimum.
      A quote may be bound only within quote_valid_days counted from the quote date.
      The validity window is counted in calendar days starting the day after the quote date, and a quote may be bound on the last day.
      Coverage begins on the effective date stated at binding, never earlier than the binding date. Binding is the applicant's own act — signing the application and paying the first installment (the whole premium on the annual plan, down_payment_pct_monthly_eft percent on the monthly EFT plan, half on the semi-annual plan) unless billed to the loan escrow.
    eligibility:
      - id: quote_still_valid
        applies_to: [insurance_bind]
        kind: time
        condition: A quote may be bound only within quote_valid_days counted from the quote date.
        evidence_fields: [insurance_policies.policy_id, insurance_policies.quoted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.policy_id]
          action_bindings:
            insurance_policies.policy_id: policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the quote date
          anchor_source: insurance_policies.quoted_date
          relation: not_after
          duration_source: variants.quote_valid_days
          unit: calendar_days
          counting_rule: The validity window is counted in calendar days starting the day after the quote date, and a quote may be bound on the last day.
          boundary: inclusive

  - id: insurance_premium_rating
    subject: [insurance_quote, insurance_renewal, insurance_endorsement]
    rule: >-
      The annual premium is the dwelling limit divided by 1,000 times base_rate_per_1000_dwelling, adjusted by the home's age band in age_rating_ladder (insurance_msr_age_factor_pct), then reduced by the applicable discounts (insurance_msr_total_discount_pct), rounded to the nearest whole dollar (premium_rounding).
      Discounts add together and their total never exceeds max_total_discount_pct; a discount not earned is not applicable rather than zero-rated.
      Windstorm and hurricane losses at the Florida communities carry the named-storm deductible listed for the community in named_storm_deductible_pct (percent of the dwelling limit) in place of the all-other-perils deductible; elsewhere the all-other-perils deductible applies to every peril.
      A renewal is re-rated on the renewal date with the home's then-current age band and claims history.
    eligibility: []
    params:
      named_storm_deductible_pct:
        Willow Bend Estates: 2.0
        Palmetto Shores: 2.0
        Saguaro Vista: not_applicable
        Bluebonnet Ridge: not_applicable
        Cedar Hollow: not_applicable
        Conestoga Meadows: not_applicable
      per_tier:
        Manufactured Home Basic Form - Actual Cash Value: {base_rate_per_1000_dwelling: =base_rate_per_1000_dwelling, max_total_discount_pct: =max_total_discount_pct}
        Manufactured Home Basic Form - Replacement Cost: {base_rate_per_1000_dwelling: =base_rate_per_1000_dwelling, max_total_discount_pct: =max_total_discount_pct}
        Manufactured Home Broad Form - Actual Cash Value: {base_rate_per_1000_dwelling: =base_rate_per_1000_dwelling, max_total_discount_pct: =max_total_discount_pct}
        Manufactured Home Broad Form - Replacement Cost: {base_rate_per_1000_dwelling: =base_rate_per_1000_dwelling, max_total_discount_pct: =max_total_discount_pct}
        Manufactured Home Special Form - Replacement Cost: {base_rate_per_1000_dwelling: =base_rate_per_1000_dwelling, max_total_discount_pct: =max_total_discount_pct}
        Manufactured Home Special Form Plus - Extended Replacement Cost: {base_rate_per_1000_dwelling: =base_rate_per_1000_dwelling, max_total_discount_pct: =max_total_discount_pct}
    measures: [insurance_msr_age_factor_pct, insurance_msr_total_discount_pct]
    formula:
      annual_premium: round(dwelling_coverage / 1000 * base_rate_per_1000_dwelling * (1 + insurance_msr_age_factor_pct / 100) * (1 - insurance_msr_total_discount_pct / 100), 0)

  - id: insurance_billing_terms
    subject: [insurance_premium_installment, insurance_policy_fee, insurance_installment_fee, insurance_payment, insurance_escrow_remittance, insurance_account_change]
    rule: >-
      The policy_fee is charged once per term when the term is bound or renewed and is fully earned.
      On the annual plan the whole premium is one installment due on the effective date; on the semi-annual plan two equal installments are due on the effective date and six months later, each with the semiannual_installment_fee; on the monthly EFT plan the first installment is down_payment_pct_monthly_eft percent of the premium and the rest is spread over the remaining ten monthly drafts, each with the monthly_eft_installment_fee; each installment is rounded half up to the cent and the last absorbs any difference.
      On the loan_escrow plan, available only when Hearthstone Home Finance is loss payee and the loan is escrowed, the whole term premium is billed to the escrow and remitted by Hearthstone Home Finance; no installment fee applies.
      Payments are applied to the oldest installment first through the accepted_payment_channels.
      The loss payee and payment plan may be changed only on a policy that is in_force; a plan change takes effect from the next installment.
    eligibility:
      - id: account_change_in_force
        applies_to: [insurance_account_change]
        kind: state
        condition: The loss payee and payment plan may be changed only on a policy that is in_force; a plan change takes effect from the next installment.
        evidence_fields: [insurance_policies.policy_id, insurance_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.policy_id]
          action_bindings:
            insurance_policies.policy_id: policy_id
        state_contract:
          field: insurance_policies.status
          allowed: [in_force]

  - id: insurance_nonpayment_terms
    subject: [insurance_cancellation_notice, insurance_nonpayment_pending, insurance_payment_cure, insurance_cancel_nonpayment, insurance_reinstatement, insurance_payment_return]
    rule: >-
      When an installment remains unpaid nonpayment_grace_days after its due date, the notice of cancellation for nonpayment is mailed with a cancellation date nonpayment_notice_days after mailing, demanding the past-due premium.
      Paying the whole past-due amount before the cancellation date keeps the policy in force; otherwise coverage ends on the cancellation date and a lienholder named as loss payee is notified.
      A policy cancelled for nonpayment may be reinstated only within reinstatement_window_days counted from the cancellation date.
      The reinstatement window is counted in calendar days starting the day after the cancellation date, and payment received on the last day reinstates the policy.
      Reinstatement requires all past-due premium and leaves a gap: losses between the cancellation date and the reinstatement date are not covered.
      A returned premium payment is charged back for the returned amount against that payment and treated as unpaid from its due date.
    eligibility:
      - id: reinstatement_window
        applies_to: [insurance_reinstatement]
        kind: time
        condition: A policy cancelled for nonpayment may be reinstated only within reinstatement_window_days counted from the cancellation date.
        evidence_fields: [insurance_policies.policy_id, insurance_policies.ended_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.policy_id]
          action_bindings:
            insurance_policies.policy_id: policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation date
          anchor_source: insurance_policies.ended_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: The reinstatement window is counted in calendar days starting the day after the cancellation date, and payment received on the last day reinstates the policy.
          boundary: inclusive

  - id: insurance_cancellation_terms
    subject: [insurance_cancel_request, insurance_return_premium, insurance_refund_issued]
    rule: >-
      Cancelling is the insured's own act, effective no earlier than the date of the request.
      A cancellation effective within free_look_days of the effective date returns all premium paid except the policy fee.
      Otherwise the unearned premium is computed pro rata on the days remaining in the term (insurance_msr_days_in_force), less short_rate_penalty_pct percent of that unearned amount, and the premium retained is never less than minimum_earned_premium.
      A cancellation by the carrier, including non-renewal mid-term, returns unearned premium pro rata without penalty.
      A credit balance left after return premium is refunded to whoever paid it — the insured, or the Hearthstone Home Finance escrow when it paid the premium.
    eligibility: []
    measures: [insurance_msr_days_in_force]
    formula:
      unearned_pro_rata: round(annual_premium * (365 - insurance_msr_days_in_force) / 365, 2)
      short_rate_return: min(round(unearned_pro_rata * (1 - short_rate_penalty_pct / 100), 2), annual_premium - minimum_earned_premium)

  - id: insurance_renewal_terms
    subject: [insurance_renewal_offer, insurance_renewal, insurance_expiration, insurance_nonrenewal_notice, insurance_nonrenewal]
    rule: >-
      The renewal offer is issued renewal_offer_days before the expiration date at the re-rated premium, and the renewal takes effect when the first installment of the new term is paid on or before the expiration date; otherwise the policy expires.
      The carrier non-renews when paid claims in the claims_lookback_years reach claims_nonrenewal_count (paid_claims_count), or when the home no longer meets the form's entry gate, with notice at least nonrenewal_notice_days before expiration; a policy with less notice renews once more.
      A non-renewed or expired policy ends at the expiration date, and a Hearthstone Home Finance loss payee is notified.
    eligibility: []

  - id: insurance_endorsement_terms
    subject: [insurance_endorsement, insurance_endorsement_premium, insurance_return_premium]
    rule: >-
      Limits and deductibles may be changed mid-term only on a policy that is in_force.
      The premium change is the difference between the annual premiums before and after, pro rata on the days remaining in the term (mid_term_change_basis); an increase is charged as endorsement premium and a decrease credited as return premium, each rounded half up to the cent.
      While Hearthstone Home Finance is loss payee the dwelling limit may not be lowered below the loan's unpaid principal.
      Claims are reported to and adjusted by the carrier (claims_handled_by_agency is false); the resident desk records no claim and promises no claim outcome, and claim questions go to a human representative.
    eligibility:
      - id: endorsement_in_force
        applies_to: [insurance_endorsement]
        kind: state
        condition: Limits and deductibles may be changed mid-term only on a policy that is in_force.
        evidence_fields: [insurance_policies.policy_id, insurance_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.policy_id]
          action_bindings:
            insurance_policies.policy_id: policy_id
        state_contract:
          field: insurance_policies.status
          allowed: [in_force]
