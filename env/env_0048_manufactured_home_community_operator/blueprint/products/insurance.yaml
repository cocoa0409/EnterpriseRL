# Manufactured Home Insurance charter — Hearthstone Insurance Agency (licensed agency placing
# manufactured-home policies with its partner carrier). Annual policies on the resident's home,
# priced per $1,000 of dwelling coverage by policy form, billed annually, semi-annually or monthly
# by EFT, or through the Hearthstone Home Finance escrow.

category: insurance
display_name: Manufactured Home Insurance

binding:
  holding_table: insurance_policies
  event_tables: [insurance_transactions, insurance_notices]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_receivable}

lifecycle:
  states: [quoted, bound, in_force, pending_cancellation, cancelled, expired, non_renewed]
  transitions:
    - {from: quoted, to: bound, by: user, means: "The resident accepts the quote, signs the application and pays the first installment."}
    - {from: quoted, to: expired, by: system, means: "The quote lapses unbound after its validity period."}
    - {from: bound, to: in_force, by: system, means: "Coverage begins on the effective date."}
    - {from: in_force, to: pending_cancellation, by: system, means: "A premium installment is past due and the notice of cancellation for nonpayment is mailed."}
    - {from: pending_cancellation, to: in_force, by: system, means: "The past-due premium is paid before the cancellation date."}
    - {from: pending_cancellation, to: cancelled, by: system, means: "The cancellation date passes unpaid and coverage ends."}
    - {from: cancelled, to: in_force, by: system, means: "A policy cancelled for nonpayment is reinstated within the reinstatement window."}
    - {from: in_force, to: cancelled, by: user, means: "The insured asks to cancel the policy."}
    - {from: in_force, to: expired, by: system, means: "The term ends without the renewal being accepted."}
    - {from: in_force, to: non_renewed, by: system, means: "The carrier declines to renew and the term ends."}

accounts:
  - key: premium_receivable
    unit: USD
    meaning: Amount the insured owes on the policy — premium installments, policy fees, installment fees, endorsement premium and refunds issued, less payments, escrow remittances and return premium.

parameter_schema:
  perils_form: Covered-perils form of the dwelling coverage — basic (named fire, lightning, windstorm, hail, explosion, smoke), broad (basic plus falling objects, weight of snow, water discharge, freezing) or special (all risks of direct physical loss not excluded), enum.
  dwelling_valuation: How a dwelling loss is valued — actual_cash_value, replacement_cost or extended_replacement_cost, enum.
  extended_replacement_pct: Most the carrier pays on a dwelling loss as a percentage of the dwelling limit under extended replacement cost, percent; not_applicable otherwise.
  base_rate_per_1000_dwelling: Annual base premium per $1,000 of dwelling coverage before age rating and discounts, USD.
  min_dwelling_coverage: Smallest dwelling limit written, USD.
  max_dwelling_coverage: Largest dwelling limit written without referral to the carrier, USD.
  personal_property_pct_of_dwelling: Personal property limit as a percentage of the dwelling limit, percent.
  personal_property_valuation: How a personal property loss is valued — actual_cash_value or replacement_cost, enum.
  other_structures_pct: Limit for sheds, carports and decks as a percentage of the dwelling limit, percent.
  loss_of_use_pct: Additional living expense limit as a percentage of the dwelling limit, percent.
  debris_removal_pct: Additional debris-removal limit as a percentage of the dwelling limit, percent.
  liability_limit_options: Personal liability limits that may be chosen, list of USD amounts.
  medical_payments_limit: Medical payments to others per person, USD.
  aop_deductible_options: All-other-perils deductibles that may be chosen, list of USD amounts.
  water_backup_limit: Sewer and drain backup coverage limit, USD (0.00 where not included).
  equipment_breakdown_included: Whether breakdown of home systems and appliances is covered, boolean.
  age_rating_ladder: Premium adjustment by home age band in years (application year less model year), mapping of band to percent (negative is a credit).
  claims_free_discount_pct: Discount when the insured has had no paid claim in the claims-free lookback, percent.
  claims_free_years: Lookback for the claims-free discount, integer years.
  protective_device_discount_pct: Discount for a monitored smoke and fire alarm, percent.
  paid_in_full_discount_pct: Discount when the annual premium is paid in full at the start of the term, percent.
  max_total_discount_pct: Cap on the sum of all discounts on one policy, percent.
  premium_rounding: Rounding of the annual premium — nearest_whole_dollar, enum.
  amount_rounding: Rounding of installments, fees and refunds — half_up_to_cent, enum.
  policy_fee: Fully earned policy fee charged each term, USD.
  payment_plan_options: Payment plans offered, list.
  semiannual_installment_fee: Fee added to each semi-annual installment, USD.
  monthly_eft_installment_fee: Fee added to each monthly EFT installment, USD.
  down_payment_pct_monthly_eft: First payment at binding on the monthly EFT plan, percent of annual premium.
  escrow_billing_available: Whether the premium may be billed annually to a Hearthstone Home Finance escrow, boolean.
  quote_valid_days: Calendar days a quote may be bound at its quoted premium, integer days.
  free_look_days: Calendar days after the effective date within which an insured cancellation receives a full refund of premium paid (the policy fee excepted), integer days.
  short_rate_penalty_pct: Penalty deducted from the pro-rata unearned premium when the insured cancels after the free-look period, percent of unearned premium.
  minimum_earned_premium: Least premium retained on an insured cancellation after the free-look period, USD.
  nonpayment_grace_days: Calendar days after an installment due date before the notice of cancellation for nonpayment is mailed, integer days.
  nonpayment_notice_days: Calendar days between mailing the notice of cancellation for nonpayment and the cancellation date, integer days.
  reinstatement_window_days: Calendar days after a nonpayment cancellation within which the policy may be reinstated by paying all past-due premium, integer days.
  renewal_offer_days: Calendar days before expiration on which the renewal offer is issued, integer days.
  nonrenewal_notice_days: Fewest calendar days of notice before expiration when the carrier will not renew, integer days.
  claims_nonrenewal_count: Paid claims within the claims lookback at which the carrier non-renews, integer.
  claims_lookback_years: Lookback for the claims non-renewal rule, integer years.
  roof_age_max_years: Oldest roof accepted, years; for replacement-cost forms an older roof is settled at actual cash value, integer years.
  tie_downs_required: Whether the home must be anchored with tie-downs meeting the community's wind-zone standard, boolean.
  mid_term_change_basis: How premium changes from a mid-term endorsement are computed — pro_rata, enum.
  policy_term_months: Length of the policy term, integer months.
  loss_payee_supported: Whether a lienholder may be named loss payee, boolean.
  accepted_payment_channels: Channels through which premium is paid by the insured, list of channel codes.
  claims_handled_by_agency: Whether the agency adjusts claims itself (claims are reported to and adjusted by the carrier), boolean.

