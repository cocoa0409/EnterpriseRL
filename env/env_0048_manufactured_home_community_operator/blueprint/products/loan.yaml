# Home Purchase Financing charter — Hearthstone Home Finance, LLC (NMLS-licensed affiliate).
# Home-only (chattel) retail installment loans secured by the manufactured home itself, for homes
# that sit on a Hearthstone home site. Fixed rate, level monthly principal-and-interest
# installments, interest earned monthly on the unpaid principal, hazard-insurance escrow.

category: loan
display_name: Home Purchase Financing

binding:
  holding_table: loan_holdings
  event_tables: [loan_transactions, loan_notices]
  intake_tables: [loan_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: loan_principal, escrow_balance: loan_escrow, fees_balance: loan_fees_due, suspense_balance: loan_suspense}

lifecycle:
  states: [applied, approved, active, delinquent, paid_off, charged_off, declined, withdrawn]
  transitions:
    - {from: applied, to: approved, by: system, means: "Underwriting approves the loan and issues the commitment at the locked rate."}
    - {from: applied, to: declined, by: system, means: "Underwriting declines the application and the adverse-action notice is sent."}
    - {from: applied, to: withdrawn, by: user, means: "The applicant withdraws the application before a decision."}
    - {from: approved, to: withdrawn, by: user, means: "The approved applicant does not sign the retail installment contract, or the commitment expires unsigned."}
    - {from: approved, to: active, by: system, means: "The borrower has signed the retail installment contract and the loan is funded to the seller."}
    - {from: active, to: delinquent, by: system, means: "The oldest unpaid installment reaches the delinquency threshold."}
    - {from: delinquent, to: active, by: system, means: "Enough is paid that no installment remains past the delinquency threshold."}
    - {from: active, to: paid_off, by: system, means: "The payoff amount is received in full and the lien is released."}
    - {from: delinquent, to: paid_off, by: system, means: "A delinquent loan is paid off in full."}
    - {from: delinquent, to: charged_off, by: system, means: "The loan reaches the charge-off threshold and the remaining principal is written off."}

accounts:
  - key: loan_principal
    unit: USD
    meaning: Unpaid principal of the loan — the amount financed at funding, less the principal portions of installments, curtailments and payoff, plus principal restored by returned payments, less any charge-off.
  - key: loan_escrow
    unit: USD
    meaning: Funds held in the hazard-insurance escrow — escrow portions of installments, less premiums disbursed to the insurer, surplus refunds and reversals of returned payments (negative when the servicer has advanced a premium).
  - key: loan_fees_due
    unit: USD
    meaning: Fees the borrower owes on the loan — late charges, returned-payment fees and deferment fees, less fee payments and waivers.
  - key: loan_suspense
    unit: USD
    meaning: Partial payments held unapplied until together they equal one full installment.

parameter_schema:
  term_months: Number of monthly installments in the contract, integer.
  note_rate_pct: Annual fixed note rate before any autopay reduction, percent.
  autopay_rate_reduction_pct: Reduction in the note rate when automatic ACH payment is elected at closing, percentage points.
  min_down_payment_pct: Smallest down payment, as a percentage of the purchase price, percent.
  min_loan_amount: Smallest amount financed, USD.
  max_loan_amount: Largest amount financed (including financed fees), USD.
  max_debt_to_income_pct: Largest ratio of total monthly debt payments (including the new installment, site rent and escrow) to gross monthly income, percent.
  origination_fee_pct: Origination fee as a percentage of the purchase price less down payment, financed into the loan, percent.
  documentation_fee: Contract documentation and title-lien filing fee, financed into the loan, USD.
  rate_lock_days: Calendar days from the application date for which the note rate is locked, integer days.
  commitment_expiry_days: Calendar days from approval within which the contract must be signed and funded, integer days.
  first_payment_min_days: Fewest calendar days between the funding date and the first installment due date, integer days.
  payment_due_day_options: Days of the month a borrower may choose as the installment due day, list of integers.
  interest_method: How interest is earned — monthly_on_unpaid_principal means each installment's interest is the unpaid principal times the note rate divided by 12, enum.
  per_diem_basis: Day basis for interest between installment due dates used in a payoff — actual_over_365, enum.
  amount_rounding: Rounding applied to every computed amount — half_up_to_cent, enum.
  late_charge_grace_days: Calendar days after the installment due date before a late charge may be assessed, integer days.
  late_charge_pct_of_installment: Late charge as a percentage of the principal-and-interest part of the late installment, percent.
  late_charge_min: Floor of one late charge, USD.
  late_charge_max: Cap of one late charge, USD.
  courtesy_late_charge_waivers_per_12_months: Number of late charges that may be waived as a courtesy in any trailing 12 months, integer.
  nsf_fee: Fee for a payment returned for a fee-bearing reason, USD.
  accepted_payment_channels: Channels through which installments and fees are accepted, list of channel codes.
  card_payments_accepted: Whether debit or credit card payments are accepted on the loan, boolean.
  partial_payment_handling: What happens to a payment smaller than one full installment — held_in_suspense, enum.
  payment_application_order: Order in which a payment is applied, ordered list of buckets.
  min_curtailment_amount: Smallest extra principal payment accepted as a curtailment, USD.
  escrow_required: Whether hazard-insurance premiums must be escrowed on this program, boolean.
  escrow_cushion_months: Cushion kept in the escrow, as months of projected disbursements, number of months.
  escrow_analysis_interval_months: Months between escrow analyses, integer months.
  escrow_shortage_spread_months: Number of monthly installments over which an escrow shortage is spread, integer.
  escrow_surplus_refund_threshold: Smallest escrow surplus refunded in cash after an analysis; a smaller surplus is credited to next year's escrow, USD.
  escrow_surplus_refund_days: Calendar days after the analysis within which a refundable surplus is paid, integer days.
  required_coverage_basis: Minimum dwelling coverage the hazard policy must carry — not_less_than_unpaid_principal, enum.
  lapse_first_notice_days: Fewest calendar days between the first lapse notice and the earliest date a lender-placed premium may be charged, integer days.
  lapse_second_notice_days: Fewest calendar days between the reminder lapse notice and the earliest date a lender-placed premium may be charged, integer days.
  force_placed_refund_days: Calendar days after proof of the borrower's own coverage within which lender-placed premium for any overlapping period is refunded, integer days.
  deferment_available: Whether installment deferments are offered on this program, boolean.
  deferment_max_months_per_request: Most installments one deferment may move to the end of the loan, integer; not_applicable where deferment is unavailable.
  deferments_per_12_months: Most deferments in any trailing 12 months, integer; not_applicable where deferment is unavailable.
  deferment_lifetime_max_months: Most installments deferred over the life of the loan, integer; not_applicable where deferment is unavailable.
  deferment_min_installments_paid: Installments that must have been paid since funding before a deferment, integer; not_applicable where deferment is unavailable.
  deferment_max_days_past_due: Most days the oldest unpaid installment may be past due when a deferment is granted, integer days; not_applicable where deferment is unavailable.
  deferment_fee: Fee charged when a deferment agreement is signed, USD; not_applicable where deferment is unavailable.
  due_date_change_lifetime_max: Most times the installment due day may be changed over the life of the loan, integer.
  due_date_change_min_installments_paid: Installments that must have been paid since funding before the due day may be changed, integer.
  payoff_statement_fee: Fee for a payoff statement, USD.
  payoff_statement_business_days: Business days within which a requested payoff statement is issued, integer business days.
  payoff_good_through_days: Calendar days after the statement date through which a payoff figure is good, integer days.
  prepayment_penalty_applies: Whether paying the loan off or paying extra principal early incurs a penalty, boolean.
  lien_release_days: Calendar days after payoff within which the lien on the home's title is released, integer days.
  delinquency_days: Days past due at which the oldest unpaid installment makes the loan delinquent, integer days.
  right_to_cure_notice_days: Days past due at which the right-to-cure notice is sent, integer days.
  right_to_cure_period_days: Calendar days after the right-to-cure notice date within which the borrower may cure, integer days.
  credit_reporting_days: Days past due at which a delinquency is reported to the credit bureaus, integer days.
  charge_off_days: Days past due at which a delinquent loan is charged off, integer days.

