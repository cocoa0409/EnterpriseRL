# RV & Boat Storage charter — Hearthstone Communities.
# Residents rent a numbered space in the community's fenced storage yard for an RV, boat or
# trailer (home sites may not be used to store them). Month-to-month rental, billed on the 1st.

category: storage
display_name: RV & Boat Storage

binding:
  holding_table: storage_rentals
  event_tables: [storage_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {storage_balance: storage_receivable, deposit_balance: storage_deposits}

lifecycle:
  states: [reserved, active, past_due_lockout, notice_to_vacate, closed]
  transitions:
    - {from: reserved, to: active, by: system, means: "The resident moves the unit into the reserved space and the rental starts."}
    - {from: reserved, to: closed, by: user, means: "The resident cancels the reservation before moving in."}
    - {from: active, to: past_due_lockout, by: system, means: "Rent remains unpaid past the lockout threshold and gate access is suspended."}
    - {from: past_due_lockout, to: active, by: system, means: "The full past-due balance is paid and gate access is restored."}
    - {from: active, to: notice_to_vacate, by: user, means: "The resident gives notice to vacate the space on a stated date."}
    - {from: notice_to_vacate, to: active, by: user, means: "The resident withdraws the notice before the vacate date."}
    - {from: notice_to_vacate, to: closed, by: system, means: "The unit is removed and the space surrendered on the vacate date."}
    - {from: past_due_lockout, to: closed, by: system, means: "The rental is terminated after the lien process for an unpaid balance."}

accounts:
  - key: storage_receivable
    unit: USD
    meaning: Amount the resident owes on the storage rental — rent, electric hookup fees, late fees and one-time fees, less payments and credits.
  - key: storage_deposits
    unit: USD
    meaning: Reservation and security deposits held for the rental, less deposits applied or refunded.

parameter_schema:
  monthly_rent: Monthly rent for the space, USD per month.
  rent_due_day: Day of the month rent is due, integer day of month.
  move_in_proration_basis: How rent for the move-in month is charged — actual_days_in_month, enum.
  move_out_proration: How rent for the move-out month is charged — none (the full month is due, no partial-month refund), enum.
  late_fee_grace_days: Calendar days after the due day before the first late fee, integer days.
  first_late_fee: First late fee on a month's unpaid rent, USD.
  second_late_fee_day: Day of the month on which a second late fee is charged if that month's rent is still unpaid, integer day of month.
  second_late_fee: Second late fee on a month's unpaid rent, USD.
  lockout_days_past_due: Days after the due day at which gate access is suspended when that month's rent is unpaid, integer days.
  lockout_release_requires_full_balance: Whether gate access is restored only on payment of the whole past-due balance including fees, boolean.
  lien_notice_days_past_due: Days past due at which the preliminary lien notice is sent, integer days.
  nsf_fee: Fee for a returned payment, USD.
  admin_fee: One-time administration fee charged at move-in, USD.
  security_deposit: Refundable security deposit collected at move-in, USD.
  reservation_deposit: Deposit that holds a reserved space, USD.
  reservation_hold_days: Calendar days a reservation holds the space before move-in must occur, integer days.
  reservation_deposit_applied: Whether the reservation deposit is applied to the first month's rent at move-in, boolean.
  reservation_refund_days: Calendar days after reserving within which a cancellation refunds the reservation deposit, integer days.
  notice_to_vacate_days: Fewest calendar days between notice to vacate and the vacate date, integer days.
  autopay_discount_monthly: Monthly credit while rent is paid by automatic ACH, USD per month.
  prepay_options_months: Prepayment terms offered, list of integers (months).
  prepay_6_month_discount_pct: Discount on rent prepaid for 6 months, percent.
  prepay_12_month_discount_pct: Discount on rent prepaid for 12 months, percent.
  second_space_discount_pct: Discount on the rent of a customer's second storage space, percent.
  residents_only: Whether storage is rented only to holders of an active Hearthstone site lease in the same community, boolean.
  proof_of_insurance_required: Whether current insurance on the stored unit must be on file, boolean.
  current_registration_required: Whether the stored unit must carry current registration, boolean.
  operable_unit_required: Whether the stored unit must be operable or road-towable, boolean.
  electric_hookup_available: Whether a 30-amp maintenance outlet is available at the space, boolean.
  electric_hookup_fee_monthly: Monthly fee for using the electric hookup, USD per month; not_applicable where unavailable.
  dump_station_access: Whether the rental includes use of the RV dump station, boolean.
  wash_rack_access: Whether the rental includes use of the wash rack, boolean.
  gate_access_hours: Daily hours the storage gate opens to renters, string HH:MM-HH:MM.
  access_card_replacement_fee: Fee for replacing a lost gate card, USD.
  rate_increase_notice_days: Fewest calendar days of written notice before a rent increase takes effect, integer days.
  rate_increase_cap_pct: Largest increase one rate notice may apply, percent of current rent.
  rate_lock_months: Months after move-in during which rent is not increased, integer months.
  space_transfer_fee: Fee for moving to a different space, USD.
  cleanout_fee: Fee when debris or property is left in the space at move-out, USD.
  deposit_refund_days: Calendar days after move-out within which the security deposit is refunded, integer days.
  sublet_allowed: Whether a space may be sublet or used for a non-household unit, boolean.
  max_unit_length_ft: Longest unit (including tongue and bumper attachments) the space accepts, feet.
  clearance_height_ft: Overhead clearance of the space, feet; not_applicable for open spaces.
  enclosed_lock_required: Whether the renter must supply their own lock for the unit door, boolean.
  amount_rounding: Rounding applied to every computed charge and credit — half_up_to_cent, enum.
  accepted_payment_channels: Channels through which storage rent and fees are paid, list of channel codes.
  rent_charge_basis: Period rent covers — calendar_month, enum.
  prepay_refund_on_vacate: How unused prepaid months are handled on move-out — recompute_discount_refund_unused_months (the prepay discount is recomputed for the months actually used and unused whole months are refunded), enum.

