events:
  - type: storage_reservation
    target: storage_rentals
    mutation: create
    meaning: A resident reserves a numbered storage space for a described unit and pays the reservation deposit.
    grain: One row per space rental.
    fields:
      customer_id: The renter.
      lease_id: The renter's site lease in the same community.
      variant_name: Space class.
      space_number: Space number as posted in the yard (for example RV-23).
      unit_type: Kind of unit stored.
      unit_length_ft: Overall length of the unit in feet.
      unit_plate: License plate or hull registration of the unit, as on its registration.
      reserved_date: Date reserved.
    triggers:
      - event: storage:storage_deposit_receipt
        map: {entry_date: reserved_date, deposit_kind: reservation}
  - type: storage_reservation_cancel
    target: storage_rentals
    mutation: {transition: {from: reserved, to: closed}}
    meaning: The resident cancels the reservation before moving in.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Date of cancellation.
    triggers:
      - event: storage:storage_deposit_disposition
        map: {entry_date: closed_date, deposit_kind: reservation}
  - type: storage_move_in
    target: storage_rentals
    mutation: {transition: {from: reserved, to: active}}
    meaning: The unit is moved into the space and the rental starts.
    grain: One row per transaction.
    fields:
      status: Set to active.
      rental_start_date: Move-in date.
      monthly_rent: Rent for the space.
    triggers:
      - event: storage:storage_rent_charge
        map: {entry_date: rental_start_date}
      - event: storage:storage_fee_charge
        map: {entry_date: rental_start_date, fee_type: admin_fee}
      - event: storage:storage_deposit_receipt
        map: {entry_date: rental_start_date, deposit_kind: security}
  - type: storage_lockout
    target: storage_rentals
    mutation: {transition: {from: active, to: past_due_lockout}}
    meaning: Gate access is suspended for unpaid rent.
    grain: One row per transaction.
    fields:
      status: Set to past_due_lockout.
    triggers: []
  - type: storage_lockout_release
    target: storage_rentals
    mutation: {transition: {from: past_due_lockout, to: active}}
    meaning: The past-due balance is paid in full and gate access is restored.
    grain: One row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: storage_notice_to_vacate
    target: storage_rentals
    mutation: {transition: {from: active, to: notice_to_vacate}}
    meaning: The resident gives notice to vacate the space.
    grain: One row per transaction.
    fields:
      status: Set to notice_to_vacate.
      vacate_date: Vacate date stated.
    triggers: []
  - type: storage_notice_rescission
    target: storage_rentals
    mutation: {transition: {from: notice_to_vacate, to: active}}
    meaning: The resident withdraws a notice to vacate before the vacate date.
    grain: One row per transaction.
    fields:
      status: Set to active.
      vacate_date: Cleared.
    triggers: []
  - type: storage_move_out
    target: storage_rentals
    mutation: {transition: {from: notice_to_vacate, to: closed}}
    meaning: The unit is removed and the space surrendered.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Date surrendered.
    triggers:
      - event: storage:storage_deposit_disposition
        map: {entry_date: closed_date, deposit_kind: security}
  - type: storage_lien_closeout
    target: storage_rentals
    mutation: {transition: {from: past_due_lockout, to: closed}}
    meaning: The rental ends after the lien process for an unpaid balance.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Date the rental ended.
    triggers:
      - event: storage:storage_deposit_disposition
        map: {entry_date: closed_date, deposit_kind: security}
  - type: storage_space_transfer
    target: storage_rentals
    mutation: update
    meaning: The renter moves to a different space, possibly of a different class.
    grain: One row per transaction.
    fields:
      space_number: New space number.
      variant_name: Class of the new space.
      monthly_rent: Rent of the new space.
    triggers:
      - event: storage:storage_fee_charge
        map: {fee_type: space_transfer}
  - type: storage_rate_change
    target: storage_rentals
    mutation: update
    meaning: A noticed rent increase takes effect.
    grain: One row per transaction.
    fields:
      monthly_rent: New rent.
    triggers: []
  - type: storage_option_change
    target: storage_rentals
    mutation: update
    meaning: The renter enrolls in or cancels autopay or the electric hookup.
    grain: One row per transaction.
    fields:
      autopay_enrolled: Autopay state after the change.
      electric_hookup_enrolled: Electric hookup state after the change.
    triggers: []

  - type: storage_rent_charge
    target: storage_ledger
    meaning: Rent for one month is charged (prorated in the move-in month).
    grain: One row per rental per month.
    distinguish_by: [billing_period]
    fields:
      storage_id: Rental charged.
      billing_period: Month charged, YYYY-MM.
      entry_date: Due date (move-in date for the move-in month).
      days_billed: Days charged.
      days_in_period: Calendar days in the month.
      amount: Rent, positive.
    account: storage_receivable
    direction: in
    triggers: []
  - type: storage_electric_fee
    target: storage_ledger
    meaning: The monthly electric hookup fee is charged.
    grain: One row per rental per month.
    distinguish_by: [billing_period]
    fields:
      storage_id: Rental charged.
      billing_period: Month charged.
      entry_date: Due date.
      amount: Fee, positive.
    account: storage_receivable
    direction: in
    triggers: []
  - type: storage_late_fee
    target: storage_ledger
    meaning: A late fee is charged on a month's unpaid rent — the first after the grace period or the second on the second late-fee day.
    grain: One row per rental per month per late-fee stage.
    distinguish_by: [billing_period, late_fee_stage]
    fields:
      storage_id: Rental charged.
      billing_period: Month whose rent is late.
      entry_date: Date posted.
      late_fee_stage: First or second late fee.
      amount: Fee, positive.
    account: storage_receivable
    direction: in
    triggers: []
  - type: storage_fee_charge
    target: storage_ledger
    meaning: A one-time fee is charged — administration, gate-card replacement, space transfer, cleanout or returned payment.
    grain: One row per fee type per date.
    distinguish_by: [fee_type, entry_date]
    fields:
      storage_id: Rental charged.
      entry_date: Date charged.
      fee_type: Fee charged.
      source_entry_id: The returned payment, for a returned-payment fee; empty otherwise.
      amount: Fee, positive.
    account: storage_receivable
    direction: in
    triggers: []
  - type: storage_payment
    target: storage_ledger
    meaning: A payment toward the storage rental is received, including a prepayment of several months.
    grain: One row per payment.
    distinguish_by: [payment_ref]
    fields:
      storage_id: Rental credited.
      entry_date: Date received.
      amount: Payment, positive.
      payment_channel: Channel used.
      payment_ref: Serial number or confirmation number of the payment.
    account: storage_receivable
    direction: out
    triggers: []
  - type: storage_payment_return
    target: storage_ledger
    meaning: A payment is returned unpaid by the bank and charged back.
    grain: One row per returned payment.
    distinguish_by: [source_entry_id]
    fields:
      storage_id: Rental charged back.
      entry_date: Date of return.
      source_entry_id: The payment returned.
      amount: Amount charged back, positive.
    account: storage_receivable
    direction: in
    triggers:
      - event: storage:storage_fee_charge
        map: {entry_date: entry_date, fee_type: returned_payment, source_entry_id: source_entry_id}
  - type: storage_credit
    target: storage_ledger
    meaning: A credit against one month's rent is posted — autopay discount, prepay discount, second-space discount, applied reservation deposit, or billing correction.
    grain: One row per rental per month per credit reason.
    distinguish_by: [billing_period, credit_reason]
    fields:
      storage_id: Rental credited.
      billing_period: Month credited.
      entry_date: Date posted.
      credit_reason: Reason for the credit.
      amount: Credit, positive.
    account: storage_receivable
    direction: out
    triggers: []
  - type: storage_deposit_receipt
    target: storage_ledger
    meaning: A reservation or security deposit is collected.
    grain: One row per deposit kind.
    distinguish_by: [deposit_kind]
    fields:
      storage_id: Rental.
      entry_date: Date collected.
      deposit_kind: Reservation or security deposit.
      amount: Deposit, positive.
    account: storage_deposits
    direction: in
    triggers: []
  - type: storage_deposit_disposition
    target: storage_ledger
    meaning: A deposit is applied to rent or charges, refunded, or forfeited.
    grain: One row per deposit kind.
    distinguish_by: [deposit_kind]
    fields:
      storage_id: Rental.
      entry_date: Date of disposition.
      deposit_kind: Reservation or security deposit.
      deposit_disposition: Applied, refunded or forfeited.
      amount: Amount disposed of, positive.
    account: storage_deposits
    direction: out
    triggers:
      - event: storage:storage_credit
        when: {deposit_disposition: applied_to_rent}
        map: {entry_date: entry_date, amount: amount, credit_reason: deposit_applied}
  - type: storage_rate_notice
    target: storage_ledger
    meaning: Written notice of a rent increase is sent.
    grain: One row per notice.
    distinguish_by: [effective_date]
    fields:
      storage_id: Rental.
      entry_date: Date sent.
      effective_date: First month the new rent applies.
      new_monthly_rent: New rent.
    triggers:
      - event: storage:storage_rate_change
        map: {monthly_rent: new_monthly_rent}

measures:
  - id: storage_msr_open_rentals
    window: Current portfolio state on the handling date.
    measure: Count of the customer's storage rentals in reserved, active, past_due_lockout or notice_to_vacate status.
  - id: storage_msr_period_rent_unpaid
    window: One billing period, measured at the end of the day being tested.
    measure: That month's rent charge less that month's credits, less payments applied to the rental's charges oldest first up to that day; never below zero.

policies:
  - id: storage_agg_multi_holding
    subject: [storage_reservation]
    rule: >-
      A household may rent at most two storage spaces at a time across the yard of its community.
      A reservation is taken only when the customer has fewer than two rentals in reserved, active, past_due_lockout or notice_to_vacate status (storage_msr_open_rentals).
    eligibility: []
    params:
      max_per_customer: 2
    measures: [storage_msr_open_rentals]

  - id: storage_agg_second_space_discount
    subject: [storage_credit]
    rule: >-
      When a customer holds two active rentals, the one with the lower monthly rent receives second_space_discount_pct percent off its rent each month, rounded half up to the cent; the higher-rent space never does.
      The second-space discount and a prepay discount never stack on the same month's rent — the larger of the two applies — while the autopay discount is added to whichever applies.
      When either rental closes, the discount stops from the next month.
    eligibility: []
    formula:
      second_space_credit: round(second_space_discount_pct / 100 * monthly_rent, 2)

  - id: storage_admission
    subject: [storage_reservation, storage_reservation_cancel, storage_move_in, storage_deposit_receipt, storage_fee_charge]
    rule: >-
      Holding a site lease is a condition of renting storage: storage is rented only to residents.
      The renter holds an active Hearthstone site lease in the community whose yard the space is in.
      The unit must meet the space class's entry gate (unit type, length and height) and, before move-in, proof of insurance and current registration must be on file and the unit must be operable or road-towable.
      The reservation deposit is collected when reserving and holds the space for reservation_hold_days; a reservation not moved in within that time is cancelled.
      A cancelled reservation's deposit is refunded only when the cancellation is received no later than reservation_refund_days calendar days after the reservation date; otherwise it is forfeited.
      The refund window is counted in calendar days starting the day after the reservation date, and a cancellation on the last day is refunded.
      At move-in the admin_fee and the security_deposit are charged, the first month's rent is prorated on the move_in_proration_basis, and the reservation deposit is applied to that first month's rent.
    eligibility:
      - id: resident_lease_active
        applies_to: [storage_reservation]
        kind: authorization
        condition: The renter holds an active Hearthstone site lease in the community whose yard the space is in.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.customer_id, lease_holdings.status, lease_holdings.community_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
      - id: reservation_refund_window
        applies_to: [storage_reservation_cancel]
        kind: time
        condition: A cancelled reservation's deposit is refunded only when the cancellation is received no later than reservation_refund_days calendar days after the reservation date; otherwise it is forfeited.
        evidence_fields: [storage_rentals.storage_id, storage_rentals.reserved_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_rentals.storage_id]
          action_bindings:
            storage_rentals.storage_id: storage_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the reservation date
          anchor_source: storage_rentals.reserved_date
          relation: not_after
          duration_source: variants.reservation_refund_days
          unit: calendar_days
          counting_rule: The refund window is counted in calendar days starting the day after the reservation date, and a cancellation on the last day is refunded.
          boundary: inclusive

  - id: storage_rent_billing
    subject: [storage_rent_charge, storage_electric_fee, storage_credit]
    rule: >-
      Rent for each calendar month is charged on the rent_due_day at the space's monthly_rent; the move-in month is prorated by days (monthly rent divided by the days in the month times the days from move-in), and the move-out month is never prorated (move_out_proration).
      The electric_hookup_fee_monthly is charged each month the hookup is enrolled, only on a space class where electric_hookup_available is true, and is not prorated.
      While autopay is enrolled, autopay_discount_monthly is credited each full month.
      Rent prepaid for 6 or 12 months earns prepay_6_month_discount_pct or prepay_12_month_discount_pct off each prepaid month, credited month by month; on move-out the discount is recomputed for the months actually used and whole unused months are refunded (prepay_refund_on_vacate).
    eligibility: []
    params:
      per_tier:
        Open Compact Storage Space: {monthly_rent: =monthly_rent, electric_hookup_fee_monthly: =electric_hookup_fee_monthly}
        Open Standard Storage Space: {monthly_rent: =monthly_rent, electric_hookup_fee_monthly: =electric_hookup_fee_monthly}
        Open Large Storage Space: {monthly_rent: =monthly_rent, electric_hookup_fee_monthly: =electric_hookup_fee_monthly}
        Covered Standard Storage Space: {monthly_rent: =monthly_rent, electric_hookup_fee_monthly: =electric_hookup_fee_monthly}
        Covered Large Storage Space: {monthly_rent: =monthly_rent, electric_hookup_fee_monthly: =electric_hookup_fee_monthly}
        Enclosed Storage Unit: {monthly_rent: =monthly_rent, electric_hookup_fee_monthly: =electric_hookup_fee_monthly}
    formula:
      prorated_rent: round(monthly_rent * days_billed / days_in_period, 2)

  - id: storage_late_fee_and_lockout
    subject: [storage_late_fee, storage_lockout, storage_lockout_release, storage_lien_closeout]
    rule: >-
      The first_late_fee is charged when a month's rent is still unpaid at the end of the grace period (late_fee_grace_days after the due day), and the second_late_fee when it is still unpaid on the second_late_fee_day; never more than two late fees per month and none on fees.
      Gate access is suspended when a month's rent is unpaid lockout_days_past_due days after its due day, and restored only when the whole past-due balance including fees is paid (lockout_release_requires_full_balance).
      At lien_notice_days_past_due the preliminary lien notice is sent; the lien sale, towing or release of a unit held under lien are handled only by the community manager and the resident desk never schedules or negotiates them.
    eligibility: []
    measures: [storage_msr_period_rent_unpaid]

  - id: storage_payments
    subject: [storage_payment, storage_payment_return, storage_fee_charge]
    rule: >-
      Storage payments are accepted through the accepted_payment_channels and applied to the oldest charge first.
      A returned payment is charged back for exactly the returned amount against that payment, and the nsf_fee is charged with it.
      A payment is charged back only once.
      A replacement gate card is charged access_card_replacement_fee.
    eligibility:
      - id: storage_return_once
        applies_to: [storage_payment_return]
        kind: dedup
        condition: A payment is charged back only once.
        evidence_fields: [storage_ledger.source_entry_id, storage_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_ledger.source_entry_id]
          action_bindings:
            storage_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: storage_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [storage_payment_return]}
          distinct_fields: []

  - id: storage_vacate_terms
    subject: [storage_notice_to_vacate, storage_notice_rescission, storage_move_out, storage_deposit_disposition, storage_fee_charge]
    rule: >-
      Notice to vacate is the renter's own act and must give at least notice_to_vacate_days calendar days; a vacate date sooner than that is moved to the end of the notice period.
      A notice may be withdrawn before the vacate date.
      Rent for the month of the vacate date is due in full.
      When debris or property is left in the space at move-out, the cleanout_fee is charged and taken from the security deposit.
      The security deposit is applied to any balance owed and the rest refunded within deposit_refund_days calendar days of move-out; a reservation deposit is applied to rent at move-in, refunded on a timely cancellation, or forfeited.
      When the site lease ends, the storage rental must also end, because storage is for residents only.
    eligibility: []
    formula:
      deposit_refund: max(deposit_balance - max(storage_balance, 0), 0)

  - id: storage_rate_terms
    subject: [storage_rate_notice, storage_rate_change]
    rule: >-
      Rent is not increased during the first rate_lock_months of the rental.
      A rent increase may be noticed only after rate_lock_months counted from the rental start date.
      The rate lock is counted in calendar months from the rental start date, and a notice may be sent from the day the lock completes.
      The notice must be sent at least rate_increase_notice_days calendar days before the first month the new rent applies, and one notice may raise rent by no more than rate_increase_cap_pct percent, rounded half up to the cent.
    eligibility:
      - id: rate_lock_completed
        applies_to: [storage_rate_notice]
        kind: time
        condition: A rent increase may be noticed only after rate_lock_months counted from the rental start date.
        evidence_fields: [storage_rentals.storage_id, storage_rentals.rental_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_rentals.storage_id]
          action_bindings:
            storage_rentals.storage_id: storage_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rental start date
          anchor_source: storage_rentals.rental_start_date
          relation: not_before
          duration_source: variants.rate_lock_months
          unit: calendar_months
          counting_rule: The rate lock is counted in calendar months from the rental start date, and a notice may be sent from the day the lock completes.
          boundary: inclusive
    formula:
      max_new_rent: round(monthly_rent * (1 + rate_increase_cap_pct / 100), 2)

  - id: storage_space_and_options
    subject: [storage_space_transfer, storage_option_change, storage_fee_charge]
    rule: >-
      A renter may move to another vacant space whose class entry gate the unit meets; the transfer is charged space_transfer_fee and the new space's rent applies from the next month.
      Space transfers and option changes are made only while the rental is active.
      The electric hookup may be enrolled only on a space class where electric_hookup_available is true; autopay may be enrolled or cancelled at any time while active, effective from the next month's rent.
      A space may never be sublet or used for a unit that does not belong to the household (sublet_allowed is false).
    eligibility:
      - id: options_while_active
        applies_to: [storage_space_transfer, storage_option_change]
        kind: state
        condition: Space transfers and option changes are made only while the rental is active.
        evidence_fields: [storage_rentals.storage_id, storage_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_rentals.storage_id]
          action_bindings:
            storage_rentals.storage_id: storage_id
        state_contract:
          field: storage_rentals.status
          allowed: [active]
