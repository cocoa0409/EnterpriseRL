events:
  - type: utility_account_open
    target: utility_accounts
    mutation: create
    meaning: A utility account is opened for a newly leased site on the schedule in force for its community and section.
    grain: One row per site lease.
    fields:
      customer_id: The leaseholder.
      lease_id: The site lease served.
      variant_name: Service schedule in force for the site.
      meter_number: Serial number of the site's water submeter (or, on the flat-rate schedule, the site number).
      service_start_date: The lease move-in date.
      opened_date: Date the account was opened.
    triggers:
      - event: utility:utility_service_start
        map: {service_start_date: service_start_date}
  - type: utility_service_start
    target: utility_accounts
    mutation: {transition: {from: pending_start, to: active}}
    meaning: Service starts on the move-in date and opening reads are taken on every submeter.
    grain: One row per transaction.
    fields:
      status: Set to active.
      service_start_date: Date service started.
    triggers:
      - event: utility:utility_meter_read
        map: {entry_date: service_start_date, read_type: opening}
  - type: utility_meter_exchange
    target: utility_accounts
    mutation: update
    meaning: A submeter found inaccurate on test is replaced and the new serial number recorded.
    grain: One row per transaction.
    fields:
      meter_number: Serial number of the replacement meter.
    triggers: []
  - type: utility_final_read_order
    target: utility_accounts
    mutation: {transition: {from: active, to: final_read_pending}}
    meaning: A final read is ordered for the date the lease ends.
    grain: One row per transaction.
    fields:
      status: Set to final_read_pending.
      service_end_date: Date service ends and the final read is taken.
    triggers: []
  - type: utility_final_read_cancel
    target: utility_accounts
    mutation: {transition: {from: final_read_pending, to: active}}
    meaning: The final read is cancelled because the notice to vacate was withdrawn.
    grain: One row per transaction.
    fields:
      status: Set to active.
      service_end_date: Cleared.
    triggers: []
  - type: utility_final_bill
    target: utility_accounts
    mutation: {transition: {from: final_read_pending, to: final_billed}}
    meaning: The final read is taken on the service end date and the final statement issued.
    grain: One row per transaction.
    fields:
      status: Set to final_billed.
      service_end_date: Date of the final read (already set when the final read was ordered).
    triggers:
      - event: utility:utility_meter_read
        map: {entry_date: service_end_date, read_type: final}
  - type: utility_account_close
    target: utility_accounts
    mutation: {transition: {from: final_billed, to: closed}}
    meaning: The final statement is settled to a zero balance and the account closes.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Date the account closed.
    triggers: []
  - type: utility_collections_referral
    target: utility_accounts
    mutation: {transition: {from: final_billed, to: referred_to_collections}}
    meaning: An unpaid final balance is referred to the outside collection agency.
    grain: One row per transaction.
    fields:
      status: Set to referred_to_collections.
      closed_date: Date of the referral.
    triggers: []

  - type: utility_meter_read
    target: utility_ledger
    meaning: A submeter reading is recorded — opening, regular actual, estimated, verification re-read or final.
    grain: One row per account per service per billing period per read type.
    distinguish_by: [billing_period, utility_service, read_type]
    fields:
      utility_account_id: Account read.
      billing_period: Statement month the read is billed on, YYYY-MM.
      entry_date: Date of the read (or of the estimate).
      utility_service: Service metered.
      read_type: Kind of read.
      prior_reading: Register reading the consumption is measured from.
      current_reading: Register reading on this date.
      consumption: current_reading less prior_reading, in the service's unit.
      consumption_unit: Unit of the consumption.
    triggers:
      - event: utility:utility_usage_charge
        when: {read_type: [actual, estimated, final]}
        map: {billing_period: billing_period, utility_service: utility_service, consumption: consumption, consumption_unit: consumption_unit, source_entry_id: utility_entry_id, charge_basis: regular}
  - type: utility_usage_charge
    target: utility_ledger
    meaning: A consumption charge for one metered service is posted on a statement — the regular charge for the read cycle, or a back-bill after a meter is found under-registering.
    grain: One row per account per service per billing period per charge basis.
    distinguish_by: [billing_period, utility_service, charge_basis]
    fields:
      utility_account_id: Account charged.
      billing_period: Statement month, YYYY-MM.
      entry_date: Statement date.
      due_date: Statement due date.
      utility_service: Service charged.
      consumption: Consumption billed.
      consumption_unit: Unit of the consumption.
      charge_basis: Regular charge or back-bill.
      source_entry_id: The meter read billed.
      amount: Charge, positive.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_fixed_charge
    target: utility_ledger
    meaning: A fixed monthly charge for one service is posted on a statement — a meter base charge, a flat sewer or trash fee, or the flat-rate utility fee.
    grain: One row per account per service per billing period.
    distinguish_by: [billing_period, utility_service]
    fields:
      utility_account_id: Account charged.
      billing_period: Statement month, YYYY-MM.
      entry_date: Statement date.
      due_date: Statement due date.
      utility_service: Service charged.
      days_billed: Days of service charged in the period.
      days_in_period: Days in the read cycle (or calendar month on the flat-rate schedule).
      amount: Charge, positive.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_admin_fee
    target: utility_ledger
    meaning: The billing and administration fee is added to a monthly statement.
    grain: One row per account per statement.
    distinguish_by: [billing_period]
    fields:
      utility_account_id: Account charged.
      billing_period: Statement month, YYYY-MM.
      entry_date: Statement date.
      due_date: Statement due date.
      amount: Fee, positive.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_late_fee
    target: utility_ledger
    meaning: A late fee is charged on a statement left unpaid past its grace period.
    grain: One row per account per statement.
    distinguish_by: [billing_period]
    fields:
      utility_account_id: Account charged.
      billing_period: Statement month that was paid late.
      entry_date: Date the fee was posted.
      amount: Fee, positive.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_payment
    target: utility_ledger
    meaning: A payment toward the utility statement account is received.
    grain: One row per payment instrument or electronic transaction.
    distinguish_by: [payment_ref]
    fields:
      utility_account_id: Account credited.
      entry_date: Date received.
      amount: Payment, positive.
      payment_channel: Channel the payment arrived through.
      payment_ref: Serial number or processor confirmation number printed on the payment.
    account: utility_receivable
    direction: out
    triggers: []
  - type: utility_payment_return
    target: utility_ledger
    meaning: A utility payment is returned unpaid by the bank and charged back.
    grain: One row per returned payment.
    distinguish_by: [source_entry_id]
    fields:
      utility_account_id: Account charged back.
      entry_date: Date the return was received.
      source_entry_id: The payment returned.
      return_reason: Bank's return reason.
      amount: Amount charged back, positive.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_adjustment_credit
    target: utility_ledger
    meaning: A credit is posted against one charge — a leak adjustment, an estimated-read true-up, a refund for an over-registering meter, a billing-error correction, or a courtesy late-fee waiver.
    grain: One row per charge adjusted per adjustment reason.
    distinguish_by: [source_entry_id, adjustment_reason]
    fields:
      utility_account_id: Account credited.
      billing_period: Statement month of the charge adjusted.
      entry_date: Date the credit was posted.
      utility_service: Service of the charge adjusted.
      adjustment_reason: Reason for the credit.
      source_entry_id: The charge (or late fee) adjusted.
      amount: Credit, positive.
    account: utility_receivable
    direction: out
    triggers: []
  - type: utility_meter_test
    target: utility_ledger
    meaning: A resident-requested accuracy test of a submeter is completed.
    grain: One row per meter test.
    distinguish_by: [entry_date, utility_service]
    fields:
      utility_account_id: Account whose meter was tested.
      entry_date: Test date.
      utility_service: Service whose meter was tested.
      meter_test_result: Outcome against the tolerance.
      measured_deviation_pct: Measured registration error, percent (positive over-registers, negative under-registers).
    triggers:
      - event: utility:utility_meter_test_fee
        when: {meter_test_result: within_tolerance}
        map: {entry_date: entry_date, source_entry_id: utility_entry_id}
      - event: utility:utility_meter_exchange
        when: {meter_test_result: [over_registering, under_registering]}
  - type: utility_meter_test_fee
    target: utility_ledger
    meaning: The meter-test fee is charged because the tested meter was accurate.
    grain: One row per meter test.
    distinguish_by: [source_entry_id]
    fields:
      utility_account_id: Account charged.
      entry_date: Test date.
      source_entry_id: The meter test.
      amount: Fee, positive.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_credit_refund
    target: utility_ledger
    meaning: A credit balance left on a final-billed account is refunded to the former resident by check.
    grain: One row per refund.
    distinguish_by: [entry_date]
    fields:
      utility_account_id: Account refunded.
      entry_date: Date the refund was issued.
      amount: Refund, positive (it brings the credit balance back to zero).
    account: utility_receivable
    direction: in
    triggers: []

measures:
  - id: utility_msr_baseline_consumption
    window: The leak_adjustment_baseline_periods billing periods immediately before the period in question that were billed on an actual (not estimated) water read.
    measure: Average water consumption (kgal) of utility_meter_read rows with utility_service water and read_type actual or verification_reread over those periods, rounded to two decimals.
  - id: utility_msr_estimate_streak
    window: The run of consecutive billing periods ending with the most recent one, per metered service.
    measure: Count of consecutive billing periods whose billed utility_meter_read for that service has read_type estimated.
  - id: utility_msr_estimate_daily_use
    window: The estimate_basis_periods most recent billing periods billed on an actual read for the service.
    measure: Total consumption of those reads divided by the total days they cover — average daily consumption used to set an estimated read.
  - id: utility_msr_leak_adjustments
    window: Trailing 12 calendar months ending on (and including) the handling date.
    measure: Count of distinct billing periods with a utility_adjustment_credit row whose adjustment_reason is leak_adjustment, by entry_date.
  - id: utility_msr_courtesy_waivers
    window: Trailing 12 calendar months ending on (and including) the handling date.
    measure: Count of utility_adjustment_credit rows whose adjustment_reason is late_fee_courtesy, by entry_date.
  - id: utility_msr_statement_unpaid
    window: One statement (billing period), measured at the end of the last day of its grace period.
    measure: That statement's usage, fixed and administration charges less its adjustment credits, less payments received on or before the last grace day applied to statements oldest first; never below zero.

policies:
  - id: utility_agg_multi_holding
    subject: [utility_account_open]
    rule: >-
      Every leased site carries exactly one utility account, and an account belongs to exactly one lease.
      The lease has no other utility account in pending_start, active or final_read_pending status.
      Because a customer holds one open site lease at a time, a customer holds two utility accounts only while relocating — the old site's account final-reading or final-billed while the new site's account starts — and never more than two.
    eligibility:
      - id: one_account_per_lease
        applies_to: [utility_account_open]
        kind: dedup
        condition: The lease has no other utility account in pending_start, active or final_read_pending status.
        evidence_fields: [utility_accounts.lease_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.lease_id]
          action_bindings:
            utility_accounts.lease_id: lease_id
        dedup_contract:
          table: utility_accounts
          mode: separate_record
          object_bindings: {lease_id: lease_id}
          duplicate_filters: {status: [pending_start, active, final_read_pending]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: utility_agg_account_settlement
    subject: [utility_payment, utility_adjustment_credit, utility_credit_refund]
    rule: >-
      When a customer holds two utility accounts, each is billed, paid and settled on its own: a payment is applied only to the account whose statement it names, and a balance or credit on one account is never netted against the other.
      A utility balance never moves to or from the site-lease ledger, and the lease security deposit is never applied to a utility balance.
      A credit balance left on a final-billed account is refunded by check to the former resident at closing rather than carried to any other account.
    eligibility: []

  - id: utility_schedule_assignment
    subject: [utility_account_open, utility_service_start, utility_meter_exchange]
    rule: >-
      The service schedule is fixed by the site, not chosen by the resident: it is the schedule whose entry gate lists the community and section of the site, the section being the letter before the hyphen in the site number.
      A utility account is opened only for a lease that has been signed (active).
      Service starts on the lease move-in date with an opening read on every submetered service, and the first statement prorates fixed charges from that date.
      A schedule changes only when Hearthstone changes the community's utility infrastructure; a resident request to move to a different schedule, or to take service directly from the public utility, is not available.
      A replacement meter is installed only after a meter test finds the old meter outside tolerance, and its serial number replaces the old one on the account.
    eligibility:
      - id: lease_signed
        applies_to: [utility_account_open]
        kind: authorization
        condition: A utility account is opened only for a lease that has been signed (active).
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status, lease_holdings.community_name, lease_holdings.site_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id

  - id: utility_evt_statement_billing
    subject: [utility_meter_read, utility_usage_charge, utility_fixed_charge, utility_admin_fee]
    rule: >-
      Every submeter is read on the schedule's meter_read_day, and consumption between consecutive reads is billed on the statement issued on the statement_day of the following month and due payment_due_days calendar days after the statement date.
      Water is billed by block on the cycle's consumption: the part up to water_block1_limit_kgal at water_block1_rate_per_kgal, the part above that up to water_block2_limit_kgal at water_block2_rate_per_kgal, and the rest at water_block3_rate_per_kgal, plus water_base_charge_monthly.
      Where sewer is metered_on_water it is billed at sewer_rate_per_kgal on the cycle's water consumption up to sewer_monthly_cap_kgal, plus sewer_base_charge_monthly; where it is a flat_fee it is sewer_flat_fee_monthly.
      Natural gas is billed at gas_rate_per_ccf plus gas_base_charge_monthly, propane at propane_rate_per_gallon plus propane_base_charge_monthly, and electricity at electric_tier1_rate_per_kwh up to electric_tier1_limit_kwh and electric_tier2_rate_per_kwh above it, plus electric_customer_charge_monthly.
      Trash is trash_flat_fee_monthly, and on the flat-rate schedule water, sewer and trash together are the single flat_utility_fee_monthly billed for the calendar month with no meter reads.
      Fixed charges are prorated on the proration_basis in the opening and final periods only — the monthly amount divided by the days in the cycle times the days of service; consumption charges are never prorated.
      Each statement carries one admin_fee_per_statement, including the final statement, and each computed charge is rounded half up to the cent.
      A charge is posted for a service only when the schedule bills that service.
    eligibility: []
    params:
      per_tier:
        Flat-Rate Water, Sewer & Trash Schedule: {admin_fee_per_statement: =admin_fee_per_statement, flat_utility_fee_monthly: =flat_utility_fee_monthly}
        Submetered Water Schedule: {admin_fee_per_statement: =admin_fee_per_statement, flat_utility_fee_monthly: =flat_utility_fee_monthly}
        Submetered Water & Sewer Schedule: {admin_fee_per_statement: =admin_fee_per_statement, flat_utility_fee_monthly: =flat_utility_fee_monthly}
        Submetered Water, Sewer & Natural Gas Schedule: {admin_fee_per_statement: =admin_fee_per_statement, flat_utility_fee_monthly: =flat_utility_fee_monthly}
        Submetered Water, Sewer & Propane Schedule: {admin_fee_per_statement: =admin_fee_per_statement, flat_utility_fee_monthly: =flat_utility_fee_monthly}
        Submetered Electric, Water & Sewer Schedule: {admin_fee_per_statement: =admin_fee_per_statement, flat_utility_fee_monthly: =flat_utility_fee_monthly}
    formula:
      water_charge: round(min(consumption, water_block1_limit_kgal) * water_block1_rate_per_kgal + min(max(consumption - water_block1_limit_kgal, 0), water_block2_limit_kgal - water_block1_limit_kgal) * water_block2_rate_per_kgal + max(consumption - water_block2_limit_kgal, 0) * water_block3_rate_per_kgal, 2)
      sewer_charge: round(min(consumption, sewer_monthly_cap_kgal) * sewer_rate_per_kgal, 2)
      gas_charge: round(consumption * gas_rate_per_ccf, 2)
      propane_charge: round(consumption * propane_rate_per_gallon, 2)
      electric_charge: round(min(consumption, electric_tier1_limit_kwh) * electric_tier1_rate_per_kwh + max(consumption - electric_tier1_limit_kwh, 0) * electric_tier2_rate_per_kwh, 2)
      prorated_fixed_charge: round(amount * days_billed / days_in_period, 2)

  - id: utility_evt_estimates_and_rereads
    subject: [utility_meter_read, utility_adjustment_credit]
    rule: >-
      When a submeter cannot be read on the read day, the cycle is billed on an estimated read set at utility_msr_estimate_daily_use times the days in the cycle.
      No more than max_consecutive_estimated_reads consecutive cycles may be billed on estimates (utility_msr_estimate_streak); the next cycle must be billed on an actual read, arranged with the resident if access is the obstacle.
      The first actual read after one or more estimates is billed against the last estimated register reading, which trues up cumulative use; when the actual register reading is below the last estimated one, the over-estimated consumption is credited at the rates of the periods it was billed in (adjustment_reason estimated_read_true_up) and the cycle's consumption is billed as zero.
      When an actual water read shows consumption above high_bill_reread_threshold_pct percent of utility_msr_baseline_consumption, the meter is re-read before the statement is issued and the statement bills the verification re-read.
    eligibility: []
    measures: [utility_msr_estimate_streak, utility_msr_estimate_daily_use, utility_msr_baseline_consumption]
    formula:
      estimated_consumption: utility_msr_estimate_daily_use * days_in_period

  - id: utility_evt_leak_adjustment
    subject: [utility_adjustment_credit]
    rule: >-
      A leak adjustment relieves part of a high water bill caused by a leak on the resident's side of the meter that the resident has since repaired.
      A leak adjustment is available only on a schedule whose leak_adjustment_available is true.
      The leak adjustment request must be received no later than leak_request_window_days calendar days after the statement date of the high bill.
      The window is counted in calendar days starting the day after the statement date, and a request received on the last day is in time.
      The resident supplies a dated plumber's invoice or parts receipt showing the leak was repaired, and states where the leak was; the repair date and leak location are recorded on the request.
      A water charge that already carries a leak adjustment is not adjusted again.
      The period qualifies only when its billed water consumption is at least leak_adjustment_threshold_pct percent of utility_msr_baseline_consumption, and no more than leak_adjustments_per_12_months adjustments may be granted on the account in the trailing 12 months (utility_msr_leak_adjustments).
      The water credit is leak_adjustment_pct_of_excess percent of the difference between the water usage charge billed and the water usage charge recomputed at the baseline consumption on the same block rates.
      When sewer is metered_on_water and the leak was on an under-home supply line or a yard service line (water that never reached the sewer), a sewer credit of outdoor_leak_sewer_credit_pct percent of the difference between the sewer usage charge billed and the sewer usage charge recomputed at the baseline is added; a leak at an indoor fixture earns no sewer credit.
      The total credit is capped at leak_adjustment_max_credit, the water credit being applied first; each credit is rounded half up to the cent and posted against the charge it adjusts.
      Gas, propane and electric charges are never leak-adjusted, and fixed charges and administration fees are never reduced by a leak adjustment.
    eligibility:
      - id: schedule_offers_leak_adjustment
        applies_to: [utility_adjustment_credit]
        kind: authorization
        condition: A leak adjustment is available only on a schedule whose leak_adjustment_available is true.
        evidence_fields: [utility_accounts.utility_account_id, utility_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.utility_account_id]
          action_bindings:
            utility_accounts.utility_account_id: utility_account_id
      - id: leak_request_window
        applies_to: [utility_adjustment_credit]
        kind: time
        condition: The leak adjustment request must be received no later than leak_request_window_days calendar days after the statement date of the high bill.
        evidence_fields: [utility_ledger.utility_entry_id, utility_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_ledger.utility_entry_id]
          action_bindings:
            utility_ledger.utility_entry_id: source_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the statement date of the high bill
          anchor_source: utility_ledger.entry_date
          relation: not_after
          duration_source: variants.leak_request_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the statement date, and a request received on the last day is in time.
          boundary: inclusive
      - id: repair_proof
        applies_to: [utility_adjustment_credit]
        kind: caller_fact
        condition: The resident supplies a dated plumber's invoice or parts receipt showing the leak was repaired, and states where the leak was; the repair date and leak location are recorded on the request.
        evidence_fields: [utility_service_requests.utility_account_id, utility_service_requests.repair_completed_date, utility_service_requests.leak_location]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [utility_service_requests.utility_account_id]
          action_bindings:
            utility_service_requests.utility_account_id: utility_account_id
      - id: not_already_leak_adjusted
        applies_to: [utility_adjustment_credit]
        kind: dedup
        condition: A water charge that already carries a leak adjustment is not adjusted again.
        evidence_fields: [utility_ledger.source_entry_id, utility_ledger.adjustment_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_ledger.source_entry_id]
          action_bindings:
            utility_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: utility_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {adjustment_reason: [leak_adjustment]}
          distinct_fields: []
    params:
      per_tier:
        Flat-Rate Water, Sewer & Trash Schedule: {leak_adjustment_available: =leak_adjustment_available, leak_adjustment_max_credit: =leak_adjustment_max_credit}
        Submetered Water Schedule: {leak_adjustment_available: =leak_adjustment_available, leak_adjustment_max_credit: =leak_adjustment_max_credit}
        Submetered Water & Sewer Schedule: {leak_adjustment_available: =leak_adjustment_available, leak_adjustment_max_credit: =leak_adjustment_max_credit}
        Submetered Water, Sewer & Natural Gas Schedule: {leak_adjustment_available: =leak_adjustment_available, leak_adjustment_max_credit: =leak_adjustment_max_credit}
        Submetered Water, Sewer & Propane Schedule: {leak_adjustment_available: =leak_adjustment_available, leak_adjustment_max_credit: =leak_adjustment_max_credit}
        Submetered Electric, Water & Sewer Schedule: {leak_adjustment_available: =leak_adjustment_available, leak_adjustment_max_credit: =leak_adjustment_max_credit}
    formula:
      when_not: consumption < leak_adjustment_threshold_pct / 100 * utility_msr_baseline_consumption
      baseline_water_charge: round(min(utility_msr_baseline_consumption, water_block1_limit_kgal) * water_block1_rate_per_kgal + min(max(utility_msr_baseline_consumption - water_block1_limit_kgal, 0), water_block2_limit_kgal - water_block1_limit_kgal) * water_block2_rate_per_kgal + max(utility_msr_baseline_consumption - water_block2_limit_kgal, 0) * water_block3_rate_per_kgal, 2)
      water_credit: round(leak_adjustment_pct_of_excess / 100 * (amount - baseline_water_charge), 2)
      sewer_credit: round(outdoor_leak_sewer_credit_pct / 100 * (min(consumption, sewer_monthly_cap_kgal) - min(utility_msr_baseline_consumption, sewer_monthly_cap_kgal)) * sewer_rate_per_kgal, 2)
      total_credit: min(water_credit + sewer_credit, leak_adjustment_max_credit)
    measures: [utility_msr_baseline_consumption, utility_msr_leak_adjustments]

  - id: utility_evt_late_fee
    subject: [utility_late_fee, utility_adjustment_credit]
    rule: >-
      A utility late fee may be charged only after the grace period has ended, counted from the statement due date.
      The grace period is counted in calendar days starting the day after the due date, and the fee may be posted no earlier than the day after the last grace day.
      The fee is late_fee_amount, charged once per statement, and only when the statement's unpaid amount at the end of the grace period (utility_msr_statement_unpaid) is at least late_fee_min_past_due; no late fee is charged on a late fee.
      A courtesy waiver removes one whole utility late fee (adjustment_reason late_fee_courtesy), at most utility_courtesy_waivers_per_12_months in the trailing 12 months (utility_msr_courtesy_waivers), and only while the account is active.
      Late fees never lead to suspension of service, because service_suspension_for_nonpayment is false on every schedule.
    eligibility:
      - id: utility_grace_ended
        applies_to: [utility_late_fee]
        kind: time
        condition: A utility late fee may be charged only after the grace period has ended, counted from the statement due date.
        evidence_fields: [utility_ledger.utility_account_id, utility_ledger.billing_period, utility_ledger.due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_ledger.utility_account_id, utility_ledger.billing_period]
          action_bindings:
            utility_ledger.utility_account_id: utility_account_id
            utility_ledger.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the statement due date
          anchor_source: utility_ledger.due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date, and the fee may be posted no earlier than the day after the last grace day.
          boundary: exclusive
    params:
      per_tier:
        Flat-Rate Water, Sewer & Trash Schedule: {late_fee_amount: =late_fee_amount}
        Submetered Water Schedule: {late_fee_amount: =late_fee_amount}
        Submetered Water & Sewer Schedule: {late_fee_amount: =late_fee_amount}
        Submetered Water, Sewer & Natural Gas Schedule: {late_fee_amount: =late_fee_amount}
        Submetered Water, Sewer & Propane Schedule: {late_fee_amount: =late_fee_amount}
        Submetered Electric, Water & Sewer Schedule: {late_fee_amount: =late_fee_amount}
    formula:
      when_not: utility_msr_statement_unpaid < late_fee_min_past_due
      late_fee: late_fee_amount
    measures: [utility_msr_statement_unpaid, utility_msr_courtesy_waivers]

  - id: utility_evt_payments
    subject: [utility_payment, utility_payment_return]
    rule: >-
      Utility statements are paid through the accepted_payment_channels and payments are applied to the oldest unpaid statement first.
      While the lease the account serves is on certified_funds_only status and its certified_funds_until date has not passed, a utility payment is accepted only through the lease's certified_funds_channels.
      A returned utility payment is charged back for exactly the returned amount against that payment and carries no returned-payment fee on the utility account.
      A payment is charged back only once.
      An unpaid utility balance never leads to suspension of any service by Hearthstone; it is pursued through late fees while the account is open and through collections after the final statement.
    eligibility:
      - id: lease_restriction_carries
        applies_to: [utility_payment]
        kind: authorization
        condition: While the lease the account serves is on certified_funds_only status and its certified_funds_until date has not passed, a utility payment is accepted only through the lease's certified_funds_channels.
        evidence_fields: [utility_accounts.lease_id, lease_holdings.payment_restriction, lease_holdings.certified_funds_until, utility_ledger.payment_channel]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [utility_accounts.lease_id]
          action_bindings:
            utility_accounts.lease_id: lease_id
      - id: utility_return_once
        applies_to: [utility_payment_return]
        kind: dedup
        condition: A payment is charged back only once.
        evidence_fields: [utility_ledger.source_entry_id, utility_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_ledger.source_entry_id]
          action_bindings:
            utility_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: utility_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [utility_payment_return]}
          distinct_fields: []

  - id: utility_meter_accuracy
    subject: [utility_meter_test, utility_meter_test_fee, utility_meter_exchange, utility_usage_charge, utility_adjustment_credit]
    rule: >-
      A resident may ask for an accuracy test of any submeter on the account; there is no meter on the flat-rate schedule and no test is available there.
      A meter test is taken only on an account that is active.
      A water meter is accurate when its measured deviation is within water_meter_tolerance_pct either way, and a gas, propane or electric meter when within energy_meter_tolerance_pct either way.
      An accurate meter stays in place and the meter_test_fee is charged.
      An over-registering meter is replaced at no charge and each regular usage charge for that service in the billing periods within overbilling_refund_lookback_months before the test date (but not before the account opened) is credited by the over-billed part — the charge less the charge recomputed at the consumption divided by one plus the deviation — with adjustment_reason meter_over_registration.
      An under-registering meter is replaced at no charge and the unbilled part is back-billed only for the billing periods within underbilling_backbill_months before the test date, as usage charges with charge_basis back_bill on the current statement.
      Every recomputed amount is rounded half up to the cent per billing period.
    eligibility:
      - id: test_on_active_account
        applies_to: [utility_meter_test]
        kind: state
        condition: A meter test is taken only on an account that is active.
        evidence_fields: [utility_accounts.utility_account_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.utility_account_id]
          action_bindings:
            utility_accounts.utility_account_id: utility_account_id
        state_contract:
          field: utility_accounts.status
          allowed: [active]
    params:
      per_tier:
        Flat-Rate Water, Sewer & Trash Schedule: {meter_test_fee: =meter_test_fee}
        Submetered Water Schedule: {meter_test_fee: =meter_test_fee}
        Submetered Water & Sewer Schedule: {meter_test_fee: =meter_test_fee}
        Submetered Water, Sewer & Natural Gas Schedule: {meter_test_fee: =meter_test_fee}
        Submetered Water, Sewer & Propane Schedule: {meter_test_fee: =meter_test_fee}
        Submetered Electric, Water & Sewer Schedule: {meter_test_fee: =meter_test_fee}
    formula:
      within_tolerance: abs(measured_deviation_pct) <= water_meter_tolerance_pct
      overbilled_consumption: consumption - consumption / (1 + measured_deviation_pct / 100)

  - id: utility_final_billing
    subject: [utility_final_read_order, utility_final_read_cancel, utility_final_bill, utility_account_close, utility_collections_referral, utility_credit_refund]
    rule: >-
      When the lease ends — on the vacate date of a notice to vacate, the closing date of an in-place home sale, or the date possession returns after a termination — a final read is ordered for that date, and a withdrawn notice to vacate cancels it.
      The final read is taken on the service end date and the final statement issued within final_bill_days_after_read calendar days, with fixed charges prorated to the service end date and one administration fee.
      The account closes when the final balance reaches zero, a credit balance being refunded under utility_agg_account_settlement.
      An unpaid final balance is referred to collections only after collections_referral_days have passed, counted from the final statement due date.
      The referral period is counted in calendar days starting the day after the due date, and the referral may be made no earlier than the day after the last day of the period.
      A final balance paid in full before referral closes the account instead.
    eligibility:
      - id: referral_period_elapsed
        applies_to: [utility_collections_referral]
        kind: time
        condition: An unpaid final balance is referred to collections only after collections_referral_days have passed, counted from the final statement due date.
        evidence_fields: [utility_ledger.utility_account_id, utility_ledger.due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_ledger.utility_account_id]
          action_bindings:
            utility_ledger.utility_account_id: utility_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the final statement due date
          anchor_source: utility_ledger.due_date
          relation: not_before
          duration_source: variants.collections_referral_days
          unit: calendar_days
          counting_rule: The referral period is counted in calendar days starting the day after the due date, and the referral may be made no earlier than the day after the last day of the period.
          boundary: exclusive
