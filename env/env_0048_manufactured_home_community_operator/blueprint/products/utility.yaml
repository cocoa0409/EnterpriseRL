# Utility Pass-Through Service charter — Hearthstone Communities.
# Each leased site carries one utility account on the service schedule in force for its community
# (and, where a community has more than one, its section). Hearthstone buys water, sewer, gas,
# propane or electricity in bulk from the public utility and passes the cost through to each site
# by submeter or flat fee on a monthly utility statement, separate from the site-rent ledger.

category: utility
display_name: Utility Pass-Through Service

binding:
  holding_table: utility_accounts
  event_tables: [utility_ledger]
  intake_tables: [utility_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {utility_balance: utility_receivable}

lifecycle:
  states: [pending_start, active, final_read_pending, final_billed, closed, referred_to_collections]
  transitions:
    - {from: pending_start, to: active, by: system, means: "Service starts on the lease move-in date with an opening meter read."}
    - {from: active, to: final_read_pending, by: system, means: "A final read is ordered for the service end date because the lease is ending."}
    - {from: final_read_pending, to: active, by: system, means: "The final read is cancelled because the lease is continuing after all."}
    - {from: final_read_pending, to: final_billed, by: system, means: "The final read is taken and the final statement issued."}
    - {from: final_billed, to: closed, by: system, means: "The final statement is settled (or a credit balance refunded or transferred) and the account closes."}
    - {from: final_billed, to: referred_to_collections, by: system, means: "The final statement remains unpaid past the collections window and the balance is referred to the outside collection agency."}

accounts:
  - key: utility_receivable
    unit: USD
    meaning: Amount the resident owes on the utility statement account — usage charges, fixed charges, administration fees, late fees, meter-test fees and returned payments, less payments and adjustment credits.

parameter_schema:
  water_submetered: Whether water is billed by the site's own submeter on this schedule, boolean.
  water_base_charge_monthly: Fixed monthly water meter charge per site, USD per billing period; not_applicable where water is not submetered.
  water_block1_limit_kgal: Upper bound of the first water rate block, thousand gallons per billing period; not_applicable where water is not submetered.
  water_block1_rate_per_kgal: Water rate for consumption within the first block, USD per thousand gallons.
  water_block2_limit_kgal: Upper bound of the second water rate block (cumulative from zero), thousand gallons per billing period.
  water_block2_rate_per_kgal: Water rate for consumption above the first block up to the second block bound, USD per thousand gallons.
  water_block3_rate_per_kgal: Water rate for consumption above the second block bound, USD per thousand gallons.
  sewer_billing_basis: How sewer is billed — included_in_flat_fee, flat_fee, or metered_on_water (billed on the water submeter reading up to a monthly cap), enum.
  sewer_flat_fee_monthly: Flat monthly sewer charge, USD per billing period; not_applicable unless sewer_billing_basis is flat_fee.
  sewer_base_charge_monthly: Fixed monthly sewer charge alongside metered sewer, USD per billing period; not_applicable unless metered_on_water.
  sewer_rate_per_kgal: Sewer rate on water consumption up to the cap, USD per thousand gallons; not_applicable unless metered_on_water.
  sewer_monthly_cap_kgal: Largest water consumption on which sewer is charged in one billing period, thousand gallons; not_applicable unless metered_on_water.
  trash_billing_basis: How trash collection is billed — included_in_flat_fee or flat_fee, enum.
  trash_flat_fee_monthly: Flat monthly trash collection charge, USD per billing period; not_applicable when included in the flat utility fee.
  flat_utility_fee_monthly: Single flat monthly charge covering water, sewer and trash on the flat-rate schedule, USD per billing period; not_applicable on submetered schedules.
  gas_submetered: Whether community-distributed natural gas is billed by the site's gas submeter, boolean.
  gas_base_charge_monthly: Fixed monthly gas meter charge, USD per billing period; not_applicable where gas is not submetered.
  gas_rate_per_ccf: Natural gas rate, USD per hundred cubic feet.
  propane_submetered: Whether community-distributed propane is billed by the site's propane meter, boolean.
  propane_base_charge_monthly: Fixed monthly propane meter charge, USD per billing period; not_applicable where propane is not submetered.
  propane_rate_per_gallon: Propane rate, USD per gallon as converted from the vapor meter reading.
  electric_submetered: Whether electricity is billed by the site's electric submeter, boolean.
  electric_customer_charge_monthly: Fixed monthly electric customer charge, USD per billing period; not_applicable where electricity is not submetered.
  electric_tier1_limit_kwh: Upper bound of the first electric energy tier, kWh per billing period.
  electric_tier1_rate_per_kwh: Electric energy rate within the first tier, USD per kWh.
  electric_tier2_rate_per_kwh: Electric energy rate above the first tier, USD per kWh.
  meter_read_day: Day of the month on which the community reads every submeter, integer day of month; not_applicable on the flat-rate schedule.
  statement_day: Day of the month on which the utility statement for the prior read cycle (or, on the flat-rate schedule, for the current month) is issued, integer day of month.
  payment_due_days: Calendar days after the statement date on which the statement is due, integer days.
  admin_fee_per_statement: Billing and administration fee added to each monthly statement, USD per statement.
  late_fee_amount: Late fee on a statement left unpaid past the grace period, USD per statement.
  late_fee_grace_days: Calendar days after the due date before a late fee may be charged, integer days.
  late_fee_min_past_due: Smallest past-due amount on which a late fee is charged, USD.
  utility_courtesy_waivers_per_12_months: Number of utility late fees that may be waived as a courtesy in any trailing 12 months, integer.
  max_consecutive_estimated_reads: Largest number of consecutive billing periods that may be billed on an estimated read before an actual read must be obtained, integer; not_applicable on the flat-rate schedule.
  estimate_basis_periods: Number of most recent actual-read billing periods whose average daily consumption sets an estimated read, integer.
  leak_adjustment_available: Whether a leak adjustment may be granted on this schedule, boolean.
  leak_adjustment_threshold_pct: Water consumption, as a percentage of the baseline, at or above which a billing period qualifies for a leak adjustment, percent.
  leak_adjustment_pct_of_excess: Share of the water charge attributable to consumption above the baseline that a leak adjustment credits, percent.
  leak_adjustment_baseline_periods: Number of actual-read billing periods immediately before the leak period whose average consumption is the baseline, integer.
  leak_adjustments_per_12_months: Largest number of leak adjustments granted on one account in any trailing 12 months, integer.
  leak_request_window_days: Calendar days after the statement date of the high bill within which the leak adjustment request, with proof of repair, must be received, integer days.
  leak_adjustment_max_credit: Cap on the total credit (water plus sewer) of one leak adjustment, USD.
  outdoor_leak_sewer_credit_pct: Share of the sewer charge attributable to excess consumption credited when the repaired leak did not discharge to the sewer (an under-home supply line or yard service line), percent; not_applicable unless sewer is metered_on_water.
  high_bill_reread_threshold_pct: Consumption, as a percentage of the baseline, above which the meter is re-read before the statement is issued, percent.
  water_meter_tolerance_pct: Largest deviation from true volume at which a tested water submeter is considered accurate, percent either way.
  energy_meter_tolerance_pct: Largest deviation at which a tested gas, propane or electric submeter is considered accurate, percent either way; not_applicable where no energy service is submetered.
  meter_test_fee: Fee for a resident-requested meter test, charged only when the meter tests accurate, USD.
  overbilling_refund_lookback_months: Largest number of billing periods, counted back from the test date, refunded when a meter over-registers, integer months.
  underbilling_backbill_months: Largest number of billing periods, counted back from the test date, back-billed when a meter under-registers, integer months.
  final_bill_days_after_read: Calendar days after the final read within which the final statement is issued, integer days.
  collections_referral_days: Calendar days after the final statement's due date after which an unpaid final balance is referred to collections, integer days.
  service_suspension_for_nonpayment: Whether utility service may be suspended for an unpaid utility balance on this schedule, boolean.
  accepted_payment_channels: Payment channels accepted for utility statements, list of channel codes.
  amount_rounding: Rounding applied to each computed charge and credit — half_up_to_cent, enum.
  proration_basis: How fixed monthly charges are prorated in the opening and final billing periods — actual_days_in_period, enum.

