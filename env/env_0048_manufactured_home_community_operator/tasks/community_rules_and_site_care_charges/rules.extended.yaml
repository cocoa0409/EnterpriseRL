      admin_courtesy_mid_share: 0.25
    rule: >
      A self-help charge is posted for a violation notice the community cured itself, dated the day the contractor performed the work and referenced to that notice; the notice charged is the violation notice most recently served on the plan record, and the work date is the date of the most recent cure outcome recorded as cured by the community.
      The contractor invoices self-help work at the community's contract visit rates: lawn_visit_rate for a lawn and landscaping cure, debris_haul_rate for a debris and storage cure and snow_visit_rate for a snow and ice cure, one visit per cure, and the contractor's cost is that visit rate.
      The standard self-help charge is the contractor's cost plus the plan's self_help_admin_fee, rounded half up to the cent.
      For lawn and snow cures the visit rate is scaled by the lot class named on the site lease: by premium_lot_factor on a Lakefront or Greenbelt multi-section lot and by multi_section_lot_factor on a Standard or Preferred multi-section lot; a debris cure, or a cure on a single-section lot, is not scaled for lot size.
      The visit rate is also scaled by the contract market of the community named on the site lease: by northern_market_factor at Cedar Hollow and Conestoga Meadows, by southwest_market_factor at Bluebonnet Ridge and Saguaro Vista, and not at all at Willow Bend Estates and Palmetto Shores.
      The scaled visit cost is the contract visit rate times the lot-size scale and times the contract market scale.
      A lawn cure is billed by how long the lawn went uncured, counted in calendar days from the notice's cure deadline to the work date: more than double_cut_days days is billed as two visits; from heavy_cut_days through double_cut_days days it is billed as heavy_cut_multiplier visits, that visit cost rounded up to the next whole dollar; fewer days, and every debris or snow cure, is billed as one visit.
      A lawn cure includes edging: when the plan in force includes trimming but no plan fee is dated within the edging_window_months calendar month ending on the handling date, edging is added at edging_contract_charge; when the plan in force does not include trimming, edging is added at edging_standard_charge; otherwise, and for every debris or snow cure, no edging is added.
      The contractor's cost is then the billed visits plus any edging, rounded half up to the cent.
      The administration fee rises with the self-help charges already on the plan record's statement dated within the recurrence_window_months calendar months ending on the handling date: admin_fee_third_plus for two or more such charges, admin_fee_second for exactly one, and the plan's self_help_admin_fee for none.
      An administration-fee courtesy is taken off the administration fee by tenure, counted in whole calendar months from the lease move-in date to the handling date, and by returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: admin_courtesy_long_share with at least admin_courtesy_long_months of tenure and no returned payment; admin_courtesy_mid_share when that does not hold but the resident has at least admin_courtesy_mid_months of tenure and at most one returned payment; nothing otherwise.
      The self-help charge is the contractor's cost plus the administration fee less its courtesy, rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: history
        reads: [variant_name, community_name, move_in_date, lease_ledger.event_type, lease_ledger.entry_date]
        note: The site lease's lot class and community scale the contract visit rate, and its move-in date with the returned payments on its ledger decide the administration-fee courtesy.
    compute:
      - self_help_notice_class: "LATEST('rules_records', 'rule_class', date_field='record_date', event_type='rules_violation_notice')"
      - contract_visit_rate: "K('lawn_visit_rate') if self_help_notice_class == 'lawn_and_landscaping' else (K('debris_haul_rate') if self_help_notice_class == 'debris_and_storage' else K('snow_visit_rate'))"
      - self_help_lot_class: "CFIELD('lease', 'variant_name')"
      - lot_size_factor: "K('premium_lot_factor') if ((self_help_notice_class == 'lawn_and_landscaping' or self_help_notice_class == 'snow_and_ice') and (self_help_lot_class == 'Lakefront Multi-Section Home Site' or self_help_lot_class == 'Greenbelt Multi-Section Home Site')) else (K('multi_section_lot_factor') if ((self_help_notice_class == 'lawn_and_landscaping' or self_help_notice_class == 'snow_and_ice') and (self_help_lot_class == 'Standard Multi-Section Home Site' or self_help_lot_class == 'Preferred Multi-Section Home Site')) else 1)"
      - contract_market_community: "CFIELD('lease', 'community_name')"
      - contract_market_factor: "K('northern_market_factor') if (contract_market_community == 'Cedar Hollow' or contract_market_community == 'Conestoga Meadows') else (K('southwest_market_factor') if (contract_market_community == 'Bluebonnet Ridge' or contract_market_community == 'Saguaro Vista') else 1)"
      - scaled_visit_cost: "contract_visit_rate * lot_size_factor * contract_market_factor"
      - self_help_notice_deadline: "LATEST('rules_records', 'cure_deadline', date_field='record_date', event_type='rules_violation_notice')"
      - self_help_work_date: "LATEST('rules_records', 'record_date', date_field='record_date', event_type='rules_cure_confirmation', cure_outcome='cured_by_community')"
      - days_uncured_to_work: "DAYS(self_help_notice_deadline, self_help_work_date)"
      - billed_visits_cost: "(scaled_visit_cost * 2) if (self_help_notice_class == 'lawn_and_landscaping' and days_uncured_to_work > K('double_cut_days')) else ((0 - ((0 - scaled_visit_cost * K('heavy_cut_multiplier')) // 1)) if (self_help_notice_class == 'lawn_and_landscaping' and days_uncured_to_work >= K('heavy_cut_days')) else scaled_visit_cost)"
      - edging_plan_fees: "COUNT('rules_ledger', within_months=K('edging_window_months'), date_field='entry_date', event_type='rules_plan_fee')"
      - edging_charge: "K('edging_contract_charge') if (self_help_notice_class == 'lawn_and_landscaping' and P('trimming_included') == True and edging_plan_fees == 0) else (K('edging_standard_charge') if (self_help_notice_class == 'lawn_and_landscaping' and P('trimming_included') == False) else 0)"
      - self_help_contractor_cost: "RND(billed_visits_cost + edging_charge, 2)"
      - prior_self_help_charges: "COUNT('rules_ledger', within_months=K('recurrence_window_months'), date_field='entry_date', event_type='rules_self_help_charge')"
      - self_help_administration_fee: "K('admin_fee_third_plus') if prior_self_help_charges >= 2 else (K('admin_fee_second') if prior_self_help_charges == 1 else P('self_help_admin_fee'))"
      - admin_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - admin_lease_returns: "XCOUNT('lease', 'lease_ledger', within_months=K('returned_payment_window_months'), date_field='entry_date', event_type='lease_payment_return')"
      - admin_courtesy_share: "K('admin_courtesy_long_share') if (admin_tenure_months >= K('admin_courtesy_long_months') and admin_lease_returns == 0) else (K('admin_courtesy_mid_share') if (admin_tenure_months >= K('admin_courtesy_mid_months') and admin_lease_returns <= 1) else 0)"
      - result: "RND(self_help_contractor_cost + self_help_administration_fee * (1 - admin_courtesy_share), 2)"
    compute_basis:
      self_help_notice_class: "A self-help charge is posted for a violation notice the community cured itself, dated the day the contractor performed the work and referenced to that notice; the notice charged is the violation notice most recently served on the plan record, and the work date is the date of the most recent cure outcome recorded as cured by the community."
