            value: "0"
        baseline:
          lawn_crew_sanitation: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: registration_history_credit
        effect: parameter
        decides: registration_history_credit
        bindings: [registration_fees_on_record, registration_history_credit]
        ladder:
          - when: "history_credit_long_count or more registration-year fees already on the statement"
            value: "K('history_credit_long')"
          - when: "history_credit_mid_count or more but fewer than history_credit_long_count such fees"
            value: "K('history_credit_mid')"
          - when: "otherwise (fewer than history_credit_mid_count)"
            value: "0"
        baseline:
          registration_history_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: pet_incident_recency
        effect: parameter
        decides: pet_incident_surcharge
        bindings: [latest_pets_notice, pets_notice_age_days, pet_incident_surcharge]
        ladder:
          - when: "the most recent pets-class violation notice was served incident_recent_days days or fewer before the handling date"
            value: "K('incident_recent_surcharge')"
          - when: "it was served more than incident_recent_days but no more than incident_earlier_days days before"
            value: "K('incident_earlier_surcharge')"
          - when: "otherwise (older, or no pets-class notice)"
            value: "0"
        baseline:
          pet_incident_surcharge: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: registration_tenure_courtesy
        effect: method
        decides: registration_fee_after_courtesy
        bindings: [registration_tenure_months, registration_lease_returns, registration_fee_after_courtesy]
        ladder:
          - when: "tenure since the lease move-in date of at least courtesy_long_months and no returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date"
            method: "the fee is half the subtotal, rounded down to the whole dollar"
          - when: "the first condition does not hold, tenure is at least courtesy_mid_months and at most one returned payment is on the site-lease ledger in that window"
            method: "the fee is courtesy_mid_multiplier times the subtotal, rounded up to the whole dollar"
          - when: "otherwise"
            method: "the fee is the subtotal as computed"
        baseline:
          registration_fee_after_courtesy: "registration_subtotal"
        evidence: [cross_category, date]
        cross_difficulty: lease
    baseline:
      rule: >-
        A registration-year fee is charged for each registered pet for each calendar registration year, dated the registration date in the pet's first year and January 1 in later years, and carrying the pet's name as registered and the year it covers.
        The standard registration-year fee is pet_registration_fee_annual for each pet, stated in dollars and cents.
        The registration-year fee is posted rounded half up to the cent.
      params: [pet_registration_fee_annual]
