      registration_split_tenure: "A household with two or more registered pets may carry part of its registration-year pet fees dated within the registration_window_months calendar months ending on the handling date: split_share_established of those fees with at least split_tenure_months of tenure, split_share_newer of them with fewer; a household with fewer than two registered pets carries none."
      registration_carry: "A household with two or more registered pets may carry part of its registration-year pet fees dated within the registration_window_months calendar months ending on the handling date: split_share_established of those fees with at least split_tenure_months of tenure, split_share_newer of them with fewer; a household with fewer than two registered pets carries none."
      advance_lease_returns: "A resident with returned site-rent payments prepays plan fees with the payment: advance_months_two_plus months of the plan fee in force for two or more returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, advance_months_one month for exactly one, and none for none."
      plan_fee_advance: "A resident with returned site-rent payments prepays plan fees with the payment: advance_months_two_plus months of the plan fee in force for two or more returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, advance_months_one month for exactly one, and none for none."
