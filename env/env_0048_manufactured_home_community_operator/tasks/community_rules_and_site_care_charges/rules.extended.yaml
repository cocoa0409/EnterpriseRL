      admin_lease_returns: "An administration-fee courtesy is taken off the administration fee by tenure, counted in whole calendar months from the lease move-in date to the handling date, and by returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: admin_courtesy_long_share with at least admin_courtesy_long_months of tenure and no returned payment; admin_courtesy_mid_share when that does not hold but the resident has at least admin_courtesy_mid_months of tenure and at most one returned payment; nothing otherwise."
