# Community Rules & Site Care charter — Hearthstone Communities.
# Every leased site carries a site-care plan record under the community Rules and Regulations: the
# plan the resident chose (from maintaining the site themselves up to complete site care) decides
# which upkeep is the community's job and which is the resident's, and the record carries the
# rule notices, self-help maintenance charges, pet and vehicle registrations and plan fees.

category: rules
display_name: Community Rules & Site Care

binding:
  holding_table: rules_site_plans
  event_tables: [rules_ledger, rules_records]
  intake_tables: [rules_appeals]
  status_field: status
  variant_field: variant_name
  quantity_fields: {rules_balance: rules_receivable}

lifecycle:
  states: [enrolled, service_suspended, ended]
  transitions:
    - {from: enrolled, to: service_suspended, by: system, means: "Plan services stop because plan fees have gone unpaid past the suspension threshold; upkeep reverts to the resident."}
    - {from: service_suspended, to: enrolled, by: system, means: "Every past-due plan fee is paid and plan services resume."}
    - {from: enrolled, to: ended, by: system, means: "The site lease ends and the plan record closes."}
    - {from: service_suspended, to: ended, by: system, means: "The site lease ends while plan services are suspended and the plan record closes."}

accounts:
  - key: rules_receivable
    unit: USD
    meaning: Amount the resident owes on the rules and site-care statement — plan fees, self-help maintenance charges, repeat-violation charges, pet registration fees and extra-vehicle permit fees, less payments and waivers.

parameter_schema:
  plan_fee_monthly: Monthly fee for the site-care plan, USD per month (0.00 on the self-maintained site).
  plan_fee_due_day: Day of the month on which the plan fee for that month is charged and due, integer day of month.
  plan_minimum_term_months: Months a plan must run from its last change before it may be lowered or dropped, integer months (0 where no minimum applies).
  plan_change_notice_days: Fewest calendar days between a plan-change request and the first day of the month it takes effect, integer days.
  plan_changes_per_12_months: Most plan changes in any trailing 12 months, integer.
  snow_season_lock_months: Calendar months during which a plan that includes snow removal may not be lowered to one without it, list of month numbers.
  mowing_included: Whether the community's contractor mows the site, boolean.
  mowing_frequency_days: Days between scheduled mowings in the growing season, integer days; not_applicable where mowing is not included.
  trimming_included: Whether edging and shrub trimming are included, boolean.
  fertilization_included: Whether lawn fertilization and weed control are included, boolean.
  fertilization_applications_per_year: Fertilization and weed-control applications per calendar year, integer.
  leaf_removal_included: Whether autumn leaf removal is included, boolean.
  snow_removal_included: Whether driveway and walk snow removal is included, boolean.
  snow_trigger_inches: Snowfall depth that triggers plan snow removal, inches; not_applicable where snow removal is not included.
  gutter_cleaning_included: Whether gutters are cleaned twice a year, boolean.
  exterior_wash_included: Whether the skirting and siding are washed once a year, boolean.
  debris_hauls_per_year: Bulk debris pickups from the site included per calendar year, integer.
  grass_height_limit_inches: Grass height above which a site breaches the lawn rule, inches.
  snow_clearing_deadline_hours: Hours after snowfall ends within which a resident responsible for their own snow removal must clear walks and the driveway apron, integer hours.
  cure_days_by_rule_class: Calendar days after a violation notice within which each class of violation must be cured, mapping of rule class to days.
  self_help_rule_classes: Rule classes in which the community may perform an uncured cure itself and charge the resident, list.
  self_help_admin_fee: Administration fee added to the contractor cost of each self-help cure, USD.
  self_help_cost_basis: What the self-help charge is built from — contractor_invoice (the invoice of the contractor who did the work), enum.
  repeat_violation_window_months: Trailing window within which a later notice in the same rule class counts as a repeat, integer months.
  repeat_violation_charge_second: Charge for the second notice in the same rule class within the window, where repeat charges are permitted, USD.
  repeat_violation_charge_third_plus: Charge for each third and later notice in the same rule class within the window, where repeat charges are permitted, USD.
  notices_before_manager_referral: Notices in the same rule class within the window at which the matter is referred to the community manager for lease enforcement, integer.
  max_pets: Most pets (excluding service and assistance animals) a household may keep, integer.
  pet_weight_limit_lbs: Largest adult weight of a dog permitted, pounds (service and assistance animals excepted).
  pet_registration_fee_annual: Registration fee per pet per registration year, USD.
  pet_registration_year_basis: The year a registration covers — calendar_year, enum.
  pet_registration_due_days: Calendar days after a pet joins the household within which it must be registered, integer days.
  assistance_animal_fee_exempt: Whether service and assistance animals are exempt from registration fees and the pet limit, boolean.
  vehicles_included: Registered vehicles a site may park without a permit fee, integer.
  extra_vehicle_permit_fee_monthly: Monthly permit fee for each registered vehicle beyond those included, USD per vehicle per month.
  max_vehicles: Most registered vehicles a site may park, integer.
  rv_boat_parking_on_site_allowed: Whether a recreational vehicle, boat or trailer may be parked on the home site beyond loading and unloading, boolean.
  loading_unloading_hours: Hours an RV, boat or trailer may stand on the site for loading or unloading, integer hours.
  guest_registration_after_days: Consecutive days after which a guest's stay must be registered, integer days.
  guest_max_consecutive_days: Most consecutive days a registered guest may stay before applying as an occupant on the lease, integer days.
  charge_due_days: Calendar days after a rules charge is posted by which it is due, integer days.
  late_fee_on_rule_charges: Whether a late fee is charged on unpaid rules and site-care charges, boolean.
  plan_service_suspension_days_past_due: Days a plan fee may remain unpaid after its due day before plan services are suspended, integer days.
  appeal_window_days: Calendar days after a charge is posted within which the resident may appeal it, integer days.
  appeal_decision_days: Calendar days after an appeal is received within which the community manager decides it, integer days.
  accepted_payment_channels: Channels through which rules and site-care charges are paid, list of channel codes.
  amount_rounding: Rounding applied to every computed charge — half_up_to_cent, enum.
  plan_fee_proration: How the plan fee is handled in a part month — not_prorated (plans start and change on the first of a month and end at the end of the month the lease ends), enum.

