      self_help_work_date: "A self-help charge is posted for a violation notice the community cured itself, dated the day the contractor performed the work and referenced to that notice; the notice charged is the violation notice most recently served on the plan record, and the work date is the date of the most recent cure outcome recorded as cured by the community."
      days_uncured_to_work: "A lawn cure is billed by how long the lawn went uncured, counted in calendar days from the notice's cure deadline to the work date: more than double_cut_days days is billed as two visits; from heavy_cut_days through double_cut_days days it is billed as heavy_cut_multiplier visits, that visit cost rounded up to the next whole dollar; fewer days, and every debris or snow cure, is billed as one visit."
      billed_visits_cost: "A lawn cure is billed by how long the lawn went uncured, counted in calendar days from the notice's cure deadline to the work date: more than double_cut_days days is billed as two visits; from heavy_cut_days through double_cut_days days it is billed as heavy_cut_multiplier visits, that visit cost rounded up to the next whole dollar; fewer days, and every debris or snow cure, is billed as one visit."
