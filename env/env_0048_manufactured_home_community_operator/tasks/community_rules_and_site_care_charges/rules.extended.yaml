events:
  - type: rules_plan_enrollment
    target: rules_site_plans
    mutation: create
    meaning: A newly signed site lease receives its site-care plan record, starting on the self-maintained site unless the resident chose a plan at signing.
    grain: One row per site lease.
    fields:
      customer_id: The leaseholder.
      lease_id: The site lease covered.
      variant_name: Site-care plan in force.
      plan_start_date: The lease move-in date.
      last_plan_change_date: Date the current plan took effect (the move-in date at enrollment).
    triggers: []
  - type: rules_plan_change
    target: rules_site_plans
    mutation: update
    meaning: The resident moves to a different site-care plan, effective the first day of a month.
    grain: One row per transaction.
    fields:
      variant_name: New site-care plan.
      last_plan_change_date: First day of the month the new plan takes effect.
    triggers: []
  - type: rules_registration_change
    target: rules_site_plans
    mutation: update
    meaning: The household registers or removes a pet, assistance animal or vehicle.
    grain: One row per transaction.
    fields:
      registered_pet_count: Registered pets after the change.
      assistance_animal_count: Registered service or assistance animals after the change.
      registered_vehicle_count: Registered vehicles after the change.
    triggers: []
  - type: rules_service_suspension
    target: rules_site_plans
    mutation: {transition: {from: enrolled, to: service_suspended}}
    meaning: Plan services stop because plan fees have gone unpaid past the threshold.
    grain: One row per transaction.
    fields:
      status: Set to service_suspended.
    triggers: []
  - type: rules_service_reinstatement
    target: rules_site_plans
    mutation: {transition: {from: service_suspended, to: enrolled}}
    meaning: Past-due plan fees are paid and plan services resume.
    grain: One row per transaction.
    fields:
      status: Set to enrolled.
    triggers: []
  - type: rules_plan_end
    target: rules_site_plans
    mutation: {transition: [{from: enrolled, to: ended}, {from: service_suspended, to: ended}]}
    meaning: The site lease ends and the plan record closes.
    grain: One row per transaction.
    fields:
      status: Set to ended.
      plan_end_date: Date the lease ended.
    triggers: []

  - type: rules_plan_fee
    target: rules_ledger
    meaning: The monthly site-care plan fee is charged.
    grain: One row per plan record per month.
    distinguish_by: [billing_period]
    fields:
      rules_plan_id: Plan record charged.
      billing_period: Month charged, YYYY-MM.
      entry_date: The plan fee due day of that month.
      amount: Fee, positive.
    account: rules_receivable
    direction: in
    triggers: []
  - type: rules_self_help_charge
    target: rules_ledger
    meaning: The community cures an uncured violation itself and charges the contractor's cost plus the administration fee.
    grain: One row per violation notice cured by the community.
    distinguish_by: [source_record_id]
    fields:
      rules_plan_id: Plan record charged.
      entry_date: Date the cure was performed.
      source_record_id: The violation notice cured.
      contractor_cost: Contractor's invoice for the work.
      amount: Charge, positive (contractor cost plus administration fee).
    account: rules_receivable
    direction: in
    triggers: []
  - type: rules_repeat_violation_charge
    target: rules_ledger
    meaning: A repeat-violation charge is posted for a second or later notice in the same rule class within the window, where the community permits such charges.
    grain: One row per repeat notice.
    distinguish_by: [source_record_id]
    fields:
      rules_plan_id: Plan record charged.
      entry_date: Date of the repeat notice.
      source_record_id: The repeat violation notice.
      violation_sequence: Place of the notice in the sequence within the window.
      amount: Charge, positive.
    account: rules_receivable
    direction: in
    triggers: []
  - type: rules_pet_registration_fee
    target: rules_ledger
    meaning: The annual registration fee for one pet is charged.
    grain: One row per pet per registration year.
    distinguish_by: [registration_year, pet_name]
    fields:
      rules_plan_id: Plan record charged.
      entry_date: Date of registration (or of the annual renewal).
      registration_year: Calendar year the registration covers.
      pet_name: Pet's name as registered.
      amount: Fee, positive.
    account: rules_receivable
    direction: in
    triggers: []
  - type: rules_vehicle_permit_fee
    target: rules_ledger
    meaning: The monthly permit fee for registered vehicles beyond those included is charged.
    grain: One row per plan record per month.
    distinguish_by: [billing_period]
    fields:
      rules_plan_id: Plan record charged.
      billing_period: Month charged, YYYY-MM.
      entry_date: The plan fee due day of that month.
      permit_count: Vehicles beyond those included.
      amount: Fee, positive.
    account: rules_receivable
    direction: in
    triggers: []
  - type: rules_payment
    target: rules_ledger
    meaning: A payment toward the rules and site-care statement is received.
    grain: One row per payment.
    distinguish_by: [payment_ref]
    fields:
      rules_plan_id: Plan record credited.
      entry_date: Date received.
      amount: Payment, positive.
      payment_channel: Channel the payment arrived through.
      payment_ref: Serial number or processor confirmation number of the payment.
    account: rules_receivable
    direction: out
    triggers: []
  - type: rules_charge_waiver
    target: rules_ledger
    meaning: A rules charge is waived in full — an appeal upheld, a charge for upkeep the plan covered, or a billing error.
    grain: One row per charge waived.
    distinguish_by: [source_entry_id]
    fields:
      rules_plan_id: Plan record credited.
      entry_date: Date waived.
      source_entry_id: The charge waived.
      waiver_basis: Basis of the waiver.
      amount: Amount waived, positive (the whole charge).
    account: rules_receivable
    direction: out
    triggers: []

  - type: rules_violation_notice
    target: rules_records
    meaning: A written notice of a rule violation is served on the resident, stating the rule class and the cure deadline.
    grain: One row per notice.
    distinguish_by: [record_date, rule_class]
    fields:
      rules_plan_id: Plan record of the site.
      record_date: Date the notice was served.
      rule_class: Class of the rule breached.
      cure_deadline: Last day to cure.
      violation_sequence: Place of the notice among notices in the same class within the window.
    triggers: []
  - type: rules_cure_confirmation
    target: rules_records
    meaning: The outcome of a violation notice is recorded after inspection — cured by the resident, cured by the community, or withdrawn.
    grain: One row per violation notice.
    distinguish_by: [source_record_id]
    fields:
      rules_plan_id: Plan record of the site.
      record_date: Date of the outcome.
      source_record_id: The violation notice.
      cure_outcome: How the notice ended.
    triggers:
      - event: rules:rules_self_help_charge
        when: {cure_outcome: cured_by_community}
        map: {source_record_id: source_record_id, entry_date: record_date}
  - type: rules_plan_election
    target: rules_records
    meaning: The resident's election of a different site-care plan is recorded with the first day of the month it takes effect.
    grain: One row per plan election.
    distinguish_by: [effective_date]
    fields:
      rules_plan_id: Plan record of the site.
      record_date: Date the election was made.
      elected_plan: Site-care plan elected.
      effective_date: First day of the month the elected plan takes effect.
    triggers:
      - event: rules:rules_plan_change
        map: {variant_name: elected_plan, last_plan_change_date: effective_date}
  - type: rules_guest_registration
    target: rules_records
    meaning: A guest staying beyond the registration threshold is registered.
    grain: One row per guest stay.
    distinguish_by: [stay_start_date, guest_name]
    fields:
      rules_plan_id: Plan record of the site.
      record_date: Date registered.
      guest_name: Guest's full name as given.
      stay_start_date: First day of the stay.
      stay_end_date: Planned last day of the stay.
    triggers: []
  - type: rules_appeal_decision
    target: rules_records
    meaning: The community manager decides a resident's appeal of a rules charge.
    grain: One row per charge appealed.
    distinguish_by: [appealed_entry_id]
    fields:
      rules_plan_id: Plan record of the site.
      record_date: Date of the decision.
      appealed_entry_id: The charge appealed.
      appeal_outcome: Upheld or denied.
    triggers:
      - event: rules:rules_charge_waiver
        when: {appeal_outcome: upheld}
        map: {source_entry_id: appealed_entry_id, entry_date: record_date, waiver_basis: appeal_upheld}

measures:
  - id: rules_msr_class_notices
    window: Trailing repeat_violation_window_months calendar months ending on (and including) the date of the notice being counted.
    measure: Count of rules_violation_notice rows on the plan record in the same rule_class, including the notice being counted, excluding notices whose rules_cure_confirmation outcome is withdrawn_plan_responsibility or withdrawn_on_appeal.
  - id: rules_msr_plan_changes_12m
    window: Trailing 12 calendar months ending on (and including) the requested effective date.
    measure: Count of rules_plan_election rows on the plan record whose effective_date falls in the window, the requested change included.
  - id: rules_msr_plan_fee_days_past_due
    window: From the due day of the oldest unpaid plan fee to the handling date.
    measure: Calendar days the oldest plan fee not covered by payments (applied oldest charge first) has been unpaid; zero when every plan fee is paid.

policies:
  - id: rules_agg_multi_holding
    subject: [rules_plan_enrollment]
    rule: >-
      Each leased site carries exactly one site-care plan record, and a record belongs to exactly one lease.
      The lease has no other plan record in enrolled or service_suspended status.
      A customer holds two plan records only while relocating between sites, when the old site's lease has not yet ended; never more than two.
    eligibility:
      - id: one_plan_per_lease
        applies_to: [rules_plan_enrollment]
        kind: dedup
        condition: The lease has no other plan record in enrolled or service_suspended status.
        evidence_fields: [rules_site_plans.lease_id, rules_site_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rules_site_plans.lease_id]
          action_bindings:
            rules_site_plans.lease_id: lease_id
        dedup_contract:
          table: rules_site_plans
          mode: separate_record
          object_bindings: {lease_id: lease_id}
          duplicate_filters: {status: [enrolled, service_suspended]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: rules_agg_charge_attribution
    subject: [rules_self_help_charge, rules_repeat_violation_charge, rules_payment]
    rule: >-
      When a customer holds two plan records, every notice and charge belongs to the record of the site where the violation occurred, repeat-violation counts run per site and never across sites, and a payment is applied only to the record whose statement it names.
      A rules balance is never moved to the site-lease ledger, the utility account or the security deposit.
    eligibility: []

  - id: rules_plan_terms
    subject: [rules_plan_enrollment, rules_plan_election, rules_plan_change, rules_plan_fee]
    rule: >-
      A plan record opens on the lease move-in date on the Self-Maintained Site unless the resident chose another plan at signing, and choosing or changing a plan is the resident's own election.
      The plan chosen must be one whose entry gate admits the site's community; the Full Lawn & Snow Care Plan is offered only at Cedar Hollow and Conestoga Meadows.
      The plan fee is charged on the plan_fee_due_day of each month the plan is in force and is not prorated (plan_fee_proration); a plan starting mid-month is first charged on the first day of the following month.
      A plan is changed only while the record is enrolled.
      A change takes effect on the first day of the first month that begins at least plan_change_notice_days calendar days after the request, and no more than plan_changes_per_12_months changes may take effect in the trailing 12 months (rules_msr_plan_changes_12m).
      A plan may be lowered or dropped only after its plan_minimum_term_months counted from the last plan change date.
      The minimum term is counted in calendar months from the last plan change date, and the plan may be lowered from the first month that begins on or after the day the term completes.
      During the snow_season_lock_months a plan that includes snow removal may not be changed to one without it; moving up to a higher plan is never restricted by the minimum term or the snow season.
    eligibility:
      - id: plan_change_enrolled
        applies_to: [rules_plan_election, rules_plan_change]
        kind: state
        condition: A plan is changed only while the record is enrolled.
        evidence_fields: [rules_site_plans.rules_plan_id, rules_site_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rules_site_plans.rules_plan_id]
          action_bindings:
            rules_site_plans.rules_plan_id: rules_plan_id
        state_contract:
          field: rules_site_plans.status
          allowed: [enrolled]
      - id: minimum_term_served
        applies_to: [rules_plan_election]
        kind: time
        condition: A plan may be lowered or dropped only after its plan_minimum_term_months counted from the last plan change date.
        evidence_fields: [rules_site_plans.rules_plan_id, rules_site_plans.last_plan_change_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rules_site_plans.rules_plan_id]
          action_bindings:
            rules_site_plans.rules_plan_id: rules_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the last plan change date
          anchor_source: rules_site_plans.last_plan_change_date
          relation: not_before
          duration_source: variants.plan_minimum_term_months
          unit: calendar_months
          counting_rule: The minimum term is counted in calendar months from the last plan change date, and the plan may be lowered from the first month that begins on or after the day the term completes.
          boundary: inclusive
    params:
      per_tier:
        Self-Maintained Site: {plan_fee_monthly: =plan_fee_monthly, plan_minimum_term_months: =plan_minimum_term_months}
        Lawn Mowing Plan: {plan_fee_monthly: =plan_fee_monthly, plan_minimum_term_months: =plan_minimum_term_months}
        Lawn & Trim Plan: {plan_fee_monthly: =plan_fee_monthly, plan_minimum_term_months: =plan_minimum_term_months}
        Full Lawn Care Plan: {plan_fee_monthly: =plan_fee_monthly, plan_minimum_term_months: =plan_minimum_term_months}
        Full Lawn & Snow Care Plan: {plan_fee_monthly: =plan_fee_monthly, plan_minimum_term_months: =plan_minimum_term_months}
        Complete Site Care Plan: {plan_fee_monthly: =plan_fee_monthly, plan_minimum_term_months: =plan_minimum_term_months}
    measures: [rules_msr_plan_changes_12m]

  - id: rules_violation_process
    subject: [rules_violation_notice, rules_cure_confirmation]
    rule: >-
      A violation notice is served in writing for one rule class and states a cure deadline equal to the notice date plus the days listed for that class in cure_days_by_rule_class.
      The plan in force on the notice date decides responsibility: a lawn notice for grass above grass_height_limit_inches when mowing_included is true, a trimming or leaf notice when trimming_included or leaf_removal_included is true, a snow notice when snow_removal_included is true, and a debris notice within the plan's debris_hauls_per_year allowance are the community's own failure, and the notice is withdrawn with outcome withdrawn_plan_responsibility and never charged.
      While plan services are suspended every item is the resident's responsibility.
      Snow and ice on walks and the driveway apron must be cleared within snow_clearing_deadline_hours after snowfall ends by a resident responsible for their own snow.
      Each notice ends with exactly one outcome — cured_by_resident when inspection on or before the deadline finds it cured, cured_by_community when the community performs a self-help cure, or withdrawn_on_appeal.
      When the notices in one class within the window (rules_msr_class_notices) reach notices_before_manager_referral, the matter goes to the community manager for lease enforcement, which the resident desk does not handle.
      Noise, conduct and safety complaints are not cured through this process; they go to the community manager.
    eligibility: []
    params:
      per_tier:
        Self-Maintained Site: {mowing_included: =mowing_included, snow_removal_included: =snow_removal_included, debris_hauls_per_year: =debris_hauls_per_year}
        Lawn Mowing Plan: {mowing_included: =mowing_included, snow_removal_included: =snow_removal_included, debris_hauls_per_year: =debris_hauls_per_year}
        Lawn & Trim Plan: {mowing_included: =mowing_included, snow_removal_included: =snow_removal_included, debris_hauls_per_year: =debris_hauls_per_year}
        Full Lawn Care Plan: {mowing_included: =mowing_included, snow_removal_included: =snow_removal_included, debris_hauls_per_year: =debris_hauls_per_year}
        Full Lawn & Snow Care Plan: {mowing_included: =mowing_included, snow_removal_included: =snow_removal_included, debris_hauls_per_year: =debris_hauls_per_year}
        Complete Site Care Plan: {mowing_included: =mowing_included, snow_removal_included: =snow_removal_included, debris_hauls_per_year: =debris_hauls_per_year}
    measures: [rules_msr_class_notices]

  - id: rules_self_help_terms
    subject: [rules_self_help_charge]
    rule: >-
      The community may cure a violation itself only for a rule class listed in self_help_rule_classes and only when the item is the resident's responsibility under the plan in force.
      Self-help may be performed only after the cure deadline has passed, counted from the violation notice date.
      The cure period is counted in calendar days starting the day after the notice date, the deadline day itself still belongs to the resident, and self-help may be performed from the following day.
      The charge is the contractor's invoice (self_help_cost_basis) plus the plan's self_help_admin_fee, rounded half up to the cent, posted on the date of the work and referenced to the notice.
      A notice withdrawn as the community's responsibility, or cured by the resident on or before the deadline, is never charged.
    eligibility:
      - id: cure_deadline_passed
        applies_to: [rules_self_help_charge]
        kind: time
        condition: Self-help may be performed only after the cure deadline has passed, counted from the violation notice date.
        evidence_fields: [rules_records.rules_record_id, rules_records.record_date, rules_records.rule_class, rules_records.cure_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rules_records.rules_record_id]
          action_bindings:
            rules_records.rules_record_id: source_record_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the violation notice date
          anchor_source: rules_records.record_date
          relation: not_before
          duration_source: variants.cure_days_by_rule_class
          unit: calendar_days
          counting_rule: The cure period is counted in calendar days starting the day after the notice date, the deadline day itself still belongs to the resident, and self-help may be performed from the following day.
          boundary: exclusive
    params:
      per_tier:
        Self-Maintained Site: {self_help_admin_fee: =self_help_admin_fee}
        Lawn Mowing Plan: {self_help_admin_fee: =self_help_admin_fee}
        Lawn & Trim Plan: {self_help_admin_fee: =self_help_admin_fee}
        Full Lawn Care Plan: {self_help_admin_fee: =self_help_admin_fee}
        Full Lawn & Snow Care Plan: {self_help_admin_fee: =self_help_admin_fee}
        Complete Site Care Plan: {self_help_admin_fee: =self_help_admin_fee}
    formula:
      self_help_charge: round(contractor_cost + self_help_admin_fee, 2)

  - id: rules_repeat_violation_terms
    subject: [rules_repeat_violation_charge]
    rule: >-
      A repeat-violation charge is posted only in a community listed as permitting it in repeat_charges_permitted, and only for a notice that is the second or later in the same rule class within repeat_violation_window_months (rules_msr_class_notices) after an earlier notice in that class was cured or charged.
      The second notice is charged repeat_violation_charge_second and each later notice repeat_violation_charge_third_plus.
      No repeat charge is posted for a notice withdrawn as the community's responsibility, and withdrawn notices are not counted.
      In a community not permitting repeat charges, repeated violations are enforced only through manager referral.
    eligibility: []
    params:
      repeat_charges_permitted:
        Willow Bend Estates: false
        Palmetto Shores: false
        Saguaro Vista: true
        Bluebonnet Ridge: true
        Cedar Hollow: true
        Conestoga Meadows: false
    measures: [rules_msr_class_notices]
    formula:
      repeat_charge: repeat_violation_charge_second if violation_sequence == 2 else repeat_violation_charge_third_plus

  - id: rules_pet_terms
    subject: [rules_pet_registration_fee, rules_registration_change]
    rule: >-
      Every pet must be registered within pet_registration_due_days calendar days of joining the household, and a household may keep no more than max_pets pets; a dog whose adult weight exceeds pet_weight_limit_lbs may not be kept.
      Registrations and removals are made only while the plan record is enrolled or service_suspended.
      Each registered pet is charged pet_registration_fee_annual for each registration year (pet_registration_year_basis), on the registration date in its first year and on January 1 in later years; the fee is never prorated and never refunded when the pet leaves.
      Service animals and assistance animals documented under fair-housing rules are registered without any fee, do not count toward max_pets and are not subject to the weight limit (assistance_animal_fee_exempt); a pet fee charged on such an animal is waived in full with waiver_basis assistance_animal.
    eligibility:
      - id: registration_record_open
        applies_to: [rules_registration_change]
        kind: state
        condition: Registrations and removals are made only while the plan record is enrolled or service_suspended.
        evidence_fields: [rules_site_plans.rules_plan_id, rules_site_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rules_site_plans.rules_plan_id]
          action_bindings:
            rules_site_plans.rules_plan_id: rules_plan_id
        state_contract:
          field: rules_site_plans.status
          allowed: [enrolled, service_suspended]
    formula:
      pet_fee: pet_registration_fee_annual

  - id: rules_vehicle_terms
    subject: [rules_vehicle_permit_fee, rules_registration_change]
    rule: >-
      A site may park up to vehicles_included registered vehicles without a fee and no more than max_vehicles in all; every vehicle parked on the site must be registered, operable and currently licensed.
      For each registered vehicle beyond vehicles_included, extra_vehicle_permit_fee_monthly is charged on the plan fee due day of each month it is registered, not prorated.
      A recreational vehicle, boat or trailer may stand on the home site only for loading or unloading of up to loading_unloading_hours (rv_boat_parking_on_site_allowed is false); longer storage belongs in a Hearthstone storage yard, and a unit left longer is a vehicles_and_parking violation.
    eligibility: []
    formula:
      permit_fee: extra_vehicle_permit_fee_monthly * max(registered_vehicle_count - vehicles_included, 0)

  - id: rules_guest_terms
    subject: [rules_guest_registration]
    rule: >-
      A guest staying more than guest_registration_after_days consecutive days must be registered, without charge, by the resident.
      A registered guest may stay no more than guest_max_consecutive_days consecutive days; a guest who will stay longer must apply and be screened as an occupant on the lease, and until approved the stay beyond that limit is an occupancy violation handled by the community manager.
      A guest is never charged an occupant charge while registered as a guest.
    eligibility: []

  - id: rules_charge_billing
    subject: [rules_payment, rules_charge_waiver, rules_appeal_decision]
    rule: >-
      Rules and site-care charges are due charge_due_days calendar days after posting, paid through the accepted_payment_channels and applied to the oldest charge first; no late fee is ever charged on them (late_fee_on_rule_charges is false).
      A resident may appeal a self-help, repeat-violation, pet or vehicle charge on the grounds that the item was the plan's responsibility, was cured on or before the deadline, the notice was never served, the amount is wrong, or the animal is an assistance animal.
      An appeal must be received no later than appeal_window_days calendar days after the date of the charge appealed.
      The appeal window is counted in calendar days starting the day after the charge date, and an appeal received on the last day is in time.
      The community manager decides an appeal within appeal_decision_days calendar days; an upheld appeal waives the whole charge (waiver_basis appeal_upheld) and a denied appeal leaves it due.
      A charge posted for an item the plan covered is waived in full with waiver_basis plan_coverage whether or not appealed, and a charge posted in error with waiver_basis billing_error.
      A charge that already carries a waiver is not waived again.
      Plan fees are not appealable; a disputed plan fee is a billing correction.
    eligibility:
      - id: appeal_in_time
        applies_to: [rules_appeal_decision]
        kind: time
        condition: An appeal must be received no later than appeal_window_days calendar days after the date of the charge appealed.
        evidence_fields: [rules_ledger.rules_entry_id, rules_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rules_ledger.rules_entry_id]
          action_bindings:
            rules_ledger.rules_entry_id: appealed_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the charge appealed
          anchor_source: rules_ledger.entry_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: The appeal window is counted in calendar days starting the day after the charge date, and an appeal received on the last day is in time.
          boundary: inclusive
      - id: charge_not_already_waived
        applies_to: [rules_charge_waiver]
        kind: dedup
        condition: A charge that already carries a waiver is not waived again.
        evidence_fields: [rules_ledger.source_entry_id, rules_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rules_ledger.source_entry_id]
          action_bindings:
            rules_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: rules_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [rules_charge_waiver]}
          distinct_fields: []

  - id: rules_service_suspension_terms
    subject: [rules_service_suspension, rules_service_reinstatement, rules_plan_end]
    rule: >-
      Plan services are suspended when the oldest unpaid plan fee has been unpaid for plan_service_suspension_days_past_due days after its due day (rules_msr_plan_fee_days_past_due); while suspended, no plan fee is charged, the plan's upkeep is not performed and every item becomes the resident's responsibility.
      Plan services resume on the day every past-due plan fee is paid, and plan fees resume from the next month.
      The plan record ends on the day the site lease ends, whatever its status; the plan fee for the month the lease ends is still charged, and charges then owed stay due from the former resident.
    eligibility: []
    measures: [rules_msr_plan_fee_days_past_due]


# ============================================================================
# extended_policies — community_rules_and_site_care_charges
# ============================================================================
extended_policies:
  - id: rules_ext_vehicle_permit_fee
    base_policy_refs: [rules_vehicle_terms, rules_violation_process]
    overwrite:
      - base_policy: rules_vehicle_terms
        superseded_clause: >-
          A site may park up to vehicles_included registered vehicles without a fee
        replaced_by: >-
          The permit-free allowance follows the household registered on the site lease: a household of exactly one adult occupant on a single-section home site has one vehicle fewer than vehicles_included permit-free, a household of large_household_adults or more adult occupants on a multi-section home site has one vehicle more than vehicles_included permit-free, and every other household has vehicles_included permit-free.
      - base_policy: rules_vehicle_terms
        superseded_clause: >-
          For each registered vehicle beyond vehicles_included, extra_vehicle_permit_fee_monthly is charged on the plan fee due day of each month it is registered, not prorated.
        replaced_by: >-
          The permit charge and the parking-notice surcharge are added together first, the permit courtesy reduction is then taken once from that sum, and the monthly vehicle permit fee is that result rounded half up to the cent; it is never prorated.
    trigger: state_due
    subject: [rules_vehicle_permit_fee]
    computes: amount
    target_tool: post_vehicle_permit_fee_c6960799
    params:
      large_household_adults: 3
      overflow_lot_rate: 20.00
      prospectus_rate: 12.00
      further_permit_multiplier: 2
      double_driveway_share: 0.5
      notice_window_months: 12
      notice_surcharge_two_plus: 10.00
      notice_surcharge_one: 5.00
      courtesy_long_months: 180
      courtesy_mid_months: 84
      courtesy_long_share: 0.25
      courtesy_mid_share: 0.10
    rule: >
      The monthly vehicle permit fee of a site-care plan record is charged for each month in which the site carries more registered vehicles than its permit-free allowance, dated the plan fee due day of that month and referenced to that month as its billing period.
      The standard permit-free allowance is vehicles_included registered vehicles.
      The permits charged for a month are the registered vehicles on the plan record less the permit-free allowance, and never fewer than zero.
      The standard permit rate is extra_vehicle_permit_fee_monthly for each permit.
      The standard monthly vehicle permit fee is the permits charged times the standard permit rate, rounded half up to the cent.
      The permit-free allowance follows the household registered on the site lease: a household of exactly one adult occupant on a single-section home site has one vehicle fewer than vehicles_included permit-free, a household of large_household_adults or more adult occupants on a multi-section home site has one vehicle more than vehicles_included permit-free, and every other household has vehicles_included permit-free.
      The permit rate follows the community named on the site lease: at Cedar Hollow and Conestoga Meadows, where extra vehicles park in the plowed overflow lot, the permit rate is overflow_lot_rate; at Willow Bend Estates and Palmetto Shores the permit rate is prospectus_rate, the rate disclosed in the community prospectus; at every other community the permit rate is extra_vehicle_permit_fee_monthly.
      The permits are priced by how the site holds the extra vehicles: when two or more permits are charged, the first permit is charged the permit rate and each further permit further_permit_multiplier times the permit rate; when exactly one permit is charged on a multi-section home site, whose double-width driveway holds the extra vehicle on the site, that permit is charged double_driveway_share of the permit rate, rounded up to the next whole dollar; otherwise each permit is charged the permit rate.
      A parking-notice surcharge is added for every permit charged: notice_surcharge_two_plus per permit when the plan record carries two or more violation notices in the vehicles and parking class served within the notice_window_months calendar months ending on the handling date, notice_surcharge_one per permit when it carries exactly one such notice, and nothing when it carries none.
      A resident whose site lease is enrolled in autopay receives a permit courtesy reduction by tenure, counted in whole calendar months from the lease move-in date to the handling date: courtesy_long_share of the fee with at least courtesy_long_months of tenure, and courtesy_mid_share of the fee with at least courtesy_mid_months but fewer than courtesy_long_months of tenure; a resident whose lease is not enrolled in autopay, or who has fewer than courtesy_mid_months of tenure, receives no reduction.
      The permit charge and the parking-notice surcharge are added together first, the permit courtesy reduction is then taken once from that sum, and the monthly vehicle permit fee is that result rounded half up to the cent; it is never prorated.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [adult_occupant_count, home_section_type, community_name, move_in_date, autopay_enrolled]
        note: The site lease's household, home section, community, move-in date and autopay enrollment decide the permit-free allowance, the further-permit pricing, the permit rate and the permit courtesy tier.
    compute:
      - household_adults: "CFIELD('lease', 'adult_occupant_count')"
      - household_section: "CFIELD('lease', 'home_section_type')"
      - permit_free_allowance: "(P('vehicles_included') - 1) if (household_adults == 1 and household_section == 'single_section') else ((P('vehicles_included') + 1) if (household_adults >= K('large_household_adults') and household_section == 'multi_section') else P('vehicles_included'))"
      - permits_due: "MX(F('registered_vehicle_count') - permit_free_allowance, 0)"
      - site_community: "CFIELD('lease', 'community_name')"
      - permit_rate: "K('overflow_lot_rate') if (site_community == 'Cedar Hollow' or site_community == 'Conestoga Meadows') else (K('prospectus_rate') if (site_community == 'Willow Bend Estates' or site_community == 'Palmetto Shores') else P('extra_vehicle_permit_fee_monthly'))"
      - driveway_section: "CFIELD('lease', 'home_section_type')"
      - permit_charge: "(permit_rate + (permits_due - 1) * permit_rate * K('further_permit_multiplier')) if permits_due >= 2 else ((0 - ((0 - permit_rate * K('double_driveway_share')) // 1)) if (permits_due == 1 and driveway_section == 'multi_section') else permits_due * permit_rate)"
      - parking_notices: "COUNT('rules_records', within_months=K('notice_window_months'), date_field='record_date', event_type='rules_violation_notice', rule_class='vehicles_and_parking')"
      - parking_notice_surcharge: "(K('notice_surcharge_two_plus') if parking_notices >= 2 else (K('notice_surcharge_one') if parking_notices == 1 else 0)) * permits_due"
      - permit_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - permit_lease_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - permit_courtesy_share: "K('courtesy_long_share') if (permit_tenure_months >= K('courtesy_long_months') and permit_lease_autopay == True) else (K('courtesy_mid_share') if (permit_tenure_months >= K('courtesy_mid_months') and permit_lease_autopay == True) else 0)"
      - result: "RND((permit_charge + parking_notice_surcharge) * (1 - permit_courtesy_share), 2)"
    compute_basis:
      household_adults: "The permit-free allowance follows the household registered on the site lease: a household of exactly one adult occupant on a single-section home site has one vehicle fewer than vehicles_included permit-free, a household of large_household_adults or more adult occupants on a multi-section home site has one vehicle more than vehicles_included permit-free, and every other household has vehicles_included permit-free."
      household_section: "The permit-free allowance follows the household registered on the site lease: a household of exactly one adult occupant on a single-section home site has one vehicle fewer than vehicles_included permit-free, a household of large_household_adults or more adult occupants on a multi-section home site has one vehicle more than vehicles_included permit-free, and every other household has vehicles_included permit-free."
      permit_free_allowance: "The permit-free allowance follows the household registered on the site lease: a household of exactly one adult occupant on a single-section home site has one vehicle fewer than vehicles_included permit-free, a household of large_household_adults or more adult occupants on a multi-section home site has one vehicle more than vehicles_included permit-free, and every other household has vehicles_included permit-free."
      permits_due: "The permits charged for a month are the registered vehicles on the plan record less the permit-free allowance, and never fewer than zero."
      site_community: "The permit rate follows the community named on the site lease: at Cedar Hollow and Conestoga Meadows, where extra vehicles park in the plowed overflow lot, the permit rate is overflow_lot_rate; at Willow Bend Estates and Palmetto Shores the permit rate is prospectus_rate, the rate disclosed in the community prospectus; at every other community the permit rate is extra_vehicle_permit_fee_monthly."
      permit_rate: "The permit rate follows the community named on the site lease: at Cedar Hollow and Conestoga Meadows, where extra vehicles park in the plowed overflow lot, the permit rate is overflow_lot_rate; at Willow Bend Estates and Palmetto Shores the permit rate is prospectus_rate, the rate disclosed in the community prospectus; at every other community the permit rate is extra_vehicle_permit_fee_monthly."
      driveway_section: "The permits are priced by how the site holds the extra vehicles: when two or more permits are charged, the first permit is charged the permit rate and each further permit further_permit_multiplier times the permit rate; when exactly one permit is charged on a multi-section home site, whose double-width driveway holds the extra vehicle on the site, that permit is charged double_driveway_share of the permit rate, rounded up to the next whole dollar; otherwise each permit is charged the permit rate."
      permit_charge: "The permits are priced by how the site holds the extra vehicles: when two or more permits are charged, the first permit is charged the permit rate and each further permit further_permit_multiplier times the permit rate; when exactly one permit is charged on a multi-section home site, whose double-width driveway holds the extra vehicle on the site, that permit is charged double_driveway_share of the permit rate, rounded up to the next whole dollar; otherwise each permit is charged the permit rate."
      parking_notices: "A parking-notice surcharge is added for every permit charged: notice_surcharge_two_plus per permit when the plan record carries two or more violation notices in the vehicles and parking class served within the notice_window_months calendar months ending on the handling date, notice_surcharge_one per permit when it carries exactly one such notice, and nothing when it carries none."
      parking_notice_surcharge: "A parking-notice surcharge is added for every permit charged: notice_surcharge_two_plus per permit when the plan record carries two or more violation notices in the vehicles and parking class served within the notice_window_months calendar months ending on the handling date, notice_surcharge_one per permit when it carries exactly one such notice, and nothing when it carries none."
      permit_tenure_months: "A resident whose site lease is enrolled in autopay receives a permit courtesy reduction by tenure, counted in whole calendar months from the lease move-in date to the handling date: courtesy_long_share of the fee with at least courtesy_long_months of tenure, and courtesy_mid_share of the fee with at least courtesy_mid_months but fewer than courtesy_long_months of tenure; a resident whose lease is not enrolled in autopay, or who has fewer than courtesy_mid_months of tenure, receives no reduction."
      permit_lease_autopay: "A resident whose site lease is enrolled in autopay receives a permit courtesy reduction by tenure, counted in whole calendar months from the lease move-in date to the handling date: courtesy_long_share of the fee with at least courtesy_long_months of tenure, and courtesy_mid_share of the fee with at least courtesy_mid_months but fewer than courtesy_long_months of tenure; a resident whose lease is not enrolled in autopay, or who has fewer than courtesy_mid_months of tenure, receives no reduction."
      permit_courtesy_share: "A resident whose site lease is enrolled in autopay receives a permit courtesy reduction by tenure, counted in whole calendar months from the lease move-in date to the handling date: courtesy_long_share of the fee with at least courtesy_long_months of tenure, and courtesy_mid_share of the fee with at least courtesy_mid_months but fewer than courtesy_long_months of tenure; a resident whose lease is not enrolled in autopay, or who has fewer than courtesy_mid_months of tenure, receives no reduction."
      result: "The permit charge and the parking-notice surcharge are added together first, the permit courtesy reduction is then taken once from that sum, and the monthly vehicle permit fee is that result rounded half up to the cent; it is never prorated."
    factors:
      - id: household_allowance
        effect: parameter
        decides: permit_free_allowance
        bindings: [household_adults, household_section, permit_free_allowance]
        ladder:
          - when: "exactly one adult occupant is registered on the site lease and the home on the site is single-section"
            value: "P('vehicles_included') - 1"
          - when: "large_household_adults or more adult occupants are registered on the site lease and the home on the site is multi-section"
            value: "P('vehicles_included') + 1"
          - when: "otherwise"
            value: "P('vehicles_included')"
        baseline:
          permit_free_allowance: "P('vehicles_included')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: community_permit_rate
        effect: parameter
        decides: permit_rate
        bindings: [site_community, permit_rate]
        ladder:
          - when: "the site lease names Cedar Hollow or Conestoga Meadows"
            value: "K('overflow_lot_rate')"
          - when: "the site lease names Willow Bend Estates or Palmetto Shores"
            value: "K('prospectus_rate')"
          - when: "otherwise"
            value: "P('extra_vehicle_permit_fee_monthly')"
        baseline:
          permit_rate: "P('extra_vehicle_permit_fee_monthly')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: further_permit_pricing
        effect: method
        decides: permit_charge
        bindings: [driveway_section, permit_charge]
        ladder:
          - when: "two or more permits are charged"
            method: "the first permit is charged the permit rate and each further permit further_permit_multiplier times the permit rate"
          - when: "exactly one permit is charged and the home on the site is multi-section"
            method: "that permit is charged double_driveway_share of the permit rate, rounded up to the next whole dollar"
          - when: "otherwise (exactly one permit on a single-section site, or none)"
            method: "each permit is charged the permit rate"
        baseline:
          permit_charge: "permits_due * permit_rate"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: parking_notice_surcharge
        effect: parameter
        decides: parking_notice_surcharge
        bindings: [parking_notices, parking_notice_surcharge]
        ladder:
          - when: "two or more vehicles and parking violation notices served within the notice_window_months calendar months ending on the handling date"
            value: "K('notice_surcharge_two_plus') per permit"
          - when: "exactly one such notice"
            value: "K('notice_surcharge_one') per permit"
          - when: "otherwise (no such notice)"
            value: "0"
        baseline:
          parking_notice_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: autopay_tenure_courtesy
        effect: parameter
        decides: permit_courtesy_share
        bindings: [permit_tenure_months, permit_lease_autopay, permit_courtesy_share]
        ladder:
          - when: "the site lease is enrolled in autopay and tenure since the lease move-in date is at least courtesy_long_months"
            value: "K('courtesy_long_share')"
          - when: "the site lease is enrolled in autopay and tenure is at least courtesy_mid_months but fewer than courtesy_long_months"
            value: "K('courtesy_mid_share')"
          - when: "otherwise (no autopay on the lease, or tenure below courtesy_mid_months)"
            value: "0"
        baseline:
          permit_courtesy_share: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
    baseline:
      rule: >-
        The monthly vehicle permit fee of a site-care plan record is charged for each month in which the site carries more registered vehicles than its permit-free allowance, dated the plan fee due day of that month and referenced to that month as its billing period.
        The standard permit-free allowance is vehicles_included registered vehicles.
        The permits charged for a month are the registered vehicles on the plan record less the permit-free allowance, and never fewer than zero.
        The standard permit rate is extra_vehicle_permit_fee_monthly for each permit.
        The standard monthly vehicle permit fee is the permits charged times the standard permit rate, rounded half up to the cent.
      params: [vehicles_included, extra_vehicle_permit_fee_monthly]
    inputs:
      history:
        - {table: rules_records, aggregate: count, field: rules_record_id, within_months: 12, filters: {event_type: rules_violation_notice, rule_class: vehicles_and_parking}}
      cross_category: [lease]

  - id: rules_ext_pet_registration_fee
    base_policy_refs: [rules_pet_terms, rules_violation_process, rules_plan_terms]
    overwrite:
      - base_policy: rules_pet_terms
        superseded_clause: >-
          Each registered pet is charged pet_registration_fee_annual for each registration year (pet_registration_year_basis)
        replaced_by: >-
          The household pet rate, the pet-conduct surcharge, the lawn-crew sanitation surcharge and the pet-incident surcharge are added together first, the registration-history credit is then subtracted, and that subtotal is never less than zero.
    trigger: state_due
    subject: [rules_pet_registration_fee]
    computes: amount
    target_tool: post_pet_registration_fee_a0279ba6
    params:
      multi_pet_small_yard_rate: 40.00
      multi_pet_rate: 35.00
      conduct_window_months: 12
      conduct_surcharge_two_plus: 30.00
      conduct_surcharge_one: 15.00
      sanitation_window_months: 1
      sanitation_full_lawn: 15.00
      sanitation_mowing: 10.00
      history_credit_long_count: 6
      history_credit_mid_count: 3
      history_credit_long: 10.00
      history_credit_mid: 5.00
      incident_recent_days: 60
      incident_earlier_days: 180
      incident_recent_surcharge: 20.00
      incident_earlier_surcharge: 10.00
      returned_payment_window_months: 12
      courtesy_long_months: 180
      courtesy_mid_months: 60
      courtesy_mid_multiplier: 0.75
    rule: >
      A registration-year fee is charged for each registered pet for each calendar registration year, dated the registration date in the pet's first year and January 1 in later years, and carrying the pet's name as registered and the year it covers.
      The standard registration-year fee is pet_registration_fee_annual for each pet, stated in dollars and cents.
      The household pet rate replaces the standard registration-year fee by the household's registered pets and the home section recorded on the site lease: when the registered pets on the plan record have reached max_pets and the home on the site is single-section, the household pet rate is multi_pet_small_yard_rate; when the registered pets have reached max_pets and the home is multi-section, it is multi_pet_rate; otherwise it is pet_registration_fee_annual.
      A pet-conduct surcharge is added by the violation notices in the pets class served within the conduct_window_months calendar months ending on the handling date: conduct_surcharge_two_plus for two or more such notices, conduct_surcharge_one for exactly one, and nothing for none.
      A lawn-crew sanitation surcharge is added while the plan's crew tends the lawn: when the plan in force includes fertilization and a plan fee is dated within the sanitation_window_months calendar month ending on the handling date, sanitation_full_lawn; when the plan in force includes mowing but not fertilization and a plan fee is dated within that month, sanitation_mowing; otherwise nothing.
      A registration-history credit is taken off by the registration-year fees already on the plan record's statement for any of the household's pets: history_credit_long for history_credit_long_count or more such fees, history_credit_mid for history_credit_mid_count or more but fewer than history_credit_long_count, and nothing for fewer.
      A pet-incident surcharge is added by the days from the most recent pets-class violation notice to the handling date: incident_recent_surcharge when that is incident_recent_days days or fewer, incident_earlier_surcharge when it is more than incident_recent_days but no more than incident_earlier_days days, and nothing when it is longer or no such notice exists.
      The household pet rate, the pet-conduct surcharge, the lawn-crew sanitation surcharge and the pet-incident surcharge are added together first, the registration-history credit is then subtracted, and that subtotal is never less than zero.
      A registration tenure courtesy then settles the fee from that subtotal, tenure counted in whole calendar months from the lease move-in date to the handling date and returned payments counted on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least courtesy_long_months of tenure and no returned payment, the fee is half the subtotal rounded down to the whole dollar; when that does not hold but the resident has at least courtesy_mid_months of tenure and at most one returned payment, the fee is courtesy_mid_multiplier times the subtotal rounded up to the whole dollar; otherwise the fee is the subtotal.
      The registration-year fee is posted rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: history
        reads: [home_section_type, move_in_date, lease_ledger.event_type, lease_ledger.entry_date]
        note: The site lease's home section decides the household pet rate, and its move-in date with the returned payments on its ledger decide the registration tenure courtesy.
    compute:
      - pets_at_limit: "F('registered_pet_count') >= P('max_pets')"
      - yard_section: "CFIELD('lease', 'home_section_type')"
      - household_pet_rate: "K('multi_pet_small_yard_rate') if (pets_at_limit and yard_section == 'single_section') else (K('multi_pet_rate') if (pets_at_limit and yard_section == 'multi_section') else P('pet_registration_fee_annual'))"
      - pets_class_notices: "COUNT('rules_records', within_months=K('conduct_window_months'), date_field='record_date', event_type='rules_violation_notice', rule_class='pets')"
      - pet_conduct_surcharge: "K('conduct_surcharge_two_plus') if pets_class_notices >= 2 else (K('conduct_surcharge_one') if pets_class_notices == 1 else 0)"
      - crew_plan_fees: "COUNT('rules_ledger', within_months=K('sanitation_window_months'), date_field='entry_date', event_type='rules_plan_fee')"
      - lawn_crew_sanitation: "K('sanitation_full_lawn') if (P('fertilization_included') == True and crew_plan_fees >= 1) else (K('sanitation_mowing') if (P('mowing_included') == True and P('fertilization_included') == False and crew_plan_fees >= 1) else 0)"
      - registration_fees_on_record: "COUNT('rules_ledger', event_type='rules_pet_registration_fee')"
      - registration_history_credit: "K('history_credit_long') if registration_fees_on_record >= K('history_credit_long_count') else (K('history_credit_mid') if registration_fees_on_record >= K('history_credit_mid_count') else 0)"
      - latest_pets_notice: "LATEST('rules_records', 'record_date', date_field='record_date', event_type='rules_violation_notice', rule_class='pets')"
      - pets_notice_age_days: "DAYS(latest_pets_notice, NOW) if latest_pets_notice else K('incident_earlier_days') + 1"
      - pet_incident_surcharge: "K('incident_recent_surcharge') if pets_notice_age_days <= K('incident_recent_days') else (K('incident_earlier_surcharge') if pets_notice_age_days <= K('incident_earlier_days') else 0)"
      - registration_subtotal: "MX(household_pet_rate + pet_conduct_surcharge + lawn_crew_sanitation + pet_incident_surcharge - registration_history_credit, 0)"
      - registration_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - registration_lease_returns: "XCOUNT('lease', 'lease_ledger', within_months=K('returned_payment_window_months'), date_field='entry_date', event_type='lease_payment_return')"
      - registration_fee_after_courtesy: "int(registration_subtotal / 2) if (registration_tenure_months >= K('courtesy_long_months') and registration_lease_returns == 0) else ((0 - ((0 - registration_subtotal * K('courtesy_mid_multiplier')) // 1)) if (registration_tenure_months >= K('courtesy_mid_months') and registration_lease_returns <= 1) else registration_subtotal)"
      - result: "RND(registration_fee_after_courtesy, 2)"
