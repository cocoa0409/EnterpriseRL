  - id: rules_ext_past_due_payment
    base_policy_refs: [rules_agg_charge_attribution, rules_charge_billing]
    overwrite:
      - base_policy: rules_charge_billing
        superseded_clause: >-
          Rules and site-care charges are due charge_due_days calendar days after posting
        replaced_by: >-
          A charge counts as past due once posted_window_standard_months full calendar month has passed since the date it is dated, so the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due.
    trigger: on_request
    subject: [rules_payment]
    computes: amount
    target_tool: pay_site_care_past_due_0b8b512f
    params:
      posted_window_standard_months: 1
      posted_window_long_months: 2
      coverage_long_tenure_months: 120
      returned_payment_window_months: 12
      carryover_long_months: 180
      carryover_mid_months: 60
      carryover_long: 10.00
      carryover_mid: 5.00
      registration_window_months: 12
      split_tenure_months: 60
      split_share_established: 0.5
      split_share_newer: 0.25
      advance_months_two_plus: 2
      advance_months_one: 1
    rule: >
      A resident whose plan record is enrolled and who asks to pay the past-due part of the rules and site-care statement pays it in person through the resident portal, the payment naming the plan record whose statement it pays and being applied to the oldest charge first.
      The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it.
      A charge counts as past due once posted_window_standard_months full calendar month has passed since the date it is dated, so the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due.
      The standard past-due payment is the statement balance less the charges not yet past due, never less than zero, rounded half up to the cent.
      The past-due window follows the resident's standing on the site lease: when the lease is under a certified-funds-only restriction or carries a site-rent balance owing, every charge on the statement counts as past due; when neither holds and the resident has at least coverage_long_tenure_months of tenure with at most one returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, the charges dated within the posted_window_long_months calendar months ending on the handling date are not yet past due; otherwise the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due.
      A carry-over allowance may stay on the statement by tenure, counted in whole calendar months from the lease move-in date to the handling date: carryover_long with at least carryover_long_months of tenure, carryover_mid with at least carryover_mid_months but fewer than carryover_long_months, and nothing with fewer.
      A household with two or more registered pets may carry part of its registration-year pet fees dated within the registration_window_months calendar months ending on the handling date: split_share_established of those fees with at least split_tenure_months of tenure, split_share_newer of them with fewer; a household with fewer than two registered pets carries none.
      A resident with returned site-rent payments prepays plan fees with the payment: advance_months_two_plus months of the plan fee in force for two or more returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, advance_months_one month for exactly one, and none for none.
      The carry-over allowance and the registration-fee carry are subtracted from the past-due amount first, that remainder is never less than zero, the plan-fee advance is then added, and the payment is rounded half up to the cent.
      The past-due amount is worked out only after the statement carries a vehicle permit fee for every month in which the site's registered vehicles exceeded its permit-free allowance.
      The past-due amount is not worked out until the statement carries a registration-year fee for every registered pet in every registration year it has been registered.
    prerequisite:
      - problem: rules_ext_vehicle_permit_fee
        kind: value_input
        gate: statement_balance
        form: state
        policy_source: >-
          The past-due amount is worked out only after the statement carries a vehicle permit fee for every month in which the site's registered vehicles exceeded its permit-free allowance.
        condition: >-
          The plan record's statement carries a vehicle permit fee entry for every billing month in which the registered vehicles on the plan record exceeded the permit-free allowance.
        resolved_by: post_vehicle_permit_fee_c6960799
        effect: >-
          Once the missing month's vehicle permit fee is on the statement, the statement balance rises by that fee and the past-due amount with it, because the fee is dated in an earlier month and is already past due.
      - problem: rules_ext_pet_registration_fee
        kind: value_input
        gate: registration_carry
        form: state
        policy_source: >-
          The past-due amount is not worked out until the statement carries a registration-year fee for every registered pet in every registration year it has been registered.
        condition: >-
          The plan record's statement carries a pet registration fee entry, carrying the pet's name and the registration year, for every registered pet in every registration year it has been registered.
        resolved_by: post_pet_registration_fee_a0279ba6
        effect: >-
          Once the missing registration-year fee is on the statement, the statement balance rises by that fee and the registration-fee carry rises by the household's share of it, so the past-due payment changes.
    cross_category:
      - category: lease
        as: history
        reads: [payment_restriction, rent_balance, move_in_date, lease_ledger.event_type, lease_ledger.entry_date]
        note: The site lease's restriction, rent balance, move-in date and the returned payments on its ledger decide the past-due window, the carry-over allowance, the registration-fee carry and the plan-fee advance.
    compute:
      - plan_fees_total: "SUM('rules_ledger', 'amount', event_type='rules_plan_fee')"
      - self_help_total: "SUM('rules_ledger', 'amount', event_type='rules_self_help_charge')"
      - repeat_charges_total: "SUM('rules_ledger', 'amount', event_type='rules_repeat_violation_charge')"
      - pet_fees_total: "SUM('rules_ledger', 'amount', event_type='rules_pet_registration_fee')"
      - permit_fees_total: "SUM('rules_ledger', 'amount', event_type='rules_vehicle_permit_fee')"
      - payments_total: "SUM('rules_ledger', 'amount', event_type='rules_payment')"
      - waivers_total: "SUM('rules_ledger', 'amount', event_type='rules_charge_waiver')"
      - statement_balance: "plan_fees_total + self_help_total + repeat_charges_total + pet_fees_total + permit_fees_total - payments_total - waivers_total"
      - charges_dated_standard_window: "SUM('rules_ledger', 'amount', within_months=K('posted_window_standard_months'), date_field='entry_date', event_type='rules_plan_fee') + SUM('rules_ledger', 'amount', within_months=K('posted_window_standard_months'), date_field='entry_date', event_type='rules_self_help_charge') + SUM('rules_ledger', 'amount', within_months=K('posted_window_standard_months'), date_field='entry_date', event_type='rules_repeat_violation_charge') + SUM('rules_ledger', 'amount', within_months=K('posted_window_standard_months'), date_field='entry_date', event_type='rules_pet_registration_fee') + SUM('rules_ledger', 'amount', within_months=K('posted_window_standard_months'), date_field='entry_date', event_type='rules_vehicle_permit_fee')"
      - charges_dated_long_window: "SUM('rules_ledger', 'amount', within_months=K('posted_window_long_months'), date_field='entry_date', event_type='rules_plan_fee') + SUM('rules_ledger', 'amount', within_months=K('posted_window_long_months'), date_field='entry_date', event_type='rules_self_help_charge') + SUM('rules_ledger', 'amount', within_months=K('posted_window_long_months'), date_field='entry_date', event_type='rules_repeat_violation_charge') + SUM('rules_ledger', 'amount', within_months=K('posted_window_long_months'), date_field='entry_date', event_type='rules_pet_registration_fee') + SUM('rules_ledger', 'amount', within_months=K('posted_window_long_months'), date_field='entry_date', event_type='rules_vehicle_permit_fee')"
      - window_lease_restriction: "CFIELD('lease', 'payment_restriction')"
      - window_rent_balance: "CFIELD('lease', 'rent_balance')"
      - window_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - window_lease_returns: "XCOUNT('lease', 'lease_ledger', within_months=K('returned_payment_window_months'), date_field='entry_date', event_type='lease_payment_return')"
      - charges_not_yet_past_due: "0 if (window_lease_restriction == 'certified_funds_only' or window_rent_balance > 0) else (charges_dated_long_window if (window_tenure_months >= K('coverage_long_tenure_months') and window_lease_returns <= 1) else charges_dated_standard_window)"
      - past_due_amount: "MX(statement_balance - charges_not_yet_past_due, 0)"
      - carryover_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - carryover_allowance: "K('carryover_long') if carryover_tenure_months >= K('carryover_long_months') else (K('carryover_mid') if carryover_tenure_months >= K('carryover_mid_months') else 0)"
      - registration_fees_in_window: "SUM('rules_ledger', 'amount', within_months=K('registration_window_months'), date_field='entry_date', event_type='rules_pet_registration_fee')"
      - registration_split_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - registration_carry: "registration_fees_in_window * (K('split_share_established') if (F('registered_pet_count') >= 2 and registration_split_tenure >= K('split_tenure_months')) else (K('split_share_newer') if F('registered_pet_count') >= 2 else 0))"
      - advance_lease_returns: "XCOUNT('lease', 'lease_ledger', within_months=K('returned_payment_window_months'), date_field='entry_date', event_type='lease_payment_return')"
      - plan_fee_advance: "P('plan_fee_monthly') * (K('advance_months_two_plus') if advance_lease_returns >= 2 else (K('advance_months_one') if advance_lease_returns == 1 else 0))"
      - result: "RND(MX(past_due_amount - carryover_allowance - registration_carry, 0) + plan_fee_advance, 2)"
    compute_basis:
      plan_fees_total: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      self_help_total: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      repeat_charges_total: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      pet_fees_total: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      permit_fees_total: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      payments_total: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      waivers_total: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      statement_balance: "The statement balance is every plan fee, self-help charge, repeat-violation charge, pet registration fee and vehicle permit fee on the plan record's statement, less every payment and waiver on it."
      charges_dated_standard_window: "A charge counts as past due once posted_window_standard_months full calendar month has passed since the date it is dated, so the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due."
      charges_dated_long_window: "The past-due window follows the resident's standing on the site lease: when the lease is under a certified-funds-only restriction or carries a site-rent balance owing, every charge on the statement counts as past due; when neither holds and the resident has at least coverage_long_tenure_months of tenure with at most one returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, the charges dated within the posted_window_long_months calendar months ending on the handling date are not yet past due; otherwise the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due."
      window_lease_restriction: "The past-due window follows the resident's standing on the site lease: when the lease is under a certified-funds-only restriction or carries a site-rent balance owing, every charge on the statement counts as past due; when neither holds and the resident has at least coverage_long_tenure_months of tenure with at most one returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, the charges dated within the posted_window_long_months calendar months ending on the handling date are not yet past due; otherwise the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due."
      window_rent_balance: "The past-due window follows the resident's standing on the site lease: when the lease is under a certified-funds-only restriction or carries a site-rent balance owing, every charge on the statement counts as past due; when neither holds and the resident has at least coverage_long_tenure_months of tenure with at most one returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, the charges dated within the posted_window_long_months calendar months ending on the handling date are not yet past due; otherwise the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due."
