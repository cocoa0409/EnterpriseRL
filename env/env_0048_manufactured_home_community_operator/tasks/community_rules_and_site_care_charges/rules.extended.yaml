      charges_not_yet_past_due: "The past-due window follows the resident's standing on the site lease: when the lease is under a certified-funds-only restriction or carries a site-rent balance owing, every charge on the statement counts as past due; when neither holds and the resident has at least coverage_long_tenure_months of tenure with at most one returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, the charges dated within the posted_window_long_months calendar months ending on the handling date are not yet past due; otherwise the charges dated within the posted_window_standard_months calendar month ending on the handling date are not yet past due."
