      crew_plan_fees: "A lawn-crew sanitation surcharge is added while the plan's crew tends the lawn: when the plan in force includes fertilization and a plan fee is dated within the sanitation_window_months calendar month ending on the handling date, sanitation_full_lawn; when the plan in force includes mowing but not fertilization and a plan fee is dated within that month, sanitation_mowing; otherwise nothing."
      lawn_crew_sanitation: "A lawn-crew sanitation surcharge is added while the plan's crew tends the lawn: when the plan in force includes fertilization and a plan fee is dated within the sanitation_window_months calendar month ending on the handling date, sanitation_full_lawn; when the plan in force includes mowing but not fertilization and a plan fee is dated within that month, sanitation_mowing; otherwise nothing."
