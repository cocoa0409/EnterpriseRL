        - {table: rules_ledger, aggregate: count, field: rules_entry_id, within_months: 1, filters: {event_type: rules_plan_fee}}
        - {table: rules_ledger, aggregate: count, field: rules_entry_id, filters: {event_type: rules_pet_registration_fee}}
        - {category: lease, table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_payment_return}}
