      contract_market_factor: "The visit rate is also scaled by the contract market of the community named on the site lease: by northern_market_factor at Cedar Hollow and Conestoga Meadows, by southwest_market_factor at Bluebonnet Ridge and Saguaro Vista, and not at all at Willow Bend Estates and Palmetto Shores."
