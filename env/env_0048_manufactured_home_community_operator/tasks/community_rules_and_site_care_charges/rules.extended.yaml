      - id: past_due_window
        effect: method
        decides: charges_not_yet_past_due
        bindings: [window_lease_restriction, window_rent_balance, window_tenure_months, window_lease_returns, charges_dated_long_window, charges_not_yet_past_due]
        ladder:
          - when: "the site lease is under a certified-funds-only restriction or carries a site-rent balance owing"
            method: "no charge is held back: every charge on the statement counts as past due"
          - when: "neither holds, and tenure is at least coverage_long_tenure_months with at most one returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date"
            method: "the charges dated within the posted_window_long_months calendar months ending on the handling date are held back as not yet past due"
          - when: "otherwise"
            method: "the charges dated within the posted_window_standard_months calendar month ending on the handling date are held back as not yet past due"
        baseline:
