      edging_charge: "A lawn cure includes edging: when the plan in force includes trimming but no plan fee is dated within the edging_window_months calendar month ending on the handling date, edging is added at edging_contract_charge; when the plan in force does not include trimming, edging is added at edging_standard_charge; otherwise, and for every debris or snow cure, no edging is added."
