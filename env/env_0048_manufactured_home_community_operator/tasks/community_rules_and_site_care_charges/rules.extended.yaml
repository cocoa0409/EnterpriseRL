    factors:
      - id: lot_size_scaling
        effect: parameter
        decides: lot_size_factor
        bindings: [self_help_lot_class, lot_size_factor]
        ladder:
          - when: "a lawn or snow cure on a Lakefront or Greenbelt multi-section lot"
            value: "K('premium_lot_factor')"
          - when: "a lawn or snow cure on a Standard or Preferred multi-section lot"
            value: "K('multi_section_lot_factor')"
          - when: "otherwise (a debris cure, or a single-section lot)"
            value: "1"
        baseline:
          lot_size_factor: "1"
        evidence: [cross_category, history]
        cross_difficulty: lease
      - id: contract_market_scaling
        effect: parameter
        decides: contract_market_factor
        bindings: [contract_market_community, contract_market_factor]
        ladder:
          - when: "the site lease names Cedar Hollow or Conestoga Meadows"
            value: "K('northern_market_factor')"
          - when: "the site lease names Bluebonnet Ridge or Saguaro Vista"
            value: "K('southwest_market_factor')"
          - when: "otherwise (Willow Bend Estates or Palmetto Shores)"
            value: "1"
        baseline:
          contract_market_factor: "1"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: overgrowth_billing
        effect: method
        decides: billed_visits_cost
        bindings: [self_help_notice_deadline, self_help_work_date, days_uncured_to_work, billed_visits_cost]
        ladder:
          - when: "a lawn cure performed more than double_cut_days calendar days after the cure deadline"
            method: "billed as two visits"
          - when: "a lawn cure performed from heavy_cut_days through double_cut_days days after the deadline"
            method: "billed as heavy_cut_multiplier visits, that visit cost rounded up to the next whole dollar"
          - when: "otherwise (fewer days, or a debris or snow cure)"
            method: "billed as one visit"
        baseline:
          billed_visits_cost: "scaled_visit_cost"
        evidence: [history, date]
        cross_difficulty: null
      - id: edging_addition
        effect: parameter
        decides: edging_charge
        bindings: [edging_plan_fees, edging_charge]
        ladder:
          - when: "a lawn cure where the plan in force includes trimming but no plan fee is dated within the edging_window_months calendar month ending on the handling date"
            value: "K('edging_contract_charge')"
          - when: "a lawn cure where the plan in force does not include trimming"
            value: "K('edging_standard_charge')"
          - when: "otherwise (crew tending the site, or a debris or snow cure)"
            value: "0"
        baseline:
          edging_charge: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: administration_fee_recurrence
        effect: parameter
        decides: self_help_administration_fee
        bindings: [prior_self_help_charges, self_help_administration_fee]
        ladder:
          - when: "two or more self-help charges on the statement dated within the recurrence_window_months calendar months ending on the handling date"
            value: "K('admin_fee_third_plus')"
          - when: "exactly one such charge"
            value: "K('admin_fee_second')"
          - when: "otherwise (none)"
            value: "P('self_help_admin_fee')"
        baseline:
          self_help_administration_fee: "P('self_help_admin_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: administration_fee_courtesy
        effect: parameter
        decides: admin_courtesy_share
        bindings: [admin_tenure_months, admin_lease_returns, admin_courtesy_share]
        ladder:
          - when: "tenure since the lease move-in date of at least admin_courtesy_long_months and no returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date"
            value: "K('admin_courtesy_long_share')"
          - when: "the first condition does not hold, tenure is at least admin_courtesy_mid_months and at most one returned payment is in that window"
            value: "K('admin_courtesy_mid_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          admin_courtesy_share: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
    baseline:
      rule: >-
        A self-help charge is posted for a violation notice the community cured itself, dated the day the contractor performed the work and referenced to that notice; the notice charged is the violation notice most recently served on the plan record, and the work date is the date of the most recent cure outcome recorded as cured by the community.
        The contractor invoices self-help work at the community's contract visit rates: lawn_visit_rate for a lawn and landscaping cure, debris_haul_rate for a debris and storage cure and snow_visit_rate for a snow and ice cure, one visit per cure, and the contractor's cost is that visit rate.
        The standard self-help charge is the contractor's cost plus the plan's self_help_admin_fee, rounded half up to the cent.
      params: [lawn_visit_rate, debris_haul_rate, snow_visit_rate, self_help_admin_fee]
    inputs:
      history:
        - {table: rules_records, aggregate: latest, field: rule_class, filters: {event_type: rules_violation_notice}}
        - {table: rules_records, aggregate: latest, field: record_date, filters: {event_type: rules_cure_confirmation, cure_outcome: cured_by_community}}
        - {table: rules_ledger, aggregate: count, field: rules_entry_id, within_months: 1, filters: {event_type: rules_plan_fee}}
        - {table: rules_ledger, aggregate: count, field: rules_entry_id, within_months: 12, filters: {event_type: rules_self_help_charge}}
        - {category: lease, table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_payment_return}}
      cross_category: [lease]


  - id: rules_ext_repeat_violation_charge
    base_policy_refs: [rules_repeat_violation_terms, rules_agg_charge_attribution, rules_violation_process]
    overwrite:
      - base_policy: rules_repeat_violation_terms
        superseded_clause: >-
          The second notice is charged repeat_violation_charge_second and each later notice repeat_violation_charge_third_plus.
        replaced_by: >-
          The weighted schedule charge and the cure-cost, lapse and recurrence additions are added together first.
    trigger: state_due
    subject: [rules_repeat_violation_charge]
    computes: amount
    target_tool: post_repeat_violation_charge_7b5daab9
    params:
      hazard_class_weight: 1.5
      upkeep_class_weight: 1.25
      cure_cost_window_months: 12
      cure_cost_addon_two_plus: 40.00
      cure_cost_addon_one: 20.00
      lapse_long_days: 14
      lapse_short_days: 4
      lapse_addon_long: 30.00
      lapse_addon_short: 15.00
      recurrence_fast_months: 2
      recurrence_slow_months: 4
      recurrence_addon_fast: 25.00
      recurrence_addon_slow: 10.00
      cap_long_months: 120
      cap_mid_months: 60
      cap_long: 100.00
      cap_mid: 140.00
      returned_payment_window_months: 12
      courtesy_long_months: 120
      courtesy_mid_months: 60
      courtesy_mid_multiplier: 0.75
    rule: >
      A repeat-violation charge is assessed once the repeat notice has its outcome recorded; it is assessed for the violation notice most recently served on the plan record, dated the day that notice was served, referenced to it and carrying its violation sequence.
      It is assessed only in a community permitting repeat charges, which are Saguaro Vista, Bluebonnet Ridge and Cedar Hollow, and its schedule charge is repeat_violation_charge_second for a notice whose violation sequence is two and repeat_violation_charge_third_plus for a later one, while a notice whose sequence is one carries no charge.
      The standard repeat-violation charge is the schedule charge, rounded half up to the cent.
      The schedule charge is weighted by the rule class of the notice: by hazard_class_weight for snow and ice or vehicles and parking, by upkeep_class_weight for lawn and landscaping or debris and storage, and not at all for every other class.
      A cure-cost addition is made by the self-help charges on the plan record's statement dated within the cure_cost_window_months calendar months ending on the handling date: cure_cost_addon_two_plus for two or more, cure_cost_addon_one for exactly one, and nothing for none.
      A lapse addition is made by the calendar days from the notice's cure deadline to the date of the most recent cure outcome recorded on the plan record: lapse_addon_long for more than lapse_long_days days, lapse_addon_short for lapse_short_days through lapse_long_days days, and nothing for fewer.
      A recurrence addition is made by the cure outcomes recorded on the plan record as cured by the resident or cured by the community within recent calendar months ending on the handling date, the notice's own outcome included and a withdrawn notice never counted: recurrence_addon_fast when two or more such outcomes fall within recurrence_fast_months months, recurrence_addon_slow when fewer than two fall within recurrence_fast_months months but two or more within recurrence_slow_months months, and nothing otherwise.
      The weighted schedule charge and the cure-cost, lapse and recurrence additions are added together first.
      That sum is then capped by tenure, counted in whole calendar months from the lease move-in date to the handling date: at cap_long with at least cap_long_months of tenure, at cap_mid with at least cap_mid_months but fewer than cap_long_months, and uncapped with fewer.
      A repeat-charge tenure courtesy then settles the charge from the capped sum, returned payments counted on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least courtesy_long_months of tenure and no returned payment, half the capped sum rounded down to the whole dollar; when that does not hold but the resident has at least courtesy_mid_months of tenure and at most one returned payment, courtesy_mid_multiplier times the capped sum rounded up to the whole dollar; otherwise the capped sum.
      The repeat-violation charge is posted rounded half up to the cent.
      The repeat-violation charge on a notice is fixed only once each community cure on the plan record has its self-help charge posted.
    prerequisite:
      - problem: rules_ext_self_help_charge
        kind: value_input
        gate: cure_cost_addon
        form: state
        policy_source: >-
          The repeat-violation charge on a notice is fixed only once each community cure on the plan record has its self-help charge posted.
        condition: >-
          Every cure outcome recorded as cured by the community on the plan record has a self-help charge entry on the statement referencing its violation notice.
        resolved_by: post_self_help_charge_892a63af
        effect: >-
          Once the missing self-help charge is on the statement, the self-help charges dated within the cure-cost window rise by one, which moves the cure-cost addition to its next tier.
    cross_category:
      - category: lease
        as: history
        reads: [community_name, move_in_date, lease_ledger.event_type, lease_ledger.entry_date]
        note: The site lease's community decides whether repeat charges are permitted, and its move-in date with the returned payments on its ledger decide the cap and the repeat-charge tenure courtesy.
    compute:
      - repeat_notice_class: "LATEST('rules_records', 'rule_class', date_field='record_date', event_type='rules_violation_notice')"
      - repeat_notice_sequence: "LATEST('rules_records', 'violation_sequence', date_field='record_date', event_type='rules_violation_notice')"
      - schedule_charge: "P('repeat_violation_charge_second') if repeat_notice_sequence == 2 else (P('repeat_violation_charge_third_plus') if repeat_notice_sequence >= 3 else 0)"
      - repeat_community: "CFIELD('lease', 'community_name')"
      - permitted_schedule_charge: "schedule_charge if (repeat_community == 'Saguaro Vista' or repeat_community == 'Bluebonnet Ridge' or repeat_community == 'Cedar Hollow') else 0"
      - weighting_class: "LATEST('rules_records', 'rule_class', date_field='record_date', event_type='rules_violation_notice')"
      - class_weight: "K('hazard_class_weight') if (weighting_class == 'snow_and_ice' or weighting_class == 'vehicles_and_parking') else (K('upkeep_class_weight') if (weighting_class == 'lawn_and_landscaping' or weighting_class == 'debris_and_storage') else 1)"
      - recent_self_help_charges: "COUNT('rules_ledger', within_months=K('cure_cost_window_months'), date_field='entry_date', event_type='rules_self_help_charge')"
      - cure_cost_addon: "K('cure_cost_addon_two_plus') if recent_self_help_charges >= 2 else (K('cure_cost_addon_one') if recent_self_help_charges == 1 else 0)"
      - lapse_notice_deadline: "LATEST('rules_records', 'cure_deadline', date_field='record_date', event_type='rules_violation_notice')"
      - lapse_outcome_date: "LATEST('rules_records', 'record_date', date_field='record_date', event_type='rules_cure_confirmation')"
      - lapse_days: "DAYS(lapse_notice_deadline, lapse_outcome_date)"
      - lapse_addon: "K('lapse_addon_long') if lapse_days > K('lapse_long_days') else (K('lapse_addon_short') if lapse_days >= K('lapse_short_days') else 0)"
      - resolved_outcomes_fast_window: "COUNT('rules_records', within_months=K('recurrence_fast_months'), date_field='record_date', event_type='rules_cure_confirmation', cure_outcome='cured_by_resident') + COUNT('rules_records', within_months=K('recurrence_fast_months'), date_field='record_date', event_type='rules_cure_confirmation', cure_outcome='cured_by_community')"
      - resolved_outcomes_slow_window: "COUNT('rules_records', within_months=K('recurrence_slow_months'), date_field='record_date', event_type='rules_cure_confirmation', cure_outcome='cured_by_resident') + COUNT('rules_records', within_months=K('recurrence_slow_months'), date_field='record_date', event_type='rules_cure_confirmation', cure_outcome='cured_by_community')"
      - recurrence_addon: "K('recurrence_addon_fast') if resolved_outcomes_fast_window >= 2 else (K('recurrence_addon_slow') if resolved_outcomes_slow_window >= 2 else 0)"
      - weighted_repeat_sum: "(permitted_schedule_charge * class_weight + cure_cost_addon + lapse_addon + recurrence_addon) if permitted_schedule_charge > 0 else 0"
      - cap_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - capped_repeat_sum: "MN(weighted_repeat_sum, K('cap_long')) if cap_tenure_months >= K('cap_long_months') else (MN(weighted_repeat_sum, K('cap_mid')) if cap_tenure_months >= K('cap_mid_months') else weighted_repeat_sum)"
      - courtesy_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - courtesy_lease_returns: "XCOUNT('lease', 'lease_ledger', within_months=K('returned_payment_window_months'), date_field='entry_date', event_type='lease_payment_return')"
      - repeat_charge_after_courtesy: "int(capped_repeat_sum / 2) if (courtesy_tenure_months >= K('courtesy_long_months') and courtesy_lease_returns == 0) else ((0 - ((0 - capped_repeat_sum * K('courtesy_mid_multiplier')) // 1)) if (courtesy_tenure_months >= K('courtesy_mid_months') and courtesy_lease_returns <= 1) else capped_repeat_sum)"
      - result: "RND(repeat_charge_after_courtesy, 2)"
    compute_basis:
      repeat_notice_class: "A repeat-violation charge is assessed once the repeat notice has its outcome recorded; it is assessed for the violation notice most recently served on the plan record, dated the day that notice was served, referenced to it and carrying its violation sequence."
      repeat_notice_sequence: "A repeat-violation charge is assessed once the repeat notice has its outcome recorded; it is assessed for the violation notice most recently served on the plan record, dated the day that notice was served, referenced to it and carrying its violation sequence."
      schedule_charge: "It is assessed only in a community permitting repeat charges, which are Saguaro Vista, Bluebonnet Ridge and Cedar Hollow, and its schedule charge is repeat_violation_charge_second for a notice whose violation sequence is two and repeat_violation_charge_third_plus for a later one, while a notice whose sequence is one carries no charge."
      repeat_community: "It is assessed only in a community permitting repeat charges, which are Saguaro Vista, Bluebonnet Ridge and Cedar Hollow, and its schedule charge is repeat_violation_charge_second for a notice whose violation sequence is two and repeat_violation_charge_third_plus for a later one, while a notice whose sequence is one carries no charge."
      permitted_schedule_charge: "It is assessed only in a community permitting repeat charges, which are Saguaro Vista, Bluebonnet Ridge and Cedar Hollow, and its schedule charge is repeat_violation_charge_second for a notice whose violation sequence is two and repeat_violation_charge_third_plus for a later one, while a notice whose sequence is one carries no charge."
      weighting_class: "The schedule charge is weighted by the rule class of the notice: by hazard_class_weight for snow and ice or vehicles and parking, by upkeep_class_weight for lawn and landscaping or debris and storage, and not at all for every other class."
      class_weight: "The schedule charge is weighted by the rule class of the notice: by hazard_class_weight for snow and ice or vehicles and parking, by upkeep_class_weight for lawn and landscaping or debris and storage, and not at all for every other class."
      recent_self_help_charges: "A cure-cost addition is made by the self-help charges on the plan record's statement dated within the cure_cost_window_months calendar months ending on the handling date: cure_cost_addon_two_plus for two or more, cure_cost_addon_one for exactly one, and nothing for none."
      cure_cost_addon: "A cure-cost addition is made by the self-help charges on the plan record's statement dated within the cure_cost_window_months calendar months ending on the handling date: cure_cost_addon_two_plus for two or more, cure_cost_addon_one for exactly one, and nothing for none."
      lapse_notice_deadline: "A lapse addition is made by the calendar days from the notice's cure deadline to the date of the most recent cure outcome recorded on the plan record: lapse_addon_long for more than lapse_long_days days, lapse_addon_short for lapse_short_days through lapse_long_days days, and nothing for fewer."
      lapse_outcome_date: "A lapse addition is made by the calendar days from the notice's cure deadline to the date of the most recent cure outcome recorded on the plan record: lapse_addon_long for more than lapse_long_days days, lapse_addon_short for lapse_short_days through lapse_long_days days, and nothing for fewer."
      lapse_days: "A lapse addition is made by the calendar days from the notice's cure deadline to the date of the most recent cure outcome recorded on the plan record: lapse_addon_long for more than lapse_long_days days, lapse_addon_short for lapse_short_days through lapse_long_days days, and nothing for fewer."
      lapse_addon: "A lapse addition is made by the calendar days from the notice's cure deadline to the date of the most recent cure outcome recorded on the plan record: lapse_addon_long for more than lapse_long_days days, lapse_addon_short for lapse_short_days through lapse_long_days days, and nothing for fewer."
      resolved_outcomes_fast_window: "A recurrence addition is made by the cure outcomes recorded on the plan record as cured by the resident or cured by the community within recent calendar months ending on the handling date, the notice's own outcome included and a withdrawn notice never counted: recurrence_addon_fast when two or more such outcomes fall within recurrence_fast_months months, recurrence_addon_slow when fewer than two fall within recurrence_fast_months months but two or more within recurrence_slow_months months, and nothing otherwise."
      resolved_outcomes_slow_window: "A recurrence addition is made by the cure outcomes recorded on the plan record as cured by the resident or cured by the community within recent calendar months ending on the handling date, the notice's own outcome included and a withdrawn notice never counted: recurrence_addon_fast when two or more such outcomes fall within recurrence_fast_months months, recurrence_addon_slow when fewer than two fall within recurrence_fast_months months but two or more within recurrence_slow_months months, and nothing otherwise."
      recurrence_addon: "A recurrence addition is made by the cure outcomes recorded on the plan record as cured by the resident or cured by the community within recent calendar months ending on the handling date, the notice's own outcome included and a withdrawn notice never counted: recurrence_addon_fast when two or more such outcomes fall within recurrence_fast_months months, recurrence_addon_slow when fewer than two fall within recurrence_fast_months months but two or more within recurrence_slow_months months, and nothing otherwise."
      weighted_repeat_sum: "The weighted schedule charge and the cure-cost, lapse and recurrence additions are added together first."
      cap_tenure_months: "That sum is then capped by tenure, counted in whole calendar months from the lease move-in date to the handling date: at cap_long with at least cap_long_months of tenure, at cap_mid with at least cap_mid_months but fewer than cap_long_months, and uncapped with fewer."
      capped_repeat_sum: "That sum is then capped by tenure, counted in whole calendar months from the lease move-in date to the handling date: at cap_long with at least cap_long_months of tenure, at cap_mid with at least cap_mid_months but fewer than cap_long_months, and uncapped with fewer."
      courtesy_tenure_months: "A repeat-charge tenure courtesy then settles the charge from the capped sum, returned payments counted on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least courtesy_long_months of tenure and no returned payment, half the capped sum rounded down to the whole dollar; when that does not hold but the resident has at least courtesy_mid_months of tenure and at most one returned payment, courtesy_mid_multiplier times the capped sum rounded up to the whole dollar; otherwise the capped sum."
      courtesy_lease_returns: "A repeat-charge tenure courtesy then settles the charge from the capped sum, returned payments counted on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least courtesy_long_months of tenure and no returned payment, half the capped sum rounded down to the whole dollar; when that does not hold but the resident has at least courtesy_mid_months of tenure and at most one returned payment, courtesy_mid_multiplier times the capped sum rounded up to the whole dollar; otherwise the capped sum."
      repeat_charge_after_courtesy: "A repeat-charge tenure courtesy then settles the charge from the capped sum, returned payments counted on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least courtesy_long_months of tenure and no returned payment, half the capped sum rounded down to the whole dollar; when that does not hold but the resident has at least courtesy_mid_months of tenure and at most one returned payment, courtesy_mid_multiplier times the capped sum rounded up to the whole dollar; otherwise the capped sum."
      result: "The repeat-violation charge is posted rounded half up to the cent."
    factors:
      - id: rule_class_weighting
        effect: parameter
        decides: class_weight
        bindings: [weighting_class, class_weight]
        ladder:
          - when: "the notice is in the snow and ice or the vehicles and parking class"
            value: "K('hazard_class_weight')"
          - when: "the notice is in the lawn and landscaping or the debris and storage class"
            value: "K('upkeep_class_weight')"
          - when: "otherwise"
            value: "1"
        baseline:
          class_weight: "1"
        evidence: [history]
        cross_difficulty: null
      - id: cure_cost_addition
        effect: parameter
        decides: cure_cost_addon
        bindings: [recent_self_help_charges, cure_cost_addon]
        ladder:
          - when: "two or more self-help charges dated within the cure_cost_window_months calendar months ending on the handling date"
            value: "K('cure_cost_addon_two_plus')"
          - when: "exactly one such charge"
            value: "K('cure_cost_addon_one')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          cure_cost_addon: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cure_lapse_addition
        effect: parameter
        decides: lapse_addon
        bindings: [lapse_notice_deadline, lapse_outcome_date, lapse_days, lapse_addon]
        ladder:
          - when: "the most recent cure outcome is dated more than lapse_long_days calendar days after the notice's cure deadline"
            value: "K('lapse_addon_long')"
          - when: "it is dated lapse_short_days through lapse_long_days days after the deadline"
            value: "K('lapse_addon_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          lapse_addon: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cure_recurrence_addition
        effect: parameter
        decides: recurrence_addon
        bindings: [resolved_outcomes_fast_window, resolved_outcomes_slow_window, recurrence_addon]
        ladder:
          - when: "two or more outcomes cured by the resident or by the community recorded within the recurrence_fast_months calendar months ending on the handling date"
            value: "K('recurrence_addon_fast')"
          - when: "fewer than two in that window but two or more within the recurrence_slow_months calendar months ending on the handling date"
            value: "K('recurrence_addon_slow')"
          - when: "otherwise"
            value: "0"
        baseline:
          recurrence_addon: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_cap
        effect: parameter
        decides: capped_repeat_sum
        bindings: [cap_tenure_months, capped_repeat_sum]
        ladder:
          - when: "tenure since the lease move-in date of at least cap_long_months"
            value: "the sum capped at K('cap_long')"
          - when: "tenure of at least cap_mid_months but fewer than cap_long_months"
            value: "the sum capped at K('cap_mid')"
          - when: "otherwise"
            value: "the sum uncapped"
        baseline:
          capped_repeat_sum: "weighted_repeat_sum"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: repeat_charge_tenure_courtesy
        effect: method
        decides: repeat_charge_after_courtesy
        bindings: [courtesy_tenure_months, courtesy_lease_returns, repeat_charge_after_courtesy]
        ladder:
          - when: "tenure of at least courtesy_long_months and no returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date"
            method: "half the capped sum, rounded down to the whole dollar"
          - when: "the first condition does not hold, tenure is at least courtesy_mid_months and at most one returned payment is in that window"
            method: "courtesy_mid_multiplier times the capped sum, rounded up to the whole dollar"
          - when: "otherwise"
            method: "the capped sum as computed"
        baseline:
          repeat_charge_after_courtesy: "capped_repeat_sum"
        evidence: [cross_category, date]
        cross_difficulty: lease
    baseline:
      rule: >-
        A repeat-violation charge is assessed once the repeat notice has its outcome recorded; it is assessed for the violation notice most recently served on the plan record, dated the day that notice was served, referenced to it and carrying its violation sequence.
        It is assessed only in a community permitting repeat charges, which are Saguaro Vista, Bluebonnet Ridge and Cedar Hollow, and its schedule charge is repeat_violation_charge_second for a notice whose violation sequence is two and repeat_violation_charge_third_plus for a later one, while a notice whose sequence is one carries no charge.
        The standard repeat-violation charge is the schedule charge, rounded half up to the cent.
      params: [repeat_violation_charge_second, repeat_violation_charge_third_plus]
    inputs:
      history:
        - {table: rules_records, aggregate: latest, field: violation_sequence, filters: {event_type: rules_violation_notice}}
        - {table: rules_records, aggregate: count, field: rules_record_id, within_months: 4, filters: {event_type: rules_cure_confirmation}}
        - {table: rules_ledger, aggregate: count, field: rules_entry_id, within_months: 12, filters: {event_type: rules_self_help_charge}}
        - {category: lease, table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_payment_return}}
      cross_category: [lease]

  - id: rules_ext_reinstatement_payment
    base_policy_refs: [rules_agg_charge_attribution, rules_charge_billing, rules_service_suspension_terms]
    overwrite:
      - base_policy: rules_service_suspension_terms
        superseded_clause: >-
          Plan services resume on the day every past-due plan fee is paid, and plan fees resume from the next month.
        replaced_by: >-
          The standard reinstatement payment is the reinstatement balance, rounded half up to the cent, and the community's system resumes plan services on the day it is received, plan fees resuming from the next month.
    trigger: on_request
    subject: [rules_payment]
    computes: amount
    target_tool: pay_plan_reinstatement_3e360d67
    params:
      lapse_long_months: 4
      lapse_mid_months: 2
      lapse_advance_long: 1
      lapse_advance_mid: 0.5
      returned_payment_window_months: 12
      returned_advance_two: 2
      returned_advance_one: 1
      upkeep_window_months: 3
      defer_long_months: 120
      defer_mid_months: 60
      repeat_window_months: 3
      repeat_defer_long: 1.0
      repeat_defer_mid: 0.25
      tolerance_min_months: 60
      tolerance_autopay: 15.00
      tolerance_standard: 10.00
    rule: >
      A resident whose plan services are suspended pays the reinstatement payment in person through the resident portal, the payment naming the plan record whose statement it pays.
      The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it.
      The standard reinstatement payment is the reinstatement balance, rounded half up to the cent, and the community's system resumes plan services on the day it is received, plan fees resuming from the next month.
      A lapse advance of the plan fee in force is added by the whole calendar months from the most recent plan fee charged to the handling date: lapse_advance_long month for lapse_long_months months or more, lapse_advance_mid month for lapse_mid_months months or more but fewer than lapse_long_months, and none for fewer.
      A returned-payment advance of the plan fee in force is added by the returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: returned_advance_two months for two or more returned payments or while the lease is under a certified-funds-only restriction, returned_advance_one month for exactly one returned payment without that restriction, and none otherwise.
      The plan-fee advance is the plan fee in force times the lapse advance months and the returned-payment advance months added together.
      Self-help charges dated within the upkeep_window_months calendar months ending on the handling date may be deferred to the next statement by tenure, counted in whole calendar months from the lease move-in date to the handling date, and by returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least defer_long_months of tenure and no returned payment they are deferred in full; when that does not hold but the resident has at least defer_mid_months of tenure and at most one returned payment, half of them is deferred, that half rounded down to the whole dollar; otherwise none is deferred.
      Repeat-violation charges dated within the repeat_window_months calendar months ending on the handling date may be deferred by tenure alone: repeat_defer_long of them with at least defer_long_months of tenure, repeat_defer_mid of them with at least defer_mid_months but fewer than defer_long_months, and none with fewer.
      A balance tolerance may stay on the statement: tolerance_autopay when the site lease is enrolled in autopay and tenure is at least tolerance_min_months, tolerance_standard when the lease is not enrolled in autopay and tenure is at least tolerance_min_months, and nothing with fewer months of tenure.
      The deferred self-help charges, the deferred repeat-violation charges and the balance tolerance are subtracted from the reinstatement balance first, that remainder is never less than zero, the lapse advance and the returned-payment advance are then added, and the payment is rounded half up to the cent.
      A reinstatement payment is quoted only after every violation notice that the community cured itself carries its self-help charge on the statement.
      A reinstatement payment is not quoted until every repeat notice in a community permitting repeat charges carries its repeat-violation charge on the statement.
    prerequisite:
      - problem: rules_ext_self_help_charge
        kind: value_input
        gate: reinstatement_balance
        form: state
        policy_source: >-
          A reinstatement payment is quoted only after every violation notice that the community cured itself carries its self-help charge on the statement.
        condition: >-
          Every violation notice whose cure outcome is cured by the community has a self-help charge entry on the plan record's statement referencing it.
        resolved_by: post_self_help_charge_892a63af
        effect: >-
          Once the missing self-help charge is on the statement, the reinstatement balance rises by it and the self-help charges inside the deferral window rise with it, so the reinstatement payment changes.
      - problem: rules_ext_repeat_violation_charge
        kind: value_input
        gate: reinstatement_balance
        form: state
        policy_source: >-
          A reinstatement payment is not quoted until every repeat notice in a community permitting repeat charges carries its repeat-violation charge on the statement.
        condition: >-
          Every violation notice with a violation sequence of two or more, served in a community permitting repeat charges and with its outcome recorded, has a repeat-violation charge entry on the statement referencing it.
        resolved_by: post_repeat_violation_charge_7b5daab9
        effect: >-
          Once the missing repeat-violation charge is on the statement, the reinstatement balance rises by it and the deferred repeat-violation charges by their share, so the reinstatement payment changes.
    cross_category:
      - category: lease
        as: history
        reads: [payment_restriction, autopay_enrolled, move_in_date, lease_ledger.event_type, lease_ledger.entry_date]
        note: The site lease's restriction, autopay, move-in date and the returned payments on its ledger decide the returned-payment advance, the deferrals and the balance tolerance.
    compute:
      - reinstatement_plan_fees: "SUM('rules_ledger', 'amount', event_type='rules_plan_fee')"
      - reinstatement_self_help: "SUM('rules_ledger', 'amount', event_type='rules_self_help_charge')"
      - reinstatement_repeat_charges: "SUM('rules_ledger', 'amount', event_type='rules_repeat_violation_charge')"
      - reinstatement_pet_fees: "SUM('rules_ledger', 'amount', event_type='rules_pet_registration_fee')"
      - reinstatement_permit_fees: "SUM('rules_ledger', 'amount', event_type='rules_vehicle_permit_fee')"
      - reinstatement_payments: "SUM('rules_ledger', 'amount', event_type='rules_payment')"
      - reinstatement_waivers: "SUM('rules_ledger', 'amount', event_type='rules_charge_waiver')"
      - reinstatement_balance: "reinstatement_plan_fees + reinstatement_self_help + reinstatement_repeat_charges + reinstatement_pet_fees + reinstatement_permit_fees - reinstatement_payments - reinstatement_waivers"
      - latest_plan_fee_date: "LATEST('rules_ledger', 'entry_date', date_field='entry_date', event_type='rules_plan_fee')"
      - months_since_plan_fee: "MONTHS(latest_plan_fee_date, NOW)"
      - lapse_advance_months: "K('lapse_advance_long') if months_since_plan_fee >= K('lapse_long_months') else (K('lapse_advance_mid') if months_since_plan_fee >= K('lapse_mid_months') else 0)"
      - advance_lease_returns: "XCOUNT('lease', 'lease_ledger', within_months=K('returned_payment_window_months'), date_field='entry_date', event_type='lease_payment_return')"
      - advance_lease_restriction: "CFIELD('lease', 'payment_restriction')"
      - returned_advance_months: "K('returned_advance_two') if (advance_lease_returns >= 2 or advance_lease_restriction == 'certified_funds_only') else (K('returned_advance_one') if advance_lease_returns == 1 else 0)"
      - plan_fee_advance_amount: "P('plan_fee_monthly') * (lapse_advance_months + returned_advance_months)"
      - recent_self_help_amount: "SUM('rules_ledger', 'amount', within_months=K('upkeep_window_months'), date_field='entry_date', event_type='rules_self_help_charge')"
      - deferral_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - deferral_lease_returns: "XCOUNT('lease', 'lease_ledger', within_months=K('returned_payment_window_months'), date_field='entry_date', event_type='lease_payment_return')"
      - deferred_self_help: "recent_self_help_amount if (deferral_tenure_months >= K('defer_long_months') and deferral_lease_returns == 0) else (int(recent_self_help_amount / 2) if (deferral_tenure_months >= K('defer_mid_months') and deferral_lease_returns <= 1) else 0)"
      - recent_repeat_amount: "SUM('rules_ledger', 'amount', within_months=K('repeat_window_months'), date_field='entry_date', event_type='rules_repeat_violation_charge')"
      - repeat_deferral_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - deferred_repeat: "recent_repeat_amount * (K('repeat_defer_long') if repeat_deferral_tenure >= K('defer_long_months') else (K('repeat_defer_mid') if repeat_deferral_tenure >= K('defer_mid_months') else 0))"
      - tolerance_lease_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - tolerance_tenure_months: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - balance_tolerance: "K('tolerance_autopay') if (tolerance_lease_autopay == True and tolerance_tenure_months >= K('tolerance_min_months')) else (K('tolerance_standard') if (tolerance_lease_autopay == False and tolerance_tenure_months >= K('tolerance_min_months')) else 0)"
      - result: "RND(MX(reinstatement_balance - deferred_self_help - deferred_repeat - balance_tolerance, 0) + plan_fee_advance_amount, 2)"
    compute_basis:
      reinstatement_plan_fees: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      reinstatement_self_help: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      reinstatement_repeat_charges: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      reinstatement_pet_fees: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      reinstatement_permit_fees: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      reinstatement_payments: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      reinstatement_waivers: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      reinstatement_balance: "The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it."
      latest_plan_fee_date: "A lapse advance of the plan fee in force is added by the whole calendar months from the most recent plan fee charged to the handling date: lapse_advance_long month for lapse_long_months months or more, lapse_advance_mid month for lapse_mid_months months or more but fewer than lapse_long_months, and none for fewer."
      months_since_plan_fee: "A lapse advance of the plan fee in force is added by the whole calendar months from the most recent plan fee charged to the handling date: lapse_advance_long month for lapse_long_months months or more, lapse_advance_mid month for lapse_mid_months months or more but fewer than lapse_long_months, and none for fewer."
      lapse_advance_months: "A lapse advance of the plan fee in force is added by the whole calendar months from the most recent plan fee charged to the handling date: lapse_advance_long month for lapse_long_months months or more, lapse_advance_mid month for lapse_mid_months months or more but fewer than lapse_long_months, and none for fewer."
      advance_lease_returns: "A returned-payment advance of the plan fee in force is added by the returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: returned_advance_two months for two or more returned payments or while the lease is under a certified-funds-only restriction, returned_advance_one month for exactly one returned payment without that restriction, and none otherwise."
      advance_lease_restriction: "A returned-payment advance of the plan fee in force is added by the returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: returned_advance_two months for two or more returned payments or while the lease is under a certified-funds-only restriction, returned_advance_one month for exactly one returned payment without that restriction, and none otherwise."
      returned_advance_months: "A returned-payment advance of the plan fee in force is added by the returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: returned_advance_two months for two or more returned payments or while the lease is under a certified-funds-only restriction, returned_advance_one month for exactly one returned payment without that restriction, and none otherwise."
      plan_fee_advance_amount: "The plan-fee advance is the plan fee in force times the lapse advance months and the returned-payment advance months added together."
      recent_self_help_amount: "Self-help charges dated within the upkeep_window_months calendar months ending on the handling date may be deferred to the next statement by tenure, counted in whole calendar months from the lease move-in date to the handling date, and by returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least defer_long_months of tenure and no returned payment they are deferred in full; when that does not hold but the resident has at least defer_mid_months of tenure and at most one returned payment, half of them is deferred, that half rounded down to the whole dollar; otherwise none is deferred."
      deferral_tenure_months: "Self-help charges dated within the upkeep_window_months calendar months ending on the handling date may be deferred to the next statement by tenure, counted in whole calendar months from the lease move-in date to the handling date, and by returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least defer_long_months of tenure and no returned payment they are deferred in full; when that does not hold but the resident has at least defer_mid_months of tenure and at most one returned payment, half of them is deferred, that half rounded down to the whole dollar; otherwise none is deferred."
      deferral_lease_returns: "Self-help charges dated within the upkeep_window_months calendar months ending on the handling date may be deferred to the next statement by tenure, counted in whole calendar months from the lease move-in date to the handling date, and by returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least defer_long_months of tenure and no returned payment they are deferred in full; when that does not hold but the resident has at least defer_mid_months of tenure and at most one returned payment, half of them is deferred, that half rounded down to the whole dollar; otherwise none is deferred."
      deferred_self_help: "Self-help charges dated within the upkeep_window_months calendar months ending on the handling date may be deferred to the next statement by tenure, counted in whole calendar months from the lease move-in date to the handling date, and by returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date: with at least defer_long_months of tenure and no returned payment they are deferred in full; when that does not hold but the resident has at least defer_mid_months of tenure and at most one returned payment, half of them is deferred, that half rounded down to the whole dollar; otherwise none is deferred."
      recent_repeat_amount: "Repeat-violation charges dated within the repeat_window_months calendar months ending on the handling date may be deferred by tenure alone: repeat_defer_long of them with at least defer_long_months of tenure, repeat_defer_mid of them with at least defer_mid_months but fewer than defer_long_months, and none with fewer."
      repeat_deferral_tenure: "Repeat-violation charges dated within the repeat_window_months calendar months ending on the handling date may be deferred by tenure alone: repeat_defer_long of them with at least defer_long_months of tenure, repeat_defer_mid of them with at least defer_mid_months but fewer than defer_long_months, and none with fewer."
      deferred_repeat: "Repeat-violation charges dated within the repeat_window_months calendar months ending on the handling date may be deferred by tenure alone: repeat_defer_long of them with at least defer_long_months of tenure, repeat_defer_mid of them with at least defer_mid_months but fewer than defer_long_months, and none with fewer."
      tolerance_lease_autopay: "A balance tolerance may stay on the statement: tolerance_autopay when the site lease is enrolled in autopay and tenure is at least tolerance_min_months, tolerance_standard when the lease is not enrolled in autopay and tenure is at least tolerance_min_months, and nothing with fewer months of tenure."
      tolerance_tenure_months: "A balance tolerance may stay on the statement: tolerance_autopay when the site lease is enrolled in autopay and tenure is at least tolerance_min_months, tolerance_standard when the lease is not enrolled in autopay and tenure is at least tolerance_min_months, and nothing with fewer months of tenure."
      balance_tolerance: "A balance tolerance may stay on the statement: tolerance_autopay when the site lease is enrolled in autopay and tenure is at least tolerance_min_months, tolerance_standard when the lease is not enrolled in autopay and tenure is at least tolerance_min_months, and nothing with fewer months of tenure."
      result: "The deferred self-help charges, the deferred repeat-violation charges and the balance tolerance are subtracted from the reinstatement balance first, that remainder is never less than zero, the lapse advance and the returned-payment advance are then added, and the payment is rounded half up to the cent."
    factors:
      - id: lapse_advance
        effect: parameter
        decides: lapse_advance_months
        bindings: [latest_plan_fee_date, months_since_plan_fee, lapse_advance_months]
        ladder:
          - when: "lapse_long_months or more whole calendar months from the most recent plan fee charged to the handling date"
            value: "K('lapse_advance_long') month of P('plan_fee_monthly')"
          - when: "lapse_mid_months or more but fewer than lapse_long_months"
            value: "K('lapse_advance_mid') month of P('plan_fee_monthly')"
          - when: "otherwise"
            value: "0"
        baseline:
          lapse_advance_months: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: returned_payment_reinstatement_advance
        effect: parameter
        decides: returned_advance_months
        bindings: [advance_lease_returns, advance_lease_restriction, returned_advance_months]
        ladder:
          - when: "two or more returned payments on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date, or a certified-funds-only restriction on the lease"
            value: "K('returned_advance_two') months of P('plan_fee_monthly')"
          - when: "exactly one returned payment and no such restriction"
            value: "K('returned_advance_one') month of P('plan_fee_monthly')"
          - when: "otherwise"
            value: "0"
        baseline:
          returned_advance_months: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: upkeep_deferral
        effect: method
        decides: deferred_self_help
        bindings: [recent_self_help_amount, deferral_tenure_months, deferral_lease_returns, deferred_self_help]
        ladder:
          - when: "tenure of at least defer_long_months and no returned payment on the site-lease ledger within the returned_payment_window_months calendar months ending on the handling date"
            method: "the self-help charges dated within the upkeep_window_months calendar months ending on the handling date are deferred in full"
          - when: "the first condition does not hold, tenure is at least defer_mid_months and at most one returned payment is in that window"
            method: "half of those charges is deferred, that half rounded down to the whole dollar"
          - when: "otherwise"
            method: "none is deferred"
        baseline:
          deferred_self_help: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: lease
      - id: repeat_charge_deferral
        effect: parameter
        decides: deferred_repeat
        bindings: [recent_repeat_amount, repeat_deferral_tenure, deferred_repeat]
        ladder:
          - when: "tenure of at least defer_long_months"
            value: "K('repeat_defer_long') of the repeat-violation charges dated within the repeat_window_months calendar months ending on the handling date"
          - when: "tenure of at least defer_mid_months but fewer than defer_long_months"
            value: "K('repeat_defer_mid') of those charges"
          - when: "otherwise"
            value: "0"
        baseline:
          deferred_repeat: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: lease
      - id: balance_tolerance
        effect: parameter
        decides: balance_tolerance
        bindings: [tolerance_lease_autopay, tolerance_tenure_months, balance_tolerance]
        ladder:
          - when: "the site lease is enrolled in autopay and tenure is at least tolerance_min_months"
            value: "K('tolerance_autopay')"
          - when: "the site lease is not enrolled in autopay and tenure is at least tolerance_min_months"
            value: "K('tolerance_standard')"
          - when: "otherwise (fewer months of tenure)"
            value: "0"
        baseline:
          balance_tolerance: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
    baseline:
      rule: >-
        A resident whose plan services are suspended pays the reinstatement payment in person through the resident portal, the payment naming the plan record whose statement it pays.
        The reinstatement balance is every charge on the plan record's statement, being its plan fees, self-help charges, repeat-violation charges, pet registration fees and vehicle permit fees, less every payment and waiver posted to it.
        The standard reinstatement payment is the reinstatement balance, rounded half up to the cent, and the community's system resumes plan services on the day it is received, plan fees resuming from the next month.
      params: []
    inputs:
      history:
        - {table: rules_ledger, aggregate: sum, field: amount, filters: {}}
        - {table: rules_ledger, aggregate: latest, field: entry_date, filters: {event_type: rules_plan_fee}}
        - {table: rules_ledger, aggregate: sum, field: amount, within_months: 3, filters: {event_type: rules_self_help_charge}}
        - {table: rules_ledger, aggregate: sum, field: amount, within_months: 3, filters: {event_type: rules_repeat_violation_charge}}
        - {category: lease, table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_payment_return}}
      cross_category: [lease]
