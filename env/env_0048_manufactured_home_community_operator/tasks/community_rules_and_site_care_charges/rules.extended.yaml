      registration_history_credit: "A registration-history credit is taken off by the registration-year fees already on the plan record's statement for any of the household's pets: history_credit_long for history_credit_long_count or more such fees, history_credit_mid for history_credit_mid_count or more but fewer than history_credit_long_count, and nothing for fewer."
      latest_pets_notice: "A pet-incident surcharge is added by the days from the most recent pets-class violation notice to the handling date: incident_recent_surcharge when that is incident_recent_days days or fewer, incident_earlier_surcharge when it is more than incident_recent_days but no more than incident_earlier_days days, and nothing when it is longer or no such notice exists."
      pets_notice_age_days: "A pet-incident surcharge is added by the days from the most recent pets-class violation notice to the handling date: incident_recent_surcharge when that is incident_recent_days days or fewer, incident_earlier_surcharge when it is more than incident_recent_days but no more than incident_earlier_days days, and nothing when it is longer or no such notice exists."
