events:
  - type: loan_application
    target: loan_holdings
    mutation: create
    meaning: A resident or approved applicant applies to finance the purchase of a manufactured home that sits, or will sit, on a Hearthstone home site.
    grain: One row per loan application.
    fields:
      customer_id: The applicant (the borrower once funded).
      variant_name: Loan program applied for.
      lease_id: The site lease the home sits on.
      home_serial_number: Serial number of the home from its title or data plate.
      home_condition: Whether the home is new or pre-owned.
      home_model_year: Model year of the home.
      home_section_type: Section type of the home.
      purchase_price: Contract purchase price of the home.
      down_payment_amount: Down payment the applicant will make.
      note_rate_pct: Note rate locked on the application date.
      term_months: Term of the program.
      payment_due_day: Due day the applicant chose.
      application_date: Date of application.
    triggers: []
  - type: loan_approval
    target: loan_holdings
    mutation: {transition: {from: applied, to: approved}}
    meaning: Underwriting approves the loan.
    grain: One row per transaction.
    fields:
      status: Set to approved.
      approval_date: Date of approval.
    triggers: []
  - type: loan_decline
    target: loan_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: Underwriting declines the application.
    grain: One row per transaction.
    fields:
      status: Set to declined.
      closed_date: Date of the decision.
    triggers: []
  - type: loan_withdrawal
    target: loan_holdings
    mutation: {transition: [{from: applied, to: withdrawn}, {from: approved, to: withdrawn}]}
    meaning: The applicant withdraws, or the commitment expires unsigned.
    grain: One row per transaction.
    fields:
      status: Set to withdrawn.
      closed_date: Date of withdrawal or expiry.
    triggers: []
  - type: loan_funding
    target: loan_holdings
    mutation: {transition: {from: approved, to: active}}
    meaning: The signed retail installment contract is funded to the seller and repayment begins.
    grain: One row per transaction.
    fields:
      status: Set to active.
      funded_date: Funding date.
      original_principal: Amount financed (purchase price less down payment, plus financed fees).
      note_rate_pct: Final note rate after any autopay reduction.
      monthly_pi_amount: Level monthly principal-and-interest installment.
      monthly_escrow_amount: Monthly escrow deposit set at closing (zero when not escrowed).
      escrow_status: Whether premiums are escrowed.
      first_payment_date: Due date of the first installment.
      next_due_date: Due date of the oldest unpaid installment (the first installment at funding).
      maturity_date: Due date of the last installment.
      autopay_enrolled: Whether autopay was elected at closing.
    triggers:
      - event: loan:loan_principal_advance
        map: {txn_date: funded_date, amount: original_principal}
  - type: loan_delinquency
    target: loan_holdings
    mutation: {transition: {from: active, to: delinquent}}
    meaning: The oldest unpaid installment reaches the delinquency threshold.
    grain: One row per transaction.
    fields:
      status: Set to delinquent.
    triggers: []
  - type: loan_delinquency_cure
    target: loan_holdings
    mutation: {transition: {from: delinquent, to: active}}
    meaning: Payments bring the oldest unpaid installment back under the delinquency threshold.
    grain: One row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: loan_paid_off
    target: loan_holdings
    mutation: {transition: [{from: active, to: paid_off}, {from: delinquent, to: paid_off}]}
    meaning: The loan is paid in full and the lien release is ordered.
    grain: One row per transaction.
    fields:
      status: Set to paid_off.
      closed_date: Date the payoff was received.
    triggers: []
  - type: loan_charge_off
    target: loan_holdings
    mutation: {transition: {from: delinquent, to: charged_off}}
    meaning: A delinquent loan is charged off at the charge-off threshold.
    grain: One row per transaction.
    fields:
      status: Set to charged_off.
      closed_date: Charge-off date.
    triggers:
      - event: loan:loan_charge_off_writedown
        map: {txn_date: closed_date}
  - type: loan_deferment
    target: loan_holdings
    mutation: update
    meaning: Installments are moved to the end of the loan under a signed deferment agreement.
    grain: One row per transaction.
    fields:
      next_due_date: Due date of the oldest unpaid installment after the deferment.
      maturity_date: Maturity extended by the months deferred.
      deferred_months_total: Installments deferred over the life of the loan, including this deferment.
    triggers: []
  - type: loan_due_date_change
    target: loan_holdings
    mutation: update
    meaning: The installment due day is changed to the other permitted day of the month.
    grain: One row per transaction.
    fields:
      payment_due_day: New due day.
      next_due_date: Due date of the oldest unpaid installment on the new day.
      due_date_changes_used: Due-day changes made over the life of the loan, including this one.
    triggers: []
  - type: loan_autopay_change
    target: loan_holdings
    mutation: update
    meaning: The borrower enrolls in or cancels automatic ACH payment of installments.
    grain: One row per transaction.
    fields:
      autopay_enrolled: New enrollment state.
    triggers: []
  - type: loan_escrow_change
    target: loan_holdings
    mutation: update
    meaning: The monthly escrow deposit changes after an escrow analysis.
    grain: One row per transaction.
    fields:
      monthly_escrow_amount: New monthly escrow deposit.
    triggers: []
  - type: loan_insurance_status_change
    target: loan_holdings
    mutation: update
    meaning: The hazard-insurance status recorded on the loan changes — coverage lapses, lender-placed coverage is bought, or the borrower's own coverage is proven.
    grain: One row per transaction.
    fields:
      insurance_status: New insurance status.
    triggers: []
  - type: loan_due_date_advance
    target: loan_holdings
    mutation: update
    meaning: The oldest unpaid installment due date moves forward because an installment was satisfied, or back because a payment that satisfied one was returned.
    grain: One row per transaction.
    fields:
      next_due_date: Due date of the oldest unpaid installment after the change.
    triggers: []

  - type: loan_principal_advance
    target: loan_transactions
    meaning: The amount financed is advanced to the seller at funding.
    grain: One row per loan.
    distinguish_by: [txn_date]
    fields:
      loan_id: Loan funded.
      txn_date: Funding date.
      amount: Amount financed, positive.
    account: loan_principal
    direction: in
    triggers: []
  - type: loan_installment_payment
    target: loan_transactions
    meaning: A full installment is received and split into interest, principal and escrow; the principal portion reduces the unpaid principal.
    grain: One row per installment satisfied.
    distinguish_by: [installment_due_date]
    fields:
      loan_id: Loan paid.
      txn_date: Date received (or date suspense was applied).
      installment_due_date: Due date of the installment satisfied.
      amount: Whole installment received, positive (principal + interest + escrow).
      principal_portion: Part applied to principal — the amount booked to loan_principal.
      interest_portion: Part applied to interest.
      escrow_portion: Part deposited to escrow.
      payment_channel: Channel the payment arrived through.
      payment_ref: Confirmation or check number of the payment; for an installment satisfied from suspense, the reference of the payment that completed it.
    account: loan_principal
    direction: out
    triggers:
      - event: loan:loan_escrow_deposit
        map: {txn_date: txn_date, amount: escrow_portion, source_txn_id: loan_txn_id}
      - event: loan:loan_due_date_advance
  - type: loan_partial_payment
    target: loan_transactions
    meaning: A payment smaller than one full installment is received and held in suspense.
    grain: One row per payment received.
    distinguish_by: [payment_ref]
    fields:
      loan_id: Loan paid.
      txn_date: Date received.
      amount: Amount held, positive.
      payment_channel: Channel the payment arrived through.
      payment_ref: Confirmation or check number of the payment.
    account: loan_suspense
    direction: in
    triggers: []
  - type: loan_suspense_application
    target: loan_transactions
    meaning: Suspense funds that have reached one full installment are applied to the oldest unpaid installment.
    grain: One row per installment satisfied from suspense.
    distinguish_by: [installment_due_date]
    fields:
      loan_id: Loan paid.
      txn_date: Date applied.
      installment_due_date: Installment satisfied.
      amount: Amount released from suspense, positive.
    account: loan_suspense
    direction: out
    triggers:
      - event: loan:loan_installment_payment
        map: {installment_due_date: installment_due_date, txn_date: txn_date}
  - type: loan_escrow_deposit
    target: loan_transactions
    meaning: The escrow portion of an installment is deposited to escrow.
    grain: One row per installment payment.
    distinguish_by: [source_txn_id]
    fields:
      loan_id: Loan.
      txn_date: Date deposited.
      source_txn_id: The installment payment.
      amount: Deposit, positive.
    account: loan_escrow
    direction: in
    triggers: []
  - type: loan_escrow_disbursement
    target: loan_transactions
    meaning: A hazard-insurance premium is paid from escrow — to the borrower's own insurer at renewal, or to the lender-placed insurer when coverage has lapsed.
    grain: One row per premium paid per coverage term.
    distinguish_by: [payee_type, coverage_start_date]
    fields:
      loan_id: Loan.
      txn_date: Date paid.
      payee_type: Whose coverage the premium buys.
      coverage_start_date: First day of the coverage term paid for.
      amount: Premium paid, positive.
    account: loan_escrow
    direction: out
    triggers: []
  - type: loan_escrow_refund
    target: loan_transactions
    meaning: Escrow funds are refunded to the borrower — a surplus after analysis, the balance left after payoff, or lender-placed premium for a period the borrower proves was already covered.
    grain: One row per refund.
    distinguish_by: [txn_date, refund_reason]
    fields:
      loan_id: Loan.
      txn_date: Date refunded.
      refund_reason: Why the refund is paid.
      source_txn_id: The disbursement refunded, for a lender-placed premium refund; empty otherwise.
      amount: Refund, positive.
    account: loan_escrow
    direction: out
    triggers: []
  - type: loan_late_charge
    target: loan_transactions
    meaning: A late charge is assessed on an installment not received within the grace period.
    grain: One row per installment.
    distinguish_by: [installment_due_date]
    fields:
      loan_id: Loan charged.
      txn_date: Date assessed.
      installment_due_date: Installment that was late.
      amount: Charge, positive.
    account: loan_fees_due
    direction: in
    triggers: []
  - type: loan_nsf_fee
    target: loan_transactions
    meaning: The returned-payment fee is charged for a payment returned for a fee-bearing reason.
    grain: One row per returned payment.
    distinguish_by: [source_txn_id]
    fields:
      loan_id: Loan charged.
      txn_date: Date of the return.
      source_txn_id: The payment returned.
      amount: Fee, positive.
    account: loan_fees_due
    direction: in
    triggers: []
  - type: loan_deferment_fee
    target: loan_transactions
    meaning: The deferment fee is charged when a deferment agreement is signed.
    grain: One row per deferment agreement.
    distinguish_by: [source_txn_id]
    fields:
      loan_id: Loan charged.
      txn_date: Date of the agreement.
      source_txn_id: The deferment agreement.
      amount: Fee, positive.
    account: loan_fees_due
    direction: in
    triggers: []
  - type: loan_fee_payment
    target: loan_transactions
    meaning: A payment is applied to fees owed on the loan.
    grain: One row per payment applied to fees.
    distinguish_by: [payment_ref]
    fields:
      loan_id: Loan paid.
      txn_date: Date received.
      amount: Amount applied to fees, positive.
      payment_channel: Channel the payment arrived through.
      payment_ref: Confirmation or check number of the payment.
    account: loan_fees_due
    direction: out
    triggers: []
  - type: loan_fee_waiver
    target: loan_transactions
    meaning: A late charge or returned-payment fee is waived in full.
    grain: One row per fee waived.
    distinguish_by: [source_txn_id]
    fields:
      loan_id: Loan credited.
      txn_date: Date waived.
      source_txn_id: The fee waived.
      waiver_basis: Basis of the waiver.
      amount: Amount waived, positive (the whole fee).
    account: loan_fees_due
    direction: out
    triggers: []
  - type: loan_payment_return
    target: loan_transactions
    meaning: An installment payment is returned unpaid by the bank; the principal it paid is restored.
    grain: One row per returned payment.
    distinguish_by: [source_txn_id]
    fields:
      loan_id: Loan charged back.
      txn_date: Date of the return.
      source_txn_id: The installment payment returned.
      return_reason: Bank's return reason.
      amount: Principal restored, positive (the returned payment's principal portion).
      escrow_portion: Escrow portion of the returned payment, reversed out of escrow.
    account: loan_principal
    direction: in
    triggers:
      - event: loan:loan_escrow_reversal
        map: {source_txn_id: source_txn_id, txn_date: txn_date, amount: escrow_portion}
      - event: loan:loan_nsf_fee
        when: {return_reason: [insufficient_funds, account_closed, stop_payment, invalid_account]}
        map: {source_txn_id: source_txn_id, txn_date: txn_date}
      - event: loan:loan_due_date_advance
  - type: loan_escrow_reversal
    target: loan_transactions
    meaning: The escrow deposit of a returned installment payment is reversed.
    grain: One row per returned payment.
    distinguish_by: [source_txn_id]
    fields:
      loan_id: Loan.
      txn_date: Date of the return.
      source_txn_id: The installment payment returned.
      amount: Escrow reversed, positive.
    account: loan_escrow
    direction: out
    triggers: []
  - type: loan_curtailment
    target: loan_transactions
    meaning: An extra payment designated to principal is applied, reducing the unpaid principal without advancing the next due date.
    grain: One row per extra principal payment.
    distinguish_by: [payment_ref]
    fields:
      loan_id: Loan paid.
      txn_date: Date received.
      amount: Principal paid, positive.
      payment_channel: Channel the payment arrived through.
      payment_ref: Confirmation or check number of the payment.
    account: loan_principal
    direction: out
    triggers: []
  - type: loan_payoff_payment
    target: loan_transactions
    meaning: The payoff amount is received and the unpaid principal is paid to zero.
    grain: One row per payoff.
    distinguish_by: [payment_ref]
    fields:
      loan_id: Loan paid off.
      txn_date: Date received.
      amount: Principal paid, positive (the unpaid principal on that date).
      interest_portion: Interest paid with the payoff.
      payment_channel: Channel the payoff arrived through.
      payment_ref: Confirmation or check number of the payoff.
    account: loan_principal
    direction: out
    triggers:
      - event: loan:loan_paid_off
        map: {closed_date: txn_date}
      - event: loan:loan_escrow_refund
        map: {txn_date: txn_date, refund_reason: payoff_balance}
  - type: loan_charge_off_writedown
    target: loan_transactions
    meaning: The unpaid principal of a charged-off loan is written off.
    grain: One row per loan.
    distinguish_by: [txn_date]
    fields:
      loan_id: Loan.
      txn_date: Charge-off date.
      amount: Principal written off, positive.
    account: loan_principal
    direction: out
    triggers: []

  - type: loan_payoff_statement
    target: loan_notices
    meaning: A payoff statement is issued stating the amount that pays the loan in full through a good-through date.
    grain: One row per statement issued.
    distinguish_by: [notice_date, good_through_date]
    fields:
      loan_id: Loan.
      notice_date: Statement date.
      good_through_date: Last day the payoff figure is good.
      payoff_amount: Amount that pays the loan in full on the good-through date.
    triggers: []
  - type: loan_right_to_cure_notice
    target: loan_notices
    meaning: The right-to-cure notice is sent on a delinquent loan, stating the amount needed to cure and the cure deadline.
    grain: One row per notice.
    distinguish_by: [notice_date]
    fields:
      loan_id: Loan.
      notice_date: Date sent.
      cure_deadline: Last day to cure.
      amount_to_cure: Past-due installments and fees needed to cure.
    triggers: []
  - type: loan_insurance_lapse_notice
    target: loan_notices
    meaning: A notice is sent that the hazard coverage on the home has lapsed and that coverage will be placed at the borrower's cost unless proof is received.
    grain: One row per notice in the sequence.
    distinguish_by: [notice_sequence, notice_date]
    fields:
      loan_id: Loan.
      notice_date: Date sent.
      notice_sequence: First notice or reminder.
      earliest_charge_date: Earliest date a lender-placed premium may be charged.
    triggers: []
  - type: loan_escrow_analysis
    target: loan_notices
    meaning: The annual escrow analysis is issued, resetting the monthly escrow deposit and stating any shortage or surplus.
    grain: One row per analysis.
    distinguish_by: [notice_date]
    fields:
      loan_id: Loan.
      notice_date: Date of the analysis.
      new_monthly_escrow: New monthly escrow deposit, shortage spread included.
      shortage_amount: Shortage found, zero when none.
      surplus_amount: Surplus found, zero when none.
      effective_due_date: First installment due date the new deposit applies to.
    triggers:
      - event: loan:loan_escrow_change
        map: {monthly_escrow_amount: new_monthly_escrow}
  - type: loan_deferment_agreement
    target: loan_notices
    meaning: The borrower signs a deferment agreement moving installments to the end of the loan.
    grain: One row per agreement.
    distinguish_by: [notice_date]
    fields:
      loan_id: Loan.
      notice_date: Date signed.
      deferred_months: Installments deferred.
      effective_due_date: Oldest unpaid installment due date after the deferment.
      new_maturity_date: Maturity date after the deferment.
    triggers:
      - event: loan:loan_deferment
        map: {next_due_date: effective_due_date, maturity_date: new_maturity_date}
      - event: loan:loan_deferment_fee
        map: {txn_date: notice_date, source_txn_id: loan_notice_id}

measures:
  - id: loan_msr_days_past_due
    window: From the loan's next_due_date to the handling date.
    measure: Calendar days by which the handling date is after next_due_date (the due date of the oldest unpaid installment); zero when next_due_date is today or later.
  - id: loan_msr_installments_paid
    window: From the funding date to the handling date.
    measure: Count of loan_installment_payment rows on the loan that have no loan_payment_return row pointing to them.
  - id: loan_msr_deferments_12m
    window: Trailing 12 calendar months ending on (and including) the handling date.
    measure: Count of loan_deferment_agreement rows on the loan, by notice_date.
  - id: loan_msr_courtesy_waivers_12m
    window: Trailing 12 calendar months ending on (and including) the handling date.
    measure: Count of loan_fee_waiver rows on the loan whose waiver_basis is courtesy, by txn_date.
  - id: loan_msr_returned_autopay_12m
    window: Trailing 12 calendar months ending on (and including) the date of the newest return.
    measure: Count of loan_payment_return rows whose returned payment arrived through ach_autopay.
  - id: loan_msr_payoff_interest_days
    window: From the due date of the last installment paid (the same day one month before next_due_date; the funding date when no installment has been paid) through the payoff good-through date.
    measure: Calendar days in that span, counting the good-through date and not the due date, on the actual_over_365 basis.
  - id: loan_msr_projected_premium
    window: The most recent coverage term paid from escrow.
    measure: Amount of the newest loan_escrow_disbursement row with payee_type borrower_carrier — the premium projected for the next 12 months of escrow disbursements.

policies:
  - id: loan_agg_multi_holding
    subject: [loan_application]
    rule: >-
      Hearthstone Home Finance lends only on the home a customer lives in on a Hearthstone site, so a customer may hold one open loan at a time.
      The applicant has no other loan in applied, approved, active or delinquent status.
      A loan that is paid off, charged off, declined or withdrawn does not count.
    eligibility:
      - id: single_open_loan
        applies_to: [loan_application]
        kind: dedup
        condition: The applicant has no other loan in applied, approved, active or delinquent status.
        evidence_fields: [loan_holdings.customer_id, loan_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.customer_id]
          action_bindings:
            loan_holdings.customer_id: customer_id
        dedup_contract:
          table: loan_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, approved, active, delinquent]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: loan_underwriting
    subject: [loan_application, loan_approval, loan_decline, loan_withdrawal]
    rule: >-
      Holding a home-site lease is a condition of financing: the home must sit, or be placed, on a Hearthstone site.
      The applicant holds a Hearthstone site lease for the home's site that is approved or active.
      The program must be one whose entry gate the home and applicant meet — credit score, home condition, home age (the application year less the model year) and section type.
      The amount financed — purchase price less down payment, plus the financed origination fee and documentation_fee — must lie between min_loan_amount and max_loan_amount, and the down payment must be at least min_down_payment_pct percent of the purchase price.
      Total monthly debt, including the new installment, escrow and site rent, may not exceed max_debt_to_income_pct percent of verified gross monthly income.
      The note rate is locked on the application date for rate_lock_days; a contract signed after the lock expires is priced at the program rate on the signing date.
      Approval and decline are underwriting decisions only; the resident desk never approves, declines, pre-qualifies or quotes an approval.
      An approved loan whose contract is not signed and funded within commitment_expiry_days of approval is withdrawn.
    eligibility:
      - id: site_lease_held
        applies_to: [loan_application]
        kind: authorization
        condition: The applicant holds a Hearthstone site lease for the home's site that is approved or active.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.customer_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
    formula:
      amount_financed: round((purchase_price - down_payment_amount) * (1 + origination_fee_pct / 100) + documentation_fee, 2)
      down_payment_ok: down_payment_amount >= min_down_payment_pct / 100 * purchase_price

  - id: loan_funding_terms
    subject: [loan_funding, loan_principal_advance]
    rule: >-
      Signing the retail installment contract is the borrower's own act; funding follows the signature.
      The amount financed is advanced to the seller on the funding date and becomes the opening unpaid principal.
      The final note rate is the locked rate less autopay_rate_reduction_pct when autopay is elected at closing.
      The level monthly principal-and-interest installment amortizes the amount financed over term_months at the final note rate (monthly rate = note rate / 12), rounded half up to the cent; the last installment absorbs any rounding difference.
      The first installment falls on the borrower's chosen due day in the first month in which that day is at least first_payment_min_days calendar days after the funding date, and maturity is the due date of the last installment.
      Where escrow is required, or elected on a program that does not require it, the monthly escrow deposit at closing is the first-year premium divided by 12, and the first-year premium is paid from closing funds.
    eligibility: []
    formula:
      monthly_rate: note_rate_pct / 1200
      monthly_pi_amount: round(original_principal * monthly_rate / (1 - (1 + monthly_rate) ** (-term_months)), 2)

  - id: loan_evt_payment_application
    subject: [loan_installment_payment, loan_partial_payment, loan_suspense_application, loan_escrow_deposit, loan_due_date_advance, loan_fee_payment, loan_curtailment]
    rule: >-
      Payments are accepted only on a loan that is active or delinquent.
      Payments are accepted through the accepted_payment_channels; card payments are never accepted (card_payments_accepted is false).
      A payment of at least one full installment (monthly_pi_amount plus monthly_escrow_amount) satisfies the oldest unpaid installment: interest is the unpaid principal times the note rate divided by 1200, principal is the principal-and-interest amount less that interest, and escrow is the monthly escrow deposit; the next due date then advances one month.
      A payment smaller than one full installment is held in suspense, and suspense is applied as soon as it reaches one full installment.
      Money left after whole installments is applied to fees owed, and any remainder is applied as a curtailment when it is at least min_curtailment_amount, otherwise held in suspense.
      A curtailment reduces principal only; it never advances the next due date, and the borrower may not designate it to skip an installment.
      There is no prepayment penalty on a curtailment.
    eligibility:
      - id: loan_open_for_payments
        applies_to: [loan_installment_payment, loan_partial_payment, loan_fee_payment, loan_curtailment]
        kind: state
        condition: Payments are accepted only on a loan that is active or delinquent.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
        state_contract:
          field: loan_holdings.status
          allowed: [active, delinquent]
    formula:
      interest_portion: round(principal_balance * note_rate_pct / 1200, 2)
      principal_portion: monthly_pi_amount - interest_portion
      escrow_portion: monthly_escrow_amount

  - id: loan_evt_late_charge
    subject: [loan_late_charge]
    rule: >-
      A late charge may be assessed only after the grace period has ended, counted from the installment due date.
      The grace period is counted in calendar days starting the day after the due date, so the charge may be assessed no earlier than the day after the due date plus late_charge_grace_days.
      The charge is late_charge_pct_of_installment percent of the monthly principal-and-interest amount, raised to late_charge_min and capped at late_charge_max for the program, rounded half up to the cent.
      At most one late charge is assessed per installment.
      No late charge is assessed on an installment that was paid in full within the grace period and is short only because an earlier late charge or fee is unpaid, and none on an installment moved by a deferment agreement.
    eligibility:
      - id: loan_grace_ended
        applies_to: [loan_late_charge]
        kind: time
        condition: A late charge may be assessed only after the grace period has ended, counted from the installment due date.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.next_due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment due date
          anchor_source: loan_holdings.next_due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date, so the charge may be assessed no earlier than the day after the due date plus late_charge_grace_days.
          boundary: exclusive
    params:
      per_tier:
        Home-Only Loan 7-Year Fixed: {late_charge_max: =late_charge_max}
        Home-Only Loan 10-Year Fixed: {late_charge_max: =late_charge_max}
        Home-Only Loan 15-Year Fixed: {late_charge_max: =late_charge_max}
        Home-Only Loan 20-Year Fixed: {late_charge_max: =late_charge_max}
        Home-Only Loan 23-Year Fixed: {late_charge_max: =late_charge_max}
        Home-Only Loan 25-Year Fixed: {late_charge_max: =late_charge_max}
    formula:
      late_charge: min(max(round(late_charge_pct_of_installment / 100 * monthly_pi_amount, 2), late_charge_min), late_charge_max)

  - id: loan_evt_fee_waiver
    subject: [loan_fee_waiver]
    rule: >-
      A waiver removes the whole fee it names and is posted against that fee.
      A fee that already carries a waiver is not waived again.
      A late charge or returned-payment fee caused by a servicer error — a payment received in time but posted late, or an autopay draft the servicer failed to send — is waived on the servicer_error basis without limit.
      A courtesy waiver applies to late charges only, at most courtesy_late_charge_waivers_per_12_months in the trailing 12 months (loan_msr_courtesy_waivers_12m), and only while the loan is active.
      Returned-payment fees and deferment fees are never waived as a courtesy.
    eligibility:
      - id: loan_fee_not_already_waived
        applies_to: [loan_fee_waiver]
        kind: dedup
        condition: A fee that already carries a waiver is not waived again.
        evidence_fields: [loan_transactions.source_txn_id, loan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.source_txn_id]
          action_bindings:
            loan_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: loan_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [loan_fee_waiver]}
          distinct_fields: []
    measures: [loan_msr_courtesy_waivers_12m]

  - id: loan_evt_returned_payment
    subject: [loan_payment_return, loan_escrow_reversal, loan_nsf_fee]
    rule: >-
      A returned installment payment is reversed bucket by bucket against that payment — its principal portion restored to principal and its escrow portion reversed out of escrow — and the next due date moves back to the installment it had satisfied.
      A payment is reversed only once.
      The returned-payment fee of nsf_fee is charged when the return reason is insufficient_funds, account_closed, stop_payment or invalid_account, never for bank_processing_error.
      When a second autopay draft is returned within 12 months (loan_msr_returned_autopay_12m), autopay is cancelled and later installments must be paid through another accepted channel.
    eligibility:
      - id: loan_return_once
        applies_to: [loan_payment_return]
        kind: dedup
        condition: A payment is reversed only once.
        evidence_fields: [loan_transactions.source_txn_id, loan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.source_txn_id]
          action_bindings:
            loan_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: loan_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [loan_payment_return]}
          distinct_fields: []
    measures: [loan_msr_returned_autopay_12m]
    formula:
      nsf_fee_amount: nsf_fee if return_reason in ["insufficient_funds", "account_closed", "stop_payment", "invalid_account"] else 0

  - id: loan_escrow_terms
    subject: [loan_escrow_analysis, loan_escrow_change, loan_escrow_disbursement, loan_escrow_refund]
    rule: >-
      Escrowed premiums are paid from escrow when the insurer bills them, even if escrow must be advanced below zero to do so.
      The escrow is analyzed every escrow_analysis_interval_months: the projected disbursements are the next 12 months of premium (loan_msr_projected_premium), the target low point is escrow_cushion_months of those disbursements, and the projected low balance is compared with it.
      A shortage — the target low point less the projected low balance — is spread over escrow_shortage_spread_months installments; the new monthly escrow is the projected premium divided by 12 plus the shortage divided by escrow_shortage_spread_months, rounded half up to the cent, from the first installment due after the analysis.
      A surplus of at least escrow_surplus_refund_threshold is refunded within escrow_surplus_refund_days calendar days; a smaller surplus stays in escrow and lowers the next year's deposit.
      A surplus is refunded only when the loan is active (not delinquent) on the analysis date; otherwise it stays in escrow.
      After payoff, the whole escrow balance is refunded to the borrower.
    eligibility: []
    measures: [loan_msr_projected_premium]
    formula:
      new_monthly_escrow: round(loan_msr_projected_premium / 12 + shortage_amount / escrow_shortage_spread_months, 2)

  - id: loan_insurance_requirement
    subject: [loan_insurance_lapse_notice, loan_insurance_status_change, loan_escrow_disbursement, loan_escrow_refund]
    rule: >-
      The home must carry hazard coverage of not less than the unpaid principal (required_coverage_basis) with Hearthstone Home Finance named as loss payee for the life of the loan.
      When coverage lapses the insurance status becomes lapsed, a first lapse notice is sent and a reminder follows; the reminder may be sent no earlier than lapse_first_notice_days less lapse_second_notice_days after the first notice.
      A lender-placed premium may be charged no earlier than lapse_first_notice_days counted from the first lapse notice date.
      The notice period is counted in calendar days starting the day after the first notice date, and the premium may be charged on the last day of the period; a reminder must also have been sent at least lapse_second_notice_days before the charge.
      Lender-placed coverage protects only the lender's interest in the home, costs more than coverage the borrower buys, and is cancelled when the borrower proves their own coverage.
      When the borrower proves coverage with a policy that names Hearthstone Home Finance as loss payee — a Hearthstone Insurance Agency policy on the home in force, or a declarations page from another insurer — the insurance status returns to in_force and lender-placed premium for any period the borrower's own policy covered is refunded to escrow within force_placed_refund_days calendar days.
    eligibility:
      - id: lapse_notice_period
        applies_to: [loan_escrow_disbursement]
        kind: time
        condition: A lender-placed premium may be charged no earlier than lapse_first_notice_days counted from the first lapse notice date.
        evidence_fields: [loan_notices.loan_id, loan_notices.notice_date, loan_notices.notice_sequence]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_notices.loan_id]
          action_bindings:
            loan_notices.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the first lapse notice date
          anchor_source: loan_notices.notice_date
          relation: not_before
          duration_source: variants.lapse_first_notice_days
          unit: calendar_days
          counting_rule: The notice period is counted in calendar days starting the day after the first notice date, and the premium may be charged on the last day of the period; a reminder must also have been sent at least lapse_second_notice_days before the charge.
          boundary: inclusive

  - id: loan_deferment_terms
    subject: [loan_deferment_agreement, loan_deferment, loan_deferment_fee]
    rule: >-
      A deferment moves one or more whole installments, unchanged, to follow the maturity date; it is the borrower's own signed agreement and is used for a temporary hardship.
      A deferment is offered only on a program whose deferment_available is true.
      A deferment is granted only on a loan that is active or delinquent.
      At least deferment_min_installments_paid installments must have been paid since funding (loan_msr_installments_paid), the oldest unpaid installment may be no more than deferment_max_days_past_due days past due (loan_msr_days_past_due), at most deferments_per_12_months agreements may be signed in the trailing 12 months (loan_msr_deferments_12m), and the installments deferred may not exceed deferment_max_months_per_request in one agreement or deferment_lifetime_max_months over the life of the loan.
      The deferred installments are the oldest unpaid ones; the next due date and the maturity date each move forward by the months deferred.
      The deferment_fee is charged when the agreement is signed and is never financed or waived as a courtesy.
      A loan that has been charged off, or a request for more months than the limits allow, a reduced rate, a lower installment or a forgiven balance is a modification, which the resident desk cannot grant; those requests go to a human representative.
    eligibility:
      - id: program_offers_deferment
        applies_to: [loan_deferment_agreement]
        kind: authorization
        condition: A deferment is offered only on a program whose deferment_available is true.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
      - id: deferment_loan_open
        applies_to: [loan_deferment_agreement, loan_deferment]
        kind: state
        condition: A deferment is granted only on a loan that is active or delinquent.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
        state_contract:
          field: loan_holdings.status
          allowed: [active, delinquent]
    params:
      per_tier:
        Home-Only Loan 7-Year Fixed: {deferment_available: =deferment_available, deferment_max_months_per_request: =deferment_max_months_per_request, deferment_fee: =deferment_fee}
        Home-Only Loan 10-Year Fixed: {deferment_available: =deferment_available, deferment_max_months_per_request: =deferment_max_months_per_request, deferment_fee: =deferment_fee}
        Home-Only Loan 15-Year Fixed: {deferment_available: =deferment_available, deferment_max_months_per_request: =deferment_max_months_per_request, deferment_fee: =deferment_fee}
        Home-Only Loan 20-Year Fixed: {deferment_available: =deferment_available, deferment_max_months_per_request: =deferment_max_months_per_request, deferment_fee: =deferment_fee}
        Home-Only Loan 23-Year Fixed: {deferment_available: =deferment_available, deferment_max_months_per_request: =deferment_max_months_per_request, deferment_fee: =deferment_fee}
        Home-Only Loan 25-Year Fixed: {deferment_available: =deferment_available, deferment_max_months_per_request: =deferment_max_months_per_request, deferment_fee: =deferment_fee}
    measures: [loan_msr_installments_paid, loan_msr_days_past_due, loan_msr_deferments_12m]
    formula:
      eligible: loan_msr_installments_paid >= deferment_min_installments_paid and loan_msr_days_past_due <= deferment_max_days_past_due and loan_msr_deferments_12m < deferments_per_12_months and deferred_months_total + deferred_months <= deferment_lifetime_max_months

  - id: loan_due_date_change_terms
    subject: [loan_due_date_change]
    rule: >-
      A borrower may move the installment due day to the other day in payment_due_day_options.
      A due-day change is made only on a loan that is active.
      At least due_date_change_min_installments_paid installments must have been paid since funding, and the due day may be changed at most due_date_change_lifetime_max times over the life of the loan (due_date_changes_used).
      The next due date becomes the first date on the new due day that falls after the current next due date; the installment amount, rate and maturity month are unchanged and no fee is charged.
    eligibility:
      - id: due_change_loan_active
        applies_to: [loan_due_date_change]
        kind: state
        condition: A due-day change is made only on a loan that is active.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
        state_contract:
          field: loan_holdings.status
          allowed: [active]
    measures: [loan_msr_installments_paid]

  - id: loan_payoff_terms
    subject: [loan_payoff_statement, loan_payoff_payment, loan_paid_off, loan_escrow_refund, loan_curtailment]
    rule: >-
      A payoff statement is issued only on a loan that is active or delinquent.
      It is issued within payoff_statement_business_days business days of the request at a fee of payoff_statement_fee, and its figure is good through payoff_good_through_days calendar days after the statement date.
      The payoff amount is the unpaid principal, plus interest at the note rate on the unpaid principal for each day from the due date of the last installment paid through the good-through date on the per_diem_basis, plus fees owed, less suspense funds; the escrow balance is not netted and is refunded separately after payoff.
      There is no prepayment penalty (prepayment_penalty_applies is false).
      A payoff received on or before the good-through date in at least the stated amount pays the loan off; a smaller amount, or one received after the good-through date, is applied as an ordinary payment and the loan stays open until a new statement is satisfied.
      The lien on the home's title is released within lien_release_days calendar days after payoff.
    eligibility:
      - id: payoff_loan_open
        applies_to: [loan_payoff_statement, loan_payoff_payment]
        kind: state
        condition: A payoff statement is issued only on a loan that is active or delinquent.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
        state_contract:
          field: loan_holdings.status
          allowed: [active, delinquent]
    formula:
      payoff_amount: round(principal_balance + round(principal_balance * note_rate_pct / 100 / 365 * loan_msr_payoff_interest_days, 2) + fees_balance - suspense_balance, 2)
    measures: [loan_msr_payoff_interest_days]

  - id: loan_delinquency_terms
    subject: [loan_delinquency, loan_delinquency_cure, loan_right_to_cure_notice, loan_charge_off, loan_charge_off_writedown]
    rule: >-
      A loan becomes delinquent when its oldest unpaid installment is delinquency_days days past due (loan_msr_days_past_due) and returns to active when payments bring it back under that threshold.
      The delinquency is reported to the credit bureaus at credit_reporting_days days past due.
      The right-to-cure notice is sent at right_to_cure_notice_days days past due, stating the past-due installments plus fees owed and a cure deadline right_to_cure_period_days calendar days after the notice date.
      A loan is charged off only when its oldest unpaid installment has been past due for charge_off_days, counted from the installment due date.
      The past-due period is counted in calendar days starting the day after the installment due date, and the loan qualifies on the day the count reaches charge_off_days.
      Repossession, legal action and settlement of a charged-off balance are handled only by the collections department; the resident desk never schedules, threatens or negotiates them, and such requests go to a human representative.
    eligibility:
      - id: charge_off_threshold
        applies_to: [loan_charge_off]
        kind: time
        condition: A loan is charged off only when its oldest unpaid installment has been past due for charge_off_days, counted from the installment due date.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.next_due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment due date
          anchor_source: loan_holdings.next_due_date
          relation: not_before
          duration_source: variants.charge_off_days
          unit: calendar_days
          counting_rule: The past-due period is counted in calendar days starting the day after the installment due date, and the loan qualifies on the day the count reaches charge_off_days.
          boundary: inclusive
    measures: [loan_msr_days_past_due]

  - id: loan_autopay_terms
    subject: [loan_autopay_change]
    rule: >-
      Enrolling in or cancelling autopay is the borrower's own authorization of ACH debits and is recorded only on the borrower's instruction.
      Autopay may be changed only on a loan that is active or delinquent.
      Autopay drafts the full installment on each due date.
      The autopay_rate_reduction_pct is granted only when autopay is elected at closing; enrolling later never lowers the note rate, and cancelling later never raises it.
    eligibility:
      - id: autopay_loan_open
        applies_to: [loan_autopay_change]
        kind: state
        condition: Autopay may be changed only on a loan that is active or delinquent.
        evidence_fields: [loan_holdings.loan_id, loan_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_holdings.loan_id]
          action_bindings:
            loan_holdings.loan_id: loan_id
        state_contract:
          field: loan_holdings.status
          allowed: [active, delinquent]

# ==== extended policies of the home_loan_servicing difficulty ====
extended_policies:
  - id: loan_ext_escrow_analysis
    base_policy_refs: [loan_escrow_terms]
    overwrite:
      - base_policy: loan_escrow_terms
        superseded_clause: >-
          The escrow is analyzed every escrow_analysis_interval_months: the projected disbursements are the next 12 months of premium (loan_msr_projected_premium), the target low point is escrow_cushion_months of those disbursements, and the projected low balance is compared with it.
        replaced_by: >-
          The escrow projection is chosen in this order: where a renewal offer from Hearthstone Insurance Agency for the home stands whose offered term starts on or after the analysis date, the escrow projection is the offered renewal premium; where no such offer stands but the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee, the escrow projection is that policy's current annual premium; otherwise the escrow projection is the newest premium paid from escrow to the borrower's own insurer.
      - base_policy: loan_escrow_terms
        superseded_clause: >-
          A shortage — the target low point less the projected low balance — is spread over escrow_shortage_spread_months installments; the new monthly escrow is the projected premium divided by 12 plus the shortage divided by escrow_shortage_spread_months, rounded half up to the cent, from the first installment due after the analysis.
        replaced_by: >-
          Where the shortage is at least one month's escrow projection (the escrow projection divided by 12) and the oldest unpaid installment is 30 or more days past due on the analysis date, the shortage spread is spread_months_delinquent installments; where the shortage is at least one month's escrow projection and the oldest unpaid installment is less than 30 days past due, the shortage spread is spread_months_current installments; otherwise, for a shortage smaller than one month's escrow projection or no shortage, the shortage spread is escrow_shortage_spread_months installments.
    trigger: state_due
    subject: [loan_escrow_analysis, loan_escrow_change]
    computes: new_monthly_escrow
    target_tool: issue_escrow_analysis_2b6c143e
    params:
      cushion_months_seasoned: 1.0
      cushion_months_new: 1.5
      spread_months_delinquent: 24
      spread_months_current: 18
    rule: >-
      An escrow analysis is owed on every loan whose hazard premiums are escrowed once escrow_analysis_interval_months have passed since its last analysis, and it is issued on the analysis date with the shortage or surplus it finds and the new monthly escrow deposit.
      The escrow projection is the newest premium paid from escrow to the borrower's own insurer.
      The escrow cushion is escrow_cushion_months.
      The target low point is the escrow projection times the escrow cushion divided by 12, rounded half up to the cent.
      The escrow deposits counted are the whole months from the analysis date to the last day of the home's current coverage term, one deposit for each such whole month.
      The projected low balance is the escrow balance on the analysis date plus the current monthly escrow deposit times the escrow deposits counted, less the escrow projection.
      The shortage is the target low point less the projected low balance, never below zero, rounded half up to the cent, and the surplus is the projected low balance less the target low point, never below zero.
      The shortage spread is escrow_shortage_spread_months installments.
      The new monthly escrow is the escrow projection divided by 12 plus the shortage divided by the shortage spread, rounded half up to the cent once on that sum, and it applies from the first installment due after the analysis.
      The escrow projection is chosen in this order: where a renewal offer from Hearthstone Insurance Agency for the home stands whose offered term starts on or after the analysis date, the escrow projection is the offered renewal premium; where no such offer stands but the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee, the escrow projection is that policy's current annual premium; otherwise the escrow projection is the newest premium paid from escrow to the borrower's own insurer.
      Where the borrower's in-force Hearthstone Insurance Agency policy is billed to the loan escrow and escrow has paid three or more premiums to the borrower's own insurer in the 36 whole months before the analysis date, the escrow cushion is cushion_months_seasoned; where that policy is billed to the loan escrow but escrow has paid fewer than three such premiums in those 36 months, the escrow cushion is cushion_months_new; otherwise the escrow cushion is escrow_cushion_months.
      Where the oldest unpaid installment is 30 or more days past due on the analysis date, the escrow deposits counted are the whole months from the oldest unpaid installment's due date to the last day of the home's current coverage term, plus one for the oldest unpaid installment itself; where it is less than 30 days past due and the escrow balance is below zero, so that an advance is being recovered over the whole term, the escrow deposits counted are the whole months from the analysis date to that last day, plus one; otherwise the escrow deposits counted are the whole months from the analysis date to the last day of the home's current coverage term.
      Where the shortage is at least one month's escrow projection (the escrow projection divided by 12) and the oldest unpaid installment is 30 or more days past due on the analysis date, the shortage spread is spread_months_delinquent installments; where the shortage is at least one month's escrow projection and the oldest unpaid installment is less than 30 days past due, the shortage spread is spread_months_current installments; otherwise, for a shortage smaller than one month's escrow projection or no shortage, the shortage spread is escrow_shortage_spread_months installments.
      Days past due are the calendar days from the oldest unpaid installment's due date to the analysis date, never below zero.
      The home's current coverage term is the 12 months that begin on the coverage start date of the newest premium paid from escrow to the borrower's own insurer, or on the funding date while no premium has yet been paid from escrow, its last day falling the day before the anniversary of that date.
    prerequisite: []
    cross_category:
      - category: insurance
        as: branch
        reads: [status, loss_payee, payment_plan, annual_premium, insurance_notices.renewal_premium, insurance_notices.effective_date]
        note: The escrow projection and the escrow cushion are chosen from the borrower's Hearthstone Insurance Agency policy, its billing plan and its renewal offer.
    compute:
      - offer_premium: "XLATEST('insurance', 'insurance_notices', 'renewal_premium', date_field='notice_date', event_type='insurance_renewal_offer')"
      - offer_start: "XLATEST('insurance', 'insurance_notices', 'effective_date', date_field='notice_date', event_type='insurance_renewal_offer')"
      - policy_premium: "CFIELD('insurance', 'annual_premium', status='in_force', loss_payee='hearthstone_home_finance')"
      - last_disbursed: "LATEST('loan_transactions', 'amount', date_field='txn_date', event_type='loan_escrow_disbursement', payee_type='borrower_carrier')"
      - escrow_projection: "float(offer_premium) if offer_premium != None and DAYS(NOW, offer_start) >= 0 else (float(policy_premium) if policy_premium != None else float(last_disbursed))"
      - billing_plan: "CFIELD('insurance', 'payment_plan', status='in_force')"
      - carrier_premiums_paid: "COUNT('loan_transactions', within_months=36, date_field='txn_date', event_type='loan_escrow_disbursement', payee_type='borrower_carrier')"
      - escrow_cushion: "K('cushion_months_seasoned') if billing_plan == 'loan_escrow' and carrier_premiums_paid >= 3 else (K('cushion_months_new') if billing_plan == 'loan_escrow' and carrier_premiums_paid < 3 else P('escrow_cushion_months'))"
      - days_past_due: "MX(0, DAYS(F('next_due_date'), NOW))"
      - coverage_start: "LATEST('loan_transactions', 'coverage_start_date', date_field='txn_date', event_type='loan_escrow_disbursement', payee_type='borrower_carrier') if COUNT('loan_transactions', event_type='loan_escrow_disbursement', payee_type='borrower_carrier') > 0 else LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_principal_advance')"
      - deposits_counted: "11 - MONTHS(coverage_start, F('next_due_date')) + 1 if days_past_due >= 30 else (12 - MONTHS(coverage_start, NOW) if F('escrow_balance') < 0 else 11 - MONTHS(coverage_start, NOW))"
      - projected_low: "F('escrow_balance') + F('monthly_escrow_amount') * deposits_counted - escrow_projection"
      - target_low: "int(RND((escrow_projection * escrow_cushion / 12) * 100, 6) + 0.5) / 100"
      - shortage: "int(RND((MX(0, target_low - projected_low)) * 100, 6) + 0.5) / 100"
      - spread_days_past_due: "MX(0, DAYS(F('next_due_date'), NOW))"
      - shortage_spread: "K('spread_months_delinquent') if shortage >= escrow_projection / 12 and spread_days_past_due >= 30 else (K('spread_months_current') if shortage >= escrow_projection / 12 and spread_days_past_due < 30 else P('escrow_shortage_spread_months'))"
      - result: "int(RND((escrow_projection / 12 + shortage / shortage_spread) * 100, 6) + 0.5) / 100"
    compute_basis:
      offer_premium: "where a renewal offer from Hearthstone Insurance Agency for the home stands whose offered term starts on or after the analysis date, the escrow projection is the offered renewal premium"
      offer_start: "where a renewal offer from Hearthstone Insurance Agency for the home stands whose offered term starts on or after the analysis date"
      policy_premium: "where no such offer stands but the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee, the escrow projection is that policy's current annual premium"
      last_disbursed: "The escrow projection is the newest premium paid from escrow to the borrower's own insurer."
      escrow_projection: "The escrow projection is chosen in this order: where a renewal offer from Hearthstone Insurance Agency for the home stands whose offered term starts on or after the analysis date, the escrow projection is the offered renewal premium; where no such offer stands but the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee, the escrow projection is that policy's current annual premium; otherwise the escrow projection is the newest premium paid from escrow to the borrower's own insurer."
      billing_plan: "Where the borrower's in-force Hearthstone Insurance Agency policy is billed to the loan escrow"
      carrier_premiums_paid: "escrow has paid three or more premiums to the borrower's own insurer in the 36 whole months before the analysis date"
      escrow_cushion: "Where the borrower's in-force Hearthstone Insurance Agency policy is billed to the loan escrow and escrow has paid three or more premiums to the borrower's own insurer in the 36 whole months before the analysis date, the escrow cushion is cushion_months_seasoned; where that policy is billed to the loan escrow but escrow has paid fewer than three such premiums in those 36 months, the escrow cushion is cushion_months_new; otherwise the escrow cushion is escrow_cushion_months."
      days_past_due: "Days past due are the calendar days from the oldest unpaid installment's due date to the analysis date, never below zero."
      coverage_start: "The home's current coverage term is the 12 months that begin on the coverage start date of the newest premium paid from escrow to the borrower's own insurer, or on the funding date while no premium has yet been paid from escrow, its last day falling the day before the anniversary of that date."
      deposits_counted: "Where the oldest unpaid installment is 30 or more days past due on the analysis date, the escrow deposits counted are the whole months from the oldest unpaid installment's due date to the last day of the home's current coverage term, plus one for the oldest unpaid installment itself; where it is less than 30 days past due and the escrow balance is below zero, so that an advance is being recovered over the whole term, the escrow deposits counted are the whole months from the analysis date to that last day, plus one; otherwise the escrow deposits counted are the whole months from the analysis date to the last day of the home's current coverage term."
      projected_low: "The projected low balance is the escrow balance on the analysis date plus the current monthly escrow deposit times the escrow deposits counted, less the escrow projection."
      target_low: "The target low point is the escrow projection times the escrow cushion divided by 12, rounded half up to the cent."
      shortage: "The shortage is the target low point less the projected low balance, never below zero, rounded half up to the cent"
      spread_days_past_due: "Days past due are the calendar days from the oldest unpaid installment's due date to the analysis date, never below zero."
      shortage_spread: "Where the shortage is at least one month's escrow projection (the escrow projection divided by 12) and the oldest unpaid installment is 30 or more days past due on the analysis date, the shortage spread is spread_months_delinquent installments; where the shortage is at least one month's escrow projection and the oldest unpaid installment is less than 30 days past due, the shortage spread is spread_months_current installments; otherwise, for a shortage smaller than one month's escrow projection or no shortage, the shortage spread is escrow_shortage_spread_months installments."
      result: "The new monthly escrow is the escrow projection divided by 12 plus the shortage divided by the shortage spread, rounded half up to the cent once on that sum"
    factors:
      - id: escrow_projection_source
        effect: method
        decides: escrow_projection
        bindings: [offer_premium, offer_start, policy_premium, last_disbursed, escrow_projection]
        ladder:
          - when: "a renewal offer from Hearthstone Insurance Agency for the home stands whose offered term starts on or after the analysis date"
            method: "the escrow projection is taken from the offer: the offered renewal premium"
          - when: "no such renewal offer stands, and the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee"
            method: "the escrow projection is taken from the policy: its current annual premium"
          - when: "otherwise"
            method: "the escrow projection is taken from the loan's own ledger: the newest premium paid from escrow to the borrower's own insurer"
        baseline:
          escrow_projection: "float(last_disbursed)"
        evidence: [cross_category, history, date]
        cross_difficulty: insurance
      - id: escrow_cushion_months
        effect: parameter
        decides: escrow_cushion
        bindings: [billing_plan, carrier_premiums_paid, escrow_cushion]
        ladder:
          - when: "the in-force Hearthstone Insurance Agency policy is billed to the loan escrow AND escrow paid three or more premiums to the borrower's own insurer in the 36 whole months before the analysis date"
            value: "K('cushion_months_seasoned')"
          - when: "the in-force Hearthstone Insurance Agency policy is billed to the loan escrow AND escrow paid fewer than three such premiums in those 36 months"
            value: "K('cushion_months_new')"
          - when: "otherwise"
            value: "P('escrow_cushion_months')"
        baseline:
          escrow_cushion: "P('escrow_cushion_months')"
        evidence: [cross_category, history]
        cross_difficulty: insurance
      - id: escrow_deposit_window
        effect: method
        decides: deposits_counted
        bindings: [days_past_due, coverage_start, deposits_counted]
        ladder:
          - when: "the oldest unpaid installment is 30 or more days past due on the analysis date"
            method: "count the whole months from the oldest unpaid installment's due date to the last day of the coverage term, plus one"
          - when: "the oldest unpaid installment is less than 30 days past due AND the escrow balance is below zero"
            method: "count the whole months from the analysis date to the last day of the coverage term, plus one"
          - when: "otherwise"
            method: "count the whole months from the analysis date to the last day of the coverage term"
        baseline:
          deposits_counted: "11 - MONTHS(coverage_start, NOW)"
        evidence: [date, history]
        cross_difficulty: null
      - id: shortage_spread_months
        effect: parameter
        decides: shortage_spread
        bindings: [spread_days_past_due, shortage_spread]
        ladder:
          - when: "the shortage is at least one month's escrow projection AND the oldest unpaid installment is 30 or more days past due on the analysis date"
            value: "K('spread_months_delinquent')"
          - when: "the shortage is at least one month's escrow projection AND the oldest unpaid installment is less than 30 days past due"
            value: "K('spread_months_current')"
          - when: "otherwise"
            value: "P('escrow_shortage_spread_months')"
        baseline:
          shortage_spread: "P('escrow_shortage_spread_months')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The escrow projection is the newest premium paid from escrow to the borrower's own insurer.
        The escrow cushion is escrow_cushion_months.
        The target low point is the escrow projection times the escrow cushion divided by 12, rounded half up to the cent.
        The home's current coverage term is the 12 months that begin on the coverage start date of the newest premium paid from escrow to the borrower's own insurer, or on the funding date while no premium has yet been paid from escrow, its last day falling the day before the anniversary of that date.
        The escrow deposits counted are the whole months from the analysis date to the last day of the home's current coverage term, one deposit for each such whole month.
        The projected low balance is the escrow balance on the analysis date plus the current monthly escrow deposit times the escrow deposits counted, less the escrow projection.
        The shortage is the target low point less the projected low balance, never below zero, rounded half up to the cent, and the surplus is the projected low balance less the target low point, never below zero.
        The shortage spread is escrow_shortage_spread_months installments.
        The new monthly escrow is the escrow projection divided by 12 plus the shortage divided by the shortage spread, rounded half up to the cent once on that sum, and it applies from the first installment due after the analysis.
      params: [escrow_cushion_months, escrow_shortage_spread_months]
    inputs:
      history:
        - {table: loan_transactions, aggregate: latest, field: amount, filters: {event_type: loan_escrow_disbursement, payee_type: borrower_carrier}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 36, filters: {event_type: loan_escrow_disbursement, payee_type: borrower_carrier}}
        - {category: insurance, table: insurance_notices, aggregate: latest, field: renewal_premium, filters: {event_type: insurance_renewal_offer}}
      cross_category: [insurance]

  - id: loan_ext_returned_payment_fee
    base_policy_refs: [loan_evt_returned_payment]
    overwrite:
      - base_policy: loan_evt_returned_payment
        superseded_clause: >-
          The returned-payment fee of nsf_fee is charged when the return reason is insufficient_funds, account_closed, stop_payment or invalid_account, never for bank_processing_error.
        replaced_by: >-
          A returned-payment fee is charged for each installment payment the bank returns, against the payment returned, when the return reason is insufficient_funds, account_closed, stop_payment or invalid_account, never for bank_processing_error, at the amount set out below, and a returned payment carries at most one such fee.
    trigger: state_due
    subject: [loan_nsf_fee]
    computes: amount
    target_tool: assess_returned_payment_fee_86f751f1
    params:
      fee_autopay_draft: 15.00
      fee_electronic_one_time: 20.00
      mult_heavy: 1.5
      mult_repeat: 1.25
      add_closed_account: 5.00
      add_stop_payment: 10.00
    rule: >-
      A returned-payment fee is charged for each installment payment the bank returns, against the payment returned, when the return reason is insufficient_funds, account_closed, stop_payment or invalid_account, never for bank_processing_error, at the amount set out below, and a returned payment carries at most one such fee.
      The fee is worked out from the newest return on the loan, the one being charged.
      The returned-payment fee is the return channel charge times the return repeat multiplier, plus the return reason charge, rounded half up to the cent once on that sum.
      The return channel charge is nsf_fee.
      Returns are counted over the 12 whole months before the fee date, a return counting when fewer than 12 whole months separate its date from the fee date.
      The return repeat multiplier is 1.
      The return reason charge is zero.
      Where the returned payment was an autopay draft, the return channel charge is fee_autopay_draft; where it was a one-time phone or online portal ACH payment, the return channel charge is fee_electronic_one_time; otherwise the return channel charge is nsf_fee.
      Where autopay on the loan has been cancelled and two or more payments were returned in the 12 whole months before the fee date, returns are counted over the 24 whole months before the fee date; where autopay is in force and the return being charged is the only return in the 6 whole months before the fee date, returns are counted over those 6 months; otherwise returns are counted over the 12 whole months before the fee date.
      Where three or more returns are counted, the return repeat multiplier is mult_heavy; where exactly two returns are counted, the return repeat multiplier is mult_repeat; otherwise the return repeat multiplier is 1.
      Where the return reason is account_closed or invalid_account, the return reason charge is add_closed_account; where it is stop_payment, the return reason charge is add_stop_payment; otherwise the return reason charge is zero.
    prerequisite: []
    cross_category: []
    compute:
      - returned_payment: "LATEST('loan_transactions', 'source_txn_id', date_field='txn_date', event_type='loan_payment_return')"
      - returned_channel: "LATEST('loan_transactions', 'payment_channel', date_field='txn_date', loan_txn_id=returned_payment)"
      - channel_charge: "K('fee_autopay_draft') if returned_channel == 'ach_autopay' else (K('fee_electronic_one_time') if returned_channel == 'phone_ach' or returned_channel == 'online_portal_ach' else P('nsf_fee'))"
      - returns_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_return')"
      - returns_24m: "COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_payment_return')"
      - returns_6m: "COUNT('loan_transactions', within_months=6, date_field='txn_date', event_type='loan_payment_return')"
      - returns_counted: "returns_24m if F('autopay_enrolled') == False and returns_12m >= 2 else (returns_6m if F('autopay_enrolled') == True and returns_6m <= 1 else returns_12m)"
      - repeat_multiplier: "K('mult_heavy') if returns_counted >= 3 else (K('mult_repeat') if returns_counted == 2 else 1.0)"
      - return_reason: "LATEST('loan_transactions', 'return_reason', date_field='txn_date', event_type='loan_payment_return')"
      - reason_charge: "K('add_closed_account') if return_reason == 'account_closed' or return_reason == 'invalid_account' else (K('add_stop_payment') if return_reason == 'stop_payment' else 0.0)"
      - result: "int(RND((channel_charge * repeat_multiplier + reason_charge) * 100, 6) + 0.5) / 100"
    compute_basis:
      returned_payment: "The fee is worked out from the newest return on the loan, the one being charged."
      returned_channel: "Where the returned payment was an autopay draft"
      channel_charge: "Where the returned payment was an autopay draft, the return channel charge is fee_autopay_draft; where it was a one-time phone or online portal ACH payment, the return channel charge is fee_electronic_one_time; otherwise the return channel charge is nsf_fee."
      returns_12m: "Returns are counted over the 12 whole months before the fee date, a return counting when fewer than 12 whole months separate its date from the fee date."
      returns_24m: "returns are counted over the 24 whole months before the fee date"
      returns_6m: "where autopay is in force and the return being charged is the only return in the 6 whole months before the fee date, returns are counted over those 6 months"
      returns_counted: "Where autopay on the loan has been cancelled and two or more payments were returned in the 12 whole months before the fee date, returns are counted over the 24 whole months before the fee date; where autopay is in force and the return being charged is the only return in the 6 whole months before the fee date, returns are counted over those 6 months; otherwise returns are counted over the 12 whole months before the fee date."
      repeat_multiplier: "Where three or more returns are counted, the return repeat multiplier is mult_heavy; where exactly two returns are counted, the return repeat multiplier is mult_repeat; otherwise the return repeat multiplier is 1."
      return_reason: "Where the return reason is account_closed or invalid_account"
      reason_charge: "Where the return reason is account_closed or invalid_account, the return reason charge is add_closed_account; where it is stop_payment, the return reason charge is add_stop_payment; otherwise the return reason charge is zero."
      result: "The returned-payment fee is the return channel charge times the return repeat multiplier, plus the return reason charge, rounded half up to the cent once on that sum."
    factors:
      - id: return_channel_charge
        effect: parameter
        decides: channel_charge
        bindings: [returned_payment, returned_channel, channel_charge]
        ladder:
          - when: "the returned payment was an autopay draft"
            value: "K('fee_autopay_draft')"
          - when: "the returned payment was a one-time phone or online portal ACH payment"
            value: "K('fee_electronic_one_time')"
          - when: "otherwise (a mailed check, a cashier's check or a money order)"
            value: "P('nsf_fee')"
        baseline:
          channel_charge: "P('nsf_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: return_count_window
        effect: method
        decides: returns_counted
        bindings: [returns_24m, returns_6m, returns_counted]
        ladder:
          - when: "autopay on the loan has been cancelled AND two or more payments were returned in the 12 whole months before the fee date"
            method: "count the returns of the 24 whole months before the fee date"
          - when: "autopay is in force AND the return being charged is the only return in the 6 whole months before the fee date"
            method: "count the returns of the 6 whole months before the fee date"
          - when: "otherwise"
            method: "count the returns of the 12 whole months before the fee date"
        baseline:
          returns_counted: "returns_12m"
        evidence: [history]
        cross_difficulty: null
      - id: return_repeat_multiplier
        effect: parameter
        decides: repeat_multiplier
        bindings: [returns_12m, repeat_multiplier]
        ladder:
          - when: "three or more returns are counted"
            value: "K('mult_heavy')"
          - when: "exactly two returns are counted"
            value: "K('mult_repeat')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          repeat_multiplier: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: return_reason_charge
        effect: parameter
        decides: reason_charge
        bindings: [return_reason, reason_charge]
        ladder:
          - when: "the return reason is account_closed or invalid_account"
            value: "K('add_closed_account')"
          - when: "the return reason is stop_payment"
            value: "K('add_stop_payment')"
          - when: "otherwise (insufficient_funds)"
            value: "0.0"
        baseline:
          reason_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The returned-payment fee is the return channel charge times the return repeat multiplier, plus the return reason charge, rounded half up to the cent once on that sum.
        The return channel charge is nsf_fee.
        Returns are counted over the 12 whole months before the fee date, a return counting when fewer than 12 whole months separate its date from the fee date.
        The return repeat multiplier is 1.
        The return reason charge is zero.
      params: [nsf_fee]
    inputs:
      history:
        - {table: loan_transactions, aggregate: latest, field: source_txn_id, filters: {event_type: loan_payment_return}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 24, filters: {event_type: loan_payment_return}}
      cross_category: []

  - id: loan_ext_good_faith_payment
    base_policy_refs: [loan_evt_payment_application]
    overwrite: []
    trigger: on_request
    subject: [loan_partial_payment]
    computes: amount
    target_tool: make_good_faith_payment_f58b4303
    params:
      pct_deep: 40.0
      pct_mid: 30.0
      pct_standard: 25.0
      repeat_twice: 1.5
      repeat_once: 1.2
      returned_history_mult: 1.1
      clean_autopay_mult: 0.9
      standing_both_current: 0.5
      standing_one_current: 0.75
    rule: >-
      A good-faith payment is a one-time partial payment the borrower authorizes on their own loan toward a hardship deferment, and it is held in suspense like any payment smaller than one full installment.
      The installments past due are the unpaid installments falling due on or before the payment date, that is the whole months from the oldest unpaid installment's due date to the payment date plus one.
      The principal and interest past due is the monthly principal-and-interest amount times the installments past due.
      The good-faith payment is pct_standard percent of the principal and interest past due, rounded half up to the cent.
      In full, the good-faith payment is the principal and interest past due times the good-faith percentage divided by 100, then times the good-faith repeat multiplier, the good-faith payment-history multiplier and the resident standing fraction, rounded half up to the cent once at the end.
      Where the oldest unpaid installment is 30 or more days past due on the payment date, the good-faith percentage is pct_deep; where it is 15 to 29 days past due, the good-faith percentage is pct_mid; otherwise the good-faith percentage is pct_standard.
      Where the loan's first installment fell due 48 or more whole months before the payment date, the installments past due for the good-faith payment count only the installments that are a whole month or more past due, that is the whole months from the oldest unpaid installment's due date to the payment date; where it fell due fewer than 24 whole months before, they count every unpaid installment falling due on or before the payment date and the next installment as well, that is those whole months plus two; otherwise they count every unpaid installment falling due on or before the payment date, those whole months plus one.
      Where two or more deferment agreements were signed on the loan in the 36 whole months before the payment date, the good-faith repeat multiplier is repeat_twice; where exactly one was signed in those 36 months, the good-faith repeat multiplier is repeat_once; otherwise the good-faith repeat multiplier is 1.
      Where autopay on the loan has been cancelled and two or more payments were returned in the 12 whole months before the payment date, the good-faith payment-history multiplier is returned_history_mult; where autopay is in force and no payment was returned in those 12 months, the good-faith payment-history multiplier is clean_autopay_mult; otherwise the good-faith payment-history multiplier is 1.
      Where the borrower's site lease for the financed home shows no rent owed and the utility account of that same site shows no balance owed, the resident standing fraction is standing_both_current; where exactly one of the two shows nothing owed, the resident standing fraction is standing_one_current; otherwise the resident standing fraction is 1.
      Days past due are counted in calendar days from the oldest unpaid installment's due date to the payment date, never below zero.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [rent_balance]
        note: The resident standing fraction reads whether the site lease of the financed home shows rent owed.
      - category: utility
        as: branch
        reads: [utility_balance]
        note: The resident standing fraction reads whether the utility account of the same site shows a balance owed.
    compute:
      - good_faith_seasoning_months: "MONTHS(F('first_payment_date'), NOW)"
      - installments_past_due: "MONTHS(F('next_due_date'), NOW) if good_faith_seasoning_months >= 48 else (MONTHS(F('next_due_date'), NOW) + 2 if good_faith_seasoning_months < 24 else MONTHS(F('next_due_date'), NOW) + 1)"
      - pi_past_due: "F('monthly_pi_amount') * installments_past_due"
      - good_faith_days_past_due: "MX(0, DAYS(F('next_due_date'), NOW))"
      - good_faith_pct: "K('pct_deep') if good_faith_days_past_due >= 30 else (K('pct_mid') if good_faith_days_past_due >= 15 else K('pct_standard'))"
      - agreements_36m: "COUNT('loan_notices', within_months=36, date_field='notice_date', event_type='loan_deferment_agreement')"
      - repeat_multiplier: "K('repeat_twice') if agreements_36m >= 2 else (K('repeat_once') if agreements_36m == 1 else 1.0)"
      - returns_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_payment_return')"
      - history_multiplier: "K('returned_history_mult') if F('autopay_enrolled') == False and returns_12m >= 2 else (K('clean_autopay_mult') if F('autopay_enrolled') == True and returns_12m == 0 else 1.0)"
      - lease_rent_owed: "CFIELD('lease', 'rent_balance', lease_id=F('lease_id'))"
      - utility_owed: "CFIELD('utility', 'utility_balance', lease_id=F('lease_id'))"
      - standing_fraction: "K('standing_both_current') if lease_rent_owed <= 0 and utility_owed <= 0 else (K('standing_one_current') if (lease_rent_owed <= 0 and utility_owed > 0) or (lease_rent_owed > 0 and utility_owed <= 0) else 1.0)"
      - result: "int(RND((pi_past_due * good_faith_pct / 100 * repeat_multiplier * history_multiplier * standing_fraction) * 100, 6) + 0.5) / 100"
    compute_basis:
      good_faith_seasoning_months: "Where the loan's first installment fell due 48 or more whole months before the payment date"
      installments_past_due: "Where the loan's first installment fell due 48 or more whole months before the payment date, the installments past due for the good-faith payment count only the installments that are a whole month or more past due, that is the whole months from the oldest unpaid installment's due date to the payment date; where it fell due fewer than 24 whole months before, they count every unpaid installment falling due on or before the payment date and the next installment as well, that is those whole months plus two; otherwise they count every unpaid installment falling due on or before the payment date, those whole months plus one."
      pi_past_due: "The principal and interest past due is the monthly principal-and-interest amount times the installments past due."
      good_faith_days_past_due: "Days past due are counted in calendar days from the oldest unpaid installment's due date to the payment date, never below zero."
      good_faith_pct: "Where the oldest unpaid installment is 30 or more days past due on the payment date, the good-faith percentage is pct_deep; where it is 15 to 29 days past due, the good-faith percentage is pct_mid; otherwise the good-faith percentage is pct_standard."
      agreements_36m: "Where two or more deferment agreements were signed on the loan in the 36 whole months before the payment date"
      repeat_multiplier: "Where two or more deferment agreements were signed on the loan in the 36 whole months before the payment date, the good-faith repeat multiplier is repeat_twice; where exactly one was signed in those 36 months, the good-faith repeat multiplier is repeat_once; otherwise the good-faith repeat multiplier is 1."
      returns_12m: "two or more payments were returned in the 12 whole months before the payment date"
      history_multiplier: "Where autopay on the loan has been cancelled and two or more payments were returned in the 12 whole months before the payment date, the good-faith payment-history multiplier is returned_history_mult; where autopay is in force and no payment was returned in those 12 months, the good-faith payment-history multiplier is clean_autopay_mult; otherwise the good-faith payment-history multiplier is 1."
      lease_rent_owed: "Where the borrower's site lease for the financed home shows no rent owed"
      utility_owed: "the utility account of that same site shows no balance owed"
      standing_fraction: "Where the borrower's site lease for the financed home shows no rent owed and the utility account of that same site shows no balance owed, the resident standing fraction is standing_both_current; where exactly one of the two shows nothing owed, the resident standing fraction is standing_one_current; otherwise the resident standing fraction is 1."
      result: "In full, the good-faith payment is the principal and interest past due times the good-faith percentage divided by 100, then times the good-faith repeat multiplier, the good-faith payment-history multiplier and the resident standing fraction, rounded half up to the cent once at the end."
    factors:
      - id: good_faith_percentage
        effect: parameter
        decides: good_faith_pct
        bindings: [good_faith_days_past_due, good_faith_pct]
        ladder:
          - when: "the oldest unpaid installment is 30 or more days past due on the payment date"
            value: "K('pct_deep')"
          - when: "the oldest unpaid installment is 15 to 29 days past due"
            value: "K('pct_mid')"
          - when: "otherwise"
            value: "K('pct_standard')"
        baseline:
          good_faith_pct: "K('pct_standard')"
        evidence: [date]
        cross_difficulty: null
      - id: good_faith_installment_window
        effect: method
        decides: installments_past_due
        bindings: [good_faith_seasoning_months, installments_past_due]
        ladder:
          - when: "the loan's first installment fell due 48 or more whole months before the payment date"
            method: "count only the installments a whole month or more past due (the whole months from the oldest unpaid due date to the payment date)"
          - when: "the first installment fell due fewer than 24 whole months before the payment date"
            method: "count every unpaid installment due on or before the payment date and the next installment as well (those whole months plus two)"
          - when: "otherwise"
            method: "count every unpaid installment due on or before the payment date (those whole months plus one)"
        baseline:
          installments_past_due: "MONTHS(F('next_due_date'), NOW) + 1"
        evidence: [date]
        cross_difficulty: null
      - id: good_faith_repeat_hardship
        effect: parameter
        decides: repeat_multiplier
        bindings: [agreements_36m, repeat_multiplier]
        ladder:
          - when: "two or more deferment agreements were signed on the loan in the 36 whole months before the payment date"
            value: "K('repeat_twice')"
          - when: "exactly one deferment agreement was signed in those 36 months"
            value: "K('repeat_once')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          repeat_multiplier: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: good_faith_payment_history
        effect: parameter
        decides: history_multiplier
        bindings: [returns_12m, history_multiplier]
        ladder:
          - when: "autopay on the loan has been cancelled AND two or more payments were returned in the 12 whole months before the payment date"
            value: "K('returned_history_mult')"
          - when: "autopay is in force AND no payment was returned in those 12 months"
            value: "K('clean_autopay_mult')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          history_multiplier: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: good_faith_resident_standing
        effect: parameter
        decides: standing_fraction
        bindings: [lease_rent_owed, utility_owed, standing_fraction]
        ladder:
          - when: "the site lease of the financed home shows no rent owed AND the utility account of that site shows no balance owed"
            value: "K('standing_both_current')"
          - when: "exactly one of the site lease and the utility account shows nothing owed"
            value: "K('standing_one_current')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          standing_fraction: "1.0"
        evidence: [cross_category]
        cross_difficulty: lease
    baseline:
      rule: >-
        The installments past due are the unpaid installments falling due on or before the payment date, that is the whole months from the oldest unpaid installment's due date to the payment date plus one.
        The principal and interest past due is the monthly principal-and-interest amount times the installments past due.
        The good-faith payment is pct_standard percent of the principal and interest past due, rounded half up to the cent.
      params: [pct_standard]
    inputs:
      history:
        - {table: loan_notices, aggregate: count, field: loan_notice_id, within_months: 36, filters: {event_type: loan_deferment_agreement}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_payment_return}}
      cross_category: [lease, utility]

  - id: loan_ext_deferment_fee
    base_policy_refs: [loan_deferment_terms]
    overwrite:
      - base_policy: loan_deferment_terms
        superseded_clause: >-
          The deferment_fee is charged when the agreement is signed and is never financed or waived as a courtesy.
        replaced_by: >-
          The deferment fee is charged when the agreement is signed, is never financed or waived as a courtesy, and is the deferment agreement charge times the deferment repeat factor, plus the deferral charge, rounded half up to the cent once on that sum.
    trigger: on_request
    subject: [loan_deferment_agreement, loan_deferment_fee]
    computes: deferment_fee
    target_tool: sign_deferment_agreement_a442f6a7
    params:
      agreement_fee_florida: 30.00
      agreement_fee_mi_pa: 25.00
      repeat_heavy: 1.5
      repeat_light: 1.25
      pct_seasoned: 0.50
      pct_established: 0.75
      pct_standard: 1.00
      addon_two_returns: 0.50
      addon_one_return: 0.25
      relationship_escrow_billed: 0.5
      relationship_other_billing: 0.75
    rule: >-
      A deferment agreement is the borrower's own signed agreement moving the oldest unpaid installments, unchanged, to follow the maturity date.
      The deferment fee is charged when the agreement is signed, is never financed or waived as a courtesy, and is the deferment agreement charge times the deferment repeat factor, plus the deferral charge, rounded half up to the cent once on that sum.
      The installments deferred are the oldest unpaid installments falling due on or before the signing date, that is the whole months from the oldest unpaid installment's due date to the signing date plus one, up to deferment_max_months_per_request and to the installments still available under deferment_lifetime_max_months, that is deferment_lifetime_max_months less the installments already deferred over the loan's life.
      The scheduled installment is the monthly principal-and-interest amount plus the current monthly escrow deposit.
      The deferral charge is the scheduled installment times the deferral rate, plus the deferral risk add-on, divided by 100, times the deferral charge periods, rounded half up to the cent, and the deferral charge charged is that rounded amount times the relationship fraction, rounded half up to the cent.
      The deferment fee is deferment_fee plus the deferral charge, rounded half up to the cent.
      The deferral charge is pct_standard percent of the scheduled installment for each installment deferred, rounded half up to the cent.
      Where the home's site is in Willow Bend Estates or Palmetto Shores, the Florida communities, the deferment agreement charge is agreement_fee_florida; where it is in Cedar Hollow or Conestoga Meadows, the deferment agreement charge is agreement_fee_mi_pa; otherwise the deferment agreement charge is deferment_fee for the program.
      Where an earlier deferment agreement was signed on the loan in the 36 whole months before the signing date and two or more installments have already been deferred over the loan's life, the deferment repeat factor is repeat_heavy; where an earlier agreement was signed in those 36 months and fewer than two installments have been deferred over the loan's life, the deferment repeat factor is repeat_light; otherwise the deferment repeat factor is 1.
      Where the loan's first installment fell due 60 or more whole months before the signing date, the deferral rate is pct_seasoned percent; where it fell due 36 to 59 whole months before, the deferral rate is pct_established percent; otherwise the deferral rate is pct_standard percent.
      Where two or more returned-payment fees were charged on the loan in the 12 whole months before the signing date, the deferral risk add-on is addon_two_returns percentage points; where exactly one was charged in those 12 months, the deferral risk add-on is addon_one_return percentage points; otherwise there is no deferral risk add-on.
      Where the loan was funded on or after 2019-07-01, under the contract form whose deferral clause charges each deferred installment for every month it is moved, the deferral charge periods are the installments deferred times the installments deferred; where the loan was funded before 2015-01-01, the deferral charge periods are one for the whole agreement; otherwise the deferral charge periods are the installments deferred.
      Where the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee and is billed to the loan escrow, the relationship fraction is relationship_escrow_billed; where such a policy names Hearthstone Home Finance as loss payee but is billed another way, the relationship fraction is relationship_other_billing; otherwise the relationship fraction is 1.
      The deferment fee is fixed only after the loan carries an escrow analysis dated within the twelve months before the signing date.
      Before the deferment fee is fixed, the fees owed on the loan must carry a returned-payment fee for every payment returned for a fee-bearing reason.
      The deferment agreement is not signed until a good-faith partial payment received on the signing date stands in suspense.
    prerequisite:
      - problem: loan_ext_escrow_analysis
        kind: value_input
        gate: installment
        form: state
        policy_source: >-
          The deferment fee is fixed only after the loan carries an escrow analysis dated within the twelve months before the signing date.
        condition: >-
          loan_notices holds a loan_escrow_analysis row for the loan whose notice_date falls within the twelve months before the signing date, and loan_holdings.monthly_escrow_amount is the deposit that analysis set.
        resolved_by: issue_escrow_analysis_2b6c143e
        effect: >-
          The scheduled installment the deferral charge rests on takes the monthly escrow deposit the new analysis sets, so the deferral charge and the deferment fee change with it.
      - problem: loan_ext_returned_payment_fee
        kind: value_input
        gate: returned_fees_12m
        form: state
        policy_source: >-
          Before the deferment fee is fixed, the fees owed on the loan must carry a returned-payment fee for every payment returned for a fee-bearing reason.
        condition: >-
          Every loan_payment_return row on the loan whose return_reason is insufficient_funds, account_closed, stop_payment or invalid_account has a loan_nsf_fee row whose source_txn_id is the returned payment.
        resolved_by: assess_returned_payment_fee_86f751f1
        effect: >-
          The returned-payment fees charged in the 12 months before signing gain the fee for the uncharged return, which can move the deferral risk add-on to a higher tier and so raise the deferral charge.
      - problem: loan_ext_good_faith_payment
        kind: state_gate
        gate: loan_holdings.suspense_balance
        form: state
        policy_source: >-
          The deferment agreement is not signed until a good-faith partial payment received on the signing date stands in suspense.
        condition: >-
          loan_transactions holds a loan_partial_payment row on the loan dated the signing date, and loan_holdings.suspense_balance includes it.
        resolved_by: make_good_faith_payment_f58b4303
        effect: >-
          The agreement may be signed: the good-faith partial payment received that day stands in suspense.
    cross_category:
      - category: lease
        as: branch
        reads: [community_name]
        note: The deferment agreement charge is chosen by the community the financed home's site lies in, read from the site lease.
      - category: insurance
        as: branch
        reads: [status, loss_payee, payment_plan]
        note: The relationship fraction reads whether the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee and how it is billed.
    compute:
      - community: "CFIELD('lease', 'community_name', lease_id=F('lease_id'))"
      - agreement_charge: "K('agreement_fee_florida') if community == 'Willow Bend Estates' or community == 'Palmetto Shores' else (K('agreement_fee_mi_pa') if community == 'Cedar Hollow' or community == 'Conestoga Meadows' else P('deferment_fee'))"
      - prior_agreements: "COUNT('loan_notices', within_months=36, date_field='notice_date', event_type='loan_deferment_agreement')"
      - repeat_factor: "K('repeat_heavy') if prior_agreements >= 1 and F('deferred_months_total') >= 2 else (K('repeat_light') if prior_agreements >= 1 and F('deferred_months_total') < 2 else 1.0)"
      - deferral_seasoning_months: "MONTHS(F('first_payment_date'), NOW)"
      - deferral_rate: "K('pct_seasoned') if deferral_seasoning_months >= 60 else (K('pct_established') if deferral_seasoning_months >= 36 else K('pct_standard'))"
      - returned_fees_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_nsf_fee')"
      - risk_addon: "K('addon_two_returns') if returned_fees_12m >= 2 else (K('addon_one_return') if returned_fees_12m == 1 else 0.0)"
      - installments_deferred: "MN(MONTHS(F('next_due_date'), NOW) + 1, P('deferment_max_months_per_request'), P('deferment_lifetime_max_months') - F('deferred_months_total'))"
      - installment: "F('monthly_pi_amount') + F('monthly_escrow_amount')"
      - funded_on: "LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_principal_advance')"
      - charge_periods: "installments_deferred * installments_deferred if funded_on >= '2019-07-01' else (1 if funded_on < '2015-01-01' else installments_deferred)"
      - deferral_charge: "int(RND((installment * (deferral_rate + risk_addon) / 100 * charge_periods) * 100, 6) + 0.5) / 100"
      - policy_payee: "CFIELD('insurance', 'loss_payee', status='in_force')"
      - policy_billing: "CFIELD('insurance', 'payment_plan', status='in_force')"
      - relationship_fraction: "K('relationship_escrow_billed') if policy_payee == 'hearthstone_home_finance' and policy_billing == 'loan_escrow' else (K('relationship_other_billing') if policy_payee == 'hearthstone_home_finance' and policy_billing != 'loan_escrow' else 1.0)"
      - relationship_charge: "int(RND((deferral_charge * relationship_fraction) * 100, 6) + 0.5) / 100"
      - result: "int(RND((agreement_charge * repeat_factor + relationship_charge) * 100, 6) + 0.5) / 100"
    compute_basis:
      community: "Where the home's site is in Willow Bend Estates or Palmetto Shores, the Florida communities"
      agreement_charge: "Where the home's site is in Willow Bend Estates or Palmetto Shores, the Florida communities, the deferment agreement charge is agreement_fee_florida; where it is in Cedar Hollow or Conestoga Meadows, the deferment agreement charge is agreement_fee_mi_pa; otherwise the deferment agreement charge is deferment_fee for the program."
      prior_agreements: "Where an earlier deferment agreement was signed on the loan in the 36 whole months before the signing date"
      repeat_factor: "Where an earlier deferment agreement was signed on the loan in the 36 whole months before the signing date and two or more installments have already been deferred over the loan's life, the deferment repeat factor is repeat_heavy; where an earlier agreement was signed in those 36 months and fewer than two installments have been deferred over the loan's life, the deferment repeat factor is repeat_light; otherwise the deferment repeat factor is 1."
      deferral_seasoning_months: "Where the loan's first installment fell due 60 or more whole months before the signing date"
      deferral_rate: "Where the loan's first installment fell due 60 or more whole months before the signing date, the deferral rate is pct_seasoned percent; where it fell due 36 to 59 whole months before, the deferral rate is pct_established percent; otherwise the deferral rate is pct_standard percent."
      returned_fees_12m: "Where two or more returned-payment fees were charged on the loan in the 12 whole months before the signing date"
      risk_addon: "Where two or more returned-payment fees were charged on the loan in the 12 whole months before the signing date, the deferral risk add-on is addon_two_returns percentage points; where exactly one was charged in those 12 months, the deferral risk add-on is addon_one_return percentage points; otherwise there is no deferral risk add-on."
      installments_deferred: "The installments deferred are the oldest unpaid installments falling due on or before the signing date, that is the whole months from the oldest unpaid installment's due date to the signing date plus one, up to deferment_max_months_per_request and to the installments still available under deferment_lifetime_max_months, that is deferment_lifetime_max_months less the installments already deferred over the loan's life."
      installment: "The scheduled installment is the monthly principal-and-interest amount plus the current monthly escrow deposit."
      funded_on: "Where the loan was funded on or after 2019-07-01"
      charge_periods: "Where the loan was funded on or after 2019-07-01, under the contract form whose deferral clause charges each deferred installment for every month it is moved, the deferral charge periods are the installments deferred times the installments deferred; where the loan was funded before 2015-01-01, the deferral charge periods are one for the whole agreement; otherwise the deferral charge periods are the installments deferred."
      deferral_charge: "The deferral charge is the scheduled installment times the deferral rate, plus the deferral risk add-on, divided by 100, times the deferral charge periods, rounded half up to the cent, and the deferral charge charged is that rounded amount times the relationship fraction, rounded half up to the cent."
      policy_payee: "Where the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee"
      policy_billing: "and is billed to the loan escrow"
      relationship_fraction: "Where the borrower's in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee and is billed to the loan escrow, the relationship fraction is relationship_escrow_billed; where such a policy names Hearthstone Home Finance as loss payee but is billed another way, the relationship fraction is relationship_other_billing; otherwise the relationship fraction is 1."
      relationship_charge: "the deferral charge charged is that rounded amount times the relationship fraction, rounded half up to the cent."
      result: "The deferment fee is charged when the agreement is signed, is never financed or waived as a courtesy, and is the deferment agreement charge times the deferment repeat factor, plus the deferral charge, rounded half up to the cent once on that sum."
    factors:
      - id: deferment_agreement_charge
        effect: parameter
        decides: agreement_charge
        bindings: [community, agreement_charge]
        ladder:
          - when: "the home's site is in Willow Bend Estates or Palmetto Shores (Florida)"
            value: "K('agreement_fee_florida')"
          - when: "the home's site is in Cedar Hollow or Conestoga Meadows"
            value: "K('agreement_fee_mi_pa')"
          - when: "otherwise"
            value: "P('deferment_fee')"
        baseline:
          agreement_charge: "P('deferment_fee')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: deferment_repeat_factor
        effect: parameter
        decides: repeat_factor
        bindings: [prior_agreements, repeat_factor]
        ladder:
          - when: "an earlier deferment agreement was signed in the 36 whole months before signing AND two or more installments have already been deferred over the loan's life"
            value: "K('repeat_heavy')"
          - when: "an earlier deferment agreement was signed in the 36 whole months before signing AND fewer than two installments have been deferred over the loan's life"
            value: "K('repeat_light')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          repeat_factor: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: deferral_rate_seasoning
        effect: parameter
        decides: deferral_rate
        bindings: [deferral_seasoning_months, deferral_rate]
        ladder:
          - when: "the first installment fell due 60 or more whole months before the signing date"
            value: "K('pct_seasoned')"
          - when: "the first installment fell due 36 to 59 whole months before the signing date"
            value: "K('pct_established')"
          - when: "otherwise"
            value: "K('pct_standard')"
        baseline:
          deferral_rate: "K('pct_standard')"
        evidence: [date]
        cross_difficulty: null
      - id: deferral_risk_addon
        effect: parameter
        decides: risk_addon
        bindings: [returned_fees_12m, risk_addon]
        ladder:
          - when: "two or more returned-payment fees were charged in the 12 whole months before signing"
            value: "K('addon_two_returns')"
          - when: "exactly one returned-payment fee was charged in those 12 months"
            value: "K('addon_one_return')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          risk_addon: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: deferral_charge_periods
        effect: method
        decides: charge_periods
        bindings: [funded_on, charge_periods]
        ladder:
          - when: "the loan was funded on or after 2019-07-01"
            method: "each deferred installment is charged for every month it is moved: installments deferred times installments deferred"
          - when: "the loan was funded before 2015-01-01"
            method: "the charge is counted once for the whole agreement"
          - when: "otherwise"
            method: "the charge is counted once for each installment deferred"
        baseline:
          charge_periods: "installments_deferred"
        evidence: [history, date]
        cross_difficulty: null
      - id: deferral_relationship_fraction
        effect: parameter
        decides: relationship_fraction
        bindings: [policy_payee, policy_billing, relationship_fraction]
        ladder:
          - when: "the in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee AND is billed to the loan escrow"
            value: "K('relationship_escrow_billed')"
          - when: "the in-force Hearthstone Insurance Agency policy names Hearthstone Home Finance as loss payee AND is billed another way"
            value: "K('relationship_other_billing')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          relationship_fraction: "1.0"
        evidence: [cross_category]
        cross_difficulty: insurance
    baseline:
      rule: >-
        The installments deferred are the oldest unpaid installments falling due on or before the signing date, that is the whole months from the oldest unpaid installment's due date to the signing date plus one, up to deferment_max_months_per_request and to the installments still available under deferment_lifetime_max_months, that is deferment_lifetime_max_months less the installments already deferred over the loan's life.
        The scheduled installment is the monthly principal-and-interest amount plus the current monthly escrow deposit.
        The deferral charge is pct_standard percent of the scheduled installment for each installment deferred, rounded half up to the cent.
        The deferment fee is deferment_fee plus the deferral charge, rounded half up to the cent.
      params: [deferment_fee, pct_standard, deferment_max_months_per_request, deferment_lifetime_max_months]
    inputs:
      history:
        - {table: loan_notices, aggregate: count, field: loan_notice_id, filters: {event_type: loan_deferment_agreement}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_nsf_fee}}
        - {table: loan_transactions, aggregate: latest, field: txn_date, filters: {event_type: loan_principal_advance}}
      cross_category: [lease, insurance]

  - id: loan_ext_late_charge
    base_policy_refs: [loan_evt_late_charge]
    overwrite:
      - base_policy: loan_evt_late_charge
        superseded_clause: >-
          The charge is late_charge_pct_of_installment percent of the monthly principal-and-interest amount, raised to late_charge_min and capped at late_charge_max for the program, rounded half up to the cent.
        replaced_by: >-
          The late charge rate is chosen by the community the home's site lies in: in Conestoga Meadows it is pct_pa percent, in Cedar Hollow it is pct_mi percent, and in every other community it is late_charge_pct_of_installment percent.
    trigger: state_due
    subject: [loan_late_charge]
    computes: amount
    target_tool: assess_late_charge_8f52dfa4
    params:
      pct_pa: 2.0
      pct_mi: 4.0
      hist_two: 1.25
      hist_one: 1.1
      season_long: 0.9
      season_mid: 0.95
      tenure_long: 0.85
      tenure_mid: 0.95
      cure_within_five_days: 0.5
      cure_within_ten_days: 0.8
    rule: >-
      A late charge is owed on an installment that was not paid in full within its grace period, once the grace period has ended, whether the installment is still unpaid or was received late, and it is assessed against that installment.
      The installment charged is the oldest unpaid installment when its grace period has already ended, and otherwise the most recent installment received, received after its grace period.
      The late charge is the monthly principal-and-interest amount times the late charge rate divided by 100, times the late history multiplier, the late seasoning multiplier and the residence tenure multiplier, rounded half up to the cent once; that amount is raised to late_charge_min and capped at late_charge_max for the program, and the late charge assessed is that bounded amount times the prompt-cure fraction, rounded half up to the cent.
      The late charge is late_charge_pct_of_installment percent of the monthly principal-and-interest amount, rounded half up to the cent, raised to late_charge_min and capped at late_charge_max for the program.
      The late charges counted for the late history are those assessed on the loan in the 12 whole months before the assessment date.
      The late charge rate is chosen by the community the home's site lies in: in Conestoga Meadows it is pct_pa percent, in Cedar Hollow it is pct_mi percent, and in every other community it is late_charge_pct_of_installment percent.
      Where autopay is not in force on the loan and two or more late charges were assessed in the 24 whole months before the assessment date, the late charges counted for the late history are those of those 24 months; where autopay is in force, the late charges counted are those of the 6 whole months before the assessment date; otherwise the late charges counted are those of the 12 whole months before the assessment date.
      Where two or more late charges are counted, the late history multiplier is hist_two; where exactly one is counted, the late history multiplier is hist_one; otherwise the late history multiplier is 1.
      Where the loan's first installment fell due 60 or more whole months before the assessment date, the late seasoning multiplier is season_long; where it fell due 36 to 59 whole months before, the late seasoning multiplier is season_mid; otherwise the late seasoning multiplier is 1.
      Where the borrower moved in on the home's site 120 or more whole months before the assessment date, as the site lease shows, the residence tenure multiplier is tenure_long; where 60 to 119 whole months before, the residence tenure multiplier is tenure_mid; otherwise the residence tenure multiplier is 1.
      Where the installment charged was received 1 to 5 days after its grace period ended, the prompt-cure fraction is cure_within_five_days; where it was received 6 to 10 days after the grace period ended, the prompt-cure fraction is cure_within_ten_days; where it was received later, or is still unpaid at assessment, the prompt-cure fraction is 1.
      Days after the grace period are the calendar days from the installment's due date to the date it was received, less late_charge_grace_days.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [community_name, move_in_date]
        note: The late charge rate is chosen by the community of the home's site and the residence tenure multiplier by the move-in date on the site lease.
    compute:
      - community: "CFIELD('lease', 'community_name', lease_id=F('lease_id'))"
      - late_rate: "K('pct_pa') if community == 'Conestoga Meadows' else (K('pct_mi') if community == 'Cedar Hollow' else P('late_charge_pct_of_installment'))"
      - late_count_12m: "COUNT('loan_transactions', within_months=12, date_field='txn_date', event_type='loan_late_charge')"
      - late_count_24m: "COUNT('loan_transactions', within_months=24, date_field='txn_date', event_type='loan_late_charge')"
      - late_count_6m: "COUNT('loan_transactions', within_months=6, date_field='txn_date', event_type='loan_late_charge')"
      - late_count: "late_count_24m if F('autopay_enrolled') == False and late_count_24m >= 2 else (late_count_6m if F('autopay_enrolled') == True else late_count_12m)"
      - history_multiplier: "K('hist_two') if late_count >= 2 else (K('hist_one') if late_count == 1 else 1.0)"
      - late_seasoning_months: "MONTHS(F('first_payment_date'), NOW)"
      - seasoning_multiplier: "K('season_long') if late_seasoning_months >= 60 else (K('season_mid') if late_seasoning_months >= 36 else 1.0)"
      - move_in: "CFIELD('lease', 'move_in_date', lease_id=F('lease_id'))"
      - tenure_months: "MONTHS(move_in, NOW)"
      - tenure_multiplier: "K('tenure_long') if tenure_months >= 120 else (K('tenure_mid') if tenure_months >= 60 else 1.0)"
      - raw_charge: "int(RND((F('monthly_pi_amount') * late_rate / 100 * history_multiplier * seasoning_multiplier * tenure_multiplier) * 100, 6) + 0.5) / 100"
      - bounded_charge: "MN(MX(raw_charge, P('late_charge_min')), P('late_charge_max'))"
      - charge_due: "F('next_due_date') if DAYS(F('next_due_date'), NOW) > P('late_charge_grace_days') else LATEST('loan_transactions', 'installment_due_date', date_field='installment_due_date', event_type='loan_installment_payment')"
      - receipt_date: "LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_installment_payment', installment_due_date=charge_due)"
      - days_after_grace: "DAYS(charge_due, receipt_date) - P('late_charge_grace_days') if receipt_date != None else 9999"
      - cure_fraction: "K('cure_within_five_days') if days_after_grace >= 1 and days_after_grace <= 5 else (K('cure_within_ten_days') if days_after_grace >= 6 and days_after_grace <= 10 else 1.0)"
      - result: "int(RND((bounded_charge * cure_fraction) * 100, 6) + 0.5) / 100"
    compute_basis:
      community: "The late charge rate is chosen by the community the home's site lies in"
      late_rate: "The late charge rate is chosen by the community the home's site lies in: in Conestoga Meadows it is pct_pa percent, in Cedar Hollow it is pct_mi percent, and in every other community it is late_charge_pct_of_installment percent."
      late_count_12m: "The late charges counted for the late history are those assessed on the loan in the 12 whole months before the assessment date."
      late_count_24m: "Where autopay is not in force on the loan and two or more late charges were assessed in the 24 whole months before the assessment date, the late charges counted for the late history are those of those 24 months"
      late_count_6m: "where autopay is in force, the late charges counted are those of the 6 whole months before the assessment date"
      late_count: "Where autopay is not in force on the loan and two or more late charges were assessed in the 24 whole months before the assessment date, the late charges counted for the late history are those of those 24 months; where autopay is in force, the late charges counted are those of the 6 whole months before the assessment date; otherwise the late charges counted are those of the 12 whole months before the assessment date."
      history_multiplier: "Where two or more late charges are counted, the late history multiplier is hist_two; where exactly one is counted, the late history multiplier is hist_one; otherwise the late history multiplier is 1."
      late_seasoning_months: "Where the loan's first installment fell due 60 or more whole months before the assessment date"
      seasoning_multiplier: "Where the loan's first installment fell due 60 or more whole months before the assessment date, the late seasoning multiplier is season_long; where it fell due 36 to 59 whole months before, the late seasoning multiplier is season_mid; otherwise the late seasoning multiplier is 1."
      move_in: "Where the borrower moved in on the home's site 120 or more whole months before the assessment date, as the site lease shows"
      tenure_months: "Where the borrower moved in on the home's site 120 or more whole months before the assessment date, as the site lease shows"
      tenure_multiplier: "Where the borrower moved in on the home's site 120 or more whole months before the assessment date, as the site lease shows, the residence tenure multiplier is tenure_long; where 60 to 119 whole months before, the residence tenure multiplier is tenure_mid; otherwise the residence tenure multiplier is 1."
      raw_charge: "The late charge is the monthly principal-and-interest amount times the late charge rate divided by 100, times the late history multiplier, the late seasoning multiplier and the residence tenure multiplier, rounded half up to the cent once"
      bounded_charge: "that amount is raised to late_charge_min and capped at late_charge_max for the program"
      charge_due: "The installment charged is the oldest unpaid installment when its grace period has already ended, and otherwise the most recent installment received, received after its grace period."
      receipt_date: "Days after the grace period are the calendar days from the installment's due date to the date it was received, less late_charge_grace_days."
      days_after_grace: "Days after the grace period are the calendar days from the installment's due date to the date it was received, less late_charge_grace_days."
      cure_fraction: "Where the installment charged was received 1 to 5 days after its grace period ended, the prompt-cure fraction is cure_within_five_days; where it was received 6 to 10 days after the grace period ended, the prompt-cure fraction is cure_within_ten_days; where it was received later, or is still unpaid at assessment, the prompt-cure fraction is 1."
      result: "the late charge assessed is that bounded amount times the prompt-cure fraction, rounded half up to the cent."
    factors:
      - id: late_rate_by_community
        effect: parameter
        decides: late_rate
        bindings: [community, late_rate]
        ladder:
          - when: "the home's site is in Conestoga Meadows"
            value: "K('pct_pa')"
          - when: "the home's site is in Cedar Hollow"
            value: "K('pct_mi')"
          - when: "otherwise"
            value: "P('late_charge_pct_of_installment')"
        baseline:
          late_rate: "P('late_charge_pct_of_installment')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: late_history_window
        effect: method
        decides: late_count
        bindings: [late_count_24m, late_count_6m, late_count]
        ladder:
          - when: "autopay is not in force AND two or more late charges were assessed in the 24 whole months before the assessment date"
            method: "count the late charges of the 24 whole months before the assessment date"
          - when: "autopay is in force"
            method: "count the late charges of the 6 whole months before the assessment date"
          - when: "otherwise"
            method: "count the late charges of the 12 whole months before the assessment date"
        baseline:
          late_count: "late_count_12m"
        evidence: [history]
        cross_difficulty: null
      - id: late_history
        effect: parameter
        decides: history_multiplier
        bindings: [late_count_12m, history_multiplier]
        ladder:
          - when: "two or more late charges are counted"
            value: "K('hist_two')"
          - when: "exactly one late charge is counted"
            value: "K('hist_one')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          history_multiplier: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: late_seasoning
        effect: parameter
        decides: seasoning_multiplier
        bindings: [late_seasoning_months, seasoning_multiplier]
        ladder:
          - when: "the first installment fell due 60 or more whole months before the assessment date"
            value: "K('season_long')"
          - when: "the first installment fell due 36 to 59 whole months before the assessment date"
            value: "K('season_mid')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          seasoning_multiplier: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: residence_tenure
        effect: parameter
        decides: tenure_multiplier
        bindings: [move_in, tenure_months, tenure_multiplier]
        ladder:
          - when: "the site lease shows a move-in 120 or more whole months before the assessment date"
            value: "K('tenure_long')"
          - when: "the site lease shows a move-in 60 to 119 whole months before the assessment date"
            value: "K('tenure_mid')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          tenure_multiplier: "1.0"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: prompt_cure_fraction
        effect: parameter
        decides: cure_fraction
        bindings: [charge_due, receipt_date, days_after_grace, cure_fraction]
        ladder:
          - when: "the installment charged was received 1 to 5 days after its grace period ended"
            value: "K('cure_within_five_days')"
          - when: "the installment charged was received 6 to 10 days after its grace period ended"
            value: "K('cure_within_ten_days')"
          - when: "otherwise (received later, or still unpaid at assessment)"
            value: "1.0"
        baseline:
          cure_fraction: "1.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The late charge is late_charge_pct_of_installment percent of the monthly principal-and-interest amount, rounded half up to the cent, raised to late_charge_min and capped at late_charge_max for the program.
        The late charges counted for the late history are those assessed on the loan in the 12 whole months before the assessment date.
      params: [late_charge_pct_of_installment, late_charge_min, late_charge_max]
    inputs:
      history:
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 24, filters: {event_type: loan_late_charge}}
        - {table: loan_transactions, aggregate: latest, field: txn_date, filters: {event_type: loan_installment_payment}}
      cross_category: [lease]

  - id: loan_ext_payoff_statement
    base_policy_refs: [loan_payoff_terms]
    overwrite:
      - base_policy: loan_payoff_terms
        superseded_clause: >-
          It is issued within payoff_statement_business_days business days of the request at a fee of payoff_statement_fee, and its figure is good through payoff_good_through_days calendar days after the statement date.
        replaced_by: >-
          Where the home is under contract in a Hearthstone Home Sales resale file whose closing date falls within 30 days of the statement date, the good-through period runs to the closing date plus closing_buffer_days; where the home is listed in such a file but not yet under contract, the good-through period is listed_good_through_days; otherwise the good-through period is payoff_good_through_days.
      - base_policy: loan_payoff_terms
        superseded_clause: >-
          The payoff amount is the unpaid principal, plus interest at the note rate on the unpaid principal for each day from the due date of the last installment paid through the good-through date on the per_diem_basis, plus fees owed, less suspense funds; the escrow balance is not netted and is refunded separately after payoff.
        replaced_by: >-
          The payoff amount is the unpaid principal, plus the payoff interest, plus fees owed, plus the lien release fee, plus the statement fee, less suspense funds, rounded half up to the cent once on that sum; the escrow balance is not netted and is refunded separately after payoff.
    trigger: on_request
    subject: [loan_payoff_statement]
    computes: payoff_amount
    target_tool: issue_payoff_statement_6569642c
    params:
      release_mi: 15.00
      release_pa: 58.00
      stmt_fee_second: 15.00
      stmt_fee_repeat: 30.00
      closing_buffer_days: 2
      listed_good_through_days: 30
    rule: >-
      A payoff statement is issued on request on a loan that is active or delinquent; it states the good-through date and the payoff amount, the amount that pays the loan in full when received on or before that date.
      The payoff amount is the unpaid principal, plus the payoff interest, plus fees owed, plus the lien release fee, plus the statement fee, less suspense funds, rounded half up to the cent once on that sum; the escrow balance is not netted and is refunded separately after payoff.
      The good-through date is the statement date plus the good-through period plus the weekend roll, in calendar days.
      The payoff interest days are the calendar days from the due date of the last installment paid to the good-through date, counting the good-through date and not that due date.
      The payoff interest is the unpaid principal times the note rate divided by 100, divided by 365, times the payoff interest days, rounded half up to the cent.
      The good-through period is payoff_good_through_days.
      The weekend roll is zero.
      The lien release fee is zero.
      The statement fee is payoff_statement_fee.
      Where the loan was funded on or after 2019-07-01, the payoff interest is worked out on the actual/365 basis as just stated; where it was funded from 2015-01-01 to 2019-06-30, under the contract form of those years, the payoff interest is the unpaid principal times the note rate divided by 100, divided by 360, times the payoff interest days, rounded half up to the cent; where it was funded before 2015-01-01, the payoff interest days count both the due date and the good-through date and the interest is worked out on the actual/365 basis.
      Where the home's site is in Cedar Hollow, the lien release fee for releasing the lien on the home's Michigan title is release_mi; where it is in Conestoga Meadows, the lien release fee for the Pennsylvania title is release_pa; otherwise the lien release fee is zero.
      Where two or more payoff statements were issued on the loan in the 12 whole months before the statement date, the statement fee is stmt_fee_repeat; where exactly one was issued in those 12 months, the statement fee is stmt_fee_second; otherwise the statement fee is payoff_statement_fee.
      Where the home is under contract in a Hearthstone Home Sales resale file whose closing date falls within 30 days of the statement date, the good-through period runs to the closing date plus closing_buffer_days; where the home is listed in such a file but not yet under contract, the good-through period is listed_good_through_days; otherwise the good-through period is payoff_good_through_days.
      Where the statement date plus the good-through period falls on a Saturday, the weekend roll is two days; where it falls on a Sunday, the weekend roll is one day; otherwise the weekend roll is zero.
      The payoff figure is fixed only after the fees owed on the loan carry the late charge due on every installment that was not paid in full within its grace period.
    prerequisite:
      - problem: loan_ext_late_charge
        kind: value_input
        gate: fees_owed
        form: state
        policy_source: >-
          The payoff figure is fixed only after the fees owed on the loan carry the late charge due on every installment that was not paid in full within its grace period.
        condition: >-
          Every installment on the loan whose payment arrived after its grace period ended, or which is still unpaid after it, has a loan_late_charge row with that installment_due_date, and loan_holdings.fees_balance includes it.
        resolved_by: assess_late_charge_8f52dfa4
        effect: >-
          Fees owed rise by the late charge assessed, and the payoff amount rises by the same amount.
    cross_category:
      - category: lease
        as: branch
        reads: [community_name]
        note: The lien release fee is chosen by the community of the home's site, which fixes the title state.
      - category: resale
        as: branch
        reads: [status, closing_date, lienholder]
        note: The good-through period turns on whether the home is under contract or listed in a Hearthstone Home Sales resale file and on its closing date.
    compute:
      - community: "CFIELD('lease', 'community_name', lease_id=F('lease_id'))"
      - release_fee: "K('release_mi') if community == 'Cedar Hollow' else (K('release_pa') if community == 'Conestoga Meadows' else 0.0)"
      - statements_12m: "COUNT('loan_notices', within_months=12, date_field='notice_date', event_type='loan_payoff_statement')"
      - statement_fee: "K('stmt_fee_repeat') if statements_12m >= 2 else (K('stmt_fee_second') if statements_12m == 1 else P('payoff_statement_fee'))"
      - sale_status: "CFIELD('resale', 'status', lienholder='hearthstone_home_finance')"
      - sale_closing: "CFIELD('resale', 'closing_date', lienholder='hearthstone_home_finance')"
      - good_through_period: "DAYS(NOW, sale_closing) + K('closing_buffer_days') if sale_status == 'under_contract' and DAYS(NOW, sale_closing) <= 30 else (K('listed_good_through_days') if sale_status == 'listed' else P('payoff_good_through_days'))"
      - weekday_index: "(DAYS('2024-01-01', NOW) + good_through_period) % 7"
      - weekend_roll: "2 if weekday_index == 5 else (1 if weekday_index == 6 else 0)"
      - last_paid_due: "LATEST('loan_transactions', 'installment_due_date', date_field='installment_due_date', event_type='loan_installment_payment')"
      - payoff_interest_days: "DAYS(last_paid_due, NOW) + good_through_period + weekend_roll"
      - funded_on: "LATEST('loan_transactions', 'txn_date', date_field='txn_date', event_type='loan_principal_advance')"
      - payoff_interest: "int(RND((F('principal_balance') * F('note_rate_pct') / 100 / 365 * payoff_interest_days) * 100, 6) + 0.5) / 100 if funded_on >= '2019-07-01' else (int(RND((F('principal_balance') * F('note_rate_pct') / 100 / 360 * payoff_interest_days) * 100, 6) + 0.5) / 100 if funded_on >= '2015-01-01' else int(RND((F('principal_balance') * F('note_rate_pct') / 100 / 365 * (payoff_interest_days + 1)) * 100, 6) + 0.5) / 100)"
      - fees_owed: "F('fees_balance')"
      - result: "int(RND((F('principal_balance') + payoff_interest + fees_owed + release_fee + statement_fee - F('suspense_balance')) * 100, 6) + 0.5) / 100"
    compute_basis:
      community: "Where the home's site is in Cedar Hollow, the lien release fee for releasing the lien on the home's Michigan title is release_mi"
      release_fee: "Where the home's site is in Cedar Hollow, the lien release fee for releasing the lien on the home's Michigan title is release_mi; where it is in Conestoga Meadows, the lien release fee for the Pennsylvania title is release_pa; otherwise the lien release fee is zero."
      statements_12m: "Where two or more payoff statements were issued on the loan in the 12 whole months before the statement date"
      statement_fee: "Where two or more payoff statements were issued on the loan in the 12 whole months before the statement date, the statement fee is stmt_fee_repeat; where exactly one was issued in those 12 months, the statement fee is stmt_fee_second; otherwise the statement fee is payoff_statement_fee."
      sale_status: "Where the home is under contract in a Hearthstone Home Sales resale file whose closing date falls within 30 days of the statement date"
      sale_closing: "whose closing date falls within 30 days of the statement date, the good-through period runs to the closing date plus closing_buffer_days"
      good_through_period: "Where the home is under contract in a Hearthstone Home Sales resale file whose closing date falls within 30 days of the statement date, the good-through period runs to the closing date plus closing_buffer_days; where the home is listed in such a file but not yet under contract, the good-through period is listed_good_through_days; otherwise the good-through period is payoff_good_through_days."
      weekday_index: "Where the statement date plus the good-through period falls on a Saturday"
      weekend_roll: "Where the statement date plus the good-through period falls on a Saturday, the weekend roll is two days; where it falls on a Sunday, the weekend roll is one day; otherwise the weekend roll is zero."
      last_paid_due: "The payoff interest days are the calendar days from the due date of the last installment paid to the good-through date, counting the good-through date and not that due date."
      payoff_interest_days: "The good-through date is the statement date plus the good-through period plus the weekend roll, in calendar days."
      funded_on: "Where the loan was funded on or after 2019-07-01"
      payoff_interest: "Where the loan was funded on or after 2019-07-01, the payoff interest is worked out on the actual/365 basis as just stated; where it was funded from 2015-01-01 to 2019-06-30, under the contract form of those years, the payoff interest is the unpaid principal times the note rate divided by 100, divided by 360, times the payoff interest days, rounded half up to the cent; where it was funded before 2015-01-01, the payoff interest days count both the due date and the good-through date and the interest is worked out on the actual/365 basis."
      fees_owed: "The payoff amount is the unpaid principal, plus the payoff interest, plus fees owed"
      result: "The payoff amount is the unpaid principal, plus the payoff interest, plus fees owed, plus the lien release fee, plus the statement fee, less suspense funds, rounded half up to the cent once on that sum; the escrow balance is not netted and is refunded separately after payoff."
    factors:
      - id: payoff_day_count
        effect: method
        decides: payoff_interest
        bindings: [funded_on, payoff_interest]
        ladder:
          - when: "the loan was funded from 2015-01-01 to 2019-06-30"
            method: "actual days over a 360-day year"
          - when: "the loan was funded before 2015-01-01"
            method: "actual days over a 365-day year, counting both the due date and the good-through date"
          - when: "otherwise (funded on or after 2019-07-01)"
            method: "actual days over a 365-day year, counting the good-through date and not the due date"
        baseline:
          payoff_interest: "int(RND((F('principal_balance') * F('note_rate_pct') / 100 / 365 * payoff_interest_days) * 100, 6) + 0.5) / 100"
        evidence: [history, date]
        cross_difficulty: null
      - id: lien_release_fee
        effect: parameter
        decides: release_fee
        bindings: [community, release_fee]
        ladder:
          - when: "the home's site is in Cedar Hollow (Michigan title)"
            value: "K('release_mi')"
          - when: "the home's site is in Conestoga Meadows (Pennsylvania title)"
            value: "K('release_pa')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          release_fee: "0.0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: repeat_statement_fee
        effect: parameter
        decides: statement_fee
        bindings: [statements_12m, statement_fee]
        ladder:
          - when: "two or more payoff statements were issued in the 12 whole months before the statement date"
            value: "K('stmt_fee_repeat')"
          - when: "exactly one payoff statement was issued in those 12 months"
            value: "K('stmt_fee_second')"
          - when: "otherwise"
            value: "P('payoff_statement_fee')"
        baseline:
          statement_fee: "P('payoff_statement_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: good_through_period
        effect: parameter
        decides: good_through_period
        bindings: [sale_status, sale_closing, good_through_period]
        ladder:
          - when: "the home is under contract in a Hearthstone Home Sales resale file AND its closing date falls within 30 days of the statement date"
            value: "the days to the closing date plus K('closing_buffer_days')"
          - when: "the home is listed in such a file but not yet under contract"
            value: "K('listed_good_through_days')"
          - when: "otherwise"
            value: "P('payoff_good_through_days')"
        baseline:
          good_through_period: "P('payoff_good_through_days')"
        evidence: [cross_category, date]
        cross_difficulty: resale
      - id: weekend_roll
        effect: method
        decides: weekend_roll
        bindings: [weekday_index, weekend_roll]
        ladder:
          - when: "the statement date plus the good-through period falls on a Saturday"
            method: "move the good-through date forward two days, to the Monday"
          - when: "it falls on a Sunday"
            method: "move the good-through date forward one day, to the Monday"
          - when: "otherwise"
            method: "keep the good-through date"
        baseline:
          weekend_roll: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The payoff amount is the unpaid principal, plus the payoff interest, plus fees owed, plus the lien release fee, plus the statement fee, less suspense funds, rounded half up to the cent once on that sum; the escrow balance is not netted and is refunded separately after payoff.
        The good-through date is the statement date plus the good-through period plus the weekend roll, in calendar days.
        The payoff interest days are the calendar days from the due date of the last installment paid to the good-through date, counting the good-through date and not that due date.
        The payoff interest is the unpaid principal times the note rate divided by 100, divided by 365, times the payoff interest days, rounded half up to the cent.
        The good-through period is payoff_good_through_days.
        The weekend roll is zero.
        The lien release fee is zero.
        The statement fee is payoff_statement_fee.
      params: [payoff_good_through_days, payoff_statement_fee, per_diem_basis]
    inputs:
      history:
        - {table: loan_notices, aggregate: count, field: loan_notice_id, within_months: 12, filters: {event_type: loan_payoff_statement}}
        - {table: loan_transactions, aggregate: latest, field: installment_due_date, filters: {event_type: loan_installment_payment}}
        - {table: loan_transactions, aggregate: latest, field: txn_date, filters: {event_type: loan_principal_advance}}
      cross_category: [lease, resale]

  - id: loan_ext_sale_paydown
    base_policy_refs: [loan_evt_payment_application, loan_payoff_terms]
    overwrite:
      - base_policy: loan_evt_payment_application
        superseded_clause: >-
          Money left after whole installments is applied to fees owed, and any remainder is applied as a curtailment when it is at least min_curtailment_amount, otherwise held in suspense.
        replaced_by: >-
          A sale paydown is applied to principal only, as a curtailment; fees owed stay on the payoff and are paid from the sale proceeds at closing.
    trigger: on_request
    subject: [loan_curtailment]
    computes: amount
    target_tool: make_principal_paydown_1606199b
    params:
      margin_far: 200.00
      margin_near: 100.00
    rule: >-
      A borrower selling the financed home through a Hearthstone Home Sales resale file may pay down the loan principal before closing so that the sale proceeds will cover the payoff; the sale paydown is the borrower's own extra payment designated to principal, made on a loan that is current.
      A sale paydown is applied to principal only, as a curtailment; fees owed stay on the payoff and are paid from the sale proceeds at closing.
      The sale paydown is the payoff measure plus the closing margin, less the proceeds available for the payoff, never below zero, rounded half up to the cent.
      The daily payoff interest is the unpaid principal times the note rate divided by 100, divided by 365, rounded half up to the cent.
      The proceeds available for the payoff are the sale price on the purchase agreement less the commission deduction, the closing charges, the resale fees deducted and the seller's past-due site rent where the resale package pays it from the proceeds.
      The payoff measure is the payoff amount of the payoff statement issued on the paydown date, the highest such amount where more than one was issued that day.
      The commission deduction is zero.
      The closing charges are zero.
      The resale fees deducted are zero.
      The closing margin is zero.
      Where that statement is good through a date more than 3 days after the closing date, the payoff measure is its payoff amount less the daily payoff interest for each day after the closing date through the good-through date; where it is good through a date before the closing date, the payoff measure is its payoff amount plus the daily payoff interest for each day after the good-through date through the closing date; otherwise, the statement being good through the closing date or no more than 3 days after it, the payoff measure is its payoff amount.
      Where the resale package charges a commission and commission_pct percent of the sale price reaches minimum_commission, the commission deduction is commission_pct percent of the sale price, rounded half up to the cent; where the package charges a commission and that percentage falls short of minimum_commission, the commission deduction is minimum_commission; otherwise the commission deduction is zero.
      Where the resale package charges a commission and credits the initial inspection fee at closing, the closing charges are the transaction_fee plus the closing_fee less the inspection_fee; where the package charges a commission and gives no such credit, the closing charges are the transaction_fee plus the closing_fee; otherwise the closing charges are zero.
      Where the resale package deducts fees owed from the proceeds and the home is occupied, the resale fees deducted are the fees owed on the resale file; where the package deducts fees owed from the proceeds and the home is vacant, the resale fees deducted are the fees owed on the resale file plus one month's vacant_home_check_fee_monthly; otherwise the resale fees deducted are zero.
      Where the closing date is more than 21 days after the paydown date, the closing margin is margin_far; where it is 8 to 21 days after, the closing margin is margin_near; otherwise the closing margin is zero.
      The principal paydown for a pending sale is not worked out until the loan carries a payoff statement issued on the paydown date.
    prerequisite:
      - problem: loan_ext_payoff_statement
        kind: value_input
        gate: payoff_measure
        form: state
        policy_source: >-
          The principal paydown for a pending sale is not worked out until the loan carries a payoff statement issued on the paydown date.
        condition: >-
          loan_notices holds a loan_payoff_statement row for the loan whose notice_date is the paydown date.
        resolved_by: issue_payoff_statement_6569642c
        effect: >-
          The payoff measure is the payoff amount of the statement issued that day, trimmed or extended to the closing date, so the paydown follows that figure rather than an older statement.
    cross_category:
      - category: resale
        as: branch
        reads: [status, sale_price, closing_date, fees_balance, home_occupancy, variant_name]
        note: The commission deduction, closing charges, resale fees deducted and the closing date that fixes the payoff measure and the margin are read from the seller's resale file under contract and its package.
      - category: lease
        as: history
        reads: [rent_balance]
        note: The seller's past-due site rent is deducted from the proceeds where the package pays it at closing.
    compute:
      - stmt_amount: "MAX('loan_notices', 'payoff_amount', event_type='loan_payoff_statement', notice_date=NOW)"
      - stmt_good_through: "LATEST('loan_notices', 'good_through_date', date_field='notice_date', event_type='loan_payoff_statement', notice_date=NOW)"
      - sale_closing: "CFIELD('resale', 'closing_date', status='under_contract')"
      - daily_payoff_interest: "int(RND((F('principal_balance') * F('note_rate_pct') / 100 / 365) * 100, 6) + 0.5) / 100"
      - payoff_measure: "stmt_amount - daily_payoff_interest * DAYS(sale_closing, stmt_good_through) if DAYS(sale_closing, stmt_good_through) > 3 else (stmt_amount + daily_payoff_interest * DAYS(stmt_good_through, sale_closing) if stmt_good_through < sale_closing else stmt_amount)"
      - sale_price: "CFIELD('resale', 'sale_price', status='under_contract')"
      - commission_pct: "CPARAM('resale', 'commission_pct', status='under_contract')"
      - commission_min: "CPARAM('resale', 'minimum_commission', status='under_contract')"
      - commission: "int(RND((sale_price * commission_pct / 100) * 100, 6) + 0.5) / 100 if commission_pct > 0 and sale_price * commission_pct / 100 >= commission_min else (float(commission_min) if commission_pct > 0 and sale_price * commission_pct / 100 < commission_min else 0.0)"
      - transaction_fee: "CPARAM('resale', 'transaction_fee', status='under_contract')"
      - closing_fee: "CPARAM('resale', 'closing_fee', status='under_contract')"
      - inspection_credit: "CPARAM('resale', 'inspection_fee_credited_at_closing', status='under_contract')"
      - inspection_fee: "CPARAM('resale', 'inspection_fee', status='under_contract')"
      - closing_charges: "transaction_fee + closing_fee - inspection_fee if commission_pct > 0 and inspection_credit == True else (transaction_fee + closing_fee if commission_pct > 0 and inspection_credit == False else 0.0)"
      - fees_deducted_flag: "CPARAM('resale', 'fees_deducted_from_proceeds', status='under_contract')"
      - occupancy: "CFIELD('resale', 'home_occupancy', status='under_contract')"
      - resale_fees_owed: "CFIELD('resale', 'fees_balance', status='under_contract')"
      - vacant_check_fee: "CPARAM('resale', 'vacant_home_check_fee_monthly', status='under_contract')"
      - resale_fees_deducted: "resale_fees_owed if fees_deducted_flag == True and occupancy == 'occupied' else (resale_fees_owed + vacant_check_fee if fees_deducted_flag == True and occupancy == 'vacant' else 0.0)"
      - arrears_flag: "CPARAM('resale', 'seller_arrears_paid_from_proceeds', status='under_contract')"
      - lease_arrears: "MX(0, CFIELD('lease', 'rent_balance', lease_id=F('lease_id'))) if arrears_flag == True else 0.0"
      - closing_days: "DAYS(NOW, sale_closing)"
      - closing_margin: "K('margin_far') if closing_days > 21 else (K('margin_near') if closing_days >= 8 else 0.0)"
      - proceeds_available: "sale_price - commission - closing_charges - resale_fees_deducted - lease_arrears"
      - result: "int(RND((MX(0, payoff_measure + closing_margin - proceeds_available)) * 100, 6) + 0.5) / 100"
    compute_basis:
      stmt_amount: "The payoff measure is the payoff amount of the payoff statement issued on the paydown date, the highest such amount where more than one was issued that day."
      stmt_good_through: "Where that statement is good through a date more than 3 days after the closing date"
      sale_closing: "the payoff measure is its payoff amount less the daily payoff interest for each day after the closing date through the good-through date"
      daily_payoff_interest: "The daily payoff interest is the unpaid principal times the note rate divided by 100, divided by 365, rounded half up to the cent."
      payoff_measure: "Where that statement is good through a date more than 3 days after the closing date, the payoff measure is its payoff amount less the daily payoff interest for each day after the closing date through the good-through date; where it is good through a date before the closing date, the payoff measure is its payoff amount plus the daily payoff interest for each day after the good-through date through the closing date; otherwise, the statement being good through the closing date or no more than 3 days after it, the payoff measure is its payoff amount."
      sale_price: "The proceeds available for the payoff are the sale price on the purchase agreement"
      commission_pct: "Where the resale package charges a commission and commission_pct percent of the sale price reaches minimum_commission"
      commission_min: "where the package charges a commission and that percentage falls short of minimum_commission, the commission deduction is minimum_commission"
      commission: "Where the resale package charges a commission and commission_pct percent of the sale price reaches minimum_commission, the commission deduction is commission_pct percent of the sale price, rounded half up to the cent; where the package charges a commission and that percentage falls short of minimum_commission, the commission deduction is minimum_commission; otherwise the commission deduction is zero."
      transaction_fee: "the closing charges are the transaction_fee plus the closing_fee less the inspection_fee"
      closing_fee: "the closing charges are the transaction_fee plus the closing_fee less the inspection_fee"
      inspection_credit: "Where the resale package charges a commission and credits the initial inspection fee at closing"
      inspection_fee: "the closing charges are the transaction_fee plus the closing_fee less the inspection_fee"
      closing_charges: "Where the resale package charges a commission and credits the initial inspection fee at closing, the closing charges are the transaction_fee plus the closing_fee less the inspection_fee; where the package charges a commission and gives no such credit, the closing charges are the transaction_fee plus the closing_fee; otherwise the closing charges are zero."
      fees_deducted_flag: "Where the resale package deducts fees owed from the proceeds and the home is occupied"
      occupancy: "Where the resale package deducts fees owed from the proceeds and the home is occupied"
      resale_fees_owed: "the resale fees deducted are the fees owed on the resale file"
      vacant_check_fee: "the resale fees deducted are the fees owed on the resale file plus one month's vacant_home_check_fee_monthly"
      resale_fees_deducted: "Where the resale package deducts fees owed from the proceeds and the home is occupied, the resale fees deducted are the fees owed on the resale file; where the package deducts fees owed from the proceeds and the home is vacant, the resale fees deducted are the fees owed on the resale file plus one month's vacant_home_check_fee_monthly; otherwise the resale fees deducted are zero."
      arrears_flag: "the seller's past-due site rent where the resale package pays it from the proceeds"
      lease_arrears: "the seller's past-due site rent where the resale package pays it from the proceeds"
      closing_days: "Where the closing date is more than 21 days after the paydown date"
      closing_margin: "Where the closing date is more than 21 days after the paydown date, the closing margin is margin_far; where it is 8 to 21 days after, the closing margin is margin_near; otherwise the closing margin is zero."
      proceeds_available: "The proceeds available for the payoff are the sale price on the purchase agreement less the commission deduction, the closing charges, the resale fees deducted and the seller's past-due site rent where the resale package pays it from the proceeds."
      result: "The sale paydown is the payoff measure plus the closing margin, less the proceeds available for the payoff, never below zero, rounded half up to the cent."
    factors:
      - id: payoff_measure_to_closing
        effect: method
        decides: payoff_measure
        bindings: [stmt_good_through, sale_closing, daily_payoff_interest, payoff_measure]
        ladder:
          - when: "the statement issued on the paydown date is good through a date more than 3 days after the closing date"
            method: "trim the statement's payoff amount by the daily payoff interest for each day from the closing date to the good-through date"
          - when: "the statement is good through a date before the closing date"
            method: "extend the statement's payoff amount by the daily payoff interest for each day from the good-through date to the closing date"
          - when: "otherwise (good through the closing date or no more than 3 days after it)"
            method: "take the statement's payoff amount as it stands"
        baseline:
          payoff_measure: "stmt_amount"
        evidence: [history, cross_category, date]
        cross_difficulty: resale
      - id: commission_deduction
        effect: parameter
        decides: commission
        bindings: [sale_price, commission_pct, commission_min, commission]
        ladder:
          - when: "the package charges a commission AND commission_pct percent of the sale price reaches minimum_commission"
            value: "commission_pct percent of the sale price"
          - when: "the package charges a commission AND that percentage falls short of minimum_commission"
            value: "minimum_commission"
          - when: "otherwise"
            value: "0.0"
        baseline:
          commission: "0.0"
        evidence: [cross_category]
        cross_difficulty: resale
      - id: closing_charges
        effect: parameter
        decides: closing_charges
        bindings: [transaction_fee, closing_fee, inspection_credit, inspection_fee, closing_charges]
        ladder:
          - when: "the package charges a commission AND credits the initial inspection fee at closing"
            value: "transaction_fee + closing_fee - inspection_fee"
          - when: "the package charges a commission AND gives no inspection-fee credit"
            value: "transaction_fee + closing_fee"
          - when: "otherwise"
            value: "0.0"
        baseline:
          closing_charges: "0.0"
        evidence: [cross_category]
        cross_difficulty: resale
      - id: resale_fees_deducted
        effect: parameter
        decides: resale_fees_deducted
        bindings: [fees_deducted_flag, occupancy, resale_fees_owed, vacant_check_fee, resale_fees_deducted]
        ladder:
          - when: "the package deducts fees owed from the proceeds AND the home is occupied"
            value: "the fees owed on the resale file"
          - when: "the package deducts fees owed from the proceeds AND the home is vacant"
            value: "the fees owed on the resale file plus one month's vacant_home_check_fee_monthly"
          - when: "otherwise"
            value: "0.0"
        baseline:
          resale_fees_deducted: "0.0"
        evidence: [cross_category]
        cross_difficulty: resale
      - id: closing_margin
        effect: parameter
        decides: closing_margin
        bindings: [closing_days, closing_margin]
        ladder:
          - when: "the closing date is more than 21 days after the paydown date"
            value: "K('margin_far')"
          - when: "the closing date is 8 to 21 days after the paydown date"
            value: "K('margin_near')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          closing_margin: "0.0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The sale paydown is the payoff measure plus the closing margin, less the proceeds available for the payoff, never below zero, rounded half up to the cent.
        The proceeds available for the payoff are the sale price on the purchase agreement less the commission deduction, the closing charges, the resale fees deducted and the seller's past-due site rent where the resale package pays it from the proceeds.
        The payoff measure is the payoff amount of the payoff statement issued on the paydown date, the highest such amount where more than one was issued that day.
        The commission deduction is zero.
        The closing charges are zero.
        The resale fees deducted are zero.
        The closing margin is zero.
      params: []
    inputs:
      history:
        - {table: loan_notices, aggregate: max, field: payoff_amount, filters: {event_type: loan_payoff_statement}}
      cross_category: [resale, lease]

