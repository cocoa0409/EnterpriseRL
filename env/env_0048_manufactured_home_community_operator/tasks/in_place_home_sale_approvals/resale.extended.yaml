events:
  - type: resale_file_open
    target: resale_listings
    mutation: create
    meaning: A resident who owns their home opens a resale file to sell it in place under one of the resale packages.
    grain: One row per resale file.
    fields:
      customer_id: The seller (the leaseholder of the site).
      variant_name: Resale package chosen.
      lease_id: The seller's site lease.
      lienholder: Who holds a lien on the home's title, if anyone.
      home_occupancy: Whether the home is occupied or vacant.
      opened_date: Date the file was opened.
    triggers: []
  - type: resale_listing_activation
    target: resale_listings
    mutation: {transition: {from: opened, to: listed}}
    meaning: The seller signs the listing agreement (or the private-sale registration) and the home is on the market.
    grain: One row per transaction.
    fields:
      status: Set to listed.
      list_price: Asking price.
      listed_date: Date the home went on the market.
      listing_expiration_date: Last day of the listing term; empty on the approval service.
    triggers: []
  - type: resale_price_change
    target: resale_listings
    mutation: update
    meaning: The seller changes the asking price of a listed home.
    grain: One row per transaction.
    fields:
      list_price: New asking price.
    triggers: []
  - type: resale_listing_extension
    target: resale_listings
    mutation: update
    meaning: The seller signs an extension of the listing term.
    grain: One row per transaction.
    fields:
      listing_expiration_date: New last day of the listing term.
      extensions_used: Extensions signed on this file, including this one.
    triggers: []
  - type: resale_occupancy_change
    target: resale_listings
    mutation: update
    meaning: The seller reports that the home has become vacant or occupied again.
    grain: One row per transaction.
    fields:
      home_occupancy: New occupancy.
    triggers: []
  - type: resale_offer_acceptance
    target: resale_listings
    mutation: {transition: {from: listed, to: under_contract}}
    meaning: The seller accepts a buyer's offer and the purchase agreement is signed.
    grain: One row per transaction.
    fields:
      status: Set to under_contract.
      under_contract_date: Purchase agreement date.
      buyer_customer_id: Profile of the buyer.
      sale_price: Contract sale price.
    triggers: []
  - type: resale_contract_cancellation
    target: resale_listings
    mutation: {transition: {from: under_contract, to: listed}}
    meaning: The purchase agreement is cancelled and the home returns to the market.
    grain: One row per transaction.
    fields:
      status: Set to listed.
      under_contract_date: Cleared.
      buyer_customer_id: Cleared.
      sale_price: Cleared.
    triggers: []
  - type: resale_closing
    target: resale_listings
    mutation: {transition: {from: under_contract, to: closed_sold}}
    meaning: The sale closes; title passes to the approved buyer and proceeds are disbursed.
    grain: One row per transaction.
    fields:
      status: Set to closed_sold.
      closing_date: Closing date.
      closed_date: Date the file closed (the closing date).
      lienholder: Lienholder paid off at closing, if any.
    triggers:
      - event: lease:lease_sale_closeout
        map: {closed_date: closing_date}
      - event: loan:loan_payoff_payment
        when: {lienholder: hearthstone_home_finance}
        map: {txn_date: closing_date}
      - event: resale:resale_closing_statement
        map: {record_date: closing_date}
  - type: resale_guaranteed_purchase
    target: resale_listings
    mutation: {transition: {from: listed, to: closed_sold}}
    meaning: Under the guaranteed program the listing term ends unsold and Hearthstone buys the home at the guaranteed price.
    grain: One row per transaction.
    fields:
      status: Set to closed_sold.
      sale_price: Guaranteed purchase price.
      closing_date: Date Hearthstone's purchase closed.
      closed_date: Date the file closed (the closing date).
      lienholder: Lienholder paid off at closing, if any.
    triggers:
      - event: lease:lease_sale_closeout
        map: {closed_date: closing_date}
      - event: loan:loan_payoff_payment
        when: {lienholder: hearthstone_home_finance}
        map: {txn_date: closing_date}
      - event: resale:resale_closing_statement
        map: {record_date: closing_date}
  - type: resale_withdrawal
    target: resale_listings
    mutation: {transition: [{from: opened, to: withdrawn}, {from: listed, to: withdrawn}]}
    meaning: The seller withdraws the file or takes the home off the market.
    grain: One row per transaction.
    fields:
      status: Set to withdrawn.
      closed_date: Date of withdrawal.
    triggers: []
  - type: resale_expiration
    target: resale_listings
    mutation: {transition: {from: listed, to: expired}}
    meaning: The listing term ends unsold.
    grain: One row per transaction.
    fields:
      status: Set to expired.
      closed_date: Day after the last day of the listing term.
    triggers: []

  - type: resale_fee_charge
    target: resale_ledger
    meaning: A fee or the commission is charged to the seller on the resale file.
    grain: One row per charge type per charge date (per month for monthly charges).
    distinguish_by: [charge_type, entry_date, billing_period]
    fields:
      resale_id: Resale file charged.
      entry_date: Date charged.
      charge_type: What is charged.
      billing_period: Month a monthly vacant-home check covers, YYYY-MM; empty otherwise.
      source_entry_id: The inspection, appraisal or closing record that gave rise to the charge; empty otherwise.
      amount: Charge, positive.
    account: resale_fees_due
    direction: in
    triggers: []
  - type: resale_fee_payment
    target: resale_ledger
    meaning: The seller pays fees billed upfront.
    grain: One row per payment.
    distinguish_by: [payment_ref]
    fields:
      resale_id: Resale file credited.
      entry_date: Date received.
      amount: Payment, positive.
      payment_channel: Channel the payment arrived through.
      payment_ref: Serial number or processor confirmation number of the payment.
    account: resale_fees_due
    direction: out
    triggers: []
  - type: resale_proceeds_deduction
    target: resale_ledger
    meaning: Fees still owed at closing are deducted from the seller's sale proceeds.
    grain: One row per closing.
    distinguish_by: [source_entry_id]
    fields:
      resale_id: Resale file settled.
      entry_date: Closing date.
      source_entry_id: The closing statement.
      amount: Fees deducted, positive.
    account: resale_fees_due
    direction: out
    triggers: []
  - type: resale_fee_credit
    target: resale_ledger
    meaning: A credit is posted against one charge — an included re-inspection, the inspection-fee credit at a brokered closing, or a billing-error correction.
    grain: One row per charge credited per reason.
    distinguish_by: [source_entry_id, credit_reason]
    fields:
      resale_id: Resale file credited.
      entry_date: Date credited.
      source_entry_id: The charge credited.
      credit_reason: Reason for the credit.
      amount: Credit, positive.
    account: resale_fees_due
    direction: out
    triggers: []

  - type: resale_inspection
    target: resale_records
    meaning: The pre-sale community-standards inspection (or a re-inspection after repairs) is performed and its result recorded.
    grain: One row per inspection visit.
    distinguish_by: [record_date, inspection_type]
    fields:
      resale_id: Resale file.
      record_date: Inspection date.
      inspection_type: Initial inspection or re-inspection.
      inspection_result: Passed, or repairs required.
      required_repair_count: Number of standards items failed (0 when passed).
    triggers:
      - event: resale:resale_fee_charge
        when: {inspection_type: reinspection}
        map: {charge_type: reinspection_fee, entry_date: record_date, source_entry_id: resale_record_id}
  - type: resale_appraisal
    target: resale_records
    meaning: An independent appraisal of the home is recorded for the guaranteed program.
    grain: One row per appraisal.
    distinguish_by: [record_date]
    fields:
      resale_id: Resale file.
      record_date: Appraisal date.
      appraised_value: Appraised value of the home.
    triggers:
      - event: resale:resale_fee_charge
        map: {charge_type: appraisal_fee, entry_date: record_date, source_entry_id: resale_record_id}
  - type: resale_purchase_agreement
    target: resale_records
    meaning: A purchase agreement between the seller and a buyer is signed.
    grain: One row per purchase agreement.
    distinguish_by: [record_date, buyer_customer_id]
    fields:
      resale_id: Resale file.
      record_date: Agreement date.
      buyer_customer_id: Profile of the buyer.
      buyer_name: Buyer's full name as written on the agreement.
      sale_price: Contract sale price.
      earnest_money_amount: Earnest money deposited by the buyer.
      financing_type: How the buyer is paying.
    triggers:
      - event: resale:resale_offer_acceptance
        map: {under_contract_date: record_date, buyer_customer_id: buyer_customer_id, sale_price: sale_price}
  - type: resale_agreement_cancellation
    target: resale_records
    meaning: A signed purchase agreement is cancelled, with the reason and what happens to the earnest money.
    grain: One row per cancellation.
    distinguish_by: [record_date]
    fields:
      resale_id: Resale file.
      record_date: Cancellation date.
      buyer_customer_id: Profile of the buyer whose agreement is cancelled.
      cancellation_reason: Why the agreement was cancelled.
      earnest_money_disposition: Whether the deposit went back to the buyer or was forfeited.
    triggers:
      - event: resale:resale_contract_cancellation
  - type: resale_closing_statement
    target: resale_records
    meaning: The closing statement records how the sale proceeds were applied.
    grain: One row per closing.
    distinguish_by: [record_date]
    fields:
      resale_id: Resale file.
      record_date: Closing date.
      sale_price: Gross sale price.
      fee_settlement: Whether fees owed were deducted from proceeds or are billed to the seller.
      fees_deducted: Fees deducted from proceeds.
      seller_arrears_settlement: Whether a past-due site-lease balance was paid from proceeds.
      lease_arrears_paid: Past-due site-lease balance paid from proceeds.
      loan_payoff_paid: Hearthstone Home Finance payoff paid from proceeds.
      net_proceeds: Amount disbursed to the seller.
    triggers:
      - event: resale:resale_proceeds_deduction
        when: {fee_settlement: deducted_from_proceeds}
        map: {entry_date: record_date, amount: fees_deducted, source_entry_id: resale_record_id}
      - event: lease:lease_payment
        when: {seller_arrears_settlement: paid_from_proceeds}
        map: {entry_date: record_date, amount: lease_arrears_paid, payment_channel: sale_closing_proceeds, payment_ref: resale_record_id}

measures:
  - id: resale_msr_reinspections
    window: The life of the resale file, up to and including the re-inspection being charged.
    measure: Count of resale_inspection rows on the file whose inspection_type is reinspection, ordered by record_date.
  - id: resale_msr_passed_inspection_age
    window: From the record_date of the most recent resale_inspection row on the file whose inspection_result is passed, to the closing date (or the handling date before closing).
    measure: Calendar days elapsed; undefined when no inspection on the file has passed.
  - id: resale_msr_vacant_months
    window: Each calendar month, or part of one, during which the file is opened, listed or under contract and home_occupancy is vacant.
    measure: Count of such months not yet charged a vacant-home check (resale_fee_charge rows with charge_type vacant_home_check, by billing_period).

policies:
  - id: resale_agg_multi_holding
    subject: [resale_file_open]
    rule: >-
      A resale file covers one home on one site, and a seller may have one open resale file at a time.
      The seller has no other resale file in opened, listed or under_contract status.
      A file that is closed_sold, withdrawn or expired does not count, so a seller whose listing expired may open a new file.
    eligibility:
      - id: single_open_file
        applies_to: [resale_file_open]
        kind: dedup
        condition: The seller has no other resale file in opened, listed or under_contract status.
        evidence_fields: [resale_listings.customer_id, resale_listings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resale_listings.customer_id]
          action_bindings:
            resale_listings.customer_id: customer_id
        dedup_contract:
          table: resale_listings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [opened, listed, under_contract]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: resale_file_opening_terms
    subject: [resale_file_open, resale_fee_charge]
    rule: >-
      Holding a site lease is what makes an in-place sale possible: only the leaseholder of the site may open a resale file for the home on it.
      The seller's site lease is active or notice_to_vacate.
      The home and package must meet the package's entry gate; a sale in which the buyer will remove the home from the community is not handled under the resale program (removal_sales_covered is false) and the seller must instead give a notice to vacate.
      The lienholder on the home's title is recorded when the file is opened; a lien held by another lender must be released by that lender at closing under its own payoff letter, which the resident desk does not obtain.
      The package's flat_service_fee is charged on the opening date, is due within upfront_fee_due_days calendar days and is not refunded if the file is later withdrawn or expires.
      Opening a file never changes the seller's lease: rent stays due on the lease until the sale closes.
    eligibility:
      - id: seller_holds_lease
        applies_to: [resale_file_open]
        kind: authorization
        condition: The seller's site lease is active or notice_to_vacate.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.customer_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
    params:
      per_tier:
        Resale Approval Service: {flat_service_fee: =flat_service_fee}
        Owner-Marketed Listing Package: {flat_service_fee: =flat_service_fee}
        Assisted Resale Listing: {flat_service_fee: =flat_service_fee}
        Full-Service Resale Brokerage: {flat_service_fee: =flat_service_fee}
        Full-Service Resale Brokerage Plus: {flat_service_fee: =flat_service_fee}
        Guaranteed Resale Program: {flat_service_fee: =flat_service_fee}

  - id: resale_inspection_terms
    subject: [resale_inspection, resale_fee_charge, resale_fee_credit]
    rule: >-
      Every resale file is inspected against the community's inspection_standards within inspection_scheduling_business_days business days of opening, whatever the package.
      The initial inspection is charged at the package's inspection_fee on the inspection date; no charge is posted where that fee is 0.00.
      Every re-inspection is charged at reinspection_fee on its date, and the first included_reinspections re-inspections on the file (resale_msr_reinspections) are credited in full with credit_reason included_reinspection.
      Required repairs are the seller's responsibility and should be completed and re-inspected within repair_completion_days calendar days of the inspection that required them; a file whose repairs are not complete may stay listed but cannot close.
      Where repair_coordination_available is true the seller may engage Hearthstone's service crew, and the repair is charged at the contractor cost plus repair_coordination_markup_pct percent, rounded half up to the cent.
      A passed inspection supports a closing for inspection_valid_days calendar days; after that the home must be inspected again before closing.
    eligibility: []
    params:
      per_tier:
        Resale Approval Service: {inspection_fee: =inspection_fee, included_reinspections: =included_reinspections}
        Owner-Marketed Listing Package: {inspection_fee: =inspection_fee, included_reinspections: =included_reinspections}
        Assisted Resale Listing: {inspection_fee: =inspection_fee, included_reinspections: =included_reinspections}
        Full-Service Resale Brokerage: {inspection_fee: =inspection_fee, included_reinspections: =included_reinspections}
        Full-Service Resale Brokerage Plus: {inspection_fee: =inspection_fee, included_reinspections: =included_reinspections}
        Guaranteed Resale Program: {inspection_fee: =inspection_fee, included_reinspections: =included_reinspections}
    measures: [resale_msr_reinspections]
    formula:
      reinspection_credit: reinspection_fee if resale_msr_reinspections <= included_reinspections else 0

  - id: resale_listing_terms
    subject: [resale_listing_activation, resale_price_change, resale_listing_extension, resale_expiration]
    rule: >-
      Signing the listing agreement, changing the price and signing an extension are the seller's own acts.
      The listing term ends listing_term_days calendar days after the listed date, the listed date counting as day zero; on the approval service there is no listing term and the file never expires.
      The asking price and the listing term may be changed or extended only while the home is listed and not under contract.
      An extension must be signed on or before the current listing expiration date, adds extension_term_days to it, is charged extension_fee, and no more than max_extensions extensions may be signed on one file (extensions_used).
      Under the guaranteed program the asking price may never exceed list_price_max_pct_of_appraisal percent of the appraised value, and no extension is available because the guarantee takes effect at the end of the term.
      A listing reaching the end of its term unsold expires, except under the guaranteed program, where resale_guaranteed_terms applies.
    eligibility:
      - id: changes_while_listed
        applies_to: [resale_price_change, resale_listing_extension]
        kind: state
        condition: The asking price and the listing term may be changed or extended only while the home is listed and not under contract.
        evidence_fields: [resale_listings.resale_id, resale_listings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resale_listings.resale_id]
          action_bindings:
            resale_listings.resale_id: resale_id
        state_contract:
          field: resale_listings.status
          allowed: [listed]
    params:
      per_tier:
        Resale Approval Service: {listing_term_days: =listing_term_days, max_extensions: =max_extensions, extension_fee: =extension_fee}
        Owner-Marketed Listing Package: {listing_term_days: =listing_term_days, max_extensions: =max_extensions, extension_fee: =extension_fee}
        Assisted Resale Listing: {listing_term_days: =listing_term_days, max_extensions: =max_extensions, extension_fee: =extension_fee}
        Full-Service Resale Brokerage: {listing_term_days: =listing_term_days, max_extensions: =max_extensions, extension_fee: =extension_fee}
        Full-Service Resale Brokerage Plus: {listing_term_days: =listing_term_days, max_extensions: =max_extensions, extension_fee: =extension_fee}
        Guaranteed Resale Program: {listing_term_days: =listing_term_days, max_extensions: =max_extensions, extension_fee: =extension_fee}

  - id: resale_purchase_contract_terms
    subject: [resale_purchase_agreement, resale_offer_acceptance, resale_agreement_cancellation, resale_contract_cancellation]
    rule: >-
      Accepting an offer is the seller's own act and binds the home to that buyer until the agreement closes or is cancelled.
      A purchase agreement may be signed only while the home is listed.
      On every package except the approval service, the buyer's earnest money must be at least earnest_money_min_pct percent of the sale price and is held by Hearthstone Home Sales until closing.
      The buyer must submit a residency application for the seller's site within buyer_application_deadline_days calendar days of the agreement date, and a buyer financing the purchase must obtain loan approval within financing_contingency_days calendar days of it.
      The agreement is cancelled and the earnest money refunded to the buyer when the buyer's residency application is denied, or when financing is denied within the contingency period.
      The agreement is cancelled and the earnest money forfeited when the buyer misses the residency application deadline, withdraws after the contingency period, or fails to close within closing_deadline_days of residency approval; Hearthstone Home Sales retains forfeited_deposit_broker_share_pct percent of a forfeited deposit and the rest goes to the seller.
      A cancelled agreement returns the home to the market on the same listing term.
      A seller who wants to back out of a signed agreement is outside what the resident desk can arrange, and the request goes to a human representative.
    eligibility:
      - id: agreement_while_listed
        applies_to: [resale_purchase_agreement]
        kind: state
        condition: A purchase agreement may be signed only while the home is listed.
        evidence_fields: [resale_listings.resale_id, resale_listings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resale_listings.resale_id]
          action_bindings:
            resale_listings.resale_id: resale_id
        state_contract:
          field: resale_listings.status
          allowed: [listed]
    formula:
      earnest_money_ok: earnest_money_amount >= earnest_money_min_pct / 100 * sale_price

  - id: resale_closing_conditions
    subject: [resale_closing]
    rule: >-
      A sale closes only when every closing condition holds on the closing date.
      The buyer holds an approved residency application for the same community and site as the seller's lease.
      The home's most recent passed inspection must be no older than inspection_valid_days calendar days on the closing date, counted from the date of the most recent passed inspection.
      The inspection age is counted in calendar days starting the day after the inspection date, and an inspection exactly inspection_valid_days old still supports the closing.
      The seller's site-lease balance must be zero on the closing date, or, where seller_arrears_paid_from_proceeds is true, paid from the sale proceeds at closing.
      A home financed by Hearthstone Home Finance closes only with the payoff amount on a current payoff statement paid from the proceeds; when the proceeds would not cover it the sale cannot close and the request goes to a human representative.
      The buyer signs a new site lease (new_lease_required_for_buyer) at the lot class's current standard rent (buyer_rent_basis), never assuming the seller's lease or rent.
      The seller's lease then closes on the closing date under the lease charter's home-sale closeout.
    eligibility:
      - id: buyer_residency_approved
        applies_to: [resale_closing]
        kind: authorization
        condition: The buyer holds an approved residency application for the same community and site as the seller's lease.
        evidence_fields: [lease_holdings.customer_id, lease_holdings.status, lease_holdings.community_name, lease_holdings.site_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.customer_id]
          action_bindings:
            lease_holdings.customer_id: buyer_customer_id
      - id: inspection_current
        applies_to: [resale_closing]
        kind: time
        condition: The home's most recent passed inspection must be no older than inspection_valid_days calendar days on the closing date, counted from the date of the most recent passed inspection.
        evidence_fields: [resale_records.resale_id, resale_records.record_date, resale_records.inspection_result]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resale_records.resale_id]
          action_bindings:
            resale_records.resale_id: resale_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the most recent passed inspection
          anchor_source: resale_records.record_date
          relation: not_after
          duration_source: variants.inspection_valid_days
          unit: calendar_days
          counting_rule: The inspection age is counted in calendar days starting the day after the inspection date, and an inspection exactly inspection_valid_days old still supports the closing.
          boundary: inclusive
    measures: [resale_msr_passed_inspection_age]

  - id: resale_closing_settlement
    subject: [resale_closing_statement, resale_proceeds_deduction, resale_fee_charge, resale_fee_credit]
    rule: >-
      At a closing to a buyer the commission is commission_pct percent of the gross sale price (commission_basis), raised to minimum_commission, rounded half up to the cent and charged on the closing date; no commission is charged on a package whose commission_pct is 0.0.
      The transaction_fee, where the package has one, and the closing_fee are charged on the closing date.
      Where inspection_fee_credited_at_closing is true, the initial inspection fee is credited back at closing (credit_reason inspection_fee_credit).
      When Hearthstone buys the home under the guarantee no commission and no transaction fee is charged (commission_waived_on_guaranteed_purchase), and the closing fee still applies.
      Where fees_deducted_from_proceeds is true every fee then owed on the file is deducted from the proceeds; otherwise fees owed stay billed to the seller and are due within upfront_fee_due_days.
      The proceeds are applied in this order — fees deducted, then the seller's past-due site-lease balance where seller_arrears_paid_from_proceeds is true, then a Hearthstone Home Finance payoff — and the remainder is the seller's net proceeds.
      Where the seller buys the optional buyer home warranty it is charged at home_warranty_price on the closing date; where home_warranty_included is true it is provided at no charge.
    eligibility: []
    params:
      per_tier:
        Resale Approval Service: {commission_pct: =commission_pct, minimum_commission: =minimum_commission, closing_fee: =closing_fee}
        Owner-Marketed Listing Package: {commission_pct: =commission_pct, minimum_commission: =minimum_commission, closing_fee: =closing_fee}
        Assisted Resale Listing: {commission_pct: =commission_pct, minimum_commission: =minimum_commission, closing_fee: =closing_fee}
        Full-Service Resale Brokerage: {commission_pct: =commission_pct, minimum_commission: =minimum_commission, closing_fee: =closing_fee}
        Full-Service Resale Brokerage Plus: {commission_pct: =commission_pct, minimum_commission: =minimum_commission, closing_fee: =closing_fee}
        Guaranteed Resale Program: {commission_pct: =commission_pct, minimum_commission: =minimum_commission, closing_fee: =closing_fee}
    formula:
      commission: max(round(commission_pct / 100 * sale_price, 2), minimum_commission)
      net_proceeds: sale_price - fees_deducted - lease_arrears_paid - loan_payoff_paid

  - id: resale_withdrawal_terms
    subject: [resale_withdrawal, resale_fee_charge]
    rule: >-
      Withdrawing is the seller's own act and is available while the file is opened or listed; a home under contract cannot be withdrawn (see resale_purchase_contract_terms).
      A listed home withdrawn before withdrawal_fee_free_after_days calendar days have passed since the listed date is charged the package's withdrawal_fee on the withdrawal date; a withdrawal on or after that day, a withdrawal before the home was ever listed, and any withdrawal on a package whose withdrawal_fee is 0.00 carry no withdrawal fee.
      The days are counted from the day after the listed date.
      Fees already charged are not refunded on withdrawal.
    eligibility: []
    params:
      per_tier:
        Resale Approval Service: {withdrawal_fee: =withdrawal_fee}
        Owner-Marketed Listing Package: {withdrawal_fee: =withdrawal_fee}
        Assisted Resale Listing: {withdrawal_fee: =withdrawal_fee}
        Full-Service Resale Brokerage: {withdrawal_fee: =withdrawal_fee}
        Full-Service Resale Brokerage Plus: {withdrawal_fee: =withdrawal_fee}
        Guaranteed Resale Program: {withdrawal_fee: =withdrawal_fee}

  - id: resale_guaranteed_terms
    subject: [resale_appraisal, resale_guaranteed_purchase]
    rule: >-
      The guarantee exists only on a package whose guaranteed_purchase_available is true.
      The guarantee requires an independent appraisal, charged at appraisal_fee on the appraisal date, before the home is listed.
      When the listing term ends with the home listed and not under contract, Hearthstone offers to buy it at guaranteed_purchase_pct_of_appraisal percent of the appraised value, less the contractor cost of any required repairs not yet completed, rounded half up to the cent; the seller may accept or let the listing expire.
      The appraisal must be no older than appraisal_valid_days on the last day of the listing term; an older appraisal is redone at Hearthstone's cost before the offer is made.
      An accepted guaranteed purchase closes within guaranteed_purchase_closing_days calendar days after the listing term ends, under the same closing conditions as any other sale except the buyer-residency approval, since Hearthstone itself is the buyer.
    eligibility:
      - id: guarantee_offered
        applies_to: [resale_appraisal, resale_guaranteed_purchase]
        kind: authorization
        condition: The guarantee exists only on a package whose guaranteed_purchase_available is true.
        evidence_fields: [resale_listings.resale_id, resale_listings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resale_listings.resale_id]
          action_bindings:
            resale_listings.resale_id: resale_id
    formula:
      guaranteed_price: round(guaranteed_purchase_pct_of_appraisal / 100 * appraised_value, 2)

  - id: resale_vacant_home_terms
    subject: [resale_occupancy_change, resale_fee_charge]
    rule: >-
      The seller must report when the home becomes vacant or occupied again, and the occupancy recorded on the file governs vacant-home charges.
      While the file is opened, listed or under contract and the home is vacant, a vacant-home check is required each calendar month and charged at vacant_home_check_fee_monthly for each month or part month (resale_msr_vacant_months), on the first day of the month or the day the home became vacant; where vacant_home_check_included is true no charge is posted.
      At Cedar Hollow and Conestoga Meadows a home vacant at any time during the winterization_months must be winterized once per winter, charged at winterization_fee on the winterization date; no winterization is charged at the other communities or where the fee is 0.00.
    eligibility: []
    measures: [resale_msr_vacant_months]
    params:
      per_tier:
        Resale Approval Service: {vacant_home_check_fee_monthly: =vacant_home_check_fee_monthly, winterization_fee: =winterization_fee}
        Owner-Marketed Listing Package: {vacant_home_check_fee_monthly: =vacant_home_check_fee_monthly, winterization_fee: =winterization_fee}
        Assisted Resale Listing: {vacant_home_check_fee_monthly: =vacant_home_check_fee_monthly, winterization_fee: =winterization_fee}
        Full-Service Resale Brokerage: {vacant_home_check_fee_monthly: =vacant_home_check_fee_monthly, winterization_fee: =winterization_fee}
        Full-Service Resale Brokerage Plus: {vacant_home_check_fee_monthly: =vacant_home_check_fee_monthly, winterization_fee: =winterization_fee}
        Guaranteed Resale Program: {vacant_home_check_fee_monthly: =vacant_home_check_fee_monthly, winterization_fee: =winterization_fee}

  - id: resale_fee_billing_terms
    subject: [resale_fee_payment, resale_fee_credit]
    rule: >-
      Fees billed upfront are paid through the accepted_payment_channels and are due upfront_fee_due_days calendar days after they are charged.
      A payment is applied to the oldest open charge first.
      A credit restores exactly one charge or the part of it named by its credit reason, never more than the charge.
      A charge posted in error is credited in full with credit_reason billing_error; a fee correctly charged under this charter is never credited as a courtesy.
    eligibility: []

# ============================================================================
# extended_policies — in_place_home_sale_approvals
# ============================================================================
extended_policies:
  - id: resale_ext_initial_inspection_charge
    base_policy_refs: [resale_file_opening_terms, resale_inspection_terms, resale_closing_settlement, resale_withdrawal_terms, resale_vacant_home_terms]
    overwrite:
      - base_policy: resale_inspection_terms
        superseded_clause: >-
          The initial inspection is charged at the package's inspection_fee on the inspection date; no charge is posted where that fee is 0.00.
        replaced_by: >-
          Where the package's inspection_fee is above 0.00, the home-size addition, the home-age addition, the site-condition addition and the repair-report addition are added together into the inspection additions, the visit-timing method then decides which parts of the charge are billed, and the charge is rounded half up to the cent only at that final step.
    trigger: state_due
    subject: [resale_fee_charge]
    computes: amount
    target_tool: post_inspection_fee_534473a1
    params:
      multi_long_min_ft: 64
      multi_long_add: 55.00
      multi_short_add: 40.00
      age_older_years: 15
      age_middle_years: 8
      age_older_add: 35.00
      age_middle_add: 15.00
      notice_window_months: 12
      notices_several: 2
      notices_several_add: 30.00
      notice_single_add: 15.00
      report_many_items: 6
      report_mid_items: 3
      report_many_add: 30.00
      report_mid_add: 15.00
      prompt_visit_days: 7
      late_visit_days: 14
    rule: >-
      The initial pre-sale inspection of a resale file is charged once, against the initial inspection record it bills, dated on that inspection's record date.
      On a package whose inspection_fee is 0.00 no inspection charge is posted at all.
      The standard inspection charge is the package's inspection_fee, charged in full for the initial inspection and rounded half up to the cent.
      Where the package's inspection_fee is above 0.00, the home-size addition, the home-age addition, the site-condition addition and the repair-report addition are added together into the inspection additions, the visit-timing method then decides which parts of the charge are billed, and the charge is rounded half up to the cent only at that final step.
      The home-size addition follows the home recorded on the seller's site lease: a multi-section home of multi_long_min_ft feet or longer adds multi_long_add, a multi-section home shorter than multi_long_min_ft feet adds multi_short_add, and a single-section home adds nothing.
      The home-age addition follows the home's age in the calendar year of the inspection, taken as the inspection's year less the model year on the seller's site lease: an age of age_older_years years or more adds age_older_add, an age of at least age_middle_years but fewer than age_older_years years adds age_middle_add, and an age of fewer than age_middle_years years adds nothing.
      The site-condition addition follows the community rule violation notices served under the site-care plan record of the seller's site that are fewer than notice_window_months whole calendar months old on the day the inspection charge is worked out: notices_several or more such notices add notices_several_add, exactly one such notice adds notice_single_add, and none adds nothing.
      The repair-report addition follows the count of standards items the initial inspection found failing, each written up in its repair report: report_many_items or more failing items add report_many_add, at least report_mid_items but fewer than report_many_items failing items add report_mid_add, and fewer failing items add nothing.
      The visit-timing method follows the calendar days from the file's opening date to the inspection date, Hearthstone standing behind its scheduling commitment: an inspection held more than late_visit_days days after opening is not charged at all, so no inspection charge is posted for it; an inspection held more than prompt_visit_days but no more than late_visit_days days after opening has the package's inspection_fee waived and is charged the inspection additions alone; an inspection held no more than prompt_visit_days days after opening is charged the package's inspection_fee plus the inspection additions.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [home_section_type, home_length_ft, home_model_year]
        note: The home-size and home-age additions take their tier from the home recorded on the seller's site lease.
      - category: rules
        as: history
        reads: [rules_plan_id, rules_records.event_type, rules_records.record_date]
        note: The site-condition addition takes its tier from the count of rule violation notices served under the site-care plan record of the seller's site in the trailing window.
    compute:
      - insp_date: "LATEST('resale_records', 'record_date', date_field='record_date', event_type='resale_inspection', inspection_type='initial')"
      - std_fee: "P('inspection_fee')"
      - section_type: "CFIELD('lease', 'home_section_type', lease_id=F('lease_id'))"
      - home_length: "CFIELD('lease', 'home_length_ft', lease_id=F('lease_id'))"
      - size_add: "(K('multi_long_add') if float(home_length) >= K('multi_long_min_ft') else K('multi_short_add')) if section_type == 'multi_section' else 0"
      - model_year: "CFIELD('lease', 'home_model_year', lease_id=F('lease_id'))"
      - home_age: "MONTHS('2000-01-01', insp_date) // 12 + 2000 - int(model_year)"
      - age_add: "K('age_older_add') if home_age >= K('age_older_years') else (K('age_middle_add') if home_age >= K('age_middle_years') else 0)"
      - site_plan: "CFIELD('rules', 'rules_plan_id', lease_id=F('lease_id'))"
      - site_notices: "XCOUNT('rules', 'rules_records', within_months=K('notice_window_months'), date_field='record_date', event_type='rules_violation_notice', rules_plan_id=site_plan)"
      - notice_add: "K('notices_several_add') if site_notices >= K('notices_several') else (K('notice_single_add') if site_notices >= 1 else 0)"
      - failed_items: "MAX('resale_records', 'required_repair_count', event_type='resale_inspection', inspection_type='initial')"
      - report_add: "K('report_many_add') if failed_items >= K('report_many_items') else (K('report_mid_add') if failed_items >= K('report_mid_items') else 0)"
      - additions: "size_add + age_add + notice_add + report_add"
      - visit_days: "DAYS(F('opened_date'), insp_date)"
      - timed_charge: "0 if visit_days > K('late_visit_days') else (additions if visit_days > K('prompt_visit_days') else std_fee + additions)"
      - result: "RND(timed_charge) if std_fee > 0 else 0"
    compute_basis:
      insp_date: "The initial pre-sale inspection of a resale file is charged once, against the initial inspection record it bills, dated on that inspection's record date."
      std_fee: "The standard inspection charge is the package's inspection_fee, charged in full for the initial inspection and rounded half up to the cent."
      section_type: "The home-size addition follows the home recorded on the seller's site lease"
      home_length: "a multi-section home of multi_long_min_ft feet or longer adds multi_long_add, a multi-section home shorter than multi_long_min_ft feet adds multi_short_add"
      size_add: "a multi-section home of multi_long_min_ft feet or longer adds multi_long_add, a multi-section home shorter than multi_long_min_ft feet adds multi_short_add, and a single-section home adds nothing."
      model_year: "taken as the inspection's year less the model year on the seller's site lease"
      home_age: "The home-age addition follows the home's age in the calendar year of the inspection, taken as the inspection's year less the model year on the seller's site lease"
      age_add: "an age of age_older_years years or more adds age_older_add, an age of at least age_middle_years but fewer than age_older_years years adds age_middle_add, and an age of fewer than age_middle_years years adds nothing."
      site_plan: "the community rule violation notices served under the site-care plan record of the seller's site"
      site_notices: "The site-condition addition follows the community rule violation notices served under the site-care plan record of the seller's site that are fewer than notice_window_months whole calendar months old on the day the inspection charge is worked out"
      notice_add: "notices_several or more such notices add notices_several_add, exactly one such notice adds notice_single_add, and none adds nothing."
      failed_items: "The repair-report addition follows the count of standards items the initial inspection found failing, each written up in its repair report"
      report_add: "report_many_items or more failing items add report_many_add, at least report_mid_items but fewer than report_many_items failing items add report_mid_add, and fewer failing items add nothing."
      additions: "the home-size addition, the home-age addition, the site-condition addition and the repair-report addition are added together into the inspection additions"
      visit_days: "The visit-timing method follows the calendar days from the file's opening date to the inspection date"
      timed_charge: "an inspection held more than late_visit_days days after opening is not charged at all, so no inspection charge is posted for it; an inspection held more than prompt_visit_days but no more than late_visit_days days after opening has the package's inspection_fee waived and is charged the inspection additions alone; an inspection held no more than prompt_visit_days days after opening is charged the package's inspection_fee plus the inspection additions."
      result: "the visit-timing method then decides which parts of the charge are billed, and the charge is rounded half up to the cent only at that final step."
    factors:
      - id: inspection_home_size_addition
        effect: parameter
        decides: size_add
        bindings: [section_type, home_length, size_add]
        ladder:
          - when: "the seller's site lease records a multi-section home of multi_long_min_ft feet or longer"
            value: "K('multi_long_add')"
          - when: "the seller's site lease records a multi-section home shorter than multi_long_min_ft feet"
            value: "K('multi_short_add')"
          - when: "otherwise (a single-section home)"
            value: "0"
        baseline:
          size_add: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: inspection_home_age_addition
        effect: parameter
        decides: age_add
        bindings: [model_year, home_age, age_add]
        ladder:
          - when: "the inspection's year less the home's model year is age_older_years or more"
            value: "K('age_older_add')"
          - when: "the inspection's year less the home's model year is at least age_middle_years and below age_older_years"
            value: "K('age_middle_add')"
          - when: "otherwise (an age below age_middle_years)"
            value: "0"
        baseline:
          age_add: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: inspection_site_condition_addition
        effect: parameter
        decides: notice_add
        bindings: [site_plan, site_notices, notice_add]
        ladder:
          - when: "notices_several or more rule violation notices under the seller's site-care plan record fewer than notice_window_months whole months old"
            value: "K('notices_several_add')"
          - when: "exactly one such notice"
            value: "K('notice_single_add')"
          - when: "otherwise (no such notice)"
            value: "0"
        baseline:
          notice_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: rules
      - id: inspection_repair_report_addition
        effect: parameter
        decides: report_add
        bindings: [failed_items, report_add]
        ladder:
          - when: "the initial inspection found report_many_items or more standards items failing"
            value: "K('report_many_add')"
          - when: "it found at least report_mid_items but fewer than report_many_items items failing"
            value: "K('report_mid_add')"
          - when: "otherwise (fewer than report_mid_items failing items)"
            value: "0"
        baseline:
          report_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: inspection_visit_timing_method
        effect: method
        decides: timed_charge
        bindings: [visit_days, timed_charge]
        ladder:
          - when: "the inspection was held more than late_visit_days calendar days after the file's opening date"
            method: "nothing is charged: no inspection charge is posted"
          - when: "the inspection was held more than prompt_visit_days but no more than late_visit_days calendar days after opening"
            method: "the package's inspection_fee is waived and the inspection additions alone are charged"
          - when: "otherwise (held no more than prompt_visit_days days after opening)"
            method: "the package's inspection_fee plus the inspection additions are charged"
        baseline:
          timed_charge: "std_fee + additions"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard inspection charge is the package's inspection_fee, charged in full for the initial inspection and rounded half up to the cent.
      params: [inspection_fee]
    inputs:
      history:
        - {table: resale_records, aggregate: latest, field: record_date, filters: {event_type: resale_inspection, inspection_type: initial}}
        - {table: resale_records, aggregate: max, field: required_repair_count, filters: {event_type: resale_inspection, inspection_type: initial}}
        - {category: rules, table: rules_records, aggregate: count, field: rules_record_id, within_months: 12, filters: {event_type: rules_violation_notice}}
      cross_category: [lease, rules]

  - id: resale_ext_vacant_home_check_charge
    base_policy_refs: [resale_file_opening_terms, resale_inspection_terms, resale_closing_settlement, resale_withdrawal_terms, resale_vacant_home_terms]
    overwrite:
      - base_policy: resale_vacant_home_terms
        superseded_clause: >-
          While the file is opened, listed or under contract and the home is vacant, a vacant-home check is required each calendar month and charged at vacant_home_check_fee_monthly for each month or part month (resale_msr_vacant_months), on the first day of the month or the day the home became vacant; where vacant_home_check_included is true no charge is posted.
        replaced_by: >-
          Where the package charges for the check, the month's check charge is worked out in this order: first the package's vacant_home_check_fee_monthly, the check-size addition and the utility walkthrough addition are added together into the check subtotal; the visit-frequency method turns that subtotal into the visit charge; the visit charge is multiplied by the part-month rate; the site-crew credit and the alarm credit are then subtracted from that product; the remainder is never taken below zero and is rounded half up to the cent only at that final step.
    trigger: state_due
    subject: [resale_fee_charge]
    computes: amount
    target_tool: post_vacant_home_check_55c2c08b
    params:
      freeze_communities: [Cedar Hollow, Conestoga Meadows]
      storm_communities: [Willow Bend Estates, Palmetto Shores]
      storm_months: [6, 7, 8, 9, 10, 11]
      freeze_weekly_rate: 2.0
      storm_followup_fee: 30.00
      long_home_min_ft: 70
      mid_home_min_ft: 56
      long_home_add: 15.00
      mid_home_add: 10.00
      fuel_schedules: ["Submetered Water, Sewer & Natural Gas Schedule", "Submetered Water, Sewer & Propane Schedule"]
      winter_lookback_months: 5
      winterized_fuel_add: 25.00
      fuel_walkthrough_add: 20.00
      water_walkthrough_add: 10.00
      snow_crew_credit: 20.00
      mowing_crew_credit: 10.00
      monitored_alarm_credit: 15.00
      hardwired_alarm_credit: 5.00
      hardwired_alarm_model_year: 2015
      second_half_rate: 0.5
      first_half_rate: 0.75
    rule: >-
      While the file is opened, listed or under contract and the home is vacant, a vacant-home check is required each calendar month, and each month's check is charged within that month on its billing period, dated the first day of the month or, for the month the home became vacant, the day it became vacant.
      The month charged is the calendar month in progress on the day the check charge is worked out.
      The day the home became vacant is the date of the seller's accepted occupancy report on the file.
      Where the package's vacant_home_check_included is true no vacant-home check charge is posted.
      The standard vacant-home check charge for a month is the package's vacant_home_check_fee_monthly, charged in full for every month or part month the home stands vacant and rounded half up to the cent.
      Where the package charges for the check, the month's check charge is worked out in this order: first the package's vacant_home_check_fee_monthly, the check-size addition and the utility walkthrough addition are added together into the check subtotal; the visit-frequency method turns that subtotal into the visit charge; the visit charge is multiplied by the part-month rate; the site-crew credit and the alarm credit are then subtracted from that product; the remainder is never taken below zero and is rounded half up to the cent only at that final step.
      The visit-frequency method follows the community on the seller's site lease and the month charged: at Cedar Hollow or Conestoga Meadows in a month that is one of the package's winterization_months the home is checked weekly and the visit charge is the check subtotal multiplied by freeze_weekly_rate; at Willow Bend Estates or Palmetto Shores in a month that is one of the storm_months the home keeps its monthly visit and is also walked after named storms, so the visit charge is the check subtotal plus storm_followup_fee; in any other community or month the visit charge is the check subtotal itself.
      The check-size addition follows the length of the home recorded on the seller's site lease: a home of long_home_min_ft feet or longer adds long_home_add, a home of at least mid_home_min_ft but under long_home_min_ft feet adds mid_home_add, and a shorter home adds nothing.
      The utility walkthrough addition follows the seller's active utility account on the site and the file's winterization charges: an active account on a schedule that supplies natural gas or propane, for a home with a winterization charge on the file fewer than winter_lookback_months whole calendar months old, adds winterized_fuel_add; an active account on a natural gas or propane schedule, for a home without such a charge, adds fuel_walkthrough_add; an active account on any other schedule adds water_walkthrough_add; and a site with no active utility account adds nothing.
      The site-crew credit follows the seller's enrolled site-care plan, the community on the seller's site lease and the month charged: a plan that includes snow removal, for a home at Cedar Hollow or Conestoga Meadows, in a month that is one of the winterization_months, credits snow_crew_credit; a plan that includes mowing, for a home in any other community or in a month outside the winterization_months, credits mowing_crew_credit; any other plan, community or month credits nothing.
      The alarm credit follows the home's alarm records: a monitored alarm on file with the seller's in-force Hearthstone home insurance policy credits monitored_alarm_credit; with no monitored alarm on file, a home whose model year on the site lease is hardwired_alarm_model_year or later credits hardwired_alarm_credit; any other home credits nothing.
      The part-month rate applies to the month in which the home became vacant: a vacancy that began on the sixteenth day of that month or later is charged at second_half_rate, a vacancy that began between the second and the fifteenth day of that month is charged at first_half_rate, and any other month, the home being vacant from its first day, is charged at a rate of one.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [community_name, home_length_ft, home_model_year]
        note: The visit-frequency method, the check-size addition, the community part of the site-crew credit and the hardwired tier of the alarm credit take their tier from the seller's site lease.
      - category: utility
        as: branch
        reads: [variant_name, status]
        note: The utility walkthrough addition takes its tier from the schedule and status of the seller's utility account on the site.
      - category: rules
        as: branch
        reads: [status, variant_name]
        note: The site-crew credit takes its tier from whether the seller's enrolled site-care plan includes snow removal or mowing.
      - category: insurance
        as: branch
        reads: [status, monitored_alarm_on_file]
        note: The monitored tier of the alarm credit reads the seller's in-force Hearthstone home insurance policy.
    compute:
      - vac_date: "LATEST('resale_requests', 'created_at', date_field='created_at', request_type='occupancy_report', request_status='accepted')"
      - std_fee: "P('vacant_home_check_fee_monthly')"
      - check_month: "MONTHS('2000-01-01', NOW) % 12 + 1"
      - home_length: "CFIELD('lease', 'home_length_ft', lease_id=F('lease_id'))"
      - size_add: "K('long_home_add') if float(home_length) >= K('long_home_min_ft') else (K('mid_home_add') if float(home_length) >= K('mid_home_min_ft') else 0)"
      - util_schedule: "CFIELD('utility', 'variant_name', lease_id=F('lease_id'), status='active')"
      - winterized: "COUNT('resale_ledger', within_months=K('winter_lookback_months'), date_field='entry_date', event_type='resale_fee_charge', charge_type='winterization')"
      - utility_add: "K('winterized_fuel_add') if ((util_schedule or '') in K('fuel_schedules') and winterized >= 1) else (K('fuel_walkthrough_add') if (util_schedule or '') in K('fuel_schedules') else (K('water_walkthrough_add') if (util_schedule or '') != '' else 0))"
      - check_subtotal: "std_fee + size_add + utility_add"
      - community: "CFIELD('lease', 'community_name', lease_id=F('lease_id'))"
      - visit_charge: "check_subtotal * K('freeze_weekly_rate') if (community in K('freeze_communities') and check_month in P('winterization_months')) else (check_subtotal + K('storm_followup_fee') if (community in K('storm_communities') and check_month in K('storm_months')) else check_subtotal)"
      - snow_plan: "CPARAM('rules', 'snow_removal_included', lease_id=F('lease_id'), status='enrolled')"
      - mowing_plan: "CPARAM('rules', 'mowing_included', lease_id=F('lease_id'), status='enrolled')"
      - crew_credit: "K('snow_crew_credit') if (snow_plan == True and community in K('freeze_communities') and check_month in P('winterization_months')) else (K('mowing_crew_credit') if (mowing_plan == True and (community not in K('freeze_communities') or check_month not in P('winterization_months'))) else 0)"
      - alarm_on_file: "CFIELD('insurance', 'monitored_alarm_on_file', lease_id=F('lease_id'), status='in_force')"
      - model_year: "CFIELD('lease', 'home_model_year', lease_id=F('lease_id'))"
      - alarm_credit: "K('monitored_alarm_credit') if alarm_on_file == True else (K('hardwired_alarm_credit') if int(model_year) >= K('hardwired_alarm_model_year') else 0)"
      - vac_this_month: "MONTHS('2000-01-01', vac_date) == MONTHS('2000-01-01', NOW)"
      - vac_second_half: "MONTHS('2000-01-16', vac_date) == MONTHS('2000-01-01', vac_date)"
      - vac_after_first: "MONTHS('2000-01-02', vac_date) == MONTHS('2000-01-01', vac_date)"
      - part_rate: "K('second_half_rate') if (vac_this_month and vac_second_half) else (K('first_half_rate') if (vac_this_month and vac_after_first) else 1.0)"
      - result: "RND(MX(0, visit_charge * part_rate - crew_credit - alarm_credit)) if std_fee > 0 else 0"
    compute_basis:
      vac_date: "The day the home became vacant is the date of the seller's accepted occupancy report on the file."
      std_fee: "The standard vacant-home check charge for a month is the package's vacant_home_check_fee_monthly, charged in full for every month or part month the home stands vacant and rounded half up to the cent."
      check_month: "The month charged is the calendar month in progress on the day the check charge is worked out."
      home_length: "The check-size addition follows the length of the home recorded on the seller's site lease"
      size_add: "a home of long_home_min_ft feet or longer adds long_home_add, a home of at least mid_home_min_ft but under long_home_min_ft feet adds mid_home_add, and a shorter home adds nothing."
      util_schedule: "The utility walkthrough addition follows the seller's active utility account on the site and the file's winterization charges"
      winterized: "for a home with a winterization charge on the file fewer than winter_lookback_months whole calendar months old"
      utility_add: "an active account on a schedule that supplies natural gas or propane, for a home with a winterization charge on the file fewer than winter_lookback_months whole calendar months old, adds winterized_fuel_add; an active account on a natural gas or propane schedule, for a home without such a charge, adds fuel_walkthrough_add; an active account on any other schedule adds water_walkthrough_add; and a site with no active utility account adds nothing."
      check_subtotal: "first the package's vacant_home_check_fee_monthly, the check-size addition and the utility walkthrough addition are added together into the check subtotal"
      community: "The visit-frequency method follows the community on the seller's site lease and the month charged"
      visit_charge: "at Cedar Hollow or Conestoga Meadows in a month that is one of the package's winterization_months the home is checked weekly and the visit charge is the check subtotal multiplied by freeze_weekly_rate; at Willow Bend Estates or Palmetto Shores in a month that is one of the storm_months the home keeps its monthly visit and is also walked after named storms, so the visit charge is the check subtotal plus storm_followup_fee; in any other community or month the visit charge is the check subtotal itself."
      snow_plan: "The site-crew credit follows the seller's enrolled site-care plan, the community on the seller's site lease and the month charged"
      mowing_plan: "The site-crew credit follows the seller's enrolled site-care plan, the community on the seller's site lease and the month charged"
      crew_credit: "a plan that includes snow removal, for a home at Cedar Hollow or Conestoga Meadows, in a month that is one of the winterization_months, credits snow_crew_credit; a plan that includes mowing, for a home in any other community or in a month outside the winterization_months, credits mowing_crew_credit; any other plan, community or month credits nothing."
      alarm_on_file: "a monitored alarm on file with the seller's in-force Hearthstone home insurance policy credits monitored_alarm_credit"
      model_year: "with no monitored alarm on file, a home whose model year on the site lease is hardwired_alarm_model_year or later credits hardwired_alarm_credit"
      alarm_credit: "a monitored alarm on file with the seller's in-force Hearthstone home insurance policy credits monitored_alarm_credit; with no monitored alarm on file, a home whose model year on the site lease is hardwired_alarm_model_year or later credits hardwired_alarm_credit; any other home credits nothing."
      vac_this_month: "The part-month rate applies to the month in which the home became vacant"
      vac_second_half: "a vacancy that began on the sixteenth day of that month or later is charged at second_half_rate"
      vac_after_first: "a vacancy that began between the second and the fifteenth day of that month is charged at first_half_rate"
      part_rate: "a vacancy that began on the sixteenth day of that month or later is charged at second_half_rate, a vacancy that began between the second and the fifteenth day of that month is charged at first_half_rate, and any other month, the home being vacant from its first day, is charged at a rate of one."
      result: "the visit charge is multiplied by the part-month rate; the site-crew credit and the alarm credit are then subtracted from that product; the remainder is never taken below zero and is rounded half up to the cent only at that final step."
    factors:
      - id: check_visit_frequency_method
        effect: method
        decides: visit_charge
        bindings: [community, visit_charge]
        ladder:
          - when: "the site lease places the home at Cedar Hollow or Conestoga Meadows and the month charged is one of the winterization_months"
            method: "weekly checks: the visit charge is the check subtotal multiplied by freeze_weekly_rate"
          - when: "the site lease places the home at Willow Bend Estates or Palmetto Shores and the month charged is one of the storm_months"
            method: "monthly visit plus storm walks: the visit charge is the check subtotal plus storm_followup_fee"
          - when: "otherwise"
            method: "the single monthly visit: the visit charge is the check subtotal itself"
        baseline:
          visit_charge: "check_subtotal"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: check_size_addition
        effect: parameter
        decides: size_add
        bindings: [home_length, size_add]
        ladder:
          - when: "the home on the site lease is long_home_min_ft feet or longer"
            value: "K('long_home_add')"
          - when: "the home is at least mid_home_min_ft and under long_home_min_ft feet"
            value: "K('mid_home_add')"
          - when: "otherwise (a shorter home)"
            value: "0"
        baseline:
          size_add: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: check_utility_walkthrough_addition
        effect: parameter
        decides: utility_add
        bindings: [util_schedule, winterized, utility_add]
        ladder:
          - when: "the site's utility account is active on a schedule supplying natural gas or propane and the file carries a winterization charge fewer than winter_lookback_months whole months old"
            value: "K('winterized_fuel_add')"
          - when: "the site's utility account is active on a natural gas or propane schedule and the file carries no such winterization charge"
            value: "K('fuel_walkthrough_add')"
          - when: "the site's utility account is active on any other schedule"
            value: "K('water_walkthrough_add')"
          - when: "otherwise (no active utility account on the site)"
            value: "0"
        baseline:
          utility_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: utility
      - id: check_site_crew_credit
        effect: parameter
        decides: crew_credit
        bindings: [snow_plan, mowing_plan, crew_credit]
        ladder:
          - when: "the enrolled site-care plan includes snow removal, the site lease places the home at Cedar Hollow or Conestoga Meadows, and the month charged is one of the winterization_months"
            value: "K('snow_crew_credit')"
          - when: "the enrolled site-care plan includes mowing and either the site lease places the home in another community or the month charged is outside the winterization_months"
            value: "K('mowing_crew_credit')"
          - when: "otherwise"
            value: "0"
        baseline:
          crew_credit: "0"
        evidence: [cross_category, date]
        cross_difficulty: rules
      - id: check_alarm_credit
        effect: parameter
        decides: alarm_credit
        bindings: [alarm_on_file, model_year, alarm_credit]
        ladder:
          - when: "a monitored alarm is on file with the seller's in-force Hearthstone home insurance policy"
            value: "K('monitored_alarm_credit')"
          - when: "no monitored alarm is on file and the home's model year on the site lease is hardwired_alarm_model_year or later"
            value: "K('hardwired_alarm_credit')"
          - when: "otherwise"
            value: "0"
        baseline:
          alarm_credit: "0"
        evidence: [cross_category]
        cross_difficulty: insurance
      - id: check_part_month_rate
        effect: parameter
        decides: part_rate
        bindings: [vac_this_month, vac_second_half, vac_after_first, part_rate]
        ladder:
          - when: "the month charged is the month the home became vacant and the vacancy began on the sixteenth day or later"
            value: "K('second_half_rate')"
          - when: "the month charged is the month the home became vacant and the vacancy began between the second and the fifteenth day"
            value: "K('first_half_rate')"
          - when: "otherwise (the home vacant from the month's first day)"
            value: "1.0"
        baseline:
          part_rate: "1.0"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard vacant-home check charge for a month is the package's vacant_home_check_fee_monthly, charged in full for every month or part month the home stands vacant and rounded half up to the cent.
      params: [vacant_home_check_fee_monthly]
    inputs:
      history:
        - {table: resale_requests, aggregate: latest, field: created_at, filters: {request_type: occupancy_report, request_status: accepted}}
        - {table: resale_ledger, aggregate: count, field: resale_entry_id, within_months: 5, filters: {event_type: resale_fee_charge, charge_type: winterization}}
      cross_category: [lease, utility, rules, insurance]

  - id: resale_ext_reinspection_booking_payment
    base_policy_refs: [resale_fee_billing_terms, resale_inspection_terms]
    overwrite:
      - base_policy: resale_inspection_terms
        superseded_clause: >-
          Every re-inspection is charged at reinspection_fee on its date, and the first included_reinspections re-inspections on the file (resale_msr_reinspections) are credited in full with credit_reason included_reinspection.
        replaced_by: >-
          Every re-inspection on the file is charged on its date at the visit fee worked out this way for it, and a re-inspection among the first included_reinspections re-inspections on the file is credited in full as an included re-inspection, so that its visit fee adds nothing to the booking payment.
    trigger: on_request
    subject: [resale_fee_payment]
    computes: amount
    target_tool: pay_reinspection_booking_26088ed0
    params:
      mid_items_min: 3
      many_items_min: 6
      mid_items_fee: 95.00
      many_items_fee: 120.00
      multi_section_add: 30.00
      long_single_min_ft: 70
      long_single_add: 15.00
      second_visit_add: 35.00
      later_visit_add: 60.00
      lapsed_window_days: 60
      late_rate: 1.5
    rule: >-
      A re-inspection of a resale file is booked when the seller makes the booking payment on the file, a payment that clears every fee then owed on the file and prepays the visit fee of the coming re-inspection; the visit fee is charged on the visit date and is met from that prepayment.
      The booking payment is fixed only after the file's ledger carries the inspection charge owed for every initial inspection recorded on the file.
      The booking payment is not worked out until the file's ledger carries the vacant-home check charge owed for every calendar month in which the occupancy recorded on the file has stood vacant.
      The standard booking payment is the fees owed on the file, being every charge on the file less every payment, credit and proceeds deduction on it and never less than zero, plus the package's reinspection_fee for the coming visit unless that visit is an included re-inspection, the sum rounded half up to the cent.
      The coming visit's fee is worked out in this order: the items fee, the section surcharge and the repeat-visit surcharge are added together into the visit-fee sum, the repair-window method turns that sum into the visit fee, and the visit fee is rounded half up to the cent; the booking payment is then the fees owed on the file plus that visit fee.
      Every re-inspection on the file is charged on its date at the visit fee worked out this way for it, and a re-inspection among the first included_reinspections re-inspections on the file is credited in full as an included re-inspection, so that its visit fee adds nothing to the booking payment.
      The items fee follows the count of standards items the most recent inspection on the file found failing: many_items_min items or more carry many_items_fee, at least mid_items_min but fewer than many_items_min items carry mid_items_fee, and fewer than mid_items_min items carry the package's reinspection_fee.
      The section surcharge follows the home recorded on the seller's site lease: a multi-section home adds multi_section_add, a single-section home of long_single_min_ft feet or longer adds long_single_add, and a shorter single-section home adds nothing.
      The repeat-visit surcharge follows the re-inspections already recorded on the file: two or more already recorded add later_visit_add, exactly one already recorded adds second_visit_add, and none recorded adds nothing.
      The repair-window method follows the calendar days from the date of the most recent inspection on the file to the day the visit is booked: after more than lapsed_window_days days the repairs window has lapsed and the visit is a full inspection of every standards item, so the package's inspection_fee takes the place of the items fee in the visit-fee sum; after more than the package's repair_completion_days but no more than lapsed_window_days days the visit is a late re-inspection and the visit-fee sum is multiplied by late_rate; within the package's repair_completion_days days the visit fee is the visit-fee sum itself.
    prerequisite:
      - problem: resale_ext_initial_inspection_charge
        kind: value_input
        gate: fees_owed
        form: state
        policy_source: >-
          The booking payment is fixed only after the file's ledger carries the inspection charge owed for every initial inspection recorded on the file.
        condition: >-
          For every initial inspection record on the file the ledger holds the inspection-fee charge that bills it (a fee charge of type inspection_fee whose source reference is that record), except where the package's inspection fee is 0.00 or the visit-timing method leaves nothing to charge.
        resolved_by: post_inspection_fee_534473a1
        effect: >-
          The fees owed on the file rise by the inspection charge once it is posted, so the fees_owed binding, and with it the booking payment, rises by that amount.
      - problem: resale_ext_vacant_home_check_charge
        kind: value_input
        gate: fees_owed
        form: state
        policy_source: >-
          The booking payment is not worked out until the file's ledger carries the vacant-home check charge owed for every calendar month in which the occupancy recorded on the file has stood vacant.
        condition: >-
          For every calendar month, from the month of the seller's accepted occupancy report recording the home vacant through the month in progress, the ledger holds a fee charge of type vacant_home_check for that billing period, except on a package whose check is included.
        resolved_by: post_vacant_home_check_55c2c08b
        effect: >-
          The fees owed on the file rise by the month's vacant-home check charge once it is posted, so the fees_owed binding, and with it the booking payment, rises by that amount.
    cross_category:
      - category: lease
        as: branch
        reads: [home_section_type, home_length_ft]
        note: The section surcharge takes its tier from the home recorded on the seller's site lease.
    compute:
      - last_insp_date: "LATEST('resale_records', 'record_date', date_field='record_date', event_type='resale_inspection')"
      - items_failing: "LATEST('resale_records', 'required_repair_count', date_field='record_date', event_type='resale_inspection')"
      - items_fee: "K('many_items_fee') if int(items_failing) >= K('many_items_min') else (K('mid_items_fee') if int(items_failing) >= K('mid_items_min') else P('reinspection_fee'))"
      - section_type: "CFIELD('lease', 'home_section_type', lease_id=F('lease_id'))"
      - home_length: "CFIELD('lease', 'home_length_ft', lease_id=F('lease_id'))"
      - section_add: "K('multi_section_add') if section_type == 'multi_section' else (K('long_single_add') if float(home_length) >= K('long_single_min_ft') else 0)"
      - prior_reinspections: "COUNT('resale_records', event_type='resale_inspection', inspection_type='reinspection')"
      - repeat_add: "K('later_visit_add') if prior_reinspections >= 2 else (K('second_visit_add') if prior_reinspections >= 1 else 0)"
      - days_since_inspection: "DAYS(last_insp_date, NOW)"
      - window_fee: "(P('inspection_fee') + section_add + repeat_add) if days_since_inspection > K('lapsed_window_days') else ((items_fee + section_add + repeat_add) * K('late_rate') if days_since_inspection > P('repair_completion_days') else items_fee + section_add + repeat_add)"
      - charges: "SUM('resale_ledger', 'amount', event_type='resale_fee_charge')"
      - payments: "SUM('resale_ledger', 'amount', event_type='resale_fee_payment')"
      - credits: "SUM('resale_ledger', 'amount', event_type='resale_fee_credit')"
      - deductions: "SUM('resale_ledger', 'amount', event_type='resale_proceeds_deduction')"
      - fees_owed: "RND(MX(0, charges - payments - credits - deductions))"
      - visit_fee: "0 if prior_reinspections < P('included_reinspections') else RND(window_fee)"
      - result: "RND(fees_owed + visit_fee)"
    compute_basis:
      last_insp_date: "The repair-window method follows the calendar days from the date of the most recent inspection on the file to the day the visit is booked"
      items_failing: "The items fee follows the count of standards items the most recent inspection on the file found failing"
      items_fee: "many_items_min items or more carry many_items_fee, at least mid_items_min but fewer than many_items_min items carry mid_items_fee, and fewer than mid_items_min items carry the package's reinspection_fee."
      section_type: "The section surcharge follows the home recorded on the seller's site lease"
      home_length: "a single-section home of long_single_min_ft feet or longer adds long_single_add"
      section_add: "a multi-section home adds multi_section_add, a single-section home of long_single_min_ft feet or longer adds long_single_add, and a shorter single-section home adds nothing."
      prior_reinspections: "The repeat-visit surcharge follows the re-inspections already recorded on the file"
      repeat_add: "two or more already recorded add later_visit_add, exactly one already recorded adds second_visit_add, and none recorded adds nothing."
      days_since_inspection: "The repair-window method follows the calendar days from the date of the most recent inspection on the file to the day the visit is booked"
      window_fee: "after more than lapsed_window_days days the repairs window has lapsed and the visit is a full inspection of every standards item, so the package's inspection_fee takes the place of the items fee in the visit-fee sum; after more than the package's repair_completion_days but no more than lapsed_window_days days the visit is a late re-inspection and the visit-fee sum is multiplied by late_rate; within the package's repair_completion_days days the visit fee is the visit-fee sum itself."
      charges: "the fees owed on the file, being every charge on the file less every payment, credit and proceeds deduction on it and never less than zero"
      payments: "the fees owed on the file, being every charge on the file less every payment, credit and proceeds deduction on it and never less than zero"
      credits: "the fees owed on the file, being every charge on the file less every payment, credit and proceeds deduction on it and never less than zero"
      deductions: "the fees owed on the file, being every charge on the file less every payment, credit and proceeds deduction on it and never less than zero"
      fees_owed: "the fees owed on the file, being every charge on the file less every payment, credit and proceeds deduction on it and never less than zero"
      visit_fee: "a re-inspection among the first included_reinspections re-inspections on the file is credited in full as an included re-inspection, so that its visit fee adds nothing to the booking payment."
      result: "the booking payment is then the fees owed on the file plus that visit fee."
    factors:
      - id: booking_items_fee
        effect: parameter
        decides: items_fee
        bindings: [items_failing, items_fee]
        ladder:
          - when: "the most recent inspection on the file found many_items_min or more standards items failing"
            value: "K('many_items_fee')"
          - when: "it found at least mid_items_min but fewer than many_items_min items failing"
            value: "K('mid_items_fee')"
          - when: "otherwise (fewer than mid_items_min items failing)"
            value: "P('reinspection_fee')"
        baseline:
          items_fee: "P('reinspection_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: booking_section_surcharge
        effect: parameter
        decides: section_add
        bindings: [section_type, home_length, section_add]
        ladder:
          - when: "the seller's site lease records a multi-section home"
            value: "K('multi_section_add')"
          - when: "the site lease records a single-section home of long_single_min_ft feet or longer"
            value: "K('long_single_add')"
          - when: "otherwise (a shorter single-section home)"
            value: "0"
        baseline:
          section_add: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: booking_repeat_visit_surcharge
        effect: parameter
        decides: repeat_add
        bindings: [prior_reinspections, repeat_add]
        ladder:
          - when: "two or more re-inspections are already recorded on the file"
            value: "K('later_visit_add')"
          - when: "exactly one re-inspection is already recorded on the file"
            value: "K('second_visit_add')"
          - when: "otherwise (no re-inspection yet)"
            value: "0"
        baseline:
          repeat_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: booking_repair_window_method
        effect: method
        decides: window_fee
        bindings: [days_since_inspection, window_fee]
        ladder:
          - when: "more than lapsed_window_days calendar days have passed from the most recent inspection to the booking day"
            method: "a full inspection: the package's inspection_fee replaces the items fee, plus the section and repeat-visit surcharges"
          - when: "more than the package's repair_completion_days but no more than lapsed_window_days days have passed"
            method: "a late re-inspection: the visit-fee sum is multiplied by late_rate"
          - when: "otherwise (within repair_completion_days days)"
            method: "the visit fee is the visit-fee sum itself"
        baseline:
          window_fee: "items_fee + section_add + repeat_add"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard booking payment is the fees owed on the file, being every charge on the file less every payment, credit and proceeds deduction on it and never less than zero, plus the package's reinspection_fee for the coming visit unless that visit is an included re-inspection, the sum rounded half up to the cent.
      params: [reinspection_fee]
    inputs:
      history:
        - {table: resale_records, aggregate: latest, field: required_repair_count, filters: {event_type: resale_inspection}}
        - {table: resale_records, aggregate: count, field: resale_record_id, filters: {event_type: resale_inspection, inspection_type: reinspection}}
        - {table: resale_ledger, aggregate: sum, field: amount, filters: {}}
      cross_category: [lease]

  - id: resale_ext_appraisal_charge
    base_policy_refs: [resale_file_opening_terms, resale_inspection_terms, resale_closing_settlement, resale_withdrawal_terms, resale_vacant_home_terms, resale_guaranteed_terms]
    overwrite:
      - base_policy: resale_guaranteed_terms
        superseded_clause: >-
          The guarantee requires an independent appraisal, charged at appraisal_fee on the appraisal date, before the home is listed.
        replaced_by: >-
          The guarantee requires an independent appraisal before the home is listed, and that appraisal is charged to the seller once, against the appraisal record it bills, dated on that appraisal's record date.
    trigger: state_due
    subject: [resale_fee_charge]
    computes: amount
    target_tool: post_appraisal_fee_5faa8f88
    params:
      long_home_min_ft: 73
      mid_home_min_ft: 65
      long_home_add: 60.00
      mid_home_add: 30.00
      northern_panel_communities: [Cedar Hollow, Conestoga Meadows]
      southwest_panel_communities: [Saguaro Vista, Bluebonnet Ridge]
      northern_panel_add: 75.00
      southwest_panel_add: 40.00
      addendum_many_items: 4
      addendum_many_add: 50.00
      addendum_few_add: 25.00
      lakefront_add: 60.00
      greenbelt_add: 30.00
      update_recent_months: 24
      update_older_months: 60
      desktop_update_fee: 275.00
      update_older_rate: 0.8
    rule: >-
      The guarantee requires an independent appraisal before the home is listed, and that appraisal is charged to the seller once, against the appraisal record it bills, dated on that appraisal's record date.
      An older appraisal redone at Hearthstone's cost before the guaranteed offer carries no charge to the seller.
      The standard appraisal charge is the package's appraisal_fee, charged in full for the appraisal and rounded half up to the cent.
      The appraisal charge is worked out in this order: the home-length addition, the regional panel addition, the condition-addendum addition and the site-premium addition are added to the package's appraisal_fee into the appraisal sum, the loan-update method turns that sum into the charge, and the charge is rounded half up to the cent only at that final step.
      The home-length addition follows the length of the home recorded on the seller's site lease: long_home_min_ft feet or longer adds long_home_add, at least mid_home_min_ft but under long_home_min_ft feet adds mid_home_add, and a shorter home adds nothing.
      The regional panel addition follows the state of the community on the seller's site lease, whose appraisal panel sets its own rates: Cedar Hollow or Conestoga Meadows, in Michigan and Pennsylvania, adds northern_panel_add; Saguaro Vista or Bluebonnet Ridge, in Arizona and Texas, adds southwest_panel_add; the Florida communities add nothing.
      The condition-addendum addition follows the largest count of standards items any inspection on the file has found failing, which the appraiser reports on with the repairs made: addendum_many_items or more add addendum_many_add, at least one but fewer than addendum_many_items add addendum_few_add, and a file whose inspections found no failing item adds nothing.
      The site-premium addition follows the lot class on the seller's site lease, whose premium the appraiser supports with lot comparables: a Lakefront Multi-Section Home Site adds lakefront_add, a Greenbelt Multi-Section Home Site adds greenbelt_add, and any other lot class adds nothing.
      The loan-update method follows the open (active or delinquent) Hearthstone Home Finance loan on the home, whose origination appraisal the appraiser can update, measured in whole calendar months from the loan's funding date to the date the resale file was opened: a loan funded fewer than update_recent_months months before is updated at the desk, so the charge is the flat desktop_update_fee in place of the appraisal sum; a loan funded at least update_recent_months but fewer than update_older_months months before is updated with a new inspection of the home, so the charge is the appraisal sum multiplied by update_older_rate; a home with no open Hearthstone loan, or one funded update_older_months months or more before, is appraised afresh and charged the appraisal sum itself.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [home_length_ft, community_name, variant_name]
        note: The home-length, regional panel and site-premium additions take their tier from the seller's site lease.
      - category: loan
        as: branch
        reads: [status, funded_date]
        note: The loan-update method takes its tier from the funding date of the open Hearthstone Home Finance loan on the home.
    compute:
      - std_fee: "P('appraisal_fee')"
      - home_length: "CFIELD('lease', 'home_length_ft', lease_id=F('lease_id'))"
      - length_add: "K('long_home_add') if float(home_length) >= K('long_home_min_ft') else (K('mid_home_add') if float(home_length) >= K('mid_home_min_ft') else 0)"
      - community: "CFIELD('lease', 'community_name', lease_id=F('lease_id'))"
      - panel_add: "K('northern_panel_add') if community in K('northern_panel_communities') else (K('southwest_panel_add') if community in K('southwest_panel_communities') else 0)"
      - most_failing: "MAX('resale_records', 'required_repair_count', event_type='resale_inspection')"
      - addendum_add: "K('addendum_many_add') if most_failing >= K('addendum_many_items') else (K('addendum_few_add') if most_failing >= 1 else 0)"
      - lot_class: "CFIELD('lease', 'variant_name', lease_id=F('lease_id'))"
      - premium_add: "K('lakefront_add') if lot_class == 'Lakefront Multi-Section Home Site' else (K('greenbelt_add') if lot_class == 'Greenbelt Multi-Section Home Site' else 0)"
      - appraisal_sum: "std_fee + length_add + panel_add + addendum_add + premium_add"
      - loan_funded: "CFIELD('loan', 'funded_date', lease_id=F('lease_id'), status='active') or CFIELD('loan', 'funded_date', lease_id=F('lease_id'), status='delinquent')"
      - loan_age_months: "MONTHS(loan_funded, F('opened_date')) if loan_funded else 9999"
      - update_charge: "K('desktop_update_fee') if loan_age_months < K('update_recent_months') else (appraisal_sum * K('update_older_rate') if loan_age_months < K('update_older_months') else appraisal_sum)"
      - result: "RND(update_charge)"
    compute_basis:
      std_fee: "The standard appraisal charge is the package's appraisal_fee, charged in full for the appraisal and rounded half up to the cent."
      home_length: "The home-length addition follows the length of the home recorded on the seller's site lease"
      length_add: "long_home_min_ft feet or longer adds long_home_add, at least mid_home_min_ft but under long_home_min_ft feet adds mid_home_add, and a shorter home adds nothing."
      community: "The regional panel addition follows the state of the community on the seller's site lease, whose appraisal panel sets its own rates"
      panel_add: "Cedar Hollow or Conestoga Meadows, in Michigan and Pennsylvania, adds northern_panel_add; Saguaro Vista or Bluebonnet Ridge, in Arizona and Texas, adds southwest_panel_add; the Florida communities add nothing."
      most_failing: "The condition-addendum addition follows the largest count of standards items any inspection on the file has found failing"
      addendum_add: "addendum_many_items or more add addendum_many_add, at least one but fewer than addendum_many_items add addendum_few_add, and a file whose inspections found no failing item adds nothing."
      lot_class: "The site-premium addition follows the lot class on the seller's site lease"
      premium_add: "a Lakefront Multi-Section Home Site adds lakefront_add, a Greenbelt Multi-Section Home Site adds greenbelt_add, and any other lot class adds nothing."
      appraisal_sum: "the home-length addition, the regional panel addition, the condition-addendum addition and the site-premium addition are added to the package's appraisal_fee into the appraisal sum"
      loan_funded: "The loan-update method follows the open (active or delinquent) Hearthstone Home Finance loan on the home"
      loan_age_months: "measured in whole calendar months from the loan's funding date to the date the resale file was opened"
      update_charge: "a loan funded fewer than update_recent_months months before is updated at the desk, so the charge is the flat desktop_update_fee in place of the appraisal sum; a loan funded at least update_recent_months but fewer than update_older_months months before is updated with a new inspection of the home, so the charge is the appraisal sum multiplied by update_older_rate; a home with no open Hearthstone loan, or one funded update_older_months months or more before, is appraised afresh and charged the appraisal sum itself."
      result: "the loan-update method turns that sum into the charge, and the charge is rounded half up to the cent only at that final step."
    factors:
      - id: appraisal_home_length_addition
        effect: parameter
        decides: length_add
        bindings: [home_length, length_add]
        ladder:
          - when: "the home on the seller's site lease is long_home_min_ft feet or longer"
            value: "K('long_home_add')"
          - when: "the home is at least mid_home_min_ft and under long_home_min_ft feet"
            value: "K('mid_home_add')"
          - when: "otherwise (a shorter home)"
            value: "0"
        baseline:
          length_add: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: appraisal_regional_panel_addition
        effect: parameter
        decides: panel_add
        bindings: [community, panel_add]
        ladder:
          - when: "the site lease places the home at Cedar Hollow or Conestoga Meadows"
            value: "K('northern_panel_add')"
          - when: "the site lease places the home at Saguaro Vista or Bluebonnet Ridge"
            value: "K('southwest_panel_add')"
          - when: "otherwise (a Florida community)"
            value: "0"
        baseline:
          panel_add: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: appraisal_condition_addendum_addition
        effect: parameter
        decides: addendum_add
        bindings: [most_failing, addendum_add]
        ladder:
          - when: "an inspection on the file found addendum_many_items or more standards items failing"
            value: "K('addendum_many_add')"
          - when: "the most any inspection on the file found failing is at least one and below addendum_many_items"
            value: "K('addendum_few_add')"
          - when: "otherwise (no inspection found a failing item)"
            value: "0"
        baseline:
          addendum_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: appraisal_site_premium_addition
        effect: parameter
        decides: premium_add
        bindings: [lot_class, premium_add]
        ladder:
          - when: "the seller's site lease is on a Lakefront Multi-Section Home Site"
            value: "K('lakefront_add')"
          - when: "the site lease is on a Greenbelt Multi-Section Home Site"
            value: "K('greenbelt_add')"
          - when: "otherwise"
            value: "0"
        baseline:
          premium_add: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: appraisal_loan_update_method
        effect: method
        decides: update_charge
        bindings: [loan_funded, loan_age_months, update_charge]
        ladder:
          - when: "an open Hearthstone Home Finance loan on the home was funded fewer than update_recent_months whole months before the file was opened"
            method: "a desk update: the charge is the flat desktop_update_fee in place of the appraisal sum"
          - when: "the open loan was funded at least update_recent_months but fewer than update_older_months whole months before the file was opened"
            method: "an inspected update: the appraisal sum is multiplied by update_older_rate"
          - when: "otherwise (no open Hearthstone loan, or one funded update_older_months months or more before)"
            method: "a fresh appraisal: the appraisal sum itself is charged"
        baseline:
          update_charge: "appraisal_sum"
        evidence: [cross_category, date]
        cross_difficulty: loan
    baseline:
      rule: >-
        The standard appraisal charge is the package's appraisal_fee, charged in full for the appraisal and rounded half up to the cent.
      params: [appraisal_fee]
    inputs:
      history:
        - {table: resale_records, aggregate: max, field: required_repair_count, filters: {event_type: resale_inspection}}
      cross_category: [lease, loan]

  - id: resale_ext_lowest_closing_price
    base_policy_refs: [resale_listing_terms, resale_closing_settlement, resale_closing_conditions, resale_purchase_contract_terms]
    overwrite:
      - base_policy: resale_closing_settlement
        superseded_clause: >-
          At a closing to a buyer the commission is commission_pct percent of the gross sale price (commission_basis), raised to minimum_commission, rounded half up to the cent and charged on the closing date; no commission is charged on a package whose commission_pct is 0.0.
        replaced_by: >-
          At a closing to a buyer the commission is the loyalty commission rate, being the package's commission_pct less the loyalty reduction, percent of the gross sale price, raised to minimum_commission, rounded half up to the cent and charged on the closing date; no commission is charged on a package whose commission_pct is 0.0.
    trigger: on_request
    subject: [resale_price_change]
    computes: new_list_price
    target_tool: set_asking_price_9cfe4b28
    params:
      long_tenure_months: 120
      mid_tenure_months: 36
      long_tenure_cut: 1.0
      mid_tenure_cut: 0.5
      northern_communities: [Cedar Hollow, Conestoga Meadows]
      sunbelt_communities: [Willow Bend Estates, Palmetto Shores, Saguaro Vista]
      sunbelt_summer_months: [5, 6, 7, 8, 9]
      northern_winter_days: 30
      sunbelt_summer_days: 20
      price_step: 100
    rule: >-
      A seller whose home is listed may ask for the asking price to be set at the lowest closing price, the lowest asking price at which a sale would still close with every closing deduction paid from the proceeds; the seller signs that price change and the asking price becomes exactly that figure.
      Before the lowest closing price is worked out, the file's ledger must carry the appraisal fee owed for every appraisal recorded on the file.
      The standard lowest closing price takes as the closing deductions the fees owed on the file where the package deducts fees from the proceeds, the package's transaction_fee where it has one, the package's closing_fee, the seller's past-due site-lease balance where the package pays it from the proceeds, and the unpaid principal of a Hearthstone Home Finance loan on the home; it then takes the larger of the closing deductions divided by one less the package's commission_pct as a fraction and the closing deductions plus the package's minimum_commission, and rounds that figure up to the next whole multiple of price_step dollars.
      The fees owed on the file are every charge on it less every payment, credit and proceeds deduction on it, never less than zero.
      At a closing to a buyer the commission is the loyalty commission rate, being the package's commission_pct less the loyalty reduction, percent of the gross sale price, raised to minimum_commission, rounded half up to the cent and charged on the closing date; no commission is charged on a package whose commission_pct is 0.0.
      The seller's tenure is counted in whole calendar months from the move-in date on the seller's site lease to the handling date, whatever term is running.
      The loyalty reduction follows the seller's tenure on the site lease and the home's financing: a seller whose lease began long_tenure_months or more whole calendar months ago and whose home carries an open Hearthstone Home Finance loan has long_tenure_cut percentage points taken off, a seller whose lease began at least mid_tenure_months but fewer than long_tenure_months whole calendar months ago and whose home carries an open Hearthstone Home Finance loan has mid_tenure_cut percentage points taken off, and any other seller has none.
      The closing horizon is the package's buyer_application_deadline_days plus its closing_deadline_days plus the seasonal market days, and the seasonal market days follow the community on the seller's site lease and the month of the handling date: Cedar Hollow or Conestoga Meadows in one of the package's winterization_months add northern_winter_days, Willow Bend Estates, Palmetto Shores or Saguaro Vista in one of the sunbelt_summer_months add sunbelt_summer_days, and any other community or month adds none.
      The Hearthstone payoff figure is chosen in this order: for an open (active or delinquent) Hearthstone Home Finance loan on the home, a payoff statement on that loan whose good-through date is the handling date or later supplies its payoff amount; failing such a statement, the open loan is projected as its unpaid principal plus fees owed on the loan less suspense funds plus interest at the note rate on the unpaid principal for the days of the closing horizon on an actual-over-365 basis, that interest and the projection each rounded half up to the cent; a home with no open Hearthstone loan takes the unpaid principal of its loan, which is zero once paid off, whatever payoff statement remains on file.
      The site-lease amount follows the lease's status and balance, rent staying due on the lease until the sale closes: a lease in default with a balance owed takes the balance plus the horizon rent plus the lot class's late_fee_maximum; an active lease or a lease under notice to vacate with a balance owed takes the balance plus the horizon rent; any other lease takes its past-due balance as it stands, never below zero; the horizon rent is the contracted monthly site rent times twelve divided by 365 times the days of the closing horizon, rounded half up to the cent.
      On the guaranteed program the asking price may never exceed list_price_max_pct_of_appraisal percent of the appraised value, so where the lowest closing price would exceed that ceiling no asking price lets a sale close: the asking price is left as it stands and the request goes to a human representative.
      The lowest closing price is worked out in this order: the closing deductions are the fees owed where the package deducts fees from the proceeds, plus the transaction fee where the package has one, plus the closing fee, plus the site-lease amount where the package pays the seller's past-due site-lease balance from the proceeds, plus the Hearthstone payoff figure; that total is divided by one less the loyalty commission rate as a fraction and, separately, increased by the package's minimum_commission where the package charges commission; the larger of the two is rounded up to the next whole multiple of price_step dollars.
    prerequisite:
      - problem: resale_ext_appraisal_charge
        kind: value_input
        gate: fees_owed
        form: state
        policy_source: >-
          Before the lowest closing price is worked out, the file's ledger must carry the appraisal fee owed for every appraisal recorded on the file.
        condition: >-
          For every appraisal record on the file that the seller owes, the ledger holds the fee charge of type appraisal_fee whose source reference is that record; an older appraisal redone at Hearthstone's cost owes none.
        resolved_by: post_appraisal_fee_5faa8f88
        effect: >-
          The fees owed on the file rise by the appraisal charge once it is posted; on a package that deducts fees from the proceeds the closing deductions, and with them the lowest closing price, rise accordingly.
    cross_category:
      - category: lease
        as: branch
        reads: [move_in_date, community_name, status, rent_balance, monthly_site_rent, late_fee_maximum]
        note: The loyalty reduction, the seasonal market days and the site-lease amount take their tier from the seller's site lease and its lot-class parameters.
      - category: loan
        as: history
        reads: [status, principal_balance, note_rate_pct, fees_balance, suspense_balance, loan_notices.good_through_date, loan_notices.payoff_amount]
        note: The loyalty reduction reads whether an open Hearthstone loan exists; the payoff figure reads the loan and its latest payoff statement.
    compute:
      - move_in: "CFIELD('lease', 'move_in_date', lease_id=F('lease_id'))"
      - tenure_months: "MONTHS(move_in, NOW)"
      - hhf_open: "EXISTS('loan', lease_id=F('lease_id'), status='active') or EXISTS('loan', lease_id=F('lease_id'), status='delinquent')"
      - rate_cut: "K('long_tenure_cut') if (tenure_months >= K('long_tenure_months') and hhf_open) else (K('mid_tenure_cut') if (tenure_months >= K('mid_tenure_months') and hhf_open) else 0)"
      - comm_pct: "(P('commission_pct') - rate_cut) if P('commission_pct') > 0 else 0"
      - community: "CFIELD('lease', 'community_name', lease_id=F('lease_id'))"
      - month_now: "MONTHS('2000-01-01', NOW) % 12 + 1"
      - season_days: "K('northern_winter_days') if (community in K('northern_communities') and month_now in P('winterization_months')) else (K('sunbelt_summer_days') if (community in K('sunbelt_communities') and month_now in K('sunbelt_summer_months')) else 0)"
      - horizon: "P('buyer_application_deadline_days') + P('closing_deadline_days') + season_days"
      - stmt_good: "XLATEST('loan', 'loan_notices', 'good_through_date', date_field='notice_date', event_type='loan_payoff_statement')"
      - stmt_amount: "XLATEST('loan', 'loan_notices', 'payoff_amount', date_field='notice_date', event_type='loan_payoff_statement')"
      - principal: "float(CFIELD('loan', 'principal_balance', lease_id=F('lease_id')) or 0)"
      - note_rate: "float(CFIELD('loan', 'note_rate_pct', lease_id=F('lease_id')) or 0)"
      - loan_fees: "float(CFIELD('loan', 'fees_balance', lease_id=F('lease_id')) or 0)"
      - loan_suspense: "float(CFIELD('loan', 'suspense_balance', lease_id=F('lease_id')) or 0)"
      - payoff: "float(stmt_amount) if (hhf_open and stmt_good and DAYS(NOW, stmt_good) >= 0) else (RND(principal + loan_fees - loan_suspense + RND(principal * note_rate / 100 / 365 * horizon)) if hhf_open else principal)"
      - lease_status: "CFIELD('lease', 'status', lease_id=F('lease_id'))"
      - rent_balance: "float(CFIELD('lease', 'rent_balance', lease_id=F('lease_id')) or 0)"
      - site_rent: "float(CFIELD('lease', 'monthly_site_rent', lease_id=F('lease_id')) or 0)"
      - late_cap: "float(CPARAM('lease', 'late_fee_maximum', lease_id=F('lease_id')) or 0)"
      - horizon_rent: "RND(site_rent * 12 / 365 * horizon)"
      - lease_amount: "RND(rent_balance + horizon_rent + late_cap) if (lease_status == 'in_default' and rent_balance > 0) else (RND(rent_balance + horizon_rent) if ((lease_status == 'active' or lease_status == 'notice_to_vacate') and rent_balance > 0) else MX(0, rent_balance))"
      - charges: "SUM('resale_ledger', 'amount', event_type='resale_fee_charge')"
      - payments: "SUM('resale_ledger', 'amount', event_type='resale_fee_payment')"
      - credits: "SUM('resale_ledger', 'amount', event_type='resale_fee_credit')"
      - deductions: "SUM('resale_ledger', 'amount', event_type='resale_proceeds_deduction')"
      - fees_owed: "RND(MX(0, charges - payments - credits - deductions))"
      - closing_deductions: "(fees_owed if P('fees_deducted_from_proceeds') else 0) + (P('transaction_fee') if P('commission_pct') > 0 else 0) + P('closing_fee') + (lease_amount if P('seller_arrears_paid_from_proceeds') else 0) + payoff"
      - by_rate: "closing_deductions / (1 - comm_pct / 100)"
      - by_minimum: "closing_deductions + (P('minimum_commission') if P('commission_pct') > 0 else 0)"
      - floor_exact: "MX(by_rate, by_minimum)"
      - result: "(int(floor_exact / K('price_step')) + (1 if floor_exact > int(floor_exact / K('price_step')) * K('price_step') else 0)) * K('price_step')"
    compute_basis:
      move_in: "The loyalty reduction follows the seller's tenure on the site lease and the home's financing"
      tenure_months: "The seller's tenure is counted in whole calendar months from the move-in date on the seller's site lease to the handling date, whatever term is running."
      hhf_open: "whose home carries an open Hearthstone Home Finance loan"
      rate_cut: "a seller whose lease began long_tenure_months or more whole calendar months ago and whose home carries an open Hearthstone Home Finance loan has long_tenure_cut percentage points taken off, a seller whose lease began at least mid_tenure_months but fewer than long_tenure_months whole calendar months ago and whose home carries an open Hearthstone Home Finance loan has mid_tenure_cut percentage points taken off, and any other seller has none."
      comm_pct: "the loyalty commission rate, being the package's commission_pct less the loyalty reduction"
      community: "the seasonal market days follow the community on the seller's site lease and the month of the handling date"
      month_now: "the seasonal market days follow the community on the seller's site lease and the month of the handling date"
      season_days: "Cedar Hollow or Conestoga Meadows in one of the package's winterization_months add northern_winter_days, Willow Bend Estates, Palmetto Shores or Saguaro Vista in one of the sunbelt_summer_months add sunbelt_summer_days, and any other community or month adds none."
      horizon: "The closing horizon is the package's buyer_application_deadline_days plus its closing_deadline_days plus the seasonal market days"
      stmt_good: "for an open (active or delinquent) Hearthstone Home Finance loan on the home, a payoff statement on that loan whose good-through date is the handling date or later supplies its payoff amount"
      stmt_amount: "for an open (active or delinquent) Hearthstone Home Finance loan on the home, a payoff statement on that loan whose good-through date is the handling date or later supplies its payoff amount"
      principal: "the unpaid principal of a Hearthstone Home Finance loan on the home"
      note_rate: "plus interest at the note rate on the unpaid principal for the days of the closing horizon on an actual-over-365 basis"
      loan_fees: "the open loan is projected as its unpaid principal plus fees owed on the loan less suspense funds"
      loan_suspense: "the open loan is projected as its unpaid principal plus fees owed on the loan less suspense funds"
      payoff: "The Hearthstone payoff figure is chosen in this order: for an open (active or delinquent) Hearthstone Home Finance loan on the home, a payoff statement on that loan whose good-through date is the handling date or later supplies its payoff amount; failing such a statement, the open loan is projected as its unpaid principal plus fees owed on the loan less suspense funds plus interest at the note rate on the unpaid principal for the days of the closing horizon on an actual-over-365 basis, that interest and the projection each rounded half up to the cent; a home with no open Hearthstone loan takes the unpaid principal of its loan, which is zero once paid off, whatever payoff statement remains on file."
      lease_status: "The site-lease amount follows the lease's status and balance, rent staying due on the lease until the sale closes"
      rent_balance: "The site-lease amount follows the lease's status and balance, rent staying due on the lease until the sale closes"
      site_rent: "the horizon rent is the contracted monthly site rent times twelve divided by 365 times the days of the closing horizon, rounded half up to the cent."
      late_cap: "a lease in default with a balance owed takes the balance plus the horizon rent plus the lot class's late_fee_maximum"
      horizon_rent: "the horizon rent is the contracted monthly site rent times twelve divided by 365 times the days of the closing horizon, rounded half up to the cent."
      lease_amount: "a lease in default with a balance owed takes the balance plus the horizon rent plus the lot class's late_fee_maximum; an active lease or a lease under notice to vacate with a balance owed takes the balance plus the horizon rent; any other lease takes its past-due balance as it stands, never below zero"
      charges: "The fees owed on the file are every charge on it less every payment, credit and proceeds deduction on it, never less than zero."
      payments: "The fees owed on the file are every charge on it less every payment, credit and proceeds deduction on it, never less than zero."
      credits: "The fees owed on the file are every charge on it less every payment, credit and proceeds deduction on it, never less than zero."
      deductions: "The fees owed on the file are every charge on it less every payment, credit and proceeds deduction on it, never less than zero."
      fees_owed: "The fees owed on the file are every charge on it less every payment, credit and proceeds deduction on it, never less than zero."
      closing_deductions: "the closing deductions are the fees owed where the package deducts fees from the proceeds, plus the transaction fee where the package has one, plus the closing fee, plus the site-lease amount where the package pays the seller's past-due site-lease balance from the proceeds, plus the Hearthstone payoff figure"
      by_rate: "that total is divided by one less the loyalty commission rate as a fraction"
      by_minimum: "and, separately, increased by the package's minimum_commission where the package charges commission"
      floor_exact: "the larger of the two is rounded up to the next whole multiple of price_step dollars."
      result: "the larger of the two is rounded up to the next whole multiple of price_step dollars."
    factors:
      - id: price_loyalty_reduction
        effect: parameter
        decides: rate_cut
        bindings: [move_in, tenure_months, hhf_open, rate_cut]
        ladder:
          - when: "the seller's lease began long_tenure_months or more whole months ago and the home carries an open Hearthstone Home Finance loan"
            value: "K('long_tenure_cut')"
          - when: "the lease began at least mid_tenure_months but fewer than long_tenure_months whole months ago and the home carries an open Hearthstone Home Finance loan"
            value: "K('mid_tenure_cut')"
          - when: "otherwise"
            value: "0"
        baseline:
          rate_cut: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: price_seasonal_market_days
        effect: parameter
        decides: season_days
        bindings: [community, month_now, season_days]
        ladder:
          - when: "the site lease places the home at Cedar Hollow or Conestoga Meadows and the handling month is one of the winterization_months"
            value: "K('northern_winter_days')"
          - when: "the site lease places the home at Willow Bend Estates, Palmetto Shores or Saguaro Vista and the handling month is one of the sunbelt_summer_months"
            value: "K('sunbelt_summer_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          season_days: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: price_payoff_figure
        effect: method
        decides: payoff
        bindings: [stmt_good, stmt_amount, note_rate, loan_fees, loan_suspense, payoff]
        ladder:
          - when: "the home carries an open (active or delinquent) Hearthstone Home Finance loan with a payoff statement good through the handling date or later"
            method: "the statement's payoff amount is used"
          - when: "the home carries an open Hearthstone Home Finance loan with no payoff statement good through the handling date"
            method: "the payoff is projected: unpaid principal plus loan fees less suspense plus note-rate interest on the principal for the closing horizon days, actual over 365"
          - when: "otherwise (no open Hearthstone loan, whatever payoff statement remains on file)"
            method: "the loan's unpaid principal as it stands"
        baseline:
          payoff: "principal"
        evidence: [cross_category, history, date]
        cross_difficulty: loan
      - id: price_site_lease_amount
        effect: method
        decides: lease_amount
        bindings: [lease_status, rent_balance, site_rent, late_cap, horizon_rent, lease_amount]
        ladder:
          - when: "the site lease is in default with a balance owed"
            method: "the balance plus the horizon rent plus the lot class's late_fee_maximum"
          - when: "the site lease is active or under notice to vacate with a balance owed"
            method: "the balance plus the horizon rent"
          - when: "otherwise"
            method: "the past-due balance as it stands, never below zero"
        baseline:
          lease_amount: "MX(0, rent_balance)"
        evidence: [cross_category]
        cross_difficulty: lease
    baseline:
      rule: >-
        The standard lowest closing price takes as the closing deductions the fees owed on the file where the package deducts fees from the proceeds, the package's transaction_fee where it has one, the package's closing_fee, the seller's past-due site-lease balance where the package pays it from the proceeds, and the unpaid principal of a Hearthstone Home Finance loan on the home; it then takes the larger of the closing deductions divided by one less the package's commission_pct as a fraction and the closing deductions plus the package's minimum_commission, and rounds that figure up to the next whole multiple of price_step dollars.
        The fees owed on the file are every charge on it less every payment, credit and proceeds deduction on it, never less than zero.
      params: [commission_pct, minimum_commission, transaction_fee, closing_fee, price_step]
    inputs:
      history:
        - {table: resale_ledger, aggregate: sum, field: amount, filters: {}}
        - {category: loan, table: loan_notices, aggregate: latest, field: payoff_amount, filters: {event_type: loan_payoff_statement}}
      cross_category: [lease, loan]
