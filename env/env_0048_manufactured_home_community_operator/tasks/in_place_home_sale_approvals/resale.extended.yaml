# In-Place Home Resale charter — Hearthstone Home Sales (licensed manufactured-home dealer/broker).
# A resident who owns their home and wants to sell it where it sits opens a resale file. Every file
# runs the community's pre-sale inspection and the buyer's residency approval; the higher packages
# add marketing, brokerage and, at the top, a guaranteed purchase.

category: resale
display_name: In-Place Home Resale

binding:
  holding_table: resale_listings
  event_tables: [resale_ledger, resale_records]
  intake_tables: [resale_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fees_balance: resale_fees_due}

lifecycle:
  states: [opened, listed, under_contract, closed_sold, withdrawn, expired]
  transitions:
    - {from: opened, to: listed, by: user, means: "The seller signs the listing agreement (or, on the approval service, the private-sale registration) and the home is on the market at the stated list price."}
    - {from: listed, to: under_contract, by: user, means: "The seller accepts a buyer's offer and signs the purchase agreement."}
    - {from: under_contract, to: listed, by: system, means: "The purchase agreement is cancelled (buyer denied residency, financing failed, buyer withdrew) and the home returns to the market."}
    - {from: under_contract, to: closed_sold, by: system, means: "The sale closes, title transfers to the approved buyer and proceeds are disbursed."}
    - {from: listed, to: closed_sold, by: user, means: "Under the guaranteed program the listing term ends unsold, the seller accepts Hearthstone's guaranteed purchase offer and Hearthstone buys the home at the guaranteed price."}
    - {from: opened, to: withdrawn, by: user, means: "The seller withdraws the file before the home is listed or under contract."}
    - {from: listed, to: withdrawn, by: user, means: "The seller takes the home off the market."}
    - {from: listed, to: expired, by: system, means: "The listing term, with any extensions, ends unsold (never on the approval service, which has no listing term)."}

accounts:
  - key: resale_fees_due
    unit: USD
    meaning: Amount the seller owes Hearthstone Home Sales on the resale file — service, inspection, extension, withdrawal, vacant-home, winterization, warranty, appraisal, transaction and closing fees and commission — less payments, credits and deductions from sale proceeds.

parameter_schema:
  flat_service_fee: Non-refundable package fee charged when the file is opened, USD (0.00 where the package is paid by commission).
  upfront_fee_due_days: Calendar days after an upfront fee is charged by which it is due, integer days.
  fees_deducted_from_proceeds: Whether fees still owed at closing are deducted from the seller's sale proceeds by Hearthstone Home Sales, boolean.
  listing_term_days: Length of the listing term from the listed date, integer days; not_applicable on the approval service, which has no listing.
  extension_term_days: Length of one listing extension, integer days; not_applicable where extensions are not offered.
  max_extensions: Number of extensions a listing may receive, integer.
  extension_fee: Fee for each listing extension, USD; not_applicable where extensions are not offered.
  commission_pct: Commission on the gross sale price, percent (0.0 where no commission is charged).
  minimum_commission: Smallest commission charged on a brokered sale, USD; not_applicable where no commission is charged.
  commission_basis: What the commission percentage is applied to — gross_sale_price (the contract price for the home, excluding any personal property itemized separately), enum.
  transaction_fee: Brokerage transaction fee charged at closing, USD; not_applicable on packages without brokerage.
  closing_fee: Document preparation and title-transfer processing fee charged at closing, USD.
  inspection_fee: Fee for the initial pre-sale community-standards inspection, USD.
  reinspection_fee: Fee for each re-inspection after required repairs, USD.
  included_reinspections: Number of re-inspections included in the package at no fee, integer.
  inspection_scheduling_business_days: Business days after the file is opened within which the initial inspection is performed, integer business days.
  inspection_standards: Items the pre-sale inspection checks against community standards, list.
  repair_completion_days: Calendar days after an inspection that requires repairs within which the repairs must be completed and re-inspected for the file to stay open on schedule, integer days.
  inspection_valid_days: Calendar days after a passed inspection during which it supports a buyer approval and closing, integer days.
  repair_coordination_available: Whether Hearthstone's service crew can be engaged to complete required repairs at cost plus markup, boolean.
  repair_coordination_markup_pct: Markup on contractor cost when Hearthstone coordinates repairs, percent; not_applicable where coordination is unavailable.
  inspection_fee_credited_at_closing: Whether the initial inspection fee is credited back to the seller at a brokered closing, boolean.
  withdrawal_fee: Fee for withdrawing a listed home before the free-withdrawal point, USD (0.00 where none).
  withdrawal_fee_free_after_days: Days after the listed date from which the seller may withdraw without a withdrawal fee, integer days; not_applicable where no withdrawal fee is charged.
  earnest_money_min_pct: Smallest earnest-money deposit a purchase agreement may carry, percent of the sale price; not_applicable on the approval service, where the parties set their own terms.
  forfeited_deposit_broker_share_pct: Share of earnest money forfeited by a defaulting buyer that Hearthstone Home Sales retains, the rest going to the seller, percent; not_applicable where Hearthstone holds no deposit.
  buyer_application_deadline_days: Calendar days after the purchase agreement date by which the buyer must submit a residency application for the site, integer days.
  financing_contingency_days: Calendar days after the purchase agreement date within which a financed buyer must obtain loan approval or the agreement may be cancelled, integer days.
  closing_deadline_days: Calendar days after the buyer's residency approval within which the sale must close, integer days.
  seller_arrears_paid_from_proceeds: Whether a seller's past-due site-lease balance may be paid from sale proceeds at closing, boolean.
  new_lease_required_for_buyer: Whether the buyer must sign a new site lease rather than assume the seller's, boolean.
  buyer_rent_basis: Monthly site rent the buyer's new lease starts at — current_lot_class_base_rent (the lot class's standard rent on the closing date, not the seller's rent), enum.
  removal_sales_covered: Whether a sale in which the buyer removes the home from the community is handled under the resale program, boolean.
  home_warranty_included: Whether a 12-month buyer home warranty is included in the package, boolean.
  home_warranty_price: Price of the optional 12-month buyer home warranty the seller may purchase, USD; not_applicable where included.
  vacant_home_check_included: Whether the monthly vacant-home check is included while the listed home is vacant, boolean.
  vacant_home_check_fee_monthly: Monthly charge for the required vacant-home check while the home stands vacant, USD per month (0.00 where included).
  winterization_fee: Fee to winterize a vacant home at a community with freezing winters (Cedar Hollow, Conestoga Meadows), USD per winter.
  winterization_months: Calendar months during which a vacant home at those communities must be winterized, list of month numbers.
  guaranteed_purchase_available: Whether Hearthstone guarantees to buy the home if it does not sell within the listing term, boolean.
  guaranteed_purchase_pct_of_appraisal: Guaranteed purchase price as a percentage of the appraised value, percent; not_applicable where no guarantee is offered.
  appraisal_fee: Fee for the independent appraisal that sets the guaranteed price, USD; not_applicable where no guarantee is offered.
  appraisal_valid_days: Calendar days an appraisal remains valid for the guaranteed price, integer days; not_applicable where no guarantee is offered.
  list_price_max_pct_of_appraisal: Highest list price permitted under the guarantee, percent of appraised value; not_applicable where no guarantee is offered.
  guaranteed_purchase_closing_days: Calendar days after the listing term ends within which Hearthstone closes the guaranteed purchase, integer days; not_applicable where no guarantee is offered.
  commission_waived_on_guaranteed_purchase: Whether no commission is charged when Hearthstone itself buys the home under the guarantee, boolean.
  accepted_payment_channels: Channels through which the seller may pay fees billed upfront, list of channel codes.
  amount_rounding: Rounding applied to every computed charge and credit — half_up_to_cent, enum.

