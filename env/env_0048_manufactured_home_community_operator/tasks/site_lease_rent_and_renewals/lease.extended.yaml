# Home-Site Lease charter — Hearthstone Communities.
# A resident leases the land (the home site) beneath a manufactured home they own; the lease is
# priced by lot class, billed monthly on the 1st, and renewed, raised, noticed and closed as below.

category: lease
display_name: Home-Site Lease

binding:
  holding_table: lease_holdings
  event_tables: [lease_ledger, lease_notices]
  intake_tables: [lease_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {rent_balance: rent_receivable, security_deposit_balance: security_deposit}

lifecycle:
  states: [applied, approved, active, notice_to_vacate, in_default, closed, denied]
  transitions:
    - {from: applied, to: approved, by: system, means: "The community office approves the residency application after the background, income and home-eligibility review."}
    - {from: applied, to: denied, by: system, means: "The community office declines the residency application."}
    - {from: applied, to: closed, by: user, means: "The applicant withdraws the residency application before a decision."}
    - {from: approved, to: closed, by: user, means: "The approved applicant declines to sign the lease and withdraws."}
    - {from: approved, to: active, by: user, means: "The resident signs the lease and the home is placed or occupied on the site; rent begins on the move-in date."}
    - {from: active, to: notice_to_vacate, by: user, means: "The resident gives written notice to vacate the site on a stated date."}
    - {from: notice_to_vacate, to: active, by: user, means: "The resident withdraws a notice to vacate before the vacate date and the community accepts the withdrawal."}
    - {from: notice_to_vacate, to: closed, by: system, means: "The lease ends while a notice to vacate is pending — the site is surrendered on the vacate date, or the home is sold in place and the seller's lease ends at the sale closing."}
    - {from: active, to: in_default, by: system, means: "The cure deadline on a written nonpayment notice passes without the demanded amount being paid in full."}
    - {from: in_default, to: active, by: system, means: "The resident pays every amount past due and the community reinstates the lease."}
    - {from: in_default, to: closed, by: system, means: "The lease is terminated for nonpayment through the legal process and possession returns to the community."}
    - {from: active, to: closed, by: system, means: "The home is sold in place, the buyer's own lease begins and the seller's lease ends at the sale closing."}

accounts:
  - key: rent_receivable
    unit: USD
    meaning: Amount the resident owes on the site-lease ledger — site rent, occupant charges, application fee, late fees, returned-payment fees and early-termination fees, less payments, credits, waivers and deposit applications.
  - key: security_deposit
    unit: USD
    meaning: Security deposit the community holds for the lease, collected at move-in and disposed of (applied to the balance or refunded) after the lease ends.

parameter_schema:
  base_monthly_site_rent: Standard monthly site rent for a new move-in on a twelve-month term at this lot class, USD to the cent.
  month_to_month_available: Whether a month-to-month term may be chosen or held on this lot class, boolean.
  month_to_month_premium_monthly: Amount added to the twelve-month rent when the lease runs month to month, USD per month; not_applicable where month-to-month is unavailable.
  twelve_month_term_available: Whether a twelve-month term may be chosen on this lot class, boolean.
  twenty_four_month_term_available: Whether a twenty-four-month term may be chosen on this lot class, boolean.
  twenty_four_month_rent_discount_monthly: Monthly reduction from the twelve-month rent for a twenty-four-month term, USD per month; not_applicable where the term is unavailable.
  security_deposit_months: Security deposit expressed as a multiple of the contracted monthly site rent, number of months (decimal).
  application_fee_per_adult: Non-refundable residency application (background screening) fee charged per adult applicant aged 18 or over, USD.
  included_adult_occupants: Number of adult occupants covered by the site rent without an occupant charge, integer.
  additional_adult_occupant_fee_monthly: Monthly charge for each registered adult occupant beyond the included number, USD per adult per month.
  max_total_occupants: Maximum number of persons of any age who may occupy the home on this lot class, integer.
  rent_due_day: Calendar day of the month on which the site rent for that month is due, integer day of month.
  late_fee_grace_days: Calendar days after the due day during which rent may be paid without a late fee, integer days.
  late_fee_pct_of_unpaid_rent: Late fee as a percentage of the site rent and occupant charges for the billing period still unpaid at the end of the grace period, percent.
  late_fee_minimum: Floor of the late fee for one billing period, USD.
  late_fee_maximum: Cap of the late fee for one billing period, USD.
  courtesy_late_fee_waivers_per_12_months: Number of late fees that may be waived as a courtesy in any trailing 12-month window, integer.
  courtesy_waiver_min_tenure_months: Full months of tenancy since the move-in date required before a courtesy late-fee waiver may be granted, integer months.
  nsf_fee_amount: Fee charged when a payment is returned unpaid for insufficient funds, a closed account or a stop-payment order, USD per returned payment.
  returned_payments_for_certified_funds: Count of returned payments within the lookback window that places the lease on certified-funds-only status, integer.
  returned_payment_lookback_months: Length of the trailing window over which returned payments are counted, integer months.
  certified_funds_restriction_months: Length of a certified-funds-only restriction, counted from the date of the returned payment that triggered it, integer months.
  autopay_discount_monthly: Monthly credit against site rent while the lease is enrolled in automatic ACH payment, USD per month.
  autopay_enrollment_cutoff_days: Calendar days before the due day by which autopay enrollment must be completed for the discount to apply to that month, integer days.
  autopay_discount_suspension_months: Number of billing periods for which the autopay discount is withheld after an autopay draft is returned, integer months.
  accepted_payment_channels: Payment channels accepted on this lot class when no restriction applies, list of channel codes.
  certified_funds_channels: Payment channels still accepted while the lease is on certified-funds-only status, list of channel codes.
  partial_payment_accepted_before_notice: Whether a payment smaller than the balance due is accepted before a nonpayment notice has been served, boolean.
  partial_payment_accepted_after_nonpayment_notice: Whether a payment smaller than the amount demanded is accepted after a nonpayment notice has been served and before it is cured, boolean.
  payment_application_order: Order in which a payment is applied across open charges, ordered list of charge groups.
  renewal_offer_lead_days: Calendar days before the current term end date on which the renewal offer is issued, integer days.
  renewal_response_days: Calendar days after the renewal offer date by which the resident must sign the renewal (the offer's response deadline), integer days.
  renewal_increase_pct_twelve_month: Rent increase applied to the twelve-month-equivalent rent when a twelve-month renewal term begins, percent.
  renewal_increase_pct_twenty_four_month: Rent increase applied to the twelve-month-equivalent rent when a twenty-four-month renewal term begins (rent then fixed for the full term), percent; not_applicable where that term is unavailable.
  holdover_basis: What a fixed term becomes when it ends with no renewal signed — month_to_month (converts at the month-to-month premium) or automatic_twelve_month_renewal (renews for twelve months at the twelve-month renewal increase), enum.
  month_to_month_increase_cap_pct: Largest increase one rent-increase notice may apply to a month-to-month lease, percent of the current monthly site rent; not_applicable where month-to-month is unavailable.
  max_rent_increases_per_12_months: Maximum number of rent increases that may take effect on one lease in any trailing 12-month window, integer.
  notice_to_vacate_days: Minimum calendar days between the date the community receives a written notice to vacate and the stated vacate date, integer days.
  early_termination_fee_months: Fee for vacating before the end of a fixed term, as a multiple of the contracted monthly site rent, number of months (decimal).
  early_termination_waived_on_approved_home_sale: Whether the early-termination fee is waived when the lease ends because the home is sold in place to an approved buyer, boolean.
  early_termination_waived_military_orders: Whether the early-termination fee is waived for a resident vacating under qualifying military orders, boolean.
  move_in_concession_pct_first_full_month: Concession on the first full month of site rent for a new twelve- or twenty-four-month lease, percent of that month's site rent (0.0 means no concession).
  nonpayment_notice_days_past_due: Calendar days after the due day after which a nonpayment notice is served when the rent for that period remains unpaid, integer days.
  deposit_refund_days_no_deductions: Calendar days after the lease closes within which the full deposit is refunded when no deduction is taken, integer days.
  deposit_claim_notice_days: Calendar days after the lease closes within which the itemized deposit claim is issued and any remainder refunded when a deduction is taken, integer days.
  rent_proration_basis: How a partial month of site rent is prorated — actual_days_in_month means monthly rent divided by the days in that calendar month times the days occupied, enum.
  amount_rounding: Rounding applied to every computed charge, credit and fee — half_up_to_cent, enum.
  payment_plan_min_tenure_months: Full months of tenancy since the move-in date required before a repayment agreement may be offered, integer months.
  payment_plan_max_installments: Maximum number of monthly installments in a repayment agreement, integer.
  payment_plan_min_down_pct: Share of the past-due balance that must be paid on the day a repayment agreement is signed, percent.
  payment_plans_per_12_months: Maximum number of repayment agreements that may be signed in any trailing 12-month window, integer.
  payment_plan_max_arrears_months_rent: Largest past-due balance a repayment agreement may cover, as a multiple of the contracted monthly site rent, number of months (decimal).

