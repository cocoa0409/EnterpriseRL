      renewal_increase_pct_twenty_four_month: 4.9
      holdover_basis: automatic_twelve_month_renewal
      month_to_month_increase_cap_pct: not_applicable
      max_rent_increases_per_12_months: 1
      notice_to_vacate_days: 60
      early_termination_fee_months: 2.0
      early_termination_waived_on_approved_home_sale: true
      early_termination_waived_military_orders: true
      move_in_concession_pct_first_full_month: 0.0
      nonpayment_notice_days_past_due: 10
      deposit_refund_days_no_deductions: 15
      deposit_claim_notice_days: 30
      rent_proration_basis: actual_days_in_month
      amount_rounding: half_up_to_cent
      payment_plan_min_tenure_months: 6
      payment_plan_max_installments: 3
      payment_plan_min_down_pct: 25.0
      payment_plans_per_12_months: 1
      payment_plan_max_arrears_months_rent: 2.0

events:
  # ---- holding writes: residency application through lease end ----
  - type: lease_application
    target: lease_holdings
    mutation: create
    meaning: A prospective resident applies for residency and a site lease on a named site, describing the home that will occupy it.
    grain: One row per residency application for one site.
    fields:
      customer_id: The applicant (the leaseholder of record once signed).
      variant_name: Official lot class of the site applied for.
      community_name: Community in which the site lies.
      site_number: Site number as posted on the community plat (for example B-114).
      home_section_type: Section type of the home that will occupy the site, from its title or data plate.
      home_model_year: Model year of that home, from its title or data plate.
      home_length_ft: Overall length of that home in feet, from its data plate.
      adult_occupant_count: Adults aged 18 or over who will live in the home, each screened with the application.
      total_occupant_count: All persons of any age who will live in the home.
      lease_term_type: Term the applicant requests.
      application_date: Date the application was submitted.
    triggers:
      - event: lease:lease_application_fee
        map: {lease_id: lease_id, entry_date: application_date}
  - type: lease_approval
    target: lease_holdings
    mutation: {transition: {from: applied, to: approved}}
    meaning: The community office approves the residency application.
    grain: One row per transaction.
    fields:
      status: Set to approved.
    triggers: []
  - type: lease_denial
    target: lease_holdings
    mutation: {transition: {from: applied, to: denied}}
    meaning: The community office declines the residency application.
    grain: One row per transaction.
    fields:
      status: Set to denied.
      closed_date: Date of the decision.
    triggers: []
  - type: lease_application_withdrawal
    target: lease_holdings
    mutation: {transition: [{from: applied, to: closed}, {from: approved, to: closed}]}
    meaning: The applicant withdraws before a decision, or declines to sign after approval.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Date the withdrawal was received.
    triggers: []
  - type: lease_move_in
    target: lease_holdings
    mutation: {transition: {from: approved, to: active}}
    meaning: The approved resident signs the lease and takes possession of the site; site rent starts on the move-in date.
    grain: One row per transaction.
    fields:
      status: Set to active.
      move_in_date: Date possession begins and rent starts.
      lease_term_type: Term signed.
      term_start_date: First day of the signed term (the move-in date).
      term_end_date: Last day of a fixed term; empty for month to month.
      monthly_site_rent: Contracted monthly site rent for the signed term.
      autopay_enrolled: Whether automatic ACH payment was set up at signing.
    triggers:
      - event: lease:lease_deposit_receipt
        map: {entry_date: move_in_date}
      - event: lease:lease_rent_charge
        map: {entry_date: move_in_date}
      - event: utility:utility_account_open
        map: {lease_id: lease_id, customer_id: customer_id, service_start_date: move_in_date}
      - event: rules:rules_plan_enrollment
        map: {lease_id: lease_id, customer_id: customer_id, plan_start_date: move_in_date, last_plan_change_date: move_in_date}
  - type: lease_renewal
    target: lease_holdings
    mutation: update
    meaning: A new lease term begins under a signed renewal, or under the holdover basis when no renewal was signed.
    grain: One row per transaction.
    fields:
      lease_term_type: Term now running.
      term_start_date: First day of the new term (the day after the prior term end date).
      term_end_date: Last day of the new fixed term; empty when the lease converted to month to month.
      monthly_site_rent: Contracted monthly site rent for the new term.
    triggers: []
  - type: lease_rent_increase
    target: lease_holdings
    mutation: update
    meaning: A noticed rent increase on a month-to-month lease takes effect.
    grain: One row per transaction.
    fields:
      monthly_site_rent: New contracted monthly site rent.
    triggers: []
  - type: lease_autopay_change
    target: lease_holdings
    mutation: update
    meaning: The resident enrolls in or cancels automatic ACH payment of site rent.
    grain: One row per transaction.
    fields:
      autopay_enrolled: New enrollment state.
    triggers: []
  - type: lease_payment_restriction_change
    target: lease_holdings
    mutation: update
    meaning: The lease is placed on, or released from, certified-funds-only payment status.
    grain: One row per transaction.
    fields:
      payment_restriction: New restriction state.
      certified_funds_until: Last day of the restriction; empty when released.
    triggers: []
  - type: lease_occupant_change
    target: lease_holdings
    mutation: update
    meaning: A screened occupant is added to, or a departed occupant removed from, the lease's registered household.
    grain: One row per transaction.
    fields:
      adult_occupant_count: Registered adult occupants after the change.
      total_occupant_count: Registered occupants of any age after the change.
    triggers: []
  - type: lease_notice_to_vacate
    target: lease_holdings
    mutation: {transition: {from: active, to: notice_to_vacate}}
    meaning: The resident gives written notice to vacate the site on a stated date.
    grain: One row per transaction.
    fields:
      status: Set to notice_to_vacate.
      vacate_date: Vacate date stated in the written notice.
    triggers:
      - event: utility:utility_final_read_order
        map: {service_end_date: vacate_date}
  - type: lease_notice_rescission
    target: lease_holdings
    mutation: {transition: {from: notice_to_vacate, to: active}}
    meaning: The resident's withdrawal of a pending notice to vacate is accepted and the lease continues.
    grain: One row per transaction.
    fields:
      status: Set to active.
      vacate_date: Cleared.
    triggers:
      - event: utility:utility_final_read_cancel
  - type: lease_move_out
    target: lease_holdings
    mutation: {transition: {from: notice_to_vacate, to: closed}}
    meaning: The site is surrendered on the vacate date and the lease ends.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Date the site was surrendered.
    triggers:
      - event: lease:lease_deposit_disposition
      - event: rules:rules_plan_end
        map: {plan_end_date: closed_date}
  - type: lease_default
    target: lease_holdings
    mutation: {transition: {from: active, to: in_default}}
    meaning: The cure deadline on a nonpayment notice passed without the demanded amount being paid in full.
    grain: One row per transaction.
    fields:
      status: Set to in_default.
    triggers: []
  - type: lease_default_cure
    target: lease_holdings
    mutation: {transition: {from: in_default, to: active}}
    meaning: Every amount past due is paid and the lease is reinstated.
    grain: One row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: lease_termination
    target: lease_holdings
    mutation: {transition: {from: in_default, to: closed}}
    meaning: The lease is terminated for nonpayment through the legal process.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Date possession returned to the community.
    triggers:
      - event: lease:lease_deposit_disposition
      - event: rules:rules_plan_end
        map: {plan_end_date: closed_date}
      - event: utility:utility_final_read_order
        map: {service_end_date: closed_date}
  - type: lease_sale_closeout
    target: lease_holdings
    mutation: {transition: [{from: active, to: closed}, {from: notice_to_vacate, to: closed}]}
    meaning: The home is sold in place to an approved buyer and the seller's lease ends at the sale closing.
    grain: One row per transaction.
    fields:
      status: Set to closed.
      closed_date: Sale closing date.
    triggers:
      - event: lease:lease_deposit_disposition
      - event: rules:rules_plan_end
        map: {plan_end_date: closed_date}
      - event: utility:utility_final_read_order
        map: {service_end_date: closed_date}

  # ---- ledger writes: charges, payments, credits, waivers, deposit ----
  - type: lease_application_fee
    target: lease_ledger
    meaning: The residency application (background screening) fee is charged.
    grain: One row per residency application.
    distinguish_by: [entry_date]
    fields:
      lease_id: The application's lease record.
      entry_date: Application date.
      amount: Fee charged, positive.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_rent_charge
    target: lease_ledger
    meaning: Site rent for one billing period is charged — a full month on the rent due day, or a prorated partial month at move-in or at lease end.
    grain: One row per lease per billing period.
    distinguish_by: [billing_period]
    fields:
      lease_id: Lease charged.
      billing_period: Calendar month charged, YYYY-MM.
      entry_date: Due date of the charge — the rent due day of a full month, or the move-in date for a move-in month.
      days_billed: Days of occupancy charged in the period.
      days_in_period: Calendar days in that month.
      amount: Rent charged, positive.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_occupant_charge
    target: lease_ledger
    meaning: The monthly charge for registered adult occupants beyond those included in the site rent is posted for one billing period.
    grain: One row per lease per billing period.
    distinguish_by: [billing_period]
    fields:
      lease_id: Lease charged.
      billing_period: Calendar month charged, YYYY-MM.
      entry_date: Due date, the same as that period's rent charge.
      days_billed: Days of occupancy charged in the period.
      days_in_period: Calendar days in that month.
      amount: Charge, positive.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_late_fee
    target: lease_ledger
    meaning: A late fee is charged on a billing period's rent and occupant charges left unpaid past the grace period.
    grain: One row per lease per billing period.
    distinguish_by: [billing_period]
    fields:
      lease_id: Lease charged.
      billing_period: Billing period whose rent was late.
      entry_date: Date the fee was posted.
      source_entry_id: The rent charge of that period.
      amount: Fee charged, positive.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_payment
    target: lease_ledger
    meaning: A payment toward the lease ledger is received.
    grain: One row per payment instrument or electronic transaction.
    distinguish_by: [payment_ref]
    fields:
      lease_id: Lease credited.
      entry_date: Date the payment was received.
      amount: Payment amount, positive.
      payment_channel: Channel the payment arrived through.
      payment_ref: Reference printed on the payment — the money-order or check serial number, or the processor confirmation number for an electronic payment.
    account: rent_receivable
    direction: out
    triggers: []
  - type: lease_payment_return
    target: lease_ledger
    meaning: A previously posted payment is returned unpaid by the bank and its amount is charged back to the ledger.
    grain: One row per returned payment.
    distinguish_by: [source_entry_id]
    fields:
      lease_id: Lease charged back.
      entry_date: Date the return was received.
      source_entry_id: The payment returned.
      return_reason: Bank's return reason.
      amount: Amount charged back, positive (the returned payment's amount).
    account: rent_receivable
    direction: in
    triggers:
      - event: lease:lease_nsf_fee
        when: {return_reason: [insufficient_funds, account_closed, stop_payment, invalid_account]}
        map: {source_entry_id: source_entry_id, entry_date: entry_date}
  - type: lease_nsf_fee
    target: lease_ledger
    meaning: The returned-payment fee is charged for a payment returned for a fee-bearing reason.
    grain: One row per returned payment.
    distinguish_by: [source_entry_id]
    fields:
      lease_id: Lease charged.
      entry_date: Date the return was received.
      source_entry_id: The payment returned.
      amount: Fee charged, positive.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_rent_credit
    target: lease_ledger
    meaning: A credit against one billing period's rent is posted — the autopay discount, the move-in concession, or a billing correction.
    grain: One row per lease per billing period per credit reason.
    distinguish_by: [billing_period, credit_reason]
    fields:
      lease_id: Lease credited.
      billing_period: Billing period credited.
      entry_date: Date the credit was posted.
      credit_reason: Reason for the credit.
      source_entry_id: The rent charge credited.
      amount: Credit, positive.
    account: rent_receivable
    direction: out
    triggers: []
  - type: lease_fee_waiver
    target: lease_ledger
    meaning: A late fee or returned-payment fee is waived in full.
    grain: One row per fee waived.
    distinguish_by: [source_entry_id]
    fields:
      lease_id: Lease credited.
      entry_date: Date the waiver was posted.
      source_entry_id: The fee waived.
      waiver_basis: Basis on which the fee is waived.
      amount: Amount waived, positive (the full fee).
    account: rent_receivable
    direction: out
    triggers: []
  - type: lease_early_termination_fee
    target: lease_ledger
    meaning: The early-termination fee is charged on a fixed-term lease that ends before its term end date.
    grain: One row per lease ending.
    distinguish_by: [entry_date]
    fields:
      lease_id: Lease charged.
      entry_date: The vacate date.
      amount: Fee charged, positive.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_deposit_receipt
    target: lease_ledger
    meaning: The security deposit is collected.
    grain: One row per deposit collection.
    distinguish_by: [entry_date]
    fields:
      lease_id: Lease secured.
      entry_date: Date collected (the move-in date).
      amount: Deposit collected, positive.
    account: security_deposit
    direction: in
    triggers: []
  - type: lease_deposit_disposition
    target: lease_ledger
    meaning: After the lease closes, all or part of the security deposit is applied to the remaining balance or refunded to the resident.
    grain: One row per lease per disposition kind.
    distinguish_by: [deposit_disposition]
    fields:
      lease_id: Lease closed.
      entry_date: Date of the disposition.
      deposit_disposition: Whether this part was applied to the balance or refunded.
      amount: Amount disposed of, positive.
    account: security_deposit
    direction: out
    triggers:
      - event: lease:lease_deposit_credit
        when: {deposit_disposition: applied_to_balance}
        map: {source_entry_id: lease_entry_id, entry_date: entry_date, amount: amount}
  - type: lease_deposit_credit
    target: lease_ledger
    meaning: The part of the deposit applied to the balance is credited to the lease ledger.
    grain: One row per deposit application.
    distinguish_by: [source_entry_id]
    fields:
      lease_id: Lease credited.
      entry_date: Date of the application.
      source_entry_id: The deposit disposition applied.
      amount: Credit, positive.
    account: rent_receivable
    direction: out
    triggers: []

  # ---- notices: documentary records the community issues or signs ----
  - type: lease_rent_increase_notice
    target: lease_notices
    meaning: The community issues written notice of a rent increase on a month-to-month lease.
    grain: One row per notice.
    distinguish_by: [effective_date]
    fields:
      lease_id: Lease noticed.
      notice_date: Date the notice was delivered.
      effective_date: First day of the billing period from which the new rent applies.
      new_monthly_site_rent: New contracted monthly site rent.
    triggers:
      - event: lease:lease_rent_increase
        map: {monthly_site_rent: new_monthly_site_rent}
  - type: lease_renewal_offer
    target: lease_notices
    meaning: The community issues the renewal offer for a fixed term approaching its end, one row per term offered.
    grain: One row per term offered per renewal cycle.
    distinguish_by: [effective_date, offered_term_type]
    fields:
      lease_id: Lease offered renewal.
      notice_date: Date the offer was delivered.
      effective_date: First day of the offered term (the day after the current term end date).
      response_deadline: Last day on which the renewal may be signed.
      offered_term_type: Term offered.
      new_monthly_site_rent: Monthly site rent offered for that term.
    triggers: []
  - type: lease_nonpayment_notice
    target: lease_notices
    meaning: The community serves written notice demanding payment of the past-due balance by a cure deadline.
    grain: One row per notice served.
    distinguish_by: [notice_date]
    fields:
      lease_id: Lease noticed.
      notice_date: Date the notice was served.
      response_deadline: Cure deadline.
      amount_demanded: Past-due balance demanded.
    triggers: []
  - type: lease_repayment_agreement
    target: lease_notices
    meaning: The resident signs a repayment agreement that spreads a past-due balance over monthly installments after a down payment.
    grain: One row per agreement signed.
    distinguish_by: [notice_date]
    fields:
      lease_id: Lease covered.
      notice_date: Date the agreement was signed.
      amount_demanded: Past-due balance covered by the agreement, before the down payment.
      installment_count: Number of monthly installments.
      installment_amount: Amount of each installment.
      effective_date: Due date of the first installment.
    triggers: []

measures:
  - id: lease_msr_returned_payments
    window: Trailing returned_payment_lookback_months calendar months ending on (and including) the entry date of the newest returned payment, counted month for month on the calendar.
    measure: Count of lease_payment_return rows on the lease whose return_reason is insufficient_funds, account_closed, stop_payment or invalid_account.
  - id: lease_msr_courtesy_waivers
    window: Trailing 12 calendar months ending on (and including) the handling date.
    measure: Count of lease_fee_waiver rows on the lease whose waiver_basis is courtesy, by entry_date.
  - id: lease_msr_rent_increases
    window: Trailing 12 calendar months ending on (and including) the proposed effective date of a new increase.
    measure: Count of lease_rent_increase_notice rows on the lease whose effective_date falls in the window, plus one when the current term (term_start_date) began in the window at a higher rent under a renewal offer or holdover (lease_renewal_offer rows whose effective_date equals term_start_date).
  - id: lease_msr_repayment_agreements
    window: Trailing 12 calendar months ending on (and including) the handling date.
    measure: Count of lease_repayment_agreement rows on the lease, by notice_date.
  - id: lease_msr_period_rent_unpaid
    window: One billing period, measured at the end of the last day of that period's grace period.
    measure: The lesser of (a) that period's lease_rent_charge plus lease_occupant_charge amounts less that period's lease_rent_credit amounts and (b) the rent_receivable balance (sum of all rent_receivable deltas with entry_date on or before the last grace day); never below zero.
  - id: lease_msr_tenure_months
    window: From the lease's move_in_date to the handling date.
    measure: Number of full calendar months elapsed since move_in_date (a month counts once the same day-of-month is reached; a move-in on the 31st completes a month on the last day of a shorter month).

policies:
  - id: lease_agg_multi_holding
    subject: [lease_application]
    rule: >-
      A home site is leased to the household that lives in the home on it, and a customer may hold only one home-site lease across all Hearthstone communities at a time.
      The applicant holds no other lease in applied, approved, active or in_default status.
      A lease in notice_to_vacate status does not count against the limit, so a resident relocating between sites may apply for the new site while the notice on the old one runs.
      A lease that is closed or denied never counts.
      An application that would breach the limit is not taken; the caller is told which lease already counts.
    eligibility:
      - id: single_open_lease
        applies_to: [lease_application]
        kind: dedup
        condition: The applicant holds no other lease in applied, approved, active or in_default status.
        evidence_fields: [lease_holdings.customer_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.customer_id]
          action_bindings:
            lease_holdings.customer_id: customer_id
        dedup_contract:
          table: lease_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, approved, active, in_default]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: lease_admission
    subject: [lease_application, lease_application_fee, lease_approval, lease_denial, lease_application_withdrawal]
    rule: >-
      A residency application names one site, whose lot class fixes the entry gate the home must meet.
      The home's section type, length and model year meet the entry gate of the lot class applied for.
      The home facts are taken from the title or data plate the applicant supplies and are recorded on the application exactly as shown there; a home that misses any one limit cannot be placed on that lot class and the applicant may instead apply for a site of a lot class whose gate it meets.
      The registered household may not exceed max_total_occupants persons of any age, and every adult aged 18 or over is listed and screened.
      The requested term must be one the lot class offers (month_to_month_available, twelve_month_term_available, twenty_four_month_term_available).
      The application fee equals application_fee_per_adult times the number of adults listed, is charged on the application date and is not refunded on denial or withdrawal.
      Approval or denial is decided by the community office after screening and is never made or promised by the resident desk; an applicant may withdraw at any time before signing.
    eligibility:
      - id: home_meets_lot_class_gate
        applies_to: [lease_application]
        kind: caller_fact
        condition: The home's section type, length and model year meet the entry gate of the lot class applied for.
        evidence_fields: [lease_holdings.variant_name, lease_holdings.site_number, lease_holdings.home_section_type, lease_holdings.home_length_ft, lease_holdings.home_model_year]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [lease_holdings.site_number]
          action_bindings:
            lease_holdings.site_number: site_number
    formula:
      application_fee: application_fee_per_adult * adult_occupant_count

  - id: lease_move_in_terms
    subject: [lease_move_in, lease_deposit_receipt]
    rule: >-
      Only an approved application may be signed into a lease, and signing is the resident's own act.
      The contracted monthly site rent at signing is the lot class's base_monthly_site_rent for a twelve-month term, that amount plus month_to_month_premium_monthly for a month-to-month term, or that amount less twenty_four_month_rent_discount_monthly for a twenty-four-month term.
      A fixed term starts on the move-in date and ends on the day before the same calendar date twelve or twenty-four months later; a month-to-month term has no end date.
      The security deposit equals security_deposit_months times the contracted monthly site rent and is collected on the move-in date.
      Autopay may be set up at signing, and the autopay discount then follows lease_evt_autopay.
    eligibility: []
    formula:
      monthly_site_rent: base_monthly_site_rent + month_to_month_premium_monthly if lease_term_type == "month_to_month" else (base_monthly_site_rent - twenty_four_month_rent_discount_monthly if lease_term_type == "twenty_four_month" else base_monthly_site_rent)
      deposit: round(security_deposit_months * monthly_site_rent, 2)

  - id: lease_evt_rent_billing
    subject: [lease_rent_charge, lease_occupant_charge, lease_rent_credit]
    rule: >-
      Site rent is charged for each calendar month on the rent_due_day of that month at the contracted monthly site rent on the lease that day.
      In the move-in month and in the month the lease ends the rent is prorated on the rent_proration_basis — the monthly rent divided by the calendar days in that month, times the days occupied, the move-in day and the last day of occupancy both counted — and rounded half up to the cent.
      For each registered adult beyond included_adult_occupants an occupant charge of additional_adult_occupant_fee_monthly is posted for the same period and prorated the same way; an occupant change takes effect from the next billing period.
      The move-in concession of move_in_concession_pct_first_full_month percent of the first full month's site rent is credited once, only on a twelve- or twenty-four-month lease, and never on occupant charges.
      Rent credits for a billing correction restore exactly the amount over-billed for that period and nothing else.
      Rent charges stop with the month the lease ends; no rent is charged for a month after the closed date.
      Rent and occupant charges are posted only while the lease is active, notice_to_vacate or in_default, and for the final prorated month of a lease that has just closed.
    eligibility:
      - id: lease_in_occupancy
        applies_to: [lease_rent_charge, lease_occupant_charge]
        kind: state
        condition: Rent and occupant charges are posted only while the lease is active, notice_to_vacate or in_default, and for the final prorated month of a lease that has just closed.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [active, notice_to_vacate, in_default, closed]
    formula:
      rent_amount: round(monthly_site_rent * days_billed / days_in_period, 2)
      occupant_amount: round(additional_adult_occupant_fee_monthly * max(adult_occupant_count - included_adult_occupants, 0) * days_billed / days_in_period, 2)
      concession_amount: round(move_in_concession_pct_first_full_month / 100 * monthly_site_rent, 2)

  - id: lease_evt_late_fee
    subject: [lease_late_fee]
    rule: >-
      A late fee may be assessed only after the grace period for that billing period has ended, counted from the due date of that billing period's rent charge.
      The grace period is counted in calendar days starting the day after the due date, so the fee may be posted no earlier than the calendar day after the due date plus late_fee_grace_days.
      The fee is late_fee_pct_of_unpaid_rent percent of the period's rent and occupant charges still unpaid at the end of the last grace day (lease_msr_period_rent_unpaid), raised to late_fee_minimum and capped at late_fee_maximum for the lot class, rounded half up to the cent.
      No late fee is charged when that unpaid amount is zero, none is charged on fees, deposits or prior late fees, and at most one late fee is charged per billing period.
      A payment counts as on time when its entry_date is on or before the last grace day, whatever the channel.
      No late fee is charged for a billing period covered by a repayment agreement whose installments are current.
    eligibility:
      - id: grace_period_ended
        applies_to: [lease_late_fee]
        kind: time
        condition: A late fee may be assessed only after the grace period for that billing period has ended, counted from the due date of that billing period's rent charge.
        evidence_fields: [lease_ledger.source_entry_id, lease_ledger.entry_date, lease_ledger.billing_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_ledger.source_entry_id]
          action_bindings:
            lease_ledger.source_entry_id: source_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the due date of that billing period's rent charge
          anchor_source: lease_ledger.entry_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date, so the fee may be posted no earlier than the calendar day after the due date plus late_fee_grace_days.
          boundary: exclusive
    params:
      per_tier:
        Standard Single-Section Home Site: {late_fee_maximum: =late_fee_maximum, late_fee_minimum: =late_fee_minimum}
        Preferred Single-Section Home Site: {late_fee_maximum: =late_fee_maximum, late_fee_minimum: =late_fee_minimum}
        Standard Multi-Section Home Site: {late_fee_maximum: =late_fee_maximum, late_fee_minimum: =late_fee_minimum}
        Preferred Multi-Section Home Site: {late_fee_maximum: =late_fee_maximum, late_fee_minimum: =late_fee_minimum}
        Greenbelt Multi-Section Home Site: {late_fee_maximum: =late_fee_maximum, late_fee_minimum: =late_fee_minimum}
        Lakefront Multi-Section Home Site: {late_fee_maximum: =late_fee_maximum, late_fee_minimum: =late_fee_minimum}
    formula:
      when_not: lease_msr_period_rent_unpaid <= 0
      late_fee: min(max(round(late_fee_pct_of_unpaid_rent / 100 * lease_msr_period_rent_unpaid, 2), late_fee_minimum), late_fee_maximum)
    measures: [lease_msr_period_rent_unpaid]

  - id: lease_evt_fee_waiver
    subject: [lease_fee_waiver]
    rule: >-
      A waiver always removes the whole fee it names, never part of it, and is posted against that one fee by its ledger reference.
      A fee that already carries a waiver is not waived again.
      A late fee is waived on the posting_error basis when a payment with an entry date on or before the last grace day covered that period's unpaid rent, and a late fee or returned-payment fee is waived on the bank_processing_error basis when it arose only from a payment the bank returned as bank_processing_error; these two bases have no count limit, tenure requirement or status requirement.
      A courtesy waiver applies to late fees only, never to returned-payment fees or early-termination fees.
      A courtesy waiver is granted only while the lease is active or notice_to_vacate.
      A courtesy waiver requires courtesy_waiver_min_tenure_months full calendar months of tenancy counted from the move-in date.
      Tenancy months are counted on the calendar from the move-in date, a month being complete when the same day-of-month is reached (or the last day of a shorter month), and the requirement is met on the day the last required month completes.
      A courtesy waiver is further limited to courtesy_late_fee_waivers_per_12_months in the trailing 12 months (lease_msr_courtesy_waivers), counting waivers already granted on the courtesy basis.
      An early-termination fee is waived on the military_orders basis when the resident supplies a copy of permanent-change-of-station or deployment orders of 90 days or more dated before the vacate date.
      When more than one basis fits the same fee, the waiver is recorded on the error basis (posting_error or bank_processing_error) so that the courtesy allowance is not consumed.
    eligibility:
      - id: fee_not_already_waived
        applies_to: [lease_fee_waiver]
        kind: dedup
        condition: A fee that already carries a waiver is not waived again.
        evidence_fields: [lease_ledger.source_entry_id, lease_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_ledger.source_entry_id]
          action_bindings:
            lease_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: lease_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [lease_fee_waiver]}
          distinct_fields: []
      - id: courtesy_lease_standing
        applies_to: [lease_fee_waiver]
        kind: state
        condition: A courtesy waiver is granted only while the lease is active or notice_to_vacate.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [active, notice_to_vacate]
      - id: courtesy_tenure
        applies_to: [lease_fee_waiver]
        kind: time
        condition: A courtesy waiver requires courtesy_waiver_min_tenure_months full calendar months of tenancy counted from the move-in date.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.move_in_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the move-in date
          anchor_source: lease_holdings.move_in_date
          relation: not_before
          duration_source: variants.courtesy_waiver_min_tenure_months
          unit: calendar_months
          counting_rule: Tenancy months are counted on the calendar from the move-in date, a month being complete when the same day-of-month is reached (or the last day of a shorter month), and the requirement is met on the day the last required month completes.
          boundary: inclusive
    formula:
      waiver_amount: amount
    measures: [lease_msr_courtesy_waivers, lease_msr_tenure_months]

  - id: lease_evt_returned_payment
    subject: [lease_payment_return, lease_nsf_fee, lease_payment_restriction_change]
    rule: >-
      A returned payment is charged back for exactly the amount of the payment returned, referenced to that payment.
      A payment is charged back only once.
      The returned-payment fee of nsf_fee_amount is charged when the return reason is insufficient_funds, account_closed, stop_payment or invalid_account, and never when it is bank_processing_error.
      When the returned payments counted by lease_msr_returned_payments reach returned_payments_for_certified_funds, the lease is placed on certified_funds_only status through the day before the same calendar date certified_funds_restriction_months later, counted from the entry date of the return that reached the count; autopay is cancelled at the same time because ACH debits are no longer accepted.
      The restriction lapses on its own after the certified_funds_until date and is released early only when it was imposed in error.
      A returned autopay draft also withholds the autopay discount for autopay_discount_suspension_months billing periods starting with the period of the returned draft.
    eligibility:
      - id: payment_not_already_returned
        applies_to: [lease_payment_return]
        kind: dedup
        condition: A payment is charged back only once.
        evidence_fields: [lease_ledger.source_entry_id, lease_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_ledger.source_entry_id]
          action_bindings:
            lease_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: lease_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [lease_payment_return]}
          distinct_fields: []
    formula:
      nsf_fee: nsf_fee_amount if return_reason in ["insufficient_funds", "account_closed", "stop_payment", "invalid_account"] else 0
      restricted: lease_msr_returned_payments >= returned_payments_for_certified_funds
    measures: [lease_msr_returned_payments]

  - id: lease_evt_payment_acceptance
    subject: [lease_payment]
    rule: >-
      Payments are accepted on a lease that is active, notice_to_vacate, in_default or closed with a balance still owing; nothing is accepted on an application.
      A payment arriving through a channel outside accepted_payment_channels is refused, except that a past-due balance paid from the proceeds of an in-place home sale is posted on the closing date through sale_closing_proceeds.
      While the lease is on certified_funds_only status and the payment date is on or before certified_funds_until, only a payment through one of the certified_funds_channels is accepted.
      Before a nonpayment notice is served a payment of any amount is accepted.
      After a nonpayment notice is served and until it is cured, a payment smaller than the amount demanded is refused, because partial_payment_accepted_after_nonpayment_notice is false.
      A payment is posted on the date it is received and applied in the payment_application_order — returned-payment fees, then late fees, then other fees, then the oldest rent and occupant charges first.
      An overpayment stays on the ledger as a credit balance against later charges and is refunded only with the deposit disposition after the lease closes.
    eligibility:
      - id: lease_accepts_payments
        applies_to: [lease_payment]
        kind: state
        condition: Payments are accepted on a lease that is active, notice_to_vacate, in_default or closed with a balance still owing; nothing is accepted on an application.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [active, notice_to_vacate, in_default, closed]
      - id: certified_funds_channel
        applies_to: [lease_payment]
        kind: authorization
        condition: While the lease is on certified_funds_only status and the payment date is on or before certified_funds_until, only a payment through one of the certified_funds_channels is accepted.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.payment_restriction, lease_holdings.certified_funds_until, lease_ledger.payment_channel]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id

  - id: lease_evt_autopay
    subject: [lease_autopay_change, lease_rent_credit]
    rule: >-
      Enrolling in or cancelling autopay is the resident's own authorization of ACH debits from their bank account and is recorded only on the resident's instruction.
      Autopay can be enrolled only while the lease is active or notice_to_vacate.
      Autopay cannot be enrolled while the lease is on certified_funds_only status.
      The autopay discount of autopay_discount_monthly is credited for a billing period only when the enrollment was completed at least autopay_enrollment_cutoff_days calendar days before that period's rent due day and the period's rent was drafted by autopay; an enrollment completed later first earns the discount in the following billing period.
      No autopay discount is credited for a prorated month, for any period inside an autopay_discount_suspension_months suspension after a returned autopay draft, or for a period in which autopay was cancelled before the draft.
      A cancellation takes effect on the day it is received.
    eligibility:
      - id: autopay_lease_open
        applies_to: [lease_autopay_change]
        kind: state
        condition: Autopay can be enrolled only while the lease is active or notice_to_vacate.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [active, notice_to_vacate]
      - id: autopay_not_restricted
        applies_to: [lease_autopay_change]
        kind: state
        condition: Autopay cannot be enrolled while the lease is on certified_funds_only status.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.payment_restriction]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.payment_restriction
          allowed: [none]
    params:
      per_tier:
        Standard Single-Section Home Site: {autopay_discount_monthly: =autopay_discount_monthly}
        Preferred Single-Section Home Site: {autopay_discount_monthly: =autopay_discount_monthly}
        Standard Multi-Section Home Site: {autopay_discount_monthly: =autopay_discount_monthly}
        Preferred Multi-Section Home Site: {autopay_discount_monthly: =autopay_discount_monthly}
        Greenbelt Multi-Section Home Site: {autopay_discount_monthly: =autopay_discount_monthly}
        Lakefront Multi-Section Home Site: {autopay_discount_monthly: =autopay_discount_monthly}
    formula:
      autopay_credit: autopay_discount_monthly

  - id: lease_renewal_terms
    subject: [lease_renewal_offer, lease_renewal]
    rule: >-
      Renewal applies only to a fixed term (twelve_month or twenty_four_month); a month-to-month lease runs on without renewal and changes rent only under lease_rent_increase_terms.
      A renewal is offered or signed only while the lease is active.
      The offer is issued renewal_offer_lead_days calendar days before the current term end date, with one offer row for each term the lot class makes available, each starting the day after the current term end date.
      The twelve-month-equivalent rent is the current monthly site rent, plus twenty_four_month_rent_discount_monthly when the current term is twenty_four_month.
      The twelve-month offer is that equivalent raised by renewal_increase_pct_twelve_month percent; the twenty-four-month offer is the equivalent raised by renewal_increase_pct_twenty_four_month percent less twenty_four_month_rent_discount_monthly; the month-to-month offer is the twelve-month offer plus month_to_month_premium_monthly; each is rounded half up to the cent.
      A renewal election is accepted only when the resident signs it no later than the response deadline, which falls renewal_response_days calendar days after the renewal offer date.
      The response window is counted in calendar days starting the day after the offer date, and the deadline day itself is still in time.
      Signing is the resident's own act; the resident desk records the election and the resident signs it.
      When the current term ends with no renewal signed, the holdover_basis of the lot class applies on the day after the term end date — month_to_month converts the lease to month to month at the month-to-month offer, and automatic_twelve_month_renewal renews it for twelve months at the twelve-month offer.
      A lease with a notice to vacate pending, or in default, is not renewed and does not hold over; it ends under the notice or the default process.
    eligibility:
      - id: renewal_lease_active
        applies_to: [lease_renewal_offer, lease_renewal]
        kind: state
        condition: A renewal is offered or signed only while the lease is active.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [active]
      - id: renewal_signed_in_time
        applies_to: [lease_renewal]
        kind: time
        condition: A renewal election is accepted only when the resident signs it no later than the response deadline, which falls renewal_response_days calendar days after the renewal offer date.
        evidence_fields: [lease_notices.lease_id, lease_notices.notice_date, lease_notices.response_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_notices.lease_id]
          action_bindings:
            lease_notices.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal offer date
          anchor_source: lease_notices.notice_date
          relation: not_after
          duration_source: variants.renewal_response_days
          unit: calendar_days
          counting_rule: The response window is counted in calendar days starting the day after the offer date, and the deadline day itself is still in time.
          boundary: inclusive
    params:
      per_tier:
        Standard Single-Section Home Site: {renewal_increase_pct_twelve_month: =renewal_increase_pct_twelve_month, renewal_increase_pct_twenty_four_month: =renewal_increase_pct_twenty_four_month, holdover_basis: =holdover_basis}
        Preferred Single-Section Home Site: {renewal_increase_pct_twelve_month: =renewal_increase_pct_twelve_month, renewal_increase_pct_twenty_four_month: =renewal_increase_pct_twenty_four_month, holdover_basis: =holdover_basis}
        Standard Multi-Section Home Site: {renewal_increase_pct_twelve_month: =renewal_increase_pct_twelve_month, renewal_increase_pct_twenty_four_month: =renewal_increase_pct_twenty_four_month, holdover_basis: =holdover_basis}
        Preferred Multi-Section Home Site: {renewal_increase_pct_twelve_month: =renewal_increase_pct_twelve_month, renewal_increase_pct_twenty_four_month: =renewal_increase_pct_twenty_four_month, holdover_basis: =holdover_basis}
        Greenbelt Multi-Section Home Site: {renewal_increase_pct_twelve_month: =renewal_increase_pct_twelve_month, renewal_increase_pct_twenty_four_month: =renewal_increase_pct_twenty_four_month, holdover_basis: =holdover_basis}
        Lakefront Multi-Section Home Site: {renewal_increase_pct_twelve_month: =renewal_increase_pct_twelve_month, renewal_increase_pct_twenty_four_month: =renewal_increase_pct_twenty_four_month, holdover_basis: =holdover_basis}
    formula:
      twelve_month_equivalent: monthly_site_rent + twenty_four_month_rent_discount_monthly if lease_term_type == "twenty_four_month" else monthly_site_rent
      offer_twelve_month: round(twelve_month_equivalent * (1 + renewal_increase_pct_twelve_month / 100), 2)
      offer_twenty_four_month: round(twelve_month_equivalent * (1 + renewal_increase_pct_twenty_four_month / 100), 2) - twenty_four_month_rent_discount_monthly
      offer_month_to_month: offer_twelve_month + month_to_month_premium_monthly

  - id: lease_rent_increase_terms
    subject: [lease_rent_increase_notice, lease_rent_increase]
    rule: >-
      Mid-term rent increases apply only to a month-to-month lease; a fixed-term lease changes rent only when a new term begins under lease_renewal_terms.
      A rent increase notice states the new rent and an effective date that is the first day of a billing period.
      A noticed rent increase may take effect no earlier than the community's required notice days counted from the rent increase notice date.
      The notice period is counted in calendar days starting the day after the notice date, and the increase may apply from the first billing period that begins on or after the last day of that period.
      The community's required notice days are those listed for it in rent_increase_notice_days.
      One notice may raise the rent by at most month_to_month_increase_cap_pct percent of the monthly site rent on the notice date, rounded half up to the cent.
      No more than max_rent_increases_per_12_months increases may take effect in the 12 months ending on the effective date (lease_msr_rent_increases); a notice that would exceed it is void and the rent stays unchanged.
      A notice that gives fewer days than required does not take effect on its stated date; it takes effect on the first billing period that begins on or after the end of the full notice period.
    eligibility:
      - id: increase_notice_period
        applies_to: [lease_rent_increase]
        kind: time
        condition: A noticed rent increase may take effect no earlier than the community's required notice days counted from the rent increase notice date.
        evidence_fields: [lease_notices.lease_id, lease_notices.notice_date, lease_holdings.community_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_notices.lease_id]
          action_bindings:
            lease_notices.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rent increase notice date
          anchor_source: lease_notices.notice_date
          relation: not_before
          duration_source: params.rent_increase_notice_days
          unit: calendar_days
          counting_rule: The notice period is counted in calendar days starting the day after the notice date, and the increase may apply from the first billing period that begins on or after the last day of that period.
          boundary: inclusive
    params:
      rent_increase_notice_days:
        Willow Bend Estates: 90
        Palmetto Shores: 90
        Saguaro Vista: 90
        Bluebonnet Ridge: 60
        Cedar Hollow: 60
        Conestoga Meadows: 60
    formula:
      max_new_rent: round(monthly_site_rent * (1 + month_to_month_increase_cap_pct / 100), 2)
    measures: [lease_msr_rent_increases]

  - id: lease_vacate_terms
    subject: [lease_notice_to_vacate, lease_notice_rescission, lease_move_out, lease_early_termination_fee]
    rule: >-
      Giving notice to vacate is the resident's own written act; the resident desk records the notice on the resident's instruction and the vacate date the resident states.
      A notice to vacate is accepted only on an active lease.
      The vacate date should fall at least notice_to_vacate_days calendar days after the day the notice is received; when the stated date is earlier, the lease still ends on the stated date but rent is charged through the day that completes the full notice period.
      Final rent is prorated under lease_evt_rent_billing through the later of the vacate date and the end of the full notice period.
      When a fixed-term lease ends before its term end date, the early-termination fee of early_termination_fee_months times the monthly site rent is charged on the vacate date.
      No early-termination fee is charged on a month-to-month lease, on a vacate date on or after the term end date, when the lease ends through a sale of the home in place (early_termination_waived_on_approved_home_sale), or when the resident vacates under qualifying military orders (early_termination_waived_military_orders).
      A pending notice may be withdrawn only before the vacate date and only while no other applicant's lease for the same site in the same community stands approved.
      The lease closes on the vacate date, the utility final read is ordered for that date, and the deposit is disposed of under lease_deposit_terms.
    eligibility:
      - id: site_not_recommitted
        applies_to: [lease_notice_rescission]
        kind: authorization
        condition: A pending notice may be withdrawn only before the vacate date and only while no other applicant's lease for the same site in the same community stands approved.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.vacate_date, lease_holdings.site_number, lease_holdings.community_name, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
    formula:
      early_termination_fee: round(early_termination_fee_months * monthly_site_rent, 2)

  - id: lease_nonpayment_process
    subject: [lease_nonpayment_notice, lease_default, lease_default_cure, lease_termination]
    rule: >-
      A nonpayment notice is served on an active lease when a billing period's rent is still unpaid more than nonpayment_notice_days_past_due calendar days after its due date, unless a repayment agreement covering that balance is current.
      The amount demanded is the rent_balance on the notice date, and the cure deadline is the notice date plus the days listed for the community in nonpayment_cure_days.
      A lease is placed in default only after the cure deadline has passed, counted from the nonpayment notice date.
      The cure period is counted in calendar days starting the day after the notice date, and a payment received on the deadline day itself is in time.
      Paying the full amount demanded by the deadline cures the notice and the lease stays active; a smaller payment is refused under lease_evt_payment_acceptance.
      A lease in default is reinstated to active when every amount past due on the ledger, including fees posted after the notice, is paid before possession is returned.
      Termination of a lease in default runs through the community's attorney and the courts; the resident desk never sets, promises or negotiates a termination, move-out or possession date, and such requests go to a human representative.
    eligibility:
      - id: cure_deadline_passed
        applies_to: [lease_default]
        kind: time
        condition: A lease is placed in default only after the cure deadline has passed, counted from the nonpayment notice date.
        evidence_fields: [lease_notices.lease_id, lease_notices.notice_date, lease_notices.response_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_notices.lease_id]
          action_bindings:
            lease_notices.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the nonpayment notice date
          anchor_source: lease_notices.notice_date
          relation: not_before
          duration_source: params.nonpayment_cure_days
          unit: calendar_days
          counting_rule: The cure period is counted in calendar days starting the day after the notice date, and a payment received on the deadline day itself is in time.
          boundary: exclusive
    params:
      nonpayment_cure_days:
        Willow Bend Estates: 5
        Palmetto Shores: 5
        Saguaro Vista: 7
        Bluebonnet Ridge: 10
        Cedar Hollow: 7
        Conestoga Meadows: 20
    formula:
      amount_demanded: rent_balance

  - id: lease_repayment_terms
    subject: [lease_repayment_agreement]
    rule: >-
      A repayment agreement spreads a past-due lease balance over monthly installments and is the resident's own signed undertaking.
      A repayment agreement is available only on an active lease; a lease in default or with a notice to vacate pending cannot enter one.
      A repayment agreement requires payment_plan_min_tenure_months full calendar months of tenancy counted from the move-in date.
      Tenancy months for a repayment agreement are counted on the calendar from the move-in date, and the requirement is met on the day the last required month completes.
      No more than payment_plans_per_12_months agreements may be signed in the trailing 12 months (lease_msr_repayment_agreements).
      The past-due balance covered may not exceed payment_plan_max_arrears_months_rent times the monthly site rent; a larger balance is not eligible at all.
      At least payment_plan_min_down_pct percent of the past-due balance, rounded half up to the cent, is paid on the signing date, and the rest is split into at most payment_plan_max_installments equal monthly installments due on the rent due day starting the next month, the last installment absorbing any rounding difference.
      While installments are paid on time, no late fee and no nonpayment notice is issued for the covered balance; current rent must still be paid on time.
      A missed installment ends the agreement and the whole remaining covered balance is then treated as past due under lease_nonpayment_process.
    eligibility:
      - id: plan_lease_active
        applies_to: [lease_repayment_agreement]
        kind: state
        condition: A repayment agreement is available only on an active lease; a lease in default or with a notice to vacate pending cannot enter one.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [active]
      - id: plan_tenure
        applies_to: [lease_repayment_agreement]
        kind: time
        condition: A repayment agreement requires payment_plan_min_tenure_months full calendar months of tenancy counted from the move-in date.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.move_in_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the move-in date
          anchor_source: lease_holdings.move_in_date
          relation: not_before
          duration_source: variants.payment_plan_min_tenure_months
          unit: calendar_months
          counting_rule: Tenancy months for a repayment agreement are counted on the calendar from the move-in date, and the requirement is met on the day the last required month completes.
          boundary: inclusive
    formula:
      when_not: amount_demanded > payment_plan_max_arrears_months_rent * monthly_site_rent
      down_payment: round(payment_plan_min_down_pct / 100 * amount_demanded, 2)
      installment_amount: round((amount_demanded - down_payment) / installment_count, 2)
    measures: [lease_msr_repayment_agreements, lease_msr_tenure_months]

  - id: lease_deposit_terms
    subject: [lease_deposit_receipt, lease_deposit_disposition, lease_deposit_credit]
    rule: >-
      The security deposit is held for the whole tenancy and is never applied to rent while the lease is open, including as a last month's rent.
      A deposit is disposed of only after the lease is closed.
      When the rent_balance on the closed date is zero or a credit and no deduction is taken, the whole deposit plus any credit balance is refunded within deposit_refund_days_no_deductions calendar days of the closed date.
      Otherwise the deposit is first applied to the rent_balance up to the full deposit, the remainder is refunded with an itemized claim within deposit_claim_notice_days calendar days of the closed date, and any balance the deposit does not cover remains owed by the former resident.
      Damage to the site itself is assessed by the community office at the move-out inspection and is outside the resident desk; disputes about such deductions go to a human representative.
    eligibility:
      - id: deposit_after_close
        applies_to: [lease_deposit_disposition, lease_deposit_credit]
        kind: state
        condition: A deposit is disposed of only after the lease is closed.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [closed]
    params:
      per_tier:
        Standard Single-Section Home Site: {security_deposit_months: =security_deposit_months}
        Preferred Single-Section Home Site: {security_deposit_months: =security_deposit_months}
        Standard Multi-Section Home Site: {security_deposit_months: =security_deposit_months}
        Preferred Multi-Section Home Site: {security_deposit_months: =security_deposit_months}
        Greenbelt Multi-Section Home Site: {security_deposit_months: =security_deposit_months}
        Lakefront Multi-Section Home Site: {security_deposit_months: =security_deposit_months}
    formula:
      applied_to_balance: min(security_deposit_balance, max(rent_balance, 0))
      refunded: security_deposit_balance - applied_to_balance

  - id: lease_occupancy_terms
    subject: [lease_occupant_change, lease_occupant_charge]
    rule: >-
      Every adult aged 18 or over who lives in the home must be registered on the lease after screening, and the household may never exceed max_total_occupants persons of any age.
      Occupants are added or removed only while the lease is active or notice_to_vacate.
      Each adult added is screened for application_fee_per_adult, posted as an application fee on the registration date.
      The occupant charge for adults beyond included_adult_occupants changes from the billing period after the registration date; a removal stops the charge from the billing period after the departure is reported, without retroactive credit.
      A guest is not an occupant; guest stays are governed by the community rules program.
    eligibility:
      - id: occupant_change_open_lease
        applies_to: [lease_occupant_change]
        kind: state
        condition: Occupants are added or removed only while the lease is active or notice_to_vacate.
        evidence_fields: [lease_holdings.lease_id, lease_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_holdings.lease_id]
          action_bindings:
            lease_holdings.lease_id: lease_id
        state_contract:
          field: lease_holdings.status
          allowed: [active, notice_to_vacate]
    params:
      per_tier:
        Standard Single-Section Home Site: {additional_adult_occupant_fee_monthly: =additional_adult_occupant_fee_monthly, max_total_occupants: =max_total_occupants}
        Preferred Single-Section Home Site: {additional_adult_occupant_fee_monthly: =additional_adult_occupant_fee_monthly, max_total_occupants: =max_total_occupants}
        Standard Multi-Section Home Site: {additional_adult_occupant_fee_monthly: =additional_adult_occupant_fee_monthly, max_total_occupants: =max_total_occupants}
        Preferred Multi-Section Home Site: {additional_adult_occupant_fee_monthly: =additional_adult_occupant_fee_monthly, max_total_occupants: =max_total_occupants}
        Greenbelt Multi-Section Home Site: {additional_adult_occupant_fee_monthly: =additional_adult_occupant_fee_monthly, max_total_occupants: =max_total_occupants}
        Lakefront Multi-Section Home Site: {additional_adult_occupant_fee_monthly: =additional_adult_occupant_fee_monthly, max_total_occupants: =max_total_occupants}

  - id: lease_home_sale_closeout
    subject: [lease_sale_closeout]
    rule: >-
      Holding an in-place resale file changes how the seller's lease ends: when the home is sold in place under a Hearthstone resale file that has closed as sold, the seller's lease closes on the sale closing date without any notice to vacate period and without an early-termination fee (early_termination_waived_on_approved_home_sale).
      A lease is closed out on a home sale only when the resale file for that lease is closed_sold.
      Final rent is prorated under lease_evt_rent_billing through the sale closing date, and the deposit is disposed of under lease_deposit_terms.
      A home sold to a buyer who will remove it from the community is not an in-place sale; the seller's lease then ends only through a notice to vacate.
    eligibility:
      - id: resale_closed_sold
        applies_to: [lease_sale_closeout]
        kind: authorization
        condition: A lease is closed out on a home sale only when the resale file for that lease is closed_sold.
        evidence_fields: [resale_listings.lease_id, resale_listings.status, resale_listings.closing_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resale_listings.lease_id]
          action_bindings:
            resale_listings.lease_id: lease_id

extended_policies:
  - id: lease_ext_renewal_offer_rent
    base_policy_refs: [lease_renewal_terms]
    overwrite:
      - base_policy: lease_renewal_terms
        superseded_clause: >-
          The twelve-month offer is that equivalent raised by renewal_increase_pct_twelve_month percent; the twenty-four-month offer is the equivalent raised by renewal_increase_pct_twenty_four_month percent less twenty_four_month_rent_discount_monthly; the month-to-month offer is the twelve-month offer plus month_to_month_premium_monthly; each is rounded half up to the cent.
        replaced_by: >-
          The twenty-four-month offer is worked out the same way with renewal_increase_pct_twenty_four_month as the standard rate in place of renewal_increase_pct_twelve_month and is then reduced by twenty_four_month_rent_discount_monthly, and the month-to-month offer is the twelve-month offer plus month_to_month_premium_monthly.
      - base_policy: lease_renewal_terms
        superseded_clause: >-
          The offer is issued renewal_offer_lead_days calendar days before the current term end date, with one offer row for each term the lot class makes available, each starting the day after the current term end date.
        replaced_by: >-
          An offer that fell due and was not issued is issued, on the day the omission is found, for the term the resident asks to renew on, starting the day after the current term end date and carrying a response deadline renewal_response_days calendar days after that offer date; an offer issued on time carries one row for each term the lot class makes available.
    trigger: state_due
    subject: [lease_renewal_offer]
    computes: new_monthly_site_rent
    target_tool: issue_renewal_offer_ab5c4495
    params:
      lookback_months: 12
      clean_record_adjust_pct: -0.6
      single_late_adjust_pct: -0.3
      upkeep_long_months: 60
      upkeep_mid_months: 24
      upkeep_long_adjust_pct: -0.4
      upkeep_mid_adjust_pct: -0.2
      returned_one_adjust_pct: 0.5
      returned_multi_adjust_pct: 1.0
      autopay_full_drafts: 11
      autopay_part_drafts: 6
      autopay_full_adjust_pct: -0.3
      autopay_part_adjust_pct: -0.15
      loan_current_adjust_pct: -0.25
      loan_delinquent_adjust_pct: 0.25
      market_long_months: 120
      market_mid_months: 60
    rule: >-
      The renewal offer on a fixed-term home-site lease is priced from the lease records on the day the offer is issued.
      The twelve-month-equivalent rent is the current monthly site rent, plus twenty_four_month_rent_discount_monthly when the current term is twenty_four_month.
      The standard renewal increase rate is the lot class's renewal_increase_pct_twelve_month, and the standard dollar increase is the twelve-month-equivalent rent times that rate divided by one hundred, rounded half up to the cent.
      The renewal increase rate actually applied is the standard rate plus the five standing adjustments below, each in percentage points, and the dollar increase is the twelve-month-equivalent rent times the applied rate divided by one hundred, rounded half up to the cent.
      The payment-record adjustment counts the late fees posted on the lease with an entry date in the trailing lookback_months calendar months: with no late fee the adjustment is clean_record_adjust_pct, with exactly one it is single_late_adjust_pct, and with two or more it is zero.
      The site-upkeep adjustment reads the community rules violation notices served on the resident's site with a notice date in the trailing lookback_months calendar months and the full months of tenancy since the move-in date: with no such notice and at least upkeep_long_months months of tenancy it is upkeep_long_adjust_pct, with no such notice and at least upkeep_mid_months but fewer than upkeep_long_months months of tenancy it is upkeep_mid_adjust_pct, and otherwise it is zero.
      The returned-payment adjustment counts the returned-payment fees posted on the lease with an entry date in the trailing lookback_months calendar months: with two or more it is returned_multi_adjust_pct, with exactly one it is returned_one_adjust_pct, and with none it is zero.
      The autopay adjustment counts the honored autopay drafts in the trailing lookback_months calendar months, being the payments received through ach_autopay less the returned payments posted on the lease in the same months: with at least autopay_full_drafts honored drafts it is autopay_full_adjust_pct, with at least autopay_part_drafts but fewer than autopay_full_drafts it is autopay_part_adjust_pct, and with fewer than autopay_part_drafts it is zero.
      The home-loan adjustment reads the resident's Hearthstone home-only loan: a loan in active status with no late charge assessed in the trailing lookback_months calendar months gives loan_current_adjust_pct, a loan in delinquent status gives loan_delinquent_adjust_pct, and any other case, including no Hearthstone loan, gives zero.
      The raised rent is the twelve-month-equivalent rent plus the dollar increase.
      The standard twelve-month offer is the raised rent.
      The market-position step compares the raised rent with the lot class's base_monthly_site_rent for new residents and with the full months of tenancy since the move-in date: when the raised rent is above the base rent and tenancy is at least market_long_months months, the twelve-month offer is the lesser of the two, the base rent; when the raised rent is above the base rent and tenancy is at least market_mid_months but fewer than market_long_months months, the twelve-month offer is the midpoint of the raised rent and the base rent, rounded half up to the cent; otherwise the twelve-month offer is the raised rent.
      The twenty-four-month offer is worked out the same way with renewal_increase_pct_twenty_four_month as the standard rate in place of renewal_increase_pct_twelve_month and is then reduced by twenty_four_month_rent_discount_monthly, and the month-to-month offer is the twelve-month offer plus month_to_month_premium_monthly.
      The offer falls due renewal_offer_lead_days calendar days before the current term end date.
      An offer that fell due and was not issued is issued, on the day the omission is found, for the term the resident asks to renew on, starting the day after the current term end date and carrying a response deadline renewal_response_days calendar days after that offer date; an offer issued on time carries one row for each term the lot class makes available.
    prerequisite: []
    cross_category:
      - category: rules
        as: history
        reads: [rules_records.event_type, rules_records.record_date]
        note: The site-upkeep adjustment counts the rules violation notices on the resident's site-care plan record in the trailing window.
      - category: loan
        as: branch
        reads: [status, loan_transactions.event_type, loan_transactions.txn_date]
        note: The home-loan adjustment reads the Hearthstone loan's status and its late charges in the trailing window.
    compute:
      - equivalent: "F('monthly_site_rent') + (P('twenty_four_month_rent_discount_monthly') if F('lease_term_type') == 'twenty_four_month' else 0)"
      - tenure_months: "MONTHS(F('move_in_date'), NOW)"
      - late_fees_12m: "COUNT('lease_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='lease_late_fee')"
      - record_adjust: "K('clean_record_adjust_pct') if late_fees_12m == 0 else (K('single_late_adjust_pct') if late_fees_12m == 1 else 0.0)"
      - violations_12m: "XCOUNT('rules', 'rules_records', within_months=K('lookback_months'), date_field='record_date', event_type='rules_violation_notice')"
      - upkeep_adjust: "K('upkeep_long_adjust_pct') if (violations_12m == 0 and tenure_months >= K('upkeep_long_months')) else (K('upkeep_mid_adjust_pct') if (violations_12m == 0 and tenure_months >= K('upkeep_mid_months')) else 0.0)"
      - returned_fees_12m: "COUNT('lease_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='lease_nsf_fee')"
      - returned_adjust: "K('returned_multi_adjust_pct') if returned_fees_12m >= 2 else (K('returned_one_adjust_pct') if returned_fees_12m == 1 else 0.0)"
      - honored_drafts_12m: "COUNT('lease_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='lease_payment', payment_channel='ach_autopay') - COUNT('lease_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='lease_payment_return')"
      - autopay_adjust: "K('autopay_full_adjust_pct') if honored_drafts_12m >= K('autopay_full_drafts') else (K('autopay_part_adjust_pct') if honored_drafts_12m >= K('autopay_part_drafts') else 0.0)"
      - loan_status: "CFIELD('loan', 'status')"
      - loan_late_charges_12m: "XCOUNT('loan', 'loan_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='loan_late_charge')"
      - loan_adjust: "K('loan_current_adjust_pct') if (loan_status == 'active' and loan_late_charges_12m == 0) else (K('loan_delinquent_adjust_pct') if loan_status == 'delinquent' else 0.0)"
      - increase_pct: "P('renewal_increase_pct_twelve_month') + record_adjust + upkeep_adjust + returned_adjust + autopay_adjust + loan_adjust"
      - dollar_increase: "RND(equivalent * increase_pct / 100 + 0.000001, 2)"
      - raised_rent: "RND(equivalent + dollar_increase + 0.000001, 2)"
      - market_offer: "P('base_monthly_site_rent') if (raised_rent > P('base_monthly_site_rent') and MONTHS(F('move_in_date'), NOW) >= K('market_long_months')) else (RND((raised_rent + P('base_monthly_site_rent')) / 2 + 0.000001, 2) if (raised_rent > P('base_monthly_site_rent') and MONTHS(F('move_in_date'), NOW) >= K('market_mid_months') and MONTHS(F('move_in_date'), NOW) < K('market_long_months')) else raised_rent)"
      - result: "RND(market_offer + 0.000001, 2)"
    compute_basis:
      equivalent: "The twelve-month-equivalent rent is the current monthly site rent, plus twenty_four_month_rent_discount_monthly when the current term is twenty_four_month."
      tenure_months: "the full months of tenancy since the move-in date"
      late_fees_12m: "The payment-record adjustment counts the late fees posted on the lease with an entry date in the trailing lookback_months calendar months"
      record_adjust: "with no late fee the adjustment is clean_record_adjust_pct, with exactly one it is single_late_adjust_pct, and with two or more it is zero."
      violations_12m: "The site-upkeep adjustment reads the community rules violation notices served on the resident's site with a notice date in the trailing lookback_months calendar months"
      upkeep_adjust: "with no such notice and at least upkeep_long_months months of tenancy it is upkeep_long_adjust_pct, with no such notice and at least upkeep_mid_months but fewer than upkeep_long_months months of tenancy it is upkeep_mid_adjust_pct, and otherwise it is zero."
      returned_fees_12m: "The returned-payment adjustment counts the returned-payment fees posted on the lease with an entry date in the trailing lookback_months calendar months"
      returned_adjust: "with two or more it is returned_multi_adjust_pct, with exactly one it is returned_one_adjust_pct, and with none it is zero."
      honored_drafts_12m: "The autopay adjustment counts the honored autopay drafts in the trailing lookback_months calendar months, being the payments received through ach_autopay less the returned payments posted on the lease in the same months"
      autopay_adjust: "with at least autopay_full_drafts honored drafts it is autopay_full_adjust_pct, with at least autopay_part_drafts but fewer than autopay_full_drafts it is autopay_part_adjust_pct, and with fewer than autopay_part_drafts it is zero."
      loan_status: "The home-loan adjustment reads the resident's Hearthstone home-only loan"
      loan_late_charges_12m: "a loan in active status with no late charge assessed in the trailing lookback_months calendar months"
      loan_adjust: "a loan in active status with no late charge assessed in the trailing lookback_months calendar months gives loan_current_adjust_pct, a loan in delinquent status gives loan_delinquent_adjust_pct, and any other case, including no Hearthstone loan, gives zero."
      increase_pct: "The renewal increase rate actually applied is the standard rate plus the five standing adjustments below, each in percentage points"
      dollar_increase: "the dollar increase is the twelve-month-equivalent rent times the applied rate divided by one hundred, rounded half up to the cent."
      raised_rent: "The raised rent is the twelve-month-equivalent rent plus the dollar increase."
      market_offer: "when the raised rent is above the base rent and tenancy is at least market_long_months months, the twelve-month offer is the lesser of the two, the base rent; when the raised rent is above the base rent and tenancy is at least market_mid_months but fewer than market_long_months months, the twelve-month offer is the midpoint of the raised rent and the base rent, rounded half up to the cent; otherwise the twelve-month offer is the raised rent."
      result: "The market-position step compares the raised rent with the lot class's base_monthly_site_rent for new residents and with the full months of tenancy since the move-in date: when the raised rent is above the base rent and tenancy is at least market_long_months months, the twelve-month offer is the lesser of the two, the base rent; when the raised rent is above the base rent and tenancy is at least market_mid_months but fewer than market_long_months months, the twelve-month offer is the midpoint of the raised rent and the base rent, rounded half up to the cent; otherwise the twelve-month offer is the raised rent."
    factors:
      - id: payment_record_adjustment
        effect: parameter
        decides: record_adjust
        bindings: [late_fees_12m, record_adjust]
        ladder:
          - when: "no late fee posted on the lease in the trailing twelve calendar months"
            value: "K('clean_record_adjust_pct')"
          - when: "exactly one late fee posted on the lease in the trailing twelve calendar months"
            value: "K('single_late_adjust_pct')"
          - when: "otherwise (two or more late fees in that window)"
            value: "0.0"
        baseline:
          record_adjust: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: site_upkeep_adjustment
        effect: parameter
        decides: upkeep_adjust
        bindings: [violations_12m, tenure_months, upkeep_adjust]
        ladder:
          - when: "no rules violation notice on the site in the trailing twelve calendar months AND at least upkeep_long_months full months of tenancy"
            value: "K('upkeep_long_adjust_pct')"
          - when: "no rules violation notice on the site in the trailing twelve calendar months AND at least upkeep_mid_months but fewer than upkeep_long_months full months of tenancy"
            value: "K('upkeep_mid_adjust_pct')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          upkeep_adjust: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: rules
      - id: returned_payment_adjustment
        effect: parameter
        decides: returned_adjust
        bindings: [returned_fees_12m, returned_adjust]
        ladder:
          - when: "two or more returned-payment fees posted in the trailing twelve calendar months"
            value: "K('returned_multi_adjust_pct')"
          - when: "exactly one returned-payment fee posted in the trailing twelve calendar months"
            value: "K('returned_one_adjust_pct')"
          - when: "otherwise (none)"
            value: "0.0"
        baseline:
          returned_adjust: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: autopay_draft_adjustment
        effect: parameter
        decides: autopay_adjust
        bindings: [honored_drafts_12m, autopay_adjust]
        ladder:
          - when: "at least autopay_full_drafts honored autopay drafts in the trailing twelve calendar months"
            value: "K('autopay_full_adjust_pct')"
          - when: "at least autopay_part_drafts but fewer than autopay_full_drafts honored autopay drafts"
            value: "K('autopay_part_adjust_pct')"
          - when: "otherwise (fewer than autopay_part_drafts)"
            value: "0.0"
        baseline:
          autopay_adjust: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: home_loan_adjustment
        effect: parameter
        decides: loan_adjust
        bindings: [loan_status, loan_late_charges_12m, loan_adjust]
        ladder:
          - when: "a Hearthstone home-only loan in active status AND no late charge assessed on it in the trailing twelve calendar months"
            value: "K('loan_current_adjust_pct')"
          - when: "a Hearthstone home-only loan in delinquent status"
            value: "K('loan_delinquent_adjust_pct')"
          - when: "otherwise, including no Hearthstone loan"
            value: "0.0"
        baseline:
          loan_adjust: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: loan
      - id: market_position_step
        effect: method
        decides: market_offer
        bindings: [market_offer]
        ladder:
          - when: "raised rent above the lot class's base rent for new residents AND at least market_long_months full months of tenancy"
            method: "the offer is the lesser of the raised rent and the base rent (selection of the lower candidate)"
          - when: "raised rent above the base rent AND at least market_mid_months but fewer than market_long_months full months of tenancy"
            method: "the offer is the midpoint of the raised rent and the base rent, rounded half up to the cent (mean of the two candidates)"
          - when: "otherwise"
            method: "the offer is the raised rent as it stands"
        baseline:
          market_offer: "raised_rent"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The twelve-month-equivalent rent is the current monthly site rent, plus twenty_four_month_rent_discount_monthly when the current term is twenty_four_month.
        The standard renewal increase rate is the lot class's renewal_increase_pct_twelve_month, and the standard dollar increase is the twelve-month-equivalent rent times that rate divided by one hundred, rounded half up to the cent.
        The raised rent is the twelve-month-equivalent rent plus the dollar increase.
        The standard twelve-month offer is the raised rent.
        The twenty-four-month offer is worked out the same way with renewal_increase_pct_twenty_four_month as the standard rate in place of renewal_increase_pct_twelve_month and is then reduced by twenty_four_month_rent_discount_monthly, and the month-to-month offer is the twelve-month offer plus month_to_month_premium_monthly.
      params: [renewal_increase_pct_twelve_month, renewal_increase_pct_twenty_four_month, twenty_four_month_rent_discount_monthly, month_to_month_premium_monthly]
    inputs:
      history:
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_late_fee}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_nsf_fee}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_payment, payment_channel: ach_autopay}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_payment_return}}
        - {category: rules, table: rules_records, aggregate: count, field: rules_record_id, within_months: 12, filters: {event_type: rules_violation_notice}}
        - {category: loan, table: loan_transactions, aggregate: count, field: loan_txn_id, within_months: 12, filters: {event_type: loan_late_charge}}
      cross_category: [rules, loan]
  - id: lease_ext_signed_renewal_rent
    base_policy_refs: [lease_renewal_terms]
    overwrite: []
    trigger: on_request
    subject: [lease_renewal]
    computes: new_monthly_site_rent
    target_tool: sign_lease_renewal_1699e1a4
    params:
      early_window_full: 14
      early_window_part: 30
      early_credit_full: 5.00
      early_credit_part: 2.50
      utility_lookback_months: 12
      utility_credit_full: 2.00
      utility_credit_part: 1.00
      market_long_months: 60
      market_mid_months: 24
      market_mid_margin: 15.00
      loyalty_full_count: 5
      loyalty_part_count: 2
      loyalty_credit_full: 3.00
      loyalty_credit_part: 1.50
    rule: >-
      The monthly site rent written into a renewal the resident signs for a twelve-month term is worked out as below; an election of another offered term is signed at the rent offered for that term.
      The rent written into a signed twelve-month renewal is fixed only after the notices on the lease carry a renewal offer for the twelve-month term that begins the day after the current term end date.
      The standard signed rent is the monthly site rent of the twelve-month renewal offer on the lease, taken as offered.
      The market match compares that offered rent with the lot class's base_monthly_site_rent for new residents and with the full months of tenancy since the move-in date: when the offered rent is above the base rent and tenancy is at least market_long_months months, the rent before signing credits is the base rent; when the offered rent is above the base rent plus market_mid_margin and tenancy is at least market_mid_months but fewer than market_long_months months, it is the base rent plus market_mid_margin; otherwise it is the offered rent.
      The early-signing credit counts the calendar days from the offer date to the signing date: signing within early_window_full days gives early_credit_full, signing after more than early_window_full but no more than early_window_part days gives early_credit_part, and later signing gives no credit.
      The utility-standing credit reads the utility statement account serving the resident's site: with no utility late fee posted in the trailing utility_lookback_months calendar months and a utility balance of zero or a credit it is utility_credit_full, with no utility late fee in that window but a utility balance owing it is utility_credit_part, and otherwise there is none.
      The renewal-loyalty credit counts the renewal elections the resident has signed and had accepted on the lease: at least loyalty_full_count give loyalty_credit_full, at least loyalty_part_count but fewer than loyalty_full_count give loyalty_credit_part, and fewer give none.
      The signed rent is the rent before signing credits less the early-signing, utility-standing and renewal-loyalty credits, rounded half up to the cent; each credit is a dollar amount per month taken once from that rent, and the credits do not act on one another.
    prerequisite:
      - problem: lease_ext_renewal_offer_rent
        kind: value_input
        gate: offered_rent
        form: state
        policy_source: >-
          The rent written into a signed twelve-month renewal is fixed only after the notices on the lease carry a renewal offer for the twelve-month term that begins the day after the current term end date.
        condition: >-
          lease_notices holds a lease_renewal_offer row for the lease with offered_term_type twelve_month and effective_date equal to the day after lease_holdings.term_end_date.
        resolved_by: issue_renewal_offer_ab5c4495
        effect: >-
          The offered rent that the market match and the standard signed rent read becomes the twelve-month rent recorded on that offer row; with no such row there is no offered rent to sign.
    cross_category:
      - category: utility
        as: branch
        reads: [utility_balance, utility_ledger.event_type, utility_ledger.entry_date]
        note: The utility-standing credit reads the site's utility balance and its utility late fees in the trailing window.
    compute:
      - offered_rent: "LATEST('lease_notices', 'new_monthly_site_rent', date_field='notice_date', event_type='lease_renewal_offer', offered_term_type='twelve_month')"
      - offer_date: "LATEST('lease_notices', 'notice_date', date_field='notice_date', event_type='lease_renewal_offer', offered_term_type='twelve_month')"
      - days_since_offer: "DAYS(offer_date, NOW)"
      - early_credit: "K('early_credit_full') if days_since_offer <= K('early_window_full') else (K('early_credit_part') if days_since_offer <= K('early_window_part') else 0.0)"
      - utility_late_fees_12m: "XCOUNT('utility', 'utility_ledger', within_months=K('utility_lookback_months'), date_field='entry_date', event_type='utility_late_fee')"
      - utility_balance: "CFIELD('utility', 'utility_balance')"
      - utility_credit: "K('utility_credit_full') if (utility_late_fees_12m == 0 and utility_balance <= 0) else (K('utility_credit_part') if (utility_late_fees_12m == 0 and utility_balance > 0) else 0.0)"
      - market_base: "P('base_monthly_site_rent') if (offered_rent > P('base_monthly_site_rent') and MONTHS(F('move_in_date'), NOW) >= K('market_long_months')) else (P('base_monthly_site_rent') + K('market_mid_margin') if (offered_rent > P('base_monthly_site_rent') + K('market_mid_margin') and MONTHS(F('move_in_date'), NOW) >= K('market_mid_months') and MONTHS(F('move_in_date'), NOW) < K('market_long_months')) else offered_rent)"
      - accepted_renewals: "COUNT('lease_requests', request_type='renewal_election', request_status='accepted')"
      - loyalty_credit: "K('loyalty_credit_full') if accepted_renewals >= K('loyalty_full_count') else (K('loyalty_credit_part') if accepted_renewals >= K('loyalty_part_count') else 0.0)"
      - result: "RND(market_base - early_credit - utility_credit - loyalty_credit + 0.000001, 2)"
    compute_basis:
      offered_rent: "The standard signed rent is the monthly site rent of the twelve-month renewal offer on the lease, taken as offered."
      offer_date: "The early-signing credit counts the calendar days from the offer date to the signing date"
      days_since_offer: "The early-signing credit counts the calendar days from the offer date to the signing date"
      early_credit: "signing within early_window_full days gives early_credit_full, signing after more than early_window_full but no more than early_window_part days gives early_credit_part, and later signing gives no credit."
      utility_late_fees_12m: "with no utility late fee posted in the trailing utility_lookback_months calendar months"
      utility_balance: "The utility-standing credit reads the utility statement account serving the resident's site"
      utility_credit: "with no utility late fee posted in the trailing utility_lookback_months calendar months and a utility balance of zero or a credit it is utility_credit_full, with no utility late fee in that window but a utility balance owing it is utility_credit_part, and otherwise there is none."
      market_base: "when the offered rent is above the base rent and tenancy is at least market_long_months months, the rent before signing credits is the base rent; when the offered rent is above the base rent plus market_mid_margin and tenancy is at least market_mid_months but fewer than market_long_months months, it is the base rent plus market_mid_margin; otherwise it is the offered rent."
      accepted_renewals: "The renewal-loyalty credit counts the renewal elections the resident has signed and had accepted on the lease"
      loyalty_credit: "at least loyalty_full_count give loyalty_credit_full, at least loyalty_part_count but fewer than loyalty_full_count give loyalty_credit_part, and fewer give none."
      result: "The signed rent is the rent before signing credits less the early-signing, utility-standing and renewal-loyalty credits, rounded half up to the cent; each credit is a dollar amount per month taken once from that rent, and the credits do not act on one another."
    factors:
      - id: early_signing_credit
        effect: parameter
        decides: early_credit
        bindings: [offer_date, days_since_offer, early_credit]
        ladder:
          - when: "signed within early_window_full calendar days of the offer date"
            value: "K('early_credit_full')"
          - when: "signed after more than early_window_full but no more than early_window_part calendar days"
            value: "K('early_credit_part')"
          - when: "signed later"
            value: "0.0"
        baseline:
          early_credit: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: utility_standing_credit
        effect: parameter
        decides: utility_credit
        bindings: [utility_late_fees_12m, utility_balance, utility_credit]
        ladder:
          - when: "no utility late fee in the trailing twelve calendar months AND a utility balance of zero or a credit"
            value: "K('utility_credit_full')"
          - when: "no utility late fee in the trailing twelve calendar months AND a utility balance owing"
            value: "K('utility_credit_part')"
          - when: "otherwise (a utility late fee in the window)"
            value: "0.0"
        baseline:
          utility_credit: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: utility
      - id: market_match
        effect: method
        decides: market_base
        bindings: [market_base]
        ladder:
          - when: "offered rent above the lot class's base rent AND at least market_long_months full months of tenancy"
            method: "the rent before signing credits is the lot class's base rent for new residents (the lesser of the two)"
          - when: "offered rent above the base rent plus market_mid_margin AND at least market_mid_months but fewer than market_long_months months of tenancy"
            method: "the rent before signing credits is the base rent plus market_mid_margin"
          - when: "otherwise"
            method: "the rent before signing credits is the offered rent as it stands"
        baseline:
          market_base: "offered_rent"
        evidence: [date]
        cross_difficulty: null
      - id: renewal_loyalty_credit
        effect: parameter
        decides: loyalty_credit
        bindings: [accepted_renewals, loyalty_credit]
        ladder:
          - when: "at least loyalty_full_count accepted renewal elections on the lease"
            value: "K('loyalty_credit_full')"
          - when: "at least loyalty_part_count but fewer than loyalty_full_count accepted renewal elections"
            value: "K('loyalty_credit_part')"
          - when: "fewer than loyalty_part_count"
            value: "0.0"
        baseline:
          loyalty_credit: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard signed rent is the monthly site rent of the twelve-month renewal offer on the lease, taken as offered.
      params: []
    inputs:
      history:
        - {table: lease_notices, aggregate: latest, field: new_monthly_site_rent, filters: {event_type: lease_renewal_offer, offered_term_type: twelve_month}}
        - {table: lease_requests, aggregate: count, field: lease_request_id, filters: {request_type: renewal_election, request_status: accepted}}
        - {category: utility, table: utility_ledger, aggregate: count, field: utility_entry_id, within_months: 12, filters: {event_type: utility_late_fee}}
      cross_category: [utility]
  - id: lease_ext_late_fee_assessment
    base_policy_refs: [lease_evt_late_fee]
    overwrite:
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          The fee is late_fee_pct_of_unpaid_rent percent of the period's rent and occupant charges still unpaid at the end of the last grace day (lease_msr_period_rent_unpaid), raised to late_fee_minimum and capped at late_fee_maximum for the lot class, rounded half up to the cent.
        replaced_by: >-
          The late fee is the amount so found, capped at late_fee_maximum for the lot class and rounded half up to the cent; at most one late fee is charged per billing period.
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          The grace period is counted in calendar days starting the day after the due date, so the fee may be posted no earlier than the calendar day after the due date plus late_fee_grace_days.
        replaced_by: >-
          The grace period is long_tenure_grace_days calendar days for a resident with at least long_tenure_months full months of tenancy since the move-in date, new_resident_grace_days calendar days for a resident with fewer than new_resident_months full months, and late_fee_grace_days calendar days otherwise; it is counted from the day after the due date and the fee may be posted from the day after the last grace day.
    trigger: state_due
    subject: [lease_late_fee]
    computes: amount
    target_tool: post_late_fee_cfe97caa
    params:
      long_tenure_months: 120
      new_resident_months: 12
      settled_months: 60
      long_tenure_grace_days: 7
      new_resident_grace_days: 3
      first_late_pct: 4.5
      repeat_late_pct: 7.0
      repeat_late_count: 3
      established_floor: 25.00
      settled_floor: 30.00
      full_unpaid_daily: 5.00
      half_paid_daily: 2.00
      daily_late_charge: 3.00
    rule: >-
      A late fee is assessed on the billing period of the most recent rent charge once that period's grace period, counted from the due date of that rent charge, has ended with its rent and occupant charges unpaid; a fee owed on an earlier period is assessed on the same terms while that period's rent charge is still the most recent one, and a late fee not assessed by the time the next rent charge falls due lapses and is no longer owed.
      The standard grace period is late_fee_grace_days calendar days after the due date.
      The unpaid amount is the period's rent and occupant charges less its rent credits and less the latest payment when that payment was received from the due date through the last grace day, but never more than the lease balance at the end of the last grace day, which is the balance now plus the latest payment when that payment was received after the last grace day; it is never below zero.
      The standard late fee is late_fee_pct_of_unpaid_rent percent of the unpaid amount, rounded half up to the cent and raised to late_fee_minimum, charged once.
      The grace period is long_tenure_grace_days calendar days for a resident with at least long_tenure_months full months of tenancy since the move-in date, new_resident_grace_days calendar days for a resident with fewer than new_resident_months full months, and late_fee_grace_days calendar days otherwise; it is counted from the day after the due date and the fee may be posted from the day after the last grace day.
      The percentage applied to the unpaid amount is first_late_pct when no late fee was posted on the lease in the trailing twelve calendar months, repeat_late_pct when repeat_late_count or more were, and late_fee_pct_of_unpaid_rent otherwise.
      The floor the percentage fee is raised to is established_floor for a resident with at least long_tenure_months full months of tenancy and no returned payment on the lease in the trailing twenty-four calendar months, settled_floor for a resident with at least settled_months but fewer than long_tenure_months full months of tenancy and no returned payment in that window, and late_fee_minimum otherwise.
      How the fee grows with lateness follows the community of the site and whether the period's charges are still uncovered on the posting date, meaning that the period's rent and occupant charges less credits still exceed the latest payment received on or after the due date: at Cedar Hollow and Conestoga Meadows, with the charges still uncovered, the fee is the percentage fee plus the daily late charge for each accrued day; at Bluebonnet Ridge and Saguaro Vista, with the charges still uncovered, the fee is the floor alone; in every other case the fee is the percentage fee alone.
      The daily late charge is full_unpaid_daily when no payment has been received on or after the due date, half_paid_daily when the latest payment, received on or after the due date, is at least half of the period's rent and occupant charges less credits, and daily_late_charge otherwise.
      Days accrue from the day after the last grace day: through the day before the latest payment when that payment was received after the last grace day; through the date of the most recent nonpayment notice when no payment came after the last grace day and that notice was served on or after the due date; and through the posting date otherwise.
      The late fee is the amount so found, capped at late_fee_maximum for the lot class and rounded half up to the cent; at most one late fee is charged per billing period.
    prerequisite: []
    cross_category: []
    compute:
      - due_date: "LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_rent_charge')"
      - period: "LATEST('lease_ledger', 'billing_period', date_field='entry_date', event_type='lease_rent_charge')"
      - period_charges: "SUM('lease_ledger', 'amount', event_type='lease_rent_charge', billing_period=period) + SUM('lease_ledger', 'amount', event_type='lease_occupant_charge', billing_period=period) - SUM('lease_ledger', 'amount', event_type='lease_rent_credit', billing_period=period)"
      - last_pay_date: "LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_payment')"
      - last_pay_amount: "LATEST('lease_ledger', 'amount', date_field='entry_date', event_type='lease_payment')"
      - grace_days: "K('long_tenure_grace_days') if MONTHS(F('move_in_date'), NOW) >= K('long_tenure_months') else (K('new_resident_grace_days') if MONTHS(F('move_in_date'), NOW) < K('new_resident_months') else P('late_fee_grace_days'))"
      - paid_in_grace: "last_pay_amount if (DAYS(due_date, last_pay_date) >= 0 and DAYS(due_date, last_pay_date) <= grace_days) else 0"
      - balance_at_grace_end: "F('rent_balance') + (last_pay_amount if DAYS(due_date, last_pay_date) > grace_days else 0)"
      - unpaid: "MX(MN(period_charges - paid_in_grace, balance_at_grace_end), 0)"
      - late_fees_12m: "COUNT('lease_ledger', within_months=12, date_field='entry_date', event_type='lease_late_fee')"
      - rate: "K('first_late_pct') if late_fees_12m == 0 else (K('repeat_late_pct') if late_fees_12m >= K('repeat_late_count') else P('late_fee_pct_of_unpaid_rent'))"
      - returned_24m: "COUNT('lease_ledger', within_months=24, date_field='entry_date', event_type='lease_payment_return')"
      - floor: "K('established_floor') if (MONTHS(F('move_in_date'), NOW) >= K('long_tenure_months') and returned_24m == 0) else (K('settled_floor') if (MONTHS(F('move_in_date'), NOW) >= K('settled_months') and MONTHS(F('move_in_date'), NOW) < K('long_tenure_months') and returned_24m == 0) else P('late_fee_minimum'))"
      - pct_fee: "MX(RND(rate * unpaid / 100 + 0.000001, 2), floor)"
      - paid_since_due: "last_pay_amount if DAYS(due_date, last_pay_date) >= 0 else 0"
      - daily_charge: "K('full_unpaid_daily') if paid_since_due == 0 else (K('half_paid_daily') if paid_since_due >= period_charges / 2 else K('daily_late_charge'))"
      - latest_notice_date: "LATEST('lease_notices', 'notice_date', date_field='notice_date', event_type='lease_nonpayment_notice')"
      - days_accrued: "DAYS(due_date, last_pay_date) - grace_days - 1 if DAYS(due_date, last_pay_date) > grace_days else (DAYS(due_date, latest_notice_date) - grace_days if (latest_notice_date != None and DAYS(due_date, latest_notice_date) >= 0) else DAYS(due_date, NOW) - grace_days)"
      - fee_amount: "pct_fee + daily_charge * days_accrued if ((F('community_name') == 'Cedar Hollow' or F('community_name') == 'Conestoga Meadows') and period_charges - (LATEST('lease_ledger', 'amount', date_field='entry_date', event_type='lease_payment') if DAYS(due_date, LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_payment')) >= 0 else 0) > 0) else (floor if ((F('community_name') == 'Bluebonnet Ridge' or F('community_name') == 'Saguaro Vista') and period_charges - (LATEST('lease_ledger', 'amount', date_field='entry_date', event_type='lease_payment') if DAYS(due_date, LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_payment')) >= 0 else 0) > 0) else pct_fee)"
      - result: "RND(MN(fee_amount, P('late_fee_maximum')) + 0.000001, 2)"
    compute_basis:
      due_date: "counted from the due date of that rent charge"
      period: "A late fee is assessed on the billing period of the most recent rent charge"
      period_charges: "the period's rent and occupant charges less its rent credits"
      last_pay_date: "the latest payment when that payment was received from the due date through the last grace day"
      last_pay_amount: "the latest payment when that payment was received from the due date through the last grace day"
      grace_days: "The grace period is long_tenure_grace_days calendar days for a resident with at least long_tenure_months full months of tenancy since the move-in date, new_resident_grace_days calendar days for a resident with fewer than new_resident_months full months, and late_fee_grace_days calendar days otherwise"
      paid_in_grace: "less the latest payment when that payment was received from the due date through the last grace day"
      balance_at_grace_end: "the lease balance at the end of the last grace day, which is the balance now plus the latest payment when that payment was received after the last grace day"
      unpaid: "but never more than the lease balance at the end of the last grace day, which is the balance now plus the latest payment when that payment was received after the last grace day; it is never below zero."
      late_fees_12m: "when no late fee was posted on the lease in the trailing twelve calendar months"
      rate: "The percentage applied to the unpaid amount is first_late_pct when no late fee was posted on the lease in the trailing twelve calendar months, repeat_late_pct when repeat_late_count or more were, and late_fee_pct_of_unpaid_rent otherwise."
      returned_24m: "no returned payment on the lease in the trailing twenty-four calendar months"
      floor: "The floor the percentage fee is raised to is established_floor for a resident with at least long_tenure_months full months of tenancy and no returned payment on the lease in the trailing twenty-four calendar months, settled_floor for a resident with at least settled_months but fewer than long_tenure_months full months of tenancy and no returned payment in that window, and late_fee_minimum otherwise."
      pct_fee: "percent of the unpaid amount, rounded half up to the cent and raised to late_fee_minimum"
      paid_since_due: "when the latest payment, received on or after the due date"
      daily_charge: "The daily late charge is full_unpaid_daily when no payment has been received on or after the due date, half_paid_daily when the latest payment, received on or after the due date, is at least half of the period's rent and occupant charges less credits, and daily_late_charge otherwise."
      latest_notice_date: "through the date of the most recent nonpayment notice when no payment came after the last grace day and that notice was served on or after the due date"
      days_accrued: "Days accrue from the day after the last grace day: through the day before the latest payment when that payment was received after the last grace day; through the date of the most recent nonpayment notice when no payment came after the last grace day and that notice was served on or after the due date; and through the posting date otherwise."
      fee_amount: "at Cedar Hollow and Conestoga Meadows, with the charges still uncovered, the fee is the percentage fee plus the daily late charge for each accrued day; at Bluebonnet Ridge and Saguaro Vista, with the charges still uncovered, the fee is the floor alone; in every other case the fee is the percentage fee alone."
      result: "The late fee is the amount so found, capped at late_fee_maximum for the lot class and rounded half up to the cent; at most one late fee is charged per billing period."
    factors:
      - id: first_lapse_rate
        effect: parameter
        decides: rate
        bindings: [late_fees_12m, rate]
        ladder:
          - when: "no late fee posted on the lease in the trailing twelve calendar months"
            value: "K('first_late_pct')"
          - when: "repeat_late_count or more late fees posted in that window"
            value: "K('repeat_late_pct')"
          - when: "otherwise (one or two late fees in that window)"
            value: "P('late_fee_pct_of_unpaid_rent')"
        baseline:
          rate: "P('late_fee_pct_of_unpaid_rent')"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_grace_length
        effect: parameter
        decides: grace_days
        bindings: [grace_days]
        ladder:
          - when: "at least long_tenure_months full months of tenancy since the move-in date"
            value: "K('long_tenure_grace_days')"
          - when: "fewer than new_resident_months full months of tenancy"
            value: "K('new_resident_grace_days')"
          - when: "otherwise"
            value: "P('late_fee_grace_days')"
        baseline:
          grace_days: "P('late_fee_grace_days')"
        evidence: [date]
        cross_difficulty: null
      - id: standing_floor
        effect: parameter
        decides: floor
        bindings: [returned_24m, floor]
        ladder:
          - when: "at least long_tenure_months full months of tenancy AND no returned payment on the lease in the trailing twenty-four calendar months"
            value: "K('established_floor')"
          - when: "at least settled_months but fewer than long_tenure_months full months of tenancy AND no returned payment in that window"
            value: "K('settled_floor')"
          - when: "otherwise"
            value: "P('late_fee_minimum')"
        baseline:
          floor: "P('late_fee_minimum')"
        evidence: [date, history]
        cross_difficulty: null
      - id: paid_share_daily_charge
        effect: parameter
        decides: daily_charge
        bindings: [paid_since_due, daily_charge]
        ladder:
          - when: "no payment received on or after the period's due date"
            value: "K('full_unpaid_daily')"
          - when: "the latest payment, received on or after the due date, is at least half of the period's charges less credits"
            value: "K('half_paid_daily')"
          - when: "otherwise (a smaller payment)"
            value: "K('daily_late_charge')"
        baseline:
          daily_charge: "K('daily_late_charge')"
        evidence: [history, date]
        cross_difficulty: null
      - id: accrual_end_anchor
        effect: method
        decides: days_accrued
        bindings: [latest_notice_date, days_accrued]
        ladder:
          - when: "the latest payment was received after the last grace day"
            method: "days accrue from the day after the last grace day through the day before that payment"
          - when: "no payment after the last grace day AND a nonpayment notice served on or after the due date"
            method: "days accrue from the day after the last grace day through the notice date"
          - when: "otherwise"
            method: "days accrue from the day after the last grace day through the posting date"
        baseline:
          days_accrued: "DAYS(due_date, NOW) - grace_days"
        evidence: [date, history]
        cross_difficulty: null
      - id: community_accrual_method
        effect: method
        decides: fee_amount
        bindings: [fee_amount]
        ladder:
          - when: "site at Cedar Hollow or Conestoga Meadows AND the period's charges less credits still exceed the latest payment received on or after the due date"
            method: "the percentage fee plus the daily late charge for each accrued day"
          - when: "site at Bluebonnet Ridge or Saguaro Vista AND the period's charges less credits still exceed the latest payment received on or after the due date"
            method: "the floor amount alone, whatever the unpaid amount"
          - when: "otherwise (Willow Bend Estates or Palmetto Shores, or charges already covered by the latest payment)"
            method: "the percentage fee alone, charged once"
        baseline:
          fee_amount: "pct_fee"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard grace period is late_fee_grace_days calendar days after the due date.
        The unpaid amount is the period's rent and occupant charges less its rent credits and less the latest payment when that payment was received from the due date through the last grace day, but never more than the lease balance at the end of the last grace day, which is the balance now plus the latest payment when that payment was received after the last grace day; it is never below zero.
        The standard late fee is late_fee_pct_of_unpaid_rent percent of the unpaid amount, rounded half up to the cent and raised to late_fee_minimum, charged once.
        The late fee is the amount so found, capped at late_fee_maximum for the lot class and rounded half up to the cent; at most one late fee is charged per billing period.
      params: [late_fee_grace_days, late_fee_pct_of_unpaid_rent, late_fee_minimum, late_fee_maximum]
    inputs:
      history:
        - {table: lease_ledger, aggregate: sum, field: amount, filters: {event_type: lease_rent_charge}}
        - {table: lease_ledger, aggregate: sum, field: amount, filters: {event_type: lease_occupant_charge}}
        - {table: lease_ledger, aggregate: latest, field: amount, filters: {event_type: lease_payment}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_late_fee}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 24, filters: {event_type: lease_payment_return}}
        - {table: lease_notices, aggregate: latest, field: notice_date, filters: {event_type: lease_nonpayment_notice}}
      cross_category: []
  - id: lease_ext_nonpayment_cure_period
    base_policy_refs: [lease_nonpayment_process]
    overwrite:
      - base_policy: lease_nonpayment_process
        superseded_clause: >-
          The amount demanded is the rent_balance on the notice date, and the cure deadline is the notice date plus the days listed for the community in nonpayment_cure_days.
        replaced_by: >-
          The amount demanded is the rent balance on the notice date, and the cure deadline is the last day of the cure period worked out below.
      - base_policy: lease_nonpayment_process
        superseded_clause: >-
          The cure period is counted in calendar days starting the day after the notice date, and a payment received on the deadline day itself is in time.
        replaced_by: >-
          How the lengthened cure period runs on the calendar follows the channel of the latest payment on the lease: when it came through the community office (office_money_order, office_cashiers_check or office_personal_check) the days are office business days, Monday through Friday, because office payments can only be made on those days; when it came through the resident portal (online_portal_ach or online_portal_card) the days are calendar days and a deadline that would fall on a Saturday or Sunday moves to the following Monday; otherwise the days are calendar days as counted.
    trigger: state_due
    subject: [lease_nonpayment_notice]
    computes: cure_days
    target_tool: serve_nonpayment_notice_fb7be621
    params:
      cure_days_willow_palmetto: 5
      cure_days_saguaro_cedar: 7
      cure_days_bluebonnet: 10
      cure_days_conestoga: 20
      long_tenure_months: 120
      mid_tenure_months: 60
      long_tenure_ext_days: 3
      mid_tenure_ext_days: 2
      first_notice_ext_days: 3
      older_notice_ext_days: 1
      half_paid_ext_days: 2
      part_paid_ext_days: 1
      steady_full_payments: 12
      steady_part_payments: 6
      steady_full_ext_days: 2
      steady_part_ext_days: 1
      utility_current_ext_days: 2
      utility_owing_ext_days: 1
    rule: >-
      A nonpayment notice is served on an active lease when a billing period's rent is still unpaid more than nonpayment_notice_days_past_due calendar days after its due date, unless a repayment agreement covering that balance is current.
      A nonpayment notice is not served until the rent ledger carries the late fee owed for every billing period whose grace period has ended with its rent unpaid.
      The amount demanded is the rent balance on the notice date, and the cure deadline is the last day of the cure period worked out below.
      The standard cure period is the number of days listed for the community in nonpayment_cure_days (cure_days_willow_palmetto at Willow Bend Estates and Palmetto Shores, cure_days_saguaro_cedar at Saguaro Vista and Cedar Hollow, cure_days_bluebonnet at Bluebonnet Ridge, cure_days_conestoga at Conestoga Meadows), counted in calendar days starting the day after the notice date, the last of those days being the cure deadline.
      The cure period is lengthened by the sum of five extensions in days.
      The tenure extension is long_tenure_ext_days for a resident with at least long_tenure_months full months of tenancy since the move-in date, mid_tenure_ext_days for one with at least mid_tenure_months but fewer than long_tenure_months, and none otherwise.
      The first-notice extension is first_notice_ext_days when no nonpayment notice was served on the lease in the trailing twenty-four calendar months, older_notice_ext_days when one was served in that window but none in the trailing twelve calendar months, and none otherwise.
      The partial-payment extension is half_paid_ext_days when the latest payment, received on or after the due date of the most recent rent charge, is at least half of that period's rent and occupant charges less credits, part_paid_ext_days when it is smaller, and none when no payment was received on or after that due date.
      The steady-payer extension counts the payments received on the lease in the trailing twelve calendar months: at least steady_full_payments give steady_full_ext_days, at least steady_part_payments but fewer than steady_full_payments give steady_part_ext_days, and fewer give none.
      The utility-standing extension reads the utility statement account serving the site: no utility late fee in the trailing twelve calendar months and a utility balance of zero or a credit give utility_current_ext_days, no utility late fee in that window but a balance owing gives utility_owing_ext_days, and otherwise there is none.
      How the lengthened cure period runs on the calendar follows the channel of the latest payment on the lease: when it came through the community office (office_money_order, office_cashiers_check or office_personal_check) the days are office business days, Monday through Friday, because office payments can only be made on those days; when it came through the resident portal (online_portal_ach or online_portal_card) the days are calendar days and a deadline that would fall on a Saturday or Sunday moves to the following Monday; otherwise the days are calendar days as counted.
      However the cure days are counted, the count starts the day after the notice date, and a payment received on the deadline day itself is in time.
      The cure period written on the notice is the resulting number of calendar days from the notice date to the cure deadline.
    prerequisite:
      - problem: lease_ext_late_fee_assessment
        kind: state_gate
        gate: lease_ledger.event_type
        form: state
        policy_source: >-
          A nonpayment notice is not served until the rent ledger carries the late fee owed for every billing period whose grace period has ended with its rent unpaid.
        condition: >-
          lease_ledger holds a lease_late_fee row for every billing period whose rent and occupant charges were unpaid at the end of the last grace day and whose late fee is still owed, that is, has not lapsed because the next rent charge fell due before it was assessed.
        resolved_by: post_late_fee_cfe97caa
        effect: >-
          The notice may be served once the owed late fee is on the ledger; the rent balance it demands then includes that fee.
    cross_category:
      - category: utility
        as: branch
        reads: [utility_balance, utility_ledger.event_type, utility_ledger.entry_date]
        note: The utility-standing extension reads the site's utility balance and its utility late fees in the trailing window.
    compute:
      - community_days: "K('cure_days_willow_palmetto') if (F('community_name') == 'Willow Bend Estates' or F('community_name') == 'Palmetto Shores') else (K('cure_days_saguaro_cedar') if (F('community_name') == 'Saguaro Vista' or F('community_name') == 'Cedar Hollow') else (K('cure_days_bluebonnet') if F('community_name') == 'Bluebonnet Ridge' else K('cure_days_conestoga')))"
      - tenure_ext: "K('long_tenure_ext_days') if MONTHS(F('move_in_date'), NOW) >= K('long_tenure_months') else (K('mid_tenure_ext_days') if MONTHS(F('move_in_date'), NOW) >= K('mid_tenure_months') else 0)"
      - notices_24m: "COUNT('lease_notices', within_months=24, date_field='notice_date', event_type='lease_nonpayment_notice')"
      - notices_12m: "COUNT('lease_notices', within_months=12, date_field='notice_date', event_type='lease_nonpayment_notice')"
      - first_notice_ext: "K('first_notice_ext_days') if notices_24m == 0 else (K('older_notice_ext_days') if notices_12m == 0 else 0)"
      - due_date: "LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_rent_charge')"
      - period: "LATEST('lease_ledger', 'billing_period', date_field='entry_date', event_type='lease_rent_charge')"
      - period_charges: "SUM('lease_ledger', 'amount', event_type='lease_rent_charge', billing_period=period) + SUM('lease_ledger', 'amount', event_type='lease_occupant_charge', billing_period=period) - SUM('lease_ledger', 'amount', event_type='lease_rent_credit', billing_period=period)"
      - paid_since_due: "LATEST('lease_ledger', 'amount', date_field='entry_date', event_type='lease_payment') if DAYS(due_date, LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_payment')) >= 0 else 0"
      - partial_ext: "K('half_paid_ext_days') if paid_since_due >= period_charges / 2 else (K('part_paid_ext_days') if paid_since_due > 0 else 0)"
      - payments_12m: "COUNT('lease_ledger', within_months=12, date_field='entry_date', event_type='lease_payment')"
      - steady_ext: "K('steady_full_ext_days') if payments_12m >= K('steady_full_payments') else (K('steady_part_ext_days') if payments_12m >= K('steady_part_payments') else 0)"
      - utility_late_12m: "XCOUNT('utility', 'utility_ledger', within_months=12, date_field='entry_date', event_type='utility_late_fee')"
      - utility_balance: "CFIELD('utility', 'utility_balance')"
      - utility_ext: "K('utility_current_ext_days') if (utility_late_12m == 0 and utility_balance <= 0) else (K('utility_owing_ext_days') if (utility_late_12m == 0 and utility_balance > 0) else 0)"
      - lengthened_days: "community_days + tenure_ext + first_notice_ext + partial_ext + steady_ext + utility_ext"
      - last_channel: "LATEST('lease_ledger', 'payment_channel', date_field='entry_date', event_type='lease_payment')"
      - notice_weekday: "DAYS('2026-01-05', NOW) % 7"
      - cure_days: "((7 - notice_weekday) + 7 * ((lengthened_days - 1) // 5) + (lengthened_days - 1) % 5 if notice_weekday >= 5 else 7 * (lengthened_days // 5) + lengthened_days % 5 + (2 if notice_weekday + lengthened_days % 5 >= 5 else 0)) if (last_channel == 'office_money_order' or last_channel == 'office_cashiers_check' or last_channel == 'office_personal_check') else (lengthened_days + (2 if (notice_weekday + lengthened_days) % 7 == 5 else (1 if (notice_weekday + lengthened_days) % 7 == 6 else 0)) if (last_channel == 'online_portal_ach' or last_channel == 'online_portal_card') else lengthened_days)"
      - result: "cure_days"
    compute_basis:
      community_days: "The standard cure period is the number of days listed for the community in nonpayment_cure_days (cure_days_willow_palmetto at Willow Bend Estates and Palmetto Shores, cure_days_saguaro_cedar at Saguaro Vista and Cedar Hollow, cure_days_bluebonnet at Bluebonnet Ridge, cure_days_conestoga at Conestoga Meadows), counted in calendar days starting the day after the notice date, the last of those days being the cure deadline."
      tenure_ext: "The tenure extension is long_tenure_ext_days for a resident with at least long_tenure_months full months of tenancy since the move-in date, mid_tenure_ext_days for one with at least mid_tenure_months but fewer than long_tenure_months, and none otherwise."
      notices_24m: "when no nonpayment notice was served on the lease in the trailing twenty-four calendar months"
      notices_12m: "when one was served in that window but none in the trailing twelve calendar months"
      first_notice_ext: "The first-notice extension is first_notice_ext_days when no nonpayment notice was served on the lease in the trailing twenty-four calendar months, older_notice_ext_days when one was served in that window but none in the trailing twelve calendar months, and none otherwise."
      due_date: "received on or after the due date of the most recent rent charge"
      period: "that period's rent and occupant charges less credits"
      period_charges: "that period's rent and occupant charges less credits"
      paid_since_due: "when the latest payment, received on or after the due date of the most recent rent charge"
      partial_ext: "The partial-payment extension is half_paid_ext_days when the latest payment, received on or after the due date of the most recent rent charge, is at least half of that period's rent and occupant charges less credits, part_paid_ext_days when it is smaller, and none when no payment was received on or after that due date."
      payments_12m: "The steady-payer extension counts the payments received on the lease in the trailing twelve calendar months"
      steady_ext: "at least steady_full_payments give steady_full_ext_days, at least steady_part_payments but fewer than steady_full_payments give steady_part_ext_days, and fewer give none."
      utility_late_12m: "no utility late fee in the trailing twelve calendar months"
      utility_balance: "The utility-standing extension reads the utility statement account serving the site"
      utility_ext: "no utility late fee in the trailing twelve calendar months and a utility balance of zero or a credit give utility_current_ext_days, no utility late fee in that window but a balance owing gives utility_owing_ext_days, and otherwise there is none."
      lengthened_days: "The cure period is lengthened by the sum of five extensions in days."
      last_channel: "How the lengthened cure period runs on the calendar follows the channel of the latest payment on the lease"
      notice_weekday: "However the cure days are counted, the count starts the day after the notice date, and a payment received on the deadline day itself is in time."
      cure_days: "when it came through the community office (office_money_order, office_cashiers_check or office_personal_check) the days are office business days, Monday through Friday, because office payments can only be made on those days; when it came through the resident portal (online_portal_ach or online_portal_card) the days are calendar days and a deadline that would fall on a Saturday or Sunday moves to the following Monday; otherwise the days are calendar days as counted."
      result: "The cure period written on the notice is the resulting number of calendar days from the notice date to the cure deadline."
    factors:
      - id: tenure_extension
        effect: parameter
        decides: tenure_ext
        bindings: [tenure_ext]
        ladder:
          - when: "at least long_tenure_months full months of tenancy since the move-in date"
            value: "K('long_tenure_ext_days')"
          - when: "at least mid_tenure_months but fewer than long_tenure_months full months"
            value: "K('mid_tenure_ext_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_ext: "0"
        evidence: [date]
        cross_difficulty: null
      - id: first_notice_extension
        effect: parameter
        decides: first_notice_ext
        bindings: [notices_24m, notices_12m, first_notice_ext]
        ladder:
          - when: "no nonpayment notice on the lease in the trailing twenty-four calendar months"
            value: "K('first_notice_ext_days')"
          - when: "a notice in the trailing twenty-four months but none in the trailing twelve"
            value: "K('older_notice_ext_days')"
          - when: "otherwise (a notice in the trailing twelve months)"
            value: "0"
        baseline:
          first_notice_ext: "0"
        evidence: [history]
        cross_difficulty: null
      - id: partial_payment_extension
        effect: parameter
        decides: partial_ext
        bindings: [paid_since_due, partial_ext]
        ladder:
          - when: "the latest payment, on or after the due date, is at least half of the period's charges less credits"
            value: "K('half_paid_ext_days')"
          - when: "a smaller payment on or after the due date"
            value: "K('part_paid_ext_days')"
          - when: "no payment on or after the due date"
            value: "0"
        baseline:
          partial_ext: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: steady_payer_extension
        effect: parameter
        decides: steady_ext
        bindings: [payments_12m, steady_ext]
        ladder:
          - when: "at least steady_full_payments payments received in the trailing twelve calendar months"
            value: "K('steady_full_ext_days')"
          - when: "at least steady_part_payments but fewer than steady_full_payments"
            value: "K('steady_part_ext_days')"
          - when: "fewer than steady_part_payments"
            value: "0"
        baseline:
          steady_ext: "0"
        evidence: [history]
        cross_difficulty: null
      - id: utility_standing_extension
        effect: parameter
        decides: utility_ext
        bindings: [utility_late_12m, utility_balance, utility_ext]
        ladder:
          - when: "no utility late fee in the trailing twelve calendar months AND a utility balance of zero or a credit"
            value: "K('utility_current_ext_days')"
          - when: "no utility late fee in that window AND a utility balance owing"
            value: "K('utility_owing_ext_days')"
          - when: "otherwise (a utility late fee in the window)"
            value: "0"
        baseline:
          utility_ext: "0"
        evidence: [cross_category, history]
        cross_difficulty: utility
      - id: payment_channel_calendar
        effect: method
        decides: cure_days
        bindings: [last_channel, notice_weekday, cure_days]
        ladder:
          - when: "the latest payment came through the community office (money order, cashier's check or personal check)"
            method: "the cure days are office business days, Monday through Friday"
          - when: "the latest payment came through the resident portal (bank account or card)"
            method: "calendar days, with a deadline falling on a Saturday or Sunday moved to the following Monday"
          - when: "otherwise"
            method: "calendar days as counted"
        baseline:
          cure_days: "lengthened_days"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The amount demanded is the rent balance on the notice date, and the cure deadline is the last day of the cure period worked out below.
        The standard cure period is the number of days listed for the community in nonpayment_cure_days (cure_days_willow_palmetto at Willow Bend Estates and Palmetto Shores, cure_days_saguaro_cedar at Saguaro Vista and Cedar Hollow, cure_days_bluebonnet at Bluebonnet Ridge, cure_days_conestoga at Conestoga Meadows), counted in calendar days starting the day after the notice date, the last of those days being the cure deadline.
        The cure period written on the notice is the resulting number of calendar days from the notice date to the cure deadline.
      params: [cure_days_willow_palmetto, cure_days_saguaro_cedar, cure_days_bluebonnet, cure_days_conestoga]
    inputs:
      history:
        - {table: lease_notices, aggregate: count, field: lease_notice_id, within_months: 24, filters: {event_type: lease_nonpayment_notice}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_payment}}
        - {table: lease_ledger, aggregate: latest, field: payment_channel, filters: {event_type: lease_payment}}
        - {category: utility, table: utility_ledger, aggregate: count, field: utility_entry_id, within_months: 12, filters: {event_type: utility_late_fee}}
      cross_category: [utility]
  - id: lease_ext_plan_down_payment
    base_policy_refs: [lease_evt_payment_acceptance, lease_repayment_terms]
    overwrite:
      - base_policy: lease_evt_payment_acceptance
        superseded_clause: >-
          After a nonpayment notice is served and until it is cured, a payment smaller than the amount demanded is refused, because partial_payment_accepted_after_nonpayment_notice is false.
        replaced_by: >-
          A down payment on a repayment agreement signed the same day is accepted even though it is smaller than the amount demanded by a pending nonpayment notice.
      - base_policy: lease_evt_payment_acceptance
        superseded_clause: >-
          While the lease is on certified_funds_only status and the payment date is on or before certified_funds_until, only a payment through one of the certified_funds_channels is accepted.
        replaced_by: >-
          A down payment on a repayment agreement is accepted only through one of the certified_funds_channels, whether or not the lease is on certified_funds_only status.
      - base_policy: lease_repayment_terms
        superseded_clause: >-
          At least payment_plan_min_down_pct percent of the past-due balance, rounded half up to the cent, is paid on the signing date, and the rest is split into at most payment_plan_max_installments equal monthly installments due on the rent due day starting the next month, the last installment absorbing any rounding difference.
        replaced_by: >-
          The down payment is the fees collected in full plus the reduced percentage of the rest of the covered balance, that percentage part rounded half up to the cent; the percentage reductions are subtracted from the down-payment percentage before it is applied, and they do not act on one another.
    trigger: on_request
    subject: [lease_payment]
    computes: amount
    target_tool: make_lease_payment_8919b7b0
    params:
      standing_long_months: 60
      standing_mid_months: 24
      standing_down_pct: 20.0
      settled_down_pct: 22.5
      half_paid_credit_pct: 2.0
      part_paid_credit_pct: 1.0
      prompt_days: 15
      late_days: 30
      prompt_credit_pct: 1.0
      late_credit_pct: 0.5
      first_lapse_credit_pct: 1.5
      one_lapse_credit_pct: 0.5
    rule: >-
      A repayment agreement on a past-due lease balance starts with a down payment the resident makes on the signing date.
      When a billing period's rent is unpaid long enough for a nonpayment notice to be owed, the down payment on a repayment agreement is not worked out before the notices on the lease carry a nonpayment notice demanding that past-due balance.
      The balance the agreement covers is the amount demanded by the most recent nonpayment notice on the lease.
      The standard down payment is payment_plan_min_down_pct percent of the covered balance, rounded half up to the cent.
      The down-payment percentage is standing_down_pct for a resident with at least standing_long_months full months of tenancy since the move-in date and no repayment agreement signed on the lease in the trailing twenty-four calendar months, settled_down_pct for a resident with at least standing_mid_months but fewer than standing_long_months full months and no agreement in that window, and payment_plan_min_down_pct otherwise.
      That percentage is reduced by half_paid_credit_pct points when the latest payment, received on or after the due date of the most recent rent charge, is at least half of that period's rent and occupant charges less credits, by part_paid_credit_pct points when it is smaller, and not at all when no payment was received on or after that due date.
      It is further reduced by prompt_credit_pct points when the down payment is made within prompt_days calendar days after that due date, by late_credit_pct points when it is made after more than prompt_days but within late_days calendar days, and not at all later.
      It is further reduced by first_lapse_credit_pct points when no late fee for an earlier billing period was posted on the lease in the trailing twelve calendar months, by one_lapse_credit_pct points when exactly one was, and not at all otherwise.
      Which fees are collected in full with the down payment depends on the fees on the covered balance: when a returned-payment fee was posted on the lease within the past month, every late fee of the most recent billing period and every such returned-payment fee are collected in full and the percentage applies to the rest of the covered balance; when no such returned-payment fee was posted but a late fee was posted for the most recent billing period, that late fee is collected in full and the percentage applies to the rest; otherwise the percentage applies to the whole covered balance.
      The down payment is the fees collected in full plus the reduced percentage of the rest of the covered balance, that percentage part rounded half up to the cent; the percentage reductions are subtracted from the down-payment percentage before it is applied, and they do not act on one another.
      A down payment on a repayment agreement signed the same day is accepted even though it is smaller than the amount demanded by a pending nonpayment notice.
      A down payment on a repayment agreement is accepted only through one of the certified_funds_channels, whether or not the lease is on certified_funds_only status.
    prerequisite:
      - problem: lease_ext_nonpayment_cure_period
        kind: value_input
        gate: covered_balance
        form: state
        policy_source: >-
          When a billing period's rent is unpaid long enough for a nonpayment notice to be owed, the down payment on a repayment agreement is not worked out before the notices on the lease carry a nonpayment notice demanding that past-due balance.
        condition: >-
          lease_notices holds a lease_nonpayment_notice row dated on or after the due date of the past-due billing period, whose amount_demanded is the rent balance including every fee posted for that period.
        resolved_by: serve_nonpayment_notice_fb7be621
        effect: >-
          The covered balance the down payment is worked out on becomes the amount demanded by that notice instead of the amount of an older notice.
    cross_category: []
    compute:
      - covered_balance: "LATEST('lease_notices', 'amount_demanded', date_field='notice_date', event_type='lease_nonpayment_notice')"
      - agreements_24m: "COUNT('lease_notices', within_months=24, date_field='notice_date', event_type='lease_repayment_agreement')"
      - down_pct: "K('standing_down_pct') if (MONTHS(F('move_in_date'), NOW) >= K('standing_long_months') and agreements_24m == 0) else (K('settled_down_pct') if (MONTHS(F('move_in_date'), NOW) >= K('standing_mid_months') and MONTHS(F('move_in_date'), NOW) < K('standing_long_months') and agreements_24m == 0) else P('payment_plan_min_down_pct'))"
      - due_date: "LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_rent_charge')"
      - period: "LATEST('lease_ledger', 'billing_period', date_field='entry_date', event_type='lease_rent_charge')"
      - period_charges: "SUM('lease_ledger', 'amount', event_type='lease_rent_charge', billing_period=period) + SUM('lease_ledger', 'amount', event_type='lease_occupant_charge', billing_period=period) - SUM('lease_ledger', 'amount', event_type='lease_rent_credit', billing_period=period)"
      - paid_since_due: "LATEST('lease_ledger', 'amount', date_field='entry_date', event_type='lease_payment') if DAYS(due_date, LATEST('lease_ledger', 'entry_date', date_field='entry_date', event_type='lease_payment')) >= 0 else 0"
      - partial_credit: "K('half_paid_credit_pct') if paid_since_due >= period_charges / 2 else (K('part_paid_credit_pct') if paid_since_due > 0 else 0.0)"
      - days_past_due: "DAYS(due_date, NOW)"
      - prompt_credit: "K('prompt_credit_pct') if days_past_due <= K('prompt_days') else (K('late_credit_pct') if days_past_due <= K('late_days') else 0.0)"
      - earlier_late_fees_12m: "COUNT('lease_ledger', within_months=12, date_field='entry_date', event_type='lease_late_fee') - COUNT('lease_ledger', event_type='lease_late_fee', billing_period=period)"
      - lapse_credit: "K('first_lapse_credit_pct') if earlier_late_fees_12m == 0 else (K('one_lapse_credit_pct') if earlier_late_fees_12m == 1 else 0.0)"
      - period_late_fees: "SUM('lease_ledger', 'amount', event_type='lease_late_fee', billing_period=period)"
      - recent_returned_fees: "SUM('lease_ledger', 'amount', within_months=1, date_field='entry_date', event_type='lease_nsf_fee')"
      - fees_up_front: "period_late_fees + recent_returned_fees if recent_returned_fees > 0 else (period_late_fees if period_late_fees > 0 else 0.0)"
      - applied_pct: "down_pct - partial_credit - prompt_credit - lapse_credit"
      - result: "RND(fees_up_front + RND((covered_balance - fees_up_front) * applied_pct / 100 + 0.000001, 2) + 0.000001, 2)"
    compute_basis:
      covered_balance: "The balance the agreement covers is the amount demanded by the most recent nonpayment notice on the lease."
      agreements_24m: "no repayment agreement signed on the lease in the trailing twenty-four calendar months"
      down_pct: "The down-payment percentage is standing_down_pct for a resident with at least standing_long_months full months of tenancy since the move-in date and no repayment agreement signed on the lease in the trailing twenty-four calendar months, settled_down_pct for a resident with at least standing_mid_months but fewer than standing_long_months full months and no agreement in that window, and payment_plan_min_down_pct otherwise."
      due_date: "received on or after the due date of the most recent rent charge"
      period: "that period's rent and occupant charges less credits"
      period_charges: "that period's rent and occupant charges less credits"
      paid_since_due: "when the latest payment, received on or after the due date of the most recent rent charge"
      partial_credit: "That percentage is reduced by half_paid_credit_pct points when the latest payment, received on or after the due date of the most recent rent charge, is at least half of that period's rent and occupant charges less credits, by part_paid_credit_pct points when it is smaller, and not at all when no payment was received on or after that due date."
      days_past_due: "when the down payment is made within prompt_days calendar days after that due date"
      prompt_credit: "It is further reduced by prompt_credit_pct points when the down payment is made within prompt_days calendar days after that due date, by late_credit_pct points when it is made after more than prompt_days but within late_days calendar days, and not at all later."
      earlier_late_fees_12m: "when no late fee for an earlier billing period was posted on the lease in the trailing twelve calendar months"
      lapse_credit: "It is further reduced by first_lapse_credit_pct points when no late fee for an earlier billing period was posted on the lease in the trailing twelve calendar months, by one_lapse_credit_pct points when exactly one was, and not at all otherwise."
      period_late_fees: "a late fee was posted for the most recent billing period"
      recent_returned_fees: "when a returned-payment fee was posted on the lease within the past month"
      fees_up_front: "when a returned-payment fee was posted on the lease within the past month, every late fee of the most recent billing period and every such returned-payment fee are collected in full and the percentage applies to the rest of the covered balance; when no such returned-payment fee was posted but a late fee was posted for the most recent billing period, that late fee is collected in full and the percentage applies to the rest; otherwise the percentage applies to the whole covered balance."
      applied_pct: "the percentage reductions are subtracted from the down-payment percentage before it is applied, and they do not act on one another."
      result: "The down payment is the fees collected in full plus the reduced percentage of the rest of the covered balance, that percentage part rounded half up to the cent"
    factors:
      - id: standing_down_percentage
        effect: parameter
        decides: down_pct
        bindings: [agreements_24m, down_pct]
        ladder:
          - when: "at least standing_long_months full months of tenancy AND no repayment agreement on the lease in the trailing twenty-four calendar months"
            value: "K('standing_down_pct')"
          - when: "at least standing_mid_months but fewer than standing_long_months full months AND no agreement in that window"
            value: "K('settled_down_pct')"
          - when: "otherwise"
            value: "P('payment_plan_min_down_pct')"
        baseline:
          down_pct: "P('payment_plan_min_down_pct')"
        evidence: [date, history]
        cross_difficulty: null
      - id: fees_up_front_method
        effect: method
        decides: fees_up_front
        bindings: [period_late_fees, recent_returned_fees, fees_up_front]
        ladder:
          - when: "a returned-payment fee posted on the lease within the past month"
            method: "the period's late fees and those returned-payment fees are collected in full; the percentage applies to the rest"
          - when: "no such returned-payment fee, but a late fee posted for the most recent billing period"
            method: "that late fee is collected in full; the percentage applies to the rest"
          - when: "otherwise"
            method: "the percentage applies to the whole covered balance"
        baseline:
          fees_up_front: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: partial_payment_credit
        effect: parameter
        decides: partial_credit
        bindings: [paid_since_due, partial_credit]
        ladder:
          - when: "the latest payment, on or after the due date, is at least half of the period's charges less credits"
            value: "K('half_paid_credit_pct')"
          - when: "a smaller payment on or after the due date"
            value: "K('part_paid_credit_pct')"
          - when: "no payment on or after the due date"
            value: "0.0"
        baseline:
          partial_credit: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: prompt_arrangement_credit
        effect: parameter
        decides: prompt_credit
        bindings: [days_past_due, prompt_credit]
        ladder:
          - when: "down payment made within prompt_days calendar days after the due date"
            value: "K('prompt_credit_pct')"
          - when: "after more than prompt_days but within late_days calendar days"
            value: "K('late_credit_pct')"
          - when: "later"
            value: "0.0"
        baseline:
          prompt_credit: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: first_lapse_credit
        effect: parameter
        decides: lapse_credit
        bindings: [earlier_late_fees_12m, lapse_credit]
        ladder:
          - when: "no late fee for an earlier billing period in the trailing twelve calendar months"
            value: "K('first_lapse_credit_pct')"
          - when: "exactly one such late fee"
            value: "K('one_lapse_credit_pct')"
          - when: "two or more"
            value: "0.0"
        baseline:
          lapse_credit: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The balance the agreement covers is the amount demanded by the most recent nonpayment notice on the lease.
        The standard down payment is payment_plan_min_down_pct percent of the covered balance, rounded half up to the cent.
      params: [payment_plan_min_down_pct]
    inputs:
      history:
        - {table: lease_notices, aggregate: latest, field: amount_demanded, filters: {event_type: lease_nonpayment_notice}}
        - {table: lease_notices, aggregate: count, field: lease_notice_id, within_months: 24, filters: {event_type: lease_repayment_agreement}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 12, filters: {event_type: lease_late_fee}}
        - {table: lease_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: lease_nsf_fee}}
      cross_category: []
  - id: lease_ext_plan_installments
    base_policy_refs: [lease_repayment_terms, lease_nonpayment_process]
    overwrite:
      - base_policy: lease_repayment_terms
        superseded_clause: >-
          At least payment_plan_min_down_pct percent of the past-due balance, rounded half up to the cent, is paid on the signing date, and the rest is split into at most payment_plan_max_installments equal monthly installments due on the rent due day starting the next month, the last installment absorbing any rounding difference.
        replaced_by: >-
          The number of installments is the plan months, after the tenure and utility adjustments, times the installments per plan month, and each installment is the balance left to spread divided by that number, rounded half up to the cent, the last installment absorbing any rounding difference.
      - base_policy: lease_nonpayment_process
        superseded_clause: >-
          Paying the full amount demanded by the deadline cures the notice and the lease stays active; a smaller payment is refused under lease_evt_payment_acceptance.
        replaced_by: >-
          Paying the full amount demanded by the cure deadline cures a nonpayment notice, and so does a repayment agreement signed before that deadline that covers the whole amount demanded; the lease then stays active while the installments are paid on time.
    trigger: on_request
    subject: [lease_repayment_agreement]
    computes: installment_amount
    target_tool: sign_repayment_agreement_730960e3
    params:
      short_plan_rent_share: 0.6
      long_plan_rent_share: 1.2
      dollars_per_plan_month: 200.00
      rent_share_per_plan_month: 0.5
      long_tenure_months: 120
      mid_tenure_months: 60
      long_tenure_added_months: 2
      mid_tenure_added_months: 1
      utility_lookback_months: 12
      utility_owing_limit: 100.00
      utility_current_months: 1
      utility_behind_months: -1
      schedule_lookback_months: 6
      weekly_payments: 20
      split_payments: 9
      weekly_per_month: 4
      split_per_month: 2
    rule: >-
      A repayment agreement spreads the covered balance that is left after the down payment over installments, and the resident signs it on the day the down payment is made.
      The installments of a repayment agreement are fixed only after the notices on the lease carry the nonpayment notice whose amount demanded the agreement covers.
      Before the installments of a repayment agreement are fixed, the rent ledger must carry the down payment received on the signing date.
      The balance left to spread is the lease balance once the down payment is received.
      The standard plan runs payment_plan_max_installments monthly installments due on the rent due day starting the next month, each the balance left to spread divided by the number of installments, rounded half up to the cent, the last installment absorbing any rounding difference.
      The covered balance is the amount demanded by the most recent nonpayment notice on the lease.
      How the plan length is set depends on the covered balance compared with the monthly site rent: a covered balance of no more than short_plan_rent_share of the monthly site rent runs one plan month for each dollars_per_plan_month of it or part thereof; a covered balance above long_plan_rent_share of the monthly site rent runs one plan month for each rent_share_per_plan_month of the monthly site rent in it or part thereof; any other covered balance runs payment_plan_max_installments plan months.
      Tenure adds plan months: long_tenure_added_months for a resident with at least long_tenure_months full months of tenancy since the move-in date, mid_tenure_added_months for a resident with at least mid_tenure_months but fewer than long_tenure_months, and none otherwise.
      The site's utility standing adjusts the plan length: no utility late fee in the trailing utility_lookback_months calendar months together with a utility balance of zero or a credit adds utility_current_months plan month; a utility late fee in that window or a utility balance above utility_owing_limit adds utility_behind_months plan month, that is, takes one away; otherwise there is no adjustment.
      The schedule follows how the resident has paid in the trailing schedule_lookback_months calendar months: with at least weekly_payments payments received the installments fall weekly, weekly_per_month per plan month; with at least split_payments but fewer than weekly_payments payments they fall twice a month, on the rent due day and on the fifteenth, split_per_month per plan month; otherwise they fall monthly on the rent due day, one per plan month; in every schedule the first installment is due on the rent due day of the next month.
      The number of installments is the plan months, after the tenure and utility adjustments, times the installments per plan month, and each installment is the balance left to spread divided by that number, rounded half up to the cent, the last installment absorbing any rounding difference.
      Paying the full amount demanded by the cure deadline cures a nonpayment notice, and so does a repayment agreement signed before that deadline that covers the whole amount demanded; the lease then stays active while the installments are paid on time.
    prerequisite:
      - problem: lease_ext_nonpayment_cure_period
        kind: value_input
        gate: covered_balance
        form: state
        policy_source: >-
          The installments of a repayment agreement are fixed only after the notices on the lease carry the nonpayment notice whose amount demanded the agreement covers.
        condition: >-
          lease_notices holds the lease_nonpayment_notice for the current past-due balance, so that the most recent nonpayment notice's amount_demanded is that balance.
        resolved_by: serve_nonpayment_notice_fb7be621
        effect: >-
          The covered balance the plan length is read from becomes the amount demanded by the current notice instead of an older notice's amount.
      - problem: lease_ext_plan_down_payment
        kind: value_input
        gate: remaining_balance
        form: state
        policy_source: >-
          Before the installments of a repayment agreement are fixed, the rent ledger must carry the down payment received on the signing date.
        condition: >-
          lease_ledger holds a lease_payment dated the signing date for the down payment, and lease_holdings.rent_balance reflects it.
        resolved_by: make_lease_payment_8919b7b0
        effect: >-
          The balance left to spread becomes the lease balance net of the down payment, which every installment divides.
    cross_category:
      - category: utility
        as: branch
        reads: [utility_balance, utility_ledger.event_type, utility_ledger.entry_date]
        note: The utility-standing adjustment of the plan length reads the site's utility balance and utility late fees in the trailing window.
    compute:
      - covered_balance: "LATEST('lease_notices', 'amount_demanded', date_field='notice_date', event_type='lease_nonpayment_notice')"
      - base_months: "-(-covered_balance // K('dollars_per_plan_month')) if covered_balance <= F('monthly_site_rent') * K('short_plan_rent_share') else (-(-covered_balance // (F('monthly_site_rent') * K('rent_share_per_plan_month'))) if covered_balance > F('monthly_site_rent') * K('long_plan_rent_share') else P('payment_plan_max_installments'))"
      - tenure_months_added: "K('long_tenure_added_months') if MONTHS(F('move_in_date'), NOW) >= K('long_tenure_months') else (K('mid_tenure_added_months') if MONTHS(F('move_in_date'), NOW) >= K('mid_tenure_months') else 0)"
      - utility_late_12m: "XCOUNT('utility', 'utility_ledger', within_months=K('utility_lookback_months'), date_field='entry_date', event_type='utility_late_fee')"
      - utility_balance: "CFIELD('utility', 'utility_balance')"
      - utility_months: "K('utility_current_months') if (utility_late_12m == 0 and utility_balance <= 0) else (K('utility_behind_months') if (utility_late_12m >= 1 or utility_balance > K('utility_owing_limit')) else 0)"
      - plan_months: "base_months + tenure_months_added + utility_months"
      - payments_6m: "COUNT('lease_ledger', within_months=K('schedule_lookback_months'), date_field='entry_date', event_type='lease_payment')"
      - per_month: "K('weekly_per_month') if payments_6m >= K('weekly_payments') else (K('split_per_month') if payments_6m >= K('split_payments') else 1)"
      - remaining_balance: "F('rent_balance')"
      - result: "RND(remaining_balance / (plan_months * per_month) + 0.000001, 2)"
    compute_basis:
      covered_balance: "The covered balance is the amount demanded by the most recent nonpayment notice on the lease."
      base_months: "a covered balance of no more than short_plan_rent_share of the monthly site rent runs one plan month for each dollars_per_plan_month of it or part thereof; a covered balance above long_plan_rent_share of the monthly site rent runs one plan month for each rent_share_per_plan_month of the monthly site rent in it or part thereof; any other covered balance runs payment_plan_max_installments plan months."
      tenure_months_added: "Tenure adds plan months: long_tenure_added_months for a resident with at least long_tenure_months full months of tenancy since the move-in date, mid_tenure_added_months for a resident with at least mid_tenure_months but fewer than long_tenure_months, and none otherwise."
      utility_late_12m: "no utility late fee in the trailing utility_lookback_months calendar months"
      utility_balance: "a utility balance of zero or a credit"
      utility_months: "no utility late fee in the trailing utility_lookback_months calendar months together with a utility balance of zero or a credit adds utility_current_months plan month; a utility late fee in that window or a utility balance above utility_owing_limit adds utility_behind_months plan month, that is, takes one away; otherwise there is no adjustment."
      plan_months: "the plan months, after the tenure and utility adjustments"
      payments_6m: "The schedule follows how the resident has paid in the trailing schedule_lookback_months calendar months"
      per_month: "with at least weekly_payments payments received the installments fall weekly, weekly_per_month per plan month; with at least split_payments but fewer than weekly_payments payments they fall twice a month, on the rent due day and on the fifteenth, split_per_month per plan month; otherwise they fall monthly on the rent due day, one per plan month"
      remaining_balance: "The balance left to spread is the lease balance once the down payment is received."
      result: "The number of installments is the plan months, after the tenure and utility adjustments, times the installments per plan month, and each installment is the balance left to spread divided by that number, rounded half up to the cent, the last installment absorbing any rounding difference."
    factors:
      - id: covered_size_plan_length
        effect: method
        decides: base_months
        bindings: [covered_balance, base_months]
        ladder:
          - when: "covered balance no more than short_plan_rent_share of the monthly site rent"
            method: "plan months are counted from the dollars owed: one for each dollars_per_plan_month of the covered balance or part thereof"
          - when: "covered balance above long_plan_rent_share of the monthly site rent"
            method: "plan months are counted from the rent owed: one for each rent_share_per_plan_month of the monthly site rent in the covered balance or part thereof"
          - when: "otherwise"
            method: "the plan runs the standard payment_plan_max_installments months"
        baseline:
          base_months: "P('payment_plan_max_installments')"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_added_months
        effect: parameter
        decides: tenure_months_added
        bindings: [tenure_months_added]
        ladder:
          - when: "at least long_tenure_months full months of tenancy since the move-in date"
            value: "K('long_tenure_added_months')"
          - when: "at least mid_tenure_months but fewer than long_tenure_months"
            value: "K('mid_tenure_added_months')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_months_added: "0"
        evidence: [date]
        cross_difficulty: null
      - id: utility_standing_months
        effect: parameter
        decides: utility_months
        bindings: [utility_late_12m, utility_balance, utility_months]
        ladder:
          - when: "no utility late fee in the trailing twelve calendar months AND a utility balance of zero or a credit"
            value: "K('utility_current_months')"
          - when: "a utility late fee in that window OR a utility balance above utility_owing_limit"
            value: "K('utility_behind_months')"
          - when: "otherwise"
            value: "0"
        baseline:
          utility_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: utility
      - id: payment_rhythm_schedule
        effect: parameter
        decides: per_month
        bindings: [payments_6m, per_month]
        ladder:
          - when: "at least weekly_payments payments received in the trailing six calendar months"
            value: "K('weekly_per_month')"
          - when: "at least split_payments but fewer than weekly_payments payments"
            value: "K('split_per_month')"
          - when: "otherwise"
            value: "1"
        baseline:
          per_month: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The balance left to spread is the lease balance once the down payment is received.
        The standard plan runs payment_plan_max_installments monthly installments due on the rent due day starting the next month, each the balance left to spread divided by the number of installments, rounded half up to the cent, the last installment absorbing any rounding difference.
      params: [payment_plan_max_installments]
    inputs:
      history:
        - {table: lease_notices, aggregate: latest, field: amount_demanded, filters: {event_type: lease_nonpayment_notice}}
        - {table: lease_ledger, aggregate: count, field: lease_entry_id, within_months: 6, filters: {event_type: lease_payment}}
        - {category: utility, table: utility_ledger, aggregate: count, field: utility_entry_id, within_months: 12, filters: {event_type: utility_late_fee}}
      cross_category: [utility]
