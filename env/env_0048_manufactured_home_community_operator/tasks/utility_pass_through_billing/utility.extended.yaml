  baseline:
    rule: >-
      A water usage charge bills the consumption carried by the water read it bills, which is the latest water read
      on the account. The standard water usage charge prices that consumption in three blocks: the part up to the
      schedule's first-block bound at the first-block rate, the part above the first-block bound up to the schedule's
      second-block bound at the second-block rate, and the rest at the third-block rate. The water usage charge
      is rounded half up to the cent once, on the total of its parts; the water base charge is billed separately
