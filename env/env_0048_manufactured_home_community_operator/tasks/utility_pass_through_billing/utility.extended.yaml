- id: utility_ext_final_credit_refund
  base_policy_refs:
  - utility_agg_account_settlement
  - utility_final_billing
  overwrite:
  - base_policy: utility_agg_account_settlement
    superseded_clause: >-
      A credit balance left on a final-billed account is refunded by check to the former resident at closing rather
      than carried to any other account.
    replaced_by: >-
      A refund is never below zero, no more than 250.00 dollars of standard refund is issued at one time, any credit
      not refunded stays on the account for a later refund, and the refund is rounded half up to the cent once,
      on the final figure.
  trigger: on_request
  subject:
  - utility_credit_refund
  computes: amount
  target_tool: request_credit_refund_3a7a9c57
  params:
    lookback_months: 12
    standard_check_hold_days: 5
    late_check_hold_days: 10
    returned_check_hold_days: 15
    autopay_months: 6
    standard_bank_hold_days: 2
    new_bank_hold_days: 4
    autopay_bank_hold_days: 1
    fresh_reserve_days: 30
    aging_reserve_days: 60
    fresh_reserve_share: 0.5
    aging_reserve_share: 0.25
    estimate_window_months: 2
    month_days: 30
    short_final_days: 10
    standard_refund_limit: 250.0
    mid_refund_limit: 600.0
    long_refund_limit: 1000.0
    mid_limit_months: 60
    long_limit_months: 180
  rule: >-
    A credit balance left on a final-billed utility account is refunded by check to the former resident at the mailing
    address on the profile, on the former resident's request. A credit balance is not refunded until a late fee
    stands on the account for every statement whose unpaid amount at the end of its grace period reached the late-fee
    minimum. The standard refund is the credit balance less the most recent personal-check payment when fewer than
    5 days have passed since it was received, and less the most recent bank-account payment made through the resident
    portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
    date from the handling date. A refund is never below zero, no more than 250.00 dollars of standard refund is
    issued at one time, any credit not refunded stays on the account for a later refund, and the refund is rounded
    half up to the cent once, on the final figure. The holding periods and the refund limit stated below replace
    the standard ones where they apply, and the true-up reserve stated below, where it applies, is deducted from
    the credit balance as well; a period of N months below counts an entry when fewer than N whole months separate
    its date from the handling date. The holding period for the most recent personal-check payment is 15 days where
    a returned payment stands on the lease ledger or on the utility account in the last twelve months, 10 days where
    neither carries a returned payment in the last twelve months but a late fee stands on the utility account and
    a late fee stands on the lease ledger in that period, and 5 days otherwise. The holding period for the most
    recent bank-account payment made through the resident portal is 1 day where the lease ledger shows an automatic
    bank draft paid in the last six months, 4 days where the lease ledger shows no such draft and the utility account
    carries no more than one bank-account payment, through the portal or by automatic draft, in the last twelve
    months, and 2 days otherwise. Where the latest water read on the account is an estimated read, a true-up reserve
    of 50 percent of the reserve base is held when no more than 30 days have passed since that read's date and of
    25 percent when 31 to 60 days have passed; no reserve is held where the latest water read is not an estimated
    read or more than 60 days have passed since it; the reserve is rounded half up to the cent. The reserve base
    is the sum of every water usage charge dated in the last two months where the account has two or more estimated
    water reads taken in the last two months; it is the latest water usage charge scaled to a full month, that charge
    times 30 divided by the days of service billed on the trash charge of the latest statement, where the account
    has exactly one estimated water read taken in the last two months and those days of service are fewer than 10;
    otherwise it is the latest water usage charge. No more than 1,000.00 dollars is refunded at one time for an
    account whose service began 180 or more whole months before the handling date, and no more than 600.00 dollars
    for one whose service began 60 to 179 whole months before; a newer account keeps the standard limit.
  prerequisite:
  - problem: utility_ext_statement_late_fee
    kind: value_input
    gate: credit
    form: state
    policy_source: >-
      A credit balance is not refunded until a late fee stands on the account for every statement whose unpaid amount
      at the end of its grace period reached the late-fee minimum.
    condition: >-
      For every statement whose unpaid amount at the end of its grace period reached the schedule's late-fee minimum,
      a utility late fee row (event_type utility_late_fee) stands on the account for that statement month.
    resolved_by: post_late_fee_5fe5b1d1
    effect: >-
      The late fee raises the utility balance by the fee, so the credit balance (credit) the refund is figured on
      shrinks by exactly that fee.
  cross_category:
  - category: lease
    as: history
    reads:
    - lease_ledger.event_type
    - lease_ledger.payment_channel
    - lease_ledger.entry_date
    note: >-
      Returned payments and late fees on the lease ledger decide the personal-check holding period; automatic bank
      drafts on the lease ledger decide the bank-payment holding period.
  compute:
  - credit: MX(0 - F('utility_balance'), 0)
  - lease_returns: >-
      XCOUNT('lease', 'lease_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='lease_payment_return')
  - utility_returns: >-
      COUNT('utility_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='utility_payment_return')
  - utility_late: >-
      COUNT('utility_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='utility_late_fee')
  - lease_late: >-
      XCOUNT('lease', 'lease_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='lease_late_fee')
  - check_hold_days: >-
      K('returned_check_hold_days') if (lease_returns > 0 or utility_returns > 0) else (K('late_check_hold_days')
      if (utility_late > 0 and lease_late > 0 and lease_returns + utility_returns == 0) else K('standard_check_hold_days'))
  - check_count: >-
      COUNT('utility_ledger', date_field='entry_date', event_type='utility_payment', payment_channel='office_personal_check')
  - last_check_date: >-
      LATEST('utility_ledger', 'entry_date', date_field='entry_date', event_type='utility_payment', payment_channel='office_personal_check')
  - last_check_amount: >-
      LATEST('utility_ledger', 'amount', date_field='entry_date', event_type='utility_payment', payment_channel='office_personal_check')
  - held_check: last_check_amount if (check_count > 0 and DAYS(last_check_date, NOW) < check_hold_days) else 0.0
  - lease_autopay: >-
      XCOUNT('lease', 'lease_ledger', within_months=K('autopay_months'), date_field='entry_date', event_type='lease_payment',
      payment_channel='ach_autopay')
  - utility_bank_payments: >-
      COUNT('utility_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='utility_payment',
      payment_channel='online_portal_ach') + COUNT('utility_ledger', within_months=K('lookback_months'), date_field='entry_date',
      event_type='utility_payment', payment_channel='ach_autopay')
  - bank_hold_days: >-
      K('autopay_bank_hold_days') if lease_autopay > 0 else (K('new_bank_hold_days') if (lease_autopay == 0 and
      utility_bank_payments <= 1) else K('standard_bank_hold_days'))
  - bank_count: >-
      COUNT('utility_ledger', date_field='entry_date', event_type='utility_payment', payment_channel='online_portal_ach')
  - last_bank_date: >-
      LATEST('utility_ledger', 'entry_date', date_field='entry_date', event_type='utility_payment', payment_channel='online_portal_ach')
  - last_bank_amount: >-
      LATEST('utility_ledger', 'amount', date_field='entry_date', event_type='utility_payment', payment_channel='online_portal_ach')
  - held_bank: last_bank_amount if (bank_count > 0 and DAYS(last_bank_date, NOW) < bank_hold_days) else 0.0
  - latest_read_type: >-
      LATEST('utility_ledger', 'read_type', date_field='entry_date', event_type='utility_meter_read', utility_service='water')
  - latest_read_date: >-
      LATEST('utility_ledger', 'entry_date', date_field='entry_date', event_type='utility_meter_read', utility_service='water')
  - reserve_share: >-
      K('fresh_reserve_share') if (latest_read_type == 'estimated' and DAYS(latest_read_date, NOW) <= K('fresh_reserve_days'))
      else (K('aging_reserve_share') if (latest_read_type == 'estimated' and DAYS(latest_read_date, NOW) > K('fresh_reserve_days')
      and DAYS(latest_read_date, NOW) <= K('aging_reserve_days')) else 0.0)
  - latest_usage_charge: >-
      LATEST('utility_ledger', 'amount', date_field='entry_date', event_type='utility_usage_charge', utility_service='water')
  - recent_estimates: >-
      COUNT('utility_ledger', within_months=K('estimate_window_months'), date_field='entry_date', event_type='utility_meter_read',
      utility_service='water', read_type='estimated')
  - final_days_billed: >-
      LATEST('utility_ledger', 'days_billed', date_field='entry_date', event_type='utility_fixed_charge', utility_service='trash')
  - reserve_base: >-
      SUM('utility_ledger', 'amount', within_months=K('estimate_window_months'), date_field='entry_date', event_type='utility_usage_charge',
      utility_service='water') if recent_estimates >= 2 else ((latest_usage_charge * K('month_days') / final_days_billed)
      if (recent_estimates == 1 and final_days_billed < K('short_final_days')) else latest_usage_charge)
  - reserve: RND(reserve_base * reserve_share, 2)
  - service_months: MONTHS(F('service_start_date'), NOW)
  - refund_limit: >-
      K('long_refund_limit') if service_months >= K('long_limit_months') else (K('mid_refund_limit') if service_months
      >= K('mid_limit_months') else K('standard_refund_limit'))
  - result: RND(MN(MX(credit - held_check - held_bank - reserve, 0), refund_limit), 2)
  compute_basis:
    credit: >-
      A credit balance left on a final-billed utility account is refunded by check to the former resident at the
      mailing address on the profile, on the former resident's request.
    lease_returns: >-
      The holding period for the most recent personal-check payment is 15 days where a returned payment stands on
      the lease ledger or on the utility account in the last twelve months, 10 days where neither carries a returned
      payment in the last twelve months but a late fee stands on the utility account and a late fee stands on the
      lease ledger in that period, and 5 days otherwise.
    utility_returns: >-
      The holding period for the most recent personal-check payment is 15 days where a returned payment stands on
      the lease ledger or on the utility account in the last twelve months, 10 days where neither carries a returned
      payment in the last twelve months but a late fee stands on the utility account and a late fee stands on the
      lease ledger in that period, and 5 days otherwise.
    utility_late: >-
      The holding period for the most recent personal-check payment is 15 days where a returned payment stands on
      the lease ledger or on the utility account in the last twelve months, 10 days where neither carries a returned
      payment in the last twelve months but a late fee stands on the utility account and a late fee stands on the
      lease ledger in that period, and 5 days otherwise.
    lease_late: >-
      The holding period for the most recent personal-check payment is 15 days where a returned payment stands on
      the lease ledger or on the utility account in the last twelve months, 10 days where neither carries a returned
      payment in the last twelve months but a late fee stands on the utility account and a late fee stands on the
      lease ledger in that period, and 5 days otherwise.
    check_hold_days: >-
      The holding period for the most recent personal-check payment is 15 days where a returned payment stands on
      the lease ledger or on the utility account in the last twelve months, 10 days where neither carries a returned
      payment in the last twelve months but a late fee stands on the utility account and a late fee stands on the
      lease ledger in that period, and 5 days otherwise.
    check_count: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    last_check_date: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    last_check_amount: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    held_check: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    lease_autopay: >-
      The holding period for the most recent bank-account payment made through the resident portal is 1 day where
      the lease ledger shows an automatic bank draft paid in the last six months, 4 days where the lease ledger
      shows no such draft and the utility account carries no more than one bank-account payment, through the portal
      or by automatic draft, in the last twelve months, and 2 days otherwise.
    utility_bank_payments: >-
      The holding period for the most recent bank-account payment made through the resident portal is 1 day where
      the lease ledger shows an automatic bank draft paid in the last six months, 4 days where the lease ledger
      shows no such draft and the utility account carries no more than one bank-account payment, through the portal
      or by automatic draft, in the last twelve months, and 2 days otherwise.
    bank_hold_days: >-
      The holding period for the most recent bank-account payment made through the resident portal is 1 day where
      the lease ledger shows an automatic bank draft paid in the last six months, 4 days where the lease ledger
      shows no such draft and the utility account carries no more than one bank-account payment, through the portal
      or by automatic draft, in the last twelve months, and 2 days otherwise.
    bank_count: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    last_bank_date: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    last_bank_amount: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    held_bank: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date.
    latest_read_type: >-
      Where the latest water read on the account is an estimated read, a true-up reserve of 50 percent of the reserve
      base is held when no more than 30 days have passed since that read's date and of 25 percent when 31 to 60
      days have passed; no reserve is held where the latest water read is not an estimated read or more than 60
      days have passed since it; the reserve is rounded half up to the cent.
    latest_read_date: >-
      Where the latest water read on the account is an estimated read, a true-up reserve of 50 percent of the reserve
      base is held when no more than 30 days have passed since that read's date and of 25 percent when 31 to 60
      days have passed; no reserve is held where the latest water read is not an estimated read or more than 60
      days have passed since it; the reserve is rounded half up to the cent.
    reserve_share: >-
      Where the latest water read on the account is an estimated read, a true-up reserve of 50 percent of the reserve
      base is held when no more than 30 days have passed since that read's date and of 25 percent when 31 to 60
      days have passed; no reserve is held where the latest water read is not an estimated read or more than 60
      days have passed since it; the reserve is rounded half up to the cent.
    latest_usage_charge: >-
      The reserve base is the sum of every water usage charge dated in the last two months where the account has
      two or more estimated water reads taken in the last two months; it is the latest water usage charge scaled
      to a full month, that charge times 30 divided by the days of service billed on the trash charge of the latest
      statement, where the account has exactly one estimated water read taken in the last two months and those days
      of service are fewer than 10; otherwise it is the latest water usage charge.
    recent_estimates: >-
      The reserve base is the sum of every water usage charge dated in the last two months where the account has
      two or more estimated water reads taken in the last two months; it is the latest water usage charge scaled
      to a full month, that charge times 30 divided by the days of service billed on the trash charge of the latest
      statement, where the account has exactly one estimated water read taken in the last two months and those days
      of service are fewer than 10; otherwise it is the latest water usage charge.
    final_days_billed: >-
      The reserve base is the sum of every water usage charge dated in the last two months where the account has
      two or more estimated water reads taken in the last two months; it is the latest water usage charge scaled
      to a full month, that charge times 30 divided by the days of service billed on the trash charge of the latest
      statement, where the account has exactly one estimated water read taken in the last two months and those days
      of service are fewer than 10; otherwise it is the latest water usage charge.
    reserve_base: >-
      The reserve base is the sum of every water usage charge dated in the last two months where the account has
      two or more estimated water reads taken in the last two months; it is the latest water usage charge scaled
      to a full month, that charge times 30 divided by the days of service billed on the trash charge of the latest
      statement, where the account has exactly one estimated water read taken in the last two months and those days
      of service are fewer than 10; otherwise it is the latest water usage charge.
    reserve: >-
      Where the latest water read on the account is an estimated read, a true-up reserve of 50 percent of the reserve
      base is held when no more than 30 days have passed since that read's date and of 25 percent when 31 to 60
      days have passed; no reserve is held where the latest water read is not an estimated read or more than 60
      days have passed since it; the reserve is rounded half up to the cent. The holding periods and the refund
      limit stated below replace the standard ones where they apply, and the true-up reserve stated below, where
      it applies, is deducted from the credit balance as well; a period of N months below counts an entry when fewer
      than N whole months separate its date from the handling date.
    service_months: >-
      No more than 1,000.00 dollars is refunded at one time for an account whose service began 180 or more whole
      months before the handling date, and no more than 600.00 dollars for one whose service began 60 to 179 whole
      months before; a newer account keeps the standard limit.
    refund_limit: >-
      No more than 1,000.00 dollars is refunded at one time for an account whose service began 180 or more whole
      months before the handling date, and no more than 600.00 dollars for one whose service began 60 to 179 whole
      months before; a newer account keeps the standard limit. A refund is never below zero, no more than 250.00
      dollars of standard refund is issued at one time, any credit not refunded stays on the account for a later
      refund, and the refund is rounded half up to the cent once, on the final figure.
    result: >-
      The standard refund is the credit balance less the most recent personal-check payment when fewer than 5 days
      have passed since it was received, and less the most recent bank-account payment made through the resident
      portal when fewer than 2 days have passed since it was received, the days counted by subtracting the receipt
      date from the handling date. A refund is never below zero, no more than 250.00 dollars of standard refund
      is issued at one time, any credit not refunded stays on the account for a later refund, and the refund is
      rounded half up to the cent once, on the final figure. The holding periods and the refund limit stated below
      replace the standard ones where they apply, and the true-up reserve stated below, where it applies, is deducted
      from the credit balance as well; a period of N months below counts an entry when fewer than N whole months
      separate its date from the handling date.
  factors:
  - id: check_holding_period
    effect: parameter
    decides: check_hold_days
    bindings:
    - lease_returns
    - utility_returns
    - utility_late
    - lease_late
    - check_hold_days
    ladder:
    - when: >-
        a returned payment on the lease ledger or a returned payment on the utility account in the last twelve months
      value: K('returned_check_hold_days')
    - when: >-
        no returned payment on either in the last twelve months, and a late fee on the utility account and a late
        fee on the lease ledger in that period
      value: K('late_check_hold_days')
    - when: otherwise
      value: K('standard_check_hold_days')
    baseline:
      check_hold_days: K('standard_check_hold_days')
    evidence:
    - history
    - cross_category
    cross_difficulty: lease
  - id: bank_payment_holding_period
    effect: parameter
    decides: bank_hold_days
    bindings:
    - lease_autopay
    - utility_bank_payments
    - bank_hold_days
    ladder:
    - when: the lease ledger shows an automatic bank draft paid in the last six months
      value: K('autopay_bank_hold_days')
    - when: >-
        the lease ledger shows no automatic bank draft in the last six months and the utility account carries no
        more than one bank-account payment in the last twelve months
      value: K('new_bank_hold_days')
    - when: otherwise
      value: K('standard_bank_hold_days')
    baseline:
      bank_hold_days: K('standard_bank_hold_days')
    evidence:
    - history
    - cross_category
    cross_difficulty: lease
  - id: true_up_reserve_rate
    effect: parameter
    decides: reserve_share
    bindings:
    - latest_read_type
    - latest_read_date
    - reserve_share
    ladder:
    - when: the latest water read is an estimated read and no more than 30 days have passed since its date
      value: K('fresh_reserve_share')
    - when: the latest water read is an estimated read and 31 to 60 days have passed since its date
      value: K('aging_reserve_share')
    - when: otherwise
      value: '0.0'
    baseline:
      reserve_share: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: true_up_reserve_base
    effect: method
    decides: reserve_base
    bindings:
    - latest_usage_charge
    - recent_estimates
    - final_days_billed
    - reserve_base
    ladder:
    - when: two or more estimated water reads taken in the last two months
      method: the sum of every water usage charge dated in the last two months
    - when: >-
        exactly one estimated water read taken in the last two months and fewer than 10 days of service billed on
        the trash charge of the latest statement
      method: the latest water usage charge times 30 divided by those days of service
    - when: otherwise
      method: the latest water usage charge
    baseline:
      reserve_base: latest_usage_charge
    evidence:
    - history
    cross_difficulty: null
  - id: refund_limit_tenure
    effect: parameter
    decides: refund_limit
    bindings:
    - service_months
    - refund_limit
    ladder:
    - when: service began 180 or more whole months before the handling date
      value: K('long_refund_limit')
    - when: service began 60 to 179 whole months before the handling date
      value: K('mid_refund_limit')
    - when: otherwise
      value: K('standard_refund_limit')
    baseline:
      refund_limit: K('standard_refund_limit')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      A credit balance left on a final-billed utility account is refunded by check to the former resident at the
      mailing address on the profile, on the former resident's request. The standard refund is the credit balance
      less the most recent personal-check payment when fewer than 5 days have passed since it was received, and
      less the most recent bank-account payment made through the resident portal when fewer than 2 days have passed
      since it was received, the days counted by subtracting the receipt date from the handling date. A refund is
      never below zero, no more than 250.00 dollars of standard refund is issued at one time, any credit not refunded
      stays on the account for a later refund, and the refund is rounded half up to the cent once, on the final
      figure.
    params:
    - standard_check_hold_days
    - standard_bank_hold_days
    - standard_refund_limit
  inputs:
    history:
    - table: utility_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: utility_payment
        payment_channel: office_personal_check
    - table: utility_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: utility_payment
        payment_channel: online_portal_ach
    - table: utility_ledger
      aggregate: sum
      field: amount
      within_months: 2
      filters:
        event_type: utility_usage_charge
    - category: lease
      table: lease_ledger
      aggregate: count
      field: lease_entry_id
      within_months: 12
      filters:
        event_type: lease_late_fee
    cross_category:
    - lease
