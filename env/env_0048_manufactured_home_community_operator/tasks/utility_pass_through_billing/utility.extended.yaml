- id: utility_ext_statement_late_fee
  base_policy_refs:
  - utility_evt_late_fee
  overwrite:
  - base_policy: utility_evt_late_fee
    superseded_clause: >-
      The fee is late_fee_amount, charged once per statement, and only when the statement's unpaid amount at the
      end of the grace period (utility_msr_statement_unpaid) is at least late_fee_min_past_due; no late fee is charged
      on a late fee.
    replaced_by: >-
      The fee basis depends on the size of the statement, meaning its usage, fixed and administration charges: a
      statement of 150.00 dollars or more carries a fee basis of 6 percent of those charges, rounded half up to
      the cent; a statement of less than 40.00 dollars carries the schedule's late fee amount times those charges
      divided by 40.00, rounded half up to the cent; any other statement carries the schedule's late fee amount.
  trigger: state_due
  subject:
  - utility_late_fee
  computes: amount
  target_tool: post_late_fee_5fe5b1d1
  params:
    large_bill_min: 150.0
    large_bill_pct: 6.0
    small_bill_max: 40.0
    late_lookback_months: 12
    first_late_share: 0.5
    repeat_late_share: 1.5
    repeat_late_min: 3
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_share: 0.8
    mid_tenure_share: 0.9
    lease_late_months: 6
    returned_risk_share: 1.25
    lease_late_risk_share: 1.1
    moved_out_share: 0.75
    closed_other_share: 0.9
  rule: >-
    A late fee on a utility statement left unpaid past its grace period is posted in the month after the statement
    month and is figured on that statement, which is the statement dated one whole month before the handling date
    when whole months are counted from the statement date to the handling date. The fee is charged only when that
    statement's unpaid amount at the end of its grace period is at least the schedule's late-fee minimum, it is
    charged once for that statement, and no late fee is charged on a late fee. The standard late fee is the schedule's
    late fee amount, rounded half up to the cent once, on the final figure. Each late-fee share stated below that
    applies multiplies the fee basis, the order of these multiplications making no difference to the result; a period
    of N months below counts an entry when fewer than N whole months separate its date from the handling date. The
    fee basis depends on the size of the statement, meaning its usage, fixed and administration charges: a statement
    of 150.00 dollars or more carries a fee basis of 6 percent of those charges, rounded half up to the cent; a
    statement of less than 40.00 dollars carries the schedule's late fee amount times those charges divided by 40.00,
    rounded half up to the cent; any other statement carries the schedule's late fee amount. An account with no
    utility late fee posted in the last twelve months pays 50 percent of the fee basis, an account with three or
    more utility late fees posted in the last twelve months pays 150 percent of it, and an account with one or two
    pays the fee basis in full. An account whose service began 120 or more whole months before the handling date
    takes a tenure share of 80 percent, one whose service began 60 to 119 whole months before takes 90 percent,
    and a newer account takes no tenure share. Where a returned payment stands on the lease ledger or on the utility
    account in the last twelve months, the late fee is raised to 125 percent; where neither carries a returned payment
    in the last twelve months but a lease late fee stands on the lease ledger in the last six months, it is raised
    to 110 percent; otherwise no payment-risk share applies. Where the lease the account serves has closed and a
    notice to vacate was accepted on it, the late fee is reduced to 75 percent, because the statement reaches the
    former resident at a forwarding address; where the lease has closed with no notice to vacate accepted on it,
    the late fee is reduced to 90 percent; a late fee on the account of an open lease takes no closed-lease share.
  prerequisite: []
  cross_category:
  - category: lease
    as: history
    reads:
    - status
    - lease_ledger.event_type
    - lease_ledger.entry_date
    - lease_requests.request_type
    - lease_requests.request_status
    note: >-
      Returned payments and late fees on the lease ledger decide the payment-risk share; the lease's status and
      an accepted notice to vacate decide the closed-lease share.
  compute:
  - stmt_usage: >-
      SUM('utility_ledger', 'amount', within_months=2, date_field='entry_date', event_type='utility_usage_charge')
      - SUM('utility_ledger', 'amount', within_months=1, date_field='entry_date', event_type='utility_usage_charge')
  - stmt_fixed: >-
      SUM('utility_ledger', 'amount', within_months=2, date_field='entry_date', event_type='utility_fixed_charge')
      - SUM('utility_ledger', 'amount', within_months=1, date_field='entry_date', event_type='utility_fixed_charge')
  - stmt_admin: >-
      SUM('utility_ledger', 'amount', within_months=2, date_field='entry_date', event_type='utility_admin_fee')
      - SUM('utility_ledger', 'amount', within_months=1, date_field='entry_date', event_type='utility_admin_fee')
  - stmt_charges: stmt_usage + stmt_fixed + stmt_admin
  - fee_basis: >-
      RND(K('large_bill_pct') / 100 * stmt_charges, 2) if stmt_charges >= K('large_bill_min') else (RND(P('late_fee_amount')
      * stmt_charges / K('small_bill_max'), 2) if stmt_charges < K('small_bill_max') else P('late_fee_amount'))
  - prior_late_fees: >-
      COUNT('utility_ledger', within_months=K('late_lookback_months'), date_field='entry_date', event_type='utility_late_fee')
  - repeat_share: >-
      K('first_late_share') if prior_late_fees == 0 else (K('repeat_late_share') if prior_late_fees >= K('repeat_late_min')
      else 1.0)
  - service_months: MONTHS(F('service_start_date'), NOW)
  - tenure_share: >-
      K('long_tenure_share') if service_months >= K('long_tenure_months') else (K('mid_tenure_share') if service_months
      >= K('mid_tenure_months') else 1.0)
  - lease_returns: >-
      XCOUNT('lease', 'lease_ledger', within_months=K('late_lookback_months'), date_field='entry_date', event_type='lease_payment_return')
  - utility_returns: >-
      COUNT('utility_ledger', within_months=K('late_lookback_months'), date_field='entry_date', event_type='utility_payment_return')
  - lease_late_recent: >-
      XCOUNT('lease', 'lease_ledger', within_months=K('lease_late_months'), date_field='entry_date', event_type='lease_late_fee')
  - risk_share: >-
      K('returned_risk_share') if (lease_returns > 0 or utility_returns > 0) else (K('lease_late_risk_share') if
      (lease_late_recent > 0 and lease_returns + utility_returns == 0) else 1.0)
  - lease_state: CFIELD('lease', 'status')
  - vacate_notices: XCOUNT('lease', 'lease_requests', request_type='notice_to_vacate', request_status='accepted')
  - closed_share: >-
      K('moved_out_share') if (lease_state == 'closed' and vacate_notices > 0) else (K('closed_other_share') if
      (lease_state == 'closed' and vacate_notices == 0) else 1.0)
  - result: RND(fee_basis * repeat_share * tenure_share * risk_share * closed_share, 2)
  compute_basis:
