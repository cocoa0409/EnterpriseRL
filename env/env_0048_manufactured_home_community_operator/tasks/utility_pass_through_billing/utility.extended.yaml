  factors:
  - id: projected_daily_use_basis
    effect: method
    decides: daily_use
    bindings:
    - year_cons
    - year_reads
    - latest_actual
    - service_months
    - daily_use
    ladder:
    - when: service began twelve or more whole months before the handling date
      method: the average consumption of the actual water reads taken in the last twelve months divided by 30
    - when: service began fewer than four whole months before the handling date
      method: the consumption of the latest actual water read divided by 30
    - when: otherwise
      method: the average consumption of the actual water reads taken in the last four months divided by 30
    baseline:
      daily_use: std_cons / std_reads / K('month_days')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: projection_move_share
    effect: parameter
    decides: move_share
    bindings:
    - lease_status
    - vacate_date
    - move_share
    ladder:
    - when: >-
        the lease carries a notice to vacate and its vacate date is no more than 14 days after the handling date
      value: K('near_move_share')
    - when: >-
        the lease carries a notice to vacate and its vacate date is more than 14 days after the handling date
      value: K('later_move_share')
    - when: otherwise
      value: '1.0'
    baseline:
      move_share: '1.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: lease
  - id: projection_guest_share
    effect: parameter
    decides: guest_share
    bindings:
    - guest_count
    - guest_start
    - guest_end
    - guest_share
    ladder:
    - when: >-
        the most recently begun registered guest stay has a planned last day after the handling date that falls
        fourteen or more days after the stay's first day
      value: K('long_guest_share')
    - when: >-
        the most recently begun registered guest stay has a planned last day after the handling date that falls
        fewer than fourteen days after the stay's first day
      value: K('short_guest_share')
    - when: otherwise
      value: '1.0'
    baseline:
      guest_share: '1.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: rules
  - id: final_cycle_fixed_proration
    effect: method
    decides: final_fixed
    bindings:
    - cycle_days
    - final_fixed
    ladder:
    - when: fewer than 15 days from the latest water read to the service end date
      method: >-
        the latest statement's fixed charges times those days divided by the days in the read cycle that statement
        billed
    - when: 15 to 29 days from the latest water read to the service end date
      method: the latest statement's fixed charges times those days divided by 30
    - when: otherwise (30 days or more)
      method: one whole month of the latest statement's fixed charges
    baseline:
      final_fixed: monthly_fixed
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: prepayment_cushion_share
    effect: parameter
    decides: cushion_share
    bindings:
    - lease_returns
    - utility_returns
    - utility_late
    - lease_late
    - cushion_share
    ladder:
    - when: >-
        a returned payment on the lease ledger or a returned payment on the utility account in the last twelve months
      value: K('returned_cushion_share')
    - when: >-
        no returned payment on either in the last twelve months, and a late fee on the utility account or a late
        fee on the lease ledger in that period
      value: K('late_cushion_share')
    - when: otherwise
      value: '0.0'
    baseline:
      cushion_share: '0.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: lease
  - id: true_up_reserve_share
    effect: parameter
    decides: reserve_share
    bindings:
    - latest_read_type
    - recent_estimates
    - reserve_share
    ladder:
    - when: >-
        the latest water read is an estimated read and the account has two or more estimated water reads taken in
        the last two months
      value: K('repeat_reserve_share')
    - when: >-
        the latest water read is an estimated read and it is the only estimated water read taken in the last two
        months
      value: K('first_reserve_share')
    - when: otherwise
      value: '0.0'
    baseline:
      reserve_share: '0.0'
    evidence:
    - history
    cross_difficulty: null
