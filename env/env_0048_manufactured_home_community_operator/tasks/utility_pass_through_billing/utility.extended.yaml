      average consumption of the actual water reads taken in the last four months divided by 30, a read counting
      as taken in the last four months when fewer than four whole months separate its read date from the handling
      date. The standard fixed charges quoted for the final cycle are one whole month of the fixed charges billed
      on the latest statement, which are the fixed charges dated in the last whole month. The prepayment is rounded
      half up to the cent once, on the final sum.
    params:
    - standard_basis_months
    - month_days
    - admin_fee_per_statement
  inputs:
    history:
    - table: utility_ledger
      aggregate: sum
      field: consumption
      within_months: 12
      filters:
        event_type: utility_meter_read
        utility_service: water
        read_type: actual
    - table: utility_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: utility_usage_charge
        utility_service: water
    - table: utility_ledger
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: utility_fixed_charge
    - category: lease
