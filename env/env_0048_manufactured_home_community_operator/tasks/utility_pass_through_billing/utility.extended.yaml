- id: utility_ext_final_statement_prepayment
  base_policy_refs:
  - utility_agg_account_settlement
  - utility_evt_payments
  - utility_final_billing
  - utility_evt_statement_billing
  overwrite:
  - base_policy: utility_evt_payments
    superseded_clause: >-
      While the lease the account serves is on certified_funds_only status and its certified_funds_until date has
      not passed, a utility payment is accepted only through the lease's certified_funds_channels.
    replaced_by: >-
      While the lease the account serves is on certified-funds-only status and its certified-funds end date has
      not passed, a utility payment is accepted only through the lease's certified-funds channels, and a prepayment
      of an estimated final statement is accepted only by card through the resident portal or by cashier's check
      at the community office, whatever the payment status of the lease, because a returned prepayment could not
      be pursued once the account closes.
  trigger: on_request
  subject:
  - utility_payment
  computes: amount
  target_tool: prepay_final_statement_ca2cf476
  params:
    standard_basis_months: 4
    annual_months: 12
    new_service_months: 4
    month_days: 30
    near_move_days: 14
    near_move_share: 0.8
    later_move_share: 0.9
    long_guest_days: 14
    long_guest_share: 1.25
    short_guest_share: 1.1
    short_stub_days: 15
    cushion_lookback_months: 12
    returned_cushion_share: 0.2
    late_cushion_share: 0.1
    estimate_window_months: 2
    repeat_reserve_share: 0.3
    first_reserve_share: 0.15
  rule: >-
    A resident whose utility account has a service end date may prepay the estimated final statement, and the prepayment
    quoted is the current utility balance plus the estimated final statement. The prepayment of an estimated final
    statement is worked out only after a water usage charge stands on the account for every read cycle whose read
    day has passed. The estimated final statement is the projected usage charge, plus the fixed charges quoted for
    the final cycle, plus one administration fee at the schedule's amount. The projected usage charge is the projected
    final-cycle consumption priced at the average unit price of the latest water usage charge, that charge's amount
    divided by the consumption it billed, and rounded half up to the cent. The projected final-cycle consumption
    is the projected daily use times the days from the date of the latest water read on the account to the service
    end date, counted by subtracting the earlier date from the later. The standard projected daily use for a final-statement
    prepayment is the average consumption of the actual water reads taken in the last four months divided by 30,
    a read counting as taken in the last four months when fewer than four whole months separate its read date from
    the handling date. The standard fixed charges quoted for the final cycle are one whole month of the fixed charges
    billed on the latest statement, which are the fixed charges dated in the last whole month. Each projection share
    stated below that applies multiplies the projected daily use, the order of these multiplications making no difference,
    and the cushion and the true-up reserve stated below, where they apply, are added to the quoted prepayment;
    a period of N months below is counted the same way as the four months above. For an account whose service began
    twelve or more whole months before the handling date, the projected daily use for a final-statement prepayment
    is instead the average consumption of the actual water reads taken in the last twelve months divided by 30;
    for an account whose service began fewer than four whole months before the handling date, it is the consumption
    of the latest actual water read divided by 30; any other account keeps the four-month average divided by 30.
    Where the lease the account serves carries a notice to vacate whose vacate date is no more than 14 days after
    the handling date, the projected daily use is multiplied by 80 percent, and where that vacate date is more than
    14 days after the handling date, it is multiplied by 90 percent; a lease carrying no notice to vacate takes
    no projection share for a coming move. Where the most recently begun guest stay registered with the community
    has a planned last day after the handling date, the projected daily use is multiplied by 125 percent when that
    planned last day falls fourteen or more days after the stay's first day and by 110 percent when it falls fewer
    than fourteen days after it; without a registered guest stay running past the handling date no guest share applies
    to the projection. When the days from the latest water read to the service end date are fewer than 15, the fixed
    charges quoted for the final cycle are the fixed charges billed on the latest statement times those days divided
    by the days in the read cycle that statement billed; when those days are 15 to 29, they are the fixed charges
    billed on the latest statement times those days divided by 30; when those days are 30 or more, one whole month
    of fixed charges is quoted; a prorated figure is rounded half up to the cent. A cushion is added to the estimated
    final statement: 20 percent of it where a returned payment stands on the lease ledger or on the utility account
    in the last twelve months, 10 percent of it where neither carries a returned payment in the last twelve months
    but a late fee stands on the utility account or on the lease ledger in that period, and nothing otherwise; the
    cushion is rounded half up to the cent. A true-up reserve is added where the latest water read is an estimated
    read: 30 percent of the latest water usage charge where the account has two or more estimated water reads taken
    in the last two months, 15 percent of it where that estimated read is the only one taken in the last two months,
    and nothing where the latest water read is not an estimated read; the reserve is rounded half up to the cent.
    While the lease the account serves is on certified-funds-only status and its certified-funds end date has not
    passed, a utility payment is accepted only through the lease's certified-funds channels, and a prepayment of
    an estimated final statement is accepted only by card through the resident portal or by cashier's check at the
    community office, whatever the payment status of the lease, because a returned prepayment could not be pursued
    once the account closes. The prepayment is rounded half up to the cent once, on the final sum.
  prerequisite:
  - problem: utility_ext_water_usage_charge
    kind: value_input
    gate: balance
    form: state
    policy_source: >-
      The prepayment of an estimated final statement is worked out only after a water usage charge stands on the
      account for every read cycle whose read day has passed.
    condition: >-
      For every read cycle whose read day has passed, a water usage charge row (event_type utility_usage_charge,
      utility_service water) stands on the account for that cycle's statement month.
    resolved_by: post_water_usage_charge_d31cd699
    effect: >-
      The usage charge for the cycle just read raises the utility balance (balance) by that charge and becomes the
      latest water usage charge, so the average unit price and the true-up reserve are figured on it.
  cross_category:
  - category: lease
    as: history
    reads:
    - status
    - vacate_date
    - lease_ledger.event_type
    - lease_ledger.entry_date
    note: >-
      The lease's notice to vacate and vacate date decide the projection share for a coming move; returned payments
      and late fees on the lease ledger decide the cushion share.
  - category: rules
    as: history
    reads:
    - rules_records.event_type
    - rules_records.stay_start_date
    - rules_records.stay_end_date
    note: A registered guest stay running past the handling date decides the guest share of the projection.
  compute:
  - balance: F('utility_balance')
  - last_read_date: >-
      LATEST('utility_ledger', 'entry_date', date_field='entry_date', event_type='utility_meter_read', utility_service='water')
  - final_days: DAYS(last_read_date, F('service_end_date'))
  - std_cons: >-
      SUM('utility_ledger', 'consumption', within_months=K('standard_basis_months'), date_field='entry_date', event_type='utility_meter_read',
      utility_service='water', read_type='actual')
  - std_reads: >-
      COUNT('utility_ledger', within_months=K('standard_basis_months'), date_field='entry_date', event_type='utility_meter_read',
      utility_service='water', read_type='actual')
  - year_cons: >-
      SUM('utility_ledger', 'consumption', within_months=K('annual_months'), date_field='entry_date', event_type='utility_meter_read',
      utility_service='water', read_type='actual')
  - year_reads: >-
      COUNT('utility_ledger', within_months=K('annual_months'), date_field='entry_date', event_type='utility_meter_read',
      utility_service='water', read_type='actual')
  - latest_actual: >-
      LATEST('utility_ledger', 'consumption', date_field='entry_date', event_type='utility_meter_read', utility_service='water',
      read_type='actual')
  - service_months: MONTHS(F('service_start_date'), NOW)
  - daily_use: >-
      (year_cons / year_reads / K('month_days')) if service_months >= K('annual_months') else ((latest_actual /
      K('month_days')) if service_months < K('new_service_months') else (std_cons / std_reads / K('month_days')))
  - lease_status: CFIELD('lease', 'status')
  - vacate_date: CFIELD('lease', 'vacate_date')
  - move_share: >-
      K('near_move_share') if (lease_status == 'notice_to_vacate' and DAYS(NOW, vacate_date) <= K('near_move_days'))
      else (K('later_move_share') if (lease_status == 'notice_to_vacate' and DAYS(NOW, vacate_date) > K('near_move_days'))
      else 1.0)
  - guest_count: XCOUNT('rules', 'rules_records', event_type='rules_guest_registration')
  - guest_start: >-
      XLATEST('rules', 'rules_records', 'stay_start_date', date_field='stay_start_date', event_type='rules_guest_registration')
  - guest_end: >-
      XLATEST('rules', 'rules_records', 'stay_end_date', date_field='stay_start_date', event_type='rules_guest_registration')
  - guest_share: >-
      K('long_guest_share') if (guest_count > 0 and guest_end > NOW and DAYS(guest_start, guest_end) >= K('long_guest_days'))
      else (K('short_guest_share') if (guest_count > 0 and guest_end > NOW and DAYS(guest_start, guest_end) < K('long_guest_days'))
      else 1.0)
  - last_charge_amount: >-
      LATEST('utility_ledger', 'amount', date_field='entry_date', event_type='utility_usage_charge', utility_service='water')
  - last_charge_kgal: >-
      LATEST('utility_ledger', 'consumption', date_field='entry_date', event_type='utility_usage_charge', utility_service='water')
  - unit_price: last_charge_amount / last_charge_kgal
  - projected_kgal: daily_use * final_days * move_share * guest_share
  - projected_usage: RND(projected_kgal * unit_price, 2)
  - monthly_fixed: >-
      SUM('utility_ledger', 'amount', within_months=1, date_field='entry_date', event_type='utility_fixed_charge')
  - cycle_days: >-
      LATEST('utility_ledger', 'days_in_period', date_field='entry_date', event_type='utility_fixed_charge', utility_service='trash')
  - final_fixed: >-
      RND(monthly_fixed * final_days / cycle_days, 2) if final_days < K('short_stub_days') else (RND(monthly_fixed
      * final_days / K('month_days'), 2) if (final_days >= K('short_stub_days') and final_days < K('month_days'))
      else monthly_fixed)
  - final_estimate: projected_usage + final_fixed + P('admin_fee_per_statement')
  - lease_returns: >-
      XCOUNT('lease', 'lease_ledger', within_months=K('cushion_lookback_months'), date_field='entry_date', event_type='lease_payment_return')
  - utility_returns: >-
      COUNT('utility_ledger', within_months=K('cushion_lookback_months'), date_field='entry_date', event_type='utility_payment_return')
  - utility_late: >-
      COUNT('utility_ledger', within_months=K('cushion_lookback_months'), date_field='entry_date', event_type='utility_late_fee')
  - lease_late: >-
      XCOUNT('lease', 'lease_ledger', within_months=K('cushion_lookback_months'), date_field='entry_date', event_type='lease_late_fee')
  - cushion_share: >-
      K('returned_cushion_share') if (lease_returns > 0 or utility_returns > 0) else (K('late_cushion_share') if
      ((utility_late > 0 or lease_late > 0) and lease_returns + utility_returns == 0) else 0.0)
  - cushion: RND(final_estimate * cushion_share, 2)
  - latest_read_type: >-
      LATEST('utility_ledger', 'read_type', date_field='entry_date', event_type='utility_meter_read', utility_service='water')
  - recent_estimates: >-
      COUNT('utility_ledger', within_months=K('estimate_window_months'), date_field='entry_date', event_type='utility_meter_read',
      utility_service='water', read_type='estimated')
  - reserve_share: >-
      K('repeat_reserve_share') if (latest_read_type == 'estimated' and recent_estimates >= 2) else (K('first_reserve_share')
      if (latest_read_type == 'estimated' and recent_estimates == 1) else 0.0)
  - reserve: RND(last_charge_amount * reserve_share, 2)
  - result: RND(balance + final_estimate + cushion + reserve, 2)
