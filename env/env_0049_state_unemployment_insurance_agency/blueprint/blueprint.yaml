name: env_0049_state_unemployment_insurance_agency
company: Lakeland Department of Workforce Security

background: |
  The Lakeland Department of Workforce Security is the state agency that runs the unemployment insurance program of the State of Lakeland, a mid-sized industrial and agricultural state of about 5.8 million people. Its Unemployment Insurance Division pays benefits to roughly 140,000 claimants in an average year and collects contributions from about 168,000 registered employers, and its contact center answers claimants and employers in a plain, procedural, public-service voice. Claimants hold Unemployment Benefit Claims, each filed under one program and one benefit year: Regular State Unemployment Insurance, Unemployment Compensation for Federal Employees (UCFE), Unemployment Compensation for Ex-Servicemembers (UCX), Combined Wage Claim (CWC), Extended Benefits (EB), Trade Readjustment Allowances (TRA) and Disaster Unemployment Assistance (DUA). A claim is credited with a maximum benefit amount by its monetary determination and is drawn down week by week, as the claimant certifies each benefit week and the Department issues weekly benefit payments by direct deposit, state benefit debit card or paper check. New claims are matched to a Claimant Identity Verification case worked on one pathway at a time: Online Identity Proofing (IAL2), Video Trusted Referee Session, In-Person Proofing — American Job Center, In-Person Proofing — USPS Retail Location, Documentary Verification by Mail, or Identity Theft Victim Re-Verification. When weeks are later found not payable, the claimant holds a Benefit Overpayment Account classified as Non-Fraud Overpayment — Agency Error, Non-Fraud Overpayment — Employer Reporting Error, Non-Fraud Overpayment — Appeal Reversal, Non-Fraud Overpayment — Claimant Error, Fraud Overpayment — First Offense or Fraud Overpayment — Repeat Offense, booked with assessments, repayments, benefit offsets, tax refund intercepts, waivers and refunds. Benefit payments also carry Benefit Withholding and Deduction Orders - Voluntary Federal Income Tax Withholding, Voluntary State Income Tax Withholding, Child Support Withholding — Current Support Order, Child Support Withholding — Arrears-Only Order, SNAP Overissuance Recovery — Household or Agency Error and SNAP Overissuance Recovery — Intentional Program Violation - whose deductions are taken per payment and remitted to the IRS, the Lakeland Department of Revenue, the State Disbursement Unit or the SNAP agency, and each claim receives an annual Form 1099-G. Employers hold an Employer Unemployment Insurance Tax Account in one financing class: Contributory — New Employer Standard Rate, Contributory — New Employer Construction Rate, Contributory — Experience-Rated Positive Reserve, Contributory — Experience-Rated Deficit Reserve, Contributory — Delinquent Reporting Assigned Rate, Reimbursing — Nonprofit Organization or Reimbursing — Governmental Entity. A tax account is booked through quarterly contribution and wage reports, contribution assessments, payments, penalties and interest, an annual rate notice, and an experience-rating reserve account that contributions build up and benefit charges draw down. Each claim also opens Employer Benefit Charging positions for its base-period employers, classed as Separating Employer — Most Recent, Base Period Employer — Proportional Share, Continuing Part-Time Base Period Employer, Combined Wage Claim Contributing Employer, Extended Benefits State-Share Employer, Reimbursing Nonprofit Employer — Dollar-for-Dollar or Reimbursing Governmental Employer — Dollar-for-Dollar, which receive the notice of claim, carry a share of every weekly payment, appear on quarterly statements of charges and can be protested. Either side can file Unemployment Insurance Appeals on one of seven dockets: Lower Authority Appeal — Separation Issue, Lower Authority Appeal — Able and Available Issue, Lower Authority Appeal — Monetary Determination, Lower Authority Appeal — Overpayment and Fraud, Lower Authority Appeal — Employer Benefit Charge, Lower Authority Appeal — Employer Contribution Rate and Higher Authority Appeal — Board of Review, each tracked through hearing settings, postponements, exhibits and decisions. Claimants who call are usually laid-off or partially employed workers several weeks into a claim, often with a held week, a missed certification, an earnings question, an offset from an older overpayment, a child support order or a pending appeal on file at the same time. Some are federal civilian employees, recently separated service members, trade-affected workers or self-employed people hit by a declared disaster, and a few are identity theft victims who never filed the claim in their name. Employers who call range from small construction firms and restaurants in their first years of liability to large experience-rated manufacturers, school districts and nonprofit hospitals that reimburse benefits, frequently through a payroll service or third-party administrator, and they bring histories of late reports, rate notices, notices of claim, statements of charges and earlier protests. Most customers hold several of these records at once, so a single call usually touches a claim, the payments and deductions booked on it, and the employer or appeal records that hang off it.

logs:
  verification_log_table: caller_verifications
  handoff_log_table: handoffs

difficulties:
  - name: weekly_certification_and_benefit_payment
    claim:
      categories: [claim]
      event_types: [claim_week_certified, claim_waiting_week_served, claim_benefit_paid, claim_payment_cancelled, claim_hold_released, claim_reopened, claim_payment_method_changed, claim_effective_date_backdated, claim_withdrawn]
    summary: >-
      (1) Claimants call about the weeks on their claims: certifying a week by phone, asking why a certified week was not paid or was paid short, reporting a returned deposit or a lost check, reopening a claim after a break or after short-term work, changing how they are paid, moving the claim date earlier, or withdrawing a claim to refile; the setting varies by program (Regular State Unemployment Insurance through Disaster Unemployment Assistance), by claim status (active, on_hold, inactive, exhausted, closed), by whether an Extended Benefits or Trade Readjustment Allowances claim sits on top of an exhausted parent, and by a history of partial-earnings weeks, late certifications, waiting weeks and cancelled payments.
      (2) The records are the claim with its benefit year, weekly benefit amount and remaining balance, its weekly certifications, its ledger of entitlement credits, waiting weeks, payments, cancellations and reissues, its claim requests, and the identity verification case, overpayments, withholding orders and charge positions that hang off it; the governing rules are the certification opening, window and once-per-week gates with program-specific work-search counts (claim_evt_weekly_certification), the active-status and once-per-week payment gates with the earnings-disregard, full-time-hours and other-pay formula (claim_evt_payable_amount), the per-program waiting week (claim_evt_waiting_week), the lost-check business-day wait and once-only cancellation (claim_evt_payment_cancellation), the identity hold release (claim_hold_management), the benefit-year reopen limit (claim_inactivity_and_reopen), the per-program backdating window (claim_backdating), the fraud-review bar on payment method changes (claim_payment_method), the withdrawal conditions (claim_withdrawal), and the one-payable-claim-per-week and program sequencing rules (claim_agg_program_sequence).
      In the domain a claim is filed and determined, then each week is certified after it ends, the first otherwise-payable week serves as the waiting week, later weeks are paid, and payments may be cancelled and reissued; these are background order only.
      (3) The agent certifies weeks from the answers the claimant gives, records waiting weeks, payments, cancellations and reissues, releases holds whose issue is resolved on the record, reopens inactive claims and records backdating that an approved request supports; redirecting where benefits are paid, withdrawing a claim and lodging a backdating or late-certification request are the claimant's own acts, handed to the claimant to perform or confirm.
      (4) Requests no policy decides - splitting one payment across two bank accounts, paying benefits to a relative's account, transferring an open claim to another state as the paying state, or trading paid weeks for later weeks - leave the agent only a POLICY_NOT_COVERED transfer.

  - name: overpayment_waiver_and_recovery
    claim:
      categories: [overpay]
      event_types: [overpay_repayment_received, overpay_fee_assessed, overpay_waiver_review_opened, overpay_waiver_granted, overpay_waiver_partially_granted, overpay_waiver_denied, overpay_waiver_adjusted, overpay_repayment_plan_set, overpay_recovery_suspended, overpay_refund_issued]
    summary: >-
      (1) Claimants call about overpayment notices and balances: asking for a waiver, paying part or all of a balance, setting up or changing a monthly plan, asking why a benefit payment or a tax refund was taken, reporting a bounced repayment, or saying they have appealed; the setting varies by classification (agency error, employer reporting error, appeal reversal, claimant error, first-offense and repeat-offense fraud), by status (established, in_recovery, waiver_pending, suspended and the closed states), by how many overpayments the claimant owes at once on one or several claims, and by histories of offsets, intercepts, missed installments and earlier waiver decisions.
      (2) The records are the overpayment with its determination date, principal, balance and plan, its ledger of assessments, recoveries, adjustments and refunds, the waiver requests, and the claim, its payments and any appeal of the determination; the governing rules are the once-per-issue establishment gate (overpay_agg_multi_holding), the shared recovery order across open overpayments (overpay_agg_recovery_priority), the classification-specific penalty, interest and returned-payment fee (overpay_evt_penalty_interest), the status gates on offsets, intercepts and voluntary repayments with the per-classification offset share and component order (overpay_evt_recovery), the waiver eligibility, request window and household-income test against the poverty guideline (overpay_waiver), the plan minimum and default rules (overpay_repayment_plan), the Treasury Offset notice period (overpay_treasury_offset), and the appeal suspension and cancellation refunds (overpay_appeal_suspension).
      In the domain an overpayment is established, its appeal and waiver windows run, recovery begins, and installments, offsets and intercepts follow until it is paid, waived, cancelled or written off; this is background order only.
      (3) The agent opens waiver reviews from requests the claimant has lodged and records the decision and adjustment the income test dictates, books returned-payment fees, suspends recovery for an appeal on record and records refunds; applying for a waiver, agreeing to a repayment plan and paying money toward the balance are the claimant's own acts, handed to the claimant.
      (4) Requests no policy decides - a lump-sum settlement for less than the balance, a question of whether a bankruptcy discharges the debt, or moving the debt to another person - leave the agent only a POLICY_NOT_COVERED transfer.

  - name: benefit_and_tax_appeals
    claim:
      categories: [appeal]
      event_types: [appeal_filed, appeal_docketed, appeal_hearing_scheduled, appeal_postponement_decided, appeal_exhibit_received, appeal_interpreter_requested, appeal_withdrawn, appeal_reopened]
    summary: >-
      (1) Claimants and employers call to appeal a determination or decision, to ask when their hearing is, to postpone it, to send documents or ask for an interpreter, to withdraw an appeal, or to reopen one dismissed after they missed the hearing; the setting varies by docket (separation, able and available, monetary, overpayment and fraud, employer benefit charge, employer contribution rate, Board of Review), by status (filed, scheduled, decided, withdrawn, dismissed, closed), by whether the other party has appealed the same record or the issue is linked to another docket, and by histories of earlier postponements, late filings and dismissals.
      (2) The records are the appeal with its appealed record, mailing and filing dates, hearing date and decision, its hearing settings, postponement decisions, exhibits and interpreter requests, the appellant's requests, and the underlying claim, overpayment, charge position or employer account; the governing rules are the one-open-appeal-per-party-per-record gate (appeal_agg_multi_holding), the Board-needs-a-decided-appeal rule and consolidation (appeal_agg_linked_dockets), the per-docket filing deadline with weekend roll-over and late good cause (appeal_evt_filing), the hearing-status gate, notice minimum and scheduling targets (appeal_evt_scheduling), the postponement lead time and per-party limit (appeal_evt_postponement), exhibit and subpoena lead times (appeal_evt_exhibits_and_interpreters), appellant-only withdrawal (appeal_evt_withdrawal) and the reopening window (appeal_evt_default_and_reopening).
      In the domain a determination is mailed, an appeal is filed in writing, docketed and set for hearing, may be postponed, is heard and decided, and may then go to the Board of Review; this is background order only.
      (3) The agent dockets appeals and sets hearings, decides postponement requests under the lead-time rule, records exhibits and interpreter requests, and sets reopened hearings; filing the written appeal, withdrawing it and asking for reopening are the appellant's own acts, handed to the appellant to perform or confirm.
      (4) Requests no policy decides - asking for a different hearing officer, complaining about how a hearing officer conducted a hearing, or asking the Department to file a court action for the caller - leave the agent only a POLICY_NOT_COVERED transfer.

  - name: employer_quarterly_contributions
    claim:
      categories: [taxacct]
      event_types: [taxacct_wage_report_filed, taxacct_contribution_assessed, taxacct_payment_received, taxacct_reserve_credited, taxacct_penalty_assessed, taxacct_credit_adjusted, taxacct_refund_issued, taxacct_voluntary_contribution_paid, taxacct_rate_assigned, taxacct_delinquency_cured]
    summary: >-
      (1) Employers and their payroll services call to file or correct a quarterly contribution and wage report, pay a quarter, ask about a late report penalty or interest, request abatement, claim a credit balance as a refund, buy down next year's rate with a voluntary contribution, or get a delinquent account back in good standing; the setting varies by financing class (new employer standard or construction, experience-rated positive or deficit reserve, delinquent reporting, reimbursing nonprofit or governmental), by status (registered, active, delinquent, inactive, closed), by successor and predecessor relationships, and by histories of late reports, estimated assessments, partial payments and earlier rate notices.
      (2) The records are the employer account with its rate, reserve ratio, rate notice date, balance due and reserve balance, its quarterly wage reports, its ledger of assessments, payments, penalties, interest, credits, refunds, reserve credits, voluntary contributions and posted charges, its requests, and the charge positions behind its reserve; the governing rules are the one-account-per-employer gate (taxacct_agg_multi_holding), class placement and reimbursing elections (taxacct_class_assignment), the reserve-ratio schedule per class (taxacct_evt_rate_assignment), the report-status gate, one-original-per-quarter rule and contribution formula (taxacct_evt_quarterly_report), the late report penalty, monthly interest and abatement window (taxacct_evt_penalty_interest), payment application, reserve credit and refund window (taxacct_evt_payments), the voluntary contribution window and next-step amount (taxacct_evt_voluntary_contribution), and the delinquency cure conditions (taxacct_evt_delinquency).
      In the domain a quarter ends, its report and contributions fall due, late items draw penalty and interest, payments are applied and credited to the reserve, and each year's rate notice follows the computation date; this is background order only.
      (3) The agent books the assessments, penalties, credits, reserve credits and refunds the rules dictate, records the revised rate after a voluntary contribution, and returns a cured account to active; filing or amending a wage report, making a payment or a voluntary contribution, and asking for a refund, an abatement or a closure are the employer's own acts, handed to the employer.
      (4) Requests no policy decides - paying a past-due balance in installments, disputing the federal FUTA credit on Form 940, or moving wages between the accounts of two related employers - leave the agent only a POLICY_NOT_COVERED transfer.

  - name: employer_charge_protests
    claim:
      categories: [charge]
      event_types: [charge_separation_response_filed, charge_relief_determined, charge_chargeability_determined, charge_protest_filed, charge_protest_granted, charge_protest_denied, charge_credit_reversed]
    summary: >-
      (1) Employers and third-party administrators call about notices of claim and statements of benefit charges: answering a notice late, asking why a former employee's benefits are charged to them, protesting a quarter's charges, asking for relief because the worker quit, was fired for misconduct, refused work or is still employed part time, or asking why a recovered overpayment or a cancelled payment has not been credited; the setting varies by charge class (separating employer, proportional base-period employer, continuing part-time employer, combined wage claim employer, Extended Benefits state-share employer, reimbursing nonprofit or governmental employer), by position status (noticed, responded, chargeable, protest_pending, relieved, closed), by how many claims the employer is charged on, and by its record of untimely responses.
      (2) The records are the charge position with its notice and response dates, reported separation, base-period wages, share and total charged, its ledger of posted charges, credits and statements, the employer's submissions, the claim and its payments, overpayments recovered on it, and any appeal on the employer benefit charge docket; the governing rules are the one-position-per-claim gate (charge_agg_multi_holding), proportional sharing and the posting status gate (charge_agg_proportional_share), the response window and late-response bar (charge_evt_notice_and_response), the per-class relief grounds and the pattern-of-failure bar on relief for erroneous payments (charge_evt_relief_grounds), the protest window and the no-reargument rule (charge_evt_statement_and_protest), and once-per-reason credits capped at the remaining charge (charge_evt_credits).
      In the domain a claim is filed, the notice of claim goes out, the employer responds or the window lapses, charges post with each payment, quarterly statements follow, and protests and credits come after; this is background order only.
      (3) The agent determines relief or chargeability on a response on record, decides protests, and posts the credits that relief, cancellations and recoveries require; submitting the separation response and filing a protest are the employer's own assertions, lodged in its name.
      (4) Requests no policy decides - moving charges to a professional employer organization's client account, splitting a charge between two related employers, or waiving charges as a goodwill gesture - leave the agent only a POLICY_NOT_COVERED transfer.
