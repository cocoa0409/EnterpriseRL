events:
  - type: appeal_filed
    target: appeals
    mutation: create
    meaning: A claimant or employer files a written appeal against a determination or a lower-authority decision.
    grain: One row per appeal filed by one party against one determination or decision.
    fields:
      customer_id: The appellant.
      variant_name: Docket the appeal is filed on.
      appellant_role: Whether the appellant is the claimant or an employer.
      determination_type: Kind of record appealed.
      determination_record_id: The appealed record.
      claim_id: Claim concerned, empty for employer tax appeals.
      employer_account_id: Employer account concerned, empty when none.
      parent_appeal_id: For a Board of Review appeal, the lower-authority appeal decided.
      determination_mailed_date: Mailing date of the appealed determination or decision.
      filed_date: Filing date (postmark, fax or online submission date).
      filing_channel: Channel used.
      late_filing_reason: Good cause stated for a late filing, none when timely.
    triggers:
      - event: overpay:overpay_recovery_suspended
        when: {determination_type: overpayment}
        map: {status: suspended}
  - type: appeal_docketed
    target: appeals
    mutation: {transition: {from: filed, to: scheduled}}
    meaning: The appeal is docketed with its first hearing set.
    grain: One transition per appeal.
    fields:
      status: Set to scheduled.
      hearing_date: Date of the first hearing.
    triggers: []
  - type: appeal_hearing_scheduled
    target: appeal_events
    meaning: A hearing is set and its notice mailed (first setting, reset after postponement, or setting after reopening).
    grain: One row per hearing setting.
    distinguish_by: [hearing_date, schedule_reason]
    fields:
      hearing_date: Date of the hearing.
      hearing_time: Start time of the hearing.
      hearing_mode: Mode of the hearing.
      notice_mailed_date: Date the hearing notice was mailed.
      schedule_reason: Why this setting was made.
    triggers:
      - event: appeal:appeal_docketed
        when: {schedule_reason: initial}
        map: {hearing_date: hearing_date}
      - event: appeal:appeal_reopened
        when: {schedule_reason: reopening}
        map: {hearing_date: hearing_date}
  - type: appeal_postponement_decided
    target: appeal_events
    meaning: A party's request to postpone a set hearing is decided.
    grain: One row per postponement request.
    distinguish_by: [request_date, requested_by]
    fields:
      requested_by: Party asking for the postponement.
      request_date: Date the request was received.
      hearing_date: Date of the hearing the request concerns.
      postponement_outcome: Decision on the request.
    triggers:
      - event: appeal:appeal_hearing_scheduled
        when: {postponement_outcome: granted}
        map: {schedule_reason: postponement}
  - type: appeal_exhibit_received
    target: appeal_events
    meaning: A documentary exhibit from a party is received for the hearing.
    grain: One row per exhibit received.
    distinguish_by: [exhibit_type, requested_by, received_date]
    fields:
      exhibit_type: Kind of document.
      requested_by: Party submitting the exhibit.
      received_date: Date received.
      exhibit_status: Whether the exhibit met the deadline.
    triggers: []
  - type: appeal_interpreter_requested
    target: appeal_events
    meaning: A party asks for an interpreter at the hearing.
    grain: One row per party per language.
    distinguish_by: [requested_by, language]
    fields:
      requested_by: Party needing the interpreter.
      language: Language requested.
      request_date: Date of the request.
    triggers: []
  - type: appeal_decision_issued
    target: appeals
    mutation:
      transition:
        - {from: scheduled, to: decided}
        - {from: filed, to: decided}
    meaning: The decision on the appeal is issued and mailed.
    grain: One transition per appeal.
    fields:
      status: Set to decided.
      decision_outcome: Outcome of the decision.
      decision_mailed_date: Date the decision was mailed.
      determination_type: Kind of record appealed (unchanged, carried for the consequences).
    triggers:
      - event: overpay:overpay_cancelled
        when: {decision_outcome: reversed, determination_type: overpayment}
        map: {status: cancelled}
      - event: overpay:overpay_recovery_resumed
        when: {decision_outcome: affirmed, determination_type: overpayment}
        map: {status: in_recovery}
      - event: charge:charge_relief_on_appeal
        when: {decision_outcome: reversed, determination_type: benefit_charge}
        map: {status: relieved}
      - event: taxacct:taxacct_rate_assigned
        when: {decision_outcome: [reversed, modified], determination_type: contribution_rate}
  - type: appeal_dismissed
    target: appeals
    mutation:
      transition:
        - {from: filed, to: dismissed}
        - {from: scheduled, to: dismissed}
    meaning: The appeal is dismissed as untimely or for the appellant's non-appearance.
    grain: One transition per dismissal.
    fields:
      status: Set to dismissed.
      dismissal_reason: Why it was dismissed.
      decision_mailed_date: Date the dismissal was mailed.
      determination_type: Kind of record appealed (unchanged, carried for the consequences).
    triggers:
      - event: overpay:overpay_recovery_resumed
        when: {determination_type: overpayment}
        map: {status: in_recovery}
  - type: appeal_withdrawn
    target: appeals
    mutation:
      transition:
        - {from: filed, to: withdrawn}
        - {from: scheduled, to: withdrawn}
    meaning: The appellant confirms withdrawal of the appeal.
    grain: One transition per appeal.
    fields:
      status: Set to withdrawn.
      closed_date: Date the withdrawal was confirmed.
      determination_type: Kind of record appealed (unchanged, carried for the consequences).
    triggers:
      - event: overpay:overpay_recovery_resumed
        when: {determination_type: overpayment}
        map: {status: in_recovery}
  - type: appeal_reopened
    target: appeals
    mutation: {transition: {from: dismissed, to: scheduled}}
    meaning: Reopening of a dismissed appeal is granted and a hearing is set.
    grain: One transition per reopening.
    fields:
      status: Set to scheduled.
      hearing_date: Date of the reopened hearing.
    triggers: []
  - type: appeal_closed
    target: appeals
    mutation:
      transition:
        - {from: decided, to: closed}
        - {from: withdrawn, to: closed}
        - {from: dismissed, to: closed}
    meaning: The appeal is final at this level.
    grain: One transition per appeal.
    fields:
      status: Set to closed.
      closed_date: Date it became final.
    triggers: []

measures:
  - id: appeal_msr_postponements_by_party
    window: The life of the appeal.
    measure: Count of appeal_postponement_decided rows on the appeal with postponement_outcome granted, per requested_by party.
  - id: appeal_msr_open_appeals_on_record
    window: Portfolio state at frozen time.
    measure: The party's appeals naming the same determination_record_id with status filed, scheduled or decided-but-not-closed.

policies:
  - id: appeal_agg_multi_holding
    subject: [appeal_filed]
    rule: >-
      A claimant or employer may have several appeals at once, against different determinations or on different dockets, so the number of appeals per customer is not capped.
      An appeal is accepted for filing only when the same party has no other appeal against the same determination or decision with status filed, scheduled or decided.
      A party's second letter about a determination already under appeal is added to the existing appeal file as argument, and another party's appeal of the same determination is a separate appeal heard together with the first.
    eligibility:
      - id: one_appeal_per_party_per_record
        applies_to: [appeal_filed]
        kind: dedup
        condition: "An appeal is accepted for filing only when the same party has no other appeal against the same determination or decision with status filed, scheduled or decided."
        evidence_fields: [appeals.customer_id, appeals.determination_record_id, appeals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.customer_id, appeals.determination_record_id]
          action_bindings: {appeals.customer_id: customer_id, appeals.determination_record_id: determination_record_id}
        dedup_contract:
          table: appeals
          mode: separate_record
          object_bindings: {customer_id: customer_id, determination_record_id: determination_record_id}
          duplicate_filters: {status: [filed, scheduled, decided]}
          distinct_fields: []
    params:
      max_per_customer: null
      appeals_per_party_per_determination: "=appeals_per_party_per_determination"
    measures: [appeal_msr_open_appeals_on_record]

  - id: appeal_agg_linked_dockets
    subject: [appeal_filed, appeal_hearing_scheduled]
    rule: >-
      Appeals are linked across dockets and levels.
      A Board of Review appeal may be filed only against a lower-authority appeal that has been decided, and it names that appeal in parent_appeal_id; a dismissed lower-authority appeal reaches the Board only after its reopening was denied.
      Appeals of the same parties that arise from the same facts - a separation decision and the overpayment it created, or a benefit charge and the separation behind it - are heard together on one hearing date where the dockets allow consolidation, and the decision on the earlier issue governs the later one.
      When hearing slots are short, dockets are scheduled in the order of their scheduling priority.
    eligibility:
      - id: board_needs_decided_parent
        applies_to: [appeal_filed]
        kind: authorization
        condition: "A Board of Review appeal may be filed only against a lower-authority appeal that has been decided, and it names that appeal in parent_appeal_id; a dismissed lower-authority appeal reaches the Board only after its reopening was denied."
        evidence_fields: [appeals.appeal_id, appeals.status, appeals.parent_appeal_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.parent_appeal_id]
          action_bindings: {appeals.parent_appeal_id: parent_appeal_id}
    params:
      per_tier:
        Lower Authority Appeal — Separation Issue: {consolidated_hearing_allowed: "=consolidated_hearing_allowed", scheduling_priority_rank: "=scheduling_priority_rank"}
        Lower Authority Appeal — Able and Available Issue: {consolidated_hearing_allowed: "=consolidated_hearing_allowed", scheduling_priority_rank: "=scheduling_priority_rank"}
        Lower Authority Appeal — Monetary Determination: {consolidated_hearing_allowed: "=consolidated_hearing_allowed", scheduling_priority_rank: "=scheduling_priority_rank"}
        Lower Authority Appeal — Overpayment and Fraud: {consolidated_hearing_allowed: "=consolidated_hearing_allowed", scheduling_priority_rank: "=scheduling_priority_rank"}
        Lower Authority Appeal — Employer Benefit Charge: {consolidated_hearing_allowed: "=consolidated_hearing_allowed", scheduling_priority_rank: "=scheduling_priority_rank"}
        Lower Authority Appeal — Employer Contribution Rate: {consolidated_hearing_allowed: "=consolidated_hearing_allowed", scheduling_priority_rank: "=scheduling_priority_rank"}
        Higher Authority Appeal — Board of Review: {consolidated_hearing_allowed: "=consolidated_hearing_allowed", scheduling_priority_rank: "=scheduling_priority_rank"}
      next_level: "=next_level"

  - id: appeal_evt_filing
    subject: [appeal_filed, appeal_dismissed]
    rule: >-
      An appeal must be in writing and filed through the online portal, by mail or by fax; a request made only by phone is not an appeal, and there is no filing fee.
      An appeal is timely only when it is filed no later than the filing deadline after the mailing date of the appealed determination or decision.
      The deadline is counted in calendar days starting the day after the mailing date; when the last day falls on a Saturday, Sunday or state holiday the deadline moves to the next business day, and the filing date is the postmark, fax or online submission date.
      A late appeal is still filed when the appellant states good cause in late_filing_reason, and it is heard on good cause and the merits together; a late appeal filed after the late appeal limit, or with no good cause stated, is dismissed as untimely.
      The appellant receives an acknowledgment with the docket number within the acknowledgment business days.
      While a claimant's appeal is pending the claimant must keep certifying each week where the docket requires it, or weeks won on appeal cannot be paid; an appeal of an overpayment determination suspends its recovery, and an employer appealing a contribution rate keeps paying at the appealed rate.
    eligibility:
      - id: filing_deadline
        applies_to: [appeal_filed]
        kind: time
        condition: "An appeal is timely only when it is filed no later than the filing deadline after the mailing date of the appealed determination or decision."
        evidence_fields: [appeals.determination_record_id, appeals.determination_mailed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.determination_record_id]
          action_bindings: {appeals.determination_record_id: determination_record_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the mailing date of the appealed determination or decision
          anchor_source: appeals.determination_mailed_date
          relation: not_after
          duration_source: variants.filing_deadline_days
          unit: calendar_days
          counting_rule: "The deadline is counted in calendar days starting the day after the mailing date; when the last day falls on a Saturday, Sunday or state holiday the deadline moves to the next business day, and the filing date is the postmark, fax or online submission date."
          boundary: inclusive
    params:
      per_tier:
        Lower Authority Appeal — Separation Issue: {filing_deadline_days: "=filing_deadline_days", late_appeal_max_days: "=late_appeal_max_days", continue_certifying_required: "=continue_certifying_required", recovery_suspended_while_pending: "=recovery_suspended_while_pending", contributions_payable_while_pending: "=contributions_payable_while_pending"}
        Lower Authority Appeal — Able and Available Issue: {filing_deadline_days: "=filing_deadline_days", late_appeal_max_days: "=late_appeal_max_days", continue_certifying_required: "=continue_certifying_required", recovery_suspended_while_pending: "=recovery_suspended_while_pending", contributions_payable_while_pending: "=contributions_payable_while_pending"}
        Lower Authority Appeal — Monetary Determination: {filing_deadline_days: "=filing_deadline_days", late_appeal_max_days: "=late_appeal_max_days", continue_certifying_required: "=continue_certifying_required", recovery_suspended_while_pending: "=recovery_suspended_while_pending", contributions_payable_while_pending: "=contributions_payable_while_pending"}
        Lower Authority Appeal — Overpayment and Fraud: {filing_deadline_days: "=filing_deadline_days", late_appeal_max_days: "=late_appeal_max_days", continue_certifying_required: "=continue_certifying_required", recovery_suspended_while_pending: "=recovery_suspended_while_pending", contributions_payable_while_pending: "=contributions_payable_while_pending"}
        Lower Authority Appeal — Employer Benefit Charge: {filing_deadline_days: "=filing_deadline_days", late_appeal_max_days: "=late_appeal_max_days", continue_certifying_required: "=continue_certifying_required", recovery_suspended_while_pending: "=recovery_suspended_while_pending", contributions_payable_while_pending: "=contributions_payable_while_pending"}
