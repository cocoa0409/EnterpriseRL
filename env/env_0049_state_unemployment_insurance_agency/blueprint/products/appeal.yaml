      timeliness_basis: "=timeliness_basis"
      filing_channels: "=filing_channels"
      filing_fee: "=filing_fee"
      late_appeal_good_cause_accepted: "=late_appeal_good_cause_accepted"
      filing_acknowledgment_business_days: "=filing_acknowledgment_business_days"
      free_legal_aid_referral: "=free_legal_aid_referral"
      representation_allowed: "=representation_allowed"

  - id: appeal_evt_scheduling
    subject: [appeal_docketed, appeal_hearing_scheduled]
    rule: >-
      Dockets with hearings are set for a hearing in the docket's default mode, and a party may ask for an in-person hearing where the docket allows it; the Board of Review decides on the record and sets no hearing, accepting written argument within its written argument days.
      A hearing is set only while the appeal status is filed, scheduled or dismissed.
      The first hearing is set within the docket's scheduling target after filing, the hearing notice is mailed at least the notice minimum days before the hearing date, and every interested party of the docket is notified.
      Each party must register the phone number at which it will be called no later than the registration business days before the hearing; the hearing officer calls at the start time and waits the call wait minutes before proceeding without a party who does not answer.
      Hearing notices and decisions are delivered by mail and in the online portal.
    eligibility:
      - id: hearing_on_open_appeal
        applies_to: [appeal_hearing_scheduled]
        kind: state
        condition: "A hearing is set only while the appeal status is filed, scheduled or dismissed."
        evidence_fields: [appeals.appeal_id, appeals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.appeal_id]
          action_bindings: {appeals.appeal_id: appeal_id}
        state_contract:
          field: appeals.status
          allowed: [filed, scheduled, dismissed]
    params:
      per_tier:
        Lower Authority Appeal — Separation Issue: {hearing_held: "=hearing_held", default_hearing_mode: "=default_hearing_mode", scheduling_target_days: "=scheduling_target_days", hearing_notice_min_days: "=hearing_notice_min_days", hearing_length_minutes: "=hearing_length_minutes", interested_parties: "=interested_parties"}
        Lower Authority Appeal — Able and Available Issue: {hearing_held: "=hearing_held", default_hearing_mode: "=default_hearing_mode", scheduling_target_days: "=scheduling_target_days", hearing_notice_min_days: "=hearing_notice_min_days", hearing_length_minutes: "=hearing_length_minutes", interested_parties: "=interested_parties"}
        Lower Authority Appeal — Monetary Determination: {hearing_held: "=hearing_held", default_hearing_mode: "=default_hearing_mode", scheduling_target_days: "=scheduling_target_days", hearing_notice_min_days: "=hearing_notice_min_days", hearing_length_minutes: "=hearing_length_minutes", interested_parties: "=interested_parties"}
        Lower Authority Appeal — Overpayment and Fraud: {hearing_held: "=hearing_held", default_hearing_mode: "=default_hearing_mode", scheduling_target_days: "=scheduling_target_days", hearing_notice_min_days: "=hearing_notice_min_days", hearing_length_minutes: "=hearing_length_minutes", interested_parties: "=interested_parties"}
        Lower Authority Appeal — Employer Benefit Charge: {hearing_held: "=hearing_held", default_hearing_mode: "=default_hearing_mode", scheduling_target_days: "=scheduling_target_days", hearing_notice_min_days: "=hearing_notice_min_days", hearing_length_minutes: "=hearing_length_minutes", interested_parties: "=interested_parties"}
        Lower Authority Appeal — Employer Contribution Rate: {hearing_held: "=hearing_held", default_hearing_mode: "=default_hearing_mode", scheduling_target_days: "=scheduling_target_days", hearing_notice_min_days: "=hearing_notice_min_days", hearing_length_minutes: "=hearing_length_minutes", interested_parties: "=interested_parties"}
        Higher Authority Appeal — Board of Review: {hearing_held: "=hearing_held", default_hearing_mode: "=default_hearing_mode", scheduling_target_days: "=scheduling_target_days", hearing_notice_min_days: "=hearing_notice_min_days", hearing_length_minutes: "=hearing_length_minutes", interested_parties: "=interested_parties"}
