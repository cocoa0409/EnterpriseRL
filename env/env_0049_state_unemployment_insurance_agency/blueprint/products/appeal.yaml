  - id: appeal_closure
    subject: [appeal_closed]
    rule: >-
      A lower-authority decision becomes final, and the appeal closes, when the Board of Review filing deadline after the decision mailing date passes with no Board appeal, or when a Board appeal naming it is filed; a Board decision becomes final when the court review deadline passes.
      A withdrawn appeal closes on confirmation, and a dismissed appeal closes when the reopening window passes without a granted reopening.
      A closed appeal is never reopened; further review is only by appeal to the next level within its deadline.
    eligibility: []
    params:
      court_review_deadline_days: "=court_review_deadline_days"
      reopening_request_days: "=reopening_request_days"
