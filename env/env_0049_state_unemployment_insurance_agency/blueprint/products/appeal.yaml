      hearing_call_wait_minutes: "=hearing_call_wait_minutes"
      notice_delivery: "=notice_delivery"

  - id: appeal_evt_postponement
    subject: [appeal_postponement_decided]
    rule: >-
      A party may ask to postpone a set hearing.
      A non-emergency postponement is granted only when it is requested no later than the postponement lead business days before the hearing date.
      The lead time is counted backward in business days (Monday through Friday excluding state holidays) from the hearing date, so a request received on the last business day of the lead time is in time and a later one is not.
      A later request is granted only for a documented emergency.
      A party receives no more postponements on one appeal than the docket's maximum (appeal_msr_postponements_by_party); a request beyond it is denied.
      A granted postponement resets the hearing within the reschedule window, with a new notice that again meets the notice minimum days.
      A party who simply does not appear has not been granted a postponement and is handled under appeal_evt_default_and_reopening.
    eligibility:
      - id: postponement_lead_time
        applies_to: [appeal_postponement_decided]
        kind: time
        condition: "A non-emergency postponement is granted only when it is requested no later than the postponement lead business days before the hearing date."
        evidence_fields: [appeals.appeal_id, appeals.hearing_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.appeal_id]
          action_bindings: {appeals.appeal_id: appeal_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the hearing date
          anchor_source: appeals.hearing_date
          relation: not_after
          duration_source: variants.postponement_request_min_business_days
          unit: business_days
          counting_rule: "The lead time is counted backward in business days (Monday through Friday excluding state holidays) from the hearing date, so a request received on the last business day of the lead time is in time and a later one is not."
          boundary: inclusive
    params:
      per_tier:
        Lower Authority Appeal — Separation Issue: {postponement_request_min_business_days: "=postponement_request_min_business_days", max_postponements_per_party: "=max_postponements_per_party", reschedule_window_days: "=reschedule_window_days"}
        Lower Authority Appeal — Able and Available Issue: {postponement_request_min_business_days: "=postponement_request_min_business_days", max_postponements_per_party: "=max_postponements_per_party", reschedule_window_days: "=reschedule_window_days"}
        Lower Authority Appeal — Monetary Determination: {postponement_request_min_business_days: "=postponement_request_min_business_days", max_postponements_per_party: "=max_postponements_per_party", reschedule_window_days: "=reschedule_window_days"}
        Lower Authority Appeal — Overpayment and Fraud: {postponement_request_min_business_days: "=postponement_request_min_business_days", max_postponements_per_party: "=max_postponements_per_party", reschedule_window_days: "=reschedule_window_days"}
        Lower Authority Appeal — Employer Benefit Charge: {postponement_request_min_business_days: "=postponement_request_min_business_days", max_postponements_per_party: "=max_postponements_per_party", reschedule_window_days: "=reschedule_window_days"}
        Lower Authority Appeal — Employer Contribution Rate: {postponement_request_min_business_days: "=postponement_request_min_business_days", max_postponements_per_party: "=max_postponements_per_party", reschedule_window_days: "=reschedule_window_days"}
        Higher Authority Appeal — Board of Review: {postponement_request_min_business_days: "=postponement_request_min_business_days", max_postponements_per_party: "=max_postponements_per_party", reschedule_window_days: "=reschedule_window_days"}
      postponement_emergency_exception: "=postponement_emergency_exception"
    measures: [appeal_msr_postponements_by_party]

  - id: appeal_evt_exhibits_and_interpreters
    subject: [appeal_exhibit_received, appeal_interpreter_requested]
    rule: >-
      Documentary exhibits must be received no later than the exhibit deadline business days before the hearing, counted backward in business days from the hearing date; an exhibit received later is recorded as late and admitted only with good cause.
      Each party sends its exhibits to the appeals office and to every other party.
      A subpoena for a witness or document must be requested no later than the subpoena business days before the hearing.
      An interpreter is provided free of charge in the requested language, and a request is recorded once per party and language.
      Exhibits and interpreter requests are not taken on a Board of Review appeal, which is decided on the lower-authority record and written argument.
    eligibility: []
    params:
      per_tier:
        Lower Authority Appeal — Separation Issue: {exhibit_deadline_business_days: "=exhibit_deadline_business_days", subpoena_request_min_business_days: "=subpoena_request_min_business_days"}
        Lower Authority Appeal — Able and Available Issue: {exhibit_deadline_business_days: "=exhibit_deadline_business_days", subpoena_request_min_business_days: "=subpoena_request_min_business_days"}
        Lower Authority Appeal — Monetary Determination: {exhibit_deadline_business_days: "=exhibit_deadline_business_days", subpoena_request_min_business_days: "=subpoena_request_min_business_days"}
        Lower Authority Appeal — Overpayment and Fraud: {exhibit_deadline_business_days: "=exhibit_deadline_business_days", subpoena_request_min_business_days: "=subpoena_request_min_business_days"}
        Lower Authority Appeal — Employer Benefit Charge: {exhibit_deadline_business_days: "=exhibit_deadline_business_days", subpoena_request_min_business_days: "=subpoena_request_min_business_days"}
        Lower Authority Appeal — Employer Contribution Rate: {exhibit_deadline_business_days: "=exhibit_deadline_business_days", subpoena_request_min_business_days: "=subpoena_request_min_business_days"}
        Higher Authority Appeal — Board of Review: {exhibit_deadline_business_days: "=exhibit_deadline_business_days", subpoena_request_min_business_days: "=subpoena_request_min_business_days"}
      late_exhibit_admission: "=late_exhibit_admission"
      interpreter_provided_free: "=interpreter_provided_free"

  - id: appeal_evt_decision
    subject: [appeal_decision_issued]
    rule: >-
      The decision affirms, reverses or modifies the appealed determination, or, on the Board of Review only, remands it for a new hearing; it applies the docket's burden and standard of proof, and when only the other party is absent the decision rests on the evidence presented.
      Decisions are targeted within the docket's decision target days after filing.
      Where the docket pays when due, benefits are paid for weeks the decision finds payable as soon as it is issued, even if the other party appeals further, provided the claimant certified those weeks; if a later decision reverses it, the benefits paid become an appeal-reversal overpayment.
      A decision reversing an overpayment determination cancels the overpayment and one affirming it resumes recovery; a decision reversing a denial of charge relief relieves the employer's charges; a decision reversing or modifying a contribution rate causes a corrected rate notice, with contributions already paid above the corrected rate credited to the employer's account.
    eligibility: []
    params:
      per_tier:
        Lower Authority Appeal — Separation Issue: {burden_of_proof: "=burden_of_proof", standard_of_proof: "=standard_of_proof", pay_when_due_after_favorable_decision: "=pay_when_due_after_favorable_decision", decision_target_days: "=decision_target_days", remand_allowed: "=remand_allowed"}
        Lower Authority Appeal — Able and Available Issue: {burden_of_proof: "=burden_of_proof", standard_of_proof: "=standard_of_proof", pay_when_due_after_favorable_decision: "=pay_when_due_after_favorable_decision", decision_target_days: "=decision_target_days", remand_allowed: "=remand_allowed"}
        Lower Authority Appeal — Monetary Determination: {burden_of_proof: "=burden_of_proof", standard_of_proof: "=standard_of_proof", pay_when_due_after_favorable_decision: "=pay_when_due_after_favorable_decision", decision_target_days: "=decision_target_days", remand_allowed: "=remand_allowed"}
        Lower Authority Appeal — Overpayment and Fraud: {burden_of_proof: "=burden_of_proof", standard_of_proof: "=standard_of_proof", pay_when_due_after_favorable_decision: "=pay_when_due_after_favorable_decision", decision_target_days: "=decision_target_days", remand_allowed: "=remand_allowed"}
        Lower Authority Appeal — Employer Benefit Charge: {burden_of_proof: "=burden_of_proof", standard_of_proof: "=standard_of_proof", pay_when_due_after_favorable_decision: "=pay_when_due_after_favorable_decision", decision_target_days: "=decision_target_days", remand_allowed: "=remand_allowed"}
        Lower Authority Appeal — Employer Contribution Rate: {burden_of_proof: "=burden_of_proof", standard_of_proof: "=standard_of_proof", pay_when_due_after_favorable_decision: "=pay_when_due_after_favorable_decision", decision_target_days: "=decision_target_days", remand_allowed: "=remand_allowed"}
        Higher Authority Appeal — Board of Review: {burden_of_proof: "=burden_of_proof", standard_of_proof: "=standard_of_proof", pay_when_due_after_favorable_decision: "=pay_when_due_after_favorable_decision", decision_target_days: "=decision_target_days", remand_allowed: "=remand_allowed"}
      respondent_absence_result: "=respondent_absence_result"

  - id: appeal_evt_withdrawal
    subject: [appeal_withdrawn]
    rule: >-
      Only the appellant may withdraw an appeal; the agent records the appellant's withdrawal request and the appeal is withdrawn once the appellant confirms it.
      An appeal may be withdrawn only while its status is filed or scheduled, that is, until the decision is issued.
      Withdrawal makes the appealed determination final as if no appeal had been filed: an overpayment's recovery resumes, and an appeal withdrawn after the filing deadline cannot be refiled.
    eligibility:
      - id: appellant_confirmed_withdrawal
        applies_to: [appeal_withdrawn]
        kind: authorization
        condition: "Only the appellant may withdraw an appeal; the agent records the appellant's withdrawal request and the appeal is withdrawn once the appellant confirms it."
        evidence_fields: [appeal_requests.appeal_request_id, appeal_requests.appeal_id, appeal_requests.request_type, appeal_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_requests.appeal_id]
          action_bindings: {appeal_requests.appeal_id: appeal_id}
    params:
      withdrawal_allowed_until: "=withdrawal_allowed_until"

  - id: appeal_evt_default_and_reopening
    subject: [appeal_dismissed, appeal_reopened]
    rule: >-
      An appeal is dismissed as untimely when it was filed late without good cause or after the late appeal limit, and dismissed for default when the appellant does not answer the hearing call within the call wait minutes; when only the other party is absent the hearing proceeds.
      A dismissed appeal may be reopened when the appellant asks for reopening with good cause.
      Reopening is granted only when it is requested no later than the reopening window after the mailing date of the dismissal.
      The window is counted in calendar days starting the day after the mailing date of the dismissal, and a request on the last day is in time.
      Good cause and the merits are heard at the same reopened hearing where the docket combines them; a reopening request that is late or shows no good cause is denied and the dismissal stands.
    eligibility:
      - id: reopening_window
        applies_to: [appeal_reopened]
        kind: time
        condition: "Reopening is granted only when it is requested no later than the reopening window after the mailing date of the dismissal."
        evidence_fields: [appeals.appeal_id, appeals.decision_mailed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.appeal_id]
          action_bindings: {appeals.appeal_id: appeal_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the mailing date of the dismissal
          anchor_source: appeals.decision_mailed_date
          relation: not_after
          duration_source: variants.reopening_request_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the mailing date of the dismissal, and a request on the last day is in time."
          boundary: inclusive
