        Higher Authority Appeal — Board of Review: {filing_deadline_days: "=filing_deadline_days", late_appeal_max_days: "=late_appeal_max_days", continue_certifying_required: "=continue_certifying_required", recovery_suspended_while_pending: "=recovery_suspended_while_pending", contributions_payable_while_pending: "=contributions_payable_while_pending"}
