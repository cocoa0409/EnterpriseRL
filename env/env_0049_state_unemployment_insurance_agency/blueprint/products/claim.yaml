      filing_deadline_days: 30
      dua_late_filing_limit_weeks: 26
      proof_of_employment_days: 21
      inactivity_weeks_to_inactivate: 2
      benefit_year_length_weeks: 26
      employer_charge_share: 0.00
      funding_source: fema_disaster_funds
      wage_verification_source: proof_of_employment_or_self_employment
      ucx_min_continuous_active_days: 0
      eb_min_weeks_employment: 0
      tra_training_enrollment_deadline_weeks: 0
      tra_additional_training_weeks: 0
      dua_disaster_assistance_period_weeks: 26
      vacation_pay_deductible: true
      holiday_pay_deductible: true
      severance_pay_deductible: false
      pension_offset_pct: 1.00
      pension_offset_pct_claimant_contributed: 0.50
      lost_check_reissue_wait_business_days: 10
      returned_deposit_reissue_method: paper_check
      payment_method_change_lead_business_days: 2
      debit_card_free_replacements_per_benefit_year: 1
      default_payment_method: debit_card
      identity_verification_required: true
      reopen_separation_review_required: false
      monetary_redetermination_request_days: 21
      tax_statement_issue_deadline: January 31
      tax_statement_correction_lookback_years: 3
      reissued_payment_charge_neutral: true

events:
  - type: claim_filed
    target: claims
    mutation: create
    meaning: The claimant files an initial claim under one program, opening a claim record in status filed.
    grain: One row per initial claim filed by a claimant under one program for one benefit year.
    fields:
      customer_id: The claimant who filed.
      variant_name: The program the claim is filed under, written as the official program name.
      filed_date: Date the initial claim was filed.
      effective_date: Sunday of the week in which the claim was filed.
      benefit_year_end_date: Saturday ending the program's benefit year counted from the effective date.
      separation_reason: Reason for the separation from the most recent employer as reported at filing.
      separating_employer_account_id: Employer tax account of the most recent employer, empty for UCFE, UCX and DUA.
      recall_date: Definite recall date given by the employer for a temporary layoff, empty when none.
      parent_claim_id: For Extended Benefits and Trade Readjustment Allowances, the exhausted claim being extended; empty otherwise.
      disaster_declaration_date: For Disaster Unemployment Assistance, the date the disaster declaration was announced; empty otherwise.
      payment_method: Payment method elected at filing.
    triggers:
      - event: idv:idv_case_opened
        when: {variant_name: [Regular State Unemployment Insurance, Unemployment Compensation for Federal Employees (UCFE), Unemployment Compensation for Ex-Servicemembers (UCX), Combined Wage Claim (CWC), Disaster Unemployment Assistance (DUA)]}
        map: {claim_id: claim_id, customer_id: customer_id}
      - event: charge:charge_position_opened
        when: {variant_name: [Regular State Unemployment Insurance, Combined Wage Claim (CWC), Extended Benefits (EB)]}
        map: {claim_id: claim_id}
  - type: claim_monetary_determined
    target: claims
    mutation: update
    meaning: A monetary determination or redetermination fixes the base period, wages, weekly benefit amount and maximum benefit amount of the claim.
    grain: One holding update per monetary determination number.
    fields:
      determination_number: Sequence of the determination on this claim, 1 for the original and 2 or more for redeterminations.
      monetary_determination_date: Date this determination was issued.
      base_period_type: Whether the standard or the alternate base period was used.
      base_period_start_quarter: First calendar quarter of the base period used.
      base_period_end_quarter: Last calendar quarter of the base period used.
      high_quarter_wages: Wages in the highest-paid quarter of the base period.
      base_period_wages: Total wages in the base period.
      weekly_benefit_amount: Weekly benefit amount determined.
      dependents_count: Dependents on record for the allowance.
      dependency_allowance: Weekly dependency allowance determined.
      max_benefit_amount: Maximum benefit amount determined.
      monetary_status: Outcome of the determination.
    triggers:
      - event: claim:claim_entitlement_credited
        when: {monetary_status: eligible}
        map: {determination_number: determination_number}
      - event: claim:claim_activated
        when: {monetary_status: eligible, determination_number: 1}
        map: {status: active}
      - event: claim:claim_denied_monetary
        when: {monetary_status: ineligible, determination_number: 1}
        map: {status: ineligible}
  - type: claim_entitlement_credited
    target: claim_ledger
    meaning: The maximum benefit amount of an eligible determination, or the increase made by a redetermination, is credited to the remaining benefit balance.
    grain: One row per claim per determination number that credits entitlement.
    distinguish_by: [determination_number]
    fields:
      determination_number: Determination that produced the credit.
      amount: Amount credited, positive.
      entry_date: Date the credit was booked.
    account: remaining_benefit_balance
    direction: in
    triggers: []
  - type: claim_entitlement_reduced
    target: claim_ledger
    meaning: A monetary redetermination lowers the maximum benefit amount and the reduction is debited from the remaining benefit balance.
    grain: One row per claim per determination number that reduces entitlement.
    distinguish_by: [determination_number]
    fields:
      determination_number: Redetermination that produced the reduction.
      amount: Amount debited, positive.
      entry_date: Date the reduction was booked.
    account: remaining_benefit_balance
    direction: out
    triggers: []
  - type: claim_activated
    target: claims
    mutation: {transition: {from: filed, to: active}}
    meaning: The claim becomes active after an eligible first monetary determination.
    grain: One transition per claim.
    fields:
      status: Set to active.
    triggers: []
  - type: claim_denied_monetary
    target: claims
    mutation: {transition: {from: filed, to: ineligible}}
    meaning: The claim is found monetarily ineligible on its first determination.
    grain: One transition per claim.
    fields:
      status: Set to ineligible.
    triggers: []
  - type: claim_week_certified
    target: claim_certifications
    meaning: The claimant certifies one benefit week, answering the eligibility questions and reporting earnings, other pay and work search.
    grain: One row per claim per week ending date certified.
    distinguish_by: [week_ending_date]
    fields:
      week_ending_date: Saturday ending the certified week.
      certified_date: Date the certification was filed.
      cert_channel: Channel used to certify.
      cert_timeliness: Timeliness classification of the certification.
      able_and_available: Whether the claimant answered that they were able and available for full-time work all week.
      work_refused: Whether the claimant reported refusing an offer of work.
      gross_earnings: Gross earnings for work performed in the week.
      hours_worked: Hours worked in the week.
      work_search_contacts: Number of work-search contacts reported for the week.
      other_pay_type: Kind of other pay reported for the week.
      other_pay_amount: Weekly amount of the other pay reported.
    triggers:
      - event: claim:claim_placed_on_hold
        when: {able_and_available: false}
        map: {hold_reason: nonmonetary_issue}
      - event: claim:claim_placed_on_hold
        when: {work_refused: true}
        map: {hold_reason: nonmonetary_issue}
  - type: claim_waiting_week_served
    target: claim_ledger
    meaning: An otherwise-payable week is served as the unpaid waiting week.
    grain: One row per claim per week ending date served as a waiting week.
    distinguish_by: [week_ending_date]
    fields:
      week_ending_date: Saturday ending the waiting week.
      entry_date: Date the waiting week was recorded.
    triggers: []
  - type: claim_benefit_paid
    target: claim_ledger
    meaning: A benefit payment for a certified week is issued and debited from the remaining benefit balance.
    grain: One row per payment issued for one week ending date (weekly, supplemental or reissue).
    distinguish_by: [week_ending_date, payment_kind, entry_date]
    fields:
      week_ending_date: Saturday ending the week paid.
      payment_kind: Whether this is the weekly payment, a supplemental correction or a reissue of a cancelled payment.
      amount: Gross payable amount charged to the balance, positive.
      earnings_deduction: Deduction for gross earnings above the disregard.
      other_pay_deduction: Deduction for vacation, holiday or pension pay.
      offset_amount: Part of the payment applied to an overpayment, zero when none.
      offset_applied: Whether an overpayment offset was taken from this payment.
      withholding_applied: Whether any income tax, child support or SNAP deduction was taken from this payment.
      charge_code: How the payment is charged to employers.
      payment_method: Method through which the payment was issued.
      original_payment_id: For a reissue, the cancelled payment being replaced; empty otherwise.
      entry_date: Date the payment was issued.
    account: remaining_benefit_balance
    direction: out
    triggers:
      - event: overpay:overpay_offset_recovered
        when: {offset_applied: true}
        map: {source_payment_id: ledger_entry_id, amount: offset_amount, week_ending_date: week_ending_date}
      - event: withhold:withhold_deduction_taken
        when: {withholding_applied: true}
        map: {source_payment_id: ledger_entry_id, week_ending_date: week_ending_date}
      - event: charge:charge_benefit_posted
        when: {charge_code: [state_chargeable, eb_shared], payment_kind: [weekly, supplemental]}
        map: {source_payment_id: ledger_entry_id, week_ending_date: week_ending_date}
  - type: claim_payment_cancelled
    target: claim_ledger
    meaning: One issued payment is cancelled (returned deposit, stopped lost check, payment in error or fraud stop) and its amount is restored to the balance.
    grain: One row per original payment cancelled.
    distinguish_by: [original_payment_id]
    fields:
      original_payment_id: The single payment being cancelled.
      week_ending_date: Week ending date of the cancelled payment.
      amount: Amount restored, equal to the cancelled payment's amount.
      cancel_reason: Why the payment was cancelled.
      entry_date: Date of the cancellation.
    account: remaining_benefit_balance
    direction: in
    triggers:
      - event: claim:claim_benefit_paid
        when: {cancel_reason: [returned_by_bank, lost_or_stolen_check]}
        map: {payment_kind: reissue, original_payment_id: original_payment_id, week_ending_date: week_ending_date, amount: amount}
      - event: charge:charge_credit_reversed
        when: {cancel_reason: [issued_in_error, fraud_stop]}
        map: {credit_reason: payment_cancelled}
  - type: claim_placed_on_hold
    target: claims
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Payment on the claim is stopped while an eligibility, identity or fraud issue is resolved.
    grain: One transition per hold.
    fields:
      status: Set to on_hold.
      hold_reason: Issue that caused the hold.
    triggers: []
  - type: claim_hold_released
    target: claims
    mutation: {transition: {from: on_hold, to: active}}
    meaning: The hold is lifted after the issue is resolved on the record.
    grain: One transition per hold released.
    fields:
      status: Set to active.
      hold_reason: Reset to none.
    triggers: []
  - type: claim_inactivated
    target: claims
    mutation: {transition: {from: active, to: inactive}}
    meaning: The claim becomes inactive after the claimant stops certifying.
    grain: One transition per break in certification.
    fields:
      status: Set to inactive.
    triggers: []
  - type: claim_reopened
    target: claims
    mutation: {transition: {from: inactive, to: active}}
    meaning: The claimant reopens an inactive claim, as an additional claim when work intervened.
    grain: One transition per reopening.
    fields:
      status: Set to active.
      separation_reason: Separation reported at reopening (unchanged when no work intervened).
      separating_employer_account_id: Employer of the intervening work, when any.
    triggers:
      - event: claim:claim_placed_on_hold
        when: {separation_reason: [voluntary_quit, discharge]}
        map: {hold_reason: nonmonetary_issue}
  - type: claim_exhausted
    target: claims
    mutation: {transition: {from: active, to: exhausted}}
    meaning: The remaining benefit balance reached zero.
    grain: One transition per claim.
    fields:
      status: Set to exhausted.
    triggers: []
  - type: claim_benefit_year_closed
    target: claims
    mutation:
      transition:
        - {from: active, to: closed}
        - {from: on_hold, to: closed}
        - {from: inactive, to: closed}
        - {from: exhausted, to: closed}
        - {from: ineligible, to: closed}
    meaning: The benefit year ended and the claim is closed.
    grain: One transition per claim.
    fields:
      status: Set to closed.
      closed_date: Benefit year end date.
    triggers: []
  - type: claim_withdrawn
    target: claims
    mutation:
      transition:
        - {from: filed, to: withdrawn}
        - {from: active, to: withdrawn}
        - {from: inactive, to: withdrawn}
    meaning: The claimant confirms withdrawal of the claim.
    grain: One transition per claim.
    fields:
      status: Set to withdrawn.
      closed_date: Date the withdrawal was confirmed.
    triggers: []
  - type: claim_effective_date_backdated
    target: claims
    mutation: update
    meaning: An approved backdating request moves the claim effective date and benefit year earlier.
    grain: One holding update per approved backdating request.
    fields:
      effective_date: New, earlier Sunday effective date.
      benefit_year_end_date: Benefit year end date recomputed from the new effective date.
    triggers: []
  - type: claim_payment_method_changed
    target: claims
    mutation: update
    meaning: The claimant changes how benefits are paid.
    grain: One holding update per payment method change.
    fields:
      payment_method: New payment method.
      payment_method_effective_date: First payment date on which the new method is used.
    triggers: []
  - type: claim_1099g_issued
    target: claim_tax_statements
    meaning: The annual Form 1099-G for a tax year is issued for the claim.
    grain: One row per claim per tax year.
    distinguish_by: [tax_year]
    fields:
      tax_year: Calendar year reported.
      issued_date: Date the statement was issued.
      benefits_paid_total: Box 1 unemployment compensation.
      federal_tax_withheld: Box 4 federal income tax withheld.
      state_tax_withheld: Box 11 state income tax withheld.
      correction_reason: Set to original.
    triggers: []
  - type: claim_1099g_corrected
    target: claim_tax_statements
    meaning: A corrected Form 1099-G replaces the amounts reported for a tax year.
    grain: One row per correction issued for one claim and tax year.
    distinguish_by: [tax_year, issued_date, correction_reason]
    fields:
      tax_year: Calendar year corrected.
      issued_date: Date the corrected statement was issued.
      benefits_paid_total: Corrected Box 1.
      federal_tax_withheld: Corrected Box 4.
      state_tax_withheld: Corrected Box 11.
      correction_reason: Reason for the correction.
    triggers: []

measures:
  - id: claim_msr_weeks_paid_for_week
    window: All claims of the claimant, for one week ending date, as of frozen time.
    measure: Count of claim_benefit_paid rows with payment_kind weekly or reissue for that week_ending_date across all of the claimant's claims, minus the count of claim_payment_cancelled rows whose original_payment_id is one of those rows.
  - id: claim_msr_parent_mba
    window: Portfolio state at frozen time.
    measure: The max_benefit_amount on the claim named in this claim's parent_claim_id.
  - id: claim_msr_prior_program_mba
    window: Portfolio state at frozen time.
    measure: The max_benefit_amount of the claim named in parent_claim_id plus the max_benefit_amount of every Extended Benefits (EB) claim of the claimant naming the same parent_claim_id.
  - id: claim_msr_waiting_weeks_served
    window: The claim's benefit year.
    measure: Count of claim_waiting_week_served rows on the claim.
  - id: claim_msr_consecutive_uncertified_weeks
    window: Week ending dates after the latest certified week on the claim through the latest week ending date whose certification window has closed at frozen time.
    measure: Number of consecutive Saturdays in the window with no claim_week_certified row on the claim.
  - id: claim_msr_net_benefits_paid
    window: The claim's benefit year to frozen time.
    measure: Sum of claim_benefit_paid amount on the claim, minus the amount of claim_payment_cancelled rows on the claim, minus the principal repaid, offset, intercepted or waived on overpayments established against the claim (overpay_ledger rows of the recovery and adjustment families with component principal).
  - id: claim_msr_benefits_paid_in_tax_year
    window: One calendar tax year, by entry_date.
    measure: Sum of claim_benefit_paid amount on the claim with entry_date in the tax year, minus claim_payment_cancelled amount with entry_date in the same year.

policies:
  - id: claim_agg_multi_holding
    subject: [claim_filed]
    rule: >-
      A claimant may hold several claim records over time and may hold claims under different programs at once, so the number of claim records per claimant is not capped.
      A new claim under a program may be filed only when the claimant holds no other claim under the same program whose status is filed, active, on_hold, inactive or exhausted.
      A claim under the same program whose status is closed, withdrawn or ineligible does not block a new filing, and a claim filed after a benefit year ends starts a new benefit year with a new base period.
      Whether claims under different programs may be filed and paid together is decided by claim_agg_program_sequence.
    eligibility:
      - id: one_open_claim_per_program
        applies_to: [claim_filed]
        kind: dedup
        condition: "A new claim under a program may be filed only when the claimant holds no other claim under the same program whose status is filed, active, on_hold, inactive or exhausted."
        evidence_fields: [claims.customer_id, claims.variant_name, claims.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.customer_id, claims.variant_name]
          action_bindings: {claims.customer_id: customer_id, claims.variant_name: variant_name}
        dedup_contract:
          table: claims
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [filed, active, on_hold, inactive, exhausted]}
          distinct_fields: [effective_date]
    params:
      max_per_customer: null
      max_open_claims_per_program: 1

  - id: claim_agg_program_sequence
    subject: [claim_filed, claim_monetary_determined, claim_benefit_paid]
    rule: >-
      Programs are sequenced and mutually exclusive across a claimant's claims.
      An Extended Benefits (EB) claim extends a Regular State Unemployment Insurance, UCFE, UCX or Combined Wage Claim record named in its parent_claim_id, and a Trade Readjustment Allowances (TRA) claim extends the same kind of parent.
      An Extended Benefits or Trade Readjustment Allowances claim may be determined monetarily eligible only when the claim named in its parent_claim_id has status exhausted.
      When an Extended Benefits claim also exists on the same parent, Trade Readjustment Allowances are paid only for weeks after that Extended Benefits claim is exhausted or closed.
      A Disaster Unemployment Assistance (DUA) claim may be filed only when the claimant holds no Regular State Unemployment Insurance, UCFE, UCX or Combined Wage Claim record whose status is filed, active, on_hold or inactive, because a claimant eligible for regular unemployment compensation is not eligible for disaster assistance.
      Any one week ending date is paid under at most one claim: a weekly payment may be issued only when claim_msr_weeks_paid_for_week is zero for that week ending date across all of the claimant's claims.
      A supplemental payment for a week already paid on the same claim, and a reissue of a cancelled payment, are not second weekly payments.
    eligibility:
      - id: parent_claim_exhausted
        applies_to: [claim_monetary_determined]
        kind: state
        condition: "An Extended Benefits or Trade Readjustment Allowances claim may be determined monetarily eligible only when the claim named in its parent_claim_id has status exhausted."
        evidence_fields: [claims.claim_id, claims.parent_claim_id, claims.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.parent_claim_id]
          action_bindings: {claims.parent_claim_id: parent_claim_id}
        state_contract:
          field: claims.status
          allowed: [exhausted]
      - id: dua_excludes_open_regular_claim
        applies_to: [claim_filed]
        kind: dedup
        condition: "A Disaster Unemployment Assistance (DUA) claim may be filed only when the claimant holds no Regular State Unemployment Insurance, UCFE, UCX or Combined Wage Claim record whose status is filed, active, on_hold or inactive, because a claimant eligible for regular unemployment compensation is not eligible for disaster assistance."
        evidence_fields: [claims.customer_id, claims.variant_name, claims.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.customer_id]
          action_bindings: {claims.customer_id: customer_id}
        dedup_contract:
          table: claims
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters:
            status: [filed, active, on_hold, inactive]
            variant_name: [Regular State Unemployment Insurance, Unemployment Compensation for Federal Employees (UCFE), Unemployment Compensation for Ex-Servicemembers (UCX), Combined Wage Claim (CWC)]
          distinct_fields: []
      - id: one_claim_paid_per_week
        applies_to: [claim_benefit_paid]
        kind: dedup
        condition: "a weekly payment may be issued only when claim_msr_weeks_paid_for_week is zero for that week ending date across all of the claimant's claims"
        evidence_fields: [claim_ledger.customer_id, claim_ledger.week_ending_date, claim_ledger.payment_kind]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claim_ledger.customer_id, claim_ledger.week_ending_date]
          action_bindings: {claim_ledger.customer_id: customer_id, claim_ledger.week_ending_date: week_ending_date}
        dedup_contract:
          table: claim_ledger
          mode: separate_record
          object_bindings: {customer_id: customer_id, week_ending_date: week_ending_date}
          duplicate_filters: {event_type: [claim_benefit_paid], payment_kind: [weekly, reissue]}
          distinct_fields: [claim_id]
    measures: [claim_msr_weeks_paid_for_week]

  - id: claim_monetary_eligibility
    subject: [claim_monetary_determined, claim_entitlement_credited, claim_entitlement_reduced, claim_activated, claim_denied_monetary]
    rule: >-
      The monetary determination is computed from the base-period wages on record in the program's wage verification source.
      The standard base period is the first four of the last five completed calendar quarters before the claim effective date; when the standard base period fails and the program allows it, the alternate base period of the last four completed calendar quarters is tested, and the base period actually used is recorded in base_period_type.
      For Regular State Unemployment Insurance, UCFE, UCX and Combined Wage Claim records the claim is monetarily eligible when high-quarter wages are at least the program's minimum high-quarter wages and base-period wages are at least the minimum ratio times high-quarter wages.
      The weekly benefit amount is high-quarter wages divided by the divisor, rounded down to the whole dollar, then raised to the floor or lowered to the ceiling.
      The dependency allowance is the per-dependent amount times the number of dependents on record, counting no more than the maximum number of dependents.
      The maximum benefit amount is the lesser of the maximum duration weeks times the weekly benefit amount plus dependency allowance and the base-period-wage fraction times base-period wages, rounded down to the whole dollar.
      Extended, trade and disaster programs are computed under claim_extended_program_entitlement.
      An eligible determination sets monetary_status to eligible and credits the maximum benefit amount to the remaining benefit balance, and the first eligible determination activates a filed claim; an ineligible first determination sets monetary_status to ineligible, credits nothing and moves the filed claim to ineligible.
      A monetary redetermination carries the next determination_number and books only the difference from the previous maximum benefit amount: an increase is credited and a decrease is debited, and payments already issued are not reversed by the redetermination.
      A redetermination request supported by missing-wage proof is accepted only when it is received no later than the redetermination request window after the monetary determination date.
      The window is counted in calendar days starting the day after the monetary determination date, and a request received on the last day of the window is timely.
      A later request is not a redetermination request and can only be pursued as an appeal of the monetary determination.
    eligibility:
      - id: redetermination_request_window
        applies_to: [claim_monetary_determined]
        kind: time
        condition: "A redetermination request supported by missing-wage proof is accepted only when it is received no later than the redetermination request window after the monetary determination date."
        evidence_fields: [claims.claim_id, claims.monetary_determination_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.claim_id]
          action_bindings: {claims.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the monetary determination date
          anchor_source: claims.monetary_determination_date
          relation: not_after
          duration_source: variants.monetary_redetermination_request_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the monetary determination date, and a request received on the last day of the window is timely."
          boundary: inclusive
    params:
      per_tier:
        Regular State Unemployment Insurance: {min_high_quarter_wages: "=min_high_quarter_wages", max_duration_weeks: "=max_duration_weeks", mba_bpw_fraction: "=mba_bpw_fraction", alternate_base_period_available: "=alternate_base_period_available"}
        Unemployment Compensation for Federal Employees (UCFE): {min_high_quarter_wages: "=min_high_quarter_wages", max_duration_weeks: "=max_duration_weeks", mba_bpw_fraction: "=mba_bpw_fraction", alternate_base_period_available: "=alternate_base_period_available"}
        Unemployment Compensation for Ex-Servicemembers (UCX): {min_high_quarter_wages: "=min_high_quarter_wages", max_duration_weeks: "=max_duration_weeks", mba_bpw_fraction: "=mba_bpw_fraction", alternate_base_period_available: "=alternate_base_period_available"}
        Combined Wage Claim (CWC): {min_high_quarter_wages: "=min_high_quarter_wages", max_duration_weeks: "=max_duration_weeks", mba_bpw_fraction: "=mba_bpw_fraction", alternate_base_period_available: "=alternate_base_period_available"}
        Extended Benefits (EB): {min_high_quarter_wages: "=min_high_quarter_wages", max_duration_weeks: "=max_duration_weeks", mba_bpw_fraction: "=mba_bpw_fraction", alternate_base_period_available: "=alternate_base_period_available"}
        Trade Readjustment Allowances (TRA): {min_high_quarter_wages: "=min_high_quarter_wages", max_duration_weeks: "=max_duration_weeks", mba_bpw_fraction: "=mba_bpw_fraction", alternate_base_period_available: "=alternate_base_period_available"}
        Disaster Unemployment Assistance (DUA): {min_high_quarter_wages: "=min_high_quarter_wages", max_duration_weeks: "=max_duration_weeks", mba_bpw_fraction: "=mba_bpw_fraction", alternate_base_period_available: "=alternate_base_period_available"}
      bpw_to_hqw_ratio_min: "=bpw_to_hqw_ratio_min"
      wba_hqw_divisor: "=wba_hqw_divisor"
      min_weekly_benefit: "=min_weekly_benefit"
      max_weekly_benefit: "=max_weekly_benefit"
      dependency_allowance_per_dependent: "=dependency_allowance_per_dependent"
      dependency_allowance_max_dependents: "=dependency_allowance_max_dependents"
      benefit_rounding_rule: "=benefit_rounding_rule"
      wage_verification_source: "=wage_verification_source"
      monetary_redetermination_request_days: "=monetary_redetermination_request_days"
    formula:
      monetarily_eligible: "high_quarter_wages >= min_high_quarter_wages and base_period_wages >= bpw_to_hqw_ratio_min * high_quarter_wages"
      weekly_benefit_amount: "min(max_weekly_benefit, max(min_weekly_benefit, high_quarter_wages / wba_hqw_divisor))"
      dependency_allowance: "min(dependents_count, dependency_allowance_max_dependents) * dependency_allowance_per_dependent"
      max_benefit_amount: "min(max_duration_weeks * (weekly_benefit_amount + dependency_allowance), mba_bpw_fraction * base_period_wages)"

  - id: claim_extended_program_entitlement
    subject: [claim_filed, claim_monetary_determined]
    rule: >-
      Extended Benefits (EB), Trade Readjustment Allowances (TRA) and Disaster Unemployment Assistance (DUA) entitlements are computed differently from regular programs.
      An Extended Benefits claim uses the weekly benefit amount and dependency allowance of its parent claim, the claimant must show the minimum weeks of full-time base-period employment, and its maximum benefit amount is the lesser of the Extended Benefits fraction times the parent claim's maximum benefit amount (claim_msr_parent_mba) and the maximum duration weeks times the weekly benefit amount plus dependency allowance.
      A Trade Readjustment Allowances claim uses the parent claim's weekly benefit amount plus dependency allowance, and its basic maximum benefit amount is the maximum duration weeks times that weekly amount minus the entitlement of the parent and of any Extended Benefits claim on the same parent (claim_msr_prior_program_mba).
      Additional training weeks of Trade Readjustment Allowances are credited by a monetary redetermination only after basic entitlement is exhausted and only while approved_training is enrolled, and the claimant must have enrolled by the training enrollment deadline.
      A Disaster Unemployment Assistance claim has no wage test; its weekly benefit amount is computed from the proof of employment or self-employment with the same divisor, is never below the program floor and never above the ceiling, and its maximum benefit amount is the maximum duration weeks times the weekly benefit amount, payable only for weeks inside the disaster assistance period.
      Proof of employment or self-employment must reach the agency within the proof deadline after filing, or the claim is redetermined at the program floor and any amount paid above the floor becomes an overpayment.
      A Disaster Unemployment Assistance claim may be filed without good cause only on or before the filing deadline after the disaster declaration announcement.
      The filing deadline is counted in calendar days starting the day after the disaster declaration announcement, and a claim filed on the last day is timely.
      With good cause a later claim is accepted until the late filing limit weeks after the announcement, and never after it.
    eligibility:
      - id: dua_filing_deadline
        applies_to: [claim_filed]
        kind: time
        condition: "A Disaster Unemployment Assistance claim may be filed without good cause only on or before the filing deadline after the disaster declaration announcement."
        evidence_fields: [claims.claim_id, claims.disaster_declaration_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.disaster_declaration_date]
          action_bindings: {claims.disaster_declaration_date: disaster_declaration_date}
        temporal_basis:
          clock: frozen_time
          anchor_event: the disaster declaration announcement
          anchor_source: claims.disaster_declaration_date
          relation: not_after
          duration_source: variants.filing_deadline_days
          unit: calendar_days
          counting_rule: "The filing deadline is counted in calendar days starting the day after the disaster declaration announcement, and a claim filed on the last day is timely."
          boundary: inclusive
    params:
      eb_regular_mba_fraction: "=eb_regular_mba_fraction"
      eb_min_weeks_employment: "=eb_min_weeks_employment"
      tra_prior_benefit_offset: "=tra_prior_benefit_offset"
      tra_training_enrollment_deadline_weeks: "=tra_training_enrollment_deadline_weeks"
      tra_additional_training_weeks: "=tra_additional_training_weeks"
      dua_disaster_assistance_period_weeks: "=dua_disaster_assistance_period_weeks"
      proof_of_employment_days: "=proof_of_employment_days"
      filing_deadline_days: "=filing_deadline_days"
      dua_late_filing_limit_weeks: "=dua_late_filing_limit_weeks"
      ucx_min_continuous_active_days: "=ucx_min_continuous_active_days"
    measures: [claim_msr_parent_mba, claim_msr_prior_program_mba]
    formula:
      eb_max_benefit_amount: "min(eb_regular_mba_fraction * claim_msr_parent_mba, max_duration_weeks * (weekly_benefit_amount + dependency_allowance))"
      tra_basic_max_benefit_amount: "max(0, max_duration_weeks * (weekly_benefit_amount + dependency_allowance) - claim_msr_prior_program_mba)"
      dua_max_benefit_amount: "max_duration_weeks * weekly_benefit_amount"

  - id: claim_evt_weekly_certification
    subject: [claim_week_certified]
    rule: >-
      Each week is certified separately by the claimant, online, by the phone line or with an agent, and one certification record exists per claim per week ending date; weeks end on Saturday.
      A week may be certified only on or after the day that is the certification opening offset after the week ending date of the certified week.
      Days are counted as calendar days from the Saturday week ending date, so the opening day is the following Sunday.
      A week may be certified only while the claim status is active or on_hold.
      A claim that is inactive must be reopened before further weeks are certified, and filed, ineligible, exhausted, closed or withdrawn claims accept no certifications.
      A week may be certified only once per claim.
      The certification is timely when the certified date is no later than the certification window after the week ending date, counted in calendar days.
      A later certification is recorded as late_good_cause when a late_certification request for that week has been approved and the certified date is within the good-cause limit, and otherwise as late_no_good_cause, which makes the week not payable.
      The claimant must answer whether they were able and available for full-time work, report gross earnings and hours in the week the work was performed, report vacation, holiday, severance or pension pay, report any refusal of work, and report at least the program's weekly number of work-search contacts.
      The work-search requirement is waived during the recall waiver weeks after the effective date when the claim records a definite recall date, and while approved_training is enrolled where the program waives the search in approved training.
      An answer that the claimant was not able and available, or that work was refused, places the claim on hold for a nonmonetary determination; a week with fewer contacts than required is not payable but does not by itself place the claim on hold.
      For Extended Benefits each contact must be a verifiable application to an employer with an opening, and a contact that is not is not counted.
    eligibility:
      - id: certification_opens_after_week_end
        applies_to: [claim_week_certified]
        kind: time
        condition: "A week may be certified only on or after the day that is the certification opening offset after the week ending date of the certified week."
        evidence_fields: [claim_certifications.claim_id, claim_certifications.week_ending_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [claim_certifications.claim_id, claim_certifications.week_ending_date]
          action_bindings: {claim_certifications.claim_id: claim_id, claim_certifications.week_ending_date: week_ending_date}
        temporal_basis:
          clock: frozen_time
          anchor_event: the week ending date of the certified week
          anchor_source: claim_certifications.week_ending_date
          relation: not_before
          duration_source: variants.cert_opening_day_offset
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the Saturday week ending date, so the opening day is the following Sunday."
          boundary: inclusive
      - id: claim_accepts_certifications
        applies_to: [claim_week_certified]
        kind: state
        condition: "A week may be certified only while the claim status is active or on_hold."
        evidence_fields: [claims.claim_id, claims.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.claim_id]
          action_bindings: {claims.claim_id: claim_id}
        state_contract:
          field: claims.status
          allowed: [active, on_hold]
      - id: one_certification_per_week
        applies_to: [claim_week_certified]
        kind: dedup
        condition: "A week may be certified only once per claim."
        evidence_fields: [claim_certifications.claim_id, claim_certifications.week_ending_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claim_certifications.claim_id, claim_certifications.week_ending_date]
          action_bindings: {claim_certifications.claim_id: claim_id, claim_certifications.week_ending_date: week_ending_date}
        dedup_contract:
          table: claim_certifications
          mode: separate_record
          object_bindings: {claim_id: claim_id, week_ending_date: week_ending_date}
          duplicate_filters: {event_type: [claim_week_certified]}
          distinct_fields: []
    params:
      per_tier:
        Regular State Unemployment Insurance: {work_search_contacts_per_week: "=work_search_contacts_per_week", certification_window_days: "=certification_window_days", recall_work_search_waiver_weeks: "=recall_work_search_waiver_weeks"}
        Unemployment Compensation for Federal Employees (UCFE): {work_search_contacts_per_week: "=work_search_contacts_per_week", certification_window_days: "=certification_window_days", recall_work_search_waiver_weeks: "=recall_work_search_waiver_weeks"}
        Unemployment Compensation for Ex-Servicemembers (UCX): {work_search_contacts_per_week: "=work_search_contacts_per_week", certification_window_days: "=certification_window_days", recall_work_search_waiver_weeks: "=recall_work_search_waiver_weeks"}
        Combined Wage Claim (CWC): {work_search_contacts_per_week: "=work_search_contacts_per_week", certification_window_days: "=certification_window_days", recall_work_search_waiver_weeks: "=recall_work_search_waiver_weeks"}
        Extended Benefits (EB): {work_search_contacts_per_week: "=work_search_contacts_per_week", certification_window_days: "=certification_window_days", recall_work_search_waiver_weeks: "=recall_work_search_waiver_weeks"}
        Trade Readjustment Allowances (TRA): {work_search_contacts_per_week: "=work_search_contacts_per_week", certification_window_days: "=certification_window_days", recall_work_search_waiver_weeks: "=recall_work_search_waiver_weeks"}
        Disaster Unemployment Assistance (DUA): {work_search_contacts_per_week: "=work_search_contacts_per_week", certification_window_days: "=certification_window_days", recall_work_search_waiver_weeks: "=recall_work_search_waiver_weeks"}
      cert_opening_day_offset: "=cert_opening_day_offset"
      late_cert_good_cause_max_days: "=late_cert_good_cause_max_days"
      eb_systematic_work_search_required: "=eb_systematic_work_search_required"
      approved_training_waives_work_search: "=approved_training_waives_work_search"
      earnings_report_basis: week_work_performed

  - id: claim_evt_payable_amount
    subject: [claim_benefit_paid]
    rule: >-
      A weekly payment is issued for a certified week only when the certification is timely or late_good_cause, the claimant answered able and available with no refused work, the required work-search contacts were reported or waived, the week is not a waiting week, and no hold is in force.
      A weekly payment may be issued only while the claim status is active.
      A payment may be issued only once per claim per week ending date and payment kind, so a week already paid is corrected only by a supplemental payment and a cancelled payment is replaced only by a reissue.
      A week in which hours worked reach the full-time hours threshold is not a week of unemployment and nothing is paid.
      Otherwise the earnings deduction is the part of gross earnings above the earnings disregard, which is the disregard share of the weekly benefit amount.
      The other-pay deduction is vacation and holiday pay allocated to the week where deductible, plus the weekly-prorated base-period-employer pension times the pension offset share, using the claimant-contributed share where the claimant paid into the plan; severance pay is not deducted.
      The payable amount is the weekly benefit amount plus dependency allowance minus both deductions, rounded down to the whole dollar, never below zero and never more than the remaining benefit balance; a payable amount of zero records no payment.
      When the payment brings the remaining benefit balance to zero the claim is exhausted.
      The payment is issued through the payment method in force on the payment date.
      Each payment carries the charge code of its program: state_chargeable when the employer charge share is one, eb_shared when the share is one half, and non_charged when the share is zero.
      Overpayment offsets and withholding deductions are taken from the payable amount after it is computed and do not change the amount charged to the balance.
    eligibility:
      - id: claim_payable_status
        applies_to: [claim_benefit_paid]
        kind: state
        condition: "A weekly payment may be issued only while the claim status is active."
        evidence_fields: [claims.claim_id, claims.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.claim_id]
          action_bindings: {claims.claim_id: claim_id}
        state_contract:
          field: claims.status
          allowed: [active]
      - id: one_payment_per_week_and_kind
        applies_to: [claim_benefit_paid]
        kind: dedup
        condition: "A payment may be issued only once per claim per week ending date and payment kind, so a week already paid is corrected only by a supplemental payment and a cancelled payment is replaced only by a reissue."
        evidence_fields: [claim_ledger.claim_id, claim_ledger.week_ending_date, claim_ledger.payment_kind]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claim_ledger.claim_id, claim_ledger.week_ending_date, claim_ledger.payment_kind]
          action_bindings: {claim_ledger.claim_id: claim_id, claim_ledger.week_ending_date: week_ending_date, claim_ledger.payment_kind: payment_kind}
        dedup_contract:
          table: claim_ledger
          mode: separate_record
          object_bindings: {claim_id: claim_id, week_ending_date: week_ending_date, payment_kind: payment_kind}
          duplicate_filters: {event_type: [claim_benefit_paid], payment_kind: [weekly, reissue]}
          distinct_fields: [entry_date]
    params:
      per_tier:
        Regular State Unemployment Insurance: {employer_charge_share: "=employer_charge_share", funding_source: "=funding_source"}
        Unemployment Compensation for Federal Employees (UCFE): {employer_charge_share: "=employer_charge_share", funding_source: "=funding_source"}
        Unemployment Compensation for Ex-Servicemembers (UCX): {employer_charge_share: "=employer_charge_share", funding_source: "=funding_source"}
        Combined Wage Claim (CWC): {employer_charge_share: "=employer_charge_share", funding_source: "=funding_source"}
        Extended Benefits (EB): {employer_charge_share: "=employer_charge_share", funding_source: "=funding_source"}
        Trade Readjustment Allowances (TRA): {employer_charge_share: "=employer_charge_share", funding_source: "=funding_source"}
        Disaster Unemployment Assistance (DUA): {employer_charge_share: "=employer_charge_share", funding_source: "=funding_source"}
      earnings_disregard_pct_of_wba: "=earnings_disregard_pct_of_wba"
      full_time_hours_threshold: "=full_time_hours_threshold"
      vacation_pay_deductible: "=vacation_pay_deductible"
      holiday_pay_deductible: "=holiday_pay_deductible"
      severance_pay_deductible: "=severance_pay_deductible"
      pension_offset_pct: "=pension_offset_pct"
      pension_offset_pct_claimant_contributed: "=pension_offset_pct_claimant_contributed"
      benefit_rounding_rule: "=benefit_rounding_rule"
    formula:
      when_not: "hours_worked >= full_time_hours_threshold"
      earnings_deduction: "max(0, gross_earnings - earnings_disregard_pct_of_wba * weekly_benefit_amount)"
      amount: "min(remaining_benefit_balance, max(0, weekly_benefit_amount + dependency_allowance - earnings_deduction - other_pay_deduction))"

  - id: claim_evt_waiting_week
    subject: [claim_waiting_week_served, claim_benefit_paid]
    rule: >-
      The first otherwise-payable weeks of a benefit year, up to the program's waiting week count, are served as unpaid waiting weeks.
      A waiting week is recorded only for a week that would otherwise have been paid in full or in part; a week not certified timely or with good cause, a week with excess earnings or full-time hours, or a week not payable for any other reason does not serve the waiting week.
      A waiting week is recorded only while claim_msr_waiting_weeks_served is below the program's waiting week count for the claim.
      No weekly payment is issued on a claim whose program requires a waiting week until the waiting week has been served, and a waiting week is never paid later.
      Programs with a waiting week count of zero pay from the first payable week; an Extended Benefits or Trade Readjustment Allowances claim never serves a waiting week because its parent claim already did.
    eligibility:
      - id: waiting_week_once
        applies_to: [claim_waiting_week_served]
        kind: dedup
        condition: "A waiting week is recorded only while claim_msr_waiting_weeks_served is below the program's waiting week count for the claim."
        evidence_fields: [claim_ledger.claim_id, claim_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claim_ledger.claim_id]
          action_bindings: {claim_ledger.claim_id: claim_id}
        dedup_contract:
          table: claim_ledger
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [claim_waiting_week_served]}
          distinct_fields: [week_ending_date]
    params:
      per_tier:
        Regular State Unemployment Insurance: {waiting_week_count: "=waiting_week_count"}
        Unemployment Compensation for Federal Employees (UCFE): {waiting_week_count: "=waiting_week_count"}
        Unemployment Compensation for Ex-Servicemembers (UCX): {waiting_week_count: "=waiting_week_count"}
        Combined Wage Claim (CWC): {waiting_week_count: "=waiting_week_count"}
        Extended Benefits (EB): {waiting_week_count: "=waiting_week_count"}
        Trade Readjustment Allowances (TRA): {waiting_week_count: "=waiting_week_count"}
        Disaster Unemployment Assistance (DUA): {waiting_week_count: "=waiting_week_count"}
    measures: [claim_msr_waiting_weeks_served]

  - id: claim_evt_payment_cancellation
    subject: [claim_payment_cancelled]
    rule: >-
      A payment is cancelled only by reference to the single original payment it reverses, recorded in original_payment_id, and the cancelled amount equals that payment's amount.
      A direct deposit returned by the receiving bank is cancelled with reason returned_by_bank and replaced by a reissue through the returned-deposit reissue method.
      A paper check reported lost or stolen may be stopped only on or after the lost-check waiting period after the check's issue date.
      The waiting period is counted in business days (Monday through Friday excluding state holidays) starting the business day after the check's issue date.
      A stopped check is cancelled with reason lost_or_stolen_check and replaced by a reissue through the payment method in force.
      A payment issued for a week later found not payable before the funds were released is cancelled with reason issued_in_error and is not reissued; once funds were released, the amount is pursued as an overpayment instead of a cancellation.
      A payment stopped because the claim is under fraud review is cancelled with reason fraud_stop and is not reissued unless the hold is released.
      A payment may be cancelled only once.
      Cancellation credits the cancelled amount back to the remaining benefit balance, a reissue debits it again, and a reissued payment is not charged to employers a second time.
    eligibility:
      - id: lost_check_waiting_period
        applies_to: [claim_payment_cancelled]
        kind: time
        condition: "A paper check reported lost or stolen may be stopped only on or after the lost-check waiting period after the check's issue date."
        evidence_fields: [claim_ledger.ledger_entry_id, claim_ledger.entry_date, claim_ledger.payment_method]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claim_ledger.ledger_entry_id]
          action_bindings: {claim_ledger.ledger_entry_id: original_payment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the check's issue date
          anchor_source: claim_ledger.entry_date
          relation: not_before
          duration_source: variants.lost_check_reissue_wait_business_days
          unit: business_days
          counting_rule: "The waiting period is counted in business days (Monday through Friday excluding state holidays) starting the business day after the check's issue date."
          boundary: inclusive
      - id: cancel_once
        applies_to: [claim_payment_cancelled]
        kind: dedup
        condition: "A payment may be cancelled only once."
        evidence_fields: [claim_ledger.original_payment_id, claim_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claim_ledger.original_payment_id]
          action_bindings: {claim_ledger.original_payment_id: original_payment_id}
        dedup_contract:
          table: claim_ledger
          mode: separate_record
          object_bindings: {original_payment_id: original_payment_id}
          duplicate_filters: {event_type: [claim_payment_cancelled]}
          distinct_fields: []
    params:
      lost_check_reissue_wait_business_days: "=lost_check_reissue_wait_business_days"
      returned_deposit_reissue_method: "=returned_deposit_reissue_method"
      reissued_payment_charge_neutral: "=reissued_payment_charge_neutral"

  - id: claim_hold_management
    subject: [claim_placed_on_hold, claim_hold_released]
    rule: >-
      A claim is placed on hold when an unresolved issue would make payment improper: hold_reason nonmonetary_issue for an able-and-available, refusal-of-work or separation question awaiting a determination, identity_verification while the claim's identity verification case is not verified, and fraud_review when the claim is referred for suspected impostor filing.
      While on hold no weekly payment is issued, but the claimant keeps certifying each week, and held weeks are paid after the hold is released if they are otherwise payable.
      An identity_verification hold is released only when the identity verification case linked to the claim has status verified.
      A nonmonetary_issue hold is released when the determination on the issue is recorded; a fraud_review hold is released only by the fraud unit, never on the claimant's own statement.
      Releasing a hold sets hold_reason to none.
      When several issues are open at once the claim stays on hold until the last of them is resolved, and hold_reason shows the issue still open.
    eligibility:
      - id: identity_hold_needs_verified_case
        applies_to: [claim_hold_released]
        kind: state
        condition: "An identity_verification hold is released only when the identity verification case linked to the claim has status verified."
        evidence_fields: [idv_cases.claim_id, idv_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.claim_id]
          action_bindings: {idv_cases.claim_id: claim_id}
        state_contract:
          field: idv_cases.status
          allowed: [verified]
    params:
      identity_verification_required: "=identity_verification_required"

  - id: claim_inactivity_and_reopen
    subject: [claim_inactivated, claim_reopened]
    rule: >-
      An active claim becomes inactive when claim_msr_consecutive_uncertified_weeks reaches the inactivity threshold.
      An inactive claim is reopened at the claimant's request so that further weeks can be certified.
      A claim may be reopened only on or before the benefit year end date of the claim.
      The reopen limit is counted in calendar days, and a request on the benefit year end date itself is in time.
      A claim is reopened only when its remaining balance is above zero; a claim with no remaining balance is not reopened.
      When the claimant worked since the last certified week, the reopening is an additional claim and the new separation is recorded; an additional claim whose new separation is voluntary_quit or discharge is placed on hold for a separation determination right after reopening where the program requires separation review.
      The reopened claim keeps its original effective date, benefit year and balance, and weeks in the break that were never certified stay unpaid unless certified late with good cause.
    eligibility:
      - id: reopen_within_benefit_year
        applies_to: [claim_reopened]
        kind: time
        condition: "A claim may be reopened only on or before the benefit year end date of the claim."
        evidence_fields: [claims.claim_id, claims.benefit_year_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.claim_id]
          action_bindings: {claims.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the benefit year end date of the claim
          anchor_source: claims.benefit_year_end_date
          relation: not_after
          duration_source: params.reopen_grace_days
          unit: calendar_days
          counting_rule: "The reopen limit is counted in calendar days, and a request on the benefit year end date itself is in time."
          boundary: inclusive
    params:
      reopen_grace_days: 0
      inactivity_weeks_to_inactivate: "=inactivity_weeks_to_inactivate"
      reopen_separation_review_required: "=reopen_separation_review_required"
    measures: [claim_msr_consecutive_uncertified_weeks]

  - id: claim_benefit_year_end
    subject: [claim_benefit_year_closed, claim_exhausted]
    rule: >-
      The benefit year begins on the claim effective date, which is the Sunday of the week the claim was filed or backdated to, and the benefit year end date is the Saturday that ends the program's benefit year length counted from that Sunday.
      A claim is exhausted when a payment brings its remaining balance to zero; an exhausted claim accepts no further weekly payments, and the claimant may then be considered for a later program under claim_agg_program_sequence.
      A claim is closed at its benefit year end date whatever its status, except a claim already withdrawn.
      Weeks ending after the benefit year end date are never paid on that claim, while weeks ending on or before it remain payable after closure when they were certified in time.
      A balance left on a closed claim is not carried into a new claim.
    eligibility: []
    params:
      per_tier:
        Regular State Unemployment Insurance: {benefit_year_length_weeks: "=benefit_year_length_weeks"}
        Unemployment Compensation for Federal Employees (UCFE): {benefit_year_length_weeks: "=benefit_year_length_weeks"}
        Unemployment Compensation for Ex-Servicemembers (UCX): {benefit_year_length_weeks: "=benefit_year_length_weeks"}
        Combined Wage Claim (CWC): {benefit_year_length_weeks: "=benefit_year_length_weeks"}
        Extended Benefits (EB): {benefit_year_length_weeks: "=benefit_year_length_weeks"}
        Trade Readjustment Allowances (TRA): {benefit_year_length_weeks: "=benefit_year_length_weeks"}
        Disaster Unemployment Assistance (DUA): {benefit_year_length_weeks: "=benefit_year_length_weeks"}

  - id: claim_withdrawal
    subject: [claim_withdrawn]
    rule: >-
      A claimant may withdraw a claim, usually to file a new claim with a later base period or in another state.
      A claim may be withdrawn only when claim_msr_net_benefits_paid is zero, meaning that no payment was issued or every payment was cancelled or repaid.
      Withdrawal is the claimant's own decision: the agent records a claim_withdrawal request in the claimant's name, and the claim is withdrawn only once the claimant confirms it.
      A claim may be withdrawn only before the benefit year end date of the claim.
      The withdrawal limit is counted in calendar days, and a request on the benefit year end date itself is too late.
      A withdrawn claim cannot be reinstated, its waiting week and monetary determination are void, and a claim filed afterwards is determined on its own base period.
    eligibility:
      - id: withdraw_before_benefit_year_end
        applies_to: [claim_withdrawn]
        kind: time
        condition: "A claim may be withdrawn only before the benefit year end date of the claim."
        evidence_fields: [claims.claim_id, claims.benefit_year_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.claim_id]
          action_bindings: {claims.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the benefit year end date of the claim
          anchor_source: claims.benefit_year_end_date
          relation: not_after
          duration_source: params.withdrawal_grace_days
          unit: calendar_days
          counting_rule: "The withdrawal limit is counted in calendar days, and a request on the benefit year end date itself is too late."
          boundary: exclusive
    params:
      withdrawal_grace_days: 0
    measures: [claim_msr_net_benefits_paid]

  - id: claim_backdating
    subject: [claim_effective_date_backdated]
    rule: >-
      A claimant who did not file in the first week of unemployment may ask to move the claim effective date earlier.
      Backdating is available only for programs whose maximum backdating weeks is above zero, for no more weeks than that maximum, and only with good cause recorded on the backdate request: illness_or_injury, agency_error, employer_misinformation, natural_disaster or death_in_family.
      A backdating request is accepted only when it is lodged no later than the backdating request window after the requested effective date.
      The window is counted in calendar days starting the day after the requested effective date, and a request on the last day is in time.
      The new effective date is always a Sunday, and the benefit year end date moves with it.
      Backdating does not change the monetary determination unless the earlier effective date changes the base period, in which case a monetary redetermination is issued.
      Weeks brought into the claim by backdating must still be certified and are payable only under the ordinary weekly rules.
    eligibility:
      - id: backdate_request_window
        applies_to: [claim_effective_date_backdated]
        kind: time
        condition: "A backdating request is accepted only when it is lodged no later than the backdating request window after the requested effective date."
        evidence_fields: [claim_requests.request_id, claim_requests.requested_effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claim_requests.request_id]
          action_bindings: {claim_requests.request_id: request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the requested effective date
          anchor_source: claim_requests.requested_effective_date
          relation: not_after
          duration_source: variants.backdate_request_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the requested effective date, and a request on the last day is in time."
          boundary: inclusive
    params:
      per_tier:
        Regular State Unemployment Insurance: {backdate_max_weeks: "=backdate_max_weeks", backdate_request_window_days: "=backdate_request_window_days"}
        Unemployment Compensation for Federal Employees (UCFE): {backdate_max_weeks: "=backdate_max_weeks", backdate_request_window_days: "=backdate_request_window_days"}
        Unemployment Compensation for Ex-Servicemembers (UCX): {backdate_max_weeks: "=backdate_max_weeks", backdate_request_window_days: "=backdate_request_window_days"}
        Combined Wage Claim (CWC): {backdate_max_weeks: "=backdate_max_weeks", backdate_request_window_days: "=backdate_request_window_days"}
        Extended Benefits (EB): {backdate_max_weeks: "=backdate_max_weeks", backdate_request_window_days: "=backdate_request_window_days"}
        Trade Readjustment Allowances (TRA): {backdate_max_weeks: "=backdate_max_weeks", backdate_request_window_days: "=backdate_request_window_days"}
        Disaster Unemployment Assistance (DUA): {backdate_max_weeks: "=backdate_max_weeks", backdate_request_window_days: "=backdate_request_window_days"}

  - id: claim_payment_method
    subject: [claim_payment_method_changed]
    rule: >-
      The claimant chooses how benefits are paid: direct deposit to a checking or savings account in the claimant's name, the state benefit debit card, which is assigned by default when no direct deposit election is made, or a paper check where neither is possible.
      A change takes effect for payments issued on or after the payment method effective date, which is the change lead time after the change is recorded, counted in business days (Monday through Friday excluding state holidays).
      A payment method change is accepted only while the claim hold reason is not fraud_review.
      Only the claimant may ask for the change, and a request from anyone else is not accepted.
      One replacement debit card per benefit year carries no fee; later replacements carry the card program's fee and do not change the payment method.
    eligibility:
      - id: no_change_under_fraud_review
        applies_to: [claim_payment_method_changed]
        kind: state
        condition: "A payment method change is accepted only while the claim hold reason is not fraud_review."
        evidence_fields: [claims.claim_id, claims.hold_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.claim_id]
          action_bindings: {claims.claim_id: claim_id}
        state_contract:
          field: claims.hold_reason
          allowed: [none, nonmonetary_issue, identity_verification]
    params:
      payment_method_change_lead_business_days: "=payment_method_change_lead_business_days"
      default_payment_method: "=default_payment_method"
      debit_card_free_replacements_per_benefit_year: "=debit_card_free_replacements_per_benefit_year"

  - id: claim_tax_statement
    subject: [claim_1099g_issued, claim_1099g_corrected]
    rule: >-
      A Form 1099-G is issued for each claim on which benefits were paid in a calendar tax year, by the issue deadline of the following year.
      Box 1 is claim_msr_benefits_paid_in_tax_year: payments issued in the tax year by payment date, gross of overpayment offsets and income tax withholding, less payments cancelled in the same year and less overpayments repaid in the same tax year; a repayment made in a later year does not change the earlier statement.
      Box 4 is the federal income tax withheld and Box 11 the state income tax withheld from those payments.
      A corrected statement is issued when the original is wrong: identity_theft when the claim was filed by an impostor, in which case the corrected statement reports zero in every box; payment_reversal when payments were cancelled after issue; overpayment_repaid_same_year; or withholding_misreported.
      An identity_theft correction is issued only when the identity verification case linked to the claim has status fraud_confirmed.
      A correction may be requested only for a tax year within the correction lookback years before the current year.
      Each correction is a new statement record and the original is never edited.
    eligibility:
      - id: identity_theft_confirmed
        applies_to: [claim_1099g_corrected]
        kind: state
        condition: "An identity_theft correction is issued only when the identity verification case linked to the claim has status fraud_confirmed."
        evidence_fields: [idv_cases.claim_id, idv_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.claim_id]
          action_bindings: {idv_cases.claim_id: claim_id}
        state_contract:
          field: idv_cases.status
          allowed: [fraud_confirmed]
    params:
      tax_statement_issue_deadline: "=tax_statement_issue_deadline"
      tax_statement_correction_lookback_years: "=tax_statement_correction_lookback_years"
    measures: [claim_msr_benefits_paid_in_tax_year]
