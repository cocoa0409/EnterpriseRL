# Policy charter: Claimant Identity Verification.
# One holding = one identity verification case opened for one claim, worked through one proofing pathway at a time.
category: idv
display_name: Claimant Identity Verification

binding:
  holding_table: idv_cases
  event_tables: [idv_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [opened, in_progress, verified, failed, expired, fraud_confirmed, closed]
  transitions:
    - {from: opened, to: in_progress, by: agent, means: The first proofing attempt, appointment or document starts work on the case.}
    - {from: failed, to: in_progress, by: agent, means: A failed case is moved to another pathway and work resumes.}
    - {from: expired, to: in_progress, by: agent, means: An expired case is reopened with good cause within the late completion window.}
    - {from: in_progress, to: verified, by: agent, means: The pathway's requirements are met and identity is verified.}
    - {from: in_progress, to: failed, by: agent, means: Attempts, missed appointments or document resubmissions reached the pathway limit without verification.}
    - {from: opened, to: expired, by: system, means: The verification deadline passed before any work started.}
    - {from: in_progress, to: expired, by: system, means: The verification deadline passed before verification.}
    - {from: opened, to: fraud_confirmed, by: agent, means: The fraud unit confirms the claim was filed by an impostor.}
    - {from: in_progress, to: fraud_confirmed, by: agent, means: The fraud unit confirms the claim was filed by an impostor.}
    - {from: verified, to: closed, by: system, means: The linked claim closed or was withdrawn after verification.}
    - {from: failed, to: closed, by: system, means: The linked claim closed or was withdrawn while the case stood failed.}
    - {from: expired, to: closed, by: system, means: The late completion window passed or the linked claim closed.}
    - {from: fraud_confirmed, to: closed, by: system, means: The fraud case on the impostor claim is concluded.}

accounts: []

parameter_schema:
  verification_deadline_days: "Calendar days after the identity verification notice date by which verification must be completed (days)"
  max_attempts: "Proofing attempts allowed on the pathway before the case is failed (count)"
  attempt_lockout_hours: "Elapsed hours after a failed attempt before the next attempt may start (hours); 0 means no lockout"
  primary_documents_required: "Primary photo identity documents required (count)"
  secondary_documents_required: "Secondary identity documents required in addition to the primary document (count)"
  proof_of_address_required: "Whether a proof-of-address document is required (boolean)"
  proof_of_address_max_age_days: "Maximum age of a proof-of-address document, counted in calendar days from its issue date to its receipt (days)"
  expired_primary_document_grace_months: "Calendar months after expiration during which an expired primary document is still accepted (months); 0 means it must be unexpired"
  selfie_biometric_match_required: "Whether a live selfie must match the photo document (boolean)"
  live_video_required: "Whether a live video session with a trusted referee is required (boolean)"
  in_person_visit_required: "Whether the claimant must appear in person (boolean)"
  appointment_required: "Whether the session must be booked as an appointment (boolean)"
  walk_in_allowed: "Whether the claimant may complete the visit without an appointment (boolean)"
  appointment_min_lead_business_days: "Business days between the scheduling date and the earliest bookable appointment (business days); 0 means no appointment"
  appointment_max_reschedules: "Times an appointment may be rescheduled on one case (count)"
  appointment_cancel_notice_hours: "Elapsed hours before the appointment by which a cancellation does not count as a missed appointment (hours)"
  missed_appointment_limit: "Missed appointments on one case after which the case is failed (count); 0 means no appointments on the pathway"
  visit_duration_minutes: "Scheduled length of the session (minutes); 0 means no scheduled session"
  interpreter_available: "Whether a free interpreter is provided for the session on request (boolean)"
  start_token_valid_hours: "Elapsed hours an emailed proofing link or in-person barcode stays valid after it is issued (hours); 0 means none is issued"
  mail_processing_business_days: "Business days the agency takes to review mailed documents after receipt (business days); 0 means documents are not mailed"
  mail_timeliness_basis: "Date that decides whether submitted documents met the deadline (enum: received or postmark)"
  document_form_accepted: "Form in which identity documents are accepted (enum)"
  accepted_primary_documents: "Primary photo documents accepted on the pathway (list of document types)"
  accepted_secondary_documents: "Secondary documents accepted on the pathway (list of document types); empty when none is required"
  accepted_address_documents: "Proof-of-address documents accepted (list of document types)"
  address_must_match_profile: "Whether the proof-of-address must show the mailing address of record (boolean)"
  name_mismatch_supporting_document_required: "Whether a legal name-change document is required when a document name differs from the profile name (boolean)"
  rejected_document_resubmission_limit: "Times a rejected document of the same role may be resubmitted on one case (count)"
  identity_assurance_level: "Assurance level the pathway establishes (enum)"
  ssa_ssn_verification_required: "Whether the Social Security number must be matched against Social Security Administration records (boolean)"
  ssa_mismatch_resolution_days: "Calendar days after an SSA mismatch notice to submit the Social Security card or an SSA letter (days)"
  police_or_ftc_report_required: "Whether a police report or an FTC IdentityTheft.gov report is required (boolean)"
  identity_theft_affidavit_required: "Whether the agency identity theft affidavit is required (boolean)"
  identity_theft_report_max_age_days: "Maximum age of the police or FTC report at receipt (days); 0 means no report is required"
  deadline_extension_days: "Calendar days added to the verification deadline by one approved extension (days)"
  max_deadline_extensions: "Extensions allowed on one case (count)"
  late_completion_good_cause_days: "Calendar days after the verification deadline within which an expired case may be reopened with good cause (days)"
  pathway_change_allowed_after_failure: "Whether the claimant may move a failed case to another pathway (boolean)"
  pathway_switch_resets_deadline: "Whether a pathway change restarts the verification deadline (boolean)"
  payment_held_until_verified: "Whether benefit payments on the linked claim are held until the case is verified (boolean)"
  retroactive_payment_of_held_weeks: "Whether weeks certified while the case was pending are paid once it is verified, if otherwise payable (boolean)"
  certify_while_pending_required: "Whether the claimant must keep certifying weekly while the case is pending (boolean)"
  verification_valid_for_months: "Calendar months after the verified date during which a completed verification is reused for a later claim of the same claimant (months)"
  reverification_after_profile_change_days: "Calendar days after a change of bank account or mailing address within which a later claim needs a new verification despite a reusable one (days)"
  max_open_cases_per_claim: "Identity verification cases that may be open on one claim at a time (count)"
  call_center_assisted_attempt_allowed: "Whether a contact-center agent may record a proofing attempt for the claimant over the phone (boolean)"
  notice_channel: "Channel through which the identity verification notice is sent (enum)"
  fraud_referral_on_document_mismatch: "Whether a document that fails authenticity checks is referred to the fraud unit (boolean)"

