events:
  - type: idv_case_opened
    target: idv_cases
    mutation: create
    meaning: An identity verification case is opened for a claim and the verification notice is sent.
    grain: One row per verification case opened for one claim.
    fields:
      customer_id: Claimant whose identity is verified.
      claim_id: Claim the case belongs to.
      variant_name: Pathway the case starts on.
      opened_date: Date the case was opened.
      notice_date: Date the verification notice was sent.
      verification_deadline: Date by which verification must be completed.
    triggers: []
  - type: idv_case_started
    target: idv_cases
    mutation:
      transition:
        - {from: opened, to: in_progress}
        - {from: failed, to: in_progress}
    meaning: Work on the case starts, or resumes on a new pathway after a failure.
    grain: One transition per start or resumption.
    fields:
      status: Set to in_progress.
    triggers: []
  - type: idv_attempt_recorded
    target: idv_events
    meaning: One proofing attempt (online session, video session or in-person visit) is completed with a result.
    grain: One row per proofing attempt on a case.
    distinguish_by: [attempt_number]
    fields:
      attempt_number: Sequence of the attempt on the case.
      attempt_at: Moment the attempt finished.
      attempt_result: Result of the attempt.
    triggers:
      - event: idv:idv_verified
        when: {attempt_result: passed}
        map: {status: verified}
  - type: idv_document_received
    target: idv_events
    meaning: One identity, address or identity theft document is received and reviewed on the case.
    grain: One row per document received on a case.
    distinguish_by: [document_type, received_date]
    fields:
      document_type: Kind of document.
      document_role: Role the document fills on the case.
      document_status: Review result of the document.
      received_date: Date the document reached the agency.
      postmark_date: Postmark date for mailed documents; empty otherwise.
    triggers: []
  - type: idv_appointment_scheduled
    target: idv_events
    meaning: A video or in-person appointment is booked or rebooked.
    grain: One row per appointment booked on a case.
    distinguish_by: [appointment_date]
    fields:
      appointment_date: Date of the appointment.
      appointment_location: Location code or video for the appointment.
      scheduled_date: Date the booking was made.
    triggers: []
  - type: idv_appointment_missed
    target: idv_events
    meaning: The claimant missed a booked appointment without timely cancellation.
    grain: One row per missed appointment.
    distinguish_by: [appointment_date]
    fields:
      appointment_date: Date of the missed appointment.
      appointment_location: Location of the missed appointment.
    triggers: []
  - type: idv_deadline_extended
    target: idv_cases
    mutation: update
    meaning: The verification deadline is extended once on request.
    grain: One holding update per extension.
    fields:
      verification_deadline: New deadline.
      extension_count: Extensions granted so far on the case.
    triggers: []
  - type: idv_pathway_changed
    target: idv_cases
    mutation: update
    meaning: The case is moved to a different proofing pathway.
    grain: One holding update per pathway change.
    fields:
      variant_name: New pathway.
    triggers: []
  - type: idv_verified
    target: idv_cases
    mutation: {transition: {from: in_progress, to: verified}}
    meaning: Identity is verified on the case.
    grain: One transition per case.
    fields:
      status: Set to verified.
      verified_date: Date verification was completed.
    triggers:
      - event: claim:claim_hold_released
        map: {hold_reason: none}
  - type: idv_failed
    target: idv_cases
    mutation: {transition: {from: in_progress, to: failed}}
    meaning: The pathway's attempt, appointment or resubmission limit was reached without verification.
    grain: One transition per failure.
    fields:
      status: Set to failed.
    triggers: []
  - type: idv_expired
    target: idv_cases
    mutation:
      transition:
        - {from: opened, to: expired}
        - {from: in_progress, to: expired}
    meaning: The verification deadline passed without verification.
    grain: One transition per expiry.
    fields:
      status: Set to expired.
    triggers: []
  - type: idv_reopened_late
    target: idv_cases
    mutation: {transition: {from: expired, to: in_progress}}
    meaning: An expired case is reopened with good cause.
    grain: One transition per reopening.
    fields:
      status: Set to in_progress.
      verification_deadline: New deadline set at reopening.
    triggers: []
  - type: idv_fraud_confirmed
    target: idv_cases
    mutation:
      transition:
        - {from: opened, to: fraud_confirmed}
        - {from: in_progress, to: fraud_confirmed}
    meaning: The fraud unit confirms that the linked claim was filed by an impostor using the customer's identity.
    grain: One transition per case.
    fields:
      status: Set to fraud_confirmed.
    triggers:
      - event: claim:claim_placed_on_hold
        map: {hold_reason: fraud_review}
  - type: idv_case_closed
    target: idv_cases
    mutation:
      transition:
        - {from: verified, to: closed}
        - {from: failed, to: closed}
        - {from: expired, to: closed}
        - {from: fraud_confirmed, to: closed}
    meaning: The case is closed.
    grain: One transition per case.
    fields:
      status: Set to closed.
      closed_date: Date the case was closed.
    triggers: []

measures:
  - id: idv_msr_failed_attempts
    window: The life of the case.
    measure: Count of idv_attempt_recorded rows on the case with attempt_result failed.
  - id: idv_msr_missed_appointments
    window: The life of the case.
    measure: Count of idv_appointment_missed rows on the case.
  - id: idv_msr_reschedules
    window: The life of the case.
    measure: Count of idv_appointment_scheduled rows on the case minus one (the first booking is not a reschedule), never below zero.
  - id: idv_msr_rejected_resubmissions
    window: The life of the case, per document_role.
    measure: Count of idv_document_received rows on the case for the document role after the first rejected one of that role.
  - id: idv_msr_latest_verified_date
    window: All of the claimant's cases at frozen time.
    measure: The latest verified_date among the claimant's cases that reached verified (whether or not since closed).

policies:
  - id: idv_agg_multi_holding
    subject: [idv_case_opened]
    rule: >-
      A claimant may hold several verification cases over time, one for each claim that needs its own verification, so the number of cases per claimant is not capped.
      A new identity verification case is opened for a claim only when no case for the same claim has status opened, in_progress, verified or fraud_confirmed.
      A failed or expired case on the claim is worked by changing pathway or reopening it, not by opening a second case, except that a case closed after expiry may be followed by a new case when the claim is still open.
      Programs that do not require their own verification never open a case.
    eligibility:
      - id: one_open_case_per_claim
        applies_to: [idv_case_opened]
        kind: dedup
        condition: "A new identity verification case is opened for a claim only when no case for the same claim has status opened, in_progress, verified or fraud_confirmed."
        evidence_fields: [idv_cases.claim_id, idv_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.claim_id]
          action_bindings: {idv_cases.claim_id: claim_id}
        dedup_contract:
          table: idv_cases
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {status: [opened, in_progress, verified, fraud_confirmed]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_open_cases_per_claim: "=max_open_cases_per_claim"

  - id: idv_agg_verification_reuse
    subject: [idv_case_opened]
    rule: >-
      A completed verification covers the claimant across claims for a limited time.
      A later claim of the same claimant does not open a new case when idv_msr_latest_verified_date falls within the reuse period of the pathway that produced it, counted in calendar months from the verified date to the later claim's filed date, with month-end dates falling back to the last day of a shorter month.
      The reuse does not apply, and a new case is opened, when the bank account or the mailing address on the claimant's profile changed within the re-verification window before the later claim was filed, or when any of the claimant's cases is fraud_confirmed.
      Reuse is decided per claim at filing and never reopens or extends the earlier case.
    eligibility: []
    params:
      per_tier:
        Online Identity Proofing (IAL2): {verification_valid_for_months: "=verification_valid_for_months"}
        Video Trusted Referee Session: {verification_valid_for_months: "=verification_valid_for_months"}
        In-Person Proofing — American Job Center: {verification_valid_for_months: "=verification_valid_for_months"}
        In-Person Proofing — USPS Retail Location: {verification_valid_for_months: "=verification_valid_for_months"}
        Documentary Verification by Mail: {verification_valid_for_months: "=verification_valid_for_months"}
        Identity Theft Victim Re-Verification: {verification_valid_for_months: "=verification_valid_for_months"}
      reverification_after_profile_change_days: "=reverification_after_profile_change_days"
    measures: [idv_msr_latest_verified_date]

  - id: idv_evt_deadline
    subject: [idv_case_opened, idv_deadline_extended, idv_expired, idv_reopened_late]
    rule: >-
      The verification notice is sent through the notice channel on the day the case is opened, and the verification deadline is the notice date plus the pathway's deadline days, counted in calendar days.
      A deadline extension may be granted only when it is requested on or before the verification deadline.
      The extension limit is counted in calendar days, and a request made on the deadline date itself is in time.
      Each extension adds the pathway's extension days to the current deadline, and no more extensions are granted than the pathway's maximum.
      A case not verified by the end of its deadline date expires; on mail pathways whose timeliness basis is the postmark, documents postmarked on or before the deadline are reviewed even when they arrive later, and the case is not expired while that review runs.
      An expired case may be reopened with good cause only on or before the late completion window after the verification deadline.
      The late window is counted in calendar days starting the day after the verification deadline, and a request on the last day is in time.
      A reopened case receives a new deadline of the pathway's extension days from the reopening date; a case not reopened in time stays expired and the linked claim stays on hold.
      Changing pathway never restarts the deadline.
    eligibility:
      - id: extension_before_deadline
        applies_to: [idv_deadline_extended]
        kind: time
        condition: "A deadline extension may be granted only when it is requested on or before the verification deadline."
        evidence_fields: [idv_cases.idv_case_id, idv_cases.verification_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.idv_case_id]
          action_bindings: {idv_cases.idv_case_id: idv_case_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the verification deadline
          anchor_source: idv_cases.verification_deadline
          relation: not_after
          duration_source: params.extension_request_grace_days
          unit: calendar_days
          counting_rule: "The extension limit is counted in calendar days, and a request made on the deadline date itself is in time."
          boundary: inclusive
      - id: late_reopen_window
        applies_to: [idv_reopened_late]
        kind: time
        condition: "An expired case may be reopened with good cause only on or before the late completion window after the verification deadline."
        evidence_fields: [idv_cases.idv_case_id, idv_cases.verification_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.idv_case_id]
          action_bindings: {idv_cases.idv_case_id: idv_case_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the verification deadline
          anchor_source: idv_cases.verification_deadline
          relation: not_after
          duration_source: variants.late_completion_good_cause_days
          unit: calendar_days
          counting_rule: "The late window is counted in calendar days starting the day after the verification deadline, and a request on the last day is in time."
          boundary: inclusive
    params:
      extension_request_grace_days: 0
      per_tier:
        Online Identity Proofing (IAL2): {verification_deadline_days: "=verification_deadline_days", deadline_extension_days: "=deadline_extension_days", max_deadline_extensions: "=max_deadline_extensions", late_completion_good_cause_days: "=late_completion_good_cause_days", mail_timeliness_basis: "=mail_timeliness_basis"}
        Video Trusted Referee Session: {verification_deadline_days: "=verification_deadline_days", deadline_extension_days: "=deadline_extension_days", max_deadline_extensions: "=max_deadline_extensions", late_completion_good_cause_days: "=late_completion_good_cause_days", mail_timeliness_basis: "=mail_timeliness_basis"}
        In-Person Proofing — American Job Center: {verification_deadline_days: "=verification_deadline_days", deadline_extension_days: "=deadline_extension_days", max_deadline_extensions: "=max_deadline_extensions", late_completion_good_cause_days: "=late_completion_good_cause_days", mail_timeliness_basis: "=mail_timeliness_basis"}
        In-Person Proofing — USPS Retail Location: {verification_deadline_days: "=verification_deadline_days", deadline_extension_days: "=deadline_extension_days", max_deadline_extensions: "=max_deadline_extensions", late_completion_good_cause_days: "=late_completion_good_cause_days", mail_timeliness_basis: "=mail_timeliness_basis"}
        Documentary Verification by Mail: {verification_deadline_days: "=verification_deadline_days", deadline_extension_days: "=deadline_extension_days", max_deadline_extensions: "=max_deadline_extensions", late_completion_good_cause_days: "=late_completion_good_cause_days", mail_timeliness_basis: "=mail_timeliness_basis"}
        Identity Theft Victim Re-Verification: {verification_deadline_days: "=verification_deadline_days", deadline_extension_days: "=deadline_extension_days", max_deadline_extensions: "=max_deadline_extensions", late_completion_good_cause_days: "=late_completion_good_cause_days", mail_timeliness_basis: "=mail_timeliness_basis"}
      notice_channel: "=notice_channel"
      mail_processing_business_days: "=mail_processing_business_days"
    formula:
      verification_deadline_days_from_notice: "verification_deadline_days"
      extensions_remaining: "max(0, max_deadline_extensions - extension_count)"

  - id: idv_evt_attempts
    subject: [idv_attempt_recorded, idv_verified, idv_failed, idv_case_started]
    rule: >-
      Each proofing session the claimant completes is recorded as one attempt with its result; the first attempt, appointment or document on an opened case starts the case.
      A proofing attempt may be recorded only while the case status is opened or in_progress.
      Online sessions require a live selfie matched to the photo document, video sessions require a live trusted referee, and in-person sessions are performed by agency or USPS staff; contact-center agents do not perform or record attempts over the phone.
      On pathways with a lockout, a new attempt may start only after the lockout hours following the previous failed attempt, counted as elapsed hours from that attempt's finish time.
      An emailed proofing link or USPS barcode is valid for the start-token hours after issue, and an expired token is replaced without counting as an attempt.
      A passed attempt that also satisfies the document requirements of idv_evt_documents verifies the case at the pathway's assurance level.
      When idv_msr_failed_attempts reaches the pathway's maximum attempts the case is failed; a failed case may move to another pathway under idv_pathway_change.
    eligibility:
      - id: attempt_on_open_case
        applies_to: [idv_attempt_recorded]
        kind: state
        condition: "A proofing attempt may be recorded only while the case status is opened or in_progress."
        evidence_fields: [idv_cases.idv_case_id, idv_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.idv_case_id]
          action_bindings: {idv_cases.idv_case_id: idv_case_id}
        state_contract:
          field: idv_cases.status
          allowed: [opened, in_progress]
    params:
      per_tier:
        Online Identity Proofing (IAL2): {max_attempts: "=max_attempts", attempt_lockout_hours: "=attempt_lockout_hours"}
        Video Trusted Referee Session: {max_attempts: "=max_attempts", attempt_lockout_hours: "=attempt_lockout_hours"}
        In-Person Proofing — American Job Center: {max_attempts: "=max_attempts", attempt_lockout_hours: "=attempt_lockout_hours"}
        In-Person Proofing — USPS Retail Location: {max_attempts: "=max_attempts", attempt_lockout_hours: "=attempt_lockout_hours"}
        Documentary Verification by Mail: {max_attempts: "=max_attempts", attempt_lockout_hours: "=attempt_lockout_hours"}
        Identity Theft Victim Re-Verification: {max_attempts: "=max_attempts", attempt_lockout_hours: "=attempt_lockout_hours"}
      selfie_biometric_match_required: "=selfie_biometric_match_required"
      live_video_required: "=live_video_required"
      start_token_valid_hours: "=start_token_valid_hours"
      identity_assurance_level: "=identity_assurance_level"
      call_center_assisted_attempt_allowed: "=call_center_assisted_attempt_allowed"
    measures: [idv_msr_failed_attempts]

  - id: idv_evt_documents
    subject: [idv_document_received, idv_verified, idv_failed]
    rule: >-
      Each document received is recorded with its type, role and review result.
      A document is recorded only while the case status is opened, in_progress or expired; on an expired case only a mailed document whose postmark date is on or before the verification deadline is reviewed.
      Verification needs the pathway's number of accepted primary documents from its accepted primary list and of accepted secondary documents from its accepted secondary list, plus an accepted proof-of-address document from the accepted address list where the pathway requires one.
      A primary document must be unexpired, except that the pathway's expired-document grace months, counted in calendar months from the expiration date, allow a recently expired one.
      A proof-of-address document is accepted only when it shows the mailing address of record and was issued no more than the maximum age in calendar days before it was received.
      When a document shows a name different from the profile, a legal name-change document is also required.
      Documents are accepted only in the pathway's accepted form, and the Social Security number is matched against Social Security Administration records; after an SSA mismatch notice the claimant has the mismatch resolution days to submit the Social Security card or an SSA letter.
      A rejected document of a role may be resubmitted no more than the pathway's resubmission limit (idv_msr_rejected_resubmissions); reaching the limit without an accepted document of that role fails the case.
      A document failing authenticity checks is rejected and referred to the fraud unit.
    eligibility:
      - id: document_on_workable_case
        applies_to: [idv_document_received]
        kind: state
        condition: "A document is recorded only while the case status is opened, in_progress or expired; on an expired case only a mailed document whose postmark date is on or before the verification deadline is reviewed."
        evidence_fields: [idv_cases.idv_case_id, idv_cases.status, idv_cases.verification_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.idv_case_id]
          action_bindings: {idv_cases.idv_case_id: idv_case_id}
        state_contract:
          field: idv_cases.status
          allowed: [opened, in_progress, expired]
    params:
      primary_documents_required: "=primary_documents_required"
      per_tier:
        Online Identity Proofing (IAL2): {secondary_documents_required: "=secondary_documents_required", proof_of_address_required: "=proof_of_address_required", expired_primary_document_grace_months: "=expired_primary_document_grace_months", rejected_document_resubmission_limit: "=rejected_document_resubmission_limit"}
        Video Trusted Referee Session: {secondary_documents_required: "=secondary_documents_required", proof_of_address_required: "=proof_of_address_required", expired_primary_document_grace_months: "=expired_primary_document_grace_months", rejected_document_resubmission_limit: "=rejected_document_resubmission_limit"}
        In-Person Proofing — American Job Center: {secondary_documents_required: "=secondary_documents_required", proof_of_address_required: "=proof_of_address_required", expired_primary_document_grace_months: "=expired_primary_document_grace_months", rejected_document_resubmission_limit: "=rejected_document_resubmission_limit"}
        In-Person Proofing — USPS Retail Location: {secondary_documents_required: "=secondary_documents_required", proof_of_address_required: "=proof_of_address_required", expired_primary_document_grace_months: "=expired_primary_document_grace_months", rejected_document_resubmission_limit: "=rejected_document_resubmission_limit"}
        Documentary Verification by Mail: {secondary_documents_required: "=secondary_documents_required", proof_of_address_required: "=proof_of_address_required", expired_primary_document_grace_months: "=expired_primary_document_grace_months", rejected_document_resubmission_limit: "=rejected_document_resubmission_limit"}
        Identity Theft Victim Re-Verification: {secondary_documents_required: "=secondary_documents_required", proof_of_address_required: "=proof_of_address_required", expired_primary_document_grace_months: "=expired_primary_document_grace_months", rejected_document_resubmission_limit: "=rejected_document_resubmission_limit"}
      proof_of_address_max_age_days: "=proof_of_address_max_age_days"
      accepted_primary_documents: "=accepted_primary_documents"
      accepted_secondary_documents: "=accepted_secondary_documents"
      accepted_address_documents: "=accepted_address_documents"
      address_must_match_profile: "=address_must_match_profile"
      name_mismatch_supporting_document_required: "=name_mismatch_supporting_document_required"
      document_form_accepted: "=document_form_accepted"
      ssa_ssn_verification_required: "=ssa_ssn_verification_required"
      ssa_mismatch_resolution_days: "=ssa_mismatch_resolution_days"
      fraud_referral_on_document_mismatch: "=fraud_referral_on_document_mismatch"
    measures: [idv_msr_rejected_resubmissions]

  - id: idv_evt_appointments
    subject: [idv_appointment_scheduled, idv_appointment_missed, idv_failed]
    rule: >-
      Video and appointment-based in-person pathways are booked as appointments; a walk-in pathway may also be completed without one.
      An appointment may be booked only while the case status is opened or in_progress.
      The earliest bookable date is the pathway's minimum lead business days after the scheduling date, counted in business days (Monday through Friday excluding state holidays), and an appointment is never booked after the verification deadline.
      A booking may be changed no more than the pathway's reschedule limit (idv_msr_reschedules).
      An appointment cancelled at least the cancellation notice hours before its start is not missed; otherwise a no-show is recorded as a missed appointment, and when idv_msr_missed_appointments reaches the pathway's missed-appointment limit the case is failed.
      A free interpreter is provided where the pathway offers one, and the session is booked for the pathway's visit length.
    eligibility:
      - id: appointment_on_open_case
        applies_to: [idv_appointment_scheduled]
        kind: state
        condition: "An appointment may be booked only while the case status is opened or in_progress."
        evidence_fields: [idv_cases.idv_case_id, idv_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.idv_case_id]
          action_bindings: {idv_cases.idv_case_id: idv_case_id}
        state_contract:
          field: idv_cases.status
          allowed: [opened, in_progress]
    params:
      per_tier:
        Online Identity Proofing (IAL2): {appointment_required: "=appointment_required", appointment_min_lead_business_days: "=appointment_min_lead_business_days", appointment_max_reschedules: "=appointment_max_reschedules", missed_appointment_limit: "=missed_appointment_limit"}
        Video Trusted Referee Session: {appointment_required: "=appointment_required", appointment_min_lead_business_days: "=appointment_min_lead_business_days", appointment_max_reschedules: "=appointment_max_reschedules", missed_appointment_limit: "=missed_appointment_limit"}
        In-Person Proofing — American Job Center: {appointment_required: "=appointment_required", appointment_min_lead_business_days: "=appointment_min_lead_business_days", appointment_max_reschedules: "=appointment_max_reschedules", missed_appointment_limit: "=missed_appointment_limit"}
        In-Person Proofing — USPS Retail Location: {appointment_required: "=appointment_required", appointment_min_lead_business_days: "=appointment_min_lead_business_days", appointment_max_reschedules: "=appointment_max_reschedules", missed_appointment_limit: "=missed_appointment_limit"}
        Documentary Verification by Mail: {appointment_required: "=appointment_required", appointment_min_lead_business_days: "=appointment_min_lead_business_days", appointment_max_reschedules: "=appointment_max_reschedules", missed_appointment_limit: "=missed_appointment_limit"}
        Identity Theft Victim Re-Verification: {appointment_required: "=appointment_required", appointment_min_lead_business_days: "=appointment_min_lead_business_days", appointment_max_reschedules: "=appointment_max_reschedules", missed_appointment_limit: "=missed_appointment_limit"}
      walk_in_allowed: "=walk_in_allowed"
      in_person_visit_required: "=in_person_visit_required"
      appointment_cancel_notice_hours: "=appointment_cancel_notice_hours"
      visit_duration_minutes: "=visit_duration_minutes"
      interpreter_available: "=interpreter_available"
    measures: [idv_msr_missed_appointments, idv_msr_reschedules]

  - id: idv_payment_effect
    subject: [idv_verified, idv_expired]
    rule: >-
      While a case is pending, benefit payments on the linked claim are held with hold_reason identity_verification, and the claimant must keep certifying each week.
      When the case is verified the identity hold on the linked claim is released, and every week certified while the case was pending is paid if it is otherwise payable.
      A week that was not certified while the case was pending is not paid on verification and can be paid only through a late certification with good cause.
      When the case expires the hold remains, and no week is paid unless the case is reopened and verified.
    eligibility: []
    params:
      payment_held_until_verified: "=payment_held_until_verified"
      retroactive_payment_of_held_weeks: "=retroactive_payment_of_held_weeks"
      certify_while_pending_required: "=certify_while_pending_required"

  - id: idv_pathway_change
    subject: [idv_pathway_changed, idv_case_started]
    rule: >-
      A claimant may move the case to another pathway, for example from online proofing to an American Job Center visit after failed selfie matches.
      A pathway change is accepted only while the case status is opened or failed.
      A failed case may change pathway only where the failed pathway allows a change after failure; the Identity Theft Victim Re-Verification pathway never changes once failed, and such a case is handed to the fraud unit.
      After a change on a failed case the case resumes in_progress on the new pathway; attempts, appointments and documents on the old pathway do not count toward the new pathway's limits, while documents already accepted remain accepted where the new pathway accepts that document type and form.
      A change never restarts the verification deadline.
    eligibility:
      - id: change_when_opened_or_failed
        applies_to: [idv_pathway_changed]
        kind: state
        condition: "A pathway change is accepted only while the case status is opened or failed."
        evidence_fields: [idv_cases.idv_case_id, idv_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_cases.idv_case_id]
          action_bindings: {idv_cases.idv_case_id: idv_case_id}
        state_contract:
          field: idv_cases.status
          allowed: [opened, failed]
    params:
      per_tier:
        Online Identity Proofing (IAL2): {pathway_change_allowed_after_failure: "=pathway_change_allowed_after_failure"}
        Video Trusted Referee Session: {pathway_change_allowed_after_failure: "=pathway_change_allowed_after_failure"}
        In-Person Proofing — American Job Center: {pathway_change_allowed_after_failure: "=pathway_change_allowed_after_failure"}
        In-Person Proofing — USPS Retail Location: {pathway_change_allowed_after_failure: "=pathway_change_allowed_after_failure"}
        Documentary Verification by Mail: {pathway_change_allowed_after_failure: "=pathway_change_allowed_after_failure"}
        Identity Theft Victim Re-Verification: {pathway_change_allowed_after_failure: "=pathway_change_allowed_after_failure"}
      pathway_switch_resets_deadline: "=pathway_switch_resets_deadline"

  - id: idv_identity_theft
    subject: [idv_fraud_confirmed]
    rule: >-
      A customer who reports that a claim on their profile was filed by someone else is referred to the fraud unit, and the claim is held for fraud_review.
      A case is marked fraud_confirmed only when an identity theft report document has been received and accepted on the case.
      On the Identity Theft Victim Re-Verification pathway the report must be a police report or an FTC IdentityTheft.gov report no older than the report age limit at receipt, together with the agency identity theft affidavit.
      Once fraud is confirmed, benefits paid on the impostor claim are not an overpayment owed by the victim, and the victim's Form 1099-G for those payments is corrected under claim_tax_statement.
      A genuine later claim by the victim is verified on the Identity Theft Victim Re-Verification pathway.
    eligibility:
      - id: theft_report_on_file
        applies_to: [idv_fraud_confirmed]
        kind: authorization
        condition: "A case is marked fraud_confirmed only when an identity theft report document has been received and accepted on the case."
        evidence_fields: [idv_events.idv_case_id, idv_events.document_role, idv_events.document_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [idv_events.idv_case_id]
          action_bindings: {idv_events.idv_case_id: idv_case_id}
    params:
      police_or_ftc_report_required: "=police_or_ftc_report_required"
      identity_theft_affidavit_required: "=identity_theft_affidavit_required"
      identity_theft_report_max_age_days: "=identity_theft_report_max_age_days"

  - id: idv_case_closure
    subject: [idv_case_closed]
    rule: >-
      A case closes when the linked claim is closed or withdrawn, whatever the case status other than opened or in_progress; an expired case also closes when its late completion window passes.
      A closed case is never reopened; a verified case that closed still counts for verification reuse under idv_agg_verification_reuse.
    eligibility: []
    params:
      late_completion_good_cause_days: "=late_completion_good_cause_days"
