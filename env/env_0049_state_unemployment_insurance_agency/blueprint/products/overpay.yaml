events:
  - type: overpay_established
    target: overpayments
    mutation: create
    meaning: An overpayment determination is issued against a claim for benefits paid for weeks later found not payable.
    grain: One row per overpayment determination (one claim, one overpaid week range, one cause).
    fields:
      customer_id: Claimant who owes the overpayment.
      claim_id: Claim on which the overpaid weeks were paid.
      variant_name: Classification of the overpayment.
      determination_date: Date the overpayment determination was issued and mailed.
      overpaid_week_start: First week ending date overpaid.
      overpaid_week_end: Last week ending date overpaid.
      cause: Issue that made the weeks not payable.
      principal_amount: Total benefits overpaid for the weeks.
      disqualification_weeks: Fraud penalty weeks imposed.
    triggers:
      - event: overpay:overpay_principal_assessed
        map: {amount: principal_amount, component: principal}
      - event: overpay:overpay_penalty_assessed
        when: {variant_name: [Fraud Overpayment — First Offense, Fraud Overpayment — Repeat Offense]}
        map: {component: penalty}
  - type: overpay_principal_assessed
    target: overpay_ledger
    meaning: The overpaid principal is booked to the overpayment balance.
    grain: One row per overpayment principal booking.
    distinguish_by: [component, entry_date]
    fields:
      component: Set to principal.
      amount: Principal booked, positive.
      entry_date: Date booked.
    account: overpayment_balance
    direction: in
    triggers: []
  - type: overpay_penalty_assessed
    target: overpay_ledger
    meaning: The fraud penalty is assessed on the overpaid principal.
    grain: One row per penalty assessment.
    distinguish_by: [component, entry_date]
    fields:
      component: Set to penalty.
      amount: Penalty assessed, positive.
      entry_date: Date assessed.
    account: overpayment_balance
    direction: in
    triggers: []
  - type: overpay_interest_accrued
    target: overpay_ledger
    meaning: One month of simple interest accrues on the unpaid principal.
    grain: One row per overpayment per accrual month.
    distinguish_by: [accrual_month]
    fields:
      component: Set to interest.
      accrual_month: Calendar month the interest is for.
      amount: Interest accrued, positive.
      entry_date: Date booked (first day of the following month).
    account: overpayment_balance
    direction: in
    triggers: []
  - type: overpay_fee_assessed
    target: overpay_ledger
    meaning: A returned-payment fee is assessed after a repayment is returned unpaid.
    grain: One row per returned repayment.
    distinguish_by: [payment_reference]
    fields:
      component: Set to fee.
      fee_type: Kind of fee.
      payment_reference: Confirmation number of the returned repayment.
      amount: Fee assessed, positive.
      entry_date: Date assessed.
    account: overpayment_balance
    direction: in
    triggers: []
  - type: overpay_repayment_received
    target: overpay_ledger
    meaning: A voluntary or installment repayment from the claimant is applied to the balance.
    grain: One row per repayment per component it is applied to.
    distinguish_by: [payment_reference, component]
    fields:
      component: Component the amount is applied to.
      payment_reference: Confirmation number of the repayment, exactly as issued by the payment channel.
      payment_channel: Channel used.
      amount: Amount applied, positive.
      entry_date: Date received.
    account: overpayment_balance
    direction: out
    triggers:
      - event: charge:charge_credit_reversed
        when: {component: principal}
        map: {credit_reason: overpayment_recovered}
  - type: overpay_repayment_returned
    target: overpay_ledger
    meaning: A repayment is returned unpaid by the bank and its application is reversed.
    grain: One row per returned repayment per component.
    distinguish_by: [payment_reference, component]
    fields:
      component: Component whose application is reversed.
      payment_reference: Confirmation number of the returned repayment.
      amount: Amount reversed, positive.
      entry_date: Date the return was booked.
    account: overpayment_balance
    direction: in
    triggers:
      - event: overpay:overpay_fee_assessed
        map: {payment_reference: payment_reference, fee_type: returned_payment}
  - type: overpay_offset_recovered
    target: overpay_ledger
    meaning: Part of a benefit payment is withheld and applied to the balance.
    grain: One row per benefit payment offset per component.
    distinguish_by: [source_payment_id, component]
    fields:
      component: Component the offset is applied to.
      source_payment_id: Benefit payment from which the offset was taken.
      source_payment_amount: Gross payable amount of that benefit payment.
      week_ending_date: Week of that benefit payment.
      amount: Amount applied, positive.
      entry_date: Date applied.
    account: overpayment_balance
    direction: out
    triggers:
      - event: charge:charge_credit_reversed
        when: {component: principal}
        map: {credit_reason: overpayment_recovered}
  - type: overpay_intercept_recovered
    target: overpay_ledger
    meaning: A federal or state tax refund intercepted for the debt is applied to the balance.
    grain: One row per intercept per component.
    distinguish_by: [intercept_reference, component]
    fields:
      component: Component the intercept is applied to.
      intercept_source: Treasury Offset Program or state tax refund intercept.
      intercept_reference: Reference number of the intercept, exactly as reported by the offsetting agency.
      amount: Amount applied, positive.
      entry_date: Date applied.
    account: overpayment_balance
    direction: out
    triggers:
      - event: charge:charge_credit_reversed
        when: {component: principal}
        map: {credit_reason: overpayment_recovered}
  - type: overpay_waiver_adjusted
    target: overpay_ledger
    meaning: The principal waived by a full or partial waiver is removed from the balance.
    grain: One row per waiver decision.
    distinguish_by: [waiver_request_id]
    fields:
      component: Set to principal.
      waiver_request_id: Waiver request decided.
      amount: Principal waived, positive.
      entry_date: Date of the waiver decision.
    account: overpayment_balance
    direction: out
    triggers: []
  - type: overpay_cancellation_adjusted
    target: overpay_ledger
    meaning: Everything assessed on an overpayment reversed on appeal is removed from the balance.
    grain: One row per component of a cancelled overpayment.
    distinguish_by: [appeal_id, component]
    fields:
      component: Component removed.
      appeal_id: Appeal whose decision reversed the determination.
      amount: Total assessed on the component, positive.
      entry_date: Date of the cancellation.
    account: overpayment_balance
    direction: out
    triggers: []
  - type: overpay_writeoff_adjusted
    target: overpay_ledger
    meaning: The remaining balance is written off.
    grain: One row per component written off.
    distinguish_by: [component]
    fields:
      component: Component written off.
      amount: Amount written off, positive.
      entry_date: Date of the write-off.
    account: overpayment_balance
    direction: out
    triggers: []
  - type: overpay_refund_issued
    target: overpay_ledger
    meaning: Money recovered beyond what is owed is refunded to the claimant.
    grain: One row per refund.
    distinguish_by: [refund_basis, payment_reference, entry_date]
    fields:
      component: Component the refunded recovery had been applied to.
      refund_basis: Why the refund is owed.
      payment_reference: Confirmation number of the repayment refunded, or the intercept reference; empty for a refund of offsets.
      amount: Amount refunded, positive.
      entry_date: Date the refund was issued.
    account: overpayment_balance
    direction: in
    triggers: []
  - type: overpay_recovery_started
    target: overpayments
    mutation: {transition: {from: established, to: in_recovery}}
    meaning: Recovery begins once no appeal or waiver stands in its way.
    grain: One transition per overpayment.
    fields:
      status: Set to in_recovery.
    triggers: []
  - type: overpay_waiver_review_opened
    target: overpayments
    mutation:
      transition:
        - {from: established, to: waiver_pending}
        - {from: in_recovery, to: waiver_pending}
    meaning: A waiver request lodged by the claimant is taken under review.
    grain: One transition per waiver request reviewed.
    fields:
      status: Set to waiver_pending.
    triggers: []
  - type: overpay_waiver_granted
    target: overpayments
    mutation: {transition: {from: waiver_pending, to: waived}}
    meaning: The whole unpaid principal is waived.
    grain: One transition per overpayment.
    fields:
      status: Set to waived.
      closed_date: Date of the waiver decision.
    triggers:
      - event: overpay:overpay_waiver_adjusted
        map: {component: principal}
  - type: overpay_waiver_partially_granted
    target: overpayments
    mutation: {transition: {from: waiver_pending, to: in_recovery}}
    meaning: Part of the unpaid principal is waived and the rest is recovered.
    grain: One transition per waiver decision.
    fields:
      status: Set to in_recovery.
    triggers:
      - event: overpay:overpay_waiver_adjusted
        map: {component: principal}
  - type: overpay_waiver_denied
    target: overpayments
    mutation: {transition: {from: waiver_pending, to: in_recovery}}
    meaning: The waiver is denied and recovery resumes.
    grain: One transition per waiver decision.
    fields:
      status: Set to in_recovery.
    triggers: []
  - type: overpay_recovery_suspended
    target: overpayments
    mutation:
      transition:
        - {from: established, to: suspended}
        - {from: in_recovery, to: suspended}
        - {from: waiver_pending, to: suspended}
    meaning: Recovery is suspended while an appeal of the determination is pending.
    grain: One transition per appeal.
    fields:
      status: Set to suspended.
    triggers: []
  - type: overpay_recovery_resumed
    target: overpayments
    mutation: {transition: {from: suspended, to: in_recovery}}
    meaning: The appeal ended without reversal and recovery resumes.
    grain: One transition per appeal outcome.
    fields:
      status: Set to in_recovery.
    triggers: []
  - type: overpay_cancelled
    target: overpayments
    mutation: {transition: {from: suspended, to: cancelled}}
    meaning: The determination was reversed on appeal and the overpayment is cancelled.
    grain: One transition per overpayment.
    fields:
      status: Set to cancelled.
      closed_date: Date of the cancellation.
    triggers:
      - event: overpay:overpay_cancellation_adjusted
        map: {component: principal}
  - type: overpay_paid_in_full
    target: overpayments
    mutation:
      transition:
        - {from: established, to: paid_in_full}
        - {from: in_recovery, to: paid_in_full}
    meaning: The balance reached zero.
    grain: One transition per overpayment.
    fields:
      status: Set to paid_in_full.
      closed_date: Date the balance reached zero.
    triggers: []
  - type: overpay_written_off
    target: overpayments
    mutation: {transition: {from: in_recovery, to: written_off}}
    meaning: Recovery ends and the remaining balance is written off.
    grain: One transition per overpayment.
    fields:
      status: Set to written_off.
      closed_date: Date of the write-off.
    triggers:
      - event: overpay:overpay_writeoff_adjusted
        map: {component: principal}
  - type: overpay_repayment_plan_set
    target: overpayments
    mutation: update
    meaning: A monthly repayment plan is set up, changed or marked defaulted.
    grain: One holding update per plan change.
    fields:
      repayment_plan_status: Plan status after the change.
      repayment_plan_monthly_amount: Monthly installment agreed.
      repayment_plan_start_date: Due date of the first installment.
    triggers: []
  - type: overpay_top_notice_sent
    target: overpayments
    mutation: update
    meaning: The notice of intent to refer the debt to the Treasury Offset Program and state refund intercept is mailed.
    grain: One holding update per notice.
    fields:
      top_referral_status: Set to notice_sent.
      top_notice_date: Date the notice of intent was mailed.
    triggers: []
  - type: overpay_top_referred
    target: overpayments
    mutation: update
    meaning: The debt is referred for federal and state tax refund offset, or withdrawn from referral.
    grain: One holding update per referral change.
    fields:
      top_referral_status: Set to referred or withdrawn.
    triggers: []

measures:
  - id: overpay_msr_unpaid_principal
    window: The life of the overpayment to frozen time.
    measure: Principal component of the balance - overpay_principal_assessed amount minus principal applied by repayments, offsets, intercepts, waiver, cancellation and write-off adjustments, plus principal reversed by returned repayments and refunds.
  - id: overpay_msr_open_overpayments
    window: All of the claimant's overpayments at frozen time.
    measure: The claimant's overpayments whose status is in_recovery, ordered by recovery_priority_rank and then by determination_date oldest first.
  - id: overpay_msr_household_income_pct_of_guideline
    window: The waiver request under decision.
    measure: annual_household_income on the waiver request divided by the poverty guideline for its household_size (the one-person base plus the per-additional-person amount times household_size minus one), times 100, rounded to two decimals.
  - id: overpay_msr_missed_plan_payments
    window: Installment due dates of the current repayment plan to frozen time.
    measure: Number of consecutive most recent due dates whose grace period ended with no repayment of at least the monthly installment received from the due date through the end of the grace period.
  - id: overpay_msr_prior_fraud_determinations
    window: The repeat-offense lookback years before the new determination date.
    measure: Count of the claimant's other overpayments classified as a fraud overpayment, not cancelled, with determination_date in the window.
  - id: overpay_msr_days_since_last_recovery
    window: To frozen time.
    measure: Calendar days since the latest repayment, offset or intercept on the overpayment, or since its determination_date when there has been none.

policies:
  - id: overpay_agg_multi_holding
    subject: [overpay_established]
    rule: >-
      A claimant may owe several overpayments at once, on the same claim or on different claims, so the number of overpayments per claimant is not capped.
      An overpayment is established only once for the same claim, cause and first overpaid week.
      A second issue affecting the same weeks is established as its own overpayment only for amounts not already established, and an overpayment that was cancelled does not block a new determination on a different cause.
      How recoveries are shared among several open overpayments is decided by overpay_agg_recovery_priority.
    eligibility:
      - id: one_overpayment_per_issue
        applies_to: [overpay_established]
        kind: dedup
        condition: "An overpayment is established only once for the same claim, cause and first overpaid week."
        evidence_fields: [overpayments.claim_id, overpayments.cause, overpayments.overpaid_week_start, overpayments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpayments.claim_id, overpayments.cause, overpayments.overpaid_week_start]
          action_bindings: {overpayments.claim_id: claim_id, overpayments.cause: cause, overpayments.overpaid_week_start: overpaid_week_start}
        dedup_contract:
          table: overpayments
          mode: separate_record
          object_bindings: {claim_id: claim_id, cause: cause, overpaid_week_start: overpaid_week_start}
          duplicate_filters: {status: [established, in_recovery, waiver_pending, suspended, paid_in_full, waived, written_off]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: overpay_agg_recovery_priority
    subject: [overpay_offset_recovered, overpay_repayment_received, overpay_intercept_recovered]
    rule: >-
      When a claimant has several overpayments in recovery, recoveries are shared by a fixed order.
      A repayment the claimant designates for a named overpayment is applied to that overpayment; any amount beyond its balance, and every undesignated repayment, is applied in the order of overpay_msr_open_overpayments, filling each overpayment before the next.
      A benefit offset is taken once per benefit payment for all overpayments together: the amount withheld is the highest offset share among the overpayments in recovery times the payment's payable amount, never more than their combined balance, and it is applied in the order of overpay_msr_open_overpayments.
      A tax refund intercept is applied only to overpayments whose classification allows the intercept, in the same order.
      Overpayments that are waiver_pending, suspended or not yet in recovery receive no offset or intercept.
    eligibility: []
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {recovery_priority_rank: "=recovery_priority_rank", benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment"}
        Non-Fraud Overpayment — Employer Reporting Error: {recovery_priority_rank: "=recovery_priority_rank", benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment"}
        Non-Fraud Overpayment — Appeal Reversal: {recovery_priority_rank: "=recovery_priority_rank", benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment"}
        Non-Fraud Overpayment — Claimant Error: {recovery_priority_rank: "=recovery_priority_rank", benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment"}
        Fraud Overpayment — First Offense: {recovery_priority_rank: "=recovery_priority_rank", benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment"}
        Fraud Overpayment — Repeat Offense: {recovery_priority_rank: "=recovery_priority_rank", benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment"}
    measures: [overpay_msr_open_overpayments]

  - id: overpay_evt_establishment
    subject: [overpay_established, overpay_principal_assessed, overpay_recovery_started]
    rule: >-
      An overpayment is established by a written determination naming the claim, the overpaid weeks, the cause and the classification, and the principal is the total of benefits paid for those weeks that were not payable, gross of any offset or withholding taken from them.
      The classification follows the finding on fault: agency error, employer reporting error and reversal on appeal of benefits paid when due are without fault on the claimant's part; a claimant's inaccurate report without intent is claimant error; a knowing false statement or concealment is fraud, and fraud is a repeat offense when overpay_msr_prior_fraud_determinations is at least one.
      Benefits paid on a claim later confirmed as filed by an impostor are never established against the identity theft victim.
      The determination is mailed on its determination date with the appeal rights of the overpayment and fraud appeal docket and, where the classification allows waiver, the waiver request form.
      Recovery begins only after the appeal deadline of the determination has passed with no appeal on record and, for waiver-eligible classifications, after the waiver window has passed with no waiver request under review.
    eligibility: []
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {waiver_form_included_with_notice: "=waiver_form_included_with_notice", repeat_offense_lookback_years: "=repeat_offense_lookback_years"}
        Non-Fraud Overpayment — Employer Reporting Error: {waiver_form_included_with_notice: "=waiver_form_included_with_notice", repeat_offense_lookback_years: "=repeat_offense_lookback_years"}
        Non-Fraud Overpayment — Appeal Reversal: {waiver_form_included_with_notice: "=waiver_form_included_with_notice", repeat_offense_lookback_years: "=repeat_offense_lookback_years"}
        Non-Fraud Overpayment — Claimant Error: {waiver_form_included_with_notice: "=waiver_form_included_with_notice", repeat_offense_lookback_years: "=repeat_offense_lookback_years"}
        Fraud Overpayment — First Offense: {waiver_form_included_with_notice: "=waiver_form_included_with_notice", repeat_offense_lookback_years: "=repeat_offense_lookback_years"}
        Fraud Overpayment — Repeat Offense: {waiver_form_included_with_notice: "=waiver_form_included_with_notice", repeat_offense_lookback_years: "=repeat_offense_lookback_years"}
    measures: [overpay_msr_prior_fraud_determinations]

  - id: overpay_evt_penalty_interest
    subject: [overpay_penalty_assessed, overpay_interest_accrued, overpay_fee_assessed]
    rule: >-
      A fraud overpayment carries a penalty of the classification's penalty share of the principal, assessed once at establishment, rounded to the cent and credited to the unemployment trust fund when collected; the penalty is never waived.
      Interest accrues only on fraud overpayments, as simple interest at the monthly rate on overpay_msr_unpaid_principal at the end of each calendar month, never on penalty, interest or fees.
      The first interest month is the calendar month that begins after the interest start days following the determination date.
      Interest is booked once per overpayment per accrual month.
      For a first-offense fraud overpayment no interest accrues for a month in which the repayment plan was current for the whole month; a repeat-offense fraud overpayment accrues interest whether or not a plan is current.
      No interest accrues for a month in which the overpayment was suspended for appeal.
      A repayment returned unpaid by the bank reverses its application and is followed by the returned-payment fee, which is booked as its own fee component.
    eligibility:
      - id: interest_once_per_month
        applies_to: [overpay_interest_accrued]
        kind: dedup
        condition: "Interest is booked once per overpayment per accrual month."
        evidence_fields: [overpay_ledger.overpayment_id, overpay_ledger.accrual_month, overpay_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpay_ledger.overpayment_id, overpay_ledger.accrual_month]
          action_bindings: {overpay_ledger.overpayment_id: overpayment_id, overpay_ledger.accrual_month: accrual_month}
        dedup_contract:
          table: overpay_ledger
          mode: separate_record
          object_bindings: {overpayment_id: overpayment_id, accrual_month: accrual_month}
          duplicate_filters: {event_type: [overpay_interest_accrued]}
          distinct_fields: []
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {penalty_pct: "=penalty_pct", interest_rate_monthly: "=interest_rate_monthly", interest_start_days_after_determination: "=interest_start_days_after_determination", interest_suspended_while_plan_current: "=interest_suspended_while_plan_current"}
        Non-Fraud Overpayment — Employer Reporting Error: {penalty_pct: "=penalty_pct", interest_rate_monthly: "=interest_rate_monthly", interest_start_days_after_determination: "=interest_start_days_after_determination", interest_suspended_while_plan_current: "=interest_suspended_while_plan_current"}
        Non-Fraud Overpayment — Appeal Reversal: {penalty_pct: "=penalty_pct", interest_rate_monthly: "=interest_rate_monthly", interest_start_days_after_determination: "=interest_start_days_after_determination", interest_suspended_while_plan_current: "=interest_suspended_while_plan_current"}
        Non-Fraud Overpayment — Claimant Error: {penalty_pct: "=penalty_pct", interest_rate_monthly: "=interest_rate_monthly", interest_start_days_after_determination: "=interest_start_days_after_determination", interest_suspended_while_plan_current: "=interest_suspended_while_plan_current"}
        Fraud Overpayment — First Offense: {penalty_pct: "=penalty_pct", interest_rate_monthly: "=interest_rate_monthly", interest_start_days_after_determination: "=interest_start_days_after_determination", interest_suspended_while_plan_current: "=interest_suspended_while_plan_current"}
        Fraud Overpayment — Repeat Offense: {penalty_pct: "=penalty_pct", interest_rate_monthly: "=interest_rate_monthly", interest_start_days_after_determination: "=interest_start_days_after_determination", interest_suspended_while_plan_current: "=interest_suspended_while_plan_current"}
      penalty_deposited_to: "=penalty_deposited_to"
      penalty_waivable: "=penalty_waivable"
      interest_basis: "=interest_basis"
      returned_payment_fee: "=returned_payment_fee"
    formula:
      penalty_amount: "round(penalty_pct * principal_amount, 2)"
      monthly_interest: "round(interest_rate_monthly * overpay_msr_unpaid_principal, 2)"
    measures: [overpay_msr_unpaid_principal]

  - id: overpay_evt_recovery
    subject: [overpay_offset_recovered, overpay_repayment_received, overpay_intercept_recovered, overpay_repayment_returned, overpay_refund_issued, overpay_paid_in_full]
    rule: >-
      Recovery by offset or intercept is taken only while the overpayment status is in_recovery.
      An offset withholds the classification's offset share of each weekly payable amount, including payments under other programs and, through the interstate reciprocal arrangement, another state's payments; offsets continue while a repayment plan is current.
      A voluntary repayment through an accepted channel is accepted in any status other than paid_in_full, waived, cancelled and written_off, including while recovery is suspended for appeal or waiver review; the card vendor's convenience fee is paid on top and never reduces the balance.
      Each recovery is split across components in the classification's application order: non-fraud overpayments carry principal only, and fraud recoveries go to principal first, then penalty, then interest, then fees.
      A recovery that exceeds the balance is refunded to the claimant when the excess reaches the minimum refund amount, within the refund processing days, with refund_basis excess_repayment; a smaller excess stays as a credit on the overpayment.
      When the balance reaches zero the overpayment is paid in full.
      Principal recovered on a chargeable claim is credited back to the charged employers.
    eligibility:
      - id: involuntary_recovery_in_recovery_only
        applies_to: [overpay_offset_recovered, overpay_intercept_recovered]
        kind: state
        condition: "Recovery by offset or intercept is taken only while the overpayment status is in_recovery."
        evidence_fields: [overpayments.overpayment_id, overpayments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpayments.overpayment_id]
          action_bindings: {overpayments.overpayment_id: overpayment_id}
        state_contract:
          field: overpayments.status
          allowed: [in_recovery]
      - id: voluntary_repayment_on_open_debt
        applies_to: [overpay_repayment_received]
        kind: state
        condition: "A voluntary repayment through an accepted channel is accepted in any status other than paid_in_full, waived, cancelled and written_off, including while recovery is suspended for appeal or waiver review; the card vendor's convenience fee is paid on top and never reduces the balance."
        evidence_fields: [overpayments.overpayment_id, overpayments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpayments.overpayment_id]
          action_bindings: {overpayments.overpayment_id: overpayment_id}
        state_contract:
          field: overpayments.status
          allowed: [established, in_recovery, waiver_pending, suspended]
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment", payment_application_order: "=payment_application_order"}
        Non-Fraud Overpayment — Employer Reporting Error: {benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment", payment_application_order: "=payment_application_order"}
        Non-Fraud Overpayment — Appeal Reversal: {benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment", payment_application_order: "=payment_application_order"}
        Non-Fraud Overpayment — Claimant Error: {benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment", payment_application_order: "=payment_application_order"}
        Fraud Overpayment — First Offense: {benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment", payment_application_order: "=payment_application_order"}
        Fraud Overpayment — Repeat Offense: {benefit_offset_pct_of_payment: "=benefit_offset_pct_of_payment", payment_application_order: "=payment_application_order"}
      cross_program_offset_allowed: "=cross_program_offset_allowed"
      interstate_offset_allowed: "=interstate_offset_allowed"
      offset_continues_with_plan: "=offset_continues_with_plan"
      payment_channels_accepted: "=payment_channels_accepted"
      card_convenience_fee_pct: "=card_convenience_fee_pct"
      excess_refund_min_amount: "=excess_refund_min_amount"
      refund_processing_business_days: "=refund_processing_business_days"
      voluntary_repayment_accepted_while_suspended: "=voluntary_repayment_accepted_while_suspended"
      employer_charge_credit_on_recovery: "=employer_charge_credit_on_recovery"
      statement_cycle: "=statement_cycle"
    formula:
      offset_amount: "min(overpayment_balance, round(benefit_offset_pct_of_payment * source_payment_amount, 2))"

  - id: overpay_waiver
    subject: [overpay_waiver_review_opened, overpay_waiver_granted, overpay_waiver_partially_granted, overpay_waiver_denied, overpay_waiver_adjusted]
    rule: >-
      A waiver forgives the unpaid principal of an overpayment that arose without fault on the claimant's part when recovering it would defeat the purpose of benefits.
      Only an overpayment whose classification is waiver-eligible may be waived; claimant-error and fraud overpayments are never waived.
      The waiver request is the claimant's own application, giving household size and annual household income, and the agent opens the review only from a request the claimant has lodged.
      A waiver request is accepted only when it is received no later than the waiver request window after the overpayment determination date.
      The window is counted in calendar days starting the day after the overpayment determination date, and a request received on the last day is timely.
      While the review is open, offsets, intercepts and billing stop, but voluntary repayments are still accepted.
      The decision follows overpay_msr_household_income_pct_of_guideline: at or below the full-waiver percent the whole unpaid principal is waived; above it and at or below the partial-waiver percent the partial share of the unpaid principal is waived, rounded to the cent, and the rest stays in recovery; above the partial-waiver percent the waiver is denied.
      A waiver covers only the principal unpaid on the decision date; amounts already recovered are not refunded.
      When an appeal of the same determination is pending, the appeal is decided first and the waiver review waits.
    eligibility:
      - id: waiver_request_window
        applies_to: [overpay_waiver_review_opened]
        kind: time
        condition: "A waiver request is accepted only when it is received no later than the waiver request window after the overpayment determination date."
        evidence_fields: [overpayments.overpayment_id, overpayments.determination_date, overpay_waiver_requests.request_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpayments.overpayment_id]
          action_bindings: {overpayments.overpayment_id: overpayment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the overpayment determination date
          anchor_source: overpayments.determination_date
          relation: not_after
          duration_source: variants.waiver_request_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the overpayment determination date, and a request received on the last day is timely."
          boundary: inclusive
      - id: waiver_eligible_classification
        applies_to: [overpay_waiver_review_opened, overpay_waiver_adjusted]
        kind: authorization
        condition: "Only an overpayment whose classification is waiver-eligible may be waived; claimant-error and fraud overpayments are never waived."
        evidence_fields: [overpayments.overpayment_id, overpayments.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpayments.overpayment_id]
          action_bindings: {overpayments.overpayment_id: overpayment_id}
      - id: claimant_lodged_request
        applies_to: [overpay_waiver_review_opened]
        kind: authorization
        condition: "The waiver request is the claimant's own application, giving household size and annual household income, and the agent opens the review only from a request the claimant has lodged."
        evidence_fields: [overpay_waiver_requests.waiver_request_id, overpay_waiver_requests.overpayment_id, overpay_waiver_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpay_waiver_requests.waiver_request_id, overpay_waiver_requests.overpayment_id]
          action_bindings: {overpay_waiver_requests.waiver_request_id: waiver_request_id, overpay_waiver_requests.overpayment_id: overpayment_id}
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {waiver_eligible: "=waiver_eligible", waiver_request_window_days: "=waiver_request_window_days", waiver_full_income_pct_of_guideline: "=waiver_full_income_pct_of_guideline", waiver_partial_income_pct_of_guideline: "=waiver_partial_income_pct_of_guideline", waiver_partial_share: "=waiver_partial_share", recovery_suspended_while_waiver_pending: "=recovery_suspended_while_waiver_pending"}
        Non-Fraud Overpayment — Employer Reporting Error: {waiver_eligible: "=waiver_eligible", waiver_request_window_days: "=waiver_request_window_days", waiver_full_income_pct_of_guideline: "=waiver_full_income_pct_of_guideline", waiver_partial_income_pct_of_guideline: "=waiver_partial_income_pct_of_guideline", waiver_partial_share: "=waiver_partial_share", recovery_suspended_while_waiver_pending: "=recovery_suspended_while_waiver_pending"}
        Non-Fraud Overpayment — Appeal Reversal: {waiver_eligible: "=waiver_eligible", waiver_request_window_days: "=waiver_request_window_days", waiver_full_income_pct_of_guideline: "=waiver_full_income_pct_of_guideline", waiver_partial_income_pct_of_guideline: "=waiver_partial_income_pct_of_guideline", waiver_partial_share: "=waiver_partial_share", recovery_suspended_while_waiver_pending: "=recovery_suspended_while_waiver_pending"}
        Non-Fraud Overpayment — Claimant Error: {waiver_eligible: "=waiver_eligible", waiver_request_window_days: "=waiver_request_window_days", waiver_full_income_pct_of_guideline: "=waiver_full_income_pct_of_guideline", waiver_partial_income_pct_of_guideline: "=waiver_partial_income_pct_of_guideline", waiver_partial_share: "=waiver_partial_share", recovery_suspended_while_waiver_pending: "=recovery_suspended_while_waiver_pending"}
        Fraud Overpayment — First Offense: {waiver_eligible: "=waiver_eligible", waiver_request_window_days: "=waiver_request_window_days", waiver_full_income_pct_of_guideline: "=waiver_full_income_pct_of_guideline", waiver_partial_income_pct_of_guideline: "=waiver_partial_income_pct_of_guideline", waiver_partial_share: "=waiver_partial_share", recovery_suspended_while_waiver_pending: "=recovery_suspended_while_waiver_pending"}
        Fraud Overpayment — Repeat Offense: {waiver_eligible: "=waiver_eligible", waiver_request_window_days: "=waiver_request_window_days", waiver_full_income_pct_of_guideline: "=waiver_full_income_pct_of_guideline", waiver_partial_income_pct_of_guideline: "=waiver_partial_income_pct_of_guideline", waiver_partial_share: "=waiver_partial_share", recovery_suspended_while_waiver_pending: "=recovery_suspended_while_waiver_pending"}
      poverty_guideline_annual_base: "=poverty_guideline_annual_base"
      poverty_guideline_per_additional_person: "=poverty_guideline_per_additional_person"
      waiver_decision_business_days: "=waiver_decision_business_days"
    formula:
      waived_amount: "overpay_msr_unpaid_principal if overpay_msr_household_income_pct_of_guideline <= waiver_full_income_pct_of_guideline else (round(waiver_partial_share * overpay_msr_unpaid_principal, 2) if overpay_msr_household_income_pct_of_guideline <= waiver_partial_income_pct_of_guideline else 0)"
    measures: [overpay_msr_household_income_pct_of_guideline, overpay_msr_unpaid_principal]

  - id: overpay_repayment_plan
    subject: [overpay_repayment_plan_set]
    rule: >-
      A claimant may agree a monthly repayment plan instead of paying the balance at once.
      A repayment plan is set only while the overpayment status is established or in_recovery.
      The monthly installment is at least the classification's minimum monthly payment and at least the balance divided by the classification's maximum plan months, rounded up to the cent; the claimant may choose a larger installment.
      The first installment is due the first-payment days after the plan is set and later installments on the due day of each month.
      An installment not received by the end of the grace days after its due date is missed, and the plan is defaulted when overpay_msr_missed_plan_payments reaches the classification's default count; a defaulted plan allows referral for tax refund offset and ends any interest suspension.
      A current plan blocks referral for tax refund offset but does not stop benefit offsets.
      When several overpayments are open, one plan may cover them all, and installments are applied under overpay_agg_recovery_priority.
    eligibility:
      - id: plan_on_open_debt
        applies_to: [overpay_repayment_plan_set]
        kind: state
        condition: "A repayment plan is set only while the overpayment status is established or in_recovery."
        evidence_fields: [overpayments.overpayment_id, overpayments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpayments.overpayment_id]
          action_bindings: {overpayments.overpayment_id: overpayment_id}
        state_contract:
          field: overpayments.status
          allowed: [established, in_recovery]
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {min_monthly_payment: "=min_monthly_payment", max_plan_months: "=max_plan_months", plan_default_missed_payments: "=plan_default_missed_payments"}
        Non-Fraud Overpayment — Employer Reporting Error: {min_monthly_payment: "=min_monthly_payment", max_plan_months: "=max_plan_months", plan_default_missed_payments: "=plan_default_missed_payments"}
        Non-Fraud Overpayment — Appeal Reversal: {min_monthly_payment: "=min_monthly_payment", max_plan_months: "=max_plan_months", plan_default_missed_payments: "=plan_default_missed_payments"}
        Non-Fraud Overpayment — Claimant Error: {min_monthly_payment: "=min_monthly_payment", max_plan_months: "=max_plan_months", plan_default_missed_payments: "=plan_default_missed_payments"}
        Fraud Overpayment — First Offense: {min_monthly_payment: "=min_monthly_payment", max_plan_months: "=max_plan_months", plan_default_missed_payments: "=plan_default_missed_payments"}
        Fraud Overpayment — Repeat Offense: {min_monthly_payment: "=min_monthly_payment", max_plan_months: "=max_plan_months", plan_default_missed_payments: "=plan_default_missed_payments"}
      plan_first_payment_days: "=plan_first_payment_days"
      plan_payment_due_day: "=plan_payment_due_day"
      plan_grace_days: "=plan_grace_days"
    formula:
      monthly_installment_minimum: "max(min_monthly_payment, overpayment_balance / max_plan_months)"
    measures: [overpay_msr_missed_plan_payments]

  - id: overpay_treasury_offset
    subject: [overpay_top_notice_sent, overpay_top_referred, overpay_intercept_recovered]
    rule: >-
      A debt whose classification allows it may be recovered from federal tax refunds through the Treasury Offset Program and from state tax refunds by intercept; agency-error, employer-reporting-error and appeal-reversal debts are never referred.
      A notice of intent is mailed only when the balance is at least the minimum referral debt, the debt is delinquent because overpay_msr_days_since_last_recovery has reached the delinquency days, and no repayment plan is current.
      A debt is referred to the Treasury Offset Program only on or after the notice period after the date the notice of intent was sent.
      The notice period is counted in calendar days starting the day after the notice of intent was sent, and referral on the last day of the period is not yet allowed; state refund intercept may begin after its own shorter notice period counted the same way.
      If, before referral, the claimant pays in full, sets up a plan or files a timely request for review, the referral is not made; a referred debt that becomes current under a plan or reaches zero is withdrawn from referral.
      Intercepted amounts are applied under overpay_agg_recovery_priority, and an intercept larger than the balance is refunded.
    eligibility:
      - id: top_notice_period
        applies_to: [overpay_top_referred]
        kind: time
        condition: "A debt is referred to the Treasury Offset Program only on or after the notice period after the date the notice of intent was sent."
        evidence_fields: [overpayments.overpayment_id, overpayments.top_notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [overpayments.overpayment_id]
          action_bindings: {overpayments.overpayment_id: overpayment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the notice of intent was sent
          anchor_source: overpayments.top_notice_date
          relation: not_before
          duration_source: variants.top_notice_days
          unit: calendar_days
          counting_rule: "The notice period is counted in calendar days starting the day after the notice of intent was sent, and referral on the last day of the period is not yet allowed; state refund intercept may begin after its own shorter notice period counted the same way."
          boundary: exclusive
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {top_referral_eligible: "=top_referral_eligible", state_tax_refund_intercept_eligible: "=state_tax_refund_intercept_eligible"}
        Non-Fraud Overpayment — Employer Reporting Error: {top_referral_eligible: "=top_referral_eligible", state_tax_refund_intercept_eligible: "=state_tax_refund_intercept_eligible"}
        Non-Fraud Overpayment — Appeal Reversal: {top_referral_eligible: "=top_referral_eligible", state_tax_refund_intercept_eligible: "=state_tax_refund_intercept_eligible"}
        Non-Fraud Overpayment — Claimant Error: {top_referral_eligible: "=top_referral_eligible", state_tax_refund_intercept_eligible: "=state_tax_refund_intercept_eligible"}
        Fraud Overpayment — First Offense: {top_referral_eligible: "=top_referral_eligible", state_tax_refund_intercept_eligible: "=state_tax_refund_intercept_eligible"}
        Fraud Overpayment — Repeat Offense: {top_referral_eligible: "=top_referral_eligible", state_tax_refund_intercept_eligible: "=state_tax_refund_intercept_eligible"}
      top_notice_days: "=top_notice_days"
      top_min_debt: "=top_min_debt"
      intercept_notice_days: "=intercept_notice_days"
      delinquency_days_for_referral: "=delinquency_days_for_referral"
    measures: [overpay_msr_days_since_last_recovery]

  - id: overpay_appeal_suspension
    subject: [overpay_recovery_suspended, overpay_recovery_resumed, overpay_cancelled, overpay_cancellation_adjusted, overpay_refund_issued]
    rule: >-
      Recovery is suspended only when an appeal of the overpayment determination is on record with status filed or scheduled.
      While suspended, no offset, intercept, billing or interest is taken, and voluntary repayments are still accepted.
      When the determination is affirmed, or the appeal is withdrawn or dismissed, recovery resumes.
      When the determination is reversed, the overpayment is cancelled: every assessed component is removed by a cancellation adjustment tied to the reversing appeal, and everything already recovered is refunded to the claimant within the refund processing days with refund_basis cancelled_overpayment.
      A modified decision that lowers the overpaid amount is carried out by cancelling the original overpayment and establishing a new one for the amount the decision leaves.
    eligibility:
      - id: appeal_on_record
        applies_to: [overpay_recovery_suspended]
        kind: state
        condition: "Recovery is suspended only when an appeal of the overpayment determination is on record with status filed or scheduled."
        evidence_fields: [appeals.appeal_id, appeals.determination_record_id, appeals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.determination_record_id]
          action_bindings: {appeals.determination_record_id: overpayment_id}
        state_contract:
          field: appeals.status
          allowed: [filed, scheduled]
    params:
      refund_processing_business_days: "=refund_processing_business_days"

  - id: overpay_write_off
    subject: [overpay_written_off, overpay_writeoff_adjusted]
    rule: >-
      Recovery stops and the remaining balance is written off when the collection limit years after the determination date have passed, counted in calendar years with a February 29 anniversary falling back to February 28.
      A non-fraud balance below the small-balance threshold is also written off when overpay_msr_days_since_last_recovery covers at least the small-balance inactivity months; fraud balances are never written off as small balances.
      A write-off removes every remaining component, does not erase the determination, and a payment later received on a written-off debt is refunded.
    eligibility: []
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {collection_limit_years: "=collection_limit_years", small_balance_write_off_threshold: "=small_balance_write_off_threshold", small_balance_inactivity_months: "=small_balance_inactivity_months"}
        Non-Fraud Overpayment — Employer Reporting Error: {collection_limit_years: "=collection_limit_years", small_balance_write_off_threshold: "=small_balance_write_off_threshold", small_balance_inactivity_months: "=small_balance_inactivity_months"}
        Non-Fraud Overpayment — Appeal Reversal: {collection_limit_years: "=collection_limit_years", small_balance_write_off_threshold: "=small_balance_write_off_threshold", small_balance_inactivity_months: "=small_balance_inactivity_months"}
        Non-Fraud Overpayment — Claimant Error: {collection_limit_years: "=collection_limit_years", small_balance_write_off_threshold: "=small_balance_write_off_threshold", small_balance_inactivity_months: "=small_balance_inactivity_months"}
        Fraud Overpayment — First Offense: {collection_limit_years: "=collection_limit_years", small_balance_write_off_threshold: "=small_balance_write_off_threshold", small_balance_inactivity_months: "=small_balance_inactivity_months"}
        Fraud Overpayment — Repeat Offense: {collection_limit_years: "=collection_limit_years", small_balance_write_off_threshold: "=small_balance_write_off_threshold", small_balance_inactivity_months: "=small_balance_inactivity_months"}
    measures: [overpay_msr_days_since_last_recovery]

  - id: overpay_fraud_disqualification
    subject: [overpay_established]
    rule: >-
      A fraud determination also imposes the classification's penalty weeks, recorded in disqualification_weeks: otherwise-payable weeks the claimant certifies on any claim are denied, one penalty week at a time, until all penalty weeks are served.
      Penalty weeks are served only against weeks certified within the disqualification window years after the determination date; weeks not served by then lapse.
      Penalty weeks are not served by weeks that would not have been payable anyway, and they never reduce the claim balance.
      Non-fraud classifications impose no penalty weeks.
    eligibility: []
    params:
      per_tier:
        Non-Fraud Overpayment — Agency Error: {disqualification_weeks: "=disqualification_weeks", disqualification_window_years: "=disqualification_window_years"}
        Non-Fraud Overpayment — Employer Reporting Error: {disqualification_weeks: "=disqualification_weeks", disqualification_window_years: "=disqualification_window_years"}
        Non-Fraud Overpayment — Appeal Reversal: {disqualification_weeks: "=disqualification_weeks", disqualification_window_years: "=disqualification_window_years"}
        Non-Fraud Overpayment — Claimant Error: {disqualification_weeks: "=disqualification_weeks", disqualification_window_years: "=disqualification_window_years"}
        Fraud Overpayment — First Offense: {disqualification_weeks: "=disqualification_weeks", disqualification_window_years: "=disqualification_window_years"}
        Fraud Overpayment — Repeat Offense: {disqualification_weeks: "=disqualification_weeks", disqualification_window_years: "=disqualification_window_years"}
