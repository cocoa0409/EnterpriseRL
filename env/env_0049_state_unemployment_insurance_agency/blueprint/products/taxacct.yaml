events:
  - type: taxacct_registered
    target: employer_accounts
    mutation: create
    meaning: An employer registers for unemployment insurance tax and receives its state account.
    grain: One row per employer registration.
    fields:
      customer_id: The employer.
      variant_name: Financing class assigned at registration.
      ui_account_number: State unemployment insurance account number issued.
      entity_type: Legal form of the employer.
      naics_code: Industry code of the employer.
      registered_date: Date registered.
      liability_start_quarter: First quarter of liability.
      contribution_rate: Rate assigned for the first rate year, 0 for reimbursing employers.
    triggers: []
  - type: taxacct_liability_activated
    target: employer_accounts
    mutation: {transition: {from: registered, to: active}}
    meaning: The employer becomes liable.
    grain: One transition per account.
    fields:
      status: Set to active.
    triggers: []
  - type: taxacct_wage_report_filed
    target: employer_wage_reports
    meaning: The employer files a quarterly contribution and wage report, original or amended.
    grain: One row per report filed for one quarter.
    distinguish_by: [quarter, report_type, filed_date]
    fields:
      quarter: Calendar quarter reported.
      report_type: Original, amended or final report.
      filed_date: Date the report was filed.
      due_date: Due date of the quarter's report.
      filing_channel: How the report was filed.
      total_wages: Total wages paid in the quarter.
      excess_wages: Wages above the taxable wage base for each employee.
      taxable_wages: Total wages minus excess wages.
      employee_count_month1: Employees on the reference day of the quarter's first month.
      employee_count_month2: Employees on the reference day of the quarter's second month.
      employee_count_month3: Employees on the reference day of the quarter's third month.
    triggers: []
  - type: taxacct_contribution_assessed
    target: employer_tax_ledger
    meaning: Contributions for a quarter are assessed from a report, an amended report or an estimate.
    grain: One row per quarter per assessment basis per booking date.
    distinguish_by: [quarter, assessment_basis, entry_date]
    fields:
      quarter: Quarter assessed.
      assessment_basis: What the assessment rests on.
      contribution_rate_applied: Rate used.
      component: Set to contribution.
      amount: Amount assessed, positive.
      entry_date: Date assessed.
    account: contribution_balance_due
    direction: in
    triggers: []
  - type: taxacct_reimbursement_billed
    target: employer_tax_ledger
    meaning: A reimbursing employer is billed for benefits charged to it in a quarter.
    grain: One row per reimbursing employer per quarter billed.
    distinguish_by: [quarter]
    fields:
      quarter: Quarter of the charges billed.
      component: Set to reimbursement.
      amount: Bill amount, positive.
      bill_due_date: Date the bill must be paid by.
      entry_date: Date the bill was mailed.
    account: contribution_balance_due
    direction: in
    triggers: []
  - type: taxacct_penalty_assessed
    target: employer_tax_ledger
    meaning: A late report penalty is assessed for a quarter.
    grain: One row per quarter per penalty type.
    distinguish_by: [quarter, penalty_type]
    fields:
      quarter: Quarter whose report was late.
      penalty_type: Kind of penalty.
      component: Set to penalty.
      amount: Penalty assessed, positive.
      entry_date: Date assessed.
    account: contribution_balance_due
    direction: in
    triggers: []
  - type: taxacct_interest_assessed
    target: employer_tax_ledger
    meaning: A month of interest is assessed on an unpaid quarter.
    grain: One row per quarter per accrual month.
    distinguish_by: [quarter, accrual_month]
    fields:
      quarter: Quarter whose balance is unpaid.
      accrual_month: Month or part month of lateness.
      component: Set to interest.
      amount: Interest assessed, positive.
      entry_date: Date assessed.
    account: contribution_balance_due
    direction: in
    triggers: []
  - type: taxacct_payment_received
    target: employer_tax_ledger
    meaning: An employer payment is applied to a quarter's balance.
    grain: One row per payment per quarter and component applied to.
    distinguish_by: [payment_reference, quarter, component]
    fields:
      payment_reference: Confirmation number of the payment, exactly as issued by the payment channel.
      payment_channel: Channel used.
      quarter: Quarter the amount is applied to.
      component: Component the amount is applied to.
      amount: Amount applied, positive.
      entry_date: Date received.
    account: contribution_balance_due
    direction: out
    triggers:
      - event: taxacct:taxacct_reserve_credited
        when: {component: contribution}
        map: {quarter: quarter, amount: amount, payment_reference: payment_reference, credit_source: contribution_paid}
  - type: taxacct_credit_adjusted
    target: employer_tax_ledger
    meaning: A quarter's balance is reduced by an amended report, a rate reduced on appeal or a penalty abatement.
    grain: One row per quarter per adjustment reason per component.
    distinguish_by: [quarter, adjustment_reason, component]
    fields:
      quarter: Quarter adjusted.
      adjustment_reason: Why it is reduced.
      component: Component reduced.
      amount: Amount of the reduction, positive.
      entry_date: Date adjusted.
    account: contribution_balance_due
    direction: out
    triggers: []
  - type: taxacct_refund_issued
    target: employer_tax_ledger
    meaning: A credit balance is refunded to the employer at its request.
    grain: One row per refund request paid.
    distinguish_by: [account_request_id]
    fields:
      account_request_id: The employer's refund request.
      amount: Amount refunded, positive.
      entry_date: Date the refund was issued.
    account: contribution_balance_due
    direction: in
    triggers: []
  - type: taxacct_reserve_credited
    target: employer_tax_ledger
    meaning: Contributions paid are credited to the employer's reserve account.
    grain: One row per contribution payment per quarter credited.
    distinguish_by: [quarter, payment_reference]
    fields:
      quarter: Quarter of the contributions paid.
      payment_reference: Payment credited.
      credit_source: Set to contribution_paid.
      amount: Amount credited, positive.
      entry_date: Date credited.
    account: reserve_account_balance
    direction: in
    triggers: []
  - type: taxacct_voluntary_contribution_paid
    target: employer_tax_ledger
    meaning: A voluntary contribution is credited to the reserve to lower the coming year's rate.
    grain: One row per voluntary contribution per rate year.
    distinguish_by: [rate_year, payment_reference]
    fields:
      rate_year: Rate year the contribution is meant to lower.
      payment_reference: Confirmation number of the payment.
      credit_source: Set to voluntary_contribution.
      amount: Amount credited, positive.
      entry_date: Date received.
    account: reserve_account_balance
    direction: in
    triggers:
      - event: taxacct:taxacct_rate_assigned
        map: {rate_year: rate_year}
  - type: taxacct_charges_posted
    target: employer_tax_ledger
    meaning: Benefit charges of a quarter are posted against a contributory employer's reserve account.
    grain: One row per contributory employer per quarter.
    distinguish_by: [quarter]
    fields:
      quarter: Quarter of the charges.
      amount: Charges posted, positive.
      entry_date: Date posted.
    account: reserve_account_balance
    direction: out
    triggers: []
  - type: taxacct_reserve_transfer_received
    target: employer_tax_ledger
    meaning: A predecessor's reserve balance is transferred in to a successor.
    grain: One row per predecessor transferred in.
    distinguish_by: [predecessor_account_id]
    fields:
      predecessor_account_id: The predecessor account.
      amount: Reserve transferred in, positive.
      entry_date: Effective date of the transfer.
    account: reserve_account_balance
    direction: in
    triggers: []
  - type: taxacct_reserve_transfer_sent
    target: employer_tax_ledger
    meaning: A predecessor's reserve balance is transferred out to a successor.
    grain: One row per successor transferred to.
    distinguish_by: [successor_account_id]
    fields:
      successor_account_id: The successor account.
      amount: Reserve transferred out, positive.
      entry_date: Effective date of the transfer.
    account: reserve_account_balance
    direction: out
    triggers: []
  - type: taxacct_rate_assigned
    target: employer_accounts
    mutation: update
    meaning: A contribution rate is assigned for a rate year - on the annual rate notice, after a voluntary contribution, or after an appeal decision.
    grain: One holding update per rate notice issued.
    fields:
      contribution_rate: Rate assigned.
      rate_year: Rate year it applies to.
      reserve_ratio: Reserve ratio it rests on.
      rate_notice_date: Date the rate notice was mailed.
    triggers: []
  - type: taxacct_financing_class_changed
    target: employer_accounts
    mutation: update
    meaning: The account moves to another financing class.
    grain: One holding update per class change.
    fields:
      variant_name: New financing class.
      class_effective_date: Date the new class takes effect.
    triggers: []
  - type: taxacct_experience_transferred
    target: employer_accounts
    mutation: update
    meaning: A predecessor's experience is transferred to this successor account.
    grain: One holding update per transfer.
    fields:
      predecessor_account_id: The predecessor account.
      transfer_effective_date: Effective date of the transfer.
    triggers:
      - event: taxacct:taxacct_reserve_transfer_received
        map: {predecessor_account_id: predecessor_account_id}
  - type: taxacct_delinquency_flagged
    target: employer_accounts
    mutation: {transition: {from: active, to: delinquent}}
    meaning: The account becomes delinquent.
    grain: One transition per delinquency.
    fields:
      status: Set to delinquent.
    triggers: []
  - type: taxacct_delinquency_cured
    target: employer_accounts
    mutation: {transition: {from: delinquent, to: active}}
    meaning: The delinquency is cured.
    grain: One transition per cure.
    fields:
      status: Set to active.
    triggers: []
  - type: taxacct_inactivated
    target: employer_accounts
    mutation: {transition: {from: active, to: inactive}}
    meaning: The account is inactivated for lack of wages.
    grain: One transition per inactivation.
    fields:
      status: Set to inactive.
      inactive_since_quarter: First quarter without wages.
    triggers: []
  - type: taxacct_reactivated
    target: employer_accounts
    mutation: {transition: {from: inactive, to: active}}
    meaning: Wages resume and the account is reactivated.
    grain: One transition per reactivation.
    fields:
      status: Set to active.
      inactive_since_quarter: Reset to empty.
    triggers: []
  - type: taxacct_closed
    target: employer_accounts
    mutation:
      transition:
        - {from: registered, to: closed}
        - {from: active, to: closed}
        - {from: inactive, to: closed}
    meaning: The employer confirms the closure of its account.
    grain: One transition per account.
    fields:
      status: Set to closed.
      closed_date: Date the closure took effect.
    triggers: []

measures:
  - id: taxacct_msr_computation_date_reserve
    window: Reserve deltas booked on or before the computation date preceding the rate year.
    measure: Sum of reserve_account_balance deltas (credits in minus charges and transfers out) booked on or before that computation date.
  - id: taxacct_msr_unpaid_quarter_balance
    window: One quarter, to the end of the accrual month.
    measure: Contributions or reimbursement billed for the quarter minus payments and credits applied to that component of the quarter, never below zero.
  - id: taxacct_msr_quarter_charges
    window: One calendar quarter, by posting entry_date.
    measure: Sum of charge_benefit_posted amounts minus charge_credit_reversed amounts on the charge positions of this employer account with entry_date in the quarter.
  - id: taxacct_msr_consecutive_zero_wage_quarters
    window: Quarters reported up to the latest quarter whose due date has passed.
    measure: Number of consecutive most recent quarters whose latest report shows total_wages of zero.
  - id: taxacct_msr_next_lower_rate_floor
    window: The rate year on the latest rate notice.
    measure: The reserve_ratio_floor of the schedule row directly above the row that produced the assigned rate (none when the account is already at the lowest rate).
  - id: taxacct_msr_prior_late_reports
    window: The penalty abatement lookback quarters before the late quarter.
    measure: Count of quarters in the window whose original report was filed after its due date.

policies:
  - id: taxacct_agg_multi_holding
    subject: [taxacct_registered]
    rule: >-
      An employer holds a single unemployment insurance tax account for all of its Lakeland locations, keyed to its Federal Employer Identification Number; related businesses with their own FEIN register their own accounts and are linked only through experience transfer.
      A new account is registered only when the employer has no other account with status registered, active, delinquent or inactive.
      An employer whose earlier account is closed registers a new account; experience of the closed account carries over only through taxacct_evt_experience_transfer.
    eligibility:
      - id: one_open_account
        applies_to: [taxacct_registered]
        kind: dedup
        condition: "A new account is registered only when the employer has no other account with status registered, active, delinquent or inactive."
        evidence_fields: [employer_accounts.customer_id, employer_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_accounts.customer_id]
          action_bindings: {employer_accounts.customer_id: customer_id}
        dedup_contract:
          table: employer_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [registered, active, delinquent, inactive]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: taxacct_class_assignment
    subject: [taxacct_registered, taxacct_financing_class_changed]
    rule: >-
      A new contributory employer is placed in the construction class when its NAICS code begins with the construction prefix and in the standard class otherwise, and pays the class's new employer rate.
      At each computation date a new employer whose liability has run for the experience rating eligibility months moves to experience rating, in the positive reserve class when taxacct_msr_computation_date_reserve is zero or more and in the deficit reserve class when it is below zero; an experience-rated employer moves between those two classes on the same test each computation date.
      An experience-rated employer with any quarterly report missing at the computation date is placed in the delinquent reporting class for the whole next rate year, whatever its reserve.
      A 501(c)(3) nonprofit or a governmental entity may instead elect reimbursing financing within the election window after its liability determination, or effective January 1 by filing at least the termination notice days before; the election stays in force for the minimum years, and a return to contributory financing likewise starts on a January 1 after the termination notice.
      A nonprofit electing reimbursing financing must keep the security deposit or bond; a governmental entity needs none.
      Reimbursing employers have no rate, no reserve account and no voluntary contributions, which are features of contributory financing only.
      A class change takes effect on January 1 of the rate year it is made for, except a reimbursing election made within the election window, which takes effect from the start of liability.
    eligibility: []
    params:
      per_tier:
        Contributory — New Employer Standard Rate: {financing_method: "=financing_method", experience_rating_eligibility_months: "=experience_rating_eligibility_months", reimbursing_election_window_days: "=reimbursing_election_window_days", reimbursing_election_min_years: "=reimbursing_election_min_years", reimbursing_termination_notice_days: "=reimbursing_termination_notice_days", reimbursing_security_pct_of_taxable_wages: "=reimbursing_security_pct_of_taxable_wages"}
        Contributory — New Employer Construction Rate: {financing_method: "=financing_method", experience_rating_eligibility_months: "=experience_rating_eligibility_months", reimbursing_election_window_days: "=reimbursing_election_window_days", reimbursing_election_min_years: "=reimbursing_election_min_years", reimbursing_termination_notice_days: "=reimbursing_termination_notice_days", reimbursing_security_pct_of_taxable_wages: "=reimbursing_security_pct_of_taxable_wages"}
        Contributory — Experience-Rated Positive Reserve: {financing_method: "=financing_method", experience_rating_eligibility_months: "=experience_rating_eligibility_months", reimbursing_election_window_days: "=reimbursing_election_window_days", reimbursing_election_min_years: "=reimbursing_election_min_years", reimbursing_termination_notice_days: "=reimbursing_termination_notice_days", reimbursing_security_pct_of_taxable_wages: "=reimbursing_security_pct_of_taxable_wages"}
        Contributory — Experience-Rated Deficit Reserve: {financing_method: "=financing_method", experience_rating_eligibility_months: "=experience_rating_eligibility_months", reimbursing_election_window_days: "=reimbursing_election_window_days", reimbursing_election_min_years: "=reimbursing_election_min_years", reimbursing_termination_notice_days: "=reimbursing_termination_notice_days", reimbursing_security_pct_of_taxable_wages: "=reimbursing_security_pct_of_taxable_wages"}
        Contributory — Delinquent Reporting Assigned Rate: {financing_method: "=financing_method", experience_rating_eligibility_months: "=experience_rating_eligibility_months", reimbursing_election_window_days: "=reimbursing_election_window_days", reimbursing_election_min_years: "=reimbursing_election_min_years", reimbursing_termination_notice_days: "=reimbursing_termination_notice_days", reimbursing_security_pct_of_taxable_wages: "=reimbursing_security_pct_of_taxable_wages"}
        Reimbursing — Nonprofit Organization: {financing_method: "=financing_method", experience_rating_eligibility_months: "=experience_rating_eligibility_months", reimbursing_election_window_days: "=reimbursing_election_window_days", reimbursing_election_min_years: "=reimbursing_election_min_years", reimbursing_termination_notice_days: "=reimbursing_termination_notice_days", reimbursing_security_pct_of_taxable_wages: "=reimbursing_security_pct_of_taxable_wages"}
        Reimbursing — Governmental Entity: {financing_method: "=financing_method", experience_rating_eligibility_months: "=experience_rating_eligibility_months", reimbursing_election_window_days: "=reimbursing_election_window_days", reimbursing_election_min_years: "=reimbursing_election_min_years", reimbursing_termination_notice_days: "=reimbursing_termination_notice_days", reimbursing_security_pct_of_taxable_wages: "=reimbursing_security_pct_of_taxable_wages"}
      construction_naics_prefix: "=construction_naics_prefix"
      computation_date: "=computation_date"
    measures: [taxacct_msr_computation_date_reserve]

  - id: taxacct_evt_rate_assignment
    subject: [taxacct_rate_assigned]
    rule: >-
      Each contributory account receives a rate notice for the calendar rate year, mailed no later than the rate notice mailing deadline.
      A rate is assigned only to an account whose status is active, delinquent or inactive.
      New employer classes receive their class's new employer rate and the delinquent reporting class its assigned rate.
      For experience-rated classes the reserve ratio is taxacct_msr_computation_date_reserve divided by the average annual taxable payroll of the fiscal years ending on the computation date, rounded to four decimals, and the rate is that of the first row of the class's schedule whose floor the ratio meets.
      A voluntary contribution accepted under taxacct_evt_voluntary_contribution adds to the reserve at the computation date and a revised notice is issued for the same rate year; an appeal decision reversing or modifying the rate also produces a revised notice, and contributions already assessed for the year are re-assessed at the revised rate with the difference credited.
    eligibility:
      - id: rate_on_liable_account
        applies_to: [taxacct_rate_assigned]
        kind: state
        condition: "A rate is assigned only to an account whose status is active, delinquent or inactive."
        evidence_fields: [employer_accounts.employer_account_id, employer_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_accounts.employer_account_id]
          action_bindings: {employer_accounts.employer_account_id: employer_account_id}
        state_contract:
          field: employer_accounts.status
          allowed: [active, delinquent, inactive]
    params:
      per_tier:
        Contributory — New Employer Standard Rate: {contribution_rate_basis: "=contribution_rate_basis", new_employer_rate: "=new_employer_rate", rate_schedule: "=rate_schedule", delinquent_assigned_rate: "=delinquent_assigned_rate"}
        Contributory — New Employer Construction Rate: {contribution_rate_basis: "=contribution_rate_basis", new_employer_rate: "=new_employer_rate", rate_schedule: "=rate_schedule", delinquent_assigned_rate: "=delinquent_assigned_rate"}
        Contributory — Experience-Rated Positive Reserve: {contribution_rate_basis: "=contribution_rate_basis", new_employer_rate: "=new_employer_rate", rate_schedule: "=rate_schedule", delinquent_assigned_rate: "=delinquent_assigned_rate"}
        Contributory — Experience-Rated Deficit Reserve: {contribution_rate_basis: "=contribution_rate_basis", new_employer_rate: "=new_employer_rate", rate_schedule: "=rate_schedule", delinquent_assigned_rate: "=delinquent_assigned_rate"}
        Contributory — Delinquent Reporting Assigned Rate: {contribution_rate_basis: "=contribution_rate_basis", new_employer_rate: "=new_employer_rate", rate_schedule: "=rate_schedule", delinquent_assigned_rate: "=delinquent_assigned_rate"}
        Reimbursing — Nonprofit Organization: {contribution_rate_basis: "=contribution_rate_basis", new_employer_rate: "=new_employer_rate", rate_schedule: "=rate_schedule", delinquent_assigned_rate: "=delinquent_assigned_rate"}
        Reimbursing — Governmental Entity: {contribution_rate_basis: "=contribution_rate_basis", new_employer_rate: "=new_employer_rate", rate_schedule: "=rate_schedule", delinquent_assigned_rate: "=delinquent_assigned_rate"}
      reserve_ratio_payroll_years: "=reserve_ratio_payroll_years"
      rate_year_basis: "=rate_year_basis"
      rate_notice_mailing_deadline: "=rate_notice_mailing_deadline"
    formula:
      reserve_ratio: "round(taxacct_msr_computation_date_reserve / average_annual_taxable_payroll, 4)"
    measures: [taxacct_msr_computation_date_reserve]

  - id: taxacct_evt_quarterly_report
    subject: [taxacct_wage_report_filed, taxacct_contribution_assessed, taxacct_liability_activated]
    rule: >-
      A registered account becomes active with the first quarter in which the employer pays covered wages, and that quarter is its liability start quarter.
      Every liable employer files a contribution and wage report for each calendar quarter, due on the last day of the month after the quarter ends, with employees counted on the reference day of each month; employers at or above the electronic filing threshold file electronically.
      A report is accepted only while the account status is registered, active, delinquent or inactive.
      Taxable wages are total wages minus excess wages, the excess being each employee's wages above the taxable wage base counted cumulatively over the calendar year.
      For a contributory employer an original report assesses contributions of taxable wages times the contribution rate in force for that quarter's rate year, rounded to the cent; a reimbursing employer's report assesses nothing and its liability comes from reimbursement bills.
      An original report is filed once per quarter; a correction is an amended report, which assesses only an increase in contributions or books a credit for a decrease.
      When a report is still unfiled the estimated assessment days after the due date, contributions are assessed on an estimate of the highest of the last four reported quarters' taxable wages times the uplift, replaced by the real figures when the report is filed.
    eligibility:
      - id: report_on_open_account
        applies_to: [taxacct_wage_report_filed]
        kind: state
        condition: "A report is accepted only while the account status is registered, active, delinquent or inactive."
        evidence_fields: [employer_accounts.employer_account_id, employer_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_accounts.employer_account_id]
          action_bindings: {employer_accounts.employer_account_id: employer_account_id}
        state_contract:
          field: employer_accounts.status
          allowed: [registered, active, delinquent, inactive]
      - id: one_original_per_quarter
        applies_to: [taxacct_wage_report_filed]
        kind: dedup
        condition: "An original report is filed once per quarter; a correction is an amended report, which assesses only an increase in contributions or books a credit for a decrease."
        evidence_fields: [employer_wage_reports.employer_account_id, employer_wage_reports.quarter, employer_wage_reports.report_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_wage_reports.employer_account_id, employer_wage_reports.quarter]
          action_bindings: {employer_wage_reports.employer_account_id: employer_account_id, employer_wage_reports.quarter: quarter}
        dedup_contract:
          table: employer_wage_reports
          mode: separate_record
          object_bindings: {employer_account_id: employer_account_id, quarter: quarter}
          duplicate_filters: {report_type: [original, final]}
          distinct_fields: [filed_date]
    params:
      taxable_wage_base: "=taxable_wage_base"
      excess_wages_basis: "=excess_wages_basis"
      report_due_rule: "=report_due_rule"
      employee_count_reference_day: "=employee_count_reference_day"
      electronic_filing_required_min_employees: "=electronic_filing_required_min_employees"
      estimated_assessment_after_days: "=estimated_assessment_after_days"
      estimated_assessment_wage_uplift: "=estimated_assessment_wage_uplift"
    formula:
      contribution_amount: "round(taxable_wages * contribution_rate, 2)"

  - id: taxacct_evt_penalty_interest
    subject: [taxacct_penalty_assessed, taxacct_interest_assessed, taxacct_credit_adjusted]
    rule: >-
      A report filed after its due date carries a late report penalty of the larger of the flat penalty and the wage share of the quarter's total wages, capped at the maximum.
      A late report penalty is assessed once per quarter.
      Contributions and reimbursement bills unpaid after their due date carry interest at the class's monthly rate on taxacct_msr_unpaid_quarter_balance for each month or part of a month of lateness, never on penalty or interest; governmental reimbursing employers are not charged interest.
      A late report penalty is abated in full, never in part, when the employer shows that taxacct_msr_prior_late_reports is zero and requests abatement in time.
      A penalty abatement is granted only when it is requested no later than the abatement window after the penalty assessment date.
      The window is counted in calendar days starting the day after the penalty assessment date, and a request on the last day is in time.
      Interest is never abated.
    eligibility:
      - id: penalty_once_per_quarter
        applies_to: [taxacct_penalty_assessed]
        kind: dedup
        condition: "A late report penalty is assessed once per quarter."
        evidence_fields: [employer_tax_ledger.employer_account_id, employer_tax_ledger.quarter, employer_tax_ledger.penalty_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_tax_ledger.employer_account_id, employer_tax_ledger.quarter]
          action_bindings: {employer_tax_ledger.employer_account_id: employer_account_id, employer_tax_ledger.quarter: quarter}
        dedup_contract:
          table: employer_tax_ledger
          mode: separate_record
          object_bindings: {employer_account_id: employer_account_id, quarter: quarter}
          duplicate_filters: {event_type: [taxacct_penalty_assessed], penalty_type: [late_report]}
          distinct_fields: []
      - id: abatement_request_window
        applies_to: [taxacct_credit_adjusted]
        kind: time
        condition: "A penalty abatement is granted only when it is requested no later than the abatement window after the penalty assessment date."
        evidence_fields: [employer_tax_ledger.tax_entry_id, employer_tax_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_tax_ledger.tax_entry_id]
          action_bindings: {employer_tax_ledger.tax_entry_id: penalty_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the penalty assessment date
          anchor_source: employer_tax_ledger.entry_date
          relation: not_after
          duration_source: variants.penalty_abatement_request_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the penalty assessment date, and a request on the last day is in time."
          boundary: inclusive
    params:
      late_report_penalty_flat: "=late_report_penalty_flat"
      late_report_penalty_pct_of_wages: "=late_report_penalty_pct_of_wages"
      late_report_penalty_max: "=late_report_penalty_max"
      per_tier:
        Contributory — New Employer Standard Rate: {late_payment_interest_rate_monthly: "=late_payment_interest_rate_monthly"}
        Contributory — New Employer Construction Rate: {late_payment_interest_rate_monthly: "=late_payment_interest_rate_monthly"}
        Contributory — Experience-Rated Positive Reserve: {late_payment_interest_rate_monthly: "=late_payment_interest_rate_monthly"}
        Contributory — Experience-Rated Deficit Reserve: {late_payment_interest_rate_monthly: "=late_payment_interest_rate_monthly"}
        Contributory — Delinquent Reporting Assigned Rate: {late_payment_interest_rate_monthly: "=late_payment_interest_rate_monthly"}
        Reimbursing — Nonprofit Organization: {late_payment_interest_rate_monthly: "=late_payment_interest_rate_monthly"}
        Reimbursing — Governmental Entity: {late_payment_interest_rate_monthly: "=late_payment_interest_rate_monthly"}
      interest_partial_month_basis: "=interest_partial_month_basis"
      penalty_abatement_lookback_quarters: "=penalty_abatement_lookback_quarters"
      penalty_abatement_request_days: "=penalty_abatement_request_days"
      interest_abatement_allowed: "=interest_abatement_allowed"
    formula:
      late_report_penalty: "min(late_report_penalty_max, max(late_report_penalty_flat, late_report_penalty_pct_of_wages * total_wages))"
      monthly_interest: "round(late_payment_interest_rate_monthly * taxacct_msr_unpaid_quarter_balance, 2)"
    measures: [taxacct_msr_unpaid_quarter_balance, taxacct_msr_prior_late_reports]

  - id: taxacct_evt_payments
    subject: [taxacct_payment_received, taxacct_reserve_credited, taxacct_refund_issued]
    rule: >-
      Payments are accepted through the listed channels; a payment the employer designates for a quarter is applied to that quarter, and an undesignated payment is applied to the oldest quarter with a balance first, and within a quarter to contribution or reimbursement, then interest, then penalty.
      The contribution part of each payment is credited to the reserve account of a contributory employer; payments of reimbursement bills, interest and penalty are never credited to the reserve.
      A credit balance is applied to the next quarter due unless the employer requests a refund.
      A refund of a credit balance is issued only when it is requested no later than the refund limit after the payment that created the credit.
      The limit is counted in calendar months from the payment date, a month-end payment date falling back to the last day of a shorter month, and a request on the last day is in time.
      An approved refund is issued within the refund processing business days for no more than the credit balance, and is recorded against the refund request.
    eligibility:
      - id: refund_request_window
        applies_to: [taxacct_refund_issued]
        kind: time
        condition: "A refund of a credit balance is issued only when it is requested no later than the refund limit after the payment that created the credit."
        evidence_fields: [employer_tax_ledger.tax_entry_id, employer_tax_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_tax_ledger.tax_entry_id]
          action_bindings: {employer_tax_ledger.tax_entry_id: credit_payment_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the payment that created the credit
          anchor_source: employer_tax_ledger.entry_date
          relation: not_after
          duration_source: variants.credit_refund_request_months
          unit: calendar_months
          counting_rule: "The limit is counted in calendar months from the payment date, a month-end payment date falling back to the last day of a shorter month, and a request on the last day is in time."
          boundary: inclusive
    params:
      payment_channels: "=payment_channels"
      payment_application_order: "=payment_application_order"
      credit_application_default: "=credit_application_default"
      credit_refund_request_months: "=credit_refund_request_months"
      refund_processing_business_days: "=refund_processing_business_days"
      per_tier:
        Contributory — New Employer Standard Rate: {reserve_credit_basis: "=reserve_credit_basis"}
        Contributory — New Employer Construction Rate: {reserve_credit_basis: "=reserve_credit_basis"}
        Contributory — Experience-Rated Positive Reserve: {reserve_credit_basis: "=reserve_credit_basis"}
        Contributory — Experience-Rated Deficit Reserve: {reserve_credit_basis: "=reserve_credit_basis"}
        Contributory — Delinquent Reporting Assigned Rate: {reserve_credit_basis: "=reserve_credit_basis"}
        Reimbursing — Nonprofit Organization: {reserve_credit_basis: "=reserve_credit_basis"}
        Reimbursing — Governmental Entity: {reserve_credit_basis: "=reserve_credit_basis"}

  - id: taxacct_evt_voluntary_contribution
    subject: [taxacct_voluntary_contribution_paid]
    rule: >-
      An experience-rated employer in the positive or deficit reserve class may buy a lower rate by paying a voluntary contribution into its reserve; new employer, delinquent reporting and reimbursing classes may not.
      A voluntary contribution is accepted only when it is received no later than the voluntary contribution window after the rate notice mailing date.
      The window is counted in calendar days starting the day after the rate notice mailing date, and a contribution received on the last day is in time.
      The amount needed to reach the next lower rate is the next schedule row's floor (taxacct_msr_next_lower_rate_floor) times the average annual taxable payroll, minus taxacct_msr_computation_date_reserve, rounded up to the next whole dollar; a smaller payment lowers nothing and is still credited to the reserve.
      A voluntary contribution is never refunded and never applied to the balance due, and it produces a revised rate notice for the same rate year.
    eligibility:
      - id: voluntary_contribution_window
        applies_to: [taxacct_voluntary_contribution_paid]
        kind: time
        condition: "A voluntary contribution is accepted only when it is received no later than the voluntary contribution window after the rate notice mailing date."
        evidence_fields: [employer_accounts.employer_account_id, employer_accounts.rate_notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_accounts.employer_account_id]
          action_bindings: {employer_accounts.employer_account_id: employer_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the rate notice mailing date
          anchor_source: employer_accounts.rate_notice_date
          relation: not_after
          duration_source: variants.voluntary_contribution_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the rate notice mailing date, and a contribution received on the last day is in time."
          boundary: inclusive
      - id: experience_rated_class_only
        applies_to: [taxacct_voluntary_contribution_paid]
        kind: authorization
        condition: "An experience-rated employer in the positive or deficit reserve class may buy a lower rate by paying a voluntary contribution into its reserve; new employer, delinquent reporting and reimbursing classes may not."
        evidence_fields: [employer_accounts.employer_account_id, employer_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_accounts.employer_account_id]
          action_bindings: {employer_accounts.employer_account_id: employer_account_id}
    params:
      per_tier:
        Contributory — New Employer Standard Rate: {voluntary_contribution_allowed: "=voluntary_contribution_allowed", voluntary_contribution_window_days: "=voluntary_contribution_window_days"}
        Contributory — New Employer Construction Rate: {voluntary_contribution_allowed: "=voluntary_contribution_allowed", voluntary_contribution_window_days: "=voluntary_contribution_window_days"}
        Contributory — Experience-Rated Positive Reserve: {voluntary_contribution_allowed: "=voluntary_contribution_allowed", voluntary_contribution_window_days: "=voluntary_contribution_window_days"}
        Contributory — Experience-Rated Deficit Reserve: {voluntary_contribution_allowed: "=voluntary_contribution_allowed", voluntary_contribution_window_days: "=voluntary_contribution_window_days"}
        Contributory — Delinquent Reporting Assigned Rate: {voluntary_contribution_allowed: "=voluntary_contribution_allowed", voluntary_contribution_window_days: "=voluntary_contribution_window_days"}
        Reimbursing — Nonprofit Organization: {voluntary_contribution_allowed: "=voluntary_contribution_allowed", voluntary_contribution_window_days: "=voluntary_contribution_window_days"}
        Reimbursing — Governmental Entity: {voluntary_contribution_allowed: "=voluntary_contribution_allowed", voluntary_contribution_window_days: "=voluntary_contribution_window_days"}
      voluntary_contribution_refundable: "=voluntary_contribution_refundable"
    formula:
      amount_to_next_lower_rate: "max(0, taxacct_msr_next_lower_rate_floor * average_annual_taxable_payroll - taxacct_msr_computation_date_reserve)"
    measures: [taxacct_msr_next_lower_rate_floor, taxacct_msr_computation_date_reserve]

  - id: taxacct_evt_charges_and_billing
    subject: [taxacct_charges_posted, taxacct_reimbursement_billed]
    rule: >-
      Benefit charges recorded on an employer's charge positions in a quarter (taxacct_msr_quarter_charges) reach the tax account once per quarter.
      For a contributory employer they are posted against the reserve account, which lowers its reserve ratio at the next computation date but creates nothing due.
      A reimbursing employer is instead billed the same quarterly amount, due within the bill due days after mailing; interest runs on an unpaid bill as on unpaid contributions.
      Charges of a quarter are posted or billed once per quarter, and a credit arising after posting reduces the next quarter's posting or bill.
    eligibility:
      - id: once_per_quarter
        applies_to: [taxacct_charges_posted, taxacct_reimbursement_billed]
        kind: dedup
        condition: "Charges of a quarter are posted or billed once per quarter, and a credit arising after posting reduces the next quarter's posting or bill."
        evidence_fields: [employer_tax_ledger.employer_account_id, employer_tax_ledger.quarter, employer_tax_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_tax_ledger.employer_account_id, employer_tax_ledger.quarter]
          action_bindings: {employer_tax_ledger.employer_account_id: employer_account_id, employer_tax_ledger.quarter: quarter}
        dedup_contract:
          table: employer_tax_ledger
          mode: separate_record
          object_bindings: {employer_account_id: employer_account_id, quarter: quarter}
          duplicate_filters: {event_type: [taxacct_charges_posted, taxacct_reimbursement_billed]}
          distinct_fields: []
    params:
      per_tier:
        Contributory — New Employer Standard Rate: {charges_posting_frequency: "=charges_posting_frequency", reimbursement_bill_frequency: "=reimbursement_bill_frequency", reimbursement_bill_due_days: "=reimbursement_bill_due_days"}
        Contributory — New Employer Construction Rate: {charges_posting_frequency: "=charges_posting_frequency", reimbursement_bill_frequency: "=reimbursement_bill_frequency", reimbursement_bill_due_days: "=reimbursement_bill_due_days"}
        Contributory — Experience-Rated Positive Reserve: {charges_posting_frequency: "=charges_posting_frequency", reimbursement_bill_frequency: "=reimbursement_bill_frequency", reimbursement_bill_due_days: "=reimbursement_bill_due_days"}
        Contributory — Experience-Rated Deficit Reserve: {charges_posting_frequency: "=charges_posting_frequency", reimbursement_bill_frequency: "=reimbursement_bill_frequency", reimbursement_bill_due_days: "=reimbursement_bill_due_days"}
        Contributory — Delinquent Reporting Assigned Rate: {charges_posting_frequency: "=charges_posting_frequency", reimbursement_bill_frequency: "=reimbursement_bill_frequency", reimbursement_bill_due_days: "=reimbursement_bill_due_days"}
        Reimbursing — Nonprofit Organization: {charges_posting_frequency: "=charges_posting_frequency", reimbursement_bill_frequency: "=reimbursement_bill_frequency", reimbursement_bill_due_days: "=reimbursement_bill_due_days"}
        Reimbursing — Governmental Entity: {charges_posting_frequency: "=charges_posting_frequency", reimbursement_bill_frequency: "=reimbursement_bill_frequency", reimbursement_bill_due_days: "=reimbursement_bill_due_days"}
    measures: [taxacct_msr_quarter_charges]

  - id: taxacct_evt_delinquency
    subject: [taxacct_delinquency_flagged, taxacct_delinquency_cured]
    rule: >-
      An active account becomes delinquent when any quarterly report is still unfiled, or any contribution, bill, penalty or interest still unpaid, the delinquency days after its due date.
      A delinquent account is returned to active only when every overdue report is filed and taxacct_msr_unpaid_quarter_balance is zero for every overdue quarter; a payment plan or a promise to pay does not cure it.
      An account still delinquent for a missing report on the computation date moves to the delinquent reporting class for the next rate year under taxacct_class_assignment.
    eligibility: []
    params:
      delinquency_trigger_days: "=delinquency_trigger_days"
    measures: [taxacct_msr_unpaid_quarter_balance]

  - id: taxacct_evt_inactivation_closure
    subject: [taxacct_inactivated, taxacct_reactivated, taxacct_closed]
    rule: >-
      An active account is inactivated when taxacct_msr_consecutive_zero_wage_quarters reaches the inactivation quarters, or at once when the employer reports that it temporarily has no employees; an inactive account files no reports.
      Wages resuming within the reactivation window reactivate the same account with its rate and reserve; after the window the employer must register again.
      Closing the account is the employer's own decision: the agent records the closure request and the account closes once the employer confirms it.
      An account is closed only when its final report has been filed and its balance due is zero.
      Closure does not end liability for quarters already worked, and a successor that acquires the business is handled under taxacct_evt_experience_transfer.
    eligibility:
      - id: final_report_and_zero_balance
        applies_to: [taxacct_closed]
        kind: authorization
        condition: "An account is closed only when its final report has been filed and its balance due is zero."
        evidence_fields: [employer_wage_reports.employer_account_id, employer_wage_reports.report_type, employer_accounts.balance_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [employer_wage_reports.employer_account_id]
          action_bindings: {employer_wage_reports.employer_account_id: employer_account_id}
    params:
      inactivation_zero_wage_quarters: "=inactivation_zero_wage_quarters"
      reactivation_window_quarters: "=reactivation_window_quarters"
      closure_final_report_required: "=closure_final_report_required"
      closure_balance_must_be_zero: "=closure_balance_must_be_zero"
    measures: [taxacct_msr_consecutive_zero_wage_quarters]

  - id: taxacct_evt_experience_transfer
    subject: [taxacct_experience_transferred, taxacct_reserve_transfer_received, taxacct_reserve_transfer_sent]
    rule: >-
      When a business is transferred to a successor that shares ownership, management or control with the predecessor, the predecessor's experience - its reserve balance and payroll history - must transfer to the successor; this cannot be waived, so a rate cannot be lowered by moving the workforce to a new entity.
      Without common ownership, a successor acquiring substantially all of the business may apply for the transfer within the transfer application days after the acquisition.
      A transfer moves the whole reserve balance: the predecessor's reserve is debited and the successor's credited by the same amount, and the predecessor then holds no experience.
      The successor's rate is recomputed on the combined experience from the start of the next calendar quarter.
    eligibility: []
    params:
      experience_transfer_common_ownership_mandatory: "=experience_transfer_common_ownership_mandatory"
      experience_transfer_application_days: "=experience_transfer_application_days"
      successor_rate_effective: "=successor_rate_effective"
