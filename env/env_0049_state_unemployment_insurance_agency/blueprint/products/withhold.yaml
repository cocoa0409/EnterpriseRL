events:
  - type: withhold_order_started
    target: withholding_orders
    mutation: create
    meaning: A voluntary election is lodged by the claimant, or an agency deduction order is received, and recorded as requested.
    grain: One row per election or order received.
    fields:
      customer_id: Claimant whose payments are subject.
      claim_id: Claim on which the election was made, or the claim open when the order arrived.
      variant_name: Kind of election or order.
      requested_date: Date the election or order was received.
      effective_date: First payment date to which it applies.
      order_reference: IV-D case number or SNAP claim number, empty for voluntary elections.
      weekly_amount: Weekly amount stated on a child support order, 0.00 otherwise.
      certified_amount: Total to be recovered for an amount-limited order, 0.00 otherwise.
    triggers: []
  - type: withhold_order_activated
    target: withholding_orders
    mutation: {transition: {from: requested, to: active}}
    meaning: The election or order takes effect.
    grain: One transition per order.
    fields:
      status: Set to active.
    triggers: []
  - type: withhold_deduction_taken
    target: withholding_ledger
    meaning: An amount is deducted from one benefit payment under the order and held for remittance.
    grain: One row per order per benefit payment.
    distinguish_by: [source_payment_id]
    fields:
      source_payment_id: Benefit payment the deduction was taken from.
      week_ending_date: Week of that payment.
      deduction_basis_amount: Amount the rate was applied to (gross payable or net after offset).
      amount: Amount deducted, positive.
      entry_date: Date of the payment.
    account: withheld_pending_remittance
    direction: in
    triggers: []
  - type: withhold_deduction_skipped
    target: withholding_ledger
    meaning: A deduction due under the order could not be taken from a payment.
    grain: One row per order per benefit payment skipped.
    distinguish_by: [source_payment_id]
    fields:
      source_payment_id: Benefit payment on which the deduction was skipped.
      week_ending_date: Week of that payment.
      skip_reason: Why the deduction was not taken.
      entry_date: Date of the payment.
    triggers: []
  - type: withhold_remitted
    target: withholding_ledger
    meaning: Amounts withheld under the order in a remittance period are remitted to the payee agency.
    grain: One row per order per remittance period.
    distinguish_by: [remittance_period]
    fields:
      remittance_period: Period whose deductions are remitted.
      amount: Amount remitted, positive.
      entry_date: Date remitted.
    account: withheld_pending_remittance
    direction: out
    triggers: []
  - type: withhold_deduction_refunded
    target: withholding_ledger
    meaning: A deduction taken in error and not yet remitted is refunded to the claimant.
    grain: One row per deduction refunded.
    distinguish_by: [original_deduction_id]
    fields:
      original_deduction_id: The single deduction being refunded.
      refund_reason: Why the deduction was refunded.
      amount: Amount refunded, positive.
      entry_date: Date refunded.
    account: withheld_pending_remittance
    direction: out
    triggers: []
  - type: withhold_order_modified
    target: withholding_orders
    mutation: update
    meaning: An amended order changes the weekly amount or the certified amount.
    grain: One holding update per amendment.
    fields:
      weekly_amount: Amended weekly amount.
      certified_amount: Amended total to be recovered.
      effective_date: First payment date to which the amendment applies.
    triggers: []
  - type: withhold_order_suspended
    target: withholding_orders
    mutation: {transition: {from: active, to: suspended}}
    meaning: The issuing agency suspends the order.
    grain: One transition per suspension.
    fields:
      status: Set to suspended.
    triggers: []
  - type: withhold_order_resumed
    target: withholding_orders
    mutation: {transition: {from: suspended, to: active}}
    meaning: The issuing agency resumes the order.
    grain: One transition per resumption.
    fields:
      status: Set to active.
    triggers: []
  - type: withhold_election_revoked
    target: withholding_orders
    mutation:
      transition:
        - {from: requested, to: revoked}
        - {from: active, to: revoked}
    meaning: The claimant confirms stopping a voluntary election.
    grain: One transition per election.
    fields:
      status: Set to revoked.
      end_date: Last payment date to which the election applied.
    triggers: []
  - type: withhold_order_terminated
    target: withholding_orders
    mutation:
      transition:
        - {from: requested, to: terminated}
        - {from: active, to: terminated}
        - {from: suspended, to: terminated}
    meaning: The order ends because it is satisfied, ended by the issuing agency or its claim closed.
    grain: One transition per order.
    fields:
      status: Set to terminated.
      end_date: Last payment date to which the order applied.
    triggers: []

measures:
  - id: withhold_msr_available_net
    window: One benefit payment.
    measure: Gross payable amount of the payment minus its overpayment offset, minus the deductions already taken from it by orders of higher priority.
  - id: withhold_msr_cumulative_deducted
    window: The life of the order to frozen time.
    measure: Sum of withhold_deduction_taken amount on the order minus withhold_deduction_refunded amount on the order.
  - id: withhold_msr_unremitted_deductions
    window: The order to frozen time.
    measure: withhold_deduction_taken rows on the order whose entry_date falls in a remittance period with no withhold_remitted row yet, net of refunds.
  - id: withhold_msr_election_changes
    window: The benefit year of the claim the election was made on.
    measure: Count of withhold_order_started rows and withhold_election_revoked transitions for voluntary elections of the same kind on that claim.

policies:
  - id: withhold_agg_multi_holding
    subject: [withhold_order_started]
    rule: >-
      A claimant may be subject to several elections and orders at once, so the number of holdings per claimant is not capped overall.
      A new election or order is recorded only when the claimant does not already have the kind's maximum number of orders of the same kind with status requested, active or suspended; for voluntary elections the count is per claim.
      A second election of the same kind on the same claim is never recorded; a change of mind is a revocation followed, where the change limit allows, by a new election.
      How several orders share one payment is decided by withhold_agg_deduction_priority.
    eligibility:
      - id: order_count_per_kind
        applies_to: [withhold_order_started]
        kind: dedup
        condition: "A new election or order is recorded only when the claimant does not already have the kind's maximum number of orders of the same kind with status requested, active or suspended; for voluntary elections the count is per claim."
        evidence_fields: [withholding_orders.customer_id, withholding_orders.claim_id, withholding_orders.variant_name, withholding_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [withholding_orders.customer_id, withholding_orders.variant_name]
          action_bindings: {withholding_orders.customer_id: customer_id, withholding_orders.variant_name: variant_name}
        dedup_contract:
          table: withholding_orders
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [requested, active, suspended]}
          distinct_fields: [claim_id, order_reference]
    params:
      max_per_customer: null
      per_tier:
        Voluntary Federal Income Tax Withholding: {max_orders_per_claimant: "=max_orders_per_claimant"}
        Voluntary State Income Tax Withholding: {max_orders_per_claimant: "=max_orders_per_claimant"}
        Child Support Withholding — Current Support Order: {max_orders_per_claimant: "=max_orders_per_claimant"}
        Child Support Withholding — Arrears-Only Order: {max_orders_per_claimant: "=max_orders_per_claimant"}
        SNAP Overissuance Recovery — Household or Agency Error: {max_orders_per_claimant: "=max_orders_per_claimant"}
        SNAP Overissuance Recovery — Intentional Program Violation: {max_orders_per_claimant: "=max_orders_per_claimant"}
      duplicate_election_allowed: "=duplicate_election_allowed"

  - id: withhold_agg_deduction_priority
    subject: [withhold_deduction_taken, withhold_deduction_skipped]
    rule: >-
      Deductions are taken from each benefit payment after any overpayment offset, one order at a time in the order of the kinds' deduction priority, each from withhold_msr_available_net.
      Every kind's combined cap applies to all of the claimant's orders of that kind together; several child support orders share their combined cap in proportion to their weekly amounts, rounded to the cent, with any rounding remainder going to the order received first.
      A deduction that cannot be taken in full is taken in part where the kind allows partial deductions; otherwise, or when the remaining net is below the kind's minimum net, it is skipped and recorded as skipped with skip_reason insufficient_net.
      A skipped or partial deduction is never made up from a later payment.
      Income tax deductions are computed on the gross payable amount, so their amount does not change with the offset, but they are still taken only from what remains after higher-priority deductions.
    eligibility: []
    params:
      per_tier:
        Voluntary Federal Income Tax Withholding: {deduction_priority: "=deduction_priority", deduction_cap_pct_of_net: "=deduction_cap_pct_of_net", partial_deduction_when_insufficient: "=partial_deduction_when_insufficient", multiple_order_allocation: "=multiple_order_allocation"}
        Voluntary State Income Tax Withholding: {deduction_priority: "=deduction_priority", deduction_cap_pct_of_net: "=deduction_cap_pct_of_net", partial_deduction_when_insufficient: "=partial_deduction_when_insufficient", multiple_order_allocation: "=multiple_order_allocation"}
        Child Support Withholding — Current Support Order: {deduction_priority: "=deduction_priority", deduction_cap_pct_of_net: "=deduction_cap_pct_of_net", partial_deduction_when_insufficient: "=partial_deduction_when_insufficient", multiple_order_allocation: "=multiple_order_allocation"}
        Child Support Withholding — Arrears-Only Order: {deduction_priority: "=deduction_priority", deduction_cap_pct_of_net: "=deduction_cap_pct_of_net", partial_deduction_when_insufficient: "=partial_deduction_when_insufficient", multiple_order_allocation: "=multiple_order_allocation"}
        SNAP Overissuance Recovery — Household or Agency Error: {deduction_priority: "=deduction_priority", deduction_cap_pct_of_net: "=deduction_cap_pct_of_net", partial_deduction_when_insufficient: "=partial_deduction_when_insufficient", multiple_order_allocation: "=multiple_order_allocation"}
        SNAP Overissuance Recovery — Intentional Program Violation: {deduction_priority: "=deduction_priority", deduction_cap_pct_of_net: "=deduction_cap_pct_of_net", partial_deduction_when_insufficient: "=partial_deduction_when_insufficient", multiple_order_allocation: "=multiple_order_allocation"}
      minimum_net_for_deduction: "=minimum_net_for_deduction"
    measures: [withhold_msr_available_net]

  - id: withhold_evt_voluntary_elections
    subject: [withhold_order_started, withhold_order_activated, withhold_election_revoked]
    rule: >-
      Federal and state income tax withholding are voluntary: only the claimant may start or stop them, by the kind's withholding certificate online or on paper, and an agent records the claimant's request rather than deciding it.
      A voluntary election may be started only while the claim it is made on has status filed, active, on_hold or inactive.
      The election applies to payments issued on or after its effective date, which is the effective lead business days after it is recorded, counted in business days (Monday through Friday excluding state holidays); nothing is withheld from payments issued earlier, and no catch-up deduction is taken.
      The claimant may start or stop an election no more than the change limit per benefit year of the claim (withhold_msr_election_changes); a revocation stops deductions from payments issued after the revocation lead business days.
      A voluntary election ends when its claim closes or is withdrawn and does not carry to a later claim; the state rate in force applies from the first payment of each calendar year.
      The year's federal and state withholding is reported on the claim's Form 1099-G in the kind's box.
    eligibility:
      - id: election_on_open_claim
        applies_to: [withhold_order_started]
        kind: state
        condition: "A voluntary election may be started only while the claim it is made on has status filed, active, on_hold or inactive."
        evidence_fields: [claims.claim_id, claims.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims.claim_id]
          action_bindings: {claims.claim_id: claim_id}
        state_contract:
          field: claims.status
          allowed: [filed, active, on_hold, inactive]
    params:
      per_tier:
        Voluntary Federal Income Tax Withholding: {voluntary_election: "=voluntary_election", claimant_can_revoke: "=claimant_can_revoke", max_election_changes_per_benefit_year: "=max_election_changes_per_benefit_year", revocation_lead_business_days: "=revocation_lead_business_days"}
        Voluntary State Income Tax Withholding: {voluntary_election: "=voluntary_election", claimant_can_revoke: "=claimant_can_revoke", max_election_changes_per_benefit_year: "=max_election_changes_per_benefit_year", revocation_lead_business_days: "=revocation_lead_business_days"}
        Child Support Withholding — Current Support Order: {voluntary_election: "=voluntary_election", claimant_can_revoke: "=claimant_can_revoke", max_election_changes_per_benefit_year: "=max_election_changes_per_benefit_year", revocation_lead_business_days: "=revocation_lead_business_days"}
        Child Support Withholding — Arrears-Only Order: {voluntary_election: "=voluntary_election", claimant_can_revoke: "=claimant_can_revoke", max_election_changes_per_benefit_year: "=max_election_changes_per_benefit_year", revocation_lead_business_days: "=revocation_lead_business_days"}
        SNAP Overissuance Recovery — Household or Agency Error: {voluntary_election: "=voluntary_election", claimant_can_revoke: "=claimant_can_revoke", max_election_changes_per_benefit_year: "=max_election_changes_per_benefit_year", revocation_lead_business_days: "=revocation_lead_business_days"}
        SNAP Overissuance Recovery — Intentional Program Violation: {voluntary_election: "=voluntary_election", claimant_can_revoke: "=claimant_can_revoke", max_election_changes_per_benefit_year: "=max_election_changes_per_benefit_year", revocation_lead_business_days: "=revocation_lead_business_days"}
      effective_lead_business_days: "=effective_lead_business_days"
      retroactive_withholding_allowed: "=retroactive_withholding_allowed"
      withholding_certificate: "=withholding_certificate"
      election_channel: "=election_channel"
      ends_on_claim_closure: "=ends_on_claim_closure"
      state_rate_change_effective: "=state_rate_change_effective"
      reported_on_1099g_box: "=reported_on_1099g_box"
      annual_renewal_required: "=annual_renewal_required"
    measures: [withhold_msr_election_changes]

  - id: withhold_evt_agency_orders
    subject: [withhold_order_started, withhold_order_activated, withhold_order_modified, withhold_order_suspended, withhold_order_resumed, withhold_order_terminated]
    rule: >-
      Child support and SNAP deductions are mandatory once the IV-D agency or the SNAP agency sends an order; the claimant cannot stop, suspend or change them, and disputes about the underlying debt are referred to the issuing agency.
      An agency order is recorded only when it carries an IV-D case number or SNAP claim number and, for arrears-only and SNAP orders, a certified total amount.
      The claimant is mailed notice at least the notice days before the first deduction, and the order applies to payments issued on or after the effective lead business days after it is recorded; an amended order applies after the amendment lead business days.
      An order is suspended or resumed only on the issuing agency's notice, and terminated on the agency's notice after the termination lead business days or when its certified amount has been deducted in full.
      Agency orders follow the claimant to payments on later claims and do not end when a claim closes; when a current support obligation ends, any remaining arrears are collected only under a separate arrears-only order.
      Agency orders apply to payments under every program, including supplemental and reissued payments, but nothing is deducted for a waiting week or while no payment is issued.
    eligibility:
      - id: agency_order_reference
        applies_to: [withhold_order_started]
        kind: authorization
        condition: "An agency order is recorded only when it carries an IV-D case number or SNAP claim number and, for arrears-only and SNAP orders, a certified total amount."
        evidence_fields: [withholding_orders.order_reference, withholding_orders.certified_amount, withholding_orders.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [withholding_orders.order_reference]
          action_bindings: {withholding_orders.order_reference: order_reference}
    params:
      per_tier:
        Voluntary Federal Income Tax Withholding: {initiated_by: "=initiated_by", order_reference_required: "=order_reference_required", certified_amount_required: "=certified_amount_required", claimant_notice_days: "=claimant_notice_days", suspension_allowed: "=suspension_allowed", termination_lead_business_days: "=termination_lead_business_days"}
        Voluntary State Income Tax Withholding: {initiated_by: "=initiated_by", order_reference_required: "=order_reference_required", certified_amount_required: "=certified_amount_required", claimant_notice_days: "=claimant_notice_days", suspension_allowed: "=suspension_allowed", termination_lead_business_days: "=termination_lead_business_days"}
        Child Support Withholding — Current Support Order: {initiated_by: "=initiated_by", order_reference_required: "=order_reference_required", certified_amount_required: "=certified_amount_required", claimant_notice_days: "=claimant_notice_days", suspension_allowed: "=suspension_allowed", termination_lead_business_days: "=termination_lead_business_days"}
        Child Support Withholding — Arrears-Only Order: {initiated_by: "=initiated_by", order_reference_required: "=order_reference_required", certified_amount_required: "=certified_amount_required", claimant_notice_days: "=claimant_notice_days", suspension_allowed: "=suspension_allowed", termination_lead_business_days: "=termination_lead_business_days"}
        SNAP Overissuance Recovery — Household or Agency Error: {initiated_by: "=initiated_by", order_reference_required: "=order_reference_required", certified_amount_required: "=certified_amount_required", claimant_notice_days: "=claimant_notice_days", suspension_allowed: "=suspension_allowed", termination_lead_business_days: "=termination_lead_business_days"}
        SNAP Overissuance Recovery — Intentional Program Violation: {initiated_by: "=initiated_by", order_reference_required: "=order_reference_required", certified_amount_required: "=certified_amount_required", claimant_notice_days: "=claimant_notice_days", suspension_allowed: "=suspension_allowed", termination_lead_business_days: "=termination_lead_business_days"}
      amendment_lead_business_days: "=amendment_lead_business_days"
      continues_across_claims: "=continues_across_claims"
      converts_to_arrears_only_on_current_end: "=converts_to_arrears_only_on_current_end"
      applies_to_federal_programs: "=applies_to_federal_programs"
      applies_to_supplemental_payments: "=applies_to_supplemental_payments"
      deduction_on_waiting_week: "=deduction_on_waiting_week"
      deduction_stops_while_claim_on_hold: "=deduction_stops_while_claim_on_hold"
      order_amount_basis: "=order_amount_basis"

  - id: withhold_evt_deduction_amount
    subject: [withhold_deduction_taken, withhold_deduction_skipped]
    rule: >-
      A deduction is taken only while the order status is active, and only from payments issued on or after its effective date.
      A deduction is taken once per order per benefit payment.
      A rate-based deduction is the kind's rate times its deduction basis, raised to the kind's minimum per payment where one applies, rounded to the nearest cent; a child support deduction is the order's weekly amount; either is then limited by withhold_agg_deduction_priority.
      A reissued payment carries the deduction taken from the cancelled original and no second deduction is taken.
      For an amount-limited order the deduction is never more than the certified amount minus withhold_msr_cumulative_deducted, and when the certified amount is reached the order is terminated and any further due deduction is skipped with skip_reason order_limit_reached.
      A payment from which the deduction was skipped is listed for the payee agency where the kind requires it.
    eligibility:
      - id: deduct_on_active_order
        applies_to: [withhold_deduction_taken]
        kind: state
        condition: "A deduction is taken only while the order status is active, and only from payments issued on or after its effective date."
        evidence_fields: [withholding_orders.withholding_order_id, withholding_orders.status, withholding_orders.effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [withholding_orders.withholding_order_id]
          action_bindings: {withholding_orders.withholding_order_id: withholding_order_id}
        state_contract:
          field: withholding_orders.status
          allowed: [active]
      - id: once_per_payment
        applies_to: [withhold_deduction_taken, withhold_deduction_skipped]
        kind: dedup
        condition: "A deduction is taken once per order per benefit payment."
        evidence_fields: [withholding_ledger.withholding_order_id, withholding_ledger.source_payment_id, withholding_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [withholding_ledger.withholding_order_id, withholding_ledger.source_payment_id]
          action_bindings: {withholding_ledger.withholding_order_id: withholding_order_id, withholding_ledger.source_payment_id: source_payment_id}
        dedup_contract:
          table: withholding_ledger
          mode: separate_record
          object_bindings: {withholding_order_id: withholding_order_id, source_payment_id: source_payment_id}
          duplicate_filters: {event_type: [withhold_deduction_taken, withhold_deduction_skipped]}
          distinct_fields: []
    params:
      per_tier:
        Voluntary Federal Income Tax Withholding: {deduction_rate: "=deduction_rate", deduction_minimum_per_payment: "=deduction_minimum_per_payment", deduction_basis: "=deduction_basis", order_limit_basis: "=order_limit_basis", skip_reported_to_payee: "=skip_reported_to_payee"}
        Voluntary State Income Tax Withholding: {deduction_rate: "=deduction_rate", deduction_minimum_per_payment: "=deduction_minimum_per_payment", deduction_basis: "=deduction_basis", order_limit_basis: "=order_limit_basis", skip_reported_to_payee: "=skip_reported_to_payee"}
        Child Support Withholding — Current Support Order: {deduction_rate: "=deduction_rate", deduction_minimum_per_payment: "=deduction_minimum_per_payment", deduction_basis: "=deduction_basis", order_limit_basis: "=order_limit_basis", skip_reported_to_payee: "=skip_reported_to_payee"}
        Child Support Withholding — Arrears-Only Order: {deduction_rate: "=deduction_rate", deduction_minimum_per_payment: "=deduction_minimum_per_payment", deduction_basis: "=deduction_basis", order_limit_basis: "=order_limit_basis", skip_reported_to_payee: "=skip_reported_to_payee"}
        SNAP Overissuance Recovery — Household or Agency Error: {deduction_rate: "=deduction_rate", deduction_minimum_per_payment: "=deduction_minimum_per_payment", deduction_basis: "=deduction_basis", order_limit_basis: "=order_limit_basis", skip_reported_to_payee: "=skip_reported_to_payee"}
        SNAP Overissuance Recovery — Intentional Program Violation: {deduction_rate: "=deduction_rate", deduction_minimum_per_payment: "=deduction_minimum_per_payment", deduction_basis: "=deduction_basis", order_limit_basis: "=order_limit_basis", skip_reported_to_payee: "=skip_reported_to_payee"}
      deduction_rounding: "=deduction_rounding"
      reissue_deduction_rule: "=reissue_deduction_rule"
    formula:
      rate_deduction: "round(max(deduction_rate * deduction_basis_amount, deduction_minimum_per_payment), 2)"
      limited_deduction: "min(rate_deduction, certified_amount - withhold_msr_cumulative_deducted)"
    measures: [withhold_msr_cumulative_deducted]

  - id: withhold_evt_remittance
    subject: [withhold_remitted]
    rule: >-
      Amounts withheld are remitted to the kind's payee agency on the kind's remittance schedule, no later than the remittance business days after the end of each remittance period, with the kind's remittance report.
      A remittance period is remitted once per order.
      The remitted amount is the deductions taken in the period less any refunded before remittance, so that withheld_pending_remittance for the period returns to zero; a payment listed with a skipped deduction is reported where the kind requires it.
      Federal withholding is deposited through EFTPS and reported on Form 945, so a claimant asking about a federal deposit is told it is reported on Form 1099-G rather than on a W-2.
    eligibility:
      - id: remit_once_per_period
        applies_to: [withhold_remitted]
        kind: dedup
        condition: "A remittance period is remitted once per order."
        evidence_fields: [withholding_ledger.withholding_order_id, withholding_ledger.remittance_period, withholding_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [withholding_ledger.withholding_order_id, withholding_ledger.remittance_period]
          action_bindings: {withholding_ledger.withholding_order_id: withholding_order_id, withholding_ledger.remittance_period: remittance_period}
        dedup_contract:
          table: withholding_ledger
          mode: separate_record
          object_bindings: {withholding_order_id: withholding_order_id, remittance_period: remittance_period}
          duplicate_filters: {event_type: [withhold_remitted]}
          distinct_fields: []
    params:
      per_tier:
        Voluntary Federal Income Tax Withholding: {payee_agency: "=payee_agency", remittance_schedule: "=remittance_schedule", remittance_max_business_days: "=remittance_max_business_days", remittance_report_form: "=remittance_report_form"}
        Voluntary State Income Tax Withholding: {payee_agency: "=payee_agency", remittance_schedule: "=remittance_schedule", remittance_max_business_days: "=remittance_max_business_days", remittance_report_form: "=remittance_report_form"}
        Child Support Withholding — Current Support Order: {payee_agency: "=payee_agency", remittance_schedule: "=remittance_schedule", remittance_max_business_days: "=remittance_max_business_days", remittance_report_form: "=remittance_report_form"}
        Child Support Withholding — Arrears-Only Order: {payee_agency: "=payee_agency", remittance_schedule: "=remittance_schedule", remittance_max_business_days: "=remittance_max_business_days", remittance_report_form: "=remittance_report_form"}
        SNAP Overissuance Recovery — Household or Agency Error: {payee_agency: "=payee_agency", remittance_schedule: "=remittance_schedule", remittance_max_business_days: "=remittance_max_business_days", remittance_report_form: "=remittance_report_form"}
        SNAP Overissuance Recovery — Intentional Program Violation: {payee_agency: "=payee_agency", remittance_schedule: "=remittance_schedule", remittance_max_business_days: "=remittance_max_business_days", remittance_report_form: "=remittance_report_form"}
      remittance_includes_skipped_detail: "=remittance_includes_skipped_detail"
      payee_balance_reporting: "=payee_balance_reporting"

  - id: withhold_evt_refund
    subject: [withhold_deduction_refunded]
    rule: >-
      A deduction taken in error - from a payment issued before the election or order took effect, after it was revoked or terminated, beyond a certified amount, or above the kind's cap - is refunded to the claimant by the agency within the refund business days.
      A deduction is refunded by the agency only while it is listed in withhold_msr_unremitted_deductions.
      Once remitted, the agency does not refund it: the claimant recovers it through the kind's after-remittance route (for income tax, as a credit on the tax return using the Form 1099-G amount).
      A deduction is refunded only once, for its full amount.
    eligibility:
      - id: refund_before_remittance
        applies_to: [withhold_deduction_refunded]
        kind: authorization
        condition: "A deduction is refunded by the agency only while it is listed in withhold_msr_unremitted_deductions."
        evidence_fields: [withholding_ledger.withholding_entry_id, withholding_ledger.entry_date, withholding_ledger.remittance_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [withholding_ledger.withholding_entry_id]
          action_bindings: {withholding_ledger.withholding_entry_id: original_deduction_id}
      - id: refund_once
        applies_to: [withhold_deduction_refunded]
        kind: dedup
        condition: "A deduction is refunded only once, for its full amount."
        evidence_fields: [withholding_ledger.original_deduction_id, withholding_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [withholding_ledger.original_deduction_id]
          action_bindings: {withholding_ledger.original_deduction_id: original_deduction_id}
        dedup_contract:
          table: withholding_ledger
          mode: separate_record
          object_bindings: {original_deduction_id: original_deduction_id}
          duplicate_filters: {event_type: [withhold_deduction_refunded]}
          distinct_fields: []
    params:
      refund_business_days: "=refund_business_days"
      refund_after_remittance_route: "=refund_after_remittance_route"
    measures: [withhold_msr_unremitted_deductions]

  - id: withhold_order_closure
    subject: [withhold_order_terminated, withhold_election_revoked]
    rule: >-
      An election or order ends in one of four ways, each recording the last payment date it applied to in end_date.
      A voluntary election whose claim closes or is withdrawn is terminated with end_date the last payment issued on that claim.
      An amount-limited order is terminated when withhold_msr_cumulative_deducted reaches its certified amount, with end_date the payment date of the deduction that completed it.
      An order ended by the issuing agency is terminated with end_date the last payment issued before the termination lead business days ran out.
      A voluntary election stopped by the claimant is revoked with end_date the last payment issued before the revocation lead business days ran out; a revocation confirmed before the election took effect leaves no payment affected.
      A terminated or revoked holding is never reactivated: a later deduction needs a new election or a new order.
    eligibility: []
    params:
      ends_on_claim_closure: "=ends_on_claim_closure"
      termination_lead_business_days: "=termination_lead_business_days"
      revocation_lead_business_days: "=revocation_lead_business_days"
    measures: [withhold_msr_cumulative_deducted]
