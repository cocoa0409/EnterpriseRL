# Policy charter: Benefit Withholding and Deduction Orders (claimant side).
# One holding = one voluntary income tax election or one agency deduction order applied to a claimant's benefit payments.
category: withhold
display_name: Benefit Withholding and Deduction Orders

binding:
  holding_table: withholding_orders
  event_tables: [withholding_ledger]
  intake_tables: [withholding_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [requested, active, suspended, revoked, terminated]
  transitions:
    - {from: requested, to: active, by: system, means: The election or order reaches its effective date and applies to payments issued from then on.}
    - {from: active, to: suspended, by: agent, means: The issuing agency's notice suspends an order.}
    - {from: suspended, to: active, by: agent, means: The issuing agency's notice resumes a suspended order.}
    - {from: requested, to: revoked, by: user, means: The claimant confirms stopping a voluntary election before it took effect.}
    - {from: active, to: revoked, by: user, means: The claimant confirms stopping a voluntary election.}
    - {from: requested, to: terminated, by: agent, means: An order is withdrawn by the issuing agency before it took effect.}
    - {from: active, to: terminated, by: agent, means: The order is satisfied, ended by the issuing agency, or ends with its claim.}
    - {from: suspended, to: terminated, by: agent, means: A suspended order is ended by the issuing agency.}

accounts:
  - key: withheld_pending_remittance
    unit: USD
    meaning: Amounts deducted from benefit payments and held by the agency until remitted to the payee agency or refunded to the claimant.

parameter_schema:
  deduction_rate: "Share of the deduction basis withheld from each payment (decimal); 0 means the order states a fixed weekly amount"
  deduction_minimum_per_payment: "Smallest deduction taken from a payment when the rate yields less (USD per payment); 0.00 means no minimum"
  deduction_cap_pct_of_net: "Cap on all deductions of this kind combined, as a share of the net payable after overpayment offset (decimal)"
  deduction_priority: "Order in which deductions are taken from one payment, 1 first (rank)"
  deduction_basis: "Amount the rate is applied to (enum: gross_payable before overpayment offset, or net_after_offset)"
  voluntary_election: "Whether the deduction exists only by the claimant's own election (boolean)"
  initiated_by: "Party whose instruction creates the order (enum)"
  payee_agency: "Agency to which amounts withheld are remitted (enum)"
  remittance_schedule: "Schedule on which amounts withheld are remitted (enum)"
  remittance_max_business_days: "Latest business day after the end of the remittance period by which the period's withholding is remitted (business days)"
  remittance_report_form: "Report filed with the remittance (enum)"
  effective_lead_business_days: "Business days after the election or order is recorded before it applies to payments issued (business days)"
  amendment_lead_business_days: "Business days after an amended order or changed election is recorded before the new amount applies (business days)"
  revocation_lead_business_days: "Business days after a revocation is confirmed before deductions stop (business days); 0 means not revocable"
  max_election_changes_per_benefit_year: "Starts and stops of a voluntary election allowed per benefit year of the claim (count); 0 means not an election"
  retroactive_withholding_allowed: "Whether a deduction may be taken for payments issued before the effective date (boolean)"
  claimant_can_revoke: "Whether the claimant may stop the deduction (boolean)"
  election_channel: "How the order or election is received (enum)"
  order_reference_required: "Whether an IV-D case number or SNAP claim number must be on the order (boolean)"
  certified_amount_required: "Whether the order must state a total amount to be recovered (boolean)"
  order_limit_basis: "What ends deductions by amount (enum: none or certified_amount)"
  max_orders_per_claimant: "Orders of this kind a claimant may have active or requested at once (count)"
  multiple_order_allocation: "How the combined cap is shared among several orders of the same kind (enum)"
  continues_across_claims: "Whether the order follows the claimant to payments on a later claim (boolean)"
  ends_on_claim_closure: "Whether the order ends when the claim it was made on closes or is withdrawn (boolean)"
  claimant_notice_days: "Calendar days before the first deduction that the claimant is mailed notice of an agency order (days); 0 means no notice period"
  suspension_allowed: "Whether the order may be suspended on the issuing agency's notice (boolean)"
  termination_lead_business_days: "Business days after the issuing agency's termination notice before deductions stop (business days); 0 means immediately on the next payment"
  converts_to_arrears_only_on_current_end: "Whether ending the current support obligation leaves an arrears-only order to be received separately (boolean)"
  deduction_rounding: "Rounding of each deduction (enum: nearest_cent)"
  partial_deduction_when_insufficient: "Whether a deduction is taken in part when the remaining net is below the computed amount (boolean)"
  minimum_net_for_deduction: "Smallest remaining net from which a deduction is taken at all (USD); 0.00 means any amount"
  applies_to_federal_programs: "Whether payments under UCFE, UCX, EB, TRA and DUA are subject to the deduction (boolean)"
  applies_to_supplemental_payments: "Whether supplemental and reissued payments are subject to the deduction (boolean)"
  reissue_deduction_rule: "How a reissued payment is treated when its cancelled original had a deduction (enum: deduction_carried_not_retaken)"
  refund_business_days: "Business days to refund a deduction taken in error before it was remitted (business days)"
  refund_after_remittance_route: "Where a claimant recovers a deduction already remitted (enum)"
  reported_on_1099g_box: "Form 1099-G box in which the year's deductions are reported (box number); 0 means not reported"
  duplicate_election_allowed: "Whether a second election of the same kind may stand on the same claim (boolean)"
  annual_renewal_required: "Whether the election or order must be renewed each benefit year (boolean)"
  skip_reported_to_payee: "Whether a payment from which the deduction could not be taken is reported to the payee agency (boolean)"
  deduction_on_waiting_week: "Whether anything is deducted for a waiting week (boolean)"
  withholding_certificate: "Certificate the claimant completes for a voluntary election (enum)"
  state_rate_change_effective: "When a change in the state withholding rate takes effect (enum)"
  order_amount_basis: "How the order states its amount (enum)"
  payee_balance_reporting: "How the payee agency reports the remaining balance of an amount-limited order (enum)"
  deduction_stops_while_claim_on_hold: "Whether deductions pause while the claim is on hold because no payment is issued (boolean)"
  remittance_includes_skipped_detail: "Whether the remittance report lists payments with skipped deductions (boolean)"

