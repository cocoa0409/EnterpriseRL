- id: appeal_evt_decision
  subject:
  - appeal_decision_issued
  rule: The decision affirms, reverses or modifies the appealed determination, or, on the Board of Review only, remands it for a new hearing; it applies the docket's burden and standard of proof, and when only the other party is absent the decision rests on the evidence presented. Decisions are targeted within the docket's decision target days after filing. Where the docket pays when due, benefits are paid for weeks the decision finds payable as soon as it is issued, even if the other party appeals further, provided the claimant certified those weeks; if a later decision reverses it, the benefits paid become an appeal-reversal overpayment. A decision reversing an overpayment determination cancels the overpayment and one affirming it resumes recovery; a decision reversing a denial of charge relief relieves the employer's charges; a decision reversing or modifying a contribution rate causes a corrected rate notice, with contributions already paid above the corrected rate credited to the employer's account.
