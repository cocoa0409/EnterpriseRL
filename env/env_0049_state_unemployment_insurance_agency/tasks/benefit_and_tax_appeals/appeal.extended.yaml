- id: appeal_evt_filing
  subject:
  - appeal_filed
  - appeal_dismissed
  rule: An appeal must be in writing and filed through the online portal, by mail or by fax; a request made only by phone is not an appeal, and there is no filing fee. An appeal is timely only when it is filed no later than the filing deadline after the mailing date of the appealed determination or decision. The deadline is counted in calendar days starting the day after the mailing date; when the last day falls on a Saturday, Sunday or state holiday the deadline moves to the next business day, and the filing date is the postmark, fax or online submission date. A late appeal is still filed when the appellant states good cause in late_filing_reason, and it is heard on good cause and the merits together; a late appeal filed after the late appeal limit, or with no good cause stated, is dismissed as untimely. The appellant receives an acknowledgment with the docket number within the acknowledgment business days. While a claimant's appeal is pending the claimant must keep certifying each week where the docket requires it, or weeks won on appeal cannot be paid; an appeal of an overpayment determination suspends its recovery, and an employer appealing a contribution rate keeps paying at the appealed rate.
