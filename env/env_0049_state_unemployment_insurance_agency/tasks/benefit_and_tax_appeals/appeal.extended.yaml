  target_tool: reopen_dismissed_appeal_6a7f532d
  params:
    current_account_window_days: 10
    paying_account_window_days: 17
    paid_contribution_floor: 2500.0
    two_late_exhibit_days: 7
    one_late_exhibit_days: 4
