      anchor_source: appeals.determination_mailed_date
      relation: not_after
      duration_source: variants.filing_deadline_days
      unit: calendar_days
      counting_rule: The deadline is counted in calendar days starting the day after the mailing date; when the last day falls on a Saturday, Sunday or state holiday the deadline moves to the next business day, and the filing date is the postmark, fax or online submission date.
      boundary: inclusive
