- id: appeal_agg_linked_dockets
  subject:
  - appeal_filed
  - appeal_hearing_scheduled
  rule: Appeals are linked across dockets and levels. A Board of Review appeal may be filed only against a lower-authority appeal that has been decided, and it names that appeal in parent_appeal_id; a dismissed lower-authority appeal reaches the Board only after its reopening was denied. Appeals of the same parties that arise from the same facts - a separation decision and the overpayment it created, or a benefit charge and the separation behind it - are heard together on one hearing date where the dockets allow consolidation, and the decision on the earlier issue governs the later one. When hearing slots are short, dockets are scheduled in the order of their scheduling priority.
