category: appeal
display_name: Unemployment Insurance Appeals
binding:
  holding_table: appeals
  event_tables:
  - appeal_events
  intake_tables:
  - appeal_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - filed
  - scheduled
  - decided
  - withdrawn
  - dismissed
  - closed
  transitions:
  - from: filed
    to: scheduled
    by: agent
    means: The appeal is docketed and its first hearing is set.
  - from: dismissed
    to: scheduled
    by: agent
    means: Reopening of a dismissed appeal is granted and a hearing is set.
  - from: scheduled
    to: decided
    by: system
    means: The hearing officer issues a decision after the hearing.
  - from: filed
    to: decided
    by: system
    means: The Board of Review issues a decision on the record without a hearing.
  - from: filed
    to: dismissed
    by: system
    means: The appeal is dismissed as untimely without good cause.
  - from: scheduled
    to: dismissed
    by: system
    means: The appeal is dismissed because the appellant did not appear.
  - from: filed
    to: withdrawn
    by: user
    means: The appellant confirms withdrawal before a hearing is set.
  - from: scheduled
    to: withdrawn
    by: user
    means: The appellant confirms withdrawal before the decision.
  - from: decided
    to: closed
    by: system
    means: The time to appeal the decision further passed
    or a further appeal was filed.: null
  - from: withdrawn
    to: closed
    by: system
    means: The withdrawal is final.
  - from: dismissed
    to: closed
    by: system
    means: The reopening window passed without a granted reopening.
accounts: []
parameter_schema:
  filing_deadline_days: Calendar days after the mailing date of the appealed determination or decision within which the appeal must be filed (days)
  filing_deadline_anchor: Mailing date the filing deadline is counted from (enum)
  timeliness_basis: Date that counts as the filing date (enum)
  filing_channels: Channels through which an appeal may be filed; an appeal must be in writing (list)
  filing_fee: Fee to file an appeal (USD)
  appeals_per_party_per_determination: Appeals one party may have open against the same determination or decision (count)
  late_appeal_good_cause_accepted: Whether an appeal filed after the deadline may proceed on a finding of good cause (boolean)
  late_appeal_max_days: Calendar days after the filing deadline beyond which a late appeal is never accepted (days)
  filing_acknowledgment_business_days: Business days after filing within which an acknowledgment with the docket number is mailed (business days)
  hearing_held: Whether an evidentiary hearing is held (boolean); false means the decision is made on the record
  default_hearing_mode: Hearing mode used unless another is granted (enum)
  in_person_on_request: Whether a party may ask for an in-person hearing (boolean)
  hearing_notice_min_days: Minimum calendar days between the mailing of the hearing notice and the hearing date (days); 0 means no hearing
  scheduling_target_days: Calendar days after filing within which the first hearing is set (days); 0 means no hearing
  hearing_length_minutes: Time scheduled for the hearing (minutes); 0 means no hearing
  hearing_call_wait_minutes: Minutes after the scheduled start the hearing officer waits for a party to answer before proceeding without it (minutes)
  phone_registration_business_days: Business days before the hearing by which a party must register the number at which it will be called (business days)
  interested_parties: Parties notified and entitled to take part (enum)
  burden_of_proof: Party that must prove the disputed fact (enum)
  standard_of_proof: Standard the evidence must meet (enum)
  postponement_request_min_business_days: Business days before the hearing by which a non-emergency postponement must be requested (business days); 0 means no hearing
  postponement_emergency_exception: Whether a documented emergency allows a postponement requested later (boolean)
  max_postponements_per_party: Postponements one party may receive on one appeal (count)
  reschedule_window_days: Calendar days after a granted postponement within which the hearing is reset (days); 0 means no hearing
  exhibit_deadline_business_days: Business days before the hearing by which documentary exhibits must be received (business days); 0 means no hearing
  late_exhibit_admission: Treatment of an exhibit received after the deadline (enum)
  written_argument_days: Calendar days after filing within which written argument may be submitted (days); 0 means not applicable
  subpoena_request_min_business_days: Business days before the hearing by which a subpoena must be requested (business days); 0 means no hearing
  interpreter_provided_free: Whether an interpreter is provided at no cost on request (boolean)
  representation_allowed: Who may represent a party (enum)
  free_legal_aid_referral: Whether the claimant is given a referral to free legal aid (boolean)
  reopening_request_days: Calendar days after the dismissal is mailed within which reopening must be requested (days)
  reopening_good_cause_required: Whether reopening requires good cause for the missed hearing or late filing (boolean)
  reopening_hearing_combined: Whether good cause for reopening and the merits are heard at the same hearing (boolean)
  appellant_absence_result: Result when the appellant does not appear (enum)
  respondent_absence_result: Result when only the other party does not appear (enum)
  withdrawal_allowed_until: Latest point at which the appellant may withdraw (enum)
  continue_certifying_required: Whether the claimant must keep certifying weekly while the appeal is pending to be paid for those weeks if they win (boolean)
  pay_when_due_after_favorable_decision: Whether benefits are paid once a decision favors the claimant even if the other party appeals further (boolean)
  recovery_suspended_while_pending: Whether recovery of the appealed overpayment stops while the appeal is pending (boolean)
  contributions_payable_while_pending: Whether the employer must keep paying contributions at the appealed rate while the appeal is pending, with any reduction credited after a favorable decision (boolean)
  consolidated_hearing_allowed: Whether related appeals of the same parties may be heard together (boolean)
  scheduling_priority_rank: Order in which dockets are scheduled when hearing slots are short, 1 first (rank)
  decision_target_days: Calendar days after filing within which the decision is targeted (days)
  remand_allowed: Whether the decision may send the case back for a new hearing (boolean)
  next_level: Body to which the decision may be appealed (enum)
  court_review_deadline_days: Calendar days after the Board decision is mailed to seek court review (days); 0 means not applicable
  notice_delivery: How hearing notices and decisions are delivered (enum)
