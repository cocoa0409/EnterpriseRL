  - account_payments_three_months: XSUM('taxacct', 'employer_tax_ledger', 'amount', within_months=3, date_field='entry_date', employer_account_id=F('employer_account_id'), event_type='taxacct_payment_received')
  - latest_report_filed_date: XLATEST('taxacct', 'employer_wage_reports', 'filed_date', date_field='quarter', employer_account_id=F('employer_account_id'))
  - latest_report_due_date: XLATEST('taxacct', 'employer_wage_reports', 'due_date', date_field='quarter', employer_account_id=F('employer_account_id'))
  - reopened_window_days: K('current_account_window_days') if (F('appellant_role') == 'employer' and account_payments_three_months >= K('paid_contribution_floor') and latest_report_filed_date != None and latest_report_filed_date <= latest_report_due_date) else (K('paying_account_window_days') if (F('appellant_role') == 'employer' and account_payments_three_months >= K('paid_contribution_floor') and latest_report_filed_date != None and latest_report_filed_date > latest_report_due_date) else P('reschedule_window_days'))
  - late_exhibit_count: COUNT('appeal_events', event_type='appeal_exhibit_received', exhibit_status='late')
  - reopened_exhibit_exchange: K('two_late_exhibit_days') if late_exhibit_count >= 2 else (K('one_late_exhibit_days') if late_exhibit_count == 1 else 0)
  - reopened_interpreter_language: LATEST('appeal_events', 'language', date_field='request_date', event_type='appeal_interpreter_requested')
  - reopened_interpreter_lead: K('sign_language_reset_lead_days') if reopened_interpreter_language == 'american_sign_language' else (K('contract_interpreter_reset_lead_days') if (reopened_interpreter_language != None and reopened_interpreter_language != 'spanish') else 0)
  - granted_subpoena_count: COUNT('appeal_requests', request_type='subpoena', request_status='granted')
  - reopened_subpoena_reissue: K('two_subpoena_reissue_days') if granted_subpoena_count >= 2 else (K('one_subpoena_reissue_days') if granted_subpoena_count == 1 else 0)
  - reopened_hearing_offset: MX(P('hearing_notice_min_days'), reopened_clock_offset + reopened_window_days + reopened_exhibit_exchange + reopened_interpreter_lead + reopened_subpoena_reissue)
  - reopened_hearing_weekday: (DAYS('2026-01-05', NOW) + reopened_hearing_offset) % 7
  - result: reopened_hearing_offset + (2 if reopened_hearing_weekday == 5 else (1 if reopened_hearing_weekday == 6 else 0))
