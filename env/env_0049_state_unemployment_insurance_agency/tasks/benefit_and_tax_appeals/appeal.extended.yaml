- id: appeal_evt_postponement
  subject:
  - appeal_postponement_decided
  rule: A party may ask to postpone a set hearing. A non-emergency postponement is granted only when it is requested no later than the postponement lead business days before the hearing date. The lead time is counted backward in business days (Monday through Friday excluding state holidays) from the hearing date, so a request received on the last business day of the lead time is in time and a later one is not. A later request is granted only for a documented emergency. A party receives no more postponements on one appeal than the docket's maximum (appeal_msr_postponements_by_party); a request beyond it is denied. A granted postponement resets the hearing within the reschedule window, with a new notice that again meets the notice minimum days. A party who simply does not appear has not been granted a postponement and is handled under appeal_evt_default_and_reopening.
