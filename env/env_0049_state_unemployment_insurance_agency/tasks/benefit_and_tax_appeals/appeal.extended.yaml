    one_subpoena_reissue_days: 7
  rule: When the appeals office grants an appellant's timely reopening request on a dismissed appeal, it marks the request granted, sets the reopened hearing by telephone, mails the hearing notice today and notifies every interested party of the docket; the reopened-setting notice period is the number of calendar days from today, the day the notice is mailed, to the reopened hearing date. A reopening request is timely when it is received no later than the docket's reopening window after the mailing date of the dismissal, and the appeal record carries the dismissal's mailing date as its decision mailing date. The reopened hearing date is the date that falls the reopened-setting window's number of calendar days after the day the reopened-setting clock starts. The reopened-setting clock starts on the date the reopening request was received. The reopened-setting window is the docket's reschedule window days. When the reopened hearing date found this way is fewer than the docket's notice minimum days after today, the reopened hearing is set the notice minimum days after today instead. A reopened hearing date that falls on a Saturday or a Sunday moves to the following Monday. The reopened-setting clock starts on the date the latest medical statement exhibit was received on the appeal when the latest reopening request states illness or injury and such an exhibit stands received; it starts today when the latest reopening request states that the appellant did not receive the hearing notice; and it starts on the date the latest reopening request was received in every other case. Before a reopened hearing on an employer's appeal the tax unit certifies the employer's account to the hearing officer, and an account that is paid up and reporting is certified without a review, so its reopened hearing is set on a shorter window. The reopened-setting window is the current-account window days for an employer appellant whose tax account recorded payments received of at least the paid-contribution floor in the three months before today and whose latest quarterly contribution and wage report was filed on or before its due date; it is the paying-account window days for an employer appellant whose tax account recorded payments received of at least the paid-contribution floor in those three months and whose latest quarterly report was filed after its due date; and it is the docket's reschedule window days for an employer appellant meeting neither condition and for a claimant appellant. Payments received are the payments recorded as received on the account; voluntary contributions are not payments received for this purpose. The three months before today cover the dates later than the same day of the month three months before today, up to and including today. The reopened-setting exhibit exchange days are the two-late-exhibit exchange days when two or more exhibits on the appeal stand recorded as late, the one-late-exhibit exchange days when exactly one does, and zero days when none does. The reopened-setting interpreter lead is the sign-language reset lead days when the latest interpreter request on the appeal is for American Sign Language, the contract-interpreter reset lead days when the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish, and zero days when the latest interpreter request is for Spanish or no interpreter is requested. The reopened-setting subpoena reissue days are the two-subpoena reissue days when two or more subpoena requests on the appeal stand granted, the one-subpoena reissue days when exactly one does, and zero days when none does. The reopened-setting exhibit exchange days, the reopened-setting interpreter lead and the reopened-setting subpoena reissue days are added together, and the reopened hearing date found from the reopened-setting clock and the reopened-setting window is moved later by that sum before the notice minimum and the weekend rule are applied.
