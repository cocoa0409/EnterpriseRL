    cross_difficulty: null
  baseline:
    rule: When the appeals office grants an appellant's timely reopening request on a dismissed appeal, it marks the request granted, sets the reopened hearing by telephone, mails the hearing notice today and notifies every interested party of the docket; the reopened-setting notice period is the number of calendar days from today, the day the notice is mailed, to the reopened hearing date. The reopened hearing date is the date that falls the reopened-setting window's number of calendar days after the day the reopened-setting clock starts. The reopened-setting clock starts on the date the reopening request was received. The reopened-setting window is the docket's reschedule window days. When the reopened hearing date found this way is fewer than the docket's notice minimum days after today, the reopened hearing is set the notice minimum days after today instead. A reopened hearing date that falls on a Saturday or a Sunday moves to the following Monday.
    params:
    - reschedule_window_days
    - hearing_notice_min_days
  inputs:
    history:
    - table: appeal_requests
      aggregate: latest
      field: request_date
      filters:
        request_type: reopening
    - table: appeal_events
      aggregate: count
      field: appeal_event_id
      filters:
        event_type: appeal_exhibit_received
        exhibit_status: late
    - table: appeal_requests
      aggregate: count
      field: appeal_request_id
      filters:
        request_type: subpoena
        request_status: granted
    - category: taxacct
      table: employer_tax_ledger
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: taxacct_payment_received
    - category: taxacct
      table: employer_wage_reports
      aggregate: latest
      field: filed_date
      filters: {}
    cross_category:
    - taxacct
- id: appeal_ext_in_person_session
  base_policy_refs:
  - appeal_evt_scheduling
  - appeal_agg_linked_dockets
  - appeal_evt_postponement
  overwrite:
  - base_policy: appeal_evt_postponement
    superseded_clause: A party may ask to postpone a set hearing.
    replaced_by: A party may ask to postpone a set hearing, and the postponement rules, with their lead time, per-party maximum and reschedule window, govern that request; a party's request to hold its set hearing as an in-person session instead is a change of hearing mode and is not a request to postpone.
  trigger: on_request
  subject:
  - appeal_hearing_scheduled
  computes: session_days
  target_tool: book_in_person_hearing_session_05d44a0a
  params:
    standard_room_block_days: 4
    short_room_block_days: 6
    long_room_block_days: 12
    long_session_minutes: 60
    exhibit_threshold: 3
    on_site_sign_language_days: 5
    on_site_contract_interpreter_days: 3
    two_subpoena_appearance_days: 4
    one_subpoena_appearance_days: 2
    large_room_employee_count: 100
    large_room_with_witness_days: 5
    large_room_days: 2
    deficit_review_ratio: -0.04
    high_rate_floor: 0.06
    senior_tax_calendar_days: 5
    deficit_calendar_days: 2
  rule: 'A party who asks for an in-person hearing where the docket allows it books the in-person session itself on the calendar of the Department hearing office, and the session replaces the telephone setting on the appeal as a change of hearing mode made at that party''s request. A party may ask to postpone a set hearing, and the postponement rules, with their lead time, per-party maximum and reschedule window, govern that request; a party''s request to hold its set hearing as an in-person session instead is a change of hearing mode and is not a request to postpone. A change of hearing mode booked as an in-person session is not a postponement: it needs no postponement request or decision, is not subject to the postponement lead time, does not count toward the party''s postponements and is not held to the reschedule window; its date is the in-person session date this section gives. An in-person session is not booked on a dismissed appeal until the appeal stands reopened at scheduled status with its reopened hearing date on record. The in-person session notice period is the number of calendar days from today, the day the party books the session and its notice is mailed, to the in-person session date. The in-person session date is the set hearing date moved later by the room block gap. The room block gap is the standard room block days. An in-person session date that falls on a Saturday or a Sunday moves to the following Monday. The room block gap is the long room block days when at least the exhibit threshold of exhibits submitted by the appellant stand received on the appeal and the docket''s hearing length is at least the long session minutes, the short room block days when at least the exhibit threshold of such exhibits stand received and the docket''s hearing length is shorter than the long session minutes, and the standard room block days when fewer than the exhibit threshold of exhibits submitted by the appellant stand received. The on-site interpreter days are the on-site sign-language days when the latest interpreter request on the appeal is for American Sign Language, the on-site contract-interpreter days when the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish, and zero days when the latest interpreter request is for Spanish or no interpreter is requested. The witness appearance days are the two-subpoena appearance days when two or more subpoena requests on the appeal stand granted, the one-subpoena appearance days when exactly one does, and zero days when none does. The large hearing room days are the large-room-with-witness days for an appellant whose latest quarterly contribution and wage report counts at least the large-room employee count on the reference day of the quarter''s third month and whose appeal has at least one granted subpoena request, the large-room days for an appellant whose latest quarterly report counts at least the large-room employee count and whose appeal has no granted subpoena request, and zero days for an appellant whose latest quarterly report counts fewer employees or who files no quarterly report. The tax calendar days are the senior tax calendar days when the appellant''s tax account shows a reserve ratio below the deficit-review ratio and a contribution rate at or above the high-rate floor, the deficit calendar days when that account shows a reserve ratio below zero and a contribution rate below the high-rate floor, and zero days in every other case, including an appellant with no tax account. On the Employer Contribution Rate and the Employer Benefit Charge dockets an in-person session date moves to the first Wednesday on or after the date found; on the Separation Issue and the Able and Available Issue dockets it moves to the first Tuesday or Thursday on or after that date; and on any other docket an in-person session date that falls on a Saturday or a Sunday moves to the following Monday. The on-site interpreter days, the witness appearance days, the large hearing room days and the tax calendar days are added to the room block gap, the set hearing date is moved later by that total, and the calendar-day rule is applied to the date that results.'
  prerequisite:
  - problem: appeal_ext_reopened_hearing_setting
    kind: value_input
    gate: in_person_set_days
    form: state
    policy_source: An in-person session is not booked on a dismissed appeal until the appeal stands reopened at scheduled status with its reopened hearing date on record.
    condition: The appeal's status is scheduled, an appeal_hearing_scheduled record with schedule_reason reopening stands on it, and appeals.hearing_date holds that reopened setting's date.
    resolved_by: reopen_dismissed_appeal_6a7f532d
    effect: Once the reopened hearing is on record the appeal carries a current set hearing date, and the binding in_person_set_days becomes the calendar days from today to that date — the date the in-person session is counted from (before it, hearing_date still holds the missed, past hearing).
  cross_category:
  - category: taxacct
    as: branch
    reads:
    - reserve_ratio
    - contribution_rate
    - employer_wage_reports.employee_count_month3
    note: The large hearing room days read the employee count of the employer's latest quarterly report; the tax calendar days read the account's reserve ratio and noticed contribution rate.
  compute:
  - in_person_set_days: DAYS(NOW, F('hearing_date'))
  - appellant_exhibit_count: COUNT('appeal_events', event_type='appeal_exhibit_received', requested_by=F('appellant_role'))
  - room_block_gap: K('long_room_block_days') if (appellant_exhibit_count >= K('exhibit_threshold') and P('hearing_length_minutes') >= K('long_session_minutes')) else (K('short_room_block_days') if (appellant_exhibit_count >= K('exhibit_threshold') and P('hearing_length_minutes') < K('long_session_minutes')) else K('standard_room_block_days'))
  - on_site_language: LATEST('appeal_events', 'language', date_field='request_date', event_type='appeal_interpreter_requested')
  - on_site_interpreter_days: K('on_site_sign_language_days') if on_site_language == 'american_sign_language' else (K('on_site_contract_interpreter_days') if (on_site_language != None and on_site_language != 'spanish') else 0)
  - appearance_subpoena_count: COUNT('appeal_requests', request_type='subpoena', request_status='granted')
  - witness_appearance_days: K('two_subpoena_appearance_days') if appearance_subpoena_count >= 2 else (K('one_subpoena_appearance_days') if appearance_subpoena_count == 1 else 0)
  - latest_report_employees: XLATEST('taxacct', 'employer_wage_reports', 'employee_count_month3', date_field='quarter')
  - room_subpoena_count: COUNT('appeal_requests', request_type='subpoena', request_status='granted')
  - large_room_days: K('large_room_with_witness_days') if (latest_report_employees != None and latest_report_employees >= K('large_room_employee_count') and room_subpoena_count >= 1) else (K('large_room_days') if (latest_report_employees != None and latest_report_employees >= K('large_room_employee_count') and room_subpoena_count == 0) else 0)
  - account_reserve_ratio: CFIELD('taxacct', 'reserve_ratio', employer_account_id=F('employer_account_id'))
  - account_contribution_rate: CFIELD('taxacct', 'contribution_rate', employer_account_id=F('employer_account_id'))
  - tax_calendar_days: K('senior_tax_calendar_days') if (account_reserve_ratio != None and account_reserve_ratio < K('deficit_review_ratio') and account_contribution_rate >= K('high_rate_floor')) else (K('deficit_calendar_days') if (account_reserve_ratio != None and account_reserve_ratio < 0 and account_contribution_rate < K('high_rate_floor')) else 0)
  - in_person_candidate_days: in_person_set_days + room_block_gap + on_site_interpreter_days + witness_appearance_days + large_room_days + tax_calendar_days
  - in_person_candidate_weekday: (DAYS('2026-01-05', NOW) + in_person_candidate_days) % 7
  - in_person_day_shift: ((2 - in_person_candidate_weekday) % 7) if (F('variant_name') == 'Lower Authority Appeal — Employer Contribution Rate' or F('variant_name') == 'Lower Authority Appeal — Employer Benefit Charge') else ((1 if in_person_candidate_weekday == 0 else (0 if in_person_candidate_weekday == 1 else (1 if in_person_candidate_weekday == 2 else (0 if in_person_candidate_weekday == 3 else (4 if in_person_candidate_weekday == 4 else (3 if in_person_candidate_weekday == 5 else 2)))))) if (F('variant_name') == 'Lower Authority Appeal — Separation Issue' or F('variant_name') == 'Lower Authority Appeal — Able and Available Issue') else (2 if in_person_candidate_weekday == 5 else (1 if in_person_candidate_weekday == 6 else 0)))
  - result: in_person_candidate_days + in_person_day_shift
  compute_basis:
    in_person_set_days: The in-person session date is the set hearing date moved later by the room block gap.
    appellant_exhibit_count: The room block gap is the long room block days when at least the exhibit threshold of exhibits submitted by the appellant stand received on the appeal and the docket's hearing length is at least the long session minutes, the short room block days when at least the exhibit threshold of such exhibits stand received and the docket's hearing length is shorter than the long session minutes, and the standard room block days when fewer than the exhibit threshold of exhibits submitted by the appellant stand received.
    room_block_gap: The room block gap is the long room block days when at least the exhibit threshold of exhibits submitted by the appellant stand received on the appeal and the docket's hearing length is at least the long session minutes, the short room block days when at least the exhibit threshold of such exhibits stand received and the docket's hearing length is shorter than the long session minutes, and the standard room block days when fewer than the exhibit threshold of exhibits submitted by the appellant stand received.
    on_site_language: The on-site interpreter days are the on-site sign-language days when the latest interpreter request on the appeal is for American Sign Language, the on-site contract-interpreter days when the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish, and zero days when the latest interpreter request is for Spanish or no interpreter is requested.
    on_site_interpreter_days: The on-site interpreter days are the on-site sign-language days when the latest interpreter request on the appeal is for American Sign Language, the on-site contract-interpreter days when the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish, and zero days when the latest interpreter request is for Spanish or no interpreter is requested.
    appearance_subpoena_count: The witness appearance days are the two-subpoena appearance days when two or more subpoena requests on the appeal stand granted, the one-subpoena appearance days when exactly one does, and zero days when none does.
    witness_appearance_days: The witness appearance days are the two-subpoena appearance days when two or more subpoena requests on the appeal stand granted, the one-subpoena appearance days when exactly one does, and zero days when none does.
    latest_report_employees: The large hearing room days are the large-room-with-witness days for an appellant whose latest quarterly contribution and wage report counts at least the large-room employee count on the reference day of the quarter's third month and whose appeal has at least one granted subpoena request, the large-room days for an appellant whose latest quarterly report counts at least the large-room employee count and whose appeal has no granted subpoena request, and zero days for an appellant whose latest quarterly report counts fewer employees or who files no quarterly report.
    room_subpoena_count: The large hearing room days are the large-room-with-witness days for an appellant whose latest quarterly contribution and wage report counts at least the large-room employee count on the reference day of the quarter's third month and whose appeal has at least one granted subpoena request, the large-room days for an appellant whose latest quarterly report counts at least the large-room employee count and whose appeal has no granted subpoena request, and zero days for an appellant whose latest quarterly report counts fewer employees or who files no quarterly report.
    large_room_days: The large hearing room days are the large-room-with-witness days for an appellant whose latest quarterly contribution and wage report counts at least the large-room employee count on the reference day of the quarter's third month and whose appeal has at least one granted subpoena request, the large-room days for an appellant whose latest quarterly report counts at least the large-room employee count and whose appeal has no granted subpoena request, and zero days for an appellant whose latest quarterly report counts fewer employees or who files no quarterly report.
    account_reserve_ratio: The tax calendar days are the senior tax calendar days when the appellant's tax account shows a reserve ratio below the deficit-review ratio and a contribution rate at or above the high-rate floor, the deficit calendar days when that account shows a reserve ratio below zero and a contribution rate below the high-rate floor, and zero days in every other case, including an appellant with no tax account.
    account_contribution_rate: The tax calendar days are the senior tax calendar days when the appellant's tax account shows a reserve ratio below the deficit-review ratio and a contribution rate at or above the high-rate floor, the deficit calendar days when that account shows a reserve ratio below zero and a contribution rate below the high-rate floor, and zero days in every other case, including an appellant with no tax account.
    tax_calendar_days: The tax calendar days are the senior tax calendar days when the appellant's tax account shows a reserve ratio below the deficit-review ratio and a contribution rate at or above the high-rate floor, the deficit calendar days when that account shows a reserve ratio below zero and a contribution rate below the high-rate floor, and zero days in every other case, including an appellant with no tax account.
    in_person_candidate_days: The in-person session date is the set hearing date moved later by the room block gap. The on-site interpreter days, the witness appearance days, the large hearing room days and the tax calendar days are added to the room block gap, the set hearing date is moved later by that total, and the calendar-day rule is applied to the date that results.
    in_person_candidate_weekday: On the Employer Contribution Rate and the Employer Benefit Charge dockets an in-person session date moves to the first Wednesday on or after the date found; on the Separation Issue and the Able and Available Issue dockets it moves to the first Tuesday or Thursday on or after that date; and on any other docket an in-person session date that falls on a Saturday or a Sunday moves to the following Monday.
    in_person_day_shift: On the Employer Contribution Rate and the Employer Benefit Charge dockets an in-person session date moves to the first Wednesday on or after the date found; on the Separation Issue and the Able and Available Issue dockets it moves to the first Tuesday or Thursday on or after that date; and on any other docket an in-person session date that falls on a Saturday or a Sunday moves to the following Monday.
    result: The in-person session notice period is the number of calendar days from today, the day the party books the session and its notice is mailed, to the in-person session date.
  factors:
  - id: in_person_room_block
    effect: parameter
    decides: room_block_gap
    bindings:
    - appellant_exhibit_count
    - room_block_gap
    ladder:
    - when: at least the exhibit threshold of appellant exhibits received AND docket hearing length at least the long session minutes
      value: K('long_room_block_days')
    - when: at least the exhibit threshold of appellant exhibits received AND docket hearing length shorter than the long session minutes
      value: K('short_room_block_days')
    - when: otherwise (fewer appellant exhibits)
      value: K('standard_room_block_days')
    baseline:
      room_block_gap: K('standard_room_block_days')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: in_person_on_site_interpreter
    effect: parameter
    decides: on_site_interpreter_days
    bindings:
    - on_site_language
    - on_site_interpreter_days
    ladder:
    - when: latest interpreter request for American Sign Language
      value: K('on_site_sign_language_days')
    - when: latest interpreter request for a language other than American Sign Language and Spanish
      value: K('on_site_contract_interpreter_days')
    - when: otherwise (Spanish, or no interpreter requested)
      value: '0'
    baseline:
      on_site_interpreter_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: in_person_witness_appearance
    effect: parameter
    decides: witness_appearance_days
    bindings:
    - appearance_subpoena_count
    - witness_appearance_days
    ladder:
    - when: two or more granted subpoena requests on the appeal
      value: K('two_subpoena_appearance_days')
    - when: exactly one granted subpoena request on the appeal
      value: K('one_subpoena_appearance_days')
    - when: otherwise (none)
      value: '0'
    baseline:
      witness_appearance_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: in_person_large_room
    effect: parameter
    decides: large_room_days
    bindings:
    - latest_report_employees
    - room_subpoena_count
    - large_room_days
    ladder:
    - when: latest quarterly report counts at least the large-room employee count in the quarter's third month AND at least one granted subpoena request
      value: K('large_room_with_witness_days')
    - when: latest quarterly report counts at least the large-room employee count AND no granted subpoena request
      value: K('large_room_days')
    - when: otherwise (fewer employees, or no quarterly report)
      value: '0'
    baseline:
      large_room_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: taxacct
  - id: in_person_tax_calendar
    effect: parameter
    decides: tax_calendar_days
    bindings:
    - account_reserve_ratio
    - account_contribution_rate
    - tax_calendar_days
    ladder:
    - when: tax account reserve ratio below the deficit-review ratio AND contribution rate at or above the high-rate floor
      value: K('senior_tax_calendar_days')
    - when: tax account reserve ratio below zero AND contribution rate below the high-rate floor
      value: K('deficit_calendar_days')
    - when: otherwise (including no tax account)
      value: '0'
    baseline:
      tax_calendar_days: '0'
    evidence:
    - cross_category
    cross_difficulty: taxacct
  - id: in_person_calendar_day
    effect: method
    decides: in_person_day_shift
    bindings:
    - in_person_candidate_weekday
    - in_person_day_shift
    ladder:
    - when: the appeal is on the Employer Contribution Rate or the Employer Benefit Charge docket
      method: the session moves to the first Wednesday on or after the date found
    - when: the appeal is on the Separation Issue or the Able and Available Issue docket
      method: the session moves to the first Tuesday or Thursday on or after the date found
    - when: otherwise (any other docket)
      method: a session date on a Saturday or a Sunday moves to the following Monday
    baseline:
      in_person_day_shift: (2 if in_person_candidate_weekday == 5 else (1 if in_person_candidate_weekday == 6 else 0))
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The in-person session notice period is the number of calendar days from today, the day the party books the session and its notice is mailed, to the in-person session date. The in-person session date is the set hearing date moved later by the room block gap. The room block gap is the standard room block days. An in-person session date that falls on a Saturday or a Sunday moves to the following Monday.
    params:
    - standard_room_block_days
  inputs:
    history:
    - table: appeal_events
      aggregate: count
      field: appeal_event_id
      filters:
        event_type: appeal_exhibit_received
    - table: appeal_requests
      aggregate: count
      field: appeal_request_id
      filters:
        request_type: subpoena
        request_status: granted
    - category: taxacct
      table: employer_wage_reports
      aggregate: latest
      field: employee_count_month3
      filters: {}
    cross_category:
    - taxacct
