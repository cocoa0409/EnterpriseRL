events:
- type: appeal_filed
  target: appeals
  mutation: create
  meaning: A claimant or employer files a written appeal against a determination or a lower-authority decision.
  grain: One row per appeal filed by one party against one determination or decision.
  fields:
    customer_id: The appellant.
    variant_name: Docket the appeal is filed on.
    appellant_role: Whether the appellant is the claimant or an employer.
    determination_type: Kind of record appealed.
    determination_record_id: The appealed record.
    claim_id: Claim concerned, empty for employer tax appeals.
    employer_account_id: Employer account concerned, empty when none.
    parent_appeal_id: For a Board of Review appeal, the lower-authority appeal decided.
    determination_mailed_date: Mailing date of the appealed determination or decision.
    filed_date: Filing date (postmark, fax or online submission date).
    filing_channel: Channel used.
    late_filing_reason: Good cause stated for a late filing, none when timely.
  triggers:
  - event: overpay:overpay_recovery_suspended
    when:
      determination_type: overpayment
    map:
      status: suspended
- type: appeal_docketed
  target: appeals
  mutation:
    transition:
      from: filed
      to: scheduled
  meaning: The appeal is docketed with its first hearing set.
  grain: One transition per appeal.
  fields:
    status: Set to scheduled.
    hearing_date: Date of the first hearing.
  triggers: []
- type: appeal_hearing_scheduled
  target: appeal_events
  meaning: A hearing is set and its notice mailed (first setting, reset after postponement, or setting after reopening).
  grain: One row per hearing setting.
  distinguish_by:
  - hearing_date
  - schedule_reason
  fields:
    hearing_date: Date of the hearing.
    hearing_time: Start time of the hearing.
    hearing_mode: Mode of the hearing.
    notice_mailed_date: Date the hearing notice was mailed.
    schedule_reason: Why this setting was made.
  triggers:
  - event: appeal:appeal_docketed
    when:
      schedule_reason: initial
    map:
      hearing_date: hearing_date
  - event: appeal:appeal_reopened
    when:
      schedule_reason: reopening
    map:
      hearing_date: hearing_date
- type: appeal_postponement_decided
  target: appeal_events
  meaning: A party's request to postpone a set hearing is decided.
  grain: One row per postponement request.
  distinguish_by:
  - request_date
  - requested_by
  fields:
    requested_by: Party asking for the postponement.
    request_date: Date the request was received.
    hearing_date: Date of the hearing the request concerns.
    postponement_outcome: Decision on the request.
  triggers:
  - event: appeal:appeal_hearing_scheduled
    when:
      postponement_outcome: granted
    map:
      schedule_reason: postponement
- type: appeal_exhibit_received
  target: appeal_events
  meaning: A documentary exhibit from a party is received for the hearing.
  grain: One row per exhibit received.
  distinguish_by:
  - exhibit_type
  - requested_by
  - received_date
  fields:
    exhibit_type: Kind of document.
    requested_by: Party submitting the exhibit.
    received_date: Date received.
    exhibit_status: Whether the exhibit met the deadline.
  triggers: []
- type: appeal_interpreter_requested
  target: appeal_events
  meaning: A party asks for an interpreter at the hearing.
  grain: One row per party per language.
  distinguish_by:
  - requested_by
  - language
  fields:
    requested_by: Party needing the interpreter.
    language: Language requested.
    request_date: Date of the request.
  triggers: []
- type: appeal_decision_issued
  target: appeals
  mutation:
    transition:
    - from: scheduled
      to: decided
    - from: filed
      to: decided
  meaning: The decision on the appeal is issued and mailed.
  grain: One transition per appeal.
  fields:
    status: Set to decided.
    decision_outcome: Outcome of the decision.
    decision_mailed_date: Date the decision was mailed.
    determination_type: Kind of record appealed (unchanged, carried for the consequences).
  triggers:
  - event: overpay:overpay_cancelled
    when:
      decision_outcome: reversed
      determination_type: overpayment
    map:
      status: cancelled
