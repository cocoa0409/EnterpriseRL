        event_type: appeal_interpreter_requested
    - table: appeal_requests
      aggregate: count
      field: appeal_request_id
      filters:
        request_type: subpoena
        request_status: received
    - category: claim
      table: claim_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 2
      filters:
        event_type: claim_benefit_paid
    - category: claim
      table: claim_certifications
      aggregate: count
      field: certification_id
      within_months: 2
      filters: {}
    cross_category:
    - claim
- id: appeal_ext_video_session
  base_policy_refs:
  - appeal_evt_scheduling
  - appeal_agg_linked_dockets
  - appeal_evt_postponement
  overwrite:
  - base_policy: appeal_evt_scheduling
    superseded_clause: Dockets with hearings are set for a hearing in the docket's default mode, and a party may ask for an in-person hearing where the docket allows it; the Board of Review decides on the record and sets no hearing, accepting written argument within its written argument days.
    replaced_by: Dockets with hearings are set for a hearing in the docket's default mode, and a party may ask for an in-person hearing where the docket allows it or for a video hearing on any docket that holds hearings; the Board of Review decides on the record and sets no hearing, accepting written argument within its written argument days.
  - base_policy: appeal_evt_postponement
    superseded_clause: A party may ask to postpone a set hearing.
    replaced_by: A party may ask to postpone a set hearing, and the postponement rules, with their lead time, per-party maximum and reschedule window, govern that request; a party's request to hold its set hearing as a video session instead is a change of hearing mode and is not a request to postpone.
  trigger: on_request
  subject:
  - appeal_hearing_scheduled
  computes: session_days
  target_tool: book_video_hearing_session_16bf8e4f
  params:
    standard_video_block_days: 5
    short_video_block_days: 7
    long_video_block_days: 10
    long_hearing_minutes: 60
    sign_language_review_days: 5
    medical_letter_review_days: 3
    unverified_identity_check_days: 6
    other_pathway_identity_check_days: 3
    two_exhibit_preparation_days: 5
    one_exhibit_preparation_days: 3
  rule: 'Dockets with hearings are set for a hearing in the docket''s default mode, and a party may ask for an in-person hearing where the docket allows it or for a video hearing on any docket that holds hearings; the Board of Review decides on the record and sets no hearing, accepting written argument within its written argument days. A party who asks for a video hearing books the video session itself on the Department''s video hearing calendar, and the session replaces the telephone setting on the appeal as a change of hearing mode made at that party''s request. A party may ask to postpone a set hearing, and the postponement rules, with their lead time, per-party maximum and reschedule window, govern that request; a party''s request to hold its set hearing as a video session instead is a change of hearing mode and is not a request to postpone. A change of hearing mode booked as a video session is not a postponement: it needs no postponement request or decision, is not subject to the postponement lead time, does not count toward the party''s postponements and is not held to the reschedule window; its date is the video session date this section gives. A video session is booked only for an appeal that stands at filed or scheduled status. On an appeal at filed status, a video session is booked only after the appeal stands at scheduled status with its first hearing setting on record. The video session notice period is the number of calendar days from today, the day the party books the session and its notice is mailed, to the video session date. The video session date is the set hearing date moved later by the video block gap. The video block gap is the standard video block days. A video session date that falls on a Saturday or a Sunday moves to the following Monday. The video block gap is the long video block days when the latest interpreter request on the appeal is for a language other than Spanish and the docket''s hearing length is at least the long hearing minutes, the short video block days when the latest interpreter request on the appeal is for a language other than Spanish and the docket''s hearing length is shorter than the long hearing minutes, and the standard video block days when the latest interpreter request is for Spanish or no interpreter is requested. The video accommodation review days are the sign-language review days when the latest interpreter request on the appeal is for American Sign Language and at least one medical statement exhibit stands received on the appeal, the medical-letter review days when at least one medical statement exhibit stands received on the appeal and the latest interpreter request is not for American Sign Language or no interpreter is requested, and zero days when no medical statement exhibit stands received on the appeal. The video identity check days are the unverified identity check days when the appellant holds an identity verification case on the appealed claim that stands in any status other than verified, the other-pathway identity check days when the appellant''s case on that claim stands verified through a pathway other than a Video Trusted Referee Session, and zero days when the appellant''s case stands verified through a Video Trusted Referee Session or the appellant holds no identity verification case on the appealed claim. The video exhibit preparation days are the two-exhibit preparation days when two or more exhibits submitted by the appellant stand received on the appeal, the one-exhibit preparation days when exactly one does, and zero days when none does. On the Separation Issue and the Able and Available Issue dockets a video session date moves to the first Tuesday or Thursday on or after the date found; on the Overpayment and Fraud docket it moves to the first Wednesday on or after that date; and on any other docket a video session date that falls on a Saturday or a Sunday moves to the following Monday. The video accommodation review days, the video identity check days and the video exhibit preparation days are added to the video block gap, the set hearing date is moved later by that total, and the calendar-day rule is applied to the date that results.'
  prerequisite:
  - problem: appeal_ext_first_hearing_setting
    kind: value_input
    gate: video_set_days
    form: state
    policy_source: On an appeal at filed status, a video session is booked only after the appeal stands at scheduled status with its first hearing setting on record.
    condition: 'On an appeal that stood at filed status: the appeal''s status is scheduled, an appeal_hearing_scheduled record with schedule_reason initial stands on it, and appeals.hearing_date holds that first setting''s date.'
    resolved_by: docket_appeal_hearing_a28520da
    effect: Once the first hearing setting is on record the appeal carries a set hearing date, and the binding video_set_days becomes the calendar days from today to that date — the date the video session is counted from.
  cross_category:
  - category: idv
    as: branch
    reads:
    - status
    - variant_name
    note: 'The video identity check days are decided from the appellant''s own identity verification case on the appealed claim: its status and the pathway it was verified through (a cross-category read; idv is claimed by no difficulty).'
  compute:
  - video_set_days: DAYS(NOW, F('hearing_date'))
  - block_interpreter_language: LATEST('appeal_events', 'language', date_field='request_date', event_type='appeal_interpreter_requested')
  - video_block_gap: K('long_video_block_days') if (block_interpreter_language != None and block_interpreter_language != 'spanish' and P('hearing_length_minutes') >= K('long_hearing_minutes')) else (K('short_video_block_days') if (block_interpreter_language != None and block_interpreter_language != 'spanish' and P('hearing_length_minutes') < K('long_hearing_minutes')) else K('standard_video_block_days'))
  - review_interpreter_language: LATEST('appeal_events', 'language', date_field='request_date', event_type='appeal_interpreter_requested')
  - medical_statement_exhibits: COUNT('appeal_events', event_type='appeal_exhibit_received', exhibit_type='medical_statement')
  - accommodation_review_days: K('sign_language_review_days') if (review_interpreter_language == 'american_sign_language' and medical_statement_exhibits >= 1) else (K('medical_letter_review_days') if (review_interpreter_language != 'american_sign_language' and medical_statement_exhibits >= 1) else 0)
  - verification_status: CFIELD('idv', 'status', claim_id=F('claim_id'))
  - verification_pathway: CFIELD('idv', 'variant_name', claim_id=F('claim_id'))
  - identity_check_days: K('unverified_identity_check_days') if (verification_status != None and verification_status != 'verified') else (K('other_pathway_identity_check_days') if (verification_status == 'verified' and verification_pathway != 'Video Trusted Referee Session') else 0)
  - appellant_exhibits: COUNT('appeal_events', event_type='appeal_exhibit_received', requested_by=F('appellant_role'))
  - exhibit_preparation_days: K('two_exhibit_preparation_days') if appellant_exhibits >= 2 else (K('one_exhibit_preparation_days') if appellant_exhibits == 1 else 0)
  - video_candidate_days: video_set_days + video_block_gap + accommodation_review_days + identity_check_days + exhibit_preparation_days
  - video_candidate_weekday: (DAYS('2026-01-05', NOW) + video_candidate_days) % 7
  - video_day_shift: (1 if video_candidate_weekday == 0 else (0 if video_candidate_weekday == 1 else (1 if video_candidate_weekday == 2 else (0 if video_candidate_weekday == 3 else (4 if video_candidate_weekday == 4 else (3 if video_candidate_weekday == 5 else 2)))))) if (F('variant_name') == 'Lower Authority Appeal — Separation Issue' or F('variant_name') == 'Lower Authority Appeal — Able and Available Issue') else (((2 - video_candidate_weekday) % 7) if F('variant_name') == 'Lower Authority Appeal — Overpayment and Fraud' else (2 if video_candidate_weekday == 5 else (1 if video_candidate_weekday == 6 else 0)))
  - result: video_candidate_days + video_day_shift
  compute_basis:
    video_set_days: The video session date is the set hearing date moved later by the video block gap.
    block_interpreter_language: The video block gap is the long video block days when the latest interpreter request on the appeal is for a language other than Spanish and the docket's hearing length is at least the long hearing minutes, the short video block days when the latest interpreter request on the appeal is for a language other than Spanish and the docket's hearing length is shorter than the long hearing minutes, and the standard video block days when the latest interpreter request is for Spanish or no interpreter is requested.
    video_block_gap: The video block gap is the long video block days when the latest interpreter request on the appeal is for a language other than Spanish and the docket's hearing length is at least the long hearing minutes, the short video block days when the latest interpreter request on the appeal is for a language other than Spanish and the docket's hearing length is shorter than the long hearing minutes, and the standard video block days when the latest interpreter request is for Spanish or no interpreter is requested.
    review_interpreter_language: The video accommodation review days are the sign-language review days when the latest interpreter request on the appeal is for American Sign Language and at least one medical statement exhibit stands received on the appeal, the medical-letter review days when at least one medical statement exhibit stands received on the appeal and the latest interpreter request is not for American Sign Language or no interpreter is requested, and zero days when no medical statement exhibit stands received on the appeal.
    medical_statement_exhibits: The video accommodation review days are the sign-language review days when the latest interpreter request on the appeal is for American Sign Language and at least one medical statement exhibit stands received on the appeal, the medical-letter review days when at least one medical statement exhibit stands received on the appeal and the latest interpreter request is not for American Sign Language or no interpreter is requested, and zero days when no medical statement exhibit stands received on the appeal.
    accommodation_review_days: The video accommodation review days are the sign-language review days when the latest interpreter request on the appeal is for American Sign Language and at least one medical statement exhibit stands received on the appeal, the medical-letter review days when at least one medical statement exhibit stands received on the appeal and the latest interpreter request is not for American Sign Language or no interpreter is requested, and zero days when no medical statement exhibit stands received on the appeal.
    verification_status: The video identity check days are the unverified identity check days when the appellant holds an identity verification case on the appealed claim that stands in any status other than verified, the other-pathway identity check days when the appellant's case on that claim stands verified through a pathway other than a Video Trusted Referee Session, and zero days when the appellant's case stands verified through a Video Trusted Referee Session or the appellant holds no identity verification case on the appealed claim.
    verification_pathway: The video identity check days are the unverified identity check days when the appellant holds an identity verification case on the appealed claim that stands in any status other than verified, the other-pathway identity check days when the appellant's case on that claim stands verified through a pathway other than a Video Trusted Referee Session, and zero days when the appellant's case stands verified through a Video Trusted Referee Session or the appellant holds no identity verification case on the appealed claim.
    identity_check_days: The video identity check days are the unverified identity check days when the appellant holds an identity verification case on the appealed claim that stands in any status other than verified, the other-pathway identity check days when the appellant's case on that claim stands verified through a pathway other than a Video Trusted Referee Session, and zero days when the appellant's case stands verified through a Video Trusted Referee Session or the appellant holds no identity verification case on the appealed claim.
    appellant_exhibits: The video exhibit preparation days are the two-exhibit preparation days when two or more exhibits submitted by the appellant stand received on the appeal, the one-exhibit preparation days when exactly one does, and zero days when none does.
    exhibit_preparation_days: The video exhibit preparation days are the two-exhibit preparation days when two or more exhibits submitted by the appellant stand received on the appeal, the one-exhibit preparation days when exactly one does, and zero days when none does.
    video_candidate_days: The video session date is the set hearing date moved later by the video block gap. The video accommodation review days, the video identity check days and the video exhibit preparation days are added to the video block gap, the set hearing date is moved later by that total, and the calendar-day rule is applied to the date that results.
    video_candidate_weekday: On the Separation Issue and the Able and Available Issue dockets a video session date moves to the first Tuesday or Thursday on or after the date found; on the Overpayment and Fraud docket it moves to the first Wednesday on or after that date; and on any other docket a video session date that falls on a Saturday or a Sunday moves to the following Monday.
    video_day_shift: On the Separation Issue and the Able and Available Issue dockets a video session date moves to the first Tuesday or Thursday on or after the date found; on the Overpayment and Fraud docket it moves to the first Wednesday on or after that date; and on any other docket a video session date that falls on a Saturday or a Sunday moves to the following Monday.
    result: The video session notice period is the number of calendar days from today, the day the party books the session and its notice is mailed, to the video session date.
