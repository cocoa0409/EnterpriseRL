  subject:
  - appeal_filed
  rule: A claimant or employer may have several appeals at once, against different determinations or on different dockets, so the number of appeals per customer is not capped. An appeal is accepted for filing only when the same party has no other appeal against the same determination or decision with status filed, scheduled or decided. A party's second letter about a determination already under appeal is added to the existing appeal file as argument, and another party's appeal of the same determination is a separate appeal heard together with the first.
