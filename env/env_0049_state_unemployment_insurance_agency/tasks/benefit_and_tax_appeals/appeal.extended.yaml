  rule: An appeal is dismissed as untimely when it was filed late without good cause or after the late appeal limit, and dismissed for default when the appellant does not answer the hearing call within the call wait minutes; when only the other party is absent the hearing proceeds. A dismissed appeal may be reopened when the appellant asks for reopening with good cause. Reopening is granted only when it is requested no later than the reopening window after the mailing date of the dismissal. The window is counted in calendar days starting the day after the mailing date of the dismissal, and a request on the last day is in time. Good cause and the merits are heard at the same reopened hearing where the docket combines them; a reopening request that is late or shows no good cause is denied and the dismissal stands.
  eligibility:
  - id: reopening_window
    applies_to:
    - appeal_reopened
    kind: time
    condition: Reopening is granted only when it is requested no later than the reopening window after the mailing date of the dismissal.
    evidence_fields:
    - appeals.appeal_id
    - appeals.decision_mailed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appeals.appeal_id
      action_bindings:
        appeals.appeal_id: appeal_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the mailing date of the dismissal
      anchor_source: appeals.decision_mailed_date
      relation: not_after
      duration_source: variants.reopening_request_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days starting the day after the mailing date of the dismissal, and a request on the last day is in time.
      boundary: inclusive
  params:
    reopening_request_days: =reopening_request_days
    reopening_good_cause_required: =reopening_good_cause_required
    per_tier:
      Lower Authority Appeal — Separation Issue:
        reopening_hearing_combined: =reopening_hearing_combined
        appellant_absence_result: =appellant_absence_result
      Lower Authority Appeal — Able and Available Issue:
        reopening_hearing_combined: =reopening_hearing_combined
        appellant_absence_result: =appellant_absence_result
      Lower Authority Appeal — Monetary Determination:
        reopening_hearing_combined: =reopening_hearing_combined
        appellant_absence_result: =appellant_absence_result
      Lower Authority Appeal — Overpayment and Fraud:
        reopening_hearing_combined: =reopening_hearing_combined
        appellant_absence_result: =appellant_absence_result
      Lower Authority Appeal — Employer Benefit Charge:
        reopening_hearing_combined: =reopening_hearing_combined
        appellant_absence_result: =appellant_absence_result
      Lower Authority Appeal — Employer Contribution Rate:
        reopening_hearing_combined: =reopening_hearing_combined
        appellant_absence_result: =appellant_absence_result
      Higher Authority Appeal — Board of Review:
        reopening_hearing_combined: =reopening_hearing_combined
        appellant_absence_result: =appellant_absence_result
- id: appeal_closure
  subject:
  - appeal_closed
  rule: A lower-authority decision becomes final, and the appeal closes, when the Board of Review filing deadline after the decision mailing date passes with no Board appeal, or when a Board appeal naming it is filed; a Board decision becomes final when the court review deadline passes. A withdrawn appeal closes on confirmation, and a dismissed appeal closes when the reopening window passes without a granted reopening. A closed appeal is never reopened; further review is only by appeal to the next level within its deadline.
  eligibility: []
  params:
    court_review_deadline_days: =court_review_deadline_days
    reopening_request_days: =reopening_request_days
extended_policies:
- id: appeal_ext_first_hearing_setting
  base_policy_refs:
  - appeal_evt_scheduling
  - appeal_agg_linked_dockets
  overwrite:
  - base_policy: appeal_evt_scheduling
    superseded_clause: The first hearing is set within the docket's scheduling target after filing, the hearing notice is mailed at least the notice minimum days before the hearing date, and every interested party of the docket is notified.
    replaced_by: The first hearing is set on the first hearing date that the first-setting rules of this section give, the hearing notice is mailed at least the notice minimum days before the hearing date, and every interested party of the docket is notified.
  trigger: state_due
  subject:
  - appeal_docketed
  - appeal_hearing_scheduled
  computes: notice_period_days
  target_tool: docket_appeal_hearing_a28520da
  params:
    mail_receipt_days: 3
    expedited_target_days: 14
    priority_target_days: 18
    expedite_min_weeks: 3
    sign_language_lead_days: 10
    contract_interpreter_lead_days: 7
    one_subpoena_lead_days: 7
    two_subpoena_lead_days: 10
    federal_employee_records_days: 10
    ex_servicemember_records_days: 7
  rule: When the appeals office dockets an appeal filed on a docket that holds hearings, it sets the first hearing by telephone, mails the hearing notice today and notifies every interested party of the docket; the first-setting notice period is the number of calendar days from today, the day the notice is mailed, to the first hearing date. The first hearing is set on the first hearing date that the first-setting rules of this section give, the hearing notice is mailed at least the notice minimum days before the hearing date, and every interested party of the docket is notified. The first hearing date is the date that falls the first-setting target's number of calendar days after the day the first-setting clock starts. The first-setting clock starts on the appeal's filing date. The first-setting target is the docket's scheduling target days. When the first hearing date found this way is fewer than the docket's notice minimum days after today, the first hearing is set the notice minimum days after today instead. A first hearing date that falls on a Saturday or a Sunday moves to the following Monday. The first-setting clock starts today, the day the appeal is docketed, for an appeal filed after its deadline with a good-cause reason stated; it starts on the presumed receipt date, the presumed mail receipt days after the postmark date, for an appeal filed with no late-filing reason by mail; and it starts on the appeal's filing date for an appeal filed with no late-filing reason online or by fax. The first-setting target is the expedited target days for a claimant appellant on whose appealed claim no benefit payment was issued in the two months before today and who certified at least the expedite minimum weeks on that claim in those two months; it is the priority target days for a claimant appellant on whose appealed claim no benefit payment was issued in those two months and who certified fewer than the expedite minimum weeks on that claim in them; and it is the docket's scheduling target days for an employer appellant and for a claimant appellant on whose appealed claim a benefit payment was issued in those two months. The two months before today cover the dates later than the same day of the month two months before today, up to and including today. The first-setting interpreter lead is the sign-language lead days when the latest interpreter request on the appeal is for American Sign Language, the contract-interpreter lead days when the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish, and zero days when the latest interpreter request is for Spanish or no interpreter is requested. The first-setting subpoena lead is the two-subpoena lead days when two or more subpoena requests on the appeal stand received and not yet decided, the one-subpoena lead days when exactly one does, and zero days when none does. The first-setting federal records lead is the federal-employee records days when the appealed claim is an Unemployment Compensation for Federal Employees (UCFE) claim, the ex-servicemember records days when it is an Unemployment Compensation for Ex-Servicemembers (UCX) claim, and zero days when it is a claim under any other program or the appeal names no claim. The first-setting interpreter lead, the first-setting subpoena lead and the first-setting federal records lead are added together, and the first hearing date found from the first-setting clock and the first-setting target is moved later by that sum before the notice minimum and the weekend rule are applied.
  prerequisite: []
  cross_category:
  - category: claim
    as: history
    reads:
    - claim_ledger.event_type
    - claim_ledger.entry_date
    - claim_certifications.certified_date
    - variant_name
    note: The first-setting target reads the claimant's payments and certifications on the appealed claim over two months; the federal records lead reads the claim's program.
  compute:
  - filed_days_ago: DAYS(F('filed_date'), NOW)
  - first_clock_offset: 0 if F('late_filing_reason') != 'none' else ((K('mail_receipt_days') - filed_days_ago) if F('filing_channel') == 'mail' else (0 - filed_days_ago))
  - recent_payments: XCOUNT('claim', 'claim_ledger', within_months=2, date_field='entry_date', claim_id=F('claim_id'), event_type='claim_benefit_paid')
  - recent_certified_weeks: XCOUNT('claim', 'claim_certifications', within_months=2, date_field='certified_date', claim_id=F('claim_id'))
  - first_target_days: K('expedited_target_days') if (F('appellant_role') == 'claimant' and recent_payments == 0 and recent_certified_weeks >= K('expedite_min_weeks')) else (K('priority_target_days') if (F('appellant_role') == 'claimant' and recent_payments == 0 and recent_certified_weeks < K('expedite_min_weeks')) else P('scheduling_target_days'))
  - first_interpreter_language: LATEST('appeal_events', 'language', date_field='request_date', event_type='appeal_interpreter_requested')
  - first_interpreter_lead: K('sign_language_lead_days') if first_interpreter_language == 'american_sign_language' else (K('contract_interpreter_lead_days') if (first_interpreter_language != None and first_interpreter_language != 'spanish') else 0)
  - open_subpoena_requests: COUNT('appeal_requests', request_type='subpoena', request_status='received')
  - first_subpoena_lead: K('two_subpoena_lead_days') if open_subpoena_requests >= 2 else (K('one_subpoena_lead_days') if open_subpoena_requests == 1 else 0)
  - appealed_claim_program: CFIELD('claim', 'variant_name', claim_id=F('claim_id'))
  - first_records_lead: K('federal_employee_records_days') if appealed_claim_program == 'Unemployment Compensation for Federal Employees (UCFE)' else (K('ex_servicemember_records_days') if appealed_claim_program == 'Unemployment Compensation for Ex-Servicemembers (UCX)' else 0)
  - first_hearing_offset: MX(P('hearing_notice_min_days'), first_clock_offset + first_target_days + first_interpreter_lead + first_subpoena_lead + first_records_lead)
  - first_hearing_weekday: (DAYS('2026-01-05', NOW) + first_hearing_offset) % 7
  - result: first_hearing_offset + (2 if first_hearing_weekday == 5 else (1 if first_hearing_weekday == 6 else 0))
  compute_basis:
    filed_days_ago: The first-setting clock starts today, the day the appeal is docketed, for an appeal filed after its deadline with a good-cause reason stated; it starts on the presumed receipt date, the presumed mail receipt days after the postmark date, for an appeal filed with no late-filing reason by mail; and it starts on the appeal's filing date for an appeal filed with no late-filing reason online or by fax.
    first_clock_offset: The first-setting clock starts today, the day the appeal is docketed, for an appeal filed after its deadline with a good-cause reason stated; it starts on the presumed receipt date, the presumed mail receipt days after the postmark date, for an appeal filed with no late-filing reason by mail; and it starts on the appeal's filing date for an appeal filed with no late-filing reason online or by fax.
    recent_payments: The first-setting target is the expedited target days for a claimant appellant on whose appealed claim no benefit payment was issued in the two months before today and who certified at least the expedite minimum weeks on that claim in those two months; it is the priority target days for a claimant appellant on whose appealed claim no benefit payment was issued in those two months and who certified fewer than the expedite minimum weeks on that claim in them; and it is the docket's scheduling target days for an employer appellant and for a claimant appellant on whose appealed claim a benefit payment was issued in those two months. The two months before today cover the dates later than the same day of the month two months before today, up to and including today.
    recent_certified_weeks: The first-setting target is the expedited target days for a claimant appellant on whose appealed claim no benefit payment was issued in the two months before today and who certified at least the expedite minimum weeks on that claim in those two months; it is the priority target days for a claimant appellant on whose appealed claim no benefit payment was issued in those two months and who certified fewer than the expedite minimum weeks on that claim in them; and it is the docket's scheduling target days for an employer appellant and for a claimant appellant on whose appealed claim a benefit payment was issued in those two months. The two months before today cover the dates later than the same day of the month two months before today, up to and including today.
    first_target_days: The first-setting target is the expedited target days for a claimant appellant on whose appealed claim no benefit payment was issued in the two months before today and who certified at least the expedite minimum weeks on that claim in those two months; it is the priority target days for a claimant appellant on whose appealed claim no benefit payment was issued in those two months and who certified fewer than the expedite minimum weeks on that claim in them; and it is the docket's scheduling target days for an employer appellant and for a claimant appellant on whose appealed claim a benefit payment was issued in those two months.
    first_interpreter_language: The first-setting interpreter lead is the sign-language lead days when the latest interpreter request on the appeal is for American Sign Language, the contract-interpreter lead days when the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish, and zero days when the latest interpreter request is for Spanish or no interpreter is requested.
    first_interpreter_lead: The first-setting interpreter lead is the sign-language lead days when the latest interpreter request on the appeal is for American Sign Language, the contract-interpreter lead days when the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish, and zero days when the latest interpreter request is for Spanish or no interpreter is requested.
    open_subpoena_requests: The first-setting subpoena lead is the two-subpoena lead days when two or more subpoena requests on the appeal stand received and not yet decided, the one-subpoena lead days when exactly one does, and zero days when none does.
    first_subpoena_lead: The first-setting subpoena lead is the two-subpoena lead days when two or more subpoena requests on the appeal stand received and not yet decided, the one-subpoena lead days when exactly one does, and zero days when none does.
    appealed_claim_program: The first-setting federal records lead is the federal-employee records days when the appealed claim is an Unemployment Compensation for Federal Employees (UCFE) claim, the ex-servicemember records days when it is an Unemployment Compensation for Ex-Servicemembers (UCX) claim, and zero days when it is a claim under any other program or the appeal names no claim.
    first_records_lead: The first-setting federal records lead is the federal-employee records days when the appealed claim is an Unemployment Compensation for Federal Employees (UCFE) claim, the ex-servicemember records days when it is an Unemployment Compensation for Ex-Servicemembers (UCX) claim, and zero days when it is a claim under any other program or the appeal names no claim.
    first_hearing_offset: The first hearing date is the date that falls the first-setting target's number of calendar days after the day the first-setting clock starts. When the first hearing date found this way is fewer than the docket's notice minimum days after today, the first hearing is set the notice minimum days after today instead. The first-setting interpreter lead, the first-setting subpoena lead and the first-setting federal records lead are added together, and the first hearing date found from the first-setting clock and the first-setting target is moved later by that sum before the notice minimum and the weekend rule are applied.
    first_hearing_weekday: A first hearing date that falls on a Saturday or a Sunday moves to the following Monday.
    result: When the appeals office dockets an appeal filed on a docket that holds hearings, it sets the first hearing by telephone, mails the hearing notice today and notifies every interested party of the docket; the first-setting notice period is the number of calendar days from today, the day the notice is mailed, to the first hearing date. A first hearing date that falls on a Saturday or a Sunday moves to the following Monday.
  factors:
  - id: first_setting_clock
    effect: method
    decides: first_clock_offset
    bindings:
    - filed_days_ago
    - first_clock_offset
    ladder:
    - when: the appeal was filed after its deadline with a good-cause reason stated (late-filing reason other than none)
      method: the clock starts today, the day the appeal is docketed
    - when: the appeal has no late-filing reason and was filed by mail
      method: the clock starts on the presumed receipt date, the presumed mail receipt days after the postmark (filing) date
    - when: otherwise (no late-filing reason, filed online or by fax)
      method: the clock starts on the appeal's filing date
    baseline:
      first_clock_offset: 0 - filed_days_ago
    evidence:
    - date
    cross_difficulty: null
  - id: first_setting_target
    effect: parameter
    decides: first_target_days
    bindings:
    - recent_payments
    - recent_certified_weeks
    - first_target_days
    ladder:
    - when: claimant appellant AND no benefit payment issued on the appealed claim in the two months before today AND at least the expedite minimum weeks certified on it in those two months
      value: K('expedited_target_days')
    - when: claimant appellant AND no benefit payment issued on the appealed claim in those two months AND fewer than the expedite minimum weeks certified on it in them
      value: K('priority_target_days')
    - when: otherwise (employer appellant, or a benefit payment was issued on the appealed claim in those two months)
      value: P('scheduling_target_days')
    baseline:
      first_target_days: P('scheduling_target_days')
    evidence:
    - history
    - cross_category
    cross_difficulty: claim
  - id: first_setting_interpreter_lead
    effect: parameter
    decides: first_interpreter_lead
    bindings:
    - first_interpreter_language
    - first_interpreter_lead
    ladder:
    - when: the latest interpreter request on the appeal is for American Sign Language
      value: K('sign_language_lead_days')
    - when: the latest interpreter request on the appeal is for a language other than American Sign Language and Spanish
      value: K('contract_interpreter_lead_days')
    - when: otherwise (latest request for Spanish, or no interpreter requested)
      value: '0'
    baseline:
      first_interpreter_lead: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: first_setting_subpoena_lead
    effect: parameter
    decides: first_subpoena_lead
    bindings:
    - open_subpoena_requests
    - first_subpoena_lead
    ladder:
    - when: two or more subpoena requests on the appeal stand received and not yet decided
      value: K('two_subpoena_lead_days')
    - when: exactly one subpoena request on the appeal stands received and not yet decided
      value: K('one_subpoena_lead_days')
    - when: otherwise (none)
      value: '0'
    baseline:
      first_subpoena_lead: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: first_setting_federal_records_lead
    effect: parameter
    decides: first_records_lead
    bindings:
    - appealed_claim_program
    - first_records_lead
    ladder:
    - when: the appealed claim is a UCFE claim
      value: K('federal_employee_records_days')
    - when: the appealed claim is a UCX claim
      value: K('ex_servicemember_records_days')
    - when: otherwise (any other program, or no claim named)
      value: '0'
    baseline:
      first_records_lead: '0'
    evidence:
    - cross_category
    cross_difficulty: claim
  baseline:
    rule: When the appeals office dockets an appeal filed on a docket that holds hearings, it sets the first hearing by telephone, mails the hearing notice today and notifies every interested party of the docket; the first-setting notice period is the number of calendar days from today, the day the notice is mailed, to the first hearing date. The first hearing date is the date that falls the first-setting target's number of calendar days after the day the first-setting clock starts. The first-setting clock starts on the appeal's filing date. The first-setting target is the docket's scheduling target days. When the first hearing date found this way is fewer than the docket's notice minimum days after today, the first hearing is set the notice minimum days after today instead. A first hearing date that falls on a Saturday or a Sunday moves to the following Monday.
    params:
    - scheduling_target_days
    - hearing_notice_min_days
  inputs:
    history:
