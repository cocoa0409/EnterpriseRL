events:
  - type: charge_position_opened
    target: charge_positions
    mutation: create
    meaning: A notice of claim is mailed to a base-period employer, opening its chargeable position on the claim.
    grain: One row per employer account per claim.
    fields:
      customer_id: The employer.
      employer_account_id: The employer's tax account.
      claim_id: The claim.
      variant_name: The employer's charge class on the claim.
      notice_mailed_date: Date the notice of claim was mailed.
      response_due_date: Last day for a timely response.
      base_period_wages_paid: Wages this employer paid the claimant in the claim's base period.
      charge_share_pct: This employer's share of each payment's charge.
    triggers: []
  - type: charge_separation_response_filed
    target: charge_positions
    mutation: {transition: {from: noticed, to: responded}}
    meaning: The employer submits its separation and wage response.
    grain: One transition per position.
    fields:
      status: Set to responded.
      response_date: Date the response was received.
      response_timeliness: Whether it was timely.
      separation_reason_reported: Separation reason the employer reports.
    triggers: []
  - type: charge_response_window_lapsed
    target: charge_positions
    mutation: {transition: {from: noticed, to: chargeable}}
    meaning: The response window passed without a response.
    grain: One transition per position.
    fields:
      status: Set to chargeable.
      response_timeliness: Set to none.
    triggers: []
  - type: charge_relief_determined
    target: charge_positions
    mutation: {transition: {from: responded, to: relieved}}
    meaning: The determination on the response relieves the employer of charges.
    grain: One transition per position.
    fields:
      status: Set to relieved.
      relief_basis: Ground on which relief was granted.
    triggers:
      - event: charge:charge_credit_reversed
        map: {credit_reason: relief_granted}
  - type: charge_chargeability_determined
    target: charge_positions
    mutation: {transition: {from: responded, to: chargeable}}
    meaning: The determination on the response leaves the employer chargeable.
    grain: One transition per position.
    fields:
      status: Set to chargeable.
    triggers: []
  - type: charge_benefit_posted
    target: charge_ledger
    meaning: The employer's share of one benefit payment is charged to its position.
    grain: One row per position per benefit payment.
    distinguish_by: [source_payment_id]
    fields:
      source_payment_id: Benefit payment charged.
      source_payment_amount: Gross payable amount of that payment.
      week_ending_date: Week of that payment.
      charge_quarter: Calendar quarter in which the charge is posted.
      amount: Charge posted, positive.
      entry_date: Date posted.
    account: charged_benefits
    direction: in
    triggers: []
  - type: charge_credit_reversed
    target: charge_ledger
    meaning: A posted charge is credited back in whole or in part.
    grain: One row per posted charge per credit reason.
    distinguish_by: [source_charge_id, credit_reason]
    fields:
      source_charge_id: The posted charge being credited.
      credit_reason: Why it is credited.
      charge_quarter: Calendar quarter in which the credit is posted.
      amount: Credit, positive and never more than the remaining charge.
      entry_date: Date credited.
    account: charged_benefits
    direction: out
    triggers: []
  - type: charge_statement_issued
    target: charge_ledger
    meaning: The quarterly statement of benefit charges listing this position is mailed.
    grain: One row per position per quarter stated.
    distinguish_by: [charge_quarter]
    fields:
      charge_quarter: Quarter the statement covers.
      statement_mailed_date: Date the statement was mailed.
      protest_due_date: Last day for a timely protest.
    triggers: []
  - type: charge_protest_filed
    target: charge_positions
    mutation: {transition: {from: chargeable, to: protest_pending}}
    meaning: The employer files a written protest of the charges on a statement.
    grain: One transition per protest.
    fields:
      status: Set to protest_pending.
      protest_date: Date the protest was received.
      protest_ground: Ground the employer raises.
    triggers: []
  - type: charge_protest_granted
    target: charge_positions
    mutation: {transition: {from: protest_pending, to: relieved}}
    meaning: The protest is granted and the employer relieved.
    grain: One transition per protest.
    fields:
      status: Set to relieved.
      relief_basis: Ground on which relief was granted.
    triggers:
      - event: charge:charge_credit_reversed
        map: {credit_reason: relief_granted}
  - type: charge_protest_denied
    target: charge_positions
    mutation: {transition: {from: protest_pending, to: chargeable}}
    meaning: The protest is denied and the charges stand.
    grain: One transition per protest.
    fields:
      status: Set to chargeable.
    triggers: []
  - type: charge_relief_on_appeal
    target: charge_positions
    mutation: {transition: {from: chargeable, to: relieved}}
    meaning: An appeal decision relieves the employer of the charges.
    grain: One transition per position.
    fields:
      status: Set to relieved.
      relief_basis: Set to appeal_decision.
    triggers:
      - event: charge:charge_credit_reversed
        map: {credit_reason: appeal_reversal}
  - type: charge_position_closed
    target: charge_positions
    mutation:
      transition:
        - {from: chargeable, to: closed}
        - {from: relieved, to: closed}
    meaning: The position is closed.
    grain: One transition per position.
    fields:
      status: Set to closed.
      closed_date: Date closed.
    triggers: []

measures:
  - id: charge_msr_claim_bpw_total
    window: The claim's base period as used by its latest monetary determination.
    measure: The claim's base-period wages from all employers (all states for a combined wage claim), as recorded on the claim.
  - id: charge_msr_remaining_charge
    window: One posted charge, to frozen time.
    measure: The charge_benefit_posted amount minus all charge_credit_reversed amounts naming it as source_charge_id.
  - id: charge_msr_failed_responses
    window: The pattern lookback days before the overpayment determination date.
    measure: Count of the employer account's positions with notice_mailed_date in the window whose response_timeliness is late or none, together with the same count divided by all positions noticed in the window.

policies:
  - id: charge_agg_multi_holding
    subject: [charge_position_opened]
    rule: >-
      An employer holds one chargeable position on each claim for which it is a base-period employer, so the number of positions per employer is not capped.
      A position is opened only once per employer account and claim.
      A claim under a program in the noncharged list opens no position; a later claim of the same claimant is a new claim with new positions.
    eligibility:
      - id: one_position_per_claim
        applies_to: [charge_position_opened]
        kind: dedup
        condition: "A position is opened only once per employer account and claim."
        evidence_fields: [charge_positions.employer_account_id, charge_positions.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [charge_positions.employer_account_id, charge_positions.claim_id]
          action_bindings: {charge_positions.employer_account_id: employer_account_id, charge_positions.claim_id: claim_id}
        dedup_contract:
          table: charge_positions
          mode: separate_record
          object_bindings: {employer_account_id: employer_account_id, claim_id: claim_id}
          duplicate_filters: {status: [noticed, responded, chargeable, protest_pending, relieved, closed]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_positions_per_claim_per_account: "=max_positions_per_claim_per_account"
      noncharged_programs: "=noncharged_programs"

  - id: charge_agg_proportional_share
    subject: [charge_position_opened, charge_benefit_posted]
    rule: >-
      Each payment on a chargeable claim is shared among all of its base-period employers in proportion to the wages each paid the claimant in the base period.
      Each employer's charge share is its base-period wages divided by charge_msr_claim_bpw_total, rounded to four decimals; on a combined wage claim only Lakeland wages make a Lakeland employer chargeable, but the denominator is the base-period wages of all states.
      The charge for a payment is the payment's gross payable amount times the employer's share times the program charge share of its class (the regular share for regular claims, the Extended Benefits share for Extended Benefits claims), rounded to the cent.
      A charge is posted only while the position status is noticed, responded, chargeable or protest_pending.
      The share of a relieved employer is not shifted to the other employers; it goes to the state noncharge account.
      A reissued payment is not charged again, because the original charge stands.
    eligibility:
      - id: post_on_chargeable_position
        applies_to: [charge_benefit_posted]
        kind: state
        condition: "A charge is posted only while the position status is noticed, responded, chargeable or protest_pending."
        evidence_fields: [charge_positions.charge_position_id, charge_positions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [charge_positions.charge_position_id]
          action_bindings: {charge_positions.charge_position_id: charge_position_id}
        state_contract:
          field: charge_positions.status
          allowed: [noticed, responded, chargeable, protest_pending]
    params:
      per_tier:
        Separating Employer — Most Recent: {share_denominator: "=share_denominator", eb_charge_share: "=eb_charge_share", cwc_wage_transfer_basis: "=cwc_wage_transfer_basis"}
        Base Period Employer — Proportional Share: {share_denominator: "=share_denominator", eb_charge_share: "=eb_charge_share", cwc_wage_transfer_basis: "=cwc_wage_transfer_basis"}
        Continuing Part-Time Base Period Employer: {share_denominator: "=share_denominator", eb_charge_share: "=eb_charge_share", cwc_wage_transfer_basis: "=cwc_wage_transfer_basis"}
        Combined Wage Claim Contributing Employer: {share_denominator: "=share_denominator", eb_charge_share: "=eb_charge_share", cwc_wage_transfer_basis: "=cwc_wage_transfer_basis"}
        Extended Benefits State-Share Employer: {share_denominator: "=share_denominator", eb_charge_share: "=eb_charge_share", cwc_wage_transfer_basis: "=cwc_wage_transfer_basis"}
        Reimbursing Nonprofit Employer — Dollar-for-Dollar: {share_denominator: "=share_denominator", eb_charge_share: "=eb_charge_share", cwc_wage_transfer_basis: "=cwc_wage_transfer_basis"}
        Reimbursing Governmental Employer — Dollar-for-Dollar: {share_denominator: "=share_denominator", eb_charge_share: "=eb_charge_share", cwc_wage_transfer_basis: "=cwc_wage_transfer_basis"}
      regular_program_charge_share: "=regular_program_charge_share"
      charge_share_rounding: "=charge_share_rounding"
      charge_amount_rounding: "=charge_amount_rounding"
      charge_posting_timing: "=charge_posting_timing"
      reissue_charge_rule: "=reissue_charge_rule"
      relieved_charges_to: "=relieved_charges_to"
    formula:
      charge_share_pct: "round(base_period_wages_paid / charge_msr_claim_bpw_total, 4)"
      regular_claim_charge: "round(source_payment_amount * charge_share_pct * regular_program_charge_share, 2)"
      extended_benefits_charge: "round(source_payment_amount * charge_share_pct * eb_charge_share, 2)"
    measures: [charge_msr_claim_bpw_total]

  - id: charge_evt_notice_and_response
    subject: [charge_position_opened, charge_separation_response_filed, charge_response_window_lapsed]
    rule: >-
      The notice of claim is mailed to each base-period employer's address of record, or to its authorized agent, within the mailing business days after the claim is filed, and asks for the separation reason, the last day worked and the base-period wages.
      Only the employer or a third-party administrator holding its power of attorney may respond; the agent never answers the notice for the employer.
      A response is timely only when it is received no later than the response window after the notice of claim mailing date.
      The window is counted in calendar days starting the day after the notice of claim mailing date, a response received on the last day is timely, and the window is never extended.
      A late response is treated as timely only when the employer shows good cause; otherwise payments issued before the late response stay charged even if relief is later granted.
      A position with no response by the end of the window becomes chargeable without relief, and the missing response counts toward the pattern of failure.
    eligibility:
      - id: response_window
        applies_to: [charge_separation_response_filed]
        kind: time
        condition: "A response is timely only when it is received no later than the response window after the notice of claim mailing date."
        evidence_fields: [charge_positions.charge_position_id, charge_positions.notice_mailed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [charge_positions.charge_position_id]
          action_bindings: {charge_positions.charge_position_id: charge_position_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the notice of claim mailing date
          anchor_source: charge_positions.notice_mailed_date
          relation: not_after
          duration_source: variants.response_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the notice of claim mailing date, a response received on the last day is timely, and the window is never extended."
          boundary: inclusive
    params:
      notice_of_claim_mailing_business_days: "=notice_of_claim_mailing_business_days"
      notice_recipient: "=notice_recipient"
      response_window_days: "=response_window_days"
      response_channels: "=response_channels"
      response_timeliness_basis: "=response_timeliness_basis"
      response_extension_allowed: "=response_extension_allowed"
      late_response_good_cause_accepted: "=late_response_good_cause_accepted"
      relief_bar_for_payments_before_late_response: "=relief_bar_for_payments_before_late_response"
      authorized_agent_allowed: "=authorized_agent_allowed"

  - id: charge_evt_relief_grounds
    subject: [charge_relief_determined, charge_chargeability_determined, charge_protest_granted]
    rule: >-
      Relief from charges is granted only on a ground the employer's class allows: the claimant left this employer voluntarily without good cause attributable to it; this employer discharged the claimant for misconduct connected with the work; the claimant refused suitable work this employer offered; this employer still employs the claimant part time as in the base period; the benefits were paid in error by the agency; or the employer paid no base-period wages or the wages charged are wrong.
      Continuing part-time relief lasts only for weeks in which the employer keeps the claimant at the base-period average weekly hours, and ends from the first week the hours fall.
      Reimbursing employers are relieved only for continuing part-time employment, agency error and wrong wages, because they pay for benefits dollar for dollar.
      Relief granted on the regular claim also covers the employer's Extended Benefits charges on the same claimant.
      Relief for benefits paid in error is refused when the employer's response to the notice of claim was untimely or inadequate and charge_msr_failed_responses meets both the pattern count and the pattern rate.
      A granted relief credits back every charge already posted within its scope, and no further charges are posted on a relieved position.
    eligibility: []
    params:
      per_tier:
        Separating Employer — Most Recent: {relief_voluntary_quit_without_good_cause: "=relief_voluntary_quit_without_good_cause", relief_discharge_misconduct: "=relief_discharge_misconduct", relief_refused_suitable_work: "=relief_refused_suitable_work", relief_continuing_part_time: "=relief_continuing_part_time", relief_scope: "=relief_scope", relief_effective_from: "=relief_effective_from", part_time_relief_hours_basis: "=part_time_relief_hours_basis"}
        Base Period Employer — Proportional Share: {relief_voluntary_quit_without_good_cause: "=relief_voluntary_quit_without_good_cause", relief_discharge_misconduct: "=relief_discharge_misconduct", relief_refused_suitable_work: "=relief_refused_suitable_work", relief_continuing_part_time: "=relief_continuing_part_time", relief_scope: "=relief_scope", relief_effective_from: "=relief_effective_from", part_time_relief_hours_basis: "=part_time_relief_hours_basis"}
        Continuing Part-Time Base Period Employer: {relief_voluntary_quit_without_good_cause: "=relief_voluntary_quit_without_good_cause", relief_discharge_misconduct: "=relief_discharge_misconduct", relief_refused_suitable_work: "=relief_refused_suitable_work", relief_continuing_part_time: "=relief_continuing_part_time", relief_scope: "=relief_scope", relief_effective_from: "=relief_effective_from", part_time_relief_hours_basis: "=part_time_relief_hours_basis"}
        Combined Wage Claim Contributing Employer: {relief_voluntary_quit_without_good_cause: "=relief_voluntary_quit_without_good_cause", relief_discharge_misconduct: "=relief_discharge_misconduct", relief_refused_suitable_work: "=relief_refused_suitable_work", relief_continuing_part_time: "=relief_continuing_part_time", relief_scope: "=relief_scope", relief_effective_from: "=relief_effective_from", part_time_relief_hours_basis: "=part_time_relief_hours_basis"}
        Extended Benefits State-Share Employer: {relief_voluntary_quit_without_good_cause: "=relief_voluntary_quit_without_good_cause", relief_discharge_misconduct: "=relief_discharge_misconduct", relief_refused_suitable_work: "=relief_refused_suitable_work", relief_continuing_part_time: "=relief_continuing_part_time", relief_scope: "=relief_scope", relief_effective_from: "=relief_effective_from", part_time_relief_hours_basis: "=part_time_relief_hours_basis"}
        Reimbursing Nonprofit Employer — Dollar-for-Dollar: {relief_voluntary_quit_without_good_cause: "=relief_voluntary_quit_without_good_cause", relief_discharge_misconduct: "=relief_discharge_misconduct", relief_refused_suitable_work: "=relief_refused_suitable_work", relief_continuing_part_time: "=relief_continuing_part_time", relief_scope: "=relief_scope", relief_effective_from: "=relief_effective_from", part_time_relief_hours_basis: "=part_time_relief_hours_basis"}
        Reimbursing Governmental Employer — Dollar-for-Dollar: {relief_voluntary_quit_without_good_cause: "=relief_voluntary_quit_without_good_cause", relief_discharge_misconduct: "=relief_discharge_misconduct", relief_refused_suitable_work: "=relief_refused_suitable_work", relief_continuing_part_time: "=relief_continuing_part_time", relief_scope: "=relief_scope", relief_effective_from: "=relief_effective_from", part_time_relief_hours_basis: "=part_time_relief_hours_basis"}
      relief_agency_error: "=relief_agency_error"
      relief_not_base_period_employer: "=relief_not_base_period_employer"
      eb_relief_follows_regular: "=eb_relief_follows_regular"
      pattern_failure_min_count: "=pattern_failure_min_count"
      pattern_failure_rate: "=pattern_failure_rate"
      pattern_lookback_days: "=pattern_lookback_days"
      response_adequacy_standard: "=response_adequacy_standard"
    measures: [charge_msr_failed_responses]

  - id: charge_evt_statement_and_protest
    subject: [charge_statement_issued, charge_protest_filed, charge_protest_granted, charge_protest_denied]
    rule: >-
      A statement of benefit charges is mailed for each quarter in which charges or credits were posted, no later than the statement mailing days after the quarter ends, by mail and in the employer portal, listing each claimant's charges by week.
      The employer may protest the charges on a statement in writing through the employer portal, by fax or by mail.
      A protest is accepted only when it is received no later than the protest window after the statement mailing date.
      The window is counted in calendar days starting the day after the statement mailing date, and a protest received on the last day is timely.
      A protest may raise only a ground not already decided: a separation the agency or an appeal has already ruled on cannot be reargued by protest and is challenged only by appeal on the employer benefit charge docket.
      A protest is decided within the protest decision business days; a granted protest relieves the position, and a denied protest leaves it chargeable and may be appealed.
    eligibility:
      - id: protest_window
        applies_to: [charge_protest_filed]
        kind: time
        condition: "A protest is accepted only when it is received no later than the protest window after the statement mailing date."
        evidence_fields: [charge_ledger.charge_position_id, charge_ledger.charge_quarter, charge_ledger.statement_mailed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [charge_ledger.charge_position_id, charge_ledger.charge_quarter]
          action_bindings: {charge_ledger.charge_position_id: charge_position_id, charge_ledger.charge_quarter: charge_quarter}
        temporal_basis:
          clock: frozen_time
          anchor_event: the statement mailing date
          anchor_source: charge_ledger.statement_mailed_date
          relation: not_after
          duration_source: variants.protest_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the statement mailing date, and a protest received on the last day is timely."
          boundary: inclusive
    params:
      statement_frequency: "=statement_frequency"
      statement_mailing_days_after_quarter: "=statement_mailing_days_after_quarter"
      statement_delivery: "=statement_delivery"
      statement_detail_level: "=statement_detail_level"
      protest_window_days: "=protest_window_days"
      protest_channels: "=protest_channels"
      protest_requires_new_ground: "=protest_requires_new_ground"
      protest_decision_business_days: "=protest_decision_business_days"
      protest_denial_appeal_docket: "=protest_denial_appeal_docket"

  - id: charge_evt_credits
    subject: [charge_credit_reversed]
    rule: >-
      A credit always names the single posted charge it reduces, and never exceeds charge_msr_remaining_charge.
      A posted charge is credited back only once for each credit reason.
      A relief credits the whole remaining charge of every posting within the relief's scope; a cancelled payment credits the whole charge of that payment; a recovered overpayment credits the charges of the overpaid weeks in proportion to the principal recovered; an appeal decision relieving the employer credits as a relief does.
      Credits appear on the next quarter's statement, or on the next reimbursement bill for a reimbursing employer.
    eligibility:
      - id: credit_once_per_reason
        applies_to: [charge_credit_reversed]
        kind: dedup
        condition: "A posted charge is credited back only once for each credit reason."
        evidence_fields: [charge_ledger.source_charge_id, charge_ledger.credit_reason, charge_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [charge_ledger.source_charge_id, charge_ledger.credit_reason]
          action_bindings: {charge_ledger.source_charge_id: source_charge_id, charge_ledger.credit_reason: credit_reason}
        dedup_contract:
          table: charge_ledger
          mode: separate_record
          object_bindings: {source_charge_id: source_charge_id, credit_reason: credit_reason}
          duplicate_filters: {event_type: [charge_credit_reversed]}
          distinct_fields: []
    params:
      overpayment_recovery_credit: "=overpayment_recovery_credit"
      cancelled_payment_credit: "=cancelled_payment_credit"
      appeal_reversal_credit: "=appeal_reversal_credit"
      per_tier:
        Separating Employer — Most Recent: {credit_application: "=credit_application", charges_billed_to_employer: "=charges_billed_to_employer"}
        Base Period Employer — Proportional Share: {credit_application: "=credit_application", charges_billed_to_employer: "=charges_billed_to_employer"}
        Continuing Part-Time Base Period Employer: {credit_application: "=credit_application", charges_billed_to_employer: "=charges_billed_to_employer"}
        Combined Wage Claim Contributing Employer: {credit_application: "=credit_application", charges_billed_to_employer: "=charges_billed_to_employer"}
        Extended Benefits State-Share Employer: {credit_application: "=credit_application", charges_billed_to_employer: "=charges_billed_to_employer"}
        Reimbursing Nonprofit Employer — Dollar-for-Dollar: {credit_application: "=credit_application", charges_billed_to_employer: "=charges_billed_to_employer"}
        Reimbursing Governmental Employer — Dollar-for-Dollar: {credit_application: "=credit_application", charges_billed_to_employer: "=charges_billed_to_employer"}
    measures: [charge_msr_remaining_charge]

  - id: charge_relief_by_appeal
    subject: [charge_relief_on_appeal]
    rule: >-
      A decision on the employer benefit charge docket, or a separation decision on appeal that finds a relief ground for this employer, relieves the position from the decision's mailing date.
      The position is relieved on appeal only when the appeal concerning it is decided with outcome reversed; a decision affirming the charges leaves the position chargeable and may be appealed to the Board of Review.
      Charges already posted within the relief's scope are credited back with credit reason appeal_reversal.
    eligibility:
      - id: appeal_reversed
        applies_to: [charge_relief_on_appeal]
        kind: authorization
        condition: "The position is relieved on appeal only when the appeal concerning it is decided with outcome reversed; a decision affirming the charges leaves the position chargeable and may be appealed to the Board of Review."
        evidence_fields: [appeals.determination_record_id, appeals.decision_outcome, appeals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeals.determination_record_id]
          action_bindings: {appeals.determination_record_id: charge_position_id}
    params:
      appeal_reversal_credit: "=appeal_reversal_credit"

  - id: charge_position_closure
    subject: [charge_position_closed]
    rule: >-
      A position closes when its claim has closed or been withdrawn and the protest window of the last statement listing it has passed.
      A closed position takes no further charges or protests; a credit for an overpayment recovered after closure is still posted on the employer's next statement.
    eligibility: []
    params:
      position_closure_basis: "=position_closure_basis"

# ============================================================================
# extended_policies (employer_charge_protests)
# ============================================================================
extended_policies:
  - id: charge_ext_protest_amount
    base_policy_refs: [charge_evt_statement_and_protest, charge_evt_credits, charge_evt_notice_and_response, charge_agg_proportional_share]
    overwrite: []
    trigger: on_request
    subject: [charge_protest_filed]
    computes: protested_amount
    target_tool: file_charge_protest_73ec7ae2
    params:
      support_full: 1.00
      support_half: 0.50
      support_none: 0.00
      support_full_quarters: 4
      support_window_months: 12
      answer_share_unanswered: 0.80
      answer_share_late: 0.90
      answer_share_other: 1.00
    rule: >-
      A written protest that disputes the employer's base-period wages or its base-period status states an amount protested, the money that protest puts in dispute for the claimant, worked out from the records on the day the protest is lodged.
      The amount protested is built in this order: first the starting amount of the named statement, less the credits taken out of the protest, never below zero, gives the disputed principal; then the disputed principal times the protest documentation share and times the answer share, rounded to the cent, gives the protested principal; then the monthly protest interest times the number of interest months, rounded to the cent, gives the protest interest; and the amount protested is the protested principal plus the protest interest, rounded to the cent.
      The standard starting amount of the named statement is the total of the charges that statement lists for the claimant, each at its posted amount, the named statement being the most recently mailed statement of benefit charges on the position.
      In the standard computation no credit is taken out of the protest, the protest documentation share is zero, the answer share is one, no monthly protest interest arises, and no interest month is counted.
      Where the employer finances benefits by reimbursement and has been billed for the statement's quarter, the starting amount is the amount billed for that quarter; where the employer is contributory and the quarter's charges have been posted to its reserve account, the starting amount is the amount posted to the reserve for that quarter; in any other case the starting amount is the total of the charges the statement lists.
      Only credits posted on the position in a quarter other than the statement's quarter are looked at: where a credit for a recovered overpayment is among them, every credit posted on the position in a quarter other than the statement's quarter is taken out of the protest; where no recovered-overpayment credit is among them but credits for cancelled payments are, those cancelled-payment credits are taken out; otherwise nothing is taken out.
      The protest documentation share is the whole when the amended wage reports the employer filed within the last twelve months number at least four, one half when they number one to three, and zero when it filed none in that time.
      The answer share is four fifths when no separation response to the notice of claim is on record for the position, nine tenths when the separation response on record was received after the response due date without good cause, and the whole otherwise.
      The monthly protest interest is, when the employer's tax account shows interest assessed for the statement's quarter and an amount billed for that quarter, the latest month of that assessed interest in proportion to the protested principal over the amount billed for the quarter; when no interest has yet been assessed for that quarter but the employer finances benefits by reimbursement and the bill for the quarter is past its due date, the protested principal times the late-payment interest rate of the employer's tax account class; and nothing otherwise.
      The number of interest months is, when the latest payment applied to the reimbursement bill for the statement's quarter was received after the bill's due date, the whole months from the due date to that payment plus one for the month in which it fell; when no payment has been applied to that bill and its due date has passed, the whole months from the due date to the protest plus one for the month in which the protest falls; and none otherwise.
    baseline:
      rule: >-
        The amount protested is built in this order: first the starting amount of the named statement, less the credits taken out of the protest, never below zero, gives the disputed principal; then the disputed principal times the protest documentation share and times the answer share, rounded to the cent, gives the protested principal; then the monthly protest interest times the number of interest months, rounded to the cent, gives the protest interest; and the amount protested is the protested principal plus the protest interest, rounded to the cent.
        The standard starting amount of the named statement is the total of the charges that statement lists for the claimant, each at its posted amount, the named statement being the most recently mailed statement of benefit charges on the position.
        In the standard computation no credit is taken out of the protest, the protest documentation share is zero, the answer share is one, no monthly protest interest arises, and no interest month is counted.
      params: [support_none, answer_share_other]
    prerequisite: []
    cross_category:
      - category: taxacct
        as: history
        reads: [variant_name, employer_tax_ledger.amount, employer_tax_ledger.bill_due_date, employer_tax_ledger.entry_date, employer_tax_ledger.component, employer_wage_reports.report_type, employer_wage_reports.filed_date, late_payment_interest_rate_monthly]
        note: The starting amount, the protest documentation share, the interest months and the monthly protest interest are read from the employer's tax account class, its quarterly bill, reserve posting, payment and interest entries, and its amended wage reports.
    compute:
      - stmt_quarter: "LATEST('charge_ledger','charge_quarter', date_field='statement_mailed_date', event_type='charge_statement_issued')"
      - listed_charges: "SUM('charge_ledger','amount', event_type='charge_benefit_posted', charge_quarter=stmt_quarter)"
      - account_class: "CFIELD('taxacct','variant_name')"
      - billed_for_quarter: "XSUM('taxacct','employer_tax_ledger','amount', event_type='taxacct_reimbursement_billed', quarter=stmt_quarter)"
      - reserve_posted_for_quarter: "XSUM('taxacct','employer_tax_ledger','amount', event_type='taxacct_charges_posted', quarter=stmt_quarter)"
      - starting_amount: "billed_for_quarter if ('Reimbursing' in account_class and billed_for_quarter > 0) else (reserve_posted_for_quarter if ('Contributory' in account_class and reserve_posted_for_quarter > 0) else listed_charges)"
      - credits_all: "SUM('charge_ledger','amount', event_type='charge_credit_reversed')"
      - credits_in_quarter: "SUM('charge_ledger','amount', event_type='charge_credit_reversed', charge_quarter=stmt_quarter)"
      - recovery_credits_outside: "COUNT('charge_ledger', event_type='charge_credit_reversed', credit_reason='overpayment_recovered') - COUNT('charge_ledger', event_type='charge_credit_reversed', credit_reason='overpayment_recovered', charge_quarter=stmt_quarter)"
      - cancel_credits_outside: "SUM('charge_ledger','amount', event_type='charge_credit_reversed', credit_reason='payment_cancelled') - SUM('charge_ledger','amount', event_type='charge_credit_reversed', credit_reason='payment_cancelled', charge_quarter=stmt_quarter)"
      - credits_taken_out: "(credits_all - credits_in_quarter) if recovery_credits_outside > 0 else (cancel_credits_outside if cancel_credits_outside > 0 else 0)"
      - amended_quarters: "XCOUNT('taxacct','employer_wage_reports', within_months=K('support_window_months'), date_field='filed_date', report_type='amended')"
      - support_share: "K('support_full') if amended_quarters >= K('support_full_quarters') else (K('support_half') if amended_quarters >= 1 else K('support_none'))"
      - responses_on_record: "COUNT('charge_requests', request_type='separation_response')"
      - response_days_late: "(DAYS(F('response_due_date'), F('response_date')) if F('response_timeliness') != 'late_good_cause' else 0) if responses_on_record > 0 else 0"
      - answer_share: "K('answer_share_unanswered') if responses_on_record == 0 else (K('answer_share_late') if response_days_late > 0 else K('answer_share_other'))"
      - disputed_principal: "MX(0, starting_amount - credits_taken_out)"
      - protested_principal: "RND(disputed_principal * support_share * answer_share, 2)"
      - bill_due: "XLATEST('taxacct','employer_tax_ledger','bill_due_date', date_field='entry_date', event_type='taxacct_reimbursement_billed', quarter=stmt_quarter)"
      - bill_paid_on: "XLATEST('taxacct','employer_tax_ledger','entry_date', date_field='entry_date', event_type='taxacct_payment_received', component='reimbursement', quarter=stmt_quarter)"
      - interest_months: "(MONTHS(bill_due, bill_paid_on) + 1) if (bill_due and bill_paid_on and DAYS(bill_due, bill_paid_on) > 0) else ((MONTHS(bill_due, NOW) + 1) if (bill_due and not bill_paid_on and DAYS(bill_due, NOW) > 0) else 0)"
      - interest_assessed_latest: "XLATEST('taxacct','employer_tax_ledger','amount', date_field='entry_date', event_type='taxacct_interest_assessed', quarter=stmt_quarter) or 0"
      - class_interest_rate: "CPARAM('taxacct','late_payment_interest_rate_monthly') or 0"
      - monthly_interest: "(interest_assessed_latest * protested_principal / billed_for_quarter) if (interest_assessed_latest > 0 and billed_for_quarter > 0) else ((protested_principal * class_interest_rate) if ('Reimbursing' in account_class and billed_for_quarter > 0 and bill_due and DAYS(bill_due, NOW) > 0) else 0)"
      - protest_interest: "RND(monthly_interest * interest_months, 2)"
      - result: "RND(protested_principal + protest_interest, 2)"
    factors:
      - id: statement_starting_amount
        effect: method
        decides: starting_amount
        bindings: [account_class, billed_for_quarter, reserve_posted_for_quarter, starting_amount]
        ladder:
          - when: "the employer finances benefits by reimbursement and has been billed for the statement's quarter"
            method: "the starting amount is the amount billed for that quarter"
          - when: "the employer is contributory and the quarter's charges have been posted to its reserve account"
