# Policy charter: Employer Benefit Charging (employer side).
# One holding = one employer account's chargeable position on one claim: the notice of claim, the employer's response,
# the benefit charges posted to it from each payment, and any protest or relief.
category: charge
display_name: Employer Benefit Charging

binding:
  holding_table: charge_positions
  event_tables: [charge_ledger]
  intake_tables: [charge_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {total_charged: charged_benefits}

lifecycle:
  states: [noticed, responded, chargeable, protest_pending, relieved, closed]
  transitions:
    - {from: noticed, to: responded, by: user, means: The employer (or its authorized agent) submits its separation and wage response to the notice of claim.}
    - {from: noticed, to: chargeable, by: system, means: The response window passed with no response, and the position is chargeable without relief.}
    - {from: responded, to: chargeable, by: agent, means: The determination on the employer's response grants no relief.}
    - {from: responded, to: relieved, by: agent, means: The determination on the employer's response grants relief.}
    - {from: chargeable, to: protest_pending, by: user, means: The employer files a written protest of charges on a statement.}
    - {from: protest_pending, to: relieved, by: agent, means: The protest is granted.}
    - {from: protest_pending, to: chargeable, by: agent, means: The protest is denied.}
    - {from: chargeable, to: relieved, by: system, means: An appeal decision relieves the employer of the charges.}
    - {from: chargeable, to: closed, by: system, means: The claim closed and the last statement's protest window passed.}
    - {from: relieved, to: closed, by: system, means: The claim closed and the last statement's protest window passed.}

accounts:
  - key: charged_benefits
    unit: USD
    meaning: Benefits charged to this employer on this claim - charges posted from each payment less credits for relief, recovered overpayments, cancelled payments and appeal reversals.

parameter_schema:
  notice_of_claim_mailing_business_days: "Business days after the claim is filed by which the notice of claim is mailed to the employer (business days)"
  notice_recipient: "Where notices and statements are sent (enum)"
  response_window_days: "Calendar days after the notice of claim mailing date within which the employer's separation and wage response must be received (days)"
  response_channels: "Channels through which a response is accepted (list)"
  response_timeliness_basis: "Date that counts as the response date (enum)"
  response_extension_allowed: "Whether the response deadline can be extended on request (boolean)"
  late_response_good_cause_accepted: "Whether a late response is treated as timely when good cause is shown (boolean)"
  relief_bar_for_payments_before_late_response: "Whether payments issued before a late response stay charged even if relief is later granted (boolean)"
  authorized_agent_allowed: "Whether a third-party administrator with a power of attorney on file may respond and protest for the employer (boolean)"
  pattern_failure_min_count: "Untimely or inadequate responses in the lookback that, together with the rate test, form a pattern of failure (count)"
  pattern_failure_rate: "Share of the employer's notices in the lookback answered untimely or inadequately that, together with the count test, forms a pattern of failure (decimal)"
  pattern_lookback_days: "Calendar days before the overpayment determination over which responses are counted for the pattern test (days)"
  share_denominator: "Wages the employer's base-period wages are divided by to get its charge share (enum)"
  charge_share_rounding: "Precision of the charge share (enum: four_decimals)"
  charge_amount_rounding: "Rounding of each charge (enum: nearest_cent)"
  regular_program_charge_share: "Share of the employer's proportional part of a regular-program payment that is charged (decimal)"
  eb_charge_share: "Share of the employer's proportional part of an Extended Benefits payment that is charged (decimal)"
  charge_posting_timing: "When a charge is posted (enum)"
  charges_billed_to_employer: "Whether the employer pays its charges dollar for dollar by reimbursement bill instead of through its rate (boolean)"
  relief_voluntary_quit_without_good_cause: "Whether relief is available when the claimant left this employer voluntarily without good cause attributable to it (boolean)"
  relief_discharge_misconduct: "Whether relief is available when this employer discharged the claimant for misconduct connected with the work (boolean)"
  relief_refused_suitable_work: "Whether relief is available from charges after the claimant refused suitable work offered by this employer (boolean)"
  relief_continuing_part_time: "Whether relief is available while this employer keeps employing the claimant part time as in the base period (boolean)"
  relief_agency_error: "Whether relief is available for benefits paid in error by the agency (boolean)"
  relief_not_base_period_employer: "Whether relief is available when the employer paid the claimant no base-period wages or the wages charged are wrong (boolean)"
  relief_scope: "Which charges a relief removes (enum)"
  part_time_relief_hours_basis: "Hours test for continuing part-time relief (enum)"
  relieved_charges_to: "Account that absorbs relieved charges (enum)"
  eb_relief_follows_regular: "Whether relief granted on the regular claim also relieves the employer's Extended Benefits charges on it (boolean)"
  statement_frequency: "How often the statement of benefit charges is issued (enum)"
  statement_mailing_days_after_quarter: "Calendar days after the quarter ends by which the statement of charges is mailed (days)"
  statement_delivery: "How statements are delivered (enum)"
  protest_window_days: "Calendar days after the statement mailing date within which a protest of charges must be received (days)"
  protest_channels: "Channels through which a written protest is accepted (list)"
  protest_requires_new_ground: "Whether a protest may raise only grounds not already decided by a determination or appeal decision (boolean)"
  protest_decision_business_days: "Business days after receipt within which a protest is decided (business days)"
  protest_denial_appeal_docket: "Docket on which a protest denial is appealed (enum)"
  overpayment_recovery_credit: "Whether principal recovered on an overpayment is credited back to the employers it was charged to (boolean)"
  cancelled_payment_credit: "Whether a cancelled payment's charge is credited back (boolean)"
  credit_application: "Where a credit appears (enum)"
  reissue_charge_rule: "How a reissued payment is charged (enum: original_charge_stands_no_second_charge)"
  statement_detail_level: "Detail printed for each position on the statement (enum)"
  position_closure_basis: "When a position closes (enum)"
  max_positions_per_claim_per_account: "Charge positions one employer account may hold on one claim (count)"
  cwc_wage_transfer_basis: "Wages that make an employer chargeable on a combined wage claim (enum)"
  noncharged_programs: "Programs whose payments never open or charge a position (list)"
  relief_effective_from: "First payment from which a granted relief removes charges (enum)"
  response_adequacy_standard: "What makes a response adequate for the pattern test (enum)"
  appeal_reversal_credit: "Whether charges are credited back when an appeal decision relieves the employer (boolean)"

