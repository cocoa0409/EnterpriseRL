  - id: charge_ext_protest_relief_credit
    base_policy_refs: [charge_evt_relief_grounds, charge_evt_statement_and_protest, charge_evt_credits, charge_evt_notice_and_response, charge_agg_proportional_share]
    overwrite:
      - base_policy: charge_evt_relief_grounds
        superseded_clause: >-
          A granted relief credits back every charge already posted within its scope
        replaced_by: >-
          The relief credit of a protest decision is the relief reach, less the credits deducted from it, never below zero, times the answer abatement, never more than the charge still standing on the position (every charge posted less every credit posted), rounded to the cent, and it is booked against the single posted charge that still stands within the relief reach.
      - base_policy: charge_evt_credits
        superseded_clause: >-
          A relief credits the whole remaining charge of every posting within the relief's scope
        replaced_by: >-
          The relief credit of a protest decision is the relief reach, less the credits deducted from it, never below zero, times the answer abatement, never more than the charge still standing on the position (every charge posted less every credit posted), rounded to the cent, and it is booked against the single posted charge that still stands within the relief reach. This replacement governs only the relief credit of a protest decision; a relief that an appeal decision grants still credits the whole remaining charge of every posting within the relief's scope.
      - base_policy: charge_evt_notice_and_response
        superseded_clause: >-
          otherwise payments issued before the late response stay charged even if relief is later granted
        replaced_by: >-
          For a protest decision the class term that payments issued before a late response stay charged even if relief is later granted is applied only through the answer abatement: a separation response received after the response due date without good cause abates the relief credit, and no payment is kept charged on that account beyond it.
    trigger: on_request
    subject: [charge_protest_granted]
    computes: relief_credit_amount
    target_tool: grant_charge_protest_0f56e95e
    params:
      support_full: 1.00
      support_half: 0.50
      support_none: 0.00
      support_full_quarters: 4
      support_window_months: 12
      abatement_unanswered: 0.80
      abatement_late: 0.90
      abatement_other: 1.00
    rule: >-
      When a pending protest of benefit charges is granted, the position is relieved and a relief credit is posted for the protest decision.
      The relief credit of a protest decision is fixed only after the position carries a pending written protest of the statement, with the protest ground and the protest date recorded on it.
      The relief credit of a protest decision is the relief reach, less the credits deducted from it, never below zero, times the answer abatement, never more than the charge still standing on the position (every charge posted less every credit posted), rounded to the cent, and it is booked against the single posted charge that still stands within the relief reach.
      This replacement governs only the relief credit of a protest decision; a relief that an appeal decision grants still credits the whole remaining charge of every posting within the relief's scope.
      For a protest decision the class term that payments issued before a late response stay charged even if relief is later granted is applied only through the answer abatement: a separation response received after the response due date without good cause abates the relief credit, and no payment is kept charged on that account beyond it.
      In the standard decision a protest is an answer given after the notice-of-claim window has closed, so the relief reach takes in no charge already posted, no credit is deducted, the wage-record relief share is zero, and the answer abatement is one.
      Where the recorded protest ground disputes the employer's base-period wages or its base-period status, the relief reach is every charge posted on the claim times the wage-record relief share; where the recorded ground is that the benefits were paid in error by the agency or that a recovered overpayment was not credited, the relief reach is the total of the charges posted in the quarter of the statement the protest names; any other recorded ground takes in no charge already posted.
      Where a credit for a recovered overpayment stands on the position, every credit already posted on the position is deducted; where credits for cancelled payments stand on it but none for a recovered overpayment, those cancelled-payment credits are deducted; where no credit stands on it, nothing is deducted.
      Charges reached on a wage-record ground are taken at the wage-record relief share: the whole when the amended wage reports the employer filed within the last twelve months number at least four, one half when they number one to three, and zero when it has filed no amended wage report in that time.
      The answer abatement is four fifths when no separation response to the notice of claim is on record for the position, nine tenths when the separation response on record was received after the response due date without good cause, and the whole otherwise.
    baseline:
      rule: >-
        The relief credit of a protest decision is the relief reach, less the credits deducted from it, never below zero, times the answer abatement, never more than the charge still standing on the position (every charge posted less every credit posted), rounded to the cent, and it is booked against the single posted charge that still stands within the relief reach.
        In the standard decision a protest is an answer given after the notice-of-claim window has closed, so the relief reach takes in no charge already posted, no credit is deducted, the wage-record relief share is zero, and the answer abatement is one.
      params: [support_none, abatement_other]
    prerequisite:
      - problem: charge_ext_protest_amount
        kind: value_input
        gate: protest_ground_recorded
        form: state
        policy_source: >-
          The relief credit of a protest decision is fixed only after the position carries a pending written protest of the statement, with the protest ground and the protest date recorded on it.
        condition: >-
          The charge position is in protest_pending status with a protest_date and a protest_ground other than none, and a charge protest submission for the protested statement quarter is on record for it.
        resolved_by: file_charge_protest_73ec7ae2
        effect: >-
          Once the protest is lodged, the recorded protest ground selects the relief reach (a wage-record ground reaches every charge posted on the claim) and the protest names the statement quarter, so the relief credit moves from zero to the standing charge left after deductions and abatement.
    cross_category:
      - category: taxacct
        as: history
        reads: [employer_wage_reports.report_type, employer_wage_reports.filed_date]
        note: The wage-record relief share is decided by the count of amended wage reports the employer filed on its tax account within the last twelve months.
    compute:
      - protest_ground_recorded: "F('protest_ground')"
      - protested_quarter: "LATEST('charge_requests','charge_quarter', date_field='submitted_date', request_type='charge_protest')"
      - charges_on_claim: "SUM('charge_ledger','amount', event_type='charge_benefit_posted')"
      - charges_in_protested_quarter: "SUM('charge_ledger','amount', event_type='charge_benefit_posted', charge_quarter=protested_quarter)"
      - amended_quarters: "XCOUNT('taxacct','employer_wage_reports', within_months=K('support_window_months'), date_field='filed_date', report_type='amended')"
      - support_share: "K('support_full') if amended_quarters >= K('support_full_quarters') else (K('support_half') if amended_quarters >= 1 else K('support_none'))"
      - relief_reach: "(charges_on_claim * support_share) if (protest_ground_recorded == 'not_base_period_employer' or protest_ground_recorded == 'wrong_wages') else (charges_in_protested_quarter if (protest_ground_recorded == 'agency_error' or protest_ground_recorded == 'overpayment_recovered') else 0)"
      - recovery_credit_count: "COUNT('charge_ledger', event_type='charge_credit_reversed', credit_reason='overpayment_recovered')"
      - cancel_credit_count: "COUNT('charge_ledger', event_type='charge_credit_reversed', credit_reason='payment_cancelled')"
      - all_credits_posted: "SUM('charge_ledger','amount', event_type='charge_credit_reversed')"
      - cancel_credits_posted: "SUM('charge_ledger','amount', event_type='charge_credit_reversed', credit_reason='payment_cancelled')"
      - credits_deducted: "all_credits_posted if recovery_credit_count > 0 else (cancel_credits_posted if cancel_credit_count > 0 else 0)"
      - separation_responses: "COUNT('charge_requests', request_type='separation_response')"
      - days_response_late: "(DAYS(F('response_due_date'), F('response_date')) if F('response_timeliness') != 'late_good_cause' else 0) if separation_responses > 0 else 0"
      - answer_abatement: "K('abatement_unanswered') if separation_responses == 0 else (K('abatement_late') if days_response_late > 0 else K('abatement_other'))"
      - standing_on_position: "MX(0, charges_on_claim - all_credits_posted)"
      - result: "RND(MN(MX(0, relief_reach - credits_deducted) * answer_abatement, standing_on_position), 2)"
    factors:
      - id: relief_reach
        effect: method
        decides: relief_reach
        bindings: [protest_ground_recorded, protested_quarter, charges_on_claim, charges_in_protested_quarter, relief_reach]
        ladder:
          - when: "the recorded protest ground disputes the employer's base-period wages or its base-period status"
            method: "every charge posted on the claim, times the wage-record relief share"
          - when: "the recorded protest ground is that the benefits were paid in error by the agency or that a recovered overpayment was not credited"
            method: "the total of the charges posted in the quarter of the statement the protest names"
          - when: "otherwise"
            method: "no charge already posted is reached"
        baseline: {relief_reach: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: credits_deducted
        effect: method
        decides: credits_deducted
        bindings: [recovery_credit_count, cancel_credit_count, all_credits_posted, cancel_credits_posted, credits_deducted]
        ladder:
          - when: "a credit for a recovered overpayment stands on the position"
            method: "every credit already posted on the position is deducted"
          - when: "credits for cancelled payments stand on the position but none for a recovered overpayment"
            method: "those cancelled-payment credits are deducted"
          - when: "otherwise"
            method: "nothing is deducted"
        baseline: {credits_deducted: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: wage_record_relief_share
        effect: parameter
        decides: support_share
        bindings: [amended_quarters, support_share]
        ladder:
          - when: "the amended wage reports the employer filed within the last twelve months number at least four"
            value: "K('support_full') = 1.00"
          - when: "the amended wage reports the employer filed within the last twelve months number one to three"
            value: "K('support_half') = 0.50"
          - when: "otherwise"
            value: "K('support_none') = 0.00"
        baseline: {support_share: "K('support_none')"}
        evidence: [cross_category]
        cross_difficulty: taxacct
      - id: answer_abatement
        effect: parameter
        decides: answer_abatement
        bindings: [separation_responses, days_response_late, answer_abatement]
        ladder:
          - when: "no separation response to the notice of claim is on record for the position"
            value: "K('abatement_unanswered') = 0.80"
          - when: "the separation response on record was received after the response due date without good cause"
            value: "K('abatement_late') = 0.90"
          - when: "otherwise"
            value: "K('abatement_other') = 1.00"
        baseline: {answer_abatement: "K('abatement_other')"}
        evidence: [history, date]
        cross_difficulty: null
    inputs:
      history:
        - {table: charge_ledger, aggregate: sum, field: amount, filters: {event_type: charge_benefit_posted}}
        - {table: charge_ledger, aggregate: sum, field: amount, filters: {event_type: charge_credit_reversed}}
        - {table: charge_requests, aggregate: count, field: charge_request_id, filters: {request_type: separation_response}}
        - {category: taxacct, table: employer_wage_reports, aggregate: count, field: wage_report_id, within_months: 12, filters: {report_type: amended}}
      cross_category: [taxacct]
    compute_basis:
      protest_ground_recorded: "Where the recorded protest ground disputes the employer's base-period wages or its base-period status"
      protested_quarter: "the relief reach is the total of the charges posted in the quarter of the statement the protest names"
      charges_on_claim: "the relief reach is every charge posted on the claim times the wage-record relief share"
      charges_in_protested_quarter: "the relief reach is the total of the charges posted in the quarter of the statement the protest names"
      amended_quarters: "the whole when the amended wage reports the employer filed within the last twelve months number at least four"
      support_share: "Charges reached on a wage-record ground are taken at the wage-record relief share: the whole when the amended wage reports the employer filed within the last twelve months number at least four, one half when they number one to three, and zero when it has filed no amended wage report in that time."
      relief_reach: "Where the recorded protest ground disputes the employer's base-period wages or its base-period status, the relief reach is every charge posted on the claim times the wage-record relief share; where the recorded ground is that the benefits were paid in error by the agency or that a recovered overpayment was not credited, the relief reach is the total of the charges posted in the quarter of the statement the protest names; any other recorded ground takes in no charge already posted."
      recovery_credit_count: "Where a credit for a recovered overpayment stands on the position, every credit already posted on the position is deducted"
      cancel_credit_count: "where credits for cancelled payments stand on it but none for a recovered overpayment, those cancelled-payment credits are deducted"
      all_credits_posted: "every credit already posted on the position is deducted"
      cancel_credits_posted: "those cancelled-payment credits are deducted"
      credits_deducted: "Where a credit for a recovered overpayment stands on the position, every credit already posted on the position is deducted; where credits for cancelled payments stand on it but none for a recovered overpayment, those cancelled-payment credits are deducted; where no credit stands on it, nothing is deducted."
      separation_responses: "four fifths when no separation response to the notice of claim is on record for the position"
      days_response_late: "nine tenths when the separation response on record was received after the response due date without good cause"
      answer_abatement: "The answer abatement is four fifths when no separation response to the notice of claim is on record for the position, nine tenths when the separation response on record was received after the response due date without good cause, and the whole otherwise."
      standing_on_position: "never more than the charge still standing on the position (every charge posted less every credit posted)"
      result: "The relief credit of a protest decision is the relief reach, less the credits deducted from it, never below zero, times the answer abatement, never more than the charge still standing on the position (every charge posted less every credit posted), rounded to the cent"
  - id: charge_ext_response_disputed_amount
    base_policy_refs: [charge_evt_notice_and_response, charge_evt_relief_grounds, charge_evt_credits, charge_agg_proportional_share]
    overwrite: []
    trigger: on_request
    subject: [charge_separation_response_filed]
    computes: disputed_charge_amount
    target_tool: submit_separation_response_153a3a70
    params:
      class_share_full: 1.00
      class_share_none: 0.00
      answer_on_time: 1.00
      answer_late: 0.90
      answer_late_charged: 0.75
    rule: >-
      A separation response that answers a notice of claim after benefits have already been charged on the claim states a disputed charge amount, the money the response puts in dispute, worked out on the day the response is received.
      The disputed charge amount is the financing basis of the charges the response counts, less the charges it leaves out, never below zero, times the response class share and times the answer window share, rounded to the cent.
      In the standard computation, with no factor applied, the response counts no charge, the financing basis is nothing and no charge is left out; the response class share takes its default of zero, the value an Extended Benefits state-share position receives because its relief follows the determination on the regular claim; and the answer window share takes its default of three quarters, the value of a late answer once a payment has been charged while it was overdue.
      Where no statement of benefit charges has yet been mailed for the position and charges have been posted, the response counts every charge posted on the claim; where a statement has been mailed and it lists charges, the response counts the charges listed on the most recently mailed statement; otherwise the response counts no charge.
      The financing basis of the counted charges is, where the employer's tax account finances benefits by contributions and holds a reserve account credited with its contributions, the counted charges themselves, every one of which reaches that reserve account; where the tax account finances benefits by reimbursement and has been billed for the quarter of the most recently mailed statement, the amount billed for that quarter; and nothing otherwise, a reimbursing employer not yet billed having paid nothing a response could dispute.
      Where any credit other than a cancelled-payment credit stands on the position, every credit on the position is left out; where only credits for cancelled payments stand on it, the charges they reverse are left out at the amount of those cancelled-payment credits; where no credit stands, nothing is left out.
      The response class share is the whole when the position charges a regular or combined wage claim and its charge class allows relief for a voluntary quit, a discharge for misconduct and a refused offer of work; when the class allows continuing part-time relief and none of those separation grounds, it is the most recent charge posted over the counted charges, the one week a continuing-employment answer can contest; and zero otherwise, as on an Extended Benefits state-share position, whose relief follows the determination on the regular claim.
      The answer window share is the whole when the response is received no later than the response window after the notice of claim mailing date; nine tenths when it is received after the response due date and no benefit charge has been posted on the position after that due date; and three quarters otherwise, a response received after the due date when a payment has been charged while the answer was overdue.
    baseline:
      rule: >-
        The disputed charge amount is the financing basis of the charges the response counts, less the charges it leaves out, never below zero, times the response class share and times the answer window share, rounded to the cent.
        In the standard computation, with no factor applied, the response counts no charge, the financing basis is nothing and no charge is left out; the response class share takes its default of zero, the value an Extended Benefits state-share position receives because its relief follows the determination on the regular claim; and the answer window share takes its default of three quarters, the value of a late answer once a payment has been charged while it was overdue.
      params: [class_share_none, answer_late_charged]
    prerequisite: []
    cross_category:
      - category: taxacct
        as: history
        reads: [variant_name, employer_tax_ledger.event_type, employer_tax_ledger.amount]
        note: The financing basis is read from the employer's tax account class, the contributions credited to a contributory employer's reserve account and, for a reimbursing employer, the amount billed for the quarter of the most recently mailed statement.
    compute:
      - statements_mailed: "COUNT('charge_ledger', event_type='charge_statement_issued')"
      - latest_statement_quarter: "LATEST('charge_ledger','charge_quarter', date_field='statement_mailed_date', event_type='charge_statement_issued')"
      - charges_posted: "SUM('charge_ledger','amount', event_type='charge_benefit_posted')"
      - charges_on_latest_statement: "SUM('charge_ledger','amount', event_type='charge_benefit_posted', charge_quarter=latest_statement_quarter)"
      - counted_charges: "charges_posted if (statements_mailed == 0 and charges_posted > 0) else (charges_on_latest_statement if (statements_mailed > 0 and charges_on_latest_statement > 0) else 0)"
      - account_class: "CFIELD('taxacct','variant_name') or ''"
      - billed_latest_quarter: "XSUM('taxacct','employer_tax_ledger','amount', event_type='taxacct_reimbursement_billed', quarter=latest_statement_quarter)"
      - reserve_credits_on_record: "XCOUNT('taxacct','employer_tax_ledger', event_type='taxacct_reserve_credited')"
      - basis_amount: "counted_charges if ('Contributory' in account_class and reserve_credits_on_record > 0) else (billed_latest_quarter if ('Reimbursing' in account_class and billed_latest_quarter > 0) else 0)"
      - cancelled_credit_count: "COUNT('charge_ledger', event_type='charge_credit_reversed', credit_reason='payment_cancelled')"
      - other_credit_count: "COUNT('charge_ledger', event_type='charge_credit_reversed') - cancelled_credit_count"
      - cancelled_credits: "SUM('charge_ledger','amount', event_type='charge_credit_reversed', credit_reason='payment_cancelled')"
      - every_credit: "SUM('charge_ledger','amount', event_type='charge_credit_reversed')"
      - charges_left_out: "every_credit if other_credit_count > 0 else (cancelled_credits if cancelled_credit_count > 0 else 0)"
      - separation_relief_class: "P('relief_voluntary_quit_without_good_cause') and P('relief_discharge_misconduct') and P('relief_refused_suitable_work') and ('Extended Benefits' not in F('variant_name'))"
      - part_time_only_class: "P('relief_continuing_part_time') and not (P('relief_voluntary_quit_without_good_cause') or P('relief_discharge_misconduct') or P('relief_refused_suitable_work'))"
      - latest_charge: "LATEST('charge_ledger','amount', date_field='entry_date', event_type='charge_benefit_posted') or 0"
      - class_share: "K('class_share_full') if separation_relief_class else ((latest_charge / counted_charges) if (part_time_only_class and counted_charges > 0) else K('class_share_none'))"
      - days_past_due: "DAYS(F('response_due_date'), NOW) if F('response_due_date') else 0"
      - latest_charge_date: "LATEST('charge_ledger','entry_date', date_field='entry_date', event_type='charge_benefit_posted')"
      - charged_after_due: "(DAYS(F('response_due_date'), latest_charge_date) > 0) if (latest_charge_date and F('response_due_date')) else False"
      - window_share: "K('answer_on_time') if days_past_due <= 0 else (K('answer_late') if not charged_after_due else K('answer_late_charged'))"
      - result: "RND(MX(0, basis_amount - charges_left_out) * class_share * window_share, 2)"
    factors:
      - id: response_counted_charges
        effect: method
        decides: counted_charges
        bindings: [statements_mailed, latest_statement_quarter, charges_posted, charges_on_latest_statement, counted_charges]
        ladder:
          - when: "no statement of benefit charges has yet been mailed for the position and charges have been posted"
            method: "every charge posted on the claim is counted"
          - when: "a statement has been mailed and it lists charges"
            method: "the charges listed on the most recently mailed statement are counted"
          - when: "otherwise"
            method: "no charge is counted"
        baseline: {counted_charges: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: response_financing_basis
        effect: method
        decides: basis_amount
        bindings: [account_class, reserve_credits_on_record, billed_latest_quarter, basis_amount]
        ladder:
          - when: "the employer's tax account finances benefits by contributions and holds a reserve account credited with its contributions"
            method: "the counted charges themselves, every one of which reaches that reserve account"
          - when: "the tax account finances benefits by reimbursement and has been billed for the quarter of the most recently mailed statement"
            method: "the amount billed for that quarter"
          - when: "otherwise"
            method: "nothing is valued"
        baseline: {basis_amount: "0"}
        evidence: [cross_category, history]
        cross_difficulty: taxacct
      - id: response_charges_left_out
        effect: method
        decides: charges_left_out
        bindings: [cancelled_credit_count, other_credit_count, cancelled_credits, every_credit, charges_left_out]
        ladder:
          - when: "a credit other than a cancelled-payment credit stands on the position"
            method: "every credit on the position is left out"
          - when: "only credits for cancelled payments stand on the position"
            method: "the charges those credits reverse are left out at the amount of the cancelled-payment credits"
          - when: "otherwise"
            method: "nothing is left out"
        baseline: {charges_left_out: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: response_class_share
        effect: parameter
        decides: class_share
        bindings: [separation_relief_class, part_time_only_class, latest_charge, class_share]
        ladder:
          - when: "the position charges a regular or combined wage claim and its charge class allows relief for a voluntary quit, a discharge for misconduct and a refused offer of work"
            value: "K('class_share_full') = 1.00"
          - when: "the class allows continuing part-time relief and none of those separation grounds"
            value: "the most recent charge posted over the counted charges"
          - when: "otherwise"
            value: "K('class_share_none') = 0.00"
        baseline: {class_share: "K('class_share_none')"}
        evidence: [tier_param, history]
        cross_difficulty: null
      - id: answer_window_share
        effect: parameter
        decides: window_share
        bindings: [days_past_due, latest_charge_date, charged_after_due, window_share]
        ladder:
          - when: "the response is received no later than the response window after the notice of claim mailing date"
            value: "K('answer_on_time') = 1.00"
          - when: "the response is received after the response due date and no benefit charge has been posted on the position after that due date"
            value: "K('answer_late') = 0.90"
          - when: "otherwise"
            value: "K('answer_late_charged') = 0.75"
        baseline: {window_share: "K('answer_late_charged')"}
        evidence: [date, history]
        cross_difficulty: null
    inputs:
      history:
        - {table: charge_ledger, aggregate: sum, field: amount, filters: {event_type: charge_benefit_posted}}
        - {table: charge_ledger, aggregate: sum, field: amount, filters: {event_type: charge_credit_reversed}}
        - {table: charge_ledger, aggregate: count, field: charge_entry_id, filters: {event_type: charge_statement_issued}}
        - {table: charge_ledger, aggregate: latest, field: amount, filters: {event_type: charge_benefit_posted}}
        - {category: taxacct, table: employer_tax_ledger, aggregate: sum, field: amount, filters: {event_type: taxacct_reimbursement_billed}}
        - {category: taxacct, table: employer_tax_ledger, aggregate: count, field: tax_entry_id, filters: {event_type: taxacct_reserve_credited}}
      cross_category: [taxacct]
    compute_basis:
      statements_mailed: "Where no statement of benefit charges has yet been mailed for the position and charges have been posted"
      latest_statement_quarter: "the response counts the charges listed on the most recently mailed statement"
      charges_posted: "the response counts every charge posted on the claim"
      charges_on_latest_statement: "the response counts the charges listed on the most recently mailed statement"
      counted_charges: "Where no statement of benefit charges has yet been mailed for the position and charges have been posted, the response counts every charge posted on the claim; where a statement has been mailed and it lists charges, the response counts the charges listed on the most recently mailed statement; otherwise the response counts no charge."
      account_class: "where the employer's tax account finances benefits by contributions"
      reserve_credits_on_record: "holds a reserve account credited with its contributions"
      billed_latest_quarter: "has been billed for the quarter of the most recently mailed statement, the amount billed for that quarter"
      basis_amount: "The financing basis of the counted charges is, where the employer's tax account finances benefits by contributions and holds a reserve account credited with its contributions, the counted charges themselves, every one of which reaches that reserve account; where the tax account finances benefits by reimbursement and has been billed for the quarter of the most recently mailed statement, the amount billed for that quarter; and nothing otherwise, a reimbursing employer not yet billed having paid nothing a response could dispute."
      cancelled_credit_count: "where only credits for cancelled payments stand on it"
      other_credit_count: "Where any credit other than a cancelled-payment credit stands on the position, every credit on the position is left out"
