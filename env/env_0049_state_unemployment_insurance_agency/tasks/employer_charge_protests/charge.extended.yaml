  - id: charge_ext_response_relief_credit
    base_policy_refs: [charge_evt_relief_grounds, charge_evt_notice_and_response, charge_evt_credits, charge_agg_proportional_share]
    overwrite:
      - base_policy: charge_evt_relief_grounds
        superseded_clause: >-
          A granted relief credits back every charge already posted within its scope
        replaced_by: >-
          The relief credit of a determination on a separation response is the relief window times the relief ground share, less the credits netted from it, never below zero, times the relief answer share, rounded to the cent, and it is booked against the single posted charge that still stands within the relief window; because the credits netted are every credit standing on the position, the relief credit never exceeds the charge still standing there.
      - base_policy: charge_evt_credits
        superseded_clause: >-
          A relief credits the whole remaining charge of every posting within the relief's scope
        replaced_by: >-
          The relief credit of a determination on a separation response is the relief window times the relief ground share, less the credits netted from it, never below zero, times the relief answer share, rounded to the cent, and it is booked against the single posted charge that still stands within the relief window; because the credits netted are every credit standing on the position, the relief credit never exceeds the charge still standing there. This replacement governs only the relief credit of a determination on a separation response; a relief that an appeal decision grants still credits the whole remaining charge of every posting within the relief's scope.
      - base_policy: charge_evt_notice_and_response
        superseded_clause: >-
          otherwise payments issued before the late response stay charged even if relief is later granted
        replaced_by: >-
          For a determination on a separation response the class term that payments issued before a late response stay charged even if relief is later granted is applied only through the relief answer share: a response received after the response due date without good cause takes the nine-tenths or three-quarters share, and no payment is kept charged on that account beyond it.
    trigger: on_request
    subject: [charge_relief_determined]
    computes: relief_credit_amount
    target_tool: determine_charge_relief_e2b9af19
    params:
      ground_share_full: 1.00
      ground_share_none: 0.00
      answer_on_time: 1.00
      answer_late: 0.90
      answer_late_charged: 0.75
    rule: >-
      When the determination on an employer's separation response grants relief, the position is relieved and a relief credit is posted for the determination.
      The relief credit of a determination on a separation response is not fixed until the position carries the employer's separation response, with the separation reason it reports and the date it was received recorded on it.
      The relief credit of a determination on a separation response is the relief window times the relief ground share, less the credits netted from it, never below zero, times the relief answer share, rounded to the cent, and it is booked against the single posted charge that still stands within the relief window; because the credits netted are every credit standing on the position, the relief credit never exceeds the charge still standing there.
      This replacement governs only the relief credit of a determination on a separation response; a relief that an appeal decision grants still credits the whole remaining charge of every posting within the relief's scope.
      For a determination on a separation response the class term that payments issued before a late response stay charged even if relief is later granted is applied only through the relief answer share: a response received after the response due date without good cause takes the nine-tenths or three-quarters share, and no payment is kept charged on that account beyond it.
      In the standard computation, with no factor applied, the relief window holds no charge and no credit is netted; the relief ground share takes its default of zero, the value of a reported separation for which no relief is due; and the relief answer share takes its default of three quarters, the value of an answer received after the due date without good cause once a payment had been charged while it was overdue.
      The relief window is every charge posted on the claim when no statement of benefit charges has yet been mailed for the position and charges have been posted, the charges listed on the most recently mailed statement when a statement has been mailed and it lists charges, and no charge otherwise.
      Where a credit for a cancelled payment stands on the position and no other kind of credit does, the cancelled-payment credits are netted; where any other kind of credit stands on the position, every credit on the position is netted; where no credit stands, nothing is netted.
      The relief ground share is the whole when the response on record reports a voluntary quit, a discharge for misconduct or a refused offer of work and the position's charge class allows relief for that ground; when the response on record reports that the employer still employs the claimant part time and the class allows continuing part-time relief, it is the most recent charge posted over the relief window, the week the response confirms the continuing employment; and zero otherwise.
      The relief answer share is the whole when the response on record was received no later than the response window after the notice of claim mailing date or late with good cause shown; nine tenths when it was received after the response due date without good cause and no benefit charge was posted on the position after that due date; and three quarters otherwise, a response received after the due date without good cause when a payment was charged while the answer was overdue.
    baseline:
      rule: >-
        The relief credit of a determination on a separation response is the relief window times the relief ground share, less the credits netted from it, never below zero, times the relief answer share, rounded to the cent, and it is booked against the single posted charge that still stands within the relief window; because the credits netted are every credit standing on the position, the relief credit never exceeds the charge still standing there.
        In the standard computation, with no factor applied, the relief window holds no charge and no credit is netted; the relief ground share takes its default of zero, the value of a reported separation for which no relief is due; and the relief answer share takes its default of three quarters, the value of an answer received after the due date without good cause once a payment had been charged while it was overdue.
      params: [ground_share_none, answer_late_charged]
    prerequisite:
      - problem: charge_ext_response_disputed_amount
        kind: value_input
        gate: reported_reason
        form: state
        policy_source: >-
          The relief credit of a determination on a separation response is not fixed until the position carries the employer's separation response, with the separation reason it reports and the date it was received recorded on it.
        condition: >-
          The charge position is in responded status with a response_date, a separation_reason_reported other than not_reported, and a separation_response submission on record for it.
        resolved_by: submit_separation_response_153a3a70
        effect: >-
          Once the response is lodged, the reported separation reason sets the relief ground share (a voluntary quit the class allows takes the whole relief window) and the response date sets the relief answer share, so the relief credit moves from zero to the standing charge left after netting.
    cross_category: []
    compute:
      - reported_reason: "F('separation_reason_reported')"
      - responses_on_record: "COUNT('charge_requests', request_type='separation_response')"
      - ground_allowed: "(reported_reason == 'voluntary_quit' and P('relief_voluntary_quit_without_good_cause')) or (reported_reason == 'discharge_misconduct' and P('relief_discharge_misconduct')) or (reported_reason == 'refused_offer_of_work' and P('relief_refused_suitable_work'))"
      - part_time_allowed: "reported_reason == 'still_employed_part_time' and P('relief_continuing_part_time')"
      - most_recent_charge: "LATEST('charge_ledger','amount', date_field='entry_date', event_type='charge_benefit_posted') or 0"
      - statements_on_record: "COUNT('charge_ledger', event_type='charge_statement_issued')"
      - last_statement_quarter: "LATEST('charge_ledger','charge_quarter', date_field='statement_mailed_date', event_type='charge_statement_issued')"
      - all_posted_charges: "SUM('charge_ledger','amount', event_type='charge_benefit_posted')"
      - last_statement_charges: "SUM('charge_ledger','amount', event_type='charge_benefit_posted', charge_quarter=last_statement_quarter)"
      - relief_window: "all_posted_charges if (statements_on_record == 0 and all_posted_charges > 0) else (last_statement_charges if (statements_on_record > 0 and last_statement_charges > 0) else 0)"
      - ground_share: "K('ground_share_full') if (responses_on_record > 0 and ground_allowed) else ((most_recent_charge / relief_window) if (responses_on_record > 0 and part_time_allowed and relief_window > 0) else K('ground_share_none'))"
      - cancel_credit_entries: "COUNT('charge_ledger', event_type='charge_credit_reversed', credit_reason='payment_cancelled')"
      - other_credit_entries: "COUNT('charge_ledger', event_type='charge_credit_reversed') - cancel_credit_entries"
      - cancel_credit_total: "SUM('charge_ledger','amount', event_type='charge_credit_reversed', credit_reason='payment_cancelled')"
      - credit_total: "SUM('charge_ledger','amount', event_type='charge_credit_reversed')"
      - credits_netted: "cancel_credit_total if (cancel_credit_entries > 0 and other_credit_entries == 0) else (credit_total if other_credit_entries > 0 else 0)"
      - response_late_days: "DAYS(F('response_due_date'), F('response_date')) if (responses_on_record > 0 and F('response_date')) else 0"
      - late_without_cause: "response_late_days > 0 and F('response_timeliness') != 'late_good_cause'"
      - last_charge_date: "LATEST('charge_ledger','entry_date', date_field='entry_date', event_type='charge_benefit_posted')"
      - charge_after_due: "(DAYS(F('response_due_date'), last_charge_date) > 0) if (last_charge_date and F('response_due_date')) else False"
      - answer_share: "K('answer_on_time') if not late_without_cause else (K('answer_late') if not charge_after_due else K('answer_late_charged'))"
      - result: "RND(MX(0, relief_window * ground_share - credits_netted) * answer_share, 2)"
    factors:
      - id: relief_window
        effect: method
        decides: relief_window
        bindings: [statements_on_record, last_statement_quarter, all_posted_charges, last_statement_charges, relief_window]
        ladder:
          - when: "no statement of benefit charges has yet been mailed for the position and charges have been posted"
            method: "every charge posted on the claim"
          - when: "a statement has been mailed and it lists charges"
            method: "the charges listed on the most recently mailed statement"
          - when: "otherwise"
            method: "no charge"
        baseline: {relief_window: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: credits_netted
        effect: method
        decides: credits_netted
        bindings: [cancel_credit_entries, other_credit_entries, cancel_credit_total, credit_total, credits_netted]
        ladder:
          - when: "a credit for a cancelled payment stands on the position and no other kind of credit does"
            method: "the cancelled-payment credits are netted"
          - when: "any other kind of credit stands on the position"
            method: "every credit on the position is netted"
          - when: "otherwise"
            method: "nothing is netted"
        baseline: {credits_netted: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: relief_ground_share
        effect: parameter
        decides: ground_share
        bindings: [reported_reason, responses_on_record, ground_allowed, part_time_allowed, most_recent_charge, ground_share]
        ladder:
          - when: "the response on record reports a voluntary quit, a discharge for misconduct or a refused offer of work, and the position's charge class allows relief for that ground"
            value: "K('ground_share_full') = 1.00"
          - when: "the response on record reports that the employer still employs the claimant part time, and the class allows continuing part-time relief"
            value: "the most recent charge posted over the relief window"
          - when: "otherwise"
            value: "K('ground_share_none') = 0.00"
        baseline: {ground_share: "K('ground_share_none')"}
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: relief_answer_share
        effect: parameter
        decides: answer_share
        bindings: [response_late_days, late_without_cause, last_charge_date, charge_after_due, answer_share]
        ladder:
          - when: "the response on record was received no later than the response window after the notice of claim mailing date, or late with good cause shown"
            value: "K('answer_on_time') = 1.00"
          - when: "the response on record was received after the response due date without good cause and no benefit charge was posted on the position after that due date"
            value: "K('answer_late') = 0.90"
          - when: "otherwise"
            value: "K('answer_late_charged') = 0.75"
        baseline: {answer_share: "K('answer_late_charged')"}
        evidence: [history, date]
        cross_difficulty: null
    inputs:
      history:
        - {table: charge_ledger, aggregate: sum, field: amount, filters: {event_type: charge_benefit_posted}}
        - {table: charge_ledger, aggregate: sum, field: amount, filters: {event_type: charge_credit_reversed}}
        - {table: charge_ledger, aggregate: latest, field: amount, filters: {event_type: charge_benefit_posted}}
        - {table: charge_requests, aggregate: count, field: charge_request_id, filters: {request_type: separation_response}}
      cross_category: []
    compute_basis:
      reported_reason: "when the response on record reports a voluntary quit, a discharge for misconduct or a refused offer of work"
      responses_on_record: "and zero when no response is on record"
      ground_allowed: "The relief ground share is the whole when the response on record reports a voluntary quit, a discharge for misconduct or a refused offer of work and the position's charge class allows relief for that ground"
      part_time_allowed: "when the response on record reports that the employer still employs the claimant part time and the class allows continuing part-time relief"
      most_recent_charge: "it is the most recent charge posted over the relief window, the week the response confirms the continuing employment"
      statements_on_record: "every charge posted on the claim when no statement of benefit charges has yet been mailed for the position and charges have been posted"
      last_statement_quarter: "the charges listed on the most recently mailed statement when a statement has been mailed and it lists charges"
      all_posted_charges: "every charge posted on the claim when no statement of benefit charges has yet been mailed for the position and charges have been posted"
      last_statement_charges: "the charges listed on the most recently mailed statement when a statement has been mailed and it lists charges"
      relief_window: "The relief window is every charge posted on the claim when no statement of benefit charges has yet been mailed for the position and charges have been posted, the charges listed on the most recently mailed statement when a statement has been mailed and it lists charges, and no charge otherwise."
      ground_share: "The relief ground share is the whole when the response on record reports a voluntary quit, a discharge for misconduct or a refused offer of work and the position's charge class allows relief for that ground; when the response on record reports that the employer still employs the claimant part time and the class allows continuing part-time relief, it is the most recent charge posted over the relief window, the week the response confirms the continuing employment; and zero otherwise."
      cancel_credit_entries: "Where a credit for a cancelled payment stands on the position and no other kind of credit does, the cancelled-payment credits are netted"
      other_credit_entries: "where any other kind of credit stands on the position, every credit on the position is netted"
      cancel_credit_total: "the cancelled-payment credits are netted"
      credit_total: "every credit on the position is netted"
      credits_netted: "Where a credit for a cancelled payment stands on the position and no other kind of credit does, the cancelled-payment credits are netted; where any other kind of credit stands on the position, every credit on the position is netted; where no credit stands, nothing is netted."
      response_late_days: "when the response on record was received after the response due date"
      late_without_cause: "received after the response due date without good cause"
      last_charge_date: "no benefit charge was posted on the position after that due date"
      charge_after_due: "a benefit charge was posted on the position after that due date, a payment having been charged while the answer was overdue"
      answer_share: "The relief answer share is the whole when the response on record was received no later than the response window after the notice of claim mailing date or late with good cause shown; nine tenths when it was received after the response due date without good cause and no benefit charge was posted on the position after that due date; and three quarters otherwise, a response received after the due date without good cause when a payment was charged while the answer was overdue."
      result: "The relief credit of a determination on a separation response is the relief window times the relief ground share, less the credits netted from it, never below zero, times the relief answer share, rounded to the cent"
