          - when: "the separation response on record was received after the response due date without good cause"
            value: "K('answer_share_late') = 0.90"
          - when: "otherwise"
            value: "K('answer_share_other') = 1.00"
        baseline: {answer_share: "K('answer_share_other')"}
        evidence: [history, date]
        cross_difficulty: null
      - id: interest_months
        effect: method
        decides: interest_months
        bindings: [bill_due, bill_paid_on, interest_months]
        ladder:
          - when: "the latest payment applied to the reimbursement bill for the statement's quarter was received after the bill's due date"
            method: "the whole months from the due date to that payment, plus one for the month in which it fell"
          - when: "no payment has been applied to that bill and its due date has passed"
            method: "the whole months from the due date to the protest, plus one for the month in which the protest falls"
          - when: "otherwise"
            method: "no interest month is counted"
        baseline: {interest_months: "0"}
        evidence: [cross_category, date]
        cross_difficulty: taxacct
      - id: protest_interest_basis
        effect: method
        decides: monthly_interest
        bindings: [interest_assessed_latest, class_interest_rate, monthly_interest]
        ladder:
          - when: "the employer's tax account shows interest assessed for the statement's quarter and an amount billed for that quarter"
            method: "the latest month of assessed interest, in proportion to the protested principal over the amount billed for the quarter"
          - when: "no interest has yet been assessed for that quarter, the employer finances benefits by reimbursement and the bill for the quarter is past its due date"
            method: "the protested principal times the late-payment interest rate of the employer's tax account class"
          - when: "otherwise"
            method: "no monthly protest interest arises"
        baseline: {monthly_interest: "0"}
        evidence: [cross_category, history]
        cross_difficulty: taxacct
