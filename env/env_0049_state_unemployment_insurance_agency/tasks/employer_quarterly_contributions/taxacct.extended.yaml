- id: taxacct_ext_credit_refund_request
  base_policy_refs:
  - taxacct_evt_payments
  overwrite:
  - base_policy: taxacct_evt_payments
    superseded_clause: >-
      An approved refund is issued within the refund processing business days for no more than the credit balance,
      and is recorded against the refund request.
    replaced_by: >-
      The refund requested may exceed the credit balance only by the appeal interest allowance, and an approved
      refund is issued within the refund processing business days and recorded against the refund request.
  trigger: on_request
  subject:
  - taxacct_refund_issued
  computes: requested_amount
  target_tool: request_credit_refund_f44db5b5
  params:
    appeal_credit_months: 12
    two_penalty_cushion_share: 0.2
    one_penalty_cushion_share: 0.1
    payment_record_months: 12
    two_entry_hold_share: 1.0
    one_entry_hold_share: 0.5
    estimate_hold_months: 6
    one_estimate_hold_factor: 0.5
  rule: >-
    A refund request asks for the credit balance on an employer's tax account to be paid out instead of being applied
    to the next quarter due. Every window in this rule is counted in whole months back from the day of the request,
    by the entry dates of the ledger entries. The refundable amount is worked out only after the ledger carries
    an estimated assessment for every quarter whose report is still unfiled at least the class's estimated assessment
    days after its due date. The refund an employer may request is the credit balance shown on its account, that
    is the balance due taken as a positive amount when it is negative and nothing when it is not, rounded to the
    cent. An appeal interest allowance is added to the credit balance on the contributions credited back within
    the appeal credit months to the quarter most recently credited back because a contribution rate was reduced
    on appeal, the credited-back quarter: it is the class's monthly late payment interest rate times those credited-back
    contributions times a number of interest months, rounded to the cent, and the interest months are counted as
    the whole months from an interest start date to the day of the request plus one for the month in progress. The
    interest start date follows the employer's most recently decided contribution rate appeal and the payment of
    the credited-back quarter's contributions: when that appeal was decided as reversed or modified and the quarter's
    last contribution payment was received on or after the appeal's filing date, interest runs from that payment's
    date; when that appeal was decided as reversed or modified and the quarter's last contribution payment was received
    before the appeal's filing date, interest runs from the appeal's filing date; in any other case no allowance
    is added. A reporting cushion is kept back as a share of the credit balance plus the allowance: two or more
    late report penalties booked within the class's penalty abatement lookback quarters, counted as three months
    each, keep back the two-penalty cushion share, exactly one keeps back the one-penalty cushion share, and none
    keeps back nothing. A contribution hold is taken off as a share of the most recent contribution assessment booked
    from an original report: two or more late payment interest entries booked within the payment record months hold
    the two-entry hold share, exactly one holds the one-entry hold share, and none holds nothing. An estimate hold
    then scales what is left: two or more estimated assessments booked within the estimate hold months leave nothing
    to refund, exactly one scales it by the one-estimate hold factor, and none leaves it whole. The refund requested
    is the credit balance plus the appeal interest allowance, less the reporting cushion taken on that sum, less
    the contribution hold, never below zero, times the estimate hold factor, computed in that order and rounded
    to the cent once at the end. The request cites the payment that created the credit: where the credit arose from
    contributions credited back to a quarter, it is the last contribution payment received for that quarter. The
    refund requested may exceed the credit balance only by the appeal interest allowance, and an approved refund
    is issued within the refund processing business days and recorded against the refund request.
  prerequisite:
  - problem: taxacct_ext_estimated_assessment
    kind: value_input
    gate: credit_balance
    form: state
    policy_source: >-
      The refundable amount is worked out only after the ledger carries an estimated assessment for every quarter
      whose report is still unfiled at least the class's estimated assessment days after its due date.
    condition: >-
      Every quarter of the account whose report is still unfiled at least the estimated assessment days after its
      due date carries an estimated contribution assessment entry on the employer tax ledger.
    resolved_by: book_estimated_assessment_54fbfb5a
    effect: >-
      Booking the estimate raises the balance due by the estimated contributions, which lowers credit_balance, and
      adds an estimated assessment entry that the estimate hold counts, which changes estimate_hold_factor.
  cross_category:
  - category: appeal
    as: history
    reads:
    - appeals.decision_outcome
    - appeals.filed_date
    - appeals.decision_mailed_date
    note: >-
      The appeal interest allowance's interest start date is chosen from the outcome and filing date of the employer's
      most recently decided Lower Authority Appeal on its contribution rate, set against the payment of the credited-back
      quarter.
  compute:
  - credit_balance: MX(0, 0 - F('balance_due'))
  - credited_quarter: >-
      LATEST('employer_tax_ledger', 'quarter', date_field='entry_date', event_type='taxacct_credit_adjusted', adjustment_reason='rate_reduced_on_appeal')
  - appeal_credit: >-
      SUM('employer_tax_ledger', 'amount', within_months=K('appeal_credit_months'), date_field='entry_date', event_type='taxacct_credit_adjusted',
      adjustment_reason='rate_reduced_on_appeal', quarter=credited_quarter)
  - appeal_outcome: >-
      XLATEST('appeal', 'appeals', 'decision_outcome', date_field='decision_mailed_date', determination_type='contribution_rate')
  - appeal_filed_date: >-
      XLATEST('appeal', 'appeals', 'filed_date', date_field='decision_mailed_date', determination_type='contribution_rate')
  - credited_quarter_payment_date: >-
      LATEST('employer_tax_ledger', 'entry_date', date_field='entry_date', event_type='taxacct_payment_received',
      component='contribution', quarter=credited_quarter)
  - interest_start_date: >-
      credited_quarter_payment_date if (appeal_credit > 0 and (appeal_outcome == 'reversed' or appeal_outcome ==
      'modified') and credited_quarter_payment_date >= appeal_filed_date) else (appeal_filed_date if (appeal_credit
      > 0 and (appeal_outcome == 'reversed' or appeal_outcome == 'modified') and credited_quarter_payment_date <
      appeal_filed_date) else None)
  - interest_months: MONTHS(interest_start_date, NOW) + 1 if interest_start_date != None else 0
  - appeal_interest: RND(appeal_credit * P('late_payment_interest_rate_monthly') * interest_months, 2)
  - late_report_penalties: >-
      COUNT('employer_tax_ledger', within_months=P('penalty_abatement_lookback_quarters') * 3, date_field='entry_date',
      event_type='taxacct_penalty_assessed', penalty_type='late_report')
  - cushion_share: >-
      K('two_penalty_cushion_share') if late_report_penalties >= 2 else (K('one_penalty_cushion_share') if late_report_penalties
      == 1 else 0)
  - late_payment_entries: >-
      COUNT('employer_tax_ledger', within_months=K('payment_record_months'), date_field='entry_date', event_type='taxacct_interest_assessed')
  - latest_report_contributions: >-
      LATEST('employer_tax_ledger', 'amount', date_field='entry_date', event_type='taxacct_contribution_assessed',
      assessment_basis='original_report')
  - contribution_hold_share: >-
      K('two_entry_hold_share') if late_payment_entries >= 2 else (K('one_entry_hold_share') if late_payment_entries
      == 1 else 0)
  - recent_estimates: >-
      COUNT('employer_tax_ledger', within_months=K('estimate_hold_months'), date_field='entry_date', event_type='taxacct_contribution_assessed',
      assessment_basis='estimated_assessment')
  - estimate_hold_factor: 0 if recent_estimates >= 2 else (K('one_estimate_hold_factor') if recent_estimates ==
      1 else 1)
  - result: >-
      RND(MX(0, (credit_balance + appeal_interest) * (1 - cushion_share) - contribution_hold_share * latest_report_contributions)
      * estimate_hold_factor, 2)
  compute_basis:
    credit_balance: >-
      The refund an employer may request is the credit balance shown on its account, that is the balance due taken
      as a positive amount when it is negative and nothing when it is not, rounded to the cent.
    appeal_credit: >-
      An appeal interest allowance is added to the credit balance on the contributions credited back within the
      appeal credit months to the quarter most recently credited back because a contribution rate was reduced on
      appeal, the credited-back quarter:
    appeal_outcome: >-
      The interest start date follows the employer's most recently decided contribution rate appeal and the payment
      of the credited-back quarter's contributions:
    appeal_filed_date: >-
      when that appeal was decided as reversed or modified and the quarter's last contribution payment was received
      before the appeal's filing date, interest runs from the appeal's filing date;
    credited_quarter: >-
      to the quarter most recently credited back because a contribution rate was reduced on appeal, the credited-back
      quarter:
    credited_quarter_payment_date: >-
      when that appeal was decided as reversed or modified and the quarter's last contribution payment was received
      on or after the appeal's filing date, interest runs from that payment's date;
    interest_start_date: >-
      when that appeal was decided as reversed or modified and the quarter's last contribution payment was received
      on or after the appeal's filing date, interest runs from that payment's date; when that appeal was decided
      as reversed or modified and the quarter's last contribution payment was received before the appeal's filing
      date, interest runs from the appeal's filing date; in any other case no allowance is added.
    interest_months: >-
      the interest months are counted as the whole months from an interest start date to the day of the request
      plus one for the month in progress.
    appeal_interest: >-
      it is the class's monthly late payment interest rate times those credited-back contributions times a number
      of interest months, rounded to the cent,
    late_report_penalties: >-
      A reporting cushion is kept back as a share of the credit balance plus the allowance: two or more late report
      penalties booked within the class's penalty abatement lookback quarters, counted as three months each, keep
      back the two-penalty cushion share, exactly one keeps back the one-penalty cushion share, and none keeps back
      nothing.
    cushion_share: >-
      two or more late report penalties booked within the class's penalty abatement lookback quarters, counted as
      three months each, keep back the two-penalty cushion share, exactly one keeps back the one-penalty cushion
      share, and none keeps back nothing.
    late_payment_entries: >-
      A contribution hold is taken off as a share of the most recent contribution assessment booked from an original
      report: two or more late payment interest entries booked within the payment record months hold the two-entry
      hold share, exactly one holds the one-entry hold share, and none holds nothing.
    latest_report_contributions: >-
      A contribution hold is taken off as a share of the most recent contribution assessment booked from an original
      report:
    contribution_hold_share: >-
      two or more late payment interest entries booked within the payment record months hold the two-entry hold
      share, exactly one holds the one-entry hold share, and none holds nothing.
    recent_estimates: >-
      An estimate hold then scales what is left: two or more estimated assessments booked within the estimate hold
      months leave nothing to refund, exactly one scales it by the one-estimate hold factor, and none leaves it
      whole.
    estimate_hold_factor: >-
      two or more estimated assessments booked within the estimate hold months leave nothing to refund, exactly
      one scales it by the one-estimate hold factor, and none leaves it whole.
    result: >-
      The refund requested is the credit balance plus the appeal interest allowance, less the reporting cushion
      taken on that sum, less the contribution hold, never below zero, times the estimate hold factor, computed
      in that order and rounded to the cent once at the end.
  factors:
  - id: appeal_interest_allowance
    effect: method
    decides: interest_start_date
    bindings:
    - appeal_credit
    - appeal_outcome
    - appeal_filed_date
    - credited_quarter
    - credited_quarter_payment_date
    - interest_start_date
    ladder:
    - when: >-
        the most recently decided contribution rate appeal was decided as reversed or modified AND the credited-back
        quarter's last contribution payment was received on or after the appeal's filing date
      method: >-
        interest months run from that payment's date to the request (whole months plus one for the month in progress)
    - when: >-
        the appeal was decided as reversed or modified AND that payment was received before the appeal's filing
        date
      method: >-
        interest months run from the appeal's filing date to the request (whole months plus one for the month in
        progress)
    - when: otherwise
      method: no interest months are counted and no allowance is added
    baseline:
      interest_start_date: None
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: appeal
  - id: reporting_cushion
    effect: parameter
    decides: cushion_share
    bindings:
    - late_report_penalties
    - cushion_share
    ladder:
    - when: two or more late report penalties booked within the penalty abatement lookback
      value: K('two_penalty_cushion_share')
    - when: exactly one late report penalty booked within the penalty abatement lookback
      value: K('one_penalty_cushion_share')
    - when: otherwise
      value: '0'
    baseline:
      cushion_share: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: contribution_hold
    effect: parameter
    decides: contribution_hold_share
    bindings:
    - late_payment_entries
    - latest_report_contributions
    - contribution_hold_share
    ladder:
    - when: two or more late payment interest entries booked within the payment record months
      value: K('two_entry_hold_share')
    - when: exactly one late payment interest entry booked within the payment record months
      value: K('one_entry_hold_share')
    - when: otherwise
      value: '0'
    baseline:
      contribution_hold_share: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: estimate_hold
    effect: parameter
    decides: estimate_hold_factor
    bindings:
    - recent_estimates
    - estimate_hold_factor
    ladder:
    - when: two or more estimated assessments booked within the estimate hold months
      value: '0'
    - when: exactly one estimated assessment booked within the estimate hold months
      value: K('one_estimate_hold_factor')
    - when: otherwise
      value: '1'
    baseline:
      estimate_hold_factor: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The refund an employer may request is the credit balance shown on its account, that is the balance due taken
      as a positive amount when it is negative and nothing when it is not, rounded to the cent.
    params: []
  inputs:
    history:
    - table: employer_tax_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: taxacct_credit_adjusted
        adjustment_reason: rate_reduced_on_appeal
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      within_months: 24
      filters:
        event_type: taxacct_penalty_assessed
        penalty_type: late_report
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      within_months: 12
      filters:
        event_type: taxacct_interest_assessed
    - table: employer_tax_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: taxacct_contribution_assessed
        assessment_basis: original_report
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      within_months: 6
      filters:
        event_type: taxacct_contribution_assessed
        assessment_basis: estimated_assessment
    - category: appeal
      table: appeals
      aggregate: latest
      field: decision_outcome
      filters:
        determination_type: contribution_rate
    - table: employer_tax_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: taxacct_payment_received
        component: contribution
    cross_category:
    - appeal
- id: taxacct_ext_late_report_penalty
  base_policy_refs:
  - taxacct_evt_penalty_interest
  - taxacct_evt_quarterly_report
  overwrite:
  - base_policy: taxacct_evt_penalty_interest
    superseded_clause: >-
      A report filed after its due date carries a late report penalty of the larger of the flat penalty and the
      wage share of the quarter's total wages, capped at the maximum.
    replaced_by: >-
      The penalty booked is the limited amount plus the paper filing charge plus the estimate charge, with that
      single rounding to the cent applied to the sum rather than to any part of it, and it is booked once for the
      report's quarter.
  trigger: state_due
  subject:
  - taxacct_penalty_assessed
  computes: penalty_amount
  target_tool: assess_late_report_penalty_9b2fdf0c
  params:
    short_lateness_days: 30
    long_lateness_days: 90
    middle_lateness_wage_share: 0.002
    long_lateness_wage_share: 0.003
    two_penalty_repeat_multiplier: 2.0
    one_penalty_repeat_multiplier: 1.5
    long_tenure_months: 120
    short_tenure_months: 36
    long_tenure_lookback_months: 12
    standard_lookback_months: 24
    large_employer_count: 50
    large_employer_cap: 1000.0
    mid_size_employer_cap: 500.0
    large_paper_filing_charge: 200.0
    mid_size_paper_filing_charge: 100.0
    estimate_charge_days: 60
    late_estimate_charge: 150.0
    estimate_charge: 75.0
  rule: >-
    A late report penalty is owed for every quarterly contribution and wage report filed after its due date, and
    it is worked out from the original report with the latest filing date on the account. That report's lateness
    is the number of calendar days from its due date to its filing date. The late report penalty is the larger of
    the class's flat late report penalty and the class's late report percentage of that report's total wages, limited
    by the class's late report penalty maximum, and rounded to the cent. The percentage of total wages used in that
    comparison follows the report's lateness: a report filed more than the long lateness days late is charged the
    long lateness wage share, a report filed more than the short lateness days but no more than the long lateness
    days late is charged the middle lateness wage share, and a report filed no more than the short lateness days
    late is charged the class's late report percentage. The larger of the flat penalty and the wage share is multiplied
    by a repeat multiplier before any limit applies: an account with two or more late report penalties booked within
    its repeat lookback is multiplied by the two-penalty repeat multiplier, an account with exactly one is multiplied
    by the one-penalty repeat multiplier, and an account with none is not multiplied. The repeat lookback is counted
    in whole months back from the day the penalty is worked out, by the entry dates of the late report penalties,
    and its length follows the account's whole months of liability since registration: an account liable for at
    least the long tenure months looks back over the long tenure lookback months, an account liable for fewer than
    the short tenure months looks back over its whole liability, that is one month more than its whole months of
    liability, and any other account looks back over the standard lookback months. The limit applied to the multiplied
    amount follows the highest monthly employee count on the report: a report showing at least the large employer
    count is limited by the large employer cap, a report showing at least the electronic filing threshold but fewer
    than the large employer count is limited by the mid-size employer cap, and a report showing fewer than the electronic
    filing threshold is limited by the class's late report penalty maximum. A paper filing charge is added after
    the limit: a report filed on paper that shows at least the large employer count is charged the large paper filing
    charge, a report filed on paper that shows at least the electronic filing threshold but fewer than the large
    employer count is charged the mid-size paper filing charge, and any other report is charged no paper filing
    charge. An estimate charge is also added after the limit: a report filed more than the estimate charge days
    after an estimated assessment was booked for its quarter is charged the late estimate charge, a report filed
    after an estimated assessment for its quarter but no more than the estimate charge days after it is charged
    the estimate charge, and a report for a quarter that never carried an estimated assessment is charged no estimate
    charge. The penalty booked is the limited amount plus the paper filing charge plus the estimate charge, with
    that single rounding to the cent applied to the sum rather than to any part of it, and it is booked once for
    the report's quarter.
  prerequisite: []
  cross_category: []
  compute:
  - report_quarter: LATEST('employer_wage_reports', 'quarter', date_field='filed_date', report_type='original')
  - report_filed_date: LATEST('employer_wage_reports', 'filed_date', date_field='filed_date', report_type='original')
  - report_due_date: LATEST('employer_wage_reports', 'due_date', date_field='filed_date', report_type='original')
  - report_total_wages: LATEST('employer_wage_reports', 'total_wages', date_field='filed_date', report_type='original')
  - lateness_days: DAYS(report_due_date, report_filed_date)
  - lateness_wage_share: >-
      K('long_lateness_wage_share') if lateness_days > K('long_lateness_days') else (K('middle_lateness_wage_share')
      if lateness_days > K('short_lateness_days') else P('late_report_penalty_pct_of_wages'))
  - wage_share_amount: MX(P('late_report_penalty_flat'), lateness_wage_share * report_total_wages)
  - liability_months: MONTHS(F('registered_date'), NOW)
  - repeat_lookback_months: >-
      K('long_tenure_lookback_months') if liability_months >= K('long_tenure_months') else (liability_months + 1
      if liability_months < K('short_tenure_months') else K('standard_lookback_months'))
  - prior_late_penalties: >-
      COUNT('employer_tax_ledger', within_months=repeat_lookback_months, date_field='entry_date', event_type='taxacct_penalty_assessed',
      penalty_type='late_report')
  - repeat_multiplier: >-
      K('two_penalty_repeat_multiplier') if prior_late_penalties >= 2 else (K('one_penalty_repeat_multiplier') if
      prior_late_penalties == 1 else 1)
  - peak_employee_count: >-
      MX(LATEST('employer_wage_reports', 'employee_count_month1', date_field='filed_date', report_type='original'),
      LATEST('employer_wage_reports', 'employee_count_month2', date_field='filed_date', report_type='original'),
      LATEST('employer_wage_reports', 'employee_count_month3', date_field='filed_date', report_type='original'))
  - penalty_cap: >-
      K('large_employer_cap') if peak_employee_count >= K('large_employer_count') else (K('mid_size_employer_cap')
      if peak_employee_count >= P('electronic_filing_required_min_employees') else P('late_report_penalty_max'))
  - limited_penalty: MN(penalty_cap, wage_share_amount * repeat_multiplier)
  - report_channel: LATEST('employer_wage_reports', 'filing_channel', date_field='filed_date', report_type='original')
  - paper_filing_charge: >-
      K('large_paper_filing_charge') if (report_channel == 'paper' and peak_employee_count >= K('large_employer_count'))
      else (K('mid_size_paper_filing_charge') if (report_channel == 'paper' and peak_employee_count >= P('electronic_filing_required_min_employees'))
      else 0)
  - quarter_estimates: >-
      COUNT('employer_tax_ledger', event_type='taxacct_contribution_assessed', assessment_basis='estimated_assessment',
      quarter=report_quarter)
  - estimate_entry_date: >-
      LATEST('employer_tax_ledger', 'entry_date', date_field='entry_date', event_type='taxacct_contribution_assessed',
      assessment_basis='estimated_assessment', quarter=report_quarter)
  - days_after_estimate: DAYS(estimate_entry_date, report_filed_date) if quarter_estimates > 0 else 0
  - estimate_charge: >-
      K('late_estimate_charge') if (quarter_estimates > 0 and days_after_estimate > K('estimate_charge_days')) else
      (K('estimate_charge') if quarter_estimates > 0 else 0)
  - result: RND(limited_penalty + paper_filing_charge + estimate_charge, 2)
  compute_basis:
    report_quarter: it is worked out from the original report with the latest filing date on the account.
    report_filed_date: it is worked out from the original report with the latest filing date on the account.
    report_due_date: That report's lateness is the number of calendar days from its due date to its filing date.
    report_total_wages: >-
      The late report penalty is the larger of the class's flat late report penalty and the class's late report
      percentage of that report's total wages, limited by the class's late report penalty maximum, and rounded to
      the cent.
    lateness_days: That report's lateness is the number of calendar days from its due date to its filing date.
    lateness_wage_share: >-
      The percentage of total wages used in that comparison follows the report's lateness: a report filed more than
      the long lateness days late is charged the long lateness wage share, a report filed more than the short lateness
      days but no more than the long lateness days late is charged the middle lateness wage share, and a report
      filed no more than the short lateness days late is charged the class's late report percentage.
    wage_share_amount: >-
      The late report penalty is the larger of the class's flat late report penalty and the class's late report
      percentage of that report's total wages, limited by the class's late report penalty maximum, and rounded to
      the cent.
    liability_months: 'its length follows the account''s whole months of liability since registration:'
    repeat_lookback_months: >-
      an account liable for at least the long tenure months looks back over the long tenure lookback months, an
      account liable for fewer than the short tenure months looks back over its whole liability, that is one month
      more than its whole months of liability, and any other account looks back over the standard lookback months.
    prior_late_penalties: >-
      The repeat lookback is counted in whole months back from the day the penalty is worked out, by the entry dates
      of the late report penalties,
    repeat_multiplier: >-
      The larger of the flat penalty and the wage share is multiplied by a repeat multiplier before any limit applies:
      an account with two or more late report penalties booked within its repeat lookback is multiplied by the two-penalty
      repeat multiplier, an account with exactly one is multiplied by the one-penalty repeat multiplier, and an
      account with none is not multiplied.
    peak_employee_count: 'The limit applied to the multiplied amount follows the highest monthly employee count
      on the report:'
    penalty_cap: >-
      a report showing at least the large employer count is limited by the large employer cap, a report showing
      at least the electronic filing threshold but fewer than the large employer count is limited by the mid-size
      employer cap, and a report showing fewer than the electronic filing threshold is limited by the class's late
      report penalty maximum.
    limited_penalty: >-
      The larger of the flat penalty and the wage share is multiplied by a repeat multiplier before any limit applies:
    report_channel: 'A paper filing charge is added after the limit:'
    paper_filing_charge: >-
      a report filed on paper that shows at least the large employer count is charged the large paper filing charge,
      a report filed on paper that shows at least the electronic filing threshold but fewer than the large employer
      count is charged the mid-size paper filing charge, and any other report is charged no paper filing charge.
    quarter_estimates: 'An estimate charge is also added after the limit:'
    estimate_entry_date: >-
      a report filed more than the estimate charge days after an estimated assessment was booked for its quarter
      is charged the late estimate charge,
    days_after_estimate: >-
      a report filed more than the estimate charge days after an estimated assessment was booked for its quarter
      is charged the late estimate charge,
    estimate_charge: >-
      a report filed more than the estimate charge days after an estimated assessment was booked for its quarter
      is charged the late estimate charge, a report filed after an estimated assessment for its quarter but no more
      than the estimate charge days after it is charged the estimate charge, and a report for a quarter that never
      carried an estimated assessment is charged no estimate charge.
    result: >-
      The penalty booked is the limited amount plus the paper filing charge plus the estimate charge, with that
      single rounding to the cent applied to the sum rather than to any part of it, and it is booked once for the
      report's quarter.
  factors:
  - id: lateness_wage_share
    effect: parameter
    decides: lateness_wage_share
    bindings:
    - report_due_date
    - lateness_days
    - lateness_wage_share
    ladder:
    - when: report filed more than the long lateness days after its due date
      value: K('long_lateness_wage_share')
    - when: report filed more than the short lateness days but no more than the long lateness days late
      value: K('middle_lateness_wage_share')
    - when: otherwise (no more than the short lateness days late)
      value: P('late_report_penalty_pct_of_wages')
    baseline:
      lateness_wage_share: P('late_report_penalty_pct_of_wages')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: repeat_lookback_length
    effect: method
    decides: repeat_lookback_months
    bindings:
    - liability_months
    - repeat_lookback_months
    ladder:
    - when: account liable for at least the long tenure months
      method: late report penalties are counted over the long tenure lookback months
    - when: account liable for fewer than the short tenure months
      method: >-
        late report penalties are counted over the account's whole liability (one month more than its whole months
        of liability)
    - when: otherwise
      method: late report penalties are counted over the standard lookback months
    baseline:
      repeat_lookback_months: K('standard_lookback_months')
    evidence:
    - date
    cross_difficulty: null
  - id: repeat_multiplier
    effect: parameter
    decides: repeat_multiplier
    bindings:
    - prior_late_penalties
    - repeat_multiplier
    ladder:
    - when: two or more late report penalties booked within the repeat lookback
      value: K('two_penalty_repeat_multiplier')
    - when: exactly one late report penalty booked within the repeat lookback
      value: K('one_penalty_repeat_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      repeat_multiplier: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: employer_size_cap
    effect: parameter
    decides: penalty_cap
    bindings:
    - peak_employee_count
    - penalty_cap
    ladder:
    - when: highest monthly employee count on the report at least the large employer count
      value: K('large_employer_cap')
    - when: highest monthly count at least the electronic filing threshold but below the large employer count
      value: K('mid_size_employer_cap')
    - when: otherwise (below the electronic filing threshold)
      value: P('late_report_penalty_max')
    baseline:
      penalty_cap: P('late_report_penalty_max')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: paper_filing_charge
    effect: parameter
    decides: paper_filing_charge
    bindings:
    - report_channel
    - paper_filing_charge
    ladder:
    - when: report filed on paper and showing at least the large employer count
      value: K('large_paper_filing_charge')
    - when: >-
        report filed on paper and showing at least the electronic filing threshold but fewer than the large employer
        count
      value: K('mid_size_paper_filing_charge')
    - when: otherwise
      value: '0'
    baseline:
      paper_filing_charge: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: estimate_charge
    effect: parameter
    decides: estimate_charge
    bindings:
    - quarter_estimates
    - estimate_entry_date
    - days_after_estimate
    - estimate_charge
    ladder:
    - when: >-
        report filed more than the estimate charge days after an estimated assessment was booked for its quarter
      value: K('late_estimate_charge')
    - when: >-
        report filed after an estimated assessment for its quarter, no more than the estimate charge days after
        it
      value: K('estimate_charge')
    - when: otherwise (the quarter never carried an estimated assessment)
      value: '0'
    baseline:
      estimate_charge: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      A late report penalty is owed for every quarterly contribution and wage report filed after its due date, and
      it is worked out from the original report with the latest filing date on the account. The late report penalty
      is the larger of the class's flat late report penalty and the class's late report percentage of that report's
      total wages, limited by the class's late report penalty maximum, and rounded to the cent.
    params:
    - late_report_penalty_flat
    - late_report_penalty_pct_of_wages
    - late_report_penalty_max
  inputs:
    history:
    - table: employer_wage_reports
      aggregate: latest
      field: filed_date
      filters:
        report_type: original
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      filters:
        event_type: taxacct_penalty_assessed
        penalty_type: late_report
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      filters:
        event_type: taxacct_contribution_assessed
        assessment_basis: estimated_assessment
    cross_category: []
- id: taxacct_ext_penalty_relief_request
  base_policy_refs:
  - taxacct_evt_penalty_interest
  overwrite:
  - base_policy: taxacct_evt_penalty_interest
    superseded_clause: >-
      A late report penalty is abated in full, never in part, when the employer shows that taxacct_msr_prior_late_reports
      is zero and requests abatement in time.
    replaced_by: >-
      A late report penalty is relieved in part or in full only under this rule, and relief is requested no later
      than the abatement window after the penalty assessment date.
  trigger: on_request
  subject:
  - taxacct_credit_adjusted
  computes: requested_amount
  target_tool: request_penalty_relief_44d7156f
  params:
    two_penalty_history_share: 0.5
    one_penalty_history_share: 0.75
    estimate_lookback_months: 12
    two_estimate_share: 0.7
    one_estimate_share: 0.85
    unpaid_payment_share: 0.8
    late_payment_share: 0.9
    recent_cooperation_days: 365
    older_cooperation_days: 730
    recent_cooperation_share: 0.85
    older_cooperation_share: 0.95
    portal_lookback_months: 12
    two_filing_paper_factor: 0.75
    one_filing_paper_factor: 0.9
    payment_record_months: 12
  rule: >-
    A penalty relief request asks for part or all of a paid late report penalty to be refunded, and it concerns
    the quarter of the most recent payment applied to a penalty on the account. The request is lodged by the employer
    and is decided by the Department's tax review unit, which refunds the relief it grants. Every window in this
    rule is counted back from the day of the request: windows in months are counted in whole months by the entry
    dates of the ledger entries or the filing dates of the reports, and windows in days in calendar days. The relief
    share is not fixed until the ledger carries a late report penalty for the quarter of the original report with
    the latest filing date, whenever that report was filed after its due date. The relief requested is the penalty
    paid for that quarter, in full, rounded to the cent. That full penalty is multiplied by a history share, an
    estimate share, a payment share, a cooperation share and a paper filing factor, and the relief requested is
    the product of the penalty paid and all five, rounded to the cent once at the end. The history share follows
    the other late report penalties booked within the relief lookback, leaving out the penalty of the quarter being
    relieved: two or more give the two-penalty history share, exactly one gives the one-penalty history share, and
    none gives a history share of one. The relief lookback is counted in whole months back from the day of the request
    by the entry dates of the penalties, and where it starts follows the account's standing: an account in delinquent
    status looks back over its whole liability since registration, that is one month more than its whole months
    of liability; an account in active status with no late payment interest entry booked within the payment record
    months looks back only to its most recent late payment interest entry, that is one month more than the whole
    months since that entry's date, or over its whole liability since registration when it has never been charged
    late payment interest; and any other account looks back over the class's penalty abatement lookback quarters,
    counted as three months each. The estimate share follows the estimated assessments booked on the account within
    the estimate lookback months: two or more give the two-estimate share, exactly one gives the one-estimate share,
    and none gives an estimate share of one. The payment share follows the contributions of the quarter being relieved:
    contributions assessed for that quarter and not yet fully covered by the payments and credits applied to them
    give the unpaid payment share, contributions fully covered with the last contribution payment after the report's
    due date give the late payment share, and contributions fully covered by the due date give a payment share of
    one. The cooperation share follows the most recent answer the employer gave to a notice of claim on its benefit
    charge positions that is recorded as late without good cause (answers recorded as late with good cause do not
    count): when that answer was received no more than the recent cooperation days before the request it gives the
    recent cooperation share, when it was received more than the recent cooperation days but no more than the older
    cooperation days before the request it gives the older cooperation share, and when there is no such answer within
    the older cooperation days the cooperation share is one. The paper filing factor follows how the relieved quarter's
    original report was filed: a report filed on paper by an employer that filed at least two original reports through
    the online portal within the portal lookback months is multiplied by the two-filing paper factor, a report filed
    on paper by an employer that filed exactly one original report through the online portal within that lookback
    is multiplied by the one-filing paper factor, and any other report is not multiplied. A late report penalty
    is relieved in part or in full only under this rule, and relief is requested no later than the abatement window
    after the penalty assessment date.
  prerequisite:
  - problem: taxacct_ext_late_report_penalty
    kind: value_input
    gate: other_late_penalties
    form: state
    policy_source: >-
      The relief share is not fixed until the ledger carries a late report penalty for the quarter of the original
      report with the latest filing date, whenever that report was filed after its due date.
    condition: >-
      When the original report with the latest filing date on the account was filed after its due date, the employer
      tax ledger carries a late report penalty entry for that report's quarter.
    resolved_by: assess_late_report_penalty_9b2fdf0c
    effect: >-
      Booking the missing late report penalty adds a late report penalty entry dated the day of the request, inside
      every relief lookback, which raises other_late_penalties and lowers the history share.
  cross_category:
  - category: charge
    as: history
    reads:
    - charge_positions.response_timeliness
    - charge_positions.response_date
    note: >-
      The cooperation share tier is decided from the most recent answer recorded as late (without good cause) to
      a notice of claim on the employer's benefit charge positions.
  compute:
  - relief_quarter: >-
      LATEST('employer_tax_ledger', 'quarter', date_field='entry_date', event_type='taxacct_payment_received', component='penalty')
  - penalty_paid: >-
      SUM('employer_tax_ledger', 'amount', event_type='taxacct_payment_received', component='penalty', quarter=relief_quarter)
  - late_interest_entries: >-
      COUNT('employer_tax_ledger', within_months=K('payment_record_months'), date_field='entry_date', event_type='taxacct_interest_assessed')
  - relief_liability_months: MONTHS(F('registered_date'), NOW)
  - last_interest_date: >-
      LATEST('employer_tax_ledger', 'entry_date', date_field='entry_date', event_type='taxacct_interest_assessed')
  - relief_lookback_months: >-
      relief_liability_months + 1 if F('status') == 'delinquent' else ((MONTHS(last_interest_date, NOW) + 1 if last_interest_date
      != None else relief_liability_months + 1) if (F('status') == 'active' and late_interest_entries == 0) else
      P('penalty_abatement_lookback_quarters') * 3)
  - other_late_penalties: >-
      COUNT('employer_tax_ledger', within_months=relief_lookback_months, date_field='entry_date', event_type='taxacct_penalty_assessed',
      penalty_type='late_report') - COUNT('employer_tax_ledger', within_months=relief_lookback_months, date_field='entry_date',
      event_type='taxacct_penalty_assessed', penalty_type='late_report', quarter=relief_quarter)
  - history_share: >-
      K('two_penalty_history_share') if other_late_penalties >= 2 else (K('one_penalty_history_share') if other_late_penalties
      == 1 else 1)
  - recent_estimates: >-
      COUNT('employer_tax_ledger', within_months=K('estimate_lookback_months'), date_field='entry_date', event_type='taxacct_contribution_assessed',
      assessment_basis='estimated_assessment')
  - estimate_share: >-
      K('two_estimate_share') if recent_estimates >= 2 else (K('one_estimate_share') if recent_estimates == 1 else
      1)
  - quarter_assessed: >-
      SUM('employer_tax_ledger', 'amount', event_type='taxacct_contribution_assessed', quarter=relief_quarter)
  - quarter_paid: >-
      SUM('employer_tax_ledger', 'amount', event_type='taxacct_payment_received', component='contribution', quarter=relief_quarter)
  - last_contribution_payment: >-
      LATEST('employer_tax_ledger', 'entry_date', date_field='entry_date', event_type='taxacct_payment_received',
      component='contribution', quarter=relief_quarter)
  - relief_due_date: >-
      LATEST('employer_wage_reports', 'due_date', date_field='filed_date', report_type='original', quarter=relief_quarter)
  - quarter_credited: >-
      SUM('employer_tax_ledger', 'amount', event_type='taxacct_credit_adjusted', component='contribution', quarter=relief_quarter)
  - payment_share: >-
      K('unpaid_payment_share') if quarter_paid + quarter_credited < quarter_assessed else (K('late_payment_share')
      if last_contribution_payment > relief_due_date else 1)
  - late_answer_date: >-
      XLATEST('charge', 'charge_positions', 'response_date', date_field='response_date', response_timeliness='late')
  - cooperation_share: >-
      (K('recent_cooperation_share') if DAYS(late_answer_date, NOW) <= K('recent_cooperation_days') else (K('older_cooperation_share')
      if DAYS(late_answer_date, NOW) <= K('older_cooperation_days') else 1)) if late_answer_date else 1
  - relief_channel: >-
      LATEST('employer_wage_reports', 'filing_channel', date_field='filed_date', report_type='original', quarter=relief_quarter)
  - portal_filings: >-
      COUNT('employer_wage_reports', within_months=K('portal_lookback_months'), date_field='filed_date', report_type='original',
      filing_channel='online_portal')
  - paper_relief_factor: >-
      K('two_filing_paper_factor') if (relief_channel == 'paper' and portal_filings >= 2) else (K('one_filing_paper_factor')
      if (relief_channel == 'paper' and portal_filings == 1) else 1)
  - result: >-
      RND(penalty_paid * history_share * estimate_share * payment_share * cooperation_share * paper_relief_factor,
      2)
  compute_basis:
    relief_quarter: it concerns the quarter of the most recent payment applied to a penalty on the account.
    penalty_paid: The relief requested is the penalty paid for that quarter, in full, rounded to the cent.
    late_interest_entries: >-
      an account in active status with no late payment interest entry booked within the payment record months looks
      back only to its most recent late payment interest entry,
    relief_liability_months: >-
      an account in delinquent status looks back over its whole liability since registration, that is one month
      more than its whole months of liability;
    last_interest_date: >-
      looks back only to its most recent late payment interest entry, that is one month more than the whole months
      since that entry's date, or over its whole liability since registration when it has never been charged late
      payment interest;
    relief_lookback_months: >-
      where it starts follows the account's standing: an account in delinquent status looks back over its whole
      liability since registration, that is one month more than its whole months of liability; an account in active
      status with no late payment interest entry booked within the payment record months looks back only to its
      most recent late payment interest entry, that is one month more than the whole months since that entry's date,
      or over its whole liability since registration when it has never been charged late payment interest; and any
      other account looks back over the class's penalty abatement lookback quarters, counted as three months each.
    other_late_penalties: >-
      The history share follows the other late report penalties booked within the relief lookback, leaving out the
      penalty of the quarter being relieved:
    history_share: >-
      two or more give the two-penalty history share, exactly one gives the one-penalty history share, and none
      gives a history share of one.
    recent_estimates: >-
      The estimate share follows the estimated assessments booked on the account within the estimate lookback months:
    estimate_share: >-
      two or more give the two-estimate share, exactly one gives the one-estimate share, and none gives an estimate
      share of one.
    quarter_assessed: 'The payment share follows the contributions of the quarter being relieved:'
    quarter_paid: >-
      contributions assessed for that quarter and not yet fully covered by the payments and credits applied to them
      give the unpaid payment share,
    last_contribution_payment: >-
      contributions fully covered with the last contribution payment after the report's due date give the late payment
      share,
    relief_due_date: >-
      contributions fully covered with the last contribution payment after the report's due date give the late payment
      share,
    quarter_credited: >-
      contributions assessed for that quarter and not yet fully covered by the payments and credits applied to them
      give the unpaid payment share,
    payment_share: >-
      contributions assessed for that quarter and not yet fully covered by the payments and credits applied to them
      give the unpaid payment share, contributions fully covered with the last contribution payment after the report's
      due date give the late payment share, and contributions fully covered by the due date give a payment share
      of one.
    late_answer_date: >-
      The cooperation share follows the most recent answer the employer gave to a notice of claim on its benefit
      charge positions that is recorded as late without good cause (answers recorded as late with good cause do
      not count):
    cooperation_share: >-
      when that answer was received no more than the recent cooperation days before the request it gives the recent
      cooperation share, when it was received more than the recent cooperation days but no more than the older cooperation
      days before the request it gives the older cooperation share, and when there is no such answer within the
      older cooperation days the cooperation share is one.
    relief_channel: 'The paper filing factor follows how the relieved quarter''s original report was filed:'
    portal_filings: >-
      a report filed on paper by an employer that filed at least two original reports through the online portal
      within the portal lookback months is multiplied by the two-filing paper factor,
    paper_relief_factor: >-
      a report filed on paper by an employer that filed at least two original reports through the online portal
      within the portal lookback months is multiplied by the two-filing paper factor, a report filed on paper by
      an employer that filed exactly one original report through the online portal within that lookback is multiplied
      by the one-filing paper factor, and any other report is not multiplied.
    result: >-
      That full penalty is multiplied by a history share, an estimate share, a payment share, a cooperation share
      and a paper filing factor, and the relief requested is the product of the penalty paid and all five, rounded
      to the cent once at the end.
  factors:
  - id: late_penalty_history_share
    effect: parameter
    decides: history_share
    bindings:
    - other_late_penalties
    - history_share
    ladder:
    - when: two or more other late report penalties within the abatement lookback
      value: K('two_penalty_history_share')
    - when: exactly one other late report penalty within the abatement lookback
      value: K('one_penalty_history_share')
    - when: otherwise
      value: '1'
    baseline:
      history_share: '1'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: relief_lookback_length
    effect: method
    decides: relief_lookback_months
    bindings:
    - late_interest_entries
    - relief_liability_months
    - last_interest_date
    - relief_lookback_months
    ladder:
    - when: account in delinquent status
      method: >-
        other late report penalties are counted from the account's registration: the window is its whole liability,
        one month more than its whole months of liability
    - when: account in active status with no late payment interest entry within the payment record months
      method: >-
        other late report penalties are counted only back to the entry date of the account's most recent late payment
        interest entry (one month more than the whole months since it), or from registration when there has never
        been one
    - when: otherwise
      method: >-
        other late report penalties are counted over the class's penalty abatement lookback quarters (three months
        each)
    baseline:
      relief_lookback_months: P('penalty_abatement_lookback_quarters') * 3
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: estimated_assessment_share
    effect: parameter
    decides: estimate_share
    bindings:
    - recent_estimates
    - estimate_share
    ladder:
    - when: two or more estimated assessments within the estimate lookback months
      value: K('two_estimate_share')
    - when: exactly one estimated assessment within the estimate lookback months
      value: K('one_estimate_share')
    - when: otherwise
      value: '1'
    baseline:
      estimate_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: quarter_payment_share
    effect: parameter
    decides: payment_share
    bindings:
    - quarter_assessed
    - quarter_paid
    - quarter_credited
    - last_contribution_payment
    - relief_due_date
    - payment_share
    ladder:
    - when: contributions assessed for the relieved quarter not yet fully covered by payments and credits
      value: K('unpaid_payment_share')
    - when: contributions fully covered, last contribution payment after the report's due date
      value: K('late_payment_share')
    - when: otherwise (fully covered by the due date)
      value: '1'
    baseline:
      payment_share: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: claim_notice_cooperation_share
    effect: parameter
    decides: cooperation_share
    bindings:
    - late_answer_date
    - cooperation_share
    ladder:
    - when: >-
        the most recent answer to a notice of claim recorded as late without good cause was received no more than
        the recent cooperation days before the request
      value: K('recent_cooperation_share')
    - when: >-
        that answer was received more than the recent but no more than the older cooperation days before the request
      value: K('older_cooperation_share')
    - when: otherwise (no such answer within the older cooperation days)
      value: '1'
    baseline:
      cooperation_share: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: charge
  - id: paper_filing_relief_factor
    effect: parameter
    decides: paper_relief_factor
    bindings:
    - relief_channel
    - portal_filings
    - paper_relief_factor
    ladder:
    - when: >-
        relieved report filed on paper and at least two original reports filed through the online portal within
        the portal lookback months
      value: K('two_filing_paper_factor')
    - when: >-
        relieved report filed on paper and exactly one original report filed through the online portal within that
        lookback
      value: K('one_filing_paper_factor')
    - when: otherwise
      value: '1'
    baseline:
      paper_relief_factor: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The relief requested is the penalty paid for that quarter, in full, rounded to the cent.
    params: []
  inputs:
    history:
    - table: employer_tax_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: taxacct_payment_received
        component: penalty
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      filters:
        event_type: taxacct_penalty_assessed
        penalty_type: late_report
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      within_months: 12
      filters:
        event_type: taxacct_contribution_assessed
        assessment_basis: estimated_assessment
    - table: employer_tax_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: taxacct_payment_received
        component: contribution
    - table: employer_wage_reports
      aggregate: count
      field: wage_report_id
      within_months: 12
      filters:
        filing_channel: online_portal
    - category: charge
      table: charge_positions
      aggregate: latest
      field: response_date
      filters:
        response_timeliness: late
    - table: employer_tax_ledger
      aggregate: count
      field: tax_entry_id
      within_months: 12
      filters:
        event_type: taxacct_interest_assessed
    - table: employer_tax_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: taxacct_interest_assessed
    cross_category:
    - charge
