# Policy charter: Employer Unemployment Insurance Tax Accounts (employer side).
# One holding = one employer's unemployment insurance tax account, held in one financing class at a time.
category: taxacct
display_name: Employer Unemployment Insurance Tax Accounts

binding:
  holding_table: employer_accounts
  event_tables: [employer_wage_reports, employer_tax_ledger]
  intake_tables: [employer_account_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: contribution_balance_due, reserve_balance: reserve_account_balance}

lifecycle:
  states: [registered, active, delinquent, inactive, closed]
  transitions:
    - {from: registered, to: active, by: system, means: The employer becomes liable with its first quarter of covered wages.}
    - {from: active, to: delinquent, by: system, means: A report is unfiled or a balance unpaid past the delinquency days after its due date.}
    - {from: delinquent, to: active, by: agent, means: Every overdue report is filed and every overdue balance is paid.}
    - {from: active, to: inactive, by: agent, means: The employer reports no wages for the inactivation quarters or tells the agency it temporarily has no employees.}
    - {from: inactive, to: active, by: agent, means: Wages resume within the reactivation window.}
    - {from: registered, to: closed, by: user, means: The employer confirms it never became liable and asks to close the registration.}
    - {from: active, to: closed, by: user, means: The employer confirms the business ended, after its final report and a zero balance.}
    - {from: inactive, to: closed, by: user, means: The employer confirms the business ended while inactive, with a zero balance.}

accounts:
  - key: contribution_balance_due
    unit: USD
    meaning: Amount the employer owes - contributions, reimbursement bills, penalties and interest assessed less payments and credits; negative is a credit owed to the employer.
  - key: reserve_account_balance
    unit: USD
    meaning: Experience-rating reserve of a contributory employer - contributions paid and voluntary contributions credited less benefit charges posted; it drives the reserve ratio.

parameter_schema:
  taxable_wage_base: "Wages per employee per calendar year subject to contributions; wages above it are excess wages (USD)"
  excess_wages_basis: "How excess wages are measured (enum)"
  financing_method: "How the employer finances benefits (enum: contributory or reimbursing)"
  contribution_rate_basis: "How the contribution rate is set (enum)"
  new_employer_rate: "Contribution rate of a new employer before experience rating (decimal); 0 means not a new-employer class"
  rate_schedule: "Reserve-ratio ladder for experience-rated classes, rows ordered from the highest floor; the rate is that of the first row whose reserve_ratio_floor the reserve ratio meets (list of {reserve_ratio_floor, rate}); empty when not experience rated"
  delinquent_assigned_rate: "Rate assigned for the year to an employer with reports missing at the computation date (decimal); 0 means not this class"
  construction_naics_prefix: "NAICS code prefix that places a new employer in the construction class (text)"
  experience_rating_eligibility_months: "Consecutive months of liability ending on the computation date after which a new employer moves to an experience-rated class (months); 0 means not a new-employer class"
  computation_date: "Date each year at which reserve balances and payroll are measured for the next rate year (month and day)"
  rate_year_basis: "Period a rate applies to (enum)"
  rate_notice_mailing_deadline: "Latest date each year by which the rate notice for the next rate year is mailed (month and day)"
  reserve_ratio_payroll_years: "Number of fiscal years ending on the computation date whose taxable payroll is averaged in the reserve ratio (years)"
  reserve_credit_basis: "What is credited to the reserve account (enum)"
  voluntary_contribution_allowed: "Whether the employer may make a voluntary contribution to lower its rate (boolean)"
  voluntary_contribution_window_days: "Calendar days after the rate notice mailing date within which a voluntary contribution must be received (days); 0 means not available"
  voluntary_contribution_refundable: "Whether a voluntary contribution can be refunded (boolean)"
  report_due_rule: "Due date of the quarterly contribution and wage report and of contributions (enum)"
  employee_count_reference_day: "Day of each month on which employees are counted for the report (day of month)"
  electronic_filing_required_min_employees: "Employee count at or above which reports must be filed electronically (count)"
  late_report_penalty_flat: "Minimum penalty for a report filed after its due date (USD)"
  late_report_penalty_pct_of_wages: "Late report penalty as a share of the quarter's total wages, if larger than the flat amount (decimal)"
  late_report_penalty_max: "Cap on the late report penalty per report (USD)"
  late_payment_interest_rate_monthly: "Interest per month or part of a month on contributions or reimbursement bills unpaid after the due date (decimal per month)"
  interest_partial_month_basis: "How a part month of lateness counts for interest (enum)"
  penalty_abatement_lookback_quarters: "Quarters before the late quarter that must be free of other late reports for a first-time penalty abatement (quarters)"
  penalty_abatement_request_days: "Calendar days after the penalty assessment within which abatement must be requested (days)"
  interest_abatement_allowed: "Whether interest may be abated (boolean)"
  delinquency_trigger_days: "Calendar days after the due date with a report unfiled or a balance unpaid before the account is delinquent (days)"
  estimated_assessment_after_days: "Calendar days after the due date of an unfiled report before an estimated assessment is issued (days)"
  estimated_assessment_wage_uplift: "Multiple applied to the highest of the last four reported quarters' taxable wages for an estimated assessment (decimal)"
  payment_channels: "Channels through which payments are accepted (list)"
  payment_application_order: "Order in which a payment not designated by quarter is applied (enum)"
  credit_application_default: "What happens to a credit balance not claimed as a refund (enum)"
  credit_refund_request_months: "Calendar months after the payment that created a credit within which a refund must be requested (months)"
  refund_processing_business_days: "Business days to issue an approved refund (business days)"
  inactivation_zero_wage_quarters: "Consecutive quarters with no wages reported after which the account is inactivated (quarters)"
  reactivation_window_quarters: "Quarters after inactivation within which wages resuming reactivate the same account with its experience (quarters)"
  closure_final_report_required: "Whether a final report marked as the last quarter of wages is required to close the account (boolean)"
  closure_balance_must_be_zero: "Whether the balance due must be zero before the account closes (boolean)"
  reimbursing_election_window_days: "Calendar days after the liability determination within which an eligible entity may elect reimbursing financing (days); 0 means not eligible"
  reimbursing_election_min_years: "Minimum full calendar years an election of reimbursing financing stays in force (years); 0 means not applicable"
  reimbursing_termination_notice_days: "Calendar days before January 1 by which a reimbursing employer must file to return to contributory financing (days); 0 means not applicable"
  reimbursing_security_pct_of_taxable_wages: "Surety bond or deposit a reimbursing employer must keep, as a share of the prior year's taxable wages (decimal); 0 means none"
  reimbursement_bill_frequency: "How often a reimbursing employer is billed for benefits charged (enum)"
  reimbursement_bill_due_days: "Calendar days after the bill is mailed within which it must be paid (days); 0 means not billed"
  experience_transfer_common_ownership_mandatory: "Whether experience transfers mandatorily when the predecessor and successor share ownership, management or control (boolean)"
  experience_transfer_application_days: "Calendar days after an acquisition without common ownership within which the successor may apply for a transfer of experience (days)"
  successor_rate_effective: "When the transferred experience changes the successor's rate (enum)"
  charges_posting_frequency: "How often benefit charges are posted to the reserve account (enum)"

