- id: overpay_ext_plan_reinstatement
  base_policy_refs:
  - overpay_repayment_plan
  overwrite:
  - base_policy: overpay_repayment_plan
    superseded_clause: The monthly installment is at least the classification's minimum monthly payment and at least the balance divided by the classification's maximum plan months, rounded up to the cent; the claimant may choose a larger installment.
    replaced_by: The reinstated monthly installment is the overpayment's balance divided by the classification's maximum plan months, rounded up to the cent and never less than the classification's minimum monthly payment.
  trigger: on_request
  subject:
  - overpay_repayment_plan_set
  computes: monthly_amount
  target_tool: reinstate_repayment_plan_54c54ed5
  params:
    multiple_return_share: 0.5
    single_return_share: 0.75
    early_breakdown_months: 6
    mid_breakdown_months: 12
    intercept_lookback_months: 12
    intercept_large_amount: 1000.0
    intercept_large_extension: 6
    intercept_small_extension: 3
    first_offense_penalty_months: 12
    repeat_offense_penalty_months: 6
  rule: 'A claimant whose repayment plan has defaulted may have the plan reinstated; the reinstated plan returns to current standing and carries exactly the reinstated monthly installment worked out below, keeping its first installment due date and the classification''s due day. A defaulted plan is not reinstated until a repayment at least equal to the arrears payment worked out for it has been booked on the overpayment after the plan''s most recent returned installment. The reinstated monthly installment is the overpayment''s balance divided by the classification''s maximum plan months, rounded up to the cent and never less than the classification''s minimum monthly payment. The balance is the overpayment''s balance due at the time of reinstatement. The reinstatement months over which the balance is spread follow the installments returned unpaid under the plan, counting the return entries booked within the whole months elapsed from the first installment due date to the handling date plus the month in progress: two or more returned installments allow the multiple-return share of the classification''s maximum plan months, exactly one allows the single-return share of them, and none allows the classification''s maximum plan months in full, each share counted in whole months with any fraction of a month dropped. Months are taken off the reinstatement months according to when the plan broke down, dated by its most recent returned installment: when fewer than the early-breakdown months passed from the first installment due date to that return, the reinstated plan keeps the end the defaulted plan was set to have, so the whole months elapsed from the first installment due date to the handling date are taken off; when at least the early-breakdown months but fewer than the mid-breakdown months passed, only the whole months from that return to the handling date are taken off; when the mid-breakdown months or more passed, or no installment has been returned, nothing is taken off. A claimant whose federal or state tax refund was intercepted for the overpayment within the intercept look-back months before the handling date receives intercept relief months added to the reinstatement months: intercepts totalling at least the large-intercept amount add the large intercept extension, smaller intercepts add the small intercept extension, and no intercept adds nothing. The reinstatement months after any months taken off and any relief months added are never fewer than one. On a fraud overpayment with penalty standing unpaid, the reinstated installment spreads the penalty over its own shorter schedule: on a first-offense fraud overpayment the unpaid penalty is divided by the first-offense penalty months and the rest of the balance by the reinstatement months, and the two parts are added; on a repeat-offense fraud overpayment the unpaid penalty is divided by the repeat-offense penalty months and the rest of the balance by the reinstatement months, and the two parts are added; on any other overpayment the whole balance is divided by the reinstatement months. The penalty standing unpaid is the penalty assessed less the penalty recovered by repayments, benefit offsets and tax refund intercepts, plus the penalty put back by returned repayments. The monthly amount so obtained is rounded up to the cent and is never less than the classification''s minimum monthly payment.'
  prerequisite:
  - problem: overpay_ext_plan_arrears
    kind: value_input
    gate: balance
    form: state
    policy_source: A defaulted plan is not reinstated until a repayment at least equal to the arrears payment worked out for it has been booked on the overpayment after the plan's most recent returned installment.
    condition: The overpay_ledger carries an overpay_repayment_received entry dated after the latest overpay_repayment_returned entry whose amount is at least the arrears payment, and overpayments.balance_due reflects it.
    resolved_by: pay_overpayment_arrears_d9b1e543
    effect: The arrears payment lowers the overpayment's balance due by its amount, so the balance spread over the reinstatement months (binding balance) falls by the arrears paid and the reinstated installment falls with it.
  cross_category: []
  compute:
  - first_due: F('repayment_plan_start_date')
  - months_on_plan: MONTHS(first_due, NOW)
  - last_returned_on: LATEST('overpay_ledger','entry_date', date_field='entry_date', event_type='overpay_repayment_returned')
  - returned_installments: COUNT('overpay_ledger', within_months=months_on_plan + 1, date_field='entry_date', event_type='overpay_repayment_returned')
  - base_reinstatement_months: int(P('max_plan_months') * K('multiple_return_share')) if returned_installments >= 2 else (int(P('max_plan_months') * K('single_return_share')) if returned_installments == 1 else P('max_plan_months'))
  - months_to_breakdown: MONTHS(first_due, last_returned_on) if last_returned_on != None else months_on_plan
  - months_taken_off: months_on_plan if last_returned_on != None and months_to_breakdown < K('early_breakdown_months') else (MONTHS(last_returned_on, NOW) if last_returned_on != None and months_to_breakdown < K('mid_breakdown_months') else 0)
  - intercepted_recently: SUM('overpay_ledger','amount', within_months=K('intercept_lookback_months'), date_field='entry_date', event_type='overpay_intercept_recovered')
  - intercept_relief_months: K('intercept_large_extension') if intercepted_recently >= K('intercept_large_amount') else (K('intercept_small_extension') if intercepted_recently > 0 else 0)
  - reinstatement_months: MX(1, base_reinstatement_months - months_taken_off + intercept_relief_months)
  - balance: F('balance_due')
  - penalty_unpaid: SUM('overpay_ledger','amount', event_type='overpay_penalty_assessed') - SUM('overpay_ledger','amount', event_type='overpay_repayment_received', component='penalty') - SUM('overpay_ledger','amount', event_type='overpay_offset_recovered', component='penalty') - SUM('overpay_ledger','amount', event_type='overpay_intercept_recovered', component='penalty') + SUM('overpay_ledger','amount', event_type='overpay_repayment_returned', component='penalty')
  - monthly_due: penalty_unpaid / K('first_offense_penalty_months') + (balance - penalty_unpaid) / reinstatement_months if F('variant_name') == 'Fraud Overpayment — First Offense' and penalty_unpaid > 0 else (penalty_unpaid / K('repeat_offense_penalty_months') + (balance - penalty_unpaid) / reinstatement_months if F('variant_name') == 'Fraud Overpayment — Repeat Offense' and penalty_unpaid > 0 else balance / reinstatement_months)
  - monthly_cents: RND(monthly_due * 100, 6)
  - result: MX(P('min_monthly_payment'), (int(monthly_cents) + (1 if monthly_cents > int(monthly_cents) else 0)) / 100)
  compute_basis:
    first_due: keeping its first installment due date and the classification's due day.
    months_on_plan: the whole months elapsed from the first installment due date to the handling date are taken off
    last_returned_on: Months are taken off the reinstatement months according to when the plan broke down, dated by its most recent returned installment
    returned_installments: counting the return entries booked within the whole months elapsed from the first installment due date to the handling date plus the month in progress
    base_reinstatement_months: two or more returned installments allow the multiple-return share of the classification's maximum plan months, exactly one allows the single-return share of them, and none allows the classification's maximum plan months in full, each share counted in whole months with any fraction of a month dropped.
    months_to_breakdown: when fewer than the early-breakdown months passed from the first installment due date to that return
    months_taken_off: when fewer than the early-breakdown months passed from the first installment due date to that return, the reinstated plan keeps the end the defaulted plan was set to have, so the whole months elapsed from the first installment due date to the handling date are taken off; when at least the early-breakdown months but fewer than the mid-breakdown months passed, only the whole months from that return to the handling date are taken off; when the mid-breakdown months or more passed, or no installment has been returned, nothing is taken off.
    intercepted_recently: A claimant whose federal or state tax refund was intercepted for the overpayment within the intercept look-back months before the handling date
    intercept_relief_months: intercepts totalling at least the large-intercept amount add the large intercept extension, smaller intercepts add the small intercept extension, and no intercept adds nothing.
    reinstatement_months: The reinstatement months after any months taken off and any relief months added are never fewer than one.
    balance: The balance is the overpayment's balance due at the time of reinstatement.
    penalty_unpaid: The penalty standing unpaid is the penalty assessed less the penalty recovered by repayments, benefit offsets and tax refund intercepts, plus the penalty put back by returned repayments.
    monthly_due: on a first-offense fraud overpayment the unpaid penalty is divided by the first-offense penalty months and the rest of the balance by the reinstatement months, and the two parts are added; on a repeat-offense fraud overpayment the unpaid penalty is divided by the repeat-offense penalty months and the rest of the balance by the reinstatement months, and the two parts are added; on any other overpayment the whole balance is divided by the reinstatement months.
    monthly_cents: The monthly amount so obtained is rounded up to the cent
    result: The monthly amount so obtained is rounded up to the cent and is never less than the classification's minimum monthly payment.
  factors:
  - id: returned_installment_months
    effect: parameter
    decides: base_reinstatement_months
    bindings:
    - returned_installments
    - base_reinstatement_months
    ladder:
    - when: two or more installments were returned unpaid under the plan
      value: int(P('max_plan_months') * K('multiple_return_share'))
    - when: exactly one installment was returned unpaid under the plan
      value: int(P('max_plan_months') * K('single_return_share'))
    - when: otherwise (no returned installment)
      value: P('max_plan_months')
    baseline:
      base_reinstatement_months: P('max_plan_months')
    evidence:
    - history
    cross_difficulty: null
  - id: defaulted_plan_end_anchor
    effect: method
    decides: months_taken_off
    bindings:
    - months_to_breakdown
    - months_taken_off
    ladder:
    - when: fewer than the early-breakdown months passed from the first installment due date to the most recent returned installment
      method: 'keep the defaulted plan''s end: take off the whole months elapsed from the first installment due date to the handling date'
    - when: at least the early-breakdown months but fewer than the mid-breakdown months passed
      method: take off only the whole months from the most recent returned installment to the handling date
    - when: otherwise (the mid-breakdown months or more, or no returned installment)
      method: count the reinstatement months afresh from the reinstatement, taking nothing off
    baseline:
      months_taken_off: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: intercept_relief
    effect: parameter
    decides: intercept_relief_months
    bindings:
    - intercepted_recently
    - intercept_relief_months
    ladder:
    - when: tax refund intercepts for the overpayment within the intercept look-back months total at least the large-intercept amount
      value: K('intercept_large_extension')
    - when: intercepts within the look-back total less than the large-intercept amount but more than zero
      value: K('intercept_small_extension')
    - when: otherwise (no intercept in the look-back)
      value: '0'
    baseline:
      intercept_relief_months: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fraud_penalty_schedule
    effect: method
    decides: monthly_due
    bindings:
    - penalty_unpaid
    - monthly_due
    ladder:
    - when: the overpayment is a first-offense fraud overpayment with penalty standing unpaid
      method: divide the unpaid penalty by the first-offense penalty months and the rest of the balance by the reinstatement months, and add the two parts
    - when: the overpayment is a repeat-offense fraud overpayment with penalty standing unpaid
      method: divide the unpaid penalty by the repeat-offense penalty months and the rest of the balance by the reinstatement months, and add the two parts
    - when: otherwise
      method: divide the whole balance by the reinstatement months
    baseline:
      monthly_due: balance / reinstatement_months
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The reinstated monthly installment is the overpayment's balance divided by the classification's maximum plan months, rounded up to the cent and never less than the classification's minimum monthly payment. The balance is the overpayment's balance due at the time of reinstatement.
    params:
    - max_plan_months
    - min_monthly_payment
  inputs:
    history:
    - table: overpay_ledger
      aggregate: count
      field: overpay_entry_id
      filters:
        event_type: overpay_repayment_returned
    - table: overpay_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: overpay_repayment_returned
    - table: overpay_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: overpay_intercept_recovered
    - table: overpay_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: overpay_penalty_assessed
    cross_category: []
- id: overpay_ext_new_plan_installment
  base_policy_refs:
  - overpay_repayment_plan
  overwrite:
  - base_policy: overpay_repayment_plan
    superseded_clause: The monthly installment is at least the classification's minimum monthly payment and at least the balance divided by the classification's maximum plan months, rounded up to the cent; the claimant may choose a larger installment.
    replaced_by: The monthly installment of a new plan is the overpayment's balance divided by the classification's maximum plan months, rounded up to the cent and never less than the classification's minimum monthly payment.
  trigger: on_request
  subject:
  - overpay_repayment_plan_set
  computes: monthly_amount
  target_tool: set_up_repayment_plan_0b609272
  params:
    small_principal_cap: 1500.0
    mid_principal_cap: 5000.0
    small_principal_share: 0.5
    mid_principal_share: 0.75
    long_delay_months: 18
    short_delay_months: 12
    long_delay_extension: 6
    short_delay_extension: 3
    full_anchor_months: 6
    partial_anchor_months: 3
    recent_payment_days: 90
    older_payment_days: 180
    recent_good_faith_extension: 3
    older_good_faith_extension: 1
    return_history_months: 12
    two_return_reduction: 12
    one_return_reduction: 6
    long_off_benefit_days: 365
    short_off_benefit_days: 90
    long_return_to_work_reduction: 3
    short_return_to_work_reduction: 1
  rule: 'A claimant sets up a monthly repayment plan on an overpayment that has none by agreeing to the monthly installment worked out below; the new plan carries exactly that installment, its first installment falls due the classification''s first-payment days after the plan is set, and later installments fall due on the classification''s due day. A new repayment plan is set only after none of the claimant''s other overpayments carries a repayment plan whose status is defaulted. The monthly installment of a new plan is the overpayment''s balance divided by the classification''s maximum plan months, rounded up to the cent and never less than the classification''s minimum monthly payment. The balance is the overpayment''s balance due when the plan is set. The plan months follow the size of the principal established on the overpayment: a principal up to the small-principal cap is spread over the small-principal share of the classification''s maximum plan months, a principal above the small-principal cap up to the mid-principal cap over the mid-principal share of them, and a larger principal over the classification''s maximum plan months in full, each share counted in whole months with any fraction of a month dropped. An overpayment the Department established long after the weeks it covers earns delay months, measured in whole months from the last overpaid week to the determination date: the long-delay months or more add the long-delay extension, the short-delay months or more but fewer than the long-delay months add the short-delay extension, and a shorter delay adds nothing. A plan set well after the determination is counted from the determination date: when more than the full-anchor months have elapsed from the determination date to the handling date, all of those whole months are taken off the plan months; when at least the partial-anchor months and no more than the full-anchor months have elapsed, those whole months less one are taken off; when fewer than the partial-anchor months have elapsed, nothing is taken off. A recent voluntary repayment earns good-faith months, measured in calendar days from the most recent repayment received on the overpayment to the handling date: the recent-payment days or fewer add the recent good-faith extension, more than the recent-payment days up to the older-payment days add the older good-faith extension, and a longer gap or no repayment at all adds nothing. Repayments on the overpayment that came back unpaid shorten the plan, counting the return entries booked on the overpayment within the return-history months before the handling date: two or more returns take off the two-return reduction, exactly one return takes off the one-return reduction, and no return takes off nothing. A claimant back at work is expected to repay sooner, measured in calendar days from the most recent weekly benefit payment on any of the claimant''s unemployment claims to the handling date: more than the long off-benefit days take off the long return-to-work reduction, more than the short off-benefit days up to the long off-benefit days take off the short return-to-work reduction, and fewer days, or no benefit payment on record, take off nothing. The plan months are the principal-size months plus the delay extension and the good-faith extension, less the months counted from the determination date, the returned-payment reduction and the return-to-work reduction, and never fewer than one; the monthly installment is the balance divided by those plan months, rounded up to the cent and never less than the classification''s minimum monthly payment.'
  prerequisite:
  - problem: overpay_ext_plan_reinstatement
    kind: state_gate
    gate: overpayments.repayment_plan_status
    form: state
    policy_source: A new repayment plan is set only after none of the claimant's other overpayments carries a repayment plan whose status is defaulted.
    condition: No other overpayments row of the same customer has repayment_plan_status defaulted.
    resolved_by: reinstate_repayment_plan_54c54ed5
    effect: Reinstatement turns the other overpayment's plan status from defaulted to current, which opens the gate for setting the new plan; the new plan's installment itself is computed from this overpayment's own records.
  cross_category:
  - category: claim
    as: history
    reads:
    - claim_ledger.entry_date
    - claim_ledger.event_type
    note: The return-to-work reduction is decided from the date of the most recent weekly benefit payment on the claimant's unemployment claims.
  compute:
  - balance: F('balance_due')
  - principal_established: SUM('overpay_ledger','amount', event_type='overpay_principal_assessed')
  - principal_size_months: int(P('max_plan_months') * K('small_principal_share')) if principal_established <= K('small_principal_cap') else (int(P('max_plan_months') * K('mid_principal_share')) if principal_established <= K('mid_principal_cap') else P('max_plan_months'))
  - establishment_delay_months: MONTHS(F('overpaid_week_end'), F('determination_date'))
  - delay_extension: K('long_delay_extension') if establishment_delay_months >= K('long_delay_months') else (K('short_delay_extension') if establishment_delay_months >= K('short_delay_months') else 0)
  - months_since_determination: MONTHS(F('determination_date'), NOW)
  - determination_months_off: months_since_determination if months_since_determination > K('full_anchor_months') else (months_since_determination - 1 if months_since_determination >= K('partial_anchor_months') else 0)
  - last_repayment_on: LATEST('overpay_ledger','entry_date', date_field='entry_date', event_type='overpay_repayment_received')
  - days_since_repayment: DAYS(last_repayment_on, NOW) if last_repayment_on != None else 100000
  - good_faith_extension: K('recent_good_faith_extension') if days_since_repayment <= K('recent_payment_days') else (K('older_good_faith_extension') if days_since_repayment <= K('older_payment_days') else 0)
  - recent_returns: COUNT('overpay_ledger', within_months=K('return_history_months'), date_field='entry_date', event_type='overpay_repayment_returned')
  - returned_payment_reduction: K('two_return_reduction') if recent_returns >= 2 else (K('one_return_reduction') if recent_returns == 1 else 0)
  - last_benefit_paid_on: XLATEST('claim','claim_ledger','entry_date', date_field='entry_date', event_type='claim_benefit_paid')
  - days_off_benefits: DAYS(last_benefit_paid_on, NOW) if last_benefit_paid_on != None else 0
  - return_to_work_reduction: K('long_return_to_work_reduction') if days_off_benefits > K('long_off_benefit_days') else (K('short_return_to_work_reduction') if days_off_benefits > K('short_off_benefit_days') else 0)
  - plan_months: MX(1, principal_size_months + delay_extension + good_faith_extension - determination_months_off - returned_payment_reduction - return_to_work_reduction)
  - monthly_cents: RND(balance / plan_months * 100, 6)
  - result: MX(P('min_monthly_payment'), (int(monthly_cents) + (1 if monthly_cents > int(monthly_cents) else 0)) / 100)
  compute_basis:
    balance: The balance is the overpayment's balance due when the plan is set.
    principal_established: The plan months follow the size of the principal established on the overpayment
    principal_size_months: a principal up to the small-principal cap is spread over the small-principal share of the classification's maximum plan months, a principal above the small-principal cap up to the mid-principal cap over the mid-principal share of them, and a larger principal over the classification's maximum plan months in full, each share counted in whole months with any fraction of a month dropped.
    establishment_delay_months: measured in whole months from the last overpaid week to the determination date
    delay_extension: the long-delay months or more add the long-delay extension, the short-delay months or more but fewer than the long-delay months add the short-delay extension, and a shorter delay adds nothing.
    months_since_determination: when more than the full-anchor months have elapsed from the determination date to the handling date
    determination_months_off: when more than the full-anchor months have elapsed from the determination date to the handling date, all of those whole months are taken off the plan months; when at least the partial-anchor months and no more than the full-anchor months have elapsed, those whole months less one are taken off; when fewer than the partial-anchor months have elapsed, nothing is taken off.
    last_repayment_on: measured in calendar days from the most recent repayment received on the overpayment to the handling date
    days_since_repayment: measured in calendar days from the most recent repayment received on the overpayment to the handling date
    good_faith_extension: the recent-payment days or fewer add the recent good-faith extension, more than the recent-payment days up to the older-payment days add the older good-faith extension, and a longer gap or no repayment at all adds nothing.
    recent_returns: counting the return entries booked on the overpayment within the return-history months before the handling date
    returned_payment_reduction: two or more returns take off the two-return reduction, exactly one return takes off the one-return reduction, and no return takes off nothing.
    last_benefit_paid_on: measured in calendar days from the most recent weekly benefit payment on any of the claimant's unemployment claims to the handling date
    days_off_benefits: measured in calendar days from the most recent weekly benefit payment on any of the claimant's unemployment claims to the handling date
    return_to_work_reduction: more than the long off-benefit days take off the long return-to-work reduction, more than the short off-benefit days up to the long off-benefit days take off the short return-to-work reduction, and fewer days, or no benefit payment on record, take off nothing.
    plan_months: The plan months are the principal-size months plus the delay extension and the good-faith extension, less the months counted from the determination date, the returned-payment reduction and the return-to-work reduction, and never fewer than one
    monthly_cents: the monthly installment is the balance divided by those plan months, rounded up to the cent
    result: the monthly installment is the balance divided by those plan months, rounded up to the cent and never less than the classification's minimum monthly payment.
  factors:
  - id: principal_size_months
    effect: parameter
    decides: principal_size_months
    bindings:
    - principal_established
    - principal_size_months
    ladder:
    - when: the principal established is up to the small-principal cap
      value: int(P('max_plan_months') * K('small_principal_share'))
    - when: the principal established is above the small-principal cap and up to the mid-principal cap
      value: int(P('max_plan_months') * K('mid_principal_share'))
    - when: otherwise (a larger principal)
      value: P('max_plan_months')
    baseline:
      principal_size_months: P('max_plan_months')
    evidence:
    - history
    cross_difficulty: null
  - id: establishment_delay_extension
    effect: parameter
    decides: delay_extension
    bindings:
    - establishment_delay_months
    - delay_extension
    ladder:
    - when: the long-delay months or more passed from the last overpaid week to the determination date
      value: K('long_delay_extension')
    - when: the short-delay months or more but fewer than the long-delay months passed
      value: K('short_delay_extension')
    - when: otherwise (a shorter delay)
      value: '0'
    baseline:
      delay_extension: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: determination_date_anchor
    effect: method
    decides: determination_months_off
    bindings:
    - months_since_determination
    - determination_months_off
    ladder:
    - when: more than the full-anchor months have elapsed from the determination date to the handling date
      method: 'count the plan from the determination date: take off all the whole months elapsed since it'
    - when: at least the partial-anchor months and no more than the full-anchor months have elapsed
      method: 'count the plan from the month after the determination: take off the whole months elapsed less one'
    - when: otherwise (fewer than the partial-anchor months)
      method: 'count the plan from the day it is set: take nothing off'
    baseline:
      determination_months_off: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: good_faith_payment
    effect: parameter
    decides: good_faith_extension
    bindings:
    - last_repayment_on
    - days_since_repayment
    - good_faith_extension
    ladder:
    - when: the most recent repayment on the overpayment was received the recent-payment days or fewer before the handling date
      value: K('recent_good_faith_extension')
    - when: it was received more than the recent-payment days and up to the older-payment days before
      value: K('older_good_faith_extension')
    - when: otherwise (a longer gap or no repayment)
      value: '0'
    baseline:
      good_faith_extension: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: returned_payment_history
    effect: parameter
    decides: returned_payment_reduction
    bindings:
    - recent_returns
    - returned_payment_reduction
    ladder:
    - when: two or more return entries were booked on the overpayment within the return-history months
      value: K('two_return_reduction')
    - when: exactly one return entry was booked on the overpayment within the return-history months
      value: K('one_return_reduction')
    - when: otherwise (no return)
      value: '0'
    baseline:
      returned_payment_reduction: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: return_to_work
    effect: parameter
    decides: return_to_work_reduction
    bindings:
    - last_benefit_paid_on
    - days_off_benefits
    - return_to_work_reduction
    ladder:
    - when: more than the long off-benefit days passed since the most recent weekly benefit payment on the claimant's unemployment claims
      value: K('long_return_to_work_reduction')
    - when: more than the short off-benefit days and up to the long off-benefit days passed
      value: K('short_return_to_work_reduction')
    - when: otherwise (fewer days, or no benefit payment on record)
      value: '0'
    baseline:
      return_to_work_reduction: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: claim
  baseline:
    rule: The monthly installment of a new plan is the overpayment's balance divided by the classification's maximum plan months, rounded up to the cent and never less than the classification's minimum monthly payment. The balance is the overpayment's balance due when the plan is set.
    params:
    - max_plan_months
    - min_monthly_payment
  inputs:
    history:
    - table: overpay_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: overpay_repayment_received
    - table: overpay_ledger
      aggregate: count
      field: overpay_entry_id
      within_months: 12
      filters:
        event_type: overpay_repayment_returned
    - category: claim
      table: claim_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: claim_benefit_paid
    cross_category:
    - claim
- id: overpay_ext_waiver_household_income
  base_policy_refs:
  - overpay_waiver
  overwrite: []
  trigger: on_request
  subject:
  - overpay_waiver_review_opened
  computes: annual_household_income
  target_tool: complete_waiver_household_income_abba3816
  params:
    income_window_months: 3
    annualizing_multiplier: 4
    weeks_per_year: 52
    full_deduction_average_hours: 20.0
    earned_income_share_full: 0.05
    earned_income_share_partial: 0.025
  rule: 'A waiver request that reached review without the household''s annual income stands incomplete, and the claimant completes it on the record by confirming the income worked out below for the request; a request no longer awaiting decision is not completed and keeps the income it carries. An annual household income recorded as 0.00 on a request is the record of a request lodged without any income figure; a request on which the claimant wrote an income figure keeps the figure the claimant wrote, and the income the claimant confirms on completion becomes the claimant''s own statement of income on the application. The completion is made only on a request whose review is already open and does not itself open a review. For a household of one person, the income entered is the claimant''s countable annual income worked out from the Department''s own records; for a household of more than one person the income stays as the claimant lodged it, because the other members'' income comes only from the claimant''s written figures, and nothing is worked out on a call. The countable annual income is the unemployment benefits paid to the claimant, counted by the date each payment was issued, plus the gross earnings the claimant reported for certified weeks, taking the entries of the income window of the three whole months before the handling date, with the sum multiplied by the annualizing multiplier and rounded to the cent. An entry falls in the income window when the whole months from its date to the handling date are fewer than the window''s months; a certified week is dated by the Saturday ending it. The dating of benefit payments follows what the window contains: when a supplemental payment was issued in the income window, every payment is counted by the week it pays for rather than by its issue date, so back pay for weeks ending before the window drops out; when no supplemental payment but a cancelled payment falls in the window, payments are counted by issue date less the payments cancelled in the window; otherwise payments are counted by issue date. An earned-income deduction is taken from the annualized earnings for work expenses, by the average hours worked over the certified weeks ending in the income window: an average of at least the full-deduction hours takes off the full earned-income share, a lower but positive average takes off the partial earned-income share, and no hours worked takes off nothing. Support the claimant is ordered to pay is excluded, as recorded on the Department''s withholding records: an active current child-support withholding order excludes its weekly amount times the weeks in a year; with no such order, an active arrears-only child-support order excludes the deductions taken under it in the income window times the annualizing multiplier; with neither order, nothing is excluded. Other pay reported on certified weeks ending in the income window is added: when a pension is reported, the latest weekly amount reported in the income window for each kind of pension, employer-funded and claimant-contributed, is added up and added times the weeks in a year; when no pension but vacation or holiday pay is reported, the vacation and holiday pay reported is added once, at the amounts reported; when none is reported, nothing is added. Income tax withheld from the benefits counted is excluded, taking the deductions dated the same way as the benefits counted: when an active voluntary federal income tax withholding election is on record, the federal tax withheld in the income window is excluded times the annualizing multiplier; when only an active voluntary state income tax withholding election is on record, the state tax withheld in the window is excluded times the annualizing multiplier; when neither is on record, nothing is excluded. The countable annual income is the counted benefits plus the counted earnings, times the annualizing multiplier, less the earned-income deduction, the support excluded and the tax excluded, plus the other pay added, never less than zero and rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: claim
    as: history
    reads:
    - claim_ledger.amount
    - claim_ledger.payment_kind
    - claim_ledger.entry_date
    - claim_ledger.week_ending_date
    - claim_certifications.gross_earnings
    - claim_certifications.hours_worked
    - claim_certifications.other_pay_type
    - claim_certifications.other_pay_amount
    note: The counted benefits, their dating, the counted earnings, the earned-income deduction and the other pay added are all decided from the claimant's benefit payments and weekly certifications.
  - category: withhold
    as: branch
    reads:
    - variant_name
    - status
    - weekly_amount
    - withholding_order_id
    - withholding_ledger.amount
    note: The support excluded and the tax excluded are decided from the claimant's child-support orders and voluntary income tax elections and the deductions taken under them.
  compute:
  - household_size: LATEST('overpay_waiver_requests','household_size', date_field='request_date')
  - lodged_income: LATEST('overpay_waiver_requests','annual_household_income', date_field='request_date')
  - supplemental_in_window: XCOUNT('claim','claim_ledger', within_months=K('income_window_months'), date_field='entry_date', event_type='claim_benefit_paid', payment_kind='supplemental')
  - cancelled_in_window: XSUM('claim','claim_ledger','amount', within_months=K('income_window_months'), date_field='entry_date', event_type='claim_payment_cancelled')
  - benefit_dating: '''week_ending_date'' if supplemental_in_window > 0 else ''entry_date'''
  - benefits_counted: XSUM('claim','claim_ledger','amount', within_months=K('income_window_months'), date_field=benefit_dating, event_type='claim_benefit_paid') - (cancelled_in_window if supplemental_in_window == 0 and cancelled_in_window > 0 else 0)
  - earnings_counted: XSUM('claim','claim_certifications','gross_earnings', within_months=K('income_window_months'), date_field='week_ending_date')
  - weeks_certified: XCOUNT('claim','claim_certifications', within_months=K('income_window_months'), date_field='week_ending_date')
  - average_hours: XSUM('claim','claim_certifications','hours_worked', within_months=K('income_window_months'), date_field='week_ending_date') / weeks_certified if weeks_certified > 0 else 0
  - earned_income_share: K('earned_income_share_full') if average_hours >= K('full_deduction_average_hours') else (K('earned_income_share_partial') if average_hours > 0 else 0)
  - current_support_weekly: CFIELD('withhold','weekly_amount', variant_name='Child Support Withholding — Current Support Order', status='active')
  - arrears_order: CFIELD('withhold','withholding_order_id', variant_name='Child Support Withholding — Arrears-Only Order', status='active')
  - arrears_support_deducted: XSUM('withhold','withholding_ledger','amount', within_months=K('income_window_months'), date_field='entry_date', event_type='withhold_deduction_taken', withholding_order_id=arrears_order)
  - support_excluded: current_support_weekly * K('weeks_per_year') if current_support_weekly != None else (arrears_support_deducted * K('annualizing_multiplier') if arrears_order != None else 0)
  - pension_weekly: ((XLATEST('claim','claim_certifications','other_pay_amount', date_field='week_ending_date', other_pay_type='pension_employer_funded') or 0) if XCOUNT('claim','claim_certifications', within_months=K('income_window_months'), date_field='week_ending_date', other_pay_type='pension_employer_funded') > 0 else 0) + ((XLATEST('claim','claim_certifications','other_pay_amount', date_field='week_ending_date', other_pay_type='pension_claimant_contributed') or 0) if XCOUNT('claim','claim_certifications', within_months=K('income_window_months'), date_field='week_ending_date', other_pay_type='pension_claimant_contributed') > 0 else 0)
  - vacation_holiday_pay: XSUM('claim','claim_certifications','other_pay_amount', within_months=K('income_window_months'), date_field='week_ending_date', other_pay_type='vacation_pay') + XSUM('claim','claim_certifications','other_pay_amount', within_months=K('income_window_months'), date_field='week_ending_date', other_pay_type='holiday_pay')
  - other_pay_added: pension_weekly * K('weeks_per_year') if pension_weekly > 0 else (vacation_holiday_pay if vacation_holiday_pay > 0 else 0)
  - federal_election: CFIELD('withhold','withholding_order_id', variant_name='Voluntary Federal Income Tax Withholding', status='active')
  - state_election: CFIELD('withhold','withholding_order_id', variant_name='Voluntary State Income Tax Withholding', status='active')
  - federal_tax_withheld: XSUM('withhold','withholding_ledger','amount', within_months=K('income_window_months'), date_field=benefit_dating, event_type='withhold_deduction_taken', withholding_order_id=federal_election)
  - state_tax_withheld: XSUM('withhold','withholding_ledger','amount', within_months=K('income_window_months'), date_field=benefit_dating, event_type='withhold_deduction_taken', withholding_order_id=state_election)
  - tax_excluded: federal_tax_withheld * K('annualizing_multiplier') if federal_election != None else (state_tax_withheld * K('annualizing_multiplier') if state_election != None else 0)
  - countable_income: MX(0, (benefits_counted + earnings_counted) * K('annualizing_multiplier') - earnings_counted * K('annualizing_multiplier') * earned_income_share - support_excluded - tax_excluded + other_pay_added)
  - requests_under_review: COUNT('overpay_waiver_requests', request_status='received')
  - result: RND(countable_income, 2) if household_size == 1 and requests_under_review > 0 and lodged_income == 0 else lodged_income
  compute_basis:
    household_size: For a household of one person, the income entered is the claimant's countable annual income worked out from the Department's own records
    lodged_income: An annual household income recorded as 0.00 on a request is the record of a request lodged without any income figure; a request on which the claimant wrote an income figure keeps the figure the claimant wrote
    supplemental_in_window: when a supplemental payment was issued in the income window
    cancelled_in_window: when no supplemental payment but a cancelled payment falls in the window, payments are counted by issue date less the payments cancelled in the window
    benefit_dating: when a supplemental payment was issued in the income window, every payment is counted by the week it pays for rather than by its issue date, so back pay for weeks ending before the window drops out
    benefits_counted: when a supplemental payment was issued in the income window, every payment is counted by the week it pays for rather than by its issue date, so back pay for weeks ending before the window drops out; when no supplemental payment but a cancelled payment falls in the window, payments are counted by issue date less the payments cancelled in the window; otherwise payments are counted by issue date.
    earnings_counted: plus the gross earnings the claimant reported for certified weeks, taking the entries of the income window of the three whole months before the handling date / a certified week is dated by the Saturday ending it.
    weeks_certified: by the average hours worked over the certified weeks ending in the income window
    average_hours: by the average hours worked over the certified weeks ending in the income window
    earned_income_share: an average of at least the full-deduction hours takes off the full earned-income share, a lower but positive average takes off the partial earned-income share, and no hours worked takes off nothing.
    current_support_weekly: an active current child-support withholding order excludes its weekly amount times the weeks in a year
    arrears_order: with no such order, an active arrears-only child-support order excludes the deductions taken under it in the income window times the annualizing multiplier
    arrears_support_deducted: with no such order, an active arrears-only child-support order excludes the deductions taken under it in the income window times the annualizing multiplier
    support_excluded: an active current child-support withholding order excludes its weekly amount times the weeks in a year; with no such order, an active arrears-only child-support order excludes the deductions taken under it in the income window times the annualizing multiplier; with neither order, nothing is excluded.
    pension_weekly: when a pension is reported, the latest weekly amount reported in the income window for each kind of pension, employer-funded and claimant-contributed, is added up and added times the weeks in a year
    vacation_holiday_pay: when no pension but vacation or holiday pay is reported, the vacation and holiday pay reported is added once, at the amounts reported
    other_pay_added: when a pension is reported, the latest weekly amount reported in the income window for each kind of pension, employer-funded and claimant-contributed, is added up and added times the weeks in a year; when no pension but vacation or holiday pay is reported, the vacation and holiday pay reported is added once, at the amounts reported; when none is reported, nothing is added.
    federal_election: when an active voluntary federal income tax withholding election is on record
    state_election: when only an active voluntary state income tax withholding election is on record
    federal_tax_withheld: Income tax withheld from the benefits counted is excluded, taking the deductions dated the same way as the benefits counted
    state_tax_withheld: Income tax withheld from the benefits counted is excluded, taking the deductions dated the same way as the benefits counted
    tax_excluded: when an active voluntary federal income tax withholding election is on record, the federal tax withheld in the income window is excluded times the annualizing multiplier; when only an active voluntary state income tax withholding election is on record, the state tax withheld in the window is excluded times the annualizing multiplier; when neither is on record, nothing is excluded.
    countable_income: The countable annual income is the counted benefits plus the counted earnings, times the annualizing multiplier, less the earned-income deduction, the support excluded and the tax excluded, plus the other pay added, never less than zero and rounded to the cent. / An earned-income deduction is taken from the annualized earnings for work expenses
    requests_under_review: a request no longer awaiting decision is not completed and keeps the income it carries.
    result: For a household of one person, the income entered is the claimant's countable annual income worked out from the Department's own records; for a household of more than one person the income stays as the claimant lodged it
  factors:
  - id: benefit_payment_dating
    effect: method
    decides: benefits_counted
    bindings:
    - supplemental_in_window
    - cancelled_in_window
    - benefit_dating
    - benefits_counted
    ladder:
    - when: a supplemental payment was issued in the income window
      method: count every benefit payment by the week it pays for, so back pay for weeks ending before the window drops out
    - when: no supplemental payment, but a cancelled payment falls in the income window
      method: count payments by issue date, less the payments cancelled in the window
    - when: otherwise
      method: count payments by issue date
    baseline:
      benefits_counted: XSUM('claim','claim_ledger','amount', within_months=K('income_window_months'), date_field='entry_date', event_type='claim_benefit_paid')
    evidence:
    - cross_category
    - history
    cross_difficulty: claim
  - id: earned_income_deduction
    effect: parameter
    decides: earned_income_share
    bindings:
    - weeks_certified
    - average_hours
    - earned_income_share
    ladder:
    - when: the certified weeks ending in the income window average at least the full-deduction hours worked
      value: K('earned_income_share_full')
    - when: they average fewer than the full-deduction hours but more than zero
      value: K('earned_income_share_partial')
    - when: otherwise (no hours worked)
      value: '0'
    baseline:
      earned_income_share: '0'
    evidence:
    - cross_category
    cross_difficulty: claim
  - id: support_order_exclusion
    effect: method
    decides: support_excluded
    bindings:
    - current_support_weekly
    - arrears_order
    - arrears_support_deducted
    - support_excluded
    ladder:
    - when: an active current child-support withholding order is on the withholding records
      method: exclude the current order's weekly amount times the weeks in a year
    - when: no current order, but an active arrears-only child-support order is on the records
      method: exclude the arrears-only deductions taken in the income window times the annualizing multiplier
    - when: otherwise (neither order)
      method: exclude nothing
    baseline:
      support_excluded: '0'
    evidence:
    - cross_category
    cross_difficulty: withhold
  - id: other_pay_addition
    effect: method
    decides: other_pay_added
    bindings:
    - pension_weekly
    - vacation_holiday_pay
    - other_pay_added
    ladder:
    - when: a pension is reported on a certified week ending in the income window
      method: add the latest weekly amount reported in the income window for each kind of pension, employer-funded and claimant-contributed, added up and times the weeks in a year
    - when: no pension, but vacation or holiday pay is reported in the window
      method: add the vacation and holiday pay reported, once, at the amounts reported
    - when: otherwise (no other pay reported)
      method: add nothing
    baseline:
      other_pay_added: '0'
    evidence:
    - cross_category
    cross_difficulty: claim
  - id: withheld_tax_exclusion
    effect: parameter
    decides: tax_excluded
    bindings:
    - federal_election
    - state_election
    - federal_tax_withheld
    - state_tax_withheld
    - tax_excluded
    ladder:
    - when: an active voluntary federal income tax withholding election is on record
      value: the federal tax withheld in the income window times the annualizing multiplier
    - when: only an active voluntary state income tax withholding election is on record
      value: the state tax withheld in the income window times the annualizing multiplier
    - when: otherwise (no election)
      value: '0'
    baseline:
      tax_excluded: '0'
    evidence:
    - cross_category
    cross_difficulty: withhold
  baseline:
    rule: A waiver request that reached review without the household's annual income stands incomplete, and the claimant completes it on the record by confirming the income worked out below for the request; a request no longer awaiting decision is not completed and keeps the income it carries. An annual household income recorded as 0.00 on a request is the record of a request lodged without any income figure; a request on which the claimant wrote an income figure keeps the figure the claimant wrote, and the income the claimant confirms on completion becomes the claimant's own statement of income on the application. The completion is made only on a request whose review is already open and does not itself open a review. For a household of one person, the income entered is the claimant's countable annual income worked out from the Department's own records; for a household of more than one person the income stays as the claimant lodged it, because the other members' income comes only from the claimant's written figures, and nothing is worked out on a call. The countable annual income is the unemployment benefits paid to the claimant, counted by the date each payment was issued, plus the gross earnings the claimant reported for certified weeks, taking the entries of the income window of the three whole months before the handling date, with the sum multiplied by the annualizing multiplier and rounded to the cent. An entry falls in the income window when the whole months from its date to the handling date are fewer than the window's months; a certified week is dated by the Saturday ending it.
    params:
    - income_window_months
    - annualizing_multiplier
  inputs:
    history:
    - table: overpay_waiver_requests
      aggregate: latest
      field: household_size
    - category: claim
      table: claim_ledger
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: claim_benefit_paid
    - category: claim
      table: claim_certifications
      aggregate: sum
      field: gross_earnings
      within_months: 3
      filters: {}
    - category: claim
      table: claim_certifications
      aggregate: sum
      field: hours_worked
      within_months: 3
      filters: {}
    - category: withhold
      table: withholding_ledger
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: withhold_deduction_taken
    cross_category:
    - claim
    - withhold
- id: overpay_ext_waiver_decision
  base_policy_refs:
  - overpay_waiver
  overwrite:
  - base_policy: overpay_waiver
    superseded_clause: 'The decision follows overpay_msr_household_income_pct_of_guideline: at or below the full-waiver percent the whole unpaid principal is waived; above it and at or below the partial-waiver percent the partial share of the unpaid principal is waived, rounded to the cent, and the rest stays in recovery; above the partial-waiver percent the waiver is denied.'
    replaced_by: 'The waiver decision follows the household income percent: at or below the full-waiver percent the whole waivable principal is waived; above it and at or below the partial-waiver percent the waiver share of the waivable principal is waived, rounded to the cent, and the rest stays in recovery; above the partial-waiver percent nothing is waived and the request is denied.'
  trigger: state_due
  subject:
  - overpay_waiver_adjusted
  - overpay_waiver_granted
  - overpay_waiver_partially_granted
  - overpay_waiver_denied
  computes: waived_amount
  target_tool: record_waiver_decision_07f617be
  params:
    long_period_weeks: 16
    mid_period_weeks: 8
    long_period_points: 0.15
    mid_period_points: 0.1
    employment_window_months: 1
    working_and_claiming_points: 0.1
    working_or_claiming_points: 0.05
    good_faith_full_points: 0.05
    good_faith_part_points: 0.025
    long_delay_months: 6
    short_delay_months: 2
    long_delay_points: 0.1
    short_delay_points: 0.05
    lower_band_multiplier: 1.2
    upper_band_multiplier: 0.8
  rule: 'A waiver request under review on a waiver-eligible overpayment is decided by recording the waiver decision and, when anything is waived, a waiver adjustment that removes the waived principal from the balance; claimant-error and fraud overpayments are never waived and their waived amount is zero. A waiver decision is not recorded until the waiver request under review carries a household annual income above zero. The household income percent is the annual household income on the request divided by the poverty guideline for the household size on the request, times one hundred, rounded to two decimals; the poverty guideline for a household is the one-person guideline plus the per-additional-person amount for each member beyond the first. The waiver decision follows the household income percent: at or below the full-waiver percent the whole waivable principal is waived; above it and at or below the partial-waiver percent the waiver share of the waivable principal is waived, rounded to the cent, and the rest stays in recovery; above the partial-waiver percent nothing is waived and the request is denied. A request is granted only when the amount waived is the whole unpaid principal; when an amount above zero but less than the whole unpaid principal is waived the request is partially granted and the rest of the principal stays in recovery; when nothing is waived the request is denied. The waiver share is the classification''s partial-waiver share, and the waivable principal is the principal standing unpaid on the decision date: the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds. Points are added to the waiver share for reliance over a long overpaid period, counted in weeks from the first to the last overpaid week inclusive: the long-period weeks or more add the long-period points, the mid-period weeks or more but fewer than the long-period weeks add the mid-period points, and a shorter period adds nothing. Points are added to the waiver share for a claimant still working part time while certifying, judged on the claim the overpayment arose from over the certified weeks ending in the employment window before the handling date: earnings reported on every one of those weeks together with the claim still active add the working-and-claiming points; either one of the two alone adds the working-or-claiming points; neither adds nothing. Points are added to the waiver share for a claimant who repaid in good faith, counting the repayments received on the overpayment less those returned unpaid: repayments of at least the plan''s monthly installment add the full good-faith points, smaller repayments add the part good-faith points, and no repayment adds nothing. Points are added to the waiver share for a slow determination, counted in whole months from the last overpaid week to the determination date: the long-delay months or more add the long-delay points, the short-delay months or more but fewer than the long-delay months add the short-delay points, and a shorter delay adds nothing. The waiver share with its points is scaled by where the household income percent falls within the partial band: a percent above the full-waiver percent and at or below the midpoint of the full-waiver and partial-waiver percents multiplies the share by the lower-band multiplier; a percent above that midpoint and at or below the partial-waiver percent multiplies it by the upper-band multiplier; any other percent leaves it unscaled. The scaled waiver share never exceeds one. Overpaid weeks are recorded by the Saturdays ending them, so the overpaid period begins on the Sunday six days before the first overpaid week''s ending date and ends on the last overpaid week''s ending date. For an overpayment caused by an employer''s wage report error or by a monetary redetermination, the waivable principal stops at the claimant''s notice of the claim''s monetary redetermination, dated by the claim''s latest monetary determination when it is a redetermination: when that notice is dated within the overpaid period, only the share of the unpaid principal belonging to the overpaid weeks ending on or before the notice is waivable, each overpaid week carrying an equal share; when the notice is dated before the overpaid period began, nothing is waivable; in every other case the whole unpaid principal is waivable.'
  prerequisite:
  - problem: overpay_ext_waiver_household_income
    kind: value_input
    gate: household_income
    form: state
    policy_source: A waiver decision is not recorded until the waiver request under review carries a household annual income above zero.
    condition: The overpay_waiver_requests row of the request under review has annual_household_income above zero.
    resolved_by: complete_waiver_household_income_abba3816
    effect: Completing the request writes the annual household income onto it, which sets the household income percent (binding household_income) that selects the full, partial or denied outcome and the band multiplier.
  cross_category:
  - category: claim
    as: history
    reads:
    - status
    - determination_number
    - monetary_determination_date
    - claim_certifications.gross_earnings
    - claim_certifications.week_ending_date
    note: The working-and-claiming points come from the claim's recent certifications and status; the notice cut-off of the waivable principal comes from the claim's latest monetary determination.
  compute:
  - household_size: LATEST('overpay_waiver_requests','household_size', date_field='request_date')
  - household_income: LATEST('overpay_waiver_requests','annual_household_income', date_field='request_date')
  - guideline: P('poverty_guideline_annual_base') + P('poverty_guideline_per_additional_person') * (household_size - 1)
  - income_pct: RND(household_income / guideline * 100, 2)
  - principal_unpaid: SUM('overpay_ledger','amount', event_type='overpay_principal_assessed') - SUM('overpay_ledger','amount', event_type='overpay_repayment_received', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_offset_recovered', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_intercept_recovered', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_waiver_adjusted') - SUM('overpay_ledger','amount', event_type='overpay_cancellation_adjusted', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_writeoff_adjusted', component='principal') + SUM('overpay_ledger','amount', event_type='overpay_repayment_returned', component='principal') + SUM('overpay_ledger','amount', event_type='overpay_refund_issued', component='principal')
  - period_weeks: int(DAYS(F('overpaid_week_start'), F('overpaid_week_end')) / 7) + 1
  - period_points: K('long_period_points') if period_weeks >= K('long_period_weeks') else (K('mid_period_points') if period_weeks >= K('mid_period_weeks') else 0)
  - recent_weeks_certified: XCOUNT('claim','claim_certifications', within_months=K('employment_window_months'), date_field='week_ending_date', claim_id=F('claim_id'))
  - recent_weeks_without_earnings: XCOUNT('claim','claim_certifications', within_months=K('employment_window_months'), date_field='week_ending_date', claim_id=F('claim_id'), gross_earnings=0.0)
  - working_while_certifying: recent_weeks_certified > 0 and recent_weeks_without_earnings == 0
  - claim_active: CFIELD('claim','status', claim_id=F('claim_id')) == 'active'
  - employment_points: K('working_and_claiming_points') if working_while_certifying and claim_active else (K('working_or_claiming_points') if working_while_certifying or claim_active else 0)
  - repaid_net: SUM('overpay_ledger','amount', event_type='overpay_repayment_received') - SUM('overpay_ledger','amount', event_type='overpay_repayment_returned')
  - good_faith_points: K('good_faith_full_points') if repaid_net > 0 and repaid_net >= F('repayment_plan_monthly_amount') else (K('good_faith_part_points') if repaid_net > 0 else 0)
  - establishment_delay_months: MONTHS(F('overpaid_week_end'), F('determination_date'))
  - delay_points: K('long_delay_points') if establishment_delay_months >= K('long_delay_months') else (K('short_delay_points') if establishment_delay_months >= K('short_delay_months') else 0)
  - share_with_points: P('waiver_partial_share') + period_points + employment_points + good_faith_points + delay_points
  - band_midpoint: (P('waiver_full_income_pct_of_guideline') + P('waiver_partial_income_pct_of_guideline')) / 2
  - band_position_pct: RND(LATEST('overpay_waiver_requests','annual_household_income', date_field='request_date') / guideline * 100, 2)
  - band_multiplier: K('lower_band_multiplier') if band_position_pct > P('waiver_full_income_pct_of_guideline') and band_position_pct <= band_midpoint else (K('upper_band_multiplier') if band_position_pct > band_midpoint and band_position_pct <= P('waiver_partial_income_pct_of_guideline') else 1)
  - waiver_share: MN(1, share_with_points * band_multiplier)
  - notice_date: CFIELD('claim','monetary_determination_date', claim_id=F('claim_id')) if (F('cause') == 'employer_wage_report_error' or F('cause') == 'monetary_redetermination') and CFIELD('claim','determination_number', claim_id=F('claim_id')) >= 2 else None
  - waivable_principal: principal_unpaid * (0 if DAYS(F('overpaid_week_start'), notice_date) < 0 else int(DAYS(F('overpaid_week_start'), notice_date) / 7) + 1) / period_weeks if notice_date != None and DAYS(F('overpaid_week_start'), notice_date) >= -6 and DAYS(notice_date, F('overpaid_week_end')) > 0 else (0 if notice_date != None and DAYS(F('overpaid_week_start'), notice_date) < -6 else principal_unpaid)
  - result: 0 if not P('waiver_eligible') else (RND(waivable_principal, 2) if income_pct <= P('waiver_full_income_pct_of_guideline') else (RND(waiver_share * waivable_principal, 2) if income_pct <= P('waiver_partial_income_pct_of_guideline') else 0))
  compute_basis:
    household_size: The household income percent is the annual household income on the request divided by the poverty guideline for the household size on the request
    household_income: The household income percent is the annual household income on the request divided by the poverty guideline for the household size on the request
    guideline: the poverty guideline for a household is the one-person guideline plus the per-additional-person amount for each member beyond the first.
    income_pct: times one hundred, rounded to two decimals
    principal_unpaid: 'the waivable principal is the principal standing unpaid on the decision date: the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds.'
    period_weeks: counted in weeks from the first to the last overpaid week inclusive
    period_points: the long-period weeks or more add the long-period points, the mid-period weeks or more but fewer than the long-period weeks add the mid-period points, and a shorter period adds nothing.
    recent_weeks_certified: judged on the claim the overpayment arose from over the certified weeks ending in the employment window before the handling date
    recent_weeks_without_earnings: earnings reported on every one of those weeks
    working_while_certifying: earnings reported on every one of those weeks
    claim_active: together with the claim still active
    employment_points: earnings reported on every one of those weeks together with the claim still active add the working-and-claiming points; either one of the two alone adds the working-or-claiming points; neither adds nothing.
    repaid_net: counting the repayments received on the overpayment less those returned unpaid
    good_faith_points: repayments of at least the plan's monthly installment add the full good-faith points, smaller repayments add the part good-faith points, and no repayment adds nothing.
    establishment_delay_months: counted in whole months from the last overpaid week to the determination date
    delay_points: the long-delay months or more add the long-delay points, the short-delay months or more but fewer than the long-delay months add the short-delay points, and a shorter delay adds nothing.
    share_with_points: The waiver share is the classification's partial-waiver share / Points are added to the waiver share
    band_midpoint: at or below the midpoint of the full-waiver and partial-waiver percents
    band_position_pct: The waiver share with its points is scaled by where the household income percent falls within the partial band
    band_multiplier: a percent above the full-waiver percent and at or below the midpoint of the full-waiver and partial-waiver percents multiplies the share by the lower-band multiplier; a percent above that midpoint and at or below the partial-waiver percent multiplies it by the upper-band multiplier; any other percent leaves it unscaled.
    waiver_share: The scaled waiver share never exceeds one.
    notice_date: For an overpayment caused by an employer's wage report error or by a monetary redetermination, the waivable principal stops at the claimant's notice of the claim's monetary redetermination, dated by the claim's latest monetary determination when it is a redetermination
    waivable_principal: Overpaid weeks are recorded by the Saturdays ending them, so the overpaid period begins on the Sunday six days before the first overpaid week's ending date and ends on the last overpaid week's ending date. / when that notice is dated within the overpaid period, only the share of the unpaid principal belonging to the overpaid weeks ending on or before the notice is waivable, each overpaid week carrying an equal share; when the notice is dated before the overpaid period began, nothing is waivable; in every other case the whole unpaid principal is waivable.
    result: at or below the full-waiver percent the whole waivable principal is waived; above it and at or below the partial-waiver percent the waiver share of the waivable principal is waived, rounded to the cent, and the rest stays in recovery; above the partial-waiver percent nothing is waived and the request is denied. / claimant-error and fraud overpayments are never waived and their waived amount is zero.
  factors:
  - id: overpaid_period_reliance
    effect: parameter
    decides: period_points
    bindings:
    - period_weeks
    - period_points
    ladder:
    - when: the overpaid period spans the long-period weeks or more
      value: K('long_period_points')
    - when: it spans the mid-period weeks or more but fewer than the long-period weeks
      value: K('mid_period_points')
    - when: otherwise (a shorter period)
      value: '0'
    baseline:
      period_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: part_time_work_while_certifying
    effect: parameter
    decides: employment_points
    bindings:
    - recent_weeks_certified
    - recent_weeks_without_earnings
    - working_while_certifying
    - claim_active
    - employment_points
    ladder:
    - when: earnings were reported on every certified week ending in the employment window AND the claim is still active
      value: K('working_and_claiming_points')
    - when: earnings on every recent certified week OR the claim still active, but not both
      value: K('working_or_claiming_points')
    - when: otherwise (neither)
      value: '0'
    baseline:
      employment_points: '0'
    evidence:
    - cross_category
    cross_difficulty: claim
  - id: good_faith_repayment
    effect: parameter
    decides: good_faith_points
    bindings:
    - repaid_net
    - good_faith_points
    ladder:
    - when: repayments received less those returned reach at least the plan's monthly installment
      value: K('good_faith_full_points')
    - when: they are positive but below the plan's monthly installment
      value: K('good_faith_part_points')
    - when: otherwise (no repayment)
      value: '0'
    baseline:
      good_faith_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: slow_determination
    effect: parameter
    decides: delay_points
    bindings:
    - establishment_delay_months
    - delay_points
    ladder:
    - when: the long-delay months or more passed from the last overpaid week to the determination date
      value: K('long_delay_points')
    - when: the short-delay months or more but fewer than the long-delay months passed
      value: K('short_delay_points')
    - when: otherwise (a shorter delay)
      value: '0'
    baseline:
      delay_points: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: partial_band_position
    effect: parameter
    decides: band_multiplier
    bindings:
    - band_midpoint
    - band_position_pct
    - band_multiplier
    ladder:
    - when: the household income percent is above the full-waiver percent and at or below the band midpoint
      value: K('lower_band_multiplier')
    - when: the household income percent is above the band midpoint and at or below the partial-waiver percent
      value: K('upper_band_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      band_multiplier: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: redetermination_notice_cutoff
    effect: method
    decides: waivable_principal
    bindings:
    - notice_date
    - waivable_principal
    ladder:
    - when: a wage-report or redetermination overpayment whose claim's redetermination notice is dated within the overpaid period
      method: waive only the equal weekly shares of the unpaid principal for overpaid weeks ending on or before the notice
    - when: such an overpayment whose redetermination notice is dated before the Sunday that begins the overpaid period
      method: treat nothing as waivable
    - when: otherwise
      method: treat the whole unpaid principal as waivable
    baseline:
      waivable_principal: principal_unpaid
    evidence:
    - cross_category
    - date
    cross_difficulty: claim
  baseline:
    rule: 'The household income percent is the annual household income on the request divided by the poverty guideline for the household size on the request, times one hundred, rounded to two decimals; the poverty guideline for a household is the one-person guideline plus the per-additional-person amount for each member beyond the first. The waiver decision follows the household income percent: at or below the full-waiver percent the whole waivable principal is waived; above it and at or below the partial-waiver percent the waiver share of the waivable principal is waived, rounded to the cent, and the rest stays in recovery; above the partial-waiver percent nothing is waived and the request is denied. A request is granted only when the amount waived is the whole unpaid principal; when an amount above zero but less than the whole unpaid principal is waived the request is partially granted and the rest of the principal stays in recovery; when nothing is waived the request is denied. The waiver share is the classification''s partial-waiver share, and the waivable principal is the principal standing unpaid on the decision date: the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds.'
    params:
    - poverty_guideline_annual_base
    - poverty_guideline_per_additional_person
    - waiver_full_income_pct_of_guideline
    - waiver_partial_income_pct_of_guideline
    - waiver_partial_share
  inputs:
    history:
    - table: overpay_waiver_requests
      aggregate: latest
      field: annual_household_income
    - table: overpay_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: overpay_principal_assessed
    - table: overpay_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: overpay_repayment_received
    - category: claim
      table: claim_certifications
      aggregate: count
      field: certification_id
      within_months: 1
      filters: {}
    cross_category:
    - claim
- id: overpay_ext_plan_change
  base_policy_refs:
  - overpay_repayment_plan
  overwrite:
  - base_policy: overpay_repayment_plan
    superseded_clause: The monthly installment is at least the classification's minimum monthly payment and at least the balance divided by the classification's maximum plan months, rounded up to the cent; the claimant may choose a larger installment.
    replaced_by: The changed monthly installment is the overpayment's balance divided by the classification's maximum plan months, rounded up to the cent and never less than the classification's minimum monthly payment.
  trigger: on_request
  subject:
  - overpay_repayment_plan_set
  computes: monthly_amount
  target_tool: change_repayment_plan_f1933d01
  params:
    small_remainder_cap: 1000.0
    mid_remainder_cap: 3000.0
    small_remainder_share: 0.2
    mid_remainder_share: 0.4
    full_band_extension: 12
    partial_band_extension: 6
    long_review_months: 2
    long_review_extension: 2
    short_review_extension: 1
    determination_months_cap: 6
    major_waiver_share: 0.5
    major_waiver_extension: 3
    minor_waiver_extension: 1
  rule: 'A claimant whose overpayment carries a current repayment plan may have its monthly installment changed; the changed plan carries exactly the changed monthly installment worked out below, keeping its first installment due date and the classification''s due day. A plan''s monthly installment is changed only after every waiver request lodged on the overpayment carries a decision. The changed monthly installment is the overpayment''s balance divided by the classification''s maximum plan months, rounded up to the cent and never less than the classification''s minimum monthly payment. The balance is the overpayment''s balance due at the time of the change. The changed-plan months follow the principal still unpaid: a remaining principal up to the small-remainder cap is spread over the small-remainder share of the classification''s maximum plan months, a remaining principal above the small-remainder cap up to the mid-remainder cap over the mid-remainder share of them, and a larger remaining principal over the classification''s maximum plan months in full, each share counted in whole months with any fraction of a month dropped. The remaining principal is the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds. A claimant shown by the latest waiver request to be in hardship earns band months, using the household income percent of that request, which is its annual household income divided by the poverty guideline for its household size times one hundred and rounded to two decimals: a percent at or below the classification''s full-waiver percent adds the full-band extension, a percent above it and at or below the partial-waiver percent adds the partial-band extension, and a higher percent adds nothing. Months spent under waiver review, when billing stopped, are given back, counted in whole months from the latest waiver request date to the handling date: the long-review months or more add the long-review extension, one month or more but fewer than the long-review months add the short-review extension, and less than a month adds nothing. The changed plan keeps to the schedule already running, and the months taken off for it are found according to where the plan stands: when the plan''s first installment due date has passed and no waiver request was lodged on the overpayment after that date, the installments already fallen due are taken off, counted as the whole months from the first installment due date to the handling date plus one for the first installment; when the plan''s first installment due date has passed and a waiver request was lodged on the overpayment after that date, billing stopped for the review, so only the installments fallen due before the review are taken off, counted as the whole months from the first installment due date to the latest waiver request date plus one for the first installment; when the plan''s first installment due date has not yet passed, the plan is held to the determination''s clock instead, and the whole months from the determination date to the handling date are taken off, never more than the determination-months cap. A substantial waiver earns waiver months, measured by the principal waived on the overpayment as a share of the principal assessed: a share of at least the major-waiver share adds the major-waiver extension, a smaller positive share adds the minor-waiver extension, and no principal waived adds nothing. The changed-plan months are the remaining-principal months plus the band, review and waiver extensions, less the months taken off for the schedule already running, and never fewer than one; the changed monthly installment is the balance divided by those months, rounded up to the cent and never less than the classification''s minimum monthly payment.'
  prerequisite:
  - problem: overpay_ext_waiver_decision
    kind: value_input
    gate: balance
    form: state
    policy_source: A plan's monthly installment is changed only after every waiver request lodged on the overpayment carries a decision.
    condition: No overpay_waiver_requests row of the overpayment has request_status received.
    resolved_by: record_waiver_decision_07f617be
    effect: Recording the decision books the waiver adjustment, which lowers the balance spread over the changed-plan months (binding balance) and the remaining principal, raises the share of principal waived, and returns the overpayment to in_recovery so its plan can be changed.
  cross_category: []
  compute:
  - balance: F('balance_due')
  - remaining_principal: SUM('overpay_ledger','amount', event_type='overpay_principal_assessed') - SUM('overpay_ledger','amount', event_type='overpay_repayment_received', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_offset_recovered', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_intercept_recovered', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_waiver_adjusted') - SUM('overpay_ledger','amount', event_type='overpay_cancellation_adjusted', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_writeoff_adjusted', component='principal') + SUM('overpay_ledger','amount', event_type='overpay_repayment_returned', component='principal') + SUM('overpay_ledger','amount', event_type='overpay_refund_issued', component='principal')
  - remainder_months: int(P('max_plan_months') * K('small_remainder_share')) if remaining_principal <= K('small_remainder_cap') else (int(P('max_plan_months') * K('mid_remainder_share')) if remaining_principal <= K('mid_remainder_cap') else P('max_plan_months'))
  - request_income: LATEST('overpay_waiver_requests','annual_household_income', date_field='request_date')
  - request_household: LATEST('overpay_waiver_requests','household_size', date_field='request_date')
  - hardship_pct: RND(request_income / (P('poverty_guideline_annual_base') + P('poverty_guideline_per_additional_person') * (request_household - 1)) * 100, 2) if request_household != None else 100000
  - band_extension: K('full_band_extension') if hardship_pct <= P('waiver_full_income_pct_of_guideline') else (K('partial_band_extension') if hardship_pct <= P('waiver_partial_income_pct_of_guideline') else 0)
  - review_months: MONTHS(LATEST('overpay_waiver_requests','request_date', date_field='request_date'), NOW) if request_household != None else 0
  - review_extension: K('long_review_extension') if review_months >= K('long_review_months') else (K('short_review_extension') if review_months >= 1 else 0)
  - plan_first_due: F('repayment_plan_start_date')
  - review_opened_on: LATEST('overpay_waiver_requests','request_date', date_field='request_date')
  - months_since_determination: MONTHS(F('determination_date'), NOW)
  - determination_months_off: (MONTHS(plan_first_due, review_opened_on) + 1 if review_opened_on != None and DAYS(plan_first_due, review_opened_on) > 0 else MONTHS(plan_first_due, NOW) + 1) if DAYS(plan_first_due, NOW) > 0 else MN(K('determination_months_cap'), months_since_determination)
  - waived_share: SUM('overpay_ledger','amount', event_type='overpay_waiver_adjusted') / SUM('overpay_ledger','amount', event_type='overpay_principal_assessed')
  - waiver_extension: K('major_waiver_extension') if waived_share >= K('major_waiver_share') else (K('minor_waiver_extension') if waived_share > 0 else 0)
  - changed_months: MX(1, remainder_months + band_extension + review_extension + waiver_extension - determination_months_off)
  - monthly_cents: RND(balance / changed_months * 100, 6)
  - result: MX(P('min_monthly_payment'), (int(monthly_cents) + (1 if monthly_cents > int(monthly_cents) else 0)) / 100)
  compute_basis:
    balance: The balance is the overpayment's balance due at the time of the change.
    remaining_principal: The remaining principal is the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds.
    remainder_months: a remaining principal up to the small-remainder cap is spread over the small-remainder share of the classification's maximum plan months, a remaining principal above the small-remainder cap up to the mid-remainder cap over the mid-remainder share of them, and a larger remaining principal over the classification's maximum plan months in full, each share counted in whole months with any fraction of a month dropped.
    request_income: using the household income percent of that request, which is its annual household income divided by the poverty guideline for its household size times one hundred and rounded to two decimals
    request_household: using the household income percent of that request, which is its annual household income divided by the poverty guideline for its household size times one hundred and rounded to two decimals
    hardship_pct: using the household income percent of that request, which is its annual household income divided by the poverty guideline for its household size times one hundred and rounded to two decimals
    band_extension: a percent at or below the classification's full-waiver percent adds the full-band extension, a percent above it and at or below the partial-waiver percent adds the partial-band extension, and a higher percent adds nothing.
    review_months: counted in whole months from the latest waiver request date to the handling date
    review_extension: the long-review months or more add the long-review extension, one month or more but fewer than the long-review months add the short-review extension, and less than a month adds nothing.
    plan_first_due: when the plan's first installment due date has passed
    review_opened_on: counted as the whole months from the first installment due date to the latest waiver request date plus one for the first installment
    months_since_determination: the whole months from the determination date to the handling date are taken off, never more than the determination-months cap
    determination_months_off: 'The changed plan keeps to the schedule already running, and the months taken off for it are found according to where the plan stands: when the plan''s first installment due date has passed and no waiver request was lodged on the overpayment after that date, the installments already fallen due are taken off, counted as the whole months from the first installment due date to the handling date plus one for the first installment; when the plan''s first installment due date has passed and a waiver request was lodged on the overpayment after that date, billing stopped for the review, so only the installments fallen due before the review are taken off, counted as the whole months from the first installment due date to the latest waiver request date plus one for the first installment; when the plan''s first installment due date has not yet passed, the plan is held to the determination''s clock instead, and the whole months from the determination date to the handling date are taken off, never more than the determination-months cap.'
    waived_share: measured by the principal waived on the overpayment as a share of the principal assessed
    waiver_extension: a share of at least the major-waiver share adds the major-waiver extension, a smaller positive share adds the minor-waiver extension, and no principal waived adds nothing.
    changed_months: The changed-plan months are the remaining-principal months plus the band, review and waiver extensions, less the months taken off for the schedule already running, and never fewer than one
    monthly_cents: the changed monthly installment is the balance divided by those months, rounded up to the cent
    result: the changed monthly installment is the balance divided by those months, rounded up to the cent and never less than the classification's minimum monthly payment.
  factors:
  - id: remaining_principal_months
    effect: parameter
    decides: remainder_months
    bindings:
    - remaining_principal
    - remainder_months
    ladder:
    - when: the remaining principal is up to the small-remainder cap (the small-remainder share of the classification's maximum plan months, in whole months)
      value: int(P('max_plan_months') * K('small_remainder_share'))
    - when: the remaining principal is above the small-remainder cap and up to the mid-remainder cap (the mid-remainder share of the maximum, in whole months)
      value: int(P('max_plan_months') * K('mid_remainder_share'))
    - when: otherwise (a larger remaining principal)
      value: P('max_plan_months')
    baseline:
      remainder_months: P('max_plan_months')
    evidence:
    - history
    cross_difficulty: null
  - id: hardship_band_months
    effect: parameter
    decides: band_extension
    bindings:
    - request_income
    - request_household
    - hardship_pct
    - band_extension
    ladder:
    - when: the latest waiver request's household income percent is at or below the classification's full-waiver percent
      value: K('full_band_extension')
    - when: it is above the full-waiver percent and at or below the partial-waiver percent
      value: K('partial_band_extension')
    - when: otherwise (a higher percent, or no request)
      value: '0'
    baseline:
      band_extension: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: review_months_given_back
    effect: parameter
    decides: review_extension
    bindings:
    - review_months
    - review_extension
    ladder:
    - when: the long-review months or more passed from the latest waiver request date to the handling date
      value: K('long_review_extension')
    - when: at least one month but fewer than the long-review months passed
      value: K('short_review_extension')
    - when: otherwise (less than a month, or no request)
      value: '0'
    baseline:
      review_extension: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: running_schedule_anchor
    effect: method
    decides: determination_months_off
    bindings:
    - plan_first_due
    - review_opened_on
    - months_since_determination
    - determination_months_off
    ladder:
    - when: the plan's first installment due date has passed and no waiver request was lodged on the overpayment after that date
      method: 'anchor at the first installment due date and run to the handling date: take off the installments fallen due, the whole months from the first due date to the handling date plus one'
    - when: the plan's first installment due date has passed and a waiver request was lodged on the overpayment after that date
      method: 'anchor at the first installment due date and stop at the latest waiver request date, when billing stopped for the review: take off the whole months from the first due date to that request date plus one'
    - when: otherwise (the plan's first installment due date has not yet passed)
      method: 'hold the plan to the determination''s clock: take off the whole months from the determination date to the handling date, capped at the determination-months cap'
    baseline:
      determination_months_off: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: waiver_size_months
    effect: parameter
    decides: waiver_extension
    bindings:
    - waived_share
    - waiver_extension
    ladder:
    - when: the principal waived is at least the major-waiver share of the principal assessed
      value: K('major_waiver_extension')
    - when: a smaller positive share was waived
      value: K('minor_waiver_extension')
    - when: otherwise (nothing waived)
      value: '0'
    baseline:
      waiver_extension: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The changed monthly installment is the overpayment's balance divided by the classification's maximum plan months, rounded up to the cent and never less than the classification's minimum monthly payment. The balance is the overpayment's balance due at the time of the change.
    params:
    - max_plan_months
    - min_monthly_payment
  inputs:
    history:
    - table: overpay_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: overpay_waiver_adjusted
    - table: overpay_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: overpay_principal_assessed
    - table: overpay_waiver_requests
      aggregate: latest
      field: annual_household_income
    cross_category: []
