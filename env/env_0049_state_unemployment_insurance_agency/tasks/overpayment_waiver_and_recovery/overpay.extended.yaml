- id: overpay_ext_plan_arrears
  base_policy_refs:
  - overpay_agg_recovery_priority
  - overpay_evt_recovery
  - overpay_repayment_plan
  overwrite: []
  trigger: on_request
  subject:
  - overpay_repayment_received
  computes: amount
  target_tool: pay_overpayment_arrears_d9b1e543
  params:
    default_age_short_days: 30
    default_age_long_days: 60
    early_breakdown_months: 6
    mid_breakdown_months: 12
    support_weekly_threshold: 75.0
    share_two_obligations: 0.5
    share_one_obligation: 0.75
  rule: 'A claimant whose repayment plan has defaulted may bring the plan back to standing by paying its arrears; the arrears payment is the claimant''s own repayment, designated to that overpayment, made by card through the Department''s payment line and applied to the overpayment''s penalty component. An arrears payment is taken only when the overpayment''s principal has been fully recovered, and it never exceeds the penalty standing unpaid; on an overpayment whose principal still stands unpaid the arrears payment is zero, because the missed installments there are collected through the plan''s own installments. The principal standing unpaid is the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds. The penalty standing unpaid is the penalty assessed less the penalty recovered by repayments, benefit offsets and tax refund intercepts, plus the penalty put back by returned repayments. The arrears payment on a defaulted plan is fixed only after the overpayment''s ledger carries a returned-payment fee for every repayment returned unpaid on it. The arrears payment is the installments counted times the price of each installment, less the installment credit, never less than zero, rounded to the cent. The installments counted are the first installment plus one for each whole month elapsed from the plan''s first installment due date to the handling date, and each is priced at the plan''s monthly installment. The installment credit is the repayments received on the overpayment less the repayments returned unpaid, taking the entries booked within the whole months elapsed from the first installment due date to the handling date plus the month in progress, where an entry is taken when the whole months from its booking date to the handling date are fewer than that number. How far the installments counted reach depends on how long ago the plan broke down, dated by its most recent returned installment: when that return was booked more than the long default-age days before the handling date, only the installments fallen due up to the return are counted, that is the first installment plus one for each whole month from the first installment due date to the return''s booking date; when it was booked more than the short default-age days and no more than the long default-age days before the handling date, those installments plus one more are counted; when it was booked the short default-age days or fewer before the handling date, or no installment has been returned, every installment fallen due to the handling date is counted. The price of each installment counted depends on how early the plan broke down: when fewer than the early-breakdown months passed from the first installment due date to the most recent returned installment, each is priced at the classification''s minimum monthly payment; when at least the early-breakdown months but fewer than the mid-breakdown months passed, each is priced at the midpoint of the plan''s monthly installment and the classification''s minimum monthly payment; when the mid-breakdown months or more passed, or no installment has been returned, each is priced at the plan''s monthly installment. The installment part of the arrears is reduced for a claimant who carries other support or benefit-repayment obligations on the Department''s withholding records: a claimant with an active current child-support withholding order whose weekly amount is at least the support threshold and also an active SNAP overissuance recovery order pays the two-obligation share of the installment part; a claimant with only one of those two pays the one-obligation share; any other claimant pays the installment part in full. Returned-payment fees join the arrears when plan installments came back unpaid: when two or more repayments were returned among the entries taken for the installment credit, every returned-payment fee standing unpaid on the overpayment joins the arrears; when exactly one was, the most recent returned-payment fee joins; when none was, no fee joins. Returned-payment fees stand unpaid to the extent the fees booked on the overpayment exceed the repayments applied to its fee component. The arrears payment is the installment part, after any reduction, plus the fees that join, limited to the penalty standing unpaid and rounded to the cent.'
  prerequisite:
  - problem: overpay_ext_returned_payment_fee
    kind: value_input
    gate: fees_in_arrears
    form: state
    policy_source: The arrears payment on a defaulted plan is fixed only after the overpayment's ledger carries a returned-payment fee for every repayment returned unpaid on it.
    condition: Every overpay_repayment_returned entry on the overpayment has an overpay_fee_assessed entry carrying the same payment_reference.
    resolved_by: book_returned_payment_fee_10cb479c
    effect: Once the fee for the latest returned installment is booked, the returned-payment fees standing unpaid rise by that fee, and with two or more returned plan installments the fees joining the arrears (fees_in_arrears) rise by the same amount.
  cross_category:
  - category: withhold
    as: branch
    reads:
    - status
    - variant_name
    - weekly_amount
    note: The support-obligation share is decided from the claimant's active current child-support withholding order and active SNAP overissuance recovery order on the withholding records.
  compute:
  - first_due: F('repayment_plan_start_date')
  - plan_installment: F('repayment_plan_monthly_amount')
  - months_on_plan: MONTHS(first_due, NOW)
  - last_returned_on: LATEST('overpay_ledger','entry_date', date_field='entry_date', event_type='overpay_repayment_returned')
  - default_age_days: DAYS(last_returned_on, NOW) if last_returned_on != None else 0
  - months_to_breakdown: MONTHS(first_due, last_returned_on) if last_returned_on != None else months_on_plan
  - installments_counted: 1 + months_to_breakdown if default_age_days > K('default_age_long_days') else (2 + months_to_breakdown if default_age_days > K('default_age_short_days') else 1 + months_on_plan)
  - installment_price: plan_installment if last_returned_on == None else (P('min_monthly_payment') if months_to_breakdown < K('early_breakdown_months') else ((plan_installment + P('min_monthly_payment')) / 2 if months_to_breakdown < K('mid_breakdown_months') else plan_installment))
  - installment_credit: SUM('overpay_ledger','amount', within_months=months_on_plan + 1, date_field='entry_date', event_type='overpay_repayment_received') - SUM('overpay_ledger','amount', within_months=months_on_plan + 1, date_field='entry_date', event_type='overpay_repayment_returned')
  - support_weekly: CFIELD('withhold','weekly_amount', variant_name='Child Support Withholding — Current Support Order', status='active')
  - snap_order_active: EXISTS('withhold', variant_name='SNAP Overissuance Recovery — Household or Agency Error', status='active') or EXISTS('withhold', variant_name='SNAP Overissuance Recovery — Intentional Program Violation', status='active')
  - obligation_share: K('share_two_obligations') if support_weekly != None and support_weekly >= K('support_weekly_threshold') and snap_order_active else (K('share_one_obligation') if (support_weekly != None and support_weekly >= K('support_weekly_threshold')) or snap_order_active else 1)
  - returned_installments: COUNT('overpay_ledger', within_months=months_on_plan + 1, date_field='entry_date', event_type='overpay_repayment_returned')
  - fees_unpaid: SUM('overpay_ledger','amount', event_type='overpay_fee_assessed') - SUM('overpay_ledger','amount', event_type='overpay_repayment_received', component='fee')
  - latest_fee: LATEST('overpay_ledger','amount', date_field='entry_date', event_type='overpay_fee_assessed')
  - fees_in_arrears: fees_unpaid if returned_installments >= 2 else (latest_fee if returned_installments == 1 else 0)
  - principal_unpaid: SUM('overpay_ledger','amount', event_type='overpay_principal_assessed') - SUM('overpay_ledger','amount', event_type='overpay_repayment_received', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_offset_recovered', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_intercept_recovered', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_waiver_adjusted') - SUM('overpay_ledger','amount', event_type='overpay_cancellation_adjusted', component='principal') - SUM('overpay_ledger','amount', event_type='overpay_writeoff_adjusted', component='principal') + SUM('overpay_ledger','amount', event_type='overpay_repayment_returned', component='principal') + SUM('overpay_ledger','amount', event_type='overpay_refund_issued', component='principal')
  - penalty_unpaid: SUM('overpay_ledger','amount', event_type='overpay_penalty_assessed') - SUM('overpay_ledger','amount', event_type='overpay_repayment_received', component='penalty') - SUM('overpay_ledger','amount', event_type='overpay_offset_recovered', component='penalty') - SUM('overpay_ledger','amount', event_type='overpay_intercept_recovered', component='penalty') + SUM('overpay_ledger','amount', event_type='overpay_repayment_returned', component='penalty')
  - arrears_due: MX(0, installments_counted * installment_price - installment_credit) * obligation_share + fees_in_arrears
  - result: 0 if principal_unpaid > 0 else RND(MN(arrears_due, penalty_unpaid), 2)
  compute_basis:
    first_due: The installments counted are the first installment plus one for each whole month elapsed from the plan's first installment due date to the handling date
    plan_installment: each is priced at the plan's monthly installment.
    months_on_plan: The installments counted are the first installment plus one for each whole month elapsed from the plan's first installment due date to the handling date
    last_returned_on: How far the installments counted reach depends on how long ago the plan broke down, dated by its most recent returned installment
    default_age_days: when that return was booked more than the long default-age days before the handling date
    months_to_breakdown: that is the first installment plus one for each whole month from the first installment due date to the return's booking date
    installments_counted: when that return was booked more than the long default-age days before the handling date, only the installments fallen due up to the return are counted, that is the first installment plus one for each whole month from the first installment due date to the return's booking date; when it was booked more than the short default-age days and no more than the long default-age days before the handling date, those installments plus one more are counted; when it was booked the short default-age days or fewer before the handling date, or no installment has been returned, every installment fallen due to the handling date is counted.
    installment_price: when fewer than the early-breakdown months passed from the first installment due date to the most recent returned installment, each is priced at the classification's minimum monthly payment; when at least the early-breakdown months but fewer than the mid-breakdown months passed, each is priced at the midpoint of the plan's monthly installment and the classification's minimum monthly payment; when the mid-breakdown months or more passed, or no installment has been returned, each is priced at the plan's monthly installment.
    installment_credit: The installment credit is the repayments received on the overpayment less the repayments returned unpaid, taking the entries booked within the whole months elapsed from the first installment due date to the handling date plus the month in progress, where an entry is taken when the whole months from its booking date to the handling date are fewer than that number.
    support_weekly: a claimant with an active current child-support withholding order whose weekly amount is at least the support threshold
    snap_order_active: and also an active SNAP overissuance recovery order
    obligation_share: a claimant with an active current child-support withholding order whose weekly amount is at least the support threshold and also an active SNAP overissuance recovery order pays the two-obligation share of the installment part; a claimant with only one of those two pays the one-obligation share; any other claimant pays the installment part in full.
    returned_installments: when two or more repayments were returned among the entries taken for the installment credit
    fees_unpaid: Returned-payment fees stand unpaid to the extent the fees booked on the overpayment exceed the repayments applied to its fee component.
    latest_fee: when exactly one was, the most recent returned-payment fee joins
    fees_in_arrears: when two or more repayments were returned among the entries taken for the installment credit, every returned-payment fee standing unpaid on the overpayment joins the arrears; when exactly one was, the most recent returned-payment fee joins; when none was, no fee joins.
    principal_unpaid: The principal standing unpaid is the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds.
    penalty_unpaid: The penalty standing unpaid is the penalty assessed less the penalty recovered by repayments, benefit offsets and tax refund intercepts, plus the penalty put back by returned repayments.
    arrears_due: The arrears payment is the installments counted times the price of each installment, less the installment credit, never less than zero, rounded to the cent. / The arrears payment is the installment part, after any reduction, plus the fees that join, limited to the penalty standing unpaid and rounded to the cent.
    result: An arrears payment is taken only when the overpayment's principal has been fully recovered, and it never exceeds the penalty standing unpaid; on an overpayment whose principal still stands unpaid the arrears payment is zero / The arrears payment is the installment part, after any reduction, plus the fees that join, limited to the penalty standing unpaid and rounded to the cent.
  factors:
  - id: default_age_cutoff
    effect: method
    decides: installments_counted
    bindings:
    - default_age_days
    - installments_counted
    ladder:
    - when: the plan's most recent returned installment was booked more than the long default-age days before the handling date
      method: count the first installment plus one for each whole month from the first installment due date to that return's booking date
    - when: it was booked more than the short default-age days and no more than the long default-age days before the handling date
      method: count the installments fallen due up to that return plus one more
    - when: otherwise (booked the short default-age days or fewer before, or no installment returned)
      method: count every installment fallen due to the handling date
    baseline:
      installments_counted: 1 + months_on_plan
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: breakdown_timing_price
    effect: parameter
    decides: installment_price
    bindings:
    - months_to_breakdown
    - installment_price
    ladder:
    - when: fewer than the early-breakdown months passed from the first installment due date to the most recent returned installment
      value: P('min_monthly_payment')
    - when: at least the early-breakdown months but fewer than the mid-breakdown months passed
      value: (plan_installment + P('min_monthly_payment')) / 2
    - when: otherwise (the mid-breakdown months or more passed, or no installment returned)
      value: plan_installment
    baseline:
      installment_price: plan_installment
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: support_obligation_share
    effect: parameter
    decides: obligation_share
    bindings:
    - support_weekly
    - snap_order_active
    - obligation_share
    ladder:
    - when: an active current child-support withholding order of at least the support threshold a week and an active SNAP overissuance recovery order are both on the withholding records
      value: K('share_two_obligations')
    - when: exactly one of those two obligations is on the withholding records
      value: K('share_one_obligation')
    - when: otherwise (neither obligation)
      value: '1'
    baseline:
      obligation_share: '1'
    evidence:
    - cross_category
    cross_difficulty: withhold
  - id: returned_installment_fees
    effect: parameter
    decides: fees_in_arrears
    bindings:
    - returned_installments
    - fees_unpaid
    - latest_fee
    - fees_in_arrears
    ladder:
    - when: two or more repayments were returned among the entries taken for the installment credit
      value: every returned-payment fee standing unpaid on the overpayment
    - when: exactly one repayment was returned among those entries
      value: the most recent returned-payment fee
    - when: otherwise (no returned repayment among those entries)
      value: '0'
    baseline:
      fees_in_arrears: '0'
    evidence:
    - history
    cross_difficulty: null
