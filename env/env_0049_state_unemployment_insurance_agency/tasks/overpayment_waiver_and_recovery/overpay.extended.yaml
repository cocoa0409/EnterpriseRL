# Policy charter: Benefit Overpayment Accounts (claimant side).
# One holding = one overpayment established by one determination against one claim, carrying its own recovery balance.
category: overpay
display_name: Benefit Overpayment Accounts

binding:
  holding_table: overpayments
  event_tables: [overpay_ledger]
  intake_tables: [overpay_waiver_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: overpayment_balance}

lifecycle:
  states: [established, in_recovery, waiver_pending, suspended, paid_in_full, waived, cancelled, written_off]
  transitions:
    - {from: established, to: in_recovery, by: system, means: The appeal period on the determination lapsed (and, where waiver is available, the waiver window lapsed) without a pending appeal or waiver, and recovery begins.}
    - {from: established, to: waiver_pending, by: agent, means: A timely waiver request is taken under review before recovery began.}
    - {from: in_recovery, to: waiver_pending, by: agent, means: A timely waiver request is taken under review after recovery began.}
    - {from: waiver_pending, to: waived, by: agent, means: The waiver is granted for the whole unpaid principal.}
    - {from: waiver_pending, to: in_recovery, by: agent, means: The waiver is denied or granted in part and recovery of the rest resumes.}
    - {from: established, to: suspended, by: agent, means: An appeal of the overpayment determination is on record and recovery is suspended.}
    - {from: in_recovery, to: suspended, by: agent, means: A late appeal accepted for hearing suspends recovery already under way.}
    - {from: waiver_pending, to: suspended, by: agent, means: An appeal of the determination is filed while a waiver is under review; the appeal is decided first.}
    - {from: suspended, to: in_recovery, by: system, means: The determination is affirmed or the appeal is withdrawn or dismissed, and recovery resumes.}
    - {from: suspended, to: cancelled, by: system, means: The determination is reversed on appeal and the overpayment no longer exists.}
    - {from: established, to: paid_in_full, by: system, means: The balance reached zero before recovery formally began.}
    - {from: in_recovery, to: paid_in_full, by: system, means: The balance reached zero.}
    - {from: in_recovery, to: written_off, by: system, means: The collection limit or the small-balance rule ends recovery.}

accounts:
  - key: overpayment_balance
    unit: USD
    meaning: Amount still owed on the overpayment across its principal, penalty, interest and fee components; assessments raise it and recoveries and adjustments lower it.

parameter_schema:
  waiver_eligible: "Whether the classification is without fault on the claimant's part and may be waived (boolean)"
  waiver_request_window_days: "Calendar days after the overpayment determination date within which a waiver request must be received (days); 0 means waiver is not available"
  waiver_full_income_pct_of_guideline: "Annual household income, as a percent of the federal poverty guideline for the household size, at or below which the whole unpaid principal is waived (percent); 0 means not available"
  waiver_partial_income_pct_of_guideline: "Annual household income, as a percent of the poverty guideline, at or below which a partial waiver is granted (percent); 0 means not available"
  waiver_partial_share: "Share of the unpaid principal waived by a partial waiver (decimal); 0 means not available"
  poverty_guideline_annual_base: "Federal poverty guideline for a one-person household used by the waiver income test (USD per year)"
  poverty_guideline_per_additional_person: "Amount added to the poverty guideline for each additional household member (USD per year)"
  waiver_decision_business_days: "Business days within which a waiver request is decided after receipt (business days)"
  waiver_form_included_with_notice: "Whether the waiver request form is mailed with the overpayment determination (boolean)"
  recovery_suspended_while_waiver_pending: "Whether offsets, intercepts and billing stop while a waiver request is under review (boolean)"
  penalty_waivable: "Whether the fraud penalty may be waived (boolean)"
  penalty_pct: "Penalty assessed on the overpaid principal at establishment (decimal share of principal)"
  penalty_deposited_to: "Fund credited with collected penalty (enum)"
  interest_rate_monthly: "Simple interest charged per calendar month on the unpaid principal (decimal per month)"
  interest_start_days_after_determination: "Calendar days after the determination date before the first interest month begins (days); 0 means no interest"
  interest_suspended_while_plan_current: "Whether interest stops accruing for months in which a repayment plan is current (boolean)"
  benefit_offset_pct_of_payment: "Share of each weekly payable benefit amount applied to the balance by offset (decimal)"
  cross_program_offset_allowed: "Whether payments under other programs (EB, TRA, UCFE, UCX) are offset (boolean)"
  interstate_offset_allowed: "Whether another state's benefit payments may be offset under the interstate reciprocal offset arrangement (boolean)"
  recovery_priority_rank: "Order in which open overpayments of one claimant receive unallocated recoveries, 1 first (rank)"
  payment_application_order: "Order in which a recovery is applied among the components of one overpayment (enum)"
  disqualification_weeks: "Fraud penalty weeks during which otherwise-payable weeks are denied (weeks)"
  disqualification_window_years: "Years after the fraud determination within which penalty weeks are served against weeks claimed (years); 0 means none"
  repeat_offense_lookback_years: "Years before the new determination date within which a prior fraud determination makes the new one a repeat offense (years); 0 means not applicable"
  min_monthly_payment: "Minimum monthly installment of a repayment plan (USD per month)"
  max_plan_months: "Longest term of a repayment plan (months)"
  plan_first_payment_days: "Calendar days after the plan is set within which the first installment is due (days)"
  plan_payment_due_day: "Day of the month on which later installments are due (day of month)"
  plan_grace_days: "Calendar days after the due date before an installment counts as missed (days)"
  plan_default_missed_payments: "Consecutive missed installments that default a plan (count)"
  offset_continues_with_plan: "Whether benefit offsets continue while a repayment plan is current (boolean)"
  statement_cycle: "Frequency of balance statements mailed while a balance is open (enum)"
  payment_channels_accepted: "Channels through which voluntary repayments are accepted (list)"
  card_convenience_fee_pct: "Vendor convenience fee charged on card repayments, paid on top of the repayment and never applied to the balance (decimal)"
  returned_payment_fee: "Fee assessed when a repayment is returned unpaid by the bank (USD)"
  excess_refund_min_amount: "Smallest excess repayment refunded to the claimant (USD)"
  refund_processing_business_days: "Business days to issue a refund of excess repayments or of recoveries on a cancelled overpayment (business days)"
  top_referral_eligible: "Whether the debt may be referred to the Treasury Offset Program for federal tax refund offset (boolean)"
  top_notice_days: "Calendar days between the notice of intent to refer and the referral (days)"
  top_min_debt: "Smallest balance that may be referred to the Treasury Offset Program (USD)"
  state_tax_refund_intercept_eligible: "Whether the debt may be intercepted from a state income tax refund (boolean)"
  intercept_notice_days: "Calendar days between the notice of intent and a state tax refund intercept (days)"
  delinquency_days_for_referral: "Calendar days without any recovery, and with no current plan, after which a debt is delinquent for referral (days)"
  collection_limit_years: "Years after the determination date after which recovery stops and the balance is written off (years)"
  small_balance_write_off_threshold: "Balance below which a debt with no recovery for the inactivity months is written off (USD); 0 means never"
  small_balance_inactivity_months: "Months without any recovery before a small balance is written off (months); 0 means never"
  employer_charge_credit_on_recovery: "Whether principal recovered on a chargeable claim is credited back to the charged employers (boolean)"
  interest_basis: "How interest is computed (enum: simple_on_unpaid_principal, never compounded on penalty or interest)"
  voluntary_repayment_accepted_while_suspended: "Whether voluntary repayments are accepted while recovery is suspended for an appeal or a waiver review (boolean)"

