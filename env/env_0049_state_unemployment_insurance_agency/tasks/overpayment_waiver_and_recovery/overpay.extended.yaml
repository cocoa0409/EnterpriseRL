    rule: An arrears payment is taken only when the overpayment's principal has been fully recovered, and it never exceeds the penalty standing unpaid; on an overpayment whose principal still stands unpaid the arrears payment is zero, because the missed installments there are collected through the plan's own installments. The principal standing unpaid is the principal assessed less the principal recovered by repayments, benefit offsets and tax refund intercepts and the principal removed by waiver, cancellation and write-off adjustments, plus the principal put back by returned repayments and refunds. The penalty standing unpaid is the penalty assessed less the penalty recovered by repayments, benefit offsets and tax refund intercepts, plus the penalty put back by returned repayments. The arrears payment is the installments counted times the price of each installment, less the installment credit, never less than zero, rounded to the cent. The installments counted are the first installment plus one for each whole month elapsed from the plan's first installment due date to the handling date, and each is priced at the plan's monthly installment. The installment credit is the repayments received on the overpayment less the repayments returned unpaid, taking the entries booked within the whole months elapsed from the first installment due date to the handling date plus the month in progress, where an entry is taken when the whole months from its booking date to the handling date are fewer than that number.
