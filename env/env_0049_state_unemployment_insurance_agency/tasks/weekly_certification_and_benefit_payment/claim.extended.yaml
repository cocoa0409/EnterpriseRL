- id: claim_payment_method
  subject:
  - claim_payment_method_changed
  rule: "The claimant chooses how benefits are paid: direct deposit to a checking or savings account in the claimant's name, the state benefit debit card, which is assigned by default when no direct deposit election is made, or a paper check where neither is possible. A change takes effect for payments issued on or after the payment method effective date, which is the change lead time after the change is recorded, counted in business days (Monday through Friday excluding state holidays). A payment method change is accepted only while the claim hold reason is not fraud_review. Only the claimant may ask for the change, and a request from anyone else is not accepted. One replacement debit card per benefit year carries no fee; later replacements carry the card program's fee and do not change the payment method."
  eligibility:
  - id: no_change_under_fraud_review
    applies_to:
    - claim_payment_method_changed
    kind: state
    condition: "A payment method change is accepted only while the claim hold reason is not fraud_review."
    evidence_fields:
    - claims.claim_id
    - claims.hold_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims.claim_id
      action_bindings:
        claims.claim_id: claim_id
    state_contract:
      field: claims.hold_reason
      allowed:
      - none
      - nonmonetary_issue
      - identity_verification
  params:
    payment_method_change_lead_business_days: =payment_method_change_lead_business_days
    default_payment_method: =default_payment_method
    debit_card_free_replacements_per_benefit_year: =debit_card_free_replacements_per_benefit_year
- id: claim_tax_statement
  subject:
  - claim_1099g_issued
  - claim_1099g_corrected
  rule: "A Form 1099-G is issued for each claim on which benefits were paid in a calendar tax year, by the issue deadline of the following year. Box 1 is claim_msr_benefits_paid_in_tax_year: payments issued in the tax year by payment date, gross of overpayment offsets and income tax withholding, less payments cancelled in the same year and less overpayments repaid in the same tax year; a repayment made in a later year does not change the earlier statement. Box 4 is the federal income tax withheld and Box 11 the state income tax withheld from those payments. A corrected statement is issued when the original is wrong: identity_theft when the claim was filed by an impostor, in which case the corrected statement reports zero in every box; payment_reversal when payments were cancelled after issue; overpayment_repaid_same_year; or withholding_misreported. An identity_theft correction is issued only when the identity verification case linked to the claim has status fraud_confirmed. A correction may be requested only for a tax year within the correction lookback years before the current year. Each correction is a new statement record and the original is never edited."
  eligibility:
  - id: identity_theft_confirmed
    applies_to:
