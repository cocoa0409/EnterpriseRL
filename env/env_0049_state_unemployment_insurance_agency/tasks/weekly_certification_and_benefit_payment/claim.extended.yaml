    ladder:
    - when: "standard base period used, base-period wages at least the steady-earner ratio times high-quarter wages, and the entitlement credited on the claim already at the wage-capped amount"
      value: K('frac_steady_standard')
    - when: "alternate base period used, base-period wages at least that ratio times high-quarter wages, and the entitlement credited already at the wage-capped amount"
      value: K('frac_steady_alternate')
    - when: otherwise
      value: P('mba_bpw_fraction')
    baseline:
      frac: P('mba_bpw_fraction')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
