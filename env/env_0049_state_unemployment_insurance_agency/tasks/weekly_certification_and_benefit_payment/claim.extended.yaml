- id: claim_ext_parent_shortfall_supplement
  base_policy_refs:
  - claim_agg_program_sequence
  - claim_evt_payable_amount
  - claim_evt_waiting_week
  overwrite:
  - base_policy: claim_evt_payable_amount
    superseded_clause: "Otherwise the earnings deduction is the part of gross earnings above the earnings disregard, which is the disregard share of the weekly benefit amount."
    replaced_by: "For a supplemental correction, when the hours reported for the corrected week are below the low-hours fraction of that full-time hours threshold, the earnings deduction is the low-hours rate times the earnings above the disregard, rounded to the cent."
  - base_policy: claim_evt_payable_amount
    superseded_clause: "A week in which hours worked reach the full-time hours threshold is not a week of unemployment and nothing is paid."
    replaced_by: "For a supplemental correction, the full-time hours threshold is the reduced-hours threshold when the separation recorded on the claim is reduced hours."
  - base_policy: claim_evt_payable_amount
    superseded_clause: "The other-pay deduction is vacation and holiday pay allocated to the week where deductible, plus the weekly-prorated base-period-employer pension times the pension offset share, using the claimant-contributed share where the claimant paid into the plan; severance pay is not deducted."
    replaced_by: "For a supplemental correction, a claimant-contributed pension whose weekly amount is no more than the small-pension fraction of the weekly benefit amount is first reduced by the pension disregard, which is the pension disregard fraction of the weekly benefit amount, and only the remainder is deducted at the program's claimant-contributed share, rounded to the cent and never below zero."
  trigger: state_due
  subject:
  - claim_benefit_paid
  computes: amount
  target_tool: issue_supplemental_payment_38b81267
  params:
    share_training: 0.5
    share_attached: 0.4
    attached_hours: 100
    thr_reduced: 36
    thr_recall: 34
    recall_window_days: 56
    low_hours_frac: 0.5
    mid_hours_frac: 0.75
    low_hours_rate: 0.5
    mid_hours_rate: 0.75
    small_pension_frac: 0.25
    mid_pension_frac: 0.5
    mid_pension_share: 0.375
    pension_disregard_frac: 0.1
  rule: "A supplemental payment corrects the most recent week for which a weekly payment was issued on the claim, and it is owed whenever that week was paid less than its correct payable amount. The correct payable amount of the corrected week is the weekly benefit amount plus the dependency allowance, minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar and never below zero. As the standard method, the earnings disregard is the program's disregard share of the weekly benefit amount, rounded to the cent, and the earnings deduction is every dollar of gross earnings reported for the corrected week above that disregard. As the standard method, a corrected week whose reported hours reach the program's full-time hours threshold is not a week of unemployment and its correct payable amount is zero. As the standard method, the other-pay deduction is vacation or holiday pay reported for the corrected week in full, an employer-funded pension times the program's pension offset share, and a claimant-contributed pension times the program's claimant-contributed share, each rounded to the cent; severance pay is not deducted. The supplemental payment is the correct payable amount minus everything already paid for the corrected week on the claim (weekly, supplemental and reissued payments, less any cancelled payment), rounded to the cent, never below zero and never more than the remaining benefit balance. Both deductions are taken from the weekly benefit amount plus dependency allowance in one step, and the difference is rounded down to the whole dollar only after both subtractions. The figures of the corrected week are those on its certification, and the attachment hours are the hours on every certification of the claim whose week ended within the three calendar months before the handling date. For a supplemental correction, the disregard share is the attached-training share when the claim records enrolled approved training and the attachment hours total at least the attachment threshold. It is the attached-worker share when the claim records no enrolled approved training and the attachment hours total at least the attachment threshold. Any other supplemental correction uses the program's disregard share. For a supplemental correction, the full-time hours threshold is the reduced-hours threshold when the separation recorded on the claim is reduced hours. It is the recall threshold when the separation is not reduced hours and the claim records a definite recall date falling within the recall window after the handling date. Any other supplemental correction uses the program's full-time hours threshold. For a supplemental correction, when the hours reported for the corrected week are below the low-hours fraction of that full-time hours threshold, the earnings deduction is the low-hours rate times the earnings above the disregard, rounded to the cent. When those hours are at least the low-hours fraction but below the mid-hours fraction of the threshold, the earnings deduction is the mid-hours rate times the earnings above the disregard, rounded to the cent. When those hours are at or above the mid-hours fraction, every dollar above the disregard is deducted. For a supplemental correction, a claimant-contributed pension whose weekly amount is no more than the small-pension fraction of the weekly benefit amount is first reduced by the pension disregard, which is the pension disregard fraction of the weekly benefit amount, and only the remainder is deducted at the program's claimant-contributed share, rounded to the cent and never below zero. A claimant-contributed pension above the small-pension fraction but no more than the mid-pension fraction of the weekly benefit amount is deducted in whole at the mid-pension share, rounded to the cent. Any other pension in a supplemental correction is deducted in whole at the share the standard method gives. A supplemental correction is computed only once the claim's dependency allowance counts every dependent added to the record. A supplemental payment is not issued\
    \ until the claim carries a payment method election recorded after the latest identity theft re-verification of the claimant was verified."
  prerequisite:
  - problem: claim_ext_dependency_redetermination
    kind: value_input
    gate: da
    form: state
    condition: The claim's dependency allowance counts every dependent on record.
    resolved_by: record_dependency_redetermination_c7b3c182
    effect: "The dependency allowance read by the supplemental correction changes from the stale allowance to the redetermined allowance, raising the correct payable amount of the corrected week and the remaining balance that caps the supplemental payment."
    policy_source: "A supplemental correction is computed only once the claim's dependency allowance counts every dependent added to the record."
  - problem: claim_ext_payment_election_lead
    kind: state_gate
    gate: claims.payment_method_effective_date
    form: state
    condition: "The claim carries a payment method election whose recording postdates the verification date of the claimant's latest identity theft re-verification case."
    resolved_by: elect_payment_method_0e517696
    effect: "The gate on issuing a supplemental payment after an identity theft re-verification is satisfied, because a fresh election by the claimant now stands on the claim."
    policy_source: "A supplemental payment is not issued until the claim carries a payment method election recorded after the latest identity theft re-verification of the claimant was verified."
  cross_category: []
  compute:
  - wk: "LATEST('claim_ledger', 'week_ending_date', date_field='entry_date', event_type='claim_benefit_paid', payment_kind='weekly')"
  - wba: F('weekly_benefit_amount')
  - da: F('dependency_allowance')
  - gross: "LATEST('claim_certifications', 'gross_earnings', date_field='certified_date', week_ending_date=wk)"
  - hours: "LATEST('claim_certifications', 'hours_worked', date_field='certified_date', week_ending_date=wk)"
  - opay_type: "LATEST('claim_certifications', 'other_pay_type', date_field='certified_date', week_ending_date=wk)"
  - opay: "LATEST('claim_certifications', 'other_pay_amount', date_field='certified_date', week_ending_date=wk)"
  - hrs3: "SUM('claim_certifications', 'hours_worked', within_months=3, date_field='week_ending_date')"
  - share: "K('share_training') if F('approved_training') == 'enrolled' and hrs3 >= K('attached_hours') else (K('share_attached') if F('approved_training') != 'enrolled' and hrs3 >= K('attached_hours') else P('earnings_disregard_pct_of_wba'))"
  - recall_days: DAYS(NOW, F('recall_date')) if F('recall_date') else -1
  - thr: "K('thr_reduced') if F('separation_reason') == 'reduced_hours' else (K('thr_recall') if recall_days >= 0 and recall_days <= K('recall_window_days') else P('full_time_hours_threshold'))"
  - disregard: RND(share * wba, 2)
  - excess: MX(0, gross - disregard)
  - earn_ded: "RND(excess * K('low_hours_rate'), 2) if hours < thr * K('low_hours_frac') else (RND(excess * K('mid_hours_rate'), 2) if hours < thr * K('mid_hours_frac') else excess)"
  - pen_ded: "MX(0, RND((opay - wba * K('pension_disregard_frac')) * P('pension_offset_pct_claimant_contributed'), 2)) if opay_type == 'pension_claimant_contributed' and opay <= wba * K('small_pension_frac') else (RND(opay * K('mid_pension_share'), 2) if opay_type == 'pension_claimant_contributed' and opay <= wba * K('mid_pension_frac') else (RND(opay * (P('pension_offset_pct_claimant_contributed') if opay_type == 'pension_claimant_contributed' else P('pension_offset_pct')), 2) if opay_type == 'pension_employer_funded' or opay_type == 'pension_claimant_contributed' else 0))"
  - other_ded: "pen_ded + (opay if opay_type == 'vacation_pay' or opay_type == 'holiday_pay' else 0)"
  - correct: 0 if hours >= thr else MX(0, int(wba + da - earn_ded - other_ded))
  - paid_weekly: "LATEST('claim_ledger', 'amount', date_field='entry_date', event_type='claim_benefit_paid', payment_kind='weekly', week_ending_date=wk)"
  - paid_other: "SUM('claim_ledger', 'amount', event_type='claim_benefit_paid', payment_kind='supplemental', week_ending_date=wk) + SUM('claim_ledger', 'amount', event_type='claim_benefit_paid', payment_kind='reissue', week_ending_date=wk)"
  - cancelled: "SUM('claim_ledger', 'amount', event_type='claim_payment_cancelled', week_ending_date=wk)"
  - result: "MN(F('remaining_balance'), MX(0, RND(correct - (paid_weekly + paid_other - cancelled), 2)))"
  compute_basis:
    wk: "A supplemental payment corrects the most recent week for which a weekly payment was issued on the claim, and it is owed whenever that week was paid less than its correct payable amount."
    gross: "The figures of the corrected week are those on its certification, and the attachment hours are the hours on every certification of the claim whose week ended within the three calendar months before the handling date."
    hours: "The figures of the corrected week are those on its certification, and the attachment hours are the hours on every certification of the claim whose week ended within the three calendar months before the handling date."
    opay_type: "The figures of the corrected week are those on its certification, and the attachment hours are the hours on every certification of the claim whose week ended within the three calendar months before the handling date."
    opay: "The figures of the corrected week are those on its certification, and the attachment hours are the hours on every certification of the claim whose week ended within the three calendar months before the handling date."
    hrs3: "The figures of the corrected week are those on its certification, and the attachment hours are the hours on every certification of the claim whose week ended within the three calendar months before the handling date."
    share: "For a supplemental correction, the disregard share is the attached-training share when the claim records enrolled approved training and the attachment hours total at least the attachment threshold. It is the attached-worker share when the claim records no enrolled approved training and the attachment hours total at least the attachment threshold. Any other supplemental correction uses the program's disregard share."
    recall_days: "It is the recall threshold when the separation is not reduced hours and the claim records a definite recall date falling within the recall window after the handling date."
    thr: "For a supplemental correction, the full-time hours threshold is the reduced-hours threshold when the separation recorded on the claim is reduced hours. It is the recall threshold when the separation is not reduced hours and the claim records a definite recall date falling within the recall window after the handling date. Any other supplemental correction uses the program's full-time hours threshold. As the standard method, a corrected week whose reported hours reach the program's full-time hours threshold is not a week of unemployment and its correct payable amount is zero."
    disregard: "As the standard method, the earnings disregard is the program's disregard share of the weekly benefit amount, rounded to the cent, and the earnings deduction is every dollar of gross earnings reported for the corrected week above that disregard."
    excess: "As the standard method, the earnings disregard is the program's disregard share of the weekly benefit amount, rounded to the cent, and the earnings deduction is every dollar of gross earnings reported for the corrected week above that disregard."
    earn_ded: "For a supplemental correction, when the hours reported for the corrected week are below the low-hours fraction of that full-time hours threshold, the earnings deduction is the low-hours rate times the earnings above the disregard, rounded to the cent. When those hours are at least the low-hours fraction but below the mid-hours fraction of the threshold, the earnings deduction is the mid-hours rate times the earnings above the disregard, rounded to the cent. When those hours are at or above the mid-hours fraction, every dollar above the disregard is deducted."
    other_ded: "As the standard method, the other-pay deduction is vacation or holiday pay reported for the corrected week in full, an employer-funded pension times the program's pension offset share, and a claimant-contributed pension times the program's claimant-contributed share, each rounded to the cent; severance pay is not deducted."
    correct: "The correct payable amount of the corrected week is the weekly benefit amount plus the dependency allowance, minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar and never below zero. Both deductions are taken from the weekly benefit amount plus dependency allowance in one step, and the difference is rounded down to the whole dollar only after both subtractions. As the standard method, a corrected week whose reported hours reach the program's full-time hours threshold is not a week of unemployment and its correct payable amount is zero."
    paid_weekly: "The supplemental payment is the correct payable amount minus everything already paid for the corrected week on the claim (weekly, supplemental and reissued payments, less any cancelled payment), rounded to the cent, never below zero and never more than the remaining benefit balance."
    paid_other: "The supplemental payment is the correct payable amount minus everything already paid for the corrected week on the claim (weekly, supplemental and reissued payments, less any cancelled payment), rounded to the cent, never below zero and never more than the remaining benefit balance."
    cancelled: "The supplemental payment is the correct payable amount minus everything already paid for the corrected week on the claim (weekly, supplemental and reissued payments, less any cancelled payment), rounded to the cent, never below zero and never more than the remaining benefit balance."
    result: "The supplemental payment is the correct payable amount minus everything already paid for the corrected week on the claim (weekly, supplemental and reissued payments, less any cancelled payment), rounded to the cent, never below zero and never more than the remaining benefit balance."
    pen_ded: "For a supplemental correction, a claimant-contributed pension whose weekly amount is no more than the small-pension fraction of the weekly benefit amount is first reduced by the pension disregard, which is the pension disregard fraction of the weekly benefit amount, and only the remainder is deducted at the program's claimant-contributed share, rounded to the cent and never below zero. A claimant-contributed pension above the small-pension fraction but no more than the mid-pension fraction of the weekly benefit amount is deducted in whole at the mid-pension share, rounded to the cent. Any other pension in a supplemental correction is deducted in whole at the share the standard method gives. As the standard method, the other-pay deduction is vacation or holiday pay reported for the corrected week in full, an employer-funded pension times the program's pension offset share, and a claimant-contributed pension times the program's claimant-contributed share, each rounded to the cent; severance pay is not deducted."
  factors:
  - id: disregard_share_supplemental
    effect: parameter
    decides: share
    bindings:
    - hrs3
    - share
    ladder:
    - when: "the claim records enrolled approved training and the attachment hours total at least the attachment threshold"
      value: K('share_training')
    - when: "the claim records no enrolled approved training and the attachment hours total at least the attachment threshold"
      value: K('share_attached')
    - when: otherwise
      value: P('earnings_disregard_pct_of_wba')
    baseline:
      share: P('earnings_disregard_pct_of_wba')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: full_time_threshold_supplemental
    effect: parameter
    decides: thr
    bindings:
    - recall_days
    - thr
    ladder:
    - when: the separation recorded on the claim is reduced hours
      value: K('thr_reduced')
    - when: "the separation is not reduced hours and a definite recall date falls within the recall window after the handling date"
      value: K('thr_recall')
    - when: otherwise
      value: P('full_time_hours_threshold')
    baseline:
      thr: P('full_time_hours_threshold')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: excess_earnings_rate_supplemental
    effect: parameter
    decides: earn_ded
    bindings:
    - hours
    - earn_ded
    ladder:
    - when: "hours reported for the corrected week below the low-hours fraction of the full-time hours threshold"
      value: K('low_hours_rate') times the earnings above the disregard
    - when: "hours at least the low-hours fraction but below the mid-hours fraction of the threshold"
      value: K('mid_hours_rate') times the earnings above the disregard
    - when: otherwise
      value: 1 (every dollar above the disregard)
    baseline:
      earn_ded: excess
    evidence:
    - history
    cross_difficulty: null
  - id: pension_deduction_supplemental
    effect: method
    decides: pen_ded
    bindings:
    - opay_type
    - opay
    - pen_ded
    ladder:
    - when: "a claimant-contributed pension no more than the small-pension fraction of the weekly benefit amount"
      method: "reduce the pension by the pension disregard first, then deduct the remainder at the claimant-contributed share"
    - when: "a claimant-contributed pension above the small-pension fraction but no more than the mid-pension fraction"
      method: deduct the whole pension at the mid-pension share
    - when: otherwise
      method: deduct the whole pension at the share the standard method gives
    baseline:
      pen_ded: "RND(opay * (P('pension_offset_pct_claimant_contributed') if opay_type == 'pension_claimant_contributed' else P('pension_offset_pct')), 2) if opay_type == 'pension_employer_funded' or opay_type == 'pension_claimant_contributed' else 0"
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    params:
    - earnings_disregard_pct_of_wba
    - full_time_hours_threshold
    - pension_offset_pct
    - pension_offset_pct_claimant_contributed
    rule: "The correct payable amount of the corrected week is the weekly benefit amount plus the dependency allowance, minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar and never below zero. As the standard method, the earnings disregard is the program's disregard share of the weekly benefit amount, rounded to the cent, and the earnings deduction is every dollar of gross earnings reported for the corrected week above that disregard. As the standard method, a corrected week whose reported hours reach the program's full-time hours threshold is not a week of unemployment and its correct payable amount is zero. As the standard method, the other-pay deduction is vacation or holiday pay reported for the corrected week in full, an employer-funded pension times the program's pension offset share, and a claimant-contributed pension times the program's claimant-contributed share, each rounded to the cent; severance pay is not deducted. The supplemental payment is the correct payable amount minus everything already paid for the corrected week on the claim (weekly, supplemental and reissued payments, less any cancelled payment), rounded to the cent, never below zero and never more than the remaining benefit balance."
  inputs:
    history:
    - table: claim_certifications
      aggregate: sum
      field: hours_worked
      within_months: 3
      filters: {}
    - table: claim_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: claim_benefit_paid
    cross_category: []
- id: claim_ext_extension_entitlement
  base_policy_refs:
  - claim_monetary_eligibility
  - claim_extended_program_entitlement
  - claim_agg_program_sequence
  overwrite:
  - base_policy: claim_extended_program_entitlement
    superseded_clause: "its maximum benefit amount is the lesser of the Extended Benefits fraction times the parent claim's maximum benefit amount (claim_msr_parent_mba) and the maximum duration weeks times the weekly benefit amount plus dependency allowance."
    replaced_by: "As the standard method, the parent entitlement measure is the regular benefits paid on the parent claim, that is every payment issued on it less every cancelled payment, and the Extended Benefits fraction is one half."
  - base_policy: claim_extended_program_entitlement
    superseded_clause: the claimant must show the minimum weeks of full-time base-period employment
    replaced_by: "For an Extended Benefits claim, the claimant shows the minimum weeks of full-time base-period employment through their wage equivalent: the parent claim's base-period wages must be at least the wage-weeks test times the parent's weekly benefit amount, and an Extended Benefits claim whose parent wages fall short of that is determined with a maximum benefit amount of zero."
  trigger: on_request
  subject:
  - claim_entitlement_credited
  computes: max_benefit_amount
  target_tool: determine_extension_entitlement_db601fac
  params:
    eb_standard_fraction: 0.5
    eb_weeks: 13
    wage_weeks_test: 40
    long_claim_weekly_payments: 20
    frac_long_attached: 0.52
    frac_attached: 0.51
    training_claim_age_days: 182
    addon_weeks_long: 2
    addon_weeks_short: 1
    addon_window_days: 21
    half: 0.5
    high_wage_weeks: 60
  rule: "The first Extended Benefits determination on a filed Extended Benefits claim fixes its maximum benefit amount from the parent claim named on it, copies the parent's weekly benefit amount and dependency allowance, credits the maximum benefit amount to the Extended Benefits claim's remaining balance and makes the claim active. As the standard method, the Extended Benefits maximum benefit amount is the lesser of the Extended Benefits fraction of the parent entitlement measure and the Extended Benefits weeks times the parent's weekly benefit amount plus dependency allowance, rounded down to the whole dollar. As the standard method, the parent entitlement measure is the regular benefits paid on the parent claim, that is every payment issued on it less every cancelled payment, and the Extended Benefits fraction is one half. As the standard method, the training weeks added are zero and each training week is valued at the weekly benefit amount, so the training addition, the training weeks times the value of a training week rounded down to the whole dollar, is zero. For an Extended Benefits claim, the claimant shows the minimum weeks of full-time base-period employment through their wage equivalent: the parent claim's base-period wages must be at least the wage-weeks test times the parent's weekly benefit amount, and an Extended Benefits claim whose parent wages fall short of that is determined with a maximum benefit amount of zero. The training weeks times the value of a training week, rounded down to the whole dollar, are added to the rounded lesser amount after the comparison and are never part of it. The weekly payments counted are the weekly payments issued on the parent claim, and the parent claim's age is the calendar days from its effective date to the handling date. For an Extended Benefits entitlement, the Extended Benefits fraction is the long-attachment fraction when at least the long-claim number of weekly payments was issued on the parent and the parent's base-period wages are at least the high-wage test times its weekly benefit amount. It is the attachment fraction when at least that number of weekly payments was issued on the parent and its base-period wages are below the high-wage test times its weekly benefit amount. Any other Extended Benefits entitlement, with fewer weekly payments issued on the parent, uses the standard fraction of one half. For an Extended Benefits entitlement, when one or more non-fraud overpayments against the parent claim stand at status established and no fraud overpayment stands against it, the parent entitlement measure is the regular benefits paid less the sum of those overpayments' principal amounts. When any fraud overpayment, of either fraud classification, stands against the parent claim, the parent entitlement measure is zero. When no fraud overpayment and no non-fraud overpayment at status established stands against the parent claim, the parent entitlement measure is the regular benefits paid. For an Extended Benefits entitlement, the training weeks added are the long-claim training weeks when the parent claim records enrolled approved training and the parent claim is at least the training age in days old. They are the short-claim training weeks when the parent claim records enrolled approved training and is younger than the training age. No training weeks are added when the parent claim records no enrolled approved training. For an Extended Benefits entitlement, each training week is valued at the weekly benefit amount plus the full dependency allowance when the parent claim carries a dependency allowance and its latest monetary determination is no more than the redetermination window days old. Each training week is valued at the weekly benefit amount plus one half of the dependency allowance when the parent carries a dependency allowance and that determination is older. Each training week is valued at the weekly benefit amount when the parent claim carries no dependency allowance. The Extended Benefits maximum benefit amount is fixed only after the parent claim's last paid\
    \ week carries a supplemental payment for its shortfall. The Extended Benefits maximum benefit amount is not fixed until the parent claim's dependency allowance counts every dependent added to the record."
  prerequisite:
  - problem: claim_ext_parent_shortfall_supplement
    kind: value_input
    gate: paid
    form: state
    condition: The parent claim's ledger carries a supplemental payment for its last paid week.
    resolved_by: issue_supplemental_payment_38b81267
    effect: "The regular benefits paid on the parent claim, which the Extended Benefits entitlement measure reads, rise by the supplemental payment, and the parent stands exhausted."
    policy_source: "The Extended Benefits maximum benefit amount is fixed only after the parent claim's last paid week carries a supplemental payment for its shortfall."
  - problem: claim_ext_dependency_redetermination
    kind: value_input
    gate: da
    form: state
    condition: The parent claim's dependency allowance counts every dependent on record.
    resolved_by: record_dependency_redetermination_c7b3c182
    effect: "The dependency allowance and determination age read by the Extended Benefits entitlement change, so the weekly cap and the value of each training week change."
    policy_source: "The Extended Benefits maximum benefit amount is not fixed until the parent claim's dependency allowance counts every dependent added to the record."
  cross_category:
  - category: overpay
    as: history
    reads:
    - overpayments.principal_amount
    - overpayments.status
    - overpayments.variant_name
    note: "The parent entitlement measure counts the fraud overpayments against the parent claim and sums the principal of its non-fraud overpayments at status established."
  compute:
  - wba: F('weekly_benefit_amount')
  - da: F('dependency_allowance')
  - paid: SUM('claim_ledger', 'amount', event_type='claim_benefit_paid')
  - cancelled: SUM('claim_ledger', 'amount', event_type='claim_payment_cancelled')
  - weekly_count: COUNT('claim_ledger', event_type='claim_benefit_paid', payment_kind='weekly')
  - eb_frac: "K('frac_long_attached') if weekly_count >= K('long_claim_weekly_payments') and F('base_period_wages') >= K('high_wage_weeks') * wba else (K('frac_attached') if weekly_count >= K('long_claim_weekly_payments') and F('base_period_wages') < K('high_wage_weeks') * wba else K('eb_standard_fraction'))"
  - fraud_n: "XCOUNT('overpay', 'overpayments', claim_id=HID, variant_name='Fraud Overpayment — First Offense') + XCOUNT('overpay', 'overpayments', claim_id=HID, variant_name='Fraud Overpayment — Repeat Offense')"
  - est_principal: "XSUM('overpay', 'overpayments', 'principal_amount', claim_id=HID, status='established')"
  - measure: "0 if fraud_n > 0 else ((paid - cancelled) - est_principal if est_principal > 0 else (paid - cancelled))"
  - claim_age: DAYS(F('effective_date'), NOW)
  - addon_weeks: "K('addon_weeks_long') if F('approved_training') == 'enrolled' and claim_age >= K('training_claim_age_days') else (K('addon_weeks_short') if F('approved_training') == 'enrolled' and claim_age < K('training_claim_age_days') else 0)"
  - det_age: DAYS(F('monetary_determination_date'), NOW)
  - addon_weekly: "wba + da if da > 0 and det_age <= K('addon_window_days') else (wba + RND(da * K('half'), 2) if da > 0 and det_age > K('addon_window_days') else wba)"
  - result: "0 if F('base_period_wages') < K('wage_weeks_test') * wba else int(MN(eb_frac * measure, K('eb_weeks') * (wba + da))) + int(addon_weeks * addon_weekly)"
  compute_basis:
    wba: "The first Extended Benefits determination on a filed Extended Benefits claim fixes its maximum benefit amount from the parent claim named on it, copies the parent's weekly benefit amount and dependency allowance, credits the maximum benefit amount to the Extended Benefits claim's remaining balance and makes the claim active."
    da: "The first Extended Benefits determination on a filed Extended Benefits claim fixes its maximum benefit amount from the parent claim named on it, copies the parent's weekly benefit amount and dependency allowance, credits the maximum benefit amount to the Extended Benefits claim's remaining balance and makes the claim active."
    paid: "As the standard method, the parent entitlement measure is the regular benefits paid on the parent claim, that is every payment issued on it less every cancelled payment, and the Extended Benefits fraction is one half."
    cancelled: "As the standard method, the parent entitlement measure is the regular benefits paid on the parent claim, that is every payment issued on it less every cancelled payment, and the Extended Benefits fraction is one half."
    weekly_count: "The weekly payments counted are the weekly payments issued on the parent claim, and the parent claim's age is the calendar days from its effective date to the handling date."
    eb_frac: "For an Extended Benefits entitlement, the Extended Benefits fraction is the long-attachment fraction when at least the long-claim number of weekly payments was issued on the parent and the parent's base-period wages are at least the high-wage test times its weekly benefit amount. It is the attachment fraction when at least that number of weekly payments was issued on the parent and its base-period wages are below the high-wage test times its weekly benefit amount. Any other Extended Benefits entitlement, with fewer weekly payments issued on the parent, uses the standard fraction of one half."
    measure: "For an Extended Benefits entitlement, when one or more non-fraud overpayments against the parent claim stand at status established and no fraud overpayment stands against it, the parent entitlement measure is the regular benefits paid less the sum of those overpayments' principal amounts. When any fraud overpayment, of either fraud classification, stands against the parent claim, the parent entitlement measure is zero. When no fraud overpayment and no non-fraud overpayment at status established stands against the parent claim, the parent entitlement measure is the regular benefits paid."
    claim_age: "The weekly payments counted are the weekly payments issued on the parent claim, and the parent claim's age is the calendar days from its effective date to the handling date."
    addon_weeks: "For an Extended Benefits entitlement, the training weeks added are the long-claim training weeks when the parent claim records enrolled approved training and the parent claim is at least the training age in days old. They are the short-claim training weeks when the parent claim records enrolled approved training and is younger than the training age. No training weeks are added when the parent claim records no enrolled approved training."
    det_age: "For an Extended Benefits entitlement, each training week is valued at the weekly benefit amount plus the full dependency allowance when the parent claim carries a dependency allowance and its latest monetary determination is no more than the redetermination window days old."
    addon_weekly: "For an Extended Benefits entitlement, each training week is valued at the weekly benefit amount plus the full dependency allowance when the parent claim carries a dependency allowance and its latest monetary determination is no more than the redetermination window days old. Each training week is valued at the weekly benefit amount plus one half of the dependency allowance when the parent carries a dependency allowance and that determination is older. Each training week is valued at the weekly benefit amount when the parent claim carries no dependency allowance."
    result: "As the standard method, the Extended Benefits maximum benefit amount is the lesser of the Extended Benefits fraction of the parent entitlement measure and the Extended Benefits weeks times the parent's weekly benefit amount plus dependency allowance, rounded down to the whole dollar. The training weeks times the value of a training week, rounded down to the whole dollar, are added to the rounded lesser amount after the comparison and are never part of it. For an Extended Benefits claim, the claimant shows the minimum weeks of full-time base-period employment through their wage equivalent: the parent claim's base-period wages must be at least the wage-weeks test times the parent's weekly benefit amount, and an Extended Benefits claim whose parent wages fall short of that is determined with a maximum benefit amount of zero."
    fraud_n: "When any fraud overpayment, of either fraud classification, stands against the parent claim, the parent entitlement measure is zero."
    est_principal: "For an Extended Benefits entitlement, when one or more non-fraud overpayments against the parent claim stand at status established and no fraud overpayment stands against it, the parent entitlement measure is the regular benefits paid less the sum of those overpayments' principal amounts."
  factors:
  - id: eb_fraction
    effect: parameter
    decides: eb_frac
    bindings:
    - weekly_count
    - eb_frac
    ladder:
    - when: "at least the long-claim number of weekly payments issued on the parent and parent base-period wages at least the high-wage test times its weekly benefit amount"
      value: K('frac_long_attached')
    - when: "at least that number of weekly payments issued and parent base-period wages below the high-wage test times its weekly benefit amount"
      value: K('frac_attached')
    - when: otherwise
      value: K('eb_standard_fraction')
    baseline:
      eb_frac: K('eb_standard_fraction')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: parent_entitlement_measure
    effect: method
    decides: measure
    bindings:
    - fraud_n
    - est_principal
    - measure
    ladder:
    - when: "one or more non-fraud overpayments against the parent claim at status established and no fraud overpayment against it"
      method: regular benefits paid less the sum of those overpayments' principal amounts
    - when: any fraud overpayment stands against the parent claim
      method: the measure is zero
    - when: otherwise
      method: the regular benefits paid on the parent claim
    baseline:
      measure: paid - cancelled
    evidence:
    - cross_category
    - history
    cross_difficulty: overpay
  - id: training_weeks_added
    effect: parameter
    decides: addon_weeks
    bindings:
    - claim_age
    - addon_weeks
    ladder:
    - when: "enrolled approved training on the parent and the parent claim at least the training age in days old"
      value: K('addon_weeks_long')
    - when: enrolled approved training and the parent claim younger than the training age
      value: K('addon_weeks_short')
    - when: otherwise
      value: '0'
    baseline:
      addon_weeks: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: training_week_value
    effect: parameter
    decides: addon_weekly
    bindings:
    - det_age
    - addon_weekly
    ladder:
    - when: "the parent carries a dependency allowance and its latest monetary determination is no more than the redetermination window days old"
      value: weekly benefit amount plus the full dependency allowance
    - when: the parent carries a dependency allowance and that determination is older
      value: weekly benefit amount plus one half of the dependency allowance
    - when: otherwise
      value: weekly benefit amount
    baseline:
      addon_weekly: wba
    evidence:
    - date
    cross_difficulty: null
  baseline:
    params:
    - eb_standard_fraction
    - eb_weeks
    rule: "As the standard method, the Extended Benefits maximum benefit amount is the lesser of the Extended Benefits fraction of the parent entitlement measure and the Extended Benefits weeks times the parent's weekly benefit amount plus dependency allowance, rounded down to the whole dollar. As the standard method, the parent entitlement measure is the regular benefits paid on the parent claim, that is every payment issued on it less every cancelled payment, and the Extended Benefits fraction is one half. As the standard method, the training weeks added are zero and each training week is valued at the weekly benefit amount, so the training addition, the training weeks times the value of a training week rounded down to the whole dollar, is zero."
  inputs:
    history:
    - table: claim_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: claim_benefit_paid
    - table: claim_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: claim_payment_cancelled
    - category: overpay
      table: overpayments
      aggregate: sum
      field: principal_amount
      filters:
        status: established
    cross_category:
    - overpay
- id: claim_ext_dependency_disallowance
  base_policy_refs:
  - claim_monetary_eligibility
  overwrite:
  - base_policy: claim_monetary_eligibility
    superseded_clause: "A monetary redetermination carries the next determination_number and books only the difference from the previous maximum benefit amount: an increase is credited and a decrease is debited, and payments already issued are not reversed by the redetermination."
    replaced_by: "For a disallowance, when no weekly payment has been issued on the claim the reduction runs for the program's maximum duration weeks less its waiting week count."
  - base_policy: claim_monetary_eligibility
    superseded_clause: "The dependency allowance is the per-dependent amount times the number of dependents on record, counting no more than the maximum number of dependents."
    replaced_by: "For a disallowance, the per-dependent amount for the dependents remaining is the new-claim single amount when exactly one dependent remains on record and the claim is fewer than the long-claim days old."
  - base_policy: claim_monetary_eligibility
    superseded_clause: "The maximum benefit amount is the lesser of the maximum duration weeks times the weekly benefit amount plus dependency allowance and the base-period-wage fraction times base-period wages, rounded down to the whole dollar."
    replaced_by: "As the standard method, the disallowance reduction is the allowance on the claim minus the redetermined allowance, times the program's maximum duration weeks, rounded down to the whole dollar and never below zero."
  trigger: state_due
  subject:
  - claim_entitlement_reduced
  computes: amount
  target_tool: record_dependency_disallowance_f94a20ca
  params:
    single_new: 18.0
    single_long: 16.0
    long_claim_days: 182
    supported_share: 0.5
    pending_order_share: 0.25
    window_days: 21
    mid_days: 90
    prov_share: 0.04
    mid_share: 0.06
    late_balance_weeks: 4
    appeal_share: 0.5
    cent: 0.01
  rule: "A dependency disallowance is issued on a claim whose dependency allowance counts more dependents than are now on record, and it debits the resulting reduction from the maximum benefit amount and the remaining benefit balance; payments already issued are not reversed. As the standard method, the redetermined allowance after a disallowance is the program's dependency allowance per dependent times the dependents now on record, counting no more than the program's maximum number of dependents, with no ceiling. As the standard method, the disallowance reduction is the allowance on the claim minus the redetermined allowance, times the program's maximum duration weeks, rounded down to the whole dollar and never below zero. The age of the claim is the calendar days from its effective date to the handling date, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and weekly payments are those issued on the claim. For a disallowance, the per-dependent amount for the dependents remaining is the new-claim single amount when exactly one dependent remains on record and the claim is fewer than the long-claim days old. It is the long-claim single amount when exactly one dependent remains and the claim is at least the long-claim days old. Any other disallowance uses the program's per-dependent amount. For a disallowance, when no weekly payment has been issued on the claim the reduction runs for the program's maximum duration weeks less its waiting week count. When weekly payments have been issued and the remaining balance is below the late-balance number of weeks of the weekly benefit amount plus the allowance on the claim, the reduction runs for the remaining balance divided by that weekly amount, rounded up to the whole week. When weekly payments have been issued and the balance is at least that, the reduction runs for the maximum duration weeks. For a disallowance, when the latest monetary determination is no more than the redetermination window days old, the redetermined allowance is capped at the provisional share of the weekly benefit amount, rounded to the cent. When it is more than the window but no more than the mid-claim days old, the allowance is capped at the mid share of the weekly benefit amount, rounded to the cent. When it is older than that, no ceiling applies. For a disallowance, when the claimant's Lower Authority Appeal — Monetary Determination on the claim stands filed or scheduled, the reduction is booked at the pending-appeal share, rounded down to the whole dollar. When that appeal has been decided with the determination reversed, no reduction is booked. When no such appeal stands open or reversed, the reduction is booked in full. For a disallowance, a removed dependent is still counted at the supported share when at least one Child Support Withholding — Current Support Order binding the claimant, on any of the claimant's claims, stands at status active or suspended. It is counted at the pending-order share when no such order stands active or suspended and at least one such order has been received and stands at status requested. No share of a removed dependent is counted when no such order stands at any of those statuses. The ceiling applies to the redetermined allowance before it is subtracted from the allowance on the claim, the weeks multiply that decrease, and the appeal share applies to the product last."
  prerequisite: []
  cross_category:
  - category: appeal
    as: branch
    reads:
    - status
    - decision_outcome
    - variant_name
    - appellant_role
    note: The pending-appeal share reads the claimant-filed monetary appeal on the claim.
  - category: withhold
    as: history
    reads:
    - withholding_orders.variant_name
    - withholding_orders.status
    note: "The supported removed-dependent factor counts the current-support child support orders binding the claimant by status."
  compute:
  - deps: F('dependents_count')
  - da_old: F('dependency_allowance')
  - wba: F('weekly_benefit_amount')
  - claim_age: DAYS(F('effective_date'), NOW)
  - per_dep: "K('single_new') if deps == 1 and claim_age < K('long_claim_days') else (K('single_long') if deps == 1 and claim_age >= K('long_claim_days') else P('dependency_allowance_per_dependent'))"
  - cs_active: "XCOUNT('withhold', 'withholding_orders', variant_name='Child Support Withholding — Current Support Order', status='active') + XCOUNT('withhold', 'withholding_orders', variant_name='Child Support Withholding — Current Support Order', status='suspended')"
  - cs_requested: "XCOUNT('withhold', 'withholding_orders', variant_name='Child Support Withholding — Current Support Order', status='requested')"
  - extra_dep: "K('supported_share') if cs_active > 0 else (K('pending_order_share') if cs_active == 0 and cs_requested > 0 else 0)"
  - counted: MN(deps + extra_dep, P('dependency_allowance_max_dependents'))
  - det_age: DAYS(F('monetary_determination_date'), NOW)
  - da_new: "MN(RND(per_dep * counted, 2), RND(wba * K('prov_share'), 2)) if det_age <= K('window_days') else (MN(RND(per_dep * counted, 2), RND(wba * K('mid_share'), 2)) if det_age <= K('mid_days') else RND(per_dep * counted, 2))"
  - paid_weeks: COUNT('claim_ledger', event_type='claim_benefit_paid', payment_kind='weekly')
  - weeks: "P('max_duration_weeks') - P('waiting_week_count') if paid_weeks == 0 else (int((F('remaining_balance') + wba + da_old - K('cent')) / (wba + da_old)) if F('remaining_balance') < K('late_balance_weeks') * (wba + da_old) else P('max_duration_weeks'))"
  - ap_status: "CFIELD('appeal', 'status', claim_id=HID, variant_name='Lower Authority Appeal — Monetary Determination', appellant_role='claimant')"
  - ap_outcome: "CFIELD('appeal', 'decision_outcome', claim_id=HID, variant_name='Lower Authority Appeal — Monetary Determination', appellant_role='claimant')"
  - ap_share: "K('appeal_share') if ap_status == 'filed' or ap_status == 'scheduled' else (0 if ap_status == 'decided' and ap_outcome == 'reversed' else 1)"
  - decrease: MX(0, da_old - da_new)
  - result: int(weeks * decrease * ap_share)
  compute_basis:
    deps: "As the standard method, the redetermined allowance after a disallowance is the program's dependency allowance per dependent times the dependents now on record, counting no more than the program's maximum number of dependents, with no ceiling."
    da_old: "As the standard method, the disallowance reduction is the allowance on the claim minus the redetermined allowance, times the program's maximum duration weeks, rounded down to the whole dollar and never below zero."
    wba: "For a disallowance, when the latest monetary determination is no more than the redetermination window days old, the redetermined allowance is capped at the provisional share of the weekly benefit amount, rounded to the cent."
    claim_age: "The age of the claim is the calendar days from its effective date to the handling date, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and weekly payments are those issued on the claim."
    per_dep: "For a disallowance, the per-dependent amount for the dependents remaining is the new-claim single amount when exactly one dependent remains on record and the claim is fewer than the long-claim days old. It is the long-claim single amount when exactly one dependent remains and the claim is at least the long-claim days old. Any other disallowance uses the program's per-dependent amount."
    extra_dep: "For a disallowance, a removed dependent is still counted at the supported share when at least one Child Support Withholding — Current Support Order binding the claimant, on any of the claimant's claims, stands at status active or suspended. It is counted at the pending-order share when no such order stands active or suspended and at least one such order has been received and stands at status requested. No share of a removed dependent is counted when no such order stands at any of those statuses."
    counted: "As the standard method, the redetermined allowance after a disallowance is the program's dependency allowance per dependent times the dependents now on record, counting no more than the program's maximum number of dependents, with no ceiling."
    det_age: "The age of the claim is the calendar days from its effective date to the handling date, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and weekly payments are those issued on the claim."
    da_new: "For a disallowance, when the latest monetary determination is no more than the redetermination window days old, the redetermined allowance is capped at the provisional share of the weekly benefit amount, rounded to the cent. When it is more than the window but no more than the mid-claim days old, the allowance is capped at the mid share of the weekly benefit amount, rounded to the cent. When it is older than that, no ceiling applies. The ceiling applies to the redetermined allowance before it is subtracted from the allowance on the claim, the weeks multiply that decrease, and the appeal share applies to the product last."
    paid_weeks: "The age of the claim is the calendar days from its effective date to the handling date, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and weekly payments are those issued on the claim."
    weeks: "For a disallowance, when no weekly payment has been issued on the claim the reduction runs for the program's maximum duration weeks less its waiting week count. When weekly payments have been issued and the remaining balance is below the late-balance number of weeks of the weekly benefit amount plus the allowance on the claim, the reduction runs for the remaining balance divided by that weekly amount, rounded up to the whole week. When weekly payments have been issued and the balance is at least that, the reduction runs for the maximum duration weeks."
    ap_status: "For a disallowance, when the claimant's Lower Authority Appeal — Monetary Determination on the claim stands filed or scheduled, the reduction is booked at the pending-appeal share, rounded down to the whole dollar."
    ap_outcome: "When that appeal has been decided with the determination reversed, no reduction is booked."
    ap_share: "For a disallowance, when the claimant's Lower Authority Appeal — Monetary Determination on the claim stands filed or scheduled, the reduction is booked at the pending-appeal share, rounded down to the whole dollar. When that appeal has been decided with the determination reversed, no reduction is booked. When no such appeal stands open or reversed, the reduction is booked in full. The ceiling applies to the redetermined allowance before it is subtracted from the allowance on the claim, the weeks multiply that decrease, and the appeal share applies to the product last."
    decrease: "As the standard method, the disallowance reduction is the allowance on the claim minus the redetermined allowance, times the program's maximum duration weeks, rounded down to the whole dollar and never below zero. The ceiling applies to the redetermined allowance before it is subtracted from the allowance on the claim, the weeks multiply that decrease, and the appeal share applies to the product last."
    result: "As the standard method, the disallowance reduction is the allowance on the claim minus the redetermined allowance, times the program's maximum duration weeks, rounded down to the whole dollar and never below zero. The ceiling applies to the redetermined allowance before it is subtracted from the allowance on the claim, the weeks multiply that decrease, and the appeal share applies to the product last."
    cs_active: "For a disallowance, a removed dependent is still counted at the supported share when at least one Child Support Withholding — Current Support Order binding the claimant, on any of the claimant's claims, stands at status active or suspended."
    cs_requested: "It is counted at the pending-order share when no such order stands active or suspended and at least one such order has been received and stands at status requested."
  factors:
  - id: remaining_dependent_amount
    effect: parameter
    decides: per_dep
    bindings:
    - claim_age
    - per_dep
    ladder:
    - when: "exactly one dependent remains on record and the claim is fewer than the long-claim days old"
      value: K('single_new')
    - when: exactly one dependent remains and the claim is at least the long-claim days old
      value: K('single_long')
    - when: otherwise
      value: P('dependency_allowance_per_dependent')
    baseline:
      per_dep: P('dependency_allowance_per_dependent')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: disallowance_weeks
    effect: method
    decides: weeks
    bindings:
    - paid_weeks
    - weeks
    ladder:
    - when: no weekly payment issued on the claim
      method: maximum duration weeks less the waiting week count
    - when: "weekly payments issued and the remaining balance below the late-balance weeks of the weekly amount"
      method: remaining balance divided by the weekly amount, rounded up to the whole week
    - when: otherwise
      method: the maximum duration weeks
    baseline:
      weeks: P('max_duration_weeks')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: provisional_allowance_ceiling
    effect: parameter
    decides: da_new
    bindings:
    - wba
    - det_age
    - da_new
    ladder:
    - when: "the latest monetary determination no more than the redetermination window days old"
      value: K('prov_share') times the weekly benefit amount
    - when: more than the window but no more than the mid-claim days old
      value: K('mid_share') times the weekly benefit amount
    - when: otherwise
      value: no ceiling
    baseline:
      da_new: RND(per_dep * counted, 2)
    evidence:
    - date
    cross_difficulty: null
  - id: pending_monetary_appeal_share
    effect: parameter
    decides: ap_share
    bindings:
    - ap_status
    - ap_outcome
    - ap_share
    ladder:
    - when: "the claimant's Lower Authority Appeal — Monetary Determination on the claim stands filed or scheduled"
      value: K('appeal_share')
    - when: that appeal decided with the determination reversed
      value: '0'
    - when: otherwise
      value: '1'
    baseline:
      ap_share: '1'
    evidence:
    - cross_category
    cross_difficulty: appeal
  - id: supported_removed_dependent
    effect: parameter
    decides: extra_dep
    bindings:
    - cs_active
    - cs_requested
    - extra_dep
    ladder:
    - when: "at least one Child Support Withholding — Current Support Order binding the claimant stands at status active or suspended"
      value: K('supported_share')
    - when: "none stands active or suspended and at least one such order stands at status requested"
      value: K('pending_order_share')
    - when: otherwise
      value: '0'
    baseline:
      extra_dep: '0'
    evidence:
    - cross_category
    cross_difficulty: withhold
  baseline:
    params:
    - dependency_allowance_per_dependent
    - dependency_allowance_max_dependents
    - max_duration_weeks
    rule: "As the standard method, the redetermined allowance after a disallowance is the program's dependency allowance per dependent times the dependents now on record, counting no more than the program's maximum number of dependents, with no ceiling. As the standard method, the disallowance reduction is the allowance on the claim minus the redetermined allowance, times the program's maximum duration weeks, rounded down to the whole dollar and never below zero."
  inputs:
    history:
    - table: claim_ledger
      aggregate: count
      field: ledger_entry_id
      filters:
        event_type: claim_benefit_paid
        payment_kind: weekly
    cross_category:
    - appeal
    - withhold
- id: claim_ext_holiday_pay_report
  base_policy_refs:
  - claim_evt_weekly_certification
  overwrite: []
  trigger: on_request
  subject:
  - claim_week_certified
  computes: other_pay_amount
  target_tool: certify_week_by_phone_ea18d1f2
  params:
    closed_recent_days: 30
    closed_mid_days: 180
    win_recent: 12
    win_mid: 6
    win_standard: 3
    min_hours: 60
    quarter_hours: 520
    short_week: 12
    mid_week: 24
    hol_short: 4
    hol_mid: 6
    hol_std: 8
    avg_low: 10
    avg_mid: 20
    share_low: 0.5
    share_mid: 0.75
  rule: "When a claimant certifies a week in which an employer paid holiday pay that the claimant cannot yet state in dollars, the holiday pay reported as other pay for that week is the regular hourly rate times the holiday hours times the holiday pay share, rounded to the cent. The regular rate and hours are read from the certifications of the claimant's most recent earlier claim of the same program, the history window being counted back from the handling date over certifications whose week ended within it. As the standard method, the history window is the last three calendar months and the regular hourly rate is the earlier claim's high-quarter wages divided by the quarter hours, rounded to the cent. As the standard method, the holiday hours are a standard day of the standard holiday hours and the holiday pay share is one. For a holiday-pay report, the history window is the recent-claim window of months when the earlier claim closed no more than the recent-closure days before the handling date. It is the mid window of months when that claim closed more than the recent-closure days but no more than the mid-closure days before the handling date. Any other holiday-pay report uses the standard window of months. For a holiday-pay report, the regular hourly rate is the window earnings divided by the window hours when the window hours reach the minimum hours. It is the latest certified week's earnings divided by its hours when the window carries some hours but fewer than the minimum and that latest week reports hours worked. It is the earlier claim's high-quarter wages divided by the quarter hours in any other case. For a holiday-pay report, the holiday hours are the short-week holiday hours when the latest certified week reported fewer than the short-week hours. They are the mid-week holiday hours when that week reported at least the short-week hours but fewer than the mid-week hours. They are the standard holiday hours when it reported at least the mid-week hours. For a holiday-pay report, the holiday pay share is the low-schedule share when the window hours averaged over the window's certified weeks are below the low-average hours. It is the mid-schedule share when that average is at least the low-average hours but below the mid-average hours. It is one when that average is at least the mid-average hours. A week after the first week of a benefit year is certified only after the claim carries a waiting-week entry."
  prerequisite:
  - problem: claim_ext_waiting_week_value
    kind: state_gate
    gate: claim_ledger.event_type
    form: state
    condition: "The claim ledger carries a waiting-week entry before any later week of the benefit year is certified."
    resolved_by: record_waiting_week_428070c9
    effect: "The gate on certifying a week after the first week of the benefit year is satisfied."
    policy_source: "A week after the first week of a benefit year is certified only after the claim carries a waiting-week entry."
  cross_category: []
  compute:
  - closed_age: DAYS(F('closed_date'), NOW) if F('closed_date') else -1
  - win: "K('win_recent') if closed_age >= 0 and closed_age <= K('closed_recent_days') else (K('win_mid') if closed_age > K('closed_recent_days') and closed_age <= K('closed_mid_days') else K('win_standard'))"
  - g_w: "SUM('claim_certifications', 'gross_earnings', within_months=win, date_field='week_ending_date')"
  - h_w: "SUM('claim_certifications', 'hours_worked', within_months=win, date_field='week_ending_date')"
  - lat_g: LATEST('claim_certifications', 'gross_earnings', date_field='week_ending_date')
  - lat_h: LATEST('claim_certifications', 'hours_worked', date_field='week_ending_date')
  - rate: "RND(g_w / h_w, 2) if h_w >= K('min_hours') else (RND(lat_g / lat_h, 2) if h_w > 0 and lat_h > 0 else RND(F('high_quarter_wages') / K('quarter_hours'), 2))"
  - hol_hours: "K('hol_short') if lat_h < K('short_week') else (K('hol_mid') if lat_h < K('mid_week') else K('hol_std'))"
  - n_w: COUNT('claim_certifications', within_months=win, date_field='week_ending_date')
  - avg_h: h_w / n_w if n_w > 0 else 0
  - share: "K('share_low') if avg_h < K('avg_low') else (K('share_mid') if avg_h < K('avg_mid') else 1)"
  - result: RND(rate * hol_hours * share, 2)
  compute_basis:
    closed_age: "For a holiday-pay report, the history window is the recent-claim window of months when the earlier claim closed no more than the recent-closure days before the handling date."
    win: "For a holiday-pay report, the history window is the recent-claim window of months when the earlier claim closed no more than the recent-closure days before the handling date. It is the mid window of months when that claim closed more than the recent-closure days but no more than the mid-closure days before the handling date. Any other holiday-pay report uses the standard window of months."
    g_w: "The regular rate and hours are read from the certifications of the claimant's most recent earlier claim of the same program, the history window being counted back from the handling date over certifications whose week ended within it. For a holiday-pay report, the regular hourly rate is the window earnings divided by the window hours when the window hours reach the minimum hours."
    h_w: "The regular rate and hours are read from the certifications of the claimant's most recent earlier claim of the same program, the history window being counted back from the handling date over certifications whose week ended within it. For a holiday-pay report, the regular hourly rate is the window earnings divided by the window hours when the window hours reach the minimum hours."
    lat_g: "It is the latest certified week's earnings divided by its hours when the window carries some hours but fewer than the minimum and that latest week reports hours worked."
    lat_h: "It is the latest certified week's earnings divided by its hours when the window carries some hours but fewer than the minimum and that latest week reports hours worked. For a holiday-pay report, the holiday hours are the short-week holiday hours when the latest certified week reported fewer than the short-week hours."
    rate: "For a holiday-pay report, the regular hourly rate is the window earnings divided by the window hours when the window hours reach the minimum hours. It is the latest certified week's earnings divided by its hours when the window carries some hours but fewer than the minimum and that latest week reports hours worked. It is the earlier claim's high-quarter wages divided by the quarter hours in any other case."
    hol_hours: "For a holiday-pay report, the holiday hours are the short-week holiday hours when the latest certified week reported fewer than the short-week hours. They are the mid-week holiday hours when that week reported at least the short-week hours but fewer than the mid-week hours. They are the standard holiday hours when it reported at least the mid-week hours."
    n_w: "For a holiday-pay report, the holiday pay share is the low-schedule share when the window hours averaged over the window's certified weeks are below the low-average hours."
    avg_h: "For a holiday-pay report, the holiday pay share is the low-schedule share when the window hours averaged over the window's certified weeks are below the low-average hours."
    share: "For a holiday-pay report, the holiday pay share is the low-schedule share when the window hours averaged over the window's certified weeks are below the low-average hours. It is the mid-schedule share when that average is at least the low-average hours but below the mid-average hours. It is one when that average is at least the mid-average hours."
    result: "When a claimant certifies a week in which an employer paid holiday pay that the claimant cannot yet state in dollars, the holiday pay reported as other pay for that week is the regular hourly rate times the holiday hours times the holiday pay share, rounded to the cent."
  factors:
  - id: holiday_history_window
    effect: parameter
    decides: win
    bindings:
    - closed_age
    - win
    ladder:
    - when: "the earlier claim closed no more than the recent-closure days before the handling date"
      value: K('win_recent') months
    - when: "it closed more than the recent-closure days but no more than the mid-closure days before"
      value: K('win_mid') months
    - when: otherwise
      value: K('win_standard') months
    baseline:
      win: K('win_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: holiday_regular_rate
    effect: method
    decides: rate
    bindings:
    - g_w
    - h_w
    - lat_g
    - rate
    ladder:
    - when: window hours at least the minimum hours
      method: window earnings divided by window hours, rounded to the cent
    - when: "window hours above zero but below the minimum, and the latest certified week reports hours"
      method: latest certified week's earnings divided by its hours, rounded to the cent
    - when: otherwise
      method: high-quarter wages divided by the quarter hours, rounded to the cent
    baseline:
      rate: RND(F('high_quarter_wages') / K('quarter_hours'), 2)
    evidence:
    - history
    cross_difficulty: null
  - id: holiday_hours_credited
    effect: parameter
    decides: hol_hours
    bindings:
    - lat_h
    - hol_hours
    ladder:
    - when: latest certified week reported fewer than the short-week hours
      value: K('hol_short')
    - when: at least the short-week hours but fewer than the mid-week hours
      value: K('hol_mid')
    - when: otherwise
      value: K('hol_std')
    baseline:
      hol_hours: K('hol_std')
    evidence:
    - history
    cross_difficulty: null
  - id: holiday_pay_share
    effect: parameter
    decides: share
    bindings:
    - n_w
    - avg_h
    - share
    ladder:
    - when: average window hours per certified week below the low-average hours
      value: K('share_low')
    - when: at least the low-average hours but below the mid-average hours
      value: K('share_mid')
    - when: otherwise
      value: '1'
    baseline:
      share: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    params:
    - win_standard
    - quarter_hours
    - hol_std
    rule: "As the standard method, the history window is the last three calendar months and the regular hourly rate is the earlier claim's high-quarter wages divided by the quarter hours, rounded to the cent. As the standard method, the holiday hours are a standard day of the standard holiday hours and the holiday pay share is one."
  inputs:
    history:
    - table: claim_certifications
      aggregate: sum
      field: hours_worked
      within_months: 12
      filters: {}
    - table: claim_certifications
      aggregate: sum
      field: gross_earnings
      within_months: 12
      filters: {}
    cross_category: []
- id: claim_ext_waiting_week_value
  base_policy_refs:
  - claim_evt_waiting_week
  overwrite: []
  trigger: state_due
  subject:
  - claim_waiting_week_served
  computes: amount
  target_tool: record_waiting_week_428070c9
  params:
    share_family: 0.4
    share_single: 0.35
    recall_near_days: 240
    thr_recall_near: 36
    thr_recall_far: 34
    low_frac: 0.5
    mid_frac: 0.75
    low_rate: 0.5
    mid_rate: 0.75
    quarter_frac: 0.25
    three_quarters: 0.75
    integrity_open: 60.0
    integrity_window_months: 12
    integrity_repaid: 40.0
  rule: "A waiting-week entry records the first otherwise-payable week of a benefit year as served and states the value the week would have paid, which is never paid later; the week valued is the latest week certified on the claim at the time the entry is made. As the standard method, the waiting-week value is the weekly benefit amount plus the dependency allowance minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar and never below zero, and a week whose hours reach the program's full-time hours threshold does not serve and is not valued, nor is any week valued once the claim carries its waiting week count of entries. As the standard method, the earnings disregard for a waiting-week value is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and other pay is deducted in full for vacation or holiday pay, at the program's pension offset share for an employer-funded pension and at the program's claimant-contributed share for a claimant-contributed pension, each rounded to the cent, with severance pay not deducted. For a waiting-week value, the disregard share is the family share when dependents are on record and the week reports earnings. It is the single share when no dependent is on record and the week reports earnings. Any other waiting-week value uses the program's disregard share. For a waiting-week value, the hours base against which the low, mid and quarter fractions are measured is the near-recall hours base when the claim records a definite recall date no more than the near-recall days after the handling date. It is the far-recall hours base when that recall date is more than the near-recall days away. Any other waiting-week value measures those fractions against the program's full-time hours threshold. For a waiting-week value, when the week's hours are below the low fraction of that hours base the earnings deduction is the low rate times the earnings above the disregard, rounded to the cent. When they are at least the low fraction but below the mid fraction of the hours base it is the mid rate times those earnings, rounded to the cent. When they are at or above the mid fraction every dollar above the disregard is deducted. For a waiting-week value, when the week's earnings exceed the disregard and its hours are at least the quarter fraction of the hours base, the allowance counts in proportion to the unworked hours: the allowance times the hours base less the week's hours, divided by the hours base, rounded to the cent. When the earnings exceed the disregard and the hours are below the quarter fraction of the hours base, three quarters of the allowance count, rounded to the cent. When the earnings do not exceed the disregard the allowance counts in full. For a waiting-week value, the disregard is reduced by the open integrity amount when any overpayment of the claimant caused by misreported earnings and determined within the integrity window of months before the handling date still carries a balance due above zero. It is reduced by the repaid integrity amount when such overpayments determined within that window exist and every one of them carries no balance due. No reduction applies when no overpayment caused by misreported earnings was determined within that window. The integrity reduction is taken from the disregard before the earnings above it are measured, and both deductions are subtracted from the weekly benefit amount plus the counted allowance in one step before rounding down. The value of a waiting week is not fixed until the claim's dependency allowance no longer counts any dependent removed from the record."
  prerequisite:
  - problem: claim_ext_dependency_disallowance
    kind: value_input
    gate: da
    form: state
    condition: "The claim's dependency allowance is the redetermined allowance after the disallowance."
    resolved_by: record_dependency_disallowance_f94a20ca
    effect: "The dependency allowance counted in the waiting-week value drops to the redetermined allowance."
    policy_source: "The value of a waiting week is not fixed until the claim's dependency allowance no longer counts any dependent removed from the record."
  cross_category:
  - category: overpay
    as: history
    reads:
    - overpayments.balance_due
    - overpayments.cause
    - overpayments.determination_date
    note: "The integrity reduction reads an overpayment of the claimant caused by misreported earnings."
  compute:
  - wk: "LATEST('claim_certifications', 'week_ending_date', date_field='week_ending_date')"
  - wba: F('weekly_benefit_amount')
  - da: F('dependency_allowance')
  - gross: "LATEST('claim_certifications', 'gross_earnings', date_field='week_ending_date', week_ending_date=wk)"
  - hours: "LATEST('claim_certifications', 'hours_worked', date_field='week_ending_date', week_ending_date=wk)"
  - opay_type: "LATEST('claim_certifications', 'other_pay_type', date_field='week_ending_date', week_ending_date=wk)"
  - opay: "LATEST('claim_certifications', 'other_pay_amount', date_field='week_ending_date', week_ending_date=wk)"
  - served: COUNT('claim_ledger', event_type='claim_waiting_week_served')
  - wk_earn: SUM('claim_certifications', 'gross_earnings', week_ending_date=wk)
  - share: "K('share_family') if F('dependents_count') >= 1 and wk_earn > 0 else (K('share_single') if F('dependents_count') == 0 and wk_earn > 0 else P('earnings_disregard_pct_of_wba'))"
  - recall_days: DAYS(NOW, F('recall_date')) if F('recall_date') else -1
  - thr: "K('thr_recall_near') if recall_days >= 0 and recall_days <= K('recall_near_days') else (K('thr_recall_far') if recall_days > K('recall_near_days') else P('full_time_hours_threshold'))"
  - op_open: "XSUM('overpay', 'overpayments', 'balance_due', within_months=K('integrity_window_months'), date_field='determination_date', cause='earnings_misreported')"
  - op_count: "XCOUNT('overpay', 'overpayments', within_months=K('integrity_window_months'), date_field='determination_date', cause='earnings_misreported')"
  - integrity: "K('integrity_open') if op_open > 0 else (K('integrity_repaid') if op_count > 0 and op_open <= 0 else 0)"
  - disregard: MX(0, RND(share * wba, 2) - integrity)
  - excess: MX(0, gross - disregard)
  - earn_ded: "RND(excess * K('low_rate'), 2) if hours < thr * K('low_frac') else (RND(excess * K('mid_rate'), 2) if hours < thr * K('mid_frac') else excess)"
  - gross_q: "LATEST('claim_certifications', 'gross_earnings', date_field='week_ending_date', week_ending_date=wk)"
  - da_counted: "RND(da * (thr - hours) / thr, 2) if gross_q > disregard and hours >= thr * K('quarter_frac') else (RND(da * K('three_quarters'), 2) if gross_q > disregard and hours < thr * K('quarter_frac') else da)"
  - other_ded: "opay if opay_type == 'vacation_pay' or opay_type == 'holiday_pay' else (RND(opay * P('pension_offset_pct'), 2) if opay_type == 'pension_employer_funded' else (RND(opay * P('pension_offset_pct_claimant_contributed'), 2) if opay_type == 'pension_claimant_contributed' else 0))"
  - result: "0 if served >= P('waiting_week_count') or hours >= P('full_time_hours_threshold') else MX(0, int(wba + da_counted - earn_ded - other_ded))"
  compute_basis:
    wk: "A waiting-week entry records the first otherwise-payable week of a benefit year as served and states the value the week would have paid, which is never paid later; the week valued is the latest week certified on the claim at the time the entry is made."
    gross: "A waiting-week entry records the first otherwise-payable week of a benefit year as served and states the value the week would have paid, which is never paid later; the week valued is the latest week certified on the claim at the time the entry is made."
    hours: "A waiting-week entry records the first otherwise-payable week of a benefit year as served and states the value the week would have paid, which is never paid later; the week valued is the latest week certified on the claim at the time the entry is made."
    opay_type: "As the standard method, the earnings disregard for a waiting-week value is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and other pay is deducted in full for vacation or holiday pay, at the program's pension offset share for an employer-funded pension and at the program's claimant-contributed share for a claimant-contributed pension, each rounded to the cent, with severance pay not deducted."
    opay: "As the standard method, the earnings disregard for a waiting-week value is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and other pay is deducted in full for vacation or holiday pay, at the program's pension offset share for an employer-funded pension and at the program's claimant-contributed share for a claimant-contributed pension, each rounded to the cent, with severance pay not deducted."
    served: "As the standard method, the waiting-week value is the weekly benefit amount plus the dependency allowance minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar and never below zero, and a week whose hours reach the program's full-time hours threshold does not serve and is not valued, nor is any week valued once the claim carries its waiting week count of entries."
    wk_earn: "For a waiting-week value, the disregard share is the family share when dependents are on record and the week reports earnings."
    share: "For a waiting-week value, the disregard share is the family share when dependents are on record and the week reports earnings. It is the single share when no dependent is on record and the week reports earnings. Any other waiting-week value uses the program's disregard share."
    recall_days: "For a waiting-week value, the hours base against which the low, mid and quarter fractions are measured is the near-recall hours base when the claim records a definite recall date no more than the near-recall days after the handling date."
    thr: "For a waiting-week value, the hours base against which the low, mid and quarter fractions are measured is the near-recall hours base when the claim records a definite recall date no more than the near-recall days after the handling date. It is the far-recall hours base when that recall date is more than the near-recall days away. Any other waiting-week value measures those fractions against the program's full-time hours threshold."
    integrity: "For a waiting-week value, the disregard is reduced by the open integrity amount when any overpayment of the claimant caused by misreported earnings and determined within the integrity window of months before the handling date still carries a balance due above zero. It is reduced by the repaid integrity amount when such overpayments determined within that window exist and every one of them carries no balance due. No reduction applies when no overpayment caused by misreported earnings was determined within that window."
    disregard: "As the standard method, the earnings disregard for a waiting-week value is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and other pay is deducted in full for vacation or holiday pay, at the program's pension offset share for an employer-funded pension and at the program's claimant-contributed share for a claimant-contributed pension, each rounded to the cent, with severance pay not deducted. The integrity reduction is taken from the disregard before the earnings above it are measured, and both deductions are subtracted from the weekly benefit amount plus the counted allowance in one step before rounding down."
    excess: "As the standard method, the earnings disregard for a waiting-week value is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and other pay is deducted in full for vacation or holiday pay, at the program's pension offset share for an employer-funded pension and at the program's claimant-contributed share for a claimant-contributed pension, each rounded to the cent, with severance pay not deducted."
    earn_ded: "For a waiting-week value, when the week's hours are below the low fraction of that hours base the earnings deduction is the low rate times the earnings above the disregard, rounded to the cent. When they are at least the low fraction but below the mid fraction of the hours base it is the mid rate times those earnings, rounded to the cent. When they are at or above the mid fraction every dollar above the disregard is deducted."
    gross_q: "For a waiting-week value, when the week's earnings exceed the disregard and its hours are at least the quarter fraction of the hours base, the allowance counts in proportion to the unworked hours: the allowance times the hours base less the week's hours, divided by the hours base, rounded to the cent."
    da_counted: "For a waiting-week value, when the week's earnings exceed the disregard and its hours are at least the quarter fraction of the hours base, the allowance counts in proportion to the unworked hours: the allowance times the hours base less the week's hours, divided by the hours base, rounded to the cent. When the earnings exceed the disregard and the hours are below the quarter fraction of the hours base, three quarters of the allowance count, rounded to the cent. When the earnings do not exceed the disregard the allowance counts in full."
    other_ded: "As the standard method, the earnings disregard for a waiting-week value is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and other pay is deducted in full for vacation or holiday pay, at the program's pension offset share for an employer-funded pension and at the program's claimant-contributed share for a claimant-contributed pension, each rounded to the cent, with severance pay not deducted."
    result: "As the standard method, the waiting-week value is the weekly benefit amount plus the dependency allowance minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar and never below zero, and a week whose hours reach the program's full-time hours threshold does not serve and is not valued, nor is any week valued once the claim carries its waiting week count of entries. The integrity reduction is taken from the disregard before the earnings above it are measured, and both deductions are subtracted from the weekly benefit amount plus the counted allowance in one step before rounding down."
    op_open: "For a waiting-week value, the disregard is reduced by the open integrity amount when any overpayment of the claimant caused by misreported earnings and determined within the integrity window of months before the handling date still carries a balance due above zero."
    op_count: "It is reduced by the repaid integrity amount when such overpayments determined within that window exist and every one of them carries no balance due."
  factors:
  - id: waiting_disregard_share
    effect: parameter
    decides: share
    bindings:
    - wk_earn
    - share
    ladder:
    - when: dependents on record and the week reports earnings
      value: K('share_family')
    - when: no dependent on record and the week reports earnings
      value: K('share_single')
    - when: otherwise
      value: P('earnings_disregard_pct_of_wba')
    baseline:
      share: P('earnings_disregard_pct_of_wba')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: waiting_hours_base
    effect: parameter
    decides: thr
    bindings:
    - recall_days
    - thr
    ladder:
    - when: a definite recall date no more than the near-recall days after the handling date
      value: K('thr_recall_near')
    - when: a recall date more than the near-recall days away
      value: K('thr_recall_far')
    - when: otherwise
      value: P('full_time_hours_threshold')
    baseline:
      thr: P('full_time_hours_threshold')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: waiting_excess_rate
    effect: parameter
    decides: earn_ded
    bindings:
    - hours
    - earn_ded
    ladder:
    - when: hours below the low fraction of the hours base
      value: K('low_rate') times the earnings above the disregard
    - when: hours at least the low fraction but below the mid fraction
      value: K('mid_rate') times those earnings
    - when: otherwise
      value: 1 (every dollar above the disregard)
    baseline:
      earn_ded: excess
    evidence:
    - history
    cross_difficulty: null
  - id: waiting_allowance_counted
    effect: method
    decides: da_counted
    bindings:
    - gross_q
    - da_counted
    ladder:
    - when: "earnings above the disregard and hours at least the quarter fraction of the hours base"
      method: allowance times the unworked share of the hours base, rounded to the cent
    - when: earnings above the disregard and hours below the quarter fraction
      method: three quarters of the allowance, rounded to the cent
    - when: otherwise
      method: the allowance in full
    baseline:
      da_counted: da
    evidence:
    - history
    cross_difficulty: null
  - id: waiting_integrity_reduction
    effect: parameter
    decides: integrity
    bindings:
    - op_open
    - op_count
    - integrity
    ladder:
    - when: "an overpayment caused by misreported earnings, determined within the integrity window of months, still carries a balance due"
      value: K('integrity_open')
    - when: "such overpayments determined within the window exist and all carry no balance due"
      value: K('integrity_repaid')
    - when: otherwise
      value: '0'
    baseline:
      integrity: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: overpay
  baseline:
    params:
    - earnings_disregard_pct_of_wba
    - full_time_hours_threshold
    - waiting_week_count
    - pension_offset_pct
    - pension_offset_pct_claimant_contributed
    rule: "As the standard method, the waiting-week value is the weekly benefit amount plus the dependency allowance minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar and never below zero, and a week whose hours reach the program's full-time hours threshold does not serve and is not valued, nor is any week valued once the claim carries its waiting week count of entries. As the standard method, the earnings disregard for a waiting-week value is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and other pay is deducted in full for vacation or holiday pay, at the program's pension offset share for an employer-funded pension and at the program's claimant-contributed share for a claimant-contributed pension, each rounded to the cent, with severance pay not deducted."
  inputs:
    history:
    - table: claim_certifications
      aggregate: latest
      field: gross_earnings
      filters: {}
    - table: claim_ledger
      aggregate: count
      field: ledger_entry_id
      filters:
        event_type: claim_waiting_week_served
    - category: overpay
