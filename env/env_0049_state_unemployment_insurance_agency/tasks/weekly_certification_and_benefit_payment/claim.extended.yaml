    ladder:
    - when: "holiday pay reported and the claimant worked fewer than one day's hours (but some hours) in the week"
      method: holiday pay added to counted earnings, not deducted as other pay
    - when: holiday pay reported and at least one day's hours worked
      method: one half of the holiday pay deducted as other pay
    - when: otherwise
      method: "other pay deducted as the standard method states (holiday or vacation pay in full, pensions at the program shares)"
    baseline:
      counted_gross: gross
      hol_ded: "(opay if opay_type == 'holiday_pay' or opay_type == 'vacation_pay' else (RND(opay * P('pension_offset_pct'), 2) if opay_type == 'pension_employer_funded' else (RND(opay * P('pension_offset_pct_claimant_contributed'), 2) if opay_type == 'pension_claimant_contributed' else 0)))"
    evidence:
    - history
    cross_difficulty: null
  - id: weekly_integrity_reduction
    effect: parameter
    decides: integrity
    bindings:
    - op_open
    - op_count
    - integrity
    ladder:
    - when: "an overpayment caused by misreported earnings, determined within the integrity window of months, still carries a balance due"
      value: K('integrity_open')
    - when: "such overpayments determined within the window exist and all carry no balance due"
      value: K('integrity_repaid')
    - when: otherwise
      value: '0'
    baseline:
      integrity: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: overpay
  baseline:
    params:
    - earnings_disregard_pct_of_wba
    - full_time_hours_threshold
    - waiting_week_count
    - pension_offset_pct
    - pension_offset_pct_claimant_contributed
    rule: "As the standard method, the weekly payable amount is the weekly benefit amount plus the dependency allowance minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar, never below zero and never more than the remaining benefit balance; a week whose hours reach the program's full-time hours threshold pays nothing. As the standard method, the earnings disregard for a weekly payment is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and vacation or holiday pay reported for the week is deducted in full as other pay, an employer-funded pension at the program's pension offset share and a claimant-contributed pension at the program's claimant-contributed share, each rounded to the cent, with severance pay not deducted."
  inputs:
    history:
    - table: claim_certifications
      aggregate: latest
      field: gross_earnings
      filters: {}
    - table: claim_ledger
      aggregate: count
      field: ledger_entry_id
      filters:
        event_type: claim_waiting_week_served
    - category: overpay
      table: overpayments
      aggregate: sum
      field: balance_due
      within_months: 12
      filters:
        cause: earnings_misreported
    cross_category:
    - overpay
