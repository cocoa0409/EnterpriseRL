- id: claim_ext_payment_election_lead
  base_policy_refs:
  - claim_payment_method
  overwrite:
  - base_policy: claim_payment_method
    superseded_clause: "A change takes effect for payments issued on or after the payment method effective date, which is the change lead time after the change is recorded, counted in business days (Monday through Friday excluding state holidays)."
    replaced_by: "When the claimant elects how benefits are paid, the election records the new payment method and the payment method effective date, which falls the election lead time in business days (Monday through Friday excluding state holidays) after the day the election is recorded."
  trigger: on_request
  subject:
  - claim_payment_method_changed
  computes: lead_business_days
  target_tool: elect_payment_method_0e517696
  params:
    returned_window_months: 6
    prenote_returned_days: 5
    prenote_new_account_days: 2
    idv_recent_days: 30
    idv_theft_days: 3
    idv_other_days: 1
    change_recent_days: 30
    change_mid_days: 90
    change_recent_review: 3
    change_mid_review: 1
    paper_cycle: 5
    card_activation_days: 2
  rule: "When the claimant elects how benefits are paid, the election records the new payment method and the payment method effective date, which falls the election lead time in business days (Monday through Friday excluding state holidays) after the day the election is recorded. As the standard method, the election lead time is the program's payment method change lead time in business days, with no prenote, verification or review days added and no rounding to a payment cycle. Prenote days, verification days and review days are added to the program lead time first, and the cycle rounding is applied to that total last. A returned deposit is a cancellation with reason returned by the bank booked on the claim, a direct-deposit payment is a payment issued on the claim through direct deposit to checking or savings, and the latest payment is the payment with the latest issue date on the claim. For a payment election, prenote days are the returned-deposit prenote days when a deposit on the claim was returned by the bank within the returned-deposit window of months before the handling date. They are the new-account prenote days when no deposit was so returned and no direct-deposit payment has ever been issued on the claim. No prenote days apply when no deposit was so returned and a direct-deposit payment has been issued on the claim. For a payment election, verification days are the identity-theft verification days when the most recently verified Identity Theft Victim Re-Verification case on the claim was verified within the recent-verification days before the handling date. They are the other-verification days when no such re-verification was verified within those days and the most recently verified identity verification case on the claim, of whatever pathway, was verified within those days. No verification days apply when no identity verification case on the claim was verified within those days. For a payment election, when the latest payment on the claim was issued by paper check, the total lead time is rounded up to a whole multiple of the paper-check cycle in business days. When the latest payment was issued to the state benefit debit card, the card activation days are added to the total instead, with no rounding. When the latest payment was issued by direct deposit, or no payment has been issued, the total stands as counted. For a payment election, review days are the recent-change review days when the payment method effective date on the claim is no more than the recent-change days before the handling date. They are the mid-change review days when it is more than the recent-change days but no more than the mid-change days before the handling date. No review days apply when the method on the claim took effect earlier than that."
  prerequisite: []
  cross_category:
  - category: idv
    as: history
    reads:
    - idv_cases.verified_date
    - idv_cases.variant_name
    note: "The verification-days factor reads the latest verified identity verification case on the claim."
  compute:
  - returned: "COUNT('claim_ledger', within_months=K('returned_window_months'), date_field='entry_date', event_type='claim_payment_cancelled', cancel_reason='returned_by_bank')"
  - dd_paid: "COUNT('claim_ledger', event_type='claim_benefit_paid', payment_method='direct_deposit_checking') + COUNT('claim_ledger', event_type='claim_benefit_paid', payment_method='direct_deposit_savings')"
  - prenote: "K('prenote_returned_days') if returned > 0 else (K('prenote_new_account_days') if returned == 0 and dd_paid == 0 else 0)"
  - theft_verified: "XLATEST('idv', 'idv_cases', 'verified_date', date_field='verified_date', claim_id=HID, variant_name='Identity Theft Victim Re-Verification')"
  - other_verified: "XLATEST('idv', 'idv_cases', 'verified_date', date_field='verified_date', claim_id=HID)"
  - verif: "K('idv_theft_days') if theft_verified and DAYS(theft_verified, NOW) <= K('idv_recent_days') else (K('idv_other_days') if other_verified and DAYS(other_verified, NOW) <= K('idv_recent_days') else 0)"
  - change_age: DAYS(F('payment_method_effective_date'), NOW)
  - review: "K('change_recent_review') if change_age <= K('change_recent_days') else (K('change_mid_review') if change_age <= K('change_mid_days') else 0)"
  - total: P('payment_method_change_lead_business_days') + prenote + verif + review
  - last_method: "LATEST('claim_ledger', 'payment_method', date_field='entry_date', event_type='claim_benefit_paid')"
  - result_cycle: "int((total + K('paper_cycle') - 1) / K('paper_cycle')) * K('paper_cycle') if last_method == 'paper_check' else (total + K('card_activation_days') if last_method == 'debit_card' else total)"
  - result: result_cycle
  compute_basis:
    returned: "For a payment election, prenote days are the returned-deposit prenote days when a deposit on the claim was returned by the bank within the returned-deposit window of months before the handling date. A returned deposit is a cancellation with reason returned by the bank booked on the claim, a direct-deposit payment is a payment issued on the claim through direct deposit to checking or savings, and the latest payment is the payment with the latest issue date on the claim."
    dd_paid: "They are the new-account prenote days when no deposit was so returned and no direct-deposit payment has ever been issued on the claim. A returned deposit is a cancellation with reason returned by the bank booked on the claim, a direct-deposit payment is a payment issued on the claim through direct deposit to checking or savings, and the latest payment is the payment with the latest issue date on the claim."
    prenote: "For a payment election, prenote days are the returned-deposit prenote days when a deposit on the claim was returned by the bank within the returned-deposit window of months before the handling date. They are the new-account prenote days when no deposit was so returned and no direct-deposit payment has ever been issued on the claim. No prenote days apply when no deposit was so returned and a direct-deposit payment has been issued on the claim."
    theft_verified: "For a payment election, verification days are the identity-theft verification days when the most recently verified Identity Theft Victim Re-Verification case on the claim was verified within the recent-verification days before the handling date."
    other_verified: "They are the other-verification days when no such re-verification was verified within those days and the most recently verified identity verification case on the claim, of whatever pathway, was verified within those days."
    verif: "For a payment election, verification days are the identity-theft verification days when the most recently verified Identity Theft Victim Re-Verification case on the claim was verified within the recent-verification days before the handling date. They are the other-verification days when no such re-verification was verified within those days and the most recently verified identity verification case on the claim, of whatever pathway, was verified within those days. No verification days apply when no identity verification case on the claim was verified within those days."
    change_age: "For a payment election, review days are the recent-change review days when the payment method effective date on the claim is no more than the recent-change days before the handling date."
    review: "For a payment election, review days are the recent-change review days when the payment method effective date on the claim is no more than the recent-change days before the handling date. They are the mid-change review days when it is more than the recent-change days but no more than the mid-change days before the handling date. No review days apply when the method on the claim took effect earlier than that."
    total: "As the standard method, the election lead time is the program's payment method change lead time in business days, with no prenote, verification or review days added and no rounding to a payment cycle. Prenote days, verification days and review days are added to the program lead time first, and the cycle rounding is applied to that total last."
    last_method: "A returned deposit is a cancellation with reason returned by the bank booked on the claim, a direct-deposit payment is a payment issued on the claim through direct deposit to checking or savings, and the latest payment is the payment with the latest issue date on the claim."
    result_cycle: "For a payment election, when the latest payment on the claim was issued by paper check, the total lead time is rounded up to a whole multiple of the paper-check cycle in business days. When the latest payment was issued to the state benefit debit card, the card activation days are added to the total instead, with no rounding. When the latest payment was issued by direct deposit, or no payment has been issued, the total stands as counted. Prenote days, verification days and review days are added to the program lead time first, and the cycle rounding is applied to that total last."
  factors:
  - id: prenote_days
    effect: parameter
    decides: prenote
    bindings:
    - returned
    - dd_paid
    - prenote
    ladder:
    - when: a deposit on the claim returned by the bank within the returned-deposit window
      value: K('prenote_returned_days')
    - when: no deposit so returned and no direct-deposit payment ever issued on the claim
      value: K('prenote_new_account_days')
    - when: otherwise
      value: '0'
    baseline:
      prenote: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: verification_days
    effect: parameter
    decides: verif
    bindings:
    - theft_verified
    - other_verified
    - verif
    ladder:
    - when: "the most recently verified Identity Theft Victim Re-Verification case on the claim verified within the recent-verification days"
      value: K('idv_theft_days')
    - when: "no such re-verification verified within those days and the most recently verified case on the claim, of whatever pathway, verified within those days"
      value: K('idv_other_days')
    - when: otherwise
      value: '0'
    baseline:
      verif: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: idv
  - id: payment_cycle_rounding
    effect: method
    decides: result_cycle
    bindings:
    - last_method
    - result_cycle
    ladder:
    - when: the latest payment on the claim issued by paper check
      method: round the total up to a whole multiple of the paper-check cycle
    - when: the latest payment issued to the state benefit debit card
      method: add the card activation days to the total, without rounding
    - when: otherwise
      method: the total stands as counted
    baseline:
      result_cycle: total
    evidence:
    - history
    cross_difficulty: null
  - id: change_review_days
    effect: parameter
    decides: review
    bindings:
    - change_age
    - review
    ladder:
    - when: "the payment method on the claim took effect no more than the recent-change days before"
      value: K('change_recent_review')
    - when: more than the recent-change days but no more than the mid-change days before
      value: K('change_mid_review')
    - when: otherwise
      value: '0'
    baseline:
      review: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    params:
    - payment_method_change_lead_business_days
    rule: "As the standard method, the election lead time is the program's payment method change lead time in business days, with no prenote, verification or review days added and no rounding to a payment cycle."
  inputs:
    history:
    - table: claim_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 6
      filters:
        event_type: claim_payment_cancelled
        cancel_reason: returned_by_bank
    - table: claim_ledger
      aggregate: latest
      field: payment_method
      filters:
        event_type: claim_benefit_paid
    - category: idv
      table: idv_cases
      aggregate: latest
      field: verified_date
      filters: {}
    cross_category:
