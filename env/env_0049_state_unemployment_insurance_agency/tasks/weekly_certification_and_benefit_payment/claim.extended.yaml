# Extended product charter for difficulty weekly_certification_and_benefit_payment (category claim).
category: claim
display_name: Unemployment Benefit Claims
binding:
  holding_table: claims
  event_tables:
  - claim_certifications
  - claim_ledger
  - claim_tax_statements
  intake_tables:
  - claim_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    remaining_balance: remaining_benefit_balance
lifecycle:
  states:
  - filed
  - active
  - on_hold
  - inactive
  - exhausted
  - ineligible
  - withdrawn
  - closed
  transitions:
  - from: filed
    to: active
    by: system
    means: "The first monetary determination finds the claim monetarily eligible and the claim starts accepting weekly certifications."
  - from: filed
    to: ineligible
    by: system
    means: "The first monetary determination finds the base-period wages insufficient for the program."
  - from: active
    to: on_hold
    by: agent
    means: An unresolved eligibility
    identity or fraud issue stops payment while the claimant keeps certifying.: null
  - from: on_hold
    to: active
    by: agent
    means: "The issue behind the hold is resolved on the record and payment of payable weeks resumes."
  - from: active
    to: inactive
    by: system
    means: "The claimant stopped certifying for the inactivity threshold and the claim is set aside until reopened."
  - from: inactive
    to: active
    by: agent
    means: "The claimant reopens the claim (or files an additional claim after intervening work) within the benefit year."
  - from: active
    to: exhausted
    by: system
    means: A payment brought the remaining benefit balance to zero.
  - from: active
    to: closed
    by: system
    means: The benefit year end date passed while the claim was active.
  - from: on_hold
    to: closed
    by: system
    means: The benefit year end date passed while the claim was on hold.
  - from: inactive
    to: closed
    by: system
    means: The benefit year end date passed while the claim was inactive.
  - from: exhausted
    to: closed
    by: system
    means: The benefit year end date passed on an exhausted claim.
  - from: ineligible
    to: closed
    by: system
    means: The benefit year end date passed on a monetarily ineligible claim.
  - from: filed
    to: withdrawn
    by: user
    means: The claimant confirms withdrawal of a claim before any determination.
  - from: active
    to: withdrawn
    by: user
    means: The claimant confirms withdrawal of a claim on which no benefits remain paid.
  - from: inactive
    to: withdrawn
    by: user
    means: "The claimant confirms withdrawal of an inactive claim on which no benefits remain paid."
accounts:
- key: remaining_benefit_balance
  unit: USD
  meaning: "Benefits still payable on the claim in its benefit year, credited by monetary determinations and debited by each benefit payment."
parameter_schema:
  min_high_quarter_wages: "Minimum wages (USD) in the highest-paid base-period quarter for monetary eligibility; 0.00 means the program has no wage test"
  bpw_to_hqw_ratio_min: "Minimum ratio of total base-period wages to high-quarter wages (decimal multiple); 0 means not applied"
  alternate_base_period_available: "Whether the alternate base period (the last four completed calendar quarters) is tested when the standard base period fails (boolean)"
  wba_hqw_divisor: "Divisor applied to high-quarter wages to compute the weekly benefit amount before the floor and ceiling (number)"
  min_weekly_benefit: Floor of the weekly benefit amount (USD per week)
  max_weekly_benefit: "Ceiling of the weekly benefit amount before any dependency allowance (USD per week)"
  dependency_allowance_per_dependent: "Weekly dependency allowance added per eligible dependent (USD per week per dependent)"
  dependency_allowance_max_dependents: Maximum number of dependents for which an allowance is paid (count)
  max_duration_weeks: "Maximum number of weeks of the full weekly amount payable in the benefit year or eligibility period (weeks)"
  mba_bpw_fraction: "Fraction of total base-period wages that caps the maximum benefit amount (decimal); 0 means the cap is not used by this program"
  eb_regular_mba_fraction: "Fraction of the parent regular claim's maximum benefit amount that caps Extended Benefits entitlement (decimal); 0 means not an Extended Benefits claim"
  tra_prior_benefit_offset: "Whether regular and Extended Benefits entitlement already payable on the parent claim is deducted from the program's entitlement (boolean)"
  waiting_week_count: "Number of otherwise-payable weeks at the start of the benefit year served as unpaid waiting weeks (weeks)"
  earnings_disregard_pct_of_wba: "Share of the weekly benefit amount that weekly gross earnings may reach before any reduction (decimal)"
  full_time_hours_threshold: "Hours worked in a week at or above which the claimant is not unemployed for that week (hours)"
  benefit_rounding_rule: "Rounding applied to the weekly benefit amount, maximum benefit amount and each weekly payable amount (enum: down_to_whole_dollar)"
  work_search_contacts_per_week: "Employer contacts the claimant must report for each certified week unless a waiver applies (count per week)"
  eb_systematic_work_search_required: "Whether every reported contact must be a verifiable application with an employer that has an opening (Extended Benefits systematic and sustained search) (boolean)"
  recall_work_search_waiver_weeks: "Weeks after the claim effective date during which work search is waived for a claimant with a recorded definite recall date (weeks); 0 means no recall waiver"
  approved_training_waives_work_search: "Whether enrolment in agency-approved training waives the weekly work-search requirement (boolean)"
  certification_window_days: "Calendar days after the week ending date through which a weekly certification is timely (days)"
  cert_opening_day_offset: "Calendar days after the week ending date on which certification for that week opens (days)"
  late_cert_good_cause_max_days: "Calendar days after the week ending date through which a late certification may still be accepted with documented good cause (days)"
  backdate_max_weeks: "Maximum weeks by which the claim effective date may be moved earlier with good cause (weeks); 0 means backdating is not available"
  backdate_request_window_days: "Calendar days after the requested earlier effective date within which the backdating request must be lodged (days); 0 means not available"
  filing_deadline_days: "Calendar days after the disaster declaration announcement within which an application must be filed (days); 0 means the program has no application deadline"
  dua_late_filing_limit_weeks: "Weeks after the disaster declaration announcement up to which a late application is accepted with good cause (weeks); 0 means not applicable"
  proof_of_employment_days: "Calendar days after filing within which proof of employment or self-employment must be submitted (days); 0 means no separate proof deadline"
  inactivity_weeks_to_inactivate: "Consecutive uncertified weeks after which an active claim becomes inactive (weeks)"
  benefit_year_length_weeks: "Length of the benefit year or eligibility period measured from the claim effective date (weeks)"
  employer_charge_share: "Share of each weekly payment charged to state-registered base-period employers (decimal)"
  funding_source: Fund that finances the program's payments (enum)
  wage_verification_source: Record that establishes the program's base-period wages or employment (enum)
  ucx_min_continuous_active_days: "Minimum continuous days of federal active military service ending in an honorable separation (days); 0 means not applicable"
  eb_min_weeks_employment: "Minimum weeks of full-time employment in the base period required for Extended Benefits (weeks); 0 means not applicable"
  tra_training_enrollment_deadline_weeks: "Weeks after the later of the qualifying separation or the petition certification by which the claimant must be enrolled in approved training (weeks); 0 means not applicable"
  tra_additional_training_weeks: "Additional weeks of allowances payable while in approved training after basic entitlement is exhausted (weeks); 0 means not applicable"
  dua_disaster_assistance_period_weeks: "Length of the disaster assistance period starting the week after the disaster began (weeks); 0 means not applicable"
  vacation_pay_deductible: "Whether vacation pay allocated to a certified week is deducted from that week's benefit (boolean)"
  holiday_pay_deductible: "Whether holiday pay allocated to a certified week is deducted from that week's benefit (boolean)"
  severance_pay_deductible: Whether severance or dismissal pay is deducted from benefits (boolean)
  pension_offset_pct: "Share of the weekly-prorated base-period-employer pension, wholly employer financed, deducted from the weekly benefit (decimal)"
  pension_offset_pct_claimant_contributed: "Share of the weekly-prorated pension deducted when the claimant contributed to the plan (decimal)"
  lost_check_reissue_wait_business_days: "Business days after the check issue date before a reported lost or stolen paper check may be stopped and reissued (business days)"
  returned_deposit_reissue_method: "Method used to reissue a payment returned by the receiving bank (enum: paper_check)"
  payment_method_change_lead_business_days: "Business days after the change is recorded before payments are issued through the new payment method (business days)"
  debit_card_free_replacements_per_benefit_year: Replacement debit cards issued without a fee per benefit year (count)
  default_payment_method: "Payment method assigned when the claimant makes no direct deposit election at filing (enum: debit_card)"
  identity_verification_required: "Whether the claim requires its own identity verification case before payment (boolean)"
  reopen_separation_review_required: "Whether a reopened claim reporting a new separation of the listed review kinds is placed on hold for a separation determination (boolean)"
  monetary_redetermination_request_days: "Calendar days after the monetary determination date within which the claimant may submit missing-wage proof for a monetary redetermination (days)"
  tax_statement_issue_deadline: "Calendar date by which the annual Form 1099-G for the prior tax year is issued (text, month and day)"
  tax_statement_correction_lookback_years: "Number of prior tax years for which a Form 1099-G correction may be requested (years)"
  reissued_payment_charge_neutral: "Whether a reissued replacement payment is excluded from a second employer charge (boolean)"
