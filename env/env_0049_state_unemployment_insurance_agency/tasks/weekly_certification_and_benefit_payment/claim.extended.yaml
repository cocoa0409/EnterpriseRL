      anchor_event: the requested effective date
      anchor_source: claim_requests.requested_effective_date
      relation: not_after
      duration_source: variants.backdate_request_window_days
      unit: calendar_days
      counting_rule: "The window is counted in calendar days starting the day after the requested effective date, and a request on the last day is in time."
      boundary: inclusive
  params:
    per_tier:
      Regular State Unemployment Insurance:
        backdate_max_weeks: =backdate_max_weeks
        backdate_request_window_days: =backdate_request_window_days
      Unemployment Compensation for Federal Employees (UCFE):
        backdate_max_weeks: =backdate_max_weeks
        backdate_request_window_days: =backdate_request_window_days
      Unemployment Compensation for Ex-Servicemembers (UCX):
        backdate_max_weeks: =backdate_max_weeks
        backdate_request_window_days: =backdate_request_window_days
      Combined Wage Claim (CWC):
        backdate_max_weeks: =backdate_max_weeks
        backdate_request_window_days: =backdate_request_window_days
      Extended Benefits (EB):
        backdate_max_weeks: =backdate_max_weeks
        backdate_request_window_days: =backdate_request_window_days
      Trade Readjustment Allowances (TRA):
        backdate_max_weeks: =backdate_max_weeks
