- id: claim_ext_regular_weekly_payable
  base_policy_refs:
  - claim_agg_program_sequence
  - claim_evt_payable_amount
  - claim_evt_waiting_week
  overwrite:
  - base_policy: claim_evt_payable_amount
    superseded_clause: "Otherwise the earnings deduction is the part of gross earnings above the earnings disregard, which is the disregard share of the weekly benefit amount."
    replaced_by: "For a weekly payment, when the week's hours are below the low fraction of that threshold the earnings deduction is the low rate times the counted earnings above the disregard, rounded to the cent."
  - base_policy: claim_evt_payable_amount
    superseded_clause: "A week in which hours worked reach the full-time hours threshold is not a week of unemployment and nothing is paid."
    replaced_by: "For a weekly payment, the full-time hours threshold, which is both the hours at or above which the week pays nothing and the hours against which the low, mid and part-week fractions are measured, is the new federal threshold when the separation recorded on the claim is a federal separation and the claim is fewer than the new-claim days old."
  - base_policy: claim_evt_payable_amount
    superseded_clause: "The other-pay deduction is vacation and holiday pay allocated to the week where deductible, plus the weekly-prorated base-period-employer pension times the pension offset share, using the claimant-contributed share where the claimant paid into the plan; severance pay is not deducted."
    replaced_by: "For a weekly payment, holiday pay reported for a week in which the claimant worked fewer than one day's hours is added to the week's earnings as counted earnings and is not deducted as other pay."
  - base_policy: claim_evt_payable_amount
    superseded_clause: "The payable amount is the weekly benefit amount plus dependency allowance minus both deductions, rounded down to the whole dollar, never below zero and never more than the remaining benefit balance; a payable amount of zero records no payment."
    replaced_by: "For a weekly payment, when the counted earnings exceed the disregard and the week's hours are at least the part-week fraction of the threshold, one half of the dependency allowance is paid, rounded to the cent."
  trigger: on_request
  subject:
  - claim_benefit_paid
  computes: amount
  target_tool: issue_weekly_payment_6cd10c49
  params:
    recall_near_days: 240
    share_recall_near: 0.4
    share_recall_far: 0.35
    new_claim_days: 182
    thr_new_federal: 36
    thr_new_other: 34
    low_frac: 0.5
    mid_frac: 0.75
    low_rate: 0.5
    mid_rate: 0.75
    part_frac: 0.2
    half: 0.5
    three_quarters: 0.75
    one_day_hours: 8
    integrity_open: 60.0
    integrity_window_months: 12
    integrity_repaid: 40.0
  rule: "A weekly payment is issued for the latest certified week of the claim once that week is otherwise payable, through the payment method in force on the payment date, and it is debited from the remaining benefit balance. As the standard method, the weekly payable amount is the weekly benefit amount plus the dependency allowance minus the earnings deduction and minus the other-pay deduction, rounded down to the whole dollar, never below zero and never more than the remaining benefit balance; a week whose hours reach the program's full-time hours threshold pays nothing. As the standard method, the earnings disregard for a weekly payment is the program's disregard share of the weekly benefit amount rounded to the cent, every dollar of earnings above it is deducted, the dependency allowance counts in full, and vacation or holiday pay reported for the week is deducted in full as other pay, an employer-funded pension at the program's pension offset share and a claimant-contributed pension at the program's claimant-contributed share, each rounded to the cent, with severance pay not deducted. For a weekly payment, the disregard share is the near-recall share when the claim records a definite recall date no more than the near-recall days after the handling date and the week reports earnings. It is the far-recall share when that recall date is more than the near-recall days away and the week reports earnings. Any other weekly payment uses the program's disregard share. For a weekly payment, the full-time hours threshold, which is both the hours at or above which the week pays nothing and the hours against which the low, mid and part-week fractions are measured, is the new federal threshold when the separation recorded on the claim is a federal separation and the claim is fewer than the new-claim days old. It is the new-claim threshold when the separation is of any other kind and the claim is fewer than the new-claim days old. Any other weekly payment uses the program's full-time hours threshold. For a weekly payment, when the week's hours are below the low fraction of that threshold the earnings deduction is the low rate times the counted earnings above the disregard, rounded to the cent. When they are at least the low fraction but below the mid fraction it is the mid rate times those earnings, rounded to the cent. When they are at or above the mid fraction every dollar above the disregard is deducted. For a weekly payment, when the counted earnings exceed the disregard and the week's hours are at least the part-week fraction of the threshold, one half of the dependency allowance is paid, rounded to the cent. When the counted earnings exceed the disregard and the hours are below the part-week fraction, three quarters of the allowance are paid, rounded to the cent. When the counted earnings do not exceed the disregard the allowance is paid in full. For a weekly payment, holiday pay reported for a week in which the claimant worked fewer than one day's hours is added to the week's earnings as counted earnings and is not deducted as other pay. Holiday pay reported for a week in which the claimant worked at least one day's hours is deducted at one half as other pay, rounded to the cent. Holiday pay reported for a week with no hours worked, and any other pay, is deducted as the standard method states. For a weekly payment, the disregard is reduced by the open integrity amount when any overpayment of the claimant caused by misreported earnings and determined within the integrity window of months before the handling date still carries a balance due above zero. It is reduced by the repaid integrity amount when such overpayments determined within that window exist and every one of them carries no balance due. No reduction applies when no overpayment caused by misreported earnings was determined within that window. The integrity reduction is taken from the disregard first, counted earnings are measured against the reduced disregard, and both deductions are subtracted from the weekly benefit amount plus the paid allowance in one step before\
    \ rounding down. A weekly payment is not fixed until the claim carries a waiting-week entry for the first otherwise-payable week of its benefit year. A weekly payment is fixed only after the claim's dependency allowance no longer counts any dependent removed from the record. A weekly payment is issued only after the week being paid carries the claimant's weekly certification."
  prerequisite:
  - problem: claim_ext_waiting_week_value
    kind: value_input
    gate: served
    form: state
    condition: "The claim ledger carries a waiting-week entry for the first otherwise-payable week of the benefit year."
    resolved_by: record_waiting_week_428070c9
    effect: "The waiting-week count read by the weekly payment rises to the program's waiting week count, so the payable amount moves from zero to the computed amount."
    policy_source: "A weekly payment is not fixed until the claim carries a waiting-week entry for the first otherwise-payable week of its benefit year."
  - problem: claim_ext_dependency_disallowance
    kind: value_input
    gate: da
    form: state
    condition: "The claim's dependency allowance no longer counts a dependent removed from the record."
    resolved_by: record_dependency_disallowance_f94a20ca
    effect: "The dependency allowance the weekly payment reads drops from the allowance for the removed dependent to the redetermined allowance."
    policy_source: "A weekly payment is fixed only after the claim's dependency allowance no longer counts any dependent removed from the record."
  - problem: claim_ext_holiday_pay_report
    kind: value_input
    gate: opay
    form: state
    condition: The week being paid carries a weekly certification on the claim.
    resolved_by: certify_week_by_phone_ea18d1f2
    effect: "The week's earnings, hours and holiday pay read by the weekly payment come from the new certification."
    policy_source: "A weekly payment is issued only after the week being paid carries the claimant's weekly certification."
  cross_category:
  - category: overpay
    as: history
    reads:
    - overpayments.balance_due
    - overpayments.cause
    - overpayments.determination_date
    note: "The integrity reduction reads an overpayment of the claimant caused by misreported earnings."
  compute:
  - wk: "LATEST('claim_certifications', 'week_ending_date', date_field='week_ending_date')"
  - wba: F('weekly_benefit_amount')
  - da: F('dependency_allowance')
  - gross: "LATEST('claim_certifications', 'gross_earnings', date_field='week_ending_date', week_ending_date=wk)"
  - hours: "LATEST('claim_certifications', 'hours_worked', date_field='week_ending_date', week_ending_date=wk)"
  - opay_type: "LATEST('claim_certifications', 'other_pay_type', date_field='week_ending_date', week_ending_date=wk)"
  - opay: "LATEST('claim_certifications', 'other_pay_amount', date_field='week_ending_date', week_ending_date=wk)"
  - served: COUNT('claim_ledger', event_type='claim_waiting_week_served')
  - recall_days: DAYS(NOW, F('recall_date')) if F('recall_date') else -1
  - share: "K('share_recall_near') if recall_days >= 0 and recall_days <= K('recall_near_days') and gross > 0 else (K('share_recall_far') if recall_days > K('recall_near_days') and gross > 0 else P('earnings_disregard_pct_of_wba'))"
  - claim_age: DAYS(F('effective_date'), NOW)
  - thr: "K('thr_new_federal') if F('separation_reason') == 'federal_separation' and claim_age < K('new_claim_days') else (K('thr_new_other') if F('separation_reason') != 'federal_separation' and claim_age < K('new_claim_days') else P('full_time_hours_threshold'))"
  - op_open: "XSUM('overpay', 'overpayments', 'balance_due', within_months=K('integrity_window_months'), date_field='determination_date', cause='earnings_misreported')"
  - op_count: "XCOUNT('overpay', 'overpayments', within_months=K('integrity_window_months'), date_field='determination_date', cause='earnings_misreported')"
  - integrity: "K('integrity_open') if op_open > 0 else (K('integrity_repaid') if op_count > 0 and op_open <= 0 else 0)"
  - disregard: MX(0, RND(share * wba, 2) - integrity)
  - hol_hours_check: "LATEST('claim_certifications', 'hours_worked', date_field='week_ending_date', week_ending_date=wk)"
  - counted_gross: "gross + opay if opay_type == 'holiday_pay' and hol_hours_check > 0 and hol_hours_check < K('one_day_hours') else gross"
  - hol_ded: "0 if opay_type == 'holiday_pay' and hol_hours_check > 0 and hol_hours_check < K('one_day_hours') else (RND(opay * K('half'), 2) if opay_type == 'holiday_pay' and hol_hours_check >= K('one_day_hours') else (opay if opay_type == 'holiday_pay' or opay_type == 'vacation_pay' else (RND(opay * P('pension_offset_pct'), 2) if opay_type == 'pension_employer_funded' else (RND(opay * P('pension_offset_pct_claimant_contributed'), 2) if opay_type == 'pension_claimant_contributed' else 0))))"
  - excess: MX(0, counted_gross - disregard)
  - earn_ded: "RND(excess * K('low_rate'), 2) if hours < thr * K('low_frac') else (RND(excess * K('mid_rate'), 2) if hours < thr * K('mid_frac') else excess)"
  - hours_q: "LATEST('claim_certifications', 'hours_worked', date_field='week_ending_date', week_ending_date=wk)"
  - da_paid: "RND(da * K('half'), 2) if counted_gross > disregard and hours_q >= thr * K('part_frac') else (RND(da * K('three_quarters'), 2) if counted_gross > disregard and hours_q < thr * K('part_frac') else da)"
  - result: "0 if served < P('waiting_week_count') or hours >= thr else MN(F('remaining_balance'), MX(0, int(wba + da_paid - earn_ded - hol_ded)))"
  compute_basis:
