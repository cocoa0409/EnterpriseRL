    rule: "The redetermined dependency allowance is the per-dependent amount times the dependents on record, counting no more than the program's maximum number of dependents. As the standard method, the per-dependent amount is the program's dependency allowance per dependent, the allowance has no ceiling, and the allowance increase is the redetermined dependency allowance minus the dependency allowance on the claim. As the standard method, the credit for a dependency redetermination is the program's maximum duration weeks times the allowance increase, never more than the base-period-wage fraction times the base-period wages minus the maximum benefit amount already on the claim, rounded down to the whole dollar and never below zero."
