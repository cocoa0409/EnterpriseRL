    tax_statement_correction_lookback_years: =tax_statement_correction_lookback_years
  measures:
  - claim_msr_benefits_paid_in_tax_year
extended_policies:
- id: claim_ext_dependency_redetermination
  base_policy_refs:
  - claim_monetary_eligibility
  overwrite:
  - base_policy: claim_monetary_eligibility
    superseded_clause: "The maximum benefit amount is the lesser of the maximum duration weeks times the weekly benefit amount plus dependency allowance and the base-period-wage fraction times base-period wages, rounded down to the whole dollar."
    replaced_by: "For a dependency redetermination, when at least the late-claim number of weekly payments has been issued on the claim, the credited weeks are the remaining benefit balance divided by the weekly benefit amount plus the dependency allowance on the claim, rounded up to the whole week."
  - base_policy: claim_monetary_eligibility
    superseded_clause: "The dependency allowance is the per-dependent amount times the number of dependents on record, counting no more than the maximum number of dependents."
    replaced_by: "For a dependency redetermination, the per-dependent amount is the long-claim family amount when two or more dependents are on record and the claim effective date is at least the long-claim days before the handling date."
  trigger: state_due
  subject:
  - claim_entitlement_credited
  computes: amount
  target_tool: record_dependency_redetermination_c7b3c182
  params:
    per_dep_long: 18.0
    per_dep_short: 16.0
    long_claim_days: 182
    late_weeks: 13
    mid_weeks: 1
    mid_weeks_share: 0.75
    cent: 0.01
    ceiling_old_days: 90
    ceiling_mid_days: 21
    ceiling_old_share: 0.075
    ceiling_mid_share: 0.08
    steady_ratio: 3.0
    frac_steady_standard: 0.36
    frac_steady_alternate: 0.35
  rule: "A dependency redetermination is issued on a claim whose dependents on record exceed the dependents its current dependency allowance was set for, and it credits the resulting increase in the maximum benefit amount to the remaining benefit balance. The redetermined dependency allowance is the per-dependent amount times the dependents on record, counting no more than the program's maximum number of dependents. As the standard method, the per-dependent amount is the program's dependency allowance per dependent, the allowance has no ceiling, and the allowance increase is the redetermined dependency allowance minus the dependency allowance on the claim. As the standard method, the credit for a dependency redetermination is the program's maximum duration weeks times the allowance increase, never more than the base-period-wage fraction times the base-period wages minus the maximum benefit amount already on the claim, rounded down to the whole dollar and never below zero. The weekly payments counted are the weekly payments issued on the claim, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and the age of the claim is the calendar days from the claim effective date to the handling date. For a dependency redetermination, the per-dependent amount is the long-claim family amount when two or more dependents are on record and the claim effective date is at least the long-claim days before the handling date. It is the short-claim family amount when two or more dependents are on record and the claim effective date is fewer than the long-claim days before the handling date. Any other dependency redetermination uses the program's per-dependent amount. For a dependency redetermination, when at least the late-claim number of weekly payments has been issued on the claim, the credited weeks are the remaining benefit balance divided by the weekly benefit amount plus the dependency allowance on the claim, rounded up to the whole week. When at least one but fewer than the late-claim number of weekly payments has been issued, the credited weeks are the mid-claim share of the maximum duration weeks, rounded to the whole week. When no weekly payment has been issued, the credited weeks are the maximum duration weeks. For a dependency redetermination, the redetermined dependency allowance is capped at the late-addition share of the weekly benefit amount, rounded to the cent, when the latest monetary determination is more than the late-addition days old. It is capped at the mid-addition share of the weekly benefit amount, rounded to the cent, when that determination is more than the redetermination window days but no more than the late-addition days old. No ceiling applies when the determination is no more than the redetermination window days old. For a dependency redetermination, the base-period-wage fraction is the steady-earner standard fraction when the standard base period was used, base-period wages are at least the steady-earner ratio times high-quarter wages, and the entitlement credited on the claim already reaches the program's base-period-wage fraction times base-period wages, rounded down to the whole dollar. It is the steady-earner alternate fraction when the alternate base period was used, base-period wages are at least that ratio times high-quarter wages, and the entitlement credited on the claim already reaches that wage-capped amount. Any other dependency redetermination uses the program's base-period-wage fraction. The ceiling is applied to the redetermined allowance before the allowance on the claim is subtracted, and the credited weeks multiply that increase before the comparison with the wage cap."
  prerequisite: []
  cross_category: []
  compute:
  - deps: F('dependents_count')
  - da_old: F('dependency_allowance')
  - mba_old: F('max_benefit_amount')
  - wba: F('weekly_benefit_amount')
  - claim_age: DAYS(F('effective_date'), NOW)
  - per_dep: "K('per_dep_long') if deps >= 2 and claim_age >= K('long_claim_days') else (K('per_dep_short') if deps >= 2 and claim_age < K('long_claim_days') else P('dependency_allowance_per_dependent'))"
  - counted: MN(deps, P('dependency_allowance_max_dependents'))
  - det_age: DAYS(F('monetary_determination_date'), NOW)
  - da_new: "MN(RND(per_dep * counted, 2), RND(wba * K('ceiling_old_share'), 2)) if det_age > K('ceiling_old_days') else (MN(RND(per_dep * counted, 2), RND(wba * K('ceiling_mid_share'), 2)) if det_age > K('ceiling_mid_days') else RND(per_dep * counted, 2))"
  - paid_weeks: COUNT('claim_ledger', event_type='claim_benefit_paid', payment_kind='weekly')
  - weeks_basis: "int((F('remaining_balance') + wba + da_old - K('cent')) / (wba + da_old)) if paid_weeks >= K('late_weeks') else (RND(P('max_duration_weeks') * K('mid_weeks_share'), 0) if paid_weeks >= K('mid_weeks') else P('max_duration_weeks'))"
  - credits: SUM('claim_ledger', 'amount', event_type='claim_entitlement_credited')
  - frac: "K('frac_steady_standard') if F('base_period_type') == 'standard' and F('base_period_wages') >= K('steady_ratio') * F('high_quarter_wages') and credits >= int(P('mba_bpw_fraction') * F('base_period_wages')) else (K('frac_steady_alternate') if F('base_period_type') == 'alternate' and F('base_period_wages') >= K('steady_ratio') * F('high_quarter_wages') and credits >= int(P('mba_bpw_fraction') * F('base_period_wages')) else P('mba_bpw_fraction'))"
  - increase: MX(0, da_new - da_old)
  - result: MX(0, int(MN(weeks_basis * increase, frac * F('base_period_wages') - mba_old)))
  compute_basis:
    deps: "The redetermined dependency allowance is the per-dependent amount times the dependents on record, counting no more than the program's maximum number of dependents."
    da_old: "As the standard method, the per-dependent amount is the program's dependency allowance per dependent, the allowance has no ceiling, and the allowance increase is the redetermined dependency allowance minus the dependency allowance on the claim."
    mba_old: "As the standard method, the credit for a dependency redetermination is the program's maximum duration weeks times the allowance increase, never more than the base-period-wage fraction times the base-period wages minus the maximum benefit amount already on the claim, rounded down to the whole dollar and never below zero."
    claim_age: "The weekly payments counted are the weekly payments issued on the claim, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and the age of the claim is the calendar days from the claim effective date to the handling date."
    per_dep: "For a dependency redetermination, the per-dependent amount is the long-claim family amount when two or more dependents are on record and the claim effective date is at least the long-claim days before the handling date. It is the short-claim family amount when two or more dependents are on record and the claim effective date is fewer than the long-claim days before the handling date. Any other dependency redetermination uses the program's per-dependent amount."
    counted: "The redetermined dependency allowance is the per-dependent amount times the dependents on record, counting no more than the program's maximum number of dependents."
    det_age: "The weekly payments counted are the weekly payments issued on the claim, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and the age of the claim is the calendar days from the claim effective date to the handling date."
    da_new: "For a dependency redetermination, the redetermined dependency allowance is capped at the late-addition share of the weekly benefit amount, rounded to the cent, when the latest monetary determination is more than the late-addition days old. It is capped at the mid-addition share of the weekly benefit amount, rounded to the cent, when that determination is more than the redetermination window days but no more than the late-addition days old. No ceiling applies when the determination is no more than the redetermination window days old. The ceiling is applied to the redetermined allowance before the allowance on the claim is subtracted, and the credited weeks multiply that increase before the comparison with the wage cap."
    paid_weeks: "The weekly payments counted are the weekly payments issued on the claim, the age of the determination is the calendar days from the latest monetary determination date to the handling date, and the age of the claim is the calendar days from the claim effective date to the handling date."
    weeks_basis: "For a dependency redetermination, when at least the late-claim number of weekly payments has been issued on the claim, the credited weeks are the remaining benefit balance divided by the weekly benefit amount plus the dependency allowance on the claim, rounded up to the whole week. When at least one but fewer than the late-claim number of weekly payments has been issued, the credited weeks are the mid-claim share of the maximum duration weeks, rounded to the whole week. When no weekly payment has been issued, the credited weeks are the maximum duration weeks."
    credits: "For a dependency redetermination, the base-period-wage fraction is the steady-earner standard fraction when the standard base period was used, base-period wages are at least the steady-earner ratio times high-quarter wages, and the entitlement credited on the claim already reaches the program's base-period-wage fraction times base-period wages, rounded down to the whole dollar."
    frac: "For a dependency redetermination, the base-period-wage fraction is the steady-earner standard fraction when the standard base period was used, base-period wages are at least the steady-earner ratio times high-quarter wages, and the entitlement credited on the claim already reaches the program's base-period-wage fraction times base-period wages, rounded down to the whole dollar. It is the steady-earner alternate fraction when the alternate base period was used, base-period wages are at least that ratio times high-quarter wages, and the entitlement credited on the claim already reaches that wage-capped amount. Any other dependency redetermination uses the program's base-period-wage fraction."
    increase: "As the standard method, the per-dependent amount is the program's dependency allowance per dependent, the allowance has no ceiling, and the allowance increase is the redetermined dependency allowance minus the dependency allowance on the claim. The ceiling is applied to the redetermined allowance before the allowance on the claim is subtracted, and the credited weeks multiply that increase before the comparison with the wage cap."
    result: "As the standard method, the credit for a dependency redetermination is the program's maximum duration weeks times the allowance increase, never more than the base-period-wage fraction times the base-period wages minus the maximum benefit amount already on the claim, rounded down to the whole dollar and never below zero. The ceiling is applied to the redetermined allowance before the allowance on the claim is subtracted, and the credited weeks multiply that increase before the comparison with the wage cap."
  factors:
  - id: per_dependent_amount_redetermination
    effect: parameter
    decides: per_dep
    bindings:
    - claim_age
    - per_dep
    ladder:
    - when: "two or more dependents on record and the claim effective date at least the long-claim days before the handling date"
      value: K('per_dep_long')
    - when: "two or more dependents on record and the claim effective date fewer than the long-claim days before"
      value: K('per_dep_short')
    - when: otherwise
      value: P('dependency_allowance_per_dependent')
    baseline:
      per_dep: P('dependency_allowance_per_dependent')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: credited_weeks_redetermination
    effect: method
    decides: weeks_basis
    bindings:
    - paid_weeks
    - weeks_basis
    ladder:
    - when: at least the late-claim number of weekly payments issued on the claim
      method: "the remaining benefit balance divided by the weekly benefit amount plus the dependency allowance on the claim, rounded up to the whole week"
    - when: at least one but fewer than the late-claim number of weekly payments issued
      method: the mid-claim share of the maximum duration weeks, rounded to the whole week
    - when: otherwise
      method: the maximum duration weeks
    baseline:
      weeks_basis: P('max_duration_weeks')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: allowance_ceiling_redetermination
    effect: parameter
    decides: da_new
    bindings:
    - wba
    - det_age
    - da_new
    ladder:
    - when: the latest monetary determination is more than the late-addition days old
      value: K('ceiling_old_share') times the weekly benefit amount
    - when: "more than the redetermination window days but no more than the late-addition days old"
      value: K('ceiling_mid_share') times the weekly benefit amount
    - when: otherwise
      value: no ceiling
    baseline:
      da_new: RND(per_dep * counted, 2)
    evidence:
    - date
    cross_difficulty: null
  - id: wage_cap_fraction_redetermination
    effect: parameter
    decides: frac
    bindings:
