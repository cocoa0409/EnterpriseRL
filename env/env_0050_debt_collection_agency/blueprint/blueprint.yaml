name: env_0050_debt_collection_agency
company: Ridgeline Recovery Associates

background: |
  Ridgeline Recovery Associates, LLC is a licensed third-party debt collection agency headquartered in Columbus, Ohio, collecting consumer receivables on contingency for creditor clients in 47 states.
  It employs about 460 collectors and client-service staff, works roughly 1.3 million open consumer accounts for close to 2,000 clients, and is known in the trade for a plain, respectful and compliance-minded tone on the phone and in its letters.
  Its clients are hospitals and physician groups, bank card issuers, electric, gas and water utilities, telecom carriers, auto finance companies, private student lenders and retailers.
  On the consumer side, every debt a client places becomes a Placed Consumer Account worked at one stage: Early-Out Placement, Primary Placement, Secondary Placement, Tertiary Placement, Warehouse Placement or Legal Review Placement.
  Each placed account books its placed balance and every later movement of it — consumer payments, payments made directly to the client, returned payments, client credits such as insurance payments or charity-care write-offs, settlement waivers and refunds — alongside a case history of validation notices, disputes, verifications, credit bureau tradeline actions, contact restrictions and closure letters.
  Consumers who cannot pay at once hold Payment Arrangements — the Promise-to-Pay Arrangement, Short-Term Installment Plan, Standard Installment Plan, Extended Installment Plan, Long-Term Installment Plan or Hardship Reduced-Payment Plan — which book a scheduled total and then each installment paid, returned or missed.
  Consumers who resolve a debt for less hold Settlement Agreements under the Prompt-Pay Discount Settlement, Lump-Sum Settlement, Two-Payment Settlement, Three-Payment Settlement, Six-Payment Settlement or Hardship Settlement programmes, booked from the written offer through acceptance, settlement payments and fulfillment, with client approval requests on file where an offer needed one.
  Consumers in difficulty hold Hardship and Protective Holds — the 30-Day Hardship Pause, Documented Hardship Hold, Disaster Relief Hold, Financial Assistance Review Hold, Long-Term Hardship Hold or Military Service Hold — recorded from the request through documentation, decision, extensions and the end of the hold.
  On the client side, every creditor holds a Contingency Placement Agreement at one tier — Starter, Standard, Preferred, Select Volume, Enterprise or Strategic Partner Contingency Agreement — which books the collections Ridgeline holds in trust, the remittances it sends and the fees, charges and credits between the two, together with the client's service requests.
  Some clients also buy Flat-Fee Pre-Collect Programs, packs of letter units from the First Notice 50-Unit Program to the First Notice 2500-Unit Program, booked as units bought, used, credited and lapsed.
  Clients that sue on their debts hold a Legal Forwarding Agreement under the Attorney Demand Program, Small Claims Suit Program, Client-Advanced Cost Suit Program, Agency-Advanced Cost Suit Program, Judgment Enforcement Program or Full-Service Litigation Program, which books cost deposits, court costs and each forwarded matter from authorization to closure.
  The consumers who call typically owe one to four placed accounts, often several medical bills from the same health system or a mix of a card balance, a utility final bill and a phone bill, and bring a history of letters received, partial payments, a returned debit or two, broken or reinstated plans, earlier disputes and sometimes a hold for a job loss, an illness, a storm or a deployment.
  Many call because a letter or a credit report surprised them, because they want to pay, settle or arrange payments, because they believe the debt is not theirs or was already paid, or because they need the calls to stop.
  The creditor clients who call are billing office managers, collection managers and controllers asking about remittances, invoices, recalls, rate tiers, credit reporting and the end of their agreements, with a history of monthly collections, returned payments, fee invoices and account recalls.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: placed_account_servicing
    claim:
      categories: [account]
      event_types: [account_payment_posted, account_payment_returned, account_overpayment_refunded, account_paid_in_full, account_validation_info_requested, account_dispute_received, account_dispute_hold_placed, account_dispute_hold_released, account_verification_mailed, account_tradeline_furnished, account_contact_restriction_recorded, account_protected_status_notice, account_returned_to_client, account_closure_letter_issued]
    summary: >
      Consumers call about one or more placed accounts they owe at different placement stages and
      in different statuses — still within the validation period, in ordinary collection, on an
      arrangement, under a dispute hold or a hardship hold, or already paid — wanting to pay, to
      challenge a debt they believe is wrong, not theirs or already paid, to stop or limit calls, to
      report a bankruptcy or a death, to understand a collection tradeline on their credit report,
      or to get a paid-in-full letter or a statement; the setting varies with the stage, the debt
      type (medical debts above all), the placing client's agreement, the payment history including
      returned payments, and whether earlier disputes were already verified. The records involved
      are the placed account with its dates and balance, its money history and case history, the
      placing client agreement, and any plan, settlement or hardship hold on the account, and the
      governing rules are gates on account status, the validation period, written versus oral
      channels and verification on record (account_evt_dispute_and_validation,
      account_evt_unverified_dispute_return), per-stage payment channel limits and returned-payment
      blocks (account_evt_payment_channels), allocation across several accounts with disputed
      accounts excluded (account_agg_payment_application), credit reporting waits, minimums,
      authorizations and deletions by stage and debt type (account_evt_credit_reporting), contact
      restrictions (account_evt_contact_restrictions), protected-status returns
      (account_evt_protected_status) and clearance-based closure letters and refunds
      (account_evt_resolution_and_letters). In the natural order of the business, an account is
      placed, its validation notice is sent, the validation period runs, and disputes, payments,
      reporting and closure follow from there. The agent posts payments the caller makes, records
      requests, notices and restrictions, places and releases holds, books returns and refunds, and
      issues letters, while asserting a written dispute or a written cease of all communication,
      supplying an identity theft or police report number, and directing how a single payment is
      split are the consumer's own statements and acts. Requests no rule can decide — such as asking
      Ridgeline to remove a tradeline the original creditor reports, to waive part of a balance
      outside any settlement, to stop a lawsuit filed by another agency, or to dispute a debt on
      behalf of someone who is neither the consumer nor an authorized representative — go to a human
      representative as POLICY_NOT_COVERED.

  - name: payment_arrangement_servicing
    claim:
      categories: [plan]
      event_types: [plan_created, plan_authorized, plan_cancelled, plan_installment_paid, plan_installment_returned, plan_installment_missed, plan_broken, plan_reinstated, plan_suspended, plan_resumed, plan_schedule_change_recorded, plan_schedule_updated, plan_funding_method_updated, plan_total_scheduled, plan_balance_released]
    summary: >
      Consumers call to set up a payment arrangement on a placed account, to change the due date,
      the installment or the payment method of an existing one, to make or catch up an installment,
      to reinstate a plan they broke, or to restart a plan that was suspended while a dispute or a
      hardship hold ran; the setting varies with the arrangement type requested, the account's stage,
      balance and status, the consumer's other plans and stated income, an earlier broken plan on
      the same account, returned debits, and any settlement or hardship hold on the same account. The
      records involved are the payment plan and its installment history, the placed account and its
      money history, settlements and hardship holds on the account, and the governing rules are the
      eligibility and term limits of each type (plan_eligibility_and_terms), one open plan per
      account (plan_agg_multi_holding), the portfolio-wide affordability test for budget-reviewed
      types (plan_agg_combined_affordability), the exclusion of accepted settlements and the
      qualifying hardship hold for the hardship plan (plan_combo_settlement_and_hardship), the
      authorization window (plan_evt_authorization), due dates, grace, tolerance and re-presentment
      (plan_evt_installments), breakage and reinstatement windows
      (plan_evt_breakage_and_reinstatement), per-12-month change limits
      (plan_evt_schedule_changes), suspension limits (plan_evt_suspension) and completion and
      release (plan_evt_completion_and_release). In the natural order of the business, a plan is set
      up, authorized, paid installment by installment, and may be suspended, broken, reinstated,
      changed, completed or cancelled along the way. The agent sets up terms, records installments,
      misses, breaks, reinstatements, suspensions and granted changes, while authorizing recurring
      debits or a new payment method, and stating household income for a budget review, are the
      consumer's own acts. Requests the rules do not cover — such as adding interest-free time
      beyond any type's maximum, merging several accounts into one plan, accepting a payment from a
      third party's bank account the consumer does not control, or changing a plan on an account
      the client has recalled — go to a human representative as POLICY_NOT_COVERED.

  - name: settlement_negotiation
    claim:
      categories: [settle]
      event_types: [settle_offer_issued, settle_offer_accepted, settle_offer_withdrawn, settle_payment_received, settle_payment_returned, settle_due_date_extended, settle_defaulted, settle_fulfilled, settle_letter_issued, settle_amount_scheduled, settle_balance_released]
    summary: >
      Consumers call to ask what it would take to settle a placed account for less, to accept an
      offer they received, to make, move or replace a settlement payment, or to find out why their
      settlement defaulted or has not yet been marked settled; the setting varies with the
      settlement programme, the account's stage, balance, age and status, the placing client's
      contingency tier, other open accounts under the same client, earlier expired or defaulted
      offers, client approvals and declines on file, an active payment plan, a hardship hold, and
      whether the debt is past its statute-of-limitations date. The records involved are the
      settlement and its payment and letter history, the client approval requests, the placed
      account with its placing agreement, plans and hardship holds on the account, and the governing
      rules are the tier-by-stage authority and approval floors, client-tier reductions, waiting and
      cooling-off periods and offer limits (settle_offer_authority), the same-client bundle
      (settle_agg_same_client_bundle), one open settlement per account (settle_agg_multi_holding),
      approval on record and its validity (settle_evt_client_approval), the plan and hardship
      interplay (settle_combo_plan_and_hardship), acceptance before expiry
      (settle_evt_acceptance_and_expiry), payments, grace, returns and extensions
      (settle_evt_payments), default (settle_evt_default_and_release), fulfillment after the hold
      (settle_evt_fulfillment), withdrawal reasons (settle_evt_withdrawal) and letters with their
      disclosures (settle_evt_letters). In the natural order of the business, an offer is issued in
      writing, accepted, paid, and then fulfilled, defaulted or withdrawn. The agent extends offers
      within authority or on a client approval, books payments and extensions, and records defaults,
      withdrawals and fulfillments, while accepting a settlement is the consumer's own act. Requests
      the rules do not decide — such as negotiating below the approval floor, promising the debt
      will be removed from a credit report as part of the deal, settling an account Ridgeline has
      returned to the client, or reopening a fulfilled settlement — go to a human representative as
      POLICY_NOT_COVERED.

  - name: hardship_hold_requests
    claim:
      categories: [hardship]
      event_types: [hardship_hold_requested, hardship_hold_approved, hardship_hold_denied, hardship_hold_withdrawn, hardship_hold_ended, hardship_hold_extended, hardship_documentation_requested, hardship_documentation_received, hardship_extension_granted, hardship_notice_sent, hardship_client_notified, hardship_assistance_decision_recorded]
    summary: >
      Consumers call because a job loss, an illness, a disaster, a pending hospital financial
      assistance application or active military service leaves them unable to pay, to ask for
      collection to pause, to send the documentation a hold needs, to extend or end a hold, or to
      learn what happens when it ends; the setting varies with the hold tier, the debt types,
      stages, balances and statuses of their accounts, earlier holds and denials on the same
      account, the days of hold already used, an open dispute, an active payment plan, and the
      client's financial assistance decision. The records involved are the hold and its history of
      documentation, decisions, extensions, reviews, notices and client notifications, the placed
      accounts and their plans and settlements, and the governing rules are tier eligibility by debt
      type, stage, balance, channel, grant limits, rolling hold-day limits, cooling-off and reapply
      waits and disaster windows (hardship_eligibility), one open hold per account and consumer-wide
      holds (hardship_agg_multi_holding, hardship_agg_consumer_level), documentation deadlines
      (hardship_evt_documentation), approval and the effects of a running hold
      (hardship_evt_approval_and_effects), extensions (hardship_evt_extension), reviews
      (hardship_evt_review), endings and notices (hardship_evt_end), financial assistance decisions
      (hardship_evt_financial_assistance) and the interplay with disputes, plans and settlements
      (hardship_combo_dispute_and_arrangements). In the natural order of the business, a hold is
      requested, documentation is asked for and received where the tier needs it, the hold is
      decided, runs, may be extended or reviewed, and ends. The agent records requests,
      documentation, decisions, extensions, endings, notices and client notifications, while
      withdrawing an undecided request is the consumer's own act and the qualifying facts behind a
      self-attested pause are the consumer's own statement. Requests no rule covers — such as a
      permanent stop to collection, a hold on an account Ridgeline no longer holds, a hold requested
      by a relative without authority, or forgiving the balance because of the hardship — go to a
      human representative as POLICY_NOT_COVERED.

  - name: creditor_client_services
    claim:
      categories: [client]
      event_types: [client_agreement_signed, client_terms_updated, client_placements_held, client_placements_resumed, client_runoff_started, client_early_termination_fee_assessed, client_recall_fee_assessed, client_fee_credit_issued, client_fee_payment_received, client_late_charge_assessed, client_collection_reversed, client_tier_changed, client_term_renewed]
    summary: >
      Creditor clients call about their contingency placement agreements: to change how and how
      often they are remitted, to turn credit reporting on or off, to pause or resume placements, to
      recall accounts and question a recall fee, to dispute an invoice line or a late charge, to
      chase a fee credit for a returned payment, to ask why their tier changed, or to give notice of
      termination or non-renewal; the setting varies with the contingency tier, the client's other
      agreements and pooled volume, the remittance basis and frequency, the agreement's status and
      term dates, unpaid or disputed invoices, and the placement history and status of the accounts
      concerned. The records involved are the client agreement with its trust and fee balances, the
      client ledger, the client's service requests, and the placed accounts and their money
      histories, and the governing rules are tier-and-stage contingency rates and direct-pay fees
      (client_contingency_fees), remittance periods and minimums (client_evt_remittance), invoicing,
      late charges and offsets (client_evt_fee_billing), placement holds (client_evt_placement_hold),
      recall fees and free recalls (client_evt_recalls), credits and reversals
      (client_evt_credits_and_reversals), pooled-volume tier reviews (client_agg_volume_tiering),
      one agreement per line of business (client_agg_multi_holding), signature windows
      (client_evt_onboarding), renewal, termination, early-termination fees and runoff
      (client_evt_termination_and_renewal) and terms changes (client_evt_terms_changes). In the
      natural order of the business, an agreement is issued and signed, accounts are placed and
      collected, collections are remitted and fees settled each period, terms change on request, the
      tier is reviewed each year, and the agreement renews or runs off. The agent processes the
      client's service requests and books fees, charges, credits and holds, while signing an
      agreement and giving termination or non-renewal notice are the client's own acts. Requests no
      rule covers — such as a custom contingency rate outside the tier table, a refund of fees on
      collections that were not reversed, remitting to a bank account that is not the client's, or
      disclosing a consumer's details beyond the client's own accounts — go to a human
      representative as POLICY_NOT_COVERED.
