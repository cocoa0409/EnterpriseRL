# Placed Consumer Accounts — the debts creditor clients place with Ridgeline for third-party
# collection. One holding = one debt placed for one consumer under one client placement agreement.
# Tiers are the placement stages the industry uses (early-out, primary, secondary, tertiary,
# warehouse, legal review); the debt type is a field of the account and drives debt-type mappings.

category: account
display_name: Placed Consumer Accounts

binding:
  holding_table: placed_accounts
  event_tables: [account_transactions, account_case_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: balance_due}

lifecycle:
  states: [placed, validation_period, active, arranged, dispute_hold, hardship_hold, paid_in_full, settled_in_full, returned_to_client]
  transitions:
    - {from: placed, to: validation_period, by: agent, means: The validation notice for the debt is mailed or emailed and the validation period begins.}
    - {from: validation_period, to: active, by: system, means: The validation period ends without a dispute that placed a hold, and ordinary collection continues.}
    - {from: validation_period, to: dispute_hold, by: agent, means: A dispute or validation information request that places a hold is recorded during the validation period.}
    - {from: active, to: dispute_hold, by: agent, means: A dispute or validation information request that places a hold is recorded after the validation period.}
    - {from: arranged, to: dispute_hold, by: agent, means: A dispute that places a hold is recorded while the account is on a payment arrangement.}
    - {from: hardship_hold, to: dispute_hold, by: agent, means: A dispute that places a hold is recorded while a hardship hold is running; the dispute hold takes precedence.}
    - {from: dispute_hold, to: active, by: agent, means: Verification is mailed to the consumer and collection may resume.}
    - {from: validation_period, to: arranged, by: system, means: A payment plan is authorized or a settlement is accepted during the validation period.}
    - {from: active, to: arranged, by: system, means: A payment plan is authorized or a settlement is accepted.}
    - {from: arranged, to: active, by: system, means: The payment plan or settlement on the account ends without resolving the balance.}
    - {from: validation_period, to: hardship_hold, by: agent, means: An approved hardship hold starts during the validation period.}
    - {from: active, to: hardship_hold, by: agent, means: An approved hardship hold starts on an account in ordinary collection.}
    - {from: arranged, to: hardship_hold, by: agent, means: An approved hardship hold starts on an account that is on a payment arrangement.}
    - {from: hardship_hold, to: active, by: agent, means: The hardship hold ends and no suspended arrangement resumes.}
    - {from: hardship_hold, to: arranged, by: agent, means: The hardship hold ends and the suspended payment plan resumes.}
    - {from: validation_period, to: paid_in_full, by: system, means: Payments and credits bring the balance due to zero during the validation period.}
    - {from: active, to: paid_in_full, by: system, means: Payments and credits bring the balance due to zero.}
    - {from: arranged, to: paid_in_full, by: system, means: Plan payments and credits bring the balance due to zero.}
    - {from: dispute_hold, to: paid_in_full, by: system, means: Consumer-initiated payments or client credits bring the balance due to zero while a dispute hold is in force.}
    - {from: hardship_hold, to: paid_in_full, by: system, means: Voluntary payments or client credits bring the balance due to zero while a hardship hold is in force.}
    - {from: active, to: settled_in_full, by: system, means: A lump-sum settlement is fulfilled and the remainder is waived.}
    - {from: arranged, to: settled_in_full, by: system, means: An accepted settlement is fulfilled and the remainder is waived.}
    - {from: placed, to: returned_to_client, by: agent, means: The account is returned to the client before the validation notice is sent.}
    - {from: validation_period, to: returned_to_client, by: agent, means: The account is returned to the client during the validation period.}
    - {from: active, to: returned_to_client, by: agent, means: The account is returned to the client from ordinary collection.}
    - {from: arranged, to: returned_to_client, by: agent, means: The account is returned to the client while on a payment arrangement.}
    - {from: dispute_hold, to: returned_to_client, by: agent, means: The account is returned to the client while a dispute hold is in force.}
    - {from: hardship_hold, to: returned_to_client, by: agent, means: The account is returned to the client while a hardship hold is in force.}

accounts:
  - key: balance_due
    unit: USD
    meaning: The amount the consumer currently owes on the placed debt at Ridgeline — the placed balance plus client supplemental additions, returned payments and refunded overpayments, less payments, client-reported direct payments, client credits and any settlement waiver.

parameter_schema:
  min_placed_balance_usd: Smallest placed balance Ridgeline accepts at this stage, USD with 2 decimals.
  max_placed_balance_usd: Largest placed balance Ridgeline accepts at this stage, USD with 2 decimals.
  placement_term_days: Length of the placement term at this stage, in calendar days counted from the stage start date.
  term_extension_lookback_days: Calendar days before the term end date within which a posted payment qualifies the account for a term extension.
  term_extension_days: Calendar days one term extension adds to the term end date.
  term_extension_max_count: Maximum number of term extensions an account may receive at this stage, integer.
  term_end_disposition: What happens at term end when no extension applies, enum return_to_client | convert_to_warehouse.
  validation_notice_sla_business_days: Business days after the placement date within which the validation notice must be sent.
  validation_notice_email_allowed: Whether the validation notice may be delivered by email at this stage, boolean.
  validation_receipt_buffer_business_days: Business days after sending that Ridgeline assumes the consumer received the validation notice.
  validation_period_days: Calendar days the validation period runs after the assumed receipt date.
  itemization_date_basis: The reference date used as the itemization date on the validation notice, enum last_statement_date | charge_off_date.
  supplemental_balance_window_days: Calendar days after the placement date during which a client may add a supplemental balance; 0 means none accepted.
  supplemental_balance_max_count: Maximum number of supplemental balance additions on one account, integer.
  supplemental_max_increase_pct: Maximum cumulative supplemental additions as a percentage of the placed balance.
  min_payment_amount_usd: Smallest single payment accepted unless the payment clears the full balance due, USD.
  card_payment_max_per_transaction_usd: Largest single debit-card or credit-card payment accepted, USD.
  card_payment_max_rolling_30d_usd: Largest total of card payments on one account in any rolling 30-day window, USD.
  ach_payment_max_per_transaction_usd: Largest single ACH bank-debit payment accepted, USD.
  credit_card_payments_accepted: Whether credit cards are accepted at this stage, boolean.
  cash_network_payments_accepted: Whether retail cash payment network payments are accepted at this stage, boolean.
  cash_network_max_per_transaction_usd: Largest single cash payment network payment accepted, USD; 0.00 where the channel is not accepted.
  returned_payment_block_threshold: Number of returned payments within the lookback window that triggers an electronic-payment block, integer.
  returned_payment_lookback_days: Rolling window in calendar days over which returned payments are counted.
  returned_payment_block_days: Calendar days electronic payment channels stay blocked after the block is triggered.
  overpayment_refund_sla_business_days: Business days after the overpaying payment within which an overpayment is refunded.
  direct_payment_posting_sla_business_days: Business days after the client reports a direct payment within which it is posted to the account.
  oral_dispute_places_hold: Whether a dispute received by phone places the account in dispute hold at this stage, boolean.
  dispute_client_verification_due_days: Calendar days after a hold-placing dispute within which the client must supply verification documents.
  verification_package: The verification document set mailed at this stage, enum itemized_statement_package | charge_off_package | chain_of_placement_package | legal_documentation_package.
  verification_mail_sla_business_days: Business days after the client's documents arrive within which verification is mailed.
  duplicate_dispute_lookback_days: Calendar days before a dispute within which a prior verification on the same reason makes it a repeat dispute.
  credit_reporting_enabled: Whether Ridgeline furnishes a collection tradeline at this stage, boolean.
  reporting_wait_after_notice_days: Calendar days after the validation notice is sent before an initial tradeline may be furnished.
  reporting_cycle_day_of_month: Day of the month on which the monthly tradeline file is furnished, integer.
  dispute_flag_sla_business_days: Business days after a dispute within which a live tradeline is flagged as disputed.
  paid_status_update_sla_days: Calendar days after an account is paid or settled within which the tradeline status update is furnished.
  tradeline_deletion_sla_business_days: Business days after the triggering event within which a tradeline deletion is furnished.
  email_contact_allowed: Whether Ridgeline uses email for collection communications at this stage, boolean.
  text_message_contact_allowed: Whether Ridgeline uses text messages for collection communications at this stage, boolean.
  bankruptcy_return_sla_business_days: Business days after a bankruptcy notice within which the account is returned to the client.
  deceased_return_sla_business_days: Business days after a deceased notice within which the account is returned to the client.
  recall_processing_sla_business_days: Business days within which a client recall or a confirmed identity-theft return is processed.
  pif_letter_sla_business_days: Business days after the final payment clears within which the paid-in-full or settled-in-full letter is issued.
  ach_clearance_business_days: Business days after an ACH final payment before it is treated as cleared.
  card_clearance_business_days: Business days after a card final payment before it is treated as cleared.
  check_clearance_business_days: Business days after a mailed-check final payment before it is treated as cleared.
  money_order_clearance_business_days: Business days after a money-order final payment before it is treated as cleared.
  cash_network_clearance_business_days: Business days after a cash payment network final payment before it is treated as cleared.

