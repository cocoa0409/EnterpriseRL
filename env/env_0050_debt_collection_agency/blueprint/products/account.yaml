events:
  # ---- holding writes (placed_accounts) ----
  - type: account_placed
    target: placed_accounts
    mutation: create
    meaning: A client places one consumer debt with Ridgeline under a placement agreement and the placed account is opened.
    grain: one row per debt placement.
    fields:
      customer_id: The consumer who owes the debt.
      agreement_id: The client placement agreement the debt is placed under.
      variant_name: The placement stage assigned from the stage entry gates.
      debt_type: The kind of debt placed.
      original_creditor: The original creditor named on the debt, verbatim from the client file.
      client_account_number: The client's own account number for the debt, verbatim.
      placement_date: The date Ridgeline received the placement.
      stage_start_date: The date the current stage began; equals placement_date at placement.
      first_delinquency_date: The date of first delinquency reported by the client.
      charge_off_date: The charge-off or final-bill date; empty for a pre-charge-off debt.
      itemization_date: The itemization reference date shown on the validation notice.
      placed_balance: The balance the client placed.
      prior_agency_placements: How many collection agencies worked the debt before Ridgeline.
      sol_expiry_date: The date the statute of limitations for suit expires, as determined at placement.
      term_end_date: The date the placement term ends.
    triggers:
      - event: account:account_balance_placed
        map: {amount: placed_balance, txn_date: placement_date, agreement_id: agreement_id}
  - type: account_validation_notice_mailed
    target: placed_accounts
    mutation: {transition: {from: placed, to: validation_period}}
    meaning: Ridgeline sends the validation notice for the debt and the validation period starts.
    grain: one row per transaction.
    fields:
      validation_notice_date: The date the validation notice was sent.
      validation_notice_channel: Whether the notice went by mail or email.
      validation_period_end_date: The last day of the validation period computed at sending.
    triggers: []
  - type: account_validation_period_closed
    target: placed_accounts
    mutation: {transition: {from: validation_period, to: active}}
    meaning: The validation period ends with no hold-placing dispute and ordinary collection continues.
    grain: one row per transaction.
    fields:
      validation_period_end_date: The validation period end date the closure is measured against.
    triggers: []
  - type: account_dispute_hold_placed
    target: placed_accounts
    mutation:
      transition:
        - {from: validation_period, to: dispute_hold}
        - {from: active, to: dispute_hold}
        - {from: arranged, to: dispute_hold}
        - {from: hardship_hold, to: dispute_hold}
    meaning: Collection on the account is suspended because a hold-placing dispute or validation information request was received.
    grain: one row per transaction.
    fields:
      status: Set to dispute_hold.
    triggers: []
  - type: account_dispute_hold_released
    target: placed_accounts
    mutation: {transition: {from: dispute_hold, to: active}}
    meaning: Verification has been mailed and collection on the account may resume.
    grain: one row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: account_arrangement_opened
    target: placed_accounts
    mutation:
      transition:
        - {from: validation_period, to: arranged}
        - {from: active, to: arranged}
    meaning: The account goes onto a payment arrangement because a payment plan was authorized or a settlement was accepted.
    grain: one row per transaction.
    fields:
      status: Set to arranged.
    triggers: []
  - type: account_arrangement_closed
    target: placed_accounts
    mutation: {transition: {from: arranged, to: active}}
    meaning: The payment arrangement on the account ends without resolving the balance.
    grain: one row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: account_hardship_hold_placed
    target: placed_accounts
    mutation:
      transition:
        - {from: validation_period, to: hardship_hold}
        - {from: active, to: hardship_hold}
        - {from: arranged, to: hardship_hold}
    meaning: An approved hardship hold starts and collection activity on the account pauses.
    grain: one row per transaction.
    fields:
      status: Set to hardship_hold.
    triggers: []
  - type: account_hardship_hold_lifted
    target: placed_accounts
    mutation:
      transition:
        - {from: hardship_hold, to: active}
        - {from: hardship_hold, to: arranged}
    meaning: The hardship hold on the account ends.
    grain: one row per transaction.
    fields:
      status: Set to active, or to arranged when the suspended payment plan resumes.
    triggers: []
  - type: account_paid_in_full
    target: placed_accounts
    mutation:
      transition:
        - {from: validation_period, to: paid_in_full}
        - {from: active, to: paid_in_full}
        - {from: arranged, to: paid_in_full}
        - {from: dispute_hold, to: paid_in_full}
        - {from: hardship_hold, to: paid_in_full}
    meaning: Payments and credits bring the balance due to zero and the account closes as paid in full.
    grain: one row per transaction.
    fields:
      closed_date: The date the balance due reached zero.
    triggers: []
  - type: account_settled_in_full
    target: placed_accounts
    mutation:
      transition:
        - {from: active, to: settled_in_full}
        - {from: arranged, to: settled_in_full}
    meaning: A settlement on the account is fulfilled, the remainder is waived and the account closes as settled in full.
    grain: one row per transaction.
    fields:
      closed_date: The date the settlement was fulfilled.
    triggers: []
  - type: account_returned_to_client
    target: placed_accounts
    mutation:
      transition:
        - {from: placed, to: returned_to_client}
        - {from: validation_period, to: returned_to_client}
        - {from: active, to: returned_to_client}
        - {from: arranged, to: returned_to_client}
        - {from: dispute_hold, to: returned_to_client}
        - {from: hardship_hold, to: returned_to_client}
    meaning: Ridgeline closes its work on the account and returns it to the client.
    grain: one row per transaction.
    fields:
      close_reason: Why the account was returned.
      closed_date: The date the account was returned.
    triggers: []
  - type: account_term_extended
    target: placed_accounts
    mutation: update
    meaning: The placement term is extended at term end because the account is on an arrangement or recently paid.
    grain: one row per transaction.
    fields:
      term_end_date: The new term end date.
      term_extension_count: The number of extensions granted so far at the current stage, after this one.
    triggers: []
  - type: account_stage_converted
    target: placed_accounts
    mutation: update
    meaning: At term end the account is converted from its stage to Warehouse Placement under the stage's term-end disposition.
    grain: one row per transaction.
    fields:
      variant_name: The new stage, Warehouse Placement.
      stage_start_date: The conversion date.
      term_end_date: The term end date of the warehouse term.
      term_extension_count: Reset to 0 for the new stage.
    triggers: []
  # ---- ledger writes (account_transactions) ----
  - type: account_balance_placed
    target: account_transactions
    meaning: The placed balance is booked to the account on the placement date.
    grain: one row per placement.
    distinguish_by: [txn_date]
    fields:
      agreement_id: The placement agreement the account is placed under.
      amount: The placed balance booked.
      txn_date: The placement date.
    account: balance_due
    direction: in
    triggers: []
  - type: account_supplemental_balance_added
    target: account_transactions
    meaning: The client adds an increase in the same debt to the account balance.
    grain: one row per supplemental addition sent by the client.
    distinguish_by: [txn_date, client_reference]
    fields:
      agreement_id: The placement agreement the account is placed under.
      amount: The increase added.
      txn_date: The date the addition is booked.
      adjustment_reason: Why the balance increased.
      client_reference: The client's own reference for the addition, verbatim.
    account: balance_due
    direction: in
    triggers: []
  - type: account_payment_posted
    target: account_transactions
    meaning: A consumer payment received by Ridgeline is posted to the account.
    grain: one row per payment received, identified by its processor confirmation.
    distinguish_by: [payment_ref]
    fields:
      account_id: The placed account the row books against.
      agreement_id: The placement agreement the account is placed under.
      amount: The payment amount applied to this account.
      txn_date: The date the funds were received.
      payment_channel: How the consumer paid.
      payment_ref: The processor or lockbox confirmation number, verbatim.
      plan_id: The payment plan the payment was made under; empty when none.
      settlement_id: The settlement the payment was made under; empty when none.
    account: balance_due
    direction: out
    triggers:
      - event: client:client_collection_booked
        map: {account_id: account_id, source_txn_id: txn_id, amount: amount, txn_date: txn_date}
  - type: account_direct_payment_reported
    target: account_transactions
    meaning: The client reports that the consumer paid the client directly, and the payment is posted to the account.
    grain: one row per direct payment reported by the client.
    distinguish_by: [payment_ref]
    fields:
      agreement_id: The placement agreement the account is placed under.
      amount: The direct payment amount.
      txn_date: The date the consumer paid the client.
      payment_channel: Always paid_to_client.
      payment_ref: The client's direct-payment report reference, verbatim.
    account: balance_due
    direction: out
    triggers:
      - event: client:client_direct_pay_fee_booked
        map: {account_id: account_id, source_txn_id: txn_id, txn_date: txn_date}
  - type: account_payment_returned
    target: account_transactions
    meaning: A posted payment is returned unpaid or charged back and its amount is restored to the balance.
    grain: one row per returned payment, pointing to the original payment.
    distinguish_by: [source_txn_id]
    fields:
      account_id: The placed account the row books against.
      agreement_id: The placement agreement the account is placed under.
      amount: The returned amount, equal to the original payment.
      txn_date: The date the return was received.
      source_txn_id: The original account_payment_posted row being returned.
      payment_channel: The channel of the original payment.
      return_reason: Why the payment was returned.
    account: balance_due
    direction: in
    triggers:
      - event: client:client_collection_reversed
        map: {account_id: account_id, source_txn_id: source_txn_id, amount: amount, txn_date: txn_date, reversal_reason: payment_returned}
  - type: account_client_adjustment
    target: account_transactions
    meaning: The client credits the account for a reason that reduces what the consumer owes.
    grain: one row per client credit, identified by the client's reference.
    distinguish_by: [client_reference]
    fields:
      agreement_id: The placement agreement the account is placed under.
      amount: The credit amount.
      txn_date: The date the credit is booked.
      adjustment_reason: Why the client credited the account.
      client_reference: The client's own reference for the credit, verbatim.
    account: balance_due
    direction: out
    triggers: []
  - type: account_settlement_balance_waived
    target: account_transactions
    meaning: The remainder of the balance is waived when a settlement is fulfilled.
    grain: one row per fulfilled settlement.
    distinguish_by: [settlement_id]
    fields:
      account_id: The placed account the row books against.
      agreement_id: The placement agreement the account is placed under.
      amount: The waived remainder.
      txn_date: The fulfillment date.
      settlement_id: The fulfilled settlement.
    account: balance_due
    direction: out
    triggers: []
  - type: account_overpayment_refunded
    target: account_transactions
    meaning: An amount the consumer paid beyond what was owed is refunded and the account's credit balance returns to zero.
    grain: one row per refund, pointing to the payment that created the overpayment.
    distinguish_by: [source_txn_id]
    fields:
      agreement_id: The placement agreement the account is placed under.
      amount: The refunded amount.
      txn_date: The refund date.
      source_txn_id: The account_payment_posted row whose excess is refunded.
      payment_channel: The refund channel.
    account: balance_due
    direction: in
    triggers:
      - event: client:client_collection_reversed
        map: {account_id: account_id, source_txn_id: source_txn_id, amount: amount, txn_date: txn_date, reversal_reason: overpayment_refund}
  # ---- case records (account_case_events) ----
  - type: account_validation_info_requested
    target: account_case_events
    meaning: The consumer asks for the name and address of the original creditor or for validation information without disputing the debt.
    grain: one row per request received.
    distinguish_by: [event_date, channel]
    fields:
      event_date: The date the request was received.
      channel: How the request was received.
    triggers: []
  - type: account_dispute_received
    target: account_case_events
    meaning: The consumer disputes all or part of the debt.
    grain: one row per dispute received.
    distinguish_by: [event_date, dispute_reason]
    fields:
      event_date: The date the dispute was received.
      channel: How the dispute was received.
      dispute_reason: The consumer's stated reason.
      reference_number: For identity theft, the FTC identity theft report or police report number, verbatim; empty otherwise.
    triggers: []
  - type: account_verification_mailed
    target: account_case_events
    meaning: Verification of the debt is mailed to the consumer in answer to a dispute or validation information request.
    grain: one row per dispute or request answered.
    distinguish_by: [related_case_event_id]
    fields:
      event_date: The date verification was mailed.
      channel: Always mail.
      related_case_event_id: The dispute or request being answered.
      verification_package: The document set mailed.
    triggers: []
  - type: account_tradeline_furnished
    target: account_case_events
    meaning: Ridgeline furnishes a tradeline action for the account to the consumer reporting agencies.
    grain: one row per tradeline action per reporting period.
    distinguish_by: [report_action, reporting_period]
    fields:
      event_date: The date the action was furnished.
      report_action: Which tradeline action was furnished.
      reporting_period: The reporting month of the action.
    triggers: []
  - type: account_contact_restriction_recorded
    target: account_case_events
    meaning: A consumer's restriction on how or whether Ridgeline may contact them is recorded on the account.
    grain: one row per restriction type per account.
    distinguish_by: [restriction_type, event_date]
    fields:
      event_date: The date the request was received.
      channel: How the request was received.
      restriction_type: The kind of restriction.
      reference_number: For attorney representation, the attorney's telephone number, verbatim; empty otherwise.
    triggers: []
  - type: account_protected_status_notice
    target: account_case_events
    meaning: Ridgeline receives notice that the consumer filed for bankruptcy or has died.
    grain: one row per notice type per account.
    distinguish_by: [notice_type]
    fields:
      event_date: The date the notice was received.
      channel: How the notice was received.
      notice_type: Bankruptcy or death.
      reference_number: The bankruptcy case number or the date-of-death certificate number, verbatim.
    triggers: []
  - type: account_closure_letter_issued
    target: account_case_events
    meaning: Ridgeline issues a paid-in-full letter, a settled-in-full letter or a statement of account.
    grain: one row per letter issued.
    distinguish_by: [letter_type, event_date]
    fields:
      event_date: The date the letter was issued.
      letter_type: Which letter was issued.
      channel: How the letter was delivered.
    triggers: []

measures:
  - id: account_msr_supplemental_count
    window: The life of the placed account, from placement_date through the handling date.
    measure: Count of account_supplemental_balance_added rows on the account.
  - id: account_msr_supplemental_amount
    window: The life of the placed account, from placement_date through the handling date.
    measure: Sum of amount over account_supplemental_balance_added rows on the account.
  - id: account_msr_card_payments_30d
    window: Rolling 30 calendar days ending on the handling date, both ends included.
    measure: Sum of amount over account_payment_posted rows on the account whose payment_channel is debit_card or credit_card, excluding any payment that has an account_payment_returned row pointing to it.
  - id: account_msr_returns_in_lookback
    window: Rolling window of the stage's returned_payment_lookback_days calendar days ending on the handling date, both ends included.
    measure: Count of account_payment_returned rows on the account by txn_date.
  - id: account_msr_payments_before_term_end
    window: The stage's term_extension_lookback_days calendar days ending on the account's term_end_date, both ends included.
    measure: Count of account_payment_posted and account_direct_payment_reported rows on the account by txn_date, excluding any payment that has an account_payment_returned row pointing to it.

policies:
  - id: account_agg_multi_holding
    subject: [account_placed]
    rule: >-
      A consumer may hold any number of placed accounts at Ridgeline, one for each debt a client
      places, and debts from different clients, different placement agreements or different
      client account numbers are never merged into one account. A placement is accepted only when
      no other placed account carrying the same client account number under the same placement
      agreement is in a non-terminal status. The terminal statuses are paid_in_full,
      settled_in_full and returned_to_client; a client that re-places a debt whose earlier
      placement is terminal opens a new placed account with its own placement_date, and the
      earlier account and its history stay unchanged.
    eligibility:
      - id: no_open_duplicate_placement
        applies_to: [account_placed]
        kind: dedup
        condition: A placement is accepted only when no other placed account carrying the same client account number under the same placement agreement is in a non-terminal status.
        evidence_fields: [placed_accounts.agreement_id, placed_accounts.client_account_number, placed_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.agreement_id, placed_accounts.client_account_number]
          action_bindings:
            placed_accounts.agreement_id: agreement_id
            placed_accounts.client_account_number: client_account_number
        dedup_contract:
          table: placed_accounts
          mode: separate_record
          object_bindings: {agreement_id: agreement_id, client_account_number: client_account_number}
          duplicate_filters: {status: [placed, validation_period, active, arranged, dispute_hold, hardship_hold]}
          distinct_fields: [placement_date]
    params:
      max_per_customer: null

  - id: account_agg_payment_application
    subject: [account_payment_posted, account_overpayment_refunded]
    rule: >-
      When a consumer who holds more than one open placed account makes a single payment, the
      payment is split and applied account by account following the consumer's direction, and the
      consumer's direction prevails even when it names an account that is not the oldest. Under
      the multi-account allocation, a payment portion is applied only to a placed account whose
      status is placed, validation_period, active, arranged or hardship_hold. No portion is ever
      applied to an account that has an account_dispute_received row with no
      account_verification_mailed row answering it, even when that dispute did not place a hold.
      When the consumer gives no direction, the payment is applied first to the eligible account
      with the earliest first_delinquency_date, then to the next earliest, each account receiving
      no more than its balance_due; when two accounts share a first_delinquency_date the account
      with the smaller balance_due comes first. A consumer who holds only one open placed account
      may direct a voluntary payment to it even while it is in dispute_hold. Any amount left after
      every account named or ordered has been brought to zero is not held as a credit and is not
      moved to an account the consumer did not name; it is refunded to the consumer as
      account_overpayment_refunded against the account that received the last applied portion,
      with source_txn_id pointing to that payment row. Payments are never applied across
      consumers, and never to accounts that are paid_in_full, settled_in_full or
      returned_to_client.
    eligibility:
      - id: allocation_target_open_and_undisputed
        applies_to: [account_payment_posted]
        kind: state
        condition: Under the multi-account allocation, a payment portion is applied only to a placed account whose status is placed, validation_period, active, arranged or hardship_hold.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [placed, validation_period, active, arranged, hardship_hold]
    params:
      no_direction_order: earliest_first_delinquency_date_then_smaller_balance_due

  - id: account_placement_intake
    subject: [account_placed, account_balance_placed]
    rule: >-
      A placement is accepted only when the placing agreement's status is active; agreements in
      pending_signature, placement_hold, runoff or closed accept no new placements. The stage is
      assigned from the stage entry gates using the client file's first_delinquency_date,
      charge-off status, prior_agency_placements and, for Legal Review Placement, the days
      remaining before sol_expiry_date and a signed credit agreement on file. The placed balance
      must lie between the assigned stage's min_placed_balance_usd and max_placed_balance_usd,
      both included; a debt outside that range is not accepted at that stage. On acceptance the
      itemization_date is set from the stage's itemization_date_basis (the last statement date for
      last_statement_date, the charge_off_date for charge_off_date), stage_start_date equals
      placement_date, and term_end_date is placement_date plus the stage's placement_term_days in
      calendar days. The placed balance is booked the same day as one account_balance_placed row
      whose amount equals placed_balance. No interest, collection fee or other charge is ever
      added by Ridgeline after placement; the balance changes only through the ledger events of
      this category.
    eligibility:
      - id: placing_agreement_active
        applies_to: [account_placed]
        kind: state
        condition: A placement is accepted only when the placing agreement's status is active; agreements in pending_signature, placement_hold, runoff or closed accept no new placements.
        evidence_fields: [client_agreements.status, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        state_contract:
          field: client_agreements.status
          allowed: [active]
    params:
      balance_range_inclusive: true

  - id: account_placement_term
    subject: [account_term_extended, account_stage_converted, account_returned_to_client]
    rule: >-
      Each stage runs for its placement_term_days. The term end is counted in calendar days from
      stage_start_date, the day after stage_start_date being day one, and each term extension
      recorded in term_extension_count adds the stage's term_extension_days; the resulting date is
      the term_end_date on the account. Term-end handling happens only when the handling date is on
      or after the date reached from the stage start date recorded on the account. Only accounts
      whose status is validation_period, active or arranged can be extended or converted. At term
      end such an account is extended when its status is arranged or when
      account_msr_payments_before_term_end is at least 1, provided its term_extension_count is
      below the stage's term_extension_max_count; the extension writes the new term_end_date and
      the incremented term_extension_count. Otherwise the stage's term_end_disposition applies:
      return_to_client returns the account with close_reason term_expired, and
      convert_to_warehouse rewrites variant_name to Warehouse Placement, sets stage_start_date to
      the conversion date, sets term_end_date to the conversion date plus the Warehouse Placement
      placement_term_days and resets term_extension_count to 0. An account in dispute_hold or
      hardship_hold at term end is neither extended nor converted and is returned with
      close_reason term_expired, unless the unverified-dispute rule returns it first. A converted
      account keeps its balance, validation dates, dispute and reporting history, and no new
      validation notice is sent because neither the debt nor the collector changes.
    eligibility:
      - id: term_end_reached
        applies_to: [account_term_extended, account_stage_converted, account_returned_to_client]
        kind: time
        condition: Term-end handling happens only when the handling date is on or after the date reached from the stage start date recorded on the account.
        evidence_fields: [placed_accounts.stage_start_date, placed_accounts.term_extension_count, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the stage start date recorded on the account
          anchor_source: placed_accounts.stage_start_date
          relation: not_before
          duration_source: variants.placement_term_days
          unit: calendar_days
          counting_rule: The term end is counted in calendar days from stage_start_date, the day after stage_start_date being day one, and each term extension recorded in term_extension_count adds the stage's term_extension_days; the resulting date is the term_end_date on the account.
          boundary: inclusive
      - id: extendable_status
        applies_to: [account_term_extended, account_stage_converted]
        kind: state
        condition: Only accounts whose status is validation_period, active or arranged can be extended or converted.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active, arranged]
    params:
      per_tier:
        Early-Out Placement: {placement_term_days: =placement_term_days, term_extension_days: =term_extension_days, term_extension_max_count: =term_extension_max_count, term_end_disposition: =term_end_disposition}
        Primary Placement: {placement_term_days: =placement_term_days, term_extension_days: =term_extension_days, term_extension_max_count: =term_extension_max_count, term_end_disposition: =term_end_disposition}
        Secondary Placement: {placement_term_days: =placement_term_days, term_extension_days: =term_extension_days, term_extension_max_count: =term_extension_max_count, term_end_disposition: =term_end_disposition}
        Tertiary Placement: {placement_term_days: =placement_term_days, term_extension_days: =term_extension_days, term_extension_max_count: =term_extension_max_count, term_end_disposition: =term_end_disposition}
        Warehouse Placement: {placement_term_days: =placement_term_days, term_extension_days: =term_extension_days, term_extension_max_count: =term_extension_max_count, term_end_disposition: =term_end_disposition}
        Legal Review Placement: {placement_term_days: =placement_term_days, term_extension_days: =term_extension_days, term_extension_max_count: =term_extension_max_count, term_end_disposition: =term_end_disposition}
    measures: [account_msr_payments_before_term_end]

  - id: account_evt_validation_notice
    subject: [account_validation_notice_mailed, account_validation_period_closed]
    rule: >-
      The validation notice is the first written communication on every placed account and is
      sent within the stage's validation_notice_sla_business_days business days after
      placement_date. It is delivered by email only where the stage's
      validation_notice_email_allowed is true and the consumer's customer profile carries an email
      address; in every other case it is mailed. At sending, the validation_period_end_date is
      fixed: count validation_receipt_buffer_business_days business days after
      validation_notice_date (business days are Monday through Friday excluding US federal legal
      public holidays, and the sending day itself is not counted), then add validation_period_days
      calendar days; the resulting date is the last day of the validation period. The account
      moves from validation_period to active only when the handling date is later than the last
      day of the validation period counted from the date the validation notice was sent. A dispute
      or validation information request received on or before validation_period_end_date is a
      within-period request; one received later is an out-of-period request.
    eligibility:
      - id: validation_period_elapsed
        applies_to: [account_validation_period_closed]
        kind: time
        condition: The account moves from validation_period to active only when the handling date is later than the last day of the validation period counted from the date the validation notice was sent.
        evidence_fields: [placed_accounts.validation_notice_date, placed_accounts.validation_period_end_date, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the validation notice was sent
          anchor_source: placed_accounts.validation_notice_date
          relation: not_before
          duration_source: variants.validation_period_days
          unit: calendar_days
          counting_rule: count validation_receipt_buffer_business_days business days after validation_notice_date (business days are Monday through Friday excluding US federal legal public holidays, and the sending day itself is not counted), then add validation_period_days calendar days; the resulting date is the last day of the validation period.
          boundary: exclusive

  - id: account_evt_supplemental_balance
    subject: [account_supplemental_balance_added]
    rule: >-
      A client may add to an account only an increase in the same debt, and the reason must be
      one of the reasons listed for the account's debt_type in supplemental_reasons_by_debt_type;
      a new debt is always placed as its own account. A supplemental balance is accepted only when
      the handling date is no later than the last day of the supplemental window counted from the
      date the account was placed. The window is the stage's supplemental_balance_window_days in
      calendar days, the day after placement_date being day one and the last day included. A
      supplemental balance is accepted only on an account whose status is placed,
      validation_period, active, arranged or hardship_hold. The addition is refused when
      account_msr_supplemental_count already equals the stage's supplemental_balance_max_count, or
      when account_msr_supplemental_amount plus this addition would exceed
      supplemental_max_increase_pct percent of placed_balance. An accepted addition never changes
      an existing settlement amount or an active payment plan's total; the added amount stays owed
      on the account after the arrangement is completed.
    eligibility:
      - id: within_supplemental_window
        applies_to: [account_supplemental_balance_added]
        kind: time
        condition: A supplemental balance is accepted only when the handling date is no later than the last day of the supplemental window counted from the date the account was placed.
        evidence_fields: [placed_accounts.placement_date, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the account was placed
          anchor_source: placed_accounts.placement_date
          relation: not_after
          duration_source: variants.supplemental_balance_window_days
          unit: calendar_days
          counting_rule: The window is the stage's supplemental_balance_window_days in calendar days, the day after placement_date being day one and the last day included.
          boundary: inclusive
      - id: supplemental_open_status
        applies_to: [account_supplemental_balance_added]
        kind: state
        condition: A supplemental balance is accepted only on an account whose status is placed, validation_period, active, arranged or hardship_hold.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [placed, validation_period, active, arranged, hardship_hold]
    params:
      supplemental_reasons_by_debt_type:
        medical: [insurance_denial_rebill, billing_correction_increase]
        bank_card: [billing_correction_increase]
        utility: [final_bill_true_up, billing_correction_increase]
        telecom: [unreturned_equipment_charge, billing_correction_increase]
        auto_deficiency: [billing_correction_increase]
        private_student_loan: [billing_correction_increase]
        retail_installment: [billing_correction_increase]
    formula:
      when_not: account_msr_supplemental_count >= supplemental_balance_max_count
      max_cumulative_increase_usd: round(placed_balance * supplemental_max_increase_pct / 100, 2)
      remaining_increase_usd: max_cumulative_increase_usd - account_msr_supplemental_amount
    measures: [account_msr_supplemental_count, account_msr_supplemental_amount]

  - id: account_evt_payment_channels
    subject: [account_payment_posted, account_payment_returned]
    rule: >-
      A consumer payment is posted only to an account whose status is placed, validation_period,
      active, arranged, dispute_hold or hardship_hold; Ridgeline never solicits a payment on an
      account in dispute_hold, but a payment the consumer initiates is accepted. ACH bank debit,
      debit card, mailed check and money order are accepted at every stage; credit card only where
      the stage's credit_card_payments_accepted is true; retail cash payment network only where
      cash_network_payments_accepted is true and the payment is no more than
      cash_network_max_per_transaction_usd. A single card payment, debit or credit, may not exceed
      card_payment_max_per_transaction_usd, and account_msr_card_payments_30d plus the new card
      payment may not exceed card_payment_max_rolling_30d_usd; a single ACH payment may not exceed
      ach_payment_max_per_transaction_usd. Every payment must be at least min_payment_amount_usd
      unless it equals the full balance_due. A payment is posted on the date the funds are
      received and carries the processor or lockbox confirmation as payment_ref. A returned or
      charged-back payment is booked once, for the full amount of the original payment, with
      source_txn_id pointing to that payment; only one return may be booked against a given
      payment. When account_msr_returns_in_lookback reaches the stage's
      returned_payment_block_threshold, electronic channels (ach_bank_debit, debit_card,
      credit_card) are blocked on the account and only money order and, where accepted, retail
      cash payment network are taken. While a returned-payment block is in force, an electronic
      payment is accepted only when the handling date is later than the block period counted from
      the txn_date of the most recent returned payment. The block period is the stage's
      returned_payment_block_days in calendar days, the day after that txn_date being day one. No
      returned-payment fee is ever charged.
    eligibility:
      - id: payment_account_open
        applies_to: [account_payment_posted]
        kind: state
        condition: A consumer payment is posted only to an account whose status is placed, validation_period, active, arranged, dispute_hold or hardship_hold; Ridgeline never solicits a payment on an account in dispute_hold, but a payment the consumer initiates is accepted.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [placed, validation_period, active, arranged, dispute_hold, hardship_hold]
      - id: one_return_per_payment
        applies_to: [account_payment_returned]
        kind: dedup
        condition: only one return may be booked against a given payment.
        evidence_fields: [account_transactions.source_txn_id, account_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_transactions.source_txn_id]
          action_bindings:
            account_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: account_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [account_payment_returned]}
          distinct_fields: []
      - id: electronic_block_elapsed
        applies_to: [account_payment_posted]
        kind: time
        condition: While a returned-payment block is in force, an electronic payment is accepted only when the handling date is later than the block period counted from the txn_date of the most recent returned payment.
        evidence_fields: [account_transactions.txn_date, account_transactions.event_type, account_transactions.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_transactions.account_id]
          action_bindings:
            account_transactions.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the txn_date of the most recent returned payment
          anchor_source: account_transactions.txn_date
          relation: not_before
          duration_source: variants.returned_payment_block_days
          unit: calendar_days
          counting_rule: The block period is the stage's returned_payment_block_days in calendar days, the day after that txn_date being day one.
          boundary: exclusive
    params:
      per_tier:
        Early-Out Placement: {card_cap: =card_payment_max_per_transaction_usd, card_30d_cap: =card_payment_max_rolling_30d_usd, ach_cap: =ach_payment_max_per_transaction_usd, credit_card: =credit_card_payments_accepted, cash_network: =cash_network_payments_accepted, block_threshold: =returned_payment_block_threshold}
        Primary Placement: {card_cap: =card_payment_max_per_transaction_usd, card_30d_cap: =card_payment_max_rolling_30d_usd, ach_cap: =ach_payment_max_per_transaction_usd, credit_card: =credit_card_payments_accepted, cash_network: =cash_network_payments_accepted, block_threshold: =returned_payment_block_threshold}
        Secondary Placement: {card_cap: =card_payment_max_per_transaction_usd, card_30d_cap: =card_payment_max_rolling_30d_usd, ach_cap: =ach_payment_max_per_transaction_usd, credit_card: =credit_card_payments_accepted, cash_network: =cash_network_payments_accepted, block_threshold: =returned_payment_block_threshold}
        Tertiary Placement: {card_cap: =card_payment_max_per_transaction_usd, card_30d_cap: =card_payment_max_rolling_30d_usd, ach_cap: =ach_payment_max_per_transaction_usd, credit_card: =credit_card_payments_accepted, cash_network: =cash_network_payments_accepted, block_threshold: =returned_payment_block_threshold}
        Warehouse Placement: {card_cap: =card_payment_max_per_transaction_usd, card_30d_cap: =card_payment_max_rolling_30d_usd, ach_cap: =ach_payment_max_per_transaction_usd, credit_card: =credit_card_payments_accepted, cash_network: =cash_network_payments_accepted, block_threshold: =returned_payment_block_threshold}
        Legal Review Placement: {card_cap: =card_payment_max_per_transaction_usd, card_30d_cap: =card_payment_max_rolling_30d_usd, ach_cap: =ach_payment_max_per_transaction_usd, credit_card: =credit_card_payments_accepted, cash_network: =cash_network_payments_accepted, block_threshold: =returned_payment_block_threshold}
    formula:
      card_headroom_usd: min(card_payment_max_per_transaction_usd, card_payment_max_rolling_30d_usd - account_msr_card_payments_30d)
      electronic_blocked: account_msr_returns_in_lookback >= returned_payment_block_threshold
    measures: [account_msr_card_payments_30d, account_msr_returns_in_lookback]

  - id: account_evt_client_credits
    subject: [account_direct_payment_reported, account_client_adjustment]
    rule: >-
      Client-reported direct payments and client credits are posted only to an account whose
      status is placed, validation_period, active, arranged, dispute_hold or hardship_hold; a
      credit the client sends after the account is terminal is handled by the client and not
      booked by Ridgeline. A direct payment is posted within the stage's
      direct_payment_posting_sla_business_days business days after the client's report, dated on
      the day the consumer paid the client, with payment_channel paid_to_client and the client's
      report reference as payment_ref; each client report reference is posted only once. A client
      credit must carry a reason listed for the account's debt_type in
      adjustment_reasons_by_debt_type and the client's own reference; Ridgeline does not decide
      the amount of an insurance payment, charity-care write-off, deposit application or equipment
      credit — the amount is exactly what the client sends. When a direct payment or credit
      exceeds balance_due, the excess is not carried as a credit: the consumer's most recent
      account_payment_posted row receives an account_overpayment_refunded row for the excess, and
      when the consumer made no payment to Ridgeline on the account the excess is the client's to
      refund and nothing further is booked. A credit that brings balance_due to exactly zero
      closes the account as paid_in_full.
    eligibility:
      - id: credit_account_open
        applies_to: [account_direct_payment_reported, account_client_adjustment]
        kind: state
        condition: Client-reported direct payments and client credits are posted only to an account whose status is placed, validation_period, active, arranged, dispute_hold or hardship_hold; a credit the client sends after the account is terminal is handled by the client and not booked by Ridgeline.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [placed, validation_period, active, arranged, dispute_hold, hardship_hold]
      - id: direct_report_posted_once
        applies_to: [account_direct_payment_reported]
        kind: dedup
        condition: each client report reference is posted only once.
        evidence_fields: [account_transactions.payment_ref, account_transactions.event_type, account_transactions.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_transactions.account_id, account_transactions.payment_ref]
          action_bindings:
            account_transactions.account_id: account_id
            account_transactions.payment_ref: payment_ref
        dedup_contract:
          table: account_transactions
          mode: separate_record
          object_bindings: {account_id: account_id, payment_ref: payment_ref}
          duplicate_filters: {event_type: [account_direct_payment_reported]}
          distinct_fields: []
    params:
      adjustment_reasons_by_debt_type:
        medical: [insurance_payment, charity_care_writeoff, billing_correction]
        bank_card: [fraud_claim_credit, billing_correction]
        utility: [deposit_applied, billing_correction]
        telecom: [equipment_return_credit, billing_correction]
        auto_deficiency: [gap_insurance_payment, billing_correction]
        private_student_loan: [school_refund_credit, billing_correction]
        retail_installment: [merchandise_return_credit, billing_correction]

  - id: account_evt_dispute_and_validation
    subject: [account_dispute_received, account_validation_info_requested, account_dispute_hold_placed, account_dispute_hold_released, account_verification_mailed]
    rule: >-
      Every dispute and validation information request is recorded on the date it is received,
      with its channel; a dispute also carries its reason. Mail, email, online_portal and fax are
      written channels and phone is oral. A written dispute or a written validation information
      request places the account in dispute_hold whether it arrives inside or outside the
      validation period, and all collection activity stops until verification is mailed. An oral
      dispute places the account in dispute_hold only where the stage's oral_dispute_places_hold is
      true; elsewhere the account keeps its status, the dispute is still answered with a
      verification mailing, and a live tradeline is flagged under the credit reporting rule. A
      dispute is a repeat dispute when, within the stage's duplicate_dispute_lookback_days calendar
      days before it was received, a verification was mailed on the same account in answer to an
      earlier dispute with the same dispute_reason; a repeat dispute places no new hold and is
      answered by mailing the stage's verification_package again. A dispute with reason
      identity_theft is never treated as a repeat dispute when it carries an FTC identity theft
      report number or police report number in reference_number; such a dispute places the hold,
      no verification is mailed, and the account is returned to the client with close_reason
      identity_theft_confirmed within the stage's recall_processing_sla_business_days business
      days after the dispute's event_date. For every other hold, Ridgeline requests the stage's
      verification_package from the client, and verification is mailed within the stage's
      verification_mail_sla_business_days business days after the documents arrive; its
      related_case_event_id names the dispute or request it answers. Only one verification is
      mailed per dispute or request. Mailing the verification releases a dispute_hold to active; a
      payment plan that was suspended for the hold resumes only under the payment arrangement
      rules. A consumer's statement that a dispute was resolved never releases a hold without a
      verification mailing on record.
    eligibility:
      - id: identity_theft_report_supplied
        applies_to: [account_dispute_received]
        kind: caller_fact
        condition: A dispute with reason identity_theft is never treated as a repeat dispute when it carries an FTC identity theft report number or police report number in reference_number; such a dispute places the hold, no verification is mailed, and the account is returned to the client with close_reason identity_theft_confirmed within the stage's recall_processing_sla_business_days business days after the dispute's event_date.
        evidence_fields: [account_case_events.reference_number, account_case_events.dispute_reason, account_case_events.account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [account_case_events.account_id]
          action_bindings:
            account_case_events.account_id: account_id
      - id: one_verification_per_request
        applies_to: [account_verification_mailed]
        kind: dedup
        condition: Only one verification is mailed per dispute or request.
        evidence_fields: [account_case_events.related_case_event_id, account_case_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_case_events.related_case_event_id]
          action_bindings:
            account_case_events.related_case_event_id: related_case_event_id
        dedup_contract:
          table: account_case_events
          mode: separate_record
          object_bindings: {related_case_event_id: related_case_event_id}
          duplicate_filters: {event_type: [account_verification_mailed]}
          distinct_fields: []
    params:
      written_channels: [mail, email, online_portal, fax]
      oral_channels: [phone]
      per_tier:
        Early-Out Placement: {oral_hold: =oral_dispute_places_hold, client_due_days: =dispute_client_verification_due_days, package: =verification_package}
        Primary Placement: {oral_hold: =oral_dispute_places_hold, client_due_days: =dispute_client_verification_due_days, package: =verification_package}
        Secondary Placement: {oral_hold: =oral_dispute_places_hold, client_due_days: =dispute_client_verification_due_days, package: =verification_package}
        Tertiary Placement: {oral_hold: =oral_dispute_places_hold, client_due_days: =dispute_client_verification_due_days, package: =verification_package}
        Warehouse Placement: {oral_hold: =oral_dispute_places_hold, client_due_days: =dispute_client_verification_due_days, package: =verification_package}
        Legal Review Placement: {oral_hold: =oral_dispute_places_hold, client_due_days: =dispute_client_verification_due_days, package: =verification_package}

  - id: account_evt_unverified_dispute_return
    subject: [account_returned_to_client]
    rule: >-
      When the client has not supplied verification for a hold-placing dispute or request, the
      account is not worked further. An account in dispute_hold is returned to the client with
      close_reason unverifiable_dispute only when the handling date is later than the client
      verification period counted from the dispute's event_date and no account_verification_mailed
      row names that dispute. The client verification period is the stage's
      dispute_client_verification_due_days in calendar days, the day after the dispute's event_date
      being day one, and the account becomes returnable on the first day after the last day of
      that period. The return stops any plan or settlement on the account under their own rules
      and leads to deletion of any live tradeline under the credit reporting rule.
    eligibility:
      - id: verification_period_lapsed
        applies_to: [account_returned_to_client]
        kind: time
        condition: An account in dispute_hold is returned to the client with close_reason unverifiable_dispute only when the handling date is later than the client verification period counted from the dispute's event_date and no account_verification_mailed row names that dispute.
        evidence_fields: [account_case_events.event_date, account_case_events.related_case_event_id, account_case_events.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_case_events.account_id]
          action_bindings:
            account_case_events.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the dispute's event_date
          anchor_source: account_case_events.event_date
          relation: not_before
          duration_source: variants.dispute_client_verification_due_days
          unit: calendar_days
          counting_rule: The client verification period is the stage's dispute_client_verification_due_days in calendar days, the day after the dispute's event_date being day one, and the account becomes returnable on the first day after the last day of that period.
          boundary: exclusive

  - id: account_evt_credit_reporting
    subject: [account_tradeline_furnished]
    rule: >-
      Ridgeline furnishes collection tradelines to the consumer reporting agencies only for its own
      placements. An account is furnished to the credit bureaus only when its stage has
      credit_reporting_enabled set to true and the placing agreement's credit_reporting_authorized
      is true. Tradeline actions are furnished only for accounts whose status is
      validation_period, active, arranged, dispute_hold, hardship_hold, paid_in_full,
      settled_in_full or returned_to_client. An initial report is furnished only when the handling
      date is on or after the reporting wait counted from the date the validation notice was sent.
      The reporting wait is the stage's reporting_wait_after_notice_days in calendar days, the day
      after validation_notice_date being day one, and the report may go on the last day. For a
      medical debt an initial report is furnished only when the handling date is on or after the
      medical wait counted from the account's first_delinquency_date. The medical wait is
      medical_reporting_wait_days calendar days, the day after first_delinquency_date being day
      one. An initial report also requires balance_due at or above the debt type's amount in
      reporting_min_balance_by_debt_type, a status of active or arranged, no hardship hold whose
      tier suspends new credit reporting, and a handling date before the obsolescence date, which
      is first_delinquency_date plus obsolescence_offset_days calendar days plus
      obsolescence_years years; after the obsolescence date only a deletion may be furnished. A
      tradeline is live from its initial_report until a tradeline_deletion. A dispute received on
      an account with a live tradeline is flagged with dispute_flag_added within the stage's
      dispute_flag_sla_business_days business days after the dispute's event_date, and the flag is
      removed with dispute_flag_removed when the verification answering it is mailed. When an
      account with a live tradeline becomes paid_in_full or settled_in_full, a
      paid_status_update is furnished within the stage's paid_status_update_sla_days, except that a
      medical debt receives a tradeline_deletion instead. When an account with a live tradeline is
      returned to the client for any reason, a tradeline_deletion is furnished within the stage's
      tradeline_deletion_sla_business_days business days after closed_date. A hardship hold whose
      tier calls for a disaster special comment is reported with special_comment_added. Live
      tradelines otherwise receive a monthly_update in the file sent on the stage's
      reporting_cycle_day_of_month, and reporting_period is always the YYYY-MM month of event_date.
    eligibility:
      - id: reporting_authorized
        applies_to: [account_tradeline_furnished]
        kind: authorization
        condition: An account is furnished to the credit bureaus only when its stage has credit_reporting_enabled set to true and the placing agreement's credit_reporting_authorized is true.
        evidence_fields: [placed_accounts.variant_name, placed_accounts.agreement_id, client_agreements.credit_reporting_authorized, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
      - id: reportable_status
        applies_to: [account_tradeline_furnished]
        kind: state
        condition: Tradeline actions are furnished only for accounts whose status is validation_period, active, arranged, dispute_hold, hardship_hold, paid_in_full, settled_in_full or returned_to_client.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active, arranged, dispute_hold, hardship_hold, paid_in_full, settled_in_full, returned_to_client]
      - id: post_notice_wait
        applies_to: [account_tradeline_furnished]
        kind: time
        condition: An initial report is furnished only when the handling date is on or after the reporting wait counted from the date the validation notice was sent.
        evidence_fields: [placed_accounts.validation_notice_date, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the validation notice was sent
          anchor_source: placed_accounts.validation_notice_date
          relation: not_before
          duration_source: variants.reporting_wait_after_notice_days
          unit: calendar_days
          counting_rule: The reporting wait is the stage's reporting_wait_after_notice_days in calendar days, the day after validation_notice_date being day one, and the report may go on the last day.
          boundary: inclusive
      - id: medical_first_delinquency_wait
        applies_to: [account_tradeline_furnished]
        kind: time
        condition: For a medical debt an initial report is furnished only when the handling date is on or after the medical wait counted from the account's first_delinquency_date.
        evidence_fields: [placed_accounts.first_delinquency_date, placed_accounts.debt_type, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account's first_delinquency_date
          anchor_source: placed_accounts.first_delinquency_date
          relation: not_before
          duration_source: params.medical_reporting_wait_days
          unit: calendar_days
          counting_rule: The medical wait is medical_reporting_wait_days calendar days, the day after first_delinquency_date being day one.
          boundary: inclusive
    params:
      medical_reporting_wait_days: 365
      obsolescence_years: 7
      obsolescence_offset_days: 180
      reporting_min_balance_by_debt_type:
        medical: 500.00
        bank_card: 100.00
        utility: 100.00
        telecom: 100.00
        auto_deficiency: 250.00
        private_student_loan: 250.00
        retail_installment: 100.00
      per_tier:
        Early-Out Placement: {enabled: =credit_reporting_enabled, wait_days: =reporting_wait_after_notice_days, deletion_sla: =tradeline_deletion_sla_business_days}
        Primary Placement: {enabled: =credit_reporting_enabled, wait_days: =reporting_wait_after_notice_days, deletion_sla: =tradeline_deletion_sla_business_days}
        Secondary Placement: {enabled: =credit_reporting_enabled, wait_days: =reporting_wait_after_notice_days, deletion_sla: =tradeline_deletion_sla_business_days}
        Tertiary Placement: {enabled: =credit_reporting_enabled, wait_days: =reporting_wait_after_notice_days, deletion_sla: =tradeline_deletion_sla_business_days}
        Warehouse Placement: {enabled: =credit_reporting_enabled, wait_days: =reporting_wait_after_notice_days, deletion_sla: =tradeline_deletion_sla_business_days}
        Legal Review Placement: {enabled: =credit_reporting_enabled, wait_days: =reporting_wait_after_notice_days, deletion_sla: =tradeline_deletion_sla_business_days}

  - id: account_evt_contact_restrictions
    subject: [account_contact_restriction_recorded]
    rule: >-
      A consumer may restrict how Ridgeline contacts them, and the restriction is recorded on each
      placed account the consumer names or, when the consumer names none, on every one of the
      consumer's open placed accounts. Restrictions are recorded only on accounts whose status is
      placed, validation_period, active, arranged, dispute_hold or hardship_hold. A
      cease_all_communication restriction is recorded only from a request received through mail,
      email, online_portal or fax; a request to stop all contact made by phone is recorded as
      no_phone_calls, and the consumer is told that a full cease must be sent in writing. The
      restrictions no_phone_calls, no_workplace_contact, no_email, no_text_messages and
      inconvenient_time may be made through any channel. An attorney_representation restriction is
      recorded only when the consumer gives the attorney's telephone number, stored verbatim in
      reference_number, after which Ridgeline communicates only with the attorney. A restriction
      type already recorded on an account is not recorded again on that account. A cease does not
      stop Ridgeline from posting payments the consumer initiates, from running debits the consumer
      authorized until the consumer revokes them, from furnishing tradeline actions, from mailing
      verification or settlement and closure letters the consumer asked for, or from sending one
      notice that collection efforts are ending or that a specific remedy is being invoked.
      Restrictions apply equally at every stage; email and text restrictions are recorded even at
      stages where email_contact_allowed or text_message_contact_allowed is false, so that the
      preference survives a stage conversion.
    eligibility:
      - id: restriction_account_open
        applies_to: [account_contact_restriction_recorded]
        kind: state
        condition: Restrictions are recorded only on accounts whose status is placed, validation_period, active, arranged, dispute_hold or hardship_hold.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [placed, validation_period, active, arranged, dispute_hold, hardship_hold]
      - id: written_cease_only
        applies_to: [account_contact_restriction_recorded]
        kind: caller_fact
        condition: A cease_all_communication restriction is recorded only from a request received through mail, email, online_portal or fax; a request to stop all contact made by phone is recorded as no_phone_calls, and the consumer is told that a full cease must be sent in writing.
        evidence_fields: [account_case_events.channel, account_case_events.restriction_type, account_case_events.account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [account_case_events.account_id]
          action_bindings:
            account_case_events.account_id: account_id
      - id: restriction_recorded_once
        applies_to: [account_contact_restriction_recorded]
        kind: dedup
        condition: A restriction type already recorded on an account is not recorded again on that account.
        evidence_fields: [account_case_events.account_id, account_case_events.restriction_type, account_case_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_case_events.account_id, account_case_events.restriction_type]
          action_bindings:
            account_case_events.account_id: account_id
            account_case_events.restriction_type: restriction_type
        dedup_contract:
          table: account_case_events
          mode: separate_record
          object_bindings: {account_id: account_id, restriction_type: restriction_type}
          duplicate_filters: {event_type: [account_contact_restriction_recorded]}
          distinct_fields: [event_date]
    params:
      written_channels: [mail, email, online_portal, fax]

  - id: account_evt_protected_status
    subject: [account_protected_status_notice, account_returned_to_client]
    rule: >-
      A bankruptcy notice is recorded only when the caller provides the bankruptcy case number,
      which is stored in reference_number; a caller who only says they are thinking of filing or
      have consulted an attorney has given no bankruptcy notice. A deceased notice is recorded only
      when the caller provides the death certificate number, stored in reference_number, and
      Ridgeline afterwards speaks about the debt only with the personal representative of the
      estate. Each notice type is recorded once per account, on every open placed account of the
      consumer. From the notice onward no collection activity takes place and no payment is
      solicited or posted on the account; a plan or settlement on it is cancelled or withdrawn
      under its own rules. The account is returned to the client with close_reason
      bankruptcy_filed within the stage's bankruptcy_return_sla_business_days business days after
      the notice's event_date, or with close_reason consumer_deceased within the stage's
      deceased_return_sla_business_days business days, and a live tradeline is deleted under the
      credit reporting rule. A client recall is returned with close_reason client_recall within the
      stage's recall_processing_sla_business_days business days after the recall request is
      accepted. When more than one return reason applies on the same day, the reason recorded
      follows this order: identity_theft_confirmed, bankruptcy_filed, consumer_deceased,
      unverifiable_dispute, client_recall, term_expired.
    eligibility:
      - id: protected_status_reference_supplied
        applies_to: [account_protected_status_notice]
        kind: caller_fact
        condition: A bankruptcy notice is recorded only when the caller provides the bankruptcy case number, which is stored in reference_number; a caller who only says they are thinking of filing or have consulted an attorney has given no bankruptcy notice.
        evidence_fields: [account_case_events.reference_number, account_case_events.notice_type, account_case_events.account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [account_case_events.account_id]
          action_bindings:
            account_case_events.account_id: account_id
      - id: notice_recorded_once
        applies_to: [account_protected_status_notice]
        kind: dedup
        condition: Each notice type is recorded once per account, on every open placed account of the consumer.
        evidence_fields: [account_case_events.account_id, account_case_events.notice_type, account_case_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_case_events.account_id, account_case_events.notice_type]
          action_bindings:
            account_case_events.account_id: account_id
            account_case_events.notice_type: notice_type
        dedup_contract:
          table: account_case_events
          mode: separate_record
          object_bindings: {account_id: account_id, notice_type: notice_type}
          duplicate_filters: {event_type: [account_protected_status_notice]}
          distinct_fields: []
    params:
      close_reason_priority: [identity_theft_confirmed, bankruptcy_filed, consumer_deceased, unverifiable_dispute, client_recall, term_expired]

  - id: account_evt_resolution_and_letters
    subject: [account_paid_in_full, account_settled_in_full, account_settlement_balance_waived, account_closure_letter_issued, account_overpayment_refunded]
    rule: >-
      An account closes as paid_in_full on the day payments, direct payments and client credits
      bring balance_due to exactly zero, and as settled_in_full on the day an accepted settlement
      is fulfilled, when the remaining balance_due is waived in one account_settlement_balance_waived
      row whose amount equals that remaining balance_due. A waiver is booked only for a settlement
      whose status is fulfilled, once per settlement. A paid_in_full_letter or
      settled_in_full_letter is issued once per account and only after the final payment has
      cleared. A closure letter is issued only when the handling date is later than the clearance
      period counted from the final payment's txn_date. The clearance period is the stage's
      clearance business days for the final payment's channel (ach_clearance_business_days for
      ach_bank_debit, card_clearance_business_days for debit_card and credit_card,
      check_clearance_business_days for check_by_mail, money_order_clearance_business_days for
      money_order, cash_network_clearance_business_days for cash_payment_network), counted in
      business days after txn_date, Monday through Friday excluding US federal legal public
      holidays. The letter is then issued within the stage's pif_letter_sla_business_days business
      days, by email when the consumer asks and the profile carries an email address, otherwise by
      mail. Closure letters and statements are issued only for accounts whose status is
      validation_period, active, arranged, dispute_hold, hardship_hold, paid_in_full or
      settled_in_full; an account_statement may be issued on any date at the consumer's request,
      free of charge. An overpayment is refunded within the stage's
      overpayment_refund_sla_business_days business days after the payment that created it, to the
      same card for card payments and to the same bank account for ACH payments, and by mailed
      check (payment_channel check_by_mail) for mailed-check, money-order and cash-network payments.
    eligibility:
      - id: settlement_fulfilled_before_waiver
        applies_to: [account_settlement_balance_waived]
        kind: state
        condition: A waiver is booked only for a settlement whose status is fulfilled, once per settlement.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [fulfilled]
      - id: final_payment_cleared
        applies_to: [account_closure_letter_issued]
        kind: time
        condition: A closure letter is issued only when the handling date is later than the clearance period counted from the final payment's txn_date.
        evidence_fields: [account_transactions.txn_date, account_transactions.payment_channel, account_transactions.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_transactions.account_id]
          action_bindings:
            account_transactions.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the final payment's txn_date
          anchor_source: account_transactions.txn_date
          relation: not_before
          duration_source: variants.ach_clearance_business_days
          unit: business_days
          counting_rule: counted in business days after txn_date, Monday through Friday excluding US federal legal public holidays.
          boundary: exclusive
      - id: letter_account_status
        applies_to: [account_closure_letter_issued]
        kind: state
        condition: Closure letters and statements are issued only for accounts whose status is validation_period, active, arranged, dispute_hold, hardship_hold, paid_in_full or settled_in_full; an account_statement may be issued on any date at the consumer's request, free of charge.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active, arranged, dispute_hold, hardship_hold, paid_in_full, settled_in_full]
      - id: one_closure_letter
        applies_to: [account_closure_letter_issued]
        kind: dedup
        condition: A paid_in_full_letter or settled_in_full_letter is issued once per account and only after the final payment has cleared.
        evidence_fields: [account_case_events.account_id, account_case_events.letter_type, account_case_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [account_case_events.account_id, account_case_events.letter_type]
          action_bindings:
            account_case_events.account_id: account_id
            account_case_events.letter_type: letter_type
        dedup_contract:
          table: account_case_events
          mode: separate_record
          object_bindings: {account_id: account_id, letter_type: letter_type}
          duplicate_filters: {letter_type: [paid_in_full_letter, settled_in_full_letter]}
          distinct_fields: [event_date]
    params:
      per_tier:
        Early-Out Placement: {ach: =ach_clearance_business_days, card: =card_clearance_business_days, check: =check_clearance_business_days, money_order: =money_order_clearance_business_days, cash_network: =cash_network_clearance_business_days, letter_sla: =pif_letter_sla_business_days}
        Primary Placement: {ach: =ach_clearance_business_days, card: =card_clearance_business_days, check: =check_clearance_business_days, money_order: =money_order_clearance_business_days, cash_network: =cash_network_clearance_business_days, letter_sla: =pif_letter_sla_business_days}
        Secondary Placement: {ach: =ach_clearance_business_days, card: =card_clearance_business_days, check: =check_clearance_business_days, money_order: =money_order_clearance_business_days, cash_network: =cash_network_clearance_business_days, letter_sla: =pif_letter_sla_business_days}
        Tertiary Placement: {ach: =ach_clearance_business_days, card: =card_clearance_business_days, check: =check_clearance_business_days, money_order: =money_order_clearance_business_days, cash_network: =cash_network_clearance_business_days, letter_sla: =pif_letter_sla_business_days}
        Warehouse Placement: {ach: =ach_clearance_business_days, card: =card_clearance_business_days, check: =check_clearance_business_days, money_order: =money_order_clearance_business_days, cash_network: =cash_network_clearance_business_days, letter_sla: =pif_letter_sla_business_days}
        Legal Review Placement: {ach: =ach_clearance_business_days, card: =card_clearance_business_days, check: =check_clearance_business_days, money_order: =money_order_clearance_business_days, cash_network: =cash_network_clearance_business_days, letter_sla: =pif_letter_sla_business_days}

  - id: account_evt_status_mirroring
    subject: [account_arrangement_opened, account_arrangement_closed, account_hardship_hold_placed, account_hardship_hold_lifted]
    rule: >-
      The account status mirrors the arrangements and holds recorded against it, and the three
      kinds of suspension never stack. An account moves to arranged only when a payment plan on it
      has status active or a settlement on it has status accepted. It returns from arranged to
      active when that plan is broken, cancelled or suspended for a hardship hold that is lifted
      without the plan resuming, or when that settlement is defaulted or withdrawn, provided no
      other plan or settlement on the account is still active or accepted; a plan or settlement
      that brings balance_due to zero closes the account as paid_in_full or settled_in_full instead.
      An account moves to hardship_hold only when a hardship hold on it has status active, and
      leaves hardship_hold when that hold ends — to arranged when a payment plan suspended for the
      hold is resumed the same day, otherwise to active. Dispute hold takes precedence over both:
      an account in dispute_hold is never moved to arranged or hardship_hold, a hardship hold is
      never approved while the account is in dispute_hold, and a dispute that places a hold on an arranged or hardship_hold account
      moves it to dispute_hold. A hardship hold takes precedence over an arrangement: an arranged
      account whose hardship hold starts moves to hardship_hold and its plan is suspended under the
      payment arrangement rules.
    eligibility:
      - id: arrangement_on_record
        applies_to: [account_arrangement_opened]
        kind: authorization
        condition: An account moves to arranged only when a payment plan on it has status active or a settlement on it has status accepted.
        evidence_fields: [payment_plans.status, payment_plans.account_id, settlement_agreements.status, settlement_agreements.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.account_id]
            - [settlement_agreements.account_id]
          action_bindings:
            payment_plans.account_id: account_id
            settlement_agreements.account_id: account_id
      - id: hardship_hold_on_record
        applies_to: [account_hardship_hold_placed]
        kind: state
        condition: An account moves to hardship_hold only when a hardship hold on it has status active, and leaves hardship_hold when that hold ends — to arranged when a payment plan suspended for the hold is resumed the same day, otherwise to active.
        evidence_fields: [hardship_holds.status, hardship_holds.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id]
          action_bindings:
            hardship_holds.account_id: account_id
        state_contract:
          field: hardship_holds.status
          allowed: [active]
    params:
      suspension_precedence: [dispute_hold, hardship_hold, arranged]
