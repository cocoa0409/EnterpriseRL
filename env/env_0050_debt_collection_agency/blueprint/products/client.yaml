# Contingency Placement Agreements — the contracts creditor clients hold with Ridgeline to place
# delinquent consumer accounts for collection on contingency. One holding = one placement agreement
# of one client. Tiers are the contingency rate schedules, priced by the client's annual placement
# volume; each tier carries a contingency rate for every placement stage.

category: client
display_name: Contingency Placement Agreements

binding:
  holding_table: client_agreements
  event_tables: [client_ledger]
  intake_tables: [client_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {trust_payable: trust_payable, fees_receivable: fees_receivable}

lifecycle:
  states: [pending_signature, active, placement_hold, runoff, closed]
  transitions:
    - {from: pending_signature, to: active, by: user, means: The client signs the agreement and placements may begin.}
    - {from: pending_signature, to: closed, by: system, means: The signature window passes without the client's signature.}
    - {from: active, to: placement_hold, by: agent, means: New placements are held because fees are past due or the client asked to pause placements.}
    - {from: placement_hold, to: active, by: agent, means: The reason for the hold is cleared and placements resume.}
    - {from: active, to: runoff, by: user, means: The client's termination or non-renewal takes effect and Ridgeline works out the accounts already placed.}
    - {from: placement_hold, to: runoff, by: user, means: The client's termination or non-renewal takes effect while placements are held.}
    - {from: runoff, to: closed, by: system, means: The runoff period ends and every remaining account has been returned.}

accounts:
  - key: trust_payable
    unit: USD
    meaning: Consumer collections Ridgeline holds in its trust account for the client and has not yet remitted — collections booked less reversals, retained fees and remittances.
  - key: fees_receivable
    unit: USD
    meaning: Contingency fees and other charges the client owes Ridgeline and has not yet paid — direct-pay fees, invoiced fees, recall fees, late charges and early-termination fees less fee payments and credits.

parameter_schema:
  contingency_rate_pct_early_out: Contingency fee on collections from Early-Out Placement accounts, percent of the amount collected.
  contingency_rate_pct_primary: Contingency fee on collections from Primary Placement accounts, percent.
  contingency_rate_pct_secondary: Contingency fee on collections from Secondary Placement accounts, percent.
  contingency_rate_pct_tertiary: Contingency fee on collections from Tertiary Placement accounts, percent.
  contingency_rate_pct_warehouse: Contingency fee on collections from Warehouse Placement accounts, percent.
  contingency_rate_pct_legal_review: Contingency fee on collections from Legal Review Placement accounts, percent.
  direct_pay_fee_pct_of_rate: Share of the stage contingency rate charged on payments the consumer makes directly to the client, percent.
  direct_pay_free_window_days: Calendar days after the placement date within which a direct payment carries no fee.
  direct_pay_reporting_days: Calendar days after receiving a direct payment within which the client must report it.
  remittance_frequency_default: Remittance frequency set at onboarding, enum weekly | semi_monthly | monthly.
  weekly_remittance_available: Whether the client may choose weekly remittance, boolean.
  semi_monthly_remittance_available: Whether the client may choose semi-monthly remittance, boolean.
  remittance_sla_business_days: Business days after a remittance period ends within which the remittance is sent.
  minimum_remittance_usd: Smallest remittance sent; a smaller net amount is carried to the next period, USD.
  funds_clearance_holdback_business_days: Business days before a period end within which collections are held back to the next period until cleared.
  negative_remittance_handling: What happens when reversals exceed collections in a period, enum carry_forward | invoice.
  net_remit_available: Whether the client may be remitted net of fees, boolean.
  gross_remit_available: Whether the client may be remitted gross and invoiced for fees, boolean.
  remittance_basis_changes_per_year: Changes of remittance basis or frequency allowed per agreement year, integer.
  terms_change_effective_lead_days: Calendar days after a terms change request before the first remittance period the change can apply to begins.
  reporting_authorization_changes_per_year: Changes of credit reporting authorization allowed per agreement year, integer.
  invoice_issue_business_days: Business days after a remittance period ends within which a gross-remit fee invoice is issued.
  fee_invoice_due_days: Calendar days after the invoice date within which a fee invoice must be paid.
  late_charge_pct_per_month: Late charge on a past-due fee invoice for each full month past due, percent of the unpaid invoice amount.
  late_charge_grace_days: Calendar days after the invoice due date before a late charge accrues.
  late_charge_minimum_usd: Smallest late charge assessed, USD; 0.00 means no minimum.
  minimum_monthly_fee_usd: Smallest contingency fee billed for a calendar month with any collections, USD; 0.00 means no minimum.
  fees_offset_against_remittance: Whether past-due fees may be deducted from the next gross remittance, boolean.
  placement_hold_fee_past_due_days: Calendar days a fee invoice may stay unpaid past its due date before new placements are held.
  placement_pause_max_days: Calendar days a client-requested placement pause may last before the client must resume or give termination notice.
  fee_dispute_window_days: Calendar days after an invoice date within which the client may dispute a fee line.
  fee_credit_window_days: Calendar days after a collection is reversed within which the fee on it is credited.
  recall_fee_pct_of_contingency: Share of the stage contingency fee on the recalled balance charged as a recall fee, percent.
  recall_fee_payment_lookback_days: Calendar days before the recall within which a consumer payment makes the recall chargeable.
  free_recall_window_days: Calendar days after the placement date within which a recall is free.
  free_recall_pct_of_placements: Share of the agreement's accounts placed in the trailing 12 months that may be recalled free of the arrangement and payment test, percent.
  recall_fee_cap_usd: Largest recall fee charged on one account, USD.
  initial_term_months: Length of the first agreement term, months.
  renewal_term_months: Length of each automatic renewal term, months.
  nonrenewal_notice_days: Calendar days before the term end by which notice of non-renewal must be given.
  termination_notice_days: Calendar days of notice for termination before the term ends.
  runoff_days: Calendar days after the termination takes effect during which Ridgeline keeps working accounts already placed.
  early_termination_fee_usd: Fee when the client terminates before the end of the initial term, USD.
  signature_window_days: Calendar days after the agreement is issued within which the client must sign.
  tier_review_interval_months: Months between volume reviews of the agreement tier.
  downgrade_tolerance_pct: Percent by which trailing volume may fall below the tier's entry volume before a downgrade at review.
  volume_rebate_threshold_usd: Trailing 12-month collections above which an annual fee rebate is credited, USD; 0.00 means no rebate.
  volume_rebate_pct: Annual rebate as a percentage of contingency fees billed in the review year; 0.0 means no rebate.

