events:
  - type: flatfee_program_purchased
    target: flatfee_programs
    mutation: create
    meaning: A creditor client buys a pack of letter units.
    grain: one row per pack bought.
    fields:
      customer_id: The creditor client.
      agreement_id: The client's contingency agreement used for conversions; empty when the client has none.
      variant_name: The pack bought.
      purchase_date: The purchase date.
      expiry_date: The last day units may be used, before any grace.
      unit_price_usd: The unit price paid.
      invoice_number: The pack invoice, verbatim.
    triggers:
      - event: flatfee:flatfee_units_purchased
        map: {txn_date: purchase_date, invoice_number: invoice_number}
  - type: flatfee_program_paid
    target: flatfee_programs
    mutation: {transition: {from: pending_payment, to: active}}
    meaning: The client pays the pack invoice.
    grain: one row per transaction.
    fields:
      paid_date: The date payment was received.
    triggers: []
  - type: flatfee_program_lapsed
    target: flatfee_programs
    mutation: {transition: {from: pending_payment, to: cancelled}}
    meaning: The program is cancelled because the invoice was not paid.
    grain: one row per transaction.
    fields:
      closed_date: The cancellation date.
    triggers: []
  - type: flatfee_program_exhausted
    target: flatfee_programs
    mutation: {transition: {from: active, to: exhausted}}
    meaning: The last unit is used.
    grain: one row per transaction.
    fields:
      status: Set to exhausted.
    triggers: []
  - type: flatfee_program_reactivated
    target: flatfee_programs
    mutation: {transition: {from: exhausted, to: active}}
    meaning: A top-up makes an exhausted program usable again.
    grain: one row per transaction.
    fields:
      expiry_date: The expiry date after the top-up.
    triggers: []
  - type: flatfee_program_expired
    target: flatfee_programs
    mutation:
      transition:
        - {from: active, to: expired}
        - {from: exhausted, to: expired}
    meaning: The program reaches its expiry and unused units lapse.
    grain: one row per transaction.
    fields:
      closed_date: The first day after expiry and grace.
    triggers: []
  - type: flatfee_program_cancelled
    target: flatfee_programs
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The client cancels an active program.
    grain: one row per transaction.
    fields:
      closed_date: The cancellation date.
    triggers: []
  - type: flatfee_units_purchased
    target: flatfee_unit_ledger
    meaning: Units bought — the pack with its bonus units, or a top-up — are booked to the program.
    grain: one row per invoice.
    distinguish_by: [invoice_number]
    fields:
      units: Units booked.
      amount_usd: The invoice amount.
      txn_date: The purchase date.
      invoice_number: The invoice, verbatim.
    account: letter_units
    direction: in
    triggers: []
  - type: flatfee_units_rolled_in
    target: flatfee_unit_ledger
    meaning: Unused units of an expiring program of the same client are carried into this new program.
    grain: one row per program rolled from.
    distinguish_by: [source_program_id]
    fields:
      units: Units carried in.
      txn_date: The purchase date of the new program.
      source_program_id: The program the units came from.
    account: letter_units
    direction: in
    triggers: []
  - type: flatfee_unit_consumed
    target: flatfee_unit_ledger
    meaning: A debtor is submitted and one unit is used for the letter series.
    grain: one row per debtor submitted.
    distinguish_by: [debtor_reference, txn_date]
    fields:
      units: Always 1.
      txn_date: The submission date.
      debtor_reference: The client's account number for the debtor, verbatim.
      debtor_name: The debtor's name, verbatim.
      debtor_balance_usd: The balance demanded.
      submission_channel: How the debtor was submitted.
    account: letter_units
    direction: out
    triggers: []
  - type: flatfee_unit_credited
    target: flatfee_unit_ledger
    meaning: A unit is given back for a submission that qualifies for a credit.
    grain: one row per credited submission.
    distinguish_by: [debtor_reference, credit_reason]
    fields:
      units: Always 1.
      txn_date: The credit date.
      debtor_reference: The submission credited, verbatim.
      credit_reason: Why the unit was credited.
    account: letter_units
    direction: in
    triggers: []
  - type: flatfee_units_expired
    target: flatfee_unit_ledger
    meaning: Unused units lapse at expiry or cancellation, or leave the program in a rollover.
    grain: one row per program closure.
    distinguish_by: [txn_date]
    fields:
      units: Units lapsed or rolled out.
      txn_date: The expiry, cancellation or rollover date.
      lapse_reason: Expiry, cancellation or rollover.
    account: letter_units
    direction: out
    triggers: []
  - type: flatfee_debtor_status_reported
    target: flatfee_unit_ledger
    meaning: The client or the debtor reports a change that stops or pauses a debtor's letter series.
    grain: one row per status report per debtor.
    distinguish_by: [debtor_reference, debtor_status]
    fields:
      txn_date: The date of the report.
      debtor_reference: The debtor, verbatim.
      debtor_status: The status reported.
    triggers: []
  - type: flatfee_conversion_requested
    target: flatfee_unit_ledger
    meaning: The client asks Ridgeline to take a debtor whose series did not resolve the debt into contingency collection.
    grain: one row per debtor converted.
    distinguish_by: [debtor_reference]
    fields:
      txn_date: The date of the request.
      debtor_reference: The debtor, verbatim.
      debtor_balance_usd: The balance to be placed.
    triggers: []

measures:
  - id: flatfee_msr_credits_life
    window: The life of the program.
    measure: Count of flatfee_unit_credited rows on the program.
  - id: flatfee_msr_open_programs
    window: State on the handling date.
    measure: Count of the client's flatfee_programs rows of the same pack in pending_payment, active or exhausted status.

policies:
  - id: flatfee_agg_multi_holding
    subject: [flatfee_program_purchased]
    rule: >-
      A client may hold several pre-collect programs, typically one per billing office or brand. A
      pack is sold only while flatfee_msr_open_programs for that pack size is below the pack's
      programs_open_per_client; there is no overall cap across pack sizes. Each program keeps its
      own units, expiry and invoice, and units are never shared between programs except through the
      rollover rule.
    eligibility:
      - id: open_programs_of_size
        applies_to: [flatfee_program_purchased]
        kind: dedup
        condition: A pack is sold only while flatfee_msr_open_programs for that pack size is below the pack's programs_open_per_client; there is no overall cap across pack sizes.
        evidence_fields: [flatfee_programs.customer_id, flatfee_programs.variant_name, flatfee_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_programs.customer_id, flatfee_programs.variant_name]
          action_bindings:
            flatfee_programs.customer_id: customer_id
            flatfee_programs.variant_name: variant_name
        dedup_contract:
          table: flatfee_programs
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [pending_payment, active, exhausted]}
          distinct_fields: [purchase_date]
    params:
      max_per_customer: null
    measures: [flatfee_msr_open_programs]

  - id: flatfee_agg_rollover
    subject: [flatfee_units_rolled_in, flatfee_units_expired]
    rule: >-
      Unused units move between a client's programs only by rollover. When the client buys a new
      pack while an older program of theirs is still active or exhausted and not past its expiry,
      the older program's unused letter_units may be carried into the new program up to the new
      pack's rollover_max_pct_of_new_pack percent of its units_in_pack, rounded down to a whole unit.
      Units are rolled in only to a program whose status is pending_payment or active. The carried
      units leave the older program the same day as a rollover lapse, any units above the cap stay
      with the older program until it expires, and a program receives units from each older program
      at most once. Rolled-in units take the new program's expiry date.
    eligibility:
      - id: rollover_target_status
        applies_to: [flatfee_units_rolled_in]
        kind: state
        condition: Units are rolled in only to a program whose status is pending_payment or active.
        evidence_fields: [flatfee_programs.status, flatfee_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_programs.program_id]
          action_bindings:
            flatfee_programs.program_id: program_id
        state_contract:
          field: flatfee_programs.status
          allowed: [pending_payment, active]
    params:
      per_tier:
        First Notice 50-Unit Program: {rollover_pct: =rollover_max_pct_of_new_pack, pack_units: =units_in_pack}
        First Notice 150-Unit Program: {rollover_pct: =rollover_max_pct_of_new_pack, pack_units: =units_in_pack}
        First Notice 300-Unit Program: {rollover_pct: =rollover_max_pct_of_new_pack, pack_units: =units_in_pack}
        First Notice 600-Unit Program: {rollover_pct: =rollover_max_pct_of_new_pack, pack_units: =units_in_pack}
        First Notice 1200-Unit Program: {rollover_pct: =rollover_max_pct_of_new_pack, pack_units: =units_in_pack}
        First Notice 2500-Unit Program: {rollover_pct: =rollover_max_pct_of_new_pack, pack_units: =units_in_pack}

  - id: flatfee_evt_purchase_and_payment
    subject: [flatfee_program_paid, flatfee_program_lapsed, flatfee_units_purchased]
    rule: >-
      A pack is booked on the purchase date as units_in_pack plus bonus_units units, invoiced at
      units_in_pack times unit_price_usd; bonus units carry no price. The expiry date is the purchase
      date plus unit_validity_months months, a date missing from a short month falling on that
      month's last day. Units are booked only to a program whose status is pending_payment, active or
      exhausted. The invoice falls due invoice_due_days calendar days after purchase and units are
      usable only once it is paid. A program is paid only when the handling date is no later than
      the payment limit counted from the purchase date. The payment limit is
      unpaid_invoice_cancel_days calendar days, the day after the purchase date being day one and
      the last day included; an unpaid program is cancelled on the first day after it.
    eligibility:
      - id: units_to_open_program
        applies_to: [flatfee_units_purchased]
        kind: state
        condition: Units are booked only to a program whose status is pending_payment, active or exhausted.
        evidence_fields: [flatfee_programs.status, flatfee_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_programs.program_id]
          action_bindings:
            flatfee_programs.program_id: program_id
        state_contract:
          field: flatfee_programs.status
          allowed: [pending_payment, active, exhausted]
      - id: paid_within_limit
        applies_to: [flatfee_program_paid]
        kind: time
        condition: A program is paid only when the handling date is no later than the payment limit counted from the purchase date.
        evidence_fields: [flatfee_programs.purchase_date, flatfee_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_programs.program_id]
          action_bindings:
            flatfee_programs.program_id: program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase date
          anchor_source: flatfee_programs.purchase_date
          relation: not_after
          duration_source: variants.unpaid_invoice_cancel_days
          unit: calendar_days
          counting_rule: The payment limit is unpaid_invoice_cancel_days calendar days, the day after the purchase date being day one and the last day included; an unpaid program is cancelled on the first day after it.
          boundary: inclusive
    params:
      per_tier:
        First Notice 50-Unit Program: {units: =units_in_pack, bonus: =bonus_units, price: =unit_price_usd, validity: =unit_validity_months}
        First Notice 150-Unit Program: {units: =units_in_pack, bonus: =bonus_units, price: =unit_price_usd, validity: =unit_validity_months}
        First Notice 300-Unit Program: {units: =units_in_pack, bonus: =bonus_units, price: =unit_price_usd, validity: =unit_validity_months}
        First Notice 600-Unit Program: {units: =units_in_pack, bonus: =bonus_units, price: =unit_price_usd, validity: =unit_validity_months}
        First Notice 1200-Unit Program: {units: =units_in_pack, bonus: =bonus_units, price: =unit_price_usd, validity: =unit_validity_months}
        First Notice 2500-Unit Program: {units: =units_in_pack, bonus: =bonus_units, price: =unit_price_usd, validity: =unit_validity_months}
    formula:
      pack_invoice_usd: round(units_in_pack * unit_price_usd, 2)
      pack_units_booked: units_in_pack + bonus_units

  - id: flatfee_evt_top_up
    subject: [flatfee_units_purchased, flatfee_program_reactivated]
    rule: >-
      A paid program that is active or exhausted may be topped up with at least top_up_min_units
      units at top_up_unit_price_usd each, invoiced separately and booked on the top-up date. Where
      top_up_extends_validity is true the expiry date becomes the top-up date plus
      unit_validity_months months; elsewhere the original expiry date stands. A top-up on an
      exhausted program makes it active again the same day. An expired or cancelled program is never
      topped up; the client buys a new pack instead.
    eligibility: []
    formula:
      top_up_invoice_usd: round(units * top_up_unit_price_usd, 2)

  - id: flatfee_evt_submissions
    subject: [flatfee_unit_consumed]
    rule: >-
      Each debtor submitted uses one unit and receives the pack's letter series: letter_series_count
      letters, the first mailed within first_letter_business_days business days and the rest at
      letter_2_offset_days through letter_5_offset_days calendar days after the first. Debtors are
      submitted only to a program whose status is active, and on an expired program only within
      expiry_grace_days calendar days after the expiry date. A debt is accepted only when its debt
      type is in accepted_debt_types, the debtor is a consumer or, where commercial_debtors_accepted
      is true, a business, the balance lies between min_debtor_balance_usd and
      max_debtor_balance_usd, the debt is between min_debtor_days_past_due and
      max_debtor_days_past_due days past due, and the submission arrives through one of the pack's
      submission_channels. The same debt is not submitted again while its series is running, and
      after its series ends it may be submitted again on a new unit only after resubmission_wait_days
      calendar days. The letters are sent in Ridgeline's name as a debt collector and carry the
      federal validation information; payments go to the client.
    eligibility:
      - id: submit_to_active_program
        applies_to: [flatfee_unit_consumed]
        kind: state
        condition: Debtors are submitted only to a program whose status is active, and on an expired program only within expiry_grace_days calendar days after the expiry date.
        evidence_fields: [flatfee_programs.status, flatfee_programs.expiry_date, flatfee_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_programs.program_id]
          action_bindings:
            flatfee_programs.program_id: program_id
        state_contract:
          field: flatfee_programs.status
          allowed: [active, expired]
      - id: no_running_series_for_debt
        applies_to: [flatfee_unit_consumed]
        kind: dedup
        condition: The same debt is not submitted again while its series is running, and after its series ends it may be submitted again on a new unit only after resubmission_wait_days calendar days.
        evidence_fields: [flatfee_unit_ledger.debtor_reference, flatfee_unit_ledger.txn_date, flatfee_unit_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_unit_ledger.debtor_reference]
          action_bindings:
            flatfee_unit_ledger.debtor_reference: debtor_reference
        dedup_contract:
          table: flatfee_unit_ledger
          mode: separate_record
          object_bindings: {debtor_reference: debtor_reference}
          duplicate_filters: {event_type: [flatfee_unit_consumed]}
          distinct_fields: [txn_date]
    params:
      per_tier:
        First Notice 50-Unit Program: {letters: =letter_series_count, min_balance: =min_debtor_balance_usd, max_balance: =max_debtor_balance_usd, grace: =expiry_grace_days}
        First Notice 150-Unit Program: {letters: =letter_series_count, min_balance: =min_debtor_balance_usd, max_balance: =max_debtor_balance_usd, grace: =expiry_grace_days}
        First Notice 300-Unit Program: {letters: =letter_series_count, min_balance: =min_debtor_balance_usd, max_balance: =max_debtor_balance_usd, grace: =expiry_grace_days}
        First Notice 600-Unit Program: {letters: =letter_series_count, min_balance: =min_debtor_balance_usd, max_balance: =max_debtor_balance_usd, grace: =expiry_grace_days}
        First Notice 1200-Unit Program: {letters: =letter_series_count, min_balance: =min_debtor_balance_usd, max_balance: =max_debtor_balance_usd, grace: =expiry_grace_days}
        First Notice 2500-Unit Program: {letters: =letter_series_count, min_balance: =min_debtor_balance_usd, max_balance: =max_debtor_balance_usd, grace: =expiry_grace_days}

  - id: flatfee_evt_unit_credits
    subject: [flatfee_unit_credited]
    rule: >-
      A unit is credited back for one of these reasons only. undeliverable_address applies when the
      first letter is returned undeliverable within undeliverable_credit_window_days calendar days
      after submission and the pack does not include skip tracing; where skip_trace_included is true
      the debtor is re-mailed instead and no credit is given. withdrawn_before_first_letter applies
      when the client withdraws the debtor within withdrawal_credit_cutoff_business_days business days
      after submission. duplicate_submission applies where duplicate_submission_credit is true and the
      same debt was already in a running series. bankruptcy_scrub and deceased_scrub apply where the
      pack includes that screening and the match is found within scrub_credit_window_days calendar
      days after submission. Credits are posted within unit_credit_processing_business_days business
      days. A submission is credited at most once. No credit is given once flatfee_msr_credits_life
      has reached max_unit_credits_pct_of_pack percent of units_in_pack, and a debtor who pays after
      receiving letters never earns a credit.
    eligibility:
      - id: one_credit_per_submission
        applies_to: [flatfee_unit_credited]
        kind: dedup
        condition: A submission is credited at most once.
        evidence_fields: [flatfee_unit_ledger.debtor_reference, flatfee_unit_ledger.event_type, flatfee_unit_ledger.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_unit_ledger.program_id, flatfee_unit_ledger.debtor_reference]
          action_bindings:
            flatfee_unit_ledger.program_id: program_id
            flatfee_unit_ledger.debtor_reference: debtor_reference
        dedup_contract:
          table: flatfee_unit_ledger
          mode: separate_record
          object_bindings: {program_id: program_id, debtor_reference: debtor_reference}
          duplicate_filters: {event_type: [flatfee_unit_credited]}
          distinct_fields: []
    params:
      per_tier:
        First Notice 50-Unit Program: {skip_trace: =skip_trace_included, undeliverable_window: =undeliverable_credit_window_days, credit_cap_pct: =max_unit_credits_pct_of_pack}
        First Notice 150-Unit Program: {skip_trace: =skip_trace_included, undeliverable_window: =undeliverable_credit_window_days, credit_cap_pct: =max_unit_credits_pct_of_pack}
        First Notice 300-Unit Program: {skip_trace: =skip_trace_included, undeliverable_window: =undeliverable_credit_window_days, credit_cap_pct: =max_unit_credits_pct_of_pack}
        First Notice 600-Unit Program: {skip_trace: =skip_trace_included, undeliverable_window: =undeliverable_credit_window_days, credit_cap_pct: =max_unit_credits_pct_of_pack}
        First Notice 1200-Unit Program: {skip_trace: =skip_trace_included, undeliverable_window: =undeliverable_credit_window_days, credit_cap_pct: =max_unit_credits_pct_of_pack}
        First Notice 2500-Unit Program: {skip_trace: =skip_trace_included, undeliverable_window: =undeliverable_credit_window_days, credit_cap_pct: =max_unit_credits_pct_of_pack}
    measures: [flatfee_msr_credits_life]

  - id: flatfee_evt_debtor_status
    subject: [flatfee_debtor_status_reported]
    rule: >-
      The client reports each debtor payment within client_status_report_days calendar days of
      receiving it. A paid_in_full report stops the debtor's series within
      paid_report_letters_stop_business_days business days, and a partial_payment report pauses it
      for series_pause_on_partial_payment_days calendar days. A disputed status, recorded when the
      debtor disputes in writing, stops the series where dispute_letters_stop is true until
      verification supplied by the client within dispute_verification_due_days calendar days is
      mailed; a dispute not verified in time ends the series for good. A cease_requested status
      ends the series for good where cease_request_letters_stop is true. bankruptcy and deceased
      statuses end the series for good. Each status is recorded once per debtor, and stopping a
      series never returns the unit unless a credit reason applies.
    eligibility: []

  - id: flatfee_evt_conversion
    subject: [flatfee_conversion_requested]
    rule: >-
      A debtor whose series did not resolve the debt may be converted into contingency collection
      under the client's Contingency Placement Agreement. A conversion is requested only while the
      client's contingency agreement is active. The request is made within conversion_window_days
      calendar days after the debtor's last letter, and, where conversion_requires_series_complete
      is true, only after the whole series has been sent. A debtor reported paid_in_full, disputed
      and unverified, cease_requested, bankruptcy or deceased is never converted. The converted debt
      is placed as a new Primary Placement account under the placement charter, and its contingency
      rate is the agreement's Primary Placement rate less conversion_rate_discount_pct percentage
      points for the life of that placement.
    eligibility:
      - id: contingency_agreement_active
        applies_to: [flatfee_conversion_requested]
        kind: state
        condition: A conversion is requested only while the client's contingency agreement is active.
        evidence_fields: [client_agreements.status, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        state_contract:
          field: client_agreements.status
          allowed: [active]
    params:
      per_tier:
        First Notice 50-Unit Program: {window: =conversion_window_days, series_complete: =conversion_requires_series_complete, discount: =conversion_rate_discount_pct}
        First Notice 150-Unit Program: {window: =conversion_window_days, series_complete: =conversion_requires_series_complete, discount: =conversion_rate_discount_pct}
        First Notice 300-Unit Program: {window: =conversion_window_days, series_complete: =conversion_requires_series_complete, discount: =conversion_rate_discount_pct}
        First Notice 600-Unit Program: {window: =conversion_window_days, series_complete: =conversion_requires_series_complete, discount: =conversion_rate_discount_pct}
        First Notice 1200-Unit Program: {window: =conversion_window_days, series_complete: =conversion_requires_series_complete, discount: =conversion_rate_discount_pct}
        First Notice 2500-Unit Program: {window: =conversion_window_days, series_complete: =conversion_requires_series_complete, discount: =conversion_rate_discount_pct}

  - id: flatfee_evt_expiry_and_cancellation
    subject: [flatfee_program_exhausted, flatfee_program_expired, flatfee_program_cancelled, flatfee_units_expired]
    rule: >-
      A program becomes exhausted on the day its last unit is used. A program expires only when the
      handling date is later than the expiry counted from its purchase date. The expiry is
      unit_validity_months months after the purchase date, or after the last top-up where
      top_up_extends_validity is true, plus expiry_grace_days calendar days, a date missing from a
      short month falling on that month's last day. Unused units lapse on expiry. The client may
      cancel an active program at any time; when it does so within cancellation_refund_window_days
      calendar days after purchase it is refunded cancellation_refund_pct percent of the price of
      the unused purchased units, bonus and rolled-in units never being refunded, and otherwise
      nothing is refunded. Series already running when a program expires or is cancelled are
      completed.
    eligibility:
      - id: expiry_reached
        applies_to: [flatfee_program_expired]
        kind: time
        condition: A program expires only when the handling date is later than the expiry counted from its purchase date.
        evidence_fields: [flatfee_programs.purchase_date, flatfee_programs.expiry_date, flatfee_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [flatfee_programs.program_id]
          action_bindings:
            flatfee_programs.program_id: program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its purchase date
          anchor_source: flatfee_programs.purchase_date
          relation: not_before
          duration_source: variants.unit_validity_months
          unit: calendar_months
          counting_rule: The expiry is unit_validity_months months after the purchase date, or after the last top-up where top_up_extends_validity is true, plus expiry_grace_days calendar days, a date missing from a short month falling on that month's last day.
          boundary: exclusive
    params:
      per_tier:
        First Notice 50-Unit Program: {refund_pct: =cancellation_refund_pct, refund_window: =cancellation_refund_window_days}
        First Notice 150-Unit Program: {refund_pct: =cancellation_refund_pct, refund_window: =cancellation_refund_window_days}
        First Notice 300-Unit Program: {refund_pct: =cancellation_refund_pct, refund_window: =cancellation_refund_window_days}
        First Notice 600-Unit Program: {refund_pct: =cancellation_refund_pct, refund_window: =cancellation_refund_window_days}
        First Notice 1200-Unit Program: {refund_pct: =cancellation_refund_pct, refund_window: =cancellation_refund_window_days}
        First Notice 2500-Unit Program: {refund_pct: =cancellation_refund_pct, refund_window: =cancellation_refund_window_days}
