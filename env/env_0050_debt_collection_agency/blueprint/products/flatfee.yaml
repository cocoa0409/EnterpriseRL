# Flat-Fee Pre-Collect Programs — prepaid letter-series programmes creditor clients buy to send
# early third-party demand letters before a debt is placed for contingency collection. One holding
# = one purchased pack of letter units. Payments go to the client directly; Ridgeline earns only the
# unit price. Tiers are the pack sizes.

category: flatfee
display_name: Flat-Fee Pre-Collect Programs

binding:
  holding_table: flatfee_programs
  event_tables: [flatfee_unit_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {letter_units: letter_units}

lifecycle:
  states: [pending_payment, active, exhausted, expired, cancelled]
  transitions:
    - {from: pending_payment, to: active, by: user, means: The client pays the pack invoice and units become usable.}
    - {from: pending_payment, to: cancelled, by: system, means: The pack invoice stays unpaid past the cancellation limit.}
    - {from: active, to: exhausted, by: system, means: The last unit is used.}
    - {from: exhausted, to: active, by: agent, means: A top-up is bought and units are usable again.}
    - {from: active, to: expired, by: system, means: The validity and any grace pass and unused units lapse.}
    - {from: exhausted, to: expired, by: system, means: The validity passes on an exhausted program.}
    - {from: active, to: cancelled, by: user, means: The client cancels the program.}

accounts:
  - key: letter_units
    unit: units
    meaning: Letter units the client has paid for and may still use — units bought, bonus units, rolled-over units and credits, less units used and units lapsed.

parameter_schema:
  units_in_pack: Letter units bought in the pack, integer.
  bonus_units: Units added free with the pack, integer.
  unit_price_usd: Price of one unit in the pack, USD.
  unit_validity_months: Months after the purchase date during which units may be used.
  expiry_grace_days: Calendar days after the expiry date during which submissions are still accepted.
  invoice_due_days: Calendar days after purchase within which the pack invoice must be paid.
  unpaid_invoice_cancel_days: Calendar days after purchase after which an unpaid program is cancelled.
  top_up_min_units: Smallest top-up purchase, units.
  top_up_unit_price_usd: Price of one top-up unit, USD.
  top_up_extends_validity: Whether a top-up resets the expiry date to the top-up date plus the validity, boolean.
  rollover_max_pct_of_new_pack: Largest number of unused units carried into a new pack bought before expiry, as a percentage of the new pack's units; 0.0 means no rollover.
  letter_series_count: Letters in the series sent to each debtor, integer.
  series_length_days: Calendar days from the first to the last letter of the series.
  first_letter_business_days: Business days after submission within which the first letter is mailed.
  letter_2_offset_days: Calendar days after the first letter that the second letter is mailed.
  letter_3_offset_days: Calendar days after the first letter that the third letter is mailed.
  letter_4_offset_days: Calendar days after the first letter that the fourth letter is mailed.
  letter_5_offset_days: Calendar days after the first letter that the fifth letter is mailed; 0 where the series has four letters.
  submission_channels: List of channels through which debtors may be submitted.
  skip_trace_included: Whether a debtor whose first letter is returned undeliverable is skip-traced and re-mailed without a new unit, boolean.
  address_update_resubmission_free: Whether resubmitting the same debtor with a corrected address within the undeliverable window uses no new unit, boolean.
  undeliverable_credit_window_days: Calendar days after submission within which an undeliverable first letter earns a unit credit.
  withdrawal_credit_cutoff_business_days: Business days after submission within which a debtor withdrawn before the first letter earns a unit credit.
  duplicate_submission_credit: Whether a debtor submitted twice in an open series earns a credit for the duplicate unit, boolean.
  bankruptcy_scrub_included: Whether submissions are screened for bankruptcy and matched debtors earn a unit credit, boolean.
  deceased_scrub_included: Whether submissions are screened for deceased debtors and matched debtors earn a unit credit, boolean.
  scrub_credit_window_days: Calendar days after submission within which a scrub match earns a unit credit; 0 where scrubs are not included.
  max_unit_credits_pct_of_pack: Largest number of unit credits in the life of the program, as a percentage of the units bought.
  unit_credit_processing_business_days: Business days within which a qualifying unit credit is posted.
  min_debtor_balance_usd: Smallest debtor balance accepted, USD.
  max_debtor_balance_usd: Largest debtor balance accepted, USD.
  min_debtor_days_past_due: Days past due a debt must be before it is submitted.
  max_debtor_days_past_due: Days past due beyond which a debt is not accepted.
  accepted_debt_types: List of debt types accepted for the letter series.
  commercial_debtors_accepted: Whether business debtors may be submitted as well as consumers, boolean.
  resubmission_wait_days: Calendar days after a debtor's series ends before the same debt may be submitted again on a new unit.
  client_status_report_days: Calendar days after receiving a debtor payment within which the client must report it.
  paid_report_letters_stop_business_days: Business days after a paid-in-full report within which the series stops.
  series_pause_on_partial_payment_days: Calendar days the series pauses after the client reports a partial payment.
  dispute_verification_due_days: Calendar days the client has to supply verification after a debtor disputes.
  dispute_letters_stop: Whether the series stops when a debtor disputes until verification is mailed, boolean.
  cease_request_letters_stop: Whether the series stops for good on a debtor's written cease request, boolean.
  conversion_window_days: Calendar days after a debtor's series ends within which the debt may be converted to contingency collection.
  conversion_requires_series_complete: Whether a debtor may be converted only after the full series has been sent, boolean.
  conversion_rate_discount_pct: Percentage points taken off the client's Primary Placement contingency rate on converted debts.
  cancellation_refund_pct: Share of the value of unused purchased units refunded when the client cancels within the refund window, percent; 0.0 means no refund.
  cancellation_refund_window_days: Calendar days after purchase within which a cancellation earns the refund; 0 where none is given.
  programs_open_per_client: Largest number of open programs of this size one client may hold at once, integer.

