# Hardship and Protective Holds — temporary pauses of collection on one placed account for a
# consumer facing hardship, a declared disaster, a pending hospital financial-assistance review,
# serious illness or active military service. One holding = one hold request on one placed
# account. Tiers run from a self-attested 30-day pause to the military service hold.

category: hardship
display_name: Hardship and Protective Holds

binding:
  holding_table: hardship_holds
  event_tables: [hardship_hold_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [requested, active, ended, denied, withdrawn]
  transitions:
    - {from: requested, to: active, by: agent, means: The request is approved and the hold starts on the account.}
    - {from: requested, to: denied, by: agent, means: The request does not qualify or its documentation did not arrive in time.}
    - {from: requested, to: withdrawn, by: user, means: The consumer withdraws a request that has not been decided.}
    - {from: active, to: ended, by: agent, means: The hold reaches its end date, or ends early on the consumer's request or for a recorded reason.}

# Holds pause activity; they move no money, so this category keeps no account-style quantity.
accounts: []

parameter_schema:
  initial_hold_days: Calendar days of the first grant of the hold.
  max_extensions: Extensions allowed per hold, integer.
  extension_days: Calendar days one extension adds to the hold.
  max_hold_days_rolling_12_months: Largest number of hold days on one account in any rolling 12 months, counting holds of tiers whose hold_counts_toward_annual_limit is true.
  hold_counts_toward_annual_limit: Whether days of this tier count toward the rolling 12-month hold-day limit, boolean.
  grants_per_account_12_months: Holds of this tier one account may be granted in any rolling 12 months, integer.
  cooling_off_days_between_holds: Calendar days after the most recent hold on the account ended before a hold of this tier may start.
  denial_reapply_wait_days: Calendar days after a denial of this tier before the consumer may request it again on the same account.
  documentation_required: Whether documentation must be received before the hold is approved, boolean.
  documentation_type: The documentation this tier relies on, enum self_attestation | income_loss_evidence | disaster_area_residence_proof | financial_assistance_application | medical_or_disability_certification | active_duty_status_proof.
  documentation_due_days: Calendar days after the request within which documentation must arrive; 0 where none is required.
  documentation_resubmission_max: Times incomplete documentation may be resubmitted before the request is denied, integer.
  income_documentation_months: Months of income records required with the documentation; 0 where income records are not required.
  documented_income_drop_min_pct: Smallest documented drop in household income that qualifies, percent; 0.0 where the tier does not test income.
  decision_sla_business_days: Business days after complete documentation (or the request, where none is needed) within which the request is decided.
  hold_start_basis: Which date the hold starts from, enum decision_date | request_date.
  disaster_declaration_lookback_days: Calendar days after the disaster declaration date within which the hold must be requested; 0 where not a disaster tier.
  consumer_level_application: Whether one approved request places a hold on every open eligible account of the consumer, boolean.
  eligible_debt_types: List of debt types this tier may hold.
  eligible_account_stages: List of placement stages this tier may hold.
  min_account_balance_usd: Smallest balance_due on which this tier is granted, USD; 0.00 means any balance.
  request_channels: List of channels through which the hold may be requested.
  documentation_channels: List of channels through which documentation is accepted; empty where none is required.
  outbound_calls_paused: Whether outbound collection calls stop during the hold, boolean.
  collection_letters_paused: Whether collection letters stop during the hold, boolean.
  email_text_paused: Whether collection emails and text messages stop during the hold, boolean.
  suspend_new_credit_reporting: Whether an initial tradeline may not be furnished while the hold runs, boolean.
  tradeline_special_comment: Tradeline treatment of an account with a live tradeline when the hold starts, enum none | disaster_special_comment.
  settlement_offers_during_hold_allowed: Whether a settlement may be offered on the account while the hold runs, boolean.
  hold_ends_on_settlement_acceptance: Whether the consumer's acceptance of a settlement on the account ends the hold that day, boolean.
  hardship_plan_eligible_after_hold: Whether the ended hold qualifies the account for a Hardship Reduced-Payment Plan, boolean.
  hardship_settlement_eligible_after_hold: Whether the hold qualifies the account for a Hardship Settlement, boolean.
  post_hold_hardship_window_days: Calendar days after the hold ends during which the hardship plan or settlement remains available.
  extension_documentation_required: Whether updated documentation is required for an extension, boolean.
  extension_request_window_days: Calendar days before the hold's current end date from which an extension may be requested.
  extension_decision_sla_business_days: Business days after an extension request within which it is decided.
  review_interval_days: Calendar days between status reviews while the hold runs; 0 means no reviews.
  review_overdue_days: Calendar days after a review falls due before an unreviewed hold ends; 0 where no reviews apply.
  assistance_decision_end_days: Calendar days after the client's financial assistance decision on which the hold ends; 0 where not a financial assistance tier.
  post_service_protection_days: Calendar days the hold continues after active duty ends; 0 where not a military tier.
  client_notification_required: Whether the client is notified when the hold is approved, boolean.
  client_notification_sla_business_days: Business days after approval within which the client is notified; 0 where no notification is required.
  decision_letter_sla_business_days: Business days after the decision within which the approval or denial letter is sent.
  end_notice_days_before_end: Calendar days before the hold's current end date on which the end-of-hold notice is sent.
  contact_resume_delay_days: Calendar days after the hold ends before outbound collection contact resumes.
  voluntary_payments_accepted: Whether payments the consumer initiates are accepted during the hold, boolean.
  early_end_on_consumer_request: Whether the consumer may end the hold early at any time, boolean.
  revoke_on_invalid_documentation: Whether a hold is ended when its documentation is found invalid, boolean.

