# Legal Forwarding Agreements — agreements under which a creditor client authorizes Ridgeline to
# forward accounts to its network of collection attorneys for attorney demand, suit and judgment
# enforcement. One holding = one legal forwarding agreement of one client; each forwarded account
# is a matter recorded in the matter ledger. Tiers are the forwarding programmes.

category: legal
display_name: Legal Forwarding Agreements

binding:
  holding_table: legal_agreements
  event_tables: [legal_matter_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {cost_deposit_balance: cost_deposit_balance, cost_advance_balance: cost_advance_balance}

lifecycle:
  states: [pending_signature, active, suspended, terminated]
  transitions:
    - {from: pending_signature, to: active, by: user, means: The client signs the legal forwarding agreement.}
    - {from: pending_signature, to: terminated, by: system, means: The signature window passes unsigned.}
    - {from: active, to: suspended, by: agent, means: New forwarding stops because the cost deposit stayed short or the linked contingency agreement stopped accepting placements.}
    - {from: suspended, to: active, by: agent, means: The cause of the suspension is cleared.}
    - {from: active, to: terminated, by: user, means: The client's termination takes effect.}
    - {from: suspended, to: terminated, by: user, means: The client's termination takes effect while forwarding is suspended.}

accounts:
  - key: cost_deposit_balance
    unit: USD
    meaning: The client's cost deposit Ridgeline holds for court costs — deposits received less amounts applied to costs and refunds.
  - key: cost_advance_balance
    unit: USD
    meaning: Court and service costs paid out on the client's matters and not yet reimbursed — costs disbursed less reimbursements from the deposit, from the client or from debtor recoveries.

parameter_schema:
  contingency_rate_pct: Contingency fee on collections from a forwarded matter once it is forwarded, percent.
  suit_fee_usd: Non-refundable attorney suit fee charged to the client when a suit is filed, USD.
  demand_letter_fee_usd: Fee per attorney demand letter, USD.
  forwarding_fee_usd: Fee per account forwarded to an attorney, USD.
  suit_allowed: Whether the programme files suits, boolean.
  judgment_enforcement_allowed: Whether the programme enforces judgments, boolean.
  min_balance_for_suit_usd: Smallest balance_due on which a suit is filed, USD; 0.00 where no suits are filed.
  max_balance_for_suit_usd: Largest balance_due on which a suit is filed, USD; 0.00 where no suits are filed.
  min_days_before_sol_for_suit: Calendar days that must remain before sol_expiry_date when a suit is authorized; 0 where no suits are filed.
  demand_letters_count: Attorney demand letters sent before suit or as the whole service, integer.
  demand_letter_wait_days: Calendar days after the last attorney demand letter before a suit may be filed.
  eligible_account_stages: List of placement stages whose accounts may be forwarded under the programme.
  eligible_debt_types: List of debt types the programme accepts.
  preauthorized_suit_limit_usd: Balance at or below which a suit needs no account-by-account client authorization, USD; 0.00 means every suit needs one.
  suit_authorization_validity_days: Calendar days after a client's suit authorization within which the suit must be filed.
  max_open_matters_per_agreement: Largest number of open forwarded matters under one agreement, integer.
  cost_deposit_required_usd: Cost deposit the client must lodge before the first forwarding, USD; 0.00 where none is required.
  cost_deposit_minimum_balance_usd: Deposit balance below which the client must replenish, USD.
  deposit_replenish_due_days: Calendar days after the deposit falls below the minimum within which the client must replenish.
  suspension_deposit_shortfall_days: Calendar days the deposit may stay below the minimum before forwarding is suspended; 0 where no deposit is required.
  agency_advances_costs: Whether Ridgeline advances court costs itself, boolean.
  agency_advance_cap_per_matter_usd: Largest total of costs Ridgeline advances on one matter, USD; 0.00 where it advances none.
  cost_disbursement_approval_threshold_usd: Single cost above which the client's approval is needed before it is paid, USD; 0.00 where no costs are paid.
  cost_recovery_order: How recoveries from the debtor are applied, enum costs_first | pro_rata.
  cost_invoice_due_days: Calendar days after a cost invoice within which the client must reimburse costs the deposit did not cover.
  judgment_enforcement_wait_days: Calendar days after judgment before enforcement is filed.
  garnishment_allowed: Whether wage garnishment may be sought where state law permits, boolean.
  bank_levy_allowed: Whether a bank levy may be sought where state law permits, boolean.
  property_lien_allowed: Whether a judgment lien on real property may be recorded, boolean.
  post_judgment_interest_pass_through: Whether post-judgment interest collected is passed to the client, boolean.
  settlement_authority_after_suit_pct: Lowest percentage of the balance or judgment the attorney may accept without client approval once suit is filed; 0.0 where no suits are filed.
  consent_judgment_allowed: Whether the attorney may agree a consent judgment with a payment schedule, boolean.
  consent_judgment_min_down_payment_pct: Smallest down payment on a consent judgment, percent of the judgment; 0.0 where none are agreed.
  dismissal_fee_usd: Fee when the client asks for a filed suit to be dismissed, USD.
  recall_after_suit_fee_pct: Fee when the client recalls an account after suit is filed, percent of balance_due at recall.
  recalled_matter_costs_billed: Whether costs on a recalled matter are billed to the client, boolean.
  matter_status_report_days: Calendar days between matter status reports to the client.
  service_attempts_included: Service-of-process attempts covered before extra service costs are incurred, integer.
  skip_trace_before_suit: Whether the debtor's address is verified by skip trace before filing, boolean.
  scra_affidavit_required: Whether a servicemember status affidavit is filed before seeking a default judgment, boolean.
  statutory_attorney_fee_share_pct: Share of court-awarded attorney fees kept by the attorney, percent; the rest goes to the client.
  judgment_satisfaction_filing_days: Calendar days after a judgment is paid within which the satisfaction is filed with the court.
  uncollectible_closure_months: Months after judgment with no recovery after which a matter is closed uncollectible; 0 where no judgments are taken.
  minimum_agreement_term_months: Minimum agreement term, months.
  termination_notice_days: Calendar days of notice for terminating the agreement.
  active_matter_tail_days: Calendar days after termination during which matters already in suit continue.
  deposit_refund_days_after_termination: Calendar days after the tail ends within which the unused deposit is refunded.
  signature_window_days: Calendar days after issue within which the client must sign.

