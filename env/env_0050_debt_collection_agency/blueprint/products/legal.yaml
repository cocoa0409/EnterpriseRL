events:
  - type: legal_agreement_issued
    target: legal_agreements
    mutation: create
    meaning: Ridgeline issues a legal forwarding agreement to a creditor client for signature.
    grain: one row per agreement issued.
    fields:
      customer_id: The creditor client.
      agreement_id: The client's contingency placement agreement the forwarding runs under.
      variant_name: The forwarding programme.
      issued_date: The issue date.
    triggers: []
  - type: legal_agreement_signed
    target: legal_agreements
    mutation: {transition: {from: pending_signature, to: active}}
    meaning: The client signs the agreement.
    grain: one row per transaction.
    fields:
      signed_date: The signing date.
    triggers: []
  - type: legal_agreement_lapsed
    target: legal_agreements
    mutation: {transition: {from: pending_signature, to: terminated}}
    meaning: The agreement lapses unsigned.
    grain: one row per transaction.
    fields:
      terminated_date: The first day after the signature window.
    triggers: []
  - type: legal_forwarding_suspended
    target: legal_agreements
    mutation: {transition: {from: active, to: suspended}}
    meaning: New forwarding under the agreement is suspended.
    grain: one row per transaction.
    fields:
      suspended_date: The suspension date.
      suspension_reason: Why forwarding is suspended.
    triggers: []
  - type: legal_forwarding_resumed
    target: legal_agreements
    mutation: {transition: {from: suspended, to: active}}
    meaning: Forwarding resumes.
    grain: one row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: legal_agreement_terminated
    target: legal_agreements
    mutation:
      transition:
        - {from: active, to: terminated}
        - {from: suspended, to: terminated}
    meaning: The client's termination takes effect.
    grain: one row per transaction.
    fields:
      termination_notice_date: The date the client's notice was received.
      terminated_date: The date the termination takes effect.
    triggers: []
  - type: legal_cost_deposit_received
    target: legal_matter_events
    meaning: The client lodges or tops up its cost deposit.
    grain: one row per deposit received.
    distinguish_by: [deposit_ref]
    fields:
      amount: The amount received.
      txn_date: The date received.
      deposit_ref: The client's payment reference, verbatim.
    account: cost_deposit_balance
    direction: in
    triggers: []
  - type: legal_deposit_applied
    target: legal_matter_events
    meaning: Part of the cost deposit is applied to a cost disbursed on a matter.
    grain: one row per cost reimbursed from the deposit.
    distinguish_by: [matter_reference, cost_type, txn_date]
    fields:
      account_id: The placed account in the matter.
      matter_reference: The attorney's matter file number, verbatim.
      cost_type: The cost reimbursed.
      amount: The amount applied.
      txn_date: The date applied.
    account: cost_deposit_balance
    direction: out
    triggers:
      - event: legal:legal_cost_reimbursed
        map: {account_id: account_id, matter_reference: matter_reference, cost_type: cost_type, amount: amount, txn_date: txn_date, reimbursement_source: deposit}
  - type: legal_deposit_refunded
    target: legal_matter_events
    meaning: The unused cost deposit is refunded to the client.
    grain: one row per refund.
    distinguish_by: [txn_date]
    fields:
      amount: The amount refunded.
      txn_date: The refund date.
    account: cost_deposit_balance
    direction: out
    triggers: []
  - type: legal_cost_disbursed
    target: legal_matter_events
    meaning: A court, service or enforcement cost is paid out on a matter.
    grain: one row per cost paid.
    distinguish_by: [matter_reference, cost_type, txn_date]
    fields:
      account_id: The placed account in the matter.
      matter_reference: The attorney's matter file number, verbatim.
      cost_type: The cost paid.
      amount: The amount paid.
      txn_date: The payment date.
    account: cost_advance_balance
    direction: in
    triggers: []
  - type: legal_cost_reimbursed
    target: legal_matter_events
    meaning: A disbursed cost is reimbursed from the deposit, by the client or from a debtor recovery.
    grain: one row per reimbursement of one cost.
    distinguish_by: [matter_reference, cost_type, reimbursement_source, txn_date]
    fields:
      account_id: The placed account in the matter.
      matter_reference: The attorney's matter file number, verbatim.
      cost_type: The cost reimbursed.
      amount: The amount reimbursed.
      txn_date: The reimbursement date.
      reimbursement_source: Deposit, client payment or debtor recovery.
    account: cost_advance_balance
    direction: out
    triggers: []
  - type: legal_suit_authorized
    target: legal_matter_events
    meaning: An account is forwarded to an attorney as a matter with the client's authorization.
    grain: one row per matter opened.
    distinguish_by: [matter_reference]
    fields:
      account_id: The placed account forwarded.
      matter_reference: The attorney's matter file number, verbatim.
      txn_date: The authorization date.
      authorized_amount: The balance authorized for suit.
      authorization_ref: The client's authorization reference, verbatim; empty for a preauthorized suit.
    triggers: []
  - type: legal_suit_filed
    target: legal_matter_events
    meaning: The attorney files suit on a matter.
    grain: one row per suit filed.
    distinguish_by: [matter_reference]
    fields:
      account_id: The placed account.
      matter_reference: The matter file number, verbatim.
      txn_date: The filing date.
      court_case_number: The court's case number, verbatim.
      court_level: The court the suit was filed in.
    triggers: []
  - type: legal_judgment_entered
    target: legal_matter_events
    meaning: The court enters judgment on a matter.
    grain: one row per judgment.
    distinguish_by: [matter_reference]
    fields:
      account_id: The placed account.
      matter_reference: The matter file number, verbatim.
      txn_date: The judgment date.
      judgment_amount: The amount of the judgment.
      judgment_type: Default, consent or contested judgment.
    triggers: []
  - type: legal_enforcement_filed
    target: legal_matter_events
    meaning: The attorney files a post-judgment enforcement step.
    grain: one row per enforcement step.
    distinguish_by: [matter_reference, enforcement_type, txn_date]
    fields:
      account_id: The placed account.
      matter_reference: The matter file number, verbatim.
      txn_date: The filing date.
      enforcement_type: Garnishment, bank levy or property lien.
    triggers: []
  - type: legal_matter_closed
    target: legal_matter_events
    meaning: A matter is closed.
    grain: one row per matter closed.
    distinguish_by: [matter_reference]
    fields:
      account_id: The placed account.
      matter_reference: The matter file number, verbatim.
      txn_date: The closing date.
      matter_outcome: Why the matter closed.
    triggers: []

measures:
  - id: legal_msr_open_matters
    window: State on the handling date.
    measure: Count of legal_suit_authorized rows of the agreement with no legal_matter_closed row for the same matter_reference.
  - id: legal_msr_matter_advanced_costs
    window: The life of the matter.
    measure: Sum of amount over legal_cost_disbursed rows of the matter less legal_cost_reimbursed rows of the matter.

policies:
  - id: legal_agg_multi_holding
    subject: [legal_agreement_issued]
    rule: >-
      A creditor client holds at most one legal forwarding agreement, which covers every
      contingency agreement it has; a client wanting a different programme changes programme by
      terminating and signing a new agreement. A legal forwarding agreement is issued only when the
      client holds no other legal forwarding agreement that is pending_signature, active or
      suspended.
    eligibility:
      - id: one_legal_agreement_per_client
        applies_to: [legal_agreement_issued]
        kind: dedup
        condition: A legal forwarding agreement is issued only when the client holds no other legal forwarding agreement that is pending_signature, active or suspended.
        evidence_fields: [legal_agreements.customer_id, legal_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_agreements.customer_id]
          action_bindings:
            legal_agreements.customer_id: customer_id
        dedup_contract:
          table: legal_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_signature, active, suspended]}
          distinct_fields: [issued_date]
    params:
      max_per_customer: 1

  - id: legal_combo_contingency_link
    subject: [legal_agreement_issued, legal_suit_authorized]
    rule: >-
      Legal forwarding rides on a contingency placement: only accounts placed under the client's
      Contingency Placement Agreement are forwarded, and the legal agreement names that contingency
      agreement. A matter is opened only while the named contingency agreement's status is active or
      placement_hold. Once an account is forwarded, collections on it are charged at the programme's
      contingency_rate_pct in place of the contingency agreement's stage rate, from the matter's
      authorization date until the matter closes; collections before forwarding keep the stage rate.
      An account in a forwarded matter keeps its placed-account status, dispute, hardship and
      contact rules, and a dispute that places a hold or a bankruptcy or deceased notice stops the
      matter until it is resolved or closed.
    eligibility:
      - id: contingency_agreement_open
        applies_to: [legal_suit_authorized]
        kind: state
        condition: A matter is opened only while the named contingency agreement's status is active or placement_hold.
        evidence_fields: [client_agreements.status, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        state_contract:
          field: client_agreements.status
          allowed: [active, placement_hold]
    params:
      per_tier:
        Attorney Demand Program: {rate: =contingency_rate_pct}
        Small Claims Suit Program: {rate: =contingency_rate_pct}
        Client-Advanced Cost Suit Program: {rate: =contingency_rate_pct}
        Agency-Advanced Cost Suit Program: {rate: =contingency_rate_pct}
        Judgment Enforcement Program: {rate: =contingency_rate_pct}
        Full-Service Litigation Program: {rate: =contingency_rate_pct}

  - id: legal_evt_onboarding
    subject: [legal_agreement_signed, legal_agreement_lapsed]
    rule: >-
      The agreement binds only on the client's signature. An agreement is signed only when the
      handling date is no later than the last day of the signature window counted from its
      issued_date. The signature window is signature_window_days calendar days, the day after
      issued_date being day one and the last day included. Where cost_deposit_required_usd is above
      0.00 no account is forwarded until that deposit has been received. An unsigned agreement lapses
      on the first day after the window.
    eligibility:
      - id: legal_signature_window
        applies_to: [legal_agreement_signed]
        kind: time
        condition: An agreement is signed only when the handling date is no later than the last day of the signature window counted from its issued_date.
        evidence_fields: [legal_agreements.issued_date, legal_agreements.legal_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_agreements.legal_agreement_id]
          action_bindings:
            legal_agreements.legal_agreement_id: legal_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its issued_date
          anchor_source: legal_agreements.issued_date
          relation: not_after
          duration_source: variants.signature_window_days
          unit: calendar_days
          counting_rule: The signature window is signature_window_days calendar days, the day after issued_date being day one and the last day included.
          boundary: inclusive

  - id: legal_evt_forwarding
    subject: [legal_suit_authorized]
    rule: >-
      Matters are opened only under an agreement whose status is active. An account is forwarded only
      when its stage is in eligible_account_stages, its debt type is in eligible_debt_types, it is not
      in dispute_hold, hardship_hold or a terminal status, and legal_msr_open_matters is below
      max_open_matters_per_agreement. A suit matter also needs balance_due between
      min_balance_for_suit_usd and max_balance_for_suit_usd and at least min_days_before_sol_for_suit
      calendar days between the authorization date and sol_expiry_date; a debt past its
      sol_expiry_date is never sued on. A suit on a balance above preauthorized_suit_limit_usd needs
      the client's account-level authorization, recorded in authorization_ref. Each account is open
      in at most one matter at a time.
    eligibility:
      - id: forwarding_agreement_active
        applies_to: [legal_suit_authorized]
        kind: state
        condition: Matters are opened only under an agreement whose status is active.
        evidence_fields: [legal_agreements.status, legal_agreements.legal_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_agreements.legal_agreement_id]
          action_bindings:
            legal_agreements.legal_agreement_id: legal_agreement_id
        state_contract:
          field: legal_agreements.status
          allowed: [active]
      - id: one_open_matter_per_account
        applies_to: [legal_suit_authorized]
        kind: dedup
        condition: Each account is open in at most one matter at a time.
        evidence_fields: [legal_matter_events.account_id, legal_matter_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_matter_events.account_id]
          action_bindings:
            legal_matter_events.account_id: account_id
        dedup_contract:
          table: legal_matter_events
          mode: separate_record
          object_bindings: {account_id: account_id}
          duplicate_filters: {event_type: [legal_suit_authorized]}
          distinct_fields: [matter_reference]
    params:
      per_tier:
        Attorney Demand Program: {suits: =suit_allowed, min_balance: =min_balance_for_suit_usd, sol_days: =min_days_before_sol_for_suit, preauthorized: =preauthorized_suit_limit_usd}
        Small Claims Suit Program: {suits: =suit_allowed, min_balance: =min_balance_for_suit_usd, sol_days: =min_days_before_sol_for_suit, preauthorized: =preauthorized_suit_limit_usd}
        Client-Advanced Cost Suit Program: {suits: =suit_allowed, min_balance: =min_balance_for_suit_usd, sol_days: =min_days_before_sol_for_suit, preauthorized: =preauthorized_suit_limit_usd}
        Agency-Advanced Cost Suit Program: {suits: =suit_allowed, min_balance: =min_balance_for_suit_usd, sol_days: =min_days_before_sol_for_suit, preauthorized: =preauthorized_suit_limit_usd}
        Judgment Enforcement Program: {suits: =suit_allowed, min_balance: =min_balance_for_suit_usd, sol_days: =min_days_before_sol_for_suit, preauthorized: =preauthorized_suit_limit_usd}
        Full-Service Litigation Program: {suits: =suit_allowed, min_balance: =min_balance_for_suit_usd, sol_days: =min_days_before_sol_for_suit, preauthorized: =preauthorized_suit_limit_usd}
    measures: [legal_msr_open_matters]

  - id: legal_evt_suit_filing
    subject: [legal_suit_filed]
    rule: >-
      A suit is filed only where suit_allowed is true, after demand_letters_count attorney demand
      letters and demand_letter_wait_days calendar days after the last of them, after a skip trace
      where skip_trace_before_suit is true, and with a servicemember status affidavit ready where
      scra_affidavit_required is true. A suit is filed only when the handling date is no later than
      the authorization validity counted from the matter's authorization date. The authorization
      validity is suit_authorization_validity_days calendar days, the day after the authorization
      date being day one and the last day included; an expired authorization needs a new one. The
      suit_fee_usd is charged to the client on filing, the court is chosen by balance (small claims
      up to the state's small-claims limit), and a matter carries one suit.
    eligibility:
      - id: authorization_still_valid
        applies_to: [legal_suit_filed]
        kind: time
        condition: A suit is filed only when the handling date is no later than the authorization validity counted from the matter's authorization date.
        evidence_fields: [legal_matter_events.txn_date, legal_matter_events.matter_reference, legal_matter_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_matter_events.matter_reference]
          action_bindings:
            legal_matter_events.matter_reference: matter_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the matter's authorization date
          anchor_source: legal_matter_events.txn_date
          relation: not_after
          duration_source: variants.suit_authorization_validity_days
          unit: calendar_days
          counting_rule: The authorization validity is suit_authorization_validity_days calendar days, the day after the authorization date being day one and the last day included; an expired authorization needs a new one.
          boundary: inclusive
    params:
      per_tier:
        Attorney Demand Program: {letters: =demand_letters_count, wait: =demand_letter_wait_days, validity: =suit_authorization_validity_days, suit_fee: =suit_fee_usd}
        Small Claims Suit Program: {letters: =demand_letters_count, wait: =demand_letter_wait_days, validity: =suit_authorization_validity_days, suit_fee: =suit_fee_usd}
        Client-Advanced Cost Suit Program: {letters: =demand_letters_count, wait: =demand_letter_wait_days, validity: =suit_authorization_validity_days, suit_fee: =suit_fee_usd}
        Agency-Advanced Cost Suit Program: {letters: =demand_letters_count, wait: =demand_letter_wait_days, validity: =suit_authorization_validity_days, suit_fee: =suit_fee_usd}
        Judgment Enforcement Program: {letters: =demand_letters_count, wait: =demand_letter_wait_days, validity: =suit_authorization_validity_days, suit_fee: =suit_fee_usd}
        Full-Service Litigation Program: {letters: =demand_letters_count, wait: =demand_letter_wait_days, validity: =suit_authorization_validity_days, suit_fee: =suit_fee_usd}

  - id: legal_evt_costs_and_deposits
    subject: [legal_cost_deposit_received, legal_deposit_applied, legal_deposit_refunded, legal_cost_disbursed, legal_cost_reimbursed]
    rule: >-
      Court, service and enforcement costs are paid out per matter and are always the client's
      cost; Ridgeline adds no markup. A single cost above cost_disbursement_approval_threshold_usd is
      paid only after the client approves it. Where agency_advances_costs is false, each cost is
      reimbursed from the cost deposit the same day it is paid, and any part the deposit cannot cover
      is invoiced to the client, due within cost_invoice_due_days calendar days. Where
      agency_advances_costs is true, Ridgeline carries the costs up to agency_advance_cap_per_matter_usd
      per matter, and costs above the cap need a client deposit or payment first. Recoveries from the
      debtor reimburse outstanding costs before anything else is remitted where cost_recovery_order
      is costs_first, and in proportion to costs and balance where it is pro_rata. When the deposit
      falls below cost_deposit_minimum_balance_usd the client must replenish it within
      deposit_replenish_due_days calendar days. Each cost is reimbursed from the deposit once. The
      unused deposit is refunded within deposit_refund_days_after_termination calendar days after the
      active matter tail ends.
    eligibility:
      - id: one_deposit_application_per_cost
        applies_to: [legal_deposit_applied]
        kind: dedup
        condition: Each cost is reimbursed from the deposit once.
        evidence_fields: [legal_matter_events.matter_reference, legal_matter_events.cost_type, legal_matter_events.txn_date, legal_matter_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_matter_events.matter_reference, legal_matter_events.cost_type, legal_matter_events.txn_date]
          action_bindings:
            legal_matter_events.matter_reference: matter_reference
            legal_matter_events.cost_type: cost_type
            legal_matter_events.txn_date: txn_date
        dedup_contract:
          table: legal_matter_events
          mode: separate_record
          object_bindings: {matter_reference: matter_reference, cost_type: cost_type, txn_date: txn_date}
          duplicate_filters: {event_type: [legal_deposit_applied]}
          distinct_fields: []
    params:
      per_tier:
        Attorney Demand Program: {advances: =agency_advances_costs, cap: =agency_advance_cap_per_matter_usd, minimum_deposit: =cost_deposit_minimum_balance_usd, approval_threshold: =cost_disbursement_approval_threshold_usd}
        Small Claims Suit Program: {advances: =agency_advances_costs, cap: =agency_advance_cap_per_matter_usd, minimum_deposit: =cost_deposit_minimum_balance_usd, approval_threshold: =cost_disbursement_approval_threshold_usd}
        Client-Advanced Cost Suit Program: {advances: =agency_advances_costs, cap: =agency_advance_cap_per_matter_usd, minimum_deposit: =cost_deposit_minimum_balance_usd, approval_threshold: =cost_disbursement_approval_threshold_usd}
        Agency-Advanced Cost Suit Program: {advances: =agency_advances_costs, cap: =agency_advance_cap_per_matter_usd, minimum_deposit: =cost_deposit_minimum_balance_usd, approval_threshold: =cost_disbursement_approval_threshold_usd}
        Judgment Enforcement Program: {advances: =agency_advances_costs, cap: =agency_advance_cap_per_matter_usd, minimum_deposit: =cost_deposit_minimum_balance_usd, approval_threshold: =cost_disbursement_approval_threshold_usd}
        Full-Service Litigation Program: {advances: =agency_advances_costs, cap: =agency_advance_cap_per_matter_usd, minimum_deposit: =cost_deposit_minimum_balance_usd, approval_threshold: =cost_disbursement_approval_threshold_usd}
    measures: [legal_msr_matter_advanced_costs]

  - id: legal_evt_judgment_and_enforcement
    subject: [legal_judgment_entered, legal_enforcement_filed]
    rule: >-
      Judgments are recorded as the court enters them. A consent judgment is agreed only where
      consent_judgment_allowed is true and with a down payment of at least
      consent_judgment_min_down_payment_pct percent of the judgment. Enforcement is filed only where
      judgment_enforcement_allowed is true, and only after judgment_enforcement_wait_days calendar
      days after the judgment date; wage garnishment only where garnishment_allowed is true, bank
      levies only where bank_levy_allowed is true and property liens only where
      property_lien_allowed is true, each subject to the law of the debtor's state. Post-judgment
      interest collected goes to the client where post_judgment_interest_pass_through is true. The
      attorney may settle a judgment at or above settlement_authority_after_suit_pct percent without
      client approval. Enforcement is filed only on a matter with a recorded judgment.
    eligibility:
      - id: judgment_on_record
        applies_to: [legal_enforcement_filed]
        kind: authorization
        condition: Enforcement is filed only on a matter with a recorded judgment.
        evidence_fields: [legal_matter_events.matter_reference, legal_matter_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_matter_events.matter_reference]
          action_bindings:
            legal_matter_events.matter_reference: matter_reference
    params:
      per_tier:
        Attorney Demand Program: {enforcement: =judgment_enforcement_allowed, wait: =judgment_enforcement_wait_days, garnishment: =garnishment_allowed, levy: =bank_levy_allowed, lien: =property_lien_allowed}
        Small Claims Suit Program: {enforcement: =judgment_enforcement_allowed, wait: =judgment_enforcement_wait_days, garnishment: =garnishment_allowed, levy: =bank_levy_allowed, lien: =property_lien_allowed}
        Client-Advanced Cost Suit Program: {enforcement: =judgment_enforcement_allowed, wait: =judgment_enforcement_wait_days, garnishment: =garnishment_allowed, levy: =bank_levy_allowed, lien: =property_lien_allowed}
        Agency-Advanced Cost Suit Program: {enforcement: =judgment_enforcement_allowed, wait: =judgment_enforcement_wait_days, garnishment: =garnishment_allowed, levy: =bank_levy_allowed, lien: =property_lien_allowed}
        Judgment Enforcement Program: {enforcement: =judgment_enforcement_allowed, wait: =judgment_enforcement_wait_days, garnishment: =garnishment_allowed, levy: =bank_levy_allowed, lien: =property_lien_allowed}
        Full-Service Litigation Program: {enforcement: =judgment_enforcement_allowed, wait: =judgment_enforcement_wait_days, garnishment: =garnishment_allowed, levy: =bank_levy_allowed, lien: =property_lien_allowed}

  - id: legal_evt_matter_closure
    subject: [legal_matter_closed]
    rule: >-
      A matter closes as paid or settled when the debt is resolved, after which a satisfaction of
      judgment is filed within judgment_satisfaction_filing_days calendar days; as dismissed when the
      client asks for a filed suit to be dismissed, charging dismissal_fee_usd; as recalled when the
      client recalls the account, charging recall_after_suit_fee_pct percent of balance_due at recall
      if a suit was filed and billing the matter's costs where recalled_matter_costs_billed is true;
      and as uncollectible when uncollectible_closure_months months pass after judgment with no
      recovery. A matter is closed once. The client receives a status report every
      matter_status_report_days calendar days while a matter is open, and court-awarded attorney fees
      are shared by statutory_attorney_fee_share_pct.
    eligibility:
      - id: one_closure_per_matter
        applies_to: [legal_matter_closed]
        kind: dedup
        condition: A matter is closed once.
        evidence_fields: [legal_matter_events.matter_reference, legal_matter_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_matter_events.matter_reference]
          action_bindings:
            legal_matter_events.matter_reference: matter_reference
        dedup_contract:
          table: legal_matter_events
          mode: separate_record
          object_bindings: {matter_reference: matter_reference}
          duplicate_filters: {event_type: [legal_matter_closed]}
          distinct_fields: []

  - id: legal_evt_suspension_and_termination
    subject: [legal_forwarding_suspended, legal_forwarding_resumed, legal_agreement_terminated]
    rule: >-
      Forwarding is suspended when the cost deposit has stayed below cost_deposit_minimum_balance_usd
      for more than suspension_deposit_shortfall_days calendar days, or when the linked contingency
      agreement leaves active and placement_hold, and resumes when the cause is cleared. Suspension
      stops new matters only; open matters continue. The client terminates on termination_notice_days
      calendar days of notice, never effective before minimum_agreement_term_months months after
      signing. A termination takes effect only when the handling date is later than the notice
      period counted from the date the client's notice was received. The notice period is
      termination_notice_days calendar days, the day after the notice date being day one. Matters
      already in suit continue for active_matter_tail_days calendar days after termination, after
      which open matters are closed as recalled without the recall fee.
    eligibility:
      - id: termination_notice_served
        applies_to: [legal_agreement_terminated]
        kind: time
        condition: A termination takes effect only when the handling date is later than the notice period counted from the date the client's notice was received.
        evidence_fields: [legal_agreements.termination_notice_date, legal_agreements.legal_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [legal_agreements.legal_agreement_id]
          action_bindings:
            legal_agreements.legal_agreement_id: legal_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the client's notice was received
          anchor_source: legal_agreements.termination_notice_date
          relation: not_before
          duration_source: variants.termination_notice_days
          unit: calendar_days
          counting_rule: The notice period is termination_notice_days calendar days, the day after the notice date being day one.
          boundary: exclusive
    params:
      per_tier:
        Attorney Demand Program: {notice: =termination_notice_days, tail: =active_matter_tail_days, shortfall_days: =suspension_deposit_shortfall_days}
        Small Claims Suit Program: {notice: =termination_notice_days, tail: =active_matter_tail_days, shortfall_days: =suspension_deposit_shortfall_days}
        Client-Advanced Cost Suit Program: {notice: =termination_notice_days, tail: =active_matter_tail_days, shortfall_days: =suspension_deposit_shortfall_days}
        Agency-Advanced Cost Suit Program: {notice: =termination_notice_days, tail: =active_matter_tail_days, shortfall_days: =suspension_deposit_shortfall_days}
        Judgment Enforcement Program: {notice: =termination_notice_days, tail: =active_matter_tail_days, shortfall_days: =suspension_deposit_shortfall_days}
        Full-Service Litigation Program: {notice: =termination_notice_days, tail: =active_matter_tail_days, shortfall_days: =suspension_deposit_shortfall_days}
