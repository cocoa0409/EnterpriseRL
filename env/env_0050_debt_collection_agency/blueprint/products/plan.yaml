# Payment Arrangements — installment plans a consumer sets up to pay one placed account over time.
# One holding = one arrangement on one placed account. Tiers are the arrangement types the agency
# offers, from a short promise-to-pay to a hardship reduced-payment plan.

category: plan
display_name: Payment Arrangements

binding:
  holding_table: payment_plans
  event_tables: [plan_installments]
  status_field: status
  variant_field: variant_name
  quantity_fields: {arrangement_balance: arrangement_balance}

lifecycle:
  states: [pending_authorization, active, suspended, broken, completed, cancelled]
  transitions:
    - {from: pending_authorization, to: active, by: user, means: The consumer authorizes the schedule and the payment method, and the plan starts.}
    - {from: pending_authorization, to: cancelled, by: system, means: The authorization window passes without the consumer's authorization, or the consumer declines the terms.}
    - {from: active, to: suspended, by: agent, means: Installments stop because the account entered a dispute hold or a hardship hold.}
    - {from: suspended, to: active, by: agent, means: The hold that suspended the plan ends and installments restart on a new schedule.}
    - {from: suspended, to: cancelled, by: system, means: The plan stays suspended beyond the tier's suspension limit, or the account is returned or resolved.}
    - {from: active, to: broken, by: system, means: Uncured missed installments reach the tier's breakage count.}
    - {from: broken, to: active, by: agent, means: The consumer cures the plan within the reinstatement window and it is reinstated.}
    - {from: broken, to: cancelled, by: system, means: The reinstatement window passes without a cure, or the tier does not allow reinstatement.}
    - {from: active, to: completed, by: system, means: Every scheduled installment has been paid and the arrangement balance is zero.}
    - {from: active, to: cancelled, by: agent, means: The consumer cancels the plan, a settlement supersedes it, or the account is resolved or returned otherwise.}

accounts:
  - key: arrangement_balance
    unit: USD
    meaning: The amount still scheduled to be paid under the arrangement — the plan total less installments paid, plus installments returned, less any remainder released when the plan ends unfinished.

parameter_schema:
  max_installment_count: Largest number of installments a plan of this type may have, including any down payment, integer.
  max_weekly_installments: Largest number of installments on a weekly schedule; 0 where weekly schedules are not offered.
  max_biweekly_installments: Largest number of installments on an every-two-weeks schedule; 0 where biweekly schedules are not offered.
  max_monthly_installments: Largest number of installments on a monthly schedule, integer.
  weekly_allowed: Whether a weekly schedule may be chosen, boolean.
  biweekly_allowed: Whether an every-two-weeks schedule may be chosen, boolean.
  max_days_to_first_installment: Calendar days after the plan is created within which the first installment must fall due.
  max_days_to_final_installment: Calendar days after the plan is created within which the final installment must fall due.
  min_installment_weekly_usd: Smallest regular weekly installment, USD; 0.00 where weekly schedules are not offered.
  min_installment_biweekly_usd: Smallest regular biweekly installment, USD; 0.00 where biweekly schedules are not offered.
  min_installment_monthly_usd: Smallest regular monthly installment, USD.
  min_installment_pct_of_balance: Smallest regular installment expressed in monthly-equivalent terms as a percentage of the plan total.
  installment_rounding_unit_usd: Unit to which regular installments are rounded up, USD; the final installment absorbs the difference.
  down_payment_required_pct: Down payment required as a percentage of the plan total; 0.0 means none.
  down_payment_due_days: Calendar days after plan creation within which the down payment falls due.
  eligible_account_stages: List of placement stages whose accounts may take this plan type.
  authorization_window_days: Calendar days after creation within which the consumer must authorize the plan.
  autopay_required: Whether installments must be collected by automatic debit, boolean.
  card_autopay_allowed: Whether automatic debit from a debit or credit card may be chosen, boolean.
  manual_pay_allowed: Whether the consumer may pay each installment manually, boolean.
  cash_network_installments_allowed: Whether manual installments may be paid through a retail cash payment network, boolean.
  grace_period_days_manual: Calendar days after a due date before an unpaid manually paid installment is missed.
  grace_period_days_autopay: Calendar days after a failed automatic debit before the installment is missed.
  partial_payment_tolerance_usd: Shortfall against an installment below which the installment still counts as paid, USD.
  missed_installments_to_break: Number of uncured missed installments at which the plan is broken, integer.
  ach_represent_max_attempts: Times a returned ACH installment may be presented again, integer.
  represent_delay_business_days: Business days after a return before an ACH installment is presented again.
  reinstatement_window_days: Calendar days after a plan breaks within which it may be reinstated; 0 means it cannot be.
  reinstatement_max_count: Largest number of reinstatements over the life of the plan, integer.
  reinstatement_cure_requirement: What must be paid to reinstate, enum not_reinstatable | all_missed_installments | one_installment.
  due_date_change_max_per_12_months: Due-date changes allowed in any rolling 12 months, integer.
  due_date_change_max_shift_days: Largest number of calendar days one due-date change may move the next due date.
  monthly_due_day_max: Latest day of the month a monthly due date may fall on, integer.
  restructure_max_per_12_months: Restructures of the installment amount and count allowed in any rolling 12 months, integer.
  restructure_min_installments_paid: Installments that must already be paid before a restructure, integer.
  deferral_max_per_12_months: Installment deferrals allowed in any rolling 12 months, integer.
  deferral_min_installments_paid: Installments that must already be paid before a deferral, integer.
  extra_payment_application: How a payment above the installment is applied, enum reduce_remaining_count | advance_next_due.
  broken_plan_cooling_off_days: Calendar days after a plan on the same account was cancelled as broken before this plan type can be set up again.
  broken_plans_limit_12_months: Plans on the same account cancelled as broken in the last 12 months at which this plan type is no longer offered, integer.
  affordability_max_pct_of_income: Largest share of stated net monthly income all of the consumer's monthly-equivalent installments may take, percent; 0.0 means no affordability test.
  budget_review_required: Whether the consumer's stated net monthly income must be taken before this plan type is set up, boolean.
  suspension_max_days: Calendar days a plan may stay suspended before it is cancelled.
  resume_min_days_to_next_installment: Calendar days after resumption before the next installment may fall due.
  stop_payment_notice_business_days: Business days before a scheduled debit by which a revocation must be received to stop that debit.
  funding_change_max_per_12_months: Changes of payment method allowed in any rolling 12 months, integer.
  recorded_oral_authorization_allowed: Whether a recorded telephone authorization suffices, instead of an electronic signature, boolean.
  card_autopay_max_installment_usd: Largest installment that may be collected by card automatic debit, USD; 0.00 where card autopay is not offered.
  weekly_requires_autopay: Whether a weekly schedule must be collected by automatic debit, boolean.

