events:
  # ---- holding writes (settlement_agreements) ----
  - type: settle_offer_issued
    target: settlement_agreements
    mutation: create
    meaning: Ridgeline extends a written settlement offer on one placed account.
    grain: one row per offer extended.
    fields:
      customer_id: The consumer who owes the account.
      account_id: The placed account the offer would settle.
      approval_request_id: The client approval relied on when the offer is below Ridgeline's own authority; empty otherwise.
      variant_name: The settlement programme.
      offer_date: The date the offer is extended.
      offer_expiry_date: The last day the offer may be accepted.
      balance_at_offer: The account's balance_due on the offer date.
      settlement_pct: The settlement percentage offered.
      settlement_amount: The amount that settles the account.
      payment_count: The number of settlement payments.
      payment_interval_days: Calendar days between consecutive settlement payments; 0 for a single payment.
      first_payment_due_date: The due date of the first settlement payment if accepted on the offer date.
      final_payment_due_date: The due date of the final settlement payment if accepted on the offer date.
      bundle_applied: Whether the bundle floor reduction was used.
    triggers:
      - event: settle:settle_letter_issued
        map: {letter_type: offer_letter, txn_date: offer_date}
  - type: settle_offer_accepted
    target: settlement_agreements
    mutation: {transition: {from: offered, to: accepted}}
    meaning: The consumer accepts the settlement offer.
    grain: one row per transaction.
    fields:
      accepted_date: The date of acceptance.
      acceptance_method: Recorded call, portal acceptance or electronic signature.
      first_payment_due_date: The due date of the first payment counted from acceptance.
      final_payment_due_date: The due date of the final payment counted from acceptance.
    triggers:
      - event: settle:settle_amount_scheduled
        map: {txn_date: accepted_date}
      - event: settle:settle_letter_issued
        map: {letter_type: acceptance_confirmation, txn_date: accepted_date}
      - event: account:account_arrangement_opened
  - type: settle_offer_expired
    target: settlement_agreements
    mutation: {transition: {from: offered, to: expired}}
    meaning: The offer lapses unaccepted.
    grain: one row per transaction.
    fields:
      closed_date: The first day after offer_expiry_date.
    triggers: []
  - type: settle_offer_withdrawn
    target: settlement_agreements
    mutation:
      transition:
        - {from: offered, to: withdrawn}
        - {from: accepted, to: withdrawn}
    meaning: Ridgeline withdraws an open or accepted settlement.
    grain: one row per transaction.
    fields:
      closed_date: The withdrawal date.
      withdrawal_reason: Why the settlement was withdrawn.
    triggers: []
  - type: settle_defaulted
    target: settlement_agreements
    mutation: {transition: {from: accepted, to: defaulted}}
    meaning: An accepted settlement defaults because a payment was not made in time or too many payments were returned.
    grain: one row per transaction.
    fields:
      closed_date: The default date.
    triggers:
      - event: settle:settle_balance_released
        map: {txn_date: closed_date, release_reason: default}
      - event: settle:settle_letter_issued
        map: {letter_type: default_notice, txn_date: closed_date}
      - event: account:account_arrangement_closed
  - type: settle_fulfilled
    target: settlement_agreements
    mutation: {transition: {from: accepted, to: fulfilled}}
    meaning: Every settlement payment has been made and has cleared, and the account is settled.
    grain: one row per transaction.
    fields:
      closed_date: The fulfillment date.
      waived_amount: The account balance_due waived on fulfillment.
    triggers:
      - event: account:account_settlement_balance_waived
        map: {amount: waived_amount, txn_date: closed_date, settlement_id: settlement_id, account_id: account_id}
      - event: account:account_settled_in_full
        map: {closed_date: closed_date}
  - type: settle_due_date_extended
    target: settlement_agreements
    mutation: update
    meaning: The consumer is granted more time for the next unpaid settlement payment and every later one.
    grain: one row per transaction.
    fields:
      due_date_extension_count: The number of extensions granted, after this one.
      extension_days_total: The total calendar days added by all extensions.
      final_payment_due_date: The final payment due date after the extension.
    triggers: []
  # ---- ledger writes (settlement_payments) ----
  - type: settle_amount_scheduled
    target: settlement_payments
    meaning: The settlement amount is booked to the settlement on acceptance.
    grain: one row per accepted settlement.
    distinguish_by: [txn_date]
    fields:
      account_id: The placed account being settled.
      amount: The settlement amount.
      txn_date: The acceptance date.
    account: settlement_balance
    direction: in
    triggers: []
  - type: settle_payment_received
    target: settlement_payments
    meaning: A settlement payment is received.
    grain: one row per payment received, identified by its processor confirmation.
    distinguish_by: [payment_ref]
    fields:
      account_id: The placed account being settled.
      payment_number: The settlement payment the funds are applied to.
      due_date: The due date of that payment.
      amount: The amount received.
      txn_date: The date the funds were received.
      payment_channel: How the payment was made.
      payment_ref: The processor confirmation number, verbatim.
    account: settlement_balance
    direction: out
    triggers:
      - event: account:account_payment_posted
        map: {account_id: account_id, amount: amount, txn_date: txn_date, payment_channel: payment_channel, payment_ref: payment_ref, settlement_id: settlement_id}
  - type: settle_payment_returned
    target: settlement_payments
    meaning: A settlement payment is returned unpaid or charged back.
    grain: one row per returned payment, pointing to the original payment.
    distinguish_by: [source_settle_txn_id]
    fields:
      account_id: The placed account being settled.
      payment_number: The settlement payment the returned funds had been applied to.
      amount: The returned amount.
      txn_date: The date the return was received.
      source_settle_txn_id: The settle_payment_received row being returned.
      payment_channel: The channel of the original payment.
      return_reason: Why the payment was returned.
    account: settlement_balance
    direction: in
    triggers:
      - event: account:account_payment_returned
        map: {account_id: account_id, amount: amount, txn_date: txn_date, payment_channel: payment_channel, return_reason: return_reason}
  - type: settle_balance_released
    target: settlement_payments
    meaning: When an accepted settlement defaults or is withdrawn, the amount still due under it is released and the discount is lost.
    grain: one row per defaulted or withdrawn accepted settlement.
    distinguish_by: [release_reason]
    fields:
      account_id: The placed account.
      amount: The settlement balance remaining.
      txn_date: The default or withdrawal date.
      release_reason: Default or withdrawal.
    account: settlement_balance
    direction: out
    triggers: []
  - type: settle_letter_issued
    target: settlement_payments
    meaning: Ridgeline sends a settlement letter — the written offer, the acceptance confirmation or the default notice.
    grain: one row per letter type per settlement.
    distinguish_by: [letter_type]
    fields:
      account_id: The placed account.
      letter_type: Which settlement letter.
      txn_date: The date the letter is sent.
      delivery_channel: Mail or email.
      disclosure_variant: Standard terms or terms carrying the time-barred disclosure.
      tax_notice_included: Whether the cancelled-debt tax notice is included.
    triggers: []

measures:
  - id: settle_msr_offers_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of settlement_agreements rows on the same placed account by offer_date, every programme and status included.
  - id: settle_msr_returned_payments
    window: The life of the accepted settlement.
    measure: Count of settle_payment_returned rows on the settlement.
  - id: settle_msr_paid_total
    window: The life of the accepted settlement, through the handling date.
    measure: Sum of amount over settle_payment_received rows on the settlement less the amount of settle_payment_returned rows pointing to them.
  - id: settle_msr_declined_approvals_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of settlement_approval_requests rows on the same placed account with request_status declined, by decision_date.

policies:
  - id: settle_agg_multi_holding
    subject: [settle_offer_issued]
    rule: >-
      A consumer may hold settlements on any number of placed accounts, but each settlement covers
      exactly one placed account. A new offer is extended only when no other settlement on the
      same placed account is offered or accepted; a consumer who wants different terms on an open
      offer has the open offer withdrawn with reason superseded_by_new_offer before the new one is
      extended, and an accepted settlement is never replaced while it is in good standing.
    eligibility:
      - id: one_open_settlement_per_account
        applies_to: [settle_offer_issued]
        kind: dedup
        condition: A new offer is extended only when no other settlement on the same placed account is offered or accepted; a consumer who wants different terms on an open offer has the open offer withdrawn with reason superseded_by_new_offer before the new one is extended, and an accepted settlement is never replaced while it is in good standing.
        evidence_fields: [settlement_agreements.account_id, settlement_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.account_id]
          action_bindings:
            settlement_agreements.account_id: account_id
        dedup_contract:
          table: settlement_agreements
          mode: separate_record
          object_bindings: {account_id: account_id}
          duplicate_filters: {status: [offered, accepted]}
          distinct_fields: [offer_date]
    params:
      max_per_customer: null

  - id: settle_agg_same_client_bundle
    subject: [settle_offer_issued]
    rule: >-
      Settlements are combined across a consumer's accounts only through the same-client bundle.
      When the consumer settles together every one of their open placed accounts placed under the
      same client agreement, the accounts number at least the programme's bundle_min_accounts, and
      every offer in the bundle uses a programme whose bundle_floor_reduction_pct is above 0.0, each
      offer's floor is lowered by that programme's bundle_floor_reduction_pct and the offers carry
      bundle_applied true. All offers of a bundle are extended on the same offer_date and use the
      same programme. Accounts under different client agreements never form a bundle, even when the
      original creditor is the same, and an account in dispute_hold, or one that cannot take a
      settlement for any other reason, stops the bundle for every account under that agreement
      because the bundle must cover all of them. If any offer of a bundle later expires, defaults
      or is withdrawn, the other offers keep their terms; the reduction is not taken back.
    eligibility: []
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Lump-Sum Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Two-Payment Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Three-Payment Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Six-Payment Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Hardship Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}

  - id: settle_offer_authority
    subject: [settle_offer_issued]
    rule: >-
      A settlement offer is extended only on a placed account whose status is validation_period,
      active, arranged or hardship_hold; accounts in placed, dispute_hold or any terminal status
      receive no offer. The programme's floor for the account is read from its authority floor for
      the account's stage (authority_floor_pct_early_out through authority_floor_pct_legal_review),
      lowered by the percentage points listed for the placing agreement's tier in
      client_tier_floor_reduction_pct and by any bundle reduction, but never below the programme's
      approval floor for the same stage; a stage whose authority floor is 100.0 is not offered that
      programme. Ridgeline may offer any settlement_pct at or above that floor on its own authority;
      a lower percentage, down to the approval floor and no further, needs a client approval on
      record. A Prompt-Pay Discount Settlement is always offered at 100.0 less
      prompt_pay_discount_pct. The settlement amount is balance_at_offer times settlement_pct,
      rounded up to the programme's settlement_rounding_unit_usd, and may not be below
      min_settlement_amount_usd. Client approval is also needed, whatever the percentage, when
      balance_at_offer exceeds max_settlement_balance_usd or balance_at_offer less the settlement
      amount exceeds max_waiver_usd. The offer date is the handling date and offer_expiry_date is the
      offer date plus offer_validity_days calendar days. A programme is offered only when the
      handling date is on or after the programme's waiting period counted from the account's
      placement_date. The waiting period is the programme's min_days_since_placement in calendar days,
      the day after placement_date being day one. A programme is not offered again on an account
      when the handling date is not later than the cooling-off period counted from the closed_date of
      the account's most recent settlement that expired or defaulted. The cooling-off period is the
      new programme's reoffer_cooling_off_days in calendar days, the day after that closed_date being
      day one. When settle_msr_offers_12m has reached a programme's max_offers_per_account_12_months
      that programme is not offered. The schedule offered has between payment_count_min and
      payment_count_max payments; the first payment is at least min_first_payment_pct of the
      settlement amount, the rest is split evenly over the remaining payments rounded up to the cent
      with the final payment absorbing the rounding, every payment but a clearing final one is at
      least min_payment_amount_usd, the first falls due within first_payment_max_days_after_acceptance
      calendar days of acceptance, payments are payment_interval_days apart with the interval no
      more than max_days_between_payments, later payments never fall after the
      settlement_payment_due_day_max day of a month, and the final payment falls due within
      settlement_window_max_days calendar days of acceptance. The due dates on the offer assume
      acceptance on the offer date and are recomputed from the actual acceptance date.
    eligibility:
      - id: offer_account_status
        applies_to: [settle_offer_issued]
        kind: state
        condition: A settlement offer is extended only on a placed account whose status is validation_period, active, arranged or hardship_hold; accounts in placed, dispute_hold or any terminal status receive no offer.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active, arranged, hardship_hold]
      - id: placement_waiting_period
        applies_to: [settle_offer_issued]
        kind: time
        condition: A programme is offered only when the handling date is on or after the programme's waiting period counted from the account's placement_date.
        evidence_fields: [placed_accounts.placement_date, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account's placement_date
          anchor_source: placed_accounts.placement_date
          relation: not_before
          duration_source: variants.min_days_since_placement
          unit: calendar_days
          counting_rule: The waiting period is the programme's min_days_since_placement in calendar days, the day after placement_date being day one.
          boundary: inclusive
      - id: reoffer_cooling_off
        applies_to: [settle_offer_issued]
        kind: time
        condition: A programme is not offered again on an account when the handling date is not later than the cooling-off period counted from the closed_date of the account's most recent settlement that expired or defaulted.
        evidence_fields: [settlement_agreements.closed_date, settlement_agreements.status, settlement_agreements.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.account_id]
          action_bindings:
            settlement_agreements.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the closed_date of the account's most recent settlement that expired or defaulted
          anchor_source: settlement_agreements.closed_date
          relation: not_before
          duration_source: variants.reoffer_cooling_off_days
          unit: calendar_days
          counting_rule: The cooling-off period is the new programme's reoffer_cooling_off_days in calendar days, the day after that closed_date being day one.
          boundary: exclusive
    params:
      stage_authority_floor_pct:
        Early-Out Placement: authority_floor_pct_early_out
        Primary Placement: authority_floor_pct_primary
        Secondary Placement: authority_floor_pct_secondary
        Tertiary Placement: authority_floor_pct_tertiary
        Warehouse Placement: authority_floor_pct_warehouse
        Legal Review Placement: authority_floor_pct_legal_review
      stage_approval_floor_pct:
        Early-Out Placement: approval_floor_pct_early_out
        Primary Placement: approval_floor_pct_primary
        Secondary Placement: approval_floor_pct_secondary
        Tertiary Placement: approval_floor_pct_tertiary
        Warehouse Placement: approval_floor_pct_warehouse
        Legal Review Placement: approval_floor_pct_legal_review
      client_tier_floor_reduction_pct:
        Starter Contingency Agreement: 0.0
        Standard Contingency Agreement: 0.0
        Preferred Contingency Agreement: 2.5
        Select Volume Contingency Agreement: 5.0
        Enterprise Contingency Agreement: 5.0
        Strategic Partner Contingency Agreement: 7.5
      per_tier:
        Prompt-Pay Discount Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Lump-Sum Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Two-Payment Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Three-Payment Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Six-Payment Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Hardship Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
    formula:
      own_authority_floor_pct: max(stage_authority_floor_pct - client_tier_floor_reduction_pct - bundle_floor_reduction_pct, stage_approval_floor_pct)
      needs_client_approval: settlement_pct < own_authority_floor_pct or balance_at_offer > max_settlement_balance_usd or balance_at_offer - settlement_amount > max_waiver_usd
      unrounded_settlement_amount_usd: balance_at_offer * settlement_pct / 100
    measures: [settle_msr_offers_12m]

  - id: settle_evt_client_approval
    subject: [settle_offer_issued]
    rule: >-
      When an offer needs client approval, Ridgeline first files an approval request with the
      programme, the requested percentage and amount; the client answers within the programme's
      client_response_due_business_days business days, and a request still unanswered after that
      lapses. Programmes whose client_response_due_business_days is 0 cannot use approval requests.
      An offer that needs client approval is extended only on an approval request for the same
      account and programme whose request_status is approved, at a settlement_pct no lower than the
      approved_pct, and the offer carries that request in approval_request_id. An approved offer is
      extended only when the handling date is no later than the last day of the approval validity
      counted from the approval's decision_date. The approval validity is the programme's
      approval_valid_days in calendar days, the day after decision_date being day one and the last
      day included. After a decline, a new request on the same account is filed only when
      settle_msr_declined_approvals_12m is no more than approval_resubmission_max and more than
      declined_approval_cooling_off_days calendar days have passed since the decline's
      decision_date. A request is never filed below the programme's approval floor for the
      account's stage, and an approval never authorizes a different account, programme or a lower
      percentage than approved.
    eligibility:
      - id: approval_on_record
        applies_to: [settle_offer_issued]
        kind: state
        condition: An offer that needs client approval is extended only on an approval request for the same account and programme whose request_status is approved, at a settlement_pct no lower than the approved_pct, and the offer carries that request in approval_request_id.
        evidence_fields: [settlement_approval_requests.request_status, settlement_approval_requests.approved_pct, settlement_approval_requests.requested_variant_name, settlement_approval_requests.approval_request_id, settlement_approval_requests.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_approval_requests.approval_request_id]
          action_bindings:
            settlement_approval_requests.approval_request_id: approval_request_id
        state_contract:
          field: settlement_approval_requests.request_status
          allowed: [approved]
      - id: approval_still_valid
        applies_to: [settle_offer_issued]
        kind: time
        condition: An approved offer is extended only when the handling date is no later than the last day of the approval validity counted from the approval's decision_date.
        evidence_fields: [settlement_approval_requests.decision_date, settlement_approval_requests.approval_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_approval_requests.approval_request_id]
          action_bindings:
            settlement_approval_requests.approval_request_id: approval_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the approval's decision_date
          anchor_source: settlement_approval_requests.decision_date
          relation: not_after
          duration_source: variants.approval_valid_days
          unit: calendar_days
          counting_rule: The approval validity is the programme's approval_valid_days in calendar days, the day after decision_date being day one and the last day included.
          boundary: inclusive
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Lump-Sum Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Two-Payment Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Three-Payment Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Six-Payment Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Hardship Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
    measures: [settle_msr_declined_approvals_12m]

  - id: settle_combo_plan_and_hardship
    subject: [settle_offer_issued, settle_offer_accepted]
    rule: >-
      A settlement and a payment plan never run together on one account, and a hardship hold
      changes which settlements may be offered. An offer may be extended on an account that has a
      plan in any status, but when the consumer accepts, any plan on that account in
      pending_authorization, active, suspended or broken status is cancelled the same day with
      close_reason superseded_by_settlement, and installments already paid stay applied to the
      account and reduce the balance, not the settlement amount. The plan is cancelled and any
      hardship hold the acceptance ends is ended before the acceptance itself, so the account is in
      active when the acceptance moves it to arranged. An offer on an account in
      hardship_hold is extended only when the tier of the hold in force has
      settlement_offers_during_hold_allowed set to true. A Hardship Settlement is offered only when
      the account's most recent hardship hold is in status active, or has status ended
      with an ended_date no more than that hold tier's post_hold_hardship_window_days calendar days
      before the offer date, and in every case that hold tier's hardship_settlement_eligible_after_hold
      is true. A hardship hold denied, withdrawn or ended outside the window never qualifies, and a
      consumer's statement of hardship without a qualifying hold on record does not qualify.
    eligibility:
      - id: qualifying_hold_for_hardship_settlement
        applies_to: [settle_offer_issued]
        kind: state
        condition: A Hardship Settlement is offered only when the account's most recent hardship hold is in status active, or has status ended with an ended_date no more than that hold tier's post_hold_hardship_window_days calendar days before the offer date, and in every case that hold tier's hardship_settlement_eligible_after_hold is true.
        evidence_fields: [hardship_holds.status, hardship_holds.ended_date, hardship_holds.variant_name, hardship_holds.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id]
          action_bindings:
            hardship_holds.account_id: account_id
        state_contract:
          field: hardship_holds.status
          allowed: [active, ended]

  - id: settle_evt_acceptance_and_expiry
    subject: [settle_offer_accepted, settle_offer_expired, settle_amount_scheduled]
    rule: >-
      Only the consumer can accept a settlement, and acceptance is the consumer's own act on the
      written offer. An offer is accepted only when the handling date is no later than the offer's
      last day counted from its offer_date. The offer's last day is the offer_date plus
      offer_validity_days calendar days, the day after offer_date being day one and the last day
      included; it is the offer_expiry_date. Acceptance on a recorded call is valid only where the
      programme's verbal_acceptance_allowed is true; elsewhere the consumer accepts by electronic
      signature or in the online portal. On acceptance the first payment due date is recomputed as
      the acceptance date plus the same number of days the offer allowed, never more than
      first_payment_max_days_after_acceptance, and later due dates follow at payment_interval_days.
      The settlement amount is booked to the settlement once, on the acceptance date, and only for
      a settlement whose status is accepted. An offer still offered after offer_expiry_date expires
      on the next day, and an expired offer can never be accepted; the consumer may receive a new
      offer under the reoffer rules.
    eligibility:
      - id: accept_before_expiry
        applies_to: [settle_offer_accepted]
        kind: time
        condition: An offer is accepted only when the handling date is no later than the offer's last day counted from its offer_date.
        evidence_fields: [settlement_agreements.offer_date, settlement_agreements.offer_expiry_date, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its offer_date
          anchor_source: settlement_agreements.offer_date
          relation: not_after
          duration_source: variants.offer_validity_days
          unit: calendar_days
          counting_rule: The offer's last day is the offer_date plus offer_validity_days calendar days, the day after offer_date being day one and the last day included; it is the offer_expiry_date.
          boundary: inclusive
      - id: schedule_on_accepted_settlement
        applies_to: [settle_amount_scheduled]
        kind: state
        condition: The settlement amount is booked to the settlement once, on the acceptance date, and only for a settlement whose status is accepted.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [accepted]
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Lump-Sum Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Two-Payment Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Three-Payment Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Six-Payment Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Hardship Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}

  - id: settle_evt_payments
    subject: [settle_payment_received, settle_payment_returned, settle_due_date_extended]
    rule: >-
      The due date of settlement payment k is first_payment_due_date plus k minus 1 times
      payment_interval_days, plus extension_days_total for every payment not yet made when an
      extension was granted. Settlement payments are accepted only on a settlement whose status is
      accepted. A payment counts as made when the funds applied to it reach its scheduled amount
      less partial_payment_tolerance_usd. Payments are taken by ACH bank debit or mailed check at
      every programme, by card only where card_payments_allowed is true, by retail cash payment
      network only where cash_network_allowed is true and the account's stage accepts that channel,
      and only by automatic debit where autopay_required is true; the account's stage limits on
      single and rolling card amounts also apply. A payment of more than the amount due is applied
      to the next settlement payments in order. A returned settlement payment is booked once
      against the payment it reverses and the payment is again unmade; a replacement received
      within returned_payment_replacement_days calendar days after the return keeps the settlement
      in good standing, unless settle_msr_returned_payments exceeds returned_payment_limit. A
      due-date extension is granted only on an accepted settlement that is not yet in default,
      only while due_date_extension_count is below due_date_extension_max_count, and for no more
      than due_date_extension_max_days calendar days; it adds the days to extension_days_total and
      to final_payment_due_date and never reduces the settlement amount.
    eligibility:
      - id: payments_on_accepted_settlement
        applies_to: [settle_payment_received, settle_due_date_extended]
        kind: state
        condition: Settlement payments are accepted only on a settlement whose status is accepted.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [accepted]
      - id: one_return_per_settlement_payment
        applies_to: [settle_payment_returned]
        kind: dedup
        condition: A returned settlement payment is booked once against the payment it reverses and the payment is again unmade; a replacement received within returned_payment_replacement_days calendar days after the return keeps the settlement in good standing, unless settle_msr_returned_payments exceeds returned_payment_limit.
        evidence_fields: [settlement_payments.source_settle_txn_id, settlement_payments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_payments.source_settle_txn_id]
          action_bindings:
            settlement_payments.source_settle_txn_id: source_settle_txn_id
        dedup_contract:
          table: settlement_payments
          mode: separate_record
          object_bindings: {source_settle_txn_id: source_settle_txn_id}
          duplicate_filters: {event_type: [settle_payment_returned]}
          distinct_fields: []
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Lump-Sum Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Two-Payment Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Three-Payment Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Six-Payment Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Hardship Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
    measures: [settle_msr_returned_payments]

  - id: settle_evt_default_and_release
    subject: [settle_defaulted, settle_balance_released]
    rule: >-
      An accepted settlement defaults when a settlement payment is still unmade after its grace
      period, or when settle_msr_returned_payments exceeds the programme's returned_payment_limit.
      A settlement defaults for an unmade payment only when the handling date is later than the
      grace period counted from that payment's due date. The grace period is the programme's
      grace_days_per_payment calendar days, the day after the due date being day one, with the due
      date already moved by any extension. On default the discount is lost: the remaining
      settlement_balance is released, payments already made stay applied to the account, the full
      remaining balance_due is owed again, and the account returns from arranged to active. A
      remainder is released only for a settlement whose status is defaulted or withdrawn, once, for
      the whole settlement_balance remaining. A default notice is sent and a new offer on the
      account waits for the reoffer cooling-off period.
    eligibility:
      - id: payment_grace_lapsed
        applies_to: [settle_defaulted]
        kind: time
        condition: A settlement defaults for an unmade payment only when the handling date is later than the grace period counted from that payment's due date.
        evidence_fields: [settlement_agreements.first_payment_due_date, settlement_agreements.payment_interval_days, settlement_agreements.extension_days_total, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: that payment's due date
          anchor_source: settlement_agreements.first_payment_due_date
          relation: not_before
          duration_source: variants.grace_days_per_payment
          unit: calendar_days
          counting_rule: The grace period is the programme's grace_days_per_payment calendar days, the day after the due date being day one, with the due date already moved by any extension.
          boundary: exclusive
      - id: release_on_closed_settlement
        applies_to: [settle_balance_released]
        kind: state
        condition: A remainder is released only for a settlement whose status is defaulted or withdrawn, once, for the whole settlement_balance remaining.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [defaulted, withdrawn]
    formula:
      released_amount_usd: settlement_balance

  - id: settle_evt_fulfillment
    subject: [settle_fulfilled]
    rule: >-
      An accepted settlement is fulfilled when settle_msr_paid_total reaches the settlement amount
      less the programme's partial_payment_tolerance_usd and the final payment has cleared. A
      settlement is fulfilled only when the handling date is later than the fulfillment hold counted
      from the date the final settlement payment was received. The fulfillment hold is the
      programme's fulfillment_hold_business_days business days after that date, Monday through
      Friday excluding US federal legal public holidays. On fulfillment the waived_amount is the
      account's balance_due on the fulfillment date, the waiver is booked to the account, the
      account closes as settled_in_full, and the settled-in-full letter follows under the account's
      letter rule. A fulfilled settlement is never reopened; a payment returned after fulfillment is
      referred to the client.
    eligibility:
      - id: final_payment_held
        applies_to: [settle_fulfilled]
        kind: time
        condition: A settlement is fulfilled only when the handling date is later than the fulfillment hold counted from the date the final settlement payment was received.
        evidence_fields: [settlement_payments.txn_date, settlement_payments.payment_number, settlement_payments.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_payments.settlement_id]
          action_bindings:
            settlement_payments.settlement_id: settlement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the final settlement payment was received
          anchor_source: settlement_payments.txn_date
          relation: not_before
          duration_source: variants.fulfillment_hold_business_days
          unit: business_days
          counting_rule: The fulfillment hold is the programme's fulfillment_hold_business_days business days after that date, Monday through Friday excluding US federal legal public holidays.
          boundary: exclusive
    formula:
      is_paid: settle_msr_paid_total >= settlement_amount - partial_payment_tolerance_usd
    measures: [settle_msr_paid_total]

  - id: settle_evt_withdrawal
    subject: [settle_offer_withdrawn, settle_balance_released]
    rule: >-
      Ridgeline withdraws an offered or accepted settlement only for a reason shown on the
      account's own records — account_disputed when the account entered dispute_hold,
      account_returned when the account was returned to the client, bankruptcy_notice or
      consumer_deceased when the matching protected-status notice is recorded, and
      superseded_by_new_offer for an offer that is still only offered when the consumer asks for
      different terms. A consumer who simply changes their mind about an accepted settlement does
      not withdraw it; the settlement stays accepted until it is fulfilled or defaults. Withdrawing
      an accepted settlement releases its remaining settlement_balance and returns an arranged
      account to active unless the account is being returned; payments already made stay applied
      to the account. When the dispute that caused an account_disputed withdrawal is later
      verified, the consumer may receive a new offer without waiting for the reoffer cooling-off
      period.
    eligibility:
      - id: withdrawal_reason_on_record
        applies_to: [settle_offer_withdrawn]
        kind: authorization
        condition: Ridgeline withdraws an offered or accepted settlement only for a reason shown on the account's own records — account_disputed when the account entered dispute_hold, account_returned when the account was returned to the client, bankruptcy_notice or consumer_deceased when the matching protected-status notice is recorded, and superseded_by_new_offer for an offer that is still only offered when the consumer asks for different terms.
        evidence_fields: [placed_accounts.status, account_case_events.notice_type, settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id

  - id: settle_evt_letters
    subject: [settle_letter_issued]
    rule: >-
      Every settlement is in writing. The offer letter is sent within offer_letter_sla_business_days
      business days after the offer date, the acceptance confirmation within
      acceptance_letter_sla_business_days business days after acceptance and, where
      settlement_letter_before_first_payment is true, before the first settlement payment is
      taken, and the default notice within default_notice_sla_business_days business days after a
      default. Settlement letters are sent only for a settlement whose status is offered, accepted
      or defaulted. Each letter type is sent once per settlement. The offer letter goes by email
      only where offer_letter_email_allowed is true and the consumer's profile carries an email
      address; every other letter goes by the channel the offer letter used. Every letter on an
      account whose sol_expiry_date is before the letter date carries disclosure_variant
      time_barred_terms where time_barred_disclosure_required is true, stating that the debt is too
      old to be sued on; all others carry standard_terms. The acceptance confirmation carries the
      cancelled-debt tax notice when balance_at_offer less the settlement amount is at or above
      tax_notice_waiver_threshold_usd; no other letter carries it.
    eligibility:
      - id: letter_settlement_status
        applies_to: [settle_letter_issued]
        kind: state
        condition: Settlement letters are sent only for a settlement whose status is offered, accepted or defaulted.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [offered, accepted, defaulted]
      - id: one_letter_per_type
        applies_to: [settle_letter_issued]
        kind: dedup
        condition: Each letter type is sent once per settlement.
        evidence_fields: [settlement_payments.settlement_id, settlement_payments.letter_type, settlement_payments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_payments.settlement_id, settlement_payments.letter_type]
          action_bindings:
            settlement_payments.settlement_id: settlement_id
            settlement_payments.letter_type: letter_type
        dedup_contract:
          table: settlement_payments
          mode: separate_record
          object_bindings: {settlement_id: settlement_id, letter_type: letter_type}
          duplicate_filters: {event_type: [settle_letter_issued]}
          distinct_fields: []
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Lump-Sum Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Two-Payment Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Three-Payment Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Six-Payment Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Hardship Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
