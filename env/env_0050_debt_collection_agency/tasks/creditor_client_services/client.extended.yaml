events:
  # ---- holding writes (client_agreements) ----
  - type: client_agreement_issued
    target: client_agreements
    mutation: create
    meaning: Ridgeline issues a contingency placement agreement to a creditor client for signature.
    grain: one row per agreement issued.
    fields:
      customer_id: The creditor client.
      variant_name: The contingency tier offered.
      client_industry: The client's line of business.
      issued_date: The date the agreement was issued.
      effective_date: The planned effective date.
      term_end_date: The end of the initial term.
      remittance_basis: Net or gross remittance.
      remittance_frequency: Weekly, semi-monthly or monthly.
      credit_reporting_authorized: Whether the client authorizes credit reporting on its accounts.
      tier_review_date: The first volume review date.
    triggers: []
  - type: client_agreement_signed
    target: client_agreements
    mutation: {transition: {from: pending_signature, to: active}}
    meaning: The client signs the agreement.
    grain: one row per transaction.
    fields:
      signed_date: The date the client signed.
      effective_date: The effective date, the later of the planned effective date and the signing date.
    triggers: []
  - type: client_agreement_lapsed
    target: client_agreements
    mutation: {transition: {from: pending_signature, to: closed}}
    meaning: The agreement lapses unsigned.
    grain: one row per transaction.
    fields:
      closed_date: The first day after the signature window.
    triggers: []
  - type: client_placements_held
    target: client_agreements
    mutation: {transition: {from: active, to: placement_hold}}
    meaning: New placements under the agreement are held.
    grain: one row per transaction.
    fields:
      placement_hold_date: The date the hold began.
      placement_hold_reason: Why placements are held.
    triggers: []
  - type: client_placements_resumed
    target: client_agreements
    mutation: {transition: {from: placement_hold, to: active}}
    meaning: New placements under the agreement resume.
    grain: one row per transaction.
    fields:
      status: Set to active.
    triggers: []
  - type: client_runoff_started
    target: client_agreements
    mutation:
      transition:
        - {from: active, to: runoff}
        - {from: placement_hold, to: runoff}
    meaning: The client's termination or non-renewal takes effect and the agreement enters runoff.
    grain: one row per transaction.
    fields:
      termination_notice_date: The date the client's notice was received.
      termination_effective_date: The date the termination or non-renewal takes effect.
      runoff_end_date: The last day of runoff.
    triggers: []
  - type: client_agreement_closed
    target: client_agreements
    mutation: {transition: {from: runoff, to: closed}}
    meaning: Runoff ends and the agreement closes.
    grain: one row per transaction.
    fields:
      closed_date: The first day after runoff_end_date.
    triggers: []
  - type: client_tier_changed
    target: client_agreements
    mutation: update
    meaning: The agreement is moved to a different contingency tier at its volume review.
    grain: one row per transaction.
    fields:
      variant_name: The new tier.
      tier_review_date: The next review date.
    triggers: []
  - type: client_terms_updated
    target: client_agreements
    mutation: update
    meaning: The remittance basis, remittance frequency or credit reporting authorization is changed on the client's request.
    grain: one row per transaction.
    fields:
      remittance_basis: The remittance basis after the change.
      remittance_frequency: The remittance frequency after the change.
      credit_reporting_authorized: The credit reporting authorization after the change.
    triggers: []
  - type: client_term_renewed
    target: client_agreements
    mutation: update
    meaning: The agreement renews automatically for another term.
    grain: one row per transaction.
    fields:
      term_end_date: The end of the renewal term.
    triggers: []
  # ---- ledger writes (client_ledger) ----
  - type: client_collection_booked
    target: client_ledger
    meaning: A consumer payment collected by Ridgeline on one of the client's accounts is booked to the client's trust balance with its contingency fee.
    grain: one row per consumer payment collected.
    distinguish_by: [source_txn_id]
    fields:
      account_id: The placed account the payment was made on.
      source_txn_id: The account_payment_posted row collected.
      amount: The amount collected.
      txn_date: The date the funds were received.
      contingency_rate_pct: The contingency rate applied.
      fee_amount: The contingency fee on the collection.
    account: trust_payable
    direction: in
    triggers: []
  - type: client_collection_reversed
    target: client_ledger
    meaning: A collection is reversed out of the client's trust balance because the payment was returned or an overpayment was refunded.
    grain: one row per reversal, pointing to the account ledger row it follows.
    distinguish_by: [source_txn_id, reversal_reason]
    fields:
      account_id: The placed account.
      source_txn_id: The account_payment_posted row whose collection is reversed.
      amount: The amount reversed.
      txn_date: The date of the return or refund.
      reversal_reason: Returned payment or overpayment refund.
    account: trust_payable
    direction: out
    triggers: []
  - type: client_fee_retained
    target: client_ledger
    meaning: For a net-remit client, the period's contingency fees are retained from the trust balance before remittance.
    grain: one row per remittance period.
    distinguish_by: [remittance_period]
    fields:
      amount: The fees retained.
      txn_date: The date of retention.
      remittance_period: The remittance period.
      statement_number: The remittance statement number, verbatim.
    account: trust_payable
    direction: out
    triggers: []
  - type: client_remittance_issued
    target: client_ledger
    meaning: Collections held in trust are remitted to the client.
    grain: one row per remittance period.
    distinguish_by: [remittance_period]
    fields:
      amount: The amount remitted.
      txn_date: The date the funds were sent.
      remittance_period: The remittance period.
      remittance_ref: The ACH or wire trace number, verbatim.
      statement_number: The remittance statement number, verbatim.
    account: trust_payable
    direction: out
    triggers: []
  - type: client_direct_pay_fee_booked
    target: client_ledger
    meaning: A contingency fee is booked on a payment the consumer made directly to the client.
    grain: one row per direct payment reported.
    distinguish_by: [source_txn_id]
    fields:
      account_id: The placed account.
      source_txn_id: The account_direct_payment_reported row.
      amount: The fee booked.
      txn_date: The date the consumer paid the client.
      contingency_rate_pct: The rate applied.
    account: fees_receivable
    direction: in
    triggers: []
  - type: client_fee_invoiced
    target: client_ledger
    meaning: For a gross-remit client, the period's contingency fees are invoiced.
    grain: one row per remittance period.
    distinguish_by: [remittance_period]
    fields:
      amount: The fees invoiced.
      txn_date: The invoice date.
      remittance_period: The remittance period.
      invoice_number: The invoice number, verbatim.
    account: fees_receivable
    direction: in
    triggers: []
  - type: client_recall_fee_assessed
    target: client_ledger
    meaning: A recall fee is charged on an account the client recalled.
    grain: one row per recalled account.
    distinguish_by: [account_id, service_request_id]
    fields:
      account_id: The recalled placed account.
      service_request_id: The recall request.
      amount: The recall fee.
      txn_date: The date the recall was processed.
    account: fees_receivable
    direction: in
    triggers: []
  - type: client_late_charge_assessed
    target: client_ledger
    meaning: A late charge accrues on a past-due fee invoice.
    grain: one row per invoice per month past due.
    distinguish_by: [invoice_number, txn_date]
    fields:
      amount: The late charge.
      txn_date: The date the charge accrued.
      invoice_number: The past-due invoice, verbatim.
    account: fees_receivable
    direction: in
    triggers: []
  - type: client_early_termination_fee_assessed
    target: client_ledger
    meaning: The early-termination fee is charged when the client terminates before the end of the initial term.
    grain: one row per terminated agreement.
    distinguish_by: [txn_date]
    fields:
      amount: The fee.
      txn_date: The date the termination notice was received.
    account: fees_receivable
    direction: in
    triggers: []
  - type: client_fee_payment_received
    target: client_ledger
    meaning: The client pays fees owed, or past-due fees are offset against a gross remittance.
    grain: one row per fee payment or offset, identified by its reference.
    distinguish_by: [payment_ref]
    fields:
      amount: The amount paid or offset.
      txn_date: The date received or offset.
      invoice_number: The invoice paid, verbatim.
      payment_ref: The client's payment reference, or the remittance statement number for an offset, verbatim.
    account: fees_receivable
    direction: out
    triggers: []
  - type: client_fee_credit_issued
    target: client_ledger
    meaning: A credit reduces fees the client owes — the fee on a reversed collection, a waived recall fee, a billing correction or the annual volume rebate.
    grain: one row per credit.
    distinguish_by: [credit_reason, source_txn_id, txn_date]
    fields:
      account_id: The placed account the credit concerns; empty for a volume rebate.
      source_txn_id: The account ledger row the credit follows, for a reversed-collection credit; empty otherwise.
      amount: The credit.
      txn_date: The date of the credit.
      credit_reason: Why the credit was issued.
      invoice_number: The invoice the credit applies to, verbatim; empty when not tied to an invoice.
    account: fees_receivable
    direction: out
    triggers: []

measures:
  - id: client_msr_trailing_placement_volume
    window: Rolling 365 calendar days ending on the review date, both ends included.
    measure: Sum of placed_balance over placed_accounts rows whose placement_date falls in the window, across every agreement of the same client.
  - id: client_msr_trailing_collections
    window: Rolling 365 calendar days ending on the review date, both ends included.
    measure: Sum of amount over client_collection_booked rows of the agreement less client_collection_reversed rows of the agreement, by txn_date.
  - id: client_msr_free_recalls_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of account_recall service requests on the agreement processed without a recall fee under the free-recall allowance, divided by the count of placed_accounts placed under the agreement in the window, as a percentage.
  - id: client_msr_terms_changes_year
    window: The current agreement year, from the effective_date anniversary on or before the handling date through the handling date.
    measure: Count of processed client_service_requests of the agreement by request_type (remittance_terms_change, reporting_authorization_change).

policies:
  - id: client_agg_multi_holding
    subject: [client_agreement_issued]
    rule: >-
      A creditor client normally holds one placement agreement, and may hold separate agreements
      only for genuinely separate lines of business — a health system's hospital and physician
      groups, or a utility's energy and telecom brands. A new agreement is issued only when the
      client holds no other agreement for the same client_industry in pending_signature, active,
      placement_hold or runoff status, and a client holds at most max_per_customer agreements that
      are not closed. Each agreement carries its own tier, remittance terms, credit reporting
      authorization and balances; nothing is pooled across a client's agreements except the volume
      used at tier review.
    eligibility:
      - id: one_agreement_per_line_of_business
        applies_to: [client_agreement_issued]
        kind: dedup
        condition: A new agreement is issued only when the client holds no other agreement for the same client_industry in pending_signature, active, placement_hold or runoff status, and a client holds at most max_per_customer agreements that are not closed.
        evidence_fields: [client_agreements.customer_id, client_agreements.client_industry, client_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.customer_id, client_agreements.client_industry]
          action_bindings:
            client_agreements.customer_id: customer_id
            client_agreements.client_industry: client_industry
        dedup_contract:
          table: client_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id, client_industry: client_industry}
          duplicate_filters: {status: [pending_signature, active, placement_hold, runoff]}
          distinct_fields: [issued_date]
    params:
      max_per_customer: 3

  - id: client_agg_volume_tiering
    subject: [client_tier_changed]
    rule: >-
      Tier reviews pool the client's whole portfolio: client_msr_trailing_placement_volume sums the
      placed balances of every agreement the client holds, not only the agreement under review.
      A tier review takes place only when the handling date is on or after the review date counted
      from the agreement's effective_date. Reviews fall every tier_review_interval_months calendar
      months after effective_date, a review date that does not exist in a short month falling on
      that month's last day, and tier_review_date always records the next one. At review the
      agreement moves up to the highest tier whose entry volume the pooled trailing volume meets,
      and moves down only when the pooled volume is more than the current tier's
      downgrade_tolerance_pct percent below the current tier's entry volume, in which case it moves
      to the highest tier whose entry volume is met. Tiers are changed only on agreements whose
      status is active or placement_hold; an agreement in runoff keeps its tier to the end. The new
      tier's contingency rates apply to collections received from the day after the review, and
      collections already booked keep the rate applied when they were booked.
    eligibility:
      - id: review_date_reached
        applies_to: [client_tier_changed]
        kind: time
        condition: A tier review takes place only when the handling date is on or after the review date counted from the agreement's effective_date.
        evidence_fields: [client_agreements.effective_date, client_agreements.tier_review_date, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement's effective_date
          anchor_source: client_agreements.effective_date
          relation: not_before
          duration_source: variants.tier_review_interval_months
          unit: calendar_months
          counting_rule: Reviews fall every tier_review_interval_months calendar months after effective_date, a review date that does not exist in a short month falling on that month's last day, and tier_review_date always records the next one.
          boundary: inclusive
      - id: tier_change_status
        applies_to: [client_tier_changed]
        kind: state
        condition: Tiers are changed only on agreements whose status is active or placement_hold; an agreement in runoff keeps its tier to the end.
        evidence_fields: [client_agreements.status, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        state_contract:
          field: client_agreements.status
          allowed: [active, placement_hold]
    params:
      per_tier:
        Starter Contingency Agreement: {tolerance: =downgrade_tolerance_pct, interval_months: =tier_review_interval_months}
        Standard Contingency Agreement: {tolerance: =downgrade_tolerance_pct, interval_months: =tier_review_interval_months}
        Preferred Contingency Agreement: {tolerance: =downgrade_tolerance_pct, interval_months: =tier_review_interval_months}
        Select Volume Contingency Agreement: {tolerance: =downgrade_tolerance_pct, interval_months: =tier_review_interval_months}
        Enterprise Contingency Agreement: {tolerance: =downgrade_tolerance_pct, interval_months: =tier_review_interval_months}
        Strategic Partner Contingency Agreement: {tolerance: =downgrade_tolerance_pct, interval_months: =tier_review_interval_months}
    measures: [client_msr_trailing_placement_volume]

  - id: client_contingency_fees
    subject: [client_collection_booked, client_direct_pay_fee_booked]
    rule: >-
      Ridgeline earns its contingency fee only on money actually collected; there is no fee on
      placements, letters, calls or accounts that pay nothing. Every consumer payment Ridgeline
      collects is booked to the agreement's trust balance, with the contingency rate of the
      agreement's tier for the account's stage on the collection date
      (contingency_rate_pct_early_out through contingency_rate_pct_legal_review), or the legal
      forwarding programme's rate for an account in an open forwarded matter, and a fee equal to
      the amount times that rate, rounded to the cent. Collections are booked only on agreements
      whose status is active, placement_hold or runoff. Settlement payments carry the same rate as
      any other collection; a settlement waiver carries no fee. When the consumer pays the client
      directly, the client reports it within direct_pay_reporting_days, and a fee is booked equal
      to the payment times the stage rate times direct_pay_fee_pct_of_rate percent, rounded to the
      cent, except that no fee is booked on a direct payment whose date is within
      direct_pay_free_window_days calendar days after the account's placement_date. A direct payment
      the client reports late is still charged. The tier also sets the settlement authority
      reduction that applies to the client's accounts under the settlement charter.
    eligibility:
      - id: collection_agreement_status
        applies_to: [client_collection_booked]
        kind: state
        condition: Collections are booked only on agreements whose status is active, placement_hold or runoff.
        evidence_fields: [client_agreements.status, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        state_contract:
          field: client_agreements.status
          allowed: [active, placement_hold, runoff]
    params:
      stage_rate_param:
        Early-Out Placement: contingency_rate_pct_early_out
        Primary Placement: contingency_rate_pct_primary
        Secondary Placement: contingency_rate_pct_secondary
        Tertiary Placement: contingency_rate_pct_tertiary
        Warehouse Placement: contingency_rate_pct_warehouse
        Legal Review Placement: contingency_rate_pct_legal_review
      per_tier:
        Starter Contingency Agreement: {primary: =contingency_rate_pct_primary, secondary: =contingency_rate_pct_secondary, warehouse: =contingency_rate_pct_warehouse, direct_pay_share: =direct_pay_fee_pct_of_rate, free_window: =direct_pay_free_window_days}
        Standard Contingency Agreement: {primary: =contingency_rate_pct_primary, secondary: =contingency_rate_pct_secondary, warehouse: =contingency_rate_pct_warehouse, direct_pay_share: =direct_pay_fee_pct_of_rate, free_window: =direct_pay_free_window_days}
        Preferred Contingency Agreement: {primary: =contingency_rate_pct_primary, secondary: =contingency_rate_pct_secondary, warehouse: =contingency_rate_pct_warehouse, direct_pay_share: =direct_pay_fee_pct_of_rate, free_window: =direct_pay_free_window_days}
        Select Volume Contingency Agreement: {primary: =contingency_rate_pct_primary, secondary: =contingency_rate_pct_secondary, warehouse: =contingency_rate_pct_warehouse, direct_pay_share: =direct_pay_fee_pct_of_rate, free_window: =direct_pay_free_window_days}
        Enterprise Contingency Agreement: {primary: =contingency_rate_pct_primary, secondary: =contingency_rate_pct_secondary, warehouse: =contingency_rate_pct_warehouse, direct_pay_share: =direct_pay_fee_pct_of_rate, free_window: =direct_pay_free_window_days}
        Strategic Partner Contingency Agreement: {primary: =contingency_rate_pct_primary, secondary: =contingency_rate_pct_secondary, warehouse: =contingency_rate_pct_warehouse, direct_pay_share: =direct_pay_fee_pct_of_rate, free_window: =direct_pay_free_window_days}
    formula:
      fee_amount: round(amount * contingency_rate_pct / 100, 2)
      direct_pay_fee: round(amount * contingency_rate_pct / 100 * direct_pay_fee_pct_of_rate / 100, 2)

  - id: client_evt_remittance
    subject: [client_remittance_issued, client_fee_retained]
    rule: >-
      Collections are remitted per remittance period of the agreement's remittance_frequency —
      weekly periods run Monday through Sunday, semi-monthly periods run from the 1st to the 15th
      and from the 16th to the month end, and monthly periods are calendar months — and the
      remittance is sent within remittance_sla_business_days business days after the period ends.
      Only cleared funds are remitted: collections received in the last
      funds_clearance_holdback_business_days business days of a period roll into the next period.
      For a net_remit agreement the period's fees are first retained from trust and the rest is
      remitted; for a gross_remit agreement the whole period's collections are remitted and the fees
      are invoiced. When the amount to remit is below minimum_remittance_usd it is carried to the
      next period. When reversals exceed collections in a period, the shortfall is carried against
      the next period where negative_remittance_handling is carry_forward, and invoiced to the
      client where it is invoice. Each remittance period is remitted once, with its own statement.
    eligibility:
      - id: one_remittance_per_period
        applies_to: [client_remittance_issued]
        kind: dedup
        condition: Each remittance period is remitted once, with its own statement.
        evidence_fields: [client_ledger.agreement_id, client_ledger.remittance_period, client_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_ledger.agreement_id, client_ledger.remittance_period]
          action_bindings:
            client_ledger.agreement_id: agreement_id
            client_ledger.remittance_period: remittance_period
        dedup_contract:
          table: client_ledger
          mode: separate_record
          object_bindings: {agreement_id: agreement_id, remittance_period: remittance_period}
          duplicate_filters: {event_type: [client_remittance_issued]}
          distinct_fields: []
    params:
      per_tier:
        Starter Contingency Agreement: {sla: =remittance_sla_business_days, minimum: =minimum_remittance_usd, holdback: =funds_clearance_holdback_business_days, negative: =negative_remittance_handling}
        Standard Contingency Agreement: {sla: =remittance_sla_business_days, minimum: =minimum_remittance_usd, holdback: =funds_clearance_holdback_business_days, negative: =negative_remittance_handling}
        Preferred Contingency Agreement: {sla: =remittance_sla_business_days, minimum: =minimum_remittance_usd, holdback: =funds_clearance_holdback_business_days, negative: =negative_remittance_handling}
        Select Volume Contingency Agreement: {sla: =remittance_sla_business_days, minimum: =minimum_remittance_usd, holdback: =funds_clearance_holdback_business_days, negative: =negative_remittance_handling}
        Enterprise Contingency Agreement: {sla: =remittance_sla_business_days, minimum: =minimum_remittance_usd, holdback: =funds_clearance_holdback_business_days, negative: =negative_remittance_handling}
        Strategic Partner Contingency Agreement: {sla: =remittance_sla_business_days, minimum: =minimum_remittance_usd, holdback: =funds_clearance_holdback_business_days, negative: =negative_remittance_handling}

  - id: client_evt_fee_billing
    subject: [client_fee_invoiced, client_fee_payment_received, client_late_charge_assessed]
    rule: >-
      A gross_remit agreement is invoiced once per remittance period, within
      invoice_issue_business_days business days after the period ends, for the period's contingency
      fees plus the direct-pay fees booked in the period; when a calendar month with any collections
      has produced less than minimum_monthly_fee_usd in fees, the month's last invoice is raised to
      that minimum. Direct-pay fees of a net_remit agreement are retained with the next period's
      fees. An invoice falls due fee_invoice_due_days calendar days after the invoice date. A late
      charge accrues on an unpaid invoice only when the handling date is later than the late-charge
      start counted from the invoice date. The late-charge start is the invoice date plus
      fee_invoice_due_days calendar days plus late_charge_grace_days calendar days; from then a
      charge of late_charge_pct_per_month percent of the unpaid invoice amount, and at least
      late_charge_minimum_usd, accrues once for each full calendar month the invoice stays unpaid.
      Fee payments are applied to the invoice the client names, and otherwise to the oldest unpaid
      invoice first. Where fees_offset_against_remittance is true, Ridgeline may deduct a past-due
      invoice from the next gross remittance, booking the deduction as a fee payment whose
      payment_ref is that remittance's statement number. A fee line the client disputes within
      fee_dispute_window_days calendar days after the invoice date is resolved by credit, never by
      editing the invoice.
    eligibility:
      - id: late_charge_start_reached
        applies_to: [client_late_charge_assessed]
        kind: time
        condition: A late charge accrues on an unpaid invoice only when the handling date is later than the late-charge start counted from the invoice date.
        evidence_fields: [client_ledger.txn_date, client_ledger.invoice_number, client_ledger.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_ledger.agreement_id, client_ledger.invoice_number]
          action_bindings:
            client_ledger.agreement_id: agreement_id
            client_ledger.invoice_number: invoice_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: client_ledger.txn_date
          relation: not_before
          duration_source: variants.fee_invoice_due_days
          unit: calendar_days
          counting_rule: The late-charge start is the invoice date plus fee_invoice_due_days calendar days plus late_charge_grace_days calendar days; from then a charge of late_charge_pct_per_month percent of the unpaid invoice amount, and at least late_charge_minimum_usd, accrues once for each full calendar month the invoice stays unpaid.
          boundary: exclusive
    params:
      per_tier:
        Starter Contingency Agreement: {due_days: =fee_invoice_due_days, late_pct: =late_charge_pct_per_month, grace: =late_charge_grace_days, minimum_fee: =minimum_monthly_fee_usd, offset: =fees_offset_against_remittance}
        Standard Contingency Agreement: {due_days: =fee_invoice_due_days, late_pct: =late_charge_pct_per_month, grace: =late_charge_grace_days, minimum_fee: =minimum_monthly_fee_usd, offset: =fees_offset_against_remittance}
        Preferred Contingency Agreement: {due_days: =fee_invoice_due_days, late_pct: =late_charge_pct_per_month, grace: =late_charge_grace_days, minimum_fee: =minimum_monthly_fee_usd, offset: =fees_offset_against_remittance}
        Select Volume Contingency Agreement: {due_days: =fee_invoice_due_days, late_pct: =late_charge_pct_per_month, grace: =late_charge_grace_days, minimum_fee: =minimum_monthly_fee_usd, offset: =fees_offset_against_remittance}
        Enterprise Contingency Agreement: {due_days: =fee_invoice_due_days, late_pct: =late_charge_pct_per_month, grace: =late_charge_grace_days, minimum_fee: =minimum_monthly_fee_usd, offset: =fees_offset_against_remittance}
        Strategic Partner Contingency Agreement: {due_days: =fee_invoice_due_days, late_pct: =late_charge_pct_per_month, grace: =late_charge_grace_days, minimum_fee: =minimum_monthly_fee_usd, offset: =fees_offset_against_remittance}
    formula:
      late_charge_usd: max(round(amount * late_charge_pct_per_month / 100, 2), late_charge_minimum_usd)

  - id: client_evt_placement_hold
    subject: [client_placements_held, client_placements_resumed]
    rule: >-
      New placements are held for one of two reasons, recorded in placement_hold_reason. Placements
      are held for fees_past_due only when the handling date is later than the past-due limit
      counted from the invoice date of the oldest unpaid invoice. The past-due limit is the invoice
      date plus fee_invoice_due_days calendar days plus placement_hold_fee_past_due_days calendar
      days. Placements are held for client_requested_pause when the client asks to pause new
      placements through a placement_pause service request, for no longer than
      placement_pause_max_days calendar days, after which the client must resume or give
      termination notice. A hold never stops Ridgeline from working, collecting on, remitting for or
      reporting accounts already placed. A fees_past_due hold is lifted when every invoice past its
      due date is paid or credited, and a client_requested_pause is lifted on the client's
      placement_resume request.
    eligibility:
      - id: fees_past_due_limit
        applies_to: [client_placements_held]
        kind: time
        condition: Placements are held for fees_past_due only when the handling date is later than the past-due limit counted from the invoice date of the oldest unpaid invoice.
        evidence_fields: [client_ledger.txn_date, client_ledger.invoice_number, client_ledger.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_ledger.agreement_id]
          action_bindings:
            client_ledger.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date of the oldest unpaid invoice
          anchor_source: client_ledger.txn_date
          relation: not_before
          duration_source: variants.placement_hold_fee_past_due_days
          unit: calendar_days
          counting_rule: The past-due limit is the invoice date plus fee_invoice_due_days calendar days plus placement_hold_fee_past_due_days calendar days.
          boundary: exclusive
    params:
      per_tier:
        Starter Contingency Agreement: {past_due_days: =placement_hold_fee_past_due_days, pause_max: =placement_pause_max_days}
        Standard Contingency Agreement: {past_due_days: =placement_hold_fee_past_due_days, pause_max: =placement_pause_max_days}
        Preferred Contingency Agreement: {past_due_days: =placement_hold_fee_past_due_days, pause_max: =placement_pause_max_days}
        Select Volume Contingency Agreement: {past_due_days: =placement_hold_fee_past_due_days, pause_max: =placement_pause_max_days}
        Enterprise Contingency Agreement: {past_due_days: =placement_hold_fee_past_due_days, pause_max: =placement_pause_max_days}
        Strategic Partner Contingency Agreement: {past_due_days: =placement_hold_fee_past_due_days, pause_max: =placement_pause_max_days}

  - id: client_evt_recalls
    subject: [client_recall_fee_assessed]
    rule: >-
      A client may recall any open placed account at any time through an account_recall service
      request, and the account is returned under the account charter. A recall fee is assessed only
      on a recall whose service request has request_status processed. The recall is free when the
      recall request's request_date is no later than free_recall_window_days calendar days after
      the account's placement_date, when the recall_reason is bankruptcy, deceased, billing_error or
      dispute_with_client, or when client_msr_free_recalls_12m is still below
      free_recall_pct_of_placements. Otherwise a fee is charged when, on the request_date, the
      account's status was arranged or a consumer payment had posted within
      recall_fee_payment_lookback_days calendar days before the request_date; a recall of an
      account with neither is free. The fee is balance_due on the request_date times the stage
      contingency rate times recall_fee_pct_of_contingency percent, rounded to the cent, and never
      more than recall_fee_cap_usd. One fee at most is charged per recalled account.
    eligibility:
      - id: recall_processed
        applies_to: [client_recall_fee_assessed]
        kind: state
        condition: A recall fee is assessed only on a recall whose service request has request_status processed.
        evidence_fields: [client_service_requests.request_status, client_service_requests.service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_service_requests.service_request_id]
          action_bindings:
            client_service_requests.service_request_id: service_request_id
        state_contract:
          field: client_service_requests.request_status
          allowed: [processed]
    params:
      fee_free_recall_reasons: [bankruptcy, deceased, billing_error, dispute_with_client]
      per_tier:
        Starter Contingency Agreement: {fee_share: =recall_fee_pct_of_contingency, lookback: =recall_fee_payment_lookback_days, free_window: =free_recall_window_days, cap: =recall_fee_cap_usd, free_pct: =free_recall_pct_of_placements}
        Standard Contingency Agreement: {fee_share: =recall_fee_pct_of_contingency, lookback: =recall_fee_payment_lookback_days, free_window: =free_recall_window_days, cap: =recall_fee_cap_usd, free_pct: =free_recall_pct_of_placements}
        Preferred Contingency Agreement: {fee_share: =recall_fee_pct_of_contingency, lookback: =recall_fee_payment_lookback_days, free_window: =free_recall_window_days, cap: =recall_fee_cap_usd, free_pct: =free_recall_pct_of_placements}
        Select Volume Contingency Agreement: {fee_share: =recall_fee_pct_of_contingency, lookback: =recall_fee_payment_lookback_days, free_window: =free_recall_window_days, cap: =recall_fee_cap_usd, free_pct: =free_recall_pct_of_placements}
        Enterprise Contingency Agreement: {fee_share: =recall_fee_pct_of_contingency, lookback: =recall_fee_payment_lookback_days, free_window: =free_recall_window_days, cap: =recall_fee_cap_usd, free_pct: =free_recall_pct_of_placements}
        Strategic Partner Contingency Agreement: {fee_share: =recall_fee_pct_of_contingency, lookback: =recall_fee_payment_lookback_days, free_window: =free_recall_window_days, cap: =recall_fee_cap_usd, free_pct: =free_recall_pct_of_placements}
    measures: [client_msr_free_recalls_12m]

  - id: client_evt_credits_and_reversals
    subject: [client_collection_reversed, client_fee_credit_issued]
    rule: >-
      When a payment Ridgeline collected is returned, or part of it is refunded to the consumer as
      an overpayment, the same amount is reversed out of the client's trust balance against the
      original collection. The fee on a reversed collection is credited back — as a
      reversed_collection_fee credit in fees_receivable for a gross_remit agreement, and by reducing
      the next period's retained fees for a net_remit agreement — but a reversed-collection credit is
      issued only when the handling date is no later than the fee credit window counted from the
      reversal's txn_date. The fee credit window is fee_credit_window_days calendar days, the day
      after the reversal's txn_date being day one and the last day included. A billing_error credit
      corrects a fee line the client disputed within the fee dispute window; a recall_fee_waived
      credit reverses a recall fee charged on a recall that qualified as free; and a volume_rebate
      credit of volume_rebate_pct percent of the contingency fees billed in the review year is issued
      at the tier review when client_msr_trailing_collections exceeds volume_rebate_threshold_usd.
      Each reversed collection receives at most one reversed-collection credit.
    eligibility:
      - id: within_fee_credit_window
        applies_to: [client_fee_credit_issued]
        kind: time
        condition: a reversed-collection credit is issued only when the handling date is no later than the fee credit window counted from the reversal's txn_date.
        evidence_fields: [client_ledger.txn_date, client_ledger.source_txn_id, client_ledger.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_ledger.source_txn_id]
          action_bindings:
            client_ledger.source_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the reversal's txn_date
          anchor_source: client_ledger.txn_date
          relation: not_after
          duration_source: variants.fee_credit_window_days
          unit: calendar_days
          counting_rule: The fee credit window is fee_credit_window_days calendar days, the day after the reversal's txn_date being day one and the last day included.
          boundary: inclusive
      - id: one_credit_per_reversal
        applies_to: [client_fee_credit_issued]
        kind: dedup
        condition: Each reversed collection receives at most one reversed-collection credit.
        evidence_fields: [client_ledger.source_txn_id, client_ledger.credit_reason, client_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_ledger.source_txn_id, client_ledger.credit_reason]
          action_bindings:
            client_ledger.source_txn_id: source_txn_id
            client_ledger.credit_reason: credit_reason
        dedup_contract:
          table: client_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id, credit_reason: credit_reason}
          duplicate_filters: {event_type: [client_fee_credit_issued]}
          distinct_fields: []
    params:
      per_tier:
        Starter Contingency Agreement: {credit_window: =fee_credit_window_days, dispute_window: =fee_dispute_window_days, rebate_threshold: =volume_rebate_threshold_usd, rebate_pct: =volume_rebate_pct}
        Standard Contingency Agreement: {credit_window: =fee_credit_window_days, dispute_window: =fee_dispute_window_days, rebate_threshold: =volume_rebate_threshold_usd, rebate_pct: =volume_rebate_pct}
        Preferred Contingency Agreement: {credit_window: =fee_credit_window_days, dispute_window: =fee_dispute_window_days, rebate_threshold: =volume_rebate_threshold_usd, rebate_pct: =volume_rebate_pct}
        Select Volume Contingency Agreement: {credit_window: =fee_credit_window_days, dispute_window: =fee_dispute_window_days, rebate_threshold: =volume_rebate_threshold_usd, rebate_pct: =volume_rebate_pct}
        Enterprise Contingency Agreement: {credit_window: =fee_credit_window_days, dispute_window: =fee_dispute_window_days, rebate_threshold: =volume_rebate_threshold_usd, rebate_pct: =volume_rebate_pct}
        Strategic Partner Contingency Agreement: {credit_window: =fee_credit_window_days, dispute_window: =fee_dispute_window_days, rebate_threshold: =volume_rebate_threshold_usd, rebate_pct: =volume_rebate_pct}
    measures: [client_msr_trailing_collections]

  - id: client_evt_onboarding
    subject: [client_agreement_signed, client_agreement_lapsed]
    rule: >-
      An agreement binds only on the client's own signature by an authorized signer; Ridgeline
      never activates an agreement on a verbal yes. An agreement is signed only when the handling
      date is no later than the last day of the signature window counted from its issued_date. The
      signature window is signature_window_days calendar days, the day after issued_date being day
      one and the last day included. The effective date is the later of the planned effective date
      and the signing date, and the initial term of initial_term_months months runs from the
      effective date. An agreement still unsigned after the window lapses and closes; the client is
      issued a new agreement if it still wants to place accounts.
    eligibility:
      - id: within_signature_window
        applies_to: [client_agreement_signed]
        kind: time
        condition: An agreement is signed only when the handling date is no later than the last day of the signature window counted from its issued_date.
        evidence_fields: [client_agreements.issued_date, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its issued_date
          anchor_source: client_agreements.issued_date
          relation: not_after
          duration_source: variants.signature_window_days
          unit: calendar_days
          counting_rule: The signature window is signature_window_days calendar days, the day after issued_date being day one and the last day included.
          boundary: inclusive
    params:
      per_tier:
        Starter Contingency Agreement: {window: =signature_window_days, initial_term: =initial_term_months}
        Standard Contingency Agreement: {window: =signature_window_days, initial_term: =initial_term_months}
        Preferred Contingency Agreement: {window: =signature_window_days, initial_term: =initial_term_months}
        Select Volume Contingency Agreement: {window: =signature_window_days, initial_term: =initial_term_months}
        Enterprise Contingency Agreement: {window: =signature_window_days, initial_term: =initial_term_months}
        Strategic Partner Contingency Agreement: {window: =signature_window_days, initial_term: =initial_term_months}

  - id: client_evt_termination_and_renewal
    subject: [client_runoff_started, client_agreement_closed, client_term_renewed, client_early_termination_fee_assessed]
    rule: >-
      An agreement renews automatically for renewal_term_months months at each term end unless the
      client gives notice of non-renewal at least nonrenewal_notice_days calendar days before the
      term end. The client may instead terminate before the term ends by giving
      termination_notice_days calendar days of notice, the termination taking effect on the later of
      the notice date plus that notice period and the date the client names. Notices are given only
      by the client through a termination_notice or nonrenewal_notice service request. A termination that takes effect
      before the end of the initial term carries the early_termination_fee_usd, charged on the date
      the notice was received; non-renewal at a term end and any termination after the initial term
      carry no fee. From the effective date the agreement is in runoff: no new placements are
      accepted, accounts already placed keep being worked and remitted for runoff_days calendar
      days, and every account still open on runoff_end_date is returned to the client with
      close_reason client_recall, free of recall fees. The agreement closes only when the handling
      date is later than the runoff period counted from the termination effective date. The runoff
      period is runoff_days calendar days, the day after termination_effective_date being day one,
      and it ends on runoff_end_date.
    eligibility:
      - id: runoff_period_over
        applies_to: [client_agreement_closed]
        kind: time
        condition: The agreement closes only when the handling date is later than the runoff period counted from the termination effective date.
        evidence_fields: [client_agreements.termination_effective_date, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the termination effective date
          anchor_source: client_agreements.termination_effective_date
          relation: not_before
          duration_source: variants.runoff_days
          unit: calendar_days
          counting_rule: The runoff period is runoff_days calendar days, the day after termination_effective_date being day one, and it ends on runoff_end_date.
          boundary: exclusive
      - id: client_notice_on_record
        applies_to: [client_runoff_started]
        kind: state
        condition: Notices are given only by the client through a termination_notice or nonrenewal_notice service request.
        evidence_fields: [client_service_requests.request_status, client_service_requests.request_type, client_service_requests.service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_service_requests.service_request_id]
          action_bindings:
            client_service_requests.service_request_id: service_request_id
        state_contract:
          field: client_service_requests.request_status
          allowed: [received, processed]
    params:
      per_tier:
        Starter Contingency Agreement: {renewal: =renewal_term_months, nonrenewal_notice: =nonrenewal_notice_days, termination_notice: =termination_notice_days, runoff: =runoff_days, early_fee: =early_termination_fee_usd}
        Standard Contingency Agreement: {renewal: =renewal_term_months, nonrenewal_notice: =nonrenewal_notice_days, termination_notice: =termination_notice_days, runoff: =runoff_days, early_fee: =early_termination_fee_usd}
        Preferred Contingency Agreement: {renewal: =renewal_term_months, nonrenewal_notice: =nonrenewal_notice_days, termination_notice: =termination_notice_days, runoff: =runoff_days, early_fee: =early_termination_fee_usd}
        Select Volume Contingency Agreement: {renewal: =renewal_term_months, nonrenewal_notice: =nonrenewal_notice_days, termination_notice: =termination_notice_days, runoff: =runoff_days, early_fee: =early_termination_fee_usd}
        Enterprise Contingency Agreement: {renewal: =renewal_term_months, nonrenewal_notice: =nonrenewal_notice_days, termination_notice: =termination_notice_days, runoff: =runoff_days, early_fee: =early_termination_fee_usd}
        Strategic Partner Contingency Agreement: {renewal: =renewal_term_months, nonrenewal_notice: =nonrenewal_notice_days, termination_notice: =termination_notice_days, runoff: =runoff_days, early_fee: =early_termination_fee_usd}

  - id: client_evt_terms_changes
    subject: [client_terms_updated]
    rule: >-
      The client may change its remittance basis, remittance frequency or credit reporting
      authorization through a service request, and the change is written to the agreement once the
      request is processed. Terms are changed only on agreements whose status is active or
      placement_hold; an agreement in runoff keeps its terms to the end. Gross remittance is
      available only where gross_remit_available is true, weekly remittance only where
      weekly_remittance_available is true and semi-monthly only where
      semi_monthly_remittance_available is true. Remittance basis and frequency changes together
      count against remittance_basis_changes_per_year and reporting authorization changes against
      reporting_authorization_changes_per_year, both counted by client_msr_terms_changes_year in
      the agreement year. A remittance change applies from the first remittance period that begins
      at least terms_change_effective_lead_days calendar days after the request_date. A reporting
      authorization change takes effect when processed: revoking it stops initial reports and leads
      to deletion of every live tradeline on the client's accounts under the credit reporting rule,
      and granting it lets accounts that meet the reporting rule be reported from the next cycle.
    eligibility:
      - id: terms_change_status
        applies_to: [client_terms_updated]
        kind: state
        condition: Terms are changed only on agreements whose status is active or placement_hold; an agreement in runoff keeps its terms to the end.
        evidence_fields: [client_agreements.status, client_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [client_agreements.agreement_id]
          action_bindings:
            client_agreements.agreement_id: agreement_id
        state_contract:
          field: client_agreements.status
          allowed: [active, placement_hold]
    params:
      per_tier:
        Starter Contingency Agreement: {gross_ok: =gross_remit_available, weekly_ok: =weekly_remittance_available, basis_changes: =remittance_basis_changes_per_year, reporting_changes: =reporting_authorization_changes_per_year, lead_days: =terms_change_effective_lead_days}
        Standard Contingency Agreement: {gross_ok: =gross_remit_available, weekly_ok: =weekly_remittance_available, basis_changes: =remittance_basis_changes_per_year, reporting_changes: =reporting_authorization_changes_per_year, lead_days: =terms_change_effective_lead_days}
        Preferred Contingency Agreement: {gross_ok: =gross_remit_available, weekly_ok: =weekly_remittance_available, basis_changes: =remittance_basis_changes_per_year, reporting_changes: =reporting_authorization_changes_per_year, lead_days: =terms_change_effective_lead_days}
        Select Volume Contingency Agreement: {gross_ok: =gross_remit_available, weekly_ok: =weekly_remittance_available, basis_changes: =remittance_basis_changes_per_year, reporting_changes: =reporting_authorization_changes_per_year, lead_days: =terms_change_effective_lead_days}
        Enterprise Contingency Agreement: {gross_ok: =gross_remit_available, weekly_ok: =weekly_remittance_available, basis_changes: =remittance_basis_changes_per_year, reporting_changes: =reporting_authorization_changes_per_year, lead_days: =terms_change_effective_lead_days}
        Strategic Partner Contingency Agreement: {gross_ok: =gross_remit_available, weekly_ok: =weekly_remittance_available, basis_changes: =remittance_basis_changes_per_year, reporting_changes: =reporting_authorization_changes_per_year, lead_days: =terms_change_effective_lead_days}
    measures: [client_msr_terms_changes_year]

extended_policies:
  - id: client_ext_early_termination_charge
    base_policy_refs: [client_evt_termination_and_renewal]
    overwrite:
      - base_policy: client_evt_termination_and_renewal
        superseded_clause: >-
          A termination that takes effect before the end of the initial term carries the
          early_termination_fee_usd, charged on the date the notice was received
        replaced_by: >-
          The early-termination charge owed for a termination notice on record is figured from
          the tier's early_termination_fee_usd as set out in this rule and booked on the date the
          notice was received.
    trigger: state_due
    subject: [client_early_termination_fee_assessed]
    computes: charge_amount
    target_tool: book_early_termination_charge_4cc8362c
    params:
      days_per_month: 30
      long_term_months: 24
      suits_high: 3
      legal_red_high: 0.40
      legal_red_low: 0.20
      lead_ratio_high: 1.5
      lead_ratio_low: 1.25
      lead_red_high: 0.10
      lead_red_low: 0.05
      conv_high: 3
      pre_red_high: 0.10
      pre_red_low: 0.05
      goodwill_none_from: 3
      goodwill_partial: 0.5
    rule: >-
      The early-termination charge owed for a termination notice on record is figured from the
      tier's early_termination_fee_usd as set out in this rule and booked on the date the notice was received. A window of a number of months before a date covers the dates after the same day that number of
      months earlier, up to and including that date. The early-termination charge for a termination notice on record is the tier's
      early_termination_fee_usd in full when the termination takes effect before the end of the
      initial term, and nothing when it takes effect on or after that end. The termination takes
      effect on the later of the notice date plus the tier's termination_notice_days calendar days
      and the date the client names in its notice. The end of the initial term is the agreement's
      term end date while the agreement has not renewed.
      The agreement has renewed when its term end date lies the tier's initial_term_months or more whole
      months after its effective date, and a termination of a renewed agreement takes effect after the
      initial term and carries no charge. The unexpired initial term is counted in calendar days from the
      termination effective date to the end of the initial term, and the length of the initial term in
      calendar days from the agreement's effective date to the end of the initial term. Each such count is
      the difference between the two dates in calendar days: the first date is not counted and the last
      date is counted. How much of the fee is charged depends on how much of the initial term
      is unexpired: when the unexpired initial term is no more than half the length of the initial
      term and the tier's initial_term_months is 24 or more, the fee is charged pro rata to the
      unexpired whole months, a whole month being each complete 30 calendar days of the unexpired
      term counted down, so the fee is multiplied by those whole months and divided by the tier's
      initial_term_months; when the unexpired initial term is no more than half the length of the
      initial term and the tier's initial_term_months is under 24, the fee is charged pro rata to
      the unexpired calendar days, so the fee is multiplied by the unexpired days and divided by
      the length of the initial term in days; when more than half the initial term is unexpired,
      the fee is charged in full. Three reductions may apply to that charge. A legal forwarding
      reduction applies where the client's legal forwarding agreement that names this contingency
      agreement is active: it is 40 percent where 3 or more suits were filed under that legal
      agreement in the 12 months before the handling date, 20 percent where it is active and 1 or
      2 suits were filed in those 12 months, and nothing otherwise. A notice-lead reduction applies
      where the client named a date giving more notice than the tier requires: it is 10 percent
      where the calendar days from the notice date to the named date are at least one and a half
      times the tier's termination_notice_days, 5 percent where they are at least one and a
      quarter times but less than one and a half times that notice period, and nothing otherwise.
      A pre-collect reduction applies where the client's flat-fee pre-collect program that names
      this contingency agreement for conversions is active: it is 10 percent where 3 or more of
      its debtors were converted to contingency collection in the 12 months before the handling
      date, 5 percent where it is active and 1 or 2 were converted in those 12 months, and nothing
      otherwise. The three reductions are first added into one reduction share, and that share is
      then multiplied by a goodwill share set by the late charges booked on the agreement in the
      12 months before the handling date: none of the reduction share is kept where 3 or more late
      charges were booked, half of it is kept where 1 or 2 were booked, and all of it is kept where
      none was booked. The charge after proration is reduced once by the resulting share; the
      reductions do not act one after another. The charge is booked on the date the notice was
      received, rounded to the cent.
    baseline:
      rule: >-
        The early-termination charge for a termination notice on record is the tier's
        early_termination_fee_usd in full when the termination takes effect before the end of the
        initial term, and nothing when it takes effect on or after that end. The termination takes
        effect on the later of the notice date plus the tier's termination_notice_days calendar days
        and the date the client names in its notice. The end of the initial term is the agreement's
        term end date while the agreement has not renewed. The agreement has renewed when its term end date lies the tier's
        initial_term_months or more whole months after its effective date, and a termination of a renewed
        agreement takes effect after the initial term and carries no charge. The charge is booked on the date
        the notice was received, rounded to the cent.
      params: [early_termination_fee_usd, termination_notice_days]
    prerequisite: []
    cross_category:
      - category: legal
        as: branch
        reads: [status, legal_matter_events.event_type, legal_matter_events.txn_date]
        note: The legal forwarding reduction is decided from the client's legal forwarding agreement status and the suits filed under it in the trailing 12 months.
      - category: flatfee
        as: branch
        reads: [status, flatfee_unit_ledger.event_type, flatfee_unit_ledger.txn_date]
        note: The pre-collect reduction is decided from the client's flat-fee program status and the debtors it converted in the trailing 12 months.
    compute:
      - notice_date: "LATEST('client_service_requests', 'request_date', date_field='request_date', request_type='termination_notice')"
      - named_date: "LATEST('client_service_requests', 'requested_effective_date', date_field='request_date', request_type='termination_notice')"
      - required_notice_days: "P('termination_notice_days')"
      - named_notice_days: "DAYS(notice_date, named_date)"
      - notice_to_effective_days: "MX(required_notice_days, named_notice_days)"
      - unexpired_days: "DAYS(notice_date, F('term_end_date')) - notice_to_effective_days"
      - initial_term_days: "DAYS(F('effective_date'), F('term_end_date'))"
      - term_months: "P('initial_term_months')"
      - full_charge: "P('early_termination_fee_usd')"
      - prorated_charge: "full_charge * int(unexpired_days / K('days_per_month')) / term_months if (unexpired_days * 2 <= initial_term_days and term_months >= K('long_term_months')) else (full_charge * unexpired_days / initial_term_days if (unexpired_days * 2 <= initial_term_days and term_months < K('long_term_months')) else full_charge)"
      - legal_status: "CFIELD('legal', 'status', agreement_id=HID)"
      - legal_agreement_ref: "CFIELD('legal', 'legal_agreement_id', agreement_id=HID)"
      - legal_suits_12m: "XCOUNT('legal', 'legal_matter_events', within_months=12, date_field='txn_date', event_type='legal_suit_filed', legal_agreement_id=legal_agreement_ref)"
      - legal_reduction: "K('legal_red_high') if (legal_status == 'active' and legal_suits_12m >= K('suits_high')) else (K('legal_red_low') if (legal_status == 'active' and legal_suits_12m >= 1 and legal_suits_12m < K('suits_high')) else 0)"
      - lead_reduction: "K('lead_red_high') if (named_notice_days >= required_notice_days * K('lead_ratio_high')) else (K('lead_red_low') if (named_notice_days >= required_notice_days * K('lead_ratio_low') and named_notice_days < required_notice_days * K('lead_ratio_high')) else 0)"
      - precollect_status: "CFIELD('flatfee', 'status', agreement_id=HID)"
      - precollect_program_ref: "CFIELD('flatfee', 'program_id', agreement_id=HID)"
      - precollect_conversions_12m: "XCOUNT('flatfee', 'flatfee_unit_ledger', within_months=12, date_field='txn_date', event_type='flatfee_conversion_requested', program_id=precollect_program_ref)"
      - precollect_reduction: "K('pre_red_high') if (precollect_status == 'active' and precollect_conversions_12m >= K('conv_high')) else (K('pre_red_low') if (precollect_status == 'active' and precollect_conversions_12m >= 1 and precollect_conversions_12m < K('conv_high')) else 0)"
      - late_charges_12m: "COUNT('client_ledger', within_months=12, date_field='txn_date', event_type='client_late_charge_assessed')"
      - goodwill_share: "0 if late_charges_12m >= K('goodwill_none_from') else (K('goodwill_partial') if (late_charges_12m >= 1 and late_charges_12m < K('goodwill_none_from')) else 1)"
      - reduction_share: "(legal_reduction + lead_reduction + precollect_reduction) * goodwill_share"
      - renewed: "MONTHS(F('effective_date'), F('term_end_date')) >= P('initial_term_months')"
      - result: "RND(prorated_charge * (1 - reduction_share), 2) if (unexpired_days > 0 and not renewed) else 0"
    compute_basis:
      notice_date: "The charge is booked on the date the notice was received, rounded to the cent."
      named_date: "The termination takes effect on the later of the notice date plus the tier's termination_notice_days calendar days and the date the client names in its notice."
      notice_to_effective_days: "The termination takes effect on the later of the notice date plus the tier's termination_notice_days calendar days and the date the client names in its notice."
      unexpired_days: "Each such count is the difference between the two dates in calendar days: the first date is not counted and the last date is counted."
      initial_term_days: "The end of the initial term is the agreement's term end date while the agreement has not renewed."
      prorated_charge: "when the unexpired initial term is no more than half the length of the initial term and the tier's initial_term_months is 24 or more, the fee is charged pro rata to the unexpired whole months, a whole month being each complete 30 calendar days of the unexpired term counted down, so the fee is multiplied by those whole months and divided by the tier's initial_term_months; when the unexpired initial term is no more than half the length of the initial term and the tier's initial_term_months is under 24, the fee is charged pro rata to the unexpired calendar days, so the fee is multiplied by the unexpired days and divided by the length of the initial term in days; when more than half the initial term is unexpired, the fee is charged in full."
      legal_status: "A legal forwarding reduction applies where the client's legal forwarding agreement that names this contingency agreement is active"
      legal_agreement_ref: "the client's legal forwarding agreement that names this contingency agreement"
      legal_suits_12m: "it is 40 percent where 3 or more suits were filed under that legal agreement in the 12 months before the handling date"
      legal_reduction: "it is 40 percent where 3 or more suits were filed under that legal agreement in the 12 months before the handling date, 20 percent where it is active and 1 or 2 suits were filed in those 12 months, and nothing otherwise."
      lead_reduction: "it is 10 percent where the calendar days from the notice date to the named date are at least one and a half times the tier's termination_notice_days, 5 percent where they are at least one and a quarter times but less than one and a half times that notice period, and nothing otherwise."
      precollect_status: "A pre-collect reduction applies where the client's flat-fee pre-collect program that names this contingency agreement for conversions is active"
      precollect_program_ref: "the client's flat-fee pre-collect program that names this contingency agreement for conversions"
      precollect_conversions_12m: "it is 10 percent where 3 or more of its debtors were converted to contingency collection in the 12 months before the handling date"
      precollect_reduction: "it is 10 percent where 3 or more of its debtors were converted to contingency collection in the 12 months before the handling date, 5 percent where it is active and 1 or 2 were converted in those 12 months, and nothing otherwise."
      late_charges_12m: "a goodwill share set by the late charges booked on the agreement in the 12 months before the handling date"
      goodwill_share: "none of the reduction share is kept where 3 or more late charges were booked, half of it is kept where 1 or 2 were booked, and all of it is kept where none was booked."
      reduction_share: "The three reductions are first added into one reduction share, and that share is then multiplied by a goodwill share"
      renewed: "The agreement has renewed when its term end date lies the tier's initial_term_months or more whole months after its effective date, and a termination of a renewed agreement takes effect after the initial term and carries no charge."
      result: "The charge after proration is reduced once by the resulting share; the reductions do not act one after another. The charge is booked on the date the notice was received, rounded to the cent."
    factors:
      - id: unexpired_term_proration
        effect: method
        decides: prorated_charge
        bindings: [unexpired_days, initial_term_days, prorated_charge]
        ladder:
          - when: "the unexpired initial term is no more than half the initial term and the tier's initial term is 24 months or more"
            method: "the fee is multiplied by the unexpired whole months (complete 30-day spans counted down) and divided by the tier's initial term months"
          - when: "the unexpired initial term is no more than half the initial term and the tier's initial term is under 24 months"
            method: "the fee is multiplied by the unexpired calendar days and divided by the initial term's length in days"
          - when: "otherwise (more than half the initial term unexpired)"
            method: "the fee is charged in full"
        baseline:
          prorated_charge: "full_charge"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: legal_forwarding_reduction
        effect: parameter
        decides: legal_reduction
        bindings: [legal_status, legal_agreement_ref, legal_suits_12m, legal_reduction]
        ladder:
          - when: "the client's legal forwarding agreement naming this contingency agreement is active and 3 or more suits were filed under it in the trailing 12 months"
            value: "K('legal_red_high') = 40 percent"
          - when: "that legal forwarding agreement is active and 1 or 2 suits were filed under it in the trailing 12 months"
            value: "K('legal_red_low') = 20 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          legal_reduction: "0"
        evidence: [cross_category, history]
        cross_difficulty: legal
      - id: notice_lead_reduction
        effect: parameter
        decides: lead_reduction
        bindings: [named_date, named_notice_days, lead_reduction]
        ladder:
          - when: "the days from the notice date to the named date are at least 1.5 times the tier's termination notice days"
            value: "K('lead_red_high') = 10 percent"
          - when: "those days are at least 1.25 times but less than 1.5 times the tier's termination notice days"
            value: "K('lead_red_low') = 5 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          lead_reduction: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: precollect_conversion_reduction
        effect: parameter
        decides: precollect_reduction
        bindings: [precollect_status, precollect_program_ref, precollect_conversions_12m, precollect_reduction]
        ladder:
          - when: "the client's flat-fee pre-collect program naming this agreement is active and 3 or more of its debtors were converted in the trailing 12 months"
            value: "K('pre_red_high') = 10 percent"
          - when: "that program is active and 1 or 2 of its debtors were converted in the trailing 12 months"
            value: "K('pre_red_low') = 5 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          precollect_reduction: "0"
        evidence: [cross_category, history]
        cross_difficulty: flatfee
      - id: late_charge_goodwill
        effect: parameter
        decides: goodwill_share
        bindings: [late_charges_12m, goodwill_share]
        ladder:
          - when: "3 or more late charges were booked on the agreement in the trailing 12 months"
            value: "0 (no reduction kept)"
          - when: "1 or 2 late charges were booked on the agreement in the trailing 12 months"
            value: "K('goodwill_partial') = half of the reduction share kept"
          - when: "otherwise (no late charge in the trailing 12 months)"
            value: "1 (the whole reduction share kept)"
        baseline:
          goodwill_share: "1"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: client_service_requests, aggregate: latest, field: request_date, filters: {request_type: termination_notice}}
        - {table: client_ledger, aggregate: count, field: client_txn_id, within_months: 12, filters: {event_type: client_late_charge_assessed}}
        - {category: legal, table: legal_matter_events, aggregate: count, field: matter_event_id, within_months: 12, filters: {event_type: legal_suit_filed}}
        - {category: flatfee, table: flatfee_unit_ledger, aggregate: count, field: unit_txn_id, within_months: 12, filters: {event_type: flatfee_conversion_requested}}
      cross_category: [legal, flatfee]
  - id: client_ext_closing_settlement_payment
    base_policy_refs: [client_evt_fee_billing, client_evt_termination_and_renewal, client_evt_remittance]
    overwrite:
      - base_policy: client_evt_fee_billing
        superseded_clause: >-
          Where fees_offset_against_remittance is true, Ridgeline may deduct a past-due invoice from
          the next gross remittance, booking the deduction as a fee payment whose payment_ref is that
          remittance's statement number.
        replaced_by: >-
          on a gross_remit agreement whose tier has fees_offset_against_remittance true, the
          available trust balance is set against the open invoiced fees, whether or not they are
          past due, and never against more than those open invoiced fees
      - base_policy: client_evt_remittance
        superseded_clause: >-
          For a net_remit agreement the period's fees are first retained from trust and the rest is
          remitted
        replaced_by: >-
          on a net_remit agreement, the available trust balance is set against the whole of the fees owed
    trigger: on_request
    subject: [client_fee_payment_received]
    computes: payment_amount
    target_tool: pay_closing_fee_settlement_180c3708
    params:
      returns_full_from: 3
      reserve_share_half: 0.5
      legal_reserve_half: 0.5
      prompt_days_high: 10
      prompt_days_low: 30
      prompt_disc_high: 0.10
      prompt_disc_low: 0.05
      waiver_half: 0.5
    rule: >-
      A creditor client that has given termination notice on an agreement may settle the fees it
      owes on that agreement with one closing settlement payment, which the client makes itself. Where a
      termination notice is on record, a payment of the fees owed on that agreement is a closing settlement
      payment even when the client names one of its invoices. A window of a number of months before a date covers the dates after the same day that number of
      months earlier, up to and including that date.
      The closing settlement payment is worked out only after the agreement's fees owed carry the
      early-termination charge due for the termination notice on record. The closing settlement
      payment on an agreement with a termination notice on record is the agreement's fees owed to
      Ridgeline on the day the payment is made, rounded to the cent. Part of the fees owed may first
      be met from the collections Ridgeline holds in trust for the client, and how depends on the
      remittance terms: on a net_remit agreement, the available trust balance is set against the
      whole of the fees owed; on a gross_remit agreement whose tier has
      fees_offset_against_remittance true, the available trust balance is set against the open
      invoiced fees, whether or not they are past due, and never against more than those open
      invoiced fees; on any other agreement nothing is met from trust. The open invoiced fees are
      the fee invoices booked on the agreement less every fee payment and every fee credit booked
      on it, and never less than zero. The available trust balance is the trust balance held less
      two reserves, and never less than zero. The first reserve covers consumer payments that may
      still come back: it is all of the collections booked in the month before the payment where 3
      or more collections were reversed as returned payments in the 6 months before the payment,
      half of those collections where 1 or 2 were so reversed, and nothing where none was. The
      second reserve covers court costs Ridgeline has advanced on the client's legal matters: it is
      the whole unreimbursed cost advance of the client's legal forwarding agreement that names
      this contingency agreement where that legal agreement is active and the advance is above
      zero, half of that advance where the legal agreement is suspended and the advance is above
      zero, and nothing otherwise. A prompt-settlement discount is taken off the early-termination
      charge booked on the agreement: it is 10 percent of that charge where the payment is made no
      more than 10 calendar days after the date the termination notice was received, 5 percent where
      it is made more than 10 but no more than 30 calendar days after it, and nothing later. Late
      charges booked on the agreement in the 12 months before the payment are waived from the
      payment in full where exactly one late charge was booked in those 12 months, by half where
      exactly two were booked, and not at all otherwise. The payment is the fees owed, less the
      amount met from trust, less the prompt-settlement discount, less the late-charge waiver, all
      taken off the same fees owed, never less than zero and rounded to the cent once at the end.
      The amount met from trust is settled from the trust balance when the closing statement is
      drawn, and the discount and waiver are cleared by credit on that statement.
    baseline:
      rule: >-
        The closing settlement payment on an agreement with a termination notice on record is the
        agreement's fees owed to Ridgeline on the day the payment is made, rounded to the cent.
      params: []
    prerequisite:
      - problem: client_ext_early_termination_charge
        kind: value_input
        gate: termination_charge
        form: state
        policy_source: >-
          The closing settlement payment is worked out only after the agreement's fees owed carry
          the early-termination charge due for the termination notice on record.
        condition: >-
          The agreement's client money history carries an early-termination charge entry dated the
          request date of the termination notice on record, booked at the figure the
          early-termination charge rule gives, and the agreement's fees owed include it.
        resolved_by: book_early_termination_charge_4cc8362c
        effect: >-
          The early-termination charge read by this computation rises from zero to the booked
          charge, the fees owed rise by the same amount, and the prompt-settlement discount is
          figured on that charge.
    cross_category:
      - category: legal
        as: branch
        reads: [status, cost_advance_balance]
        note: The legal cost reserve is decided from the status and unreimbursed cost advance of the client's legal forwarding agreement.
    compute:
      - fees_owed: "F('fees_receivable')"
      - trust_held: "F('trust_payable')"
      - termination_charge: "SUM('client_ledger', 'amount', event_type='client_early_termination_fee_assessed')"
      - invoiced_total: "SUM('client_ledger', 'amount', event_type='client_fee_invoiced')"
      - fee_payments_total: "SUM('client_ledger', 'amount', event_type='client_fee_payment_received')"
      - fee_credits_total: "SUM('client_ledger', 'amount', event_type='client_fee_credit_issued')"
      - open_invoiced: "MX(0, invoiced_total - fee_payments_total - fee_credits_total)"
      - returns_6m: "COUNT('client_ledger', within_months=6, date_field='txn_date', event_type='client_collection_reversed', reversal_reason='payment_returned')"
      - recent_collections: "SUM('client_ledger', 'amount', within_months=1, date_field='txn_date', event_type='client_collection_booked')"
      - return_reserve_share: "1 if returns_6m >= K('returns_full_from') else (K('reserve_share_half') if (returns_6m >= 1 and returns_6m < K('returns_full_from')) else 0)"
      - return_reserve: "recent_collections * return_reserve_share"
      - legal_status_now: "CFIELD('legal', 'status', agreement_id=HID)"
      - legal_cost_advance: "CFIELD('legal', 'cost_advance_balance', agreement_id=HID) or 0"
      - legal_reserve_share: "1 if (legal_status_now == 'active' and legal_cost_advance > 0) else (K('legal_reserve_half') if (legal_status_now == 'suspended' and legal_cost_advance > 0) else 0)"
      - legal_reserve: "legal_cost_advance * legal_reserve_share"
      - trust_available: "MX(0, trust_held - return_reserve - legal_reserve)"
      - trust_met: "MN(trust_available, fees_owed) if F('remittance_basis') == 'net_remit' else (MN(trust_available, open_invoiced) if (F('remittance_basis') == 'gross_remit' and P('fees_offset_against_remittance')) else 0)"
      - notice_received: "LATEST('client_service_requests', 'request_date', date_field='request_date', request_type='termination_notice')"
      - days_since_notice: "DAYS(notice_received, NOW)"
      - prompt_share: "K('prompt_disc_high') if days_since_notice <= K('prompt_days_high') else (K('prompt_disc_low') if (days_since_notice > K('prompt_days_high') and days_since_notice <= K('prompt_days_low')) else 0)"
      - prompt_discount: "termination_charge * prompt_share"
      - late_count_12m: "COUNT('client_ledger', within_months=12, date_field='txn_date', event_type='client_late_charge_assessed')"
      - late_amount_12m: "SUM('client_ledger', 'amount', within_months=12, date_field='txn_date', event_type='client_late_charge_assessed')"
      - waiver_share: "1 if late_count_12m == 1 else (K('waiver_half') if late_count_12m == 2 else 0)"
      - late_waiver: "late_amount_12m * waiver_share"
      - result: "RND(MX(0, fees_owed - trust_met - prompt_discount - late_waiver), 2)"
    compute_basis:
      fees_owed: "The closing settlement payment on an agreement with a termination notice on record is the agreement's fees owed to Ridgeline on the day the payment is made, rounded to the cent."
      trust_held: "The available trust balance is the trust balance held less two reserves, and never less than zero."
      termination_charge: "The closing settlement payment is worked out only after the agreement's fees owed carry the early-termination charge due for the termination notice on record."
      open_invoiced: "The open invoiced fees are the fee invoices booked on the agreement less every fee payment and every fee credit booked on it, and never less than zero."
      returns_6m: "it is all of the collections booked in the month before the payment where 3 or more collections were reversed as returned payments in the 6 months before the payment"
      recent_collections: "A window of a number of months before a date covers the dates after the same day that number of months earlier, up to and including that date."
      return_reserve_share: "it is all of the collections booked in the month before the payment where 3 or more collections were reversed as returned payments in the 6 months before the payment, half of those collections where 1 or 2 were so reversed, and nothing where none was."
      legal_status_now: "where that legal agreement is active and the advance is above zero"
      legal_cost_advance: "the whole unreimbursed cost advance of the client's legal forwarding agreement that names this contingency agreement"
      legal_reserve_share: "it is the whole unreimbursed cost advance of the client's legal forwarding agreement that names this contingency agreement where that legal agreement is active and the advance is above zero, half of that advance where the legal agreement is suspended and the advance is above zero, and nothing otherwise."
      trust_available: "The available trust balance is the trust balance held less two reserves, and never less than zero."
      trust_met: "on a net_remit agreement, the available trust balance is set against the whole of the fees owed; on a gross_remit agreement whose tier has fees_offset_against_remittance true, the available trust balance is set against the open invoiced fees, whether or not they are past due, and never against more than those open invoiced fees; on any other agreement nothing is met from trust."
      notice_received: "where the payment is made no more than 10 calendar days after the date the termination notice was received"
      prompt_share: "it is 10 percent of that charge where the payment is made no more than 10 calendar days after the date the termination notice was received, 5 percent where it is made more than 10 but no more than 30 calendar days after it, and nothing later."
      late_count_12m: "Late charges booked on the agreement in the 12 months before the payment"
      late_amount_12m: "Late charges booked on the agreement in the 12 months before the payment"
      waiver_share: "are waived from the payment in full where exactly one late charge was booked in those 12 months, by half where exactly two were booked, and not at all otherwise."
      result: "The payment is the fees owed, less the amount met from trust, less the prompt-settlement discount, less the late-charge waiver, all taken off the same fees owed, never less than zero and rounded to the cent once at the end."
    factors:
      - id: trust_offset_method
        effect: method
        decides: trust_met
        bindings: [invoiced_total, fee_payments_total, fee_credits_total, open_invoiced, trust_available, trust_met]
        ladder:
          - when: "the agreement is remitted net_remit"
            method: "the available trust balance is set against the whole of the fees owed"
          - when: "the agreement is remitted gross_remit and its tier allows fees to be offset against remittances"
            method: "the available trust balance is set against the open invoiced fees only (invoices booked less fee payments and fee credits), never more than those"
          - when: "otherwise"
            method: "nothing is met from trust; the whole fees owed are paid"
        baseline:
          trust_met: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: returned_payment_reserve
        effect: parameter
        decides: return_reserve_share
        bindings: [returns_6m, recent_collections, return_reserve_share, return_reserve]
        ladder:
          - when: "3 or more collections were reversed as returned payments in the 6 months before the payment"
            value: "1 (all of the last month's collections reserved)"
          - when: "1 or 2 collections were so reversed"
            value: "K('reserve_share_half') = half of the last month's collections reserved"
          - when: "otherwise (none reversed)"
            value: "0"
        baseline:
          return_reserve_share: "0"
        evidence: [history]
        cross_difficulty: null
      - id: legal_cost_reserve
        effect: parameter
        decides: legal_reserve_share
        bindings: [legal_status_now, legal_cost_advance, legal_reserve_share, legal_reserve]
        ladder:
          - when: "the client's legal forwarding agreement naming this agreement is active and its unreimbursed cost advance is above zero"
            value: "1 (the whole advance reserved)"
          - when: "that legal agreement is suspended and its unreimbursed cost advance is above zero"
            value: "K('legal_reserve_half') = half of the advance reserved"
          - when: "otherwise"
            value: "0"
        baseline:
          legal_reserve_share: "0"
        evidence: [cross_category]
        cross_difficulty: legal
      - id: prompt_settlement_discount
        effect: parameter
        decides: prompt_share
        bindings: [notice_received, days_since_notice, prompt_share, prompt_discount]
        ladder:
          - when: "the payment is made no more than 10 calendar days after the termination notice was received"
            value: "K('prompt_disc_high') = 10 percent of the early-termination charge"
          - when: "the payment is made more than 10 but no more than 30 calendar days after it"
            value: "K('prompt_disc_low') = 5 percent of the early-termination charge"
          - when: "otherwise"
            value: "0"
        baseline:
          prompt_share: "0"
        evidence: [date]
        cross_difficulty: null
      - id: closing_late_charge_waiver
        effect: parameter
        decides: waiver_share
        bindings: [late_count_12m, late_amount_12m, waiver_share, late_waiver]
        ladder:
          - when: "exactly one late charge was booked on the agreement in the 12 months before the payment"
            value: "1 (those late charges waived in full)"
          - when: "exactly two late charges were booked in those 12 months"
            value: "K('waiver_half') = half of those late charges waived"
          - when: "otherwise"
            value: "0"
        baseline:
          waiver_share: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: client_ledger, aggregate: sum, field: amount, filters: {event_type: client_early_termination_fee_assessed}}
        - {table: client_ledger, aggregate: sum, field: amount, filters: {event_type: client_fee_invoiced}}
        - {table: client_ledger, aggregate: count, field: client_txn_id, within_months: 6, filters: {event_type: client_collection_reversed, reversal_reason: payment_returned}}
        - {table: client_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: client_collection_booked}}
        - {table: client_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: client_late_charge_assessed}}
      cross_category: [legal]
  - id: client_ext_invoice_late_charge
    base_policy_refs: [client_evt_fee_billing]
    overwrite:
      - base_policy: client_evt_fee_billing
        superseded_clause: >-
          from then a charge of late_charge_pct_per_month percent of the unpaid invoice amount, and at
          least late_charge_minimum_usd, accrues once for each full calendar month the invoice stays
          unpaid.
        replaced_by: >-
          Each monthly late charge on a past-due fee invoice is figured as set out in this rule, one
          charge for each full calendar month the invoice stays unpaid after its late-charge start.
    trigger: state_due
    subject: [client_late_charge_assessed]
    computes: late_charge_amount
    target_tool: assess_invoice_late_charge_7a6464d6
    params:
      reliable_points_off: 0.50
      new_points_off: 0.25
      pack_age_months: 12
      aging_high_days: 150
      aging_low_days: 100
      aging_add_high: 0.50
      aging_add_low: 0.25
      others_strict: 2
      paid_share_high: 0.5
      paid_share_low: 0.25
      partial_rel_high: 0.25
      partial_rel_low: 0.10
      tenure_high_months: 36
      tenure_low_months: 18
      tenure_rel_high: 0.15
      tenure_rel_low: 0.05
      legal_rel: 0.10
      legal_surcharge: 0.10
    rule: >-
      Each monthly late charge on a past-due fee invoice is figured as set out in this rule, one charge for each full calendar month the invoice stays unpaid after its late-charge start. A full calendar month after a late-charge start runs from that day to the same day of the next
      month, or to that month's last day where the same day does not exist. A window of a number of months before a date covers the dates after the same day that number of
      months earlier, up to and including that date. A late charge on a past-due fee invoice is the tier's late_charge_pct_per_month percent of the
      invoice's unpaid amount, and at least the tier's late_charge_minimum_usd, rounded to the cent.
      The invoice's unpaid amount is the invoice amount less the fee payments and fee credits applied
      to that invoice, and never less than zero. The monthly rate depends on how the client has paid
      its flat-fee pre-collect pack invoice: where the client paid its pre-collect pack invoice within
      the pack's invoice_due_days after purchase and the pack was bought 12 or more months before the
      handling date, the rate is the tier's late_charge_pct_per_month less half a percentage point;
      where it paid that pack invoice within the pack's invoice_due_days and the pack was bought less
      than 12 months before the handling date, the rate is the tier's late_charge_pct_per_month less
      a quarter of a percentage point; otherwise the rate is the tier's late_charge_pct_per_month.
      The rate then steps up with the invoice's age, counted in calendar days from the invoice date
      to the handling date: by half a percentage point where the invoice is 150 or more days old, by
      a quarter of a percentage point where it is at least 100 but less than 150 days old, and not
      at all where it is younger. The percentage charge is the unpaid amount times that monthly rate.
      How the percentage charge and the tier's late_charge_minimum_usd combine depends on the late
      charges booked on the agreement's other invoices in the 12 months before the handling date:
      where 2 or more were booked, the charge is the percentage charge plus the minimum; where none
      was booked, the charge is the percentage charge alone with no minimum; where exactly one was
      booked, the charge is the greater of the percentage charge and the minimum. Three reliefs may
      then apply. A part-payment relief applies where the fee payments applied to the invoice reach
      a share of the invoice amount: 25 percent where they are half or more of it, 10 percent where
      they are at least a quarter but less than half of it, and nothing otherwise. A tenure relief
      applies by the whole months from the agreement's effective date to the handling date: 15
      percent at 36 months or more, 5 percent at 18 months or more but less than 36, and nothing
      under 18 months. A legal standing adjustment applies by the client's legal forwarding
      agreement that names this contingency agreement: a 10 percent relief where that legal
      agreement is active and its cost deposit is at or above the programme's
      cost_deposit_minimum_balance_usd, a 10 percent surcharge where it is suspended and its cost
      deposit is below that minimum, and nothing otherwise. The reliefs and the adjustment are first
      added into one share, and the charge is reduced once by that share; they do not act one after
      another, and the result is rounded to the cent once at the end.
    baseline:
      rule: >-
        A late charge on a past-due fee invoice is the tier's late_charge_pct_per_month percent of the
        invoice's unpaid amount, and at least the tier's late_charge_minimum_usd, rounded to the cent.
        The invoice's unpaid amount is the invoice amount less the fee payments and fee credits
        applied to that invoice, and never less than zero.
      params: [late_charge_pct_per_month, late_charge_minimum_usd]
    prerequisite: []
    cross_category:
      - category: flatfee
        as: branch
        reads: [purchase_date, paid_date]
        note: The late-charge rate tier is decided from when the client bought and paid its flat-fee pre-collect pack.
      - category: legal
        as: branch
        reads: [status, cost_deposit_balance]
        note: The legal standing adjustment is decided from the status and cost deposit of the client's legal forwarding agreement.
    compute:
      - lc_invoice: "LATEST('client_ledger', 'invoice_number', date_field='txn_date', event_type='client_late_charge_assessed')"
      - invoice_amount: "SUM('client_ledger', 'amount', event_type='client_fee_invoiced', invoice_number=lc_invoice)"
      - invoice_date: "LATEST('client_ledger', 'txn_date', date_field='txn_date', event_type='client_fee_invoiced', invoice_number=lc_invoice)"
      - invoice_paid: "SUM('client_ledger', 'amount', event_type='client_fee_payment_received', invoice_number=lc_invoice)"
      - invoice_credited: "SUM('client_ledger', 'amount', event_type='client_fee_credit_issued', invoice_number=lc_invoice)"
      - unpaid_amount: "MX(0, invoice_amount - invoice_paid - invoice_credited)"
      - pack_bought: "CFIELD('flatfee', 'purchase_date', agreement_id=HID) or NOW"
      - pack_paid: "CFIELD('flatfee', 'paid_date', agreement_id=HID) or '9999-12-31'"
      - pack_due_days: "CPARAM('flatfee', 'invoice_due_days', agreement_id=HID) or 0"
      - pack_paid_days: "DAYS(pack_bought, pack_paid)"
      - pack_age: "MONTHS(pack_bought, NOW)"
      - base_rate: "P('late_charge_pct_per_month') - K('reliable_points_off') if (pack_paid_days <= pack_due_days and pack_age >= K('pack_age_months')) else (P('late_charge_pct_per_month') - K('new_points_off') if (pack_paid_days <= pack_due_days and pack_age < K('pack_age_months')) else P('late_charge_pct_per_month'))"
      - invoice_age_days: "DAYS(invoice_date, NOW)"
      - aging_add: "K('aging_add_high') if invoice_age_days >= K('aging_high_days') else (K('aging_add_low') if (invoice_age_days >= K('aging_low_days') and invoice_age_days < K('aging_high_days')) else 0)"
      - monthly_rate: "base_rate + aging_add"
      - pct_charge: "unpaid_amount * monthly_rate / 100"
      - minimum_charge: "P('late_charge_minimum_usd')"
      - other_late_12m: "COUNT('client_ledger', within_months=12, date_field='txn_date', event_type='client_late_charge_assessed') - COUNT('client_ledger', within_months=12, date_field='txn_date', event_type='client_late_charge_assessed', invoice_number=lc_invoice)"
      - combined_charge: "pct_charge + minimum_charge if other_late_12m >= K('others_strict') else (pct_charge if other_late_12m == 0 else MX(pct_charge, minimum_charge))"
      - paid_share: "invoice_paid / MX(invoice_amount, 0.01)"
      - partial_relief: "K('partial_rel_high') if paid_share >= K('paid_share_high') else (K('partial_rel_low') if (paid_share >= K('paid_share_low') and paid_share < K('paid_share_high')) else 0)"
      - tenure_months: "MONTHS(F('effective_date'), NOW)"
      - tenure_relief: "K('tenure_rel_high') if tenure_months >= K('tenure_high_months') else (K('tenure_rel_low') if (tenure_months >= K('tenure_low_months') and tenure_months < K('tenure_high_months')) else 0)"
      - legal_state: "CFIELD('legal', 'status', agreement_id=HID) or 'none'"
      - legal_deposit: "CFIELD('legal', 'cost_deposit_balance', agreement_id=HID) or 0"
      - legal_deposit_min: "CPARAM('legal', 'cost_deposit_minimum_balance_usd', agreement_id=HID) or 0"
      - legal_adjustment: "K('legal_rel') if (legal_state == 'active' and legal_deposit >= legal_deposit_min) else (0 - K('legal_surcharge') if (legal_state == 'suspended' and legal_deposit < legal_deposit_min) else 0)"
      - relief_share: "partial_relief + tenure_relief + legal_adjustment"
      - result: "RND(combined_charge * (1 - relief_share), 2)"
    compute_basis:
      lc_invoice: "Each monthly late charge on a past-due fee invoice is figured as set out in this rule, one charge for each full calendar month the invoice stays unpaid after its late-charge start."
      invoice_date: "A full calendar month after a late-charge start runs from that day to the same day of the next month, or to that month's last day where the same day does not exist."
      invoice_amount: "The invoice's unpaid amount is the invoice amount less the fee payments and fee credits applied to that invoice, and never less than zero."
      invoice_paid: "the fee payments applied to the invoice reach a share of the invoice amount"
      unpaid_amount: "The invoice's unpaid amount is the invoice amount less the fee payments and fee credits applied to that invoice, and never less than zero."
      pack_paid_days: "where the client paid its pre-collect pack invoice within the pack's invoice_due_days after purchase"
      pack_age: "the pack was bought 12 or more months before the handling date"
      base_rate: "where the client paid its pre-collect pack invoice within the pack's invoice_due_days after purchase and the pack was bought 12 or more months before the handling date, the rate is the tier's late_charge_pct_per_month less half a percentage point; where it paid that pack invoice within the pack's invoice_due_days and the pack was bought less than 12 months before the handling date, the rate is the tier's late_charge_pct_per_month less a quarter of a percentage point; otherwise the rate is the tier's late_charge_pct_per_month."
      invoice_age_days: "counted in calendar days from the invoice date to the handling date"
      aging_add: "by half a percentage point where the invoice is 150 or more days old, by a quarter of a percentage point where it is at least 100 but less than 150 days old, and not at all where it is younger."
      pct_charge: "The percentage charge is the unpaid amount times that monthly rate."
      other_late_12m: "the late charges booked on the agreement's other invoices in the 12 months before the handling date"
      combined_charge: "where 2 or more were booked, the charge is the percentage charge plus the minimum; where none was booked, the charge is the percentage charge alone with no minimum; where exactly one was booked, the charge is the greater of the percentage charge and the minimum."
      partial_relief: "25 percent where they are half or more of it, 10 percent where they are at least a quarter but less than half of it, and nothing otherwise."
      tenure_months: "A tenure relief applies by the whole months from the agreement's effective date to the handling date"
      tenure_relief: "15 percent at 36 months or more, 5 percent at 18 months or more but less than 36, and nothing under 18 months."
      legal_state: "A legal standing adjustment applies by the client's legal forwarding agreement that names this contingency agreement"
      legal_adjustment: "a 10 percent relief where that legal agreement is active and its cost deposit is at or above the programme's cost_deposit_minimum_balance_usd, a 10 percent surcharge where it is suspended and its cost deposit is below that minimum, and nothing otherwise."
      relief_share: "The reliefs and the adjustment are first added into one share, and the charge is reduced once by that share"
      result: "they do not act one after another, and the result is rounded to the cent once at the end."
    factors:
      - id: precollect_payment_rate
        effect: parameter
        decides: base_rate
        bindings: [pack_bought, pack_paid, pack_due_days, pack_paid_days, pack_age, base_rate]
        ladder:
          - when: "the client paid its pre-collect pack invoice within the pack's invoice due days and the pack was bought 12 or more months ago"
            value: "the tier's late-charge percent less K('reliable_points_off') = 0.50 points"
          - when: "the client paid its pre-collect pack invoice within the pack's invoice due days and the pack was bought less than 12 months ago"
            value: "the tier's late-charge percent less K('new_points_off') = 0.25 points"
          - when: "otherwise"
            value: "P('late_charge_pct_per_month')"
        baseline:
          base_rate: "P('late_charge_pct_per_month')"
        evidence: [cross_category, date]
        cross_difficulty: flatfee
      - id: invoice_aging_step
        effect: parameter
        decides: aging_add
        bindings: [invoice_date, invoice_age_days, aging_add]
        ladder:
          - when: "the invoice is 150 or more calendar days old"
            value: "K('aging_add_high') = 0.50 points added"
          - when: "the invoice is at least 100 but less than 150 calendar days old"
            value: "K('aging_add_low') = 0.25 points added"
          - when: "otherwise"
            value: "0"
        baseline:
          aging_add: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: minimum_combination
        effect: method
        decides: combined_charge
        bindings: [other_late_12m, combined_charge]
        ladder:
          - when: "2 or more late charges were booked on the agreement's other invoices in the trailing 12 months"
            method: "the percentage charge plus the minimum"
          - when: "no late charge was booked on the agreement's other invoices in the trailing 12 months"
            method: "the percentage charge alone, no minimum"
          - when: "otherwise (exactly one)"
            method: "the greater of the percentage charge and the minimum"
        baseline:
          combined_charge: "MX(pct_charge, minimum_charge)"
        evidence: [history]
        cross_difficulty: null
      - id: part_payment_relief
        effect: parameter
        decides: partial_relief
        bindings: [invoice_paid, paid_share, partial_relief]
        ladder:
          - when: "fee payments applied to the invoice are half or more of the invoice amount"
            value: "K('partial_rel_high') = 25 percent"
          - when: "they are at least a quarter but less than half of it"
            value: "K('partial_rel_low') = 10 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          partial_relief: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_relief
        effect: parameter
        decides: tenure_relief
        bindings: [tenure_months, tenure_relief]
        ladder:
          - when: "36 or more whole months since the agreement's effective date"
            value: "K('tenure_rel_high') = 15 percent"
          - when: "18 or more but less than 36 whole months"
            value: "K('tenure_rel_low') = 5 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_relief: "0"
        evidence: [date]
        cross_difficulty: null
      - id: legal_standing_adjustment
        effect: parameter
        decides: legal_adjustment
        bindings: [legal_state, legal_deposit, legal_deposit_min, legal_adjustment]
        ladder:
          - when: "the client's legal forwarding agreement naming this agreement is active and its cost deposit is at or above the programme minimum"
            value: "K('legal_rel') = 10 percent relief"
          - when: "that legal agreement is suspended and its cost deposit is below the programme minimum"
            value: "K('legal_surcharge') = 10 percent surcharge"
          - when: "otherwise"
            value: "0"
        baseline:
          legal_adjustment: "0"
        evidence: [cross_category]
        cross_difficulty: legal
    inputs:
      history:
        - {table: client_ledger, aggregate: latest, field: invoice_number, filters: {event_type: client_late_charge_assessed}}
        - {table: client_ledger, aggregate: sum, field: amount, filters: {event_type: client_fee_payment_received}}
        - {table: client_ledger, aggregate: count, field: client_txn_id, within_months: 12, filters: {event_type: client_late_charge_assessed}}
      cross_category: [flatfee, legal]
  - id: client_ext_past_due_invoice_payoff
    base_policy_refs: [client_evt_fee_billing]
    overwrite: []
    trigger: on_request
    subject: [client_fee_payment_received]
    computes: payment_amount
    target_tool: pay_past_due_invoice_8492adb5
    params:
      prompt_days: 10
      few_late_charges: 3
      steady_payments: 4
      hold_conc_high: 0.50
      hold_conc_low: 0.25
      suits_high: 3
      suit_conc_high: 0.25
      suit_conc_low: 0.10
      volume_high_usd: 10000
      volume_low_usd: 4000
      volume_conc_high: 0.20
      volume_conc_low: 0.10
      returns_high: 2
      return_conc_high: 0.10
      return_conc_low: 0.05
    rule: >-
      A creditor client may pay off a past-due fee invoice that is accruing late charges with one payment it
      makes itself, naming the invoice, on an agreement with no termination notice on record. A payoff figure for a past-due invoice is not
      quoted until the invoice carries a late charge for every full calendar month it has stayed
      unpaid after its late-charge start. A full calendar month after a late-charge start runs from that day to the same day of the next
      month, or to that month's last day where the same day does not exist. A window of a number of months before a date covers the dates after the same day that number of
      months earlier, up to and including that date. The payoff of a past-due fee invoice is the invoice's unpaid
      amount plus every late charge booked on that invoice, rounded to the cent. The invoice's unpaid
      amount for the payoff is the invoice amount less the fee payments and fee credits applied to
      that invoice, and never less than zero. Which of the invoice's late charges enter the payoff
      depends on how promptly the client settles: where the payoff is made no more than 10 calendar
      days after the invoice's most recent late charge and the invoice carries 3 or fewer late
      charges, only that most recent late charge enters; where the payoff is made no more than 10
      calendar days after it and the invoice carries more than 3 late charges, only the late charges
      booked on the invoice in the 3 months before the payoff enter; otherwise every late charge on
      the invoice enters. Four concessions may then be taken off the late charges that enter. A payment-record concession applies by the fee payments the client made on the agreement in the
      6 months before the payoff: 50 percent for 4 or more payments, 25 percent for 1 to 3 payments,
      and nothing for none. A legal volume concession applies by the suits filed under the
      client's legal forwarding agreement in the 12 months before the payoff: 25 percent for 3 or
      more suits, 10 percent for 1 or 2 suits, and nothing for none. A collection volume concession
      applies by the collections booked on the agreement in the 3 months before the payoff: 20
      percent where they total 10000 USD or more, 10 percent where they total at least 4000 USD but
      less than 10000 USD, and nothing otherwise. A returned-payment concession applies by the
      collections reversed as returned payments on the agreement in the 3 months before the payoff,
      because those reversals delay the client's reconciliation of its fee invoices: 10 percent for
      2 or more, 5 percent for exactly one, and nothing for none. The concessions are first added
      into one share, never more than the whole, and the late charges that enter are reduced once
      by that share; the unpaid amount itself is never reduced. The payoff is the unpaid amount plus
      the reduced late charges, rounded to the cent once at the end.
    baseline:
      rule: >-
        The payoff of a past-due fee invoice is the invoice's unpaid amount plus every late charge
        booked on that invoice, rounded to the cent. The invoice's unpaid amount for the payoff is the
        invoice amount less the fee payments and fee credits applied to that invoice, and never less
        than zero.
      params: []
    prerequisite:
      - problem: client_ext_invoice_late_charge
        kind: value_input
        gate: late_entering
        form: state
        policy_source: >-
          A payoff figure for a past-due invoice is not quoted until the invoice carries a late charge
          for every full calendar month it has stayed unpaid after its late-charge start.
        condition: >-
          The client money history carries, for the invoice being paid off, one late-charge entry for
          each full calendar month elapsed since its late-charge start (invoice date plus the due days
          plus the grace days), the latest month included.
        resolved_by: assess_invoice_late_charge_7a6464d6
        effect: >-
          The invoice's most recent late charge becomes the newly booked month's charge, dated the
          handling day, so the late charges entering the payoff change from the earlier charge to the
          new one.
    cross_category:
      - category: legal
        as: history
        reads: [legal_matter_events.event_type, legal_matter_events.txn_date]
        note: The legal volume concession is decided from the suits filed under the client's legal forwarding agreement in the trailing 12 months.
    compute:
      - payoff_invoice: "LATEST('client_ledger', 'invoice_number', date_field='txn_date', event_type='client_late_charge_assessed')"
      - payoff_invoice_amount: "SUM('client_ledger', 'amount', event_type='client_fee_invoiced', invoice_number=payoff_invoice)"
      - payoff_invoice_paid: "SUM('client_ledger', 'amount', event_type='client_fee_payment_received', invoice_number=payoff_invoice)"
      - payoff_invoice_credited: "SUM('client_ledger', 'amount', event_type='client_fee_credit_issued', invoice_number=payoff_invoice)"
      - payoff_unpaid: "MX(0, payoff_invoice_amount - payoff_invoice_paid - payoff_invoice_credited)"
      - invoice_late_count: "COUNT('client_ledger', event_type='client_late_charge_assessed', invoice_number=payoff_invoice)"
      - invoice_late_total: "SUM('client_ledger', 'amount', event_type='client_late_charge_assessed', invoice_number=payoff_invoice)"
      - latest_late_amount: "LATEST('client_ledger', 'amount', date_field='txn_date', event_type='client_late_charge_assessed', invoice_number=payoff_invoice)"
      - latest_late_date: "LATEST('client_ledger', 'txn_date', date_field='txn_date', event_type='client_late_charge_assessed', invoice_number=payoff_invoice)"
      - days_since_late: "DAYS(latest_late_date, NOW)"
      - recent_late_total: "SUM('client_ledger', 'amount', within_months=3, date_field='txn_date', event_type='client_late_charge_assessed', invoice_number=payoff_invoice)"
      - late_entering: "latest_late_amount if (days_since_late <= K('prompt_days') and invoice_late_count <= K('few_late_charges')) else (recent_late_total if (days_since_late <= K('prompt_days') and invoice_late_count > K('few_late_charges')) else invoice_late_total)"
      - fee_payments_6m: "COUNT('client_ledger', within_months=6, date_field='txn_date', event_type='client_fee_payment_received')"
      - standing_concession: "K('hold_conc_high') if fee_payments_6m >= K('steady_payments') else (K('hold_conc_low') if (fee_payments_6m >= 1 and fee_payments_6m < K('steady_payments')) else 0)"
      - payoff_legal_ref: "CFIELD('legal', 'legal_agreement_id', agreement_id=HID)"
      - suits_12m: "XCOUNT('legal', 'legal_matter_events', within_months=12, date_field='txn_date', event_type='legal_suit_filed', legal_agreement_id=payoff_legal_ref)"
      - suit_concession: "K('suit_conc_high') if suits_12m >= K('suits_high') else (K('suit_conc_low') if (suits_12m >= 1 and suits_12m < K('suits_high')) else 0)"
      - collections_3m: "SUM('client_ledger', 'amount', within_months=3, date_field='txn_date', event_type='client_collection_booked')"
      - volume_concession: "K('volume_conc_high') if collections_3m >= K('volume_high_usd') else (K('volume_conc_low') if (collections_3m >= K('volume_low_usd') and collections_3m < K('volume_high_usd')) else 0)"
      - returns_3m: "COUNT('client_ledger', within_months=3, date_field='txn_date', event_type='client_collection_reversed', reversal_reason='payment_returned')"
      - return_concession: "K('return_conc_high') if returns_3m >= K('returns_high') else (K('return_conc_low') if returns_3m == 1 else 0)"
      - concession_share: "MN(1, standing_concession + suit_concession + volume_concession + return_concession)"
      - result: "RND(payoff_unpaid + late_entering * (1 - concession_share), 2)"
    compute_basis:
      payoff_invoice: "A creditor client may pay off a past-due fee invoice that is accruing late charges with one payment it makes itself, naming the invoice, on an agreement with no termination notice on record."
      payoff_unpaid: "The invoice's unpaid amount for the payoff is the invoice amount less the fee payments and fee credits applied to that invoice, and never less than zero."
      latest_late_amount: "A payoff figure for a past-due invoice is not quoted until the invoice carries a late charge for every full calendar month it has stayed unpaid after its late-charge start."
      days_since_late: "where the payoff is made no more than 10 calendar days after the invoice's most recent late charge"
      recent_late_total: "only the late charges booked on the invoice in the 3 months before the payoff enter"
      late_entering: "where the payoff is made no more than 10 calendar days after the invoice's most recent late charge and the invoice carries 3 or fewer late charges, only that most recent late charge enters; where the payoff is made no more than 10 calendar days after it and the invoice carries more than 3 late charges, only the late charges booked on the invoice in the 3 months before the payoff enter; otherwise every late charge on the invoice enters."
      fee_payments_6m: "A payment-record concession applies by the fee payments the client made on the agreement in the 6 months before the payoff"
      standing_concession: "50 percent for 4 or more payments, 25 percent for 1 to 3 payments, and nothing for none."
      payoff_legal_ref: "the suits filed under the client's legal forwarding agreement"
      suits_12m: "A legal volume concession applies by the suits filed under the client's legal forwarding agreement in the 12 months before the payoff"
      suit_concession: "25 percent for 3 or more suits, 10 percent for 1 or 2 suits, and nothing for none."
      collections_3m: "A collection volume concession applies by the collections booked on the agreement in the 3 months before the payoff"
      volume_concession: "20 percent where they total 10000 USD or more, 10 percent where they total at least 4000 USD but less than 10000 USD, and nothing otherwise."
      returns_3m: "A returned-payment concession applies by the collections reversed as returned payments on the agreement in the 3 months before the payoff"
      return_concession: "10 percent for 2 or more, 5 percent for exactly one, and nothing for none."
      concession_share: "The concessions are first added into one share, never more than the whole, and the late charges that enter are reduced once by that share; the unpaid amount itself is never reduced."
      result: "The payoff is the unpaid amount plus the reduced late charges, rounded to the cent once at the end."
    factors:
      - id: late_charge_inclusion
        effect: method
        decides: late_entering
        bindings: [invoice_late_count, invoice_late_total, latest_late_date, days_since_late, recent_late_total, late_entering]
        ladder:
          - when: "the payoff is made within 10 calendar days of the invoice's most recent late charge and the invoice carries 3 or fewer late charges"
            method: "only the most recent late charge enters the payoff"
          - when: "the payoff is made within 10 calendar days of it and the invoice carries more than 3 late charges"
            method: "only the late charges booked on the invoice in the 3 months before the payoff enter"
          - when: "otherwise"
            method: "every late charge on the invoice enters"
        baseline:
          late_entering: "invoice_late_total"
        evidence: [history, date]
        cross_difficulty: null
      - id: payment_record_concession
        effect: parameter
        decides: standing_concession
        bindings: [fee_payments_6m, standing_concession]
        ladder:
          - when: "the client made 4 or more fee payments on the agreement in the 6 months before the payoff"
            value: "K('hold_conc_high') = 50 percent"
          - when: "the client made 1 to 3 fee payments in those 6 months"
            value: "K('hold_conc_low') = 25 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_concession: "0"
        evidence: [history]
        cross_difficulty: null
      - id: legal_volume_concession
        effect: parameter
        decides: suit_concession
        bindings: [payoff_legal_ref, suits_12m, suit_concession]
        ladder:
          - when: "3 or more suits were filed under the client's legal forwarding agreement in the trailing 12 months"
            value: "K('suit_conc_high') = 25 percent"
          - when: "1 or 2 suits were filed in the trailing 12 months"
            value: "K('suit_conc_low') = 10 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          suit_concession: "0"
        evidence: [cross_category, history]
        cross_difficulty: legal
      - id: collection_volume_concession
        effect: parameter
        decides: volume_concession
        bindings: [collections_3m, volume_concession]
        ladder:
          - when: "collections booked on the agreement in the 3 months before the payoff total 10000 USD or more"
            value: "K('volume_conc_high') = 20 percent"
          - when: "they total at least 4000 USD but less than 10000 USD"
            value: "K('volume_conc_low') = 10 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          volume_concession: "0"
        evidence: [history]
        cross_difficulty: null
      - id: returned_payment_concession
        effect: parameter
        decides: return_concession
        bindings: [returns_3m, return_concession]
        ladder:
          - when: "2 or more collections were reversed as returned payments in the 3 months before the payoff"
            value: "K('return_conc_high') = 10 percent"
          - when: "exactly one collection was so reversed"
            value: "K('return_conc_low') = 5 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          return_concession: "0"
        evidence: [history]
        cross_difficulty: null
