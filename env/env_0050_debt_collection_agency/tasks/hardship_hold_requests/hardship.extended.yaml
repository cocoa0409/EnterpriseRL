events:
  # ---- holding writes (hardship_holds) ----
  - type: hardship_hold_requested
    target: hardship_holds
    mutation: create
    meaning: The consumer asks for a hardship or protective hold on one placed account.
    grain: one row per hold requested per account.
    fields:
      customer_id: The consumer asking for the hold.
      account_id: The placed account the hold would cover.
      variant_name: The hold tier requested.
      request_date: The date the request was received.
      request_channel: How the request was received.
      documentation_reference: The reference the consumer gives for the qualifying event (disaster declaration number, financial assistance application number, orders or certificate number), verbatim; empty for a self-attested pause.
    triggers: []
  - type: hardship_hold_approved
    target: hardship_holds
    mutation: {transition: {from: requested, to: active}}
    meaning: The request is approved and the hold starts.
    grain: one row per transaction.
    fields:
      decision_date: The date of approval.
      start_date: The first day of the hold.
      end_date: The last day of the hold as granted.
      documentation_received_date: The date complete documentation arrived; empty where none is required.
    triggers:
      - event: account:account_hardship_hold_placed
      - event: hardship:hardship_notice_sent
        map: {notice_type: decision_letter, event_date: decision_date}
  - type: hardship_hold_denied
    target: hardship_holds
    mutation: {transition: {from: requested, to: denied}}
    meaning: The request is denied.
    grain: one row per transaction.
    fields:
      decision_date: The date of denial.
      denial_reason: Why the request was denied.
    triggers:
      - event: hardship:hardship_notice_sent
        map: {notice_type: decision_letter, event_date: decision_date}
  - type: hardship_hold_withdrawn
    target: hardship_holds
    mutation: {transition: {from: requested, to: withdrawn}}
    meaning: The consumer withdraws an undecided request.
    grain: one row per transaction.
    fields:
      ended_date: The date of withdrawal.
    triggers: []
  - type: hardship_hold_ended
    target: hardship_holds
    mutation: {transition: {from: active, to: ended}}
    meaning: The hold ends.
    grain: one row per transaction.
    fields:
      ended_date: The last day of the hold.
      end_reason: Why the hold ended.
    triggers:
      - event: account:account_hardship_hold_lifted
        when: {end_reason: {not: [dispute_hold_placed, account_closed]}}
  - type: hardship_hold_extended
    target: hardship_holds
    mutation: update
    meaning: The hold record is rewritten with a later end date after an extension is granted.
    grain: one row per transaction.
    fields:
      end_date: The new last day of the hold.
      extension_count: Extensions granted so far, after this one.
    triggers: []
  # ---- hold records (hardship_hold_events) ----
  - type: hardship_documentation_requested
    target: hardship_hold_events
    meaning: Ridgeline asks the consumer for the documentation the tier requires.
    grain: one row per documentation request.
    distinguish_by: [document_type, event_date]
    fields:
      account_id: The placed account.
      event_date: The date of the request.
      document_type: The documentation asked for.
      due_date: The last day the documentation may arrive.
    triggers: []
  - type: hardship_documentation_received
    target: hardship_hold_events
    meaning: Documentation for a hold request or extension arrives.
    grain: one row per submission received.
    distinguish_by: [document_type, event_date]
    fields:
      account_id: The placed account.
      event_date: The date it arrived.
      document_type: The documentation received.
      document_reference: The document's own reference, verbatim.
      channel: How it arrived.
    triggers: []
  - type: hardship_extension_granted
    target: hardship_hold_events
    meaning: An extension of a running hold is granted.
    grain: one row per extension.
    distinguish_by: [extension_number]
    fields:
      account_id: The placed account.
      event_date: The date the extension was granted.
      extension_number: Which extension this is.
      days_granted: Calendar days added.
    triggers:
      - event: hardship:hardship_hold_extended
        map: {extension_count: extension_number}
  - type: hardship_review_recorded
    target: hardship_hold_events
    meaning: A scheduled status review of a long hold is completed.
    grain: one row per review.
    distinguish_by: [event_date]
    fields:
      account_id: The placed account.
      event_date: The date of the review.
      review_outcome: Whether the hold continues.
    triggers:
      - event: hardship:hardship_hold_ended
        when: {review_outcome: end_hold}
        map: {ended_date: event_date, end_reason: review_not_continued}
  - type: hardship_assistance_decision_recorded
    target: hardship_hold_events
    meaning: The client's decision on the consumer's financial assistance application is recorded against the hold.
    grain: one row per client decision.
    distinguish_by: [event_date]
    fields:
      account_id: The placed account.
      event_date: The date of the client's decision.
      assistance_outcome: The client's decision.
      document_reference: The client's decision reference, verbatim.
    triggers: []
  - type: hardship_client_notified
    target: hardship_hold_events
    meaning: The client is told that a hold it must know about has been approved.
    grain: one row per notification.
    distinguish_by: [event_date]
    fields:
      account_id: The placed account.
      event_date: The date of the notification.
    triggers: []
  - type: hardship_notice_sent
    target: hardship_hold_events
    meaning: Ridgeline sends the consumer a decision letter or an end-of-hold notice.
    grain: one row per notice sent.
    distinguish_by: [notice_type, event_date]
    fields:
      account_id: The placed account.
      event_date: The date the notice was sent.
      notice_type: Decision letter or end-of-hold notice.
      channel: How it was sent.
    triggers: []

measures:
  - id: hardship_msr_hold_days_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: On the same placed account, the number of calendar days inside the window covered by holds whose tier has hold_counts_toward_annual_limit true, from start_date through ended_date (or end_date while the hold runs), both ends included.
  - id: hardship_msr_grants_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of hardship_holds rows of the same tier on the same placed account whose decision_date falls in the window and whose status is active or ended.
  - id: hardship_msr_resubmissions
    window: The life of the hold request.
    measure: Count of hardship_documentation_received rows for the request after the first one.

policies:
  - id: hardship_agg_multi_holding
    subject: [hardship_hold_requested]
    rule: >-
      A consumer may hold hardship holds on several placed accounts at once, but each placed
      account carries at most one open hold. A new hold request is taken only when no other hold on
      the same placed account is requested or active; a consumer who wants a different tier while a
      hold runs asks for it when the current hold ends, or ends the current hold first.
    eligibility:
      - id: one_open_hold_per_account
        applies_to: [hardship_hold_requested]
        kind: dedup
        condition: A new hold request is taken only when no other hold on the same placed account is requested or active; a consumer who wants a different tier while a hold runs asks for it when the current hold ends, or ends the current hold first.
        evidence_fields: [hardship_holds.account_id, hardship_holds.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id]
          action_bindings:
            hardship_holds.account_id: account_id
        dedup_contract:
          table: hardship_holds
          mode: separate_record
          object_bindings: {account_id: account_id}
          duplicate_filters: {status: [requested, active]}
          distinct_fields: [request_date]
    params:
      max_per_customer: null

  - id: hardship_agg_consumer_level
    subject: [hardship_hold_requested, hardship_hold_approved]
    rule: >-
      For tiers whose consumer_level_application is true, one request from the consumer is
      recorded as a hold on every open placed account of that consumer that the tier can hold, all
      with the same request_date and documentation_reference, and they are decided together on the
      same evidence; an account the tier cannot hold is simply left out. For every other tier the
      consumer names the accounts, and each named account is a separate request decided on its own
      records. Hold-day limits are never pooled across accounts: hardship_msr_hold_days_12m and
      hardship_msr_grants_12m are counted per placed account, so a consumer with three accounts can
      hold all three for the full tier length at the same time. The limits that apply to a hold are
      those of its own tier; days of tiers whose hold_counts_toward_annual_limit is false are not
      counted against any tier.
    eligibility: []
    params:
      per_tier:
        30-Day Hardship Pause: {consumer_level: =consumer_level_application, counts_toward_limit: =hold_counts_toward_annual_limit}
        Documented Hardship Hold: {consumer_level: =consumer_level_application, counts_toward_limit: =hold_counts_toward_annual_limit}
        Disaster Relief Hold: {consumer_level: =consumer_level_application, counts_toward_limit: =hold_counts_toward_annual_limit}
        Financial Assistance Review Hold: {consumer_level: =consumer_level_application, counts_toward_limit: =hold_counts_toward_annual_limit}
        Long-Term Hardship Hold: {consumer_level: =consumer_level_application, counts_toward_limit: =hold_counts_toward_annual_limit}
        Military Service Hold: {consumer_level: =consumer_level_application, counts_toward_limit: =hold_counts_toward_annual_limit}

  - id: hardship_eligibility
    subject: [hardship_hold_requested, hardship_hold_denied]
    rule: >-
      A tier is granted only on an account whose debt_type is in the tier's eligible_debt_types,
      whose stage is in its eligible_account_stages and whose balance_due is at least
      min_account_balance_usd, and only when the request arrives through one of the tier's
      request_channels. A hold is requested only on a placed account whose status is
      validation_period, active or arranged. A request is denied with grant_limit_reached when
      hardship_msr_grants_12m already equals grants_per_account_12_months, and with
      annual_limit_reached when the tier counts toward the annual limit and
      hardship_msr_hold_days_12m plus initial_hold_days would exceed
      max_hold_days_rolling_12_months. A hold of a tier starts only when the handling date is later
      than the cooling-off period counted from the ended_date of the most recent hold on the same
      account. The cooling-off period is the tier's cooling_off_days_between_holds in calendar days,
      the day after that ended_date being day one. After a denial, the same tier is requested again
      on the same account only when the handling date is later than the reapply wait counted from
      the decision_date of that denial. The reapply wait is the tier's denial_reapply_wait_days in
      calendar days, the day after that decision_date being day one. A Disaster Relief Hold is
      granted only when it is requested within disaster_declaration_lookback_days calendar days
      after the declaration date of the disaster whose number the consumer gives in
      documentation_reference, and only for a primary residence inside the declared area. A
      Documented Hardship Hold or Long-Term Hardship Hold needs a documented drop in household
      income of at least documented_income_drop_min_pct percent where that parameter is above 0.0,
      shown by income_documentation_months months of records. A request that fails any of these
      tests is denied with the matching denial_reason; it is never converted to a different tier
      without a new request from the consumer.
    eligibility:
      - id: hold_account_status
        applies_to: [hardship_hold_requested]
        kind: state
        condition: A hold is requested only on a placed account whose status is validation_period, active or arranged.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active, arranged]
      - id: cooling_off_between_holds
        applies_to: [hardship_hold_requested]
        kind: time
        condition: A hold of a tier starts only when the handling date is later than the cooling-off period counted from the ended_date of the most recent hold on the same account.
        evidence_fields: [hardship_holds.ended_date, hardship_holds.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id]
          action_bindings:
            hardship_holds.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the ended_date of the most recent hold on the same account
          anchor_source: hardship_holds.ended_date
          relation: not_before
          duration_source: variants.cooling_off_days_between_holds
          unit: calendar_days
          counting_rule: The cooling-off period is the tier's cooling_off_days_between_holds in calendar days, the day after that ended_date being day one.
          boundary: exclusive
      - id: reapply_after_denial
        applies_to: [hardship_hold_requested]
        kind: time
        condition: After a denial, the same tier is requested again on the same account only when the handling date is later than the reapply wait counted from the decision_date of that denial.
        evidence_fields: [hardship_holds.decision_date, hardship_holds.status, hardship_holds.variant_name, hardship_holds.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id, hardship_holds.variant_name]
          action_bindings:
            hardship_holds.account_id: account_id
            hardship_holds.variant_name: variant_name
        temporal_basis:
          clock: frozen_time
          anchor_event: the decision_date of that denial
          anchor_source: hardship_holds.decision_date
          relation: not_before
          duration_source: variants.denial_reapply_wait_days
          unit: calendar_days
          counting_rule: The reapply wait is the tier's denial_reapply_wait_days in calendar days, the day after that decision_date being day one.
          boundary: exclusive
      - id: disaster_reference_given
        applies_to: [hardship_hold_requested]
        kind: caller_fact
        condition: A Disaster Relief Hold is granted only when it is requested within disaster_declaration_lookback_days calendar days after the declaration date of the disaster whose number the consumer gives in documentation_reference, and only for a primary residence inside the declared area.
        evidence_fields: [hardship_holds.documentation_reference, hardship_holds.request_date, hardship_holds.account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id]
          action_bindings:
            hardship_holds.account_id: account_id
    params:
      per_tier:
        30-Day Hardship Pause: {grants: =grants_per_account_12_months, max_days_12m: =max_hold_days_rolling_12_months, cooling_off: =cooling_off_days_between_holds, min_balance: =min_account_balance_usd}
        Documented Hardship Hold: {grants: =grants_per_account_12_months, max_days_12m: =max_hold_days_rolling_12_months, cooling_off: =cooling_off_days_between_holds, min_balance: =min_account_balance_usd}
        Disaster Relief Hold: {grants: =grants_per_account_12_months, max_days_12m: =max_hold_days_rolling_12_months, cooling_off: =cooling_off_days_between_holds, min_balance: =min_account_balance_usd}
        Financial Assistance Review Hold: {grants: =grants_per_account_12_months, max_days_12m: =max_hold_days_rolling_12_months, cooling_off: =cooling_off_days_between_holds, min_balance: =min_account_balance_usd}
        Long-Term Hardship Hold: {grants: =grants_per_account_12_months, max_days_12m: =max_hold_days_rolling_12_months, cooling_off: =cooling_off_days_between_holds, min_balance: =min_account_balance_usd}
        Military Service Hold: {grants: =grants_per_account_12_months, max_days_12m: =max_hold_days_rolling_12_months, cooling_off: =cooling_off_days_between_holds, min_balance: =min_account_balance_usd}
    formula:
      annual_limit_exceeded: hold_counts_toward_annual_limit and hardship_msr_hold_days_12m + initial_hold_days > max_hold_days_rolling_12_months
      grant_limit_reached: hardship_msr_grants_12m >= grants_per_account_12_months
    measures: [hardship_msr_hold_days_12m, hardship_msr_grants_12m]

  - id: hardship_evt_documentation
    subject: [hardship_documentation_requested, hardship_documentation_received, hardship_hold_denied]
    rule: >-
      For tiers whose documentation_required is true, Ridgeline asks for the tier's
      documentation_type on the request date with a due date documentation_due_days calendar days
      later, and accepts it only through the tier's documentation_channels. A request whose
      documentation has not arrived is denied with documentation_not_received only when the handling
      date is later than the documentation period counted from the hold's request_date. The
      documentation period is the tier's documentation_due_days in calendar days, the day after
      request_date being day one. Incomplete documentation may be resubmitted while
      hardship_msr_resubmissions is below documentation_resubmission_max and the due date has not
      passed; a further incomplete submission is denied with documentation_not_received. A
      consumer's description of their circumstances never stands in for the documentation, and for a
      30-Day Hardship Pause the consumer's own statement is the whole of the evidence and no
      documentation is asked for.
    eligibility:
      - id: documentation_period_lapsed
        applies_to: [hardship_hold_denied]
        kind: time
        condition: A request whose documentation has not arrived is denied with documentation_not_received only when the handling date is later than the documentation period counted from the hold's request_date.
        evidence_fields: [hardship_holds.request_date, hardship_holds.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.hold_id]
          action_bindings:
            hardship_holds.hold_id: hold_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold's request_date
          anchor_source: hardship_holds.request_date
          relation: not_before
          duration_source: variants.documentation_due_days
          unit: calendar_days
          counting_rule: The documentation period is the tier's documentation_due_days in calendar days, the day after request_date being day one.
          boundary: exclusive
    params:
      per_tier:
        30-Day Hardship Pause: {required: =documentation_required, due_days: =documentation_due_days, resubmissions: =documentation_resubmission_max}
        Documented Hardship Hold: {required: =documentation_required, due_days: =documentation_due_days, resubmissions: =documentation_resubmission_max}
        Disaster Relief Hold: {required: =documentation_required, due_days: =documentation_due_days, resubmissions: =documentation_resubmission_max}
        Financial Assistance Review Hold: {required: =documentation_required, due_days: =documentation_due_days, resubmissions: =documentation_resubmission_max}
        Long-Term Hardship Hold: {required: =documentation_required, due_days: =documentation_due_days, resubmissions: =documentation_resubmission_max}
        Military Service Hold: {required: =documentation_required, due_days: =documentation_due_days, resubmissions: =documentation_resubmission_max}
    measures: [hardship_msr_resubmissions]

  - id: hardship_evt_approval_and_effects
    subject: [hardship_hold_approved]
    rule: >-
      A hold that requires documentation is approved only when a hardship_documentation_received
      row of the tier's documentation_type is on record for the request. The request is decided
      within decision_sla_business_days business days after complete documentation arrives, or
      after the request where none is required. The hold's start_date is the decision date where
      hold_start_basis is decision_date and the request_date where it is request_date, and its
      end_date is start_date plus initial_hold_days minus 1, so that the hold covers exactly
      initial_hold_days calendar days. While the hold runs, outbound collection calls stop where
      outbound_calls_paused is true, collection letters stop where collection_letters_paused is
      true, collection emails and texts stop where email_text_paused is true, no initial tradeline
      is furnished where suspend_new_credit_reporting is true, and an account with a live tradeline
      receives the disaster special comment where tradeline_special_comment is
      disaster_special_comment. Letters the consumer asks for, dispute verifications and the
      decision and end-of-hold notices are always sent. Payments the consumer initiates are accepted
      where voluntary_payments_accepted is true, and a payment never ends the hold by itself. Where
      client_notification_required is true, the client is notified within
      client_notification_sla_business_days business days after approval. The decision letter is
      sent within decision_letter_sla_business_days business days after the decision.
    eligibility:
      - id: documentation_on_record
        applies_to: [hardship_hold_approved]
        kind: authorization
        condition: A hold that requires documentation is approved only when a hardship_documentation_received row of the tier's documentation_type is on record for the request.
        evidence_fields: [hardship_hold_events.event_type, hardship_hold_events.document_type, hardship_hold_events.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_hold_events.hold_id]
          action_bindings:
            hardship_hold_events.hold_id: hold_id
    params:
      per_tier:
        30-Day Hardship Pause: {hold_days: =initial_hold_days, start_basis: =hold_start_basis, reporting_suspended: =suspend_new_credit_reporting, letters_paused: =collection_letters_paused}
        Documented Hardship Hold: {hold_days: =initial_hold_days, start_basis: =hold_start_basis, reporting_suspended: =suspend_new_credit_reporting, letters_paused: =collection_letters_paused}
        Disaster Relief Hold: {hold_days: =initial_hold_days, start_basis: =hold_start_basis, reporting_suspended: =suspend_new_credit_reporting, letters_paused: =collection_letters_paused}
        Financial Assistance Review Hold: {hold_days: =initial_hold_days, start_basis: =hold_start_basis, reporting_suspended: =suspend_new_credit_reporting, letters_paused: =collection_letters_paused}
        Long-Term Hardship Hold: {hold_days: =initial_hold_days, start_basis: =hold_start_basis, reporting_suspended: =suspend_new_credit_reporting, letters_paused: =collection_letters_paused}
        Military Service Hold: {hold_days: =initial_hold_days, start_basis: =hold_start_basis, reporting_suspended: =suspend_new_credit_reporting, letters_paused: =collection_letters_paused}

  - id: hardship_evt_extension
    subject: [hardship_extension_granted, hardship_hold_extended]
    rule: >-
      A running hold may be extended at the consumer's request up to the tier's max_extensions
      times, each extension adding extension_days calendar days to end_date. Extensions are granted
      only on a hold whose status is active. An extension is granted only when the handling date is
      no later than the hold's current end date counted from its start_date. The hold's current end
      date is start_date plus initial_hold_days plus extension_days for each extension already
      granted, minus 1, counted in calendar days with the last day included. The request must also
      arrive no earlier than extension_request_window_days calendar days before that end date, must
      carry updated documentation where extension_documentation_required is true, and is refused
      when the tier counts toward the annual limit and hardship_msr_hold_days_12m plus
      extension_days would exceed max_hold_days_rolling_12_months. It is decided within
      extension_decision_sla_business_days business days. A hold that has ended is never extended;
      the consumer makes a new request, subject to the cooling-off period.
    eligibility:
      - id: extension_on_active_hold
        applies_to: [hardship_extension_granted]
        kind: state
        condition: Extensions are granted only on a hold whose status is active.
        evidence_fields: [hardship_holds.status, hardship_holds.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.hold_id]
          action_bindings:
            hardship_holds.hold_id: hold_id
        state_contract:
          field: hardship_holds.status
          allowed: [active]
      - id: extension_before_end
        applies_to: [hardship_extension_granted]
        kind: time
        condition: An extension is granted only when the handling date is no later than the hold's current end date counted from its start_date.
        evidence_fields: [hardship_holds.start_date, hardship_holds.extension_count, hardship_holds.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.hold_id]
          action_bindings:
            hardship_holds.hold_id: hold_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its start_date
          anchor_source: hardship_holds.start_date
          relation: not_after
          duration_source: variants.initial_hold_days
          unit: calendar_days
          counting_rule: The hold's current end date is start_date plus initial_hold_days plus extension_days for each extension already granted, minus 1, counted in calendar days with the last day included.
          boundary: inclusive
    params:
      per_tier:
        30-Day Hardship Pause: {max_extensions: =max_extensions, extension_days: =extension_days, window: =extension_request_window_days}
        Documented Hardship Hold: {max_extensions: =max_extensions, extension_days: =extension_days, window: =extension_request_window_days}
        Disaster Relief Hold: {max_extensions: =max_extensions, extension_days: =extension_days, window: =extension_request_window_days}
        Financial Assistance Review Hold: {max_extensions: =max_extensions, extension_days: =extension_days, window: =extension_request_window_days}
        Long-Term Hardship Hold: {max_extensions: =max_extensions, extension_days: =extension_days, window: =extension_request_window_days}
        Military Service Hold: {max_extensions: =max_extensions, extension_days: =extension_days, window: =extension_request_window_days}
    measures: [hardship_msr_hold_days_12m]

  - id: hardship_evt_review
    subject: [hardship_review_recorded]
    rule: >-
      Tiers whose review_interval_days is above 0 are reviewed while they run: the first review
      falls due review_interval_days calendar days after start_date and each later review the same
      number of days after the previous due date. Reviews are recorded only on a hold whose status
      is active. A review records continue_hold when the qualifying condition still holds on the
      consumer's updated documentation, and end_hold otherwise, which ends the hold that day with
      end_reason review_not_continued. A review not recorded within review_overdue_days calendar
      days after it fell due ends the hold with end_reason review_not_continued on the first day
      after that period. A review never shortens or lengthens end_date.
    eligibility:
      - id: review_on_active_hold
        applies_to: [hardship_review_recorded]
        kind: state
        condition: Reviews are recorded only on a hold whose status is active.
        evidence_fields: [hardship_holds.status, hardship_holds.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.hold_id]
          action_bindings:
            hardship_holds.hold_id: hold_id
        state_contract:
          field: hardship_holds.status
          allowed: [active]
    params:
      per_tier:
        30-Day Hardship Pause: {interval: =review_interval_days, overdue: =review_overdue_days}
        Documented Hardship Hold: {interval: =review_interval_days, overdue: =review_overdue_days}
        Disaster Relief Hold: {interval: =review_interval_days, overdue: =review_overdue_days}
        Financial Assistance Review Hold: {interval: =review_interval_days, overdue: =review_overdue_days}
        Long-Term Hardship Hold: {interval: =review_interval_days, overdue: =review_overdue_days}
        Military Service Hold: {interval: =review_interval_days, overdue: =review_overdue_days}

  - id: hardship_evt_end
    subject: [hardship_hold_ended, hardship_hold_withdrawn, hardship_notice_sent]
    rule: >-
      A hold ends with end_reason term_completed only when the handling date is later than the
      hold's current end date counted from its start_date. The hold's current end date is start_date
      plus initial_hold_days plus extension_days for each extension granted, minus 1, counted in
      calendar days. A hold also ends earlier for a recorded reason: consumer_requested when the
      consumer asks to end it (always allowed where early_end_on_consumer_request is true),
      settlement_accepted when the consumer accepts a settlement on the account and the tier's
      hold_ends_on_settlement_acceptance is true, dispute_hold_placed when a dispute places the
      account in dispute_hold, account_closed when the account is paid, settled or returned,
      assistance_decided under the financial assistance rule, service_ended when a Military Service
      Hold's active duty has ended and post_service_protection_days calendar days have passed, and
      documentation_invalid when the documentation proves invalid and revoke_on_invalid_documentation
      is true. The ended_date is the last day the hold covered. Only the consumer can withdraw an
      undecided request. The end-of-hold notice is sent end_notice_days_before_end calendar days
      before the current end date, and outbound collection contact resumes no sooner than
      contact_resume_delay_days calendar days after the hold ends. Notices are sent only for a hold
      whose status is active or denied.
    eligibility:
      - id: hold_term_completed
        applies_to: [hardship_hold_ended]
        kind: time
        condition: A hold ends with end_reason term_completed only when the handling date is later than the hold's current end date counted from its start_date.
        evidence_fields: [hardship_holds.start_date, hardship_holds.extension_count, hardship_holds.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.hold_id]
          action_bindings:
            hardship_holds.hold_id: hold_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its start_date
          anchor_source: hardship_holds.start_date
          relation: not_before
          duration_source: variants.initial_hold_days
          unit: calendar_days
          counting_rule: The hold's current end date is start_date plus initial_hold_days plus extension_days for each extension granted, minus 1, counted in calendar days.
          boundary: exclusive
      - id: notice_hold_status
        applies_to: [hardship_notice_sent]
        kind: state
        condition: Notices are sent only for a hold whose status is active or denied.
        evidence_fields: [hardship_holds.status, hardship_holds.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.hold_id]
          action_bindings:
            hardship_holds.hold_id: hold_id
        state_contract:
          field: hardship_holds.status
          allowed: [active, denied]
    params:
      per_tier:
        30-Day Hardship Pause: {end_notice: =end_notice_days_before_end, resume_delay: =contact_resume_delay_days, ends_on_settlement: =hold_ends_on_settlement_acceptance}
        Documented Hardship Hold: {end_notice: =end_notice_days_before_end, resume_delay: =contact_resume_delay_days, ends_on_settlement: =hold_ends_on_settlement_acceptance}
        Disaster Relief Hold: {end_notice: =end_notice_days_before_end, resume_delay: =contact_resume_delay_days, ends_on_settlement: =hold_ends_on_settlement_acceptance}
        Financial Assistance Review Hold: {end_notice: =end_notice_days_before_end, resume_delay: =contact_resume_delay_days, ends_on_settlement: =hold_ends_on_settlement_acceptance}
        Long-Term Hardship Hold: {end_notice: =end_notice_days_before_end, resume_delay: =contact_resume_delay_days, ends_on_settlement: =hold_ends_on_settlement_acceptance}
        Military Service Hold: {end_notice: =end_notice_days_before_end, resume_delay: =contact_resume_delay_days, ends_on_settlement: =hold_ends_on_settlement_acceptance}

  - id: hardship_evt_financial_assistance
    subject: [hardship_assistance_decision_recorded, hardship_client_notified]
    rule: >-
      A Financial Assistance Review Hold protects a medical account while the client hospital
      decides the consumer's financial assistance application. The client is told of the hold
      within client_notification_sla_business_days business days after approval wherever
      client_notification_required is true, which also covers the Military Service Hold. The
      client's decision is recorded only against a hold whose status is active, with the client's
      decision reference. approved_full means the client writes off the whole balance as charity
      care, approved_partial means it writes off part of it, and denied means no write-off; the
      write-off amount is booked to the account only as the client's charity_care_writeoff credit,
      never decided by Ridgeline. A live tradeline on an account with approved_full or
      approved_partial is deleted under the credit reporting rule. The hold ends with end_reason
      assistance_decided assistance_decision_end_days calendar days after the decision date, or
      earlier if the account is closed by the write-off; where the outcome is denied or
      approved_partial, the consumer may then take a Hardship Reduced-Payment Plan or Hardship
      Settlement within the tier's post_hold_hardship_window_days.
    eligibility:
      - id: decision_on_active_hold
        applies_to: [hardship_assistance_decision_recorded]
        kind: state
        condition: The client's decision is recorded only against a hold whose status is active, with the client's decision reference.
        evidence_fields: [hardship_holds.status, hardship_holds.hold_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.hold_id]
          action_bindings:
            hardship_holds.hold_id: hold_id
        state_contract:
          field: hardship_holds.status
          allowed: [active]
    params:
      per_tier:
        30-Day Hardship Pause: {notify: =client_notification_required, notify_sla: =client_notification_sla_business_days, end_after_decision: =assistance_decision_end_days}
        Documented Hardship Hold: {notify: =client_notification_required, notify_sla: =client_notification_sla_business_days, end_after_decision: =assistance_decision_end_days}
        Disaster Relief Hold: {notify: =client_notification_required, notify_sla: =client_notification_sla_business_days, end_after_decision: =assistance_decision_end_days}
        Financial Assistance Review Hold: {notify: =client_notification_required, notify_sla: =client_notification_sla_business_days, end_after_decision: =assistance_decision_end_days}
        Long-Term Hardship Hold: {notify: =client_notification_required, notify_sla: =client_notification_sla_business_days, end_after_decision: =assistance_decision_end_days}
        Military Service Hold: {notify: =client_notification_required, notify_sla: =client_notification_sla_business_days, end_after_decision: =assistance_decision_end_days}

  - id: hardship_combo_dispute_and_arrangements
    subject: [hardship_hold_approved, hardship_hold_ended]
    rule: >-
      Holds interact with disputes and arrangements on the same account, and the stronger
      suspension always wins. A hold is approved only while the account's status is
      validation_period, active or arranged; an account in dispute_hold is answered under the dispute
      rules first and the hold request waits undecided or is denied with account_not_eligible_status
      if the account leaves those statuses. When a dispute places the account in dispute_hold during
      a running hold, the hold ends that day with end_reason dispute_hold_placed and does not resume
      by itself. When a hold starts on an account with an active payment plan, the plan is suspended
      the same day; when the hold ends, the plan resumes only if the consumer agrees, under the
      payment arrangement suspension rule, and the account returns to arranged, otherwise to active.
      A settlement offered during a hold is subject to the tier's settlement_offers_during_hold_allowed,
      and its acceptance ends the hold where hold_ends_on_settlement_acceptance is true, the hold
      ending before the acceptance moves the account to arranged. An account whose arrangement is an
      accepted settlement is not given a hold; the consumer uses the settlement's due-date
      extensions instead. An ended hold
      of a tier whose hardship_plan_eligible_after_hold or hardship_settlement_eligible_after_hold is
      true opens the hardship plan or settlement for post_hold_hardship_window_days calendar days
      after ended_date.
    eligibility:
      - id: approve_on_eligible_account_status
        applies_to: [hardship_hold_approved]
        kind: state
        condition: A hold is approved only while the account's status is validation_period, active or arranged; an account in dispute_hold is answered under the dispute rules first and the hold request waits undecided or is denied with account_not_eligible_status if the account leaves those statuses.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active, arranged]
    params:
      per_tier:
        30-Day Hardship Pause: {plan_after: =hardship_plan_eligible_after_hold, settlement_after: =hardship_settlement_eligible_after_hold, window: =post_hold_hardship_window_days, offers_during: =settlement_offers_during_hold_allowed}
        Documented Hardship Hold: {plan_after: =hardship_plan_eligible_after_hold, settlement_after: =hardship_settlement_eligible_after_hold, window: =post_hold_hardship_window_days, offers_during: =settlement_offers_during_hold_allowed}
        Disaster Relief Hold: {plan_after: =hardship_plan_eligible_after_hold, settlement_after: =hardship_settlement_eligible_after_hold, window: =post_hold_hardship_window_days, offers_during: =settlement_offers_during_hold_allowed}
        Financial Assistance Review Hold: {plan_after: =hardship_plan_eligible_after_hold, settlement_after: =hardship_settlement_eligible_after_hold, window: =post_hold_hardship_window_days, offers_during: =settlement_offers_during_hold_allowed}
        Long-Term Hardship Hold: {plan_after: =hardship_plan_eligible_after_hold, settlement_after: =hardship_settlement_eligible_after_hold, window: =post_hold_hardship_window_days, offers_during: =settlement_offers_during_hold_allowed}
        Military Service Hold: {plan_after: =hardship_plan_eligible_after_hold, settlement_after: =hardship_settlement_eligible_after_hold, window: =post_hold_hardship_window_days, offers_during: =settlement_offers_during_hold_allowed}

extended_policies:
- id: hardship_ext_cure_notice
  base_policy_refs:
  - hardship_evt_documentation
  overwrite:
  - base_policy: hardship_evt_documentation
    superseded_clause: >-
      Incomplete documentation may be resubmitted while hardship_msr_resubmissions is below documentation_resubmission_max
      and the due date has not passed
    replaced_by: >-
      A resubmission is accepted while the request's resubmissions remain below the tier's resubmission
      maximum and the due date in force has not passed: the cure due date set by this rule where a cure
      notice stands, otherwise the due date of the original documentation request.
  - base_policy: hardship_evt_documentation
    superseded_clause: >-
      The documentation period is the tier's documentation_due_days in calendar days, the day after request_date
      being day one.
    replaced_by: >-
      Where a cure notice stands on the request, the documentation period of the request runs to the cure
      due date, so the request is not denied for documentation not received before that date has passed;
      where none stands, the documentation period is the one the request's initial documentation request
      set: the tier's documentation days counted from the day after the request date or, for a Military
      Service Hold request, the due date its initial documentation request set.
  trigger: state_due
  subject:
  - hardship_documentation_requested
  computes: cure_due_days
  target_tool: send_cure_notice_c402292e
  params:
    recent_placement_window_days: 30
    recent_placement_days: 3
    paper_mail_days: 7
    mixed_mail_days: 3
    physician_form_days: 7
    statement_days: 3
    late_notice_lag_days: 5
    prompt_notice_lag_days: 3
    late_notice_days: 5
    prompt_notice_days: 2
    medical_cure_days: 5
    installment_cure_days: 2
  rule: >-
    A cure notice is owed on an undecided hold request when a documentation submission has arrived on
    the request but the request still shows no date on which complete documentation arrived. A cure notice
    is owed only on a request whose history already carries a documentation request for the kind of documentation
    that arrived; a request with no documentation request yet is answered by its initial documentation
    request instead. No cure notice is owed once the resubmissions of that kind on the request have reached
    the tier's resubmission maximum, counting every submission of that kind after the first as one used;
    such a request is denied for documentation not received instead. The notice asks for the kind of documentation
    carried by the latest submission received on the request, and states the days allowed to cure: the
    number of calendar days, counted from the day the notice is sent, within which the completed documentation
    must arrive. The days allowed to cure run from the day the notice is sent to the due date of the original
    documentation request for that same kind of documentation. A resubmission is accepted while the request's
    resubmissions remain below the tier's resubmission maximum and the due date in force has not passed:
    the cure due date set by this rule where a cure notice stands, otherwise the due date of the original
    documentation request. Where a cure notice stands on the request, the documentation period of the
    request runs to the cure due date, so the request is not denied for documentation not received before
    that date has passed; where none stands, the documentation period is the one the request's initial
    documentation request set: the tier's documentation days counted from the day after the request date
    or, for a Military Service Hold request, the due date its initial documentation request set. The point
    the days allowed to cure run to depends on the placed account's validation period: where the account's
    status is still validation period and the validation period's last day falls after that original due
    date, the days allowed to cure run to the validation period's last day instead; where the account's
    validation period ended no more than the recent-placement window ago, they run to the original due
    date plus the recent-placement allowance; otherwise they run to the original due date. Four allowances
    are then added to that count, each once and all on the same count. The cure mailing allowance depends
    on how submissions on the request have arrived: where at least one arrived by mail or fax and none
    by the online portal or email, the paper mailing allowance is added; where at least one arrived by
    mail or fax and at least one by the online portal or email, the mixed mailing allowance is added;
    otherwise none is added. The cure form allowance depends on the kind of documentation the notice asks
    for: a physician's medical or disability certification adds the physician form allowance, household
    income records add the statement allowance, and any other kind adds none. The cure debt allowance
    depends on the debt type of the placed account the request is for, because medical and installment
    creditors supply the itemised statements and payoff letters a completed package often needs: a medical
    debt adds the medical cure days; an auto deficiency, a retail installment debt or a private student
    loan adds the installment cure days; any other debt type adds none. The cure notice lag allowance
    depends on the calendar days between the day the latest submission arrived and the day the notice
    is sent: more than the late-notice lag adds the late-notice allowance; at least the prompt-notice
    lag but no more than the late-notice lag adds the prompt-notice allowance; fewer than the prompt-notice
    lag adds none. The days allowed to cure are a whole number of calendar days and are not rounded.
  prerequisite: []
  cross_category:
  - category: account
    as: branch
    reads:
    - status
    - validation_period_end_date
    - debt_type
    note: >-
      The placed account's status and validation period end decide which point the days allowed to cure
      run to, and its debt type decides the cure debt allowance.
  compute:
  - missing_type: >-
      LATEST('hardship_hold_events', 'document_type', event_type='hardship_documentation_received')
  - original_due: >-
      LATEST('hardship_hold_events', 'due_date', event_type='hardship_documentation_requested', document_type=missing_type,
      event_date=F('request_date')) if COUNT('hardship_hold_events', event_type='hardship_documentation_requested',
      document_type=missing_type, event_date=F('request_date')) >= 1 else LATEST('hardship_hold_events',
      'due_date', event_type='hardship_documentation_requested', document_type=missing_type)
  - days_to_original_due: DAYS(NOW, original_due)
  - cure_account_status: CFIELD('account', 'status', account_id=F('account_id'))
  - cure_validation_gap: DAYS(NOW, CFIELD('account', 'validation_period_end_date', account_id=F('account_id')))
  - cure_run_days: >-
      cure_validation_gap if (cure_account_status == 'validation_period' and cure_validation_gap > days_to_original_due)
      else ((days_to_original_due + K('recent_placement_days')) if (cure_validation_gap < 0 and cure_validation_gap
      >= -K('recent_placement_window_days')) else days_to_original_due)
  - cure_paper_n: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='mail') + COUNT('hardship_hold_events',
      event_type='hardship_documentation_received', channel='fax')
  - cure_electronic_n: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='online_portal')
      + COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='email')
  - cure_mail_days: >-
      K('paper_mail_days') if (cure_paper_n >= 1 and cure_electronic_n == 0) else (K('mixed_mail_days')
      if (cure_paper_n >= 1 and cure_electronic_n >= 1) else 0)
  - cure_form_days: >-
      K('physician_form_days') if missing_type == 'medical_or_disability_certification' else (K('statement_days')
      if missing_type == 'income_loss_evidence' else 0)
  - cure_debt_type: CFIELD('account', 'debt_type', account_id=F('account_id'))
  - cure_debt_days: >-
      K('medical_cure_days') if cure_debt_type == 'medical' else (K('installment_cure_days') if (cure_debt_type
      == 'auto_deficiency' or cure_debt_type == 'retail_installment' or cure_debt_type == 'private_student_loan')
      else 0)
  - cure_lag: >-
      DAYS(LATEST('hardship_hold_events', 'event_date', event_type='hardship_documentation_received'),
      NOW)
  - cure_lag_days: >-
      K('late_notice_days') if cure_lag > K('late_notice_lag_days') else (K('prompt_notice_days') if cure_lag
      >= K('prompt_notice_lag_days') else 0)
  - result: cure_run_days + cure_mail_days + cure_form_days + cure_debt_days + cure_lag_days
  compute_basis:
    missing_type: >-
      The notice asks for the kind of documentation carried by the latest submission received on the request,
      and states the days allowed to cure
    original_due: >-
      The days allowed to cure run from the day the notice is sent to the due date of the original documentation
      request for that same kind of documentation.
    days_to_original_due: >-
      the number of calendar days, counted from the day the notice is sent, within which the completed
      documentation must arrive.
    cure_account_status: >-
      where the account's status is still validation period and the validation period's last day falls
      after that original due date, the days allowed to cure run to the validation period's last day instead
    cure_validation_gap: >-
      The point the days allowed to cure run to depends on the placed account's validation period
    cure_run_days: >-
      where the account's status is still validation period and the validation period's last day falls
      after that original due date, the days allowed to cure run to the validation period's last day instead;
      where the account's validation period ended no more than the recent-placement window ago, they run
      to the original due date plus the recent-placement allowance; otherwise they run to the original
      due date.
    cure_paper_n: >-
      where at least one arrived by mail or fax and none by the online portal or email, the paper mailing
      allowance is added
    cure_electronic_n: >-
      where at least one arrived by mail or fax and at least one by the online portal or email, the mixed
      mailing allowance is added
    cure_mail_days: >-
      The cure mailing allowance depends on how submissions on the request have arrived: where at least
      one arrived by mail or fax and none by the online portal or email, the paper mailing allowance is
      added; where at least one arrived by mail or fax and at least one by the online portal or email,
      the mixed mailing allowance is added; otherwise none is added.
    cure_form_days: >-
      The cure form allowance depends on the kind of documentation the notice asks for: a physician's
      medical or disability certification adds the physician form allowance, household income records
      add the statement allowance, and any other kind adds none.
    cure_debt_type: The cure debt allowance depends on the debt type of the placed account the request
      is for
    cure_debt_days: >-
      a medical debt adds the medical cure days; an auto deficiency, a retail installment debt or a private
      student loan adds the installment cure days; any other debt type adds none.
    cure_lag: >-
      The cure notice lag allowance depends on the calendar days between the day the latest submission
      arrived and the day the notice is sent
    cure_lag_days: >-
      more than the late-notice lag adds the late-notice allowance; at least the prompt-notice lag but
      no more than the late-notice lag adds the prompt-notice allowance; fewer than the prompt-notice
      lag adds none.
    result: Four allowances are then added to that count, each once and all on the same count.
  factors:
  - id: cure_run_point
    effect: method
    decides: cure_run_days
    bindings:
    - cure_account_status
    - cure_validation_gap
    - cure_run_days
    ladder:
    - when: >-
        the placed account's status is still validation period and its validation period's last day falls
        after the original due date
      method: the days allowed to cure are counted to the validation period's last day
    - when: the placed account's validation period ended no more than the recent-placement window ago
      method: >-
        the days allowed to cure are counted to the original due date, plus the recent-placement allowance
    - when: otherwise
      method: the days allowed to cure are counted to the original due date
    baseline:
      cure_run_days: days_to_original_due
    evidence:
    - cross_category
    - date
    cross_difficulty: account
  - id: cure_mailing
    effect: parameter
    decides: cure_mail_days
    bindings:
    - cure_paper_n
    - cure_electronic_n
    - cure_mail_days
    ladder:
    - when: >-
        at least one submission on the request arrived by mail or fax and none by the online portal or
        email
      value: K('paper_mail_days')
    - when: >-
        at least one submission arrived by mail or fax and at least one by the online portal or email
      value: K('mixed_mail_days')
    - when: otherwise
      value: '0'
    baseline:
      cure_mail_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: cure_form
    effect: parameter
    decides: cure_form_days
    bindings:
    - missing_type
    - cure_form_days
    ladder:
    - when: the notice asks for a physician's medical or disability certification
      value: K('physician_form_days')
    - when: the notice asks for household income records
      value: K('statement_days')
    - when: otherwise
      value: '0'
    baseline:
      cure_form_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: cure_debt_kind
    effect: parameter
    decides: cure_debt_days
    bindings:
    - cure_debt_type
    - cure_debt_days
    ladder:
    - when: the placed account the request is for is a medical debt
      value: K('medical_cure_days')
    - when: it is an auto deficiency, a retail installment debt or a private student loan
      value: K('installment_cure_days')
    - when: otherwise
      value: '0'
    baseline:
      cure_debt_days: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: cure_notice_lag
    effect: parameter
    decides: cure_lag_days
    bindings:
    - cure_lag
    - cure_lag_days
    ladder:
    - when: >-
        more than the late-notice lag of calendar days passed between the latest submission's arrival
        and the notice
      value: K('late_notice_days')
    - when: at least the prompt-notice lag but no more than the late-notice lag passed
      value: K('prompt_notice_days')
    - when: otherwise (fewer than the prompt-notice lag)
      value: '0'
    baseline:
      cure_lag_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The notice asks for the kind of documentation carried by the latest submission received on the request,
      and states the days allowed to cure: the number of calendar days, counted from the day the notice
      is sent, within which the completed documentation must arrive. The days allowed to cure run from
      the day the notice is sent to the due date of the original documentation request for that same kind
      of documentation. The days allowed to cure are a whole number of calendar days and are not rounded.
    params: []
  inputs:
    history:
    - table: hardship_hold_events
      aggregate: latest
      field: document_type
      filters:
        event_type: hardship_documentation_received
    - table: hardship_hold_events
      aggregate: latest
      field: due_date
      filters:
        event_type: hardship_documentation_requested
    - table: hardship_hold_events
      aggregate: count
      field: channel
      filters:
        event_type: hardship_documentation_received
    cross_category:
    - account
- id: hardship_ext_longterm_extension
  base_policy_refs:
  - hardship_evt_extension
  - hardship_evt_review
  - hardship_evt_end
  overwrite:
  - base_policy: hardship_evt_extension
    superseded_clause: >-
      A running hold may be extended at the consumer's request up to the tier's max_extensions times,
      each extension adding extension_days calendar days to end_date.
    replaced_by: >-
      A running Long-Term Hardship Hold may be extended up to the tier's maximum number of extensions,
      each extension adding the days the long-term extension adds, as worked out below, to the hold's
      end date; a running Military Service Hold is extended under its own extension rule, and a running
      hold of any other tier may be extended at the consumer's request up to the tier's maximum number
      of extensions, each extension adding the tier's extension days to its end date.
  - base_policy: hardship_evt_extension
    superseded_clause: >-
      The hold's current end date is start_date plus initial_hold_days plus extension_days for each extension
      already granted, minus 1, counted in calendar days with the last day included.
    replaced_by: >-
      For a Long-Term Hardship Hold, as for a hold of every other tier, the hold's current end date is
      the end date on record: start_date plus initial_hold_days minus 1, plus the days each extension
      already granted added, counted in calendar days with the last day included, and the hold completes
      its term on that date.
  - base_policy: hardship_evt_end
    superseded_clause: >-
      The hold's current end date is start_date plus initial_hold_days plus extension_days for each extension
      granted, minus 1, counted in calendar days.
    replaced_by: >-
      For a Long-Term Hardship Hold, as for a hold of every other tier, the hold's current end date is
      the end date on record: start_date plus initial_hold_days minus 1, plus the days each extension
      already granted added, counted in calendar days with the last day included, and the hold completes
      its term on that date.
  - base_policy: hardship_evt_extension
    superseded_clause: >-
      is refused when the tier counts toward the annual limit and hardship_msr_hold_days_12m plus extension_days
      would exceed max_hold_days_rolling_12_months
    replaced_by: >-
      An extension is refused when the tier counts toward the annual limit and the hold days in the rolling
      12 months plus the days the extension adds would exceed the tier's rolling 12-month maximum, the
      days the extension adds being, for a Long-Term Hardship Hold, the days the long-term extension adds
      and, for any other tier that counts toward the limit, the tier's extension days.
  - base_policy: hardship_evt_extension
    superseded_clause: It is decided within extension_decision_sla_business_days business days.
    replaced_by: >-
      The consumer's own booking through the portal is the decision on a Long-Term Hardship Hold extension
      and takes effect the day it is made; a Military Service Hold extension is decided under its own
      extension rule, and an extension of a hold of any other tier is decided within the tier's extension
      decision days, counted as business days.
  trigger: on_request
  subject:
  - hardship_extension_granted
  - hardship_hold_extended
  computes: extension_days
  target_tool: extend_longterm_hold_aa9e035f
  params:
    steady_payer_usd: 150.0
    part_payer_days: 75
    plan_steady_installments: 3
    plan_steady_cut_days: 30
    plan_some_cut_days: 15
    medical_program_days: 30
    installment_program_days: 15
    repeat_return_count: 2
    repeat_return_days: 14
    single_return_days: 7
    large_balance_usd: 5000.0
    mid_balance_usd: 1000.0
    large_balance_days: 10
    mid_balance_days: 5
  rule: >-
    A running Long-Term Hardship Hold may be extended up to the tier's maximum number of extensions, each
    extension adding the days the long-term extension adds, as worked out below, to the hold's end date;
    a running Military Service Hold is extended under its own extension rule, and a running hold of any
    other tier may be extended at the consumer's request up to the tier's maximum number of extensions,
    each extension adding the tier's extension days to its end date. The extension is the consumer's own
    election: once the updated documentation the tier requires is on record and the request falls inside
    the tier's extension window, the consumer books it in person through the self-service portal, and
    the desk tells the consumer the days the long-term extension adds. The days the long-term extension
    adds are the tier's extension days, counted from the day after the hold's current end date, so that
    the new end date is the current end date plus the days added. For a Long-Term Hardship Hold, as for
    a hold of every other tier, the hold's current end date is the end date on record: start_date plus
    initial_hold_days minus 1, plus the days each extension already granted added, counted in calendar
    days with the last day included, and the hold completes its term on that date. An extension is refused
    when the tier counts toward the annual limit and the hold days in the rolling 12 months plus the days
    the extension adds would exceed the tier's rolling 12-month maximum, the days the extension adds being,
    for a Long-Term Hardship Hold, the days the long-term extension adds and, for any other tier that
    counts toward the limit, the tier's extension days. The consumer's own booking through the portal
    is the decision on a Long-Term Hardship Hold extension and takes effect the day it is made; a Military
    Service Hold extension is decided under its own extension rule, and an extension of a hold of any
    other tier is decided within the tier's extension decision days, counted as business days. Six rules
    adjust that figure, and the figure is then the base length plus the anchor shift, less the capacity
    cut, plus the program, returned-payment and balance allowances, each applied once to the same sum.
    The base length of a long-term extension depends on the consumer's net voluntary payments on the held
    account in the last six months, meaning payments posted less payments returned, each dated less than
    six whole months before today, whole months being the difference in calendar months between the date
    and today, less one when today's day of the month is smaller than the date's day of the month: net
    payments of at least the steady-payer amount give a base length of one review interval of the tier;
    net payments above zero but below the steady-payer amount give the part-payer length; no net payments
    give the tier's extension days. The anchor of a long-term extension depends on the status review that
    next falls due after the current end date, reviews falling due every review interval counted from
    the hold's start date and a review falling due on the current end date itself counting as one inside
    the hold: where that review falls due no more than the tier's review overdue days after the current
    end date and every review that has fallen due by today was recorded as continuing the hold, the extension
    is counted from the last day of that review's overdue window, adding the days from the current end
    date to that review's due date plus the review overdue days; where that review falls due within the
    same period but fewer reviews were recorded as continuing the hold than have fallen due, the extension
    is counted from that review's due date, adding the days from the current end date to that due date;
    otherwise it is counted from the day after the current end date and adds nothing. The capacity cut
    of a long-term extension depends on the installments the consumer paid on payment plans dated less
    than three whole months before today: at least the steady-installment count of paid installments cuts
    the plan-steady days; one paid installment or more but fewer than that count cuts the plan-some days;
    none cuts nothing. The program allowance of a long-term extension depends on the held account's debt
    type: a medical debt adds the medical program days; an auto deficiency, a retail installment debt
    or a private student loan adds the installment program days; any other debt type adds nothing. The
    returned-payment allowance of a long-term extension depends on the payments returned on the held account
    dated less than six whole months before today: at least the repeat-return count adds the repeat-return
    days; exactly one adds the single-return days; none adds nothing. The balance allowance of a long-term
    extension depends on the held account's balance due: at least the large-balance amount adds the large-balance
    days; at least the mid-balance amount but below the large-balance amount adds the mid-balance days;
    below the mid-balance amount adds nothing. The larger cushion follows the larger balance because the
    client reviews a larger balance before collection on it may resume. The days the long-term extension
    adds are a whole number of calendar days and are not rounded.
  prerequisite: []
  cross_category:
  - category: account
    as: history
    reads:
    - debt_type
    - balance_due
    - account_transactions.amount
    note: >-
      The held account's payments and returns, debt type and balance decide the base length, the program,
      returned-payment and balance allowances.
  - category: plan
    as: history
    reads:
    - plan_installments.event_type
    note: The consumer's paid plan installments in the last three months decide the capacity cut.
  compute:
  - lt_paid_6m: >-
      XSUM('account', 'account_transactions', 'amount', account_id=F('account_id'), event_type='account_payment_posted',
      within_months=6, date_field='txn_date')
  - lt_returned_6m: >-
      XSUM('account', 'account_transactions', 'amount', account_id=F('account_id'), event_type='account_payment_returned',
      within_months=6, date_field='txn_date')
  - lt_base_days: >-
      P('review_interval_days') if (lt_paid_6m - lt_returned_6m) >= K('steady_payer_usd') else (K('part_payer_days')
      if (lt_paid_6m - lt_returned_6m) > 0 else P('extension_days'))
  - lt_held: DAYS(F('start_date'), F('end_date'))
  - lt_review_gap: ((lt_held // P('review_interval_days')) + 1) * P('review_interval_days') - lt_held
  - lt_reviews_due: DAYS(F('start_date'), NOW) // P('review_interval_days')
  - lt_reviews_kept: >-
      COUNT('hardship_hold_events', event_type='hardship_review_recorded', review_outcome='continue_hold')
  - lt_anchor_days: >-
      (lt_review_gap + P('review_overdue_days')) if (lt_review_gap <= P('review_overdue_days') and lt_reviews_kept
      >= lt_reviews_due) else (lt_review_gap if (lt_review_gap <= P('review_overdue_days') and lt_reviews_kept
      < lt_reviews_due) else 0)
  - lt_plan_paid_3m: >-
      XCOUNT('plan', 'plan_installments', event_type='plan_installment_paid', within_months=3, date_field='txn_date')
  - lt_plan_cut: >-
      K('plan_steady_cut_days') if lt_plan_paid_3m >= K('plan_steady_installments') else (K('plan_some_cut_days')
      if lt_plan_paid_3m >= 1 else 0)
  - lt_debt_type: CFIELD('account', 'debt_type', account_id=F('account_id'))
  - lt_program_days: >-
      K('medical_program_days') if lt_debt_type == 'medical' else (K('installment_program_days') if (lt_debt_type
      == 'auto_deficiency' or lt_debt_type == 'retail_installment' or lt_debt_type == 'private_student_loan')
      else 0)
  - lt_returned_n: >-
      XCOUNT('account', 'account_transactions', account_id=F('account_id'), event_type='account_payment_returned',
      within_months=6, date_field='txn_date')
  - lt_return_days: >-
      K('repeat_return_days') if lt_returned_n >= K('repeat_return_count') else (K('single_return_days')
      if lt_returned_n == 1 else 0)
  - lt_balance: CFIELD('account', 'balance_due', account_id=F('account_id'))
  - lt_balance_days: >-
      K('large_balance_days') if lt_balance >= K('large_balance_usd') else (K('mid_balance_days') if lt_balance
      >= K('mid_balance_usd') else 0)
  - result: >-
      lt_base_days + lt_anchor_days - lt_plan_cut + lt_program_days + lt_return_days + lt_balance_days
  compute_basis:
    lt_paid_6m: >-
      the consumer's net voluntary payments on the held account in the last six months, meaning payments
      posted less payments returned, each dated less than six whole months before today, whole months
      being the difference in calendar months between the date and today, less one when today's day of
      the month is smaller than the date's day of the month
    lt_returned_6m: >-
      meaning payments posted less payments returned, each dated less than six whole months before today,
      whole months being the difference in calendar months between the date and today, less one when today's
      day of the month is smaller than the date's day of the month
    lt_base_days: >-
      net payments of at least the steady-payer amount give a base length of one review interval of the
      tier; net payments above zero but below the steady-payer amount give the part-payer length; no net
      payments give the tier's extension days.
    lt_held: >-
      For a Long-Term Hardship Hold, as for a hold of every other tier, the hold's current end date is
      the end date on record: start_date plus initial_hold_days minus 1, plus the days each extension
      already granted added, counted in calendar days with the last day included, and the hold completes
      its term on that date.
    lt_review_gap: >-
      The anchor of a long-term extension depends on the status review that next falls due after the current
      end date, reviews falling due every review interval counted from the hold's start date and a review
      falling due on the current end date itself counting as one inside the hold
    lt_reviews_due: every review that has fallen due by today was recorded as continuing the hold
    lt_reviews_kept: every review that has fallen due by today was recorded as continuing the hold
    lt_anchor_days: >-
      where that review falls due no more than the tier's review overdue days after the current end date
      and every review that has fallen due by today was recorded as continuing the hold, the extension
      is counted from the last day of that review's overdue window, adding the days from the current end
      date to that review's due date plus the review overdue days; where that review falls due within
      the same period but fewer reviews were recorded as continuing the hold than have fallen due, the
      extension is counted from that review's due date, adding the days from the current end date to that
      due date; otherwise it is counted from the day after the current end date and adds nothing.
    lt_plan_paid_3m: >-
      The capacity cut of a long-term extension depends on the installments the consumer paid on payment
      plans dated less than three whole months before today
    lt_plan_cut: >-
      at least the steady-installment count of paid installments cuts the plan-steady days; one paid installment
      or more but fewer than that count cuts the plan-some days; none cuts nothing.
    lt_debt_type: The program allowance of a long-term extension depends on the held account's debt type
    lt_program_days: >-
      a medical debt adds the medical program days; an auto deficiency, a retail installment debt or a
      private student loan adds the installment program days; any other debt type adds nothing.
    lt_returned_n: >-
      The returned-payment allowance of a long-term extension depends on the payments returned on the
      held account dated less than six whole months before today
    lt_return_days: >-
      at least the repeat-return count adds the repeat-return days; exactly one adds the single-return
      days; none adds nothing.
    lt_balance: The balance allowance of a long-term extension depends on the held account's balance due
    lt_balance_days: >-
      at least the large-balance amount adds the large-balance days; at least the mid-balance amount but
      below the large-balance amount adds the mid-balance days; below the mid-balance amount adds nothing.
    result: >-
      the figure is then the base length plus the anchor shift, less the capacity cut, plus the program,
      returned-payment and balance allowances, each applied once to the same sum.
  factors:
  - id: lt_payment_capacity
    effect: parameter
    decides: lt_base_days
    bindings:
    - lt_paid_6m
    - lt_returned_6m
    - lt_base_days
    ladder:
    - when: >-
        net voluntary payments on the held account dated less than six whole months before today reach
        the steady-payer amount
      value: P('review_interval_days')
    - when: net voluntary payments in that period are above zero but below the steady-payer amount
      value: K('part_payer_days')
    - when: otherwise (no net payments)
      value: P('extension_days')
    baseline:
      lt_base_days: P('extension_days')
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  - id: lt_review_anchor
    effect: method
    decides: lt_anchor_days
    bindings:
    - lt_held
    - lt_review_gap
    - lt_reviews_due
    - lt_reviews_kept
    - lt_anchor_days
    ladder:
    - when: >-
        the next status review falls due no more than the review overdue days after the current end date
        and every review fallen due by today was recorded as continuing the hold
      method: the long-term extension is counted from the last day of that review's overdue window
    - when: >-
        the next status review falls due within that period and fewer reviews were recorded as continuing
        than have fallen due
      method: the long-term extension is counted from that review's due date
    - when: otherwise
      method: the long-term extension is counted from the day after the current end date
    baseline:
      lt_anchor_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lt_plan_capacity
    effect: parameter
    decides: lt_plan_cut
    bindings:
    - lt_plan_paid_3m
    - lt_plan_cut
    ladder:
    - when: >-
        the consumer paid at least the steady-installment count of plan installments dated less than three
        whole months before today
      value: K('plan_steady_cut_days')
    - when: the consumer paid at least one but fewer than that count
      value: K('plan_some_cut_days')
    - when: otherwise (none paid)
      value: '0'
    baseline:
      lt_plan_cut: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  - id: lt_debt_program
    effect: parameter
    decides: lt_program_days
    bindings:
    - lt_debt_type
    - lt_program_days
    ladder:
    - when: the held account is a medical debt
      value: K('medical_program_days')
    - when: >-
        the held account is an auto deficiency, a retail installment debt or a private student loan
      value: K('installment_program_days')
    - when: otherwise
      value: '0'
    baseline:
      lt_program_days: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: lt_returned_payments
    effect: parameter
    decides: lt_return_days
    bindings:
    - lt_returned_n
    - lt_return_days
    ladder:
    - when: >-
        at least the repeat-return count of payments returned on the held account are dated less than
        six whole months before today
      value: K('repeat_return_days')
    - when: exactly one payment was returned in that period
      value: K('single_return_days')
    - when: otherwise (none returned)
      value: '0'
    baseline:
      lt_return_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  - id: lt_balance_size
    effect: parameter
    decides: lt_balance_days
    bindings:
    - lt_balance
    - lt_balance_days
    ladder:
    - when: the held account's balance due is at least the large-balance amount
      value: K('large_balance_days')
    - when: the balance due is at least the mid-balance amount but below the large-balance amount
      value: K('mid_balance_days')
    - when: otherwise
      value: '0'
    baseline:
      lt_balance_days: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  baseline:
    rule: >-
      The days the long-term extension adds are the tier's extension days, counted from the day after
      the hold's current end date, so that the new end date is the current end date plus the days added.
      The days the long-term extension adds are a whole number of calendar days and are not rounded.
    params:
    - extension_days
  inputs:
    history:
    - category: account
      table: account_transactions
      aggregate: sum
      field: amount
      within_months: 6
      filters:
        event_type: account_payment_posted
    - category: account
      table: account_transactions
      aggregate: count
      field: amount
      within_months: 6
      filters:
        event_type: account_payment_returned
    - category: plan
      table: plan_installments
      aggregate: count
      field: amount
      within_months: 3
      filters:
        event_type: plan_installment_paid
    - table: hardship_hold_events
      aggregate: count
      field: review_outcome
      filters:
        event_type: hardship_review_recorded
    cross_category:
    - account
    - plan
- id: hardship_ext_review_income_records
  base_policy_refs:
  - hardship_evt_documentation
  - hardship_evt_review
  overwrite: []
  trigger: state_due
  subject:
  - hardship_documentation_requested
  computes: due_in_days
  target_tool: request_income_records_8e86e9ce
  params:
    short_notice_days: 7
    income_paper_mail_days: 7
    income_mixed_mail_days: 3
    near_term_window_days: 30
    mid_term_window_days: 60
    near_term_cut_days: 4
    mid_term_cut_days: 2
    repeat_return_count: 2
    income_repeat_return_days: 4
    income_single_return_days: 2
  rule: >-
    Before each status review of a running Long-Term Hardship Hold, Ridgeline asks the consumer for updated
    household income records, because the review continues the hold only on income records that show the
    drop in household income still holds. The income records due date is fixed only after the hold's end
    date on record reaches past the status review the records are for. The updated income records are
    due on the last day of the upcoming status review's overdue window: the days allowed for the income
    records run from the day of the request to the due date of the status review that next falls due,
    reviews falling due every review interval counted from the hold's start date, plus the tier's review
    overdue days. The income records due date never falls after the hold's current end date. A status
    review falling due on the day of the request counts as already fallen due, so the review that next
    falls due is the following one. The point the income records due date is counted from depends on how
    soon that review falls due: where it falls due within the short-notice days of the request, the income
    records are due the tier's documentation days after the request; where it falls due later than the
    short-notice days but no later than the tier's review overdue days after the request, they are due
    the tier's documentation days after the review's due date; otherwise they are due on the last day
    of the review's overdue window. Three adjustments then apply to that count, each once: the income
    mailing allowance and the income returned-payment allowance are added and the income term cut is subtracted,
    and the cap to the hold's current end date is applied last, to the adjusted count. The income mailing
    allowance depends on how documentation on the hold has arrived: where at least one submission arrived
    by mail or fax and none by the online portal or email, the income paper allowance is added; where
    at least one arrived by mail or fax and at least one by the online portal or email, the income mixed
    allowance is added; otherwise none is added. The income term cut depends on the calendar days from
    today to the held account's placement term end date: no more than the near-term window cuts the near-term
    days; more than the near-term window but no more than the mid-term window cuts the mid-term days;
    more than the mid-term window cuts nothing. The income returned-payment allowance depends on the payments
    returned on the held account dated less than six whole months before today, whole months being the
    difference in calendar months between the date and today, less one when today's day of the month is
    smaller than the date's day of the month: at least the repeat-return count adds the income repeat-return
    days; exactly one adds the income single-return days; none adds nothing. The days allowed for the
    income records are a whole number of calendar days and are not rounded.
  prerequisite:
  - problem: hardship_ext_longterm_extension
    kind: value_input
    gate: inc_end_room
    form: state
    policy_source: >-
      The income records due date is fixed only after the hold's end date on record reaches past the status
      review the records are for.
    condition: >-
      The running hold's end date on record falls after the due date of the status review that next falls
      due, so that the cap to the hold's current end date does not cut the income records due date short.
    resolved_by: extend_longterm_hold_aa9e035f
    effect: >-
      The days left before the hold's current end date grow from the days before the old end date to the
      days before the extended end date, so the cap stops binding and the income records due date is the
      adjusted count.
  cross_category:
  - category: account
    as: history
    reads:
    - term_end_date
    - account_transactions.event_type
    note: >-
      The held account's placement term end and its returned payments decide the income term cut and the
      income returned-payment allowance.
  compute:
  - inc_held_now: DAYS(F('start_date'), NOW)
  - inc_review_in: >-
      ((inc_held_now // P('review_interval_days')) + 1) * P('review_interval_days') - inc_held_now
  - inc_anchor_days: >-
      P('documentation_due_days') if inc_review_in <= K('short_notice_days') else ((inc_review_in + P('documentation_due_days'))
      if inc_review_in <= P('review_overdue_days') else (inc_review_in + P('review_overdue_days')))
  - inc_paper_n: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='mail') + COUNT('hardship_hold_events',
      event_type='hardship_documentation_received', channel='fax')
  - inc_electronic_n: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='online_portal')
      + COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='email')
  - inc_mail_days: >-
      K('income_paper_mail_days') if (inc_paper_n >= 1 and inc_electronic_n == 0) else (K('income_mixed_mail_days')
      if (inc_paper_n >= 1 and inc_electronic_n >= 1) else 0)
  - inc_term_room: DAYS(NOW, CFIELD('account', 'term_end_date', account_id=F('account_id')))
  - inc_term_cut: >-
      K('near_term_cut_days') if inc_term_room <= K('near_term_window_days') else (K('mid_term_cut_days')
      if inc_term_room <= K('mid_term_window_days') else 0)
  - inc_returned_n: >-
      XCOUNT('account', 'account_transactions', account_id=F('account_id'), event_type='account_payment_returned',
      within_months=6, date_field='txn_date')
  - inc_return_days: >-
      K('income_repeat_return_days') if inc_returned_n >= K('repeat_return_count') else (K('income_single_return_days')
      if inc_returned_n == 1 else 0)
  - inc_end_room: DAYS(NOW, F('end_date'))
  - result: MN(inc_anchor_days + inc_mail_days + inc_return_days - inc_term_cut, inc_end_room)
  compute_basis:
    inc_held_now: >-
      A status review falling due on the day of the request counts as already fallen due, so the review
      that next falls due is the following one.
    inc_review_in: >-
      the days allowed for the income records run from the day of the request to the due date of the status
      review that next falls due, reviews falling due every review interval counted from the hold's start
      date, plus the tier's review overdue days.
    inc_anchor_days: >-
      where it falls due within the short-notice days of the request, the income records are due the tier's
      documentation days after the request; where it falls due later than the short-notice days but no
      later than the tier's review overdue days after the request, they are due the tier's documentation
      days after the review's due date; otherwise they are due on the last day of the review's overdue
      window.
    inc_paper_n: >-
      where at least one submission arrived by mail or fax and none by the online portal or email, the
      income paper allowance is added
    inc_electronic_n: >-
      where at least one arrived by mail or fax and at least one by the online portal or email, the income
      mixed allowance is added
    inc_mail_days: >-
      The income mailing allowance depends on how documentation on the hold has arrived: where at least
      one submission arrived by mail or fax and none by the online portal or email, the income paper allowance
      is added; where at least one arrived by mail or fax and at least one by the online portal or email,
      the income mixed allowance is added; otherwise none is added.
    inc_term_room: >-
      The income term cut depends on the calendar days from today to the held account's placement term
      end date
    inc_term_cut: >-
      no more than the near-term window cuts the near-term days; more than the near-term window but no
      more than the mid-term window cuts the mid-term days; more than the mid-term window cuts nothing.
    inc_returned_n: >-
      The income returned-payment allowance depends on the payments returned on the held account dated
      less than six whole months before today, whole months being the difference in calendar months between
      the date and today, less one when today's day of the month is smaller than the date's day of the
      month
    inc_return_days: >-
      at least the repeat-return count adds the income repeat-return days; exactly one adds the income
      single-return days; none adds nothing.
    inc_end_room: The income records due date never falls after the hold's current end date.
    result: >-
      Three adjustments then apply to that count, each once: the income mailing allowance and the income
      returned-payment allowance are added and the income term cut is subtracted, and the cap to the hold's
      current end date is applied last, to the adjusted count.
  factors:
  - id: inc_count_point
    effect: method
    decides: inc_anchor_days
    bindings:
    - inc_held_now
    - inc_review_in
    - inc_anchor_days
    ladder:
    - when: the next status review falls due within the short-notice days of the request
      method: the income records are due the tier's documentation days after the request
    - when: >-
        it falls due later than the short-notice days but no later than the tier's review overdue days
        after the request
      method: the income records are due the tier's documentation days after the review's due date
    - when: otherwise
      method: the income records are due on the last day of the review's overdue window
    baseline:
      inc_anchor_days: inc_review_in + P('review_overdue_days')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: inc_mailing
    effect: parameter
    decides: inc_mail_days
    bindings:
    - inc_paper_n
    - inc_electronic_n
    - inc_mail_days
    ladder:
    - when: >-
        at least one submission on the hold arrived by mail or fax and none by the online portal or email
      value: K('income_paper_mail_days')
    - when: at least one arrived by mail or fax and at least one by the online portal or email
      value: K('income_mixed_mail_days')
    - when: otherwise
      value: '0'
    baseline:
      inc_mail_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: inc_term_pressure
    effect: parameter
    decides: inc_term_cut
    bindings:
    - inc_term_room
    - inc_term_cut
    ladder:
    - when: the held account's placement term ends no more than the near-term window from today
      value: K('near_term_cut_days')
    - when: it ends more than the near-term window but no more than the mid-term window from today
      value: K('mid_term_cut_days')
    - when: otherwise
      value: '0'
    baseline:
      inc_term_cut: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: account
  - id: inc_returned_payments
    effect: parameter
    decides: inc_return_days
    bindings:
    - inc_returned_n
    - inc_return_days
    ladder:
    - when: >-
        at least the repeat-return count of payments returned on the held account are dated less than
        six whole months before today
      value: K('income_repeat_return_days')
    - when: exactly one payment was returned in that period
      value: K('income_single_return_days')
    - when: otherwise
      value: '0'
    baseline:
      inc_return_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  baseline:
    rule: >-
      The updated income records are due on the last day of the upcoming status review's overdue window:
      the days allowed for the income records run from the day of the request to the due date of the status
      review that next falls due, reviews falling due every review interval counted from the hold's start
      date, plus the tier's review overdue days. The income records due date never falls after the hold's
      current end date. The days allowed for the income records are a whole number of calendar days and
      are not rounded.
    params:
    - review_interval_days
    - review_overdue_days
  inputs:
    history:
    - table: hardship_hold_events
      aggregate: count
      field: channel
      filters:
        event_type: hardship_documentation_received
    - category: account
      table: account_transactions
      aggregate: count
      field: amount
      within_months: 6
      filters:
        event_type: account_payment_returned
    cross_category:
    - account
- id: hardship_ext_medical_recertification
  base_policy_refs:
  - hardship_evt_documentation
  - hardship_evt_review
  overwrite: []
  trigger: state_due
  subject:
  - hardship_documentation_requested
  computes: due_in_days
  target_tool: request_medical_recertification_c8d32721
  params:
    cert_paper_days: 5
    cert_mixed_days: 2
    recent_care_days: 5
    older_care_days: 2
    stale_cert_days: 45
    aging_cert_days: 21
    stale_cert_allowance_days: 5
    aging_cert_allowance_days: 2
  rule: >-
    Before each status review of a running Long-Term Hardship Hold, Ridgeline asks the consumer for an
    updated physician's medical or disability certification, because the review continues the hold only
    on a certification that shows the serious illness, disability or long-term unemployment still holds.
    The recertification request is not sent until every documentation submission on the consumer's other
    undecided Long-Term Hardship Hold requests that still show no complete-documentation date carries
    a documentation request dated on or after the day that submission arrived, so that the physician completes
    one certification for all of them. The recertification due date is not worked out until an income
    records request with a due date still ahead stands on the hold. The recertification is due on the
    last day of the upcoming status review's overdue window: the days allowed for the recertification
    run from the day of the request to the due date of the status review that next falls due, reviews
    falling due every review interval counted from the hold's start date, plus the tier's review overdue
    days. The recertification due date never falls after the hold's current end date. For the recertification,
    a status review falling due on the day of the request counts as already fallen due, so the review
    the recertification is for is the following one. The date the recertification is due on depends on
    the hold's review history: where two or more reviews on the hold were recorded as continuing it, the
    recertification is due on the due date of the latest income records request on the hold, so that both
    arrive as one review package; where exactly one review was recorded as continuing the hold, it is
    due on the later of that income records due date and the last day of the review's overdue window;
    where no review has yet been recorded as continuing the hold, it is due on the last day of the review's
    overdue window. Three allowances are then added to that count, each once, and the cap to the hold's
    current end date is applied last, to the sum. The certification route allowance depends on how the
    physician's certifications on the hold have arrived: where at least one arrived by mail or fax and
    none by the online portal or email, the certification paper allowance is added; where at least one
    arrived by mail or fax and at least one by the online portal or email, the certification mixed allowance
    is added; otherwise none is added. The care billing allowance depends on the consumer's medical debts
    placed with Ridgeline, because a medical bill placed so recently that it is still in its validation
    period points to treatment that is still being billed and a physician who is harder to reach: where
    at least one of the consumer's placed medical accounts is still in its validation period, the recent-care
    allowance is added; where the consumer has placed medical accounts but none of them is still in its
    validation period, the older-care allowance is added; where the consumer has no placed medical account,
    none is added. The certification age allowance depends on the calendar days since the latest physician's
    certification on the hold arrived: at least the stale-certification days adds the stale-certification
    allowance; at least the aging-certification days but fewer than the stale-certification days adds
    the aging-certification allowance; fewer adds nothing. The days allowed for the recertification are
    a whole number of calendar days and are not rounded.
  prerequisite:
  - problem: hardship_ext_review_income_records
    kind: value_input
    gate: rc_income_room
    form: state
    policy_source: >-
      The recertification due date is not worked out until an income records request with a due date still
      ahead stands on the hold.
    condition: >-
      The hold's history carries a documentation request for household income records whose due date is
      later than today.
    resolved_by: request_income_records_8e86e9ce
    effect: >-
      The latest income records due date moves from a date already passed to the newly set due date, so
      the review-package tier, which counts to the latest income records due date, sets the recertification
      on a date still ahead instead of a past one.
  - problem: hardship_ext_cure_notice
    kind: state_gate
    gate: hardship_hold_events.event_type
    form: state
    policy_source: >-
      The recertification request is not sent until every documentation submission on the consumer's other
      undecided Long-Term Hardship Hold requests that still show no complete-documentation date carries
      a documentation request dated on or after the day that submission arrived, so that the physician
      completes one certification for all of them.
    condition: >-
      Every documentation submission received on the consumer's other undecided Long-Term Hardship Hold
      requests that still show no complete-documentation date is followed by a documentation request dated
      on or after the day that submission arrived.
    resolved_by: send_cure_notice_c402292e
    effect: >-
      The other request's history gains a documentation request dated on or after its incomplete submission,
      which is the condition the recertification request waits on.
  cross_category:
  - category: account
    as: branch
    reads:
    - debt_type
    - status
    note: >-
      Whether the consumer has placed medical accounts, and whether one is still in its validation period,
      decides the care billing allowance.
  compute:
  - rc_held_now: DAYS(F('start_date'), NOW)
  - rc_review_last: >-
      ((rc_held_now // P('review_interval_days')) + 1) * P('review_interval_days') - rc_held_now + P('review_overdue_days')
  - rc_income_room: >-
      DAYS(NOW, LATEST('hardship_hold_events', 'due_date', event_type='hardship_documentation_requested',
      document_type='income_loss_evidence'))
  - rc_kept: >-
      COUNT('hardship_hold_events', event_type='hardship_review_recorded', review_outcome='continue_hold')
  - rc_package_days: >-
      rc_income_room if rc_kept >= 2 else (MX(rc_income_room, rc_review_last) if rc_kept == 1 else rc_review_last)
  - rc_cert_paper: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', document_type='medical_or_disability_certification',
      channel='mail') + COUNT('hardship_hold_events', event_type='hardship_documentation_received', document_type='medical_or_disability_certification',
      channel='fax')
  - rc_cert_electronic: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', document_type='medical_or_disability_certification',
      channel='online_portal') + COUNT('hardship_hold_events', event_type='hardship_documentation_received',
      document_type='medical_or_disability_certification', channel='email')
  - rc_route_days: >-
      K('cert_paper_days') if (rc_cert_paper >= 1 and rc_cert_electronic == 0) else (K('cert_mixed_days')
      if (rc_cert_paper >= 1 and rc_cert_electronic >= 1) else 0)
  - rc_recent_medical: EXISTS('account', debt_type='medical', status='validation_period')
  - rc_has_medical: EXISTS('account', debt_type='medical')
  - rc_care_days: >-
      K('recent_care_days') if rc_recent_medical else (K('older_care_days') if rc_has_medical else 0)
  - rc_cert_age: >-
      DAYS(LATEST('hardship_hold_events', 'event_date', event_type='hardship_documentation_received',
      document_type='medical_or_disability_certification'), NOW)
  - rc_age_days: >-
      K('stale_cert_allowance_days') if rc_cert_age >= K('stale_cert_days') else (K('aging_cert_allowance_days')
      if rc_cert_age >= K('aging_cert_days') else 0)
  - rc_end_room: DAYS(NOW, F('end_date'))
  - result: MN(rc_package_days + rc_route_days + rc_care_days + rc_age_days, rc_end_room)
  compute_basis:
    rc_held_now: >-
      For the recertification, a status review falling due on the day of the request counts as already
      fallen due, so the review the recertification is for is the following one.
    rc_review_last: >-
      the days allowed for the recertification run from the day of the request to the due date of the
      status review that next falls due, reviews falling due every review interval counted from the hold's
      start date, plus the tier's review overdue days.
    rc_income_room: >-
      the recertification is due on the due date of the latest income records request on the hold
    rc_kept: where two or more reviews on the hold were recorded as continuing it
    rc_package_days: >-
      where two or more reviews on the hold were recorded as continuing it, the recertification is due
      on the due date of the latest income records request on the hold, so that both arrive as one review
      package; where exactly one review was recorded as continuing the hold, it is due on the later of
      that income records due date and the last day of the review's overdue window; where no review has
      yet been recorded as continuing the hold, it is due on the last day of the review's overdue window.
    rc_cert_paper: >-
      where at least one arrived by mail or fax and none by the online portal or email, the certification
      paper allowance is added
    rc_cert_electronic: >-
      where at least one arrived by mail or fax and at least one by the online portal or email, the certification
      mixed allowance is added
    rc_route_days: >-
      The certification route allowance depends on how the physician's certifications on the hold have
      arrived: where at least one arrived by mail or fax and none by the online portal or email, the certification
      paper allowance is added; where at least one arrived by mail or fax and at least one by the online
      portal or email, the certification mixed allowance is added; otherwise none is added.
    rc_recent_medical: >-
      where at least one of the consumer's placed medical accounts is still in its validation period,
      the recent-care allowance is added
    rc_has_medical: >-
      where the consumer has placed medical accounts but none of them is still in its validation period,
      the older-care allowance is added
    rc_care_days: >-
      where at least one of the consumer's placed medical accounts is still in its validation period,
      the recent-care allowance is added; where the consumer has placed medical accounts but none of them
      is still in its validation period, the older-care allowance is added; where the consumer has no
      placed medical account, none is added.
    rc_cert_age: >-
      The certification age allowance depends on the calendar days since the latest physician's certification
      on the hold arrived
    rc_age_days: >-
      at least the stale-certification days adds the stale-certification allowance; at least the aging-certification
      days but fewer than the stale-certification days adds the aging-certification allowance; fewer adds
      nothing.
    rc_end_room: The recertification due date never falls after the hold's current end date.
    result: >-
      Three allowances are then added to that count, each once, and the cap to the hold's current end
      date is applied last, to the sum.
  factors:
  - id: rc_review_package
    effect: method
    decides: rc_package_days
    bindings:
    - rc_income_room
    - rc_kept
    - rc_package_days
    ladder:
    - when: two or more reviews on the hold were recorded as continuing it
      method: >-
        the recertification is due on the due date of the latest income records request on the hold
    - when: exactly one review was recorded as continuing the hold
      method: >-
        the recertification is due on the later of that income records due date and the last day of the
        review's overdue window
    - when: otherwise (no review yet recorded as continuing the hold)
      method: the recertification is due on the last day of the review's overdue window
    baseline:
      rc_package_days: rc_review_last
    evidence:
    - history
    cross_difficulty: null
  - id: rc_certification_route
    effect: parameter
    decides: rc_route_days
    bindings:
    - rc_cert_paper
    - rc_cert_electronic
    - rc_route_days
    ladder:
    - when: >-
        at least one physician's certification on the hold arrived by mail or fax and none by the online
        portal or email
      value: K('cert_paper_days')
    - when: at least one arrived by mail or fax and at least one by the online portal or email
      value: K('cert_mixed_days')
    - when: otherwise
      value: '0'
    baseline:
      rc_route_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rc_care_billing
    effect: parameter
    decides: rc_care_days
    bindings:
    - rc_recent_medical
    - rc_has_medical
    - rc_care_days
    ladder:
    - when: at least one of the consumer's placed medical accounts is still in its validation period
      value: K('recent_care_days')
    - when: the consumer has placed medical accounts but none is still in its validation period
      value: K('older_care_days')
    - when: otherwise (no placed medical account)
      value: '0'
    baseline:
      rc_care_days: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: rc_certification_age
    effect: parameter
    decides: rc_age_days
    bindings:
    - rc_cert_age
    - rc_age_days
    ladder:
    - when: >-
        at least the stale-certification days have passed since the latest physician's certification on
        the hold arrived
      value: K('stale_cert_allowance_days')
    - when: >-
        at least the aging-certification days but fewer than the stale-certification days have passed
      value: K('aging_cert_allowance_days')
    - when: otherwise
      value: '0'
    baseline:
      rc_age_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The recertification is due on the last day of the upcoming status review's overdue window: the days
      allowed for the recertification run from the day of the request to the due date of the status review
      that next falls due, reviews falling due every review interval counted from the hold's start date,
      plus the tier's review overdue days. The recertification due date never falls after the hold's current
      end date. The days allowed for the recertification are a whole number of calendar days and are not
      rounded.
    params:
    - review_interval_days
    - review_overdue_days
  inputs:
    history:
    - table: hardship_hold_events
      aggregate: latest
      field: due_date
      filters:
        event_type: hardship_documentation_requested
        document_type: income_loss_evidence
    - table: hardship_hold_events
      aggregate: count
      field: review_outcome
      filters:
        event_type: hardship_review_recorded
    - table: hardship_hold_events
      aggregate: count
      field: channel
      filters:
        event_type: hardship_documentation_received
        document_type: medical_or_disability_certification
    cross_category:
    - account
- id: hardship_ext_service_extension
  base_policy_refs:
  - hardship_evt_extension
  - hardship_evt_review
  - hardship_agg_consumer_level
  - hardship_evt_end
  overwrite:
  - base_policy: hardship_evt_extension
    superseded_clause: >-
      A running hold may be extended at the consumer's request up to the tier's max_extensions times,
      each extension adding extension_days calendar days to end_date.
    replaced_by: >-
      A running Military Service Hold may be extended up to the tier's maximum number of extensions, each
      extension adding the days the service extension adds, as worked out below, to the hold's end date;
      a running Long-Term Hardship Hold is extended under its own extension rule, and a running hold of
      any other tier may be extended at the consumer's request up to the tier's maximum number of extensions,
      each extension adding the tier's extension days to its end date.
  - base_policy: hardship_evt_extension
    superseded_clause: >-
      The hold's current end date is start_date plus initial_hold_days plus extension_days for each extension
      already granted, minus 1, counted in calendar days with the last day included.
    replaced_by: >-
      For a Military Service Hold, as for a hold of every other tier, the hold's current end date is the
      end date on record: start_date plus initial_hold_days minus 1, plus the days each extension already
      granted added, counted in calendar days with the last day included, and the hold completes its term
      on that date.
  - base_policy: hardship_evt_end
    superseded_clause: >-
      The hold's current end date is start_date plus initial_hold_days plus extension_days for each extension
      granted, minus 1, counted in calendar days.
    replaced_by: >-
      For a Military Service Hold, as for a hold of every other tier, the hold's current end date is the
      end date on record: start_date plus initial_hold_days minus 1, plus the days each extension already
      granted added, counted in calendar days with the last day included, and the hold completes its term
      on that date.
  - base_policy: hardship_evt_extension
    superseded_clause: It is decided within extension_decision_sla_business_days business days.
    replaced_by: >-
      The servicemember's own booking through the portal is the decision on a Military Service Hold extension
      and takes effect the day it is made; a Long-Term Hardship Hold extension is decided under its own
      extension rule, and an extension of a hold of any other tier is decided within the tier's extension
      decision days, counted as business days.
  trigger: on_request
  subject:
  - hardship_extension_granted
  - hardship_hold_extended
  computes: extension_days
  target_tool: extend_service_hold_a0a57648
  params:
    penultimate_carry_days: 15
    legal_protection_days: 30
    late_stage_protection_days: 15
    steady_payer_usd: 300.0
    steady_payer_cut_days: 30
    part_payer_cut_days: 15
    new_placements_many: 2
    many_new_placement_days: 30
    one_new_placement_days: 15
  rule: >-
    A running Military Service Hold may be extended up to the tier's maximum number of extensions, each
    extension adding the days the service extension adds, as worked out below, to the hold's end date;
    a running Long-Term Hardship Hold is extended under its own extension rule, and a running hold of
    any other tier may be extended at the consumer's request up to the tier's maximum number of extensions,
    each extension adding the tier's extension days to its end date. Because the protection rests on the
    servicemember's own active-duty orders, the extension is the servicemember's own election: once updated
    orders are on record and the request falls inside the tier's extension window, the servicemember books
    it in person through the self-service portal, and the desk tells the servicemember the days the service
    extension adds. The days the service extension adds are the tier's extension days, counted from the
    day after the hold's current end date. For a Military Service Hold, as for a hold of every other tier,
    the hold's current end date is the end date on record: start_date plus initial_hold_days minus 1,
    plus the days each extension already granted added, counted in calendar days with the last day included,
    and the hold completes its term on that date. The servicemember's own booking through the portal is
    the decision on a Military Service Hold extension and takes effect the day it is made; a Long-Term
    Hardship Hold extension is decided under its own extension rule, and an extension of a hold of any
    other tier is decided within the tier's extension decision days, counted as business days. Five rules
    adjust that figure, each applied once to the same sum: the anchor shift, the carry and the stage protection
    are added, the payment cut is subtracted and the new-placement allowance is added. The anchor of a
    service extension depends on the status review that next falls due after the current end date, reviews
    falling due every review interval counted from the hold's start date and a review falling due on the
    current end date itself counting as one inside the hold: where that review falls due no more than
    the tier's review overdue days after the current end date and every review that has fallen due by
    today was recorded as continuing the hold, the service extension is counted from the last day of that
    review's overdue window, adding the days from the current end date to that review's due date plus
    the review overdue days; where that review falls due within the same period but fewer reviews were
    recorded as continuing the hold than have fallen due, it is counted from that review's due date, adding
    the days from the current end date to that due date; otherwise it is counted from the day after the
    current end date and adds nothing. The carry of a service extension depends on how many further extensions
    the tier will still allow once this one is booked, counting the extensions already granted on the
    hold: none further adds the tier's post-service protection days, so that the last extension also covers
    the period after active duty ends; exactly one further adds the penultimate carry; two or more further
    add nothing. The stage protection of a service extension depends on the held account's placement stage:
    Legal Review Placement adds the legal protection days, because a stay of any proceedings rests on
    the protection staying in place; Tertiary Placement or Warehouse Placement adds the late-stage protection
    days; any other stage adds nothing. The payment cut of a service extension depends on the servicemember's
    net voluntary payments on the held account in the last six months, meaning payments posted less payments
    returned, each dated less than six whole months before today, whole months being the difference in
    calendar months between the date and today, less one when today's day of the month is smaller than
    the date's day of the month: at least the steady-payer amount cuts the steady-payer days; above zero
    but below that amount cuts the part-payer days; none cuts nothing. The new-placement allowance of
    a service extension depends on the servicemember's accounts placed with Ridgeline less than two whole
    months before today, whole months being the difference in calendar months between the date and today,
    less one when today's day of the month is smaller than the date's day of the month: at least the many-placements
    count adds the many-placement days; exactly one adds the one-placement days; none adds nothing. The
    allowance keeps the running protection from lapsing while a newly placed account's own request is
    still being documented. The days the service extension adds are a whole number of calendar days and
    are not rounded.
  prerequisite: []
  cross_category:
  - category: account
    as: history
    reads:
    - variant_name
    - account_transactions.amount
    - account_transactions.event_type
    note: >-
      The held account's stage, its payments and returns, and the servicemember's recent placements decide
      the stage protection, payment cut and new-placement allowance.
  compute:
  - sx_held: DAYS(F('start_date'), F('end_date'))
  - sx_review_gap: ((sx_held // P('review_interval_days')) + 1) * P('review_interval_days') - sx_held
  - sx_reviews_due: DAYS(F('start_date'), NOW) // P('review_interval_days')
  - sx_reviews_kept: >-
      COUNT('hardship_hold_events', event_type='hardship_review_recorded', review_outcome='continue_hold')
  - sx_anchor_days: >-
      (sx_review_gap + P('review_overdue_days')) if (sx_review_gap <= P('review_overdue_days') and sx_reviews_kept
      >= sx_reviews_due) else (sx_review_gap if (sx_review_gap <= P('review_overdue_days') and sx_reviews_kept
      < sx_reviews_due) else 0)
  - sx_left_after: >-
      P('max_extensions') - COUNT('hardship_hold_events', event_type='hardship_extension_granted') - 1
  - sx_carry_days: >-
      P('post_service_protection_days') if sx_left_after == 0 else (K('penultimate_carry_days') if sx_left_after
      == 1 else 0)
  - sx_stage: CFIELD('account', 'variant_name', account_id=F('account_id'))
  - sx_stage_days: >-
      K('legal_protection_days') if sx_stage == 'Legal Review Placement' else (K('late_stage_protection_days')
      if (sx_stage == 'Tertiary Placement' or sx_stage == 'Warehouse Placement') else 0)
  - sx_net_paid: >-
      XSUM('account', 'account_transactions', 'amount', account_id=F('account_id'), event_type='account_payment_posted',
      within_months=6, date_field='txn_date') - XSUM('account', 'account_transactions', 'amount', account_id=F('account_id'),
      event_type='account_payment_returned', within_months=6, date_field='txn_date')
  - sx_pay_cut: >-
      K('steady_payer_cut_days') if sx_net_paid >= K('steady_payer_usd') else (K('part_payer_cut_days')
      if sx_net_paid > 0 else 0)
  - sx_new_placements: >-
      XCOUNT('account', 'account_transactions', event_type='account_balance_placed', within_months=2,
      date_field='txn_date')
  - sx_placement_days: >-
      K('many_new_placement_days') if sx_new_placements >= K('new_placements_many') else (K('one_new_placement_days')
      if sx_new_placements == 1 else 0)
  - result: >-
      P('extension_days') + sx_anchor_days + sx_carry_days + sx_stage_days - sx_pay_cut + sx_placement_days
  compute_basis:
    sx_held: >-
      For a Military Service Hold, as for a hold of every other tier, the hold's current end date is the
      end date on record: start_date plus initial_hold_days minus 1, plus the days each extension already
      granted added, counted in calendar days with the last day included, and the hold completes its term
      on that date.
    sx_review_gap: >-
      The anchor of a service extension depends on the status review that next falls due after the current
      end date, reviews falling due every review interval counted from the hold's start date and a review
      falling due on the current end date itself counting as one inside the hold
    sx_reviews_due: every review that has fallen due by today was recorded as continuing the hold
    sx_reviews_kept: fewer reviews were recorded as continuing the hold than have fallen due
    sx_anchor_days: >-
      where that review falls due no more than the tier's review overdue days after the current end date
      and every review that has fallen due by today was recorded as continuing the hold, the service extension
      is counted from the last day of that review's overdue window, adding the days from the current end
      date to that review's due date plus the review overdue days; where that review falls due within
      the same period but fewer reviews were recorded as continuing the hold than have fallen due, it
      is counted from that review's due date, adding the days from the current end date to that due date;
      otherwise it is counted from the day after the current end date and adds nothing.
    sx_left_after: >-
      The carry of a service extension depends on how many further extensions the tier will still allow
      once this one is booked, counting the extensions already granted on the hold
    sx_carry_days: >-
      none further adds the tier's post-service protection days, so that the last extension also covers
      the period after active duty ends; exactly one further adds the penultimate carry; two or more further
      add nothing.
    sx_stage: The stage protection of a service extension depends on the held account's placement stage
    sx_stage_days: >-
      Legal Review Placement adds the legal protection days, because a stay of any proceedings rests on
      the protection staying in place; Tertiary Placement or Warehouse Placement adds the late-stage protection
      days; any other stage adds nothing.
    sx_net_paid: >-
      The payment cut of a service extension depends on the servicemember's net voluntary payments on
      the held account in the last six months, meaning payments posted less payments returned, each dated
      less than six whole months before today, whole months being the difference in calendar months between
      the date and today, less one when today's day of the month is smaller than the date's day of the
      month
    sx_pay_cut: >-
      at least the steady-payer amount cuts the steady-payer days; above zero but below that amount cuts
      the part-payer days; none cuts nothing.
    sx_new_placements: >-
      The new-placement allowance of a service extension depends on the servicemember's accounts placed
      with Ridgeline less than two whole months before today, whole months being the difference in calendar
      months between the date and today, less one when today's day of the month is smaller than the date's
      day of the month
    sx_placement_days: >-
      at least the many-placements count adds the many-placement days; exactly one adds the one-placement
      days; none adds nothing.
    result: >-
      Five rules adjust that figure, each applied once to the same sum: the anchor shift, the carry and
      the stage protection are added, the payment cut is subtracted and the new-placement allowance is
      added.
  factors:
  - id: sx_review_anchor
    effect: method
    decides: sx_anchor_days
    bindings:
    - sx_held
    - sx_review_gap
    - sx_reviews_due
    - sx_reviews_kept
    - sx_anchor_days
    ladder:
    - when: >-
        the next status review falls due no more than the review overdue days after the current end date
        and every review fallen due by today was recorded as continuing the hold
      method: the service extension is counted from the last day of that review's overdue window
    - when: >-
        the next status review falls due within that period and fewer reviews were recorded as continuing
        than have fallen due
      method: the service extension is counted from that review's due date
    - when: otherwise
      method: the service extension is counted from the day after the current end date
    baseline:
      sx_anchor_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: sx_carry
    effect: parameter
    decides: sx_carry_days
    bindings:
    - sx_left_after
    - sx_carry_days
    ladder:
    - when: no further extension will remain once this one is booked
      value: P('post_service_protection_days')
    - when: exactly one further extension will remain
      value: K('penultimate_carry_days')
    - when: otherwise (two or more remain)
      value: '0'
    baseline:
      sx_carry_days: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: sx_stage_protection
    effect: parameter
    decides: sx_stage_days
    bindings:
    - sx_stage
    - sx_stage_days
    ladder:
    - when: the held account is at Legal Review Placement
      value: K('legal_protection_days')
    - when: the held account is at Tertiary Placement or Warehouse Placement
      value: K('late_stage_protection_days')
    - when: otherwise
      value: '0'
    baseline:
      sx_stage_days: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: sx_payment_cut
    effect: parameter
    decides: sx_pay_cut
    bindings:
    - sx_net_paid
    - sx_pay_cut
    ladder:
    - when: >-
        net voluntary payments on the held account dated less than six whole months before today reach
        the steady-payer amount
      value: K('steady_payer_cut_days')
    - when: net voluntary payments in that period are above zero but below the steady-payer amount
      value: K('part_payer_cut_days')
    - when: otherwise
      value: '0'
    baseline:
      sx_pay_cut: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  - id: sx_new_placement
    effect: parameter
    decides: sx_placement_days
    bindings:
    - sx_new_placements
    - sx_placement_days
    ladder:
    - when: >-
        at least the many-placements count of the servicemember's accounts were placed less than two whole
        months before today
      value: K('many_new_placement_days')
    - when: exactly one account was placed in that period
      value: K('one_new_placement_days')
    - when: otherwise
      value: '0'
    baseline:
      sx_placement_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  baseline:
    rule: >-
      The days the service extension adds are the tier's extension days, counted from the day after the
      hold's current end date. The days the service extension adds are a whole number of calendar days
      and are not rounded.
    params:
    - extension_days
  inputs:
    history:
    - table: hardship_hold_events
      aggregate: count
      field: review_outcome
      filters:
        event_type: hardship_review_recorded
    - table: hardship_hold_events
      aggregate: count
      field: extension_number
      filters:
        event_type: hardship_extension_granted
    - category: account
      table: account_transactions
      aggregate: sum
      field: amount
      within_months: 6
      filters:
        event_type: account_payment_posted
    - category: account
      table: account_transactions
      aggregate: count
      field: amount
      within_months: 2
      filters:
        event_type: account_balance_placed
    cross_category:
    - account
- id: hardship_ext_service_review_proof
  base_policy_refs:
  - hardship_evt_documentation
  - hardship_evt_review
  - hardship_agg_consumer_level
  overwrite: []
  trigger: state_due
  subject:
  - hardship_documentation_requested
  computes: due_in_days
  target_tool: request_service_review_proof_12b8aafa
  params:
    short_notice_days: 7
    proof_paper_days: 10
    proof_mixed_days: 5
    repeat_extension_count: 2
    repeat_extension_days: 10
    single_extension_days: 5
    steady_review_count: 3
    steady_review_days: 7
    early_review_days: 3
    legal_cut_days: 10
    late_stage_cut_days: 5
    placements_many: 2
    many_placement_proof_days: 7
    one_placement_proof_days: 4
  rule: >-
    Before each status review of a running Military Service Hold, Ridgeline asks the servicemember for
    current proof of active military duty, because the review continues the hold only while active duty
    is shown to continue. The status review proof request is not sent until every undecided Military Service
    Hold request of the servicemember carries its initial documentation request, so that one set of orders
    answers all of them. Before the status review proof due date is worked out, the hold's end date on
    record must already lie beyond that review's due date. The status review proof is due on the last
    day of the upcoming review's overdue window: the days allowed for the status review proof run from
    the day of the request to the due date of the status review that next falls due, reviews falling due
    every review interval counted from the hold's start date, plus the tier's review overdue days. The
    status review proof due date never falls after the hold's current end date. For the status review
    proof, a review falling due on the day of the request counts as already fallen due, so the review
    the proof is for is the following one. The point the status review proof due date is counted from
    depends on how soon the review falls due: where it falls due within the short-notice days of the request,
    the proof is due the tier's documentation days after the request; where it falls due later than the
    short-notice days but no later than the tier's review overdue days after the request, the proof is
    due the tier's documentation days plus the tier's decision days, the decision days counted here as
    calendar days, after the review's due date; otherwise it is due on the last day of the review's overdue
    window. Five adjustments then apply to that count, each once: the proof mailing, extension-history,
    review-record and new-placement allowances are added and the proof stage cut is subtracted, and the
    cap to the hold's current end date is applied last, to the adjusted count. The proof mailing allowance
    depends on how documentation on the hold has arrived: where at least one submission arrived by mail
    or fax and none by the online portal or email, the proof paper allowance is added; where at least
    one arrived by mail or fax and at least one by the online portal or email, the proof mixed allowance
    is added; otherwise none is added. The extension-history allowance of the status review proof depends
    on the extensions recorded on the hold: at least the repeat-extension count adds the repeat-extension
    days, since repeatedly extended orders usually mean a deployment that slows any proof; exactly one
    adds the single-extension days; none adds nothing. The review-record allowance of the status review
    proof depends on the reviews recorded as continuing the hold: where every review that has fallen due
    by today was recorded as continuing it and they number at least the steady-review count, the steady-review
    days are added; where every fallen-due review was recorded as continuing it but they number fewer
    than that count, the early-review days are added; where fewer reviews were recorded as continuing
    the hold than have fallen due, nothing is added. The proof stage cut depends on the held account's
    placement stage: Legal Review Placement cuts the legal cut days, because any stay of proceedings needs
    current proof; Tertiary Placement or Warehouse Placement cuts the late-stage cut days; any other stage
    cuts nothing. The new-placement allowance of the status review proof depends on the servicemember's
    accounts placed with Ridgeline less than two whole months before today, whole months being the difference
    in calendar months between the date and today, less one when today's day of the month is smaller than
    the date's day of the month: at least the placements-many count adds the many-placement proof days;
    exactly one adds the one-placement proof days; none adds nothing. The days allowed for the status
    review proof are a whole number of calendar days and are not rounded.
  prerequisite:
  - problem: hardship_ext_service_extension
    kind: value_input
    gate: sv_end_room
    form: state
    policy_source: >-
      Before the status review proof due date is worked out, the hold's end date on record must already
      lie beyond that review's due date.
    condition: >-
      The running Military Service Hold's end date on record is later than the due date of the status
      review that next falls due.
    resolved_by: extend_service_hold_a0a57648
    effect: >-
      The days left before the hold's current end date grow from the days before the old end date to the
      days before the extended end date, so the cap stops binding, and the extension-history allowance
      reads one more recorded extension.
  - problem: hardship_ext_service_documentation
    kind: state_gate
    gate: hardship_hold_events.event_type
    form: state
    policy_source: >-
      The status review proof request is not sent until every undecided Military Service Hold request
      of the servicemember carries its initial documentation request, so that one set of orders answers
      all of them.
    condition: >-
      Every Military Service Hold request of the servicemember with status requested has at least one
      documentation request for active-duty status proof in its history.
    resolved_by: request_service_documentation_e72ed459
    effect: >-
      The undecided request gains its initial documentation request, which is the condition the status
      review proof request waits on.
  cross_category:
  - category: account
    as: history
    reads:
    - variant_name
    - account_transactions.event_type
    note: >-
      The held account's placement stage and the servicemember's recent placements decide the proof stage
      cut and the new-placement allowance.
  compute:
  - sv_held_now: DAYS(F('start_date'), NOW)
  - sv_review_in: ((sv_held_now // P('review_interval_days')) + 1) * P('review_interval_days') - sv_held_now
  - sv_count_days: >-
      P('documentation_due_days') if sv_review_in <= K('short_notice_days') else ((sv_review_in + P('documentation_due_days')
      + P('decision_sla_business_days')) if sv_review_in <= P('review_overdue_days') else (sv_review_in
      + P('review_overdue_days')))
  - sv_paper_n: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='mail') + COUNT('hardship_hold_events',
      event_type='hardship_documentation_received', channel='fax')
  - sv_electronic_n: >-
      COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='online_portal')
      + COUNT('hardship_hold_events', event_type='hardship_documentation_received', channel='email')
  - sv_mail_days: >-
      K('proof_paper_days') if (sv_paper_n >= 1 and sv_electronic_n == 0) else (K('proof_mixed_days')
      if (sv_paper_n >= 1 and sv_electronic_n >= 1) else 0)
  - sv_extensions: COUNT('hardship_hold_events', event_type='hardship_extension_granted')
  - sv_depth_days: >-
      K('repeat_extension_days') if sv_extensions >= K('repeat_extension_count') else (K('single_extension_days')
      if sv_extensions == 1 else 0)
  - sv_reviews_due: sv_held_now // P('review_interval_days')
  - sv_reviews_kept: >-
      COUNT('hardship_hold_events', event_type='hardship_review_recorded', review_outcome='continue_hold')
  - sv_record_days: >-
      K('steady_review_days') if (sv_reviews_kept >= sv_reviews_due and sv_reviews_kept >= K('steady_review_count'))
      else (K('early_review_days') if (sv_reviews_kept >= sv_reviews_due and sv_reviews_kept < K('steady_review_count'))
      else 0)
  - sv_stage: CFIELD('account', 'variant_name', account_id=F('account_id'))
  - sv_stage_cut: >-
      K('legal_cut_days') if sv_stage == 'Legal Review Placement' else (K('late_stage_cut_days') if (sv_stage
      == 'Tertiary Placement' or sv_stage == 'Warehouse Placement') else 0)
  - sv_new_placements: >-
      XCOUNT('account', 'account_transactions', event_type='account_balance_placed', within_months=2,
      date_field='txn_date')
  - sv_new_days: >-
      K('many_placement_proof_days') if sv_new_placements >= K('placements_many') else (K('one_placement_proof_days')
      if sv_new_placements == 1 else 0)
  - sv_end_room: DAYS(NOW, F('end_date'))
  - result: >-
      MN(sv_count_days + sv_mail_days + sv_depth_days + sv_record_days - sv_stage_cut + sv_new_days, sv_end_room)
  compute_basis:
    sv_held_now: >-
      For the status review proof, a review falling due on the day of the request counts as already fallen
      due, so the review the proof is for is the following one.
    sv_review_in: >-
      the days allowed for the status review proof run from the day of the request to the due date of
      the status review that next falls due, reviews falling due every review interval counted from the
      hold's start date, plus the tier's review overdue days.
    sv_count_days: >-
      where it falls due within the short-notice days of the request, the proof is due the tier's documentation
      days after the request; where it falls due later than the short-notice days but no later than the
      tier's review overdue days after the request, the proof is due the tier's documentation days plus
      the tier's decision days, the decision days counted here as calendar days, after the review's due
      date; otherwise it is due on the last day of the review's overdue window.
    sv_paper_n: >-
      where at least one submission arrived by mail or fax and none by the online portal or email, the
      proof paper allowance is added
    sv_electronic_n: >-
      where at least one arrived by mail or fax and at least one by the online portal or email, the proof
      mixed allowance is added
    sv_mail_days: >-
      The proof mailing allowance depends on how documentation on the hold has arrived: where at least
      one submission arrived by mail or fax and none by the online portal or email, the proof paper allowance
      is added; where at least one arrived by mail or fax and at least one by the online portal or email,
      the proof mixed allowance is added; otherwise none is added.
    sv_extensions: >-
      The extension-history allowance of the status review proof depends on the extensions recorded on
      the hold
    sv_depth_days: >-
      at least the repeat-extension count adds the repeat-extension days, since repeatedly extended orders
      usually mean a deployment that slows any proof; exactly one adds the single-extension days; none
      adds nothing.
    sv_reviews_due: where every review that has fallen due by today was recorded as continuing it
    sv_reviews_kept: >-
      The review-record allowance of the status review proof depends on the reviews recorded as continuing
      the hold
    sv_record_days: >-
      where every review that has fallen due by today was recorded as continuing it and they number at
      least the steady-review count, the steady-review days are added; where every fallen-due review was
      recorded as continuing it but they number fewer than that count, the early-review days are added;
      where fewer reviews were recorded as continuing the hold than have fallen due, nothing is added.
    sv_stage: The proof stage cut depends on the held account's placement stage
    sv_stage_cut: >-
      Legal Review Placement cuts the legal cut days, because any stay of proceedings needs current proof;
      Tertiary Placement or Warehouse Placement cuts the late-stage cut days; any other stage cuts nothing.
    sv_new_placements: >-
      The new-placement allowance of the status review proof depends on the servicemember's accounts placed
      with Ridgeline less than two whole months before today, whole months being the difference in calendar
      months between the date and today, less one when today's day of the month is smaller than the date's
      day of the month
    sv_new_days: >-
      at least the placements-many count adds the many-placement proof days; exactly one adds the one-placement
      proof days; none adds nothing.
    sv_end_room: The status review proof due date never falls after the hold's current end date.
    result: >-
      Five adjustments then apply to that count, each once: the proof mailing, extension-history, review-record
      and new-placement allowances are added and the proof stage cut is subtracted, and the cap to the
      hold's current end date is applied last, to the adjusted count.
  factors:
  - id: sv_count_point
    effect: method
    decides: sv_count_days
    bindings:
    - sv_held_now
    - sv_review_in
    - sv_count_days
    ladder:
    - when: the next status review falls due within the short-notice days of the request
      method: the status review proof is due the tier's documentation days after the request
    - when: >-
        it falls due later than the short-notice days but no later than the tier's review overdue days
        after the request
      method: >-
        the status review proof is due the tier's documentation days plus the tier's decision days, counted
        as calendar days, after the review's due date
    - when: otherwise
      method: the status review proof is due on the last day of the review's overdue window
    baseline:
      sv_count_days: sv_review_in + P('review_overdue_days')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: sv_proof_mailing
    effect: parameter
    decides: sv_mail_days
    bindings:
    - sv_paper_n
    - sv_electronic_n
    - sv_mail_days
    ladder:
    - when: >-
        at least one submission on the hold arrived by mail or fax and none by the online portal or email
      value: K('proof_paper_days')
    - when: at least one arrived by mail or fax and at least one by the online portal or email
      value: K('proof_mixed_days')
    - when: otherwise
      value: '0'
    baseline:
      sv_mail_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: sv_extension_history
    effect: parameter
    decides: sv_depth_days
    bindings:
    - sv_extensions
    - sv_depth_days
    ladder:
    - when: at least the repeat-extension count of extensions are recorded on the hold
      value: K('repeat_extension_days')
    - when: exactly one extension is recorded
      value: K('single_extension_days')
    - when: otherwise
      value: '0'
    baseline:
      sv_depth_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: sv_review_record
    effect: parameter
    decides: sv_record_days
    bindings:
    - sv_reviews_due
    - sv_reviews_kept
    - sv_record_days
    ladder:
    - when: >-
        every review fallen due by today was recorded as continuing the hold and they number at least
        the steady-review count
      value: K('steady_review_days')
    - when: >-
        every fallen-due review was recorded as continuing the hold and they number fewer than the steady-review
        count
      value: K('early_review_days')
    - when: otherwise (fewer reviews continued than have fallen due)
      value: '0'
    baseline:
      sv_record_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: sv_stage_cut
    effect: parameter
    decides: sv_stage_cut
    bindings:
    - sv_stage
    - sv_stage_cut
    ladder:
    - when: the held account is at Legal Review Placement
      value: K('legal_cut_days')
    - when: the held account is at Tertiary Placement or Warehouse Placement
      value: K('late_stage_cut_days')
    - when: otherwise
      value: '0'
    baseline:
      sv_stage_cut: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: sv_new_placement
    effect: parameter
    decides: sv_new_days
    bindings:
    - sv_new_placements
    - sv_new_days
    ladder:
    - when: >-
        at least the placements-many count of the servicemember's accounts were placed less than two whole
        months before today
      value: K('many_placement_proof_days')
    - when: exactly one account was placed in that period
      value: K('one_placement_proof_days')
    - when: otherwise
      value: '0'
    baseline:
      sv_new_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  baseline:
    rule: >-
      The status review proof is due on the last day of the upcoming review's overdue window: the days
      allowed for the status review proof run from the day of the request to the due date of the status
      review that next falls due, reviews falling due every review interval counted from the hold's start
      date, plus the tier's review overdue days. The status review proof due date never falls after the
      hold's current end date. The days allowed for the status review proof are a whole number of calendar
      days and are not rounded.
    params:
    - review_interval_days
    - review_overdue_days
  inputs:
    history:
    - table: hardship_hold_events
      aggregate: count
      field: channel
      filters:
        event_type: hardship_documentation_received
    - table: hardship_hold_events
      aggregate: count
      field: extension_number
      filters:
        event_type: hardship_extension_granted
    - table: hardship_hold_events
      aggregate: count
      field: review_outcome
      filters:
        event_type: hardship_review_recorded
    - category: account
      table: account_transactions
      aggregate: count
      field: amount
      within_months: 2
      filters:
        event_type: account_balance_placed
    cross_category:
    - account
- id: hardship_ext_service_documentation
  base_policy_refs:
  - hardship_evt_documentation
  - hardship_agg_consumer_level
  overwrite:
  - base_policy: hardship_evt_documentation
    superseded_clause: >-
      For tiers whose documentation_required is true, Ridgeline asks for the tier's documentation_type
      on the request date with a due date documentation_due_days calendar days later, and accepts it only
      through the tier's documentation_channels.
    replaced_by: >-
      For a Military Service Hold request, Ridgeline asks for proof of active military duty with the initial
      documentation request, accepts it only through the tier's documentation channels, and sets its due
      date as worked out below; for a request of any other tier whose documentation is required, Ridgeline
      asks for the tier's documentation type on the request date with a due date the tier's documentation
      days later, and accepts it only through the tier's documentation channels.
  - base_policy: hardship_evt_documentation
    superseded_clause: >-
      The documentation period is the tier's documentation_due_days in calendar days, the day after request_date
      being day one.
    replaced_by: >-
      For a Military Service Hold request the documentation period runs to the due date set under this
      rule, that due date being its last day; for a request of any other tier it is the tier's documentation
      days counted from the day after the request date; in either case, once a cure notice stands on the
      request, it runs to the cure due date.
  trigger: state_due
  subject:
  - hardship_documentation_requested
  computes: due_in_days
  target_tool: request_service_documentation_e72ed459
  params:
    late_send_days: 7
    validation_open_days: 5
    recent_validation_window_days: 30
    recent_validation_days: 2
    short_term_days: 150
    standard_term_days: 365
    short_term_cut_days: 5
    standard_term_cut_days: 2
    mail_only_days: 7
    limited_contact_days: 3
  rule: >-
    For a Military Service Hold request, Ridgeline asks for proof of active military duty with the initial
    documentation request, accepts it only through the tier's documentation channels, and sets its due
    date as worked out below; for a request of any other tier whose documentation is required, Ridgeline
    asks for the tier's documentation type on the request date with a due date the tier's documentation
    days later, and accepts it only through the tier's documentation channels. The initial documentation
    request is owed on every undecided Military Service Hold request whose history shows no documentation
    request yet, including a request recorded for an account placed after the servicemember's earlier
    consumer-level request. The initial documentation is due the tier's documentation days after the request
    date: the days allowed for the initial service documentation run from the day the request letter is
    sent to that date. For a Military Service Hold request the documentation period runs to the due date
    set under this rule, that due date being its last day; for a request of any other tier it is the tier's
    documentation days counted from the day after the request date; in either case, once a cure notice
    stands on the request, it runs to the cure due date. The point the initial service documentation is
    counted from depends on how many calendar days after the request date the letter is sent: more than
    the late-send days after it, the documentation is due the tier's documentation days after the day
    the letter is sent; more than the tier's decision days, counted as calendar days, but no more than
    the late-send days after it, it is due that many decision days, again counted as calendar days, plus
    the tier's documentation days after the request date; otherwise it is due the tier's documentation
    days after the request date. Three adjustments then apply to that count, each once: the validation
    allowance and the contact-route allowance are added and the term cut is subtracted. The validation
    allowance of the initial service documentation depends on the requested account's validation period:
    where the account's status is still validation period and its validation period ends after today,
    the validation-open days are added; where its validation period ended no more than the recent-validation
    window ago, the recent-validation days are added; otherwise nothing is added. The term cut of the
    initial service documentation depends on the placement term length of the requested account's stage:
    a term of no more than the short-term days cuts the short-term cut; a term above that but no more
    than the standard-term days cuts the standard-term cut; a longer term cuts nothing. The contact-route
    allowance of the initial service documentation depends on the contact restrictions recorded on the
    servicemember's placed accounts: a recorded no-email restriction, which sends the letter by mail,
    adds the mail-only days; otherwise a recorded no-phone-calls or no-text-messages restriction adds
    the limited-contact days; no such restriction adds nothing. The days allowed for the initial service
    documentation are a whole number of calendar days and are not rounded.
  prerequisite: []
  cross_category:
  - category: account
    as: history
    reads:
    - status
    - validation_period_end_date
    - account_case_events.restriction_type
    note: >-
      The requested account's validation period and stage term, and the servicemember's recorded contact
      restrictions, decide the validation allowance, term cut and contact-route allowance.
  compute:
  - in_late: DAYS(F('request_date'), NOW)
  - in_anchor_days: >-
      P('documentation_due_days') if in_late > K('late_send_days') else ((P('decision_sla_business_days')
      + P('documentation_due_days') - in_late) if in_late > P('decision_sla_business_days') else (P('documentation_due_days')
      - in_late))
  - in_status: CFIELD('account', 'status', account_id=F('account_id'))
  - in_validation_gap: DAYS(NOW, CFIELD('account', 'validation_period_end_date', account_id=F('account_id')))
  - in_validation_days: >-
      K('validation_open_days') if (in_status == 'validation_period' and in_validation_gap > 0) else (K('recent_validation_days')
      if (in_validation_gap <= 0 and in_validation_gap >= -K('recent_validation_window_days')) else 0)
  - in_term_length: CPARAM('account', 'placement_term_days', account_id=F('account_id'))
  - in_term_cut: >-
      K('short_term_cut_days') if in_term_length <= K('short_term_days') else (K('standard_term_cut_days')
      if in_term_length <= K('standard_term_days') else 0)
  - in_no_email: >-
      XCOUNT('account', 'account_case_events', event_type='account_contact_restriction_recorded', restriction_type='no_email')
  - in_limited: >-
      XCOUNT('account', 'account_case_events', event_type='account_contact_restriction_recorded', restriction_type='no_phone_calls')
      + XCOUNT('account', 'account_case_events', event_type='account_contact_restriction_recorded', restriction_type='no_text_messages')
  - in_route_days: >-
      K('mail_only_days') if in_no_email >= 1 else (K('limited_contact_days') if in_limited >= 1 else
      0)
  - result: in_anchor_days + in_validation_days - in_term_cut + in_route_days
  compute_basis:
    in_late: >-
      The point the initial service documentation is counted from depends on how many calendar days after
      the request date the letter is sent
    in_anchor_days: >-
      more than the late-send days after it, the documentation is due the tier's documentation days after
      the day the letter is sent; more than the tier's decision days, counted as calendar days, but no
      more than the late-send days after it, it is due that many decision days, again counted as calendar
      days, plus the tier's documentation days after the request date; otherwise it is due the tier's
      documentation days after the request date.
    in_status: >-
      where the account's status is still validation period and its validation period ends after today,
      the validation-open days are added
    in_validation_gap: >-
      The validation allowance of the initial service documentation depends on the requested account's
      validation period
    in_validation_days: >-
      where the account's status is still validation period and its validation period ends after today,
      the validation-open days are added; where its validation period ended no more than the recent-validation
      window ago, the recent-validation days are added; otherwise nothing is added.
    in_term_length: >-
      The term cut of the initial service documentation depends on the placement term length of the requested
      account's stage
    in_term_cut: >-
      a term of no more than the short-term days cuts the short-term cut; a term above that but no more
      than the standard-term days cuts the standard-term cut; a longer term cuts nothing.
    in_no_email: a recorded no-email restriction, which sends the letter by mail, adds the mail-only days
    in_limited: >-
      otherwise a recorded no-phone-calls or no-text-messages restriction adds the limited-contact days
    in_route_days: >-
      The contact-route allowance of the initial service documentation depends on the contact restrictions
      recorded on the servicemember's placed accounts: a recorded no-email restriction, which sends the
      letter by mail, adds the mail-only days; otherwise a recorded no-phone-calls or no-text-messages
      restriction adds the limited-contact days; no such restriction adds nothing.
    result: >-
      Three adjustments then apply to that count, each once: the validation allowance and the contact-route
      allowance are added and the term cut is subtracted.
  factors:
  - id: in_send_anchor
    effect: method
    decides: in_anchor_days
    bindings:
    - in_late
    - in_anchor_days
    ladder:
    - when: the request letter is sent more than the late-send days after the request date
      method: >-
        the initial service documentation is due the tier's documentation days after the day the letter
        is sent
    - when: >-
        it is sent more than the tier's decision days, counted as calendar days, but no more than the
        late-send days after the request date
      method: >-
        it is due the tier's decision days, counted as calendar days, plus the tier's documentation days
        after the request date
    - when: otherwise
      method: it is due the tier's documentation days after the request date
    baseline:
      in_anchor_days: P('documentation_due_days') - in_late
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: in_validation
    effect: parameter
    decides: in_validation_days
    bindings:
    - in_status
    - in_validation_gap
    - in_validation_days
    ladder:
    - when: >-
        the requested account's status is still validation period and its validation period ends after
        today
      value: K('validation_open_days')
    - when: its validation period ended no more than the recent-validation window ago
      value: K('recent_validation_days')
    - when: otherwise
      value: '0'
    baseline:
      in_validation_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: account
  - id: in_term_length
    effect: parameter
    decides: in_term_cut
    bindings:
    - in_term_length
    - in_term_cut
    ladder:
    - when: the requested account's stage has a placement term of no more than the short-term days
      value: K('short_term_cut_days')
    - when: >-
        its stage has a placement term above the short-term days but no more than the standard-term days
      value: K('standard_term_cut_days')
    - when: otherwise
      value: '0'
    baseline:
      in_term_cut: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: account
  - id: in_contact_route
    effect: parameter
    decides: in_route_days
    bindings:
    - in_no_email
    - in_limited
    - in_route_days
    ladder:
    - when: a no-email contact restriction is recorded on the servicemember's placed accounts
      value: K('mail_only_days')
    - when: no no-email restriction, but a no-phone-calls or no-text-messages restriction is recorded
      value: K('limited_contact_days')
    - when: otherwise
      value: '0'
    baseline:
      in_route_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  baseline:
    rule: >-
      The initial documentation is due the tier's documentation days after the request date: the days
      allowed for the initial service documentation run from the day the request letter is sent to that
      date. The days allowed for the initial service documentation are a whole number of calendar days
      and are not rounded.
    params:
    - documentation_due_days
  inputs:
    history:
    - category: account
      table: account_case_events
      aggregate: count
      field: restriction_type
      filters:
        event_type: account_contact_restriction_recorded
    cross_category:
    - account
