events:
  # ---- holding writes (payment_plans) ----
  - type: plan_created
    target: payment_plans
    mutation: create
    meaning: Ridgeline sets up the terms of a payment arrangement on one placed account and sends them to the consumer for authorization.
    grain: one row per arrangement set up.
    fields:
      customer_id: The consumer who owes the account.
      account_id: The placed account the arrangement pays.
      variant_name: The arrangement type.
      created_date: The date the terms were set up.
      payment_frequency: Weekly, biweekly or monthly.
      installment_amount: The regular installment amount.
      installment_count: The number of installments, including any down payment.
      down_payment_amount: The down payment, due as installment number 0; 0.00 when none.
      schedule_anchor_date: The due date of the installment named in schedule_anchor_installment.
      schedule_anchor_installment: The installment number whose due date is schedule_anchor_date; 1 at creation.
      final_due_date: The due date of the final installment.
      funding_method: Automatic ACH debit, automatic card debit or manual payment.
      plan_total: The total scheduled, equal to the account's balance_due on the creation date.
      stated_net_monthly_income: The consumer's stated net monthly household income where the type requires a budget review; 0.00 otherwise.
    triggers:
      - event: plan:plan_total_scheduled
        map: {amount: plan_total, txn_date: created_date, account_id: account_id}
  - type: plan_authorized
    target: payment_plans
    mutation: {transition: {from: pending_authorization, to: active}}
    meaning: The consumer authorizes the schedule and the payment method and the arrangement starts.
    grain: one row per transaction.
    fields:
      authorization_date: The date the consumer authorized.
      authorization_method: Recorded telephone authorization or electronic signature.
    triggers:
      - event: account:account_arrangement_opened
  - type: plan_suspended
    target: payment_plans
    mutation: {transition: {from: active, to: suspended}}
    meaning: Installments stop because the account entered a dispute hold or a hardship hold.
    grain: one row per transaction.
    fields:
      suspended_date: The date the plan was suspended.
    triggers: []
  - type: plan_resumed
    target: payment_plans
    mutation: {transition: {from: suspended, to: active}}
    meaning: The hold that suspended the plan has ended and installments restart on a new schedule.
    grain: one row per transaction.
    fields:
      schedule_anchor_date: The due date of the first installment after resumption.
      schedule_anchor_installment: The number of the first unpaid installment.
      final_due_date: The new due date of the final installment.
    triggers: []
  - type: plan_broken
    target: payment_plans
    mutation: {transition: {from: active, to: broken}}
    meaning: Uncured missed installments reach the breakage count and the arrangement is broken.
    grain: one row per transaction.
    fields:
      broken_date: The date the plan was broken.
    triggers:
      - event: account:account_arrangement_closed
  - type: plan_reinstated
    target: payment_plans
    mutation: {transition: {from: broken, to: active}}
    meaning: The consumer cures a broken plan within the reinstatement window and it is reinstated.
    grain: one row per transaction.
    fields:
      reinstatement_count: The number of reinstatements so far, after this one.
    triggers:
      - event: account:account_arrangement_opened
  - type: plan_completed
    target: payment_plans
    mutation: {transition: {from: active, to: completed}}
    meaning: Every scheduled installment has been paid.
    grain: one row per transaction.
    fields:
      closed_date: The date the last installment was paid.
      close_reason: Always completed.
    triggers: []
  - type: plan_cancelled
    target: payment_plans
    mutation:
      transition:
        - {from: pending_authorization, to: cancelled}
        - {from: active, to: cancelled}
        - {from: suspended, to: cancelled}
        - {from: broken, to: cancelled}
    meaning: The arrangement ends unfinished.
    grain: one row per transaction.
    fields:
      closed_date: The date the plan was cancelled.
      close_reason: Why the plan was cancelled.
    triggers:
      - event: plan:plan_balance_released
        map: {txn_date: closed_date}
  - type: plan_schedule_updated
    target: payment_plans
    mutation: update
    meaning: The schedule on the plan record is rewritten after a recorded due-date change, restructure or deferral.
    grain: one row per transaction.
    fields:
      schedule_anchor_date: The new due date of the anchor installment.
      schedule_anchor_installment: The installment number the new anchor date applies to.
      installment_amount: The regular installment amount after the change.
      installment_count: The number of installments after the change.
      final_due_date: The due date of the final installment after the change.
    triggers: []
  - type: plan_funding_method_updated
    target: payment_plans
    mutation: update
    meaning: The plan record is rewritten with a new payment method after a recorded change of payment method.
    grain: one row per transaction.
    fields:
      funding_method: The new payment method.
      authorization_date: The date of the consumer's new authorization.
      authorization_method: How the new authorization was given.
    triggers: []
  # ---- ledger writes (plan_installments) ----
  - type: plan_total_scheduled
    target: plan_installments
    meaning: The plan total is booked to the arrangement when the plan is set up.
    grain: one row per plan.
    distinguish_by: [txn_date]
    fields:
      account_id: The placed account the plan pays.
      amount: The plan total.
      txn_date: The creation date.
    account: arrangement_balance
    direction: in
    triggers: []
  - type: plan_installment_paid
    target: plan_installments
    meaning: An installment, or a payment toward one, is received under the plan.
    grain: one row per installment payment received, identified by its processor confirmation.
    distinguish_by: [installment_number, payment_ref]
    fields:
      account_id: The placed account the plan pays.
      installment_number: The installment the payment is applied to; 0 for the down payment.
      due_date: The scheduled due date of that installment.
      amount: The amount received.
      txn_date: The date the funds were received.
      payment_channel: How the installment was paid.
      payment_ref: The processor confirmation number, verbatim.
    account: arrangement_balance
    direction: out
    triggers:
      - event: account:account_payment_posted
        map: {account_id: account_id, amount: amount, txn_date: txn_date, payment_channel: payment_channel, payment_ref: payment_ref, plan_id: plan_id}
  - type: plan_installment_returned
    target: plan_installments
    meaning: An installment payment is returned unpaid or charged back.
    grain: one row per returned installment payment, pointing to the original payment.
    distinguish_by: [source_plan_txn_id]
    fields:
      account_id: The placed account the plan pays.
      installment_number: The installment the returned payment had been applied to.
      amount: The returned amount, equal to the original payment.
      txn_date: The date the return was received.
      source_plan_txn_id: The plan_installment_paid row being returned.
      payment_channel: The channel of the original payment.
      return_reason: Why the payment was returned.
    account: arrangement_balance
    direction: in
    triggers:
      - event: account:account_payment_returned
        map: {account_id: account_id, amount: amount, txn_date: txn_date, payment_channel: payment_channel, return_reason: return_reason}
  - type: plan_balance_released
    target: plan_installments
    meaning: When a plan ends unfinished, the amount still scheduled under it is released; it stays owed on the account.
    grain: one row per cancelled plan.
    distinguish_by: [txn_date]
    fields:
      account_id: The placed account the plan paid.
      amount: The arrangement balance remaining at cancellation.
      txn_date: The cancellation date.
    account: arrangement_balance
    direction: out
    triggers: []
  # ---- plan records (plan_installments) ----
  - type: plan_installment_missed
    target: plan_installments
    meaning: An installment is not paid by the end of its grace period.
    grain: one row per missed installment.
    distinguish_by: [installment_number]
    fields:
      account_id: The placed account the plan pays.
      installment_number: The installment missed.
      due_date: Its scheduled due date.
      txn_date: The date it was recorded as missed.
    triggers: []
  - type: plan_schedule_change_recorded
    target: plan_installments
    meaning: A consumer-requested change to the plan's schedule or payment method is recorded.
    grain: one row per change requested and granted.
    distinguish_by: [change_type, txn_date]
    fields:
      account_id: The placed account the plan pays.
      change_type: Due-date change, restructure, deferral or payment-method change.
      txn_date: The date the change was granted.
      installment_number: The first installment affected by the change.
      due_date: The new due date of that installment.
      amount: The regular installment amount after the change; for a payment-method change, the unchanged installment amount.
      funding_method: For a payment-method change, the new method; for other changes, the unchanged method.
    triggers:
      - event: plan:plan_schedule_updated
        when: {change_type: [due_date_change, restructure, deferral]}
        map: {schedule_anchor_date: due_date, schedule_anchor_installment: installment_number, installment_amount: amount}
      - event: plan:plan_funding_method_updated
        when: {change_type: funding_method_change}
        map: {funding_method: funding_method}

measures:
  - id: plan_msr_changes_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of plan_schedule_change_recorded rows on the plan, counted separately for each change_type.
  - id: plan_msr_installments_paid
    window: The life of the plan, through the handling date.
    measure: Count of distinct installment_number values with plan_installment_paid rows totalling at least the scheduled installment less partial_payment_tolerance_usd, excluding payments that have a plan_installment_returned row pointing to them.
  - id: plan_msr_uncured_missed
    window: The life of the plan, through the handling date.
    measure: Count of plan_installment_missed rows whose installment_number has not since been paid in full (within partial_payment_tolerance_usd).
  - id: plan_msr_broken_plans_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of payment_plans rows on the same placed account cancelled with close_reason broken_not_reinstated, by closed_date.
  - id: plan_msr_consumer_monthly_installments
    window: State on the handling date.
    measure: Sum over the consumer's payment_plans rows in pending_authorization, active or suspended status of installment_amount times the periods per year of their payment_frequency divided by 12.
  - id: plan_msr_represent_attempts
    window: The life of the installment.
    measure: Count of plan_installment_returned rows for the same installment_number with payment_channel ach_bank_debit.

policies:
  - id: plan_agg_multi_holding
    subject: [plan_created]
    rule: >-
      A consumer may hold one payment arrangement per placed account and any number of
      arrangements across different placed accounts; one arrangement never covers more than one
      account. A new plan is set up only when no other plan on the same placed account is in
      pending_authorization, active, suspended or broken status. A consumer who wants new terms on
      an account whose plan is still open must first have that plan cancelled or completed; a
      broken plan is either reinstated or cancelled under the breakage rule before any new plan.
    eligibility:
      - id: one_open_plan_per_account
        applies_to: [plan_created]
        kind: dedup
        condition: A new plan is set up only when no other plan on the same placed account is in pending_authorization, active, suspended or broken status.
        evidence_fields: [payment_plans.account_id, payment_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.account_id]
          action_bindings:
            payment_plans.account_id: account_id
        dedup_contract:
          table: payment_plans
          mode: separate_record
          object_bindings: {account_id: account_id}
          duplicate_filters: {status: [pending_authorization, active, suspended, broken]}
          distinct_fields: [created_date]
    params:
      max_per_customer: null

  - id: plan_agg_combined_affordability
    subject: [plan_created, plan_schedule_change_recorded]
    rule: >-
      For plan types whose budget_review_required is true, the consumer's stated net monthly
      household income is taken and stored on the plan, and the test is applied across the
      consumer's whole portfolio of arrangements rather than to the new plan alone. Each plan's
      monthly-equivalent installment is its installment_amount multiplied by the periods per year
      of its payment_frequency (52 weekly, 26 biweekly, 12 monthly) and divided by 12. The new
      plan, or the restructured plan, is allowed only when plan_msr_consumer_monthly_installments,
      with the plan's own monthly-equivalent installment replacing any earlier amount for the same
      plan, is no more than affordability_max_pct_of_income percent of stated_net_monthly_income.
      When the test fails, the installment cannot be raised to fit and a longer plan type or a
      smaller installment within the type's minimums must be chosen; when no type passes, the
      consumer is offered a promise-to-pay or the hardship programme rather than an unaffordable
      plan. Plan types whose affordability_max_pct_of_income is 0.0 apply no affordability test,
      and their installments still count toward the portfolio total of any later tested plan.
    eligibility:
      - id: stated_income_taken
        applies_to: [plan_created]
        kind: caller_fact
        condition: For plan types whose budget_review_required is true, the consumer's stated net monthly household income is taken and stored on the plan, and the test is applied across the consumer's whole portfolio of arrangements rather than to the new plan alone.
        evidence_fields: [payment_plans.stated_net_monthly_income, payment_plans.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [payment_plans.customer_id]
          action_bindings:
            payment_plans.customer_id: customer_id
    params:
      periods_per_year: {weekly: 52, biweekly: 26, monthly: 12}
      per_tier:
        Promise-to-Pay Arrangement: {affordability_pct: =affordability_max_pct_of_income, budget_review: =budget_review_required}
        Short-Term Installment Plan: {affordability_pct: =affordability_max_pct_of_income, budget_review: =budget_review_required}
        Standard Installment Plan: {affordability_pct: =affordability_max_pct_of_income, budget_review: =budget_review_required}
        Extended Installment Plan: {affordability_pct: =affordability_max_pct_of_income, budget_review: =budget_review_required}
        Long-Term Installment Plan: {affordability_pct: =affordability_max_pct_of_income, budget_review: =budget_review_required}
        Hardship Reduced-Payment Plan: {affordability_pct: =affordability_max_pct_of_income, budget_review: =budget_review_required}
    formula:
      when_not: affordability_max_pct_of_income == 0.0
      monthly_equivalent_installment: round(installment_amount * periods_per_year / 12, 2)
      affordability_ceiling_usd: round(stated_net_monthly_income * affordability_max_pct_of_income / 100, 2)
      passes: plan_msr_consumer_monthly_installments + monthly_equivalent_installment <= affordability_ceiling_usd
    measures: [plan_msr_consumer_monthly_installments]

  - id: plan_eligibility_and_terms
    subject: [plan_created]
    rule: >-
      A plan is set up only on a placed account whose status is validation_period or active; an
      account still awaiting its validation notice, in dispute_hold or hardship_hold, already
      arranged or closed takes no new plan. The plan type must list the account's stage in its
      eligible_account_stages, and the account's balance_due must fall within the type's entry
      gate. The plan total equals the account's balance_due on the creation date; no interest or
      fee is added. A weekly schedule is offered only where weekly_allowed is true and a biweekly
      schedule only where biweekly_allowed is true; the number of installments, the down payment
      included, may not exceed max_installment_count nor the type's maximum for the chosen
      frequency. Any down payment is at least down_payment_required_pct percent of the plan total,
      is installment number 0 and falls due within down_payment_due_days calendar days after
      creation. The remaining total is divided evenly over the regular installments, each regular
      installment is rounded up to the type's installment_rounding_unit_usd, and the final
      installment is reduced to absorb the rounding. A regular installment may not be below the
      type's minimum for its frequency, and its monthly-equivalent amount may not be below
      min_installment_pct_of_balance percent of the plan total. The first regular installment
      falls due within max_days_to_first_installment calendar days after creation, the final
      installment within max_days_to_final_installment calendar days after creation, and a monthly
      due date never falls after the type's monthly_due_day_max day of the month. Installments are
      collected by automatic ACH debit, by automatic card debit only where card_autopay_allowed is
      true and the installment is no more than card_autopay_max_installment_usd, or manually only
      where manual_pay_allowed is true and autopay_required is false; a weekly schedule is
      collected by automatic debit wherever weekly_requires_autopay is true. A new plan of a type
      is set up only when the handling date is later than the cooling-off period counted from the
      closed_date of the most recent plan on the same account that was cancelled as
      broken_not_reinstated. The cooling-off period is the new type's broken_plan_cooling_off_days
      in calendar days, the day after that closed_date being day one. When
      plan_msr_broken_plans_12m has reached a type's broken_plans_limit_12_months, that type is no
      longer offered on the account.
    eligibility:
      - id: plan_account_status
        applies_to: [plan_created]
        kind: state
        condition: A plan is set up only on a placed account whose status is validation_period or active; an account still awaiting its validation notice, in dispute_hold or hardship_hold, already arranged or closed takes no new plan.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active]
      - id: broken_plan_cooling_off
        applies_to: [plan_created]
        kind: time
        condition: A new plan of a type is set up only when the handling date is later than the cooling-off period counted from the closed_date of the most recent plan on the same account that was cancelled as broken_not_reinstated.
        evidence_fields: [payment_plans.closed_date, payment_plans.close_reason, payment_plans.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.account_id]
          action_bindings:
            payment_plans.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the closed_date of the most recent plan on the same account that was cancelled as broken_not_reinstated
          anchor_source: payment_plans.closed_date
          relation: not_before
          duration_source: variants.broken_plan_cooling_off_days
          unit: calendar_days
          counting_rule: The cooling-off period is the new type's broken_plan_cooling_off_days in calendar days, the day after that closed_date being day one.
          boundary: exclusive
    params:
      per_tier:
        Promise-to-Pay Arrangement: {max_count: =max_installment_count, min_monthly: =min_installment_monthly_usd, min_pct: =min_installment_pct_of_balance, down_pct: =down_payment_required_pct, stages: =eligible_account_stages}
        Short-Term Installment Plan: {max_count: =max_installment_count, min_monthly: =min_installment_monthly_usd, min_pct: =min_installment_pct_of_balance, down_pct: =down_payment_required_pct, stages: =eligible_account_stages}
        Standard Installment Plan: {max_count: =max_installment_count, min_monthly: =min_installment_monthly_usd, min_pct: =min_installment_pct_of_balance, down_pct: =down_payment_required_pct, stages: =eligible_account_stages}
        Extended Installment Plan: {max_count: =max_installment_count, min_monthly: =min_installment_monthly_usd, min_pct: =min_installment_pct_of_balance, down_pct: =down_payment_required_pct, stages: =eligible_account_stages}
        Long-Term Installment Plan: {max_count: =max_installment_count, min_monthly: =min_installment_monthly_usd, min_pct: =min_installment_pct_of_balance, down_pct: =down_payment_required_pct, stages: =eligible_account_stages}
        Hardship Reduced-Payment Plan: {max_count: =max_installment_count, min_monthly: =min_installment_monthly_usd, min_pct: =min_installment_pct_of_balance, down_pct: =down_payment_required_pct, stages: =eligible_account_stages}
    formula:
      min_down_payment_usd: round(plan_total * down_payment_required_pct / 100, 2)
      min_monthly_equivalent_usd: round(plan_total * min_installment_pct_of_balance / 100, 2)
    measures: [plan_msr_broken_plans_12m]

  - id: plan_combo_settlement_and_hardship
    subject: [plan_created, plan_cancelled]
    rule: >-
      A payment plan and an accepted settlement never run on the same account. A plan is set up
      only when no settlement on the account has status accepted; an open settlement offer does not
      block a plan and stays open until it expires or is accepted. When a settlement on an account
      is accepted while a plan on that account is pending_authorization, active, suspended or
      broken, the plan is cancelled the same day with close_reason superseded_by_settlement, and
      installments already paid stay applied to the account. A Hardship Reduced-Payment Plan is
      set up only when the account's most recent hardship hold has status ended and its
      ended_date is no more than that hold tier's post_hold_hardship_window_days calendar days
      before the creation date, and that hold tier's hardship_plan_eligible_after_hold is true; a
      consumer whose hold is still active must first have the hold ended, and a consumer whose
      hold ended outside the window or under a tier that does not qualify takes an ordinary plan
      type instead. A plan is also cancelled, with close_reason account_returned, when its account
      is returned to the client, and with close_reason account_resolved_otherwise when the account
      becomes paid_in_full through payments outside the plan.
    eligibility:
      - id: no_accepted_settlement
        applies_to: [plan_created]
        kind: state
        condition: A plan is set up only when no settlement on the account has status accepted; an open settlement offer does not block a plan and stays open until it expires or is accepted.
        evidence_fields: [settlement_agreements.status, settlement_agreements.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.account_id]
          action_bindings:
            settlement_agreements.account_id: account_id
        state_contract:
          field: settlement_agreements.status
          allowed: [offered, expired, withdrawn, defaulted]
      - id: qualifying_hardship_hold
        applies_to: [plan_created]
        kind: state
        condition: A Hardship Reduced-Payment Plan is set up only when the account's most recent hardship hold has status ended and its ended_date is no more than that hold tier's post_hold_hardship_window_days calendar days before the creation date, and that hold tier's hardship_plan_eligible_after_hold is true; a consumer whose hold is still active must first have the hold ended, and a consumer whose hold ended outside the window or under a tier that does not qualify takes an ordinary plan type instead.
        evidence_fields: [hardship_holds.status, hardship_holds.ended_date, hardship_holds.variant_name, hardship_holds.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id]
          action_bindings:
            hardship_holds.account_id: account_id
        state_contract:
          field: hardship_holds.status
          allowed: [ended]

  - id: plan_evt_authorization
    subject: [plan_authorized, plan_cancelled]
    rule: >-
      A plan starts only on the consumer's own authorization of the schedule and the payment
      method; Ridgeline never debits on terms the consumer has not authorized. A plan is authorized
      only when the handling date is no later than the last day of the authorization window
      counted from the plan's created_date. The authorization window is the type's
      authorization_window_days in calendar days, the day after created_date being day one and the
      last day included. A recorded telephone authorization suffices only where the type's
      recorded_oral_authorization_allowed is true; elsewhere the consumer signs electronically. A
      plan still pending_authorization after the window is cancelled with close_reason
      authorization_lapsed, and a consumer who declines the terms has the plan cancelled with
      close_reason consumer_cancelled. A plan is authorized only while its status is
      pending_authorization.
    eligibility:
      - id: within_authorization_window
        applies_to: [plan_authorized]
        kind: time
        condition: A plan is authorized only when the handling date is no later than the last day of the authorization window counted from the plan's created_date.
        evidence_fields: [payment_plans.created_date, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.plan_id]
          action_bindings:
            payment_plans.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan's created_date
          anchor_source: payment_plans.created_date
          relation: not_after
          duration_source: variants.authorization_window_days
          unit: calendar_days
          counting_rule: The authorization window is the type's authorization_window_days in calendar days, the day after created_date being day one and the last day included.
          boundary: inclusive
    params:
      per_tier:
        Promise-to-Pay Arrangement: {window_days: =authorization_window_days, oral_ok: =recorded_oral_authorization_allowed}
        Short-Term Installment Plan: {window_days: =authorization_window_days, oral_ok: =recorded_oral_authorization_allowed}
        Standard Installment Plan: {window_days: =authorization_window_days, oral_ok: =recorded_oral_authorization_allowed}
        Extended Installment Plan: {window_days: =authorization_window_days, oral_ok: =recorded_oral_authorization_allowed}
        Long-Term Installment Plan: {window_days: =authorization_window_days, oral_ok: =recorded_oral_authorization_allowed}
        Hardship Reduced-Payment Plan: {window_days: =authorization_window_days, oral_ok: =recorded_oral_authorization_allowed}

  - id: plan_evt_installments
    subject: [plan_installment_paid, plan_installment_returned, plan_installment_missed]
    rule: >-
      The scheduled due date of installment n is schedule_anchor_date advanced by n minus
      schedule_anchor_installment periods: 7 calendar days per weekly period, 14 calendar days per
      biweekly period, and one calendar month per monthly period on the same day of the month.
      Installment payments are accepted only on a plan whose status is active, suspended or
      broken; a payment on a suspended plan is voluntary and a payment on a broken plan counts
      toward its cure. An installment counts as paid when the payments applied to it reach the
      installment amount less the type's partial_payment_tolerance_usd. A payment larger than the
      installment due is applied by the type's extra_payment_application: reduce_remaining_count
      applies the excess to the last installments so fewer remain, and advance_next_due applies it
      to the next installments in order so their due dates are already met. Manual installments may
      use any channel the account's stage accepts, except that the retail cash payment network is
      used only where cash_network_installments_allowed is true. An installment is recorded as
      missed only when the handling date is later than the grace period counted from the
      installment's scheduled due date and the installment is not paid. The grace period is
      grace_period_days_manual calendar days for a plan paid manually and grace_period_days_autopay
      calendar days for a plan collected by automatic debit, the day after the due date being day
      one. A returned installment payment is booked once against the payment it reverses. A
      returned ACH installment whose return_reason is nsf is presented again after
      represent_delay_business_days business days, at most ach_represent_max_attempts times per
      installment; returns for account_closed, stop_payment, unauthorized_debit and card_chargeback
      are never presented again. A missed installment is cured when it is later paid in full.
    eligibility:
      - id: installment_plan_status
        applies_to: [plan_installment_paid]
        kind: state
        condition: Installment payments are accepted only on a plan whose status is active, suspended or broken; a payment on a suspended plan is voluntary and a payment on a broken plan counts toward its cure.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.plan_id]
          action_bindings:
            payment_plans.plan_id: plan_id
        state_contract:
          field: payment_plans.status
          allowed: [active, suspended, broken]
      - id: grace_elapsed
        applies_to: [plan_installment_missed]
        kind: time
        condition: An installment is recorded as missed only when the handling date is later than the grace period counted from the installment's scheduled due date and the installment is not paid.
        evidence_fields: [payment_plans.schedule_anchor_date, payment_plans.schedule_anchor_installment, payment_plans.payment_frequency, payment_plans.funding_method, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.plan_id]
          action_bindings:
            payment_plans.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment's scheduled due date
          anchor_source: payment_plans.schedule_anchor_date
          relation: not_before
          duration_source: variants.grace_period_days_manual
          unit: calendar_days
          counting_rule: The grace period is grace_period_days_manual calendar days for a plan paid manually and grace_period_days_autopay calendar days for a plan collected by automatic debit, the day after the due date being day one.
          boundary: exclusive
      - id: one_return_per_installment_payment
        applies_to: [plan_installment_returned]
        kind: dedup
        condition: A returned installment payment is booked once against the payment it reverses.
        evidence_fields: [plan_installments.source_plan_txn_id, plan_installments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_installments.source_plan_txn_id]
          action_bindings:
            plan_installments.source_plan_txn_id: source_plan_txn_id
        dedup_contract:
          table: plan_installments
          mode: separate_record
          object_bindings: {source_plan_txn_id: source_plan_txn_id}
          duplicate_filters: {event_type: [plan_installment_returned]}
          distinct_fields: []
    params:
      period_days: {weekly: 7, biweekly: 14}
      per_tier:
        Promise-to-Pay Arrangement: {grace_manual: =grace_period_days_manual, grace_autopay: =grace_period_days_autopay, tolerance: =partial_payment_tolerance_usd, represent_max: =ach_represent_max_attempts, extra: =extra_payment_application}
        Short-Term Installment Plan: {grace_manual: =grace_period_days_manual, grace_autopay: =grace_period_days_autopay, tolerance: =partial_payment_tolerance_usd, represent_max: =ach_represent_max_attempts, extra: =extra_payment_application}
        Standard Installment Plan: {grace_manual: =grace_period_days_manual, grace_autopay: =grace_period_days_autopay, tolerance: =partial_payment_tolerance_usd, represent_max: =ach_represent_max_attempts, extra: =extra_payment_application}
        Extended Installment Plan: {grace_manual: =grace_period_days_manual, grace_autopay: =grace_period_days_autopay, tolerance: =partial_payment_tolerance_usd, represent_max: =ach_represent_max_attempts, extra: =extra_payment_application}
        Long-Term Installment Plan: {grace_manual: =grace_period_days_manual, grace_autopay: =grace_period_days_autopay, tolerance: =partial_payment_tolerance_usd, represent_max: =ach_represent_max_attempts, extra: =extra_payment_application}
        Hardship Reduced-Payment Plan: {grace_manual: =grace_period_days_manual, grace_autopay: =grace_period_days_autopay, tolerance: =partial_payment_tolerance_usd, represent_max: =ach_represent_max_attempts, extra: =extra_payment_application}
    measures: [plan_msr_represent_attempts, plan_msr_installments_paid]

  - id: plan_evt_breakage_and_reinstatement
    subject: [plan_broken, plan_reinstated, plan_cancelled]
    rule: >-
      A plan is broken on the day plan_msr_uncured_missed reaches the type's
      missed_installments_to_break, and the account returns from arranged to active. A broken plan
      may be reinstated only where the type's reinstatement_cure_requirement is not
      not_reinstatable, only while its reinstatement_count is below reinstatement_max_count, and
      only once the cure is paid: all_missed_installments requires every missed installment to be
      paid in full, one_installment requires one full regular installment paid after the break.
      A broken plan is reinstated only when the handling date is no later than the last day of the
      reinstatement window counted from the plan's broken_date. The reinstatement window is the
      type's reinstatement_window_days in calendar days, the day after broken_date being day one
      and the last day included. On reinstatement the remaining installments keep their original
      due dates, any installment whose due date has passed in the meantime and is not paid counts
      as missed again, and the account returns to arranged. A broken plan that is not reinstated
      by the end of the window, or whose type is not reinstatable, is cancelled with close_reason
      broken_not_reinstated on the first day after the window, and its remaining arrangement
      balance is released while staying owed on the account.
    eligibility:
      - id: within_reinstatement_window
        applies_to: [plan_reinstated]
        kind: time
        condition: A broken plan is reinstated only when the handling date is no later than the last day of the reinstatement window counted from the plan's broken_date.
        evidence_fields: [payment_plans.broken_date, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.plan_id]
          action_bindings:
            payment_plans.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan's broken_date
          anchor_source: payment_plans.broken_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: The reinstatement window is the type's reinstatement_window_days in calendar days, the day after broken_date being day one and the last day included.
          boundary: inclusive
    params:
      per_tier:
        Promise-to-Pay Arrangement: {break_count: =missed_installments_to_break, window_days: =reinstatement_window_days, max_reinstatements: =reinstatement_max_count, cure: =reinstatement_cure_requirement}
        Short-Term Installment Plan: {break_count: =missed_installments_to_break, window_days: =reinstatement_window_days, max_reinstatements: =reinstatement_max_count, cure: =reinstatement_cure_requirement}
        Standard Installment Plan: {break_count: =missed_installments_to_break, window_days: =reinstatement_window_days, max_reinstatements: =reinstatement_max_count, cure: =reinstatement_cure_requirement}
        Extended Installment Plan: {break_count: =missed_installments_to_break, window_days: =reinstatement_window_days, max_reinstatements: =reinstatement_max_count, cure: =reinstatement_cure_requirement}
        Long-Term Installment Plan: {break_count: =missed_installments_to_break, window_days: =reinstatement_window_days, max_reinstatements: =reinstatement_max_count, cure: =reinstatement_cure_requirement}
        Hardship Reduced-Payment Plan: {break_count: =missed_installments_to_break, window_days: =reinstatement_window_days, max_reinstatements: =reinstatement_max_count, cure: =reinstatement_cure_requirement}
    formula:
      is_broken: plan_msr_uncured_missed >= missed_installments_to_break
    measures: [plan_msr_uncured_missed]

  - id: plan_evt_schedule_changes
    subject: [plan_schedule_change_recorded, plan_schedule_updated, plan_funding_method_updated]
    rule: >-
      Consumers may ask to move a due date, restructure the installment, defer one installment or
      change the payment method, and each granted change is recorded once and then written to the
      plan record. Schedule and payment-method changes are granted only on a plan whose status is
      active. Each kind of change is limited per rolling 12 months by plan_msr_changes_12m against
      the type's due_date_change_max_per_12_months, restructure_max_per_12_months,
      deferral_max_per_12_months and funding_change_max_per_12_months. A due-date change moves the
      next unpaid installment by no more than due_date_change_max_shift_days calendar days in
      either direction, keeps a monthly due date on or before monthly_due_day_max, and shifts every
      later installment by the same schedule; it never skips an installment. A restructure is
      granted only after plan_msr_installments_paid reaches restructure_min_installments_paid; it
      re-spreads the current arrangement_balance over a new count of installments that, counted
      with those already paid, stays within the type's maximums, and the new installment must
      satisfy the type's minimums and, where budget_review_required is true, the combined
      affordability test. A deferral is granted only after plan_msr_installments_paid reaches
      deferral_min_installments_paid; it moves the next unpaid installment to one period after the
      current final installment, extending final_due_date by one period. A payment-method change
      must be a method the type allows and takes effect on the consumer's new authorization, given
      the same way as at set-up. A revocation of automatic debits stops a scheduled debit only when
      Ridgeline receives it at least stop_payment_notice_business_days business days before that
      debit's due date; a later revocation stops the following debits, and the plan continues on
      manual payment only where manual_pay_allowed is true, otherwise the consumer must authorize
      another automatic method before the next due date or the installment is handled as missed.
    eligibility:
      - id: change_on_active_plan
        applies_to: [plan_schedule_change_recorded]
        kind: state
        condition: Schedule and payment-method changes are granted only on a plan whose status is active.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.plan_id]
          action_bindings:
            payment_plans.plan_id: plan_id
        state_contract:
          field: payment_plans.status
          allowed: [active]
    params:
      per_tier:
        Promise-to-Pay Arrangement: {due_date_changes: =due_date_change_max_per_12_months, restructures: =restructure_max_per_12_months, deferrals: =deferral_max_per_12_months, funding_changes: =funding_change_max_per_12_months, max_shift: =due_date_change_max_shift_days}
        Short-Term Installment Plan: {due_date_changes: =due_date_change_max_per_12_months, restructures: =restructure_max_per_12_months, deferrals: =deferral_max_per_12_months, funding_changes: =funding_change_max_per_12_months, max_shift: =due_date_change_max_shift_days}
        Standard Installment Plan: {due_date_changes: =due_date_change_max_per_12_months, restructures: =restructure_max_per_12_months, deferrals: =deferral_max_per_12_months, funding_changes: =funding_change_max_per_12_months, max_shift: =due_date_change_max_shift_days}
        Extended Installment Plan: {due_date_changes: =due_date_change_max_per_12_months, restructures: =restructure_max_per_12_months, deferrals: =deferral_max_per_12_months, funding_changes: =funding_change_max_per_12_months, max_shift: =due_date_change_max_shift_days}
        Long-Term Installment Plan: {due_date_changes: =due_date_change_max_per_12_months, restructures: =restructure_max_per_12_months, deferrals: =deferral_max_per_12_months, funding_changes: =funding_change_max_per_12_months, max_shift: =due_date_change_max_shift_days}
        Hardship Reduced-Payment Plan: {due_date_changes: =due_date_change_max_per_12_months, restructures: =restructure_max_per_12_months, deferrals: =deferral_max_per_12_months, funding_changes: =funding_change_max_per_12_months, max_shift: =due_date_change_max_shift_days}
    measures: [plan_msr_changes_12m, plan_msr_installments_paid]

  - id: plan_evt_suspension
    subject: [plan_suspended, plan_resumed, plan_cancelled]
    rule: >-
      An active plan is suspended on the day its account enters dispute_hold or hardship_hold, and
      no debit is taken while it is suspended. When the hold ends, the plan resumes only if the
      consumer agrees to restart; the first installment after resumption is the first unpaid
      installment, it falls due no sooner than resume_min_days_to_next_installment calendar days
      after the resumption date, later installments follow on the plan's frequency, and
      final_due_date moves by the same amount. A suspended plan is cancelled with close_reason
      suspension_expired only when the handling date is later than the suspension limit counted
      from the plan's suspended_date. The suspension limit is the type's suspension_max_days in
      calendar days, the day after suspended_date being day one. A suspended plan is cancelled
      with close_reason account_returned when its account is returned to the client, and a
      consumer whose hold ends but who does not want to restart has the plan cancelled with
      close_reason consumer_cancelled. Missed-installment counting stops while the plan is
      suspended and restarts from the new schedule.
    eligibility:
      - id: suspension_limit_reached
        applies_to: [plan_cancelled]
        kind: time
        condition: A suspended plan is cancelled with close_reason suspension_expired only when the handling date is later than the suspension limit counted from the plan's suspended_date.
        evidence_fields: [payment_plans.suspended_date, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.plan_id]
          action_bindings:
            payment_plans.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan's suspended_date
          anchor_source: payment_plans.suspended_date
          relation: not_before
          duration_source: variants.suspension_max_days
          unit: calendar_days
          counting_rule: The suspension limit is the type's suspension_max_days in calendar days, the day after suspended_date being day one.
          boundary: exclusive
    params:
      per_tier:
        Promise-to-Pay Arrangement: {suspension_max: =suspension_max_days, resume_min: =resume_min_days_to_next_installment}
        Short-Term Installment Plan: {suspension_max: =suspension_max_days, resume_min: =resume_min_days_to_next_installment}
        Standard Installment Plan: {suspension_max: =suspension_max_days, resume_min: =resume_min_days_to_next_installment}
        Extended Installment Plan: {suspension_max: =suspension_max_days, resume_min: =resume_min_days_to_next_installment}
        Long-Term Installment Plan: {suspension_max: =suspension_max_days, resume_min: =resume_min_days_to_next_installment}
        Hardship Reduced-Payment Plan: {suspension_max: =suspension_max_days, resume_min: =resume_min_days_to_next_installment}

  - id: plan_evt_completion_and_release
    subject: [plan_completed, plan_balance_released, plan_total_scheduled]
    rule: >-
      The plan total is booked to the arrangement once, on the creation date, for exactly the plan
      total. A plan is completed on the day arrangement_balance reaches zero through installment
      payments, and the account then closes as paid_in_full unless a supplemental balance added
      after creation is still owed, in which case the account returns to active with that amount
      due. A remainder is released only for a plan whose status is cancelled, once, on the
      cancellation date, for the whole arrangement_balance remaining; the released amount stays
      owed on the account and is never forgiven by the release. A plan is never completed by a
      settlement waiver, a client credit or a direct payment; those reduce the account balance and
      the plan is cancelled with close_reason account_resolved_otherwise when the account is
      closed by them.
    eligibility:
      - id: release_on_cancelled_plan
        applies_to: [plan_balance_released]
        kind: state
        condition: A remainder is released only for a plan whose status is cancelled, once, on the cancellation date, for the whole arrangement_balance remaining; the released amount stays owed on the account and is never forgiven by the release.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.plan_id]
          action_bindings:
            payment_plans.plan_id: plan_id
        state_contract:
          field: payment_plans.status
          allowed: [cancelled]
    formula:
      released_amount_usd: arrangement_balance

# ============================================================================
# extended_policies: payment_arrangement_servicing (claimed task by task)
# ============================================================================
extended_policies:
  # --------------------------------------------------------------------------
  # claimed by task 0: re-dating a returned installment (prerequisite problem)
  # --------------------------------------------------------------------------
  - id: "plan_ext_returned_installment_redating"
    base_policy_refs:
      - "plan_agg_combined_affordability"
      - "plan_evt_schedule_changes"
      - "plan_evt_installments"
    overwrite: []
    trigger: "on_request"
    subject:
      - "plan_schedule_change_recorded"
    computes: "shift_days"
    target_tool: "redate_returned_installment_ce690b15"
    params: {lead_days_steady: 3, lead_days_watch: 5, lead_days_standard: 7, steady_paid_min: 6, buffer_days_closed_account: 2,
      buffer_days_funds_or_dispute: 4, buffer_days_none: 0}
    rule: >-
      An installment payment returned for account_closed, stop_payment, unauthorized_debit or card_chargeback
      is never presented again, so when the consumer moves the plan to a payment method that can collect
      it, the installment that payment was for is re-dated by one due-date change; the change moves that
      installment, which is the plan's next unpaid installment, and every later installment by the same
      number of calendar days. The re-dating shift is the number of calendar days from the scheduled due
      date carried on the plan's most recent returned installment payment to the installment's new due date.
      The new due date is the re-dating clock start advanced by the re-dating lead plus the re-dating verification
      buffer. In the standard method the re-dating clock starts on the handling date, the re-dating lead
      is seven days, the re-dating verification buffer is zero days, and the lead and buffer are counted
      in calendar days. The re-dating shift is never more than the type's due_date_change_max_shift_days;
      a longer shift is cut to that maximum. The re-dating lead follows the plan's own payment record, where
      the kept installment payments are the installment payments received under the plan less those returned:
      a plan with at least six kept installment payments and no returned installment payment in the last
      twelve months other than the most recent one takes a re-dating lead of three days; a plan with at
      least six kept installment payments and at least one other returned installment payment in the last
      twelve months takes a re-dating lead of five days; a plan with fewer than six kept installment payments
      takes a re-dating lead of seven days. The re-dating clock start follows how and when the most recent
      return arrived: when it was for account_closed or stop_payment and was received no more than the type's
      grace_period_days_autopay calendar days after the scheduled due date, the re-dating clock starts on
      the date the return was received; when it was for unauthorized_debit or card_chargeback and was received
      no more than that many days after the scheduled due date, the re-dating clock starts on the scheduled
      due date; any other return starts the re-dating clock on the handling date. The re-dating day count
      follows the channel of the most recent returned payment: after an ach_bank_debit return the lead plus
      buffer is counted in business days, Monday to Friday, after the clock start, the clock start itself
      not counted; after a debit_card or credit_card return it is counted in calendar days and a new due
      date that lands on a Saturday or a Sunday moves to the following Monday; after a return on any other
      channel it is counted in calendar days. The re-dating verification buffer follows the payments on
      the placed account that were not made under a payment plan and were returned in the last twelve months:
      an account with at least one such returned payment whose most recent such return was for account_closed
      or stop_payment adds a re-dating verification buffer of two days; an account with at least one such
      returned payment whose most recent such return was for nsf, unauthorized_debit or card_chargeback
      adds a re-dating verification buffer of four days; an account with no such returned payment adds a
      re-dating verification buffer of zero days. Periods of twelve months are counted in whole months back
      from the handling date.
    prerequisite: []
    cross_category:
      - category: "account"
        as: "history"
        reads:
          - "account_transactions.event_type"
          - "account_transactions.return_reason"
          - "account_transactions.txn_date"
          - "account_transactions.account_id"
          - "account_transactions.plan_id"
        note: "The re-dating verification buffer is decided from the returned payments made outside any\
          \ payment plan on the placed account's money history in the last twelve months."
    compute:
      - returned_count: "COUNT('plan_installments', event_type='plan_installment_returned')"
      - return_received_date: "LATEST('plan_installments', 'txn_date', date_field='txn_date', event_type='plan_installment_returned')"
      - returned_due_date: "LATEST('plan_installments', 'due_date', date_field='txn_date', event_type='plan_installment_returned')"
      - return_reason_latest: "LATEST('plan_installments', 'return_reason', date_field='txn_date', event_type='plan_installment_returned')"
      - return_channel_latest: "LATEST('plan_installments', 'payment_channel', date_field='txn_date', event_type='plan_installment_returned')"
      - redating_paid_count: "COUNT('plan_installments', event_type='plan_installment_paid') - returned_count"
      - redating_other_returns_12m: "COUNT('plan_installments', within_months=12, date_field='txn_date',\
          \ event_type='plan_installment_returned') - 1"
      - redating_lead: "K('lead_days_steady') if (redating_paid_count >= K('steady_paid_min') and redating_other_returns_12m\
          \ == 0) else (K('lead_days_watch') if (redating_paid_count >= K('steady_paid_min') and redating_other_returns_12m\
          \ >= 1) else K('lead_days_standard'))"
      - return_lag_days: "DAYS(returned_due_date, return_received_date)"
      - redating_clock_start: "return_received_date if ((return_reason_latest == 'account_closed' or return_reason_latest\
          \ == 'stop_payment') and return_lag_days <= P('grace_period_days_autopay')) else (returned_due_date\
          \ if ((return_reason_latest == 'unauthorized_debit' or return_reason_latest == 'card_chargeback')\
          \ and return_lag_days <= P('grace_period_days_autopay')) else NOW)"
      - account_returns_6m: "XCOUNT('account', 'account_transactions', within_months=12, date_field='txn_date',\
          \ event_type='account_payment_returned', account_id=F('account_id'), plan_id=None)"
      - account_latest_return_reason: "XLATEST('account', 'account_transactions', 'return_reason', date_field='txn_date',\
          \ event_type='account_payment_returned', account_id=F('account_id'), plan_id=None)"
      - redating_buffer: "K('buffer_days_closed_account') if (account_returns_6m >= 1 and (account_latest_return_reason\
          \ == 'account_closed' or account_latest_return_reason == 'stop_payment')) else (K('buffer_days_funds_or_dispute')\
          \ if (account_returns_6m >= 1 and (account_latest_return_reason == 'nsf' or account_latest_return_reason\
          \ == 'unauthorized_debit' or account_latest_return_reason == 'card_chargeback')) else K('buffer_days_none'))"
      - redating_total_lead: "redating_lead + redating_buffer"
      - clock_start_weekday: "DAYS('2024-01-01', redating_clock_start) % 7"
      - redating_calendar_lead: "(redating_total_lead + 2 * ((MN(clock_start_weekday, 4) + redating_total_lead)\
          \ // 5) - MX(0, clock_start_weekday - 4)) if return_channel_latest == 'ach_bank_debit' else ((redating_total_lead\
          \ + (2 if (clock_start_weekday + redating_total_lead) % 7 == 5 else (1 if (clock_start_weekday\
          \ + redating_total_lead) % 7 == 6 else 0))) if (return_channel_latest == 'debit_card' or return_channel_latest\
          \ == 'credit_card') else redating_total_lead)"
      - redating_raw_shift: "DAYS(returned_due_date, redating_clock_start) + redating_calendar_lead"
      - result: "MN(P('due_date_change_max_shift_days'), redating_raw_shift)"
    compute_basis:
      returned_count: "the kept installment payments are the installment payments received under the plan\
        \ less those returned"
      return_received_date: "the re-dating clock starts on the date the return was received"
      returned_due_date: "The re-dating shift is the number of calendar days from the scheduled due date\
        \ carried on the plan's most recent returned installment payment to the installment's new due date."
      return_reason_latest: "The re-dating clock start follows how and when the most recent return arrived"
      return_channel_latest: "The re-dating day count follows the channel of the most recent returned payment"
      redating_paid_count: "the kept installment payments are the installment payments received under the\
        \ plan less those returned"
      redating_other_returns_12m: "no returned installment payment in the last twelve months other than\
        \ the most recent one"
      redating_lead: "a plan with at least six kept installment payments and no returned installment payment\
        \ in the last twelve months other than the most recent one takes a re-dating lead of three days;\
        \ a plan with at least six kept installment payments and at least one other returned installment\
        \ payment in the last twelve months takes a re-dating lead of five days; a plan with fewer than\
        \ six kept installment payments takes a re-dating lead of seven days."
      return_lag_days: "was received no more than the type's grace_period_days_autopay calendar days after\
        \ the scheduled due date"
      redating_clock_start: "when it was for account_closed or stop_payment and was received no more than\
        \ the type's grace_period_days_autopay calendar days after the scheduled due date, the re-dating\
        \ clock starts on the date the return was received; when it was for unauthorized_debit or card_chargeback\
        \ and was received no more than that many days after the scheduled due date, the re-dating clock\
        \ starts on the scheduled due date; any other return starts the re-dating clock on the handling\
        \ date."
      account_returns_6m: "The re-dating verification buffer follows the payments on the placed account\
        \ that were not made under a payment plan and were returned in the last twelve months"
      account_latest_return_reason: "whose most recent such return was for account_closed or stop_payment"
      redating_buffer: "an account with at least one such returned payment whose most recent such return\
        \ was for account_closed or stop_payment adds a re-dating verification buffer of two days; an account\
        \ with at least one such returned payment whose most recent such return was for nsf, unauthorized_debit\
        \ or card_chargeback adds a re-dating verification buffer of four days; an account with no such\
        \ returned payment adds a re-dating verification buffer of zero days."
      redating_total_lead: "The new due date is the re-dating clock start advanced by the re-dating lead\
        \ plus the re-dating verification buffer."
      clock_start_weekday: "counted in business days, Monday to Friday, after the clock start, the clock\
        \ start itself not counted"
      redating_calendar_lead: "after an ach_bank_debit return the lead plus buffer is counted in business\
        \ days, Monday to Friday, after the clock start, the clock start itself not counted; after a debit_card\
        \ or credit_card return it is counted in calendar days and a new due date that lands on a Saturday\
        \ or a Sunday moves to the following Monday; after a return on any other channel it is counted in\
        \ calendar days."
      redating_raw_shift: "The re-dating shift is the number of calendar days from the scheduled due date\
        \ carried on the plan's most recent returned installment payment to the installment's new due date."
      result: "The re-dating shift is never more than the type's due_date_change_max_shift_days; a longer\
        \ shift is cut to that maximum."
    factors:
      - id: "redating_lead_by_payment_record"
        effect: >-
          parameter
        decides: "redating_lead"
        bindings:
          - "redating_paid_count"
          - "redating_other_returns_12m"
          - "redating_lead"
        ladder:
          - when: "at least six kept installment payments AND no returned installment payment in the last\
              \ twelve months other than the most recent one"
            value: "K('lead_days_steady') = 3 days"
          - when: "at least six kept installment payments AND at least one other returned installment payment\
              \ in the last twelve months"
            value: "K('lead_days_watch') = 5 days"
          - when: "fewer than six kept installment payments"
            value: "K('lead_days_standard') = 7 days"
        baseline:
          redating_lead: "K('lead_days_standard')"
        evidence:
          - "history"
        cross_difficulty: null
      - id: "redating_clock_start_by_return"
        effect: >-
          method
        decides: "redating_clock_start"
        bindings:
          - "return_lag_days"
          - "redating_clock_start"
        ladder:
          - when: "most recent return for account_closed or stop_payment AND received within grace_period_days_autopay\
              \ days of the scheduled due date"
            method: "the clock starts on the date the return was received"
          - when: "most recent return for unauthorized_debit or card_chargeback AND received within grace_period_days_autopay\
              \ days of the scheduled due date"
            method: "the clock starts on the scheduled due date of the returned installment"
          - when: "otherwise"
            method: "the clock starts on the handling date"
        baseline:
          redating_clock_start: "NOW"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
      - id: "redating_day_count_by_channel"
        effect: >-
          method
        decides: "redating_calendar_lead"
        bindings:
          - "clock_start_weekday"
          - "redating_calendar_lead"
        ladder:
          - when: "the most recent returned payment ran as an ach_bank_debit"
            method: "the lead plus buffer is counted in business days (Monday to Friday) after the clock\
              \ start"
          - when: "the most recent returned payment ran as a debit_card or credit_card payment"
            method: "calendar days, a Saturday or Sunday landing moved to the following Monday"
          - when: "otherwise"
            method: "plain calendar days"
        baseline:
          redating_calendar_lead: "redating_total_lead"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
      - id: "redating_buffer_by_account_returns"
        effect: >-
          parameter
        decides: "redating_buffer"
        bindings:
          - "account_returns_6m"
          - "account_latest_return_reason"
          - "redating_buffer"
        ladder:
          - when: "at least one payment made outside any payment plan on the placed account returned in\
              \ the last twelve months AND the most recent such return was for account_closed or stop_payment"
            value: "K('buffer_days_closed_account') = 2 days"
          - when: "at least one such returned payment in the last twelve months AND the most recent such\
              \ return was for nsf, unauthorized_debit or card_chargeback"
            value: "K('buffer_days_funds_or_dispute') = 4 days"
          - when: "no payment made outside a payment plan returned on the placed account in the last twelve\
              \ months"
            value: "K('buffer_days_none') = 0 days"
        baseline:
          redating_buffer: "K('buffer_days_none')"
        evidence:
          - "cross_category"
          - "history"
        cross_difficulty: "account"
    baseline:
      rule: >-
        The re-dating shift is the number of calendar days from the scheduled due date carried on the plan's
        most recent returned installment payment to the installment's new due date. The new due date is
        the re-dating clock start advanced by the re-dating lead plus the re-dating verification buffer.
        In the standard method the re-dating clock starts on the handling date, the re-dating lead is seven
        days, the re-dating verification buffer is zero days, and the lead and buffer are counted in calendar
        days. The re-dating shift is never more than the type's due_date_change_max_shift_days; a longer
        shift is cut to that maximum.
      params:
        - "lead_days_standard"
        - "buffer_days_none"
        - "due_date_change_max_shift_days"
    inputs:
      history:
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          filters:
            event_type: "plan_installment_paid"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 12
          filters:
            event_type: "plan_installment_returned"
        - table: "plan_installments"
          aggregate: "latest"
          field: "due_date"
          filters:
            event_type: "plan_installment_returned"
        - category: "account"
          table: "account_transactions"
          aggregate: "count"
          field: "txn_id"
          within_months: 12
          filters:
            event_type: "account_payment_returned"
            plan_id: null
        - category: "account"
          table: "account_transactions"
          aggregate: "latest"
          field: "return_reason"
          filters:
            event_type: "account_payment_returned"
            plan_id: null
      cross_category:
        - "account"
  # --------------------------------------------------------------------------
  # claimed by task 0: the consumer's authorization of a new payment method (root problem, owner=user)
  # --------------------------------------------------------------------------
  - id: "plan_ext_new_method_handover"
    base_policy_refs:
      - "plan_agg_combined_affordability"
      - "plan_evt_schedule_changes"
      - "plan_evt_installments"
    overwrite: []
    trigger: "on_request"
    subject:
      - "plan_schedule_change_recorded"
    computes: "installment_number"
    target_tool: "authorize_payment_method_50f022be"
    params: {steady_paid_min: 6, notice_days_steady: 3, notice_days_watch: 4, notice_days_standard: 5, extension_card_known: 0,
      extension_card_trouble: 3, extension_standard: 2, return_allowance_clean: 0, return_allowance_repeat: 4,
      return_allowance_standard: 2}
    rule: >-
      A consumer moves a plan's installments to a new payment method by authorizing that method personally,
      and the payment-method change is recorded once, carrying the number of the first installment the new
      method collects. The hand-over starts from the installments the plan's payments already cover: the
      hand-over covered amount is the installment payments received under the plan less the installment
      payments returned, less the down payment, plus the type's partial_payment_tolerance_usd, so that an
      installment short by no more than the type's tolerance counts as covered, and the hand-over next installment
      is one more than the number of whole regular installments that amount covers, the covered amount being
      divided by the regular installment amount and any fraction dropped. When the hand-over next installment
      is the installment of the plan's most recent returned installment payment, the new method collects
      it only if it is the plan's schedule anchor installment and the days from the handling date to the
      schedule anchor date are more than the set-up notice plus the set-up notice extension plus the set-up
      notice return allowance; otherwise the new method first collects the installment after it. When the
      hand-over next installment is any other installment, the new method first collects that installment.
      In the standard method the set-up notice is five days, the set-up notice extension is two days, the
      set-up notice return allowance is two days, and the days to the schedule anchor date are counted in
      business days, Monday to Friday, after the handling date. The first installment a newly authorized
      payment method collects is fixed only after the plan's installment history carries a due-date change
      for the installment of its most recent returned installment payment. The set-up notice follows the
      plan's payment record, where the kept installment payments are the installment payments received under
      the plan less those returned: a plan with at least six kept installment payments and no missed installment
      recorded in the last twelve months takes a set-up notice of three days; a plan with at least six kept
      installment payments and at least one missed installment recorded in the last twelve months takes
      four days; a plan with fewer than six kept installment payments takes five days. The set-up notice
      return allowance follows the plan's returned installment payments in the last six months: a plan with
      at least six kept installment payments and no returned installment payment in that period other than
      the most recent one takes a return allowance of zero days; a plan with at least six kept installment
      payments and at least one other returned installment payment in that period takes four days; a plan
      with fewer than six kept installment payments takes two days. The set-up notice extension follows
      the consumer's card history and the plan's payment-method history over the last twelve months: when
      a debit_card or credit_card payment was posted on any of the consumer's placed accounts, no card payment
      on those accounts was returned and the plan recorded no payment-method change, the extension is zero
      days; when a card payment on the consumer's placed accounts was returned or the plan recorded a payment-method
      change, the extension is three days; when no card payment was posted or returned and the plan recorded
      no payment-method change, the extension is two days. The set-up notice day count follows the plan's
      most recent returned installment payment: after a return for account_closed or stop_payment the days
      to the schedule anchor date are counted in calendar days; after a return for nsf they are counted
      in business days after the first business day following the handling date; after any other return,
      or with no return, they are counted in business days after the handling date. A payment-method change
      does not lift a returned-payment block that the account rules have placed on the placed account: an
      automatic method is authorized under this policy only while the placed account accepts electronic
      payments, that is while no such block is in force on the handling date. Periods of twelve and six
      months are counted in whole months back from the handling date.
    prerequisite:
      - problem: "plan_ext_returned_installment_redating"
        kind: "value_input"
        gate: "result"
        form: "state"
        policy_source: >-
          The first installment a newly authorized payment method collects is fixed only after the plan's
          installment history carries a due-date change for the installment of its most recent returned
          installment payment.
        condition: >-
          plan_installments carries a plan_schedule_change_recorded row with change_type due_date_change
          for the installment_number of the plan's latest plan_installment_returned row.
        resolved_by: "redate_returned_installment_ce690b15"
        effect: >-
          The due-date change re-dates the returned installment and makes it the schedule anchor installment
          with its new due date, so that installment can satisfy the set-up notice and become the first
          installment the new method collects instead of the installment after it.
    cross_category:
      - category: "account"
        as: "history"
        reads:
          - "account_transactions.event_type"
          - "account_transactions.payment_channel"
          - "account_transactions.txn_date"
        note: "The set-up notice extension is decided from card payments posted and returned on the consumer's\
          \ placed accounts in the last twelve months."
    compute:
      - handover_paid_sum: "SUM('plan_installments', 'amount', event_type='plan_installment_paid')"
      - handover_returned_sum: "SUM('plan_installments', 'amount', event_type='plan_installment_returned')"
      - handover_paid_count: "COUNT('plan_installments', event_type='plan_installment_paid') - COUNT('plan_installments',\
          \ event_type='plan_installment_returned')"
      - handover_tolerance: "P('partial_payment_tolerance_usd')"
      - handover_next: "1 + int((handover_paid_sum - handover_returned_sum - F('down_payment_amount') +\
          \ handover_tolerance) // F('installment_amount'))"
      - handover_returned_installment: "LATEST('plan_installments', 'installment_number', date_field='txn_date',\
          \ event_type='plan_installment_returned')"
      - handover_return_reason: "LATEST('plan_installments', 'return_reason', date_field='txn_date', event_type='plan_installment_returned')"
      - handover_missed_12m: "COUNT('plan_installments', within_months=12, date_field='txn_date', event_type='plan_installment_missed')"
      - setup_notice: "K('notice_days_steady') if (handover_paid_count >= K('steady_paid_min') and handover_missed_12m\
          \ == 0) else (K('notice_days_watch') if (handover_paid_count >= K('steady_paid_min') and handover_missed_12m\
          \ >= 1) else K('notice_days_standard'))"
      - card_payments_12m: "XCOUNT('account', 'account_transactions', within_months=12, date_field='txn_date',\
          \ event_type='account_payment_posted', payment_channel='debit_card') + XCOUNT('account', 'account_transactions',\
          \ within_months=12, date_field='txn_date', event_type='account_payment_posted', payment_channel='credit_card')"
      - card_returns_12m: "XCOUNT('account', 'account_transactions', within_months=12, date_field='txn_date',\
          \ event_type='account_payment_returned', payment_channel='debit_card') + XCOUNT('account', 'account_transactions',\
          \ within_months=12, date_field='txn_date', event_type='account_payment_returned', payment_channel='credit_card')"
      - method_changes_12m: "COUNT('plan_installments', within_months=12, date_field='txn_date', event_type='plan_schedule_change_recorded',\
          \ change_type='funding_method_change')"
      - setup_extension: "K('extension_card_known') if (card_payments_12m >= 1 and card_returns_12m == 0\
          \ and method_changes_12m == 0) else (K('extension_card_trouble') if (card_returns_12m >= 1 or\
          \ method_changes_12m >= 1) else K('extension_standard'))"
      - handover_other_returns_12m: "COUNT('plan_installments', within_months=6, date_field='txn_date',\
          \ event_type='plan_installment_returned') - 1"
      - setup_return_allowance: "K('return_allowance_clean') if (handover_paid_count >= K('steady_paid_min')\
          \ and handover_other_returns_12m <= 0) else (K('return_allowance_repeat') if (handover_paid_count\
          \ >= K('steady_paid_min') and handover_other_returns_12m >= 1) else K('return_allowance_standard'))"
      - anchor_days_calendar: "DAYS(NOW, F('schedule_anchor_date'))"
      - handling_weekday: "DAYS('2024-01-01', NOW) % 7"
      - anchor_days_business: "5 * (MX(0, anchor_days_calendar) // 7) + MX(0, MN(handling_weekday + MX(0,\
          \ anchor_days_calendar) % 7, 4) - handling_weekday) + MX(0, MN(handling_weekday + MX(0, anchor_days_calendar)\
          \ % 7, 11) - MX(handling_weekday + 1, 7) + 1)"
      - setup_day_count: "anchor_days_calendar if (handover_return_reason == 'account_closed' or handover_return_reason\
          \ == 'stop_payment') else (MX(0, anchor_days_business - 1) if handover_return_reason == 'nsf'\
          \ else anchor_days_business)"
      - result: "handover_next + (1 if (handover_returned_installment == handover_next and not (F('schedule_anchor_installment')\
          \ == handover_next and setup_day_count > setup_notice + setup_extension + setup_return_allowance))\
          \ else 0)"
    compute_basis:
      handover_paid_sum: "the hand-over covered amount is the installment payments received under the plan\
        \ less the installment payments returned, less the down payment, plus the type's partial_payment_tolerance_usd"
      handover_returned_sum: "the hand-over covered amount is the installment payments received under the\
        \ plan less the installment payments returned, less the down payment, plus the type's partial_payment_tolerance_usd"
      handover_paid_count: "where the kept installment payments are the installment payments received under\
        \ the plan less those returned"
      handover_tolerance: "plus the type's partial_payment_tolerance_usd, so that an installment short by\
        \ no more than the type's tolerance counts as covered"
      handover_next: "the hand-over next installment is one more than the number of whole regular installments\
        \ that amount covers, the covered amount being divided by the regular installment amount and any\
        \ fraction dropped."
      handover_returned_installment: "When the hand-over next installment is the installment of the plan's\
        \ most recent returned installment payment"
      handover_return_reason: "The set-up notice day count follows the plan's most recent returned installment\
        \ payment"
      handover_missed_12m: "no missed installment recorded in the last twelve months"
      setup_notice: "a plan with at least six kept installment payments and no missed installment recorded\
        \ in the last twelve months takes a set-up notice of three days; a plan with at least six kept installment\
        \ payments and at least one missed installment recorded in the last twelve months takes four days;\
        \ a plan with fewer than six kept installment payments takes five days."
      card_payments_12m: "when a debit_card or credit_card payment was posted on any of the consumer's placed\
        \ accounts"
      card_returns_12m: "no card payment on those accounts was returned"
      method_changes_12m: "the plan recorded no payment-method change"
      setup_extension: "when a debit_card or credit_card payment was posted on any of the consumer's placed\
        \ accounts, no card payment on those accounts was returned and the plan recorded no payment-method\
        \ change, the extension is zero days; when a card payment on the consumer's placed accounts was\
        \ returned or the plan recorded a payment-method change, the extension is three days; when no card\
        \ payment was posted or returned and the plan recorded no payment-method change, the extension is\
        \ two days."
      anchor_days_calendar: "the days from the handling date to the schedule anchor date"
      handling_weekday: "counted in business days, Monday to Friday, after the handling date"
      anchor_days_business: "the days to the schedule anchor date are counted in business days, Monday to\
        \ Friday, after the handling date"
      setup_day_count: "after a return for account_closed or stop_payment the days to the schedule anchor\
        \ date are counted in calendar days; after a return for nsf they are counted in business days after\
        \ the first business day following the handling date; after any other return, or with no return,\
        \ they are counted in business days after the handling date."
      result: "the new method collects it only if it is the plan's schedule anchor installment and the days\
        \ from the handling date to the schedule anchor date are more than the set-up notice plus the set-up\
        \ notice extension plus the set-up notice return allowance; otherwise the new method first collects\
        \ the installment after it. When the hand-over next installment is any other installment, the new\
        \ method first collects that installment."
      handover_other_returns_12m: "no returned installment payment in that period other than the most recent\
        \ one"
      setup_return_allowance: "a plan with at least six kept installment payments and no returned installment\
        \ payment in that period other than the most recent one takes a return allowance of zero days; a\
        \ plan with at least six kept installment payments and at least one other returned installment payment\
        \ in that period takes four days; a plan with fewer than six kept installment payments takes two\
        \ days."
    factors:
      - id: "setup_notice_by_payment_record"
        effect: >-
          parameter
        decides: "setup_notice"
        bindings:
          - "handover_paid_count"
          - "handover_missed_12m"
          - "setup_notice"
        ladder:
          - when: "at least six kept installment payments AND no missed installment recorded in the last\
              \ twelve months"
            value: "K('notice_days_steady') = 3 days"
          - when: "at least six kept installment payments AND at least one missed installment recorded in\
              \ the last twelve months"
            value: "K('notice_days_watch') = 4 days"
          - when: "fewer than six kept installment payments"
            value: "K('notice_days_standard') = 5 days"
        baseline:
          setup_notice: "K('notice_days_standard')"
        evidence:
          - "history"
        cross_difficulty: null
      - id: "setup_day_count_by_return_reason"
        effect: >-
          method
        decides: "setup_day_count"
        bindings:
          - "handling_weekday"
          - "anchor_days_business"
          - "setup_day_count"
        ladder:
          - when: "the plan's most recent returned installment payment was returned for account_closed or\
              \ stop_payment"
            method: "calendar days from the handling date to the schedule anchor date"
          - when: "the plan's most recent returned installment payment was returned for nsf"
            method: "business days after the first business day following the handling date"
          - when: "otherwise (any other return reason, or no return)"
            method: "business days (Monday to Friday) after the handling date"
        baseline:
          setup_day_count: "anchor_days_business"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
      - id: "setup_extension_by_card_history"
        effect: >-
          parameter
        decides: "setup_extension"
        bindings:
          - "card_payments_12m"
          - "card_returns_12m"
          - "method_changes_12m"
          - "setup_extension"
        ladder:
          - when: "a card payment posted on the consumer's placed accounts in the last twelve months AND\
              \ no card payment returned AND no payment-method change on the plan in that period"
            value: "K('extension_card_known') = 0 days"
          - when: "a card payment returned on the consumer's placed accounts in the last twelve months OR\
              \ a payment-method change on the plan in that period"
            value: "K('extension_card_trouble') = 3 days"
          - when: "no card payment posted or returned AND no payment-method change in the last twelve months"
            value: "K('extension_standard') = 2 days"
        baseline:
          setup_extension: "K('extension_standard')"
        evidence:
          - "cross_category"
          - "history"
        cross_difficulty: "account"
      - id: "setup_notice_return_allowance"
        effect: >-
          parameter
        decides: "setup_return_allowance"
        bindings:
          - "handover_other_returns_12m"
          - "setup_return_allowance"
        ladder:
          - when: "at least six kept installment payments AND no returned installment payment in the last\
              \ six months other than the most recent one"
            value: "K('return_allowance_clean') = 0 days"
          - when: "at least six kept installment payments AND at least one other returned installment payment\
              \ in the last six months"
            value: "K('return_allowance_repeat') = 4 days"
          - when: "fewer than six kept installment payments"
            value: "K('return_allowance_standard') = 2 days"
        baseline:
          setup_return_allowance: "K('return_allowance_standard')"
        evidence:
          - "history"
        cross_difficulty: null
    baseline:
      rule: >-
        The hand-over starts from the installments the plan's payments already cover: the hand-over covered
        amount is the installment payments received under the plan less the installment payments returned,
        less the down payment, plus the type's partial_payment_tolerance_usd, so that an installment short
        by no more than the type's tolerance counts as covered, and the hand-over next installment is one
        more than the number of whole regular installments that amount covers, the covered amount being
        divided by the regular installment amount and any fraction dropped. When the hand-over next installment
        is the installment of the plan's most recent returned installment payment, the new method collects
        it only if it is the plan's schedule anchor installment and the days from the handling date to the
        schedule anchor date are more than the set-up notice plus the set-up notice extension plus the set-up
        notice return allowance; otherwise the new method first collects the installment after it. When
        the hand-over next installment is any other installment, the new method first collects that installment.
        In the standard method the set-up notice is five days, the set-up notice extension is two days,
        the set-up notice return allowance is two days, and the days to the schedule anchor date are counted
        in business days, Monday to Friday, after the handling date.
      params:
        - "partial_payment_tolerance_usd"
        - "notice_days_standard"
        - "extension_standard"
        - "return_allowance_standard"
    inputs:
      history:
        - table: "plan_installments"
          aggregate: "sum"
          field: "amount"
          filters:
            event_type: "plan_installment_paid"
        - table: "plan_installments"
          aggregate: "sum"
          field: "amount"
          filters:
            event_type: "plan_installment_returned"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 12
          filters:
            event_type: "plan_installment_missed"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 12
          filters:
            event_type: "plan_schedule_change_recorded"
            change_type: "funding_method_change"
        - category: "account"
          table: "account_transactions"
          aggregate: "count"
          field: "txn_id"
          within_months: 12
          filters:
            event_type: "account_payment_posted"
            payment_channel: "debit_card"
        - category: "account"
          table: "account_transactions"
          aggregate: "count"
          field: "txn_id"
          within_months: 12
          filters:
            event_type: "account_payment_returned"
            payment_channel: "debit_card"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 6
          filters:
            event_type: "plan_installment_returned"
