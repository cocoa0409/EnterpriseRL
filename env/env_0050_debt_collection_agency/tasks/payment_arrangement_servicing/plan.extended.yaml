  # --------------------------------------------------------------------------
  # claimed by task 1: the missed entry owed from before a hardship suspension (prerequisite problem)
  # --------------------------------------------------------------------------
  - id: "plan_ext_presuspension_missed_entry"
    base_policy_refs:
      - "plan_evt_installments"
      - "plan_evt_suspension"
    overwrite:
      - base_policy: "plan_evt_installments"
        superseded_clause: >-
          The grace period is grace_period_days_manual calendar days for a plan paid manually and grace_period_days_autopay
          calendar days for a plan collected by automatic debit, the day after the due date being day one.
        replaced_by: >-
          The pre-suspension grace elapsed days are the calendar days from the grace start to the counting
          cutoff, and the pre-suspension grace is the grace length plus the hold-timing extension plus the
          weekend-due extension.
      - base_policy: "plan_evt_suspension"
        superseded_clause: >-
          Missed-installment counting stops while the plan is suspended
        replaced_by: >-
          The counting cutoff follows the hardship hold that suspended the plan, which is the hold on the
          plan's account whose decision_date is the plan's suspended_date: when the hold's tier starts holds
          from the request date and that request date is earlier than the plan's suspended_date, counting
          stopped on the hold's request_date; when the hold's tier starts holds from the decision date and
          the hold's start_date is earlier than the plan's suspended_date, counting stopped on the hold's
          start_date; otherwise counting stopped on the plan's suspended_date.
    trigger: "state_due"
    subject:
      - "plan_installment_missed"
    computes: "installment_number"
    target_tool: "record_missed_installment_d21cca89"
    params: {steady_paid_min: 3, grace_days_steady: 9, grace_days_watch: 4, hold_ext_documented: 2, hold_ext_self_attested: 1,
      hold_ext_none: 0, hold_ext_window_days: 30, weekend_ext_saturday: 2, weekend_ext_sunday: 1, weekend_ext_none: 0}
    rule: >-
      A miss whose pre-suspension grace had run out by the date missed-installment counting stopped is still
      owed on the installment history and is recorded once, as the missed entry of the pre-suspension installment;
      for that determination the counting cutoff, the grace start and the grace length set out below apply.
      The counting cutoff is the date missed-installment counting stopped. The examined installment is the
      last installment whose scheduled due date falls on or before the counting cutoff: the schedule anchor
      installment plus the whole periods from the schedule anchor date to the counting cutoff, counted in
      weeks of seven days for a weekly plan, in fortnights of fourteen days for a biweekly plan and in whole
      calendar months for a monthly plan. The pre-suspension grace elapsed days are the calendar days from
      the grace start to the counting cutoff, and the pre-suspension grace is the grace length plus the
      hold-timing extension plus the weekend-due extension. The missed entry goes to the examined installment
      when its pre-suspension grace elapsed days are more than its pre-suspension grace or when it was never
      presented for collection; when they are not, its grace had not run out by the cutoff and the missed
      entry goes to the installment immediately before it. In the standard method the counting cutoff is
      the plan's suspended_date, the grace starts on the examined installment's scheduled due date, the
      grace length is the type's grace period for the plan's funding method (grace_period_days_autopay for
      automatic debit, grace_period_days_manual for manual payment), and both extensions are zero days.
      The counting cutoff follows the hardship hold that suspended the plan, which is the hold on the plan's
      account whose decision_date is the plan's suspended_date: when the hold's tier starts holds from the
      request date and that request date is earlier than the plan's suspended_date, counting stopped on
      the hold's request_date; when the hold's tier starts holds from the decision date and the hold's start_date
      is earlier than the plan's suspended_date, counting stopped on the hold's start_date; otherwise counting
      stopped on the plan's suspended_date. The grace start follows how the examined installment's debit
      came back: when its most recent return was for account_closed or stop_payment, the debit is never
      presented again and the grace starts on the date that return was received; when it was for nsf, unauthorized_debit
      or card_chargeback, the grace starts on the date its debit was last presented; when it was never returned,
      the grace starts on its scheduled due date. The grace length follows the plan's payment record, where
      the kept installment payments are the installment payments received under the plan less those returned:
      a plan with at least three kept installment payments and no missed entry recorded in the last twelve
      months takes a grace length of nine days; a plan with at least three kept installment payments and
      at least one missed entry recorded in the last twelve months takes four days; a plan with fewer than
      three kept installment payments takes the type's grace period for its funding method. The hold-timing
      extension follows when the hardship hold was asked for: a hold of a tier that needs documentation,
      requested on or after the examined installment's scheduled due date and no more than thirty days after
      it, adds two days; a self-attested hold requested on or after that date and no more than thirty days
      after it adds one day; any other case, including a hold requested before that date, adds zero days.
      The weekend-due extension follows the weekday of the examined installment's scheduled due date: a
      due date on a Saturday adds two days, a due date on a Sunday adds one day, and a due date on a weekday
      adds zero days. Periods of twelve months are counted in whole months back from the handling date.
    prerequisite: []
    cross_category:
      - category: "hardship"
        as: "branch"
        reads:
          - "hold_start_basis"
          - "documentation_required"
          - "request_date"
          - "start_date"
          - "decision_date"
        note: "The counting cutoff and the hold-timing extension are decided from the hardship hold that\
          \ suspended the plan (its tier's start basis and documentation requirement, its request and start\
          \ dates)."
    compute:
      - hold_start_basis_tier: "CPARAM('hardship', 'hold_start_basis', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_request_date: "CFIELD('hardship', 'request_date', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_start_date: "CFIELD('hardship', 'start_date', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_needs_documents: "CPARAM('hardship', 'documentation_required', account_id=F('account_id'),\
          \ decision_date=F('suspended_date'))"
      - counting_cutoff: "hold_request_date if (hold_start_basis_tier == 'request_date' and hold_request_date\
          \ != None and hold_request_date < F('suspended_date')) else (hold_start_date if (hold_start_basis_tier\
          \ == 'decision_date' and hold_start_date != None and hold_start_date < F('suspended_date')) else\
          \ F('suspended_date'))"
      - examined_installment: "F('schedule_anchor_installment') + (DAYS(F('schedule_anchor_date'), counting_cutoff)\
          \ // 7 if F('payment_frequency') == 'weekly' else (DAYS(F('schedule_anchor_date'), counting_cutoff)\
          \ // 14 if F('payment_frequency') == 'biweekly' else MONTHS(F('schedule_anchor_date'), counting_cutoff)))"
      - examined_due_date: "LATEST('plan_installments', 'due_date', date_field='txn_date', event_type='plan_installment_paid',\
          \ installment_number=examined_installment)"
      - examined_last_presented: "LATEST('plan_installments', 'txn_date', date_field='txn_date', event_type='plan_installment_paid',\
          \ installment_number=examined_installment)"
      - examined_return_reason: "LATEST('plan_installments', 'return_reason', date_field='txn_date', event_type='plan_installment_returned',\
          \ installment_number=examined_installment)"
      - examined_return_date: "LATEST('plan_installments', 'txn_date', date_field='txn_date', event_type='plan_installment_returned',\
          \ installment_number=examined_installment)"
      - grace_start: "examined_return_date if (examined_return_reason == 'account_closed' or examined_return_reason\
          \ == 'stop_payment') else (examined_last_presented if (examined_return_reason == 'nsf' or examined_return_reason\
          \ == 'unauthorized_debit' or examined_return_reason == 'card_chargeback') else examined_due_date)"
      - presuspension_paid_count: "COUNT('plan_installments', event_type='plan_installment_paid') - COUNT('plan_installments',\
          \ event_type='plan_installment_returned')"
      - presuspension_missed_12m: "COUNT('plan_installments', within_months=12, date_field='txn_date', event_type='plan_installment_missed')"
      - type_grace_days: "P('grace_period_days_autopay') if (F('funding_method') == 'ach_autopay' or F('funding_method')\
          \ == 'card_autopay') else P('grace_period_days_manual')"
      - grace_length: "K('grace_days_steady') if (presuspension_paid_count >= K('steady_paid_min') and presuspension_missed_12m\
          \ == 0) else (K('grace_days_watch') if (presuspension_paid_count >= K('steady_paid_min') and presuspension_missed_12m\
          \ >= 1) else type_grace_days)"
      - hold_request_lag: "-1 if (hold_request_date == None or examined_due_date == None) else DAYS(examined_due_date,\
          \ hold_request_date)"
      - hold_timing_extension: "K('hold_ext_documented') if (hold_needs_documents == True and hold_request_lag\
          \ >= 0 and hold_request_lag <= K('hold_ext_window_days')) else (K('hold_ext_self_attested') if\
          \ (hold_needs_documents == False and hold_request_lag >= 0 and hold_request_lag <= K('hold_ext_window_days'))\
          \ else K('hold_ext_none'))"
      - due_weekday: "-1 if examined_due_date == None else DAYS('2024-01-01', examined_due_date) % 7"
      - weekend_due_extension: "K('weekend_ext_saturday') if due_weekday == 5 else (K('weekend_ext_sunday')\
          \ if due_weekday == 6 else K('weekend_ext_none'))"
      - grace_elapsed_days: "0 if (grace_start == None or examined_due_date == None) else DAYS(grace_start,\
          \ counting_cutoff)"
      - presuspension_grace: "grace_length + hold_timing_extension + weekend_due_extension"
      - result: "examined_installment if (examined_due_date == None or grace_elapsed_days > presuspension_grace)\
          \ else examined_installment - 1"
    compute_basis:
      hold_start_basis_tier: "the hardship hold that suspended the plan, which is the hold on the plan's\
        \ account whose decision_date is the plan's suspended_date"
      hold_request_date: "counting stopped on the hold's request_date"
      hold_start_date: "counting stopped on the hold's start_date"
      hold_needs_documents: "a hold of a tier that needs documentation"
      counting_cutoff: "when the hold's tier starts holds from the request date and that request date is\
        \ earlier than the plan's suspended_date, counting stopped on the hold's request_date; when the\
        \ hold's tier starts holds from the decision date and the hold's start_date is earlier than the\
        \ plan's suspended_date, counting stopped on the hold's start_date; otherwise counting stopped on\
        \ the plan's suspended_date."
      examined_installment: "the schedule anchor installment plus the whole periods from the schedule anchor\
        \ date to the counting cutoff, counted in weeks of seven days for a weekly plan, in fortnights of\
        \ fourteen days for a biweekly plan and in whole calendar months for a monthly plan."
      examined_due_date: "The examined installment is the last installment whose scheduled due date falls\
        \ on or before the counting cutoff"
      examined_last_presented: "the grace starts on the date its debit was last presented"
      examined_return_reason: "The grace start follows how the examined installment's debit came back"
      examined_return_date: "the grace starts on the date that return was received"
      grace_start: "when its most recent return was for account_closed or stop_payment, the debit is never\
        \ presented again and the grace starts on the date that return was received; when it was for nsf,\
        \ unauthorized_debit or card_chargeback, the grace starts on the date its debit was last presented;\
        \ when it was never returned, the grace starts on its scheduled due date."
      presuspension_paid_count: "where the kept installment payments are the installment payments received\
        \ under the plan less those returned"
      presuspension_missed_12m: "no missed entry recorded in the last twelve months"
      type_grace_days: "the grace length is the type's grace period for the plan's funding method (grace_period_days_autopay\
        \ for automatic debit, grace_period_days_manual for manual payment)"
      grace_length: "a plan with at least three kept installment payments and no missed entry recorded in\
        \ the last twelve months takes a grace length of nine days; a plan with at least three kept installment\
        \ payments and at least one missed entry recorded in the last twelve months takes four days; a plan\
        \ with fewer than three kept installment payments takes the type's grace period for its funding\
        \ method."
      hold_request_lag: "requested on or after the examined installment's scheduled due date and no more\
        \ than thirty days after it"
      hold_timing_extension: "a hold of a tier that needs documentation, requested on or after the examined\
        \ installment's scheduled due date and no more than thirty days after it, adds two days; a self-attested\
        \ hold requested on or after that date and no more than thirty days after it adds one day; any other\
        \ case, including a hold requested before that date, adds zero days."
      due_weekday: "The weekend-due extension follows the weekday of the examined installment's scheduled\
        \ due date"
      weekend_due_extension: "a due date on a Saturday adds two days, a due date on a Sunday adds one day,\
        \ and a due date on a weekday adds zero days."
      grace_elapsed_days: "The pre-suspension grace elapsed days are the calendar days from the grace start\
        \ to the counting cutoff"
      presuspension_grace: "the pre-suspension grace is the grace length plus the hold-timing extension\
        \ plus the weekend-due extension."
      result: "The missed entry goes to the examined installment when its pre-suspension grace elapsed days\
        \ are more than its pre-suspension grace or when it was never presented for collection; when they\
        \ are not, its grace had not run out by the cutoff and the missed entry goes to the installment\
        \ immediately before it."
    factors:
      - id: "counting_cutoff_by_hold_start"
        effect: >-
          method
        decides: "counting_cutoff"
        bindings:
          - "hold_start_basis_tier"
          - "hold_request_date"
          - "hold_start_date"
          - "counting_cutoff"
        ladder:
          - when: "the suspending hold's (decided on the plan's suspended_date) tier starts holds from the\
              \ request date AND its request_date is earlier than the plan's suspended_date"
            method: "counting stops on the hold's request_date"
          - when: "the suspending hold's (decided on the plan's suspended_date) tier starts holds from the\
              \ decision date AND its start_date is earlier than the plan's suspended_date"
            method: "counting stops on the hold's start_date"
          - when: "otherwise"
            method: "counting stops on the plan's suspended_date"
        baseline:
          counting_cutoff: "F('suspended_date')"
        evidence:
          - "cross_category"
          - "date"
        cross_difficulty: "hardship"
      - id: "presuspension_grace_length_by_record"
        effect: >-
          parameter
        decides: "grace_length"
        bindings:
          - "presuspension_paid_count"
          - "presuspension_missed_12m"
          - "grace_length"
        ladder:
          - when: "at least three kept installment payments AND no missed entry recorded in the last twelve\
              \ months"
            value: "K('grace_days_steady') = 9 days"
          - when: "at least three kept installment payments AND at least one missed entry recorded in the\
              \ last twelve months"
            value: "K('grace_days_watch') = 4 days"
          - when: "fewer than three kept installment payments"
            value: "the type's grace period for the funding method (P('grace_period_days_autopay') / P('grace_period_days_manual'))"
        baseline:
          grace_length: "type_grace_days"
        evidence:
          - "history"
          - "tier_param"
        cross_difficulty: null
      - id: "presuspension_grace_start_by_return"
        effect: >-
          method
        decides: "grace_start"
        bindings:
          - "examined_last_presented"
          - "examined_return_reason"
          - "examined_return_date"
          - "grace_start"
        ladder:
          - when: "the examined installment's most recent return was for account_closed or stop_payment"
            method: "the grace starts on the date that return was received"
          - when: "the most recent return was for nsf, unauthorized_debit or card_chargeback"
            method: "the grace starts on the date the debit was last presented"
          - when: "the installment was never returned"
            method: "the grace starts on the scheduled due date"
        baseline:
          grace_start: "examined_due_date"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
      - id: "presuspension_hold_timing_extension"
        effect: >-
          parameter
        decides: "hold_timing_extension"
        bindings:
          - "hold_needs_documents"
          - "hold_request_lag"
          - "hold_timing_extension"
        ladder:
          - when: "the suspending hold's tier needs documentation AND it was requested on or after the examined\
              \ installment's due date and no more than thirty days after it"
            value: "K('hold_ext_documented') = 2 days"
          - when: "the suspending hold is self-attested AND it was requested on or after that due date and\
              \ no more than thirty days after it"
            value: "K('hold_ext_self_attested') = 1 day"
          - when: "otherwise"
            value: "K('hold_ext_none') = 0 days"
        baseline:
          hold_timing_extension: "K('hold_ext_none')"
        evidence:
          - "cross_category"
          - "date"
        cross_difficulty: "hardship"
      - id: "presuspension_weekend_due_extension"
        effect: >-
          parameter
        decides: "weekend_due_extension"
        bindings:
          - "due_weekday"
          - "weekend_due_extension"
        ladder:
          - when: "the examined installment's scheduled due date fell on a Saturday"
            value: "K('weekend_ext_saturday') = 2 days"
          - when: "it fell on a Sunday"
            value: "K('weekend_ext_sunday') = 1 day"
          - when: "it fell on a weekday"
            value: "K('weekend_ext_none') = 0 days"
        baseline:
          weekend_due_extension: "K('weekend_ext_none')"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
    baseline:
      rule: >-
        The counting cutoff is the date missed-installment counting stopped. The examined installment is
        the last installment whose scheduled due date falls on or before the counting cutoff: the schedule
        anchor installment plus the whole periods from the schedule anchor date to the counting cutoff,
        counted in weeks of seven days for a weekly plan, in fortnights of fourteen days for a biweekly
        plan and in whole calendar months for a monthly plan. The pre-suspension grace elapsed days are
        the calendar days from the grace start to the counting cutoff, and the pre-suspension grace is the
        grace length plus the hold-timing extension plus the weekend-due extension. The missed entry goes
        to the examined installment when its pre-suspension grace elapsed days are more than its pre-suspension
        grace or when it was never presented for collection; when they are not, its grace had not run out
        by the cutoff and the missed entry goes to the installment immediately before it. In the standard
        method the counting cutoff is the plan's suspended_date, the grace starts on the examined installment's
        scheduled due date, the grace length is the type's grace period for the plan's funding method (grace_period_days_autopay
        for automatic debit, grace_period_days_manual for manual payment), and both extensions are zero
        days.
      params:
        - "grace_period_days_autopay"
        - "grace_period_days_manual"
        - "hold_ext_none"
        - "weekend_ext_none"
    inputs:
      history:
        - table: "plan_installments"
          aggregate: "latest"
          field: "due_date"
          filters:
            event_type: "plan_installment_paid"
        - table: "plan_installments"
          aggregate: "latest"
          field: "return_reason"
          filters:
            event_type: "plan_installment_returned"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          filters:
            event_type: "plan_installment_paid"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 12
          filters:
            event_type: "plan_installment_missed"
      cross_category:
        - "hardship"
  # --------------------------------------------------------------------------
  # claimed by task 1: resuming a plan after a hardship suspension (prerequisite problem)
  # --------------------------------------------------------------------------
  - id: "plan_ext_post_hold_resumption"
    base_policy_refs:
      - "plan_evt_suspension"
    overwrite: []
    trigger: "on_request"
    subject:
      - "plan_resumed"
    computes: "days_to_first_installment"
    target_tool: "resume_suspended_plan_416c1e83"
    params: {long_hold_days: 60, restart_lead_assisted: 22, restart_lead_documented: 17, quiet_end_window_days: 7,
      cooldown_heavy_returns: 3, cooldown_days_heavy: 6, cooldown_days_light: 3, cooldown_days_none: 0,
      statement_days_relief_credit: 5, statement_days_other_credit: 2, statement_days_none: 0, aligned_paid_min: 3}
    rule: >-
      When the hold that suspended a plan has ended and the consumer agrees to restart, the plan resumes:
      the first installment after resumption is the first unpaid installment, later installments follow
      on the plan's frequency, and final_due_date moves by the same amount. A suspended plan is not resumed
      until its installment history carries a missed entry for the last installment whose pre-suspension
      grace had run out by the date missed-installment counting stopped. The restart days are the calendar
      days from the resumption date, the handling date, to the due date of the first installment after resumption.
      The earliest restart day is the restart clock offset plus the restart lead plus the returned-debit
      cool-down plus the statement lead, counted in calendar days from the handling date, and the restart
      days are the earliest restart day placed on the plan's schedule by the restart alignment, never fewer
      than the type's resume_min_days_to_next_installment. In the standard method the restart clock offset
      is zero, so the clock starts on the handling date, the restart lead is the type's resume_min_days_to_next_installment,
      the returned-debit cool-down and the statement lead are zero days, and the restart days are the earliest
      restart day itself. The restart lead follows the hardship hold that suspended the plan, which is the
      hold on the plan's account whose decision_date is the plan's suspended_date: a hold that lasted at
      least sixty days, counted from its start_date to its ended_date, and on which the client recorded
      an approved_full or approved_partial financial assistance decision takes a restart lead of twenty-two
      days; a hold that lasted at least sixty days, needed documentation and carries no such approved decision
      takes seventeen days; any other hold takes the type's resume_min_days_to_next_installment. The restart
      clock offset follows outbound contact after the hold: when the hold's tier paused outbound calls and
      contact may not yet resume, that is when the hold's ended_date plus the tier's contact_resume_delay_days
      is still after the handling date, the clock starts on the date contact may resume and the offset is
      the days from the handling date to that date; when the hold's tier did not pause outbound calls and
      the hold ended no more than seven days before the handling date, the clock starts on the day after
      the hold's ended_date and the offset is the days from the handling date to that day, which may be
      negative; otherwise the clock starts on the handling date and the offset is zero. The returned-debit
      cool-down follows the plan's returned installment payments in the last six months: three or more returns
      add six days, one or two returns add three days, and none adds zero days. The statement lead follows
      the client credits booked to the placed account in the last three months: a charity_care_writeoff
      or insurance_payment credit adds five days, so the consumer has the corrected statement before the
      first restarted debit; any other client credit adds two days; no client credit adds zero days. The
      restart alignment follows the plan's frequency and record, where the kept installment payments are
      the installment payments received under the plan less those returned: a monthly plan with at least
      three kept installment payments keeps its due day of the month, taken from the schedule anchor date,
      and restarts on the first such day on or after the earliest restart day; a weekly or biweekly plan
      with at least three kept installment payments keeps its cycle and restarts on the first date on or
      after the earliest restart day that lies a whole number of periods from the schedule anchor date;
      a plan with fewer than three kept installment payments restarts on the earliest restart day itself.
      Periods of six and three months are counted in whole months back from the handling date.
    prerequisite:
      - problem: "plan_ext_presuspension_missed_entry"
        kind: "state_gate"
        gate: "plan_installments.event_type"
        form: "state"
        policy_source: >-
          A suspended plan is not resumed until its installment history carries a missed entry for the last
          installment whose pre-suspension grace had run out by the date missed-installment counting stopped.
        condition: >-
          plan_installments carries a plan_installment_missed row for the last installment whose pre-suspension
          grace had run out by the date missed-installment counting stopped, as the pre-suspension missed-entry
          policy determines it.
        resolved_by: "record_missed_installment_d21cca89"
        effect: >-
          Once the pre-suspension miss is on the installment history, the plan may be resumed; the missed-installment
          count the later schedule restarts from is complete.
    cross_category:
      - category: "hardship"
        as: "history"
        reads:
          - "start_date"
          - "ended_date"
          - "documentation_required"
          - "outbound_calls_paused"
          - "contact_resume_delay_days"
          - "hardship_hold_events.assistance_outcome"
          - "hold_id"
          - "decision_date"
        note: "The restart lead and the restart clock offset are decided from the ended hold, its tier and\
          \ the client's financial assistance decision on its event history."
      - category: "account"
        as: "history"
        reads:
          - "account_transactions.event_type"
          - "account_transactions.adjustment_reason"
          - "account_transactions.txn_date"
        note: "The statement lead is decided from client credits booked to the placed account in the last\
          \ three months."
    compute:
      - suspending_hold_id: "CFIELD('hardship', 'hold_id', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_started: "CFIELD('hardship', 'start_date', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_ended: "CFIELD('hardship', 'ended_date', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_needs_documents: "CPARAM('hardship', 'documentation_required', account_id=F('account_id'),\
          \ decision_date=F('suspended_date'))"
      - hold_paused_calls: "CPARAM('hardship', 'outbound_calls_paused', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_contact_delay: "CPARAM('hardship', 'contact_resume_delay_days', account_id=F('account_id'),\
          \ decision_date=F('suspended_date'))"
      - hold_length_days: "0 if (hold_started == None or hold_ended == None) else DAYS(hold_started, hold_ended)"
      - assistance_outcome_latest: "XLATEST('hardship', 'hardship_hold_events', 'assistance_outcome', date_field='event_date',\
          \ event_type='hardship_assistance_decision_recorded', hold_id=suspending_hold_id)"
      - restart_lead: "K('restart_lead_assisted') if (hold_length_days >= K('long_hold_days') and (assistance_outcome_latest\
          \ == 'approved_full' or assistance_outcome_latest == 'approved_partial')) else (K('restart_lead_documented')\
          \ if (hold_length_days >= K('long_hold_days') and hold_needs_documents == True and not (assistance_outcome_latest\
          \ == 'approved_full' or assistance_outcome_latest == 'approved_partial')) else P('resume_min_days_to_next_installment'))"
      - days_since_hold_end: "0 if hold_ended == None else DAYS(hold_ended, NOW)"
      - contact_resume_offset: "0 if (hold_ended == None or hold_contact_delay == None) else hold_contact_delay\
          \ - days_since_hold_end"
      - restart_clock_offset: "contact_resume_offset if (hold_paused_calls == True and contact_resume_offset\
          \ > 0) else ((1 - days_since_hold_end) if (hold_paused_calls == False and hold_ended != None and\
          \ days_since_hold_end <= K('quiet_end_window_days')) else 0)"
      - returns_6m: "COUNT('plan_installments', within_months=6, date_field='txn_date', event_type='plan_installment_returned')"
      - returned_debit_cooldown: "K('cooldown_days_heavy') if returns_6m >= K('cooldown_heavy_returns')\
          \ else (K('cooldown_days_light') if returns_6m >= 1 else K('cooldown_days_none'))"
      - relief_credits_3m: "XCOUNT('account', 'account_transactions', within_months=3, date_field='txn_date',\
          \ event_type='account_client_adjustment', adjustment_reason='charity_care_writeoff', account_id=F('account_id'))\
          \ + XCOUNT('account', 'account_transactions', within_months=3, date_field='txn_date', event_type='account_client_adjustment',\
          \ adjustment_reason='insurance_payment', account_id=F('account_id'))"
      - all_credits_3m: "XCOUNT('account', 'account_transactions', within_months=3, date_field='txn_date',\
          \ event_type='account_client_adjustment', account_id=F('account_id'))"
      - statement_lead: "K('statement_days_relief_credit') if relief_credits_3m >= 1 else (K('statement_days_other_credit')\
          \ if all_credits_3m >= 1 else K('statement_days_none'))"
      - earliest_restart_day: "restart_clock_offset + restart_lead + returned_debit_cooldown + statement_lead"
      - restart_paid_count: "COUNT('plan_installments', event_type='plan_installment_paid') - COUNT('plan_installments',\
          \ event_type='plan_installment_returned')"
      - now_ordinal: "DAYS('1970-01-01', NOW)"
      - earliest_z: "now_ordinal + earliest_restart_day + 719468"
      - earliest_doe: "earliest_z - (earliest_z // 146097) * 146097"
      - earliest_yoe: "(earliest_doe - earliest_doe // 1460 + earliest_doe // 36524 - earliest_doe // 146096)\
          \ // 365"
      - earliest_doy: "earliest_doe - (365 * earliest_yoe + earliest_yoe // 4 - earliest_yoe // 100)"
      - earliest_mp: "(5 * earliest_doy + 2) // 153"
      - earliest_day: "earliest_doy - (153 * earliest_mp + 2) // 5 + 1"
      - earliest_month: "earliest_mp + 3 if earliest_mp < 10 else earliest_mp - 9"
      - earliest_year: "earliest_yoe + (earliest_z // 146097) * 400 + (1 if earliest_month <= 2 else 0)"
      - anchor_z: "DAYS('1970-01-01', F('schedule_anchor_date')) + 719468"
      - anchor_doe: "anchor_z - (anchor_z // 146097) * 146097"
      - anchor_yoe: "(anchor_doe - anchor_doe // 1460 + anchor_doe // 36524 - anchor_doe // 146096) // 365"
      - anchor_doy: "anchor_doe - (365 * anchor_yoe + anchor_yoe // 4 - anchor_yoe // 100)"
      - anchor_mp: "(5 * anchor_doy + 2) // 153"
      - plan_due_day: "anchor_doy - (153 * anchor_mp + 2) // 5 + 1"
      - target_month: "earliest_month if earliest_day <= plan_due_day else (1 if earliest_month == 12 else\
          \ earliest_month + 1)"
      - target_year: "earliest_year if (earliest_day <= plan_due_day or earliest_month < 12) else earliest_year\
          \ + 1"
      - target_y_shift: "target_year - (1 if target_month <= 2 else 0)"
      - target_ordinal: "(target_y_shift // 400) * 146097 + (target_y_shift - (target_y_shift // 400) *\
          \ 400) * 365 + (target_y_shift - (target_y_shift // 400) * 400) // 4 - (target_y_shift - (target_y_shift\
          \ // 400) * 400) // 100 + (153 * (target_month + (-3 if target_month > 2 else 9)) + 2) // 5 +\
          \ plan_due_day - 1 - 719468"
      - anchor_offset: "DAYS(NOW, F('schedule_anchor_date'))"
      - cycle_days: "7 if F('payment_frequency') == 'weekly' else 14"
      - restart_alignment: "(target_ordinal - now_ordinal) if (F('payment_frequency') == 'monthly' and restart_paid_count\
          \ >= K('aligned_paid_min')) else ((anchor_offset + ((earliest_restart_day - anchor_offset + cycle_days\
          \ - 1) // cycle_days) * cycle_days) if ((F('payment_frequency') == 'weekly' or F('payment_frequency')\
          \ == 'biweekly') and restart_paid_count >= K('aligned_paid_min')) else earliest_restart_day)"
      - result: "MX(P('resume_min_days_to_next_installment'), restart_alignment)"
    compute_basis:
      hold_started: "counted from its start_date to its ended_date"
      hold_ended: "counted from its start_date to its ended_date"
      hold_needs_documents: "needed documentation and carries no such approved decision"
      hold_paused_calls: "when the hold's tier paused outbound calls and contact may not yet resume"
      hold_contact_delay: "the hold's ended_date plus the tier's contact_resume_delay_days is still after\
        \ the handling date"
      hold_length_days: "a hold that lasted at least sixty days, counted from its start_date to its ended_date"
      assistance_outcome_latest: "on which the client recorded an approved_full or approved_partial financial\
        \ assistance decision"
      restart_lead: "a hold that lasted at least sixty days, counted from its start_date to its ended_date,\
        \ and on which the client recorded an approved_full or approved_partial financial assistance decision\
        \ takes a restart lead of twenty-two days; a hold that lasted at least sixty days, needed documentation\
        \ and carries no such approved decision takes seventeen days; any other hold takes the type's resume_min_days_to_next_installment."
      days_since_hold_end: "the hold ended no more than seven days before the handling date"
      contact_resume_offset: "the clock starts on the date contact may resume and the offset is the days\
        \ from the handling date to that date"
      restart_clock_offset: "when the hold's tier paused outbound calls and contact may not yet resume,\
        \ that is when the hold's ended_date plus the tier's contact_resume_delay_days is still after the\
        \ handling date, the clock starts on the date contact may resume and the offset is the days from\
        \ the handling date to that date; when the hold's tier did not pause outbound calls and the hold\
        \ ended no more than seven days before the handling date, the clock starts on the day after the\
        \ hold's ended_date and the offset is the days from the handling date to that day, which may be\
        \ negative; otherwise the clock starts on the handling date and the offset is zero."
      returns_6m: "The returned-debit cool-down follows the plan's returned installment payments in the\
        \ last six months"
      returned_debit_cooldown: "three or more returns add six days, one or two returns add three days, and\
        \ none adds zero days."
      relief_credits_3m: "a charity_care_writeoff or insurance_payment credit adds five days"
      all_credits_3m: "any other client credit adds two days"
      statement_lead: "a charity_care_writeoff or insurance_payment credit adds five days, so the consumer\
        \ has the corrected statement before the first restarted debit; any other client credit adds two\
        \ days; no client credit adds zero days."
      earliest_restart_day: "The earliest restart day is the restart clock offset plus the restart lead\
        \ plus the returned-debit cool-down plus the statement lead, counted in calendar days from the handling\
        \ date"
      restart_paid_count: "where the kept installment payments are the installment payments received under\
        \ the plan less those returned"
      plan_due_day: "keeps its due day of the month, taken from the schedule anchor date"
      target_ordinal: "restarts on the first such day on or after the earliest restart day"
      restart_alignment: "a monthly plan with at least three kept installment payments keeps its due day\
        \ of the month, taken from the schedule anchor date, and restarts on the first such day on or after\
        \ the earliest restart day; a weekly or biweekly plan with at least three kept installment payments\
        \ keeps its cycle and restarts on the first date on or after the earliest restart day that lies\
        \ a whole number of periods from the schedule anchor date; a plan with fewer than three kept installment\
        \ payments restarts on the earliest restart day itself."
      result: "the restart days are the earliest restart day placed on the plan's schedule by the restart\
        \ alignment, never fewer than the type's resume_min_days_to_next_installment."
      suspending_hold_id: "the hardship hold that suspended the plan, which is the hold on the plan's account\
        \ whose decision_date is the plan's suspended_date"
    factors:
      - id: "restart_lead_by_ended_hold"
        effect: >-
          parameter
        decides: "restart_lead"
        bindings:
          - "hold_needs_documents"
          - "hold_length_days"
          - "assistance_outcome_latest"
          - "restart_lead"
        ladder:
          - when: "the hold lasted at least sixty days AND the client recorded an approved_full or approved_partial\
              \ financial assistance decision on it"
            value: "K('restart_lead_assisted') = 22 days"
          - when: "the hold lasted at least sixty days AND it needed documentation AND no approved decision\
              \ is on it"
            value: "K('restart_lead_documented') = 17 days"
          - when: "otherwise"
            value: "P('resume_min_days_to_next_installment') (the type's minimum)"
        baseline:
          restart_lead: "P('resume_min_days_to_next_installment')"
        evidence:
          - "cross_category"
          - "date"
        cross_difficulty: "hardship"
      - id: "restart_clock_by_contact_resumption"
        effect: >-
          method
        decides: "restart_clock_offset"
        bindings:
          - "hold_paused_calls"
          - "hold_contact_delay"
          - "days_since_hold_end"
          - "contact_resume_offset"
          - "restart_clock_offset"
        ladder:
          - when: "the hold's tier paused outbound calls AND contact may not yet resume (ended_date + contact_resume_delay_days\
              \ after the handling date)"
            method: "the clock starts on the date contact may resume"
          - when: "the hold's tier did not pause outbound calls AND the hold ended no more than seven days\
              \ before the handling date"
            method: "the clock starts on the day after the hold's ended_date"
          - when: "otherwise"
            method: "the clock starts on the handling date"
        baseline:
          restart_clock_offset: "0"
        evidence:
          - "cross_category"
          - "date"
        cross_difficulty: "hardship"
      - id: "restart_returned_debit_cooldown"
        effect: >-
          parameter
        decides: "returned_debit_cooldown"
        bindings:
          - "returns_6m"
          - "returned_debit_cooldown"
        ladder:
          - when: "three or more returned installment payments in the last six months"
            value: "K('cooldown_days_heavy') = 6 days"
          - when: "one or two returned installment payments in the last six months"
            value: "K('cooldown_days_light') = 3 days"
          - when: "no returned installment payment in the last six months"
            value: "K('cooldown_days_none') = 0 days"
        baseline:
          returned_debit_cooldown: "K('cooldown_days_none')"
        evidence:
          - "history"
        cross_difficulty: null
      - id: "restart_statement_lead_by_credits"
        effect: >-
          parameter
        decides: "statement_lead"
        bindings:
          - "relief_credits_3m"
          - "all_credits_3m"
          - "statement_lead"
        ladder:
          - when: "a charity_care_writeoff or insurance_payment client credit booked to the placed account\
              \ in the last three months"
            value: "K('statement_days_relief_credit') = 5 days"
          - when: "only other client credits booked in the last three months"
            value: "K('statement_days_other_credit') = 2 days"
          - when: "no client credit in the last three months"
            value: "K('statement_days_none') = 0 days"
        baseline:
          statement_lead: "K('statement_days_none')"
        evidence:
          - "cross_category"
          - "history"
        cross_difficulty: "account"
      - id: "restart_alignment_by_frequency"
        effect: >-
          method
        decides: "restart_alignment"
        bindings:
          - "restart_paid_count"
          - "restart_alignment"
        ladder:
          - when: "monthly plan AND at least three kept installment payments"
            method: "restart on the first day carrying the plan's due day of the month on or after the earliest\
              \ restart day"
          - when: "weekly or biweekly plan AND at least three kept installment payments"
            method: "restart on the first cycle date (whole periods from the schedule anchor date) on or\
              \ after the earliest restart day"
          - when: "fewer than three kept installment payments"
            method: "restart on the earliest restart day itself"
        baseline:
          restart_alignment: "earliest_restart_day"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
    baseline:
      rule: >-
        The restart days are the calendar days from the resumption date, the handling date, to the due date
        of the first installment after resumption. The earliest restart day is the restart clock offset
        plus the restart lead plus the returned-debit cool-down plus the statement lead, counted in calendar
        days from the handling date, and the restart days are the earliest restart day placed on the plan's
        schedule by the restart alignment, never fewer than the type's resume_min_days_to_next_installment.
        In the standard method the restart clock offset is zero, so the clock starts on the handling date,
        the restart lead is the type's resume_min_days_to_next_installment, the returned-debit cool-down
        and the statement lead are zero days, and the restart days are the earliest restart day itself.
      params:
        - "resume_min_days_to_next_installment"
        - "cooldown_days_none"
        - "statement_days_none"
    inputs:
      history:
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 6
          filters:
            event_type: "plan_installment_returned"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          filters:
            event_type: "plan_installment_paid"
        - category: "hardship"
          table: "hardship_hold_events"
          aggregate: "latest"
          field: "assistance_outcome"
          filters:
            event_type: "hardship_assistance_decision_recorded"
        - category: "account"
          table: "account_transactions"
          aggregate: "count"
          field: "txn_id"
          within_months: 3
          filters:
            event_type: "account_client_adjustment"
      cross_category:
        - "hardship"
        - "account"
  # --------------------------------------------------------------------------
  # claimed by task 1: re-aging the pre-suspension missed installment (prerequisite problem)
  # --------------------------------------------------------------------------
  - id: "plan_ext_post_hold_reaging"
    base_policy_refs:
      - "plan_agg_combined_affordability"
      - "plan_evt_schedule_changes"
      - "plan_eligibility_and_terms"
    overwrite:
      - base_policy: "plan_evt_schedule_changes"
        superseded_clause: >-
          it moves the next unpaid installment to one period after the current final installment, extending
          final_due_date by one period
        replaced_by: >-
          In the standard method the re-aged remainder is spread evenly over the installments that follow
          the re-aged installment: the regular installment after the change is the regular installment plus
          the re-aged remainder divided by the number of those installments, the share rounded up to the
          type's installment_rounding_unit_usd; the term tolling and the good-faith allowance are zero days
          and the term window starts on the plan's created_date.
    trigger: "state_due"
    subject:
      - "plan_schedule_change_recorded"
    computes: "installment_amount"
    target_tool: "reage_missed_installment_128922de"
    params: {tolling_days_documented: 30, tolling_days_self_attested: 15, tolling_days_none: 0, tolling_recent_days: 90,
      goodfaith_days_strong: 31, goodfaith_days_partial: 14, goodfaith_days_none: 0, goodfaith_share: 0.3333,
      final_only_remaining_max: 3, authorization_lag_days: 3}
    rule: >-
      The re-aging deferral re-ages the installment carrying a plan's most recent missed entry from before
      a hardship suspension, and it is recorded once with the regular installment amount after the change.
      Under every method the deferral places the re-aged installment one period after the plan's current
      final installment; where the re-aged remainder is spread, that installment carries only what the arrangement_balance
      still leaves after the installments before it, the last installment absorbing the difference as the
      final installment absorbs rounding at set-up. The re-aged remainder is that installment's amount less
      the installment payments applied to it and not returned. The re-aging deferral is recorded only after
      the plan's status is active again after its suspension. The re-aging method is not settled until the
      installment history carries the missed entry of the installment being re-aged. The term window is
      the type's max_days_to_final_installment plus the term tolling plus the good-faith allowance, counted
      in calendar days from the term window start; one period after the plan's current final installment
      is seven days later for a weekly plan, fourteen days later for a biweekly plan and the same day of
      the following month for a monthly plan. In the standard method the re-aged remainder is spread evenly
      over the installments that follow the re-aged installment: the regular installment after the change
      is the regular installment plus the re-aged remainder divided by the number of those installments,
      the share rounded up to the type's installment_rounding_unit_usd; the term tolling and the good-faith
      allowance are zero days and the term window starts on the plan's created_date. The re-aging method
      follows the plan's term window: when the re-aged installment, placed one period after the plan's current
      final installment, still falls within the extended term window, it is appended there and the regular
      installment is unchanged; when it does not and fewer than three installments follow the re-aged installment,
      the re-aged remainder is spread evenly over those installments and the re-aged installment's own new
      place together, the share rounded up to the type's installment_rounding_unit_usd; otherwise the re-aged
      remainder is spread as in the standard method. The term tolling follows the hardship hold that suspended
      the plan, which is the hold on the plan's account whose decision_date is the plan's suspended_date:
      a hold of a tier that needs documentation and that ended no more than ninety days before the handling
      date tolls the term by thirty days; a self-attested hold that ended no more than ninety days before
      the handling date tolls it by fifteen days; any other case tolls it by zero days. The good-faith allowance
      follows the consumer's own payments on the re-aged installment beyond its scheduled debits, that is
      its debit_card, credit_card, check_by_mail, money_order and cash_payment_network payments: when they
      reach at least one third of the installment amount and none of them was returned, the allowance is
      thirty-one days; when they are above zero but below one third and none was returned, it is fourteen
      days; otherwise it is zero days. The term window start follows how the plan began: a plan that took
      a down payment counts its term from the scheduled due date of installment 1 as carried on its payment
      entries, and when installment 1 carries no payment entry it is treated as a plan without a down payment;
      a plan without a down payment that was authorized more than three days after its created_date counts
      its term from its authorization_date; any other plan counts its term from its created_date. When no
      missed entry stands on the plan, the schedule anchor installment stands in for the re-aged installment
      in the re-aged remainder and in the installments that follow it, and the good-faith allowance is zero
      days.
    prerequisite:
      - problem: "plan_ext_post_hold_resumption"
        kind: "state_gate"
        gate: "plan_evt_schedule_changes.change_on_active_plan"
        form: "state"
        policy_source: >-
          The re-aging deferral is recorded only after the plan's status is active again after its suspension.
        condition: >-
          payment_plans.status is active and the plan carries a suspended_date, the suspension having been
          lifted by a resumption.
        resolved_by: "resume_suspended_plan_416c1e83"
        effect: >-
          The plan leaves suspended status, so the schedule change the re-aging deferral records is granted
          on an active plan; the resumed schedule also sets the final due date the re-aging method is measured
          against.
      - problem: "plan_ext_presuspension_missed_entry"
        kind: "value_input"
        gate: "reaged_installment"
        form: "state"
        policy_source: >-
          The re-aging method is not settled until the installment history carries the missed entry of the
          installment being re-aged.
        condition: >-
          plan_installments carries a plan_installment_missed row for the pre-suspension installment that
          is re-aged.
        resolved_by: "record_missed_installment_d21cca89"
        effect: >-
          The missed entry names the re-aged installment, which decides the re-aged remainder and the good-faith
          allowance read from that installment's own payments.
    cross_category:
      - category: "hardship"
        as: "branch"
        reads:
          - "documentation_required"
          - "ended_date"
          - "decision_date"
        note: "The term tolling is decided from the tier and the ended_date of the hardship hold that suspended\
          \ the plan."
    compute:
      - reaged_installment: "LATEST('plan_installments', 'installment_number', date_field='txn_date', event_type='plan_installment_missed')"
      - reaged_number: "F('schedule_anchor_installment') if reaged_installment == None else reaged_installment"
      - reaged_net_paid: "SUM('plan_installments', 'amount', event_type='plan_installment_paid', installment_number=reaged_number)\
          \ - SUM('plan_installments', 'amount', event_type='plan_installment_returned', installment_number=reaged_number)"
      - reaged_remainder: "MX(0, F('installment_amount') - reaged_net_paid)"
      - installments_after: "F('installment_count') - reaged_number - 1"
      - hold_needs_documents: "CPARAM('hardship', 'documentation_required', account_id=F('account_id'),\
          \ decision_date=F('suspended_date'))"
      - hold_ended: "CFIELD('hardship', 'ended_date', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - days_since_hold_end: "100000 if hold_ended == None else DAYS(hold_ended, NOW)"
      - term_tolling: "K('tolling_days_documented') if (hold_needs_documents == True and days_since_hold_end\
          \ <= K('tolling_recent_days')) else (K('tolling_days_self_attested') if (hold_needs_documents\
          \ == False and days_since_hold_end <= K('tolling_recent_days')) else K('tolling_days_none'))"
      - own_payments: "SUM('plan_installments', 'amount', event_type='plan_installment_paid', installment_number=reaged_installment,\
          \ payment_channel='debit_card') + SUM('plan_installments', 'amount', event_type='plan_installment_paid',\
          \ installment_number=reaged_installment, payment_channel='credit_card') + SUM('plan_installments',\
          \ 'amount', event_type='plan_installment_paid', installment_number=reaged_installment, payment_channel='check_by_mail')\
          \ + SUM('plan_installments', 'amount', event_type='plan_installment_paid', installment_number=reaged_installment,\
          \ payment_channel='money_order') + SUM('plan_installments', 'amount', event_type='plan_installment_paid',\
          \ installment_number=reaged_installment, payment_channel='cash_payment_network')"
      - own_payments_returned: "COUNT('plan_installments', event_type='plan_installment_returned', installment_number=reaged_installment,\
          \ payment_channel='debit_card') + COUNT('plan_installments', event_type='plan_installment_returned',\
          \ installment_number=reaged_installment, payment_channel='credit_card') + COUNT('plan_installments',\
          \ event_type='plan_installment_returned', installment_number=reaged_installment, payment_channel='check_by_mail')\
          \ + COUNT('plan_installments', event_type='plan_installment_returned', installment_number=reaged_installment,\
          \ payment_channel='money_order') + COUNT('plan_installments', event_type='plan_installment_returned',\
          \ installment_number=reaged_installment, payment_channel='cash_payment_network')"
      - goodfaith_allowance: "K('goodfaith_days_strong') if (own_payments >= F('installment_amount') * K('goodfaith_share')\
          \ and own_payments_returned == 0) else (K('goodfaith_days_partial') if (own_payments > 0 and own_payments_returned\
          \ == 0) else K('goodfaith_days_none'))"
      - first_regular_due: "LATEST('plan_installments', 'due_date', date_field='txn_date', event_type='plan_installment_paid',\
          \ installment_number=1)"
      - term_window_start: "first_regular_due if (F('down_payment_amount') > 0 and first_regular_due !=\
          \ None) else (F('authorization_date') if ((F('down_payment_amount') == 0 or first_regular_due\
          \ == None) and F('authorization_date') != None and F('authorization_date') != '' and DAYS(F('created_date'),\
          \ F('authorization_date')) > K('authorization_lag_days')) else F('created_date'))"
      - final_z: "DAYS('1970-01-01', F('final_due_date')) + 719468"
      - final_doe: "final_z - (final_z // 146097) * 146097"
      - final_yoe: "(final_doe - final_doe // 1460 + final_doe // 36524 - final_doe // 146096) // 365"
      - final_doy: "final_doe - (365 * final_yoe + final_yoe // 4 - final_yoe // 100)"
      - final_mp: "(5 * final_doy + 2) // 153"
      - final_day: "final_doy - (153 * final_mp + 2) // 5 + 1"
      - final_month: "final_mp + 3 if final_mp < 10 else final_mp - 9"
      - final_year: "final_yoe + (final_z // 146097) * 400 + (1 if final_month <= 2 else 0)"
      - next_month: "1 if final_month == 12 else final_month + 1"
      - next_year: "final_year + 1 if final_month == 12 else final_year"
      - next_y_shift: "next_year - (1 if next_month <= 2 else 0)"
      - next_month_days: "(next_month + (-3 if next_month > 2 else 9))"
      - month_after_final_ordinal: "(next_y_shift // 400) * 146097 + (next_y_shift - (next_y_shift // 400)\
          \ * 400) * 365 + (next_y_shift - (next_y_shift // 400) * 400) // 4 - (next_y_shift - (next_y_shift\
          \ // 400) * 400) // 100 + (153 * next_month_days + 2) // 5 + final_day - 1 - 719468"
      - placed_after_final_days: "DAYS(term_window_start, F('final_due_date')) + (7 if F('payment_frequency')\
          \ == 'weekly' else (14 if F('payment_frequency') == 'biweekly' else month_after_final_ordinal\
          \ - DAYS('1970-01-01', F('final_due_date'))))"
      - term_window_days: "P('max_days_to_final_installment') + term_tolling + goodfaith_allowance"
      - spread_share: "-((-reaged_remainder / MX(1, installments_after)) // P('installment_rounding_unit_usd'))\
          \ * P('installment_rounding_unit_usd')"
      - reaging_amount: "F('installment_amount') if placed_after_final_days <= term_window_days else ((F('installment_amount')\
          \ - ((-reaged_remainder / MX(1, installments_after + 1)) // P('installment_rounding_unit_usd'))\
          \ * P('installment_rounding_unit_usd')) if installments_after < K('final_only_remaining_max')\
          \ else F('installment_amount') + spread_share)"
      - result: "RND(reaging_amount, 2)"
    compute_basis:
      reaged_installment: "The re-aging deferral re-ages the installment carrying a plan's most recent missed\
        \ entry from before a hardship suspension"
      reaged_number: "When no missed entry stands on the plan, the schedule anchor installment stands in\
        \ for the re-aged installment in the re-aged remainder and in the installments that follow it"
      reaged_net_paid: "The re-aged remainder is that installment's amount less the installment payments\
        \ applied to it and not returned."
      reaged_remainder: "The re-aged remainder is that installment's amount less the installment payments\
        \ applied to it and not returned."
      installments_after: "spread evenly over the installments that follow the re-aged installment"
      hold_needs_documents: "the hardship hold that suspended the plan, which is the hold on the plan's\
        \ account whose decision_date is the plan's suspended_date"
      hold_ended: "that ended no more than ninety days before the handling date"
      days_since_hold_end: "that ended no more than ninety days before the handling date"
      term_tolling: "a hold of a tier that needs documentation and that ended no more than ninety days before\
        \ the handling date tolls the term by thirty days; a self-attested hold that ended no more than\
        \ ninety days before the handling date tolls it by fifteen days; any other case tolls it by zero\
        \ days."
      own_payments: "the consumer's own payments on the re-aged installment beyond its scheduled debits,\
        \ that is its debit_card, credit_card, check_by_mail, money_order and cash_payment_network payments"
      own_payments_returned: "none of them was returned"
      goodfaith_allowance: "when they reach at least one third of the installment amount and none of them\
        \ was returned, the allowance is thirty-one days; when they are above zero but below one third and\
        \ none was returned, it is fourteen days; otherwise it is zero days."
      first_regular_due: "a plan that took a down payment counts its term from the scheduled due date of\
        \ installment 1 as carried on its payment entries"
      term_window_start: "a plan that took a down payment counts its term from the scheduled due date of\
        \ installment 1 as carried on its payment entries, and when installment 1 carries no payment entry\
        \ it is treated as a plan without a down payment; a plan without a down payment that was authorized\
        \ more than three days after its created_date counts its term from its authorization_date; any other\
        \ plan counts its term from its created_date."
      month_after_final_ordinal: "the same day of the following month for a monthly plan"
      placed_after_final_days: "one period after the plan's current final installment is seven days later\
        \ for a weekly plan, fourteen days later for a biweekly plan and the same day of the following month\
        \ for a monthly plan."
      term_window_days: "The term window is the type's max_days_to_final_installment plus the term tolling\
        \ plus the good-faith allowance, counted in calendar days from the term window start"
      spread_share: "the regular installment after the change is the regular installment plus the re-aged\
        \ remainder divided by the number of those installments, the share rounded up to the type's installment_rounding_unit_usd"
      reaging_amount: "when the re-aged installment, placed one period after the plan's current final installment,\
        \ still falls within the extended term window, it is appended there and the regular installment\
        \ is unchanged; when it does not and fewer than three installments follow the re-aged installment,\
        \ the re-aged remainder is spread evenly over those installments and the re-aged installment's own\
        \ new place together, the share rounded up to the type's installment_rounding_unit_usd; otherwise\
        \ the re-aged remainder is spread as in the standard method."
      result: "recorded once with the regular installment amount after the change"
    factors:
      - id: "reaging_method_by_term_window"
        effect: >-
          method
        decides: "reaging_amount"
        bindings:
          - "placed_after_final_days"
          - "term_window_days"
          - "reaging_amount"
        ladder:
          - when: "the re-aged installment placed one period after the current final installment falls within\
              \ the extended term window"
            method: "append it after the final installment; the regular installment is unchanged"
          - when: "it does not fall within the window AND fewer than three installments follow the re-aged\
              \ installment"
            method: "spread the re-aged remainder over the following installments and the re-aged installment's\
              \ own new place together (count plus one)"
          - when: "otherwise"
            method: "spread the re-aged remainder evenly over the following installments (standard method)"
        baseline:
          reaging_amount: "F('installment_amount') + spread_share"
        evidence:
          - "date"
          - "history"
        cross_difficulty: null
      - id: "reaging_term_tolling_by_hold"
        effect: >-
          parameter
        decides: "term_tolling"
        bindings:
          - "hold_needs_documents"
          - "days_since_hold_end"
          - "term_tolling"
        ladder:
          - when: "the suspending hold's tier needs documentation AND the hold ended no more than ninety\
              \ days before the handling date"
            value: "K('tolling_days_documented') = 30 days"
          - when: "the hold is self-attested AND it ended no more than ninety days before the handling date"
            value: "K('tolling_days_self_attested') = 15 days"
          - when: "otherwise"
            value: "K('tolling_days_none') = 0 days"
        baseline:
          term_tolling: "K('tolling_days_none')"
        evidence:
          - "cross_category"
          - "date"
        cross_difficulty: "hardship"
      - id: "reaging_goodfaith_allowance"
        effect: >-
          parameter
        decides: "goodfaith_allowance"
        bindings:
          - "own_payments"
          - "own_payments_returned"
          - "goodfaith_allowance"
        ladder:
          - when: "the consumer's own payments on the re-aged installment reach at least one third of the\
              \ installment AND none was returned"
            value: "K('goodfaith_days_strong') = 31 days"
          - when: "the consumer's own payments are above zero but below one third AND none was returned"
            value: "K('goodfaith_days_partial') = 14 days"
          - when: "otherwise"
            value: "K('goodfaith_days_none') = 0 days"
        baseline:
          goodfaith_allowance: "K('goodfaith_days_none')"
        evidence:
          - "history"
        cross_difficulty: null
      - id: "reaging_term_window_start"
        effect: >-
          method
        decides: "term_window_start"
        bindings:
          - "first_regular_due"
          - "term_window_start"
        ladder:
          - when: "the plan took a down payment AND installment 1 carries a scheduled due date on its payment\
              \ entries (otherwise it is treated as a plan without a down payment)"
            method: "the term counts from the scheduled due date of installment 1"
          - when: "no down payment AND the plan was authorized more than three days after its created_date"
            method: "the term counts from the authorization_date"
          - when: "otherwise"
            method: "the term counts from the created_date"
        baseline:
          term_window_start: "F('created_date')"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
    baseline:
      rule: >-
        The re-aged remainder is that installment's amount less the installment payments applied to it and
        not returned. The term window is the type's max_days_to_final_installment plus the term tolling
        plus the good-faith allowance, counted in calendar days from the term window start; one period after
        the plan's current final installment is seven days later for a weekly plan, fourteen days later
        for a biweekly plan and the same day of the following month for a monthly plan. In the standard
        method the re-aged remainder is spread evenly over the installments that follow the re-aged installment:
        the regular installment after the change is the regular installment plus the re-aged remainder divided
        by the number of those installments, the share rounded up to the type's installment_rounding_unit_usd;
        the term tolling and the good-faith allowance are zero days and the term window starts on the plan's
        created_date.
      params:
        - "max_days_to_final_installment"
        - "installment_rounding_unit_usd"
        - "tolling_days_none"
        - "goodfaith_days_none"
    inputs:
      history:
        - table: "plan_installments"
          aggregate: "latest"
          field: "installment_number"
          filters:
            event_type: "plan_installment_missed"
        - table: "plan_installments"
          aggregate: "sum"
          field: "amount"
          filters:
            event_type: "plan_installment_paid"
        - table: "plan_installments"
          aggregate: "sum"
          field: "amount"
          filters:
            event_type: "plan_installment_returned"
        - table: "plan_installments"
          aggregate: "latest"
          field: "due_date"
          filters:
            event_type: "plan_installment_paid"
            installment_number: 1
      cross_category:
        - "hardship"
  # --------------------------------------------------------------------------
  # claimed by task 1: the consumer's restructure of the installment after a hardship (root problem, owner=user)
  # --------------------------------------------------------------------------
  - id: "plan_ext_post_hold_restructure"
    base_policy_refs:
      - "plan_agg_combined_affordability"
      - "plan_evt_schedule_changes"
      - "plan_eligibility_and_terms"
    overwrite:
      - base_policy: "plan_evt_schedule_changes"
        superseded_clause: >-
          it re-spreads the current arrangement_balance over a new count of installments
        replaced_by: >-
          The restructure keeps the plan's schedule anchor installment as the first restructured installment
          and re-spreads the restructure balance evenly over the restructured count.
    trigger: "on_request"
    subject:
      - "plan_schedule_change_recorded"
    computes: "installment_amount"
    target_tool: "authorize_restructured_installments_370d01b0"
    params: {recent_hold_days: 60, relief_assisted: 2, relief_documented: 1, relief_none: 0, missed_penalty_repeat: 4,
      missed_penalty_single: 2, missed_penalty_none: 0, return_penalty_heavy: 2, return_penalty_light: 1,
      return_penalty_none: 0, heavy_returns_min: 3, tenure_long_months: 6, tenure_long_paid: 4, tenure_short_months: 3,
      tenure_short_paid: 2, tenure_credit_long: 2, tenure_credit_short: 1, tenure_credit_none: 0, relief_credit_share: 0.25,
      credit_bonus_large: 2, credit_bonus_small: 1, credit_bonus_none: 0, notice_window_days: 3}
    rule: >-
      A consumer whose income has fallen may ask to lower the regular installment of an active plan by a
      restructure, which the consumer authorizes personally, stating the household income for the budget
      review where the type requires one. The restructure keeps the plan's schedule anchor installment as
      the first restructured installment and re-spreads the restructure balance evenly over the restructured
      count. The restructured installment is the restructure balance divided by the restructured count,
      rounded up to the type's installment_rounding_unit_usd; it is never below the type's minimum installment
      for the plan's frequency nor below min_installment_pct_of_balance percent of the restructure balance,
      measured as a monthly equivalent. The base count is the plan's installment_count less its schedule
      anchor installment, the regular installments still to fall due from the anchor on. The restructured
      count is the base count plus the hardship relief, plus the tenure credit, plus the relief-credit bonus,
      less the missed-entry penalty and less the returned-debit penalty, and never more than the type's
      max_installment_count less the schedule anchor installment. In the standard method the restructure
      balance is the plan's whole arrangement_balance, and the hardship relief, the tenure credit, the relief-credit
      bonus and both penalties are zero, so the restructured count is the base count. The restructured installment
      is fixed only after the installment history carries a re-aging deferral for the installment with the
      most recent missed entry. The restructured installment is not worked out before the installment history
      records as missed the last installment whose pre-suspension grace had run out by the time missed-installment
      counting stopped. The restructure balance follows deferrals on the plan: when the plan recorded a
      re-aging deferral in the last month and no debit falls due in the next three days, that is on or after
      the handling date and no more than three days after it, the restructure balance is the arrangement_balance
      less the re-aged remainder, the re-aged installment keeping its own place behind the last restructured
      installment; when the plan recorded a re-aging deferral in the last month and a debit falls due in
      the next three days, that debit is collected at the amount in force and the restructure balance is
      the arrangement_balance less the re-aged remainder and less one regular installment; otherwise the
      restructure balance is the whole arrangement_balance. The re-aged remainder is the re-aged installment's
      regular amount less the installment payments applied to it and not returned. When a re-aged installment
      stands behind the final installment, the restructured installments run from the schedule anchor date
      on the plan's frequency and the re-aged installment moves to one period after the last of them, so
      the plan's final due date after the restructure is the re-aged installment's new due date and the
      installment count after the restructure is the schedule anchor installment plus the restructured count;
      otherwise the final due date is the due date of the last restructured installment. The hardship relief
      follows the hardship hold that suspended the plan, which is the hold on the plan's account whose decision_date
      is the plan's suspended_date: a hold that ended no more than sixty days before the handling date and
      on which the client recorded an approved_full or approved_partial financial assistance decision adds
      two installments; a hold of a tier that needs documentation that ended no more than sixty days before
      the handling date without such a decision adds one installment; any other case adds none. The missed-entry
      penalty follows the plan's missed entries recorded in the last twelve months: two or more take away
      four installments, one takes away two, and none takes away none. The returned-debit penalty follows
      the plan's returned installment payments in the last six months: three or more take away two installments,
      one or two take away one, and none takes away none. The tenure credit follows the plan's age and record,
      where the kept installment payments are the installment payments received under the plan less those
      returned: a plan created at least six whole months before the handling date with at least four kept
      installment payments adds two installments; a plan created at least three whole months before with
      at least two kept installment payments, and not in the first case, adds one; any other plan adds none.
      The relief-credit bonus follows the client credits booked to the placed account in the last twelve
      months for charity_care_writeoff or insurance_payment: credits totalling at least a quarter of the
      account's placed_balance add two installments; smaller such credits add one; no such credit adds none.
    prerequisite:
      - problem: "plan_ext_post_hold_reaging"
        kind: "value_input"
        gate: "restructure_balance"
        form: "state"
        policy_source: >-
          The restructured installment is fixed only after the installment history carries a re-aging deferral
          for the installment with the most recent missed entry.
        condition: >-
          plan_installments carries a plan_schedule_change_recorded row with change_type deferral for the
          installment of the plan's latest plan_installment_missed row.
        resolved_by: "reage_missed_installment_128922de"
        effect: >-
          The re-aging deferral takes the re-aged remainder out of the restructure balance and moves the
          schedule anchor to the next installment, which changes both the restructure balance and the base
          count.
      - problem: "plan_ext_presuspension_missed_entry"
        kind: "value_input"
        gate: "missed_entry_penalty"
        form: "state"
        policy_source: >-
          The restructured installment is not worked out before the installment history records as missed
          the last installment whose pre-suspension grace had run out by the time missed-installment counting
          stopped.
        condition: >-
          plan_installments carries a plan_installment_missed row for the last installment whose pre-suspension
          grace had run out by the date missed-installment counting stopped.
        resolved_by: "record_missed_installment_d21cca89"
        effect: >-
          The missed entry counts toward the missed-entry penalty, which takes installments off the restructured
          count.
    cross_category:
      - category: "hardship"
        as: "history"
        reads:
          - "ended_date"
          - "documentation_required"
          - "hardship_hold_events.assistance_outcome"
          - "hold_id"
          - "decision_date"
        note: "The hardship relief is decided from the consumer's most recent hold on the account and the\
          \ client's financial assistance decision on its event history."
      - category: "account"
        as: "history"
        reads:
          - "placed_balance"
          - "account_transactions.adjustment_reason"
          - "account_transactions.amount"
          - "account_transactions.txn_date"
        note: "The relief-credit bonus is decided from charity care and insurance credits booked to the\
          \ placed account against its placed balance."
    compute:
      - last_reaging_number: "LATEST('plan_installments', 'installment_number', date_field='txn_date', event_type='plan_schedule_change_recorded',\
          \ change_type='deferral')"
      - reagings_last_month: "COUNT('plan_installments', within_months=1, date_field='txn_date', event_type='plan_schedule_change_recorded',\
          \ change_type='deferral')"
      - reaged_net_paid: "0 if last_reaging_number == None else SUM('plan_installments', 'amount', event_type='plan_installment_paid',\
          \ installment_number=last_reaging_number) - SUM('plan_installments', 'amount', event_type='plan_installment_returned',\
          \ installment_number=last_reaging_number)"
      - reaged_remainder: "0 if last_reaging_number == None else MX(0, F('installment_amount') - reaged_net_paid)"
      - debit_within_notice: "DAYS(NOW, F('schedule_anchor_date')) >= 0 and DAYS(NOW, F('schedule_anchor_date'))\
          \ <= K('notice_window_days')"
      - restructure_balance: "(F('arrangement_balance') - reaged_remainder) if (reagings_last_month >= 1\
          \ and not debit_within_notice) else ((F('arrangement_balance') - reaged_remainder - F('installment_amount'))\
          \ if (reagings_last_month >= 1 and debit_within_notice) else F('arrangement_balance'))"
      - base_count: "F('installment_count') - F('schedule_anchor_installment')"
      - suspending_hold_id: "CFIELD('hardship', 'hold_id', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_ended: "CFIELD('hardship', 'ended_date', account_id=F('account_id'), decision_date=F('suspended_date'))"
      - hold_needs_documents: "CPARAM('hardship', 'documentation_required', account_id=F('account_id'),\
          \ decision_date=F('suspended_date'))"
      - hold_end_age: "100000 if hold_ended == None else DAYS(hold_ended, NOW)"
      - assistance_outcome_latest: "XLATEST('hardship', 'hardship_hold_events', 'assistance_outcome', date_field='event_date',\
          \ event_type='hardship_assistance_decision_recorded', hold_id=suspending_hold_id)"
      - hardship_relief: "K('relief_assisted') if (hold_end_age <= K('recent_hold_days') and (assistance_outcome_latest\
          \ == 'approved_full' or assistance_outcome_latest == 'approved_partial')) else (K('relief_documented')\
          \ if (hold_end_age <= K('recent_hold_days') and hold_needs_documents == True and not (assistance_outcome_latest\
          \ == 'approved_full' or assistance_outcome_latest == 'approved_partial')) else K('relief_none'))"
      - missed_12m: "COUNT('plan_installments', within_months=12, date_field='txn_date', event_type='plan_installment_missed')"
      - missed_entry_penalty: "K('missed_penalty_repeat') if missed_12m >= 2 else (K('missed_penalty_single')\
          \ if missed_12m == 1 else K('missed_penalty_none'))"
      - returns_6m: "COUNT('plan_installments', within_months=6, date_field='txn_date', event_type='plan_installment_returned')"
      - returned_debit_penalty: "K('return_penalty_heavy') if returns_6m >= K('heavy_returns_min') else\
          \ (K('return_penalty_light') if returns_6m >= 1 else K('return_penalty_none'))"
      - plan_age_months: "MONTHS(F('created_date'), NOW)"
      - restructure_paid_count: "COUNT('plan_installments', event_type='plan_installment_paid') - COUNT('plan_installments',\
          \ event_type='plan_installment_returned')"
      - tenure_credit: "K('tenure_credit_long') if (plan_age_months >= K('tenure_long_months') and restructure_paid_count\
          \ >= K('tenure_long_paid')) else (K('tenure_credit_short') if (plan_age_months >= K('tenure_short_months')\
          \ and restructure_paid_count >= K('tenure_short_paid') and not (plan_age_months >= K('tenure_long_months')\
          \ and restructure_paid_count >= K('tenure_long_paid'))) else K('tenure_credit_none'))"
      - relief_credits_12m: "XSUM('account', 'account_transactions', 'amount', within_months=12, date_field='txn_date',\
          \ event_type='account_client_adjustment', adjustment_reason='charity_care_writeoff', account_id=F('account_id'))\
          \ + XSUM('account', 'account_transactions', 'amount', within_months=12, date_field='txn_date',\
          \ event_type='account_client_adjustment', adjustment_reason='insurance_payment', account_id=F('account_id'))"
      - account_placed_balance: "CFIELD('account', 'placed_balance', account_id=F('account_id'))"
      - relief_credit_bonus: "K('credit_bonus_large') if (relief_credits_12m > 0 and account_placed_balance\
          \ != None and relief_credits_12m >= account_placed_balance * K('relief_credit_share')) else (K('credit_bonus_small')\
          \ if (relief_credits_12m > 0 and (account_placed_balance == None or relief_credits_12m < account_placed_balance\
          \ * K('relief_credit_share'))) else K('credit_bonus_none'))"
      - restructured_count: "MN(P('max_installment_count') - F('schedule_anchor_installment'), base_count\
          \ + hardship_relief + tenure_credit + relief_credit_bonus - missed_entry_penalty - returned_debit_penalty)"
      - periods_per_year: "52 if F('payment_frequency') == 'weekly' else (26 if F('payment_frequency') ==\
          \ 'biweekly' else 12)"
      - type_minimum: "P('min_installment_weekly_usd') if F('payment_frequency') == 'weekly' else (P('min_installment_biweekly_usd')\
          \ if F('payment_frequency') == 'biweekly' else P('min_installment_monthly_usd'))"
      - pct_floor: "restructure_balance * P('min_installment_pct_of_balance') / 100 * 12 / periods_per_year"
      - spread_installment: "-((-restructure_balance / MX(1, restructured_count)) // P('installment_rounding_unit_usd'))\
          \ * P('installment_rounding_unit_usd')"
      - result: "RND(MX(spread_installment, type_minimum, -((-pct_floor) // P('installment_rounding_unit_usd'))\
          \ * P('installment_rounding_unit_usd')), 2)"
    compute_basis:
      last_reaging_number: "when the plan recorded a re-aging deferral in the last month"
      reagings_last_month: "when the plan recorded a re-aging deferral in the last month"
      reaged_net_paid: "The re-aged remainder is the re-aged installment's regular amount less the installment\
        \ payments applied to it and not returned."
      reaged_remainder: "The re-aged remainder is the re-aged installment's regular amount less the installment\
        \ payments applied to it and not returned."
      debit_within_notice: "no debit falls due in the next three days, that is on or after the handling\
        \ date and no more than three days after it"
      restructure_balance: "when the plan recorded a re-aging deferral in the last month and no debit falls\
        \ due in the next three days, that is on or after the handling date and no more than three days\
        \ after it, the restructure balance is the arrangement_balance less the re-aged remainder, the re-aged\
        \ installment keeping its own place behind the last restructured installment; when the plan recorded\
        \ a re-aging deferral in the last month and a debit falls due in the next three days, that debit\
        \ is collected at the amount in force and the restructure balance is the arrangement_balance less\
        \ the re-aged remainder and less one regular installment; otherwise the restructure balance is the\
        \ whole arrangement_balance."
      base_count: "The base count is the plan's installment_count less its schedule anchor installment,\
        \ the regular installments still to fall due from the anchor on."
      hold_ended: "a hold that ended no more than sixty days before the handling date"
      hold_needs_documents: "a hold of a tier that needs documentation"
      hold_end_age: "ended no more than sixty days before the handling date"
      assistance_outcome_latest: "on which the client recorded an approved_full or approved_partial financial\
        \ assistance decision"
      hardship_relief: "a hold that ended no more than sixty days before the handling date and on which\
        \ the client recorded an approved_full or approved_partial financial assistance decision adds two\
        \ installments; a hold of a tier that needs documentation that ended no more than sixty days before\
        \ the handling date without such a decision adds one installment; any other case adds none."
      missed_12m: "The missed-entry penalty follows the plan's missed entries recorded in the last twelve\
        \ months"
      missed_entry_penalty: "two or more take away four installments, one takes away two, and none takes\
        \ away none."
      returns_6m: "The returned-debit penalty follows the plan's returned installment payments in the last\
        \ six months"
      returned_debit_penalty: "three or more take away two installments, one or two take away one, and none\
        \ takes away none."
      plan_age_months: "a plan created at least six whole months before the handling date"
      restructure_paid_count: "where the kept installment payments are the installment payments received\
        \ under the plan less those returned"
      tenure_credit: "a plan created at least six whole months before the handling date with at least four\
        \ kept installment payments adds two installments; a plan created at least three whole months before\
        \ with at least two kept installment payments, and not in the first case, adds one; any other plan\
        \ adds none."
      relief_credits_12m: "The relief-credit bonus follows the client credits booked to the placed account\
        \ in the last twelve months for charity_care_writeoff or insurance_payment"
      account_placed_balance: "at least a quarter of the account's placed_balance"
      relief_credit_bonus: "credits totalling at least a quarter of the account's placed_balance add two\
        \ installments; smaller such credits add one; no such credit adds none."
      restructured_count: "The restructured count is the base count plus the hardship relief, plus the tenure\
        \ credit, plus the relief-credit bonus, less the missed-entry penalty and less the returned-debit\
        \ penalty, and never more than the type's max_installment_count less the schedule anchor installment."
      periods_per_year: "measured as a monthly equivalent"
      type_minimum: "it is never below the type's minimum installment for the plan's frequency"
      pct_floor: "nor below min_installment_pct_of_balance percent of the restructure balance, measured\
        \ as a monthly equivalent"
      spread_installment: "The restructured installment is the restructure balance divided by the restructured\
        \ count, rounded up to the type's installment_rounding_unit_usd"
      result: "it is never below the type's minimum installment for the plan's frequency nor below min_installment_pct_of_balance\
        \ percent of the restructure balance, measured as a monthly equivalent."
      suspending_hold_id: "the hardship hold that suspended the plan, which is the hold on the plan's account\
        \ whose decision_date is the plan's suspended_date"
    factors:
      - id: "restructure_balance_by_reaging"
        effect: >-
          method
        decides: "restructure_balance"
        bindings:
          - "last_reaging_number"
          - "reagings_last_month"
          - "reaged_net_paid"
          - "reaged_remainder"
          - "debit_within_notice"
          - "restructure_balance"
        ladder:
          - when: "a re-aging deferral recorded in the last month AND no debit falls due in the next three\
              \ days"
            method: "re-spread the arrangement_balance less the re-aged remainder (the re-aged installment\
              \ keeps its place behind the final)"
          - when: "a re-aging deferral recorded in the last month AND a debit falls due in the next three\
              \ days"
            method: "re-spread the arrangement_balance less the re-aged remainder and less the one regular\
              \ installment already in collection"
          - when: "otherwise"
            method: "re-spread the whole arrangement_balance"
        baseline:
          restructure_balance: "F('arrangement_balance')"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
      - id: "restructure_hardship_relief"
        effect: >-
          parameter
        decides: "hardship_relief"
        bindings:
          - "suspending_hold_id"
          - "hold_ended"
          - "hold_needs_documents"
          - "hold_end_age"
          - "assistance_outcome_latest"
          - "hardship_relief"
        ladder:
          - when: "the hold that suspended the plan ended no more than sixty days ago AND the client recorded\
              \ an approved_full or approved_partial financial assistance decision on it"
            value: "K('relief_assisted') = 2 installments"
          - when: "the hold that suspended the plan ended no more than sixty days ago AND its tier needs\
              \ documentation AND no approved decision is on it"
            value: "K('relief_documented') = 1 installment"
          - when: "otherwise"
            value: "K('relief_none') = 0 installments"
        baseline:
          hardship_relief: "K('relief_none')"
        evidence:
          - "cross_category"
          - "date"
        cross_difficulty: "hardship"
      - id: "restructure_missed_entry_penalty"
        effect: >-
          parameter
        decides: "missed_entry_penalty"
        bindings:
          - "missed_12m"
          - "missed_entry_penalty"
        ladder:
          - when: "two or more missed entries recorded in the last twelve months"
            value: "K('missed_penalty_repeat') = 4 installments off"
          - when: "exactly one missed entry recorded in the last twelve months"
            value: "K('missed_penalty_single') = 2 installments off"
          - when: "no missed entry in the last twelve months"
            value: "K('missed_penalty_none') = 0"
        baseline:
          missed_entry_penalty: "K('missed_penalty_none')"
        evidence:
          - "history"
        cross_difficulty: null
      - id: "restructure_returned_debit_penalty"
        effect: >-
          parameter
        decides: "returned_debit_penalty"
        bindings:
          - "returns_6m"
          - "returned_debit_penalty"
        ladder:
          - when: "three or more returned installment payments in the last six months"
            value: "K('return_penalty_heavy') = 2 installments off"
          - when: "one or two returned installment payments in the last six months"
            value: "K('return_penalty_light') = 1 installment off"
          - when: "no returned installment payment in the last six months"
            value: "K('return_penalty_none') = 0"
        baseline:
          returned_debit_penalty: "K('return_penalty_none')"
        evidence:
          - "history"
        cross_difficulty: null
      - id: "restructure_tenure_credit"
        effect: >-
          parameter
        decides: "tenure_credit"
        bindings:
          - "plan_age_months"
          - "restructure_paid_count"
          - "tenure_credit"
        ladder:
          - when: "plan created at least six whole months ago AND at least four kept installment payments"
            value: "K('tenure_credit_long') = 2 installments"
          - when: "plan created at least three whole months ago AND at least two kept installment payments\
              \ (and not the first tier)"
            value: "K('tenure_credit_short') = 1 installment"
          - when: "otherwise"
            value: "K('tenure_credit_none') = 0"
        baseline:
          tenure_credit: "K('tenure_credit_none')"
        evidence:
          - "history"
          - "date"
        cross_difficulty: null
      - id: "restructure_relief_credit_bonus"
        effect: >-
          parameter
        decides: "relief_credit_bonus"
        bindings:
          - "relief_credits_12m"
          - "account_placed_balance"
          - "relief_credit_bonus"
        ladder:
          - when: "charity_care_writeoff or insurance_payment credits in the last twelve months total at\
              \ least a quarter of the placed balance"
            value: "K('credit_bonus_large') = 2 installments"
          - when: "such credits exist but total less than a quarter of the placed balance"
            value: "K('credit_bonus_small') = 1 installment"
          - when: "no such credit in the last twelve months"
            value: "K('credit_bonus_none') = 0"
        baseline:
          relief_credit_bonus: "K('credit_bonus_none')"
        evidence:
          - "cross_category"
          - "history"
        cross_difficulty: "account"
    baseline:
      rule: >-
        The restructure keeps the plan's schedule anchor installment as the first restructured installment
        and re-spreads the restructure balance evenly over the restructured count. The restructured installment
        is the restructure balance divided by the restructured count, rounded up to the type's installment_rounding_unit_usd;
        it is never below the type's minimum installment for the plan's frequency nor below min_installment_pct_of_balance
        percent of the restructure balance, measured as a monthly equivalent. The base count is the plan's
        installment_count less its schedule anchor installment, the regular installments still to fall due
        from the anchor on. The restructured count is the base count plus the hardship relief, plus the
        tenure credit, plus the relief-credit bonus, less the missed-entry penalty and less the returned-debit
        penalty, and never more than the type's max_installment_count less the schedule anchor installment.
        In the standard method the restructure balance is the plan's whole arrangement_balance, and the
        hardship relief, the tenure credit, the relief-credit bonus and both penalties are zero, so the
        restructured count is the base count.
      params:
        - "installment_rounding_unit_usd"
        - "min_installment_monthly_usd"
        - "min_installment_pct_of_balance"
        - "max_installment_count"
        - "relief_none"
        - "tenure_credit_none"
        - "credit_bonus_none"
        - "missed_penalty_none"
        - "return_penalty_none"
    inputs:
      history:
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 1
          filters:
            event_type: "plan_schedule_change_recorded"
            change_type: "deferral"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 12
          filters:
            event_type: "plan_installment_missed"
        - table: "plan_installments"
          aggregate: "count"
          field: "plan_txn_id"
          within_months: 6
          filters:
            event_type: "plan_installment_returned"
        - category: "hardship"
          table: "hardship_hold_events"
          aggregate: "latest"
          field: "assistance_outcome"
          filters:
            event_type: "hardship_assistance_decision_recorded"
        - category: "account"
          table: "account_transactions"
          aggregate: "sum"
          field: "amount"
          within_months: 12
          filters:
            event_type: "account_client_adjustment"
      cross_category:
        - "hardship"
        - "account"