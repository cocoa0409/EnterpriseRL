      - d_direct_out: "SUM('account_transactions','amount', event_type='account_direct_payment_reported')"
      - d_credit_out: "SUM('account_transactions','amount', event_type='account_client_adjustment')"
      - d_waive_out: "SUM('account_transactions','amount', event_type='account_settlement_balance_waived')"
      - d_balance_now: "RND(d_placed_in + d_supp_in + d_ret_in + d_ref_in - d_pay_out - d_direct_out - d_credit_out - d_waive_out, 2)"
      - d_returns_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned')"
