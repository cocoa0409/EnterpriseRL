            value: "K('two_return_portal_limit')"
          - when: "exactly one returned payment received on the account in the last six months"
            value: "K('one_return_portal_limit')"
          - when: "no returned payment received on the account in the last six months"
            value: "P('card_payment_max_rolling_30d_usd')"
        baseline:
          portal_debit_limit: "P('card_payment_max_rolling_30d_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: portal_debit_assistance
        effect: parameter
        decides: assistance_pct
        bindings: [d_fa_outcome, d_fa_ended_on, d_hold_ended_months, assistance_pct]
        ladder:
          - when: "the latest recorded assistance decision is denied AND the most recent Financial Assistance Review Hold ending in the last fa_recency_months months"
            value: "K('fa_recent_pct')"
          - when: "the latest recorded assistance decision is denied AND that most recent ending fa_recency_months or more months ago"
            value: "K('fa_older_pct')"
          - when: "every other case, including a Financial Assistance Review Hold not yet ended"
            value: "K('standard_pct')"
        baseline:
          assistance_pct: "K('standard_pct')"
        evidence: [cross_category, date]
        cross_difficulty: hardship
      - id: portal_debit_exposure_basis
        effect: method
        decides: pd_counted
        bindings: [pdx_debit_1m, pdx_credit_1m, pdx_bank_1m, pdx_credit_count_1m, pdx_bank_count_3m, pd_counted]
        ladder:
          - when: "one or more credit-card payments received in the last month AND one or more bank-debit payments received in the last three months"
            method: "count every card and bank-debit payment received in the last month"
          - when: "one or more credit-card payments received in the last month AND no bank-debit payment received in the last three months"
            method: "count the debit-card and credit-card payments received in the last month"
          - when: "every other case"
            method: "count only the debit-card payments received in the last month"
        baseline:
          pd_counted: "pdx_debit_1m"
        evidence: [history]
        cross_difficulty: null
      - id: portal_debit_clean_record
        effect: parameter
        decides: clean_allowance
        bindings: [debit_returns_ever, debit_count_3m, clean_allowance]
        ladder:
          - when: "no debit-card payment on the account ever returned AND one or more debit-card payments received in the last three months"
            value: "K('clean_recent_allowance')"
          - when: "no debit-card payment on the account ever returned AND none received in the last three months"
            value: "K('clean_idle_allowance')"
          - when: "a debit-card payment on the account ever returned"
            value: "0"
        baseline:
          clean_allowance: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
