      payments, direct payments, client credits and settlement waivers, as booked when the consumer
      opens the portal. For the portal debit-card ceiling, a payment, a return or a hold ending falls
      in the last N months when fewer than N whole calendar months separate its date from the
      handling date, a whole month being reached on the same day of a later month. In full, the
      portal debit-card limit is multiplied by the portal debit-card assistance percentage, the payments counted against the portal debit-card ceiling are subtracted from that product, and the portal debit-card clean-record allowance is then added; the figure is rounded to the cent (half to even) once, after the addition. The portal debit-card limit is
      two_return_portal_limit where two or more returned payments were received on the account in
      the last six months, one_return_portal_limit where exactly one returned payment was received on
