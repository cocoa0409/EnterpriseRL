        card_payment_max_rolling_30d_usd less the debit-card payments received in the last month,
        rounded to the cent (half to even). The portal debit-card ceiling of the day is the smallest of its
        rounded figure, the stage's card_payment_max_per_transaction_usd and the balance due, and it
        is never below zero. The balance due for the portal debit-card ceiling is the placed balance
