      doc_ended_months: "A payment, a return or a plan or hold closing falls in the last N months when fewer than N whole calendar months separate its date from the handling date, a whole month being reached on the same day of a later month, and a card payment counted for the credit-card ceiling counts at its posted amount."
      pause_ended_months: "A payment, a return or a plan or hold closing falls in the last N months when fewer than N whole calendar months separate its date from the handling date, a whole month being reached on the same day of a later month, and a card payment counted for the credit-card ceiling counts at its posted amount."
      hardship_cushion: "The credit-card ceiling's hardship cushion is documented_cushion where a Documented Hardship Hold on the account ended in the last hold_recency_months months, pause_cushion where no Documented Hardship Hold on the account ended in the last hold_recency_months months but a 30-Day Hardship Pause on the account did, and nothing where no hardship hold of either tier on the account ended in the last hold_recency_months months."
      credit_figure: "In full, the credit-card ceiling's card limit is multiplied by the credit-card ceiling's plan-cancellation percentage, the card payments counted against the credit-card ceiling are subtracted from that product, and the credit-card ceiling's hardship cushion is then subtracted; the figure is rounded to the cent (half to even) once, after both subtractions."
      result: "The credit-card ceiling of the day is the smallest of the rounded figure, the stage's card_payment_max_per_transaction_usd and the balance due, and it is never below zero."
    factors:
      - id: credit_card_on_card_limit
        effect: parameter
        decides: card_limit
        bindings: [chargeoff_age, card_limit]
        ladder:
          - when: "a bank_card debt AND its charge-off date fewer than chargeoff_age_days calendar days before the handling date (or no charge-off date)"
            value: "K('card_on_card_recent_limit')"
          - when: "a bank_card debt AND its charge-off date chargeoff_age_days or more calendar days before the handling date"
            value: "K('card_on_card_old_limit')"
          - when: "a debt that is not a bank_card debt"
            value: "P('card_payment_max_rolling_30d_usd')"
        baseline:
          card_limit: "P('card_payment_max_rolling_30d_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: credit_plan_cancellation
        effect: parameter
        decides: cancel_pct
        bindings: [plan_closed_on, plan_closed_months, cancel_pct]
        ladder:
          - when: "a payment plan on the account closed as broken_not_reinstated AND the most recent such closing in the last cancel_recency_months months"
            value: "K('recent_cancel_pct')"
          - when: "a payment plan on the account closed as broken_not_reinstated AND the most recent such closing cancel_recency_months or more months ago"
            value: "K('older_cancel_pct')"
          - when: "no payment plan on the account closed as broken_not_reinstated"
            value: "K('standard_pct')"
        baseline:
          cancel_pct: "K('standard_pct')"
        evidence: [cross_category, date]
        cross_difficulty: plan
      - id: credit_counting_basis
        effect: method
        decides: credit_counted
        bindings: [c_returns_6m, cards_1m, cards_2m, credit_1m, credit_counted]
        ladder:
          - when: "one or more returned payments received on the account in the last six months AND one or more card payments received in the last month"
            method: "count every card payment, debit or credit, received in the last two months"
          - when: "no returned payment received in the last six months AND one or more card payments received in the last month"
            method: "count every card payment, debit or credit, received in the last month"
          - when: "every other case"
            method: "count only the credit-card payments received in the last month"
        baseline:
          credit_counted: "credit_1m"
        evidence: [history]
        cross_difficulty: null
      - id: credit_hardship_cushion
        effect: parameter
        decides: hardship_cushion
        bindings: [doc_hold_ended, pause_hold_ended, doc_ended_months, pause_ended_months, hardship_cushion]
        ladder:
          - when: "a Documented Hardship Hold on the account AND its ending in the last hold_recency_months months"
            value: "K('documented_cushion')"
          - when: "no Documented Hardship Hold ended in the last hold_recency_months months AND a 30-Day Hardship Pause on the account ended in that period"
            value: "K('pause_cushion')"
          - when: "no hardship hold of either tier on the account ended in the last hold_recency_months months"
            value: "0"
        baseline:
          hardship_cushion: "0"
        evidence: [cross_category, date]
        cross_difficulty: hardship
    baseline:
      rule: >-
        By standard method, the credit-card ceiling of the day is the stage's
        card_payment_max_rolling_30d_usd less the credit-card payments received in the last month,
        rounded to the cent (half to even). The credit-card ceiling of the day is the smallest of the
        rounded figure, the stage's card_payment_max_per_transaction_usd and the balance due, and it
        is never below zero. The balance due for the credit-card ceiling is the placed balance plus
        supplemental additions, returned payments and refunded overpayments, less consumer payments,
        direct payments, client credits and settlement waivers, as booked on the account at the
        moment the ceiling is worked out. A payment, a return or a plan or hold closing falls in the
        last N months when fewer than N whole calendar months separate its date from the handling
        date, a whole month being reached on the same day of a later month, and a card payment
        counted for the credit-card ceiling counts at its posted amount.
      params: [card_payment_max_rolling_30d_usd, card_payment_max_per_transaction_usd]
    inputs:
      history:
        - {table: account_transactions, aggregate: sum, field: amount, filters: {}}
        - {table: account_transactions, aggregate: sum, field: amount, within_months: 2, filters: {event_type: account_payment_posted}}
        - {table: account_transactions, aggregate: count, field: txn_id, within_months: 6, filters: {event_type: account_payment_returned}}
      cross_category: [plan, hardship]

  - id: account_ext_portal_bank_debit_ceiling
    base_policy_refs: [account_agg_payment_application, account_evt_payment_channels]
    overwrite:
      - base_policy: account_evt_payment_channels
        superseded_clause: >-
          a single ACH payment may not exceed ach_payment_max_per_transaction_usd
        replaced_by: >-
          The portal bank-debit ceiling of the day is the smallest of the rounded figure, the stage's
          ach_payment_max_per_transaction_usd and the balance due, and it is never below zero.
    trigger: on_request
    subject: [account_payment_posted]
    computes: amount
    target_tool: make_portal_bank_payment_436b09cd
    params:
      closed_return_limit: 3000.00
      nsf_return_limit: 5000.00
      untested_pct: 0.50
      retested_pct: 0.75
      standard_pct: 1.00
      installment_strong: 3
      installment_allowance_high: 200.00
      installment_allowance_low: 100.00
    rule: >-
      When a consumer asks to pay the most an account will accept in one day and chooses to pay from
      their own bank account, the consumer makes one bank-debit payment through the payment portal
      equal to the portal bank-debit ceiling of the day, posted on the handling date with the portal's
      confirmation as its reference. When a consumer who also offers a credit card asks to pay the
      most an account will accept in one day, the portal bank-debit ceiling of the day is not fixed
      until the day's credit-card payment has been taken by the phone desk. By standard method, the
      portal bank-debit ceiling of the day is the stage's ach_payment_max_per_transaction_usd less
      the bank-debit payments received on the handling date, rounded to the cent (half to even). The portal
      bank-debit ceiling of the day is the smallest of the rounded figure, the stage's
      ach_payment_max_per_transaction_usd and the balance due, and it is never below zero. The
      balance due for the portal bank-debit ceiling is the placed balance plus supplemental
      additions, returned payments and refunded overpayments, less consumer payments, direct
      payments, client credits and settlement waivers, as booked on the account when the consumer
      opens the portal payment. A return falls in the last six months when fewer than six whole
      calendar months separate its date from the handling date, a whole month being reached on the
      same day of a later month. In full, the same-day payments counted against the portal bank-debit
      limit are subtracted from the portal bank-debit limit, that difference is multiplied by the
      bank-debit retest percentage, and the installment-record allowance is then added; the figure is
      rounded to the cent (half to even) once, after the addition. The portal bank-debit limit is
      closed_return_limit where one or more payments returned for account_closed or stop_payment were
      received on the account in the last six months, nsf_return_limit where no such return but one
      or more payments returned for nsf were received on the account in the last six months, and the
      stage's ach_payment_max_per_transaction_usd where no payment returned for account_closed,
      stop_payment or nsf was received on the account in the last six months. The same-day payments
      counted against the portal bank-debit limit are every card and bank-debit payment received on
      the handling date where any payment plan on the account was closed with close reason broken_not_reinstated; the credit-card and bank-debit payments received on the handling date
      where no plan on the account was so closed and one or more returned payments were received on
      the account in the last six months; and the bank-debit payments received on the handling date
      in every other case. The bank-debit retest percentage is untested_pct where the account's most
      recent bank-debit return is dated on or after its most recent bank-debit payment, retested_pct
      where the account has a bank-debit return and a bank-debit payment was received after the most
      recent such return, and standard_pct where the account has no bank-debit return. The
      installment-record allowance is installment_allowance_high where the account's payment plans
      record installment_strong or more paid installments after deducting their returned
      installments, installment_allowance_low where they record at least one but fewer than
      installment_strong such installments, and nothing where they record none.
    prerequisite:
      - problem: account_ext_phone_credit_card_ceiling
        kind: value_input
        gate: same_day_counted
        form: action
        policy_source: >-
          When a consumer who also offers a credit card asks to pay the most an account will accept in
          one day, the portal bank-debit ceiling of the day is not fixed until the day's credit-card
          payment has been taken by the phone desk.
        fallback_reason: >-
          A credit-card payment dated the handling date is booked both by the phone desk's credit-card
          ceiling payment and by the payment portal's credit-card payment, so the record-visible state
          "a credit-card payment received on the handling date" does not single out the one write this
          ceiling waits on; the sentence therefore names the phone desk's credit-card payment.
        condition: >-
          The account's money history carries an account_payment_posted entry with payment channel
          credit_card dated the handling date, booked by the phone desk at the credit-card ceiling of
          the day.
        resolved_by: take_credit_card_payment_bec5ec25
        effect: >-
          The phone desk's credit-card payment of the day enters the same-day payments counted against
          the portal bank-debit limit and lowers the balance due, so the portal bank-debit ceiling is
          worked out after it.
    cross_category:
      - category: plan
        as: history
        reads: [payment_plans.close_reason, plan_installments.event_type]
        note: The same-day counting basis reads whether a plan on the account was closed as broken, and the installment-record allowance counts the plan ledger's paid and returned installments.
    compute:
      - b_placed_in: "SUM('account_transactions','amount', event_type='account_balance_placed')"
      - b_supp_in: "SUM('account_transactions','amount', event_type='account_supplemental_balance_added')"
      - b_ret_in: "SUM('account_transactions','amount', event_type='account_payment_returned')"
      - b_ref_in: "SUM('account_transactions','amount', event_type='account_overpayment_refunded')"
      - b_pay_out: "SUM('account_transactions','amount', event_type='account_payment_posted')"
      - b_direct_out: "SUM('account_transactions','amount', event_type='account_direct_payment_reported')"
      - b_credit_out: "SUM('account_transactions','amount', event_type='account_client_adjustment')"
      - b_waive_out: "SUM('account_transactions','amount', event_type='account_settlement_balance_waived')"
      - b_balance_now: "RND(b_placed_in + b_supp_in + b_ret_in + b_ref_in - b_pay_out - b_direct_out - b_credit_out - b_waive_out, 2)"
      - closed_stop_returns_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned', return_reason='account_closed') + COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned', return_reason='stop_payment')"
      - nsf_returns_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned', return_reason='nsf')"
      - bank_limit: "K('closed_return_limit') if closed_stop_returns_6m >= 1 else (K('nsf_return_limit') if (closed_stop_returns_6m == 0 and nsf_returns_6m >= 1) else P('ach_payment_max_per_transaction_usd'))"
      - b_plans_broken_closed: "XCOUNT('plan','payment_plans', account_id=HID, close_reason='broken_not_reinstated')"
      - b_returns_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned')"
      - today_debit: "SUM('account_transactions','amount', event_type='account_payment_posted', payment_channel='debit_card', txn_date=NOW)"
      - today_credit: "SUM('account_transactions','amount', event_type='account_payment_posted', payment_channel='credit_card', txn_date=NOW)"
      - today_bank: "SUM('account_transactions','amount', event_type='account_payment_posted', payment_channel='ach_bank_debit', txn_date=NOW)"
      - same_day_counted: "today_debit + today_credit + today_bank if b_plans_broken_closed >= 1 else (today_credit + today_bank if (b_plans_broken_closed == 0 and b_returns_6m >= 1) else today_bank)"
      - last_bank_pay: "LATEST('account_transactions','txn_date', date_field='txn_date', event_type='account_payment_posted', payment_channel='ach_bank_debit') or ''"
      - last_bank_return: "LATEST('account_transactions','txn_date', date_field='txn_date', event_type='account_payment_returned', payment_channel='ach_bank_debit') or ''"
      - retest_pct: "K('untested_pct') if (last_bank_return != '' and last_bank_return >= last_bank_pay) else (K('retested_pct') if (last_bank_return != '' and last_bank_return < last_bank_pay) else K('standard_pct'))"
      - plan_paid_count: "XCOUNT('plan','plan_installments', event_type='plan_installment_paid', account_id=HID)"
      - plan_returned_count: "XCOUNT('plan','plan_installments', event_type='plan_installment_returned', account_id=HID)"
      - installment_allowance: "K('installment_allowance_high') if (plan_paid_count - plan_returned_count >= K('installment_strong')) else (K('installment_allowance_low') if (plan_paid_count - plan_returned_count >= 1 and plan_paid_count - plan_returned_count < K('installment_strong')) else 0)"
      - bank_figure: "RND((bank_limit - same_day_counted) * retest_pct + installment_allowance, 2)"
      - result: "RND(MX(0, MN(bank_figure, P('ach_payment_max_per_transaction_usd'), b_balance_now)), 2)"
    compute_basis:
      b_placed_in: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_balance_now: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_supp_in: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_ret_in: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_ref_in: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_pay_out: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_direct_out: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_credit_out: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      b_waive_out: "The balance due for the portal bank-debit ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked on the account when the consumer opens the portal payment."
      closed_stop_returns_6m: "The portal bank-debit limit is closed_return_limit where one or more payments returned for account_closed or stop_payment were received on the account in the last six months"
      nsf_returns_6m: "nsf_return_limit where no such return but one or more payments returned for nsf were received on the account in the last six months"
      bank_limit: "The portal bank-debit limit is closed_return_limit where one or more payments returned for account_closed or stop_payment were received on the account in the last six months, nsf_return_limit where no such return but one or more payments returned for nsf were received on the account in the last six months, and the stage's ach_payment_max_per_transaction_usd where no payment returned for account_closed, stop_payment or nsf was received on the account in the last six months."
      b_plans_broken_closed: "where any payment plan on the account was closed with close reason broken_not_reinstated"
      b_returns_6m: "A return falls in the last six months when fewer than six whole calendar months separate its date from the handling date, a whole month being reached on the same day of a later month."
      today_debit: "The same-day payments counted against the portal bank-debit limit are every card and bank-debit payment received on the handling date where any payment plan on the account was closed with close reason broken_not_reinstated"
      today_credit: "the credit-card and bank-debit payments received on the handling date where no plan on the account was so closed and one or more returned payments were received on the account in the last six months"
      today_bank: "By standard method, the portal bank-debit ceiling of the day is the stage's ach_payment_max_per_transaction_usd less the bank-debit payments received on the handling date, rounded to the cent (half to even)."
      same_day_counted: "The same-day payments counted against the portal bank-debit limit are every card and bank-debit payment received on the handling date where any payment plan on the account was closed with close reason broken_not_reinstated; the credit-card and bank-debit payments received on the handling date where no plan on the account was so closed and one or more returned payments were received on the account in the last six months; and the bank-debit payments received on the handling date in every other case."
      last_bank_pay: "The bank-debit retest percentage is untested_pct where the account's most recent bank-debit return is dated on or after its most recent bank-debit payment"
      last_bank_return: "The bank-debit retest percentage is untested_pct where the account's most recent bank-debit return is dated on or after its most recent bank-debit payment"
      retest_pct: "The bank-debit retest percentage is untested_pct where the account's most recent bank-debit return is dated on or after its most recent bank-debit payment, retested_pct where the account has a bank-debit return and a bank-debit payment was received after the most recent such return, and standard_pct where the account has no bank-debit return."
      plan_paid_count: "installment_strong or more paid installments after deducting their returned installments"
      plan_returned_count: "installment_strong or more paid installments after deducting their returned installments"
      installment_allowance: "The installment-record allowance is installment_allowance_high where the account's payment plans record installment_strong or more paid installments after deducting their returned installments, installment_allowance_low where they record at least one but fewer than installment_strong such installments, and nothing where they record none."
      bank_figure: "In full, the same-day payments counted against the portal bank-debit limit are subtracted from the portal bank-debit limit, that difference is multiplied by the bank-debit retest percentage, and the installment-record allowance is then added; the figure is rounded to the cent (half to even) once, after the addition."
      result: "The portal bank-debit ceiling of the day is the smallest of the rounded figure, the stage's ach_payment_max_per_transaction_usd and the balance due, and it is never below zero."
    factors:
      - id: bank_return_limit
        effect: parameter
        decides: bank_limit
        bindings: [closed_stop_returns_6m, nsf_returns_6m, bank_limit]
        ladder:
          - when: "one or more payments returned for account_closed or stop_payment received in the last six months"
            value: "K('closed_return_limit')"
          - when: "no account_closed or stop_payment return AND one or more payments returned for nsf received in the last six months"
            value: "K('nsf_return_limit')"
          - when: "no payment returned for account_closed, stop_payment or nsf received in the last six months"
            value: "P('ach_payment_max_per_transaction_usd')"
        baseline:
          bank_limit: "P('ach_payment_max_per_transaction_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: bank_same_day_basis
        effect: method
        decides: same_day_counted
        bindings: [b_plans_broken_closed, b_returns_6m, today_debit, today_credit, today_bank, same_day_counted]
        ladder:
          - when: "a payment plan on the account was closed with close reason broken_not_reinstated"
            method: "count every card and bank-debit payment received on the handling date"
          - when: "no plan on the account was so closed AND one or more returned payments received in the last six months"
            method: "count the credit-card and bank-debit payments received on the handling date"
          - when: "every other case"
            method: "count only the bank-debit payments received on the handling date"
        baseline:
          same_day_counted: "today_bank"
        evidence: [cross_category, history]
