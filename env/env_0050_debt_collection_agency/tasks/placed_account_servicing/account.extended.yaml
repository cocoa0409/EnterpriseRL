      - id: bank_retest
        effect: parameter
        decides: retest_pct
        bindings: [last_bank_pay, last_bank_return, retest_pct]
        ladder:
          - when: "a bank-debit return on the account AND that most recent return dated on or after the most recent bank-debit payment"
            value: "K('untested_pct')"
          - when: "a bank-debit return on the account AND a bank-debit payment received after the most recent such return"
            value: "K('retested_pct')"
          - when: "no bank-debit return on the account"
            value: "K('standard_pct')"
        baseline:
          retest_pct: "K('standard_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: bank_installment_record
        effect: parameter
        decides: installment_allowance
        bindings: [plan_paid_count, plan_returned_count, installment_allowance]
        ladder:
          - when: "the account's plans record installment_strong or more paid installments after deducting returned installments"
            value: "K('installment_allowance_high')"
          - when: "the account's plans record at least one but fewer than installment_strong such installments"
            value: "K('installment_allowance_low')"
          - when: "the account's plans record none"
            value: "0"
        baseline:
          installment_allowance: "0"
        evidence: [cross_category, history]
        cross_difficulty: plan
    baseline:
      rule: >-
        By standard method, the portal bank-debit ceiling of the day is the stage's
        ach_payment_max_per_transaction_usd less the bank-debit payments received on the handling
        date, rounded to the cent (half to even). The portal bank-debit ceiling of the day is the smallest
        of the rounded figure, the stage's ach_payment_max_per_transaction_usd and the balance due,
        and it is never below zero. The balance due for the portal bank-debit ceiling is the placed
        balance plus supplemental additions, returned payments and refunded overpayments, less
        consumer payments, direct payments, client credits and settlement waivers, as booked on the
        account when the consumer opens the portal payment.
      params: [ach_payment_max_per_transaction_usd]
    inputs:
      history:
        - {table: account_transactions, aggregate: sum, field: amount, filters: {}}
        - {table: account_transactions, aggregate: count, field: txn_id, within_months: 6, filters: {event_type: account_payment_returned}}
        - {table: account_transactions, aggregate: latest, field: txn_date, filters: {payment_channel: ach_bank_debit}}
        - {category: plan, table: plan_installments, aggregate: count, field: plan_txn_id, filters: {event_type: plan_installment_paid}}
      cross_category: [plan]

  - id: account_ext_portal_debit_card_ceiling
