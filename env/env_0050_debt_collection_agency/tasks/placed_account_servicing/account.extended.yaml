      - d_fa_outcome: "XLATEST('hardship','hardship_hold_events','assistance_outcome', date_field='event_date', event_type='hardship_assistance_decision_recorded', account_id=HID) or ''"
      - d_hold_ended_months: "MONTHS(d_fa_ended_on or '1900-01-01', NOW)"
      - assistance_pct: "K('fa_recent_pct') if (d_fa_outcome == 'denied' and d_fa_ended_on != '' and d_hold_ended_months < K('fa_recency_months')) else (K('fa_older_pct') if (d_fa_outcome == 'denied' and d_fa_ended_on != '' and d_hold_ended_months >= K('fa_recency_months')) else K('standard_pct'))"
      - pdx_debit_1m: "SUM('account_transactions','amount', within_months=1, date_field='txn_date', event_type='account_payment_posted', payment_channel='debit_card')"
      - pdx_credit_1m: "SUM('account_transactions','amount', within_months=1, date_field='txn_date', event_type='account_payment_posted', payment_channel='credit_card')"
      - pdx_bank_1m: "SUM('account_transactions','amount', within_months=1, date_field='txn_date', event_type='account_payment_posted', payment_channel='ach_bank_debit')"
      - pdx_credit_count_1m: "COUNT('account_transactions', within_months=1, date_field='txn_date', event_type='account_payment_posted', payment_channel='credit_card')"
      - pdx_bank_count_3m: "COUNT('account_transactions', within_months=3, date_field='txn_date', event_type='account_payment_posted', payment_channel='ach_bank_debit')"
      - pd_counted: "pdx_debit_1m + pdx_credit_1m + pdx_bank_1m if (pdx_credit_count_1m >= 1 and pdx_bank_count_3m >= 1) else (pdx_debit_1m + pdx_credit_1m if (pdx_credit_count_1m >= 1 and pdx_bank_count_3m == 0) else pdx_debit_1m)"
      - debit_returns_ever: "COUNT('account_transactions', event_type='account_payment_returned', payment_channel='debit_card')"
      - debit_count_3m: "COUNT('account_transactions', within_months=3, date_field='txn_date', event_type='account_payment_posted', payment_channel='debit_card')"
      - clean_allowance: "K('clean_recent_allowance') if (debit_returns_ever == 0 and debit_count_3m >= 1) else (K('clean_idle_allowance') if (debit_returns_ever == 0 and debit_count_3m == 0) else 0)"
      - portal_debit_figure: "RND(portal_debit_limit * assistance_pct - pd_counted + clean_allowance, 2)"
      - result: "RND(MX(0, MN(portal_debit_figure, P('card_payment_max_per_transaction_usd'), d_balance_now)), 2)"
