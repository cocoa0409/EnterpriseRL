  - id: account_ext_portal_credit_card_ceiling
    base_policy_refs: [account_agg_payment_application, account_evt_payment_channels]
    overwrite:
      - base_policy: account_evt_payment_channels
        superseded_clause: >-
          A single card payment, debit or credit, may not exceed card_payment_max_per_transaction_usd,
          and account_msr_card_payments_30d plus the new card payment may not exceed
          card_payment_max_rolling_30d_usd
        replaced_by: >-
          The portal credit-card ceiling of the day is the smallest of its rounded figure, the stage's
          card_payment_max_per_transaction_usd and the balance due, and it is never below zero.
    trigger: on_request
    subject: [account_payment_posted]
    computes: amount
    target_tool: make_portal_credit_card_payment_7a2662c6
    params:
      recent_bill_limit: 3000.00
      older_bill_limit: 4000.00
      final_bill_age_days: 365
      denied_pct: 0.70
      partial_pct: 0.85
      standard_pct: 1.00
      settled_appeal_cushion: 120.00
      open_appeal_cushion: 60.00
      billing_dispute_pct: 0.90
      other_dispute_pct: 0.95
      steady_card_allowance: 150.00
      single_card_allowance: 75.00
      steady_card_count: 2
    rule: >-
      When a consumer who is paying an account down in one day chooses to pay by credit card through
      the payment portal, at a stage whose credit_card_payments_accepted is true, the consumer makes
      one portal credit-card payment equal to the portal credit-card ceiling of the day, posted on
      the handling date with the portal's confirmation as its reference. When a consumer who also
      pays by debit card through the payment portal is paying an account down in one day, the portal
      credit-card ceiling of the day is fixed only after the day's portal debit-card payment has been
      made. By standard method, the portal credit-card ceiling of the day is the stage's
      card_payment_max_rolling_30d_usd less the credit-card payments received in the last month,
      rounded to the cent (half to even). The portal credit-card ceiling of the day is the smallest of its
      rounded figure, the stage's card_payment_max_per_transaction_usd and the balance due, and it is
      never below zero. The balance due for the portal credit-card ceiling is the placed balance plus
      supplemental additions, returned payments and refunded overpayments, less consumer payments,
      direct payments, client credits and settlement waivers, as booked when the consumer opens the
      portal for the credit-card payment. For the portal credit-card ceiling, a payment, a return, a
      dispute, a verification mailing or a supplemental addition falls in the last N months when
      fewer than N whole calendar months separate its date from the handling date, a whole month
      being reached on the same day of a later month. In full, the portal credit-card limit is
      multiplied by the portal credit-card assistance percentage and then by the portal credit-card
      dispute percentage, the card payments counted against the portal credit-card ceiling and the
      portal credit-card appeal cushion are then subtracted from that product, and the portal
      credit-card steady-use allowance is then added; the figure is rounded to the cent (half to even) once,
      after the addition. The portal credit-card limit is recent_bill_limit for a medical debt whose
      charge-off or final-bill date is fewer than final_bill_age_days calendar days before the
      handling date or that has no such date, older_bill_limit for a medical debt whose charge-off or
      final-bill date is final_bill_age_days or more calendar days before the handling date, and the
      stage's card_payment_max_rolling_30d_usd for any debt that is not medical. The portal
      credit-card assistance percentage is denied_pct where the latest assistance decision recorded
      on the account's hardship holds is denied, partial_pct where that latest decision is
      approved_partial, and standard_pct where it is approved_full or no assistance decision is
      recorded. The card payments counted against the portal credit-card ceiling are every card
      payment, debit or credit, received in the last two months where one or more returned payments
      were received on the account in the last six months and a debit-card payment was received on
      the handling date; the card payments, debit or credit, received on the handling date where no
      returned payment was received in the last six months and a debit-card payment was received on
      the handling date; and the credit-card payments received in the last month in every other
      case. The portal credit-card appeal cushion is settled_appeal_cushion where an insurance denial
      rebill was added to the account in the last six months and an insurance payment credit has
      been booked on the account, open_appeal_cushion where an insurance denial rebill was added in
      the last six months and no insurance payment credit has been booked on the account, and nothing
      where no insurance denial rebill was added in the last six months. The portal credit-card
      dispute percentage is billing_dispute_pct where one or more disputes with reason
      insurance_should_have_paid or amount_incorrect were received in the last six months and one or
      more verifications were mailed on the account in the last six months, other_dispute_pct where
      no dispute with either of those reasons but one or more disputes with another reason were
      received in the last six months and one or more verifications were mailed in the last six
      months, and standard_pct in every other case. The portal credit-card steady-use allowance is
      steady_card_allowance where steady_card_count or more card payments, debit or credit, were
      received in the last three months and no card payment on the account was ever returned,
      single_card_allowance where exactly one card payment was received in the last three months and
      no card payment on the account was ever returned, and nothing where no card payment was
      received in the last three months or a card payment on the account was ever returned.
    prerequisite:
      - problem: account_ext_portal_debit_card_ceiling
        kind: value_input
        gate: portal_credit_counted
        form: action
        policy_source: >-
          When a consumer who also pays by debit card through the payment portal is paying an account
          down in one day, the portal credit-card ceiling of the day is fixed only after the day's
          portal debit-card payment has been made.
        fallback_reason: >-
          A debit-card payment dated the handling date is booked both by the consumer's portal
          debit-card payment and by the phone desk's debit-card ceiling payment, so the record-visible
          state "a debit-card payment received on the handling date" does not single out the one write
          this ceiling waits on; the sentence therefore names the portal debit-card payment.
        condition: >-
          The account's money history carries an account_payment_posted entry with payment channel
          debit_card dated the handling date, made by the consumer through the payment portal at the
          portal debit-card ceiling of the day.
        resolved_by: make_portal_debit_card_payment_fc4d38a9
        effect: >-
          The day's portal debit-card payment enters the card payments counted against the portal
          credit-card ceiling, adds one card payment to the steady-use count and lowers the balance
          due, so the portal credit-card ceiling is worked out after it.
    cross_category:
      - category: hardship
        as: history
        reads: [hardship_hold_events.assistance_outcome, hardship_hold_events.event_date]
        note: The portal credit-card assistance percentage is decided from the latest assistance decision recorded on the account's hardship holds.
    compute:
      - k_placed_in: "SUM('account_transactions','amount', event_type='account_balance_placed')"
      - k_supp_in: "SUM('account_transactions','amount', event_type='account_supplemental_balance_added')"
      - k_ret_in: "SUM('account_transactions','amount', event_type='account_payment_returned')"
      - k_ref_in: "SUM('account_transactions','amount', event_type='account_overpayment_refunded')"
      - k_pay_out: "SUM('account_transactions','amount', event_type='account_payment_posted')"
      - k_direct_out: "SUM('account_transactions','amount', event_type='account_direct_payment_reported')"
      - k_credit_out: "SUM('account_transactions','amount', event_type='account_client_adjustment')"
      - k_waive_out: "SUM('account_transactions','amount', event_type='account_settlement_balance_waived')"
      - k_balance_now: "RND(k_placed_in + k_supp_in + k_ret_in + k_ref_in - k_pay_out - k_direct_out - k_credit_out - k_waive_out, 2)"
      - bill_age: "DAYS(F('charge_off_date') or NOW, NOW)"
      - portal_credit_limit: "K('recent_bill_limit') if (F('debt_type') == 'medical' and bill_age < K('final_bill_age_days')) else (K('older_bill_limit') if (F('debt_type') == 'medical' and bill_age >= K('final_bill_age_days')) else P('card_payment_max_rolling_30d_usd'))"
      - k_fa_outcome: "XLATEST('hardship','hardship_hold_events','assistance_outcome', date_field='event_date', event_type='hardship_assistance_decision_recorded', account_id=HID) or ''"
      - credit_assistance_pct: "K('denied_pct') if k_fa_outcome == 'denied' else (K('partial_pct') if k_fa_outcome == 'approved_partial' else K('standard_pct'))"
      - k_returns_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned')"
      - k_debit_today: "SUM('account_transactions','amount', event_type='account_payment_posted', payment_channel='debit_card', txn_date=NOW)"
      - k_credit_today: "SUM('account_transactions','amount', event_type='account_payment_posted', payment_channel='credit_card', txn_date=NOW)"
      - k_cards_2m: "SUM('account_transactions','amount', within_months=2, date_field='txn_date', event_type='account_payment_posted', payment_channel='debit_card') + SUM('account_transactions','amount', within_months=2, date_field='txn_date', event_type='account_payment_posted', payment_channel='credit_card')"
      - k_credit_1m: "SUM('account_transactions','amount', within_months=1, date_field='txn_date', event_type='account_payment_posted', payment_channel='credit_card')"
      - portal_credit_counted: "k_cards_2m if (k_returns_6m >= 1 and k_debit_today > 0) else (k_debit_today + k_credit_today if (k_returns_6m == 0 and k_debit_today > 0) else k_credit_1m)"
      - rebills_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_supplemental_balance_added', adjustment_reason='insurance_denial_rebill')"
      - insurance_credits: "COUNT('account_transactions', event_type='account_client_adjustment', adjustment_reason='insurance_payment')"
      - appeal_cushion: "K('settled_appeal_cushion') if (rebills_6m >= 1 and insurance_credits >= 1) else (K('open_appeal_cushion') if (rebills_6m >= 1 and insurance_credits == 0) else 0)"
      - billing_disputes_6m: "COUNT('account_case_events', within_months=6, date_field='event_date', event_type='account_dispute_received', dispute_reason='insurance_should_have_paid') + COUNT('account_case_events', within_months=6, date_field='event_date', event_type='account_dispute_received', dispute_reason='amount_incorrect')"
      - all_disputes_6m: "COUNT('account_case_events', within_months=6, date_field='event_date', event_type='account_dispute_received')"
      - verifications_6m: "COUNT('account_case_events', within_months=6, date_field='event_date', event_type='account_verification_mailed')"
      - dispute_pct: "K('billing_dispute_pct') if (billing_disputes_6m >= 1 and verifications_6m >= 1) else (K('other_dispute_pct') if (billing_disputes_6m == 0 and all_disputes_6m >= 1 and verifications_6m >= 1) else K('standard_pct'))"
      - k_card_count_3m: "COUNT('account_transactions', within_months=3, date_field='txn_date', event_type='account_payment_posted', payment_channel='debit_card') + COUNT('account_transactions', within_months=3, date_field='txn_date', event_type='account_payment_posted', payment_channel='credit_card')"
      - k_card_returns_ever: "COUNT('account_transactions', event_type='account_payment_returned', payment_channel='debit_card') + COUNT('account_transactions', event_type='account_payment_returned', payment_channel='credit_card')"
      - steady_allowance: "K('steady_card_allowance') if (k_card_count_3m >= K('steady_card_count') and k_card_returns_ever == 0) else (K('single_card_allowance') if (k_card_count_3m == 1 and k_card_returns_ever == 0) else 0)"
      - portal_credit_figure: "RND(portal_credit_limit * credit_assistance_pct * dispute_pct - portal_credit_counted - appeal_cushion + steady_allowance, 2)"
      - result: "RND(MX(0, MN(portal_credit_figure, P('card_payment_max_per_transaction_usd'), k_balance_now)), 2)"
    compute_basis:
      k_placed_in: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_supp_in: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_ret_in: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_ref_in: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_pay_out: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_direct_out: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_credit_out: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_waive_out: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      k_balance_now: "The balance due for the portal credit-card ceiling is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the consumer opens the portal for the credit-card payment."
      bill_age: "recent_bill_limit for a medical debt whose charge-off or final-bill date is fewer than final_bill_age_days calendar days before the handling date or that has no such date"
      portal_credit_limit: "The portal credit-card limit is recent_bill_limit for a medical debt whose charge-off or final-bill date is fewer than final_bill_age_days calendar days before the handling date or that has no such date, older_bill_limit for a medical debt whose charge-off or final-bill date is final_bill_age_days or more calendar days before the handling date, and the stage's card_payment_max_rolling_30d_usd for any debt that is not medical."
      k_fa_outcome: "The portal credit-card assistance percentage is denied_pct where the latest assistance decision recorded on the account's hardship holds is denied"
      credit_assistance_pct: "The portal credit-card assistance percentage is denied_pct where the latest assistance decision recorded on the account's hardship holds is denied, partial_pct where that latest decision is approved_partial, and standard_pct where it is approved_full or no assistance decision is recorded."
      k_returns_6m: "For the portal credit-card ceiling, a payment, a return, a dispute, a verification mailing or a supplemental addition falls in the last N months when fewer than N whole calendar months separate its date from the handling date, a whole month being reached on the same day of a later month."
      k_debit_today: "where one or more returned payments were received on the account in the last six months and a debit-card payment was received on the handling date"
      k_credit_today: "the card payments, debit or credit, received on the handling date where no returned payment was received in the last six months and a debit-card payment was received on the handling date"
      k_cards_2m: "The card payments counted against the portal credit-card ceiling are every card payment, debit or credit, received in the last two months"
      k_credit_1m: "By standard method, the portal credit-card ceiling of the day is the stage's card_payment_max_rolling_30d_usd less the credit-card payments received in the last month, rounded to the cent (half to even)."
      portal_credit_counted: "The card payments counted against the portal credit-card ceiling are every card payment, debit or credit, received in the last two months where one or more returned payments were received on the account in the last six months and a debit-card payment was received on the handling date; the card payments, debit or credit, received on the handling date where no returned payment was received in the last six months and a debit-card payment was received on the handling date; and the credit-card payments received in the last month in every other case."
      rebills_6m: "settled_appeal_cushion where an insurance denial rebill was added to the account in the last six months"
      insurance_credits: "and an insurance payment credit has been booked on the account"
      appeal_cushion: "The portal credit-card appeal cushion is settled_appeal_cushion where an insurance denial rebill was added to the account in the last six months and an insurance payment credit has been booked on the account, open_appeal_cushion where an insurance denial rebill was added in the last six months and no insurance payment credit has been booked on the account, and nothing where no insurance denial rebill was added in the last six months."
      billing_disputes_6m: "billing_dispute_pct where one or more disputes with reason insurance_should_have_paid or amount_incorrect were received in the last six months"
      all_disputes_6m: "other_dispute_pct where no dispute with either of those reasons but one or more disputes with another reason were received in the last six months"
      verifications_6m: "and one or more verifications were mailed on the account in the last six months"
      dispute_pct: "The portal credit-card dispute percentage is billing_dispute_pct where one or more disputes with reason insurance_should_have_paid or amount_incorrect were received in the last six months and one or more verifications were mailed on the account in the last six months, other_dispute_pct where no dispute with either of those reasons but one or more disputes with another reason were received in the last six months and one or more verifications were mailed in the last six months, and standard_pct in every other case."
      k_card_count_3m: "steady_card_allowance where steady_card_count or more card payments, debit or credit, were received in the last three months"
      k_card_returns_ever: "and no card payment on the account was ever returned"
      steady_allowance: "The portal credit-card steady-use allowance is steady_card_allowance where steady_card_count or more card payments, debit or credit, were received in the last three months and no card payment on the account was ever returned, single_card_allowance where exactly one card payment was received in the last three months and no card payment on the account was ever returned, and nothing where no card payment was received in the last three months or a card payment on the account was ever returned."
      portal_credit_figure: "In full, the portal credit-card limit is multiplied by the portal credit-card assistance percentage and then by the portal credit-card dispute percentage, the card payments counted against the portal credit-card ceiling and the portal credit-card appeal cushion are then subtracted from that product, and the portal credit-card steady-use allowance is then added; the figure is rounded to the cent (half to even) once, after the addition."
      result: "The portal credit-card ceiling of the day is the smallest of its rounded figure, the stage's card_payment_max_per_transaction_usd and the balance due, and it is never below zero."
    factors:
      - id: portal_credit_bill_limit
        effect: parameter
        decides: portal_credit_limit
        bindings: [bill_age, portal_credit_limit]
        ladder:
          - when: "a medical debt AND its charge-off or final-bill date fewer than final_bill_age_days days ago (or no such date)"
            value: "K('recent_bill_limit')"
          - when: "a medical debt AND its charge-off or final-bill date final_bill_age_days or more days ago"
            value: "K('older_bill_limit')"
          - when: "a debt that is not medical"
            value: "P('card_payment_max_rolling_30d_usd')"
        baseline:
          portal_credit_limit: "P('card_payment_max_rolling_30d_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: portal_credit_assistance
        effect: parameter
        decides: credit_assistance_pct
        bindings: [k_fa_outcome, credit_assistance_pct]
        ladder:
          - when: "the latest assistance decision recorded on the account's hardship holds is denied"
            value: "K('denied_pct')"
          - when: "the latest assistance decision recorded is approved_partial"
            value: "K('partial_pct')"
          - when: "the latest decision is approved_full, or no assistance decision is recorded"
            value: "K('standard_pct')"
        baseline:
          credit_assistance_pct: "K('standard_pct')"
        evidence: [cross_category, history]
        cross_difficulty: hardship
      - id: portal_credit_counting_basis
        effect: method
        decides: portal_credit_counted
        bindings: [k_returns_6m, k_debit_today, k_credit_today, k_cards_2m, k_credit_1m, portal_credit_counted]
        ladder:
          - when: "one or more returned payments received in the last six months AND a debit-card payment received on the handling date"
            method: "count every card payment, debit or credit, received in the last two months"
          - when: "no returned payment received in the last six months AND a debit-card payment received on the handling date"
            method: "count only the card payments received on the handling date"
          - when: "every other case"
            method: "count only the credit-card payments received in the last month"
        baseline:
          portal_credit_counted: "k_credit_1m"
        evidence: [history]
        cross_difficulty: null
      - id: portal_credit_appeal_cushion
        effect: parameter
        decides: appeal_cushion
        bindings: [rebills_6m, insurance_credits, appeal_cushion]
        ladder:
          - when: "an insurance denial rebill added in the last six months AND an insurance payment credit booked on the account"
            value: "K('settled_appeal_cushion')"
          - when: "an insurance denial rebill added in the last six months AND no insurance payment credit booked"
            value: "K('open_appeal_cushion')"
          - when: "no insurance denial rebill added in the last six months"
            value: "0"
        baseline:
          appeal_cushion: "0"
        evidence: [history]
        cross_difficulty: null
      - id: portal_credit_dispute_history
        effect: parameter
        decides: dispute_pct
        bindings: [billing_disputes_6m, all_disputes_6m, verifications_6m, dispute_pct]
        ladder:
          - when: "a dispute with reason insurance_should_have_paid or amount_incorrect in the last six months AND a verification mailed in the last six months"
            value: "K('billing_dispute_pct')"
          - when: "no such billing dispute AND a dispute with another reason in the last six months AND a verification mailed in the last six months"
            value: "K('other_dispute_pct')"
          - when: "every other case"
            value: "K('standard_pct')"
        baseline:
          dispute_pct: "K('standard_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: portal_credit_steady_use
        effect: parameter
        decides: steady_allowance
        bindings: [k_card_count_3m, k_card_returns_ever, steady_allowance]
        ladder:
          - when: "steady_card_count or more card payments in the last three months AND no card payment ever returned"
            value: "K('steady_card_allowance')"
          - when: "exactly one card payment in the last three months AND no card payment ever returned"
            value: "K('single_card_allowance')"
          - when: "no card payment in the last three months, or a card payment ever returned"
            value: "0"
        baseline:
          steady_allowance: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        By standard method, the portal credit-card ceiling of the day is the stage's
        card_payment_max_rolling_30d_usd less the credit-card payments received in the last month,
        rounded to the cent (half to even). The portal credit-card ceiling of the day is the smallest of its
        rounded figure, the stage's card_payment_max_per_transaction_usd and the balance due, and it is
        never below zero. The balance due for the portal credit-card ceiling is the placed balance plus
        supplemental additions, returned payments and refunded overpayments, less consumer payments,
        direct payments, client credits and settlement waivers, as booked when the consumer opens the
        portal for the credit-card payment. For the portal credit-card ceiling, a payment, a return, a
        dispute, a verification mailing or a supplemental addition falls in the last N months when
        fewer than N whole calendar months separate its date from the handling date, a whole month
        being reached on the same day of a later month.
      params: [card_payment_max_rolling_30d_usd, card_payment_max_per_transaction_usd]
    inputs:
      history:
        - {table: account_transactions, aggregate: sum, field: amount, filters: {}}
        - {table: account_transactions, aggregate: sum, field: amount, within_months: 2, filters: {event_type: account_payment_posted}}
        - {table: account_case_events, aggregate: count, field: case_event_id, within_months: 6, filters: {event_type: account_dispute_received}}
        - {category: hardship, table: hardship_hold_events, aggregate: latest, field: assistance_outcome, filters: {event_type: hardship_assistance_decision_recorded}}
      cross_category: [hardship]

  - id: account_ext_reporting_floor_paydown
    base_policy_refs: [account_agg_payment_application, account_evt_payment_channels, account_evt_credit_reporting]
    overwrite:
      - base_policy: account_evt_payment_channels
        superseded_clause: >-
          a single ACH payment may not exceed ach_payment_max_per_transaction_usd
        replaced_by: >-
          The reporting-floor pay-down is the smallest of its rounded figure, the stage's
          ach_payment_max_per_transaction_usd and the balance due, and it is never below zero.
    trigger: on_request
    subject: [account_payment_posted]
    computes: amount
    target_tool: take_phone_bank_payment_d463b192
    params:
      medical_floor: 500.00
      installment_floor: 250.00
      general_floor: 100.00
      wide_margin: 25.00
      narrow_margin: 10.00
      cent_margin: 0.01
      decision_recency_months: 3
      chargeback_cushion: 75.00
      card_day_cushion: 25.00
      recoup_rebilled_reserve: 40.00
      recoup_plain_reserve: 20.00
    rule: >-
      When a consumer asks to bring a placed account's balance below the credit-reporting minimum
      and authorizes the phone desk to debit their bank account, the phone desk takes one bank-debit
      payment equal to the reporting-floor pay-down, posted on the handling date with the processor
      confirmation as its reference. Where the consumer also pays part of it by credit card through
      the payment portal, the reporting-floor pay-down is not fixed until the day's portal
      credit-card payment has been made. By standard method, the reporting-floor pay-down is the
      balance due for the pay-down less the reporting floor plus cent_margin, rounded to the cent
      (half to even). The reporting-floor pay-down is the smallest of its rounded figure, the
      stage's ach_payment_max_per_transaction_usd and the balance due, and it is never below zero.
      The balance due for the pay-down is the placed balance plus supplemental additions, returned
      payments and refunded overpayments, less consumer payments, direct payments, client credits
      and settlement waivers, as booked when the phone desk works the pay-down out, every payment of
      the handling date included. The reporting floor is the debt type's amount in the credit
      reporting minimums: medical_floor for a medical debt, installment_floor for an auto_deficiency
      or private_student_loan debt, and general_floor for any other debt type. For the
      reporting-floor pay-down, a payment, a return, a credit, a supplemental addition or an
      assistance decision falls in the last N months when fewer than N whole calendar months
      separate its date from the handling date, a whole month being reached on the same day of a
      later month. In full, the reportable balance is the balance due for the pay-down plus the
      provisional payments added back; the reporting floor is subtracted from the reportable
      balance, and the pay-down margin, the card chargeback cushion and the insurer recoupment
      reserve are then added; the figure is rounded to the cent (half to even) once, after the
      additions. The pay-down margin is wide_margin where the latest assistance decision recorded on
      the account's hardship holds is denied and was recorded in the last decision_recency_months
      months, narrow_margin where that latest decision is denied and was recorded
      decision_recency_months or more months before the handling date, and cent_margin where the
      latest recorded decision is not denied or no decision is recorded. The provisional payments
      added back are every bank-debit and card payment received in the last two months where one or
      more payments returned for unauthorized_debit or stop_payment were received on the account in
      the last six months, the bank-debit payments received in the last two months where no such
      return but one or more payments returned for nsf or account_closed were received in the last
      six months, and nothing where no payment returned for any of those four reasons was received
      in the last six months. The card chargeback cushion is chargeback_cushion where a credit-card
      payment was received on the handling date and a card payment on the account was ever returned
      as a card_chargeback, card_day_cushion where a credit-card payment was received on the
      handling date and no card payment on the account was ever charged back, and nothing where no
      credit-card payment was received on the handling date. The insurer recoupment reserve is
      recoup_rebilled_reserve where an insurance payment credit was booked on the account in the
      last three months and an insurance denial rebill was added in the last six months,
      recoup_plain_reserve where an insurance payment credit was booked in the last three months and
      no insurance denial rebill was added in the last six months, and nothing where no insurance
      payment credit was booked in the last three months. Whether the account can still receive an
      initial report at all is decided by the credit reporting rule, which this pay-down does not
      restate.
    prerequisite:
      - problem: account_ext_portal_credit_card_ceiling
        kind: value_input
        gate: card_cushion
        form: action
        policy_source: >-
          Where the consumer also pays part of it by credit card through the payment portal, the
          reporting-floor pay-down is not fixed until the day's portal credit-card payment has been
          made.
        fallback_reason: >-
          A credit-card payment dated the handling date is booked both by the consumer's portal
          credit-card payment and by the phone desk's credit-card ceiling payment, so the
          record-visible state "a credit-card payment received on the handling date" does not single
          out the one write this pay-down waits on; the sentence therefore names the portal
          credit-card payment.
        condition: >-
          The account's money history carries an account_payment_posted entry with payment channel
          credit_card dated the handling date, made by the consumer through the payment portal at
          the portal credit-card ceiling of the day.
        resolved_by: make_portal_credit_card_payment_7a2662c6
        effect: >-
          The day's portal credit-card payment lowers the balance due for the pay-down and moves the
          card chargeback cushion from nothing to card_day_cushion or chargeback_cushion, so the
          pay-down is worked out after it.
    cross_category:
      - category: hardship
        as: history
        reads: [hardship_hold_events.assistance_outcome, hardship_hold_events.event_date]
        note: The pay-down margin is decided from the latest assistance decision recorded on the account's hardship holds and when it was recorded.
    compute:
      - f_placed_in: "SUM('account_transactions','amount', event_type='account_balance_placed')"
      - f_supp_in: "SUM('account_transactions','amount', event_type='account_supplemental_balance_added')"
      - f_ret_in: "SUM('account_transactions','amount', event_type='account_payment_returned')"
      - f_ref_in: "SUM('account_transactions','amount', event_type='account_overpayment_refunded')"
      - f_pay_out: "SUM('account_transactions','amount', event_type='account_payment_posted')"
      - f_direct_out: "SUM('account_transactions','amount', event_type='account_direct_payment_reported')"
      - f_credit_out: "SUM('account_transactions','amount', event_type='account_client_adjustment')"
      - f_waive_out: "SUM('account_transactions','amount', event_type='account_settlement_balance_waived')"
      - f_balance_now: "RND(f_placed_in + f_supp_in + f_ret_in + f_ref_in - f_pay_out - f_direct_out - f_credit_out - f_waive_out, 2)"
      - reporting_floor: "K('medical_floor') if F('debt_type') == 'medical' else (K('installment_floor') if (F('debt_type') == 'auto_deficiency' or F('debt_type') == 'private_student_loan') else K('general_floor'))"
      - f_fa_outcome: "XLATEST('hardship','hardship_hold_events','assistance_outcome', date_field='event_date', event_type='hardship_assistance_decision_recorded', account_id=HID) or ''"
      - f_fa_decided_on: "XLATEST('hardship','hardship_hold_events','event_date', date_field='event_date', event_type='hardship_assistance_decision_recorded', account_id=HID) or ''"
      - f_decision_months: "MONTHS(f_fa_decided_on or '1900-01-01', NOW)"
      - paydown_margin: "K('wide_margin') if (f_fa_outcome == 'denied' and f_decision_months < K('decision_recency_months')) else (K('narrow_margin') if (f_fa_outcome == 'denied' and f_decision_months >= K('decision_recency_months')) else K('cent_margin'))"
      - consumer_reversals_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned', return_reason='unauthorized_debit') + COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned', return_reason='stop_payment')"
      - bank_side_returns_6m: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned', return_reason='nsf') + COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_payment_returned', return_reason='account_closed')"
      - bank_sum_2m: "SUM('account_transactions','amount', within_months=2, date_field='txn_date', event_type='account_payment_posted', payment_channel='ach_bank_debit')"
      - card_sum_2m: "SUM('account_transactions','amount', within_months=2, date_field='txn_date', event_type='account_payment_posted', payment_channel='debit_card') + SUM('account_transactions','amount', within_months=2, date_field='txn_date', event_type='account_payment_posted', payment_channel='credit_card')"
      - provisional_addback: "bank_sum_2m + card_sum_2m if consumer_reversals_6m >= 1 else (bank_sum_2m if (consumer_reversals_6m == 0 and bank_side_returns_6m >= 1) else 0)"
      - credit_today_paydown: "SUM('account_transactions','amount', event_type='account_payment_posted', payment_channel='credit_card', txn_date=NOW)"
      - chargebacks_ever: "COUNT('account_transactions', event_type='account_payment_returned', return_reason='card_chargeback')"
      - card_cushion: "K('chargeback_cushion') if (credit_today_paydown > 0 and chargebacks_ever >= 1) else (K('card_day_cushion') if (credit_today_paydown > 0 and chargebacks_ever == 0) else 0)"
      - insurance_credits_3m: "COUNT('account_transactions', within_months=3, date_field='txn_date', event_type='account_client_adjustment', adjustment_reason='insurance_payment')"
      - rebills_6m_f: "COUNT('account_transactions', within_months=6, date_field='txn_date', event_type='account_supplemental_balance_added', adjustment_reason='insurance_denial_rebill')"
      - recoup_reserve: "K('recoup_rebilled_reserve') if (insurance_credits_3m >= 1 and rebills_6m_f >= 1) else (K('recoup_plain_reserve') if (insurance_credits_3m >= 1 and rebills_6m_f == 0) else 0)"
      - paydown_figure: "RND(f_balance_now + provisional_addback - reporting_floor + paydown_margin + card_cushion + recoup_reserve, 2)"
      - result: "RND(MX(0, MN(paydown_figure, P('ach_payment_max_per_transaction_usd'), f_balance_now)), 2)"
    compute_basis:
      f_placed_in: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_supp_in: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_ret_in: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_ref_in: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_pay_out: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_direct_out: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_credit_out: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_waive_out: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      f_balance_now: "The balance due for the pay-down is the placed balance plus supplemental additions, returned payments and refunded overpayments, less consumer payments, direct payments, client credits and settlement waivers, as booked when the phone desk works the pay-down out, every payment of the handling date included."
      reporting_floor: "The reporting floor is the debt type's amount in the credit reporting minimums: medical_floor for a medical debt, installment_floor for an auto_deficiency or private_student_loan debt, and general_floor for any other debt type."
      f_fa_outcome: "The pay-down margin is wide_margin where the latest assistance decision recorded on the account's hardship holds is denied"
      f_fa_decided_on: "and was recorded in the last decision_recency_months months"
      f_decision_months: "For the reporting-floor pay-down, a payment, a return, a credit, a supplemental addition or an assistance decision falls in the last N months when fewer than N whole calendar months separate its date from the handling date, a whole month being reached on the same day of a later month."
      paydown_margin: "The pay-down margin is wide_margin where the latest assistance decision recorded on the account's hardship holds is denied and was recorded in the last decision_recency_months months, narrow_margin where that latest decision is denied and was recorded decision_recency_months or more months before the handling date, and cent_margin where the latest recorded decision is not denied or no decision is recorded."
      consumer_reversals_6m: "where one or more payments returned for unauthorized_debit or stop_payment were received on the account in the last six months"
      bank_side_returns_6m: "the bank-debit payments received in the last two months where no such return but one or more payments returned for nsf or account_closed were received in the last six months"
      bank_sum_2m: "the bank-debit payments received in the last two months"
      card_sum_2m: "The provisional payments added back are every bank-debit and card payment received in the last two months"
      provisional_addback: "The provisional payments added back are every bank-debit and card payment received in the last two months where one or more payments returned for unauthorized_debit or stop_payment were received on the account in the last six months, the bank-debit payments received in the last two months where no such return but one or more payments returned for nsf or account_closed were received in the last six months, and nothing where no payment returned for any of those four reasons was received in the last six months."
      credit_today_paydown: "card_day_cushion where a credit-card payment was received on the handling date and no card payment on the account was ever charged back"
      chargebacks_ever: "The card chargeback cushion is chargeback_cushion where a credit-card payment was received on the handling date and a card payment on the account was ever returned as a card_chargeback"
      card_cushion: "The card chargeback cushion is chargeback_cushion where a credit-card payment was received on the handling date and a card payment on the account was ever returned as a card_chargeback, card_day_cushion where a credit-card payment was received on the handling date and no card payment on the account was ever charged back, and nothing where no credit-card payment was received on the handling date."
      insurance_credits_3m: "where an insurance payment credit was booked on the account in the last three months"
      rebills_6m_f: "and an insurance denial rebill was added in the last six months"
      recoup_reserve: "The insurer recoupment reserve is recoup_rebilled_reserve where an insurance payment credit was booked on the account in the last three months and an insurance denial rebill was added in the last six months, recoup_plain_reserve where an insurance payment credit was booked in the last three months and no insurance denial rebill was added in the last six months, and nothing where no insurance payment credit was booked in the last three months."
      paydown_figure: "In full, the reportable balance is the balance due for the pay-down plus the provisional payments added back; the reporting floor is subtracted from the reportable balance, and the pay-down margin, the card chargeback cushion and the insurer recoupment reserve are then added; the figure is rounded to the cent (half to even) once, after the additions."
      result: "The reporting-floor pay-down is the smallest of its rounded figure, the stage's ach_payment_max_per_transaction_usd and the balance due, and it is never below zero."
    factors:
      - id: paydown_margin_rule
        effect: parameter
        decides: paydown_margin
        bindings: [f_fa_outcome, f_fa_decided_on, f_decision_months, paydown_margin]
        ladder:
          - when: "the latest recorded assistance decision is denied AND it was recorded in the last decision_recency_months months"
            value: "K('wide_margin')"
          - when: "the latest recorded assistance decision is denied AND it was recorded decision_recency_months or more months ago"
            value: "K('narrow_margin')"
          - when: "the latest recorded decision is not denied, or none is recorded"
            value: "K('cent_margin')"
        baseline:
          paydown_margin: "K('cent_margin')"
        evidence: [cross_category, date]
        cross_difficulty: hardship
      - id: paydown_provisional_addback
        effect: method
        decides: provisional_addback
        bindings: [consumer_reversals_6m, bank_side_returns_6m, bank_sum_2m, card_sum_2m, provisional_addback]
        ladder:
          - when: "one or more payments returned for unauthorized_debit or stop_payment in the last six months"
            method: "add back every bank-debit and card payment received in the last two months"
          - when: "no such return AND one or more payments returned for nsf or account_closed in the last six months"
            method: "add back only the bank-debit payments received in the last two months"
          - when: "no payment returned for any of those four reasons in the last six months"
            method: "add nothing back; the reportable balance is the balance due"
        baseline:
          provisional_addback: "0"
        evidence: [history]
        cross_difficulty: null
      - id: paydown_card_cushion
        effect: parameter
        decides: card_cushion
        bindings: [credit_today_paydown, chargebacks_ever, card_cushion]
        ladder:
          - when: "a credit-card payment received on the handling date AND a card payment on the account ever charged back"
            value: "K('chargeback_cushion')"
          - when: "a credit-card payment received on the handling date AND no card payment ever charged back"
            value: "K('card_day_cushion')"
          - when: "no credit-card payment received on the handling date"
            value: "0"
        baseline:
          card_cushion: "0"
        evidence: [history]
        cross_difficulty: null
      - id: paydown_recoupment_reserve
        effect: parameter
        decides: recoup_reserve
        bindings: [insurance_credits_3m, rebills_6m_f, recoup_reserve]
        ladder:
          - when: "an insurance payment credit booked in the last three months AND an insurance denial rebill added in the last six months"
            value: "K('recoup_rebilled_reserve')"
          - when: "an insurance payment credit booked in the last three months AND no insurance denial rebill in the last six months"
            value: "K('recoup_plain_reserve')"
          - when: "no insurance payment credit booked in the last three months"
            value: "0"
        baseline:
          recoup_reserve: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        By standard method, the reporting-floor pay-down is the balance due for the pay-down less
        the reporting floor plus cent_margin, rounded to the cent (half to even). The
        reporting-floor pay-down is the smallest of its rounded figure, the stage's
        ach_payment_max_per_transaction_usd and the balance due, and it is never below zero. The
        balance due for the pay-down is the placed balance plus supplemental additions, returned
        payments and refunded overpayments, less consumer payments, direct payments, client credits
        and settlement waivers, as booked when the phone desk works the pay-down out, every payment
        of the handling date included. The reporting floor is the debt type's amount in the credit
        reporting minimums: medical_floor for a medical debt, installment_floor for an
        auto_deficiency or private_student_loan debt, and general_floor for any other debt type. For
        the reporting-floor pay-down, a payment, a return, a credit, a supplemental addition or an
        assistance decision falls in the last N months when fewer than N whole calendar months
        separate its date from the handling date, a whole month being reached on the same day of a
        later month.
      params: [medical_floor, installment_floor, general_floor, cent_margin, ach_payment_max_per_transaction_usd]
    inputs:
      history:
        - {table: account_transactions, aggregate: sum, field: amount, filters: {}}
        - {table: account_transactions, aggregate: sum, field: amount, within_months: 2, filters: {event_type: account_payment_posted}}
        - {table: account_transactions, aggregate: count, field: txn_id, within_months: 6, filters: {event_type: account_payment_returned}}
        - {table: account_transactions, aggregate: count, field: txn_id, within_months: 3, filters: {event_type: account_client_adjustment, adjustment_reason: insurance_payment}}
        - {category: hardship, table: hardship_hold_events, aggregate: latest, field: assistance_outcome, filters: {event_type: hardship_assistance_decision_recorded}}
      cross_category: [hardship]
