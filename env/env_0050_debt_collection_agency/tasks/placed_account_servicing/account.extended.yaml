    compute:
      - d_placed_in: "SUM('account_transactions','amount', event_type='account_balance_placed')"
      - d_supp_in: "SUM('account_transactions','amount', event_type='account_supplemental_balance_added')"
      - d_ret_in: "SUM('account_transactions','amount', event_type='account_payment_returned')"
