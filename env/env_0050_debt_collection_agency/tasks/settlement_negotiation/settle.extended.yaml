events:
  # ---- holding writes (settlement_agreements) ----
  - type: settle_offer_issued
    target: settlement_agreements
    mutation: create
    meaning: Ridgeline extends a written settlement offer on one placed account.
    grain: one row per offer extended.
    fields:
      customer_id: The consumer who owes the account.
      account_id: The placed account the offer would settle.
      approval_request_id: The client approval relied on when the offer is below Ridgeline's own authority; empty otherwise.
      variant_name: The settlement programme.
      offer_date: The date the offer is extended.
      offer_expiry_date: The last day the offer may be accepted.
      balance_at_offer: The account's balance_due on the offer date.
      settlement_pct: The settlement percentage offered.
      settlement_amount: The amount that settles the account.
      payment_count: The number of settlement payments.
      payment_interval_days: Calendar days between consecutive settlement payments; 0 for a single payment.
      first_payment_due_date: The due date of the first settlement payment if accepted on the offer date.
      final_payment_due_date: The due date of the final settlement payment if accepted on the offer date.
      bundle_applied: Whether the bundle floor reduction was used.
    triggers:
      - event: settle:settle_letter_issued
        map: {letter_type: offer_letter, txn_date: offer_date}
  - type: settle_offer_accepted
    target: settlement_agreements
    mutation: {transition: {from: offered, to: accepted}}
    meaning: The consumer accepts the settlement offer.
    grain: one row per transaction.
    fields:
      accepted_date: The date of acceptance.
      acceptance_method: Recorded call, portal acceptance or electronic signature.
      first_payment_due_date: The due date of the first payment counted from acceptance.
      final_payment_due_date: The due date of the final payment counted from acceptance.
    triggers:
      - event: settle:settle_amount_scheduled
        map: {txn_date: accepted_date}
      - event: settle:settle_letter_issued
        map: {letter_type: acceptance_confirmation, txn_date: accepted_date}
      - event: account:account_arrangement_opened
  - type: settle_offer_expired
    target: settlement_agreements
    mutation: {transition: {from: offered, to: expired}}
    meaning: The offer lapses unaccepted.
    grain: one row per transaction.
    fields:
      closed_date: The first day after offer_expiry_date.
    triggers: []
  - type: settle_offer_withdrawn
    target: settlement_agreements
    mutation:
      transition:
        - {from: offered, to: withdrawn}
        - {from: accepted, to: withdrawn}
    meaning: Ridgeline withdraws an open or accepted settlement.
    grain: one row per transaction.
    fields:
      closed_date: The withdrawal date.
      withdrawal_reason: Why the settlement was withdrawn.
    triggers: []
  - type: settle_defaulted
    target: settlement_agreements
    mutation: {transition: {from: accepted, to: defaulted}}
    meaning: An accepted settlement defaults because a payment was not made in time or too many payments were returned.
    grain: one row per transaction.
    fields:
      closed_date: The default date.
    triggers:
      - event: settle:settle_balance_released
        map: {txn_date: closed_date, release_reason: default}
      - event: settle:settle_letter_issued
        map: {letter_type: default_notice, txn_date: closed_date}
      - event: account:account_arrangement_closed
  - type: settle_fulfilled
    target: settlement_agreements
    mutation: {transition: {from: accepted, to: fulfilled}}
    meaning: Every settlement payment has been made and has cleared, and the account is settled.
    grain: one row per transaction.
    fields:
      closed_date: The fulfillment date.
      waived_amount: The account balance_due waived on fulfillment.
    triggers:
      - event: account:account_settlement_balance_waived
        map: {amount: waived_amount, txn_date: closed_date, settlement_id: settlement_id, account_id: account_id}
      - event: account:account_settled_in_full
        map: {closed_date: closed_date}
  - type: settle_due_date_extended
    target: settlement_agreements
    mutation: update
    meaning: The consumer is granted more time for the next unpaid settlement payment and every later one.
    grain: one row per transaction.
    fields:
      due_date_extension_count: The number of extensions granted, after this one.
      extension_days_total: The total calendar days added by all extensions.
      final_payment_due_date: The final payment due date after the extension.
    triggers: []
  # ---- ledger writes (settlement_payments) ----
  - type: settle_amount_scheduled
    target: settlement_payments
    meaning: The settlement amount is booked to the settlement on acceptance.
    grain: one row per accepted settlement.
    distinguish_by: [txn_date]
    fields:
      account_id: The placed account being settled.
      amount: The settlement amount.
      txn_date: The acceptance date.
    account: settlement_balance
    direction: in
    triggers: []
  - type: settle_payment_received
    target: settlement_payments
    meaning: A settlement payment is received.
    grain: one row per payment received, identified by its processor confirmation.
    distinguish_by: [payment_ref]
    fields:
      account_id: The placed account being settled.
      payment_number: The settlement payment the funds are applied to.
      due_date: The due date of that payment.
      amount: The amount received.
      txn_date: The date the funds were received.
      payment_channel: How the payment was made.
      payment_ref: The processor confirmation number, verbatim.
    account: settlement_balance
    direction: out
    triggers:
      - event: account:account_payment_posted
        map: {account_id: account_id, amount: amount, txn_date: txn_date, payment_channel: payment_channel, payment_ref: payment_ref, settlement_id: settlement_id}
  - type: settle_payment_returned
    target: settlement_payments
    meaning: A settlement payment is returned unpaid or charged back.
    grain: one row per returned payment, pointing to the original payment.
    distinguish_by: [source_settle_txn_id]
    fields:
      account_id: The placed account being settled.
      payment_number: The settlement payment the returned funds had been applied to.
      amount: The returned amount.
      txn_date: The date the return was received.
      source_settle_txn_id: The settle_payment_received row being returned.
      payment_channel: The channel of the original payment.
      return_reason: Why the payment was returned.
    account: settlement_balance
    direction: in
    triggers:
      - event: account:account_payment_returned
        map: {account_id: account_id, amount: amount, txn_date: txn_date, payment_channel: payment_channel, return_reason: return_reason}
  - type: settle_balance_released
    target: settlement_payments
    meaning: When an accepted settlement defaults or is withdrawn, the amount still due under it is released and the discount is lost.
    grain: one row per defaulted or withdrawn accepted settlement.
    distinguish_by: [release_reason]
    fields:
      account_id: The placed account.
      amount: The settlement balance remaining.
      txn_date: The default or withdrawal date.
      release_reason: Default or withdrawal.
    account: settlement_balance
    direction: out
    triggers: []
  - type: settle_letter_issued
    target: settlement_payments
    meaning: Ridgeline sends a settlement letter — the written offer, the acceptance confirmation or the default notice.
    grain: one row per letter type per settlement.
    distinguish_by: [letter_type]
    fields:
      account_id: The placed account.
      letter_type: Which settlement letter.
      txn_date: The date the letter is sent.
      delivery_channel: Mail or email.
      disclosure_variant: Standard terms or terms carrying the time-barred disclosure.
      tax_notice_included: Whether the cancelled-debt tax notice is included.
    triggers: []

measures:
  - id: settle_msr_offers_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of settlement_agreements rows on the same placed account by offer_date, every programme and status included.
  - id: settle_msr_returned_payments
    window: The life of the accepted settlement.
    measure: Count of settle_payment_returned rows on the settlement.
  - id: settle_msr_paid_total
    window: The life of the accepted settlement, through the handling date.
    measure: Sum of amount over settle_payment_received rows on the settlement less the amount of settle_payment_returned rows pointing to them.
  - id: settle_msr_declined_approvals_12m
    window: Rolling 365 calendar days ending on the handling date, both ends included.
    measure: Count of settlement_approval_requests rows on the same placed account with request_status declined, by decision_date.

policies:
  - id: settle_agg_multi_holding
    subject: [settle_offer_issued]
    rule: >-
      A consumer may hold settlements on any number of placed accounts, but each settlement covers
      exactly one placed account. A new offer is extended only when no other settlement on the
      same placed account is offered or accepted; a consumer who wants different terms on an open
      offer has the open offer withdrawn with reason superseded_by_new_offer before the new one is
      extended, and an accepted settlement is never replaced while it is in good standing.
    eligibility:
      - id: one_open_settlement_per_account
        applies_to: [settle_offer_issued]
        kind: dedup
        condition: A new offer is extended only when no other settlement on the same placed account is offered or accepted; a consumer who wants different terms on an open offer has the open offer withdrawn with reason superseded_by_new_offer before the new one is extended, and an accepted settlement is never replaced while it is in good standing.
        evidence_fields: [settlement_agreements.account_id, settlement_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.account_id]
          action_bindings:
            settlement_agreements.account_id: account_id
        dedup_contract:
          table: settlement_agreements
          mode: separate_record
          object_bindings: {account_id: account_id}
          duplicate_filters: {status: [offered, accepted]}
          distinct_fields: [offer_date]
    params:
      max_per_customer: null

  - id: settle_agg_same_client_bundle
    subject: [settle_offer_issued]
    rule: >-
      Settlements are combined across a consumer's accounts only through the same-client bundle.
      When the consumer settles together every one of their open placed accounts placed under the
      same client agreement, the accounts number at least the programme's bundle_min_accounts, and
      every offer in the bundle uses a programme whose bundle_floor_reduction_pct is above 0.0, each
      offer's floor is lowered by that programme's bundle_floor_reduction_pct and the offers carry
      bundle_applied true. All offers of a bundle are extended on the same offer_date and use the
      same programme. Accounts under different client agreements never form a bundle, even when the
      original creditor is the same, and an account in dispute_hold, or one that cannot take a
      settlement for any other reason, stops the bundle for every account under that agreement
      because the bundle must cover all of them. If any offer of a bundle later expires, defaults
      or is withdrawn, the other offers keep their terms; the reduction is not taken back.
    eligibility: []
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Lump-Sum Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Two-Payment Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Three-Payment Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Six-Payment Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}
        Hardship Settlement: {bundle_pct: =bundle_floor_reduction_pct, bundle_min: =bundle_min_accounts}

  - id: settle_offer_authority
    subject: [settle_offer_issued]
    rule: >-
      A settlement offer is extended only on a placed account whose status is validation_period,
      active, arranged or hardship_hold; accounts in placed, dispute_hold or any terminal status
      receive no offer. The programme's floor for the account is read from its authority floor for
      the account's stage (authority_floor_pct_early_out through authority_floor_pct_legal_review),
      lowered by the percentage points listed for the placing agreement's tier in
      client_tier_floor_reduction_pct and by any bundle reduction, but never below the programme's
      approval floor for the same stage; a stage whose authority floor is 100.0 is not offered that
      programme. Ridgeline may offer any settlement_pct at or above that floor on its own authority;
      a lower percentage, down to the approval floor and no further, needs a client approval on
      record. A Prompt-Pay Discount Settlement is always offered at 100.0 less
      prompt_pay_discount_pct. The settlement amount is balance_at_offer times settlement_pct,
      rounded up to the programme's settlement_rounding_unit_usd, and may not be below
      min_settlement_amount_usd. Client approval is also needed, whatever the percentage, when
      balance_at_offer exceeds max_settlement_balance_usd or balance_at_offer less the settlement
      amount exceeds max_waiver_usd. The offer date is the handling date and offer_expiry_date is the
      offer date plus offer_validity_days calendar days. A programme is offered only when the
      handling date is on or after the programme's waiting period counted from the account's
      placement_date. The waiting period is the programme's min_days_since_placement in calendar days,
      the day after placement_date being day one. A programme is not offered again on an account
      when the handling date is not later than the cooling-off period counted from the closed_date of
      the account's most recent settlement that expired or defaulted. The cooling-off period is the
      new programme's reoffer_cooling_off_days in calendar days, the day after that closed_date being
      day one. When settle_msr_offers_12m has reached a programme's max_offers_per_account_12_months
      that programme is not offered. The schedule offered has between payment_count_min and
      payment_count_max payments; the first payment is at least min_first_payment_pct of the
      settlement amount, the rest is split evenly over the remaining payments rounded up to the cent
      with the final payment absorbing the rounding, every payment but a clearing final one is at
      least min_payment_amount_usd, the first falls due within first_payment_max_days_after_acceptance
      calendar days of acceptance, payments are payment_interval_days apart with the interval no
      more than max_days_between_payments, later payments never fall after the
      settlement_payment_due_day_max day of a month, and the final payment falls due within
      settlement_window_max_days calendar days of acceptance. The due dates on the offer assume
      acceptance on the offer date and are recomputed from the actual acceptance date.
    eligibility:
      - id: offer_account_status
        applies_to: [settle_offer_issued]
        kind: state
        condition: A settlement offer is extended only on a placed account whose status is validation_period, active, arranged or hardship_hold; accounts in placed, dispute_hold or any terminal status receive no offer.
        evidence_fields: [placed_accounts.status, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        state_contract:
          field: placed_accounts.status
          allowed: [validation_period, active, arranged, hardship_hold]
      - id: placement_waiting_period
        applies_to: [settle_offer_issued]
        kind: time
        condition: A programme is offered only when the handling date is on or after the programme's waiting period counted from the account's placement_date.
        evidence_fields: [placed_accounts.placement_date, placed_accounts.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [placed_accounts.account_id]
          action_bindings:
            placed_accounts.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account's placement_date
          anchor_source: placed_accounts.placement_date
          relation: not_before
          duration_source: variants.min_days_since_placement
          unit: calendar_days
          counting_rule: The waiting period is the programme's min_days_since_placement in calendar days, the day after placement_date being day one.
          boundary: inclusive
      - id: reoffer_cooling_off
        applies_to: [settle_offer_issued]
        kind: time
        condition: A programme is not offered again on an account when the handling date is not later than the cooling-off period counted from the closed_date of the account's most recent settlement that expired or defaulted.
        evidence_fields: [settlement_agreements.closed_date, settlement_agreements.status, settlement_agreements.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.account_id]
          action_bindings:
            settlement_agreements.account_id: account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the closed_date of the account's most recent settlement that expired or defaulted
          anchor_source: settlement_agreements.closed_date
          relation: not_before
          duration_source: variants.reoffer_cooling_off_days
          unit: calendar_days
          counting_rule: The cooling-off period is the new programme's reoffer_cooling_off_days in calendar days, the day after that closed_date being day one.
          boundary: exclusive
    params:
      stage_authority_floor_pct:
        Early-Out Placement: authority_floor_pct_early_out
        Primary Placement: authority_floor_pct_primary
        Secondary Placement: authority_floor_pct_secondary
        Tertiary Placement: authority_floor_pct_tertiary
        Warehouse Placement: authority_floor_pct_warehouse
        Legal Review Placement: authority_floor_pct_legal_review
      stage_approval_floor_pct:
        Early-Out Placement: approval_floor_pct_early_out
        Primary Placement: approval_floor_pct_primary
        Secondary Placement: approval_floor_pct_secondary
        Tertiary Placement: approval_floor_pct_tertiary
        Warehouse Placement: approval_floor_pct_warehouse
        Legal Review Placement: approval_floor_pct_legal_review
      client_tier_floor_reduction_pct:
        Starter Contingency Agreement: 0.0
        Standard Contingency Agreement: 0.0
        Preferred Contingency Agreement: 2.5
        Select Volume Contingency Agreement: 5.0
        Enterprise Contingency Agreement: 5.0
        Strategic Partner Contingency Agreement: 7.5
      per_tier:
        Prompt-Pay Discount Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Lump-Sum Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Two-Payment Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Three-Payment Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Six-Payment Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
        Hardship Settlement: {primary_floor: =authority_floor_pct_primary, secondary_floor: =authority_floor_pct_secondary, warehouse_floor: =authority_floor_pct_warehouse, validity_days: =offer_validity_days, max_waiver: =max_waiver_usd}
    formula:
      own_authority_floor_pct: max(stage_authority_floor_pct - client_tier_floor_reduction_pct - bundle_floor_reduction_pct, stage_approval_floor_pct)
      needs_client_approval: settlement_pct < own_authority_floor_pct or balance_at_offer > max_settlement_balance_usd or balance_at_offer - settlement_amount > max_waiver_usd
      unrounded_settlement_amount_usd: balance_at_offer * settlement_pct / 100
    measures: [settle_msr_offers_12m]

  - id: settle_evt_client_approval
    subject: [settle_offer_issued]
    rule: >-
      When an offer needs client approval, Ridgeline first files an approval request with the
      programme, the requested percentage and amount; the client answers within the programme's
      client_response_due_business_days business days, and a request still unanswered after that
      lapses. Programmes whose client_response_due_business_days is 0 cannot use approval requests.
      An offer that needs client approval is extended only on an approval request for the same
      account and programme whose request_status is approved, at a settlement_pct no lower than the
      approved_pct, and the offer carries that request in approval_request_id. An approved offer is
      extended only when the handling date is no later than the last day of the approval validity
      counted from the approval's decision_date. The approval validity is the programme's
      approval_valid_days in calendar days, the day after decision_date being day one and the last
      day included. After a decline, a new request on the same account is filed only when
      settle_msr_declined_approvals_12m is no more than approval_resubmission_max and more than
      declined_approval_cooling_off_days calendar days have passed since the decline's
      decision_date. A request is never filed below the programme's approval floor for the
      account's stage, and an approval never authorizes a different account, programme or a lower
      percentage than approved.
    eligibility:
      - id: approval_on_record
        applies_to: [settle_offer_issued]
        kind: state
        condition: An offer that needs client approval is extended only on an approval request for the same account and programme whose request_status is approved, at a settlement_pct no lower than the approved_pct, and the offer carries that request in approval_request_id.
        evidence_fields: [settlement_approval_requests.request_status, settlement_approval_requests.approved_pct, settlement_approval_requests.requested_variant_name, settlement_approval_requests.approval_request_id, settlement_approval_requests.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_approval_requests.approval_request_id]
          action_bindings:
            settlement_approval_requests.approval_request_id: approval_request_id
        state_contract:
          field: settlement_approval_requests.request_status
          allowed: [approved]
      - id: approval_still_valid
        applies_to: [settle_offer_issued]
        kind: time
        condition: An approved offer is extended only when the handling date is no later than the last day of the approval validity counted from the approval's decision_date.
        evidence_fields: [settlement_approval_requests.decision_date, settlement_approval_requests.approval_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_approval_requests.approval_request_id]
          action_bindings:
            settlement_approval_requests.approval_request_id: approval_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the approval's decision_date
          anchor_source: settlement_approval_requests.decision_date
          relation: not_after
          duration_source: variants.approval_valid_days
          unit: calendar_days
          counting_rule: The approval validity is the programme's approval_valid_days in calendar days, the day after decision_date being day one and the last day included.
          boundary: inclusive
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Lump-Sum Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Two-Payment Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Three-Payment Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Six-Payment Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
        Hardship Settlement: {response_days: =client_response_due_business_days, valid_days: =approval_valid_days, resubmissions: =approval_resubmission_max}
    measures: [settle_msr_declined_approvals_12m]

  - id: settle_combo_plan_and_hardship
    subject: [settle_offer_issued, settle_offer_accepted]
    rule: >-
      A settlement and a payment plan never run together on one account, and a hardship hold
      changes which settlements may be offered. An offer may be extended on an account that has a
      plan in any status, but when the consumer accepts, any plan on that account in
      pending_authorization, active, suspended or broken status is cancelled the same day with
      close_reason superseded_by_settlement, and installments already paid stay applied to the
      account and reduce the balance, not the settlement amount. The plan is cancelled and any
      hardship hold the acceptance ends is ended before the acceptance itself, so the account is in
      active when the acceptance moves it to arranged. An offer on an account in
      hardship_hold is extended only when the tier of the hold in force has
      settlement_offers_during_hold_allowed set to true. A Hardship Settlement is offered only when
      the account's most recent hardship hold is in status active, or has status ended
      with an ended_date no more than that hold tier's post_hold_hardship_window_days calendar days
      before the offer date, and in every case that hold tier's hardship_settlement_eligible_after_hold
      is true. A hardship hold denied, withdrawn or ended outside the window never qualifies, and a
      consumer's statement of hardship without a qualifying hold on record does not qualify.
    eligibility:
      - id: qualifying_hold_for_hardship_settlement
        applies_to: [settle_offer_issued]
        kind: state
        condition: A Hardship Settlement is offered only when the account's most recent hardship hold is in status active, or has status ended with an ended_date no more than that hold tier's post_hold_hardship_window_days calendar days before the offer date, and in every case that hold tier's hardship_settlement_eligible_after_hold is true.
        evidence_fields: [hardship_holds.status, hardship_holds.ended_date, hardship_holds.variant_name, hardship_holds.account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_holds.account_id]
          action_bindings:
            hardship_holds.account_id: account_id
        state_contract:
          field: hardship_holds.status
          allowed: [active, ended]

  - id: settle_evt_acceptance_and_expiry
    subject: [settle_offer_accepted, settle_offer_expired, settle_amount_scheduled]
    rule: >-
      Only the consumer can accept a settlement, and acceptance is the consumer's own act on the
      written offer. An offer is accepted only when the handling date is no later than the offer's
      last day counted from its offer_date. The offer's last day is the offer_date plus
      offer_validity_days calendar days, the day after offer_date being day one and the last day
      included; it is the offer_expiry_date. Acceptance on a recorded call is valid only where the
      programme's verbal_acceptance_allowed is true; elsewhere the consumer accepts by electronic
      signature or in the online portal. On acceptance the first payment due date is recomputed as
      the acceptance date plus the same number of days the offer allowed, never more than
      first_payment_max_days_after_acceptance, and later due dates follow at payment_interval_days.
      The settlement amount is booked to the settlement once, on the acceptance date, and only for
      a settlement whose status is accepted. An offer still offered after offer_expiry_date expires
      on the next day, and an expired offer can never be accepted; the consumer may receive a new
      offer under the reoffer rules.
    eligibility:
      - id: accept_before_expiry
        applies_to: [settle_offer_accepted]
        kind: time
        condition: An offer is accepted only when the handling date is no later than the offer's last day counted from its offer_date.
        evidence_fields: [settlement_agreements.offer_date, settlement_agreements.offer_expiry_date, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its offer_date
          anchor_source: settlement_agreements.offer_date
          relation: not_after
          duration_source: variants.offer_validity_days
          unit: calendar_days
          counting_rule: The offer's last day is the offer_date plus offer_validity_days calendar days, the day after offer_date being day one and the last day included; it is the offer_expiry_date.
          boundary: inclusive
      - id: schedule_on_accepted_settlement
        applies_to: [settle_amount_scheduled]
        kind: state
        condition: The settlement amount is booked to the settlement once, on the acceptance date, and only for a settlement whose status is accepted.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [accepted]
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Lump-Sum Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Two-Payment Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Three-Payment Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Six-Payment Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}
        Hardship Settlement: {validity_days: =offer_validity_days, verbal_ok: =verbal_acceptance_allowed}

  - id: settle_evt_payments
    subject: [settle_payment_received, settle_payment_returned, settle_due_date_extended]
    rule: >-
      The due date of settlement payment k is first_payment_due_date plus k minus 1 times
      payment_interval_days, plus extension_days_total for every payment not yet made when an
      extension was granted. Settlement payments are accepted only on a settlement whose status is
      accepted. A payment counts as made when the funds applied to it reach its scheduled amount
      less partial_payment_tolerance_usd. Payments are taken by ACH bank debit or mailed check at
      every programme, by card only where card_payments_allowed is true, by retail cash payment
      network only where cash_network_allowed is true and the account's stage accepts that channel,
      and only by automatic debit where autopay_required is true; the account's stage limits on
      single and rolling card amounts also apply. A payment of more than the amount due is applied
      to the next settlement payments in order. A returned settlement payment is booked once
      against the payment it reverses and the payment is again unmade; a replacement received
      within returned_payment_replacement_days calendar days after the return keeps the settlement
      in good standing, unless settle_msr_returned_payments exceeds returned_payment_limit. A
      due-date extension is granted only on an accepted settlement that is not yet in default,
      only while due_date_extension_count is below due_date_extension_max_count, and for no more
      than due_date_extension_max_days calendar days; it adds the days to extension_days_total and
      to final_payment_due_date and never reduces the settlement amount.
    eligibility:
      - id: payments_on_accepted_settlement
        applies_to: [settle_payment_received, settle_due_date_extended]
        kind: state
        condition: Settlement payments are accepted only on a settlement whose status is accepted.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [accepted]
      - id: one_return_per_settlement_payment
        applies_to: [settle_payment_returned]
        kind: dedup
        condition: A returned settlement payment is booked once against the payment it reverses and the payment is again unmade; a replacement received within returned_payment_replacement_days calendar days after the return keeps the settlement in good standing, unless settle_msr_returned_payments exceeds returned_payment_limit.
        evidence_fields: [settlement_payments.source_settle_txn_id, settlement_payments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_payments.source_settle_txn_id]
          action_bindings:
            settlement_payments.source_settle_txn_id: source_settle_txn_id
        dedup_contract:
          table: settlement_payments
          mode: separate_record
          object_bindings: {source_settle_txn_id: source_settle_txn_id}
          duplicate_filters: {event_type: [settle_payment_returned]}
          distinct_fields: []
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Lump-Sum Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Two-Payment Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Three-Payment Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Six-Payment Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
        Hardship Settlement: {grace: =grace_days_per_payment, extensions: =due_date_extension_max_count, extension_days: =due_date_extension_max_days, card_ok: =card_payments_allowed, return_limit: =returned_payment_limit}
    measures: [settle_msr_returned_payments]

  - id: settle_evt_default_and_release
    subject: [settle_defaulted, settle_balance_released]
    rule: >-
      An accepted settlement defaults when a settlement payment is still unmade after its grace
      period, or when settle_msr_returned_payments exceeds the programme's returned_payment_limit.
      A settlement defaults for an unmade payment only when the handling date is later than the
      grace period counted from that payment's due date. The grace period is the programme's
      grace_days_per_payment calendar days, the day after the due date being day one, with the due
      date already moved by any extension. On default the discount is lost: the remaining
      settlement_balance is released, payments already made stay applied to the account, the full
      remaining balance_due is owed again, and the account returns from arranged to active. A
      remainder is released only for a settlement whose status is defaulted or withdrawn, once, for
      the whole settlement_balance remaining. A default notice is sent and a new offer on the
      account waits for the reoffer cooling-off period.
    eligibility:
      - id: payment_grace_lapsed
        applies_to: [settle_defaulted]
        kind: time
        condition: A settlement defaults for an unmade payment only when the handling date is later than the grace period counted from that payment's due date.
        evidence_fields: [settlement_agreements.first_payment_due_date, settlement_agreements.payment_interval_days, settlement_agreements.extension_days_total, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: that payment's due date
          anchor_source: settlement_agreements.first_payment_due_date
          relation: not_before
          duration_source: variants.grace_days_per_payment
          unit: calendar_days
          counting_rule: The grace period is the programme's grace_days_per_payment calendar days, the day after the due date being day one, with the due date already moved by any extension.
          boundary: exclusive
      - id: release_on_closed_settlement
        applies_to: [settle_balance_released]
        kind: state
        condition: A remainder is released only for a settlement whose status is defaulted or withdrawn, once, for the whole settlement_balance remaining.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [defaulted, withdrawn]
    formula:
      released_amount_usd: settlement_balance

  - id: settle_evt_fulfillment
    subject: [settle_fulfilled]
    rule: >-
      An accepted settlement is fulfilled when settle_msr_paid_total reaches the settlement amount
      less the programme's partial_payment_tolerance_usd and the final payment has cleared. A
      settlement is fulfilled only when the handling date is later than the fulfillment hold counted
      from the date the final settlement payment was received. The fulfillment hold is the
      programme's fulfillment_hold_business_days business days after that date, Monday through
      Friday excluding US federal legal public holidays. On fulfillment the waived_amount is the
      account's balance_due on the fulfillment date, the waiver is booked to the account, the
      account closes as settled_in_full, and the settled-in-full letter follows under the account's
      letter rule. A fulfilled settlement is never reopened; a payment returned after fulfillment is
      referred to the client.
    eligibility:
      - id: final_payment_held
        applies_to: [settle_fulfilled]
        kind: time
        condition: A settlement is fulfilled only when the handling date is later than the fulfillment hold counted from the date the final settlement payment was received.
        evidence_fields: [settlement_payments.txn_date, settlement_payments.payment_number, settlement_payments.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_payments.settlement_id]
          action_bindings:
            settlement_payments.settlement_id: settlement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the final settlement payment was received
          anchor_source: settlement_payments.txn_date
          relation: not_before
          duration_source: variants.fulfillment_hold_business_days
          unit: business_days
          counting_rule: The fulfillment hold is the programme's fulfillment_hold_business_days business days after that date, Monday through Friday excluding US federal legal public holidays.
          boundary: exclusive
    formula:
      is_paid: settle_msr_paid_total >= settlement_amount - partial_payment_tolerance_usd
    measures: [settle_msr_paid_total]

  - id: settle_evt_withdrawal
    subject: [settle_offer_withdrawn, settle_balance_released]
    rule: >-
      Ridgeline withdraws an offered or accepted settlement only for a reason shown on the
      account's own records — account_disputed when the account entered dispute_hold,
      account_returned when the account was returned to the client, bankruptcy_notice or
      consumer_deceased when the matching protected-status notice is recorded, and
      superseded_by_new_offer for an offer that is still only offered when the consumer asks for
      different terms. A consumer who simply changes their mind about an accepted settlement does
      not withdraw it; the settlement stays accepted until it is fulfilled or defaults. Withdrawing
      an accepted settlement releases its remaining settlement_balance and returns an arranged
      account to active unless the account is being returned; payments already made stay applied
      to the account. When the dispute that caused an account_disputed withdrawal is later
      verified, the consumer may receive a new offer without waiting for the reoffer cooling-off
      period.
    eligibility:
      - id: withdrawal_reason_on_record
        applies_to: [settle_offer_withdrawn]
        kind: authorization
        condition: Ridgeline withdraws an offered or accepted settlement only for a reason shown on the account's own records — account_disputed when the account entered dispute_hold, account_returned when the account was returned to the client, bankruptcy_notice or consumer_deceased when the matching protected-status notice is recorded, and superseded_by_new_offer for an offer that is still only offered when the consumer asks for different terms.
        evidence_fields: [placed_accounts.status, account_case_events.notice_type, settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id

  - id: settle_evt_letters
    subject: [settle_letter_issued]
    rule: >-
      Every settlement is in writing. The offer letter is sent within offer_letter_sla_business_days
      business days after the offer date, the acceptance confirmation within
      acceptance_letter_sla_business_days business days after acceptance and, where
      settlement_letter_before_first_payment is true, before the first settlement payment is
      taken, and the default notice within default_notice_sla_business_days business days after a
      default. Settlement letters are sent only for a settlement whose status is offered, accepted
      or defaulted. Each letter type is sent once per settlement. The offer letter goes by email
      only where offer_letter_email_allowed is true and the consumer's profile carries an email
      address; every other letter goes by the channel the offer letter used. Every letter on an
      account whose sol_expiry_date is before the letter date carries disclosure_variant
      time_barred_terms where time_barred_disclosure_required is true, stating that the debt is too
      old to be sued on; all others carry standard_terms. The acceptance confirmation carries the
      cancelled-debt tax notice when balance_at_offer less the settlement amount is at or above
      tax_notice_waiver_threshold_usd; no other letter carries it.
    eligibility:
      - id: letter_settlement_status
        applies_to: [settle_letter_issued]
        kind: state
        condition: Settlement letters are sent only for a settlement whose status is offered, accepted or defaulted.
        evidence_fields: [settlement_agreements.status, settlement_agreements.settlement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_agreements.settlement_id]
          action_bindings:
            settlement_agreements.settlement_id: settlement_id
        state_contract:
          field: settlement_agreements.status
          allowed: [offered, accepted, defaulted]
      - id: one_letter_per_type
        applies_to: [settle_letter_issued]
        kind: dedup
        condition: Each letter type is sent once per settlement.
        evidence_fields: [settlement_payments.settlement_id, settlement_payments.letter_type, settlement_payments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [settlement_payments.settlement_id, settlement_payments.letter_type]
          action_bindings:
            settlement_payments.settlement_id: settlement_id
            settlement_payments.letter_type: letter_type
        dedup_contract:
          table: settlement_payments
          mode: separate_record
          object_bindings: {settlement_id: settlement_id, letter_type: letter_type}
          duplicate_filters: {event_type: [settle_letter_issued]}
          distinct_fields: []
    params:
      per_tier:
        Prompt-Pay Discount Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Lump-Sum Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Two-Payment Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Three-Payment Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Six-Payment Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}
        Hardship Settlement: {offer_sla: =offer_letter_sla_business_days, email_ok: =offer_letter_email_allowed, tax_threshold: =tax_notice_waiver_threshold_usd}

extended_policies:
  - id: settle_ext_two_payment_bundle_offer
    base_policy_refs: [settle_agg_multi_holding, settle_agg_same_client_bundle, settle_offer_authority, settle_evt_client_approval, settle_combo_plan_and_hardship]
    overwrite:
      - base_policy: settle_evt_client_approval
        superseded_clause: >-
          An offer that needs client approval is extended only on an approval request for the same account and programme whose request_status is approved, at a settlement_pct no lower than the approved_pct, and the offer carries that request in approval_request_id.
        replaced_by: >-
          A Two-Payment offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 25,000.00 dollars and the balance due less the settlement amount is no more than 10,000.00 dollars, and it carries no approval request.
      - base_policy: settle_evt_client_approval
        superseded_clause: >-
          An approved offer is extended only when the handling date is no later than the last day of the approval validity counted from the approval's decision_date.
        replaced_by: >-
          A Two-Payment offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 25,000.00 dollars and the balance due less the settlement amount is no more than 10,000.00 dollars, and it carries no approval request.
      - base_policy: settle_combo_plan_and_hardship
        superseded_clause: >-
          A Hardship Settlement is offered only when the account's most recent hardship hold is in status active, or has status ended with an ended_date no more than that hold tier's post_hold_hardship_window_days calendar days before the offer date, and in every case that hold tier's hardship_settlement_eligible_after_hold is true.
        replaced_by: >-
          A Two-Payment offer is never a Hardship Settlement, so no hardship hold is needed to extend it.
      - base_policy: settle_offer_authority
        superseded_clause: >-
          The programme's floor for the account is read from its authority floor for the account's stage (authority_floor_pct_early_out through authority_floor_pct_legal_review), lowered by the percentage points listed for the placing agreement's tier in client_tier_floor_reduction_pct and by any bundle reduction, but never below the programme's approval floor for the same stage
        replaced_by: >-
          The Two-Payment offer percentage is worked out in this order: first the Two-Payment authority floor for the stage is taken, then the same-client bundle reduction and every Two-Payment reduction that applies are added together and subtracted from it once, and only then is that figure compared with the Two-Payment approval floor for the stage, the higher of the two being the Two-Payment offer percentage.
      - base_policy: settle_offer_authority
        superseded_clause: >-
          Ridgeline may offer any settlement_pct at or above that floor on its own authority; a lower percentage, down to the approval floor and no further, needs a client approval on record.
        replaced_by: >-
          Ridgeline extends the Two-Payment offer on its own authority at exactly the Two-Payment offer percentage, never at another percentage.
      - base_policy: settle_agg_same_client_bundle
        superseded_clause: >-
          When the consumer settles together every one of their open placed accounts placed under the same client agreement, the accounts number at least the programme's bundle_min_accounts, and every offer in the bundle uses a programme whose bundle_floor_reduction_pct is above 0.0, each offer's floor is lowered by that programme's bundle_floor_reduction_pct and the offers carry bundle_applied true.
        replaced_by: >-
          Where the consumer holds at least two accounts placed under the account's client agreement and every one of them is open in validation period, active, arranged or hardship hold status, the Two-Payment offer is part of a same-client bundle: it carries the bundle flag set to true and the Two-Payment authority floor is lowered by the Two-Payment bundle reduction of 2.0 percentage points; where any account placed under that agreement is in dispute hold, still only placed, or closed as paid in full, settled in full or returned to the client, or fewer than two accounts are placed under it, the bundle flag is false and nothing is lowered.
      - base_policy: settle_agg_same_client_bundle
        superseded_clause: >-
          Accounts under different client agreements never form a bundle, even when the original creditor is the same, and an account in dispute_hold, or one that cannot take a settlement for any other reason, stops the bundle for every account under that agreement because the bundle must cover all of them.
        replaced_by: >-
          Where the consumer holds at least two accounts placed under the account's client agreement and every one of them is open in validation period, active, arranged or hardship hold status, the Two-Payment offer is part of a same-client bundle: it carries the bundle flag set to true and the Two-Payment authority floor is lowered by the Two-Payment bundle reduction of 2.0 percentage points; where any account placed under that agreement is in dispute hold, still only placed, or closed as paid in full, settled in full or returned to the client, or fewer than two accounts are placed under it, the bundle flag is false and nothing is lowered.
      - base_policy: settle_agg_same_client_bundle
        superseded_clause: >-
          All offers of a bundle are extended on the same offer_date and use the same programme.
        replaced_by: >-
          A Two-Payment offer may stand in one bundle with Three-Payment offers on the consumer's other accounts under the same client agreement, every offer of the bundle being dated the same offer date.
    trigger: on_request
    subject: [settle_offer_issued]
    computes: settlement_amount
    target_tool: issue_two_payment_settlement_offer_a21e4b5c
    params:
      auth_floor_early_out: 100.0
      auth_floor_primary: 75.0
      auth_floor_secondary: 60.0
      auth_floor_tertiary: 50.0
      auth_floor_warehouse: 40.0
      auth_floor_legal_review: 80.0
      appr_floor_early_out: 100.0
      appr_floor_primary: 55.0
      appr_floor_secondary: 45.0
      appr_floor_tertiary: 35.0
      appr_floor_warehouse: 25.0
      appr_floor_legal_review: 65.0
      bundle_red: 2.0
      bundle_min_accounts: 2
      age_long_days: 1095
      age_mid_days: 730
      age_red_long: 4.0
      age_red_mid: 2.0
      sol_near_days: 180
      sol_red_expired: 5.0
      sol_red_near: 2.0
      dorm_red_multi: 3.0
      dorm_red_single: 1.5
      credit_red_charity: 2.0
      credit_red_insurance: 1.0
      band_high_usd: 1500.0
      band_mid_usd: 400.0
      band_red_high: 1.5
      band_red_mid: 0.5
    rule: >-
      This rule prices a Two-Payment Settlement offer that Ridgeline extends on its own authority on a placed
      account whose placing agreement is a Starter Contingency Agreement or a Standard Contingency Agreement, the
      two agreement tiers whose client-tier floor reduction is 0.0; an offer on an account placed under any other
      agreement tier is outside this rule and stays under the base floor rule.
      Ridgeline extends the Two-Payment offer on its own authority at exactly the Two-Payment offer percentage, never at another percentage.
      A Two-Payment offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 25,000.00 dollars and the balance due less the settlement amount is no more than 10,000.00 dollars, and it carries no approval request.
      A Two-Payment offer is never a Hardship Settlement, so no hardship hold is needed to extend it.
      The Two-Payment authority floor for the account's current placement stage is 100.0 for Early-Out Placement,
      75.0 for Primary Placement, 60.0 for Secondary Placement, 50.0 for Tertiary Placement, 40.0 for Warehouse
      Placement and 80.0 for Legal Review Placement, and the Two-Payment approval floor for the same stages is
      100.0, 55.0, 45.0, 35.0, 25.0 and 65.0 in that order.
      Where the consumer holds at least two accounts placed under the account's client agreement and every one of them is open in validation period, active, arranged or hardship hold status, the Two-Payment offer is part of a same-client bundle: it carries the bundle flag set to true and the Two-Payment authority floor is lowered by the Two-Payment bundle reduction of 2.0 percentage points; where any account placed under that agreement is in dispute hold, still only placed, or closed as paid in full, settled in full or returned to the client, or fewer than two accounts are placed under it, the bundle flag is false and nothing is lowered.
      The Two-Payment offer percentage is the Two-Payment authority floor less any same-client bundle reduction,
      never set below the Two-Payment approval floor for the stage.
      The Two-Payment settlement amount is the account's balance due on the offer date times the Two-Payment offer
      percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 100.00 dollars is never offered under this rule.
      A Two-Payment offer may stand in one bundle with Three-Payment offers on the consumer's other accounts under the same client agreement, every offer of the bundle being dated the same offer date.
      The Two-Payment debt age is counted in calendar days from its anchor date up to the offer date; the anchor
      date is the account's charge-off date where the client reported one, the account's first delinquency date
      where no charge-off date is reported but a first delinquency date is, and the placement date where the
      client reported neither.
      Where the Two-Payment debt age is 1095 days or more, the Two-Payment long-age reduction of 4.0 percentage
      points applies; where it is at least 730 days but under 1095 days, the Two-Payment mid-age reduction of 2.0
      points applies; a Two-Payment debt age under 730 days carries no age reduction.
      Where the account's statute-of-limitations expiry date is before the offer date, the Two-Payment time-barred
      reduction of 5.0 points applies; where that expiry date is on the offer date or within the 180 calendar days
      after it, the Two-Payment near-expiry reduction of 2.0 points applies; a later expiry date carries no
      statute reduction.
      Where two or more collection agencies worked the account before this placement and no consumer payment was
      posted to it with a date after the same calendar day twelve months before the offer date, the Two-Payment
      dormancy reduction of 3.0 points applies; where exactly one agency worked it before this placement and no
      consumer payment was posted in that same twelve-month span, the Two-Payment single-agency dormancy reduction
      of 1.5 points applies; in every other case the account carries no dormancy reduction for a Two-Payment offer.
      Where the client has booked a charity-care write-off credit to the account, the Two-Payment assistance
      reduction of 2.0 points applies; where the client has booked an insurance payment credit to the account and
      no charity-care write-off, the Two-Payment adjudicated-balance reduction of 1.0 point applies; an account with
      neither credit carries no credit reduction for a Two-Payment offer.
      Where the account's balance due on the offer date is 1,500.00 dollars or more, the Two-Payment large-balance
      reduction of 1.5 points applies; where it is at least 400.00 dollars but under 1,500.00 dollars, the
      Two-Payment mid-balance reduction of 0.5 points applies; a balance due under 400.00 dollars carries no balance
      reduction for a Two-Payment offer.
      The Two-Payment offer percentage is worked out in this order: first the Two-Payment authority floor for the stage is taken, then the same-client bundle reduction and every Two-Payment reduction that applies are added together and subtracted from it once, and only then is that figure compared with the Two-Payment approval floor for the stage, the higher of the two being the Two-Payment offer percentage.
      The Two-Payment offer percentage is carried to one decimal place and the settlement amount is computed from it.
    prerequisite: []
    cross_category:
      - category: account
        as: history
        reads: [status, balance_due, variant_name, agreement_id, charge_off_date, first_delinquency_date, placement_date, sol_expiry_date, prior_agency_placements, account_transactions.event_type, account_transactions.adjustment_reason, account_transactions.txn_date]
        note: The placed account's stage, balance, dates and agency history and its money ledger decide the age, statute, dormancy, credit and balance tiers and the same-client bundle count.
    compute:
      - two_stage: "CFIELD('account','variant_name', account_id=HID)"
      - two_auth_floor: "K('auth_floor_early_out') if two_stage == 'Early-Out Placement' else (K('auth_floor_primary') if two_stage == 'Primary Placement' else (K('auth_floor_secondary') if two_stage == 'Secondary Placement' else (K('auth_floor_tertiary') if two_stage == 'Tertiary Placement' else (K('auth_floor_warehouse') if two_stage == 'Warehouse Placement' else K('auth_floor_legal_review')))))"
      - two_appr_floor: "K('appr_floor_early_out') if two_stage == 'Early-Out Placement' else (K('appr_floor_primary') if two_stage == 'Primary Placement' else (K('appr_floor_secondary') if two_stage == 'Secondary Placement' else (K('appr_floor_tertiary') if two_stage == 'Tertiary Placement' else (K('appr_floor_warehouse') if two_stage == 'Warehouse Placement' else K('appr_floor_legal_review')))))"
      - two_agreement: "CFIELD('account','agreement_id', account_id=HID)"
      - two_bundle_accounts: "XCOUNT('account','account_transactions', event_type='account_balance_placed', agreement_id=two_agreement)"
      - two_bundle_blocked: "EXISTS('account', agreement_id=two_agreement, status='dispute_hold') or EXISTS('account', agreement_id=two_agreement, status='placed') or EXISTS('account', agreement_id=two_agreement, status='paid_in_full') or EXISTS('account', agreement_id=two_agreement, status='settled_in_full') or EXISTS('account', agreement_id=two_agreement, status='returned_to_client')"
      - two_bundle_reduction: "K('bundle_red') if (two_bundle_accounts >= K('bundle_min_accounts') and not two_bundle_blocked) else 0.0"
      - two_charge_off: "CFIELD('account','charge_off_date', account_id=HID)"
      - two_first_delinquency: "CFIELD('account','first_delinquency_date', account_id=HID)"
      - two_age_anchor: "two_charge_off if two_charge_off else (two_first_delinquency if two_first_delinquency else CFIELD('account','placement_date', account_id=HID))"
      - two_debt_age_days: "DAYS(two_age_anchor, NOW)"
      - two_age_reduction: "K('age_red_long') if two_debt_age_days >= K('age_long_days') else (K('age_red_mid') if two_debt_age_days >= K('age_mid_days') else 0.0)"
      - two_sol_days: "DAYS(NOW, CFIELD('account','sol_expiry_date', account_id=HID))"
      - two_sol_reduction: "K('sol_red_expired') if two_sol_days < 0 else (K('sol_red_near') if two_sol_days <= K('sol_near_days') else 0.0)"
      - two_prior_agencies: "CFIELD('account','prior_agency_placements', account_id=HID)"
      - two_payments_12m: "XCOUNT('account','account_transactions', within_months=12, date_field='txn_date', event_type='account_payment_posted', account_id=HID)"
      - two_dormancy_reduction: "K('dorm_red_multi') if (two_prior_agencies >= 2 and two_payments_12m == 0) else (K('dorm_red_single') if (two_prior_agencies == 1 and two_payments_12m == 0) else 0.0)"
      - two_charity_credits: "XCOUNT('account','account_transactions', event_type='account_client_adjustment', adjustment_reason='charity_care_writeoff', account_id=HID)"
      - two_insurance_credits: "XCOUNT('account','account_transactions', event_type='account_client_adjustment', adjustment_reason='insurance_payment', account_id=HID)"
      - two_credit_reduction: "K('credit_red_charity') if two_charity_credits >= 1 else (K('credit_red_insurance') if two_insurance_credits >= 1 else 0.0)"
      - two_band_reduction: "K('band_red_high') if CFIELD('account','balance_due', account_id=HID) >= K('band_high_usd') else (K('band_red_mid') if CFIELD('account','balance_due', account_id=HID) >= K('band_mid_usd') else 0.0)"
      - two_pct: "RND(MX(two_auth_floor - (two_bundle_reduction + two_age_reduction + two_sol_reduction + two_dormancy_reduction + two_credit_reduction + two_band_reduction), two_appr_floor), 1)"
      - two_balance: "CFIELD('account','balance_due', account_id=HID)"
      - result: "-((-(two_balance * two_pct / 100)) // 1)"
    compute_basis:
      two_stage: "The Two-Payment authority floor for the account's current placement stage is 100.0 for Early-Out Placement, 75.0 for Primary Placement, 60.0 for Secondary Placement, 50.0 for Tertiary Placement, 40.0 for Warehouse Placement and 80.0 for Legal Review Placement"
      two_auth_floor: "The Two-Payment authority floor for the account's current placement stage is 100.0 for Early-Out Placement, 75.0 for Primary Placement, 60.0 for Secondary Placement, 50.0 for Tertiary Placement, 40.0 for Warehouse Placement and 80.0 for Legal Review Placement"
      two_appr_floor: "the Two-Payment approval floor for the same stages is 100.0, 55.0, 45.0, 35.0, 25.0 and 65.0 in that order."
      two_agreement: "Where the consumer holds at least two accounts placed under the account's client agreement"
      two_bundle_accounts: "Where the consumer holds at least two accounts placed under the account's client agreement"
      two_bundle_blocked: "where any account placed under that agreement is in dispute hold, still only placed, or closed as paid in full, settled in full or returned to the client"
      two_bundle_reduction: "Where the consumer holds at least two accounts placed under the account's client agreement and every one of them is open in validation period, active, arranged or hardship hold status, the Two-Payment offer is part of a same-client bundle: it carries the bundle flag set to true and the Two-Payment authority floor is lowered by the Two-Payment bundle reduction of 2.0 percentage points; where any account placed under that agreement is in dispute hold, still only placed, or closed as paid in full, settled in full or returned to the client, or fewer than two accounts are placed under it, the bundle flag is false and nothing is lowered."
      two_charge_off: "the anchor date is the account's charge-off date where the client reported one"
      two_first_delinquency: "the account's first delinquency date where no charge-off date is reported but a first delinquency date is"
      two_age_anchor: "the anchor date is the account's charge-off date where the client reported one, the account's first delinquency date where no charge-off date is reported but a first delinquency date is, and the placement date where the client reported neither."
      two_debt_age_days: "The Two-Payment debt age is counted in calendar days from its anchor date up to the offer date"
      two_age_reduction: "Where the Two-Payment debt age is 1095 days or more, the Two-Payment long-age reduction of 4.0 percentage points applies; where it is at least 730 days but under 1095 days, the Two-Payment mid-age reduction of 2.0 points applies; a Two-Payment debt age under 730 days carries no age reduction."
      two_sol_days: "Where the account's statute-of-limitations expiry date is before the offer date"
      two_sol_reduction: "Where the account's statute-of-limitations expiry date is before the offer date, the Two-Payment time-barred reduction of 5.0 points applies; where that expiry date is on the offer date or within the 180 calendar days after it, the Two-Payment near-expiry reduction of 2.0 points applies; a later expiry date carries no statute reduction."
      two_prior_agencies: "Where two or more collection agencies worked the account before this placement"
      two_payments_12m: "no consumer payment was posted to it with a date after the same calendar day twelve months before the offer date"
      two_dormancy_reduction: "Where two or more collection agencies worked the account before this placement and no consumer payment was posted to it with a date after the same calendar day twelve months before the offer date, the Two-Payment dormancy reduction of 3.0 points applies; where exactly one agency worked it before this placement and no consumer payment was posted in that same twelve-month span, the Two-Payment single-agency dormancy reduction of 1.5 points applies; in every other case the account carries no dormancy reduction for a Two-Payment offer."
      two_charity_credits: "Where the client has booked a charity-care write-off credit to the account"
      two_insurance_credits: "where the client has booked an insurance payment credit to the account and no charity-care write-off"
      two_credit_reduction: "Where the client has booked a charity-care write-off credit to the account, the Two-Payment assistance reduction of 2.0 points applies; where the client has booked an insurance payment credit to the account and no charity-care write-off, the Two-Payment adjudicated-balance reduction of 1.0 point applies; an account with neither credit carries no credit reduction for a Two-Payment offer."
      two_band_reduction: "Where the account's balance due on the offer date is 1,500.00 dollars or more, the Two-Payment large-balance reduction of 1.5 points applies; where it is at least 400.00 dollars but under 1,500.00 dollars, the Two-Payment mid-balance reduction of 0.5 points applies; a balance due under 400.00 dollars carries no balance reduction for a Two-Payment offer."
      two_pct: "The Two-Payment offer percentage is worked out in this order: first the Two-Payment authority floor for the stage is taken, then the same-client bundle reduction and every Two-Payment reduction that applies are added together and subtracted from it once, and only then is that figure compared with the Two-Payment approval floor for the stage, the higher of the two being the Two-Payment offer percentage."
      two_balance: "The Two-Payment settlement amount is the account's balance due on the offer date times the Two-Payment offer percentage divided by 100"
      result: "The Two-Payment settlement amount is the account's balance due on the offer date times the Two-Payment offer percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 100.00 dollars is never offered under this rule."
    factors:
      - id: two_age_anchor_date
        effect: method
        decides: two_age_anchor
        bindings: [two_charge_off, two_first_delinquency, two_age_anchor]
        ladder:
          - when: "the client reported a charge-off date for the account"
            method: "the Two-Payment debt age is counted from the charge-off date"
          - when: "no charge-off date is reported and the client reported a first delinquency date"
            method: "the Two-Payment debt age is counted from the first delinquency date"
          - when: "otherwise"
            method: "the Two-Payment debt age is counted from the placement date"
        baseline:
          two_age_anchor: "CFIELD('account','placement_date', account_id=HID)"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: two_debt_age
        effect: parameter
        decides: two_age_reduction
        bindings: [two_debt_age_days, two_age_reduction]
        ladder:
          - when: "the Two-Payment debt age is 1095 days or more"
            value: "K('age_red_long')"
          - when: "the Two-Payment debt age is at least 730 days but under 1095 days"
            value: "K('age_red_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          two_age_reduction: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: two_statute_status
        effect: parameter
        decides: two_sol_reduction
        bindings: [two_sol_days, two_sol_reduction]
        ladder:
          - when: "the account's statute-of-limitations expiry date is before the offer date"
            value: "K('sol_red_expired')"
          - when: "the expiry date is on the offer date or within the 180 calendar days after it"
            value: "K('sol_red_near')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          two_sol_reduction: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: two_dormancy
        effect: parameter
        decides: two_dormancy_reduction
        bindings: [two_prior_agencies, two_payments_12m, two_dormancy_reduction]
        ladder:
          - when: "two or more prior agencies worked the account AND no consumer payment posted in the twelve-month span"
            value: "K('dorm_red_multi')"
          - when: "exactly one prior agency worked the account AND no consumer payment posted in the twelve-month span"
            value: "K('dorm_red_single')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          two_dormancy_reduction: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: account
      - id: two_client_credit
        effect: parameter
        decides: two_credit_reduction
        bindings: [two_charity_credits, two_insurance_credits, two_credit_reduction]
        ladder:
          - when: "the client booked a charity-care write-off credit to the account"
            value: "K('credit_red_charity')"
          - when: "the client booked an insurance payment credit and no charity-care write-off"
            value: "K('credit_red_insurance')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          two_credit_reduction: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: account
      - id: two_balance_size
        effect: parameter
        decides: two_band_reduction
        bindings: [two_band_reduction]
        ladder:
          - when: "the balance due on the offer date is 1,500.00 dollars or more"
            value: "K('band_red_high')"
          - when: "the balance due is at least 400.00 dollars but under 1,500.00 dollars"
            value: "K('band_red_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          two_band_reduction: "0.0"
        evidence: [cross_category]
        cross_difficulty: account
    baseline:
      rule: >-
        The Two-Payment authority floor for the account's current placement stage is 100.0 for Early-Out Placement,
        75.0 for Primary Placement, 60.0 for Secondary Placement, 50.0 for Tertiary Placement, 40.0 for Warehouse
        Placement and 80.0 for Legal Review Placement, and the Two-Payment approval floor for the same stages is
        100.0, 55.0, 45.0, 35.0, 25.0 and 65.0 in that order.
        Where the consumer holds at least two accounts placed under the account's client agreement and every one of them is open in validation period, active, arranged or hardship hold status, the Two-Payment offer is part of a same-client bundle: it carries the bundle flag set to true and the Two-Payment authority floor is lowered by the Two-Payment bundle reduction of 2.0 percentage points; where any account placed under that agreement is in dispute hold, still only placed, or closed as paid in full, settled in full or returned to the client, or fewer than two accounts are placed under it, the bundle flag is false and nothing is lowered.
        The Two-Payment offer percentage is the Two-Payment authority floor less any same-client bundle reduction,
        never set below the Two-Payment approval floor for the stage.
        The Two-Payment settlement amount is the account's balance due on the offer date times the Two-Payment offer
        percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 100.00 dollars is never offered under this rule.
      params: [auth_floor_early_out, auth_floor_primary, auth_floor_secondary, auth_floor_tertiary, auth_floor_warehouse, auth_floor_legal_review, appr_floor_early_out, appr_floor_primary, appr_floor_secondary, appr_floor_tertiary, appr_floor_warehouse, appr_floor_legal_review, bundle_red, bundle_min_accounts]
    inputs:
      history:
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: account_payment_posted}}
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, filters: {event_type: account_client_adjustment}}
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, filters: {event_type: account_balance_placed}}
      cross_category: [account]

  - id: settle_ext_three_payment_offer
    base_policy_refs: [settle_agg_multi_holding, settle_agg_same_client_bundle, settle_offer_authority, settle_evt_client_approval, settle_combo_plan_and_hardship]
    overwrite:
      - base_policy: settle_evt_client_approval
        superseded_clause: >-
          An offer that needs client approval is extended only on an approval request for the same account and programme whose request_status is approved, at a settlement_pct no lower than the approved_pct, and the offer carries that request in approval_request_id.
        replaced_by: >-
          A Three-Payment offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 25,000.00 dollars and the balance due less the settlement amount is no more than 10,000.00 dollars, and it carries no approval request.
      - base_policy: settle_evt_client_approval
        superseded_clause: >-
          An approved offer is extended only when the handling date is no later than the last day of the approval validity counted from the approval's decision_date.
        replaced_by: >-
          A Three-Payment offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 25,000.00 dollars and the balance due less the settlement amount is no more than 10,000.00 dollars, and it carries no approval request.
      - base_policy: settle_combo_plan_and_hardship
        superseded_clause: >-
          A Hardship Settlement is offered only when the account's most recent hardship hold is in status active, or has status ended with an ended_date no more than that hold tier's post_hold_hardship_window_days calendar days before the offer date, and in every case that hold tier's hardship_settlement_eligible_after_hold is true.
        replaced_by: >-
          A Three-Payment offer is never a Hardship Settlement, so no hardship hold is needed to extend it.
      - base_policy: settle_offer_authority
        superseded_clause: >-
          The programme's floor for the account is read from its authority floor for the account's stage (authority_floor_pct_early_out through authority_floor_pct_legal_review), lowered by the percentage points listed for the placing agreement's tier in client_tier_floor_reduction_pct and by any bundle reduction, but never below the programme's approval floor for the same stage
        replaced_by: >-
          The Three-Payment offer percentage is worked out in this order: first the Three-Payment authority floor for the stage is taken, then the same-client bundle reduction and every Three-Payment reduction that applies are added together and subtracted from it once, then any Three-Payment raise is added, and only then is that figure compared with the Three-Payment approval floor for the stage, the higher of the two being the Three-Payment offer percentage.
      - base_policy: settle_offer_authority
        superseded_clause: >-
          Ridgeline may offer any settlement_pct at or above that floor on its own authority; a lower percentage, down to the approval floor and no further, needs a client approval on record.
        replaced_by: >-
          Ridgeline extends the Three-Payment offer on its own authority at exactly the Three-Payment offer percentage, never at another percentage.
      - base_policy: settle_agg_same_client_bundle
        superseded_clause: >-
          When the consumer settles together every one of their open placed accounts placed under the same client agreement, the accounts number at least the programme's bundle_min_accounts, and every offer in the bundle uses a programme whose bundle_floor_reduction_pct is above 0.0, each offer's floor is lowered by that programme's bundle_floor_reduction_pct and the offers carry bundle_applied true.
        replaced_by: >-
          Where the consumer holds other open accounts placed under the same client agreement, Ridgeline extends the Three-Payment offer only as part of a same-client bundle covering every one of them: an other account whose balance due is at least the Three-Payment entry gate of 500.00 dollars joins under a Three-Payment offer and one whose balance due is under that gate but at least the Two-Payment entry gate of 300.00 dollars joins under a Two-Payment offer.
      - base_policy: settle_agg_same_client_bundle
        superseded_clause: >-
          All offers of a bundle are extended on the same offer_date and use the same programme.
        replaced_by: >-
          Every offer of a same-client bundle is dated the same offer date, and a bundle may mix Three-Payment and Two-Payment offers.
    trigger: on_request
    subject: [settle_offer_issued]
    computes: settlement_amount
    target_tool: issue_three_payment_settlement_offer_bcdb6a79
    params:
      auth_floor_early_out: 100.0
      auth_floor_primary: 78.0
      auth_floor_secondary: 63.0
      auth_floor_tertiary: 53.0
      auth_floor_warehouse: 43.0
      auth_floor_legal_review: 83.0
      appr_floor_early_out: 100.0
      appr_floor_primary: 58.0
      appr_floor_secondary: 48.0
      appr_floor_tertiary: 38.0
      appr_floor_warehouse: 28.0
      appr_floor_legal_review: 68.0
      bundle_red: 2.0
      bundle_min_accounts: 2
      age_long_days: 1095
      age_mid_days: 730
      age_red_long: 5.0
      age_red_mid: 2.5
      sol_near_days: 180
      sol_red_expired: 6.0
      sol_red_near: 3.0
      dorm_red_multi: 4.0
      dorm_red_single: 2.0
      missed_many: 3
      plan_raise_many: 4.0
      plan_raise_some: 2.0
      band_high_usd: 2500.0
      band_mid_usd: 1000.0
      band_red_high: 2.0
      band_red_mid: 1.0
    rule: >-
      This rule prices a Three-Payment Settlement offer that Ridgeline extends on its own authority on a placed
      account whose placing agreement is a Starter Contingency Agreement or a Standard Contingency Agreement, the
      two agreement tiers whose client-tier floor reduction is 0.0; an offer on an account placed under any other
      agreement tier, or on an account whose same-client accounts include one with a balance due under 300.00
      dollars or one that cannot take a settlement, is outside this rule and stays under the base rules.
      Ridgeline extends the Three-Payment offer on its own authority at exactly the Three-Payment offer percentage, never at another percentage.
      A Three-Payment offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 25,000.00 dollars and the balance due less the settlement amount is no more than 10,000.00 dollars, and it carries no approval request.
      A Three-Payment offer is never a Hardship Settlement, so no hardship hold is needed to extend it.
      The Three-Payment authority floor for the account's current placement stage is 100.0 for Early-Out
      Placement, 78.0 for Primary Placement, 63.0 for Secondary Placement, 53.0 for Tertiary Placement, 43.0 for
      Warehouse Placement and 83.0 for Legal Review Placement, and the Three-Payment approval floor for the same
      stages is 100.0, 58.0, 48.0, 38.0, 28.0 and 68.0 in that order.
      Where the consumer holds at least two accounts placed under the account's client agreement, the Three-Payment
      offer carries the bundle flag set to true and the Three-Payment authority floor is lowered by the
      Three-Payment bundle reduction of 2.0 percentage points; otherwise the bundle flag is false and nothing is
      lowered.
      The Three-Payment offer percentage is the Three-Payment authority floor less any same-client bundle
      reduction, never set below the Three-Payment approval floor for the stage.
      The Three-Payment settlement amount is the account's balance due on the offer date times the Three-Payment
      offer percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 150.00 dollars is never offered under this rule.
      Where the consumer holds other open accounts placed under the same client agreement, Ridgeline extends the Three-Payment offer only as part of a same-client bundle covering every one of them: an other account whose balance due is at least the Three-Payment entry gate of 500.00 dollars joins under a Three-Payment offer and one whose balance due is under that gate but at least the Two-Payment entry gate of 300.00 dollars joins under a Two-Payment offer.
      Every offer of a same-client bundle is dated the same offer date, and a bundle may mix Three-Payment and Two-Payment offers.
      The Three-Payment offer percentage is fixed only after every other open account of the consumer under the
      same client agreement whose balance due is under 500.00 dollars carries an open Two-Payment offer dated the
      offer date.
      The Three-Payment debt age is counted in calendar days from its anchor date up to the offer date; the anchor
      date is the account's charge-off date where the client reported one, the account's first delinquency date
      where no charge-off date is reported but a first delinquency date is, and the placement date where the
      client reported neither.
      Where the Three-Payment debt age is 1095 days or more, the Three-Payment long-age reduction of 5.0 percentage
      points applies; where it is at least 730 days but under 1095 days, the Three-Payment mid-age reduction of 2.5
      points applies; a Three-Payment debt age under 730 days carries no age reduction.
      Where the account's statute-of-limitations expiry date is before the offer date, the Three-Payment
      time-barred reduction of 6.0 points applies; where that expiry date is on the offer date or within the 180
      calendar days after it, the Three-Payment near-expiry reduction of 3.0 points applies; a later expiry date
      carries no statute reduction for a Three-Payment offer.
      Where two or more collection agencies worked the account before this placement and no consumer payment was
      posted to it with a date after the same calendar day twelve months before the offer date, the Three-Payment
      dormancy reduction of 4.0 points applies; where exactly one agency worked it before this placement and no
      consumer payment was posted in that same twelve-month span, the Three-Payment single-agency dormancy
      reduction of 2.0 points applies; in every other case the account carries no dormancy reduction for a
      Three-Payment offer.
      Where the consumer's payment plans on the account record three or more missed installments, the Three-Payment
      broken-promise raise of 4.0 points applies; where they record one or two missed installments, the
      Three-Payment missed-installment raise of 2.0 points applies; an account whose plans record no missed
      installment carries no raise.
      Where the account's balance due on the offer date is 2,500.00 dollars or more, the Three-Payment
      large-balance reduction of 2.0 points applies; where it is at least 1,000.00 dollars but under 2,500.00
      dollars, the Three-Payment mid-balance reduction of 1.0 point applies; a balance due under 1,000.00 dollars
      carries no balance reduction for a Three-Payment offer.
      The Three-Payment offer percentage is worked out in this order: first the Three-Payment authority floor for the stage is taken, then the same-client bundle reduction and every Three-Payment reduction that applies are added together and subtracted from it once, then any Three-Payment raise is added, and only then is that figure compared with the Three-Payment approval floor for the stage, the higher of the two being the Three-Payment offer percentage.
      The Three-Payment offer percentage is carried to one decimal place and the settlement amount is computed from
      it.
    prerequisite:
      - problem: settle_ext_two_payment_bundle_offer
        kind: state_gate
        gate: settlement_agreements.status
        form: state
        policy_source: >-
          The Three-Payment offer percentage is fixed only after every other open account of the consumer under the same client agreement whose balance due is under 500.00 dollars carries an open Two-Payment offer dated the offer date.
        condition: >-
          Every other open placed account of the consumer under the same client agreement with a balance due under 500.00 dollars shows a settlement with variant Two-Payment Settlement, status offered and offer date equal to the handling date.
        resolved_by: issue_two_payment_settlement_offer_a21e4b5c
        effect: >-
          Once the Two-Payment offer is on record for each such same-client account, the same-client bundle is complete and the Three-Payment offer may be extended with the bundle flag true and the Three-Payment bundle reduction in its percentage.
    cross_category:
      - category: account
        as: history
        reads: [status, balance_due, variant_name, agreement_id, charge_off_date, first_delinquency_date, placement_date, sol_expiry_date, prior_agency_placements, account_transactions.event_type, account_transactions.txn_date]
        note: The placed account's stage, balance, dates and agency history and its payment ledger decide the age, statute, dormancy and balance tiers and the same-client bundle count.
      - category: plan
        as: history
        reads: [plan_installments.event_type]
        note: The missed installments recorded on the consumer's payment plans for the account decide the Three-Payment raise.
    compute:
      - three_stage: "CFIELD('account','variant_name', account_id=HID)"
      - three_auth_floor: "K('auth_floor_early_out') if three_stage == 'Early-Out Placement' else (K('auth_floor_primary') if three_stage == 'Primary Placement' else (K('auth_floor_secondary') if three_stage == 'Secondary Placement' else (K('auth_floor_tertiary') if three_stage == 'Tertiary Placement' else (K('auth_floor_warehouse') if three_stage == 'Warehouse Placement' else K('auth_floor_legal_review')))))"
      - three_appr_floor: "K('appr_floor_early_out') if three_stage == 'Early-Out Placement' else (K('appr_floor_primary') if three_stage == 'Primary Placement' else (K('appr_floor_secondary') if three_stage == 'Secondary Placement' else (K('appr_floor_tertiary') if three_stage == 'Tertiary Placement' else (K('appr_floor_warehouse') if three_stage == 'Warehouse Placement' else K('appr_floor_legal_review')))))"
      - three_agreement: "CFIELD('account','agreement_id', account_id=HID)"
      - three_bundle_accounts: "XCOUNT('account','account_transactions', event_type='account_balance_placed', agreement_id=three_agreement)"
      - three_accounts_not_held: "EXISTS('account', agreement_id=three_agreement, status='dispute_hold') or EXISTS('account', agreement_id=three_agreement, status='placed') or EXISTS('account', agreement_id=three_agreement, status='paid_in_full') or EXISTS('account', agreement_id=three_agreement, status='settled_in_full') or EXISTS('account', agreement_id=three_agreement, status='returned_to_client')"
      - three_bundle_reduction: "K('bundle_red') if (three_bundle_accounts >= K('bundle_min_accounts') and not three_accounts_not_held) else 0.0"
      - three_charge_off: "CFIELD('account','charge_off_date', account_id=HID)"
      - three_first_delinquency: "CFIELD('account','first_delinquency_date', account_id=HID)"
      - three_age_anchor: "three_charge_off if three_charge_off else (three_first_delinquency if three_first_delinquency else CFIELD('account','placement_date', account_id=HID))"
      - three_debt_age_days: "DAYS(three_age_anchor, NOW)"
      - three_age_reduction: "K('age_red_long') if three_debt_age_days >= K('age_long_days') else (K('age_red_mid') if three_debt_age_days >= K('age_mid_days') else 0.0)"
      - three_sol_days: "DAYS(NOW, CFIELD('account','sol_expiry_date', account_id=HID))"
      - three_sol_reduction: "K('sol_red_expired') if three_sol_days < 0 else (K('sol_red_near') if three_sol_days <= K('sol_near_days') else 0.0)"
      - three_prior_agencies: "CFIELD('account','prior_agency_placements', account_id=HID)"
      - three_payments_12m: "XCOUNT('account','account_transactions', within_months=12, date_field='txn_date', event_type='account_payment_posted', account_id=HID)"
      - three_dormancy_reduction: "K('dorm_red_multi') if (three_prior_agencies >= 2 and three_payments_12m == 0) else (K('dorm_red_single') if (three_prior_agencies == 1 and three_payments_12m == 0) else 0.0)"
      - three_missed_installments: "XCOUNT('plan','plan_installments', event_type='plan_installment_missed', account_id=HID)"
      - three_plan_raise: "K('plan_raise_many') if three_missed_installments >= K('missed_many') else (K('plan_raise_some') if three_missed_installments >= 1 else 0.0)"
      - three_band_reduction: "K('band_red_high') if CFIELD('account','balance_due', account_id=HID) >= K('band_high_usd') else (K('band_red_mid') if CFIELD('account','balance_due', account_id=HID) >= K('band_mid_usd') else 0.0)"
      - three_pct: "RND(MX(three_auth_floor - (three_bundle_reduction + three_age_reduction + three_sol_reduction + three_dormancy_reduction + three_band_reduction) + three_plan_raise, three_appr_floor), 1)"
      - three_balance: "CFIELD('account','balance_due', account_id=HID)"
      - result: "-((-(three_balance * three_pct / 100)) // 1)"
    compute_basis:
      three_stage: "The Three-Payment authority floor for the account's current placement stage is 100.0 for Early-Out Placement, 78.0 for Primary Placement, 63.0 for Secondary Placement, 53.0 for Tertiary Placement, 43.0 for Warehouse Placement and 83.0 for Legal Review Placement"
      three_auth_floor: "The Three-Payment authority floor for the account's current placement stage is 100.0 for Early-Out Placement, 78.0 for Primary Placement, 63.0 for Secondary Placement, 53.0 for Tertiary Placement, 43.0 for Warehouse Placement and 83.0 for Legal Review Placement"
      three_appr_floor: "the Three-Payment approval floor for the same stages is 100.0, 58.0, 48.0, 38.0, 28.0 and 68.0 in that order."
      three_agreement: "Where the consumer holds at least two accounts placed under the account's client agreement"
      three_bundle_accounts: "Where the consumer holds at least two accounts placed under the account's client agreement"
      three_accounts_not_held: "or on an account whose same-client accounts include one with a balance due under 300.00 dollars or one that cannot take a settlement, is outside this rule"
      three_bundle_reduction: "the Three-Payment offer carries the bundle flag set to true and the Three-Payment authority floor is lowered by the Three-Payment bundle reduction of 2.0 percentage points; otherwise the bundle flag is false and nothing is lowered."
      three_charge_off: "the anchor date is the account's charge-off date where the client reported one"
      three_first_delinquency: "the account's first delinquency date where no charge-off date is reported but a first delinquency date is"
      three_age_anchor: "the anchor date is the account's charge-off date where the client reported one, the account's first delinquency date where no charge-off date is reported but a first delinquency date is, and the placement date where the client reported neither."
      three_debt_age_days: "The Three-Payment debt age is counted in calendar days from its anchor date up to the offer date"
      three_age_reduction: "Where the Three-Payment debt age is 1095 days or more, the Three-Payment long-age reduction of 5.0 percentage points applies; where it is at least 730 days but under 1095 days, the Three-Payment mid-age reduction of 2.5 points applies; a Three-Payment debt age under 730 days carries no age reduction."
      three_sol_days: "Where the account's statute-of-limitations expiry date is before the offer date"
      three_sol_reduction: "Where the account's statute-of-limitations expiry date is before the offer date, the Three-Payment time-barred reduction of 6.0 points applies; where that expiry date is on the offer date or within the 180 calendar days after it, the Three-Payment near-expiry reduction of 3.0 points applies; a later expiry date carries no statute reduction for a Three-Payment offer."
      three_prior_agencies: "Where two or more collection agencies worked the account before this placement"
      three_payments_12m: "no consumer payment was posted to it with a date after the same calendar day twelve months before the offer date"
      three_dormancy_reduction: "Where two or more collection agencies worked the account before this placement and no consumer payment was posted to it with a date after the same calendar day twelve months before the offer date, the Three-Payment dormancy reduction of 4.0 points applies; where exactly one agency worked it before this placement and no consumer payment was posted in that same twelve-month span, the Three-Payment single-agency dormancy reduction of 2.0 points applies; in every other case the account carries no dormancy reduction for a Three-Payment offer."
      three_missed_installments: "Where the consumer's payment plans on the account record three or more missed installments"
      three_plan_raise: "Where the consumer's payment plans on the account record three or more missed installments, the Three-Payment broken-promise raise of 4.0 points applies; where they record one or two missed installments, the Three-Payment missed-installment raise of 2.0 points applies; an account whose plans record no missed installment carries no raise."
      three_band_reduction: "Where the account's balance due on the offer date is 2,500.00 dollars or more, the Three-Payment large-balance reduction of 2.0 points applies; where it is at least 1,000.00 dollars but under 2,500.00 dollars, the Three-Payment mid-balance reduction of 1.0 point applies; a balance due under 1,000.00 dollars carries no balance reduction for a Three-Payment offer."
      three_pct: "The Three-Payment offer percentage is worked out in this order: first the Three-Payment authority floor for the stage is taken, then the same-client bundle reduction and every Three-Payment reduction that applies are added together and subtracted from it once, then any Three-Payment raise is added, and only then is that figure compared with the Three-Payment approval floor for the stage, the higher of the two being the Three-Payment offer percentage."
      three_balance: "The Three-Payment settlement amount is the account's balance due on the offer date times the Three-Payment offer percentage divided by 100"
      result: "The Three-Payment settlement amount is the account's balance due on the offer date times the Three-Payment offer percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 150.00 dollars is never offered under this rule."
    factors:
      - id: three_age_anchor_date
        effect: method
        decides: three_age_anchor
        bindings: [three_charge_off, three_first_delinquency, three_age_anchor]
        ladder:
          - when: "the client reported a charge-off date for the account"
            method: "the Three-Payment debt age is counted from the charge-off date"
          - when: "no charge-off date is reported and the client reported a first delinquency date"
            method: "the Three-Payment debt age is counted from the first delinquency date"
          - when: "otherwise"
            method: "the Three-Payment debt age is counted from the placement date"
        baseline:
          three_age_anchor: "CFIELD('account','placement_date', account_id=HID)"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: three_debt_age
        effect: parameter
        decides: three_age_reduction
        bindings: [three_debt_age_days, three_age_reduction]
        ladder:
          - when: "the Three-Payment debt age is 1095 days or more"
            value: "K('age_red_long')"
          - when: "the Three-Payment debt age is at least 730 days but under 1095 days"
            value: "K('age_red_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          three_age_reduction: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: three_statute_status
        effect: parameter
        decides: three_sol_reduction
        bindings: [three_sol_days, three_sol_reduction]
        ladder:
          - when: "the account's statute-of-limitations expiry date is before the offer date"
            value: "K('sol_red_expired')"
          - when: "the expiry date is on the offer date or within the 180 calendar days after it"
            value: "K('sol_red_near')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          three_sol_reduction: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: three_dormancy
        effect: parameter
        decides: three_dormancy_reduction
        bindings: [three_prior_agencies, three_payments_12m, three_dormancy_reduction]
        ladder:
          - when: "two or more prior agencies worked the account AND no consumer payment posted in the twelve-month span"
            value: "K('dorm_red_multi')"
          - when: "exactly one prior agency worked the account AND no consumer payment posted in the twelve-month span"
            value: "K('dorm_red_single')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          three_dormancy_reduction: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: account
      - id: three_plan_performance
        effect: parameter
        decides: three_plan_raise
        bindings: [three_missed_installments, three_plan_raise]
        ladder:
          - when: "the consumer's payment plans on the account record three or more missed installments"
            value: "K('plan_raise_many')"
          - when: "they record one or two missed installments"
            value: "K('plan_raise_some')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          three_plan_raise: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: plan
      - id: three_balance_size
        effect: parameter
        decides: three_band_reduction
        bindings: [three_band_reduction]
        ladder:
          - when: "the balance due on the offer date is 2,500.00 dollars or more"
            value: "K('band_red_high')"
          - when: "the balance due is at least 1,000.00 dollars but under 2,500.00 dollars"
            value: "K('band_red_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          three_band_reduction: "0.0"
        evidence: [cross_category]
        cross_difficulty: account
    baseline:
      rule: >-
        The Three-Payment authority floor for the account's current placement stage is 100.0 for Early-Out
        Placement, 78.0 for Primary Placement, 63.0 for Secondary Placement, 53.0 for Tertiary Placement, 43.0 for
        Warehouse Placement and 83.0 for Legal Review Placement, and the Three-Payment approval floor for the same
        stages is 100.0, 58.0, 48.0, 38.0, 28.0 and 68.0 in that order.
        Where the consumer holds at least two accounts placed under the account's client agreement, the Three-Payment
        offer carries the bundle flag set to true and the Three-Payment authority floor is lowered by the
        Three-Payment bundle reduction of 2.0 percentage points; otherwise the bundle flag is false and nothing is
        lowered.
        The Three-Payment offer percentage is the Three-Payment authority floor less any same-client bundle
        reduction, never set below the Three-Payment approval floor for the stage.
        The Three-Payment settlement amount is the account's balance due on the offer date times the Three-Payment
        offer percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 150.00 dollars is never offered under this rule.
      params: [auth_floor_early_out, auth_floor_primary, auth_floor_secondary, auth_floor_tertiary, auth_floor_warehouse, auth_floor_legal_review, appr_floor_early_out, appr_floor_primary, appr_floor_secondary, appr_floor_tertiary, appr_floor_warehouse, appr_floor_legal_review, bundle_red, bundle_min_accounts]
    inputs:
      history:
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: account_payment_posted}}
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, filters: {event_type: account_balance_placed}}
        - {category: plan, table: plan_installments, aggregate: count, field: plan_txn_id, filters: {event_type: plan_installment_missed}}
      cross_category: [account, plan]

  - id: settle_ext_three_payment_call_acceptance
    base_policy_refs: [settle_combo_plan_and_hardship, settle_evt_acceptance_and_expiry]
    overwrite:
      - base_policy: settle_evt_acceptance_and_expiry
        superseded_clause: >-
          On acceptance the first payment due date is recomputed as the acceptance date plus the same number of days the offer allowed, never more than first_payment_max_days_after_acceptance, and later due dates follow at payment_interval_days.
        replaced_by: >-
          The Three-Payment call acceptance window is worked out in this order: first the offered Three-Payment window is taken and capped at 15 days, then the stage, opening-payment and lapsed-offer shortenings are added together and subtracted from it once, never leaving less than one day, and only then is the returned-payment day convention applied to that shortened window.
    trigger: on_request
    subject: [settle_offer_accepted, settle_amount_scheduled]
    computes: first_payment_due_in_days
    target_tool: accept_settlement_offer_on_recorded_call_60e9ef1d
    params:
      max_first_window_days: 15
      cut_late: 3
      cut_mid: 1
      opening_pct: 33.0
      small_opening_usd: 300.0
      mid_opening_usd: 600.0
      cut_small_opening: 2
      cut_mid_opening: 1
      cut_many_lapses: 3
      cut_one_lapse: 1
      min_window_days: 1
    rule: >-
      This rule fixes the Three-Payment call acceptance window, the number of calendar days from the acceptance
      date to the due date of the first settlement payment, when a consumer accepts a Three-Payment Settlement offer
      on a recorded call, which the Three-Payment Settlement allows; acceptance by electronic signature or in the
      portal, and acceptance of any other programme, is outside this rule.
      A recorded-call acceptance of a Three-Payment Settlement is not booked until the account carries an open Three-Payment offer dated within its validity.
      The offered Three-Payment window is the number of calendar days from the offer date of that open offer to the
      first payment due date written on it, never more than 15 days.
      The Three-Payment call acceptance window is the offered Three-Payment window, never less than one day.
      On acceptance the first settlement payment falls due that many calendar days after the acceptance date, each
      later payment falls due the offer's payment interval after the one before it, and the offer's settlement
      amount is booked to the settlement once, on the acceptance date.
      Where the account is at Legal Review Placement or Warehouse Placement, the Three-Payment call window is
      shortened by 3 days for its stage; where it is at Tertiary Placement or Secondary Placement, by 1 day; an
      account at Early-Out Placement or Primary Placement takes no stage shortening of the Three-Payment call window.
      The Three-Payment opening payment is the offer's settlement amount times 33.0 percent; where that opening
      payment is under 300.00 dollars the Three-Payment call window is shortened by 2 days; where it is at least
      300.00 dollars but under 600.00 dollars, by 1 day; an opening payment of 600.00 dollars or more takes no
      opening-payment shortening.
      Where two or more settlement offers on the account dated after the same calendar day twelve months before the
      acceptance date have expired unaccepted, the Three-Payment call window is shortened by 3 days for lapsed
      offers; where exactly one such offer has expired, by 1 day; an account with no such expired offer takes no
      lapsed-offer shortening.
      The Three-Payment returned-payment day convention decides on which day the first payment falls: where two or
      more consumer payments on the account were returned with a return date after the same calendar day twelve
      months before the acceptance date, the first payment is taken as guaranteed funds on the next business day
      after the acceptance date, Monday through Friday, and the shortened window is set aside; where exactly one
      consumer payment on the account was returned in that span, the shortened window is kept but a first payment
      that would fall due on a Saturday or a Sunday is moved back to the Friday before it, or forward to the Monday
      after it where that Friday would fall on or before the acceptance date; where none was returned
      in that span, the shortened window is used as it stands, whatever day of the week it ends on.
      The Three-Payment call acceptance window is worked out in this order: first the offered Three-Payment window is taken and capped at 15 days, then the stage, opening-payment and lapsed-offer shortenings are added together and subtracted from it once, never leaving less than one day, and only then is the returned-payment day convention applied to that shortened window.
    prerequisite:
      - problem: settle_ext_three_payment_offer
        kind: value_input
        gate: tp_offer_days
        form: state
        policy_source: >-
          A recorded-call acceptance of a Three-Payment Settlement is not booked until the account carries an open Three-Payment offer dated within its validity.
        condition: >-
          The account shows a settlement with variant Three-Payment Settlement and status offered whose offer expiry date is on or after the handling date.
        resolved_by: issue_three_payment_settlement_offer_bcdb6a79
        effect: >-
          The open Three-Payment offer supplies the offer date, the first payment due date written on it and the settlement amount, so the offered Three-Payment window and the opening payment take their values from that offer.
    cross_category:
      - category: account
        as: history
        reads: [variant_name, account_transactions.event_type, account_transactions.txn_date]
        note: Returned consumer payments in the account ledger decide the returned-payment day convention and the account stage decides the stage shortening.
    compute:
      - tp_offer_date: "LATEST('settlement_agreements','offer_date', date_field='offer_date', status='offered', variant_name='Three-Payment Settlement')"
      - tp_offer_first_due: "LATEST('settlement_agreements','first_payment_due_date', date_field='offer_date', status='offered', variant_name='Three-Payment Settlement')"
      - tp_offer_days: "DAYS(tp_offer_date, tp_offer_first_due)"
      - tp_base_window: "MN(tp_offer_days, K('max_first_window_days'))"
      - tp_stage: "CFIELD('account','variant_name', account_id=HID)"
      - tp_stage_cut: "K('cut_late') if (tp_stage == 'Legal Review Placement' or tp_stage == 'Warehouse Placement') else (K('cut_mid') if (tp_stage == 'Tertiary Placement' or tp_stage == 'Secondary Placement') else 0)"
      - tp_offer_amount: "LATEST('settlement_agreements','settlement_amount', date_field='offer_date', status='offered', variant_name='Three-Payment Settlement')"
      - tp_opening_payment: "tp_offer_amount * K('opening_pct') / 100"
      - tp_opening_cut: "K('cut_small_opening') if tp_opening_payment < K('small_opening_usd') else (K('cut_mid_opening') if tp_opening_payment < K('mid_opening_usd') else 0)"
      - tp_lapsed_offers: "COUNT('settlement_agreements', within_months=12, date_field='offer_date', status='expired')"
      - tp_lapse_cut: "K('cut_many_lapses') if tp_lapsed_offers >= 2 else (K('cut_one_lapse') if tp_lapsed_offers == 1 else 0)"
      - tp_shortened_window: "MX(K('min_window_days'), tp_base_window - (tp_stage_cut + tp_opening_cut + tp_lapse_cut))"
      - tp_returns_12m: "XCOUNT('account','account_transactions', within_months=12, date_field='txn_date', event_type='account_payment_returned', account_id=HID)"
      - tp_acceptance_weekday: "DAYS('2024-01-01', NOW) % 7"
      - tp_due_weekday: "(DAYS('2024-01-01', NOW) + tp_shortened_window) % 7"
      - tp_day_convention: "(3 if tp_acceptance_weekday == 4 else (2 if tp_acceptance_weekday == 5 else 1)) if tp_returns_12m >= 2 else (((tp_shortened_window - (tp_due_weekday - 4) if tp_shortened_window - (tp_due_weekday - 4) >= 1 else tp_shortened_window + (7 - tp_due_weekday)) if tp_due_weekday >= 5 else tp_shortened_window) if tp_returns_12m == 1 else tp_shortened_window)"
      - result: "tp_day_convention"
    compute_basis:
      tp_offer_date: "The offered Three-Payment window is the number of calendar days from the offer date of that open offer to the first payment due date written on it"
      tp_offer_first_due: "The offered Three-Payment window is the number of calendar days from the offer date of that open offer to the first payment due date written on it"
      tp_offer_days: "The offered Three-Payment window is the number of calendar days from the offer date of that open offer to the first payment due date written on it, never more than 15 days."
      tp_base_window: "first the offered Three-Payment window is taken and capped at 15 days"
      tp_stage: "Where the account is at Legal Review Placement or Warehouse Placement"
      tp_stage_cut: "Where the account is at Legal Review Placement or Warehouse Placement, the Three-Payment call window is shortened by 3 days for its stage; where it is at Tertiary Placement or Secondary Placement, by 1 day; an account at Early-Out Placement or Primary Placement takes no stage shortening of the Three-Payment call window."
      tp_offer_amount: "The Three-Payment opening payment is the offer's settlement amount times 33.0 percent"
      tp_opening_payment: "The Three-Payment opening payment is the offer's settlement amount times 33.0 percent"
      tp_opening_cut: "where that opening payment is under 300.00 dollars the Three-Payment call window is shortened by 2 days; where it is at least 300.00 dollars but under 600.00 dollars, by 1 day; an opening payment of 600.00 dollars or more takes no opening-payment shortening."
      tp_lapsed_offers: "settlement offers on the account dated after the same calendar day twelve months before the acceptance date have expired unaccepted"
      tp_lapse_cut: "Where two or more settlement offers on the account dated after the same calendar day twelve months before the acceptance date have expired unaccepted, the Three-Payment call window is shortened by 3 days for lapsed offers; where exactly one such offer has expired, by 1 day; an account with no such expired offer takes no lapsed-offer shortening."
      tp_shortened_window: "then the stage, opening-payment and lapsed-offer shortenings are added together and subtracted from it once, never leaving less than one day"
      tp_returns_12m: "consumer payments on the account were returned with a return date after the same calendar day twelve months before the acceptance date"
      tp_acceptance_weekday: "the first payment is taken as guaranteed funds on the next business day after the acceptance date, Monday through Friday"
      tp_due_weekday: "a first payment that would fall due on a Saturday or a Sunday is moved back to the Friday before it"
      tp_day_convention: "The Three-Payment returned-payment day convention decides on which day the first payment falls: where two or more consumer payments on the account were returned with a return date after the same calendar day twelve months before the acceptance date, the first payment is taken as guaranteed funds on the next business day after the acceptance date, Monday through Friday, and the shortened window is set aside; where exactly one consumer payment on the account was returned in that span, the shortened window is kept but a first payment that would fall due on a Saturday or a Sunday is moved back to the Friday before it, or forward to the Monday after it where that Friday would fall on or before the acceptance date; where none was returned in that span, the shortened window is used as it stands, whatever day of the week it ends on."
      result: "and only then is the returned-payment day convention applied to that shortened window."
    factors:
      - id: tp_returned_payment_day_convention
        effect: method
        decides: tp_day_convention
        bindings: [tp_returns_12m, tp_acceptance_weekday, tp_due_weekday, tp_day_convention]
        ladder:
          - when: "two or more consumer payments on the account returned in the twelve-month span"
            method: "the first payment falls on the next business day after acceptance; the shortened window is set aside"
          - when: "exactly one consumer payment on the account returned in the twelve-month span"
            method: "the shortened window is kept, a due date on a Saturday or Sunday is moved back to the Friday before it, or forward to the Monday after it where that Friday falls on or before the acceptance date"
          - when: "otherwise"
            method: "the shortened window is used as it stands, whatever weekday it ends on"
        baseline:
          tp_day_convention: "tp_shortened_window"
        evidence: [cross_category, history, date]
        cross_difficulty: account
      - id: tp_stage_shortening
        effect: parameter
        decides: tp_stage_cut
        bindings: [tp_stage, tp_stage_cut]
        ladder:
          - when: "the account is at Legal Review Placement or Warehouse Placement"
            value: "K('cut_late')"
          - when: "the account is at Tertiary Placement or Secondary Placement"
            value: "K('cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          tp_stage_cut: "0"
        evidence: [cross_category]
        cross_difficulty: account
      - id: tp_opening_payment_size
        effect: parameter
        decides: tp_opening_cut
        bindings: [tp_offer_amount, tp_opening_payment, tp_opening_cut]
        ladder:
          - when: "the Three-Payment opening payment is under 300.00 dollars"
            value: "K('cut_small_opening')"
          - when: "the opening payment is at least 300.00 dollars but under 600.00 dollars"
            value: "K('cut_mid_opening')"
          - when: "otherwise"
            value: "0"
        baseline:
          tp_opening_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tp_lapsed_offer_history
        effect: parameter
        decides: tp_lapse_cut
        bindings: [tp_lapsed_offers, tp_lapse_cut]
        ladder:
          - when: "two or more offers on the account dated in the twelve-month span expired unaccepted"
            value: "K('cut_many_lapses')"
          - when: "exactly one such offer expired unaccepted"
            value: "K('cut_one_lapse')"
          - when: "otherwise"
            value: "0"
        baseline:
          tp_lapse_cut: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The offered Three-Payment window is the number of calendar days from the offer date of that open offer to the
        first payment due date written on it, never more than 15 days.
        The Three-Payment call acceptance window is the offered Three-Payment window, never less than one day.
        On acceptance the first settlement payment falls due that many calendar days after the acceptance date, each
        later payment falls due the offer's payment interval after the one before it, and the offer's settlement
        amount is booked to the settlement once, on the acceptance date.
      params: [max_first_window_days, min_window_days]
    inputs:
      history:
        - {table: settlement_agreements, aggregate: count, field: settlement_id, within_months: 12, filters: {status: expired}}
        - {table: settlement_agreements, aggregate: latest, field: first_payment_due_date, filters: {status: offered}}
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: account_payment_returned}}
      cross_category: [account]

  - id: settle_ext_lump_sum_extension
    base_policy_refs: [settle_evt_payments]
    overwrite: []
    trigger: on_request
    subject: [settle_due_date_extended]
    computes: extension_days
    target_tool: extend_lump_sum_settlement_due_date_54e5e409
    params:
      standard_grant: 3
      allow_hold_approved: 2
      allow_hold_denied: 1
      months_span: 12
      balance_high_usd: 500.0
      balance_mid_usd: 150.0
      allow_balance_high: 2
      allow_balance_mid: 1
      record_many: 3
      allow_record_many: 2
      allow_record_some: 1
      allow_plan_clean: 2
      allow_plan_missed: 1
    rule: >-
      This rule fixes the Lump-Sum extension days, the calendar days that one due-date extension adds to the
      settlement payment of an accepted Lump-Sum Settlement that is not in default and has used fewer extensions
      than the programme allows; extensions on any other programme are outside this rule.
      The Lump-Sum extension days are a standard grant of 3 calendar days counted from the payment's current due
      date, never more than the programme's extension maximum of 10 calendar days.
      The extension adds those days to the settlement's extension days total and to its final payment due date, so
      that the payment's current due date becomes the first payment due date plus the extension days total.
      The Lump-Sum extension is counted from an anchor date: where a settlement payment on the settlement has been
      returned, the anchor is the date the return was received and the days from the payment's current due date to
      that return date, never fewer than zero, are added to the grant; where no settlement payment has been returned and the payment's
      current due date is already past on the handling date, the anchor is the handling date and the days the
      payment is past due are added to the grant; where neither holds, the anchor is the current due date and
      nothing is added.
      Where a hardship hold on the settled account was approved with a decision date after the same calendar day
      twelve months before the handling date, the Lump-Sum hardship allowance of 2 days is added to the grant;
      where a hardship hold request on that account was denied with a decision date in that same span, the
      Lump-Sum denied-request allowance of 1 day is added; an account with neither carries no Lump-Sum hardship
      allowance.
      The amount still to pay under the Lump-Sum Settlement is worked out from its ledger as the settlement amount
      booked on acceptance, less every settlement payment received, plus every settlement payment returned; where
      that amount still to pay is 500.00 dollars or more, the Lump-Sum balance allowance of 2 days is added; where
      it is at least 150.00 dollars but under 500.00 dollars, the Lump-Sum balance allowance is 1 day; an amount
      still to pay under 150.00 dollars carries no Lump-Sum balance allowance.
      Every consumer payment posted to the settled account counts toward the Lump-Sum track record, a payment that
      was later returned included; where three or more have been posted, the Lump-Sum track-record allowance of 2
      days is added; where one or two have been posted, the Lump-Sum track-record allowance is 1 day;
      an account with no posted consumer payment carries no Lump-Sum track-record allowance.
      Where a payment plan on the settled account was cancelled because the settlement superseded it and that plan
      recorded no missed installment, the Lump-Sum superseded-plan allowance of 2 days is added; where such a
      superseded plan recorded at least one missed installment, the Lump-Sum superseded-plan allowance is 1 day; an
      account with no plan superseded by the settlement carries no Lump-Sum superseded-plan allowance.
      The Lump-Sum extension days are worked out in this order: first the standard grant is taken, then the
      hardship, balance, track-record and superseded-plan allowances are added to it, then the days the anchor adds
      are added, and only then is the total capped at the programme's extension maximum of 10 calendar days; the
      extension days are a whole number of calendar days.
    prerequisite: []
    cross_category:
      - category: hardship
        as: branch
        reads: [status, decision_date]
        note: The status and decision date of the hardship hold on the settled account decide the Lump-Sum hardship allowance.
      - category: account
        as: history
        reads: [account_transactions.event_type]
        note: The consumer payments posted to the settled account decide the Lump-Sum track-record allowance.
      - category: plan
        as: history
        reads: [plan_id, close_reason, plan_installments.plan_id, plan_installments.event_type]
        note: The plan on the settled account closed as superseded by the settlement, and the missed installments recorded on that plan alone, decide the Lump-Sum superseded-plan allowance.
    compute:
      - lx_past_due_days: "DAYS(F('first_payment_due_date'), NOW) - F('extension_days_total')"
      - lx_returned_on: "LATEST('settlement_payments','txn_date', date_field='txn_date', event_type='settle_payment_returned')"
      - lx_anchor_days: "MX(0, DAYS(F('first_payment_due_date'), lx_returned_on) - F('extension_days_total')) if lx_returned_on else (lx_past_due_days if lx_past_due_days > 0 else 0)"
      - lx_hold_status: "CFIELD('hardship','status', account_id=F('account_id'))"
      - lx_hold_decided: "CFIELD('hardship','decision_date', account_id=F('account_id'))"
      - lx_hold_recent: "(MONTHS(lx_hold_decided, NOW) < K('months_span')) if lx_hold_decided else False"
      - lx_hardship_allow: "K('allow_hold_approved') if (lx_hold_recent and (lx_hold_status == 'active' or lx_hold_status == 'ended')) else (K('allow_hold_denied') if (lx_hold_recent and lx_hold_status == 'denied') else 0)"
      - lx_booked: "SUM('settlement_payments','amount', event_type='settle_amount_scheduled')"
      - lx_received: "SUM('settlement_payments','amount', event_type='settle_payment_received')"
      - lx_returned: "SUM('settlement_payments','amount', event_type='settle_payment_returned')"
      - lx_still_to_pay: "lx_booked - lx_received + lx_returned"
      - lx_balance_allow: "K('allow_balance_high') if lx_still_to_pay >= K('balance_high_usd') else (K('allow_balance_mid') if lx_still_to_pay >= K('balance_mid_usd') else 0)"
      - lx_payments_posted: "XCOUNT('account','account_transactions', event_type='account_payment_posted', account_id=F('account_id'))"
      - lx_record_allow: "K('allow_record_many') if lx_payments_posted >= K('record_many') else (K('allow_record_some') if lx_payments_posted >= 1 else 0)"
      - lx_superseded_plan_id: "CFIELD('plan','plan_id', account_id=F('account_id'), close_reason='superseded_by_settlement')"
      - lx_plan_missed: "XCOUNT('plan','plan_installments', event_type='plan_installment_missed', plan_id=lx_superseded_plan_id) if lx_superseded_plan_id else 0"
      - lx_plan_allow: "K('allow_plan_clean') if (lx_superseded_plan_id and lx_plan_missed == 0) else (K('allow_plan_missed') if (lx_superseded_plan_id and lx_plan_missed >= 1) else 0)"
      - result: "MN(P('due_date_extension_max_days'), K('standard_grant') + (lx_hardship_allow + lx_balance_allow + lx_record_allow + lx_plan_allow) + lx_anchor_days)"
    compute_basis:
      lx_past_due_days: "where no settlement payment has been returned and the payment's current due date is already past on the handling date, the anchor is the handling date and the days the payment is past due are added to the grant"
      lx_returned_on: "where a settlement payment on the settlement has been returned, the anchor is the date the return was received"
      lx_anchor_days: "The Lump-Sum extension is counted from an anchor date: where a settlement payment on the settlement has been returned, the anchor is the date the return was received and the days from the payment's current due date to that return date, never fewer than zero, are added to the grant; where no settlement payment has been returned and the payment's current due date is already past on the handling date, the anchor is the handling date and the days the payment is past due are added to the grant; where neither holds, the anchor is the current due date and nothing is added."
      lx_hold_status: "Where a hardship hold on the settled account was approved"
      lx_hold_decided: "with a decision date after the same calendar day twelve months before the handling date"
      lx_hold_recent: "with a decision date after the same calendar day twelve months before the handling date"
      lx_hardship_allow: "Where a hardship hold on the settled account was approved with a decision date after the same calendar day twelve months before the handling date, the Lump-Sum hardship allowance of 2 days is added to the grant; where a hardship hold request on that account was denied with a decision date in that same span, the Lump-Sum denied-request allowance of 1 day is added; an account with neither carries no Lump-Sum hardship allowance."
      lx_booked: "the settlement amount booked on acceptance"
      lx_received: "less every settlement payment received"
      lx_returned: "plus every settlement payment returned"
      lx_still_to_pay: "The amount still to pay under the Lump-Sum Settlement is worked out from its ledger as the settlement amount booked on acceptance, less every settlement payment received, plus every settlement payment returned"
      lx_balance_allow: "where that amount still to pay is 500.00 dollars or more, the Lump-Sum balance allowance of 2 days is added; where it is at least 150.00 dollars but under 500.00 dollars, the Lump-Sum balance allowance is 1 day; an amount still to pay under 150.00 dollars carries no Lump-Sum balance allowance."
      lx_payments_posted: "Every consumer payment posted to the settled account counts toward the Lump-Sum track record, a payment that was later returned included"
      lx_record_allow: "where three or more have been posted, the Lump-Sum track-record allowance of 2 days is added; where one or two have been posted, the Lump-Sum track-record allowance is 1 day; an account with no posted consumer payment carries no Lump-Sum track-record allowance."
      lx_superseded_plan_id: "Where a payment plan on the settled account was cancelled because the settlement superseded it"
      lx_plan_missed: "that plan recorded no missed installment"
      lx_plan_allow: "Where a payment plan on the settled account was cancelled because the settlement superseded it and that plan recorded no missed installment, the Lump-Sum superseded-plan allowance of 2 days is added; where such a superseded plan recorded at least one missed installment, the Lump-Sum superseded-plan allowance is 1 day; an account with no plan superseded by the settlement carries no Lump-Sum superseded-plan allowance."
      result: "The Lump-Sum extension days are worked out in this order: first the standard grant is taken, then the hardship, balance, track-record and superseded-plan allowances are added to it, then the days the anchor adds are added, and only then is the total capped at the programme's extension maximum of 10 calendar days; the extension days are a whole number of calendar days."
    factors:
      - id: lx_extension_anchor
        effect: method
        decides: lx_anchor_days
        bindings: [lx_past_due_days, lx_returned_on, lx_anchor_days]
        ladder:
          - when: "a settlement payment on the settlement has been returned"
            method: "the extension is counted from the date the return was received: the days from the current due date to that date are added"
          - when: "no payment has been returned and the current due date is already past on the handling date"
            method: "the extension is counted from the handling date: the days past due are added"
          - when: "otherwise"
            method: "the extension is counted from the current due date and nothing is added"
        baseline:
          lx_anchor_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: lx_hardship_history
        effect: parameter
        decides: lx_hardship_allow
        bindings: [lx_hold_status, lx_hold_decided, lx_hold_recent, lx_hardship_allow]
        ladder:
          - when: "a hardship hold on the settled account was approved AND decided within the twelve-month span"
            value: "K('allow_hold_approved')"
          - when: "a hardship hold request on the account was denied AND decided within the twelve-month span"
            value: "K('allow_hold_denied')"
          - when: "otherwise"
            value: "0"
        baseline:
          lx_hardship_allow: "0"
        evidence: [cross_category, date]
        cross_difficulty: hardship
      - id: lx_remaining_balance
        effect: parameter
        decides: lx_balance_allow
        bindings: [lx_booked, lx_received, lx_returned, lx_still_to_pay, lx_balance_allow]
        ladder:
          - when: "the amount still to pay under the Lump-Sum Settlement is 500.00 dollars or more"
            value: "K('allow_balance_high')"
          - when: "it is at least 150.00 dollars but under 500.00 dollars"
            value: "K('allow_balance_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          lx_balance_allow: "0"
        evidence: [history]
        cross_difficulty: null
      - id: lx_payment_track_record
        effect: parameter
        decides: lx_record_allow
        bindings: [lx_payments_posted, lx_record_allow]
        ladder:
          - when: "three or more consumer payments have been posted to the settled account"
            value: "K('allow_record_many')"
          - when: "one or two have been posted"
            value: "K('allow_record_some')"
          - when: "otherwise"
            value: "0"
        baseline:
          lx_record_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: account
      - id: lx_superseded_plan
        effect: parameter
        decides: lx_plan_allow
        bindings: [lx_superseded_plan_id, lx_plan_missed, lx_plan_allow]
        ladder:
          - when: "a plan on the account was superseded by the settlement AND it recorded no missed installment"
            value: "K('allow_plan_clean')"
          - when: "a plan on the account was superseded by the settlement AND it recorded at least one missed installment"
            value: "K('allow_plan_missed')"
          - when: "otherwise"
            value: "0"
        baseline:
          lx_plan_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: plan
    baseline:
      rule: >-
        The Lump-Sum extension days are a standard grant of 3 calendar days counted from the payment's current due
        date, never more than the programme's extension maximum of 10 calendar days.
        The extension adds those days to the settlement's extension days total and to its final payment due date, so
        that the payment's current due date becomes the first payment due date plus the extension days total.
      params: [standard_grant, due_date_extension_max_days]
    inputs:
      history:
        - {table: settlement_payments, aggregate: sum, field: amount, filters: {event_type: settle_amount_scheduled}}
        - {table: settlement_payments, aggregate: sum, field: amount, filters: {event_type: settle_payment_received}}
        - {table: settlement_payments, aggregate: sum, field: amount, filters: {event_type: settle_payment_returned}}
        - {table: settlement_payments, aggregate: latest, field: txn_date, filters: {event_type: settle_payment_returned}}
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, filters: {event_type: account_payment_posted}}
        - {category: plan, table: plan_installments, aggregate: count, field: plan_txn_id, filters: {event_type: plan_installment_missed}}
      cross_category: [hardship, account, plan]

  - id: settle_ext_hardship_offer
    base_policy_refs: [settle_agg_multi_holding, settle_agg_same_client_bundle, settle_offer_authority, settle_evt_client_approval, settle_combo_plan_and_hardship]
    overwrite:
      - base_policy: settle_offer_authority
        superseded_clause: >-
          The programme's floor for the account is read from its authority floor for the account's stage (authority_floor_pct_early_out through authority_floor_pct_legal_review), lowered by the percentage points listed for the placing agreement's tier in client_tier_floor_reduction_pct and by any bundle reduction, but never below the programme's approval floor for the same stage
        replaced_by: >-
          The Hardship Settlement offer percentage is worked out in this order: first the Hardship Settlement authority floor for the stage is taken, then every Hardship Settlement reduction that applies is added together and subtracted from it once, and only then is that figure compared with the Hardship Settlement approval floor for the stage, the higher of the two being the Hardship Settlement offer percentage.
      - base_policy: settle_offer_authority
        superseded_clause: >-
          Ridgeline may offer any settlement_pct at or above that floor on its own authority; a lower percentage, down to the approval floor and no further, needs a client approval on record.
        replaced_by: >-
          Ridgeline extends the Hardship Settlement offer on its own authority at exactly the Hardship Settlement offer percentage, never at another percentage.
      - base_policy: settle_evt_client_approval
        superseded_clause: >-
          An offer that needs client approval is extended only on an approval request for the same account and programme whose request_status is approved, at a settlement_pct no lower than the approved_pct, and the offer carries that request in approval_request_id.
        replaced_by: >-
          A Hardship Settlement offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 15,000.00 dollars and the balance due less the settlement amount is no more than 12,500.00 dollars, and it carries no approval request.
      - base_policy: settle_evt_client_approval
        superseded_clause: >-
          An approved offer is extended only when the handling date is no later than the last day of the approval validity counted from the approval's decision_date.
        replaced_by: >-
          A Hardship Settlement offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 15,000.00 dollars and the balance due less the settlement amount is no more than 12,500.00 dollars, and it carries no approval request.
    trigger: on_request
    subject: [settle_offer_issued]
    computes: settlement_amount
    target_tool: issue_hardship_settlement_offer_9c740749
    params:
      auth_floor_early_out: 100.0
      auth_floor_primary: 55.0
      auth_floor_secondary: 40.0
      auth_floor_tertiary: 30.0
      auth_floor_warehouse: 25.0
      auth_floor_legal_review: 60.0
      appr_floor_early_out: 100.0
      appr_floor_primary: 40.0
      appr_floor_secondary: 30.0
      appr_floor_tertiary: 20.0
      appr_floor_warehouse: 15.0
      appr_floor_legal_review: 45.0
      age_long_days: 1095
      age_mid_days: 730
      age_red_long: 3.0
      age_red_mid: 1.5
      sol_near_days: 180
      sol_red_expired: 4.0
      sol_red_near: 2.0
      dorm_red_multi: 2.0
      dorm_red_single: 1.0
      hold_long_days: 180
      hold_mid_days: 90
      hold_red_long: 2.0
      hold_red_mid: 1.0
      band_high_usd: 4000.0
      band_mid_usd: 1500.0
      band_red_high: 1.0
      band_red_mid: 0.5
    rule: >-
      This rule prices a Hardship Settlement offer that Ridgeline extends on its own authority on a placed account
      whose placing agreement is a Starter Contingency Agreement or a Standard Contingency Agreement, the two
      agreement tiers whose client-tier floor reduction is 0.0, and whose most recent hardship hold qualifies it for
      a Hardship Settlement; an offer on an account placed under any other agreement tier is outside this rule and
      stays under the base floor rule.
      Ridgeline extends the Hardship Settlement offer on its own authority at exactly the Hardship Settlement offer percentage, never at another percentage.
      A Hardship Settlement offer under this rule never relies on a client approval: it is extended only where the account's balance due is no more than 15,000.00 dollars and the balance due less the settlement amount is no more than 12,500.00 dollars, and it carries no approval request.
      The Hardship Settlement offer is scheduled in the number of settlement payments the consumer chooses, from one
      to three, 30 calendar days apart, and carries no same-client bundle reduction.
      The Hardship Settlement offer percentage is not fixed until every accepted Lump-Sum Settlement the consumer holds on another account shows its settlement payment falling due on or after the offer date.
      The Hardship Settlement authority floor for the account's current placement stage is 100.0 for Early-Out
      Placement, 55.0 for Primary Placement, 40.0 for Secondary Placement, 30.0 for Tertiary Placement, 25.0 for
      Warehouse Placement and 60.0 for Legal Review Placement, and the Hardship Settlement approval floor for the
      same stages is 100.0, 40.0, 30.0, 20.0, 15.0 and 45.0 in that order.
      The Hardship Settlement offer percentage is the Hardship Settlement authority floor for the stage, never set
      below the Hardship Settlement approval floor for the stage.
      The Hardship Settlement amount is the account's balance due on the offer date times the Hardship Settlement
      offer percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 50.00 dollars is never offered under this rule.
      The Hardship Settlement debt age is counted in calendar days from its anchor date up to the offer date; the
      anchor date is the account's charge-off date where the client reported one, the account's first delinquency
      date where no charge-off date is reported but a first delinquency date is, and the placement date where the
      client reported neither.
      Where the Hardship Settlement debt age is 1095 days or more, the Hardship Settlement long-age reduction of 3.0
      percentage points applies; where it is at least 730 days but under 1095 days, the Hardship Settlement mid-age
      reduction of 1.5 points applies; a Hardship Settlement debt age under 730 days carries no age reduction.
      Where the account's statute-of-limitations expiry date is before the offer date, the Hardship Settlement
      time-barred reduction of 4.0 points applies; where that expiry date is on the offer date or within the 180
      calendar days after it, the Hardship Settlement near-expiry reduction of 2.0 points applies; a later expiry
      date carries no statute reduction for a Hardship Settlement.
      Where two or more collection agencies worked the account before this placement and no consumer payment was
      posted to it with a date after the same calendar day twelve months before the offer date, the Hardship
      Settlement dormancy reduction of 2.0 points applies; where exactly one agency worked it before this placement
      and no consumer payment was posted in that same twelve-month span, the Hardship Settlement single-agency
      dormancy reduction of 1.0 point applies; in every other case the account carries no dormancy reduction for a
      Hardship Settlement.
      The length of the qualifying hardship hold is counted in calendar days from the hold's start date to its ended
      date, or to the offer date while the hold is still active; where that hold lasted 180 days or more, the
      Hardship Settlement long-hold reduction of 2.0 points applies; where it lasted at least 90 days but under 180
      days, the Hardship Settlement mid-hold reduction of 1.0 point applies; a shorter hold carries no hold-length
      reduction.
      Where the account's balance due on the offer date is 4,000.00 dollars or more, the Hardship Settlement
      large-balance reduction of 1.0 point applies; where it is at least 1,500.00 dollars but under 4,000.00
      dollars, the Hardship Settlement mid-balance reduction of 0.5 points applies; a balance due under 1,500.00
      dollars carries no balance reduction for a Hardship Settlement.
      The Hardship Settlement offer percentage is worked out in this order: first the Hardship Settlement authority floor for the stage is taken, then every Hardship Settlement reduction that applies is added together and subtracted from it once, and only then is that figure compared with the Hardship Settlement approval floor for the stage, the higher of the two being the Hardship Settlement offer percentage.
      The Hardship Settlement offer percentage is carried to one decimal place and the settlement amount is computed
      from it.
    prerequisite:
      - problem: settle_ext_lump_sum_extension
        kind: state_gate
        gate: settlement_agreements.extension_days_total
        form: state
        policy_source: >-
          The Hardship Settlement offer percentage is not fixed until every accepted Lump-Sum Settlement the consumer holds on another account shows its settlement payment falling due on or after the offer date.
        condition: >-
          Every Lump-Sum Settlement in status accepted on another placed account of the consumer has first payment due date plus extension days total on or after the handling date.
        resolved_by: extend_lump_sum_settlement_due_date_54e5e409
        effect: >-
          Once every accepted Lump-Sum Settlement the consumer holds on another account shows its payment falling due on or after the offer date, the Hardship Settlement offer may be priced and extended.
    cross_category:
      - category: account
        as: history
        reads: [balance_due, variant_name, charge_off_date, first_delinquency_date, placement_date, sol_expiry_date, prior_agency_placements, account_transactions.event_type, account_transactions.txn_date]
        note: The placed account's stage, balance, dates, agency history and payment ledger decide the age, statute, dormancy and balance tiers.
      - category: hardship
        as: history
        reads: [start_date, ended_date]
        note: The start and ended dates of the qualifying hardship hold decide the hold-length tier.
    compute:
      - hs_stage: "CFIELD('account','variant_name', account_id=HID)"
      - hs_auth_floor: "K('auth_floor_early_out') if hs_stage == 'Early-Out Placement' else (K('auth_floor_primary') if hs_stage == 'Primary Placement' else (K('auth_floor_secondary') if hs_stage == 'Secondary Placement' else (K('auth_floor_tertiary') if hs_stage == 'Tertiary Placement' else (K('auth_floor_warehouse') if hs_stage == 'Warehouse Placement' else K('auth_floor_legal_review')))))"
      - hs_appr_floor: "K('appr_floor_early_out') if hs_stage == 'Early-Out Placement' else (K('appr_floor_primary') if hs_stage == 'Primary Placement' else (K('appr_floor_secondary') if hs_stage == 'Secondary Placement' else (K('appr_floor_tertiary') if hs_stage == 'Tertiary Placement' else (K('appr_floor_warehouse') if hs_stage == 'Warehouse Placement' else K('appr_floor_legal_review')))))"
      - hs_charge_off: "CFIELD('account','charge_off_date', account_id=HID)"
      - hs_first_delinquency: "CFIELD('account','first_delinquency_date', account_id=HID)"
      - hs_age_anchor: "hs_charge_off if hs_charge_off else (hs_first_delinquency if hs_first_delinquency else CFIELD('account','placement_date', account_id=HID))"
      - hs_debt_age_days: "DAYS(hs_age_anchor, NOW)"
      - hs_age_reduction: "K('age_red_long') if hs_debt_age_days >= K('age_long_days') else (K('age_red_mid') if hs_debt_age_days >= K('age_mid_days') else 0.0)"
      - hs_sol_days: "DAYS(NOW, CFIELD('account','sol_expiry_date', account_id=HID))"
      - hs_sol_reduction: "K('sol_red_expired') if hs_sol_days < 0 else (K('sol_red_near') if hs_sol_days <= K('sol_near_days') else 0.0)"
      - hs_prior_agencies: "CFIELD('account','prior_agency_placements', account_id=HID)"
      - hs_payments_12m: "XCOUNT('account','account_transactions', within_months=12, date_field='txn_date', event_type='account_payment_posted', account_id=HID)"
      - hs_dormancy_reduction: "K('dorm_red_multi') if (hs_prior_agencies >= 2 and hs_payments_12m == 0) else (K('dorm_red_single') if (hs_prior_agencies == 1 and hs_payments_12m == 0) else 0.0)"
      - hs_hold_start: "CFIELD('hardship','start_date', account_id=HID)"
      - hs_hold_ended: "CFIELD('hardship','ended_date', account_id=HID)"
      - hs_hold_days: "DAYS(hs_hold_start, hs_hold_ended if hs_hold_ended else NOW)"
      - hs_hold_reduction: "K('hold_red_long') if hs_hold_days >= K('hold_long_days') else (K('hold_red_mid') if hs_hold_days >= K('hold_mid_days') else 0.0)"
      - hs_band_reduction: "K('band_red_high') if CFIELD('account','balance_due', account_id=HID) >= K('band_high_usd') else (K('band_red_mid') if CFIELD('account','balance_due', account_id=HID) >= K('band_mid_usd') else 0.0)"
      - hs_pct: "RND(MX(hs_auth_floor - (hs_age_reduction + hs_sol_reduction + hs_dormancy_reduction + hs_hold_reduction + hs_band_reduction), hs_appr_floor), 1)"
      - hs_balance: "CFIELD('account','balance_due', account_id=HID)"
      - result: "-((-(hs_balance * hs_pct / 100)) // 1)"
    compute_basis:
      hs_stage: "The Hardship Settlement authority floor for the account's current placement stage is 100.0 for Early-Out Placement, 55.0 for Primary Placement, 40.0 for Secondary Placement, 30.0 for Tertiary Placement, 25.0 for Warehouse Placement and 60.0 for Legal Review Placement"
      hs_auth_floor: "The Hardship Settlement authority floor for the account's current placement stage is 100.0 for Early-Out Placement, 55.0 for Primary Placement, 40.0 for Secondary Placement, 30.0 for Tertiary Placement, 25.0 for Warehouse Placement and 60.0 for Legal Review Placement"
      hs_appr_floor: "the Hardship Settlement approval floor for the same stages is 100.0, 40.0, 30.0, 20.0, 15.0 and 45.0 in that order."
      hs_charge_off: "the anchor date is the account's charge-off date where the client reported one"
      hs_first_delinquency: "the account's first delinquency date where no charge-off date is reported but a first delinquency date is"
      hs_age_anchor: "the anchor date is the account's charge-off date where the client reported one, the account's first delinquency date where no charge-off date is reported but a first delinquency date is, and the placement date where the client reported neither."
      hs_debt_age_days: "The Hardship Settlement debt age is counted in calendar days from its anchor date up to the offer date"
      hs_age_reduction: "Where the Hardship Settlement debt age is 1095 days or more, the Hardship Settlement long-age reduction of 3.0 percentage points applies; where it is at least 730 days but under 1095 days, the Hardship Settlement mid-age reduction of 1.5 points applies; a Hardship Settlement debt age under 730 days carries no age reduction."
      hs_sol_days: "Where the account's statute-of-limitations expiry date is before the offer date"
      hs_sol_reduction: "Where the account's statute-of-limitations expiry date is before the offer date, the Hardship Settlement time-barred reduction of 4.0 points applies; where that expiry date is on the offer date or within the 180 calendar days after it, the Hardship Settlement near-expiry reduction of 2.0 points applies; a later expiry date carries no statute reduction for a Hardship Settlement."
      hs_prior_agencies: "Where two or more collection agencies worked the account before this placement"
      hs_payments_12m: "no consumer payment was posted to it with a date after the same calendar day twelve months before the offer date"
      hs_dormancy_reduction: "Where two or more collection agencies worked the account before this placement and no consumer payment was posted to it with a date after the same calendar day twelve months before the offer date, the Hardship Settlement dormancy reduction of 2.0 points applies; where exactly one agency worked it before this placement and no consumer payment was posted in that same twelve-month span, the Hardship Settlement single-agency dormancy reduction of 1.0 point applies; in every other case the account carries no dormancy reduction for a Hardship Settlement."
      hs_hold_start: "The length of the qualifying hardship hold is counted in calendar days from the hold's start date to its ended date, or to the offer date while the hold is still active"
      hs_hold_ended: "The length of the qualifying hardship hold is counted in calendar days from the hold's start date to its ended date, or to the offer date while the hold is still active"
      hs_hold_days: "The length of the qualifying hardship hold is counted in calendar days from the hold's start date to its ended date, or to the offer date while the hold is still active"
      hs_hold_reduction: "where that hold lasted 180 days or more, the Hardship Settlement long-hold reduction of 2.0 points applies; where it lasted at least 90 days but under 180 days, the Hardship Settlement mid-hold reduction of 1.0 point applies; a shorter hold carries no hold-length reduction."
      hs_band_reduction: "Where the account's balance due on the offer date is 4,000.00 dollars or more, the Hardship Settlement large-balance reduction of 1.0 point applies; where it is at least 1,500.00 dollars but under 4,000.00 dollars, the Hardship Settlement mid-balance reduction of 0.5 points applies; a balance due under 1,500.00 dollars carries no balance reduction for a Hardship Settlement."
      hs_pct: "The Hardship Settlement offer percentage is worked out in this order: first the Hardship Settlement authority floor for the stage is taken, then every Hardship Settlement reduction that applies is added together and subtracted from it once, and only then is that figure compared with the Hardship Settlement approval floor for the stage, the higher of the two being the Hardship Settlement offer percentage."
      hs_balance: "The Hardship Settlement amount is the account's balance due on the offer date times the Hardship Settlement offer percentage divided by 100"
      result: "The Hardship Settlement amount is the account's balance due on the offer date times the Hardship Settlement offer percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 50.00 dollars is never offered under this rule."
    factors:
      - id: hs_age_anchor_date
        effect: method
        decides: hs_age_anchor
        bindings: [hs_charge_off, hs_first_delinquency, hs_age_anchor]
        ladder:
          - when: "the client reported a charge-off date for the account"
            method: "the Hardship Settlement debt age is counted from the charge-off date"
          - when: "no charge-off date is reported and the client reported a first delinquency date"
            method: "the Hardship Settlement debt age is counted from the first delinquency date"
          - when: "otherwise"
            method: "the Hardship Settlement debt age is counted from the placement date"
        baseline:
          hs_age_anchor: "CFIELD('account','placement_date', account_id=HID)"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: hs_debt_age
        effect: parameter
        decides: hs_age_reduction
        bindings: [hs_debt_age_days, hs_age_reduction]
        ladder:
          - when: "the Hardship Settlement debt age is 1095 days or more"
            value: "K('age_red_long')"
          - when: "the Hardship Settlement debt age is at least 730 days but under 1095 days"
            value: "K('age_red_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          hs_age_reduction: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: hs_statute_status
        effect: parameter
        decides: hs_sol_reduction
        bindings: [hs_sol_days, hs_sol_reduction]
        ladder:
          - when: "the account's statute-of-limitations expiry date is before the offer date"
            value: "K('sol_red_expired')"
          - when: "the expiry date is on the offer date or within the 180 calendar days after it"
            value: "K('sol_red_near')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          hs_sol_reduction: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: hs_dormancy
        effect: parameter
        decides: hs_dormancy_reduction
        bindings: [hs_prior_agencies, hs_payments_12m, hs_dormancy_reduction]
        ladder:
          - when: "two or more prior agencies worked the account AND no consumer payment posted in the twelve-month span"
            value: "K('dorm_red_multi')"
          - when: "exactly one prior agency worked the account AND no consumer payment posted in the twelve-month span"
            value: "K('dorm_red_single')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          hs_dormancy_reduction: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: account
      - id: hs_hold_length
        effect: parameter
        decides: hs_hold_reduction
        bindings: [hs_hold_start, hs_hold_ended, hs_hold_days, hs_hold_reduction]
        ladder:
          - when: "the qualifying hardship hold lasted 180 days or more"
            value: "K('hold_red_long')"
          - when: "it lasted at least 90 days but under 180 days"
            value: "K('hold_red_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          hs_hold_reduction: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: hardship
      - id: hs_balance_size
        effect: parameter
        decides: hs_band_reduction
        bindings: [hs_band_reduction]
        ladder:
          - when: "the balance due on the offer date is 4,000.00 dollars or more"
            value: "K('band_red_high')"
          - when: "the balance due is at least 1,500.00 dollars but under 4,000.00 dollars"
            value: "K('band_red_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          hs_band_reduction: "0.0"
        evidence: [cross_category]
        cross_difficulty: account
    baseline:
      rule: >-
        The Hardship Settlement authority floor for the account's current placement stage is 100.0 for Early-Out
        Placement, 55.0 for Primary Placement, 40.0 for Secondary Placement, 30.0 for Tertiary Placement, 25.0 for
        Warehouse Placement and 60.0 for Legal Review Placement, and the Hardship Settlement approval floor for the
        same stages is 100.0, 40.0, 30.0, 20.0, 15.0 and 45.0 in that order.
        The Hardship Settlement offer percentage is the Hardship Settlement authority floor for the stage, never set
        below the Hardship Settlement approval floor for the stage.
        The Hardship Settlement amount is the account's balance due on the offer date times the Hardship Settlement
        offer percentage divided by 100, rounded up to the next whole dollar only once at the end; an amount below 50.00 dollars is never offered under this rule.
      params: [auth_floor_early_out, auth_floor_primary, auth_floor_secondary, auth_floor_tertiary, auth_floor_warehouse, auth_floor_legal_review, appr_floor_early_out, appr_floor_primary, appr_floor_secondary, appr_floor_tertiary, appr_floor_warehouse, appr_floor_legal_review]
    inputs:
      history:
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: account_payment_posted}}
      cross_category: [account, hardship]

  - id: settle_ext_hardship_esign_acceptance
    base_policy_refs: [settle_combo_plan_and_hardship, settle_evt_acceptance_and_expiry]
    overwrite:
      - base_policy: settle_evt_acceptance_and_expiry
        superseded_clause: >-
          On acceptance the first payment due date is recomputed as the acceptance date plus the same number of days the offer allowed, never more than first_payment_max_days_after_acceptance, and later due dates follow at payment_interval_days.
        replaced_by: >-
          The Hardship Settlement signing window is worked out in this order: first the offered Hardship Settlement window is taken and capped at 30 days, then the stage, opening-payment and lapsed-offer shortenings are added together and subtracted from it once, then the recent-hold allowance is added, the result being never less than one day nor more than the capped offered window, and only then is the returned-payment signing convention applied to it.
    trigger: on_request
    subject: [settle_offer_accepted, settle_amount_scheduled]
    computes: first_payment_due_in_days
    target_tool: sign_settlement_offer_electronically_52f226cb
    params:
      max_first_window_days: 30
      cut_late: 12
      cut_mid: 8
      opening_pct: 33.0
      small_opening_usd: 300.0
      mid_opening_usd: 600.0
      cut_small_opening: 6
      cut_mid_opening: 4
      cut_many_lapses: 6
      cut_one_lapse: 3
      recent_hold_days: 45
      window_hold_days: 120
      allow_recent_hold: 3
      allow_window_hold: 1
      min_window_days: 1
    rule: >-
      This rule fixes the Hardship Settlement signing window, the number of calendar days from the acceptance date
      to the due date of the first settlement payment, when a consumer accepts a Hardship Settlement offer by
      electronic signature, the way a Hardship Settlement is accepted because it cannot be accepted on a recorded
      call; acceptance of any other programme is outside this rule.
      An electronically signed acceptance of a Hardship Settlement is booked only after the account carries an open Hardship Settlement offer dated within its validity.
      The offered Hardship Settlement window is the number of calendar days from the offer date of that open offer
      to the first payment due date written on it, never more than 30 days.
      The Hardship Settlement signing window is the offered Hardship Settlement window, never less than one day.
      On electronic acceptance the first settlement payment falls due that many calendar days after the acceptance
      date, each later payment falls due the offer's payment interval after the one before it, and the offer's
      settlement amount is booked to the settlement once, on the acceptance date.
      Where the account is at Legal Review Placement or Warehouse Placement, the Hardship Settlement signing window
      is shortened by 12 days for its stage; where it is at Tertiary Placement or Secondary Placement, by 8 days; an
      account at Early-Out Placement or Primary Placement takes no stage shortening of the signing window.
      The Hardship Settlement opening payment is the whole settlement amount where the offer has one payment and the
      offer's settlement amount times 33.0 percent where it has more; where that opening payment is under 300.00
      dollars the Hardship Settlement signing window is shortened by 6 days; where it is at least 300.00 dollars but
      under 600.00 dollars, by 4 days; an opening payment of 600.00 dollars or more takes no opening-payment
      shortening of the signing window.
      Where two or more settlement offers on the account dated after the same calendar day twelve months before the
      acceptance date have expired unaccepted, the Hardship Settlement signing window is shortened by 6 days for
      lapsed offers; where exactly one such offer has expired, by 3 days; an account with no such expired offer
      takes no lapsed-offer shortening of the signing window.
      Where the account's qualifying hardship hold is still active or ended no more than 45 days before the
      acceptance date, the Hardship Settlement recent-hold allowance of 3 days is added back; where it ended more
      than 45 but no more than 120 days before the acceptance date, the recent-hold allowance is 1 day; a hold that
      ended earlier earns no recent-hold allowance.
      The Hardship Settlement returned-payment signing convention decides on which day the first payment falls:
      where two or more consumer payments on the account were returned with a return date after the same calendar
      day twelve months before the acceptance date, the first payment is taken as guaranteed funds on the next
      business day after the acceptance date, Monday through Friday, and the adjusted signing window is set aside;
      where exactly one consumer payment on the account was returned in that span, the adjusted signing window is
      kept but a first payment that would fall due on a Saturday or a Sunday is moved back to the Friday before it,
      or forward to the Monday after it where that Friday would fall on or before the acceptance date; where none was returned in that span, the adjusted signing window is used as it stands, whatever day of the
      week it ends on.
      The Hardship Settlement signing window is worked out in this order: first the offered Hardship Settlement window is taken and capped at 30 days, then the stage, opening-payment and lapsed-offer shortenings are added together and subtracted from it once, then the recent-hold allowance is added, the result being never less than one day nor more than the capped offered window, and only then is the returned-payment signing convention applied to it.
    prerequisite:
      - problem: settle_ext_hardship_offer
        kind: value_input
        gate: ha_offer_days
        form: state
        policy_source: >-
          An electronically signed acceptance of a Hardship Settlement is booked only after the account carries an open Hardship Settlement offer dated within its validity.
        condition: >-
          The account shows a settlement with variant Hardship Settlement and status offered whose offer expiry date is on or after the handling date.
        resolved_by: issue_hardship_settlement_offer_9c740749
        effect: >-
          The open Hardship Settlement offer supplies the offer date, the first payment due date written on it, the settlement amount and the payment count, so the offered window and the opening payment take their values from that offer.
    cross_category:
      - category: account
        as: history
        reads: [variant_name, account_transactions.event_type, account_transactions.txn_date]
        note: Returned consumer payments decide the returned-payment signing convention and the account stage decides the stage shortening.
      - category: hardship
        as: branch
        reads: [ended_date]
        note: The ended date of the qualifying hold decides the recent-hold allowance.
    compute:
      - ha_offer_date: "LATEST('settlement_agreements','offer_date', date_field='offer_date', status='offered', variant_name='Hardship Settlement')"
      - ha_offer_first_due: "LATEST('settlement_agreements','first_payment_due_date', date_field='offer_date', status='offered', variant_name='Hardship Settlement')"
      - ha_offer_days: "DAYS(ha_offer_date, ha_offer_first_due)"
      - ha_base_window: "MN(ha_offer_days, K('max_first_window_days'))"
      - ha_stage: "CFIELD('account','variant_name', account_id=HID)"
      - ha_stage_cut: "K('cut_late') if (ha_stage == 'Legal Review Placement' or ha_stage == 'Warehouse Placement') else (K('cut_mid') if (ha_stage == 'Tertiary Placement' or ha_stage == 'Secondary Placement') else 0)"
      - ha_offer_amount: "LATEST('settlement_agreements','settlement_amount', date_field='offer_date', status='offered', variant_name='Hardship Settlement')"
      - ha_offer_count: "LATEST('settlement_agreements','payment_count', date_field='offer_date', status='offered', variant_name='Hardship Settlement')"
      - ha_opening_payment: "ha_offer_amount if ha_offer_count == 1 else ha_offer_amount * K('opening_pct') / 100"
      - ha_opening_cut: "K('cut_small_opening') if ha_opening_payment < K('small_opening_usd') else (K('cut_mid_opening') if ha_opening_payment < K('mid_opening_usd') else 0)"
      - ha_lapsed_offers: "COUNT('settlement_agreements', within_months=12, date_field='offer_date', status='expired')"
      - ha_lapse_cut: "K('cut_many_lapses') if ha_lapsed_offers >= 2 else (K('cut_one_lapse') if ha_lapsed_offers == 1 else 0)"
      - ha_hold_ended: "CFIELD('hardship','ended_date', account_id=HID)"
      - ha_days_since_hold: "DAYS(ha_hold_ended, NOW) if ha_hold_ended else 0"
      - ha_hold_allow: "K('allow_recent_hold') if ha_days_since_hold <= K('recent_hold_days') else (K('allow_window_hold') if ha_days_since_hold <= K('window_hold_days') else 0)"
      - ha_adjusted_window: "MN(ha_base_window, MX(K('min_window_days'), ha_base_window - (ha_stage_cut + ha_opening_cut + ha_lapse_cut) + ha_hold_allow))"
      - ha_returns_12m: "XCOUNT('account','account_transactions', within_months=12, date_field='txn_date', event_type='account_payment_returned', account_id=HID)"
      - ha_acceptance_weekday: "DAYS('2024-01-01', NOW) % 7"
      - ha_due_weekday: "(DAYS('2024-01-01', NOW) + ha_adjusted_window) % 7"
      - ha_signing_convention: "(3 if ha_acceptance_weekday == 4 else (2 if ha_acceptance_weekday == 5 else 1)) if ha_returns_12m >= 2 else (((ha_adjusted_window - (ha_due_weekday - 4) if ha_adjusted_window - (ha_due_weekday - 4) >= 1 else ha_adjusted_window + (7 - ha_due_weekday)) if ha_due_weekday >= 5 else ha_adjusted_window) if ha_returns_12m == 1 else ha_adjusted_window)"
      - result: "ha_signing_convention"
    compute_basis:
      ha_offer_date: "The offered Hardship Settlement window is the number of calendar days from the offer date of that open offer to the first payment due date written on it"
      ha_offer_first_due: "The offered Hardship Settlement window is the number of calendar days from the offer date of that open offer to the first payment due date written on it"
      ha_offer_days: "The offered Hardship Settlement window is the number of calendar days from the offer date of that open offer to the first payment due date written on it, never more than 30 days."
      ha_base_window: "first the offered Hardship Settlement window is taken and capped at 30 days"
      ha_stage: "Where the account is at Legal Review Placement or Warehouse Placement"
      ha_stage_cut: "Where the account is at Legal Review Placement or Warehouse Placement, the Hardship Settlement signing window is shortened by 12 days for its stage; where it is at Tertiary Placement or Secondary Placement, by 8 days; an account at Early-Out Placement or Primary Placement takes no stage shortening of the signing window."
      ha_offer_amount: "The Hardship Settlement opening payment is the whole settlement amount where the offer has one payment and the offer's settlement amount times 33.0 percent where it has more"
      ha_offer_count: "The Hardship Settlement opening payment is the whole settlement amount where the offer has one payment and the offer's settlement amount times 33.0 percent where it has more"
      ha_opening_payment: "The Hardship Settlement opening payment is the whole settlement amount where the offer has one payment and the offer's settlement amount times 33.0 percent where it has more"
      ha_opening_cut: "where that opening payment is under 300.00 dollars the Hardship Settlement signing window is shortened by 6 days; where it is at least 300.00 dollars but under 600.00 dollars, by 4 days; an opening payment of 600.00 dollars or more takes no opening-payment shortening of the signing window."
      ha_lapsed_offers: "settlement offers on the account dated after the same calendar day twelve months before the acceptance date have expired unaccepted"
      ha_lapse_cut: "Where two or more settlement offers on the account dated after the same calendar day twelve months before the acceptance date have expired unaccepted, the Hardship Settlement signing window is shortened by 6 days for lapsed offers; where exactly one such offer has expired, by 3 days; an account with no such expired offer takes no lapsed-offer shortening of the signing window."
      ha_hold_ended: "Where the account's qualifying hardship hold is still active or ended no more than 45 days before the acceptance date"
      ha_days_since_hold: "Where the account's qualifying hardship hold is still active or ended no more than 45 days before the acceptance date"
      ha_hold_allow: "Where the account's qualifying hardship hold is still active or ended no more than 45 days before the acceptance date, the Hardship Settlement recent-hold allowance of 3 days is added back; where it ended more than 45 but no more than 120 days before the acceptance date, the recent-hold allowance is 1 day; a hold that ended earlier earns no recent-hold allowance."
      ha_adjusted_window: "then the stage, opening-payment and lapsed-offer shortenings are added together and subtracted from it once, then the recent-hold allowance is added, the result being never less than one day nor more than the capped offered window"
      ha_returns_12m: "consumer payments on the account were returned with a return date after the same calendar day twelve months before the acceptance date"
      ha_acceptance_weekday: "the first payment is taken as guaranteed funds on the next business day after the acceptance date, Monday through Friday"
      ha_due_weekday: "a first payment that would fall due on a Saturday or a Sunday is moved back to the Friday before it"
      ha_signing_convention: "The Hardship Settlement returned-payment signing convention decides on which day the first payment falls: where two or more consumer payments on the account were returned with a return date after the same calendar day twelve months before the acceptance date, the first payment is taken as guaranteed funds on the next business day after the acceptance date, Monday through Friday, and the adjusted signing window is set aside; where exactly one consumer payment on the account was returned in that span, the adjusted signing window is kept but a first payment that would fall due on a Saturday or a Sunday is moved back to the Friday before it, or forward to the Monday after it where that Friday would fall on or before the acceptance date; where none was returned in that span, the adjusted signing window is used as it stands, whatever day of the week it ends on."
      result: "and only then is the returned-payment signing convention applied to it."
    factors:
      - id: ha_returned_payment_signing_convention
        effect: method
        decides: ha_signing_convention
        bindings: [ha_returns_12m, ha_acceptance_weekday, ha_due_weekday, ha_signing_convention]
        ladder:
          - when: "two or more consumer payments on the account returned in the twelve-month span"
            method: "the first payment falls on the next business day after acceptance; the adjusted signing window is set aside"
          - when: "exactly one consumer payment on the account returned in the twelve-month span"
            method: "the adjusted signing window is kept, a due date on a Saturday or Sunday is moved back to the Friday before it, or forward to the Monday after it where that Friday falls on or before the acceptance date"
          - when: "otherwise"
            method: "the adjusted signing window is used as it stands, whatever weekday it ends on"
        baseline:
          ha_signing_convention: "ha_adjusted_window"
        evidence: [cross_category, history, date]
        cross_difficulty: account
      - id: ha_stage_shortening
        effect: parameter
        decides: ha_stage_cut
        bindings: [ha_stage, ha_stage_cut]
        ladder:
          - when: "the account is at Legal Review Placement or Warehouse Placement"
            value: "K('cut_late')"
          - when: "the account is at Tertiary Placement or Secondary Placement"
            value: "K('cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          ha_stage_cut: "0"
        evidence: [cross_category]
        cross_difficulty: account
      - id: ha_opening_payment_size
        effect: parameter
        decides: ha_opening_cut
        bindings: [ha_offer_amount, ha_offer_count, ha_opening_payment, ha_opening_cut]
        ladder:
          - when: "the Hardship Settlement opening payment is under 300.00 dollars"
            value: "K('cut_small_opening')"
          - when: "the opening payment is at least 300.00 dollars but under 600.00 dollars"
            value: "K('cut_mid_opening')"
          - when: "otherwise"
            value: "0"
        baseline:
          ha_opening_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ha_lapsed_offer_history
        effect: parameter
        decides: ha_lapse_cut
        bindings: [ha_lapsed_offers, ha_lapse_cut]
        ladder:
          - when: "two or more offers on the account dated in the twelve-month span expired unaccepted"
            value: "K('cut_many_lapses')"
          - when: "exactly one such offer expired unaccepted"
            value: "K('cut_one_lapse')"
          - when: "otherwise"
            value: "0"
        baseline:
          ha_lapse_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ha_recent_hold
        effect: parameter
        decides: ha_hold_allow
        bindings: [ha_hold_ended, ha_days_since_hold, ha_hold_allow]
        ladder:
          - when: "the qualifying hold is still active or ended no more than 45 days before acceptance"
            value: "K('allow_recent_hold')"
          - when: "it ended more than 45 but no more than 120 days before acceptance"
            value: "K('allow_window_hold')"
          - when: "otherwise"
            value: "0"
        baseline:
          ha_hold_allow: "0"
        evidence: [cross_category, date]
        cross_difficulty: hardship
    baseline:
      rule: >-
        The offered Hardship Settlement window is the number of calendar days from the offer date of that open offer
        to the first payment due date written on it, never more than 30 days.
        The Hardship Settlement signing window is the offered Hardship Settlement window, never less than one day.
        On electronic acceptance the first settlement payment falls due that many calendar days after the acceptance
        date, each later payment falls due the offer's payment interval after the one before it, and the offer's
        settlement amount is booked to the settlement once, on the acceptance date.
      params: [max_first_window_days, min_window_days]
    inputs:
      history:
        - {table: settlement_agreements, aggregate: count, field: settlement_id, within_months: 12, filters: {status: expired}}
        - {table: settlement_agreements, aggregate: latest, field: first_payment_due_date, filters: {status: offered}}
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: account_payment_returned}}
      cross_category: [account, hardship]

  - id: settle_ext_hardship_extension
    base_policy_refs: [settle_evt_payments]
    overwrite: []
    trigger: on_request
    subject: [settle_due_date_extended]
    computes: extension_days
    target_tool: extend_hardship_settlement_due_dates_12bdc2d4
    params:
      standard_grant: 5
      max_extension_days: 15
      min_days: 1
      allow_hold_many_ext: 4
      allow_hold_one_ext: 2
      size_small_usd: 500.0
      size_large_usd: 1500.0
      allow_size_large: 3
      allow_size_mid: 2
      window_long_days: 21
      window_mid_days: 14
      allow_window_short: 4
      allow_window_mid: 2
      allow_cert: 2
      allow_income: 1
      record_many: 3
      allow_record_many: 2
      allow_record_some: 1
    rule: >-
      This rule fixes the Hardship Settlement extension days, the calendar days that one due-date extension adds to
      the next unpaid payment and every later payment of an accepted Hardship Settlement that is not in default and
      has used fewer than its two allowed extensions; extensions on any other programme are outside this rule.
      Hardship Settlement extension days are granted only once the settlement shows status accepted with its acceptance date and first payment due date on record.
      The Hardship Settlement extension days are a standard grant of 5 calendar days, never fewer than one day and
      never more than the programme's extension maximum of 15 calendar days.
      The extension adds those days to the settlement's extension days total and to its final payment due date, so
      every unpaid payment falls due that many days later.
      Where the consumer's qualifying hardship hold on the account was extended two or more times, the Hardship
      Settlement hold-extension allowance of 4 days is added; where it was extended exactly once, the hold-extension
      allowance is 2 days; a hold that was never extended earns no hold-extension allowance.
      Where the settlement amount booked to the Hardship Settlement on acceptance is 1,500.00 dollars or more, the
      Hardship Settlement size allowance of 3 days is added; where it is at least 500.00 dollars but under 1,500.00
      dollars, the size allowance is 2 days; a booked amount under 500.00 dollars earns no size allowance.
      Where the Hardship Settlement signing window, the days from its acceptance date to its first payment due date,
      is under 14 days, the Hardship Settlement short-window allowance of 4 days is added; where that window is at
      least 14 days but under 21 days, the short-window allowance is 2 days; a signing window of 21 days or more
      earns no short-window allowance.
      Where a medical or disability certification was received for the consumer's hardship hold on the account, the
      Hardship Settlement documentation allowance of 2 days is added; where income loss evidence and no such
      certification was received for that hold, the documentation allowance is 1 day; a hold with neither earns no
      documentation allowance.
      Every consumer payment posted to the account counts toward the Hardship Settlement payment record, a payment
      that was later returned included; where three or more have been posted, the payment-record allowance of 2 days
      is added; where one or two have been posted, the payment-record allowance is 1 day; an account with no posted
      consumer payment earns no payment-record allowance.
      The Hardship Settlement payment-channel convention decides on which day the extended first payment falls:
      where the most recent consumer payment posted to the account, a payment later returned included, came by ACH
      bank debit, an extended due date that falls on a Saturday or a Sunday is moved back to the Friday before it;
      where it came by mailed check or money order, an extended due date that falls on a Saturday or a Sunday is
      moved forward to the Monday after it; where it came by any other channel, or no consumer payment is posted,
      the extended due date stands whatever day of the week it falls on.
      The Hardship Settlement extension days are worked out in this order: first the hold-extension, size,
      short-window, documentation and payment-record allowances are added together and added to the standard grant
      once, and the result is held between one day and the programme's extension maximum of 15 calendar days; only
      then is the payment-channel convention applied to the extended due date, and the days it gives are again held
      between one day and 15 calendar days.
    prerequisite:
      - problem: settle_ext_hardship_esign_acceptance
        kind: value_input
        gate: hx_signing_window
        form: state
        policy_source: >-
          Hardship Settlement extension days are granted only once the settlement shows status accepted with its acceptance date and first payment due date on record.
        condition: >-
          The account shows a settlement with variant Hardship Settlement and status accepted carrying an accepted date and a first payment due date counted from that acceptance.
        resolved_by: sign_settlement_offer_electronically_52f226cb
        effect: >-
          The accepted Hardship Settlement supplies the acceptance date, the first payment due date and the booked settlement amount, so the signing window, the size tier and the extended due date take their values from that acceptance.
    cross_category:
      - category: hardship
        as: history
        reads: [extension_count, hardship_hold_events.event_type, hardship_hold_events.document_type]
        note: The hold's extension count and the documentation received decide the hold-extension and documentation allowances.
      - category: account
        as: history
        reads: [account_transactions.event_type, account_transactions.payment_channel, account_transactions.txn_date]
        note: The consumer payments posted to the account decide the payment-record allowance and the channel of the most recent one decides the payment-channel convention.
    compute:
      - hx_accepted_on: "LATEST('settlement_agreements','accepted_date', date_field='offer_date', status='accepted', variant_name='Hardship Settlement')"
      - hx_first_due: "LATEST('settlement_agreements','first_payment_due_date', date_field='offer_date', status='accepted', variant_name='Hardship Settlement')"
      - hx_prior_extension_days: "LATEST('settlement_agreements','extension_days_total', date_field='offer_date', status='accepted', variant_name='Hardship Settlement')"
      - hx_hold_extensions: "CFIELD('hardship','extension_count', account_id=HID)"
      - hx_hold_ext_allow: "K('allow_hold_many_ext') if hx_hold_extensions >= 2 else (K('allow_hold_one_ext') if hx_hold_extensions == 1 else 0)"
      - hx_booked: "SUM('settlement_payments','amount', event_type='settle_amount_scheduled')"
      - hx_size_allow: "K('allow_size_large') if hx_booked >= K('size_large_usd') else (K('allow_size_mid') if hx_booked >= K('size_small_usd') else 0)"
      - hx_signing_window: "DAYS(hx_accepted_on, hx_first_due)"
      - hx_window_allow: "K('allow_window_short') if hx_signing_window < K('window_mid_days') else (K('allow_window_mid') if hx_signing_window < K('window_long_days') else 0)"
      - hx_cert_docs: "XCOUNT('hardship','hardship_hold_events', event_type='hardship_documentation_received', document_type='medical_or_disability_certification', account_id=HID)"
      - hx_income_docs: "XCOUNT('hardship','hardship_hold_events', event_type='hardship_documentation_received', document_type='income_loss_evidence', account_id=HID)"
      - hx_docs_allow: "K('allow_cert') if hx_cert_docs >= 1 else (K('allow_income') if hx_income_docs >= 1 else 0)"
      - hx_payments_posted: "XCOUNT('account','account_transactions', event_type='account_payment_posted', account_id=HID)"
      - hx_record_allow: "K('allow_record_many') if hx_payments_posted >= K('record_many') else (K('allow_record_some') if hx_payments_posted >= 1 else 0)"
      - hx_granted_days: "MN(K('max_extension_days'), MX(K('min_days'), K('standard_grant') + (hx_hold_ext_allow + hx_size_allow + hx_window_allow + hx_docs_allow + hx_record_allow)))"
      - hx_last_channel: "XLATEST('account','account_transactions','payment_channel', date_field='txn_date', event_type='account_payment_posted', account_id=HID)"
      - hx_extended_weekday: "(DAYS('2024-01-01', hx_first_due) + hx_prior_extension_days + hx_granted_days) % 7"
      - hx_channel_convention: "(hx_granted_days - (hx_extended_weekday - 4) if hx_extended_weekday >= 5 else hx_granted_days) if hx_last_channel == 'ach_bank_debit' else ((hx_granted_days + (7 - hx_extended_weekday) if hx_extended_weekday >= 5 else hx_granted_days) if (hx_last_channel == 'check_by_mail' or hx_last_channel == 'money_order') else hx_granted_days)"
      - result: "MN(K('max_extension_days'), MX(K('min_days'), hx_channel_convention))"
    compute_basis:
      hx_accepted_on: "Hardship Settlement extension days are granted only once the settlement shows status accepted with its acceptance date and first payment due date on record."
      hx_first_due: "Hardship Settlement extension days are granted only once the settlement shows status accepted with its acceptance date and first payment due date on record."
      hx_prior_extension_days: "The extension adds those days to the settlement's extension days total and to its final payment due date, so every unpaid payment falls due that many days later."
      hx_hold_extensions: "Where the consumer's qualifying hardship hold on the account was extended two or more times"
      hx_hold_ext_allow: "Where the consumer's qualifying hardship hold on the account was extended two or more times, the Hardship Settlement hold-extension allowance of 4 days is added; where it was extended exactly once, the hold-extension allowance is 2 days; a hold that was never extended earns no hold-extension allowance."
      hx_booked: "Where the settlement amount booked to the Hardship Settlement on acceptance is 1,500.00 dollars or more"
      hx_size_allow: "Where the settlement amount booked to the Hardship Settlement on acceptance is 1,500.00 dollars or more, the Hardship Settlement size allowance of 3 days is added; where it is at least 500.00 dollars but under 1,500.00 dollars, the size allowance is 2 days; a booked amount under 500.00 dollars earns no size allowance."
      hx_signing_window: "the Hardship Settlement signing window, the days from its acceptance date to its first payment due date"
      hx_window_allow: "Where the Hardship Settlement signing window, the days from its acceptance date to its first payment due date, is under 14 days, the Hardship Settlement short-window allowance of 4 days is added; where that window is at least 14 days but under 21 days, the short-window allowance is 2 days; a signing window of 21 days or more earns no short-window allowance."
      hx_cert_docs: "Where a medical or disability certification was received for the consumer's hardship hold on the account"
      hx_income_docs: "where income loss evidence and no such certification was received for that hold"
      hx_docs_allow: "Where a medical or disability certification was received for the consumer's hardship hold on the account, the Hardship Settlement documentation allowance of 2 days is added; where income loss evidence and no such certification was received for that hold, the documentation allowance is 1 day; a hold with neither earns no documentation allowance."
      hx_payments_posted: "Every consumer payment posted to the account counts toward the Hardship Settlement payment record, a payment that was later returned included"
      hx_record_allow: "where three or more have been posted, the payment-record allowance of 2 days is added; where one or two have been posted, the payment-record allowance is 1 day; an account with no posted consumer payment earns no payment-record allowance."
      hx_granted_days: "first the hold-extension, size, short-window, documentation and payment-record allowances are added together and added to the standard grant once, and the result is held between one day and the programme's extension maximum of 15 calendar days"
      hx_last_channel: "where the most recent consumer payment posted to the account, a payment later returned included, came by ACH bank debit"
      hx_extended_weekday: "an extended due date that falls on a Saturday or a Sunday"
      hx_channel_convention: "The Hardship Settlement payment-channel convention decides on which day the extended first payment falls: where the most recent consumer payment posted to the account, a payment later returned included, came by ACH bank debit, an extended due date that falls on a Saturday or a Sunday is moved back to the Friday before it; where it came by mailed check or money order, an extended due date that falls on a Saturday or a Sunday is moved forward to the Monday after it; where it came by any other channel, or no consumer payment is posted, the extended due date stands whatever day of the week it falls on."
      result: "only then is the payment-channel convention applied to the extended due date, and the days it gives are again held between one day and 15 calendar days."
    factors:
      - id: hx_payment_channel_convention
        effect: method
        decides: hx_channel_convention
        bindings: [hx_last_channel, hx_extended_weekday, hx_channel_convention]
        ladder:
          - when: "the most recent consumer payment posted to the account came by ACH bank debit"
            method: "an extended due date on a Saturday or Sunday is moved back to the Friday before it"
          - when: "it came by mailed check or money order"
            method: "an extended due date on a Saturday or Sunday is moved forward to the Monday after it"
          - when: "otherwise"
            method: "the extended due date stands whatever weekday it falls on"
        baseline:
          hx_channel_convention: "hx_granted_days"
        evidence: [cross_category, history, date]
        cross_difficulty: account
      - id: hx_hold_extension_history
        effect: parameter
        decides: hx_hold_ext_allow
        bindings: [hx_hold_extensions, hx_hold_ext_allow]
        ladder:
          - when: "the qualifying hardship hold was extended two or more times"
            value: "K('allow_hold_many_ext')"
          - when: "the hold was extended exactly once"
            value: "K('allow_hold_one_ext')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_hold_ext_allow: "0"
        evidence: [cross_category]
        cross_difficulty: hardship
      - id: hx_settlement_size
        effect: parameter
        decides: hx_size_allow
        bindings: [hx_booked, hx_size_allow]
        ladder:
          - when: "the amount booked on acceptance is 1,500.00 dollars or more"
            value: "K('allow_size_large')"
          - when: "it is at least 500.00 dollars but under 1,500.00 dollars"
            value: "K('allow_size_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_size_allow: "0"
        evidence: [history]
        cross_difficulty: null
      - id: hx_signing_window_length
        effect: parameter
        decides: hx_window_allow
        bindings: [hx_signing_window, hx_window_allow]
        ladder:
          - when: "the signing window is under 14 days"
            value: "K('allow_window_short')"
          - when: "the signing window is at least 14 days but under 21 days"
            value: "K('allow_window_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_window_allow: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: hx_hold_documentation
        effect: parameter
        decides: hx_docs_allow
        bindings: [hx_cert_docs, hx_income_docs, hx_docs_allow]
        ladder:
          - when: "a medical or disability certification was received for the hold"
            value: "K('allow_cert')"
          - when: "income loss evidence and no such certification was received"
            value: "K('allow_income')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_docs_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: hardship
      - id: hx_payment_record
        effect: parameter
        decides: hx_record_allow
        bindings: [hx_payments_posted, hx_record_allow]
        ladder:
          - when: "three or more consumer payments have been posted to the account, returned ones included"
            value: "K('allow_record_many')"
          - when: "one or two have been posted"
            value: "K('allow_record_some')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_record_allow: "0"
        evidence: [cross_category, history]
        cross_difficulty: account
    baseline:
      rule: >-
        The Hardship Settlement extension days are a standard grant of 5 calendar days, never fewer than one day and
        never more than the programme's extension maximum of 15 calendar days.
        The extension adds those days to the settlement's extension days total and to its final payment due date, so
        every unpaid payment falls due that many days later.
      params: [standard_grant, max_extension_days, min_days]
    inputs:
      history:
        - {table: settlement_payments, aggregate: sum, field: amount, filters: {event_type: settle_amount_scheduled}}
        - {table: settlement_agreements, aggregate: latest, field: first_payment_due_date, filters: {status: accepted}}
        - {category: hardship, table: hardship_hold_events, aggregate: count, field: hold_event_id, filters: {event_type: hardship_documentation_received}}
        - {category: account, table: account_transactions, aggregate: count, field: txn_id, filters: {event_type: account_payment_posted}}
        - {category: account, table: account_transactions, aggregate: latest, field: payment_channel, filters: {event_type: account_payment_posted}}
      cross_category: [hardship, account]
