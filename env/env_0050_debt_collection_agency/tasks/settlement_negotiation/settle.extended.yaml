# Settlement Agreements — offers to resolve one placed account for less than its full balance.
# One holding = one settlement offer on one placed account, from the written offer through
# acceptance, payment and fulfillment. Tiers are the settlement programmes, from the early-out
# prompt-pay discount to the hardship settlement; the authority floor is a tier x stage matrix.

category: settle
display_name: Settlement Agreements

binding:
  holding_table: settlement_agreements
  event_tables: [settlement_payments]
  intake_tables: [settlement_approval_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {settlement_balance: settlement_balance}

lifecycle:
  states: [offered, accepted, fulfilled, expired, withdrawn, defaulted]
  transitions:
    - {from: offered, to: accepted, by: user, means: The consumer accepts the written settlement offer before it expires.}
    - {from: offered, to: expired, by: system, means: The offer passes its expiry date without acceptance.}
    - {from: offered, to: withdrawn, by: agent, means: Ridgeline withdraws an open offer because the account can no longer be settled on those terms.}
    - {from: accepted, to: fulfilled, by: system, means: Every settlement payment has been received and the final payment has cleared.}
    - {from: accepted, to: defaulted, by: system, means: A settlement payment is not made by the end of its grace and any extension.}
    - {from: accepted, to: withdrawn, by: agent, means: Ridgeline withdraws an accepted settlement because the account was disputed, returned or became protected.}

accounts:
  - key: settlement_balance
    unit: USD
    meaning: The amount still to be paid under an accepted settlement — the settlement amount less settlement payments received, plus payments returned, less any remainder released on default or withdrawal.

parameter_schema:
  payment_count_max: Largest number of settlement payments this programme allows, integer.
  payment_count_min: Smallest number of settlement payments this programme allows, integer.
  offer_validity_days: Calendar days after the offer date during which the consumer may accept.
  first_payment_max_days_after_acceptance: Calendar days after acceptance within which the first settlement payment must fall due.
  max_days_between_payments: Largest interval in calendar days between consecutive settlement payments; 0 for single-payment programmes.
  settlement_window_max_days: Calendar days after acceptance within which the final settlement payment must fall due.
  prompt_pay_discount_pct: Discount from the balance offered for prompt payment in full, percent; 0.0 for programmes that are not prompt-pay.
  min_first_payment_pct: Smallest first payment as a percentage of the settlement amount.
  min_settlement_amount_usd: Smallest settlement amount the programme will offer, USD.
  min_payment_amount_usd: Smallest single settlement payment, USD, except a final payment that clears the settlement.
  settlement_rounding_unit_usd: Unit to which the settlement amount is rounded up, USD.
  grace_days_per_payment: Calendar days after a settlement payment's due date before it is unpaid for default purposes.
  partial_payment_tolerance_usd: Shortfall against a settlement payment below which the payment still counts as made, USD.
  returned_payment_replacement_days: Calendar days after a settlement payment is returned within which a replacement payment keeps the settlement in good standing.
  returned_payment_limit: Returned settlement payments after which the settlement defaults even if replaced, integer.
  due_date_extension_max_count: Due-date extensions allowed per accepted settlement, integer.
  due_date_extension_max_days: Largest number of calendar days one extension may add.
  reoffer_cooling_off_days: Calendar days after a settlement on the same account expired or defaulted before this programme may be offered again.
  max_offers_per_account_12_months: Settlement offers of any programme on one account in rolling 12 months at which this programme is no longer offered, integer.
  min_days_since_placement: Calendar days after the placement date before this programme may be offered.
  max_settlement_balance_usd: Largest balance at offer this programme may settle without client approval, USD.
  max_waiver_usd: Largest amount this programme may waive without client approval, USD.
  autopay_required: Whether settlement payments must be collected by automatic debit, boolean.
  card_payments_allowed: Whether settlement payments may be made by debit or credit card, boolean.
  cash_network_allowed: Whether settlement payments may be made through a retail cash payment network, boolean.
  verbal_acceptance_allowed: Whether the consumer may accept on a recorded call rather than by electronic signature or portal, boolean.
  offer_letter_email_allowed: Whether the written offer may be delivered by email, boolean.
  offer_letter_sla_business_days: Business days after the offer date within which the offer letter is sent.
  acceptance_letter_sla_business_days: Business days after acceptance within which the acceptance confirmation is sent.
  default_notice_sla_business_days: Business days after a default within which the default notice is sent.
  settlement_letter_before_first_payment: Whether the acceptance confirmation must be sent before the first settlement payment is taken, boolean.
  time_barred_disclosure_required: Whether letters on accounts past their statute-of-limitations date carry the time-barred disclosure, boolean.
  tax_notice_waiver_threshold_usd: Waived amount at or above which the acceptance confirmation carries the cancelled-debt tax notice, USD.
  bundle_floor_reduction_pct: Percentage points the floor is lowered when every open account under one client agreement is settled together; 0.0 means no bundle reduction.
  bundle_min_accounts: Smallest number of accounts in a qualifying bundle; 0 where bundles are not offered.
  client_response_due_business_days: Business days the client has to answer an approval request; 0 where approval requests are not available.
  approval_valid_days: Calendar days after a client approval within which the approved offer must be issued; 0 where approval requests are not available.
  approval_resubmission_max: Further approval requests allowed on one account after a decline in rolling 12 months, integer.
  declined_approval_cooling_off_days: Calendar days after a declined approval before another request on the account.
  settlement_payment_due_day_max: Latest day of the month a settlement payment after the first may fall due, integer.
  fulfillment_hold_business_days: Business days after the final settlement payment is received before the settlement is treated as fulfilled.
  authority_floor_pct_early_out: Lowest settlement percentage Ridgeline may offer on its own authority on an Early-Out Placement account; 100.0 means not offered at that stage.
  authority_floor_pct_primary: Lowest settlement percentage on its own authority on a Primary Placement account.
  authority_floor_pct_secondary: Lowest settlement percentage on its own authority on a Secondary Placement account.
  authority_floor_pct_tertiary: Lowest settlement percentage on its own authority on a Tertiary Placement account.
  authority_floor_pct_warehouse: Lowest settlement percentage on its own authority on a Warehouse Placement account.
  authority_floor_pct_legal_review: Lowest settlement percentage on its own authority on a Legal Review Placement account; 100.0 means not offered at that stage.
  approval_floor_pct_early_out: Lowest settlement percentage that may be offered even with client approval on an Early-Out Placement account.
  approval_floor_pct_primary: Lowest settlement percentage that may be offered even with client approval on a Primary Placement account.
  approval_floor_pct_secondary: Lowest settlement percentage that may be offered even with client approval on a Secondary Placement account.
  approval_floor_pct_tertiary: Lowest settlement percentage that may be offered even with client approval on a Tertiary Placement account.
  approval_floor_pct_warehouse: Lowest settlement percentage that may be offered even with client approval on a Warehouse Placement account.
  approval_floor_pct_legal_review: Lowest settlement percentage that may be offered even with client approval on a Legal Review Placement account.

