name: env_0051_self_storage_operator
company: Bluegate Self Storage

background: |
  Bluegate Self Storage is a national self-storage operator with 1,146 owned and managed facilities in 39 states, headquartered in
  Denver, Colorado, and served by a tenant care center in Denver and Phoenix that handles calls and chats for households and small
  businesses seven days a week in a plain, practical tone. Its core product is the month-to-month storage unit rental agreement, held
  per unit and billed monthly, in six unit classes: Bluegate Drive-Up Standard, Bluegate Interior Standard,
  Bluegate Climate Controlled, Bluegate Climate Plus, Bluegate Premier Climate Suite and Bluegate Wine & Collectibles Vault. Each unit
  agreement carries its own tenant ledger of rent, fees, payments and credits, and its own record of rent changes, transfers,
  delinquency steps and move-out notices. Many facilities also rent outdoor and covered parking under separate Vehicle, RV & Boat
  Parking Agreements, in the classes Bluegate Uncovered Car Space, Bluegate Uncovered RV & Boat Space (up to 30 ft), Bluegate Uncovered
  RV & Boat Space (31-45 ft), Bluegate Covered RV & Boat Space (up to 30 ft), Bluegate Covered RV & Boat Space (31-45 ft) and Bluegate
  Enclosed Vehicle Garage, each tied to one registered vehicle on file. Contents in a storage unit are protected through a Bluegate
  Tenant Protection Plan attached to that unit and billed monthly with its rent, offered at the $2,000, $3,000, $5,000, $7,500,
  $10,000 and $15,000 coverage levels, with fee, change and claim histories kept per plan. Tenants who prefer can instead keep their
  own homeowner's or renter's policy on file for a unit. Facilities with a truck lot rent the Bluegate Pickup Truck, Bluegate Cargo
  Van and the Bluegate 10 ft, 15 ft, 20 ft and 26 ft Moving Trucks for in-town moves, each rental a contract with its own charges,
  deposit hold and incident record, and new tenants often use one on move-in day. Unit and parking rent can be paid automatically
  through a Bluegate AutoPay authorization per agreement, set up as Debit Card, Credit Card, Personal Checking ACH, Personal Savings
  ACH, Business Checking ACH or Business Card, whose drafts, returns and notices are recorded per authorization. Tenants can also
  prepay rent for a fixed term with the Bluegate Prepaid Rent 3-, 6-, 9-, 12-, 18- and 24-Month Plans. Small-business tenants can
  join the Bluegate Business Essentials, Plus, Pro, Logistics, Fleet or National Account programs for consolidated invoicing,
  delivery acceptance and business-center services. Callers are mostly individuals between moves, downsizing, renovating or storing
  a boat or RV, plus contractors, online sellers and field-service companies with several units. A typical household holds one or two
  units with a protection plan and AutoPay, sometimes a parking space, and a past truck rental; a typical business holds several
  units and spaces under one business account. They call with months or years of history behind them: rent charges and payments,
  late fees and waivers, returned drafts, rent increase letters, unit transfers, protection claims, truck contracts and move-out
  notices.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: storage_unit_account_servicing
    claim:
      categories: [unit]
      event_types: [unit_rent_charge, unit_fee_charge, unit_payment, unit_payment_reversal, unit_credit, unit_delinquency_onset, unit_lien_step, unit_lien_stage_advance, unit_redemption, unit_lock_status_update, unit_rate_change_notice, unit_rent_rate_update, unit_transfer_completed, unit_unit_reassigned, unit_moveout_scheduled, unit_moveout_withdrawn, unit_vacated, unit_refund, unit_deposit_released]
    summary: >
      Storage unit tenants call about the money and the standing of one or more unit rental agreements: a rent charge or late fee they
      dispute, a payment they want to make while overlocked or after a lien letter, a returned payment, a rent increase letter, a move to
      a bigger or climate-controlled unit, or ending the agreement, and the same caller may hold several units in different classes,
      statuses and delinquency cycles, with a protection plan, AutoPay or a prepaid plan alongside. The governing records are the rental
      agreement (class, rent, billing day, balance, delinquent_since, lock status, last rate change), its ledger of charges, payments,
      credits and reversals, its lien steps, rate change notices, transfers, move-out notices and the facility inventory of available
      units, and the rules are class-dependent: late fees and their grace period and second fee (unit_evt_late_fee), courtesy waivers
      against a rolling allowance and tenure versus billing-error corrections (unit_evt_courtesy_waiver, unit_evt_billing_correction),
      the lien schedule counted from the oldest unpaid due date with its holds (unit_evt_lien_process), payment acceptance and
      redemption once a lien notice exists (unit_evt_payment_acceptance), allocation across several units (unit_agg_payment_allocation),
      existing-customer increases, prepaid rate locks and retention concessions (unit_evt_rate_increase), transfers that need the
      rental current, an available target and enough coverage (unit_evt_transfer, unit_coverage_requirement) and the move-out notice,
      proration and deposit rules (unit_evt_moveout). In the natural course of the business rent falls due on the anniversary day,
      unpaid rent turns into late fees and then into overlock, lien notice and sale advertisement steps, and an agreement that is
      brought current, transferred or ended changes the standing that every later request is judged against. The agent posts the
      ledger entries, credits, lien steps, rent updates, transfers and vacate records that the rules allow after verifying the caller,
      while giving or withdrawing a move-out notice and authorizing a payment from the tenant's own funds are the tenant's own acts, taken
      by the tenant through the hand-over tools. Requests that no rule decides, such as releasing a sold unit's contents, negotiating a
      lien-sale surplus, a hardship payment arrangement meant to stop the lien schedule, pausing rent during a hospital stay, or
      a dispute over goods damaged by the company, go to a human representative as POLICY_NOT_COVERED.

  - name: parking_rate_increase_and_compliance
    claim:
      categories: [parking]
      event_types: [parking_rate_change_notice, parking_rent_rate_update, parking_vehicle_update, parking_fee_charge, parking_credit, parking_payment, parking_notice, parking_stage_advance, parking_compliance_cured, parking_moveout_scheduled, parking_moveout_withdrawn, parking_vacated, parking_refund]
    summary: >
      Vehicle, RV and boat parking tenants call when a rent increase letter arrives, when they want a concession or think the increase
      breaks the rules, when their registration or insurance on file has lapsed and a compliance or termination notice followed, when
      they swap in a different vehicle, or when they want to leave, and a caller may hold several spaces of different classes, tenures
      and prepaid status. The records involved are the parking agreement (class, start date, rent, last rent change, vehicle details and
      expiry dates), its rate change notices with the street rate and tenure at notice, its notices and ledger, the facility inventory,
      any prepaid rent plan on the agreement and the customer's military status, and the rules turn on per-class numbers: the first and
      repeat increase waits, the standard and loyalty caps and the street-rate ceiling, notice days and the prepaid rate lock, with
      defective increases rescinded (parking_evt_rate_increase), retention concessions limited by window, tenure and a rolling count
      (parking_evt_retention_concession), vehicle fit and swap limits (parking_evt_vehicle_fit), the compliance cure and termination
      sequence (parking_evt_compliance), late fees and waivers (parking_evt_late_fee_and_waiver), the tow process
      (parking_evt_tow_process) and move-out (parking_evt_moveout), with agreements reviewed one by one (parking_agg_portfolio_increase_review).
      In the natural course of an agreement increases are noticed and later take effect on a due date, compliance problems are noticed,
      cured or escalated to termination, and rent left unpaid leads to a gate lockout and a tow notice. The agent records rent changes,
      concessions, rescissions, vehicle details the tenant reads off a document, notices, fees and credits as the rules allow, while
      ending the agreement or withdrawing that notice is the tenant's own decision taken through a hand-over tool. Situations the rules do
      not decide, such as releasing a towed vehicle from the towing company, reimbursing tow charges, a tow against an active-duty
      tenant, or a dispute about damage to a parked vehicle, go to a human representative as POLICY_NOT_COVERED.

  - name: tenant_protection_claims
    claim:
      categories: [protect]
      event_types: [protect_claim_document_request, protect_claim_assessment, protect_claim_decision, protect_claim_payment, protect_claim_payment_voided, protect_coverage_change, protect_plan_terms_update, protect_premium_credit, protect_cancellation, protect_reinstatement]
    summary: >
      Tenants call after a break-in, a roof leak, a fire or a climate-control failure to file or follow up a protection claim, to ask why
      a claim was paid less than they claimed or denied, to raise or lower coverage, or to cancel protection in favour of their own
      insurance, and a caller may have several units with plans at different levels, a plan whose level changed around the loss date,
      a lapsed or reinstated plan, or earlier paid claims within the year. The records are the plan (level, effective, change, lapse,
      cancellation and termination dates), its change history and fee entries, the claim as filed (loss and discovery dates, peril,
      police report, forced-entry evidence, facility work order, documents on file) and its handling events (document requests,
      adjuster assessments, decisions, payments, voids), alongside the covered unit agreement and its class minimum. The rules are
      per-level: coverage in force on the loss date, covered and excluded perils, filing and police-report deadlines and document
      requirements (protect_evt_claim_eligibility), payment on assessed actual cash value with class sublimits and a deductible from the
      level in force on the loss date (protect_evt_claim_settlement), the rolling aggregate and claim count (protect_agg_annual_aggregate),
      reconsideration (protect_evt_reconsideration), voids (protect_evt_claim_payment_void), coverage changes with waiting days and unit
      minimums (protect_evt_coverage_change), fee credits and free-look refunds (protect_evt_fee_billing), lapse and reinstatement
      (protect_evt_lapse_reinstatement) and cancellation with proof of insurance (protect_evt_cancellation). In the natural course of a
      claim it is filed, documents are requested, the adjuster assesses it, it is decided and then paid or voided, while the plan itself
      may have changed level, lapsed or been reinstated before the loss. The agent records document requests, decisions, payments, voids,
      level changes and fee credits that the rules support, while filing the claim itself and asking to cancel protection are the
      tenant's own acts taken through hand-over tools. Disagreements the rules do not settle, such as contesting the adjuster's valuation
      without a new document, a loss blamed on company negligence, property of someone outside the household, or a request to pay a
      claim beyond the limits, go to a human representative as POLICY_NOT_COVERED.

  - name: moving_truck_rentals
    claim:
      categories: [truck]
      event_types: [truck_reservation, truck_reservation_change, truck_reservation_cancelled, truck_charge, truck_credit, truck_payment, truck_refund, truck_deposit_release, truck_damage_report]
    summary: >
      Renters call to book a truck or van for a move, to change or cancel a reservation, to claim or ask about the free move-in truck
      that comes with a new storage unit, to extend a rental, or to question a final invoice for mileage, fuel, late return, cleaning,
      damage or a no-show, and a caller may have a reserved unit and a truck booked around the same move-in, an earlier contract still
      unsettled, or a second unit moving in later. The records are the truck contract (class, facility, scheduled and actual pickup and
      return times, odometer and fuel readings, waiver, deposit card, return condition, linked unit rental, balance and hold), its
      charges, credits, payments and holds, its incidents, the linked storage unit agreement and the customer's date of birth. The rules
      are per vehicle class: base rate per rental period, mileage, fuel and the environmental fee (truck_evt_pricing), the free move-in
      benefit with its class eligibility, unit status, window around move-in and once-per-unit limit (truck_evt_free_move_in,
      truck_agg_free_move_in_once), late returns by elapsed hours (truck_evt_late_return), free and late cancellation and no-shows
      (truck_evt_cancellation_no_show), damage under no, basic or premium waiver with exclusions (truck_evt_damage), extensions
      (truck_evt_changes_extensions), breakdown credits and corrections (truck_evt_breakdown_and_corrections), deposit holds and
      settlement (truck_evt_deposit_and_settlement), the open-contract limit (truck_agg_multi_holding) and driver requirements
      (truck_evt_driver_requirements). In the natural course of a contract it is reserved, picked up, returned and settled, and the unit
      it may be linked to has its own move-in that the benefit depends on. The agent creates and changes reservations and posts charges,
      credits, refunds, releases and incident records as the rules allow, while signing the contract at pickup and cancelling a
      reservation are the renter's own acts taken through hand-over tools. Requests no rule decides, such as renting a trailer or auto transport, reimbursement for a moving helper or for personal property damaged in the truck, or liability for a third party in an
      accident, go to a human representative as POLICY_NOT_COVERED.

  - name: autopay_authorization_changes
    claim:
      categories: [autopay]
      event_types: [autopay_enrollment, autopay_cancellation, autopay_method_update, autopay_reinstatement, autopay_replacement, autopay_suspension, autopay_draft, autopay_notice]
    summary: >
      Tenants call to set up AutoPay on a unit or parking agreement, to move it from a card to a bank account or back, to update an
      expiring or replaced card, to stop AutoPay before the next draft, to restart it after it was suspended, or to ask why a draft did
      not run, ran for a different amount, or was returned, and a caller may have several agreements with different methods,
      authorizations replaced or suspended in the past, and prepaid plans that pause drafting. The records are the authorization
      (method, agreement, status, verification and next draft due dates, card details, suspension and end details), its drafts, retries
      and returns, its notices, the covered agreement's status and balance, and the customer's profile type and name. The rules are
      per method: who may authorize and with which account (autopay_evt_enrollment_verification), one authorization per agreement with
      replacement at the cutoff (autopay_agg_multi_holding, autopay_agg_one_draft_per_agreement), draft timing, cap and full-balance
      basis (autopay_evt_draft_amount_timing), the varying-amount notice for personal bank accounts (autopay_evt_varying_amount_notice),
      retries, re-presentments and suspension after consecutive failures or specific codes (autopay_evt_retry_and_suspension), return
      windows (autopay_evt_returns), revocation cutoffs, same-method updates and reinstatement windows
      (autopay_evt_changes_and_cancellation) and expiry reminders (autopay_evt_expiry_reminders). In the natural course of an
      authorization it is set up and verified, drafts run on each due date and sometimes fail, are retried or returned, and an
      authorization can be suspended, replaced or revoked, with each outcome feeding the agreement's own ledger. The agent records
      method updates, notices and draft outcomes as the rules allow, while giving, revoking and re-giving an authorization over the
      tenant's own card or bank account are the tenant's own acts taken through hand-over tools. Requests no rule decides, such as
      refunding a settled draft the tenant now disputes as unauthorized, splitting one draft across two methods, or a payment plan that
      spreads past-due rent over several drafts, go to a human representative as POLICY_NOT_COVERED.
