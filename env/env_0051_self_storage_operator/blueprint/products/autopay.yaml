# Policy charter: Bluegate AutoPay recurring payment authorizations.
category: autopay
display_name: Bluegate AutoPay Authorization

binding:
  holding_table: autopay_enrollments
  event_tables: [autopay_drafts, autopay_notices]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_verification, active, suspended, cancelled, replaced]
  transitions:
    - {from: pending_verification, to: active, by: system, means: "The payment method is verified and AutoPay starts drafting."}
    - {from: pending_verification, to: cancelled, by: system, means: "Verification fails or is not completed inside the verification window."}
    - {from: pending_verification, to: cancelled, by: user, means: "The tenant withdraws the authorization before it is verified."}
    - {from: active, to: suspended, by: system, means: "Drafting stops after repeated failed drafts or a return that ends the authorization's usability."}
    - {from: suspended, to: active, by: user, means: "The tenant re-authorizes the same payment method after the cause of the suspension is fixed."}
    - {from: active, to: cancelled, by: user, means: "The tenant revokes the AutoPay authorization."}
    - {from: suspended, to: cancelled, by: user, means: "The tenant revokes a suspended authorization."}
    - {from: active, to: replaced, by: system, means: "A new authorization on the same agreement is verified and takes over drafting."}
    - {from: suspended, to: replaced, by: system, means: "A new authorization on the same agreement is verified and takes over from a suspended one."}

accounts: []

parameter_schema:
  payment_rail: "Payment network the drafts run on, enum string."
  ach_sec_code: "NACHA standard entry class used for web and phone authorizations of this method; none for cards, enum string."
  phone_authorization_allowed: "Whether the authorization can be taken by recorded phone call at the care center, boolean."
  phone_authorization_sec_code: "NACHA entry class for a phone-taken ACH authorization; none for cards, enum string."
  authorization_copy_delivery: "How the tenant receives a copy of the authorization, enum string."
  verification_method: "How the payment method is verified before drafting, enum string."
  verification_window_days: "Calendar days after enrollment within which verification must be completed, integer."
  micro_deposit_attempts_allowed: "Wrong micro-deposit amount entries allowed before verification fails, integer."
  customer_type_required: "Customer profile type that may use this method, enum string."
  account_holder_must_match: "Whose name the card or bank account must be in, enum string."
  accepted_card_networks: "Card networks accepted, list of enum strings (empty for bank accounts)."
  prepaid_cards_accepted: "Whether prepaid or gift cards are accepted, boolean."
  hsa_fsa_cards_accepted: "Whether HSA or FSA cards are accepted, boolean."
  covered_agreement_kinds: "Kinds of agreement this method can draft for, list of enum strings."
  max_agreements_per_enrollment: "Agreements one authorization covers, integer."
  draft_timing: "When the draft runs relative to the rent due date, enum string."
  draft_days_before_due: "Calendar days before the due date the draft runs, integer (0 = on the due date)."
  enrollment_cutoff_days_before_due: "Calendar days before a due date by which the method must be verified for that period to be drafted, integer."
  cancel_cutoff_days_before_due: "Calendar days before a due date by which a revocation stops that period's draft, integer."
  draft_amount_basis: "What the draft collects, enum string."
  draft_cap_usd: "Largest amount drafted without the tenant's express approval; a larger balance is not drafted, USD."
  over_cap_handling: "What happens when the balance exceeds the draft cap, enum string."
  partial_draft_allowed: "Whether a draft may collect less than the amount basis, boolean."
  skip_a_month_allowed: "Whether a tenant may skip one period's draft while staying enrolled, boolean."
  varying_amount_notice_days: "Calendar days before the draft date that the tenant must be told of an amount different from the last draft, integer (0 = no notice rule)."
  retry_on_decline: "Whether a declined card draft is retried, boolean."
  retry_interval_days: "Calendar days between a failed draft and its retry, integer."
  max_retries_per_draft: "Retries after the first attempt for one due date, integer."
  ach_represent_on_nsf: "Whether an ACH draft returned for insufficient or uncollected funds is presented again, boolean."
  max_represents_per_entry: "Times one returned ACH entry may be presented again, integer."
  consecutive_failures_to_suspend: "Consecutive due dates with no successful draft after which AutoPay is suspended, integer."
  immediate_suspend_return_codes: "ACH return codes or card decline reasons that suspend AutoPay at once, list of enum strings."
  unauthorized_return_codes: "Return codes that mean the tenant disputes authorizing the draft, list of enum strings."
  return_window_banking_days: "Banking days after settlement within which an ordinary ACH return may arrive, integer (0 for cards)."
  unauthorized_return_window_days: "Calendar days after settlement within which an unauthorized-debit return may arrive, integer (0 for cards)."
  chargeback_window_days: "Calendar days after a card draft within which a chargeback may arrive, integer (0 for bank accounts)."
  payment_posts_on: "When a successful draft is posted to the agreement ledger, enum string."
  account_updater_enabled: "Whether card number and expiry changes from the issuer are applied automatically, boolean."
  expiry_reminder_days_before: "Calendar days before card expiry that a reminder is sent, integer (0 for bank accounts)."
  same_method_update_allowed: "Whether a replacement card or corrected bank details of the same method can be updated on the existing authorization, boolean."
  method_change_requires_new_enrollment: "Whether switching to a different method requires a new authorization, boolean."
  reinstatement_requires: "What a suspended authorization needs to be reinstated, enum string."
  reinstatement_window_days: "Calendar days after suspension within which reinstatement is possible; after that a new enrollment is needed, integer."
  failure_notice_channels: "How the tenant is told of a failed draft, list of enum strings."
  confirmation_channels: "How the tenant is told of enrollment, changes and cancellation, list of enum strings."
  draft_time_of_day: "Time of day drafts are submitted, facility local time, enum string."
  business_days_calendar: "Banking calendar used for ACH settlement and return windows, enum string."
  max_enrollment_changes_per_12_months: "New authorizations a tenant may set up on one agreement in any rolling 365-day window, integer."

