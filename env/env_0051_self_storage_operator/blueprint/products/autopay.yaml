  - id: autopay_evt_expiry_reminders
    subject: [autopay_notice, autopay_method_update]
    rule: >-
      For card methods, a card_expiry_reminder is sent expiry_reminder_days_before the end of the expiry month printed on the card on file.
      Where account_updater_enabled is true and the issuer reports a new number or expiry, the authorization is updated without a new
      enrollment. A draft on an expired card is declined as declined_expired_card and counts as a failed due date. Bank account methods
      receive no expiry reminders. Failed-draft and suspension notices go by failure_notice_channels, and enrollment, change and cancellation
      confirmations by confirmation_channels.
