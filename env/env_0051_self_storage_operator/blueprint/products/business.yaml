# Policy charter: Bluegate Business Storage accounts (consolidated invoicing and business services for small-business tenants).
category: business
display_name: Bluegate Business Storage Account

binding:
  holding_table: business_accounts
  event_tables: [business_invoices, business_deliveries]
  status_field: status
  variant_field: variant_name
  quantity_fields: {invoice_balance: business_receivable}

lifecycle:
  states: [application_review, active, credit_hold, closed, declined]
  transitions:
    - {from: application_review, to: active, by: agent, means: "The application passes review and the account opens."}
    - {from: application_review, to: declined, by: agent, means: "The application does not meet the program requirements."}
    - {from: active, to: credit_hold, by: system, means: "An invoice stays unpaid past the credit-hold threshold."}
    - {from: credit_hold, to: active, by: system, means: "Every past-due invoice amount is paid."}
    - {from: active, to: closed, by: user, means: "The business closes its account."}
    - {from: credit_hold, to: closed, by: system, means: "The account is closed and referred to collections after the referral threshold."}

accounts:
  - key: business_receivable
    unit: USD
    meaning: "Amount the business owes on its account invoices: program fees and service charges increase it; payments and credits decrease it."

parameter_schema:
  monthly_program_fee_usd: "Monthly program fee invoiced to the account, USD."
  invoice_terms_days: "Calendar days after the invoice date by which an invoice must be paid, integer (0 = due on receipt)."
  consolidated_invoicing: "Whether all the business's unit and parking rents are billed on one monthly account invoice, boolean."
  multi_facility_billing: "Whether agreements at several facilities can be billed on one account, boolean."
  credit_limit_usd: "Largest unpaid invoice balance allowed before new services stop, USD."
  credit_review_required: "Whether a credit review is required at application, boolean."
  min_active_agreements: "Active storage or parking agreements the business must hold to keep the program, integer."
  max_authorized_users: "Employees who may hold gate access and act for the account, integer."
  authorized_user_add_fee_usd: "Fee per authorized user added after opening, USD."
  delivery_acceptance_included: "Whether the facility signs for parcels on the business's behalf, boolean."
  included_deliveries_per_month: "Parcel deliveries accepted per calendar month at no charge, integer."
  extra_delivery_fee_usd: "Fee per parcel accepted beyond the monthly allowance, USD."
  freight_pallet_acceptance: "Whether palletized freight is received, boolean."
  pallet_receiving_fee_usd: "Fee per pallet received, USD."
  max_parcel_weight_lbs: "Heaviest parcel accepted, pounds."
  package_hold_days: "Calendar days a received delivery is held free before storage fees, integer."
  package_storage_fee_per_day_usd: "Storage fee per day per delivery held past the free hold, USD."
  return_to_sender_after_days: "Calendar days after receipt after which an uncollected delivery is returned to sender, integer."
  signature_deliveries_accepted: "Whether deliveries needing a signature are accepted, boolean."
  hazmat_accepted: "Whether hazardous materials deliveries are accepted, boolean."
  perishables_accepted: "Whether perishable deliveries are accepted, boolean."
  forklift_service_included: "Whether forklift unloading by staff is offered, boolean."
  forklift_fee_per_hour_usd: "Fee per started hour of forklift service, USD."
  conference_room_hours_included: "Business center conference room hours included per calendar month, integer."
  conference_room_hourly_fee_usd: "Fee per hour of conference room use beyond the allowance, USD."
  wifi_access: "Whether business center Wi-Fi is included, boolean."
  loading_dock_access: "Whether the loading dock may be used, boolean."
  after_hours_access: "Whether authorized users have 24-hour gate access, boolean."
  rent_volume_discount_pct: "Discount on the monthly rent of each business-billed agreement, fraction."
  volume_discount_min_agreements: "Active agreements needed for the volume discount, integer."
  late_payment_fee_pct: "Late payment fee on the past-due invoice amount, fraction."
  late_payment_fee_min_usd: "Minimum late payment fee, USD."
  credit_hold_days_past_due: "Calendar days past the invoice due date at which the account goes on credit hold, integer."
  credit_hold_effects: "Services suspended while on credit hold, list of enum strings."
  collections_referral_days_past_due: "Calendar days past the invoice due date at which a credit-hold account is closed and referred to collections, integer."
  invoice_delivery: "How invoices are delivered, enum string."
  po_number_supported: "Whether a purchase-order number can be printed on invoices, boolean."
  tax_exempt_supported: "Whether a sales-tax exemption certificate can be applied, boolean."
  dispute_window_days: "Calendar days after the invoice date within which an invoice line may be disputed, integer."
  account_manager_assigned: "Whether a named account manager is assigned, boolean."
  net_terms_min_months: "Months of on-time payment before net terms are offered on review, integer."
  credit_limit_review_months: "Months between credit limit reviews, integer."
  closure_notice_days: "Calendar days of written notice to close the account, integer."
  closure_requires_zero_balance: "Whether the account balance must be paid before closure, boolean."
  closure_agreements_handling: "What happens to business-billed agreements on closure, enum string."
  mail_handling_included: "Whether letter mail is sorted into a secured mailbox, boolean."
  cart_and_dolly_access: "Whether flatbed carts and dollies may be used, boolean."
  application_documents: "Documents required to open the account, list of enum strings."

