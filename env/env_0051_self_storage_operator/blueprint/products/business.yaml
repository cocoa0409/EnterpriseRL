events:
  - type: business_application
    target: business_accounts
    mutation: create
    meaning: "A business tenant applies for a business storage account."
    grain: "One account record per application."
    fields:
      customer_id: "Business profile applying."
      variant_name: "Program applied for, official full name."
      application_date: "Date of application."
    triggers: []
  - type: business_approval
    target: business_accounts
    mutation: {transition: {from: application_review, to: active}}
    meaning: "The account is approved and opens."
    grain: "One transition per account."
    fields:
      approval_date: "Date approved."
      credit_limit: "Credit limit set, USD."
      invoice_terms_days: "Invoice terms set, days."
    triggers: []
  - type: business_decline
    target: business_accounts
    mutation: {transition: {from: application_review, to: declined}}
    meaning: "The application is declined."
    grain: "One transition per account."
    fields:
      closure_date: "Date of the decision."
    triggers: []
  - type: business_invoice_issued
    target: business_invoices
    meaning: "The monthly account invoice is issued with the program fee."
    grain: "One row per account per invoice month."
    distinguish_by: [invoice_month]
    fields:
      invoice_month: "Calendar month invoiced."
      amount: "Program fee invoiced, USD."
      entry_date: "Invoice date (first day of the month)."
    account: business_receivable
    direction: in
    triggers: []
  - type: business_service_charge
    target: business_invoices
    meaning: "A business service charge or late payment fee is added to the account."
    grain: "One row per service type per service date per source record."
    distinguish_by: [service_type, entry_date, reference_id]
    fields:
      service_type: "Kind of service charge."
      amount: "Charge, USD."
      entry_date: "Date of the service."
      quantity: "Units charged (parcels, pallets, days, hours, users)."
      reference_id: "Source record: the delivery for delivery charges, the invoice for a late payment fee; empty otherwise."
      invoice_month: "Invoice month the charge appears on."
    account: business_receivable
    direction: in
    triggers: []
  - type: business_invoice_payment
    target: business_invoices
    meaning: "A payment is received against account invoices."
    grain: "One row per payment."
    distinguish_by: [entry_date, amount, payment_method]
    fields:
      amount: "Amount paid, USD."
      entry_date: "Date received."
      payment_method: "How paid."
      invoice_month: "Oldest invoice month the payment is applied to first."
    account: business_receivable
    direction: out
    triggers: []
  - type: business_credit
    target: business_invoices
    meaning: "An invoice line is credited after a dispute or a billing error."
    grain: "One row per credit type per credited line."
    distinguish_by: [credit_type, reference_id]
    fields:
      credit_type: "Kind of credit."
      amount: "Credit, USD."
      entry_date: "Date credited."
      reference_id: "Invoice line credited."
    account: business_receivable
    direction: out
    triggers: []
  - type: business_delivery_event
    target: business_deliveries
    meaning: "A delivery is received for the business, collected by an authorized user, or returned to the sender."
    grain: "One row per delivery per action."
    distinguish_by: [tracking_number, delivery_action]
    fields:
      delivery_action: "What happened to the delivery."
      action_date: "Date of the action."
      carrier: "Delivering carrier."
      tracking_number: "Carrier tracking or pro number exactly as on the label."
      delivery_kind: "Parcel or pallet."
      pieces: "Pieces in the delivery."
      billable: "Whether this receipt is beyond the monthly allowance or otherwise chargeable."
    triggers:
      - event: business:business_service_charge
        when: {delivery_action: received, billable: true, delivery_kind: parcel}
        map: {service_type: extra_delivery}
      - event: business:business_service_charge
        when: {delivery_action: received, delivery_kind: pallet}
        map: {service_type: pallet_receiving}
  - type: business_credit_hold
    target: business_accounts
    mutation: {transition: {from: active, to: credit_hold}}
    meaning: "The account goes on credit hold for a past-due invoice."
    grain: "One transition per hold."
    fields:
      past_due_since: "Due date of the oldest unpaid invoice."
    triggers: []
  - type: business_credit_release
    target: business_accounts
    mutation: {transition: {from: credit_hold, to: active}}
    meaning: "The hold is lifted once every past-due amount is paid."
    grain: "One transition per hold."
    fields:
      past_due_since: "Cleared to empty."
    triggers: []
  - type: business_closure
    target: business_accounts
    mutation: {transition: [{from: active, to: closed}, {from: credit_hold, to: closed}]}
    meaning: "The account is closed by the business, or by the company after collections referral."
    grain: "One transition per account."
    fields:
      closure_date: "Date closed."
    triggers: []
  - type: business_terms_update
    target: business_accounts
    mutation: update
    meaning: "The account's credit limit, invoice terms or authorized user count is changed."
    grain: "One update per change."
    fields:
      credit_limit: "Credit limit, USD."
      invoice_terms_days: "Invoice terms, days."
      authorized_users_count: "Authorized users on the account."
    triggers: []

measures:
  - id: business_msr_deliveries_month
    window: "The calendar month of the delivery's receipt, per account."
    measure: "Count of business_delivery_event rows with delivery_action received and delivery_kind parcel in the month, in receipt order."
  - id: business_msr_active_agreements
    window: "Point in time: the handling date, per business profile."
    measure: "Count of the business's unit and parking agreements in active, delinquent or moving_out status."

policies:
  - id: business_agg_multi_holding
    subject: [business_application]
    rule: >-
      A business profile may hold one business storage account, which covers all of its agreements; a business that wants another
      program changes program on its existing account. Only a profile whose customer_type is business may apply.
    eligibility:
      - id: business_profile
        applies_to: [business_application]
        kind: authorization
        condition: "Only a profile whose customer_type is business may apply."
        evidence_fields: [customers.customer_type, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
    params:
      max_per_customer: 1

  - id: business_evt_application_review
    subject: [business_application, business_approval, business_decline]
    rule: >-
      An application needs the documents in application_documents and, where credit_review_required is true, a passed credit review. The
      business must hold at least min_active_agreements active agreements, counted by business_msr_active_agreements, on approval. An
      approval sets the program's credit_limit_usd and invoice_terms_days; an application that falls short is declined, and the business
      keeps its agreements on standard billing.
    eligibility:
      - id: enough_agreements
        applies_to: [business_approval]
        kind: authorization
        condition: "The business must hold at least min_active_agreements active agreements, counted by business_msr_active_agreements, on approval."
        evidence_fields: [unit_rentals.status, unit_rentals.customer_id, parking_rentals.status, parking_rentals.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.customer_id]]
          action_bindings: {unit_rentals.customer_id: customer_id}
    params:
      per_tier:
        Bluegate Business Essentials: {min_active_agreements: "=min_active_agreements", credit_limit_usd: "=credit_limit_usd", invoice_terms_days: "=invoice_terms_days"}
        Bluegate Business Plus: {min_active_agreements: "=min_active_agreements", credit_limit_usd: "=credit_limit_usd", invoice_terms_days: "=invoice_terms_days"}
        Bluegate Business Pro: {min_active_agreements: "=min_active_agreements", credit_limit_usd: "=credit_limit_usd", invoice_terms_days: "=invoice_terms_days"}
        Bluegate Business Logistics: {min_active_agreements: "=min_active_agreements", credit_limit_usd: "=credit_limit_usd", invoice_terms_days: "=invoice_terms_days"}
        Bluegate Business Fleet: {min_active_agreements: "=min_active_agreements", credit_limit_usd: "=credit_limit_usd", invoice_terms_days: "=invoice_terms_days"}
        Bluegate Business National Account: {min_active_agreements: "=min_active_agreements", credit_limit_usd: "=credit_limit_usd", invoice_terms_days: "=invoice_terms_days"}
    measures: [business_msr_active_agreements]

  - id: business_evt_invoicing
    subject: [business_invoice_issued, business_service_charge]
    rule: >-
      The account is invoiced on the first day of each calendar month with the monthly_program_fee_usd and the previous month's service
      charges, delivered by invoice_delivery, with a purchase-order number where po_number_supported is true. Where consolidated_invoicing
      is true the business's rents are presented on the same invoice, each still booked on its own agreement's ledger, and the
      rent_volume_discount_pct applies to each business-billed agreement while business_msr_active_agreements is at least
      volume_discount_min_agreements. Each month is invoiced once. Business center services follow the allowances: conference room hours
      beyond conference_room_hours_included are charged conference_room_hourly_fee_usd, forklift time forklift_fee_per_hour_usd per
      started hour where forklift_service_included is true, and each authorized user added after opening authorized_user_add_fee_usd.
    eligibility:
      - id: one_invoice_per_month
        applies_to: [business_invoice_issued]
        kind: dedup
        condition: "Each month is invoiced once."
        evidence_fields: [business_invoices.business_account_id, business_invoices.invoice_month, business_invoices.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[business_invoices.business_account_id, business_invoices.invoice_month]]
          action_bindings: {business_invoices.business_account_id: business_account_id, business_invoices.invoice_month: invoice_month}
        dedup_contract:
          table: business_invoices
          mode: separate_record
          object_bindings: {business_account_id: business_account_id, invoice_month: invoice_month}
          duplicate_filters: {event_type: [business_invoice_issued]}
          distinct_fields: []
    params:
      per_tier:
        Bluegate Business Essentials: {monthly_program_fee_usd: "=monthly_program_fee_usd", rent_volume_discount_pct: "=rent_volume_discount_pct", conference_room_hours_included: "=conference_room_hours_included"}
        Bluegate Business Plus: {monthly_program_fee_usd: "=monthly_program_fee_usd", rent_volume_discount_pct: "=rent_volume_discount_pct", conference_room_hours_included: "=conference_room_hours_included"}
        Bluegate Business Pro: {monthly_program_fee_usd: "=monthly_program_fee_usd", rent_volume_discount_pct: "=rent_volume_discount_pct", conference_room_hours_included: "=conference_room_hours_included"}
        Bluegate Business Logistics: {monthly_program_fee_usd: "=monthly_program_fee_usd", rent_volume_discount_pct: "=rent_volume_discount_pct", conference_room_hours_included: "=conference_room_hours_included"}
        Bluegate Business Fleet: {monthly_program_fee_usd: "=monthly_program_fee_usd", rent_volume_discount_pct: "=rent_volume_discount_pct", conference_room_hours_included: "=conference_room_hours_included"}
        Bluegate Business National Account: {monthly_program_fee_usd: "=monthly_program_fee_usd", rent_volume_discount_pct: "=rent_volume_discount_pct", conference_room_hours_included: "=conference_room_hours_included"}

  - id: business_evt_delivery_acceptance
    subject: [business_delivery_event, business_service_charge]
    rule: >-
      Where delivery_acceptance_included is true the facility signs for parcels addressed to the business at the facility, up to
      max_parcel_weight_lbs each; hazardous materials and perishables are refused unless hazmat_accepted or perishables_accepted is true.
      Deliveries are accepted only while the account is in active status. The first included_deliveries_per_month parcels of a calendar
      month, counted by business_msr_deliveries_month in receipt order, are free and each later parcel is billable at
      extra_delivery_fee_usd. Pallets are received only where freight_pallet_acceptance is true, at pallet_receiving_fee_usd each. A
      delivery is held free for package_hold_days, then charged package_storage_fee_per_day_usd per day, and returned to the sender
      return_to_sender_after_days after receipt. Only an authorized user may collect a delivery.
    eligibility:
      - id: accept_active_only
        applies_to: [business_delivery_event]
        kind: state
        condition: "Deliveries are accepted only while the account is in active status."
        evidence_fields: [business_accounts.status, business_accounts.business_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[business_accounts.business_account_id]]
          action_bindings: {business_accounts.business_account_id: business_account_id}
        state_contract:
          field: business_accounts.status
          allowed: [active]
    params:
      per_tier:
        Bluegate Business Essentials: {included_deliveries_per_month: "=included_deliveries_per_month", extra_delivery_fee_usd: "=extra_delivery_fee_usd", package_hold_days: "=package_hold_days"}
        Bluegate Business Plus: {included_deliveries_per_month: "=included_deliveries_per_month", extra_delivery_fee_usd: "=extra_delivery_fee_usd", package_hold_days: "=package_hold_days"}
        Bluegate Business Pro: {included_deliveries_per_month: "=included_deliveries_per_month", extra_delivery_fee_usd: "=extra_delivery_fee_usd", package_hold_days: "=package_hold_days"}
        Bluegate Business Logistics: {included_deliveries_per_month: "=included_deliveries_per_month", extra_delivery_fee_usd: "=extra_delivery_fee_usd", package_hold_days: "=package_hold_days"}
        Bluegate Business Fleet: {included_deliveries_per_month: "=included_deliveries_per_month", extra_delivery_fee_usd: "=extra_delivery_fee_usd", package_hold_days: "=package_hold_days"}
        Bluegate Business National Account: {included_deliveries_per_month: "=included_deliveries_per_month", extra_delivery_fee_usd: "=extra_delivery_fee_usd", package_hold_days: "=package_hold_days"}
    formula:
      billable: "business_msr_deliveries_month > included_deliveries_per_month"
    measures: [business_msr_deliveries_month]

  - id: business_evt_late_payment
    subject: [business_invoice_payment, business_service_charge]
    rule: >-
      An invoice is due invoice_terms_days calendar days after its invoice date. A late payment fee may be charged only when the handling
      date is later than the invoice date plus invoice_terms_days. Term days are calendar days counted from the day after the invoice
      date, and a payment on the last day is on time. The fee is the greater of late_payment_fee_pct of the unpaid invoice amount and
      late_payment_fee_min_usd, charged once per invoice. Payments are applied to the oldest invoice month first.
    eligibility:
      - id: past_terms
        applies_to: [business_service_charge]
        kind: time
        condition: "A late payment fee may be charged only when the handling date is later than the invoice date plus invoice_terms_days."
        evidence_fields: [business_invoices.entry_date, business_invoices.business_invoice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[business_invoices.business_invoice_id]]
          action_bindings: {business_invoices.business_invoice_id: reference_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the invoice date"
          anchor_source: business_invoices.entry_date
          relation: not_before
          duration_source: variants.invoice_terms_days
          unit: calendar_days
          counting_rule: "Term days are calendar days counted from the day after the invoice date, and a payment on the last day is on time."
          boundary: exclusive
    params:
      per_tier:
        Bluegate Business Essentials: {late_payment_fee_pct: "=late_payment_fee_pct", late_payment_fee_min_usd: "=late_payment_fee_min_usd"}
        Bluegate Business Plus: {late_payment_fee_pct: "=late_payment_fee_pct", late_payment_fee_min_usd: "=late_payment_fee_min_usd"}
        Bluegate Business Pro: {late_payment_fee_pct: "=late_payment_fee_pct", late_payment_fee_min_usd: "=late_payment_fee_min_usd"}
        Bluegate Business Logistics: {late_payment_fee_pct: "=late_payment_fee_pct", late_payment_fee_min_usd: "=late_payment_fee_min_usd"}
        Bluegate Business Fleet: {late_payment_fee_pct: "=late_payment_fee_pct", late_payment_fee_min_usd: "=late_payment_fee_min_usd"}
        Bluegate Business National Account: {late_payment_fee_pct: "=late_payment_fee_pct", late_payment_fee_min_usd: "=late_payment_fee_min_usd"}

  - id: business_evt_credit_hold
    subject: [business_credit_hold, business_credit_release, business_closure]
    rule: >-
      An account goes on credit hold when an invoice is still unpaid credit_hold_days_past_due calendar days after its due date, or when the
      unpaid balance exceeds the credit limit. While on hold the services in credit_hold_effects stop. The hold lifts when every past-due
      amount is paid. An account still on hold collections_referral_days_past_due days after the oldest due date is closed and referred
      to collections, and its agreements return to standard billing under their own rules.
    eligibility: []
    params:
      per_tier:
        Bluegate Business Essentials: {credit_hold_days_past_due: "=credit_hold_days_past_due", collections_referral_days_past_due: "=collections_referral_days_past_due"}
        Bluegate Business Plus: {credit_hold_days_past_due: "=credit_hold_days_past_due", collections_referral_days_past_due: "=collections_referral_days_past_due"}
        Bluegate Business Pro: {credit_hold_days_past_due: "=credit_hold_days_past_due", collections_referral_days_past_due: "=collections_referral_days_past_due"}
        Bluegate Business Logistics: {credit_hold_days_past_due: "=credit_hold_days_past_due", collections_referral_days_past_due: "=collections_referral_days_past_due"}
        Bluegate Business Fleet: {credit_hold_days_past_due: "=credit_hold_days_past_due", collections_referral_days_past_due: "=collections_referral_days_past_due"}
        Bluegate Business National Account: {credit_hold_days_past_due: "=credit_hold_days_past_due", collections_referral_days_past_due: "=collections_referral_days_past_due"}

  - id: business_evt_disputes
    subject: [business_credit]
    rule: >-
      An invoice line may be disputed within dispute_window_days of the invoice date; a line shown to be wrong by the records, such as a
      delivery fee inside the monthly allowance or a duplicated service charge, is credited in full as billing_error_correction. A line
      already credited is not credited again.
    eligibility:
      - id: credit_once
        applies_to: [business_credit]
        kind: dedup
        condition: "A line already credited is not credited again."
        evidence_fields: [business_invoices.reference_id, business_invoices.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[business_invoices.reference_id]]
          action_bindings: {business_invoices.reference_id: reference_id}
        dedup_contract:
          table: business_invoices
          mode: separate_record
          object_bindings: {reference_id: reference_id}
          duplicate_filters: {event_type: [business_credit]}
          distinct_fields: []
    params:
      per_tier:
        Bluegate Business Essentials: {dispute_window_days: "=dispute_window_days"}
        Bluegate Business Plus: {dispute_window_days: "=dispute_window_days"}
        Bluegate Business Pro: {dispute_window_days: "=dispute_window_days"}
        Bluegate Business Logistics: {dispute_window_days: "=dispute_window_days"}
        Bluegate Business Fleet: {dispute_window_days: "=dispute_window_days"}
        Bluegate Business National Account: {dispute_window_days: "=dispute_window_days"}

  - id: business_evt_terms_and_users
    subject: [business_terms_update]
    rule: >-
      The account may have up to max_authorized_users authorized users. Net terms longer than the program's invoice_terms_days are offered
      only after net_terms_min_months of on-time payment, and the credit limit is reviewed every credit_limit_review_months. Terms and
      users are changed only while the account is in active status. Authorized users get after-hours access where after_hours_access is
      true, and use of the loading dock, carts and dollies, Wi-Fi and mail handling follows loading_dock_access, cart_and_dolly_access,
      wifi_access and mail_handling_included. Multi-facility billing, an account manager and tax-exemption follow
      multi_facility_billing, account_manager_assigned and tax_exempt_supported; signature deliveries follow
      signature_deliveries_accepted.
    eligibility:
      - id: change_active_only
        applies_to: [business_terms_update]
        kind: state
        condition: "Terms and users are changed only while the account is in active status."
        evidence_fields: [business_accounts.status, business_accounts.business_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[business_accounts.business_account_id]]
          action_bindings: {business_accounts.business_account_id: business_account_id}
        state_contract:
          field: business_accounts.status
          allowed: [active]
    params:
      per_tier:
        Bluegate Business Essentials: {max_authorized_users: "=max_authorized_users", net_terms_min_months: "=net_terms_min_months"}
        Bluegate Business Plus: {max_authorized_users: "=max_authorized_users", net_terms_min_months: "=net_terms_min_months"}
        Bluegate Business Pro: {max_authorized_users: "=max_authorized_users", net_terms_min_months: "=net_terms_min_months"}
        Bluegate Business Logistics: {max_authorized_users: "=max_authorized_users", net_terms_min_months: "=net_terms_min_months"}
        Bluegate Business Fleet: {max_authorized_users: "=max_authorized_users", net_terms_min_months: "=net_terms_min_months"}
        Bluegate Business National Account: {max_authorized_users: "=max_authorized_users", net_terms_min_months: "=net_terms_min_months"}

  - id: business_evt_closure
    subject: [business_closure]
    rule: >-
      The business closes its account with closure_notice_days written notice. An account may be closed by the business only when its
      balance is zero (closure_requires_zero_balance). On closure its agreements move to standard individual billing
      (closure_agreements_handling) and any held deliveries must be collected or are returned to the sender.
    eligibility:
      - id: zero_balance
        applies_to: [business_closure]
        kind: authorization
        condition: "An account may be closed by the business only when its balance is zero (closure_requires_zero_balance)."
        evidence_fields: [business_accounts.invoice_balance, business_accounts.business_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[business_accounts.business_account_id]]
          action_bindings: {business_accounts.business_account_id: business_account_id}
    params:
      per_tier:
        Bluegate Business Essentials: {closure_notice_days: "=closure_notice_days"}
        Bluegate Business Plus: {closure_notice_days: "=closure_notice_days"}
        Bluegate Business Pro: {closure_notice_days: "=closure_notice_days"}
        Bluegate Business Logistics: {closure_notice_days: "=closure_notice_days"}
        Bluegate Business Fleet: {closure_notice_days: "=closure_notice_days"}
        Bluegate Business National Account: {closure_notice_days: "=closure_notice_days"}
