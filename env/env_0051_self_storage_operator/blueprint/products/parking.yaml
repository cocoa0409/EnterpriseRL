# Policy charter: vehicle, RV and boat parking space rental agreements.
category: parking
display_name: Vehicle, RV & Boat Parking Agreement

binding:
  holding_table: parking_rentals
  event_tables: [parking_ledger, parking_notices, parking_rate_changes]
  intake_tables: [parking_moveout_notices]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: parking_balance}

lifecycle:
  states: [reserved, active, delinquent, tow_noticed, termination_noticed, moving_out, vacated, towed, reservation_cancelled]
  transitions:
    - {from: reserved, to: active, by: user, means: "The customer signs the parking agreement and parks the registered vehicle in the space."}
    - {from: reserved, to: reservation_cancelled, by: user, means: "The customer cancels an unclaimed parking reservation."}
    - {from: reserved, to: reservation_cancelled, by: system, means: "An unclaimed parking reservation lapses at the end of its hold."}
    - {from: active, to: delinquent, by: system, means: "Rent for a billing period is still unpaid when its grace period ends."}
    - {from: delinquent, to: active, by: system, means: "The past-due balance is paid in full before a tow notice is sent."}
    - {from: delinquent, to: tow_noticed, by: system, means: "The notice of intent to tow is sent for the unpaid balance."}
    - {from: tow_noticed, to: active, by: system, means: "The tenant pays the full balance, including the tow notice fee, before the tow."}
    - {from: tow_noticed, to: towed, by: system, means: "The vehicle is removed by the contracted towing company and the agreement ends."}
    - {from: active, to: termination_noticed, by: agent, means: "The company gives notice ending the agreement because a vehicle compliance problem was not cured."}
    - {from: termination_noticed, to: active, by: agent, means: "The compliance problem is cured before the termination date and the termination notice is withdrawn."}
    - {from: termination_noticed, to: vacated, by: agent, means: "The tenant removes the vehicle by the termination date and the agreement ends."}
    - {from: termination_noticed, to: towed, by: system, means: "The vehicle is still in the space after the termination date and is towed."}
    - {from: active, to: moving_out, by: user, means: "The tenant gives notice to end the agreement."}
    - {from: delinquent, to: moving_out, by: user, means: "A delinquent tenant gives notice to end the agreement; the unpaid balance stays owed."}
    - {from: moving_out, to: active, by: user, means: "The tenant withdraws a move-out notice on a rental that owes nothing past due."}
    - {from: moving_out, to: delinquent, by: user, means: "The tenant withdraws a move-out notice on a rental that still carries past-due rent."}
    - {from: moving_out, to: vacated, by: agent, means: "The facility confirms the space is empty and the gate code is closed."}

accounts:
  - key: parking_balance
    unit: USD
    meaning: "Amount the tenant owes on the parking agreement: rent and fees increase it; payments and credits decrease it; negative is a credit balance."

parameter_schema:
  admin_fee_usd: "One-time administrative fee charged when the parking agreement starts, USD."
  reservation_hold_days: "Calendar days a parking reservation holds the space after the reservation date, integer."
  first_month_discount_pct: "Discount on the first billing period's rent, fraction of monthly rent."
  military_discount_pct: "Standing discount on every period's rent where the military discount is applied, fraction."
  max_vehicle_length_ft: "Longest vehicle, including trailer tongue and outboard motor, that may use the space, feet."
  allowed_vehicle_types: "Vehicle types that may be parked in the space class, list of enum strings."
  covered_space: "Whether the space has a roof canopy, boolean."
  enclosed_space: "Whether the space is a fully enclosed garage with its own door, boolean."
  electric_hookup_included: "Whether a 30-amp electrical outlet for battery maintenance is included, boolean."
  dump_station_access: "Whether the tenant may use the facility RV dump station, boolean."
  wash_bay_access: "Whether the tenant may use the facility wash bay, boolean."
  access_hours: "Gate access hours for the space class, enum string."
  registration_required: "Whether a current state registration in the tenant's name must be kept on file, boolean."
  insurance_required: "Whether current liability insurance on the vehicle must be kept on file, boolean."
  vehicle_must_be_operable: "Whether the vehicle must be operable and able to be moved under its own power or towed on its own wheels, boolean."
  compliance_cure_days: "Calendar days after a compliance notice within which the tenant must cure the problem, integer."
  termination_notice_days: "Calendar days between a compliance termination notice and the termination date, integer."
  vehicle_swaps_per_12_months: "Changes of the vehicle on file allowed per agreement in any rolling 365-day window, integer."
  vehicle_swap_fee_usd: "Fee for changing the vehicle on file, USD."
  billing_cycle_basis: "How rent due dates are set, enum string."
  grace_period_days: "Calendar days after the due date during which rent may be paid without a late fee, integer."
  late_fee_flat_usd: "Flat late fee floor, USD."
  late_fee_pct_of_rent: "Late fee as a fraction of monthly rent; the greater of this and the flat floor applies."
  late_fee_max_usd: "Ceiling on one late fee, USD."
  courtesy_waivers_per_12_months: "Courtesy late-fee waivers per agreement in any rolling 365-day window, integer."
  courtesy_waiver_min_tenure_months: "Calendar months since the start date before a courtesy waiver may be given, integer."
  partial_payment_accepted_while_delinquent: "Whether a payment below the balance is accepted while delinquent, boolean."
  partial_payment_accepted_after_tow_notice: "Whether a payment below the balance is accepted after the tow notice, boolean."
  returned_payment_fee_usd: "Fee for a payment returned unpaid for insufficient funds or a closed account, USD."
  gate_lockout_days_after_due: "Calendar days after the due date of the oldest unpaid period at which the tenant gate code is suspended, integer."
  tow_notice_days_after_due: "Calendar days after the due date of the oldest unpaid period at which the notice of intent to tow may be sent, integer."
  tow_notice_fee_usd: "Fee charged when the notice of intent to tow is sent, USD."
  tow_min_days_after_notice: "Calendar days after the tow notice before the vehicle may be towed, integer."
  tow_charges_payer: "Who pays the towing company's own towing and storage charges, enum string."
  rate_increase_first_eligible_months: "Calendar months after the start date before the first rate increase notice may be sent, integer."
  rate_increase_min_interval_months: "Calendar months after the last rent change before another increase notice may be sent, integer."
  rate_increase_max_pct: "Largest standard single rate increase, fraction of current monthly rent."
  rate_increase_notice_days: "Calendar days of written notice before an increased rent takes effect, integer."
  rate_increase_street_rate_ceiling: "Whether an increased rent may never exceed the space's posted street rate on the notice date, boolean."
  loyalty_tenure_months: "Tenure in calendar months at which the loyalty increase cap replaces the standard cap, integer."
  loyalty_max_increase_pct: "Largest single increase for a tenant at or past loyalty tenure, fraction of current monthly rent."
  retention_concession_pct_of_increase: "Share of a noticed increase that may be given back as a retention concession, fraction."
  retention_concessions_per_12_months: "Retention concessions per agreement in any rolling 365-day window, integer."
  retention_request_window_days: "Calendar days after the increase notice date within which a retention concession may be asked for, integer."
  retention_min_tenure_months: "Calendar months since the start date a tenant must have to receive a retention concession, integer."
  rescind_defective_increase: "Whether an increase notice that breaks the increase rules is rescinded in full, boolean."
  prepay_rate_lock_honored: "Whether rent stays unchanged while a prepaid rent plan covers the agreement, boolean."
  moveout_notice_days: "Calendar days of notice required between the move-out notice date and the planned vacate date, integer."
  moveout_prorated_refund: "Whether unused days of the last paid period are credited at move-out, boolean."
  space_cleanup_fee_usd: "Fee when the walk-through finds fluid stains, debris or belongings left in the space, USD."
  credit_balance_refund_days: "Calendar days after the vacate date by which a credit balance is refunded, integer."

