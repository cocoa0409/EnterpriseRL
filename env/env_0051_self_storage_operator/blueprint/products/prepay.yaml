events:
  - type: prepay_purchase
    target: prepay_plans
    mutation: create
    meaning: "A tenant buys a prepaid rent plan for one agreement."
    grain: "One plan record per purchase."
    fields:
      customer_id: "Tenant."
      variant_name: "Plan, official full name."
      agreement_kind: "Kind of agreement covered."
      agreement_id: "Agreement covered."
      purchase_date: "Date bought."
      term_start_date: "Due date the term starts."
      term_end_date: "Last day of the term."
      locked_monthly_rent: "Monthly rent locked for the term, USD."
      prepaid_amount: "Amount to be prepaid, USD."
    triggers: []
  - type: prepay_payment_received
    target: prepay_ledger
    meaning: "The prepayment for the plan is received."
    grain: "One row per plan."
    distinguish_by: [entry_date]
    fields:
      amount: "Amount received, USD."
      entry_date: "Date received."
      payment_method: "How paid."
    account: prepaid_credit
    direction: in
    triggers:
      - event: prepay:prepay_activation
        map: {}
  - type: prepay_activation
    target: prepay_plans
    mutation: {transition: {from: pending_payment, to: active}}
    meaning: "The plan becomes active once paid."
    grain: "One transition per plan."
    fields:
      paid_date: "Date the prepayment was received."
    triggers: []
  - type: prepay_month_applied
    target: prepay_ledger
    meaning: "One prepaid month is applied to the covered agreement's rent on its due date."
    grain: "One row per plan per billing period."
    distinguish_by: [period_start]
    fields:
      amount: "Amount applied, USD (0.00 for a free month)."
      entry_date: "Date applied."
      period_start: "Due date of the billing period paid."
      agreement_kind: "Kind of agreement the month is applied to."
    account: prepaid_credit
    direction: out
    triggers:
      - event: unit:unit_payment
        when: {agreement_kind: unit_rental}
        map: {amount: amount, payment_method: prepaid_rent_plan, entry_date: entry_date}
      - event: parking:parking_payment
        when: {agreement_kind: parking_rental}
        map: {amount: amount, payment_method: prepaid_rent_plan, entry_date: entry_date}
  - type: prepay_refund
    target: prepay_ledger
    meaning: "Unused prepaid credit is refunded after early termination or free cancellation."
    grain: "One row per refund."
    distinguish_by: [entry_date, refund_reason]
    fields:
      amount: "Amount refunded, USD."
      entry_date: "Date refunded."
      refund_reason: "Why refunded."
    account: prepaid_credit
    direction: out
    triggers: []
  - type: prepay_forfeiture_applied
    target: prepay_ledger
    meaning: "Unused credit is applied to the balance of an agreement that ended by lien sale or tow."
    grain: "One row per plan."
    distinguish_by: [entry_date]
    fields:
      amount: "Amount applied, USD."
      entry_date: "Date applied."
    account: prepaid_credit
    direction: out
    triggers: []
  - type: prepay_completion
    target: prepay_plans
    mutation: {transition: {from: active, to: completed}}
    meaning: "The term ends with every month applied."
    grain: "One transition per plan."
    fields:
      ended_date: "Date the term ended."
    triggers: []
  - type: prepay_early_termination
    target: prepay_plans
    mutation: {transition: {from: active, to: early_terminated}}
    meaning: "The plan ends before its term because the tenant ends it or moves out."
    grain: "One transition per plan."
    fields:
      ended_date: "Date the plan ended."
    triggers:
      - event: prepay:prepay_refund
        map: {refund_reason: early_termination}
  - type: prepay_forfeiture
    target: prepay_plans
    mutation: {transition: {from: active, to: forfeited}}
    meaning: "The covered agreement ends by lien sale or tow."
    grain: "One transition per plan."
    fields:
      ended_date: "Date the agreement ended."
    triggers:
      - event: prepay:prepay_forfeiture_applied
        map: {}
  - type: prepay_cancellation
    target: prepay_plans
    mutation: {transition: {from: pending_payment, to: cancelled}}
    meaning: "An unpaid purchase is withdrawn or lapses."
    grain: "One transition per plan."
    fields:
      ended_date: "Date cancelled."
    triggers: []

measures:
  - id: prepay_msr_months_applied
    window: "From the term start date to the handling date, inclusive, per plan."
    measure: "Count of prepay_month_applied rows on the plan."
  - id: prepay_msr_open_prepaid_total
    window: "Point in time: the handling date, per customer."
    measure: "Sum of prepaid_balance over the customer's plans in active status."

policies:
  - id: prepay_agg_multi_holding
    subject: [prepay_purchase]
    rule: >-
      A tenant may hold one prepaid plan for each storage unit or parking agreement, with no cap on the number of agreements covered. An
      agreement may have only one plan in pending_payment or active status (max_active_plans_per_agreement). A follow-on plan bought in
      the renewal window starts the day after the current term ends.
    eligibility:
      - id: one_plan_per_agreement
        applies_to: [prepay_purchase]
        kind: dedup
        condition: "An agreement may have only one plan in pending_payment or active status (max_active_plans_per_agreement)."
        evidence_fields: [prepay_plans.agreement_id, prepay_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prepay_plans.agreement_id]]
          action_bindings: {prepay_plans.agreement_id: agreement_id}
        dedup_contract:
          table: prepay_plans
          mode: separate_record
          object_bindings: {agreement_id: agreement_id}
          duplicate_filters: {status: [pending_payment, active]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: prepay_agg_customer_exposure
    subject: [prepay_purchase, prepay_payment_received]
    rule: >-
      Across all of a tenant's agreements, the unused prepaid credit on active plans, measured by prepay_msr_open_prepaid_total, plus the
      new prepayment may not exceed max_customer_prepaid_total_usd; a larger purchase is referred to the district office. Each plan's own
      prepayment may not exceed max_prepay_amount_usd.
    eligibility: []
    params:
      max_customer_prepaid_total_usd: 15000.0
    measures: [prepay_msr_open_prepaid_total]

  - id: prepay_evt_pricing
    subject: [prepay_purchase, prepay_payment_received]
    rule: >-
      The plan locks the monthly rent in effect on the term start date (locked_rent_basis), which is the covered agreement's next due
      date (term_start_basis); a rate increase noticed with an effective date on or before that due date is part of the locked rent. The
      prepayment is the locked rent times months_prepaid minus free_months, reduced by discount_pct, and reduced by the military
      discount where stackable_with_military_discount is true and the agreement carries it; the move-in discount never applies. The
      amount is rounded to the cent half up and paid in full by a method in payment_methods_accepted.
    eligibility: []
    params:
      per_tier:
        Bluegate Prepaid Rent 3-Month Plan: {months_prepaid: "=months_prepaid", free_months: "=free_months", discount_pct: "=discount_pct"}
        Bluegate Prepaid Rent 6-Month Plan: {months_prepaid: "=months_prepaid", free_months: "=free_months", discount_pct: "=discount_pct"}
        Bluegate Prepaid Rent 9-Month Plan: {months_prepaid: "=months_prepaid", free_months: "=free_months", discount_pct: "=discount_pct"}
        Bluegate Prepaid Rent 12-Month Plan: {months_prepaid: "=months_prepaid", free_months: "=free_months", discount_pct: "=discount_pct"}
        Bluegate Prepaid Rent 18-Month Plan: {months_prepaid: "=months_prepaid", free_months: "=free_months", discount_pct: "=discount_pct"}
        Bluegate Prepaid Rent 24-Month Plan: {months_prepaid: "=months_prepaid", free_months: "=free_months", discount_pct: "=discount_pct"}
    formula:
      prepaid_amount: "round(locked_monthly_rent * (months_prepaid - free_months) * (1 - discount_pct), 2)"

  - id: prepay_evt_eligibility
    subject: [prepay_purchase]
    rule: >-
      A plan may be bought only for an agreement of a kind in eligible_agreement_kinds and a class in eligible_classes that has run at
      least min_tenure_months. The covered agreement must be in active status, owe nothing, and have no move-out notice on file. The
      locked rent may not be below min_rent_usd. Business accounts may pay a plan on invoice where business_invoice_eligible is true.
    eligibility:
      - id: covered_agreement_current
        applies_to: [prepay_purchase]
        kind: authorization
        condition: "The covered agreement must be in active status, owe nothing, and have no move-out notice on file."
        evidence_fields: [unit_rentals.status, unit_rentals.balance_due, parking_rentals.status, parking_rentals.balance_due, prepay_plans.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prepay_plans.agreement_id]]
          action_bindings: {prepay_plans.agreement_id: agreement_id}
    params:
      per_tier:
        Bluegate Prepaid Rent 3-Month Plan: {min_tenure_months: "=min_tenure_months", eligible_classes: "=eligible_classes"}
        Bluegate Prepaid Rent 6-Month Plan: {min_tenure_months: "=min_tenure_months", eligible_classes: "=eligible_classes"}
        Bluegate Prepaid Rent 9-Month Plan: {min_tenure_months: "=min_tenure_months", eligible_classes: "=eligible_classes"}
        Bluegate Prepaid Rent 12-Month Plan: {min_tenure_months: "=min_tenure_months", eligible_classes: "=eligible_classes"}
        Bluegate Prepaid Rent 18-Month Plan: {min_tenure_months: "=min_tenure_months", eligible_classes: "=eligible_classes"}
        Bluegate Prepaid Rent 24-Month Plan: {min_tenure_months: "=min_tenure_months", eligible_classes: "=eligible_classes"}

  - id: prepay_evt_payment_window
    subject: [prepay_activation, prepay_cancellation]
    rule: >-
      The plan is active once the full prepayment is received. The prepayment must be received not later than the purchase date plus
      payment_window_days. Window days are calendar days counted from the day after the purchase date, and the last counted day is
      included. An unpaid purchase lapses after the window and is cancelled; the tenant may also withdraw it before paying.
    eligibility:
      - id: paid_in_window
        applies_to: [prepay_activation]
        kind: time
        condition: "The prepayment must be received not later than the purchase date plus payment_window_days."
        evidence_fields: [prepay_plans.purchase_date, prepay_plans.prepay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prepay_plans.prepay_id]]
          action_bindings: {prepay_plans.prepay_id: prepay_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase date"
          anchor_source: prepay_plans.purchase_date
          relation: not_after
          duration_source: variants.payment_window_days
          unit: calendar_days
          counting_rule: "Window days are calendar days counted from the day after the purchase date, and the last counted day is included."
          boundary: inclusive
    params:
      per_tier:
        Bluegate Prepaid Rent 3-Month Plan: {payment_window_days: "=payment_window_days"}
        Bluegate Prepaid Rent 6-Month Plan: {payment_window_days: "=payment_window_days"}
        Bluegate Prepaid Rent 9-Month Plan: {payment_window_days: "=payment_window_days"}
        Bluegate Prepaid Rent 12-Month Plan: {payment_window_days: "=payment_window_days"}
        Bluegate Prepaid Rent 18-Month Plan: {payment_window_days: "=payment_window_days"}
        Bluegate Prepaid Rent 24-Month Plan: {payment_window_days: "=payment_window_days"}

  - id: prepay_evt_term_application
    subject: [prepay_month_applied, prepay_completion]
    rule: >-
      On each due date of the term one month is applied to the covered agreement's rent charge (application_posting_day): the locked rent
      net of discount for a charged month, and the full locked rent as a free month for each of the free_months, which are the last
      months of the term. A month is applied only while the plan is in active status, and each billing period once. While the term runs
      the agreement's rent stays at the locked rent (rate_lock_during_term), AutoPay drafts pause where autopay_paused_during_term is
      true, and protection fees are billed separately (protection_fee_included). After the last month the plan completes and rent returns
      to the agreement's monthly rent (post_term_rent_basis); a rate increase may be noticed to take effect on the first due date after
      the term where rate_increase_notice_after_term_allowed is true. A reminder is sent term_end_reminder_days before the term end.
    eligibility:
      - id: apply_active_only
        applies_to: [prepay_month_applied]
        kind: state
        condition: "A month is applied only while the plan is in active status, and each billing period once."
        evidence_fields: [prepay_plans.status, prepay_plans.prepay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prepay_plans.prepay_id]]
          action_bindings: {prepay_plans.prepay_id: prepay_id}
        state_contract:
          field: prepay_plans.status
          allowed: [active]
    params:
      per_tier:
        Bluegate Prepaid Rent 3-Month Plan: {months_prepaid: "=months_prepaid", term_end_reminder_days: "=term_end_reminder_days"}
        Bluegate Prepaid Rent 6-Month Plan: {months_prepaid: "=months_prepaid", term_end_reminder_days: "=term_end_reminder_days"}
        Bluegate Prepaid Rent 9-Month Plan: {months_prepaid: "=months_prepaid", term_end_reminder_days: "=term_end_reminder_days"}
        Bluegate Prepaid Rent 12-Month Plan: {months_prepaid: "=months_prepaid", term_end_reminder_days: "=term_end_reminder_days"}
        Bluegate Prepaid Rent 18-Month Plan: {months_prepaid: "=months_prepaid", term_end_reminder_days: "=term_end_reminder_days"}
        Bluegate Prepaid Rent 24-Month Plan: {months_prepaid: "=months_prepaid", term_end_reminder_days: "=term_end_reminder_days"}
    measures: [prepay_msr_months_applied]

  - id: prepay_evt_early_termination
    subject: [prepay_early_termination, prepay_refund]
    rule: >-
      A plan ends early when the tenant moves out or asks to end it before the term ends. A cancellation is refunded in full only when it
      is made not later than the prepayment date plus free_cancellation_days_after_payment. Free-cancellation days are calendar days
      counted from the day after the prepayment date, and the last counted day is included. After that window the refund is the
      prepayment less the standard monthly rent, without discount or free months, for each month already applied
      (discount_clawback_on_early_termination), less early_termination_fee_usd, and never below zero; a partly used period is not
      refunded. The refund is paid by refund_method within refund_days. A transfer keeps the plan where transfer_carries_plan is true,
      with any rent difference settled per transfer_adjustment_basis.
      Early termination is available where early_termination_allowed is true, computed per early_termination_refund_basis, and a partly used period is refunded only where partial_month_refund is true.
    eligibility:
      - id: free_cancel_window
        applies_to: [prepay_refund]
        kind: time
        condition: "A cancellation is refunded in full only when it is made not later than the prepayment date plus free_cancellation_days_after_payment."
        evidence_fields: [prepay_plans.paid_date, prepay_plans.prepay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prepay_plans.prepay_id]]
          action_bindings: {prepay_plans.prepay_id: prepay_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the prepayment date"
          anchor_source: prepay_plans.paid_date
          relation: not_after
          duration_source: variants.free_cancellation_days_after_payment
          unit: calendar_days
          counting_rule: "Free-cancellation days are calendar days counted from the day after the prepayment date, and the last counted day is included."
          boundary: inclusive
    params:
      per_tier:
        Bluegate Prepaid Rent 3-Month Plan: {early_termination_fee_usd: "=early_termination_fee_usd", refund_days: "=refund_days"}
        Bluegate Prepaid Rent 6-Month Plan: {early_termination_fee_usd: "=early_termination_fee_usd", refund_days: "=refund_days"}
        Bluegate Prepaid Rent 9-Month Plan: {early_termination_fee_usd: "=early_termination_fee_usd", refund_days: "=refund_days"}
        Bluegate Prepaid Rent 12-Month Plan: {early_termination_fee_usd: "=early_termination_fee_usd", refund_days: "=refund_days"}
        Bluegate Prepaid Rent 18-Month Plan: {early_termination_fee_usd: "=early_termination_fee_usd", refund_days: "=refund_days"}
        Bluegate Prepaid Rent 24-Month Plan: {early_termination_fee_usd: "=early_termination_fee_usd", refund_days: "=refund_days"}
    formula:
      refund: "max(0, prepaid_amount - locked_monthly_rent * prepay_msr_months_applied - early_termination_fee_usd)"

  - id: prepay_evt_forfeiture
    subject: [prepay_forfeiture, prepay_forfeiture_applied]
    rule: >-
      When the covered agreement ends by lien sale or tow, the unused prepaid credit is applied to the balance owed on that agreement
      (forfeiture_basis) and any remainder is refunded to the former tenant. Because the plan pays every due date in its term, an agreement
      under an active plan can fall behind only on fees or charges outside the plan.
    eligibility: []

  - id: prepay_evt_renewal
    subject: [prepay_purchase, prepay_completion]
    rule: >-
      A follow-on plan may be bought where renewal_allowed is true, no earlier than renewal_window_days_before_end calendar days before
      the current term end, and it locks the rent in effect on its own start date (renewal_rate_basis). Receipts are sent by
      receipt_delivery and statements by statement_frequency, showing savings per savings_display_basis under marketing_name_short.
      Amounts follow rounding_rule. A cancellation after the free window is treated per cancellation_after_window_basis. A plan cannot be
      bought for an agreement that is delinquent or in a lien stage (lien_status_blocks_purchase), that owes a balance
      (balance_must_be_zero_at_purchase), or that has a move-out notice (move_out_notice_blocks_purchase); late fees cannot arise on prepaid
      rent (late_fees_possible_during_term) and stacking with the move-in discount is never allowed (stackable_with_move_in_discount).
      Applications appear on the agreement ledger as application_payment_method_label.
    eligibility: []
    params:
      per_tier:
        Bluegate Prepaid Rent 3-Month Plan: {renewal_window_days_before_end: "=renewal_window_days_before_end"}
        Bluegate Prepaid Rent 6-Month Plan: {renewal_window_days_before_end: "=renewal_window_days_before_end"}
        Bluegate Prepaid Rent 9-Month Plan: {renewal_window_days_before_end: "=renewal_window_days_before_end"}
        Bluegate Prepaid Rent 12-Month Plan: {renewal_window_days_before_end: "=renewal_window_days_before_end"}
        Bluegate Prepaid Rent 18-Month Plan: {renewal_window_days_before_end: "=renewal_window_days_before_end"}
        Bluegate Prepaid Rent 24-Month Plan: {renewal_window_days_before_end: "=renewal_window_days_before_end"}
