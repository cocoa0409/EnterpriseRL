# Policy charter: Bluegate Prepaid Rent plans (rent paid ahead for a fixed term at a locked rate).
category: prepay
display_name: Bluegate Prepaid Rent Plan

binding:
  holding_table: prepay_plans
  event_tables: [prepay_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {prepaid_balance: prepaid_credit}

lifecycle:
  states: [pending_payment, active, completed, early_terminated, forfeited, cancelled]
  transitions:
    - {from: pending_payment, to: active, by: system, means: "The full prepayment is received and the term is set."}
    - {from: pending_payment, to: cancelled, by: user, means: "The tenant withdraws the purchase before paying."}
    - {from: pending_payment, to: cancelled, by: system, means: "The prepayment is not received within the payment window."}
    - {from: active, to: completed, by: system, means: "Every prepaid month has been applied and the term has ended."}
    - {from: active, to: early_terminated, by: user, means: "The tenant ends the covered agreement or the plan before the term ends."}
    - {from: active, to: forfeited, by: system, means: "The covered agreement ends by lien sale or tow; the remaining credit is applied to what is owed."}

accounts:
  - key: prepaid_credit
    unit: USD
    meaning: "Prepaid rent not yet applied: the prepayment increases it; each monthly application, a refund or a forfeiture application decreases it."

parameter_schema:
  months_prepaid: "Billing periods covered by the plan, integer."
  free_months: "Billing periods within the term that are not charged, integer."
  discount_pct: "Discount on the charged months' rent, fraction."
  rate_lock_during_term: "Whether the monthly rent cannot change during the term, boolean."
  locked_rent_basis: "Which rent the plan locks, enum string."
  eligible_agreement_kinds: "Kinds of agreement the plan can cover, list of enum strings."
  eligible_classes: "Unit and space classes the plan can cover, list of official class names."
  min_tenure_months: "Calendar months the covered agreement must have run before purchase, integer."
  max_prepay_amount_usd: "Largest prepayment accepted for one plan, USD."
  payment_methods_accepted: "Ways the prepayment can be paid, list of enum strings."
  payment_window_days: "Calendar days after purchase within which the prepayment must be received, integer."
  term_start_basis: "Due date on which the term starts, enum string."
  stackable_with_military_discount: "Whether the military discount also applies to the prepaid months, boolean."
  stackable_with_move_in_discount: "Whether the move-in discount also applies, boolean."
  protection_fee_included: "Whether tenant protection fees are included in the prepayment, boolean."
  autopay_paused_during_term: "Whether AutoPay drafts pause while the term covers the agreement, boolean."
  late_fees_possible_during_term: "Whether late fees can arise on rent during the term, boolean."
  early_termination_allowed: "Whether the tenant may end the plan early, boolean."
  early_termination_fee_usd: "Fee deducted from an early-termination refund, USD."
  early_termination_refund_basis: "How an early-termination refund is computed, enum string."
  discount_clawback_on_early_termination: "Whether the discount and free months already used are taken back on early termination, boolean."
  partial_month_refund: "Whether a partly used billing period is refunded, boolean."
  refund_method: "How refunds are paid, enum string."
  refund_days: "Calendar days after early termination by which the refund is issued, integer."
  free_cancellation_days_after_payment: "Calendar days after the prepayment within which the tenant may cancel for a full refund, integer."
  forfeiture_basis: "What happens to unused credit when the agreement ends by lien sale or tow, enum string."
  transfer_carries_plan: "Whether a unit transfer keeps the plan on the agreement, boolean."
  transfer_adjustment_basis: "How a transfer to a unit with a different rent is settled, enum string."
  renewal_allowed: "Whether a new plan can be bought to follow on, boolean."
  renewal_window_days_before_end: "Calendar days before term end from which a follow-on plan may be bought, integer."
  renewal_rate_basis: "Rent a follow-on plan locks, enum string."
  term_end_reminder_days: "Calendar days before term end that a reminder is sent, integer."
  post_term_rent_basis: "Rent charged after the term ends, enum string."
  rate_increase_notice_after_term_allowed: "Whether a rate increase may be noticed to take effect right after the term, boolean."
  max_active_plans_per_agreement: "Plans in pending_payment or active status allowed on one agreement, integer."
  receipt_delivery: "How the prepayment receipt is delivered, enum string."
  statement_frequency: "How often a plan statement is sent, enum string."
  application_posting_day: "Day each prepaid month is applied, enum string."
  application_payment_method_label: "How an application appears on the agreement ledger, enum string."
  balance_must_be_zero_at_purchase: "Whether the covered agreement must owe nothing when the plan is bought, boolean."
  move_out_notice_blocks_purchase: "Whether a pending move-out notice prevents purchase, boolean."
  lien_status_blocks_purchase: "Whether a delinquent or lien-stage agreement may not buy a plan, boolean."
  business_invoice_eligible: "Whether a business account may pay the prepayment on invoice, boolean."
  min_rent_usd: "Lowest monthly rent a plan may lock, USD."
  rounding_rule: "Rounding of plan amounts, enum string."
  cancellation_after_window_basis: "How a cancellation after the free window is treated, enum string."
  marketing_name_short: "Short name printed on statements, string."
  savings_display_basis: "How savings are shown to the tenant, enum string."

