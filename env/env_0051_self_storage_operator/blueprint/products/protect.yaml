# Policy charter: Bluegate Tenant Protection plans (contents protection attached to a storage unit rental).
category: protect
display_name: Bluegate Tenant Protection Plan

binding:
  holding_table: protect_plans
  event_tables: [protect_premiums, protect_plan_changes, protect_claim_events]
  intake_tables: [protect_claims, protect_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance_due: premium_balance, claims_paid_total: claims_paid}

lifecycle:
  states: [pending_effective, active, lapsed, cancelled, terminated]
  transitions:
    - {from: pending_effective, to: active, by: system, means: "Protection takes effect on the plan's effective date."}
    - {from: pending_effective, to: cancelled, by: user, means: "The tenant cancels an enrollment before it takes effect."}
    - {from: active, to: lapsed, by: system, means: "Protection lapses because a monthly protection fee stays unpaid past the lapse threshold."}
    - {from: lapsed, to: active, by: system, means: "A lapsed plan is reinstated when every past-due protection fee is paid inside the reinstatement window."}
    - {from: active, to: cancelled, by: user, means: "The tenant cancels protection after showing proof of their own insurance."}
    - {from: active, to: terminated, by: system, means: "Protection ends because the covered rental agreement has ended."}
    - {from: lapsed, to: terminated, by: system, means: "A lapsed plan ends because the reinstatement window has passed or the covered rental has ended."}

accounts:
  - key: premium_balance
    unit: USD
    meaning: "Monthly protection fees owed on the plan: fee charges and refunds paid out increase it; collections and credits decrease it."
  - key: claims_paid
    unit: USD
    meaning: "Claim money paid out under the plan: claim payments increase it; voided or recovered payments decrease it."

parameter_schema:
  coverage_limit_usd: "Most the plan pays for one loss, before the deductible, USD."
  monthly_fee_usd: "Monthly protection fee billed on the covered rental's billing day, USD."
  deductible_usd: "Amount the tenant bears on each covered loss, subtracted once per claim, USD."
  jewelry_furs_watches_sublimit_usd: "Most paid for jewelry, furs and watches in one loss, USD."
  electronics_sublimit_usd: "Most paid for computers, televisions and other electronics in one loss, USD."
  collectibles_art_sublimit_usd: "Most paid for collectibles, fine art and memorabilia in one loss, USD."
  firearms_sublimit_usd: "Most paid for firearms in one loss, USD."
  business_inventory_sublimit_usd: "Most paid for business inventory, tools and equipment in one loss, USD."
  cash_securities_documents_covered: "Whether cash, securities, deeds and personal papers are covered, boolean."
  covered_perils: "Perils the plan covers, list of enum strings."
  excluded_perils: "Perils the plan never covers, list of enum strings."
  climate_control_failure_covered: "Whether damage from a documented failure of the unit's climate-control system is covered, boolean."
  burglary_requires_forced_entry: "Whether a burglary claim needs visible evidence of forced entry, boolean."
  police_report_deadline_days: "Calendar days after the discovery date within which a police report must be filed for burglary or vandalism, integer."
  loss_notice_to_facility_days: "Calendar days after discovery within which the loss must be reported to the facility office, integer."
  claim_filing_deadline_days: "Calendar days after the discovery date within which the claim must be filed, integer."
  proof_of_loss_deadline_days: "Calendar days after filing within which the itemized proof of loss must be received, integer."
  document_request_response_days: "Calendar days the tenant has to answer a document request before the claim is closed for lack of documents, integer."
  claim_decision_target_days: "Calendar days after the claim file is complete within which a decision is issued, integer."
  claim_payment_issue_days: "Calendar days after approval within which the claim payment is issued, integer."
  valuation_basis: "How stored property is valued for a claim, enum string."
  inventory_list_required_over_usd: "Claimed amount above which an itemized inventory with proof of ownership is required, USD."
  adjuster_inspection_over_usd: "Claimed amount above which an on-site adjuster inspection is required before decision, USD."
  photos_required: "Whether photographs of the damage or the forced entry are required, boolean."
  max_claims_per_12_months: "Claims with a loss date in any rolling 365-day window that the plan will pay, integer."
  aggregate_limit_multiple: "Total paid on claims with loss dates in any rolling 365-day window, as a multiple of the coverage limit, number."
  deductible_per_occurrence: "Whether the deductible applies once per loss occurrence, boolean."
  separate_deductible_per_unit: "Whether a loss that affects two rented units is settled as two claims with two deductibles, boolean."
  family_member_items_covered: "Whether property of household members stored in the unit is covered, boolean."
  third_party_property_covered: "Whether property held for someone outside the household is covered, boolean."
  vehicle_contents_covered: "Whether vehicles, trailers or their contents are covered, boolean."
  claim_reconsideration_window_days: "Calendar days after a decision within which the tenant may ask for reconsideration with new documents, integer."
  recovered_property_repayment_days: "Calendar days after stolen property is recovered within which the tenant must repay or surrender the recovered items, integer."
  claim_payment_methods: "Ways a claim payment can be issued, list of enum strings."
  free_look_days: "Calendar days after enrollment within which a cancelled plan's fees are refunded in full, integer."
  midterm_enrollment_waiting_days: "Calendar days after a mid-term enrollment before the plan takes effect, integer."
  coverage_increase_waiting_days: "Calendar days after an increase request before the higher limit applies to new losses, integer."
  coverage_decrease_effective_basis: "When a lower coverage level takes effect, enum string."
  plan_changes_per_12_months: "Coverage level changes allowed per plan in any rolling 365-day window, integer."
  lapse_days_past_due: "Calendar days after a protection fee's billing date at which an unpaid fee lapses the plan, integer."
  reinstatement_window_days: "Calendar days after the lapse date within which paying every past-due fee reinstates the plan, integer."
  cancellation_effective_basis: "When a tenant cancellation takes effect, enum string."
  cancellation_requires_proof_of_insurance: "Whether the tenant must name their own insurer and policy number to cancel, boolean."
  fee_proration_on_cancel: "Whether a partial month's fee is refunded on cancellation, boolean."
  fee_billing_basis: "How the protection fee is billed, enum string."
  eligible_unit_classes: "Unit classes whose rentals may carry this coverage level, list of official unit class names."
  enrollment_channels: "Channels through which a tenant may enroll or change coverage, list of enum strings."
  claim_filing_channels: "Channels through which a tenant may file a claim, list of enum strings."

