# Policy charter: in-town truck and van rentals from Bluegate facilities.
category: truck
display_name: Bluegate Moving Truck Rental

binding:
  holding_table: truck_rentals
  event_tables: [truck_charges, truck_incidents]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: truck_balance, deposit_hold_amount: deposit_hold}

lifecycle:
  states: [reserved, picked_up, returned, closed, cancelled, no_show]
  transitions:
    - {from: reserved, to: picked_up, by: user, means: "The renter signs the rental contract at the counter and drives the vehicle off the lot."}
    - {from: reserved, to: cancelled, by: user, means: "The renter cancels the reservation before pickup."}
    - {from: reserved, to: no_show, by: system, means: "The renter has not picked up the vehicle by the no-show cutoff."}
    - {from: picked_up, to: returned, by: agent, means: "The vehicle is checked in at the facility with odometer, fuel and condition recorded."}
    - {from: returned, to: closed, by: system, means: "The final invoice is settled and the deposit hold released or captured."}

accounts:
  - key: truck_balance
    unit: USD
    meaning: "Amount owed on the truck rental contract: charges and refunds paid out increase it; payments and credits decrease it."
  - key: deposit_hold
    unit: USD
    meaning: "Authorization hold placed on the renter's card at pickup: the hold increases it; release or capture decreases it."

parameter_schema:
  base_rate_usd: "In-town rental fee for one rental period, USD."
  rental_period_hours: "Length of one rental period from the actual pickup time, elapsed hours, integer."
  per_mile_usd: "Mileage charge per mile driven above any included miles, USD."
  environmental_fee_usd: "Flat environmental fee per rental contract, USD."
  basic_damage_waiver_fee_usd: "Fee per rental period for the basic damage waiver, USD."
  premium_damage_waiver_fee_usd: "Fee per rental period for the premium damage waiver, USD."
  basic_waiver_deductible_usd: "Renter's share of covered vehicle damage under the basic waiver, USD."
  premium_waiver_deductible_usd: "Renter's share of covered vehicle damage under the premium waiver, USD."
  no_waiver_liability_basis: "What the renter owes for vehicle damage when no waiver is bought, enum string."
  overhead_damage_excluded: "Whether damage to the cargo box roof or cab-over from striking an overhead object is excluded from both waivers, boolean."
  waiver_void_conditions: "Conditions under which a waiver does not apply, list of enum strings."
  fuel_type: "Fuel the vehicle takes, enum string."
  fuel_tank_eighths: "Fuel gauge resolution used at pickup and return, integer eighths."
  fuel_charge_per_eighth_usd: "Refuel charge for each eighth of a tank below the pickup level, USD."
  late_return_grace_hours: "Elapsed hours after the scheduled return time before a late-return fee applies, integer."
  late_return_fee_per_hour_usd: "Late-return fee for each started hour after the grace period, USD."
  extra_period_after_hours: "Elapsed hours late, counted from the scheduled return time, after which a full extra rental period is charged instead of hourly late fees, integer."
  extra_period_fee_usd: "Charge for one extra rental period, USD."
  cleaning_fee_usd: "Fee when the cargo area is returned with debris or needs sweeping, USD."
  smoking_fee_usd: "Fee when evidence of smoking is found at return, USD."
  tolls_and_citations_admin_fee_usd: "Administrative fee per toll or citation processed after the rental, USD."
  free_cancellation_hours_before_pickup: "Elapsed hours before the scheduled pickup time up to which a cancellation is free, integer."
  late_cancellation_fee_usd: "Fee for a cancellation made inside the free cancellation window, USD."
  no_show_after_hours: "Elapsed hours after the scheduled pickup time at which an unclaimed reservation becomes a no-show, integer."
  no_show_fee_usd: "Fee for a no-show, USD."
  deposit_hold_credit_card_usd: "Authorization hold placed at pickup on a credit card, USD."
  deposit_hold_debit_card_usd: "Authorization hold placed at pickup on a debit card, USD."
  deposit_release_days: "Calendar days after the contract closes by which an uncaptured hold is released, integer."
  accepted_deposit_methods: "Card types accepted for the deposit hold, list of enum strings."
  min_driver_age_years: "Minimum age of every driver, years."
  license_requirement: "Driver's license class required, enum string."
  additional_driver_fee_usd: "Fee per additional authorized driver, USD."
  max_rental_periods: "Most rental periods one contract may run, including extensions, integer."
  one_way_allowed: "Whether the vehicle may be returned to a different facility, boolean."
  extension_allowed: "Whether a rental may be extended after pickup, boolean."
  extension_request_before_due_hours: "Elapsed hours before the scheduled return time by which an extension must be requested, integer."
  free_move_in_eligible: "Whether this vehicle class can be used for the free move-in truck benefit, boolean."
  free_move_in_included_miles: "Miles included at no charge on a free move-in rental, integer."
  free_move_in_window_days: "Calendar days before or after a storage unit move-in date within which the free move-in truck may be picked up, integer."
  free_move_in_waived_charges: "Charges waived on a free move-in rental, list of charge types."
  breakdown_credit_basis: "How a rental interrupted by mechanical breakdown is credited, enum string."
  roadside_assistance_included: "Whether 24-hour roadside assistance is included, boolean."
  towing_hitch_included: "Whether the vehicle has a towing hitch for a rented trailer or auto transport, boolean."
  cargo_capacity_cuft: "Usable cargo volume, cubic feet."
  max_load_lbs: "Maximum payload, pounds."
  loading_ramp: "Whether a pull-out loading ramp is fitted, boolean."
  passenger_seats: "Seats in the cab including the driver, integer."
  accessory_dolly_fee_usd: "Fee per rental for a utility or appliance dolly, USD."
  accessory_pads_fee_usd: "Fee per rental for one dozen furniture pads, USD."

