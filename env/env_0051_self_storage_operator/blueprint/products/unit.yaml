# Policy charter: storage unit rental agreements (enclosed units by climate class).
category: unit
display_name: Self-Storage Unit Rental Agreement

binding:
  holding_table: unit_rentals
  event_tables: [unit_ledger, unit_lien_actions, unit_rate_changes, unit_transfers]
  intake_tables: [unit_moveout_notices]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: rent_balance, deposit_held: security_deposit}

lifecycle:
  states: [reserved, active, delinquent, lien_noticed, auction_scheduled, moving_out, vacated, sold_at_lien_sale, reservation_cancelled]
  transitions:
    - {from: reserved, to: active, by: user, means: "The customer signs the month-to-month rental agreement at move-in and takes possession of the unit."}
    - {from: reserved, to: reservation_cancelled, by: user, means: "The customer cancels an unclaimed reservation."}
    - {from: reserved, to: reservation_cancelled, by: system, means: "An unclaimed reservation lapses at the end of its hold period."}
    - {from: active, to: delinquent, by: system, means: "Rent for a billing period is still unpaid when that period's grace period ends."}
    - {from: delinquent, to: active, by: system, means: "The delinquent balance is paid in full before any lien notice is sent."}
    - {from: delinquent, to: lien_noticed, by: system, means: "The statutory lien notice is sent for the unpaid balance."}
    - {from: lien_noticed, to: active, by: system, means: "The tenant redeems by paying the full balance, including lien fees, after the lien notice."}
    - {from: lien_noticed, to: auction_scheduled, by: system, means: "The lien sale is advertised and a sale date is set."}
    - {from: auction_scheduled, to: active, by: system, means: "The tenant redeems by paying the full balance before the lien sale opens."}
    - {from: auction_scheduled, to: sold_at_lien_sale, by: system, means: "The contents are sold at the advertised lien sale and the agreement ends."}
    - {from: active, to: moving_out, by: user, means: "The tenant gives notice to end the agreement on a planned vacate date."}
    - {from: delinquent, to: moving_out, by: user, means: "A delinquent tenant gives notice to end the agreement; the unpaid balance stays owed."}
    - {from: moving_out, to: active, by: user, means: "The tenant withdraws the move-out notice of a rental that owes nothing."}
    - {from: moving_out, to: delinquent, by: user, means: "The tenant withdraws the move-out notice of a rental that still carries past-due rent."}
    - {from: moving_out, to: vacated, by: agent, means: "The facility confirms the unit is empty and the tenant lock is removed, ending the agreement."}

accounts:
  - key: rent_balance
    unit: USD
    meaning: "Amount the tenant owes on the rental agreement: rent and fees increase it; payments, credits and applied sale proceeds decrease it; a negative value is a credit balance owed back to the tenant."
  - key: security_deposit
    unit: USD
    meaning: "Refundable security deposit the company holds for the rental agreement (collected at move-in for unit classes that carry one)."

parameter_schema:
  admin_fee_usd: "One-time administrative fee charged at move-in, USD."
  security_deposit_usd: "Refundable security deposit collected at move-in, USD; 0.0 means the class carries no deposit."
  reservation_hold_days: "Calendar days a free reservation holds the unit after the reservation date, integer."
  first_month_discount_pct: "Move-in discount on the first billing period's rent, fraction of monthly rent (0.5 = half off); 0.0 means no move-in discount."
  military_discount_pct: "Standing discount on every billing period's rent for a tenant whose military discount is applied, fraction of monthly rent."
  discount_stacking_rule: "How the move-in discount and the military discount combine on the first billing period, enum string (greater_of = only the larger applies)."
  move_in_id_required: "Identity document the tenant must present at move-in, enum string."
  lease_term_basis: "Term of the rental agreement, enum string (month_to_month)."
  billing_cycle_basis: "How rent due dates are set, enum string (anniversary = due on the move-in day of each month)."
  grace_period_days: "Calendar days after a rent due date during which rent may be paid without a late fee, integer."
  late_fee_flat_usd: "Flat late fee floor, USD."
  late_fee_pct_of_rent: "Late fee as a fraction of the monthly rent; the greater of this and the flat floor applies, fraction."
  late_fee_max_usd: "Ceiling on one late fee, USD."
  second_late_fee_days_after_due: "Calendar days after the rent due date at which a second late fee is assessed if the period's rent is still unpaid, integer."
  second_late_fee_usd: "Second late fee for the same billing period, USD."
  courtesy_waivers_per_12_months: "Courtesy late-fee waivers allowed per rental agreement in any rolling 365-day window, integer."
  courtesy_waiver_min_tenure_months: "Calendar months since move-in before a tenant may receive a courtesy waiver, integer."
  partial_payment_accepted_while_delinquent: "Whether a payment smaller than the balance due is accepted while the rental is delinquent, boolean."
  partial_payment_accepted_after_lien_notice: "Whether a payment smaller than the balance due is accepted once a lien notice has been sent, boolean."
  payment_application_order: "Order in which a payment is applied to open charges on one rental, enum string."
  accepted_phone_payment_methods: "Payment methods the care center can take over the phone, list of enum strings."
  returned_payment_fee_usd: "Fee charged when a payment is returned unpaid by the bank for insufficient funds or a closed account, USD."
  overlock_days_after_due: "Calendar days after the due date of the oldest unpaid period at which the company overlocks the unit, integer."
  overlock_fee_usd: "Fee charged when the company overlock is applied, USD."
  preliminary_notice_days_after_due: "Calendar days after the due date of the oldest unpaid period at which the preliminary lien letter is sent, integer."
  lien_notice_days_after_due: "Calendar days after the due date of the oldest unpaid period at which the formal lien notice may be sent, integer."
  lien_notice_fee_usd: "Fee charged when the formal lien notice is sent, USD."
  auction_advertisement_days_after_lien_notice: "Calendar days after the lien notice date at which the lien sale may be advertised, integer."
  auction_advertisement_fee_usd: "Fee charged when the lien sale is advertised, USD."
  lien_sale_min_days_after_advertisement: "Calendar days after the advertisement date before the lien sale may be held, integer."
  lien_notice_delivery_method: "Delivery method for the formal lien notice, enum string."
  lock_cut_fee_usd: "Fee charged when the tenant lock is cut to inventory contents ahead of the lien sale, USD."
  redemption_requires_full_balance: "Whether redemption after a lien notice requires the full balance including lien fees, boolean."
  sale_surplus_hold_days: "Calendar days lien-sale surplus proceeds are held for the former tenant to claim, integer."
  rate_increase_first_eligible_months: "Calendar months after move-in before the first existing-customer rate increase notice may be sent, integer."
  rate_increase_min_interval_months: "Calendar months that must pass after the last rent change before another rate increase notice may be sent, integer."
  rate_increase_max_pct: "Largest single existing-customer rate increase, fraction of the current monthly rent."
  rate_increase_notice_days: "Calendar days of written notice before an increased rent takes effect, integer."
  retention_concession_pct_of_increase: "Share of a noticed increase the care center may give back as a retention concession, fraction."
  retention_concessions_per_12_months: "Retention concessions allowed per rental agreement in any rolling 365-day window, integer."
  retention_request_window_days: "Calendar days after the rate increase notice date within which the tenant may ask for a retention concession, integer."
  transfer_fee_usd: "Fee for transferring the agreement to another unit at the same facility, USD."
  transfers_per_12_months: "Unit transfers allowed per rental agreement in any rolling 365-day window, integer."
  transfer_rent_basis: "How the monthly rent is set on the new unit after a transfer, enum string."
  transfer_overlap_days: "Calendar days after the transfer date the tenant may keep using the old unit to move goods, without rent on the old unit, integer."
  transfer_resets_rate_clock: "Whether a transfer counts as a rent change for the rate-increase interval, boolean."
  moveout_notice_days: "Calendar days of notice required between the move-out notice date and the planned vacate date, integer."
  moveout_prorated_refund: "Whether unused days of the final paid billing period are credited at move-out, boolean."
  cleaning_fee_usd: "Fee charged when the facility walk-through finds debris or belongings left in the vacated unit, USD."
  lock_left_removal_fee_usd: "Fee charged when the tenant lock is left on a unit the tenant reports as vacated, USD."
  deposit_refund_days: "Calendar days after the vacate date by which the security deposit balance is released, integer."
  credit_balance_refund_days: "Calendar days after the vacate date by which a credit balance is refunded, integer."
  temperature_range_f: "Temperature band the unit class is held within, degrees Fahrenheit, enum string."
  humidity_control: "Relative humidity control of the unit class, enum string."
  door_alarm_included: "Whether an individual door alarm is included, boolean."
  access_hours: "Gate access hours for the unit class, enum string."
  drive_up_access: "Whether a vehicle can park directly at the unit door, boolean."
  min_protection_coverage_usd: "Minimum contents coverage the tenant must carry for this unit class, USD."
  own_insurance_proof_accepted: "Whether proof of the tenant's own homeowner's or renter's policy may satisfy the coverage requirement, boolean."

