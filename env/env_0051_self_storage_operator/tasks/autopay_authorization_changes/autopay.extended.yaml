extended_policies:
  - id: autopay_ext_unit_draft_notice
    base_policy_refs: [autopay_evt_varying_amount_notice, autopay_evt_expiry_reminders, autopay_evt_draft_amount_timing]
    overwrite:
      - base_policy: autopay_evt_draft_amount_timing
        superseded_clause: >-
          The draft collects the agreement's full balance due on the draft date (draft_amount_basis), including past-due rent and fees
        replaced_by: >-
          A bank-account draft, which runs before its due date, collects the rent charge of that due date together with the balance due on the draft date.
    trigger: state_due
    subject: [autopay_notice]
    computes: notified_amount
    target_tool: send_unit_varying_amount_notice_30e2b3fb
    params: {}
    rule: >-
      A varying-amount notice on a storage unit AutoPay authorization is sent for a method whose varying_amount_notice_days is above
      zero and states the unit notice amount, which is the amount the draft for the noticed due date will collect. The noticed due date
      is the authorization's next draft due date, and the notice is sent only when that due date less draft_days_before_due falls at
      least varying_amount_notice_days calendar days after the handling date. A bank-account draft, which runs before its due date,
      collects the rent charge of that due date together with the balance due on the draft date. The latest submitted draft is the
      draft attempt on the authorization with the latest draft date; while its result is still empty it is in flight and counts at its
      submitted amount, unless a lien notice fee is posted for the current delinquency, in which case the draft is refused as a partial
      payment and counts as nothing. A payment is applied to the oldest charges first, so the in-flight draft and then any catch-up
      amount on the notice history for the oldest unpaid due date first pay the balance due on the handling date, and only what is left
      of them reaches the in-flight draft's own due date. The unit notice amount is the agreement's contracted monthly rent for the
      noticed due date, plus the past-due balance left after the in-flight draft is applied, plus the contracted monthly rent of the
      in-flight draft's own due date less the part of the in-flight draft and of the catch-up amount left over after the past-due
      balance, all added together and rounded to the cent once; each partial figure is rounded to the cent. A notice is sent only for an
      amount not above draft_cap_usd.
      The unit notice amount is fixed only after every unit draft returned for insufficient or uncollected funds that may not be
      presented again carries a catch-up amount on the authorization's notice history for the agreement's oldest unpaid due date.
      The rent in force on a due date is the new rent of the most recently noticed retention concession on the agreement where its
      effective date is on or before that due date and no rescission is recorded on the agreement; where that does not hold, the new rent
      of the most recently noticed existing-customer rate increase where its effective date is on or before that due date and no
      rescission is recorded; and otherwise the contracted monthly rent. The unit notice amount carries the rent in force on the noticed
      due date and on the in-flight draft's due date in place of the contracted monthly rent.
      The unit notice amount charges for each of those two due dates nothing where the agreement is moving_out and its planned vacate
      date is on or before that due date, because that period is not charged; the rent in force less military_discount_pct, rounded to
      the cent, where the military discount is applied; and otherwise the rent in force as it stands.
      The past-due balance the unit notice amount carries is nothing where the catch-up amount on the notice history for the oldest
      unpaid due date is at least the past-due balance left after the in-flight draft; that past-due balance less the catch-up amount
      where a smaller catch-up amount is on record; and otherwise the whole past-due balance left after the in-flight draft.
      Where rent of the in-flight draft's due date is left unpaid, it stays unpaid past the grace period and past
      second_late_fee_days_after_due before the noticed draft runs, so the unit notice amount adds projected late fees of nothing where
      no such rent is left unpaid, and otherwise a late fee plus second_late_fee_usd, the late fee being late_fee_max_usd when
      late_fee_pct_of_rent times the rent in force on the in-flight draft's due date, rounded to the cent, is above late_fee_max_usd,
      that percentage amount when it is above late_fee_flat_usd, and late_fee_flat_usd otherwise.
      The unit notice amount adds projected lien-process fees of overlock_fee_usd where rent of the in-flight draft's due date is left
      unpaid and no past-due balance is carried, because that period opens a new delinquency whose overlock day falls before the noticed
      draft; lien_notice_fee_usd where a past-due balance is carried, no lien notice fee is yet posted for the current delinquency, and
      the oldest unpaid due date plus lien_notice_days_after_due falls on or before the noticed due date less draft_days_before_due; and
      otherwise nothing.
    prerequisite:
      - problem: autopay_ext_unit_ach_catchup
        kind: value_input
        gate: carried_balance
        form: state
        policy_source: >-
          The unit notice amount is fixed only after every unit draft returned for insufficient or uncollected funds that may not be
          presented again carries a catch-up amount on the authorization's notice history for the agreement's oldest unpaid due date.
        condition: >-
          For every draft on the unit authorization returned for insufficient or uncollected funds whose due date has used
          max_represents_per_entry re-presentments, the authorization's notice history holds a varying-amount notice whose related due
          date is the agreement's oldest unpaid due date (delinquent_since) and whose notified amount is the catch-up amount.
        resolved_by: approve_unit_returned_draft_catchup_31270510
        effect: >-
          The catch-up amount on the notice history for the oldest unpaid due date is read by the past-due carry: when it is at least
          the past-due balance left after the in-flight draft, nothing is carried, and the projected lien-process fee switches from the
          lien notice fee to the overlock fee of the new delinquency.
    cross_category:
      - category: unit
        as: history
        reads: [monthly_rent, balance_due, delinquent_since, status, move_out_date, military_discount_applied, unit_rate_changes.effective_date, unit_rate_changes.new_rent, unit_rate_changes.change_reason, unit_ledger.fee_type]
        note: The rent, rent-charge, past-due carry and projected fee factors read the covered storage unit agreement, its rate changes and its ledger.
    compute:
      - next_due: "F('next_draft_due_date')"
      - contracted_rent: "CFIELD('unit', 'monthly_rent', rental_id=F('agreement_id'))"
      - rescissions: "XCOUNT('unit', 'unit_rate_changes', rental_id=F('agreement_id'), change_reason='increase_rescinded')"
      - concession_effective: "XLATEST('unit', 'unit_rate_changes', 'effective_date', date_field='notice_date', rental_id=F('agreement_id'), change_reason='retention_concession')"
      - concession_rent: "XLATEST('unit', 'unit_rate_changes', 'new_rent', date_field='notice_date', rental_id=F('agreement_id'), change_reason='retention_concession')"
      - increase_effective: "XLATEST('unit', 'unit_rate_changes', 'effective_date', date_field='notice_date', rental_id=F('agreement_id'), change_reason='existing_customer_rate_increase')"
      - increase_rent: "XLATEST('unit', 'unit_rate_changes', 'new_rent', date_field='notice_date', rental_id=F('agreement_id'), change_reason='existing_customer_rate_increase')"
      - noticed_rent: "concession_rent if (concession_effective and rescissions == 0 and concession_effective <= next_due) else (increase_rent if (increase_effective and rescissions == 0 and increase_effective <= next_due) else contracted_rent)"
      - military_pct: "CPARAM('unit', 'military_discount_pct', rental_id=F('agreement_id'))"
      - military_on: "CFIELD('unit', 'military_discount_applied', rental_id=F('agreement_id')) == True"
      - agreement_status: "CFIELD('unit', 'status', rental_id=F('agreement_id'))"
      - vacate_date: "CFIELD('unit', 'move_out_date', rental_id=F('agreement_id'))"
      - noticed_charge: "0 if (agreement_status == 'moving_out' and vacate_date != '' and vacate_date <= next_due) else (RND(noticed_rent * (1 - military_pct), 2) if military_on else noticed_rent)"
      - balance_today: "CFIELD('unit', 'balance_due', rental_id=F('agreement_id'))"
      - delinquency_anchor: "CFIELD('unit', 'delinquent_since', rental_id=F('agreement_id'))"
      - latest_due: "LATEST('autopay_drafts', 'due_date', date_field='draft_date', event_type='autopay_draft')"
      - latest_amount: "LATEST('autopay_drafts', 'amount', date_field='draft_date', event_type='autopay_draft')"
      - latest_result: "LATEST('autopay_drafts', 'result', date_field='draft_date', event_type='autopay_draft')"
      - lien_fee_posted: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='lien_notice_fee', period_start=delinquency_anchor)"
      - in_flight: "latest_amount if (latest_result == '' and lien_fee_posted == 0) else 0"
      - pastdue_left: "RND(MX(0, balance_today - in_flight), 2)"
      - catchup_on_record: "SUM('autopay_notices', 'notified_amount', notice_type='varying_amount_notice', related_due_date=delinquency_anchor)"
      - carried_balance: "0 if (catchup_on_record > 0 and catchup_on_record >= pastdue_left) else ((pastdue_left - catchup_on_record) if catchup_on_record > 0 else pastdue_left)"
      - latest_rent: "concession_rent if (concession_effective and rescissions == 0 and concession_effective <= latest_due) else (increase_rent if (increase_effective and rescissions == 0 and increase_effective <= latest_due) else contracted_rent)"
      - latest_charge: "0 if (agreement_status == 'moving_out' and vacate_date != '' and vacate_date <= latest_due) else (RND(latest_rent * (1 - military_pct), 2) if military_on else latest_rent)"
      - catchup_excess: "RND(MX(0, catchup_on_record - pastdue_left), 2)"
      - latest_unpaid: "RND(MX(0, latest_charge - MX(0, in_flight - balance_today) - catchup_excess), 2) if latest_result == '' else 0"
      - late_by_rent: "RND(CPARAM('unit', 'late_fee_pct_of_rent', rental_id=F('agreement_id')) * latest_rent, 2)"
      - projected_late_fees: "0 if latest_unpaid <= 0 else ((CPARAM('unit', 'late_fee_max_usd', rental_id=F('agreement_id')) if late_by_rent > CPARAM('unit', 'late_fee_max_usd', rental_id=F('agreement_id')) else (late_by_rent if late_by_rent > CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id')) else CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id')))) + CPARAM('unit', 'second_late_fee_usd', rental_id=F('agreement_id')))"
      - lien_day_reached: "delinquency_anchor != '' and DAYS(delinquency_anchor, next_due) - P('draft_days_before_due') >= CPARAM('unit', 'lien_notice_days_after_due', rental_id=F('agreement_id'))"
      - projected_lien_fees: "CPARAM('unit', 'overlock_fee_usd', rental_id=F('agreement_id')) if (latest_unpaid > 0 and carried_balance <= 0) else (CPARAM('unit', 'lien_notice_fee_usd', rental_id=F('agreement_id')) if (carried_balance > 0 and lien_fee_posted == 0 and lien_day_reached) else 0)"
      - result: "RND(noticed_charge + carried_balance + latest_unpaid + projected_late_fees + projected_lien_fees, 2)"
    compute_basis:
      next_due: "The noticed due date is the authorization's next draft due date"
      contracted_rent: "The unit notice amount is the agreement's contracted monthly rent for the noticed due date"
      rescissions: "no rescission is recorded on the agreement"
      concession_effective: "the new rent of the most recently noticed retention concession on the agreement where its effective date is on or before that due date"
      concession_rent: "the new rent of the most recently noticed retention concession on the agreement where its effective date is on or before that due date"
      increase_effective: "the new rent of the most recently noticed existing-customer rate increase where its effective date is on or before that due date"
      increase_rent: "the new rent of the most recently noticed existing-customer rate increase where its effective date is on or before that due date"
      noticed_rent: "The unit notice amount carries the rent in force on the noticed due date and on the in-flight draft's due date in place of the contracted monthly rent."
      military_pct: "less military_discount_pct, rounded to the cent, where the military discount is applied"
      military_on: "where the military discount is applied"
      agreement_status: "where the agreement is moving_out"
      vacate_date: "its planned vacate date is on or before that due date"
      noticed_charge: "The unit notice amount charges for each of those two due dates nothing where the agreement is moving_out and its planned vacate date is on or before that due date, because that period is not charged; the rent in force less military_discount_pct, rounded to the cent, where the military discount is applied; and otherwise the rent in force as it stands."
      balance_today: "first pay the balance due on the handling date"
      delinquency_anchor: "the agreement's oldest unpaid due date"
      latest_due: "The latest submitted draft is the draft attempt on the authorization with the latest draft date"
      latest_amount: "while its result is still empty it is in flight and counts at its submitted amount"
      latest_result: "while its result is still empty it is in flight"
      in_flight: "while its result is still empty it is in flight and counts at its submitted amount, unless a lien notice fee is posted for the current delinquency, in which case the draft is refused as a partial payment and counts as nothing"
      pastdue_left: "A payment is applied to the oldest charges first, so the in-flight draft and then any catch-up amount on the notice history for the oldest unpaid due date first pay the balance due on the handling date, and only what is left of them reaches the in-flight draft's own due date."
      catchup_on_record: "the catch-up amount on the notice history for the oldest unpaid due date"
      carried_balance: "The past-due balance the unit notice amount carries is nothing where the catch-up amount on the notice history for the oldest unpaid due date is at least the past-due balance left after the in-flight draft; that past-due balance less the catch-up amount where a smaller catch-up amount is on record; and otherwise the whole past-due balance left after the in-flight draft."
      latest_rent: "The unit notice amount carries the rent in force on the noticed due date and on the in-flight draft's due date in place of the contracted monthly rent."
      latest_charge: "The unit notice amount charges for each of those two due dates nothing where the agreement is moving_out and its planned vacate date is on or before that due date, because that period is not charged; the rent in force less military_discount_pct, rounded to the cent, where the military discount is applied; and otherwise the rent in force as it stands."
      catchup_excess: "only what is left of them reaches the in-flight draft's own due date"
      latest_unpaid: "plus the contracted monthly rent of the in-flight draft's own due date less the part of the in-flight draft and of the catch-up amount left over after the past-due balance"
      late_by_rent: "late_fee_pct_of_rent times the rent in force on the in-flight draft's due date, rounded to the cent"
      projected_late_fees: "Where rent of the in-flight draft's due date is left unpaid, it stays unpaid past the grace period and past second_late_fee_days_after_due before the noticed draft runs, so the unit notice amount adds projected late fees of nothing where no such rent is left unpaid, and otherwise a late fee plus second_late_fee_usd, the late fee being late_fee_max_usd when late_fee_pct_of_rent times the rent in force on the in-flight draft's due date, rounded to the cent, is above late_fee_max_usd, that percentage amount when it is above late_fee_flat_usd, and late_fee_flat_usd otherwise."
      lien_fee_posted: "no lien notice fee is yet posted for the current delinquency"
      lien_day_reached: "the oldest unpaid due date plus lien_notice_days_after_due falls on or before the noticed due date less draft_days_before_due"
      projected_lien_fees: "The unit notice amount adds projected lien-process fees of overlock_fee_usd where rent of the in-flight draft's due date is left unpaid and no past-due balance is carried, because that period opens a new delinquency whose overlock day falls before the noticed draft; lien_notice_fee_usd where a past-due balance is carried, no lien notice fee is yet posted for the current delinquency, and the oldest unpaid due date plus lien_notice_days_after_due falls on or before the noticed due date less draft_days_before_due; and otherwise nothing."
      result: "all added together and rounded to the cent once; each partial figure is rounded to the cent"
    factors:
      - id: rent_in_force
        effect: parameter
        decides: noticed_rent
        bindings: [rescissions, concession_effective, concession_rent, increase_effective, increase_rent, noticed_rent, latest_rent]
        ladder:
          - when: "the most recently noticed retention concession has an effective date on or before the due date and no rescission is recorded on the agreement"
            value: "the concession's new rent"
          - when: "that does not hold, and the most recently noticed existing-customer rate increase has an effective date on or before the due date and no rescission is recorded"
            value: "the increase's new rent"
          - when: "otherwise"
            value: "the contracted monthly rent"
        baseline:
          noticed_rent: "contracted_rent"
          latest_rent: "contracted_rent"
        evidence: [cross_category, date]
        cross_difficulty: unit
      - id: noticed_period_charge
        effect: method
        decides: noticed_charge
        bindings: [military_pct, military_on, agreement_status, vacate_date, noticed_charge, latest_charge]
        ladder:
          - when: "the agreement is moving_out and its planned vacate date is on or before the period's due date"
            method: "the period is not charged; nothing enters for it"
          - when: "the military discount is applied on the agreement"
            method: "the rent in force times one minus military_discount_pct, rounded to the cent"
          - when: "otherwise"
            method: "the rent in force as it stands"
        baseline:
          noticed_charge: "noticed_rent"
          latest_charge: "latest_rent"
        evidence: [cross_category, date]
        cross_difficulty: unit
      - id: past_due_carry
        effect: method
        decides: carried_balance
        bindings: [catchup_on_record, carried_balance]
        ladder:
          - when: "the catch-up amount on the notice history for the oldest unpaid due date is at least the past-due balance left after the in-flight draft"
            method: "nothing of the past-due balance is carried"
          - when: "a smaller catch-up amount is on record for that due date"
            method: "the past-due balance left after the in-flight draft less the catch-up amount is carried"
          - when: "otherwise"
            method: "the whole past-due balance left after the in-flight draft is carried"
        baseline:
          carried_balance: "pastdue_left"
        evidence: [history]
        cross_difficulty: null
      - id: projected_late_fees
        effect: parameter
        decides: projected_late_fees
        bindings: [late_by_rent, projected_late_fees]
        ladder:
          - when: "rent of the in-flight draft's due date is left unpaid and late_fee_pct_of_rent times its rent in force is above late_fee_max_usd"
            value: "late_fee_max_usd plus second_late_fee_usd"
          - when: "rent is left unpaid and that percentage amount is above late_fee_flat_usd but not above late_fee_max_usd"
            value: "the percentage amount plus second_late_fee_usd"
          - when: "rent is left unpaid and that percentage amount is not above late_fee_flat_usd"
            value: "late_fee_flat_usd plus second_late_fee_usd"
          - when: "otherwise (no rent of that due date left unpaid)"
            value: "nothing"
        baseline:
          projected_late_fees: "0"
        evidence: [cross_category]
        cross_difficulty: unit
      - id: projected_lien_fees
        effect: parameter
        decides: projected_lien_fees
        bindings: [lien_fee_posted, lien_day_reached, projected_lien_fees]
        ladder:
          - when: "rent of the in-flight draft's due date is left unpaid and no past-due balance is carried"
            value: "overlock_fee_usd"
          - when: "a past-due balance is carried, no lien notice fee is posted for the current delinquency, and its lien notice day falls on or before the noticed draft date"
            value: "lien_notice_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          projected_lien_fees: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: unit
    baseline:
      rule: >-
        A varying-amount notice on a storage unit AutoPay authorization is sent for a method whose varying_amount_notice_days is above
        zero and states the unit notice amount, which is the amount the draft for the noticed due date will collect. The noticed due
        date is the authorization's next draft due date, and the notice is sent only when that due date less draft_days_before_due
        falls at least varying_amount_notice_days calendar days after the handling date. A bank-account draft, which runs before its due
        date, collects the rent charge of that due date together with the balance due on the draft date. The latest submitted draft is
        the draft attempt on the authorization with the latest draft date; while its result is still empty it is in flight and counts at
        its submitted amount, unless a lien notice fee is posted for the current delinquency, in which case the draft is refused as a
        partial payment and counts as nothing. A payment is applied to the oldest charges first, so the in-flight draft and then any
        catch-up amount on the notice history for the oldest unpaid due date first pay the balance due on the handling date, and only
        what is left of them reaches the in-flight draft's own due date. The unit notice amount is the agreement's contracted monthly
        rent for the noticed due date, plus the past-due balance left after the in-flight draft is applied, plus the contracted monthly
