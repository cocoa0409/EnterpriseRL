        past-due balance, all added together and rounded to the cent once; each partial figure is rounded to the cent. A notice is sent
        only for an amount not above draft_cap_usd.
      params: [varying_amount_notice_days, draft_days_before_due, draft_cap_usd]
    inputs:
      history:
        - {table: autopay_notices, aggregate: sum, field: notified_amount, filters: {notice_type: varying_amount_notice}}
        - {table: autopay_drafts, aggregate: latest, field: amount, filters: {event_type: autopay_draft}}
        - {table: autopay_drafts, aggregate: latest, field: result, filters: {event_type: autopay_draft}}
        - {category: unit, table: unit_rate_changes, aggregate: latest, field: new_rent, filters: {change_reason: retention_concession}}
        - {category: unit, table: unit_rate_changes, aggregate: latest, field: new_rent, filters: {change_reason: existing_customer_rate_increase}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, filters: {fee_type: lien_notice_fee}}
      cross_category: [unit]
  - id: autopay_ext_unit_ach_catchup
    base_policy_refs: [autopay_evt_varying_amount_notice, autopay_evt_expiry_reminders, autopay_evt_retry_and_suspension, autopay_evt_returns]
    overwrite:
      - base_policy: autopay_evt_varying_amount_notice
        superseded_clause: >-
          For a method whose varying_amount_notice_days is above zero, a draft whose amount differs from the previous successful draft on
          the same authorization, for example after a rent change or because late fees are due, may be submitted only when the handling
          date is not earlier than the varying-amount notice date plus varying_amount_notice_days.
        replaced_by: >-
          A unit catch-up the tenant approves for a stated amount on a recorded call is a single entry authorized for that exact amount,
          so it is not held for varying_amount_notice_days and runs on the next banking day.
    trigger: on_request
    subject: [autopay_notice]
    computes: approved_amount
    target_tool: approve_unit_returned_draft_catchup_31270510
    params: {}
    rule: >-
      A tenant whose storage unit AutoPay draft on a bank account was returned unpaid for insufficient or uncollected funds, and whose
      returned entry may not be presented again, may approve on a recorded call a one-time catch-up draft from the same account for
      that due date on an authorization in active status; the approval is recorded on the authorization's notice history as a
      varying-amount notice for the returned due date stating the unit catch-up amount. A unit catch-up the tenant approves for a stated
      amount on a recorded call is a single entry authorized for that exact amount, so it is not held for varying_amount_notice_days
      and runs on the next banking day. The returned due date is the agreement's oldest unpaid due date. The unit catch-up amount is
      the rent charge of the returned due date, which is the contracted monthly rent less military_discount_pct where the military
      discount is applied, rounded to the cent.
      The unit catch-up amount adds returned_payment_fee_usd twice where two settled draft attempts are recorded for the returned due
      date, the original draft and its re-presentment, both returned since the due date is still unpaid; once where one settled
      attempt is recorded for it; and nothing otherwise.
      The late fee counted in the unit catch-up amount is late_fee_max_usd when late_fee_pct_of_rent times the contracted monthly rent,
      rounded to the cent, is above late_fee_max_usd; that percentage amount when it is above late_fee_flat_usd; and late_fee_flat_usd
      otherwise.
      The unit catch-up amount adds the returned period's late fees: the late fee plus second_late_fee_usd where a second late fee is
      posted for the returned due date; the late fee alone where only a late fee is posted for it; and nothing where neither is posted.
      The unit catch-up amount adds the lien-process fees of the delinquency: overlock_fee_usd plus lien_notice_fee_usd where a lien
      notice fee is posted against the returned due date; overlock_fee_usd alone where only an overlock fee is posted against it; and
      nothing otherwise.
      The unit catch-up amount leaves out a fee the tenant was excused from: second_late_fee_usd where the latest courtesy late-fee
      waiver was credited against the returned period's second late fee; the late fee where it was credited against the returned
      period's first late fee; and nothing otherwise.
      The latest submitted draft on the authorization, the draft attempt with the latest draft date, is in flight when it is for a due date later than the returned due date and its result is still empty. Because a payment is applied
      to the oldest charges first, the unit catch-up amount nets an in-flight draft as follows: where no lien notice fee is posted for
      the returned due date, the in-flight draft's submitted amount is subtracted, since it will first pay the returned period's
      charges; where a lien notice fee is posted, the in-flight draft is refused as a partial payment, so its submitted amount is added
      and the catch-up covers what that draft would have paid; and where no draft is in flight, nothing is netted.
      The rent charge, the returned-payment fees, the late fees and the lien-process fees are added together, the fee left out is
      subtracted, the in-flight netting is applied, and the result, never below zero, is rounded to the cent once.
    prerequisite: []
    cross_category:
      - category: unit
        as: history
        reads: [monthly_rent, delinquent_since, military_discount_applied, unit_ledger.fee_type, unit_ledger.period_start, unit_ledger.credit_type, unit_ledger.reference_entry_id]
        note: The late-fee, lien-process and waiver factors read the covered storage unit agreement and its ledger.
    compute:
      - returned_due: "CFIELD('unit', 'delinquent_since', rental_id=F('agreement_id'))"
      - contracted_rent: "CFIELD('unit', 'monthly_rent', rental_id=F('agreement_id'))"
      - rent_charge: "RND(contracted_rent * (1 - CPARAM('unit', 'military_discount_pct', rental_id=F('agreement_id'))), 2) if CFIELD('unit', 'military_discount_applied', rental_id=F('agreement_id')) == True else contracted_rent"
      - settled_attempts: "COUNT('autopay_drafts', event_type='autopay_draft', due_date=returned_due, result='ach_settled')"
      - returned_fees: "2 * CPARAM('unit', 'returned_payment_fee_usd', rental_id=F('agreement_id')) if settled_attempts >= 2 else (CPARAM('unit', 'returned_payment_fee_usd', rental_id=F('agreement_id')) if settled_attempts == 1 else 0)"
      - late_by_rent: "RND(CPARAM('unit', 'late_fee_pct_of_rent', rental_id=F('agreement_id')) * contracted_rent, 2)"
      - late_fee_amount: "CPARAM('unit', 'late_fee_max_usd', rental_id=F('agreement_id')) if late_by_rent > CPARAM('unit', 'late_fee_max_usd', rental_id=F('agreement_id')) else (late_by_rent if late_by_rent > CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id')) else CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id')))"
      - second_posted: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='second_late_fee', period_start=returned_due)"
      - late_posted: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='late_fee', period_start=returned_due)"
      - period_late_fees: "(late_fee_amount + CPARAM('unit', 'second_late_fee_usd', rental_id=F('agreement_id'))) if second_posted > 0 else (late_fee_amount if late_posted > 0 else 0)"
      - lien_posted: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='lien_notice_fee', period_start=returned_due)"
      - overlock_posted: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='overlock_fee', period_start=returned_due)"
      - lien_process_fees: "(CPARAM('unit', 'overlock_fee_usd', rental_id=F('agreement_id')) + CPARAM('unit', 'lien_notice_fee_usd', rental_id=F('agreement_id'))) if lien_posted > 0 else (CPARAM('unit', 'overlock_fee_usd', rental_id=F('agreement_id')) if overlock_posted > 0 else 0)"
      - waived_entry: "XLATEST('unit', 'unit_ledger', 'reference_entry_id', date_field='entry_date', rental_id=F('agreement_id'), event_type='unit_credit', credit_type='courtesy_late_fee_waiver')"
      - waived_fee_type: "XLATEST('unit', 'unit_ledger', 'fee_type', date_field='entry_date', entry_id=waived_entry)"
      - waived_period: "XLATEST('unit', 'unit_ledger', 'period_start', date_field='entry_date', entry_id=waived_entry)"
      - fee_left_out: "CPARAM('unit', 'second_late_fee_usd', rental_id=F('agreement_id')) if (waived_fee_type == 'second_late_fee' and waived_period == returned_due) else (late_fee_amount if (waived_fee_type == 'late_fee' and waived_period == returned_due) else 0)"
      - latest_due: "LATEST('autopay_drafts', 'due_date', date_field='draft_date', event_type='autopay_draft')"
      - latest_amount: "LATEST('autopay_drafts', 'amount', date_field='draft_date', event_type='autopay_draft')"
      - latest_result: "LATEST('autopay_drafts', 'result', date_field='draft_date', event_type='autopay_draft')"
      - in_flight: "latest_amount if (latest_result == '' and latest_due > returned_due) else 0"
      - in_flight_netting: "in_flight if (in_flight > 0 and lien_posted == 0) else ((0 - in_flight) if (in_flight > 0 and lien_posted > 0) else 0)"
      - result: "MX(0, RND(rent_charge + returned_fees + period_late_fees + lien_process_fees - fee_left_out - in_flight_netting, 2))"
    compute_basis:
      returned_due: "The returned due date is the agreement's oldest unpaid due date."
      contracted_rent: "the contracted monthly rent"
      rent_charge: "The unit catch-up amount is the rent charge of the returned due date, which is the contracted monthly rent less military_discount_pct where the military discount is applied, rounded to the cent."
      settled_attempts: "where two settled draft attempts are recorded for the returned due date, the original draft and its re-presentment, both returned since the due date is still unpaid; once where one settled attempt is recorded for it"
      returned_fees: "The unit catch-up amount adds returned_payment_fee_usd twice where two settled draft attempts are recorded for the returned due date, the original draft and its re-presentment, both returned since the due date is still unpaid; once where one settled attempt is recorded for it; and nothing otherwise."
      late_by_rent: "late_fee_pct_of_rent times the contracted monthly rent, rounded to the cent"
      late_fee_amount: "The late fee counted in the unit catch-up amount is late_fee_max_usd when late_fee_pct_of_rent times the contracted monthly rent, rounded to the cent, is above late_fee_max_usd; that percentage amount when it is above late_fee_flat_usd; and late_fee_flat_usd otherwise."
      second_posted: "where a second late fee is posted for the returned due date"
      late_posted: "where only a late fee is posted for it"
      period_late_fees: "The unit catch-up amount adds the returned period's late fees: the late fee plus second_late_fee_usd where a second late fee is posted for the returned due date; the late fee alone where only a late fee is posted for it; and nothing where neither is posted."
      lien_posted: "where a lien notice fee is posted against the returned due date"
      overlock_posted: "where only an overlock fee is posted against it"
      lien_process_fees: "The unit catch-up amount adds the lien-process fees of the delinquency: overlock_fee_usd plus lien_notice_fee_usd where a lien notice fee is posted against the returned due date; overlock_fee_usd alone where only an overlock fee is posted against it; and nothing otherwise."
      waived_entry: "where the latest courtesy late-fee waiver was credited against the returned period's second late fee"
      waived_fee_type: "credited against the returned period's second late fee; the late fee where it was credited against the returned period's first late fee"
      waived_period: "against the returned period's second late fee"
      fee_left_out: "The unit catch-up amount leaves out a fee the tenant was excused from: second_late_fee_usd where the latest courtesy late-fee waiver was credited against the returned period's second late fee; the late fee where it was credited against the returned period's first late fee; and nothing otherwise."
      latest_due: "The latest submitted draft on the authorization, the draft attempt with the latest draft date, is in flight when it is for a due date later than the returned due date and its result is still empty."
      latest_amount: "the in-flight draft's submitted amount"
      latest_result: "its result is still empty"
      in_flight: "The latest submitted draft on the authorization, the draft attempt with the latest draft date, is in flight when it is for a due date later than the returned due date and its result is still empty."
      in_flight_netting: "Because a payment is applied to the oldest charges first, the unit catch-up amount nets an in-flight draft as follows: where no lien notice fee is posted for the returned due date, the in-flight draft's submitted amount is subtracted, since it will first pay the returned period's charges; where a lien notice fee is posted, the in-flight draft is refused as a partial payment, so its submitted amount is added and the catch-up covers what that draft would have paid; and where no draft is in flight, nothing is netted."
      result: "The rent charge, the returned-payment fees, the late fees and the lien-process fees are added together, the fee left out is subtracted, the in-flight netting is applied, and the result, never below zero, is rounded to the cent once."
    factors:
      - id: returned_payment_fees
        effect: parameter
        decides: returned_fees
        bindings: [settled_attempts, returned_fees]
        ladder:
          - when: "two settled draft attempts (the original draft and its re-presentment) are recorded for the returned due date"
            value: "two times returned_payment_fee_usd"
          - when: "one settled attempt is recorded for the returned due date"
            value: "returned_payment_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          returned_fees: "0"
        evidence: [history, cross_category]
        cross_difficulty: unit
      - id: catchup_late_fee_amount
        effect: parameter
        decides: late_fee_amount
        bindings: [late_by_rent, late_fee_amount]
        ladder:
          - when: "late_fee_pct_of_rent times the contracted monthly rent is above late_fee_max_usd"
            value: "late_fee_max_usd"
          - when: "that percentage amount is above late_fee_flat_usd but not above late_fee_max_usd"
            value: "the percentage amount, rounded to the cent"
          - when: "otherwise"
            value: "late_fee_flat_usd"
        baseline:
          late_fee_amount: "CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id'))"
        evidence: [cross_category]
        cross_difficulty: unit
      - id: returned_period_late_fees
        effect: parameter
        decides: period_late_fees
        bindings: [second_posted, late_posted, period_late_fees]
        ladder:
          - when: "a second late fee is posted on the ledger for the returned due date"
            value: "the late fee plus second_late_fee_usd"
          - when: "only a late fee is posted for the returned due date"
            value: "the late fee"
          - when: "otherwise"
            value: "nothing"
        baseline:
          period_late_fees: "0"
        evidence: [cross_category, history]
        cross_difficulty: unit
      - id: catchup_lien_process_fees
        effect: parameter
        decides: lien_process_fees
        bindings: [lien_posted, overlock_posted, lien_process_fees]
        ladder:
          - when: "a lien notice fee is posted against the returned due date"
            value: "overlock_fee_usd plus lien_notice_fee_usd"
          - when: "only an overlock fee is posted against the returned due date"
            value: "overlock_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          lien_process_fees: "0"
        evidence: [cross_category, history]
        cross_difficulty: unit
      - id: courtesy_waived_fee
        effect: parameter
        decides: fee_left_out
        bindings: [waived_entry, waived_fee_type, waived_period, fee_left_out]
        ladder:
          - when: "the latest courtesy late-fee waiver credit references the returned period's second late fee"
            value: "second_late_fee_usd is left out"
          - when: "the latest courtesy late-fee waiver credit references the returned period's first late fee"
            value: "the late fee is left out"
          - when: "otherwise"
            value: "nothing is left out"
        baseline:
          fee_left_out: "0"
        evidence: [cross_category, history]
        cross_difficulty: unit
      - id: in_flight_netting
        effect: method
        decides: in_flight_netting
        bindings: [latest_due, latest_amount, latest_result, in_flight, in_flight_netting]
        ladder:
          - when: "the latest submitted draft is in flight for a later due date and no lien notice fee is posted for the returned due date"
            method: "the in-flight draft's submitted amount is subtracted, because it first pays the returned period's charges"
          - when: "the latest submitted draft is in flight for a later due date and a lien notice fee is posted for the returned due date"
            method: "the in-flight draft is refused as a partial payment, so its submitted amount is added to the catch-up"
          - when: "otherwise (no draft in flight)"
            method: "nothing is netted"
        baseline:
          in_flight_netting: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A tenant whose storage unit AutoPay draft on a bank account was returned unpaid for insufficient or uncollected funds, and
        whose returned entry may not be presented again, may approve on a recorded call a one-time catch-up draft from the same account
        for that due date on an authorization in active status; the approval is recorded on the authorization's notice history as a
        varying-amount notice for the returned due date stating the unit catch-up amount. A unit catch-up the tenant approves for a
        stated amount on a recorded call is a single entry authorized for that exact amount, so it is not held for
        varying_amount_notice_days and runs on the next banking day. The returned due date is the agreement's oldest unpaid due date.
        The unit catch-up amount is the rent charge of the returned due date, which is the contracted monthly rent less
        military_discount_pct where the military discount is applied, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: autopay_drafts, aggregate: count, field: autopay_draft_id, filters: {event_type: autopay_draft, result: ach_settled}}
        - {table: autopay_drafts, aggregate: latest, field: amount, filters: {event_type: autopay_draft}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, filters: {fee_type: second_late_fee}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, filters: {fee_type: late_fee}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, filters: {fee_type: overlock_fee}}
        - {category: unit, table: unit_ledger, aggregate: latest, field: reference_entry_id, filters: {credit_type: courtesy_late_fee_waiver}}
      cross_category: [unit]
  - id: autopay_ext_unit_card_catchup
    base_policy_refs: [autopay_evt_varying_amount_notice, autopay_evt_expiry_reminders, autopay_evt_retry_and_suspension]
    overwrite: []
    trigger: on_request
    subject: [autopay_notice]
    computes: approved_amount
    target_tool: approve_card_catchup_charge_edda4662
    params: {}
    rule: >-
      A tenant whose storage unit AutoPay draft on a card was declined for insufficient funds or an expired card, on an authorization
      in active status, may approve on a recorded call a one-time catch-up charge to the same card for that due date, whether or not its
      retries are used; the approval is recorded on the authorization's notice history as a varying-amount notice for the declined due date stating the card catch-up
      charge, and the charge is submitted on the day after the handling date, so it covers the charges that will have posted by that
      charge day. The declined due date is the agreement's oldest unpaid due date. The card catch-up charge is the rent charge of the
      declined due date, which is the contracted monthly rent less military_discount_pct where the military discount is applied,
      rounded to the cent.
      The rent the card catch-up charge re-collects is nothing while a retry of the declined due date is still allowed, that is while
      fewer declined attempts (for insufficient funds or an expired card) than one plus max_retries_per_draft are recorded for it,
      because the retry collects it; the rent charge less the net direct payments where direct payments were taken at a facility
      office, by phone or online after the same calendar day of the previous month and up to the handling date, net meaning less the
      payment reversals posted on the agreement in that same window; and otherwise the whole rent charge.
      The card catch-up charge adds returned_payment_fee_usd twice where two returned-payment fees are posted on the agreement after
      the same calendar day of the previous month and up to the handling date, once where one is posted, and nothing otherwise.
      The late fee counted in the card catch-up charge is late_fee_max_usd when late_fee_pct_of_rent times the contracted monthly rent,
      rounded to the cent, is above late_fee_max_usd; that percentage amount when it is above late_fee_flat_usd; and late_fee_flat_usd
      otherwise.
      The card catch-up charge adds the declined period's late fees as they will stand on the charge day: the late fee plus
      second_late_fee_usd where a second late fee is posted for the declined due date or the charge day is at least
      second_late_fee_days_after_due calendar days after it; the late fee alone where only a late fee is posted or the charge day is
      more than grace_period_days calendar days after it; and nothing otherwise.
      The card catch-up charge adds the lien-process fees as they will stand on the charge day: overlock_fee_usd plus
      lien_notice_fee_usd where a lien notice fee is posted against the declined due date or the charge day is at least
      lien_notice_days_after_due calendar days after it; overlock_fee_usd alone where only an overlock fee is posted or the charge day
      is at least overlock_days_after_due calendar days after it; and nothing otherwise.
      The card catch-up charge leaves out a fee the tenant was excused from: second_late_fee_usd where the latest courtesy late-fee
      waiver was credited against the declined period's second late fee; the posted late fee where it was credited against the
      declined period's first late fee; and nothing otherwise.
      The re-collected rent, the returned-payment fees, the late fees and the lien-process fees are added together, the fee left out
      is subtracted, and the result, never below zero, is rounded to the cent once.
    prerequisite: []
    cross_category:
      - category: unit
        as: history
        reads: [monthly_rent, delinquent_since, military_discount_applied, unit_ledger.fee_type, unit_ledger.period_start, unit_ledger.payment_channel, unit_ledger.credit_type, unit_ledger.reference_entry_id, unit_ledger.amount]
        note: Every factor reads the storage unit agreement the card authorization drafts and its ledger.
    compute:
      - declined_due: "CFIELD('unit', 'delinquent_since', rental_id=F('agreement_id'))"
      - contracted_rent: "CFIELD('unit', 'monthly_rent', rental_id=F('agreement_id'))"
      - rent_charge: "RND(contracted_rent * (1 - CPARAM('unit', 'military_discount_pct', rental_id=F('agreement_id'))), 2) if CFIELD('unit', 'military_discount_applied', rental_id=F('agreement_id')) == True else contracted_rent"
      - declined_attempts: "COUNT('autopay_drafts', event_type='autopay_draft', due_date=declined_due, result='declined_insufficient_funds') + COUNT('autopay_drafts', event_type='autopay_draft', due_date=declined_due, result='declined_expired_card')"
      - direct_paid: "XSUM('unit', 'unit_ledger', 'amount', within_months=1, date_field='entry_date', rental_id=F('agreement_id'), event_type='unit_payment', payment_channel='facility_office') + XSUM('unit', 'unit_ledger', 'amount', within_months=1, date_field='entry_date', rental_id=F('agreement_id'), event_type='unit_payment', payment_channel='care_center_phone') + XSUM('unit', 'unit_ledger', 'amount', within_months=1, date_field='entry_date', rental_id=F('agreement_id'), event_type='unit_payment', payment_channel='online_portal')"
      - direct_reversed: "XSUM('unit', 'unit_ledger', 'amount', within_months=1, date_field='entry_date', rental_id=F('agreement_id'), event_type='unit_payment_reversal')"
      - card_rent_recollected: "0 if declined_attempts < 1 + P('max_retries_per_draft') else ((rent_charge - (direct_paid - direct_reversed)) if (direct_paid - direct_reversed) > 0 else rent_charge)"
      - returned_payment_fees_posted: "XCOUNT('unit', 'unit_ledger', within_months=1, date_field='entry_date', rental_id=F('agreement_id'), fee_type='returned_payment_fee')"
      - card_returned_fees: "2 * CPARAM('unit', 'returned_payment_fee_usd', rental_id=F('agreement_id')) if returned_payment_fees_posted >= 2 else (CPARAM('unit', 'returned_payment_fee_usd', rental_id=F('agreement_id')) if returned_payment_fees_posted == 1 else 0)"
      - charge_day_offset: "DAYS(declined_due, NOW) + 1"
      - late_by_rent: "RND(CPARAM('unit', 'late_fee_pct_of_rent', rental_id=F('agreement_id')) * contracted_rent, 2)"
      - charge_late_fee: "CPARAM('unit', 'late_fee_max_usd', rental_id=F('agreement_id')) if late_by_rent > CPARAM('unit', 'late_fee_max_usd', rental_id=F('agreement_id')) else (late_by_rent if late_by_rent > CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id')) else CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id')))"
      - second_due: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='second_late_fee', period_start=declined_due) > 0 or charge_day_offset >= CPARAM('unit', 'second_late_fee_days_after_due', rental_id=F('agreement_id'))"
      - first_due: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='late_fee', period_start=declined_due) > 0 or charge_day_offset > CPARAM('unit', 'grace_period_days', rental_id=F('agreement_id'))"
      - charge_late_fees: "(charge_late_fee + CPARAM('unit', 'second_late_fee_usd', rental_id=F('agreement_id'))) if second_due else (charge_late_fee if first_due else 0)"
      - lien_due: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='lien_notice_fee', period_start=declined_due) > 0 or charge_day_offset >= CPARAM('unit', 'lien_notice_days_after_due', rental_id=F('agreement_id'))"
      - overlock_due: "XCOUNT('unit', 'unit_ledger', rental_id=F('agreement_id'), fee_type='overlock_fee', period_start=declined_due) > 0 or charge_day_offset >= CPARAM('unit', 'overlock_days_after_due', rental_id=F('agreement_id'))"
      - charge_lien_fees: "(CPARAM('unit', 'overlock_fee_usd', rental_id=F('agreement_id')) + CPARAM('unit', 'lien_notice_fee_usd', rental_id=F('agreement_id'))) if lien_due else (CPARAM('unit', 'overlock_fee_usd', rental_id=F('agreement_id')) if overlock_due else 0)"
      - waiver_entry: "XLATEST('unit', 'unit_ledger', 'reference_entry_id', date_field='entry_date', rental_id=F('agreement_id'), event_type='unit_credit', credit_type='courtesy_late_fee_waiver')"
      - waiver_fee_type: "XLATEST('unit', 'unit_ledger', 'fee_type', date_field='entry_date', entry_id=waiver_entry)"
      - waiver_period: "XLATEST('unit', 'unit_ledger', 'period_start', date_field='entry_date', entry_id=waiver_entry)"
      - waiver_fee_amount: "XLATEST('unit', 'unit_ledger', 'amount', date_field='entry_date', entry_id=waiver_entry)"
      - card_fee_left_out: "CPARAM('unit', 'second_late_fee_usd', rental_id=F('agreement_id')) if (waiver_fee_type == 'second_late_fee' and waiver_period == declined_due) else (waiver_fee_amount if (waiver_fee_type == 'late_fee' and waiver_period == declined_due) else 0)"
      - result: "MX(0, RND(card_rent_recollected + card_returned_fees + charge_late_fees + charge_lien_fees - card_fee_left_out, 2))"
    compute_basis:
      declined_due: "The declined due date is the agreement's oldest unpaid due date."
      contracted_rent: "the contracted monthly rent"
      rent_charge: "The card catch-up charge is the rent charge of the declined due date, which is the contracted monthly rent less military_discount_pct where the military discount is applied, rounded to the cent."
      declined_attempts: "while fewer declined attempts (for insufficient funds or an expired card) than one plus max_retries_per_draft are recorded for it"
      direct_paid: "direct payments were taken at a facility office, by phone or online after the same calendar day of the previous month and up to the handling date"
      direct_reversed: "net meaning less the payment reversals posted on the agreement in that same window"
      card_rent_recollected: "The rent the card catch-up charge re-collects is nothing while a retry of the declined due date is still allowed, that is while fewer declined attempts (for insufficient funds or an expired card) than one plus max_retries_per_draft are recorded for it, because the retry collects it; the rent charge less the net direct payments where direct payments were taken at a facility office, by phone or online after the same calendar day of the previous month and up to the handling date, net meaning less the payment reversals posted on the agreement in that same window; and otherwise the whole rent charge."
      returned_payment_fees_posted: "where two returned-payment fees are posted on the agreement after the same calendar day of the previous month and up to the handling date, once where one is posted"
      card_returned_fees: "The card catch-up charge adds returned_payment_fee_usd twice where two returned-payment fees are posted on the agreement after the same calendar day of the previous month and up to the handling date, once where one is posted, and nothing otherwise."
      charge_day_offset: "the charge is submitted on the day after the handling date, so it covers the charges that will have posted by that charge day"
      late_by_rent: "late_fee_pct_of_rent times the contracted monthly rent, rounded to the cent"
      charge_late_fee: "The late fee counted in the card catch-up charge is late_fee_max_usd when late_fee_pct_of_rent times the contracted monthly rent, rounded to the cent, is above late_fee_max_usd; that percentage amount when it is above late_fee_flat_usd; and late_fee_flat_usd otherwise."
      second_due: "where a second late fee is posted for the declined due date or the charge day is at least second_late_fee_days_after_due calendar days after it"
      first_due: "where only a late fee is posted or the charge day is more than grace_period_days calendar days after it"
      charge_late_fees: "The card catch-up charge adds the declined period's late fees as they will stand on the charge day: the late fee plus second_late_fee_usd where a second late fee is posted for the declined due date or the charge day is at least second_late_fee_days_after_due calendar days after it; the late fee alone where only a late fee is posted or the charge day is more than grace_period_days calendar days after it; and nothing otherwise."
      lien_due: "where a lien notice fee is posted against the declined due date or the charge day is at least lien_notice_days_after_due calendar days after it"
      overlock_due: "where only an overlock fee is posted or the charge day is at least overlock_days_after_due calendar days after it"
      charge_lien_fees: "The card catch-up charge adds the lien-process fees as they will stand on the charge day: overlock_fee_usd plus lien_notice_fee_usd where a lien notice fee is posted against the declined due date or the charge day is at least lien_notice_days_after_due calendar days after it; overlock_fee_usd alone where only an overlock fee is posted or the charge day is at least overlock_days_after_due calendar days after it; and nothing otherwise."
      waiver_entry: "where the latest courtesy late-fee waiver was credited against the declined period's second late fee"
      waiver_fee_type: "credited against the declined period's second late fee; the posted late fee where it was credited against the declined period's first late fee"
      waiver_period: "against the declined period's first late fee"
      waiver_fee_amount: "the posted late fee"
      card_fee_left_out: "The card catch-up charge leaves out a fee the tenant was excused from: second_late_fee_usd where the latest courtesy late-fee waiver was credited against the declined period's second late fee; the posted late fee where it was credited against the declined period's first late fee; and nothing otherwise."
      result: "The re-collected rent, the returned-payment fees, the late fees and the lien-process fees are added together, the fee left out is subtracted, and the result, never below zero, is rounded to the cent once."
    factors:
      - id: card_rent_recollected
        effect: method
        decides: card_rent_recollected
        bindings: [declined_attempts, direct_paid, direct_reversed, card_rent_recollected]
        ladder:
          - when: "fewer declined attempts (insufficient funds or expired card) than one plus max_retries_per_draft are recorded for the declined due date"
            method: "no rent is re-collected; the remaining retry collects it"
          - when: "the retries are used and direct payments taken at a facility office, by phone or online after the same calendar day of the previous month remain after that window's payment reversals"
            method: "the rent charge less those net direct payments"
          - when: "otherwise"
            method: "the whole rent charge"
        baseline:
          card_rent_recollected: "rent_charge"
        evidence: [history, cross_category]
        cross_difficulty: unit
      - id: card_returned_payment_fees
        effect: parameter
        decides: card_returned_fees
        bindings: [returned_payment_fees_posted, card_returned_fees]
        ladder:
          - when: "two returned-payment fees are posted after the same calendar day of the previous month and up to the handling date"
            value: "two times returned_payment_fee_usd"
          - when: "one such fee is posted"
            value: "returned_payment_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          card_returned_fees: "0"
        evidence: [cross_category, history]
        cross_difficulty: unit
      - id: charge_late_fee_amount
        effect: parameter
        decides: charge_late_fee
        bindings: [late_by_rent, charge_late_fee]
        ladder:
          - when: "late_fee_pct_of_rent times the contracted monthly rent is above late_fee_max_usd"
            value: "late_fee_max_usd"
          - when: "that percentage amount is above late_fee_flat_usd but not above late_fee_max_usd"
            value: "the percentage amount, rounded to the cent"
          - when: "otherwise"
            value: "late_fee_flat_usd"
        baseline:
          charge_late_fee: "CPARAM('unit', 'late_fee_flat_usd', rental_id=F('agreement_id'))"
        evidence: [cross_category]
        cross_difficulty: unit
      - id: declined_period_late_fees
        effect: parameter
        decides: charge_late_fees
        bindings: [charge_day_offset, second_due, first_due, charge_late_fees]
        ladder:
          - when: "a second late fee is posted for the declined due date, or the charge day is at least second_late_fee_days_after_due days after it"
            value: "the late fee plus second_late_fee_usd"
          - when: "only a late fee is posted, or the charge day is more than grace_period_days days after the declined due date"
            value: "the late fee"
          - when: "otherwise"
            value: "nothing"
        baseline:
          charge_late_fees: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: unit
      - id: charge_lien_process_fees
        effect: parameter
        decides: charge_lien_fees
        bindings: [lien_due, overlock_due, charge_lien_fees]
        ladder:
          - when: "a lien notice fee is posted against the declined due date, or the charge day is at least lien_notice_days_after_due days after it"
            value: "overlock_fee_usd plus lien_notice_fee_usd"
          - when: "only an overlock fee is posted, or the charge day is at least overlock_days_after_due days after the declined due date"
            value: "overlock_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          charge_lien_fees: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: unit
      - id: card_waived_fee
        effect: parameter
        decides: card_fee_left_out
        bindings: [waiver_entry, waiver_fee_type, waiver_period, waiver_fee_amount, card_fee_left_out]
        ladder:
          - when: "the latest courtesy late-fee waiver credit references the declined period's second late fee"
            value: "second_late_fee_usd is left out"
          - when: "the latest courtesy late-fee waiver credit references the declined period's first late fee"
            value: "the posted late fee is left out"
          - when: "otherwise"
            value: "nothing is left out"
        baseline:
          card_fee_left_out: "0"
        evidence: [cross_category, history]
        cross_difficulty: unit
    baseline:
      rule: >-
        A tenant whose storage unit AutoPay draft on a card was declined for insufficient funds or an expired card, on an authorization
        in active status, may approve on a recorded call a one-time catch-up charge to the same card for that due date, whether or not its
        retries are used; the approval is recorded on the authorization's notice history as a varying-amount notice for the declined due date stating the card catch-up
        charge, and the charge is submitted on the day after the handling date, so it covers the charges that will have posted by that
        charge day. The declined due date is the agreement's oldest unpaid due date. The card catch-up charge is the rent charge of the
        declined due date, which is the contracted monthly rent less military_discount_pct where the military discount is applied,
        rounded to the cent.
      params: [max_retries_per_draft]
    inputs:
      history:
        - {table: autopay_drafts, aggregate: count, field: autopay_draft_id, filters: {event_type: autopay_draft, result: declined_insufficient_funds}}
        - {category: unit, table: unit_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: unit_payment}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 1, filters: {fee_type: returned_payment_fee}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, filters: {fee_type: late_fee}}
        - {category: unit, table: unit_ledger, aggregate: latest, field: reference_entry_id, filters: {credit_type: courtesy_late_fee_waiver}}
      cross_category: [unit]
  - id: autopay_ext_parking_draft_notice
    base_policy_refs: [autopay_evt_varying_amount_notice, autopay_evt_expiry_reminders, autopay_evt_draft_amount_timing]
    overwrite:
      - base_policy: autopay_evt_draft_amount_timing
        superseded_clause: >-
          The draft collects the agreement's full balance due on the draft date (draft_amount_basis), including past-due rent and fees
        replaced_by: >-
          A parking bank-account draft, which runs before its due date, collects the rent charge of that due date together with the balance due on the draft date.
    trigger: state_due
    subject: [autopay_notice]
    computes: notified_amount
    target_tool: send_parking_varying_amount_notice_109228c2
    params: {}
    rule: >-
      A varying-amount notice on a vehicle, RV or boat parking AutoPay authorization is sent for a method whose
      varying_amount_notice_days is above zero and states the parking notice amount, which is the amount the draft for the parking
      notice due date will collect. The parking notice due date is the authorization's next draft due date, and the notice is sent only
      when that due date less draft_days_before_due falls at least varying_amount_notice_days calendar days after the handling date. A
      parking bank-account draft, which runs before its due date, collects the rent charge of that due date together with the balance due
      on the draft date. The latest parking draft is the draft attempt on the authorization with the latest draft date; while its result
      is still empty it is in flight and counts at its submitted amount, unless a tow notice fee is posted for the current delinquency,
      in which case the draft is refused as a partial payment and counts as nothing. A parking payment is applied to the oldest charges
      first, so the in-flight parking draft and then any catch-up amount on the notice history for the parking agreement's oldest unpaid
      due date first pay the parking balance due on the handling date, and only what is left of them reaches the in-flight parking
      draft's own due date. The parking notice amount is the parking agreement's contracted monthly rent for the parking notice due
      date, plus the parking past-due balance left after the in-flight parking draft is applied, plus the contracted monthly rent of the
      in-flight parking draft's own due date less the part of the in-flight parking draft and of the catch-up amount left over after the
      past-due balance, all added together and rounded to the cent once; each partial figure is rounded to the cent. A parking notice is
      sent only for an amount not above draft_cap_usd.
      The parking notice amount is set only once every parking draft returned for insufficient or uncollected funds that may not be
      presented again carries a catch-up amount on the authorization's notice history for the parking agreement's oldest unpaid due date.
      No parking notice amount is fixed until every card draft on the tenant's storage unit AutoPay authorizations in active status that
      is still declined after its last retry carries a catch-up charge on that authorization's notice history.
      The parking rent in force on a due date is the new rent of the most recently noticed retention concession on the parking agreement
      where its effective date is on or before that due date and no rescission is recorded on the parking agreement; where that does not
      hold, the new rent of the most recently noticed existing-customer rate increase on the parking agreement where its effective date is
      on or before that due date and no rescission is recorded; and otherwise the parking agreement's contracted monthly rent. The parking
      notice amount carries the parking rent in force on the parking notice due date and on the in-flight parking draft's due date in
      place of the contracted monthly rent.
      The parking notice amount charges for each of those two due dates nothing where the parking agreement is moving_out and its planned
      vacate date is on or before that due date, because that period is not charged; the parking rent in force less
      military_discount_pct, rounded to the cent, where the military discount is applied; and otherwise the parking rent in force as it
      stands.
      The parking past-due balance the parking notice amount carries is nothing where the catch-up amount on the notice history for the
      parking agreement's oldest unpaid due date is at least the parking past-due balance left after the in-flight parking draft; that
      past-due balance less the catch-up amount where a smaller catch-up amount is on record; and otherwise the whole parking past-due
      balance left after the in-flight parking draft.
      Parking rent of the in-flight draft's due date that is left unpaid stays unpaid past the grace period before the parking notice
      draft runs, so the parking notice amount adds one projected parking late fee: late_fee_max_usd when late_fee_pct_of_rent times the
      parking rent in force on the in-flight draft's due date, rounded to the cent, is above late_fee_max_usd; that percentage amount
      when it is above late_fee_flat_usd; late_fee_flat_usd when it is not; and nothing where no parking rent of that due date is left
      unpaid.
    prerequisite:
      - problem: autopay_ext_parking_ach_catchup
        kind: value_input
        gate: carried_balance
        form: state
        policy_source: >-
          The parking notice amount is set only once every parking draft returned for insufficient or uncollected funds that may not be
          presented again carries a catch-up amount on the authorization's notice history for the parking agreement's oldest unpaid due
          date.
        condition: >-
          For every draft on the parking authorization returned for insufficient or uncollected funds whose due date has used
          max_represents_per_entry re-presentments, the authorization's notice history holds a varying-amount notice whose related due
          date is the parking agreement's oldest unpaid due date (delinquent_since) and whose notified amount is the catch-up amount.
        resolved_by: approve_parking_returned_draft_catchup_8c80cda9
        effect: >-
          The catch-up amount on the notice history for the oldest unpaid due date is read by the parking past-due carry: when it is at
          least the past-due balance left after the in-flight parking draft, nothing is carried.
      - problem: autopay_ext_unit_card_catchup
        kind: state_gate
        gate: autopay_notices.notified_amount
        form: state
        policy_source: >-
          No parking notice amount is fixed until every card draft on the tenant's storage unit AutoPay authorizations in active status
          that is still declined after its last retry carries a catch-up charge on that authorization's notice history.
        condition: >-
          For every card AutoPay authorization of the tenant on a storage unit agreement, in active status, that has a due date whose
          draft attempts are all declined with max_retries_per_draft retries used, the authorization's notice history holds a
          varying-amount notice for that due date carrying the catch-up charge.
        resolved_by: approve_card_catchup_charge_edda4662
        effect: >-
          Once the card catch-up charge is on the storage unit card authorization's notice history, the gate on fixing the parking
          notice amount holds; the amount itself is not changed by it.
    cross_category:
      - category: parking
        as: history
        reads: [monthly_rent, balance_due, delinquent_since, status, move_out_date, military_discount_applied, parking_rate_changes.effective_date, parking_rate_changes.new_rent, parking_rate_changes.change_reason]
        note: The rent, period-charge, carry and projected late fee factors read the covered parking agreement and its rate changes.
    compute:
      - next_due: "F('next_draft_due_date')"
      - contracted_rent: "CFIELD('parking', 'monthly_rent', parking_rental_id=F('agreement_id'))"
      - rescissions: "XCOUNT('parking', 'parking_rate_changes', parking_rental_id=F('agreement_id'), change_reason='increase_rescinded')"
      - concession_effective: "XLATEST('parking', 'parking_rate_changes', 'effective_date', date_field='notice_date', parking_rental_id=F('agreement_id'), change_reason='retention_concession')"
      - concession_rent: "XLATEST('parking', 'parking_rate_changes', 'new_rent', date_field='notice_date', parking_rental_id=F('agreement_id'), change_reason='retention_concession')"
      - increase_effective: "XLATEST('parking', 'parking_rate_changes', 'effective_date', date_field='notice_date', parking_rental_id=F('agreement_id'), change_reason='existing_customer_rate_increase')"
      - increase_rent: "XLATEST('parking', 'parking_rate_changes', 'new_rent', date_field='notice_date', parking_rental_id=F('agreement_id'), change_reason='existing_customer_rate_increase')"
      - noticed_rent: "concession_rent if (concession_effective and rescissions == 0 and concession_effective <= next_due) else (increase_rent if (increase_effective and rescissions == 0 and increase_effective <= next_due) else contracted_rent)"
      - military_pct: "CPARAM('parking', 'military_discount_pct', parking_rental_id=F('agreement_id'))"
      - military_on: "CFIELD('parking', 'military_discount_applied', parking_rental_id=F('agreement_id')) == True"
      - parking_status: "CFIELD('parking', 'status', parking_rental_id=F('agreement_id'))"
      - vacate_date: "CFIELD('parking', 'move_out_date', parking_rental_id=F('agreement_id'))"
      - noticed_charge: "0 if (parking_status == 'moving_out' and vacate_date != '' and vacate_date <= next_due) else (RND(noticed_rent * (1 - military_pct), 2) if military_on else noticed_rent)"
      - balance_today: "CFIELD('parking', 'balance_due', parking_rental_id=F('agreement_id'))"
      - delinquency_anchor: "CFIELD('parking', 'delinquent_since', parking_rental_id=F('agreement_id'))"
      - latest_due: "LATEST('autopay_drafts', 'due_date', date_field='draft_date', event_type='autopay_draft')"
      - latest_amount: "LATEST('autopay_drafts', 'amount', date_field='draft_date', event_type='autopay_draft')"
      - latest_result: "LATEST('autopay_drafts', 'result', date_field='draft_date', event_type='autopay_draft')"
      - tow_fee_posted: "XCOUNT('parking', 'parking_ledger', parking_rental_id=F('agreement_id'), fee_type='tow_notice_fee', period_start=delinquency_anchor)"
      - in_flight: "latest_amount if (latest_result == '' and tow_fee_posted == 0) else 0"
      - pastdue_left: "RND(MX(0, balance_today - in_flight), 2)"
      - catchup_on_record: "SUM('autopay_notices', 'notified_amount', notice_type='varying_amount_notice', related_due_date=delinquency_anchor)"
      - carried_balance: "0 if (catchup_on_record > 0 and catchup_on_record >= pastdue_left) else ((pastdue_left - catchup_on_record) if catchup_on_record > 0 else pastdue_left)"
      - latest_rent: "concession_rent if (concession_effective and rescissions == 0 and concession_effective <= latest_due) else (increase_rent if (increase_effective and rescissions == 0 and increase_effective <= latest_due) else contracted_rent)"
      - latest_charge: "0 if (parking_status == 'moving_out' and vacate_date != '' and vacate_date <= latest_due) else (RND(latest_rent * (1 - military_pct), 2) if military_on else latest_rent)"
      - catchup_excess: "RND(MX(0, catchup_on_record - pastdue_left), 2)"
      - latest_unpaid: "RND(MX(0, latest_charge - MX(0, in_flight - balance_today) - catchup_excess), 2) if latest_result == '' else 0"
      - late_by_rent: "RND(CPARAM('parking', 'late_fee_pct_of_rent', parking_rental_id=F('agreement_id')) * latest_rent, 2)"
      - projected_late_fee: "0 if latest_unpaid <= 0 else (CPARAM('parking', 'late_fee_max_usd', parking_rental_id=F('agreement_id')) if late_by_rent > CPARAM('parking', 'late_fee_max_usd', parking_rental_id=F('agreement_id')) else (late_by_rent if late_by_rent > CPARAM('parking', 'late_fee_flat_usd', parking_rental_id=F('agreement_id')) else CPARAM('parking', 'late_fee_flat_usd', parking_rental_id=F('agreement_id'))))"
      - result: "RND(noticed_charge + carried_balance + latest_unpaid + projected_late_fee, 2)"
    compute_basis:
      next_due: "The parking notice due date is the authorization's next draft due date"
      contracted_rent: "The parking notice amount is the parking agreement's contracted monthly rent for the parking notice due date"
      rescissions: "no rescission is recorded on the parking agreement"
      concession_effective: "the new rent of the most recently noticed retention concession on the parking agreement where its effective date is on or before that due date"
      concession_rent: "the new rent of the most recently noticed retention concession on the parking agreement where its effective date is on or before that due date"
      increase_effective: "the new rent of the most recently noticed existing-customer rate increase on the parking agreement where its effective date is on or before that due date"
      increase_rent: "the new rent of the most recently noticed existing-customer rate increase on the parking agreement where its effective date is on or before that due date"
      noticed_rent: "The parking notice amount carries the parking rent in force on the parking notice due date and on the in-flight parking draft's due date in place of the contracted monthly rent."
      military_pct: "less military_discount_pct, rounded to the cent, where the military discount is applied"
      military_on: "where the military discount is applied"
      parking_status: "where the parking agreement is moving_out"
      vacate_date: "its planned vacate date is on or before that due date"
      noticed_charge: "The parking notice amount charges for each of those two due dates nothing where the parking agreement is moving_out and its planned vacate date is on or before that due date, because that period is not charged; the parking rent in force less military_discount_pct, rounded to the cent, where the military discount is applied; and otherwise the parking rent in force as it stands."
      balance_today: "first pay the parking balance due on the handling date"
      delinquency_anchor: "the parking agreement's oldest unpaid due date"
      latest_due: "The latest parking draft is the draft attempt on the authorization with the latest draft date"
      latest_amount: "while its result is still empty it is in flight and counts at its submitted amount"
      latest_result: "while its result is still empty it is in flight"
      tow_fee_posted: "unless a tow notice fee is posted for the current delinquency"
      in_flight: "while its result is still empty it is in flight and counts at its submitted amount, unless a tow notice fee is posted for the current delinquency, in which case the draft is refused as a partial payment and counts as nothing"
      pastdue_left: "A parking payment is applied to the oldest charges first, so the in-flight parking draft and then any catch-up amount on the notice history for the parking agreement's oldest unpaid due date first pay the parking balance due on the handling date, and only what is left of them reaches the in-flight parking draft's own due date."
      catchup_on_record: "the catch-up amount on the notice history for the parking agreement's oldest unpaid due date"
      carried_balance: "The parking past-due balance the parking notice amount carries is nothing where the catch-up amount on the notice history for the parking agreement's oldest unpaid due date is at least the parking past-due balance left after the in-flight parking draft; that past-due balance less the catch-up amount where a smaller catch-up amount is on record; and otherwise the whole parking past-due balance left after the in-flight parking draft."
      latest_rent: "The parking notice amount carries the parking rent in force on the parking notice due date and on the in-flight parking draft's due date in place of the contracted monthly rent."
      latest_charge: "The parking notice amount charges for each of those two due dates nothing where the parking agreement is moving_out and its planned vacate date is on or before that due date, because that period is not charged; the parking rent in force less military_discount_pct, rounded to the cent, where the military discount is applied; and otherwise the parking rent in force as it stands."
      catchup_excess: "only what is left of them reaches the in-flight parking draft's own due date"
      latest_unpaid: "plus the contracted monthly rent of the in-flight parking draft's own due date less the part of the in-flight parking draft and of the catch-up amount left over after the past-due balance"
      late_by_rent: "late_fee_pct_of_rent times the parking rent in force on the in-flight draft's due date, rounded to the cent"
      projected_late_fee: "Parking rent of the in-flight draft's due date that is left unpaid stays unpaid past the grace period before the parking notice draft runs, so the parking notice amount adds one projected parking late fee: late_fee_max_usd when late_fee_pct_of_rent times the parking rent in force on the in-flight draft's due date, rounded to the cent, is above late_fee_max_usd; that percentage amount when it is above late_fee_flat_usd; late_fee_flat_usd when it is not; and nothing where no parking rent of that due date is left unpaid."
      result: "all added together and rounded to the cent once; each partial figure is rounded to the cent"
    factors:
      - id: parking_rent_in_force
        effect: parameter
        decides: noticed_rent
        bindings: [rescissions, concession_effective, concession_rent, increase_effective, increase_rent, noticed_rent, latest_rent]
        ladder:
          - when: "the most recently noticed retention concession on the parking agreement takes effect on or before the due date and no rescission is recorded"
            value: "the concession's new rent"
          - when: "that does not hold, and the most recently noticed existing-customer rate increase takes effect on or before the due date with no rescission recorded"
            value: "the increase's new rent"
          - when: "otherwise"
            value: "the parking agreement's contracted monthly rent"
        baseline:
          noticed_rent: "contracted_rent"
          latest_rent: "contracted_rent"
        evidence: [cross_category, date]
        cross_difficulty: parking
      - id: parking_period_charge
        effect: method
        decides: noticed_charge
        bindings: [military_pct, military_on, parking_status, vacate_date, noticed_charge, latest_charge]
        ladder:
          - when: "the parking agreement is moving_out and its planned vacate date is on or before the period's due date"
            method: "the period is not charged; nothing enters for it"
          - when: "the military discount is applied on the parking agreement"
            method: "the parking rent in force times one minus military_discount_pct, rounded to the cent"
          - when: "otherwise"
            method: "the parking rent in force as it stands"
        baseline:
          noticed_charge: "noticed_rent"
          latest_charge: "latest_rent"
        evidence: [cross_category, date]
        cross_difficulty: parking
      - id: parking_past_due_carry
        effect: method
        decides: carried_balance
        bindings: [catchup_on_record, carried_balance]
        ladder:
          - when: "the catch-up amount on the notice history for the parking agreement's oldest unpaid due date is at least the past-due balance left after the in-flight parking draft"
            method: "nothing of the past-due balance is carried"
          - when: "a smaller catch-up amount is on record for that due date"
            method: "the past-due balance left after the in-flight parking draft less the catch-up amount is carried"
          - when: "otherwise"
            method: "the whole past-due balance left after the in-flight parking draft is carried"
        baseline:
          carried_balance: "pastdue_left"
        evidence: [history]
        cross_difficulty: null
      - id: projected_parking_late_fee
        effect: parameter
        decides: projected_late_fee
        bindings: [late_by_rent, projected_late_fee]
        ladder:
          - when: "parking rent of the in-flight draft's due date is left unpaid and late_fee_pct_of_rent times its rent in force is above late_fee_max_usd"
            value: "late_fee_max_usd"
          - when: "parking rent is left unpaid and that percentage amount is above late_fee_flat_usd but not above late_fee_max_usd"
            value: "the percentage amount"
          - when: "parking rent is left unpaid and that percentage amount is not above late_fee_flat_usd"
            value: "late_fee_flat_usd"
          - when: "otherwise (no parking rent of that due date left unpaid)"
            value: "nothing"
        baseline:
          projected_late_fee: "0"
        evidence: [cross_category]
        cross_difficulty: parking
    baseline:
      rule: >-
        A varying-amount notice on a vehicle, RV or boat parking AutoPay authorization is sent for a method whose
        varying_amount_notice_days is above zero and states the parking notice amount, which is the amount the draft for the parking
        notice due date will collect. The parking notice due date is the authorization's next draft due date, and the notice is sent
        only when that due date less draft_days_before_due falls at least varying_amount_notice_days calendar days after the handling
        date. A parking bank-account draft, which runs before its due date, collects the rent charge of that due date together with the
        balance due on the draft date. The latest parking draft is the draft attempt on the authorization with the latest draft date;
        while its result is still empty it is in flight and counts at its submitted amount, unless a tow notice fee is posted for the
        current delinquency, in which case the draft is refused as a partial payment and counts as nothing. A parking payment is applied
        to the oldest charges first, so the in-flight parking draft and then any catch-up amount on the notice history for the parking
        agreement's oldest unpaid due date first pay the parking balance due on the handling date, and only what is left of them
        reaches the in-flight parking draft's own due date. The parking notice amount is the parking agreement's contracted monthly rent
        for the parking notice due date, plus the parking past-due balance left after the in-flight parking draft is applied, plus the
        contracted monthly rent of the in-flight parking draft's own due date less the part of the in-flight parking draft and of the
        catch-up amount left over after the past-due balance, all added together and rounded to the cent once; each partial figure is
        rounded to the cent. A parking notice is sent only for an amount not above draft_cap_usd.
      params: [varying_amount_notice_days, draft_days_before_due, draft_cap_usd]
    inputs:
      history:
        - {table: autopay_notices, aggregate: sum, field: notified_amount, filters: {notice_type: varying_amount_notice}}
        - {table: autopay_drafts, aggregate: latest, field: amount, filters: {event_type: autopay_draft}}
        - {table: autopay_drafts, aggregate: latest, field: result, filters: {event_type: autopay_draft}}
        - {category: parking, table: parking_rate_changes, aggregate: latest, field: new_rent, filters: {change_reason: retention_concession}}
        - {category: parking, table: parking_rate_changes, aggregate: latest, field: new_rent, filters: {change_reason: existing_customer_rate_increase}}
      cross_category: [parking]
  - id: autopay_ext_parking_ach_catchup
    base_policy_refs: [autopay_evt_varying_amount_notice, autopay_evt_expiry_reminders, autopay_evt_retry_and_suspension, autopay_evt_returns]
    overwrite:
      - base_policy: autopay_evt_varying_amount_notice
        superseded_clause: >-
          For a method whose varying_amount_notice_days is above zero, a draft whose amount differs from the previous successful draft on
          the same authorization, for example after a rent change or because late fees are due, may be submitted only when the handling
          date is not earlier than the varying-amount notice date plus varying_amount_notice_days.
        replaced_by: >-
          A parking catch-up the tenant approves for a stated amount on a recorded call is a single entry authorized for that exact
          amount, so it is not held for varying_amount_notice_days and runs on the next banking day.
    trigger: on_request
    subject: [autopay_notice]
    computes: approved_amount
    target_tool: approve_parking_returned_draft_catchup_8c80cda9
    params: {}
    rule: >-
      A tenant whose vehicle, RV or boat parking AutoPay draft on a bank account was returned unpaid for insufficient or uncollected
      funds may approve on a recorded call a one-time catch-up draft from the same account for that due date on an authorization in
      active status; the approval is recorded on the authorization's notice history as a varying-amount notice for the returned parking
      due date stating the parking catch-up amount. A parking catch-up the tenant approves for a stated amount on a recorded call is a
      single entry authorized for that exact amount, so it is not held for varying_amount_notice_days and runs on the next banking day.
      The returned parking due date is the parking agreement's oldest unpaid due date. The parking catch-up amount is the parking rent
      charge of the returned due date, which is the contracted monthly rent less military_discount_pct where the military discount is
      applied, rounded to the cent.
      The parking rent the catch-up re-collects is nothing while the returned entry may still be presented again, that is while fewer
      settled draft attempts than one plus max_represents_per_entry are recorded for the returned parking due date, because the next
      presentment collects it; the parking rent charge less the direct payments taken at a facility office, by phone or online after the
      same calendar day of the previous month and up to the handling date, where such payments exist; and otherwise the whole parking
      rent charge.
      The parking catch-up amount adds returned_payment_fee_usd twice where two draft attempts for the returned parking due date
      settled and were returned, once where one settled and was returned, and nothing otherwise.
      The parking late fee counted in the parking catch-up amount is, where a late fee is posted for the returned parking due date,
      late_fee_max_usd when late_fee_pct_of_rent times the contracted monthly rent, rounded to the cent, is above late_fee_max_usd, that
      percentage amount when it is above late_fee_flat_usd, and late_fee_flat_usd when it is not; and nothing where no late fee is
      posted for that due date.
      The parking catch-up amount leaves out charges the tenant was excused from: the posted late fee and returned_payment_fee_usd where
      the latest courtesy late-fee waiver on the parking agreement was credited against a late fee and the latest billing-error
      correction against a returned-payment fee; the posted late fee alone where only such a waiver is on record; returned_payment_fee_usd
      alone where only such a correction is on record; and nothing otherwise.
      The parking catch-up amount adds the other parking fees posted after the same calendar day of the previous month and up to the
      handling date: vehicle_swap_fee_usd where a vehicle swap fee is posted; space_cleanup_fee_usd where a space cleanup fee is posted
      and no swap fee is; and nothing otherwise.
      The latest submitted parking draft, the draft attempt on the authorization with the latest draft date, is in flight when it is for a due date later than the returned parking due date and its result is still empty. Because a parking payment is applied to
      the oldest charges first, the parking catch-up amount nets an in-flight draft as follows: where no tow notice fee is posted for the
      current delinquency, the in-flight draft's submitted amount is subtracted, since it will first pay the returned period's charges;
      where such a tow notice fee is posted, the in-flight draft is refused as a partial payment, so its submitted amount is added and the
      catch-up covers what that draft would have paid; and where no draft is in flight, nothing is netted.
      The re-collected rent, the returned-payment fees, the parking late fee and the other parking fees are added together, the charges
      left out are subtracted, the in-flight netting is applied, and the result, never below zero, is rounded to the cent once.
    prerequisite: []
    cross_category:
      - category: parking
        as: history
        reads: [monthly_rent, delinquent_since, military_discount_applied, parking_ledger.fee_type, parking_ledger.period_start, parking_ledger.credit_type, parking_ledger.reference_entry_id, parking_ledger.payment_channel, parking_ledger.amount]
        note: The re-collected rent, fee, credit and other-fee factors read the parking agreement and its ledger.
    compute:
      - returned_due: "CFIELD('parking', 'delinquent_since', parking_rental_id=F('agreement_id'))"
      - contracted_rent: "CFIELD('parking', 'monthly_rent', parking_rental_id=F('agreement_id'))"
      - rent_charge: "RND(contracted_rent * (1 - CPARAM('parking', 'military_discount_pct', parking_rental_id=F('agreement_id'))), 2) if CFIELD('parking', 'military_discount_applied', parking_rental_id=F('agreement_id')) == True else contracted_rent"
      - settled_attempts: "COUNT('autopay_drafts', event_type='autopay_draft', due_date=returned_due, result='ach_settled')"
      - direct_paid: "XSUM('parking', 'parking_ledger', 'amount', within_months=1, date_field='entry_date', parking_rental_id=F('agreement_id'), event_type='parking_payment', payment_channel='facility_office') + XSUM('parking', 'parking_ledger', 'amount', within_months=1, date_field='entry_date', parking_rental_id=F('agreement_id'), event_type='parking_payment', payment_channel='care_center_phone') + XSUM('parking', 'parking_ledger', 'amount', within_months=1, date_field='entry_date', parking_rental_id=F('agreement_id'), event_type='parking_payment', payment_channel='online_portal')"
      - rent_recollected: "0 if settled_attempts < 1 + P('max_represents_per_entry') else ((rent_charge - direct_paid) if direct_paid > 0 else rent_charge)"
      - returned_fees: "2 * CPARAM('parking', 'returned_payment_fee_usd', parking_rental_id=F('agreement_id')) if settled_attempts >= 2 else (CPARAM('parking', 'returned_payment_fee_usd', parking_rental_id=F('agreement_id')) if settled_attempts == 1 else 0)"
      - late_posted: "XCOUNT('parking', 'parking_ledger', parking_rental_id=F('agreement_id'), fee_type='late_fee', period_start=returned_due)"
      - late_by_rent: "RND(CPARAM('parking', 'late_fee_pct_of_rent', parking_rental_id=F('agreement_id')) * contracted_rent, 2)"
      - parking_late_fee: "0 if late_posted == 0 else (CPARAM('parking', 'late_fee_max_usd', parking_rental_id=F('agreement_id')) if late_by_rent > CPARAM('parking', 'late_fee_max_usd', parking_rental_id=F('agreement_id')) else (late_by_rent if late_by_rent > CPARAM('parking', 'late_fee_flat_usd', parking_rental_id=F('agreement_id')) else CPARAM('parking', 'late_fee_flat_usd', parking_rental_id=F('agreement_id'))))"
      - waiver_ref: "XLATEST('parking', 'parking_ledger', 'reference_entry_id', date_field='entry_date', parking_rental_id=F('agreement_id'), event_type='parking_credit', credit_type='courtesy_late_fee_waiver')"
      - waiver_fee_type: "XLATEST('parking', 'parking_ledger', 'fee_type', date_field='entry_date', parking_entry_id=waiver_ref)"
      - waiver_fee_amount: "XLATEST('parking', 'parking_ledger', 'amount', date_field='entry_date', parking_entry_id=waiver_ref)"
      - correction_ref: "XLATEST('parking', 'parking_ledger', 'reference_entry_id', date_field='entry_date', parking_rental_id=F('agreement_id'), event_type='parking_credit', credit_type='billing_error_correction')"
      - correction_fee_type: "XLATEST('parking', 'parking_ledger', 'fee_type', date_field='entry_date', parking_entry_id=correction_ref)"
      - charges_left_out: "(waiver_fee_amount + CPARAM('parking', 'returned_payment_fee_usd', parking_rental_id=F('agreement_id'))) if (waiver_fee_type == 'late_fee' and correction_fee_type == 'returned_payment_fee') else (waiver_fee_amount if (waiver_fee_type == 'late_fee' and correction_fee_type != 'returned_payment_fee') else (CPARAM('parking', 'returned_payment_fee_usd', parking_rental_id=F('agreement_id')) if (correction_fee_type == 'returned_payment_fee' and waiver_fee_type != 'late_fee') else 0))"
      - swap_fees: "XCOUNT('parking', 'parking_ledger', within_months=1, date_field='entry_date', parking_rental_id=F('agreement_id'), fee_type='vehicle_swap_fee')"
      - cleanup_fees: "XCOUNT('parking', 'parking_ledger', within_months=1, date_field='entry_date', parking_rental_id=F('agreement_id'), fee_type='space_cleanup_fee')"
      - other_fees: "CPARAM('parking', 'vehicle_swap_fee_usd', parking_rental_id=F('agreement_id')) if swap_fees > 0 else (CPARAM('parking', 'space_cleanup_fee_usd', parking_rental_id=F('agreement_id')) if cleanup_fees > 0 else 0)"
      - latest_due: "LATEST('autopay_drafts', 'due_date', date_field='draft_date', event_type='autopay_draft')"
      - latest_amount: "LATEST('autopay_drafts', 'amount', date_field='draft_date', event_type='autopay_draft')"
      - latest_result: "LATEST('autopay_drafts', 'result', date_field='draft_date', event_type='autopay_draft')"
      - tow_fee_posted: "XCOUNT('parking', 'parking_ledger', parking_rental_id=F('agreement_id'), fee_type='tow_notice_fee', period_start=returned_due)"
      - in_flight: "latest_amount if (latest_result == '' and latest_due > returned_due) else 0"
      - in_flight_netting: "in_flight if (in_flight > 0 and tow_fee_posted == 0) else ((0 - in_flight) if (in_flight > 0 and tow_fee_posted > 0) else 0)"
      - result: "MX(0, RND(rent_recollected + returned_fees + parking_late_fee + other_fees - charges_left_out - in_flight_netting, 2))"
    compute_basis:
      returned_due: "The returned parking due date is the parking agreement's oldest unpaid due date."
      contracted_rent: "the contracted monthly rent"
      rent_charge: "The parking catch-up amount is the parking rent charge of the returned due date, which is the contracted monthly rent less military_discount_pct where the military discount is applied, rounded to the cent."
      settled_attempts: "while fewer settled draft attempts than one plus max_represents_per_entry are recorded for the returned parking due date"
      direct_paid: "the direct payments taken at a facility office, by phone or online after the same calendar day of the previous month and up to the handling date"
      rent_recollected: "The parking rent the catch-up re-collects is nothing while the returned entry may still be presented again, that is while fewer settled draft attempts than one plus max_represents_per_entry are recorded for the returned parking due date, because the next presentment collects it; the parking rent charge less the direct payments taken at a facility office, by phone or online after the same calendar day of the previous month and up to the handling date, where such payments exist; and otherwise the whole parking rent charge."
      returned_fees: "The parking catch-up amount adds returned_payment_fee_usd twice where two draft attempts for the returned parking due date settled and were returned, once where one settled and was returned, and nothing otherwise."
      late_posted: "where a late fee is posted for the returned parking due date"
      late_by_rent: "late_fee_pct_of_rent times the contracted monthly rent, rounded to the cent"
      parking_late_fee: "The parking late fee counted in the parking catch-up amount is, where a late fee is posted for the returned parking due date, late_fee_max_usd when late_fee_pct_of_rent times the contracted monthly rent, rounded to the cent, is above late_fee_max_usd, that percentage amount when it is above late_fee_flat_usd, and late_fee_flat_usd when it is not; and nothing where no late fee is posted for that due date."
      waiver_ref: "the latest courtesy late-fee waiver on the parking agreement was credited against a late fee"
      waiver_fee_type: "was credited against a late fee"
      waiver_fee_amount: "the posted late fee"
      correction_ref: "the latest billing-error correction against a returned-payment fee"
      correction_fee_type: "against a returned-payment fee"
      charges_left_out: "The parking catch-up amount leaves out charges the tenant was excused from: the posted late fee and returned_payment_fee_usd where the latest courtesy late-fee waiver on the parking agreement was credited against a late fee and the latest billing-error correction against a returned-payment fee; the posted late fee alone where only such a waiver is on record; returned_payment_fee_usd alone where only such a correction is on record; and nothing otherwise."
      swap_fees: "where a vehicle swap fee is posted"
      cleanup_fees: "where a space cleanup fee is posted and no swap fee is"
      other_fees: "The parking catch-up amount adds the other parking fees posted after the same calendar day of the previous month and up to the handling date: vehicle_swap_fee_usd where a vehicle swap fee is posted; space_cleanup_fee_usd where a space cleanup fee is posted and no swap fee is; and nothing otherwise."
      latest_due: "The latest submitted parking draft, the draft attempt on the authorization with the latest draft date, is in flight when it is for a due date later than the returned parking due date and its result is still empty."
      latest_amount: "the in-flight draft's submitted amount"
      latest_result: "its result is still empty"
      tow_fee_posted: "where no tow notice fee is posted for the current delinquency"
      in_flight: "The latest submitted parking draft, the draft attempt on the authorization with the latest draft date, is in flight when it is for a due date later than the returned parking due date and its result is still empty."
      in_flight_netting: "Because a parking payment is applied to the oldest charges first, the parking catch-up amount nets an in-flight draft as follows: where no tow notice fee is posted for the current delinquency, the in-flight draft's submitted amount is subtracted, since it will first pay the returned period's charges; where such a tow notice fee is posted, the in-flight draft is refused as a partial payment, so its submitted amount is added and the catch-up covers what that draft would have paid; and where no draft is in flight, nothing is netted."
      result: "The re-collected rent, the returned-payment fees, the parking late fee and the other parking fees are added together, the charges left out are subtracted, the in-flight netting is applied, and the result, never below zero, is rounded to the cent once."
    factors:
      - id: parking_rent_recollected
        effect: method
        decides: rent_recollected
        bindings: [settled_attempts, direct_paid, rent_recollected]
        ladder:
          - when: "fewer settled draft attempts than one plus max_represents_per_entry are recorded for the returned parking due date"
            method: "no rent is re-collected; the next presentment collects it"
          - when: "the entry may not be presented again and direct payments were taken at a facility office, by phone or online after the same calendar day of the previous month"
            method: "the parking rent charge less those direct payments"
          - when: "otherwise"
            method: "the whole parking rent charge"
        baseline:
          rent_recollected: "rent_charge"
        evidence: [history, cross_category]
        cross_difficulty: parking
      - id: parking_returned_payment_fees
        effect: parameter
        decides: returned_fees
        bindings: [returned_fees]
        ladder:
          - when: "two draft attempts for the returned parking due date settled and were returned"
            value: "two times returned_payment_fee_usd"
          - when: "one draft attempt for the returned parking due date settled and was returned"
            value: "returned_payment_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          returned_fees: "0"
        evidence: [history, cross_category]
        cross_difficulty: parking
      - id: parking_catchup_late_fee
        effect: parameter
        decides: parking_late_fee
        bindings: [late_posted, late_by_rent, parking_late_fee]
        ladder:
          - when: "a late fee is posted for the returned parking due date and late_fee_pct_of_rent times the contracted monthly rent is above late_fee_max_usd"
            value: "late_fee_max_usd"
          - when: "a late fee is posted and that percentage amount is above late_fee_flat_usd but not above late_fee_max_usd"
            value: "the percentage amount, rounded to the cent"
          - when: "a late fee is posted and that percentage amount is not above late_fee_flat_usd"
            value: "late_fee_flat_usd"
          - when: "otherwise (no late fee posted for that due date)"
            value: "nothing"
        baseline:
          parking_late_fee: "0"
        evidence: [cross_category, history]
        cross_difficulty: parking
      - id: parking_charges_left_out
        effect: parameter
        decides: charges_left_out
        bindings: [waiver_ref, waiver_fee_type, waiver_fee_amount, correction_ref, correction_fee_type, charges_left_out]
        ladder:
          - when: "the latest courtesy late-fee waiver references a late fee and the latest billing-error correction references a returned-payment fee"
            value: "the posted late fee plus returned_payment_fee_usd"
          - when: "only the courtesy late-fee waiver against a late fee is on record"
            value: "the posted late fee"
          - when: "only the billing-error correction against a returned-payment fee is on record"
            value: "returned_payment_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          charges_left_out: "0"
        evidence: [cross_category, history]
        cross_difficulty: parking
      - id: parking_other_fees
        effect: parameter
        decides: other_fees
        bindings: [swap_fees, cleanup_fees, other_fees]
        ladder:
          - when: "a vehicle swap fee is posted after the same calendar day of the previous month"
            value: "vehicle_swap_fee_usd"
          - when: "a space cleanup fee is posted in that window and no swap fee is"
            value: "space_cleanup_fee_usd"
          - when: "otherwise"
            value: "nothing"
        baseline:
          other_fees: "0"
        evidence: [cross_category, history]
        cross_difficulty: parking
      - id: parking_in_flight_netting
        effect: method
        decides: in_flight_netting
        bindings: [latest_due, latest_amount, latest_result, tow_fee_posted, in_flight, in_flight_netting]
        ladder:
          - when: "the latest submitted parking draft is in flight for a later due date and no tow notice fee is posted for the current delinquency"
            method: "the in-flight draft's submitted amount is subtracted, because it first pays the returned period's charges"
          - when: "the latest submitted parking draft is in flight for a later due date and a tow notice fee is posted for the current delinquency"
            method: "the in-flight draft is refused as a partial payment, so its submitted amount is added to the catch-up"
          - when: "otherwise (no draft in flight)"
            method: "nothing is netted"
        baseline:
          in_flight_netting: "0"
        evidence: [history, cross_category]
        cross_difficulty: parking
