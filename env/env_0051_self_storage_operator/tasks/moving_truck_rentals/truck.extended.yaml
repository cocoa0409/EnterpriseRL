events:
  - type: truck_reservation
    target: truck_rentals
    mutation: create
    meaning: "A customer reserves a vehicle class at a facility for a pickup time."
    grain: "One truck rental contract record per reservation."
    fields:
      customer_id: "Customer reserving."
      variant_name: "Vehicle class, official full name."
      facility_code: "Pickup facility (also the return facility; one-way rentals are not offered)."
      reservation_date: "Date the reservation is made."
      scheduled_pickup_date: "Scheduled pickup date."
      scheduled_pickup_time: "Scheduled pickup time."
      scheduled_return_date: "Scheduled return date."
      scheduled_return_time: "Scheduled return time."
      linked_rental_id: "Storage unit rental the free move-in benefit is claimed for; empty when not claimed."
    triggers: []
  - type: truck_reservation_change
    target: truck_rentals
    mutation: update
    meaning: "The renter changes the vehicle class or the scheduled times of a reservation, or extends a rental already picked up."
    grain: "One update per change request."
    fields:
      variant_name: "Vehicle class after the change."
      scheduled_pickup_date: "Pickup date after the change."
      scheduled_pickup_time: "Pickup time after the change."
      scheduled_return_date: "Return date after the change."
      scheduled_return_time: "Return time after the change."
    triggers: []
  - type: truck_reservation_cancelled
    target: truck_rentals
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: "The renter cancels before pickup."
    grain: "One transition per reservation."
    fields:
      cancelled_at_date: "Date the cancellation is made."
      cancelled_at_time: "Time the cancellation is made."
    triggers: []
  - type: truck_no_show
    target: truck_rentals
    mutation: {transition: {from: reserved, to: no_show}}
    meaning: "The reservation is not claimed by the no-show cutoff."
    grain: "One transition per reservation."
    fields:
      status: "Set to no_show."
    triggers:
      - event: truck:truck_charge
        map: {charge_type: no_show_fee}
  - type: truck_pickup
    target: truck_rentals
    mutation: {transition: {from: reserved, to: picked_up}}
    meaning: "The renter signs the contract and takes the vehicle."
    grain: "One transition per contract."
    fields:
      actual_pickup_date: "Date the vehicle left the lot."
      actual_pickup_time: "Time the vehicle left the lot."
      truck_unit_number: "Fleet number of the vehicle handed over."
      odometer_out: "Odometer reading at pickup, miles."
      fuel_out_eighths: "Fuel level at pickup, eighths of a tank."
      damage_waiver: "Damage waiver chosen at the counter."
      deposit_method: "Card type the deposit hold is placed on."
      additional_drivers: "Number of additional authorized drivers."
    triggers:
      - event: truck:truck_deposit_hold
        map: {}
      - event: truck:truck_charge
        map: {charge_type: base_rental_fee}
      - event: truck:truck_charge
        when: {damage_waiver: [basic, premium]}
        map: {charge_type: damage_waiver_fee}
  - type: truck_charge
    target: truck_charges
    meaning: "A charge is posted to the truck rental contract."
    grain: "One row per charge type per service date per source record."
    distinguish_by: [charge_type, service_date, reference_id]
    fields:
      charge_type: "Kind of charge."
      amount: "Charge amount, USD."
      service_date: "Date the charged service or event relates to."
      quantity: "Units charged (miles, eighths, hours, periods, items), as a number."
      reference_id: "Source record: the damage report for a damage charge, the toll or citation notice number for a processing fee; empty otherwise."
    account: truck_balance
    direction: in
    triggers: []
  - type: truck_payment
    target: truck_charges
    meaning: "A payment is taken on the contract, including a capture from the deposit hold."
    grain: "One row per payment."
    distinguish_by: [service_date, amount, payment_method]
    fields:
      amount: "Amount paid, USD."
      service_date: "Date paid."
      payment_method: "How paid."
    account: truck_balance
    direction: out
    triggers: []
  - type: truck_credit
    target: truck_charges
    meaning: "A charge is credited: the free move-in benefit, a breakdown credit, or a billing-error correction."
    grain: "One row per credit type per credited charge."
    distinguish_by: [credit_type, reference_id]
    fields:
      credit_type: "Kind of credit."
      amount: "Credit amount, USD."
      service_date: "Date credited."
      reference_id: "The charge credited."
    account: truck_balance
    direction: out
    triggers: []
  - type: truck_refund
    target: truck_charges
    meaning: "A credit balance on the contract is refunded to the card."
    grain: "One row per refund."
    distinguish_by: [service_date, amount]
    fields:
      amount: "Amount refunded, USD."
      service_date: "Date refunded."
    account: truck_balance
    direction: in
    triggers: []
  - type: truck_deposit_hold
    target: truck_charges
    meaning: "An authorization hold is placed on the renter's card at pickup."
    grain: "One row per contract."
    distinguish_by: [service_date]
    fields:
      amount: "Hold amount, USD."
      service_date: "Date placed (the pickup date)."
    account: deposit_hold
    direction: in
    triggers: []
  - type: truck_deposit_release
    target: truck_charges
    meaning: "The deposit hold is released, or part of it captured to pay the balance."
    grain: "One row per release type per date."
    distinguish_by: [release_type, service_date]
    fields:
      release_type: "Whether the amount is released or captured."
      amount: "Amount released or captured, USD."
      service_date: "Date of the release or capture."
    account: deposit_hold
    direction: out
    triggers:
      - event: truck:truck_payment
        when: {release_type: captured_to_balance}
        map: {payment_method: deposit_capture}
  - type: truck_return
    target: truck_rentals
    mutation: {transition: {from: picked_up, to: returned}}
    meaning: "The vehicle is checked in at the facility."
    grain: "One transition per contract."
    fields:
      actual_return_date: "Date checked in."
      actual_return_time: "Time checked in."
      odometer_in: "Odometer reading at return, miles."
      fuel_in_eighths: "Fuel level at return, eighths of a tank."
      return_condition: "Condition found at check-in."
    triggers:
      - event: truck:truck_charge
        map: {charge_type: mileage}
      - event: truck:truck_charge
        when: {return_condition: [clean, needs_cleaning, damaged]}
        map: {charge_type: environmental_fee}
      - event: truck:truck_charge
        when: {return_condition: needs_cleaning}
        map: {charge_type: cleaning_fee}
      - event: truck:truck_damage_report
        when: {return_condition: damaged}
        map: {}
  - type: truck_damage_report
    target: truck_incidents
    meaning: "Damage to the vehicle, an accident, a breakdown or a toll or citation is recorded against the contract."
    grain: "One row per incident."
    distinguish_by: [incident_type, incident_date, incident_reference]
    fields:
      incident_type: "Kind of incident."
      incident_date: "Date of the incident or of its discovery."
      incident_reference: "Damage estimate, roadside case or toll and citation notice number, as issued."
      damage_location: "Where on the vehicle the damage is."
      repair_estimate_usd: "Repair estimate from the fleet shop, USD; 0.00 for non-damage incidents."
      waiver_void_reason: "Why a waiver does not apply to this incident; none when it applies."
    triggers:
      - event: truck:truck_charge
        when: {incident_type: [vehicle_damage, accident_damage]}
        map: {charge_type: damage_charge}
      - event: truck:truck_charge
        when: {incident_type: toll_or_citation}
        map: {charge_type: tolls_citations_admin_fee}
  - type: truck_close
    target: truck_rentals
    mutation: {transition: {from: returned, to: closed}}
    meaning: "The final invoice is settled and the contract closed."
    grain: "One transition per contract."
    fields:
      closed_date: "Date the contract closed."
    triggers:
      - event: truck:truck_deposit_release
        map: {}

measures:
  - id: truck_msr_open_contracts
    window: "Point in time: the handling date, per customer."
    measure: "Count of the customer's truck rentals in reserved or picked_up status."
  - id: truck_msr_free_move_in_used
    window: "All time, per storage unit rental."
    measure: "Count of truck rentals with linked_rental_id equal to the unit rental and a truck_credit row of credit_type free_move_in_waiver, excluding cancelled and no_show rentals."

policies:
  - id: truck_agg_multi_holding
    subject: [truck_reservation]
    rule: >-
      A customer may have at most max_per_customer truck rentals open at one time, counted by truck_msr_open_contracts over reserved and
      picked_up contracts. A customer with a truck rental in returned status, whose final invoice is not yet settled, may not reserve
      another vehicle until it closes. Each contract covers one vehicle and one renter, who may add authorized drivers at the counter.
    eligibility:
      - id: no_unsettled_contract
        applies_to: [truck_reservation]
        kind: state
        condition: "A customer with a truck rental in returned status, whose final invoice is not yet settled, may not reserve another vehicle until it closes."
        evidence_fields: [truck_rentals.status, truck_rentals.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_rentals.customer_id]]
          action_bindings: {truck_rentals.customer_id: customer_id}
        state_contract:
          field: truck_rentals.status
          allowed: [reserved, picked_up, closed, cancelled, no_show]
    params:
      max_per_customer: 2
    measures: [truck_msr_open_contracts]

  - id: truck_agg_free_move_in_once
    subject: [truck_credit, truck_reservation]
    rule: >-
      The free move-in truck is a benefit of a storage unit rental, not of the customer. Each unit rental agreement supports one free
      move-in truck rental, counted by truck_msr_free_move_in_used, and a customer moving into two units may claim it once for each
      unit. A cancelled or no-show reservation does not use the benefit. The free move-in truck is never combined with another discount
      on the same contract.
    eligibility:
      - id: once_per_unit
        applies_to: [truck_credit]
        kind: dedup
        condition: "Each unit rental agreement supports one free move-in truck rental, counted by truck_msr_free_move_in_used, and a customer moving into two units may claim it once for each unit."
        evidence_fields: [truck_rentals.linked_rental_id, truck_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_rentals.linked_rental_id]]
          action_bindings: {truck_rentals.linked_rental_id: linked_rental_id}
        dedup_contract:
          table: truck_rentals
          mode: separate_record
          object_bindings: {linked_rental_id: linked_rental_id}
          duplicate_filters: {status: [reserved, picked_up, returned, closed]}
          distinct_fields: []
    params:
      max_free_move_in_per_unit_rental: 1
    measures: [truck_msr_free_move_in_used]

  - id: truck_evt_pricing
    subject: [truck_pickup, truck_charge, truck_return]
    rule: >-
      A contract is charged base_rate_usd for each rental period started, a period being rental_period_hours elapsed hours from the actual
      pickup time; the first period is posted at pickup. Mileage is charged at per_mile_usd on the miles driven, odometer_in minus
      odometer_out, less any included miles. The environmental fee is posted once per contract at return. A damage waiver fee is posted
      per period when the renter takes the basic or premium waiver at the counter. Fuel below the pickup level is charged at
      fuel_charge_per_eighth_usd for each eighth short; fuel above the pickup level is not credited. Each additional authorized driver
      adds additional_driver_fee_usd once per contract. Cleaning, smoking and accessory fees are posted when they apply. All amounts are
      rounded to the cent.
      The fees named here are environmental_fee_usd, basic_damage_waiver_fee_usd or premium_damage_waiver_fee_usd per period, cleaning_fee_usd, smoking_fee_usd, accessory_dolly_fee_usd and accessory_pads_fee_usd; fuel is read in fuel_tank_eighths and must be refilled with fuel_type.
    eligibility: []
    params:
      per_tier:
        Bluegate Pickup Truck: {base_rate_usd: "=base_rate_usd", per_mile_usd: "=per_mile_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd"}
        Bluegate Cargo Van: {base_rate_usd: "=base_rate_usd", per_mile_usd: "=per_mile_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd"}
        Bluegate 10 ft Moving Truck: {base_rate_usd: "=base_rate_usd", per_mile_usd: "=per_mile_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd"}
        Bluegate 15 ft Moving Truck: {base_rate_usd: "=base_rate_usd", per_mile_usd: "=per_mile_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd"}
        Bluegate 20 ft Moving Truck: {base_rate_usd: "=base_rate_usd", per_mile_usd: "=per_mile_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd"}
        Bluegate 26 ft Moving Truck: {base_rate_usd: "=base_rate_usd", per_mile_usd: "=per_mile_usd", fuel_charge_per_eighth_usd: "=fuel_charge_per_eighth_usd"}
    formula:
      mileage_charge: "round(max(0, odometer_in - odometer_out - included_miles) * per_mile_usd, 2)"
      included_miles: "free_move_in_included_miles if linked_rental_id != '' else 0"
      fuel_charge: "max(0, fuel_out_eighths - fuel_in_eighths) * fuel_charge_per_eighth_usd"

  - id: truck_evt_free_move_in
    subject: [truck_credit, truck_reservation]
    rule: >-
      A tenant moving into a Bluegate storage unit may claim one free move-in truck for that unit on a vehicle class whose
      free_move_in_eligible is true. The linked unit rental must be in reserved or active status and belong to the same customer. The
      free move-in truck may be claimed only when the pickup date is not later than the unit move-in date plus free_move_in_window_days,
      and not earlier than the move-in date minus the same number of days for a reserved unit whose move-in is scheduled. Window days are
      calendar days counted from the day after the move-in date, and the last counted day is included. On a free move-in contract the
      charges in free_move_in_waived_charges for the first rental period are credited in full as free_move_in_waiver, and the first
      free_move_in_included_miles miles are not charged. Extra periods, extra miles, fuel, damage waiver, cleaning and damage stay
      chargeable. A unit rental that has reached delinquent status or ended does not support the benefit.
    eligibility:
      - id: unit_status_ok
        applies_to: [truck_credit, truck_reservation]
        kind: state
        condition: "The linked unit rental must be in reserved or active status and belong to the same customer."
        evidence_fields: [unit_rentals.status, unit_rentals.customer_id, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: linked_rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [reserved, active]
      - id: inside_window
        applies_to: [truck_credit]
        kind: time
        condition: "The free move-in truck may be claimed only when the pickup date is not later than the unit move-in date plus free_move_in_window_days, and not earlier than the move-in date minus the same number of days for a reserved unit whose move-in is scheduled."
        evidence_fields: [unit_rentals.move_in_date, unit_rentals.rental_id, truck_rentals.actual_pickup_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: linked_rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the unit move-in date"
          anchor_source: unit_rentals.move_in_date
          relation: not_after
          duration_source: variants.free_move_in_window_days
          unit: calendar_days
          counting_rule: "Window days are calendar days counted from the day after the move-in date, and the last counted day is included."
          boundary: inclusive
      - id: class_eligible
        applies_to: [truck_reservation, truck_credit]
        kind: authorization
        condition: "A tenant moving into a Bluegate storage unit may claim one free move-in truck for that unit on a vehicle class whose free_move_in_eligible is true."
        evidence_fields: [truck_rentals.variant_name, truck_rentals.truck_rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_rentals.truck_rental_id]]
          action_bindings: {truck_rentals.truck_rental_id: truck_rental_id}
    params:
      per_tier:
        Bluegate Pickup Truck: {free_move_in_eligible: "=free_move_in_eligible", free_move_in_included_miles: "=free_move_in_included_miles", free_move_in_window_days: "=free_move_in_window_days"}
        Bluegate Cargo Van: {free_move_in_eligible: "=free_move_in_eligible", free_move_in_included_miles: "=free_move_in_included_miles", free_move_in_window_days: "=free_move_in_window_days"}
        Bluegate 10 ft Moving Truck: {free_move_in_eligible: "=free_move_in_eligible", free_move_in_included_miles: "=free_move_in_included_miles", free_move_in_window_days: "=free_move_in_window_days"}
        Bluegate 15 ft Moving Truck: {free_move_in_eligible: "=free_move_in_eligible", free_move_in_included_miles: "=free_move_in_included_miles", free_move_in_window_days: "=free_move_in_window_days"}
        Bluegate 20 ft Moving Truck: {free_move_in_eligible: "=free_move_in_eligible", free_move_in_included_miles: "=free_move_in_included_miles", free_move_in_window_days: "=free_move_in_window_days"}
        Bluegate 26 ft Moving Truck: {free_move_in_eligible: "=free_move_in_eligible", free_move_in_included_miles: "=free_move_in_included_miles", free_move_in_window_days: "=free_move_in_window_days"}

  - id: truck_evt_late_return
    subject: [truck_charge, truck_return]
    rule: >-
      A late-return fee applies only when the vehicle is checked in later than the scheduled return time plus late_return_grace_hours.
      Late hours are elapsed hours from the scheduled return date and time, and a started hour counts as a full hour. Each started hour
      after the grace period is charged late_return_fee_per_hour_usd, until the vehicle is more than extra_period_after_hours late, when one
      extra_period_fee_usd replaces the hourly fees for that period; each further rental period started is charged the same way. A
      return delayed by a breakdown recorded by roadside assistance is never charged as late. An extension agreed before the scheduled
      return moves the scheduled return time and is not a late return.
    eligibility:
      - id: past_grace
        applies_to: [truck_charge]
        kind: time
        condition: "A late-return fee applies only when the vehicle is checked in later than the scheduled return time plus late_return_grace_hours."
        evidence_fields: [truck_rentals.scheduled_return_date, truck_rentals.scheduled_return_time, truck_rentals.truck_rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_rentals.truck_rental_id]]
          action_bindings: {truck_rentals.truck_rental_id: truck_rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the scheduled return time"
          anchor_source: truck_rentals.scheduled_return_time
          relation: not_before
          duration_source: variants.late_return_grace_hours
          unit: elapsed_hours
          counting_rule: "Late hours are elapsed hours from the scheduled return date and time, and a started hour counts as a full hour."
          boundary: exclusive
    params:
      per_tier:
        Bluegate Pickup Truck: {late_return_fee_per_hour_usd: "=late_return_fee_per_hour_usd", extra_period_fee_usd: "=extra_period_fee_usd"}
        Bluegate Cargo Van: {late_return_fee_per_hour_usd: "=late_return_fee_per_hour_usd", extra_period_fee_usd: "=extra_period_fee_usd"}
        Bluegate 10 ft Moving Truck: {late_return_fee_per_hour_usd: "=late_return_fee_per_hour_usd", extra_period_fee_usd: "=extra_period_fee_usd"}
        Bluegate 15 ft Moving Truck: {late_return_fee_per_hour_usd: "=late_return_fee_per_hour_usd", extra_period_fee_usd: "=extra_period_fee_usd"}
        Bluegate 20 ft Moving Truck: {late_return_fee_per_hour_usd: "=late_return_fee_per_hour_usd", extra_period_fee_usd: "=extra_period_fee_usd"}
        Bluegate 26 ft Moving Truck: {late_return_fee_per_hour_usd: "=late_return_fee_per_hour_usd", extra_period_fee_usd: "=extra_period_fee_usd"}

  - id: truck_evt_cancellation_no_show
    subject: [truck_reservation_cancelled, truck_no_show, truck_charge]
    rule: >-
      A reservation may be cancelled at no charge when the cancellation is made at least free_cancellation_hours_before_pickup elapsed
      hours before the scheduled pickup date and time. A cancellation is free only when it is made not later than the scheduled pickup
      time minus free_cancellation_hours_before_pickup. Hours are elapsed hours measured back from the scheduled pickup date and time.
      A later cancellation posts late_cancellation_fee_usd. A reservation not picked up by no_show_after_hours after the scheduled pickup
      time becomes a no-show and posts no_show_fee_usd. A reservation the facility cannot fill because no vehicle of the class is on the
      lot is cancelled without any fee.
    eligibility:
      - id: free_cancellation_cutoff
        applies_to: [truck_charge]
        kind: time
        condition: "A cancellation is free only when it is made not later than the scheduled pickup time minus free_cancellation_hours_before_pickup."
        evidence_fields: [truck_rentals.scheduled_pickup_date, truck_rentals.scheduled_pickup_time, truck_rentals.truck_rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_rentals.truck_rental_id]]
          action_bindings: {truck_rentals.truck_rental_id: truck_rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the scheduled pickup time"
          anchor_source: truck_rentals.scheduled_pickup_time
          relation: not_after
          duration_source: variants.free_cancellation_hours_before_pickup
          unit: elapsed_hours
          counting_rule: "Hours are elapsed hours measured back from the scheduled pickup date and time."
          boundary: inclusive
    params:
      per_tier:
        Bluegate Pickup Truck: {late_cancellation_fee_usd: "=late_cancellation_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Bluegate Cargo Van: {late_cancellation_fee_usd: "=late_cancellation_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Bluegate 10 ft Moving Truck: {late_cancellation_fee_usd: "=late_cancellation_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Bluegate 15 ft Moving Truck: {late_cancellation_fee_usd: "=late_cancellation_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Bluegate 20 ft Moving Truck: {late_cancellation_fee_usd: "=late_cancellation_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Bluegate 26 ft Moving Truck: {late_cancellation_fee_usd: "=late_cancellation_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}

  - id: truck_evt_deposit_and_settlement
    subject: [truck_deposit_hold, truck_deposit_release, truck_payment, truck_refund, truck_close]
    rule: >-
      At pickup an authorization hold is placed on a card in accepted_deposit_methods: deposit_hold_credit_card_usd on a credit card or
      deposit_hold_debit_card_usd on a debit card. At return the final invoice is computed; the renter pays it, or the hold is captured up
      to the balance due, and the rest of the hold is released within deposit_release_days of closing. A contract closes only when its
      balance due is zero. A credit balance, such as one created by a breakdown credit after payment, is refunded to the card. A hold is
      placed once per contract.
    eligibility:
      - id: hold_once
        applies_to: [truck_deposit_hold]
        kind: dedup
        condition: "A hold is placed once per contract."
        evidence_fields: [truck_charges.truck_rental_id, truck_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_charges.truck_rental_id]]
          action_bindings: {truck_charges.truck_rental_id: truck_rental_id}
        dedup_contract:
          table: truck_charges
          mode: separate_record
          object_bindings: {truck_rental_id: truck_rental_id}
          duplicate_filters: {event_type: [truck_deposit_hold]}
          distinct_fields: []
    params:
      per_tier:
        Bluegate Pickup Truck: {deposit_hold_credit_card_usd: "=deposit_hold_credit_card_usd", deposit_hold_debit_card_usd: "=deposit_hold_debit_card_usd"}
        Bluegate Cargo Van: {deposit_hold_credit_card_usd: "=deposit_hold_credit_card_usd", deposit_hold_debit_card_usd: "=deposit_hold_debit_card_usd"}
        Bluegate 10 ft Moving Truck: {deposit_hold_credit_card_usd: "=deposit_hold_credit_card_usd", deposit_hold_debit_card_usd: "=deposit_hold_debit_card_usd"}
        Bluegate 15 ft Moving Truck: {deposit_hold_credit_card_usd: "=deposit_hold_credit_card_usd", deposit_hold_debit_card_usd: "=deposit_hold_debit_card_usd"}
        Bluegate 20 ft Moving Truck: {deposit_hold_credit_card_usd: "=deposit_hold_credit_card_usd", deposit_hold_debit_card_usd: "=deposit_hold_debit_card_usd"}
        Bluegate 26 ft Moving Truck: {deposit_hold_credit_card_usd: "=deposit_hold_credit_card_usd", deposit_hold_debit_card_usd: "=deposit_hold_debit_card_usd"}

  - id: truck_evt_damage
    subject: [truck_damage_report, truck_charge]
    rule: >-
      Vehicle damage found at return or reported during the rental is charged according to the waiver taken at pickup. With no waiver
      the renter owes the full repair estimate (no_waiver_liability_basis). With the basic waiver the renter owes the repair estimate up
      to basic_waiver_deductible_usd, and with the premium waiver up to premium_waiver_deductible_usd. Neither waiver applies to damage to
      the cargo box roof or cab-over from striking an overhead object where overhead_damage_excluded is true, nor under any condition in
      waiver_void_conditions; then the full estimate is owed. Tolls and citations received after the rental are passed through with
      tolls_and_citations_admin_fee_usd each. Mechanical failure that is not caused by misuse is never charged to the renter. Each
      incident is charged once.
    eligibility:
      - id: incident_once
        applies_to: [truck_charge]
        kind: dedup
        condition: "Each incident is charged once."
        evidence_fields: [truck_charges.reference_id, truck_charges.charge_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_charges.reference_id]]
          action_bindings: {truck_charges.reference_id: reference_id}
        dedup_contract:
          table: truck_charges
          mode: separate_record
          object_bindings: {reference_id: reference_id, charge_type: charge_type}
          duplicate_filters: {charge_type: [damage_charge, tolls_citations_admin_fee]}
          distinct_fields: []
    params:
      per_tier:
        Bluegate Pickup Truck: {basic_waiver_deductible_usd: "=basic_waiver_deductible_usd", premium_waiver_deductible_usd: "=premium_waiver_deductible_usd", overhead_damage_excluded: "=overhead_damage_excluded"}
        Bluegate Cargo Van: {basic_waiver_deductible_usd: "=basic_waiver_deductible_usd", premium_waiver_deductible_usd: "=premium_waiver_deductible_usd", overhead_damage_excluded: "=overhead_damage_excluded"}
        Bluegate 10 ft Moving Truck: {basic_waiver_deductible_usd: "=basic_waiver_deductible_usd", premium_waiver_deductible_usd: "=premium_waiver_deductible_usd", overhead_damage_excluded: "=overhead_damage_excluded"}
        Bluegate 15 ft Moving Truck: {basic_waiver_deductible_usd: "=basic_waiver_deductible_usd", premium_waiver_deductible_usd: "=premium_waiver_deductible_usd", overhead_damage_excluded: "=overhead_damage_excluded"}
        Bluegate 20 ft Moving Truck: {basic_waiver_deductible_usd: "=basic_waiver_deductible_usd", premium_waiver_deductible_usd: "=premium_waiver_deductible_usd", overhead_damage_excluded: "=overhead_damage_excluded"}
        Bluegate 26 ft Moving Truck: {basic_waiver_deductible_usd: "=basic_waiver_deductible_usd", premium_waiver_deductible_usd: "=premium_waiver_deductible_usd", overhead_damage_excluded: "=overhead_damage_excluded"}
    formula:
      damage_owed_basic: "min(repair_estimate_usd, basic_waiver_deductible_usd)"
      damage_owed_premium: "min(repair_estimate_usd, premium_waiver_deductible_usd)"

  - id: truck_evt_changes_extensions
    subject: [truck_reservation_change]
    rule: >-
      A reservation in reserved status may be changed to another vehicle class or other times at no charge. A rental in picked_up status
      may be extended only where extension_allowed is true and the request is made at least extension_request_before_due_hours before the
      scheduled return time, and the contract may not run beyond max_rental_periods periods in total. Changes are made only to contracts
      in reserved or picked_up status. Moving a free move-in reservation to a class whose free_move_in_eligible is false removes the
      benefit.
    eligibility:
      - id: changeable_status
        applies_to: [truck_reservation_change]
        kind: state
        condition: "Changes are made only to contracts in reserved or picked_up status."
        evidence_fields: [truck_rentals.status, truck_rentals.truck_rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_rentals.truck_rental_id]]
          action_bindings: {truck_rentals.truck_rental_id: truck_rental_id}
        state_contract:
          field: truck_rentals.status
          allowed: [reserved, picked_up]
    params:
      per_tier:
        Bluegate Pickup Truck: {max_rental_periods: "=max_rental_periods", extension_request_before_due_hours: "=extension_request_before_due_hours"}
        Bluegate Cargo Van: {max_rental_periods: "=max_rental_periods", extension_request_before_due_hours: "=extension_request_before_due_hours"}
        Bluegate 10 ft Moving Truck: {max_rental_periods: "=max_rental_periods", extension_request_before_due_hours: "=extension_request_before_due_hours"}
        Bluegate 15 ft Moving Truck: {max_rental_periods: "=max_rental_periods", extension_request_before_due_hours: "=extension_request_before_due_hours"}
        Bluegate 20 ft Moving Truck: {max_rental_periods: "=max_rental_periods", extension_request_before_due_hours: "=extension_request_before_due_hours"}
        Bluegate 26 ft Moving Truck: {max_rental_periods: "=max_rental_periods", extension_request_before_due_hours: "=extension_request_before_due_hours"}

  - id: truck_evt_breakdown_and_corrections
    subject: [truck_credit]
    rule: >-
      When roadside assistance records a mechanical breakdown, the base rental fee of the interrupted period is credited in full
      (breakdown_credit_basis) and no late-return fee is charged for that period; the renter may be given a replacement vehicle on the
      same contract. A charge posted in error, such as mileage computed from a wrong odometer reading or a cleaning fee contradicted by
      the check-in condition, is credited in full as billing_error_correction. A charge already credited is not credited again.
    eligibility:
      - id: not_already_credited
        applies_to: [truck_credit]
        kind: dedup
        condition: "A charge already credited is not credited again."
        evidence_fields: [truck_charges.reference_id, truck_charges.credit_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[truck_charges.reference_id]]
          action_bindings: {truck_charges.reference_id: reference_id}
        dedup_contract:
          table: truck_charges
          mode: separate_record
          object_bindings: {reference_id: reference_id}
          duplicate_filters: {event_type: [truck_credit]}
          distinct_fields: []

  - id: truck_evt_driver_requirements
    subject: [truck_pickup]
    rule: >-
      Every driver must be at least min_driver_age_years old and hold a license meeting license_requirement, shown at the counter. The
      renter must be the customer on the reservation. The renter's age is judged from the date of birth on the customer profile. The
      deposit card must be in the renter's name. One-way returns are not offered (one_way_allowed).
    eligibility:
      - id: driver_age
        applies_to: [truck_pickup]
        kind: authorization
        condition: "The renter's age is judged from the date of birth on the customer profile."
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
    params:
      per_tier:
        Bluegate Pickup Truck: {min_driver_age_years: "=min_driver_age_years"}
        Bluegate Cargo Van: {min_driver_age_years: "=min_driver_age_years"}
        Bluegate 10 ft Moving Truck: {min_driver_age_years: "=min_driver_age_years"}
        Bluegate 15 ft Moving Truck: {min_driver_age_years: "=min_driver_age_years"}
        Bluegate 20 ft Moving Truck: {min_driver_age_years: "=min_driver_age_years"}
        Bluegate 26 ft Moving Truck: {min_driver_age_years: "=min_driver_age_years"}

  - id: truck_evt_vehicle_specs
    subject: [truck_reservation, truck_reservation_change]
    rule: >-
      A vehicle class is recommended from its published specifications: cargo_capacity_cuft, max_load_lbs, loading_ramp and
      passenger_seats, with a towing hitch where towing_hitch_included is true and 24-hour roadside assistance where
      roadside_assistance_included is true. Loading beyond max_load_lbs is the overloaded condition under which no damage waiver applies.
      The class reserved is the class charged, even when the facility hands over a larger vehicle because the reserved class is not on the
      lot.
    eligibility: []

# ============================================================================
# extended_policies: the multi-factor calculation policies of the moving_truck_rentals difficulty
# ============================================================================
extended_policies:
  - id: truck_ext_late_cancellation_fee
    base_policy_refs: [truck_evt_cancellation_no_show]
    overwrite:
      - base_policy: truck_evt_cancellation_no_show
        superseded_clause: >-
          A later cancellation posts late_cancellation_fee_usd.
        replaced_by: >-
          A cancellation made later than that posts a late cancellation fee worked out as follows, and the renter confirms that fee when cancelling.
    trigger: on_request
    subject: [truck_reservation_cancelled]
    computes: late_cancellation_fee
    target_tool: cancel_truck_reservation_ee0618b8
    params:
      long_booking_min_days: 3
      long_booking_rate_days: 2
      two_day_notice_share: 0.5
      one_day_notice_share: 0.75
      weekend_pickup_multiple: 1.5
      friday_pickup_multiple: 1.25
      new_tenant_share: 0.5
      existing_tenant_share: 0.75
    rule: >-
      A reservation in reserved status is cancelled by the renter, and the cancellation is free when it is made at least
      free_cancellation_hours_before_pickup elapsed hours before the scheduled pickup date and time; that free cancellation is
      unchanged. A cancellation made later than that posts a late cancellation fee worked out as follows, and the renter confirms
      that fee when cancelling. The standard late cancellation fee is the flat late_cancellation_fee_usd of the vehicle class
      reserved, rounded to the cent. The cancellation fee basis depends on the rental days booked, counted as the calendar days
      from the scheduled pickup date to the scheduled return date: a reservation booked for long_booking_min_days or more days is
      charged long_booking_rate_days times the class base_rate_usd, a reservation booked for two days is charged the larger of one
      class base_rate_usd and the flat late_cancellation_fee_usd, and any other reservation is charged the flat
      late_cancellation_fee_usd. The cancellation notice share depends on the calendar days from the cancellation date to the
      scheduled pickup date: two or more days of notice take two_day_notice_share of the cancellation fee basis, one day of notice
      takes one_day_notice_share, and a cancellation on the scheduled pickup date itself takes the whole cancellation fee basis.
      The cancellation peak-day multiple depends on the weekday of the scheduled pickup date: a Saturday or Sunday pickup
      multiplies the cancellation fee by weekend_pickup_multiple, a Friday pickup by friday_pickup_multiple, and a pickup on any
      other weekday by one. The cancellation tenant courtesy share depends on the renter's storage records: a renter holding an
      active storage agreement at the reservation's own facility whose move-in date is less than one whole calendar month before
      the cancellation date takes new_tenant_share of the cancellation fee; a renter without such an agreement who was billed
      storage rent less than twelve whole calendar months before the cancellation date takes existing_tenant_share; any other
      renter pays the whole cancellation fee. The late cancellation fee is the cancellation fee basis multiplied first by the
      cancellation peak-day multiple, that result multiplied by the cancellation notice share, and that result multiplied by the
      cancellation tenant courtesy share, rounded to the cent once at the end and never at an intermediate step.
    prerequisite: []
    cross_category:
      - category: unit
        as: history
        reads: [status, facility_code, move_in_date, unit_ledger.event_type, unit_ledger.entry_date]
        note: The tenant courtesy share is decided from the renter's active storage agreement at the reservation's facility and from the storage rent charges on the unit ledger.
    compute:
      - notice_days: "DAYS(NOW, F('scheduled_pickup_date'))"
      - notice_share: "K('two_day_notice_share') if notice_days >= 2 else (K('one_day_notice_share') if notice_days == 1 else 1.0)"
      - pickup_weekday: "DAYS('2026-01-04', F('scheduled_pickup_date')) % 7"
      - peak_multiple: "K('weekend_pickup_multiple') if (pickup_weekday == 6 or pickup_weekday == 0) else (K('friday_pickup_multiple') if pickup_weekday == 5 else 1.0)"
      - booked_days: "DAYS(F('scheduled_pickup_date'), F('scheduled_return_date'))"
      - fee_basis: "K('long_booking_rate_days') * P('base_rate_usd') if booked_days >= K('long_booking_min_days') else (MX(P('base_rate_usd'), P('late_cancellation_fee_usd')) if booked_days == 2 else P('late_cancellation_fee_usd'))"
      - facility_move_in: "CFIELD('unit', 'move_in_date', status='active', facility_code=F('facility_code'))"
      - storage_rent_bills: "XCOUNT('unit', 'unit_ledger', within_months=12, date_field='entry_date', event_type='unit_rent_charge')"
      - courtesy_share: "K('new_tenant_share') if (facility_move_in != None and MONTHS(facility_move_in, NOW) < 1) else (K('existing_tenant_share') if storage_rent_bills >= 1 else 1.0)"
      - result: "RND(fee_basis * peak_multiple * notice_share * courtesy_share, 2)"
    compute_basis:
      notice_days: "The cancellation notice share depends on the calendar days from the cancellation date to the scheduled pickup date"
      notice_share: "two or more days of notice take two_day_notice_share of the cancellation fee basis, one day of notice takes one_day_notice_share, and a cancellation on the scheduled pickup date itself takes the whole cancellation fee basis."
      pickup_weekday: "The cancellation peak-day multiple depends on the weekday of the scheduled pickup date"
      peak_multiple: "a Saturday or Sunday pickup multiplies the cancellation fee by weekend_pickup_multiple, a Friday pickup by friday_pickup_multiple, and a pickup on any other weekday by one."
      booked_days: "The cancellation fee basis depends on the rental days booked, counted as the calendar days from the scheduled pickup date to the scheduled return date"
      fee_basis: "a reservation booked for long_booking_min_days or more days is charged long_booking_rate_days times the class base_rate_usd, a reservation booked for two days is charged the larger of one class base_rate_usd and the flat late_cancellation_fee_usd, and any other reservation is charged the flat late_cancellation_fee_usd."
      facility_move_in: "a renter holding an active storage agreement at the reservation's own facility whose move-in date is less than one whole calendar month before the cancellation date takes new_tenant_share of the cancellation fee"
      storage_rent_bills: "a renter without such an agreement who was billed storage rent less than twelve whole calendar months before the cancellation date takes existing_tenant_share"
      courtesy_share: "The cancellation tenant courtesy share depends on the renter's storage records: a renter holding an active storage agreement at the reservation's own facility whose move-in date is less than one whole calendar month before the cancellation date takes new_tenant_share of the cancellation fee; a renter without such an agreement who was billed storage rent less than twelve whole calendar months before the cancellation date takes existing_tenant_share; any other renter pays the whole cancellation fee."
      result: "The late cancellation fee is the cancellation fee basis multiplied first by the cancellation peak-day multiple, that result multiplied by the cancellation notice share, and that result multiplied by the cancellation tenant courtesy share, rounded to the cent once at the end and never at an intermediate step."
    factors:
      - id: cancellation_fee_basis
        effect: method
        decides: fee_basis
        bindings: [booked_days, fee_basis]
        ladder:
          - when: "the reservation was booked for long_booking_min_days or more rental days"
            method: "the fee basis is long_booking_rate_days times the class base_rate_usd"
          - when: "the reservation was booked for two rental days"
            method: "the fee basis is the larger of one class base_rate_usd and the flat late_cancellation_fee_usd"
          - when: "otherwise"
            method: "the fee basis is the flat late_cancellation_fee_usd"
        baseline:
          fee_basis: "P('late_cancellation_fee_usd')"
        evidence: [date]
        cross_difficulty: null
      - id: cancellation_notice_share
        effect: parameter
        decides: notice_share
        bindings: [notice_days, notice_share]
        ladder:
          - when: "the cancellation is made two or more calendar days before the scheduled pickup date"
            value: "K('two_day_notice_share')"
          - when: "the cancellation is made one calendar day before the scheduled pickup date"
            value: "K('one_day_notice_share')"
          - when: "otherwise (cancelled on the scheduled pickup date)"
            value: "1.0"
        baseline:
          notice_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: cancellation_peak_day
        effect: parameter
        decides: peak_multiple
        bindings: [pickup_weekday, peak_multiple]
        ladder:
          - when: "the scheduled pickup date is a Saturday or a Sunday"
            value: "K('weekend_pickup_multiple')"
          - when: "the scheduled pickup date is a Friday"
            value: "K('friday_pickup_multiple')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          peak_multiple: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: cancellation_tenant_courtesy
        effect: parameter
        decides: courtesy_share
        bindings: [facility_move_in, storage_rent_bills, courtesy_share]
        ladder:
          - when: "the renter holds an active storage agreement at the reservation's facility with a move-in date less than one whole calendar month before the cancellation date"
            value: "K('new_tenant_share')"
          - when: "no such agreement, but the renter was billed storage rent less than twelve whole calendar months before the cancellation date"
            value: "K('existing_tenant_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          courtesy_share: "1.0"
        evidence: [cross_category, history, date]
        cross_difficulty: unit
    baseline:
      rule: >-
        The standard late cancellation fee is the flat late_cancellation_fee_usd of the vehicle class reserved, rounded to the cent.
      params: [late_cancellation_fee_usd]
    inputs:
      history:
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_rent_charge}}
      cross_category: [unit]
  - id: truck_ext_additional_day_charge
    base_policy_refs: [truck_evt_pricing, truck_evt_late_return]
    overwrite:
      - base_policy: truck_evt_pricing
        superseded_clause: >-
          A contract is charged base_rate_usd for each rental period started, a period being rental_period_hours elapsed hours from
          the actual pickup time; the first period is posted at pickup.
        replaced_by: >-
          The additional-day charge is the additional-day rate multiplied by the additional days so counted, that result multiplied
          by the second-day weekday multiple, and that result multiplied by the move-in-day share, rounded to the cent once at the end.
    trigger: state_due
    subject: [truck_return]
    computes: amount
    target_tool: post_additional_rental_day_charge_add5e32c
    params:
      long_booking_days: 3
      weekend_second_day_multiple: 1.2
      friday_second_day_multiple: 1.1
      same_facility_move_in_share: 0.5
      other_facility_move_in_share: 0.75
      noon_return_share: 0.5
      afternoon_return_share: 0.75
    rule: >-
      At check-in every rental day the contract started after its first, up to the rental days booked, is charged as an
      additional rental day. A rental day is rental_period_hours elapsed hours from the actual pickup time, so the rental days
      started are the calendar days from the actual pickup date to the actual return date, plus one more when the actual return
      time is later than the actual pickup time; the rental days booked are counted the same way from the scheduled pickup date
      and time to the scheduled return date and time; the first rental day is the first-day rental fee posted when the contract
      opened, and rental days started beyond the rental days booked are late-return periods charged under the late-return rules,
      not additional days. The standard additional-day charge is the class base_rate_usd for each additional rental day, posted as
      one base rental fee line dated the actual return date with the additional days as its quantity, and rounded to the cent. The
      additional-day rate depends on the booking, the booked days being the calendar days from the scheduled pickup date to the
      scheduled return date: a contract booked for long_booking_days or more days is charged the lower of the first-day rental fee
      posted on its actual pickup date and the class base_rate_usd for each additional day; a contract booked for two days is
      charged the first-day rental fee posted on its actual pickup date, as posted, for each additional day; any other contract is
      charged the class base_rate_usd for each additional day. The second-day weekday multiple depends on the weekday on which the
      contract's second rental day began, which is the day after the actual pickup date: a Saturday or Sunday multiplies the
      additional-day rate by weekend_second_day_multiple, a Friday by friday_second_day_multiple, and any other weekday by one. The
      move-in-day share depends on the renter's storage agreements: when an active storage agreement of the renter at the pickup
      facility has its move-in date on the actual pickup date or on the actual return date of the contract, the additional days take
      same_facility_move_in_share of the rate; when such a move-in is on an active storage agreement at another facility, they take
      other_facility_move_in_share; otherwise they take the whole rate. The last additional day is counted by the return time: when
      the vehicle came back within the rental days booked on the calendar day that last rental day began, that is with an actual
      return time later than the actual pickup time, and no later than 12:00, the last additional day counts as noon_return_share of
      a day; when it came back on that day no later than 15:00, it counts as afternoon_return_share of a day; otherwise it counts as
      a whole day, and every earlier additional day counts as a whole day. The additional-day charge is the additional-day rate
      multiplied by the additional days so counted, that result multiplied by the second-day weekday multiple, and that result
      multiplied by the move-in-day share, rounded to the cent once at the end.
    prerequisite: []
    cross_category:
      - category: unit
        as: branch
        reads: [status, move_in_date, facility_code]
        note: The move-in-day share is decided from the renter's active storage agreements, their move-in dates and their facility.
    compute:
      - days_started: "DAYS(F('actual_pickup_date'), F('actual_return_date')) + (1 if F('actual_return_time') > F('actual_pickup_time') else 0)"
      - booked_periods: "DAYS(F('scheduled_pickup_date'), F('scheduled_return_date')) + (1 if F('scheduled_return_time') > F('scheduled_pickup_time') else 0)"
      - additional_days: "MX(0, MN(days_started, MX(1, booked_periods)) - 1)"
      - last_day_share: "K('noon_return_share') if (days_started <= booked_periods and F('actual_return_time') > F('actual_pickup_time') and F('actual_return_time') <= '12:00') else (K('afternoon_return_share') if (days_started <= booked_periods and F('actual_return_time') > F('actual_pickup_time') and F('actual_return_time') <= '15:00') else 1.0)"
      - counted_days: "(additional_days - 1 + last_day_share) if additional_days >= 1 else 0"
      - booked_days: "DAYS(F('scheduled_pickup_date'), F('scheduled_return_date'))"
      - first_day_fee: "SUM('truck_charges', 'amount', event_type='truck_charge', charge_type='base_rental_fee', service_date=F('actual_pickup_date'))"
      - day_rate: "MN(first_day_fee, P('base_rate_usd')) if booked_days >= K('long_booking_days') else (first_day_fee if booked_days == 2 else P('base_rate_usd'))"
      - second_day_weekday: "(DAYS('2026-01-04', F('actual_pickup_date')) + 1) % 7"
      - second_day_multiple: "K('weekend_second_day_multiple') if (second_day_weekday == 6 or second_day_weekday == 0) else (K('friday_second_day_multiple') if second_day_weekday == 5 else 1.0)"
      - pickup_day_move_in_facility: "CFIELD('unit', 'facility_code', move_in_date=F('actual_pickup_date'), status='active')"
      - return_day_move_in_facility: "CFIELD('unit', 'facility_code', move_in_date=F('actual_return_date'), status='active')"
      - move_in_day_share: "K('same_facility_move_in_share') if (pickup_day_move_in_facility == F('facility_code') or return_day_move_in_facility == F('facility_code')) else (K('other_facility_move_in_share') if (pickup_day_move_in_facility != None or return_day_move_in_facility != None) else 1.0)"
      - result: "RND(day_rate * counted_days * second_day_multiple * move_in_day_share, 2)"
    compute_basis:
      days_started: "the rental days started are the calendar days from the actual pickup date to the actual return date, plus one more when the actual return time is later than the actual pickup time"
      booked_periods: "the rental days booked are counted the same way from the scheduled pickup date and time to the scheduled return date and time"
      additional_days: "At check-in every rental day the contract started after its first, up to the rental days booked, is charged as an additional rental day."
      last_day_share: "when the vehicle came back within the rental days booked on the calendar day that last rental day began, that is with an actual return time later than the actual pickup time, and no later than 12:00, the last additional day counts as noon_return_share of a day; when it came back on that day no later than 15:00, it counts as afternoon_return_share of a day; otherwise it counts as a whole day"
      counted_days: "otherwise it counts as a whole day, and every earlier additional day counts as a whole day."
      booked_days: "the booked days being the calendar days from the scheduled pickup date to the scheduled return date"
      first_day_fee: "the first-day rental fee posted on its actual pickup date"
      day_rate: "a contract booked for long_booking_days or more days is charged the lower of the first-day rental fee posted on its actual pickup date and the class base_rate_usd for each additional day; a contract booked for two days is charged the first-day rental fee posted on its actual pickup date, as posted, for each additional day; any other contract is charged the class base_rate_usd for each additional day."
      second_day_weekday: "The second-day weekday multiple depends on the weekday on which the contract's second rental day began, which is the day after the actual pickup date"
      second_day_multiple: "a Saturday or Sunday multiplies the additional-day rate by weekend_second_day_multiple, a Friday by friday_second_day_multiple, and any other weekday by one."
      pickup_day_move_in_facility: "when an active storage agreement of the renter at the pickup facility has its move-in date on the actual pickup date or on the actual return date of the contract"
      return_day_move_in_facility: "when an active storage agreement of the renter at the pickup facility has its move-in date on the actual pickup date or on the actual return date of the contract"
      move_in_day_share: "The move-in-day share depends on the renter's storage agreements: when an active storage agreement of the renter at the pickup facility has its move-in date on the actual pickup date or on the actual return date of the contract, the additional days take same_facility_move_in_share of the rate; when such a move-in is on an active storage agreement at another facility, they take other_facility_move_in_share; otherwise they take the whole rate."
      result: "The additional-day charge is the additional-day rate multiplied by the additional days so counted, that result multiplied by the second-day weekday multiple, and that result multiplied by the move-in-day share, rounded to the cent once at the end."
    factors:
      - id: last_day_return_share
        effect: parameter
        decides: last_day_share
        bindings: [days_started, last_day_share]
        ladder:
          - when: "the vehicle came back within the rental days booked, on the calendar day the last rental day began, no later than 12:00"
            value: "K('noon_return_share')"
          - when: "the vehicle came back within the rental days booked, on the calendar day the last rental day began, after 12:00 and no later than 15:00"
            value: "K('afternoon_return_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          last_day_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: additional_day_rate_source
        effect: method
        decides: day_rate
        bindings: [booked_days, first_day_fee, day_rate]
        ladder:
          - when: "the contract was booked for long_booking_days or more days"
            method: "each additional day is priced at the lower of the first-day rental fee posted on the actual pickup date and the class base_rate_usd"
          - when: "the contract was booked for two days"
            method: "each additional day is priced at the first-day rental fee posted on the actual pickup date, as posted"
          - when: "otherwise"
            method: "each additional day is priced at the class base_rate_usd"
        baseline:
          day_rate: "P('base_rate_usd')"
        evidence: [date, history]
        cross_difficulty: null
      - id: second_day_weekday
        effect: parameter
        decides: second_day_multiple
        bindings: [second_day_weekday, second_day_multiple]
        ladder:
          - when: "the contract's second rental day began on a Saturday or a Sunday"
            value: "K('weekend_second_day_multiple')"
          - when: "the contract's second rental day began on a Friday"
            value: "K('friday_second_day_multiple')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          second_day_multiple: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: move_in_day_share
        effect: parameter
        decides: move_in_day_share
        bindings: [pickup_day_move_in_facility, return_day_move_in_facility, move_in_day_share]
        ladder:
          - when: "an active storage agreement of the renter at the pickup facility has its move-in date on the contract's actual pickup date or actual return date"
            value: "K('same_facility_move_in_share')"
          - when: "such a move-in is on an active storage agreement of the renter at another facility"
            value: "K('other_facility_move_in_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          move_in_day_share: "1.0"
        evidence: [cross_category, date]
        cross_difficulty: unit
    baseline:
      rule: >-
        A rental day is rental_period_hours elapsed hours from the actual pickup time, so the rental days started are the calendar
        days from the actual pickup date to the actual return date, plus one more when the actual return time is later than the actual
        pickup time; the rental days booked are counted the same way from the scheduled pickup date and time to the scheduled return
        date and time; the first rental day is the first-day rental fee posted when the contract opened, and rental days started
        beyond the rental days booked are late-return periods charged under the late-return rules, not additional days. The standard
        additional-day charge is the class base_rate_usd for each additional rental day, posted as one base rental fee line dated the
        actual return date with the additional days as its quantity, and rounded to the cent.
      params: [base_rate_usd, rental_period_hours]
    inputs:
      history:
        - {table: truck_charges, aggregate: sum, field: amount, filters: {event_type: truck_charge, charge_type: base_rental_fee}}
      cross_category: [unit]
  - id: truck_ext_move_in_mileage_allowance
    base_policy_refs: [truck_agg_free_move_in_once, truck_evt_free_move_in, truck_evt_breakdown_and_corrections, truck_evt_pricing]
    overwrite:
      - base_policy: truck_evt_free_move_in
        superseded_clause: >-
          On a free move-in contract the charges in free_move_in_waived_charges for the first rental period are credited in full as
          free_move_in_waiver, and the first free_move_in_included_miles miles are not charged.
        replaced_by: >-
          The included-miles allowance is the unit-size miles plus the rental-day miles, the move-in trip miles, the unit-class miles
          and the cross-facility miles, all added together first, then multiplied by the protection multiple and rounded down to a
          whole mile; the credited miles are the miles charged on the mileage line up to that allowance, and the included-miles credit
          is the credited miles at the class per_mile_usd, rounded to the cent once at the end.
    trigger: state_due
    subject: [truck_credit]
    computes: amount
    target_tool: apply_move_in_claim_miles_credit_24951572
    params:
      large_unit_miles: 100
      medium_unit_miles: 60
      three_day_bonus_miles: 40
      two_day_bonus_miles: 20
      same_day_move_in_miles: 15
      early_pickup_miles: 10
      early_pickup_max_days: 3
      premium_class_miles: 25
      climate_class_miles: 10
      other_facility_before_miles: 25
      other_facility_after_miles: 15
      high_coverage_limit: 5000
      high_coverage_multiple: 1.5
      other_coverage_multiple: 1.25
    rule: >-
      A free move-in claim is recorded on a truck contract for the renter's storage unit with the most recent move-in, which is the
      storage agreement of the renter's latest storage administrative fee, and when the claim is recorded the claimed miles are
      credited against the contract's mileage line as a free move-in waiver. The included-miles credit is not posted until no other
      reserved, picked-up or returned truck contract of the renter carries a claim on the same storage unit. The included-miles
      credit is fixed only after every rental day the contract started stands charged on the contract. The standard included-miles
      allowance is free_move_in_included_miles miles; the credited miles are the miles charged on the contract's mileage line up to
      that allowance, and the included-miles credit is the credited miles at the class per_mile_usd, rounded to the cent. The
      unit-size miles depend on the size of the claimed storage unit: a 10x15, 10x20, 10x25 or 10x30 unit carries large_unit_miles,
      a 5x10, 5x15 or 10x10 unit carries medium_unit_miles, and any smaller unit carries free_move_in_included_miles. The rental-day
      miles depend on the rental days charged on the contract, which are the quantities of its base rental fee lines added
      together: three or more rental days charged add three_day_bonus_miles, two add two_day_bonus_miles, and a single rental day
      adds no miles. The move-in trip miles depend on the calendar days from the actual
      pickup date to the claimed unit's move-in date: a pickup on the move-in date itself adds same_day_move_in_miles, a pickup one
      to early_pickup_max_days days before the move-in date adds early_pickup_miles for each of those days, counted as the calendar
      days from the pickup date to the move-in date, and any other pickup adds no miles. The
      unit-class miles depend on the class of the claimed unit: a Bluegate Premier Climate Suite or a Bluegate Wine & Collectibles
      Vault adds premium_class_miles, a Bluegate Climate Controlled or a Bluegate Climate Plus unit adds climate_class_miles, and any
      other class adds no miles. The cross-facility miles depend on where the claimed unit is: a unit at a facility other than the
      truck's pickup facility, with the truck picked up on or before the unit's move-in date, adds other_facility_before_miles; a
      unit at another facility with the truck picked up after the unit's move-in date adds other_facility_after_miles; a unit at the
      pickup facility adds no miles. The protection multiple depends on the claimed unit's Bluegate Tenant Protection Plan: an active
      plan with a coverage limit of high_coverage_limit or more multiplies the allowance by high_coverage_multiple, an active plan
      with a lower coverage limit multiplies it by other_coverage_multiple, and a unit without an active plan keeps the allowance as
      it is. The included-miles allowance is the unit-size miles plus the rental-day miles, the move-in trip miles, the unit-class
      miles and the cross-facility miles, all added together first, then multiplied by the protection multiple and rounded down to a
      whole mile; the credited miles are the miles charged on the mileage line up to that allowance, and the included-miles credit
      is the credited miles at the class per_mile_usd, rounded to the cent once at the end.
    prerequisite:
      - problem: truck_ext_late_cancellation_fee
        kind: state_gate
        gate: truck_rentals.status
        form: state
        policy_source: >-
          The included-miles credit is not posted until no other reserved, picked-up or returned truck contract of the renter carries
          a claim on the same storage unit.
        condition: >-
          No truck contract of the renter other than the credited one stands in reserved, picked_up or returned status with the
          claimed storage unit as its linked storage unit.
        resolved_by: cancel_truck_reservation_ee0618b8
        effect: >-
          Once the other reservation carrying the same storage unit stands cancelled, the free move-in once-per-unit gate on the
          included-miles credit holds and the credit may be posted with the claim on the credited contract.
      - problem: truck_ext_additional_day_charge
        kind: value_input
        gate: rental_days_charged
        form: state
        policy_source: >-
          The included-miles credit is fixed only after every rental day the contract started stands charged on the contract.
        condition: >-
          The quantities of the contract's base rental fee lines add up to every rental day the contract started, up to its rental
          days booked.
        resolved_by: post_additional_rental_day_charge_add5e32c
        effect: >-
          Posting the additional-day base rental fee line raises the rental days charged that the rental-day miles read, which raises
          the rental-day miles and with them the allowance and the included-miles credit.
    cross_category:
      - category: unit
        as: branch
        reads: [unit_ledger.rental_id, unit_size, move_in_date, variant_name, facility_code]
        note: The claimed unit is found from the renter's latest storage administrative fee, and its size, class, move-in date and facility decide four of the allowance factors.
      - category: protect
        as: branch
        reads: [coverage_limit, status]
        note: The protection multiple is decided from the active Bluegate Tenant Protection Plan on the claimed storage unit.
    compute:
      - claimed_unit: "XLATEST('unit', 'unit_ledger', 'rental_id', date_field='entry_date', event_type='unit_fee_charge', fee_type='admin_fee')"
      - claimed_size: "CFIELD('unit', 'unit_size', rental_id=claimed_unit)"
      - unit_size_miles: "K('large_unit_miles') if (claimed_size == '10x15' or claimed_size == '10x20' or claimed_size == '10x25' or claimed_size == '10x30') else (K('medium_unit_miles') if (claimed_size == '5x10' or claimed_size == '5x15' or claimed_size == '10x10') else P('free_move_in_included_miles'))"
      - rental_days_charged: "SUM('truck_charges', 'quantity', event_type='truck_charge', charge_type='base_rental_fee')"
      - rental_day_miles: "K('three_day_bonus_miles') if rental_days_charged >= 3 else (K('two_day_bonus_miles') if rental_days_charged == 2 else 0)"
      - claimed_move_in: "CFIELD('unit', 'move_in_date', rental_id=claimed_unit)"
      - pickup_lead_days: "DAYS(F('actual_pickup_date'), claimed_move_in) if claimed_move_in != None else -1"
      - move_in_trip_miles: "K('same_day_move_in_miles') if pickup_lead_days == 0 else (K('early_pickup_miles') * pickup_lead_days if (pickup_lead_days >= 1 and pickup_lead_days <= K('early_pickup_max_days')) else 0)"
      - claimed_class: "CFIELD('unit', 'variant_name', rental_id=claimed_unit)"
      - unit_class_miles: "K('premium_class_miles') if (claimed_class == 'Bluegate Premier Climate Suite' or claimed_class == 'Bluegate Wine & Collectibles Vault') else (K('climate_class_miles') if (claimed_class == 'Bluegate Climate Controlled' or claimed_class == 'Bluegate Climate Plus') else 0)"
      - claimed_facility: "CFIELD('unit', 'facility_code', rental_id=claimed_unit)"
      - cross_facility_miles: "K('other_facility_before_miles') if (claimed_facility != None and claimed_facility != F('facility_code') and pickup_lead_days >= 0) else (K('other_facility_after_miles') if (claimed_facility != None and claimed_facility != F('facility_code')) else 0)"
      - claimed_coverage: "CFIELD('protect', 'coverage_limit', rental_id=claimed_unit, status='active')"
      - protection_multiple: "K('high_coverage_multiple') if (claimed_coverage != None and claimed_coverage >= K('high_coverage_limit')) else (K('other_coverage_multiple') if claimed_coverage != None else 1.0)"
      - allowance_miles: "int((unit_size_miles + rental_day_miles + move_in_trip_miles + unit_class_miles + cross_facility_miles) * protection_multiple)"
      - miles_charged: "SUM('truck_charges', 'quantity', event_type='truck_charge', charge_type='mileage')"
      - result: "RND(MN(miles_charged, allowance_miles) * P('per_mile_usd'), 2)"
    compute_basis:
      claimed_unit: "A free move-in claim is recorded on a truck contract for the renter's storage unit with the most recent move-in, which is the storage agreement of the renter's latest storage administrative fee"
      claimed_size: "The unit-size miles depend on the size of the claimed storage unit"
      unit_size_miles: "a 10x15, 10x20, 10x25 or 10x30 unit carries large_unit_miles, a 5x10, 5x15 or 10x10 unit carries medium_unit_miles, and any smaller unit carries free_move_in_included_miles."
      rental_days_charged: "The rental-day miles depend on the rental days charged on the contract, which are the quantities of its base rental fee lines added together"
      rental_day_miles: "three or more rental days charged add three_day_bonus_miles, two add two_day_bonus_miles, and a single rental day adds no miles."
      claimed_move_in: "The move-in trip miles depend on the calendar days from the actual pickup date to the claimed unit's move-in date"
      pickup_lead_days: "The move-in trip miles depend on the calendar days from the actual pickup date to the claimed unit's move-in date"
      move_in_trip_miles: "a pickup on the move-in date itself adds same_day_move_in_miles, a pickup one to early_pickup_max_days days before the move-in date adds early_pickup_miles for each of those days, counted as the calendar days from the pickup date to the move-in date, and any other pickup adds no miles."
      claimed_class: "The unit-class miles depend on the class of the claimed unit"
      unit_class_miles: "a Bluegate Premier Climate Suite or a Bluegate Wine & Collectibles Vault adds premium_class_miles, a Bluegate Climate Controlled or a Bluegate Climate Plus unit adds climate_class_miles, and any other class adds no miles."
      claimed_facility: "The cross-facility miles depend on where the claimed unit is"
      cross_facility_miles: "a unit at a facility other than the truck's pickup facility, with the truck picked up on or before the unit's move-in date, adds other_facility_before_miles; a unit at another facility with the truck picked up after the unit's move-in date adds other_facility_after_miles; a unit at the pickup facility adds no miles."
      claimed_coverage: "The protection multiple depends on the claimed unit's Bluegate Tenant Protection Plan"
      protection_multiple: "an active plan with a coverage limit of high_coverage_limit or more multiplies the allowance by high_coverage_multiple, an active plan with a lower coverage limit multiplies it by other_coverage_multiple, and a unit without an active plan keeps the allowance as it is."
      allowance_miles: "The included-miles allowance is the unit-size miles plus the rental-day miles, the move-in trip miles, the unit-class miles and the cross-facility miles, all added together first, then multiplied by the protection multiple and rounded down to a whole mile"
      miles_charged: "the credited miles are the miles charged on the mileage line up to that allowance"
      result: "the included-miles credit is the credited miles at the class per_mile_usd, rounded to the cent once at the end."
    factors:
      - id: claimed_unit_size_miles
        effect: parameter
        decides: unit_size_miles
        bindings: [claimed_unit, claimed_size, unit_size_miles]
        ladder:
          - when: "the claimed storage unit is 10x15, 10x20, 10x25 or 10x30"
            value: "K('large_unit_miles')"
          - when: "the claimed storage unit is 5x10, 5x15 or 10x10"
            value: "K('medium_unit_miles')"
          - when: "otherwise"
            value: "P('free_move_in_included_miles')"
        baseline:
          unit_size_miles: "P('free_move_in_included_miles')"
        evidence: [cross_category, history]
        cross_difficulty: unit
      - id: rental_day_miles
        effect: parameter
        decides: rental_day_miles
        bindings: [rental_days_charged, rental_day_miles]
        ladder:
          - when: "three or more rental days are charged on the contract"
            value: "K('three_day_bonus_miles')"
          - when: "two rental days are charged on the contract"
            value: "K('two_day_bonus_miles')"
          - when: "otherwise"
            value: "0"
        baseline:
          rental_day_miles: "0"
        evidence: [history]
        cross_difficulty: null
      - id: move_in_trip_miles
        effect: method
        decides: move_in_trip_miles
        bindings: [claimed_move_in, pickup_lead_days, move_in_trip_miles]
        ladder:
          - when: "the truck was picked up on the claimed unit's move-in date"
            method: "a flat same_day_move_in_miles are added"
          - when: "the truck was picked up one to early_pickup_max_days days before the claimed unit's move-in date"
            method: "early_pickup_miles are added for each calendar day from the pickup date to the move-in date, so the miles grow with the lead"
          - when: "otherwise"
            method: "no move-in trip miles are added"
        baseline:
          move_in_trip_miles: "0"
        evidence: [cross_category, date]
        cross_difficulty: unit
      - id: claimed_unit_class_miles
        effect: parameter
        decides: unit_class_miles
        bindings: [claimed_class, unit_class_miles]
        ladder:
          - when: "the claimed unit is a Bluegate Premier Climate Suite or a Bluegate Wine & Collectibles Vault"
            value: "K('premium_class_miles')"
          - when: "the claimed unit is a Bluegate Climate Controlled or a Bluegate Climate Plus unit"
            value: "K('climate_class_miles')"
          - when: "otherwise"
            value: "0"
        baseline:
          unit_class_miles: "0"
        evidence: [cross_category]
        cross_difficulty: unit
      - id: cross_facility_miles
        effect: parameter
        decides: cross_facility_miles
        bindings: [claimed_facility, cross_facility_miles]
        ladder:
          - when: "the claimed unit is at a facility other than the pickup facility and the truck was picked up on or before the unit's move-in date"
            value: "K('other_facility_before_miles')"
          - when: "the claimed unit is at a facility other than the pickup facility and the truck was picked up after the unit's move-in date"
            value: "K('other_facility_after_miles')"
          - when: "otherwise (the claimed unit is at the pickup facility)"
            value: "0"
        baseline:
          cross_facility_miles: "0"
        evidence: [cross_category, date]
        cross_difficulty: unit
      - id: protection_multiple
        effect: parameter
        decides: protection_multiple
        bindings: [claimed_coverage, protection_multiple]
        ladder:
          - when: "the claimed unit carries an active Bluegate Tenant Protection Plan with a coverage limit of high_coverage_limit or more"
            value: "K('high_coverage_multiple')"
          - when: "the claimed unit carries an active Bluegate Tenant Protection Plan with a lower coverage limit"
            value: "K('other_coverage_multiple')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          protection_multiple: "1.0"
        evidence: [cross_category]
        cross_difficulty: protect
    baseline:
      rule: >-
        The standard included-miles allowance is free_move_in_included_miles miles; the credited miles are the miles charged on the
        contract's mileage line up to that allowance, and the included-miles credit is the credited miles at the class per_mile_usd,
        rounded to the cent.
      params: [free_move_in_included_miles, per_mile_usd]
    inputs:
      history:
        - {table: truck_charges, aggregate: sum, field: quantity, filters: {event_type: truck_charge, charge_type: base_rental_fee}}
        - {table: truck_charges, aggregate: sum, field: quantity, filters: {event_type: truck_charge, charge_type: mileage}}
        - {category: unit, table: unit_ledger, aggregate: latest, field: rental_id, filters: {event_type: unit_fee_charge, fee_type: admin_fee}}
      cross_category: [unit, protect]
  - id: truck_ext_move_in_rental_waiver
    base_policy_refs: [truck_agg_free_move_in_once, truck_evt_free_move_in, truck_evt_breakdown_and_corrections]
    overwrite:
      - base_policy: truck_evt_free_move_in
        superseded_clause: >-
          On a free move-in contract the charges in free_move_in_waived_charges for the first rental period are credited in full as
          free_move_in_waiver, and the first free_move_in_included_miles miles are not charged.
        replaced_by: >-
          The free move-in rental waiver credits the first-day rental fee of the truck contract that carries the renter's storage-unit
          claim, as one free move-in waiver against that first-day fee line, and the environmental fee of a free move-in contract stays
          chargeable.
      - base_policy: truck_agg_free_move_in_once
        superseded_clause: >-
          The free move-in truck is never combined with another discount on the same contract.
        replaced_by: >-
          The rental waiver is never figured on more than the first-day rental fee as posted, so a discount already given on that fee
          and the rental waiver together never exceed it.
    trigger: state_due
    subject: [truck_credit]
    computes: amount
    target_tool: credit_move_in_rental_waiver_7c9a948d
    params:
      part_day_share: 0.5
      small_unit_share: 0.6
      medium_unit_share: 0.8
      first_month_promo_share: 0.75
      military_unit_share: 0.9
      long_tenant_rent_bills: 12
      long_tenant_share: 0.85
      returning_tenant_share: 0.95
      other_facility_early_share: 0.9
      other_facility_late_share: 0.8
      no_autopay_share: 0.9
      inactive_autopay_share: 0.95
    rule: >-
      The free move-in rental waiver credits the first-day rental fee of the truck contract that carries the renter's storage-unit
      claim, as one free move-in waiver against that first-day fee line, and the environmental fee of a free move-in contract stays
      chargeable. The rental waiver is not credited before the truck contract carries the storage-unit claim it is credited for. The
      rental waiver is never figured on more than the first-day rental fee as posted, so a discount already given on that fee and
      the rental waiver together never exceed it. The standard rental waiver is the first-day rental fee posted
      on the contract, the fee line dated the actual pickup date, credited in full and rounded to the cent. The waiver basis
      depends on the booking: a contract booked to come back on its scheduled pickup date takes the lower of the first-day rental
      fee as posted and part_day_share of the class base_rate_usd, so that a part-day rental is waived as part of a day; a longer
      booking whose scheduled pickup date is a Friday, Saturday or Sunday takes the lower of the first-day rental fee as posted and
      the class base_rate_usd, so that any pickup-day surcharge in its first-day fee stays payable; any other booking takes the
      first-day rental fee as posted. The waiver unit-size share depends
      on the size of the claimed storage unit: a 4x5 or 5x5 unit takes small_unit_share of the waiver, a 5x10 or 5x15 unit takes
      medium_unit_share, and any larger unit takes the whole waiver. The waiver promotion share depends on the claimed unit's own
      discounts: a unit that took the first-month discount promotion takes first_month_promo_share of the waiver, a unit without
      that promotion that carries the military discount takes military_unit_share, and any other unit takes the whole waiver. The
      free move-in truck is an acquisition benefit for new storage customers, so the waiver tenancy share depends on the storage
      rent charges billed to the renter in the last twelve months: long_tenant_rent_bills
      or more rent charges take long_tenant_share of the waiver, two or more but fewer than long_tenant_rent_bills take
      returning_tenant_share, and fewer than two take the whole waiver. The waiver facility share depends on where the claimed unit
      is: a unit at a facility other than the truck's pickup facility, with the truck picked up before the unit's move-in date, takes
      other_facility_early_share of the waiver; a unit at another facility with the truck picked up on or after the unit's move-in
      date takes other_facility_late_share; a unit at the pickup facility takes the whole waiver. The waiver AutoPay share depends on
      the claimed unit's AutoPay authorization: a unit for which no AutoPay authorization was ever given takes no_autopay_share of
      the waiver, a unit whose authorization is not active takes inactive_autopay_share, and a unit with an active authorization
      takes the whole waiver. The rental waiver is the waiver basis multiplied by the waiver unit-size share, that result multiplied
      by the waiver promotion share, that result multiplied by the waiver tenancy share, that result multiplied by the waiver facility
      share, and that result multiplied by the waiver AutoPay share; the rental waiver is the smaller of that amount and the balance
      the contract owes when the waiver is credited, which is the charges and refunds standing on the contract less the credits and
      payments already on it, rounded to the cent once at the end.
    prerequisite:
      - problem: truck_ext_move_in_mileage_allowance
        kind: value_input
        gate: claimed_size
        form: state
        policy_source: >-
          The rental waiver is not credited before the truck contract carries the storage-unit claim it is credited for.
        condition: >-
          The truck contract's linked storage unit is set to the renter's storage unit with the most recent move-in, so the claimed
          unit's size, promotion, facility and move-in date can be read through the contract.
        resolved_by: apply_move_in_claim_miles_credit_24951572
        effect: >-
          Recording the claim sets the contract's linked storage unit, which turns the claimed-unit reads from empty into that unit's
          size, promotion, facility and move-in date, so the waiver unit-size, promotion and facility shares move off the whole waiver.
    cross_category:
      - category: unit
        as: branch
        reads: [unit_size, promo_code, military_discount_applied, facility_code, move_in_date, unit_ledger.event_type, unit_ledger.entry_date]
        note: The claimed unit's size, promotion, facility and move-in date and the renter's storage rent charges decide four of the waiver shares.
      - category: autopay
        as: existence
        reads: [status, agreement_id]
        note: The waiver AutoPay share is decided from the AutoPay authorization recorded for the claimed storage unit.
    compute:
      - first_day_fee: "SUM('truck_charges', 'amount', event_type='truck_charge', charge_type='base_rental_fee', service_date=F('actual_pickup_date'))"
      - booked_part_day: "DAYS(F('scheduled_pickup_date'), F('scheduled_return_date')) == 0"
      - pickup_weekday: "DAYS('2026-01-04', F('scheduled_pickup_date')) % 7"
      - waiver_basis: "MN(first_day_fee, K('part_day_share') * P('base_rate_usd')) if booked_part_day else (MN(first_day_fee, P('base_rate_usd')) if (pickup_weekday == 5 or pickup_weekday == 6 or pickup_weekday == 0) else first_day_fee)"
      - claimed_size: "CFIELD('unit', 'unit_size', rental_id=F('linked_rental_id'))"
      - unit_size_share: "K('small_unit_share') if (claimed_size == '4x5' or claimed_size == '5x5') else (K('medium_unit_share') if (claimed_size == '5x10' or claimed_size == '5x15') else 1.0)"
      - claimed_promo: "CFIELD('unit', 'promo_code', rental_id=F('linked_rental_id'))"
      - claimed_military: "CFIELD('unit', 'military_discount_applied', rental_id=F('linked_rental_id'))"
      - promotion_share: "K('first_month_promo_share') if claimed_promo == 'first_month_discount' else (K('military_unit_share') if claimed_military == True else 1.0)"
      - storage_rent_bills: "XCOUNT('unit', 'unit_ledger', within_months=12, date_field='entry_date', event_type='unit_rent_charge')"
      - tenancy_share: "K('long_tenant_share') if storage_rent_bills >= K('long_tenant_rent_bills') else (K('returning_tenant_share') if storage_rent_bills >= 2 else 1.0)"
      - claimed_facility: "CFIELD('unit', 'facility_code', rental_id=F('linked_rental_id'))"
      - claimed_move_in: "CFIELD('unit', 'move_in_date', rental_id=F('linked_rental_id'))"
      - facility_share: "K('other_facility_early_share') if (claimed_facility != None and claimed_facility != F('facility_code') and claimed_move_in != None and DAYS(F('actual_pickup_date'), claimed_move_in) > 0) else (K('other_facility_late_share') if (claimed_facility != None and claimed_facility != F('facility_code')) else 1.0)"
      - claimed_autopay: "CFIELD('autopay', 'status', agreement_id=F('linked_rental_id'))"
      - autopay_share: "K('no_autopay_share') if claimed_autopay == None else (K('inactive_autopay_share') if claimed_autopay != 'active' else 1.0)"
      - contract_charges: "SUM('truck_charges', 'amount', event_type='truck_charge')"
      - contract_refunds: "SUM('truck_charges', 'amount', event_type='truck_refund')"
      - contract_credits: "SUM('truck_charges', 'amount', event_type='truck_credit')"
      - contract_payments: "SUM('truck_charges', 'amount', event_type='truck_payment')"
      - contract_balance: "contract_charges + contract_refunds - contract_credits - contract_payments"
      - result: "RND(MN(waiver_basis * unit_size_share * promotion_share * tenancy_share * facility_share * autopay_share, contract_balance), 2)"
    compute_basis:
      contract_charges: "the balance the contract owes when the waiver is credited, which is the charges and refunds standing on the contract less the credits and payments already on it"
      contract_refunds: "the balance the contract owes when the waiver is credited, which is the charges and refunds standing on the contract less the credits and payments already on it"
      contract_credits: "the balance the contract owes when the waiver is credited, which is the charges and refunds standing on the contract less the credits and payments already on it"
