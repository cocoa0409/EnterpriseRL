  - id: truck_ext_signing_authorization_hold
    base_policy_refs: [truck_evt_pricing, truck_evt_driver_requirements, truck_evt_deposit_and_settlement]
    overwrite:
      - base_policy: truck_evt_deposit_and_settlement
        superseded_clause: >-
          At pickup an authorization hold is placed on a card in accepted_deposit_methods: deposit_hold_credit_card_usd on a credit
          card or deposit_hold_debit_card_usd on a debit card.
        replaced_by: >-
          The standard authorization hold is the card deposit of the class for the card on file with the reservation,
          deposit_hold_credit_card_usd on a credit card or deposit_hold_debit_card_usd on a debit card, plus the first-day rental fee
          posted on the contract, rounded to the cent.
    trigger: on_request
    subject: [truck_pickup, truck_deposit_hold]
    computes: deposit_hold_amount
    target_tool: sign_truck_rental_contract_074f2414
    params:
      debit_returned_multiple: 1.5
      credit_returned_multiple: 1.25
      long_tenant_months: 24
      long_tenant_hold_share: 0.5
      tenant_hold_share: 0.75
      military_hold_share: 0.8
      former_military_hold_share: 0.9
      estimate_miles: 40
      last_minute_days: 2
      last_minute_hold_share: 1.25
      early_booking_days: 14
      early_booking_hold_share: 0.9
    rule: >-
      When the renter signs the truck rental contract at pickup, an authorization hold is placed on the card on file with the
      reservation and the contract moves to picked_up with the pickup readings the renter records. The authorization hold is fixed
      only after the contract's first-day rental fee stands posted on the contract. The standard authorization hold is the card
      deposit of the class for the card on file with the reservation, deposit_hold_credit_card_usd on a credit card or
      deposit_hold_debit_card_usd on a debit card, plus the first-day rental fee posted on the contract, rounded to the cent. The
      hold payment-risk multiple depends on the card on file and the renter's storage ledger: a debit card on file for a renter
      with a storage payment reversed within the last twelve months multiplies the card deposit by debit_returned_multiple, a
      credit card on file for such a renter multiplies it by credit_returned_multiple, and a renter with no storage payment
      reversed in that time keeps the card deposit as it is. The hold tenant share depends on the renter's storage agreements: a
      renter whose active storage agreement at the pickup facility moved in long_tenant_months or more calendar months before and
      who was billed no storage late fee within the last twelve months takes long_tenant_hold_share of the card deposit; any other
      renter with an active storage agreement at the pickup facility takes tenant_hold_share; a renter without one keeps the card
      deposit as it is. The hold military share depends on the military discount on the renter's storage agreements: an active
      agreement carrying it takes military_hold_share of the card deposit, a renter whose only such agreement is vacated takes
      former_military_hold_share, and any other renter keeps the card deposit as it is. The hold booking-lead share depends on the
      calendar days from the reservation date to the scheduled pickup date: fewer than last_minute_days days take
      last_minute_hold_share of the card deposit, early_booking_days or more days take early_booking_hold_share, and any other lead
      keeps the card deposit as it is. The hold rental estimate depends on the booked days, counted as the calendar days from the
      scheduled pickup date to the scheduled return date: a contract booked to come back on its scheduled pickup date adds
      estimate_miles miles at the class per_mile_usd to the hold, a contract booked for two or more days adds the class
      base_rate_usd for each booked day after the first, and a contract booked for one day adds no rental estimate. The authorization hold
      is the card deposit multiplied by the hold payment-risk multiple, that result multiplied by the hold tenant share, that result
      multiplied by the hold military share and that result multiplied by the hold booking-lead share, then the first-day rental fee
      posted on the contract and the hold rental estimate are added to it, rounded to the cent once at the end.
    prerequisite:
      - problem: truck_ext_first_day_rate
        kind: value_input
        gate: first_day_fee_posted
        form: state
        policy_source: >-
          The authorization hold is fixed only after the contract's first-day rental fee stands posted on the contract.
        condition: >-
          The contract carries its base rental fee line for the first rental day, so the hold's estimated-rental part reads that
          posted amount.
        resolved_by: post_first_day_rental_fee_f35b099c
        effect: >-
          Posting the first-day rental fee line turns the first-day fee the hold adds from zero into the posted amount, which raises
          the authorization hold by that amount.
    cross_category:
      - category: unit
        as: history
        reads: [unit_ledger.event_type, unit_ledger.fee_type, unit_ledger.entry_date, status, facility_code, move_in_date, military_discount_applied]
        note: The payment-risk multiple, the tenant share and the military share are decided from the renter's storage ledger and storage agreements.
    compute:
      - card_on_file: "F('deposit_method')"
      - card_deposit: "P('deposit_hold_debit_card_usd') if card_on_file == 'debit_card' else P('deposit_hold_credit_card_usd')"
      - storage_reversals: "XCOUNT('unit', 'unit_ledger', within_months=12, date_field='entry_date', event_type='unit_payment_reversal')"
      - risk_multiple: "K('debit_returned_multiple') if (card_on_file == 'debit_card' and storage_reversals >= 1) else (K('credit_returned_multiple') if (card_on_file == 'credit_card' and storage_reversals >= 1) else 1.0)"
      - facility_move_in: "CFIELD('unit', 'move_in_date', status='active', facility_code=F('facility_code'))"
      - facility_months: "MONTHS(facility_move_in, NOW) if facility_move_in != None else -1"
      - storage_late_fees: "XCOUNT('unit', 'unit_ledger', within_months=12, date_field='entry_date', event_type='unit_fee_charge', fee_type='late_fee')"
      - tenant_share: "K('long_tenant_hold_share') if (facility_move_in != None and facility_months >= K('long_tenant_months') and storage_late_fees == 0) else (K('tenant_hold_share') if facility_move_in != None else 1.0)"
      - active_military: "CFIELD('unit', 'status', status='active', military_discount_applied=True)"
      - former_military: "CFIELD('unit', 'status', status='vacated', military_discount_applied=True)"
      - military_share: "K('military_hold_share') if active_military == 'active' else (K('former_military_hold_share') if former_military == 'vacated' else 1.0)"
      - booking_lead_days: "DAYS(F('reservation_date'), F('scheduled_pickup_date'))"
      - lead_share: "K('last_minute_hold_share') if booking_lead_days < K('last_minute_days') else (K('early_booking_hold_share') if booking_lead_days >= K('early_booking_days') else 1.0)"
      - booked_days: "DAYS(F('scheduled_pickup_date'), F('scheduled_return_date'))"
      - rental_estimate: "K('estimate_miles') * P('per_mile_usd') if booked_days == 0 else ((booked_days - 1) * P('base_rate_usd') if booked_days >= 2 else 0.0)"
      - first_day_fee_posted: "SUM('truck_charges', 'amount', event_type='truck_charge', charge_type='base_rental_fee')"
      - result: "RND(card_deposit * risk_multiple * tenant_share * military_share * lead_share + first_day_fee_posted + rental_estimate, 2)"
    compute_basis:
      card_on_file: "the card deposit of the class for the card on file with the reservation"
      card_deposit: "deposit_hold_credit_card_usd on a credit card or deposit_hold_debit_card_usd on a debit card"
      storage_reversals: "a renter with a storage payment reversed within the last twelve months"
      risk_multiple: "a debit card on file for a renter with a storage payment reversed within the last twelve months multiplies the card deposit by debit_returned_multiple, a credit card on file for such a renter multiplies it by credit_returned_multiple, and a renter with no storage payment reversed in that time keeps the card deposit as it is."
      facility_move_in: "The hold tenant share depends on the renter's storage agreements"
      facility_months: "moved in long_tenant_months or more calendar months before"
      storage_late_fees: "who was billed no storage late fee within the last twelve months"
      tenant_share: "a renter whose active storage agreement at the pickup facility moved in long_tenant_months or more calendar months before and who was billed no storage late fee within the last twelve months takes long_tenant_hold_share of the card deposit; any other renter with an active storage agreement at the pickup facility takes tenant_hold_share; a renter without one keeps the card deposit as it is."
      active_military: "an active agreement carrying it takes military_hold_share of the card deposit"
      former_military: "a renter whose only such agreement is vacated takes former_military_hold_share"
      military_share: "The hold military share depends on the military discount on the renter's storage agreements: an active agreement carrying it takes military_hold_share of the card deposit, a renter whose only such agreement is vacated takes former_military_hold_share, and any other renter keeps the card deposit as it is."
      booking_lead_days: "The hold booking-lead share depends on the calendar days from the reservation date to the scheduled pickup date"
      lead_share: "fewer than last_minute_days days take last_minute_hold_share of the card deposit, early_booking_days or more days take early_booking_hold_share, and any other lead keeps the card deposit as it is."
      booked_days: "The hold rental estimate depends on the booked days, counted as the calendar days from the scheduled pickup date to the scheduled return date"
      rental_estimate: "a contract booked to come back on its scheduled pickup date adds estimate_miles miles at the class per_mile_usd to the hold, a contract booked for two or more days adds the class base_rate_usd for each booked day after the first, and a contract booked for one day adds no rental estimate."
      first_day_fee_posted: "plus the first-day rental fee posted on the contract"
      result: "The authorization hold is the card deposit multiplied by the hold payment-risk multiple, that result multiplied by the hold tenant share, that result multiplied by the hold military share and that result multiplied by the hold booking-lead share, then the first-day rental fee posted on the contract and the hold rental estimate are added to it, rounded to the cent once at the end."
    factors:
      - id: hold_payment_risk
        effect: parameter
        decides: risk_multiple
        bindings: [storage_reversals, risk_multiple]
        ladder:
          - when: "a debit card is on file and a storage payment of the renter was reversed within the last twelve months"
            value: "K('debit_returned_multiple')"
          - when: "a credit card is on file and a storage payment of the renter was reversed within the last twelve months"
            value: "K('credit_returned_multiple')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          risk_multiple: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: unit
      - id: hold_tenant_share
        effect: parameter
        decides: tenant_share
        bindings: [facility_move_in, facility_months, storage_late_fees, tenant_share]
        ladder:
          - when: "an active storage agreement at the pickup facility moved in long_tenant_months or more months before and no storage late fee was billed within the last twelve months"
            value: "K('long_tenant_hold_share')"
          - when: "any other renter with an active storage agreement at the pickup facility"
            value: "K('tenant_hold_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          tenant_share: "1.0"
        evidence: [cross_category, history, date]
        cross_difficulty: unit
      - id: hold_military_share
        effect: parameter
        decides: military_share
        bindings: [active_military, former_military, military_share]
        ladder:
          - when: "an active storage agreement of the renter carries the military discount"
            value: "K('military_hold_share')"
          - when: "the renter's only storage agreement carrying the military discount is vacated"
            value: "K('former_military_hold_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          military_share: "1.0"
        evidence: [cross_category]
        cross_difficulty: unit
      - id: hold_booking_lead_share
        effect: parameter
        decides: lead_share
        bindings: [booking_lead_days, lead_share]
        ladder:
          - when: "the reservation was made fewer than last_minute_days days before the scheduled pickup date"
            value: "K('last_minute_hold_share')"
          - when: "the reservation was made early_booking_days or more days before the scheduled pickup date"
            value: "K('early_booking_hold_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          lead_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: hold_rental_estimate
        effect: method
        decides: rental_estimate
        bindings: [booked_days, rental_estimate]
        ladder:
          - when: "the contract is booked to come back on its scheduled pickup date"
            method: "the estimate is mileage-based: estimate_miles miles priced at the class per_mile_usd"
          - when: "the contract is booked for two or more days"
            method: "the estimate is day-based: the class base_rate_usd for each booked day after the first"
          - when: "otherwise (booked for one day)"
            method: "the hold carries no rental estimate"
        baseline:
          rental_estimate: "0.0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard authorization hold is the card deposit of the class for the card on file with the reservation,
        deposit_hold_credit_card_usd on a credit card or deposit_hold_debit_card_usd on a debit card, plus the first-day rental fee
        posted on the contract, rounded to the cent.
      params: [deposit_hold_credit_card_usd, deposit_hold_debit_card_usd]
    inputs:
      history:
        - {table: truck_charges, aggregate: sum, field: amount, filters: {event_type: truck_charge, charge_type: base_rental_fee}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_fee_charge, fee_type: late_fee}}
      cross_category: [unit]
