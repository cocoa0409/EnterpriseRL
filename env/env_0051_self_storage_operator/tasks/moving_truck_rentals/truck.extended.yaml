      contract_balance: "the balance the contract owes when the waiver is credited, which is the charges and refunds standing on the contract less the credits and payments already on it"
      first_day_fee: "The standard rental waiver is the first-day rental fee posted on the contract, the fee line dated the actual pickup date, credited in full and rounded to the cent."
      booked_part_day: "a contract booked to come back on its scheduled pickup date takes the lower of the first-day rental fee as posted and part_day_share of the class base_rate_usd"
      pickup_weekday: "a longer booking whose scheduled pickup date is a Friday, Saturday or Sunday takes the lower of the first-day rental fee as posted and the class base_rate_usd"
      waiver_basis: "The waiver basis depends on the booking: a contract booked to come back on its scheduled pickup date takes the lower of the first-day rental fee as posted and part_day_share of the class base_rate_usd, so that a part-day rental is waived as part of a day; a longer booking whose scheduled pickup date is a Friday, Saturday or Sunday takes the lower of the first-day rental fee as posted and the class base_rate_usd, so that any pickup-day surcharge in its first-day fee stays payable; any other booking takes the first-day rental fee as posted."
      claimed_size: "The waiver unit-size share depends on the size of the claimed storage unit"
      unit_size_share: "a 4x5 or 5x5 unit takes small_unit_share of the waiver, a 5x10 or 5x15 unit takes medium_unit_share, and any larger unit takes the whole waiver."
      claimed_promo: "The waiver promotion share depends on the claimed unit's own discounts"
      claimed_military: "a unit without that promotion that carries the military discount takes military_unit_share"
      promotion_share: "a unit that took the first-month discount promotion takes first_month_promo_share of the waiver, a unit without that promotion that carries the military discount takes military_unit_share, and any other unit takes the whole waiver."
      storage_rent_bills: "the waiver tenancy share depends on the storage rent charges billed to the renter in the last twelve months"
      tenancy_share: "long_tenant_rent_bills or more rent charges take long_tenant_share of the waiver, two or more but fewer than long_tenant_rent_bills take returning_tenant_share, and fewer than two take the whole waiver."
      claimed_facility: "The waiver facility share depends on where the claimed unit is"
      claimed_move_in: "with the truck picked up before the unit's move-in date"
      facility_share: "a unit at a facility other than the truck's pickup facility, with the truck picked up before the unit's move-in date, takes other_facility_early_share of the waiver; a unit at another facility with the truck picked up on or after the unit's move-in date takes other_facility_late_share; a unit at the pickup facility takes the whole waiver."
      claimed_autopay: "The waiver AutoPay share depends on the claimed unit's AutoPay authorization"
      autopay_share: "a unit for which no AutoPay authorization was ever given takes no_autopay_share of the waiver, a unit whose authorization is not active takes inactive_autopay_share, and a unit with an active authorization takes the whole waiver."
      result: "The rental waiver is the waiver basis multiplied by the waiver unit-size share, that result multiplied by the waiver promotion share, that result multiplied by the waiver tenancy share, that result multiplied by the waiver facility share, and that result multiplied by the waiver AutoPay share; the rental waiver is the smaller of that amount and the balance the contract owes when the waiver is credited, which is the charges and refunds standing on the contract less the credits and payments already on it, rounded to the cent once at the end."
    factors:
