  - id: truck_ext_first_day_rate
    base_policy_refs: [truck_evt_pricing, truck_evt_driver_requirements]
    overwrite:
      - base_policy: truck_evt_pricing
        superseded_clause: >-
          A contract is charged base_rate_usd for each rental period started, a period being rental_period_hours elapsed hours from
          the actual pickup time; the first period is posted at pickup.
        replaced_by: >-
          The first-day rental fee of a truck contract is posted when the contract opens at its pickup, as one base rental fee line
          dated that day with a quantity of one.
    trigger: state_due
    subject: [truck_pickup]
    computes: amount
    target_tool: post_first_day_rental_fee_f35b099c
    params:
      weekend_rate_share: 1.2
      friday_rate_share: 1.1
      long_booking_days: 3
      tenant_long_months: 24
      tenant_min_months: 6
      tenant_long_discount: 0.15
      tenant_discount: 0.1
      advance_long_days: 14
      advance_short_days: 7
      advance_long_discount: 0.1
      advance_short_discount: 0.05
      military_former_discount: 0.05
      autopay_ach_discount: 0.05
      autopay_card_discount: 0.03
    rule: >-
      The first-day rental fee of a truck contract is posted when the contract opens at its pickup, as one base rental fee line
      dated that day with a quantity of one. The standard first-day rental fee is the class base_rate_usd for one rental day,
      rounded to the cent. The rating day of the first-day fee is chosen by the booking, the booked days being the calendar days
      from the scheduled pickup date to the scheduled return date, each counted from the scheduled pickup date onward: a contract
      booked for long_booking_days or more days is rated as the busiest of its booked days, so a booking that takes in a Saturday
      or a Sunday is rated as a Saturday, and otherwise one that takes in a Friday is rated as a Friday; a contract booked for fewer
      days whose scheduled pickup time is 17:00 or later is rated on the day after its scheduled pickup date, since an evening
      rental is used through the next day; any other contract is rated on its scheduled pickup date. The first-day weekday rate
      depends on the rating day: a Saturday or Sunday is charged weekend_rate_share of the class rate, a Friday friday_rate_share of
      it, and any other weekday the class rate itself. The first-day tenant discount depends on the renter's storage agreements: a
      renter whose active storage agreement at the pickup facility moved in tenant_long_months or more calendar months before the
      handling date takes tenant_long_discount, a renter whose active storage agreement at the pickup facility moved in at least
      tenant_min_months but fewer than tenant_long_months months before takes tenant_discount, and any other renter takes no tenant
      discount. The first-day advance-booking discount depends on the calendar days from the reservation date to the scheduled
      pickup date: advance_long_days or more days take advance_long_discount, at least advance_short_days but fewer than
      advance_long_days take advance_short_discount, and fewer days take no advance-booking discount. The first-day military
      discount depends on the military discount on the renter's storage agreements: a renter with an active storage agreement
      carrying the military discount takes the larger of that unit class's military_discount_pct and military_former_discount, a
      renter whose only such agreement is vacated takes military_former_discount, and any other renter takes no military discount.
      The first-day AutoPay discount depends on the renter's active AutoPay authorization: an active Personal Checking ACH, Personal
      Savings ACH or Business Checking ACH authorization takes autopay_ach_discount, an active card authorization takes
      autopay_card_discount, and a renter without an active authorization takes no AutoPay discount; an authorization that is
      cancelled, suspended or replaced does not count. The first-day rental fee is the class base_rate_usd multiplied by the
      first-day weekday rate, and that result reduced once by the sum of the tenant, advance-booking, military and AutoPay
      discounts, which are added together first and taken off the day-rated fee in a single step, rounded to the cent once at the
      end.
    prerequisite: []
    cross_category:
      - category: unit
        as: branch
        reads: [status, facility_code, move_in_date, military_discount_applied, military_discount_pct]
        note: The tenant discount and the military discount are decided from the renter's storage agreements and the military rate of the unit class.
      - category: autopay
        as: branch
        reads: [status, variant_name]
        note: The AutoPay discount is decided from the method of the renter's active AutoPay authorization.
    compute:
      - scheduled_weekday: "DAYS('2026-01-04', F('scheduled_pickup_date')) % 7"
      - booked_days: "DAYS(F('scheduled_pickup_date'), F('scheduled_return_date'))"
      - takes_in_weekend: "booked_days >= 7 or (6 - scheduled_weekday) % 7 < booked_days or (7 - scheduled_weekday) % 7 < booked_days"
      - takes_in_friday: "booked_days >= 7 or (5 - scheduled_weekday) % 7 < booked_days"
      - rating_weekday: "(6 if takes_in_weekend else (5 if takes_in_friday else scheduled_weekday)) if booked_days >= K('long_booking_days') else ((scheduled_weekday + 1) % 7 if F('scheduled_pickup_time') >= '17:00' else scheduled_weekday)"
      - weekday_rate: "K('weekend_rate_share') if (rating_weekday == 6 or rating_weekday == 0) else (K('friday_rate_share') if rating_weekday == 5 else 1.0)"
      - facility_move_in: "CFIELD('unit', 'move_in_date', status='active', facility_code=F('facility_code'))"
      - facility_months: "MONTHS(facility_move_in, NOW) if facility_move_in != None else -1"
      - tenant_discount: "K('tenant_long_discount') if (facility_move_in != None and facility_months >= K('tenant_long_months')) else (K('tenant_discount') if (facility_move_in != None and facility_months >= K('tenant_min_months')) else 0.0)"
      - booking_lead_days: "DAYS(F('reservation_date'), F('scheduled_pickup_date'))"
      - advance_discount: "K('advance_long_discount') if booking_lead_days >= K('advance_long_days') else (K('advance_short_discount') if booking_lead_days >= K('advance_short_days') else 0.0)"
      - active_military_pct: "CPARAM('unit', 'military_discount_pct', status='active', military_discount_applied=True)"
      - former_military: "CFIELD('unit', 'status', status='vacated', military_discount_applied=True)"
      - military_discount: "MX(active_military_pct, K('military_former_discount')) if active_military_pct != None else (K('military_former_discount') if former_military == 'vacated' else 0.0)"
      - autopay_method: "CFIELD('autopay', 'variant_name', status='active')"
      - autopay_discount: "K('autopay_ach_discount') if (autopay_method == 'Bluegate AutoPay (Personal Checking ACH)' or autopay_method == 'Bluegate AutoPay (Personal Savings ACH)' or autopay_method == 'Bluegate AutoPay (Business Checking ACH)') else (K('autopay_card_discount') if autopay_method != None else 0.0)"
      - discount_total: "tenant_discount + advance_discount + military_discount + autopay_discount"
      - result: "RND(P('base_rate_usd') * weekday_rate * (1 - discount_total), 2)"
    compute_basis:
      scheduled_weekday: "any other contract is rated on its scheduled pickup date"
      booked_days: "the booked days being the calendar days from the scheduled pickup date to the scheduled return date, each counted from the scheduled pickup date onward"
      takes_in_weekend: "a booking that takes in a Saturday or a Sunday is rated as a Saturday"
      takes_in_friday: "otherwise one that takes in a Friday is rated as a Friday"
      rating_weekday: "a contract booked for long_booking_days or more days is rated as the busiest of its booked days, so a booking that takes in a Saturday or a Sunday is rated as a Saturday, and otherwise one that takes in a Friday is rated as a Friday; a contract booked for fewer days whose scheduled pickup time is 17:00 or later is rated on the day after its scheduled pickup date, since an evening rental is used through the next day; any other contract is rated on its scheduled pickup date."
      weekday_rate: "The first-day weekday rate depends on the rating day: a Saturday or Sunday is charged weekend_rate_share of the class rate, a Friday friday_rate_share of it, and any other weekday the class rate itself."
      facility_move_in: "The first-day tenant discount depends on the renter's storage agreements"
      facility_months: "moved in tenant_long_months or more calendar months before the handling date"
      tenant_discount: "a renter whose active storage agreement at the pickup facility moved in tenant_long_months or more calendar months before the handling date takes tenant_long_discount, a renter whose active storage agreement at the pickup facility moved in at least tenant_min_months but fewer than tenant_long_months months before takes tenant_discount, and any other renter takes no tenant discount."
      booking_lead_days: "The first-day advance-booking discount depends on the calendar days from the reservation date to the scheduled pickup date"
      advance_discount: "advance_long_days or more days take advance_long_discount, at least advance_short_days but fewer than advance_long_days take advance_short_discount, and fewer days take no advance-booking discount."
      active_military_pct: "a renter with an active storage agreement carrying the military discount takes the larger of that unit class's military_discount_pct and military_former_discount"
      former_military: "a renter whose only such agreement is vacated takes military_former_discount"
      military_discount: "a renter with an active storage agreement carrying the military discount takes the larger of that unit class's military_discount_pct and military_former_discount, a renter whose only such agreement is vacated takes military_former_discount, and any other renter takes no military discount."
      autopay_method: "The first-day AutoPay discount depends on the renter's active AutoPay authorization"
      autopay_discount: "an active Personal Checking ACH, Personal Savings ACH or Business Checking ACH authorization takes autopay_ach_discount, an active card authorization takes autopay_card_discount, and a renter without an active authorization takes no AutoPay discount; an authorization that is cancelled, suspended or replaced does not count."
      discount_total: "the sum of the tenant, advance-booking, military and AutoPay discounts, which are added together first and taken off the day-rated fee in a single step"
      result: "The first-day rental fee is the class base_rate_usd multiplied by the first-day weekday rate, and that result reduced once by the sum of the tenant, advance-booking, military and AutoPay discounts, which are added together first and taken off the day-rated fee in a single step, rounded to the cent once at the end."
    factors:
      - id: first_day_rating_day
        effect: method
        decides: rating_weekday
        bindings: [booked_days, takes_in_weekend, takes_in_friday, rating_weekday]
        ladder:
          - when: "the contract was booked for long_booking_days or more days"
            method: "the fee is rated as the busiest booked day: a Saturday when the booked days take in a Saturday or Sunday, otherwise a Friday when they take in a Friday, otherwise the scheduled pickup date"
          - when: "the contract was booked for fewer days and its scheduled pickup time is 17:00 or later"
            method: "the fee is rated on the day after the scheduled pickup date"
          - when: "otherwise"
            method: "the fee is rated on the scheduled pickup date"
        baseline:
          rating_weekday: "scheduled_weekday"
        evidence: [date]
        cross_difficulty: null
      - id: first_day_weekday_rate
        effect: parameter
        decides: weekday_rate
        bindings: [scheduled_weekday, weekday_rate]
        ladder:
          - when: "the rating day is a Saturday or a Sunday"
            value: "K('weekend_rate_share')"
          - when: "the rating day is a Friday"
            value: "K('friday_rate_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          weekday_rate: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: first_day_tenant_discount
        effect: parameter
        decides: tenant_discount
        bindings: [facility_move_in, facility_months, tenant_discount]
        ladder:
          - when: "an active storage agreement of the renter at the pickup facility moved in tenant_long_months or more months before"
            value: "K('tenant_long_discount')"
          - when: "an active storage agreement of the renter at the pickup facility moved in at least tenant_min_months but fewer than tenant_long_months months before"
            value: "K('tenant_discount')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          tenant_discount: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: unit
      - id: first_day_advance_discount
        effect: parameter
        decides: advance_discount
        bindings: [booking_lead_days, advance_discount]
        ladder:
          - when: "the reservation was made advance_long_days or more days before the scheduled pickup date"
            value: "K('advance_long_discount')"
          - when: "the reservation was made at least advance_short_days but fewer than advance_long_days days before"
            value: "K('advance_short_discount')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          advance_discount: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: first_day_military_discount
        effect: parameter
        decides: military_discount
        bindings: [active_military_pct, former_military, military_discount]
        ladder:
          - when: "the renter holds an active storage agreement carrying the military discount"
            value: "the larger of CPARAM('unit', 'military_discount_pct') of that agreement's unit class and K('military_former_discount')"
          - when: "the renter's only storage agreement carrying the military discount is vacated"
            value: "K('military_former_discount')"
          - when: "otherwise"
