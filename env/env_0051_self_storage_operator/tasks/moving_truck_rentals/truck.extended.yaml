        ladder:
          - when: "the renter's active AutoPay authorization is a Personal Checking ACH, Personal Savings ACH or Business Checking ACH authorization"
            value: "K('autopay_ach_discount')"
          - when: "the renter's active AutoPay authorization is a card authorization"
            value: "K('autopay_card_discount')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          autopay_discount: "0.0"
        evidence: [cross_category]
        cross_difficulty: autopay
