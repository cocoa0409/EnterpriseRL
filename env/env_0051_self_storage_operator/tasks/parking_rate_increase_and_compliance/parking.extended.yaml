- id: parking_ext_vehicle_swap_fee
  base_policy_refs:
  - parking_evt_vehicle_fit
  - parking_evt_compliance
  - parking_evt_space_features
  overwrite:
  - base_policy: parking_evt_vehicle_fit
    superseded_clause: 'The vehicle on file must fit the space class: its type must be in allowed_vehicle_types and its overall length, including trailer tongue and outboard motor, must not exceed max_vehicle_length_ft.'
    replaced_by: The vehicle put on file must be of a type the space class allows and no longer than the class's maximum length, as the tenant reads its type and overall length from the vehicle's registration.
  - base_policy: parking_evt_compliance
    superseded_clause: A renewed registration or insurance is recorded when the tenant states the new expiry date exactly as printed on the document
    replaced_by: The plate and the registration and insurance expiry dates of the vehicle put on file are recorded exactly as the tenant reads them from the registration card and the insurance card.
  - base_policy: parking_evt_vehicle_fit
    superseded_clause: A different vehicle may be put on file only on an agreement in active status
    replaced_by: A different vehicle is not put on file until the agreement stands in active status.
  - base_policy: parking_evt_vehicle_fit
    superseded_clause: and each swap posts vehicle_swap_fee_usd.
    replaced_by: The vehicle swap fee is the swap fee level multiplied by the tenure multiplier and then by the period multiplier, plus the re-verification charge and the document check charge, less the good-record reduction, never below zero, rounded to the cent.
  trigger: on_request
  subject:
  - parking_vehicle_update
  computes: swap_fee
  target_tool: swap_parking_vehicle_d3106476
  params:
    step_repeat: 10.0
    step_returning: 5.0
    tenure_long: 36
    tenure_mid: 24
    mult_long: 0.5
    mult_mid: 0.75
    period_end_days: 7
    late_period_days: 14
    mult_period_end: 0.6
    mult_late_period: 0.8
    charge_tow: 10.0
    charge_lockout: 5.0
    near_expiry_days: 30
    far_expiry_days: 60
    charge_near_expiry: 8.0
    charge_far_expiry: 4.0
    record_tenure: 24
    payments_steady: 10
    payments_some: 6
    reduce_steady: 4.0
    reduce_regular: 2.0
    record_mid_tenure: 12
  rule: 'A tenant may replace the vehicle on file for a parking space with a different vehicle that fits the space class, at most the swap allowance of the space class times in any rolling 365-day window, and each such swap posts a vehicle swap fee. A different vehicle is not put on file until the agreement stands in active status. The vehicle put on file must be of a type the space class allows and no longer than the class''s maximum length, as the tenant reads its type and overall length from the vehicle''s registration. The plate and the registration and insurance expiry dates of the vehicle put on file are recorded exactly as the tenant reads them from the registration card and the insurance card. The standard vehicle swap fee is the vehicle swap fee of the space class, charged in full for the swap. For the vehicle swap fee, a window of the last 2, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the
    same day of the later month. The swap fee level is the vehicle swap fee of the space class plus the repeat-swap step where a vehicle swap fee was posted on the agreement in the last 12 months, the class fee plus the returning-swap step where none was posted in the last 12 months but one was in the last 24 months, and the class fee alone otherwise. The swap fee level is multiplied by the long-tenure multiplier for a tenant who has held the agreement at least the long-tenure months, by the mid-tenure multiplier for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months, and is taken as it stands for every other tenant. The fee is further multiplied by the period-end multiplier where the most recently charged billing period ends no more than the period-end days after the handling date, by the late-period multiplier where it ends more than the period-end days but no more than the late-period days after it, and is taken as it stands otherwise. A re-verification
    charge is added: the tow re-verification charge where a notice of intent to tow was sent on the agreement in the last 2 months, the lockout re-verification charge where none was but a gate lockout notice was sent in that time, and nothing otherwise. A document check charge is added where the insurance on file for the vehicle being replaced expires no more than the near-expiry days after the handling date (the near-expiry charge) or more than the near-expiry days but no more than the far-expiry days after it (the far-expiry charge); nothing is added when it expires later. A good-record reduction is taken off: the steady-record reduction for a tenant who has held the agreement at least the record-tenure months and made at least the steady-payment count of payments on it in the last 12 months, the regular-record reduction for a tenant who has held it at least the mid-tenure months but fewer than the record-tenure months and made at least the some-payment count of payments in that time,
    and nothing for every other tenant. The vehicle swap fee is the swap fee level multiplied by the tenure multiplier and then by the period multiplier, plus the re-verification charge and the document check charge, less the good-record reduction, never below zero, rounded to the cent.'
  prerequisite:
  - problem: parking_ext_tow_redemption_payment
    kind: state_gate
    gate: parking_rentals.status
    form: state
    policy_source: A different vehicle is not put on file until the agreement stands in active status.
    condition: The agreement's status is active.
    resolved_by: pay_parking_tow_redemption_54345a56
    effect: The tenant's redemption payment returns the agreement from tow_noticed to active, so a different vehicle may be put on file.
  cross_category: []
  compute:
  - sw_level: P('vehicle_swap_fee_usd') + K('step_repeat') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='vehicle_swap_fee') >= 1 else (P('vehicle_swap_fee_usd') + K('step_returning') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='vehicle_swap_fee') == 0 and COUNT('parking_ledger', within_months=24, date_field='entry_date', event_type='parking_fee_charge', fee_type='vehicle_swap_fee') >= 1 else P('vehicle_swap_fee_usd'))
  - sw_tenure: K('mult_long') if MONTHS(F('start_date'), NOW) >= K('tenure_long') else (K('mult_mid') if MONTHS(F('start_date'), NOW) >= K('tenure_mid') else 1)
  - sw_period: K('mult_period_end') if DAYS(NOW, LATEST('parking_ledger', 'period_end', date_field='entry_date', event_type='parking_rent_charge')) <= K('period_end_days') else (K('mult_late_period') if DAYS(NOW, LATEST('parking_ledger', 'period_end', date_field='entry_date', event_type='parking_rent_charge')) <= K('late_period_days') else 1)
  - sw_reverify: K('charge_tow') if COUNT('parking_notices', within_months=2, date_field='notice_date', notice_type='intent_to_tow') >= 1 else (K('charge_lockout') if COUNT('parking_notices', within_months=2, date_field='notice_date', notice_type='gate_lockout') >= 1 else 0)
  - sw_docs: K('charge_near_expiry') if DAYS(NOW, F('insurance_expiry')) <= K('near_expiry_days') else (K('charge_far_expiry') if DAYS(NOW, F('insurance_expiry')) <= K('far_expiry_days') else 0)
  - sw_record: K('reduce_steady') if MONTHS(F('start_date'), NOW) >= K('record_tenure') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_steady') else (K('reduce_regular') if MONTHS(F('start_date'), NOW) >= K('record_mid_tenure') and MONTHS(F('start_date'), NOW) < K('record_tenure') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_some') else 0)
  - result: RND(MX(0, sw_level * sw_tenure * sw_period + sw_reverify + sw_docs - sw_record), 2)
  compute_basis:
    sw_level: The swap fee level is the vehicle swap fee of the space class plus the repeat-swap step where a vehicle swap fee was posted on the agreement in the last 12 months, the class fee plus the returning-swap step where none was posted in the last 12 months but one was in the last 24 months, and the class fee alone otherwise. For the vehicle swap fee, a window of the last 2, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    sw_tenure: The swap fee level is multiplied by the long-tenure multiplier for a tenant who has held the agreement at least the long-tenure months, by the mid-tenure multiplier for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months, and is taken as it stands for every other tenant.
    sw_period: The fee is further multiplied by the period-end multiplier where the most recently charged billing period ends no more than the period-end days after the handling date, by the late-period multiplier where it ends more than the period-end days but no more than the late-period days after it, and is taken as it stands otherwise.
    sw_reverify: 'A re-verification charge is added: the tow re-verification charge where a notice of intent to tow was sent on the agreement in the last 2 months, the lockout re-verification charge where none was but a gate lockout notice was sent in that time, and nothing otherwise. For the vehicle swap fee, a window of the last 2, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.'
    sw_docs: A document check charge is added where the insurance on file for the vehicle being replaced expires no more than the near-expiry days after the handling date (the near-expiry charge) or more than the near-expiry days but no more than the far-expiry days after it (the far-expiry charge); nothing is added when it expires later.
    sw_record: 'A good-record reduction is taken off: the steady-record reduction for a tenant who has held the agreement at least the record-tenure months and made at least the steady-payment count of payments on it in the last 12 months, the regular-record reduction for a tenant who has held it at least the mid-tenure months but fewer than the record-tenure months and made at least the some-payment count of payments in that time, and nothing for every other tenant. For the vehicle swap fee, a window of the last 2, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.'
    result: The vehicle swap fee is the swap fee level multiplied by the tenure multiplier and then by the period multiplier, plus the re-verification charge and the document check charge, less the good-record reduction, never below zero, rounded to the cent. The standard vehicle swap fee is the vehicle swap fee of the space class, charged in full for the swap.
  factors:
  - id: swap_sequence_level
    effect: parameter
    decides: sw_level
    bindings:
    - sw_level
    ladder:
    - when: a vehicle swap fee posted in the last 12 months
      value: P('vehicle_swap_fee_usd') + K('step_repeat')
    - when: none in the last 12 months but one in the last 24 months
      value: P('vehicle_swap_fee_usd') + K('step_returning')
    - when: otherwise
      value: P('vehicle_swap_fee_usd')
    baseline:
      sw_level: P('vehicle_swap_fee_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: swap_tenure_multiplier
    effect: method
    decides: sw_tenure
    bindings:
    - sw_tenure
    ladder:
    - when: held the agreement at least the long-tenure months
      method: the swap fee level is multiplied by the long-tenure multiplier
    - when: held it at least the mid-tenure months but fewer than the long-tenure months
      method: the swap fee level is multiplied by the mid-tenure multiplier
    - when: otherwise
      method: the swap fee level is taken as it stands
    baseline:
      sw_tenure: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: billing_period_timing
    effect: method
    decides: sw_period
    bindings:
    - sw_period
    ladder:
    - when: the most recently charged period ends no more than the period-end days after the handling date
      method: the fee is multiplied by the period-end multiplier
    - when: it ends more than the period-end days but no more than the late-period days after it
      method: the fee is multiplied by the late-period multiplier
    - when: otherwise
      method: the fee is taken as it stands
    baseline:
      sw_period: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: reverification_charge
    effect: parameter
    decides: sw_reverify
    bindings:
    - sw_reverify
    ladder:
    - when: a notice of intent to tow sent in the last 2 months
      value: K('charge_tow')
    - when: no tow notice but a gate lockout notice sent in the last 2 months
      value: K('charge_lockout')
    - when: otherwise
      value: '0'
    baseline:
      sw_reverify: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: document_check_charge
    effect: parameter
    decides: sw_docs
    bindings:
    - sw_docs
    ladder:
    - when: the insurance on file expires no more than the near-expiry days after the handling date
      value: K('charge_near_expiry')
    - when: it expires more than the near-expiry days but no more than the far-expiry days after it
      value: K('charge_far_expiry')
    - when: otherwise
      value: '0'
    baseline:
      sw_docs: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: good_record_reduction
    effect: parameter
    decides: sw_record
    bindings:
    - sw_record
    ladder:
    - when: held the agreement at least the record-tenure months and at least the steady-payment count of payments in the last 12 months
      value: K('reduce_steady')
    - when: held it at least the mid record-tenure months but fewer than the record-tenure months and at least the some-payment count of payments
      value: K('reduce_regular')
    - when: otherwise
      value: '0'
    baseline:
      sw_record: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: The standard vehicle swap fee is the vehicle swap fee of the space class, charged in full for the swap.
    params:
    - vehicle_swap_fee_usd
  inputs:
    history:
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 24
      filters:
        event_type: parking_fee_charge
        fee_type: vehicle_swap_fee
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_payment
    - table: parking_ledger
      aggregate: latest
      field: period_end
      filters:
        event_type: parking_rent_charge
    - table: parking_notices
      aggregate: count
