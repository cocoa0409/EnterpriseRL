  rule: A tenant who calls about a noticed increase may be given a retention_concession that gives back retention_concession_pct_of_increase of the increase, rounded down to the cent, with the same effective date as the increase and its source_rate_change_id pointing at it. A retention concession may be granted only when the handling date is not later than the increase notice date plus retention_request_window_days. The request window counts calendar days starting the day after the notice date, and the last counted day is included. The tenant must have held the agreement for at least retention_min_tenure_months whole calendar months counted from the start date. Tenure months are whole calendar months from the start date to the same day of the later month, or that month's last day when the day does not exist. Each increase receives at most one concession or rescission. Concessions on the agreement in the last 365 days, counted by parking_msr_retention_concessions_365d, must be below retention_concessions_per_12_months.
