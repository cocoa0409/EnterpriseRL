- id: parking_evt_tow_process
  subject:
  - parking_notice
  - parking_stage_advance
  - parking_tow_completed
  - parking_redemption
  - parking_payment
  - parking_payment_reversal
  rule: For an unpaid balance the tenant gate code is suspended at gate_lockout_days_after_due. The notice of intent to tow may be sent only when the handling date is not earlier than the delinquency date plus tow_notice_days_after_due. Day counts start the day after the anchor date, and the step is allowed on the day the count is reached. The notice is sent by certified mail and email, posts tow_notice_fee_usd and moves the agreement to tow_noticed. The vehicle may be towed only when the handling date is not earlier than the tow notice date plus tow_min_days_after_notice, and the towing company's own charges are paid by the tenant directly to the towing company (tow_charges_payer). While delinquent, payments of any amount are accepted; after the tow notice only a payment of the full balance is accepted, and it returns the agreement to active and restores the gate code. A returned bank payment is reversed and posts returned_payment_fee_usd. No tow notice or tow proceeds against a vehicle
    of a tenant whose profile shows active_duty military status; such a case is referred to the district office. Partial payments follow partial_payment_accepted_while_delinquent before the tow notice and partial_payment_accepted_after_tow_notice after it.
