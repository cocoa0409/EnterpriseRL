- id: parking_evt_late_fee_and_waiver
  subject:
  - parking_delinquency_onset
  - parking_fee_charge
  - parking_credit
  rule: A late fee is assessed once for a billing period when its rent is still unpaid after the grace period. A parking late fee may be posted only when the handling date is later than the rent due date of the unpaid billing period plus grace_period_days. Grace days are calendar days starting the day after the due date, and a payment on the last grace day is on time. The late fee is the greater of late_fee_flat_usd and late_fee_pct_of_rent times the monthly rent, rounded to the cent, capped at late_fee_max_usd. Fees are posted only while the agreement is in active, delinquent, tow_noticed, termination_noticed or moving_out status. A courtesy waiver credits one late fee in full on request when the agreement has been held at least courtesy_waiver_min_tenure_months whole calendar months, no tow notice has been sent in the current cycle, and parking_msr_courtesy_waivers_365d is below courtesy_waivers_per_12_months. A late fee posted against a period paid within grace is a billing error and
    is credited as billing_error_correction without using the courtesy allowance. A charge already waived or corrected is not credited again.
  eligibility:
  - id: grace_expired
    applies_to:
    - parking_fee_charge
    kind: time
    condition: A parking late fee may be posted only when the handling date is later than the rent due date of the unpaid billing period plus grace_period_days.
