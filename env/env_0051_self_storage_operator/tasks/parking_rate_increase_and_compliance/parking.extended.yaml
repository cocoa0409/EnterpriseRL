      timing: pre_action
      correlation_keys:
      - - parking_rentals.parking_rental_id
      action_bindings:
        parking_rentals.parking_rental_id: parking_rental_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the delinquency date
      anchor_source: parking_rentals.delinquent_since
      relation: not_before
      duration_source: variants.tow_notice_days_after_due
      unit: calendar_days
