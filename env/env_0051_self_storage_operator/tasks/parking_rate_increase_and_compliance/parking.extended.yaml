events:
- type: parking_reservation
  target: parking_rentals
  mutation: create
  meaning: A customer reserves a specific available parking space for a named vehicle.
  grain: One parking agreement record per reserved space.
  fields:
    customer_id: Customer reserving.
    variant_name: Space class, official full name.
    facility_code: Facility of the space.
    space_number: Space number as posted at the facility.
    monthly_rent: Contracted monthly rent before discounts, from the space's street rate on the reservation date.
    reservation_date: Date of the reservation.
    vehicle_type: Type of vehicle to be parked.
    vehicle_length_ft: Overall length of the vehicle, feet.
    military_discount_applied: Whether the military discount applies.
  triggers: []
- type: parking_reservation_cancelled
  target: parking_rentals
  mutation:
    transition:
      from: reserved
      to: reservation_cancelled
  meaning: An unclaimed parking reservation is cancelled or lapses.
  grain: One transition per reservation.
  fields:
    status: Set to reservation_cancelled.
  triggers: []
- type: parking_start
  target: parking_rentals
  mutation:
    transition:
      from: reserved
      to: active
  meaning: The tenant signs the parking agreement and parks the vehicle.
  grain: One transition per agreement.
  fields:
    start_date: Date the agreement starts; the first rent due date.
    billing_day: Day of month rent falls due.
    vehicle_plate: Plate or hull registration number of the vehicle on file.
    registration_expiry: Expiry date on the vehicle registration on file.
    insurance_expiry: Expiry date on the liability insurance card on file.
  triggers:
  - event: parking:parking_rent_charge
    map: {}
  - event: parking:parking_fee_charge
    map:
      fee_type: admin_fee
- type: parking_rent_charge
  target: parking_ledger
  meaning: Rent for one billing period is posted on its due date.
  grain: One row per agreement per billing period.
  distinguish_by:
  - period_start
  fields:
    amount: Rent posted after discounts, USD.
    entry_date: Date posted (the due date).
    period_start: First day of the billing period (the due date).
    period_end: Last day of the billing period.
  account: parking_balance
  direction: in
  triggers: []
- type: parking_fee_charge
  target: parking_ledger
  meaning: A fee is posted to the parking agreement.
  grain: One row per fee type per billing period per source entry.
  distinguish_by:
  - fee_type
  - period_start
  - reference_entry_id
  fields:
    fee_type: Kind of fee.
    amount: Fee amount, USD.
    entry_date: Date posted.
    period_start: Due date of the billing period the fee relates to (the start date for the administrative fee, the request date for a vehicle swap).
    reference_entry_id: 'Source entry: the unpaid rent charge for a late fee, the returned payment for a returned-payment fee; empty otherwise.'
  account: parking_balance
  direction: in
  triggers: []
- type: parking_payment
  target: parking_ledger
  meaning: A tenant payment is received on the parking agreement.
  grain: One row per payment.
  distinguish_by:
  - entry_date
  - amount
  - payment_method
  - payment_channel
  - autopay_draft_id
  fields:
    amount: Amount paid, USD.
    entry_date: Date received.
    payment_method: Method used.
    payment_channel: Where taken.
    autopay_draft_id: AutoPay draft behind the payment; empty for one-time payments.
  account: parking_balance
  direction: out
  triggers: []
- type: parking_payment_reversal
  target: parking_ledger
  meaning: A payment is returned by the bank or charged back.
  grain: One row per reversed payment.
  distinguish_by:
  - reference_entry_id
  fields:
    reference_entry_id: Payment reversed.
    amount: Amount reversed, USD.
    entry_date: Date posted.
    reversal_reason: Why reversed.
  account: parking_balance
  direction: in
  triggers:
  - event: parking:parking_fee_charge
    when:
      reversal_reason:
      - ach_return_insufficient_funds
      - ach_return_account_closed
    map:
      fee_type: returned_payment_fee
      reference_entry_id: reference_entry_id
- type: parking_credit
  target: parking_ledger
  meaning: 'A credit reduces what the tenant owes: a courtesy late-fee waiver or a billing-error correction.'
  grain: One row per credit type per source entry.
  distinguish_by:
  - credit_type
  - reference_entry_id
  fields:
    credit_type: Kind of credit.
    amount: Credit amount, USD.
    entry_date: Date posted.
    reference_entry_id: Charge the credit applies against.
  account: parking_balance
  direction: out
  triggers: []
- type: parking_refund
  target: parking_ledger
  meaning: A credit balance on an ended agreement is refunded.
  grain: One row per refund.
  distinguish_by:
  - entry_date
  - refund_method
  fields:
    amount: Amount refunded, USD.
    entry_date: Date refunded.
    refund_method: How refunded.
  account: parking_balance
  direction: in
  triggers: []
- type: parking_delinquency_onset
  target: parking_rentals
  mutation:
    transition:
      from: active
      to: delinquent
  meaning: Rent stays unpaid past the grace period and the agreement becomes delinquent.
  grain: One transition per delinquency cycle.
  fields:
    delinquent_since: Due date of the oldest unpaid period.
  triggers:
  - event: parking:parking_fee_charge
    map:
      fee_type: late_fee
- type: parking_notice
  target: parking_notices
  meaning: 'A notice about the agreement is sent: gate lockout, notice of intent to tow, a compliance notice for an expired registration, expired insurance, inoperable or oversize vehicle, or a compliance termination notice.'
  grain: One row per notice type per notice cycle.
  distinguish_by:
  - notice_type
  - cycle_anchor_date
  fields:
    notice_type: Kind of notice.
    notice_date: Date sent.
    cycle_anchor_date: 'Date the notice cycle runs from: the delinquency date for lockout and tow notices; the expiry or inspection date of the problem for compliance notices; the compliance notice date for a termination notice.'
    cure_by_date: Date by which the problem must be cured or the vehicle removed; empty for a gate lockout.
    notice_method: How delivered.
  triggers:
  - event: parking:parking_fee_charge
    when:
      notice_type: intent_to_tow
    map:
      fee_type: tow_notice_fee
  - event: parking:parking_stage_advance
    when:
      notice_type: intent_to_tow
    map: {}
  - event: parking:parking_stage_advance
    when:
      notice_type: compliance_termination
    map: {}
- type: parking_stage_advance
  target: parking_rentals
  mutation:
    transition:
    - from: delinquent
      to: tow_noticed
    - from: active
      to: termination_noticed
  meaning: The agreement moves to tow_noticed when the tow notice is sent, or to termination_noticed when a compliance termination notice is sent.
  grain: One transition per notice cycle.
  fields:
    status: Set to tow_noticed or termination_noticed.
  triggers: []
- type: parking_redemption
  target: parking_rentals
  mutation:
    transition:
    - from: delinquent
      to: active
    - from: tow_noticed
      to: active
  meaning: The past-due balance is paid and the agreement returns to good standing.
  grain: One transition per delinquency cycle.
  fields:
    delinquent_since: Cleared to empty.
  triggers: []
- type: parking_compliance_cured
  target: parking_rentals
  mutation:
    transition:
      from: termination_noticed
      to: active
  meaning: The vehicle compliance problem is cured before the termination date and the termination is withdrawn.
  grain: One transition per termination notice.
  fields:
    status: Set to active.
  triggers: []
- type: parking_tow_completed
  target: parking_rentals
  mutation:
    transition:
    - from: tow_noticed
      to: towed
    - from: termination_noticed
      to: towed
  meaning: The vehicle is towed by the contracted towing company and the agreement ends.
  grain: One transition per agreement.
  fields:
    move_out_date: Date of the tow.
  triggers: []
- type: parking_rate_change_notice
  target: parking_rate_changes
  meaning: 'A rent change on the parking agreement is noticed: a rate increase, a retention concession or a rescission of a defective increase.'
  grain: One row per rent change per effective date.
  distinguish_by:
  - change_reason
  - effective_date
  fields:
    change_reason: Why the rent changes.
    previous_rent: Monthly rent before the change, USD.
    new_rent: Monthly rent after the change, USD.
    street_rate_at_notice: Posted street rate of the space on the notice date, USD.
    tenure_months_at_notice: Whole calendar months from the start date to the notice date.
    notice_date: Date the notice was sent or the concession or rescission granted.
    effective_date: Rent due date from which new_rent applies.
    source_rate_change_id: Increase notice that a concession or rescission modifies; empty for an increase.
  triggers: []
- type: parking_rent_rate_update
  target: parking_rentals
  mutation: update
  meaning: The contracted rent is changed to the noticed new rent on the effective date.
  grain: One update per effective rent change.
  fields:
    monthly_rent: New monthly rent, USD.
    last_rate_change_date: Effective date of the change.
  triggers: []
- type: parking_vehicle_update
  target: parking_rentals
  mutation: update
  meaning: 'The vehicle details on file are changed: a renewed registration or insurance, or a different vehicle.'
  grain: One update per change of vehicle details.
  fields:
    vehicle_type: Type of vehicle on file.
    vehicle_length_ft: Overall length of the vehicle on file, feet.
    vehicle_plate: Plate or hull registration number on file.
    registration_expiry: Registration expiry on file.
    insurance_expiry: Insurance expiry on file.
  triggers: []
- type: parking_moveout_scheduled
  target: parking_rentals
  mutation:
    transition:
    - from: active
      to: moving_out
    - from: delinquent
      to: moving_out
  meaning: The tenant gives notice to end the parking agreement.
  grain: One transition per move-out notice.
  fields:
    move_out_date: Planned vacate date.
  triggers: []
- type: parking_moveout_withdrawn
  target: parking_rentals
  mutation:
    transition:
    - from: moving_out
      to: active
    - from: moving_out
      to: delinquent
  meaning: The tenant withdraws a move-out notice.
  grain: One transition per withdrawn notice.
  fields:
    move_out_date: Cleared to empty.
  triggers: []
- type: parking_vacated
  target: parking_rentals
  mutation:
    transition:
    - from: moving_out
      to: vacated
    - from: termination_noticed
      to: vacated
  meaning: The space is confirmed empty and the agreement ends.
  grain: One transition per agreement.
  fields:
    move_out_date: Date the vacate is confirmed.
  triggers: []
measures:
- id: parking_msr_courtesy_waivers_365d
  window: Rolling 365 calendar days ending on the handling date, inclusive, per agreement.
  measure: Count of parking_credit rows with credit_type courtesy_late_fee_waiver whose entry_date falls in the window.
- id: parking_msr_retention_concessions_365d
  window: Rolling 365 calendar days ending on the handling date, inclusive, per agreement.
  measure: Count of parking_rate_change_notice rows with change_reason retention_concession whose notice_date falls in the window.
- id: parking_msr_vehicle_swaps_365d
  window: Rolling 365 calendar days ending on the handling date, inclusive, per agreement.
  measure: Count of parking_fee_charge rows with fee_type vehicle_swap_fee whose entry_date falls in the window.
policies:
- id: parking_agg_multi_holding
  subject:
  - parking_reservation
  rule: A customer may hold parking agreements for up to max_per_customer spaces at once, counting agreements in reserved, active, delinquent, tow_noticed, termination_noticed and moving_out status; each agreement covers exactly one vehicle and one space. A customer who already holds a delinquent, tow_noticed or termination_noticed parking agreement must resolve it before a new space is reserved. A parking space is reserved only when the facility inventory shows it as available. Parking spaces are never shared between two agreements, and a vehicle already on file under another agreement is not reserved again.
  eligibility:
  - id: space_available
    applies_to:
    - parking_reservation
    kind: state
    condition: A parking space is reserved only when the facility inventory shows it as available.
    evidence_fields:
    - facility_spaces.availability
    - facility_spaces.facility_space_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - facility_spaces.facility_space_id
      action_bindings:
        facility_spaces.facility_space_id: facility_space_id
    state_contract:
      field: facility_spaces.availability
      allowed:
      - available
  - id: no_open_problem_agreement
    applies_to:
    - parking_reservation
    kind: state
    condition: A customer who already holds a delinquent, tow_noticed or termination_noticed parking agreement must resolve it before a new space is reserved.
    evidence_fields:
    - parking_rentals.status
    - parking_rentals.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_rentals.customer_id
      action_bindings:
        parking_rentals.customer_id: customer_id
    state_contract:
      field: parking_rentals.status
      allowed:
      - reserved
      - active
      - moving_out
      - vacated
      - towed
      - reservation_cancelled
  params:
    max_per_customer: 4
- id: parking_agg_portfolio_increase_review
  subject:
  - parking_rate_change_notice
  - parking_payment
  rule: 'A tenant with more than one parking agreement is reviewed agreement by agreement: each agreement keeps its own start date, rent change history and increase eligibility, and an increase on one agreement never makes another one eligible. Where the tenant asks for a retention concession on several agreements, each agreement''s concession is counted against that agreement''s own allowance. A payment that does not name a space is applied first to the agreement with the earliest delinquent_since date, then to the remaining agreements in order of start_date, oldest first.'
  eligibility: []
  params:
    allocation_basis: earliest_delinquent_since_then_oldest_start
- id: parking_evt_vehicle_fit
  subject:
  - parking_reservation
  - parking_vehicle_update
  rule: 'The vehicle on file must fit the space class: its type must be in allowed_vehicle_types and its overall length, including trailer tongue and outboard motor, must not exceed max_vehicle_length_ft. A vehicle that does not fit is not reserved or placed on file; the tenant is offered a space class that fits. Vehicle details are changed only while the agreement is in active or termination_noticed status. A different vehicle may be put on file only on an agreement in active status, at most vehicle_swaps_per_12_months times in a rolling 365-day window counted by parking_msr_vehicle_swaps_365d, and each swap posts vehicle_swap_fee_usd. A renewed registration or insurance for the same vehicle is a details update, carries no fee and does not count as a swap.'
  eligibility:
  - id: swap_status
    applies_to:
    - parking_vehicle_update
    kind: state
    condition: Vehicle details are changed only while the agreement is in active or termination_noticed status.
    evidence_fields:
    - parking_rentals.status
    - parking_rentals.parking_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_rentals.parking_rental_id
      action_bindings:
        parking_rentals.parking_rental_id: parking_rental_id
    state_contract:
      field: parking_rentals.status
      allowed:
      - active
      - termination_noticed
  - id: vehicle_fits
    applies_to:
    - parking_reservation
    - parking_vehicle_update
    kind: caller_fact
    condition: 'The vehicle on file must fit the space class: its type must be in allowed_vehicle_types and its overall length, including trailer tongue and outboard motor, must not exceed max_vehicle_length_ft.'
    evidence_fields:
    - parking_rentals.vehicle_type
    - parking_rentals.vehicle_length_ft
    - parking_rentals.parking_rental_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - parking_rentals.parking_rental_id
      action_bindings:
        parking_rentals.parking_rental_id: parking_rental_id
  params:
    per_tier:
      Bluegate Uncovered Car Space:
        max_vehicle_length_ft: =max_vehicle_length_ft
        allowed_vehicle_types: =allowed_vehicle_types
      Bluegate Uncovered RV & Boat Space (up to 30 ft):
        max_vehicle_length_ft: =max_vehicle_length_ft
        allowed_vehicle_types: =allowed_vehicle_types
      Bluegate Uncovered RV & Boat Space (31-45 ft):
        max_vehicle_length_ft: =max_vehicle_length_ft
        allowed_vehicle_types: =allowed_vehicle_types
      Bluegate Covered RV & Boat Space (up to 30 ft):
        max_vehicle_length_ft: =max_vehicle_length_ft
        allowed_vehicle_types: =allowed_vehicle_types
      Bluegate Covered RV & Boat Space (31-45 ft):
        max_vehicle_length_ft: =max_vehicle_length_ft
        allowed_vehicle_types: =allowed_vehicle_types
      Bluegate Enclosed Vehicle Garage:
        max_vehicle_length_ft: =max_vehicle_length_ft
        allowed_vehicle_types: =allowed_vehicle_types
  measures:
  - parking_msr_vehicle_swaps_365d
- id: parking_evt_rent_billing
  subject:
  - parking_start
  - parking_rent_charge
  rule: 'Parking rent is billed on the anniversary basis from the start date, with the same month-end fallback as storage units: a period starts on the start day of each month, or the month''s last day when that day does not exist, and ends the day before the next period starts. The first period is charged at start, reduced by the move-in discount or the military discount, whichever is greater; later periods are reduced by the military discount only where it is applied. Rent is charged only while the agreement is in active, delinquent, tow_noticed, termination_noticed or moving_out status. Each billing period is charged once. A period starting on or after the planned vacate date of a moving_out agreement, or after the termination date of a termination_noticed agreement, is not charged. Due dates follow billing_cycle_basis.'
  eligibility:
  - id: billable_status
    applies_to:
    - parking_rent_charge
    kind: state
    condition: Rent is charged only while the agreement is in active, delinquent, tow_noticed, termination_noticed or moving_out status.
    evidence_fields:
    - parking_rentals.status
    - parking_rentals.parking_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_rentals.parking_rental_id
      action_bindings:
        parking_rentals.parking_rental_id: parking_rental_id
    state_contract:
      field: parking_rentals.status
      allowed:
      - active
      - delinquent
      - tow_noticed
      - termination_noticed
      - moving_out
  - id: one_charge_per_period
    applies_to:
    - parking_rent_charge
    kind: dedup
    condition: Each billing period is charged once.
    evidence_fields:
    - parking_ledger.parking_rental_id
    - parking_ledger.period_start
    - parking_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_ledger.parking_rental_id
        - parking_ledger.period_start
      action_bindings:
        parking_ledger.parking_rental_id: parking_rental_id
        parking_ledger.period_start: period_start
    dedup_contract:
      table: parking_ledger
      mode: separate_record
      object_bindings:
        parking_rental_id: parking_rental_id
        period_start: period_start
      duplicate_filters:
        event_type:
        - parking_rent_charge
      distinct_fields: []
  params:
    per_tier:
      Bluegate Uncovered Car Space:
        first_month_discount_pct: =first_month_discount_pct
        military_discount_pct: =military_discount_pct
        admin_fee_usd: =admin_fee_usd
      Bluegate Uncovered RV & Boat Space (up to 30 ft):
        first_month_discount_pct: =first_month_discount_pct
        military_discount_pct: =military_discount_pct
        admin_fee_usd: =admin_fee_usd
      Bluegate Uncovered RV & Boat Space (31-45 ft):
        first_month_discount_pct: =first_month_discount_pct
        military_discount_pct: =military_discount_pct
        admin_fee_usd: =admin_fee_usd
      Bluegate Covered RV & Boat Space (up to 30 ft):
        first_month_discount_pct: =first_month_discount_pct
        military_discount_pct: =military_discount_pct
        admin_fee_usd: =admin_fee_usd
      Bluegate Covered RV & Boat Space (31-45 ft):
        first_month_discount_pct: =first_month_discount_pct
        military_discount_pct: =military_discount_pct
        admin_fee_usd: =admin_fee_usd
      Bluegate Enclosed Vehicle Garage:
        first_month_discount_pct: =first_month_discount_pct
        military_discount_pct: =military_discount_pct
        admin_fee_usd: =admin_fee_usd
  formula:
    first_period_rent: round(monthly_rent * (1 - max(first_month_discount_pct, military_discount_pct if military_discount_applied == true else 0)), 2)
    recurring_rent: round(monthly_rent * (1 - military_discount_pct), 2) if military_discount_applied == true else monthly_rent
- id: parking_evt_rate_increase
  subject:
  - parking_rate_change_notice
  - parking_rent_rate_update
  rule: 'The company may raise a parking tenant''s rent with an existing_customer_rate_increase notice. An increase notice may be sent only when the handling date is not earlier than the start date plus rate_increase_first_eligible_months. An increase notice may also be sent only when the handling date is not earlier than the last rent change date plus rate_increase_min_interval_months. Months are calendar months counted to the same day of the later month, or that month''s last day when the day does not exist. Increase notices go only to agreements in active status. The cap on one increase is rate_increase_max_pct of the current monthly rent, replaced by loyalty_max_increase_pct when the tenant''s tenure on the agreement, in whole calendar months from the start date to the notice date, is at least loyalty_tenure_months; the two caps never combine and the loyalty cap is the one that applies at or past that tenure. Where rate_increase_street_rate_ceiling is true the new rent also may not exceed
    the space''s posted street rate on the notice date, and an agreement already at or above that street rate gets no increase. The new rent is the lower of these limits, rounded down to the cent. While a prepaid rent plan in active status covers the agreement, no increase notice is sent and no increase takes effect before the prepaid term ends (prepay_rate_lock_honored). The effective date is the first rent due date at least rate_increase_notice_days calendar days after the notice date. The new rent is applied only when the handling date is not earlier than the notice date plus rate_increase_notice_days. Notice days are counted as calendar days starting the day after the notice date. An increase notice that breaks any of these rules is defective: it is rescinded in full with an increase_rescinded change whose new rent equals the previous rent, and the rescission does not count as a rent change for the interval rule. Rescission of a defective increase follows rescind_defective_increase.'
  eligibility:
  - id: first_increase_wait
    applies_to:
    - parking_rate_change_notice
    kind: time
    condition: An increase notice may be sent only when the handling date is not earlier than the start date plus rate_increase_first_eligible_months.
    evidence_fields:
    - parking_rentals.start_date
    - parking_rentals.parking_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_rentals.parking_rental_id
      action_bindings:
        parking_rentals.parking_rental_id: parking_rental_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the start date
      anchor_source: parking_rentals.start_date
      relation: not_before
      duration_source: variants.rate_increase_first_eligible_months
      unit: calendar_months
      counting_rule: Months are calendar months counted to the same day of the later month, or that month's last day when the day does not exist.
      boundary: inclusive
  - id: interval_wait
    applies_to:
    - parking_rate_change_notice
    kind: time
    condition: An increase notice may also be sent only when the handling date is not earlier than the last rent change date plus rate_increase_min_interval_months.
    evidence_fields:
    - parking_rentals.last_rate_change_date
    - parking_rentals.parking_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_rentals.parking_rental_id
      action_bindings:
        parking_rentals.parking_rental_id: parking_rental_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the last rent change date
      anchor_source: parking_rentals.last_rate_change_date
      relation: not_before
      duration_source: variants.rate_increase_min_interval_months
      unit: calendar_months
      counting_rule: Months are calendar months counted to the same day of the later month, or that month's last day when the day does not exist.
      boundary: inclusive
  - id: increase_status
    applies_to:
    - parking_rate_change_notice
    kind: state
    condition: Increase notices go only to agreements in active status.
    evidence_fields:
    - parking_rentals.status
    - parking_rentals.parking_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_rentals.parking_rental_id
      action_bindings:
        parking_rentals.parking_rental_id: parking_rental_id
    state_contract:
      field: parking_rentals.status
      allowed:
      - active
  - id: no_prepay_lock
    applies_to:
    - parking_rate_change_notice
    - parking_rent_rate_update
    kind: authorization
    condition: While a prepaid rent plan in active status covers the agreement, no increase notice is sent and no increase takes effect before the prepaid term ends (prepay_rate_lock_honored).
    evidence_fields:
    - prepay_plans.status
    - prepay_plans.agreement_id
    - prepay_plans.term_end_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - prepay_plans.agreement_id
      action_bindings:
        prepay_plans.agreement_id: parking_rental_id
  - id: notice_elapsed
    applies_to:
    - parking_rent_rate_update
    kind: time
    condition: The new rent is applied only when the handling date is not earlier than the notice date plus rate_increase_notice_days.
    evidence_fields:
    - parking_rate_changes.notice_date
    - parking_rate_changes.parking_rate_change_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - parking_rate_changes.parking_rate_change_id
      action_bindings:
        parking_rate_changes.parking_rate_change_id: parking_rate_change_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the notice date
      anchor_source: parking_rate_changes.notice_date
      relation: not_before
      duration_source: variants.rate_increase_notice_days
      unit: calendar_days
      counting_rule: Notice days are counted as calendar days starting the day after the notice date.
      boundary: inclusive
  params:
    per_tier:
      Bluegate Uncovered Car Space:
        rate_increase_max_pct: =rate_increase_max_pct
        loyalty_max_increase_pct: =loyalty_max_increase_pct
        loyalty_tenure_months: =loyalty_tenure_months
        rate_increase_notice_days: =rate_increase_notice_days
      Bluegate Uncovered RV & Boat Space (up to 30 ft):
        rate_increase_max_pct: =rate_increase_max_pct
        loyalty_max_increase_pct: =loyalty_max_increase_pct
        loyalty_tenure_months: =loyalty_tenure_months
        rate_increase_notice_days: =rate_increase_notice_days
      Bluegate Uncovered RV & Boat Space (31-45 ft):
        rate_increase_max_pct: =rate_increase_max_pct
        loyalty_max_increase_pct: =loyalty_max_increase_pct
        loyalty_tenure_months: =loyalty_tenure_months
        rate_increase_notice_days: =rate_increase_notice_days
      Bluegate Covered RV & Boat Space (up to 30 ft):
        rate_increase_max_pct: =rate_increase_max_pct
        loyalty_max_increase_pct: =loyalty_max_increase_pct
        loyalty_tenure_months: =loyalty_tenure_months
        rate_increase_notice_days: =rate_increase_notice_days
      Bluegate Covered RV & Boat Space (31-45 ft):
        rate_increase_max_pct: =rate_increase_max_pct
