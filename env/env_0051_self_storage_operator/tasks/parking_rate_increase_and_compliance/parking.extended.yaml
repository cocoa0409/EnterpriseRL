extended_policies:
- id: parking_ext_billing_error_correction
  base_policy_refs:
  - parking_evt_late_fee_and_waiver
  overwrite:
  - base_policy: parking_evt_late_fee_and_waiver
    superseded_clause: A late fee posted against a period paid within grace is a billing error and is credited as billing_error_correction without using the courtesy allowance.
    replaced_by: The service-recovery amount is worked out by multiplying the service-recovery share by the rent it is measured on and that product by the multiplier that applies, comparing the result with the service-recovery ceiling and keeping the lower of the two, and rounding that amount to the cent; the correction credit is the standard late fee plus the service-recovery amount plus any inconvenience allowance, rounded to the cent.
  trigger: state_due
  subject:
  - parking_credit
  computes: amount
  target_tool: credit_parking_billing_error_d978766a
  params:
    share_std: 0.02
    share_mid: 0.035
    share_long: 0.05
    tenure_long: 36
    tenure_mid: 12
    payments_steady: 10
    payments_some: 6
    unit_tenure_long: 24
    mult_bundled: 2
    mult_newer: 1.5
    cap_clean: 25.0
    cap_mixed: 15.0
    cap_std: 10.0
    allow_tow: 25.0
    allow_lockout: 10.0
  rule: 'A late fee posted against a billing period whose rent was paid within its grace period is a billing error, and each such late fee is corrected with one billing-error correction credit against that fee entry, without using the courtesy allowance. The billing-error correction credit returns the agreement''s standard late fee, which is the greater of the flat late fee and the standard late-fee percentage of the contracted monthly rent, the percentage amount rounded to the cent, never more than the late-fee ceiling, and adds a service-recovery amount to it. The standard service-recovery amount is the standard service-recovery share of the agreement''s contracted monthly rent, never more than the standard service-recovery ceiling, rounded to the cent. For the service-recovery amount, a window of the last 12 months or the last two months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    The service-recovery share is the long-standing share for a tenant who has held the agreement at least the long-tenure months and made at least the steady-payment count of payments on it in the last 12 months; the mid share for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months and made at least the some-payment count of payments on it in the last 12 months; and the standard service-recovery share for every other tenant. The rent the service-recovery share is measured on is the new rent of the most recent rent increase notice where a rent increase was noticed on the agreement in the last two months; the average of the rent charges posted on the agreement in the last 12 months where no increase was noticed in the last two months but a retention concession was recorded on it in the last 12 months; and the contracted monthly rent in every other case. The service-recovery amount is multiplied by the bundled-tenant multiplier for a tenant who also
    holds an active storage unit rental moved into at least the long unit-tenure months before the handling date, by the newer-bundle multiplier for a tenant whose active storage unit rental was moved into more recently than that, and is taken as computed for a tenant with no active storage unit rental. The service-recovery ceiling is the clean-record ceiling where no more than two late fees of any kind, erroneous or not, were posted on the agreement in the last 12 months, the mixed-record ceiling where three or four were, and the standard service-recovery ceiling where five or more were. An inconvenience allowance is added to the correction credit: the tow-notice allowance where a notice of intent to tow was sent on the agreement in the last two months, the lockout allowance where no such notice was sent in that time but a gate lockout notice was, and nothing in every other case. The service-recovery amount is worked out by multiplying the service-recovery share by the rent it is measured
    on and that product by the multiplier that applies, comparing the result with the service-recovery ceiling and keeping the lower of the two, and rounding that amount to the cent; the correction credit is the standard late fee plus the service-recovery amount plus any inconvenience allowance, rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: unit
    as: branch
    reads:
    - status
    - move_in_date
    note: The bundled-tenant multiplier is decided from whether the tenant holds an active storage unit rental and how long ago it was moved into.
  compute:
  - err_fee: MN(P('late_fee_max_usd'), MX(P('late_fee_flat_usd'), RND(P('late_fee_pct_of_rent') * F('monthly_rent'), 2)))
  - rec_share: K('share_long') if MONTHS(F('start_date'), NOW) >= K('tenure_long') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_steady') else (K('share_mid') if MONTHS(F('start_date'), NOW) >= K('tenure_mid') and MONTHS(F('start_date'), NOW) < K('tenure_long') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_some') else K('share_std'))
  - rec_rent: LATEST('parking_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase') if COUNT('parking_rate_changes', within_months=2, date_field='notice_date', change_reason='existing_customer_rate_increase') >= 1 else (SUM('parking_ledger', 'amount', within_months=12, date_field='entry_date', event_type='parking_rent_charge') / COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_rent_charge') if COUNT('parking_rate_changes', within_months=12, date_field='notice_date', change_reason='retention_concession') >= 1 else F('monthly_rent'))
  - rec_mult: K('mult_bundled') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) >= K('unit_tenure_long') else (K('mult_newer') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) < K('unit_tenure_long') else 1)
  - rec_cap: K('cap_clean') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') <= 2 else (K('cap_mixed') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') <= 4 else K('cap_std'))
  - rec_allow: K('allow_tow') if COUNT('parking_notices', within_months=2, date_field='notice_date', notice_type='intent_to_tow') >= 1 else (K('allow_lockout') if COUNT('parking_notices', within_months=2, date_field='notice_date', notice_type='gate_lockout') >= 1 else 0)
  - recovery: RND(MN(rec_cap, rec_share * rec_rent * rec_mult), 2)
  - result: RND(err_fee + recovery + rec_allow, 2)
  compute_basis:
    err_fee: The billing-error correction credit returns the agreement's standard late fee, which is the greater of the flat late fee and the standard late-fee percentage of the contracted monthly rent, the percentage amount rounded to the cent, never more than the late-fee ceiling, and adds a service-recovery amount to it.
    rec_share: The service-recovery share is the long-standing share for a tenant who has held the agreement at least the long-tenure months and made at least the steady-payment count of payments on it in the last 12 months; the mid share for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months and made at least the some-payment count of payments on it in the last 12 months; and the standard service-recovery share for every other tenant. For the service-recovery amount, a window of the last 12 months or the last two months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    rec_rent: The rent the service-recovery share is measured on is the new rent of the most recent rent increase notice where a rent increase was noticed on the agreement in the last two months; the average of the rent charges posted on the agreement in the last 12 months where no increase was noticed in the last two months but a retention concession was recorded on it in the last 12 months; and the contracted monthly rent in every other case. For the service-recovery amount, a window of the last 12 months or the last two months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    rec_mult: The service-recovery amount is multiplied by the bundled-tenant multiplier for a tenant who also holds an active storage unit rental moved into at least the long unit-tenure months before the handling date, by the newer-bundle multiplier for a tenant whose active storage unit rental was moved into more recently than that, and is taken as computed for a tenant with no active storage unit rental.
    rec_cap: The service-recovery ceiling is the clean-record ceiling where no more than two late fees of any kind, erroneous or not, were posted on the agreement in the last 12 months, the mixed-record ceiling where three or four were, and the standard service-recovery ceiling where five or more were. For the service-recovery amount, a window of the last 12 months or the last two months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    rec_allow: 'An inconvenience allowance is added to the correction credit: the tow-notice allowance where a notice of intent to tow was sent on the agreement in the last two months, the lockout allowance where no such notice was sent in that time but a gate lockout notice was, and nothing in every other case. For the service-recovery amount, a window of the last 12 months or the last two months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.'
    recovery: The service-recovery amount is worked out by multiplying the service-recovery share by the rent it is measured on and that product by the multiplier that applies, comparing the result with the service-recovery ceiling and keeping the lower of the two, and rounding that amount to the cent; the correction credit is the standard late fee plus the service-recovery amount plus any inconvenience allowance, rounded to the cent. The standard service-recovery amount is the standard service-recovery share of the agreement's contracted monthly rent, never more than the standard service-recovery ceiling, rounded to the cent.
    result: The service-recovery amount is worked out by multiplying the service-recovery share by the rent it is measured on and that product by the multiplier that applies, comparing the result with the service-recovery ceiling and keeping the lower of the two, and rounding that amount to the cent; the correction credit is the standard late fee plus the service-recovery amount plus any inconvenience allowance, rounded to the cent. The billing-error correction credit returns the agreement's standard late fee, which is the greater of the flat late fee and the standard late-fee percentage of the contracted monthly rent, the percentage amount rounded to the cent, never more than the late-fee ceiling, and adds a service-recovery amount to it.
  factors:
  - id: service_recovery_share
    effect: parameter
    decides: rec_share
    bindings:
    - rec_share
    ladder:
    - when: held the agreement at least the long-tenure months and at least the steady-payment count of payments in the last 12 months
      value: K('share_long')
    - when: held it at least the mid-tenure months but fewer than the long-tenure months and at least the some-payment count of payments in the last 12 months
      value: K('share_mid')
    - when: otherwise
      value: K('share_std')
    baseline:
      rec_share: K('share_std')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: service_recovery_rent_measure
    effect: method
    decides: rec_rent
    bindings:
    - rec_rent
    ladder:
    - when: a rent increase was noticed on the agreement in the last two months
      method: the new rent of the most recent rent increase notice
    - when: no increase noticed in the last two months and a retention concession recorded in the last 12 months
      method: the average of the rent charges posted in the last 12 months
    - when: otherwise
      method: the contracted monthly rent
    baseline:
      rec_rent: F('monthly_rent')
    evidence:
    - history
    cross_difficulty: null
  - id: bundled_tenant_multiplier
    effect: method
    decides: rec_mult
    bindings:
    - rec_mult
    ladder:
    - when: holds an active storage unit rental moved into at least the long unit-tenure months ago
      method: the service-recovery amount is multiplied by the bundled-tenant multiplier
    - when: holds an active storage unit rental moved into more recently
      method: the service-recovery amount is multiplied by the newer-bundle multiplier
    - when: otherwise
      method: the service-recovery amount is taken as computed
    baseline:
      rec_mult: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: unit
  - id: service_recovery_ceiling
    effect: parameter
    decides: rec_cap
    bindings:
    - rec_cap
    ladder:
    - when: no more than two late fees of any kind in the last 12 months
      value: K('cap_clean')
    - when: three or four late fees in the last 12 months
      value: K('cap_mixed')
    - when: otherwise
      value: K('cap_std')
    baseline:
      rec_cap: K('cap_std')
    evidence:
    - history
    cross_difficulty: null
  - id: inconvenience_allowance
    effect: parameter
    decides: rec_allow
    bindings:
    - rec_allow
    ladder:
    - when: a notice of intent to tow sent in the last two months
      value: K('allow_tow')
    - when: no notice of intent to tow but a gate lockout notice sent in the last two months
      value: K('allow_lockout')
    - when: otherwise
      value: '0'
    baseline:
      rec_allow: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The billing-error correction credit returns the agreement's standard late fee, which is the greater of the flat late fee and the standard late-fee percentage of the contracted monthly rent, the percentage amount rounded to the cent, never more than the late-fee ceiling, and adds a service-recovery amount to it. The standard service-recovery amount is the standard service-recovery share of the agreement's contracted monthly rent, never more than the standard service-recovery ceiling, rounded to the cent.
    params:
