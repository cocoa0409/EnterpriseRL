- id: parking_ext_late_fee_assessment
  base_policy_refs:
  - parking_evt_late_fee_and_waiver
  overwrite:
  - base_policy: parking_evt_late_fee_and_waiver
    superseded_clause: The late fee is the greater of late_fee_flat_usd and late_fee_pct_of_rent times the monthly rent, rounded to the cent, capped at late_fee_max_usd.
    replaced_by: The late fee is worked out by first taking the greater of the flat late fee and the late-fee percentage of the contracted monthly rent (that percentage amount rounded to the cent), keeping no more than the late-fee ceiling, then multiplying that amount by the cycle multiplier and by the proration that applies, then taking off the bundled-tenant rebate, and finally raising the result to the minimum that applies when it is lower, rounded to the cent only at the end.
  trigger: state_due
  subject:
  - parking_fee_charge
  computes: amount
  target_tool: post_parking_late_fee_42918014
  params:
    pct_step_repeat: 0.06
    pct_step_single: 0.03
    mult_tow_cycle: 1.5
    mult_lockout_cycle: 1.25
    tenure_long: 36
    tenure_mid: 12
    payments_steady: 10
    payments_some: 6
    prorate_days_long: 30
    prorate_days_mid: 20
    unit_tenure_long: 24
    rebate_long_bundle: 5.0
    rebate_newer_bundle: 2.5
    min_long: 10.0
    min_mid: 15.0
  rule: 'A late fee is posted once for a billing period whose rent is still unpaid at the end of its grace period, against the unpaid rent charge of that period. A late fee for an unpaid period is not posted until each earlier late fee that was charged against a period paid within its grace period carries a billing-error correction credit on the ledger. The standard late fee is the greater of the flat late fee and the standard late-fee percentage of the contracted monthly rent, the percentage amount rounded to the cent, never more than the late-fee ceiling. The standard late fee is charged in full, and it is never less than the flat late fee. For the late fee, a window of the last 12 months covers ledger entries dated less than 12 whole calendar months before the handling date, whole months being counted to the same day of the later month. The late-fee percentage is the standard late-fee percentage plus the repeat step where two or more late fees posted on the agreement in the last 12 months
    stand without a billing-error correction credit, the standard percentage plus the single step where exactly one does, and the standard percentage where none does; late fees corrected as billing errors are not counted. The fee is multiplied by the tow-cycle multiplier where a notice of intent to tow has been sent in the current delinquency cycle, by the lockout-cycle multiplier where no such notice has been sent in the cycle but a gate lockout notice has, and is charged as worked out where neither has been sent; the cycle is the one running from the agreement''s delinquency date. Days late are counted from the agreement''s delinquency date, the due date of the oldest unpaid period of the current delinquency cycle, unless the agreement''s own AutoPay records say otherwise: where an AutoPay draft on this agreement for that due date was declined for insufficient funds, they are counted from the date of the latest such declined attempt; where no draft on this agreement for that due date was
    so declined but the agreement''s AutoPay authorization stands suspended, they are counted from its suspension date. Days late are the calendar days from that starting date to the handling date less the grace period days. For a tenant who has held the agreement at least the long-tenure months and made at least the steady-payment count of payments on it in the last 12 months, the fee is prorated by the days late over the long proration days, and never by more than the whole fee; for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months and made at least the some-payment count of payments in the last 12 months, it is prorated by the days late over the mid proration days, never by more than the whole fee; every other tenant is charged the fee in full. A bundled-tenant rebate is taken off the fee: the long-bundle rebate for a tenant who also holds an active storage unit rental moved into at least the long unit-tenure months before the handling date,
    the newer-bundle rebate for a tenant whose active storage unit rental was moved into more recently, and nothing for a tenant with no active storage unit rental. The late fee is never less than the long-tenure minimum for a tenant who has held the agreement at least the long-tenure months, the mid-tenure minimum for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months, and the flat late fee for every other tenant. The late fee is worked out by first taking the greater of the flat late fee and the late-fee percentage of the contracted monthly rent (that percentage amount rounded to the cent), keeping no more than the late-fee ceiling, then multiplying that amount by the cycle multiplier and by the proration that applies, then taking off the bundled-tenant rebate, and finally raising the result to the minimum that applies when it is lower, rounded to the cent only at the end.'
  prerequisite:
  - problem: parking_ext_billing_error_correction
    kind: value_input
    gate: lf_pct
    form: state
    policy_source: A late fee for an unpaid period is not posted until each earlier late fee that was charged against a period paid within its grace period carries a billing-error correction credit on the ledger.
    condition: Every late fee on the agreement whose billing period was paid within its grace period carries a billing-error correction credit entry referencing it.
    resolved_by: credit_parking_billing_error_d978766a
    effect: The corrected late fee stops counting toward the repeat-lateness count, so the late-fee percentage drops by one step.
  cross_category:
  - category: autopay
    as: history
    reads:
    - status
    - suspension_date
    - autopay_drafts.draft_date
    - autopay_drafts.result
    - autopay_drafts.due_date
    note: The lateness clock anchor is decided from the AutoPay draft attempts for the unpaid period's due date and the authorization's status.
  - category: unit
    as: branch
    reads:
    - status
    - move_in_date
    note: The bundled-tenant rebate is decided from whether the tenant holds an active storage unit rental and how long ago it was moved into.
  compute:
  - lf_pct: P('late_fee_pct_of_rent') + K('pct_step_repeat') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') - COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_credit', credit_type='billing_error_correction') >= 2 else (P('late_fee_pct_of_rent') + K('pct_step_single') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') - COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_credit', credit_type='billing_error_correction') == 1 else P('late_fee_pct_of_rent'))
  - lf_standard: MN(P('late_fee_max_usd'), MX(P('late_fee_flat_usd'), RND(lf_pct * F('monthly_rent'), 2)))
  - lf_cycle: K('mult_tow_cycle') if COUNT('parking_notices', notice_type='intent_to_tow', cycle_anchor_date=F('delinquent_since')) >= 1 else (K('mult_lockout_cycle') if COUNT('parking_notices', notice_type='gate_lockout', cycle_anchor_date=F('delinquent_since')) >= 1 else 1)
  - lf_anchor: XLATEST('autopay', 'autopay_drafts', 'draft_date', date_field='draft_date', agreement_id=HID, due_date=F('delinquent_since'), result='declined_insufficient_funds') if XCOUNT('autopay', 'autopay_drafts', agreement_id=HID, due_date=F('delinquent_since'), result='declined_insufficient_funds') >= 1 else (CFIELD('autopay', 'suspension_date', agreement_id=HID, status='suspended') if XCOUNT('autopay', 'autopay_drafts', agreement_id=HID, due_date=F('delinquent_since'), result='declined_insufficient_funds') == 0 and CFIELD('autopay', 'status', agreement_id=HID) == 'suspended' else F('delinquent_since'))
  - lf_days: MX(0, DAYS(lf_anchor, NOW) - P('grace_period_days'))
  - lf_prorate: MN(1, lf_days / K('prorate_days_long')) if MONTHS(F('start_date'), NOW) >= K('tenure_long') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_steady') else (MN(1, lf_days / K('prorate_days_mid')) if MONTHS(F('start_date'), NOW) >= K('tenure_mid') and MONTHS(F('start_date'), NOW) < K('tenure_long') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_some') else 1)
  - lf_rebate: K('rebate_long_bundle') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) >= K('unit_tenure_long') else (K('rebate_newer_bundle') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) < K('unit_tenure_long') else 0)
  - lf_floor: K('min_long') if MONTHS(F('start_date'), NOW) >= K('tenure_long') else (K('min_mid') if MONTHS(F('start_date'), NOW) >= K('tenure_mid') else P('late_fee_flat_usd'))
  - result: RND(MX(lf_floor, lf_standard * lf_cycle * lf_prorate - lf_rebate), 2)
  compute_basis:
    lf_pct: The late-fee percentage is the standard late-fee percentage plus the repeat step where two or more late fees posted on the agreement in the last 12 months stand without a billing-error correction credit, the standard percentage plus the single step where exactly one does, and the standard percentage where none does; late fees corrected as billing errors are not counted. For the late fee, a window of the last 12 months covers ledger entries dated less than 12 whole calendar months before the handling date, whole months being counted to the same day of the later month.
    lf_standard: The standard late fee is the greater of the flat late fee and the standard late-fee percentage of the contracted monthly rent, the percentage amount rounded to the cent, never more than the late-fee ceiling. The late fee is worked out by first taking the greater of the flat late fee and the late-fee percentage of the contracted monthly rent (that percentage amount rounded to the cent), keeping no more than the late-fee ceiling, then multiplying that amount by the cycle multiplier and by the proration that applies, then taking off the bundled-tenant rebate, and finally raising the result to the minimum that applies when it is lower, rounded to the cent only at the end.
    lf_cycle: The fee is multiplied by the tow-cycle multiplier where a notice of intent to tow has been sent in the current delinquency cycle, by the lockout-cycle multiplier where no such notice has been sent in the cycle but a gate lockout notice has, and is charged as worked out where neither has been sent; the cycle is the one running from the agreement's delinquency date.
    lf_anchor: 'Days late are counted from the agreement''s delinquency date, the due date of the oldest unpaid period of the current delinquency cycle, unless the agreement''s own AutoPay records say otherwise: where an AutoPay draft on this agreement for that due date was declined for insufficient funds, they are counted from the date of the latest such declined attempt; where no draft on this agreement for that due date was so declined but the agreement''s AutoPay authorization stands suspended, they are counted from its suspension date.'
    lf_days: Days late are the calendar days from that starting date to the handling date less the grace period days.
    lf_prorate: For a tenant who has held the agreement at least the long-tenure months and made at least the steady-payment count of payments on it in the last 12 months, the fee is prorated by the days late over the long proration days, and never by more than the whole fee; for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months and made at least the some-payment count of payments in the last 12 months, it is prorated by the days late over the mid proration days, never by more than the whole fee; every other tenant is charged the fee in full. For the late fee, a window of the last 12 months covers ledger entries dated less than 12 whole calendar months before the handling date, whole months being counted to the same day of the later month.
    lf_rebate: 'A bundled-tenant rebate is taken off the fee: the long-bundle rebate for a tenant who also holds an active storage unit rental moved into at least the long unit-tenure months before the handling date, the newer-bundle rebate for a tenant whose active storage unit rental was moved into more recently, and nothing for a tenant with no active storage unit rental.'
    lf_floor: The late fee is never less than the long-tenure minimum for a tenant who has held the agreement at least the long-tenure months, the mid-tenure minimum for a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months, and the flat late fee for every other tenant.
    result: The late fee is worked out by first taking the greater of the flat late fee and the late-fee percentage of the contracted monthly rent (that percentage amount rounded to the cent), keeping no more than the late-fee ceiling, then multiplying that amount by the cycle multiplier and by the proration that applies, then taking off the bundled-tenant rebate, and finally raising the result to the minimum that applies when it is lower, rounded to the cent only at the end.
  factors:
  - id: repeat_lateness_percentage
    effect: parameter
    decides: lf_pct
    bindings:
    - lf_pct
    ladder:
    - when: two or more late fees in the last 12 months stand without a billing-error correction credit
      value: P('late_fee_pct_of_rent') + K('pct_step_repeat')
    - when: exactly one such late fee stands
      value: P('late_fee_pct_of_rent') + K('pct_step_single')
    - when: otherwise
      value: P('late_fee_pct_of_rent')
    baseline:
      lf_pct: P('late_fee_pct_of_rent')
    evidence:
    - history
    cross_difficulty: null
  - id: delinquency_cycle_multiplier
    effect: method
    decides: lf_cycle
    bindings:
    - lf_cycle
    ladder:
    - when: a notice of intent to tow sent in the current delinquency cycle
      method: the fee is multiplied by the tow-cycle multiplier
    - when: no tow notice but a gate lockout notice sent in the current cycle
      method: the fee is multiplied by the lockout-cycle multiplier
    - when: otherwise
      method: the fee is charged as worked out
    baseline:
      lf_cycle: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: lateness_clock_anchor
    effect: method
    decides: lf_anchor
    bindings:
    - lf_anchor
    ladder:
    - when: an AutoPay draft on this agreement for the delinquency date was declined for insufficient funds
      method: days late counted from the latest such declined draft attempt
    - when: no draft on this agreement for the delinquency date so declined and the agreement's AutoPay authorization stands suspended
      method: days late counted from the authorization's suspension date
    - when: otherwise
      method: days late counted from the delinquency date
    baseline:
      lf_anchor: F('delinquent_since')
    evidence:
    - cross_category
    - date
    cross_difficulty: autopay
  - id: loyal_tenant_proration
    effect: method
    decides: lf_prorate
    bindings:
    - lf_prorate
    ladder:
    - when: held the agreement at least the long-tenure months and at least the steady-payment count of payments in the last 12 months
      method: the fee is prorated by days late over the long proration days, capped at the whole fee
    - when: held it at least the mid-tenure months but fewer than the long-tenure months and at least the some-payment count of payments in the last 12 months
      method: the fee is prorated by days late over the mid proration days, capped at the whole fee
    - when: otherwise
      method: the fee is charged in full
    baseline:
      lf_prorate: '1'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: bundled_tenant_rebate
    effect: parameter
    decides: lf_rebate
    bindings:
    - lf_rebate
    ladder:
    - when: holds an active storage unit rental moved into at least the long unit-tenure months ago
      value: K('rebate_long_bundle')
    - when: holds an active storage unit rental moved into more recently
      value: K('rebate_newer_bundle')
    - when: otherwise
      value: '0'
    baseline:
      lf_rebate: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: unit
  - id: tenure_minimum_fee
    effect: parameter
    decides: lf_floor
    bindings:
    - lf_floor
    ladder:
    - when: held the agreement at least the long-tenure months
      value: K('min_long')
    - when: held it at least the mid-tenure months but fewer than the long-tenure months
      value: K('min_mid')
    - when: otherwise
      value: P('late_fee_flat_usd')
    baseline:
      lf_floor: P('late_fee_flat_usd')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The standard late fee is the greater of the flat late fee and the standard late-fee percentage of the contracted monthly rent, the percentage amount rounded to the cent, never more than the late-fee ceiling. The standard late fee is charged in full, and it is never less than the flat late fee.
    params:
    - late_fee_flat_usd
    - late_fee_pct_of_rent
    - late_fee_max_usd
  inputs:
    history:
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_fee_charge
        fee_type: late_fee
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_credit
        credit_type: billing_error_correction
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_payment
    - table: parking_notices
      aggregate: count
      field: parking_notice_id
      filters:
        notice_type: gate_lockout
    - category: autopay
      table: autopay_drafts
      aggregate: latest
      field: draft_date
      filters:
        result: declined_insufficient_funds
    cross_category:
    - autopay
    - unit
- id: parking_ext_bring_current_payment
  base_policy_refs:
  - parking_agg_portfolio_increase_review
  - parking_evt_tow_process
  overwrite: []
  trigger: on_request
  subject:
  - parking_payment
  computes: amount
  target_tool: pay_parking_past_due_d726500b
  params:
    full_collection_days: 7
    half_collection_days: 14
    half_share: 0.5
    tenure_long: 36
    tenure_mid: 12
    payments_steady: 10
    payments_some: 6
    defer_long: 10.0
    defer_mid: 5.0
    unit_tenure_long: 24
    defer_long_bundle: 5.0
    defer_newer_bundle: 2.5
    long_lockout_days: 14
    defer_long_lockout: 7.0
    defer_short_lockout: 3.5
  rule: A tenant whose parking agreement is delinquent may pay from their own card or bank account to bring it current, and the care agent tells the tenant the amount to pay. The amount that brings a delinquent agreement current is worked out only once a late fee stands on the ledger for every billing period whose rent remained unpaid past its grace period. The amount that brings a delinquent agreement current is not fixed until every late fee posted against a period paid within its grace period carries a billing-error correction credit. The standard amount that brings a delinquent agreement current is the balance due on the agreement as it stands on the ledger, with nothing collected toward the next billing period and nothing left for the next statement. The next rent due date is the day after the last day of the most recently charged billing period; where that date is no more than the full-collection days away from the handling date, the payment also collects the next period's contracted
    monthly rent in full; where it is more than the full-collection days but no more than the half-collection days away, the payment collects half of that rent; where it is further away, nothing is collected toward the next period. A tenant who has held the agreement at least the long-tenure months and made at least the steady-payment count of payments on it in the last 12 months has the long-tenure deferral left on the next statement; a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months and made at least the some-payment count of payments in that time has the mid-tenure deferral left on it; every other tenant leaves nothing; a window of the last 12 months covers ledger entries dated less than 12 whole calendar months before the handling date. A tenant who also holds an active storage unit rental moved into at least the long unit-tenure months before the handling date has the long-bundle deferral left on the next statement, a tenant whose active storage
    unit rental was moved into more recently has the newer-bundle deferral left on it, and a tenant with no active storage unit rental leaves nothing on that account. Where a gate lockout notice has been sent in the current delinquency cycle, the long-lockout deferral is left on the next statement when that notice was sent at least the long-lockout days before the handling date, and the short-lockout deferral when it was sent fewer days before; where no gate lockout notice has been sent in the cycle, nothing is left on that account. The amount to pay is the balance due plus the share of the next period's rent that is collected, less every deferral that applies, each deferral being left on the next statement rather than collected, rounded to the cent.
  prerequisite:
  - problem: parking_ext_late_fee_assessment
    kind: value_input
    gate: pay_balance
    form: state
    policy_source: The amount that brings a delinquent agreement current is worked out only once a late fee stands on the ledger for every billing period whose rent remained unpaid past its grace period.
    condition: A late fee entry referencing the rent charge stands on the ledger for every billing period whose rent is unpaid past its grace period.
    resolved_by: post_parking_late_fee_42918014
    effect: The posted late fee raises the balance due the payment is worked out from by the amount of that fee.
  - problem: parking_ext_billing_error_correction
    kind: value_input
    gate: pay_balance
    form: state
    policy_source: The amount that brings a delinquent agreement current is not fixed until every late fee posted against a period paid within its grace period carries a billing-error correction credit.
    condition: Every late fee whose billing period was paid within its grace period carries a billing-error correction credit entry referencing it.
    resolved_by: credit_parking_billing_error_d978766a
    effect: The correction credit lowers the balance due the payment is worked out from by the credited amount.
  cross_category:
  - category: unit
    as: branch
    reads:
    - status
    - move_in_date
    note: The bundled-tenant deferral is decided from whether the tenant holds an active storage unit rental and how long ago it was moved into.
  compute:
  - pay_balance: F('balance_due')
  - pay_next: 1 if (DAYS(NOW, LATEST('parking_ledger', 'period_end', date_field='entry_date', event_type='parking_rent_charge')) + 1) <= K('full_collection_days') else (K('half_share') if (DAYS(NOW, LATEST('parking_ledger', 'period_end', date_field='entry_date', event_type='parking_rent_charge')) + 1) <= K('half_collection_days') else 0)
  - pay_defer: K('defer_long') if MONTHS(F('start_date'), NOW) >= K('tenure_long') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_steady') else (K('defer_mid') if MONTHS(F('start_date'), NOW) >= K('tenure_mid') and MONTHS(F('start_date'), NOW) < K('tenure_long') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_some') else 0)
  - pay_bundle: K('defer_long_bundle') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) >= K('unit_tenure_long') else (K('defer_newer_bundle') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) < K('unit_tenure_long') else 0)
  - pay_lock: K('defer_long_lockout') if COUNT('parking_notices', notice_type='gate_lockout', cycle_anchor_date=F('delinquent_since')) >= 1 and DAYS(LATEST('parking_notices', 'notice_date', date_field='notice_date', notice_type='gate_lockout', cycle_anchor_date=F('delinquent_since')), NOW) >= K('long_lockout_days') else (K('defer_short_lockout') if COUNT('parking_notices', notice_type='gate_lockout', cycle_anchor_date=F('delinquent_since')) >= 1 and DAYS(LATEST('parking_notices', 'notice_date', date_field='notice_date', notice_type='gate_lockout', cycle_anchor_date=F('delinquent_since')), NOW) < K('long_lockout_days') else 0)
  - result: RND(pay_balance + pay_next * F('monthly_rent') - pay_defer - pay_bundle - pay_lock, 2)
  compute_basis:
    pay_balance: The standard amount that brings a delinquent agreement current is the balance due on the agreement as it stands on the ledger, with nothing collected toward the next billing period and nothing left for the next statement.
    pay_next: The next rent due date is the day after the last day of the most recently charged billing period; where that date is no more than the full-collection days away from the handling date, the payment also collects the next period's contracted monthly rent in full; where it is more than the full-collection days but no more than the half-collection days away, the payment collects half of that rent; where it is further away, nothing is collected toward the next period.
    pay_defer: A tenant who has held the agreement at least the long-tenure months and made at least the steady-payment count of payments on it in the last 12 months has the long-tenure deferral left on the next statement; a tenant who has held it at least the mid-tenure months but fewer than the long-tenure months and made at least the some-payment count of payments in that time has the mid-tenure deferral left on it; every other tenant leaves nothing; a window of the last 12 months covers ledger entries dated less than 12 whole calendar months before the handling date.
    pay_bundle: A tenant who also holds an active storage unit rental moved into at least the long unit-tenure months before the handling date has the long-bundle deferral left on the next statement, a tenant whose active storage unit rental was moved into more recently has the newer-bundle deferral left on it, and a tenant with no active storage unit rental leaves nothing on that account.
    pay_lock: Where a gate lockout notice has been sent in the current delinquency cycle, the long-lockout deferral is left on the next statement when that notice was sent at least the long-lockout days before the handling date, and the short-lockout deferral when it was sent fewer days before; where no gate lockout notice has been sent in the cycle, nothing is left on that account.
    result: The amount to pay is the balance due plus the share of the next period's rent that is collected, less every deferral that applies, each deferral being left on the next statement rather than collected, rounded to the cent.
  factors:
  - id: next_period_collection
    effect: method
    decides: pay_next
    bindings:
    - pay_next
    ladder:
    - when: the next rent due date is no more than the full-collection days away
      method: the next period's contracted monthly rent is collected in full
    - when: it is more than the full-collection days but no more than the half-collection days away
      method: half of the next period's rent is collected
    - when: otherwise
      method: nothing is collected toward the next period
    baseline:
      pay_next: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: loyal_tenant_deferral
    effect: parameter
    decides: pay_defer
    bindings:
    - pay_defer
    ladder:
    - when: held the agreement at least the long-tenure months and at least the steady-payment count of payments in the last 12 months
      value: K('defer_long')
    - when: held it at least the mid-tenure months but fewer than the long-tenure months and at least the some-payment count of payments
      value: K('defer_mid')
    - when: otherwise
      value: '0'
    baseline:
      pay_defer: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: bundled_tenant_deferral
    effect: parameter
    decides: pay_bundle
    bindings:
    - pay_bundle
    ladder:
    - when: holds an active storage unit rental moved into at least the long unit-tenure months ago
      value: K('defer_long_bundle')
    - when: holds an active storage unit rental moved into more recently
      value: K('defer_newer_bundle')
    - when: otherwise
      value: '0'
    baseline:
      pay_bundle: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: unit
  - id: lockout_deferral
    effect: parameter
    decides: pay_lock
    bindings:
    - pay_lock
    ladder:
    - when: a gate lockout notice sent in the current cycle at least the long-lockout days ago
      value: K('defer_long_lockout')
    - when: a gate lockout notice sent in the current cycle fewer days ago
      value: K('defer_short_lockout')
    - when: otherwise
      value: '0'
    baseline:
      pay_lock: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The standard amount that brings a delinquent agreement current is the balance due on the agreement as it stands on the ledger, with nothing collected toward the next billing period and nothing left for the next statement.
    params: []
  inputs:
    history:
    - table: parking_ledger
      aggregate: latest
      field: period_end
      filters:
        event_type: parking_rent_charge
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_payment
    - table: parking_notices
      aggregate: latest
      field: notice_date
      filters:
        notice_type: gate_lockout
    cross_category:
    - unit
- id: parking_ext_retention_concession
  base_policy_refs:
  - parking_agg_portfolio_increase_review
  - parking_evt_rate_increase
  - parking_evt_retention_concession
  overwrite:
  - base_policy: parking_evt_retention_concession
    superseded_clause: A tenant who calls about a noticed increase may be given a retention_concession that gives back retention_concession_pct_of_increase of the increase, rounded down to the cent, with the same effective date as the increase and its source_rate_change_id pointing at it.
    replaced_by: The concession is worked out by adding the retention share and the bundle share and applying the AutoPay adjustment, giving one total share, applying that total share once to the increase measure, keeping the lower of that amount and the give-back ceiling, taking it off the increased rent, and rounding the result down to the cent, never below the rent before the increase.
  - base_policy: parking_evt_rate_increase
    superseded_clause: Increase notices go only to agreements in active status.
    replaced_by: Increase notices go only to agreements in active status; that standing requirement governs the sending of an increase notice and not the recording of a retention concession on an increase already noticed.
  trigger: on_request
  subject:
  - parking_rate_change_notice
  computes: new_rent
  target_tool: grant_parking_retention_concession_aac1dee9
  params:
    share_loyal: 0.55
    share_settled: 0.52
    late_allow_loyal: 2
    late_allow_settled: 1
    unit_tenure_long: 24
    share_long_bundle: 0.05
    share_newer_bundle: 0.025
    share_clean_autopay: 0.03
    reduce_lapsed_autopay: 0.02
    prior_share: 0.5
    gap_short_months: 18
    gap_long_months: 24
    payments_steady: 10
    payments_some: 6
    cap_steady: 15.0
    cap_regular: 12.0
    cap_std: 8.0
  rule: 'A tenant who calls about a noticed rent increase that is not yet in effect may be given one retention concession that lowers the increased rent, recorded with the same effective date as the increase and pointing at it. A retention concession is recorded only after the agreement''s balance due stands at zero or below. Increase notices go only to agreements in active status; that standing requirement governs the sending of an increase notice and not the recording of a retention concession on an increase already noticed. The standard retention concession gives back the standard retention share of the noticed increase, the noticed increase being the new rent of the most recent rent increase notice less the rent before that increase, and it never gives back more than the standard give-back ceiling. The concession rent is the increased rent less the amount given back, rounded down to the cent, and it is never lower than the rent before the increase. For a retention concession, a window
    of the last 6, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month. The retention share is the loyal-tenant share for a tenant who has held the agreement at least the loyalty tenure and on whose agreement no more than the loyal late-fee allowance of late fees posted in the last 12 months stand without a billing-error correction credit; the settled-tenant share for a tenant who has held it at least the minimum retention tenure but less than the loyalty tenure and stays within the settled late-fee allowance; and the standard retention share for every other tenant. A bundle share is added to the retention share: the long-bundle share for a tenant who also holds an active storage unit rental moved into at least the long unit-tenure months before the handling date, the newer-bundle share for a tenant whose active storage unit rental was moved into more recently, and nothing for
    a tenant with no active storage unit rental. An AutoPay adjustment is applied to the retention share: the clean-AutoPay share is added where the agreement''s AutoPay authorization stands active and none of its drafts was declined for insufficient funds in the last 6 months; the lapsed-AutoPay reduction is taken off where the authorization stands suspended and was suspended in the last 6 months; and nothing changes in every other case. The increase the shares are applied to is the combined increase of every rent increase noticed on the agreement in the last 24 months where the rent last changed less than the close-increase months before the notice date of the most recent increase; the noticed increase plus the prior-increase share of the other increases noticed in the last 24 months where the rent last changed at least the close-increase months but less than 24 whole calendar months before that notice date; and the noticed increase alone in every other case. The give-back ceiling is the
    steady-payer ceiling for an agreement with at least the steady-payment count of payments in the last 12 months, the regular-payer ceiling for one with at least the some-payment count but fewer than the steady-payment count, and the standard give-back ceiling otherwise. The concession is worked out by adding the retention share and the bundle share and applying the AutoPay adjustment, giving one total share, applying that total share once to the increase measure, keeping the lower of that amount and the give-back ceiling, taking it off the increased rent, and rounding the result down to the cent, never below the rent before the increase.'
  prerequisite:
  - problem: parking_ext_bring_current_payment
    kind: state_gate
    gate: parking_rentals.balance_due
    form: state
    policy_source: A retention concession is recorded only after the agreement's balance due stands at zero or below.
    condition: The agreement's balance due is zero or negative.
    resolved_by: pay_parking_past_due_d726500b
    effect: The tenant's payment brings the balance due to zero or below, so the concession may be recorded.
  cross_category:
  - category: unit
    as: branch
    reads:
    - status
    - move_in_date
    note: The storage bundle share is decided from whether the tenant holds an active storage unit rental and how long ago it was moved into.
  - category: autopay
    as: history
    reads:
    - status
    - suspension_date
    - autopay_drafts.result
    - autopay_drafts.draft_date
    note: The AutoPay adjustment is decided from the agreement's AutoPay authorization status, its suspension date and its declined drafts in the last 6 months.
  compute:
  - con_share: K('share_loyal') if MONTHS(F('start_date'), NOW) >= P('loyalty_tenure_months') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') - COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_credit', credit_type='billing_error_correction') <= K('late_allow_loyal') else (K('share_settled') if MONTHS(F('start_date'), NOW) >= P('retention_min_tenure_months') and MONTHS(F('start_date'), NOW) < P('loyalty_tenure_months') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') - COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_credit', credit_type='billing_error_correction') <= K('late_allow_settled') else P('retention_concession_pct_of_increase'))
  - con_bundle: K('share_long_bundle') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) >= K('unit_tenure_long') else (K('share_newer_bundle') if CFIELD('unit', 'move_in_date', status='active') != None and MONTHS(CFIELD('unit', 'move_in_date', status='active'), NOW) < K('unit_tenure_long') else 0)
  - con_autopay: K('share_clean_autopay') if XCOUNT('autopay', 'autopay_drafts', within_months=6, date_field='draft_date', agreement_id=HID, result='declined_insufficient_funds') == 0 and CFIELD('autopay', 'status', agreement_id=HID) == 'active' else (0 - K('reduce_lapsed_autopay') if CFIELD('autopay', 'status', agreement_id=HID) == 'suspended' and MONTHS(CFIELD('autopay', 'suspension_date', agreement_id=HID), NOW) < 6 else 0)
  - con_measure: (SUM('parking_rate_changes', 'new_rent', within_months=24, date_field='notice_date', change_reason='existing_customer_rate_increase') - SUM('parking_rate_changes', 'previous_rent', within_months=24, date_field='notice_date', change_reason='existing_customer_rate_increase')) if MONTHS(F('last_rate_change_date'), LATEST('parking_rate_changes', 'notice_date', date_field='notice_date', change_reason='existing_customer_rate_increase')) < K('gap_short_months') else ((LATEST('parking_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase') - LATEST('parking_rate_changes', 'previous_rent', date_field='notice_date', change_reason='existing_customer_rate_increase')) + (SUM('parking_rate_changes', 'new_rent', within_months=24, date_field='notice_date', change_reason='existing_customer_rate_increase') - SUM('parking_rate_changes', 'previous_rent', within_months=24, date_field='notice_date', change_reason='existing_customer_rate_increase')
      - (LATEST('parking_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase') - LATEST('parking_rate_changes', 'previous_rent', date_field='notice_date', change_reason='existing_customer_rate_increase'))) * K('prior_share') if MONTHS(F('last_rate_change_date'), LATEST('parking_rate_changes', 'notice_date', date_field='notice_date', change_reason='existing_customer_rate_increase')) < K('gap_long_months') else (LATEST('parking_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase') - LATEST('parking_rate_changes', 'previous_rent', date_field='notice_date', change_reason='existing_customer_rate_increase')))
  - con_cap: K('cap_steady') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_steady') else (K('cap_regular') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('payments_some') else K('cap_std'))
  - con_new: LATEST('parking_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase')
  - con_prev: LATEST('parking_rate_changes', 'previous_rent', date_field='notice_date', change_reason='existing_customer_rate_increase')
  - give_back: MN(con_cap, (con_share + con_bundle + con_autopay) * con_measure)
  - result: int(round(MX(con_prev, con_new - give_back) * 100, 6)) / 100
  compute_basis:
    con_share: The retention share is the loyal-tenant share for a tenant who has held the agreement at least the loyalty tenure and on whose agreement no more than the loyal late-fee allowance of late fees posted in the last 12 months stand without a billing-error correction credit; the settled-tenant share for a tenant who has held it at least the minimum retention tenure but less than the loyalty tenure and stays within the settled late-fee allowance; and the standard retention share for every other tenant. For a retention concession, a window of the last 6, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    con_bundle: 'A bundle share is added to the retention share: the long-bundle share for a tenant who also holds an active storage unit rental moved into at least the long unit-tenure months before the handling date, the newer-bundle share for a tenant whose active storage unit rental was moved into more recently, and nothing for a tenant with no active storage unit rental.'
    con_autopay: 'An AutoPay adjustment is applied to the retention share: the clean-AutoPay share is added where the agreement''s AutoPay authorization stands active and none of its drafts was declined for insufficient funds in the last 6 months; the lapsed-AutoPay reduction is taken off where the authorization stands suspended and was suspended in the last 6 months; and nothing changes in every other case. For a retention concession, a window of the last 6, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.'
    con_measure: The increase the shares are applied to is the combined increase of every rent increase noticed on the agreement in the last 24 months where the rent last changed less than the close-increase months before the notice date of the most recent increase; the noticed increase plus the prior-increase share of the other increases noticed in the last 24 months where the rent last changed at least the close-increase months but less than 24 whole calendar months before that notice date; and the noticed increase alone in every other case. For a retention concession, a window of the last 6, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    con_cap: The give-back ceiling is the steady-payer ceiling for an agreement with at least the steady-payment count of payments in the last 12 months, the regular-payer ceiling for one with at least the some-payment count but fewer than the steady-payment count, and the standard give-back ceiling otherwise. For a retention concession, a window of the last 6, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    con_new: The standard retention concession gives back the standard retention share of the noticed increase, the noticed increase being the new rent of the most recent rent increase notice less the rent before that increase, and it never gives back more than the standard give-back ceiling.
    con_prev: The standard retention concession gives back the standard retention share of the noticed increase, the noticed increase being the new rent of the most recent rent increase notice less the rent before that increase, and it never gives back more than the standard give-back ceiling.
    give_back: The concession is worked out by adding the retention share and the bundle share and applying the AutoPay adjustment, giving one total share, applying that total share once to the increase measure, keeping the lower of that amount and the give-back ceiling, taking it off the increased rent, and rounding the result down to the cent, never below the rent before the increase.
    result: The concession is worked out by adding the retention share and the bundle share and applying the AutoPay adjustment, giving one total share, applying that total share once to the increase measure, keeping the lower of that amount and the give-back ceiling, taking it off the increased rent, and rounding the result down to the cent, never below the rent before the increase. The concession rent is the increased rent less the amount given back, rounded down to the cent, and it is never lower than the rent before the increase.
  factors:
  - id: tenure_and_record_share
    effect: parameter
    decides: con_share
    bindings:
    - con_share
    ladder:
    - when: held the agreement at least the loyalty tenure and no more than the loyal late-fee allowance of uncorrected late fees in the last 12 months
      value: K('share_loyal')
    - when: held it at least the minimum retention tenure but less than the loyalty tenure and within the settled late-fee allowance
      value: K('share_settled')
    - when: otherwise
      value: P('retention_concession_pct_of_increase')
    baseline:
      con_share: P('retention_concession_pct_of_increase')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: storage_bundle_share
    effect: parameter
    decides: con_bundle
    bindings:
    - con_bundle
    ladder:
    - when: holds an active storage unit rental moved into at least the long unit-tenure months ago
      value: K('share_long_bundle')
    - when: holds an active storage unit rental moved into more recently
      value: K('share_newer_bundle')
    - when: otherwise
      value: '0'
    baseline:
      con_bundle: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: unit
  - id: autopay_record_adjustment
    effect: parameter
    decides: con_autopay
    bindings:
    - con_autopay
    ladder:
    - when: the agreement's AutoPay authorization is active and no draft was declined for insufficient funds in the last 6 months
      value: K('share_clean_autopay')
    - when: the authorization is suspended and was suspended in the last 6 months
      value: 0 - K('reduce_lapsed_autopay')
    - when: otherwise
      value: '0'
    baseline:
      con_autopay: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autopay
  - id: cumulative_increase_measure
    effect: method
    decides: con_measure
    bindings:
    - con_measure
    ladder:
    - when: the rent last changed less than the close-increase months before the notice date of the most recent increase
      method: the shares apply to the combined increase of every increase noticed in the last 24 months
    - when: it last changed at least the close-increase months but less than 24 months before that notice date
      method: the shares apply to the noticed increase plus the prior-increase share of the other increases noticed in the last 24 months
    - when: otherwise
      method: the shares apply to the noticed increase alone
    baseline:
      con_measure: LATEST('parking_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase') - LATEST('parking_rate_changes', 'previous_rent', date_field='notice_date', change_reason='existing_customer_rate_increase')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: give_back_ceiling
    effect: parameter
    decides: con_cap
    bindings:
    - con_cap
    ladder:
    - when: at least the steady-payment count of payments in the last 12 months
      value: K('cap_steady')
    - when: at least the some-payment count but fewer than the steady-payment count
      value: K('cap_regular')
    - when: otherwise
      value: K('cap_std')
    baseline:
      con_cap: K('cap_std')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The standard retention concession gives back the standard retention share of the noticed increase, the noticed increase being the new rent of the most recent rent increase notice less the rent before that increase, and it never gives back more than the standard give-back ceiling. The concession rent is the increased rent less the amount given back, rounded down to the cent, and it is never lower than the rent before the increase.
    params:
    - retention_concession_pct_of_increase
    - cap_std
  inputs:
    history:
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_fee_charge
        fee_type: late_fee
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_credit
        credit_type: billing_error_correction
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_payment
    - table: parking_rate_changes
      aggregate: sum
      field: new_rent
      within_months: 24
      filters:
        change_reason: existing_customer_rate_increase
    - category: autopay
      table: autopay_drafts
      aggregate: count
      field: autopay_draft_id
      within_months: 6
      filters:
        result: declined_insufficient_funds
    cross_category:
    - unit
    - autopay
- id: parking_ext_tow_notice_fee
  base_policy_refs:
  - parking_evt_late_fee_and_waiver
  - parking_evt_tow_process
  overwrite:
  - base_policy: parking_evt_tow_process
    superseded_clause: posts tow_notice_fee_usd
    replaced_by: The tow notice fee is the fee level multiplied by the multiplier that applies, less the tenure relief and the AutoPay relief, never below zero, rounded to the cent.
  trigger: state_due
  subject:
  - parking_fee_charge
  computes: amount
  target_tool: post_parking_tow_notice_fee_6c1b851a
  params:
    level_repeat: 65.0
    level_second: 55.0
    mult_three: 1.5
    mult_two: 1.25
    relief_tenure: 24
    relief_payments: 8
    short_tenure: 12
    short_payments: 4
    relief_long: 6.0
    relief_short: 3.0
    relief_expired_card: 5.0
    relief_suspended: 2.0
  rule: 'When a notice of intent to tow is sent on a parking agreement, a tow notice fee is posted against the oldest unpaid rent charge of the delinquency cycle the notice was sent for. The standard tow notice fee is the tow notice fee of the space class, charged once for the notice. For the tow notice fee, a window of the last 3, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month. The fee level is the repeat-notice level where two or more other notices of intent to tow were sent on the agreement in the last 24 months, the second-notice level where exactly one other was, and the tow notice fee of the space class where none was. The fee level is multiplied by the three-period multiplier where the rent charges posted on the agreement in the last 3 months outnumber its payments in that time by three or more, by the two-period multiplier where they outnumber them by exactly two,
    and is charged as it stands otherwise. A tenure relief is taken off the fee: the long relief for a tenant who has held the agreement at least the relief-tenure months and made at least the relief-payment count of payments on it in the last 12 months, the short relief for a tenant who has held it at least the short-tenure months but fewer than the relief-tenure months and made at least the short-payment count of payments in that time, and nothing for every other tenant. An AutoPay relief is taken off the fee: the expired-card relief where the agreement''s AutoPay authorization stands suspended and one or more of its drafts was declined for an expired card in the last 3 months, the suspended relief where it stands suspended with no such decline in that time, and nothing where it is not suspended. The tow notice fee is the fee level multiplied by the multiplier that applies, less the tenure relief and the AutoPay relief, never below zero, rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: autopay
    as: history
    reads:
    - status
    - autopay_drafts.result
    - autopay_drafts.draft_date
    note: The AutoPay relief is decided from the authorization's suspension and its expired-card declines in the last 3 months.
  compute:
  - tf_level: K('level_repeat') if COUNT('parking_notices', within_months=24, date_field='notice_date', notice_type='intent_to_tow') - 1 >= 2 else (K('level_second') if COUNT('parking_notices', within_months=24, date_field='notice_date', notice_type='intent_to_tow') - 1 == 1 else P('tow_notice_fee_usd'))
  - tf_mult: K('mult_three') if COUNT('parking_ledger', within_months=3, date_field='entry_date', event_type='parking_rent_charge') - COUNT('parking_ledger', within_months=3, date_field='entry_date', event_type='parking_payment') >= 3 else (K('mult_two') if COUNT('parking_ledger', within_months=3, date_field='entry_date', event_type='parking_rent_charge') - COUNT('parking_ledger', within_months=3, date_field='entry_date', event_type='parking_payment') == 2 else 1)
  - tf_tenure: K('relief_long') if MONTHS(F('start_date'), NOW) >= K('relief_tenure') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('relief_payments') else (K('relief_short') if MONTHS(F('start_date'), NOW) >= K('short_tenure') and MONTHS(F('start_date'), NOW) < K('relief_tenure') and COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_payment') >= K('short_payments') else 0)
  - tf_autopay: K('relief_expired_card') if CFIELD('autopay', 'status', agreement_id=HID) == 'suspended' and XCOUNT('autopay', 'autopay_drafts', within_months=3, date_field='draft_date', agreement_id=HID, result='declined_expired_card') >= 1 else (K('relief_suspended') if CFIELD('autopay', 'status', agreement_id=HID) == 'suspended' and XCOUNT('autopay', 'autopay_drafts', within_months=3, date_field='draft_date', agreement_id=HID, result='declined_expired_card') == 0 else 0)
  - result: RND(MX(0, tf_level * tf_mult - tf_tenure - tf_autopay), 2)
  compute_basis:
    tf_level: The fee level is the repeat-notice level where two or more other notices of intent to tow were sent on the agreement in the last 24 months, the second-notice level where exactly one other was, and the tow notice fee of the space class where none was. For the tow notice fee, a window of the last 3, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    tf_mult: The fee level is multiplied by the three-period multiplier where the rent charges posted on the agreement in the last 3 months outnumber its payments in that time by three or more, by the two-period multiplier where they outnumber them by exactly two, and is charged as it stands otherwise. For the tow notice fee, a window of the last 3, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.
    tf_tenure: 'A tenure relief is taken off the fee: the long relief for a tenant who has held the agreement at least the relief-tenure months and made at least the relief-payment count of payments on it in the last 12 months, the short relief for a tenant who has held it at least the short-tenure months but fewer than the relief-tenure months and made at least the short-payment count of payments in that time, and nothing for every other tenant. For the tow notice fee, a window of the last 3, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.'
    tf_autopay: 'An AutoPay relief is taken off the fee: the expired-card relief where the agreement''s AutoPay authorization stands suspended and one or more of its drafts was declined for an expired card in the last 3 months, the suspended relief where it stands suspended with no such decline in that time, and nothing where it is not suspended. For the tow notice fee, a window of the last 3, 12 or 24 months covers entries dated less than that many whole calendar months before the handling date, whole months being counted to the same day of the later month.'
    result: The tow notice fee is the fee level multiplied by the multiplier that applies, less the tenure relief and the AutoPay relief, never below zero, rounded to the cent. The standard tow notice fee is the tow notice fee of the space class, charged once for the notice.
  factors:
  - id: repeat_notice_level
    effect: parameter
    decides: tf_level
    bindings:
    - tf_level
    ladder:
    - when: two or more other notices of intent to tow in the last 24 months
      value: K('level_repeat')
    - when: exactly one other notice of intent to tow in the last 24 months
      value: K('level_second')
    - when: otherwise
      value: P('tow_notice_fee_usd')
    baseline:
      tf_level: P('tow_notice_fee_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: unpaid_period_multiplier
    effect: method
    decides: tf_mult
    bindings:
    - tf_mult
    ladder:
    - when: rent charges in the last 3 months outnumber payments by three or more
      method: the fee level is multiplied by the three-period multiplier
    - when: they outnumber payments by exactly two
      method: the fee level is multiplied by the two-period multiplier
    - when: otherwise
      method: the fee level is charged as it stands
    baseline:
      tf_mult: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_relief
    effect: parameter
    decides: tf_tenure
    bindings:
    - tf_tenure
    ladder:
    - when: held the agreement at least the relief-tenure months and at least the relief-payment count of payments in the last 12 months
      value: K('relief_long')
    - when: held it at least the short-tenure months but fewer than the relief-tenure months and at least the short-payment count of payments
      value: K('relief_short')
    - when: otherwise
      value: '0'
    baseline:
      tf_tenure: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: autopay_lapse_relief
    effect: parameter
    decides: tf_autopay
    bindings:
    - tf_autopay
    ladder:
    - when: the AutoPay authorization is suspended and a draft was declined for an expired card in the last 3 months
      value: K('relief_expired_card')
    - when: it is suspended with no expired-card decline in the last 3 months
      value: K('relief_suspended')
    - when: otherwise
      value: '0'
    baseline:
      tf_autopay: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autopay
  baseline:
    rule: The standard tow notice fee is the tow notice fee of the space class, charged once for the notice.
    params:
    - tow_notice_fee_usd
  inputs:
    history:
    - table: parking_notices
      aggregate: count
      field: parking_notice_id
      within_months: 24
      filters:
        notice_type: intent_to_tow
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 3
      filters:
        event_type: parking_rent_charge
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_payment
    - category: autopay
      table: autopay_drafts
      aggregate: count
      field: autopay_draft_id
      within_months: 3
      filters:
        result: declined_expired_card
    cross_category:
    - autopay
- id: parking_ext_tow_redemption_payment
  base_policy_refs:
  - parking_agg_portfolio_increase_review
  - parking_evt_tow_process
  overwrite:
  - base_policy: parking_evt_tow_process
    superseded_clause: after the tow notice only a payment of the full balance is accepted, and it returns the agreement to active and restores the gate code.
    replaced_by: While a notice of intent to tow stands on a parking agreement, only a payment of the full redemption amount from the tenant's own funds is accepted, and it returns the agreement to active standing and restores the gate code.
  trigger: on_request
  subject:
  - parking_payment
  computes: amount
  target_tool: pay_parking_tow_redemption_54345a56
  params:
    full_collection_days: 7
    half_collection_days: 14
    half_share: 0.5
    deposit_repeat: 40.0
    deposit_two: 20.0
    near_tow_days: 7
    far_tow_days: 14
    charge_near_tow: 35.0
    charge_far_tow: 15.0
    long_lapse_days: 30
    advance_long: 15.0
    advance_short: 7.5
  rule: 'While a notice of intent to tow stands on a parking agreement, only a payment of the full redemption amount from the tenant''s own funds is accepted, and it returns the agreement to active standing and restores the gate code. The redemption amount after a notice of intent to tow is fixed only after a tow notice fee stands on the ledger for the delinquency cycle the notice was sent for. The standard redemption amount is the balance due on the agreement as it stands on the ledger. The next rent due date is the day after the last day of the most recently charged billing period; where that date is no more than the full-collection days away from the handling date, the redemption also collects the next period''s contracted monthly rent in full, where it is more than the full-collection days but no more than the half-collection days away it collects half of that rent, and where it is further away it collects nothing toward the next period. A redemption deposit is added and held as a credit
    on the agreement: the repeat-lateness deposit where three or more late fees were posted on the agreement in the last 12 months, the two-fee deposit where exactly two were, and nothing where fewer were; a window of the last 12 months covers ledger entries dated less than 12 whole calendar months before the handling date. The earliest tow date is the date of the notice of intent to tow of the current delinquency cycle plus the tow wait days of the space class; a tow dispatch cancellation hold is added and held as a credit on the agreement: the near-tow hold where that date is no more than the near-tow days away from the handling date, the far-tow hold where it is more than the near-tow days but no more than the far-tow days away, and nothing where it is further away. An AutoPay advance is added and held as a credit where the agreement''s AutoPay authorization stands suspended: the long-lapse advance when it was suspended at least the long-lapse days before the handling date, the short-lapse
    advance when it was suspended more recently, and nothing when it is not suspended. The redemption amount is the balance due plus the share of the next period''s rent that is collected, plus the redemption deposit, the tow dispatch cancellation hold and the AutoPay advance, rounded to the cent.'
  prerequisite:
  - problem: parking_ext_tow_notice_fee
    kind: value_input
    gate: pt_balance
    form: state
    policy_source: The redemption amount after a notice of intent to tow is fixed only after a tow notice fee stands on the ledger for the delinquency cycle the notice was sent for.
    condition: A tow notice fee entry stands on the ledger for the delinquency cycle of the standing notice of intent to tow.
    resolved_by: post_parking_tow_notice_fee_6c1b851a
    effect: The posted tow notice fee raises the balance due the redemption amount is worked out from by the amount of that fee.
  cross_category:
  - category: autopay
    as: branch
    reads:
    - status
    - suspension_date
    note: The AutoPay advance is decided from whether the agreement's AutoPay authorization is suspended and since when.
  compute:
  - pt_balance: F('balance_due')
  - pt_next: 1 if (DAYS(NOW, LATEST('parking_ledger', 'period_end', date_field='entry_date', event_type='parking_rent_charge')) + 1) <= K('full_collection_days') else (K('half_share') if (DAYS(NOW, LATEST('parking_ledger', 'period_end', date_field='entry_date', event_type='parking_rent_charge')) + 1) <= K('half_collection_days') else 0)
  - pt_deposit: K('deposit_repeat') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') >= 3 else (K('deposit_two') if COUNT('parking_ledger', within_months=12, date_field='entry_date', event_type='parking_fee_charge', fee_type='late_fee') == 2 else 0)
  - pt_dispatch: K('charge_near_tow') if P('tow_min_days_after_notice') - DAYS(LATEST('parking_notices', 'notice_date', date_field='notice_date', notice_type='intent_to_tow', cycle_anchor_date=F('delinquent_since')), NOW) <= K('near_tow_days') else (K('charge_far_tow') if P('tow_min_days_after_notice') - DAYS(LATEST('parking_notices', 'notice_date', date_field='notice_date', notice_type='intent_to_tow', cycle_anchor_date=F('delinquent_since')), NOW) <= K('far_tow_days') else 0)
  - pt_autopay: K('advance_long') if CFIELD('autopay', 'status', agreement_id=HID) == 'suspended' and DAYS(CFIELD('autopay', 'suspension_date', agreement_id=HID), NOW) >= K('long_lapse_days') else (K('advance_short') if CFIELD('autopay', 'status', agreement_id=HID) == 'suspended' and DAYS(CFIELD('autopay', 'suspension_date', agreement_id=HID), NOW) < K('long_lapse_days') else 0)
  - result: RND(pt_balance + pt_next * F('monthly_rent') + pt_deposit + pt_dispatch + pt_autopay, 2)
  compute_basis:
    pt_balance: The standard redemption amount is the balance due on the agreement as it stands on the ledger.
    pt_next: The next rent due date is the day after the last day of the most recently charged billing period; where that date is no more than the full-collection days away from the handling date, the redemption also collects the next period's contracted monthly rent in full, where it is more than the full-collection days but no more than the half-collection days away it collects half of that rent, and where it is further away it collects nothing toward the next period.
    pt_deposit: 'A redemption deposit is added and held as a credit on the agreement: the repeat-lateness deposit where three or more late fees were posted on the agreement in the last 12 months, the two-fee deposit where exactly two were, and nothing where fewer were; a window of the last 12 months covers ledger entries dated less than 12 whole calendar months before the handling date.'
    pt_dispatch: 'The earliest tow date is the date of the notice of intent to tow of the current delinquency cycle plus the tow wait days of the space class; a tow dispatch cancellation hold is added and held as a credit on the agreement: the near-tow hold where that date is no more than the near-tow days away from the handling date, the far-tow hold where it is more than the near-tow days but no more than the far-tow days away, and nothing where it is further away.'
    pt_autopay: 'An AutoPay advance is added and held as a credit where the agreement''s AutoPay authorization stands suspended: the long-lapse advance when it was suspended at least the long-lapse days before the handling date, the short-lapse advance when it was suspended more recently, and nothing when it is not suspended.'
    result: The redemption amount is the balance due plus the share of the next period's rent that is collected, plus the redemption deposit, the tow dispatch cancellation hold and the AutoPay advance, rounded to the cent.
  factors:
  - id: redemption_next_period
    effect: method
    decides: pt_next
    bindings:
    - pt_next
    ladder:
    - when: the next rent due date is no more than the full-collection days away
      method: the next period's contracted monthly rent is collected in full
    - when: it is more than the full-collection days but no more than the half-collection days away
      method: half of the next period's rent is collected
    - when: otherwise
      method: nothing is collected toward the next period
    baseline:
      pt_next: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: redemption_deposit
    effect: parameter
    decides: pt_deposit
    bindings:
    - pt_deposit
    ladder:
    - when: three or more late fees in the last 12 months
      value: K('deposit_repeat')
    - when: exactly two late fees in the last 12 months
      value: K('deposit_two')
    - when: otherwise
      value: '0'
    baseline:
      pt_deposit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: tow_dispatch_cancellation
    effect: parameter
    decides: pt_dispatch
    bindings:
    - pt_dispatch
    ladder:
    - when: the earliest tow date is no more than the near-tow days away
      value: K('charge_near_tow')
    - when: the earliest tow date is more than the near-tow days but no more than the far-tow days away
      value: K('charge_far_tow')
    - when: otherwise
      value: '0'
    baseline:
      pt_dispatch: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: autopay_lapse_advance
    effect: parameter
    decides: pt_autopay
    bindings:
    - pt_autopay
    ladder:
    - when: the AutoPay authorization is suspended and was suspended at least the long-lapse days ago
      value: K('advance_long')
    - when: it is suspended and was suspended more recently
      value: K('advance_short')
    - when: otherwise
      value: '0'
    baseline:
      pt_autopay: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: autopay
  baseline:
    rule: The standard redemption amount is the balance due on the agreement as it stands on the ledger.
    params: []
  inputs:
    history:
    - table: parking_ledger
      aggregate: latest
      field: period_end
      filters:
        event_type: parking_rent_charge
    - table: parking_ledger
      aggregate: count
      field: parking_entry_id
      within_months: 12
      filters:
        event_type: parking_fee_charge
        fee_type: late_fee
    - table: parking_notices
