      redemption_requires_full_balance: true
      sale_surplus_hold_days: 365
      rate_increase_first_eligible_months: 12
      rate_increase_min_interval_months: 12
      rate_increase_max_pct: 0.07
      rate_increase_notice_days: 60
      retention_concession_pct_of_increase: 0.5
      retention_concessions_per_12_months: 1
      retention_request_window_days: 60
      transfer_fee_usd: 0.0
      transfers_per_12_months: 2
      transfer_rent_basis: "target_unit_street_rate"
      transfer_overlap_days: 5
      transfer_resets_rate_clock: true
      moveout_notice_days: 30
      moveout_prorated_refund: true
      cleaning_fee_usd: 95.0
      lock_left_removal_fee_usd: 25.0
      deposit_refund_days: 30
      credit_balance_refund_days: 21
      temperature_range_f: "55-60"
      humidity_control: "60_to_70_pct_rh"
      door_alarm_included: true
      access_hours: "24_hours"
      drive_up_access: false
      min_protection_coverage_usd: 10000
      own_insurance_proof_accepted: true

events:
  - type: unit_reservation
    target: unit_rentals
    mutation: create
    meaning: "A customer reserves a specific available unit at a facility ahead of move-in."
    grain: "One rental agreement record per reserved unit."
    fields:
      customer_id: "The customer making the reservation."
      variant_name: "Unit class of the reserved unit, official full name."
      facility_code: "Facility where the unit is located."
      unit_number: "Unit number as posted at the facility."
      unit_size: "Unit dimensions in feet."
      monthly_rent: "Contracted monthly rent before discounts, set from the unit's posted street rate on the reservation date."
      reservation_date: "Date the reservation is made."
      promo_code: "Move-in promotion attached to the reservation."
      military_discount_applied: "Whether the military discount applies to this agreement."
    triggers: []
  - type: unit_reservation_cancelled
    target: unit_rentals
    mutation: {transition: {from: reserved, to: reservation_cancelled}}
    meaning: "An unclaimed reservation is cancelled by the customer or lapses at the end of its hold."
    grain: "One transition per reservation."
    fields:
      status: "Set to reservation_cancelled."
    triggers: []
  - type: unit_move_in
    target: unit_rentals
    mutation: {transition: {from: reserved, to: active}}
    meaning: "The tenant signs the rental agreement and takes possession of the reserved unit."
    grain: "One transition per rental agreement."
    fields:
      move_in_date: "Date the agreement is signed and possession begins; also the first rent due date."
      billing_day: "Day of month rent falls due, taken from the move-in date."
      coverage_source: "How the tenant meets the contents coverage requirement at move-in."
      lock_status: "Set to tenant_lock once the tenant's lock is on the unit."
      deposit_held: "Security deposit collected at move-in for the unit class (0.00 where the class carries none)."
    triggers:
      - event: unit:unit_rent_charge
        map: {}
      - event: unit:unit_fee_charge
        map: {fee_type: admin_fee}
      - event: unit:unit_deposit_collected
        when: {deposit_held: {not: 0}}
        map: {}
  - type: unit_rent_charge
    target: unit_ledger
    meaning: "Rent for one billing period is posted to the tenant ledger on its due date."
    grain: "One row per rental agreement per billing period."
    distinguish_by: [period_start]
    fields:
      amount: "Rent posted for the period after any discount, USD."
      entry_date: "Date the charge is posted (the period's due date)."
      period_start: "First day of the billing period, which is the rent due date."
      period_end: "Last day of the billing period."
    account: rent_balance
    direction: in
    triggers: []
  - type: unit_fee_charge
    target: unit_ledger
    meaning: "A fee is posted to the tenant ledger (administrative, late, lien-process, returned payment, transfer or move-out fee)."
    grain: "One row per fee type per billing period per source charge or payment."
    distinguish_by: [fee_type, period_start, reference_entry_id]
    fields:
      fee_type: "Kind of fee posted."
      amount: "Fee amount, USD."
      entry_date: "Date the fee is posted."
      period_start: "Due date of the billing period the fee relates to (the move-in date for the administrative fee)."
      reference_entry_id: "Ledger entry the fee arises from: the unpaid rent charge for late fees, the returned payment for a returned-payment fee; empty otherwise."
    account: rent_balance
    direction: in
    triggers: []
  - type: unit_payment
    target: unit_ledger
    meaning: "A tenant payment is received and applied to the rental agreement."
    grain: "One row per payment received."
    distinguish_by: [entry_date, amount, payment_method, payment_channel, autopay_draft_id]
    fields:
      amount: "Amount paid, USD."
      entry_date: "Date the payment is received."
      payment_method: "Method used to pay."
      payment_channel: "Where the payment was taken."
      autopay_draft_id: "AutoPay draft that produced the payment; empty for one-time payments."
    account: rent_balance
    direction: out
    triggers: []
  - type: unit_payment_reversal
    target: unit_ledger
    meaning: "A previously applied payment is returned by the bank or charged back, re-opening the amount it paid."
    grain: "One row per reversed payment."
    distinguish_by: [reference_entry_id]
    fields:
      reference_entry_id: "The payment entry being reversed."
      amount: "Amount reversed, USD (equal to the reversed payment)."
      entry_date: "Date the return or chargeback is posted."
      reversal_reason: "Why the payment was reversed."
    account: rent_balance
    direction: in
    triggers:
      - event: unit:unit_fee_charge
        when: {reversal_reason: [ach_return_insufficient_funds, ach_return_account_closed]}
        map: {fee_type: returned_payment_fee, reference_entry_id: reference_entry_id}
  - type: unit_credit
    target: unit_ledger
    meaning: "A credit reduces what the tenant owes: a courtesy late-fee waiver, a billing-error correction, a prorated move-out credit or an applied deposit."
    grain: "One row per credit type per source entry."
    distinguish_by: [credit_type, reference_entry_id]
    fields:
      credit_type: "Kind of credit."
      amount: "Credit amount, USD."
      entry_date: "Date the credit is posted."
      reference_entry_id: "Ledger entry the credit is applied against: the waived or corrected charge, the final rent charge for a prorated credit, or the deposit release."
    account: rent_balance
    direction: out
    triggers: []
  - type: unit_sale_proceeds_applied
    target: unit_ledger
    meaning: "Net lien-sale proceeds are applied against the balance of a rental sold at lien sale."
    grain: "One row per lien sale."
    distinguish_by: [entry_date]
    fields:
      amount: "Proceeds applied to the balance, USD (any surplus is held, not applied)."
      entry_date: "Date of the lien sale."
    account: rent_balance
    direction: out
    triggers: []
  - type: unit_refund
    target: unit_ledger
    meaning: "A credit balance on a closed rental is refunded to the former tenant."
    grain: "One row per refund issued."
    distinguish_by: [entry_date, refund_method]
    fields:
      amount: "Amount refunded, USD."
      entry_date: "Date the refund is issued."
      refund_method: "How the refund is paid."
    account: rent_balance
    direction: in
    triggers: []
  - type: unit_deposit_collected
    target: unit_ledger
    meaning: "The security deposit for the unit class is collected at move-in."
    grain: "One row per rental agreement."
    distinguish_by: [entry_date]
    fields:
      amount: "Deposit collected, USD."
      entry_date: "Date collected (the move-in date)."
    account: security_deposit
    direction: in
    triggers: []
  - type: unit_deposit_released
    target: unit_ledger
    meaning: "The held security deposit is released after move-out, applied to any balance owed and the rest returned to the tenant."
    grain: "One row per release type per release date."
    distinguish_by: [release_type, entry_date]
    fields:
      release_type: "Whether this portion is applied to the balance or refunded to the tenant."
      amount: "Portion of the deposit released this way, USD."
      entry_date: "Date released."
    account: security_deposit
    direction: out
    triggers:
      - event: unit:unit_credit
        when: {release_type: applied_to_balance}
        map: {credit_type: deposit_application}
  - type: unit_delinquency_onset
    target: unit_rentals
    mutation: {transition: {from: active, to: delinquent}}
    meaning: "Rent for a billing period remains unpaid when its grace period ends and the rental becomes delinquent."
    grain: "One transition per delinquency cycle."
    fields:
      delinquent_since: "Due date of the oldest unpaid billing period, which anchors the lien schedule."
    triggers:
      - event: unit:unit_fee_charge
        map: {fee_type: late_fee}
  - type: unit_lien_step
    target: unit_lien_actions
    meaning: "A step of the delinquency and lien process is taken on a rental: overlock, preliminary letter, lien notice, sale advertisement, lock cut, hold or overlock removal."
    grain: "One row per lien step per delinquency cycle."
    distinguish_by: [lien_step, delinquency_anchor_date]
    fields:
      lien_step: "The step taken."
      action_date: "Date the step is taken."
      delinquency_anchor_date: "Due date of the oldest unpaid billing period of this delinquency cycle."
      notice_method: "How the notice for this step is delivered (none for physical steps)."
      scheduled_sale_date: "Lien sale date set by an advertisement step; empty otherwise."
      hold_reason: "Reason a lien hold is placed or released; none for other steps."
    triggers:
      - event: unit:unit_fee_charge
        when: {lien_step: overlock_applied}
        map: {fee_type: overlock_fee}
      - event: unit:unit_lock_status_update
        when: {lien_step: overlock_applied}
        map: {lock_status: company_overlock}
      - event: unit:unit_fee_charge
        when: {lien_step: lien_notice_sent}
        map: {fee_type: lien_notice_fee}
      - event: unit:unit_lien_stage_advance
        when: {lien_step: lien_notice_sent}
        map: {}
      - event: unit:unit_fee_charge
        when: {lien_step: sale_advertised}
        map: {fee_type: auction_advertisement_fee}
      - event: unit:unit_lien_stage_advance
        when: {lien_step: sale_advertised}
        map: {}
      - event: unit:unit_fee_charge
        when: {lien_step: lock_cut_for_inventory}
        map: {fee_type: lock_cut_fee}
      - event: unit:unit_lock_status_update
        when: {lien_step: lock_cut_for_inventory}
        map: {lock_status: lock_cut}
      - event: unit:unit_lock_status_update
        when: {lien_step: overlock_removed}
        map: {lock_status: tenant_lock}
  - type: unit_lien_stage_advance
    target: unit_rentals
    mutation: {transition: [{from: delinquent, to: lien_noticed}, {from: lien_noticed, to: auction_scheduled}]}
    meaning: "The rental moves to the next lien stage when the lien notice is sent or the sale is advertised."
    grain: "One transition per lien stage per delinquency cycle."
    fields:
      status: "Set to lien_noticed or auction_scheduled."
    triggers: []
  - type: unit_redemption
    target: unit_rentals
    mutation: {transition: [{from: delinquent, to: active}, {from: lien_noticed, to: active}, {from: auction_scheduled, to: active}]}
    meaning: "The past-due balance is paid off and the rental returns to good standing."
    grain: "One transition per delinquency cycle."
    fields:
      delinquent_since: "Cleared to empty once the rental is current."
    triggers: []
  - type: unit_lien_sale
    target: unit_rentals
    mutation: {transition: {from: auction_scheduled, to: sold_at_lien_sale}}
    meaning: "The contents are sold at the advertised lien sale and the agreement ends."
    grain: "One transition per rental agreement."
    fields:
      move_out_date: "Date of the lien sale, which ends the agreement."
    triggers:
      - event: unit:unit_sale_proceeds_applied
        map: {}
  - type: unit_rate_change_notice
    target: unit_rate_changes
    meaning: "A change to the monthly rent is noticed to the tenant: an existing-customer rate increase, a retention concession that reduces it, or a rescission."
    grain: "One row per rent change per effective date."
    distinguish_by: [change_reason, effective_date]
    fields:
      change_reason: "Why the rent changes."
      previous_rent: "Monthly rent before the change, USD."
      new_rent: "Monthly rent after the change, USD."
      notice_date: "Date the notice is sent or the concession is granted."
      effective_date: "Billing due date from which the new rent applies."
      source_rate_change_id: "For a concession or rescission, the rate increase notice it modifies; empty for an increase."
    triggers: []
  - type: unit_rent_rate_update
    target: unit_rentals
    mutation: update
    meaning: "The contracted monthly rent on the agreement is changed to the noticed new rent on its effective date."
    grain: "One update per effective rent change."
    fields:
      monthly_rent: "New contracted monthly rent, USD."
      last_rate_change_date: "Effective date of this rent change."
    triggers: []
  - type: unit_transfer_completed
    target: unit_transfers
    meaning: "The tenant moves the agreement to a different unit at the same facility."
    grain: "One row per transfer."
    distinguish_by: [transfer_date, unit_number]
    fields:
      transfer_date: "Date the transfer is completed."
      from_unit_number: "Unit the tenant leaves."
      from_variant_name: "Unit class of the unit left."
      from_unit_size: "Size of the unit left."
      unit_number: "Unit the tenant moves into."
      variant_name: "Unit class of the new unit."
      unit_size: "Size of the new unit."
      monthly_rent: "Monthly rent on the new unit, USD."
      transfer_fee_amount: "Transfer fee charged for this transfer, USD (0.00 when none)."
    triggers:
      - event: unit:unit_unit_reassigned
        map: {unit_number: unit_number, variant_name: variant_name, unit_size: unit_size, monthly_rent: monthly_rent}
      - event: unit:unit_fee_charge
        when: {transfer_fee_amount: {not: 0}}
        map: {fee_type: unit_transfer_fee}
  - type: unit_unit_reassigned
    target: unit_rentals
    mutation: update
    meaning: "The rental agreement is re-pointed to the new unit after a transfer."
    grain: "One update per transfer."
    fields:
      unit_number: "New unit number."
      unit_size: "New unit size."
      variant_name: "Unit class of the new unit."
      monthly_rent: "Monthly rent on the new unit, USD."
      last_rate_change_date: "Set to the transfer date where the transfer resets the rate clock."
    triggers: []
  - type: unit_moveout_scheduled
    target: unit_rentals
    mutation: {transition: [{from: active, to: moving_out}, {from: delinquent, to: moving_out}]}
    meaning: "The tenant gives notice to end the agreement on a planned vacate date."
    grain: "One transition per move-out notice."
    fields:
      move_out_date: "Planned vacate date set by the notice."
    triggers: []
  - type: unit_moveout_withdrawn
    target: unit_rentals
    mutation: {transition: [{from: moving_out, to: active}, {from: moving_out, to: delinquent}]}
    meaning: "The tenant withdraws a move-out notice before vacating."
    grain: "One transition per withdrawn notice."
    fields:
      move_out_date: "Cleared to empty."
    triggers: []
  - type: unit_vacated
    target: unit_rentals
    mutation: {transition: {from: moving_out, to: vacated}}
    meaning: "The facility confirms the unit is empty and the lock removed; the agreement ends."
    grain: "One transition per rental agreement."
    fields:
      move_out_date: "Date the vacate is confirmed."
    triggers: []
  - type: unit_coverage_update
    target: unit_rentals
    mutation: update
    meaning: "The way the tenant meets the contents coverage requirement is changed."
    grain: "One update per coverage change."
    fields:
      coverage_source: "New coverage source."
    triggers: []
  - type: unit_lock_status_update
    target: unit_rentals
    mutation: update
    meaning: "The lock on the unit changes: company overlock applied or removed, or tenant lock cut."
    grain: "One update per lock change."
    fields:
      lock_status: "New lock status."
    triggers: []

measures:
  - id: unit_msr_courtesy_waivers_365d
    window: "Rolling 365 calendar days ending on the handling date (frozen date), inclusive, per rental agreement."
    measure: "Count of unit_credit rows with credit_type courtesy_late_fee_waiver whose entry_date falls in the window."
  - id: unit_msr_transfers_365d
    window: "Rolling 365 calendar days ending on the handling date, inclusive, per rental agreement."
    measure: "Count of unit_transfer_completed rows whose transfer_date falls in the window."
  - id: unit_msr_retention_concessions_365d
    window: "Rolling 365 calendar days ending on the handling date, inclusive, per rental agreement."
    measure: "Count of unit_rate_change_notice rows with change_reason retention_concession whose notice_date falls in the window."
  - id: unit_msr_open_reservations
    window: "Point in time: the handling date, per customer."
    measure: "Count of the customer's rental agreements in reserved status."

policies:
  - id: unit_agg_multi_holding
    subject: [unit_reservation]
    rule: >-
      A customer may rent any number of storage units; each unit is its own rental agreement with its own ledger, due date and lien
      schedule. A customer may hold at most max_open_reservations open reservations at one time, counted by
      unit_msr_open_reservations before the new reservation is made. Every other rental agreement in the customer's name must be in
      reserved, active, moving_out, vacated, reservation_cancelled or sold_at_lien_sale status before a new reservation is taken; a
      customer with a delinquent, lien_noticed or auction_scheduled rental must bring that rental current first. A reservation is
      made only on a unit the facility inventory shows as available.
    eligibility:
      - id: no_delinquent_rental
        applies_to: [unit_reservation]
        kind: state
        condition: "Every other rental agreement in the customer's name must be in reserved, active, moving_out, vacated, reservation_cancelled or sold_at_lien_sale status before a new reservation is taken; a customer with a delinquent, lien_noticed or auction_scheduled rental must bring that rental current first."
        evidence_fields: [unit_rentals.status, unit_rentals.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.customer_id]]
          action_bindings: {unit_rentals.customer_id: customer_id}
        state_contract:
          field: unit_rentals.status
          allowed: [reserved, active, moving_out, vacated, reservation_cancelled, sold_at_lien_sale]
      - id: unit_available
        applies_to: [unit_reservation]
        kind: state
        condition: "A reservation is made only on a unit the facility inventory shows as available."
        evidence_fields: [facility_spaces.availability, facility_spaces.facility_space_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[facility_spaces.facility_space_id]]
          action_bindings: {facility_spaces.facility_space_id: facility_space_id}
        state_contract:
          field: facility_spaces.availability
          allowed: [available]
    params:
      max_per_customer: null
      max_open_reservations: 3
    measures: [unit_msr_open_reservations]

  - id: unit_agg_payment_allocation
    subject: [unit_payment]
    rule: >-
      When a customer with more than one rental agreement makes a payment without naming the unit it is for, the payment is applied
      first to the rental whose delinquent_since date is earliest, then to the next-earliest, and only then to rentals that are
      current; rentals with no delinquent_since date are taken in order of move_in_date, oldest first. A payment that names a unit is
      applied only to that unit's agreement and never spills to another agreement; any excess stays on that agreement as a credit
      balance. Within one agreement the payment is applied by payment_application_order: the oldest billing period first, and within
      a billing period its fees before its rent. One payment is split into one unit_payment row per agreement it reaches, and the row
      amounts add up to the payment taken.
    eligibility: []
    params:
      allocation_basis: "earliest_delinquent_since_then_oldest_move_in"
      intra_rental_order: "=payment_application_order"

  - id: unit_evt_rent_billing
    subject: [unit_move_in, unit_rent_charge]
    rule: >-
      Rent is billed on the anniversary basis: the first billing period starts on the move-in date and is charged at move-in, and each
      later period starts on the same day of the month as the move-in date; where a month has no such day the period starts on that
      month's last day. A billing period ends the day before the next period starts. The first period's rent is the monthly rent
      reduced by the move-in discount or the military discount, whichever is greater, under discount_stacking_rule; they never add.
      Every later period is charged the monthly rent, reduced by the military discount only where military_discount_applied is true.
      Rent is charged only while the rental agreement is in active, delinquent, lien_noticed, auction_scheduled or moving_out status.
      For a rental in moving_out status, a billing period whose start date falls on or after the planned vacate date is not charged.
      Each billing period is charged once. Amounts are rounded to the cent, half up.
      The agreement runs on lease_term_basis and its due dates follow billing_cycle_basis.
    eligibility:
      - id: billable_status
        applies_to: [unit_rent_charge]
        kind: state
        condition: "Rent is charged only while the rental agreement is in active, delinquent, lien_noticed, auction_scheduled or moving_out status."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [active, delinquent, lien_noticed, auction_scheduled, moving_out]
      - id: one_charge_per_period
        applies_to: [unit_rent_charge]
        kind: dedup
        condition: "Each billing period is charged once."
        evidence_fields: [unit_ledger.rental_id, unit_ledger.period_start, unit_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_ledger.rental_id, unit_ledger.period_start]]
          action_bindings: {unit_ledger.rental_id: rental_id, unit_ledger.period_start: period_start}
        dedup_contract:
          table: unit_ledger
          mode: separate_record
          object_bindings: {rental_id: rental_id, period_start: period_start}
          duplicate_filters: {event_type: [unit_rent_charge]}
          distinct_fields: []
    params:
      rounding: "half_up_to_cent"
      per_tier:
        Bluegate Drive-Up Standard: {first_month_discount_pct: "=first_month_discount_pct", military_discount_pct: "=military_discount_pct"}
        Bluegate Interior Standard: {first_month_discount_pct: "=first_month_discount_pct", military_discount_pct: "=military_discount_pct"}
        Bluegate Climate Controlled: {first_month_discount_pct: "=first_month_discount_pct", military_discount_pct: "=military_discount_pct"}
        Bluegate Climate Plus: {first_month_discount_pct: "=first_month_discount_pct", military_discount_pct: "=military_discount_pct"}
        Bluegate Premier Climate Suite: {first_month_discount_pct: "=first_month_discount_pct", military_discount_pct: "=military_discount_pct"}
        Bluegate Wine & Collectibles Vault: {first_month_discount_pct: "=first_month_discount_pct", military_discount_pct: "=military_discount_pct"}
    formula:
      first_period_rent: "round(monthly_rent * (1 - max(first_month_discount_pct if promo_code == 'first_month_discount' else 0, military_discount_pct if military_discount_applied == true else 0)), 2)"
      recurring_rent: "round(monthly_rent * (1 - military_discount_pct), 2) if military_discount_applied == true else monthly_rent"

  - id: unit_evt_late_fee
    subject: [unit_delinquency_onset, unit_fee_charge]
    rule: >-
      A late fee is assessed once for a billing period when any part of that period's rent is still unpaid after the grace period. The
      late fee may be posted only when the handling date is later than the rent due date of the unpaid billing period plus
      grace_period_days. Grace days are counted as calendar days starting the day after the due date, so a payment received on the
      last grace day is on time. The late fee is the greater of late_fee_flat_usd and late_fee_pct_of_rent times the monthly rent,
      rounded to the cent, and never more than late_fee_max_usd. When the period's rent is still unpaid second_late_fee_days_after_due
      calendar days after its due date, a second late fee of second_late_fee_usd is posted for the same period; no further late fees
      accrue on that period. A late fee is assessed only while the rental is in active, delinquent, lien_noticed, auction_scheduled or
      moving_out status. Each billing period carries at most one late fee and one second late fee. A period whose rent is fully paid on
      or before the last grace day is never charged a late fee, and a late fee posted against such a period is a billing error. The
      first late fee of a cycle moves an active rental to delinquent, with delinquent_since set to that period's due date.
    eligibility:
      - id: grace_expired
        applies_to: [unit_fee_charge]
        kind: time
        condition: "The late fee may be posted only when the handling date is later than the rent due date of the unpaid billing period plus grace_period_days."
        evidence_fields: [unit_ledger.period_start, unit_ledger.entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_ledger.entry_id]]
          action_bindings: {unit_ledger.entry_id: reference_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the rent due date of the unpaid billing period"
          anchor_source: unit_ledger.period_start
          relation: not_before
          duration_source: variants.grace_period_days
          unit: calendar_days
          counting_rule: "Grace days are counted as calendar days starting the day after the due date, so a payment received on the last grace day is on time."
          boundary: exclusive
      - id: late_fee_status
        applies_to: [unit_fee_charge]
        kind: state
        condition: "A late fee is assessed only while the rental is in active, delinquent, lien_noticed, auction_scheduled or moving_out status."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [active, delinquent, lien_noticed, auction_scheduled, moving_out]
      - id: one_late_fee_per_period
        applies_to: [unit_fee_charge]
        kind: dedup
        condition: "Each billing period carries at most one late fee and one second late fee."
        evidence_fields: [unit_ledger.rental_id, unit_ledger.period_start, unit_ledger.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_ledger.rental_id, unit_ledger.period_start, unit_ledger.fee_type]]
          action_bindings: {unit_ledger.rental_id: rental_id, unit_ledger.period_start: period_start, unit_ledger.fee_type: fee_type}
        dedup_contract:
          table: unit_ledger
          mode: separate_record
          object_bindings: {rental_id: rental_id, period_start: period_start, fee_type: fee_type}
          duplicate_filters: {fee_type: [late_fee, second_late_fee]}
          distinct_fields: []
    params:
      per_tier:
        Bluegate Drive-Up Standard: {grace_period_days: "=grace_period_days", late_fee_flat_usd: "=late_fee_flat_usd", late_fee_pct_of_rent: "=late_fee_pct_of_rent", late_fee_max_usd: "=late_fee_max_usd"}
        Bluegate Interior Standard: {grace_period_days: "=grace_period_days", late_fee_flat_usd: "=late_fee_flat_usd", late_fee_pct_of_rent: "=late_fee_pct_of_rent", late_fee_max_usd: "=late_fee_max_usd"}
        Bluegate Climate Controlled: {grace_period_days: "=grace_period_days", late_fee_flat_usd: "=late_fee_flat_usd", late_fee_pct_of_rent: "=late_fee_pct_of_rent", late_fee_max_usd: "=late_fee_max_usd"}
        Bluegate Climate Plus: {grace_period_days: "=grace_period_days", late_fee_flat_usd: "=late_fee_flat_usd", late_fee_pct_of_rent: "=late_fee_pct_of_rent", late_fee_max_usd: "=late_fee_max_usd"}
        Bluegate Premier Climate Suite: {grace_period_days: "=grace_period_days", late_fee_flat_usd: "=late_fee_flat_usd", late_fee_pct_of_rent: "=late_fee_pct_of_rent", late_fee_max_usd: "=late_fee_max_usd"}
        Bluegate Wine & Collectibles Vault: {grace_period_days: "=grace_period_days", late_fee_flat_usd: "=late_fee_flat_usd", late_fee_pct_of_rent: "=late_fee_pct_of_rent", late_fee_max_usd: "=late_fee_max_usd"}
    formula:
      late_fee_amount: "min(late_fee_max_usd, max(late_fee_flat_usd, round(monthly_rent * late_fee_pct_of_rent, 2)))"
      second_late_fee_amount: "second_late_fee_usd"

  - id: unit_evt_courtesy_waiver
    subject: [unit_credit]
    rule: >-
      At the tenant's request the care center may waive one posted late fee or second late fee as a courtesy, crediting its full
      amount; a courtesy waiver never covers part of a fee and never covers rent, lien-process fees, returned-payment fees, transfer
      fees or move-out fees. The waived fee must be a late_fee or second_late_fee entry on the same rental agreement. A courtesy waiver
      may be granted only when the handling date is not earlier than the move-in date plus courtesy_waiver_min_tenure_months. Months are
      calendar months counted from the move-in date to the same day of the later month, falling back to that month's last day when the
      day does not exist. The rental must be in active, delinquent or moving_out status; once a lien notice has been sent no courtesy
      waiver is given. The number of courtesy waivers already granted on the agreement, counted by unit_msr_courtesy_waivers_365d, must
      be below courtesy_waivers_per_12_months. A fee that has already been waived or corrected is not waived again. A late fee that was
      posted in error is reversed under the billing-correction rule instead and does not use the courtesy allowance.
    eligibility:
      - id: tenure_met
        applies_to: [unit_credit]
        kind: time
        condition: "A courtesy waiver may be granted only when the handling date is not earlier than the move-in date plus courtesy_waiver_min_tenure_months."
        evidence_fields: [unit_rentals.move_in_date, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the move-in date"
          anchor_source: unit_rentals.move_in_date
          relation: not_before
          duration_source: variants.courtesy_waiver_min_tenure_months
          unit: calendar_months
          counting_rule: "Months are calendar months counted from the move-in date to the same day of the later month, falling back to that month's last day when the day does not exist."
          boundary: inclusive
      - id: waiver_status
        applies_to: [unit_credit]
        kind: state
        condition: "The rental must be in active, delinquent or moving_out status; once a lien notice has been sent no courtesy waiver is given."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [active, delinquent, moving_out]
      - id: waivable_fee
        applies_to: [unit_credit]
        kind: authorization
        condition: "The waived fee must be a late_fee or second_late_fee entry on the same rental agreement."
        evidence_fields: [unit_ledger.entry_id, unit_ledger.fee_type, unit_ledger.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_ledger.entry_id]]
          action_bindings: {unit_ledger.entry_id: reference_entry_id}
      - id: not_already_waived
        applies_to: [unit_credit]
        kind: dedup
        condition: "A fee that has already been waived or corrected is not waived again."
        evidence_fields: [unit_ledger.reference_entry_id, unit_ledger.credit_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_ledger.reference_entry_id]]
          action_bindings: {unit_ledger.reference_entry_id: reference_entry_id}
        dedup_contract:
          table: unit_ledger
          mode: separate_record
          object_bindings: {reference_entry_id: reference_entry_id}
          duplicate_filters: {credit_type: [courtesy_late_fee_waiver, billing_error_correction]}
          distinct_fields: []
    params:
      per_tier:
        Bluegate Drive-Up Standard: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months"}
        Bluegate Interior Standard: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months"}
        Bluegate Climate Controlled: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months"}
        Bluegate Climate Plus: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months"}
        Bluegate Premier Climate Suite: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months"}
        Bluegate Wine & Collectibles Vault: {courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months"}
    formula:
      allowed: "unit_msr_courtesy_waivers_365d < courtesy_waivers_per_12_months"
    measures: [unit_msr_courtesy_waivers_365d]

  - id: unit_evt_billing_correction
    subject: [unit_credit]
    rule: >-
      A charge posted in error is reversed in full with a billing_error_correction credit referencing that charge. A late fee or second
      late fee is in error when the ledger shows payments dated on or before the period's last grace day (or, for a second late fee,
      before second_late_fee_days_after_due) that cover the period's rent. A rent charge is in error when a second rent charge exists
      for the same billing period, or when it was posted for a period starting on or after the planned vacate date of a moving_out
      rental. A billing-error correction is given in any status other than reserved or reservation_cancelled and does not count against
      the courtesy allowance. A charge that has already been waived or corrected is not credited again.
    eligibility:
      - id: not_already_credited
        applies_to: [unit_credit]
        kind: dedup
        condition: "A charge that has already been waived or corrected is not credited again."
        evidence_fields: [unit_ledger.reference_entry_id, unit_ledger.credit_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_ledger.reference_entry_id]]
          action_bindings: {unit_ledger.reference_entry_id: reference_entry_id}
        dedup_contract:
          table: unit_ledger
          mode: separate_record
          object_bindings: {reference_entry_id: reference_entry_id}
          duplicate_filters: {credit_type: [courtesy_late_fee_waiver, billing_error_correction]}
          distinct_fields: []
    params:
      correction_share_of_charge: 1.0

  - id: unit_evt_lien_process
    subject: [unit_lien_step, unit_lien_stage_advance, unit_lien_sale]
    rule: >-
      The lien process runs from delinquent_since, the due date of the oldest unpaid billing period, and every step is dated in calendar
      days. The company overlock may be applied when the handling date is not earlier than the delinquency anchor date plus
      overlock_days_after_due. The preliminary lien letter is sent by first-class mail and email at preliminary_notice_days_after_due.
      The formal lien notice may be sent when the handling date is not earlier than the delinquency anchor date plus
      lien_notice_days_after_due, by lien_notice_delivery_method, and it moves the rental to lien_noticed. The sale may be advertised
      when the handling date is not earlier than the lien notice date plus auction_advertisement_days_after_lien_notice; the
      advertisement sets a scheduled sale date at least lien_sale_min_days_after_advertisement days after the advertisement date and
      moves the rental to auction_scheduled. The tenant lock may be cut for inventory on or after the advertisement date. The lien sale
      may be held when the handling date is not earlier than the advertisement date plus lien_sale_min_days_after_advertisement. Day
      counts start the day after the anchor date and the step is allowed on the day the count is reached. Lien steps are taken only
      while the rental is in delinquent, lien_noticed or auction_scheduled status. No lien notice, advertisement, lock cut or sale may
      proceed while a lien hold is in place; a lien hold is placed when the tenant or a family member reports active-duty military
      service backed by orders on file, or when the tenant reports a bankruptcy filing with a case number, and it stays until a
      lien_hold_released step is recorded. Rent and late fees keep accruing during a hold. Each step is taken once per delinquency
      cycle. The overlock is removed with an overlock_removed step when the rental is redeemed.
      The overlock posts overlock_fee_usd, the lien notice lien_notice_fee_usd, the sale advertisement auction_advertisement_fee_usd and the lock cut lock_cut_fee_usd, each against the delinquency cycle's anchor date.
    eligibility:
      - id: overlock_due
        applies_to: [unit_lien_step]
        kind: time
        condition: "The company overlock may be applied when the handling date is not earlier than the delinquency anchor date plus overlock_days_after_due."
        evidence_fields: [unit_rentals.delinquent_since, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the delinquency anchor date"
          anchor_source: unit_rentals.delinquent_since
          relation: not_before
          duration_source: variants.overlock_days_after_due
          unit: calendar_days
          counting_rule: "Day counts start the day after the anchor date and the step is allowed on the day the count is reached."
          boundary: inclusive
      - id: lien_notice_due
        applies_to: [unit_lien_step]
        kind: time
        condition: "The formal lien notice may be sent when the handling date is not earlier than the delinquency anchor date plus lien_notice_days_after_due, by lien_notice_delivery_method, and it moves the rental to lien_noticed."
        evidence_fields: [unit_rentals.delinquent_since, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the delinquency anchor date"
          anchor_source: unit_rentals.delinquent_since
          relation: not_before
          duration_source: variants.lien_notice_days_after_due
          unit: calendar_days
          counting_rule: "Day counts start the day after the anchor date and the step is allowed on the day the count is reached."
          boundary: inclusive
      - id: advertisement_due
        applies_to: [unit_lien_step]
        kind: time
        condition: "The sale may be advertised when the handling date is not earlier than the lien notice date plus auction_advertisement_days_after_lien_notice; the advertisement sets a scheduled sale date at least lien_sale_min_days_after_advertisement days after the advertisement date and moves the rental to auction_scheduled."
        evidence_fields: [unit_lien_actions.action_date, unit_lien_actions.lien_step, unit_lien_actions.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_lien_actions.rental_id]]
          action_bindings: {unit_lien_actions.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the lien notice date"
          anchor_source: unit_lien_actions.action_date
          relation: not_before
          duration_source: variants.auction_advertisement_days_after_lien_notice
          unit: calendar_days
          counting_rule: "Day counts start the day after the anchor date and the step is allowed on the day the count is reached."
          boundary: inclusive
      - id: sale_due
        applies_to: [unit_lien_sale]
        kind: time
        condition: "The lien sale may be held when the handling date is not earlier than the advertisement date plus lien_sale_min_days_after_advertisement."
        evidence_fields: [unit_lien_actions.action_date, unit_lien_actions.lien_step, unit_lien_actions.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_lien_actions.rental_id]]
          action_bindings: {unit_lien_actions.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the advertisement date"
          anchor_source: unit_lien_actions.action_date
          relation: not_before
          duration_source: variants.lien_sale_min_days_after_advertisement
          unit: calendar_days
          counting_rule: "Day counts start the day after the anchor date and the step is allowed on the day the count is reached."
          boundary: inclusive
      - id: lien_status
        applies_to: [unit_lien_step]
        kind: state
        condition: "Lien steps are taken only while the rental is in delinquent, lien_noticed or auction_scheduled status."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [delinquent, lien_noticed, auction_scheduled]
      - id: no_active_hold
        applies_to: [unit_lien_step, unit_lien_sale]
        kind: authorization
        condition: "No lien notice, advertisement, lock cut or sale may proceed while a lien hold is in place; a lien hold is placed when the tenant or a family member reports active-duty military service backed by orders on file, or when the tenant reports a bankruptcy filing with a case number, and it stays until a lien_hold_released step is recorded."
        evidence_fields: [unit_lien_actions.lien_step, unit_lien_actions.hold_reason, unit_lien_actions.rental_id, customers.military_status]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[unit_lien_actions.rental_id]]
          action_bindings: {unit_lien_actions.rental_id: rental_id}
      - id: once_per_cycle
        applies_to: [unit_lien_step]
        kind: dedup
        condition: "Each step is taken once per delinquency cycle."
        evidence_fields: [unit_lien_actions.rental_id, unit_lien_actions.lien_step, unit_lien_actions.delinquency_anchor_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_lien_actions.rental_id, unit_lien_actions.delinquency_anchor_date]]
          action_bindings: {unit_lien_actions.rental_id: rental_id, unit_lien_actions.delinquency_anchor_date: delinquency_anchor_date}
        dedup_contract:
          table: unit_lien_actions
          mode: separate_record
          object_bindings: {rental_id: rental_id, delinquency_anchor_date: delinquency_anchor_date, lien_step: lien_step}
          duplicate_filters: {event_type: [unit_lien_step]}
          distinct_fields: [delinquency_anchor_date]
    params:
      preliminary_notice_method: "first_class_mail_and_email"
      per_tier:
        Bluegate Drive-Up Standard: {overlock_days_after_due: "=overlock_days_after_due", lien_notice_days_after_due: "=lien_notice_days_after_due", auction_advertisement_days_after_lien_notice: "=auction_advertisement_days_after_lien_notice", lien_sale_min_days_after_advertisement: "=lien_sale_min_days_after_advertisement"}
        Bluegate Interior Standard: {overlock_days_after_due: "=overlock_days_after_due", lien_notice_days_after_due: "=lien_notice_days_after_due", auction_advertisement_days_after_lien_notice: "=auction_advertisement_days_after_lien_notice", lien_sale_min_days_after_advertisement: "=lien_sale_min_days_after_advertisement"}
        Bluegate Climate Controlled: {overlock_days_after_due: "=overlock_days_after_due", lien_notice_days_after_due: "=lien_notice_days_after_due", auction_advertisement_days_after_lien_notice: "=auction_advertisement_days_after_lien_notice", lien_sale_min_days_after_advertisement: "=lien_sale_min_days_after_advertisement"}
        Bluegate Climate Plus: {overlock_days_after_due: "=overlock_days_after_due", lien_notice_days_after_due: "=lien_notice_days_after_due", auction_advertisement_days_after_lien_notice: "=auction_advertisement_days_after_lien_notice", lien_sale_min_days_after_advertisement: "=lien_sale_min_days_after_advertisement"}
        Bluegate Premier Climate Suite: {overlock_days_after_due: "=overlock_days_after_due", lien_notice_days_after_due: "=lien_notice_days_after_due", auction_advertisement_days_after_lien_notice: "=auction_advertisement_days_after_lien_notice", lien_sale_min_days_after_advertisement: "=lien_sale_min_days_after_advertisement"}
        Bluegate Wine & Collectibles Vault: {overlock_days_after_due: "=overlock_days_after_due", lien_notice_days_after_due: "=lien_notice_days_after_due", auction_advertisement_days_after_lien_notice: "=auction_advertisement_days_after_lien_notice", lien_sale_min_days_after_advertisement: "=lien_sale_min_days_after_advertisement"}

  - id: unit_evt_payment_acceptance
    subject: [unit_payment, unit_redemption, unit_payment_reversal]
    rule: >-
      The care center takes payments by the methods in accepted_phone_payment_methods; cash and money orders are taken only at the
      facility office. Payments are accepted while the rental is in active, delinquent, lien_noticed, auction_scheduled, moving_out or
      vacated status. While the rental is delinquent a payment of any amount is accepted. Once a lien notice has been sent, a payment
      is accepted only if it pays the full balance due, including lien-process fees; a smaller payment is declined and nothing is
      posted. When a payment brings the balance due to zero or below on a delinquent, lien_noticed or auction_scheduled rental, the
      rental is redeemed and returns to active, delinquent_since is cleared, and where the company overlock is on, an overlock_removed
      step is recorded. A redemption is not possible once the lien sale has been held. When the bank returns a payment for insufficient
      funds or a closed account, the payment is reversed in full and returned_payment_fee_usd is posted against the reversed payment; a
      card chargeback is reversed without that fee. A reversal that leaves rent from a period past its grace period unpaid makes the
      rental delinquent again under the late-fee rule.
      Partial payments while delinquent follow partial_payment_accepted_while_delinquent, and the full-balance requirement after a lien notice follows partial_payment_accepted_after_lien_notice and redemption_requires_full_balance.
    eligibility:
      - id: payable_status
        applies_to: [unit_payment]
        kind: state
        condition: "Payments are accepted while the rental is in active, delinquent, lien_noticed, auction_scheduled, moving_out or vacated status."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [active, delinquent, lien_noticed, auction_scheduled, moving_out, vacated]
      - id: full_payment_after_lien_notice
        applies_to: [unit_payment]
        kind: authorization
        condition: "Once a lien notice has been sent, a payment is accepted only if it pays the full balance due, including lien-process fees; a smaller payment is declined and nothing is posted."
        evidence_fields: [unit_rentals.status, unit_rentals.balance_due, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
      - id: reversal_once
        applies_to: [unit_payment_reversal]
        kind: dedup
        condition: "When the bank returns a payment for insufficient funds or a closed account, the payment is reversed in full and returned_payment_fee_usd is posted against the reversed payment; a card chargeback is reversed without that fee."
        evidence_fields: [unit_ledger.reference_entry_id, unit_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_ledger.reference_entry_id]]
          action_bindings: {unit_ledger.reference_entry_id: reference_entry_id}
        dedup_contract:
          table: unit_ledger
          mode: separate_record
          object_bindings: {reference_entry_id: reference_entry_id}
          duplicate_filters: {event_type: [unit_payment_reversal]}
          distinct_fields: []
    params:
      per_tier:
        Bluegate Drive-Up Standard: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Bluegate Interior Standard: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Bluegate Climate Controlled: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Bluegate Climate Plus: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Bluegate Premier Climate Suite: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Bluegate Wine & Collectibles Vault: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
    formula:
      redeemed: "balance_due <= 0"

  - id: unit_evt_rate_increase
    subject: [unit_rate_change_notice, unit_rent_rate_update]
    rule: >-
      The company may raise the rent of an existing tenant with an existing_customer_rate_increase notice. An increase notice may be
      sent only when the handling date is not earlier than the move-in date plus rate_increase_first_eligible_months, and not earlier
      than the last rent change date plus rate_increase_min_interval_months. Months are calendar months, counted to the same day of the
      later month or that month's last day when the day does not exist. The new rent is at most the current monthly rent times one plus
      rate_increase_max_pct, rounded down to the cent. The effective date is the first rent due date that falls at least
      rate_increase_notice_days calendar days after the notice date. The new rent is applied to the agreement only when the handling
      date is not earlier than the notice date plus rate_increase_notice_days. Notice and request windows count calendar days starting the day
      after the notice date, and the last counted day is included. Rate increase notices are issued only to rentals in
      active status. A tenant who calls about a noticed increase may be given one retention_concession that gives back
      retention_concession_pct_of_increase of the increase, rounded down to the cent, with the same effective date and its
      source_rate_change_id pointing at the increase. A retention concession may be granted only when the handling date is not later
      than the increase notice date plus retention_request_window_days. Retention concessions on the agreement, counted by
      unit_msr_retention_concessions_365d, must be below retention_concessions_per_12_months. While a prepaid rent plan in active status covers the rental, no
      increase notice is sent and no increase takes effect before the prepaid term ends. An increase that has already taken effect
      is not reduced by a concession; a rental with a move-out notice gets no concession. When a concession is granted, the agreement
      rent applied on the effective date is the concession's new_rent.
    eligibility:
      - id: first_increase_wait
        applies_to: [unit_rate_change_notice]
        kind: time
        condition: "An increase notice may be sent only when the handling date is not earlier than the move-in date plus rate_increase_first_eligible_months, and not earlier than the last rent change date plus rate_increase_min_interval_months."
        evidence_fields: [unit_rentals.move_in_date, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the move-in date"
          anchor_source: unit_rentals.move_in_date
          relation: not_before
          duration_source: variants.rate_increase_first_eligible_months
          unit: calendar_months
          counting_rule: "Months are calendar months, counted to the same day of the later month or that month's last day when the day does not exist."
          boundary: inclusive
      - id: interval_wait
        applies_to: [unit_rate_change_notice]
        kind: time
        condition: "An increase notice may be sent only when the handling date is not earlier than the move-in date plus rate_increase_first_eligible_months, and not earlier than the last rent change date plus rate_increase_min_interval_months."
        evidence_fields: [unit_rentals.last_rate_change_date, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the last rent change date"
          anchor_source: unit_rentals.last_rate_change_date
          relation: not_before
          duration_source: variants.rate_increase_min_interval_months
          unit: calendar_months
          counting_rule: "Months are calendar months, counted to the same day of the later month or that month's last day when the day does not exist."
          boundary: inclusive
      - id: notice_period_elapsed
        applies_to: [unit_rent_rate_update]
        kind: time
        condition: "The new rent is applied to the agreement only when the handling date is not earlier than the notice date plus rate_increase_notice_days."
        evidence_fields: [unit_rate_changes.notice_date, unit_rate_changes.rate_change_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rate_changes.rate_change_id]]
          action_bindings: {unit_rate_changes.rate_change_id: rate_change_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the notice date"
          anchor_source: unit_rate_changes.notice_date
          relation: not_before
          duration_source: variants.rate_increase_notice_days
          unit: calendar_days
          counting_rule: "Notice and request windows count calendar days starting the day after the notice date, and the last counted day is included."
          boundary: inclusive
      - id: no_prepay_lock
        applies_to: [unit_rate_change_notice, unit_rent_rate_update]
        kind: authorization
        condition: "While a prepaid rent plan in active status covers the rental, no increase notice is sent and no increase takes effect before the prepaid term ends."
        evidence_fields: [prepay_plans.status, prepay_plans.agreement_id, prepay_plans.term_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prepay_plans.agreement_id]]
          action_bindings: {prepay_plans.agreement_id: rental_id}
      - id: increase_status
        applies_to: [unit_rate_change_notice]
        kind: state
        condition: "Rate increase notices are issued only to rentals in active status."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [active]
      - id: concession_window
        applies_to: [unit_rate_change_notice]
        kind: time
        condition: "A retention concession may be granted only when the handling date is not later than the increase notice date plus retention_request_window_days."
        evidence_fields: [unit_rate_changes.notice_date, unit_rate_changes.rate_change_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rate_changes.rate_change_id]]
          action_bindings: {unit_rate_changes.rate_change_id: source_rate_change_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the increase notice date"
          anchor_source: unit_rate_changes.notice_date
          relation: not_after
          duration_source: variants.retention_request_window_days
          unit: calendar_days
          counting_rule: "Notice and request windows count calendar days starting the day after the notice date, and the last counted day is included."
          boundary: inclusive
    params:
      per_tier:
        Bluegate Drive-Up Standard: {rate_increase_max_pct: "=rate_increase_max_pct", rate_increase_notice_days: "=rate_increase_notice_days"}
        Bluegate Interior Standard: {rate_increase_max_pct: "=rate_increase_max_pct", rate_increase_notice_days: "=rate_increase_notice_days"}
        Bluegate Climate Controlled: {rate_increase_max_pct: "=rate_increase_max_pct", rate_increase_notice_days: "=rate_increase_notice_days"}
        Bluegate Climate Plus: {rate_increase_max_pct: "=rate_increase_max_pct", rate_increase_notice_days: "=rate_increase_notice_days"}
        Bluegate Premier Climate Suite: {rate_increase_max_pct: "=rate_increase_max_pct", rate_increase_notice_days: "=rate_increase_notice_days"}
        Bluegate Wine & Collectibles Vault: {rate_increase_max_pct: "=rate_increase_max_pct", rate_increase_notice_days: "=rate_increase_notice_days"}
    formula:
      max_new_rent: "previous_rent * (1 + rate_increase_max_pct)"
      concession_new_rent: "new_rent - (new_rent - previous_rent) * retention_concession_pct_of_increase"
    measures: [unit_msr_retention_concessions_365d]

  - id: unit_evt_transfer
    subject: [unit_transfer_completed, unit_unit_reassigned]
    rule: >-
      A tenant may move the agreement to another unit at the same facility. A transfer is made only from a rental in active status.
      The rental must owe nothing at the time of transfer: balance_due must be zero or below. The target unit must be shown as
      available in the facility inventory. Transfers already made on the agreement, counted by unit_msr_transfers_365d, must be below
      transfers_per_12_months. The new unit's rent is its posted street rate on the transfer date (transfer_rent_basis), with no
      move-in discount; a military discount already on the agreement carries over. The transfer fee for the class of the unit being
      left is posted on the transfer date; the administrative fee is not charged again. Where transfer_resets_rate_clock is true, the
      transfer date becomes last_rate_change_date. Rent already paid for the current billing period stays on the agreement and the
      difference in rent is first charged from the next due date; the tenant may use the old unit for transfer_overlap_days calendar
      days after the transfer date to move goods. A transfer into a unit class whose min_protection_coverage_usd is higher than the
      tenant's current coverage requires the coverage to be raised first under the coverage rule.
    eligibility:
      - id: transfer_status
        applies_to: [unit_transfer_completed]
        kind: state
        condition: "A transfer is made only from a rental in active status."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [active]
      - id: paid_current
        applies_to: [unit_transfer_completed]
        kind: authorization
        condition: "The rental must owe nothing at the time of transfer: balance_due must be zero or below."
        evidence_fields: [unit_rentals.balance_due, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
      - id: target_available
        applies_to: [unit_transfer_completed]
        kind: state
        condition: "The target unit must be shown as available in the facility inventory."
        evidence_fields: [facility_spaces.availability, facility_spaces.facility_space_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[facility_spaces.facility_space_id]]
          action_bindings: {facility_spaces.facility_space_id: facility_space_id}
        state_contract:
          field: facility_spaces.availability
          allowed: [available]
    params:
      per_tier:
        Bluegate Drive-Up Standard: {transfer_fee_usd: "=transfer_fee_usd", transfers_per_12_months: "=transfers_per_12_months"}
        Bluegate Interior Standard: {transfer_fee_usd: "=transfer_fee_usd", transfers_per_12_months: "=transfers_per_12_months"}
        Bluegate Climate Controlled: {transfer_fee_usd: "=transfer_fee_usd", transfers_per_12_months: "=transfers_per_12_months"}
        Bluegate Climate Plus: {transfer_fee_usd: "=transfer_fee_usd", transfers_per_12_months: "=transfers_per_12_months"}
        Bluegate Premier Climate Suite: {transfer_fee_usd: "=transfer_fee_usd", transfers_per_12_months: "=transfers_per_12_months"}
        Bluegate Wine & Collectibles Vault: {transfer_fee_usd: "=transfer_fee_usd", transfers_per_12_months: "=transfers_per_12_months"}
    formula:
      allowed: "unit_msr_transfers_365d < transfers_per_12_months"
    measures: [unit_msr_transfers_365d]

  - id: unit_evt_moveout
    subject: [unit_moveout_scheduled, unit_moveout_withdrawn, unit_vacated, unit_refund, unit_deposit_released, unit_deposit_collected]
    rule: >-
      Only the tenant can end the agreement: the tenant gives a move-out notice naming a planned vacate date, which is recorded as a
      received notice and moves the rental to moving_out. The planned vacate date is at least moveout_notice_days calendar days after the
      notice date; an earlier date asked for is set to the notice date plus moveout_notice_days. Rent for a billing period that starts
      before the planned vacate date is owed in full. Where moveout_prorated_refund is true, the unused days of the final charged period
      after the vacate date are credited as monthly rent times unused days divided by the days in that period, rounded to the cent;
      where it is false no part of a period is refunded. The vacate is recorded only for a rental whose move-out notice is in received
      status. If the walk-through finds belongings or debris, cleaning_fee_usd is posted; if the tenant lock is still on, the lock is
      cut and lock_left_removal_fee_usd is posted. The security deposit is released within deposit_refund_days of the vacate date: first
      applied to any balance due, and the remainder refunded. A credit balance left after the deposit is refunded within
      credit_balance_refund_days by the original payment method, or by mailed check when that method can no longer be credited. A
      notice may be withdrawn by the tenant before the vacate is recorded; the rental returns to active if nothing is past due and to
      delinquent otherwise.
    eligibility:
      - id: notice_on_file
        applies_to: [unit_vacated]
        kind: state
        condition: "The vacate is recorded only for a rental whose move-out notice is in received status."
        evidence_fields: [unit_moveout_notices.notice_status, unit_moveout_notices.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_moveout_notices.rental_id]]
          action_bindings: {unit_moveout_notices.rental_id: rental_id}
        state_contract:
          field: unit_moveout_notices.notice_status
          allowed: [received]
    params:
      per_tier:
        Bluegate Drive-Up Standard: {moveout_notice_days: "=moveout_notice_days", moveout_prorated_refund: "=moveout_prorated_refund", cleaning_fee_usd: "=cleaning_fee_usd"}
        Bluegate Interior Standard: {moveout_notice_days: "=moveout_notice_days", moveout_prorated_refund: "=moveout_prorated_refund", cleaning_fee_usd: "=cleaning_fee_usd"}
        Bluegate Climate Controlled: {moveout_notice_days: "=moveout_notice_days", moveout_prorated_refund: "=moveout_prorated_refund", cleaning_fee_usd: "=cleaning_fee_usd"}
        Bluegate Climate Plus: {moveout_notice_days: "=moveout_notice_days", moveout_prorated_refund: "=moveout_prorated_refund", cleaning_fee_usd: "=cleaning_fee_usd"}
        Bluegate Premier Climate Suite: {moveout_notice_days: "=moveout_notice_days", moveout_prorated_refund: "=moveout_prorated_refund", cleaning_fee_usd: "=cleaning_fee_usd"}
        Bluegate Wine & Collectibles Vault: {moveout_notice_days: "=moveout_notice_days", moveout_prorated_refund: "=moveout_prorated_refund", cleaning_fee_usd: "=cleaning_fee_usd"}

  - id: unit_coverage_requirement
    subject: [unit_move_in, unit_coverage_update, unit_unit_reassigned]
    rule: >-
      Every rental agreement must carry contents coverage at all times, from exactly one source: a Bluegate Tenant Protection plan
      attached to the agreement, or the tenant's own homeowner's or renter's policy declared where own_insurance_proof_accepted is true.
      The two sources are mutually exclusive on one agreement. Coverage source bluegate_protection is valid only while a protection plan
      on that rental is in active status with a coverage limit of at least min_protection_coverage_usd for the agreement's unit class.
      Switching to own_insurance takes effect only once the attached protection plan has been cancelled, and switching to
      bluegate_protection only once a plan is active. A move-in, a transfer into a class with a higher minimum, or a coverage change that
      would leave the agreement without valid coverage is not completed.
    eligibility:
      - id: plan_valid
        applies_to: [unit_coverage_update, unit_move_in, unit_unit_reassigned]
        kind: authorization
        condition: "Coverage source bluegate_protection is valid only while a protection plan on that rental is in active status with a coverage limit of at least min_protection_coverage_usd for the agreement's unit class."
        evidence_fields: [protect_plans.status, protect_plans.variant_name, protect_plans.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plans.rental_id]]
          action_bindings: {protect_plans.rental_id: rental_id}
    params:
      per_tier:
        Bluegate Drive-Up Standard: {min_protection_coverage_usd: "=min_protection_coverage_usd"}
        Bluegate Interior Standard: {min_protection_coverage_usd: "=min_protection_coverage_usd"}
        Bluegate Climate Controlled: {min_protection_coverage_usd: "=min_protection_coverage_usd"}
        Bluegate Climate Plus: {min_protection_coverage_usd: "=min_protection_coverage_usd"}
        Bluegate Premier Climate Suite: {min_protection_coverage_usd: "=min_protection_coverage_usd"}
        Bluegate Wine & Collectibles Vault: {min_protection_coverage_usd: "=min_protection_coverage_usd"}

  - id: unit_evt_reservation
    subject: [unit_reservation, unit_reservation_cancelled, unit_move_in]
    rule: >-
      Reservations are free and hold one specific available unit at its posted street rate on the reservation date. A move-in on a
      reservation may be completed only when the handling date is not later than the reservation date plus reservation_hold_days.
      The hold counts calendar days starting the day after the reservation date and ends at the close of the last counted day. A lapsed
      reservation is cancelled by the system and the unit may be reserved again. At move-in the tenant presents move_in_id_required,
      signs the month-to-month agreement, chooses a coverage source, and the first period's rent, admin_fee_usd and any
      security_deposit_usd are posted. A promotion or military discount is attached at reservation and applied at move-in under the
      rent-billing rule. A customer may cancel a reservation at any time before move-in at no charge.
    eligibility:
      - id: hold_not_lapsed
        applies_to: [unit_move_in]
        kind: time
        condition: "A move-in on a reservation may be completed only when the handling date is not later than the reservation date plus reservation_hold_days."
        evidence_fields: [unit_rentals.reservation_date, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation date"
          anchor_source: unit_rentals.reservation_date
          relation: not_after
          duration_source: variants.reservation_hold_days
          unit: calendar_days
          counting_rule: "The hold counts calendar days starting the day after the reservation date and ends at the close of the last counted day."
          boundary: inclusive
    params:
      per_tier:
        Bluegate Drive-Up Standard: {reservation_hold_days: "=reservation_hold_days", admin_fee_usd: "=admin_fee_usd", security_deposit_usd: "=security_deposit_usd"}
        Bluegate Interior Standard: {reservation_hold_days: "=reservation_hold_days", admin_fee_usd: "=admin_fee_usd", security_deposit_usd: "=security_deposit_usd"}
        Bluegate Climate Controlled: {reservation_hold_days: "=reservation_hold_days", admin_fee_usd: "=admin_fee_usd", security_deposit_usd: "=security_deposit_usd"}
        Bluegate Climate Plus: {reservation_hold_days: "=reservation_hold_days", admin_fee_usd: "=admin_fee_usd", security_deposit_usd: "=security_deposit_usd"}
        Bluegate Premier Climate Suite: {reservation_hold_days: "=reservation_hold_days", admin_fee_usd: "=admin_fee_usd", security_deposit_usd: "=security_deposit_usd"}
        Bluegate Wine & Collectibles Vault: {reservation_hold_days: "=reservation_hold_days", admin_fee_usd: "=admin_fee_usd", security_deposit_usd: "=security_deposit_usd"}

  - id: unit_evt_sale_proceeds
    subject: [unit_sale_proceeds_applied, unit_lien_sale]
    rule: >-
      Net proceeds of a lien sale, after the sale costs already posted as lien-process fees, are applied against the rental's balance
      due up to that balance, and never beyond it. Any surplus is not credited to the ledger; it is held for the former tenant for
      sale_surplus_hold_days calendar days after the sale date and released only on a written claim handled by the facility district
      office. A balance still owed after the proceeds are applied stays owed by the former tenant. Once sold, a rental is never
      redeemed, transferred or reopened.
    eligibility: []
    params:
      per_tier:
        Bluegate Drive-Up Standard: {sale_surplus_hold_days: "=sale_surplus_hold_days"}
        Bluegate Interior Standard: {sale_surplus_hold_days: "=sale_surplus_hold_days"}
        Bluegate Climate Controlled: {sale_surplus_hold_days: "=sale_surplus_hold_days"}
        Bluegate Climate Plus: {sale_surplus_hold_days: "=sale_surplus_hold_days"}
        Bluegate Premier Climate Suite: {sale_surplus_hold_days: "=sale_surplus_hold_days"}
        Bluegate Wine & Collectibles Vault: {sale_surplus_hold_days: "=sale_surplus_hold_days"}

  - id: unit_evt_lock_and_coverage_records
    subject: [unit_lock_status_update]
    rule: >-
      The lock status on the agreement follows the lien steps: company_overlock when the overlock is applied, tenant_lock when the
      overlock is removed on redemption, and lock_cut when the tenant lock is cut for inventory or at move-out. The care center never
      removes an overlock for a rental that still owes a past-due balance.
    eligibility: []

  - id: unit_evt_unit_class_features
    subject: [unit_reservation, unit_unit_reassigned]
    rule: >-
      Each unit class carries the features listed for it and no others: the temperature band temperature_range_f, the humidity control
      humidity_control, an individual door alarm where door_alarm_included is true, gate access during access_hours, and parking at the
      door where drive_up_access is true. A tenant who needs a feature their class lacks is offered a transfer to a class that has it under
      the transfer rule. A reading outside a class's temperature or humidity band is logged by the facility as a work order; it does not
      change the rent, and damage it causes is a matter for the tenant's protection plan or own insurance.
    eligibility: []

# ============================================================================
# extended_policies (storage_unit_account_servicing)
# ============================================================================
extended_policies:
  - id: unit_ext_late_fee_schedule
    base_policy_refs: [unit_evt_late_fee]
    overwrite:
      - base_policy: unit_evt_late_fee
        superseded_clause: >-
          The late fee is the greater of late_fee_flat_usd and late_fee_pct_of_rent times the monthly rent, rounded to the cent, and
          never more than late_fee_max_usd.
        replaced_by: >-
          The late fee is figured in this order: first the late-fee percentage is applied once to the rent basis with any protection
          fee added, then that amount is multiplied by the tenancy share and by the returned-payment share, and the product is rounded
          to the cent, half up, once; that rounded amount is then compared with the late-fee floor, the greater of the two is kept, and
          the result is capped at the class's late-fee ceiling.
    trigger: state_due
    subject: [unit_fee_charge]
    computes: amount
    target_tool: assess_unit_late_fee_4b513073
    params:
      pct_add_three_or_more_late: 0.1
      pct_add_one_or_two_late: 0.05
      late_count_high: 3
      late_count_low: 1
      tenancy_long_months: 60
      tenancy_mid_months: 36
      tenancy_share_long: 0.8
      tenancy_share_mid: 0.9
      returned_share_only_return: 0.5
      returned_share_repeat_return: 0.7
      floor_small_rent: 10.0
      floor_mid_rent: 15.0
      rent_band_small: 100.0
      rent_band_mid: 200.0
    rule: >-
      A late fee is assessed once for a billing period whose rent is still unpaid after its grace days, and it is posted against that
      period's rent charge with the period's due date. Each billing period carries at most one late fee, and a period whose rent was
      fully paid by its last grace day is never charged one. The late fee is the greater of the class's flat late-fee floor and the
      class's late-fee percentage of the agreement's contracted monthly rent, rounded to the cent, half up, and never more than the
      class's late-fee ceiling. The rent basis of the late fee is set by what the period was billed: where the period's rent charge on
      the ledger is below the contracted monthly rent, the rent basis is that rent charge; where the period's rent charge is not below
      the contracted monthly rent and a noticed rent change took effect on the period's due date, the rent basis is the rent in force
      before that change; in every other case the rent basis is the contracted monthly rent. The late-fee percentage follows the
      agreement's lateness record, counted as the late fees posted on the agreement in the 12 months up to the handling date: three or more such late fees take the class's late-fee percentage plus 10 percentage points, one or two take it plus 5 points, and none takes the class's late-fee percentage. Where a Bluegate
      protection plan on the agreement is in active status, its monthly protection fee, billed on the same due date as the rent, is
      added to the rent basis before the percentage is applied; where the agreement's plan has lapsed, the protection fees it still
      owes are added instead; where no plan is attached to the agreement, nothing is added. The late fee carries a tenancy share,
      counted in whole calendar months from the move-in date to the handling date: an agreement in force 60 months or more pays 80
      percent of the late fee, one in force 36 to 59 months pays 90 percent, and a younger agreement pays it in full. Where the period's
      latest payment was dated within the period's grace days and the bank later returned it, the late fee carries a returned-payment
      share: when that return is the only payment the bank has returned on the agreement for insufficient funds or a closed account in
      the 12 months up to the handling date the tenant pays 50 percent of the late fee, when the bank has returned two or more payments
      on the agreement in those 12 months the tenant pays 70 percent; a period whose latest payment was not returned, or was made after
      the grace days, carries no returned-payment share. The late-fee floor follows the rent charged for the period: a rent charge under
      100 dollars takes a 10 dollar floor, a rent charge of 100 dollars or more but under 200 dollars takes a 15 dollar floor, and a rent
      charge of 200 dollars or more takes the class's flat late-fee floor. The late fee is figured in this order: first the late-fee
      percentage is applied once to the rent basis with any protection fee added, then that amount is multiplied by the tenancy share
      and by the returned-payment share, and the product is rounded to the cent, half up, once; that rounded amount is then compared
      with the late-fee floor, the greater of the two is kept, and the result is capped at the class's late-fee ceiling.
    prerequisite: []
    cross_category:
      - category: protect
        as: branch
        reads: [status, monthly_fee, premium_balance_due]
        note: "The protection-fee factor adds the active plan's monthly fee, or a lapsed plan's owed fees, to the late fee's rent basis."
    compute:
      - period_rent_charge: "LATEST('unit_ledger', 'amount', date_field='period_start', event_type='unit_rent_charge')"
      - period_due_date: "LATEST('unit_ledger', 'period_start', date_field='period_start', event_type='unit_rent_charge')"
      - changes_on_due_date: "COUNT('unit_rate_changes', effective_date=period_due_date)"
      - rent_before_change: "LATEST('unit_rate_changes', 'previous_rent', date_field='notice_date', effective_date=period_due_date)"
      - rent_basis: "period_rent_charge if period_rent_charge < F('monthly_rent') else (rent_before_change if changes_on_due_date > 0 else F('monthly_rent'))"
      - late_fees_12m: "COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_fee_charge', fee_type='late_fee')"
      - late_fee_pct: "P('late_fee_pct_of_rent') + K('pct_add_three_or_more_late') if late_fees_12m >= K('late_count_high') else (P('late_fee_pct_of_rent') + K('pct_add_one_or_two_late') if late_fees_12m >= K('late_count_low') else P('late_fee_pct_of_rent'))"
      - plan_active: "EXISTS('protect', rental_id=HID, status='active')"
      - plan_lapsed: "EXISTS('protect', rental_id=HID, status='lapsed')"
      - protection_basis: "CFIELD('protect', 'monthly_fee', rental_id=HID, status='active') if plan_active else (CFIELD('protect', 'premium_balance_due', rental_id=HID, status='lapsed') if plan_lapsed else 0)"
      - months_in_force: "MONTHS(F('move_in_date'), NOW)"
      - tenancy_share: "K('tenancy_share_long') if months_in_force >= K('tenancy_long_months') else (K('tenancy_share_mid') if months_in_force >= K('tenancy_mid_months') else 1)"
      - latest_payment_date: "LATEST('unit_ledger', 'entry_date', date_field='entry_date', event_type='unit_payment')"
      - latest_return_date: "LATEST('unit_ledger', 'entry_date', date_field='entry_date', event_type='unit_payment_reversal')"
      - paid_in_grace_then_returned: "latest_payment_date != None and latest_return_date != None and DAYS(period_due_date, latest_payment_date) >= 0 and DAYS(period_due_date, latest_payment_date) <= P('grace_period_days') and DAYS(latest_payment_date, latest_return_date) >= 0"
      - bank_returns_12m: "COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_payment_reversal', reversal_reason='ach_return_insufficient_funds') + COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_payment_reversal', reversal_reason='ach_return_account_closed')"
      - returned_share: "K('returned_share_only_return') if paid_in_grace_then_returned and bank_returns_12m == 1 else (K('returned_share_repeat_return') if paid_in_grace_then_returned and bank_returns_12m >= 2 else 1)"
      - charged_rent_level: "LATEST('unit_ledger', 'amount', date_field='period_start', event_type='unit_rent_charge')"
      - late_fee_floor: "K('floor_small_rent') if charged_rent_level < K('rent_band_small') else (K('floor_mid_rent') if charged_rent_level < K('rent_band_mid') else P('late_fee_flat_usd'))"
      - shared_fee: "RND(late_fee_pct * (rent_basis + protection_basis) * tenancy_share * returned_share, 2)"
      - result: "MN(P('late_fee_max_usd'), MX(late_fee_floor, shared_fee))"
    compute_basis:
      period_rent_charge: "where the period's rent charge on the ledger is below the contracted monthly rent, the rent basis is that rent charge"
      period_due_date: "it is posted against that period's rent charge with the period's due date"
      changes_on_due_date: "where the period's rent charge is not below the contracted monthly rent and a noticed rent change took effect on the period's due date, the rent basis is the rent in force before that change"
      rent_before_change: "the rent basis is the rent in force before that change"
      rent_basis: "The rent basis of the late fee is set by what the period was billed: where the period's rent charge on the ledger is below the contracted monthly rent, the rent basis is that rent charge; where the period's rent charge is not below the contracted monthly rent and a noticed rent change took effect on the period's due date, the rent basis is the rent in force before that change; in every other case the rent basis is the contracted monthly rent."
      late_fees_12m: "counted as the late fees posted on the agreement in the 12 months up to the handling date"
      late_fee_pct: "The late-fee percentage follows the agreement's lateness record, counted as the late fees posted on the agreement in the 12 months up to the handling date: three or more such late fees take the class's late-fee percentage plus 10 percentage points, one or two take it plus 5 points, and none takes the class's late-fee percentage."
      plan_active: "Where a Bluegate protection plan on the agreement is in active status"
      plan_lapsed: "where the agreement's plan has lapsed"
      protection_basis: "Where a Bluegate protection plan on the agreement is in active status, its monthly protection fee, billed on the same due date as the rent, is added to the rent basis before the percentage is applied; where the agreement's plan has lapsed, the protection fees it still owes are added instead; where no plan is attached to the agreement, nothing is added."
      months_in_force: "counted in whole calendar months from the move-in date to the handling date"
      tenancy_share: "The late fee carries a tenancy share, counted in whole calendar months from the move-in date to the handling date: an agreement in force 60 months or more pays 80 percent of the late fee, one in force 36 to 59 months pays 90 percent, and a younger agreement pays it in full."
      latest_payment_date: "Where the period's latest payment was dated within the period's grace days"
      latest_return_date: "and the bank later returned it"
      paid_in_grace_then_returned: "Where the period's latest payment was dated within the period's grace days and the bank later returned it"
      bank_returns_12m: "the only payment the bank has returned on the agreement for insufficient funds or a closed account in the 12 months up to the handling date"
      returned_share: "when that return is the only payment the bank has returned on the agreement for insufficient funds or a closed account in the 12 months up to the handling date the tenant pays 50 percent of the late fee, when the bank has returned two or more payments on the agreement in those 12 months the tenant pays 70 percent; a period whose latest payment was not returned, or was made after the grace days, carries no returned-payment share."
      charged_rent_level: "The late-fee floor follows the rent charged for the period"
      late_fee_floor: "The late-fee floor follows the rent charged for the period: a rent charge under 100 dollars takes a 10 dollar floor, a rent charge of 100 dollars or more but under 200 dollars takes a 15 dollar floor, and a rent charge of 200 dollars or more takes the class's flat late-fee floor."
      shared_fee: "first the late-fee percentage is applied once to the rent basis with any protection fee added, then that amount is multiplied by the tenancy share and by the returned-payment share, and the product is rounded to the cent, half up, once"
      result: "that rounded amount is then compared with the late-fee floor, the greater of the two is kept, and the result is capped at the class's late-fee ceiling."
    factors:
      - id: late_fee_rent_basis
        effect: method
        decides: rent_basis
        bindings: [period_rent_charge, changes_on_due_date, rent_before_change, rent_basis]
        ladder:
          - when: "the period's rent charge on the ledger is below the contracted monthly rent"
            method: "the percentage is applied to that period's rent charge as billed"
          - when: "the period's rent charge is not below the contracted monthly rent and a noticed rent change took effect on the period's due date"
            method: "the percentage is applied to the rent in force before that change"
          - when: "otherwise"
            method: "the percentage is applied to the contracted monthly rent"
        baseline:
          rent_basis: "F('monthly_rent')"
        evidence: [history]
        cross_difficulty: null
      - id: late_fee_lateness_percentage
        effect: parameter
        decides: late_fee_pct
        bindings: [late_fees_12m, late_fee_pct]
        ladder:
          - when: "three or more late fees posted on the agreement in the 12 months up to the handling date"
            value: "P('late_fee_pct_of_rent') + K('pct_add_three_or_more_late')"
          - when: "one or two late fees posted on the agreement in those 12 months"
            value: "P('late_fee_pct_of_rent') + K('pct_add_one_or_two_late')"
          - when: "otherwise"
            value: "P('late_fee_pct_of_rent')"
        baseline:
          late_fee_pct: "P('late_fee_pct_of_rent')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: late_fee_protection_fee_basis
        effect: method
        decides: protection_basis
        bindings: [plan_active, plan_lapsed, protection_basis]
        ladder:
          - when: "a Bluegate protection plan on the agreement is in active status"
            method: "the plan's monthly protection fee is added to the rent basis before the percentage is applied"
          - when: "the agreement's protection plan has lapsed"
            method: "the protection fees the lapsed plan still owes are added to the rent basis"
          - when: "otherwise"
            method: "the percentage is applied to the rent basis alone"
        baseline:
          protection_basis: "0"
        evidence: [cross_category]
        cross_difficulty: protect
      - id: late_fee_tenancy_share
        effect: parameter
        decides: tenancy_share
        bindings: [months_in_force, tenancy_share]
        ladder:
          - when: "the agreement has been in force 60 whole calendar months or more"
            value: "K('tenancy_share_long')"
          - when: "the agreement has been in force 36 to 59 whole calendar months"
            value: "K('tenancy_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          tenancy_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: late_fee_returned_payment_share
        effect: parameter
        decides: returned_share
        bindings: [latest_payment_date, latest_return_date, paid_in_grace_then_returned, bank_returns_12m, returned_share]
        ladder:
          - when: "the period's latest payment was dated within its grace days and later returned by the bank, and it is the only bank return on the agreement in the 12 months up to the handling date"
            value: "K('returned_share_only_return')"
          - when: "the period's latest payment was dated within its grace days and later returned by the bank, and the bank has returned two or more payments on the agreement in those 12 months"
            value: "K('returned_share_repeat_return')"
          - when: "otherwise"
            value: "1"
        baseline:
          returned_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_fee_floor_by_rent_charged
        effect: parameter
        decides: late_fee_floor
        bindings: [charged_rent_level, late_fee_floor]
        ladder:
          - when: "the rent charged for the period is under 100 dollars"
            value: "K('floor_small_rent')"
          - when: "the rent charged for the period is 100 dollars or more but under 200 dollars"
            value: "K('floor_mid_rent')"
          - when: "otherwise"
            value: "P('late_fee_flat_usd')"
        baseline:
          late_fee_floor: "P('late_fee_flat_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The late fee is the greater of the class's flat late-fee floor and the class's late-fee percentage of the agreement's
        contracted monthly rent, rounded to the cent, half up, and never more than the class's late-fee ceiling.
      params: [late_fee_flat_usd, late_fee_pct_of_rent, late_fee_max_usd]
    inputs:
      history:
        - {table: unit_ledger, aggregate: latest, field: amount, filters: {event_type: unit_rent_charge}}
        - {table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_fee_charge, fee_type: late_fee}}
        - {table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
        - {table: unit_ledger, aggregate: latest, field: entry_date, filters: {event_type: unit_payment}}
        - {table: unit_rate_changes, aggregate: count, field: rate_change_id, filters: {}}
      cross_category: [protect]

  - id: unit_ext_returned_payment_fee
    base_policy_refs: [unit_evt_late_fee, unit_evt_payment_acceptance]
    overwrite:
      - base_policy: unit_evt_payment_acceptance
        superseded_clause: >-
          When the bank returns a payment for insufficient funds or a closed account, the payment is reversed in full and
          returned_payment_fee_usd is posted against the reversed payment; a card chargeback is reversed without that fee.
        replaced_by: >-
          The returned-payment fee is figured in this order: first the fee level is limited by the returned amount, then that limited fee is multiplied by the tenancy share and by the AutoPay share, and the product is rounded to the cent, half up, once.
    trigger: state_due
    subject: [unit_fee_charge]
    computes: amount
    target_tool: post_unit_returned_payment_fee_fb0d77c5
    params:
      level_three_or_more_returns: 45.0
      level_two_returns: 40.0
      returns_high: 3
      returns_mid: 2
      small_return_band: 100.0
      mid_return_band: 250.0
      small_return_share: 0.25
      mid_return_share: 0.2
      tenancy_long_months: 48
      tenancy_mid_months: 24
      tenancy_share_long: 0.8
      tenancy_share_mid: 0.9
      autopay_window_days: 90
      suspended_autopay_share: 0.5
      cancelled_autopay_share: 0.75
    rule: >-
      When the bank returns a payment on the agreement for insufficient funds or because the account is closed, one returned-payment
      fee is posted against that returned payment, dated with the due date of the billing period the payment was for. The
      returned-payment fee is the class's returned-payment fee. The fee level follows the bank returns on the agreement, counted as the
      payments reversed for insufficient funds or a closed account in the 12 months up to the handling date with the return being
      charged included: three or more such returns take a 45 dollar level, two returns take a 40 dollar level, and a single return
      takes the class's returned-payment fee. The fee is limited by the size of the returned payment: where the returned amount is
      under 100 dollars the fee is the lesser of the level and 25 percent of the returned amount, where the returned amount is 100
      dollars or more but under 250 dollars the fee is the lesser of the level and 20 percent of the returned amount, each percentage
      amount rounded to the cent, and a returned amount of 250 dollars or more leaves the level unlimited. A card chargeback carries no returned-payment fee at all. The fee carries a tenancy share, counted in whole calendar months from the agreement's move-in date to the handling date, whatever unit the agreement has since been moved to: an agreement in force 48 months or more pays 80 percent of the fee, one in force 24 to 47 months pays 90 percent, and a younger agreement pays it in full. The fee carries an AutoPay share
      read from the agreement's AutoPay authorization: where Bluegate suspended that authorization within the 90 days up to the
      handling date the tenant pays 50 percent of the fee, where the tenant cancelled that authorization within those 90 days the
      tenant pays 75 percent, and in every other case the fee is charged in full. The returned-payment fee is figured in this order:
      first the fee level is limited by the returned amount, then that limited fee is multiplied by the tenancy share and by the AutoPay share, and the product is rounded to the cent, half up, once.
    prerequisite: []
    cross_category:
      - category: autopay
        as: branch
        reads: [status, suspension_date, cancellation_date]
        note: "The AutoPay-share factor reads when Bluegate suspended, or the tenant cancelled, the agreement's AutoPay authorization."
    compute:
      - bank_returns_counted: "COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_payment_reversal', reversal_reason='ach_return_insufficient_funds') + COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_payment_reversal', reversal_reason='ach_return_account_closed')"
      - fee_level: "K('level_three_or_more_returns') if bank_returns_counted >= K('returns_high') else (K('level_two_returns') if bank_returns_counted >= K('returns_mid') else P('returned_payment_fee_usd'))"
      - returned_amount: "LATEST('unit_ledger', 'amount', date_field='entry_date', event_type='unit_payment_reversal')"
      - limited_fee: "MN(fee_level, RND(returned_amount * K('small_return_share'), 2)) if returned_amount < K('small_return_band') else (MN(fee_level, RND(returned_amount * K('mid_return_share'), 2)) if returned_amount < K('mid_return_band') else fee_level)"
      - fee_months_in_force: "MONTHS(F('move_in_date'), NOW)"
      - fee_tenancy_share: "K('tenancy_share_long') if fee_months_in_force >= K('tenancy_long_months') else (K('tenancy_share_mid') if fee_months_in_force >= K('tenancy_mid_months') else 1)"
      - autopay_suspended_on: "CFIELD('autopay', 'suspension_date', agreement_id=HID, status='suspended')"
      - autopay_cancelled_on: "CFIELD('autopay', 'cancellation_date', agreement_id=HID, status='cancelled', end_reason='tenant_revoked')"
      - autopay_share: "K('suspended_autopay_share') if (autopay_suspended_on and DAYS(autopay_suspended_on, NOW) <= K('autopay_window_days')) else (K('cancelled_autopay_share') if (autopay_cancelled_on and DAYS(autopay_cancelled_on, NOW) <= K('autopay_window_days')) else 1)"
      - result: "RND(limited_fee * fee_tenancy_share * autopay_share, 2)"
    compute_basis:
      bank_returns_counted: "counted as the payments reversed for insufficient funds or a closed account in the 12 months up to the handling date with the return being charged included"
      fee_level: "The fee level follows the bank returns on the agreement, counted as the payments reversed for insufficient funds or a closed account in the 12 months up to the handling date with the return being charged included: three or more such returns take a 45 dollar level, two returns take a 40 dollar level, and a single return takes the class's returned-payment fee."
      returned_amount: "The fee is limited by the size of the returned payment"
      limited_fee: "where the returned amount is under 100 dollars the fee is the lesser of the level and 25 percent of the returned amount, where the returned amount is 100 dollars or more but under 250 dollars the fee is the lesser of the level and 20 percent of the returned amount, each percentage amount rounded to the cent, and a returned amount of 250 dollars or more leaves the level unlimited."
      fee_months_in_force: "counted in whole calendar months from the agreement's move-in date to the handling date, whatever unit the agreement has since been moved to"
      fee_tenancy_share: "an agreement in force 48 months or more pays 80 percent of the fee, one in force 24 to 47 months pays 90 percent, and a younger agreement pays it in full."
      autopay_suspended_on: "where Bluegate suspended that authorization within the 90 days up to the handling date"
      autopay_cancelled_on: "where the tenant cancelled that authorization within those 90 days"
      autopay_share: "The fee carries an AutoPay share read from the agreement's AutoPay authorization: where Bluegate suspended that authorization within the 90 days up to the handling date the tenant pays 50 percent of the fee, where the tenant cancelled that authorization within those 90 days the tenant pays 75 percent, and in every other case the fee is charged in full."
      result: "then that limited fee is multiplied by the tenancy share and by the AutoPay share, and the product is rounded to the cent, half up, once."
    factors:
      - id: returned_fee_level_by_returns
        effect: parameter
        decides: fee_level
        bindings: [bank_returns_counted, fee_level]
        ladder:
          - when: "three or more payments on the agreement reversed for insufficient funds or a closed account in the 12 months up to the handling date, the one being charged included"
            value: "K('level_three_or_more_returns')"
          - when: "exactly two such returns in those 12 months"
            value: "K('level_two_returns')"
          - when: "otherwise"
            value: "P('returned_payment_fee_usd')"
        baseline:
          fee_level: "P('returned_payment_fee_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: returned_fee_amount_limit
        effect: method
        decides: limited_fee
        bindings: [returned_amount, limited_fee]
        ladder:
          - when: "the returned amount is under 100 dollars"
            method: "the fee is the lesser of the level and 25 percent of the returned amount, rounded to the cent"
          - when: "the returned amount is 100 dollars or more but under 250 dollars"
            method: "the fee is the lesser of the level and 20 percent of the returned amount, rounded to the cent"
          - when: "otherwise"
            method: "the level is charged without any limit"
        baseline:
          limited_fee: "fee_level"
        evidence: [history]
        cross_difficulty: null
      - id: returned_fee_tenancy_share
        effect: parameter
        decides: fee_tenancy_share
        bindings: [fee_months_in_force, fee_tenancy_share]
        ladder:
          - when: "the agreement has been in force 48 whole calendar months or more, counted from its move-in date"
            value: "K('tenancy_share_long')"
          - when: "the agreement has been in force 24 to 47 whole calendar months, counted from its move-in date"
            value: "K('tenancy_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          fee_tenancy_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: returned_fee_autopay_share
        effect: parameter
        decides: autopay_share
        bindings: [autopay_suspended_on, autopay_cancelled_on, autopay_share]
        ladder:
          - when: "Bluegate suspended the agreement's AutoPay authorization within the 90 days up to the handling date"
            value: "K('suspended_autopay_share')"
          - when: "the tenant cancelled the agreement's AutoPay authorization within those 90 days"
            value: "K('cancelled_autopay_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          autopay_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: autopay
    baseline:
      rule: >-
        The returned-payment fee is the class's returned-payment fee.
      params: [returned_payment_fee_usd]
    inputs:
      history:
        - {table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
        - {table: unit_ledger, aggregate: latest, field: amount, filters: {event_type: unit_payment_reversal}}
        - {table: unit_rentals, aggregate: latest, field: move_in_date, filters: {}}
      cross_category: [autopay]

  - id: unit_ext_returned_payment_replacement
    base_policy_refs: [unit_agg_payment_allocation, unit_evt_payment_acceptance]
    overwrite: []
    trigger: on_request
    subject: [unit_payment]
    computes: amount
    target_tool: pay_unit_returned_balance_f137f581
    params:
      advance_two_months_returns: 4
      advance_one_month_returns: 2
      advance_months_high: 2
      advance_months_low: 1
      tenancy_long_months: 60
      tenancy_mid_months: 36
      advance_share_long: 0.5
      advance_share_mid: 0.75
    rule: >-
      A tenant whose payment the bank returned replaces it with one payment the tenant authorizes over the phone by credit card, debit
      card or bank account, applied only to the agreement the returned payment was for and recorded against that returned payment. The
      replacement amount is the balance due on the agreement. The replacement amount is fixed only after the ledger carries a late fee
      for every billing period whose rent remains unpaid past its grace days. The replacement amount is not fixed until every payment the
      bank has returned on the agreement carries its returned-payment fee. A tenant with repeated bank returns adds a security advance
      to the replacement, held on the agreement as a credit balance toward the next rent: the advance months follow the payments
      reversed on the agreement for insufficient funds or a closed account in the 12 months up to the handling date, four or more such
      returns calling for two advance months, two or three returns calling for one advance month, and a single return calling for none.
      The advance month is priced at the rent that will be in force on the next due date: where a retention concession has been
      noticed with an effective date after the handling date, its new rent is used; where no such concession is noticed and an
      existing-customer increase has been noticed with an effective date after the handling date, the increase's new rent is used;
      otherwise the contracted monthly rent is used. That rent is turned into the advance month the way the agreement bills it: where
      the agreement's planned vacate date falls on or before the last day of its latest billed period, no further period will be billed
      and the advance month is zero; where no such vacate date is set and the agreement carries the military discount, the class's
      military discount is taken off that rent and the result is rounded to the cent, half up; otherwise the rent is used as it stands.
      The security advance carries a tenancy share, counted in whole calendar months from the move-in date to the handling date: an
      agreement in force 60 months or more posts half the advance, one in force 36 to 59 months posts three quarters of it, and a
      younger agreement posts it in full. The security advance is the advance months times the advance month times that tenancy share,
      rounded to the cent, half up, and the replacement amount is the balance due plus the security advance; whatever the payment
      carries above the balance due stays on the agreement as a credit balance.
    prerequisite:
      - problem: unit_ext_late_fee_schedule
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The replacement amount is fixed only after the ledger carries a late fee for every billing period whose rent remains unpaid
          past its grace days.
        condition: >-
          Every billing period of the agreement whose rent is unpaid after its grace days has a late_fee entry on the unit ledger
          referencing its rent charge, so the agreement's balance due includes that late fee.
        resolved_by: assess_unit_late_fee_4b513073
        effect: >-
          Once the late fee for the unpaid period is posted, the agreement's balance due rises by that late fee, and the balance binding
          of the replacement amount carries it.
      - problem: unit_ext_returned_payment_fee
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The replacement amount is not fixed until every payment the bank has returned on the agreement carries its returned-payment
          fee.
        condition: >-
          Every unit_payment entry on the agreement that a unit_payment_reversal with reversal reason ach_return_insufficient_funds or ach_return_account_closed points at is itself pointed at by a returned_payment_fee entry, so the balance due includes each of those fees.
        resolved_by: post_unit_returned_payment_fee_fb0d77c5
        effect: >-
          Once the returned-payment fee for the latest bank return is posted, the agreement's balance due rises by that fee, and the
          balance binding of the replacement amount carries it.
    cross_category: []
    compute:
      - balance: "F('balance_due')"
      - bank_returns_for_advance: "COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_payment_reversal', reversal_reason='ach_return_insufficient_funds') + COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_payment_reversal', reversal_reason='ach_return_account_closed')"
      - advance_months: "K('advance_months_high') if bank_returns_for_advance >= K('advance_two_months_returns') else (K('advance_months_low') if bank_returns_for_advance >= K('advance_one_month_returns') else 0)"
      - concession_effective: "LATEST('unit_rate_changes', 'effective_date', date_field='effective_date', change_reason='retention_concession')"
      - concession_rent: "LATEST('unit_rate_changes', 'new_rent', date_field='effective_date', change_reason='retention_concession')"
      - increase_effective: "LATEST('unit_rate_changes', 'effective_date', date_field='effective_date', change_reason='existing_customer_rate_increase')"
      - increase_rent: "LATEST('unit_rate_changes', 'new_rent', date_field='effective_date', change_reason='existing_customer_rate_increase')"
      - next_due_rent: "concession_rent if (concession_effective and DAYS(NOW, concession_effective) > 0) else (increase_rent if (increase_effective and DAYS(NOW, increase_effective) > 0) else F('monthly_rent'))"
      - latest_period_end: "LATEST('unit_ledger', 'period_end', date_field='period_start', event_type='unit_rent_charge')"
      - vacate_before_next_due: "F('move_out_date') != '' and DAYS(F('move_out_date'), latest_period_end) >= 0"
      - advance_month: "0 if vacate_before_next_due else (RND(next_due_rent * (1 - P('military_discount_pct')), 2) if F('military_discount_applied') == True else next_due_rent)"
      - months_in_force: "MONTHS(F('move_in_date'), NOW)"
      - advance_share: "K('advance_share_long') if months_in_force >= K('tenancy_long_months') else (K('advance_share_mid') if months_in_force >= K('tenancy_mid_months') else 1)"
      - security_advance: "RND(advance_months * advance_month * advance_share, 2)"
      - result: "RND(balance + security_advance, 2)"
    compute_basis:
      balance: "The replacement amount is the balance due on the agreement."
      bank_returns_for_advance: "the advance months follow the payments reversed on the agreement for insufficient funds or a closed account in the 12 months up to the handling date"
      advance_months: "the advance months follow the payments reversed on the agreement for insufficient funds or a closed account in the 12 months up to the handling date, four or more such returns calling for two advance months, two or three returns calling for one advance month, and a single return calling for none."
      concession_effective: "where a retention concession has been noticed with an effective date after the handling date"
      concession_rent: "its new rent is used"
      increase_effective: "where no such concession is noticed and an existing-customer increase has been noticed with an effective date after the handling date"
      increase_rent: "the increase's new rent is used"
      next_due_rent: "The advance month is priced at the rent that will be in force on the next due date: where a retention concession has been noticed with an effective date after the handling date, its new rent is used; where no such concession is noticed and an existing-customer increase has been noticed with an effective date after the handling date, the increase's new rent is used; otherwise the contracted monthly rent is used."
      latest_period_end: "on or before the last day of its latest billed period"
      vacate_before_next_due: "where the agreement's planned vacate date falls on or before the last day of its latest billed period, no further period will be billed and the advance month is zero"
      advance_month: "That rent is turned into the advance month the way the agreement bills it: where the agreement's planned vacate date falls on or before the last day of its latest billed period, no further period will be billed and the advance month is zero; where no such vacate date is set and the agreement carries the military discount, the class's military discount is taken off that rent and the result is rounded to the cent, half up; otherwise the rent is used as it stands."
      months_in_force: "counted in whole calendar months from the move-in date to the handling date"
      advance_share: "The security advance carries a tenancy share, counted in whole calendar months from the move-in date to the handling date: an agreement in force 60 months or more posts half the advance, one in force 36 to 59 months posts three quarters of it, and a younger agreement posts it in full."
      security_advance: "The security advance is the advance months times the advance month times that tenancy share, rounded to the cent, half up"
      result: "the replacement amount is the balance due plus the security advance"
    factors:
      - id: replacement_advance_months
        effect: parameter
        decides: advance_months
        bindings: [bank_returns_for_advance, advance_months]
        ladder:
          - when: "four or more payments on the agreement reversed for insufficient funds or a closed account in the 12 months up to the handling date"
            value: "K('advance_months_high')"
          - when: "two or three such returns in those 12 months"
            value: "K('advance_months_low')"
          - when: "otherwise"
            value: "0"
        baseline:
          advance_months: "0"
        evidence: [history]
        cross_difficulty: null
      - id: replacement_next_due_rent
        effect: parameter
        decides: next_due_rent
        bindings: [concession_effective, concession_rent, increase_effective, increase_rent, next_due_rent]
        ladder:
          - when: "a retention concession is noticed on the agreement with an effective date after the handling date"
            value: "that concession's new rent"
          - when: "no such concession is noticed and an existing-customer increase is noticed with an effective date after the handling date"
            value: "that increase's new rent"
          - when: "otherwise"
            value: "F('monthly_rent')"
        baseline:
          next_due_rent: "F('monthly_rent')"
        evidence: [history, date]
        cross_difficulty: null
      - id: replacement_advance_month_billing
        effect: method
        decides: advance_month
        bindings: [latest_period_end, vacate_before_next_due, advance_month]
        ladder:
          - when: "the agreement's planned vacate date falls on or before the last day of its latest billed period"
            method: "no further period will be billed, so the advance month is zero"
          - when: "no such vacate date is set and the agreement carries the military discount"
            method: "the class's military discount is taken off the next-due rent and the result is rounded to the cent"
          - when: "otherwise"
            method: "the next-due rent is used as it stands"
        baseline:
          advance_month: "next_due_rent"
        evidence: [history, date]
        cross_difficulty: null
      - id: replacement_advance_tenancy_share
        effect: parameter
        decides: advance_share
        bindings: [months_in_force, advance_share]
        ladder:
          - when: "the agreement has been in force 60 whole calendar months or more"
            value: "K('advance_share_long')"
          - when: "the agreement has been in force 36 to 59 whole calendar months"
            value: "K('advance_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          advance_share: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The replacement amount is the balance due on the agreement.
      params: []
    inputs:
      history:
        - {table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
        - {table: unit_rate_changes, aggregate: latest, field: new_rent, filters: {}}
        - {table: unit_ledger, aggregate: latest, field: period_end, filters: {event_type: unit_rent_charge}}
      cross_category: []

  - id: unit_ext_good_standing_payment
    base_policy_refs: [unit_agg_payment_allocation, unit_evt_payment_acceptance]
    overwrite: []
    trigger: on_request
    subject: [unit_payment, unit_redemption]
    computes: amount
    target_tool: restore_unit_good_standing_afa2c723
    params:
      next_due_far_days: 28
      next_due_mid_days: 15
      due_share_far: 0.5
      due_share_mid: 0.75
      autopay_long_months: 12
      autopay_mid_months: 6
      autopay_share_long: 0.8
      autopay_share_mid: 0.9
      delinquency_short_days: 6
      delinquency_mid_days: 10
      delinquency_share_short: 0.8
      delinquency_share_mid: 0.9
      coverage_months_expired_card: 1
      coverage_months_suspended: 2
      late_fees_for_suspended: 2
    rule: >-
      A tenant brings a delinquent storage agreement back to good standing with one payment the tenant authorizes over the phone,
      applied only to that agreement; the payment returns the agreement to active status and clears its delinquency date. A payment that replaces a payment the bank returned is not a good-standing payment, even where the return has left the agreement delinquent: it is priced as the replacement of that returned payment. The
      good-standing amount is the agreement's balance due, worked out from the ledger as its rent, fee, reversal and refund entries less
      its payment, credit and sale-proceeds entries. Where the agreement's AutoPay cannot be relied on for the next due date, the
      good-standing amount also collects part of the next billing period, held on the agreement as a credit balance toward that rent.
      The next-period coverage follows the agreement's AutoPay authorization: where the authorization is in active status and its
      latest draft attempt was declined because the card on file has expired, one month is covered; where the authorization is
      suspended and the agreement carries two or more late fees posted in the 12 months up to the handling date, two months are
      covered; otherwise no month is covered. The covered month is priced the way the agreement bills: where the agreement's latest
      rent charge on the ledger is below its contracted monthly rent, the covered month is priced at that latest rent charge as billed;
      where the agreement carries the military discount but its latest rent charge is not below the contracted rent, the covered month
      is priced at the contracted rent less the class's military discount, rounded to the cent; otherwise the covered month is priced
      at the contracted monthly rent. The coverage carries a timing share counted in calendar days from the handling date to the next
      due date, the day after the last day of the latest billed period: a next due date more than 28 days away takes 50 percent, one
      15 to 28 days away takes 75 percent, and a nearer one takes the whole month. The coverage carries an AutoPay-history share
      counted in whole calendar months from the enrollment date of the agreement's active AutoPay authorization to the handling date:
      12 months or more takes 80 percent, 6 to 11 months takes 90 percent, and a shorter or missing authorization takes the whole
      amount. The coverage carries a delinquency share counted in calendar days from the agreement's delinquency date to the handling
      date: fewer than 6 days takes 80 percent, 6 to 9 days takes 90 percent, and 10 days or more takes the whole amount. The coverage is
      the covered months times the priced month times the timing share, the AutoPay-history share and the delinquency share, rounded
      to the cent, half up, once, and the good-standing amount is the balance due plus that coverage, rounded to the cent.
    prerequisite: []
    cross_category:
      - category: autopay
        as: history
        reads: [status, enrollment_date, autopay_drafts.result]
        note: "The coverage-months factor reads the authorization's status and its latest draft result; the AutoPay-history share reads its enrollment date."
    compute:
      - ledger_charges: "SUM('unit_ledger', 'amount', event_type='unit_rent_charge') + SUM('unit_ledger', 'amount', event_type='unit_fee_charge') + SUM('unit_ledger', 'amount', event_type='unit_payment_reversal') + SUM('unit_ledger', 'amount', event_type='unit_refund')"
      - ledger_reductions: "SUM('unit_ledger', 'amount', event_type='unit_payment') + SUM('unit_ledger', 'amount', event_type='unit_credit') + SUM('unit_ledger', 'amount', event_type='unit_sale_proceeds_applied')"
      - balance: "RND(ledger_charges - ledger_reductions, 2)"
      - autopay_active: "EXISTS('autopay', agreement_id=HID, status='active')"
      - autopay_suspended: "EXISTS('autopay', agreement_id=HID, status='suspended')"
      - latest_draft_result: "XLATEST('autopay', 'autopay_drafts', 'result', date_field='draft_date', agreement_id=HID, event_type='autopay_draft')"
      - late_fees_12m: "COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_fee_charge', fee_type='late_fee')"
      - coverage_months: "K('coverage_months_expired_card') if autopay_active and latest_draft_result == 'declined_expired_card' else (K('coverage_months_suspended') if autopay_suspended and late_fees_12m >= K('late_fees_for_suspended') else 0)"
      - latest_rent_charge: "LATEST('unit_ledger', 'amount', date_field='period_start', event_type='unit_rent_charge')"
      - covered_month: "latest_rent_charge if latest_rent_charge < F('monthly_rent') else (RND(F('monthly_rent') * (1 - P('military_discount_pct')), 2) if F('military_discount_applied') == True else F('monthly_rent'))"
      - latest_period_end: "LATEST('unit_ledger', 'period_end', date_field='period_start', event_type='unit_rent_charge')"
      - days_to_next_due: "DAYS(NOW, latest_period_end) + 1"
      - timing_share: "K('due_share_far') if days_to_next_due > K('next_due_far_days') else (K('due_share_mid') if days_to_next_due >= K('next_due_mid_days') else 1)"
      - autopay_enrolled_on: "CFIELD('autopay', 'enrollment_date', agreement_id=HID, status='active')"
      - autopay_months: "MONTHS(autopay_enrolled_on, NOW) if autopay_enrolled_on else 0"
      - autopay_history_share: "K('autopay_share_long') if autopay_months >= K('autopay_long_months') else (K('autopay_share_mid') if autopay_months >= K('autopay_mid_months') else 1)"
      - days_delinquent: "DAYS(F('delinquent_since'), NOW) if F('delinquent_since') != '' else 0"
      - delinquency_share: "K('delinquency_share_short') if days_delinquent < K('delinquency_short_days') else (K('delinquency_share_mid') if days_delinquent < K('delinquency_mid_days') else 1)"
      - coverage: "RND(coverage_months * covered_month * timing_share * autopay_history_share * delinquency_share, 2)"
      - result: "RND(balance + coverage, 2)"
    compute_basis:
      ledger_charges: "worked out from the ledger as its rent, fee, reversal and refund entries less its payment, credit and sale-proceeds entries"
      ledger_reductions: "less its payment, credit and sale-proceeds entries"
      balance: "The good-standing amount is the agreement's balance due, worked out from the ledger as its rent, fee, reversal and refund entries less its payment, credit and sale-proceeds entries."
      autopay_active: "where the authorization is in active status"
      autopay_suspended: "where the authorization is suspended"
      latest_draft_result: "its latest draft attempt was declined because the card on file has expired"
      late_fees_12m: "the agreement carries two or more late fees posted in the 12 months up to the handling date"
      coverage_months: "The next-period coverage follows the agreement's AutoPay authorization: where the authorization is in active status and its latest draft attempt was declined because the card on file has expired, one month is covered; where the authorization is suspended and the agreement carries two or more late fees posted in the 12 months up to the handling date, two months are covered; otherwise no month is covered."
      latest_rent_charge: "where the agreement's latest rent charge on the ledger is below its contracted monthly rent"
      covered_month: "The covered month is priced the way the agreement bills: where the agreement's latest rent charge on the ledger is below its contracted monthly rent, the covered month is priced at that latest rent charge as billed; where the agreement carries the military discount but its latest rent charge is not below the contracted rent, the covered month is priced at the contracted rent less the class's military discount, rounded to the cent; otherwise the covered month is priced at the contracted monthly rent."
      latest_period_end: "the next due date, the day after the last day of the latest billed period"
      days_to_next_due: "counted in calendar days from the handling date to the next due date, the day after the last day of the latest billed period"
      timing_share: "a next due date more than 28 days away takes 50 percent, one 15 to 28 days away takes 75 percent, and a nearer one takes the whole month."
      autopay_enrolled_on: "the enrollment date of the agreement's active AutoPay authorization"
      autopay_months: "counted in whole calendar months from the enrollment date of the agreement's active AutoPay authorization to the handling date"
      autopay_history_share: "12 months or more takes 80 percent, 6 to 11 months takes 90 percent, and a shorter or missing authorization takes the whole amount."
      days_delinquent: "counted in calendar days from the agreement's delinquency date to the handling date"
      delinquency_share: "fewer than 6 days takes 80 percent, 6 to 9 days takes 90 percent, and 10 days or more takes the whole amount."
      coverage: "The coverage is the covered months times the priced month times the timing share, the AutoPay-history share and the delinquency share, rounded to the cent, half up, once"
      result: "the good-standing amount is the balance due plus that coverage, rounded to the cent."
    factors:
      - id: good_standing_coverage_months
        effect: parameter
        decides: coverage_months
        bindings: [autopay_active, autopay_suspended, latest_draft_result, late_fees_12m, coverage_months]
        ladder:
          - when: "the agreement's AutoPay authorization is in active status and its latest draft attempt was declined because the card on file has expired"
            value: "K('coverage_months_expired_card')"
          - when: "the agreement's AutoPay authorization is suspended and the agreement carries two or more late fees posted in the 12 months up to the handling date"
            value: "K('coverage_months_suspended')"
          - when: "otherwise"
            value: "0"
        baseline:
          coverage_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: autopay
      - id: good_standing_covered_month_price
        effect: method
        decides: covered_month
        bindings: [latest_rent_charge, covered_month]
        ladder:
          - when: "the agreement's latest rent charge on the ledger is below its contracted monthly rent"
            method: "the covered month is priced at that latest rent charge as billed"
          - when: "the agreement carries the military discount but its latest rent charge is not below the contracted rent"
            method: "the covered month is the contracted rent less the class's military discount, rounded to the cent"
          - when: "otherwise"
            method: "the covered month is priced at the contracted monthly rent"
        baseline:
          covered_month: "F('monthly_rent')"
        evidence: [history]
        cross_difficulty: null
      - id: good_standing_timing_share
        effect: parameter
        decides: timing_share
        bindings: [latest_period_end, days_to_next_due, timing_share]
        ladder:
          - when: "the next due date is more than 28 calendar days after the handling date"
            value: "K('due_share_far')"
          - when: "the next due date is 15 to 28 calendar days after the handling date"
            value: "K('due_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          timing_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: good_standing_autopay_history_share
        effect: parameter
        decides: autopay_history_share
        bindings: [autopay_enrolled_on, autopay_months, autopay_history_share]
        ladder:
          - when: "the agreement's active AutoPay authorization was enrolled 12 or more whole calendar months before the handling date"
            value: "K('autopay_share_long')"
          - when: "it was enrolled 6 to 11 whole calendar months before the handling date"
            value: "K('autopay_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          autopay_history_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: autopay
      - id: good_standing_delinquency_share
        effect: parameter
        decides: delinquency_share
        bindings: [days_delinquent, delinquency_share]
        ladder:
          - when: "the agreement has been delinquent fewer than 6 calendar days"
            value: "K('delinquency_share_short')"
          - when: "it has been delinquent 6 to 9 calendar days"
            value: "K('delinquency_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          delinquency_share: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The good-standing amount is the agreement's balance due, worked out from the ledger as its rent, fee, reversal and refund
        entries less its payment, credit and sale-proceeds entries.
      params: []
    inputs:
      history:
        - {table: unit_ledger, aggregate: sum, field: amount, filters: {}}
        - {table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_fee_charge, fee_type: late_fee}}
        - {table: unit_ledger, aggregate: latest, field: amount, filters: {event_type: unit_rent_charge}}
        - {category: autopay, table: autopay_drafts, aggregate: latest, field: result, filters: {event_type: autopay_draft}}
      cross_category: [autopay]

  - id: unit_ext_increase_limit_correction
    base_policy_refs: [unit_evt_rate_increase]
    overwrite:
      - base_policy: unit_evt_rate_increase
        superseded_clause: >-
          The new rent is at most the current monthly rent times one plus rate_increase_max_pct, rounded down to the cent.
        replaced_by: >-
          The increase limit is figured in this order: first the limit percentage is the tenure maximum less the recent-increase, prepaid-plan, lien-record and lateness reductions, never less than zero, so that a reduction never sets the rent below the rent before the increase, then that percentage is applied once to the cap base and the allowed
          increase is rounded down to the cent, and the limit rent is the contracted monthly rent plus that allowed increase.
    trigger: state_due
    subject: [unit_rate_change_notice]
    computes: new_rent
    target_tool: reduce_unit_rate_increase_85726890
    params:
      tenure_long_months: 84
      tenure_mid_months: 48
      tenure_cut_long: 0.04
      tenure_cut_mid: 0.02
      limit_pct_floor: 0.0
      recent_two_reduction: 0.02
      recent_one_reduction: 0.01
      prepaid_window_months: 36
      prepaid_recent_reduction: 0.01
      prepaid_older_reduction: 0.005
      lien_window_months: 24
      lien_clean_reduction: 0.01
      lien_overlock_only_reduction: 0.005
      late_none_reduction: 0.025
      late_one_or_two_reduction: 0.01
      late_two: 2
    rule: >-
      An existing-customer increase noticed for a rent above the increase limit is cut back to the limit with a reduction notice that
      points at the increase, keeps its effective date and carries the limit rent as its new rent; an increase at or below the limit
      is left as noticed. A reduction of a noticed increase is noticed only once the agreement stands in active status with no
      delinquency date on it. The increase limit is the contracted monthly rent times one plus the class's largest single increase,
      rounded down to the cent. The tenure maximum follows the whole calendar months from the move-in date to the handling date: an agreement in force 84 months or more is limited to the class's largest single increase less 4 percentage points, one in force 48 to 83 months to it less 2 points, and a younger one to the class's largest single increase. The recent-increase reduction follows the existing-customer increases that took effect on
      the agreement in the 24 months up to the handling date: two or more take 2 percentage points off the tenure maximum, one takes
      1 point off, and none takes nothing off. The prepaid-plan reduction follows the tenant's Bluegate prepaid rent plans on the
      agreement: a plan completed within the 36 months up to the handling date takes 1 percentage point off, a plan completed earlier
      takes half a point off, and no completed plan takes nothing off. The lien-record reduction follows the agreement's lien steps in
      the 24 months up to the handling date: no lien step at all takes 1 percentage point off, overlock steps without any lien notice
      take half a point off, and a lien notice sent in that time takes nothing off. The lateness reduction follows the late fees posted
      on the agreement in the 12 months up to the handling date: none takes two and a half percentage points off, one or two take 1 point off, and
      three or more take nothing off. The cap base is the rent the percentage is applied to: where the agreement's latest rent charge
      on the ledger is below its contracted monthly rent, the cap base is that latest rent charge as billed; where the agreement's last
      rent change was a retention concession and no lower rent is billed, the cap base is the rent the conceded increase had noticed;
      otherwise the cap base is the contracted monthly rent. The increase limit is figured in this order: first the limit percentage is the tenure maximum less the recent-increase, prepaid-plan, lien-record and lateness reductions, never less than zero, so that a reduction never sets the rent below the rent before the increase, then that percentage is applied once to the cap base and the allowed increase is rounded down to the cent, and the limit rent is the contracted monthly rent plus
      that allowed increase. The reduction notice's new rent is the lesser of the noticed new rent and the limit rent.
    prerequisite:
      - problem: unit_ext_good_standing_payment
        kind: state_gate
        gate: unit_rentals.status
        form: state
        policy_source: >-
          A reduction of a noticed increase is noticed only once the agreement stands in active status with no delinquency date on
          it.
        condition: >-
          unit_rentals.status is active and unit_rentals.delinquent_since is empty for the agreement whose increase is reduced.
        resolved_by: restore_unit_good_standing_afa2c723
        effect: >-
          Once the tenant's good-standing payment lands, the agreement's status is active and its delinquency date is cleared, so the
          base rule that rent change notices go only to active rentals is met for the reduction notice.
    cross_category:
      - category: prepay
        as: history
        reads: [status, ended_date]
        note: "The prepaid-plan reduction reads when a Bluegate prepaid rent plan on the agreement was completed."
    compute:
      - increase_id: "LATEST('unit_rate_changes', 'rate_change_id', date_field='notice_date', change_reason='existing_customer_rate_increase')"
      - noticed_new_rent: "LATEST('unit_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase')"
      - months_in_force: "MONTHS(F('move_in_date'), NOW)"
      - tenure_maximum: "P('rate_increase_max_pct') - K('tenure_cut_long') if months_in_force >= K('tenure_long_months') else (P('rate_increase_max_pct') - K('tenure_cut_mid') if months_in_force >= K('tenure_mid_months') else P('rate_increase_max_pct'))"
      - recent_increases: "COUNT('unit_rate_changes', within_months=24, date_field='effective_date', change_reason='existing_customer_rate_increase')"
      - recent_reduction: "K('recent_two_reduction') if recent_increases >= 2 else (K('recent_one_reduction') if recent_increases == 1 else 0)"
      - prepaid_completed_on: "CFIELD('prepay', 'ended_date', agreement_id=HID, status='completed')"
      - prepaid_reduction: "K('prepaid_recent_reduction') if (prepaid_completed_on and MONTHS(prepaid_completed_on, NOW) < K('prepaid_window_months')) else (K('prepaid_older_reduction') if prepaid_completed_on else 0)"
      - lien_steps_24m: "COUNT('unit_lien_actions', within_months=24, date_field='action_date')"
      - lien_notices_24m: "COUNT('unit_lien_actions', within_months=24, date_field='action_date', lien_step='lien_notice_sent')"
      - lien_reduction: "K('lien_clean_reduction') if lien_steps_24m == 0 else (K('lien_overlock_only_reduction') if lien_notices_24m == 0 else 0)"
      - late_fees_12m: "COUNT('unit_ledger', within_months=12, date_field='entry_date', event_type='unit_fee_charge', fee_type='late_fee')"
      - lateness_reduction: "K('late_none_reduction') if late_fees_12m == 0 else (K('late_one_or_two_reduction') if late_fees_12m <= K('late_two') else 0)"
      - latest_rent_charge: "LATEST('unit_ledger', 'amount', date_field='period_start', event_type='unit_rent_charge')"
      - concession_last: "COUNT('unit_rate_changes', change_reason='retention_concession', effective_date=F('last_rate_change_date'))"
      - conceded_increase_rent: "LATEST('unit_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase', effective_date=F('last_rate_change_date'))"
      - cap_base: "latest_rent_charge if latest_rent_charge < F('monthly_rent') else (conceded_increase_rent if concession_last > 0 else F('monthly_rent'))"
      - limit_pct: "MX(K('limit_pct_floor'), tenure_maximum - recent_reduction - prepaid_reduction - lien_reduction - lateness_reduction)"
      - allowed_increase: "int(cap_base * limit_pct * 100 + 1e-9) / 100"
      - limit_rent: "RND(F('monthly_rent') + allowed_increase, 2)"
      - result: "MN(noticed_new_rent, limit_rent)"
    compute_basis:
      increase_id: "An existing-customer increase noticed for a rent above the increase limit is cut back to the limit with a reduction notice that points at the increase"
      noticed_new_rent: "The reduction notice's new rent is the lesser of the noticed new rent and the limit rent."
      months_in_force: "The tenure maximum follows the whole calendar months from the move-in date to the handling date"
      tenure_maximum: "an agreement in force 84 months or more is limited to the class's largest single increase less 4 percentage points, one in force 48 to 83 months to it less 2 points, and a younger one to the class's largest single increase."
      recent_increases: "the existing-customer increases that took effect on the agreement in the 24 months up to the handling date"
      recent_reduction: "two or more take 2 percentage points off the tenure maximum, one takes 1 point off, and none takes nothing off."
      prepaid_completed_on: "The prepaid-plan reduction follows the tenant's Bluegate prepaid rent plans on the agreement"
      prepaid_reduction: "a plan completed within the 36 months up to the handling date takes 1 percentage point off, a plan completed earlier takes half a point off, and no completed plan takes nothing off."
      lien_steps_24m: "The lien-record reduction follows the agreement's lien steps in the 24 months up to the handling date"
      lien_notices_24m: "a lien notice sent in that time takes nothing off"
      lien_reduction: "no lien step at all takes 1 percentage point off, overlock steps without any lien notice take half a point off, and a lien notice sent in that time takes nothing off."
      late_fees_12m: "The lateness reduction follows the late fees posted on the agreement in the 12 months up to the handling date"
      lateness_reduction: "none takes two and a half percentage points off, one or two take 1 point off, and three or more take nothing off."
      latest_rent_charge: "where the agreement's latest rent charge on the ledger is below its contracted monthly rent"
      concession_last: "where the agreement's last rent change was a retention concession and no lower rent is billed"
      conceded_increase_rent: "the cap base is the rent the conceded increase had noticed"
      cap_base: "The cap base is the rent the percentage is applied to: where the agreement's latest rent charge on the ledger is below its contracted monthly rent, the cap base is that latest rent charge as billed; where the agreement's last rent change was a retention concession and no lower rent is billed, the cap base is the rent the conceded increase had noticed; otherwise the cap base is the contracted monthly rent."
      limit_pct: "first the limit percentage is the tenure maximum less the recent-increase, prepaid-plan, lien-record and lateness reductions, never less than zero, so that a reduction never sets the rent below the rent before the increase"
      allowed_increase: "then that percentage is applied once to the cap base and the allowed increase is rounded down to the cent"
      limit_rent: "the limit rent is the contracted monthly rent plus that allowed increase."
      result: "The reduction notice's new rent is the lesser of the noticed new rent and the limit rent."
    factors:
      - id: increase_limit_tenure_maximum
        effect: parameter
        decides: tenure_maximum
        bindings: [months_in_force, tenure_maximum]
        ladder:
          - when: "the agreement has been in force 84 whole calendar months or more"
            value: "P('rate_increase_max_pct') - K('tenure_cut_long')"
          - when: "the agreement has been in force 48 to 83 whole calendar months"
            value: "P('rate_increase_max_pct') - K('tenure_cut_mid')"
          - when: "otherwise"
            value: "P('rate_increase_max_pct')"
        baseline:
          tenure_maximum: "P('rate_increase_max_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: increase_limit_recent_increases
        effect: parameter
        decides: recent_reduction
        bindings: [recent_increases, recent_reduction]
        ladder:
          - when: "two or more existing-customer increases took effect on the agreement in the 24 months up to the handling date"
            value: "K('recent_two_reduction')"
          - when: "exactly one such increase took effect in those 24 months"
            value: "K('recent_one_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          recent_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: increase_limit_prepaid_plan
        effect: parameter
        decides: prepaid_reduction
        bindings: [prepaid_completed_on, prepaid_reduction]
        ladder:
          - when: "a Bluegate prepaid rent plan on the agreement was completed within the 36 months up to the handling date"
            value: "K('prepaid_recent_reduction')"
          - when: "a prepaid rent plan on the agreement was completed earlier than that"
            value: "K('prepaid_older_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          prepaid_reduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: prepay
      - id: increase_limit_lien_record
        effect: parameter
        decides: lien_reduction
        bindings: [lien_steps_24m, lien_notices_24m, lien_reduction]
        ladder:
          - when: "no lien step was taken on the agreement in the 24 months up to the handling date"
            value: "K('lien_clean_reduction')"
          - when: "lien steps were taken in those 24 months but no lien notice was sent"
            value: "K('lien_overlock_only_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          lien_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: increase_limit_lateness
        effect: parameter
        decides: lateness_reduction
        bindings: [late_fees_12m, lateness_reduction]
        ladder:
          - when: "no late fee posted on the agreement in the 12 months up to the handling date"
            value: "K('late_none_reduction')"
          - when: "one or two late fees posted in those 12 months"
            value: "K('late_one_or_two_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          lateness_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: increase_limit_cap_base
        effect: method
        decides: cap_base
        bindings: [latest_rent_charge, concession_last, conceded_increase_rent, cap_base]
        ladder:
          - when: "the agreement's latest rent charge on the ledger is below its contracted monthly rent"
            method: "the limit percentage is applied to that latest rent charge as billed"
          - when: "the agreement's last rent change was a retention concession and no lower rent is billed"
            method: "the limit percentage is applied to the rent the conceded increase had noticed"
          - when: "otherwise"
            method: "the limit percentage is applied to the contracted monthly rent"
        baseline:
          cap_base: "F('monthly_rent')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The increase limit is the contracted monthly rent times one plus the class's largest single increase, rounded down to the
        cent. The reduction notice's new rent is the lesser of the noticed new rent and the limit rent.
      params: [rate_increase_max_pct]
    inputs:
      history:
        - {table: unit_rate_changes, aggregate: count, field: rate_change_id, within_months: 24, filters: {change_reason: existing_customer_rate_increase}}
        - {table: unit_lien_actions, aggregate: count, field: lien_action_id, within_months: 24, filters: {}}
        - {table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_fee_charge, fee_type: late_fee}}
        - {table: unit_ledger, aggregate: latest, field: amount, filters: {event_type: unit_rent_charge}}
      cross_category: [prepay]

  - id: unit_ext_retention_concession
    base_policy_refs: [unit_evt_rate_increase]
    overwrite:
      - base_policy: unit_evt_rate_increase
        superseded_clause: >-
          A tenant who calls about a noticed increase may be given one retention_concession that gives back
          retention_concession_pct_of_increase of the increase, rounded down to the cent, with the same effective date and its
          source_rate_change_id pointing at the increase.
        replaced_by: >-
          A tenant who calls about a noticed existing-customer increase within the request window is given one retention concession,
          noticed with the increase's effective date and pointing at the increase, whose new rent is the increase's rent as it stands
          less the give-back, the give-back rounded down to the cent.
    trigger: on_request
    subject: [unit_rate_change_notice]
    computes: new_rent
    target_tool: grant_unit_retention_concession_f9ae06a9
    params:
      share_no_concession: 0.6
      share_one_concession: 0.55
      concession_window_months: 36
      autopay_bank_bonus: 0.1
      autopay_card_bonus: 0.05
      parking_current_bonus: 0.05
      parking_owing_bonus: 0.02
      stable_long_months: 24
      stable_mid_months: 12
      stable_long_bonus: 0.05
      stable_mid_bonus: 0.02
      lead_short_days: 35
      lead_mid_days: 50
      lead_short_bonus: 0.03
      lead_mid_bonus: 0.01
      steep_increase_pct: 0.08
      moderate_increase_pct: 0.05
      first_band_pct: 0.05
      steep_extra: 0.2
      moderate_extra: 0.1
    rule: >-
      A tenant who calls about a noticed existing-customer increase within the request window is given one retention concession,
      noticed with the increase's effective date and pointing at the increase, whose new rent is the increase's rent as it stands
      less the give-back, the give-back rounded down to the cent. The increase's rent as it stands is the new rent of the reduction
      notice pointing at the increase where one is on file, and otherwise the increase's own new rent; the increase is that rent less
      the rent before the increase. The retention concession is not figured until the agreement's rent changes show its noticed
      increase at or within the increase limit. The new rent is the increase's rent as it stands less a give-back of the class's retention share of the increase, rounded down to the cent. The retention share
      starts from the agreement's concession history, counted as the retention concessions noticed on the agreement in the 36 months
      up to the handling date: none starts the share at 60 percent, one starts it at 55 percent, and two or more start it at the
      class's retention share. An AutoPay authorization in active status on the agreement adds to the share by its payment rail: a
      bank-account authorization adds 10 percentage points, a card authorization adds 5 points, and no active authorization adds
      nothing. A Bluegate parking agreement in the tenant's name adds to the share by its standing: an active parking agreement that
      owes nothing adds 5 percentage points, an active parking agreement that carries a balance adds 2 points, and no active parking
      agreement adds nothing. The time since the agreement's last rent change adds to the share, counted in whole calendar months from
      that change's effective date to the handling date: 24 months or more adds 5 percentage points, 12 to 23 months adds 2 points, and
      a more recent change adds nothing. The increase's notice lead time adds to the share, counted in calendar days from the increase
      notice date to its effective date: 35 days or fewer adds 3 percentage points, 36 to 50 days adds 1 point, and a longer lead time
      adds nothing. The give-back is figured on the increase in bands measured against the rent before the increase: where the increase is 8 percent or more of that rent, the part of the increase up to 5 percent of that rent is given back at the retention share and the part above it at the share plus 20 percentage points, never more than the whole of that part; where the increase is 5 percent or more but under 8 percent, the part up to 5 percent is given back at the share and the part above it at the share plus 10 percentage points, never more than the whole of that part; where the increase is under 5 percent, the whole increase is given back at the share. The concession is figured in this order: first the retention share is added up from
      its starting point and the four additions, then the give-back is figured on the increase's bands with that share and rounded
      down to the cent, and the new rent is the increase's rent as it stands less the give-back.
    prerequisite:
      - problem: unit_ext_increase_limit_correction
        kind: value_input
        gate: rent_as_stands
        form: state
        policy_source: >-
          The retention concession is not figured until the agreement's rent changes show its noticed increase at or within the
          increase limit.
        condition: >-
          Either the existing-customer increase's new rent is at or below the increase limit, or a reduction notice (change reason
          increase_rescinded) pointing at that increase carries the limit rent as its new rent.
        resolved_by: reduce_unit_rate_increase_85726890
        effect: >-
          Once the reduction notice is on file, the increase's rent as it stands becomes the limit rent instead of the noticed new
          rent, which lowers the increase the give-back is figured on and the band it falls in.
    cross_category:
      - category: autopay
        as: branch
        reads: [status, payment_rail]
        note: "The AutoPay addition reads the payment rail of the agreement's active AutoPay authorization."
      - category: parking
        as: branch
        reads: [status, balance_due]
        note: "The parking addition reads whether the tenant holds an active parking agreement and what it owes."
    compute:
      - increase_id: "LATEST('unit_rate_changes', 'rate_change_id', date_field='notice_date', change_reason='existing_customer_rate_increase')"
      - increase_new_rent: "LATEST('unit_rate_changes', 'new_rent', date_field='notice_date', change_reason='existing_customer_rate_increase')"
      - increase_notice_date: "LATEST('unit_rate_changes', 'notice_date', date_field='notice_date', change_reason='existing_customer_rate_increase')"
      - increase_effective_date: "LATEST('unit_rate_changes', 'effective_date', date_field='notice_date', change_reason='existing_customer_rate_increase')"
      - rent_before_increase: "MAX('unit_rate_changes', 'previous_rent', rate_change_id=increase_id)"
      - reductions_on_file: "COUNT('unit_rate_changes', change_reason='increase_rescinded', source_rate_change_id=increase_id)"
      - reduced_rent: "LATEST('unit_rate_changes', 'new_rent', date_field='notice_date', change_reason='increase_rescinded', source_rate_change_id=increase_id)"
      - rent_as_stands: "reduced_rent if reductions_on_file > 0 else increase_new_rent"
      - increase_amount: "rent_as_stands - rent_before_increase"
      - concessions_36m: "COUNT('unit_rate_changes', within_months=36, date_field='notice_date', change_reason='retention_concession')"
      - share_start: "K('share_no_concession') if concessions_36m == 0 else (K('share_one_concession') if concessions_36m == 1 else P('retention_concession_pct_of_increase'))"
      - autopay_rail: "CPARAM('autopay', 'payment_rail', agreement_id=HID, status='active')"
      - autopay_addition: "K('autopay_bank_bonus') if autopay_rail == 'ach' else (K('autopay_card_bonus') if autopay_rail == 'card_network' else 0)"
      - parking_active: "EXISTS('parking', status='active')"
      - parking_owed: "CFIELD('parking', 'balance_due', status='active')"
      - parking_addition: "K('parking_current_bonus') if parking_active and parking_owed <= 0 else (K('parking_owing_bonus') if parking_active and parking_owed > 0 else 0)"
      - months_since_change: "MONTHS(F('last_rate_change_date'), NOW)"
      - stability_addition: "K('stable_long_bonus') if months_since_change >= K('stable_long_months') else (K('stable_mid_bonus') if months_since_change >= K('stable_mid_months') else 0)"
      - lead_days: "DAYS(increase_notice_date, increase_effective_date)"
      - lead_addition: "K('lead_short_bonus') if lead_days <= K('lead_short_days') else (K('lead_mid_bonus') if lead_days <= K('lead_mid_days') else 0)"
      - retention_share: "share_start + autopay_addition + parking_addition + stability_addition + lead_addition"
      - first_band: "MN(increase_amount, rent_before_increase * K('first_band_pct'))"
      - give_back_raw: "retention_share * first_band + MN(1, retention_share + K('steep_extra')) * (increase_amount - first_band) if increase_amount >= rent_before_increase * K('steep_increase_pct') else (retention_share * first_band + MN(1, retention_share + K('moderate_extra')) * (increase_amount - first_band) if increase_amount >= rent_before_increase * K('moderate_increase_pct') else retention_share * increase_amount)"
      - give_back: "int(give_back_raw * 100 + 1e-9) / 100"
      - result: "RND(rent_as_stands - give_back, 2)"
    compute_basis:
      increase_id: "pointing at the increase"
      increase_new_rent: "and otherwise the increase's own new rent"
      increase_notice_date: "counted in calendar days from the increase notice date to its effective date"
      increase_effective_date: "noticed with the increase's effective date"
      rent_before_increase: "the increase is that rent less the rent before the increase"
      reductions_on_file: "the new rent of the reduction notice pointing at the increase where one is on file"
      reduced_rent: "The increase's rent as it stands is the new rent of the reduction notice pointing at the increase where one is on file"
      rent_as_stands: "The increase's rent as it stands is the new rent of the reduction notice pointing at the increase where one is on file, and otherwise the increase's own new rent"
      increase_amount: "the increase is that rent less the rent before the increase."
      concessions_36m: "counted as the retention concessions noticed on the agreement in the 36 months up to the handling date"
      share_start: "The retention share starts from the agreement's concession history, counted as the retention concessions noticed on the agreement in the 36 months up to the handling date: none starts the share at 60 percent, one starts it at 55 percent, and two or more start it at the class's retention share."
      autopay_rail: "An AutoPay authorization in active status on the agreement adds to the share by its payment rail"
      autopay_addition: "a bank-account authorization adds 10 percentage points, a card authorization adds 5 points, and no active authorization adds nothing."
      parking_active: "A Bluegate parking agreement in the tenant's name adds to the share by its standing"
      parking_owed: "an active parking agreement that carries a balance adds 2 points"
      parking_addition: "an active parking agreement that owes nothing adds 5 percentage points, an active parking agreement that carries a balance adds 2 points, and no active parking agreement adds nothing."
      months_since_change: "counted in whole calendar months from that change's effective date to the handling date"
      stability_addition: "24 months or more adds 5 percentage points, 12 to 23 months adds 2 points, and a more recent change adds nothing."
      lead_days: "counted in calendar days from the increase notice date to its effective date"
      lead_addition: "35 days or fewer adds 3 percentage points, 36 to 50 days adds 1 point, and a longer lead time adds nothing."
      retention_share: "first the retention share is added up from its starting point and the four additions"
      first_band: "the part of the increase up to 5 percent of that rent"
      give_back_raw: "The give-back is figured on the increase in bands measured against the rent before the increase: where the increase is 8 percent or more of that rent, the part of the increase up to 5 percent of that rent is given back at the retention share and the part above it at the share plus 20 percentage points, never more than the whole of that part; where the increase is 5 percent or more but under 8 percent, the part up to 5 percent is given back at the share and the part above it at the share plus 10 percentage points, never more than the whole of that part; where the increase is under 5 percent, the whole increase is given back at the share."
      give_back: "then the give-back is figured on the increase's bands with that share and rounded down to the cent"
      result: "the new rent is the increase's rent as it stands less the give-back."
    factors:
      - id: concession_history_start
        effect: parameter
        decides: share_start
        bindings: [concessions_36m, share_start]
        ladder:
          - when: "no retention concession noticed on the agreement in the 36 months up to the handling date"
            value: "K('share_no_concession')"
          - when: "exactly one retention concession noticed in those 36 months"
            value: "K('share_one_concession')"
          - when: "otherwise"
            value: "P('retention_concession_pct_of_increase')"
        baseline:
          share_start: "P('retention_concession_pct_of_increase')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: concession_autopay_rail
        effect: parameter
        decides: autopay_addition
        bindings: [autopay_rail, autopay_addition]
        ladder:
          - when: "an AutoPay authorization in active status on the agreement drafts a bank account"
            value: "K('autopay_bank_bonus')"
          - when: "an AutoPay authorization in active status on the agreement drafts a card"
            value: "K('autopay_card_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          autopay_addition: "0"
        evidence: [cross_category]
        cross_difficulty: autopay
      - id: concession_parking_standing
        effect: parameter
        decides: parking_addition
        bindings: [parking_active, parking_owed, parking_addition]
        ladder:
          - when: "the tenant holds an active Bluegate parking agreement and that agreement owes nothing"
            value: "K('parking_current_bonus')"
          - when: "the tenant holds an active Bluegate parking agreement and that agreement carries a balance"
            value: "K('parking_owing_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          parking_addition: "0"
        evidence: [cross_category]
        cross_difficulty: parking
      - id: concession_rent_stability
        effect: parameter
        decides: stability_addition
        bindings: [months_since_change, stability_addition]
        ladder:
          - when: "the agreement's last rent change took effect 24 or more whole calendar months before the handling date"
            value: "K('stable_long_bonus')"
          - when: "it took effect 12 to 23 whole calendar months before the handling date"
            value: "K('stable_mid_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          stability_addition: "0"
        evidence: [date]
        cross_difficulty: null
      - id: concession_notice_lead_time
        effect: parameter
        decides: lead_addition
        bindings: [increase_notice_date, increase_effective_date, lead_days, lead_addition]
        ladder:
          - when: "the increase was noticed 35 or fewer calendar days before its effective date"
            value: "K('lead_short_bonus')"
          - when: "it was noticed 36 to 50 calendar days before its effective date"
            value: "K('lead_mid_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          lead_addition: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: concession_banded_give_back
        effect: method
        decides: give_back_raw
        bindings: [rent_before_increase, first_band, give_back_raw]
        ladder:
          - when: "the increase is 8 percent or more of the rent before it"
            method: "the part up to 5 percent of that rent is given back at the share and the part above it at the share plus 20 percentage points, never more than that whole part"
          - when: "the increase is 5 percent or more but under 8 percent of the rent before it"
            method: "the part up to 5 percent of that rent is given back at the share and the part above it at the share plus 10 percentage points, never more than that whole part"
          - when: "otherwise"
            method: "the whole increase is given back at the share"
        baseline:
          give_back_raw: "retention_share * increase_amount"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The increase's rent as it stands is the new rent of the reduction notice pointing at the increase where one is on file,
        and otherwise the increase's own new rent; the increase is that rent less the rent before the increase. The new rent is the
        increase's rent as it stands less a give-back of the class's retention share of the increase, rounded down to the cent.
      params: [retention_concession_pct_of_increase]
    inputs:
      history:
        - {table: unit_rate_changes, aggregate: latest, field: new_rent, filters: {change_reason: existing_customer_rate_increase}}
        - {table: unit_rate_changes, aggregate: count, field: rate_change_id, within_months: 36, filters: {change_reason: retention_concession}}
        - {table: unit_rate_changes, aggregate: latest, field: new_rent, filters: {change_reason: increase_rescinded}}
      cross_category: [autopay, parking]
