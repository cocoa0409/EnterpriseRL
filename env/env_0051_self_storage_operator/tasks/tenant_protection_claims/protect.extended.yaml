    factors:
      - id: reconsideration_jewelry_cap
        effect: parameter
        decides: jewelry_cap
        bindings: [plan_months, jewelry_cap]
        ladder:
          - when: "the plan's effective date is 36 or more whole months before the loss date"
            value: "jewelry_furs_watches_sublimit_usd times K('jewelry_long_multiple')"
          - when: "the plan's effective date is at least 12 and fewer than 36 whole months before the loss date"
            value: "jewelry_furs_watches_sublimit_usd times K('jewelry_mid_multiple')"
          - when: "otherwise"
            value: "jewelry_furs_watches_sublimit_usd"
        baseline:
          jewelry_cap: "P('jewelry_furs_watches_sublimit_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: reconsideration_electronics_cap
        effect: parameter
        decides: electronics_cap
        bindings: [alarm_e, drive_up_e, electronics_cap]
        ladder:
          - when: "the covered unit's class includes an individual door alarm"
            value: "electronics_sublimit_usd times K('electronics_alarm_multiple')"
          - when: "the covered unit's class has no door alarm and no drive-up access"
            value: "electronics_sublimit_usd times K('electronics_interior_multiple')"
          - when: "otherwise"
            value: "electronics_sublimit_usd"
