          electronics_cap: "P('electronics_sublimit_usd')"
        evidence: [cross_category, tier_param]
        cross_difficulty: unit
      - id: reconsideration_burglary_deductible_base
        effect: method
        decides: deductible_base
        bindings: [drive_up_d, deductible_base]
        ladder:
          - when: "the claim's peril is burglary and the covered unit's class has drive-up access"
            method: "the deductible base is 10 percent of the settled total, never less than deductible_usd"
          - when: "the claim's peril is burglary and the covered unit's class has no drive-up access"
            method: "the deductible base is 5 percent of the settled total, never less than deductible_usd"
          - when: "otherwise"
            method: "the deductible base is the flat deductible_usd"
        baseline:
          deductible_base: "P('deductible_usd')"
        evidence: [history, cross_category]
        cross_difficulty: unit
      - id: reconsideration_tenure_share
        effect: parameter
        decides: tenure_share
        bindings: [rental_months, rent_reversals, tenure_share]
        ladder:
          - when: "the covered rental's move-in date is 60 or more whole months before the loss date and its ledger shows no rent payment reversal in the 12 whole months before the handling date"
            value: "K('share_long')"
          - when: "the move-in date is at least 24 and fewer than 60 whole months before the loss date and the ledger shows no such reversal"
            value: "K('share_mid')"
          - when: "otherwise"
