  - id: protect_ext_duplicate_payment_repayment
    base_policy_refs: [protect_evt_claim_payment_void]
    overwrite:
      - base_policy: protect_evt_claim_payment_void
        superseded_clause: >-
          A claim payment is voided in full when it was issued in error or returned undeliverable; an undeliverable payment is
          reissued by the other payment method once the tenant confirms details.
        replaced_by: >-
          A second claim payment issued in error after the approval was already paid, once the tenant has cashed it, is settled by the
          tenant repaying the claim money paid above the claim's re-settled entitlement, and the repaid amount is recorded as a void of
          that second payment with the reason issued_in_error.
    trigger: state_due
    subject: [protect_claim_payment_voided]
    computes: amount
    target_tool: repay_duplicate_claim_payment_968ba4e6
    params:
      burglary_drive_up_pct: 0.10
      burglary_interior_pct: 0.05
      tenure_long_months: 60
      tenure_mid_months: 24
      share_long: 0.5
      share_mid: 0.75
      reversal_window_months: 12
      history_window_months: 36
      history_one_factor: 1.25
      history_two_factor: 1.5
      history_three_factor: 1.75
      electronics_alarm_multiple: 1.5
      electronics_interior_multiple: 1.25
      plan_long_months: 36
      plan_mid_months: 12
      jewelry_long_multiple: 1.5
      jewelry_mid_multiple: 1.2
    rule: >
      A second claim payment issued in error after the approval was already paid, once the tenant has cashed it, is settled by the
      tenant repaying the claim money paid above the claim's re-settled entitlement, and the repaid amount is recorded as a void of
      that second payment with the reason issued_in_error. A second payment of this kind is sent as a mailed check, so the claim
      repaid is the claim of the most recent mailed-check claim payment on the plan; its loss date and peril are read from the claim
      as filed and its property values are those of the latest adjuster assessment recorded on that claim.
      The standard re-settlement of a duplicate payment takes the general-property value plus each special-class value capped at its
      sublimit, caps that sum at coverage_limit_usd and subtracts a deductible of deductible_usd, never going below zero, which gives
      the re-settled entitlement.
      The duplicate repayment is the net claim money paid on the claim minus the re-settled entitlement, never below zero, rounded
      to the cent only at this final step, and it is recorded against the claim's most recent mailed-check payment.
      The duplicate re-settlement's jewelry cap is jewelry_furs_watches_sublimit_usd multiplied by 1.5 when the plan's effective date
      is 36 or more whole months before the loss date, by 1.2 when it is at least 12 and fewer than 36 whole months before the loss
      date, and by 1 otherwise.
      The duplicate re-settlement's electronics cap is electronics_sublimit_usd multiplied by 1.5 when the covered unit's class
      includes an individual door alarm, by 1.25 when the class has no door alarm and no drive-up access, and by 1 otherwise.
      The duplicate re-settlement total is the general-property value plus the jewelry value capped at the duplicate re-settlement's
      jewelry cap plus the electronics value capped at its electronics cap plus the collectibles, firearms and business-inventory
      values each capped at its sublimit, and that sum is capped at coverage_limit_usd.
      The duplicate re-settlement's deductible base is deductible_usd, except that for a burglary claim on a unit whose class has
      drive-up access it is 10 percent of the duplicate re-settlement total, and for a burglary claim on a unit whose class has no
      drive-up access it is 5 percent of that total, in both burglary situations never less than deductible_usd.
      The duplicate re-settlement's tenure share is 0.5 when the covered rental's move-in date is 60 or more whole months before the
      loss date and the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.75 when
      the move-in date is at least 24 and fewer than 60 whole months before the loss date and the ledger shows no such reversal,
      and 1 otherwise.
      The duplicate re-settlement's claim-history factor is 1.75 when three or more other paid claims on the plan have a loss date
      in the 36 whole months before the handling date, 1.5 when exactly two do, 1.25 when exactly one does, and 1 when none does.
      The re-settled entitlement is the duplicate re-settlement total minus the deductible base multiplied by the tenure share and
      then by the claim-history factor, never below zero.
    baseline:
      rule: >-
        A second payment of this kind is sent as a mailed check, so the claim repaid is the claim of the most recent mailed-check
        claim payment on the plan; its loss date and peril are read from the claim as filed and its property values are those of the
        latest adjuster assessment recorded on that claim. The standard re-settlement of a duplicate payment takes the
        general-property value plus each special-class value capped at its sublimit, caps that sum at coverage_limit_usd and subtracts
        a deductible of deductible_usd, never going below zero, which gives the re-settled entitlement. The duplicate repayment is the
        net claim money paid on the claim minus the re-settled entitlement, never below zero, rounded to the cent only at this final
        step, and it is recorded against the claim's most recent mailed-check payment.
      params: [coverage_limit_usd, deductible_usd, jewelry_furs_watches_sublimit_usd, electronics_sublimit_usd, collectibles_art_sublimit_usd, firearms_sublimit_usd, business_inventory_sublimit_usd]
    prerequisite: []
    cross_category:
      - category: unit
        as: branch
        reads: [move_in_date, unit_ledger.event_type, unit_ledger.entry_date, drive_up_access, door_alarm_included]
        note: The covered rental's move-in date and rent reversals decide the tenure share; its class features decide the burglary deductible base and the electronics cap.
    compute:
      - claim: "LATEST('protect_claim_events','claim_id', event_type='protect_claim_payment', claim_payment_method='mailed_check')"
      - loss_date: "LATEST('protect_claims','loss_date', date_field='filed_date', claim_id=claim)"
      - peril: "LATEST('protect_claims','peril', date_field='filed_date', claim_id=claim)"
      - paid: "SUM('protect_claim_events','amount', event_type='protect_claim_payment', claim_id=claim)"
      - voided: "SUM('protect_claim_events','amount', event_type='protect_claim_payment_voided', claim_id=claim)"
      - gen_value: "float(LATEST('protect_claim_events','assessed_general_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - jewelry_value: "float(LATEST('protect_claim_events','assessed_jewelry_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - electronics_value: "float(LATEST('protect_claim_events','assessed_electronics_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - collectibles_value: "float(LATEST('protect_claim_events','assessed_collectibles_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - firearms_value: "float(LATEST('protect_claim_events','assessed_firearms_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - inventory_value: "float(LATEST('protect_claim_events','assessed_business_inventory_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - plan_months: "MONTHS(F('effective_date'), loss_date)"
      - jewelry_cap: "P('jewelry_furs_watches_sublimit_usd') * (K('jewelry_long_multiple') if plan_months >= K('plan_long_months') else (K('jewelry_mid_multiple') if plan_months >= K('plan_mid_months') else 1.0))"
      - alarm_e: "CPARAM('unit','door_alarm_included', rental_id=F('rental_id'))"
      - drive_up_e: "CPARAM('unit','drive_up_access', rental_id=F('rental_id'))"
      - electronics_cap: "P('electronics_sublimit_usd') * (K('electronics_alarm_multiple') if alarm_e else (K('electronics_interior_multiple') if (not alarm_e and not drive_up_e) else 1.0))"
      - settled_total: "MN(P('coverage_limit_usd'), gen_value + MN(jewelry_value, jewelry_cap) + MN(electronics_value, electronics_cap) + MN(collectibles_value, P('collectibles_art_sublimit_usd')) + MN(firearms_value, P('firearms_sublimit_usd')) + MN(inventory_value, P('business_inventory_sublimit_usd')))"
      - drive_up_d: "CPARAM('unit','drive_up_access', rental_id=F('rental_id'))"
      - deductible_base: "MX(P('deductible_usd'), settled_total * K('burglary_drive_up_pct')) if (peril == 'burglary' and drive_up_d) else (MX(P('deductible_usd'), settled_total * K('burglary_interior_pct')) if (peril == 'burglary' and not drive_up_d) else P('deductible_usd'))"
      - rental_months: "MONTHS(CFIELD('unit','move_in_date', rental_id=F('rental_id')), loss_date)"
      - rent_reversals: "XCOUNT('unit','unit_ledger', within_months=K('reversal_window_months'), date_field='entry_date', event_type='unit_payment_reversal', rental_id=F('rental_id'))"
      - tenure_share: "K('share_long') if (rental_months >= K('tenure_long_months') and rent_reversals == 0) else (K('share_mid') if (rental_months >= K('tenure_mid_months') and rental_months < K('tenure_long_months') and rent_reversals == 0) else 1.0)"
      - other_paid_claims: "COUNT('protect_claims', within_months=K('history_window_months'), date_field='loss_date', claim_status='paid') - 1"
      - history_factor: "K('history_three_factor') if other_paid_claims >= 3 else (K('history_two_factor') if other_paid_claims == 2 else (K('history_one_factor') if other_paid_claims == 1 else 1.0))"
      - entitlement: "MX(0, settled_total - deductible_base * tenure_share * history_factor)"
      - result: "RND(MX(0, (paid - voided) - entitlement), 2)"
    compute_basis:
      claim: "the claim repaid is the claim of the most recent mailed-check claim payment on the plan"
      loss_date: "its loss date and peril are read from the claim as filed"
      peril: "its loss date and peril are read from the claim as filed"
      paid: "The duplicate repayment is the net claim money paid on the claim minus the re-settled entitlement"
      voided: "The duplicate repayment is the net claim money paid on the claim minus the re-settled entitlement"
      gen_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      jewelry_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      electronics_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      collectibles_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      firearms_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      inventory_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      plan_months: "when the plan's effective date is 36 or more whole months before the loss date"
      jewelry_cap: "The duplicate re-settlement's jewelry cap is jewelry_furs_watches_sublimit_usd multiplied by 1.5 when the plan's effective date is 36 or more whole months before the loss date, by 1.2 when it is at least 12 and fewer than 36 whole months before the loss date, and by 1 otherwise."
      alarm_e: "when the covered unit's class includes an individual door alarm"
      drive_up_e: "when the class has no door alarm and no drive-up access"
      electronics_cap: "The duplicate re-settlement's electronics cap is electronics_sublimit_usd multiplied by 1.5 when the covered unit's class includes an individual door alarm, by 1.25 when the class has no door alarm and no drive-up access, and by 1 otherwise."
      settled_total: "The duplicate re-settlement total is the general-property value plus the jewelry value capped at the duplicate re-settlement's jewelry cap plus the electronics value capped at its electronics cap plus the collectibles, firearms and business-inventory values each capped at its sublimit, and that sum is capped at coverage_limit_usd."
      drive_up_d: "for a burglary claim on a unit whose class has drive-up access"
      deductible_base: "The duplicate re-settlement's deductible base is deductible_usd, except that for a burglary claim on a unit whose class has drive-up access it is 10 percent of the duplicate re-settlement total, and for a burglary claim on a unit whose class has no drive-up access it is 5 percent of that total, in both burglary situations never less than deductible_usd."
      rental_months: "when the covered rental's move-in date is 60 or more whole months before the loss date"
      rent_reversals: "the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date"
      tenure_share: "The duplicate re-settlement's tenure share is 0.5 when the covered rental's move-in date is 60 or more whole months before the loss date and the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.75 when the move-in date is at least 24 and fewer than 60 whole months before the loss date and the ledger shows no such reversal, and 1 otherwise."
      other_paid_claims: "three or more other paid claims on the plan have a loss date in the 36 whole months before the handling date"
      history_factor: "The duplicate re-settlement's claim-history factor is 1.75 when three or more other paid claims on the plan have a loss date in the 36 whole months before the handling date, 1.5 when exactly two do, 1.25 when exactly one does, and 1 when none does."
      entitlement: "The re-settled entitlement is the duplicate re-settlement total minus the deductible base multiplied by the tenure share and then by the claim-history factor, never below zero."
      result: "The duplicate repayment is the net claim money paid on the claim minus the re-settled entitlement, never below zero, rounded to the cent only at this final step"
    factors:
      - id: duplicate_jewelry_cap
        effect: parameter
        decides: jewelry_cap
        bindings: [plan_months, jewelry_cap]
        ladder:
          - when: "the plan's effective date is 36 or more whole months before the loss date"
            value: "jewelry_furs_watches_sublimit_usd times K('jewelry_long_multiple')"
          - when: "the plan's effective date is at least 12 and fewer than 36 whole months before the loss date"
            value: "jewelry_furs_watches_sublimit_usd times K('jewelry_mid_multiple')"
          - when: "otherwise"
            value: "jewelry_furs_watches_sublimit_usd"
        baseline:
          jewelry_cap: "P('jewelry_furs_watches_sublimit_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: duplicate_electronics_cap
        effect: parameter
        decides: electronics_cap
        bindings: [alarm_e, drive_up_e, electronics_cap]
        ladder:
          - when: "the covered unit's class includes an individual door alarm"
            value: "electronics_sublimit_usd times K('electronics_alarm_multiple')"
          - when: "the covered unit's class has no door alarm and no drive-up access"
            value: "electronics_sublimit_usd times K('electronics_interior_multiple')"
          - when: "otherwise"
            value: "electronics_sublimit_usd"
        baseline:
          electronics_cap: "P('electronics_sublimit_usd')"
        evidence: [cross_category, tier_param]
        cross_difficulty: unit
      - id: duplicate_burglary_deductible_base
        effect: method
        decides: deductible_base
        bindings: [drive_up_d, deductible_base]
        ladder:
          - when: "the claim's peril is burglary and the covered unit's class has drive-up access"
            method: "the deductible base is 10 percent of the duplicate re-settlement total, never less than deductible_usd"
          - when: "the claim's peril is burglary and the covered unit's class has no drive-up access"
            method: "the deductible base is 5 percent of the duplicate re-settlement total, never less than deductible_usd"
          - when: "otherwise"
            method: "the deductible base is the flat deductible_usd"
        baseline:
          deductible_base: "P('deductible_usd')"
        evidence: [history, cross_category]
        cross_difficulty: unit
      - id: duplicate_tenure_share
        effect: parameter
        decides: tenure_share
        bindings: [rental_months, rent_reversals, tenure_share]
        ladder:
          - when: "the covered rental's move-in date is 60 or more whole months before the loss date and its ledger shows no rent payment reversal in the 12 whole months before the handling date"
            value: "K('share_long')"
          - when: "the move-in date is at least 24 and fewer than 60 whole months before the loss date and the ledger shows no such reversal"
            value: "K('share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          tenure_share: "1.0"
        evidence: [cross_category, date, history]
        cross_difficulty: unit
      - id: duplicate_claim_history
        effect: parameter
        decides: history_factor
        bindings: [other_paid_claims, history_factor]
        ladder:
          - when: "three or more other paid claims on the plan have a loss date in the 36 whole months before the handling date"
            value: "K('history_three_factor')"
          - when: "exactly two other paid claims on the plan have a loss date in that window"
            value: "K('history_two_factor')"
          - when: "exactly one other paid claim on the plan has a loss date in that window"
            value: "K('history_one_factor')"
          - when: "otherwise"
            value: "1"
        baseline:
          history_factor: "1.0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: protect_claim_events, aggregate: sum, field: amount, filters: {event_type: protect_claim_payment}}
        - {table: protect_claim_events, aggregate: latest, field: assessed_general_value, filters: {event_type: protect_claim_assessment}}
        - {table: protect_claims, aggregate: count, field: claim_id, within_months: 36, filters: {claim_status: paid}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
      cross_category: [unit]

  - id: protect_ext_late_claim_payment
    base_policy_refs: [protect_agg_annual_aggregate, protect_evt_claim_settlement]
    overwrite:
      - base_policy: protect_evt_claim_settlement
        superseded_clause: >-
          The approved amount is paid within claim_payment_issue_days by direct deposit or mailed check, per claim_payment_methods,
          and each approval is paid once.
        replaced_by: >-
          An approval still unpaid after claim_payment_issue_days is paid once, by direct deposit, as the outstanding approved amount
          plus late-payment interest.
    trigger: state_due
    subject: [protect_claim_payment]
    computes: amount
    target_tool: issue_late_claim_payment_da72d11f
    params:
      rate_long: 0.18
      rate_mid: 0.12
      rate_short: 0.06
      waited_long_days: 71
      waited_mid_days: 41
      waited_short_days: 11
      building_failure_uplift: 0.03
      work_order_uplift: 0.01
      tenure_long_months: 60
      tenure_mid_months: 24
      reversal_window_months: 12
      tenure_long_uplift: 0.02
      tenure_mid_uplift: 0.01
    rule: >
      An approval still unpaid after claim_payment_issue_days is paid once, by direct deposit, as the outstanding approved amount
      plus late-payment interest. The claim paid is the most recently filed claim on the plan whose handling status is approved; its
      outstanding approved amount is the amount of its latest decision minus the claim money, net of voids, already paid on it, and
      a claim with no decision event on file has nothing outstanding.
      The standard late payment is the outstanding approved amount with no interest added, rounded to the cent, and the standard late
      clock counts the calendar days from the decision date to the handling date minus claim_payment_issue_days, never below zero.
      A late claim payment is issued only once every second payment that a mailed check made on the plan for an already paid
      approval carries a repayment void.
      The late clock starts where the claims desk's own delay began: when the decision came more than twice claim_decision_target_days
      after the date of the claim's latest adjuster assessment, the late days are the calendar days from that assessment date to the
      handling date minus claim_payment_issue_days; when it came more than claim_decision_target_days and at most twice that after the
      assessment, the late days are the calendar days from the assessment date to the handling date minus claim_decision_target_days
      and minus claim_payment_issue_days; otherwise the late days follow the standard late clock; in every case never below zero.
      The late-payment rate is 0.18 a year when 71 or more calendar days have passed since the decision date, 0.12 when 41 to 70
      have, 0.06 when 11 to 40 have, and nothing when 10 or fewer have.
      The building-failure uplift is 0.03 a year when the claim carries a facility work-order reference and its peril is sudden water
      damage or roof collapse, 0.01 when it carries a work-order reference with any other peril, and nothing otherwise.
      The tenure uplift is 0.02 a year when the covered rental's move-in date is 60 or more whole months before the handling date and
      the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.01 when the move-in date
      is at least 24 and fewer than 60 whole months before the handling date and the ledger shows no such reversal, and nothing
      otherwise.
      The interest rate applied is the late-payment rate plus the two uplifts when there are late days, and nothing when there are
      none.
      The late payment is the outstanding approved amount plus the outstanding approved amount times the interest rate applied times
      the late days divided by 365, rounded to the cent only at this final step.
    baseline:
      rule: >-
        The claim paid is the most recently filed claim on the plan whose handling status is approved; its outstanding approved
        amount is the amount of its latest decision minus the claim money, net of voids, already paid on it, and a claim with no
        decision event on file has nothing outstanding. The standard late payment is the outstanding approved amount with no interest
        added, rounded to the cent, and the standard late clock counts the calendar days from the decision date to the handling date
        minus claim_payment_issue_days, never below zero.
      params: [claim_payment_issue_days]
    prerequisite:
      - problem: protect_ext_duplicate_payment_repayment
        kind: state_gate
        gate: protect_claim_events.void_reason
        form: state
        policy_source: >-
          A late claim payment is issued only once every second payment that a mailed check made on the plan for an already paid
          approval carries a repayment void.
        condition: >-
          Every mailed-check claim payment on the plan that was issued after an earlier payment had already paid the same approval has
          a void entry referencing it.
        resolved_by: repay_duplicate_claim_payment_968ba4e6
        effect: >-
          The duplicate check carries its repayment void, so no unrecovered duplicate claim money stands on the plan when further claim
          money is sent and the duplicate's re-settlement is fixed before this payment changes the plan's paid claims.
    cross_category:
      - category: unit
        as: branch
        reads: [move_in_date, unit_ledger.event_type, unit_ledger.entry_date]
        note: The covered rental's move-in date and rent reversals decide the tenure uplift.
    compute:
      - claim: "LATEST('protect_claims','claim_id', date_field='filed_date', claim_status='approved')"
      - approved: "float(LATEST('protect_claim_events','amount', event_type='protect_claim_decision', claim_id=claim) or 0)"
      - decided_on: "LATEST('protect_claim_events','event_date', event_type='protect_claim_decision', claim_id=claim)"
      - decisions: "COUNT('protect_claim_events', event_type='protect_claim_decision', claim_id=claim)"
      - paid: "SUM('protect_claim_events','amount', event_type='protect_claim_payment', claim_id=claim)"
      - voided: "SUM('protect_claim_events','amount', event_type='protect_claim_payment_voided', claim_id=claim)"
      - outstanding: "MX(0, approved - (paid - voided)) if decisions >= 1 else 0.0"
      - assessed_on: "LATEST('protect_claim_events','event_date', event_type='protect_claim_assessment', claim_id=claim)"
      - decision_gap: "DAYS(assessed_on, decided_on)"
      - late_days: "MX(0, DAYS(assessed_on, NOW) - P('claim_payment_issue_days')) if decision_gap > 2 * P('claim_decision_target_days') else (MX(0, DAYS(assessed_on, NOW) - P('claim_decision_target_days') - P('claim_payment_issue_days')) if decision_gap > P('claim_decision_target_days') else MX(0, DAYS(decided_on, NOW) - P('claim_payment_issue_days')))"
      - days_waited: "DAYS(decided_on, NOW)"
      - late_rate: "K('rate_long') if days_waited >= K('waited_long_days') else (K('rate_mid') if days_waited >= K('waited_mid_days') else (K('rate_short') if days_waited >= K('waited_short_days') else 0.0))"
      - work_order: "LATEST('protect_claims','facility_incident_reference', date_field='filed_date', claim_id=claim)"
      - peril: "LATEST('protect_claims','peril', date_field='filed_date', claim_id=claim)"
      - failure_uplift: "K('building_failure_uplift') if (work_order != '' and (peril == 'water_damage_sudden' or peril == 'roof_collapse')) else (K('work_order_uplift') if work_order != '' else 0.0)"
      - tenure_months: "MONTHS(CFIELD('unit','move_in_date', rental_id=F('rental_id')), NOW)"
      - rent_reversals: "XCOUNT('unit','unit_ledger', within_months=K('reversal_window_months'), date_field='entry_date', event_type='unit_payment_reversal', rental_id=F('rental_id'))"
      - tenure_uplift: "K('tenure_long_uplift') if (tenure_months >= K('tenure_long_months') and rent_reversals == 0) else (K('tenure_mid_uplift') if (tenure_months >= K('tenure_mid_months') and tenure_months < K('tenure_long_months') and rent_reversals == 0) else 0.0)"
      - interest_rate: "(late_rate + failure_uplift + tenure_uplift) if late_days > 0 else 0.0"
      - result: "RND(outstanding + outstanding * interest_rate * late_days / 365.0, 2)"
    compute_basis:
      claim: "The claim paid is the most recently filed claim on the plan whose handling status is approved"
      approved: "its outstanding approved amount is the amount of its latest decision minus the claim money, net of voids, already paid on it"
      decided_on: "the standard late clock counts the calendar days from the decision date to the handling date minus claim_payment_issue_days, never below zero"
      decisions: "a claim with no decision event on file has nothing outstanding"
      paid: "minus the claim money, net of voids, already paid on it"
      voided: "minus the claim money, net of voids, already paid on it"
      outstanding: "its outstanding approved amount is the amount of its latest decision minus the claim money, net of voids, already paid on it, and a claim with no decision event on file has nothing outstanding"
      assessed_on: "after the date of the claim's latest adjuster assessment"
      decision_gap: "when the decision came more than twice claim_decision_target_days after the date of the claim's latest adjuster assessment"
      late_days: "The late clock starts where the claims desk's own delay began: when the decision came more than twice claim_decision_target_days after the date of the claim's latest adjuster assessment, the late days are the calendar days from that assessment date to the handling date minus claim_payment_issue_days; when it came more than claim_decision_target_days and at most twice that after the assessment, the late days are the calendar days from the assessment date to the handling date minus claim_decision_target_days and minus claim_payment_issue_days; otherwise the late days follow the standard late clock; in every case never below zero."
      days_waited: "when 71 or more calendar days have passed since the decision date"
      late_rate: "The late-payment rate is 0.18 a year when 71 or more calendar days have passed since the decision date, 0.12 when 41 to 70 have, 0.06 when 11 to 40 have, and nothing when 10 or fewer have."
      work_order: "when the claim carries a facility work-order reference"
      peril: "its peril is sudden water damage or roof collapse"
      failure_uplift: "The building-failure uplift is 0.03 a year when the claim carries a facility work-order reference and its peril is sudden water damage or roof collapse, 0.01 when it carries a work-order reference with any other peril, and nothing otherwise."
      tenure_months: "when the covered rental's move-in date is 60 or more whole months before the handling date"
      rent_reversals: "the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date"
      tenure_uplift: "The tenure uplift is 0.02 a year when the covered rental's move-in date is 60 or more whole months before the handling date and the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.01 when the move-in date is at least 24 and fewer than 60 whole months before the handling date and the ledger shows no such reversal, and nothing otherwise."
      interest_rate: "The interest rate applied is the late-payment rate plus the two uplifts when there are late days, and nothing when there are none."
      result: "The late payment is the outstanding approved amount plus the outstanding approved amount times the interest rate applied times the late days divided by 365, rounded to the cent only at this final step."
    factors:
      - id: late_payment_rate
        effect: parameter
        decides: late_rate
        bindings: [days_waited, late_rate]
        ladder:
          - when: "71 or more calendar days have passed since the decision date"
            value: "K('rate_long')"
          - when: "41 to 70 calendar days have passed since the decision date"
            value: "K('rate_mid')"
          - when: "11 to 40 calendar days have passed since the decision date"
            value: "K('rate_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          late_rate: "0.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: late_clock_start
        effect: method
        decides: late_days
        bindings: [decision_gap, late_days]
        ladder:
          - when: "the decision came more than twice claim_decision_target_days after the claim's latest adjuster assessment"
            method: "the late days run from the assessment date, less claim_payment_issue_days"
          - when: "the decision came more than claim_decision_target_days and at most twice that after the assessment"
            method: "the late days run from the assessment date, less claim_decision_target_days and less claim_payment_issue_days"
          - when: "otherwise"
            method: "the late days run from the decision date, less claim_payment_issue_days"
        baseline:
          late_days: "MX(0, DAYS(decided_on, NOW) - P('claim_payment_issue_days'))"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: building_failure_uplift
        effect: parameter
        decides: failure_uplift
        bindings: [work_order, peril, failure_uplift]
        ladder:
          - when: "the claim carries a facility work-order reference and its peril is sudden water damage or roof collapse"
            value: "K('building_failure_uplift')"
          - when: "the claim carries a work-order reference with any other peril"
            value: "K('work_order_uplift')"
          - when: "otherwise"
            value: "0"
        baseline:
          failure_uplift: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: late_payment_tenure_uplift
        effect: parameter
        decides: tenure_uplift
        bindings: [tenure_months, rent_reversals, tenure_uplift]
        ladder:
          - when: "the covered rental's move-in date is 60 or more whole months before the handling date and its ledger shows no rent payment reversal in the 12 whole months before the handling date"
            value: "K('tenure_long_uplift')"
          - when: "the move-in date is at least 24 and fewer than 60 whole months before the handling date and the ledger shows no such reversal"
            value: "K('tenure_mid_uplift')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_uplift: "0.0"
        evidence: [cross_category, date, history]
        cross_difficulty: unit
    inputs:
      history:
        - {table: protect_claim_events, aggregate: latest, field: amount, filters: {event_type: protect_claim_decision}}
        - {table: protect_claim_events, aggregate: count, field: claim_event_id, filters: {event_type: protect_claim_decision}}
        - {table: protect_claim_events, aggregate: sum, field: amount, filters: {event_type: protect_claim_payment}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
      cross_category: [unit]

  - id: protect_ext_credit_balance_refund
    base_policy_refs: [protect_evt_fee_billing]
    overwrite:
      - base_policy: protect_evt_fee_billing
        superseded_clause: >-
          A credit balance left on a cancelled or terminated plan is refunded to the original payment method within 21 calendar days.
        replaced_by: >-
          A credit balance left on a cancelled or terminated plan is refunded once, to the original payment method, as the credit
          balance plus late-refund interest when the refund is made after the 21-day refund period.
    trigger: state_due
    subject: [protect_premium_refund]
    computes: amount
    target_tool: refund_plan_credit_balance_dd5eed31
    params:
      refund_days: 21
      refund_rate_long: 0.12
      refund_rate_short: 0.06
      ended_long_days: 61
      ended_short_days: 31
      error_credit_uplift: 0.03
      free_look_uplift: 0.01
      repeat_two_uplift: 0.02
      repeat_one_uplift: 0.01
      tenure_long_months: 60
      tenure_mid_months: 24
      tenure_long_uplift: 0.02
      tenure_mid_uplift: 0.01
    rule: >
      A credit balance left on a cancelled or terminated plan is refunded once, to the original payment method, as the credit
      balance plus late-refund interest when the refund is made after the 21-day refund period. The credit balance is the fees
      collected plus the fee credits minus the fees charged and the refunds already paid on the plan, never below zero.
      The standard refund is the credit balance with no interest added, rounded to the cent, and the standard refund clock counts
      the calendar days from the date the plan ended to the handling date minus 21, never below zero.
      The refund clock starts at the event that left the balance: when the plan's fee ledger carries a fee credit, the late days are
      the calendar days from the latest fee credit to the handling date minus 21; when it carries no fee credit and the plan has a
      cancellation request, the late days are the calendar days from the latest cancellation request date to the handling date
      minus 21; otherwise the late days follow the standard refund clock; in every case never below zero.
      The late-refund rate is 0.12 a year when the plan ended 61 or more calendar days before the handling date, 0.06 when it ended
      31 to 60 days before, and nothing when it ended 30 or fewer days before.
      The credit-source uplift is 0.03 a year when the latest fee credit on the plan is a billing-error correction, 0.01 when it is a
      free-look refund credit, and nothing otherwise.
      The repeat-error uplift is 0.02 a year when the plan carries two or more billing-error corrections, 0.01 when it carries
      exactly one, and nothing when it carries none.
      The refund tenure uplift is 0.02 a year when the ended plan's rental had a move-in date 60 or more whole months before the plan
      ended, 0.01 when its move-in date was at least 24 and fewer than 60 whole months before the plan ended, and nothing otherwise.
      The refund is the credit balance plus the credit balance times the sum of the late-refund rate and the three uplifts times the
      late days divided by 365, rounded to the cent only at this final step.
    baseline:
      rule: >-
        The credit balance is the fees collected plus the fee credits minus the fees charged and the refunds already paid on the plan,
        never below zero. The standard refund is the credit balance with no interest added, rounded to the cent, and the standard
        refund clock counts the calendar days from the date the plan ended to the handling date minus 21, never below zero.
      params: [refund_days]
    prerequisite: []
    cross_category:
      - category: unit
        as: branch
        reads: [move_in_date, rental_id]
        note: The ended plan's rental move-in date decides the refund tenure uplift.
    compute:
      - collected: "SUM('protect_premiums','amount', event_type='protect_premium_collected')"
      - credited: "SUM('protect_premiums','amount', event_type='protect_premium_credit')"
      - charged: "SUM('protect_premiums','amount', event_type='protect_premium_charge')"
      - refunded: "SUM('protect_premiums','amount', event_type='protect_premium_refund')"
      - credit_balance: "MX(0, collected + credited - charged - refunded)"
      - ended_on: "F('termination_date') or F('cancellation_date')"
      - credit_count: "COUNT('protect_premiums', event_type='protect_premium_credit')"
      - credit_date: "LATEST('protect_premiums','entry_date', date_field='entry_date', event_type='protect_premium_credit')"
      - request_date: "LATEST('protect_cancellation_requests','request_date', date_field='request_date')"
      - late_days: "MX(0, DAYS(credit_date, NOW) - K('refund_days')) if credit_count >= 1 else (MX(0, DAYS(request_date, NOW) - K('refund_days')) if request_date else MX(0, DAYS(ended_on, NOW) - K('refund_days')))"
      - days_since_end: "DAYS(ended_on, NOW)"
      - late_rate: "K('refund_rate_long') if days_since_end >= K('ended_long_days') else (K('refund_rate_short') if days_since_end >= K('ended_short_days') else 0.0)"
      - credit_kind: "LATEST('protect_premiums','credit_type', date_field='entry_date', event_type='protect_premium_credit')"
      - source_uplift: "K('error_credit_uplift') if credit_kind == 'billing_error_correction' else (K('free_look_uplift') if credit_kind == 'free_look_refund' else 0.0)"
      - error_credits: "COUNT('protect_premiums', event_type='protect_premium_credit', credit_type='billing_error_correction')"
      - repeat_uplift: "K('repeat_two_uplift') if error_credits >= 2 else (K('repeat_one_uplift') if error_credits == 1 else 0.0)"
      - rental_months: "MONTHS(CFIELD('unit','move_in_date', rental_id=F('rental_id')), F('termination_date') or F('cancellation_date'))"
      - tenure_uplift: "K('tenure_long_uplift') if rental_months >= K('tenure_long_months') else (K('tenure_mid_uplift') if rental_months >= K('tenure_mid_months') else 0.0)"
      - result: "RND(credit_balance + credit_balance * (late_rate + source_uplift + repeat_uplift + tenure_uplift) * late_days / 365.0, 2)"
    compute_basis:
      collected: "The credit balance is the fees collected plus the fee credits minus the fees charged and the refunds already paid on the plan, never below zero."
      credited: "The credit balance is the fees collected plus the fee credits minus the fees charged and the refunds already paid on the plan, never below zero."
      charged: "The credit balance is the fees collected plus the fee credits minus the fees charged and the refunds already paid on the plan, never below zero."
      refunded: "The credit balance is the fees collected plus the fee credits minus the fees charged and the refunds already paid on the plan, never below zero."
      credit_balance: "The credit balance is the fees collected plus the fee credits minus the fees charged and the refunds already paid on the plan, never below zero."
      ended_on: "the standard refund clock counts the calendar days from the date the plan ended to the handling date minus 21, never below zero"
      credit_count: "when the plan's fee ledger carries a fee credit"
      credit_date: "the late days are the calendar days from the latest fee credit to the handling date minus 21"
      request_date: "when it carries no fee credit and the plan has a cancellation request"
      late_days: "The refund clock starts at the event that left the balance: when the plan's fee ledger carries a fee credit, the late days are the calendar days from the latest fee credit to the handling date minus 21; when it carries no fee credit and the plan has a cancellation request, the late days are the calendar days from the latest cancellation request date to the handling date minus 21; otherwise the late days follow the standard refund clock; in every case never below zero."
      days_since_end: "when the plan ended 61 or more calendar days before the handling date"
      late_rate: "The late-refund rate is 0.12 a year when the plan ended 61 or more calendar days before the handling date, 0.06 when it ended 31 to 60 days before, and nothing when it ended 30 or fewer days before."
      credit_kind: "when the latest fee credit on the plan is a billing-error correction"
      source_uplift: "The credit-source uplift is 0.03 a year when the latest fee credit on the plan is a billing-error correction, 0.01 when it is a free-look refund credit, and nothing otherwise."
      error_credits: "when the plan carries two or more billing-error corrections"
      repeat_uplift: "The repeat-error uplift is 0.02 a year when the plan carries two or more billing-error corrections, 0.01 when it carries exactly one, and nothing when it carries none."
      rental_months: "when the ended plan's rental had a move-in date 60 or more whole months before the plan ended"
      tenure_uplift: "The refund tenure uplift is 0.02 a year when the ended plan's rental had a move-in date 60 or more whole months before the plan ended, 0.01 when its move-in date was at least 24 and fewer than 60 whole months before the plan ended, and nothing otherwise."
      result: "The refund is the credit balance plus the credit balance times the sum of the late-refund rate and the three uplifts times the late days divided by 365, rounded to the cent only at this final step."
    factors:
      - id: refund_clock_start
        effect: method
        decides: late_days
        bindings: [credit_count, credit_date, request_date, late_days]
        ladder:
          - when: "the plan's fee ledger carries a fee credit"
            method: "the late days run from the latest fee credit, less the 21-day refund period"
          - when: "the plan's fee ledger carries no fee credit and the plan has a cancellation request"
            method: "the late days run from the latest cancellation request date, less the 21-day refund period"
          - when: "otherwise"
            method: "the late days run from the date the plan ended, less the 21-day refund period"
        baseline:
          late_days: "MX(0, DAYS(ended_on, NOW) - K('refund_days'))"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_refund_rate
        effect: parameter
        decides: late_rate
        bindings: [days_since_end, late_rate]
        ladder:
          - when: "the plan ended 61 or more calendar days before the handling date"
            value: "K('refund_rate_long')"
          - when: "the plan ended 31 to 60 calendar days before the handling date"
            value: "K('refund_rate_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          late_rate: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: refund_credit_source_uplift
        effect: parameter
        decides: source_uplift
        bindings: [credit_kind, source_uplift]
        ladder:
          - when: "the latest fee credit on the plan is a billing-error correction"
            value: "K('error_credit_uplift')"
          - when: "the latest fee credit on the plan is a free-look refund credit"
            value: "K('free_look_uplift')"
          - when: "otherwise"
            value: "0"
        baseline:
          source_uplift: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: refund_repeat_error_uplift
        effect: parameter
        decides: repeat_uplift
        bindings: [error_credits, repeat_uplift]
        ladder:
          - when: "the plan carries two or more billing-error corrections"
            value: "K('repeat_two_uplift')"
          - when: "the plan carries exactly one billing-error correction"
            value: "K('repeat_one_uplift')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_uplift: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: refund_tenure_uplift
        effect: parameter
        decides: tenure_uplift
        bindings: [rental_months, tenure_uplift]
        ladder:
          - when: "the ended plan's rental had a move-in date 60 or more whole months before the plan ended"
            value: "K('tenure_long_uplift')"
          - when: "its move-in date was at least 24 and fewer than 60 whole months before the plan ended"
            value: "K('tenure_mid_uplift')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_uplift: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: unit
    inputs:
      history:
        - {table: protect_premiums, aggregate: sum, field: amount, filters: {event_type: protect_premium_collected}}
        - {table: protect_premiums, aggregate: sum, field: amount, filters: {event_type: protect_premium_charge}}
        - {table: protect_premiums, aggregate: count, field: premium_entry_id, filters: {event_type: protect_premium_credit, credit_type: billing_error_correction}}
        - {table: protect_premiums, aggregate: latest, field: entry_date, filters: {event_type: protect_premium_credit}}
      cross_category: [unit]

