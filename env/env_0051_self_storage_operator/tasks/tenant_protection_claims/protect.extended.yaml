        ladder:
          - when: "the claim's peril is burglary and the covered unit's class has drive-up access"
            method: "the deductible base is 10 percent of the missing-property total, never less than deductible_usd"
          - when: "the claim's peril is burglary and the covered unit's class has no drive-up access"
            method: "the deductible base is 5 percent of the missing-property total, never less than deductible_usd"
          - when: "otherwise"
            method: "the deductible base is the flat deductible_usd"
        baseline:
          deductible_base: "P('deductible_usd')"
        evidence: [history, cross_category]
        cross_difficulty: unit
      - id: resettlement_tenure_share
        effect: parameter
