events:
  - type: protect_enrollment
    target: protect_plans
    mutation: create
    meaning: "A tenant enrolls a storage unit rental in a Bluegate Tenant Protection plan at a chosen coverage level."
    grain: "One plan record per enrollment."
    fields:
      customer_id: "Tenant enrolling."
      rental_id: "Unit rental agreement the plan protects."
      variant_name: "Coverage level chosen, official full name."
      enrollment_date: "Date the tenant enrolls."
      effective_date: "Date protection begins under the enrollment rule."
      coverage_limit: "Coverage limit of the chosen level, USD."
      monthly_fee: "Monthly protection fee of the chosen level, USD."
      deductible: "Deductible of the chosen level, USD."
      enrollment_channel: "Channel the enrollment came through."
    triggers: []
  - type: protect_activation
    target: protect_plans
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: "Protection takes effect on the effective date."
    grain: "One transition per plan."
    fields:
      status: "Set to active."
    triggers:
      - event: protect:protect_premium_charge
        map: {}
  - type: protect_premium_charge
    target: protect_premiums
    meaning: "The monthly protection fee for one billing period is billed."
    grain: "One row per plan per billing period."
    distinguish_by: [period_start]
    fields:
      amount: "Fee billed, USD."
      entry_date: "Date billed (the covered rental's due date)."
      period_start: "Start of the billing period the fee covers."
    account: premium_balance
    direction: in
    triggers: []
  - type: protect_premium_collected
    target: protect_premiums
    meaning: "A protection fee is collected, together with or apart from the rent."
    grain: "One row per billing period per collection date."
    distinguish_by: [period_start, entry_date]
    fields:
      amount: "Amount collected, USD."
      entry_date: "Date collected."
      period_start: "Billing period whose fee is paid."
    account: premium_balance
    direction: out
    triggers: []
  - type: protect_premium_credit
    target: protect_premiums
    meaning: "A protection fee is credited back: a free-look refund on cancellation or a correction of a fee billed in error."
    grain: "One row per credit type per credited fee."
    distinguish_by: [credit_type, reference_entry_id]
    fields:
      credit_type: "Kind of credit."
      amount: "Credit amount, USD."
      entry_date: "Date credited."
      reference_entry_id: "The fee charge being credited."
    account: premium_balance
    direction: out
    triggers: []
  - type: protect_premium_refund
    target: protect_premiums
    meaning: "A credit balance on the plan is paid back to the tenant."
    grain: "One row per refund issued."
    distinguish_by: [entry_date, refund_method]
    fields:
      amount: "Amount refunded, USD."
      entry_date: "Date refunded."
      refund_method: "How the refund is paid."
    account: premium_balance
    direction: in
    triggers: []
  - type: protect_coverage_change
    target: protect_plan_changes
    meaning: "The tenant moves the plan to a higher or lower coverage level."
    grain: "One row per change request."
    distinguish_by: [request_date, variant_name]
    fields:
      request_date: "Date the tenant asks for the change."
      previous_variant_name: "Coverage level before the change."
      variant_name: "Coverage level after the change."
      change_direction: "Whether the limit goes up or down."
      effective_date: "Date the new level applies under the change rule."
    triggers: []
  - type: protect_plan_terms_update
    target: protect_plans
    mutation: update
    meaning: "The plan record takes on the terms of a changed coverage level on the change's effective date."
    grain: "One update per coverage change."
    fields:
      variant_name: "New coverage level."
      coverage_limit: "New coverage limit, USD."
      monthly_fee: "New monthly fee, USD."
      deductible: "New deductible, USD."
      last_change_date: "Effective date of the change."
    triggers: []
  - type: protect_lapse
    target: protect_plans
    mutation: {transition: {from: active, to: lapsed}}
    meaning: "Protection lapses for an unpaid protection fee."
    grain: "One transition per lapse."
    fields:
      lapse_date: "Date the plan lapsed."
    triggers: []
  - type: protect_reinstatement
    target: protect_plans
    mutation: {transition: {from: lapsed, to: active}}
    meaning: "A lapsed plan is reinstated once every past-due fee is paid within the window."
    grain: "One transition per reinstatement."
    fields:
      lapse_date: "Cleared to empty."
    triggers: []
  - type: protect_cancellation
    target: protect_plans
    mutation: {transition: [{from: pending_effective, to: cancelled}, {from: active, to: cancelled}]}
    meaning: "The tenant ends the protection plan."
    grain: "One transition per plan."
    fields:
      cancellation_date: "Date the cancellation takes effect."
    triggers:
      - event: unit:unit_coverage_update
        map: {coverage_source: own_insurance}
  - type: protect_termination
    target: protect_plans
    mutation: {transition: [{from: active, to: terminated}, {from: lapsed, to: terminated}]}
    meaning: "The plan ends because the covered rental ended or the reinstatement window passed."
    grain: "One transition per plan."
    fields:
      termination_date: "Date protection ended."
    triggers: []
  - type: protect_claim_document_request
    target: protect_claim_events
    meaning: "The claims desk asks the tenant for a document needed to decide a claim."
    grain: "One row per claim per document requested."
    distinguish_by: [claim_id, requested_document]
    fields:
      claim_id: "Claim the request belongs to."
      event_date: "Date of the request."
      requested_document: "Document requested."
    triggers: []
  - type: protect_claim_assessment
    target: protect_claim_events
    meaning: "The adjuster records the actual cash value of the property lost or damaged in a claim, by property class."
    grain: "One row per claim per assessment date (a reconsideration with new documents can bring a later assessment)."
    distinguish_by: [claim_id, event_date]
    fields:
      claim_id: "Claim assessed."
      event_date: "Date of the assessment."
      assessed_general_value: "Actual cash value of general household property, USD."
      assessed_jewelry_value: "Actual cash value of jewelry, furs and watches, USD."
      assessed_electronics_value: "Actual cash value of electronics, USD."
      assessed_collectibles_value: "Actual cash value of collectibles and art, USD."
      assessed_firearms_value: "Actual cash value of firearms, USD."
      assessed_business_inventory_value: "Actual cash value of business inventory, tools and equipment, USD."
    triggers: []
  - type: protect_claim_decision
    target: protect_claim_events
    meaning: "The claims desk decides a claim: approved in full, approved in part, or denied."
    grain: "One row per decision on a claim (a reconsideration is a new decision on a later date)."
    distinguish_by: [claim_id, event_date]
    fields:
      claim_id: "Claim decided."
      event_date: "Date of the decision."
      decision: "Outcome."
      amount: "Amount approved for payment, USD (0.00 for a denial)."
      denial_reason: "Controlled reason for a denial or partial approval; none for a full approval."
    triggers:
      - event: protect:protect_claim_payment
        when: {decision: [approved_full, approved_partial]}
        map: {claim_id: claim_id}
  - type: protect_claim_payment
    target: protect_claim_events
    meaning: "Approved claim money is issued to the tenant."
    grain: "One row per payment issued on a claim."
    distinguish_by: [claim_id, event_date]
    fields:
      claim_id: "Claim paid."
      event_date: "Date the payment is issued."
      amount: "Amount paid, USD."
      claim_payment_method: "How the payment is issued."
    account: claims_paid
    direction: in
    triggers: []
  - type: protect_claim_payment_voided
    target: protect_claim_events
    meaning: "A claim payment is voided or recovered: stolen property recovered, payment returned undeliverable, or issued in error."
    grain: "One row per voided payment."
    distinguish_by: [reference_event_id]
    fields:
      claim_id: "Claim the payment belonged to."
      reference_event_id: "The claim payment being voided."
      event_date: "Date voided."
      amount: "Amount voided or recovered, USD."
      void_reason: "Why the payment is voided."
    account: claims_paid
    direction: out
    triggers: []

measures:
  - id: protect_msr_paid_365d
    window: "Rolling 365 calendar days of loss dates ending on the loss date of the claim being decided, inclusive, per plan."
    measure: "Sum of protect_claim_payment amounts minus protect_claim_payment_voided amounts on claims of this plan whose loss_date falls in the window."
  - id: protect_msr_claims_paid_count_365d
    window: "Rolling 365 calendar days of loss dates ending on the loss date of the claim being decided, inclusive, per plan."
    measure: "Count of distinct claims of this plan with a protect_claim_payment not fully voided and a loss_date in the window."
  - id: protect_msr_changes_365d
    window: "Rolling 365 calendar days ending on the handling date, inclusive, per plan."
    measure: "Count of protect_coverage_change rows whose request_date falls in the window."

policies:
  - id: protect_agg_multi_holding
    subject: [protect_enrollment]
    rule: >-
      Protection is attached to one storage unit rental at a time, and a customer may hold one plan for each unit they rent, with no
      cap on the number of plans. A rental may carry only one plan in pending_effective, active or lapsed status; a second enrollment
      on the same rental is not taken, and a change of level is made with a coverage change instead. Enrollment is taken only for a
      unit rental in reserved, active or delinquent status. The chosen level must list the rental's unit class in eligible_unit_classes.
      Parking rentals, truck rentals and business delivery services cannot carry a protection plan.
    eligibility:
      - id: rental_enrollable
        applies_to: [protect_enrollment]
        kind: state
        condition: "Enrollment is taken only for a unit rental in reserved, active or delinquent status."
        evidence_fields: [unit_rentals.status, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
        state_contract:
          field: unit_rentals.status
          allowed: [reserved, active, delinquent]
      - id: one_plan_per_rental
        applies_to: [protect_enrollment]
        kind: dedup
        condition: "A rental may carry only one plan in pending_effective, active or lapsed status; a second enrollment on the same rental is not taken, and a change of level is made with a coverage change instead."
        evidence_fields: [protect_plans.rental_id, protect_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plans.rental_id]]
          action_bindings: {protect_plans.rental_id: rental_id}
        dedup_contract:
          table: protect_plans
          mode: separate_record
          object_bindings: {rental_id: rental_id}
          duplicate_filters: {status: [pending_effective, active, lapsed]}
          distinct_fields: []
      - id: class_eligible
        applies_to: [protect_enrollment]
        kind: authorization
        condition: "The chosen level must list the rental's unit class in eligible_unit_classes."
        evidence_fields: [unit_rentals.variant_name, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
    params:
      max_per_customer: null
      max_open_plans_per_rental: 1

  - id: protect_agg_annual_aggregate
    subject: [protect_claim_decision, protect_claim_payment]
    rule: >-
      Each plan is settled on its own: a loss that damages two rented units is two claims under two plans, each with its own limit and
      deductible where separate_deductible_per_unit is true. Within one plan, the total paid on claims whose loss dates fall in any
      rolling 365-day window, measured by protect_msr_paid_365d, may not exceed coverage_limit_usd times aggregate_limit_multiple of the
      level in force on the loss date being decided; an approval is reduced to the room left under that aggregate, and a claim with no
      room left is denied with reason aggregate_limit_reached. The plan pays at most max_claims_per_12_months claims with loss dates in
      that window, counted by protect_msr_claims_paid_count_365d; a further claim is denied with reason claim_count_limit_reached.
    eligibility: []
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", aggregate_limit_multiple: "=aggregate_limit_multiple", max_claims_per_12_months: "=max_claims_per_12_months"}
        "Bluegate Tenant Protection $3,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", aggregate_limit_multiple: "=aggregate_limit_multiple", max_claims_per_12_months: "=max_claims_per_12_months"}
        "Bluegate Tenant Protection $5,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", aggregate_limit_multiple: "=aggregate_limit_multiple", max_claims_per_12_months: "=max_claims_per_12_months"}
        "Bluegate Tenant Protection $7,500 Plan": {coverage_limit_usd: "=coverage_limit_usd", aggregate_limit_multiple: "=aggregate_limit_multiple", max_claims_per_12_months: "=max_claims_per_12_months"}
        "Bluegate Tenant Protection $10,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", aggregate_limit_multiple: "=aggregate_limit_multiple", max_claims_per_12_months: "=max_claims_per_12_months"}
        "Bluegate Tenant Protection $15,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", aggregate_limit_multiple: "=aggregate_limit_multiple", max_claims_per_12_months: "=max_claims_per_12_months"}
    formula:
      aggregate_room: "max(0, coverage_limit_usd * aggregate_limit_multiple - protect_msr_paid_365d)"
    measures: [protect_msr_paid_365d, protect_msr_claims_paid_count_365d]

  - id: protect_evt_enrollment_terms
    subject: [protect_enrollment, protect_activation]
    rule: >-
      An enrollment made on the move-in date takes effect on the move-in date. An enrollment made after move-in takes effect
      midterm_enrollment_waiting_days calendar days after the enrollment date, and losses before the effective date are not covered.
      The plan record takes the coverage limit, monthly fee and deductible of the chosen level. Enrollment is taken through the channels
      in enrollment_channels. The chosen level's coverage limit must be at least the min_protection_coverage_usd of the rental's unit
      class. The first protection fee is billed when the plan takes effect, and later fees fall on the covered rental's billing day.
    eligibility:
      - id: meets_unit_minimum
        applies_to: [protect_enrollment]
        kind: authorization
        condition: "The chosen level's coverage limit must be at least the min_protection_coverage_usd of the rental's unit class."
        evidence_fields: [unit_rentals.variant_name, unit_rentals.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[unit_rentals.rental_id]]
          action_bindings: {unit_rentals.rental_id: rental_id}
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", monthly_fee_usd: "=monthly_fee_usd", deductible_usd: "=deductible_usd"}
        "Bluegate Tenant Protection $3,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", monthly_fee_usd: "=monthly_fee_usd", deductible_usd: "=deductible_usd"}
        "Bluegate Tenant Protection $5,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", monthly_fee_usd: "=monthly_fee_usd", deductible_usd: "=deductible_usd"}
        "Bluegate Tenant Protection $7,500 Plan": {coverage_limit_usd: "=coverage_limit_usd", monthly_fee_usd: "=monthly_fee_usd", deductible_usd: "=deductible_usd"}
        "Bluegate Tenant Protection $10,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", monthly_fee_usd: "=monthly_fee_usd", deductible_usd: "=deductible_usd"}
        "Bluegate Tenant Protection $15,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", monthly_fee_usd: "=monthly_fee_usd", deductible_usd: "=deductible_usd"}

  - id: protect_evt_fee_billing
    subject: [protect_premium_charge, protect_premium_collected, protect_premium_credit, protect_premium_refund]
    rule: >-
      The monthly protection fee of the level in force on the billing date is billed on the covered rental's billing day, in full and
      never prorated. A protection fee is billed only while the plan is in active or lapsed status. Each billing period is billed once.
      Fees are collected with the rent of the same period and are recorded as collected on the date the period's rent is paid. A fee
      billed for a period that starts after the plan's cancellation or termination date, or a second fee for the same period, is a
      billing error and is credited in full as billing_error_correction. A plan cancelled within the free-look period receives a
      free_look_refund credit of every fee collected. A free-look refund applies only when the cancellation is requested not later than
      the enrollment date plus free_look_days. The free-look period counts calendar days starting the day after the enrollment date, and
      the last counted day is included. A credit balance left on a cancelled or terminated plan is refunded to the original payment
      method within 21 calendar days.
      Fees follow fee_billing_basis.
    eligibility:
      - id: billable_status
        applies_to: [protect_premium_charge]
        kind: state
        condition: "A protection fee is billed only while the plan is in active or lapsed status."
        evidence_fields: [protect_plans.status, protect_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plans.plan_id]]
          action_bindings: {protect_plans.plan_id: plan_id}
        state_contract:
          field: protect_plans.status
          allowed: [active, lapsed]
      - id: one_fee_per_period
        applies_to: [protect_premium_charge]
        kind: dedup
        condition: "Each billing period is billed once."
        evidence_fields: [protect_premiums.plan_id, protect_premiums.period_start, protect_premiums.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_premiums.plan_id, protect_premiums.period_start]]
          action_bindings: {protect_premiums.plan_id: plan_id, protect_premiums.period_start: period_start}
        dedup_contract:
          table: protect_premiums
          mode: separate_record
          object_bindings: {plan_id: plan_id, period_start: period_start}
          duplicate_filters: {event_type: [protect_premium_charge]}
          distinct_fields: []
      - id: free_look_window
        applies_to: [protect_premium_credit]
        kind: time
        condition: "A free-look refund applies only when the cancellation is requested not later than the enrollment date plus free_look_days."
        evidence_fields: [protect_plans.enrollment_date, protect_plans.plan_id, protect_cancellation_requests.request_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plans.plan_id]]
          action_bindings: {protect_plans.plan_id: plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the enrollment date"
          anchor_source: protect_plans.enrollment_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look period counts calendar days starting the day after the enrollment date, and the last counted day is included."
          boundary: inclusive
    params:
      credit_balance_refund_days: 21
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {monthly_fee_usd: "=monthly_fee_usd", free_look_days: "=free_look_days"}
        "Bluegate Tenant Protection $3,000 Plan": {monthly_fee_usd: "=monthly_fee_usd", free_look_days: "=free_look_days"}
        "Bluegate Tenant Protection $5,000 Plan": {monthly_fee_usd: "=monthly_fee_usd", free_look_days: "=free_look_days"}
        "Bluegate Tenant Protection $7,500 Plan": {monthly_fee_usd: "=monthly_fee_usd", free_look_days: "=free_look_days"}
        "Bluegate Tenant Protection $10,000 Plan": {monthly_fee_usd: "=monthly_fee_usd", free_look_days: "=free_look_days"}
        "Bluegate Tenant Protection $15,000 Plan": {monthly_fee_usd: "=monthly_fee_usd", free_look_days: "=free_look_days"}

  - id: protect_evt_coverage_change
    subject: [protect_coverage_change, protect_plan_terms_update]
    rule: >-
      A tenant may raise or lower the coverage level of a plan. A coverage change is accepted only while the plan is in active status.
      An increase takes effect coverage_increase_waiting_days calendar days after the request date, and a decrease takes effect on the
      next billing date of the covered rental (coverage_decrease_effective_basis). Until a change takes effect, losses are settled at
      the previous level, and the new monthly fee is first billed on the first billing date on or after the effective date. A lower
      level may not go below the min_protection_coverage_usd of the covered rental's unit class, and the new level must list that unit
      class in eligible_unit_classes. Changes already requested on the plan, counted by protect_msr_changes_365d, must be below
      plan_changes_per_12_months. The plan record takes the new level's terms only when the handling date is not earlier than the change
      request date plus the waiting days for that direction. Waiting days are calendar days counted from the day after the request date.
    eligibility:
      - id: change_status
        applies_to: [protect_coverage_change]
        kind: state
        condition: "A coverage change is accepted only while the plan is in active status."
        evidence_fields: [protect_plans.status, protect_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plans.plan_id]]
          action_bindings: {protect_plans.plan_id: plan_id}
        state_contract:
          field: protect_plans.status
          allowed: [active]
      - id: unit_minimum_kept
        applies_to: [protect_coverage_change]
        kind: authorization
        condition: "A lower level may not go below the min_protection_coverage_usd of the covered rental's unit class, and the new level must list that unit class in eligible_unit_classes."
        evidence_fields: [unit_rentals.variant_name, unit_rentals.rental_id, protect_plans.rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plans.rental_id]]
          action_bindings: {protect_plans.rental_id: rental_id}
      - id: terms_take_effect
        applies_to: [protect_plan_terms_update]
        kind: time
        condition: "The plan record takes the new level's terms only when the handling date is not earlier than the change request date plus the waiting days for that direction."
        evidence_fields: [protect_plan_changes.request_date, protect_plan_changes.plan_change_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plan_changes.plan_change_id]]
          action_bindings: {protect_plan_changes.plan_change_id: plan_change_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the change request date"
          anchor_source: protect_plan_changes.request_date
          relation: not_before
          duration_source: variants.coverage_increase_waiting_days
          unit: calendar_days
          counting_rule: "Waiting days are calendar days counted from the day after the request date."
          boundary: inclusive
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {coverage_increase_waiting_days: "=coverage_increase_waiting_days", plan_changes_per_12_months: "=plan_changes_per_12_months"}
        "Bluegate Tenant Protection $3,000 Plan": {coverage_increase_waiting_days: "=coverage_increase_waiting_days", plan_changes_per_12_months: "=plan_changes_per_12_months"}
        "Bluegate Tenant Protection $5,000 Plan": {coverage_increase_waiting_days: "=coverage_increase_waiting_days", plan_changes_per_12_months: "=plan_changes_per_12_months"}
        "Bluegate Tenant Protection $7,500 Plan": {coverage_increase_waiting_days: "=coverage_increase_waiting_days", plan_changes_per_12_months: "=plan_changes_per_12_months"}
        "Bluegate Tenant Protection $10,000 Plan": {coverage_increase_waiting_days: "=coverage_increase_waiting_days", plan_changes_per_12_months: "=plan_changes_per_12_months"}
        "Bluegate Tenant Protection $15,000 Plan": {coverage_increase_waiting_days: "=coverage_increase_waiting_days", plan_changes_per_12_months: "=plan_changes_per_12_months"}
    formula:
      allowed: "protect_msr_changes_365d < plan_changes_per_12_months"
    measures: [protect_msr_changes_365d]

  - id: protect_evt_lapse_reinstatement
    subject: [protect_lapse, protect_reinstatement, protect_termination]
    rule: >-
      A plan lapses when a protection fee is still unpaid lapse_days_past_due calendar days after its billing date. A plan may be lapsed
      only when the handling date is not earlier than the billing date of the oldest unpaid protection fee plus lapse_days_past_due. Day
      counts start the day after the anchor date, and the action is allowed on the day the count is reached. Losses that occur while the
      plan is lapsed are not covered, even after reinstatement. A lapsed plan is reinstated when every past-due fee is paid, provided
      the payment comes not later than the lapse date plus reinstatement_window_days; coverage resumes from the reinstatement date. A
      lapsed plan that is not reinstated inside the window, and any plan whose covered rental is vacated or sold at lien sale, is
      terminated, effective the window's last day or the rental's move-out date.
    eligibility:
      - id: lapse_due
        applies_to: [protect_lapse]
        kind: time
        condition: "A plan may be lapsed only when the handling date is not earlier than the billing date of the oldest unpaid protection fee plus lapse_days_past_due."
        evidence_fields: [protect_premiums.period_start, protect_premiums.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_premiums.plan_id]]
          action_bindings: {protect_premiums.plan_id: plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the billing date of the oldest unpaid protection fee"
          anchor_source: protect_premiums.period_start
          relation: not_before
          duration_source: variants.lapse_days_past_due
          unit: calendar_days
          counting_rule: "Day counts start the day after the anchor date, and the action is allowed on the day the count is reached."
          boundary: inclusive
      - id: reinstatement_window
        applies_to: [protect_reinstatement]
        kind: time
        condition: "A lapsed plan is reinstated when every past-due fee is paid, provided the payment comes not later than the lapse date plus reinstatement_window_days; coverage resumes from the reinstatement date."
        evidence_fields: [protect_plans.lapse_date, protect_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_plans.plan_id]]
          action_bindings: {protect_plans.plan_id: plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the lapse date"
          anchor_source: protect_plans.lapse_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: "Day counts start the day after the anchor date, and the action is allowed on the day the count is reached."
          boundary: inclusive
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {lapse_days_past_due: "=lapse_days_past_due", reinstatement_window_days: "=reinstatement_window_days"}
        "Bluegate Tenant Protection $3,000 Plan": {lapse_days_past_due: "=lapse_days_past_due", reinstatement_window_days: "=reinstatement_window_days"}
        "Bluegate Tenant Protection $5,000 Plan": {lapse_days_past_due: "=lapse_days_past_due", reinstatement_window_days: "=reinstatement_window_days"}
        "Bluegate Tenant Protection $7,500 Plan": {lapse_days_past_due: "=lapse_days_past_due", reinstatement_window_days: "=reinstatement_window_days"}
        "Bluegate Tenant Protection $10,000 Plan": {lapse_days_past_due: "=lapse_days_past_due", reinstatement_window_days: "=reinstatement_window_days"}
        "Bluegate Tenant Protection $15,000 Plan": {lapse_days_past_due: "=lapse_days_past_due", reinstatement_window_days: "=reinstatement_window_days"}

  - id: protect_evt_cancellation
    subject: [protect_cancellation]
    rule: >-
      Only the tenant can cancel protection, and the tenant's request is recorded as a cancellation request. Because every rental must
      stay covered, cancellation of an active plan requires a received cancellation request naming the tenant's own insurer and policy
      number. A plan in pending_effective status may be cancelled without naming an insurer, since its rental is then switched to own
      insurance or re-enrolled before move-in. Cancellation takes effect on the covered rental's next billing date
      (cancellation_effective_basis), so the current period's fee is kept and not prorated, except that a request made within the
      free-look period refunds every fee collected. On cancellation the covered rental's coverage source becomes own_insurance. A plan
      with an open claim may still be cancelled; the claim is settled on the coverage in force on its loss date.
      The insurer requirement applies where cancellation_requires_proof_of_insurance is true.
    eligibility:
      - id: proof_on_file
        applies_to: [protect_cancellation]
        kind: state
        condition: "Because every rental must stay covered, cancellation of an active plan requires a received cancellation request naming the tenant's own insurer and policy number."
        evidence_fields: [protect_cancellation_requests.request_status, protect_cancellation_requests.plan_id, protect_cancellation_requests.insurer_policy_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_cancellation_requests.plan_id]]
          action_bindings: {protect_cancellation_requests.plan_id: plan_id}
        state_contract:
          field: protect_cancellation_requests.request_status
          allowed: [received]
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {cancellation_effective_basis: "=cancellation_effective_basis", fee_proration_on_cancel: "=fee_proration_on_cancel"}
        "Bluegate Tenant Protection $3,000 Plan": {cancellation_effective_basis: "=cancellation_effective_basis", fee_proration_on_cancel: "=fee_proration_on_cancel"}
        "Bluegate Tenant Protection $5,000 Plan": {cancellation_effective_basis: "=cancellation_effective_basis", fee_proration_on_cancel: "=fee_proration_on_cancel"}
        "Bluegate Tenant Protection $7,500 Plan": {cancellation_effective_basis: "=cancellation_effective_basis", fee_proration_on_cancel: "=fee_proration_on_cancel"}
        "Bluegate Tenant Protection $10,000 Plan": {cancellation_effective_basis: "=cancellation_effective_basis", fee_proration_on_cancel: "=fee_proration_on_cancel"}
        "Bluegate Tenant Protection $15,000 Plan": {cancellation_effective_basis: "=cancellation_effective_basis", fee_proration_on_cancel: "=fee_proration_on_cancel"}

  - id: protect_evt_claim_eligibility
    subject: [protect_claim_decision, protect_claim_document_request]
    rule: >-
      A claim is decided on the coverage in force on the loss date: the plan must have been past its effective date and not lapsed,
      cancelled or terminated on that date. A claim is covered only when the plan was in force on the loss date, judged from the plan's
      effective, lapse, cancellation and termination dates and its change history. The loss must come from a peril in covered_perils;
      a loss from a peril in excluded_perils is denied with reason excluded_peril, and climate-control damage is covered only on levels
      where climate_control_failure_covered is true and only when the facility has logged the climate-control failure. A claim is
      accepted only when it is filed not later than the discovery date plus claim_filing_deadline_days. The filing period counts
      calendar days starting the day after the discovery date, and the last counted day is included. A late claim is denied with reason
      filed_late. For burglary or vandalism, a police report filed within police_report_deadline_days of the discovery date is required,
      and burglary also needs forced-entry evidence where burglary_requires_forced_entry is true; a lock cut by the company during the
      lien process is never forced entry. A claimed amount above inventory_list_required_over_usd needs an itemized inventory with proof
      of ownership, and above adjuster_inspection_over_usd an adjuster inspection, before a decision. A missing document is asked for
      once per document; if it is not received within document_request_response_days the claim is denied with reason
      documents_not_received. Cash, securities and personal papers are excluded where cash_securities_documents_covered is false,
      vehicles and their contents where vehicle_contents_covered is false, and property held for others where third_party_property_covered
      is false, while household members' property is covered where family_member_items_covered is true. The loss must be reported to the
      facility office within loss_notice_to_facility_days of discovery, photographs are required where photos_required is true, the
      itemized proof of loss must arrive within proof_of_loss_deadline_days of filing, and claims are filed through claim_filing_channels.
    eligibility:
      - id: in_force_on_loss_date
        applies_to: [protect_claim_decision]
        kind: authorization
        condition: "A claim is covered only when the plan was in force on the loss date, judged from the plan's effective, lapse, cancellation and termination dates and its change history."
        evidence_fields: [protect_plans.effective_date, protect_plans.lapse_date, protect_plans.cancellation_date, protect_plans.termination_date, protect_claims.loss_date, protect_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_claims.claim_id]]
          action_bindings: {protect_claims.claim_id: claim_id}
      - id: filed_in_time
        applies_to: [protect_claim_decision]
        kind: time
        condition: "A claim is accepted only when it is filed not later than the discovery date plus claim_filing_deadline_days."
        evidence_fields: [protect_claims.discovery_date, protect_claims.filed_date, protect_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_claims.claim_id]]
          action_bindings: {protect_claims.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the discovery date"
          anchor_source: protect_claims.discovery_date
          relation: not_after
          duration_source: variants.claim_filing_deadline_days
          unit: calendar_days
          counting_rule: "The filing period counts calendar days starting the day after the discovery date, and the last counted day is included."
          boundary: inclusive
      - id: police_report
        applies_to: [protect_claim_decision]
        kind: authorization
        condition: "For burglary or vandalism, a police report filed within police_report_deadline_days of the discovery date is required, and burglary also needs forced-entry evidence where burglary_requires_forced_entry is true; a lock cut by the company during the lien process is never forced entry."
        evidence_fields: [protect_claims.peril, protect_claims.police_report_number, protect_claims.police_report_date, protect_claims.forced_entry_evidence, protect_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_claims.claim_id]]
          action_bindings: {protect_claims.claim_id: claim_id}
      - id: ask_once
        applies_to: [protect_claim_document_request]
        kind: dedup
        condition: "A missing document is asked for once per document; if it is not received within document_request_response_days the claim is denied with reason documents_not_received."
        evidence_fields: [protect_claim_events.claim_id, protect_claim_events.requested_document]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_claim_events.claim_id]]
          action_bindings: {protect_claim_events.claim_id: claim_id}
        dedup_contract:
          table: protect_claim_events
          mode: separate_record
          object_bindings: {claim_id: claim_id, requested_document: requested_document}
          duplicate_filters: {event_type: [protect_claim_document_request]}
          distinct_fields: []
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {claim_filing_deadline_days: "=claim_filing_deadline_days", climate_control_failure_covered: "=climate_control_failure_covered", inventory_list_required_over_usd: "=inventory_list_required_over_usd", adjuster_inspection_over_usd: "=adjuster_inspection_over_usd"}
        "Bluegate Tenant Protection $3,000 Plan": {claim_filing_deadline_days: "=claim_filing_deadline_days", climate_control_failure_covered: "=climate_control_failure_covered", inventory_list_required_over_usd: "=inventory_list_required_over_usd", adjuster_inspection_over_usd: "=adjuster_inspection_over_usd"}
        "Bluegate Tenant Protection $5,000 Plan": {claim_filing_deadline_days: "=claim_filing_deadline_days", climate_control_failure_covered: "=climate_control_failure_covered", inventory_list_required_over_usd: "=inventory_list_required_over_usd", adjuster_inspection_over_usd: "=adjuster_inspection_over_usd"}
        "Bluegate Tenant Protection $7,500 Plan": {claim_filing_deadline_days: "=claim_filing_deadline_days", climate_control_failure_covered: "=climate_control_failure_covered", inventory_list_required_over_usd: "=inventory_list_required_over_usd", adjuster_inspection_over_usd: "=adjuster_inspection_over_usd"}
        "Bluegate Tenant Protection $10,000 Plan": {claim_filing_deadline_days: "=claim_filing_deadline_days", climate_control_failure_covered: "=climate_control_failure_covered", inventory_list_required_over_usd: "=inventory_list_required_over_usd", adjuster_inspection_over_usd: "=adjuster_inspection_over_usd"}
        "Bluegate Tenant Protection $15,000 Plan": {claim_filing_deadline_days: "=claim_filing_deadline_days", climate_control_failure_covered: "=climate_control_failure_covered", inventory_list_required_over_usd: "=inventory_list_required_over_usd", adjuster_inspection_over_usd: "=adjuster_inspection_over_usd"}

  - id: protect_evt_claim_settlement
    subject: [protect_claim_assessment, protect_claim_decision, protect_claim_payment]
    rule: >-
      A covered claim is paid on actual cash value (valuation_basis) as recorded in the latest adjuster assessment of the claim. The payable amount is the
      general-property assessment plus each special class capped at its sublimit (jewelry, furs and watches; electronics; collectibles
      and art; firearms; business inventory), with the total capped at coverage_limit_usd, minus deductible_usd once per occurrence, and
      never below zero. Every limit, sublimit and deductible is taken from the coverage level in force on the loss date, which can
      differ from the plan's current level when a coverage change took effect after the loss. The approval is then reduced to the room
      left under the annual aggregate. An approval equal to the payable amount before any aggregate reduction is approved_full;
      anything less but above zero is approved_partial; zero is a denial. The approved amount is paid within claim_payment_issue_days by
      direct deposit or mailed check, per claim_payment_methods, and each approval is paid once.
      The deductible applies once per occurrence where deductible_per_occurrence is true, and a decision is issued within claim_decision_target_days of the claim file being complete.
    eligibility:
      - id: pay_once
        applies_to: [protect_claim_payment]
        kind: dedup
        condition: "The approved amount is paid within claim_payment_issue_days by direct deposit or mailed check, per claim_payment_methods, and each approval is paid once."
        evidence_fields: [protect_claim_events.claim_id, protect_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_claim_events.claim_id]]
          action_bindings: {protect_claim_events.claim_id: claim_id}
        dedup_contract:
          table: protect_claim_events
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [protect_claim_payment]}
          distinct_fields: [event_date]
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", deductible_usd: "=deductible_usd", jewelry_furs_watches_sublimit_usd: "=jewelry_furs_watches_sublimit_usd", electronics_sublimit_usd: "=electronics_sublimit_usd", collectibles_art_sublimit_usd: "=collectibles_art_sublimit_usd", firearms_sublimit_usd: "=firearms_sublimit_usd", business_inventory_sublimit_usd: "=business_inventory_sublimit_usd"}
        "Bluegate Tenant Protection $3,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", deductible_usd: "=deductible_usd", jewelry_furs_watches_sublimit_usd: "=jewelry_furs_watches_sublimit_usd", electronics_sublimit_usd: "=electronics_sublimit_usd", collectibles_art_sublimit_usd: "=collectibles_art_sublimit_usd", firearms_sublimit_usd: "=firearms_sublimit_usd", business_inventory_sublimit_usd: "=business_inventory_sublimit_usd"}
        "Bluegate Tenant Protection $5,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", deductible_usd: "=deductible_usd", jewelry_furs_watches_sublimit_usd: "=jewelry_furs_watches_sublimit_usd", electronics_sublimit_usd: "=electronics_sublimit_usd", collectibles_art_sublimit_usd: "=collectibles_art_sublimit_usd", firearms_sublimit_usd: "=firearms_sublimit_usd", business_inventory_sublimit_usd: "=business_inventory_sublimit_usd"}
        "Bluegate Tenant Protection $7,500 Plan": {coverage_limit_usd: "=coverage_limit_usd", deductible_usd: "=deductible_usd", jewelry_furs_watches_sublimit_usd: "=jewelry_furs_watches_sublimit_usd", electronics_sublimit_usd: "=electronics_sublimit_usd", collectibles_art_sublimit_usd: "=collectibles_art_sublimit_usd", firearms_sublimit_usd: "=firearms_sublimit_usd", business_inventory_sublimit_usd: "=business_inventory_sublimit_usd"}
        "Bluegate Tenant Protection $10,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", deductible_usd: "=deductible_usd", jewelry_furs_watches_sublimit_usd: "=jewelry_furs_watches_sublimit_usd", electronics_sublimit_usd: "=electronics_sublimit_usd", collectibles_art_sublimit_usd: "=collectibles_art_sublimit_usd", firearms_sublimit_usd: "=firearms_sublimit_usd", business_inventory_sublimit_usd: "=business_inventory_sublimit_usd"}
        "Bluegate Tenant Protection $15,000 Plan": {coverage_limit_usd: "=coverage_limit_usd", deductible_usd: "=deductible_usd", jewelry_furs_watches_sublimit_usd: "=jewelry_furs_watches_sublimit_usd", electronics_sublimit_usd: "=electronics_sublimit_usd", collectibles_art_sublimit_usd: "=collectibles_art_sublimit_usd", firearms_sublimit_usd: "=firearms_sublimit_usd", business_inventory_sublimit_usd: "=business_inventory_sublimit_usd"}
    formula:
      gross_covered: "min(coverage_limit_usd, assessed_general_value + min(assessed_jewelry_value, jewelry_furs_watches_sublimit_usd) + min(assessed_electronics_value, electronics_sublimit_usd) + min(assessed_collectibles_value, collectibles_art_sublimit_usd) + min(assessed_firearms_value, firearms_sublimit_usd) + min(assessed_business_inventory_value, business_inventory_sublimit_usd))"
      payable: "max(0, gross_covered - deductible_usd)"

  - id: protect_evt_claim_payment_void
    subject: [protect_claim_payment_voided]
    rule: >-
      A claim payment is voided in full when it was issued in error or returned undeliverable; an undeliverable payment is reissued by
      the other payment method once the tenant confirms details. When stolen property is recovered after payment, the tenant repays the
      amount paid for the recovered items, or surrenders them, within recovered_property_repayment_days of the recovery date, and the
      repaid amount is recorded as a void of the payment it reverses. Each payment is voided at most once.
    eligibility:
      - id: void_once
        applies_to: [protect_claim_payment_voided]
        kind: dedup
        condition: "Each payment is voided at most once."
        evidence_fields: [protect_claim_events.reference_event_id, protect_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_claim_events.reference_event_id]]
          action_bindings: {protect_claim_events.reference_event_id: reference_event_id}
        dedup_contract:
          table: protect_claim_events
          mode: separate_record
          object_bindings: {reference_event_id: reference_event_id}
          duplicate_filters: {event_type: [protect_claim_payment_voided]}
          distinct_fields: []
    params:
      per_tier:
        "Bluegate Tenant Protection $2,000 Plan": {recovered_property_repayment_days: "=recovered_property_repayment_days"}
        "Bluegate Tenant Protection $3,000 Plan": {recovered_property_repayment_days: "=recovered_property_repayment_days"}
        "Bluegate Tenant Protection $5,000 Plan": {recovered_property_repayment_days: "=recovered_property_repayment_days"}
        "Bluegate Tenant Protection $7,500 Plan": {recovered_property_repayment_days: "=recovered_property_repayment_days"}
        "Bluegate Tenant Protection $10,000 Plan": {recovered_property_repayment_days: "=recovered_property_repayment_days"}
        "Bluegate Tenant Protection $15,000 Plan": {recovered_property_repayment_days: "=recovered_property_repayment_days"}

  - id: protect_evt_reconsideration
    subject: [protect_claim_decision]
    rule: >-
      A tenant may ask once for reconsideration of a denial or partial approval by supplying a document that was not on file at the
      first decision. A reconsideration is taken only when it is requested not later than the decision date plus
      claim_reconsideration_window_days. The window counts calendar days starting the day after the decision date, and the last counted
      day is included. The new decision replaces the earlier one; any increase over the amount already paid is paid as a new claim
      payment, and the earlier payment stands. A disagreement about the assessed actual cash value itself, without a new document, is
      not reconsidered by the care center.
    eligibility:
      - id: reconsideration_window
        applies_to: [protect_claim_decision]
        kind: time
        condition: "A reconsideration is taken only when it is requested not later than the decision date plus claim_reconsideration_window_days."
        evidence_fields: [protect_claim_events.event_date, protect_claim_events.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[protect_claim_events.claim_id]]
          action_bindings: {protect_claim_events.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the decision date"
          anchor_source: protect_claim_events.event_date
          relation: not_after
          duration_source: variants.claim_reconsideration_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the decision date, and the last counted day is included."
          boundary: inclusive
    params:
      reconsiderations_per_claim: 1

extended_policies:
  - id: protect_ext_fee_error_credit
    base_policy_refs: [protect_evt_fee_billing]
    overwrite:
      - base_policy: protect_evt_fee_billing
        superseded_clause: >-
          A fee billed for a period that starts after the plan's cancellation or termination date, or a second fee for the same period,
          is a billing error and is credited in full as billing_error_correction.
        replaced_by: >-
          The correction credited is the charge in error plus the billing-error service credit, rounded to the cent only at this final
          step.
      - base_policy: protect_evt_fee_billing
        superseded_clause: >-
          A free-look refund applies only when the cancellation is requested not later than the enrollment date plus free_look_days.
        replaced_by: >-
          A billing-error correction is credited whatever the plan's enrollment date, because the free-look limit governs only
          free-look refunds.
    trigger: state_due
    subject: [protect_premium_credit]
    computes: amount
    target_tool: credit_protection_fee_error_2320aa46
    params:
      tenure_long_months: 60
      tenure_mid_months: 24
      reversal_window_months: 12
      tenure_long_share: 0.5
      tenure_mid_share: 0.25
      repeat_window_months: 12
      repeat_two_share: 0.5
      repeat_one_share: 0.25
      autopay_window_months: 12
      autopay_full_drafts: 12
      autopay_half_drafts: 6
      autopay_full_share: 0.25
      autopay_half_share: 0.1
    rule: >
      A protection fee charge is in billing error when it is a second charge for a billing period already charged on the plan, and
      the charge examined is the latest protection fee charge posted on the plan. The standard billing-error correction credits the
      charge in error in full with a billing_error_correction credit referencing that charge and adds no service credit.
      A billing-error correction is credited whatever the plan's enrollment date, because the free-look limit governs only
      free-look refunds.
      Bluegate adds a billing-error service credit to the correction, equal to the service-credit base multiplied by the sum of the
      tenure service share, the repeat-error share and the AutoPay share.
      The correction credited is the charge in error plus the billing-error service credit, rounded to the cent only at this final
      step.
      The service-credit base is the two collections of the period together when the period's fee was collected twice, the charge in
      error alone when the period's fee was collected once, and nothing otherwise.
      The tenure service share is 0.5 when the covered rental's move-in date is 60 or more whole months before the handling date and
      the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.25 when the move-in date
      is at least 24 and fewer than 60 whole months before the handling date and the ledger shows no such reversal, and 0
      otherwise.
      The repeat-error share is 0.5 when the plan already carries two or more billing-error corrections posted in the 12 whole months
      before the handling date, 0.25 when it carries exactly one, and 0 when it carries none.
      The AutoPay share is 0.25 when 12 or more AutoPay drafts were submitted for the covered rental in the 12 whole months before
      the handling date, 0.1 when 6 to 11 were, and 0 when fewer than 6 were.
    baseline:
      rule: >-
        A protection fee charge is in billing error when it is a second charge for a billing period already charged on the plan, and
        the charge examined is the latest protection fee charge posted on the plan. The standard billing-error correction credits the
        charge in error in full with a billing_error_correction credit referencing that charge and adds no service credit.
      params: []
    prerequisite: []
    cross_category:
      - category: unit
        as: branch
        reads: [move_in_date, unit_ledger.event_type, unit_ledger.entry_date]
        note: The covered rental's move-in date and its rent payment reversals decide the tenure service share.
      - category: autopay
        as: history
        reads: [autopay_drafts.event_type, autopay_drafts.draft_date, autopay_drafts.agreement_id]
        note: The count of AutoPay drafts submitted for the covered rental in the last 12 months decides the AutoPay share.
    compute:
      - charge_amount: "LATEST('protect_premiums','amount', date_field='entry_date', event_type='protect_premium_charge')"
      - charge_period: "LATEST('protect_premiums','period_start', date_field='entry_date', event_type='protect_premium_charge')"
      - period_charges: "COUNT('protect_premiums', event_type='protect_premium_charge', period_start=charge_period)"
      - error_amount: "float(charge_amount or 0) if period_charges >= 2 else 0.0"
      - period_collections: "COUNT('protect_premiums', event_type='protect_premium_collected', period_start=charge_period)"
      - service_base: "SUM('protect_premiums','amount', event_type='protect_premium_collected', period_start=charge_period) if period_collections >= 2 else (error_amount if period_collections == 1 else 0.0)"
      - tenure_months: "MONTHS(CFIELD('unit','move_in_date', rental_id=F('rental_id')), NOW)"
      - rent_reversals: "XCOUNT('unit','unit_ledger', within_months=K('reversal_window_months'), date_field='entry_date', event_type='unit_payment_reversal', rental_id=F('rental_id'))"
      - tenure_share: "K('tenure_long_share') if (tenure_months >= K('tenure_long_months') and rent_reversals == 0) else (K('tenure_mid_share') if (tenure_months >= K('tenure_mid_months') and tenure_months < K('tenure_long_months') and rent_reversals == 0) else 0.0)"
      - earlier_corrections: "COUNT('protect_premiums', within_months=K('repeat_window_months'), date_field='entry_date', event_type='protect_premium_credit', credit_type='billing_error_correction')"
      - repeat_share: "K('repeat_two_share') if earlier_corrections >= 2 else (K('repeat_one_share') if earlier_corrections == 1 else 0.0)"
      - autopay_drafts: "XCOUNT('autopay','autopay_drafts', within_months=K('autopay_window_months'), date_field='draft_date', event_type='autopay_draft', agreement_id=F('rental_id'))"
      - autopay_share: "K('autopay_full_share') if autopay_drafts >= K('autopay_full_drafts') else (K('autopay_half_share') if autopay_drafts >= K('autopay_half_drafts') else 0.0)"
      - service_credit: "service_base * (tenure_share + repeat_share + autopay_share)"
      - result: "RND(error_amount + service_credit, 2)"
    compute_basis:
      charge_amount: "the charge examined is the latest protection fee charge posted on the plan"
      charge_period: "A protection fee charge is in billing error when it is a second charge for a billing period already charged on the plan"
      period_charges: "A protection fee charge is in billing error when it is a second charge for a billing period already charged on the plan"
      error_amount: "The standard billing-error correction credits the charge in error in full with a billing_error_correction credit referencing that charge and adds no service credit."
      period_collections: "when the period's fee was collected twice, the charge in error alone when the period's fee was collected once"
      service_base: "The service-credit base is the two collections of the period together when the period's fee was collected twice, the charge in error alone when the period's fee was collected once, and nothing otherwise."
      tenure_months: "when the covered rental's move-in date is 60 or more whole months before the handling date"
      rent_reversals: "the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date"
      tenure_share: "The tenure service share is 0.5 when the covered rental's move-in date is 60 or more whole months before the handling date and the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.25 when the move-in date is at least 24 and fewer than 60 whole months before the handling date and the ledger shows no such reversal, and 0 otherwise."
      earlier_corrections: "when the plan already carries two or more billing-error corrections posted in the 12 whole months before the handling date"
      repeat_share: "The repeat-error share is 0.5 when the plan already carries two or more billing-error corrections posted in the 12 whole months before the handling date, 0.25 when it carries exactly one, and 0 when it carries none."
      autopay_drafts: "when 12 or more AutoPay drafts were submitted for the covered rental in the 12 whole months before the handling date"
      autopay_share: "The AutoPay share is 0.25 when 12 or more AutoPay drafts were submitted for the covered rental in the 12 whole months before the handling date, 0.1 when 6 to 11 were, and 0 when fewer than 6 were."
      service_credit: "Bluegate adds a billing-error service credit to the correction, equal to the service-credit base multiplied by the sum of the tenure service share, the repeat-error share and the AutoPay share."
      result: "The correction credited is the charge in error plus the billing-error service credit, rounded to the cent only at this final step."
    factors:
      - id: service_credit_base
        effect: method
        decides: service_base
        bindings: [period_collections, service_base]
        ladder:
          - when: "the period's fee was collected twice"
            method: "the service credit is figured on the two collections of the period together"
          - when: "the period's fee was collected once"
            method: "the service credit is figured on the charge in error alone"
          - when: "otherwise"
            method: "no service credit is figured"
        baseline:
          service_base: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_service_share
        effect: parameter
        decides: tenure_share
        bindings: [tenure_months, rent_reversals, tenure_share]
        ladder:
          - when: "the covered rental's move-in date is 60 or more whole months before the handling date and its ledger shows no rent payment reversal in the 12 whole months before the handling date"
            value: "K('tenure_long_share')"
          - when: "the move-in date is at least 24 and fewer than 60 whole months before the handling date and the ledger shows no such reversal"
            value: "K('tenure_mid_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_share: "0.0"
        evidence: [cross_category, date, history]
        cross_difficulty: unit
      - id: repeat_error_share
        effect: parameter
        decides: repeat_share
        bindings: [earlier_corrections, repeat_share]
        ladder:
          - when: "the plan already carries two or more billing-error corrections posted in the 12 whole months before the handling date"
            value: "K('repeat_two_share')"
          - when: "the plan carries exactly one such correction"
            value: "K('repeat_one_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_share: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: autopay_service_share
        effect: parameter
        decides: autopay_share
        bindings: [autopay_drafts, autopay_share]
        ladder:
          - when: "12 or more AutoPay drafts were submitted for the covered rental in the 12 whole months before the handling date"
            value: "K('autopay_full_share')"
          - when: "6 to 11 such drafts were submitted"
            value: "K('autopay_half_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          autopay_share: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: autopay
    inputs:
      history:
        - {table: protect_premiums, aggregate: latest, field: amount, filters: {event_type: protect_premium_charge}}
        - {table: protect_premiums, aggregate: count, field: premium_entry_id, within_months: 12, filters: {event_type: protect_premium_credit, credit_type: billing_error_correction}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
        - {category: autopay, table: autopay_drafts, aggregate: count, field: autopay_draft_id, within_months: 12, filters: {event_type: autopay_draft}}
      cross_category: [unit, autopay]

  - id: protect_ext_first_claim_decision
    base_policy_refs: [protect_agg_annual_aggregate, protect_evt_claim_eligibility, protect_evt_claim_settlement, protect_evt_reconsideration]
    overwrite:
      - base_policy: protect_agg_annual_aggregate
        superseded_clause: >-
          Within one plan, the total paid on claims whose loss dates fall in any rolling 365-day window, measured by
          protect_msr_paid_365d, may not exceed coverage_limit_usd times aggregate_limit_multiple of the level in force on the
          loss date being decided; an approval is reduced to the room left under that aggregate, and a claim with no room left is
          denied with reason aggregate_limit_reached.
        replaced_by: >-
          The room under the annual aggregate is coverage_limit_usd times aggregate_limit_multiple minus the claim payments, net
          of voids, issued under the plan in the 12 whole months before the handling date on claims other than the claim decided,
          never below zero.
      - base_policy: protect_evt_claim_settlement
        superseded_clause: >-
          The payable amount is the general-property assessment plus each special class capped at its sublimit (jewelry, furs and
          watches; electronics; collectibles and art; firearms; business inventory), with the total capped at coverage_limit_usd, minus
          deductible_usd once per occurrence, and never below zero.
        replaced_by: >-
          The deductible charged on the decision is the deductible base multiplied by the tenure share and then by the claim-history
          factor, and the payable amount is the settled total minus that deductible, never below zero.
      - base_policy: protect_evt_reconsideration
        superseded_clause: >-
          A reconsideration is taken only when it is requested not later than the decision date plus claim_reconsideration_window_days.
        replaced_by: >-
          A first decision answers a claim that carries no claim decision yet, so the reconsideration window, which runs from an
          earlier decision date, does not apply to it.
    trigger: state_due
    subject: [protect_claim_decision]
    computes: amount
    target_tool: record_claim_decision_61f94ad8
    params:
      burglary_drive_up_pct: 0.10
      burglary_interior_pct: 0.05
      tenure_long_months: 60
      tenure_mid_months: 24
      share_long: 0.5
      share_mid: 0.75
      reversal_window_months: 12
      history_window_months: 36
      history_one_factor: 1.25
      history_two_factor: 1.5
      history_three_factor: 1.75
      electronics_alarm_multiple: 1.5
      electronics_interior_multiple: 1.25
      plan_long_months: 36
      plan_mid_months: 12
      jewelry_long_multiple: 1.5
      jewelry_mid_multiple: 1.2
      aggregate_window_months: 12
    rule: >
      A first decision answers a claim that carries no claim decision yet, so the reconsideration window, which runs from an earlier
      decision date, does not apply to it. The claim decided is the claim most recently filed on the plan, its loss date and peril are
      read from the claim as filed, and its property values are those of the latest adjuster assessment recorded on that claim.
      The standard settlement takes the general-property value plus each special-class value capped at its sublimit, caps that sum
      at coverage_limit_usd, and subtracts a deductible of deductible_usd, never going below zero, which gives the payable amount.
      The decision's jewelry cap is jewelry_furs_watches_sublimit_usd multiplied by 1.5 when the plan's effective date is 36 or more
      whole months before the loss date, by 1.2 when it is at least 12 and fewer than 36 whole months before the loss date, and
      by 1 otherwise.
      The decision's electronics cap is electronics_sublimit_usd multiplied by 1.5 when the covered unit's class includes an
      individual door alarm, by 1.25 when the class has no door alarm and no drive-up access, and by 1 otherwise.
      The settled total is the general-property value plus the jewelry value capped at the decision's jewelry cap plus the
      electronics value capped at the decision's electronics cap plus the collectibles, firearms and business-inventory values each
      capped at its sublimit, and that sum is capped at coverage_limit_usd.
      The deductible base of the decision is deductible_usd, except that for a burglary claim on a unit whose class has drive-up
      access it is 10 percent of the settled total, and for a burglary claim on a unit whose class has no drive-up access it is 5
      percent of the settled total, in both burglary situations never less than deductible_usd.
      The decision's tenure share of the deductible is 0.5 when the covered rental's move-in date is 60 or more whole months before
      the loss date and the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.75
      when the move-in date is at least 24 and fewer than 60 whole months before the loss date and the ledger shows no such
      reversal, and 1 otherwise.
      The decision's claim-history factor is 1.75 when three or more paid claims on the plan have a loss date in the 36 whole months
      before the handling date, 1.5 when exactly two do, 1.25 when exactly one does, and 1 when none does.
      The deductible charged on the decision is the deductible base multiplied by the tenure share and then by the claim-history
      factor, and the payable amount is the settled total minus that deductible, never below zero.
      The room under the annual aggregate is coverage_limit_usd times aggregate_limit_multiple minus the claim payments, net of
      voids, issued under the plan in the 12 whole months before the handling date on claims other than the claim decided, never
      below zero.
      The amount approved is the lower of the payable amount and that room, rounded to the cent only at this final step.
      An approval equal to the payable amount is approved_full with reason none, and an approval below it but above zero is
      approved_partial with reason aggregate_limit_reached.
    baseline:
      rule: >-
        The claim decided is the claim most recently filed on the plan, its loss date and peril are read from the claim as filed,
        and its property values are those of the latest adjuster assessment recorded on that claim. The standard settlement takes
        the general-property value plus each special-class value capped at its sublimit, caps that sum at coverage_limit_usd, and
        subtracts a deductible of deductible_usd, never going below zero, which gives the payable amount. The room under the annual
        aggregate is coverage_limit_usd times aggregate_limit_multiple minus the claim payments, net of voids, issued under the plan
        in the 12 whole months before the handling date on claims other than the claim decided, never below zero. The amount approved is the lower of the payable amount
        and that room, rounded to the cent only at this final step.
      params: [coverage_limit_usd, deductible_usd, jewelry_furs_watches_sublimit_usd, electronics_sublimit_usd, collectibles_art_sublimit_usd, firearms_sublimit_usd, business_inventory_sublimit_usd, aggregate_limit_multiple, aggregate_window_months]
    prerequisite: []
    cross_category:
      - category: unit
        as: branch
        reads: [move_in_date, unit_ledger.event_type, unit_ledger.entry_date, drive_up_access, door_alarm_included]
        note: The covered rental's move-in date and rent reversals decide the tenure share; its class's drive-up access and door alarm decide the burglary deductible base and the electronics cap.
    compute:
      - claim: "LATEST('protect_claims','claim_id', date_field='filed_date')"
      - loss_date: "LATEST('protect_claims','loss_date', date_field='filed_date')"
      - peril: "LATEST('protect_claims','peril', date_field='filed_date')"
      - gen_value: "LATEST('protect_claim_events','assessed_general_value', event_type='protect_claim_assessment', claim_id=claim)"
      - jewelry_value: "LATEST('protect_claim_events','assessed_jewelry_value', event_type='protect_claim_assessment', claim_id=claim)"
      - electronics_value: "LATEST('protect_claim_events','assessed_electronics_value', event_type='protect_claim_assessment', claim_id=claim)"
      - collectibles_value: "LATEST('protect_claim_events','assessed_collectibles_value', event_type='protect_claim_assessment', claim_id=claim)"
      - firearms_value: "LATEST('protect_claim_events','assessed_firearms_value', event_type='protect_claim_assessment', claim_id=claim)"
      - inventory_value: "LATEST('protect_claim_events','assessed_business_inventory_value', event_type='protect_claim_assessment', claim_id=claim)"
      - plan_months: "MONTHS(F('effective_date'), loss_date)"
      - jewelry_cap: "P('jewelry_furs_watches_sublimit_usd') * (K('jewelry_long_multiple') if plan_months >= K('plan_long_months') else (K('jewelry_mid_multiple') if plan_months >= K('plan_mid_months') else 1.0))"
      - alarm_e: "CPARAM('unit','door_alarm_included', rental_id=F('rental_id'))"
      - drive_up_e: "CPARAM('unit','drive_up_access', rental_id=F('rental_id'))"
      - electronics_cap: "P('electronics_sublimit_usd') * (K('electronics_alarm_multiple') if alarm_e else (K('electronics_interior_multiple') if (not alarm_e and not drive_up_e) else 1.0))"
      - settled_total: "MN(P('coverage_limit_usd'), float(gen_value or 0) + MN(float(jewelry_value or 0), jewelry_cap) + MN(float(electronics_value or 0), electronics_cap) + MN(float(collectibles_value or 0), P('collectibles_art_sublimit_usd')) + MN(float(firearms_value or 0), P('firearms_sublimit_usd')) + MN(float(inventory_value or 0), P('business_inventory_sublimit_usd')))"
      - drive_up_d: "CPARAM('unit','drive_up_access', rental_id=F('rental_id'))"
      - deductible_base: "MX(P('deductible_usd'), settled_total * K('burglary_drive_up_pct')) if (peril == 'burglary' and drive_up_d) else (MX(P('deductible_usd'), settled_total * K('burglary_interior_pct')) if (peril == 'burglary' and not drive_up_d) else P('deductible_usd'))"
      - rental_months: "MONTHS(CFIELD('unit','move_in_date', rental_id=F('rental_id')), loss_date)"
      - rent_reversals: "XCOUNT('unit','unit_ledger', within_months=K('reversal_window_months'), date_field='entry_date', event_type='unit_payment_reversal', rental_id=F('rental_id'))"
      - tenure_share: "K('share_long') if (rental_months >= K('tenure_long_months') and rent_reversals == 0) else (K('share_mid') if (rental_months >= K('tenure_mid_months') and rental_months < K('tenure_long_months') and rent_reversals == 0) else 1.0)"
      - paid_claims: "COUNT('protect_claims', within_months=K('history_window_months'), date_field='loss_date', claim_status='paid')"
      - history_factor: "K('history_three_factor') if paid_claims >= 3 else (K('history_two_factor') if paid_claims == 2 else (K('history_one_factor') if paid_claims == 1 else 1.0))"
      - deductible: "deductible_base * tenure_share * history_factor"
      - payable: "MX(0, settled_total - deductible)"
      - paid_12m: "SUM('protect_claim_events','amount', within_months=K('aggregate_window_months'), event_type='protect_claim_payment')"
      - voided_12m: "SUM('protect_claim_events','amount', within_months=K('aggregate_window_months'), event_type='protect_claim_payment_voided')"
      - own_paid_12m: "SUM('protect_claim_events','amount', within_months=K('aggregate_window_months'), event_type='protect_claim_payment', claim_id=claim)"
      - own_voided_12m: "SUM('protect_claim_events','amount', within_months=K('aggregate_window_months'), event_type='protect_claim_payment_voided', claim_id=claim)"
      - room: "MX(0, P('coverage_limit_usd') * P('aggregate_limit_multiple') - ((paid_12m - voided_12m) - (own_paid_12m - own_voided_12m)))"
      - result: "RND(MN(payable, room), 2)"
    compute_basis:
      claim: "The claim decided is the claim most recently filed on the plan, its loss date and peril are read from the claim as filed, and its property values are those of the latest adjuster assessment recorded on that claim."
      loss_date: "its loss date and peril are read from the claim as filed"
      peril: "its loss date and peril are read from the claim as filed"
      gen_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      jewelry_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      electronics_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      collectibles_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      firearms_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      inventory_value: "its property values are those of the latest adjuster assessment recorded on that claim"
      plan_months: "when the plan's effective date is 36 or more whole months before the loss date"
      jewelry_cap: "The decision's jewelry cap is jewelry_furs_watches_sublimit_usd multiplied by 1.5 when the plan's effective date is 36 or more whole months before the loss date, by 1.2 when it is at least 12 and fewer than 36 whole months before the loss date, and by 1 otherwise."
      alarm_e: "when the covered unit's class includes an individual door alarm"
      drive_up_e: "when the class has no door alarm and no drive-up access"
      electronics_cap: "The decision's electronics cap is electronics_sublimit_usd multiplied by 1.5 when the covered unit's class includes an individual door alarm, by 1.25 when the class has no door alarm and no drive-up access, and by 1 otherwise."
      settled_total: "The settled total is the general-property value plus the jewelry value capped at the decision's jewelry cap plus the electronics value capped at the decision's electronics cap plus the collectibles, firearms and business-inventory values each capped at its sublimit, and that sum is capped at coverage_limit_usd."
      drive_up_d: "for a burglary claim on a unit whose class has drive-up access"
      deductible_base: "The deductible base of the decision is deductible_usd, except that for a burglary claim on a unit whose class has drive-up access it is 10 percent of the settled total, and for a burglary claim on a unit whose class has no drive-up access it is 5 percent of the settled total, in both burglary situations never less than deductible_usd."
      rental_months: "when the covered rental's move-in date is 60 or more whole months before the loss date"
      rent_reversals: "the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date"
      tenure_share: "The decision's tenure share of the deductible is 0.5 when the covered rental's move-in date is 60 or more whole months before the loss date and the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.75 when the move-in date is at least 24 and fewer than 60 whole months before the loss date and the ledger shows no such reversal, and 1 otherwise."
      paid_claims: "three or more paid claims on the plan have a loss date in the 36 whole months before the handling date"
      history_factor: "The decision's claim-history factor is 1.75 when three or more paid claims on the plan have a loss date in the 36 whole months before the handling date, 1.5 when exactly two do, 1.25 when exactly one does, and 1 when none does."
      deductible: "The deductible charged on the decision is the deductible base multiplied by the tenure share and then by the claim-history factor"
      payable: "the payable amount is the settled total minus that deductible, never below zero."
      paid_12m: "minus the claim payments, net of voids, issued under the plan in the 12 whole months before the handling date"
      voided_12m: "minus the claim payments, net of voids, issued under the plan in the 12 whole months before the handling date"
      own_paid_12m: "on claims other than the claim decided"
      own_voided_12m: "on claims other than the claim decided"
      room: "The room under the annual aggregate is coverage_limit_usd times aggregate_limit_multiple minus the claim payments, net of voids, issued under the plan in the 12 whole months before the handling date on claims other than the claim decided, never below zero."
      result: "The amount approved is the lower of the payable amount and that room, rounded to the cent only at this final step."
    factors:
      - id: decision_jewelry_cap
        effect: parameter
        decides: jewelry_cap
        bindings: [plan_months, jewelry_cap]
        ladder:
          - when: "the plan's effective date is 36 or more whole months before the loss date"
            value: "jewelry_furs_watches_sublimit_usd times K('jewelry_long_multiple')"
          - when: "the plan's effective date is at least 12 and fewer than 36 whole months before the loss date"
            value: "jewelry_furs_watches_sublimit_usd times K('jewelry_mid_multiple')"
          - when: "otherwise"
            value: "jewelry_furs_watches_sublimit_usd"
