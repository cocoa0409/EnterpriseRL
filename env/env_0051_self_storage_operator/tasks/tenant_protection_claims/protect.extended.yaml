            value: "K('history_three_factor')"
          - when: "exactly two paid claims on the plan have a loss date in that window"
            value: "K('history_two_factor')"
          - when: "exactly one paid claim on the plan has a loss date in that window"
            value: "K('history_one_factor')"
          - when: "otherwise"
            value: "1"
