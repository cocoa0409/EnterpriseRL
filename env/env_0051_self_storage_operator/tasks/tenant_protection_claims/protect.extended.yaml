      paid_claims: "three or more paid claims on the plan have a loss date in the 36 whole months before the handling date"
      history_factor: "The reconsideration's claim-history factor is 1.75 when three or more paid claims on the plan have a loss date in the 36 whole months before the handling date, 1.5 when exactly two do, 1.25 when exactly one does, and 1 when none does."
      deductible: "The deductible charged on the reconsideration is the deductible base multiplied by the tenure share and then by the claim-history factor"
      payable: "the payable amount is the settled total minus that deductible, never below zero."
      paid_12m: "minus the claim payments, net of voids, issued under the plan in the 12 whole months before the handling date"
      voided_12m: "minus the claim payments, net of voids, issued under the plan in the 12 whole months before the handling date"
      own_paid_12m: "on claims other than the claim reconsidered"
      own_voided_12m: "on claims other than the claim reconsidered"
      room: "The room under the annual aggregate is coverage_limit_usd times aggregate_limit_multiple minus the claim payments, net of voids, issued under the plan in the 12 whole months before the handling date on claims other than the claim reconsidered, never below zero."
