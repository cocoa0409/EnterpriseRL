      - id: decision_electronics_cap
        effect: parameter
        decides: electronics_cap
        bindings: [alarm_e, drive_up_e, electronics_cap]
        ladder:
          - when: "the covered unit's class includes an individual door alarm"
            value: "electronics_sublimit_usd times K('electronics_alarm_multiple')"
          - when: "the covered unit's class has no door alarm and no drive-up access"
            value: "electronics_sublimit_usd times K('electronics_interior_multiple')"
          - when: "otherwise"
            value: "electronics_sublimit_usd"
