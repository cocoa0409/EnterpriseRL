        - {table: protect_claim_events, aggregate: latest, field: assessed_general_value, filters: {event_type: protect_claim_assessment}}
        - {table: protect_claims, aggregate: count, field: claim_id, within_months: 36, filters: {claim_status: paid}}
        - {table: protect_claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: protect_claim_payment}}
        - {category: unit, table: unit_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: unit_payment_reversal}}
      cross_category: [unit]

  - id: protect_ext_recovery_repayment
    base_policy_refs: [protect_evt_claim_payment_void]
    overwrite:
      - base_policy: protect_evt_claim_payment_void
        superseded_clause: >-
          When stolen property is recovered after payment, the tenant repays the amount paid for the recovered items, or surrenders
          them, within recovered_property_repayment_days of the recovery date, and the repaid amount is recorded as a void of the
          payment it reverses.
        replaced_by: >-
          The recovery repayment is the net claim money paid on the claim minus the entitlement after recovery minus any credit balance
          standing on the plan's protection fee ledger, never below zero, rounded to the cent only at this final step, and it is
          recorded as a void of the earliest claim payment issued on the claim.
    trigger: on_request
    subject: [protect_claim_payment_voided]
    computes: amount
    target_tool: repay_recovered_claim_money_180976c0
    params:
      burglary_drive_up_pct: 0.10
      burglary_interior_pct: 0.05
      tenure_long_months: 60
      tenure_mid_months: 24
      share_long: 0.5
      share_mid: 0.75
      reversal_window_months: 12
      history_window_months: 36
      history_one_factor: 1.25
      history_two_factor: 1.5
      history_three_factor: 1.75
      electronics_alarm_multiple: 1.5
      electronics_interior_multiple: 1.25
      plan_long_months: 36
      plan_mid_months: 12
      jewelry_long_multiple: 1.5
      jewelry_mid_multiple: 1.2
      prompt_repayment_days: 15
    rule: >
      When stolen property on a paid claim is recovered, the adjuster records a further assessment of the property still missing,
      and the tenant may settle the recovery by repaying the claim money the recovered property no longer supports. The claim
      repaid is the claim most recently filed on the plan; its loss date and peril are read from the claim as filed, the property
      still missing is the latest adjuster assessment recorded on that claim, and the property before recovery is the highest value
      any assessment of that claim records for each property class.
      The standard re-settlement values the property still missing with each special class capped at its sublimit, caps that sum at
      coverage_limit_usd and subtracts a deductible of deductible_usd, never going below zero, which gives the entitlement after
      recovery.
      The recovery repayment is the net claim money paid on the claim minus the entitlement after recovery minus any credit balance
      standing on the plan's protection fee ledger, never below zero, rounded to the cent only at this final step, and it is
      recorded as a void of the earliest claim payment issued on the claim.
      The re-settlement's jewelry cap is jewelry_furs_watches_sublimit_usd multiplied by 1.5 when the plan's effective date is 36 or
      more whole months before the loss date, by 1.2 when it is at least 12 and fewer than 36 whole months before the loss date,
      and by 1 otherwise.
      The re-settlement's electronics cap is electronics_sublimit_usd multiplied by 1.5 when the covered unit's class includes an
      individual door alarm, by 1.25 when the class has no door alarm and no drive-up access, and by 1 otherwise.
      The missing-property total is the general-property value still missing plus the jewelry still missing capped at the
      re-settlement's jewelry cap plus the electronics still missing capped at the re-settlement's electronics cap plus the
      collectibles, firearms and business-inventory values still missing each capped at its sublimit, capped at
      coverage_limit_usd, and the pre-recovery total is figured the same way on the property before recovery.
      The re-settlement deductible base is deductible_usd, except that for a burglary claim on a unit whose class has drive-up access
      it is 10 percent of the missing-property total, and for a burglary claim on a unit whose class has no drive-up access it is
      5 percent of the missing-property total, in both burglary situations never less than deductible_usd.
      The re-settlement's tenure share is 0.5 when the covered rental's move-in date is 60 or more whole months before the loss date
      and the rental's ledger shows no rent payment reversal in the 12 whole months before the handling date, 0.75 when the
      move-in date is at least 24 and fewer than 60 whole months before the loss date and the ledger shows no such reversal, and 1
      otherwise.
      The re-settlement's claim-history factor is 1.75 when three or more other paid claims on the plan have a loss date in the 36
      whole months before the handling date, 1.5 when exactly two do, 1.25 when exactly one does, and 1 when none does.
      The full re-settlement deductible is the re-settlement deductible base multiplied by the tenure share and then by the
      claim-history factor.
      The deductible kept on recovery is nothing when the handling date is 15 or fewer calendar days after the date of the latest
      assessment of the claim, the full re-settlement deductible multiplied by the missing-property total and divided by the
      pre-recovery total when it is more than 15 and at most recovered_property_repayment_days calendar days after that date, and
      the full re-settlement deductible otherwise.
      The entitlement after recovery is the missing-property total minus the deductible kept on recovery, never below zero.
      The recovery repayment on a claim is fixed only after every claim filed under the same police report number on the tenant's
      other protected units carries a claim decision.
      The recovery repayment is not fixed until every protection fee charged a second time for the same billing period on the
      plan carries a billing-error credit on the fee ledger.
    baseline:
      rule: >-
        The claim repaid is the claim most recently filed on the plan; its loss date and peril are read from the claim as filed, the
        property still missing is the latest adjuster assessment recorded on that claim, and the property before recovery is the
        highest value any assessment of that claim records for each property class. The standard re-settlement values the property
        still missing with each special class capped at its sublimit, caps that sum at coverage_limit_usd and subtracts a deductible
        of deductible_usd, never going below zero, which gives the entitlement after recovery. The recovery repayment is the net
        claim money paid on the claim minus the entitlement after recovery minus any credit balance standing on the plan's
        protection fee ledger, never below zero, rounded to the cent only at this final step, and it is recorded as a void of the
        earliest claim payment issued on the claim.
      params: [coverage_limit_usd, deductible_usd, jewelry_furs_watches_sublimit_usd, electronics_sublimit_usd, collectibles_art_sublimit_usd, firearms_sublimit_usd, business_inventory_sublimit_usd]
    prerequisite:
      - problem: protect_ext_first_claim_decision
        kind: state_gate
        gate: protect_claim_events.decision
        form: state
        policy_source: >-
          The recovery repayment on a claim is fixed only after every claim filed under the same police report number on the tenant's
          other protected units carries a claim decision.
        condition: >-
          Every protection claim of the customer on another plan that shares the repaid claim's police report number has a claim
          decision row among its handling events.
        resolved_by: record_claim_decision_61f94ad8
        effect: >-
          The other unit's claim from the same burglary gains its decision row, so the recovered property has been attributed across
          every claim of the occurrence and the repayment may be fixed.
      - problem: protect_ext_fee_error_credit
        kind: value_input
        gate: credit_offset
        form: state
        policy_source: >-
          The recovery repayment is not fixed until every protection fee charged a second time for the same billing period on the
          plan carries a billing-error credit on the fee ledger.
        condition: >-
          Every second protection fee charge for a billing period already charged on the plan has a billing-error credit entry that
          references it, so the plan's fee balance shows the resulting credit.
        resolved_by: credit_protection_fee_error_2320aa46
        effect: >-
          The billing-error credit turns the plan's protection fee balance into a credit balance, and the credit balance subtracted
          from the recovery repayment rises from zero to that credit.
    cross_category:
      - category: unit
        as: branch
        reads: [move_in_date, unit_ledger.event_type, unit_ledger.entry_date, drive_up_access, door_alarm_included]
        note: The covered rental's move-in date and rent reversals decide the re-settlement tenure share; its class's drive-up access and door alarm decide the burglary deductible base and the electronics cap.
    compute:
      - claim: "LATEST('protect_claims','claim_id', date_field='filed_date')"
      - loss_date: "LATEST('protect_claims','loss_date', date_field='filed_date')"
      - peril: "LATEST('protect_claims','peril', date_field='filed_date')"
      - paid: "SUM('protect_claim_events','amount', event_type='protect_claim_payment', claim_id=claim)"
      - voided: "SUM('protect_claim_events','amount', event_type='protect_claim_payment_voided', claim_id=claim)"
      - net_paid: "paid - voided"
      - gen_left: "float(LATEST('protect_claim_events','assessed_general_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - jewelry_left: "float(LATEST('protect_claim_events','assessed_jewelry_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - electronics_left: "float(LATEST('protect_claim_events','assessed_electronics_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - collectibles_left: "float(LATEST('protect_claim_events','assessed_collectibles_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - firearms_left: "float(LATEST('protect_claim_events','assessed_firearms_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - inventory_left: "float(LATEST('protect_claim_events','assessed_business_inventory_value', event_type='protect_claim_assessment', claim_id=claim) or 0)"
      - gen_was: "MAX('protect_claim_events','assessed_general_value', event_type='protect_claim_assessment', claim_id=claim)"
      - jewelry_was: "MAX('protect_claim_events','assessed_jewelry_value', event_type='protect_claim_assessment', claim_id=claim)"
      - electronics_was: "MAX('protect_claim_events','assessed_electronics_value', event_type='protect_claim_assessment', claim_id=claim)"
      - collectibles_was: "MAX('protect_claim_events','assessed_collectibles_value', event_type='protect_claim_assessment', claim_id=claim)"
      - firearms_was: "MAX('protect_claim_events','assessed_firearms_value', event_type='protect_claim_assessment', claim_id=claim)"
      - inventory_was: "MAX('protect_claim_events','assessed_business_inventory_value', event_type='protect_claim_assessment', claim_id=claim)"
      - plan_months: "MONTHS(F('effective_date'), loss_date)"
      - jewelry_cap: "P('jewelry_furs_watches_sublimit_usd') * (K('jewelry_long_multiple') if plan_months >= K('plan_long_months') else (K('jewelry_mid_multiple') if plan_months >= K('plan_mid_months') else 1.0))"
      - alarm_e: "CPARAM('unit','door_alarm_included', rental_id=F('rental_id'))"
      - drive_up_e: "CPARAM('unit','drive_up_access', rental_id=F('rental_id'))"
      - electronics_cap: "P('electronics_sublimit_usd') * (K('electronics_alarm_multiple') if alarm_e else (K('electronics_interior_multiple') if (not alarm_e and not drive_up_e) else 1.0))"
      - missing_total: "MN(P('coverage_limit_usd'), gen_left + MN(jewelry_left, jewelry_cap) + MN(electronics_left, electronics_cap) + MN(collectibles_left, P('collectibles_art_sublimit_usd')) + MN(firearms_left, P('firearms_sublimit_usd')) + MN(inventory_left, P('business_inventory_sublimit_usd')))"
      - before_total: "MN(P('coverage_limit_usd'), gen_was + MN(jewelry_was, jewelry_cap) + MN(electronics_was, electronics_cap) + MN(collectibles_was, P('collectibles_art_sublimit_usd')) + MN(firearms_was, P('firearms_sublimit_usd')) + MN(inventory_was, P('business_inventory_sublimit_usd')))"
      - drive_up_d: "CPARAM('unit','drive_up_access', rental_id=F('rental_id'))"
      - deductible_base: "MX(P('deductible_usd'), missing_total * K('burglary_drive_up_pct')) if (peril == 'burglary' and drive_up_d) else (MX(P('deductible_usd'), missing_total * K('burglary_interior_pct')) if (peril == 'burglary' and not drive_up_d) else P('deductible_usd'))"
      - rental_months: "MONTHS(CFIELD('unit','move_in_date', rental_id=F('rental_id')), loss_date)"
      - rent_reversals: "XCOUNT('unit','unit_ledger', within_months=K('reversal_window_months'), date_field='entry_date', event_type='unit_payment_reversal', rental_id=F('rental_id'))"
      - tenure_share: "K('share_long') if (rental_months >= K('tenure_long_months') and rent_reversals == 0) else (K('share_mid') if (rental_months >= K('tenure_mid_months') and rental_months < K('tenure_long_months') and rent_reversals == 0) else 1.0)"
      - other_paid_claims: "COUNT('protect_claims', within_months=K('history_window_months'), date_field='loss_date', claim_status='paid') - 1"
      - history_factor: "K('history_three_factor') if other_paid_claims >= 3 else (K('history_two_factor') if other_paid_claims == 2 else (K('history_one_factor') if other_paid_claims == 1 else 1.0))"
      - full_deductible: "deductible_base * tenure_share * history_factor"
      - recovery_days: "DAYS(LATEST('protect_claim_events','event_date', event_type='protect_claim_assessment', claim_id=claim), NOW)"
      - deductible_kept: "0.0 if recovery_days <= K('prompt_repayment_days') else (full_deductible * missing_total / before_total if recovery_days <= P('recovered_property_repayment_days') else full_deductible)"
      - entitlement_after: "MX(0, missing_total - deductible_kept)"
      - credit_offset: "MX(0, 0 - float(F('premium_balance_due') or 0))"
      - result: "RND(MX(0, net_paid - entitlement_after - credit_offset), 2)"
