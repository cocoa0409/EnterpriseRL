name: env_0052_collision_repair_network
company: Crestline Collision & Glass

background: |
  Crestline Collision & Glass is a national network of 612 company-operated collision repair centers across 29 states, backed by 184 mobile auto glass vans and 41 calibration-equipped centers, repairing about 640,000 vehicles a year.
  Its centers are I-CAR Gold Class, many hold manufacturer certifications for structural and aluminum repair, and the network repairs for private owners, for commercial fleets and on behalf of insurance companies.
  The customer and insurer desk speaks for the whole network in a plain, practical tone, serving vehicle owners and fleet managers as well as the adjusters and claims staff of the insurers it works with.
  Damage is first assessed under Repair Estimates & Appointments, booked as a Photo Estimate, Drive-In Estimate, Scheduled Estimate, Mobile Estimate, Blueprint Teardown Estimate or Structural Blueprint Estimate, each booking carrying its appointment, reschedules, revisions and any estimate-stage charges.
  A written estimate becomes a repair order: Insurance Claim Repairs are held as an Express, Standard, Major, Structural, Certified Structural or Aluminum Certified Structural Claim Repair, whose ledger records insurer approvals, supplements, deductibles, betterment, customer payments and insurer remittances.
  Customer-Pay Repairs are held as a Paintless Dent Repair Service, Cosmetic Touch-Up Service, Bumper Refinish Service, Panel Repair Service, Customer-Pay Collision Service or Complete Refinish Service, booked through quotes, deposits, parts orders, approvals of additional work and payments.
  Auto Glass Services run as Windshield Chip Repair, Side Glass Replacement, Rear Glass Replacement, Windshield Replacement, Camera-Equipped Windshield Replacement and Premium Feature Windshield Replacement jobs, paid by insurers' glass programs, by customers or by fleets.
  ADAS Sensor Calibrations are separate orders, a Dynamic Camera, Static Camera, Dual-Mode Camera, Blind Spot Radar, Front Radar or Multi-System Calibration, opened when a windshield, a repair or a warranty rework disturbs a driver-assistance sensor and recording alignment checks, attempts, dealer sublets and charges.
  Rental Vehicle Coordination arranges replacement cars through a national rental partner as an Economy, Compact, Intermediate, Full-Size, Standard SUV or Minivan Rental, tracking the covered days authorized and used and the customer's share of each invoice.
  Workmanship Warranties are issued on finished work as a Chip Repair Guarantee, Calibration Workmanship Warranty, Cosmetic Repair Workmanship Warranty, Glass Installation Lifetime Warranty, Collision Lifetime Workmanship Warranty or Certified Structural Lifetime Warranty, and collect the concerns, inspections, reworks and reimbursements raised under them.
  Insurers hold Insurer Program Agreements with the network, as a Network Referral Agreement, Select, Preferred or Premier Direct Repair Agreement, Managed Repair Program Agreement or Enterprise Master Services Agreement, which record claim assignments, quarterly scorecards and service-level credits.
  Most callers are vehicle owners in the middle of an insurance claim who hold an estimate booking or a repair order together with a rental, often a calibration order, and later one or more warranty coverages on the same vehicle.
  Others are customers paying for their own repairs or glass, fleet managers with several vehicles in the shop at once, and insurer adjusters calling about authorizations, supplements, rental days or remittances on their policyholders' repairs.
  Callers bring histories of reschedules and no-shows, supplements and holds, partial approvals and short pays, rentals running past their covered days, failed calibration attempts, and warranty concerns raised years after delivery on vehicles that may since have been sold.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_log

difficulties:
  - name: estimate_booking_desk
    claim:
      categories: [estimate]
      event_types: [estimate_book, estimate_reschedule, estimate_appointment_update, estimate_check_in, estimate_cancel, estimate_revise, estimate_figures_update, estimate_convert, estimate_decline, estimate_vehicle_release, estimate_fee_charge, estimate_fee_payment, estimate_fee_waiver]
    summary: >-
      Vehicle owners, fleet managers and insurer adjusters call to book, move, cancel or follow up on damage
      estimates, from a quick photo review of a scuffed bumper to a teardown of a structurally damaged vehicle
      left at a center, and the setting varies with the estimate type, the booking's status, whether an insurer
      claim number exists, the vehicle's damage profile and the customer's record of earlier no-shows and open
      bookings on the same vehicle. The governing records are the estimate booking, its history of reschedules,
      revisions, charges, payments and waivers, the customer's confirmation requests, the vehicle record and, on
      conversion, the repair order it opens; the rules gate which tier fits the damage
      (estimate_tier_eligibility), when appointments may be set or moved (estimate_scheduling_window,
      estimate_evt_reschedule), how many open bookings and no-shows a vehicle or customer may carry
      (estimate_agg_open_per_vehicle, estimate_agg_no_show_restriction), and how long a written estimate stays
      revisable and convertible (estimate_evt_revision, estimate_evt_conversion, estimate_evt_expiry), while the
      per-tier teardown, scan, measurement, tow, trip and storage charges and their credits on conversion follow
      estimate_evt_service_fees, estimate_evt_storage and estimate_evt_fee_settlement. In the natural course of
      business a booking is made, checked in, written and then converted, declined or left to expire, and a
      vehicle left for teardown is released only once nothing is owed on its booking
      (estimate_evt_decline_and_release). The agent books, reschedules, cancels, checks in, revises, converts,
      posts and settles charges and releases vehicles, whereas a teardown authorization and a decision not to
      repair are the customer's own confirmations, handed to the customer to give. Requests no rule decides,
      such as disputing the estimator's damage findings or the value of the vehicle, a vehicle whose storage has
      run into the lien process, or goodwill beyond the desk's authority that the customer insists on, are
      outside the desk's policy and go to a human representative as POLICY_NOT_COVERED.
  - name: claim_repair_billing_desk
    claim:
      categories: [claim]
      event_types: [claim_authorize, claim_supplement_submit, claim_supplement_decision, claim_hold, claim_resume, claim_insurer_approval, claim_customer_charge, claim_insurer_offset, claim_customer_payment, claim_customer_refund, claim_customer_credit, claim_deliver, claim_cancel, claim_total_loss, claim_insurer_payment, claim_insurer_adjustment]
    summary: >-
      Policyholders, claimants of another driver's insurer and insurer adjusters call about insurance claim repair
      orders that are waiting for authorization, held for a supplement, ready for pickup, withdrawn or declared a
      total loss, and the setting changes with the repair class, the coverage type, the deductible the insurer
      stated, the insurer's program agreement tier and the history of supplements, approvals, payments and
      remittances already on the order. The records are the repair order, its supplements and ledger, the
      customer's signed consents, the insurer's program agreement and the calibration orders linked to the
      repair; the rules decide when an authorization can be recorded (claim_evt_authorization), how each
      supplement is routed and decided (claim_evt_supplement_routing, claim_evt_supplement_decision), what the
      customer owes for deductible and betterment and that the deductible is never waived
      (claim_evt_deductible_betterment), how customer-pay additions, storage, payments, refunds and credits are
      booked (claim_evt_customer_pay_additions, claim_evt_storage, claim_evt_customer_payments), when a vehicle can
      be released or a repair order closed (claim_evt_delivery, claim_evt_insurer_settlement), and what a
      withdrawal or total loss does to every balance (claim_evt_withdrawal, claim_evt_total_loss), with the class
      parameters fixed by claim_repair_class_assignment. Repairs naturally move from opening through
      authorization, production with any holds, vehicle-ready and delivery to closing, with supplements, charges
      and remittances booked along the way. The agent records authorizations, supplements and decisions the
      insurer gives, posts charges, payments, refunds, credits and remittances and releases vehicles, while
      signing the repair authorization, direction to pay, non-original parts disclosure, customer-pay additions
      and a vehicle withdrawal are the customer's own acts handed to the customer. Disputes the rules do not
      settle, such as contesting an insurer's total-loss decision or a denied supplement, diminished-value or
      injury claims, or a demand that the network absorb the deductible, go to a human representative as
      POLICY_NOT_COVERED.
  - name: rental_coordination_desk
    claim:
      categories: [rental]
      event_types: [rental_reserve, rental_class_change, rental_pickup, rental_authorization, rental_coverage_end_update, rental_return, rental_days_consumed, rental_customer_charge, rental_direct_bill, rental_customer_payment, rental_customer_credit, rental_settle, rental_cancel]
    summary: >-
      Customers whose vehicles are in a network repair, glass job or warranty rework, and the adjusters paying for
      their rentals, call to reserve, upgrade, extend, return or settle replacement rentals, and the setting
      differs by rental class, coverage source (the customer's own rental coverage with a daily cap and total
      limit, another driver's insurer, the customer's own pocket, or a warranty courtesy), the renter's age, the
      status of the repair the rental depends on and the authorizations, notices and charges already on the
      reservation. The records are the reservation, its covered-day authorizations, repair notices and invoice
      entries, the extension requests sent to insurers and the repair order or warranty coverage behind the
      rental; the rules govern one reservation per repair (rental_agg_one_per_repair), class, renter and upgrade
      conditions (rental_class_and_renter), the initial and extended covered days and what each must rest on
      (rental_evt_initial_authorization, rental_evt_extension), when coverage ends after a repair notice
      (rental_evt_coverage_end), how rental days are counted from pickup to return (rental_evt_rental_days) and
      how the final invoice is split among insurer, network and customer together with options, fees, payments
      and credits (rental_evt_settlement_split, rental_evt_options_and_fees, rental_evt_customer_settlement). In
      the ordinary course a rental is reserved, authorized, picked up, extended as the repair requires, ended by
      the repair's notice, returned and settled. The agent reserves, changes classes, records pickups,
      authorizations the insurer grants, coverage ends, charges, payments and credits, while an extension is
      only as good as the insurer's own approval of it. Situations outside the rules, such as damage to the
      rental car, a renter below the minimum age, a demand that the network pay days the insurer refused, or
      rentals for vehicles the network is not repairing, go to a human representative as POLICY_NOT_COVERED.
  - name: sensor_calibration_desk
    claim:
      categories: [adas]
      event_types: [adas_order_open, adas_alignment_check, adas_precheck, adas_start, adas_attempt, adas_retry, adas_sublet, adas_complete, adas_decline, adas_cancel, adas_charge, adas_transfer_to_repair, adas_payment, adas_no_charge]
    summary: >-
      Owners of vehicles with driver-assistance cameras and radars call, alongside insurer adjusters and fleet
      managers, about calibrations required after a windshield replacement, a collision repair, a customer-pay
      repair or a warranty rework, or asked for because a warning light came on, and the setting turns on the
      calibration tier, the manufacturer procedure, the source job and its payer, the alignment history, the
      attempts already made and whether the insurer has approved the calibration on the repair order. The records
      are the calibration order, its alignment checks and attempts, its charges, transfers, payments and
      write-offs, the declination forms, the vehicle's sensor package and the source glass job, repair order or
      warranty rework; the rules decide the tier and the payer (adas_tier_and_payer), one open order per source
      (adas_agg_one_open_per_source), the preconditions a precheck must verify (adas_evt_precheck), the payer's
      agreement before any attempt (adas_evt_payer_approval), the number of attempts and the move to a dealer
      sublet (adas_evt_attempts), completion (adas_evt_completion), the charges and their transfer onto a claim
      repair (adas_evt_charges, adas_evt_settlement), and when a calibration may be declined or must be cancelled
      (adas_evt_declination, adas_evt_cancellation). An order is naturally opened, prechecked, attempted until it
      passes or is sublet, then completed, with its charges booked to whoever pays. The agent opens orders,
      records alignment checks, prechecks, attempts, retries, sublets, completions, cancellations, charges,
      transfers, payments and write-offs, while declining a calibration is the customer's own signed act handed to
      the customer. Matters no rule covers, such as a driver-assistance malfunction blamed on the network with no
      order behind it, a customer refusing both the calibration and the dealer for a radar the network will not
      release uncalibrated, or a demand for compensation after an incident, go to a human representative as
      POLICY_NOT_COVERED.
  - name: warranty_rework_desk
    claim:
      categories: [warranty]
      event_types: [warranty_concern_report, warranty_inspection, warranty_rework_authorize, warranty_rework_complete, warranty_charge, warranty_charge_payment, warranty_charge_waiver, warranty_reimbursement_approve, warranty_reimbursement_pay, warranty_redeem, warranty_void, warranty_end_by_sale]
    summary: >-
      Customers call months or years after a repair, glass job or calibration about peeling paint, a leaking
      windshield, wind noise, a chip that spread, a sensor out of calibration or a failed part, and the setting
      differs by warranty plan, the coverage's status, how long ago and at what odometer it was issued, whether the
      customer still owns the vehicle, the exclusions recorded at issue, the distance to the nearest center and the
      concerns and reworks already on file. The records are the warranty coverage, its concerns, inspections,
      remedies and ledger, the vehicle's ownership record, the source work it covers and any calibration order or
      courtesy rental a rework needs; the rules decide which coverage a concern belongs to
      (warranty_agg_one_per_source), when a concern may be recorded (warranty_evt_concern_report), how term,
      ownership, alteration and later losses end a coverage (warranty_term_and_end), how an inspection decides
      coverage against the plan's covered kinds, limits and exclusions (warranty_evt_inspection), which remedy
      follows and when repeated failures leave the desk (warranty_evt_rework), how a chip repair credit is
      redeemed (warranty_evt_chip_redemption), and how diagnostic charges and outside-shop reimbursements are
      handled (warranty_evt_diagnostic_fee, warranty_evt_outside_reimbursement). Concerns naturally move from
      report to inspection to an authorized remedy and its completion, with any charge or reimbursement booked
      after. The agent records reports, inspection outcomes, remedies, completions, charges, payments, waivers,
      reimbursements and the end of coverage, while a courtesy rental or a recalibration needed for a rework is
      arranged through those desks' own records. Claims the plans do not cover, such as a later owner asking to
      take over a coverage, consequential losses such as hotel or towing bills, a concern still unresolved after
      the allowed reworks, or demands to refund the original repair, go to a human representative as
      POLICY_NOT_COVERED.
