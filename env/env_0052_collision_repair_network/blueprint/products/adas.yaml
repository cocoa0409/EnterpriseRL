        post_calibration_road_test_miles: =post_calibration_road_test_miles
        calibration_report_delivery_hours: =calibration_report_delivery_hours
        report_retention_years: =report_retention_years
        certificate_issued: =certificate_issued
        warranty_plan_issued: =warranty_plan_issued
      Multi-System Calibration:
        post_scan_required: =post_scan_required
        post_calibration_road_test_miles: =post_calibration_road_test_miles
        calibration_report_delivery_hours: =calibration_report_delivery_hours
        report_retention_years: =report_retention_years
        certificate_issued: =certificate_issued
        warranty_plan_issued: =warranty_plan_issued
- id: adas_evt_charges
  subject:
  - adas_charge
  - adas_transfer_to_repair
  rule: 'Charges post on the completion date. An in-house calibration posts a calibration charge of calibration_price_usd.
    A sublet posts a dealer_sublet charge instead: on an insurance claim repair or a glass program order it is the
    dealer invoice plus dealer_sublet_handling_pct percent, rounded to the cent; on a customer-pay order where customer_pay_sublet_capped
    is true the charge is the dealer invoice plus handling, and the part above calibration_price_usd is written
    off as sublet_cap. Alignment charges follow adas_evt_precheck, and a customer-requested order cancelled because
    the diagnosis found no calibration need posts a diagnostic charge of standalone_diagnostic_fee_usd. A warranty
    rework order posts no charge at all. Every charge of an insurance claim repair order is transferred on the same
    day onto that repair order, naming the supplement that approved the calibration (0 when it was on the original
    estimate); the insurer pays it through the repair order, never here.'
  eligibility: []
  params:
    per_tier:
      Dynamic Camera Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
      Static Camera Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
      Dual-Mode Camera Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
      Blind Spot Radar Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
      Front Radar Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
      Multi-System Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
  formula:
    when: charge_type == 'dealer_sublet'
    amount_usd: round(dealer_invoice_usd * (1 + dealer_sublet_handling_pct / 100), 2)
- id: adas_evt_settlement
  subject:
  - adas_payment
  - adas_no_charge
  rule: A customer pays a customer-pay order's balance (adas_msr_balance) on completion by one of the accepted_payment_methods;
    a glass program pays its order under its own remittance reference. A fleet account's calibration charge is reduced
    by a fleet_discount write-off of fleet_discount_pct percent, rounded to the cent. Write-offs name the charge
    they reduce and never exceed it; billing_error corrects a wrong charge and goodwill is capped at goodwill_credit_authority_usd
    per order (adas_msr_goodwill_written_off), beyond which the request is declined.
  eligibility: []
  params:
    per_tier:
      Dynamic Camera Calibration:
        accepted_payment_methods: =accepted_payment_methods
        fleet_discount_pct: =fleet_discount_pct
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Static Camera Calibration:
        accepted_payment_methods: =accepted_payment_methods
        fleet_discount_pct: =fleet_discount_pct
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Dual-Mode Camera Calibration:
        accepted_payment_methods: =accepted_payment_methods
        fleet_discount_pct: =fleet_discount_pct
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Blind Spot Radar Calibration:
        accepted_payment_methods: =accepted_payment_methods
        fleet_discount_pct: =fleet_discount_pct
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Front Radar Calibration:
        accepted_payment_methods: =accepted_payment_methods
        fleet_discount_pct: =fleet_discount_pct
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Multi-System Calibration:
        accepted_payment_methods: =accepted_payment_methods
        fleet_discount_pct: =fleet_discount_pct
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
  measures:
  - adas_msr_balance
  - adas_msr_goodwill_written_off
- id: adas_evt_declination
  subject:
  - adas_decline
  rule: A customer may decline a calibration in writing only where declination_allowed is true; on Front Radar Calibration
    and Multi-System Calibration orders the network does not release a vehicle with an uncalibrated radar, and the
    only alternative to the in-house calibration is the dealer sublet. The customer's declination of the order is
    signed. A declination is recorded before an attempt starts, is never charged, and lets the source repair or
    glass job complete without the calibration; the declined systems are excluded from every workmanship warranty
    issued on the source work.
  eligibility:
  - id: declination_signed
    applies_to:
    - adas_decline
    kind: authorization
    condition: The customer's declination of the order is signed.
    evidence_fields:
    - adas_declinations.adas_order_id
    - adas_declinations.declination_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - adas_declinations.adas_order_id
      action_bindings:
        adas_declinations.adas_order_id: adas_order_id
  params:
    per_tier:
      Dynamic Camera Calibration:
        declination_allowed: =declination_allowed
      Static Camera Calibration:
        declination_allowed: =declination_allowed
      Dual-Mode Camera Calibration:
        declination_allowed: =declination_allowed
      Blind Spot Radar Calibration:
        declination_allowed: =declination_allowed
      Front Radar Calibration:
        declination_allowed: =declination_allowed
      Multi-System Calibration:
        declination_allowed: =declination_allowed
- id: adas_evt_cancellation
  subject:
  - adas_cancel
  rule: 'An order is cancelled, never declined, when its source no longer needs it: the source repair was withdrawn
    (source_withdrawn) or declared a total loss (source_total_loss), or a customer-requested diagnosis found that
    no calibration is needed (no_calibration_needed, which carries the diagnostic charge of standalone_diagnostic_fee_usd).
    Cancellation is possible only before any attempt starts. Charges already posted for alignment work stay due.'
  eligibility: []
  params:
    per_tier:
      Dynamic Camera Calibration:
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
      Static Camera Calibration:
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
      Dual-Mode Camera Calibration:
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
      Blind Spot Radar Calibration:
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
      Front Radar Calibration:
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
      Multi-System Calibration:
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
