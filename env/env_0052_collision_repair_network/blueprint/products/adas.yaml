- id: adas_evt_payer_approval
  subject:
  - adas_start
  rule: No attempt starts until the payer has agreed to the calibration. For an order paid through an insurance
    claim repair, the calibration is approved on that repair order, on the original estimate or by an approved supplement
    that includes calibration. Where claim_approval_required is true, a calibration not on the original estimate
    waits for that supplement's approval; the network never performs it first and bills later. A glass-program order
    rests on the glass claim job itself, and a customer-pay order on the customer's acceptance of calibration_price_usd.
    Calibrations are scheduled at least scheduling_lead_business_days business days ahead, mobile only where mobile_calibration_available
    is true, and the customer may wait where customer_wait_allowed is true.
  eligibility:
  - id: calibration_approved_on_repair
    applies_to:
    - adas_start
    kind: authorization
    condition: For an order paid through an insurance claim repair, the calibration is approved on that repair order,
      on the original estimate or by an approved supplement that includes calibration.
    evidence_fields:
    - adas_orders.included_in_original_estimate
    - adas_orders.claim_repair_id
    - claim_supplements.claim_repair_id
    - claim_supplements.includes_calibration
    - claim_supplements.decision
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - adas_orders.claim_repair_id
      - - claim_supplements.claim_repair_id
      action_bindings:
        adas_orders.claim_repair_id: claim_repair_id
        claim_supplements.claim_repair_id: claim_repair_id
  params:
    per_tier:
      Dynamic Camera Calibration:
        claim_approval_required: =claim_approval_required
        calibration_price_usd: =calibration_price_usd
        scheduling_lead_business_days: =scheduling_lead_business_days
        mobile_calibration_available: =mobile_calibration_available
        customer_wait_allowed: =customer_wait_allowed
      Static Camera Calibration:
        claim_approval_required: =claim_approval_required
        calibration_price_usd: =calibration_price_usd
        scheduling_lead_business_days: =scheduling_lead_business_days
        mobile_calibration_available: =mobile_calibration_available
        customer_wait_allowed: =customer_wait_allowed
      Dual-Mode Camera Calibration:
        claim_approval_required: =claim_approval_required
        calibration_price_usd: =calibration_price_usd
        scheduling_lead_business_days: =scheduling_lead_business_days
        mobile_calibration_available: =mobile_calibration_available
