- id: carrier_program_operations
  subject:
  - carrier_activate
  rule: An agreement takes effect on its effective date once both parties have signed. The agreement was countersigned
    on or before its effective date. From then on the center uploads estimates with estimate_photo_count photos
    within estimate_upload_hours hours of inspection, contacts the customer within first_contact_hours hours of
    an assignment, updates the insurer every insurer_update_interval_business_days business days, self-approves
    supplements up to supplement_self_approval_limit_usd, and attaches manufacturer position statements where oem_position_statement_required
    is true. Network appraisers review estimates for the insurer where desk_review_by_network is true; the network
    releases total-loss vehicles to salvage where total_loss_handling_by_network is true; rental is billed directly
    where rental_direct_bill_enabled is true; and glass claims are routed to the network's glass service where glass_program_included
    is true. The insurer pays repair invoices within invoice_payment_terms_days days, may audit audit_sample_pct
    percent of closed files, and holds a quarterly business review where quarterly_business_review is true.
  eligibility:
  - id: countersigned
    applies_to:
    - carrier_activate
    kind: authorization
    condition: The agreement was countersigned on or before its effective date.
    evidence_fields:
    - carrier_agreements.countersigned_date
    - carrier_agreements.effective_date
    - carrier_agreements.carrier_agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - carrier_agreements.carrier_agreement_id
      action_bindings:
        carrier_agreements.carrier_agreement_id: carrier_agreement_id
  params:
    per_tier:
      Network Referral Agreement:
        estimate_photo_count: =estimate_photo_count
        estimate_upload_hours: =estimate_upload_hours
        first_contact_hours: =first_contact_hours
        insurer_update_interval_business_days: =insurer_update_interval_business_days
        supplement_self_approval_limit_usd: =supplement_self_approval_limit_usd
        oem_position_statement_required: =oem_position_statement_required
