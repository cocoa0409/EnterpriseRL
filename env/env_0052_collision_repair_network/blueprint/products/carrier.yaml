# Product and event policy charter: Insurer Program Agreements (carrier).
category: carrier
display_name: Insurer Program Agreements
binding:
  holding_table: carrier_agreements
  event_tables:
  - carrier_events
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - proposed
  - active
  - under_review
  - suspended
  - terminated
  transitions:
  - from: proposed
    to: active
    by: agent
    means: The countersigned agreement reaches its effective date.
  - from: active
    to: under_review
    by: system
    means: Quarterly scorecards missed target often enough to open a cure period.
  - from: under_review
    to: active
    by: system
    means: The next scorecard within the cure period meets every target.
  - from: under_review
    to: suspended
    by: agent
    means: The cure period ended without a scorecard meeting every target; new assignments stop.
  - from: suspended
    to: active
    by: agent
    means: The agreement is reinstated after the waiting period on an agreed corrective plan.
  - from: proposed
    to: terminated
    by: agent
    means: A proposed agreement is withdrawn before it takes effect.
  - from: active
    to: terminated
    by: agent
    means: The notice period of a termination notice ends.
  - from: under_review
    to: terminated
    by: agent
    means: The notice period of a termination notice ends during a review.
  - from: suspended
    to: terminated
    by: agent
    means: The notice period of a termination notice ends during a suspension.
accounts:
- key: assignment_volume
  unit: assignments
  meaning: Claim assignments received from the insurer under the agreement in its current agreement year. Assignments
    post in; withdrawn assignments post out.
- key: sla_credit_payable
  unit: USD
  meaning: Service-level credits the network owes the insurer for missed scorecard targets. Credits assessed post
    in; credits settled post out.
parameter_schema:
  body_labor_rate_usd: Body labor rate on the insurer's repairs (USD per hour).
  refinish_labor_rate_usd: Refinish labor rate (USD per hour).
  frame_labor_rate_usd: Frame and structural steel labor rate (USD per hour).
  mechanical_labor_rate_usd: Mechanical and electrical labor rate (USD per hour).
  aluminum_structural_labor_rate_usd: Aluminum structural labor rate (USD per hour).
  paint_materials_rate_usd: Paint and materials per refinish labor hour (USD per hour).
  labor_rate_override_allowed: Whether a market-specific body labor rate may be set on the agreement in place of
    the tier rate (boolean).
  market_rate_review_months: Fewest calendar months between two changes of a market body labor rate on the agreement
    (integer; 0 = no override).
  cure_scorecards_required: Scorecards meeting every target needed within the cure period to close a review (integer;
    0 = not applicable).
  oem_parts_discount_pct: Discount passed to the insurer on original-equipment parts list prices (percent).
  alternate_parts_target_pct: Target share of aftermarket and recycled parts on eligible lines (percent; 0 = no
    target).
  supplement_self_approval_limit_usd: Largest supplement the center may self-approve under this agreement (USD;
    0.00 = none).
  teardown_preapproved_hours: Disassembly hours the center may perform before insurer approval (hours, 1 decimal).
  towing_rate_cap_usd: Most the insurer pays for one tow to the center (USD).
  storage_rate_cap_usd: Most the insurer pays per day of storage on its claims (USD per day).
  short_pay_writeoff_usd: Short pay per repair order the network writes off without dispute (USD; 0.00 = none).
  estimate_upload_hours: Hours after inspection within which the estimate and photos are uploaded to the insurer
    (integer; 0 = not applicable).
  estimate_photo_count: Photos uploaded with each estimate (integer; 0 = not applicable).
  first_contact_hours: Hours after an assignment within which the customer is contacted (integer; 0 = not applicable).
  assignment_acceptance_hours: Hours within which the network accepts or declines an assignment (integer).
  assignment_decline_allowed: Whether the network may decline an assignment in its service area (boolean).
  insurer_update_interval_business_days: Business days between repair status updates to the insurer (integer; 0
    = not applicable).
  desk_review_by_network: Whether network appraisers review estimates on the insurer's behalf (boolean).
  total_loss_handling_by_network: Whether the network handles total-loss vehicle release to salvage for the insurer
    (boolean).
  rental_direct_bill_enabled: Whether rental days on the insurer's claims are billed directly to it (boolean).
  glass_program_included: Whether the insurer's glass claims are routed to the network's glass service (boolean).
  target_cycle_time_days: Quarterly average key-to-key days the network must not exceed (days, 1 decimal; 0.0 =
    no target).
  csi_target_pct: Quarterly customer satisfaction score the network must reach (percent; 0 = no target).
  reinspection_pass_target_pct: Quarterly share of reinspected files passing the insurer audit the network must
    reach (percent; 0 = no target).
  supplement_frequency_max_pct: Quarterly share of repair orders with a supplement the network must not exceed (percent;
    0 = no target).
  audit_sample_pct: Share of closed files the insurer may audit each quarter (percent).
  sla_credit_per_kpi_miss_usd: Credit owed to the insurer for each scorecard target missed in a quarter (USD; 0.00
    = none).
  sla_credit_cap_per_quarter_usd: Most service-level credit owed for one quarter (USD).
  sla_credit_settlement_days: Calendar days after the scorecard within which a credit is settled (integer).
  review_trigger_consecutive_misses: Consecutive below-target quarterly scorecards that open a review (integer;
    0 = never).
  cure_period_days: Calendar days of the cure period that follows a review opening (integer; 0 = not applicable).
  reinstatement_wait_days: Calendar days a suspended agreement waits before it may be reinstated (integer; 0 = not
    applicable).
  termination_notice_days: Calendar days between a termination notice and the termination date (integer).
  annual_volume_commitment: Assignments per agreement year the insurer commits to (integer; 0 = none).
  volume_rerating_at_renewal: Whether an agreement whose assignments in the year fell short of the commitment is
    re-rated at renewal to the highest tier whose commitment was met (boolean).
  renewal_term_months: Calendar months of each agreement year (integer).
  auto_renewal: Whether the agreement renews automatically at the end of its term unless notice is given (boolean).
  invoice_payment_terms_days: Calendar days after a repair invoice within which the insurer pays (integer).
  quarterly_business_review: Whether a quarterly business review meeting is held with the insurer (boolean).
  deductible_collection_by_network: Whether the network collects the deductible from the customer on the insurer's
    behalf (boolean).
  oem_position_statement_required: Whether manufacturer position statements are attached when a repair method or
    calibration is questioned (boolean).
  scan_billing_allowed: Whether pre- and post-repair scans are billable lines on the insurer's repairs (boolean).
  max_agreements_per_insurer: Program agreements one insurer account may hold at once (integer).
  withdrawal_after_repair_open_allowed: Whether an assignment may still be withdrawn once a repair order has been
    opened for it (boolean).
