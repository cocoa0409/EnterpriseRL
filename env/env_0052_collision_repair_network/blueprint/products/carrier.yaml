- id: carrier_evt_assignments
  subject:
  - carrier_assignment
  - carrier_assignment_withdrawal
  rule: An assignment is accepted or declined within assignment_acceptance_hours hours; it may be declined only
    where assignment_decline_allowed is true, and a declined assignment is withdrawn with reason declined_by_network.
    The agreement is in active or under_review status. A suspended or terminated agreement receives no assignments;
    the insurer's claims are then handled as for an insurer without an agreement. Each insurer claim number is assigned
    once. An assignment is withdrawn when the customer chooses another shop, the vehicle is a total loss before
    any estimate, or it duplicates another assignment, naming the assignment withdrawn; where withdrawal_after_repair_open_allowed
    is false, an assignment whose repair order is already open is not withdrawn (the repair order is cancelled or
    totaled instead).
  eligibility:
  - id: agreement_live
    applies_to:
    - carrier_assignment
    kind: state
    condition: The agreement is in active or under_review status.
    evidence_fields:
    - carrier_agreements.status
    - carrier_agreements.carrier_agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - carrier_agreements.carrier_agreement_id
      action_bindings:
        carrier_agreements.carrier_agreement_id: carrier_agreement_id
    state_contract:
      field: carrier_agreements.status
      allowed:
      - active
      - under_review
  params:
    per_tier:
      Network Referral Agreement:
        assignment_acceptance_hours: =assignment_acceptance_hours
        assignment_decline_allowed: =assignment_decline_allowed
        withdrawal_after_repair_open_allowed: =withdrawal_after_repair_open_allowed
      Select Direct Repair Agreement:
        assignment_acceptance_hours: =assignment_acceptance_hours
        assignment_decline_allowed: =assignment_decline_allowed
        withdrawal_after_repair_open_allowed: =withdrawal_after_repair_open_allowed
      Preferred Direct Repair Agreement:
        assignment_acceptance_hours: =assignment_acceptance_hours
        assignment_decline_allowed: =assignment_decline_allowed
        withdrawal_after_repair_open_allowed: =withdrawal_after_repair_open_allowed
