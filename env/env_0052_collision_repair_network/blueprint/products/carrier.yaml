- id: carrier_evt_sla_credits
  subject:
  - carrier_sla_credit
  - carrier_sla_credit_settlement
  rule: For each target a quarterly scorecard misses, a credit of sla_credit_per_kpi_miss_usd is assessed, one per
    missed target, until the quarter's credits (carrier_msr_quarter_credits) reach sla_credit_cap_per_quarter_usd;
    the credit that would pass the cap is reduced to it and none follows. A tier whose credit is zero assesses none.
    A credit is settled once, by offset against the insurer's next repair invoices or by payment, within sla_credit_settlement_days
    days of the scorecard, naming the credit settled. Credits never reduce what a vehicle owner pays.
  eligibility:
  - id: credit_settled_once
    applies_to:
    - carrier_sla_credit_settlement
    kind: dedup
    condition: A credit is settled once
    evidence_fields:
    - carrier_events.source_event_id
    - carrier_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - carrier_events.source_event_id
      action_bindings:
        carrier_events.source_event_id: source_event_id
    dedup_contract:
      table: carrier_events
      mode: separate_record
      object_bindings:
        source_event_id: source_event_id
      duplicate_filters:
        event_type:
        - carrier_sla_credit_settlement
      distinct_fields: []
  params:
    per_tier:
      Network Referral Agreement:
        sla_credit_per_kpi_miss_usd: =sla_credit_per_kpi_miss_usd
        sla_credit_cap_per_quarter_usd: =sla_credit_cap_per_quarter_usd
        sla_credit_settlement_days: =sla_credit_settlement_days
      Select Direct Repair Agreement:
        sla_credit_per_kpi_miss_usd: =sla_credit_per_kpi_miss_usd
        sla_credit_cap_per_quarter_usd: =sla_credit_cap_per_quarter_usd
        sla_credit_settlement_days: =sla_credit_settlement_days
      Preferred Direct Repair Agreement:
        sla_credit_per_kpi_miss_usd: =sla_credit_per_kpi_miss_usd
        sla_credit_cap_per_quarter_usd: =sla_credit_cap_per_quarter_usd
        sla_credit_settlement_days: =sla_credit_settlement_days
      Premier Direct Repair Agreement:
        sla_credit_per_kpi_miss_usd: =sla_credit_per_kpi_miss_usd
        sla_credit_cap_per_quarter_usd: =sla_credit_cap_per_quarter_usd
        sla_credit_settlement_days: =sla_credit_settlement_days
      Managed Repair Program Agreement:
        sla_credit_per_kpi_miss_usd: =sla_credit_per_kpi_miss_usd
        sla_credit_cap_per_quarter_usd: =sla_credit_cap_per_quarter_usd
        sla_credit_settlement_days: =sla_credit_settlement_days
      Enterprise Master Services Agreement:
        sla_credit_per_kpi_miss_usd: =sla_credit_per_kpi_miss_usd
        sla_credit_cap_per_quarter_usd: =sla_credit_cap_per_quarter_usd
        sla_credit_settlement_days: =sla_credit_settlement_days
  formula:
    amount_usd: min(sla_credit_per_kpi_miss_usd, sla_credit_cap_per_quarter_usd - carrier_msr_quarter_credits)
  measures:
  - carrier_msr_quarter_credits
- id: carrier_evt_renewal
  subject:
  - carrier_renew
  rule: Each agreement year lasts renewal_term_months calendar months from the effective date or the last renewal
    date, and the agreement renews on its renewal date where auto_renewal is true unless a termination notice is
    pending. At renewal, where volume_rerating_at_renewal is true and the year's assignments (carrier_msr_year_volume)
    fell short of the tier's annual_volume_commitment, the agreement renews at the highest tier whose commitment
    the year's assignments met; otherwise it renews at its tier. A re-rated tier applies to repair orders opened
    from the renewal date on.
  eligibility: []
  params:
    per_tier:
      Network Referral Agreement:
        renewal_term_months: =renewal_term_months
        auto_renewal: =auto_renewal
        volume_rerating_at_renewal: =volume_rerating_at_renewal
        annual_volume_commitment: =annual_volume_commitment
      Select Direct Repair Agreement:
        renewal_term_months: =renewal_term_months
        auto_renewal: =auto_renewal
        volume_rerating_at_renewal: =volume_rerating_at_renewal
        annual_volume_commitment: =annual_volume_commitment
      Preferred Direct Repair Agreement:
        renewal_term_months: =renewal_term_months
        auto_renewal: =auto_renewal
        volume_rerating_at_renewal: =volume_rerating_at_renewal
        annual_volume_commitment: =annual_volume_commitment
      Premier Direct Repair Agreement:
        renewal_term_months: =renewal_term_months
        auto_renewal: =auto_renewal
        volume_rerating_at_renewal: =volume_rerating_at_renewal
        annual_volume_commitment: =annual_volume_commitment
      Managed Repair Program Agreement:
        renewal_term_months: =renewal_term_months
        auto_renewal: =auto_renewal
        volume_rerating_at_renewal: =volume_rerating_at_renewal
        annual_volume_commitment: =annual_volume_commitment
      Enterprise Master Services Agreement:
        renewal_term_months: =renewal_term_months
        auto_renewal: =auto_renewal
        volume_rerating_at_renewal: =volume_rerating_at_renewal
        annual_volume_commitment: =annual_volume_commitment
  measures:
  - carrier_msr_year_volume
- id: carrier_evt_termination
  subject:
  - carrier_terminate
  rule: Either party may terminate by notice; the termination date is termination_notice_days calendar days after
    the notice date. The notice period has run its full length. A proposed agreement may be withdrawn at any time
    before it takes effect (withdrawn_proposal). Repair orders opened before the termination date finish under the
    agreement's terms; repair orders opened later are handled as for an insurer without an agreement.
  eligibility:
  - id: notice_period_run
    applies_to:
    - carrier_terminate
    kind: time
    condition: The notice period has run its full length.
    evidence_fields:
    - carrier_agreements.termination_notice_date
    - carrier_agreements.carrier_agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - carrier_agreements.carrier_agreement_id
      action_bindings:
        carrier_agreements.carrier_agreement_id: carrier_agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: notice period
      anchor_source: carrier_agreements.termination_notice_date
      relation: not_before
      duration_source: variants.termination_notice_days
      unit: calendar_days
      counting_rule: the termination date is termination_notice_days calendar days after the notice date
      boundary: inclusive
  params:
    per_tier:
      Network Referral Agreement:
        termination_notice_days: =termination_notice_days
      Select Direct Repair Agreement:
        termination_notice_days: =termination_notice_days
      Preferred Direct Repair Agreement:
        termination_notice_days: =termination_notice_days
      Premier Direct Repair Agreement:
        termination_notice_days: =termination_notice_days
      Managed Repair Program Agreement:
        termination_notice_days: =termination_notice_days
      Enterprise Master Services Agreement:
        termination_notice_days: =termination_notice_days
