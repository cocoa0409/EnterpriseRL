- id: carrier_evt_performance
  subject:
  - carrier_scorecard
  - carrier_review
  - carrier_cure
  - carrier_suspend
  - carrier_reinstate
  rule: 'Each quarter''s scorecard compares the network with the tier''s targets: avg_cycle_time_days not above
    target_cycle_time_days, csi_score_pct at least csi_target_pct, reinspection_pass_pct at least reinspection_pass_target_pct
    and supplement_frequency_pct not above supplement_frequency_max_pct; a target of zero is not scored. A scorecard
    missing any target is below_target. When the consecutive below-target scorecards (carrier_msr_consecutive_misses)
    reach review_trigger_consecutive_misses, an active agreement goes under review for cure_period_days calendar
    days counted from the review start date as day zero.  cure_scorecards_required scorecards meeting every target
    within the cure period return it to active; at the end of the cure period without one, it is suspended. The
    waiting period has passed since the suspension. A suspended agreement may be reinstated on an agreed corrective
    plan once reinstatement_wait_days calendar days have passed since the suspended date, counted from the suspended
    date as day zero, with reinstatement on the last waiting day not allowed.'
  eligibility:
  - id: reinstatement_wait_passed
    applies_to:
    - carrier_reinstate
    kind: time
    condition: The waiting period has passed since the suspension.
    evidence_fields:
    - carrier_agreements.suspended_date
    - carrier_agreements.carrier_agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - carrier_agreements.carrier_agreement_id
      action_bindings:
        carrier_agreements.carrier_agreement_id: carrier_agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the suspension
      anchor_source: carrier_agreements.suspended_date
      relation: not_before
      duration_source: variants.reinstatement_wait_days
      unit: calendar_days
      counting_rule: counted from the suspended date as day zero, with reinstatement on the last waiting day not
        allowed
      boundary: exclusive
  params:
    per_tier:
      Network Referral Agreement:
        cure_scorecards_required: =cure_scorecards_required
        target_cycle_time_days: =target_cycle_time_days
        csi_target_pct: =csi_target_pct
        reinspection_pass_target_pct: =reinspection_pass_target_pct
        supplement_frequency_max_pct: =supplement_frequency_max_pct
        review_trigger_consecutive_misses: =review_trigger_consecutive_misses
        cure_period_days: =cure_period_days
        reinstatement_wait_days: =reinstatement_wait_days
      Select Direct Repair Agreement:
        cure_scorecards_required: =cure_scorecards_required
        target_cycle_time_days: =target_cycle_time_days
        csi_target_pct: =csi_target_pct
        reinspection_pass_target_pct: =reinspection_pass_target_pct
        supplement_frequency_max_pct: =supplement_frequency_max_pct
        review_trigger_consecutive_misses: =review_trigger_consecutive_misses
        cure_period_days: =cure_period_days
        reinstatement_wait_days: =reinstatement_wait_days
      Preferred Direct Repair Agreement:
