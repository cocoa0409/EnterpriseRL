- id: carrier_program_terms
  subject:
  - carrier_enroll
  - carrier_rate_update
  rule: The tier is the highest one whose annual_volume_commitment the insurer commits to. Repairs for the insurer's
    claims are priced at the tier's body_labor_rate_usd, refinish_labor_rate_usd, frame_labor_rate_usd, mechanical_labor_rate_usd,
    aluminum_structural_labor_rate_usd and paint_materials_rate_usd, with oem_parts_discount_pct off original-equipment
    list prices and alternate_parts_target_pct as a parts target. Where labor_rate_override_allowed is true, a market
    body labor rate set on the agreement replaces the tier's body labor rate for every repair of the insurer while
    it is set, and it is changed no more often than every market_rate_review_months calendar months; nothing else
    is overridden. The insurer pays at most towing_rate_cap_usd per tow and storage_rate_cap_usd per storage day,
    and the center may perform teardown_preapproved_hours of disassembly before approval. Short pays up to short_pay_writeoff_usd
