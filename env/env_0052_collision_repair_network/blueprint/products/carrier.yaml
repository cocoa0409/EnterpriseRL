events:
- type: carrier_enroll
  target: carrier_agreements
  mutation: create
  meaning: A program agreement with an insurer is proposed.
  grain: One row per agreement.
  fields:
    carrier_agreement_id: Agreement reference.
    customer_id: Insurer account.
    variant_name: Agreement tier.
    proposed_date: Date proposed.
    annual_volume_committed: Assignments per year the insurer commits.
  triggers: []
- type: carrier_activate
  target: carrier_agreements
  mutation:
    transition:
      from: proposed
      to: active
  meaning: The agreement takes effect.
  grain: One transition per agreement.
  fields:
    status: Becomes active.
    countersigned_date: Date both parties had signed.
    effective_date: First day in effect.
    renewal_date: First renewal date.
  triggers: []
- type: carrier_rate_update
  target: carrier_agreements
  mutation: update
  meaning: A market-specific body labor rate is set or cleared on the agreement.
  grain: One update per rate change.
  fields:
    body_labor_rate_override_usd: Market body labor rate; 0.00 clears the override.
  triggers: []
- type: carrier_renew
  target: carrier_agreements
  mutation: update
  meaning: The agreement renews for a further term, possibly at a different tier after volume re-rating.
  grain: One update per renewal.
  fields:
    variant_name: Tier for the new term.
    renewal_date: Next renewal date.
  triggers: []
- type: carrier_review
  target: carrier_agreements
  mutation:
    transition:
      from: active
      to: under_review
  meaning: A performance review and cure period opens.
  grain: One transition per review.
  fields:
    status: Becomes under_review.
    review_start_date: First day of the cure period.
  triggers: []
- type: carrier_cure
  target: carrier_agreements
  mutation:
    transition:
      from: under_review
      to: active
  meaning: The review closes because performance recovered.
  grain: One transition per review.
  fields:
    status: Becomes active.
  triggers: []
- type: carrier_suspend
  target: carrier_agreements
  mutation:
    transition:
      from: under_review
      to: suspended
  meaning: New assignments are suspended after a failed cure period.
  grain: One transition per suspension.
  fields:
    status: Becomes suspended.
    suspended_date: Suspension date.
  triggers: []
- type: carrier_reinstate
  target: carrier_agreements
  mutation:
    transition:
      from: suspended
      to: active
  meaning: A suspended agreement is reinstated.
  grain: One transition per suspension.
  fields:
    status: Becomes active.
  triggers: []
- type: carrier_terminate
  target: carrier_agreements
  mutation:
    transition:
    - from: proposed
      to: terminated
    - from: active
      to: terminated
    - from: under_review
      to: terminated
    - from: suspended
      to: terminated
  meaning: The agreement ends.
  grain: One transition per agreement.
  fields:
    status: Becomes terminated.
    termination_notice_date: Date notice was given.
    termination_date: Last day in effect.
    termination_reason: insurer_notice, network_notice, performance or withdrawn_proposal.
  triggers: []
- type: carrier_assignment
  target: carrier_events
  meaning: The insurer assigns a claim to the network under the agreement.
  grain: One row per insurer claim assigned.
  distinguish_by:
  - insurer_claim_number
  fields:
    event_date: Assignment date.
    insurer_claim_number: Insurer claim number, verbatim.
    assignment_channel: api, portal or phone.
    assignment_response: accepted or declined.
  account: assignment_volume
  direction: in
  triggers: []
- type: carrier_assignment_withdrawal
  target: carrier_events
  meaning: An assignment is withdrawn and no longer counts toward volume.
  grain: One row per withdrawn assignment.
  distinguish_by:
  - source_event_id
  fields:
    event_date: Withdrawal date.
    source_event_id: The carrier_assignment row withdrawn.
    withdrawal_reason: customer_chose_other_shop, total_loss_before_estimate, duplicate_assignment or declined_by_network.
  account: assignment_volume
  direction: out
  triggers: []
- type: carrier_scorecard
  target: carrier_events
  meaning: A quarterly performance scorecard is published for the agreement.
  grain: One row per quarter per agreement.
  distinguish_by:
  - scorecard_period
  fields:
    event_date: Publication date.
    scorecard_period: Quarter scored.
    avg_cycle_time_days: Average key-to-key days.
    csi_score_pct: Customer satisfaction score.
    reinspection_pass_pct: Audit pass share.
    supplement_frequency_pct: Share of repair orders with a supplement.
    kpis_missed: Targets missed.
    scorecard_result: meets or below_target.
  triggers: []
- type: carrier_sla_credit
  target: carrier_events
  meaning: A service-level credit for a missed target is assessed.
  grain: One row per missed target per quarter.
  distinguish_by:
  - scorecard_period
  - kpi_code
  fields:
    event_date: Assessment date.
    scorecard_period: Quarter.
    kpi_code: cycle_time, csi, reinspection_pass or supplement_frequency.
    amount_usd: Credit (positive).
  account: sla_credit_payable
  direction: in
  triggers: []
- type: carrier_sla_credit_settlement
  target: carrier_events
  meaning: An assessed credit is settled with the insurer.
  grain: One row per credit settled.
  distinguish_by:
  - source_event_id
  fields:
    event_date: Settlement date.
    source_event_id: The carrier_sla_credit row settled.
    settlement_method: invoice_offset or payment.
    amount_usd: Amount settled (positive).
  account: sla_credit_payable
  direction: out
  triggers: []
measures:
- id: carrier_msr_year_volume
  window: 'Current agreement year: from the last renewal date (or the effective date) to the day before the next
    renewal date.'
  measure: Count of accepted carrier_assignment rows in the window minus carrier_assignment_withdrawal rows naming
    them.
- id: carrier_msr_consecutive_misses
  window: Most recent quarterly scorecards, counted back from the latest.
  measure: Number of consecutive carrier_scorecard rows with scorecard_result below_target, ending at the latest
    scorecard.
- id: carrier_msr_quarter_credits
  window: One scorecard_period.
  measure: Sum of amount_usd of carrier_sla_credit rows of the period.
