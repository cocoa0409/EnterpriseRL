- id: claim_evt_total_loss
  subject:
  - claim_total_loss
  - claim_insurer_approval
  - claim_insurer_adjustment
  - claim_customer_credit
  rule: A total loss is the insurer's determination, recorded as received; the desk never declares or disputes one.
    On the total-loss date every deductible and betterment charge is credited to the customer with credit_reason
    total_loss_release (the insurer applies the deductible in its own settlement), and one total_loss_reversal adjustment,
    naming the original_estimate approval, brings the insurer balance on the repair approvals to zero (none posts
    when no approval was booked). The insurer is then billed a total_loss_charges approval for total_loss_teardown_hours
    of disassembly at withdrawal_labor_rate_usd where a teardown was done, plus storage at total_loss_storage_daily_rate_usd
    (lowered to the storage_rate_cap_usd of the insurer's active carrier agreement when that cap is lower) for every
    calendar day the vehicle stays after total_loss_removal_free_days counted from the total-loss date as day zero.
    Customer-pay additions already performed stay due from the customer. The customer may collect personal belongings,
    but release of the vehicle itself is arranged with the insurer.
  eligibility: []
  params:
