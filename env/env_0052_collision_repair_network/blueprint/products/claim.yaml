# Product and event policy charter: Insurance Claim Repairs (claim).
category: claim
display_name: Insurance Claim Repairs
binding:
  holding_table: claim_repairs
  event_tables:
  - claim_supplements
  - claim_ledger
  intake_tables:
  - claim_consents
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - assigned
  - authorized
  - in_repair
  - on_hold
  - repair_complete
  - delivered
  - closed
  - cancelled
  - total_loss
  transitions:
  - from: assigned
    to: authorized
    by: agent
    means: The insurer's authorization of the repair estimate is recorded on the repair order.
  - from: authorized
    to: in_repair
    by: system
    means: The vehicle is dropped off and production work starts.
  - from: in_repair
    to: on_hold
    by: system
    means: Work stops while a supplement awaits the insurer's decision or a part is back-ordered.
  - from: on_hold
    to: in_repair
    by: system
    means: The hold is cleared and work resumes.
  - from: in_repair
    to: repair_complete
    by: system
    means: Final quality inspection is passed and the vehicle-ready notice is issued.
  - from: repair_complete
    to: delivered
    by: agent
    means: The vehicle is released to the customer.
  - from: delivered
    to: closed
    by: system
    means: Both the customer and the insurer balances on the repair order are settled.
  - from: assigned
    to: cancelled
    by: user
    means: The customer withdraws the vehicle before work starts.
  - from: authorized
    to: cancelled
    by: user
    means: The customer withdraws the vehicle after authorization but before work starts.
  - from: assigned
    to: total_loss
    by: agent
    means: The insurer's total-loss determination is recorded before authorization.
  - from: authorized
    to: total_loss
    by: agent
    means: The insurer's total-loss determination is recorded after authorization.
  - from: in_repair
    to: total_loss
    by: agent
    means: The insurer's total-loss determination is recorded during repair.
  - from: on_hold
    to: total_loss
    by: agent
    means: The insurer's total-loss determination is recorded while the repair is on hold.
  - from: total_loss
    to: closed
    by: system
    means: The vehicle has left for the insurer's salvage yard and the insurer has paid the total-loss charges.
accounts:
- key: customer_responsibility
  unit: USD
  meaning: 'What the vehicle owner owes on the repair order: deductible, betterment, customer-pay additions and
    storage. Charges and refunds of overpayments post in; payments and credits post out.'
- key: insurer_balance
  unit: USD
  meaning: 'What the insurer owes on the repair order: authorized repair amounts and approved supplements post in;
    the customer''s share (deductible, betterment), insurer payments and adjustments post out.'
parameter_schema:
  labor_hours_ceiling: Highest estimated labor hours the class takes for a non-structural repair (hours, 1 decimal;
    0.0 = no ceiling).
  structural_operations_allowed: Whether the class may perform sectioning, frame or unibody pulls and welded structural
    panel replacement (boolean).
  oem_certified_procedures_required: Whether the repair must follow manufacturer-certified procedures by a certified
    technician (boolean).
  aluminum_dedicated_bay_required: Whether work must be done in an isolated aluminum repair bay with dedicated tools
    (boolean).
  target_cycle_business_days: Target key-to-key cycle time from drop-off to vehicle-ready (business days, Monday-Friday
    excluding network holidays).
  labor_hours_per_production_day: Labor hours the center completes on one vehicle per business day, used to plan
    repair days (hours, 1 decimal).
  intake_delivery_days: Business days added to production days for drop-off, final inspection and delivery when
    planning repair days (integer).
  authorization_route: 'How a direct-repair insurer authorizes the original estimate for this class: dr_estimate_upload
    (the uploaded estimate is the authorization), desk_review (insurer desk appraiser reviews photos), field_appraisal
    (insurer appraiser inspects the vehicle).'
  authorization_response_business_days: Business days the insurer is asked to answer an authorization request in
    (integer).
  supplement_self_approval_allowed: Whether supplements on this class may be self-approved by the center under a
    direct-repair authority (boolean).
  supplement_variance_reinspection_pct: Cumulative supplements as a percentage of the original estimate above which
    a supplement is routed to field reinspection (percent).
  max_supplements_before_reinspection: Supplement ordinal above which a supplement is routed to field reinspection
    (integer).
  supplement_response_business_days: Business days the insurer is asked to decide a reviewed supplement in (integer).
  supplement_photos_required: Photos attached to each supplement request (integer).
  pre_repair_scan_required: Whether a pre-repair diagnostic scan is required before work starts (boolean).
  post_repair_scan_required: Whether a post-repair diagnostic scan is required before vehicle-ready (boolean).
  four_wheel_alignment_required: Whether a four-wheel alignment check is required before vehicle-ready (boolean).
  structural_measurement_reports: Number of electronic structural measurement reports (pre-pull, post-pull, final)
    required (integer).
  road_test_miles: Minimum road test before vehicle-ready (miles).
  quality_checkpoints: Points on the final quality inspection checklist (integer).
  calibration_check_required: Whether the repair is checked against the manufacturer's calibration requirements
    and every resulting calibration order must be closed before vehicle-ready (boolean).
  hv_depower_required: Whether a hybrid or electric vehicle's high-voltage system is depowered before work in this
    class (boolean).
  customer_update_interval_business_days: Maximum business days between repair status updates to the customer (integer).
  parts_delay_hold_business_days: Back-order length beyond which the repair order goes on hold for parts delay (business
    days).
  delay_notice_business_days: Business days within which the customer and insurer are notified after a hold begins
    (integer).
  oem_parts_required: Whether replacement parts must be original-equipment parts (boolean).
  non_oem_parts_disclosure_required: Whether the customer must sign the non-original-equipment parts disclosure
    before work starts when the insurer's estimate specifies such parts (boolean).
  recycled_parts_allowed: Whether recycled (used OEM) parts may be installed (boolean).
  customer_pay_upgrade_allowed: Whether the customer may pay the difference to upgrade an insurer-specified part
    to an original-equipment part (boolean).
  unrelated_damage_max_labor_hours: Most labor hours of customer-pay work on damage unrelated to the claim that
    may be added to the repair order (hours, 1 decimal).
  pickup_free_days: Calendar days after the vehicle-ready date during which the vehicle may be collected without
    storage (integer).
  storage_daily_rate_usd: Storage per calendar day for a completed or withdrawn vehicle not collected in time (USD
    per day).
  total_loss_removal_free_days: Calendar days after the total-loss date the insurer has to remove the vehicle before
    storage is billed to it (integer).
  total_loss_storage_daily_rate_usd: Storage per calendar day billed to the insurer on a total-loss vehicle not
    removed in time (USD per day).
  total_loss_teardown_hours: Disassembly hours billed to the insurer when a vehicle is declared a total loss after
    teardown (hours, 1 decimal).
  withdrawal_teardown_hours: Disassembly hours charged to the customer when a vehicle with completed teardown is
    withdrawn before work starts (hours, 1 decimal).
  withdrawal_labor_rate_usd: Labor rate for withdrawal teardown and reassembly charges (USD per hour).
  reassembly_required_on_withdrawal: Whether a disassembled vehicle is reassembled before release on withdrawal,
    at the same hours as teardown (boolean).
  deductible_collection_point: 'When the deductible must be paid: at_delivery (before release) for every class.'
  financing_available: Whether the customer balance may be paid through the network's third-party financing partner
    (boolean).
  financing_min_balance_usd: Smallest customer balance that may be financed (USD; 0.00 = not applicable).
  refund_processing_business_days: Business days to return an overpayment to the original payment method (integer).
  accepted_payment_methods: Payment methods accepted for the customer balance (list).
  courtesy_shuttle_radius_miles: Distance from the center within which a courtesy ride is offered at drop-off and
    pick-up (miles).
  drop_off_photo_count: Walk-around photos taken at drop-off and kept with the repair order (integer).
  warranty_plan_issued: Official name of the workmanship warranty issued on delivery for this class.
  status_update_channel: 'Channel of the routine status updates: sms or phone.'
  max_open_repairs_per_claim: Repair orders one insurer claim number may have open on one vehicle at once (integer).
  goodwill_credit_authority_usd: Most the desk may credit as goodwill against customer-pay storage on one repair
    order (USD).
