      Drive-In Estimate:
        storage_applies: =storage_applies
        storage_lien_notice_days: =storage_lien_notice_days
      Scheduled Estimate:
        storage_applies: =storage_applies
        storage_lien_notice_days: =storage_lien_notice_days
      Mobile Estimate:
        storage_applies: =storage_applies
        storage_lien_notice_days: =storage_lien_notice_days
      Blueprint Teardown Estimate:
        storage_applies: =storage_applies
        storage_lien_notice_days: =storage_lien_notice_days
      Structural Blueprint Estimate:
        storage_applies: =storage_applies
        storage_lien_notice_days: =storage_lien_notice_days
  measures:
