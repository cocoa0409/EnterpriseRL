      action_bindings:
        estimate_bookings.booking_id: booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the estimate written date
      anchor_source: estimate_bookings.estimate_written_date
      relation: not_after
      duration_source: variants.estimate_validity_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the estimate written date as day zero; conversion on the
        last valid day is allowed.
      boundary: inclusive
  - id: claim_number_present
    applies_to:
    - estimate_convert
    kind: authorization
    condition: For an insurance-claim booking, the insurer claim number is recorded on the booking.
    evidence_fields:
    - estimate_bookings.insurer_claim_number
    - estimate_bookings.payer_type
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
  params:
