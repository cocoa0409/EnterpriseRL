- id: estimate_evt_expiry
  subject:
  - estimate_expire
  rule: A written estimate that is neither converted nor declined expires. The estimate validity days have fully
    elapsed since the estimate written date. Days are calendar days counted from the estimate written date as day
    zero, and expiry is recorded on the first day after the last valid day. An expired estimate cannot be revised
    or converted; the customer books again. Charges already posted stay due.
  eligibility:
  - id: validity_elapsed
    applies_to:
    - estimate_expire
    kind: time
    condition: The estimate validity days have fully elapsed since the estimate written date.
    evidence_fields:
    - estimate_bookings.estimate_written_date
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the estimate written date
      anchor_source: estimate_bookings.estimate_written_date
      relation: not_before
      duration_source: variants.estimate_validity_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the estimate written date as day zero, and expiry is recorded
        on the first day after the last valid day.
      boundary: exclusive
  params:
    per_tier:
      Photo Estimate:
        estimate_validity_days: =estimate_validity_days
      Drive-In Estimate:
        estimate_validity_days: =estimate_validity_days
      Scheduled Estimate:
        estimate_validity_days: =estimate_validity_days
      Mobile Estimate:
        estimate_validity_days: =estimate_validity_days
      Blueprint Teardown Estimate:
        estimate_validity_days: =estimate_validity_days
      Structural Blueprint Estimate:
        estimate_validity_days: =estimate_validity_days
- id: estimate_evt_service_fees
  subject:
  - estimate_fee_charge
  rule: Estimate-stage charges post to the booking as follows, each once per booking. A teardown charge of teardown_fee_usd
    posts on the estimate written date where teardown_included is true; a pre_repair_scan charge of pre_repair_scan_fee_usd
    posts on the estimate written date where pre_repair_scan_included is true; a measurement charge of measurement_fee_usd
    posts on the estimate written date where measurement_report_included is true; a tow_in charge posts on the check-in
    date where tow_in_available is true and the vehicle arrived on a network-arranged tow, equal to tow_hookup_fee_usd
    plus tow_rate_per_mile_usd for every tow mile beyond tow_free_radius_miles; and a mobile_trip charge of mobile_trip_fee_usd
    posts on a customer-pay Mobile Estimate that was cancelled late or missed (estimate_evt_cancellation_no_show).
    The booking is in checked_in, estimate_written, cancelled, no_show, declined or expired status. A tier whose
    fee is zero posts nothing for that fee type. Charges post the same way on insurance-claim and customer-pay bookings;
    who settles them is set by estimate_evt_fee_settlement.
  eligibility:
  - id: charge_status_allowed
    applies_to:
    - estimate_fee_charge
    kind: state
    condition: The booking is in checked_in, estimate_written, cancelled, no_show, declined or expired status.
    evidence_fields:
    - estimate_bookings.status
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    state_contract:
      field: estimate_bookings.status
      allowed:
      - checked_in
      - estimate_written
      - cancelled
      - no_show
      - declined
      - expired
  params:
    per_tier:
      Photo Estimate:
        teardown_fee_usd: =teardown_fee_usd
        pre_repair_scan_fee_usd: =pre_repair_scan_fee_usd
        measurement_fee_usd: =measurement_fee_usd
        mobile_trip_fee_usd: =mobile_trip_fee_usd
        tow_in_available: =tow_in_available
        tow_hookup_fee_usd: =tow_hookup_fee_usd
        tow_rate_per_mile_usd: =tow_rate_per_mile_usd
        tow_free_radius_miles: =tow_free_radius_miles
      Drive-In Estimate:
        teardown_fee_usd: =teardown_fee_usd
        pre_repair_scan_fee_usd: =pre_repair_scan_fee_usd
        measurement_fee_usd: =measurement_fee_usd
        mobile_trip_fee_usd: =mobile_trip_fee_usd
        tow_in_available: =tow_in_available
        tow_hookup_fee_usd: =tow_hookup_fee_usd
        tow_rate_per_mile_usd: =tow_rate_per_mile_usd
        tow_free_radius_miles: =tow_free_radius_miles
      Scheduled Estimate:
        teardown_fee_usd: =teardown_fee_usd
        pre_repair_scan_fee_usd: =pre_repair_scan_fee_usd
        measurement_fee_usd: =measurement_fee_usd
        mobile_trip_fee_usd: =mobile_trip_fee_usd
        tow_in_available: =tow_in_available
        tow_hookup_fee_usd: =tow_hookup_fee_usd
        tow_rate_per_mile_usd: =tow_rate_per_mile_usd
        tow_free_radius_miles: =tow_free_radius_miles
      Mobile Estimate:
        teardown_fee_usd: =teardown_fee_usd
        pre_repair_scan_fee_usd: =pre_repair_scan_fee_usd
        measurement_fee_usd: =measurement_fee_usd
        mobile_trip_fee_usd: =mobile_trip_fee_usd
        tow_in_available: =tow_in_available
        tow_hookup_fee_usd: =tow_hookup_fee_usd
        tow_rate_per_mile_usd: =tow_rate_per_mile_usd
        tow_free_radius_miles: =tow_free_radius_miles
      Blueprint Teardown Estimate:
        teardown_fee_usd: =teardown_fee_usd
        pre_repair_scan_fee_usd: =pre_repair_scan_fee_usd
        measurement_fee_usd: =measurement_fee_usd
        mobile_trip_fee_usd: =mobile_trip_fee_usd
        tow_in_available: =tow_in_available
        tow_hookup_fee_usd: =tow_hookup_fee_usd
        tow_rate_per_mile_usd: =tow_rate_per_mile_usd
        tow_free_radius_miles: =tow_free_radius_miles
      Structural Blueprint Estimate:
        teardown_fee_usd: =teardown_fee_usd
        pre_repair_scan_fee_usd: =pre_repair_scan_fee_usd
        measurement_fee_usd: =measurement_fee_usd
        mobile_trip_fee_usd: =mobile_trip_fee_usd
        tow_in_available: =tow_in_available
        tow_hookup_fee_usd: =tow_hookup_fee_usd
        tow_rate_per_mile_usd: =tow_rate_per_mile_usd
        tow_free_radius_miles: =tow_free_radius_miles
  formula:
    when: fee_type == 'tow_in'
    amount_usd: tow_hookup_fee_usd + tow_rate_per_mile_usd * max(0, tow_miles - tow_free_radius_miles)
- id: estimate_evt_storage
  subject:
  - estimate_fee_charge
  rule: Storage accrues only on tiers whose storage_applies is true, only while the vehicle stays at the center
    after the estimate, and never on a booking that converts (the vehicle then belongs to the repair order). The
    storage_free_days run from the estimate written date as day zero; the first billed day is the day after the
    last free day and the last billed day is the vehicle_released_date. Storage is billed in one storage charge
    on the release date, covering period_start_date to period_end_date inclusive at storage_daily_rate_usd per calendar
    day. Billed storage is never credited on a later conversion because a converted booking never accrues it.
  eligibility: []
  params:
    per_tier:
      Photo Estimate:
        storage_applies: =storage_applies
        storage_free_days: =storage_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Drive-In Estimate:
        storage_applies: =storage_applies
        storage_free_days: =storage_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Scheduled Estimate:
        storage_applies: =storage_applies
        storage_free_days: =storage_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Mobile Estimate:
        storage_applies: =storage_applies
        storage_free_days: =storage_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Blueprint Teardown Estimate:
        storage_applies: =storage_applies
        storage_free_days: =storage_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Structural Blueprint Estimate:
        storage_applies: =storage_applies
        storage_free_days: =storage_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
  formula:
    when: fee_type == 'storage'
    billable_days: period_end_date - period_start_date + 1
    amount_usd: billable_days * storage_daily_rate_usd
- id: estimate_evt_fee_settlement
  subject:
  - estimate_fee_payment
  - estimate_fee_waiver
  rule: 'Every payment or waiver names exactly one charge through charge_event_id and never exceeds that charge''s
    estimate_msr_charge_outstanding. A charge that has already been paid or waived in full takes no further payment
    or waiver. Payment methods are card, ach, cash and check; insurer_direct is accepted only on an insurance-claim
    booking of a tier whose insurer_direct_billing_allowed is true. Waivers have three reasons and do not stack
    beyond the outstanding amount. converted_to_repair: when the booking converts no later than conversion_credit_window_days
    after the estimate written date, every teardown, pre_repair_scan, measurement and tow_in charge whose credit
    flag (teardown_fee_credited_on_conversion, scan_fee_credited_on_conversion, measurement_fee_credited_on_conversion,
    tow_fee_credited_on_conversion) is true is waived for its outstanding amount on the conversion date; mobile_trip
    and storage charges are never credited. billing_error: a charge posted at a wrong amount or on the wrong fee
    type is waived down to the correct amount. goodwill: the desk may waive at most goodwill_waiver_authority_usd
    per booking across all charges (estimate_msr_goodwill_waived); a request beyond that authority is declined at
    the desk.'
  eligibility:
  - id: charge_not_settled
    applies_to:
    - estimate_fee_payment
    - estimate_fee_waiver
    kind: dedup
    condition: A charge that has already been paid or waived in full takes no further payment or waiver.
    evidence_fields:
    - estimate_events.charge_event_id
    - estimate_events.event_type
    - estimate_events.amount_usd
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_events.charge_event_id
      action_bindings:
        estimate_events.charge_event_id: charge_event_id
    dedup_contract:
      table: estimate_events
      mode: separate_record
      object_bindings:
        charge_event_id: charge_event_id
      duplicate_filters:
        event_type:
        - estimate_fee_payment
        - estimate_fee_waiver
      distinct_fields:
      - event_date
      - amount_usd
  params:
    per_tier:
      Photo Estimate:
        insurer_direct_billing_allowed: =insurer_direct_billing_allowed
        conversion_credit_window_days: =conversion_credit_window_days
        teardown_fee_credited_on_conversion: =teardown_fee_credited_on_conversion
        scan_fee_credited_on_conversion: =scan_fee_credited_on_conversion
        measurement_fee_credited_on_conversion: =measurement_fee_credited_on_conversion
        tow_fee_credited_on_conversion: =tow_fee_credited_on_conversion
        goodwill_waiver_authority_usd: =goodwill_waiver_authority_usd
