events:
- type: estimate_book
  target: estimate_bookings
  mutation: create
  meaning: A customer, or an insurer on the customer's behalf, books an estimate for one vehicle.
  grain: One row per booking.
  fields:
    booking_id: Booking reference.
    customer_id: Vehicle owner the booking is for.
    vehicle_id: Vehicle to be estimated.
    variant_name: Estimate type booked.
    payer_type: insurance_claim or customer_pay.
    insurer_customer_id: Insurer account profile for an insurance-claim booking; empty for customer pay.
    insurer_claim_number: Claim number issued by the insurer, copied verbatim; empty for customer pay.
    booked_date: Date the booking request was made.
    appointment_date: Appointment date.
    appointment_slot: Appointment start time.
    location_code: Assigned repair center.
    service_distance_miles: Road distance from the assigned center to the vehicle.
    structural_damage: Structural damage reported or suspected at booking.
    drivable: Whether the vehicle can be driven.
    airbag_deployed: Whether any airbag deployed.
    high_voltage_damage: Whether damage is near the high-voltage system.
  triggers: []
- type: estimate_reschedule
  target: estimate_events
  meaning: The appointment of a booked estimate is moved to another date or slot.
  grain: One row per reschedule of one booking.
  distinguish_by:
  - reschedule_number
  fields:
    event_date: Date the reschedule was requested.
    reschedule_number: Ordinal of this reschedule on the booking (1 for the first).
    prior_appointment_date: Appointment date before the change.
    new_appointment_date: New appointment date.
    new_appointment_slot: New appointment start time.
  triggers:
  - event: estimate:estimate_appointment_update
    map:
      appointment_date: new_appointment_date
      appointment_slot: new_appointment_slot
- type: estimate_appointment_update
  target: estimate_bookings
  mutation: update
  meaning: The booking's current appointment date and slot are replaced after a reschedule.
  grain: One update per reschedule.
  fields:
    appointment_date: New appointment date.
    appointment_slot: New appointment start time.
  triggers: []
- type: estimate_check_in
  target: estimate_bookings
  mutation:
    transition:
      from: booked
      to: checked_in
  meaning: The vehicle arrives (or the mobile estimator reaches it) and the visit is checked in.
  grain: One transition per booking.
  fields:
    status: Becomes checked_in.
    checked_in_date: Date of check-in.
  triggers: []
- type: estimate_cancel
  target: estimate_bookings
  mutation:
    transition:
      from: booked
      to: cancelled
  meaning: The customer cancels the appointment before it takes place.
  grain: One transition per booking.
  fields:
    status: Becomes cancelled.
    closed_date: Date of cancellation.
  triggers: []
- type: estimate_no_show
  target: estimate_bookings
  mutation:
    transition:
      from: booked
      to: no_show
  meaning: The appointment passed without the vehicle (or the photo set) arriving.
  grain: One transition per booking.
  fields:
    status: Becomes no_show.
    closed_date: Date the no-show was recorded.
  triggers: []
- type: estimate_write
  target: estimate_bookings
  mutation:
    transition:
    - from: booked
      to: estimate_written
    - from: checked_in
      to: estimate_written
  meaning: The written damage estimate is completed and delivered to the customer (and insurer).
  grain: One transition per booking.
  fields:
    status: Becomes estimate_written.
    estimate_written_date: Date the estimate was written.
    estimate_total_usd: Estimate total including parts, labor, materials and sublet, before deductible.
    estimated_labor_hours: Total labor hours on the estimate.
    structural_damage: Whether the estimate includes structural operations.
  triggers: []
- type: estimate_revise
  target: estimate_events
  meaning: A written estimate is revised after a re-inspection requested by the customer or insurer.
  grain: One row per revision of one booking.
  distinguish_by:
  - revision_number
  fields:
    event_date: Date of the re-inspection.
    revision_number: Ordinal of the revision on the booking (1 for the first).
    revised_total_usd: Estimate total after the revision.
    revised_labor_hours: Labor hours after the revision.
  triggers:
  - event: estimate:estimate_figures_update
    map:
      estimate_total_usd: revised_total_usd
      estimated_labor_hours: revised_labor_hours
- type: estimate_figures_update
  target: estimate_bookings
  mutation: update
  meaning: The booking's current estimate total and labor hours are replaced by the latest revision.
  grain: One update per revision.
  fields:
    estimate_total_usd: Revised estimate total.
    estimated_labor_hours: Revised labor hours.
  triggers: []
- type: estimate_convert
  target: estimate_bookings
  mutation:
    transition:
      from: estimate_written
      to: converted
  meaning: A repair order is opened from the written estimate.
  grain: One transition per booking.
  fields:
    status: Becomes converted.
    converted_date: Date the repair order was opened.
    payer_type: Determines which kind of repair order is opened.
  triggers:
  - event: claim:claim_open
    when:
      payer_type: insurance_claim
    map:
      booking_id: booking_id
      customer_id: customer_id
      vehicle_id: vehicle_id
      insurer_customer_id: insurer_customer_id
      insurer_claim_number: insurer_claim_number
      opened_date: converted_date
  - event: retail:retail_open
    when:
      payer_type: customer_pay
    map:
      booking_id: booking_id
      customer_id: customer_id
      vehicle_id: vehicle_id
      opened_date: converted_date
- type: estimate_decline
  target: estimate_bookings
  mutation:
    transition:
      from: estimate_written
      to: declined
  meaning: The customer confirms they will not repair the vehicle with the network on this estimate.
  grain: One transition per booking.
  fields:
    status: Becomes declined.
    closed_date: Date the decline was confirmed.
  triggers: []
- type: estimate_expire
  target: estimate_bookings
  mutation:
    transition:
      from: estimate_written
      to: expired
  meaning: The estimate validity lapsed without conversion or decline.
  grain: One transition per booking.
  fields:
    status: Becomes expired.
    closed_date: Date of expiry.
  triggers: []
- type: estimate_vehicle_release
  target: estimate_bookings
  mutation: update
  meaning: A vehicle left at the center for a teardown estimate is released to the customer or their agent without
    being repaired.
  grain: One update per booking.
  fields:
    vehicle_released_date: Date the vehicle left the center.
  triggers: []
- type: estimate_fee_charge
  target: estimate_events
  meaning: An estimate-stage charge is posted to the booking.
  grain: One row per fee type per booking, and for storage one row per billed storage period.
  distinguish_by:
  - fee_type
  - period_start_date
  fields:
    event_date: Date the charge posted.
    fee_type: teardown, pre_repair_scan, measurement, mobile_trip, tow_in or storage.
    amount_usd: Charge amount (positive).
    period_start_date: First billed storage day; empty for other fee types.
    period_end_date: Last billed storage day; empty for other fee types.
    tow_miles: Tow distance billed; zero for other fee types.
  account: estimate_fees
  direction: in
  triggers: []
- type: estimate_fee_payment
  target: estimate_events
  meaning: A payment is applied to one estimate-stage charge.
  grain: One row per payment against one charge.
  distinguish_by:
  - charge_event_id
  - event_date
  - amount_usd
  - payment_method
  fields:
    event_date: Date of payment.
    charge_event_id: The estimate_fee_charge row being paid.
    amount_usd: Amount applied (positive).
    payment_method: card, ach, cash, check or insurer_direct.
  account: estimate_fees
  direction: out
  triggers: []
- type: estimate_fee_waiver
  target: estimate_events
  meaning: All or part of one estimate-stage charge is waived.
  grain: One row per waiver reason per charge.
  distinguish_by:
  - charge_event_id
  - waiver_reason
  fields:
    event_date: Date of the waiver.
    charge_event_id: The estimate_fee_charge row being waived.
    amount_usd: Amount waived (positive).
    waiver_reason: converted_to_repair, billing_error or goodwill.
  account: estimate_fees
  direction: out
  triggers: []
measures:
- id: estimate_msr_no_shows_lookback
  window: Rolling window of no_show_lookback_days calendar days ending on (and including) the date of the new booking
    request.
  measure: Count of the customer's estimate_bookings in status no_show whose closed_date falls inside the window.
- id: estimate_msr_reschedules_used
  window: Life of the booking.
  measure: Count of estimate_reschedule rows on the booking.
- id: estimate_msr_revisions_used
  window: Life of the booking.
  measure: Count of estimate_revise rows on the booking.
- id: estimate_msr_charge_outstanding
  window: Life of the charge.
  measure: amount_usd of one estimate_fee_charge row minus the sum of amount_usd of every estimate_fee_payment and
    estimate_fee_waiver row whose charge_event_id names it.
- id: estimate_msr_goodwill_waived
  window: Life of the booking.
  measure: Sum of amount_usd of estimate_fee_waiver rows on the booking with waiver_reason goodwill.
- id: estimate_msr_booking_outstanding
  window: Life of the booking.
  measure: Sum of estimate_msr_charge_outstanding over every estimate_fee_charge row on the booking.
policies:
- id: estimate_agg_multi_holding
  subject:
  - estimate_book
  rule: A customer may hold any number of estimate bookings at once, across different vehicles; there is no customer-level
    cap. The per-vehicle limit on open bookings is set by estimate_agg_open_per_vehicle and the no-show restriction
    by estimate_agg_no_show_restriction.
  eligibility: []
  params:
    max_per_customer: null
- id: estimate_agg_open_per_vehicle
  subject:
  - estimate_book
  rule: 'One vehicle may carry at most max_open_bookings_per_vehicle open booking, where open means status booked,
    checked_in or estimate_written. The vehicle has no other booking in booked, checked_in or estimate_written status.
    When it does, no new booking is created: a booked appointment is rescheduled under estimate_evt_reschedule,
    and a written estimate is revised under estimate_evt_revision or converted under estimate_evt_conversion. Bookings
    in converted, declined, cancelled, no_show or expired status do not count.'
  eligibility:
  - id: no_open_booking_on_vehicle
    applies_to:
    - estimate_book
    kind: dedup
    condition: The vehicle has no other booking in booked, checked_in or estimate_written status.
    evidence_fields:
    - estimate_bookings.vehicle_id
    - estimate_bookings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.vehicle_id
      action_bindings:
        estimate_bookings.vehicle_id: vehicle_id
    dedup_contract:
      table: estimate_bookings
      mode: separate_record
      object_bindings:
        vehicle_id: vehicle_id
      duplicate_filters:
        status:
        - booked
        - checked_in
        - estimate_written
      distinct_fields:
      - booking_id
  params:
    per_tier:
      Photo Estimate:
        max_open_bookings_per_vehicle: =max_open_bookings_per_vehicle
      Drive-In Estimate:
        max_open_bookings_per_vehicle: =max_open_bookings_per_vehicle
      Scheduled Estimate:
        max_open_bookings_per_vehicle: =max_open_bookings_per_vehicle
      Mobile Estimate:
        max_open_bookings_per_vehicle: =max_open_bookings_per_vehicle
      Blueprint Teardown Estimate:
        max_open_bookings_per_vehicle: =max_open_bookings_per_vehicle
      Structural Blueprint Estimate:
        max_open_bookings_per_vehicle: =max_open_bookings_per_vehicle
- id: estimate_agg_no_show_restriction
  subject:
  - estimate_book
  rule: Before booking, count the customer's no-shows with estimate_msr_no_shows_lookback over the rolling window
    of no_show_lookback_days calendar days ending on the request date. When the count is at or above no_show_limit,
    only a tier whose reserved_slot is false (Photo Estimate or Drive-In Estimate) may be booked; a tier that reserves
    capacity is refused for that request, whatever the payer. When the count is below the limit every tier remains
    open subject to estimate_tier_eligibility. Cancelled bookings are not no-shows and never count.
  eligibility: []
  params:
    per_tier:
      Photo Estimate:
        no_show_lookback_days: =no_show_lookback_days
        no_show_limit: =no_show_limit
        reserved_slot: =reserved_slot
      Drive-In Estimate:
        no_show_lookback_days: =no_show_lookback_days
        no_show_limit: =no_show_limit
        reserved_slot: =reserved_slot
      Scheduled Estimate:
        no_show_lookback_days: =no_show_lookback_days
        no_show_limit: =no_show_limit
        reserved_slot: =reserved_slot
      Mobile Estimate:
        no_show_lookback_days: =no_show_lookback_days
        no_show_limit: =no_show_limit
        reserved_slot: =reserved_slot
      Blueprint Teardown Estimate:
        no_show_lookback_days: =no_show_lookback_days
        no_show_limit: =no_show_limit
        reserved_slot: =reserved_slot
      Structural Blueprint Estimate:
        no_show_lookback_days: =no_show_lookback_days
        no_show_limit: =no_show_limit
        reserved_slot: =reserved_slot
  measures:
  - estimate_msr_no_shows_lookback
- id: estimate_tier_eligibility
  subject:
  - estimate_book
  rule: The estimate type must accept the vehicle's damage profile. The damage profile recorded on the booking (structural
    damage, drivability, airbag deployment, high-voltage damage) is one the requested estimate type accepts. A tier
    accepts structural damage only where structural_damage_eligible is true, a non-drivable vehicle only where non_drivable_eligible
    is true, a deployed airbag only where airbag_deployment_eligible is true, and damage near a high-voltage system
    only where high_voltage_damage_eligible is true; when several tiers accept the profile the customer chooses,
    and when none of the lower tiers do the lowest tier that accepts every reported condition is offered. A Mobile
    Estimate additionally requires the vehicle to be within mobile_service_radius_miles of the assigned center,
    measured as service_distance_miles on the booking. For an insurance-claim booking on a tier whose insurer_claim_number_required
    is true, the insurer claim number is recorded on the booking at booking time; without it that tier cannot be
    booked and a lower tier that accepts the damage profile is offered instead. The damage profile is what the caller
    reports; it is corrected by the estimator on the written estimate and never re-checked against the tier after
    check-in.
  eligibility:
  - id: damage_profile_accepted
    applies_to:
    - estimate_book
    kind: caller_fact
    condition: The damage profile recorded on the booking (structural damage, drivability, airbag deployment, high-voltage
      damage) is one the requested estimate type accepts.
    evidence_fields:
    - estimate_bookings.structural_damage
    - estimate_bookings.drivable
    - estimate_bookings.airbag_deployed
    - estimate_bookings.high_voltage_damage
    - estimate_bookings.vehicle_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.vehicle_id
      action_bindings:
        estimate_bookings.vehicle_id: vehicle_id
  - id: claim_number_on_booking
    applies_to:
    - estimate_book
    kind: caller_fact
    condition: For an insurance-claim booking on a tier whose insurer_claim_number_required is true, the insurer
      claim number is recorded on the booking at booking time
    evidence_fields:
    - estimate_bookings.insurer_claim_number
    - estimate_bookings.insurer_customer_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.insurer_customer_id
      action_bindings:
        estimate_bookings.insurer_customer_id: insurer_customer_id
  params:
    per_tier:
      Photo Estimate:
        structural_damage_eligible: =structural_damage_eligible
        non_drivable_eligible: =non_drivable_eligible
        airbag_deployment_eligible: =airbag_deployment_eligible
        high_voltage_damage_eligible: =high_voltage_damage_eligible
        mobile_service_radius_miles: =mobile_service_radius_miles
        insurer_claim_number_required: =insurer_claim_number_required
        max_estimate_value_usd: =max_estimate_value_usd
      Drive-In Estimate:
        structural_damage_eligible: =structural_damage_eligible
        non_drivable_eligible: =non_drivable_eligible
        airbag_deployment_eligible: =airbag_deployment_eligible
        high_voltage_damage_eligible: =high_voltage_damage_eligible
        mobile_service_radius_miles: =mobile_service_radius_miles
        insurer_claim_number_required: =insurer_claim_number_required
        max_estimate_value_usd: =max_estimate_value_usd
      Scheduled Estimate:
        structural_damage_eligible: =structural_damage_eligible
        non_drivable_eligible: =non_drivable_eligible
        airbag_deployment_eligible: =airbag_deployment_eligible
        high_voltage_damage_eligible: =high_voltage_damage_eligible
        mobile_service_radius_miles: =mobile_service_radius_miles
        insurer_claim_number_required: =insurer_claim_number_required
        max_estimate_value_usd: =max_estimate_value_usd
      Mobile Estimate:
        structural_damage_eligible: =structural_damage_eligible
        non_drivable_eligible: =non_drivable_eligible
        airbag_deployment_eligible: =airbag_deployment_eligible
        high_voltage_damage_eligible: =high_voltage_damage_eligible
        mobile_service_radius_miles: =mobile_service_radius_miles
        insurer_claim_number_required: =insurer_claim_number_required
        max_estimate_value_usd: =max_estimate_value_usd
      Blueprint Teardown Estimate:
        structural_damage_eligible: =structural_damage_eligible
        non_drivable_eligible: =non_drivable_eligible
        airbag_deployment_eligible: =airbag_deployment_eligible
        high_voltage_damage_eligible: =high_voltage_damage_eligible
        mobile_service_radius_miles: =mobile_service_radius_miles
        insurer_claim_number_required: =insurer_claim_number_required
        max_estimate_value_usd: =max_estimate_value_usd
      Structural Blueprint Estimate:
        structural_damage_eligible: =structural_damage_eligible
        non_drivable_eligible: =non_drivable_eligible
        airbag_deployment_eligible: =airbag_deployment_eligible
        high_voltage_damage_eligible: =high_voltage_damage_eligible
        mobile_service_radius_miles: =mobile_service_radius_miles
        insurer_claim_number_required: =insurer_claim_number_required
        max_estimate_value_usd: =max_estimate_value_usd
- id: estimate_scheduling_window
  subject:
  - estimate_book
  - estimate_reschedule
  rule: 'Every appointment date, whether set at booking or by a reschedule, must sit inside the tier''s booking
    window measured from the day the request is made. The request is made no later than the tier''s minimum booking
    lead days before the appointment date. The request is made no earlier than the tier''s maximum booking horizon
    days before the appointment date. Days are calendar days: the deadline is the appointment date minus the stated
    number of days, and a request made on that deadline date is in time. A same-day appointment is possible only
    where same_day_booking_allowed is true, and a Saturday or Sunday appointment only where weekend_appointments_available
    is true. A Photo Estimate has no visit: its appointment date is the request date itself. Where after_hours_dropoff_allowed
    is true, a vehicle left in the key drop the evening before counts as arriving at the appointment start.'
  eligibility:
  - id: within_lead_time
    applies_to:
    - estimate_book
    - estimate_reschedule
    kind: time
    condition: The request is made no later than the tier's minimum booking lead days before the appointment date.
    evidence_fields:
    - estimate_bookings.appointment_date
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the appointment date
      anchor_source: estimate_bookings.appointment_date
      relation: not_after
      duration_source: variants.min_booking_lead_days
      unit: calendar_days
      counting_rule: 'Days are calendar days: the deadline is the appointment date minus the stated number of days,
        and a request made on that deadline date is in time.'
      boundary: inclusive
  - id: within_horizon
    applies_to:
    - estimate_book
    - estimate_reschedule
    kind: time
    condition: The request is made no earlier than the tier's maximum booking horizon days before the appointment
      date.
    evidence_fields:
    - estimate_bookings.appointment_date
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the appointment date
      anchor_source: estimate_bookings.appointment_date
      relation: not_before
      duration_source: variants.max_booking_horizon_days
      unit: calendar_days
      counting_rule: 'Days are calendar days: the deadline is the appointment date minus the stated number of days,
        and a request made on that deadline date is in time.'
      boundary: inclusive
  params:
    per_tier:
      Photo Estimate:
        min_booking_lead_days: =min_booking_lead_days
        max_booking_horizon_days: =max_booking_horizon_days
        same_day_booking_allowed: =same_day_booking_allowed
        weekend_appointments_available: =weekend_appointments_available
        appointment_duration_minutes: =appointment_duration_minutes
        after_hours_dropoff_allowed: =after_hours_dropoff_allowed
      Drive-In Estimate:
        min_booking_lead_days: =min_booking_lead_days
        max_booking_horizon_days: =max_booking_horizon_days
        same_day_booking_allowed: =same_day_booking_allowed
        weekend_appointments_available: =weekend_appointments_available
        appointment_duration_minutes: =appointment_duration_minutes
        after_hours_dropoff_allowed: =after_hours_dropoff_allowed
      Scheduled Estimate:
        min_booking_lead_days: =min_booking_lead_days
        max_booking_horizon_days: =max_booking_horizon_days
        same_day_booking_allowed: =same_day_booking_allowed
        weekend_appointments_available: =weekend_appointments_available
        appointment_duration_minutes: =appointment_duration_minutes
        after_hours_dropoff_allowed: =after_hours_dropoff_allowed
      Mobile Estimate:
        min_booking_lead_days: =min_booking_lead_days
        max_booking_horizon_days: =max_booking_horizon_days
        same_day_booking_allowed: =same_day_booking_allowed
        weekend_appointments_available: =weekend_appointments_available
        appointment_duration_minutes: =appointment_duration_minutes
        after_hours_dropoff_allowed: =after_hours_dropoff_allowed
      Blueprint Teardown Estimate:
        min_booking_lead_days: =min_booking_lead_days
        max_booking_horizon_days: =max_booking_horizon_days
        same_day_booking_allowed: =same_day_booking_allowed
        weekend_appointments_available: =weekend_appointments_available
        appointment_duration_minutes: =appointment_duration_minutes
        after_hours_dropoff_allowed: =after_hours_dropoff_allowed
      Structural Blueprint Estimate:
        min_booking_lead_days: =min_booking_lead_days
        max_booking_horizon_days: =max_booking_horizon_days
        same_day_booking_allowed: =same_day_booking_allowed
        weekend_appointments_available: =weekend_appointments_available
        appointment_duration_minutes: =appointment_duration_minutes
        after_hours_dropoff_allowed: =after_hours_dropoff_allowed
- id: estimate_evt_reschedule
  subject:
  - estimate_reschedule
  - estimate_appointment_update
  rule: A reschedule moves the appointment of a booking that has not yet taken place. The booking is in booked status.
    The reschedule request is made at least the tier's reschedule cutoff hours before the scheduled appointment
    start. The appointment start is the appointment date at the appointment slot in the repair center's local time;
    the cutoff is that start minus the cutoff hours, counted in full 60-minute hours, and a request exactly at the
    cutoff is in time. The number of reschedules already on the booking (estimate_msr_reschedules_used) must be
    below free_reschedules_per_booking; once the limit is reached no further reschedule is recorded and the customer
    may instead cancel and make a new booking. The new date must also satisfy estimate_scheduling_window counted
    from the reschedule request date. Each reschedule records the next reschedule_number and replaces the appointment
    date and slot on the booking. A Photo Estimate has no appointment to move; its photo window is never extended
    by a reschedule.
  eligibility:
  - id: booking_is_booked
    applies_to:
    - estimate_reschedule
    kind: state
    condition: The booking is in booked status.
    evidence_fields:
    - estimate_bookings.status
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    state_contract:
      field: estimate_bookings.status
      allowed:
      - booked
  - id: before_reschedule_cutoff
    applies_to:
    - estimate_reschedule
    kind: time
    condition: The reschedule request is made at least the tier's reschedule cutoff hours before the scheduled appointment
      start.
    evidence_fields:
    - estimate_bookings.appointment_date
    - estimate_bookings.appointment_slot
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the scheduled appointment start
      anchor_source: estimate_bookings.appointment_date
      relation: not_after
      duration_source: variants.reschedule_cutoff_hours
      unit: elapsed_hours
      counting_rule: The appointment start is the appointment date at the appointment slot in the repair center's
        local time; the cutoff is that start minus the cutoff hours, counted in full 60-minute hours, and a request
        exactly at the cutoff is in time.
      boundary: inclusive
  params:
    per_tier:
      Photo Estimate:
        reschedule_cutoff_hours: =reschedule_cutoff_hours
        free_reschedules_per_booking: =free_reschedules_per_booking
      Drive-In Estimate:
        reschedule_cutoff_hours: =reschedule_cutoff_hours
        free_reschedules_per_booking: =free_reschedules_per_booking
      Scheduled Estimate:
        reschedule_cutoff_hours: =reschedule_cutoff_hours
        free_reschedules_per_booking: =free_reschedules_per_booking
      Mobile Estimate:
        reschedule_cutoff_hours: =reschedule_cutoff_hours
        free_reschedules_per_booking: =free_reschedules_per_booking
      Blueprint Teardown Estimate:
        reschedule_cutoff_hours: =reschedule_cutoff_hours
        free_reschedules_per_booking: =free_reschedules_per_booking
      Structural Blueprint Estimate:
        reschedule_cutoff_hours: =reschedule_cutoff_hours
        free_reschedules_per_booking: =free_reschedules_per_booking
  measures:
  - estimate_msr_reschedules_used
- id: estimate_evt_cancellation_no_show
  subject:
  - estimate_cancel
  - estimate_no_show
  rule: A customer may cancel a booking at any point while it is booked; cancellation itself carries no charge,
    except that a customer-pay Mobile Estimate cancelled inside its cancellation_cutoff_hours before the appointment
    start is a late cancellation that posts the mobile trip fee under estimate_evt_service_fees. A booking becomes
    a no-show when the appointment start plus arrival_grace_minutes passes without a check-in; for a Photo Estimate,
    when photo_submission_window_days pass after the booked date without a usable photo set (a set is usable when
    it has photos_required_count photos, and at most photo_resubmission_limit resubmissions are accepted inside
    the window). A missed customer-pay Mobile Estimate also posts the mobile trip fee. Insurance-claim bookings
    never carry a late-cancellation or no-show charge. A no-show is never reversed into booked; the customer books
    again, subject to estimate_agg_no_show_restriction.
  eligibility: []
  params:
    per_tier:
      Photo Estimate:
        cancellation_cutoff_hours: =cancellation_cutoff_hours
        arrival_grace_minutes: =arrival_grace_minutes
        photo_submission_window_days: =photo_submission_window_days
        photos_required_count: =photos_required_count
        photo_resubmission_limit: =photo_resubmission_limit
      Drive-In Estimate:
        cancellation_cutoff_hours: =cancellation_cutoff_hours
        arrival_grace_minutes: =arrival_grace_minutes
        photo_submission_window_days: =photo_submission_window_days
        photos_required_count: =photos_required_count
        photo_resubmission_limit: =photo_resubmission_limit
      Scheduled Estimate:
        cancellation_cutoff_hours: =cancellation_cutoff_hours
        arrival_grace_minutes: =arrival_grace_minutes
        photo_submission_window_days: =photo_submission_window_days
        photos_required_count: =photos_required_count
        photo_resubmission_limit: =photo_resubmission_limit
      Mobile Estimate:
        cancellation_cutoff_hours: =cancellation_cutoff_hours
        arrival_grace_minutes: =arrival_grace_minutes
        photo_submission_window_days: =photo_submission_window_days
        photos_required_count: =photos_required_count
        photo_resubmission_limit: =photo_resubmission_limit
      Blueprint Teardown Estimate:
        cancellation_cutoff_hours: =cancellation_cutoff_hours
        arrival_grace_minutes: =arrival_grace_minutes
        photo_submission_window_days: =photo_submission_window_days
        photos_required_count: =photos_required_count
        photo_resubmission_limit: =photo_resubmission_limit
      Structural Blueprint Estimate:
