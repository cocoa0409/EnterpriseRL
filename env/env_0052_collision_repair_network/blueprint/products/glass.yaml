policies:
- id: glass_agg_multi_holding
  subject:
  - glass_schedule
  rule: A customer may hold any number of glass jobs across vehicles; there is no customer-level cap. Per vehicle,
    glass_agg_vehicle_exclusivity applies.
  eligibility: []
  params:
    max_per_customer: null
- id: glass_agg_vehicle_exclusivity
  subject:
  - glass_schedule
  rule: A vehicle may have at most max_open_jobs_per_vehicle open glass job, where open means scheduled, in_progress
    or installed; further glass damage on the same vehicle is added to that job. Glass broken in the same loss as
    an open insurance claim repair is repaired as part of that repair order, never as a separate glass job. The
    vehicle has no open glass job and no open insurance claim repair order under the same insurer claim number.
    A glass claim under its own glass claim number is unaffected by a collision repair on another claim.
  eligibility:
  - id: no_duplicate_glass_work
    applies_to:
    - glass_schedule
    kind: dedup
    condition: The vehicle has no open glass job and no open insurance claim repair order under the same insurer
      claim number.
    evidence_fields:
    - glass_jobs.vehicle_id
    - glass_jobs.status
    - claim_repairs.vehicle_id
    - claim_repairs.insurer_claim_number
    - claim_repairs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - glass_jobs.vehicle_id
      - - claim_repairs.vehicle_id
        - claim_repairs.insurer_claim_number
      action_bindings:
        glass_jobs.vehicle_id: vehicle_id
        claim_repairs.vehicle_id: vehicle_id
        claim_repairs.insurer_claim_number: insurer_claim_number
    dedup_contract:
      table: glass_jobs
      mode: separate_record
      object_bindings:
        vehicle_id: vehicle_id
      duplicate_filters:
        status:
        - scheduled
        - in_progress
        - installed
      distinct_fields:
      - glass_job_id
  params:
    per_tier:
      Windshield Chip Repair:
        max_open_jobs_per_vehicle: =max_open_jobs_per_vehicle
      Side Glass Replacement:
        max_open_jobs_per_vehicle: =max_open_jobs_per_vehicle
      Rear Glass Replacement:
        max_open_jobs_per_vehicle: =max_open_jobs_per_vehicle
      Windshield Replacement:
        max_open_jobs_per_vehicle: =max_open_jobs_per_vehicle
      Camera-Equipped Windshield Replacement:
        max_open_jobs_per_vehicle: =max_open_jobs_per_vehicle
      Premium Feature Windshield Replacement:
        max_open_jobs_per_vehicle: =max_open_jobs_per_vehicle
- id: glass_service_selection
  subject:
  - glass_schedule
  rule: A chip is repaired rather than the windshield replaced when the chips number no more than max_chips_per_repair,
    each is within max_chip_diameter_in, any crack is within max_crack_length_in, and the damage lies outside the
    driver's critical viewing area (driver_view_repair_allowed is false on every tier). A windshield replacement
    takes Windshield Replacement when the vehicle's adas_package is none, Camera-Equipped Windshield Replacement
    when it is any other value, and Premium Feature Windshield Replacement when the glass has a head-up display,
    acoustic interlayer or heating that the lower tiers do not support (heads_up_display_supported, acoustic_interlayer_supported,
    heated_glass_supported); Premium Feature glass is always oem (oem_glass_required). An insurance glass claim
    job on a tier whose insurer_claim_number_required is true carries the insurer's glass claim or referral number
    when scheduled. Glass and labor are priced on the network_price_basis; replacement jobs order their glass glass_order_lead_business_days
    business days ahead.
