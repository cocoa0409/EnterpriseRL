- id: glass_evt_pricing_and_deductible
  subject:
  - glass_customer_charge
  - glass_insurer_billing
  - glass_customer_credit
  rule: The job price is chip_repair_first_usd plus chip_repair_additional_usd for each further chip for a chip
    repair, and the glass part price plus installation_labor_usd plus kit_and_disposal_fee_usd for a replacement.
    Charges post on the completion date. On a customer_pay or fleet_account job the whole price is a customer_pay_service
    charge, and a fleet account receives a fleet_discount credit of fleet_discount_pct percent of it, rounded to
    the cent, paying within fleet_payment_terms_days days. On an insurance_glass_claim job the customer pays a deductible
    only where deductible_applies is true and the insurer has not stated full glass coverage, for the lesser of
    deductible_usd and the job price; the rest of the price is billed to the insurer. When the job price is at or
    below the deductible nothing is billed to the insurer. Where oem_upgrade_available is true and the customer
    chose oem glass over the quoted aftermarket glass, the price difference is an oem_upgrade charge to the customer
    and is never billed to the insurer. Where chip_credit_applies is true and the same windshield had a chip repair
    under a Chip Repair Guarantee that is active, the amount paid for that chip repair is credited against the customer's
    deductible or customer-pay charge (chip_repair_credit, naming the coverage), never beyond that charge; whatever
    the credit cannot absorb is not refunded or carried over.
  eligibility: []
  params:
    per_tier:
      Windshield Chip Repair:
        chip_repair_first_usd: =chip_repair_first_usd
        chip_repair_additional_usd: =chip_repair_additional_usd
        installation_labor_usd: =installation_labor_usd
        kit_and_disposal_fee_usd: =kit_and_disposal_fee_usd
        fleet_discount_pct: =fleet_discount_pct
        fleet_payment_terms_days: =fleet_payment_terms_days
        deductible_applies: =deductible_applies
        oem_upgrade_available: =oem_upgrade_available
        chip_credit_applies: =chip_credit_applies
      Side Glass Replacement:
