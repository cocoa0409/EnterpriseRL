events:
- type: glass_schedule
  target: glass_jobs
  mutation: create
  meaning: A glass job is scheduled for one vehicle.
  grain: One row per job.
  fields:
    glass_job_id: Job reference.
    customer_id: Vehicle owner.
    vehicle_id: Vehicle.
    variant_name: Glass service.
    payer_type: insurance_glass_claim, customer_pay or fleet_account.
    insurer_customer_id: Insurer account for a glass claim; empty otherwise.
    insurer_claim_number: Glass claim or referral number, verbatim; empty otherwise.
    full_glass_coverage: Whether the insurer states full glass coverage.
    deductible_usd: Glass deductible stated by the insurer.
    glass_part_type: oem or aftermarket.
    glass_part_price_usd: Price of the glass part quoted.
    chip_count: Chips to repair (chip repair only).
    service_location: mobile or in_shop.
    scheduled_date: Date the job was booked.
    appointment_date: Appointment date.
    appointment_slot: Appointment start.
    location_code: Assigned center.
  triggers: []
- type: glass_reschedule
  target: glass_events
  meaning: The appointment is moved, at the customer's request or because of weather on a mobile job.
  grain: One row per reschedule of one job.
  distinguish_by:
  - reschedule_number
  fields:
    event_date: Date of the reschedule.
    reschedule_number: Ordinal on the job.
    reschedule_cause: customer_request or weather.
    new_appointment_date: New date.
    new_appointment_slot: New start.
  triggers:
  - event: glass:glass_appointment_update
    map:
      appointment_date: new_appointment_date
      appointment_slot: new_appointment_slot
- type: glass_appointment_update
  target: glass_jobs
  mutation: update
  meaning: The job's appointment date and slot are replaced.
  grain: One update per reschedule.
  fields:
    appointment_date: New date.
    appointment_slot: New start.
  triggers: []
- type: glass_start
  target: glass_jobs
  mutation:
    transition:
      from: scheduled
      to: in_progress
  meaning: The technician starts the job.
  grain: One transition per job.
  fields:
    status: Becomes in_progress.
  triggers: []
- type: glass_install
  target: glass_jobs
  mutation:
    transition:
      from: in_progress
      to: installed
  meaning: Replacement glass is bonded in place.
  grain: One transition per job.
  fields:
    status: Becomes installed.
    installed_date: Installation date.
    installed_time: Installation time, starting the safe drive-away clock.
    calibration_required: Whether the technician confirmed a camera bracket requiring calibration.
  triggers:
  - event: adas:adas_order_open
    when:
      calibration_required: true
    map:
      glass_job_id: glass_job_id
      customer_id: customer_id
      vehicle_id: vehicle_id
      opened_date: installed_date
      source_type: glass_replacement
- type: glass_complete
  target: glass_jobs
  mutation:
    transition:
    - from: installed
      to: completed
    - from: in_progress
      to: completed
  meaning: The job is finished and the vehicle handed back.
  grain: One transition per job.
  fields:
    status: Becomes completed.
    completed_date: Completion date.
  triggers:
  - event: warranty:warranty_issue
    map:
      glass_job_id: glass_job_id
      customer_id: customer_id
      vehicle_id: vehicle_id
      issued_date: completed_date
- type: glass_cancel
  target: glass_jobs
  mutation:
    transition:
      from: scheduled
      to: cancelled
  meaning: The customer cancels.
  grain: One transition per job.
  fields:
    status: Becomes cancelled.
    closed_date: Cancellation date.
  triggers: []
- type: glass_missed
  target: glass_jobs
  mutation:
    transition:
      from: scheduled
      to: missed
  meaning: The vehicle was not available in the appointment window.
  grain: One transition per job.
  fields:
    status: Becomes missed.
    closed_date: Date recorded.
  triggers: []
- type: glass_not_repairable
  target: glass_jobs
  mutation:
    transition:
      from: in_progress
      to: not_repairable
  meaning: The chip proved beyond repair limits on inspection.
  grain: One transition per job.
  fields:
    status: Becomes not_repairable.
    closed_date: Date recorded.
  triggers: []
- type: glass_customer_charge
  target: glass_ledger
  meaning: An amount the customer owes on the job is booked.
  grain: One row per charge type per job.
  distinguish_by:
  - charge_type
  fields:
    entry_date: Charge date.
    charge_type: deductible, customer_pay_service, oem_upgrade or late_cancellation.
    amount_usd: Charge (positive).
  account: glass_customer_balance
  direction: in
  triggers: []
- type: glass_customer_payment
  target: glass_ledger
  meaning: The customer pays toward the job.
  grain: One row per payment.
  distinguish_by:
  - entry_date
  - payment_method
  - amount_usd
  fields:
    entry_date: Payment date.
    payment_method: card, cash or check.
    amount_usd: Amount paid (positive).
  account: glass_customer_balance
  direction: out
  triggers: []
- type: glass_customer_credit
  target: glass_ledger
  meaning: 'A customer charge is reduced: the fleet discount, a chip repair credit, a billing correction or goodwill.'
  grain: One row per credit reason per charge.
  distinguish_by:
  - source_entry_id
  - credit_reason
  fields:
    entry_date: Credit date.
    source_entry_id: The glass_customer_charge row credited.
    credit_reason: fleet_discount, chip_repair_credit, billing_error or goodwill.
    warranty_coverage_id: Chip Repair Guarantee coverage a chip_repair_credit rests on; empty otherwise.
    amount_usd: Amount credited (positive).
  account: glass_customer_balance
  direction: out
  triggers: []
- type: glass_insurer_billing
  target: glass_ledger
  meaning: The job is billed to the insurer's glass program.
  grain: One row per job billing.
  distinguish_by:
  - billing_kind
  fields:
    entry_date: Billing date.
    billing_kind: original or corrected.
    amount_usd: Amount billed (positive).
  account: glass_insurer_balance
  direction: in
  triggers: []
- type: glass_insurer_payment
  target: glass_ledger
  meaning: The insurer pays the billing.
  grain: One row per remittance.
  distinguish_by:
  - payment_reference
  fields:
    entry_date: Date received.
    payment_reference: Remittance reference, verbatim.
    amount_usd: Amount received (positive).
  account: glass_insurer_balance
  direction: out
  triggers: []
- type: glass_insurer_adjustment
  target: glass_ledger
  meaning: The insurer's glass program reprices the billing, or a billing error is corrected.
  grain: One row per adjustment reason per billing.
  distinguish_by:
  - source_entry_id
