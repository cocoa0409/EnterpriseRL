  rule: A customer may cancel any scheduled job. A cancellation inside cancellation_cutoff_hours hours before the
    appointment start, or a missed appointment, posts a late_cancellation charge of late_cancellation_fee_usd when
    the job's glass had already been ordered; with no glass ordered, or on a tier whose fee is zero, nothing is
