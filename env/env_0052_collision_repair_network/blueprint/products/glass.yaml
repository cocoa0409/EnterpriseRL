# Product and event policy charter: Auto Glass Services (glass).
category: glass
display_name: Auto Glass Services
binding:
  holding_table: glass_jobs
  event_tables:
  - glass_events
  - glass_ledger
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - scheduled
  - in_progress
  - installed
  - completed
  - cancelled
  - missed
  - not_repairable
  transitions:
  - from: scheduled
    to: in_progress
    by: system
    means: The technician starts the job at the appointment.
  - from: in_progress
    to: installed
    by: system
    means: Replacement glass is set; the urethane safe drive-away time starts.
  - from: installed
    to: completed
    by: system
    means: The safe drive-away time has passed and post-installation checks are done.
  - from: in_progress
    to: completed
    by: system
    means: A chip repair or an unbonded side glass replacement is finished.
  - from: scheduled
    to: cancelled
    by: agent
    means: The customer cancels before the appointment.
  - from: scheduled
    to: missed
    by: system
    means: The technician could not reach or access the vehicle in the appointment window.
  - from: in_progress
    to: not_repairable
    by: system
    means: On inspection the chip is beyond repair limits; the repair job ends without charge.
accounts:
- key: glass_customer_balance
  unit: USD
  meaning: 'What the customer owes on a glass job: deductible, customer-pay price, original-equipment upgrade difference
    and late-cancellation fee. Charges post in; payments and credits post out.'
- key: glass_insurer_balance
  unit: USD
  meaning: 'What the insurer owes on a glass claim job: billings post in; insurer payments and price adjustments
    post out.'
parameter_schema:
  chip_repair_first_usd: Price of the first chip repaired (USD; 0.00 = not applicable).
  chip_repair_additional_usd: Price of each further chip on the same visit (USD; 0.00 = not applicable).
  max_chips_per_repair: Most chips repaired on one job (integer; 0 = not applicable).
  max_chip_diameter_in: Largest chip diameter that can be repaired (inches, 1 decimal; 0.0 = not applicable).
  max_crack_length_in: Longest crack that can be repaired (inches, 1 decimal; 0.0 = not applicable).
  driver_view_repair_allowed: Whether damage in the driver's critical viewing area may be repaired rather than replaced
    (boolean).
  installation_labor_usd: Installation labor charged on a replacement (USD; 0.00 for a chip repair).
  kit_and_disposal_fee_usd: Urethane kit, primer and old-glass disposal fee on a replacement (USD).
  urethane_safe_drive_away_hours: Hours after installation before the vehicle may be driven (integer, hours; 0 =
    no bonded adhesive).
  minimum_mobile_temperature_f: Lowest forecast temperature at which a mobile job is performed (degrees Fahrenheit).
  mobile_service_available: Whether the job may be done at the customer's location (boolean).
  mobile_service_radius_miles: Distance from the assigned center within which mobile service is offered (miles;
    0 = none).
  appointment_window_hours: Length of the mobile arrival window (hours).
  service_duration_minutes: Technician time booked for the job (minutes).
  booking_horizon_days: Furthest ahead an appointment may be booked (calendar days).
  min_booking_lead_hours: Minimum hours between booking and appointment start, covering glass ordering (integer,
    hours).
  same_day_available: Whether a same-day appointment may be booked (boolean).
  glass_order_lead_business_days: Business days to receive the glass from the distributor (integer; 0 = no glass
    ordered).
  reschedule_cutoff_hours: Latest hours before the appointment start at which the customer may reschedule (integer,
    hours).
  free_reschedules: Customer-requested reschedules allowed on one job (integer).
  cancellation_cutoff_hours: Hours before the appointment start inside which a cancellation is late (integer, hours;
    0 = never late).
  late_cancellation_fee_usd: Fee on a late cancellation or a missed appointment of a job whose glass was ordered
    (USD).
  calibration_required: Whether the replacement requires a forward camera calibration order (boolean).
  calibration_before_release: Whether the vehicle is released only after the calibration order is completed or declined
    (boolean).
  oem_glass_required: Whether only original-equipment glass may be installed (boolean).
  oem_upgrade_available: Whether the customer may pay the difference for original-equipment glass where aftermarket
    glass is quoted (boolean).
  rain_sensor_gel_pad_included: Whether a new rain-sensor gel pad is fitted (boolean).
  moldings_replaced: Whether moldings and clips are replaced (boolean).
  post_install_leak_test: Whether a water leak test is performed before completion (boolean).
  deductible_applies: Whether the insurer's glass deductible applies to the job (boolean).
  insurer_payment_terms_days: Calendar days after billing within which the insurer is expected to pay (integer).
  price_adjustment_dispute_pct: Insurer repricing, as a percentage of the billed amount, above which the adjustment
    is disputed instead of accepted (percent).
  fleet_discount_pct: Discount for fleet accounts on customer-pay jobs (percent).
  fleet_payment_terms_days: Calendar days after completion for a fleet account to pay (integer).
  accepted_payment_methods: Payment methods accepted from the customer (list).
  refund_business_days: Business days to refund an overpayment (integer).
  goodwill_credit_authority_usd: Most the desk may credit as goodwill on one job (USD).
  glass_part_defect_months: Months the glass itself is covered against manufacturing defects such as distortion
    (integer; 0 = not applicable).
  warranty_plan_issued: Official name of the warranty issued on completion.
  photo_documentation_count: Photos taken before and after the job (integer).
  max_open_jobs_per_vehicle: Glass jobs one vehicle may have open at once (integer).
  chip_credit_applies: Whether a chip repair paid on the same windshield under an active Chip Repair Guarantee is
    credited against this job (boolean).
  heads_up_display_supported: Whether the tier fits head-up display glass (boolean).
  acoustic_interlayer_supported: Whether the tier fits acoustic interlayer glass (boolean).
  heated_glass_supported: Whether the tier fits glass with heating elements (boolean).
  wait_in_shop_available: Whether the customer may wait at the center during the job (boolean).
  insurer_claim_number_required: Whether an insurance glass claim job must carry the insurer's glass claim or referral
    number at scheduling (boolean).
  network_price_basis: 'How the job price is set: network_price_list (published network price for the part and labor).'
