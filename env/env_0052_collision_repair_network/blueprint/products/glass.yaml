- id: glass_appointment_rules
  subject:
  - glass_schedule
  - glass_reschedule
  - glass_appointment_update
  rule: An appointment is booked at least min_booking_lead_hours hours and at most booking_horizon_days calendar
    days ahead, same-day only where same_day_available is true; a mobile job is offered only where mobile_service_available
    is true and the vehicle is within mobile_service_radius_miles of the center, with an arrival window of appointment_window_hours
    hours and service_duration_minutes booked. The customer may reschedule up to free_reschedules times (glass_msr_customer_reschedules).
    The reschedule request is made at least the tier's reschedule cutoff hours before the scheduled appointment
    start. The cutoff is the appointment start minus the cutoff hours, counted in full 60-minute hours, and a request
    exactly at the cutoff is in time. A mobile job whose forecast temperature at the appointment is below minimum_mobile_temperature_f,
    or with rain forecast, is rescheduled by the network with reschedule_cause weather; weather reschedules are
    never counted against the customer and carry no cutoff.
  eligibility:
  - id: before_glass_reschedule_cutoff
    applies_to:
    - glass_reschedule
    kind: time
    condition: The reschedule request is made at least the tier's reschedule cutoff hours before the scheduled appointment
      start.
    evidence_fields:
    - glass_jobs.appointment_date
    - glass_jobs.appointment_slot
    - glass_jobs.glass_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - glass_jobs.glass_job_id
      action_bindings:
        glass_jobs.glass_job_id: glass_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the scheduled appointment start
      anchor_source: glass_jobs.appointment_date
      relation: not_after
      duration_source: variants.reschedule_cutoff_hours
      unit: elapsed_hours
      counting_rule: The cutoff is the appointment start minus the cutoff hours, counted in full 60-minute hours,
        and a request exactly at the cutoff is in time.
      boundary: inclusive
  params:
    per_tier:
      Windshield Chip Repair:
        min_booking_lead_hours: =min_booking_lead_hours
        booking_horizon_days: =booking_horizon_days
        same_day_available: =same_day_available
        mobile_service_available: =mobile_service_available
        mobile_service_radius_miles: =mobile_service_radius_miles
        appointment_window_hours: =appointment_window_hours
        service_duration_minutes: =service_duration_minutes
        free_reschedules: =free_reschedules
        reschedule_cutoff_hours: =reschedule_cutoff_hours
        minimum_mobile_temperature_f: =minimum_mobile_temperature_f
