- id: glass_evt_installation
  subject:
  - glass_start
  - glass_install
  - glass_complete
  - glass_not_repairable
  rule: The technician photographs the damage and the result (photo_documentation_count photos). A chip found beyond
    the repair limits on inspection ends the repair job as not_repairable with no charge, and the customer is offered
    a replacement job. A replacement fits moldings where moldings_replaced is true and a rain-sensor gel pad where
    rain_sensor_gel_pad_included is true, and is leak tested where post_install_leak_test is true. The vehicle is
    not driven until urethane_safe_drive_away_hours hours after installed_time. The safe drive-away time has passed
    since installation. Where calibration_required is true and the technician confirms the camera bracket, a calibration
    order opens on installation, and where calibration_before_release is true the job completes only once that order
    is completed or its declination is signed. The calibration order opened on the installation is completed or
    its declination is signed. The customer may wait at the center where wait_in_shop_available is true.
  eligibility:
  - id: safe_drive_away_elapsed
    applies_to:
    - glass_complete
    kind: time
    condition: The safe drive-away time has passed since installation.
    evidence_fields:
    - glass_jobs.installed_date
    - glass_jobs.installed_time
    - glass_jobs.glass_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - glass_jobs.glass_job_id
      action_bindings:
        glass_jobs.glass_job_id: glass_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: installation
      anchor_source: glass_jobs.installed_date
      relation: not_before
      duration_source: variants.urethane_safe_drive_away_hours
      unit: elapsed_hours
      counting_rule: The vehicle is not driven until urethane_safe_drive_away_hours hours after installed_time.
      boundary: inclusive
  - id: calibration_closed_before_release
    applies_to:
    - glass_complete
    kind: authorization
    condition: The calibration order opened on the installation is completed or its declination is signed.
    evidence_fields:
    - adas_orders.glass_job_id
    - adas_orders.status
    - adas_declinations.adas_order_id
    - adas_declinations.declination_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
