# Product and event policy charter: Rental Vehicle Coordination (rental).
category: rental
display_name: Rental Vehicle Coordination
binding:
  holding_table: rental_reservations
  event_tables:
  - rental_events
  - rental_ledger
  intake_tables:
  - rental_extension_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - reserved
  - on_rent
  - returned
  - settled
  - cancelled
  transitions:
  - from: reserved
    to: on_rent
    by: agent
    means: The customer picks up the rental (or it is delivered to the repair center at drop-off).
  - from: on_rent
    to: returned
    by: system
    means: The rental is returned to the partner branch or the repair center.
  - from: returned
    to: settled
    by: system
    means: The final rental invoice is split between insurer, network and customer and the customer's share is settled.
  - from: reserved
    to: cancelled
    by: agent
    means: The reservation is cancelled before pickup.
accounts:
- key: covered_days
  unit: rental days
  meaning: Rental days authorized to be paid by someone other than the customer (insurer or network) on a reservation.
    Authorizations and extensions post in; days used at settlement post out.
- key: rental_customer_balance
  unit: USD
  meaning: 'The customer''s share of a rental: uncovered days, daily-cap excess, class differences, fees and options.
    Charges post in; payments and credits post out.'
parameter_schema:
  partner_daily_rate_usd: Network-negotiated replacement rental rate per rental day (USD).
  weekly_rate_usd: Rate for a block of seven rental days on a customer-pay rental (USD).
  weekly_rate_threshold_days: Rental days on a customer-pay rental from which the weekly rate applies to each full
    seven-day block (integer).
  min_rental_days_billed: Fewest rental days billed on any rental (integer).
  rental_day_hours: Length of one rental day, counted from the pickup time (hours).
  return_grace_minutes: Minutes past the end of a rental day within which a return does not start a further rental
    day (integer).
  after_hours_return_counted_at_opening: Whether a key-drop return outside branch hours is counted as returned at
    the branch's next opening time (boolean).
  branch_open_time: Partner branch opening time used for after-hours returns (HH:MM local).
  seats: Seats in the class (integer).
  luggage_capacity_bags: Large suitcases the class holds (integer).
  min_renter_age: Minimum age of the renter (years).
  young_renter_max_age: Highest age at which the young-renter fee applies (years).
  young_renter_fee_daily_usd: Young-renter fee per rental day, always paid by the customer (USD).
  accepted_payment_methods: Cards accepted for the customer's share and the hold (list).
  card_hold_usd: Authorization hold placed on the renter's card at pickup and released at settlement (USD).
  pickup_lead_hours: Hours of notice the partner needs to have the class ready (integer).
  saturday_pickup_available: Whether a Saturday pickup can be arranged (boolean).
  delivery_to_center_available: Whether the partner delivers the rental to the repair center at drop-off (boolean).
  fuel_policy: 'Fuel policy: full_to_full (returned with the fuel level it left with).'
  refuel_charge_per_gallon_usd: Charge per gallon to refill a rental returned short of fuel (USD per gallon).
  unlimited_mileage: Whether mileage is unlimited (boolean).
  ready_notice_grace_business_days: Business days after the vehicle-ready notice date through which rental coverage
    continues for pickup (integer).
  total_loss_coverage_days: Calendar days after the total-loss notice date through which rental coverage continues
    (integer).
  max_days_per_rental_agreement: Longest single rental agreement before it is renewed at the branch (calendar days).
  extension_request_lead_hours: Hours before the current coverage end by which an extension request must reach the
    insurer (integer).
  max_extension_days_per_request: Most days one extension request may ask for (integer).
  network_delay_courtesy: Whether rental days lost to a delay the network caused are paid by the network (boolean).
  class_upgrade_allowed: Whether the customer may move up from this class by paying the difference (boolean).
  upgrade_difference_basis: 'How a class difference is charged: daily_rate_difference per rental day.'
  daily_cap_excess_billed_to_customer: Whether the part of the daily rate above the insurer's daily cap is the customer's
    (boolean).
  warranty_courtesy_class_allowed: Whether the class may be used for a warranty courtesy rental (boolean).
  customer_pay_discount_pct: Discount on customer-pay rentals tied to a network repair (percent).
  insurer_direct_bill_available: Whether the covered portion is billed directly to the insurer (boolean).
  additional_driver_fee_daily_usd: Additional driver fee per rental day (USD).
  spouse_driver_free: Whether the renter's spouse or domestic partner drives free (boolean).
  child_seat_daily_usd: Child seat per rental day (USD).
  child_seat_max_usd: Most charged for one child seat per rental (USD).
  gps_daily_usd: Navigation unit per rental day (USD).
  roadside_daily_usd: Roadside protection per rental day (USD).
  damage_waiver_daily_usd: Damage waiver per rental day (USD).
  liability_supplement_daily_usd: Supplemental liability protection per rental day (USD).
  toll_admin_fee_daily_usd: Toll service fee per rental day on which a toll is used, plus the tolls themselves (USD).
  toll_admin_fee_max_usd: Most toll service fees charged per rental (USD).
  smoking_cleaning_fee_usd: Cleaning fee when a rental is returned smelling of smoke (USD).
  pet_cleaning_fee_usd: Cleaning fee when a rental is returned with pet hair (USD).
  goodwill_credit_authority_days: Most the desk may credit as goodwill on one rental, in rental days at the class's
    partner rate (integer).
  refund_business_days: Business days to refund an overpayment (integer).
  settlement_business_days: Business days after return within which the final invoice is settled (integer).
