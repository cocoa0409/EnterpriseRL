- id: rental_evt_initial_authorization
  subject:
  - rental_authorization
  rule: The initial authorization sets how many rental days someone other than the customer pays. For first_party_rental_coverage
    and third_party_liability it is the insurer's authorization of the planned repair days of the repair order (claim_repairs.estimated_repair_days),
    paid by the insurer; it is recorded only after the insurer has authorized the repair itself. The repair order
    the rental is for has been authorized by the insurer. For warranty_courtesy it is the courtesy rental days of
    the warranty plan, paid by the network. A customer_pay rental has no authorization. First-party coverage pays
    at most daily_coverage_cap_usd per day and coverage_max_usd in total, the part of the partner rate above the
    cap being the customer's where daily_cap_excess_billed_to_customer is true; third-party liability pays the partner
    rate of the class reserved. The covered portion is billed directly where insurer_direct_bill_available is true.
  eligibility:
  - id: repair_authorized_first
    applies_to:
    - rental_authorization
    kind: state
    condition: The repair order the rental is for has been authorized by the insurer.
    evidence_fields:
    - claim_repairs.status
    - claim_repairs.claim_repair_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_repairs.claim_repair_id
      action_bindings:
        claim_repairs.claim_repair_id: claim_repair_id
    state_contract:
      field: claim_repairs.status
      allowed:
      - authorized
      - in_repair
      - on_hold
      - repair_complete
