- id: rental_evt_customer_settlement
  subject:
  - rental_customer_payment
  - rental_customer_credit
  rule: 'The customer''s share (rental_msr_customer_balance) is paid at settlement on an accepted card, after which
    the card hold is released; an overpayment is refunded within refund_business_days business days. Credits name
    the charge they reduce and never exceed it: customer_pay_discount follows rental_evt_settlement_split, billing_error
    corrects a wrong charge, and goodwill is capped at goodwill_credit_authority_days rental days at the class''s
    partner rate per rental (rental_msr_goodwill_credited), beyond which the request is declined.'
  eligibility: []
  params:
    per_tier:
      Economy Rental:
        refund_business_days: =refund_business_days
