- id: rental_evt_rental_days
  subject:
  - rental_return
  - rental_days_consumed
  rule: 'Rental days are counted in rental_day_hours-hour periods from the pickup time: the rental lasts from pickup_date
    and pickup_time to return_date and return_time, a return no more than return_grace_minutes minutes into a new
    period does not start it, and at least min_rental_days_billed day is billed. A key-drop return outside branch
    hours counts as returned at the branch''s next branch_open_time where after_hours_return_counted_at_opening
    is true. Covered days used are the rental days that start on or before the coverage end date, up to the covered
    days remaining (rental_msr_covered_days_remaining); they are drawn once, at settlement. Mileage is unlimited
    where unlimited_mileage is true.'
  eligibility: []
  params:
    per_tier:
      Economy Rental:
        rental_day_hours: =rental_day_hours
        return_grace_minutes: =return_grace_minutes
        min_rental_days_billed: =min_rental_days_billed
        after_hours_return_counted_at_opening: =after_hours_return_counted_at_opening
        branch_open_time: =branch_open_time
        unlimited_mileage: =unlimited_mileage
      Compact Rental:
