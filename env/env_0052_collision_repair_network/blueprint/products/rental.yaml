  subject:
  - rental_reserve
  - rental_class_change
  - rental_pickup
  rule: The renter must be at least min_renter_age years old at pickup and pays young_renter_fee_daily_usd per rental
    day when not older than young_renter_max_age; the class must seat the party (seats, luggage_capacity_bags);
    the renter presents one of the class's accepted_payment_methods, on which card_hold_usd is held until settlement.
