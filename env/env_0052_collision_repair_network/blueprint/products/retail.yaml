      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the estimate written date
      anchor_source: estimate_bookings.estimate_written_date
      relation: not_after
      duration_source: variants.quote_price_hold_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the estimate written date as day zero; opening on the last
        day of the hold keeps the quoted price.
      boundary: inclusive
