        paint_materials_rate_usd: =paint_materials_rate_usd
        shop_supplies_pct: =shop_supplies_pct
        shop_supplies_cap_usd: =shop_supplies_cap_usd
        hazardous_waste_fee_usd: =hazardous_waste_fee_usd
        default_part_type: =default_part_type
