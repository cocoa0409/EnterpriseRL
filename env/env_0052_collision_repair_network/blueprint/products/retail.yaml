# Product and event policy charter: Customer-Pay Repairs (retail).
category: retail
display_name: Customer-Pay Repairs
binding:
  holding_table: retail_repairs
  event_tables:
  - retail_ledger
  - retail_parts
  intake_tables:
  - retail_approvals
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - opened
  - in_repair
  - awaiting_approval
  - ready
  - delivered
  - closed
  - cancelled
  transitions:
  - from: opened
    to: in_repair
    by: system
    means: The vehicle is dropped off, any deposit is taken and work starts on the quoted scope.
  - from: in_repair
    to: awaiting_approval
    by: system
    means: Additional work is found and the job pauses for the customer's approval.
  - from: awaiting_approval
    to: in_repair
    by: system
    means: The customer approved or declined the additional work (or the response window lapsed) and work resumes.
  - from: in_repair
    to: ready
    by: system
    means: Final inspection is passed and the ready notice is sent.
  - from: ready
    to: delivered
    by: agent
    means: The vehicle is released to the customer.
  - from: delivered
    to: closed
    by: system
    means: The repair order balance is zero.
  - from: opened
    to: cancelled
    by: user
    means: The customer cancels before work starts.
  - from: in_repair
    to: cancelled
    by: user
    means: The customer stops the job during work.
  - from: awaiting_approval
    to: cancelled
    by: user
    means: The customer stops the job while an approval is pending.
  - from: cancelled
    to: closed
    by: system
    means: A cancelled job's balance is settled and the vehicle collected.
accounts:
- key: retail_balance
  unit: USD
  meaning: What the customer owes on a customer-pay repair order. Work, restocking, storage charges and refunds
    of overpayments post in; deposits, payments and credits (discounts, corrections, goodwill) post out.
parameter_schema:
  labor_rate_usd: Body labor rate (USD per hour).
  refinish_labor_rate_usd: Refinish labor rate (USD per hour; 0.00 = no refinish).
  paint_materials_rate_usd: Paint and materials charge per refinish labor hour (USD per hour).
  pdr_first_dent_price_usd: Price of the first dent repaired without paint (USD; 0.00 = not applicable).
  pdr_additional_dent_price_usd: Price of each further dent on the same visit (USD; 0.00 = not applicable).
  max_dents_per_visit: Most dents taken on one repair order (integer; 0 = not applicable).
  max_panels: Most body panels the tier works on (integer; 0 = no ceiling).
  max_labor_hours: Highest quoted labor hours the tier takes (hours, 1 decimal; 0.0 = no ceiling).
  structural_work_allowed: Whether structural operations may be quoted (boolean).
  min_job_charge_usd: Minimum charge for the quoted work (USD).
  shop_supplies_pct: Shop supplies charge as a percentage of quoted labor (percent).
  shop_supplies_cap_usd: Most the shop supplies charge can be on one repair order (USD).
  hazardous_waste_fee_usd: Flat hazardous waste disposal fee on the quote (USD).
  quote_price_hold_days: Calendar days after the estimate written date during which the quoted price is honored
    when the repair order opens (integer).
  deposit_pct: Deposit taken at drop-off as a percentage of the quoted total (percent).
  deposit_min_total_usd: Quoted total at or above which a deposit is taken (USD).
  parts_ordered_after_deposit: Whether parts are ordered only after the deposit is received (boolean).
  additional_work_response_hours: Hours the customer has to answer an additional-work approval request before it
    lapses as declined (integer, hours).
  additional_work_reestimate_pct: Cumulative approved additional work, as a percentage of the quoted total, above
    which further additions require a new estimate instead of an approval (percent).
  restocking_fee_pct: Restocking fee on returnable parts already ordered when a job is cancelled (percent of the
    parts amount).
  non_returnable_parts_charged_pct: Share of non-returnable (special-order or painted) parts charged when a job
    is cancelled (percent).
  cancellation_labor_billed: Whether labor already performed is charged when a job is cancelled during work (boolean).
  deposit_refund_business_days: Business days to refund a deposit or overpayment to the original method (integer).
  fleet_payment_terms_days: Calendar days after delivery within which a fleet account pays its invoice (integer).
  fleet_discount_pct: Discount for fleet accounts (percent).
  military_discount_pct: Discount for active-duty military and veterans (percent).
  senior_discount_pct: Discount for customers aged 65 or older (percent).
  returning_customer_discount_pct: Discount for a customer with a delivered repair in the look-back window (percent).
  returning_customer_lookback_months: Calendar months back from the opening date within which a delivered repair
    makes the customer a returning customer (integer).
  discount_cap_usd: Most any discount can be on one repair order (USD).
  discount_base: 'Amount the discount percentage applies to: total (the quoted total) or labor_only (the quoted
    labor).'
  financing_available: Whether the balance may be financed through the network's partner (boolean).
  financing_min_balance_usd: Smallest balance that may be financed (USD; 0.00 = not applicable).
  accepted_payment_methods: Payment methods accepted (list).
  pickup_free_days: Calendar days after the ready date to collect the vehicle before storage (integer).
  storage_daily_rate_usd: Storage per calendar day beyond the free days (USD per day).
  target_turnaround_business_days: Target business days from drop-off to ready (integer).
  same_day_service_available: Whether the job can be done the day the vehicle is dropped off (boolean).
  mobile_service_available: Whether the work can be done at the customer's location (boolean).
  mobile_service_fee_usd: Fee for doing the work at the customer's location (USD).
  blend_adjacent_panels: Whether blending into adjacent panels for color match is included in the quote (boolean).
  post_repair_scan_required: Whether a post-repair diagnostic scan is run before ready (boolean).
  calibration_check_required: Whether the job is checked against the manufacturer's calibration requirements and
    resulting calibration orders must be closed before ready (boolean).
  default_part_type: 'Part type quoted unless the customer chooses otherwise: none, certified_aftermarket or oem.'
  customer_supplied_parts_accepted: Whether parts the customer buys and brings are installed (boolean).
  customer_supplied_parts_handling_pct: Handling charge on the installation labor of customer-supplied parts (percent).
  warranty_plan_issued: Official name of the workmanship warranty issued on delivery.
  max_open_repairs_per_vehicle: Customer-pay repair orders one vehicle may have open at once (integer).
  goodwill_credit_authority_usd: Most the desk may credit as goodwill on one repair order (USD).
