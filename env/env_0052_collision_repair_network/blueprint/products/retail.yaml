- id: retail_evt_cancellation
  subject:
  - retail_cancel
  - retail_charge
  - retail_parts_return
  rule: 'Cancelling is the customer''s decision and is effective once the customer confirms it. The customer''s
    cancellation request on the repair order is approved. A job cancelled before any parts order and before work
    starts owes nothing and any deposit is refunded in full. Otherwise the customer owes, each as its own charge:
    labor already performed at labor_rate_usd where cancellation_labor_billed is true (work_performed); for each
    returnable parts order, a restocking fee of restocking_fee_pct percent of its parts amount once the parts are
    returned (restocking); and for each non-returnable parts order, non_returnable_parts_charged_pct percent of
    its parts amount (non_returnable_parts), the parts then belonging to the customer. The quoted_work charge, net
    of its discount credit, is reversed on cancellation by a billing_error credit for its remaining amount. Deposits
    are applied to what is owed and any excess refunded within deposit_refund_business_days business days.'
  eligibility:
  - id: cancellation_confirmed
    applies_to:
    - retail_cancel
    kind: authorization
    condition: The customer's cancellation request on the repair order is approved.
    evidence_fields:
    - retail_approvals.retail_repair_id
    - retail_approvals.approval_type
    - retail_approvals.approval_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_approvals.retail_repair_id
      action_bindings:
        retail_approvals.retail_repair_id: retail_repair_id
  params:
    per_tier:
      Paintless Dent Repair Service:
        labor_rate_usd: =labor_rate_usd
        cancellation_labor_billed: =cancellation_labor_billed
        restocking_fee_pct: =restocking_fee_pct
        non_returnable_parts_charged_pct: =non_returnable_parts_charged_pct
        deposit_refund_business_days: =deposit_refund_business_days
      Cosmetic Touch-Up Service:
        labor_rate_usd: =labor_rate_usd
        cancellation_labor_billed: =cancellation_labor_billed
        restocking_fee_pct: =restocking_fee_pct
        non_returnable_parts_charged_pct: =non_returnable_parts_charged_pct
        deposit_refund_business_days: =deposit_refund_business_days
      Bumper Refinish Service:
        labor_rate_usd: =labor_rate_usd
        cancellation_labor_billed: =cancellation_labor_billed
        restocking_fee_pct: =restocking_fee_pct
        non_returnable_parts_charged_pct: =non_returnable_parts_charged_pct
        deposit_refund_business_days: =deposit_refund_business_days
      Panel Repair Service:
        labor_rate_usd: =labor_rate_usd
        cancellation_labor_billed: =cancellation_labor_billed
        restocking_fee_pct: =restocking_fee_pct
        non_returnable_parts_charged_pct: =non_returnable_parts_charged_pct
        deposit_refund_business_days: =deposit_refund_business_days
      Customer-Pay Collision Service:
        labor_rate_usd: =labor_rate_usd
        cancellation_labor_billed: =cancellation_labor_billed
        restocking_fee_pct: =restocking_fee_pct
        non_returnable_parts_charged_pct: =non_returnable_parts_charged_pct
        deposit_refund_business_days: =deposit_refund_business_days
      Complete Refinish Service:
        labor_rate_usd: =labor_rate_usd
        cancellation_labor_billed: =cancellation_labor_billed
        restocking_fee_pct: =restocking_fee_pct
        non_returnable_parts_charged_pct: =non_returnable_parts_charged_pct
        deposit_refund_business_days: =deposit_refund_business_days
  formula:
    when: charge_type == 'restocking'
    amount_usd: round(parts_amount_usd * restocking_fee_pct / 100, 2)
- id: retail_evt_storage
  subject:
  - retail_charge
  rule: Storage is charged when a ready vehicle, or the vehicle of a cancelled job, is not collected in time. The
    vehicle is still at the center more than pickup_free_days after the ready date. Days are calendar days counted
    from the ready date (or the cancellation date) as day zero; the first billed day is the day after the last free
    day. Storage posts as one charge on the collection date at storage_daily_rate_usd per calendar day for period_start_date
    through period_end_date inclusive.
  eligibility:
  - id: beyond_free_pickup
    applies_to:
    - retail_charge
    kind: time
    condition: The vehicle is still at the center more than pickup_free_days after the ready date.
    evidence_fields:
    - retail_repairs.ready_date
    - retail_repairs.retail_repair_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_repairs.retail_repair_id
      action_bindings:
        retail_repairs.retail_repair_id: retail_repair_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the ready date
      anchor_source: retail_repairs.ready_date
      relation: not_before
      duration_source: variants.pickup_free_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the ready date (or the cancellation date) as day zero;
        the first billed day is the day after the last free day.
      boundary: exclusive
  params:
    per_tier:
      Paintless Dent Repair Service:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Cosmetic Touch-Up Service:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Bumper Refinish Service:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Panel Repair Service:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Customer-Pay Collision Service:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
      Complete Refinish Service:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
  formula:
    when: charge_type == 'storage'
    amount_usd: (period_end_date - period_start_date + 1) * storage_daily_rate_usd
- id: retail_evt_payments_refunds
  subject:
  - retail_payment
  - retail_refund
  - retail_credit
  - retail_close
  rule: Payments reduce the balance; a refund names the payment it returns and never exceeds it, going back to that
    payment's method within deposit_refund_business_days business days. A payment may be refunded only once. A billing_error
    credit corrects a charge posted at a wrong amount. Goodwill credits are limited to goodwill_credit_authority_usd
    per repair order (retail_msr_goodwill_credited); a request beyond that is declined at the desk. The repair order
    closes once delivered (or cancelled and the vehicle collected) with retail_msr_balance at zero.
  eligibility:
  - id: payment_refunded_once
    applies_to:
    - retail_refund
    kind: dedup
    condition: A payment may be refunded only once.
    evidence_fields:
    - retail_ledger.source_entry_id
    - retail_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_ledger.source_entry_id
      action_bindings:
        retail_ledger.source_entry_id: source_entry_id
    dedup_contract:
      table: retail_ledger
      mode: separate_record
      object_bindings:
        source_entry_id: source_entry_id
      duplicate_filters:
        event_type:
        - retail_refund
      distinct_fields: []
  params:
    per_tier:
      Paintless Dent Repair Service:
        deposit_refund_business_days: =deposit_refund_business_days
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Cosmetic Touch-Up Service:
        deposit_refund_business_days: =deposit_refund_business_days
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Bumper Refinish Service:
        deposit_refund_business_days: =deposit_refund_business_days
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Panel Repair Service:
        deposit_refund_business_days: =deposit_refund_business_days
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Customer-Pay Collision Service:
        deposit_refund_business_days: =deposit_refund_business_days
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Complete Refinish Service:
        deposit_refund_business_days: =deposit_refund_business_days
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
  measures:
  - retail_msr_balance
  - retail_msr_goodwill_credited
