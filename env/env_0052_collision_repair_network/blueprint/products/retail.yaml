        deposit_pct: =deposit_pct
        fleet_payment_terms_days: =fleet_payment_terms_days
        parts_ordered_after_deposit: =parts_ordered_after_deposit
        target_turnaround_business_days: =target_turnaround_business_days
        same_day_service_available: =same_day_service_available
      Bumper Refinish Service:
