- id: retail_discount_program
  subject:
  - retail_credit
  rule: One discount program at most applies to a repair order; discounts never stack. A fleet account takes the
    fleet discount (fleet_discount_pct); an individual may qualify for the military (military_discount_pct), senior
    (senior_discount_pct) or returning-customer (returning_customer_discount_pct) program, and when more than one
    is met the program giving the largest discount amount applies. A customer is a returning customer when retail_msr_returning_customer
    is at least one, counting delivered claim or customer-pay repairs within returning_customer_lookback_months
    calendar months before the opening date. The discount is the program percentage of the discount_base (the quoted
    total, or the quoted labor where discount_base is labor_only), capped at discount_cap_usd and rounded to the
    cent, and it posts as one discount credit against the quoted_work charge on the start date. Additional work,
    restocking, storage and fees are never discounted. The program is recorded on the repair order at opening and
    is not changed afterwards.
  eligibility: []
  params:
    discount_basis_amount: quoted_total_usd when discount_base is total; quoted_labor_usd when labor_only
    program_pct: the percentage of the single program applied
    per_tier:
      Paintless Dent Repair Service:
        fleet_discount_pct: =fleet_discount_pct
        military_discount_pct: =military_discount_pct
        senior_discount_pct: =senior_discount_pct
        returning_customer_discount_pct: =returning_customer_discount_pct
        returning_customer_lookback_months: =returning_customer_lookback_months
        discount_base: =discount_base
        discount_cap_usd: =discount_cap_usd
      Cosmetic Touch-Up Service:
        fleet_discount_pct: =fleet_discount_pct
        military_discount_pct: =military_discount_pct
        senior_discount_pct: =senior_discount_pct
        returning_customer_discount_pct: =returning_customer_discount_pct
        returning_customer_lookback_months: =returning_customer_lookback_months
        discount_base: =discount_base
        discount_cap_usd: =discount_cap_usd
      Bumper Refinish Service:
        fleet_discount_pct: =fleet_discount_pct
        military_discount_pct: =military_discount_pct
        senior_discount_pct: =senior_discount_pct
        returning_customer_discount_pct: =returning_customer_discount_pct
        returning_customer_lookback_months: =returning_customer_lookback_months
        discount_base: =discount_base
        discount_cap_usd: =discount_cap_usd
      Panel Repair Service:
        fleet_discount_pct: =fleet_discount_pct
        military_discount_pct: =military_discount_pct
        senior_discount_pct: =senior_discount_pct
        returning_customer_discount_pct: =returning_customer_discount_pct
        returning_customer_lookback_months: =returning_customer_lookback_months
        discount_base: =discount_base
        discount_cap_usd: =discount_cap_usd
      Customer-Pay Collision Service:
        fleet_discount_pct: =fleet_discount_pct
        military_discount_pct: =military_discount_pct
        senior_discount_pct: =senior_discount_pct
        returning_customer_discount_pct: =returning_customer_discount_pct
        returning_customer_lookback_months: =returning_customer_lookback_months
        discount_base: =discount_base
        discount_cap_usd: =discount_cap_usd
      Complete Refinish Service:
        fleet_discount_pct: =fleet_discount_pct
        military_discount_pct: =military_discount_pct
        senior_discount_pct: =senior_discount_pct
        returning_customer_discount_pct: =returning_customer_discount_pct
        returning_customer_lookback_months: =returning_customer_lookback_months
        discount_base: =discount_base
        discount_cap_usd: =discount_cap_usd
  formula:
    when: credit_reason == 'discount'
    amount_usd: min(discount_cap_usd, round(discount_basis_amount * program_pct / 100, 2))
  measures:
  - retail_msr_returning_customer
- id: retail_evt_start_and_deposit
  subject:
  - retail_start
  - retail_payment
  - retail_parts_order
  rule: Work starts when the vehicle is dropped off. When the quoted total is at or above deposit_min_total_usd,
    a deposit of deposit_pct percent of the quoted total, rounded to the cent, is taken at drop-off as a payment
    of kind deposit; fleet accounts pay no deposit and are invoiced on fleet_payment_terms_days terms. Where parts_ordered_after_deposit
    is true, parts are ordered only after the deposit is received. Where a deposit is due, it is received before
    parts are ordered. The quoted_work charge posts on the start date. The ready notice is targeted within target_turnaround_business_days
    business days, same-day only where same_day_service_available is true.
  eligibility:
  - id: deposit_before_parts
    applies_to:
    - retail_parts_order
    kind: authorization
    condition: Where a deposit is due, it is received before parts are ordered.
    evidence_fields:
    - retail_ledger.retail_repair_id
    - retail_ledger.event_type
    - retail_ledger.payment_kind
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_ledger.retail_repair_id
      action_bindings:
        retail_ledger.retail_repair_id: retail_repair_id
  params:
    per_tier:
      Paintless Dent Repair Service:
        deposit_min_total_usd: =deposit_min_total_usd
        deposit_pct: =deposit_pct
        fleet_payment_terms_days: =fleet_payment_terms_days
        parts_ordered_after_deposit: =parts_ordered_after_deposit
        target_turnaround_business_days: =target_turnaround_business_days
        same_day_service_available: =same_day_service_available
      Cosmetic Touch-Up Service:
