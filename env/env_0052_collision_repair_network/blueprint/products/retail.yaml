      Customer-Pay Collision Service:
        deposit_min_total_usd: =deposit_min_total_usd
        deposit_pct: =deposit_pct
        fleet_payment_terms_days: =fleet_payment_terms_days
        parts_ordered_after_deposit: =parts_ordered_after_deposit
        target_turnaround_business_days: =target_turnaround_business_days
        same_day_service_available: =same_day_service_available
      Complete Refinish Service:
        deposit_min_total_usd: =deposit_min_total_usd
        deposit_pct: =deposit_pct
        fleet_payment_terms_days: =fleet_payment_terms_days
        parts_ordered_after_deposit: =parts_ordered_after_deposit
        target_turnaround_business_days: =target_turnaround_business_days
        same_day_service_available: =same_day_service_available
  formula:
    when: payment_kind == 'deposit'
    amount_usd: round(quoted_total_usd * deposit_pct / 100, 2)
- id: retail_evt_additional_work
  subject:
  - retail_pause_for_approval
  - retail_resume
  - retail_charge
  rule: Work beyond the quote is never performed or charged without the customer's own approval. The customer's
    additional-work approval for that item is approved. The desk issues the request with its amount and labor hours
    and the job pauses; the customer answers within additional_work_response_hours hours of the request, and a request
    not answered in that time lapses as declined and work resumes on the quoted scope. Once approved additional
    work (retail_msr_approved_additions_total plus the new item) would exceed additional_work_reestimate_pct percent
    of the quoted total, no further approval is issued and the customer is offered a new estimate instead. An approved
    item posts an additional_work charge carrying its approval_id.
  eligibility:
  - id: addition_approved
    applies_to:
    - retail_charge
    kind: authorization
    condition: The customer's additional-work approval for that item is approved.
    evidence_fields:
    - retail_approvals.approval_id
    - retail_approvals.approval_type
    - retail_approvals.approval_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_approvals.approval_id
      action_bindings:
        retail_approvals.approval_id: approval_id
  params:
    per_tier:
      Paintless Dent Repair Service:
        additional_work_response_hours: =additional_work_response_hours
        additional_work_reestimate_pct: =additional_work_reestimate_pct
      Cosmetic Touch-Up Service:
        additional_work_response_hours: =additional_work_response_hours
        additional_work_reestimate_pct: =additional_work_reestimate_pct
      Bumper Refinish Service:
        additional_work_response_hours: =additional_work_response_hours
        additional_work_reestimate_pct: =additional_work_reestimate_pct
      Panel Repair Service:
        additional_work_response_hours: =additional_work_response_hours
        additional_work_reestimate_pct: =additional_work_reestimate_pct
      Customer-Pay Collision Service:
