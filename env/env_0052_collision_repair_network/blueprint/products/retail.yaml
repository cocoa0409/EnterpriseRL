events:
- type: retail_open
  target: retail_repairs
  mutation: create
  meaning: A customer-pay repair order is opened from a written estimate.
  grain: One row per repair order.
  fields:
    retail_repair_id: Repair order reference.
    customer_id: Customer paying for the work.
    vehicle_id: Vehicle repaired.
    booking_id: Estimate booking converted.
    variant_name: Service tier.
    opened_date: Opening date.
    quoted_total_usd: Quoted total before discount.
    quoted_labor_usd: Labor portion of the quote.
    quoted_labor_hours: Labor hours quoted.
    dent_count: Dents quoted (Paintless Dent Repair Service only).
    discount_program: Discount program applied.
  triggers: []
- type: retail_start
  target: retail_repairs
  mutation:
    transition:
      from: opened
      to: in_repair
  meaning: The vehicle is dropped off and work starts on the quoted scope.
  grain: One transition per repair order.
  fields:
    status: Becomes in_repair.
    repair_started_date: Drop-off date.
  triggers:
  - event: retail:retail_charge
    map:
      charge_type: quoted_work
      entry_date: repair_started_date
- type: retail_pause_for_approval
  target: retail_repairs
  mutation:
    transition:
      from: in_repair
      to: awaiting_approval
  meaning: Additional work is found and sent to the customer for approval.
  grain: One transition per approval request.
  fields:
    status: Becomes awaiting_approval.
  triggers: []
- type: retail_resume
  target: retail_repairs
  mutation:
    transition:
      from: awaiting_approval
      to: in_repair
  meaning: The approval is answered or lapses and work resumes.
  grain: One transition per approval request.
  fields:
    status: Becomes in_repair.
  triggers: []
- type: retail_ready
  target: retail_repairs
  mutation:
    transition:
      from: in_repair
      to: ready
  meaning: Final inspection is passed and the ready notice is sent.
  grain: One transition per repair order.
  fields:
    status: Becomes ready.
    ready_date: Ready date.
  triggers:
  - event: rental:rental_repair_notice
    map:
      retail_repair_id: retail_repair_id
      notice_type: vehicle_ready
      event_date: ready_date
- type: retail_deliver
  target: retail_repairs
  mutation:
    transition:
      from: ready
      to: delivered
  meaning: The vehicle is released to the customer.
  grain: One transition per repair order.
  fields:
    status: Becomes delivered.
    delivered_date: Release date.
  triggers:
  - event: warranty:warranty_issue
    map:
      retail_repair_id: retail_repair_id
      customer_id: customer_id
      vehicle_id: vehicle_id
      issued_date: delivered_date
- type: retail_close
  target: retail_repairs
  mutation:
    transition:
    - from: delivered
      to: closed
    - from: cancelled
      to: closed
  meaning: The repair order is closed with nothing owed.
  grain: One transition per repair order.
  fields:
    status: Becomes closed.
    closed_date: Closing date.
  triggers: []
- type: retail_cancel
  target: retail_repairs
  mutation:
    transition:
    - from: opened
      to: cancelled
    - from: in_repair
      to: cancelled
    - from: awaiting_approval
      to: cancelled
  meaning: The customer cancels the job.
  grain: One transition per repair order.
  fields:
    status: Becomes cancelled.
    cancelled_date: Cancellation date.
  triggers:
  - event: rental:rental_repair_notice
    map:
      retail_repair_id: retail_repair_id
      notice_type: repair_cancelled
      event_date: cancelled_date
- type: retail_charge
  target: retail_ledger
  meaning: An amount the customer owes is booked.
  grain: One row per charge type per approval (or per storage period, or per parts order).
  distinguish_by:
  - charge_type
  - approval_id
  - parts_event_id
  - period_start_date
  fields:
    entry_date: Charge date.
    charge_type: quoted_work, additional_work, restocking, non_returnable_parts, work_performed or storage.
    amount_usd: Charge amount (positive).
    approval_id: Approved additional-work request charged; empty otherwise.
    parts_event_id: Parts order a restocking or non-returnable charge arises from; empty otherwise.
    period_start_date: First billed storage day; empty otherwise.
    period_end_date: Last billed storage day; empty otherwise.
  account: retail_balance
  direction: in
  triggers: []
- type: retail_credit
  target: retail_ledger
  meaning: 'A charge is reduced: the discount program, a billing correction or goodwill.'
  grain: One row per credit reason per charge.
  distinguish_by:
  - source_entry_id
  - credit_reason
  fields:
    entry_date: Credit date.
    source_entry_id: The retail_charge row credited.
    credit_reason: discount, billing_error or goodwill.
    amount_usd: Amount credited (positive).
  account: retail_balance
  direction: out
  triggers: []
- type: retail_payment
  target: retail_ledger
  meaning: The customer pays a deposit, the balance, or a fleet invoice.
  grain: One row per payment.
  distinguish_by:
  - entry_date
  - payment_kind
  - payment_method
  - amount_usd
  fields:
    entry_date: Payment date.
    payment_kind: deposit, balance or fleet_invoice.
    payment_method: card, ach, cash, check or financing.
    amount_usd: Amount paid (positive).
  account: retail_balance
  direction: out
  triggers: []
- type: retail_refund
  target: retail_ledger
  meaning: A deposit or overpayment is returned to its original method.
  grain: One row per refunded payment.
  distinguish_by:
  - source_entry_id
  fields:
    entry_date: Refund date.
    source_entry_id: The retail_payment row refunded.
    amount_usd: Amount refunded (positive).
    payment_method: Method refunded to.
  account: retail_balance
  direction: in
  triggers: []
- type: retail_parts_order
  target: retail_parts
  meaning: Parts for the job are ordered from a supplier.
  grain: One row per supplier parts order.
  distinguish_by:
  - parts_order_number
  fields:
    event_date: Order date.
    parts_order_number: Supplier order number, verbatim.
    parts_amount_usd: Cost of the parts ordered as quoted to the customer.
    parts_returnable: Whether the supplier takes the parts back.
  triggers: []
- type: retail_parts_return
  target: retail_parts
  meaning: Returnable parts of a cancelled job are sent back to the supplier.
  grain: One row per returned parts order.
  distinguish_by:
  - source_parts_event_id
  fields:
    event_date: Return date.
    source_parts_event_id: The retail_parts_order row returned.
    parts_amount_usd: Parts amount returned.
  triggers:
  - event: retail:retail_charge
    map:
      charge_type: restocking
      entry_date: event_date
measures:
- id: retail_msr_balance
  window: Life of the repair order.
  measure: Sum of retail_balance in-entries (charges, refunds) minus out-entries (credits, payments).
- id: retail_msr_approved_additions_total
  window: Life of the repair order.
  measure: Sum of amount_usd of retail_charge rows with charge_type additional_work.
- id: retail_msr_goodwill_credited
  window: Life of the repair order.
  measure: Sum of amount_usd of retail_credit rows with credit_reason goodwill.
- id: retail_msr_returning_customer
  window: returning_customer_lookback_months calendar months ending on the opening date.
  measure: Count of the customer's claim_repairs and retail_repairs whose delivered_date falls in the window.
policies:
- id: retail_agg_multi_holding
  subject:
  - retail_open
  rule: A customer, individual or fleet, may hold any number of customer-pay repair orders across vehicles; there
    is no customer-level cap. The per-vehicle limit and the exclusion with insurance claim repairs are set by retail_agg_vehicle_exclusivity.
  eligibility: []
  params:
    max_per_customer: null
- id: retail_agg_vehicle_exclusivity
  subject:
  - retail_open
  rule: A vehicle may have at most max_open_repairs_per_vehicle open customer-pay repair order, where open means
    any status other than closed or cancelled. The vehicle has no open customer-pay repair order and no open insurance
    claim repair order. An insurance claim repair order is open in any status other than closed, cancelled or total_loss.
    Customer-pay work wanted on a vehicle that is in an open claim repair is added to that claim repair order as
    a customer-pay addition, never opened here; work wanted on a vehicle with an open customer-pay repair order
    is handled as additional work on it.
  eligibility:
  - id: vehicle_free_of_open_repairs
    applies_to:
    - retail_open
    kind: dedup
    condition: The vehicle has no open customer-pay repair order and no open insurance claim repair order.
    evidence_fields:
    - retail_repairs.vehicle_id
    - retail_repairs.status
    - claim_repairs.vehicle_id
    - claim_repairs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - retail_repairs.vehicle_id
      - - claim_repairs.vehicle_id
      action_bindings:
        retail_repairs.vehicle_id: vehicle_id
        claim_repairs.vehicle_id: vehicle_id
    dedup_contract:
      table: retail_repairs
      mode: separate_record
      object_bindings:
        vehicle_id: vehicle_id
      duplicate_filters:
        status:
        - opened
        - in_repair
        - awaiting_approval
        - ready
        - delivered
      distinct_fields:
      - retail_repair_id
  params:
    per_tier:
      Paintless Dent Repair Service:
        max_open_repairs_per_vehicle: =max_open_repairs_per_vehicle
      Cosmetic Touch-Up Service:
        max_open_repairs_per_vehicle: =max_open_repairs_per_vehicle
      Bumper Refinish Service:
        max_open_repairs_per_vehicle: =max_open_repairs_per_vehicle
      Panel Repair Service:
        max_open_repairs_per_vehicle: =max_open_repairs_per_vehicle
      Customer-Pay Collision Service:
        max_open_repairs_per_vehicle: =max_open_repairs_per_vehicle
      Complete Refinish Service:
        max_open_repairs_per_vehicle: =max_open_repairs_per_vehicle
- id: retail_scope_and_quote
  subject:
  - retail_open
  rule: 'The tier must fit the quoted scope: no more than max_panels panels (0 means no ceiling), no more than max_labor_hours
    quoted labor hours (0.0 means no ceiling), structural operations only where structural_work_allowed is true,
    and for Paintless Dent Repair Service no more than max_dents_per_visit dents. The quote is priced from the estimate
    at the tier''s rates: labor at labor_rate_usd, refinish at refinish_labor_rate_usd plus paint_materials_rate_usd
    per refinish hour, shop supplies at shop_supplies_pct of labor capped at shop_supplies_cap_usd, plus hazardous_waste_fee_usd
    and the quoted parts at default_part_type unless the customer chose otherwise; Paintless Dent Repair Service
    is priced pdr_first_dent_price_usd for the first dent and pdr_additional_dent_price_usd for each further dent.
    A quote below min_job_charge_usd is raised to it, and mobile_service_fee_usd is added where the work is done
    at the customer''s location (only where mobile_service_available is true). The quoted price is honored when
    the repair order opens no later than quote_price_hold_days after the estimate written date. Days are calendar
    days counted from the estimate written date as day zero; opening on the last day of the hold keeps the quoted
    price. Customer-supplied parts are installed only where customer_supplied_parts_accepted is true, with customer_supplied_parts_handling_pct
    added to their installation labor, and they are excluded from the workmanship warranty.'
  eligibility:
  - id: within_price_hold
    applies_to:
    - retail_open
    kind: time
    condition: The quoted price is honored when the repair order opens no later than quote_price_hold_days after
      the estimate written date.
    evidence_fields:
    - estimate_bookings.estimate_written_date
    - estimate_bookings.booking_id
    evidence_contract:
