- id: warranty_evt_chip_redemption
  subject:
  - warranty_redeem
  rule: 'A Chip Repair Guarantee is redeemed once: on the completion date of the network windshield replacement
    that used its chip_credit, the coverage moves to redeemed and cannot be used again. A guarantee whose concern
    was not covered, or whose windshield was replaced outside the network, is not redeemed.'
  eligibility: []
  params:
    per_tier:
      Chip Repair Guarantee:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
      Calibration Workmanship Warranty:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
      Cosmetic Repair Workmanship Warranty:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
      Glass Installation Lifetime Warranty:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
      Collision Lifetime Workmanship Warranty:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
      Certified Structural Lifetime Warranty:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
- id: warranty_evt_diagnostic_fee
  subject:
  - warranty_charge
  - warranty_charge_payment
  - warranty_charge_waiver
  rule: An inspection that finds a concern not covered posts a diagnostic charge of diagnostic_fee_usd only when
    the concern type is in the plan's diagnostic_fee_concern_types; every other inspection is free, covered or not.
    The customer pays it by card, cash or check. A charge that is already paid or waived in full takes no further
    payment or waiver. A billing_error waiver removes a charge posted against the rule above; a goodwill waiver
    is limited to diagnostic_waiver_authority_usd per charge, and a request beyond it is declined at the desk.
  eligibility:
  - id: charge_open
    applies_to:
    - warranty_charge_payment
    - warranty_charge_waiver
    kind: dedup
    condition: A charge that is already paid or waived in full takes no further payment or waiver.
    evidence_fields:
    - warranty_ledger.source_entry_id
    - warranty_ledger.event_type
    - warranty_ledger.amount_usd
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_ledger.source_entry_id
      action_bindings:
        warranty_ledger.source_entry_id: source_entry_id
    dedup_contract:
      table: warranty_ledger
      mode: separate_record
      object_bindings:
        source_entry_id: source_entry_id
      duplicate_filters:
        event_type:
        - warranty_charge_payment
        - warranty_charge_waiver
      distinct_fields:
      - entry_date
      - amount_usd
  params:
    per_tier:
      Chip Repair Guarantee:
        diagnostic_fee_usd: =diagnostic_fee_usd
        diagnostic_fee_concern_types: =diagnostic_fee_concern_types
        diagnostic_waiver_authority_usd: =diagnostic_waiver_authority_usd
      Calibration Workmanship Warranty:
        diagnostic_fee_usd: =diagnostic_fee_usd
        diagnostic_fee_concern_types: =diagnostic_fee_concern_types
        diagnostic_waiver_authority_usd: =diagnostic_waiver_authority_usd
      Cosmetic Repair Workmanship Warranty:
        diagnostic_fee_usd: =diagnostic_fee_usd
        diagnostic_fee_concern_types: =diagnostic_fee_concern_types
        diagnostic_waiver_authority_usd: =diagnostic_waiver_authority_usd
      Glass Installation Lifetime Warranty:
        diagnostic_fee_usd: =diagnostic_fee_usd
        diagnostic_fee_concern_types: =diagnostic_fee_concern_types
        diagnostic_waiver_authority_usd: =diagnostic_waiver_authority_usd
      Collision Lifetime Workmanship Warranty:
        diagnostic_fee_usd: =diagnostic_fee_usd
        diagnostic_fee_concern_types: =diagnostic_fee_concern_types
        diagnostic_waiver_authority_usd: =diagnostic_waiver_authority_usd
      Certified Structural Lifetime Warranty:
        diagnostic_fee_usd: =diagnostic_fee_usd
