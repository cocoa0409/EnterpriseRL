events:
- type: claim_open
  target: claim_repairs
  mutation: create
  meaning: A repair order is opened for an insurance claim, from a converted estimate or an insurer assignment.
  grain: One row per repair order.
  fields:
    claim_repair_id: Repair order reference.
    customer_id: Vehicle owner.
    vehicle_id: Vehicle being repaired.
    booking_id: Estimate booking the repair order came from; empty for a direct insurer assignment.
    insurer_customer_id: Insurer account paying the claim.
    carrier_agreement_id: The insurer's program agreement with the network; empty when the insurer has none.
    insurer_claim_number: Insurer claim number, verbatim.
    coverage_type: Coverage the claim is paid under.
    deductible_usd: Deductible stated by the insurer for this claim.
    variant_name: Repair class assigned.
    opened_date: Date the repair order was opened.
    original_estimate_usd: Estimate total submitted for authorization.
    estimated_labor_hours: Labor hours on that estimate.
  triggers: []
- type: claim_authorize
  target: claim_repairs
  mutation:
    transition:
      from: assigned
      to: authorized
  meaning: The insurer's authorization of the repair estimate is recorded.
  grain: One transition per repair order.
  fields:
    status: Becomes authorized.
    authorized_date: Date the authorization was received.
    estimated_repair_days: Planned repair days computed at authorization.
  triggers:
  - event: claim:claim_insurer_approval
    map:
      approval_type: original_estimate
      entry_date: authorized_date
- type: claim_start_repair
  target: claim_repairs
  mutation:
    transition:
      from: authorized
      to: in_repair
  meaning: The vehicle is dropped off and production starts.
  grain: One transition per repair order.
  fields:
    status: Becomes in_repair.
    repair_started_date: Drop-off date.
    odometer_in: Odometer at drop-off.
  triggers: []
- type: claim_hold
  target: claim_repairs
  mutation:
    transition:
      from: in_repair
      to: on_hold
  meaning: Work stops pending a supplement decision or a back-ordered part.
  grain: One transition per hold.
  fields:
    status: Becomes on_hold.
    hold_reason: supplement_pending or parts_delay.
  triggers: []
- type: claim_resume
  target: claim_repairs
  mutation:
    transition:
      from: on_hold
      to: in_repair
  meaning: The hold is cleared and work resumes.
  grain: One transition per hold.
  fields:
    status: Becomes in_repair.
    hold_reason: Cleared to empty.
  triggers: []
- type: claim_complete
  target: claim_repairs
  mutation:
    transition:
      from: in_repair
      to: repair_complete
  meaning: Final inspection is passed and the vehicle-ready notice goes to the customer, the insurer and the rental
    partner.
  grain: One transition per repair order.
  fields:
    status: Becomes repair_complete.
    completed_date: Vehicle-ready date.
  triggers:
  - event: rental:rental_repair_notice
    map:
      claim_repair_id: claim_repair_id
      notice_type: vehicle_ready
      event_date: completed_date
- type: claim_deliver
  target: claim_repairs
  mutation:
    transition:
      from: repair_complete
      to: delivered
  meaning: The vehicle is released to the customer.
  grain: One transition per repair order.
  fields:
    status: Becomes delivered.
    delivered_date: Release date.
  triggers:
  - event: warranty:warranty_issue
    map:
      claim_repair_id: claim_repair_id
      customer_id: customer_id
      vehicle_id: vehicle_id
      issued_date: delivered_date
- type: claim_close
  target: claim_repairs
  mutation:
    transition:
    - from: delivered
      to: closed
    - from: total_loss
      to: closed
  meaning: The repair order is closed once nothing is owed in either direction.
  grain: One transition per repair order.
  fields:
    status: Becomes closed.
    closed_date: Closing date.
  triggers: []
- type: claim_cancel
  target: claim_repairs
  mutation:
    transition:
    - from: assigned
      to: cancelled
    - from: authorized
      to: cancelled
  meaning: The customer withdraws the vehicle before work starts.
  grain: One transition per repair order.
  fields:
    status: Becomes cancelled.
    closed_date: Withdrawal date.
  triggers:
  - event: rental:rental_repair_notice
    map:
      claim_repair_id: claim_repair_id
      notice_type: repair_cancelled
      event_date: closed_date
- type: claim_total_loss
  target: claim_repairs
  mutation:
    transition:
    - from: assigned
      to: total_loss
    - from: authorized
      to: total_loss
    - from: in_repair
      to: total_loss
    - from: on_hold
      to: total_loss
  meaning: The insurer declares the vehicle a total loss.
  grain: One transition per repair order.
  fields:
    status: Becomes total_loss.
    total_loss_date: Date the insurer's determination was received.
  triggers:
  - event: rental:rental_repair_notice
    map:
      claim_repair_id: claim_repair_id
      notice_type: total_loss
      event_date: total_loss_date
- type: claim_supplement_submit
  target: claim_supplements
  meaning: A supplement for damage found after the original estimate is written and submitted.
  grain: One row per supplement on a repair order.
  distinguish_by:
  - supplement_number
  fields:
    event_date: Submission date.
    supplement_number: Ordinal of the supplement on the repair order (1 for the first).
    supplement_amount_usd: Gross amount of the supplement.
    supplement_labor_hours: Labor hours added by the supplement.
    includes_structural: Whether it adds structural operations.
    includes_calibration: Whether it adds sensor calibrations.
    betterment_usd: Betterment the insurer is expected to apply to wear parts on the supplement, from the estimate.
    approval_route: self_approved, desk_review or field_reinspection.
  triggers:
  - event: claim:claim_supplement_decision
    when:
      approval_route: self_approved
    map:
      supplement_number: supplement_number
      approval_route: approval_route
      decision: approved
      approved_amount_usd: supplement_amount_usd
      betterment_usd: betterment_usd
- type: claim_supplement_decision
  target: claim_supplements
  meaning: A supplement is approved, partly approved or denied.
  grain: One row per decided supplement.
  distinguish_by:
  - supplement_number
  fields:
    event_date: Decision date.
    supplement_number: Supplement decided.
    submission_event_id: The claim_supplement_submit row decided.
    approval_route: Route the supplement went through.
    decision: approved, partially_approved or denied.
    approved_amount_usd: Amount approved (0.00 when denied).
    betterment_usd: Betterment the insurer applied on the approved lines.
  triggers:
  - event: claim:claim_insurer_approval
    when:
      decision:
      - approved
      - partially_approved
    map:
      approval_type: supplement
      supplement_number: supplement_number
      amount_usd: approved_amount_usd
      betterment_usd: betterment_usd
      entry_date: event_date
- type: claim_insurer_approval
  target: claim_ledger
  meaning: 'An amount the insurer agreed to pay is booked: the original estimate, an approved supplement, or total-loss
    charges.'
  grain: One row per approval.
  distinguish_by:
  - approval_type
  - supplement_number
  fields:
    entry_date: Approval date.
    approval_type: original_estimate, supplement or total_loss_charges.
    supplement_number: Supplement approved; 0 for other approval types.
    amount_usd: Gross approved amount.
    betterment_usd: Betterment the insurer applied within the approval.
  account: insurer_balance
  direction: in
  triggers: []
- type: claim_customer_charge
  target: claim_ledger
  meaning: An amount the customer owes is booked on the repair order.
  grain: One row per charge type per supplement (or per storage period).
  distinguish_by:
  - charge_type
  - supplement_number
  - period_start_date
  fields:
    entry_date: Charge date.
    charge_type: deductible, betterment, customer_pay_upgrade, unrelated_damage, withdrawal_teardown or storage.
    supplement_number: Supplement the charge arises from; 0 when it arises from the original estimate or is not
      supplement-related.
    amount_usd: Charge amount (positive).
    period_start_date: First billed storage day; empty for other charge types.
    period_end_date: Last billed storage day; empty for other charge types.
    consent_id: Signed customer consent the charge rests on, for customer_pay_upgrade and unrelated_damage; empty
      otherwise.
  account: customer_responsibility
  direction: in
  triggers:
  - event: claim:claim_insurer_offset
    when:
      charge_type:
      - deductible
      - betterment
    map:
      charge_type: charge_type
      amount_usd: amount_usd
      entry_date: entry_date
- type: claim_insurer_offset
  target: claim_ledger
  meaning: The customer's share of an approved amount (deductible or betterment) is taken off what the insurer owes.
  grain: One row per deductible or betterment charge.
  distinguish_by:
  - source_entry_id
  fields:
    entry_date: Offset date.
    charge_type: deductible or betterment.
    amount_usd: Amount offset (positive).
    source_entry_id: The claim_customer_charge row mirrored.
  account: insurer_balance
  direction: out
  triggers: []
- type: claim_customer_payment
  target: claim_ledger
  meaning: The customer pays toward the repair order balance.
  grain: One row per payment.
  distinguish_by:
  - entry_date
  - payment_method
  - amount_usd
  fields:
    entry_date: Payment date.
    payment_method: card, ach, cash, check or financing.
    amount_usd: Amount paid (positive).
  account: customer_responsibility
  direction: out
  triggers: []
- type: claim_customer_refund
  target: claim_ledger
  meaning: An overpayment is returned to the customer's original payment method.
  grain: One row per refunded payment.
  distinguish_by:
  - source_entry_id
  fields:
    entry_date: Refund date.
    source_entry_id: The claim_customer_payment row refunded.
    amount_usd: Amount refunded (positive).
    payment_method: Method refunded to (same as the payment).
  account: customer_responsibility
  direction: in
  triggers: []
- type: claim_customer_credit
  target: claim_ledger
  meaning: A customer charge is reduced or reversed.
  grain: One row per credit reason per charge.
  distinguish_by:
  - source_entry_id
  - credit_reason
  fields:
    entry_date: Credit date.
    source_entry_id: The claim_customer_charge row credited.
    credit_reason: billing_error, addition_withdrawn, repair_withdrawn, total_loss_release or goodwill.
    amount_usd: Amount credited (positive).
  account: customer_responsibility
  direction: out
  triggers: []
- type: claim_insurer_payment
  target: claim_ledger
  meaning: The insurer pays toward the repair order.
  grain: One row per insurer remittance.
  distinguish_by:
  - payment_reference
  fields:
    entry_date: Date the funds were received.
    payment_reference: Insurer check or EFT reference, verbatim.
    amount_usd: Amount received (positive).
  account: insurer_balance
  direction: out
  triggers: []
- type: claim_insurer_adjustment
  target: claim_ledger
  meaning: 'What the insurer owes is reduced without payment: a total-loss reversal of repair approvals, a billing
    correction, or a written-off short pay.'
  grain: One row per adjustment reason per source entry.
  distinguish_by:
  - source_entry_id
  - adjustment_reason
  fields:
    entry_date: Adjustment date.
    source_entry_id: The ledger entry adjusted (an approval, or the remittance that short-paid).
    adjustment_reason: total_loss_reversal, withdrawal_reversal, billing_error or short_pay_writeoff.
    amount_usd: Amount adjusted (positive).
  account: insurer_balance
  direction: out
  triggers: []
measures:
- id: claim_msr_supplement_count
  window: Life of the repair order.
  measure: Count of claim_supplement_submit rows on the repair order.
- id: claim_msr_prior_supplements_total
  window: Life of the repair order, up to but excluding the supplement being routed.
  measure: Sum of supplement_amount_usd over earlier claim_supplement_submit rows on the repair order.
- id: claim_msr_authorized_total
  window: Life of the repair order.
  measure: Sum of amount_usd of claim_insurer_approval rows with approval_type original_estimate or supplement,
    minus total_loss_reversal and withdrawal_reversal adjustments.
- id: claim_msr_deductible_assessed
  window: Life of the repair order.
  measure: Sum of amount_usd of claim_customer_charge rows with charge_type deductible, minus claim_customer_credit
    rows that credit them.
- id: claim_msr_customer_balance
  window: Life of the repair order.
  measure: Sum of customer_responsibility in-entries (charges, refunds) minus out-entries (payments, credits).
- id: claim_msr_insurer_balance
  window: Life of the repair order.
  measure: Sum of insurer_balance in-entries (approvals) minus out-entries (offsets, payments, adjustments).
- id: claim_msr_unrelated_hours
  window: Life of the repair order.
  measure: Sum of the labor hours on signed unrelated_damage consents of the repair order.
- id: claim_msr_goodwill_credited
  window: Life of the repair order.
  measure: Sum of amount_usd of claim_customer_credit rows with credit_reason goodwill.
policies:
- id: claim_agg_multi_holding
  subject:
  - claim_open
  rule: A customer may hold any number of insurance claim repair orders, across vehicles and claims; there is no
    customer-level cap. The limit per claim and vehicle is set by claim_agg_one_open_per_claim.
  eligibility: []
  params:
    max_per_customer: null
- id: claim_agg_one_open_per_claim
  subject:
  - claim_open
  rule: One insurer claim number may have at most max_open_repairs_per_claim open repair order on one vehicle, where
    open means any status other than closed, cancelled or total_loss. No open repair order exists for the same vehicle
    and insurer claim number. Further damage found on the same claim is handled as a supplement on the open repair
    order, never as a second repair order. A customer-pay repair is never opened for a vehicle with an open claim
    repair order; customer-pay work on that vehicle is added to the claim repair order under claim_evt_customer_pay_additions.
  eligibility:
  - id: no_open_repair_for_claim
    applies_to:
    - claim_open
    kind: dedup
    condition: No open repair order exists for the same vehicle and insurer claim number.
    evidence_fields:
    - claim_repairs.vehicle_id
    - claim_repairs.insurer_claim_number
    - claim_repairs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_repairs.vehicle_id
        - claim_repairs.insurer_claim_number
      action_bindings:
        claim_repairs.vehicle_id: vehicle_id
        claim_repairs.insurer_claim_number: insurer_claim_number
    dedup_contract:
      table: claim_repairs
      mode: separate_record
      object_bindings:
        vehicle_id: vehicle_id
        insurer_claim_number: insurer_claim_number
      duplicate_filters:
        status:
        - assigned
        - authorized
        - in_repair
        - on_hold
        - repair_complete
        - delivered
      distinct_fields:
      - claim_repair_id
  params:
    per_tier:
      Express Claim Repair:
        max_open_repairs_per_claim: =max_open_repairs_per_claim
      Standard Claim Repair:
        max_open_repairs_per_claim: =max_open_repairs_per_claim
      Major Claim Repair:
        max_open_repairs_per_claim: =max_open_repairs_per_claim
      Structural Claim Repair:
        max_open_repairs_per_claim: =max_open_repairs_per_claim
      Certified Structural Claim Repair:
        max_open_repairs_per_claim: =max_open_repairs_per_claim
      Aluminum Certified Structural Claim Repair:
        max_open_repairs_per_claim: =max_open_repairs_per_claim
- id: claim_repair_class_assignment
  subject:
  - claim_open
  rule: 'The repair class is assigned once, when the repair order opens, from the estimate submitted for authorization
    and the vehicle record, and is not changed by later supplements. A repair with structural operations takes the
    structural class matching vehicles.body_structure: Aluminum Certified Structural Claim Repair for aluminum_intensive,
    Certified Structural Claim Repair for mixed_material, and Structural Claim Repair for steel_unibody or body_on_frame.
    A repair without structural operations takes Express Claim Repair when its estimated labor hours are within
    the Express labor_hours_ceiling and the vehicle was drivable at the estimate, Standard Claim Repair when they
    are within the Standard ceiling, and Major Claim Repair otherwise. The class fixes every per-class parameter
    of this charter, including the warranty plan issued at delivery (warranty_plan_issued). The insurer''s deductible,
    coverage type and claim number are taken from the insurer''s assignment exactly as stated and are never altered
    by the desk. The repair class applies only where structural_operations_allowed, oem_certified_procedures_required
    and aluminum_dedicated_bay_required can be met by the assigned center; the desk never downgrades a class to
    fit a center.'
  eligibility: []
  params:
    per_tier:
      Express Claim Repair:
        labor_hours_ceiling: =labor_hours_ceiling
        structural_operations_allowed: =structural_operations_allowed
        oem_certified_procedures_required: =oem_certified_procedures_required
        aluminum_dedicated_bay_required: =aluminum_dedicated_bay_required
        warranty_plan_issued: =warranty_plan_issued
      Standard Claim Repair:
        labor_hours_ceiling: =labor_hours_ceiling
        structural_operations_allowed: =structural_operations_allowed
        oem_certified_procedures_required: =oem_certified_procedures_required
        aluminum_dedicated_bay_required: =aluminum_dedicated_bay_required
        warranty_plan_issued: =warranty_plan_issued
      Major Claim Repair:
        labor_hours_ceiling: =labor_hours_ceiling
        structural_operations_allowed: =structural_operations_allowed
        oem_certified_procedures_required: =oem_certified_procedures_required
        aluminum_dedicated_bay_required: =aluminum_dedicated_bay_required
        warranty_plan_issued: =warranty_plan_issued
      Structural Claim Repair:
        labor_hours_ceiling: =labor_hours_ceiling
        structural_operations_allowed: =structural_operations_allowed
        oem_certified_procedures_required: =oem_certified_procedures_required
        aluminum_dedicated_bay_required: =aluminum_dedicated_bay_required
        warranty_plan_issued: =warranty_plan_issued
      Certified Structural Claim Repair:
        labor_hours_ceiling: =labor_hours_ceiling
        structural_operations_allowed: =structural_operations_allowed
        oem_certified_procedures_required: =oem_certified_procedures_required
        aluminum_dedicated_bay_required: =aluminum_dedicated_bay_required
        warranty_plan_issued: =warranty_plan_issued
      Aluminum Certified Structural Claim Repair:
        labor_hours_ceiling: =labor_hours_ceiling
        structural_operations_allowed: =structural_operations_allowed
        oem_certified_procedures_required: =oem_certified_procedures_required
        aluminum_dedicated_bay_required: =aluminum_dedicated_bay_required
        warranty_plan_issued: =warranty_plan_issued
- id: claim_evt_authorization
  subject:
  - claim_authorize
  - claim_insurer_approval
  rule: 'A repair order is authorized when the insurer approves the original estimate. The customer''s repair authorization
    and direction-to-pay consents on the repair order are signed. Without both signatures the authorization is not
    recorded, even if the insurer has approved. For an insurer whose carrier agreement is a direct-repair tier,
    the route is the class''s authorization_route; for an insurer with no carrier agreement or a Network Referral
    Agreement, the route is always field_appraisal by the insurer''s own appraiser. The insurer is asked to respond
    within authorization_response_business_days business days. On authorization the original estimate is booked
    as an insurer approval of type original_estimate for original_estimate_usd with the insurer''s betterment, and
    the planned repair days are computed: production days are the estimated labor hours divided by labor_hours_per_production_day,
    rounded up to the next whole day, plus intake_delivery_days. Supplements are approved under claim_evt_supplement_decision
    and total-loss charges under claim_evt_total_loss; no other approval type exists.'
  eligibility:
  - id: consents_signed
    applies_to:
    - claim_authorize
    kind: authorization
    condition: The customer's repair authorization and direction-to-pay consents on the repair order are signed.
    evidence_fields:
    - claim_consents.claim_repair_id
    - claim_consents.consent_type
    - claim_consents.consent_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_consents.claim_repair_id
      action_bindings:
        claim_consents.claim_repair_id: claim_repair_id
  params:
    per_tier:
      Express Claim Repair:
        authorization_route: =authorization_route
        authorization_response_business_days: =authorization_response_business_days
        labor_hours_per_production_day: =labor_hours_per_production_day
        intake_delivery_days: =intake_delivery_days
      Standard Claim Repair:
        authorization_route: =authorization_route
        authorization_response_business_days: =authorization_response_business_days
        labor_hours_per_production_day: =labor_hours_per_production_day
        intake_delivery_days: =intake_delivery_days
      Major Claim Repair:
        authorization_route: =authorization_route
        authorization_response_business_days: =authorization_response_business_days
        labor_hours_per_production_day: =labor_hours_per_production_day
        intake_delivery_days: =intake_delivery_days
      Structural Claim Repair:
        authorization_route: =authorization_route
        authorization_response_business_days: =authorization_response_business_days
        labor_hours_per_production_day: =labor_hours_per_production_day
        intake_delivery_days: =intake_delivery_days
      Certified Structural Claim Repair:
        authorization_route: =authorization_route
        authorization_response_business_days: =authorization_response_business_days
        labor_hours_per_production_day: =labor_hours_per_production_day
        intake_delivery_days: =intake_delivery_days
      Aluminum Certified Structural Claim Repair:
        authorization_route: =authorization_route
        authorization_response_business_days: =authorization_response_business_days
        labor_hours_per_production_day: =labor_hours_per_production_day
        intake_delivery_days: =intake_delivery_days
  formula:
    production_days: estimated_labor_hours / labor_hours_per_production_day
    estimated_repair_days: round(production_days + 0.4999) + intake_delivery_days
- id: claim_evt_deductible_betterment
  subject:
  - claim_customer_charge
  - claim_insurer_offset
  rule: The customer's share of an insured repair is the deductible plus betterment. For coverage_type collision,
    comprehensive or uninsured_motorist_property_damage, a deductible charge posts on the authorization date for
    the lesser of deductible_usd and the original estimate; when a later approved supplement raises the authorized
    total while the deductible assessed (claim_msr_deductible_assessed) is still below deductible_usd, a further
    deductible charge for the lesser of the remaining deductible and the supplement's approved amount posts with
    that supplement_number. A third_party_liability claim carries no deductible. Betterment posts as its own charge
    for the betterment_usd the insurer applied within each approval. Every deductible and betterment charge is mirrored
    by an insurer offset of the same amount. The deductible is owed by the deductible_collection_point and is never
    waived, reduced, discounted, absorbed or rebated by the network, in cash or in kind; a request to do so is refused.
  eligibility: []
  params:
    per_tier:
      Express Claim Repair:
        deductible_collection_point: =deductible_collection_point
      Standard Claim Repair:
        deductible_collection_point: =deductible_collection_point
      Major Claim Repair:
        deductible_collection_point: =deductible_collection_point
      Structural Claim Repair:
        deductible_collection_point: =deductible_collection_point
      Certified Structural Claim Repair:
        deductible_collection_point: =deductible_collection_point
      Aluminum Certified Structural Claim Repair:
        deductible_collection_point: =deductible_collection_point
  formula:
    when: charge_type == 'deductible'
    deductible_due: max(0, min(deductible_usd, claim_msr_authorized_total) - claim_msr_deductible_assessed)
  measures:
  - claim_msr_deductible_assessed
  - claim_msr_authorized_total
- id: claim_evt_supplement_routing
  subject:
  - claim_supplement_submit
  - claim_hold
  rule: A supplement may be submitted while work has not finished. The repair order is in authorized, in_repair
    or on_hold status. Each supplement attaches supplement_photos_required photos and takes the next supplement_number.
    The route is decided at submission, in this order. Field reinspection applies when the supplement_number exceeds
    max_supplements_before_reinspection, or when the cumulative supplements including this one (claim_msr_prior_supplements_total
    plus supplement_amount_usd) exceed supplement_variance_reinspection_pct percent of original_estimate_usd. Otherwise
    self-approval applies when the class's supplement_self_approval_allowed is true, the supplement adds no structural
    operations, the insurer's carrier agreement is active and grants a supplement self-approval limit above zero
    (carrier_self_approval_limit_usd), and supplement_amount_usd is at or below that limit. Every other supplement
    goes to desk_review. A supplement routed to desk_review or field_reinspection puts a repair order that is in
    repair on hold with hold_reason supplement_pending; a back-order longer than parts_delay_hold_business_days
    business days puts it on hold with hold_reason parts_delay, and the customer and insurer are told within delay_notice_business_days
    business days.
  eligibility:
  - id: work_not_finished
    applies_to:
    - claim_supplement_submit
    kind: state
    condition: The repair order is in authorized, in_repair or on_hold status.
    evidence_fields:
    - claim_repairs.status
    - claim_repairs.claim_repair_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_repairs.claim_repair_id
      action_bindings:
        claim_repairs.claim_repair_id: claim_repair_id
    state_contract:
      field: claim_repairs.status
      allowed:
      - authorized
      - in_repair
      - on_hold
  params:
    carrier_self_approval_limit_usd: carrier.supplement_self_approval_limit_usd of the insurer's active carrier
      agreement tier; 0 when there is none
    per_tier:
      Express Claim Repair:
        supplement_photos_required: =supplement_photos_required
        max_supplements_before_reinspection: =max_supplements_before_reinspection
        supplement_variance_reinspection_pct: =supplement_variance_reinspection_pct
        supplement_self_approval_allowed: =supplement_self_approval_allowed
        parts_delay_hold_business_days: =parts_delay_hold_business_days
        delay_notice_business_days: =delay_notice_business_days
      Standard Claim Repair:
        supplement_photos_required: =supplement_photos_required
        max_supplements_before_reinspection: =max_supplements_before_reinspection
        supplement_variance_reinspection_pct: =supplement_variance_reinspection_pct
        supplement_self_approval_allowed: =supplement_self_approval_allowed
        parts_delay_hold_business_days: =parts_delay_hold_business_days
        delay_notice_business_days: =delay_notice_business_days
      Major Claim Repair:
        supplement_photos_required: =supplement_photos_required
        max_supplements_before_reinspection: =max_supplements_before_reinspection
        supplement_variance_reinspection_pct: =supplement_variance_reinspection_pct
        supplement_self_approval_allowed: =supplement_self_approval_allowed
        parts_delay_hold_business_days: =parts_delay_hold_business_days
        delay_notice_business_days: =delay_notice_business_days
      Structural Claim Repair:
        supplement_photos_required: =supplement_photos_required
        max_supplements_before_reinspection: =max_supplements_before_reinspection
        supplement_variance_reinspection_pct: =supplement_variance_reinspection_pct
        supplement_self_approval_allowed: =supplement_self_approval_allowed
        parts_delay_hold_business_days: =parts_delay_hold_business_days
        delay_notice_business_days: =delay_notice_business_days
      Certified Structural Claim Repair:
        supplement_photos_required: =supplement_photos_required
        max_supplements_before_reinspection: =max_supplements_before_reinspection
        supplement_variance_reinspection_pct: =supplement_variance_reinspection_pct
        supplement_self_approval_allowed: =supplement_self_approval_allowed
        parts_delay_hold_business_days: =parts_delay_hold_business_days
        delay_notice_business_days: =delay_notice_business_days
      Aluminum Certified Structural Claim Repair:
        supplement_photos_required: =supplement_photos_required
        max_supplements_before_reinspection: =max_supplements_before_reinspection
        supplement_variance_reinspection_pct: =supplement_variance_reinspection_pct
        supplement_self_approval_allowed: =supplement_self_approval_allowed
        parts_delay_hold_business_days: =parts_delay_hold_business_days
        delay_notice_business_days: =delay_notice_business_days
  formula:
    cumulative_pct: (claim_msr_prior_supplements_total + supplement_amount_usd) / original_estimate_usd * 100
    to_reinspection: supplement_number > max_supplements_before_reinspection or cumulative_pct > supplement_variance_reinspection_pct
    to_self_approval: not to_reinspection and supplement_self_approval_allowed and not includes_structural and carrier_self_approval_limit_usd
      > 0 and supplement_amount_usd <= carrier_self_approval_limit_usd
  measures:
  - claim_msr_prior_supplements_total
  - claim_msr_supplement_count
- id: claim_evt_supplement_decision
  subject:
  - claim_supplement_decision
  - claim_resume
  rule: A self-approved supplement is approved in full on its submission date. A supplement on desk_review or field_reinspection
    is decided by the insurer, who is asked to decide within supplement_response_business_days business days; the
    decision recorded is the insurer's (approved, partially_approved or denied), never the desk's. The supplement
    being decided has been submitted and has no decision yet. An approved or partly approved supplement books an
    insurer approval of type supplement for approved_amount_usd with the insurer's betterment. A repair order on
    hold for that supplement resumes on the decision date. Denied operations are not performed unless the customer
    signs a customer_pay_addition consent for them under claim_evt_customer_pay_additions; a customer who disputes
    the denial is referred to their insurer.
  eligibility:
  - id: supplement_undecided
    applies_to:
    - claim_supplement_decision
    kind: dedup
    condition: The supplement being decided has been submitted and has no decision yet.
    evidence_fields:
    - claim_supplements.claim_repair_id
    - claim_supplements.supplement_number
    - claim_supplements.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_supplements.claim_repair_id
        - claim_supplements.supplement_number
      action_bindings:
        claim_supplements.claim_repair_id: claim_repair_id
        claim_supplements.supplement_number: supplement_number
    dedup_contract:
      table: claim_supplements
      mode: separate_record
      object_bindings:
        claim_repair_id: claim_repair_id
        supplement_number: supplement_number
      duplicate_filters:
        event_type:
        - claim_supplement_decision
      distinct_fields: []
  params:
    per_tier:
      Express Claim Repair:
        supplement_response_business_days: =supplement_response_business_days
      Standard Claim Repair:
        supplement_response_business_days: =supplement_response_business_days
      Major Claim Repair:
        supplement_response_business_days: =supplement_response_business_days
      Structural Claim Repair:
        supplement_response_business_days: =supplement_response_business_days
      Certified Structural Claim Repair:
        supplement_response_business_days: =supplement_response_business_days
      Aluminum Certified Structural Claim Repair:
