        total_loss_storage_daily_rate_usd: =total_loss_storage_daily_rate_usd
        total_loss_removal_free_days: =total_loss_removal_free_days
      Certified Structural Claim Repair:
        total_loss_teardown_hours: =total_loss_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        total_loss_storage_daily_rate_usd: =total_loss_storage_daily_rate_usd
        total_loss_removal_free_days: =total_loss_removal_free_days
      Aluminum Certified Structural Claim Repair:
        total_loss_teardown_hours: =total_loss_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        total_loss_storage_daily_rate_usd: =total_loss_storage_daily_rate_usd
        total_loss_removal_free_days: =total_loss_removal_free_days

extended_policies:
  - id: claim_ext_unrelated_addition_price
    base_policy_refs: [claim_evt_deductible_betterment, claim_evt_storage, claim_evt_customer_pay_additions, claim_evt_withdrawal]
    overwrite:
      - base_policy: claim_evt_customer_pay_additions
        superseded_clause: >-
          repair of damage unrelated to the claim (or of operations the insurer denied), charged at the amount on the
          written customer-pay estimate line
        replaced_by: >-
          The standard price is the consent's labor hours times the panel hourly rate, which covers body labor together
          with paint and materials, plus shop supplies at the supplies percentage of that work amount, plus the hazardous
          waste fee, rounded to the cent.
      - base_policy: claim_evt_customer_pay_additions
        superseded_clause: >-
          The customer's customer-pay addition consent for that amount is signed.
        replaced_by: >-
          The customer signs the customer-pay addition consent for the price this rule gives, and the addition is
          charged only for that signed price.
      - base_policy: claim_evt_storage
        superseded_clause: >-
          The vehicle is still at the center more than the tier's pickup free days after the vehicle-ready date.
        replaced_by: >-
          The pickup free days of a completed vehicle bear on storage charges alone and never on the price or the charge
          of a customer-pay addition.
    trigger: on_request
    subject: [claim_customer_charge]
    computes: amount_usd
    target_tool: sign_unrelated_damage_addition_ef94c675
    params:
      touchup_max_hours: 4.0
      touchup_hourly_usd: 96.0
      panel_hourly_usd: 104.0
      certified_hourly_usd: 112.0
      supplies_pct: 6
      supplies_cap_usd: 45.0
      waste_fee_usd: 6.95
      touchup_waste_fee_usd: 4.95
      returning_pct: 5
      long_returning_pct: 2
      returning_lookback_months: 24
      late_scan_credit_pct: 50
    rule: >
      An unrelated-damage addition is priced when its customer-pay addition consent is signed, from the labor hours
      written on that consent. The standard price is the consent's labor hours times the panel hourly rate, which covers
      body labor together with paint and materials, plus shop supplies at the supplies percentage of that work amount,
      plus the hazardous waste fee, rounded to the cent. The hourly rate follows the scope written on the consent and
      the repair order's class: an addition of no more than the touch-up scope hours takes the touch-up hourly rate; an
      addition of more than the touch-up scope hours on a repair order whose class requires manufacturer-certified
      procedures takes the certified hourly rate, because the added work follows the same certified procedures; any other
      addition takes the panel hourly rate; the work amount is the labor hours times that hourly rate, rounded to the
      cent. A returning customer takes a discount on the work
      amount alone: a customer holding an active Collision Lifetime Workmanship Warranty issued fewer than the lookback
      months before today takes the returning-customer percentage; a customer holding an active Collision Lifetime
      Workmanship Warranty issued the lookback months or more before today, or holding an active Glass Installation
      Lifetime Warranty, takes the long-standing customer percentage; any other customer takes no discount; the months
      are whole calendar months from the warranty's issued date to today. Shop supplies are charged once per repair
      order, with its first customer-pay addition: when another customer-pay addition consent on the repair order is
      already signed, the addition carries no shop supplies; when none is and the supplies percentage of the work amount
      is more than the supplies cap, the addition carries the supplies cap; any other addition carries the supplies
      percentage of its work amount, rounded to the cent. The hazardous waste fee is charged once per repair order: when a
      customer charge for an unrelated-damage addition or a part upgrade is already posted on the repair order, the
      addition carries no hazardous waste fee; when none is posted and the addition is within the touch-up scope hours,
      it carries the touch-up hazardous waste fee; any other addition carries the hazardous waste fee. A pre-repair scan
      fee charged on a customer-pay estimate of the same vehicle that still stands as a written estimate, neither converted
      nor declined nor expired, is credited against the addition up to what the customer paid on that estimate: when the consent is signed no more than that estimate type's conversion credit window days
      after the estimate written date, the paid fee is credited in full; when it is signed later but no more than that
      estimate type's validity days after the estimate written date, the late scan credit percentage of the paid fee is
      credited, rounded to the cent; in every other case nothing is credited; the days are calendar days counted from the
      estimate written date as day zero. The price is the work amount less the returning-customer discount on it, plus
      the shop supplies, plus the hazardous waste fee, less the scan fee credit, rounded to the cent once at the end; the
      discount acts on the work amount alone, and the credit is taken off after the discount. The customer signs the
      customer-pay addition consent for the price this rule gives, and the addition is charged only for that signed
      price. The pickup free days of a completed vehicle bear on storage charges alone and never on the price or the
      charge of a customer-pay addition.
    prerequisite: []
    cross_category:
      - category: warranty
        as: branch
        reads: [status, variant_name, issued_date]
        note: The returning-customer discount tier is decided from the customer's active network workmanship warranties and their issued dates.
      - category: estimate
        as: history
        reads: [booking_id, estimate_written_date, estimate_events.amount_usd, estimate_events.fee_type, conversion_credit_window_days, estimate_validity_days]
        note: The scan fee credit is decided from the customer-pay estimate of the vehicle still standing as a written estimate, its date, its tier windows and the scan fee paid on it.
    compute:
      - u_hours: "SUM('claim_consents','labor_hours', consent_type='customer_pay_addition', addition_kind='unrelated_damage', consent_status='pending_customer')"
      - u_hourly: "K('touchup_hourly_usd') if u_hours <= K('touchup_max_hours') else (K('certified_hourly_usd') if (u_hours > K('touchup_max_hours') and P('oem_certified_procedures_required') == True) else K('panel_hourly_usd'))"
      - u_work: "RND(u_hours * u_hourly, 2)"
      - u_lifetime_active: "EXISTS('warranty', status='active', variant_name='Collision Lifetime Workmanship Warranty')"
      - u_lifetime_months: "MONTHS(CFIELD('warranty','issued_date', status='active', variant_name='Collision Lifetime Workmanship Warranty'), NOW) if u_lifetime_active else 0"
      - u_glass_active: "EXISTS('warranty', status='active', variant_name='Glass Installation Lifetime Warranty')"
      - u_returning_pct: "K('returning_pct') if (u_lifetime_active and u_lifetime_months < K('returning_lookback_months')) else (K('long_returning_pct') if ((u_lifetime_active and u_lifetime_months >= K('returning_lookback_months')) or u_glass_active) else 0)"
      - u_signed_additions: "COUNT('claim_consents', consent_type='customer_pay_addition', consent_status='signed')"
      - u_supplies: "0.0 if u_signed_additions > 0 else (K('supplies_cap_usd') if u_work * K('supplies_pct') / 100 > K('supplies_cap_usd') else RND(u_work * K('supplies_pct') / 100, 2))"
      - u_charged_additions: "COUNT('claim_ledger', event_type='claim_customer_charge', charge_type='unrelated_damage') + COUNT('claim_ledger', event_type='claim_customer_charge', charge_type='customer_pay_upgrade')"
      - u_waste_fee: "0.0 if u_charged_additions > 0 else (K('touchup_waste_fee_usd') if u_hours <= K('touchup_max_hours') else K('waste_fee_usd'))"
      - u_quote_booking: "CFIELD('estimate','booking_id', vehicle_id=F('vehicle_id'), payer_type='customer_pay', status='estimate_written')"
      - u_quote_age_days: "DAYS(CFIELD('estimate','estimate_written_date', booking_id=u_quote_booking), NOW) if u_quote_booking else 0"
      - u_quote_scan_paid: "MN(XSUM('estimate','estimate_events','amount_usd', booking_id=u_quote_booking, event_type='estimate_fee_charge', fee_type='pre_repair_scan'), XSUM('estimate','estimate_events','amount_usd', booking_id=u_quote_booking, event_type='estimate_fee_payment')) if u_quote_booking else 0"
      - u_scan_credit: "u_quote_scan_paid if (u_quote_booking and u_quote_age_days <= CPARAM('estimate','conversion_credit_window_days', booking_id=u_quote_booking)) else (RND(u_quote_scan_paid * K('late_scan_credit_pct') / 100, 2) if (u_quote_booking and u_quote_age_days <= CPARAM('estimate','estimate_validity_days', booking_id=u_quote_booking)) else 0)"
      - result: "RND(u_work * (1 - u_returning_pct / 100) + u_supplies + u_waste_fee - u_scan_credit, 2)"
    compute_basis:
      u_hours: "An unrelated-damage addition is priced when its customer-pay addition consent is signed, from the labor hours written on that consent."
      u_hourly: "The hourly rate follows the scope written on the consent and the repair order's class: an addition of no more than the touch-up scope hours takes the touch-up hourly rate; an addition of more than the touch-up scope hours on a repair order whose class requires manufacturer-certified procedures takes the certified hourly rate, because the added work follows the same certified procedures; any other addition takes the panel hourly rate;"
      u_work: "the work amount is the labor hours times that hourly rate, rounded to the cent."
      u_lifetime_active: "a customer holding an active Collision Lifetime Workmanship Warranty issued fewer than the lookback months before today takes the returning-customer percentage;"
      u_lifetime_months: "the months are whole calendar months from the warranty's issued date to today."
      u_glass_active: "or holding an active Glass Installation Lifetime Warranty, takes the long-standing customer percentage;"
      u_returning_pct: "A returning customer takes a discount on the work amount alone: a customer holding an active Collision Lifetime Workmanship Warranty issued fewer than the lookback months before today takes the returning-customer percentage; a customer holding an active Collision Lifetime Workmanship Warranty issued the lookback months or more before today, or holding an active Glass Installation Lifetime Warranty, takes the long-standing customer percentage; any other customer takes no discount;"
      u_signed_additions: "when another customer-pay addition consent on the repair order is already signed, the addition carries no shop supplies;"
      u_supplies: "Shop supplies are charged once per repair order, with its first customer-pay addition: when another customer-pay addition consent on the repair order is already signed, the addition carries no shop supplies; when none is and the supplies percentage of the work amount is more than the supplies cap, the addition carries the supplies cap; any other addition carries the supplies percentage of its work amount, rounded to the cent."
      u_charged_additions: "when a customer charge for an unrelated-damage addition or a part upgrade is already posted on the repair order, the addition carries no hazardous waste fee;"
      u_waste_fee: "The hazardous waste fee is charged once per repair order: when a customer charge for an unrelated-damage addition or a part upgrade is already posted on the repair order, the addition carries no hazardous waste fee; when none is posted and the addition is within the touch-up scope hours, it carries the touch-up hazardous waste fee; any other addition carries the hazardous waste fee."
      u_quote_booking: "A pre-repair scan fee charged on a customer-pay estimate of the same vehicle that still stands as a written estimate, neither converted nor declined nor expired, is credited against the addition up to what the customer paid on that estimate:"
      u_quote_age_days: "the days are calendar days counted from the estimate written date as day zero."
      u_quote_scan_paid: "A pre-repair scan fee charged on a customer-pay estimate of the same vehicle that still stands as a written estimate, neither converted nor declined nor expired, is credited against the addition up to what the customer paid on that estimate:"
      u_scan_credit: "when the consent is signed no more than that estimate type's conversion credit window days after the estimate written date, the paid fee is credited in full; when it is signed later but no more than that estimate type's validity days after the estimate written date, the late scan credit percentage of the paid fee is credited, rounded to the cent; in every other case nothing is credited;"
      result: "The price is the work amount less the returning-customer discount on it, plus the shop supplies, plus the hazardous waste fee, less the scan fee credit, rounded to the cent once at the end; the discount acts on the work amount alone, and the credit is taken off after the discount."
    factors:
      - id: addition_scope_rate
        effect: parameter
        decides: u_hourly
        bindings: [u_hours, u_hourly]
        ladder:
          - when: "the labor hours on the consent are no more than the touch-up scope hours"
            value: "K('touchup_hourly_usd')"
          - when: "the labor hours on the consent are more than the touch-up scope hours and the repair order's class requires manufacturer-certified procedures"
            value: "K('certified_hourly_usd')"
          - when: "otherwise"
            value: "K('panel_hourly_usd')"
        baseline:
          u_hourly: "K('panel_hourly_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: returning_customer_discount
        effect: parameter
        decides: u_returning_pct
        bindings: [u_lifetime_active, u_lifetime_months, u_glass_active, u_returning_pct]
        ladder:
          - when: "an active Collision Lifetime Workmanship Warranty is held and it was issued fewer than the lookback months before today"
            value: "K('returning_pct')"
          - when: "an active Collision Lifetime Workmanship Warranty is held and it was issued the lookback months or more before today, or an active Glass Installation Lifetime Warranty is held"
            value: "K('long_returning_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          u_returning_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: warranty
      - id: once_per_order_supplies
        effect: method
        decides: u_supplies
        bindings: [u_signed_additions, u_supplies]
        ladder:
          - when: "another customer-pay addition consent on the repair order is already signed"
            method: "the addition carries no shop supplies, because they were charged with the first addition"
          - when: "no other customer-pay addition consent is signed and the supplies percentage of the work amount is more than the supplies cap"
            method: "the addition carries the supplies cap"
          - when: "otherwise"
            method: "the addition carries the supplies percentage of its work amount, rounded to the cent"
        baseline:
          u_supplies: "RND(u_work * K('supplies_pct') / 100, 2)"
        evidence: [history]
        cross_difficulty: null
      - id: once_per_order_waste_fee
        effect: parameter
        decides: u_waste_fee
        bindings: [u_charged_additions, u_waste_fee]
        ladder:
          - when: "a customer charge for an unrelated-damage addition or a part upgrade is already posted on the repair order"
            value: "0"
          - when: "no such charge is posted and the labor hours are within the touch-up scope hours"
            value: "K('touchup_waste_fee_usd')"
          - when: "otherwise"
            value: "K('waste_fee_usd')"
        baseline:
          u_waste_fee: "K('waste_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: estimate_scan_credit
        effect: parameter
        decides: u_scan_credit
        bindings: [u_quote_booking, u_quote_age_days, u_quote_scan_paid, u_scan_credit]
        ladder:
          - when: "a customer-pay estimate of the vehicle still stands as a written estimate and the consent is signed no more than its conversion credit window days after its written date"
            value: "the paid pre-repair scan fee in full"
          - when: "such an estimate exists and the consent is signed later than that window but no more than its validity days after its written date"
            value: "K('late_scan_credit_pct') percent of the paid pre-repair scan fee"
          - when: "otherwise"
            value: "0"
        baseline:
          u_scan_credit: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: estimate
    baseline:
      rule: >-
        An unrelated-damage addition is priced when its customer-pay addition consent is signed, from the labor hours
        written on that consent. The standard price is the consent's labor hours times the panel hourly rate, which covers
        body labor together with paint and materials, plus shop supplies at the supplies percentage of that work amount,
        plus the hazardous waste fee, rounded to the cent.
      params: [panel_hourly_usd, supplies_pct, waste_fee_usd]
    inputs:
      history:
        - {table: claim_consents, aggregate: sum, field: labor_hours, filters: {consent_type: customer_pay_addition, addition_kind: unrelated_damage, consent_status: pending_customer}}
        - {table: claim_consents, aggregate: count, field: consent_id, filters: {consent_type: customer_pay_addition, consent_status: signed}}
        - {table: claim_ledger, aggregate: count, field: ledger_entry_id, filters: {event_type: claim_customer_charge, charge_type: unrelated_damage}}
        - {table: claim_ledger, aggregate: count, field: ledger_entry_id, filters: {event_type: claim_customer_charge, charge_type: customer_pay_upgrade}}
        - {category: estimate, table: estimate_events, aggregate: sum, field: amount_usd, filters: {event_type: estimate_fee_charge, fee_type: pre_repair_scan}}
        - {category: estimate, table: estimate_events, aggregate: sum, field: amount_usd, filters: {event_type: estimate_fee_payment}}
      cross_category: [warranty, estimate]
  - id: claim_ext_authorization_repair_days
    base_policy_refs: [claim_evt_authorization, claim_evt_total_loss]
    overwrite:
      - base_policy: claim_evt_authorization
        superseded_clause: >-
          the planned repair days are computed: production days are the estimated labor hours divided by
          labor_hours_per_production_day, rounded up to the next whole day, plus intake_delivery_days.
        replaced_by: >-
          The planned repair days are the rounded-up production days plus the intake and delivery days, the calibration
          days, the revision days, the parts days and the customer-pay stage days.
    trigger: state_due
    subject: [claim_authorize, claim_insurer_approval]
    computes: estimated_repair_days
    target_tool: record_insurer_authorization_cee3bb86
    params:
      photo_allowance_pct: 20
      inspected_allowance_hours: 1.5
      two_tech_min_hours: 16.0
      two_tech_daily_hours: 6.5
      small_job_hours: 6.0
      single_bay_daily_hours: 4.0
      multi_calibration_days: 2
      single_calibration_days: 1
      one_revision_days: 1
      two_revision_days: 2
      alternate_parts_days: 1
      part_upgrade_days: 2
      addition_scope_hours: 8.0
      small_addition_days: 1
      large_addition_days: 2
    rule: >
      When the insurer's authorization of the original estimate is recorded, the repair order moves to authorized and its
      planned repair days are fixed. The planned repair days are fixed only after every customer-pay addition consent
      issued on the repair order stands signed or revoked. The standard plan takes the estimated labor hours on the repair
      order, adds the labor hours of every signed customer-pay addition consent on the repair order, divides that total
      by the class's labor hours per production day, rounds the quotient up to the next whole day and adds the class's
      intake and delivery days. The estimated labor hours are first adjusted for damage the estimate could not see, by the
      type of the estimate the repair order was converted from: a Photo Estimate, written without seeing the
      vehicle, scales them up by the photo allowance percentage, rounded to one decimal place; a Drive-In, Scheduled or
      Mobile Estimate, written at an in-person inspection, adds the inspected allowance hours to them as a fixed reserve
      for the panels opened in repair; and a repair order converted from any other estimate type, or opened on a direct
      assignment, keeps them as written; the customer-pay hours are added after this adjustment. The daily hours that divide the
      planned hours follow the size of the plan: a plan of more than the two-technician minimum hours takes the
      two-technician daily hours; a plan of no more than the small-job hours takes the single-bay daily hours; any other
      plan takes the class's labor hours per production day. Calibration days follow the calibration order opened for the repair order: a Multi-System
      Calibration or Dual-Mode Camera Calibration adds the multi-calibration days, a Static Camera, Blind Spot Radar or
      Front Radar Calibration adds the single-calibration days, and a repair order whose calibration order is of any other
      tier, or that has none, adds no calibration days. Revision days follow the revisions recorded on the estimate the
      repair order was converted from: two or more revisions add the two-revision days, exactly one revision adds the
      one-revision days, and none adds nothing. Parts days follow the parts the repair will use: a signed customer-pay
      addition consent for an original-equipment part upgrade adds the part-upgrade days; a signed non-original parts
      disclosure with no signed part upgrade adds the alternate-parts days; a repair order with neither adds nothing.
      Customer-pay stage days follow the signed customer-pay addition consents of the repair order: when there is at
      least one and their labor hours together are more than the addition scope hours, the large-addition days are
      added; when there is at least one and their labor hours together are no more than the addition scope hours, the
      small-addition days are added; with none, nothing is added. The planned repair days are the rounded-up production
      days plus the intake and delivery days, the calibration days, the revision days, the parts days and the customer-pay
      stage days.
    prerequisite:
      - problem: claim_ext_unrelated_addition_price
        kind: value_input
        gate: a_addition_hours
        form: state
        policy_source: >-
          The planned repair days are fixed only after every customer-pay addition consent issued on the repair order
          stands signed or revoked.
        condition: >-
          No customer-pay addition consent of the repair order has consent_status pending_customer; every one issued is
          signed or revoked, so the signed customer-pay hours the plan adds are final.
        resolved_by: sign_unrelated_damage_addition_ef94c675
        effect: >-
          When a customer-pay addition consent awaiting the customer is signed, its labor hours join the signed
          customer-pay hours that the standard plan adds to the estimated labor hours, which raises the planned hours and
          can raise the rounded-up production days.
    cross_category:
      - category: estimate
        as: history
        reads: [variant_name, estimate_events.event_type]
        note: The hidden-damage allowance follows the type of the source estimate booking, and the revision days follow the revisions recorded on it.
      - category: adas
        as: branch
        reads: [variant_name]
        note: The calibration days follow the tier of the calibration order opened for the repair order.
    compute:
      - a_estimate_tier: "CFIELD('estimate','variant_name', booking_id=F('booking_id'))"
      - a_estimate_hours: "RND(F('estimated_labor_hours') * (1 + K('photo_allowance_pct') / 100), 1) if a_estimate_tier == 'Photo Estimate' else (RND(F('estimated_labor_hours') + K('inspected_allowance_hours'), 1) if (a_estimate_tier == 'Drive-In Estimate' or a_estimate_tier == 'Scheduled Estimate' or a_estimate_tier == 'Mobile Estimate') else F('estimated_labor_hours'))"
      - a_addition_hours: "SUM('claim_consents','labor_hours', consent_type='customer_pay_addition', consent_status='signed')"
      - a_plan_hours: "a_estimate_hours + a_addition_hours"
      - a_daily_hours: "K('two_tech_daily_hours') if a_plan_hours > K('two_tech_min_hours') else (K('single_bay_daily_hours') if a_plan_hours <= K('small_job_hours') else P('labor_hours_per_production_day'))"
      - a_production_days: "int(-(-a_plan_hours // a_daily_hours))"
      - a_calibration_tier: "CFIELD('adas','variant_name', claim_repair_id=HID)"
      - a_calibration_days: "K('multi_calibration_days') if (a_calibration_tier == 'Multi-System Calibration' or a_calibration_tier == 'Dual-Mode Camera Calibration') else (K('single_calibration_days') if (a_calibration_tier == 'Static Camera Calibration' or a_calibration_tier == 'Blind Spot Radar Calibration' or a_calibration_tier == 'Front Radar Calibration') else 0)"
      - a_revisions: "XCOUNT('estimate','estimate_events', booking_id=F('booking_id'), event_type='estimate_revise')"
      - a_revision_days: "K('two_revision_days') if a_revisions >= 2 else (K('one_revision_days') if a_revisions == 1 else 0)"
      - a_part_upgrades: "COUNT('claim_consents', consent_type='customer_pay_addition', addition_kind='oem_upgrade', consent_status='signed')"
      - a_alternate_parts: "COUNT('claim_consents', consent_type='non_oem_parts_disclosure', consent_status='signed')"
      - a_parts_days: "K('part_upgrade_days') if a_part_upgrades > 0 else (K('alternate_parts_days') if a_alternate_parts > 0 else 0)"
      - a_addition_count: "COUNT('claim_consents', consent_type='customer_pay_addition', consent_status='signed')"
      - a_stage_days: "K('large_addition_days') if (a_addition_count > 0 and a_addition_hours > K('addition_scope_hours')) else (K('small_addition_days') if (a_addition_count > 0 and a_addition_hours <= K('addition_scope_hours')) else 0)"
      - result: "a_production_days + P('intake_delivery_days') + a_calibration_days + a_revision_days + a_parts_days + a_stage_days"
    compute_basis:
      a_estimate_tier: "by the type of the estimate the repair order was converted from:"
      a_estimate_hours: "The estimated labor hours are first adjusted for damage the estimate could not see, by the type of the estimate the repair order was converted from: a Photo Estimate, written without seeing the vehicle, scales them up by the photo allowance percentage, rounded to one decimal place; a Drive-In, Scheduled or Mobile Estimate, written at an in-person inspection, adds the inspected allowance hours to them as a fixed reserve for the panels opened in repair; and a repair order converted from any other estimate type, or opened on a direct assignment, keeps them as written; the customer-pay hours are added after this adjustment."
      a_addition_hours: "adds the labor hours of every signed customer-pay addition consent on the repair order,"
      a_plan_hours: "The standard plan takes the estimated labor hours on the repair order, adds the labor hours of every signed customer-pay addition consent on the repair order,"
      a_daily_hours: "The daily hours that divide the planned hours follow the size of the plan: a plan of more than the two-technician minimum hours takes the two-technician daily hours; a plan of no more than the small-job hours takes the single-bay daily hours; any other plan takes the class's labor hours per production day."
      a_production_days: "divides that total by the class's labor hours per production day, rounds the quotient up to the next whole day"
      a_calibration_tier: "Calibration days follow the calibration order opened for the repair order:"
      a_calibration_days: "a Multi-System Calibration or Dual-Mode Camera Calibration adds the multi-calibration days, a Static Camera, Blind Spot Radar or Front Radar Calibration adds the single-calibration days, and a repair order whose calibration order is of any other tier, or that has none, adds no calibration days."
      a_revisions: "Revision days follow the revisions recorded on the estimate the repair order was converted from:"
      a_revision_days: "two or more revisions add the two-revision days, exactly one revision adds the one-revision days, and none adds nothing."
      a_part_upgrades: "a signed customer-pay addition consent for an original-equipment part upgrade adds the part-upgrade days;"
      a_alternate_parts: "a signed non-original parts disclosure with no signed part upgrade adds the alternate-parts days;"
      a_parts_days: "Parts days follow the parts the repair will use: a signed customer-pay addition consent for an original-equipment part upgrade adds the part-upgrade days; a signed non-original parts disclosure with no signed part upgrade adds the alternate-parts days; a repair order with neither adds nothing."
      a_addition_count: "Customer-pay stage days follow the signed customer-pay addition consents of the repair order:"
      a_stage_days: "when there is at least one and their labor hours together are more than the addition scope hours, the large-addition days are added; when there is at least one and their labor hours together are no more than the addition scope hours, the small-addition days are added; with none, nothing is added."
      result: "The planned repair days are the rounded-up production days plus the intake and delivery days, the calibration days, the revision days, the parts days and the customer-pay stage days."
    factors:
      - id: hidden_damage_allowance
        effect: method
        decides: a_estimate_hours
        bindings: [a_estimate_tier, a_estimate_hours]
        ladder:
          - when: "the repair order was converted from a Photo Estimate"
            method: "the estimated labor hours are scaled up by the photo allowance percentage and rounded to one decimal place"
          - when: "the repair order was converted from a Drive-In, Scheduled or Mobile Estimate"
            method: "a fixed reserve of the inspected allowance hours is added to the estimated labor hours"
          - when: "otherwise"
            method: "the estimated labor hours are taken as written"
        baseline:
          a_estimate_hours: "F('estimated_labor_hours')"
        evidence: [cross_category]
        cross_difficulty: estimate
      - id: production_daily_hours
        effect: parameter
        decides: a_daily_hours
        bindings: [a_addition_hours, a_plan_hours, a_daily_hours]
        ladder:
          - when: "the plan is more than the two-technician minimum hours"
            value: "K('two_tech_daily_hours')"
          - when: "the plan is no more than the small-job hours"
            value: "K('single_bay_daily_hours')"
          - when: "otherwise"
            value: "P('labor_hours_per_production_day')"
        baseline:
          a_daily_hours: "P('labor_hours_per_production_day')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: calibration_days
        effect: parameter
        decides: a_calibration_days
        bindings: [a_calibration_tier, a_calibration_days]
        ladder:
          - when: "the calibration order opened for the repair order is a Multi-System Calibration or a Dual-Mode Camera Calibration"
            value: "K('multi_calibration_days')"
          - when: "the calibration order is a Static Camera, Blind Spot Radar or Front Radar Calibration"
            value: "K('single_calibration_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_calibration_days: "0"
        evidence: [cross_category]
        cross_difficulty: adas
      - id: estimate_revision_days
        effect: parameter
        decides: a_revision_days
        bindings: [a_revisions, a_revision_days]
        ladder:
          - when: "two or more revisions are recorded on the source estimate"
            value: "K('two_revision_days')"
          - when: "exactly one revision is recorded on the source estimate"
            value: "K('one_revision_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_revision_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: estimate
      - id: parts_lead_days
        effect: parameter
        decides: a_parts_days
        bindings: [a_part_upgrades, a_alternate_parts, a_parts_days]
        ladder:
          - when: "a customer-pay addition consent for an original-equipment part upgrade is signed"
            value: "K('part_upgrade_days')"
          - when: "a non-original parts disclosure is signed and no part upgrade is signed"
            value: "K('alternate_parts_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_parts_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: customer_pay_stage_days
        effect: parameter
        decides: a_stage_days
        bindings: [a_addition_count, a_stage_days]
        ladder:
          - when: "at least one customer-pay addition consent is signed and their labor hours together are more than the addition scope hours"
            value: "K('large_addition_days')"
          - when: "at least one customer-pay addition consent is signed and their labor hours together are no more than the addition scope hours"
            value: "K('small_addition_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          a_stage_days: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When the insurer's authorization of the original estimate is recorded, the repair order moves to authorized and
        its planned repair days are fixed. The standard plan takes the estimated labor hours on the repair order, adds the
        labor hours of every signed customer-pay addition consent on the repair order, divides that total by the class's
        labor hours per production day, rounds the quotient up to the next whole day and adds the class's intake and
        delivery days.
      params: [labor_hours_per_production_day, intake_delivery_days]
    inputs:
      history:
        - {table: claim_consents, aggregate: sum, field: labor_hours, filters: {consent_type: customer_pay_addition, consent_status: signed}}
        - {table: claim_consents, aggregate: count, field: consent_id, filters: {consent_type: non_oem_parts_disclosure, consent_status: signed}}
        - {category: estimate, table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_revise}}
      cross_category: [estimate, adas]
  - id: claim_ext_denied_operation_price
    base_policy_refs: [claim_evt_deductible_betterment, claim_evt_storage, claim_evt_customer_pay_additions, claim_evt_withdrawal, claim_evt_supplement_decision]
    overwrite:
      - base_policy: claim_evt_customer_pay_additions
        superseded_clause: >-
          repair of damage unrelated to the claim (or of operations the insurer denied), charged at the amount on the
          written customer-pay estimate line
        replaced_by: >-
          The standard price is the calibration price of the calibration order's tier when that supplement added sensor
          calibrations, plus the consent's labor hours times the body-shop hourly rate, rounded to the cent.
      - base_policy: claim_evt_customer_pay_additions
        superseded_clause: >-
          The customer's customer-pay addition consent for that amount is signed.
        replaced_by: >-
          The customer signs the customer-pay addition consent for operations the insurer denied at the price this rule
          gives, and the addition is charged only for that signed price.
      - base_policy: claim_evt_storage
        superseded_clause: >-
          The vehicle is still at the center more than the tier's pickup free days after the vehicle-ready date.
        replaced_by: >-
          Pickup free days decide storage charges only and play no part in pricing or charging an addition for operations
          the insurer denied.
    trigger: on_request
    subject: [claim_customer_charge]
    computes: amount_usd
    target_tool: accept_denied_operations_addition_a285270b
    params:
      min_billable_hours: 1.0
      frame_hourly_usd: 118.0
      sensor_hourly_usd: 115.0
      body_hourly_usd: 104.0
      recent_calibration_pct: 10
      other_warranty_pct: 5
      loyalty_months: 12
      stale_scan_days: 14
      aging_scan_days: 7
      aging_scan_pct: 50
    rule: >
      A denied-operation addition is priced when its customer-pay addition consent is signed, from the most recently
      decided supplement on the repair order and the labor hours written on the consent. The standard price is the
      calibration price of the calibration order's tier when that supplement added sensor calibrations, plus the
      consent's labor hours times the body-shop hourly rate, rounded to the cent. When the supplement added sensor
      calibrations, the calibration line follows the insurer's decision on that supplement: a partly approved supplement
      leaves the calibration price less the insurer's calibration allowance, never below zero, where the allowance is the
      approved amount less the supplement labor the insurer kept, that is the supplement's labor hours not on the consent
      times the supplement's written hourly value, and the written hourly value is the submitted amount less the
      calibration price, divided by the supplement's labor hours and rounded to the cent; a supplement approved in full
      leaves no calibration line; any other supplement leaves the full calibration price. The hourly rate follows the work
      the supplement added: a supplement adding structural operations takes the frame-work hourly rate, a supplement
      adding sensor calibrations without structural operations takes the sensor-work hourly rate, and any other supplement
      takes the body-shop hourly rate. The hours billed follow the consent: hours above zero but under the minimum
      billable hours are billed as the minimum billable hours, hours above the supplement's own labor hours are billed as
      the supplement's labor hours, and any other hours are billed as written. Once the calibration is the customer's, the
      alignment checks made for it are the customer's: when the order's tier requires an alignment and an out-of-spec
      check on the order was corrected, every alignment check on the order is charged at the tier's alignment check fee
      and every corrected check also at the tier's alignment correction fee; when the tier requires an alignment and the
      order carries checks but none was corrected, one alignment check fee is charged; when no calibration line remains,
      or in any other case, no alignment charge applies. A customer whose earlier network calibration work is under
      warranty takes a discount on the calibration line alone: an active Calibration Workmanship Warranty issued fewer
      than the loyalty months before today gives the recent-calibration percentage; an active Calibration Workmanship
      Warranty issued the loyalty months or more before today, or an active Collision Lifetime Workmanship Warranty,
      gives the other-warranty percentage; any other customer takes no discount; months are whole calendar months from
      the issued date to today. A pre-calibration scan is charged when the repair's own scan has aged: when a calibration
      line remains and the repair started more than the stale-scan days before today, the tier's standalone diagnostic
      fee is charged; when a calibration line remains and the repair started more than the aging-scan days but no more
      than the stale-scan days before today, the aging-scan percentage of that fee is charged, rounded to the cent;
      otherwise no scan is charged; days are calendar days from the repair start date to today. The price is the
      calibration line less its discount, plus the billed hours times the hourly rate, plus the alignment charges, plus
      the scan charge, rounded to the cent once at the end. The customer signs the customer-pay addition consent for
      operations the insurer denied at the price this rule gives, and the addition is charged only for that signed
      price. Pickup free days decide storage charges only and play no part in pricing or charging an addition for
      operations the insurer denied.
    prerequisite: []
    cross_category:
      - category: adas
        as: history
        reads: [adas_order_id, calibration_price_usd, alignment_required, alignment_check_fee_usd, alignment_correction_fee_usd, standalone_diagnostic_fee_usd, adas_events.alignment_corrected]
        note: The calibration price, the alignment charges and the scan fee come from the tier of the calibration order opened for the repair order and the alignment checks recorded on it.
      - category: warranty
        as: branch
        reads: [status, variant_name, issued_date]
        note: The calibration discount tier is decided from the customer's active Calibration Workmanship Warranty and its issued date, or an active Collision Lifetime Workmanship Warranty.
    compute:
      - q_hours: "SUM('claim_consents','labor_hours', consent_type='customer_pay_addition', addition_kind='denied_operation', consent_status='pending_customer')"
      - q_supplement: "LATEST('claim_supplements','supplement_number', date_field='event_date', event_type='claim_supplement_decision')"
      - q_decision: "LATEST('claim_supplements','decision', date_field='event_date', event_type='claim_supplement_decision')"
      - q_submitted: "SUM('claim_supplements','supplement_amount_usd', event_type='claim_supplement_submit', supplement_number=q_supplement)"
      - q_submitted_hours: "SUM('claim_supplements','supplement_labor_hours', event_type='claim_supplement_submit', supplement_number=q_supplement)"
      - q_approved: "SUM('claim_supplements','approved_amount_usd', event_type='claim_supplement_decision', supplement_number=q_supplement)"
      - q_adds_calibration: "COUNT('claim_supplements', event_type='claim_supplement_submit', supplement_number=q_supplement, includes_calibration=True) > 0"
      - q_adds_structural: "COUNT('claim_supplements', event_type='claim_supplement_submit', supplement_number=q_supplement, includes_structural=True) > 0"
      - q_tier_price: "CPARAM('adas','calibration_price_usd', claim_repair_id=HID) if q_adds_calibration else 0"
      - q_written_hourly: "RND((q_submitted - q_tier_price) / q_submitted_hours, 2) if q_submitted_hours > 0 else 0"
      - q_calibration_line: "0 if not q_adds_calibration else (RND(MX(0, q_tier_price - (q_approved - (q_submitted_hours - q_hours) * q_written_hourly)), 2) if q_decision == 'partially_approved' else (0 if q_decision == 'approved' else q_tier_price))"
      - q_hourly: "K('frame_hourly_usd') if q_adds_structural else (K('sensor_hourly_usd') if q_adds_calibration else K('body_hourly_usd'))"
      - q_billed_hours: "K('min_billable_hours') if (q_hours > 0 and q_hours < K('min_billable_hours')) else (q_submitted_hours if q_hours > q_submitted_hours else q_hours)"
      - q_alignment_required: "CPARAM('adas','alignment_required', claim_repair_id=HID) == True"
      - q_checks: "XCOUNT('adas','adas_events', event_type='adas_alignment_check', adas_order_id=CFIELD('adas','adas_order_id', claim_repair_id=HID))"
      - q_corrections: "XCOUNT('adas','adas_events', event_type='adas_alignment_check', alignment_corrected=True, adas_order_id=CFIELD('adas','adas_order_id', claim_repair_id=HID))"
      - q_alignment_fees: "RND(q_checks * CPARAM('adas','alignment_check_fee_usd', claim_repair_id=HID) + q_corrections * CPARAM('adas','alignment_correction_fee_usd', claim_repair_id=HID), 2) if (q_calibration_line > 0 and q_alignment_required and q_corrections > 0) else (CPARAM('adas','alignment_check_fee_usd', claim_repair_id=HID) if (q_calibration_line > 0 and q_alignment_required and q_checks > 0) else 0)"
      - q_calibration_warranty: "EXISTS('warranty', status='active', variant_name='Calibration Workmanship Warranty')"
      - q_calibration_warranty_months: "MONTHS(CFIELD('warranty','issued_date', status='active', variant_name='Calibration Workmanship Warranty'), NOW) if q_calibration_warranty else 0"
      - q_lifetime_warranty: "EXISTS('warranty', status='active', variant_name='Collision Lifetime Workmanship Warranty')"
      - q_discount_pct: "K('recent_calibration_pct') if (q_calibration_warranty and q_calibration_warranty_months < K('loyalty_months')) else (K('other_warranty_pct') if ((q_calibration_warranty and q_calibration_warranty_months >= K('loyalty_months')) or q_lifetime_warranty) else 0)"
      - q_scan_age_days: "DAYS(F('repair_started_date'), NOW)"
      - q_scan_charge: "CPARAM('adas','standalone_diagnostic_fee_usd', claim_repair_id=HID) if (q_calibration_line > 0 and q_scan_age_days > K('stale_scan_days')) else (RND(CPARAM('adas','standalone_diagnostic_fee_usd', claim_repair_id=HID) * K('aging_scan_pct') / 100, 2) if (q_calibration_line > 0 and q_scan_age_days > K('aging_scan_days')) else 0)"
      - result: "RND(q_calibration_line * (1 - q_discount_pct / 100) + q_billed_hours * q_hourly + q_alignment_fees + q_scan_charge, 2)"
    compute_basis:
      q_hours: "from the most recently decided supplement on the repair order and the labor hours written on the consent."
      q_supplement: "A denied-operation addition is priced when its customer-pay addition consent is signed, from the most recently decided supplement on the repair order"
      q_decision: "the calibration line follows the insurer's decision on that supplement:"
      q_submitted: "the written hourly value is the submitted amount less the calibration price, divided by the supplement's labor hours and rounded to the cent;"
      q_submitted_hours: "the supplement's labor hours not on the consent times the supplement's written hourly value,"
      q_approved: "where the allowance is the approved amount less the supplement labor the insurer kept,"
      q_adds_calibration: "When the supplement added sensor calibrations, the calibration line follows the insurer's decision on that supplement:"
      q_adds_structural: "a supplement adding structural operations takes the frame-work hourly rate,"
      q_tier_price: "The standard price is the calibration price of the calibration order's tier when that supplement added sensor calibrations,"
      q_written_hourly: "the written hourly value is the submitted amount less the calibration price, divided by the supplement's labor hours and rounded to the cent;"
      q_calibration_line: "a partly approved supplement leaves the calibration price less the insurer's calibration allowance, never below zero, where the allowance is the approved amount less the supplement labor the insurer kept, that is the supplement's labor hours not on the consent times the supplement's written hourly value, and the written hourly value is the submitted amount less the calibration price, divided by the supplement's labor hours and rounded to the cent; a supplement approved in full leaves no calibration line; any other supplement leaves the full calibration price."
      q_hourly: "The hourly rate follows the work the supplement added: a supplement adding structural operations takes the frame-work hourly rate, a supplement adding sensor calibrations without structural operations takes the sensor-work hourly rate, and any other supplement takes the body-shop hourly rate."
      q_billed_hours: "The hours billed follow the consent: hours above zero but under the minimum billable hours are billed as the minimum billable hours, hours above the supplement's own labor hours are billed as the supplement's labor hours, and any other hours are billed as written."
      q_alignment_required: "when the order's tier requires an alignment"
      q_checks: "every alignment check on the order is charged at the tier's alignment check fee"
      q_corrections: "and every corrected check also at the tier's alignment correction fee;"
      q_alignment_fees: "Once the calibration is the customer's, the alignment checks made for it are the customer's: when the order's tier requires an alignment and an out-of-spec check on the order was corrected, every alignment check on the order is charged at the tier's alignment check fee and every corrected check also at the tier's alignment correction fee; when the tier requires an alignment and the order carries checks but none was corrected, one alignment check fee is charged; when no calibration line remains, or in any other case, no alignment charge applies."
      q_calibration_warranty: "an active Calibration Workmanship Warranty issued fewer than the loyalty months before today gives the recent-calibration percentage;"
      q_calibration_warranty_months: "months are whole calendar months from the issued date to today."
      q_lifetime_warranty: "or an active Collision Lifetime Workmanship Warranty, gives the other-warranty percentage;"
      q_discount_pct: "A customer whose earlier network calibration work is under warranty takes a discount on the calibration line alone: an active Calibration Workmanship Warranty issued fewer than the loyalty months before today gives the recent-calibration percentage; an active Calibration Workmanship Warranty issued the loyalty months or more before today, or an active Collision Lifetime Workmanship Warranty, gives the other-warranty percentage; any other customer takes no discount;"
      q_scan_age_days: "days are calendar days from the repair start date to today."
      q_scan_charge: "A pre-calibration scan is charged when the repair's own scan has aged: when a calibration line remains and the repair started more than the stale-scan days before today, the tier's standalone diagnostic fee is charged; when a calibration line remains and the repair started more than the aging-scan days but no more than the stale-scan days before today, the aging-scan percentage of that fee is charged, rounded to the cent; otherwise no scan is charged;"
      result: "The price is the calibration line less its discount, plus the billed hours times the hourly rate, plus the alignment charges, plus the scan charge, rounded to the cent once at the end."
    factors:
      - id: insurer_calibration_allowance
        effect: method
        decides: q_calibration_line
        bindings: [q_supplement, q_decision, q_submitted, q_submitted_hours, q_approved, q_written_hourly, q_calibration_line]
        ladder:
          - when: "the most recently decided supplement added sensor calibrations and was partly approved"
            method: "the calibration price less the insurer's calibration allowance (the approved amount less the kept supplement labor at the written hourly value), never below zero"
          - when: "that supplement added sensor calibrations and was approved in full"
            method: "no calibration line"
          - when: "otherwise"
            method: "the full calibration price of the order's tier"
        baseline:
          q_calibration_line: "q_tier_price"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: denied_work_hourly_rate
        effect: parameter
        decides: q_hourly
        bindings: [q_adds_structural, q_hourly]
        ladder:
          - when: "the most recently decided supplement adds structural operations"
            value: "K('frame_hourly_usd')"
          - when: "it adds sensor calibrations and no structural operations"
            value: "K('sensor_hourly_usd')"
          - when: "otherwise"
            value: "K('body_hourly_usd')"
        baseline:
          q_hourly: "K('body_hourly_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: minimum_billable_hours
        effect: method
        decides: q_billed_hours
        bindings: [q_hours, q_billed_hours]
        ladder:
          - when: "the consent carries hours above zero but under the minimum billable hours"
            method: "the hours are billed as the minimum billable hours"
          - when: "the consent carries more hours than the supplement's own labor hours"
            method: "the hours are billed as the supplement's labor hours"
          - when: "otherwise"
            method: "the hours are billed as written on the consent"
        baseline:
          q_billed_hours: "q_hours"
        evidence: [history]
        cross_difficulty: null
      - id: customer_alignment_checks
        effect: parameter
        decides: q_alignment_fees
        bindings: [q_alignment_required, q_checks, q_corrections, q_alignment_fees]
        ladder:
          - when: "a calibration line remains, the order's tier requires an alignment and an out-of-spec check on the order was corrected"
            value: "every check at CPARAM alignment_check_fee_usd plus every corrected check at CPARAM alignment_correction_fee_usd"
          - when: "a calibration line remains, the tier requires an alignment and the order carries checks, none corrected"
            value: "one CPARAM alignment_check_fee_usd"
          - when: "otherwise"
            value: "0"
        baseline:
          q_alignment_fees: "0"
        evidence: [cross_category, history]
        cross_difficulty: adas
      - id: calibration_warranty_discount
        effect: parameter
        decides: q_discount_pct
        bindings: [q_calibration_warranty, q_calibration_warranty_months, q_lifetime_warranty, q_discount_pct]
        ladder:
          - when: "an active Calibration Workmanship Warranty is held and was issued fewer than the loyalty months before today"
            value: "K('recent_calibration_pct')"
          - when: "an active Calibration Workmanship Warranty issued the loyalty months or more before today is held, or an active Collision Lifetime Workmanship Warranty is held"
            value: "K('other_warranty_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          q_discount_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: warranty
      - id: pre_calibration_scan
        effect: parameter
        decides: q_scan_charge
        bindings: [q_scan_age_days, q_scan_charge]
        ladder:
          - when: "a calibration line remains and the repair started more than the stale-scan days before today"
            value: "CPARAM standalone_diagnostic_fee_usd"
          - when: "a calibration line remains and the repair started more than the aging-scan days but no more than the stale-scan days before today"
            value: "K('aging_scan_pct') percent of CPARAM standalone_diagnostic_fee_usd"
          - when: "otherwise"
            value: "0"
        baseline:
          q_scan_charge: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A denied-operation addition is priced when its customer-pay addition consent is signed, from the most recently
        decided supplement on the repair order and the labor hours written on the consent. The standard price is the
        calibration price of the calibration order's tier when that supplement added sensor calibrations, plus the
        consent's labor hours times the body-shop hourly rate, rounded to the cent.
      params: [body_hourly_usd]
    inputs:
      history:
        - {table: claim_consents, aggregate: sum, field: labor_hours, filters: {consent_type: customer_pay_addition, addition_kind: denied_operation, consent_status: pending_customer}}
        - {table: claim_supplements, aggregate: latest, field: supplement_number, filters: {event_type: claim_supplement_decision}}
        - {table: claim_supplements, aggregate: sum, field: supplement_amount_usd, filters: {event_type: claim_supplement_submit}}
        - {table: claim_supplements, aggregate: sum, field: approved_amount_usd, filters: {event_type: claim_supplement_decision}}
        - {category: adas, table: adas_events, aggregate: count, field: adas_event_id, filters: {event_type: adas_alignment_check}}
      cross_category: [adas, warranty]
  - id: claim_ext_overpayment_refund
    base_policy_refs: [claim_evt_customer_payments]
    overwrite:
      - base_policy: claim_evt_customer_payments
        superseded_clause: >-
          When payments exceed what is owed (claim_msr_customer_balance below zero), the excess is refunded to the method
          of the payment being refunded within refund_processing_business_days business days, one refund per payment and
          never more than that payment.
        replaced_by: >-
          The refund is the excess less the price of the signed customer-pay addition consents not yet charged, less every
          amount held, never below zero and never more than the payment refunded, rounded to the cent once at the end.
    trigger: state_due
    subject: [claim_customer_refund]
    computes: amount_usd
    target_tool: issue_overpayment_refund_b142d0d2
    params:
      card_refund_window_days: 120
      ach_return_days: 5
      check_clearing_days: 10
      field_reserve_usd: 50.0
      desk_reserve_usd: 25.0
    rule: >
      When the customer's payments and credits on the repair order exceed its customer charges and the refunds already
      made, the excess is refunded against one payment and goes back to that payment's method within the class's refund
      processing business days. An overpayment is not refunded until every customer-pay addition consent issued on the
      repair order stands signed or revoked. The standard refund is that excess less the price of every signed
      customer-pay addition consent whose charge is not yet posted, returned against the most recent customer payment and
      never more than that payment, rounded to the cent. The payment refunded follows the payment methods on the repair
      order: the most recent card payment, when a card payment was made no more than the card refund window days before
      today; otherwise the most recent ACH payment, when one was made at least the ACH return days before today; otherwise
      the most recent customer payment; days are calendar days from the payment's entry date to today. A supplement is
      undecided while the latest submitted supplement number is above the latest decided one. While a supplement is
      undecided a reinspection reserve is held: the field reserve when the undecided supplement is on field reinspection,
      the desk reserve when it is on desk review, and nothing when no supplement is undecided. While a supplement is
      undecided and part of the stated deductible is still unassessed, the deductible it could still raise is held: the
      undecided supplement's full amount when the unassessed deductible is at least that amount, the whole unassessed
      deductible when it is smaller, and nothing when no supplement is undecided or no deductible is left unassessed; the
      unassessed deductible is the stated deductible less the deductible charges posted. Betterment that may still fall to
      the customer is held: while a supplement is undecided, the betterment expected on it; when none is undecided, the
      betterment the insurer applied on decided supplements beyond the betterment charges posted; otherwise nothing. Funds
      that are not yet final are held: the most recent check payment when it was received fewer than the check clearing
      days before today; otherwise the most recent ACH payment when it was received fewer than the ACH return days before
      today; otherwise nothing. Charges the customer still owes at other network desks are held: the customer's
      estimate-stage charges left after payments and waivers when there are any; otherwise the customer's warranty
      charges left after payments and waivers; otherwise nothing. The refund is the excess less the price of the signed
      customer-pay addition consents not yet charged, less every amount held, never below zero and never more than the
      payment refunded, rounded to the cent once at the end. The refund names the payment it returns and goes back to that
      payment's method.
    prerequisite:
      - problem: claim_ext_denied_operation_price
        kind: value_input
        gate: r_committed
        form: state
        policy_source: >-
          An overpayment is not refunded until every customer-pay addition consent issued on the repair order stands
          signed or revoked.
        condition: >-
          No customer-pay addition consent of the repair order has consent_status pending_customer; every one issued is
          signed or revoked, so the signed customer-pay work the refund nets is final.
        resolved_by: accept_denied_operations_addition_a285270b
        effect: >-
          When a customer-pay addition consent awaiting the customer is signed, its signed price joins the signed
          customer-pay additions not yet charged, which the refund nets from the excess before any amount is held.
    cross_category:
      - category: estimate
        as: history
        reads: [estimate_events.amount_usd, estimate_events.event_type]
        note: The other-desk hold first reads the customer's estimate-stage charges left after payments and waivers.
      - category: warranty
        as: history
        reads: [warranty_ledger.amount_usd, warranty_ledger.event_type]
        note: When no estimate-stage charge is outstanding, the other-desk hold reads the customer's warranty charges left after payments and waivers.
    compute:
      - r_charges: "SUM('claim_ledger','amount_usd', event_type='claim_customer_charge') + SUM('claim_ledger','amount_usd', event_type='claim_customer_refund')"
      - r_paid: "SUM('claim_ledger','amount_usd', event_type='claim_customer_payment') + SUM('claim_ledger','amount_usd', event_type='claim_customer_credit')"
      - r_overpaid: "MX(0, RND(r_paid - r_charges, 2))"
      - r_committed: "MX(0, RND(SUM('claim_consents','amount_usd', consent_type='customer_pay_addition', consent_status='signed') - SUM('claim_ledger','amount_usd', event_type='claim_customer_charge', charge_type='unrelated_damage') - SUM('claim_ledger','amount_usd', event_type='claim_customer_charge', charge_type='customer_pay_upgrade'), 2))"
      - r_latest_card_date: "LATEST('claim_ledger','entry_date', date_field='entry_date', event_type='claim_customer_payment', payment_method='card')"
      - r_latest_ach_date: "LATEST('claim_ledger','entry_date', date_field='entry_date', event_type='claim_customer_payment', payment_method='ach')"
      - r_card_in_window: "r_latest_card_date != None and DAYS(r_latest_card_date, NOW) <= K('card_refund_window_days')"
      - r_ach_settled: "r_latest_ach_date != None and DAYS(r_latest_ach_date, NOW) >= K('ach_return_days')"
      - r_refund_cap: "LATEST('claim_ledger','amount_usd', date_field='entry_date', event_type='claim_customer_payment', payment_method='card') if r_card_in_window else (LATEST('claim_ledger','amount_usd', date_field='entry_date', event_type='claim_customer_payment', payment_method='ach') if ((not r_card_in_window) and r_ach_settled) else LATEST('claim_ledger','amount_usd', date_field='entry_date', event_type='claim_customer_payment'))"
      - r_undecided: "LATEST('claim_supplements','supplement_number', date_field='event_date', event_type='claim_supplement_submit') > (LATEST('claim_supplements','supplement_number', date_field='event_date', event_type='claim_supplement_decision') or 0)"
      - r_undecided_route: "LATEST('claim_supplements','approval_route', date_field='event_date', event_type='claim_supplement_submit') if r_undecided else ''"
      - r_reinspection_reserve: "K('field_reserve_usd') if (r_undecided and r_undecided_route == 'field_reinspection') else (K('desk_reserve_usd') if (r_undecided and r_undecided_route == 'desk_review') else 0)"
      - r_undecided_amount: "LATEST('claim_supplements','supplement_amount_usd', date_field='event_date', event_type='claim_supplement_submit') if r_undecided else 0"
      - r_remaining_deductible: "MX(0, RND(F('deductible_usd') - SUM('claim_ledger','amount_usd', event_type='claim_customer_charge', charge_type='deductible'), 2))"
      - r_deductible_hold: "r_undecided_amount if (r_undecided and r_remaining_deductible >= r_undecided_amount) else (r_remaining_deductible if (r_undecided and r_remaining_deductible > 0) else 0)"
      - r_undecided_betterment: "LATEST('claim_supplements','betterment_usd', date_field='event_date', event_type='claim_supplement_submit') if r_undecided else 0"
      - r_uncharged_betterment: "MX(0, RND(SUM('claim_supplements','betterment_usd', event_type='claim_supplement_decision') - SUM('claim_ledger','amount_usd', event_type='claim_customer_charge', charge_type='betterment'), 2))"
      - r_betterment_hold: "r_undecided_betterment if (r_undecided and r_undecided_betterment > 0) else (r_uncharged_betterment if ((not r_undecided) and r_uncharged_betterment > 0) else 0)"
      - r_latest_check_date: "LATEST('claim_ledger','entry_date', date_field='entry_date', event_type='claim_customer_payment', payment_method='check')"
      - r_clearing_hold: "LATEST('claim_ledger','amount_usd', date_field='entry_date', event_type='claim_customer_payment', payment_method='check') if (r_latest_check_date != None and DAYS(r_latest_check_date, NOW) < K('check_clearing_days')) else (LATEST('claim_ledger','amount_usd', date_field='entry_date', event_type='claim_customer_payment', payment_method='ach') if (r_latest_ach_date != None and DAYS(r_latest_ach_date, NOW) < K('ach_return_days')) else 0)"
      - r_estimate_outstanding: "RND(XSUM('estimate','estimate_events','amount_usd', event_type='estimate_fee_charge') - XSUM('estimate','estimate_events','amount_usd', event_type='estimate_fee_payment') - XSUM('estimate','estimate_events','amount_usd', event_type='estimate_fee_waiver'), 2)"
      - r_warranty_outstanding: "RND(XSUM('warranty','warranty_ledger','amount_usd', event_type='warranty_charge') - XSUM('warranty','warranty_ledger','amount_usd', event_type='warranty_charge_payment') - XSUM('warranty','warranty_ledger','amount_usd', event_type='warranty_charge_waiver'), 2)"
      - r_other_desk_hold: "r_estimate_outstanding if r_estimate_outstanding > 0 else (r_warranty_outstanding if (r_estimate_outstanding <= 0 and r_warranty_outstanding > 0) else 0)"
      - result: "RND(MN(r_refund_cap, MX(0, r_overpaid - r_committed - r_reinspection_reserve - r_deductible_hold - r_betterment_hold - r_clearing_hold - r_other_desk_hold)), 2)"
    compute_basis:
      r_charges: "When the customer's payments and credits on the repair order exceed its customer charges and the refunds already made, the excess is refunded against one payment"
      r_paid: "When the customer's payments and credits on the repair order exceed its customer charges and the refunds already made, the excess is refunded against one payment"
      r_overpaid: "When the customer's payments and credits on the repair order exceed its customer charges and the refunds already made, the excess is refunded against one payment"
      r_committed: "The standard refund is that excess less the price of every signed customer-pay addition consent whose charge is not yet posted,"
      r_latest_card_date: "the most recent card payment, when a card payment was made no more than the card refund window days before today;"
      r_latest_ach_date: "otherwise the most recent ACH payment, when one was made at least the ACH return days before today;"
      r_card_in_window: "when a card payment was made no more than the card refund window days before today;"
      r_ach_settled: "when one was made at least the ACH return days before today;"
      r_refund_cap: "The payment refunded follows the payment methods on the repair order: the most recent card payment, when a card payment was made no more than the card refund window days before today; otherwise the most recent ACH payment, when one was made at least the ACH return days before today; otherwise the most recent customer payment; days are calendar days from the payment's entry date to today."
      r_undecided: "A supplement is undecided while the latest submitted supplement number is above the latest decided one."
      r_undecided_route: "the field reserve when the undecided supplement is on field reinspection, the desk reserve when it is on desk review,"
      r_reinspection_reserve: "While a supplement is undecided a reinspection reserve is held: the field reserve when the undecided supplement is on field reinspection, the desk reserve when it is on desk review, and nothing when no supplement is undecided."
      r_undecided_amount: "the undecided supplement's full amount when the unassessed deductible is at least that amount,"
      r_remaining_deductible: "the unassessed deductible is the stated deductible less the deductible charges posted."
      r_deductible_hold: "While a supplement is undecided and part of the stated deductible is still unassessed, the deductible it could still raise is held: the undecided supplement's full amount when the unassessed deductible is at least that amount, the whole unassessed deductible when it is smaller, and nothing when no supplement is undecided or no deductible is left unassessed;"
      r_undecided_betterment: "while a supplement is undecided, the betterment expected on it;"
      r_uncharged_betterment: "when none is undecided, the betterment the insurer applied on decided supplements beyond the betterment charges posted;"
      r_betterment_hold: "Betterment that may still fall to the customer is held: while a supplement is undecided, the betterment expected on it; when none is undecided, the betterment the insurer applied on decided supplements beyond the betterment charges posted; otherwise nothing."
      r_latest_check_date: "the most recent check payment when it was received fewer than the check clearing days before today;"
      r_clearing_hold: "Funds that are not yet final are held: the most recent check payment when it was received fewer than the check clearing days before today; otherwise the most recent ACH payment when it was received fewer than the ACH return days before today; otherwise nothing."
      r_estimate_outstanding: "the customer's estimate-stage charges left after payments and waivers when there are any;"
      r_warranty_outstanding: "otherwise the customer's warranty charges left after payments and waivers;"
      r_other_desk_hold: "Charges the customer still owes at other network desks are held: the customer's estimate-stage charges left after payments and waivers when there are any; otherwise the customer's warranty charges left after payments and waivers; otherwise nothing."
      result: "The refund is the excess less the price of the signed customer-pay addition consents not yet charged, less every amount held, never below zero and never more than the payment refunded, rounded to the cent once at the end."
    factors:
      - id: refunded_payment_choice
        effect: method
        decides: r_refund_cap
        bindings: [r_latest_card_date, r_latest_ach_date, r_card_in_window, r_ach_settled, r_refund_cap]
        ladder:
          - when: "a card payment exists and the most recent one was made no more than the card refund window days before today"
            method: "the refund is returned against the most recent card payment and capped at it"
          - when: "no card payment lies within that window and an ACH payment was made at least the ACH return days before today"
            method: "the refund is returned against the most recent ACH payment and capped at it"
          - when: "otherwise"
            method: "the refund is returned against the most recent customer payment and capped at it"
        baseline:
          r_refund_cap: "LATEST('claim_ledger','amount_usd', date_field='entry_date', event_type='claim_customer_payment')"
        evidence: [history, date]
        cross_difficulty: null
      - id: reinspection_reserve
        effect: parameter
        decides: r_reinspection_reserve
        bindings: [r_undecided, r_undecided_route, r_reinspection_reserve]
        ladder:
          - when: "a supplement is undecided and it is on field reinspection"
            value: "K('field_reserve_usd')"
          - when: "a supplement is undecided and it is on desk review"
            value: "K('desk_reserve_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          r_reinspection_reserve: "0"
        evidence: [history]
        cross_difficulty: null
      - id: deductible_exposure_hold
        effect: parameter
        decides: r_deductible_hold
        bindings: [r_undecided_amount, r_remaining_deductible, r_deductible_hold]
        ladder:
          - when: "a supplement is undecided and the unassessed deductible is at least its amount"
            value: "the undecided supplement's amount"
          - when: "a supplement is undecided and the unassessed deductible is above zero but smaller than its amount"
            value: "the whole unassessed deductible"
          - when: "otherwise"
            value: "0"
        baseline:
          r_deductible_hold: "0"
        evidence: [history]
        cross_difficulty: null
      - id: betterment_exposure_hold
        effect: parameter
        decides: r_betterment_hold
        bindings: [r_undecided_betterment, r_uncharged_betterment, r_betterment_hold]
        ladder:
          - when: "a supplement is undecided and betterment is expected on it"
            value: "the expected betterment of the undecided supplement"
          - when: "no supplement is undecided and the insurer applied more betterment on decided supplements than the betterment charges posted"
            value: "the applied betterment not yet charged"
          - when: "otherwise"
            value: "0"
        baseline:
          r_betterment_hold: "0"
        evidence: [history]
        cross_difficulty: null
      - id: funds_clearing_hold
        effect: parameter
        decides: r_clearing_hold
        bindings: [r_latest_check_date, r_clearing_hold]
        ladder:
          - when: "the most recent check payment was received fewer than the check clearing days before today"
            value: "that check payment"
          - when: "no such check and the most recent ACH payment was received fewer than the ACH return days before today"
            value: "that ACH payment"
          - when: "otherwise"
            value: "0"
        baseline:
          r_clearing_hold: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: other_desk_charges_hold
        effect: parameter
        decides: r_other_desk_hold
        bindings: [r_estimate_outstanding, r_warranty_outstanding, r_other_desk_hold]
        ladder:
          - when: "the customer has estimate-stage charges left after payments and waivers"
            value: "those estimate-stage charges"
          - when: "no estimate-stage charge is left and the customer has warranty charges left after payments and waivers"
            value: "those warranty charges"
          - when: "otherwise"
            value: "0"
        baseline:
          r_other_desk_hold: "0"
        evidence: [cross_category, history]
        cross_difficulty: estimate
    baseline:
      rule: >-
        When the customer's payments and credits on the repair order exceed its customer charges and the refunds already
        made, the excess is refunded against one payment and goes back to that payment's method within the class's refund
        processing business days. The standard refund is that excess less the price of every signed customer-pay addition
        consent whose charge is not yet posted, returned against the most recent customer payment and never more than that
        payment, rounded to the cent.
      params: [refund_processing_business_days]
    inputs:
      history:
        - {table: claim_ledger, aggregate: sum, field: amount_usd, filters: {event_type: claim_customer_payment}}
        - {table: claim_ledger, aggregate: sum, field: amount_usd, filters: {event_type: claim_customer_charge}}
        - {table: claim_ledger, aggregate: latest, field: amount_usd, filters: {event_type: claim_customer_payment, payment_method: card}}
        - {table: claim_consents, aggregate: sum, field: amount_usd, filters: {consent_type: customer_pay_addition, consent_status: signed}}
        - {table: claim_supplements, aggregate: latest, field: supplement_number, filters: {event_type: claim_supplement_submit}}
        - {category: estimate, table: estimate_events, aggregate: sum, field: amount_usd, filters: {event_type: estimate_fee_charge}}
        - {category: warranty, table: warranty_ledger, aggregate: sum, field: amount_usd, filters: {event_type: warranty_charge}}
      cross_category: [estimate, warranty]
