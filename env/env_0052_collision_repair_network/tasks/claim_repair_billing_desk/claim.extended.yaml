- id: claim_evt_delivery
  subject:
  - claim_deliver
  rule: A completed vehicle is released to the customer only when the customer's share is settled. The repair order's
    customer balance is zero. The deductible, betterment, customer-pay additions and any storage are all part of
    that balance (claim_msr_customer_balance); the insurer's payment is never a condition of release. Payment may
    be made by any of the class's accepted_payment_methods. Release issues the warranty plan set by warranty_plan_issued
    for the class.
  eligibility:
  - id: customer_balance_zero
    applies_to:
    - claim_deliver
    kind: authorization
    condition: The repair order's customer balance is zero.
    evidence_fields:
    - claim_ledger.claim_repair_id
    - claim_ledger.event_type
    - claim_ledger.amount_usd
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_ledger.claim_repair_id
      action_bindings:
        claim_ledger.claim_repair_id: claim_repair_id
  params:
    per_tier:
      Express Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        warranty_plan_issued: =warranty_plan_issued
      Standard Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        warranty_plan_issued: =warranty_plan_issued
      Major Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        warranty_plan_issued: =warranty_plan_issued
      Structural Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        warranty_plan_issued: =warranty_plan_issued
      Certified Structural Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        warranty_plan_issued: =warranty_plan_issued
      Aluminum Certified Structural Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        warranty_plan_issued: =warranty_plan_issued
  measures:
  - claim_msr_customer_balance
- id: claim_evt_storage
  subject:
  - claim_customer_charge
  rule: Storage is charged to the customer when a completed vehicle is not collected in time, and when a withdrawn
    vehicle is not collected in time after cancellation. The vehicle is still at the center more than the tier's
    pickup free days after the vehicle-ready date. Days are calendar days counted from the vehicle-ready date (or
    the withdrawal date) as day zero; the first billed day is the day after the last free day. Storage is billed
    in one storage charge on the collection date, from period_start_date to period_end_date inclusive, at storage_daily_rate_usd
    per day. The desk may credit storage as goodwill up to goodwill_credit_authority_usd per repair order (claim_msr_goodwill_credited);
    beyond that the request is declined. Storage on a total-loss vehicle is never charged to the customer; it is
    billed to the insurer under claim_evt_total_loss.
  eligibility:
  - id: beyond_pickup_free_days
    applies_to:
    - claim_customer_charge
    kind: time
    condition: The vehicle is still at the center more than the tier's pickup free days after the vehicle-ready
      date.
    evidence_fields:
    - claim_repairs.completed_date
    - claim_repairs.claim_repair_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_repairs.claim_repair_id
      action_bindings:
        claim_repairs.claim_repair_id: claim_repair_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the vehicle-ready date
      anchor_source: claim_repairs.completed_date
      relation: not_before
      duration_source: variants.pickup_free_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the vehicle-ready date (or the withdrawal date) as day
        zero; the first billed day is the day after the last free day.
      boundary: exclusive
  params:
    per_tier:
      Express Claim Repair:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Standard Claim Repair:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Major Claim Repair:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Structural Claim Repair:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Certified Structural Claim Repair:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
      Aluminum Certified Structural Claim Repair:
        pickup_free_days: =pickup_free_days
        storage_daily_rate_usd: =storage_daily_rate_usd
        goodwill_credit_authority_usd: =goodwill_credit_authority_usd
  formula:
    when: charge_type == 'storage'
    billable_days: period_end_date - period_start_date + 1
    amount_usd: billable_days * storage_daily_rate_usd
  measures:
  - claim_msr_goodwill_credited
- id: claim_evt_customer_pay_additions
  subject:
  - claim_customer_charge
  - claim_customer_credit
  rule: 'Work the insurer does not pay for may be added to the repair order at the customer''s expense in two forms:
    an original-equipment upgrade of an insurer-specified part, allowed only where customer_pay_upgrade_allowed
    is true, charged at the difference between the two part prices on the estimate; and repair of damage unrelated
    to the claim (or of operations the insurer denied), charged at the amount on the written customer-pay estimate
    line, with the unrelated work on one repair order kept within unrelated_damage_max_labor_hours (claim_msr_unrelated_hours).
    The customer''s customer-pay addition consent for that amount is signed. The charge carries the consent_id.
    An addition the customer withdraws before its parts are ordered or its labor starts is credited in full with
    credit_reason addition_withdrawn; after that point it stays due. Customer-pay additions are never billed to
    the insurer and never reduce the deductible.'
  eligibility:
  - id: addition_consent_signed
    applies_to:
    - claim_customer_charge
    kind: authorization
    condition: The customer's customer-pay addition consent for that amount is signed.
    evidence_fields:
    - claim_consents.consent_id
    - claim_consents.consent_type
    - claim_consents.consent_status
    - claim_consents.amount_usd
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_consents.consent_id
      action_bindings:
        claim_consents.consent_id: consent_id
  params:
    per_tier:
      Express Claim Repair:
        customer_pay_upgrade_allowed: =customer_pay_upgrade_allowed
        unrelated_damage_max_labor_hours: =unrelated_damage_max_labor_hours
      Standard Claim Repair:
        customer_pay_upgrade_allowed: =customer_pay_upgrade_allowed
        unrelated_damage_max_labor_hours: =unrelated_damage_max_labor_hours
      Major Claim Repair:
        customer_pay_upgrade_allowed: =customer_pay_upgrade_allowed
        unrelated_damage_max_labor_hours: =unrelated_damage_max_labor_hours
      Structural Claim Repair:
        customer_pay_upgrade_allowed: =customer_pay_upgrade_allowed
        unrelated_damage_max_labor_hours: =unrelated_damage_max_labor_hours
      Certified Structural Claim Repair:
        customer_pay_upgrade_allowed: =customer_pay_upgrade_allowed
        unrelated_damage_max_labor_hours: =unrelated_damage_max_labor_hours
      Aluminum Certified Structural Claim Repair:
        customer_pay_upgrade_allowed: =customer_pay_upgrade_allowed
        unrelated_damage_max_labor_hours: =unrelated_damage_max_labor_hours
  measures:
  - claim_msr_unrelated_hours
- id: claim_evt_customer_payments
  subject:
  - claim_customer_payment
  - claim_customer_refund
  - claim_customer_credit
  rule: Customer payments reduce the repair order's customer balance and may be made at any time before or at delivery
    by the class's accepted_payment_methods; financing through the network's partner is offered only where financing_available
    is true and the balance being financed is at least financing_min_balance_usd. When payments exceed what is owed
    (claim_msr_customer_balance below zero), the excess is refunded to the method of the payment being refunded
    within refund_processing_business_days business days, one refund per payment and never more than that payment.
    The refund names the payment it returns. Credits name the charge they reduce and never exceed it; billing_error
    corrects a charge posted at the wrong amount, and total_loss_release, repair_withdrawn, addition_withdrawn and
    goodwill follow claim_evt_total_loss, claim_evt_withdrawal, claim_evt_customer_pay_additions and claim_evt_storage.
  eligibility:
  - id: refund_names_payment
    applies_to:
    - claim_customer_refund
    kind: dedup
    condition: The refund names the payment it returns.
    evidence_fields:
    - claim_ledger.source_entry_id
    - claim_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_ledger.source_entry_id
      action_bindings:
        claim_ledger.source_entry_id: source_entry_id
    dedup_contract:
      table: claim_ledger
      mode: separate_record
      object_bindings:
        source_entry_id: source_entry_id
      duplicate_filters:
        event_type:
        - claim_customer_refund
      distinct_fields: []
  params:
    per_tier:
      Express Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        financing_available: =financing_available
        financing_min_balance_usd: =financing_min_balance_usd
        refund_processing_business_days: =refund_processing_business_days
      Standard Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        financing_available: =financing_available
        financing_min_balance_usd: =financing_min_balance_usd
        refund_processing_business_days: =refund_processing_business_days
      Major Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        financing_available: =financing_available
        financing_min_balance_usd: =financing_min_balance_usd
        refund_processing_business_days: =refund_processing_business_days
      Structural Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        financing_available: =financing_available
        financing_min_balance_usd: =financing_min_balance_usd
        refund_processing_business_days: =refund_processing_business_days
      Certified Structural Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        financing_available: =financing_available
        financing_min_balance_usd: =financing_min_balance_usd
        refund_processing_business_days: =refund_processing_business_days
      Aluminum Certified Structural Claim Repair:
        accepted_payment_methods: =accepted_payment_methods
        financing_available: =financing_available
        financing_min_balance_usd: =financing_min_balance_usd
        refund_processing_business_days: =refund_processing_business_days
  measures:
  - claim_msr_customer_balance
- id: claim_evt_insurer_settlement
  subject:
  - claim_insurer_payment
  - claim_insurer_adjustment
  - claim_close
  rule: Insurer remittances reduce the insurer balance and are recorded under the insurer's own payment_reference.
    When a remittance leaves an insurer balance above zero (a short pay), the shortfall stays owed while the center
    supplies the insurer the documentation it asks for; a shortfall is written off as short_pay_writeoff only when
    it is no more than the short_pay_writeoff_usd of the insurer's active carrier agreement, and never by moving
    it to the customer; a larger shortfall stays owed. A repair order closes once it has been delivered (or, for
    a total loss, once the vehicle has been released to the insurer) and both balances are zero. Both the customer
    balance and the insurer balance on the repair order are zero. Billing corrections in either direction name the
    entry they correct.
  eligibility:
  - id: both_balances_zero
    applies_to:
    - claim_close
    kind: authorization
    condition: Both the customer balance and the insurer balance on the repair order are zero.
    evidence_fields:
    - claim_ledger.claim_repair_id
    - claim_ledger.event_type
    - claim_ledger.amount_usd
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_ledger.claim_repair_id
      action_bindings:
        claim_ledger.claim_repair_id: claim_repair_id
  measures:
  - claim_msr_customer_balance
  - claim_msr_insurer_balance
- id: claim_evt_withdrawal
  subject:
  - claim_cancel
  - claim_customer_charge
  - claim_customer_credit
  - claim_insurer_adjustment
  rule: Withdrawing the vehicle is the customer's decision and is possible only before work starts (from assigned
    or authorized). The customer's vehicle withdrawal consent on the repair order is signed. When a teardown was
    completed, the customer is charged withdrawal_teardown_hours at withdrawal_labor_rate_usd as a withdrawal_teardown
    charge, doubled where reassembly_required_on_withdrawal is true because the vehicle is put back together before
    release; no teardown charge applies when none was done. On withdrawal every deductible and betterment charge
    already assessed is credited in full with credit_reason repair_withdrawn, and one withdrawal_reversal adjustment,
    naming the original_estimate approval, brings the insurer balance to zero (no adjustment posts when it is already
    zero). The insurer is told of the withdrawal and the rental partner receives a repair_cancelled notice.
  eligibility:
  - id: withdrawal_consent_signed
    applies_to:
    - claim_cancel
    kind: authorization
    condition: The customer's vehicle withdrawal consent on the repair order is signed.
    evidence_fields:
    - claim_consents.claim_repair_id
    - claim_consents.consent_type
    - claim_consents.consent_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_consents.claim_repair_id
      action_bindings:
        claim_consents.claim_repair_id: claim_repair_id
  params:
    per_tier:
      Express Claim Repair:
        withdrawal_teardown_hours: =withdrawal_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        reassembly_required_on_withdrawal: =reassembly_required_on_withdrawal
      Standard Claim Repair:
        withdrawal_teardown_hours: =withdrawal_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        reassembly_required_on_withdrawal: =reassembly_required_on_withdrawal
      Major Claim Repair:
        withdrawal_teardown_hours: =withdrawal_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        reassembly_required_on_withdrawal: =reassembly_required_on_withdrawal
      Structural Claim Repair:
        withdrawal_teardown_hours: =withdrawal_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        reassembly_required_on_withdrawal: =reassembly_required_on_withdrawal
      Certified Structural Claim Repair:
        withdrawal_teardown_hours: =withdrawal_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        reassembly_required_on_withdrawal: =reassembly_required_on_withdrawal
      Aluminum Certified Structural Claim Repair:
        withdrawal_teardown_hours: =withdrawal_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        reassembly_required_on_withdrawal: =reassembly_required_on_withdrawal
  formula:
    when: charge_type == 'withdrawal_teardown'
    amount_usd: withdrawal_teardown_hours * withdrawal_labor_rate_usd * (2 if reassembly_required_on_withdrawal
      else 1)
- id: claim_evt_total_loss
  subject:
  - claim_total_loss
  - claim_insurer_approval
  - claim_insurer_adjustment
  - claim_customer_credit
  rule: A total loss is the insurer's determination, recorded as received; the desk never declares or disputes one.
    On the total-loss date every deductible and betterment charge is credited to the customer with credit_reason
    total_loss_release (the insurer applies the deductible in its own settlement), and one total_loss_reversal adjustment,
    naming the original_estimate approval, brings the insurer balance on the repair approvals to zero (none posts
    when no approval was booked). The insurer is then billed a total_loss_charges approval for total_loss_teardown_hours
    of disassembly at withdrawal_labor_rate_usd where a teardown was done, plus storage at total_loss_storage_daily_rate_usd
    (lowered to the storage_rate_cap_usd of the insurer's active carrier agreement when that cap is lower) for every
    calendar day the vehicle stays after total_loss_removal_free_days counted from the total-loss date as day zero.
    Customer-pay additions already performed stay due from the customer. The customer may collect personal belongings,
    but release of the vehicle itself is arranged with the insurer.
  eligibility: []
  params:
    per_tier:
      Express Claim Repair:
        total_loss_teardown_hours: =total_loss_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        total_loss_storage_daily_rate_usd: =total_loss_storage_daily_rate_usd
        total_loss_removal_free_days: =total_loss_removal_free_days
      Standard Claim Repair:
        total_loss_teardown_hours: =total_loss_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        total_loss_storage_daily_rate_usd: =total_loss_storage_daily_rate_usd
        total_loss_removal_free_days: =total_loss_removal_free_days
      Major Claim Repair:
        total_loss_teardown_hours: =total_loss_teardown_hours
        withdrawal_labor_rate_usd: =withdrawal_labor_rate_usd
        total_loss_storage_daily_rate_usd: =total_loss_storage_daily_rate_usd
        total_loss_removal_free_days: =total_loss_removal_free_days
      Structural Claim Repair:
        total_loss_teardown_hours: =total_loss_teardown_hours
