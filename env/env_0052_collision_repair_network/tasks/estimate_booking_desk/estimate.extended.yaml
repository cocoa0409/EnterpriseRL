# ============================================================================
# extended_policies (estimate_booking_desk)
# ============================================================================
extended_policies:
- id: estimate_ext_storage_statement
  base_policy_refs: [estimate_evt_service_fees, estimate_evt_storage, estimate_evt_revision, estimate_evt_check_in_and_write]
  overwrite:
  - base_policy: estimate_evt_storage
    superseded_clause: >-
      Storage is billed in one storage charge on the release date, covering period_start_date to period_end_date
      inclusive at storage_daily_rate_usd per calendar day.
    replaced_by: >-
      A storage statement bills the storage accrued on a vehicle that stays at the center after its teardown estimate,
      when the owner or the insurer asks for a statement before the vehicle leaves; it is posted as one storage charge
      dated on the statement date.
  - base_policy: estimate_evt_storage
    superseded_clause: >-
      The storage_free_days run from the estimate written date as day zero; the first billed day is the day after
      the last free day and the last billed day is the vehicle_released_date.
    replaced_by: >-
      The first billed day of a storage statement is the day after the last free storage day and its last billed day
      is the statement date, both days included.
  trigger: on_request
  subject: [estimate_fee_charge]
  computes: amount_usd
  target_tool: post_storage_statement_c4ddc4f2
  params:
    quarantine_rate_usd: 85.0
    isolation_rate_usd: 70.0
    two_reinspection_free_days: 4
    one_reinspection_free_days: 2
    long_delay_late_days: 4
    long_delay_free_days: 3
    short_delay_late_days: 2
    short_delay_free_days: 1
    loyalty_tenure_months: 24
    tenured_loyalty_free_days: 2
    recent_loyalty_free_days: 1
    long_stay_threshold_days: 7
    declined_long_stay_multiple: 1.5
    expired_long_stay_multiple: 1.25
  rule: >
    A storage statement bills the storage accrued on a vehicle that stays at the center after its teardown estimate,
    when the owner or the insurer asks for a statement before the vehicle leaves; it is posted as one storage charge
    dated on the statement date. The free storage days run from the estimate written date as day zero and are counted
    as calendar days. The first billed day of a storage statement is the day after the last free storage day and its
    last billed day is the statement date, both days included. The storage statement charge is the billed days times
    the storage daily rate, rounded to the cent once on the final figure. The standard free storage days are the
    tier's storage_free_days and the standard storage daily rate is the tier's storage_daily_rate_usd.
    The storage daily rate follows how the vehicle is held: a vehicle with high-voltage damage recorded on the booking that arrived on a network-arranged tow, a tow-in charge having been posted on the booking whether or not it has since been settled, came in unable to be driven and is held in the quarantine bay at quarantine_rate_usd per day; a vehicle with high-voltage damage recorded on the booking and no tow-in charge ever posted on the booking was driven or carried in and is held in the isolation row at isolation_rate_usd per day; every other vehicle is billed at the tier's storage_daily_rate_usd.
    Insurer re-inspections lengthen the free storage period: a booking carrying two or more estimate revisions adds
    two_reinspection_free_days free storage days, a booking carrying exactly one estimate revision adds
    one_reinspection_free_days, and a booking with no estimate revision adds none.
    A late write-up lengthens the free storage period: the write-up lateness is the calendar days from the check-in
    date to the estimate written date less the tier's estimate_turnaround_business_days; a write-up lateness of at
    least long_delay_late_days days adds long_delay_free_days free storage days, a write-up lateness of at least
    short_delay_late_days days but under long_delay_late_days days adds short_delay_free_days, and a smaller write-up
    lateness adds none.
    A returning owner's tenure lengthens the free storage period: an owner holding an active network workmanship
    warranty issued at least loyalty_tenure_months whole months before the statement date adds
    tenured_loyalty_free_days free storage days, an owner whose active network workmanship warranty was issued fewer
    than loyalty_tenure_months whole months before the statement date adds recent_loyalty_free_days, and an owner
    holding no active network workmanship warranty adds none.
    The free storage days of a statement are the tier's storage_free_days plus the days added for insurer
    re-inspections, for a late write-up and for a returning owner's tenure.
    Which days count as free storage days follows how the vehicle can leave the lot: for a vehicle recorded as not drivable that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, only Monday to Friday count as free storage days and Saturdays and Sundays are passed over, because the network releases a vehicle to a flatbed on business days only; for a vehicle recorded as not drivable with no tow-in charge ever posted on the booking, which came in on the owner's own carrier, Monday to Saturday count and Sundays are passed over, because that carrier may also collect on a Saturday; for every other vehicle every calendar day counts.
    Long stays are billed at a long-stay multiple: on a booking whose decline request is confirmed, every billed day
    after the long_stay_threshold_days-th billed day is billed at declined_long_stay_multiple times the storage daily
    rate; on a booking in expired status, every billed day after the long_stay_threshold_days-th billed day is billed at
    expired_long_stay_multiple times the storage daily rate; on every other booking each billed day is billed once at
    the storage daily rate. The long-stay multiple applies to the storage daily rate of the statement and only to the
    billed days after the threshold, the earlier billed days staying at the single rate.
  baseline:
    rule: >-
      The free storage days run from the estimate written date as day zero and are counted as calendar days. The first
      billed day of a storage statement is the day after the last free storage day and its last billed day is the
      statement date, both days included. The storage statement charge is the billed days times the storage daily rate,
      rounded to the cent once on the final figure. The standard free storage days are the tier's storage_free_days and
      the standard storage daily rate is the tier's storage_daily_rate_usd.
    params: [storage_free_days, storage_daily_rate_usd]
  prerequisite: []
  cross_category:
  - category: warranty
    as: branch
    reads: [status, issued_date]
    note: The tenure of the owner's active network workmanship warranty decides how many free storage days a returning owner adds.
  compute:
  - rate_tow_arrivals: "COUNT('estimate_events', event_type='estimate_fee_charge', fee_type='tow_in')"
  - storage_day_rate: "K('quarantine_rate_usd') if (F('high_voltage_damage') == True and rate_tow_arrivals >= 1) else (K('isolation_rate_usd') if (F('high_voltage_damage') == True and rate_tow_arrivals == 0) else P('storage_daily_rate_usd'))"
  - insurer_reinspections: "COUNT('estimate_events', event_type='estimate_revise')"
  - reinspection_free_days: "K('two_reinspection_free_days') if insurer_reinspections >= 2 else (K('one_reinspection_free_days') if insurer_reinspections == 1 else 0)"
  - writeup_lateness_days: "DAYS(F('checked_in_date'), F('estimate_written_date')) - P('estimate_turnaround_business_days')"
  - writeup_free_days: "K('long_delay_free_days') if writeup_lateness_days >= K('long_delay_late_days') else (K('short_delay_free_days') if writeup_lateness_days >= K('short_delay_late_days') else 0)"
  - warranty_issued_date: "CFIELD('warranty', 'issued_date', status='active')"
  - tenure_free_days: "(K('tenured_loyalty_free_days') if MONTHS(warranty_issued_date, NOW) >= K('loyalty_tenure_months') else K('recent_loyalty_free_days')) if warranty_issued_date else 0"
  - free_storage_days: "P('storage_free_days') + reinspection_free_days + writeup_free_days + tenure_free_days"
  - tow_in_charges: "COUNT('estimate_events', event_type='estimate_fee_charge', fee_type='tow_in')"
  - written_weekday: "DAYS('2026-01-05', F('estimate_written_date')) % 7"
  - free_period_span_days: "(free_storage_days + 2 * ((MN(written_weekday, 4) + free_storage_days) // 5) - MX(0, written_weekday - 4)) if (tow_in_charges >= 1 and F('drivable') == False) else ((free_storage_days + (MN(written_weekday, 5) + free_storage_days) // 6 - MX(0, written_weekday - 5)) if (tow_in_charges == 0 and F('drivable') == False) else free_storage_days)"
  - billed_days: "MX(0, DAYS(F('estimate_written_date'), NOW) - free_period_span_days)"
  - decline_confirmations: "COUNT('estimate_requests', request_type='decline_repair', request_status='confirmed')"
  - long_stay_multiple: "K('declined_long_stay_multiple') if (decline_confirmations >= 1 and billed_days > K('long_stay_threshold_days')) else (K('expired_long_stay_multiple') if (F('status') == 'expired' and billed_days > K('long_stay_threshold_days')) else 1)"
  - long_stay_days: "MX(0, billed_days - K('long_stay_threshold_days'))"
  - result: "RND(storage_day_rate * (billed_days + long_stay_days * (long_stay_multiple - 1)), 2)"
  compute_basis:
    rate_tow_arrivals: "a vehicle with high-voltage damage recorded on the booking that arrived on a network-arranged tow, a tow-in charge having been posted on the booking whether or not it has since been settled, came in unable to be driven and is held in the quarantine bay at quarantine_rate_usd per day"
    storage_day_rate: "The storage daily rate follows how the vehicle is held: a vehicle with high-voltage damage recorded on the booking that arrived on a network-arranged tow, a tow-in charge having been posted on the booking whether or not it has since been settled, came in unable to be driven and is held in the quarantine bay at quarantine_rate_usd per day; a vehicle with high-voltage damage recorded on the booking and no tow-in charge ever posted on the booking was driven or carried in and is held in the isolation row at isolation_rate_usd per day; every other vehicle is billed at the tier's storage_daily_rate_usd."
    insurer_reinspections: "a booking carrying two or more estimate revisions adds two_reinspection_free_days free storage days, a booking carrying exactly one estimate revision adds one_reinspection_free_days, and a booking with no estimate revision adds none."
    reinspection_free_days: "Insurer re-inspections lengthen the free storage period: a booking carrying two or more estimate revisions adds two_reinspection_free_days free storage days, a booking carrying exactly one estimate revision adds one_reinspection_free_days, and a booking with no estimate revision adds none."
    writeup_lateness_days: "the write-up lateness is the calendar days from the check-in date to the estimate written date less the tier's estimate_turnaround_business_days"
    writeup_free_days: "a write-up lateness of at least long_delay_late_days days adds long_delay_free_days free storage days, a write-up lateness of at least short_delay_late_days days but under long_delay_late_days days adds short_delay_free_days, and a smaller write-up lateness adds none."
    warranty_issued_date: "an owner holding an active network workmanship warranty issued at least loyalty_tenure_months whole months before the statement date adds tenured_loyalty_free_days free storage days"
    tenure_free_days: "A returning owner's tenure lengthens the free storage period: an owner holding an active network workmanship warranty issued at least loyalty_tenure_months whole months before the statement date adds tenured_loyalty_free_days free storage days, an owner whose active network workmanship warranty was issued fewer than loyalty_tenure_months whole months before the statement date adds recent_loyalty_free_days, and an owner holding no active network workmanship warranty adds none."
    free_storage_days: "The free storage days of a statement are the tier's storage_free_days plus the days added for insurer re-inspections, for a late write-up and for a returning owner's tenure."
    tow_in_charges: "for a vehicle recorded as not drivable that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, only Monday to Friday count as free storage days and Saturdays and Sundays are passed over"
    written_weekday: "The free storage days run from the estimate written date as day zero"
    free_period_span_days: "Which days count as free storage days follows how the vehicle can leave the lot: for a vehicle recorded as not drivable that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, only Monday to Friday count as free storage days and Saturdays and Sundays are passed over, because the network releases a vehicle to a flatbed on business days only; for a vehicle recorded as not drivable with no tow-in charge ever posted on the booking, which came in on the owner's own carrier, Monday to Saturday count and Sundays are passed over, because that carrier may also collect on a Saturday; for every other vehicle every calendar day counts."
    billed_days: "The first billed day of a storage statement is the day after the last free storage day and its last billed day is the statement date, both days included."
    decline_confirmations: "on a booking whose decline request is confirmed, every billed day after the long_stay_threshold_days-th billed day is billed at declined_long_stay_multiple times the storage daily rate"
    long_stay_multiple: "Long stays are billed at a long-stay multiple: on a booking whose decline request is confirmed, every billed day after the long_stay_threshold_days-th billed day is billed at declined_long_stay_multiple times the storage daily rate; on a booking in expired status, every billed day after the long_stay_threshold_days-th billed day is billed at expired_long_stay_multiple times the storage daily rate; on every other booking each billed day is billed once at the storage daily rate."
    long_stay_days: "The long-stay multiple applies to the storage daily rate of the statement and only to the billed days after the threshold, the earlier billed days staying at the single rate."
    result: "The storage statement charge is the billed days times the storage daily rate, rounded to the cent once on the final figure."
  factors:
  - id: storage_holding_rate
    effect: parameter
    decides: storage_day_rate
    bindings: [rate_tow_arrivals, storage_day_rate]
    ladder:
    - when: "high-voltage damage recorded on the booking and a tow-in charge posted on the booking"
      value: "K('quarantine_rate_usd')"
    - when: "high-voltage damage recorded on the booking and no tow-in charge ever posted on the booking"
      value: "K('isolation_rate_usd')"
    - when: "otherwise"
      value: "P('storage_daily_rate_usd')"
    baseline:
      storage_day_rate: "P('storage_daily_rate_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: reinspection_free_days
    effect: parameter
    decides: reinspection_free_days
    bindings: [insurer_reinspections, reinspection_free_days]
    ladder:
    - when: "two or more estimate revisions on the booking"
      value: "K('two_reinspection_free_days')"
    - when: "exactly one estimate revision on the booking"
      value: "K('one_reinspection_free_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      reinspection_free_days: "0"
    evidence: [history]
    cross_difficulty: null
  - id: writeup_delay_free_days
    effect: parameter
    decides: writeup_free_days
    bindings: [writeup_lateness_days, writeup_free_days]
    ladder:
    - when: "write-up lateness of at least long_delay_late_days days"
      value: "K('long_delay_free_days')"
    - when: "write-up lateness of at least short_delay_late_days days but under long_delay_late_days days"
      value: "K('short_delay_free_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      writeup_free_days: "0"
    evidence: [date]
    cross_difficulty: null
  - id: owner_tenure_free_days
    effect: parameter
    decides: tenure_free_days
    bindings: [warranty_issued_date, tenure_free_days]
    ladder:
    - when: "an active network workmanship warranty issued at least loyalty_tenure_months whole months before the statement date"
      value: "K('tenured_loyalty_free_days')"
    - when: "an active network workmanship warranty issued fewer than loyalty_tenure_months whole months before the statement date"
      value: "K('recent_loyalty_free_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      tenure_free_days: "0"
    evidence: [cross_category, date]
    cross_difficulty: warranty
  - id: free_day_calendar
    effect: method
    decides: free_period_span_days
    bindings: [tow_in_charges, written_weekday, free_period_span_days]
    ladder:
    - when: "the vehicle is recorded as not drivable and a tow-in charge was posted on the booking"
      method: "free storage days are counted on Monday to Friday only, Saturdays and Sundays passed over"
    - when: "the vehicle is recorded as not drivable and no tow-in charge was ever posted on the booking"
      method: "free storage days are counted on Monday to Saturday, Sundays passed over"
    - when: "otherwise"
      method: "free storage days are counted on every calendar day"
    baseline:
      free_period_span_days: "free_storage_days"
    evidence: [history, date]
    cross_difficulty: null
  - id: long_stay_multiple
    effect: parameter
    decides: long_stay_multiple
    bindings: [decline_confirmations, long_stay_multiple, long_stay_days]
    ladder:
    - when: "decline request confirmed and more than long_stay_threshold_days billed days"
      value: "K('declined_long_stay_multiple')"
    - when: "booking in expired status and more than long_stay_threshold_days billed days"
      value: "K('expired_long_stay_multiple')"
    - when: "otherwise"
      value: "1"
    baseline:
      long_stay_multiple: "1"
    evidence: [history]
    cross_difficulty: null
  inputs:
    history:
    - {table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_revise}}
    - {table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_fee_charge, fee_type: tow_in}}
    - {table: estimate_requests, aggregate: count, field: request_id, filters: {request_type: decline_repair, request_status: confirmed}}
    cross_category: [warranty]
- id: estimate_ext_storage_goodwill
  base_policy_refs: [estimate_evt_fee_settlement, estimate_evt_reschedule, estimate_evt_decline_and_release]
  overwrite:
  - base_policy: estimate_evt_fee_settlement
    superseded_clause: >-
      goodwill: the desk may waive at most goodwill_waiver_authority_usd per booking across all charges
      (estimate_msr_goodwill_waived); a request beyond that authority is declined at the desk.
    replaced_by: >-
      The storage goodwill is the goodwill figure, rounded to the cent once at the end, but never more than the goodwill authority left on the booking nor more than the storage charge's outstanding amount; the goodwill figure is the goodwill percentage of the storage statement charge.
  trigger: state_due
  subject: [estimate_fee_waiver]
  computes: amount_usd
  target_tool: waive_storage_goodwill_2cb3c7ba
  params:
    standard_goodwill_pct: 0.02
    partial_payer_goodwill_pct: 0.04
    returning_payer_goodwill_pct: 0.06
    large_statement_usd: 1000.0
    large_statement_authority_usd: 250.0
    mid_statement_usd: 500.0
    mid_statement_authority_usd: 150.0
    two_reschedule_relief_days: 2
    one_reschedule_relief_days: 1
    specialised_ratio_high: 1.5
    specialised_ratio_low: 1.2
    high_specialised_relief_usd: 40.0
    low_specialised_relief_usd: 20.0
    long_wait_days: 3
    long_wait_courtesy_usd: 30.0
    short_wait_courtesy_usd: 15.0
  rule: >
    Every storage statement charge carries the storage goodwill the desk books for the inconvenience of a long storage;
    it is booked as one goodwill waiver against that storage charge. Storage goodwill is worked out only once the
    storage charge it relieves stands on the booking. The storage goodwill is the goodwill figure, rounded to the cent once at the end, but never more than the goodwill authority left on the booking nor more than the storage charge's outstanding amount; the goodwill figure is the goodwill percentage of the storage statement charge. The standard goodwill percentage is
    standard_goodwill_pct of the storage statement charge, the goodwill authority is the tier's
    goodwill_waiver_authority_usd, and the goodwill authority left is that authority less every goodwill waiver
    already booked on the booking.
    The goodwill percentage follows the owner's paying record with the network: an owner who has made a customer
    payment on an insurance claim repair order of their own and has paid an estimate-stage charge of this booking by
    card receives returning_payer_goodwill_pct; an owner with exactly one of those two payment records receives
    partial_payer_goodwill_pct; every other owner receives standard_goodwill_pct.
    The goodwill authority follows the size of the storage statement charge: a storage statement charge of at least
    large_statement_usd carries large_statement_authority_usd, one of at least mid_statement_usd but under
    large_statement_usd carries mid_statement_authority_usd, and a smaller one carries the tier's
    goodwill_waiver_authority_usd.
    Which goodwill already booked counts against the authority follows the booking's state: on a booking whose decline
    request is confirmed only goodwill already booked against this storage statement charge counts; on a booking in
    expired status only goodwill booked within the last whole month before the statement date counts; on every other
    booking every goodwill waiver already booked on the booking counts.
    Appointment moves earn relief days: a booking carrying two or more reschedules earns two_reschedule_relief_days
    relief days, a booking carrying exactly one reschedule earns one_reschedule_relief_days, and a booking with no
    reschedule earns none; each relief day is worth the tier's storage_daily_rate_usd and the relief days' worth is added to
    the goodwill figure.
    A storage statement billed at a specialised daily rate earns a fixed relief: the statement's average billed-day
    value is the storage statement charge divided by its billed days, counted from its first to its last billed day
    both included; an average billed-day value of at least specialised_ratio_high times the tier's
    storage_daily_rate_usd earns high_specialised_relief_usd, one of at least specialised_ratio_low times but under
    specialised_ratio_high times that rate earns low_specialised_relief_usd, and a lower average earns none; that relief is added to the goodwill figure.
    The decision period earns a courtesy: when the owner's decline request was confirmed long_wait_days or more
    calendar days after it was requested the courtesy is long_wait_courtesy_usd, when it was confirmed at least one but
    fewer than long_wait_days calendar days after it was requested the courtesy is short_wait_courtesy_usd, and when it
    was confirmed on the day it was requested, or no decline request is confirmed, there is no courtesy; the courtesy is added to the goodwill figure.
  baseline:
    rule: >-
      The storage goodwill is the goodwill figure, rounded to the cent once at the end, but never more than the goodwill authority left on the booking nor more than the storage charge's outstanding amount; the goodwill figure is the goodwill percentage of the storage statement charge. The standard goodwill percentage is standard_goodwill_pct of the storage statement charge, the
      goodwill authority is the tier's goodwill_waiver_authority_usd, and the goodwill authority left is that authority
      less every goodwill waiver already booked on the booking.
    params: [standard_goodwill_pct, goodwill_waiver_authority_usd]
  prerequisite:
  - problem: estimate_ext_storage_statement
    kind: value_input
    gate: storage_charge_amount
    form: state
    policy_source: >-
      Storage goodwill is worked out only once the storage charge it relieves stands on the booking.
    condition: >-
      A storage charge (an estimate-stage charge of fee type storage) stands on the booking.
    resolved_by: post_storage_statement_c4ddc4f2
    effect: >-
      The storage statement charge amount, its billed period and its charge reference become readable, so the
      goodwill percentage, the authority tier and the specialised-rate relief act on that charge instead of on nothing.
  cross_category:
  - category: claim
    as: history
    reads: [claim_ledger.event_type]
    note: A customer payment on the owner's own insurance claim repair order is one of the two payment records that set the goodwill percentage.
  compute:
  - storage_charge_amount: "LATEST('estimate_events', 'amount_usd', event_type='estimate_fee_charge', fee_type='storage')"
  - storage_charge_ref: "LATEST('estimate_events', 'estimate_event_id', event_type='estimate_fee_charge', fee_type='storage')"
  - claim_customer_payments: "XCOUNT('claim', 'claim_ledger', event_type='claim_customer_payment')"
  - card_payments: "COUNT('estimate_events', event_type='estimate_fee_payment', payment_method='card')"
  - goodwill_pct: "K('returning_payer_goodwill_pct') if (claim_customer_payments >= 1 and card_payments >= 1) else (K('partial_payer_goodwill_pct') if ((claim_customer_payments >= 1 and card_payments == 0) or (claim_customer_payments == 0 and card_payments >= 1)) else K('standard_goodwill_pct'))"
  - goodwill_authority: "K('large_statement_authority_usd') if storage_charge_amount >= K('large_statement_usd') else (K('mid_statement_authority_usd') if storage_charge_amount >= K('mid_statement_usd') else P('goodwill_waiver_authority_usd'))"
  - goodwill_on_booking: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_waiver', waiver_reason='goodwill')"
  - decline_confirmations: "COUNT('estimate_requests', request_type='decline_repair', request_status='confirmed')"
  - goodwill_on_statement: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_waiver', waiver_reason='goodwill', charge_event_id=storage_charge_ref)"
  - goodwill_last_month: "SUM('estimate_events', 'amount_usd', within_months=1, date_field='event_date', event_type='estimate_fee_waiver', waiver_reason='goodwill')"
  - counted_goodwill: "goodwill_on_statement if decline_confirmations >= 1 else (goodwill_last_month if F('status') == 'expired' else goodwill_on_booking)"
  - reschedules: "COUNT('estimate_events', event_type='estimate_reschedule')"
  - reschedule_relief_days: "K('two_reschedule_relief_days') if reschedules >= 2 else (K('one_reschedule_relief_days') if reschedules == 1 else 0)"
  - statement_first_day: "LATEST('estimate_events', 'period_start_date', event_type='estimate_fee_charge', fee_type='storage')"
  - statement_last_day: "LATEST('estimate_events', 'period_end_date', event_type='estimate_fee_charge', fee_type='storage')"
  - statement_day_value: "storage_charge_amount / (DAYS(statement_first_day, statement_last_day) + 1)"
  - specialised_relief: "K('high_specialised_relief_usd') if statement_day_value >= K('specialised_ratio_high') * P('storage_daily_rate_usd') else (K('low_specialised_relief_usd') if statement_day_value >= K('specialised_ratio_low') * P('storage_daily_rate_usd') else 0)"
  - decline_requested_at: "LATEST('estimate_requests', 'requested_at', date_field='requested_at', request_type='decline_repair', request_status='confirmed')"
  - decline_confirmed_on: "LATEST('estimate_requests', 'confirmed_date', date_field='confirmed_date', request_type='decline_repair', request_status='confirmed')"
  - decision_courtesy: "(K('long_wait_courtesy_usd') if DAYS(decline_requested_at, decline_confirmed_on) >= K('long_wait_days') else (K('short_wait_courtesy_usd') if DAYS(decline_requested_at, decline_confirmed_on) >= 1 else 0)) if decline_confirmed_on else 0"
  - goodwill_figure: "goodwill_pct * storage_charge_amount + reschedule_relief_days * P('storage_daily_rate_usd') + specialised_relief + decision_courtesy"
  - authority_left: "MX(0, goodwill_authority - counted_goodwill)"
  - storage_charge_outstanding: "storage_charge_amount - SUM('estimate_events', 'amount_usd', event_type='estimate_fee_waiver', charge_event_id=storage_charge_ref) - SUM('estimate_events', 'amount_usd', event_type='estimate_fee_payment', charge_event_id=storage_charge_ref)"
  - result: "RND(MN(goodwill_figure, authority_left, storage_charge_outstanding), 2)"
  compute_basis:
    storage_charge_amount: "Storage goodwill is worked out only once the storage charge it relieves stands on the booking."
    storage_charge_ref: "it is booked as one goodwill waiver against that storage charge."
    claim_customer_payments: "an owner who has made a customer payment on an insurance claim repair order of their own and has paid an estimate-stage charge of this booking by card receives returning_payer_goodwill_pct"
    card_payments: "has paid an estimate-stage charge of this booking by card"
    goodwill_pct: "The goodwill percentage follows the owner's paying record with the network: an owner who has made a customer payment on an insurance claim repair order of their own and has paid an estimate-stage charge of this booking by card receives returning_payer_goodwill_pct; an owner with exactly one of those two payment records receives partial_payer_goodwill_pct; every other owner receives standard_goodwill_pct."
    goodwill_authority: "The goodwill authority follows the size of the storage statement charge: a storage statement charge of at least large_statement_usd carries large_statement_authority_usd, one of at least mid_statement_usd but under large_statement_usd carries mid_statement_authority_usd, and a smaller one carries the tier's goodwill_waiver_authority_usd."
    goodwill_on_booking: "the goodwill authority left is that authority less every goodwill waiver already booked on the booking."
    decline_confirmations: "on a booking whose decline request is confirmed only goodwill already booked against this storage statement charge counts"
    goodwill_on_statement: "only goodwill already booked against this storage statement charge counts"
    goodwill_last_month: "on a booking in expired status only goodwill booked within the last whole month before the statement date counts"
    counted_goodwill: "Which goodwill already booked counts against the authority follows the booking's state: on a booking whose decline request is confirmed only goodwill already booked against this storage statement charge counts; on a booking in expired status only goodwill booked within the last whole month before the statement date counts; on every other booking every goodwill waiver already booked on the booking counts."
    reschedules: "a booking carrying two or more reschedules earns two_reschedule_relief_days relief days"
    reschedule_relief_days: "Appointment moves earn relief days: a booking carrying two or more reschedules earns two_reschedule_relief_days relief days, a booking carrying exactly one reschedule earns one_reschedule_relief_days, and a booking with no reschedule earns none"
    statement_first_day: "counted from its first to its last billed day both included"
    statement_last_day: "counted from its first to its last billed day both included"
    statement_day_value: "the statement's average billed-day value is the storage statement charge divided by its billed days, counted from its first to its last billed day both included"
    specialised_relief: "an average billed-day value of at least specialised_ratio_high times the tier's storage_daily_rate_usd earns high_specialised_relief_usd, one of at least specialised_ratio_low times but under specialised_ratio_high times that rate earns low_specialised_relief_usd, and a lower average earns none; that relief is added to the goodwill figure."
    decline_requested_at: "when the owner's decline request was confirmed long_wait_days or more calendar days after it was requested the courtesy is long_wait_courtesy_usd"
    decline_confirmed_on: "when the owner's decline request was confirmed long_wait_days or more calendar days after it was requested the courtesy is long_wait_courtesy_usd"
    decision_courtesy: "The decision period earns a courtesy: when the owner's decline request was confirmed long_wait_days or more calendar days after it was requested the courtesy is long_wait_courtesy_usd, when it was confirmed at least one but fewer than long_wait_days calendar days after it was requested the courtesy is short_wait_courtesy_usd, and when it was confirmed on the day it was requested, or no decline request is confirmed, there is no courtesy; the courtesy is added to the goodwill figure."
    goodwill_figure: "each relief day is worth the tier's storage_daily_rate_usd and the relief days' worth is added to the goodwill figure."
    authority_left: "the goodwill authority left is that authority less every goodwill waiver already booked on the booking."
    storage_charge_outstanding: "nor more than the storage charge's outstanding amount"
    result: "The storage goodwill is the goodwill figure, rounded to the cent once at the end, but never more than the goodwill authority left on the booking nor more than the storage charge's outstanding amount"
  factors:
  - id: paying_record_pct
    effect: parameter
    decides: goodwill_pct
    bindings: [claim_customer_payments, card_payments, goodwill_pct]
    ladder:
    - when: "a customer payment on the owner's own insurance claim repair order and a card payment on an estimate-stage charge of this booking"
      value: "K('returning_payer_goodwill_pct')"
    - when: "exactly one of those two payment records"
      value: "K('partial_payer_goodwill_pct')"
    - when: "otherwise"
      value: "K('standard_goodwill_pct')"
    baseline:
      goodwill_pct: "K('standard_goodwill_pct')"
    evidence: [cross_category, history]
    cross_difficulty: claim
  - id: statement_size_authority
    effect: parameter
    decides: goodwill_authority
    bindings: [storage_charge_amount, goodwill_authority]
    ladder:
    - when: "storage statement charge of at least large_statement_usd"
      value: "K('large_statement_authority_usd')"
    - when: "storage statement charge of at least mid_statement_usd but under large_statement_usd"
      value: "K('mid_statement_authority_usd')"
    - when: "otherwise"
      value: "P('goodwill_waiver_authority_usd')"
    baseline:
      goodwill_authority: "P('goodwill_waiver_authority_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: counted_goodwill_window
    effect: method
    decides: counted_goodwill
    bindings: [decline_confirmations, goodwill_on_statement, goodwill_last_month, counted_goodwill]
    ladder:
    - when: "decline request confirmed"
      method: "only goodwill already booked against this storage statement charge counts against the authority"
    - when: "booking in expired status"
      method: "only goodwill booked within the last whole month before the statement date counts against the authority"
    - when: "otherwise"
      method: "every goodwill waiver already booked on the booking counts against the authority"
    baseline:
      counted_goodwill: "goodwill_on_booking"
    evidence: [history]
    cross_difficulty: null
  - id: reschedule_relief_days
    effect: parameter
    decides: reschedule_relief_days
    bindings: [reschedules, reschedule_relief_days]
    ladder:
    - when: "two or more reschedules on the booking"
      value: "K('two_reschedule_relief_days')"
    - when: "exactly one reschedule on the booking"
      value: "K('one_reschedule_relief_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      reschedule_relief_days: "0"
    evidence: [history]
    cross_difficulty: null
  - id: specialised_rate_relief
    effect: parameter
    decides: specialised_relief
    bindings: [statement_first_day, statement_last_day, statement_day_value, specialised_relief]
    ladder:
    - when: "average billed-day value of at least specialised_ratio_high times the tier's storage daily rate"
      value: "K('high_specialised_relief_usd')"
    - when: "average billed-day value of at least specialised_ratio_low but under specialised_ratio_high times the tier's storage daily rate"
      value: "K('low_specialised_relief_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      specialised_relief: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: decision_period_courtesy
    effect: parameter
    decides: decision_courtesy
    bindings: [decline_requested_at, decline_confirmed_on, decision_courtesy]
    ladder:
    - when: "decline request confirmed long_wait_days or more calendar days after it was requested"
      value: "K('long_wait_courtesy_usd')"
    - when: "decline request confirmed at least one but fewer than long_wait_days calendar days after it was requested"
      value: "K('short_wait_courtesy_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      decision_courtesy: "0"
    evidence: [history, date]
    cross_difficulty: null
  inputs:
    history:
    - {table: estimate_events, aggregate: latest, field: amount_usd, filters: {event_type: estimate_fee_charge, fee_type: storage}}
    - {table: estimate_events, aggregate: sum, field: amount_usd, filters: {event_type: estimate_fee_waiver, waiver_reason: goodwill}}
    - {table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_reschedule}}
    - {table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_fee_payment, payment_method: card}}
    - {table: estimate_requests, aggregate: latest, field: confirmed_date, filters: {request_type: decline_repair, request_status: confirmed}}
    - {category: claim, table: claim_ledger, aggregate: count, field: ledger_entry_id, filters: {event_type: claim_customer_payment}}
    cross_category: [claim]
- id: estimate_ext_owner_storage_share
  base_policy_refs: [estimate_evt_fee_settlement, estimate_evt_decline_and_release, estimate_evt_storage, estimate_evt_expiry]
  overwrite: []
  trigger: on_request
  subject: [estimate_fee_payment]
  computes: amount_usd
  target_tool: pay_estimate_charge_54cbd3ef
  params:
    anchor_gap_days: 2
    far_tow_grace_days: 3
    near_tow_grace_days: 2
    two_reinspection_insurer_days: 2
    one_reinspection_insurer_days: 1
    quarantine_allowance_usd: 75.0
    isolation_allowance_usd: 60.0
  rule: >
    On an insurance-claim booking the storage on a statement is shared between the insurer and the vehicle owner, and
    the owner settles the owner's part of a storage statement charge with one payment of their own on that charge.
    The owner's payment toward a storage statement is worked out only after the booking carries a storage charge billing
    every day from the end of the free storage days through the statement date. The owner's payment toward a storage
    statement is not fixed until that storage charge carries the storage goodwill booked on storage statements.
    Each billed day of the statement carries the statement's average billed-day value, the storage statement charge
    divided by its billed days counted from its first to its last billed day both included. The insurer answers for the
    billed days up to and including the owner's responsibility date and the owner for the billed days after it; the
    owner's responsibility date is the date the owner's decline request was confirmed, and with no confirmed decline
    request the owner answers for no billed day. The insurer's part is its billed days times the average billed-day
    value, the owner's part is the storage statement charge less the insurer's part, and the goodwill booked on the
    charge is shared between the two parts in proportion to their billed days. The owner's payment is the owner's part
    less the owner's share of that goodwill, rounded to the cent once at the end, never below zero and never above the
    charge's outstanding amount.
    The owner's responsibility date follows how the owner decided: when the decline request was confirmed more than
    anchor_gap_days calendar days after it was requested, the owner had decided at the request, so the responsibility
    date is the date the request was made; when no decline request is confirmed and more than the tier's
    estimate_validity_days have passed since the estimate written date, the responsibility date is the last valid day of
    the estimate, the estimate written date plus estimate_validity_days; otherwise the responsibility date is the date
    the decline request was confirmed.
    The owner is given grace days to arrange the vehicle's removal, counted forward from the responsibility date, during
    which the insurer still answers for the storage: a vehicle that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, from farther than the tier's tow_free_radius_miles of service distance gets
    far_tow_grace_days, a vehicle that arrived on a network-arranged tow from within that radius gets
    near_tow_grace_days, and any other vehicle gets none.
    Which days count as grace days follows the transport the vehicle needs: for a vehicle with high-voltage damage
    recorded on the booking that arrived on a network-arranged tow, only Monday to Friday count as grace days and
    Saturdays and Sundays are passed over, because high-voltage carriers move vehicles on business days only; for a
    vehicle without high-voltage damage that arrived on a network-arranged tow, Monday to Saturday count and Sundays are
    passed over; for every other vehicle every calendar day counts.
    The insurer's re-inspections keep the vehicle under its review for longer: after the grace days, a booking carrying
    two or more estimate revisions adds two_reinspection_insurer_days calendar days for which the insurer answers, a
    booking carrying exactly one estimate revision adds one_reinspection_insurer_days, and a booking with no estimate
    revision adds none.
    The insurer pays each of its billed days at most at its daily storage allowance: for a vehicle with high-voltage damage recorded on the booking that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, the insurer allows its quarantine storage at quarantine_allowance_usd, for a vehicle with high-voltage damage recorded and no tow-in charge ever posted on the booking it allows its isolation storage at isolation_allowance_usd, and for every other vehicle it is the full average billed-day value; the insurer's part is
    then its billed days times the lesser of the average billed-day value and that allowance, so the value above the
    allowance on the insurer's billed days falls in the owner's part.
    How the goodwill booked on the storage charge is shared follows the booking's state: on a booking whose decline
    request is confirmed the goodwill comes off the owner's part first, up to the whole owner's part; on a booking in
    expired status the goodwill comes off the insurer's part first and only what exceeds the insurer's part comes off
    the owner's part; on every other booking it is shared in proportion to the billed days.
  baseline:
    rule: >-
      Each billed day of the statement carries the statement's average billed-day value, the storage statement charge
      divided by its billed days counted from its first to its last billed day both included. The insurer answers for
      the billed days up to and including the owner's responsibility date and the owner for the billed days after it;
      the owner's responsibility date is the date the owner's decline request was confirmed, and with no confirmed
      decline request the owner answers for no billed day. The insurer's part is its billed days times the average
      billed-day value, the owner's part is the storage statement charge less the insurer's part, and the goodwill
      booked on the charge is shared between the two parts in proportion to their billed days. The owner's payment is
      the owner's part less the owner's share of that goodwill, rounded to the cent once at the end, never below zero
      and never above the charge's outstanding amount.
    params: []
  prerequisite:
  - problem: estimate_ext_storage_statement
    kind: value_input
    gate: statement_amount
    form: state
    policy_source: >-
      The owner's payment toward a storage statement is worked out only after the booking carries a storage charge
      billing every day from the end of the free storage days through the statement date.
    condition: >-
      A storage charge stands on the booking whose billed period runs from the day after the last free storage day
      through the statement date.
    resolved_by: post_storage_statement_c4ddc4f2
    effect: >-
      The storage statement charge, its billed period and its outstanding amount become readable; without it the
      owner's part has no charge to be taken from and the payment has nothing to apply to.
  - problem: estimate_ext_storage_goodwill
    kind: value_input
    gate: goodwill_on_statement
    form: state
    policy_source: >-
      The owner's payment toward a storage statement is not fixed until that storage charge carries the storage
      goodwill booked on storage statements.
    condition: >-
      A goodwill waiver stands against the storage statement charge for the storage goodwill that statement carries.
    resolved_by: waive_storage_goodwill_2cb3c7ba
    effect: >-
      The goodwill booked on the storage charge rises from zero to the storage goodwill, and the owner's share of it
      comes off the owner's part, lowering the owner's payment.
  cross_category: []
  compute:
  - statement_amount: "LATEST('estimate_events', 'amount_usd', event_type='estimate_fee_charge', fee_type='storage')"
  - statement_ref: "LATEST('estimate_events', 'estimate_event_id', event_type='estimate_fee_charge', fee_type='storage')"
  - statement_first_day: "LATEST('estimate_events', 'period_start_date', event_type='estimate_fee_charge', fee_type='storage')"
  - statement_last_day: "LATEST('estimate_events', 'period_end_date', event_type='estimate_fee_charge', fee_type='storage')"
  - statement_billed_days: "DAYS(statement_first_day, statement_last_day) + 1"
  - average_day_value: "statement_amount / statement_billed_days"
  - goodwill_on_statement: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_waiver', waiver_reason='goodwill', charge_event_id=statement_ref)"
  - waived_on_statement: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_waiver', charge_event_id=statement_ref)"
  - paid_on_statement: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_payment', charge_event_id=statement_ref)"
  - statement_outstanding: "statement_amount - waived_on_statement - paid_on_statement"
  - decline_confirmations: "COUNT('estimate_requests', request_type='decline_repair', request_status='confirmed')"
  - decline_requested_at: "LATEST('estimate_requests', 'requested_at', date_field='requested_at', request_type='decline_repair', request_status='confirmed')"
  - decline_confirmed_on: "LATEST('estimate_requests', 'confirmed_date', date_field='confirmed_date', request_type='decline_repair', request_status='confirmed')"
  - anchor_to_last_day: "DAYS(decline_requested_at, statement_last_day) if (decline_confirmations >= 1 and DAYS(decline_requested_at, decline_confirmed_on) > K('anchor_gap_days')) else ((DAYS(F('estimate_written_date'), statement_last_day) - P('estimate_validity_days')) if (decline_confirmations == 0 and DAYS(F('estimate_written_date'), NOW) > P('estimate_validity_days')) else (DAYS(decline_confirmed_on, statement_last_day) if decline_confirmations >= 1 else 0))"
  - tow_in_charges: "COUNT('estimate_events', event_type='estimate_fee_charge', fee_type='tow_in')"
  - grace_days: "K('far_tow_grace_days') if (tow_in_charges >= 1 and F('service_distance_miles') > P('tow_free_radius_miles')) else (K('near_tow_grace_days') if (tow_in_charges >= 1 and F('service_distance_miles') <= P('tow_free_radius_miles')) else 0)"
  - responsibility_weekday: "(DAYS('2026-01-05', statement_last_day) - anchor_to_last_day) % 7"
  - grace_span_days: "MX(0, grace_days + 2 * ((MN(responsibility_weekday, 4) + grace_days) // 5) - MX(0, responsibility_weekday - 4)) if (F('high_voltage_damage') == True and tow_in_charges >= 1) else (MX(0, grace_days + (MN(responsibility_weekday, 5) + grace_days) // 6 - MX(0, responsibility_weekday - 5)) if (F('high_voltage_damage') == False and tow_in_charges >= 1) else grace_days)"
  - insurer_reinspections: "COUNT('estimate_events', event_type='estimate_revise')"
  - insurer_review_days: "K('two_reinspection_insurer_days') if insurer_reinspections >= 2 else (K('one_reinspection_insurer_days') if insurer_reinspections == 1 else 0)"
  - owner_days: "MX(0, MN(statement_billed_days, anchor_to_last_day - grace_span_days - insurer_review_days))"
  - insurer_days: "statement_billed_days - owner_days"
  - allowance_tow_arrivals: "COUNT('estimate_events', event_type='estimate_fee_charge', fee_type='tow_in')"
  - daily_storage_allowance: "K('quarantine_allowance_usd') if (F('high_voltage_damage') == True and allowance_tow_arrivals >= 1) else (K('isolation_allowance_usd') if (F('high_voltage_damage') == True and allowance_tow_arrivals == 0) else average_day_value)"
  - insurer_part: "insurer_days * MN(average_day_value, daily_storage_allowance)"
  - owner_part: "statement_amount - insurer_part"
  - owner_goodwill_share: "MN(goodwill_on_statement, owner_part) if decline_confirmations >= 1 else (MX(0, goodwill_on_statement - insurer_part) if F('status') == 'expired' else goodwill_on_statement * owner_days / statement_billed_days)"
  - result: "RND(MN(statement_outstanding, MX(0, owner_part - owner_goodwill_share)), 2)"
  compute_basis:
    statement_amount: "The owner's payment toward a storage statement is worked out only after the booking carries a storage charge billing every day from the end of the free storage days through the statement date."
    statement_ref: "the owner settles the owner's part of a storage statement charge with one payment of their own on that charge."
    statement_first_day: "the storage statement charge divided by its billed days counted from its first to its last billed day both included"
    statement_last_day: "the storage statement charge divided by its billed days counted from its first to its last billed day both included"
    statement_billed_days: "its billed days counted from its first to its last billed day both included"
    average_day_value: "Each billed day of the statement carries the statement's average billed-day value, the storage statement charge divided by its billed days counted from its first to its last billed day both included."
    goodwill_on_statement: "The owner's payment toward a storage statement is not fixed until that storage charge carries the storage goodwill booked on storage statements."
    waived_on_statement: "never above the charge's outstanding amount."
    paid_on_statement: "never above the charge's outstanding amount."
    statement_outstanding: "never above the charge's outstanding amount."
    decline_confirmations: "the owner's responsibility date is the date the owner's decline request was confirmed, and with no confirmed decline request the owner answers for no billed day."
    decline_requested_at: "when the decline request was confirmed more than anchor_gap_days calendar days after it was requested, the owner had decided at the request, so the responsibility date is the date the request was made"
    decline_confirmed_on: "otherwise the responsibility date is the date the decline request was confirmed."
    anchor_to_last_day: "The owner's responsibility date follows how the owner decided: when the decline request was confirmed more than anchor_gap_days calendar days after it was requested, the owner had decided at the request, so the responsibility date is the date the request was made; when no decline request is confirmed and more than the tier's estimate_validity_days have passed since the estimate written date, the responsibility date is the last valid day of the estimate, the estimate written date plus estimate_validity_days; otherwise the responsibility date is the date the decline request was confirmed."
    tow_in_charges: "a vehicle that arrived on a network-arranged tow, a tow-in charge having been posted on the booking"
    grace_days: "a vehicle that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, from farther than the tier's tow_free_radius_miles of service distance gets far_tow_grace_days, a vehicle that arrived on a network-arranged tow from within that radius gets near_tow_grace_days, and any other vehicle gets none."
    responsibility_weekday: "The owner is given grace days to arrange the vehicle's removal, counted forward from the responsibility date"
    grace_span_days: "Which days count as grace days follows the transport the vehicle needs: for a vehicle with high-voltage damage recorded on the booking that arrived on a network-arranged tow, only Monday to Friday count as grace days and Saturdays and Sundays are passed over, because high-voltage carriers move vehicles on business days only; for a vehicle without high-voltage damage that arrived on a network-arranged tow, Monday to Saturday count and Sundays are passed over; for every other vehicle every calendar day counts."
    insurer_reinspections: "a booking carrying two or more estimate revisions adds two_reinspection_insurer_days calendar days for which the insurer answers"
    insurer_review_days: "The insurer's re-inspections keep the vehicle under its review for longer: after the grace days, a booking carrying two or more estimate revisions adds two_reinspection_insurer_days calendar days for which the insurer answers, a booking carrying exactly one estimate revision adds one_reinspection_insurer_days, and a booking with no estimate revision adds none."
    owner_days: "The insurer answers for the billed days up to and including the owner's responsibility date and the owner for the billed days after it"
    insurer_days: "The insurer answers for the billed days up to and including the owner's responsibility date and the owner for the billed days after it"
    allowance_tow_arrivals: "for a vehicle with high-voltage damage recorded on the booking that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, the insurer allows its quarantine storage at quarantine_allowance_usd"
    daily_storage_allowance: "The insurer pays each of its billed days at most at its daily storage allowance: for a vehicle with high-voltage damage recorded on the booking that arrived on a network-arranged tow, a tow-in charge having been posted on the booking, the insurer allows its quarantine storage at quarantine_allowance_usd, for a vehicle with high-voltage damage recorded and no tow-in charge ever posted on the booking it allows its isolation storage at isolation_allowance_usd, and for every other vehicle it is the full average billed-day value"
    insurer_part: "the insurer's part is then its billed days times the lesser of the average billed-day value and that allowance, so the value above the allowance on the insurer's billed days falls in the owner's part."
    owner_part: "the owner's part is the storage statement charge less the insurer's part"
    owner_goodwill_share: "How the goodwill booked on the storage charge is shared follows the booking's state: on a booking whose decline request is confirmed the goodwill comes off the owner's part first, up to the whole owner's part; on a booking in expired status the goodwill comes off the insurer's part first and only what exceeds the insurer's part comes off the owner's part; on every other booking it is shared in proportion to the billed days."
    result: "The owner's payment is the owner's part less the owner's share of that goodwill, rounded to the cent once at the end, never below zero and never above the charge's outstanding amount."
  factors:
  - id: responsibility_anchor
    effect: method
    decides: anchor_to_last_day
    bindings: [decline_confirmations, decline_requested_at, decline_confirmed_on, anchor_to_last_day]
    ladder:
    - when: "decline request confirmed more than anchor_gap_days calendar days after it was requested"
      method: "the responsibility date is the date the decline request was made"
    - when: "no decline request confirmed and more than estimate_validity_days passed since the estimate written date"
      method: "the responsibility date is the last valid day of the estimate"
    - when: "otherwise"
      method: "the responsibility date is the date the decline request was confirmed"
    baseline:
      anchor_to_last_day: "DAYS(decline_confirmed_on, statement_last_day) if decline_confirmations >= 1 else 0"
    evidence: [history, date]
    cross_difficulty: null
  - id: removal_grace_days
    effect: parameter
    decides: grace_days
    bindings: [tow_in_charges, grace_days]
    ladder:
    - when: "a tow-in charge on the booking and a service distance beyond the tier's tow_free_radius_miles"
      value: "K('far_tow_grace_days')"
    - when: "a tow-in charge on the booking and a service distance within the tier's tow_free_radius_miles"
      value: "K('near_tow_grace_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      grace_days: "0"
    evidence: [history]
    cross_difficulty: null
  - id: grace_day_calendar
    effect: method
    decides: grace_span_days
    bindings: [responsibility_weekday, grace_span_days]
    ladder:
    - when: "high-voltage damage recorded and a tow-in charge on the booking"
      method: "grace days are counted on Monday to Friday only, Saturdays and Sundays passed over"
    - when: "no high-voltage damage recorded and a tow-in charge on the booking"
      method: "grace days are counted on Monday to Saturday, Sundays passed over"
    - when: "otherwise"
      method: "grace days are counted on every calendar day"
    baseline:
      grace_span_days: "grace_days"
    evidence: [date]
    cross_difficulty: null
  - id: insurer_review_days
    effect: parameter
    decides: insurer_review_days
    bindings: [insurer_reinspections, insurer_review_days]
    ladder:
    - when: "two or more estimate revisions on the booking"
      value: "K('two_reinspection_insurer_days')"
    - when: "exactly one estimate revision on the booking"
      value: "K('one_reinspection_insurer_days')"
    - when: "otherwise"
      value: "0"
    baseline:
      insurer_review_days: "0"
    evidence: [history]
    cross_difficulty: null
  - id: insurer_daily_allowance
    effect: parameter
    decides: daily_storage_allowance
    bindings: [allowance_tow_arrivals, daily_storage_allowance]
    ladder:
    - when: "high-voltage damage recorded and a tow-in charge posted on the booking"
      value: "K('quarantine_allowance_usd')"
    - when: "high-voltage damage recorded and no tow-in charge ever posted on the booking"
      value: "K('isolation_allowance_usd')"
    - when: "otherwise"
      value: "the full average billed-day value"
    baseline:
      daily_storage_allowance: "average_day_value"
    evidence: [history]
    cross_difficulty: null
  - id: goodwill_sharing
    effect: method
    decides: owner_goodwill_share
    bindings: [goodwill_on_statement, owner_goodwill_share]
    ladder:
    - when: "decline request confirmed"
      method: "the goodwill comes off the owner's part first, up to the whole owner's part"
    - when: "booking in expired status"
      method: "the goodwill comes off the insurer's part first and only the excess comes off the owner's part"
    - when: "otherwise"
      method: "the goodwill is shared in proportion to the owner's and the insurer's billed days"
    baseline:
      owner_goodwill_share: "goodwill_on_statement * owner_days / statement_billed_days"
    evidence: [history]
    cross_difficulty: null
  inputs:
    history:
    - {table: estimate_events, aggregate: latest, field: amount_usd, filters: {event_type: estimate_fee_charge, fee_type: storage}}
    - {table: estimate_events, aggregate: sum, field: amount_usd, filters: {event_type: estimate_fee_waiver, waiver_reason: goodwill}}
    - {table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_revise}}
    - {table: estimate_requests, aggregate: latest, field: requested_at, filters: {request_type: decline_repair, request_status: confirmed}}
    cross_category: []
- id: estimate_ext_teardown_charge
  base_policy_refs: [estimate_evt_service_fees, estimate_evt_storage, estimate_evt_check_in_and_write]
  overwrite:
  - base_policy: estimate_evt_service_fees
    superseded_clause: >-
      A teardown charge of teardown_fee_usd posts on the estimate written date where teardown_included is true
    replaced_by: >-
      A teardown charge posts once on the estimate written date of a booking whose tier includes a teardown, and the
      charge is rounded to the cent once on the final figure.
  trigger: state_due
  subject: [estimate_fee_charge]
  computes: amount_usd
  target_tool: post_teardown_charge_9aa30e52
  params:
    multi_sensor_rr_usd: 145.0
    single_sensor_rr_usd: 85.0
    srs_recovery_usd: 95.0
    tow_recovery_usd: 45.0
    aluminum_teardown_rate_usd: 115.0
    structural_teardown_rate_usd: 78.0
    certified_warranty_doc_usd: 120.0
    collision_warranty_doc_usd: 60.0
    heavy_labor_hours: 100.0
    long_span_days: 4
    long_teardown_usd: 85.0
    partial_long_teardown_usd: 40.0
  rule: >
    A teardown charge posts once on the estimate written date of a booking whose tier includes a teardown, and the
    charge is rounded to the cent once on the final figure. The standard teardown charge is
    the teardown base, the tier's flat teardown_fee_usd, which covers the tier's teardown_labor_hours_included of
    disassembly. The teardown charge is the teardown base plus every add-on stated in this rule.
    The teardown base follows the structure the network last repaired on the vehicle: for a vehicle whose closed network
    insurance claim repair order was an Aluminum Certified Structural Claim Repair, the teardown follows aluminum
    procedures and the base is the tier's teardown_labor_hours_included times aluminum_teardown_rate_usd; for a vehicle
    whose closed network insurance claim repair order was a Structural Claim Repair or a Certified Structural Claim
    Repair, the base is the tier's teardown_labor_hours_included times structural_teardown_rate_usd; for every other
    vehicle the base is the tier's flat teardown_fee_usd.
    Removing and refitting driver-assistance sensors adds a sensor add-on: a vehicle whose completed network calibration
    order covered multiple systems adds multi_sensor_rr_usd, a vehicle whose completed network calibration order covered
    a single system adds single_sensor_rr_usd, and a vehicle with no completed network calibration order adds none.
    Recovering a vehicle that came in on a network-arranged tow, a tow-in charge having been posted on the booking, adds a
    recovery add-on: such a vehicle with a deployed airbag recorded on the booking, whose restraint system must be
    disarmed before disassembly, adds srs_recovery_usd; such a vehicle with no deployed airbag adds tow_recovery_usd; any
    other vehicle adds none.
    An active network structural warranty on the vehicle adds a documentation add-on for photographing and inspecting
    the warranted repair zones: an active Certified Structural Lifetime Warranty adds certified_warranty_doc_usd, an
    active Collision Lifetime Workmanship Warranty adds collision_warranty_doc_usd, and no such active warranty adds
    none.
    A long teardown adds a long-teardown add-on: the teardown span is the calendar days from the check-in date to the
    estimate written date; an estimate of more than heavy_labor_hours labor hours with a teardown span of at least
    long_span_days days adds long_teardown_usd, exactly one of those two conditions adds partial_long_teardown_usd, and
    neither adds none.
  baseline:
    rule: >-
      A teardown charge posts once on the estimate written date of a booking whose tier includes a teardown, and the
      charge is rounded to the cent once on the final figure. The standard teardown charge
      is the teardown base, the tier's flat teardown_fee_usd, which covers the tier's teardown_labor_hours_included of
      disassembly.
    params: [teardown_fee_usd, teardown_labor_hours_included]
  prerequisite: []
  cross_category:
  - category: claim
    as: branch
    reads: [variant_name, status]
    note: The class of the vehicle's closed network claim repair order decides whether the teardown base is flat or hourly at the aluminum or structural rate.
  - category: adas
    as: branch
    reads: [systems_to_calibrate, status]
    note: The systems of the vehicle's completed calibration order decide the sensor add-on.
  - category: warranty
    as: branch
    reads: [variant_name, status]
    note: The vehicle's active network structural warranty plan decides the documentation add-on.
  compute:
  - prior_repair_class: "CFIELD('claim', 'variant_name', vehicle_id=F('vehicle_id'), status='closed')"
  - teardown_base: "P('teardown_labor_hours_included') * K('aluminum_teardown_rate_usd') if prior_repair_class == 'Aluminum Certified Structural Claim Repair' else (P('teardown_labor_hours_included') * K('structural_teardown_rate_usd') if (prior_repair_class == 'Structural Claim Repair' or prior_repair_class == 'Certified Structural Claim Repair') else P('teardown_fee_usd'))"
  - calibrated_systems: "CFIELD('adas', 'systems_to_calibrate', vehicle_id=F('vehicle_id'), status='completed')"
  - sensor_addon: "K('multi_sensor_rr_usd') if calibrated_systems == 'multiple_systems' else (K('single_sensor_rr_usd') if calibrated_systems else 0)"
  - tow_in_charges: "COUNT('estimate_events', event_type='estimate_fee_charge', fee_type='tow_in')"
  - recovery_addon: "K('srs_recovery_usd') if (F('airbag_deployed') == True and tow_in_charges >= 1) else (K('tow_recovery_usd') if (F('airbag_deployed') == False and tow_in_charges >= 1) else 0)"
  - warranty_plan: "CFIELD('warranty', 'variant_name', vehicle_id=F('vehicle_id'), status='active')"
  - warranty_doc_addon: "K('certified_warranty_doc_usd') if warranty_plan == 'Certified Structural Lifetime Warranty' else (K('collision_warranty_doc_usd') if warranty_plan == 'Collision Lifetime Workmanship Warranty' else 0)"
  - teardown_span_days: "DAYS(F('checked_in_date'), F('estimate_written_date'))"
  - long_teardown_addon: "K('long_teardown_usd') if (F('estimated_labor_hours') > K('heavy_labor_hours') and teardown_span_days >= K('long_span_days')) else (K('partial_long_teardown_usd') if ((F('estimated_labor_hours') > K('heavy_labor_hours') and teardown_span_days < K('long_span_days')) or (F('estimated_labor_hours') <= K('heavy_labor_hours') and teardown_span_days >= K('long_span_days'))) else 0)"
  - result: "RND(teardown_base + sensor_addon + recovery_addon + warranty_doc_addon + long_teardown_addon, 2)"
  compute_basis:
    prior_repair_class: "The teardown base follows the structure the network last repaired on the vehicle"
    teardown_base: "for a vehicle whose closed network insurance claim repair order was an Aluminum Certified Structural Claim Repair, the teardown follows aluminum procedures and the base is the tier's teardown_labor_hours_included times aluminum_teardown_rate_usd; for a vehicle whose closed network insurance claim repair order was a Structural Claim Repair or a Certified Structural Claim Repair, the base is the tier's teardown_labor_hours_included times structural_teardown_rate_usd; for every other vehicle the base is the tier's flat teardown_fee_usd."
    calibrated_systems: "a vehicle whose completed network calibration order covered multiple systems adds multi_sensor_rr_usd"
    sensor_addon: "Removing and refitting driver-assistance sensors adds a sensor add-on: a vehicle whose completed network calibration order covered multiple systems adds multi_sensor_rr_usd, a vehicle whose completed network calibration order covered a single system adds single_sensor_rr_usd, and a vehicle with no completed network calibration order adds none."
    tow_in_charges: "Recovering a vehicle that came in on a network-arranged tow, a tow-in charge having been posted on the booking, adds a recovery add-on"
    recovery_addon: "such a vehicle with a deployed airbag recorded on the booking, whose restraint system must be disarmed before disassembly, adds srs_recovery_usd; such a vehicle with no deployed airbag adds tow_recovery_usd; any other vehicle adds none."
    warranty_plan: "An active network structural warranty on the vehicle adds a documentation add-on for photographing and inspecting the warranted repair zones"
    warranty_doc_addon: "an active Certified Structural Lifetime Warranty adds certified_warranty_doc_usd, an active Collision Lifetime Workmanship Warranty adds collision_warranty_doc_usd, and no such active warranty adds none."
    teardown_span_days: "the teardown span is the calendar days from the check-in date to the estimate written date"
    long_teardown_addon: "an estimate of more than heavy_labor_hours labor hours with a teardown span of at least long_span_days days adds long_teardown_usd, exactly one of those two conditions adds partial_long_teardown_usd, and neither adds none."
    result: "The teardown charge is the teardown base plus every add-on stated in this rule."
  factors:
  - id: teardown_base_method
    effect: method
    decides: teardown_base
    bindings: [prior_repair_class, teardown_base]
    ladder:
    - when: "the vehicle's closed network claim repair order was an Aluminum Certified Structural Claim Repair"
      method: "the base is the included teardown hours times the aluminum teardown rate"
    - when: "the vehicle's closed network claim repair order was a Structural Claim Repair or a Certified Structural Claim Repair"
      method: "the base is the included teardown hours times the structural teardown rate"
    - when: "otherwise"
      method: "the base is the tier's flat teardown fee"
    baseline:
      teardown_base: "P('teardown_fee_usd')"
    evidence: [cross_category]
    cross_difficulty: claim
  - id: sensor_removal_addon
    effect: parameter
    decides: sensor_addon
    bindings: [calibrated_systems, sensor_addon]
    ladder:
    - when: "a completed network calibration order on the vehicle covering multiple systems"
      value: "K('multi_sensor_rr_usd')"
    - when: "a completed network calibration order on the vehicle covering a single system"
      value: "K('single_sensor_rr_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      sensor_addon: "0"
    evidence: [cross_category]
    cross_difficulty: adas
  - id: recovery_addon
    effect: parameter
    decides: recovery_addon
    bindings: [tow_in_charges, recovery_addon]
    ladder:
    - when: "a tow-in charge on the booking and a deployed airbag recorded"
      value: "K('srs_recovery_usd')"
    - when: "a tow-in charge on the booking and no deployed airbag recorded"
      value: "K('tow_recovery_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      recovery_addon: "0"
    evidence: [history]
    cross_difficulty: null
  - id: warranty_documentation_addon
    effect: parameter
    decides: warranty_doc_addon
    bindings: [warranty_plan, warranty_doc_addon]
    ladder:
    - when: "an active Certified Structural Lifetime Warranty on the vehicle"
      value: "K('certified_warranty_doc_usd')"
    - when: "an active Collision Lifetime Workmanship Warranty on the vehicle"
      value: "K('collision_warranty_doc_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      warranty_doc_addon: "0"
    evidence: [cross_category]
    cross_difficulty: warranty
  - id: long_teardown_addon
    effect: parameter
    decides: long_teardown_addon
    bindings: [teardown_span_days, long_teardown_addon]
    ladder:
    - when: "more than heavy_labor_hours estimate labor hours and a teardown span of at least long_span_days days"
      value: "K('long_teardown_usd')"
    - when: "exactly one of those two conditions"
      value: "K('partial_long_teardown_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      long_teardown_addon: "0"
    evidence: [date]
    cross_difficulty: null
  inputs:
    history:
    - {table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_fee_charge, fee_type: tow_in}}
    cross_category: [claim, adas, warranty]
- id: estimate_ext_measurement_charge
  base_policy_refs: [estimate_evt_service_fees, estimate_evt_storage, estimate_evt_check_in_and_write]
  overwrite:
  - base_policy: estimate_evt_service_fees
    superseded_clause: >-
      a measurement charge of measurement_fee_usd posts on the estimate written date where measurement_report_included
      is true
    replaced_by: >-
      A measurement charge posts once on the estimate written date of a booking whose tier produces a structural
      measurement report, and the charge is rounded to the cent once on the final figure.
  trigger: state_due
  subject: [estimate_fee_charge]
  computes: amount_usd
  target_tool: post_measurement_charge_e807c387
  params:
    comparison_window_months: 36
    comparison_fee_share: 0.6
    comparison_report_usd: 90.0
    archive_retrieval_usd: 35.0
    structural_bench_usd: 75.0
    tow_bench_usd: 40.0
    multi_sensor_points_usd: 50.0
    single_sensor_points_usd: 25.0
    large_estimate_usd: 20000.0
    zone_span_days: 4
    full_zone_usd: 90.0
    partial_zone_usd: 45.0
    certified_warranty_filing_usd: 40.0
    collision_warranty_filing_usd: 20.0
  rule: >
    A measurement charge posts once on the estimate written date of a booking whose tier produces a structural
    measurement report, and the charge is rounded to the cent once on the final figure. The standard measurement charge
    is a fresh measurement at the tier's measurement_fee_usd. The measurement charge is the measurement base plus every
    add-on stated in this rule.
    The measurement base follows the vehicle's earlier structural measurement on file: for a vehicle whose closed
    network insurance claim repair order was a Structural Claim Repair, a Certified Structural Claim Repair or an
    Aluminum Certified Structural Claim Repair delivered fewer than comparison_window_months whole months before the
    estimate written date, the new report is a comparison against that repair's measurement and the base is the tier's
    measurement_fee_usd times comparison_fee_share plus comparison_report_usd; for a vehicle whose such repair was
    delivered comparison_window_months or more whole months before, the base is a fresh measurement at the tier's
    measurement_fee_usd plus archive_retrieval_usd for retrieving the archived report; for every other vehicle the base
    is a fresh measurement at the tier's measurement_fee_usd.
    Mounting a vehicle that came in on a network-arranged tow, a tow-in charge having been posted on the booking, on the
    measuring bench adds a bench add-on: such a vehicle with structural damage recorded on the booking adds
    structural_bench_usd, such a vehicle without recorded structural damage adds tow_bench_usd, and any other vehicle
    adds none.
    Measuring the driver-assistance sensor mounting points adds a sensor-point add-on: a vehicle whose completed network
    calibration order covered multiple systems adds multi_sensor_points_usd, one whose completed calibration order
    covered a single system adds single_sensor_points_usd, and a vehicle with no completed calibration order adds none.
    Measuring additional zones adds a zone add-on: an estimate total of at least large_estimate_usd with a teardown span
    (calendar days from the check-in date to the estimate written date) of at least zone_span_days days adds
    full_zone_usd, exactly one of those two conditions adds partial_zone_usd, and neither adds none.
    Filing the report with an active network structural warranty adds a filing add-on: an active Certified Structural
    Lifetime Warranty on the vehicle adds certified_warranty_filing_usd, an active Collision Lifetime Workmanship
    Warranty adds collision_warranty_filing_usd, and no such active warranty adds none.
  baseline:
    rule: >-
      A measurement charge posts once on the estimate written date of a booking whose tier produces a structural
      measurement report, and the charge is rounded to the cent once on the final figure. The standard measurement
      charge is a fresh measurement at the tier's measurement_fee_usd.
    params: [measurement_fee_usd]
  prerequisite: []
  cross_category:
  - category: claim
    as: branch
    reads: [variant_name, delivered_date, status]
    note: The class and delivery date of the vehicle's closed network claim repair order decide whether the measurement is a comparison, an archive retrieval or a fresh measurement.
  - category: adas
    as: branch
    reads: [systems_to_calibrate, status]
    note: The systems of the vehicle's completed calibration order decide the sensor-point add-on.
  - category: warranty
    as: branch
    reads: [variant_name, status]
    note: The vehicle's active network structural warranty plan decides the filing add-on.
  compute:
  - earlier_repair_class: "CFIELD('claim', 'variant_name', vehicle_id=F('vehicle_id'), status='closed')"
  - earlier_repair_delivered: "CFIELD('claim', 'delivered_date', vehicle_id=F('vehicle_id'), status='closed')"
  - earlier_structural: "earlier_repair_class == 'Structural Claim Repair' or earlier_repair_class == 'Certified Structural Claim Repair' or earlier_repair_class == 'Aluminum Certified Structural Claim Repair'"
  - measurement_base: "(P('measurement_fee_usd') * K('comparison_fee_share') + K('comparison_report_usd')) if (earlier_structural and MONTHS(earlier_repair_delivered, F('estimate_written_date')) < K('comparison_window_months')) else ((P('measurement_fee_usd') + K('archive_retrieval_usd')) if (earlier_structural and MONTHS(earlier_repair_delivered, F('estimate_written_date')) >= K('comparison_window_months')) else P('measurement_fee_usd'))"
  - tow_arrivals: "COUNT('estimate_events', event_type='estimate_fee_charge', fee_type='tow_in')"
  - bench_addon: "K('structural_bench_usd') if (F('structural_damage') == True and tow_arrivals >= 1) else (K('tow_bench_usd') if (F('structural_damage') == False and tow_arrivals >= 1) else 0)"
  - sensor_systems: "CFIELD('adas', 'systems_to_calibrate', vehicle_id=F('vehicle_id'), status='completed')"
  - sensor_point_addon: "K('multi_sensor_points_usd') if sensor_systems == 'multiple_systems' else (K('single_sensor_points_usd') if sensor_systems else 0)"
  - measured_span_days: "DAYS(F('checked_in_date'), F('estimate_written_date'))"
  - zone_addon: "K('full_zone_usd') if (F('estimate_total_usd') >= K('large_estimate_usd') and measured_span_days >= K('zone_span_days')) else (K('partial_zone_usd') if ((F('estimate_total_usd') >= K('large_estimate_usd') and measured_span_days < K('zone_span_days')) or (F('estimate_total_usd') < K('large_estimate_usd') and measured_span_days >= K('zone_span_days'))) else 0)"
  - structural_warranty_plan: "CFIELD('warranty', 'variant_name', vehicle_id=F('vehicle_id'), status='active')"
  - filing_addon: "K('certified_warranty_filing_usd') if structural_warranty_plan == 'Certified Structural Lifetime Warranty' else (K('collision_warranty_filing_usd') if structural_warranty_plan == 'Collision Lifetime Workmanship Warranty' else 0)"
  - result: "RND(measurement_base + bench_addon + sensor_point_addon + zone_addon + filing_addon, 2)"
  compute_basis:
    earlier_repair_class: "for a vehicle whose closed network insurance claim repair order was a Structural Claim Repair, a Certified Structural Claim Repair or an Aluminum Certified Structural Claim Repair delivered fewer than comparison_window_months whole months before the estimate written date"
    earlier_repair_delivered: "delivered fewer than comparison_window_months whole months before the estimate written date"
    earlier_structural: "a Structural Claim Repair, a Certified Structural Claim Repair or an Aluminum Certified Structural Claim Repair"
    measurement_base: "The measurement base follows the vehicle's earlier structural measurement on file: for a vehicle whose closed network insurance claim repair order was a Structural Claim Repair, a Certified Structural Claim Repair or an Aluminum Certified Structural Claim Repair delivered fewer than comparison_window_months whole months before the estimate written date, the new report is a comparison against that repair's measurement and the base is the tier's measurement_fee_usd times comparison_fee_share plus comparison_report_usd; for a vehicle whose such repair was delivered comparison_window_months or more whole months before, the base is a fresh measurement at the tier's measurement_fee_usd plus archive_retrieval_usd for retrieving the archived report; for every other vehicle the base is a fresh measurement at the tier's measurement_fee_usd."
    tow_arrivals: "Mounting a vehicle that came in on a network-arranged tow, a tow-in charge having been posted on the booking, on the measuring bench adds a bench add-on"
    bench_addon: "such a vehicle with structural damage recorded on the booking adds structural_bench_usd, such a vehicle without recorded structural damage adds tow_bench_usd, and any other vehicle adds none."
    sensor_systems: "a vehicle whose completed network calibration order covered multiple systems adds multi_sensor_points_usd"
    sensor_point_addon: "Measuring the driver-assistance sensor mounting points adds a sensor-point add-on: a vehicle whose completed network calibration order covered multiple systems adds multi_sensor_points_usd, one whose completed calibration order covered a single system adds single_sensor_points_usd, and a vehicle with no completed calibration order adds none."
    measured_span_days: "a teardown span (calendar days from the check-in date to the estimate written date)"
    zone_addon: "Measuring additional zones adds a zone add-on: an estimate total of at least large_estimate_usd with a teardown span (calendar days from the check-in date to the estimate written date) of at least zone_span_days days adds full_zone_usd, exactly one of those two conditions adds partial_zone_usd, and neither adds none."
    structural_warranty_plan: "Filing the report with an active network structural warranty adds a filing add-on"
    filing_addon: "an active Certified Structural Lifetime Warranty on the vehicle adds certified_warranty_filing_usd, an active Collision Lifetime Workmanship Warranty adds collision_warranty_filing_usd, and no such active warranty adds none."
    result: "The measurement charge is the measurement base plus every add-on stated in this rule."
  factors:
  - id: measurement_base_method
    effect: method
    decides: measurement_base
    bindings: [earlier_repair_class, earlier_repair_delivered, earlier_structural, measurement_base]
    ladder:
    - when: "a closed network structural-class claim repair order on the vehicle delivered fewer than comparison_window_months whole months before the estimate written date"
      method: "comparison measurement: the tier's measurement fee times comparison_fee_share plus the comparison report"
    - when: "a closed network structural-class claim repair order on the vehicle delivered comparison_window_months or more whole months before"
      method: "fresh measurement plus retrieval of the archived report"
    - when: "otherwise"
      method: "fresh measurement at the tier's measurement fee"
    baseline:
      measurement_base: "P('measurement_fee_usd')"
    evidence: [cross_category, date]
    cross_difficulty: claim
  - id: bench_mounting_addon
    effect: parameter
    decides: bench_addon
    bindings: [tow_arrivals, bench_addon]
    ladder:
    - when: "a tow-in charge on the booking and structural damage recorded"
      value: "K('structural_bench_usd')"
    - when: "a tow-in charge on the booking and no structural damage recorded"
      value: "K('tow_bench_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      bench_addon: "0"
    evidence: [history]
    cross_difficulty: null
  - id: sensor_point_addon
    effect: parameter
    decides: sensor_point_addon
    bindings: [sensor_systems, sensor_point_addon]
    ladder:
    - when: "a completed network calibration order on the vehicle covering multiple systems"
      value: "K('multi_sensor_points_usd')"
    - when: "a completed network calibration order on the vehicle covering a single system"
      value: "K('single_sensor_points_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      sensor_point_addon: "0"
    evidence: [cross_category]
    cross_difficulty: adas
  - id: measured_zone_addon
    effect: parameter
    decides: zone_addon
    bindings: [measured_span_days, zone_addon]
    ladder:
    - when: "an estimate total of at least large_estimate_usd and a teardown span of at least zone_span_days days"
      value: "K('full_zone_usd')"
    - when: "exactly one of those two conditions"
      value: "K('partial_zone_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      zone_addon: "0"
    evidence: [date]
    cross_difficulty: null
  - id: warranty_filing_addon
    effect: parameter
    decides: filing_addon
    bindings: [structural_warranty_plan, filing_addon]
    ladder:
    - when: "an active Certified Structural Lifetime Warranty on the vehicle"
      value: "K('certified_warranty_filing_usd')"
    - when: "an active Collision Lifetime Workmanship Warranty on the vehicle"
      value: "K('collision_warranty_filing_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      filing_addon: "0"
    evidence: [cross_category]
    cross_difficulty: warranty
  inputs:
    history:
    - {table: estimate_events, aggregate: count, field: estimate_event_id, filters: {event_type: estimate_fee_charge, fee_type: tow_in}}
    cross_category: [claim, adas, warranty]
- id: estimate_ext_insurer_teardown_payment
  base_policy_refs: [estimate_evt_fee_settlement, estimate_evt_check_in_and_write]
  overwrite: []
  trigger: on_request
  subject: [estimate_fee_payment]
  computes: amount_usd
  target_tool: remit_insurer_direct_payment_12af7a63
  params:
    standard_accepted_rate_usd: 64.0
    aluminum_accepted_rate_usd: 105.0
    structural_accepted_rate_usd: 80.0
    structural_access_hours_share: 0.02
    undocumented_extra_hours: 1.0
    multi_sensor_allowance_usd: 120.0
    single_sensor_allowance_usd: 70.0
    far_recovery_allowance_usd: 60.0
    near_recovery_allowance_usd: 30.0
  rule: >
    On an insurance-claim booking of a tier that allows insurer direct billing, the insurer pays its teardown allowance
    toward the teardown charge directly, as one insurer direct payment on that charge, and the owner answers for any
    part of the teardown charge above it. The insurer's direct payment toward a teardown charge is fixed only after the
    teardown charge for the teardown performed stands on the booking. The insurer's direct payment toward a teardown
    charge is not worked out until the booking carries a measurement charge for every structural measurement report
    produced on it.
    The insurer's direct payment is the lesser of the teardown charge's outstanding amount and the insurer's teardown
    allowance, rounded to the cent once at the end. The standard teardown allowance is the accepted teardown hours
    times the accepted teardown rate, where the accepted teardown hours are the tier's teardown_labor_hours_included and
    the accepted teardown rate is standard_accepted_rate_usd. The insurer's teardown allowance is the accepted teardown
    hours times the accepted teardown rate plus every allowance added in this rule.
    How the accepted teardown hours are reckoned follows the structural documentation on the booking: when a measurement charge stands on the booking and structural damage is recorded, the measurement report documents structural damage and the insurer accepts the tier's teardown_labor_hours_included plus structural access hours equal to structural_access_hours_share of the estimate's labor hours, the access disassembly a structural repair of that size needs, fractions counted; when a measurement charge stands on the booking and no structural damage is recorded, it accepts the tier's teardown_labor_hours_included plus a fixed undocumented_extra_hours; when no measurement charge stands, it accepts the tier's teardown_labor_hours_included.
    The accepted teardown rate follows the structure the network last repaired on the vehicle: for a vehicle whose
    closed network insurance claim repair order was an Aluminum Certified Structural Claim Repair the insurer accepts
    aluminum_accepted_rate_usd, for one whose closed repair order was a Structural Claim Repair or a Certified
    Structural Claim Repair it accepts structural_accepted_rate_usd, and for every other vehicle
    standard_accepted_rate_usd.
    The insurer adds a sensor allowance for driver-assistance sensors removed in the teardown: multi_sensor_allowance_usd
    for a vehicle whose completed network calibration order covered multiple systems, single_sensor_allowance_usd for
    one whose completed calibration order covered a single system, and none for a vehicle with no completed calibration
    order.
    The insurer adds a recovery allowance for a vehicle that came in on a network-arranged tow: far_recovery_allowance_usd
    when the tow-in charge billed more miles than the tier's tow_free_radius_miles, near_recovery_allowance_usd when it
    billed no more than that radius, and none when no tow-in charge was ever posted on the booking.
  baseline:
    rule: >-
      The insurer's direct payment is the lesser of the teardown charge's outstanding amount and the insurer's teardown
      allowance, rounded to the cent once at the end. The standard teardown allowance is the accepted teardown hours
      times the accepted teardown rate, where the accepted teardown hours are the tier's teardown_labor_hours_included
      and the accepted teardown rate is standard_accepted_rate_usd.
    params: [teardown_labor_hours_included, standard_accepted_rate_usd]
  prerequisite:
  - problem: estimate_ext_teardown_charge
    kind: value_input
    gate: teardown_outstanding
    form: state
    policy_source: >-
      The insurer's direct payment toward a teardown charge is fixed only after the teardown charge for the teardown
      performed stands on the booking.
    condition: >-
      An estimate-stage charge of fee type teardown stands on the booking, dated on the estimate written date.
    resolved_by: post_teardown_charge_9aa30e52
    effect: >-
      The teardown charge and its outstanding amount become readable; without it the outstanding is zero and the
      insurer has nothing to pay toward.
  - problem: estimate_ext_measurement_charge
    kind: value_input
    gate: accepted_hours
    form: state
    policy_source: >-
      The insurer's direct payment toward a teardown charge is not worked out until the booking carries a measurement
      charge for every structural measurement report produced on it.
    condition: >-
      An estimate-stage charge of fee type measurement stands on a booking whose tier produces a structural
      measurement report.
    resolved_by: post_measurement_charge_e807c387
    effect: >-
      A measurement charge comes to stand on the booking, so with structural damage recorded the accepted teardown
      hours move from the included hours to the included hours plus the structural access hours, and the allowance
      rises.
  cross_category:
  - category: claim
    as: branch
    reads: [variant_name, status]
    note: The class of the vehicle's closed network claim repair order decides the accepted teardown rate.
  - category: adas
    as: branch
    reads: [systems_to_calibrate, status]
    note: The systems of the vehicle's completed calibration order decide the sensor allowance.
  compute:
  - teardown_amount: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_charge', fee_type='teardown')"
  - teardown_ref: "LATEST('estimate_events', 'estimate_event_id', event_type='estimate_fee_charge', fee_type='teardown')"
  - teardown_settled: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_payment', charge_event_id=teardown_ref) + SUM('estimate_events', 'amount_usd', event_type='estimate_fee_waiver', charge_event_id=teardown_ref)"
  - teardown_outstanding: "teardown_amount - teardown_settled"
  - measurement_amount: "SUM('estimate_events', 'amount_usd', event_type='estimate_fee_charge', fee_type='measurement')"
  - accepted_hours: "(P('teardown_labor_hours_included') + F('estimated_labor_hours') * K('structural_access_hours_share')) if (measurement_amount > 0 and F('structural_damage') == True) else ((P('teardown_labor_hours_included') + K('undocumented_extra_hours')) if (measurement_amount > 0 and F('structural_damage') == False) else P('teardown_labor_hours_included'))"
  - repaired_class: "CFIELD('claim', 'variant_name', vehicle_id=F('vehicle_id'), status='closed')"
  - accepted_rate: "K('aluminum_accepted_rate_usd') if repaired_class == 'Aluminum Certified Structural Claim Repair' else (K('structural_accepted_rate_usd') if (repaired_class == 'Structural Claim Repair' or repaired_class == 'Certified Structural Claim Repair') else K('standard_accepted_rate_usd'))"
  - removed_sensor_systems: "CFIELD('adas', 'systems_to_calibrate', vehicle_id=F('vehicle_id'), status='completed')"
  - sensor_allowance: "K('multi_sensor_allowance_usd') if removed_sensor_systems == 'multiple_systems' else (K('single_sensor_allowance_usd') if removed_sensor_systems else 0)"
  - tow_charges: "COUNT('estimate_events', event_type='estimate_fee_charge', fee_type='tow_in')"
  - tow_miles_billed: "LATEST('estimate_events', 'tow_miles', event_type='estimate_fee_charge', fee_type='tow_in')"
  - recovery_allowance: "K('far_recovery_allowance_usd') if (tow_charges >= 1 and tow_miles_billed > P('tow_free_radius_miles')) else (K('near_recovery_allowance_usd') if (tow_charges >= 1 and tow_miles_billed <= P('tow_free_radius_miles')) else 0)"
  - teardown_allowance: "accepted_hours * accepted_rate + sensor_allowance + recovery_allowance"
  - result: "RND(MN(teardown_outstanding, MX(0, teardown_allowance)), 2)"
  compute_basis:
    teardown_amount: "The insurer's direct payment toward a teardown charge is fixed only after the teardown charge for the teardown performed stands on the booking."
    teardown_ref: "as one insurer direct payment on that charge"
    teardown_settled: "the lesser of the teardown charge's outstanding amount and the insurer's teardown allowance"
    teardown_outstanding: "the lesser of the teardown charge's outstanding amount and the insurer's teardown allowance"
    measurement_amount: "The insurer's direct payment toward a teardown charge is not worked out until the booking carries a measurement charge for every structural measurement report produced on it."
    accepted_hours: "How the accepted teardown hours are reckoned follows the structural documentation on the booking: when a measurement charge stands on the booking and structural damage is recorded, the measurement report documents structural damage and the insurer accepts the tier's teardown_labor_hours_included plus structural access hours equal to structural_access_hours_share of the estimate's labor hours, the access disassembly a structural repair of that size needs, fractions counted; when a measurement charge stands on the booking and no structural damage is recorded, it accepts the tier's teardown_labor_hours_included plus a fixed undocumented_extra_hours; when no measurement charge stands, it accepts the tier's teardown_labor_hours_included."
    repaired_class: "The accepted teardown rate follows the structure the network last repaired on the vehicle"
    accepted_rate: "for a vehicle whose closed network insurance claim repair order was an Aluminum Certified Structural Claim Repair the insurer accepts aluminum_accepted_rate_usd, for one whose closed repair order was a Structural Claim Repair or a Certified Structural Claim Repair it accepts structural_accepted_rate_usd, and for every other vehicle standard_accepted_rate_usd."
    removed_sensor_systems: "multi_sensor_allowance_usd for a vehicle whose completed network calibration order covered multiple systems"
    sensor_allowance: "The insurer adds a sensor allowance for driver-assistance sensors removed in the teardown: multi_sensor_allowance_usd for a vehicle whose completed network calibration order covered multiple systems, single_sensor_allowance_usd for one whose completed calibration order covered a single system, and none for a vehicle with no completed calibration order."
    tow_charges: "The insurer adds a recovery allowance for a vehicle that came in on a network-arranged tow"
    tow_miles_billed: "when the tow-in charge billed more miles than the tier's tow_free_radius_miles"
    recovery_allowance: "far_recovery_allowance_usd when the tow-in charge billed more miles than the tier's tow_free_radius_miles, near_recovery_allowance_usd when it billed no more than that radius, and none when no tow-in charge was ever posted on the booking."
    teardown_allowance: "The insurer's teardown allowance is the accepted teardown hours times the accepted teardown rate plus every allowance added in this rule."
    result: "The insurer's direct payment is the lesser of the teardown charge's outstanding amount and the insurer's teardown allowance, rounded to the cent once at the end."
  factors:
  - id: accepted_hours_method
    effect: method
    decides: accepted_hours
    bindings: [measurement_amount, accepted_hours]
    ladder:
    - when: "a measurement charge on the booking and structural damage recorded"
      method: "included hours plus structural access hours in proportion to the estimate's labor hours"
    - when: "a measurement charge on the booking and no structural damage recorded"
      method: "included hours plus a fixed undocumented extra"
    - when: "otherwise"
      method: "the tier's included teardown hours"
    baseline:
      accepted_hours: "P('teardown_labor_hours_included')"
    evidence: [history]
    cross_difficulty: null
  - id: accepted_rate_by_repair_class
    effect: parameter
    decides: accepted_rate
    bindings: [repaired_class, accepted_rate]
    ladder:
    - when: "the vehicle's closed network claim repair order was an Aluminum Certified Structural Claim Repair"
      value: "K('aluminum_accepted_rate_usd')"
    - when: "the vehicle's closed network claim repair order was a Structural Claim Repair or a Certified Structural Claim Repair"
      value: "K('structural_accepted_rate_usd')"
    - when: "otherwise"
      value: "K('standard_accepted_rate_usd')"
    baseline:
      accepted_rate: "K('standard_accepted_rate_usd')"
    evidence: [cross_category]
    cross_difficulty: claim
  - id: insurer_sensor_allowance
    effect: parameter
    decides: sensor_allowance
    bindings: [removed_sensor_systems, sensor_allowance]
    ladder:
    - when: "a completed network calibration order on the vehicle covering multiple systems"
      value: "K('multi_sensor_allowance_usd')"
    - when: "a completed network calibration order on the vehicle covering a single system"
      value: "K('single_sensor_allowance_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      sensor_allowance: "0"
    evidence: [cross_category]
    cross_difficulty: adas
  - id: insurer_recovery_allowance
    effect: parameter
    decides: recovery_allowance
    bindings: [tow_charges, tow_miles_billed, recovery_allowance]
    ladder:
    - when: "a tow-in charge on the booking billing more miles than the tier's tow_free_radius_miles"
      value: "K('far_recovery_allowance_usd')"
    - when: "a tow-in charge on the booking billing no more than the tier's tow_free_radius_miles"
      value: "K('near_recovery_allowance_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      recovery_allowance: "0"
    evidence: [history]
    cross_difficulty: null
  inputs:
    history:
    - {table: estimate_events, aggregate: sum, field: amount_usd, filters: {event_type: estimate_fee_charge, fee_type: teardown}}
    - {table: estimate_events, aggregate: sum, field: amount_usd, filters: {event_type: estimate_fee_charge, fee_type: measurement}}
    - {table: estimate_events, aggregate: latest, field: tow_miles, filters: {event_type: estimate_fee_charge, fee_type: tow_in}}
    cross_category: [claim, adas]
