  - estimate_write
  rule: A booking is checked in on its appointment date when the vehicle arrives or the mobile estimator reaches
    it. For a Blueprint Teardown Estimate or Structural Blueprint Estimate, the customer's teardown authorization
    request on the booking is confirmed. Without that confirmation the vehicle is not checked in and no disassembly
    starts. The written estimate is delivered within estimate_turnaround_business_days business days (Monday to
    Friday, excluding network holidays) of the check-in, or of the photo set for a Photo Estimate. Teardown tiers
    disassemble up to teardown_labor_hours_included hours; pre_repair_scan_included tiers scan the vehicle modules
    and measurement_report_included tiers produce a structural measurement report. When the written total exceeds
    the tier's max_estimate_value_usd, or structural damage is found on a tier whose structural_damage_eligible
    is false, the estimate is still written and recorded, but it cannot be converted from this booking; the customer
    is offered a new booking at the lowest tier that accepts the total and the damage.
  eligibility:
  - id: teardown_authorization_confirmed
