- id: estimate_evt_revision
  subject:
  - estimate_revise
  - estimate_figures_update
  rule: A revision re-inspects the vehicle and replaces the estimate total and labor hours on the booking. The booking
    is in estimate_written status. The revision is requested no later than the tier's revision window days after
    the estimate written date. Days are calendar days counted from the estimate written date as day zero, and a
    request on the last day is in time. The number of revisions already on the booking (estimate_msr_revisions_used)
    must be below free_revisions_per_booking; beyond it the customer is offered a new booking. Revisions are never
    charged. A revision does not restart the validity or credit windows, which always run from the original estimate
    written date.
  eligibility:
  - id: estimate_is_written
    applies_to:
    - estimate_revise
    kind: state
    condition: The booking is in estimate_written status.
    evidence_fields:
    - estimate_bookings.status
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    state_contract:
      field: estimate_bookings.status
      allowed:
      - estimate_written
  - id: within_revision_window
    applies_to:
    - estimate_revise
    kind: time
    condition: The revision is requested no later than the tier's revision window days after the estimate written
      date.
    evidence_fields:
    - estimate_bookings.estimate_written_date
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - estimate_bookings.booking_id
      action_bindings:
        estimate_bookings.booking_id: booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the estimate written date
      anchor_source: estimate_bookings.estimate_written_date
      relation: not_after
      duration_source: variants.revision_window_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the estimate written date as day zero, and a request on
        the last day is in time.
      boundary: inclusive
  params:
    per_tier:
      Photo Estimate:
        revision_window_days: =revision_window_days
        free_revisions_per_booking: =free_revisions_per_booking
      Drive-In Estimate:
        revision_window_days: =revision_window_days
        free_revisions_per_booking: =free_revisions_per_booking
      Scheduled Estimate:
        revision_window_days: =revision_window_days
        free_revisions_per_booking: =free_revisions_per_booking
      Mobile Estimate:
        revision_window_days: =revision_window_days
        free_revisions_per_booking: =free_revisions_per_booking
      Blueprint Teardown Estimate:
        revision_window_days: =revision_window_days
        free_revisions_per_booking: =free_revisions_per_booking
      Structural Blueprint Estimate:
        revision_window_days: =revision_window_days
        free_revisions_per_booking: =free_revisions_per_booking
  measures:
  - estimate_msr_revisions_used
- id: estimate_evt_conversion
  subject:
  - estimate_convert
  rule: 'A written estimate converts into a repair order: an insurance-claim booking opens an insurance claim repair
    and a customer-pay booking opens a customer-pay repair. The conversion is made no later than the tier''s estimate
    validity days after the estimate written date. Days are calendar days counted from the estimate written date
    as day zero; conversion on the last valid day is allowed. For an insurance-claim booking, the insurer claim
    number is recorded on the booking. An estimate whose total exceeds the tier''s max_estimate_value_usd, or that
    carries structural damage on a tier whose structural_damage_eligible is false, cannot be converted (estimate_evt_check_in_and_write).
    On conversion the estimate-stage charges earn the credits set by estimate_evt_fee_settlement and storage stops
    accruing.'
  eligibility:
  - id: within_validity
    applies_to:
    - estimate_convert
    kind: time
    condition: The conversion is made no later than the tier's estimate validity days after the estimate written
      date.
    evidence_fields:
    - estimate_bookings.estimate_written_date
    - estimate_bookings.booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
