      Photo Estimate:
        estimate_turnaround_business_days: =estimate_turnaround_business_days
        teardown_included: =teardown_included
        teardown_labor_hours_included: =teardown_labor_hours_included
        pre_repair_scan_included: =pre_repair_scan_included
        measurement_report_included: =measurement_report_included
        max_estimate_value_usd: =max_estimate_value_usd
        structural_damage_eligible: =structural_damage_eligible
      Drive-In Estimate:
