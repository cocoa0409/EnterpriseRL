        estimate_validity_days: =estimate_validity_days
        max_estimate_value_usd: =max_estimate_value_usd
      Drive-In Estimate:
        estimate_validity_days: =estimate_validity_days
        max_estimate_value_usd: =max_estimate_value_usd
      Scheduled Estimate:
        estimate_validity_days: =estimate_validity_days
        max_estimate_value_usd: =max_estimate_value_usd
      Mobile Estimate:
        estimate_validity_days: =estimate_validity_days
        max_estimate_value_usd: =max_estimate_value_usd
      Blueprint Teardown Estimate:
        estimate_validity_days: =estimate_validity_days
        max_estimate_value_usd: =max_estimate_value_usd
      Structural Blueprint Estimate:
        estimate_validity_days: =estimate_validity_days
        max_estimate_value_usd: =max_estimate_value_usd
- id: estimate_evt_decline_and_release
  subject:
  - estimate_decline
  - estimate_vehicle_release
  rule: 'Declining is the customer''s own decision: the desk records a decline request and the booking moves to
    declined only once the customer confirms it. The customer''s decline request on the booking is confirmed. A
    vehicle left at the center for a teardown estimate (storage_applies true) is released only when nothing is outstanding
    on the booking. The booking''s estimate-stage charges are fully paid or waived. Release records the vehicle_released_date
    and ends storage accrual on that date. When accrued storage reaches storage_lien_notice_days without release,
    the vehicle enters the abandoned-vehicle lien process, which the desk does not handle. Teardown, scan and measurement
    charges posted at the estimate stay due after a decline; no credit applies to a declined booking.'
  eligibility:
  - id: decline_confirmed
    applies_to:
    - estimate_decline
    kind: authorization
    condition: The customer's decline request on the booking is confirmed.
    evidence_fields:
    - estimate_requests.booking_id
    - estimate_requests.request_type
    - estimate_requests.request_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
