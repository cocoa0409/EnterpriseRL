# Product and event policy charter: Repair Estimates & Appointments (estimate).
category: estimate
display_name: Repair Estimates & Appointments
binding:
  holding_table: estimate_bookings
  event_tables:
  - estimate_events
  intake_tables:
  - estimate_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - booked
  - checked_in
  - estimate_written
  - converted
  - declined
  - cancelled
  - no_show
  - expired
  transitions:
  - from: booked
    to: checked_in
    by: agent
    means: The vehicle is presented at the repair center (or the mobile estimator reaches it) and the visit is checked
      in.
  - from: booked
    to: estimate_written
    by: system
    means: A Photo Estimate is written from the photos the customer submitted, without a visit.
  - from: checked_in
    to: estimate_written
    by: system
    means: The estimator finishes the written damage estimate after inspecting the vehicle.
  - from: booked
    to: cancelled
    by: agent
    means: The customer cancels the appointment before it takes place.
  - from: booked
    to: no_show
    by: system
    means: The appointment start plus the arrival grace passed without a check-in (or, for a Photo Estimate, the
      photo window closed without usable photos).
  - from: estimate_written
    to: converted
    by: agent
    means: A repair order is opened from the written estimate (insurance claim repair or customer-pay repair).
  - from: estimate_written
    to: declined
    by: user
    means: The customer confirms they will not repair the vehicle with the network on this estimate.
  - from: estimate_written
    to: expired
    by: system
    means: The estimate validity period lapsed without conversion or decline.
accounts:
- key: estimate_fees
  unit: USD
  meaning: 'Amount the customer (or, where permitted, the insurer) owes on a booking for estimate-stage services:
    teardown, diagnostic scan, measurement, mobile trip, tow-in and storage. Charges post in; payments and waivers
    post out.'
parameter_schema:
  min_booking_lead_days: Minimum number of calendar days between the booking request and the appointment date (integer,
    days).
  max_booking_horizon_days: Furthest an appointment may be booked ahead of the request (integer, calendar days).
  same_day_booking_allowed: Whether an appointment may be booked for the same calendar day as the request (boolean).
  weekend_appointments_available: Whether Saturday or Sunday appointment dates may be booked (boolean).
  appointment_duration_minutes: Bay or estimator time reserved for the appointment (integer, minutes; 0 = no visit).
  arrival_grace_minutes: Minutes after the appointment start within which the vehicle may still be checked in before
    the booking becomes a no-show (integer, minutes; 0 = not applicable).
  photo_submission_window_days: Calendar days after the booking request within which a usable photo set must be
    submitted (integer; 0 = not applicable).
  photos_required_count: 'Number of photos in a usable photo set: four corners, damage close-ups, odometer and VIN
    plate (integer; 0 = not applicable).'
  photo_resubmission_limit: Times an unusable photo set may be resubmitted within the photo window before the booking
    must move to an in-person estimate (integer).
  mobile_service_radius_miles: Maximum road distance from the assigned repair center to the vehicle for an on-site
    visit (miles; 0 = no on-site visit).
  mobile_trip_fee_usd: Trip fee charged on a customer-pay mobile visit that is cancelled inside the cancellation
    cutoff or missed (USD).
  reschedule_cutoff_hours: Latest point, in full hours before the appointment start, at which a reschedule may be
    requested (integer, hours).
  free_reschedules_per_booking: Number of reschedules permitted on one booking (integer).
  cancellation_cutoff_hours: Hours before the appointment start inside which a cancellation counts as late (integer,
    hours; 0 = no late cancellation).
  max_estimate_value_usd: Highest estimate total the tier may produce as a final, convertible estimate (USD).
  structural_damage_eligible: Whether the tier accepts vehicles with structural damage (boolean).
  non_drivable_eligible: Whether the tier accepts a vehicle that cannot be driven (boolean).
  airbag_deployment_eligible: Whether the tier accepts a vehicle with a deployed airbag (boolean).
  high_voltage_damage_eligible: Whether the tier accepts damage near the high-voltage battery or cabling of a hybrid
    or electric vehicle (boolean).
  insurer_claim_number_required: Whether an insurance-claim booking must carry the insurer claim number at booking
    (boolean).
  estimate_turnaround_business_days: Business days (Monday-Friday, excluding network holidays) after the photos
    or the check-in within which the written estimate is delivered (integer; 0 = same day).
  teardown_included: Whether the tier disassembles damaged areas to find hidden damage before writing the estimate
    (boolean).
  teardown_labor_hours_included: Disassembly labor included in the teardown (hours, one decimal).
  measurement_report_included: Whether an electronic three-dimensional structural measurement report is produced
    (boolean).
  pre_repair_scan_included: Whether a pre-repair diagnostic scan of vehicle modules is performed (boolean).
  estimate_validity_days: Calendar days after the estimate written date during which the estimate can be converted
    to a repair order (integer).
  free_revisions_per_booking: Number of estimate revisions (re-inspections) allowed on one booking (integer).
  revision_window_days: Calendar days after the estimate written date within which a revision may be requested (integer).
  teardown_fee_usd: Teardown fee posted when the teardown is performed (USD).
  teardown_fee_credited_on_conversion: Whether the teardown fee is waived when the booking converts inside the conversion
    credit window (boolean).
  pre_repair_scan_fee_usd: Diagnostic scan fee posted when the pre-repair scan is performed (USD).
  scan_fee_credited_on_conversion: Whether the scan fee is waived when the booking converts inside the conversion
    credit window (boolean).
  measurement_fee_usd: Structural measurement fee posted when the measurement report is produced (USD).
  measurement_fee_credited_on_conversion: Whether the measurement fee is waived when the booking converts inside
    the conversion credit window (boolean).
  conversion_credit_window_days: Calendar days after the estimate written date within which a conversion earns the
    estimate-fee credits (integer; 0 = no credit).
  storage_applies: Whether the vehicle stays at the center after the estimate so that storage can accrue (boolean).
  storage_free_days: Calendar days after the estimate written date during which a vehicle left at the center is
    stored free (integer).
  storage_daily_rate_usd: Storage charge per calendar day beyond the free days (USD per day).
  storage_lien_notice_days: Calendar days of accrued storage after which the vehicle is referred to the abandoned-vehicle
    lien process (integer; 0 = not applicable).
  tow_in_available: Whether the network arranges a tow of a non-drivable vehicle to the center for the estimate
    (boolean).
  tow_free_radius_miles: Tow distance covered without a mileage charge (miles).
  tow_rate_per_mile_usd: Charge per tow mile beyond the free radius (USD per mile).
  tow_hookup_fee_usd: Flat hook-up charge for an arranged tow (USD).
  tow_fee_credited_on_conversion: Whether the tow-in charge is waived when the booking converts inside the conversion
    credit window (boolean).
  insurer_direct_billing_allowed: Whether estimate-stage charges on an insurance-claim booking may be settled by
    the insurer directly (boolean).
  goodwill_waiver_authority_usd: Most the desk may waive as goodwill across all charges of one booking (USD).
  after_hours_dropoff_allowed: Whether the vehicle may be left in the key drop the evening before the appointment,
    counting as arrival at the appointment start (boolean).
  no_show_lookback_days: Length of the rolling look-back window for counting a customer's no-shows (integer, calendar
    days).
  no_show_limit: No-show count within the look-back window at which reserved-slot tiers can no longer be booked
    (integer).
  max_open_bookings_per_vehicle: Most bookings one vehicle may have open at once (booked, checked_in or estimate_written)
    (integer).
  reserved_slot: Whether the tier reserves bay or estimator capacity for a specific slot (boolean).
