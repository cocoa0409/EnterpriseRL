    goodwill_corrected_days: "divided by the days posted on the corrected time charge"
    lost_day_time_value: "The lost-day time value is the time charge net of every credit standing on the rental, spread over the days the time charge rightly covers: where a billing-error credit stands on the rental, it is the time charge posted on the final invoice less every standing credit, divided by the rental days; where no billing-error credit stands but a corrected time charge stands, it is that corrected time charge less every standing credit, divided by the days posted on the corrected time charge; otherwise it is the time charge posted on the final invoice less every standing credit, divided by the days posted on the time charge."
    goodwill_young_charge: "The lost-day fee value is the young-renter charge standing on the rental divided by the rental days"
    lost_day_fee_value: "The lost-day fee value is the young-renter charge standing on the rental divided by the rental days, or zero where no young-renter charge stands."
    goodwill_share: "The goodwill share depends on the overrun and the delay's cause: where the repair overran its target by more than overrun_major_business_days business days and the calibration order was sublet to a dealer, it is share_full; where exactly one of those two holds, it is share_partial; otherwise it is share_standard."
    goodwill_program: "The program uplift follows the discount program on the customer-pay repair order"
    goodwill_program_uplift: "a military program takes the repair tier's military_discount_pct; a returning_customer program takes the repair tier's returning_customer_discount_pct; any other program takes zero."
    goodwill_already_credited: "never more than the goodwill authority days at the class partner_daily_rate_usd less goodwill already credited on the rental"
    goodwill_limit: "never more than the goodwill authority days at the class partner_daily_rate_usd less goodwill already credited on the rental"
    result: "The delay goodwill credit is the credited delay days multiplied by the sum of the lost-day time value and the lost-day fee value, by the goodwill share and by one hundred plus the program uplift, divided by one hundred, but never more than the goodwill authority days at the class partner_daily_rate_usd less goodwill already credited on the rental, and never more than the time charge still standing after the credits against it, rounded to the cent once at the end."
  factors:
  - id: calibration_delay_days
    effect: method
    decides: goodwill_delay_days
    bindings: [goodwill_calibration_order, goodwill_first_attempt_failed, goodwill_calibration_done, goodwill_passing_attempt, goodwill_delay_days]
    ladder:
    - when: "the calibration order's first in-house attempt failed and the order was sublet to a dealer"
      method: "days from the first attempt to the order's completion date"
    - when: "the first in-house attempt failed and a later in-house attempt passed"
      method: "days from the first attempt to the passing attempt"
    - when: "otherwise"
      method: "business days by which the repair overran its target"
    baseline:
      goodwill_delay_days: "goodwill_overrun"
    evidence: [cross_category, history, date]
    cross_difficulty: adas
  - id: goodwill_authority_tier
    effect: parameter
    decides: goodwill_authority_days
    bindings: [goodwill_sublet_date, goodwill_warranty_on_file, goodwill_authority_days]
    ladder:
    - when: "the calibration order was sublet to a dealer and the customer holds an active network workmanship warranty"
      value: "authority_days_full"
    - when: "exactly one of the two holds"
      value: "authority_days_partial"
    - when: "otherwise"
