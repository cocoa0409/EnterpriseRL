extended_policies:
- id: rental_ext_time_charge_correction
  base_policy_refs: [rental_evt_customer_settlement, rental_evt_settlement_split, rental_evt_rental_days]
  overwrite:
  - base_policy: rental_evt_settlement_split
    superseded_clause: >-
      a customer_pay rental is charged entirely as uncovered_days, at weekly_rate_usd for each full seven-day block
      once it reaches weekly_rate_threshold_days days
    replaced_by: >-
      The price of the corrected time charge follows the length of the rental: a rental of seven or more rental days
      is charged one block rate for each full seven-day block plus the remainder charge for its remaining rental days;
      a rental of at least weekly_rate_threshold_days but fewer than seven rental days is charged the lesser of its
      rental days at partner_daily_rate_usd and one weekly_rate_usd; a shorter rental is charged its rental days at
      partner_daily_rate_usd.
  - base_policy: rental_evt_rental_days
    superseded_clause: >-
      a return no more than return_grace_minutes minutes into a new period does not start it
    replaced_by: >-
      Rental days are the whole days between the pickup date and the return date, plus one where the return time as
      counted is later than the pickup time of day.
  trigger: state_due
  subject: [rental_customer_credit]
  computes: amount_usd
  target_tool: credit_rental_billing_error_4d32ac17
  params:
    block_tier_two_days: 14
    block_tier_three_days: 21
    block_reduction_two_week_pct: 10
    block_reduction_three_week_pct: 15
    extra_day_divisor_loyal: 7
    extra_day_divisor_returning: 6
  rule: >-
    A billing-error credit corrects the time charge the rental partner posted on the final invoice of a customer-pay
    rental tied to a network repair when that posted time charge is above the time charge the rental should carry.
    The credit names the posted time charge and equals the posted time charge less the corrected time charge less
    every billing-error credit already standing on the rental, never below zero, rounded to the cent once at the end.
    As standard, the corrected time charge is the rental days multiplied by the class partner_daily_rate_usd.
    Rental days are the whole days between the pickup date and the return date, plus one where the return time as
    counted is later than the pickup time of day.
    The price of the corrected time charge follows the length of the rental: a rental of seven or more rental days
    is charged one block rate for each full seven-day block plus the remainder charge for its remaining rental days;
    a rental of at least weekly_rate_threshold_days but fewer than seven rental days is charged the lesser of its
    rental days at partner_daily_rate_usd and one weekly_rate_usd; a shorter rental is charged its rental days at
    partner_daily_rate_usd.
    The remainder charge of the corrected time charge depends on how many rental days remain after the full
    seven-day blocks: a remainder of weekly_rate_threshold_days days or more is charged one more block rate; a
    remainder of two days up to fewer than weekly_rate_threshold_days days is charged at the extra-day rate, never
    more than one weekly_rate_usd; a remainder of a single day, or of none, is charged at partner_daily_rate_usd per
    remaining day.
    The block rate of the corrected time charge depends on the span between the pickup date and the return date:
    a span of block_tier_three_days days or more takes the class weekly_rate_usd reduced by
    block_reduction_three_week_pct percent; a span of block_tier_two_days days or more but under
    block_tier_three_days days takes the class weekly_rate_usd reduced by block_reduction_two_week_pct percent; a
    shorter span takes the class weekly_rate_usd.
    The extra-day rate of the corrected time charge depends on the customer's standing with the network: a customer
    who holds an active network workmanship warranty and has a closed network insurance claim repair takes the class
    weekly_rate_usd divided by extra_day_divisor_loyal; a customer who meets exactly one of those two conditions
    takes the lesser of partner_daily_rate_usd and the class weekly_rate_usd divided by extra_day_divisor_returning;
    any other customer takes partner_daily_rate_usd.
    The full blocks are priced first, the remainder second, and the two amounts are added to give the corrected time
    charge before it is compared with the posted time charge.
  prerequisite: []
  cross_category:
  - category: warranty
    as: existence
    reads: [status]
    note: Whether the customer holds an active network workmanship warranty decides the extra-day rate tier.
  - category: claim
    as: existence
    reads: [status]
    note: Whether the customer has a closed network insurance claim repair decides the extra-day rate tier.
  compute:
  - posted_time_charge: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_charge', charge_type='uncovered_days', settlement_kind='final')"
  - prior_billing_error_credits: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_credit', credit_reason='billing_error')"
  - corrected_rental_days: "(DAYS(F('pickup_date'), F('return_date')) + (1 if F('return_time') > F('pickup_time') else 0)) if F('return_date') else 0"
  - remaining_rental_days: "((DAYS(F('pickup_date'), F('return_date')) + (1 if F('return_time') > F('pickup_time') else 0)) % 7) if F('return_date') else 0"
  - block_rental_span: "DAYS(F('pickup_date'), F('return_date')) if F('return_date') else 0"
  - corrected_block_rate: "P('weekly_rate_usd') * (1 - K('block_reduction_three_week_pct') / 100) if block_rental_span >= K('block_tier_three_days') else (P('weekly_rate_usd') * (1 - K('block_reduction_two_week_pct') / 100) if block_rental_span >= K('block_tier_two_days') else P('weekly_rate_usd'))"
  - warranty_on_file: "EXISTS('warranty', status='active')"
  - closed_claim_on_file: "EXISTS('claim', status='closed')"
  - corrected_extra_day_rate: "P('weekly_rate_usd') / K('extra_day_divisor_loyal') if (warranty_on_file and closed_claim_on_file) else (MN(P('partner_daily_rate_usd'), P('weekly_rate_usd') / K('extra_day_divisor_returning')) if (warranty_on_file or closed_claim_on_file) else P('partner_daily_rate_usd'))"
  - corrected_remainder_charge: "corrected_block_rate if remaining_rental_days >= P('weekly_rate_threshold_days') else (MN(remaining_rental_days * corrected_extra_day_rate, P('weekly_rate_usd')) if remaining_rental_days >= 2 else remaining_rental_days * P('partner_daily_rate_usd'))"
  - corrected_time_charge: "(corrected_rental_days // 7) * corrected_block_rate + corrected_remainder_charge if corrected_rental_days >= 7 else (MN(corrected_rental_days * P('partner_daily_rate_usd'), P('weekly_rate_usd')) if corrected_rental_days >= P('weekly_rate_threshold_days') else corrected_rental_days * P('partner_daily_rate_usd'))"
  - result: "RND(MX(0, posted_time_charge - corrected_time_charge - prior_billing_error_credits), 2)"
  compute_basis:
    posted_time_charge: "The credit names the posted time charge and equals the posted time charge less the corrected time charge less every billing-error credit already standing on the rental, never below zero, rounded to the cent once at the end."
    prior_billing_error_credits: "The credit names the posted time charge and equals the posted time charge less the corrected time charge less every billing-error credit already standing on the rental, never below zero, rounded to the cent once at the end."
    corrected_rental_days: "Rental days are the whole days between the pickup date and the return date, plus one where the return time as counted is later than the pickup time of day."
    remaining_rental_days: "depends on how many rental days remain after the full seven-day blocks"
    block_rental_span: "The block rate of the corrected time charge depends on the span between the pickup date and the return date"
    corrected_block_rate: "a span of block_tier_three_days days or more takes the class weekly_rate_usd reduced by block_reduction_three_week_pct percent; a span of block_tier_two_days days or more but under block_tier_three_days days takes the class weekly_rate_usd reduced by block_reduction_two_week_pct percent; a shorter span takes the class weekly_rate_usd."
    warranty_on_file: "a customer who holds an active network workmanship warranty"
    closed_claim_on_file: "has a closed network insurance claim repair"
    corrected_extra_day_rate: "a customer who holds an active network workmanship warranty and has a closed network insurance claim repair takes the class weekly_rate_usd divided by extra_day_divisor_loyal; a customer who meets exactly one of those two conditions takes the lesser of partner_daily_rate_usd and the class weekly_rate_usd divided by extra_day_divisor_returning; any other customer takes partner_daily_rate_usd."
    corrected_remainder_charge: "a remainder of weekly_rate_threshold_days days or more is charged one more block rate; a remainder of two days up to fewer than weekly_rate_threshold_days days is charged at the extra-day rate, never more than one weekly_rate_usd; a remainder of a single day, or of none, is charged at partner_daily_rate_usd per remaining day."
    corrected_time_charge: "a rental of seven or more rental days is charged one block rate for each full seven-day block plus the remainder charge for its remaining rental days; a rental of at least weekly_rate_threshold_days but fewer than seven rental days is charged the lesser of its rental days at partner_daily_rate_usd and one weekly_rate_usd; a shorter rental is charged its rental days at partner_daily_rate_usd. The full blocks are priced first, the remainder second, and the two amounts are added to give the corrected time charge before it is compared with the posted time charge."
    result: "The credit names the posted time charge and equals the posted time charge less the corrected time charge less every billing-error credit already standing on the rental, never below zero, rounded to the cent once at the end."
  factors:
  - id: time_charge_structure
    effect: method
    decides: corrected_time_charge
    bindings: [corrected_rental_days, corrected_time_charge]
    ladder:
    - when: "seven or more rental days"
      method: "full seven-day blocks at the block rate plus the remainder charge"
    - when: "at least weekly_rate_threshold_days but fewer than seven rental days"
      method: "the lesser of the rental days at partner_daily_rate_usd and one weekly_rate_usd"
    - when: "otherwise (fewer than weekly_rate_threshold_days rental days)"
      method: "the rental days at partner_daily_rate_usd"
    baseline:
      corrected_time_charge: "corrected_rental_days * P('partner_daily_rate_usd')"
    evidence: [date]
    cross_difficulty: null
  - id: remainder_pricing
    effect: method
    decides: corrected_remainder_charge
    bindings: [remaining_rental_days, corrected_remainder_charge]
    ladder:
    - when: "weekly_rate_threshold_days or more rental days remain after the full blocks"
      method: "one more block rate"
    - when: "two days up to fewer than weekly_rate_threshold_days days remain"
      method: "the remaining days at the extra-day rate, capped at one weekly_rate_usd"
    - when: "otherwise (a single remaining day, or none)"
      method: "the remaining days at partner_daily_rate_usd"
    baseline:
      corrected_remainder_charge: "remaining_rental_days * P('partner_daily_rate_usd')"
    evidence: [date]
    cross_difficulty: null
  - id: long_rental_block_rate
    effect: parameter
    decides: corrected_block_rate
    bindings: [block_rental_span, corrected_block_rate]
    ladder:
    - when: "a pickup-to-return span of block_tier_three_days days or more"
      value: "weekly_rate_usd reduced by block_reduction_three_week_pct percent"
    - when: "a span of block_tier_two_days days or more but under block_tier_three_days days"
      value: "weekly_rate_usd reduced by block_reduction_two_week_pct percent"
    - when: "otherwise (a shorter span)"
      value: "weekly_rate_usd"
    baseline:
      corrected_block_rate: "P('weekly_rate_usd')"
    evidence: [date]
    cross_difficulty: null
  - id: standing_extra_day_rate
    effect: parameter
    decides: corrected_extra_day_rate
    bindings: [warranty_on_file, closed_claim_on_file, corrected_extra_day_rate]
    ladder:
    - when: "an active network workmanship warranty and a closed network insurance claim repair"
      value: "weekly_rate_usd divided by extra_day_divisor_loyal"
    - when: "exactly one of the two"
      value: "the lesser of partner_daily_rate_usd and weekly_rate_usd divided by extra_day_divisor_returning"
    - when: "otherwise"
      value: "partner_daily_rate_usd"
    baseline:
      corrected_extra_day_rate: "P('partner_daily_rate_usd')"
    evidence: [cross_category]
    cross_difficulty: warranty
  baseline:
    rule: >-
      A billing-error credit corrects the time charge the rental partner posted on the final invoice of a
      customer-pay rental tied to a network repair when that posted time charge is above the time charge the rental
      should carry. The credit names the posted time charge and equals the posted time charge less the corrected time
      charge less every billing-error credit already standing on the rental, never below zero, rounded to the cent
      once at the end. As standard, the corrected time charge is the rental days multiplied by the class
      partner_daily_rate_usd. Rental days are the whole days between the pickup date and the return date, plus one
      where the return time as counted is later than the pickup time of day.
    params: [partner_daily_rate_usd]
  inputs:
    history:
    - {table: rental_ledger, aggregate: sum, field: amount_usd, filters: {event_type: rental_customer_charge, charge_type: uncovered_days, settlement_kind: final}}
    - {table: rental_ledger, aggregate: sum, field: amount_usd, filters: {event_type: rental_customer_credit, credit_reason: billing_error}}
    cross_category: [warranty, claim]
- id: rental_ext_repair_customer_discount
  base_policy_refs: [rental_evt_customer_settlement, rental_evt_settlement_split, rental_evt_rental_days]
  overwrite:
  - base_policy: rental_evt_settlement_split
    superseded_clause: >-
      with a customer_pay_discount credit of customer_pay_discount_pct percent when it is tied to a network repair
    replaced_by: >-
      The repair-customer discount credit equals the discount base multiplied by the repair-period share and by the
      sum of the discount rate, the calibration points and the program points, divided by one hundred, rounded to the
      cent once at the end.
  - base_policy: rental_evt_rental_days
    superseded_clause: >-
      a return no more than return_grace_minutes minutes into a new period does not start it
    replaced_by: >-
      Rental days are the whole days between the pickup date and the return date, plus one where the return time as
      counted is later than the pickup time of day.
  trigger: state_due
  subject: [rental_customer_credit]
  computes: amount_usd
  target_tool: credit_repair_customer_discount_d339b3bd
  params:
    overrun_major_business_days: 3
    overrun_minor_points: 5
    sublet_points: 5
    retry_points: 2
  rule: >-
    A customer-pay rental tied to a network customer-pay repair receives a repair-customer discount credit that names
    the rental's time charge and is booked on the rental.
    The repair-customer discount is worked out only after any amount by which the time charge was posted above the
    rental's correct time charge stands credited against it as a billing error.
    As standard, the repair-customer discount credit is customer_pay_discount_pct percent of the time charge posted
    on the final invoice, rounded to the cent.
    The repair-customer discount credit equals the discount base multiplied by the repair-period share and by the
    sum of the discount rate, the calibration points and the program points, divided by one hundred, rounded to the
    cent once at the end.
    The discount base is chosen from the time charge entries: where a time charge stands on a corrected invoice, the
    discount base is that corrected time charge; where no corrected time charge stands but billing-error credits
    stand on the rental, it is the time charge posted on the final invoice less those billing-error credits;
    otherwise it is the time charge posted on the final invoice.
    The repair-period share limits the discount to the rental days of the repair period: where the repaired vehicle
    was released and the rental was returned after the release date, the share is the rental days that start on or
    before the release date divided by all rental days; where the repaired vehicle has not been released but the
    repair is ready, the share is the rental days that start on or before the ready date divided by all rental days;
    otherwise the share is one. Rental days are the whole days between the pickup date and the return date, plus one
    where the return time as counted is later than the pickup time of day.
    The discount rate depends on how far the repair ran past its target ready date, counted in business days
    (Monday to Friday) from the repair start date to the ready date less the repair tier's
    target_turnaround_business_days: an overrun of more than overrun_major_business_days business days doubles
    customer_pay_discount_pct; an overrun of one business day up to overrun_major_business_days business days takes
    customer_pay_discount_pct plus overrun_minor_points; no overrun takes customer_pay_discount_pct.
    The calibration points depend on the calibration order opened for the repair: where its in-house attempts
    failed and it was sublet to a dealer, they are sublet_points; where an in-house attempt failed and the order did
    not go to a dealer, they are retry_points; otherwise they are zero.
    The program points follow the discount program on the repair order: a returning_customer program adds the
    repair tier's returning_customer_discount_pct; a military program adds the repair tier's
    military_discount_pct; any other program adds zero.
  prerequisite:
  - problem: rental_ext_time_charge_correction
    kind: value_input
    gate: discount_base_amount
    form: state
    policy_source: >-
      The repair-customer discount is worked out only after any amount by which the time charge was posted above the
      rental's correct time charge stands credited against it as a billing error.
    condition: >-
      Where the time charge posted on the final invoice is above the correct time charge, a billing-error credit for
      the difference stands on the rental ledger naming that time charge.
    resolved_by: credit_rental_billing_error_4d32ac17
    effect: >-
      The discount base becomes the posted time charge less the billing-error credit instead of the posted time
      charge, which lowers the repair-customer discount credit.
  cross_category:
  - category: retail
    as: history
    reads: [delivered_date, ready_date, repair_started_date, discount_program, target_turnaround_business_days, returning_customer_discount_pct, military_discount_pct]
    note: The customer-pay repair's release, ready and start dates and its discount program decide the repair-period share, the discount rate and the program points.
  - category: adas
    as: history
    reads: [adas_order_id, sublet_date, adas_events.attempt_result]
    note: Failed in-house calibration attempts and a dealer sublet on the repair's calibration order decide the calibration points.
  compute:
  - discount_final_time_charge: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_charge', charge_type='uncovered_days', settlement_kind='final')"
  - discount_corrected_time_charge: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_charge', charge_type='uncovered_days', settlement_kind='corrected')"
  - discount_billing_error_credits: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_credit', credit_reason='billing_error')"
  - discount_base_amount: "discount_corrected_time_charge if discount_corrected_time_charge > 0 else (discount_final_time_charge - discount_billing_error_credits if discount_billing_error_credits > 0 else discount_final_time_charge)"
  - discount_rental_days: "DAYS(F('pickup_date'), F('return_date')) + (1 if F('return_time') > F('pickup_time') else 0)"
  - discount_release_date: "(CFIELD('retail', 'delivered_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - discount_ready_date: "(CFIELD('retail', 'ready_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - discount_period_share: "MN(DAYS(F('pickup_date'), discount_release_date) + 1, discount_rental_days) / discount_rental_days if (discount_release_date and F('return_date') > discount_release_date) else (MN(DAYS(F('pickup_date'), discount_ready_date) + 1, discount_rental_days) / discount_rental_days if ((not discount_release_date) and discount_ready_date) else 1)"
  - discount_repair_start: "(CFIELD('retail', 'repair_started_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - discount_target_days: "(CPARAM('retail', 'target_turnaround_business_days', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - discount_span: "DAYS(discount_repair_start, discount_ready_date) if (discount_repair_start and discount_ready_date) else 0"
  - discount_start_weekday: "DAYS('2024-01-01', discount_repair_start) % 7 if discount_repair_start else 0"
  - discount_business_days: "(discount_span // 7) * 5 + int(discount_span % 7 >= 1 and (discount_start_weekday + 1) % 7 < 5) + int(discount_span % 7 >= 2 and (discount_start_weekday + 2) % 7 < 5) + int(discount_span % 7 >= 3 and (discount_start_weekday + 3) % 7 < 5) + int(discount_span % 7 >= 4 and (discount_start_weekday + 4) % 7 < 5) + int(discount_span % 7 >= 5 and (discount_start_weekday + 5) % 7 < 5) + int(discount_span % 7 >= 6 and (discount_start_weekday + 6) % 7 < 5)"
  - discount_overrun: "discount_business_days - discount_target_days if discount_target_days else 0"
  - discount_rate_pct: "2 * P('customer_pay_discount_pct') if discount_overrun > K('overrun_major_business_days') else (P('customer_pay_discount_pct') + K('overrun_minor_points') if discount_overrun >= 1 else P('customer_pay_discount_pct'))"
  - discount_calibration_order: "(CFIELD('adas', 'adas_order_id', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - discount_sublet_date: "(CFIELD('adas', 'sublet_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - discount_failed_attempts: "XCOUNT('adas', 'adas_events', event_type='adas_attempt', attempt_result='failed', adas_order_id=discount_calibration_order)"
  - discount_calibration_points: "K('sublet_points') if (discount_sublet_date and discount_failed_attempts >= 1) else (K('retry_points') if discount_failed_attempts >= 1 else 0)"
  - discount_program: "(CFIELD('retail', 'discount_program', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - discount_program_points: "CPARAM('retail', 'returning_customer_discount_pct', retail_repair_id=F('retail_repair_id')) if discount_program == 'returning_customer' else (CPARAM('retail', 'military_discount_pct', retail_repair_id=F('retail_repair_id')) if discount_program == 'military' else 0)"
  - result: "RND(discount_base_amount * discount_period_share * (discount_rate_pct + discount_calibration_points + discount_program_points) / 100, 2)"
  compute_basis:
    discount_final_time_charge: "otherwise it is the time charge posted on the final invoice."
    discount_corrected_time_charge: "where a time charge stands on a corrected invoice, the discount base is that corrected time charge"
    discount_billing_error_credits: "where no corrected time charge stands but billing-error credits stand on the rental, it is the time charge posted on the final invoice less those billing-error credits"
    discount_base_amount: "The discount base is chosen from the time charge entries: where a time charge stands on a corrected invoice, the discount base is that corrected time charge; where no corrected time charge stands but billing-error credits stand on the rental, it is the time charge posted on the final invoice less those billing-error credits; otherwise it is the time charge posted on the final invoice."
    discount_rental_days: "Rental days are the whole days between the pickup date and the return date, plus one where the return time as counted is later than the pickup time of day."
    discount_release_date: "where the repaired vehicle was released and the rental was returned after the release date"
    discount_ready_date: "where the repaired vehicle has not been released but the repair is ready"
    discount_period_share: "The repair-period share limits the discount to the rental days of the repair period: where the repaired vehicle was released and the rental was returned after the release date, the share is the rental days that start on or before the release date divided by all rental days; where the repaired vehicle has not been released but the repair is ready, the share is the rental days that start on or before the ready date divided by all rental days; otherwise the share is one."
    discount_repair_start: "counted in business days (Monday to Friday) from the repair start date to the ready date less the repair tier's target_turnaround_business_days"
    discount_target_days: "counted in business days (Monday to Friday) from the repair start date to the ready date less the repair tier's target_turnaround_business_days"
    discount_span: "counted in business days (Monday to Friday) from the repair start date to the ready date"
    discount_start_weekday: "counted in business days (Monday to Friday) from the repair start date to the ready date"
    discount_business_days: "counted in business days (Monday to Friday) from the repair start date to the ready date"
    discount_overrun: "The discount rate depends on how far the repair ran past its target ready date, counted in business days (Monday to Friday) from the repair start date to the ready date less the repair tier's target_turnaround_business_days"
    discount_rate_pct: "an overrun of more than overrun_major_business_days business days doubles customer_pay_discount_pct; an overrun of one business day up to overrun_major_business_days business days takes customer_pay_discount_pct plus overrun_minor_points; no overrun takes customer_pay_discount_pct."
    discount_calibration_order: "The calibration points depend on the calibration order opened for the repair"
    discount_sublet_date: "where its in-house attempts failed and it was sublet to a dealer, they are sublet_points"
    discount_failed_attempts: "where an in-house attempt failed and the order did not go to a dealer, they are retry_points"
    discount_calibration_points: "The calibration points depend on the calibration order opened for the repair: where its in-house attempts failed and it was sublet to a dealer, they are sublet_points; where an in-house attempt failed and the order did not go to a dealer, they are retry_points; otherwise they are zero."
    discount_program: "The program points follow the discount program on the repair order"
    discount_program_points: "a returning_customer program adds the repair tier's returning_customer_discount_pct; a military program adds the repair tier's military_discount_pct; any other program adds zero."
    result: "The repair-customer discount credit equals the discount base multiplied by the repair-period share and by the sum of the discount rate, the calibration points and the program points, divided by one hundred, rounded to the cent once at the end."
  factors:
  - id: discount_base_choice
    effect: method
    decides: discount_base_amount
    bindings: [discount_corrected_time_charge, discount_billing_error_credits, discount_base_amount]
    ladder:
    - when: "a time charge stands on a corrected invoice"
      method: "the discount base is the corrected time charge"
    - when: "no corrected time charge stands and billing-error credits stand on the rental"
      method: "the discount base is the final time charge less the billing-error credits"
    - when: "otherwise"
      method: "the discount base is the final time charge"
    baseline:
      discount_base_amount: "discount_final_time_charge"
    evidence: [history]
    cross_difficulty: null
  - id: repair_period_share
    effect: method
    decides: discount_period_share
    bindings: [discount_rental_days, discount_release_date, discount_ready_date, discount_period_share]
    ladder:
    - when: "the repaired vehicle was released and the rental was returned after the release date"
      method: "rental days starting on or before the release date divided by all rental days"
    - when: "the repaired vehicle has not been released but the repair is ready"
      method: "rental days starting on or before the ready date divided by all rental days"
    - when: "otherwise"
      method: "the whole rental (share one)"
    baseline:
      discount_period_share: "1"
    evidence: [cross_category, date]
    cross_difficulty: null
  - id: overrun_discount_rate
    effect: parameter
    decides: discount_rate_pct
    bindings: [discount_repair_start, discount_target_days, discount_span, discount_start_weekday, discount_business_days, discount_overrun, discount_rate_pct]
    ladder:
    - when: "the repair ran more than overrun_major_business_days business days past its target ready date"
      value: "twice customer_pay_discount_pct"
    - when: "the repair ran one to overrun_major_business_days business days past its target ready date"
      value: "customer_pay_discount_pct plus overrun_minor_points"
    - when: "otherwise (ready on or before its target)"
      value: "customer_pay_discount_pct"
    baseline:
      discount_rate_pct: "P('customer_pay_discount_pct')"
    evidence: [cross_category, date]
    cross_difficulty: null
  - id: calibration_points
    effect: parameter
    decides: discount_calibration_points
    bindings: [discount_calibration_order, discount_sublet_date, discount_failed_attempts, discount_calibration_points]
    ladder:
    - when: "the repair's calibration order had failed in-house attempts and was sublet to a dealer"
      value: "sublet_points"
    - when: "an in-house attempt failed and the order was not sublet"
      value: "retry_points"
    - when: "otherwise"
      value: "zero"
    baseline:
      discount_calibration_points: "0"
    evidence: [cross_category, history]
    cross_difficulty: adas
  - id: program_points
    effect: parameter
    decides: discount_program_points
    bindings: [discount_program, discount_program_points]
    ladder:
    - when: "the repair order carries the returning_customer program"
      value: "the repair tier's returning_customer_discount_pct"
    - when: "the repair order carries the military program"
      value: "the repair tier's military_discount_pct"
    - when: "otherwise"
      value: "zero"
    baseline:
      discount_program_points: "0"
    evidence: [cross_category]
    cross_difficulty: null
  baseline:
    rule: >-
      A customer-pay rental tied to a network customer-pay repair receives a repair-customer discount credit that
      names the rental's time charge and is booked on the rental. As standard, the repair-customer discount credit is
      customer_pay_discount_pct percent of the time charge posted on the final invoice, rounded to the cent.
    params: [customer_pay_discount_pct]
  inputs:
    history:
    - {table: rental_ledger, aggregate: sum, field: amount_usd, filters: {event_type: rental_customer_charge, charge_type: uncovered_days}}
    - {table: rental_ledger, aggregate: sum, field: amount_usd, filters: {event_type: rental_customer_credit, credit_reason: billing_error}}
    - {category: adas, table: adas_events, aggregate: count, field: adas_event_id, filters: {event_type: adas_attempt, attempt_result: failed}}
    cross_category: [retail, adas]
- id: rental_ext_young_renter_fee
  base_policy_refs: [rental_evt_settlement_split, rental_evt_options_and_fees, rental_class_and_renter, rental_evt_rental_days]
  overwrite:
  - base_policy: rental_class_and_renter
    superseded_clause: >-
      pays young_renter_fee_daily_usd per rental day when not older than young_renter_max_age
    replaced_by: >-
      The young-renter charge equals the charged fee days multiplied by the young-renter daily fee and by one hundred
      less the reliability reduction, divided by one hundred, rounded to the cent once at the end.
  - base_policy: rental_evt_rental_days
    superseded_clause: >-
      a return no more than return_grace_minutes minutes into a new period does not start it
    replaced_by: >-
      Rental days are the whole days between the pickup date and the return date, plus one where the return time as
      counted is later than the pickup time of day.
  trigger: state_due
  subject: [rental_customer_charge]
  computes: amount_usd
  target_tool: charge_young_renter_fee_a6a6d206
  params:
    fee_days_per_week: 5
    surcharge_max_age: 22
    surcharge_span_days: 14
    under_23_surcharge_usd: 5.0
    under_23_short_surcharge_usd: 2.5
    reliable_reduction_pct: 20
    partial_reduction_pct: 10
  rule: >-
    A renter who is young at pickup, no older than young_renter_max_age, owes a young-renter charge on the rental,
    booked as one customer charge of the final invoice once the rental is returned and always the customer's.
    As standard, the young-renter charge is the class young_renter_fee_daily_usd for every rental day, rounded to the
    cent. Rental days are the whole days between the pickup date and the return date, plus one where the return time
    as counted is later than the pickup time of day.
    The charged fee days are the fee days less the calibration hold days, never below zero, and the young-renter
    charge is booked for those charged fee days as the days it covers.
    The young-renter charge equals the charged fee days multiplied by the young-renter daily fee and by one hundred
    less the reliability reduction, divided by one hundred, rounded to the cent once at the end.
    The fee days follow a weekly maximum: a rental of seven or more rental days carries fee_days_per_week fee days for
    each full seven-day block plus its remaining rental days up to fee_days_per_week; a rental of at least
    weekly_rate_threshold_days but fewer than seven rental days carries its rental days up to fee_days_per_week; a
    shorter rental carries every rental day.
    The young-renter daily fee depends on the renter's age at pickup and the rental's span: a renter aged
    surcharge_max_age or younger whose pickup-to-return span is surcharge_span_days days or more pays the class
    young_renter_fee_daily_usd plus under_23_surcharge_usd; a renter aged surcharge_max_age or younger whose span is
    shorter pays the class young_renter_fee_daily_usd plus under_23_short_surcharge_usd; any older young renter pays
    the class young_renter_fee_daily_usd.
    The calibration hold days are the days the network's own calibration kept the repaired vehicle away from the
    renter: where the repair's calibration order was sublet to a dealer and has a completion date, they are the days
    from the sublet date through the completion date, both counted; where an in-house calibration attempt failed and a
    later in-house attempt passed, they are one day; otherwise they are zero.
    The reliability reduction follows the customer's estimate bookings with the network: a customer with a booking
    converted into a repair and no booking ever marked no-show takes reliable_reduction_pct; a customer with a
    converted booking and a no-show on record takes partial_reduction_pct; any other customer takes zero.
  prerequisite: []
  cross_category:
  - category: adas
    as: history
    reads: [adas_order_id, sublet_date, completed_date, adas_events.attempt_result]
    note: The repair's calibration sublet dates and in-house attempt results decide the calibration hold days.
  - category: estimate
    as: existence
    reads: [status]
    note: Whether the customer has a converted estimate booking and any no-show booking decides the reliability reduction.
  compute:
  - young_rental_days: "DAYS(F('pickup_date'), F('return_date')) + (1 if F('return_time') > F('pickup_time') else 0)"
  - young_fee_days: "(young_rental_days // 7) * K('fee_days_per_week') + MN(young_rental_days % 7, K('fee_days_per_week')) if young_rental_days >= 7 else (MN(young_rental_days, K('fee_days_per_week')) if young_rental_days >= P('weekly_rate_threshold_days') else young_rental_days)"
  - young_rental_span: "DAYS(F('pickup_date'), F('return_date'))"
  - young_daily_fee: "P('young_renter_fee_daily_usd') + K('under_23_surcharge_usd') if (F('renter_age') <= K('surcharge_max_age') and young_rental_span >= K('surcharge_span_days')) else (P('young_renter_fee_daily_usd') + K('under_23_short_surcharge_usd') if (F('renter_age') <= K('surcharge_max_age') and young_rental_span < K('surcharge_span_days')) else P('young_renter_fee_daily_usd'))"
  - young_calibration_order: "CFIELD('adas', 'adas_order_id', retail_repair_id=F('retail_repair_id')) if F('retail_repair_id') else None"
  - young_sublet_date: "CFIELD('adas', 'sublet_date', retail_repair_id=F('retail_repair_id')) if F('retail_repair_id') else None"
  - young_calibration_done: "CFIELD('adas', 'completed_date', retail_repair_id=F('retail_repair_id')) if F('retail_repair_id') else None"
  - young_failed_attempts: "XCOUNT('adas', 'adas_events', event_type='adas_attempt', attempt_result='failed', adas_order_id=young_calibration_order) if young_calibration_order else 0"
  - young_passed_attempts: "XCOUNT('adas', 'adas_events', event_type='adas_attempt', attempt_result='passed', adas_order_id=young_calibration_order) if young_calibration_order else 0"
  - young_hold_days: "DAYS(young_sublet_date, young_calibration_done) + 1 if (young_sublet_date and young_calibration_done) else (1 if (young_failed_attempts >= 1 and young_passed_attempts >= 1) else 0)"
  - young_converted_booking: "EXISTS('estimate', status='converted')"
  - young_no_show_booking: "EXISTS('estimate', status='no_show')"
  - young_reliability_reduction: "K('reliable_reduction_pct') if (young_converted_booking and not young_no_show_booking) else (K('partial_reduction_pct') if young_converted_booking else 0)"
  - young_charged_days: "MX(0, young_fee_days - young_hold_days)"
  - result: "RND(young_charged_days * young_daily_fee * (100 - young_reliability_reduction) / 100, 2)"
  compute_basis:
    young_rental_days: "Rental days are the whole days between the pickup date and the return date, plus one where the return time as counted is later than the pickup time of day."
    young_fee_days: "The fee days follow a weekly maximum: a rental of seven or more rental days carries fee_days_per_week fee days for each full seven-day block plus its remaining rental days up to fee_days_per_week; a rental of at least weekly_rate_threshold_days but fewer than seven rental days carries its rental days up to fee_days_per_week; a shorter rental carries every rental day."
    young_rental_span: "whose pickup-to-return span is surcharge_span_days days or more"
    young_daily_fee: "The young-renter daily fee depends on the renter's age at pickup and the rental's span: a renter aged surcharge_max_age or younger whose pickup-to-return span is surcharge_span_days days or more pays the class young_renter_fee_daily_usd plus under_23_surcharge_usd; a renter aged surcharge_max_age or younger whose span is shorter pays the class young_renter_fee_daily_usd plus under_23_short_surcharge_usd; any older young renter pays the class young_renter_fee_daily_usd."
    young_calibration_order: "where the repair's calibration order was sublet to a dealer and has a completion date"
    young_sublet_date: "they are the days from the sublet date through the completion date, both counted"
    young_calibration_done: "they are the days from the sublet date through the completion date, both counted"
    young_failed_attempts: "where an in-house calibration attempt failed and a later in-house attempt passed, they are one day"
    young_passed_attempts: "where an in-house calibration attempt failed and a later in-house attempt passed, they are one day"
    young_hold_days: "The calibration hold days are the days the network's own calibration kept the repaired vehicle away from the renter: where the repair's calibration order was sublet to a dealer and has a completion date, they are the days from the sublet date through the completion date, both counted; where an in-house calibration attempt failed and a later in-house attempt passed, they are one day; otherwise they are zero."
    young_converted_booking: "a customer with a booking converted into a repair and no booking ever marked no-show takes reliable_reduction_pct"
    young_no_show_booking: "a customer with a converted booking and a no-show on record takes partial_reduction_pct"
    young_reliability_reduction: "The reliability reduction follows the customer's estimate bookings with the network: a customer with a booking converted into a repair and no booking ever marked no-show takes reliable_reduction_pct; a customer with a converted booking and a no-show on record takes partial_reduction_pct; any other customer takes zero."
    young_charged_days: "The charged fee days are the fee days less the calibration hold days, never below zero, and the young-renter charge is booked for those charged fee days as the days it covers."
    result: "The young-renter charge equals the charged fee days multiplied by the young-renter daily fee and by one hundred less the reliability reduction, divided by one hundred, rounded to the cent once at the end."
  factors:
  - id: weekly_fee_days
    effect: method
    decides: young_fee_days
    bindings: [young_rental_days, young_fee_days]
    ladder:
    - when: "seven or more rental days"
      method: "fee_days_per_week fee days per full seven-day block plus the remaining rental days up to fee_days_per_week"
    - when: "at least weekly_rate_threshold_days but fewer than seven rental days"
      method: "the rental days up to fee_days_per_week"
    - when: "otherwise (fewer than weekly_rate_threshold_days rental days)"
      method: "every rental day"
    baseline:
      young_fee_days: "young_rental_days"
    evidence: [date]
    cross_difficulty: null
  - id: age_span_daily_fee
    effect: parameter
    decides: young_daily_fee
    bindings: [young_rental_span, young_daily_fee]
    ladder:
    - when: "renter aged surcharge_max_age or younger and a pickup-to-return span of surcharge_span_days days or more"
      value: "young_renter_fee_daily_usd plus under_23_surcharge_usd"
    - when: "renter aged surcharge_max_age or younger and a shorter span"
      value: "young_renter_fee_daily_usd plus under_23_short_surcharge_usd"
    - when: "otherwise (a young renter older than surcharge_max_age)"
      value: "young_renter_fee_daily_usd"
    baseline:
      young_daily_fee: "P('young_renter_fee_daily_usd')"
    evidence: [date]
    cross_difficulty: null
  - id: calibration_hold_days
    effect: parameter
    decides: young_hold_days
    bindings: [young_calibration_order, young_sublet_date, young_calibration_done, young_failed_attempts, young_passed_attempts, young_hold_days]
    ladder:
    - when: "the repair's calibration order was sublet to a dealer and has a completion date"
      value: "the days from the sublet date through the completion date, both counted"
    - when: "an in-house attempt failed and a later in-house attempt passed"
      value: "one day"
    - when: "otherwise"
      value: "zero"
    baseline:
      young_hold_days: "0"
    evidence: [cross_category, history]
    cross_difficulty: adas
  - id: booking_reliability_reduction
    effect: parameter
    decides: young_reliability_reduction
    bindings: [young_converted_booking, young_no_show_booking, young_reliability_reduction]
    ladder:
    - when: "a converted estimate booking and no no-show booking on record"
      value: "reliable_reduction_pct"
    - when: "a converted estimate booking and a no-show booking on record"
      value: "partial_reduction_pct"
    - when: "otherwise"
      value: "zero"
    baseline:
      young_reliability_reduction: "0"
    evidence: [cross_category]
    cross_difficulty: estimate
  baseline:
    rule: >-
      A renter who is young at pickup, no older than young_renter_max_age, owes a young-renter charge on the rental,
      booked as one customer charge of the final invoice once the rental is returned and always the customer's. As
      standard, the young-renter charge is the class young_renter_fee_daily_usd for every rental day, rounded to the
      cent. Rental days are the whole days between the pickup date and the return date, plus one where the return
      time as counted is later than the pickup time of day.
    params: [young_renter_fee_daily_usd]
  inputs:
    history:
    - {category: adas, table: adas_events, aggregate: count, field: adas_event_id, filters: {event_type: adas_attempt}}
    cross_category: [adas, estimate]
- id: rental_ext_delay_goodwill
  base_policy_refs: [rental_evt_customer_settlement, rental_evt_rental_days]
  overwrite:
  - base_policy: rental_evt_customer_settlement
    superseded_clause: >-
      goodwill is capped at goodwill_credit_authority_days rental days at the class's partner rate per rental
      (rental_msr_goodwill_credited), beyond which the request is declined
    replaced_by: >-
      The delay goodwill credit is the credited delay days multiplied by the sum of the lost-day time value and the
      lost-day fee value, by the goodwill share and by one hundred plus the program uplift, divided by one hundred,
      but never more than the goodwill authority days at the class partner_daily_rate_usd less goodwill already
      credited on the rental, and never more than the time charge still standing after the credits against it,
      rounded to the cent once at the end.
  - base_policy: rental_evt_rental_days
    superseded_clause: >-
      a return no more than return_grace_minutes minutes into a new period does not start it
    replaced_by: >-
      Rental days are the whole days between the pickup date and the return date, plus one where the return time as
      counted is later than the pickup time of day.
  trigger: on_request
  subject: [rental_customer_credit]
  computes: amount_usd
  target_tool: accept_rental_goodwill_credit_52804ea3
  params:
    authority_days_full: 3
    authority_days_partial: 2
    overrun_major_business_days: 3
    share_full: 1.0
    share_partial: 0.75
    share_standard: 0.5
  rule: >-
    When a customer asks for amends because the network customer-pay repair the rental is tied to was held up, the
    desk offers a delay goodwill credit that names the rental's time charge; the customer accepts it on the rental,
    and it is booked as a goodwill credit.
    A goodwill credit for lost rental days is not fixed until the repair-customer discount owed on the time charge
    stands against it.
    The goodwill credit for lost rental days is fixed only after every young-renter fee the renter owes on the rental
    stands as a charge on it.
    As standard, the credited delay days are the business days (Monday to Friday) by which the repair's ready date
    fell after its target, counted from the repair start date less the repair tier's target_turnaround_business_days
    and never below zero, but no more than the class goodwill_credit_authority_days; each credited day is valued at
    the time charge posted on the final invoice less every credit standing on the rental, divided by the days posted
    on the time charge, plus the lost-day fee value; and the delay goodwill credit is share_standard of that value.
    The lost-day fee value is the young-renter charge standing on the rental divided by the rental days, or zero
    where no young-renter charge stands.
    Rental days are the whole days between the pickup date and the return date, plus one where the return time as
    counted is later than the pickup time of day.
    The delay goodwill credit is the credited delay days multiplied by the sum of the lost-day time value and the
    lost-day fee value, by the goodwill share and by one hundred plus the program uplift, divided by one hundred,
    but never more than the goodwill authority days at the class partner_daily_rate_usd less goodwill already
    credited on the rental, and never more than the time charge still standing after the credits against it,
    rounded to the cent once at the end.
    The credited delay days are the delay days but no more than the goodwill authority days.
    The delay days are measured from the repair's calibration order where the network's own calibration held the
    repair: where the order's first in-house attempt failed and the order was sublet to a dealer, they are the days
    from that first attempt to the completion date, counted as the difference between the two dates; where the first
    in-house attempt failed and a later in-house attempt passed, they are the days from the first attempt to the
    passing attempt, counted the same way; otherwise they are the business days by which the repair overran its
    target, as in the standard measure.
    The goodwill authority days depend on how the delay arose and on the customer's standing: where the calibration
    order was sublet to a dealer and the customer holds an active network workmanship warranty, they are
    authority_days_full; where exactly one of those two holds, they are authority_days_partial; otherwise they are
    the class goodwill_credit_authority_days.
    The lost-day time value is the time charge net of every credit standing on the rental, spread over the days the
    time charge rightly covers: where a billing-error credit stands on the rental, it is the time charge posted on
    the final invoice less every standing credit, divided by the rental days; where no billing-error credit stands
    but a corrected time charge stands, it is that corrected time charge less every standing credit, divided by the
    days posted on the corrected time charge; otherwise it is the time charge posted on the final invoice less every
    standing credit, divided by the days posted on the time charge.
    The goodwill share depends on the overrun and the delay's cause: where the repair overran its target by more
    than overrun_major_business_days business days and the calibration order was sublet to a dealer, it is
    share_full; where exactly one of those two holds, it is share_partial; otherwise it is share_standard.
    The program uplift follows the discount program on the customer-pay repair order: a military program takes the
    repair tier's military_discount_pct; a returning_customer program takes the repair tier's
    returning_customer_discount_pct; any other program takes zero.
  prerequisite:
  - problem: rental_ext_repair_customer_discount
    kind: value_input
    gate: lost_day_time_value
    form: state
    policy_source: >-
      A goodwill credit for lost rental days is not fixed until the repair-customer discount owed on the time charge
      stands against it.
    condition: >-
      The repair-customer discount credit owed on the rental's time charge stands on the rental ledger.
    resolved_by: credit_repair_customer_discount_d339b3bd
    effect: >-
      The credits standing against the rental grow by the repair-customer discount, so the lost-day time value falls
      to the time charge net of the billing-error and discount credits per rental day.
  - problem: rental_ext_young_renter_fee
    kind: value_input
    gate: lost_day_fee_value
    form: state
    policy_source: >-
      The goodwill credit for lost rental days is fixed only after every young-renter fee the renter owes on the rental
      stands as a charge on it.
    condition: >-
      A young-renter customer charge stands on the rental ledger for a renter who was young at pickup.
    resolved_by: charge_young_renter_fee_a6a6d206
    effect: >-
      The lost-day fee value becomes the booked young-renter charge divided by the rental days instead of zero.
  cross_category:
  - category: adas
    as: history
    reads: [adas_order_id, sublet_date, completed_date, adas_events.event_date, adas_events.attempt_result]
    note: The repair's calibration attempts and dealer sublet decide the delay days, the authority days and the goodwill share.
  - category: retail
    as: history
    reads: [repair_started_date, ready_date, discount_program, target_turnaround_business_days, military_discount_pct, returning_customer_discount_pct]
    note: The customer-pay repair's overrun of its target decides the standard delay days and the goodwill share; its discount program decides the program uplift.
  - category: warranty
    as: existence
    reads: [status]
    note: Whether the customer holds an active network workmanship warranty decides the goodwill authority days.
  compute:
  - goodwill_calibration_order: "(CFIELD('adas', 'adas_order_id', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - goodwill_first_attempt_failed: "(XLATEST('adas', 'adas_events', 'event_date', event_type='adas_attempt', attempt_number=1, attempt_result='failed', adas_order_id=goodwill_calibration_order)) if goodwill_calibration_order else None"
  - goodwill_sublet_date: "(CFIELD('adas', 'sublet_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - goodwill_calibration_done: "(CFIELD('adas', 'completed_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - goodwill_passing_attempt: "(XLATEST('adas', 'adas_events', 'event_date', event_type='adas_attempt', attempt_result='passed', adas_order_id=goodwill_calibration_order)) if goodwill_calibration_order else None"
  - goodwill_repair_start: "(CFIELD('retail', 'repair_started_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - goodwill_ready_date: "(CFIELD('retail', 'ready_date', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - goodwill_target_days: "(CPARAM('retail', 'target_turnaround_business_days', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - goodwill_span: "DAYS(goodwill_repair_start, goodwill_ready_date) if (goodwill_repair_start and goodwill_ready_date) else 0"
  - goodwill_start_weekday: "DAYS('2024-01-01', goodwill_repair_start) % 7 if goodwill_repair_start else 0"
  - goodwill_business_days: "(goodwill_span // 7) * 5 + int(goodwill_span % 7 >= 1 and (goodwill_start_weekday + 1) % 7 < 5) + int(goodwill_span % 7 >= 2 and (goodwill_start_weekday + 2) % 7 < 5) + int(goodwill_span % 7 >= 3 and (goodwill_start_weekday + 3) % 7 < 5) + int(goodwill_span % 7 >= 4 and (goodwill_start_weekday + 4) % 7 < 5) + int(goodwill_span % 7 >= 5 and (goodwill_start_weekday + 5) % 7 < 5) + int(goodwill_span % 7 >= 6 and (goodwill_start_weekday + 6) % 7 < 5)"
  - goodwill_overrun: "MX(0, goodwill_business_days - goodwill_target_days) if goodwill_target_days else 0"
  - goodwill_delay_days: "DAYS(goodwill_first_attempt_failed, goodwill_calibration_done) if (goodwill_first_attempt_failed and goodwill_sublet_date and goodwill_calibration_done) else (DAYS(goodwill_first_attempt_failed, goodwill_passing_attempt) if (goodwill_first_attempt_failed and goodwill_passing_attempt) else goodwill_overrun)"
  - goodwill_warranty_on_file: "EXISTS('warranty', status='active')"
  - goodwill_authority_days: "K('authority_days_full') if (goodwill_sublet_date and goodwill_warranty_on_file) else (K('authority_days_partial') if (goodwill_sublet_date or goodwill_warranty_on_file) else P('goodwill_credit_authority_days'))"
  - goodwill_credited_days: "MN(goodwill_delay_days, goodwill_authority_days)"
  - goodwill_rental_days: "DAYS(F('pickup_date'), F('return_date')) + (1 if F('return_time') > F('pickup_time') else 0)"
  - goodwill_time_charge: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_charge', charge_type='uncovered_days', settlement_kind='final')"
  - goodwill_time_days: "SUM('rental_ledger', 'days_count', event_type='rental_customer_charge', charge_type='uncovered_days', settlement_kind='final')"
  - goodwill_standing_credits: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_credit')"
  - goodwill_billing_error_credits: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_credit', credit_reason='billing_error')"
  - goodwill_corrected_charge: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_charge', charge_type='uncovered_days', settlement_kind='corrected')"
  - goodwill_corrected_days: "SUM('rental_ledger', 'days_count', event_type='rental_customer_charge', charge_type='uncovered_days', settlement_kind='corrected')"
  - lost_day_time_value: "(goodwill_time_charge - goodwill_standing_credits) / goodwill_rental_days if goodwill_billing_error_credits > 0 else ((goodwill_corrected_charge - goodwill_standing_credits) / goodwill_corrected_days if goodwill_corrected_days > 0 else ((goodwill_time_charge - goodwill_standing_credits) / goodwill_time_days if goodwill_time_days > 0 else 0))"
  - goodwill_young_charge: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_charge', charge_type='young_renter')"
  - lost_day_fee_value: "goodwill_young_charge / goodwill_rental_days if goodwill_young_charge > 0 else 0"
  - goodwill_share: "K('share_full') if (goodwill_overrun > K('overrun_major_business_days') and goodwill_sublet_date) else (K('share_partial') if (goodwill_overrun > K('overrun_major_business_days') or goodwill_sublet_date) else K('share_standard'))"
  - goodwill_program: "(CFIELD('retail', 'discount_program', retail_repair_id=F('retail_repair_id'))) if F('retail_repair_id') else None"
  - goodwill_program_uplift: "CPARAM('retail', 'military_discount_pct', retail_repair_id=F('retail_repair_id')) if goodwill_program == 'military' else (CPARAM('retail', 'returning_customer_discount_pct', retail_repair_id=F('retail_repair_id')) if goodwill_program == 'returning_customer' else 0)"
  - goodwill_already_credited: "SUM('rental_ledger', 'amount_usd', event_type='rental_customer_credit', credit_reason='goodwill')"
  - goodwill_limit: "goodwill_authority_days * P('partner_daily_rate_usd') - goodwill_already_credited"
  - result: "RND(MX(0, MN(goodwill_credited_days * (lost_day_time_value + lost_day_fee_value) * goodwill_share * (100 + goodwill_program_uplift) / 100, goodwill_limit, goodwill_time_charge - goodwill_standing_credits)), 2)"
  compute_basis:
    goodwill_calibration_order: "The delay days are measured from the repair's calibration order where the network's own calibration held the repair"
    goodwill_first_attempt_failed: "where the order's first in-house attempt failed and the order was sublet to a dealer, they are the days from that first attempt to the completion date"
    goodwill_sublet_date: "where the order's first in-house attempt failed and the order was sublet to a dealer"
    goodwill_calibration_done: "they are the days from that first attempt to the completion date"
    goodwill_passing_attempt: "where the first in-house attempt failed and a later in-house attempt passed, they are the days from the first attempt to the passing attempt"
    goodwill_repair_start: "the business days (Monday to Friday) by which the repair's ready date fell after its target, counted from the repair start date less the repair tier's target_turnaround_business_days and never below zero"
    goodwill_ready_date: "the business days (Monday to Friday) by which the repair's ready date fell after its target"
    goodwill_target_days: "counted from the repair start date less the repair tier's target_turnaround_business_days and never below zero"
    goodwill_span: "counted from the repair start date"
    goodwill_start_weekday: "the business days (Monday to Friday)"
    goodwill_business_days: "the business days (Monday to Friday) by which the repair's ready date fell after its target, counted from the repair start date"
    goodwill_overrun: "the business days (Monday to Friday) by which the repair's ready date fell after its target, counted from the repair start date less the repair tier's target_turnaround_business_days and never below zero"
