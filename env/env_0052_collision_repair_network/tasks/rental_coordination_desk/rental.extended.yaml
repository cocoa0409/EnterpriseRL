- id: rental_evt_extension
  subject:
  - rental_authorization
  - rental_coverage_end_update
  rule: 'An insurer pays extra days only on an extension it approves. The insurer''s approval of the extension request
    is recorded. A delay extension rests on the repair order: it is on hold, or it has a decided supplement that
    added labor hours. The days asked for a supplement delay are that supplement''s supplement_labor_hours divided
    by the repair class''s labor_hours_per_production_day, rounded up to the next whole day; for a parts delay,
    the business days of the back-order beyond the planned repair days; for a total loss, the days to the insurer''s
    settlement. One request asks for no more than max_extension_days_per_request days and reaches the insurer at
    least extension_request_lead_hours hours before the current coverage end; a later request may only cover days
    from the date of approval. Days lost to a delay the network caused (not parts, the insurer or the customer)
    are authorized as network_delay_courtesy, paid by the network, where network_delay_courtesy is true, without
    an insurer request. Every authorization moves the coverage end date by the days authorized. A customer_pay rental
    extends simply by keeping the car.'
  eligibility:
  - id: extension_approved
    applies_to:
    - rental_authorization
    kind: authorization
    condition: The insurer's approval of the extension request is recorded.
    evidence_fields:
    - rental_extension_requests.extension_request_id
    - rental_extension_requests.request_status
    - rental_extension_requests.days_approved
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_extension_requests.extension_request_id
      action_bindings:
        rental_extension_requests.extension_request_id: extension_request_id
  - id: delay_on_repair_order
    applies_to:
    - rental_authorization
    kind: state
    condition: 'A delay extension rests on the repair order: it is on hold, or it has a decided supplement that
      added labor hours.'
    evidence_fields:
    - claim_repairs.status
    - claim_repairs.hold_reason
    - claim_repairs.claim_repair_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_repairs.claim_repair_id
      action_bindings:
        claim_repairs.claim_repair_id: claim_repair_id
    state_contract:
      field: claim_repairs.status
      allowed:
      - on_hold
      - in_repair
  params:
    per_tier:
      Economy Rental:
        max_extension_days_per_request: =max_extension_days_per_request
        extension_request_lead_hours: =extension_request_lead_hours
        network_delay_courtesy: =network_delay_courtesy
      Compact Rental:
        max_extension_days_per_request: =max_extension_days_per_request
        extension_request_lead_hours: =extension_request_lead_hours
        network_delay_courtesy: =network_delay_courtesy
      Intermediate Rental:
        max_extension_days_per_request: =max_extension_days_per_request
        extension_request_lead_hours: =extension_request_lead_hours
        network_delay_courtesy: =network_delay_courtesy
      Full-Size Rental:
        max_extension_days_per_request: =max_extension_days_per_request
        extension_request_lead_hours: =extension_request_lead_hours
        network_delay_courtesy: =network_delay_courtesy
      Standard SUV Rental:
        max_extension_days_per_request: =max_extension_days_per_request
        extension_request_lead_hours: =extension_request_lead_hours
        network_delay_courtesy: =network_delay_courtesy
      Minivan Rental:
        max_extension_days_per_request: =max_extension_days_per_request
        extension_request_lead_hours: =extension_request_lead_hours
        network_delay_courtesy: =network_delay_courtesy
  measures:
  - rental_msr_extension_count
  - rental_msr_covered_days_remaining
- id: rental_evt_coverage_end
  subject:
  - rental_repair_notice
  - rental_coverage_end_update
  rule: 'Coverage of an insurance or warranty rental ends with the repair: on a vehicle_ready notice it continues
    through ready_notice_grace_business_days business days after the notice date (Monday to Friday, excluding network
    holidays); on a total_loss notice through total_loss_coverage_days calendar days after the notice date; on a
    repair_cancelled notice it ends on the notice date. When an earlier authorization would run later, the notice
    still ends coverage; when authorized days run out first, coverage ends with them. Every rental day starting
    after the coverage end date is the customer''s at the partner rate. A single rental agreement runs at most max_days_per_rental_agreement
    days before it is renewed at the branch.'
  eligibility: []
  params:
    per_tier:
      Economy Rental:
        ready_notice_grace_business_days: =ready_notice_grace_business_days
        total_loss_coverage_days: =total_loss_coverage_days
        max_days_per_rental_agreement: =max_days_per_rental_agreement
      Compact Rental:
        ready_notice_grace_business_days: =ready_notice_grace_business_days
        total_loss_coverage_days: =total_loss_coverage_days
        max_days_per_rental_agreement: =max_days_per_rental_agreement
      Intermediate Rental:
