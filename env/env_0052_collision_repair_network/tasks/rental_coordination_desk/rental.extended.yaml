        total_loss_coverage_days: =total_loss_coverage_days
        max_days_per_rental_agreement: =max_days_per_rental_agreement
      Standard SUV Rental:
        ready_notice_grace_business_days: =ready_notice_grace_business_days
        total_loss_coverage_days: =total_loss_coverage_days
