    - when: "no billing-error credit stands and a corrected time charge stands"
      method: "the corrected time charge less every standing credit, divided by the days posted on it"
    - when: "otherwise"
      method: "the final time charge less every standing credit, divided by the days posted on it"
    baseline:
      lost_day_time_value: "(goodwill_time_charge - goodwill_standing_credits) / goodwill_time_days if goodwill_time_days > 0 else 0"
    evidence: [history]
    cross_difficulty: null
  - id: delay_goodwill_share
