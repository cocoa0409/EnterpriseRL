events:
- type: rental_reserve
  target: rental_reservations
  mutation: create
  meaning: A replacement rental is reserved for a customer whose vehicle is in a network repair, glass job or warranty
    rework, or on the customer's own account.
  grain: One row per reservation.
  fields:
    rental_reservation_id: Reservation reference.
    customer_id: Renter.
    vehicle_id: Customer's vehicle being repaired.
    variant_name: Rental class reserved.
    coverage_source: first_party_rental_coverage, third_party_liability, customer_pay or warranty_courtesy.
    claim_repair_id: Insurance claim repair order the rental is for.
    retail_repair_id: Customer-pay repair order the rental is for.
    warranty_coverage_id: Warranty coverage a courtesy rental rests on.
    insurer_customer_id: Insurer paying covered days.
    daily_coverage_cap_usd: Insurer's daily cap.
    coverage_max_usd: Insurer's total rental limit for the claim.
    renter_age: Renter's age at pickup.
    reserved_date: Reservation date.
    branch_code: Partner branch.
  triggers: []
- type: rental_class_change
  target: rental_reservations
  mutation: update
  meaning: The reserved or rented class is changed.
  grain: One update per class change.
  fields:
    variant_name: New rental class.
  triggers: []
- type: rental_pickup
  target: rental_reservations
  mutation:
    transition:
      from: reserved
      to: on_rent
  meaning: The rental starts.
  grain: One transition per reservation.
  fields:
    status: Becomes on_rent.
    pickup_date: Pickup date.
    pickup_time: Pickup time, starting the first rental day.
  triggers: []
- type: rental_authorization
  target: rental_ledger
  meaning: 'Rental days are authorized to be paid by the insurer or the network: the initial authorization or an
    extension.'
  grain: One row per authorization on one reservation.
  distinguish_by:
  - authorization_number
  fields:
    entry_date: Authorization date.
    authorization_number: Ordinal of the authorization on the reservation (1 for the initial one).
    days_count: Days authorized.
    authorization_reason: initial, repair_delay_supplement, parts_delay, total_loss_settlement, warranty_courtesy
      or network_delay_courtesy.
    extension_request_id: Extension request approved; empty for the initial authorization and network courtesy days.
    paid_by: insurer or network.
  account: covered_days
  direction: in
  triggers: []
- type: rental_repair_notice
  target: rental_events
  meaning: 'The repair the rental is for reports a status that ends or limits rental coverage: vehicle ready, repair
    cancelled, or total loss.'
  grain: One row per notice type on one reservation.
  distinguish_by:
  - notice_type
  fields:
    event_date: Notice date.
    notice_type: vehicle_ready, repair_cancelled or total_loss.
    claim_repair_id: Insurance claim repair order reporting it.
    retail_repair_id: Customer-pay repair order reporting it.
  triggers: []
- type: rental_coverage_end_update
  target: rental_reservations
  mutation: update
  meaning: The last covered day of the rental is set or moved.
  grain: One update per notice or extension.
  fields:
    coverage_end_date: Last day on which the rental is covered.
  triggers: []
- type: rental_return
  target: rental_reservations
  mutation:
    transition:
      from: on_rent
      to: returned
  meaning: The rental is returned.
  grain: One transition per reservation.
  fields:
    status: Becomes returned.
    return_date: Return date.
    return_time: Return time.
  triggers: []
- type: rental_days_consumed
  target: rental_ledger
  meaning: Covered rental days used are drawn at settlement.
  grain: One row per settlement of one reservation.
  distinguish_by:
  - settlement_kind
  fields:
    entry_date: Settlement date.
    settlement_kind: final or corrected.
    days_count: Covered days used.
  account: covered_days
  direction: out
  triggers: []
- type: rental_customer_charge
  target: rental_ledger
  meaning: The customer's share of the final invoice is booked, one row per kind.
  grain: One row per charge type per settlement.
  distinguish_by:
  - charge_type
  - settlement_kind
  fields:
    entry_date: Charge date.
    settlement_kind: final or corrected.
    charge_type: uncovered_days, daily_cap_excess, class_difference, young_renter, additional_driver, child_seat,
      navigation, roadside, damage_waiver, liability_supplement, tolls, fuel or cleaning.
    days_count: Rental days the charge covers; 0 for flat charges.
    amount_usd: Charge (positive).
  account: rental_customer_balance
  direction: in
  triggers: []
- type: rental_direct_bill
  target: rental_ledger
  meaning: The covered portion of the final invoice is billed by the partner to the insurer, or to the network for
    courtesy days.
  grain: One row per payer per settlement.
  distinguish_by:
  - paid_by
  - settlement_kind
  fields:
    entry_date: Billing date.
    settlement_kind: final or corrected.
    paid_by: insurer or network.
    days_count: Days billed.
    amount_usd: Amount billed (positive).
  triggers: []
- type: rental_customer_payment
  target: rental_ledger
  meaning: The customer pays their share.
  grain: One row per payment.
  distinguish_by:
  - entry_date
  - payment_method
  - amount_usd
  fields:
    entry_date: Payment date.
    payment_method: credit_card or debit_card.
    amount_usd: Amount paid (positive).
  account: rental_customer_balance
  direction: out
  triggers: []
- type: rental_customer_credit
  target: rental_ledger
  meaning: A customer charge is reduced.
  grain: One row per credit reason per charge.
  distinguish_by:
  - source_entry_id
  - credit_reason
  fields:
    entry_date: Credit date.
    source_entry_id: The rental_customer_charge row credited.
    credit_reason: customer_pay_discount, billing_error or goodwill.
    amount_usd: Amount credited (positive).
  account: rental_customer_balance
  direction: out
  triggers: []
- type: rental_settle
  target: rental_reservations
  mutation:
    transition:
      from: returned
      to: settled
  meaning: The rental's final invoice is settled.
  grain: One transition per reservation.
  fields:
    status: Becomes settled.
    settled_date: Settlement date.
  triggers: []
- type: rental_cancel
  target: rental_reservations
  mutation:
    transition:
      from: reserved
      to: cancelled
  meaning: The reservation is cancelled before pickup.
  grain: One transition per reservation.
  fields:
    status: Becomes cancelled.
    closed_date: Cancellation date.
  triggers: []
measures:
- id: rental_msr_covered_days_remaining
  window: Life of the reservation.
  measure: Sum of days_count of rental_authorization rows minus sum of days_count of rental_days_consumed rows.
- id: rental_msr_extension_count
  window: Life of the reservation.
  measure: Count of rental_authorization rows with authorization_number above 1 and paid_by insurer.
- id: rental_msr_customer_balance
  window: Life of the reservation.
  measure: Sum of rental_customer_balance in-entries minus out-entries.
- id: rental_msr_goodwill_credited
  window: Life of the reservation.
  measure: Sum of amount_usd of rental_customer_credit rows with credit_reason goodwill.
policies:
- id: rental_agg_multi_holding
  subject:
  - rental_reserve
  rule: A customer may hold more than one reservation at once only for different vehicles in repair; there is no
    customer-level cap. Per repair, rental_agg_one_per_repair applies.
  eligibility: []
  params:
    max_per_customer: null
- id: rental_agg_one_per_repair
  subject:
  - rental_reserve
  rule: One insurance claim repair order, customer-pay repair order or warranty coverage may have at most one open
    reservation, where open means reserved or on_rent. No open reservation exists for the same repair order or warranty
    coverage. A different class is a class change on the open reservation, never a second reservation.
  eligibility:
  - id: one_open_reservation
    applies_to:
    - rental_reserve
    kind: dedup
    condition: No open reservation exists for the same repair order or warranty coverage.
    evidence_fields:
    - rental_reservations.claim_repair_id
    - rental_reservations.retail_repair_id
    - rental_reservations.warranty_coverage_id
    - rental_reservations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_reservations.claim_repair_id
      - - rental_reservations.retail_repair_id
      - - rental_reservations.warranty_coverage_id
      action_bindings:
        rental_reservations.claim_repair_id: claim_repair_id
        rental_reservations.retail_repair_id: retail_repair_id
        rental_reservations.warranty_coverage_id: warranty_coverage_id
    dedup_contract:
      table: rental_reservations
      mode: separate_record
      object_bindings:
        claim_repair_id: claim_repair_id
        retail_repair_id: retail_repair_id
        warranty_coverage_id: warranty_coverage_id
      duplicate_filters:
        status:
        - reserved
        - on_rent
      distinct_fields:
      - rental_reservation_id
