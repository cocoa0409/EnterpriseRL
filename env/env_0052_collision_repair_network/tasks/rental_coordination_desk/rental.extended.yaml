- id: rental_ext_network_courtesy_days
  base_policy_refs: [rental_evt_initial_authorization, rental_evt_extension]
  overwrite:
  - base_policy: rental_evt_extension
    superseded_clause: >-
      The insurer's approval of the extension request is recorded.
    replaced_by: >-
      Network courtesy days rest on no insurer request; they rest on the calibration order of the repair order the
      rental is for.
  - base_policy: rental_evt_extension
    superseded_clause: >-
      Every authorization moves the coverage end date by the days authorized.
    replaced_by: >-
      An authorization adds its days to the covered days on the rental ledger; it does not itself move the coverage
      end recorded on the reservation, which only the desk's coverage-end update sets.
  trigger: state_due
  subject: [rental_authorization]
  computes: days_count
  target_tool: authorize_network_courtesy_days_8334cede
  params:
    allowance_static_days: 1
    allowance_dynamic_days: 2
    allowance_dual_days: 3
    alignment_corrected_days: 1
    alignment_uncorrected_days: 2
    self_approved_pause_days: 1
    share_vehicle_fault_sublet: 0.5
    share_vehicle_fault: 0.75
    share_full: 1.0
  rule: >-
    Days lost to a delay the network caused on an insurance claim repair are authorized on the rental as
    network_delay_courtesy days, paid by the network, where the class's network_delay_courtesy is true; when the
    network's own sensor calibration on the repair order held the repair, the courtesy days are worked out from that
    calibration order as follows.
    Network courtesy days rest on no insurer request; they rest on the calibration order of the repair order the
    rental is for.
    An authorization adds its days to the covered days on the rental ledger; it does not itself move the coverage
    end recorded on the reservation, which only the desk's coverage-end update sets.
    As standard, the courtesy days are the calendar days from the calibration order's opening date to its completion
    date, less one allowance day for the calibration itself, never below zero.
    The courtesy days are the lost calibration days, less the procedure allowance, less the alignment days and less
    the insurer review days, never below zero, multiplied by the network's responsibility share and then rounded up
    to the next whole day.
    The lost calibration days are counted on the calibration order between a start and the window's closing date:
    where the order's first in-house attempt failed and the order was sublet to a dealer, they run from that first
    attempt to the window's closing date; where the first in-house attempt failed and a later in-house attempt
    passed, they run from the first attempt to the passing attempt; otherwise they run from the order's opening date
    to the window's closing date.
    The window's closing date depends on the rental: where a return is recorded on the reservation and the
    calibration order has no completion date or was completed after that return, it is the return date; where no
    return is recorded and the calibration order has no completion date, it is today's date; otherwise it is the
    calibration order's completion date.
    The procedure allowance follows the manufacturer procedure recorded on the calibration order: static_and_dynamic
    takes allowance_dual_days, dynamic takes allowance_dynamic_days, and any other procedure takes
    allowance_static_days.
    The alignment days follow the order's alignment checks: an out-of-spec check corrected in the same visit takes
    alignment_corrected_days; an out-of-spec check with none corrected takes alignment_uncorrected_days; otherwise
    zero.
    The insurer review days are the days the repair waited on the insurer for the latest supplement the insurer
    reviewed (the latest one routed to desk review, or when there is none the latest routed to field reinspection):
    where that supplement was submitted on or after the first failed in-house attempt and has been decided, they are
    the days from its submission to the insurer's decision on it; where no such reviewed supplement counts but a
    self-approved supplement was submitted on or after the first failed in-house attempt, they are
    self_approved_pause_days; otherwise zero.
    The network's responsibility share follows the attempt failures: where an attempt failed on a trouble code the
    vehicle returned and the order was sublet to a dealer, it is share_vehicle_fault_sublet; where an attempt failed
    on a returned trouble code and the order was not sublet, it is share_vehicle_fault; otherwise it is share_full.
  prerequisite: []
  cross_category:
  - category: adas
    as: history
    reads: [adas_order_id, opened_date, sublet_date, completed_date, oem_procedure, adas_events.event_date, adas_events.attempt_result, adas_events.failure_code, adas_events.alignment_result]
    note: The calibration order's attempts, alignment checks, procedure, sublet and completion decide the lost days, the allowance, the alignment days and the share.
  - category: claim
    as: history
    reads: [claim_supplements.event_date, claim_supplements.approval_route]
    note: Supplements awaiting the insurer's review during the calibration window decide the insurer review days.
  compute:
  - courtesy_calibration_order: "(CFIELD('adas', 'adas_order_id', claim_repair_id=F('claim_repair_id'))) if F('claim_repair_id') else None"
  - courtesy_order_opened: "(CFIELD('adas', 'opened_date', claim_repair_id=F('claim_repair_id'))) if F('claim_repair_id') else None"
  - courtesy_sublet_date: "(CFIELD('adas', 'sublet_date', claim_repair_id=F('claim_repair_id'))) if F('claim_repair_id') else None"
  - courtesy_order_completed: "(CFIELD('adas', 'completed_date', claim_repair_id=F('claim_repair_id'))) if F('claim_repair_id') else None"
  - courtesy_first_failed: "(XLATEST('adas', 'adas_events', 'event_date', event_type='adas_attempt', attempt_number=1, attempt_result='failed', adas_order_id=courtesy_calibration_order)) if courtesy_calibration_order else None"
  - courtesy_passing_attempt: "(XLATEST('adas', 'adas_events', 'event_date', event_type='adas_attempt', attempt_result='passed', adas_order_id=courtesy_calibration_order)) if courtesy_calibration_order else None"
  - courtesy_window_close: "F('return_date') if (F('return_date') and ((not courtesy_order_completed) or F('return_date') < courtesy_order_completed)) else (NOW if ((not F('return_date')) and (not courtesy_order_completed)) else courtesy_order_completed)"
  - courtesy_lost_days: "DAYS(courtesy_first_failed, courtesy_window_close) if (courtesy_first_failed and courtesy_sublet_date) else (DAYS(courtesy_first_failed, courtesy_passing_attempt) if (courtesy_first_failed and courtesy_passing_attempt) else (DAYS(courtesy_order_opened, courtesy_window_close) if courtesy_order_opened else 0))"
  - courtesy_procedure: "(CFIELD('adas', 'oem_procedure', claim_repair_id=F('claim_repair_id'))) if F('claim_repair_id') else None"
  - courtesy_allowance: "K('allowance_dual_days') if courtesy_procedure == 'static_and_dynamic' else (K('allowance_dynamic_days') if courtesy_procedure == 'dynamic' else K('allowance_static_days'))"
  - courtesy_alignment_out: "(XCOUNT('adas', 'adas_events', event_type='adas_alignment_check', alignment_result='out_of_spec', adas_order_id=courtesy_calibration_order)) if courtesy_calibration_order else None"
  - courtesy_alignment_fixed: "(XCOUNT('adas', 'adas_events', event_type='adas_alignment_check', alignment_result='out_of_spec', alignment_corrected=True, adas_order_id=courtesy_calibration_order)) if courtesy_calibration_order else None"
  - courtesy_alignment_days: "K('alignment_corrected_days') if courtesy_alignment_fixed >= 1 else (K('alignment_uncorrected_days') if courtesy_alignment_out >= 1 else 0)"
  - courtesy_desk_submit: "XLATEST('claim', 'claim_supplements', 'event_date', event_type='claim_supplement_submit', approval_route='desk_review', claim_repair_id=F('claim_repair_id'))"
  - courtesy_field_submit: "XLATEST('claim', 'claim_supplements', 'event_date', event_type='claim_supplement_submit', approval_route='field_reinspection', claim_repair_id=F('claim_repair_id'))"
  - courtesy_reviewed_route: "'desk_review' if courtesy_desk_submit else ('field_reinspection' if courtesy_field_submit else None)"
  - courtesy_reviewed_submit: "courtesy_desk_submit or courtesy_field_submit"
  - courtesy_reviewed_number: "XLATEST('claim', 'claim_supplements', 'supplement_number', event_type='claim_supplement_submit', approval_route=courtesy_reviewed_route, claim_repair_id=F('claim_repair_id')) if courtesy_reviewed_route else None"
  - courtesy_review_decided: "XLATEST('claim', 'claim_supplements', 'event_date', event_type='claim_supplement_decision', supplement_number=courtesy_reviewed_number, claim_repair_id=F('claim_repair_id')) if courtesy_reviewed_number else None"
  - courtesy_self_submit: "XLATEST('claim', 'claim_supplements', 'event_date', event_type='claim_supplement_submit', approval_route='self_approved', claim_repair_id=F('claim_repair_id'))"
  - courtesy_review_days: "DAYS(courtesy_reviewed_submit, courtesy_review_decided) if (courtesy_reviewed_submit and courtesy_review_decided and courtesy_first_failed and courtesy_reviewed_submit >= courtesy_first_failed) else (K('self_approved_pause_days') if (courtesy_self_submit and courtesy_first_failed and courtesy_self_submit >= courtesy_first_failed) else 0)"
  - courtesy_vehicle_fault_codes: "(XCOUNT('adas', 'adas_events', event_type='adas_attempt', failure_code='dtc_returned', adas_order_id=courtesy_calibration_order)) if courtesy_calibration_order else None"
  - courtesy_share: "K('share_vehicle_fault_sublet') if (courtesy_vehicle_fault_codes >= 1 and courtesy_sublet_date) else (K('share_vehicle_fault') if courtesy_vehicle_fault_codes >= 1 else K('share_full'))"
  - courtesy_shared_days: "MX(0, courtesy_lost_days - courtesy_allowance - courtesy_alignment_days - courtesy_review_days) * courtesy_share"
  - result: "(int(courtesy_shared_days) + (1 if courtesy_shared_days > int(courtesy_shared_days) else 0)) if P('network_delay_courtesy') else 0"
  compute_basis:
    courtesy_calibration_order: "when the network's own sensor calibration on the repair order held the repair, the courtesy days are worked out from that calibration order as follows."
    courtesy_order_opened: "otherwise they run from the order's opening date to the window's closing date."
    courtesy_sublet_date: "where the order's first in-house attempt failed and the order was sublet to a dealer, they run from that first attempt to the window's closing date"
    courtesy_order_completed: "otherwise it is the calibration order's completion date."
    courtesy_first_failed: "where the order's first in-house attempt failed and the order was sublet to a dealer, they run from that first attempt to the window's closing date"
    courtesy_passing_attempt: "where the first in-house attempt failed and a later in-house attempt passed, they run from the first attempt to the passing attempt"
    courtesy_window_close: "The window's closing date depends on the rental: where a return is recorded on the reservation and the calibration order has no completion date or was completed after that return, it is the return date; where no return is recorded and the calibration order has no completion date, it is today's date; otherwise it is the calibration order's completion date."
    courtesy_lost_days: "The lost calibration days are counted on the calibration order between a start and the window's closing date: where the order's first in-house attempt failed and the order was sublet to a dealer, they run from that first attempt to the window's closing date; where the first in-house attempt failed and a later in-house attempt passed, they run from the first attempt to the passing attempt; otherwise they run from the order's opening date to the window's closing date."
    courtesy_procedure: "The procedure allowance follows the manufacturer procedure recorded on the calibration order"
    courtesy_allowance: "static_and_dynamic takes allowance_dual_days, dynamic takes allowance_dynamic_days, and any other procedure takes allowance_static_days."
    courtesy_alignment_out: "an out-of-spec check with none corrected takes alignment_uncorrected_days"
    courtesy_alignment_fixed: "an out-of-spec check corrected in the same visit takes alignment_corrected_days"
    courtesy_alignment_days: "The alignment days follow the order's alignment checks: an out-of-spec check corrected in the same visit takes alignment_corrected_days; an out-of-spec check with none corrected takes alignment_uncorrected_days; otherwise zero."
    courtesy_desk_submit: "the latest one routed to desk review"
    courtesy_field_submit: "or when there is none the latest routed to field reinspection"
    courtesy_reviewed_route: "the latest supplement the insurer reviewed (the latest one routed to desk review, or when there is none the latest routed to field reinspection)"
    courtesy_reviewed_submit: "where that supplement was submitted on or after the first failed in-house attempt and has been decided"
    courtesy_reviewed_number: "the latest supplement the insurer reviewed (the latest one routed to desk review, or when there is none the latest routed to field reinspection)"
    courtesy_review_decided: "they are the days from its submission to the insurer's decision on it"
    courtesy_review_days: "The insurer review days are the days the repair waited on the insurer for the latest supplement the insurer reviewed (the latest one routed to desk review, or when there is none the latest routed to field reinspection): where that supplement was submitted on or after the first failed in-house attempt and has been decided, they are the days from its submission to the insurer's decision on it; where no such reviewed supplement counts but a self-approved supplement was submitted on or after the first failed in-house attempt, they are self_approved_pause_days; otherwise zero."
    courtesy_self_submit: "but a self-approved supplement was submitted on or after the first failed in-house attempt, they are self_approved_pause_days"
    courtesy_vehicle_fault_codes: "where an attempt failed on a trouble code the vehicle returned"
    courtesy_share: "The network's responsibility share follows the attempt failures: where an attempt failed on a trouble code the vehicle returned and the order was sublet to a dealer, it is share_vehicle_fault_sublet; where an attempt failed on a returned trouble code and the order was not sublet, it is share_vehicle_fault; otherwise it is share_full."
    courtesy_shared_days: "The courtesy days are the lost calibration days, less the procedure allowance, less the alignment days and less the insurer review days, never below zero, multiplied by the network's responsibility share and then rounded up to the next whole day."
    result: "Days lost to a delay the network caused on an insurance claim repair are authorized on the rental as network_delay_courtesy days, paid by the network, where the class's network_delay_courtesy is true"
  factors:
  - id: lost_day_start
    effect: method
    decides: courtesy_lost_days
    bindings: [courtesy_calibration_order, courtesy_order_opened, courtesy_first_failed, courtesy_passing_attempt, courtesy_lost_days]
    ladder:
    - when: "the first in-house attempt failed and the order was sublet to a dealer"
      method: "count from the first attempt to the window's closing date"
    - when: "the first in-house attempt failed and a later in-house attempt passed"
      method: "count from the first attempt to the passing attempt"
    - when: "otherwise"
      method: "count from the order's opening date to the window's closing date"
    baseline:
      courtesy_lost_days: "DAYS(courtesy_order_opened, courtesy_window_close) if courtesy_order_opened else 0"
    evidence: [cross_category, history, date]
    cross_difficulty: adas
  - id: window_closing_date
    effect: parameter
    decides: courtesy_window_close
    bindings: [courtesy_order_completed, courtesy_window_close]
    ladder:
    - when: "a return is recorded and the calibration has no completion date or was completed after the return"
      value: "the return date"
    - when: "no return is recorded and the calibration has no completion date"
      value: "today's date"
    - when: "otherwise"
      value: "the calibration's completion date"
    baseline:
      courtesy_window_close: "courtesy_order_completed"
    evidence: [cross_category, date]
    cross_difficulty: adas
  - id: procedure_allowance
    effect: parameter
    decides: courtesy_allowance
    bindings: [courtesy_procedure, courtesy_allowance]
    ladder:
    - when: "the manufacturer procedure is static_and_dynamic"
      value: "allowance_dual_days"
    - when: "the manufacturer procedure is dynamic"
      value: "allowance_dynamic_days"
    - when: "otherwise"
      value: "allowance_static_days"
    baseline:
      courtesy_allowance: "K('allowance_static_days')"
    evidence: [cross_category]
    cross_difficulty: adas
  - id: alignment_days
    effect: parameter
    decides: courtesy_alignment_days
    bindings: [courtesy_alignment_out, courtesy_alignment_fixed, courtesy_alignment_days]
    ladder:
    - when: "an out-of-spec alignment check was corrected in the same visit"
      value: "alignment_corrected_days"
    - when: "an out-of-spec check stands and none was corrected"
      value: "alignment_uncorrected_days"
    - when: "otherwise"
      value: "zero"
    baseline:
      courtesy_alignment_days: "0"
    evidence: [cross_category, history]
    cross_difficulty: adas
  - id: insurer_review_days
    effect: parameter
    decides: courtesy_review_days
    bindings: [courtesy_desk_submit, courtesy_field_submit, courtesy_reviewed_route, courtesy_reviewed_submit, courtesy_reviewed_number, courtesy_review_decided, courtesy_self_submit, courtesy_review_days]
    ladder:
    - when: "the latest supplement the insurer reviewed was submitted on or after the first failed attempt and has been decided"
      value: "days from its submission to the insurer's decision on it"
    - when: "no such reviewed supplement counts and a self-approved supplement was submitted on or after the first failed attempt"
      value: "self_approved_pause_days"
    - when: "otherwise"
      value: "zero"
    baseline:
      courtesy_review_days: "0"
    evidence: [cross_category, history]
    cross_difficulty: claim
  - id: responsibility_share
    effect: parameter
    decides: courtesy_share
    bindings: [courtesy_sublet_date, courtesy_vehicle_fault_codes, courtesy_share]
    ladder:
    - when: "an attempt failed on a trouble code the vehicle returned and the order was sublet to a dealer"
      value: "share_vehicle_fault_sublet"
    - when: "an attempt failed on a returned trouble code and the order was not sublet"
      value: "share_vehicle_fault"
    - when: "otherwise"
      value: "share_full"
    baseline:
      courtesy_share: "K('share_full')"
    evidence: [cross_category, history]
    cross_difficulty: adas
  baseline:
    rule: >-
      Days lost to a delay the network caused on an insurance claim repair are authorized on the rental as
      network_delay_courtesy days, paid by the network, where the class's network_delay_courtesy is true; when the
      network's own sensor calibration on the repair order held the repair, the courtesy days are worked out from
      that calibration order as follows. As standard, the courtesy days are the calendar days from the calibration
      order's opening date to its completion date, less one allowance day for the calibration itself, never below
      zero.
    params: [allowance_static_days, network_delay_courtesy]
  inputs:
    history:
    - {category: adas, table: adas_events, aggregate: latest, field: event_date, filters: {event_type: adas_attempt}}
    - {category: adas, table: adas_events, aggregate: count, field: adas_event_id, filters: {event_type: adas_alignment_check}}
    - {category: claim, table: claim_supplements, aggregate: latest, field: event_date, filters: {event_type: claim_supplement_submit}}
    cross_category: [adas, claim]
- id: rental_ext_insurer_extension_days
  base_policy_refs: [rental_evt_initial_authorization, rental_evt_extension]
  overwrite:
  - base_policy: rental_evt_extension
    superseded_clause: >-
      The days asked for a supplement delay are that supplement's supplement_labor_hours divided by the repair
      class's labor_hours_per_production_day, rounded up to the next whole day
    replaced_by: >-
      The supported days of a supplement-delay approval are the extension's supplement's labor hours multiplied by its
      approved share, divided by the repair class's labor_hours_per_production_day and rounded up to the next whole
      day, plus its added days, less the late-request days, never below zero.
  - base_policy: rental_evt_extension
    superseded_clause: >-
      Every authorization moves the coverage end date by the days authorized.
    replaced_by: >-
      An authorization adds its days to the covered days on the rental ledger; it does not itself move the coverage
      end recorded on the reservation, which only the desk's coverage-end update sets.
  trigger: state_due
  subject: [rental_authorization]
  computes: days_count
  target_tool: authorize_insurer_extension_days_b8e4d7d7
  params:
    structural_added_days: 2
    calibration_added_days: 1
  rule: >-
    An extension the insurer approved is posted on the rental as an insurer-paid authorization naming the approved
    extension request; the extension being posted is the most recently decided insurer approval on the reservation,
    and the network posts only the days the documented delay supports, never more than the days the insurer
    approved.
    An insurer extension is posted on the rental only after the courtesy days the network owes for its own delay on
    the same repair stand on the reservation.
    An authorization adds its days to the covered days on the rental ledger; it does not itself move the coverage
    end recorded on the reservation, which only the desk's coverage-end update sets.
    As standard, the authorized days are the days the insurer approved on that request.
    The authorized days are the lesser of the days the insurer approved and the supported days.
    The supported days follow the ground of the request: for a supplement delay they are computed from the
    extension's supplement; for a parts delay they are the days the request asked for, but no more than
    max_extension_days_per_request; for any other ground they are the days the insurer approved.
    The supported days of a supplement-delay approval are the extension's supplement's labor hours multiplied by its
    approved share, divided by the repair class's labor_hours_per_production_day and rounded up to the next whole
    day, plus its added days, less the late-request days, never below zero.
    The extension's supplement is chosen from the decisions on the repair order's supplements: where the insurer
    approved a supplement in full, it is the latest supplement approved in full; where none was approved in full
    but the insurer partly approved one, it is the latest supplement partly approved; otherwise it is the latest
    supplement submitted.
    The added days follow the extension's supplement's operations: a supplement adding structural operations adds
    structural_added_days; a supplement adding sensor calibrations and no structural operations adds
    calibration_added_days; any other supplement adds none.
    The approved share follows the insurer's decision on the extension's supplement: a partly approved supplement
    takes the approved amount divided by the amount submitted; a denied supplement takes zero; otherwise the share is
    one.
    The supported days run from the day after the insurer coverage end, the rental day on which the days the
    insurer has authorized on the rental run out, counting rental days from the pickup date as day one.
    A request reaches the insurer in time when the whole days from its request date to the insurer coverage end
    day, at twenty-four hours each, are at least extension_request_lead_hours; a request that reaches the insurer
    later may only cover days from the date of approval, so it loses as late-request days the days from the day
    after the insurer coverage end up to the day before the decision; a request that reached the insurer in time
    loses none.
  prerequisite:
  - problem: rental_ext_network_courtesy_days
    kind: state_gate
    gate: rental_ledger.authorization_reason
    form: state
    policy_source: >-
      An insurer extension is posted on the rental only after the courtesy days the network owes for its own delay on
      the same repair stand on the reservation.
    condition: >-
      Where the network's calibration window on the repair order supports courtesy days, a network_delay_courtesy
      authorization paid by the network stands on the rental ledger.
    resolved_by: authorize_network_courtesy_days_8334cede
    effect: >-
      The extension may be posted: the insurer's authorization then follows the network's on the reservation and
      carries the next authorization ordinal.
  cross_category:
  - category: claim
    as: history
    reads: [labor_hours_per_production_day, claim_supplements.supplement_number, claim_supplements.supplement_labor_hours, claim_supplements.includes_structural, claim_supplements.includes_calibration, claim_supplements.decision, claim_supplements.approved_amount_usd, claim_supplements.supplement_amount_usd]
    note: The decisions on the repair order's supplements choose the extension's supplement, whose hours, operations and approved share decide the supported days.
  compute:
  - extension_days_approved: "LATEST('rental_extension_requests', 'days_approved', date_field='decided_date', request_status='approved')"
  - extension_reason: "LATEST('rental_extension_requests', 'request_reason', date_field='decided_date', request_status='approved')"
  - extension_days_requested: "LATEST('rental_extension_requests', 'days_requested', date_field='decided_date', request_status='approved')"
  - extension_requested_at: "LATEST('rental_extension_requests', 'requested_at', date_field='decided_date', request_status='approved')"
  - extension_decided: "LATEST('rental_extension_requests', 'decided_date', date_field='decided_date', request_status='approved')"
  - extension_insurer_reach: "SUM('rental_ledger', 'days_count', event_type='rental_authorization', paid_by='insurer')"
  - extension_request_day: "(DAYS(F('pickup_date'), extension_requested_at) + 1) if extension_requested_at else 0"
  - extension_decision_day: "(DAYS(F('pickup_date'), extension_decided) + 1) if extension_decided else 0"
  - extension_late_days: "MX(0, extension_decision_day - 1 - extension_insurer_reach) if ((extension_insurer_reach - extension_request_day) * 24 < P('extension_request_lead_hours')) else 0"
  - extension_full_number: "XLATEST('claim', 'claim_supplements', 'supplement_number', event_type='claim_supplement_decision', decision='approved', claim_repair_id=F('claim_repair_id')) if F('claim_repair_id') else None"
  - extension_partial_number: "XLATEST('claim', 'claim_supplements', 'supplement_number', event_type='claim_supplement_decision', decision='partially_approved', claim_repair_id=F('claim_repair_id')) if F('claim_repair_id') else None"
  - extension_latest_number: "XLATEST('claim', 'claim_supplements', 'supplement_number', event_type='claim_supplement_submit', claim_repair_id=F('claim_repair_id')) if F('claim_repair_id') else None"
  - extension_supp_number: "extension_full_number if extension_full_number else (extension_partial_number if extension_partial_number else extension_latest_number)"
  - extension_supp_hours: "XLATEST('claim', 'claim_supplements', 'supplement_labor_hours', event_type='claim_supplement_submit', supplement_number=extension_supp_number, claim_repair_id=F('claim_repair_id')) if extension_supp_number else 0"
  - extension_supp_structural: "XLATEST('claim', 'claim_supplements', 'includes_structural', event_type='claim_supplement_submit', supplement_number=extension_supp_number, claim_repair_id=F('claim_repair_id')) if extension_supp_number else False"
  - extension_supp_calibration: "XLATEST('claim', 'claim_supplements', 'includes_calibration', event_type='claim_supplement_submit', supplement_number=extension_supp_number, claim_repair_id=F('claim_repair_id')) if extension_supp_number else False"
  - extension_added_days: "K('structural_added_days') if extension_supp_structural == True else (K('calibration_added_days') if (extension_supp_calibration == True and extension_supp_structural != True) else 0)"
  - extension_supp_amount: "XLATEST('claim', 'claim_supplements', 'supplement_amount_usd', event_type='claim_supplement_submit', supplement_number=extension_supp_number, claim_repair_id=F('claim_repair_id')) if extension_supp_number else 0"
  - extension_supp_decision: "XLATEST('claim', 'claim_supplements', 'decision', event_type='claim_supplement_decision', supplement_number=extension_supp_number, claim_repair_id=F('claim_repair_id')) if extension_supp_number else None"
  - extension_supp_approved_amount: "XLATEST('claim', 'claim_supplements', 'approved_amount_usd', event_type='claim_supplement_decision', supplement_number=extension_supp_number, claim_repair_id=F('claim_repair_id')) if extension_supp_number else 0"
  - extension_approved_share: "extension_supp_approved_amount / extension_supp_amount if (extension_supp_decision == 'partially_approved' and extension_supp_amount) else (0 if extension_supp_decision == 'denied' else 1)"
  - extension_production_rate: "CPARAM('claim', 'labor_hours_per_production_day', claim_repair_id=F('claim_repair_id')) if F('claim_repair_id') else None"
  - extension_supp_raw_days: "(extension_supp_hours * extension_approved_share / extension_production_rate) if (extension_supp_hours and extension_production_rate) else 0"
  - extension_supported_days: "MX(0, int(extension_supp_raw_days) + (1 if extension_supp_raw_days > int(extension_supp_raw_days) else 0) + extension_added_days - extension_late_days) if extension_reason == 'repair_delay_supplement' else (MN(extension_days_requested, P('max_extension_days_per_request')) if extension_reason == 'parts_delay' else extension_days_approved)"
  - result: "int(MN(extension_days_approved, extension_supported_days))"
  compute_basis:
    extension_days_approved: "As standard, the authorized days are the days the insurer approved on that request."
    extension_reason: "The supported days follow the ground of the request"
    extension_days_requested: "for a parts delay they are the days the request asked for, but no more than max_extension_days_per_request"
    extension_requested_at: "A request reaches the insurer in time when the whole days from its request date to the insurer coverage end day, at twenty-four hours each, are at least extension_request_lead_hours"
    extension_decided: "the extension being posted is the most recently decided insurer approval on the reservation"
    extension_insurer_reach: "the insurer coverage end, the rental day on which the days the insurer has authorized on the rental run out, counting rental days from the pickup date as day one."
    extension_request_day: "the whole days from its request date to the insurer coverage end day"
    extension_decision_day: "the days from the day after the insurer coverage end up to the day before the decision"
    extension_late_days: "A request reaches the insurer in time when the whole days from its request date to the insurer coverage end day, at twenty-four hours each, are at least extension_request_lead_hours; a request that reaches the insurer later may only cover days from the date of approval, so it loses as late-request days the days from the day after the insurer coverage end up to the day before the decision; a request that reached the insurer in time loses none."
    extension_full_number: "where the insurer approved a supplement in full, it is the latest supplement approved in full"
    extension_partial_number: "where none was approved in full but the insurer partly approved one, it is the latest supplement partly approved"
    extension_latest_number: "otherwise it is the latest supplement submitted."
    extension_supp_number: "The extension's supplement is chosen from the decisions on the repair order's supplements: where the insurer approved a supplement in full, it is the latest supplement approved in full; where none was approved in full but the insurer partly approved one, it is the latest supplement partly approved; otherwise it is the latest supplement submitted."
    extension_supp_hours: "the extension's supplement's labor hours"
    extension_supp_structural: "a supplement adding structural operations adds structural_added_days"
    extension_supp_calibration: "a supplement adding sensor calibrations and no structural operations adds calibration_added_days"
    extension_added_days: "The added days follow the extension's supplement's operations: a supplement adding structural operations adds structural_added_days; a supplement adding sensor calibrations and no structural operations adds calibration_added_days; any other supplement adds none."
    extension_supp_amount: "a partly approved supplement takes the approved amount divided by the amount submitted"
    extension_supp_decision: "The approved share follows the insurer's decision on the extension's supplement"
    extension_supp_approved_amount: "a partly approved supplement takes the approved amount divided by the amount submitted"
    extension_approved_share: "The approved share follows the insurer's decision on the extension's supplement: a partly approved supplement takes the approved amount divided by the amount submitted; a denied supplement takes zero; otherwise the share is one."
    extension_production_rate: "divided by the repair class's labor_hours_per_production_day"
    extension_supp_raw_days: "the extension's supplement's labor hours multiplied by its approved share, divided by the repair class's labor_hours_per_production_day"
    extension_supported_days: "The supported days follow the ground of the request: for a supplement delay they are computed from the extension's supplement; for a parts delay they are the days the request asked for, but no more than max_extension_days_per_request; for any other ground they are the days the insurer approved. The supported days of a supplement-delay approval are the extension's supplement's labor hours multiplied by its approved share, divided by the repair class's labor_hours_per_production_day and rounded up to the next whole day, plus its added days, less the late-request days, never below zero."
    result: "The authorized days are the lesser of the days the insurer approved and the supported days."
  factors:
  - id: supported_days_ground
    effect: method
    decides: extension_supported_days
    bindings: [extension_reason, extension_days_requested, extension_supported_days]
    ladder:
    - when: "the approved request's ground is a supplement delay"
      method: "compute from the extension's supplement: approved-share labor hours over the class production rate, rounded up, plus added days, less late-request days"
    - when: "the ground is a parts delay"
      method: "the days the request asked for, capped at max_extension_days_per_request"
    - when: "otherwise"
      method: "the days the insurer approved"
    baseline:
      extension_supported_days: "extension_days_approved"
    evidence: [history]
    cross_difficulty: null
  - id: extension_supplement_choice
    effect: method
    decides: extension_supp_number
    bindings: [extension_full_number, extension_partial_number, extension_latest_number, extension_supp_number]
    ladder:
    - when: "the insurer approved a supplement on the repair order in full"
      method: "take the latest supplement approved in full"
    - when: "no supplement was approved in full and the insurer partly approved one"
      method: "take the latest supplement partly approved"
    - when: "otherwise"
      method: "take the latest supplement submitted"
    baseline:
      extension_supp_number: "extension_latest_number"
    evidence: [cross_category, history]
    cross_difficulty: claim
  - id: supplement_added_days
    effect: parameter
    decides: extension_added_days
    bindings: [extension_supp_structural, extension_supp_calibration, extension_added_days]
    ladder:
    - when: "the extension's supplement adds structural operations"
      value: "structural_added_days"
    - when: "it adds sensor calibrations and no structural operations"
      value: "calibration_added_days"
    - when: "otherwise"
      value: "zero"
    baseline:
      extension_added_days: "0"
    evidence: [cross_category]
    cross_difficulty: claim
  - id: supplement_approved_share
    effect: parameter
    decides: extension_approved_share
    bindings: [extension_supp_amount, extension_supp_decision, extension_supp_approved_amount, extension_approved_share]
    ladder:
    - when: "the insurer partly approved the extension's supplement"
      value: "approved amount divided by the amount submitted"
    - when: "the insurer denied it"
      value: "zero"
    - when: "otherwise"
      value: "one"
    baseline:
      extension_approved_share: "1"
    evidence: [cross_category, history]
    cross_difficulty: claim
  baseline:
    rule: >-
      An extension the insurer approved is posted on the rental as an insurer-paid authorization naming the approved
      extension request; the extension being posted is the most recently decided insurer approval on the
      reservation, and the network posts only the days the documented delay supports, never more than the days the
      insurer approved. As standard, the authorized days are the days the insurer approved on that request.
    params: []
  inputs:
    history:
    - {table: rental_extension_requests, aggregate: latest, field: days_approved, filters: {request_status: approved}}
    - {table: rental_ledger, aggregate: sum, field: days_count, filters: {event_type: rental_authorization, paid_by: insurer}}
    - {category: claim, table: claim_supplements, aggregate: latest, field: supplement_number, filters: {event_type: claim_supplement_decision}}
    cross_category: [claim]
- id: rental_ext_self_pay_days_charge
  base_policy_refs: [rental_evt_settlement_split, rental_evt_options_and_fees, rental_evt_rental_days, rental_evt_coverage_end]
  overwrite:
  - base_policy: rental_evt_settlement_split
    superseded_clause: >-
      Every rental day not covered is an uncovered_days charge at partner_daily_rate_usd
    replaced_by: >-
      The self-pay charge prices the self-pay days by their count: seven or more self-pay days are charged the
      adjusted weekly rate for each full seven-day block plus the remaining self-pay days at the self-pay day rate,
      those remaining days never costing more than one adjusted weekly rate; at least weekly_rate_threshold_days but
      fewer than seven self-pay days are charged the lesser of those days at the self-pay day rate and one adjusted
      weekly rate; fewer self-pay days are charged at the self-pay day rate.
  - base_policy: rental_evt_coverage_end
    superseded_clause: >-
      Every rental day starting after the coverage end date is the customer's at the partner rate.
    replaced_by: >-
      The self-pay days are the rental days less the covered days, never below zero, and the self-pay charge is the
      priced self-pay days reduced by the standing reduction percent, rounded to the cent once at the end.
  - base_policy: rental_evt_rental_days
    superseded_clause: >-
      Covered days used are the rental days that start on or before the coverage end date, up to the covered days
      remaining (rental_msr_covered_days_remaining)
    replaced_by: >-
      The covered days of the self-pay charge depend on what stands on the reservation: where no repair notice stands
      and the days authorized, less any covered days already drawn, reach past the coverage end recorded on the
      reservation, they are those authorized days, but no more than the rental days; where a repair notice stands,
      they are the rental days that start on or before the latest notice date, but no more than the authorized days
      less any covered days drawn; otherwise they are the rental days that start on or before the recorded coverage
      end.
  - base_policy: rental_evt_rental_days
    superseded_clause: >-
      a return no more than return_grace_minutes minutes into a new period does not start it
    replaced_by: >-
      Rental days are the whole days between the pickup date and the return date, plus one where the return time as
      counted is later than the pickup time of day.
  trigger: on_request
  subject: [rental_customer_charge]
  computes: amount_usd
  target_tool: authorize_self_pay_days_charge_125d1a79
  params:
    hold_discount_pct: 15
    courtesy_major_days: 3
    network_delay_major_pct: 10
    network_delay_minor_pct: 5
    standing_reduction_full_pct: 10
    standing_reduction_partial_pct: 5
  rule: >-
    When a renter on an insurance rental asks to settle the rental days no insurer or network authorization covers,
    the desk works out the self-pay charge and the renter authorizes it on their own rental; it is booked as one
    uncovered_days customer charge on the final invoice of the returned rental.
    The self-pay charge is fixed only after the days the network's own calibration trouble cost the repair stand on
    the reservation as network courtesy days.
    A self-pay charge is not booked until every extension the insurer approved on the reservation stands as
    authorized days.
    As standard, the self-pay days are the rental days less the rental days that start on or before the coverage end
    recorded on the reservation, each charged at partner_daily_rate_usd, rounded to the cent.
    Rental days are the whole days between the pickup date and the return date, plus one where the return time as
    counted is later than the pickup time of day.
    The self-pay days are the rental days less the covered days, never below zero, and the self-pay charge is the
    priced self-pay days reduced by the standing reduction percent, rounded to the cent once at the end.
    The self-pay charge is booked for its self-pay days as the days it covers.
    The covered days of the self-pay charge depend on what stands on the reservation: where no repair notice stands
    and the days authorized, less any covered days already drawn, reach past the coverage end recorded on the
    reservation, they are those authorized days, but no more than the rental days; where a repair notice stands,
    they are the rental days that start on or before the latest notice date, but no more than the authorized days
    less any covered days drawn; otherwise they are the rental days that start on or before the recorded coverage
    end.
    The self-pay charge prices the self-pay days by their count: seven or more self-pay days are charged the
    adjusted weekly rate for each full seven-day block plus the remaining self-pay days at the self-pay day rate,
    those remaining days never costing more than one adjusted weekly rate; at least weekly_rate_threshold_days but
    fewer than seven self-pay days are charged the lesser of those days at the self-pay day rate and one adjusted
    weekly rate; fewer self-pay days are charged at the self-pay day rate.
    The adjusted weekly rate is the class weekly_rate_usd multiplied by the self-pay day rate and divided by
    partner_daily_rate_usd.
    The self-pay day rate is partner_daily_rate_usd reduced by the repair-status discount plus the network-delay
    discount, both in percent and added before they are applied once.
    The repair-status discount follows the status of the insurance claim repair the rental is for: a repair on hold
    takes hold_discount_pct; a repair authorized or in repair takes customer_pay_discount_pct; a repair in any other
    status takes zero.
    The network-delay discount follows the network courtesy days standing on the reservation: courtesy_major_days
    courtesy days or more take network_delay_major_pct; at least one but fewer than courtesy_major_days courtesy days
    take network_delay_minor_pct; no courtesy days take zero.
    The standing reduction follows the renter's standing with the network: a renter who holds an active network
    workmanship warranty and has an estimate booking converted into a repair takes standing_reduction_full_pct; a
    renter meeting exactly one of the two takes standing_reduction_partial_pct; any other renter takes zero.
  prerequisite:
  - problem: rental_ext_network_courtesy_days
    kind: value_input
    gate: selfpay_covered_days
    form: state
    policy_source: >-
      The self-pay charge is fixed only after the days the network's own calibration trouble cost the repair stand on
      the reservation as network courtesy days.
    condition: >-
      A network_delay_courtesy authorization paid by the network stands on the rental ledger for the days the
      calibration order's lost window supports.
    resolved_by: authorize_network_courtesy_days_8334cede
    effect: >-
      The authorized days grow by the courtesy days, so the covered days rise and the self-pay days fall; the
      network-delay discount also moves to the tier the courtesy days select.
  - problem: rental_ext_insurer_extension_days
    kind: value_input
    gate: selfpay_covered_days
    form: state
    policy_source: >-
      A self-pay charge is not booked until every extension the insurer approved on the reservation stands as
      authorized days.
    condition: >-
      Every approved extension request on the reservation is named by an insurer-paid authorization on the rental
      ledger.
    resolved_by: authorize_insurer_extension_days_b8e4d7d7
    effect: >-
      The authorized days grow by the posted extension days, so the covered days rise and the self-pay days fall.
  cross_category:
  - category: claim
    as: branch
    reads: [status]
    note: The status of the insurance claim repair decides the repair-status discount tier.
  - category: warranty
    as: existence
    reads: [status]
    note: An active network workmanship warranty decides the standing reduction tier.
  - category: estimate
    as: existence
    reads: [status]
    note: A converted estimate booking decides the standing reduction tier.
  compute:
  - selfpay_rental_days: "0 if not F('return_date') else DAYS(F('pickup_date'), F('return_date')) + (1 if F('return_time') > F('pickup_time') else 0)"
  - selfpay_authorized: "SUM('rental_ledger', 'days_count', event_type='rental_authorization')"
  - selfpay_drawn: "SUM('rental_ledger', 'days_count', event_type='rental_days_consumed')"
  - selfpay_notices: "COUNT('rental_events', event_type='rental_repair_notice')"
  - selfpay_notice_date: "LATEST('rental_events', 'event_date', event_type='rental_repair_notice')"
  - selfpay_recorded_end_days: "(DAYS(F('pickup_date'), F('coverage_end_date')) + 1) if F('coverage_end_date') else 0"
  - selfpay_covered_days: "MN(selfpay_rental_days, selfpay_authorized - selfpay_drawn) if (selfpay_notices == 0 and selfpay_authorized - selfpay_drawn > selfpay_recorded_end_days) else (MN(selfpay_rental_days, DAYS(F('pickup_date'), selfpay_notice_date) + 1, selfpay_authorized - selfpay_drawn) if selfpay_notices >= 1 else MN(selfpay_rental_days, selfpay_recorded_end_days))"
  - selfpay_days: "int(MX(0, selfpay_rental_days - selfpay_covered_days))"
  - selfpay_claim_status: "CFIELD('claim', 'status', claim_repair_id=F('claim_repair_id')) if F('claim_repair_id') else None"
  - selfpay_status_discount: "K('hold_discount_pct') if selfpay_claim_status == 'on_hold' else (P('customer_pay_discount_pct') if (selfpay_claim_status == 'authorized' or selfpay_claim_status == 'in_repair') else 0)"
  - selfpay_courtesy_days: "SUM('rental_ledger', 'days_count', event_type='rental_authorization', authorization_reason='network_delay_courtesy')"
  - selfpay_delay_discount: "K('network_delay_major_pct') if selfpay_courtesy_days >= K('courtesy_major_days') else (K('network_delay_minor_pct') if selfpay_courtesy_days >= 1 else 0)"
  - selfpay_day_rate: "P('partner_daily_rate_usd') * (1 - (selfpay_status_discount + selfpay_delay_discount) / 100)"
  - selfpay_adjusted_weekly: "P('weekly_rate_usd') * selfpay_day_rate / P('partner_daily_rate_usd')"
  - selfpay_priced: "(selfpay_days // 7) * selfpay_adjusted_weekly + MN((selfpay_days % 7) * selfpay_day_rate, selfpay_adjusted_weekly) if selfpay_days >= 7 else (MN(selfpay_days * selfpay_day_rate, selfpay_adjusted_weekly) if selfpay_days >= P('weekly_rate_threshold_days') else selfpay_days * selfpay_day_rate)"
  - selfpay_warranty: "EXISTS('warranty', status='active')"
  - selfpay_converted_booking: "EXISTS('estimate', status='converted')"
  - selfpay_reduction: "K('standing_reduction_full_pct') if (selfpay_warranty and selfpay_converted_booking) else (K('standing_reduction_partial_pct') if (selfpay_warranty or selfpay_converted_booking) else 0)"
  - result: "RND(selfpay_priced * (100 - selfpay_reduction) / 100, 2)"
  compute_basis:
    selfpay_rental_days: "Rental days are the whole days between the pickup date and the return date, plus one where the return time as counted is later than the pickup time of day."
    selfpay_authorized: "the days authorized, less any covered days already drawn"
    selfpay_drawn: "the days authorized, less any covered days already drawn"
    selfpay_notices: "where a repair notice stands"
    selfpay_notice_date: "they are the rental days that start on or before the latest notice date"
    selfpay_recorded_end_days: "otherwise they are the rental days that start on or before the recorded coverage end."
    selfpay_covered_days: "The covered days of the self-pay charge depend on what stands on the reservation: where no repair notice stands and the days authorized, less any covered days already drawn, reach past the coverage end recorded on the reservation, they are those authorized days, but no more than the rental days; where a repair notice stands, they are the rental days that start on or before the latest notice date, but no more than the authorized days less any covered days drawn; otherwise they are the rental days that start on or before the recorded coverage end."
    selfpay_days: "The self-pay days are the rental days less the covered days, never below zero"
    selfpay_claim_status: "The repair-status discount follows the status of the insurance claim repair the rental is for"
    selfpay_status_discount: "a repair on hold takes hold_discount_pct; a repair authorized or in repair takes customer_pay_discount_pct; a repair in any other status takes zero."
    selfpay_courtesy_days: "The network-delay discount follows the network courtesy days standing on the reservation"
    selfpay_delay_discount: "courtesy_major_days courtesy days or more take network_delay_major_pct; at least one but fewer than courtesy_major_days courtesy days take network_delay_minor_pct; no courtesy days take zero."
    selfpay_day_rate: "The self-pay day rate is partner_daily_rate_usd reduced by the repair-status discount plus the network-delay discount, both in percent and added before they are applied once."
    selfpay_adjusted_weekly: "The adjusted weekly rate is the class weekly_rate_usd multiplied by the self-pay day rate and divided by partner_daily_rate_usd."
    selfpay_priced: "The self-pay charge prices the self-pay days by their count: seven or more self-pay days are charged the adjusted weekly rate for each full seven-day block plus the remaining self-pay days at the self-pay day rate, those remaining days never costing more than one adjusted weekly rate; at least weekly_rate_threshold_days but fewer than seven self-pay days are charged the lesser of those days at the self-pay day rate and one adjusted weekly rate; fewer self-pay days are charged at the self-pay day rate."
    selfpay_warranty: "a renter who holds an active network workmanship warranty"
    selfpay_converted_booking: "has an estimate booking converted into a repair"
    selfpay_reduction: "The standing reduction follows the renter's standing with the network: a renter who holds an active network workmanship warranty and has an estimate booking converted into a repair takes standing_reduction_full_pct; a renter meeting exactly one of the two takes standing_reduction_partial_pct; any other renter takes zero."
    result: "the self-pay charge is the priced self-pay days reduced by the standing reduction percent, rounded to the cent once at the end."
  factors:
  - id: selfpay_coverage_reach
    effect: method
    decides: selfpay_covered_days
    bindings: [selfpay_authorized, selfpay_drawn, selfpay_notices, selfpay_notice_date, selfpay_recorded_end_days, selfpay_covered_days]
    ladder:
    - when: "no repair notice stands and the authorized days less drawn days reach past the recorded coverage end"
      method: "the authorized days less drawn days, capped at the rental days"
    - when: "a repair notice stands"
      method: "rental days starting on or before the latest notice date, capped at the authorized days less drawn days"
    - when: "otherwise"
      method: "rental days starting on or before the recorded coverage end"
    baseline:
      selfpay_covered_days: "MN(selfpay_rental_days, selfpay_recorded_end_days)"
    evidence: [history, date]
    cross_difficulty: null
  - id: selfpay_pricing_structure
    effect: method
    decides: selfpay_priced
    bindings: [selfpay_rental_days, selfpay_adjusted_weekly, selfpay_priced]
    ladder:
    - when: "seven or more self-pay days"
      method: "adjusted weekly rate per full seven-day block plus remaining days at the self-pay day rate, capped at one adjusted weekly rate"
    - when: "at least weekly_rate_threshold_days but fewer than seven self-pay days"
      method: "the lesser of the days at the self-pay day rate and one adjusted weekly rate"
    - when: "otherwise"
      method: "the days at the self-pay day rate"
    baseline:
      selfpay_priced: "selfpay_days * selfpay_day_rate"
    evidence: [date]
    cross_difficulty: null
  - id: repair_status_discount
    effect: parameter
    decides: selfpay_status_discount
    bindings: [selfpay_claim_status, selfpay_status_discount]
    ladder:
    - when: "the insurance claim repair is on hold"
      value: "hold_discount_pct"
    - when: "the insurance claim repair is authorized or in repair"
      value: "customer_pay_discount_pct"
    - when: "otherwise"
      value: "zero"
    baseline:
      selfpay_status_discount: "0"
    evidence: [cross_category]
    cross_difficulty: claim
  - id: network_delay_discount
    effect: parameter
    decides: selfpay_delay_discount
    bindings: [selfpay_courtesy_days, selfpay_delay_discount]
    ladder:
    - when: "courtesy_major_days network courtesy days or more stand on the reservation"
      value: "network_delay_major_pct"
    - when: "at least one but fewer than courtesy_major_days courtesy days stand"
      value: "network_delay_minor_pct"
    - when: "otherwise"
      value: "zero"
    baseline:
      selfpay_delay_discount: "0"
    evidence: [history]
    cross_difficulty: null
  - id: selfpay_standing_reduction
    effect: parameter
    decides: selfpay_reduction
    bindings: [selfpay_warranty, selfpay_converted_booking, selfpay_reduction]
    ladder:
    - when: "an active network workmanship warranty and a converted estimate booking"
      value: "standing_reduction_full_pct"
    - when: "exactly one of the two"
      value: "standing_reduction_partial_pct"
    - when: "otherwise"
      value: "zero"
    baseline:
      selfpay_reduction: "0"
    evidence: [cross_category]
    cross_difficulty: warranty
  baseline:
    rule: >-
      When a renter on an insurance rental asks to settle the rental days no insurer or network authorization
      covers, the desk works out the self-pay charge and the renter authorizes it on their own rental; it is booked as
      one uncovered_days customer charge on the final invoice of the returned rental. As standard, the self-pay days
      are the rental days less the rental days that start on or before the coverage end recorded on the reservation,
      each charged at partner_daily_rate_usd, rounded to the cent. Rental days are the whole days between the pickup
      date and the return date, plus one where the return time as counted is later than the pickup time of day.
    params: [partner_daily_rate_usd]
  inputs:
    history:
    - {table: rental_ledger, aggregate: sum, field: days_count, filters: {event_type: rental_authorization}}
    - {table: rental_events, aggregate: count, field: rental_event_id, filters: {event_type: rental_repair_notice}}
    cross_category: [claim, warranty, estimate]
