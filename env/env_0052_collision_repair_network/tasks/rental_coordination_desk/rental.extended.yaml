- id: rental_evt_settlement_split
  subject:
  - rental_customer_charge
  - rental_direct_bill
  - rental_settle
  rule: The final invoice is split within settlement_business_days business days of the return. The rental has been
    returned before its invoice is split. For first-party coverage the insurer is billed the covered days at the
    lesser of the partner rate and the daily cap, never more than coverage_max_usd in total, and the customer is
    charged the daily_cap_excess on each covered day plus any covered-day cost above coverage_max_usd as uncovered_days;
    for third-party liability the insurer is billed the covered days at the partner rate of the class the insurer
    covers; for a warranty courtesy rental the network is billed the covered days. Every rental day not covered
    is an uncovered_days charge at partner_daily_rate_usd; a customer_pay rental is charged entirely as uncovered_days,
    at weekly_rate_usd for each full seven-day block once it reaches weekly_rate_threshold_days days, with a customer_pay_discount
    credit of customer_pay_discount_pct percent when it is tied to a network repair. Class differences, young-renter
    fees, options, tolls, fuel and cleaning are always the customer's.
  eligibility:
  - id: rental_returned
    applies_to:
    - rental_customer_charge
    - rental_direct_bill
    kind: state
    condition: The rental has been returned before its invoice is split.
    evidence_fields:
    - rental_reservations.status
    - rental_reservations.rental_reservation_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rental_reservations.rental_reservation_id
      action_bindings:
        rental_reservations.rental_reservation_id: rental_reservation_id
    state_contract:
      field: rental_reservations.status
      allowed:
      - returned
  params:
    per_tier:
      Economy Rental:
        settlement_business_days: =settlement_business_days
        partner_daily_rate_usd: =partner_daily_rate_usd
        weekly_rate_usd: =weekly_rate_usd
        weekly_rate_threshold_days: =weekly_rate_threshold_days
        customer_pay_discount_pct: =customer_pay_discount_pct
      Compact Rental:
        settlement_business_days: =settlement_business_days
        partner_daily_rate_usd: =partner_daily_rate_usd
        weekly_rate_usd: =weekly_rate_usd
        weekly_rate_threshold_days: =weekly_rate_threshold_days
        customer_pay_discount_pct: =customer_pay_discount_pct
      Intermediate Rental:
        settlement_business_days: =settlement_business_days
        partner_daily_rate_usd: =partner_daily_rate_usd
        weekly_rate_usd: =weekly_rate_usd
        weekly_rate_threshold_days: =weekly_rate_threshold_days
        customer_pay_discount_pct: =customer_pay_discount_pct
      Full-Size Rental:
        settlement_business_days: =settlement_business_days
        partner_daily_rate_usd: =partner_daily_rate_usd
        weekly_rate_usd: =weekly_rate_usd
        weekly_rate_threshold_days: =weekly_rate_threshold_days
        customer_pay_discount_pct: =customer_pay_discount_pct
      Standard SUV Rental:
        settlement_business_days: =settlement_business_days
        partner_daily_rate_usd: =partner_daily_rate_usd
        weekly_rate_usd: =weekly_rate_usd
        weekly_rate_threshold_days: =weekly_rate_threshold_days
        customer_pay_discount_pct: =customer_pay_discount_pct
      Minivan Rental:
        settlement_business_days: =settlement_business_days
        partner_daily_rate_usd: =partner_daily_rate_usd
        weekly_rate_usd: =weekly_rate_usd
        weekly_rate_threshold_days: =weekly_rate_threshold_days
        customer_pay_discount_pct: =customer_pay_discount_pct
  formula:
    when: coverage_source == 'first_party_rental_coverage'
    covered_day_cost: min(partner_daily_rate_usd, daily_coverage_cap_usd)
    insurer_portion: min(coverage_max_usd, days_count * covered_day_cost)
    daily_cap_excess: days_count * max(0, partner_daily_rate_usd - daily_coverage_cap_usd)
    over_limit_uncovered: max(0, days_count * covered_day_cost - coverage_max_usd)
- id: rental_evt_options_and_fees
  subject:
  - rental_customer_charge
