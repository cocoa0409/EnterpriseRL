extended_policies:
- id: adas_ext_alignment_check_charge
  base_policy_refs: [adas_evt_charges, adas_evt_precheck]
  overwrite:
  - base_policy: adas_evt_precheck
    superseded_clause: on a customer-pay order the check posts an alignment_check charge and a correction an alignment_correction charge
    replaced_by: On a customer-pay order the alignment checks are billed together as one alignment check charge, posted on the day of the order's first out-of-spec check, or on the precheck date where every check was in spec, and covering the checks recorded on the order when it is posted.
  trigger: state_due
  subject: [adas_charge]
  computes: amount_usd
  target_tool: post_alignment_check_charge_59500100
  params:
    half_up_guard: 0.000001
    returning_structural_rate: 0.80
    returning_rate: 0.90
    returning_recent_days: 730
    returning_late_days: 1460
    rack_open_rate: 0.75
    rack_done_rate: 0.90
    member_recent_rate: 0.90
    member_rate: 0.95
    member_recent_days: 365
    no_record_days: 99999
  rule: >-
    On a customer-pay order the alignment checks are billed together as one alignment check charge, posted on the
    day of the order's first out-of-spec check, or on the precheck date where every check was in spec, and covering the checks recorded on the order when it is posted. The alignment check charge is the tier's alignment check fee
    for each alignment check recorded on the order when the charge is posted, rounded to the cent, half up.
    How many checks the alignment check charge bills follows the order's check record: where a correction is
    recorded on the order, the checks billed are the checks recorded less one for each correction, because the
    re-check that follows a correction is part of the correction; where no correction is recorded, two or more
    checks are recorded and the order's latest check was made more than the tier's alignment check validity days after its first check, only the latest
    check is billed, because the earlier check lapsed unused; on any other order every check recorded is billed.
    The returning-customer rate on the alignment check fee is 0.80 where the vehicle has a network insurance claim
    repair delivered no more than 730 days before the day the charge is posted and that repair's class is a structural class
    (its name contains Structural); it is 0.90 where that repair was delivered no more than 730 days before and is
    of a non-structural class, or was delivered more than 730 but no more than 1460 days before; otherwise it is 1.
    The rack rate on the alignment check fee is 0.75 where the order's source is a network customer-pay repair that
    is still open (opened, in repair or awaiting approval), 0.90 where its source is a network customer-pay repair
    that is ready, delivered or closed, and 1 otherwise.
    The member rate on the alignment check fee is 0.90 where the vehicle holds an active network lifetime
    workmanship warranty (a Certified Structural Lifetime Warranty or a Collision Lifetime Workmanship Warranty)
    issued no more than 365 days before the day the charge is posted, 0.95 where it holds such an active warranty issued
    earlier, and 1 where it holds none.
    The fee for one check is the tier's alignment check fee multiplied by the returning-customer rate, the rack rate
    and the member rate, each rate acting on that fee and none on another rate's result; the fee for one check is
    then multiplied by the number of checks billed, and only that final figure is rounded to the cent, half up.
    Days are calendar days counted from the earlier date to the later date, the earlier date not counted.
  prerequisite: []
  cross_category:
  - category: claim
    as: branch
    reads: [delivered_date, variant_name]
    note: The returning-customer rate is decided from the vehicle's network insurance claim repair, its delivery date and class.
  - category: retail
    as: branch
    reads: [status]
    note: The rack rate is decided from the status of the order's source customer-pay repair.
  - category: warranty
    as: branch
    reads: [issued_date, status, variant_name]
    note: The member rate is decided from an active lifetime workmanship warranty on the vehicle and its issue date.
  compute:
  - n_checks: "COUNT('adas_events', event_type='adas_alignment_check')"
  - n_corrections: "COUNT('adas_events', event_type='adas_alignment_check', alignment_corrected=True)"
  - first_check_date: "LATEST('adas_events', 'event_date', event_type='adas_alignment_check', check_number=1)"
  - latest_check_date: "LATEST('adas_events', 'event_date', event_type='adas_alignment_check')"
  - check_span_days: "DAYS(first_check_date, latest_check_date) if first_check_date else 0"
  - checks_billed: "(n_checks - n_corrections) if n_corrections >= 1 else (1 if (n_checks >= 2 and check_span_days > P('alignment_check_validity_days')) else n_checks)"
  - claim_delivered: "CFIELD('claim', 'delivered_date', vehicle_id=F('vehicle_id'))"
  - claim_class: "CFIELD('claim', 'variant_name', vehicle_id=F('vehicle_id')) or ''"
  - claim_days: "DAYS(claim_delivered, NOW) if claim_delivered else K('no_record_days')"
  - returning_rate: "K('returning_structural_rate') if (claim_days <= K('returning_recent_days') and 'Structural' in claim_class) else (K('returning_rate') if ((claim_days <= K('returning_recent_days') and not ('Structural' in claim_class)) or (claim_days > K('returning_recent_days') and claim_days <= K('returning_late_days'))) else 1.0)"
  - source_repair_status: "CFIELD('retail', 'status', retail_repair_id=F('retail_repair_id')) or ''"
  - rack_rate: "K('rack_open_rate') if (F('source_type') == 'customer_pay_repair' and (source_repair_status == 'opened' or source_repair_status == 'in_repair' or source_repair_status == 'awaiting_approval')) else (K('rack_done_rate') if (F('source_type') == 'customer_pay_repair' and (source_repair_status == 'ready' or source_repair_status == 'delivered' or source_repair_status == 'closed')) else 1.0)"
  - member_issued: "CFIELD('warranty', 'issued_date', vehicle_id=F('vehicle_id'), status='active', variant_name='Certified Structural Lifetime Warranty') or CFIELD('warranty', 'issued_date', vehicle_id=F('vehicle_id'), status='active', variant_name='Collision Lifetime Workmanship Warranty')"
  - member_days: "DAYS(member_issued, NOW) if member_issued else K('no_record_days')"
  - member_rate: "K('member_recent_rate') if (member_issued and member_days <= K('member_recent_days')) else (K('member_rate') if member_issued else 1.0)"
  - check_fee: "P('alignment_check_fee_usd') * returning_rate * rack_rate * member_rate"
  - result: "RND(check_fee * checks_billed + K('half_up_guard'), 2)"
  compute_basis:
    n_checks: "The alignment check charge is the tier's alignment check fee for each alignment check recorded on the order when the charge is posted, rounded to the cent, half up."
    n_corrections: "where a correction is recorded on the order, the checks billed are the checks recorded less one for each correction, because the re-check that follows a correction is part of the correction"
    first_check_date: "where no correction is recorded, two or more checks are recorded and the order's latest check was made more than the tier's alignment check validity days after its first check, only the latest check is billed, because the earlier check lapsed unused"
    latest_check_date: "where no correction is recorded, two or more checks are recorded and the order's latest check was made more than the tier's alignment check validity days after its first check, only the latest check is billed, because the earlier check lapsed unused"
    check_span_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    checks_billed: "How many checks the alignment check charge bills follows the order's check record: where a correction is recorded on the order, the checks billed are the checks recorded less one for each correction, because the re-check that follows a correction is part of the correction; where no correction is recorded, two or more checks are recorded and the order's latest check was made more than the tier's alignment check validity days after its first check, only the latest check is billed, because the earlier check lapsed unused; on any other order every check recorded is billed."
    claim_delivered: "where the vehicle has a network insurance claim repair delivered no more than 730 days before the day the charge is posted"
    claim_class: "that repair's class is a structural class (its name contains Structural)"
    claim_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    returning_rate: "The returning-customer rate on the alignment check fee is 0.80 where the vehicle has a network insurance claim repair delivered no more than 730 days before the day the charge is posted and that repair's class is a structural class (its name contains Structural); it is 0.90 where that repair was delivered no more than 730 days before and is of a non-structural class, or was delivered more than 730 but no more than 1460 days before; otherwise it is 1."
    source_repair_status: "where the order's source is a network customer-pay repair that is still open (opened, in repair or awaiting approval)"
    rack_rate: "The rack rate on the alignment check fee is 0.75 where the order's source is a network customer-pay repair that is still open (opened, in repair or awaiting approval), 0.90 where its source is a network customer-pay repair that is ready, delivered or closed, and 1 otherwise."
    member_issued: "where the vehicle holds an active network lifetime workmanship warranty (a Certified Structural Lifetime Warranty or a Collision Lifetime Workmanship Warranty)"
    member_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    member_rate: "The member rate on the alignment check fee is 0.90 where the vehicle holds an active network lifetime workmanship warranty (a Certified Structural Lifetime Warranty or a Collision Lifetime Workmanship Warranty) issued no more than 365 days before the day the charge is posted, 0.95 where it holds such an active warranty issued earlier, and 1 where it holds none."
    check_fee: "The fee for one check is the tier's alignment check fee multiplied by the returning-customer rate, the rack rate and the member rate, each rate acting on that fee and none on another rate's result"
    result: "the fee for one check is then multiplied by the number of checks billed, and only that final figure is rounded to the cent, half up."
  factors:
  - id: checks_billed
    effect: method
    decides: checks_billed
    bindings: [n_checks, n_corrections, first_check_date, latest_check_date, check_span_days, checks_billed]
    ladder:
    - when: "a correction is recorded on the order"
      method: "bill the checks recorded less one for each correction (the re-check after a correction is part of the correction)"
    - when: "no correction is recorded, two or more checks are recorded and the order's latest check was made more than the tier's alignment check validity days after its first check"
      method: "bill only the latest check (the earlier check lapsed unused)"
    - when: "otherwise"
      method: "bill every check recorded"
    baseline:
      checks_billed: "n_checks"
    evidence: [history, date]
    cross_difficulty: null
  - id: returning_customer_rate
    effect: parameter
    decides: returning_rate
    bindings: [claim_delivered, claim_class, claim_days, returning_rate]
    ladder:
    - when: "a network insurance claim repair on the vehicle delivered no more than 730 days before the day the charge is posted and of a structural class"
      value: "K('returning_structural_rate')"
    - when: "such a repair delivered no more than 730 days before and of a non-structural class, or delivered more than 730 but no more than 1460 days before"
      value: "K('returning_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      returning_rate: "1.0"
    evidence: [cross_category, date]
    cross_difficulty: claim
  - id: rack_rate
    effect: parameter
    decides: rack_rate
    bindings: [source_repair_status, rack_rate]
    ladder:
    - when: "the order's source is a network customer-pay repair still open (opened, in repair or awaiting approval)"
      value: "K('rack_open_rate')"
    - when: "the order's source is a network customer-pay repair that is ready, delivered or closed"
      value: "K('rack_done_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      rack_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: null
  - id: member_rate
    effect: parameter
    decides: member_rate
    bindings: [member_issued, member_days, member_rate]
    ladder:
    - when: "an active network lifetime workmanship warranty on the vehicle issued no more than 365 days before the day the charge is posted"
      value: "K('member_recent_rate')"
    - when: "such an active warranty issued earlier"
      value: "K('member_rate')"
    - when: "no such active warranty"
      value: "1"
    baseline:
      member_rate: "1.0"
    evidence: [cross_category, date]
    cross_difficulty: warranty
  baseline:
    rule: >-
      The alignment check charge is the tier's alignment check fee for each alignment check recorded on the order when the charge is posted, rounded to the cent, half up.
    params: [alignment_check_fee_usd]
  inputs:
    history:
    - {table: adas_events, aggregate: count, field: check_number, filters: {event_type: adas_alignment_check}}
    - {table: adas_events, aggregate: latest, field: event_date, filters: {event_type: adas_alignment_check}}
    cross_category: [claim, retail, warranty]
- id: adas_ext_correction_authorization
  base_policy_refs: [adas_evt_settlement, adas_evt_precheck]
  overwrite:
  - base_policy: adas_evt_precheck
    superseded_clause: on a customer-pay order the check posts an alignment_check charge and a correction an alignment_correction charge
    replaced_by: On a customer-pay order an out-of-spec alignment is corrected only once the customer authorizes the correction by paying the authorization amount, and the correction's charge, posted on the day the correction is made, is the correction quote the customer authorized.
  - base_policy: adas_evt_settlement
    superseded_clause: A customer pays a customer-pay order's balance (adas_msr_balance) on completion by one of the accepted_payment_methods
    replaced_by: Whatever the order still owes after the authorization amount is paid on completion by one of the tier's accepted payment methods.
  trigger: on_request
  subject: [adas_payment]
  computes: amount_usd
  target_tool: pay_alignment_correction_authorization_61ce2890
  params:
    half_up_guard: 0.000001
    prompt_apply_days: 3
    half: 0.5
    collect_full: 1.0
    collect_recent: 0.75
    collect_standard: 0.5
    no_show_recent_days: 183
    no_show_window_days: 730
    returning_structural_rate: 0.85
    returning_rate: 0.92
    returning_recent_days: 730
    returning_late_days: 1460
    rack_open_rate: 0.80
    rack_done_rate: 0.90
    no_record_days: 99999
  rule: >-
    On a customer-pay order an out-of-spec alignment is corrected only once the customer authorizes the correction
    by paying the authorization amount, and the correction's charge, posted on the day the correction is made, is
    the correction quote the customer authorized. Whatever the order still owes after the authorization amount is
    paid on completion by one of the tier's accepted payment methods.
    The amount collected when a customer authorizes an alignment correction is not fixed until the order carries the
    alignment check charge owed for the checks recorded on it.
    The authorization amount is half the correction quote plus the alignment check charge standing unpaid on the order, rounded to the cent, half up. The correction quote is the tier's alignment correction fee.
    The alignment check charge standing on the order is that charge less the write-offs booked against it, and it
    stands unpaid to the extent it exceeds the payments already made on the order.
    How the correction quote treats the alignment check charge standing on the order depends on when the customer
    authorizes the correction: within 3 days of the order's latest out-of-spec check, the whole of that charge is
    applied toward the correction and the quote is the rated correction fee less that charge; after 3 days but within
    the tier's alignment check validity days of that check, half of that charge, rounded to the cent, half up, is applied and
    the quote is the rated correction fee less that half; later than that, nothing is applied and the quote is the
    rated correction fee.
    The share of the correction quote collected at authorization is the whole quote where the customer's most recent
    estimate booking that ended as a no-show closed no more than 183 days before the authorization, three quarters
    (0.75) where it closed more than 183 but no more than 730 days before, and half otherwise.
    The returning-customer rate on the correction fee is 0.85 where the vehicle has a network insurance claim repair
    delivered no more than 730 days before the authorization and that repair's class is a structural class (its name
    contains Structural); it is 0.92 where that repair was delivered no more than 730 days before and is of a
    non-structural class, or was delivered more than 730 but no more than 1460 days before; otherwise it is 1.
    The rack rate on the correction fee is 0.80 where the order's source is a network customer-pay repair that is
    still open (opened, in repair or awaiting approval), 0.90 where its source is a network customer-pay repair that
    is ready, delivered or closed, and 1 otherwise.
    The rated correction fee is the tier's alignment correction fee multiplied by the returning-customer rate and the
    rack rate, each acting on that fee, and rounded to the cent, half up; the check charge applied is then taken off the rated correction fee to give the correction quote, which is never below zero, and a correction quoted at zero posts no correction charge; the share is taken of that quote, the unpaid alignment check charge
    is added to it, and that sum is rounded to the cent, half up.
    Days are calendar days counted from the earlier date to the later date, the earlier date not counted.
  prerequisite:
  - problem: adas_ext_alignment_check_charge
    kind: value_input
    gate: check_charged
    form: state
    policy_source: The amount collected when a customer authorizes an alignment correction is not fixed until the order carries the alignment check charge owed for the checks recorded on it.
    condition: The order's calibration money history carries an alignment check charge entry covering the alignment checks recorded on the order.
    resolved_by: post_alignment_check_charge_59500100
    effect: Once the alignment check charge stands, the check charge read by this computation rises from zero to that charge, which changes both the part applied toward the correction and the unpaid check charge added to the authorization amount.
  cross_category:
  - category: claim
    as: branch
    reads: [delivered_date, variant_name]
    note: The returning-customer rate on the correction fee is decided from the vehicle's network insurance claim repair.
  - category: retail
    as: branch
    reads: [status]
    note: The rack rate on the correction fee is decided from the status of the order's source customer-pay repair.
  - category: estimate
    as: branch
    reads: [status, closed_date]
    note: The share of the quote collected is decided from the customer's estimate booking that ended as a no-show.
  compute:
  - out_of_spec_date: "LATEST('adas_events', 'event_date', event_type='adas_alignment_check', alignment_result='out_of_spec')"
  - days_since_finding: "DAYS(out_of_spec_date, NOW) if out_of_spec_date else K('no_record_days')"
  - check_charge_entry: "LATEST('adas_ledger', 'adas_entry_id', date_field='entry_date', event_type='adas_charge', charge_type='alignment_check')"
  - check_charged: "SUM('adas_ledger', 'amount_usd', event_type='adas_charge', charge_type='alignment_check')"
  - check_reduced: "SUM('adas_ledger', 'amount_usd', event_type='adas_no_charge', source_entry_id=check_charge_entry)"
  - payments_made: "SUM('adas_ledger', 'amount_usd', event_type='adas_payment')"
  - check_standing: "check_charged - check_reduced"
  - check_unpaid: "MX(0, check_standing - payments_made)"
  - check_applied: "check_standing if days_since_finding <= K('prompt_apply_days') else (RND(check_standing * K('half') + K('half_up_guard'), 2) if days_since_finding <= P('alignment_check_validity_days') else 0.0)"
  - no_show_closed: "CFIELD('estimate', 'closed_date', status='no_show')"
  - no_show_days: "DAYS(no_show_closed, NOW) if no_show_closed else K('no_record_days')"
  - collect_share: "K('collect_full') if no_show_days <= K('no_show_recent_days') else (K('collect_recent') if no_show_days <= K('no_show_window_days') else K('collect_standard'))"
  - claim_delivered: "CFIELD('claim', 'delivered_date', vehicle_id=F('vehicle_id'))"
  - claim_class: "CFIELD('claim', 'variant_name', vehicle_id=F('vehicle_id')) or ''"
  - claim_days: "DAYS(claim_delivered, NOW) if claim_delivered else K('no_record_days')"
  - returning_rate: "K('returning_structural_rate') if (claim_days <= K('returning_recent_days') and 'Structural' in claim_class) else (K('returning_rate') if ((claim_days <= K('returning_recent_days') and not ('Structural' in claim_class)) or (claim_days > K('returning_recent_days') and claim_days <= K('returning_late_days'))) else 1.0)"
  - source_repair_status: "CFIELD('retail', 'status', retail_repair_id=F('retail_repair_id')) or ''"
  - rack_rate: "K('rack_open_rate') if (F('source_type') == 'customer_pay_repair' and (source_repair_status == 'opened' or source_repair_status == 'in_repair' or source_repair_status == 'awaiting_approval')) else (K('rack_done_rate') if (F('source_type') == 'customer_pay_repair' and (source_repair_status == 'ready' or source_repair_status == 'delivered' or source_repair_status == 'closed')) else 1.0)"
  - rated_correction: "RND(P('alignment_correction_fee_usd') * returning_rate * rack_rate + K('half_up_guard'), 2)"
  - correction_quote: "MX(0, rated_correction - check_applied)"
  - result: "RND(collect_share * correction_quote + check_unpaid + K('half_up_guard'), 2)"
  compute_basis:
    out_of_spec_date: "within 3 days of the order's latest out-of-spec check"
    days_since_finding: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    check_charge_entry: "The alignment check charge standing on the order is that charge less the write-offs booked against it"
    check_charged: "The authorization amount is half the correction quote plus the alignment check charge standing unpaid on the order, rounded to the cent, half up."
    check_reduced: "The alignment check charge standing on the order is that charge less the write-offs booked against it"
    check_standing: "The alignment check charge standing on the order is that charge less the write-offs booked against it"
    payments_made: "it stands unpaid to the extent it exceeds the payments already made on the order"
    check_unpaid: "it stands unpaid to the extent it exceeds the payments already made on the order"
    check_applied: "How the correction quote treats the alignment check charge standing on the order depends on when the customer authorizes the correction: within 3 days of the order's latest out-of-spec check, the whole of that charge is applied toward the correction and the quote is the rated correction fee less that charge; after 3 days but within the tier's alignment check validity days of that check, half of that charge, rounded to the cent, half up, is applied and the quote is the rated correction fee less that half; later than that, nothing is applied and the quote is the rated correction fee."
    no_show_closed: "the customer's most recent estimate booking that ended as a no-show"
    no_show_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    collect_share: "The share of the correction quote collected at authorization is the whole quote where the customer's most recent estimate booking that ended as a no-show closed no more than 183 days before the authorization, three quarters (0.75) where it closed more than 183 but no more than 730 days before, and half otherwise."
    claim_delivered: "where the vehicle has a network insurance claim repair delivered no more than 730 days before the authorization"
    claim_class: "that repair's class is a structural class (its name contains Structural)"
    claim_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    returning_rate: "The returning-customer rate on the correction fee is 0.85 where the vehicle has a network insurance claim repair delivered no more than 730 days before the authorization and that repair's class is a structural class (its name contains Structural); it is 0.92 where that repair was delivered no more than 730 days before and is of a non-structural class, or was delivered more than 730 but no more than 1460 days before; otherwise it is 1."
    source_repair_status: "where the order's source is a network customer-pay repair that is still open (opened, in repair or awaiting approval)"
    rack_rate: "The rack rate on the correction fee is 0.80 where the order's source is a network customer-pay repair that is still open (opened, in repair or awaiting approval), 0.90 where its source is a network customer-pay repair that is ready, delivered or closed, and 1 otherwise."
    rated_correction: "The rated correction fee is the tier's alignment correction fee multiplied by the returning-customer rate and the rack rate, each acting on that fee, and rounded to the cent, half up"
    correction_quote: "the check charge applied is then taken off the rated correction fee to give the correction quote, which is never below zero"
    result: "the share is taken of that quote, the unpaid alignment check charge is added to it, and that sum is rounded to the cent, half up."
  factors:
  - id: check_applied_toward_correction
    effect: method
    decides: check_applied
    bindings: [out_of_spec_date, days_since_finding, check_applied]
    ladder:
    - when: "the correction is authorized within 3 days of the order's latest out-of-spec check"
      method: "apply the whole alignment check charge standing toward the correction: the quote is the rated correction fee less that charge"
    - when: "it is authorized after 3 days but within the tier's alignment check validity days of that check"
      method: "apply half of that charge, rounded to the cent: the quote is the rated correction fee less that half"
    - when: "otherwise"
      method: "apply nothing: the quote is the rated correction fee"
    baseline:
      check_applied: "0.0"
    evidence: [history, date]
    cross_difficulty: null
  - id: authorization_share
    effect: parameter
    decides: collect_share
    bindings: [no_show_closed, no_show_days, collect_share]
    ladder:
    - when: "the customer's most recent estimate booking that ended as a no-show closed no more than 183 days before the authorization"
      value: "K('collect_full')"
    - when: "it closed more than 183 but no more than 730 days before"
      value: "K('collect_recent')"
    - when: "otherwise"
      value: "K('collect_standard')"
    baseline:
      collect_share: "K('collect_standard')"
    evidence: [cross_category, date]
    cross_difficulty: estimate
  - id: correction_returning_rate
    effect: parameter
    decides: returning_rate
    bindings: [claim_delivered, claim_class, claim_days, returning_rate]
    ladder:
    - when: "a network insurance claim repair on the vehicle delivered no more than 730 days before the authorization and of a structural class"
      value: "K('returning_structural_rate')"
    - when: "such a repair delivered no more than 730 days before and of a non-structural class, or delivered more than 730 but no more than 1460 days before"
      value: "K('returning_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      returning_rate: "1.0"
    evidence: [cross_category, date]
    cross_difficulty: claim
  - id: correction_rack_rate
    effect: parameter
    decides: rack_rate
    bindings: [source_repair_status, rack_rate]
    ladder:
    - when: "the order's source is a network customer-pay repair still open (opened, in repair or awaiting approval)"
      value: "K('rack_open_rate')"
    - when: "the order's source is a network customer-pay repair that is ready, delivered or closed"
      value: "K('rack_done_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      rack_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: null
  baseline:
    rule: >-
      The authorization amount is half the correction quote plus the alignment check charge standing unpaid on the order, rounded to the cent, half up. The correction quote is the tier's alignment correction fee.
    params: [alignment_correction_fee_usd, collect_standard]
  inputs:
    history:
    - {table: adas_events, aggregate: latest, field: event_date, filters: {event_type: adas_alignment_check, alignment_result: out_of_spec}}
    - {table: adas_ledger, aggregate: sum, field: amount_usd, filters: {event_type: adas_charge, charge_type: alignment_check}}
    - {table: adas_ledger, aggregate: sum, field: amount_usd, filters: {event_type: adas_payment}}
    cross_category: [claim, retail, estimate]
- id: adas_ext_alignment_comeback_credit
  base_policy_refs: [adas_evt_settlement]
  overwrite:
  - base_policy: adas_evt_settlement
    superseded_clause: goodwill is capped at goodwill_credit_authority_usd per order (adas_msr_goodwill_written_off), beyond which the request is declined
    replaced_by: The comeback credit is capped at the tier's goodwill credit authority for the order less the goodwill already written off on it, except that the cap is twice that authority where the repair was of a structural class and the comeback window is no more than 90 days, and one and a half times that authority where the repair was of a structural class and the window is more than 90 days or the repair was of a non-structural class and the window is no more than 30 days; any other goodwill write-off on the order stays capped at the tier's goodwill credit authority less the goodwill already written off on it, beyond which the request is declined.
  trigger: state_due
  subject: [adas_no_charge]
  computes: amount_usd
  target_tool: post_comeback_goodwill_credit_c6e84f0b
  params:
    half_up_guard: 0.000001
    window_days: 180
    near_days: 30
    mid_days: 90
    near_share: 0.50
    mid_share: 0.35
    far_share: 0.20
    structural_weight: 1.0
    major_weight: 0.80
    standard_weight: 0.60
    cap_high_multiple: 2.0
    cap_mid_multiple: 1.5
    half: 0.5
    no_record_days: 99999
  rule: >-
    A customer-pay order whose vehicle was delivered from a network insurance claim repair no more than 180 days
    before the end of the comeback window, and which carries an alignment correction charge, is owed a comeback
    credit for the alignment work the repair left behind; it is booked as a goodwill write-off against the alignment
    correction charge on the day that charge posts.
    The comeback credit is the order's alignment correction charge times a window share of 0.20 and a repair-class
    weight of 0.60, never more than the tier's goodwill credit authority less the goodwill already written off on the
    order, and never more than the correction charge, rounded to the cent, half up. The comeback window is measured in calendar
    days from the claim repair's delivery date to the date of the order's latest out-of-spec alignment check.
    Where the window ends follows how the order arose: for an order opened on the customer's own request it ends on
    the order's opening date, the day the customer reported the trouble; for an order opened on a network customer-pay repair it ends on the date of the order's first alignment check, the day the vehicle already on the network's rack was first measured; for an order opened on a glass replacement, as for any other customer-pay order, it ends on the date of the order's latest out-of-spec alignment check, the day the misalignment was found.
    The window share is 0.50 where the comeback window is no more than 30 days, 0.35 where it is more than 30 but no
    more than 90 days, and 0.20 otherwise.
    The repair-class weight is 1.0 where the claim repair's class is a structural class (its name contains
    Structural), 0.80 where it is a Major Claim Repair, and 0.60 otherwise.
    The comeback credit is capped at the tier's goodwill credit authority for the order less the goodwill already
    written off on it, except that the cap is twice that authority where the repair was of a structural class and
    the comeback window is no more than 90 days, and one and a half times that authority where the repair was of a
    structural class and the window is more than 90 days or the repair was of a non-structural class and the window is no more than 30 days; any other goodwill write-off on the order stays capped at the tier's goodwill credit authority less the goodwill already written off on it, beyond which the request is declined.
    The amount the credit is figured on follows the order's check record: where the order's first alignment check
    found the alignment out of spec and the correction was made at that visit, it is the correction charge plus the
    alignment check charge; where a later out-of-spec check was corrected at its visit, it is the correction charge
    plus half the alignment check charge, the half rounded to the cent, half up; otherwise it is the correction charge alone.
    The amount figured on is multiplied by the window share and by the repair-class weight, each acting on that
    amount; the lowest of that product, the cap less the goodwill already written off (never below zero) and the
    correction charge is taken, and only that figure is rounded to the cent, half up.
    Days are calendar days counted from the earlier date to the later date, the earlier date not counted.
  prerequisite: []
  cross_category:
  - category: claim
    as: branch
    reads: [delivered_date, variant_name]
    note: The window share, repair-class weight and cap are decided from the vehicle's network insurance claim repair.
  compute:
  - correction_charge: "SUM('adas_ledger', 'amount_usd', event_type='adas_charge', charge_type='alignment_correction')"
  - out_of_spec_date: "LATEST('adas_events', 'event_date', event_type='adas_alignment_check', alignment_result='out_of_spec')"
  - first_check_date: "LATEST('adas_events', 'event_date', event_type='adas_alignment_check', check_number=1)"
  - window_end: "F('opened_date') if F('source_type') == 'customer_request' else (first_check_date if F('source_type') == 'customer_pay_repair' else out_of_spec_date)"
  - claim_delivered: "CFIELD('claim', 'delivered_date', vehicle_id=F('vehicle_id'))"
  - comeback_days: "DAYS(claim_delivered, window_end) if (claim_delivered and window_end) else K('no_record_days')"
  - window_share: "K('near_share') if comeback_days <= K('near_days') else (K('mid_share') if comeback_days <= K('mid_days') else K('far_share'))"
  - claim_class: "CFIELD('claim', 'variant_name', vehicle_id=F('vehicle_id')) or ''"
  - class_weight: "K('structural_weight') if 'Structural' in claim_class else (K('major_weight') if claim_class == 'Major Claim Repair' else K('standard_weight'))"
  - goodwill_already: "SUM('adas_ledger', 'amount_usd', event_type='adas_no_charge', no_charge_reason='goodwill')"
  - credit_cap: "P('goodwill_credit_authority_usd') * K('cap_high_multiple') if ('Structural' in claim_class and comeback_days <= K('mid_days')) else (P('goodwill_credit_authority_usd') * K('cap_mid_multiple') if (('Structural' in claim_class and comeback_days > K('mid_days')) or (not ('Structural' in claim_class) and comeback_days <= K('near_days'))) else P('goodwill_credit_authority_usd'))"
  - check_charge: "SUM('adas_ledger', 'amount_usd', event_type='adas_charge', charge_type='alignment_check')"
  - first_check_result: "LATEST('adas_events', 'alignment_result', event_type='adas_alignment_check', check_number=1)"
  - first_check_corrected: "LATEST('adas_events', 'alignment_corrected', event_type='adas_alignment_check', check_number=1)"
  - n_corrections: "COUNT('adas_events', event_type='adas_alignment_check', alignment_corrected=True)"
  - credit_base: "(correction_charge + check_charge) if (first_check_result == 'out_of_spec' and first_check_corrected == True) else ((correction_charge + RND(check_charge * K('half') + K('half_up_guard'), 2)) if n_corrections >= 1 else correction_charge)"
  - raw_credit: "credit_base * window_share * class_weight"
  - result: "RND(MN(raw_credit, MX(0, credit_cap - goodwill_already), correction_charge) + K('half_up_guard'), 2) if comeback_days <= K('window_days') else 0.0"
  compute_basis:
    correction_charge: "The comeback credit is the order's alignment correction charge times a window share of 0.20 and a repair-class weight of 0.60, never more than the tier's goodwill credit authority less the goodwill already written off on the order, and never more than the correction charge, rounded to the cent, half up."
    out_of_spec_date: "The comeback window is measured in calendar days from the claim repair's delivery date to the date of the order's latest out-of-spec alignment check."
    first_check_date: "for an order opened on a network customer-pay repair it ends on the date of the order's first alignment check"
    window_end: "Where the window ends follows how the order arose: for an order opened on the customer's own request it ends on the order's opening date, the day the customer reported the trouble; for an order opened on a network customer-pay repair it ends on the date of the order's first alignment check, the day the vehicle already on the network's rack was first measured; for an order opened on a glass replacement, as for any other customer-pay order, it ends on the date of the order's latest out-of-spec alignment check, the day the misalignment was found."
    claim_delivered: "A customer-pay order whose vehicle was delivered from a network insurance claim repair no more than 180 days before the end of the comeback window, and which carries an alignment correction charge, is owed a comeback credit"
    comeback_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    window_share: "The window share is 0.50 where the comeback window is no more than 30 days, 0.35 where it is more than 30 but no more than 90 days, and 0.20 otherwise."
    claim_class: "where the claim repair's class is a structural class (its name contains Structural)"
    class_weight: "The repair-class weight is 1.0 where the claim repair's class is a structural class (its name contains Structural), 0.80 where it is a Major Claim Repair, and 0.60 otherwise."
    goodwill_already: "capped at the tier's goodwill credit authority for the order less the goodwill already written off on it"
    credit_cap: "The comeback credit is capped at the tier's goodwill credit authority for the order less the goodwill already written off on it, except that the cap is twice that authority where the repair was of a structural class and the comeback window is no more than 90 days, and one and a half times that authority where the repair was of a structural class and the window is more than 90 days or the repair was of a non-structural class and the window is no more than 30 days; any other goodwill write-off on the order stays capped at the tier's goodwill credit authority less the goodwill already written off on it, beyond which the request is declined."
    check_charge: "it is the correction charge plus the alignment check charge"
    first_check_result: "where the order's first alignment check found the alignment out of spec and the correction was made at that visit"
    first_check_corrected: "where the order's first alignment check found the alignment out of spec and the correction was made at that visit"
    n_corrections: "where a later out-of-spec check was corrected at its visit"
    credit_base: "The amount the credit is figured on follows the order's check record: where the order's first alignment check found the alignment out of spec and the correction was made at that visit, it is the correction charge plus the alignment check charge; where a later out-of-spec check was corrected at its visit, it is the correction charge plus half the alignment check charge, the half rounded to the cent, half up; otherwise it is the correction charge alone."
    raw_credit: "The amount figured on is multiplied by the window share and by the repair-class weight, each acting on that amount"
    result: "the lowest of that product, the cap less the goodwill already written off (never below zero) and the correction charge is taken, and only that figure is rounded to the cent, half up."
  factors:
  - id: window_end
    effect: method
    decides: window_end
    bindings: [out_of_spec_date, first_check_date, window_end]
    ladder:
    - when: "the order was opened on the customer's own request"
      method: "end the comeback window on the order's opening date"
    - when: "the order was opened on a network customer-pay repair"
      method: "end the comeback window on the date of the order's first alignment check"
    - when: "the order was opened on a glass replacement, or on any other customer-pay source"
      method: "end the comeback window on the date of the order's latest out-of-spec alignment check"
    baseline:
      window_end: "out_of_spec_date"
    evidence: [history, date]
    cross_difficulty: null
  - id: window_share
    effect: parameter
    decides: window_share
    bindings: [claim_delivered, comeback_days, window_share]
    ladder:
    - when: "the comeback window is no more than 30 days"
      value: "K('near_share')"
    - when: "the comeback window is more than 30 but no more than 90 days"
      value: "K('mid_share')"
    - when: "otherwise"
      value: "K('far_share')"
    baseline:
      window_share: "K('far_share')"
    evidence: [cross_category, date]
    cross_difficulty: claim
  - id: repair_class_weight
    effect: parameter
    decides: class_weight
    bindings: [claim_class, class_weight]
    ladder:
    - when: "the claim repair's class is a structural class"
      value: "K('structural_weight')"
    - when: "the claim repair is a Major Claim Repair"
      value: "K('major_weight')"
    - when: "otherwise"
      value: "K('standard_weight')"
    baseline:
      class_weight: "K('standard_weight')"
    evidence: [cross_category]
    cross_difficulty: claim
  - id: comeback_cap
    effect: parameter
    decides: credit_cap
    bindings: [goodwill_already, credit_cap]
    ladder:
    - when: "the repair was of a structural class and the comeback window is no more than 90 days"
      value: "twice the tier's goodwill credit authority"
    - when: "the repair was of a structural class and the window is more than 90 days, or the repair was of a non-structural class and the window is no more than 30 days"
      value: "one and a half times the tier's goodwill credit authority"
    - when: "otherwise"
      value: "the tier's goodwill credit authority"
    baseline:
      credit_cap: "P('goodwill_credit_authority_usd')"
    evidence: [history, cross_category]
    cross_difficulty: null
  - id: credit_base
    effect: method
    decides: credit_base
    bindings: [check_charge, first_check_result, first_check_corrected, n_corrections, credit_base]
    ladder:
    - when: "the order's first alignment check found the alignment out of spec and the correction was made at that visit"
      method: "figure the credit on the correction charge plus the alignment check charge"
    - when: "a later out-of-spec check was corrected at its visit"
      method: "figure the credit on the correction charge plus half the alignment check charge, the half rounded to the cent"
    - when: "otherwise"
      method: "figure the credit on the correction charge alone"
    baseline:
      credit_base: "correction_charge"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The comeback credit is the order's alignment correction charge times a window share of 0.20 and a repair-class
      weight of 0.60, never more than the tier's goodwill credit authority less the goodwill already written off on the
      order, and never more than the correction charge, rounded to the cent, half up. The comeback window is measured in
      calendar days from the claim repair's delivery date to the date of the order's latest out-of-spec alignment
      check.
    params: [goodwill_credit_authority_usd, far_share, standard_weight]
  inputs:
    history:
    - {table: adas_ledger, aggregate: sum, field: amount_usd, filters: {event_type: adas_charge, charge_type: alignment_correction}}
    - {table: adas_events, aggregate: latest, field: alignment_result, filters: {event_type: adas_alignment_check, check_number: 1}}
    cross_category: [claim]
- id: adas_ext_calibration_acceptance
  base_policy_refs: [adas_evt_settlement, adas_evt_payer_approval, adas_evt_charges]
  overwrite:
  - base_policy: adas_evt_payer_approval
    superseded_clause: a customer-pay order on the customer's acceptance of calibration_price_usd
    replaced_by: A customer-pay order rests on the customer's acceptance of the calibration quote, and the customer accepts it by paying the acceptance amount.
  - base_policy: adas_evt_charges
    superseded_clause: An in-house calibration posts a calibration charge of calibration_price_usd.
    replaced_by: An accepted customer-pay calibration completed in-house posts its calibration charge at the calibration quote the customer accepted.
  - base_policy: adas_evt_settlement
    superseded_clause: A customer pays a customer-pay order's balance (adas_msr_balance) on completion by one of the accepted_payment_methods
    replaced_by: Whatever an accepted order still owes is paid on completion by one of the tier's accepted payment methods.
  trigger: on_request
  subject: [adas_payment]
  computes: amount_usd
  target_tool: pay_calibration_acceptance_f9e8bcf7
  params:
    half_up_guard: 0.000001
    share_full: 1.0
    share_recent: 0.75
    share_standard: 0.5
    no_show_recent_days: 183
    no_show_window_days: 730
    returning_structural_rate: 0.90
    returning_rate: 0.95
    returning_recent_days: 730
    returning_late_days: 1460
    member_recent_rate: 0.96
    member_rate: 0.98
    member_recent_days: 365
    no_record_days: 99999
  rule: >-
    A customer-pay order rests on the customer's acceptance of the calibration quote, and the customer accepts it by
    paying the acceptance amount. An accepted customer-pay calibration completed in-house posts its calibration charge
    at the calibration quote the customer accepted. Whatever an accepted order still owes is paid on completion by one
    of the tier's accepted payment methods.
    The amount a customer pays to accept a calibration is fixed only after the order carries the goodwill write-off
    owed against its alignment correction charge.
    The acceptance amount is half the calibration quote plus the balance standing on the order (its charges less its
    write-offs, transfers and payments), rounded to the cent, half up. The calibration quote is the tier's calibration price.
    The share of the calibration quote collected at acceptance is the whole quote where the customer's most recent
    estimate booking that ended as a no-show closed no more than 183 days before the record date, three quarters
    (0.75) where it closed more than 183 but no more than 730 days before, and half otherwise.
    The record date the no-show is measured to follows how the order arose: for an order opened on the customer's
    own request it is the order's opening date; for an order opened on a network customer-pay repair it is that
    repair's opening date; for any other order it is the day of the acceptance.
    The returning-customer rate on the calibration price is 0.90 where the vehicle has a network insurance claim
    repair delivered no more than 730 days before the acceptance and that repair's class is a structural class (its
    name contains Structural); it is 0.95 where that repair was delivered no more than 730 days before and is of a
    non-structural class, or was delivered more than 730 but no more than 1460 days before; otherwise it is 1.
    The member rate on the calibration price is 0.96 where the vehicle holds an active network lifetime workmanship
    warranty (a Certified Structural Lifetime Warranty or a Collision Lifetime Workmanship Warranty) issued no more
    than 365 days before the acceptance, 0.98 where it holds such an active warranty issued earlier, and 1 where it
    holds none.
    The calibration quote is the tier's calibration price multiplied by the returning-customer rate and the member rate, each acting on that price, and rounded to the cent, half up; the share is taken of that quote, the balance standing
    on the order is added to it whether it is an amount owed or a credit, and that sum is rounded to the cent, half up.
    Days are calendar days counted from the earlier date to the later date, the earlier date not counted.
  prerequisite:
  - problem: adas_ext_alignment_comeback_credit
    kind: value_input
    gate: write_offs
    form: state
    policy_source: The amount a customer pays to accept a calibration is fixed only after the order carries the goodwill write-off owed against its alignment correction charge.
    condition: Where a comeback credit is owed on the order, its calibration money history carries the goodwill write-off against the alignment correction charge for that credit.
    resolved_by: post_comeback_goodwill_credit_c6e84f0b
    effect: Once the goodwill write-off stands, the write-offs read by this computation rise by the credit, lowering the balance standing on the order and so the acceptance amount by the same figure.
  cross_category:
  - category: claim
    as: branch
    reads: [delivered_date, variant_name]
    note: The returning-customer rate on the calibration price is decided from the vehicle's network insurance claim repair.
  - category: warranty
    as: branch
    reads: [issued_date, status, variant_name]
    note: The member rate is decided from an active lifetime workmanship warranty on the vehicle.
  - category: estimate
    as: branch
    reads: [status, closed_date]
    note: The acceptance share is decided from the customer's estimate booking that ended as a no-show.
  - category: retail
    as: branch
    reads: [opened_date]
    note: The record date for an order opened on a customer-pay repair is that repair's opening date.
  compute:
  - claim_delivered: "CFIELD('claim', 'delivered_date', vehicle_id=F('vehicle_id'))"
  - claim_class: "CFIELD('claim', 'variant_name', vehicle_id=F('vehicle_id')) or ''"
  - claim_days: "DAYS(claim_delivered, NOW) if claim_delivered else K('no_record_days')"
  - returning_rate: "K('returning_structural_rate') if (claim_days <= K('returning_recent_days') and 'Structural' in claim_class) else (K('returning_rate') if ((claim_days <= K('returning_recent_days') and not ('Structural' in claim_class)) or (claim_days > K('returning_recent_days') and claim_days <= K('returning_late_days'))) else 1.0)"
  - member_issued: "CFIELD('warranty', 'issued_date', vehicle_id=F('vehicle_id'), status='active', variant_name='Certified Structural Lifetime Warranty') or CFIELD('warranty', 'issued_date', vehicle_id=F('vehicle_id'), status='active', variant_name='Collision Lifetime Workmanship Warranty')"
  - member_days: "DAYS(member_issued, NOW) if member_issued else K('no_record_days')"
  - member_rate: "K('member_recent_rate') if (member_issued and member_days <= K('member_recent_days')) else (K('member_rate') if member_issued else 1.0)"
  - quote: "RND(P('calibration_price_usd') * returning_rate * member_rate + K('half_up_guard'), 2)"
  - record_date: "F('opened_date') if F('source_type') == 'customer_request' else (CFIELD('retail', 'opened_date', retail_repair_id=F('retail_repair_id')) if F('source_type') == 'customer_pay_repair' else NOW)"
  - no_show_closed: "CFIELD('estimate', 'closed_date', status='no_show')"
  - no_show_days: "DAYS(no_show_closed, record_date) if (no_show_closed and record_date) else K('no_record_days')"
  - prepay_share: "K('share_full') if no_show_days <= K('no_show_recent_days') else (K('share_recent') if no_show_days <= K('no_show_window_days') else K('share_standard'))"
  - charges: "SUM('adas_ledger', 'amount_usd', event_type='adas_charge')"
  - write_offs: "SUM('adas_ledger', 'amount_usd', event_type='adas_no_charge')"
  - transfers: "SUM('adas_ledger', 'amount_usd', event_type='adas_transfer_to_repair')"
  - payments_made: "SUM('adas_ledger', 'amount_usd', event_type='adas_payment')"
  - standing_balance: "charges - write_offs - transfers - payments_made"
  - result: "RND(prepay_share * quote + standing_balance + K('half_up_guard'), 2)"
  compute_basis:
    claim_delivered: "where the vehicle has a network insurance claim repair delivered no more than 730 days before the acceptance"
    claim_class: "that repair's class is a structural class (its name contains Structural)"
    claim_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    returning_rate: "The returning-customer rate on the calibration price is 0.90 where the vehicle has a network insurance claim repair delivered no more than 730 days before the acceptance and that repair's class is a structural class (its name contains Structural); it is 0.95 where that repair was delivered no more than 730 days before and is of a non-structural class, or was delivered more than 730 but no more than 1460 days before; otherwise it is 1."
    member_issued: "where the vehicle holds an active network lifetime workmanship warranty (a Certified Structural Lifetime Warranty or a Collision Lifetime Workmanship Warranty)"
    member_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    member_rate: "The member rate on the calibration price is 0.96 where the vehicle holds an active network lifetime workmanship warranty (a Certified Structural Lifetime Warranty or a Collision Lifetime Workmanship Warranty) issued no more than 365 days before the acceptance, 0.98 where it holds such an active warranty issued earlier, and 1 where it holds none."
    quote: "The calibration quote is the tier's calibration price multiplied by the returning-customer rate and the member rate, each acting on that price, and rounded to the cent, half up"
    record_date: "The record date the no-show is measured to follows how the order arose: for an order opened on the customer's own request it is the order's opening date; for an order opened on a network customer-pay repair it is that repair's opening date; for any other order it is the day of the acceptance."
    no_show_closed: "the customer's most recent estimate booking that ended as a no-show"
    no_show_days: "Days are calendar days counted from the earlier date to the later date, the earlier date not counted."
    prepay_share: "The share of the calibration quote collected at acceptance is the whole quote where the customer's most recent estimate booking that ended as a no-show closed no more than 183 days before the record date, three quarters (0.75) where it closed more than 183 but no more than 730 days before, and half otherwise."
    charges: "the balance standing on the order (its charges less its write-offs, transfers and payments)"
    write_offs: "the balance standing on the order (its charges less its write-offs, transfers and payments)"
    transfers: "the balance standing on the order (its charges less its write-offs, transfers and payments)"
    payments_made: "the balance standing on the order (its charges less its write-offs, transfers and payments)"
    standing_balance: "the balance standing on the order is added to it whether it is an amount owed or a credit"
    result: "the share is taken of that quote, the balance standing on the order is added to it whether it is an amount owed or a credit, and that sum is rounded to the cent, half up."
  factors:
  - id: acceptance_share
    effect: parameter
    decides: prepay_share
    bindings: [no_show_closed, no_show_days, prepay_share]
    ladder:
    - when: "the customer's most recent estimate booking that ended as a no-show closed no more than 183 days before the record date"
      value: "K('share_full')"
    - when: "it closed more than 183 but no more than 730 days before the record date"
      value: "K('share_recent')"
    - when: "otherwise"
      value: "K('share_standard')"
    baseline:
      prepay_share: "K('share_standard')"
    evidence: [cross_category, date]
    cross_difficulty: estimate
  - id: record_date
    effect: method
    decides: record_date
    bindings: [record_date]
    ladder:
    - when: "the order was opened on the customer's own request"
      method: "measure the no-show to the order's opening date"
    - when: "the order was opened on a network customer-pay repair"
      method: "measure the no-show to that repair's opening date"
    - when: "otherwise"
      method: "measure the no-show to the day of the acceptance"
    baseline:
      record_date: "NOW"
    evidence: [cross_category, date]
    cross_difficulty: null
  - id: calibration_returning_rate
    effect: parameter
    decides: returning_rate
    bindings: [claim_delivered, claim_class, claim_days, returning_rate]
    ladder:
    - when: "a network insurance claim repair on the vehicle delivered no more than 730 days before the acceptance and of a structural class"
      value: "K('returning_structural_rate')"
    - when: "such a repair delivered no more than 730 days before and of a non-structural class, or delivered more than 730 but no more than 1460 days before"
      value: "K('returning_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      returning_rate: "1.0"
    evidence: [cross_category, date]
    cross_difficulty: claim
  - id: calibration_member_rate
    effect: parameter
    decides: member_rate
    bindings: [member_issued, member_days, member_rate]
    ladder:
    - when: "an active network lifetime workmanship warranty on the vehicle issued no more than 365 days before the acceptance"
      value: "K('member_recent_rate')"
    - when: "such an active warranty issued earlier"
      value: "K('member_rate')"
    - when: "no such active warranty"
      value: "1"
    baseline:
      member_rate: "1.0"
    evidence: [cross_category, date]
    cross_difficulty: warranty
  baseline:
    rule: >-
      The acceptance amount is half the calibration quote plus the balance standing on the order (its charges less its
      write-offs, transfers and payments), rounded to the cent, half up. The calibration quote is the tier's calibration price.
    params: [calibration_price_usd, share_standard]
  inputs:
    history:
    - {table: adas_ledger, aggregate: sum, field: amount_usd, filters: {event_type: adas_charge}}
    - {table: adas_ledger, aggregate: sum, field: amount_usd, filters: {event_type: adas_no_charge}}
    - {table: adas_ledger, aggregate: sum, field: amount_usd, filters: {event_type: adas_payment}}
    cross_category: [claim, warranty, estimate, retail]
