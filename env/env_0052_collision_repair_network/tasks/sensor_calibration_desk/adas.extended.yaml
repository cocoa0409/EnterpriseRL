  rule: A customer pays a customer-pay order's balance (adas_msr_balance) on completion by one of the accepted_payment_methods;
    a glass program pays its order under its own remittance reference. A fleet account's calibration charge is reduced
    by a fleet_discount write-off of fleet_discount_pct percent, rounded to the cent. Write-offs name the charge
