        declination_allowed: =declination_allowed
      Dual-Mode Camera Calibration:
        declination_allowed: =declination_allowed
      Blind Spot Radar Calibration:
        declination_allowed: =declination_allowed
      Front Radar Calibration:
        declination_allowed: =declination_allowed
