- id: adas_evt_attempts
  subject:
  - adas_attempt
  - adas_retry
  - adas_sublet
  rule: 'Each attempt runs one procedure from the tier''s procedures: a static attempt in a calibration bay (static_bay_required,
    targets_required_count targets, bay_time_minutes reserved) and a dynamic attempt on the road at dynamic_min_speed_mph
    or more, failing when not completed within dynamic_drive_max_minutes minutes; where dynamic_weather_restricted
    is true no dynamic attempt is made in rain, snow or fog. The order is in in_calibration status. A failed attempt
    returns the order for a retry while the attempts used (adas_msr_attempts_used) are below max_attempts_in_house,
    repeating the alignment check first where retry_requires_new_precheck is true. Once the in-house attempts are
    exhausted, the order is sublet to a franchised dealer where dealer_sublet_allowed is true, with the dealer given
    sublet_turnaround_business_days business days and transport at no charge where sublet_transport_included is
    true. Weather that prevents a dynamic attempt is not a failed attempt.'
  eligibility:
  - id: order_in_calibration
    applies_to:
    - adas_attempt
    kind: state
    condition: The order is in in_calibration status.
    evidence_fields:
    - adas_orders.status
    - adas_orders.adas_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - adas_orders.adas_order_id
      action_bindings:
        adas_orders.adas_order_id: adas_order_id
    state_contract:
      field: adas_orders.status
      allowed:
      - in_calibration
  params:
    per_tier:
      Dynamic Camera Calibration:
        procedures: =procedures
        static_bay_required: =static_bay_required
        targets_required_count: =targets_required_count
        bay_time_minutes: =bay_time_minutes
        dynamic_min_speed_mph: =dynamic_min_speed_mph
        dynamic_drive_max_minutes: =dynamic_drive_max_minutes
        dynamic_weather_restricted: =dynamic_weather_restricted
        max_attempts_in_house: =max_attempts_in_house
        retry_requires_new_precheck: =retry_requires_new_precheck
        dealer_sublet_allowed: =dealer_sublet_allowed
        sublet_turnaround_business_days: =sublet_turnaround_business_days
        sublet_transport_included: =sublet_transport_included
        technician_certification_level: =technician_certification_level
      Static Camera Calibration:
