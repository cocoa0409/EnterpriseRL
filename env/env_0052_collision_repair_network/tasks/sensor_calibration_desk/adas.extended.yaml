      Front Radar Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
      Multi-System Calibration:
        calibration_price_usd: =calibration_price_usd
        dealer_sublet_handling_pct: =dealer_sublet_handling_pct
        customer_pay_sublet_capped: =customer_pay_sublet_capped
        standalone_diagnostic_fee_usd: =standalone_diagnostic_fee_usd
        warranty_rework_billing: =warranty_rework_billing
  formula:
    when: charge_type == 'dealer_sublet'
    amount_usd: round(dealer_invoice_usd * (1 + dealer_sublet_handling_pct / 100), 2)
- id: adas_evt_settlement
