# Product and event policy charter: ADAS Sensor Calibrations (adas).
category: adas
display_name: ADAS Sensor Calibrations
binding:
  holding_table: adas_orders
  event_tables:
  - adas_events
  - adas_ledger
  intake_tables:
  - adas_declinations
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - opened
  - prechecked
  - in_calibration
  - sublet
  - completed
  - declined
  - cancelled
  transitions:
  - from: opened
    to: prechecked
    by: system
    means: Every pre-calibration requirement of the manufacturer procedure is verified on the vehicle.
  - from: prechecked
    to: in_calibration
    by: system
    means: A calibration attempt starts.
  - from: in_calibration
    to: prechecked
    by: system
    means: An attempt failed and another in-house attempt is allowed.
  - from: in_calibration
    to: completed
    by: system
    means: Every procedure of the order passed and the post-calibration scan is clean.
  - from: in_calibration
    to: sublet
    by: agent
    means: In-house attempts are exhausted and the vehicle goes to a franchised dealer for the calibration.
  - from: sublet
    to: completed
    by: system
    means: The dealer completed the calibration and its report and invoice are received.
  - from: opened
    to: declined
    by: user
    means: The customer signs a declination of the calibration before it is attempted.
  - from: prechecked
    to: declined
    by: user
    means: The customer signs a declination of the calibration after prechecks.
  - from: opened
    to: cancelled
    by: agent
    means: 'The calibration is no longer needed: its source repair was withdrawn or declared a total loss, or a
      diagnosis found no calibration need.'
  - from: prechecked
    to: cancelled
    by: agent
    means: The calibration is no longer needed after prechecks for the same reasons.
accounts:
- key: calibration_charges
  unit: USD
  meaning: Amount owed to the network for calibration work on an order, whoever pays it. Charges post in; transfers
    onto an insurance claim repair order, payments and no-charge write-offs post out.
parameter_schema:
  calibration_price_usd: Price of the calibration performed in-house (USD).
  procedures: Manufacturer procedures the order must pass, each a separate attempt (list of static and/or dynamic).
  bay_time_minutes: Calibration bay time reserved for one static attempt (minutes; 0 = no static procedure).
  dynamic_drive_max_minutes: Longest drive allowed for a dynamic procedure to complete before the attempt counts
    as failed (minutes; 0 = no dynamic procedure).
  dynamic_min_speed_mph: Minimum steady speed for the dynamic procedure (mph; 0 = no dynamic procedure).
  dynamic_weather_restricted: Whether a dynamic procedure is not attempted in rain, snow or fog (boolean).
  static_bay_required: Whether a level calibration bay with targets is required (boolean).
  targets_required_count: Target boards or reflectors set up for the static procedure (integer).
  mobile_calibration_available: Whether the calibration can be done by a mobile technician at the customer's location
    (boolean).
  scheduling_lead_business_days: Business days of notice needed to schedule the calibration (integer).
  max_attempts_in_house: Most in-house attempts before the order is sublet (integer).
  dealer_sublet_allowed: Whether an order whose in-house attempts are exhausted may be sublet to a franchised dealer
    (boolean).
  dealer_sublet_handling_pct: Handling added to the dealer invoice when a sublet is billed to an insurer (percent).
  sublet_turnaround_business_days: Business days the dealer is given to complete a sublet (integer).
  sublet_transport_included: Whether the network transports the vehicle to and from the dealer at no charge (boolean).
  alignment_required: Whether a four-wheel alignment check within specification is required before the calibration
    (boolean).
  alignment_check_validity_days: Calendar days an in-spec alignment check remains valid for a precheck (integer).
  alignment_check_fee_usd: Alignment check charge on a customer-pay order (USD).
  alignment_correction_fee_usd: Four-wheel alignment correction charge on a customer-pay order when the check is
    out of specification (USD).
  fuel_level_min_pct: Minimum fuel (or charge) level for the procedure (percent of tank).
  tire_pressure_check_required: Whether tires are set to placard pressure before the procedure (boolean).
  cargo_removed_required: Whether the vehicle must be empty of cargo (boolean).
  dtc_clear_required: Whether every diagnostic trouble code must be resolved before the precheck passes (boolean).
  pre_scan_required: Whether a pre-calibration diagnostic scan is run (boolean).
  post_scan_required: Whether a post-calibration scan must be clean before completion (boolean).
  post_calibration_road_test_miles: Verification road test after the calibration (miles).
  calibration_report_delivery_hours: Hours after completion within which the calibration report is sent to the payer
    and customer (integer).
  glass_program_billable: Whether the calibration may be billed to an insurer's glass program when it follows a
    glass claim replacement (boolean).
  claim_approval_required: Whether a calibration on an insurance claim repair needs the insurer's approval of the
    calibration on that repair order before it is attempted (boolean).
  declination_allowed: Whether the customer may decline the calibration and take the vehicle uncalibrated (boolean).
  standalone_diagnostic_fee_usd: Diagnostic charge on a customer-requested order when the diagnosis finds no calibration
    is needed (USD).
  fleet_discount_pct: Discount on customer-pay calibration for fleet accounts (percent).
  accepted_payment_methods: Payment methods accepted from the customer (list).
  goodwill_credit_authority_usd: Most the desk may write off as goodwill on one order (USD).
  warranty_plan_issued: Official name of the warranty issued on completion.
  max_open_orders_per_source: Calibration orders one source repair, glass job or warranty rework may have open at
    once (integer).
  oem_procedure_documentation_required: Whether the manufacturer's procedure document is attached to the order before
    the precheck (boolean).
  technician_certification_level: 'Minimum technician certification for the tier: adas_level_1 or adas_level_2.'
  sensor_mount_inspection_required: Whether the sensor bracket and mounting are inspected for damage before the
    precheck passes (boolean).
  retry_requires_new_precheck: Whether a retry after a failed attempt repeats the alignment check (boolean).
  customer_wait_allowed: Whether the customer may wait at the center during the calibration (boolean).
  certificate_issued: Whether a calibration certificate with before and after values is issued on completion (boolean).
  surround_view_included: Whether surround-view cameras are calibrated within the order (boolean).
  radar_included: Whether a radar sensor is calibrated within the order (boolean).
  camera_included: Whether the forward camera is calibrated within the order (boolean).
  warranty_rework_billing: 'How a calibration ordered for warranty rework is billed: no_charge (absorbed by the
    network).'
  customer_pay_sublet_capped: Whether a customer-pay order sublet to a dealer is charged no more than calibration_price_usd
    (boolean).
  report_retention_years: Years the calibration report is kept on file for the payer and customer (integer).
