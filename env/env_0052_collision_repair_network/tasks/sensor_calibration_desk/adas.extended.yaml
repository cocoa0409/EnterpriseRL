    A sublet posts a dealer_sublet charge instead: on an insurance claim repair or a glass program order it is the
    dealer invoice plus dealer_sublet_handling_pct percent, rounded to the cent; on a customer-pay order where customer_pay_sublet_capped
    is true the charge is the dealer invoice plus handling, and the part above calibration_price_usd is written
    off as sublet_cap. Alignment charges follow adas_evt_precheck, and a customer-requested order cancelled because
    the diagnosis found no calibration need posts a diagnostic charge of standalone_diagnostic_fee_usd. A warranty
    rework order posts no charge at all. Every charge of an insurance claim repair order is transferred on the same
    day onto that repair order, naming the supplement that approved the calibration (0 when it was on the original
    estimate); the insurer pays it through the repair order, never here.'
