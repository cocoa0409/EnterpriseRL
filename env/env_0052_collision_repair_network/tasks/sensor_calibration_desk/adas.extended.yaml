  rule: A customer may decline a calibration in writing only where declination_allowed is true; on Front Radar Calibration
    and Multi-System Calibration orders the network does not release a vehicle with an uncalibrated radar, and the
    only alternative to the in-house calibration is the dealer sublet. The customer's declination of the order is
    signed. A declination is recorded before an attempt starts, is never charged, and lets the source repair or
    glass job complete without the calibration; the declined systems are excluded from every workmanship warranty
    issued on the source work.
