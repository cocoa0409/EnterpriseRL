- id: adas_evt_completion
  subject:
  - adas_complete
  rule: An order completes in-house when every procedure in the tier's procedures has a passed attempt, the post-calibration
    scan is clean where post_scan_required is true and the verification road test of post_calibration_road_test_miles
    miles is done; a sublet order completes when the dealer's report and invoice are received. Every procedure of
    the tier has a passed attempt on the order, or the dealer's report is received for a sublet. The calibration
    report goes to the payer and the customer within calibration_report_delivery_hours hours and is kept report_retention_years
    years, a certificate is issued where certificate_issued is true, and the warranty plan named by warranty_plan_issued
    is issued.
  eligibility:
  - id: all_procedures_passed
    applies_to:
    - adas_complete
    kind: authorization
    condition: Every procedure of the tier has a passed attempt on the order, or the dealer's report is received
      for a sublet.
    evidence_fields:
    - adas_events.adas_order_id
    - adas_events.procedure
    - adas_events.attempt_result
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - adas_events.adas_order_id
      action_bindings:
        adas_events.adas_order_id: adas_order_id
  params:
    per_tier:
      Dynamic Camera Calibration:
        post_scan_required: =post_scan_required
        post_calibration_road_test_miles: =post_calibration_road_test_miles
        calibration_report_delivery_hours: =calibration_report_delivery_hours
