events:
- type: adas_order_open
  target: adas_orders
  mutation: create
  meaning: A calibration order is opened for a vehicle after a glass replacement, a repair that disturbs sensors,
    a warranty rework or a customer request.
  grain: One row per calibration order.
  fields:
    adas_order_id: Order reference.
    customer_id: Vehicle owner.
    vehicle_id: Vehicle.
    variant_name: Calibration tier.
    source_type: glass_replacement, collision_repair, customer_pay_repair, warranty_rework or customer_request.
    glass_job_id: Source glass job, when glass_replacement.
    claim_repair_id: Source insurance claim repair order, when collision_repair.
    retail_repair_id: Source customer-pay repair order, when customer_pay_repair.
    warranty_event_id: Source warranty rework authorization, when warranty_rework.
    payer_type: Who pays.
    systems_to_calibrate: Systems on the order.
    oem_procedure: Procedure the manufacturer specifies for the camera.
    included_in_original_estimate: Whether the calibration was on the insurer-authorized original estimate.
    opened_date: Opening date.
  triggers: []
- type: adas_alignment_check
  target: adas_events
  meaning: A four-wheel alignment check is performed for the order.
  grain: One row per alignment check on one order.
  distinguish_by:
  - check_number
  fields:
    event_date: Date of the check.
    check_number: Ordinal of the check on the order.
    alignment_result: in_spec or out_of_spec.
    alignment_corrected: Whether an out-of-spec alignment was corrected in the same visit.
  triggers: []
- type: adas_precheck
  target: adas_orders
  mutation:
    transition:
      from: opened
      to: prechecked
  meaning: The manufacturer's pre-calibration requirements are verified.
  grain: One transition per order.
  fields:
    status: Becomes prechecked.
    precheck_date: Date of the precheck.
  triggers: []
- type: adas_start
  target: adas_orders
  mutation:
    transition:
      from: prechecked
      to: in_calibration
  meaning: A calibration attempt begins.
  grain: One transition per attempt.
  fields:
    status: Becomes in_calibration.
  triggers: []
- type: adas_attempt
  target: adas_events
  meaning: The result of one calibration procedure attempt is recorded.
  grain: One row per procedure attempt on one order.
  distinguish_by:
  - attempt_number
  - procedure
  fields:
    event_date: Attempt date.
    attempt_number: Ordinal of the attempt on the order.
    procedure: static or dynamic.
    attempt_result: passed or failed.
    failure_code: Why it failed; none when passed.
  triggers: []
- type: adas_retry
  target: adas_orders
  mutation:
    transition:
      from: in_calibration
      to: prechecked
  meaning: A failed attempt returns the order for another in-house attempt.
  grain: One transition per failed attempt retried.
  fields:
    status: Becomes prechecked.
  triggers: []
- type: adas_sublet
  target: adas_orders
  mutation:
    transition:
      from: in_calibration
      to: sublet
  meaning: The order is sent to a franchised dealer.
  grain: One transition per order.
  fields:
    status: Becomes sublet.
    sublet_date: Date the vehicle went to the dealer.
    sublet_dealer: Dealer name.
  triggers: []
- type: adas_complete
  target: adas_orders
  mutation:
    transition:
    - from: in_calibration
      to: completed
    - from: sublet
      to: completed
  meaning: The calibration is complete and verified.
  grain: One transition per order.
  fields:
    status: Becomes completed.
    completed_date: Completion date.
    dealer_invoice_usd: Dealer invoice amount for a sublet; 0.00 for in-house.
  triggers:
  - event: warranty:warranty_issue
    map:
      adas_order_id: adas_order_id
      customer_id: customer_id
      vehicle_id: vehicle_id
      issued_date: completed_date
- type: adas_decline
  target: adas_orders
  mutation:
    transition:
    - from: opened
      to: declined
    - from: prechecked
      to: declined
  meaning: The customer declines the calibration in writing.
  grain: One transition per order.
  fields:
    status: Becomes declined.
    closed_date: Date of the declination.
  triggers: []
- type: adas_cancel
  target: adas_orders
  mutation:
    transition:
    - from: opened
      to: cancelled
    - from: prechecked
      to: cancelled
  meaning: The order is cancelled as no longer needed.
  grain: One transition per order.
  fields:
    status: Becomes cancelled.
    closed_date: Cancellation date.
    cancel_reason: source_withdrawn, source_total_loss or no_calibration_needed.
  triggers: []
- type: adas_charge
  target: adas_ledger
  meaning: An amount owed for calibration work is booked on the order.
  grain: One row per charge type per order.
  distinguish_by:
  - charge_type
  fields:
    entry_date: Charge date.
    charge_type: calibration, dealer_sublet, alignment_check, alignment_correction or diagnostic.
    amount_usd: Charge (positive).
  account: calibration_charges
  direction: in
  triggers: []
- type: adas_transfer_to_repair
  target: adas_ledger
  meaning: A calibration charge on an insurance claim repair is moved onto that repair order, to be paid by the
    insurer through the repair.
  grain: One row per charge transferred.
  distinguish_by:
  - source_entry_id
  fields:
    entry_date: Transfer date.
    source_entry_id: The adas_charge row transferred.
    claim_repair_id: Repair order it is billed through.
    supplement_number: Supplement on that repair order that approved the calibration; 0 when it was on the original
      estimate.
    amount_usd: Amount transferred (positive).
  account: calibration_charges
  direction: out
  triggers: []
- type: adas_payment
  target: adas_ledger
  meaning: The customer or an insurer's glass program pays toward the order.
  grain: One row per payment.
  distinguish_by:
  - entry_date
  - payer_kind
  - amount_usd
  fields:
    entry_date: Payment date.
    payer_kind: customer or insurer_glass_program.
    payment_method: card, cash, check or remittance.
    payment_reference: Glass program remittance reference, verbatim; empty for a customer payment.
    amount_usd: Amount paid (positive).
  account: calibration_charges
  direction: out
  triggers: []
- type: adas_no_charge
  target: adas_ledger
  meaning: All or part of a charge is written off by the network.
  grain: One row per reason per charge.
  distinguish_by:
  - source_entry_id
  - no_charge_reason
  fields:
    entry_date: Write-off date.
    source_entry_id: The adas_charge row written off.
    no_charge_reason: fleet_discount, sublet_cap, billing_error or goodwill.
    amount_usd: Amount written off (positive).
  account: calibration_charges
  direction: out
  triggers: []
measures:
- id: adas_msr_attempts_used
  window: Life of the order.
  measure: Count of distinct attempt_number values among the order's adas_attempt rows.
- id: adas_msr_latest_alignment
  window: Life of the order.
  measure: alignment_result and event_date of the order's adas_alignment_check row with the highest check_number.
- id: adas_msr_balance
  window: Life of the order.
  measure: Sum of calibration_charges in-entries minus out-entries.
- id: adas_msr_goodwill_written_off
  window: Life of the order.
  measure: Sum of amount_usd of adas_no_charge rows with no_charge_reason goodwill.
policies:
- id: adas_agg_multi_holding
  subject:
  - adas_order_open
  rule: A customer may hold any number of calibration orders across vehicles and sources; there is no customer-level
    cap. Per source, adas_agg_one_open_per_source applies.
  eligibility: []
  params:
    max_per_customer: null
- id: adas_agg_one_open_per_source
  subject:
  - adas_order_open
  rule: One glass job, insurance claim repair, customer-pay repair or warranty rework may have at most max_open_orders_per_source
    open calibration order, where open means opened, prechecked, in_calibration or sublet. The source has no other
    open calibration order. When the source needs more than one system calibrated, a single Multi-System Calibration
    order covers them all; when a further system is found after an order opened, the open order is cancelled and
    one Multi-System Calibration order replaces it.
  eligibility:
  - id: no_open_order_for_source
    applies_to:
    - adas_order_open
    kind: dedup
    condition: The source has no other open calibration order.
    evidence_fields:
    - adas_orders.glass_job_id
    - adas_orders.claim_repair_id
    - adas_orders.retail_repair_id
    - adas_orders.warranty_event_id
    - adas_orders.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - adas_orders.glass_job_id
      - - adas_orders.claim_repair_id
      - - adas_orders.retail_repair_id
      - - adas_orders.warranty_event_id
      action_bindings:
        adas_orders.glass_job_id: glass_job_id
        adas_orders.claim_repair_id: claim_repair_id
        adas_orders.retail_repair_id: retail_repair_id
        adas_orders.warranty_event_id: warranty_event_id
    dedup_contract:
      table: adas_orders
      mode: separate_record
      object_bindings:
        claim_repair_id: claim_repair_id
        glass_job_id: glass_job_id
        retail_repair_id: retail_repair_id
        warranty_event_id: warranty_event_id
      duplicate_filters:
        status:
        - opened
        - prechecked
        - in_calibration
        - sublet
      distinct_fields:
      - adas_order_id
  params:
    per_tier:
      Dynamic Camera Calibration:
        max_open_orders_per_source: =max_open_orders_per_source
      Static Camera Calibration:
        max_open_orders_per_source: =max_open_orders_per_source
      Dual-Mode Camera Calibration:
        max_open_orders_per_source: =max_open_orders_per_source
      Blind Spot Radar Calibration:
        max_open_orders_per_source: =max_open_orders_per_source
      Front Radar Calibration:
        max_open_orders_per_source: =max_open_orders_per_source
      Multi-System Calibration:
        max_open_orders_per_source: =max_open_orders_per_source
- id: adas_tier_and_payer
  subject:
  - adas_order_open
  rule: 'The tier follows the systems to calibrate: a forward camera alone takes Dynamic, Static or Dual-Mode Camera
    Calibration according to the manufacturer procedure recorded on the order (dynamic, static or static_and_dynamic);
    a blind spot radar alone takes Blind Spot Radar Calibration; a front radar alone takes Front Radar Calibration;
    two or more systems take Multi-System Calibration. Each system on the order must be fitted to the vehicle according
    to vehicles.adas_package. The payer follows the source: a glass replacement paid under an insurer''s glass program
    is billed to that program where glass_program_billable is true (and to the customer otherwise); a collision
    repair on an insurance claim is paid through that repair order (insurer_via_repair); a customer-pay repair or
    a customer request is paid by the customer (a fleet account receiving fleet_discount_pct); a warranty rework
    is billed per warranty_rework_billing. The tier fixes which sensors are included (camera_included, radar_included,
    surround_view_included).'
  eligibility: []
  params:
    per_tier:
      Dynamic Camera Calibration:
        glass_program_billable: =glass_program_billable
        fleet_discount_pct: =fleet_discount_pct
        warranty_rework_billing: =warranty_rework_billing
        camera_included: =camera_included
        radar_included: =radar_included
        surround_view_included: =surround_view_included
        procedures: =procedures
      Static Camera Calibration:
        glass_program_billable: =glass_program_billable
        fleet_discount_pct: =fleet_discount_pct
        warranty_rework_billing: =warranty_rework_billing
        camera_included: =camera_included
        radar_included: =radar_included
        surround_view_included: =surround_view_included
        procedures: =procedures
      Dual-Mode Camera Calibration:
        glass_program_billable: =glass_program_billable
        fleet_discount_pct: =fleet_discount_pct
        warranty_rework_billing: =warranty_rework_billing
        camera_included: =camera_included
        radar_included: =radar_included
        surround_view_included: =surround_view_included
        procedures: =procedures
      Blind Spot Radar Calibration:
        glass_program_billable: =glass_program_billable
        fleet_discount_pct: =fleet_discount_pct
        warranty_rework_billing: =warranty_rework_billing
        camera_included: =camera_included
        radar_included: =radar_included
        surround_view_included: =surround_view_included
        procedures: =procedures
      Front Radar Calibration:
        glass_program_billable: =glass_program_billable
        fleet_discount_pct: =fleet_discount_pct
        warranty_rework_billing: =warranty_rework_billing
        camera_included: =camera_included
        radar_included: =radar_included
        surround_view_included: =surround_view_included
        procedures: =procedures
      Multi-System Calibration:
        glass_program_billable: =glass_program_billable
        fleet_discount_pct: =fleet_discount_pct
        warranty_rework_billing: =warranty_rework_billing
        camera_included: =camera_included
        radar_included: =radar_included
        surround_view_included: =surround_view_included
        procedures: =procedures
- id: adas_evt_precheck
  subject:
  - adas_precheck
  - adas_alignment_check
  rule: 'The precheck verifies the manufacturer''s preconditions before any attempt: the procedure document is on
    file where oem_procedure_documentation_required is true, the pre-calibration scan is run where pre_scan_required
    is true, every diagnostic trouble code is resolved where dtc_clear_required is true, the sensor mount is inspected
    where sensor_mount_inspection_required is true, tires are at placard pressure where tire_pressure_check_required
    is true, fuel is at least fuel_level_min_pct percent, and cargo is removed where cargo_removed_required is true.
    Where alignment_required is true, the most recent alignment check on the order is in_spec and was made no more
    than the tier''s alignment check validity days before the precheck. Days are calendar days counted back from
    the precheck date, and a check made exactly that many days earlier is still valid. An out_of_spec check must
    be corrected and checked again; on a customer-pay order the check posts an alignment_check charge and a correction
    an alignment_correction charge, while on an insurance claim repair the alignment is part of the repair order.
    For an order opened after a glass replacement, the windshield''s safe drive-away time has passed before the
    precheck.'
  eligibility:
  - id: alignment_in_spec_recent
    applies_to:
    - adas_precheck
    kind: time
    condition: Where alignment_required is true, the most recent alignment check on the order is in_spec and was
      made no more than the tier's alignment check validity days before the precheck.
    evidence_fields:
    - adas_events.adas_order_id
    - adas_events.event_type
    - adas_events.alignment_result
    - adas_events.event_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - adas_events.adas_order_id
      action_bindings:
        adas_events.adas_order_id: adas_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the most recent alignment check on the order
      anchor_source: adas_events.event_date
      relation: not_after
      duration_source: variants.alignment_check_validity_days
      unit: calendar_days
      counting_rule: Days are calendar days counted back from the precheck date, and a check made exactly that many
        days earlier is still valid.
      boundary: inclusive
  params:
    per_tier:
      Dynamic Camera Calibration:
        oem_procedure_documentation_required: =oem_procedure_documentation_required
        pre_scan_required: =pre_scan_required
        dtc_clear_required: =dtc_clear_required
        sensor_mount_inspection_required: =sensor_mount_inspection_required
        tire_pressure_check_required: =tire_pressure_check_required
        fuel_level_min_pct: =fuel_level_min_pct
        cargo_removed_required: =cargo_removed_required
        alignment_required: =alignment_required
        alignment_check_validity_days: =alignment_check_validity_days
        alignment_check_fee_usd: =alignment_check_fee_usd
        alignment_correction_fee_usd: =alignment_correction_fee_usd
      Static Camera Calibration:
        oem_procedure_documentation_required: =oem_procedure_documentation_required
        pre_scan_required: =pre_scan_required
        dtc_clear_required: =dtc_clear_required
        sensor_mount_inspection_required: =sensor_mount_inspection_required
        tire_pressure_check_required: =tire_pressure_check_required
        fuel_level_min_pct: =fuel_level_min_pct
        cargo_removed_required: =cargo_removed_required
        alignment_required: =alignment_required
        alignment_check_validity_days: =alignment_check_validity_days
        alignment_check_fee_usd: =alignment_check_fee_usd
        alignment_correction_fee_usd: =alignment_correction_fee_usd
      Dual-Mode Camera Calibration:
        oem_procedure_documentation_required: =oem_procedure_documentation_required
        pre_scan_required: =pre_scan_required
        dtc_clear_required: =dtc_clear_required
        sensor_mount_inspection_required: =sensor_mount_inspection_required
        tire_pressure_check_required: =tire_pressure_check_required
        fuel_level_min_pct: =fuel_level_min_pct
        cargo_removed_required: =cargo_removed_required
        alignment_required: =alignment_required
