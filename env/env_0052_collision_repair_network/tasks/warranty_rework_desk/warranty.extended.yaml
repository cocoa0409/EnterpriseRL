events:
- type: warranty_issue
  target: warranty_coverages
  mutation: create
  meaning: A workmanship warranty is issued on delivered or completed network work.
  grain: One row per coverage.
  fields:
    warranty_coverage_id: Coverage reference.
    customer_id: Owner on file at issue.
    vehicle_id: Vehicle.
    variant_name: Plan issued.
    claim_repair_id: Source insurance claim repair order.
    retail_repair_id: Source customer-pay repair order.
    glass_job_id: Source glass job.
    adas_order_id: Source calibration order.
    issued_date: Delivery or completion date of the source work.
    odometer_at_issue: Odometer at issue.
    customer_supplied_parts_present: Whether the source work installed customer-supplied parts.
    declined_calibration_present: Whether a calibration on the source work was declined.
  triggers: []
- type: warranty_redeem
  target: warranty_coverages
  mutation:
    transition:
      from: active
      to: redeemed
  meaning: A Chip Repair Guarantee credit is used.
  grain: One transition per coverage.
  fields:
    status: Becomes redeemed.
    closed_date: Date the credit was used.
  triggers: []
- type: warranty_expire
  target: warranty_coverages
  mutation:
    transition:
      from: active
      to: expired
  meaning: A fixed-term plan ends.
  grain: One transition per coverage.
  fields:
    status: Becomes expired.
    closed_date: Day after the last covered day.
  triggers: []
- type: warranty_void
  target: warranty_coverages
  mutation:
    transition:
      from: active
      to: voided
  meaning: Coverage is voided by a disqualifying event.
  grain: One transition per coverage.
  fields:
    status: Becomes voided.
    closed_date: Date recorded.
    void_reason: altered_by_others or later_total_loss.
  triggers: []
- type: warranty_end_by_sale
  target: warranty_coverages
  mutation:
    transition:
      from: active
      to: ended_by_sale
  meaning: Coverage ends because the owner on file no longer owns the vehicle.
  grain: One transition per coverage.
  fields:
    status: Becomes ended_by_sale.
    closed_date: The vehicle's owned_through date.
  triggers: []
- type: warranty_concern_report
  target: warranty_events
  meaning: The customer reports a concern with warrantied work.
  grain: One row per concern on one coverage.
  distinguish_by:
  - concern_number
  fields:
    event_date: Report date.
    concern_number: Ordinal of the concern on the coverage.
    concern_type: Kind of concern.
    discovered_date: Date the customer says they first noticed it.
    odometer_reported: Odometer at report.
  triggers: []
- type: warranty_inspection
  target: warranty_events
  meaning: A network inspection determines whether a reported concern is covered.
  grain: One row per inspected concern.
  distinguish_by:
  - concern_number
  fields:
    event_date: Inspection date.
    concern_number: Concern inspected.
    determination: covered or not_covered.
    exclusion_code: Exclusion applied; none when covered.
    location_code: Center that inspected.
  triggers: []
- type: warranty_rework_authorize
  target: warranty_events
  meaning: 'A remedy for a covered concern is authorized: rework at a network center, an outside-shop repair, or
    a chip repair credit.'
  grain: One row per remedy attempt on one concern.
  distinguish_by:
  - concern_number
  - rework_attempt
  fields:
    event_date: Authorization date.
    concern_number: Concern remedied.
    rework_attempt: Ordinal of the remedy attempt on the concern.
    rework_kind: network_rework, outside_shop or chip_credit.
    location_code: Center doing the rework; empty otherwise.
    courtesy_rental_days: Courtesy rental days authorized.
    calibration_needed: Whether the rework disturbs sensors that must be recalibrated.
  triggers:
  - event: adas:adas_order_open
    when:
      calibration_needed: true
    map:
      warranty_event_id: warranty_event_id
      customer_id: customer_id
      source_type: warranty_rework
      payer_type: network_absorbed
      opened_date: event_date
- type: warranty_rework_complete
  target: warranty_events
  meaning: A network rework or outside-shop repair is finished.
  grain: One row per remedy attempt completed.
  distinguish_by:
  - concern_number
  - rework_attempt
  fields:
    event_date: Completion date.
    concern_number: Concern remedied.
    rework_attempt: Attempt completed.
    rework_result: resolved or not_resolved.
  triggers: []
- type: warranty_charge
  target: warranty_ledger
  meaning: A diagnostic charge is booked for an inspection that found a fee-bearing concern not covered.
  grain: One row per charged concern.
  distinguish_by:
  - concern_number
  fields:
    entry_date: Charge date.
    concern_number: Concern inspected.
    amount_usd: Charge (positive).
  account: warranty_customer_charges
  direction: in
  triggers: []
- type: warranty_charge_payment
  target: warranty_ledger
  meaning: The customer pays a diagnostic charge.
  grain: One row per payment.
  distinguish_by:
  - source_entry_id
  - entry_date
  - payment_method
  fields:
    entry_date: Payment date.
    source_entry_id: The warranty_charge row paid.
    payment_method: card, cash or check.
    amount_usd: Amount paid (positive).
  account: warranty_customer_charges
  direction: out
  triggers: []
- type: warranty_charge_waiver
  target: warranty_ledger
  meaning: A diagnostic charge is waived.
  grain: One row per reason per charge.
  distinguish_by:
  - source_entry_id
  - waiver_reason
  fields:
    entry_date: Waiver date.
    source_entry_id: The warranty_charge row waived.
    waiver_reason: goodwill or billing_error.
    amount_usd: Amount waived (positive).
  account: warranty_customer_charges
  direction: out
  triggers: []
- type: warranty_reimbursement_approve
  target: warranty_ledger
  meaning: A pre-authorized outside-shop warranty repair is approved for reimbursement.
  grain: One row per reimbursed concern attempt.
  distinguish_by:
  - concern_number
  - rework_attempt
  fields:
    entry_date: Approval date.
    concern_number: Concern repaired.
    rework_attempt: Remedy attempt reimbursed.
    outside_shop_name: Outside shop, as on its invoice.
    invoice_amount_usd: Amount on the outside shop's paid invoice.
    invoice_date: Date of the outside repair.
    amount_usd: Amount approved (positive).
  account: sublet_reimbursement_due
  direction: in
  triggers: []
- type: warranty_reimbursement_pay
  target: warranty_ledger
  meaning: An approved reimbursement is paid to the customer.
  grain: One row per approved reimbursement paid.
  distinguish_by:
  - source_entry_id
  fields:
    entry_date: Payment date.
    source_entry_id: The warranty_reimbursement_approve row paid.
    payment_method: check or ach.
    amount_usd: Amount paid (positive).
  account: sublet_reimbursement_due
  direction: out
  triggers: []
measures:
- id: warranty_msr_unresolved_reworks
  window: Life of the concern.
  measure: Count of warranty_rework_complete rows on the concern with rework_result not_resolved.
- id: warranty_msr_charge_outstanding
  window: Life of the charge.
  measure: amount_usd of a warranty_charge row minus payments and waivers naming it.
policies:
- id: warranty_agg_multi_holding
  subject:
  - warranty_issue
  rule: A customer may hold any number of coverages, one for each piece of delivered or completed network work on
    any of their vehicles; coverages on the same vehicle stand side by side, each covering only its own source work.
    Per source, warranty_agg_one_per_source applies.
  eligibility: []
  params:
    max_per_customer: null
- id: warranty_agg_one_per_source
  subject:
  - warranty_issue
  rule: A source repair order, glass job or calibration order carries at most max_coverages_per_source coverage.
    No coverage already exists for the same source work. A concern on a vehicle with several coverages is handled
    under the coverage whose source work it concerns; a concern in an area no coverage's source work touched is
    outside_repaired_area for all of them.
  eligibility:
  - id: no_coverage_for_source
    applies_to:
    - warranty_issue
    kind: dedup
    condition: No coverage already exists for the same source work.
    evidence_fields:
    - warranty_coverages.claim_repair_id
    - warranty_coverages.retail_repair_id
    - warranty_coverages.glass_job_id
    - warranty_coverages.adas_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_coverages.claim_repair_id
      - - warranty_coverages.retail_repair_id
      - - warranty_coverages.glass_job_id
      - - warranty_coverages.adas_order_id
      action_bindings:
        warranty_coverages.claim_repair_id: claim_repair_id
        warranty_coverages.retail_repair_id: retail_repair_id
        warranty_coverages.glass_job_id: glass_job_id
        warranty_coverages.adas_order_id: adas_order_id
    dedup_contract:
      table: warranty_coverages
      mode: separate_record
      object_bindings:
        claim_repair_id: claim_repair_id
        retail_repair_id: retail_repair_id
        glass_job_id: glass_job_id
        adas_order_id: adas_order_id
      duplicate_filters:
        status:
        - active
        - redeemed
        - expired
        - voided
        - ended_by_sale
      distinct_fields:
      - warranty_coverage_id
  params:
    per_tier:
      Chip Repair Guarantee:
        max_coverages_per_source: =max_coverages_per_source
      Calibration Workmanship Warranty:
        max_coverages_per_source: =max_coverages_per_source
      Cosmetic Repair Workmanship Warranty:
        max_coverages_per_source: =max_coverages_per_source
      Glass Installation Lifetime Warranty:
        max_coverages_per_source: =max_coverages_per_source
      Collision Lifetime Workmanship Warranty:
        max_coverages_per_source: =max_coverages_per_source
      Certified Structural Lifetime Warranty:
        max_coverages_per_source: =max_coverages_per_source
- id: warranty_plan_issue
  subject:
  - warranty_issue
  rule: The plan issued is the one the source work names in its warranty_plan_issued parameter, issued on the delivery
    date of a repair order or the completion date of a glass job or calibration order, with the odometer at that
    date. Parts the customer supplied are excluded where customer_supplied_parts_excluded is true, and sensors whose
    calibration the customer declined are excluded where declined_calibration_excluded is true; both exclusions
    are recorded on the coverage at issue. The certificate goes out by certificate_delivery_channel and is honored
    at any network center where nationwide_service is true. Coverage is never sold, extended or upgraded; a rework
    never starts a new term where rework_extends_term is false.
  eligibility: []
  params:
    per_tier:
      Chip Repair Guarantee:
        customer_supplied_parts_excluded: =customer_supplied_parts_excluded
        declined_calibration_excluded: =declined_calibration_excluded
        certificate_delivery_channel: =certificate_delivery_channel
        nationwide_service: =nationwide_service
        rework_extends_term: =rework_extends_term
      Calibration Workmanship Warranty:
        customer_supplied_parts_excluded: =customer_supplied_parts_excluded
        declined_calibration_excluded: =declined_calibration_excluded
        certificate_delivery_channel: =certificate_delivery_channel
        nationwide_service: =nationwide_service
        rework_extends_term: =rework_extends_term
      Cosmetic Repair Workmanship Warranty:
        customer_supplied_parts_excluded: =customer_supplied_parts_excluded
        declined_calibration_excluded: =declined_calibration_excluded
        certificate_delivery_channel: =certificate_delivery_channel
        nationwide_service: =nationwide_service
        rework_extends_term: =rework_extends_term
      Glass Installation Lifetime Warranty:
        customer_supplied_parts_excluded: =customer_supplied_parts_excluded
        declined_calibration_excluded: =declined_calibration_excluded
        certificate_delivery_channel: =certificate_delivery_channel
        nationwide_service: =nationwide_service
        rework_extends_term: =rework_extends_term
      Collision Lifetime Workmanship Warranty:
        customer_supplied_parts_excluded: =customer_supplied_parts_excluded
        declined_calibration_excluded: =declined_calibration_excluded
        certificate_delivery_channel: =certificate_delivery_channel
        nationwide_service: =nationwide_service
        rework_extends_term: =rework_extends_term
      Certified Structural Lifetime Warranty:
        customer_supplied_parts_excluded: =customer_supplied_parts_excluded
        declined_calibration_excluded: =declined_calibration_excluded
        certificate_delivery_channel: =certificate_delivery_channel
        nationwide_service: =nationwide_service
        rework_extends_term: =rework_extends_term
- id: warranty_term_and_end
  subject:
  - warranty_expire
  - warranty_void
  - warranty_end_by_sale
  rule: 'A plan with lifetime_while_owned true has no term and runs while the customer on file owns the vehicle;
    a plan with a term runs term_months calendar months from its term_anchor. Months are calendar months from the
    issued date; when the issued day does not exist in the end month, the term ends on that month''s last day, and
    the term''s end date is still covered. Where ends_on_sale is true, coverage ends when the vehicle record shows
    an owned_through date: the plan does not pass to a later owner, and a later owner''s report is refused. Where
    void_on_outside_alteration is true, coverage is voided when the warrantied work is altered or re-repaired outside
    the network, and where void_on_later_total_loss is true, when the vehicle is declared a total loss in a later
    loss. A coverage already redeemed, expired, voided or ended stays so.'
  eligibility: []
  params:
    per_tier:
      Chip Repair Guarantee:
        lifetime_while_owned: =lifetime_while_owned
        term_months: =term_months
        term_anchor: =term_anchor
        ends_on_sale: =ends_on_sale
        void_on_outside_alteration: =void_on_outside_alteration
        void_on_later_total_loss: =void_on_later_total_loss
      Calibration Workmanship Warranty:
        lifetime_while_owned: =lifetime_while_owned
        term_months: =term_months
        term_anchor: =term_anchor
        ends_on_sale: =ends_on_sale
        void_on_outside_alteration: =void_on_outside_alteration
        void_on_later_total_loss: =void_on_later_total_loss
      Cosmetic Repair Workmanship Warranty:
        lifetime_while_owned: =lifetime_while_owned
        term_months: =term_months
        term_anchor: =term_anchor
        ends_on_sale: =ends_on_sale
        void_on_outside_alteration: =void_on_outside_alteration
        void_on_later_total_loss: =void_on_later_total_loss
      Glass Installation Lifetime Warranty:
        lifetime_while_owned: =lifetime_while_owned
        term_months: =term_months
        term_anchor: =term_anchor
        ends_on_sale: =ends_on_sale
        void_on_outside_alteration: =void_on_outside_alteration
        void_on_later_total_loss: =void_on_later_total_loss
      Collision Lifetime Workmanship Warranty:
        lifetime_while_owned: =lifetime_while_owned
        term_months: =term_months
        term_anchor: =term_anchor
        ends_on_sale: =ends_on_sale
        void_on_outside_alteration: =void_on_outside_alteration
        void_on_later_total_loss: =void_on_later_total_loss
      Certified Structural Lifetime Warranty:
        lifetime_while_owned: =lifetime_while_owned
        term_months: =term_months
        term_anchor: =term_anchor
        ends_on_sale: =ends_on_sale
        void_on_outside_alteration: =void_on_outside_alteration
        void_on_later_total_loss: =void_on_later_total_loss
- id: warranty_evt_concern_report
  subject:
  - warranty_concern_report
  rule: 'A concern is recorded against the coverage whose source work it concerns. The coverage is in active status.
    The customer on file still owns the vehicle: the vehicle''s owned_through date is empty. The concern is reported
    no later than the plan''s concern report window days after the customer discovered it. Days are calendar days
    counted from the discovery date the customer states, as day zero, and a report on the last day is in time. For
    a plan with a term, the concern is reported no later than term_months calendar months after the issued date.
    Months are calendar months from the issued date; when the issued day does not exist in the end month, the term
    ends on that month''s last day, and a report on the end date is in time. The odometer is recorded at report
    where odometer_required_at_report is true.'
  eligibility:
  - id: coverage_active
    applies_to:
    - warranty_concern_report
    kind: state
    condition: The coverage is in active status.
    evidence_fields:
    - warranty_coverages.status
    - warranty_coverages.warranty_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_coverages.warranty_coverage_id
      action_bindings:
        warranty_coverages.warranty_coverage_id: warranty_coverage_id
    state_contract:
      field: warranty_coverages.status
      allowed:
      - active
  - id: still_owned
    applies_to:
    - warranty_concern_report
    kind: authorization
    condition: 'The customer on file still owns the vehicle: the vehicle''s owned_through date is empty.'
    evidence_fields:
    - vehicles.owned_through
    - vehicles.vehicle_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - vehicles.vehicle_id
      action_bindings:
        vehicles.vehicle_id: vehicle_id
  - id: within_report_window
    applies_to:
    - warranty_concern_report
    kind: time
    condition: The concern is reported no later than the plan's concern report window days after the customer discovered
      it.
    evidence_fields:
    - warranty_events.discovered_date
    - warranty_events.warranty_coverage_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - warranty_events.warranty_coverage_id
      action_bindings:
        warranty_events.warranty_coverage_id: warranty_coverage_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the customer discovered it
      anchor_source: warranty_events.discovered_date
      relation: not_after
      duration_source: variants.concern_report_window_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the discovery date the customer states, as day zero, and
        a report on the last day is in time.
      boundary: inclusive
  - id: within_term
    applies_to:
    - warranty_concern_report
    kind: time
    condition: For a plan with a term, the concern is reported no later than term_months calendar months after the
      issued date.
    evidence_fields:
    - warranty_coverages.issued_date
    - warranty_coverages.warranty_coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_coverages.warranty_coverage_id
      action_bindings:
        warranty_coverages.warranty_coverage_id: warranty_coverage_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the issued date
      anchor_source: warranty_coverages.issued_date
      relation: not_after
      duration_source: variants.term_months
      unit: calendar_months
      counting_rule: Months are calendar months from the issued date; when the issued day does not exist in the
        end month, the term ends on that month's last day, and a report on the end date is in time.
      boundary: inclusive
  params:
    per_tier:
      Chip Repair Guarantee:
        concern_report_window_days: =concern_report_window_days
        term_months: =term_months
        odometer_required_at_report: =odometer_required_at_report
      Calibration Workmanship Warranty:
        concern_report_window_days: =concern_report_window_days
        term_months: =term_months
        odometer_required_at_report: =odometer_required_at_report
      Cosmetic Repair Workmanship Warranty:
        concern_report_window_days: =concern_report_window_days
        term_months: =term_months
        odometer_required_at_report: =odometer_required_at_report
      Glass Installation Lifetime Warranty:
        concern_report_window_days: =concern_report_window_days
        term_months: =term_months
        odometer_required_at_report: =odometer_required_at_report
      Collision Lifetime Workmanship Warranty:
        concern_report_window_days: =concern_report_window_days
        term_months: =term_months
        odometer_required_at_report: =odometer_required_at_report
      Certified Structural Lifetime Warranty:
        concern_report_window_days: =concern_report_window_days
        term_months: =term_months
        odometer_required_at_report: =odometer_required_at_report
- id: warranty_evt_inspection
  subject:
  - warranty_inspection
  rule: 'Where inspection_required is true, a network inspection decides coverage before any remedy, offered within
    inspection_scheduling_business_days business days of the report, with inspection_photo_count photos and, where
    structural_measurement_at_inspection is true, a structural measurement. A concern is covered only when all of
    these hold: its kind is one the plan covers (workmanship_covered; paint defects where paint_defects_covered;
    fading where paint_fade_covered; leaks and wind noise where water_leak_wind_noise_covered; panel gaps where
    panel_fit_covered; edge stress cracks where stress_crack_covered; a spreading repaired chip where chip_spread_covered;
    a calibration fault where calibration_fault_covered and the odometer is within calibration_miles_limit miles
    of the odometer at issue; an installed mechanical part within mechanical_parts_months months and mechanical_parts_miles
    miles; an installed electrical part within electrical_parts_months months; structural failure where structural_integrity_covered;
    corrosion where corrosion_covered); it lies in the area of the source work; its cause is not one of the plan''s
    excluded_causes; and it does not concern an excluded customer-supplied part or declined calibration. The first
    exclusion that applies is recorded as the exclusion_code. A concern was reported on the coverage before it is
    inspected.'
  eligibility:
  - id: concern_reported
    applies_to:
    - warranty_inspection
    kind: dedup
    condition: A concern was reported on the coverage before it is inspected.
    evidence_fields:
    - warranty_events.warranty_coverage_id
    - warranty_events.concern_number
    - warranty_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_events.warranty_coverage_id
        - warranty_events.concern_number
      action_bindings:
        warranty_events.warranty_coverage_id: warranty_coverage_id
        warranty_events.concern_number: concern_number
    dedup_contract:
      table: warranty_events
      mode: separate_record
      object_bindings:
        warranty_coverage_id: warranty_coverage_id
        concern_number: concern_number
      duplicate_filters:
        event_type:
        - warranty_inspection
      distinct_fields: []
  params:
    per_tier:
      Chip Repair Guarantee:
        inspection_required: =inspection_required
        inspection_scheduling_business_days: =inspection_scheduling_business_days
        inspection_photo_count: =inspection_photo_count
        structural_measurement_at_inspection: =structural_measurement_at_inspection
        workmanship_covered: =workmanship_covered
        paint_defects_covered: =paint_defects_covered
        paint_fade_covered: =paint_fade_covered
        water_leak_wind_noise_covered: =water_leak_wind_noise_covered
        panel_fit_covered: =panel_fit_covered
        stress_crack_covered: =stress_crack_covered
        chip_spread_covered: =chip_spread_covered
        calibration_fault_covered: =calibration_fault_covered
        calibration_miles_limit: =calibration_miles_limit
        mechanical_parts_months: =mechanical_parts_months
        mechanical_parts_miles: =mechanical_parts_miles
        electrical_parts_months: =electrical_parts_months
        structural_integrity_covered: =structural_integrity_covered
        corrosion_covered: =corrosion_covered
        excluded_causes: =excluded_causes
      Calibration Workmanship Warranty:
        inspection_required: =inspection_required
