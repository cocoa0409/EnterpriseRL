- id: warranty_evt_rework
  subject:
  - warranty_rework_authorize
  - warranty_rework_complete
  rule: 'A remedy is authorized only for a covered concern. The inspection of that concern determined it covered.
    A plan whose inspection_required is false needs no inspection: a Chip Repair Guarantee concern is remedied by
    a chip_credit when the network replaces that windshield, where chip_credit_toward_replacement is true. Otherwise
    the remedy is a network_rework at any network center, targeted at rework_target_business_days business days,
    with a courtesy ride within rework_courtesy_ride_miles miles; when the target exceeds courtesy_rental_min_rework_days
    the network pays a courtesy rental of up to courtesy_rental_days days, and sensors the rework disturbs are recalibrated
    at no charge where recalibration_on_rework is true. When the customer is more than sublet_distance_miles miles
    from the nearest network center (and sublet_distance_miles is above zero), the remedy may instead be an outside_shop
    repair, authorized before the work is done. A concern whose network reworks ended not_resolved max_rework_attempts_before_escalation
    times (warranty_msr_unresolved_reworks) receives no further rework authorization at the desk and goes to the
    regional warranty manager.'
  eligibility:
  - id: concern_covered
    applies_to:
    - warranty_rework_authorize
    kind: authorization
    condition: The inspection of that concern determined it covered.
    evidence_fields:
    - warranty_events.warranty_coverage_id
    - warranty_events.concern_number
    - warranty_events.determination
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_events.warranty_coverage_id
        - warranty_events.concern_number
      action_bindings:
        warranty_events.warranty_coverage_id: warranty_coverage_id
        warranty_events.concern_number: concern_number
  params:
    per_tier:
      Chip Repair Guarantee:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
        rework_target_business_days: =rework_target_business_days
        rework_courtesy_ride_miles: =rework_courtesy_ride_miles
        courtesy_rental_min_rework_days: =courtesy_rental_min_rework_days
        courtesy_rental_days: =courtesy_rental_days
        recalibration_on_rework: =recalibration_on_rework
        sublet_distance_miles: =sublet_distance_miles
        max_rework_attempts_before_escalation: =max_rework_attempts_before_escalation
      Calibration Workmanship Warranty:
        chip_credit_toward_replacement: =chip_credit_toward_replacement
        rework_target_business_days: =rework_target_business_days
