- id: warranty_evt_outside_reimbursement
  subject:
  - warranty_reimbursement_approve
  - warranty_reimbursement_pay
  rule: An outside-shop repair is reimbursed only when it was authorized as an outside_shop remedy before the work
    was done, where outside_shop_preauthorization_required is true. The paid invoice is submitted no later than
    sublet_receipt_window_days days after the outside repair. Days are calendar days counted from the invoice date
    as day zero; an invoice submitted on the last day is in time. The amount approved is the lesser of the paid
    invoice and sublet_reimbursement_cap_usd, and it is paid by check or ACH within reimbursement_payment_business_days
    business days, once per approval. Work beyond the covered concern on the same invoice is not reimbursed.
  eligibility:
  - id: invoice_in_time
    applies_to:
    - warranty_reimbursement_approve
    kind: time
    condition: The paid invoice is submitted no later than sublet_receipt_window_days days after the outside repair.
    evidence_fields:
    - warranty_ledger.invoice_date
    - warranty_ledger.warranty_coverage_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - warranty_ledger.warranty_coverage_id
      action_bindings:
        warranty_ledger.warranty_coverage_id: warranty_coverage_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the outside repair
      anchor_source: warranty_ledger.invoice_date
      relation: not_after
      duration_source: variants.sublet_receipt_window_days
      unit: calendar_days
      counting_rule: Days are calendar days counted from the invoice date as day zero; an invoice submitted on the
        last day is in time.
      boundary: inclusive
  params:
    per_tier:
      Chip Repair Guarantee:
        outside_shop_preauthorization_required: =outside_shop_preauthorization_required
        sublet_receipt_window_days: =sublet_receipt_window_days
