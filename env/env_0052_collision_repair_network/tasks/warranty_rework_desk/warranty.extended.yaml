# ---------------------------------------------------------------- extended policies
extended_policies:
- id: warranty_ext_calibration_diagnostic_charge
  base_policy_refs:
  - warranty_evt_diagnostic_fee
  overwrite:
  - base_policy: warranty_evt_diagnostic_fee
    superseded_clause: An inspection that finds a concern not covered posts a diagnostic charge of diagnostic_fee_usd
      only when the concern type is in the plan's diagnostic_fee_concern_types; every other inspection is free,
      covered or not.
    replaced_by: An inspection that finds a calibration fault not covered under a Calibration Workmanship Warranty
      posts one calibration diagnostic charge for that concern, figured as set out below, and every other inspection
      stays free, whether it finds the concern covered or finds not covered a concern of a kind on which the plan
      charges no diagnostic fee.
  trigger: state_due
  subject:
  - warranty_charge
  computes: amount_usd
  target_tool: accept_calibration_diagnostic_charge_d9578b72
  params:
    dual_procedure_fee: 109.95
    dynamic_procedure_fee: 94.95
    alignment_verify_fee: 29.95
    multi_system_scan_fee: 39.95
    radar_scan_fee: 24.95
    extended_history_fee: 40.0
    single_failure_history_fee: 20.0
    late_recheck_share: 0.75
  rule: 'An inspection that finds a calibration fault not covered under a Calibration Workmanship Warranty posts
    one calibration diagnostic charge for that concern, figured as set out below, and every other inspection stays
    free, whether it finds the concern covered or finds not covered a concern of a kind on which the plan charges
    no diagnostic fee. The calibration diagnostic charge is the plan''s standard diagnostic fee, charged in full
    once for the concern, in US dollars rounded to the cent. The calibration procedure fee follows the procedure
    the manufacturer specifies on the calibration order the coverage was issued on: where that order calls for both
    the static and the dynamic procedure, the calibration procedure fee is the dual-procedure fee; where it calls
    for the dynamic procedure alone, the calibration procedure fee is the dynamic-procedure fee; where it calls
    for the static procedure alone or for neither, the calibration procedure fee is the plan''s standard diagnostic
    fee. The calibration alignment fee follows the four-wheel alignment checks recorded as out of specification
    on the customer''s calibration orders: two or more such checks, the calibration alignment fee is the alignment
    check fee of the calibration tier of the order the coverage was issued on; exactly one such check, the calibration
    alignment fee is the alignment verification fee; no such check, there is no calibration alignment fee. The calibration
    sensor scan fee follows the systems the order the coverage was issued on calibrated: multiple systems, the multi-system
    scan fee; a blind spot radar alone or a front radar alone, the radar scan fee; a forward camera alone, no calibration
    sensor scan fee. The calibration history fee follows the calibration attempts recorded as failed on the customer''s
    calibration orders: two or more failed attempts, the extended history fee; exactly one failed attempt, the single-failure
    history fee; no failed attempt, no calibration history fee. The calibration procedure fee is charged according
    to the remedy attempts completed on the coverage with the concern resolved, network reworks and outside-shop
    repairs alike: where such a remedy attempt was completed less than three whole calendar months before the charge
    date, the calibration procedure fee is halved and rounded down to the whole dollar; where none was completed
    less than three whole calendar months before but one was completed less than twelve whole calendar months before
    the charge date, the calibration procedure fee is multiplied by the late re-check share and rounded to the cent;
    where none was completed less than twelve whole calendar months before the charge date, the calibration procedure
    fee is charged in full. The calibration diagnostic charge is the calibration procedure fee as charged, plus
    the calibration alignment fee, the calibration sensor scan fee and the calibration history fee, the sum rounded
    to the cent.'
  prerequisite: []
  cross_category:
  - category: adas
    as: history
    reads:
    - oem_procedure
    - systems_to_calibrate
    - variant_name
    - adas_events.alignment_result
    - adas_events.attempt_result
    note: The calibration procedure fee, alignment fee, sensor scan fee and history fee take their tiers from the
      source calibration order and from the alignment checks and attempts recorded on the customer's calibration
      orders.
  compute:
  - src_procedure: CFIELD('adas','oem_procedure', adas_order_id=F('adas_order_id'))
  - procedure_fee: K('dual_procedure_fee') if src_procedure == 'static_and_dynamic' else (K('dynamic_procedure_fee')
      if src_procedure == 'dynamic' else P('diagnostic_fee_usd'))
  - out_of_spec_checks: XCOUNT('adas','adas_events', event_type='adas_alignment_check', alignment_result='out_of_spec')
  - alignment_fee: CPARAM('adas','alignment_check_fee_usd', adas_order_id=F('adas_order_id')) if out_of_spec_checks
      >= 2 else (K('alignment_verify_fee') if out_of_spec_checks == 1 else 0)
  - src_systems: CFIELD('adas','systems_to_calibrate', adas_order_id=F('adas_order_id'))
  - scan_fee: K('multi_system_scan_fee') if src_systems == 'multiple_systems' else (K('radar_scan_fee') if (src_systems
      == 'blind_spot_radar' or src_systems == 'front_radar') else 0)
  - failed_attempts: XCOUNT('adas','adas_events', event_type='adas_attempt', attempt_result='failed')
  - history_fee: K('extended_history_fee') if failed_attempts >= 2 else (K('single_failure_history_fee') if failed_attempts
      == 1 else 0)
  - resolved_3m: COUNT('warranty_events', within_months=3, event_type='warranty_rework_complete', rework_result='resolved')
  - resolved_12m: COUNT('warranty_events', within_months=12, event_type='warranty_rework_complete', rework_result='resolved')
  - procedure_charged: int(procedure_fee / 2) if resolved_3m >= 1 else (RND(procedure_fee * K('late_recheck_share'),
      2) if resolved_12m >= 1 else procedure_fee)
  - result: RND(procedure_charged + alignment_fee + scan_fee + history_fee, 2)
  compute_basis:
    src_procedure: The calibration procedure fee follows the procedure the manufacturer specifies on the calibration
      order the coverage was issued on
    procedure_fee: where that order calls for both the static and the dynamic procedure, the calibration procedure
      fee is the dual-procedure fee; where it calls for the dynamic procedure alone, the calibration procedure fee
      is the dynamic-procedure fee; where it calls for the static procedure alone or for neither, the calibration
      procedure fee is the plan's standard diagnostic fee.
    out_of_spec_checks: The calibration alignment fee follows the four-wheel alignment checks recorded as out of
      specification on the customer's calibration orders
    alignment_fee: two or more such checks, the calibration alignment fee is the alignment check fee of the calibration
      tier of the order the coverage was issued on; exactly one such check, the calibration alignment fee is the
      alignment verification fee; no such check, there is no calibration alignment fee.
    src_systems: The calibration sensor scan fee follows the systems the order the coverage was issued on calibrated
    scan_fee: multiple systems, the multi-system scan fee; a blind spot radar alone or a front radar alone, the
      radar scan fee; a forward camera alone, no calibration sensor scan fee.
    failed_attempts: The calibration history fee follows the calibration attempts recorded as failed on the customer's
      calibration orders
    history_fee: two or more failed attempts, the extended history fee; exactly one failed attempt, the single-failure
      history fee; no failed attempt, no calibration history fee.
    resolved_3m: where such a remedy attempt was completed less than three whole calendar months before the charge
      date, the calibration procedure fee is halved and rounded down to the whole dollar
    resolved_12m: where none was completed less than three whole calendar months before but one was completed less
      than twelve whole calendar months before the charge date, the calibration procedure fee is multiplied by the
      late re-check share and rounded to the cent
    procedure_charged: 'The calibration procedure fee is charged according to the remedy attempts completed on the
      coverage with the concern resolved, network reworks and outside-shop repairs alike: where such a remedy attempt
      was completed less than three whole calendar months before the charge date, the calibration procedure fee
      is halved and rounded down to the whole dollar; where none was completed less than three whole calendar months
      before but one was completed less than twelve whole calendar months before the charge date, the calibration
      procedure fee is multiplied by the late re-check share and rounded to the cent; where none was completed less
      than twelve whole calendar months before the charge date, the calibration procedure fee is charged in full.'
    result: The calibration diagnostic charge is the calibration procedure fee as charged, plus the calibration
      alignment fee, the calibration sensor scan fee and the calibration history fee, the sum rounded to the cent.
  factors:
  - id: calibration_procedure_fee
    effect: parameter
    decides: procedure_fee
    bindings:
    - src_procedure
    - procedure_fee
    ladder:
    - when: the calibration order the coverage was issued on calls for both the static and the dynamic procedure
      value: K('dual_procedure_fee')
    - when: that order calls for the dynamic procedure alone
      value: K('dynamic_procedure_fee')
    - when: otherwise (the static procedure alone, or neither)
      value: P('diagnostic_fee_usd')
    baseline:
      procedure_fee: P('diagnostic_fee_usd')
    evidence:
    - cross_category
    cross_difficulty: adas
  - id: calibration_alignment_fee
    effect: parameter
    decides: alignment_fee
    bindings:
    - out_of_spec_checks
    - alignment_fee
    ladder:
    - when: two or more alignment checks recorded as out of specification on the customer's calibration orders
      value: CPARAM('adas','alignment_check_fee_usd') of the source order's calibration tier
    - when: exactly one such check
      value: K('alignment_verify_fee')
    - when: otherwise (no such check)
      value: '0'
    baseline:
      alignment_fee: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: adas
  - id: calibration_sensor_scan_fee
    effect: parameter
    decides: scan_fee
    bindings:
    - src_systems
    - scan_fee
    ladder:
    - when: the source calibration order calibrated multiple systems
      value: K('multi_system_scan_fee')
    - when: it calibrated a blind spot radar alone or a front radar alone
      value: K('radar_scan_fee')
    - when: otherwise (a forward camera alone)
      value: '0'
    baseline:
      scan_fee: '0'
    evidence:
    - cross_category
    cross_difficulty: adas
  - id: calibration_history_fee
    effect: parameter
    decides: history_fee
    bindings:
    - failed_attempts
    - history_fee
    ladder:
    - when: two or more calibration attempts recorded as failed on the customer's calibration orders
      value: K('extended_history_fee')
    - when: exactly one failed attempt
      value: K('single_failure_history_fee')
    - when: otherwise (no failed attempt)
      value: '0'
    baseline:
      history_fee: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: adas
  - id: calibration_recheck_rate
    effect: method
    decides: procedure_charged
    bindings:
    - resolved_3m
    - resolved_12m
    - procedure_charged
    ladder:
    - when: a remedy attempt on the coverage (network rework or outside-shop repair) was completed with the concern
        resolved less than three whole calendar months before the charge date
      method: the calibration procedure fee is halved and rounded down to the whole dollar
    - when: none less than three whole calendar months before, but one less than twelve whole calendar months before
      method: the calibration procedure fee is multiplied by the late re-check share and rounded to the cent
    - when: otherwise (none less than twelve whole calendar months before)
      method: the calibration procedure fee is charged in full
    baseline:
      procedure_charged: procedure_fee
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The calibration diagnostic charge is the plan's standard diagnostic fee, charged in full once for the
      concern, in US dollars rounded to the cent.
    params:
    - diagnostic_fee_usd
  inputs:
    history:
    - table: warranty_events
      aggregate: count
      field: rework_result
      within_months: 12
      filters:
        event_type: warranty_rework_complete
        rework_result: resolved
    - category: adas
      table: adas_events
      aggregate: count
      field: alignment_result
      filters:
        event_type: adas_alignment_check
        alignment_result: out_of_spec
    - category: adas
      table: adas_events
      aggregate: count
      field: attempt_result
      filters:
        event_type: adas_attempt
        attempt_result: failed
    cross_category:
    - adas
- id: warranty_ext_calibration_goodwill
  base_policy_refs:
  - warranty_evt_diagnostic_fee
  overwrite: []
  trigger: on_request
  subject:
  - warranty_charge_waiver
  computes: amount_usd
  target_tool: grant_calibration_goodwill_f9a2e5bf
  params:
    standard_goodwill_share: 0.05
    boundary_goodwill_share: 0.1
    kind_goodwill_share: 0.07
    first_low_use_miles: 14000
    second_low_use_miles: 16000
    low_use_months: 12
    full_low_use_allowance: 6.0
    half_low_use_allowance: 3.0
    glass_loyalty_two: 4.0
    glass_loyalty_one: 2.0
    calibration_loyalty_two: 4.0
    calibration_loyalty_one: 2.0
    prior_trouble_two: 3.0
    prior_trouble_one: 1.5
    prompt_report_days: 3
    timely_report_days: 10
    prompt_multiplier: 1.5
    timely_multiplier: 1.2
  rule: 'Calibration goodwill is a reduction granted on a calibration diagnostic charge of a Calibration Workmanship
    Warranty when the customer asks for one; it is booked against the calibration diagnostic charge booked on the
    coverage less than one whole calendar month before, and it never exceeds the plan''s goodwill authority per
    charge, a request for more being declined at the desk. Calibration goodwill is figured only after the calibration
    diagnostic charge owed on the not-covered calibration finding stands on the coverage''s account. The calibration
    goodwill is the standard goodwill share of the calibration diagnostic charges booked on the coverage less than
    one whole calendar month before, limited to the plan''s goodwill authority per charge and rounded to the cent.
    The calibration goodwill share follows the exclusion recorded by the most recent inspection on the coverage
    that found a concern not covered: mileage exceeded or term exceeded, the boundary goodwill share; not a covered
    kind, the kind goodwill share; any other exclusion, the standard goodwill share. The calibration low-use allowance
    follows the miles driven from the odometer at issue to the odometer recorded at the most recent calibration-fault
    report, together with the whole calendar months from the issued date to the goodwill date: at most the first
    low-use mileage and fewer than the low-use months, the full low-use allowance; more than the first but at most
    the second low-use mileage and fewer than the low-use months, the half low-use allowance; any other combination,
    no calibration low-use allowance. The calibration glass-loyalty allowance follows the customer payments recorded
    on the customer''s network glass jobs less than thirty-six whole calendar months before the goodwill date: two
    or more payments, the two-payment glass-loyalty allowance; exactly one payment, the one-payment glass-loyalty
    allowance; no payment, no calibration glass-loyalty allowance. The calibration-order loyalty allowance follows
    the payments the customer made personally on the customer''s calibration orders less than twenty-four whole
    calendar months before the goodwill date: two or more payments, the two-payment calibration loyalty allowance;
    exactly one payment, the one-payment calibration loyalty allowance; no payment, no calibration-order loyalty
    allowance. The calibration prior-trouble allowance follows the inspections on the coverage that found a concern
    covered: two or more such inspections, the two-finding prior-trouble allowance; exactly one, the one-finding
    prior-trouble allowance; none, no calibration prior-trouble allowance. The calibration goodwill sum is the calibration
    goodwill share applied to the calibration diagnostic charges so booked, plus the calibration low-use allowance,
    the calibration glass-loyalty allowance, the calibration-order loyalty allowance and the calibration prior-trouble
    allowance. The calibration goodwill sum is then adjusted for how promptly the most recent calibration-fault
    report followed the discovery date the customer gave: reported within the prompt-report days of discovery, the
    calibration goodwill sum is multiplied by the prompt multiplier and rounded up to the whole dollar; reported
    later than the prompt-report days but within the timely-report days, the calibration goodwill sum is multiplied
    by the timely multiplier and rounded to the cent; reported later than the timely-report days, the calibration
    goodwill sum stays as figured. The calibration goodwill is the adjusted calibration goodwill sum limited to
    the plan''s goodwill authority per charge, rounded to the cent.'
  prerequisite:
  - problem: warranty_ext_calibration_diagnostic_charge
    kind: value_input
    gate: charge_amount
    form: state
    policy_source: Calibration goodwill is figured only after the calibration diagnostic charge owed on the not-covered
      calibration finding stands on the coverage's account.
    condition: The coverage's money history carries a warranty_charge entry for the calibration_fault concern whose
      inspection determined not_covered.
    resolved_by: accept_calibration_diagnostic_charge_d9578b72
    effect: Once the calibration diagnostic charge is booked, charge_amount changes from 0.00 to the amount of that
      charge, and the calibration goodwill share and allowances act on it.
  cross_category:
  - category: glass
    as: history
    reads:
    - glass_ledger.event_type
    - glass_ledger.entry_date
    note: The calibration glass-loyalty allowance takes its tier from the count of customer payments on the customer's
      glass jobs in the last thirty-six months.
  - category: adas
    as: history
    reads:
    - adas_ledger.event_type
    - adas_ledger.payer_kind
    - adas_ledger.entry_date
    note: The calibration-order loyalty allowance takes its tier from the count of payments the customer made on
      calibration orders in the last twenty-four months.
  compute:
  - charge_amount: SUM('warranty_ledger','amount_usd', within_months=1, date_field='entry_date', event_type='warranty_charge')
  - nc_exclusion: LATEST('warranty_events','exclusion_code', event_type='warranty_inspection', determination='not_covered')
  - goodwill_share: K('boundary_goodwill_share') if (nc_exclusion == 'mileage_exceeded' or nc_exclusion == 'term_exceeded')
      else (K('kind_goodwill_share') if nc_exclusion == 'not_a_covered_kind' else K('standard_goodwill_share'))
  - report_odometer: LATEST('warranty_events','odometer_reported', event_type='warranty_concern_report', concern_type='calibration_fault')
  - miles_driven: report_odometer - F('odometer_at_issue')
  - months_in_service: MONTHS(F('issued_date'), NOW)
  - low_use_allowance: K('full_low_use_allowance') if (miles_driven <= K('first_low_use_miles') and months_in_service
      < K('low_use_months')) else (K('half_low_use_allowance') if (miles_driven > K('first_low_use_miles') and miles_driven
      <= K('second_low_use_miles') and months_in_service < K('low_use_months')) else 0)
  - glass_payments: XCOUNT('glass','glass_ledger', within_months=36, date_field='entry_date', event_type='glass_customer_payment')
  - glass_loyalty: K('glass_loyalty_two') if glass_payments >= 2 else (K('glass_loyalty_one') if glass_payments
      == 1 else 0)
  - calibration_payments: XCOUNT('adas','adas_ledger', within_months=24, date_field='entry_date', event_type='adas_payment',
      payer_kind='customer')
  - calibration_loyalty: K('calibration_loyalty_two') if calibration_payments >= 2 else (K('calibration_loyalty_one')
      if calibration_payments == 1 else 0)
  - covered_findings: COUNT('warranty_events', event_type='warranty_inspection', determination='covered')
  - prior_trouble: K('prior_trouble_two') if covered_findings >= 2 else (K('prior_trouble_one') if covered_findings
      == 1 else 0)
  - goodwill_sum: charge_amount * goodwill_share + low_use_allowance + glass_loyalty + calibration_loyalty + prior_trouble
  - report_date: LATEST('warranty_events','event_date', event_type='warranty_concern_report', concern_type='calibration_fault')
  - discovered_date: LATEST('warranty_events','discovered_date', event_type='warranty_concern_report', concern_type='calibration_fault')
  - report_lag: DAYS(discovered_date, report_date)
  - adjusted_sum: (int(goodwill_sum * K('prompt_multiplier')) + (1 if goodwill_sum * K('prompt_multiplier') > int(goodwill_sum
      * K('prompt_multiplier')) else 0)) if report_lag <= K('prompt_report_days') else (RND(goodwill_sum * K('timely_multiplier'),
      2) if report_lag <= K('timely_report_days') else goodwill_sum)
  - result: RND(MN(adjusted_sum, P('diagnostic_waiver_authority_usd')), 2)
  compute_basis:
    charge_amount: it is booked against the calibration diagnostic charge booked on the coverage less than one whole
      calendar month before
    nc_exclusion: The calibration goodwill share follows the exclusion recorded by the most recent inspection on
      the coverage that found a concern not covered
    goodwill_share: mileage exceeded or term exceeded, the boundary goodwill share; not a covered kind, the kind
      goodwill share; any other exclusion, the standard goodwill share.
    report_odometer: The calibration low-use allowance follows the miles driven from the odometer at issue to the
      odometer recorded at the most recent calibration-fault report
    miles_driven: the miles driven from the odometer at issue to the odometer recorded at the most recent calibration-fault
      report
    months_in_service: together with the whole calendar months from the issued date to the goodwill date
    low_use_allowance: at most the first low-use mileage and fewer than the low-use months, the full low-use allowance;
      more than the first but at most the second low-use mileage and fewer than the low-use months, the half low-use
      allowance; any other combination, no calibration low-use allowance.
    glass_payments: The calibration glass-loyalty allowance follows the customer payments recorded on the customer's
      network glass jobs less than thirty-six whole calendar months before the goodwill date
    glass_loyalty: two or more payments, the two-payment glass-loyalty allowance; exactly one payment, the one-payment
      glass-loyalty allowance; no payment, no calibration glass-loyalty allowance.
    calibration_payments: The calibration-order loyalty allowance follows the payments the customer made personally
      on the customer's calibration orders less than twenty-four whole calendar months before the goodwill date
    calibration_loyalty: two or more payments, the two-payment calibration loyalty allowance; exactly one payment,
      the one-payment calibration loyalty allowance; no payment, no calibration-order loyalty allowance.
    covered_findings: The calibration prior-trouble allowance follows the inspections on the coverage that found
      a concern covered
    prior_trouble: two or more such inspections, the two-finding prior-trouble allowance; exactly one, the one-finding
      prior-trouble allowance; none, no calibration prior-trouble allowance.
    goodwill_sum: The calibration goodwill sum is the calibration goodwill share applied to the calibration diagnostic
      charges so booked, plus the calibration low-use allowance, the calibration glass-loyalty allowance, the calibration-order
      loyalty allowance and the calibration prior-trouble allowance.
    report_date: adjusted for how promptly the most recent calibration-fault report followed the discovery date
      the customer gave
    discovered_date: the discovery date the customer gave
    report_lag: reported within the prompt-report days of discovery
    adjusted_sum: reported within the prompt-report days of discovery, the calibration goodwill sum is multiplied
      by the prompt multiplier and rounded up to the whole dollar; reported later than the prompt-report days but
      within the timely-report days, the calibration goodwill sum is multiplied by the timely multiplier and rounded
      to the cent; reported later than the timely-report days, the calibration goodwill sum stays as figured.
    result: The calibration goodwill is the adjusted calibration goodwill sum limited to the plan's goodwill authority
      per charge, rounded to the cent.
  factors:
  - id: calibration_goodwill_share
    effect: parameter
    decides: goodwill_share
    bindings:
    - nc_exclusion
    - goodwill_share
    ladder:
    - when: the most recent not-covered inspection on the coverage recorded mileage exceeded or term exceeded
      value: K('boundary_goodwill_share')
    - when: it recorded not a covered kind
      value: K('kind_goodwill_share')
    - when: otherwise (any other exclusion)
      value: K('standard_goodwill_share')
    baseline:
      goodwill_share: K('standard_goodwill_share')
    evidence:
    - history
    cross_difficulty: null
  - id: calibration_low_use_allowance
    effect: parameter
    decides: low_use_allowance
    bindings:
    - report_odometer
    - miles_driven
    - months_in_service
    - low_use_allowance
    ladder:
    - when: miles driven since issue at most the first low-use mileage and fewer than the low-use months in service
      value: K('full_low_use_allowance')
    - when: miles driven more than the first but at most the second low-use mileage and fewer than the low-use months
        in service
      value: K('half_low_use_allowance')
    - when: otherwise
      value: '0'
    baseline:
      low_use_allowance: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: calibration_glass_loyalty_allowance
    effect: parameter
    decides: glass_loyalty
    bindings:
    - glass_payments
    - glass_loyalty
    ladder:
    - when: two or more customer payments on the customer's network glass jobs less than thirty-six whole calendar
        months before
      value: K('glass_loyalty_two')
    - when: exactly one such payment
      value: K('glass_loyalty_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      glass_loyalty: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: calibration_order_loyalty_allowance
    effect: parameter
    decides: calibration_loyalty
    bindings:
    - calibration_payments
    - calibration_loyalty
    ladder:
    - when: two or more payments the customer made personally on calibration orders in the last twenty-four months
      value: K('calibration_loyalty_two')
    - when: exactly one such payment
      value: K('calibration_loyalty_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      calibration_loyalty: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: adas
  - id: calibration_prior_trouble_allowance
    effect: parameter
    decides: prior_trouble
    bindings:
    - covered_findings
    - prior_trouble
    ladder:
    - when: two or more inspections on the coverage found a concern covered
      value: K('prior_trouble_two')
    - when: exactly one such inspection
      value: K('prior_trouble_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      prior_trouble: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: calibration_report_timing
    effect: method
    decides: adjusted_sum
    bindings:
    - report_date
    - discovered_date
    - report_lag
    - adjusted_sum
    ladder:
    - when: the most recent calibration-fault report came within the prompt-report days of the discovery date
      method: the calibration goodwill sum is multiplied by the prompt multiplier and rounded up to the whole dollar
    - when: it came later than the prompt-report days but within the timely-report days
      method: the calibration goodwill sum is multiplied by the timely multiplier and rounded to the cent
    - when: otherwise (later than the timely-report days)
      method: the calibration goodwill sum stays as figured
    baseline:
      adjusted_sum: goodwill_sum
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The calibration goodwill is the standard goodwill share of the calibration diagnostic charges booked on
      the coverage less than one whole calendar month before, limited to the plan's goodwill authority per charge
      and rounded to the cent.
    params:
    - standard_goodwill_share
    - diagnostic_waiver_authority_usd
  inputs:
    history:
    - table: warranty_ledger
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        event_type: warranty_charge
    - table: warranty_events
      aggregate: count
      field: determination
      filters:
        event_type: warranty_inspection
        determination: covered
    - category: glass
      table: glass_ledger
      aggregate: count
      field: event_type
      within_months: 36
      filters:
        event_type: glass_customer_payment
    - category: adas
      table: adas_ledger
      aggregate: count
      field: event_type
      within_months: 24
      filters:
        event_type: adas_payment
        payer_kind: customer
    cross_category:
    - glass
    - adas
- id: warranty_ext_electrical_diagnostic_charge
  base_policy_refs:
  - warranty_evt_diagnostic_fee
  overwrite:
  - base_policy: warranty_evt_diagnostic_fee
    superseded_clause: An inspection that finds a concern not covered posts a diagnostic charge of diagnostic_fee_usd
      only when the concern type is in the plan's diagnostic_fee_concern_types; every other inspection is free,
      covered or not.
    replaced_by: An inspection that finds an electrical part installed in the repair not covered under a Collision
      Lifetime Workmanship Warranty or a Certified Structural Lifetime Warranty posts one electrical diagnostic
      charge for that concern, figured as set out below, and every other inspection stays free, whether it finds
      the concern covered or finds not covered a concern of a kind on which the plan charges no diagnostic fee.
  trigger: state_due
  subject:
  - warranty_charge
  computes: amount_usd
  target_tool: accept_electrical_diagnostic_charge_607d2bcb
  params:
    heavy_repair_hours: 40
    mid_repair_hours: 20
    heavy_repair_electrical_fee: 129.95
    mid_repair_electrical_fee: 109.95
    dealer_sublet_network_fee: 44.95
    in_house_network_fee: 29.95
    shared_visit_share: 0.75
    recent_part_months: 6
    aging_part_months: 12
    recent_part_credit: 10.0
    aging_part_credit: 5.0
    two_failure_electrical_credit: 25.0
    one_failure_electrical_credit: 12.5
  rule: 'An inspection that finds an electrical part installed in the repair not covered under a Collision Lifetime
    Workmanship Warranty or a Certified Structural Lifetime Warranty posts one electrical diagnostic charge for
    that concern, figured as set out below, and every other inspection stays free, whether it finds the concern
    covered or finds not covered a concern of a kind on which the plan charges no diagnostic fee. The electrical
    diagnostic charge is the plan''s standard diagnostic fee, charged in full once for the concern, in US dollars
    rounded to the cent. The electrical diagnostic fee follows the labor hours quoted on the customer-pay repair
    order the coverage was issued on: the heavy-repair hours or more, the heavy-repair electrical fee; the mid-repair
    hours or more but fewer than the heavy-repair hours, the mid-repair electrical fee; fewer than the mid-repair
    hours, or a coverage not issued on a customer-pay repair order, the plan''s standard diagnostic fee. The electrical
    sensor-network fee follows the calibration order opened for the customer-pay repair the coverage was issued
    on: a calibration completed with a dealer sublet invoice above zero, the dealer-sublet network fee; a calibration
    completed with no dealer sublet invoice, the in-house network fee; no calibration order for that repair, or
    one not completed, no electrical sensor-network fee. The electrical diagnostic fee is charged according to the
    number of not-covered findings the coverage''s inspections recorded on the date of its most recent not-covered
    finding: three or more, the electrical diagnostic fee is halved and rounded down to the whole dollar; exactly
    two, the electrical diagnostic fee is multiplied by the shared-visit share and rounded to the cent; one, the
    electrical diagnostic fee is charged in full. The electrical part-age credit follows the whole calendar months
    by which the coverage''s time in service, from the issued date to the charge date, exceeds the plan''s electrical
    parts months: at least one and at most the recent-part months, the recent-part credit; more than the recent-part
    months and at most the aging-part months, the aging-part credit; any other span, no electrical part-age credit.
    The electrical comeback credit follows the remedy attempts on the coverage completed with the concern not resolved,
    network reworks and outside-shop repairs alike: two or more, the two-failure electrical credit; exactly one,
    the one-failure electrical credit; none, no electrical comeback credit. The electrical diagnostic charge is
    the electrical diagnostic fee as charged plus the electrical sensor-network fee, less the electrical part-age
    credit and the electrical comeback credit, never below zero, rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: retail
    as: branch
    reads:
    - quoted_labor_hours
    note: The electrical diagnostic fee takes its tier from the labor hours quoted on the customer-pay repair order
      the coverage was issued on.
  - category: adas
    as: branch
    reads:
    - status
    - dealer_invoice_usd
    note: The electrical sensor-network fee takes its tier from the status and dealer sublet invoice of the calibration
      order opened for that repair.
  compute:
  - src_labor_hours: CFIELD('retail','quoted_labor_hours', retail_repair_id=F('retail_repair_id'))
  - electrical_fee: K('heavy_repair_electrical_fee') if (src_labor_hours != None and src_labor_hours >= K('heavy_repair_hours'))
      else (K('mid_repair_electrical_fee') if (src_labor_hours != None and src_labor_hours >= K('mid_repair_hours'))
      else P('diagnostic_fee_usd'))
  - src_cal_status: CFIELD('adas','status', retail_repair_id=F('retail_repair_id'))
  - src_cal_dealer: CFIELD('adas','dealer_invoice_usd', retail_repair_id=F('retail_repair_id'))
  - network_fee: K('dealer_sublet_network_fee') if (src_cal_status == 'completed' and src_cal_dealer > 0) else (K('in_house_network_fee')
      if (src_cal_status == 'completed' and src_cal_dealer == 0) else 0)
  - nc_date: LATEST('warranty_events','event_date', event_type='warranty_inspection', determination='not_covered')
  - visit_findings: COUNT('warranty_events', event_type='warranty_inspection', determination='not_covered', event_date=nc_date)
  - electrical_fee_charged: int(electrical_fee / 2) if visit_findings >= 3 else (RND(electrical_fee * K('shared_visit_share'),
      2) if visit_findings == 2 else electrical_fee)
  - months_past_parts: MONTHS(F('issued_date'), NOW) - P('electrical_parts_months')
  - part_age_credit: K('recent_part_credit') if (months_past_parts >= 1 and months_past_parts <= K('recent_part_months'))
      else (K('aging_part_credit') if (months_past_parts > K('recent_part_months') and months_past_parts <= K('aging_part_months'))
      else 0)
  - unresolved_reworks: COUNT('warranty_events', event_type='warranty_rework_complete', rework_result='not_resolved')
  - comeback_credit: K('two_failure_electrical_credit') if unresolved_reworks >= 2 else (K('one_failure_electrical_credit')
      if unresolved_reworks == 1 else 0)
  - result: RND(MX(0, electrical_fee_charged + network_fee - part_age_credit - comeback_credit), 2)
  compute_basis:
    src_labor_hours: The electrical diagnostic fee follows the labor hours quoted on the customer-pay repair order
      the coverage was issued on
    electrical_fee: the heavy-repair hours or more, the heavy-repair electrical fee; the mid-repair hours or more
      but fewer than the heavy-repair hours, the mid-repair electrical fee; fewer than the mid-repair hours, or
      a coverage not issued on a customer-pay repair order, the plan's standard diagnostic fee.
    src_cal_status: The electrical sensor-network fee follows the calibration order opened for the customer-pay
      repair the coverage was issued on
    src_cal_dealer: a calibration completed with a dealer sublet invoice above zero, the dealer-sublet network fee
    network_fee: a calibration completed with a dealer sublet invoice above zero, the dealer-sublet network fee;
      a calibration completed with no dealer sublet invoice, the in-house network fee; no calibration order for
      that repair, or one not completed, no electrical sensor-network fee.
    nc_date: on the date of its most recent not-covered finding
    visit_findings: the number of not-covered findings the coverage's inspections recorded on the date of its most
      recent not-covered finding
    electrical_fee_charged: 'The electrical diagnostic fee is charged according to the number of not-covered findings
      the coverage''s inspections recorded on the date of its most recent not-covered finding: three or more, the
      electrical diagnostic fee is halved and rounded down to the whole dollar; exactly two, the electrical diagnostic
      fee is multiplied by the shared-visit share and rounded to the cent; one, the electrical diagnostic fee is
      charged in full.'
    months_past_parts: the whole calendar months by which the coverage's time in service, from the issued date to
      the charge date, exceeds the plan's electrical parts months
    part_age_credit: at least one and at most the recent-part months, the recent-part credit; more than the recent-part
      months and at most the aging-part months, the aging-part credit; any other span, no electrical part-age credit.
    unresolved_reworks: The electrical comeback credit follows the remedy attempts on the coverage completed with
      the concern not resolved, network reworks and outside-shop repairs alike
    comeback_credit: two or more, the two-failure electrical credit; exactly one, the one-failure electrical credit;
      none, no electrical comeback credit.
    result: The electrical diagnostic charge is the electrical diagnostic fee as charged plus the electrical sensor-network
      fee, less the electrical part-age credit and the electrical comeback credit, never below zero, rounded to
      the cent.
  factors:
  - id: electrical_repair_size_fee
    effect: parameter
    decides: electrical_fee
    bindings:
    - src_labor_hours
    - electrical_fee
    ladder:
    - when: labor hours quoted on the source customer-pay repair order at or above the heavy-repair hours
      value: K('heavy_repair_electrical_fee')
    - when: at or above the mid-repair hours but below the heavy-repair hours
      value: K('mid_repair_electrical_fee')
    - when: otherwise (below the mid-repair hours, or no customer-pay source repair)
      value: P('diagnostic_fee_usd')
    baseline:
      electrical_fee: P('diagnostic_fee_usd')
    evidence:
    - cross_category
    cross_difficulty: null
  - id: electrical_sensor_network_fee
    effect: parameter
    decides: network_fee
    bindings:
    - src_cal_status
    - src_cal_dealer
    - network_fee
    ladder:
    - when: the source repair's calibration order is completed and carries a dealer sublet invoice above zero
      value: K('dealer_sublet_network_fee')
    - when: it is completed and carries no dealer sublet invoice
      value: K('in_house_network_fee')
    - when: otherwise (no calibration order for that repair, or not completed)
      value: '0'
    baseline:
      network_fee: '0'
    evidence:
    - cross_category
    cross_difficulty: adas
  - id: electrical_shared_visit_rate
    effect: method
    decides: electrical_fee_charged
    bindings:
    - nc_date
    - visit_findings
    - electrical_fee_charged
    ladder:
    - when: three or more not-covered findings recorded on the date of the most recent not-covered finding
      method: the electrical diagnostic fee is halved and rounded down to the whole dollar
    - when: exactly two such findings
      method: the electrical diagnostic fee is multiplied by the shared-visit share and rounded to the cent
    - when: otherwise (one finding)
      method: the electrical diagnostic fee is charged in full
    baseline:
      electrical_fee_charged: electrical_fee
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: electrical_part_age_credit
    effect: parameter
    decides: part_age_credit
    bindings:
    - months_past_parts
    - part_age_credit
    ladder:
    - when: time in service exceeds the electrical parts months by at least one and at most the recent-part months
      value: K('recent_part_credit')
    - when: by more than the recent-part months and at most the aging-part months
      value: K('aging_part_credit')
    - when: otherwise
      value: '0'
    baseline:
      part_age_credit: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: electrical_comeback_credit
    effect: parameter
    decides: comeback_credit
    bindings:
    - unresolved_reworks
    - comeback_credit
    ladder:
    - when: two or more remedy attempts on the coverage (network reworks or outside-shop repairs) completed with
        the concern not resolved
      value: K('two_failure_electrical_credit')
    - when: exactly one
      value: K('one_failure_electrical_credit')
    - when: otherwise (none)
      value: '0'
    baseline:
      comeback_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The electrical diagnostic charge is the plan's standard diagnostic fee, charged in full once for the concern,
      in US dollars rounded to the cent.
    params:
    - diagnostic_fee_usd
  inputs:
    history:
    - table: warranty_events
      aggregate: count
      field: determination
      filters:
        event_type: warranty_inspection
        determination: not_covered
    - table: warranty_events
      aggregate: count
      field: rework_result
      filters:
        event_type: warranty_rework_complete
        rework_result: not_resolved
    cross_category:
    - retail
    - adas
- id: warranty_ext_mechanical_diagnostic_charge
  base_policy_refs:
  - warranty_evt_diagnostic_fee
  overwrite:
  - base_policy: warranty_evt_diagnostic_fee
    superseded_clause: An inspection that finds a concern not covered posts a diagnostic charge of diagnostic_fee_usd
