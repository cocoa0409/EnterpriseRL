  rule: 'An inspection that finds a mechanical part installed in the repair not covered under a Collision Lifetime
    Workmanship Warranty or a Certified Structural Lifetime Warranty posts one mechanical diagnostic charge for
    that concern, figured as set out below, and every other inspection stays free, whether it finds the concern
    covered or finds not covered a concern of a kind on which the plan charges no diagnostic fee. The mechanical
    diagnostic charge is the plan''s standard diagnostic fee, charged in full once for the concern, in US dollars
    rounded to the cent. The mechanical road-test fee follows the miles driven from the odometer at issue to the
    odometer recorded at the coverage''s most recent concern report: at least the high-use multiple of the plan''s
    mechanical parts miles, the high-use mechanical fee; at least the plan''s mechanical parts miles but under the
    high-use multiple of them, the mid-use mechanical fee; under the plan''s mechanical parts miles, the plan''s
    standard diagnostic fee. The mechanical lift-access fee follows the customer-pay service the coverage was issued
    on: a Customer-Pay Collision Service or a Complete Refinish Service, the full-body lift fee; a Panel Repair
    Service or a Bumper Refinish Service, the panel lift fee; any other source work, no mechanical lift-access fee.
    The mechanical road-test fee is charged according to the remedy attempts completed on the coverage with the
    concern resolved, network reworks and outside-shop repairs alike: where one was completed less than the recent-visit
    months before the charge date, the mechanical road-test fee is halved and rounded down to the whole dollar;
    where none was completed less than the recent-visit months before but one was completed less than the return-visit
    months before, the mechanical road-test fee is multiplied by the return-visit share and rounded to the cent;
    otherwise the mechanical road-test fee is charged in full. The mechanical multi-service credit follows the customer''s
    payments, less than the multi-service window months before the charge date, on the customer''s network calibration
    orders and on the customer''s network rentals: at least one calibration payment and at least one rental payment,
    the two-service credit; at least one calibration payment and no rental payment, the calibration-only credit;
    any other combination, no mechanical multi-service credit. The mechanical diagnostic charge is the mechanical
    road-test fee as charged plus the mechanical lift-access fee, less the mechanical multi-service credit, never
    below zero, rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: retail
    as: branch
    reads:
    - variant_name
    note: The mechanical lift-access fee takes its tier from the customer-pay service the coverage was issued on.
  - category: adas
    as: history
    reads:
    - adas_ledger.event_type
    - adas_ledger.payer_kind
    - adas_ledger.entry_date
    note: The mechanical multi-service credit counts the customer's own payments on calibration orders.
  - category: rental
    as: history
    reads:
    - rental_ledger.event_type
    - rental_ledger.entry_date
    note: The mechanical multi-service credit counts the customer's payments on network rentals.
  compute:
  - report_odometer: LATEST('warranty_events','odometer_reported', event_type='warranty_concern_report')
  - miles_since_issue: report_odometer - F('odometer_at_issue')
  - road_test_fee: K('high_use_mechanical_fee') if miles_since_issue >= K('high_use_multiple') * P('mechanical_parts_miles')
      else (K('mid_use_mechanical_fee') if miles_since_issue >= P('mechanical_parts_miles') else P('diagnostic_fee_usd'))
  - src_service: CFIELD('retail','variant_name', retail_repair_id=F('retail_repair_id'))
  - lift_fee: K('full_body_lift_fee') if (src_service == 'Customer-Pay Collision Service' or src_service == 'Complete
      Refinish Service') else (K('panel_lift_fee') if (src_service == 'Panel Repair Service' or src_service == 'Bumper
      Refinish Service') else 0)
  - resolved_recent: COUNT('warranty_events', within_months=K('recent_visit_months'), event_type='warranty_rework_complete',
      rework_result='resolved')
  - resolved_return: COUNT('warranty_events', within_months=K('return_visit_months'), event_type='warranty_rework_complete',
      rework_result='resolved')
  - road_test_charged: int(road_test_fee / 2) if resolved_recent >= 1 else (RND(road_test_fee * K('return_visit_share'),
      2) if resolved_return >= 1 else road_test_fee)
  - calibration_payments: XCOUNT('adas','adas_ledger', within_months=K('multi_service_window_months'), date_field='entry_date',
      event_type='adas_payment', payer_kind='customer')
  - rental_payments: XCOUNT('rental','rental_ledger', within_months=K('multi_service_window_months'), date_field='entry_date',
      event_type='rental_customer_payment')
  - multi_service_credit: K('two_service_credit') if (calibration_payments >= 1 and rental_payments >= 1) else (K('calibration_only_credit')
      if (calibration_payments >= 1 and rental_payments == 0) else 0)
  - result: RND(MX(0, road_test_charged + lift_fee - multi_service_credit), 2)
  compute_basis:
    report_odometer: the odometer recorded at the coverage's most recent concern report
    miles_since_issue: The mechanical road-test fee follows the miles driven from the odometer at issue to the odometer
      recorded at the coverage's most recent concern report
    road_test_fee: at least the high-use multiple of the plan's mechanical parts miles, the high-use mechanical
      fee; at least the plan's mechanical parts miles but under the high-use multiple of them, the mid-use mechanical
      fee; under the plan's mechanical parts miles, the plan's standard diagnostic fee.
    src_service: The mechanical lift-access fee follows the customer-pay service the coverage was issued on
    lift_fee: a Customer-Pay Collision Service or a Complete Refinish Service, the full-body lift fee; a Panel Repair
      Service or a Bumper Refinish Service, the panel lift fee; any other source work, no mechanical lift-access
      fee.
    resolved_recent: where one was completed less than the recent-visit months before the charge date, the mechanical
      road-test fee is halved and rounded down to the whole dollar
    resolved_return: where none was completed less than the recent-visit months before but one was completed less
      than the return-visit months before, the mechanical road-test fee is multiplied by the return-visit share
      and rounded to the cent
    road_test_charged: 'The mechanical road-test fee is charged according to the remedy attempts completed on the
      coverage with the concern resolved, network reworks and outside-shop repairs alike: where one was completed
      less than the recent-visit months before the charge date, the mechanical road-test fee is halved and rounded
      down to the whole dollar; where none was completed less than the recent-visit months before but one was completed
      less than the return-visit months before, the mechanical road-test fee is multiplied by the return-visit share
      and rounded to the cent; otherwise the mechanical road-test fee is charged in full.'
    calibration_payments: The mechanical multi-service credit follows the customer's payments, less than the multi-service
      window months before the charge date, on the customer's network calibration orders
    rental_payments: and on the customer's network rentals
    multi_service_credit: at least one calibration payment and at least one rental payment, the two-service credit;
      at least one calibration payment and no rental payment, the calibration-only credit; any other combination,
      no mechanical multi-service credit.
    result: The mechanical diagnostic charge is the mechanical road-test fee as charged plus the mechanical lift-access
      fee, less the mechanical multi-service credit, never below zero, rounded to the cent.
  factors:
  - id: mechanical_road_test_fee
    effect: parameter
    decides: road_test_fee
    bindings:
    - report_odometer
    - miles_since_issue
    - road_test_fee
    ladder:
    - when: miles since issue at least the high-use multiple of the plan's mechanical parts miles
      value: K('high_use_mechanical_fee')
    - when: at least the plan's mechanical parts miles but under that multiple
      value: K('mid_use_mechanical_fee')
    - when: otherwise (under the plan's mechanical parts miles)
      value: P('diagnostic_fee_usd')
    baseline:
      road_test_fee: P('diagnostic_fee_usd')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: mechanical_lift_access_fee
    effect: parameter
    decides: lift_fee
    bindings:
    - src_service
    - lift_fee
    ladder:
    - when: the coverage was issued on a Customer-Pay Collision Service or a Complete Refinish Service
      value: K('full_body_lift_fee')
    - when: it was issued on a Panel Repair Service or a Bumper Refinish Service
      value: K('panel_lift_fee')
    - when: otherwise (any other source work)
      value: '0'
    baseline:
      lift_fee: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: mechanical_return_visit_rate
    effect: method
    decides: road_test_charged
    bindings:
    - resolved_recent
    - resolved_return
    - road_test_charged
    ladder:
    - when: a remedy attempt on the coverage (network rework or outside-shop repair) was completed resolved less
        than the recent-visit months before the charge date
      method: the mechanical road-test fee is halved and rounded down to the whole dollar
    - when: none that recent, but one less than the return-visit months before
      method: the mechanical road-test fee is multiplied by the return-visit share and rounded to the cent
    - when: otherwise
      method: the mechanical road-test fee is charged in full
    baseline:
      road_test_charged: road_test_fee
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: mechanical_multi_service_credit
    effect: parameter
    decides: multi_service_credit
    bindings:
    - calibration_payments
    - rental_payments
    - multi_service_credit
    ladder:
    - when: at least one customer payment on network calibration orders and at least one on network rentals within
        the window
      value: K('two_service_credit')
    - when: at least one calibration payment and no rental payment within the window
      value: K('calibration_only_credit')
    - when: otherwise
      value: '0'
    baseline:
      multi_service_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rental
  baseline:
    rule: The mechanical diagnostic charge is the plan's standard diagnostic fee, charged in full once for the concern,
      in US dollars rounded to the cent.
    params:
    - diagnostic_fee_usd
  inputs:
    history:
    - table: warranty_events
      aggregate: latest
      field: odometer_reported
      filters:
        event_type: warranty_concern_report
    - table: warranty_events
      aggregate: count
      field: rework_result
      within_months: 3
      filters:
        event_type: warranty_rework_complete
        rework_result: resolved
    - category: adas
      table: adas_ledger
      aggregate: count
      field: event_type
      within_months: 36
      filters:
        event_type: adas_payment
        payer_kind: customer
    - category: rental
      table: rental_ledger
      aggregate: count
      field: event_type
      within_months: 36
      filters:
        event_type: rental_customer_payment
    cross_category:
    - retail
    - adas
    - rental
- id: warranty_ext_rework_courtesy_rental
  base_policy_refs:
  - warranty_evt_rework
  overwrite:
  - base_policy: warranty_evt_rework
    superseded_clause: when the target exceeds courtesy_rental_min_rework_days the network pays a courtesy rental
      of up to courtesy_rental_days days
    replaced_by: When the plan's rework target business days exceed its courtesy rental minimum rework days, the
      network pays a courtesy rental for the number of rework courtesy rental days figured as set out below; otherwise
      it pays none.
  trigger: state_due
  subject:
  - warranty_rework_authorize
  computes: courtesy_rental_days
  target_tool: sign_rework_authorization_70486d76
  params:
    business_to_calendar_ratio: 1.4
    handover_days: 1
    two_failure_comeback_days: 2
    one_failure_comeback_days: 1
    repeat_paint_refinish_days: 2
    panel_blend_refinish_days: 1
    long_repair_days: 15
    medium_repair_days: 8
    long_repair_extra_days: 2
    medium_repair_extra_days: 1
    long_paid_rental_days: 10
    long_paid_rental_extra_days: 2
    short_paid_rental_extra_days: 1
  rule: 'A covered concern whose remedy is a network rework at a network center is recorded with the rework courtesy
    rental days the network pays for it. When the plan''s rework target business days exceed its courtesy rental
    minimum rework days, the network pays a courtesy rental for the number of rework courtesy rental days figured
    as set out below; otherwise it pays none. The rework courtesy rental days are the plan''s courtesy rental days,
    counted one rental day for each. The rework courtesy allowance is counted according to the customer-pay service
    the coverage was issued on: a Customer-Pay Collision Service or a Complete Refinish Service, the plan''s courtesy
    rental days are treated as business days and converted to calendar days by multiplying them by the business-to-calendar
    ratio and rounding up to a whole day; a Panel Repair Service or a Bumper Refinish Service, the plan''s courtesy
    rental days plus the handover days; any other source work, the plan''s courtesy rental days counted one for
    one. The rework comeback days follow the remedy attempts on the coverage completed with the concern not resolved,
    network reworks and outside-shop repairs alike: two or more, the two-failure comeback days; exactly one, the
    one-failure comeback days; none, no rework comeback days. The rework refinish days follow the concern being
    reworked, which is the concern of the coverage''s most recent inspection that found a concern covered, together
    with the paint concerns reported on the coverage: the concern being reworked is a paint defect or paint fade
    and the coverage carries another paint defect or paint fade concern, the repeat-paint refinish days; the concern
    being reworked is a panel fit concern and the coverage carries a paint defect or paint fade concern, the panel-blend
    refinish days; any other case, no rework refinish days. The rework source-repair days follow the calendar days
    from the drop-off date to the ready date of the customer-pay repair the coverage was issued on: the long-repair
    days or more, the long-repair extra days; the medium-repair days or more but fewer than the long-repair days,
    the medium-repair extra days; fewer than the medium-repair days, or no customer-pay source repair, no rework
    source-repair days. The rework paid-rental days follow the rental days the customer paid as uncovered days on
    the customer''s network rentals: the long paid-rental days or more, the long paid-rental extra days; at least
    one but fewer than the long paid-rental days, the short paid-rental extra days; none, no rework paid-rental
    days. The rework courtesy rental days are the rework courtesy allowance plus the rework comeback days, the rework
    refinish days, the rework source-repair days and the rework paid-rental days, a whole number of days.'
  prerequisite: []
  cross_category:
  - category: retail
    as: branch
    reads:
    - variant_name
    - repair_started_date
    - ready_date
    note: The rework courtesy allowance takes its counting method from the customer-pay service the coverage was
      issued on, and the source-repair days from that repair's drop-off and ready dates.
  - category: rental
    as: history
    reads:
    - rental_ledger.event_type
    - rental_ledger.charge_type
    - rental_ledger.days_count
    note: The rework paid-rental days take their tier from the uncovered rental days the customer paid on network
      rentals.
  compute:
  - src_service: CFIELD('retail','variant_name', retail_repair_id=F('retail_repair_id'))
  - courtesy_allowance: (int(P('courtesy_rental_days') * K('business_to_calendar_ratio')) + (1 if P('courtesy_rental_days')
      * K('business_to_calendar_ratio') > int(P('courtesy_rental_days') * K('business_to_calendar_ratio')) else
      0)) if (src_service == 'Customer-Pay Collision Service' or src_service == 'Complete Refinish Service') else
      (P('courtesy_rental_days') + K('handover_days') if (src_service == 'Panel Repair Service' or src_service ==
      'Bumper Refinish Service') else P('courtesy_rental_days'))
  - unresolved_reworks: COUNT('warranty_events', event_type='warranty_rework_complete', rework_result='not_resolved')
  - comeback_days: K('two_failure_comeback_days') if unresolved_reworks >= 2 else (K('one_failure_comeback_days')
      if unresolved_reworks == 1 else 0)
  - rework_concern: LATEST('warranty_events','concern_number', event_type='warranty_inspection', determination='covered')
  - rework_concern_type: LATEST('warranty_events','concern_type', event_type='warranty_concern_report', concern_number=rework_concern)
  - paint_concerns: COUNT('warranty_events', event_type='warranty_concern_report', concern_type='paint_defect')
      + COUNT('warranty_events', event_type='warranty_concern_report', concern_type='paint_fade')
  - refinish_days: K('repeat_paint_refinish_days') if ((rework_concern_type == 'paint_defect' or rework_concern_type
      == 'paint_fade') and paint_concerns >= 2) else (K('panel_blend_refinish_days') if (rework_concern_type ==
      'panel_fit' and paint_concerns >= 1) else 0)
  - src_started: CFIELD('retail','repair_started_date', retail_repair_id=F('retail_repair_id'))
  - src_ready: CFIELD('retail','ready_date', retail_repair_id=F('retail_repair_id'))
  - src_repair_days: DAYS(src_started, src_ready) if (src_started != None and src_ready != None) else 0
  - source_repair_days: K('long_repair_extra_days') if src_repair_days >= K('long_repair_days') else (K('medium_repair_extra_days')
      if src_repair_days >= K('medium_repair_days') else 0)
  - paid_rental_days: XSUM('rental','rental_ledger','days_count', event_type='rental_customer_charge', charge_type='uncovered_days')
  - rental_extra_days: K('long_paid_rental_extra_days') if paid_rental_days >= K('long_paid_rental_days') else (K('short_paid_rental_extra_days')
      if paid_rental_days >= 1 else 0)
  - courtesy_days_figured: int(courtesy_allowance + comeback_days + refinish_days + source_repair_days + rental_extra_days)
  - result: courtesy_days_figured if P('rework_target_business_days') > P('courtesy_rental_min_rework_days') else
      0
  compute_basis:
    src_service: The rework courtesy allowance is counted according to the customer-pay service the coverage was
      issued on
    courtesy_allowance: a Customer-Pay Collision Service or a Complete Refinish Service, the plan's courtesy rental
      days are treated as business days and converted to calendar days by multiplying them by the business-to-calendar
      ratio and rounding up to a whole day; a Panel Repair Service or a Bumper Refinish Service, the plan's courtesy
      rental days plus the handover days; any other source work, the plan's courtesy rental days counted one for
      one.
    unresolved_reworks: The rework comeback days follow the remedy attempts on the coverage completed with the concern
      not resolved, network reworks and outside-shop repairs alike
    comeback_days: two or more, the two-failure comeback days; exactly one, the one-failure comeback days; none,
      no rework comeback days.
    rework_concern: the concern being reworked, which is the concern of the coverage's most recent inspection that
      found a concern covered
    rework_concern_type: the concern being reworked is a paint defect or paint fade
    paint_concerns: together with the paint concerns reported on the coverage
    refinish_days: the concern being reworked is a paint defect or paint fade and the coverage carries another paint
      defect or paint fade concern, the repeat-paint refinish days; the concern being reworked is a panel fit concern
      and the coverage carries a paint defect or paint fade concern, the panel-blend refinish days; any other case,
      no rework refinish days.
    src_started: the calendar days from the drop-off date to the ready date of the customer-pay repair the coverage
      was issued on
    src_ready: the calendar days from the drop-off date to the ready date of the customer-pay repair the coverage
      was issued on
    src_repair_days: The rework source-repair days follow the calendar days from the drop-off date to the ready
      date of the customer-pay repair the coverage was issued on
    source_repair_days: the long-repair days or more, the long-repair extra days; the medium-repair days or more
      but fewer than the long-repair days, the medium-repair extra days; fewer than the medium-repair days, or no
      customer-pay source repair, no rework source-repair days.
    paid_rental_days: The rework paid-rental days follow the rental days the customer paid as uncovered days on
      the customer's network rentals
    rental_extra_days: the long paid-rental days or more, the long paid-rental extra days; at least one but fewer
      than the long paid-rental days, the short paid-rental extra days; none, no rework paid-rental days.
    courtesy_days_figured: The rework courtesy rental days are the rework courtesy allowance plus the rework comeback
      days, the rework refinish days, the rework source-repair days and the rework paid-rental days, a whole number
      of days.
    result: When the plan's rework target business days exceed its courtesy rental minimum rework days, the network
      pays a courtesy rental for the number of rework courtesy rental days figured as set out below; otherwise it
      pays none.
  factors:
  - id: rework_courtesy_allowance_count
    effect: method
    decides: courtesy_allowance
    bindings:
    - src_service
    - courtesy_allowance
    ladder:
    - when: the coverage was issued on a Customer-Pay Collision Service or a Complete Refinish Service
      method: the plan's courtesy rental days are treated as business days, multiplied by the business-to-calendar
        ratio and rounded up to a whole day
    - when: it was issued on a Panel Repair Service or a Bumper Refinish Service
      method: the plan's courtesy rental days plus the handover days
    - when: otherwise (any other source work)
      method: the plan's courtesy rental days counted one for one
    baseline:
      courtesy_allowance: P('courtesy_rental_days')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: null
  - id: rework_comeback_days
    effect: parameter
    decides: comeback_days
    bindings:
    - unresolved_reworks
    - comeback_days
    ladder:
    - when: two or more remedy attempts on the coverage (network reworks or outside-shop repairs) completed with
        the concern not resolved
      value: K('two_failure_comeback_days')
    - when: exactly one
      value: K('one_failure_comeback_days')
    - when: otherwise (none)
      value: '0'
    baseline:
      comeback_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rework_refinish_days
    effect: parameter
    decides: refinish_days
    bindings:
    - rework_concern
    - rework_concern_type
    - paint_concerns
    - refinish_days
    ladder:
    - when: the concern being reworked is a paint defect or paint fade and the coverage carries another paint concern
      value: K('repeat_paint_refinish_days')
    - when: the concern being reworked is a panel fit concern and the coverage carries a paint concern
      value: K('panel_blend_refinish_days')
    - when: otherwise
      value: '0'
    baseline:
      refinish_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rework_source_repair_days
    effect: parameter
    decides: source_repair_days
    bindings:
    - src_started
    - src_ready
    - src_repair_days
    - source_repair_days
    ladder:
    - when: the source customer-pay repair ran the long-repair days or more from drop-off to ready
      value: K('long_repair_extra_days')
    - when: it ran the medium-repair days or more but fewer than the long-repair days
      value: K('medium_repair_extra_days')
    - when: otherwise
      value: '0'
    baseline:
      source_repair_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: null
  - id: rework_paid_rental_days
    effect: parameter
    decides: rental_extra_days
    bindings:
    - paid_rental_days
    - rental_extra_days
    ladder:
    - when: the customer paid the long paid-rental days or more as uncovered days on network rentals
      value: K('long_paid_rental_extra_days')
    - when: at least one but fewer than the long paid-rental days
      value: K('short_paid_rental_extra_days')
    - when: otherwise (none)
      value: '0'
    baseline:
      rental_extra_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rental
  baseline:
    rule: The rework courtesy rental days are the plan's courtesy rental days, counted one rental day for each.
    params:
    - courtesy_rental_days
  inputs:
    history:
    - table: warranty_events
      aggregate: count
      field: rework_result
      filters:
        event_type: warranty_rework_complete
        rework_result: not_resolved
    - table: warranty_events
      aggregate: latest
      field: concern_number
      filters:
        event_type: warranty_inspection
        determination: covered
    - category: rental
      table: rental_ledger
      aggregate: sum
      field: days_count
      filters:
        event_type: rental_customer_charge
        charge_type: uncovered_days
    cross_category:
    - retail
    - rental
- id: warranty_ext_same_visit_courtesy
  base_policy_refs:
  - warranty_evt_diagnostic_fee
  overwrite: []
  trigger: state_due
  subject:
  - warranty_charge_waiver
  computes: amount_usd
  target_tool: book_same_visit_courtesy_9d7b5f0e
  params:
    standard_courtesy_share: 0.05
    single_finding_courtesy_share: 0.08
    multi_finding_courtesy_share: 0.12
    large_estimate_total: 8000
    mid_estimate_total: 4000
    large_estimate_allowance: 6.0
    mid_estimate_allowance: 3.0
    frequent_covered_findings: 3
    frequent_covered_allowance: 4.0
    repeat_covered_allowance: 2.0
    young_coverage_months: 24
    middle_coverage_months: 48
    young_coverage_allowance: 3.0
    middle_coverage_allowance: 1.5
    low_use_miles: 30000
    moderate_use_miles: 60000
    low_use_courtesy_allowance: 2.0
    moderate_use_courtesy_allowance: 1.0
    comeback_window_months: 12
    repeated_comeback_multiplier: 1.4
    single_comeback_multiplier: 1.15
  rule: 'A same-visit courtesy is owed on a collision or structural workmanship warranty when an inspection date
    on which the coverage''s inspections found an electrical or mechanical part not covered also brought a finding
    that a concern was covered, and that covered concern carries a network rework authorization; it is booked as
    a goodwill waiver against the larger of the parts diagnostic charges booked on the coverage less than one whole
    calendar month before, and it never exceeds the plan''s goodwill authority per charge. The same-visit courtesy
    is not worked out until the electrical diagnostic charge owed on every not-covered electrical-part finding of
    the visit stands on the coverage''s account. The same-visit courtesy is figured only after the mechanical diagnostic
    charge owed on every not-covered mechanical-part finding of the visit stands on the coverage''s account. The
    same-visit courtesy is booked only once the covered concern found at the visit carries its network rework authorization.
    The same-visit courtesy is the standard courtesy share of the parts diagnostic charges booked on the coverage
    less than one whole calendar month before, limited to the plan''s goodwill authority per charge and rounded
    to the cent. The same-visit courtesy share follows the covered findings recorded on the inspection date of the
    coverage''s most recent not-covered finding, together with the courtesy rental days authorized for the rework
    of the concern of the coverage''s most recent covered finding: two or more covered findings that day and courtesy
    rental days above zero on that rework, the multi-finding courtesy share; exactly one covered finding that day
    and courtesy rental days above zero on that rework, the single-finding courtesy share; any other case, the standard
    courtesy share. The same-visit estimate allowance follows the estimate total written on the estimate booking
    converted into the customer-pay repair the coverage was issued on: the large estimate total or more, the large-estimate
    allowance; the mid estimate total or more but under the large estimate total, the mid-estimate allowance; under
    the mid estimate total, or no such booking, no same-visit estimate allowance. The same-visit covered-history
    allowance follows all the inspections on the coverage that found a concern covered: the frequent covered-finding
    count or more, the frequent covered-history allowance; exactly two, the repeat covered-history allowance; fewer
    than two, no same-visit covered-history allowance. The same-visit coverage-age allowance follows the whole calendar
    months from the coverage''s issued date to the courtesy date: fewer than the young-coverage months, the young-coverage
    allowance; the young-coverage months or more but fewer than the middle-coverage months, the middle-coverage
    allowance; the middle-coverage months or more, no same-visit coverage-age allowance. The same-visit low-use
    allowance follows the miles driven from the odometer at issue to the odometer recorded at the coverage''s most
    recent concern report: fewer than the low-use miles, the low-use courtesy allowance; the low-use miles or more
    but fewer than the moderate-use miles, the moderate-use courtesy allowance; the moderate-use miles or more,
    no same-visit low-use allowance. The same-visit courtesy sum is the same-visit courtesy share applied to the
    parts diagnostic charges so booked, plus the same-visit estimate allowance, the same-visit covered-history allowance,
    the same-visit coverage-age allowance and the same-visit low-use allowance. The same-visit courtesy sum is then
    adjusted for the remedy attempts completed on the coverage less than the comeback-window months before the courtesy
    date, network reworks and outside-shop repairs alike and whatever their result: two or more, the same-visit
    courtesy sum is multiplied by the repeated-comeback multiplier and rounded up to the whole dollar; exactly one,
    it is multiplied by the single-comeback multiplier and rounded to the cent; none, it stays as figured. The same-visit
    courtesy is the adjusted same-visit courtesy sum limited to the plan''s goodwill authority per charge, rounded
    to the cent.'
  prerequisite:
  - problem: warranty_ext_electrical_diagnostic_charge
    kind: value_input
    gate: visit_charges
    form: state
    policy_source: The same-visit courtesy is not worked out until the electrical diagnostic charge owed on every
      not-covered electrical-part finding of the visit stands on the coverage's account.
    condition: Every electrical_part concern inspected not_covered on the visit date carries a warranty_charge entry
      on the coverage's money history, booked less than one whole calendar month before.
    resolved_by: accept_electrical_diagnostic_charge_607d2bcb
    effect: Once the electrical diagnostic charge is booked, visit_charges grows by its amount and the courtesy
      share acts on the larger total.
  - problem: warranty_ext_mechanical_diagnostic_charge
    kind: value_input
    gate: visit_charges
    form: state
    policy_source: The same-visit courtesy is figured only after the mechanical diagnostic charge owed on every
      not-covered mechanical-part finding of the visit stands on the coverage's account.
    condition: Every mechanical_part concern inspected not_covered on the visit date carries a warranty_charge entry
      on the coverage's money history, booked less than one whole calendar month before.
    resolved_by: accept_mechanical_diagnostic_charge_d69f0d58
    effect: Once the mechanical diagnostic charge is booked, visit_charges grows by its amount and the courtesy
      share acts on the larger total.
  - problem: warranty_ext_rework_courtesy_rental
    kind: value_input
    gate: courtesy_share
    form: state
    policy_source: The same-visit courtesy is booked only once the covered concern found at the visit carries its
      network rework authorization.
    condition: The concern of the covered inspection on the visit date carries a warranty_rework_authorize entry
      of kind network_rework.
    resolved_by: sign_rework_authorization_70486d76
    effect: Once the network rework authorization is recorded with its courtesy rental days, visit_rental_days rises
      above zero and the courtesy share moves from the standard share to the single-finding or multi-finding share.
  cross_category:
  - category: retail
    as: branch
    reads:
    - booking_id
    note: Locates the estimate booking converted into the customer-pay repair the coverage was issued on.
  - category: estimate
    as: branch
    reads:
    - estimate_total_usd
    note: The same-visit estimate allowance takes its tier from the estimate total written on that booking.
  compute:
  - visit_charges: SUM('warranty_ledger','amount_usd', within_months=1, date_field='entry_date', event_type='warranty_charge')
  - nc_date: LATEST('warranty_events','event_date', event_type='warranty_inspection', determination='not_covered')
  - visit_covered: COUNT('warranty_events', event_type='warranty_inspection', determination='covered', event_date=nc_date)
  - visit_concern: LATEST('warranty_events','concern_number', event_type='warranty_inspection', determination='covered')
  - visit_rental_days: SUM('warranty_events','courtesy_rental_days', event_type='warranty_rework_authorize', rework_kind='network_rework',
      concern_number=visit_concern)
  - courtesy_share: K('multi_finding_courtesy_share') if (visit_covered >= 2 and visit_rental_days > 0) else (K('single_finding_courtesy_share')
      if (visit_covered == 1 and visit_rental_days > 0) else K('standard_courtesy_share'))
  - src_booking: CFIELD('retail','booking_id', retail_repair_id=F('retail_repair_id'))
  - src_estimate_total: CFIELD('estimate','estimate_total_usd', booking_id=src_booking)
  - estimate_allowance: K('large_estimate_allowance') if (src_estimate_total != None and src_estimate_total >= K('large_estimate_total'))
      else (K('mid_estimate_allowance') if (src_estimate_total != None and src_estimate_total >= K('mid_estimate_total'))
      else 0)
  - covered_findings: COUNT('warranty_events', event_type='warranty_inspection', determination='covered')
  - covered_history_allowance: K('frequent_covered_allowance') if covered_findings >= K('frequent_covered_findings')
      else (K('repeat_covered_allowance') if covered_findings == 2 else 0)
  - coverage_months: MONTHS(F('issued_date'), NOW)
  - coverage_age_allowance: K('young_coverage_allowance') if coverage_months < K('young_coverage_months') else (K('middle_coverage_allowance')
      if coverage_months < K('middle_coverage_months') else 0)
  - report_odometer: LATEST('warranty_events','odometer_reported', event_type='warranty_concern_report')
  - miles_since_issue: report_odometer - F('odometer_at_issue')
  - low_use_allowance: K('low_use_courtesy_allowance') if miles_since_issue < K('low_use_miles') else (K('moderate_use_courtesy_allowance')
      if miles_since_issue < K('moderate_use_miles') else 0)
  - courtesy_sum: visit_charges * courtesy_share + estimate_allowance + covered_history_allowance + coverage_age_allowance
      + low_use_allowance
  - recent_reworks: COUNT('warranty_events', within_months=K('comeback_window_months'), event_type='warranty_rework_complete')
  - adjusted_courtesy: (int(courtesy_sum * K('repeated_comeback_multiplier')) + (1 if courtesy_sum * K('repeated_comeback_multiplier')
      > int(courtesy_sum * K('repeated_comeback_multiplier')) else 0)) if recent_reworks >= 2 else (RND(courtesy_sum
      * K('single_comeback_multiplier'), 2) if recent_reworks == 1 else courtesy_sum)
  - result: RND(MN(adjusted_courtesy, P('diagnostic_waiver_authority_usd')), 2)
  compute_basis:
    visit_charges: the parts diagnostic charges booked on the coverage less than one whole calendar month before
    nc_date: the inspection date of the coverage's most recent not-covered finding
    visit_covered: The same-visit courtesy share follows the covered findings recorded on the inspection date of
      the coverage's most recent not-covered finding
    visit_concern: the concern of the coverage's most recent covered finding
    visit_rental_days: together with the courtesy rental days authorized for the rework of the concern of the coverage's
      most recent covered finding
    courtesy_share: two or more covered findings that day and courtesy rental days above zero on that rework, the
      multi-finding courtesy share; exactly one covered finding that day and courtesy rental days above zero on
      that rework, the single-finding courtesy share; any other case, the standard courtesy share.
    src_booking: the estimate booking converted into the customer-pay repair the coverage was issued on
    src_estimate_total: The same-visit estimate allowance follows the estimate total written on the estimate booking
      converted into the customer-pay repair the coverage was issued on
    estimate_allowance: the large estimate total or more, the large-estimate allowance; the mid estimate total or
      more but under the large estimate total, the mid-estimate allowance; under the mid estimate total, or no such
      booking, no same-visit estimate allowance.
    covered_findings: The same-visit covered-history allowance follows all the inspections on the coverage that
      found a concern covered
    covered_history_allowance: the frequent covered-finding count or more, the frequent covered-history allowance;
      exactly two, the repeat covered-history allowance; fewer than two, no same-visit covered-history allowance.
    coverage_months: The same-visit coverage-age allowance follows the whole calendar months from the coverage's
      issued date to the courtesy date
    coverage_age_allowance: fewer than the young-coverage months, the young-coverage allowance; the young-coverage
      months or more but fewer than the middle-coverage months, the middle-coverage allowance; the middle-coverage
      months or more, no same-visit coverage-age allowance.
    report_odometer: the odometer recorded at the coverage's most recent concern report
    miles_since_issue: The same-visit low-use allowance follows the miles driven from the odometer at issue to the
      odometer recorded at the coverage's most recent concern report
    low_use_allowance: fewer than the low-use miles, the low-use courtesy allowance; the low-use miles or more but
      fewer than the moderate-use miles, the moderate-use courtesy allowance; the moderate-use miles or more, no
      same-visit low-use allowance.
    courtesy_sum: The same-visit courtesy sum is the same-visit courtesy share applied to the parts diagnostic charges
      so booked, plus the same-visit estimate allowance, the same-visit covered-history allowance, the same-visit
      coverage-age allowance and the same-visit low-use allowance.
    recent_reworks: The same-visit courtesy sum is then adjusted for the remedy attempts completed on the coverage
      less than the comeback-window months before the courtesy date, network reworks and outside-shop repairs alike
      and whatever their result
    adjusted_courtesy: two or more, the same-visit courtesy sum is multiplied by the repeated-comeback multiplier
      and rounded up to the whole dollar; exactly one, it is multiplied by the single-comeback multiplier and rounded
      to the cent; none, it stays as figured.
    result: The same-visit courtesy is the adjusted same-visit courtesy sum limited to the plan's goodwill authority
      per charge, rounded to the cent.
  factors:
  - id: same_visit_courtesy_share
    effect: parameter
    decides: courtesy_share
    bindings:
    - nc_date
    - visit_covered
    - visit_concern
    - visit_rental_days
    - courtesy_share
    ladder:
    - when: two or more covered findings on the visit's inspection date and courtesy rental days above zero on the
        covered concern's rework
      value: K('multi_finding_courtesy_share')
    - when: exactly one covered finding that day and courtesy rental days above zero on that rework
      value: K('single_finding_courtesy_share')
    - when: otherwise
      value: K('standard_courtesy_share')
    baseline:
      courtesy_share: K('standard_courtesy_share')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: same_visit_estimate_allowance
    effect: parameter
    decides: estimate_allowance
    bindings:
    - src_booking
    - src_estimate_total
    - estimate_allowance
    ladder:
    - when: the estimate total on the booking converted into the source customer-pay repair is the large estimate
        total or more
      value: K('large_estimate_allowance')
    - when: it is the mid estimate total or more but under the large estimate total
      value: K('mid_estimate_allowance')
    - when: otherwise (under the mid estimate total, or no such booking)
      value: '0'
    baseline:
      estimate_allowance: '0'
    evidence:
    - cross_category
    cross_difficulty: estimate
  - id: same_visit_covered_history_allowance
    effect: parameter
    decides: covered_history_allowance
    bindings:
    - covered_findings
    - covered_history_allowance
    ladder:
    - when: the frequent covered-finding count or more of covered inspections on the coverage
      value: K('frequent_covered_allowance')
    - when: exactly two
      value: K('repeat_covered_allowance')
    - when: otherwise (fewer than two)
      value: '0'
    baseline:
      covered_history_allowance: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: same_visit_coverage_age_allowance
    effect: parameter
    decides: coverage_age_allowance
    bindings:
    - coverage_months
    - coverage_age_allowance
    ladder:
    - when: fewer than the young-coverage months since the issued date
      value: K('young_coverage_allowance')
    - when: the young-coverage months or more but fewer than the middle-coverage months
      value: K('middle_coverage_allowance')
    - when: otherwise
      value: '0'
    baseline:
      coverage_age_allowance: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: same_visit_low_use_allowance
    effect: parameter
    decides: low_use_allowance
    bindings:
    - report_odometer
    - miles_since_issue
    - low_use_allowance
    ladder:
    - when: fewer than the low-use miles driven since issue
      value: K('low_use_courtesy_allowance')
    - when: the low-use miles or more but fewer than the moderate-use miles
      value: K('moderate_use_courtesy_allowance')
    - when: otherwise
      value: '0'
    baseline:
      low_use_allowance: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: same_visit_comeback_adjustment
    effect: method
    decides: adjusted_courtesy
    bindings:
    - recent_reworks
    - adjusted_courtesy
    ladder:
    - when: two or more remedy attempts (network reworks or outside-shop repairs) completed on the coverage within
        the comeback window
      method: the same-visit courtesy sum is multiplied by the repeated-comeback multiplier and rounded up to the
        whole dollar
    - when: exactly one
      method: the same-visit courtesy sum is multiplied by the single-comeback multiplier and rounded to the cent
    - when: otherwise (none)
      method: the same-visit courtesy sum stays as figured
    baseline:
      adjusted_courtesy: courtesy_sum
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The same-visit courtesy is the standard courtesy share of the parts diagnostic charges booked on the coverage
      less than one whole calendar month before, limited to the plan's goodwill authority per charge and rounded
      to the cent.
    params:
    - standard_courtesy_share
    - diagnostic_waiver_authority_usd
  inputs:
    history:
    - table: warranty_ledger
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        event_type: warranty_charge
    - table: warranty_events
      aggregate: count
      field: determination
      filters:
        event_type: warranty_inspection
        determination: covered
    - table: warranty_events
      aggregate: count
      field: rework_result
      within_months: 12
      filters:
        event_type: warranty_rework_complete
    cross_category:
    - retail
    - estimate
