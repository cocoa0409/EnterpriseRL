# Product and event policy charter: Workmanship Warranties (warranty).
category: warranty
display_name: Workmanship Warranties
binding:
  holding_table: warranty_coverages
  event_tables:
  - warranty_events
  - warranty_ledger
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - active
  - redeemed
  - expired
  - voided
  - ended_by_sale
  transitions:
  - from: active
    to: redeemed
    by: system
    means: A Chip Repair Guarantee's one-time credit is used toward a windshield replacement.
  - from: active
    to: expired
    by: system
    means: A fixed-term plan reaches the end of its term.
  - from: active
    to: voided
    by: agent
    means: 'A disqualifying event is recorded: the warrantied work was altered or re-repaired outside the network,
      or the vehicle was later declared a total loss.'
  - from: active
    to: ended_by_sale
    by: agent
    means: The owner on file no longer owns the vehicle, ending a coverage that runs only while the original customer
      owns it.
accounts:
- key: warranty_customer_charges
  unit: USD
  meaning: What a customer owes on a coverage for warranty inspections that found a concern not covered. Diagnostic
    charges post in; payments and waivers post out.
- key: sublet_reimbursement_due
  unit: USD
  meaning: What the network owes a customer for a pre-authorized warranty repair done at an outside shop. Approved
    reimbursements post in; reimbursement payments post out.
parameter_schema:
  lifetime_while_owned: Whether coverage lasts for as long as the customer on file owns the vehicle, without a fixed
    term (boolean).
  term_months: Fixed term in calendar months from the issued date (integer; 0 = lifetime while owned).
  term_anchor: 'Date the term counts from: issued_date (delivery or completion of the source work).'
  workmanship_covered: Whether defects in the network's workmanship on the source work are covered (boolean).
  paint_defects_covered: Whether peeling, delamination, cracking, blistering and loss of gloss of refinished areas
    are covered (boolean).
  paint_fade_covered: Whether fading of refinished areas beyond the adjacent original paint is covered (boolean).
  water_leak_wind_noise_covered: Whether water leaks and wind noise from the repaired or installed area are covered
    (boolean).
  stress_crack_covered: Whether a stress crack originating at the installed glass edge is covered (boolean).
  chip_spread_covered: Whether a repaired chip that spreads into a crack is covered (boolean).
  calibration_fault_covered: Whether a sensor found out of calibration without new damage is covered (boolean).
  calibration_miles_limit: Miles after the odometer at issue within which a calibration fault is covered (integer;
    0 = not applicable).
  mechanical_parts_months: Calendar months a mechanical part installed in the repair is covered (integer; 0 = not
    covered).
  mechanical_parts_miles: Miles after the odometer at issue within which an installed mechanical part is covered
    (integer; 0 = not covered).
  electrical_parts_months: Calendar months an electrical part or sensor installed in the repair is covered (integer;
    0 = not covered).
  panel_fit_covered: Whether panel gaps and flushness outside the manufacturer's specification on repaired panels
    are covered (boolean).
  outside_shop_preauthorization_required: Whether an outside-shop repair must be authorized by the network before
    the work is done to be reimbursed (boolean).
  structural_integrity_covered: Whether structural repairs that fail dimensional specification are covered (boolean).
  corrosion_covered: Whether corrosion originating in repaired or refinished areas is covered (boolean).
  excluded_causes: Causes that are never covered (list).
  concern_report_window_days: Calendar days after the customer discovered a concern within which it must be reported
    (integer).
  odometer_required_at_report: Whether the odometer reading must be given when the concern is reported (boolean).
  inspection_required: Whether a network inspection must determine coverage before any remedy (boolean).
  inspection_scheduling_business_days: Business days within which the inspection is offered after the report (integer;
    0 = no inspection).
  inspection_photo_count: Photos taken at the inspection (integer).
  rework_target_business_days: Target business days to complete a covered rework (integer; 0 = credit only).
  courtesy_rental_days: Courtesy rental days the network pays for a covered rework (integer).
  courtesy_rental_min_rework_days: Rework target days above which the courtesy rental is offered (integer).
  rework_courtesy_ride_miles: Distance within which a courtesy ride is offered for rework drop-off (miles).
  recalibration_on_rework: Whether sensors disturbed by a covered rework are recalibrated at no charge (boolean).
  max_rework_attempts_before_escalation: Covered reworks on one concern that ended not_resolved after which the
    concern goes to the regional warranty manager (integer; 0 = not applicable).
  rework_extends_term: Whether a rework starts a new term (boolean).
  chip_credit_toward_replacement: Whether the amount paid for the chip repair is credited toward a windshield replacement
    by the network when the chip spreads (boolean).
  diagnostic_fee_usd: Diagnostic charge when an inspection finds a concern of a fee-bearing type not covered (USD;
    0.00 = never charged).
  diagnostic_fee_concern_types: Concern types on which the diagnostic charge applies when not covered (list; empty
    = none).
  diagnostic_waiver_authority_usd: Most the desk may waive of a diagnostic charge as goodwill (USD).
  nationwide_service: Whether any network center honors the coverage (boolean).
  sublet_distance_miles: Distance from the nearest network center beyond which a pre-authorized repair at an outside
    shop is reimbursed (miles; 0 = never).
  sublet_reimbursement_cap_usd: Most reimbursed for one outside-shop warranty repair (USD).
  sublet_receipt_window_days: Calendar days after the outside repair within which the paid invoice must be submitted
    (integer; 0 = not applicable).
  reimbursement_payment_business_days: Business days to pay an approved reimbursement (integer).
  customer_supplied_parts_excluded: Whether parts the customer supplied are excluded from coverage (boolean).
  declined_calibration_excluded: Whether sensors whose calibration the customer declined are excluded from coverage
    (boolean).
  ends_on_sale: Whether coverage ends when the customer on file no longer owns the vehicle (boolean).
  void_on_outside_alteration: Whether coverage is voided when the warrantied work is altered or re-repaired outside
    the network (boolean).
  void_on_later_total_loss: Whether coverage is voided when the vehicle is later declared a total loss (boolean).
  structural_measurement_at_inspection: Whether a structural concern inspection includes an electronic measurement
    (boolean).
  max_coverages_per_source: Coverages one delivered or completed source job may carry (integer).
  certificate_delivery_channel: 'How the warranty certificate is delivered: email.'
