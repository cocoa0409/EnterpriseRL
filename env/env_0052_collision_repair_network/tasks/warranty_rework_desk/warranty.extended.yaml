  computes: amount_usd
  target_tool: accept_mechanical_diagnostic_charge_d69f0d58
  params:
    high_use_multiple: 2
    high_use_mechanical_fee: 109.95
    mid_use_mechanical_fee: 99.95
    full_body_lift_fee: 19.95
    panel_lift_fee: 9.95
