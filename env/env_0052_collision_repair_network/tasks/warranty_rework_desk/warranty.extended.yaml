        reimbursement_payment_business_days: =reimbursement_payment_business_days
      Calibration Workmanship Warranty:
        outside_shop_preauthorization_required: =outside_shop_preauthorization_required
        sublet_receipt_window_days: =sublet_receipt_window_days
        sublet_reimbursement_cap_usd: =sublet_reimbursement_cap_usd
        reimbursement_payment_business_days: =reimbursement_payment_business_days
      Cosmetic Repair Workmanship Warranty:
        outside_shop_preauthorization_required: =outside_shop_preauthorization_required
        sublet_receipt_window_days: =sublet_receipt_window_days
        sublet_reimbursement_cap_usd: =sublet_reimbursement_cap_usd
        reimbursement_payment_business_days: =reimbursement_payment_business_days
      Glass Installation Lifetime Warranty:
        outside_shop_preauthorization_required: =outside_shop_preauthorization_required
        sublet_receipt_window_days: =sublet_receipt_window_days
        sublet_reimbursement_cap_usd: =sublet_reimbursement_cap_usd
        reimbursement_payment_business_days: =reimbursement_payment_business_days
      Collision Lifetime Workmanship Warranty:
