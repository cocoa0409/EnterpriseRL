difficulties:
  - name: operating_line_servicing
    claim:
      categories: [operating]
      event_types: [operating_draw, operating_principal_payment, operating_interest_payment, operating_fee_payment, operating_interest_accrual, operating_fee_assessed, operating_fee_waiver, operating_bbc_submitted, operating_line_reinstate, operating_line_renew, operating_line_renew_matured, operating_commitment_increase, operating_commitment_decrease, operating_autodraft_change, operating_line_close]
    summary: >
      Producers and agribusiness members call about their operating credit across the crop year: taking an advance for
      inputs or cash rent, paying down principal after harvest, paying or disputing an interest bill or a late charge,
      renewing the line before or after it matures, raising or lowering the commitment, delivering a borrowing base
      certificate, or getting frozen advances reopened, and the setting differs by product (from the StartRight
      Operating Line to the Agribusiness Revolving Line), by line status (active, suspended, matured) and by what else the
      member holds — a seasonal loan alongside a revolving line, a Farm Real Estate loan that earns a relationship rate,
      a crop insurance policy whose assigned indemnity backs the growing crop. The records involved are the line itself,
      its transaction history of advances, interest bills with their due dates, payments, fees, waivers and returned
      payments, its borrowing base certificates and its service requests, together with read-only facts from the
      member's farm real estate and crop insurance records; the governing rules are state gates on which lines take
      advances, payments, certificates and commitment changes, time gates anchored on the advance cutoff date, the latest
      certificate's as-of date, the maturity date and each bill's due date, and per-product quantities such as the
      available-credit computation and channel limits of operating_advance_eligibility, the overadvance tolerance and fee
      of operating_overadvance, the actual/365 billing of operating_interest_accrual_billing, the late charge bounds and
      courtesy window of operating_evt_late_charge, the rate build-up of operating_rate_setting, the advance rates of
      operating_borrowing_base_calculation, the renewal window, review type and early-renewal waiver of
      operating_renewal, and the aggregate caps of operating_agg_portfolio_commitment. In the natural order of the
      business a line is booked before it is drawn, interest is billed before it is paid or charged late, a certificate
      precedes the advances it supports, and a renewal follows the term it extends. Advances, payments, certificates,
      fee waivers, reinstatement and registered requests are service actions the agent performs, while enrolling in or
      cancelling AutoDraft, confirming a line closure and authorising the debit of the member's own account are the
      member's own acts handed over to them. Credit decisions on applications, renewals and increases, an overadvance
      beyond tolerance, a disputed borrowing base valuation, a waiver the policy does not provide, or any request to change
      collateral or loan terms outside these rules are not decided by any policy, and the only correct route is a
      POLICY_NOT_COVERED handoff.

  - name: equipment_loan_servicing
    claim:
      categories: [equipment]
      event_types: [equipment_interest_payment, equipment_principal_payment, equipment_fee_payment, equipment_interest_accrual, equipment_fee_assessed, equipment_fee_waiver, equipment_deferral_grant, equipment_unit_released, equipment_unit_pledged, equipment_reamortize, equipment_autopay_change, equipment_insurance_update, equipment_loan_payoff]
    summary: >
      Farm and agribusiness members call about the installment loans on their trucks, combines, pivots and bins: making
      or catching up an installment, prepaying or paying off a unit, asking for a deferral in a hard year, selling or
      trading in a pledged unit, re-amortizing after a large paydown, updating insurance, or questioning a late charge or
      a returned-payment fee, and the setting varies with the product (dealer contract, used, new, irrigation, grain
      handling, truck and trailer), with the rate type and installment frequency, with loan status (active, deferred,
      nonaccrual) and with the state of the member's other equipment loans and operating line. The records involved are
      the loan, its installment bills, payments, fees, waivers and returns, the pledge and release record of each unit
      with serial numbers and pledged values, the service requests, and read-only facts from the member's operating
      lines; the rules are state gates on which loans take payments, releases, pledges and autopay changes, time gates
      anchored on installment due dates, the next due date and the last deferral date, and per-product quantities such as
      the late charge of equipment_evt_late_charge, the deferral limits and fee of equipment_deferral, the prepayment fee
      schedule and free allowance of equipment_prepayment, the release price, premium and loan-to-value limit of
      equipment_collateral_release, the replacement-value test of equipment_collateral_substitution, the rate sheet and
      discount stacking of equipment_rate_setting and the cross-collateral test of equipment_agg_cross_collateral. As
      background order, an installment is billed before it can be paid or charged late, a unit must be pledged before it
      can be released, and a deferral or release follows the loan's being current. Payments, deferrals, releases,
      substitutions, re-amortizations, fee waivers and insurance updates are service actions the agent performs, while
      authorising automatic debit and signing for the member's own units are the member's acts handed over to them.
      Credit decisions, a deferral or release the rules refuse, a dispute over a unit's value or condition, a total loss
      with an insurance dispute, an insurance lapse on a product without collateral protection, or any restructuring
      outside these rules is uncovered ground handled only by a POLICY_NOT_COVERED handoff.

  - name: farm_real_estate_servicing
    claim:
      categories: [farmland]
      event_types: [farmland_interest_payment, farmland_principal_payment, farmland_fee_payment, farmland_interest_accrual, farmland_fee_assessed, farmland_fee_waiver, farmland_rate_conversion, farmland_parcel_released, farmland_autopay_change, farmland_tax_verification, farmland_loan_payoff]
    summary: >
      Landowning members call about their farm mortgages: paying an annual or semiannual installment, prepaying after a
      good year, paying off when land is sold, releasing one parcel from the mortgage for a sale, a highway taking or a
      farmstead split, converting to a different rate product as an adjustable period nears its end, questioning a rate
      adjustment, a late charge, default interest or a protective tax advance, and the setting varies with the product
      (variable, 3-, 5- and 10-year adjustable, 15- and 25-year fixed), the position in the fixed period and loan year,
      loan status (active, nonaccrual), the parcels and their land use, and the member's other farm mortgages, operating
      line and Country Home loan. The records involved are the loan, its installment bills, payments, fees, protective
      advances and returns, the mortgage and release record of each parcel with parcel numbers, acres and appraised
      values, the service requests, and read-only facts from the member's operating and home loans; the rules are state
      gates on which loans take payments, conversions, releases and autopay changes, time gates anchored on installment
      due dates, the closing or last conversion date and the county tax delinquency date, and per-product quantities such
      as the prepayment fee schedule and free allowance of farmland_prepayment, the conversion targets, spacing and fee
      of farmland_rate_conversion_rule, the caps and margins of farmland_rate_adjustment_rule, the release price and
      loan-to-value limits of farmland_partial_release with the combined test of farmland_agg_combined_ltv, the late
      charge and default interest of farmland_evt_late_charge and farmland_installment_billing, and the discounts of
      farmland_rate_setting. In the ordinary course a parcel is mortgaged before it can be released, an installment is
      billed before it is paid or charged late, and a conversion or release is taken on a loan that is current. Payments,
      releases, conversions, fee waivers and tax verifications are service actions the agent performs, while authorising
      automatic debit and instructing a sale or split of the member's own land are acts of the member handed over to them.
      Credit decisions, an assumption by a buyer, a release the rules refuse, appraisal or survey disputes, foreclosure
      and restructuring matters, or a tax or flood-insurance dispute outside these rules have no policy and go to a
      POLICY_NOT_COVERED handoff.

  - name: country_home_loan_servicing
    claim:
      categories: [homeloan]
      event_types: [homeloan_interest_payment, homeloan_principal_payment, homeloan_escrow_deposit, homeloan_fee_payment, homeloan_interest_accrual, homeloan_fee_assessed, homeloan_fee_waiver, homeloan_escrow_waiver, homeloan_mi_cancellation, homeloan_recast, homeloan_forbearance_grant, homeloan_autopay_change, homeloan_insurance_update, homeloan_escrow_refund]
    summary: >
      Rural homeowners call about their Country Home mortgages: making a monthly payment or an extra principal payment,
      a late charge or returned payment, a new escrow payment after the annual analysis, a surplus refund or shortage,
      dropping escrow, cancelling private mortgage insurance, recasting after a lump sum, a hardship forbearance, a rate
      change on an adjustable loan, homeowner's insurance on record, or a payoff, and the setting varies by product (15-,
      20- and 30-year fixed, 5/6 and 7/6 adjustable, jumbo), by status (active, forbearance, nonaccrual), by loan-to-value
      against the original value, by flood zone and escrow election, by payment history and by whether the member also
      holds farm real estate or a construction loan. The records involved are the loan, its monthly bills, payments,
      fees, waivers and returns, the escrow account of deposits, disbursements and refunds, the service requests, and
      read-only facts from the member's farm real estate parcels and loans; the rules are state gates on which loans take
      payments, recasts and autopay changes and on the flood zone for escrow waivers, time gates anchored on each monthly
      due date, and per-product quantities such as the late charge of homeloan_evt_late_charge, the cushion, shortage
      spread and refund threshold of homeloan_escrow_analysis_rule, the waiver tests and fee of
      homeloan_escrow_waiver_rule, the request and automatic thresholds and payment-history look-backs of
      homeloan_mi_cancellation_rule, the recast threshold and fee of homeloan_recast_rule, the plan and lifetime limits of
      homeloan_forbearance_rule, the index, caps and margin of homeloan_arm_adjustment and the discounts of
      homeloan_rate_setting. In the natural order a monthly payment is billed before it is paid or charged late, escrow is
      analysed before its deposit changes, and a recast follows the curtailment it rests on. Payments, waivers, recasts,
      mortgage insurance cancellations, forbearance plans and insurance updates are service actions the agent performs,
      while authorising automatic debit and signing a written cancellation or hardship request are the member's own acts
      handed over to them. Credit decisions on new loans and refinances, modifications beyond forbearance, appraisal
      disputes, foreclosure, flood-zone determinations and lender-placed coverage disputes are not covered by any policy
      and call for a POLICY_NOT_COVERED handoff.

  - name: member_equity_patronage
    claim:
      categories: [equity]
      event_types: [equity_payment_preference, equity_patronage_cash_paid, equity_patronage_payout_void, equity_retirement_request, equity_retirement, equity_subscribe, equity_purchase, equity_dividend_reinvested]
    summary: >
      Members and former members call about their ownership in the cooperative: how much patronage they received and how
      it was figured, a patronage check that never arrived or was lost, switching to direct deposit or applying cash
      patronage to a loan, when borrower stock is refunded after a payoff, when an old allocation year will be revolved,
      an estate's request to retire a deceased member's equity, or buying, reinvesting and redeeming preferred stock, and
      the setting varies by equity class, by holding status, by patronage year and by the member's whole loan portfolio
      across operating, equipment, farm real estate, Country Home and construction lending. The records involved are the
      member's equity holdings, their transaction history of purchases, patronage allocations per loan with the eligible
      average daily balance and rate, cash declarations, payouts, voids, cleared checks, retirements and dividends, the
      equity requests, and read-only facts from every loan the member holds; the rules are a state gate on which holdings
      accept payment-preference changes, a business-day gate anchored on a check's issue date, a notice gate anchored on
      the redemption request date, and quantities such as the rates, split and minimum of equity_patronage_allocation, the
      payment dates, cutoff and minimum payout of equity_patronage_payout, the requirement formula of
      equity_stock_requirement, the open-loan test and processing window of equity_retirement_on_payoff, the declared
      programs of equity_revolvement, the estate discount of equity_estate_retirement and the purchase and redemption
      limits of equity_preferred_stock. As background order, patronage is declared before it is paid, a payout exists
      before it can be voided and a void before a reissue, and borrower equity follows the loans it supports. Voiding and
      reissuing a payout and booking an approved retirement are agent service actions, while changing where the
      member's own money goes (direct deposit, applying cash patronage to a loan, the dividend option), a written
      retirement or redemption request and a preferred stock purchase are the member's own acts handed over to them.
      Board decisions on patronage rates and
      revolvements, retirement outside the declared programs, tax-reporting disputes, unclaimed-property recovery,
      disputes over a cleared check and offsets against defaulted loans are decided by no servicing policy and require a
      POLICY_NOT_COVERED handoff.
