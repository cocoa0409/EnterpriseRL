name: env_0053_agricultural_lending_cooperative
company: Cottonwood Plains Farm Credit, ACA

background: |
  Cottonwood Plains Farm Credit, ACA is a member-owned agricultural credit association of the Farm Credit System, headquartered in Hastings, Nebraska, with seventeen branch offices across south-central Nebraska and north-central Kansas, a loan portfolio of about $4.3 billion and roughly 9,800 member-borrowers. It lends through two subsidiaries — a production credit association for short- and intermediate-term credit and a federal land credit association for real estate — and its servicing desk speaks in the plain, neighbourly tone of a cooperative whose borrowers are also its owners.
  Operating Lines of Credit are held for a crop or production year and renewed term by term: the StartRight Operating Line, ExpressLine Operating Credit, Seasonal Operating Loan, Revolving Operating Line, Borrowing Base Operating Line and Agribusiness Revolving Line, each booked as advances, interest bills, payments, fees and, for the larger lines, borrowing base certificates.
  Equipment & Vehicle Loans — the Truck & Trailer Loan, EquipDirect Dealer Contract, Used Equipment Loan, New Equipment Loan, Irrigation System Loan and Grain Storage & Handling Loan — are installment loans secured by the units financed, booked as installment bills, payments, fees and the pledge and release of each unit.
  Farm Real Estate Loans are first mortgages on cropland, pasture and farmsteads offered as the FarmLand Variable-Rate Mortgage, FarmLand 3-Year Adjustable Mortgage, FarmLand 5-Year Adjustable Mortgage, FarmLand 10-Year Adjustable Mortgage, FarmLand 15-Year Fixed Mortgage and FarmLand 25-Year Fixed Mortgage, booked as installments, rate adjustments and conversions, protective tax advances and the mortgaging and release of individual parcels.
  Rural Home Loans serve families who live in the country without necessarily farming: the Country Home 15-Year Fixed, Country Home 20-Year Fixed, Country Home 30-Year Fixed, Country Home 5/6 Adjustable, Country Home 7/6 Adjustable and Country Home Jumbo 30-Year Fixed carry monthly payments with an escrow account for taxes and insurance and, at higher loan-to-value, private mortgage insurance.
  Construction Loans — the Owner-Builder Home Construction Loan, Single-Close Home Construction Loan, Two-Close Home Construction Loan, Post-Frame Home Construction Loan, Farm Building Construction Loan and Livestock Facility Construction Loan — advance inspected draws with retainage and convert into a home or farm real estate loan when the building is finished.
  The association's licensed agency writes Crop Insurance with an approved insurance provider, from Catastrophic Risk Protection (CAT) through Revenue Protection 65% Coverage, Revenue Protection 70% Coverage, Revenue Protection 75% Coverage, Revenue Protection 80% Coverage and Revenue Protection 85% Coverage, one policy record per crop, county and crop year, booked as premium billings, payments, claims and indemnities that are often assigned to the association.
  Ownership runs through Member Equities & Patronage: every borrower holds a Class C Participation Certificate, Class A Nonvoting Common Stock or Class B Voting Stock, earnings return each year as patronage that is partly paid in cash and partly retained as Qualified Allocated Surplus and Nonqualified Allocated Surplus, and members may invest in Class H Preferred Stock.
  Most callers are farm and ranch families raising corn, soybeans, sorghum, wheat and cattle on irrigated and dryland ground, who typically hold an operating line, one or more equipment loans and a farm real estate mortgage together with their borrower stock and allocated surplus.
  A second large group are rural homeowners and acreage owners who hold a Country Home loan and a participation certificate, sometimes alongside a construction loan while a new house is being built.
  Agribusiness members — grain elevators, feed mills, input dealers and custom operators — hold the larger revolving lines and equipment fleets.
  Their records carry years of history: advances and paydowns that follow planting and harvest, installment bills paid on time or late, returned payments, renewals and deferrals, units traded in and parcels sold, rate conversions, escrow analyses, crop insurance claims, and the patronage allocations, cash payouts and revolvements of earlier years.
  Members call the servicing desk about advances and paydowns, what they owe and why, renewals, collateral they want to sell or replace, payment relief in a hard year, their escrow and mortgage insurance, and the patronage checks that arrive each March.

