# Policy charter: Construction Loans (Cottonwood Plains Farm Credit, ACA).
# Interest-only construction-period loans with inspected draws and retainage for country homes
# (owner-builder, single-close, two-close and post-frame) and for farm buildings and livestock
# facilities, converting on completion into a Country Home loan or a farm real estate loan.
category: construction
display_name: Construction Loans

binding:
  holding_table: construction_loans
  event_tables: [construction_transactions]
  intake_tables: [construction_draw_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {disbursed_principal: principal, accrued_interest: interest_accrued, fees_due: fees, retainage_held: retainage}

lifecycle:
  states: [applied, active, extended, converting, converted, paid_off, declined]
  transitions:
    - {from: applied, to: active, by: system, means: The construction loan closed, the builder's contract and plans were approved and construction may begin.}
    - {from: applied, to: declined, by: system, means: The credit decision is a decline.}
    - {from: active, to: extended, by: agent, means: An extension of the construction period requested by the member was granted.}
    - {from: active, to: converting, by: system, means: The final inspection found the project complete and conversion to permanent financing is being prepared.}
    - {from: extended, to: converting, by: system, means: The final inspection found the project complete during an extension.}
    - {from: converting, to: converted, by: system, means: The permanent loan was booked and the construction balance was paid from it.}
    - {from: active, to: paid_off, by: system, means: The construction balance was repaid from other funds.}
    - {from: extended, to: paid_off, by: system, means: The construction balance was repaid from other funds during an extension.}
    - {from: converting, to: paid_off, by: system, means: The member repaid at completion instead of converting.}

accounts:
  - key: principal
    unit: USD
    meaning: Construction principal owed — raised by draws and retainage disbursed, lowered by principal payments.
  - key: interest_accrued
    unit: USD
    meaning: Billed construction interest not yet paid — raised by monthly accruals, lowered by interest payments.
  - key: fees
    unit: USD
    meaning: Fees not yet collected — raised by assessments, lowered by payments and waivers.
  - key: retainage
    unit: USD
    meaning: Approved draw amounts withheld from the builder until completion — raised when withheld, lowered when released.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_commitment_usd: Smallest commitment, USD.
  max_commitment_usd: Largest commitment, USD.
  max_loan_to_cost_pct: Largest commitment as % of the approved project budget.
  max_loan_to_completed_value_pct: Largest commitment as % of the as-completed appraised value.
  construction_period_months: Months from closing to the construction end date.
  max_extensions: Most extensions of the construction period.
  extension_months: Months added by one extension.
  extension_fee_pct: Fee per extension, % of the commitment.
  extension_request_lead_days: Calendar days before the construction end date by which an extension request must be registered.
  interest_only: Boolean; whether only interest is due during construction.
  rate_spread_pct: Percentage points over the Association Variable Base Rate during construction.
  rate_floor_pct: Lowest construction-period rate, annual %.
  day_count_basis: Interest day-count convention.
  interest_billing: When construction interest is billed.
  interest_due_day: Day of the month construction interest is due, for the prior calendar month.
  interest_reserve_allowed: Boolean; whether construction interest may be paid from an interest reserve line of the budget.
  origination_fee_pct: Origination fee at closing, % of the commitment.
  origination_fee_min_usd: Minimum origination fee, USD.
  max_draws: Most draws over the construction period.
  min_draw_usd: Smallest draw, USD (except the final draw).
  inspection_fee_usd: Fee per draw inspection, USD.
  title_date_down_fee_usd: Title date-down endorsement fee per draw, USD.
  draw_processing_business_days: Business days from a complete draw request to funding.
  retainage_pct: Share of each approved draw withheld until completion, %.
  retainage_release_days: Calendar days after completion by which retainage is released, provided final lien waivers are received.
  lien_waiver_required: Boolean; whether lien waivers for work paid by the previous draw must be received before the next draw.
  owner_builder_allowed: Boolean; whether the member may act as their own general contractor.
  approved_builder_required: Boolean; whether the builder must be on the association's approved builder list.
  contingency_reserve_pct: Contingency line required in the budget, % of hard costs.
  change_order_max_pct: Cumulative change orders allowed without re-underwriting, % of the budget.
  overrun_equity_first: Boolean; whether a cost overrun must be paid from the member's own funds before further draws.
  builders_risk_insurance_required: Boolean; whether builder's risk insurance naming the association is required during construction.
  final_inspection_required: Boolean; whether a final inspection at 100% complete is required before conversion.
  certificate_of_occupancy_required: Boolean; whether a certificate of occupancy (or county equivalent) is required before conversion.
  permanent_product: Line the loan converts into.
  single_close: Boolean; whether the permanent loan terms are set at the construction closing (no second closing).
  permanent_rate_lock_months: Months the permanent rate quoted at the construction closing is held; 0 = set at conversion.
  conversion_fee_usd: Fee at conversion to permanent financing, USD.
  conversion_deadline_days: Calendar days after completion within which conversion or payoff must occur.
  late_charge_pct: Late charge on an interest bill unpaid after grace, % of the unpaid interest.
  late_charge_min_usd: Minimum late charge, USD.
  late_charge_max_usd: Maximum late charge, USD.
  late_charge_grace_days: Calendar days after the due date before a late charge arises.
  courtesy_waivers_per_12_months: Late charges waivable as a courtesy per loan per rolling 12 months.
  max_acres: Largest site financed with the building, acres.
  plan_review_fee_usd: Fee for review of plans and specifications at application, USD.
  stalled_project_days: Calendar days without a draw or inspection progress after which the project is referred to a loan officer as stalled.
  draw_payee_rule: Who draws are paid to.
  payment_application_order: Order in which an undesignated remittance is applied.

