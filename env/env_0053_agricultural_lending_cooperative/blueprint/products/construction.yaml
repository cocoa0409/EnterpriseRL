  - id: construction_agg_combined_commitment
    subject: [construction_loan_open, construction_loan_close]
    rule: >-
      Construction commitments are aggregated across the member's construction loans in applied, active, extended or
      converting status: their combined commitment, including the one applied for, may not exceed
      combined_commitment_cap_usd, and a home construction loan counts as the member's primary-residence Country Home loan
      for the occupancy rule of homeloan_agg_occupancy from the day it closes, so a member already holding a
      primary-residence Country Home loan builds a new primary residence only with a two-close loan whose permanent loan
      pays the old one off or re-certifies it as a second home. An application that would exceed the combined cap is not
      registered at the amount asked.
    eligibility: []
    params:
      combined_commitment_cap_usd: 6000000.00
