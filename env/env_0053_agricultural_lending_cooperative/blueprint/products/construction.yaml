# ---- data flow (every write is an event) ----
events:
  - type: construction_loan_open
    target: construction_loans
    mutation: create
    meaning: An application for a construction loan is registered with the plans, budget and builder.
    grain: One row per application.
    fields:
      construction_loan_id: Reference of the new loan.
      customer_id: Applying member.
      variant_name: Official product name.
      commitment_amount: Amount requested, USD.
      project_budget: Approved project cost, USD.
      contractor_name: Builder of record.
      permanent_product: Line of the permanent financing.
      applied_date: Date received.
    triggers: []
  - type: construction_loan_close
    target: construction_loans
    mutation: {transition: {from: applied, to: active}}
    meaning: The construction loan closes and construction may begin.
    grain: One per loan.
    fields:
      opened_date: Closing date.
      interest_rate: Construction rate.
      construction_end_date: Closing date plus construction_period_months.
    triggers:
      - event: construction:construction_fee_assessed
        map: {fee_code: origination, effective_date: opened_date, channel: system}
  - type: construction_loan_decline
    target: construction_loans
    mutation: {transition: {from: applied, to: declined}}
    meaning: The credit decision is a decline.
    grain: One per declined application.
    fields:
      closed_date: Decision date.
    triggers: []
  - type: construction_extension
    target: construction_loans
    mutation: {transition: {from: active, to: extended}}
    meaning: The construction period is extended at the member's request.
    grain: One per extension granted.
    fields:
      construction_end_date: Old end date plus extension_months.
      extension_count: Previous count plus 1.
    triggers:
      - event: construction:construction_fee_assessed
        map: {fee_code: extension, channel: system}
  - type: construction_completion
    target: construction_loans
    mutation: {transition: [{from: active, to: converting}, {from: extended, to: converting}]}
    meaning: The final inspection finds the project complete.
    grain: One per loan.
    fields:
      completed_date: Final inspection date.
    triggers: []
  - type: construction_conversion
    target: construction_loans
    mutation: {transition: {from: converting, to: converted}}
    meaning: The permanent loan is booked and repays the construction balance.
    grain: One per loan.
    fields:
      converted_loan_id: The permanent loan.
      permanent_product: Line of the permanent loan, as confirmed at conversion.
      closed_date: Conversion date.
    triggers:
      - event: homeloan:homeloan_loan_open
        when: {permanent_product: homeloan}
        map: {customer_id: customer_id}
      - event: farmland:farmland_loan_open
        when: {permanent_product: farmland}
        map: {customer_id: customer_id}
      - event: construction:construction_fee_assessed
        map: {fee_code: conversion, channel: system}
  - type: construction_payoff
    target: construction_loans
    mutation: {transition: [{from: active, to: paid_off}, {from: extended, to: paid_off}, {from: converting, to: paid_off}]}
    meaning: The construction balance is repaid from other funds.
    grain: One per loan.
    fields:
      closed_date: Payoff date.
    triggers: []
  - type: construction_draw_disbursed
    target: construction_transactions
    meaning: An approved draw is disbursed for work in place, net of retainage.
    grain: One row per draw.
    distinguish_by: [draw_number]
    fields:
      amount: Amount disbursed (approved draw less retainage), USD.
      effective_date: Funding date.
      draw_number: Draw sequence number.
      percent_complete: Cumulative percent complete per the inspection.
      payee_type: Who was paid.
    account: principal
    direction: in
    triggers:
      - event: construction:construction_retainage_withheld
        map: {draw_number: draw_number, effective_date: effective_date, source_ref_id: txn_id}
      - event: construction:construction_fee_assessed
        map: {fee_code: inspection, source_ref_id: txn_id, effective_date: effective_date, channel: system}
  - type: construction_retainage_withheld
    target: construction_transactions
    meaning: The retainage share of an approved draw is withheld from the builder.
    grain: One row per draw.
    distinguish_by: [draw_number]
    fields:
      amount: Retainage withheld, USD.
      effective_date: Funding date of the draw.
      draw_number: Draw sequence number.
      source_ref_id: The draw disbursement.
    account: retainage
    direction: in
    triggers: []
  - type: construction_retainage_released
    target: construction_transactions
    meaning: Retainage held is released after completion and final lien waivers.
    grain: One row per release.
    distinguish_by: [effective_date]
    fields:
      amount: Retainage released, USD.
      effective_date: Release date.
    account: retainage
    direction: out
    triggers:
      - event: construction:construction_retainage_disbursed
        map: {amount: amount, effective_date: effective_date, payee_type: contractor}
  - type: construction_retainage_disbursed
    target: construction_transactions
    meaning: Released retainage is paid to the builder and becomes principal.
    grain: One row per release.
    distinguish_by: [effective_date]
    fields:
      amount: Amount paid, USD.
      effective_date: Payment date.
      payee_type: Always contractor.
    account: principal
    direction: in
    triggers: []
  - type: construction_interest_accrual
    target: construction_transactions
    meaning: Interest for one calendar month of the construction period is billed.
    grain: One row per month.
    distinguish_by: [period_start, period_end]
    fields:
      amount: Interest, USD.
      period_start: First day of the month (or the closing date).
      period_end: Last day of the month (or the conversion or payoff date).
      due_date: Due date.
      rate_applied: Rate used.
      channel: Always system.
    account: interest_accrued
    direction: in
    triggers: []
  - type: construction_interest_payment
    target: construction_transactions
    meaning: A monthly interest bill is paid.
    grain: One row per bill per remittance.
    distinguish_by: [source_ref_id, effective_date, amount]
    fields:
      amount: Interest paid, USD.
      effective_date: Date received.
      channel: Channel.
      source_ref_id: The bill paid.
    account: interest_accrued
    direction: out
    triggers: []
  - type: construction_principal_payment
    target: construction_transactions
    meaning: Principal is repaid — from the permanent loan at conversion, from other funds, or as an overrun paydown.
    grain: One row per principal payment.
    distinguish_by: [effective_date, amount, channel]
    fields:
      amount: Principal repaid, USD.
      effective_date: Date received.
      channel: Channel.
    account: principal
    direction: out
    triggers: []
  - type: construction_fee_assessed
    target: construction_transactions
    meaning: A fee is assessed.
    grain: One row per fee occurrence.
    distinguish_by: [fee_code, effective_date, source_ref_id]
    fields:
      fee_code: Which fee.
      amount: Fee, USD.
      effective_date: Date assessed.
      source_ref_id: The draw or bill the fee arises from, else empty.
      channel: Always system.
    account: fees
    direction: in
    triggers: []
  - type: construction_fee_payment
    target: construction_transactions
    meaning: A fee is paid.
    grain: One row per assessment per remittance.
    distinguish_by: [source_ref_id, effective_date, amount]
    fields:
      fee_code: Code of the fee paid.
      amount: Amount applied, USD.
      effective_date: Date received.
      channel: Channel.
      source_ref_id: The assessment paid.
    account: fees
    direction: out
    triggers: []
  - type: construction_fee_waiver
    target: construction_transactions
    meaning: A fee is waived in whole.
    grain: One row per waived assessment.
    distinguish_by: [source_ref_id, waiver_basis]
    fields:
      fee_code: Code of the fee waived.
      amount: Unpaid amount waived, USD.
      effective_date: Date of the waiver.
      source_ref_id: The assessment waived.
      waiver_basis: courtesy or error_correction.
    account: fees
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: construction_msr_draws_taken
    window: All draws on the loan.
    measure: Count of construction_draw_disbursed rows.
  - id: construction_msr_approved_to_date
    window: All draws on the loan.
    measure: Sum of construction_draw_disbursed and construction_retainage_withheld amounts (the gross approved draws).
  - id: construction_msr_courtesy_waivers_12m
    window: Rolling 12 months ending on the date considered, from the same calendar date one year earlier (exclusive) through that date (inclusive).
    measure: Count of construction_fee_waiver rows with waiver_basis courtesy.
  - id: construction_msr_principal_day_sum
    window: The days of the month being billed.
    measure: Sum over each calendar day of the end-of-day disbursed principal.
  - id: construction_msr_bill_paid
    window: All rows on the loan.
    measure: For one interest bill, the sum of construction_interest_payment rows pointing to it.

# ---- policies ----
policies:
  - id: construction_agg_multi_holding
    subject: [construction_loan_open]
    rule: >-
      A member may hold at most max_per_customer construction loans in applied, active, extended or converting status at
      once, and at most one of them may be a home construction product (Owner-Builder, Single-Close, Two-Close or
      Post-Frame), because a member builds one residence at a time; the others may only be farm building or livestock
      facility loans. Commitments of all of them count toward the farm real estate and Country Home limits of the
      permanent products they convert into.
    eligibility:
      - id: one_home_build
        applies_to: [construction_loan_open]
        kind: dedup
        condition: "at most one of them may be a home construction product (Owner-Builder, Single-Close, Two-Close or Post-Frame)"
        evidence_fields: [construction_loans.customer_id, construction_loans.permanent_product, construction_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[construction_loans.customer_id]]
          action_bindings: {construction_loans.customer_id: customer_id}
        dedup_contract:
          table: construction_loans
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, extended, converting], permanent_product: [homeloan]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: construction_application_closing
    subject: [construction_loan_open, construction_loan_close, construction_loan_decline]
    rule: >-
      An application is registered with the plans, the approved budget, the builder and the permanent product, and is
      decided by a credit officer. The commitment must lie between min_commitment_usd and max_commitment_usd and may not
      exceed max_loan_to_cost_pct of the budget or max_loan_to_completed_value_pct of the as-completed value, whichever is
      lower. The budget must carry a contingency of at least contingency_reserve_pct of hard costs. The builder must be on
      the approved builder list where approved_builder_required is true; the member may be their own builder only where
      owner_builder_allowed is true. The site may not exceed max_acres. Closing requires builder's risk insurance naming
      the association and the borrower equity required under equity_stock_requirement; on closing the construction end
      date is set construction_period_months after the closing date and an origination fee of origination_fee_pct of the
      commitment, not less than origination_fee_min_usd, is assessed, together with plan_review_fee_usd charged at
      application.
    eligibility: []
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {min: "=min_commitment_usd", max: "=max_commitment_usd", ltc: "=max_loan_to_cost_pct", ltv: "=max_loan_to_completed_value_pct", months: "=construction_period_months", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", contingency: "=contingency_reserve_pct"}
        Single-Close Home Construction Loan: {min: "=min_commitment_usd", max: "=max_commitment_usd", ltc: "=max_loan_to_cost_pct", ltv: "=max_loan_to_completed_value_pct", months: "=construction_period_months", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", contingency: "=contingency_reserve_pct"}
        Two-Close Home Construction Loan: {min: "=min_commitment_usd", max: "=max_commitment_usd", ltc: "=max_loan_to_cost_pct", ltv: "=max_loan_to_completed_value_pct", months: "=construction_period_months", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", contingency: "=contingency_reserve_pct"}
        Post-Frame Home Construction Loan: {min: "=min_commitment_usd", max: "=max_commitment_usd", ltc: "=max_loan_to_cost_pct", ltv: "=max_loan_to_completed_value_pct", months: "=construction_period_months", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", contingency: "=contingency_reserve_pct"}
        Farm Building Construction Loan: {min: "=min_commitment_usd", max: "=max_commitment_usd", ltc: "=max_loan_to_cost_pct", ltv: "=max_loan_to_completed_value_pct", months: "=construction_period_months", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", contingency: "=contingency_reserve_pct"}
        Livestock Facility Construction Loan: {min: "=min_commitment_usd", max: "=max_commitment_usd", ltc: "=max_loan_to_cost_pct", ltv: "=max_loan_to_completed_value_pct", months: "=construction_period_months", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", contingency: "=contingency_reserve_pct"}
    formula:
      origination_fee: max(origination_fee_min_usd, round(commitment_amount * origination_fee_pct / 100, 2))

  - id: construction_rate_setting
    subject: [construction_loan_close, construction_extension]
    rule: >-
      The construction-period rate is the Association Variable Base Rate in effect on the closing date, as registered in
      operating_rate_setting, plus rate_spread_pct, rounded to 3 decimal places and not lower than rate_floor_pct; it
      moves with each later base-rate history date for loans in active, extended or converting status. An extension does
      not change the spread. For a single-close product the permanent rate quoted at closing is held for
      permanent_rate_lock_months; for the others the permanent rate is set at conversion under the permanent product's
      own charter.
    eligibility: []
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {spread: "=rate_spread_pct", floor: "=rate_floor_pct", lock: "=permanent_rate_lock_months", single_close: "=single_close"}
        Single-Close Home Construction Loan: {spread: "=rate_spread_pct", floor: "=rate_floor_pct", lock: "=permanent_rate_lock_months", single_close: "=single_close"}
        Two-Close Home Construction Loan: {spread: "=rate_spread_pct", floor: "=rate_floor_pct", lock: "=permanent_rate_lock_months", single_close: "=single_close"}
        Post-Frame Home Construction Loan: {spread: "=rate_spread_pct", floor: "=rate_floor_pct", lock: "=permanent_rate_lock_months", single_close: "=single_close"}
        Farm Building Construction Loan: {spread: "=rate_spread_pct", floor: "=rate_floor_pct", lock: "=permanent_rate_lock_months", single_close: "=single_close"}
        Livestock Facility Construction Loan: {spread: "=rate_spread_pct", floor: "=rate_floor_pct", lock: "=permanent_rate_lock_months", single_close: "=single_close"}

  - id: construction_draw_rule
    subject: [construction_draw_disbursed, construction_retainage_withheld, construction_fee_assessed]
    rule: >-
      A draw may be disbursed only while the loan is in active or extended status. Draws are requested on a draw request
      with its sequence number and amount; an inspector then certifies the cumulative percent complete. The gross amount
      approved for a draw is the lower of the amount requested and the cumulative percent complete times the commitment,
      less gross draws already approved (construction_msr_approved_to_date); retainage_pct of it is withheld as
      retainage and the rest is disbursed to the payee set by draw_payee_rule within draw_processing_business_days
      business days. A draw must be at least min_draw_usd except the final draw, no more than max_draws may be taken, and
      where lien_waiver_required is true a draw is not funded until lien waivers for the work paid by the previous draw
      are received. Each draw carries inspection_fee_usd and title_date_down_fee_usd. Change orders beyond
      change_order_max_pct of the budget are referred for re-underwriting, and where overrun_equity_first is true a cost
      overrun is paid from the member's own funds before any further draw.
    eligibility:
      - id: draw_open_loan
        applies_to: [construction_draw_disbursed, construction_retainage_withheld]
        kind: state
        condition: "A draw may be disbursed only while the loan is in active or extended status."
        evidence_fields: [construction_loans.status, construction_loans.construction_loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[construction_loans.construction_loan_id]]
          action_bindings: {construction_loans.construction_loan_id: construction_loan_id}
        state_contract:
          field: construction_loans.status
          allowed: [active, extended]
    measures: [construction_msr_draws_taken, construction_msr_approved_to_date]
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {max_draws: "=max_draws", min_draw: "=min_draw_usd", retainage: "=retainage_pct", inspection: "=inspection_fee_usd", date_down: "=title_date_down_fee_usd", days: "=draw_processing_business_days", waivers: "=lien_waiver_required", payee: "=draw_payee_rule", change_orders: "=change_order_max_pct", overrun: "=overrun_equity_first"}
        Single-Close Home Construction Loan: {max_draws: "=max_draws", min_draw: "=min_draw_usd", retainage: "=retainage_pct", inspection: "=inspection_fee_usd", date_down: "=title_date_down_fee_usd", days: "=draw_processing_business_days", waivers: "=lien_waiver_required", payee: "=draw_payee_rule", change_orders: "=change_order_max_pct", overrun: "=overrun_equity_first"}
        Two-Close Home Construction Loan: {max_draws: "=max_draws", min_draw: "=min_draw_usd", retainage: "=retainage_pct", inspection: "=inspection_fee_usd", date_down: "=title_date_down_fee_usd", days: "=draw_processing_business_days", waivers: "=lien_waiver_required", payee: "=draw_payee_rule", change_orders: "=change_order_max_pct", overrun: "=overrun_equity_first"}
        Post-Frame Home Construction Loan: {max_draws: "=max_draws", min_draw: "=min_draw_usd", retainage: "=retainage_pct", inspection: "=inspection_fee_usd", date_down: "=title_date_down_fee_usd", days: "=draw_processing_business_days", waivers: "=lien_waiver_required", payee: "=draw_payee_rule", change_orders: "=change_order_max_pct", overrun: "=overrun_equity_first"}
        Farm Building Construction Loan: {max_draws: "=max_draws", min_draw: "=min_draw_usd", retainage: "=retainage_pct", inspection: "=inspection_fee_usd", date_down: "=title_date_down_fee_usd", days: "=draw_processing_business_days", waivers: "=lien_waiver_required", payee: "=draw_payee_rule", change_orders: "=change_order_max_pct", overrun: "=overrun_equity_first"}
        Livestock Facility Construction Loan: {max_draws: "=max_draws", min_draw: "=min_draw_usd", retainage: "=retainage_pct", inspection: "=inspection_fee_usd", date_down: "=title_date_down_fee_usd", days: "=draw_processing_business_days", waivers: "=lien_waiver_required", payee: "=draw_payee_rule", change_orders: "=change_order_max_pct", overrun: "=overrun_equity_first"}
    formula:
      gross_approved: min(amount, percent_complete / 100 * commitment_amount - construction_msr_approved_to_date)
      retainage_amount: round(gross_approved * retainage_pct / 100, 2)

  - id: construction_retainage_release_rule
    subject: [construction_retainage_released, construction_retainage_disbursed]
    rule: >-
      Retainage is released in one amount equal to retainage_held after the final inspection finds the project complete
      and final lien waivers from the builder and every subcontractor and supplier are received, within
      retainage_release_days calendar days after the completed date; it is disbursed to the builder and becomes
      principal. Retainage is never released early in part, and is released before conversion so that the permanent loan
      repays the full construction balance.
    eligibility: []
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {days: "=retainage_release_days"}
        Single-Close Home Construction Loan: {days: "=retainage_release_days"}
        Two-Close Home Construction Loan: {days: "=retainage_release_days"}
        Post-Frame Home Construction Loan: {days: "=retainage_release_days"}
        Farm Building Construction Loan: {days: "=retainage_release_days"}
        Livestock Facility Construction Loan: {days: "=retainage_release_days"}

  - id: construction_interest_billing
    subject: [construction_interest_accrual, construction_interest_payment, construction_principal_payment, construction_fee_payment]
    rule: >-
      During construction only interest is due. Interest accrues daily on disbursed principal using actual_365
      (construction_msr_principal_day_sum) and is billed for each calendar month, due on interest_due_day of the next
      month; where interest_reserve_allowed is true and the budget carries an interest reserve, the bill is paid by a
      draw on that reserve line instead of by the member. Payments are applied in payment_application_order. Principal is
      repaid at conversion from the permanent loan, at payoff from other funds, or earlier as an overrun paydown, without
      penalty.
    eligibility: []
    measures: [construction_msr_principal_day_sum]
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {due_day: "=interest_due_day", reserve: "=interest_reserve_allowed", order: "=payment_application_order", interest_only: "=interest_only", basis: "=day_count_basis", billing: "=interest_billing"}
        Single-Close Home Construction Loan: {due_day: "=interest_due_day", reserve: "=interest_reserve_allowed", order: "=payment_application_order", interest_only: "=interest_only", basis: "=day_count_basis", billing: "=interest_billing"}
        Two-Close Home Construction Loan: {due_day: "=interest_due_day", reserve: "=interest_reserve_allowed", order: "=payment_application_order", interest_only: "=interest_only", basis: "=day_count_basis", billing: "=interest_billing"}
        Post-Frame Home Construction Loan: {due_day: "=interest_due_day", reserve: "=interest_reserve_allowed", order: "=payment_application_order", interest_only: "=interest_only", basis: "=day_count_basis", billing: "=interest_billing"}
        Farm Building Construction Loan: {due_day: "=interest_due_day", reserve: "=interest_reserve_allowed", order: "=payment_application_order", interest_only: "=interest_only", basis: "=day_count_basis", billing: "=interest_billing"}
        Livestock Facility Construction Loan: {due_day: "=interest_due_day", reserve: "=interest_reserve_allowed", order: "=payment_application_order", interest_only: "=interest_only", basis: "=day_count_basis", billing: "=interest_billing"}
    formula:
      amount: round(construction_msr_principal_day_sum * rate_applied / 100 / 365, 2)

  - id: construction_evt_late_charge
    subject: [construction_fee_assessed, construction_fee_waiver]
    rule: >-
      A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date of
      the interest bill, counted with the due date itself as day 0. It is late_charge_pct of the unpaid billed interest,
      between late_charge_min_usd and late_charge_max_usd, rounded to cents, once per bill, with source_ref_id the bill. A
      courtesy waiver is available on request once the bill is paid in full and construction_msr_courtesy_waivers_12m is
      below courtesy_waivers_per_12_months; an error_correction waiver applies when a timely payment is on record.
    eligibility:
      - id: construction_late_after_grace
        applies_to: [construction_fee_assessed]
        kind: time
        condition: "A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date of the interest bill"
        evidence_fields: [construction_transactions.due_date, construction_transactions.txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[construction_transactions.txn_id]]
          action_bindings: {construction_transactions.txn_id: source_ref_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the due date of the interest bill"
          anchor_source: construction_transactions.due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: "counted with the due date itself as day 0"
          boundary: exclusive
    measures: [construction_msr_bill_paid, construction_msr_courtesy_waivers_12m]
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Single-Close Home Construction Loan: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Two-Close Home Construction Loan: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Post-Frame Home Construction Loan: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Farm Building Construction Loan: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Livestock Facility Construction Loan: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
    formula:
      late_charge: min(late_charge_max_usd, max(late_charge_min_usd, round((amount - construction_msr_bill_paid) * late_charge_pct / 100, 2)))

  - id: construction_extension_rule
    subject: [construction_extension, construction_fee_assessed]
    rule: >-
      At the member's request the construction period may be extended by extension_months, up to max_extensions times. An
      extension request must be registered at least extension_request_lead_days calendar days before the construction end
      date, counted backwards from the end date with the end date as day 0. An extension requires that no interest bill
      is past due and that an inspection shows progress since the previous draw; it carries a fee of extension_fee_pct
      of the commitment, rounded to cents. A project with no draw or inspection progress for stalled_project_days, or one
      that cannot be completed within the last available extension, is referred to a loan officer.
    eligibility:
      - id: extension_lead_time
        applies_to: [construction_extension]
        kind: time
        condition: "An extension request must be registered at least extension_request_lead_days calendar days before the construction end date"
        evidence_fields: [construction_loans.construction_end_date, construction_loans.construction_loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[construction_loans.construction_loan_id]]
          action_bindings: {construction_loans.construction_loan_id: construction_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the construction end date"
          anchor_source: construction_loans.construction_end_date
          relation: not_after
          duration_source: variants.extension_request_lead_days
          unit: calendar_days
          counting_rule: "counted backwards from the end date with the end date as day 0"
          boundary: inclusive
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {max: "=max_extensions", months: "=extension_months", fee_pct: "=extension_fee_pct", lead: "=extension_request_lead_days", stalled: "=stalled_project_days"}
        Single-Close Home Construction Loan: {max: "=max_extensions", months: "=extension_months", fee_pct: "=extension_fee_pct", lead: "=extension_request_lead_days", stalled: "=stalled_project_days"}
        Two-Close Home Construction Loan: {max: "=max_extensions", months: "=extension_months", fee_pct: "=extension_fee_pct", lead: "=extension_request_lead_days", stalled: "=stalled_project_days"}
        Post-Frame Home Construction Loan: {max: "=max_extensions", months: "=extension_months", fee_pct: "=extension_fee_pct", lead: "=extension_request_lead_days", stalled: "=stalled_project_days"}
        Farm Building Construction Loan: {max: "=max_extensions", months: "=extension_months", fee_pct: "=extension_fee_pct", lead: "=extension_request_lead_days", stalled: "=stalled_project_days"}
        Livestock Facility Construction Loan: {max: "=max_extensions", months: "=extension_months", fee_pct: "=extension_fee_pct", lead: "=extension_request_lead_days", stalled: "=stalled_project_days"}
    formula:
      extension_fee: round(commitment_amount * extension_fee_pct / 100, 2)

  - id: construction_completion_conversion
    subject: [construction_completion, construction_conversion, construction_payoff, construction_fee_assessed]
    rule: >-
      The project is complete when the final inspection (where final_inspection_required is true) finds it 100% in place
      and, where certificate_of_occupancy_required is true, the county certificate of occupancy is received. Within
      conversion_deadline_days calendar days after the completed date the loan converts into the permanent_product — a
      Country Home loan or a farm real estate loan, opened through the trigger and booked under that line's own charter —
      or is paid off from other funds; a single-close product converts on the terms set at the construction closing,
      the others on the permanent product's terms at conversion. Conversion carries conversion_fee_usd. A loan neither
      converted nor paid off by the deadline is referred to a loan officer.
    eligibility: []
    params:
      per_tier:
        Owner-Builder Home Construction Loan: {product: "=permanent_product", deadline: "=conversion_deadline_days", fee: "=conversion_fee_usd", final_inspection: "=final_inspection_required", occupancy: "=certificate_of_occupancy_required", builders_risk: "=builders_risk_insurance_required", owner_builder: "=owner_builder_allowed", approved_builder: "=approved_builder_required", acres: "=max_acres", plan_fee: "=plan_review_fee_usd"}
        Single-Close Home Construction Loan: {product: "=permanent_product", deadline: "=conversion_deadline_days", fee: "=conversion_fee_usd", final_inspection: "=final_inspection_required", occupancy: "=certificate_of_occupancy_required", builders_risk: "=builders_risk_insurance_required", owner_builder: "=owner_builder_allowed", approved_builder: "=approved_builder_required", acres: "=max_acres", plan_fee: "=plan_review_fee_usd"}
        Two-Close Home Construction Loan: {product: "=permanent_product", deadline: "=conversion_deadline_days", fee: "=conversion_fee_usd", final_inspection: "=final_inspection_required", occupancy: "=certificate_of_occupancy_required", builders_risk: "=builders_risk_insurance_required", owner_builder: "=owner_builder_allowed", approved_builder: "=approved_builder_required", acres: "=max_acres", plan_fee: "=plan_review_fee_usd"}
        Post-Frame Home Construction Loan: {product: "=permanent_product", deadline: "=conversion_deadline_days", fee: "=conversion_fee_usd", final_inspection: "=final_inspection_required", occupancy: "=certificate_of_occupancy_required", builders_risk: "=builders_risk_insurance_required", owner_builder: "=owner_builder_allowed", approved_builder: "=approved_builder_required", acres: "=max_acres", plan_fee: "=plan_review_fee_usd"}
        Farm Building Construction Loan: {product: "=permanent_product", deadline: "=conversion_deadline_days", fee: "=conversion_fee_usd", final_inspection: "=final_inspection_required", occupancy: "=certificate_of_occupancy_required", builders_risk: "=builders_risk_insurance_required", owner_builder: "=owner_builder_allowed", approved_builder: "=approved_builder_required", acres: "=max_acres", plan_fee: "=plan_review_fee_usd"}
