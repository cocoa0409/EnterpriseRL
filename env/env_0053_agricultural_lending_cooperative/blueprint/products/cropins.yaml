# ---- data flow (every write is an event) ----
events:
  - type: cropins_policy_apply
    target: cropins_policies
    mutation: create
    meaning: An application for multi-peril crop insurance on one crop in one county for a crop year is signed.
    grain: One row per crop, county and crop year.
    fields:
      policy_id: Reference of the policy record.
      customer_id: Applicant member.
      variant_name: Plan and coverage level applied for.
      crop: Crop.
      county: County and state.
      crop_year: Crop year.
      practice: Practice.
      unit_structure: Unit structure elected.
      approved_yield_bu: APH yield.
      projected_price: Projected price for the crop year.
      beginning_farmer: Beginning farmer status certified.
      applied_date: Signature date.
    triggers: []
  - type: cropins_policy_accept
    target: cropins_policies
    mutation: {transition: {from: applied, to: active}}
    meaning: The insurance provider accepts the application.
    grain: One per policy record.
    fields:
      effective_date: Acceptance date.
      policy_number: Provider's policy number.
    triggers: []
  - type: cropins_policy_cancel
    target: cropins_policies
    mutation: {transition: [{from: applied, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The member withdraws the application or cancels the continuous policy in writing.
    grain: One per cancellation.
    fields:
      closed_date: Date the cancellation takes effect.
    triggers: []
  - type: cropins_policy_terminate
    target: cropins_policies
    mutation: {transition: {from: active, to: terminated}}
    meaning: The policy is terminated for unpaid premium on the termination date.
    grain: One per termination.
    fields:
      closed_date: Termination date.
    triggers: []
  - type: cropins_policy_expire
    target: cropins_policies
    mutation: {transition: {from: active, to: expired}}
    meaning: The insurance period ends with all claims finalized.
    grain: One per policy record.
    fields:
      closed_date: Expiry date.
    triggers: []
  - type: cropins_acreage_report
    target: cropins_policies
    mutation: update
    meaning: Planted acres are reported for the policy.
    grain: One per acreage report or revision.
    fields:
      insured_acres: Planted acres reported.
      practice: Practice reported.
    triggers: []
  - type: cropins_assignment_change
    target: cropins_policies
    mutation: update
    meaning: An assignment of indemnity to the association is filed or released.
    grain: One per assignment filed or released.
    fields:
      indemnity_assigned: New flag.
      assigned_loan_id: Operating line the indemnity is applied to, empty when released.
    triggers: []
  - type: cropins_harvest_price_release
    target: cropins_policies
    mutation: update
    meaning: RMA releases the harvest price for the crop year.
    grain: One per policy record.
    fields:
      harvest_price: Harvest price.
    triggers: []
  - type: cropins_premium_billed
    target: cropins_transactions
    meaning: Farmer-paid premium or the administrative fee is billed.
    grain: One row per billing type per policy record.
    distinguish_by: [billing_type, effective_date]
    fields:
      amount: Amount billed, USD.
      effective_date: Billing date.
      billing_type: premium or admin_fee.
      channel: Always system.
    account: premium
    direction: in
    triggers: []
  - type: cropins_premium_interest
    target: cropins_transactions
    meaning: Interest is charged on unpaid premium for a month or part of a month.
    grain: One row per month charged.
    distinguish_by: [effective_date]
    fields:
      amount: Interest, USD.
      effective_date: Last day of the month charged.
      billing_type: Always interest.
      channel: Always system.
    account: premium
    direction: in
    triggers: []
  - type: cropins_premium_payment
    target: cropins_transactions
    meaning: The member pays premium, fees or interest.
    grain: One row per payment.
    distinguish_by: [effective_date, amount, channel]
    fields:
      amount: Amount paid, USD.
      effective_date: Date received.
      channel: Channel.
    account: premium
    direction: out
    triggers: []
  - type: cropins_premium_offset
    target: cropins_transactions
    meaning: Unpaid premium, fees and interest are deducted from an indemnity.
    grain: One row per indemnity offset.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount offset, USD.
      effective_date: Indemnity payment date.
      claim_id: Claim the indemnity belongs to.
      source_ref_id: The indemnity determination offset against.
    account: premium
    direction: out
    triggers:
      - event: cropins:cropins_indemnity_withheld
        map: {amount: amount, effective_date: effective_date, claim_id: claim_id, source_ref_id: txn_id}
  - type: cropins_indemnity_determined
    target: cropins_transactions
    meaning: The indemnity on a finalized claim is determined.
    grain: One row per claim.
    distinguish_by: [claim_id]
    fields:
      amount: Gross indemnity, USD.
      effective_date: Date the claim was finalized.
      claim_id: The claim.
      channel: Always system.
    account: indemnity
    direction: in
    triggers: []
  - type: cropins_indemnity_withheld
    target: cropins_transactions
    meaning: The part of an indemnity used to pay unpaid premium is withheld from the payment.
    grain: One row per offset.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount withheld, USD.
      effective_date: Indemnity payment date.
      claim_id: Claim.
      source_ref_id: The premium offset row.
    account: indemnity
    direction: out
    triggers: []
  - type: cropins_indemnity_paid
    target: cropins_transactions
    meaning: The net indemnity is paid.
    grain: One row per claim payment.
    distinguish_by: [claim_id, effective_date]
    fields:
      amount: Net indemnity paid, USD.
      effective_date: Payment date.
      claim_id: Claim.
      payee: member or member_and_association.
    account: indemnity
    direction: out
    triggers:
      - event: operating:operating_principal_payment
        when: {payee: member_and_association}
        map: {amount: amount, effective_date: effective_date, channel: system}

# ---- derived measures ----
measures:
  - id: cropins_msr_liability
    window: The policy record.
    measure: approved_yield_bu times insured_acres times coverage_level_pct / 100 times projected_price times price_election_pct / 100, rounded to cents (the liability on which premium is rated).
  - id: cropins_msr_revenue_to_count
    window: The claim.
    measure: production_to_count_bu times the harvest price (the projected price under a yield-only plan), rounded to cents.
  - id: cropins_msr_unpaid_premium_days
    window: From the premium billing date to the date considered.
    measure: Calendar days the billed premium has remained unpaid.

# ---- policies ----
policies:
  - id: cropins_agg_multi_holding
    subject: [cropins_policy_apply]
    rule: >-
      A member may hold any number of policy records (max_per_customer null), one for each crop and county and crop year;
      how records of one member combine is set by cropins_agg_crop_county.
    eligibility: []
    params:
      max_per_customer: null

  - id: cropins_agg_crop_county
    subject: [cropins_policy_apply, cropins_acreage_report]
    rule: >-
      All of a member's acreage of one crop in one county for one crop year is insured under a single policy record, at
      one plan and coverage level; a second record for the same crop, county and crop year is never opened. Acreage of
      the same crop in another county is a separate record and may carry a different coverage level. Enterprise units
      combine all of the crop's acreage in the county and require planting in at least enterprise_unit_min_sections
      sections.
    eligibility:
      - id: one_record_per_crop_county_year
        applies_to: [cropins_policy_apply]
        kind: dedup
        condition: "a second record for the same crop, county and crop year is never opened"
        evidence_fields: [cropins_policies.customer_id, cropins_policies.crop, cropins_policies.county, cropins_policies.crop_year, cropins_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cropins_policies.customer_id, cropins_policies.crop, cropins_policies.county, cropins_policies.crop_year]]
          action_bindings: {cropins_policies.customer_id: customer_id, cropins_policies.crop: crop, cropins_policies.county: county, cropins_policies.crop_year: crop_year}
        dedup_contract:
          table: cropins_policies
          mode: separate_record
          object_bindings: {customer_id: customer_id, crop: crop, county: county, crop_year: crop_year}
          duplicate_filters: {status: [applied, active]}
          distinct_fields: []
    params:
      per_tier:
        Catastrophic Risk Protection (CAT): {units: "=unit_structures_allowed", sections: "=enterprise_unit_min_sections"}
        Revenue Protection 65% Coverage: {units: "=unit_structures_allowed", sections: "=enterprise_unit_min_sections"}
        Revenue Protection 70% Coverage: {units: "=unit_structures_allowed", sections: "=enterprise_unit_min_sections"}
        Revenue Protection 75% Coverage: {units: "=unit_structures_allowed", sections: "=enterprise_unit_min_sections"}
        Revenue Protection 80% Coverage: {units: "=unit_structures_allowed", sections: "=enterprise_unit_min_sections"}
        Revenue Protection 85% Coverage: {units: "=unit_structures_allowed", sections: "=enterprise_unit_min_sections"}

  - id: cropins_application_acceptance
    subject: [cropins_policy_apply, cropins_policy_accept, cropins_policy_cancel]
    rule: >-
      An application, or a change of plan or coverage level for the coming crop year, must be signed by the
      sales_closing_date of the crop year; a continuous policy renews each year at the same coverage unless the member
      changes it by the coverage_change_deadline or cancels it in writing by the cancellation_date, a cancellation
      received later taking effect for the following crop year. The provider accepts the application on its terms; the
      association's agency never binds coverage the provider has not accepted. A member made ineligible by a termination
      for indebtedness cannot apply until that debt is paid.
    eligibility: []
    params:
      per_tier:
        Catastrophic Risk Protection (CAT): {sales_closing: "=sales_closing_date", cancellation: "=cancellation_date", change_deadline: "=coverage_change_deadline", continuous: "=continuous_policy"}
        Revenue Protection 65% Coverage: {sales_closing: "=sales_closing_date", cancellation: "=cancellation_date", change_deadline: "=coverage_change_deadline", continuous: "=continuous_policy"}
        Revenue Protection 70% Coverage: {sales_closing: "=sales_closing_date", cancellation: "=cancellation_date", change_deadline: "=coverage_change_deadline", continuous: "=continuous_policy"}
        Revenue Protection 75% Coverage: {sales_closing: "=sales_closing_date", cancellation: "=cancellation_date", change_deadline: "=coverage_change_deadline", continuous: "=continuous_policy"}
        Revenue Protection 80% Coverage: {sales_closing: "=sales_closing_date", cancellation: "=cancellation_date", change_deadline: "=coverage_change_deadline", continuous: "=continuous_policy"}
        Revenue Protection 85% Coverage: {sales_closing: "=sales_closing_date", cancellation: "=cancellation_date", change_deadline: "=coverage_change_deadline", continuous: "=continuous_policy"}

  - id: cropins_premium_billing
    subject: [cropins_premium_billed, cropins_acreage_report]
    rule: >-
      Planted acres must be reported by the acreage_reporting_date; a late report lets the provider determine the acreage.
      Premium is billed on the premium_billing_date: the total premium is base_premium_rate_pct of the liability
      (cropins_msr_liability), and the farmer-paid premium is the total less the federal subsidy, which is
      premium_subsidy_enterprise_pct for enterprise units and premium_subsidy_basic_optional_pct otherwise, plus
      beginning_farmer_extra_subsidy_pct for a beginning farmer, rounded to cents. The administrative fee admin_fee_usd
      is billed per crop per county, except that a beginning farmer pays none where admin_fee_waived_beginning_farmer is
      true. Catastrophic coverage carries no farmer-paid premium, only the fee.
    eligibility: []
    measures: [cropins_msr_liability]
    params:
      per_tier:
        Catastrophic Risk Protection (CAT): {rate: "=base_premium_rate_pct", subsidy_bo: "=premium_subsidy_basic_optional_pct", subsidy_eu: "=premium_subsidy_enterprise_pct", bfr: "=beginning_farmer_extra_subsidy_pct", fee: "=admin_fee_usd", acreage_date: "=acreage_reporting_date", billing_date: "=premium_billing_date"}
        Revenue Protection 65% Coverage: {rate: "=base_premium_rate_pct", subsidy_bo: "=premium_subsidy_basic_optional_pct", subsidy_eu: "=premium_subsidy_enterprise_pct", bfr: "=beginning_farmer_extra_subsidy_pct", fee: "=admin_fee_usd", acreage_date: "=acreage_reporting_date", billing_date: "=premium_billing_date"}
        Revenue Protection 70% Coverage: {rate: "=base_premium_rate_pct", subsidy_bo: "=premium_subsidy_basic_optional_pct", subsidy_eu: "=premium_subsidy_enterprise_pct", bfr: "=beginning_farmer_extra_subsidy_pct", fee: "=admin_fee_usd", acreage_date: "=acreage_reporting_date", billing_date: "=premium_billing_date"}
        Revenue Protection 75% Coverage: {rate: "=base_premium_rate_pct", subsidy_bo: "=premium_subsidy_basic_optional_pct", subsidy_eu: "=premium_subsidy_enterprise_pct", bfr: "=beginning_farmer_extra_subsidy_pct", fee: "=admin_fee_usd", acreage_date: "=acreage_reporting_date", billing_date: "=premium_billing_date"}
        Revenue Protection 80% Coverage: {rate: "=base_premium_rate_pct", subsidy_bo: "=premium_subsidy_basic_optional_pct", subsidy_eu: "=premium_subsidy_enterprise_pct", bfr: "=beginning_farmer_extra_subsidy_pct", fee: "=admin_fee_usd", acreage_date: "=acreage_reporting_date", billing_date: "=premium_billing_date"}
        Revenue Protection 85% Coverage: {rate: "=base_premium_rate_pct", subsidy_bo: "=premium_subsidy_basic_optional_pct", subsidy_eu: "=premium_subsidy_enterprise_pct", bfr: "=beginning_farmer_extra_subsidy_pct", fee: "=admin_fee_usd", acreage_date: "=acreage_reporting_date", billing_date: "=premium_billing_date"}
    formula:
      total_premium: round(cropins_msr_liability * base_premium_rate_pct / 100, 2)

  - id: cropins_premium_interest_termination
    subject: [cropins_premium_interest, cropins_premium_payment, cropins_policy_terminate]
    rule: >-
      Premium and fees not paid within premium_interest_start_days calendar days after the billing date accrue simple
      interest of premium_interest_monthly_pct for each month or part of a month from the billing date, charged at each
      month end. Payments are applied to interest, then fees, then premium. A policy with any premium, fee or interest
      still unpaid on the termination_date of the year after the crop year is terminated for indebtedness and, where
      ineligibility_on_termination is true, the member is ineligible for all federal crop insurance until the debt is
      paid.
    eligibility: []
    measures: [cropins_msr_unpaid_premium_days]
    params:
      per_tier:
        Catastrophic Risk Protection (CAT): {start_days: "=premium_interest_start_days", monthly_pct: "=premium_interest_monthly_pct", termination: "=termination_date", ineligible: "=ineligibility_on_termination"}
        Revenue Protection 65% Coverage: {start_days: "=premium_interest_start_days", monthly_pct: "=premium_interest_monthly_pct", termination: "=termination_date", ineligible: "=ineligibility_on_termination"}
        Revenue Protection 70% Coverage: {start_days: "=premium_interest_start_days", monthly_pct: "=premium_interest_monthly_pct", termination: "=termination_date", ineligible: "=ineligibility_on_termination"}
        Revenue Protection 75% Coverage: {start_days: "=premium_interest_start_days", monthly_pct: "=premium_interest_monthly_pct", termination: "=termination_date", ineligible: "=ineligibility_on_termination"}
        Revenue Protection 80% Coverage: {start_days: "=premium_interest_start_days", monthly_pct: "=premium_interest_monthly_pct", termination: "=termination_date", ineligible: "=ineligibility_on_termination"}
        Revenue Protection 85% Coverage: {start_days: "=premium_interest_start_days", monthly_pct: "=premium_interest_monthly_pct", termination: "=termination_date", ineligible: "=ineligibility_on_termination"}

  - id: cropins_loss_claim
    subject: [cropins_indemnity_determined, cropins_policy_expire]
    rule: >-
      Notice of loss must be given within notice_of_loss_hours of discovering damage, and written notice no later than
      written_notice_days calendar days after the end_of_insurance_period; a notice is registered with the cause of loss
      and the discovery date, and an adjuster is assigned within adjuster_assignment_business_days business days.
      Damaged acreage must not be destroyed or replanted before the adjuster releases it. The indemnity is the guarantee
      less the revenue to count (cropins_msr_revenue_to_count), when positive. Under revenue protection the guarantee is
      approved_yield_bu times insured_acres times coverage_level_pct / 100 times the higher of the projected price and the
      harvest price, the harvest price capped at harvest_price_cap_pct of the projected price; under catastrophic
      coverage it is the approved yield times acres times coverage_level_pct / 100 times projected_price times
      price_election_pct / 100. Prevented planting pays prevented_planting_pct_by_crop of the guarantee and a replant
      pays replant_payment_bu_by_crop per replanted acre at the projected price when the replant threshold is met. A
      policy expires when the insurance period has ended and every claim on it is finalized or denied.
    eligibility: []
    measures: [cropins_msr_revenue_to_count]
    params:
      per_tier:
        Catastrophic Risk Protection (CAT): {coverage: "=coverage_level_pct", price_election: "=price_election_pct", revenue: "=revenue_protection", cap: "=harvest_price_cap_pct", notice_hours: "=notice_of_loss_hours", written_days: "=written_notice_days", period_end: "=end_of_insurance_period", pp: "=prevented_planting_pct_by_crop", replant: "=replant_payment_bu_by_crop", replant_threshold: "=replant_threshold_pct", adjuster_days: "=adjuster_assignment_business_days", final_planting: "=final_planting_date_by_crop", late_days: "=late_planting_period_days", late_reduction: "=late_planting_reduction_pct_per_day"}
        Revenue Protection 65% Coverage: {coverage: "=coverage_level_pct", price_election: "=price_election_pct", revenue: "=revenue_protection", cap: "=harvest_price_cap_pct", notice_hours: "=notice_of_loss_hours", written_days: "=written_notice_days", period_end: "=end_of_insurance_period", pp: "=prevented_planting_pct_by_crop", replant: "=replant_payment_bu_by_crop", replant_threshold: "=replant_threshold_pct", adjuster_days: "=adjuster_assignment_business_days", final_planting: "=final_planting_date_by_crop", late_days: "=late_planting_period_days", late_reduction: "=late_planting_reduction_pct_per_day"}
        Revenue Protection 70% Coverage: {coverage: "=coverage_level_pct", price_election: "=price_election_pct", revenue: "=revenue_protection", cap: "=harvest_price_cap_pct", notice_hours: "=notice_of_loss_hours", written_days: "=written_notice_days", period_end: "=end_of_insurance_period", pp: "=prevented_planting_pct_by_crop", replant: "=replant_payment_bu_by_crop", replant_threshold: "=replant_threshold_pct", adjuster_days: "=adjuster_assignment_business_days", final_planting: "=final_planting_date_by_crop", late_days: "=late_planting_period_days", late_reduction: "=late_planting_reduction_pct_per_day"}
        Revenue Protection 75% Coverage: {coverage: "=coverage_level_pct", price_election: "=price_election_pct", revenue: "=revenue_protection", cap: "=harvest_price_cap_pct", notice_hours: "=notice_of_loss_hours", written_days: "=written_notice_days", period_end: "=end_of_insurance_period", pp: "=prevented_planting_pct_by_crop", replant: "=replant_payment_bu_by_crop", replant_threshold: "=replant_threshold_pct", adjuster_days: "=adjuster_assignment_business_days", final_planting: "=final_planting_date_by_crop", late_days: "=late_planting_period_days", late_reduction: "=late_planting_reduction_pct_per_day"}
        Revenue Protection 80% Coverage: {coverage: "=coverage_level_pct", price_election: "=price_election_pct", revenue: "=revenue_protection", cap: "=harvest_price_cap_pct", notice_hours: "=notice_of_loss_hours", written_days: "=written_notice_days", period_end: "=end_of_insurance_period", pp: "=prevented_planting_pct_by_crop", replant: "=replant_payment_bu_by_crop", replant_threshold: "=replant_threshold_pct", adjuster_days: "=adjuster_assignment_business_days", final_planting: "=final_planting_date_by_crop", late_days: "=late_planting_period_days", late_reduction: "=late_planting_reduction_pct_per_day"}
        Revenue Protection 85% Coverage: {coverage: "=coverage_level_pct", price_election: "=price_election_pct", revenue: "=revenue_protection", cap: "=harvest_price_cap_pct", notice_hours: "=notice_of_loss_hours", written_days: "=written_notice_days", period_end: "=end_of_insurance_period", pp: "=prevented_planting_pct_by_crop", replant: "=replant_payment_bu_by_crop", replant_threshold: "=replant_threshold_pct", adjuster_days: "=adjuster_assignment_business_days", final_planting: "=final_planting_date_by_crop", late_days: "=late_planting_period_days", late_reduction: "=late_planting_reduction_pct_per_day"}

  - id: cropins_indemnity_payment
    subject: [cropins_indemnity_paid, cropins_premium_offset, cropins_indemnity_withheld, cropins_assignment_change]
    rule: >-
      An indemnity is paid within indemnity_payment_days calendar days after its claim is finalized. Unpaid premium,
      fees and interest on the policy are first deducted from it (a premium offset and the matching withholding), and the
      net amount is paid. When an assignment of indemnity to the association is on file, the indemnity is paid jointly to
      the member and the association and is applied as a principal payment to the assigned operating line through the
      trigger; otherwise it is paid to the member. An assignment is filed or released only with the member's own
      signature on the provider's assignment form, and a release requires the association's consent while the assigned
      line has an outstanding balance. An assignment received after a claim is paid does not redirect that payment.
    eligibility: []
    params:
      per_tier:
        Catastrophic Risk Protection (CAT): {days: "=indemnity_payment_days", offset: "=premium_offset_from_indemnity", assignment: "=assignment_of_indemnity_allowed", payee: "=indemnity_payee_rule_with_assignment", minimum: "=minimum_indemnity_payable_usd"}
        Revenue Protection 65% Coverage: {days: "=indemnity_payment_days", offset: "=premium_offset_from_indemnity", assignment: "=assignment_of_indemnity_allowed", payee: "=indemnity_payee_rule_with_assignment", minimum: "=minimum_indemnity_payable_usd"}
        Revenue Protection 70% Coverage: {days: "=indemnity_payment_days", offset: "=premium_offset_from_indemnity", assignment: "=assignment_of_indemnity_allowed", payee: "=indemnity_payee_rule_with_assignment", minimum: "=minimum_indemnity_payable_usd"}
        Revenue Protection 75% Coverage: {days: "=indemnity_payment_days", offset: "=premium_offset_from_indemnity", assignment: "=assignment_of_indemnity_allowed", payee: "=indemnity_payee_rule_with_assignment", minimum: "=minimum_indemnity_payable_usd"}
        Revenue Protection 80% Coverage: {days: "=indemnity_payment_days", offset: "=premium_offset_from_indemnity", assignment: "=assignment_of_indemnity_allowed", payee: "=indemnity_payee_rule_with_assignment", minimum: "=minimum_indemnity_payable_usd"}
        Revenue Protection 85% Coverage: {days: "=indemnity_payment_days", offset: "=premium_offset_from_indemnity", assignment: "=assignment_of_indemnity_allowed", payee: "=indemnity_payee_rule_with_assignment", minimum: "=minimum_indemnity_payable_usd"}

  - id: cropins_harvest_price
    subject: [cropins_harvest_price_release]
    rule: >-
      The projected price is set by projected_price_basis and the harvest price by harvest_price_basis, both released by
      RMA and recorded unchanged for every policy of the crop; neither is negotiated or estimated by the agency.
      Catastrophic coverage uses the projected price only. Yield substitution, trend adjustment, quality adjustment and
      the hail and fire exclusion apply only where the product's switch is true, and production records must be kept for
      claim_records_retention_years years.
    eligibility: []
    params:
      per_tier:
        Catastrophic Risk Protection (CAT): {projected: "=projected_price_basis", harvest: "=harvest_price_basis", ys: "=yield_substitution_allowed", ta: "=trend_adjustment_available", quality: "=quality_adjustment", hail: "=hail_fire_exclusion_available", retention: "=claim_records_retention_years", aph_years: "=min_aph_years", written_agreement: "=written_agreement_deadline", late_report: "=acreage_report_late_penalty", one_record: "=one_policy_per_crop_county", fee_waiver: "=admin_fee_waived_beginning_farmer"}
        Revenue Protection 65% Coverage: {projected: "=projected_price_basis", harvest: "=harvest_price_basis", ys: "=yield_substitution_allowed", ta: "=trend_adjustment_available", quality: "=quality_adjustment", hail: "=hail_fire_exclusion_available", retention: "=claim_records_retention_years", aph_years: "=min_aph_years", written_agreement: "=written_agreement_deadline", late_report: "=acreage_report_late_penalty", one_record: "=one_policy_per_crop_county", fee_waiver: "=admin_fee_waived_beginning_farmer"}
        Revenue Protection 70% Coverage: {projected: "=projected_price_basis", harvest: "=harvest_price_basis", ys: "=yield_substitution_allowed", ta: "=trend_adjustment_available", quality: "=quality_adjustment", hail: "=hail_fire_exclusion_available", retention: "=claim_records_retention_years", aph_years: "=min_aph_years", written_agreement: "=written_agreement_deadline", late_report: "=acreage_report_late_penalty", one_record: "=one_policy_per_crop_county", fee_waiver: "=admin_fee_waived_beginning_farmer"}
        Revenue Protection 75% Coverage: {projected: "=projected_price_basis", harvest: "=harvest_price_basis", ys: "=yield_substitution_allowed", ta: "=trend_adjustment_available", quality: "=quality_adjustment", hail: "=hail_fire_exclusion_available", retention: "=claim_records_retention_years", aph_years: "=min_aph_years", written_agreement: "=written_agreement_deadline", late_report: "=acreage_report_late_penalty", one_record: "=one_policy_per_crop_county", fee_waiver: "=admin_fee_waived_beginning_farmer"}
        Revenue Protection 80% Coverage: {projected: "=projected_price_basis", harvest: "=harvest_price_basis", ys: "=yield_substitution_allowed", ta: "=trend_adjustment_available", quality: "=quality_adjustment", hail: "=hail_fire_exclusion_available", retention: "=claim_records_retention_years", aph_years: "=min_aph_years", written_agreement: "=written_agreement_deadline", late_report: "=acreage_report_late_penalty", one_record: "=one_policy_per_crop_county", fee_waiver: "=admin_fee_waived_beginning_farmer"}
        Revenue Protection 85% Coverage: {projected: "=projected_price_basis", harvest: "=harvest_price_basis", ys: "=yield_substitution_allowed", ta: "=trend_adjustment_available", quality: "=quality_adjustment", hail: "=hail_fire_exclusion_available", retention: "=claim_records_retention_years", aph_years: "=min_aph_years", written_agreement: "=written_agreement_deadline", late_report: "=acreage_report_late_penalty", one_record: "=one_policy_per_crop_county", fee_waiver: "=admin_fee_waived_beginning_farmer"}
