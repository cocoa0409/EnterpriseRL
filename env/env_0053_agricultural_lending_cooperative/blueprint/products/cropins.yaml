# Policy charter: Crop Insurance (Cottonwood Plains Farm Credit, ACA — licensed crop insurance agency).
# Federally reinsured multi-peril crop insurance written by the association's agency with an approved
# insurance provider: Catastrophic Risk Protection and Revenue Protection at 65% to 85% coverage,
# one policy record per crop, county and crop year, with indemnities assignable to the association
# as operating-loan collateral.
category: cropins
display_name: Crop Insurance

binding:
  holding_table: cropins_policies
  event_tables: [cropins_transactions]
  intake_tables: [cropins_claims]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_due: premium, indemnity_payable: indemnity}

lifecycle:
  states: [applied, active, cancelled, terminated, expired]
  transitions:
    - {from: applied, to: active, by: system, means: The insurance provider accepted the application signed by the sales closing date.}
    - {from: applied, to: cancelled, by: user, means: The member withdrew the application before the sales closing date.}
    - {from: active, to: cancelled, by: user, means: The member cancelled the continuous policy in writing by the cancellation date, effective for the next crop year.}
    - {from: active, to: terminated, by: system, means: Premium remained unpaid on the termination date and the policy was terminated for indebtedness.}
    - {from: active, to: expired, by: system, means: The insurance period ended and every claim on the policy was finalized.}

accounts:
  - key: premium
    unit: USD
    meaning: Farmer-paid premium, administrative fees and interest owed — raised by billings and interest, lowered by payments and indemnity offsets.
  - key: indemnity
    unit: USD
    meaning: Indemnity determined and not yet paid — raised by indemnity determinations, lowered by payments and by amounts withheld to pay unpaid premium.

# ---- category-level parameter dictionary ----
parameter_schema:
  coverage_level_pct: Share of the approved yield (or revenue) guaranteed, %.
  price_election_pct: Share of the projected price used in the guarantee, %.
  revenue_protection: Boolean; whether the guarantee is revenue-based and rises with the harvest price.
  harvest_price_cap_pct: Harvest price used in the guarantee is capped at this % of the projected price; 0 = not applicable.
  premium_subsidy_basic_optional_pct: Federal premium subsidy for basic or optional units, % of total premium.
  premium_subsidy_enterprise_pct: Federal premium subsidy for enterprise units, % of total premium.
  beginning_farmer_extra_subsidy_pct: Additional subsidy percentage points for a beginning farmer or rancher.
  unit_structures_allowed: Unit structures that may be elected.
  base_premium_rate_pct: Total premium as % of liability for the county reference crop and practice (the rate table applied by the provider).
  admin_fee_usd: Administrative fee per crop per county, USD.
  admin_fee_waived_beginning_farmer: Boolean; whether a beginning farmer or rancher pays no administrative fee.
  sales_closing_date: Month-day by which an application or a change of coverage must be signed (spring crops; winter wheat uses its own fall date).
  cancellation_date: Month-day by which a written cancellation must be received to stop coverage for the next crop year.
  acreage_reporting_date: Month-day by which planted acres must be reported.
  premium_billing_date: Month-day on which premium and fees are billed.
  premium_interest_start_days: Calendar days after the billing date after which unpaid premium accrues interest.
  premium_interest_monthly_pct: Simple interest per month (or part of a month) on unpaid premium, %.
  termination_date: Month-day of the year after the crop year on which a policy with unpaid premium is terminated for indebtedness.
  final_planting_date_by_crop: Month-day of the final planting date by crop.
  late_planting_period_days: Days after the final planting date during which planting keeps reduced coverage; 0 = no late-planting coverage.
  late_planting_reduction_pct_per_day: Guarantee reduction per day planted after the final planting date, %.
  prevented_planting_pct_by_crop: Prevented-planting payment as % of the guarantee, by crop.
  replant_payment_bu_by_crop: Replant payment in bushels per acre replanted, by crop, valued at the projected price.
  replant_threshold_pct: Replant payments apply when at least this % of the unit (or 20 acres) must be replanted.
  notice_of_loss_hours: Hours after discovering damage within which notice of loss must be given.
  written_notice_days: Calendar days after the end of the insurance period, or after damage on harvested acreage, by which written notice must be given.
  end_of_insurance_period: Month-day the insurance period ends for spring crops.
  indemnity_payment_days: Calendar days after a claim is finalized by which the indemnity is paid.
  yield_substitution_allowed: Boolean; whether low yields in the APH may be replaced by 60% of the transitional yield.
  trend_adjustment_available: Boolean; whether the trend-adjusted APH endorsement may be elected.
  quality_adjustment: Boolean; whether quality-damaged production is adjusted under the quality loss provisions.
  assignment_of_indemnity_allowed: Boolean; whether the indemnity may be assigned to a lender.
  premium_offset_from_indemnity: Boolean; whether unpaid premium and fees are deducted from an indemnity before payment.
  continuous_policy: Boolean; whether the policy renews each year unless cancelled by the cancellation date.
  ineligibility_on_termination: Boolean; whether a policy terminated for indebtedness makes the member ineligible for federal crop insurance until the debt is paid.
  coverage_change_deadline: Month-day by which coverage level or plan may be changed for the coming crop year.
  projected_price_basis: How the projected price is set.
  harvest_price_basis: How the harvest price is set.
  adjuster_assignment_business_days: Business days after a notice of loss within which a loss adjuster is assigned.
  min_aph_years: Years of actual production history needed before transitional yields stop being used.
  enterprise_unit_min_sections: Sections in which the crop must be planted to qualify for enterprise units; 0 = not available.
  hail_fire_exclusion_available: Boolean; whether hail and fire may be excluded with a private hail policy in force.
  written_agreement_deadline: Month-day by which a written agreement request must be filed.
  claim_records_retention_years: Years production and claim records must be kept.
  indemnity_payee_rule_with_assignment: Payee of an indemnity when an assignment is on file.
  minimum_indemnity_payable_usd: Indemnities below this amount are not paid, USD.
  acreage_report_late_penalty: Treatment of a late acreage report.
  one_policy_per_crop_county: Boolean; whether a member holds one policy record per crop, county and crop year.

