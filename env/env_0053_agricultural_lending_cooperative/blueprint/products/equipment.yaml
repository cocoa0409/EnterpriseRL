# Policy charter: Equipment & Vehicle Loans (Cottonwood Plains Farm Credit, ACA — PCA subsidiary).
# Intermediate-term, simple-interest installment loans secured by the financed units: farm trucks and
# trailers, dealer point-of-sale contracts, used and new machinery, irrigation systems and grain
# storage and handling systems.
category: equipment
display_name: Equipment & Vehicle Loans

binding:
  holding_table: equipment_loans
  event_tables: [equipment_transactions, equipment_collateral]
  intake_tables: [equipment_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: principal, accrued_interest: interest_accrued, fees_due: fees, collateral_value: collateral_pledged}

lifecycle:
  states: [applied, active, deferred, nonaccrual, paid_off, declined]
  transitions:
    - {from: applied, to: active, by: system, means: The note and security agreement were signed, the lien was perfected and the loan was funded to the seller or dealer.}
    - {from: applied, to: declined, by: system, means: The credit decision on the application is a decline.}
    - {from: active, to: deferred, by: agent, means: A payment deferral requested by the member was granted; the deferred installment moves to the end of the schedule.}
    - {from: deferred, to: active, by: system, means: The installment following the deferred one has come due and the loan returns to its regular schedule.}
    - {from: active, to: nonaccrual, by: system, means: An installment stayed unpaid for the nonaccrual threshold and interest stopped being recognised as earned.}
    - {from: nonaccrual, to: active, by: system, means: All past-due installments were paid and the loan returned to accrual status.}
    - {from: active, to: paid_off, by: system, means: The final installment or a payoff brought principal, interest and fees to zero.}
    - {from: deferred, to: paid_off, by: system, means: A payoff during a deferral brought principal, interest and fees to zero.}
    - {from: nonaccrual, to: paid_off, by: system, means: A payoff of a nonaccrual loan brought principal, interest and fees to zero.}

accounts:
  - key: principal
    unit: USD
    meaning: Principal owed — raised by funding and by returned principal payments, lowered by principal payments.
  - key: interest_accrued
    unit: USD
    meaning: Billed interest not yet paid — raised by installment interest accruals and returned interest payments, lowered by interest payments.
  - key: fees
    unit: USD
    meaning: Fees and charges not yet collected — raised by assessments, lowered by fee payments and waivers.
  - key: collateral_pledged
    unit: USD
    meaning: Pledged value of the units securing the loan — raised by unit pledges, lowered by unit releases.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_loan_usd: Smallest original principal booked, USD.
  max_loan_usd: Largest original principal booked, USD.
  max_term_months: Longest term from funding to the final installment, months.
  max_advance_new_pct: Largest loan as % of purchase price for a new unit; 0 = new units not financed under this product.
  max_advance_used_pct: Largest loan as % of purchase price or appraised value for a pre-owned unit; 0 = pre-owned units not financed.
  max_unit_age_years: Oldest a financed unit may be at funding, in years from its model year; 0 = new units only.
  payment_frequencies_allowed: Installment frequencies the member may choose at funding.
  fixed_rate_sheet: 'Fixed contract rate by term band: the rate of the first band whose max_term_months is at least the loan term.'
  variable_rate_available: Boolean; whether a variable rate tied to the Association Variable Base Rate may be chosen.
  variable_rate_spread_pct: Percentage points over the Association Variable Base Rate for a variable-rate loan; 0 where variable is unavailable.
  rate_floor_pct: Lowest contract rate after discounts, annual %.
  autopay_rate_discount_pct: Discount for installments collected by automatic debit, percentage points.
  relationship_rate_discount_pct: Discount when the member holds an operating line in active status, percentage points.
  rate_discount_cap_pct: Most the autopay and relationship discounts may take off together, percentage points.
  day_count_basis: Interest day-count convention; actual_365 = principal x annual rate / 365 per calendar day.
  loan_fee_pct: Loan fee at funding, % of original principal.
  loan_fee_min_usd: Minimum loan fee, USD.
  loan_fee_max_usd: Maximum loan fee, USD.
  lien_filing_fee_usd: Lien perfection cost passed through per unit pledged (title lien notation for titled units, UCC or fixture filing otherwise), USD.
  first_installment_max_days: Most calendar days from funding to the first installment due date.
  payment_application_order: Order in which an undesignated remittance is applied.
  late_charge_pct: Late charge on an installment still not fully paid after the grace period, % of the unpaid installment.
  late_charge_min_usd: Minimum late charge per late installment, USD.
  late_charge_max_usd: Maximum late charge per late installment, USD.
  late_charge_grace_days: Calendar days after an installment's due date before a late charge arises.
  courtesy_waivers_per_12_months: Late charges that may be waived as a courtesy on one loan in any rolling 12 months.
  returned_payment_fee_usd: Fee per payment returned unpaid by the member's bank, USD.
  nonaccrual_past_due_days: Calendar days an installment may stay unpaid past its due date before the loan is placed in nonaccrual.
  deferral_available: Boolean; whether an installment may be deferred to the end of the schedule.
  max_deferrals_life: Most deferrals over the life of one loan.
  deferral_spacing_months: Calendar months that must pass after one deferral was granted before another may be granted.
  deferral_min_installments_paid: Installments that must have been paid in full since funding before a first deferral.
  deferral_request_lead_days: Calendar days before the due date of the installment to be deferred by which the deferral request must be registered.
  deferral_fee_usd: Fee per deferral granted, USD.
  prepayment_fee_schedule: 'Prepayment fee on fixed-rate loans at or above the prepayment threshold, by loan year (the year counted from the funding date): the fee_pct of the first entry whose loan_year_through is at least the current loan year; no fee after the last entry; empty = never.'
  prepayment_fee_threshold_usd: Original principal at or above which a fixed-rate loan carries the prepayment fee schedule; 0 = not applicable.
  free_prepayment_pct_per_loan_year: Voluntary prepayments up to this % of original principal per loan year carry no prepayment fee.
  reamortization_min_curtailment_usd: Smallest cumulative prepayment or release paydown since funding or the last re-amortization after which the member may ask to re-amortize; 0 = re-amortization not offered.
  reamortization_fee_usd: Fee per re-amortization, USD.
  partial_release_premium_pct: Release price of one unit of several, as % of that unit's share of principal (principal x unit pledged value / total pledged value).
  partial_release_fee_usd: Fee per unit released on sale while other units remain pledged, USD.
  max_ltv_after_release_pct: Largest principal after a release as % of the value still pledged.
  substitution_allowed: Boolean; whether a pledged unit may be replaced by another unit without paying the loan down.
  substitute_max_age_years: Oldest a replacement unit may be, in years from its model year; 0 = not applicable.
  substitution_min_value_pct: Replacement unit's value must be at least this % of the released unit's pledged value; any shortfall is paid down first.
  substitution_fee_usd: Fee per substitution, USD.
  insurance_lapse_cure_days: Calendar days after the insurance expiry date on record by which renewed proof of insurance must be received.
  collateral_protection_available: Boolean; whether the association places collateral protection insurance when proof is not received in time.
  collateral_protection_annual_pct: Annual premium of collateral protection insurance, % of principal at placement.
  lien_release_business_days: Business days after payoff or release by which the title lien is released or the termination or fixture release is filed.
  payoff_quote_valid_days: Calendar days a payoff quote remains good, the quote date being day 0.
  autopay_available: Boolean; whether installments can be collected by automatic debit.

