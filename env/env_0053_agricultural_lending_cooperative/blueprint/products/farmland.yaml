# Policy charter: Farm Real Estate Loans (Cottonwood Plains Farm Credit, ACA — FLCA subsidiary).
# Long-term amortizing first-mortgage loans on cropland, pasture, recreational land and farmsteads,
# offered as a variable-rate mortgage, three adjustable products with 3-, 5- and 10-year fixed
# periods, and two fully fixed products.
category: farmland
display_name: Farm Real Estate Loans

binding:
  holding_table: farmland_loans
  event_tables: [farmland_transactions, farmland_parcels]
  intake_tables: [farmland_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: principal, accrued_interest: interest_accrued, fees_due: fees, collateral_value: collateral_mortgaged}

lifecycle:
  states: [applied, active, nonaccrual, paid_off, declined]
  transitions:
    - {from: applied, to: active, by: system, means: The loan closed — note and mortgage signed and recorded, title insured — and was funded.}
    - {from: applied, to: declined, by: system, means: The credit decision on the application is a decline.}
    - {from: active, to: nonaccrual, by: system, means: An installment stayed unpaid for the nonaccrual threshold.}
    - {from: nonaccrual, to: active, by: system, means: All past-due installments were paid and the loan returned to accrual.}
    - {from: active, to: paid_off, by: system, means: The final installment or a payoff brought principal, interest and fees to zero.}
    - {from: nonaccrual, to: paid_off, by: system, means: A payoff of a nonaccrual loan brought principal, interest and fees to zero.}

accounts:
  - key: principal
    unit: USD
    meaning: Principal owed — raised by closing funds, protective advances and returned principal payments; lowered by principal payments.
  - key: interest_accrued
    unit: USD
    meaning: Billed interest not yet paid — raised by installment accruals and returned interest payments; lowered by interest payments.
  - key: fees
    unit: USD
    meaning: Fees not yet collected — raised by assessments; lowered by fee payments and waivers.
  - key: collateral_mortgaged
    unit: USD
    meaning: Appraised value of the parcels mortgaged to the loan — raised by parcels mortgaged, lowered by parcels released.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_loan_usd: Smallest original principal, USD.
  max_loan_usd: Largest original principal, USD.
  max_ltv_by_land_use: Largest principal as % of appraised value, by the land_use of the parcels mortgaged; a loan on mixed parcels uses the value-weighted average of the parcel limits.
  max_amortization_years: Longest amortization from closing to maturity, years.
  rate_fixed_period_months: Months the closing (or conversion) rate stays fixed before the first adjustment; 0 = variable throughout; equal to the amortization for fully fixed products.
  initial_rate_pct: Contract rate before discounts for a loan closed or converted under the current rate sheet, annual %; 0 = rate set from the base rate instead.
  variable_rate_spread_pct: Percentage points over the Association Variable Base Rate for the variable-rate product.
  reset_margin_pct: Percentage points over the Association Variable Base Rate used at each scheduled adjustment of an adjustable product.
  periodic_adjustment_cap_pct: Most the rate may rise or fall at one scheduled adjustment, percentage points; 0 = no scheduled adjustment.
  lifetime_cap_over_initial_pct: Most the rate may ever exceed initial_rate on the loan, percentage points; 0 = no lifetime cap (variable) or no adjustment (fixed).
  rate_floor_pct: Lowest contract rate after discounts and adjustments, annual %.
  autopay_rate_discount_pct: Discount while installments are collected by automatic debit, percentage points.
  ybs_land_rate_discount_pct: Discount for a member who holds a StartRight Operating Line in active status at closing or conversion, percentage points.
  rate_discount_cap_pct: Most the autopay and young-farmer discounts may take off together, percentage points.
  day_count_basis: Interest day-count convention; actual_365 = principal x annual rate / 365 per calendar day.
  payment_frequencies_allowed: Installment frequencies the member may choose at closing.
  origination_fee_pct: Origination fee at closing, % of original principal.
  origination_fee_min_usd: Minimum origination fee, USD.
  origination_fee_max_usd: Maximum origination fee, USD.
  appraisal_required_over_usd: Loan amount above which a full appraisal by a state-certified appraiser is required instead of an evaluation, USD.
  rate_lock_days: Calendar days a quoted rate is held for an application from the lock date to closing.
  late_charge_pct: Late charge on an installment still not fully paid after the grace period, % of the unpaid installment.
  late_charge_min_usd: Minimum late charge, USD.
  late_charge_max_usd: Maximum late charge, USD.
  late_charge_grace_days: Calendar days after an installment's due date before a late charge arises.
  courtesy_waivers_per_12_months: Late charges that may be waived as a courtesy per loan in any rolling 12 months.
  default_interest_addon_pct: Percentage points added to the contract rate on principal while an installment is past due beyond the default trigger.
  default_interest_trigger_days: Calendar days an installment may stay unpaid past its due date before default interest applies.
  returned_payment_fee_usd: Fee per returned payment, USD.
  nonaccrual_past_due_days: Calendar days past due before nonaccrual.
  prepayment_fee_schedule: 'Prepayment fee by loan year (counted from the closing or last conversion date): fee_pct of the first entry whose loan_year_through is at least the current loan year; no fee after the last entry; empty = never.'
  free_prepayment_pct_per_loan_year: Prepayments up to this % of the principal balance at the start of the loan year carry no fee.
  conversion_allowed: Boolean; whether the loan may be converted to another product without refinancing.
  conversion_targets: Products the loan may be converted into.
  conversion_fee_pct: Conversion fee, % of the principal balance on the conversion date.
  conversion_fee_min_usd: Minimum conversion fee, USD.
  conversion_min_months_between: Calendar months that must pass after closing or the last conversion before a conversion.
  partial_release_premium_pct: Release price of one parcel of several, as % of its share of principal (principal x parcel appraised value / total mortgaged value).
  partial_release_fee_usd: Fee per parcel released on sale or farmstead split while other parcels remain mortgaged, USD.
  survey_required_below_acres: A parcel carved out of a larger tract smaller than this many acres must be released on a recorded survey.
  max_ltv_after_release_pct: Largest principal after a release as % of the value still mortgaged.
  release_processing_business_days: Business days from approval of a release, or from payoff, to delivery of the recorded release of mortgage.
  protective_advance_fee_usd: Fee per protective advance made to pay delinquent property taxes, USD.
  tax_delinquency_cure_days: Calendar days after a county delinquency date by which the member must show the tax paid before a protective advance is made.
  improvements_insurance_threshold_usd: Appraised value of insurable buildings above which hazard insurance with the association as mortgagee is required, USD.
  flood_force_place_notice_days: Calendar days after the flood-insurance notice before flood insurance is force-placed on buildings in a special flood hazard area.
  assumption_allowed: Boolean; whether a qualified buyer may assume the loan with credit approval.
  assumption_fee_pct: Assumption fee, % of the principal balance assumed; 0 where assumption is not allowed.
  annual_financials_threshold_usd: Principal balance at or above which annual balance sheet and income statements are required, USD.
  payoff_quote_valid_days: Calendar days a payoff quote remains good, the quote date being day 0.
  autopay_available: Boolean; whether installments may be debited automatically.

