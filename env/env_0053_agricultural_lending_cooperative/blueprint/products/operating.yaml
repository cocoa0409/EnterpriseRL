# Policy charter: Operating Lines of Credit (Cottonwood Plains Farm Credit, ACA — PCA subsidiary).
# Short- term working-capital credit to producers and agribusinesses: revolving lines, a
# young/beginning-farmer line, a credit-scored express line, a non-revolving seasonal loan and
# borrowing-base lines secured by grain, livestock, receivables, inputs and insured growing crops.
category: operating
display_name: Operating Lines of Credit

binding:
  holding_table: operating_lines
  event_tables: [operating_transactions, operating_borrowing_base]
  intake_tables: [operating_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {outstanding_principal: principal, accrued_interest: interest_accrued, fees_due: fees}

lifecycle:
  states: [applied, active, suspended, matured, closed, declined]
  transitions:
    - {from: applied, to: active, by: system, means: The member signed the note and security agreement, the UCC financing statement was filed and the line was booked for its first term.}
    - {from: applied, to: declined, by: system, means: The credit officer declined the application; no line is booked.}
    - {from: active, to: suspended, by: system, means: Advances were frozen because billed interest went past due, a borrowing base deficiency or an overadvance was not cured in time.}
    - {from: suspended, to: active, by: agent, means: The condition that froze advances has been cured on the record and advances are reopened.}
    - {from: active, to: matured, by: system, means: The maturity date passed without a renewal taking effect; no further advances, the balance is due.}
    - {from: suspended, to: matured, by: system, means: The maturity date passed while advances were frozen; the balance is due.}
    - {from: matured, to: active, by: system, means: A renewal approved after maturity took effect and a new term began.}
    - {from: active, to: closed, by: user, means: The member, with nothing owed on the line, confirmed termination of the line and release of the association's lien filing for it.}
    - {from: matured, to: closed, by: system, means: A matured line was paid in full and closed by the servicing platform.}

accounts:
  - key: principal
    unit: USD
    meaning: Principal owed on the line — raised by advances and by returned principal payments, lowered by principal payments.
  - key: interest_accrued
    unit: USD
    meaning: Interest booked on the line and not yet paid — raised by period accruals and by returned interest payments, lowered by interest payments.
  - key: fees
    unit: USD
    meaning: Fees and charges assessed on the line and not yet collected — raised by fee assessments, lowered by fee payments and fee waivers.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_commitment_usd: Smallest commitment the product is booked for, USD.
  max_commitment_usd: Largest commitment the product is booked for, USD; also the ceiling for any renewal or mid-term increase.
  revolving: Boolean; true when principal repaid becomes available to re-advance during the term, false when every advance permanently uses the commitment.
  term_months: Length of one term from the booking or renewal effective date to maturity, in calendar months.
  advance_period_months: Calendar months from the start of a term during which advances may be booked; the advance cutoff date is the start date plus this many months.
  renewable: Boolean; whether the product can be renewed for a further term (a seasonal loan is re-originated, never renewed).
  variable_rate_spread_pct: Percentage points added to the Association Variable Base Rate to set the contract rate before discounts.
  rate_floor_pct: Lowest contract rate the line can carry after all discounts, annual %.
  program_rate_discount_pct: Young/beginning/small farmer program discount off the contract rate, percentage points.
  autodraft_rate_discount_pct: Discount for interest collected by AutoDraft, percentage points.
  relationship_rate_discount_pct: Discount when the member also holds a Farm Real Estate loan in active status, percentage points.
  rate_discount_cap_pct: Most the program, AutoDraft and relationship discounts may take off together, percentage points.
  day_count_basis: 'Interest day-count convention: actual_365 means daily interest = principal x annual rate / 365 for each calendar day.'
  interest_billing_frequency: 'How often accrued interest is billed: monthly, quarterly (calendar quarters), annual (each anniversary of the term start) or at_maturity.'
  interest_due_days_after_period_end: Calendar days after the last day of a billed interest period on which that bill is due.
  post_maturity_rate_addon_pct: Percentage points added to the contract rate on principal still unpaid after the matured-payoff grace period.
  matured_payoff_grace_days: Calendar days after the maturity date during which matured principal still accrues at the contract rate.
  origination_fee_pct: Origination fee charged when a line is booked, % of the commitment.
  origination_fee_min_usd: Minimum origination fee, USD.
  renewal_fee_usd: Flat fee charged when a renewal takes effect, USD.
  early_renewal_waiver_days: The renewal fee is waived when the renewal request was registered at least this many calendar days before the maturity date; 0 = no early-renewal waiver.
  ucc_filing_fee_usd: UCC financing statement filing fee passed through when a line is booked, USD.
  renewal_application_window_days: Calendar days before the maturity date from which a renewal request is accepted; 0 = not renewable.
  streamlined_renewals_max: Consecutive renewals that may be approved under streamlined review before a full credit review is required.
  renewal_financial_statement_required: Boolean; whether a current balance sheet and income statement must accompany a renewal request.
  min_draw_usd: Smallest advance that will be booked, USD.
  online_draw_daily_limit_usd: Total advances that may be booked through online banking and the mobile app on one calendar day, USD.
  phone_draw_daily_limit_usd: Total advances that may be booked by phone with a servicing representative on one calendar day, USD.
  same_day_draw_cutoff_local_time: Central-time cutoff (HH:MM) for an advance requested on a business day to take effect that same day; later requests take effect the next business day.
  input_supplier_direct_allowed: Boolean; whether advance proceeds may be paid directly to a seed, fertilizer or chemical supplier on the member's instruction.
  wire_draw_fee_usd: Fee for advance proceeds delivered by outgoing wire, USD per wire.
  late_charge_pct: Late charge on an interest bill still unpaid after the grace period, % of the unpaid billed interest.
  late_charge_min_usd: Minimum late charge per late interest bill, USD.
  late_charge_max_usd: Maximum late charge per late interest bill, USD.
  late_charge_grace_days: Calendar days after an interest bill's due date before a late charge is assessed.
  courtesy_waivers_per_12_months: Late charges that may be waived as a courtesy on one line in any rolling 12-month window.
  returned_payment_fee_usd: Fee for a payment returned unpaid by the member's bank, USD per returned payment.
  suspension_past_due_days: Calendar days an interest bill may stay unpaid past its due date before advances are frozen.
  payment_application_order: Order in which an undesignated remittance is applied across what is owed on the line.
  borrowing_base_required: Boolean; whether advances are limited by the borrowing base of the latest certificate.
  bbc_frequency_days: Calendar days between required borrowing base certificates; 0 = no certificate required.
  bbc_staleness_days: Calendar days after a certificate's as-of date through which it may still support an advance; 0 = not applicable.
  bbc_deficiency_cure_days: Calendar days after a certificate shows outstanding principal above the borrowing base within which the shortfall must be repaid; 0 = not applicable.
  advance_rate_stored_grain_pct: Advance rate on unpriced stored grain, % of market value.
  advance_rate_contracted_grain_pct: Advance rate on stored grain under a priced contract, % of contract value.
  advance_rate_market_livestock_pct: Advance rate on feeder and slaughter livestock, % of market value.
  advance_rate_receivables_pct: Advance rate on eligible receivables, % of face value.
  advance_rate_prepaid_inputs_pct: Advance rate on prepaid, unapplied crop inputs, % of invoiced cost.
  advance_rate_insured_growing_crops_pct: Advance rate on insured growing crops, % of the insurance guarantee; applies only under the crop insurance assignment rule.
  receivable_max_age_days: Oldest a receivable may be, in calendar days from invoice, to count toward the borrowing base; 0 = not applicable.
  overadvance_tolerance_pct: Advances may exceed the available credit by up to this % of the commitment as a priced overadvance; 0 = no overadvance permitted.
  overadvance_fee_pct: Fee on the portion of an advance that exceeds the available credit, % of that portion.
  overadvance_max_days: Calendar days after an overadvance is booked by which principal must be back within the available credit; 0 = not applicable.
  unused_commitment_fee_pct: Annual fee on the average unused commitment, % per year, billed in arrears.
  max_midterm_increase_pct: Largest mid-term commitment increase that may be requested, % of the commitment in force; 0 = no mid-term increase.
  commitment_increase_fee_pct: Fee on the amount of an approved mid-term commitment increase, %.
  crop_insurance_required: Boolean; whether a multi-peril crop insurance policy on the financed crops must be in force with the indemnity assigned to the association.
  crop_insurance_min_coverage_pct: Lowest crop insurance coverage level that satisfies the insurance requirement, %; 0 = no requirement.
  max_seasonal_loans_per_crop_year: Seasonal Operating Loans a member may hold for the same crop year alongside any revolving line.

