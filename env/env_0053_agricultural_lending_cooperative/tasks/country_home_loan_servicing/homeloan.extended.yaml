    factors:
    - id: tax_growth_allowance
      effect: parameter
      decides: tax_allow
      bindings:
      - tax_two
      - tax_prior
      - tax_allow
      ladder:
      - when: latest property tax bill at least tax_rise_high_pct percent above the property tax paid between 12 and
          24 months before today
        value: K('tax_allow_high_pct')
      - when: latest property tax bill above the property tax paid between 12 and 24 months before today by less than
          tax_rise_high_pct percent
        value: K('tax_allow_low_pct')
      - when: otherwise (not above it, or no earlier bill in the 24 months)
        value: '0'
      baseline:
        tax_allow: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: insurance_renewal_allowance
      effect: parameter
      decides: ins_allow
      bindings:
      - haz_two
      - haz_prior
      - ins_allow
      ladder:
      - when: latest homeowner's premium at least ins_rise_high_pct percent above the premium paid between 12 and
          24 months before today
        value: K('ins_allow_high_pct')
      - when: latest homeowner's premium above the premium paid between 12 and 24 months before today by less than
          ins_rise_high_pct percent
        value: K('ins_allow_low_pct')
      - when: otherwise (not above it, or no earlier premium in the 24 months)
        value: '0'
      baseline:
        ins_allow: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: insurance_due_month
      effect: method
      decides: haz_k
      bindings:
      - exp_k
      - anniv_k
      - haz_k
      ladder:
      - when: the policy expiry on record falls in the second through the twelfth projected month AND the month just
          ahead of it is not the anniversary month of the latest premium bill
        method: project the premium in the month just ahead of the expiry on record
      - when: the expiry on record falls earlier than one month past the next payment due date
        method: project the premium in the opening month of the projection
      - when: otherwise
        method: project the premium in the anniversary month of its latest bill
      baseline:
        haz_k: anniv_k
      evidence:
      - date
      - history
      cross_difficulty: null
    - id: mortgage_insurance_months
      effect: method
      decides: mi_months
      bindings:
      - i0
      - pay0
      - n0
      - lim
      - mi_left
      - mi_months
      ladder:
      - when: mortgage insurance no longer in force
        method: project no premium
      - when: mortgage insurance in force AND principal scheduled under the original amortization to reach the automatic
          termination level on a due date within the projection
        method: project the premium only for the months whose due date is earlier than that date
      - when: otherwise
        method: project the premium for all twelve months
      baseline:
        mi_months: '12'
      evidence:
      - date
      - history
      cross_difficulty: null
    - id: cushion_base
      effect: method
      decides: cushion_base
      bindings:
      - ins_lapsed
      - cushion_base
      ladder:
      - when: mortgage insurance in force AND its premium projected for at least one and fewer than twelve months
        method: figure the cushion on the projected property tax and homeowner's premium only
      - when: homeowner's policy expiry on record earlier than the next payment due date AND mortgage insurance premium
          projected for twelve months or not at all
        method: figure the cushion on the projected property tax and mortgage insurance premiums only
      - when: otherwise
        method: figure the cushion on all projected disbursements
      baseline:
        cushion_base: tax_proj + haz_proj + (mi_prem or 0) * mi_months
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: >-
        The shortage paid at once is the cushion less the projected low point, never below zero, rounded to the cent.
        The projection runs over the twelve months that begin with the next payment due date: each month one monthly
        escrow deposit on the loan record comes in, the property tax is projected as one bill at the amount of the
        latest property tax bill paid from escrow and the homeowner's premium as one bill at the amount of the latest
        homeowner's premium, each falling due in the same calendar month as that latest bill one year later, and mortgage
        insurance is projected at its latest monthly premium for each of the twelve months. The projected low point
        is the lowest of the twelve month-end balances, run from the escrow balance on the loan record. The cushion
        is escrow_cushion_months twelfths of all projected disbursements, rounded to the cent.
      params:
      - escrow_cushion_months
    inputs:
      history:
      - table: homeloan_escrow
        aggregate: sum
        field: amount
        within_months: 24
        filters:
          event_type: homeloan_escrow_disbursement
          disbursement_type: property_tax
      - table: homeloan_escrow
        aggregate: sum
        field: amount
        within_months: 24
        filters:
          event_type: homeloan_escrow_disbursement
          disbursement_type: hazard_insurance
      - table: homeloan_escrow
        aggregate: latest
        field: amount
        filters:
          event_type: homeloan_escrow_disbursement
          disbursement_type: mortgage_insurance
      cross_category: []
  - id: homeloan_ext_escrow_waiver_paydown
    base_policy_refs:
    - homeloan_payment_application
    - homeloan_escrow_waiver_rule
    overwrite:
    - base_policy: homeloan_escrow_waiver_rule
      superseded_clause: that principal is at or below escrow_waiver_max_ltv_pct of original_value (homeloan_msr_current_ltv)
      replaced_by: 'The limit depends on the occupancy of the home and on the member''s farm real estate lending:
        for a second home whose owner also holds an active farm real estate loan with at least two farm principal
        installments paid and no farm loan late charge in the last 24 months, an installment whose remittance was
        returned not counting as paid, the limit is second_home_relationship_limit_pct percent; for a second home
        whose owner holds no farm real estate loan in that standing, it is second_home_limit_pct percent; for a primary
        residence it is the product''s escrow_waiver_max_ltv_pct.'
    trigger: on_request
    subject:
    - homeloan_principal_payment
    computes: paydown_amount
    target_tool: make_principal_paydown_d2fdfc16
    params:
      second_home_relationship_limit_pct: 77.5
      second_home_limit_pct: 75.0
      new_loan_margin_pts: 0.25
      mid_loan_margin_pts: 0.1
      large_homesite_acres: 20.0
      large_homesite_haircut_pct: 5.0
      autopay_window_days: 15
    rule: >-
      This rule figures the principal paydown a member makes, by a one-time debit of the member's own account, so
      that the loan meets the escrow waiver loan-to-value limit; the paydown is booked as an extra principal payment
      and changes neither the monthly payment nor the next due date. The escrow waiver loan-to-value limit is the
      product's escrow_waiver_max_ltv_pct of the home's original value, tested on the principal balance on the loan
      record. The paydown is the principal balance less the limit amount, rounded to the cent, and nothing when the
      balance is already at or below it. The limit depends on the occupancy of the home and on the member's farm real
      estate lending: for a second home whose owner also holds an active farm real estate loan with at least two farm
      principal installments paid and no farm loan late charge in the last 24 months, an installment whose remittance
      was returned not counting as paid, the limit is second_home_relationship_limit_pct percent; for a second home
      whose owner holds no farm real estate loan in that standing, it is second_home_limit_pct percent; for a primary
      residence it is the product's escrow_waiver_max_ltv_pct. The limit is reduced by a seasoning margin: a loan
      open fewer than 36 months carries a margin of new_loan_margin_pts percentage points; a loan open at least 36
      and fewer than 60 months carries mid_loan_margin_pts points; an older loan carries none. The value the limit
      is applied to is chosen as follows: when the homesite was released from a farm real estate mortgage as a farmstead
      split, the value is the lower of the home's original value and the appraised value recorded at that release;
      when the homesite is larger than large_homesite_acres acres, the value is the original value less large_homesite_haircut_pct
      percent; otherwise it is the original value. The balance tested against the limit is chosen as follows, the
      fees unpaid being the fee assessments less the fee payments and fee waivers booked on the loan in the 24 months
      up to today: when the escrow balance stands below zero, it is the principal balance plus the fees unpaid and
      the amount escrow has advanced, which the member owes once escrow is closed; when the escrow balance is not
      below zero but fees are unpaid, it is the principal balance plus those fees; otherwise it is the principal balance.
      Scheduled principal still to post is taken off the tested balance as follows: when the loan pays by automatic
      debit, its next payment falls due within autopay_window_days days and that payment is not the final scheduled
      payment, the principal share of that next payment is taken off, the share being the monthly principal-and-interest
      payment less one month's interest on the principal balance at the note rate, rounded to the cent; when the loan
      pays by automatic debit, its next payment falls due within autopay_window_days days and that payment is the
      final scheduled payment, the whole principal balance is taken off, since the final payment carries all principal
      outstanding; otherwise nothing is taken off. The paydown is figured in this order: the limit less the seasoning
      margin, as a percentage, is applied to the value and rounded to the cent, giving the limit amount; the scheduled
      principal still to post is taken off the tested balance; the paydown is that result less the limit amount, rounded
      to the cent, and nothing when it is zero or less.
    prerequisite: []
    cross_category:
    - category: farmland
      as: history
      reads:
      - status
      - farmland_transactions.event_type
      - farmland_transactions.fee_code
      - farmland_parcels.release_reason
      - farmland_parcels.parcel_number
      - farmland_parcels.appraised_value
      note: The relationship limit tier reads the farm loan status and its 24-month installment and late-charge ledger;
        the farmstead-split value tier reads the farm parcel release of the homesite.
    compute:
    - farm_paid: XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_principal_payment')
        - XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_principal_payment_return')
    - farm_late: XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_fee_assessed',
        fee_code='late_charge')
    - limit_pct: K('second_home_relationship_limit_pct') if F('occupancy') == 'second_home' and EXISTS('farmland',
        status='active') and farm_paid >= 2 and farm_late == 0 else (K('second_home_limit_pct') if F('occupancy')
        == 'second_home' and not (EXISTS('farmland', status='active') and farm_paid >= 2 and farm_late == 0) else
        P('escrow_waiver_max_ltv_pct'))
    - loan_age: MONTHS(F('opened_date'), NOW)
    - margin: K('new_loan_margin_pts') if loan_age < 36 else (K('mid_loan_margin_pts') if loan_age < 60 else 0)
    - split_value: XLATEST('farmland', 'farmland_parcels', 'appraised_value', date_field='action_date', event_type='farmland_parcel_released',
        release_reason='farmstead_split', parcel_number=F('property_parcel_number'))
    - value: MN(F('original_value'), split_value) if split_value else (F('original_value') * (100 - K('large_homesite_haircut_pct'))
        / 100 if F('property_acres') > K('large_homesite_acres') else F('original_value'))
    - fees_unpaid: RND(SUM('homeloan_transactions', 'amount', within_months=24, date_field='effective_date', event_type='homeloan_fee_assessed')
        - SUM('homeloan_transactions', 'amount', within_months=24, date_field='effective_date', event_type='homeloan_fee_payment')
        - SUM('homeloan_transactions', 'amount', within_months=24, date_field='effective_date', event_type='homeloan_fee_waiver'),
        2)
    - tested: F('principal_balance') + fees_unpaid - F('escrow_balance') if F('escrow_balance') < 0 else (F('principal_balance')
        + fees_unpaid if fees_unpaid > 0 else F('principal_balance'))
    - days_to_due: DAYS(NOW, F('next_due_date'))
    - share1: RND(F('monthly_pi_amount') - RND(F('principal_balance') * F('interest_rate') / 1200, 2), 2)
    - to_post: share1 if F('autopay_enrolled') and days_to_due <= K('autopay_window_days') and F('next_due_date')
        != F('maturity_date') else (F('principal_balance') if F('autopay_enrolled') and days_to_due <= K('autopay_window_days')
        and F('next_due_date') == F('maturity_date') else 0)
    - limit_amount: RND(value * (limit_pct - margin) / 100, 2)
    - result: MX(0, RND(tested - to_post - limit_amount, 2))
    compute_basis:
      farm_paid: 'The limit depends on the occupancy of the home and on the member''s farm real estate lending: for
        a second home whose owner also holds an active farm real estate loan with at least two farm principal installments
        paid and no farm loan late charge in the last 24 months, an installment whose remittance was returned not
        counting as paid, the limit is second_home_relationship_limit_pct percent; for a second home whose owner holds
        no farm real estate loan in that standing, it is second_home_limit_pct percent; for a primary residence it
        is the product''s escrow_waiver_max_ltv_pct.'
