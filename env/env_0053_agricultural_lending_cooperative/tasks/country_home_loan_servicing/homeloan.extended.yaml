      - table: homeloan_transactions
        aggregate: latest
        field: amount
        filters:
          event_type: homeloan_principal_payment_return
      - table: homeloan_escrow
        aggregate: latest
        field: amount
        filters:
          event_type: homeloan_escrow_deposit_return
      - table: homeloan_transactions
        aggregate: count
        field: txn_id
        within_months: 12
        filters:
          event_type: homeloan_principal_payment_return
      - table: homeloan_transactions
        aggregate: sum
        field: amount
        within_months: 1
        filters:
          event_type: homeloan_fee_assessed
      - category: farmland
        table: farmland_transactions
        aggregate: count
        field: txn_id
        within_months: 24
        filters:
          event_type: farmland_principal_payment
      cross_category:
      - farmland
  - id: homeloan_ext_escrow_shortage_paid_at_once
    base_policy_refs:
    - homeloan_payment_application
    - homeloan_escrow_analysis_rule
    overwrite:
    - base_policy: homeloan_escrow_analysis_rule
      superseded_clause: The analysis projects the next 12 months of disbursements (homeloan_msr_projected_disbursements)
      replaced_by: 'The property tax bill is projected with a growth allowance: the earlier bill is the property tax
        paid between 12 and 24 months before today, and when the latest property tax bill is at least tax_rise_high_pct
        percent above that earlier bill, the allowance is tax_allow_high_pct percent; when it is above the earlier
        bill by less than tax_rise_high_pct percent, the allowance is tax_allow_low_pct percent; when it is not above
        the earlier bill, or no property tax was paid between 12 and 24 months before today, there is no allowance;
        the projected property tax is the latest bill increased by the allowance, rounded to the cent.'
    - base_policy: homeloan_escrow_analysis_rule
      superseded_clause: and the account may keep a cushion of escrow_cushion_months twelfths of the total above zero
        at its projected low point
      replaced_by: 'The cushion is figured on a cushion base chosen as follows: when mortgage insurance is in force
        and its premium is projected for at least one and fewer than twelve months, the base is the projected property
        tax and homeowner''s premium only; when the homeowner''s policy expiry on record is earlier than the next
        payment due date and the premium of mortgage insurance is projected for twelve months or not at all, the base
        is the projected property tax and mortgage insurance premiums only, since lapsed coverage is placed and billed
        outside escrow; otherwise the base is all projected disbursements.'
    trigger: on_request
    subject:
    - homeloan_escrow_deposit
    computes: shortage_amount
    target_tool: pay_escrow_shortage_8ff65e44
    params:
      tax_rise_high_pct: 5.0
      tax_allow_high_pct: 6.0
      tax_allow_low_pct: 2.5
      ins_rise_high_pct: 8.0
      ins_allow_high_pct: 8.0
      ins_allow_low_pct: 4.0
    rule: >-
      This rule figures the escrow shortage a member pays at once, by a one-time debit of the member's own account,
      so that no shortage spread is added to the monthly payment; the shortage is figured on the escrow account as
      it stands when the member pays. The shortage paid at once is fixed only after no monthly payment on the loan
      stands unpaid past its due date. The shortage paid at once is the cushion less the projected low point, never
      below zero, rounded to the cent. The projection runs over the twelve months that begin with the next payment
      due date: each month one monthly escrow deposit on the loan record comes in, the property tax is projected as
      one bill at the amount of the latest property tax bill paid from escrow and the homeowner's premium as one bill
      at the amount of the latest homeowner's premium, each falling due in the same calendar month as that latest
      bill one year later, and mortgage insurance is projected at its latest monthly premium for each of the twelve
      months. The projected low point is the lowest of the twelve month-end balances, run from the escrow balance
      on the loan record. The cushion is escrow_cushion_months twelfths of all projected disbursements, rounded to
      the cent. The property tax bill is projected with a growth allowance: the earlier bill is the property tax paid
      between 12 and 24 months before today, and when the latest property tax bill is at least tax_rise_high_pct percent
      above that earlier bill, the allowance is tax_allow_high_pct percent; when it is above the earlier bill by less
      than tax_rise_high_pct percent, the allowance is tax_allow_low_pct percent; when it is not above the earlier
      bill, or no property tax was paid between 12 and 24 months before today, there is no allowance; the projected
      property tax is the latest bill increased by the allowance, rounded to the cent. The homeowner's insurance premium
      is projected with a renewal allowance: the earlier premium is the homeowner's premium paid between 12 and 24
      months before today, and when the latest homeowner's premium is at least ins_rise_high_pct percent above that
      earlier premium, the allowance is ins_allow_high_pct percent; when it is above the earlier premium by less than
      ins_rise_high_pct percent, the allowance is ins_allow_low_pct percent; when it is not above the earlier premium,
      or no homeowner's premium was paid between 12 and 24 months before today, there is no allowance; the projected
      premium is the latest premium increased by the allowance, rounded to the cent. The month in which the homeowner's
      premium is projected to fall due is chosen as follows: when the homeowner's policy expiry on the loan record
      falls in the second through the twelfth month of the projection, the months being counted as whole months from
      the next payment due date, and the month just ahead of that expiry is not the anniversary month of the latest
      premium bill, the premium falls due in the month just ahead of the expiry; when the expiry on record falls earlier
      than one whole month past the next payment due date, the premium falls due in the opening month of the projection;
      otherwise it falls due in the anniversary month of its latest bill. The months of mortgage insurance premium
      projected are chosen as follows: when mortgage insurance is no longer in force, none are projected; when it
      is in force and principal is scheduled under the original amortization, the level payment that amortises the
      original principal over amortization_months at the initial note rate rounded to the cent, to reach mi_auto_termination_ltv_pct
      percent of original value on a payment due date within the projection, the scheduled balance on a due date being
      the balance after that due date's payment, the payment being numbered as the amortization months less the whole
      months from that due date to the maturity date, the premium is projected only for the months whose payment due
      date is earlier than that date; otherwise it is projected for all twelve months. The cushion is figured on a
      cushion base chosen as follows: when mortgage insurance is in force and its premium is projected for at least
      one and fewer than twelve months, the base is the projected property tax and homeowner's premium only; when
      the homeowner's policy expiry on record is earlier than the next payment due date and the premium of mortgage
      insurance is projected for twelve months or not at all, the base is the projected property tax and mortgage
      insurance premiums only, since lapsed coverage is placed and billed outside escrow; otherwise the base is all
      projected disbursements. The shortage is figured in this order: the projected disbursements are set as above;
      the twelve month-end balances are run from the escrow balance on the loan record, adding one monthly escrow
      deposit and taking off each disbursement in its month; the projected low point is the lowest of those balances;
      the cushion is escrow_cushion_months twelfths of the cushion base, rounded to the cent; and the shortage paid
      at once is the cushion less the projected low point, never below zero, rounded to the cent.
    prerequisite:
    - problem: homeloan_ext_replacement_remittance
      kind: value_input
      gate: bal
      form: state
      policy_source: The shortage paid at once is fixed only after no monthly payment on the loan stands unpaid past
        its due date.
      condition: no homeloan_transactions monthly bill (homeloan_interest_accrual) with a due_date earlier than today
        is left with billed interest unpaid; for a bill reopened by a returned remittance, its interest, principal
        and escrow shares are booked again
      resolved_by: apply_replacement_remittance_c604a214
      effect: booking the reopened month's escrow share again raises escrow_balance on the loan record, so the escrow
        balance the twelve month-end balances run from (bal) rises by that share
    cross_category: []
    compute:
    - nd: F('next_due_date')
    - bal: F('escrow_balance')
    - dep: F('monthly_escrow_amount')
    - tax_last: LATEST('homeloan_escrow', 'amount', date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='property_tax')
    - tax_date: LATEST('homeloan_escrow', 'effective_date', date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='property_tax')
    - tax_two: SUM('homeloan_escrow', 'amount', within_months=24, date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='property_tax')
    - tax_prior: RND(tax_two - SUM('homeloan_escrow', 'amount', within_months=12, date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='property_tax'), 2)
    - tax_allow: K('tax_allow_high_pct') if tax_prior > 0 and tax_last >= tax_prior * (1 + K('tax_rise_high_pct')
        / 100) else (K('tax_allow_low_pct') if tax_prior > 0 and tax_last > tax_prior else 0)
    - tax_proj: RND(tax_last * (1 + tax_allow / 100), 2)
    - tax_k: MONTHS(nd, tax_date) + 12
    - haz_last: LATEST('homeloan_escrow', 'amount', date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='hazard_insurance')
    - haz_date: LATEST('homeloan_escrow', 'effective_date', date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='hazard_insurance')
    - haz_two: SUM('homeloan_escrow', 'amount', within_months=24, date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='hazard_insurance')
    - haz_prior: RND(haz_two - SUM('homeloan_escrow', 'amount', within_months=12, date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='hazard_insurance'), 2)
    - ins_allow: K('ins_allow_high_pct') if haz_prior > 0 and haz_last >= haz_prior * (1 + K('ins_rise_high_pct')
        / 100) else (K('ins_allow_low_pct') if haz_prior > 0 and haz_last > haz_prior else 0)
    - haz_proj: RND(haz_last * (1 + ins_allow / 100), 2)
    - exp_k: MONTHS(nd, F('hazard_insurance_expiry_date'))
    - anniv_k: MONTHS(nd, haz_date) + 12
    - haz_k: exp_k - 1 if exp_k >= 1 and exp_k <= 11 and exp_k - 1 != anniv_k else (0 if exp_k < 1 else anniv_k)
    - mi_prem: LATEST('homeloan_escrow', 'amount', date_field='effective_date', event_type='homeloan_escrow_disbursement',
        disbursement_type='mortgage_insurance')
    - i0: F('initial_rate') / 1200
    - pay0: RND(F('original_principal') * i0 / (1 - (1 + i0) ** (0 - P('amortization_months'))), 2)
    - n0: P('amortization_months') - MONTHS(nd, F('maturity_date'))
    - lim: F('original_value') * P('mi_auto_termination_ltv_pct') / 100
    - mi_left: (1 if F('original_principal') * (1 + i0) ** (n0 + 0) - pay0 * ((1 + i0) ** (n0 + 0) - 1) / i0 > lim
        else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 1) - pay0 * ((1 + i0) ** (n0 + 1) - 1) / i0 >
        lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 2) - pay0 * ((1 + i0) ** (n0 + 2) - 1) / i0
        > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 3) - pay0 * ((1 + i0) ** (n0 + 3) - 1) /
        i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 4) - pay0 * ((1 + i0) ** (n0 + 4) - 1)
        / i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 5) - pay0 * ((1 + i0) ** (n0 + 5) -
        1) / i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 6) - pay0 * ((1 + i0) ** (n0 + 6)
        - 1) / i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 7) - pay0 * ((1 + i0) ** (n0 +
        7) - 1) / i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 8) - pay0 * ((1 + i0) ** (n0
        + 8) - 1) / i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 9) - pay0 * ((1 + i0) **
        (n0 + 9) - 1) / i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 10) - pay0 * ((1 + i0)
        ** (n0 + 10) - 1) / i0 > lim else 0) + (1 if F('original_principal') * (1 + i0) ** (n0 + 11) - pay0 * ((1
        + i0) ** (n0 + 11) - 1) / i0 > lim else 0)
    - mi_months: 0 if not F('mortgage_insurance_active') else (mi_left if mi_left < 12 else 12)
    - ins_lapsed: DAYS(F('hazard_insurance_expiry_date'), nd) > 0
    - cushion_base: tax_proj + haz_proj if F('mortgage_insurance_active') and mi_months >= 1 and mi_months < 12 else
        (tax_proj + (mi_prem or 0) * mi_months if ins_lapsed else tax_proj + haz_proj + (mi_prem or 0) * mi_months)
    - b0: bal + 1 * dep - (tax_proj if tax_k <= 0 else 0) - (haz_proj if haz_k <= 0 else 0) - (mi_prem or 0) * MN(1,
        mi_months)
    - b1: bal + 2 * dep - (tax_proj if tax_k <= 1 else 0) - (haz_proj if haz_k <= 1 else 0) - (mi_prem or 0) * MN(2,
        mi_months)
    - b2: bal + 3 * dep - (tax_proj if tax_k <= 2 else 0) - (haz_proj if haz_k <= 2 else 0) - (mi_prem or 0) * MN(3,
        mi_months)
    - b3: bal + 4 * dep - (tax_proj if tax_k <= 3 else 0) - (haz_proj if haz_k <= 3 else 0) - (mi_prem or 0) * MN(4,
        mi_months)
    - b4: bal + 5 * dep - (tax_proj if tax_k <= 4 else 0) - (haz_proj if haz_k <= 4 else 0) - (mi_prem or 0) * MN(5,
        mi_months)
    - b5: bal + 6 * dep - (tax_proj if tax_k <= 5 else 0) - (haz_proj if haz_k <= 5 else 0) - (mi_prem or 0) * MN(6,
        mi_months)
    - b6: bal + 7 * dep - (tax_proj if tax_k <= 6 else 0) - (haz_proj if haz_k <= 6 else 0) - (mi_prem or 0) * MN(7,
        mi_months)
    - b7: bal + 8 * dep - (tax_proj if tax_k <= 7 else 0) - (haz_proj if haz_k <= 7 else 0) - (mi_prem or 0) * MN(8,
        mi_months)
    - b8: bal + 9 * dep - (tax_proj if tax_k <= 8 else 0) - (haz_proj if haz_k <= 8 else 0) - (mi_prem or 0) * MN(9,
        mi_months)
    - b9: bal + 10 * dep - (tax_proj if tax_k <= 9 else 0) - (haz_proj if haz_k <= 9 else 0) - (mi_prem or 0) * MN(10,
        mi_months)
    - b10: bal + 11 * dep - (tax_proj if tax_k <= 10 else 0) - (haz_proj if haz_k <= 10 else 0) - (mi_prem or 0) *
        MN(11, mi_months)
    - b11: bal + 12 * dep - (tax_proj if tax_k <= 11 else 0) - (haz_proj if haz_k <= 11 else 0) - (mi_prem or 0) *
        MN(12, mi_months)
    - low: MN(b0, b1, b2, b3, b4, b5, b6, b7, b8, b9, b10, b11)
    - cushion: RND(cushion_base * P('escrow_cushion_months') / 12, 2)
    - result: MX(0, RND(cushion - low, 2))
    compute_basis:
      nd: 'The projection runs over the twelve months that begin with the next payment due date: each month one monthly
        escrow deposit on the loan record comes in, the property tax is projected as one bill at the amount of the
        latest property tax bill paid from escrow and the homeowner''s premium as one bill at the amount of the latest
        homeowner''s premium, each falling due in the same calendar month as that latest bill one year later, and
        mortgage insurance is projected at its latest monthly premium for each of the twelve months.'
      bal: The projected low point is the lowest of the twelve month-end balances, run from the escrow balance on
        the loan record.
      dep: 'The projection runs over the twelve months that begin with the next payment due date: each month one monthly
        escrow deposit on the loan record comes in, the property tax is projected as one bill at the amount of the
        latest property tax bill paid from escrow and the homeowner''s premium as one bill at the amount of the latest
        homeowner''s premium, each falling due in the same calendar month as that latest bill one year later, and
