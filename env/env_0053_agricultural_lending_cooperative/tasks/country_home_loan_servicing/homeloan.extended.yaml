    factors:
    - id: waiver_limit
      effect: parameter
      decides: limit_pct
      bindings:
      - farm_paid
      - farm_late
      - limit_pct
      ladder:
      - when: second home AND an active farm real estate loan with two or more farm principal installments paid and
          no farm late charge in the last 24 months
        value: K('second_home_relationship_limit_pct')
      - when: second home AND no active farm real estate loan in that standing
        value: K('second_home_limit_pct')
      - when: otherwise (primary residence)
        value: P('escrow_waiver_max_ltv_pct')
      baseline:
        limit_pct: P('escrow_waiver_max_ltv_pct')
      evidence:
      - cross_category
      - history
      cross_difficulty: farmland
    - id: seasoning_margin
      effect: parameter
      decides: margin
      bindings:
      - loan_age
      - margin
      ladder:
      - when: loan open fewer than 36 months
        value: K('new_loan_margin_pts')
      - when: loan open at least 36 and fewer than 60 months
        value: K('mid_loan_margin_pts')
      - when: otherwise
        value: '0'
      baseline:
        margin: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: waiver_value
      effect: method
      decides: value
      bindings:
      - split_value
      - value
      ladder:
      - when: the homesite was released from a farm real estate mortgage as a farmstead split
        method: apply the limit to the lower of the original value and the appraised value recorded at that release
      - when: the homesite is larger than large_homesite_acres acres
        method: apply the limit to the original value less large_homesite_haircut_pct percent
      - when: otherwise
        method: apply the limit to the original value
      baseline:
        value: F('original_value')
      evidence:
      - cross_category
      cross_difficulty: farmland
    - id: tested_balance
      effect: method
      decides: tested
      bindings:
      - fees_unpaid
      - tested
      ladder:
      - when: the escrow balance stands below zero
        method: test the principal plus the unpaid fees and the escrow advance
      - when: the escrow balance is not below zero but fees are unpaid
        method: test the principal plus the unpaid fees
      - when: otherwise
        method: test the principal balance
      baseline:
        tested: F('principal_balance')
      evidence:
      - history
      cross_difficulty: null
    - id: principal_to_post
      effect: method
      decides: to_post
      bindings:
      - days_to_due
      - share1
      - to_post
      ladder:
      - when: automatic debit AND next payment due within autopay_window_days days AND it is not the final scheduled
          payment
        method: take off the principal share of the next payment
      - when: automatic debit AND next payment due within autopay_window_days days AND it is the final scheduled payment
        method: take off the whole principal balance (the final payment carries all principal)
      - when: otherwise
        method: take off nothing
      baseline:
        to_post: '0'
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: >-
        The escrow waiver loan-to-value limit is the product's escrow_waiver_max_ltv_pct of the home's original value,
        tested on the principal balance on the loan record. The paydown is the principal balance less the limit amount,
        rounded to the cent, and nothing when the balance is already at or below it.
      params:
      - escrow_waiver_max_ltv_pct
    inputs:
      history:
      - table: homeloan_transactions
        aggregate: count
        field: txn_id
        filters:
          event_type: homeloan_interest_accrual
      - category: farmland
        table: farmland_transactions
        aggregate: count
        field: txn_id
        within_months: 24
        filters:
          event_type: farmland_principal_payment
      - category: farmland
        table: farmland_parcels
