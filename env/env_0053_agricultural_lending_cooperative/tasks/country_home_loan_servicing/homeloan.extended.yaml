    factors:
    - id: fee_rate_band
      effect: parameter
      decides: fee_rate
      bindings:
      - split_val
      - waiver_val
      - ltv
      - fee_rate
      ladder:
      - when: loan-to-value against the waiver value above high_band_ltv_pct
        value: K('high_band_rate_pct')
      - when: loan-to-value above mid_band_ltv_pct and up to high_band_ltv_pct
        value: K('mid_band_rate_pct')
      - when: otherwise
        value: P('escrow_waiver_fee_pct')
      baseline:
        fee_rate: P('escrow_waiver_fee_pct')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: farmland
    - id: occupancy_addon
      effect: parameter
      decides: addon
      bindings:
      - occ_months
      - addon
      ladder:
      - when: second home AND financed fewer than 36 months ago
        value: K('second_home_addon_pct')
      - when: second home AND financed 36 months ago or more
        value: K('seasoned_second_home_addon_pct')
      - when: otherwise (primary residence)
        value: '0'
      baseline:
        addon: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: member_owner_discount
      effect: parameter
      decides: owner_disc
      bindings:
      - patronage_15
      - owner_disc
      ladder:
      - when: Class B Voting Stock active AND cash patronage paid in the 15 months up to today
        value: K('owner_discount_pct')
      - when: Class B Voting Stock active AND no cash patronage paid in those months
        value: K('owner_discount_low_pct')
      - when: otherwise
        value: '0'
      baseline:
        owner_disc: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: equity
    - id: seasoning_credit
      effect: parameter
      decides: season
      bindings:
      - loan_months
      - lates_24
      - returns_12
      - paid_12
      - season
      ladder:
      - when: loan open at least 60 months AND no late charge in the last 24 months
        value: K('season_credit_high_pct')
      - when: loan open at least 24 months AND, in the last 12 months, at least twelve scheduled principal payments
          booked and no returned remittance (not meeting the first test)
        value: K('season_credit_low_pct')
      - when: otherwise
        value: '0'
      baseline:
        season: '0'
      evidence:
      - date
      - history
      cross_difficulty: null
    - id: fee_basis
      effect: method
      decides: basis
      bindings:
      - basis_months
      - basis
      ladder:
      - when: loan open fewer than basis_seasoning_months months
        method: apply the rate to the original principal (the loan amount)
      - when: loan open basis_seasoning_months months or more AND the escrow balance below zero
        method: apply the rate to the principal plus the escrow advance
      - when: otherwise
        method: apply the rate to the principal balance on the loan record
      baseline:
        basis: F('principal_balance')
      evidence:
      - date
      cross_difficulty: null
    - id: autopay_credit
      effect: parameter
      decides: autopay_credit
      bindings:
      - returns_24
      - autopay_credit
      ladder:
      - when: automatic debit AND no returned remittance in the last 24 months
        value: K('autopay_credit_usd')
      - when: automatic debit AND a returned remittance in the last 24 months
        value: K('autopay_credit_low_usd')
      - when: otherwise
        value: '0'
      baseline:
        autopay_credit: '0'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: >-
        The escrow waiver fee is the product's escrow_waiver_fee_pct of the principal balance on the loan record,
        rounded to the cent.
      params:
      - escrow_waiver_fee_pct
    inputs:
      history:
      - table: homeloan_transactions
        aggregate: count
        field: txn_id
        within_months: 24
        filters:
          event_type: homeloan_principal_payment_return
      - category: equity
        table: equity_transactions
        aggregate: count
        field: eq_txn_id
        within_months: 15
        filters:
          event_type: equity_patronage_cash_paid
      - category: farmland
        table: farmland_parcels
        aggregate: latest
        field: appraised_value
        filters:
          event_type: farmland_parcel_released
          release_reason: farmstead_split
      cross_category:
      - equity
      - farmland
