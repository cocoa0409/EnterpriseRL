# Policy charter: Rural Home Loans (Cottonwood Plains Farm Credit, ACA — Country Home program).
# Portfolio first-mortgage loans on owner-occupied country homes and rural acreages up to the acreage
# limit, with monthly principal-and-interest payments, an escrow account for taxes and insurance,
# private mortgage insurance above 80% loan-to-value, and 5/6 and 7/6 adjustable options.
category: homeloan
display_name: Rural Home Loans

binding:
  holding_table: homeloan_loans
  event_tables: [homeloan_transactions, homeloan_escrow]
  intake_tables: [homeloan_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: principal, accrued_interest: interest_accrued, fees_due: fees, escrow_balance: escrow}

lifecycle:
  states: [applied, active, forbearance, nonaccrual, paid_off, declined]
  transitions:
    - {from: applied, to: active, by: system, means: The loan closed, the deed of trust was recorded and funds were disbursed.}
    - {from: applied, to: declined, by: system, means: The credit decision is a decline.}
    - {from: active, to: forbearance, by: agent, means: A hardship forbearance plan requested by the member was granted; monthly payments are suspended for the plan months.}
    - {from: forbearance, to: active, by: system, means: The forbearance plan ended and regular payments resumed with the forborne amount handled as agreed.}
    - {from: active, to: nonaccrual, by: system, means: A monthly payment stayed unpaid for the nonaccrual threshold.}
    - {from: nonaccrual, to: active, by: system, means: All past-due payments were made and the loan returned to accrual.}
    - {from: active, to: paid_off, by: system, means: The final payment or a payoff brought principal, interest and fees to zero.}
    - {from: forbearance, to: paid_off, by: system, means: A payoff during forbearance brought everything owed to zero.}
    - {from: nonaccrual, to: paid_off, by: system, means: A payoff of a nonaccrual loan brought everything owed to zero.}

accounts:
  - key: principal
    unit: USD
    meaning: Principal owed — raised by closing funds and returned principal payments, lowered by principal payments.
  - key: interest_accrued
    unit: USD
    meaning: Billed interest not yet paid — raised by monthly accruals and returned interest payments, lowered by interest payments.
  - key: fees
    unit: USD
    meaning: Fees not yet collected — raised by assessments, lowered by payments and waivers.
  - key: escrow
    unit: USD
    meaning: Funds held in escrow for property taxes and insurance — raised by deposits, lowered by disbursements, surplus refunds and returned deposits.

# ---- category-level parameter dictionary ----
parameter_schema:
  min_loan_usd: Smallest original principal, USD.
  max_loan_usd: Largest original principal, USD (the 2026 conforming limit for one-unit homes caps the non-jumbo products).
  max_ltv_purchase_pct: Largest original principal as % of original_value for a purchase.
  max_ltv_refinance_pct: Largest original principal as % of appraised value for a rate-and-term refinance.
  max_homesite_acres: Largest homesite acreage financed as a rural home; larger tracts are financed as farm real estate.
  manufactured_home_allowed: Boolean; whether a manufactured home on a permanent foundation titled as real estate is eligible.
  amortization_months: Months over which the loan amortizes.
  rate_fixed_period_months: Months the note rate is fixed from the first payment; equal to the amortization for fixed products.
  initial_rate_pct: Note rate before discounts under the current rate sheet, annual %.
  arm_margin_pct: Percentage points added to the index at each adjustment; 0 for fixed products.
  arm_index_lookback_days: The index value used is the latest one published at least this many days before the change date; 0 for fixed products.
  initial_adjustment_cap_pct: Most the rate may move at the first adjustment, percentage points; 0 for fixed products.
  subsequent_adjustment_cap_pct: Most the rate may move at each later adjustment, percentage points; 0 for fixed products.
  lifetime_cap_pct: Most the rate may ever exceed initial_rate, percentage points; 0 for fixed products.
  adjustment_interval_months: Months between adjustments after the first; 0 for fixed products.
  rate_floor_pct: Lowest note rate after any adjustment (the margin for adjustable products), annual %; 0 for fixed products.
  autopay_rate_discount_pct: Discount when monthly payments are debited automatically from closing, percentage points.
  relationship_rate_discount_pct: Discount when the member also holds a Farm Real Estate loan in active status at closing, percentage points.
  rate_discount_cap_pct: Most the discounts may take off together, percentage points.
  interest_basis: 'Interest convention: 30_360_monthly = principal x annual rate / 12 for each monthly period, regardless of days.'
  origination_fee_pct: Origination fee at closing, % of original principal.
  origination_fee_min_usd: Minimum origination fee, USD.
  late_charge_pct: Late charge on a monthly payment not received in full within the grace period, % of the principal-and-interest portion.
  late_charge_min_usd: Minimum late charge, USD.
  late_charge_max_usd: Maximum late charge, USD.
  late_charge_grace_days: Calendar days after the due date before a late charge arises.
  courtesy_waivers_per_12_months: Late charges waivable as a courtesy per loan in any rolling 12 months.
  returned_payment_fee_usd: Fee per returned payment, USD.
  nonaccrual_past_due_days: Calendar days a monthly payment may stay unpaid before nonaccrual.
  prepayment_penalty_pct: Prepayment penalty, % of principal prepaid; 0 = none (every Country Home product is penalty-free).
  escrow_cushion_months: Escrow cushion kept above the projected low point, in months of annual disbursements divided by 12 (at most one-sixth of the annual total).
  escrow_surplus_refund_min_usd: A surplus found at analysis of at least this amount is refunded when the loan is current; smaller surpluses are credited to the next year's deposits.
  escrow_shortage_spread_months: Months over which an escrow shortage is spread unless the member pays it in a lump sum.
  escrow_surplus_refund_days: Calendar days after the analysis date by which a refundable surplus is paid.
  escrow_waiver_max_ltv_pct: Escrow may be waived only when principal is at or below this % of original_value.
  escrow_waiver_fee_pct: One-time fee for waiving escrow, % of the principal balance.
  escrow_waiver_min_months_seasoning: Monthly payments that must have come due since closing before escrow may be waived.
  mi_required_above_ltv_pct: Private mortgage insurance is required when original principal exceeds this % of original_value; 0 = mortgage insurance not offered.
  mi_premium_by_ltv: 'Annual mortgage insurance premium by original loan-to-value band: annual_pct of the first band whose max_ltv_pct is at least the original LTV, applied to original principal and paid monthly from escrow.'
  mi_borrower_cancel_ltv_pct: On the member's written request, mortgage insurance is cancelled once principal reaches this % of original_value.
  mi_auto_termination_ltv_pct: Mortgage insurance ends automatically when principal is scheduled to reach this % of original_value, if the loan is current.
  mi_cancel_no_30day_late_months: For a requested cancellation, no payment 30 or more days late in this many months before the request.
  mi_cancel_no_60day_late_months: For a requested cancellation, no payment 60 or more days late in this many months before the request.
  mi_valuation_fee_usd: Fee for the broker price opinion that confirms value has not declined for a requested cancellation, USD.
  recast_allowed: Boolean; whether the monthly payment may be recast after a large curtailment.
  recast_min_curtailment_usd: Smallest single curtailment that qualifies for a recast, USD; 0 = not offered.
  recast_fee_usd: Fee per recast, USD.
  forbearance_max_months_per_plan: Most months one forbearance plan may cover.
  forbearance_max_months_life: Most forbearance months over the life of the loan.
  forbearance_min_payments_made: Monthly payments that must have been made since closing before forbearance is available.
  lender_placed_notice_days: Calendar days from the first notice of missing homeowner's insurance before coverage is lender-placed (two notices, the second at least 15 days before placement).
  lender_placed_annual_pct: Annual premium of lender-placed homeowner's coverage, % of the principal balance at placement.
  payoff_quote_valid_days: Calendar days a payoff statement remains good, the statement date being day 0.
  lien_release_days: Calendar days after payoff by which the deed of reconveyance is sent for recording.
  max_loans_by_occupancy: Country Home loans a member may hold at once, by occupancy.

