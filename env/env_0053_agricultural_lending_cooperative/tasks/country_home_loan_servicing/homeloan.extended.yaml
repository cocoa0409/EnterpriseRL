      - cross_category
      cross_difficulty: farmland
    - id: returned_fee_by_count
      effect: parameter
      decides: item_fee
      bindings:
      - ret_reason
      - item_fee
      ladder:
      - when: return reason not unauthorized AND three or more other returns counted
        value: K('fourth_return_fee_usd')
      - when: return reason not unauthorized AND two other returns counted
        value: K('third_return_fee_usd')
      - when: return reason not unauthorized AND exactly one other return counted
        value: K('second_return_fee_usd')
      - when: otherwise (no other return counted, or a return reason of unauthorized, which carries no fee)
        value: 0 if ret_reason == 'unauthorized' else P('returned_payment_fee_usd')
