    factors:
    - id: pi_share_carried
      effect: parameter
      decides: pi_share
      bindings:
      - r_int
      - r_prin
      - r_pi
      - bill_rate
      - bill_int
      - pi_share
      ladder:
      - when: the reopened bill is not the final scheduled payment AND the note rate on record differs from the rate
          the bill was billed at
        value: the principal and interest the most recent returned remittance reversed
      - when: the reopened bill is the final scheduled payment
        value: the interest billed on it plus the whole principal balance
      - when: otherwise
        value: F('monthly_pi_amount')
      baseline:
        pi_share: F('monthly_pi_amount')
      evidence:
      - history
      cross_difficulty: null
    - id: escrow_share_carried
      effect: parameter
      decides: esc_share
      bindings:
      - r_due
      - r_esc
      - esc_share
      ladder:
      - when: escrow not waived AND the latest escrow analysis dated later than the reopened payment's due date
        value: the escrow deposit the return reversed
      - when: escrow waived on the loan
        value: '0'
      - when: otherwise
        value: F('monthly_escrow_amount')
      baseline:
        esc_share: F('monthly_escrow_amount')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: fees_carried
      effect: method
      decides: fees_carried
      bindings:
      - ret_12m
      - ret_reason_p
      - fees_owed
      - fees_month
      - fees_carried
      ladder:
      - when: return reason not unauthorized AND another remittance returned on the loan in the twelve months up to
          today
        method: carry every fee unpaid on the loan
      - when: return reason not unauthorized AND no other remittance returned in those twelve months
        method: carry only the unpaid fees assessed in the month up to today
      - when: otherwise (return reason unauthorized)
        method: carry no fee
      baseline:
        fees_carried: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: fee_carry_limit
      effect: parameter
      decides: fee_limit
      bindings:
      - farm_paid
      - farm_late
      - fee_limit
      ladder:
      - when: an active farm real estate loan AND two or more farm principal installments paid AND no farm late charge
          in the last 24 months
        value: K('fee_carry_cap_usd')
      - when: an active farm real estate loan AND a farm late charge in the last 24 months
        value: K('fee_carry_cap_late_usd')
      - when: otherwise
        value: no limit (the fees carried)
      baseline:
        fee_limit: fees_carried
      evidence:
      - cross_category
      - history
      cross_difficulty: farmland
    baseline:
      rule: >-
        A replacement remittance is the monthly payment on the loan record, that is the monthly principal-and-interest
        payment plus the monthly escrow deposit, and it carries no fee.
      params: []
    inputs:
