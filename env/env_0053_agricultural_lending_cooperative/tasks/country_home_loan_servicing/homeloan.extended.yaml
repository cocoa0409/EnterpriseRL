  - id: homeloan_ext_returned_remittance_fee
    base_policy_refs:
    - homeloan_evt_late_charge
    - homeloan_evt_returned_payment
    - homeloan_escrow_waiver_rule
    - homeloan_mi_cancellation_rule
    - homeloan_recast_rule
    - homeloan_insurance_requirement
    overwrite:
    - base_policy: homeloan_evt_returned_payment
      superseded_clause: One returned payment fee of returned_payment_fee_usd is assessed per returned remittance
        (booked from the principal return row) unless the return reason is unauthorized.
      replaced_by: 'The fee for a returned remittance whose return reason is not unauthorized depends on the other
        returned remittances counted: with three or more, the fee is fourth_return_fee_usd; with two, it is third_return_fee_usd;
        with exactly one, it is second_return_fee_usd; with none, it is the product''s returned_payment_fee_usd; a
        remittance returned as unauthorized carries no fee.'
    trigger: state_due
    subject:
    - homeloan_fee_assessed
    computes: fee_amount
    target_tool: assess_returned_item_fee_25e49e31
    params:
      second_return_fee_usd: 35.0
      third_return_fee_usd: 40.0
      fourth_return_fee_usd: 45.0
      cap_mid_floor_usd: 1000.0
      cap_mid_ceiling_usd: 2500.0
      cap_mid_pct: 2.5
      cap_low_pct: 1.5
      owner_relief_pct: 40.0
      owner_relief_low_pct: 20.0
    rule: >-
      This rule figures the returned-payment fee owed for a remittance the member's bank sent back unpaid, booked
      against the returned principal entry of that remittance; one fee arises for each returned remittance, and none
      when the bank's return reason is unauthorized. The returned-payment fee is the product's returned_payment_fee_usd
      for each returned remittance, and nothing when the return reason is unauthorized. The other returned remittances
      counted toward the fee are chosen as follows, the returned remittance being an automatic debit or a one-time
      payment as the channel on its return entries shows: for an automatic debit, when the member's farm real estate
      loan is also paid by automatic debit, the remittances returned in the twelve months up to today on the farm
      real estate loan count together with the other remittances returned on the home loan in those months, because
      both debits draw on the household's account; for a one-time payment by phone, online banking or the mobile app,
      only the other one-time payments returned on the home loan in the twelve months up to today count, a returned
      automatic debit not counting, because a failed one-time payment repeats the member's own instruction; otherwise
      the other remittances returned on the home loan in the twelve months up to today count. The fee for a returned
      remittance whose return reason is not unauthorized depends on the other returned remittances counted: with three
      or more, the fee is fourth_return_fee_usd; with two, it is third_return_fee_usd; with exactly one, it is second_return_fee_usd;
      with none, it is the product's returned_payment_fee_usd; a remittance returned as unauthorized carries no fee.
      The fee is limited by the size of the returned remittance, which is the interest, principal and escrow shares
      that the return reversed: a returned remittance of at least cap_mid_floor_usd and below cap_mid_ceiling_usd
      limits the fee to cap_mid_pct percent of that remittance, rounded to the cent; a returned remittance below cap_mid_floor_usd
      limits it to cap_low_pct percent of that remittance, rounded to the cent; a larger remittance places no limit
      on the fee. A member-owner earns relief on the fee: a member whose Class B Voting Stock is active and who was
      paid cash patronage in the 15 months up to today has owner_relief_pct percent of the fee taken off; a member
      whose Class B Voting Stock is active but who was paid no cash patronage in those 15 months has owner_relief_low_pct
      percent taken off; any other member earns no relief. The fee is figured in this order: first the lower of the
      fee and its limit is taken; then the member-owner relief percentage is taken off that figure once; the returned-payment
      fee is the result rounded to the cent, rounded only at the end.
    prerequisite: []
    cross_category:
    - category: equity
      as: history
      reads:
      - status
      - variant_name
      - equity_transactions.event_type
      - equity_transactions.effective_date
      note: The member-owner relief tier is decided from the Class B Voting Stock holding and its cash patronage payments
        over 15 months.
    - category: farmland
      as: history
      reads:
      - autopay_enrolled
      - status
      - farmland_transactions.event_type
      - farmland_transactions.effective_date
      note: The returns-counted tier reads whether the farm real estate loan pays by automatic debit and the farm
        loan's returned remittances over 12 months.
    compute:
    - ret_reason: LATEST('homeloan_transactions', 'return_reason', date_field='effective_date', event_type='homeloan_principal_payment_return')
    - ret_channel: LATEST('homeloan_transactions', 'channel', date_field='effective_date', event_type='homeloan_principal_payment_return')
    - home_12: COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_principal_payment_return')
        - 1
    - farm_12: XCOUNT('farmland', 'farmland_transactions', within_months=12, date_field='effective_date', event_type='farmland_principal_payment_return')
    - farm_auto: CFIELD('farmland', 'autopay_enrolled', status='active') == True
    - one_12: COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_principal_payment_return',
        channel='phone') + COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_principal_payment_return',
        channel='online_banking') + COUNT('homeloan_transactions', within_months=12, date_field='effective_date',
        event_type='homeloan_principal_payment_return', channel='mobile_app')
    - others: home_12 + farm_12 if ret_channel == 'autopay' and farm_auto else (one_12 - 1 if ret_channel == 'phone'
        or ret_channel == 'online_banking' or ret_channel == 'mobile_app' else home_12)
    - item_fee: 0 if ret_reason == 'unauthorized' else (K('fourth_return_fee_usd') if others >= 3 else (K('third_return_fee_usd')
        if others == 2 else (K('second_return_fee_usd') if others == 1 else P('returned_payment_fee_usd'))))
    - q_int: LATEST('homeloan_transactions', 'amount', date_field='effective_date', event_type='homeloan_interest_payment_return')
    - q_prin: LATEST('homeloan_transactions', 'amount', date_field='effective_date', event_type='homeloan_principal_payment_return')
    - q_esc: LATEST('homeloan_escrow', 'amount', date_field='effective_date', event_type='homeloan_escrow_deposit_return')
    - returned_amt: RND((q_int or 0) + (q_prin or 0) + (q_esc or 0), 2)
    - fee_limit: RND(returned_amt * K('cap_mid_pct') / 100, 2) if returned_amt >= K('cap_mid_floor_usd') and returned_amt
        < K('cap_mid_ceiling_usd') else (RND(returned_amt * K('cap_low_pct') / 100, 2) if returned_amt < K('cap_mid_floor_usd')
        else item_fee)
    - owner_relief: K('owner_relief_pct') if CFIELD('equity', 'status', variant_name='Class B Voting Stock') == 'active'
        and XCOUNT('equity', 'equity_transactions', within_months=15, date_field='effective_date', event_type='equity_patronage_cash_paid')
        >= 1 else (K('owner_relief_low_pct') if CFIELD('equity', 'status', variant_name='Class B Voting Stock') ==
        'active' and XCOUNT('equity', 'equity_transactions', within_months=15, date_field='effective_date', event_type='equity_patronage_cash_paid')
        == 0 else 0)
    - result: RND(MN(item_fee, fee_limit) * (100 - owner_relief) / 100, 2)
    compute_basis:
