  - id: homeloan_ext_escrow_waiver_fee
    base_policy_refs:
    - homeloan_escrow_waiver_rule
    overwrite:
    - base_policy: homeloan_escrow_waiver_rule
      superseded_clause: On the waiver a fee of escrow_waiver_fee_pct of the principal balance, rounded to cents,
        is assessed
      replaced_by: 'The fee is figured in this order: the fee rate plus the occupancy add-on is applied once to the
        fee basis and divided by 100; the member-owner discount is then taken off that figure; the seasoning credit
        is then taken off the result; the automatic-debit credit is then subtracted; the fee is that figure rounded
        to the cent, never below zero, rounded only at the end.'
    - base_policy: homeloan_escrow_waiver_rule
      superseded_clause: that principal is at or below escrow_waiver_max_ltv_pct of original_value (homeloan_msr_current_ltv)
      replaced_by: When the tested balance is above the escrow waiver limit, the escrow waiver is not recorded until
        the member's paydown of the difference has been posted.
    trigger: on_request
    subject:
    - homeloan_escrow_waiver
    computes: waiver_fee
    target_tool: record_escrow_waiver_439c8464
    params:
      high_band_ltv_pct: 77.5
      mid_band_ltv_pct: 70.0
      high_band_rate_pct: 0.4
      mid_band_rate_pct: 0.35
      second_home_addon_pct: 0.125
      seasoned_second_home_addon_pct: 0.0625
      owner_discount_pct: 30.0
      owner_discount_low_pct: 15.0
      season_credit_high_pct: 25.0
      season_credit_low_pct: 10.0
      autopay_credit_usd: 25.0
      autopay_credit_low_usd: 10.0
      basis_seasoning_months: 60
      large_homesite_acres: 20.0
      large_homesite_haircut_pct: 5.0
    rule: >-
      This rule figures the one-time escrow waiver fee booked when escrow for property taxes and homeowner's insurance
      is waived on a member's request on file; from the waiver the member pays taxes and insurance directly, the monthly
      escrow deposit stops and the escrow balance is refunded by the escrow refund run. When the tested balance is
      above the escrow waiver limit, the escrow waiver is not recorded until the member's paydown of the difference
      has been posted. The escrow waiver fee is the product's escrow_waiver_fee_pct of the principal balance on the
      loan record, rounded to the cent. The fee rate depends on the loan-to-value ratio, the principal balance divided
      by the waiver value as a percentage rounded to two decimals, the waiver value being the value the escrow waiver
      loan-to-value limit is applied to, namely the lower of the home's original value and the appraised value recorded
      when the homesite was released from a farm real estate mortgage as a farmstead split, or for a homesite larger
      than large_homesite_acres acres not so released the original value less large_homesite_haircut_pct percent,
      or otherwise the original value: above high_band_ltv_pct, the rate is high_band_rate_pct percent; above mid_band_ltv_pct
      and up to high_band_ltv_pct, it is mid_band_rate_pct percent; at or below mid_band_ltv_pct, it is the product's
      escrow_waiver_fee_pct. An occupancy add-on is added to the fee rate: second_home_addon_pct percentage points
      for a second home financed fewer than 36 months ago, seasoned_second_home_addon_pct points for a second home
      financed 36 months ago or more, and nothing for a primary residence. A member-owner discount applies: a member
      whose Class B Voting Stock is active and who was paid cash patronage in the 15 months up to today has owner_discount_pct
      percent taken off; a member whose Class B Voting Stock is active but who was paid no cash patronage in those
      months has owner_discount_low_pct percent taken off; any other member has no discount. A seasoning credit applies:
      a loan open at least 60 months with no late charge in the 24 months up to today has season_credit_high_pct percent
      taken off; a loan open at least 24 months that in the 12 months up to today had at least twelve scheduled principal
      payments booked and no returned remittance, and not meeting the first test, has season_credit_low_pct percent
      taken off; any other loan has none. The amount the fee rate is applied to is chosen as follows: for a loan open
      fewer than basis_seasoning_months months, it is the original principal, the loan amount the waiver is priced
      on; for a loan open basis_seasoning_months months or more whose escrow balance stands below zero, it is the
      principal balance plus the amount escrow has advanced; otherwise it is the principal balance on the loan record.
      An automatic-debit credit is taken off the fee: autopay_credit_usd for a loan paying by automatic debit with
      no returned remittance in the 24 months up to today, autopay_credit_low_usd for a loan paying by automatic debit
      with a returned remittance in those months, and nothing for a loan not on automatic debit. The fee is figured
      in this order: the fee rate plus the occupancy add-on is applied once to the fee basis and divided by 100; the
      member-owner discount is then taken off that figure; the seasoning credit is then taken off the result; the
      automatic-debit credit is then subtracted; the fee is that figure rounded to the cent, never below zero, rounded
      only at the end.
    prerequisite:
    - problem: homeloan_ext_escrow_waiver_paydown
      kind: value_input
      gate: ltv
      form: action
      policy_source: When the tested balance is above the escrow waiver limit, the escrow waiver is not recorded until
        the member's paydown of the difference has been posted.
      fallback_reason: The state the waiver waits on is a principal balance at or below the limit, but a lower principal
        balance can also be brought about by a scheduled principal share or by the remainder of a replacement remittance,
        so the state alone does not single out the member's paydown; the sentence names the paydown itself.
      condition: the tested balance on homeloan_loans (principal balance, plus unpaid fees and any escrow advance
        where the paydown rule adds them) less the scheduled principal still to post is at or below the escrow waiver
        limit amount, a homeloan_principal_payment row with payment_purpose curtailment having been posted for the
        difference
      resolved_by: make_principal_paydown_d2fdfc16
      effect: the paydown lowers principal_balance, so the loan-to-value ratio the fee rate band reads (ltv) is figured
        on the lower principal
    cross_category:
    - category: equity
      as: history
      reads:
      - status
      - variant_name
      - equity_transactions.event_type
      - equity_transactions.effective_date
      note: The member-owner discount tier is decided from the Class B Voting Stock holding and its cash patronage
        payments over 15 months.
    - category: farmland
      as: history
      reads:
      - farmland_parcels.release_reason
      - farmland_parcels.parcel_number
      - farmland_parcels.appraised_value
      note: The fee rate band measures loan-to-value against the lower of the original value and the farmstead-split
        release appraisal of the homesite.
    compute:
    - split_val: XLATEST('farmland', 'farmland_parcels', 'appraised_value', date_field='action_date', event_type='farmland_parcel_released',
        release_reason='farmstead_split', parcel_number=F('property_parcel_number'))
    - waiver_val: MN(F('original_value'), split_val) if split_val else (F('original_value') * (100 - K('large_homesite_haircut_pct'))
        / 100 if F('property_acres') > K('large_homesite_acres') else F('original_value'))
    - ltv: RND(F('principal_balance') / waiver_val * 100, 2)
    - fee_rate: K('high_band_rate_pct') if ltv > K('high_band_ltv_pct') else (K('mid_band_rate_pct') if ltv > K('mid_band_ltv_pct')
        else P('escrow_waiver_fee_pct'))
    - occ_months: MONTHS(F('opened_date'), NOW)
    - addon: K('second_home_addon_pct') if F('occupancy') == 'second_home' and occ_months < 36 else (K('seasoned_second_home_addon_pct')
        if F('occupancy') == 'second_home' and occ_months >= 36 else 0)
    - patronage_15: XCOUNT('equity', 'equity_transactions', within_months=15, date_field='effective_date', event_type='equity_patronage_cash_paid')
    - owner_disc: K('owner_discount_pct') if CFIELD('equity', 'status', variant_name='Class B Voting Stock') == 'active'
        and patronage_15 >= 1 else (K('owner_discount_low_pct') if CFIELD('equity', 'status', variant_name='Class
        B Voting Stock') == 'active' and patronage_15 == 0 else 0)
    - loan_months: MONTHS(F('opened_date'), NOW)
    - lates_24: COUNT('homeloan_transactions', within_months=24, date_field='effective_date', event_type='homeloan_fee_assessed',
        fee_code='late_charge')
    - returns_12: COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_principal_payment_return')
    - paid_12: COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_principal_payment',
        payment_purpose='scheduled')
    - season: K('season_credit_high_pct') if loan_months >= 60 and lates_24 == 0 else (K('season_credit_low_pct')
        if loan_months >= 24 and paid_12 >= 12 and returns_12 == 0 else 0)
    - basis_months: MONTHS(F('opened_date'), NOW)
    - basis: F('original_principal') if basis_months < K('basis_seasoning_months') else (F('principal_balance') -
        F('escrow_balance') if F('escrow_balance') < 0 else F('principal_balance'))
    - returns_24: COUNT('homeloan_transactions', within_months=24, date_field='effective_date', event_type='homeloan_principal_payment_return')
    - autopay_credit: K('autopay_credit_usd') if F('autopay_enrolled') and returns_24 == 0 else (K('autopay_credit_low_usd')
        if F('autopay_enrolled') and returns_24 > 0 else 0)
    - result: MX(0, RND(basis * (fee_rate + addon) / 100 * (100 - owner_disc) / 100 * (100 - season) / 100 - autopay_credit,
        2))
    compute_basis:
      ltv: 'The fee rate depends on the loan-to-value ratio, the principal balance divided by the waiver value as
        a percentage rounded to two decimals, the waiver value being the value the escrow waiver loan-to-value limit
        is applied to, namely the lower of the home''s original value and the appraised value recorded when the homesite
        was released from a farm real estate mortgage as a farmstead split, or for a homesite larger than large_homesite_acres
        acres not so released the original value less large_homesite_haircut_pct percent, or otherwise the original
        value: above high_band_ltv_pct, the rate is high_band_rate_pct percent; above mid_band_ltv_pct and up to high_band_ltv_pct,
        it is mid_band_rate_pct percent; at or below mid_band_ltv_pct, it is the product''s escrow_waiver_fee_pct.'
      fee_rate: 'The fee rate depends on the loan-to-value ratio, the principal balance divided by the waiver value
