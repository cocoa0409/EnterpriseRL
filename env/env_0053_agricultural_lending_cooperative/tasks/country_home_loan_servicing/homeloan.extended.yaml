      - farm_12
      - farm_auto
      - one_12
      - others
      ladder:
      - when: the returned remittance was an automatic debit AND the farm real estate loan is also paid by automatic
          debit
        method: count the returns on the home loan and on the farm real estate loan in the twelve months up to today
      - when: the returned remittance was a one-time payment by phone, online banking or the mobile app
        method: count only the other one-time payments returned on the home loan in the twelve months up to today
      - when: otherwise
        method: count the other returns on the home loan in the twelve months up to today
