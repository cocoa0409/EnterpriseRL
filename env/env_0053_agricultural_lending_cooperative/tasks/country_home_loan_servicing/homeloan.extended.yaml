    - base_policy: homeloan_payment_application
      superseded_clause: Money left after every monthly payment due is paid goes to principal as a curtailment, unless
        the member designates it for a fee or as a lump-sum escrow shortage payment.
      replaced_by: 'The fees the replacement carries depend on the return it replaces: when the return reason is not
        unauthorized and another remittance on the loan was returned in the twelve months up to today, the replacement
        carries every fee unpaid on the loan, so a repeat return clears the account; when the return reason is not
        unauthorized and no other remittance was returned in those twelve months, it carries only the fees assessed
        on the loan in the month up to today, the charges this return caused, as far as they are unpaid; when the
        return reason is unauthorized, the member disputes the debit and the replacement carries no fee.'
    trigger: state_due
    subject:
    - homeloan_interest_payment
    - homeloan_principal_payment
    - homeloan_escrow_deposit
    - homeloan_fee_payment
    computes: remittance_amount
    target_tool: apply_replacement_remittance_c604a214
    params:
      fee_carry_cap_usd: 35.0
      fee_carry_cap_late_usd: 60.0
    rule: >-
      This rule figures the replacement remittance a member makes for a monthly payment that a returned remittance
      reopened, taken by phone and applied to that monthly bill: the reversed interest, principal and escrow shares
      are booked again, the fees it carries are paid from what is left in the order they were assessed, and anything
      beyond that goes to principal as a curtailment. A replacement remittance is not figured until the ledger carries
      a late charge for every reopened monthly payment whose grace period has ended. A replacement remittance is figured
      only after the ledger carries a returned-payment fee for every returned remittance whose return reason calls
      for one. A replacement remittance is the monthly payment on the loan record, that is the monthly principal-and-interest
      payment plus the monthly escrow deposit, and it carries no fee. The principal-and-interest share the replacement
      carries is chosen as follows: when the reopened monthly bill is not the final scheduled payment and the note
      rate on the loan record differs from the rate that bill was billed at, because a rate change took effect after
      it, the share is the principal and interest that the most recent returned remittance reversed; when the reopened
      bill is the final scheduled payment, the share is the interest billed on it plus the whole principal balance;
      otherwise the share is the monthly principal-and-interest payment on the loan record. The escrow share the replacement
      carries is chosen as follows: when escrow is not waived and the loan's latest escrow analysis is dated later
      than the due date of the reopened monthly payment, the share is the escrow deposit that the return reversed;
      when escrow is waived on the loan, the share is nothing; otherwise the share is the monthly escrow deposit on
      the loan record. The fees the replacement carries depend on the return it replaces: when the return reason is
      not unauthorized and another remittance on the loan was returned in the twelve months up to today, the replacement
      carries every fee unpaid on the loan, so a repeat return clears the account; when the return reason is not unauthorized
      and no other remittance was returned in those twelve months, it carries only the fees assessed on the loan in
      the month up to today, the charges this return caused, as far as they are unpaid; when the return reason is
      unauthorized, the member disputes the debit and the replacement carries no fee. The fees a replacement carries
      are limited for a member who also holds an active farm real estate loan with the association: when that farm
      loan shows at least two principal installments paid and no farm loan late charge in the last 24 months, an installment
      whose remittance was returned not counting as paid, at most fee_carry_cap_usd of fees is carried; when it is
      active and shows a farm loan late charge in the last 24 months, at most fee_carry_cap_late_usd is carried; otherwise
      the fees carry in full; fees beyond the limit stay unpaid on the loan. The replacement remittance is the principal-and-interest
      share plus the escrow share plus the lower of the fees carried and their limit, rounded to the cent.
    prerequisite:
    - problem: homeloan_ext_late_charge_reopened_month
      kind: value_input
      gate: fees_owed
      form: state
      policy_source: A replacement remittance is not figured until the ledger carries a late charge for every reopened
        monthly payment whose grace period has ended.
      condition: homeloan_transactions holds a homeloan_fee_assessed row with fee_code late_charge whose source_ref_id
        is the reopened monthly bill, for every reopened bill more than late_charge_grace_days days past its due date
      resolved_by: assess_late_charge_eed44226
      effect: the late charge raises fees_due on the loan record, so the fees the replacement carries (fees_owed,
        then the lower of it and the fee limit) include it
    - problem: homeloan_ext_returned_remittance_fee
      kind: value_input
      gate: fees_owed
      form: state
      policy_source: A replacement remittance is figured only after the ledger carries a returned-payment fee for
        every returned remittance whose return reason calls for one.
      condition: homeloan_transactions holds a homeloan_fee_assessed row with fee_code returned_payment whose source_ref_id
        is the returned principal entry, for every returned remittance whose return reason is not unauthorized
      resolved_by: assess_returned_item_fee_25e49e31
      effect: the returned-payment fee raises fees_due on the loan record, so the fees the replacement carries include
        it
    cross_category:
    - category: farmland
      as: history
      reads:
      - status
      - farmland_transactions.event_type
      - farmland_transactions.fee_code
      - farmland_transactions.effective_date
      note: The fee carry limit tier is decided from the member's farm real estate loan status and its 24-month installment
        and late-charge ledger.
    compute:
    - r_int: LATEST('homeloan_transactions', 'amount', date_field='effective_date', event_type='homeloan_interest_payment_return')
    - r_prin: LATEST('homeloan_transactions', 'amount', date_field='effective_date', event_type='homeloan_principal_payment_return')
    - r_pi: RND((r_int or 0) + (r_prin or 0), 2)
    - r_due: LATEST('homeloan_transactions', 'due_date', date_field='effective_date', event_type='homeloan_principal_payment_return')
    - bill_rate: LATEST('homeloan_transactions', 'rate_applied', date_field='effective_date', event_type='homeloan_interest_accrual',
        due_date=r_due)
    - bill_int: LATEST('homeloan_transactions', 'amount', date_field='effective_date', event_type='homeloan_interest_accrual',
        due_date=r_due)
    - pi_share: r_pi if r_due != F('maturity_date') and bill_rate != None and float(bill_rate) != F('interest_rate')
        else (RND((bill_int or 0) + F('principal_balance'), 2) if r_due == F('maturity_date') else F('monthly_pi_amount'))
    - r_esc: LATEST('homeloan_escrow', 'amount', date_field='effective_date', event_type='homeloan_escrow_deposit_return')
    - esc_share: r_esc if not F('escrow_waived') and F('last_escrow_analysis_date') > (r_due or '') and r_esc else
        (0 if F('escrow_waived') else F('monthly_escrow_amount'))
    - ret_12m: COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_principal_payment_return')
    - ret_reason_p: LATEST('homeloan_transactions', 'return_reason', date_field='effective_date', event_type='homeloan_principal_payment_return')
    - fees_owed: F('fees_due')
    - fees_month: SUM('homeloan_transactions', 'amount', within_months=1, date_field='effective_date', event_type='homeloan_fee_assessed')
    - fees_carried: 0 if ret_reason_p == 'unauthorized' else (fees_owed if ret_12m - 1 >= 1 else MN(fees_owed, fees_month))
    - farm_paid: XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_principal_payment')
        - XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_principal_payment_return')
    - farm_late: XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_fee_assessed',
        fee_code='late_charge')
    - fee_limit: K('fee_carry_cap_usd') if EXISTS('farmland', status='active') and farm_paid >= 2 and farm_late ==
        0 else (K('fee_carry_cap_late_usd') if EXISTS('farmland', status='active') and farm_late > 0 else fees_carried)
    - result: RND(pi_share + esc_share + MN(fees_carried, fee_limit), 2)
