    forbearance_min_payments_made: 12
    lender_placed_notice_days: 45
    lender_placed_annual_pct: 1.85
    payoff_quote_valid_days: 30
    lien_release_days: 30
    max_loans_by_occupancy: {primary_residence: 1, second_home: 1}

# ---- data flow (every write is an event) ----
events:
  - type: homeloan_loan_open
    target: homeloan_loans
    mutation: create
    meaning: An application for a Country Home loan (purchase or rate-and-term refinance) is registered.
    grain: One row per application.
    fields:
      loan_id: Reference of the new loan.
      customer_id: Applying member.
      variant_name: Official name of the product applied for.
      original_principal: Amount requested, USD.
      original_value: Lesser of price and appraised value (appraised value for a refinance), USD.
      property_address: Address of the home.
      property_parcel_number: County parcel number of the homesite.
      property_acres: Deeded acres of the homesite.
      occupancy: Occupancy to be certified.
      applied_date: Date received.
    triggers: []
  - type: homeloan_loan_fund
    target: homeloan_loans
    mutation: {transition: {from: applied, to: active}}
    meaning: The loan closes and is funded.
    grain: One per loan.
    fields:
      opened_date: Closing date.
      interest_rate: Note rate set under homeloan_rate_setting.
      initial_rate: Same as interest_rate.
      rate_fixed_until: Last day of the fixed period.
      next_reset_date: First change date for adjustable products, else empty.
      monthly_pi_amount: Level payment amortising original principal over amortization_months at the note rate.
      monthly_escrow_amount: One-twelfth of projected annual disbursements, 0.00 when escrow is waived.
      next_due_date: First payment due date (the 1st of the second month after closing).
      maturity_date: Final payment due date.
      flood_zone: Result of the flood determination.
      escrow_waived: Whether escrow was waived at closing.
      mortgage_insurance_active: Whether mortgage insurance was placed.
      mi_monthly_premium: Monthly mortgage insurance premium.
      hazard_insurance_expiry_date: Expiry on the declarations page at closing.
      autopay_enrolled: Whether automatic debit was authorised at closing.
      autopay_account_last4: Last four digits of the debited account, else empty.
    triggers:
      - event: homeloan:homeloan_fee_assessed
        map: {fee_code: origination, effective_date: opened_date, channel: system}
      - event: homeloan:homeloan_escrow_deposit
        when: {escrow_waived: false}
        map: {deposit_type: initial, effective_date: opened_date, channel: system}
  - type: homeloan_loan_decline
    target: homeloan_loans
    mutation: {transition: {from: applied, to: declined}}
    meaning: The credit decision is a decline.
    grain: One per declined application.
    fields:
      closed_date: Decision date.
    triggers: []
  - type: homeloan_forbearance_grant
    target: homeloan_loans
    mutation: {transition: {from: active, to: forbearance}}
    meaning: A hardship forbearance plan suspends monthly payments for the plan months.
    grain: One per plan granted.
    fields:
      forbearance_end_date: Last day of the plan (the day before the first payment due after the plan).
      forbearance_months_used: Previous total plus the plan months.
    triggers: []
  - type: homeloan_forbearance_end
    target: homeloan_loans
    mutation: {transition: {from: forbearance, to: active}}
    meaning: The plan ends; the forborne payments move to the end of the loan and regular payments resume.
    grain: One per plan.
    fields:
      forbearance_end_date: Cleared to empty.
      next_due_date: First payment due after the plan.
      maturity_date: Old maturity date plus the plan months.
    triggers: []
  - type: homeloan_nonaccrual
    target: homeloan_loans
    mutation: {transition: {from: active, to: nonaccrual}}
    meaning: The loan is placed in nonaccrual.
    grain: One per placement.
    fields:
      next_due_date: Unchanged; recorded for the placement.
    triggers: []
  - type: homeloan_accrual_restore
    target: homeloan_loans
    mutation: {transition: {from: nonaccrual, to: active}}
    meaning: The loan returns to accrual after every past-due payment is made.
    grain: One per restoration.
    fields:
      next_due_date: Unchanged; recorded for the restoration.
    triggers: []
  - type: homeloan_loan_payoff
    target: homeloan_loans
    mutation: {transition: [{from: active, to: paid_off}, {from: forbearance, to: paid_off}, {from: nonaccrual, to: paid_off}]}
    meaning: The final payment or a payoff brings everything owed to zero.
    grain: One per loan.
    fields:
      closed_date: Effective date of the final payment.
      next_due_date: Cleared to empty.
    triggers: []
  - type: homeloan_payment_roll
    target: homeloan_loans
    mutation: update
    meaning: A monthly payment is billed and next_due_date moves to the first of the following month.
    grain: One per monthly payment billed.
    fields:
      next_due_date: First day of the following month, or empty after the final payment.
    triggers:
      - event: homeloan:homeloan_interest_accrual
        map: {channel: system}
  - type: homeloan_rate_adjustment
    target: homeloan_loans
    mutation: update
    meaning: An adjustable loan's note rate and payment change on a change date.
    grain: One per change date.
    fields:
      interest_rate: New note rate.
      monthly_pi_amount: Payment re-amortising the principal over the remaining months at the new rate.
      next_reset_date: Following change date.
    triggers: []
  - type: homeloan_escrow_analysis
    target: homeloan_loans
    mutation: update
    meaning: The annual escrow analysis sets the deposit for the coming year.
    grain: One per analysis.
    fields:
      monthly_escrow_amount: New monthly deposit, including any shortage spread.
      last_escrow_analysis_date: Analysis date.
    triggers: []
  - type: homeloan_escrow_waiver
    target: homeloan_loans
    mutation: update
    meaning: At the member's request escrow is waived and the member pays taxes and insurance directly.
    grain: One per waiver.
    fields:
      escrow_waived: Set to true.
      monthly_escrow_amount: Set to 0.00.
    triggers:
      - event: homeloan:homeloan_fee_assessed
        map: {fee_code: escrow_waiver, channel: system}
  - type: homeloan_mi_cancellation
    target: homeloan_loans
    mutation: update
    meaning: Private mortgage insurance ends, on the member's request or automatically.
    grain: One per loan.
    fields:
      mortgage_insurance_active: Set to false.
      mi_monthly_premium: Set to 0.00.
      monthly_escrow_amount: Reduced by the premium no longer collected.
    triggers: []
  - type: homeloan_recast
    target: homeloan_loans
    mutation: update
    meaning: After a large curtailment the monthly payment is recast over the remaining term.
    grain: One per recast.
    fields:
      monthly_pi_amount: New payment amortising the principal over the remaining months at the note rate.
    triggers:
      - event: homeloan:homeloan_fee_assessed
        map: {fee_code: recast, channel: system}
  - type: homeloan_autopay_change
    target: homeloan_loans
    mutation: update
    meaning: Automatic debit of monthly payments is authorised, moved or cancelled.
    grain: One per change.
    fields:
      autopay_enrolled: New flag.
      autopay_account_last4: Last four digits of the debited account, empty when cancelled.
      interest_rate: Note rate after the closing autopay discount is removed on cancellation.
      monthly_pi_amount: Payment re-amortised when the rate changes.
    triggers: []
  - type: homeloan_insurance_update
    target: homeloan_loans
    mutation: update
    meaning: A renewed or replacement homeowner's insurance declarations page is recorded.
    grain: One per declarations page received.
    fields:
      hazard_insurance_expiry_date: Expiry on the new declarations page.
    triggers: []
  - type: homeloan_interest_accrual
    target: homeloan_transactions
    meaning: Interest for one monthly period is booked and billed with that month's payment.
    grain: One row per monthly payment billed.
    distinguish_by: [due_date]
    fields:
      amount: Interest for the month, USD.
      due_date: Due date of the payment (interest is paid in arrears for the prior month).
      rate_applied: Note rate.
      channel: Always system.
    account: interest_accrued
    direction: in
    triggers: []
  - type: homeloan_interest_payment
    target: homeloan_transactions
    meaning: The interest share of a monthly payment (or interest at payoff) is paid.
    grain: One row per monthly payment paid.
    distinguish_by: [source_ref_id, effective_date]
    fields:
      amount: Interest paid, USD.
      effective_date: Date received.
      channel: Channel.
      due_date: Due date of the payment paid.
      source_ref_id: The monthly interest accrual (bill) paid.
    account: interest_accrued
    direction: out
    triggers: []
  - type: homeloan_principal_payment
    target: homeloan_transactions
    meaning: The principal share of a monthly payment, a curtailment or the payoff principal is paid.
    grain: One row per principal application.
    distinguish_by: [payment_purpose, source_ref_id, effective_date, amount, channel]
    fields:
      amount: Principal paid, USD.
      effective_date: Date received.
      channel: Channel.
      payment_purpose: scheduled, curtailment or payoff.
      due_date: Due date of the monthly payment for a scheduled share, else empty.
      source_ref_id: The monthly bill for a scheduled share, else empty.
    account: principal
    direction: out
    triggers: []
  - type: homeloan_fee_assessed
    target: homeloan_transactions
    meaning: A fee or charge is assessed.
    grain: One row per fee occurrence.
    distinguish_by: [fee_code, effective_date, source_ref_id]
    fields:
      fee_code: Which fee.
      amount: Fee, USD.
      effective_date: Date assessed.
      source_ref_id: The monthly bill, returned payment or other record the fee arises from, else empty.
      channel: Always system.
    account: fees
    direction: in
    triggers: []
  - type: homeloan_fee_payment
    target: homeloan_transactions
    meaning: A fee is paid.
    grain: One row per assessment per remittance.
    distinguish_by: [source_ref_id, effective_date, amount, channel]
    fields:
      fee_code: Code of the fee paid.
      amount: Amount applied, USD.
      effective_date: Date received.
      channel: Channel.
      source_ref_id: The fee assessment paid.
    account: fees
    direction: out
    triggers: []
  - type: homeloan_fee_waiver
    target: homeloan_transactions
    meaning: An assessed fee is waived in whole.
    grain: One row per waived assessment.
    distinguish_by: [source_ref_id, waiver_basis]
    fields:
      fee_code: Code of the fee waived.
      amount: Unpaid amount waived, USD.
      effective_date: Date of the waiver.
      source_ref_id: The fee assessment waived.
      waiver_basis: courtesy or error_correction.
    account: fees
    direction: out
    triggers: []
  - type: homeloan_principal_payment_return
    target: homeloan_transactions
    meaning: A principal payment is returned unpaid and reversed.
    grain: One row per returned principal payment.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount of the original payment, USD.
      effective_date: Effective date of the original payment.
      source_ref_id: The principal payment reversed.
      return_reason: Bank return reason.
    account: principal
    direction: in
    triggers:
      - event: homeloan:homeloan_fee_assessed
        when: {return_reason: {not: unauthorized}}
        map: {fee_code: returned_payment, source_ref_id: txn_id, channel: system}
  - type: homeloan_interest_payment_return
    target: homeloan_transactions
    meaning: An interest payment is returned unpaid and reversed.
    grain: One row per returned interest payment.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount of the original payment, USD.
      effective_date: Effective date of the original payment.
      source_ref_id: The interest payment reversed.
      return_reason: Bank return reason.
    account: interest_accrued
    direction: in
    triggers: []
  - type: homeloan_escrow_deposit
    target: homeloan_escrow
    meaning: Money is deposited to escrow — the initial deposit at closing, the escrow share of a monthly payment, or a shortage paid in a lump sum.
    grain: One row per deposit.
    distinguish_by: [deposit_type, due_date, effective_date]
    fields:
      amount: Deposit, USD.
      effective_date: Date received.
      deposit_type: initial, monthly or shortage_lump_sum.
      due_date: Due date of the monthly payment for a monthly deposit, else empty.
      channel: Channel.
    account: escrow
    direction: in
    triggers: []
  - type: homeloan_escrow_disbursement
    target: homeloan_escrow
    meaning: Escrow pays a property tax installment, an insurance premium or a monthly mortgage insurance premium.
    grain: One row per bill paid.
    distinguish_by: [disbursement_type, coverage_period, payee]
    fields:
      amount: Amount paid, USD.
      effective_date: Date paid.
      disbursement_type: What was paid.
      payee: County treasurer or insurer.
      coverage_period: Tax year, policy term or month paid.
      channel: Always system.
    account: escrow
    direction: out
    triggers: []
  - type: homeloan_escrow_refund
    target: homeloan_escrow
    meaning: An escrow surplus from analysis, or the balance left at payoff, is refunded to the member.
    grain: One row per refund.
    distinguish_by: [effective_date]
    fields:
      amount: Refund, USD.
      effective_date: Date refunded.
      channel: Always system.
    account: escrow
    direction: out
    triggers: []
  - type: homeloan_escrow_deposit_return
    target: homeloan_escrow
    meaning: The escrow share of a returned payment is reversed.
    grain: One row per returned deposit.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount of the original deposit, USD.
      effective_date: Effective date of the original deposit.
      source_ref_id: The deposit reversed.
      channel: Always system.
    account: escrow
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: homeloan_msr_bill_paid
    window: All rows on the loan.
    measure: For one monthly bill, the sum of homeloan_interest_payment rows and homeloan_principal_payment rows with payment_purpose scheduled whose source_ref_id is that bill, minus returns of those payments.
  - id: homeloan_msr_past_due_payments
    window: Monthly bills whose due_date is earlier than the date considered.
    measure: Count of those bills with homeloan_msr_bill_paid below monthly_pi_amount (forborne months excluded).
  - id: homeloan_msr_days_late_history
    window: Monthly bills due in the months before the date considered, as far back as the longest look-back used.
    measure: For each bill, the calendar days from its due date to the effective date of the payment that completed it (or to the date considered if still open); used to count bills 30 or more and 60 or more days late in a look-back.
  - id: homeloan_msr_courtesy_waivers_12m
    window: Rolling 12 months ending on the date considered, from the same calendar date one year earlier (exclusive) through that date (inclusive).
    measure: Count of homeloan_fee_waiver rows on the loan with waiver_basis courtesy in the window.
  - id: homeloan_msr_payments_due_since_closing
    window: From opened_date through the date considered.
    measure: Count of monthly bills whose due_date has passed (forborne months excluded).
  - id: homeloan_msr_payments_made
    window: From opened_date through the date considered.
    measure: Count of monthly bills paid in full.
  - id: homeloan_msr_current_ltv
    window: The date considered.
    measure: principal_balance divided by original_value, as a percentage rounded to 2 decimals.
  - id: homeloan_msr_projected_disbursements
    window: The 12 months following the escrow analysis date.
    measure: Sum of the property tax installments, insurance premiums and mortgage insurance premiums expected to be paid from escrow in the window, each at the amount of the latest bill of the same kind.
  - id: homeloan_msr_projected_low_point
    window: The 12 months following the escrow analysis date.
    measure: Lowest month-end escrow balance projected from the current escrow_balance, the current monthly_escrow_amount deposits and the projected disbursements on their due months.
  - id: homeloan_msr_member_open_home_loans
    window: The member's Country Home loans at the date considered.
    measure: Count of the member's homeloan_loans in applied, active, forbearance or nonaccrual status, by occupancy.
  - id: homeloan_msr_active_farmland
    window: The member's portfolio at closing.
    measure: Count of the member's farmland_loans rows in active status.
  - id: homeloan_msr_sofr_index
    window: The 30-day Average SOFR history registered in homeloan_arm_adjustment.
    measure: Rate of the latest history entry published at least arm_index_lookback_days calendar days before the change date.

# ---- policies ----
policies:
  - id: homeloan_agg_multi_holding
    subject: [homeloan_loan_open]
    rule: >-
      A member may hold at most max_per_customer Country Home loans at a time in applied, active, forbearance or
      nonaccrual status, and at most one for each occupancy under homeloan_agg_occupancy; an investment or rental
      property is not financed as a Country Home loan at all.
    eligibility: []
    params:
      max_per_customer: 2

  - id: homeloan_agg_occupancy
    subject: [homeloan_loan_open, homeloan_loan_fund]
    rule: >-
      Home loans are aggregated by occupancy. A member may hold no more Country Home loans of one occupancy than
      max_loans_by_occupancy allows, counting loans in applied, active, forbearance or nonaccrual status
      (homeloan_msr_member_open_home_loans). A second Country Home loan of the same occupancy is not registered; a member
      moving to a new primary residence applies for the new loan as a primary residence only once the old one is paid
      off or is re-certified as a second home by the credit officer. A product limited to primary residences may not
      finance a second home.
    eligibility:
      - id: one_loan_per_occupancy
        applies_to: [homeloan_loan_open]
        kind: dedup
        condition: "A second Country Home loan of the same occupancy is not registered"
        evidence_fields: [homeloan_loans.customer_id, homeloan_loans.occupancy, homeloan_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_loans.customer_id, homeloan_loans.occupancy]]
          action_bindings: {homeloan_loans.customer_id: customer_id, homeloan_loans.occupancy: occupancy}
        dedup_contract:
          table: homeloan_loans
          mode: separate_record
          object_bindings: {customer_id: customer_id, occupancy: occupancy}
          duplicate_filters: {status: [applied, active, forbearance, nonaccrual]}
          distinct_fields: [property_parcel_number]
    measures: [homeloan_msr_member_open_home_loans]
    params:
      per_tier:
        Country Home 15-Year Fixed: {by_occupancy: "=max_loans_by_occupancy"}
        Country Home 20-Year Fixed: {by_occupancy: "=max_loans_by_occupancy"}
        Country Home 30-Year Fixed: {by_occupancy: "=max_loans_by_occupancy"}
        Country Home 5/6 Adjustable: {by_occupancy: "=max_loans_by_occupancy"}
        Country Home 7/6 Adjustable: {by_occupancy: "=max_loans_by_occupancy"}
        Country Home Jumbo 30-Year Fixed: {by_occupancy: "=max_loans_by_occupancy"}

  - id: homeloan_application_closing
    subject: [homeloan_loan_open, homeloan_loan_fund, homeloan_loan_decline]
    rule: >-
      An application is registered with the product's official name, amount, value, homesite and occupancy; a credit
      officer decides it and the servicing desk never approves or declines. The amount must lie between min_loan_usd and
      max_loan_usd and may not exceed max_ltv_purchase_pct (purchase) or max_ltv_refinance_pct (refinance) of the value; a
      homesite larger than max_homesite_acres is financed as farm real estate instead, and a manufactured home is eligible
      only where manufactured_home_allowed is true. A Country Home loan may be secured only by a homesite parcel that is
      not mortgaged to a farm real estate loan in active or nonaccrual status. A farmstead already under a farm
      real estate mortgage can be financed here only after it is released from that mortgage as a farmstead split. When
      the original principal exceeds mi_required_above_ltv_pct of original_value, private mortgage insurance is placed at
      the mi_premium_by_ltv band, annual premium on original principal divided by 12 and rounded to cents, paid monthly
      from escrow; a product with mi_required_above_ltv_pct of zero cannot exceed 80% loan-to-value. The loan closes only
      when the member holds the participation certificate or stock required under equity_stock_requirement and a
      homeowner's insurance declarations page naming the association mortgagee is received; escrow is established at
      closing unless waived, and is mandatory for flood insurance when the dwelling is in a special flood hazard area.
      An origination fee of origination_fee_pct of original principal, not less than origination_fee_min_usd, is assessed
      at closing.
    eligibility:
      - id: homesite_not_farm_mortgaged
        applies_to: [homeloan_loan_open, homeloan_loan_fund]
        kind: authorization
        condition: "A Country Home loan may be secured only by a homesite parcel that is not mortgaged to a farm real estate loan in active or nonaccrual status."
        evidence_fields: [farmland_parcels.parcel_number, farmland_parcels.event_type, farmland_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_parcels.parcel_number]]
          action_bindings: {farmland_parcels.parcel_number: property_parcel_number}
    params:
      per_tier:
        Country Home 15-Year Fixed: {min: "=min_loan_usd", max: "=max_loan_usd", ltv_purchase: "=max_ltv_purchase_pct", ltv_refi: "=max_ltv_refinance_pct", acres: "=max_homesite_acres", manufactured: "=manufactured_home_allowed", mi_above: "=mi_required_above_ltv_pct", mi_bands: "=mi_premium_by_ltv", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd"}
        Country Home 20-Year Fixed: {min: "=min_loan_usd", max: "=max_loan_usd", ltv_purchase: "=max_ltv_purchase_pct", ltv_refi: "=max_ltv_refinance_pct", acres: "=max_homesite_acres", manufactured: "=manufactured_home_allowed", mi_above: "=mi_required_above_ltv_pct", mi_bands: "=mi_premium_by_ltv", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd"}
        Country Home 30-Year Fixed: {min: "=min_loan_usd", max: "=max_loan_usd", ltv_purchase: "=max_ltv_purchase_pct", ltv_refi: "=max_ltv_refinance_pct", acres: "=max_homesite_acres", manufactured: "=manufactured_home_allowed", mi_above: "=mi_required_above_ltv_pct", mi_bands: "=mi_premium_by_ltv", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd"}
        Country Home 5/6 Adjustable: {min: "=min_loan_usd", max: "=max_loan_usd", ltv_purchase: "=max_ltv_purchase_pct", ltv_refi: "=max_ltv_refinance_pct", acres: "=max_homesite_acres", manufactured: "=manufactured_home_allowed", mi_above: "=mi_required_above_ltv_pct", mi_bands: "=mi_premium_by_ltv", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd"}
        Country Home 7/6 Adjustable: {min: "=min_loan_usd", max: "=max_loan_usd", ltv_purchase: "=max_ltv_purchase_pct", ltv_refi: "=max_ltv_refinance_pct", acres: "=max_homesite_acres", manufactured: "=manufactured_home_allowed", mi_above: "=mi_required_above_ltv_pct", mi_bands: "=mi_premium_by_ltv", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd"}
        Country Home Jumbo 30-Year Fixed: {min: "=min_loan_usd", max: "=max_loan_usd", ltv_purchase: "=max_ltv_purchase_pct", ltv_refi: "=max_ltv_refinance_pct", acres: "=max_homesite_acres", manufactured: "=manufactured_home_allowed", mi_above: "=mi_required_above_ltv_pct", mi_bands: "=mi_premium_by_ltv", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd"}
    formula:
      origination_fee: max(origination_fee_min_usd, round(original_principal * origination_fee_pct / 100, 2))

  - id: homeloan_rate_setting
    subject: [homeloan_loan_fund, homeloan_autopay_change]
    rule: >-
      The note rate at closing is the product's initial_rate_pct less the autopay discount autopay_rate_discount_pct when
      automatic debit is authorised at closing, and less the relationship discount relationship_rate_discount_pct when
      the member holds a Farm Real Estate loan in active status on the closing date (homeloan_msr_active_farmland at least
      1); the discounts are added and capped at rate_discount_cap_pct, and the rate is rounded to 3 decimal places. The
      monthly payment is the level payment amortising original principal over amortization_months at the note rate,
      rounded to cents. If automatic debit set up at closing is later cancelled, the autopay discount is removed: the
      note rate rises by autopay_rate_discount_pct from the next payment due date and the payment is re-amortised over the
      remaining months. Enrolling in automatic debit after closing, or moving it to another account, never lowers the
      rate. The relationship discount is fixed at closing.
    eligibility: []
    measures: [homeloan_msr_active_farmland]
    params:
      per_tier:
        Country Home 15-Year Fixed: {initial: "=initial_rate_pct", autopay: "=autopay_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct", months: "=amortization_months"}
        Country Home 20-Year Fixed: {initial: "=initial_rate_pct", autopay: "=autopay_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct", months: "=amortization_months"}
        Country Home 30-Year Fixed: {initial: "=initial_rate_pct", autopay: "=autopay_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct", months: "=amortization_months"}
        Country Home 5/6 Adjustable: {initial: "=initial_rate_pct", autopay: "=autopay_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct", months: "=amortization_months"}
        Country Home 7/6 Adjustable: {initial: "=initial_rate_pct", autopay: "=autopay_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct", months: "=amortization_months"}
        Country Home Jumbo 30-Year Fixed: {initial: "=initial_rate_pct", autopay: "=autopay_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct", months: "=amortization_months"}
    formula:
      autopay_part: autopay_rate_discount_pct if autopay_enrolled else 0
      relationship_part: relationship_rate_discount_pct if homeloan_msr_active_farmland >= 1 else 0
      interest_rate: round(initial_rate_pct - min(rate_discount_cap_pct, autopay_part + relationship_part), 3)

  - id: homeloan_arm_adjustment
    subject: [homeloan_rate_adjustment]
    rule: >-
      An adjustable loan's rate changes first on the day after rate_fixed_until and then every adjustment_interval_months
      calendar months. The new rate is the 30-day Average SOFR index value (homeloan_msr_sofr_index, the latest entry of
      sofr_30day_average_history published at least arm_index_lookback_days before the change date) plus arm_margin_pct,
      rounded to the nearest 0.125 percentage point, but it may move by no more than initial_adjustment_cap_pct at the
      first change and subsequent_adjustment_cap_pct at each later change, up or down, may not exceed initial_rate plus
      lifetime_cap_pct and may not be lower than rate_floor_pct. Any autopay discount given at closing continues to be
      subtracted after the caps. The payment is re-amortised over the remaining months at the new rate, effective with the
      first payment due after the change date. A fixed product never adjusts.
    eligibility: []
    measures: [homeloan_msr_sofr_index]
    params:
      sofr_30day_average_history:
        - {published: "2025-10-01", rate_pct: 4.312}
        - {published: "2025-11-03", rate_pct: 4.137}
        - {published: "2025-12-01", rate_pct: 3.981}
        - {published: "2026-02-02", rate_pct: 3.865}
        - {published: "2026-05-01", rate_pct: 3.712}
        - {published: "2026-08-03", rate_pct: 3.548}
      per_tier:
        Country Home 15-Year Fixed: {margin: "=arm_margin_pct", lookback: "=arm_index_lookback_days", first_cap: "=initial_adjustment_cap_pct", next_cap: "=subsequent_adjustment_cap_pct", life_cap: "=lifetime_cap_pct", interval: "=adjustment_interval_months", floor: "=rate_floor_pct"}
        Country Home 20-Year Fixed: {margin: "=arm_margin_pct", lookback: "=arm_index_lookback_days", first_cap: "=initial_adjustment_cap_pct", next_cap: "=subsequent_adjustment_cap_pct", life_cap: "=lifetime_cap_pct", interval: "=adjustment_interval_months", floor: "=rate_floor_pct"}
        Country Home 30-Year Fixed: {margin: "=arm_margin_pct", lookback: "=arm_index_lookback_days", first_cap: "=initial_adjustment_cap_pct", next_cap: "=subsequent_adjustment_cap_pct", life_cap: "=lifetime_cap_pct", interval: "=adjustment_interval_months", floor: "=rate_floor_pct"}
        Country Home 5/6 Adjustable: {margin: "=arm_margin_pct", lookback: "=arm_index_lookback_days", first_cap: "=initial_adjustment_cap_pct", next_cap: "=subsequent_adjustment_cap_pct", life_cap: "=lifetime_cap_pct", interval: "=adjustment_interval_months", floor: "=rate_floor_pct"}
        Country Home 7/6 Adjustable: {margin: "=arm_margin_pct", lookback: "=arm_index_lookback_days", first_cap: "=initial_adjustment_cap_pct", next_cap: "=subsequent_adjustment_cap_pct", life_cap: "=lifetime_cap_pct", interval: "=adjustment_interval_months", floor: "=rate_floor_pct"}
        Country Home Jumbo 30-Year Fixed: {margin: "=arm_margin_pct", lookback: "=arm_index_lookback_days", first_cap: "=initial_adjustment_cap_pct", next_cap: "=subsequent_adjustment_cap_pct", life_cap: "=lifetime_cap_pct", interval: "=adjustment_interval_months", floor: "=rate_floor_pct"}

  - id: homeloan_monthly_billing
    subject: [homeloan_payment_roll, homeloan_interest_accrual]
    rule: >-
      Payments are due on the first day of each month and interest is paid in arrears: the payment due on the first of a
      month carries one month's interest for the preceding month on interest_basis 30_360_monthly, that is the principal
      balance after the previous payment's principal share times the note rate divided by 12, rounded to cents, booked as
      one accrual row with that due date. The monthly payment due is monthly_pi_amount plus monthly_escrow_amount; of the
      principal-and-interest part, the billed interest is the interest share and the rest the principal share. No payment
      is billed for a forborne month. The final payment is the billed interest plus all principal outstanding.
    eligibility: []
    params:
      per_tier:
        Country Home 15-Year Fixed: {basis: "=interest_basis"}
        Country Home 20-Year Fixed: {basis: "=interest_basis"}
        Country Home 30-Year Fixed: {basis: "=interest_basis"}
        Country Home 5/6 Adjustable: {basis: "=interest_basis"}
        Country Home 7/6 Adjustable: {basis: "=interest_basis"}
        Country Home Jumbo 30-Year Fixed: {basis: "=interest_basis"}
    formula:
      amount: round(principal_balance * rate_applied / 100 / 12, 2)

  - id: homeloan_payment_application
    subject: [homeloan_interest_payment, homeloan_principal_payment, homeloan_fee_payment, homeloan_escrow_deposit]
    rule: >-
      A payment may be applied only while the loan is in active, forbearance or nonaccrual status. A remittance pays the
      oldest unpaid monthly payment first and is applied, for each monthly payment, to interest, then principal, then the
      escrow deposit (deposit_type monthly), each row pointing to that month's bill; a remittance smaller than a full
      monthly payment is not applied and is returned to the member. Money left after every monthly payment due is paid
      goes to principal as a curtailment, unless the member designates it for a fee or as a lump-sum escrow shortage
      payment. A curtailment never advances the next due date and never carries a penalty (prepayment_penalty_pct is
      zero). A payoff pays fees, billed interest, interest from the first day of the month of payoff through the payoff
      date at the note rate on an actual-day basis of 365, and all principal, with payment_purpose payoff.
    eligibility:
      - id: homeloan_accepts_payments
        applies_to: [homeloan_interest_payment, homeloan_principal_payment, homeloan_fee_payment]
        kind: state
        condition: "A payment may be applied only while the loan is in active, forbearance or nonaccrual status."
        evidence_fields: [homeloan_loans.status, homeloan_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_loans.loan_id]]
          action_bindings: {homeloan_loans.loan_id: loan_id}
        state_contract:
          field: homeloan_loans.status
          allowed: [active, forbearance, nonaccrual]
    measures: [homeloan_msr_bill_paid]
    params:
      per_tier:
        Country Home 15-Year Fixed: {penalty: "=prepayment_penalty_pct"}
        Country Home 20-Year Fixed: {penalty: "=prepayment_penalty_pct"}
        Country Home 30-Year Fixed: {penalty: "=prepayment_penalty_pct"}
        Country Home 5/6 Adjustable: {penalty: "=prepayment_penalty_pct"}
        Country Home 7/6 Adjustable: {penalty: "=prepayment_penalty_pct"}
        Country Home Jumbo 30-Year Fixed: {penalty: "=prepayment_penalty_pct"}

  - id: homeloan_evt_late_charge
    subject: [homeloan_fee_assessed, homeloan_fee_waiver]
    rule: >-
      A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date of
      the monthly payment, counted with the due date itself as day 0, so the charge first arises on the day after the last
      grace day. It applies to a monthly payment whose principal-and-interest part is not paid in full by then, at
      late_charge_pct of the scheduled principal-and-interest payment (monthly_pi_amount), no less than
      late_charge_min_usd and no more than late_charge_max_usd, rounded to cents, with source_ref_id the monthly bill. Only
      one late charge may be assessed per monthly payment. No late charge is assessed on the escrow part, on a forborne
      month, or while the loan is in nonaccrual status, and a late charge is never deducted from a later regular payment
      (which would make that payment late in turn). A late charge is waived with waiver_basis error_correction when a
      payment effective on or before the last grace day paid the month in full; on request it may be waived with
      waiver_basis courtesy only when that month has since been paid in full and homeloan_msr_courtesy_waivers_12m is
      below courtesy_waivers_per_12_months.
    eligibility:
      - id: homeloan_late_after_grace
        applies_to: [homeloan_fee_assessed]
        kind: time
        condition: "A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date of the monthly payment"
        evidence_fields: [homeloan_transactions.due_date, homeloan_transactions.txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_transactions.txn_id]]
          action_bindings: {homeloan_transactions.txn_id: source_ref_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the due date of the monthly payment"
          anchor_source: homeloan_transactions.due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: "counted with the due date itself as day 0, so the charge first arises on the day after the last grace day"
          boundary: exclusive
      - id: homeloan_one_late_charge
        applies_to: [homeloan_fee_assessed]
        kind: dedup
        condition: "Only one late charge may be assessed per monthly payment."
        evidence_fields: [homeloan_transactions.source_ref_id, homeloan_transactions.fee_code, homeloan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_transactions.source_ref_id]]
          action_bindings: {homeloan_transactions.source_ref_id: source_ref_id}
        dedup_contract:
          table: homeloan_transactions
          mode: separate_record
          object_bindings: {source_ref_id: source_ref_id}
          duplicate_filters: {event_type: [homeloan_fee_assessed], fee_code: [late_charge]}
          distinct_fields: []
    measures: [homeloan_msr_bill_paid, homeloan_msr_courtesy_waivers_12m]
    params:
      per_tier:
        Country Home 15-Year Fixed: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Country Home 20-Year Fixed: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Country Home 30-Year Fixed: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Country Home 5/6 Adjustable: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Country Home 7/6 Adjustable: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Country Home Jumbo 30-Year Fixed: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
    formula:
      late_charge: min(late_charge_max_usd, max(late_charge_min_usd, round(monthly_pi_amount * late_charge_pct / 100, 2)))

  - id: homeloan_evt_returned_payment
    subject: [homeloan_principal_payment_return, homeloan_interest_payment_return, homeloan_escrow_deposit_return, homeloan_fee_assessed]
    rule: >-
      A returned payment is reversed row by row — interest, principal and escrow deposit — each return row carrying the
      original row's amount and effective date and pointing to it, which reopens the monthly payment it had paid. A
      payment may be reversed only once. One returned payment fee of returned_payment_fee_usd is assessed per returned
      remittance (booked from the principal return row) unless the return reason is unauthorized. If the reopened month is
      now past its grace period, its late charge is assessed under homeloan_evt_late_charge.
    eligibility:
      - id: homeloan_reverse_once
        applies_to: [homeloan_principal_payment_return, homeloan_interest_payment_return]
        kind: dedup
        condition: "A payment may be reversed only once."
        evidence_fields: [homeloan_transactions.source_ref_id, homeloan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_transactions.source_ref_id]]
          action_bindings: {homeloan_transactions.source_ref_id: source_ref_id}
        dedup_contract:
          table: homeloan_transactions
          mode: separate_record
          object_bindings: {source_ref_id: source_ref_id}
          duplicate_filters: {event_type: [homeloan_principal_payment_return, homeloan_interest_payment_return]}
          distinct_fields: []
    params:
      per_tier:
        Country Home 15-Year Fixed: {fee: "=returned_payment_fee_usd"}
        Country Home 20-Year Fixed: {fee: "=returned_payment_fee_usd"}
        Country Home 30-Year Fixed: {fee: "=returned_payment_fee_usd"}
        Country Home 5/6 Adjustable: {fee: "=returned_payment_fee_usd"}
        Country Home 7/6 Adjustable: {fee: "=returned_payment_fee_usd"}
        Country Home Jumbo 30-Year Fixed: {fee: "=returned_payment_fee_usd"}

  - id: homeloan_escrow_analysis_rule
    subject: [homeloan_escrow_analysis, homeloan_escrow_refund, homeloan_escrow_deposit]
    rule: >-
      Escrow is analysed once a year in the month of the closing anniversary, and at the end of a forbearance plan. The
      analysis projects the next 12 months of disbursements (homeloan_msr_projected_disbursements); the base deposit is
      one-twelfth of that total rounded up to the cent, and the account may keep a cushion of escrow_cushion_months
      twelfths of the total above zero at its projected low point. When the projected low point
      (homeloan_msr_projected_low_point) is below the cushion, the difference is a shortage: it is added to the base
      deposit in equal parts over escrow_shortage_spread_months, unless the member pays it at once as a shortage_lump_sum
      deposit, in which case the deposit is the base deposit alone. When the projected low point exceeds the cushion, the
      difference is a surplus: a surplus of at least escrow_surplus_refund_min_usd is refunded within
      escrow_surplus_refund_days calendar days of the analysis when no monthly payment is past due; a smaller surplus, or
      any surplus while a payment is past due, stays in escrow and lowers the projection. A loan with escrow waived has no
      analysis. At payoff, any escrow balance is refunded within escrow_surplus_refund_days calendar days.
    eligibility: []
    measures: [homeloan_msr_projected_disbursements, homeloan_msr_projected_low_point, homeloan_msr_past_due_payments]
    params:
      per_tier:
        Country Home 15-Year Fixed: {cushion_months: "=escrow_cushion_months", refund_min: "=escrow_surplus_refund_min_usd", spread_months: "=escrow_shortage_spread_months", refund_days: "=escrow_surplus_refund_days"}
        Country Home 20-Year Fixed: {cushion_months: "=escrow_cushion_months", refund_min: "=escrow_surplus_refund_min_usd", spread_months: "=escrow_shortage_spread_months", refund_days: "=escrow_surplus_refund_days"}
        Country Home 30-Year Fixed: {cushion_months: "=escrow_cushion_months", refund_min: "=escrow_surplus_refund_min_usd", spread_months: "=escrow_shortage_spread_months", refund_days: "=escrow_surplus_refund_days"}
        Country Home 5/6 Adjustable: {cushion_months: "=escrow_cushion_months", refund_min: "=escrow_surplus_refund_min_usd", spread_months: "=escrow_shortage_spread_months", refund_days: "=escrow_surplus_refund_days"}
        Country Home 7/6 Adjustable: {cushion_months: "=escrow_cushion_months", refund_min: "=escrow_surplus_refund_min_usd", spread_months: "=escrow_shortage_spread_months", refund_days: "=escrow_surplus_refund_days"}
        Country Home Jumbo 30-Year Fixed: {cushion_months: "=escrow_cushion_months", refund_min: "=escrow_surplus_refund_min_usd", spread_months: "=escrow_shortage_spread_months", refund_days: "=escrow_surplus_refund_days"}
    formula:
      cushion: round(homeloan_msr_projected_disbursements * escrow_cushion_months / 12, 2)
      shortage: max(0, cushion - homeloan_msr_projected_low_point)
      surplus: max(0, homeloan_msr_projected_low_point - cushion)
      monthly_escrow_amount: round(homeloan_msr_projected_disbursements / 12 + shortage / escrow_shortage_spread_months, 2)

  - id: homeloan_escrow_disbursement_rule
    subject: [homeloan_escrow_disbursement]
    rule: >-
      From escrow the association pays each property tax installment to the county treasurer before its delinquency date,
      each homeowner's and flood insurance premium to the insurer by its due date, and each month's mortgage insurance
      premium, as billed. A bill is paid even when the escrow balance is insufficient; the account then runs negative and
      the deficiency is recovered at the next analysis. Each tax year, policy term and mortgage insurance month is paid
      once. A loan with escrow waived has no disbursements, except flood insurance, which can never be waived for a
      dwelling in a special flood hazard area.
    eligibility:
      - id: one_disbursement_per_bill
        applies_to: [homeloan_escrow_disbursement]
        kind: dedup
        condition: "Each tax year, policy term and mortgage insurance month is paid once."
        evidence_fields: [homeloan_escrow.loan_id, homeloan_escrow.disbursement_type, homeloan_escrow.coverage_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_escrow.loan_id, homeloan_escrow.disbursement_type, homeloan_escrow.coverage_period]]
          action_bindings: {homeloan_escrow.loan_id: loan_id, homeloan_escrow.disbursement_type: disbursement_type, homeloan_escrow.coverage_period: coverage_period}
        dedup_contract:
          table: homeloan_escrow
          mode: separate_record
          object_bindings: {loan_id: loan_id, disbursement_type: disbursement_type, coverage_period: coverage_period}
          duplicate_filters: {event_type: [homeloan_escrow_disbursement]}
          distinct_fields: [payee]

  - id: homeloan_escrow_waiver_rule
    subject: [homeloan_escrow_waiver, homeloan_fee_assessed]
    rule: >-
      At the member's request, registered as an escrow_waiver request, escrow for taxes and homeowner's insurance may be
      waived. Escrow may not be waived while the dwelling lies in a special flood hazard area. A waiver further requires
      that principal is at or below escrow_waiver_max_ltv_pct of original_value (homeloan_msr_current_ltv), that mortgage
      insurance is no longer in force, that at least escrow_waiver_min_months_seasoning monthly payments have come due
      since closing (homeloan_msr_payments_due_since_closing), that no payment has been 30 or more days late in the last 12
      months, and that no payment is past due. On the waiver a fee of escrow_waiver_fee_pct of the principal balance,
      rounded to cents, is assessed, the escrow balance is refunded within escrow_surplus_refund_days calendar days, and
      the member pays taxes and insurance directly from then on. A waiver is revoked by the association, and escrow
      re-established at the next analysis, if a tax installment becomes delinquent or insurance lapses.
    eligibility:
      - id: no_waiver_in_flood_zone
        applies_to: [homeloan_escrow_waiver]
        kind: state
        condition: "Escrow may not be waived while the dwelling lies in a special flood hazard area."
        evidence_fields: [homeloan_loans.flood_zone, homeloan_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_loans.loan_id]]
          action_bindings: {homeloan_loans.loan_id: loan_id}
        state_contract:
          field: homeloan_loans.flood_zone
          allowed: [outside_sfha]
    measures: [homeloan_msr_current_ltv, homeloan_msr_payments_due_since_closing, homeloan_msr_days_late_history]
    params:
      late_lookback_months: 12
      per_tier:
        Country Home 15-Year Fixed: {max_ltv: "=escrow_waiver_max_ltv_pct", fee_pct: "=escrow_waiver_fee_pct", seasoning: "=escrow_waiver_min_months_seasoning"}
        Country Home 20-Year Fixed: {max_ltv: "=escrow_waiver_max_ltv_pct", fee_pct: "=escrow_waiver_fee_pct", seasoning: "=escrow_waiver_min_months_seasoning"}
        Country Home 30-Year Fixed: {max_ltv: "=escrow_waiver_max_ltv_pct", fee_pct: "=escrow_waiver_fee_pct", seasoning: "=escrow_waiver_min_months_seasoning"}
        Country Home 5/6 Adjustable: {max_ltv: "=escrow_waiver_max_ltv_pct", fee_pct: "=escrow_waiver_fee_pct", seasoning: "=escrow_waiver_min_months_seasoning"}
        Country Home 7/6 Adjustable: {max_ltv: "=escrow_waiver_max_ltv_pct", fee_pct: "=escrow_waiver_fee_pct", seasoning: "=escrow_waiver_min_months_seasoning"}
        Country Home Jumbo 30-Year Fixed: {max_ltv: "=escrow_waiver_max_ltv_pct", fee_pct: "=escrow_waiver_fee_pct", seasoning: "=escrow_waiver_min_months_seasoning"}
    formula:
      waiver_fee: round(principal_balance * escrow_waiver_fee_pct / 100, 2)
      ltv_ok: homeloan_msr_current_ltv <= escrow_waiver_max_ltv_pct

  - id: homeloan_mi_cancellation_rule
    subject: [homeloan_mi_cancellation, homeloan_fee_assessed]
    rule: >-
      Private mortgage insurance ends in one of two ways. On the member's written request, registered as an
      mi_cancellation request, it is cancelled once principal is at or below mi_borrower_cancel_ltv_pct of original_value
      (homeloan_msr_current_ltv, so curtailments count), provided no payment has been 30 or more days late in the
      mi_cancel_no_30day_late_months before the request, none 60 or more days late in the mi_cancel_no_60day_late_months
      before it, no payment is past due, and a broker price opinion ordered at the member's cost of mi_valuation_fee_usd
      shows the home's value is not below original_value. Mortgage insurance may be cancelled on request only when the
      member has a mortgage insurance cancellation request on file for the loan. Independently, it terminates
      automatically on the first payment due date on which principal is scheduled under the original amortization to
      reach mi_auto_termination_ltv_pct of original_value, provided the loan is current, with no request and no valuation
      fee. In either case the premium stops with the next payment due date and the escrow deposit is reduced by it at
      once; premiums already paid are not refunded. Value is always measured against original_value, never against a new
      appraisal of a higher value.
    eligibility:
      - id: mi_request_on_file
        applies_to: [homeloan_mi_cancellation]
        kind: authorization
        condition: "Mortgage insurance may be cancelled on request only when the member has a mortgage insurance cancellation request on file for the loan."
        evidence_fields: [homeloan_requests.loan_id, homeloan_requests.request_type, homeloan_requests.request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_requests.loan_id]]
          action_bindings: {homeloan_requests.loan_id: loan_id}
    measures: [homeloan_msr_current_ltv, homeloan_msr_days_late_history, homeloan_msr_past_due_payments]
    params:
      per_tier:
        Country Home 15-Year Fixed: {request_ltv: "=mi_borrower_cancel_ltv_pct", auto_ltv: "=mi_auto_termination_ltv_pct", no_30: "=mi_cancel_no_30day_late_months", no_60: "=mi_cancel_no_60day_late_months", valuation_fee: "=mi_valuation_fee_usd"}
        Country Home 20-Year Fixed: {request_ltv: "=mi_borrower_cancel_ltv_pct", auto_ltv: "=mi_auto_termination_ltv_pct", no_30: "=mi_cancel_no_30day_late_months", no_60: "=mi_cancel_no_60day_late_months", valuation_fee: "=mi_valuation_fee_usd"}
        Country Home 30-Year Fixed: {request_ltv: "=mi_borrower_cancel_ltv_pct", auto_ltv: "=mi_auto_termination_ltv_pct", no_30: "=mi_cancel_no_30day_late_months", no_60: "=mi_cancel_no_60day_late_months", valuation_fee: "=mi_valuation_fee_usd"}
        Country Home 5/6 Adjustable: {request_ltv: "=mi_borrower_cancel_ltv_pct", auto_ltv: "=mi_auto_termination_ltv_pct", no_30: "=mi_cancel_no_30day_late_months", no_60: "=mi_cancel_no_60day_late_months", valuation_fee: "=mi_valuation_fee_usd"}
        Country Home 7/6 Adjustable: {request_ltv: "=mi_borrower_cancel_ltv_pct", auto_ltv: "=mi_auto_termination_ltv_pct", no_30: "=mi_cancel_no_30day_late_months", no_60: "=mi_cancel_no_60day_late_months", valuation_fee: "=mi_valuation_fee_usd"}
        Country Home Jumbo 30-Year Fixed: {request_ltv: "=mi_borrower_cancel_ltv_pct", auto_ltv: "=mi_auto_termination_ltv_pct", no_30: "=mi_cancel_no_30day_late_months", no_60: "=mi_cancel_no_60day_late_months", valuation_fee: "=mi_valuation_fee_usd"}
    formula:
      request_ltv_met: homeloan_msr_current_ltv <= mi_borrower_cancel_ltv_pct

  - id: homeloan_recast_rule
    subject: [homeloan_recast, homeloan_fee_assessed]
    rule: >-
      On a product with recast_allowed true, the member may ask, through a recast request, to recast the monthly payment
      after a single curtailment of at least recast_min_curtailment_usd. A recast may be made only while the loan is in
      active status. No payment may be past due. The new monthly payment amortises the principal balance after the
      curtailment over the months remaining to the unchanged maturity date at the current note rate, rounded to cents,
      effective with the next payment due date, and recast_fee_usd is assessed. Adjustable products are re-amortised at
      their change dates instead and are never recast.
    eligibility:
      - id: recast_active_loan
        applies_to: [homeloan_recast]
        kind: state
        condition: "A recast may be made only while the loan is in active status."
        evidence_fields: [homeloan_loans.status, homeloan_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_loans.loan_id]]
          action_bindings: {homeloan_loans.loan_id: loan_id}
        state_contract:
          field: homeloan_loans.status
          allowed: [active]
    params:
      per_tier:
        Country Home 15-Year Fixed: {allowed: "=recast_allowed", min: "=recast_min_curtailment_usd", fee: "=recast_fee_usd"}
        Country Home 20-Year Fixed: {allowed: "=recast_allowed", min: "=recast_min_curtailment_usd", fee: "=recast_fee_usd"}
        Country Home 30-Year Fixed: {allowed: "=recast_allowed", min: "=recast_min_curtailment_usd", fee: "=recast_fee_usd"}
        Country Home 5/6 Adjustable: {allowed: "=recast_allowed", min: "=recast_min_curtailment_usd", fee: "=recast_fee_usd"}
        Country Home 7/6 Adjustable: {allowed: "=recast_allowed", min: "=recast_min_curtailment_usd", fee: "=recast_fee_usd"}
        Country Home Jumbo 30-Year Fixed: {allowed: "=recast_allowed", min: "=recast_min_curtailment_usd", fee: "=recast_fee_usd"}

  - id: homeloan_forbearance_rule
    subject: [homeloan_forbearance_grant, homeloan_forbearance_end]
    rule: >-
      A member facing a hardship may ask, through a forbearance request stating the months wanted, to suspend monthly
      payments. Forbearance is granted only when the member states a hardship that interrupts the household's ability to
      pay — a natural disaster affecting the home, loss of employment income, serious illness, or the death of a
      borrower or wage earner. It further requires that the loan is in active status with at least
      forbearance_min_payments_made monthly payments made since closing (homeloan_msr_payments_made), that the plan is
      no longer than forbearance_max_months_per_plan months and that forbearance_months_used plus the plan months does
      not exceed forbearance_max_months_life. No payment is billed for the plan months, no late charge arises for them,
      and interest continues to accrue on principal. When the plan ends the forborne months are moved to the end of the
      loan, the maturity date moves out by the plan months, regular payments resume with the next due date, and escrow is
      re-analysed. A member who cannot resume payments at the end of a plan is referred to a loan officer.
    eligibility:
      - id: hardship_stated
        applies_to: [homeloan_forbearance_grant]
        kind: caller_fact
        condition: "Forbearance is granted only when the member states a hardship that interrupts the household's ability to pay — a natural disaster affecting the home, loss of employment income, serious illness, or the death of a borrower or wage earner."
        evidence_fields: [homeloan_requests.loan_id, homeloan_requests.request_type]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[homeloan_requests.loan_id]]
          action_bindings: {homeloan_requests.loan_id: loan_id}
    measures: [homeloan_msr_payments_made]
    params:
      per_tier:
        Country Home 15-Year Fixed: {per_plan: "=forbearance_max_months_per_plan", life: "=forbearance_max_months_life", min_paid: "=forbearance_min_payments_made"}
        Country Home 20-Year Fixed: {per_plan: "=forbearance_max_months_per_plan", life: "=forbearance_max_months_life", min_paid: "=forbearance_min_payments_made"}
        Country Home 30-Year Fixed: {per_plan: "=forbearance_max_months_per_plan", life: "=forbearance_max_months_life", min_paid: "=forbearance_min_payments_made"}
        Country Home 5/6 Adjustable: {per_plan: "=forbearance_max_months_per_plan", life: "=forbearance_max_months_life", min_paid: "=forbearance_min_payments_made"}
        Country Home 7/6 Adjustable: {per_plan: "=forbearance_max_months_per_plan", life: "=forbearance_max_months_life", min_paid: "=forbearance_min_payments_made"}
        Country Home Jumbo 30-Year Fixed: {per_plan: "=forbearance_max_months_per_plan", life: "=forbearance_max_months_life", min_paid: "=forbearance_min_payments_made"}

  - id: homeloan_nonaccrual_status
    subject: [homeloan_nonaccrual, homeloan_accrual_restore]
    rule: >-
      A loan in active status is placed in nonaccrual when a monthly payment remains not paid in full more than
      nonaccrual_past_due_days calendar days after its due date, the due date being day 0; payments continue to be
      applied, late charges stop, and no recast, escrow waiver or mortgage insurance cancellation on request is available.
      The loan returns to active status on the day every past-due monthly payment is paid in full. A loan in forbearance is
      not placed in nonaccrual for forborne months.
    eligibility: []
    measures: [homeloan_msr_past_due_payments]
    params:
      per_tier:
        Country Home 15-Year Fixed: {days: "=nonaccrual_past_due_days"}
        Country Home 20-Year Fixed: {days: "=nonaccrual_past_due_days"}
        Country Home 30-Year Fixed: {days: "=nonaccrual_past_due_days"}
        Country Home 5/6 Adjustable: {days: "=nonaccrual_past_due_days"}
        Country Home 7/6 Adjustable: {days: "=nonaccrual_past_due_days"}
        Country Home Jumbo 30-Year Fixed: {days: "=nonaccrual_past_due_days"}

  - id: homeloan_payoff
    subject: [homeloan_loan_payoff, homeloan_escrow_refund]
    rule: >-
      A payoff statement for the payoff date the member names states unpaid fees, unpaid billed interest, interest from
      the first day of the payoff month through the payoff date at the note rate on 365 days, and the principal balance;
      the escrow balance is not netted against the payoff but refunded separately within escrow_surplus_refund_days
      calendar days after payoff. There is no prepayment penalty and no fee for the statement. The statement is good
      through payoff_quote_valid_days calendar days after its date, the statement date being day 0. The loan is paid off on
      the effective date of the payment that brings principal, interest and fees to zero, and the deed of reconveyance is
      sent for recording within lien_release_days calendar days.
    eligibility: []
    params:
      per_tier:
        Country Home 15-Year Fixed: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_days", refund_days: "=escrow_surplus_refund_days"}
        Country Home 20-Year Fixed: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_days", refund_days: "=escrow_surplus_refund_days"}
        Country Home 30-Year Fixed: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_days", refund_days: "=escrow_surplus_refund_days"}
        Country Home 5/6 Adjustable: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_days", refund_days: "=escrow_surplus_refund_days"}
        Country Home 7/6 Adjustable: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_days", refund_days: "=escrow_surplus_refund_days"}
        Country Home Jumbo 30-Year Fixed: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_days", refund_days: "=escrow_surplus_refund_days"}

  - id: homeloan_insurance_requirement
    subject: [homeloan_insurance_update, homeloan_fee_assessed]
    rule: >-
      The home must be insured against fire and extended perils for at least the lesser of its replacement cost and the
      principal balance, with the association named mortgagee. A new declarations page is recorded with its expiry date
      as printed; the member's word is not proof. When the record shows no coverage after the expiry date, the member is
      sent a first notice and, at least 15 days before placement, a second notice; if proof is not received by the end of
      lender_placed_notice_days calendar days after the first notice, the association places coverage and assesses its
      premium, lender_placed_annual_pct of the principal balance for one year, with fee_code lender_placed_insurance.
      Proof of coverage with no gap received later waives the premium with waiver_basis error_correction. Where escrow
      is not waived, premiums of the member's own policy are paid from escrow under homeloan_escrow_disbursement_rule.
    eligibility: []
    params:
      per_tier:
        Country Home 15-Year Fixed: {notice_days: "=lender_placed_notice_days", pct: "=lender_placed_annual_pct"}
        Country Home 20-Year Fixed: {notice_days: "=lender_placed_notice_days", pct: "=lender_placed_annual_pct"}
        Country Home 30-Year Fixed: {notice_days: "=lender_placed_notice_days", pct: "=lender_placed_annual_pct"}
        Country Home 5/6 Adjustable: {notice_days: "=lender_placed_notice_days", pct: "=lender_placed_annual_pct"}
        Country Home 7/6 Adjustable: {notice_days: "=lender_placed_notice_days", pct: "=lender_placed_annual_pct"}
        Country Home Jumbo 30-Year Fixed: {notice_days: "=lender_placed_notice_days", pct: "=lender_placed_annual_pct"}
    formula:
      premium: round(principal_balance * lender_placed_annual_pct / 100, 2)

  - id: homeloan_autopay_enrolment
    subject: [homeloan_autopay_change]
    rule: >-
      Automatic debit of monthly payments is authorised, moved or cancelled only on the member's own instruction, the
      account identified by the last four digits the member gives, recorded exactly as given. Autopay may be changed
      only while the loan is in active, forbearance or nonaccrual status. The full monthly payment is debited on the due
      date. Cancelling autopay that was set up at closing removes the closing autopay discount under
      homeloan_rate_setting; moving the debit to another account keeps it.
    eligibility:
      - id: homeloan_autopay_open
        applies_to: [homeloan_autopay_change]
        kind: state
        condition: "Autopay may be changed only while the loan is in active, forbearance or nonaccrual status."
        evidence_fields: [homeloan_loans.status, homeloan_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_loans.loan_id]]
          action_bindings: {homeloan_loans.loan_id: loan_id}
        state_contract:
          field: homeloan_loans.status
          allowed: [active, forbearance, nonaccrual]

# ---- extended policies (difficulty country_home_loan_servicing) ----
extended_policies:
  - id: homeloan_ext_late_charge_reopened_month
    base_policy_refs:
    - homeloan_evt_late_charge
    - homeloan_evt_returned_payment
    - homeloan_escrow_waiver_rule
    - homeloan_mi_cancellation_rule
    - homeloan_recast_rule
    - homeloan_insurance_requirement
    overwrite:
    - base_policy: homeloan_evt_late_charge
      superseded_clause: It applies to a monthly payment whose principal-and-interest part is not paid in full by
        then, at late_charge_pct of the scheduled principal-and-interest payment (monthly_pi_amount), no less than
        late_charge_min_usd and no more than late_charge_max_usd, rounded to cents, with source_ref_id the monthly
        bill.
      replaced_by: 'The charge is figured in this order: first the gross charge is measured under the loan''s note
        as set out above; then the relationship relief percentage is taken off that gross charge once; then the result
        is raised to the floor if it is below it and lowered to the product''s late_charge_max_usd if it is above
        it; the late charge is that figure rounded to the cent, rounded only at the end.'
    - base_policy: homeloan_evt_late_charge
      superseded_clause: No late charge is assessed on the escrow part, on a forborne month, or while the loan is
        in nonaccrual status
      replaced_by: No late charge is assessed on a forborne month or while the loan is in nonaccrual status, and the
        escrow deposit enters the measure of a late charge only where the loan's note measures the charge on the whole
        monthly installment.
    trigger: state_due
    subject:
    - homeloan_fee_assessed
    computes: late_charge_amount
    target_tool: assess_late_charge_eed44226
    params:
      first_late_rate_pct: 3.0
      second_late_rate_pct: 4.0
      relief_full_pct: 80.0
      relief_part_pct: 35.0
      seasoned_months: 60
      seasoned_floor_usd: 10.0
      seasoned_late_floor_usd: 12.5
      legacy_note_before: '2016-01-01'
      uniform_note_from: '2021-01-01'
      legacy_flat_charge_usd: 25.0
    rule: >-
      This rule figures the late charge owed on a monthly payment that is still not paid in full after its grace period,
      booked against that monthly bill; the grace period, the one-charge-per-payment limit and the months that carry
      no charge are those of the late charge rule of the product. A late charge is measured on the monthly principal-and-interest
      payment on the loan record. The charge is the product's late_charge_pct of that payment, no less than the product's
      late_charge_min_usd and no more than its late_charge_max_usd, rounded to the cent. The late charges that count
      toward the late charge rate are the late charges assessed on the home loan in the twelve months up to today
      less the late charge waivers recorded on the home loan in those twelve months, whether granted as an error correction
      or as a courtesy, since a waived charge is not held against the member. The late charge rate depends on the
      late charges that count: with none, the rate is first_late_rate_pct percent; with exactly one, it is second_late_rate_pct
      percent; with two or more, it is the product's late_charge_pct. Relationship relief on a late charge depends
      on the member's farm real estate lending with the association: a member whose farm real estate loan is active
      and shows at least two farm principal installments paid and no farm loan late charge in the last 24 months,
      an installment whose remittance was returned not counting as paid, has relief_full_pct percent of the charge
      taken off; a member whose farm real estate loan is active and shows a farm loan late charge in the last 24 months
      has relief_part_pct percent taken off; any other member, including one with no active farm real estate loan
      and one whose active farm loan shows fewer than two farm principal installments paid and no farm loan late charge
      in those 24 months, has no relief. The smallest late charge depends on the member's standing on the home loan:
      a loan open more than seasoned_months months with no late charge that counts toward the rate has a floor of
      seasoned_floor_usd; a loan open more than seasoned_months months with one or more late charges that count has
      a floor of seasoned_late_floor_usd; any other loan has the product's late_charge_min_usd as its floor. How the
      gross charge is measured depends on the note the loan was closed on: a loan opened before legacy_note_before
      was closed on the association's former rural residence note, which sets a flat late charge of legacy_flat_charge_usd
      as the gross charge whatever the late charge rate; a loan opened on or after legacy_note_before and before uniform_note_from
      was closed on the association's own installment note, which measures the charge on the whole monthly installment,
      the monthly principal-and-interest payment and the monthly escrow deposit on the loan record together, multiplied
      by the late charge rate and divided by 100; any other loan, opened on or after uniform_note_from, was closed
      on the uniform secondary-market note, which measures the charge on the monthly principal-and-interest payment
      on the loan record alone, multiplied by the late charge rate and divided by 100. No late charge is assessed
      on a forborne month or while the loan is in nonaccrual status, and the escrow deposit enters the measure of
      a late charge only where the loan's note measures the charge on the whole monthly installment. The charge is
      figured in this order: first the gross charge is measured under the loan's note as set out above; then the relationship
      relief percentage is taken off that gross charge once; then the result is raised to the floor if it is below
      it and lowered to the product's late_charge_max_usd if it is above it; the late charge is that figure rounded
      to the cent, rounded only at the end.
    prerequisite: []
    cross_category:
    - category: farmland
      as: history
      reads:
      - status
      - farmland_transactions.event_type
      - farmland_transactions.fee_code
      - farmland_transactions.effective_date
      note: The relationship relief tier is decided from the member's farm real estate loan status and its installment
        and late-charge ledger over 24 months.
    compute:
    - lates_12: COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_fee_assessed',
        fee_code='late_charge')
    - waived_12: COUNT('homeloan_transactions', within_months=12, date_field='effective_date', event_type='homeloan_fee_waiver',
        fee_code='late_charge')
    - counted: lates_12 - waived_12
    - rate: K('first_late_rate_pct') if counted == 0 else (K('second_late_rate_pct') if counted == 1 else P('late_charge_pct'))
    - farm_paid_24: XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_principal_payment')
        - XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_principal_payment_return')
    - farm_late_24: XCOUNT('farmland', 'farmland_transactions', within_months=24, date_field='effective_date', event_type='farmland_fee_assessed',
        fee_code='late_charge')
    - relief: K('relief_full_pct') if EXISTS('farmland', status='active') and farm_paid_24 >= 2 and farm_late_24 ==
        0 else (K('relief_part_pct') if EXISTS('farmland', status='active') and farm_late_24 > 0 else 0)
    - loan_age: MONTHS(F('opened_date'), NOW)
    - floor: K('seasoned_floor_usd') if loan_age > K('seasoned_months') and counted == 0 else (K('seasoned_late_floor_usd')
        if loan_age > K('seasoned_months') and counted > 0 else P('late_charge_min_usd'))
    - note_age_days: DAYS(F('opened_date'), K('uniform_note_from'))
    - legacy_days: DAYS(F('opened_date'), K('legacy_note_before'))
    - gross: K('legacy_flat_charge_usd') if legacy_days > 0 else ((F('monthly_pi_amount') + F('monthly_escrow_amount'))
        * rate / 100 if note_age_days > 0 else F('monthly_pi_amount') * rate / 100)
    - result: RND(MN(P('late_charge_max_usd'), MX(floor, gross * (100 - relief) / 100)), 2)
    compute_basis:
      lates_12: The late charges that count toward the late charge rate are the late charges assessed on the home
        loan in the twelve months up to today less the late charge waivers recorded on the home loan in those twelve
        months, whether granted as an error correction or as a courtesy, since a waived charge is not held against
        the member.
      waived_12: The late charges that count toward the late charge rate are the late charges assessed on the home
        loan in the twelve months up to today less the late charge waivers recorded on the home loan in those twelve
        months, whether granted as an error correction or as a courtesy, since a waived charge is not held against
        the member.
      counted: The late charges that count toward the late charge rate are the late charges assessed on the home loan
        in the twelve months up to today less the late charge waivers recorded on the home loan in those twelve months,
        whether granted as an error correction or as a courtesy, since a waived charge is not held against the member.
      rate: 'The late charge rate depends on the late charges that count: with none, the rate is first_late_rate_pct
        percent; with exactly one, it is second_late_rate_pct percent; with two or more, it is the product''s late_charge_pct.'
      farm_paid_24: 'Relationship relief on a late charge depends on the member''s farm real estate lending with the
        association: a member whose farm real estate loan is active and shows at least two farm principal installments
        paid and no farm loan late charge in the last 24 months, an installment whose remittance was returned not
        counting as paid, has relief_full_pct percent of the charge taken off; a member whose farm real estate loan
        is active and shows a farm loan late charge in the last 24 months has relief_part_pct percent taken off; any
        other member, including one with no active farm real estate loan and one whose active farm loan shows fewer
        than two farm principal installments paid and no farm loan late charge in those 24 months, has no relief.'
      farm_late_24: 'Relationship relief on a late charge depends on the member''s farm real estate lending with the
        association: a member whose farm real estate loan is active and shows at least two farm principal installments
        paid and no farm loan late charge in the last 24 months, an installment whose remittance was returned not
        counting as paid, has relief_full_pct percent of the charge taken off; a member whose farm real estate loan
        is active and shows a farm loan late charge in the last 24 months has relief_part_pct percent taken off; any
        other member, including one with no active farm real estate loan and one whose active farm loan shows fewer
        than two farm principal installments paid and no farm loan late charge in those 24 months, has no relief.'
      relief: 'Relationship relief on a late charge depends on the member''s farm real estate lending with the association:
        a member whose farm real estate loan is active and shows at least two farm principal installments paid and
        no farm loan late charge in the last 24 months, an installment whose remittance was returned not counting
        as paid, has relief_full_pct percent of the charge taken off; a member whose farm real estate loan is active
        and shows a farm loan late charge in the last 24 months has relief_part_pct percent taken off; any other member,
        including one with no active farm real estate loan and one whose active farm loan shows fewer than two farm
        principal installments paid and no farm loan late charge in those 24 months, has no relief.'
      loan_age: 'The smallest late charge depends on the member''s standing on the home loan: a loan open more than
        seasoned_months months with no late charge that counts toward the rate has a floor of seasoned_floor_usd;
        a loan open more than seasoned_months months with one or more late charges that count has a floor of seasoned_late_floor_usd;
        any other loan has the product''s late_charge_min_usd as its floor.'
      floor: 'The smallest late charge depends on the member''s standing on the home loan: a loan open more than seasoned_months
        months with no late charge that counts toward the rate has a floor of seasoned_floor_usd; a loan open more
        than seasoned_months months with one or more late charges that count has a floor of seasoned_late_floor_usd;
        any other loan has the product''s late_charge_min_usd as its floor.'
      note_age_days: 'How the gross charge is measured depends on the note the loan was closed on: a loan opened before
        legacy_note_before was closed on the association''s former rural residence note, which sets a flat late charge
        of legacy_flat_charge_usd as the gross charge whatever the late charge rate; a loan opened on or after legacy_note_before
        and before uniform_note_from was closed on the association''s own installment note, which measures the charge
        on the whole monthly installment, the monthly principal-and-interest payment and the monthly escrow deposit
        on the loan record together, multiplied by the late charge rate and divided by 100; any other loan, opened
        on or after uniform_note_from, was closed on the uniform secondary-market note, which measures the charge
        on the monthly principal-and-interest payment on the loan record alone, multiplied by the late charge rate
        and divided by 100.'
      legacy_days: 'How the gross charge is measured depends on the note the loan was closed on: a loan opened before
        legacy_note_before was closed on the association''s former rural residence note, which sets a flat late charge
        of legacy_flat_charge_usd as the gross charge whatever the late charge rate; a loan opened on or after legacy_note_before
        and before uniform_note_from was closed on the association''s own installment note, which measures the charge
        on the whole monthly installment, the monthly principal-and-interest payment and the monthly escrow deposit
        on the loan record together, multiplied by the late charge rate and divided by 100; any other loan, opened
        on or after uniform_note_from, was closed on the uniform secondary-market note, which measures the charge
        on the monthly principal-and-interest payment on the loan record alone, multiplied by the late charge rate
        and divided by 100.'
      gross: 'How the gross charge is measured depends on the note the loan was closed on: a loan opened before legacy_note_before
        was closed on the association''s former rural residence note, which sets a flat late charge of legacy_flat_charge_usd
        as the gross charge whatever the late charge rate; a loan opened on or after legacy_note_before and before
        uniform_note_from was closed on the association''s own installment note, which measures the charge on the
        whole monthly installment, the monthly principal-and-interest payment and the monthly escrow deposit on the
        loan record together, multiplied by the late charge rate and divided by 100; any other loan, opened on or
        after uniform_note_from, was closed on the uniform secondary-market note, which measures the charge on the
        monthly principal-and-interest payment on the loan record alone, multiplied by the late charge rate and divided
        by 100.'
      result: 'The charge is figured in this order: first the gross charge is measured under the loan''s note as set
        out above; then the relationship relief percentage is taken off that gross charge once; then the result is
        raised to the floor if it is below it and lowered to the product''s late_charge_max_usd if it is above it;
        the late charge is that figure rounded to the cent, rounded only at the end.'
    factors:
    - id: late_rate
      effect: parameter
      decides: rate
      bindings:
      - lates_12
      - waived_12
      - counted
      - rate
      ladder:
      - when: no late charge counts
        value: K('first_late_rate_pct')
      - when: exactly one late charge counts
        value: K('second_late_rate_pct')
      - when: otherwise (two or more)
        value: P('late_charge_pct')
      baseline:
        rate: P('late_charge_pct')
      evidence:
      - history
      cross_difficulty: null
    - id: relationship_relief
      effect: parameter
      decides: relief
      bindings:
      - farm_paid_24
      - farm_late_24
      - relief
      ladder:
      - when: farm real estate loan active AND at least two farm principal installments paid in the last 24 months
          (a returned installment not counting) AND no farm loan late charge in them
        value: K('relief_full_pct')
      - when: farm real estate loan active AND a farm loan late charge in the last 24 months
        value: K('relief_part_pct')
      - when: otherwise (no active farm real estate loan, or an active one with fewer than two farm principal installments
          paid and no farm late charge in 24 months)
        value: '0'
      baseline:
        relief: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: farmland
    - id: charge_floor
      effect: parameter
      decides: floor
      bindings:
      - loan_age
      - floor
      ladder:
      - when: loan open more than seasoned_months months AND no late charge counts
        value: K('seasoned_floor_usd')
      - when: loan open more than seasoned_months months AND one or more late charges count
        value: K('seasoned_late_floor_usd')
      - when: otherwise
        value: P('late_charge_min_usd')
      baseline:
        floor: P('late_charge_min_usd')
      evidence:
      - date
      - history
      cross_difficulty: null
    - id: charge_measure
      effect: method
      decides: gross
      bindings:
      - note_age_days
      - legacy_days
      - gross
      ladder:
      - when: loan opened before legacy_note_before (the former rural residence note)
        method: a flat legacy_flat_charge_usd, whatever the late charge rate
      - when: loan opened on or after legacy_note_before and before uniform_note_from (the association's installment
          note)
        method: the whole monthly installment on the loan record, principal-and-interest payment plus escrow deposit,
          multiplied by the late charge rate and divided by 100
      - when: otherwise (opened on or after uniform_note_from, the uniform secondary-market note)
        method: the monthly principal-and-interest payment on the loan record multiplied by the late charge rate and
          divided by 100
      baseline:
        gross: F('monthly_pi_amount') * rate / 100
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: >-
        A late charge is measured on the monthly principal-and-interest payment on the loan record. The charge is
        the product's late_charge_pct of that payment, no less than the product's late_charge_min_usd and no more
        than its late_charge_max_usd, rounded to the cent.
      params:
      - late_charge_pct
      - late_charge_min_usd
      - late_charge_max_usd
