  factors:
  - id: remaining_term_discount
    effect: parameter
    decides: autopay_discount_offered
    bindings:
    - months_left
    - autopay_discount_offered
    ladder:
    - when: fewer than 12 whole months remain from the enrolment date to maturity
      value: 0 (no autopay discount)
    - when: 12 to 47 whole months remain
      value: MN(K('mid_term_discount_pts') = 0.20, P('autopay_rate_discount_pct'))
    - when: otherwise (48 or more remain)
      value: P('autopay_rate_discount_pct')
    baseline:
      autopay_discount_offered: P('autopay_rate_discount_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: servicing_record_lookback
    effect: parameter
    decides: lookback_months
    bindings:
    - line_late_charges_24m
    - months_since_funding
    - lookback_months
    ladder:
    - when: >-
        an operating line of the member carries a late charge dated less than 24 whole months before the enrolment
        date
      value: the look-back reads fee entries dated less than 24 whole months before enrolment
    - when: >-
        no operating line of the member carries such a late charge AND the loan was funded fewer than 12 whole months
        before enrolment
      value: the look-back reads fee entries since funding (whole months since funding plus one)
    - when: otherwise
      value: the look-back reads fee entries dated less than 12 whole months before enrolment
    baseline:
      lookback_months: K('base_lookback_months')
    evidence:
    - cross_category
    - date
    cross_difficulty: operating
  - id: servicing_record_treatment
    effect: method
    decides: granted_discount
    bindings:
    - late_charges_in_lookback
    - protection_premiums_in_lookback
    - granted_discount
    ladder:
    - when: two or more late charges AND at least one collateral protection premium within the look-back
      method: >-
        the offered discount less 0.05 point for every late charge and every premium in the look-back, never below
        zero
    - when: two or more late charges AND no premium, OR at most one late charge AND at least one premium
      method: one half of the offered discount
    - when: exactly one late charge AND no premium
      method: the offered discount less a flat 0.05 point, never below zero
    - when: otherwise (neither)
      method: the whole offered discount
    baseline:
      granted_discount: autopay_discount_offered
    evidence:
    - history
    cross_difficulty: null
  - id: autodraft_relationship_increment
    effect: parameter
    decides: relationship_increment
    bindings:
    - line_on_autodraft
    - line_late_charges_12m
    - relationship_increment
    ladder:
    - when: >-
        the member holds an operating line in active status collecting interest by AutoDraft AND none of the member's
        operating lines carries a late charge dated less than 12 whole months before enrolment
      value: K('inc_clean') = 0.04 point
    - when: >-
        the member holds an operating line in active status collecting interest by AutoDraft AND one of the member's
        operating lines carries a late charge dated less than 12 whole months before enrolment
      value: K('inc_late') = 0.02 point
    - when: otherwise
      value: '0'
    baseline:
      relationship_increment: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: operating
  baseline:
    rule: >-
      On enrolment the contract rate on record is reduced by the product's autopay rate discount, except that the
      reduction may not exceed the product's rate discount cap less the relationship discount the loan received
      at funding; the loan received that discount when the member's operating line, the first one the operating-line
      lookup lists where there are several, was booked on or before the loan's funding date and had not been closed
      by that date, and the discount so received stays fixed at funding and counts against the cap whatever the
      line's status has become since; the reduced rate is rounded to 3 decimal places and may not be lower than
      the product's rate floor.
    params:
    - autopay_rate_discount_pct
    - relationship_rate_discount_pct
    - rate_discount_cap_pct
    - rate_floor_pct
  inputs:
    history:
    - table: equipment_transactions
      aggregate: count
      field: txn_id
      filters:
        event_type: equipment_fee_assessed
        fee_code: late_charge|collateral_protection
    - category: operating
      table: operating_transactions
      aggregate: count
      field: txn_id
      within_months: 24
      filters:
        event_type: operating_fee_assessed
        fee_code: late_charge
    cross_category:
    - operating
- id: equipment_ext_total_loss_release_price
  base_policy_refs:
  - equipment_collateral_release
  - equipment_agg_cross_collateral
  - equipment_collateral_substitution
  - equipment_payoff
  overwrite:
  - base_policy: equipment_collateral_release
    superseded_clause: >-
      The release price is the greater of the net sale price and partial_release_premium_pct of the unit's share
      of principal, that share being principal_balance times the unit's pledged_value divided by the loan's collateral_value,
      rounded to cents
    replaced_by: >-
      The release premium percentage is the product's partial release premium percentage with the seasoning loading,
      the payment-record adjustment, the relationship adjustment and the small-unit loading added together; that
      percentage is applied once to the unit's share, and the release price is the greater of that premium amount
      and the settlement amount, limited to the principal balance.
  trigger: on_request
  subject:
  - equipment_unit_released
  computes: release_proceeds
  target_tool: release_total_loss_unit_e8bdf554
  params:
    season_pts_young: 4
    season_pts_mid: 2
    season_months_1: 12
    season_months_2: 24
    record_pts_clean: -2
    record_pts_poor: 5
    record_months: 12
    rel_pts_clean: -3
    rel_pts_late: 2
    small_pts_small: 10
    small_pts_mid: 5
    small_frac: 0.15
    accrual_after_days: 90
    days_per_year: 365
  rule: >-
    When a pledged unit has been destroyed and the member's insurer has settled the loss, the loss is registered
    as a submitted collateral release request naming the unit's serial number and the settlement amount, and the
    unit is released with the release reason total loss while the loan is in active status; the release price is
    applied to principal as release proceeds on the release date and is never more than the principal balance, and
    a unit already released is never released again. The release price of a unit released after a total loss is
    the greater of the settlement amount registered on the request and the product's partial release premium percentage
    of the unit's share of principal, that share being the principal balance times the unit's pledged value divided
    by the pledged value of all units still securing the loan, rounded to cents, and the premium amount itself also
    rounded to cents. A total-loss release premium carries a seasoning loading set by the whole months since the
    loan's funding date: 4 points are added when fewer than 12 months have passed, 2 points when 12 to 23 months
    have passed, and nothing when 24 or more months have passed. A total-loss release premium carries a payment-record
    adjustment from the loan's entries dated less than 12 whole months before the release: 2 points are taken off
    when the loan carries no late charge and no returned payment in that period; 5 points are added when it carries
    two or more late charges or at least one returned payment in that period; and nothing changes when it carries
    exactly one late charge and no returned payment. A total-loss release premium carries a relationship adjustment
    from the member's operating credit: 3 points are taken off when the member holds an operating line in active
    status and none of the member's operating lines carries a late charge dated less than 12 whole months before
    the release; 2 points are added when the member holds an operating line in active status and one of the member's
    operating lines carries such a late charge; and nothing changes when the member holds no operating line in active
    status. A total-loss release premium carries a small-unit loading set by the destroyed unit's pledged value
    against the pledged value of all units still securing the loan: 10 points are added when it is less than 15
    percent of that value, 5 points when it is at least 15 percent but less than one third, and nothing when it
    is one third or more. The principal a total-loss share is figured on depends on how the loan stands on the release
    date: when more than 90 days have passed since the most recent installment due date, the share is figured on
    the principal balance plus the interest accrued on it from the day after that due date through the release date
    at the contract rate on an actual/365 basis, that interest rounded to cents; when 90 days or fewer have passed
    and billed interest remains unpaid, the share is figured on the principal balance plus that billed interest
    not yet paid; otherwise it is figured on the principal balance. The release premium percentage is the product's
    partial release premium percentage with the seasoning loading, the payment-record adjustment, the relationship
    adjustment and the small-unit loading added together; that percentage is applied once to the unit's share, and
    the release price is the greater of that premium amount and the settlement amount, limited to the principal
    balance.
  prerequisite: []
  cross_category:
  - category: operating
    as: history
    reads:
    - status
    - operating_transactions.event_type
    - operating_transactions.fee_code
    - operating_transactions.effective_date
    note: >-
      the relationship adjustment of the release premium is decided from the member's active operating line and
      its late charges in the last 12 months
  compute:
  - request_serial: >-
      LATEST('equipment_requests', 'serial_number', date_field='created_at', request_type='collateral_release',
      request_status='submitted')
  - settlement_amount: >-
      LATEST('equipment_requests', 'requested_amount', date_field='created_at', request_type='collateral_release',
      request_status='submitted') or 0
  - unit_pledged_value: >-
      SUM('equipment_collateral', 'pledged_value', event_type='equipment_unit_pledged', serial_number=request_serial)
  - unit_already_released: COUNT('equipment_collateral', event_type='equipment_unit_released', serial_number=request_serial)
  - value_still_pledged: >-
      SUM('equipment_collateral', 'pledged_value', event_type='equipment_unit_pledged') - SUM('equipment_collateral',
      'pledged_value', event_type='equipment_unit_released')
  - funding_on_record: F('opened_date') if (F('opened_date') != '' and F('opened_date') != None) else NOW
  - months_since_funding: MONTHS(funding_on_record, NOW)
  - seasoning_loading: >-
      K('season_pts_young') if months_since_funding < K('season_months_1') else (K('season_pts_mid') if months_since_funding
      < K('season_months_2') else 0)
  - late_charges_12m: >-
      COUNT('equipment_transactions', within_months=K('record_months'), date_field='effective_date', event_type='equipment_fee_assessed',
      fee_code='late_charge')
  - returned_payments_12m: >-
      COUNT('equipment_transactions', within_months=K('record_months'), date_field='effective_date', event_type='equipment_principal_payment_return')
      + COUNT('equipment_transactions', within_months=K('record_months'), date_field='effective_date', event_type='equipment_interest_payment_return')
  - record_adjustment: >-
      K('record_pts_clean') if (late_charges_12m == 0 and returned_payments_12m == 0) else (K('record_pts_poor')
      if (late_charges_12m >= 2 or returned_payments_12m >= 1) else 0)
  - line_active: EXISTS('operating', status='active')
  - line_late_charges_12m: >-
      XCOUNT('operating', 'operating_transactions', within_months=K('record_months'), date_field='effective_date',
      event_type='operating_fee_assessed', fee_code='late_charge')
  - relationship_adjustment: >-
      K('rel_pts_clean') if (line_active and line_late_charges_12m == 0) else (K('rel_pts_late') if (line_active
      and line_late_charges_12m >= 1) else 0)
  - small_unit_loading: >-
      K('small_pts_small') if unit_pledged_value < K('small_frac') * value_still_pledged else (K('small_pts_mid')
      if unit_pledged_value * 3 < value_still_pledged else 0)
  - last_due_date: >-
      LATEST('equipment_transactions', 'due_date', date_field='due_date', event_type='equipment_interest_accrual')
  - last_due_on_record: last_due_date if (last_due_date != '' and last_due_date != None) else NOW
  - days_since_last_due: DAYS(last_due_on_record, NOW)
  - billed_interest_unpaid: >-
      RND(SUM('equipment_transactions', 'amount', event_type='equipment_interest_accrual') + SUM('equipment_transactions',
      'amount', event_type='equipment_interest_payment_return') - SUM('equipment_transactions', 'amount', event_type='equipment_interest_payment'),
      2)
  - share_principal: >-
      (F('principal_balance') + RND(F('principal_balance') * F('interest_rate') / 100 * days_since_last_due / K('days_per_year'),
      2)) if days_since_last_due > K('accrual_after_days') else ((F('principal_balance') + billed_interest_unpaid)
      if billed_interest_unpaid > 0 else F('principal_balance'))
  - premium_pct: >-
      P('partial_release_premium_pct') + seasoning_loading + record_adjustment + relationship_adjustment + small_unit_loading
  - unit_share: RND(share_principal * unit_pledged_value / MX(1, value_still_pledged), 2)
  - premium_amount: RND(unit_share * premium_pct / 100, 2)
  - release_ok: >-
      F('status') == 'active' and settlement_amount > 0 and unit_pledged_value > 0 and unit_already_released ==
      0
  - result: MN(F('principal_balance'), MX(settlement_amount, premium_amount)) if release_ok else 0
  compute_basis:
    request_serial: >-
      When a pledged unit has been destroyed and the member's insurer has settled the loss, the loss is registered
      as a submitted collateral release request naming the unit's serial number and the settlement amount, and the
      unit is released with the release reason total loss while the loan is in active status; the release price
      is applied to principal as release proceeds on the release date and is never more than the principal balance,
      and a unit already released is never released again.
    settlement_amount: >-
      The release price of a unit released after a total loss is the greater of the settlement amount registered
      on the request and the product's partial release premium percentage of the unit's share of principal, that
      share being the principal balance times the unit's pledged value divided by the pledged value of all units
      still securing the loan, rounded to cents, and the premium amount itself also rounded to cents.
    unit_pledged_value: >-
      The release price of a unit released after a total loss is the greater of the settlement amount registered
      on the request and the product's partial release premium percentage of the unit's share of principal, that
      share being the principal balance times the unit's pledged value divided by the pledged value of all units
      still securing the loan, rounded to cents, and the premium amount itself also rounded to cents.
    unit_already_released: >-
      When a pledged unit has been destroyed and the member's insurer has settled the loss, the loss is registered
      as a submitted collateral release request naming the unit's serial number and the settlement amount, and the
      unit is released with the release reason total loss while the loan is in active status; the release price
      is applied to principal as release proceeds on the release date and is never more than the principal balance,
      and a unit already released is never released again.
    value_still_pledged: >-
      The release price of a unit released after a total loss is the greater of the settlement amount registered
      on the request and the product's partial release premium percentage of the unit's share of principal, that
      share being the principal balance times the unit's pledged value divided by the pledged value of all units
      still securing the loan, rounded to cents, and the premium amount itself also rounded to cents.
    months_since_funding: >-
      A total-loss release premium carries a seasoning loading set by the whole months since the loan's funding
      date: 4 points are added when fewer than 12 months have passed, 2 points when 12 to 23 months have passed,
      and nothing when 24 or more months have passed.
    seasoning_loading: >-
      A total-loss release premium carries a seasoning loading set by the whole months since the loan's funding
      date: 4 points are added when fewer than 12 months have passed, 2 points when 12 to 23 months have passed,
      and nothing when 24 or more months have passed.
    late_charges_12m: >-
      A total-loss release premium carries a payment-record adjustment from the loan's entries dated less than 12
      whole months before the release: 2 points are taken off when the loan carries no late charge and no returned
      payment in that period; 5 points are added when it carries two or more late charges or at least one returned
      payment in that period; and nothing changes when it carries exactly one late charge and no returned payment.
    returned_payments_12m: >-
      A total-loss release premium carries a payment-record adjustment from the loan's entries dated less than 12
      whole months before the release: 2 points are taken off when the loan carries no late charge and no returned
      payment in that period; 5 points are added when it carries two or more late charges or at least one returned
      payment in that period; and nothing changes when it carries exactly one late charge and no returned payment.
    record_adjustment: >-
      A total-loss release premium carries a payment-record adjustment from the loan's entries dated less than 12
      whole months before the release: 2 points are taken off when the loan carries no late charge and no returned
      payment in that period; 5 points are added when it carries two or more late charges or at least one returned
      payment in that period; and nothing changes when it carries exactly one late charge and no returned payment.
    line_active: >-
      A total-loss release premium carries a relationship adjustment from the member's operating credit: 3 points
      are taken off when the member holds an operating line in active status and none of the member's operating
      lines carries a late charge dated less than 12 whole months before the release; 2 points are added when the
      member holds an operating line in active status and one of the member's operating lines carries such a late
      charge; and nothing changes when the member holds no operating line in active status.
    line_late_charges_12m: >-
      A total-loss release premium carries a relationship adjustment from the member's operating credit: 3 points
      are taken off when the member holds an operating line in active status and none of the member's operating
      lines carries a late charge dated less than 12 whole months before the release; 2 points are added when the
      member holds an operating line in active status and one of the member's operating lines carries such a late
      charge; and nothing changes when the member holds no operating line in active status.
    relationship_adjustment: >-
      A total-loss release premium carries a relationship adjustment from the member's operating credit: 3 points
      are taken off when the member holds an operating line in active status and none of the member's operating
      lines carries a late charge dated less than 12 whole months before the release; 2 points are added when the
      member holds an operating line in active status and one of the member's operating lines carries such a late
      charge; and nothing changes when the member holds no operating line in active status.
    small_unit_loading: >-
      A total-loss release premium carries a small-unit loading set by the destroyed unit's pledged value against
      the pledged value of all units still securing the loan: 10 points are added when it is less than 15 percent
      of that value, 5 points when it is at least 15 percent but less than one third, and nothing when it is one
      third or more.
    last_due_date: >-
      The principal a total-loss share is figured on depends on how the loan stands on the release date: when more
      than 90 days have passed since the most recent installment due date, the share is figured on the principal
      balance plus the interest accrued on it from the day after that due date through the release date at the contract
      rate on an actual/365 basis, that interest rounded to cents; when 90 days or fewer have passed and billed
      interest remains unpaid, the share is figured on the principal balance plus that billed interest not yet paid;
      otherwise it is figured on the principal balance.
    days_since_last_due: >-
      The principal a total-loss share is figured on depends on how the loan stands on the release date: when more
      than 90 days have passed since the most recent installment due date, the share is figured on the principal
      balance plus the interest accrued on it from the day after that due date through the release date at the contract
      rate on an actual/365 basis, that interest rounded to cents; when 90 days or fewer have passed and billed
      interest remains unpaid, the share is figured on the principal balance plus that billed interest not yet paid;
      otherwise it is figured on the principal balance.
    billed_interest_unpaid: >-
      The principal a total-loss share is figured on depends on how the loan stands on the release date: when more
      than 90 days have passed since the most recent installment due date, the share is figured on the principal
      balance plus the interest accrued on it from the day after that due date through the release date at the contract
      rate on an actual/365 basis, that interest rounded to cents; when 90 days or fewer have passed and billed
      interest remains unpaid, the share is figured on the principal balance plus that billed interest not yet paid;
      otherwise it is figured on the principal balance.
    share_principal: >-
      The principal a total-loss share is figured on depends on how the loan stands on the release date: when more
      than 90 days have passed since the most recent installment due date, the share is figured on the principal
      balance plus the interest accrued on it from the day after that due date through the release date at the contract
      rate on an actual/365 basis, that interest rounded to cents; when 90 days or fewer have passed and billed
      interest remains unpaid, the share is figured on the principal balance plus that billed interest not yet paid;
      otherwise it is figured on the principal balance.
    premium_pct: >-
      The release premium percentage is the product's partial release premium percentage with the seasoning loading,
      the payment-record adjustment, the relationship adjustment and the small-unit loading added together; that
      percentage is applied once to the unit's share, and the release price is the greater of that premium amount
      and the settlement amount, limited to the principal balance.
    unit_share: >-
      The release price of a unit released after a total loss is the greater of the settlement amount registered
      on the request and the product's partial release premium percentage of the unit's share of principal, that
      share being the principal balance times the unit's pledged value divided by the pledged value of all units
      still securing the loan, rounded to cents, and the premium amount itself also rounded to cents.
    premium_amount: >-
      The release price of a unit released after a total loss is the greater of the settlement amount registered
      on the request and the product's partial release premium percentage of the unit's share of principal, that
      share being the principal balance times the unit's pledged value divided by the pledged value of all units
      still securing the loan, rounded to cents, and the premium amount itself also rounded to cents.
    release_ok: >-
      When a pledged unit has been destroyed and the member's insurer has settled the loss, the loss is registered
      as a submitted collateral release request naming the unit's serial number and the settlement amount, and the
      unit is released with the release reason total loss while the loan is in active status; the release price
      is applied to principal as release proceeds on the release date and is never more than the principal balance,
      and a unit already released is never released again.
    result: >-
      The release premium percentage is the product's partial release premium percentage with the seasoning loading,
      the payment-record adjustment, the relationship adjustment and the small-unit loading added together; that
      percentage is applied once to the unit's share, and the release price is the greater of that premium amount
      and the settlement amount, limited to the principal balance.
    funding_on_record: >-
      A total-loss release premium carries a seasoning loading set by the whole months since the loan's funding
      date: 4 points are added when fewer than 12 months have passed, 2 points when 12 to 23 months have passed,
      and nothing when 24 or more months have passed.
    last_due_on_record: >-
      The principal a total-loss share is figured on depends on how the loan stands on the release date: when more
      than 90 days have passed since the most recent installment due date, the share is figured on the principal
      balance plus the interest accrued on it from the day after that due date through the release date at the contract
      rate on an actual/365 basis, that interest rounded to cents; when 90 days or fewer have passed and billed
      interest remains unpaid, the share is figured on the principal balance plus that billed interest not yet paid;
      otherwise it is figured on the principal balance.
  factors:
  - id: seasoning_loading
    effect: parameter
    decides: seasoning_loading
    bindings:
    - months_since_funding
    - seasoning_loading
    ladder:
    - when: fewer than 12 whole months since funding
      value: +4 points
    - when: 12 to 23 whole months since funding
      value: +2 points
    - when: otherwise (24 or more)
      value: '0'
    baseline:
      seasoning_loading: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: payment_record_adjustment
    effect: parameter
    decides: record_adjustment
    bindings:
    - late_charges_12m
    - returned_payments_12m
    - record_adjustment
    ladder:
    - when: no late charge AND no returned payment in the last 12 months
      value: -2 points
    - when: two or more late charges OR at least one returned payment in the last 12 months
      value: +5 points
    - when: otherwise (exactly one late charge and no returned payment)
      value: '0'
    baseline:
      record_adjustment: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: operating_relationship_adjustment
    effect: parameter
    decides: relationship_adjustment
    bindings:
    - line_active
    - line_late_charges_12m
    - relationship_adjustment
    ladder:
    - when: >-
        an operating line in active status AND none of the member's operating lines carries a late charge in the
        last 12 months
      value: -3 points
    - when: >-
        an operating line in active status AND one of the member's operating lines carries a late charge in the
        last 12 months
      value: +2 points
    - when: otherwise (no active operating line)
      value: '0'
    baseline:
      relationship_adjustment: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: operating
  - id: small_unit_loading
    effect: parameter
    decides: small_unit_loading
    bindings:
    - unit_pledged_value
    - value_still_pledged
    - small_unit_loading
    ladder:
    - when: the destroyed unit's pledged value is less than 15 percent of the value still pledged
      value: +10 points
    - when: at least 15 percent but less than one third
      value: +5 points
    - when: otherwise (one third or more)
      value: '0'
    baseline:
      small_unit_loading: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: share_principal_basis
    effect: method
    decides: share_principal
    bindings:
    - last_due_date
    - days_since_last_due
    - billed_interest_unpaid
    - share_principal
    ladder:
    - when: more than 90 days since the most recent installment due date
      method: >-
        principal plus interest accrued since the day after that due date through the release date, actual/365 at
        the contract rate
    - when: 90 days or fewer AND billed interest unpaid
      method: principal plus the billed interest not yet paid
    - when: otherwise
      method: the principal balance
    baseline:
      share_principal: F('principal_balance')
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The release price of a unit released after a total loss is the greater of the settlement amount registered
      on the request and the product's partial release premium percentage of the unit's share of principal, that
      share being the principal balance times the unit's pledged value divided by the pledged value of all units
      still securing the loan, rounded to cents, and the premium amount itself also rounded to cents.
    params:
    - partial_release_premium_pct
  inputs:
    history:
    - table: equipment_requests
      aggregate: latest
      field: requested_amount
      filters:
        request_type: collateral_release
        request_status: submitted
    - table: equipment_collateral
      aggregate: sum
      field: pledged_value
      filters:
        event_type: equipment_unit_pledged|equipment_unit_released
    - table: equipment_transactions
      aggregate: count
      field: txn_id
      within_months: 12
      filters:
        event_type: equipment_fee_assessed|equipment_principal_payment_return|equipment_interest_payment_return
    - category: operating
      table: operating_transactions
      aggregate: count
      field: txn_id
      within_months: 12
      filters:
        event_type: operating_fee_assessed
        fee_code: late_charge
    cross_category:
    - operating
- id: equipment_ext_post_release_curtailment
  base_policy_refs:
  - equipment_payment_application
  - equipment_prepayment
  - equipment_collateral_release
  overwrite:
  - base_policy: equipment_collateral_release
    superseded_clause: >-
      after it the principal may not exceed max_ltv_after_release_pct of the value still pledged, any excess being
      paid down at the same time
    replaced_by: >-
      The post-release margin is the casualty-record starting percentage with the operating-credit points and the
      remaining-unit points added; the tested value is rounded to cents; the curtailment is the tested balance less
      the margin percentage of the tested value, rounded once to cents, and never less than zero.
  trigger: state_due
  subject:
  - equipment_principal_payment
  computes: curtailment_amount
  target_tool: apply_ltv_curtailment_c1e2b439
  params:
    margin_young: 66
    margin_seasoned: 70
    casualty_months: 12
    seasoned_months: 24
    rel_pts_clean: 4
    rel_pts_late: -4
    units_pts_one: -8
    units_pts_two: -4
    declining_after_months: 36
    straight_from_months: 12
    rate_old: 12
    rate_mid: 10
    age_old_years: 8
    age_mid_years: 4
    accrual_after_days: 90
    days_per_year: 365
  rule: >-
    When a unit of the loan has been released on the test date on sale, after a total loss or in substitution, the
    principal may not exceed the post-release margin of the value of the units still securing the loan, and any
    excess is paid down by the member the same day as a curtailment applied to principal as a prepayment; no curtailment
    is owed while the loan is not in active status, when no unit of the loan was released that day other than at
    payoff, or when the principal is within the margin. The loan-to-value curtailment is worked out only after the
    collateral records carry the release of the unit named in a submitted collateral release request, with that
    release's proceeds applied to principal. The curtailment is the amount by which the principal balance exceeds
    the product's loan-to-value limit after release, taken as a percentage of the pledged value of the units still
    securing the loan, rounded to cents; when the principal is within that limit no curtailment is owed. The post-release
    margin starts from the loan's casualty record: 66 percent when a unit of the loan was released on a total loss
    less than 12 whole months before and the loan was funded fewer than 24 whole months before; 70 percent when
    a unit was released on a total loss less than 12 whole months before and the loan was funded 24 or more whole
    months before; and the product's loan-to-value limit after release when no unit was released on a total loss
    in those 12 months. The post-release margin is widened or narrowed by the member's operating credit: 4 points
    are added when the member holds an operating line in active status and none of the member's operating lines
    carries a late charge dated less than 12 whole months before; 4 points are taken off when the member holds an
    operating line in active status and one of the member's operating lines carries such a late charge; and nothing
    changes when the member holds no operating line in active status. The post-release margin is narrowed by how
    few units remain pledged: 8 points are taken off when a single unit remains, 4 points when two units remain,
    and nothing when three or more remain. The value tested against the post-release margin depends on how long
    ago the units were pledged at funding: when more than 36 whole months have passed since funding, the pledged
    value still securing the loan is depreciated on a declining balance, reduced by the depreciation rate once for
    each full year since funding, each year's reduction acting on the value left after the year before; when 12
    to 36 whole months have passed, it is depreciated on a straight line, reduced by the depreciation rate times
    the full years since funding, all acting on the pledged value; when fewer than 12 whole months have passed,
    the pledged value itself is tested. The depreciation rate for that test is set by the average model year of
    the units still pledged against the calendar year of the test: 12 percent a year when that average is more than
    8 years earlier, 10 percent a year when it is more than 4 but not more than 8 years earlier, and no depreciation
    when it is 4 years earlier or less. The balance tested against the post-release margin depends on how the loan
    stands on the test date: when more than 90 days have passed since the most recent installment due date, it is
    the principal balance plus the interest accrued on it from the day after that due date through the test date
    at the contract rate on an actual/365 basis, that interest rounded to cents; when 90 days or fewer have passed
    and billed interest remains unpaid, it is the principal balance plus that billed interest; otherwise it is the
    principal balance. The post-release margin is the casualty-record starting percentage with the operating-credit
    points and the remaining-unit points added; the tested value is rounded to cents; the curtailment is the tested
    balance less the margin percentage of the tested value, rounded once to cents, and never less than zero.
  prerequisite:
  - problem: equipment_ext_total_loss_release_price
    kind: value_input
    gate: casualty_releases_12m
    form: state
    policy_source: >-
      The loan-to-value curtailment is worked out only after the collateral records carry the release of the unit
      named in a submitted collateral release request, with that release's proceeds applied to principal.
    condition: >-
      the loan's collateral records carry a release for the unit whose serial number a submitted collateral release
      request names, and a release-proceeds principal payment pointing at that release
    resolved_by: release_total_loss_unit_e8bdf554
    effect: >-
      the release brings the loan within the curtailment's scope, lowers the principal and the value still pledged,
      removes one unit, and for a total-loss release moves the post-release margin to its casualty tier
  cross_category:
  - category: operating
    as: history
    reads:
    - status
    - operating_transactions.event_type
    - operating_transactions.fee_code
    - operating_transactions.effective_date
    note: >-
      the operating-credit points of the post-release margin are decided from the member's active operating line
      and its late charges in the last 12 months
  compute:
  - casualty_releases_12m: >-
      COUNT('equipment_collateral', within_months=K('casualty_months'), date_field='action_date', event_type='equipment_unit_released',
      release_reason='total_loss')
  - funding_on_record: F('opened_date') if (F('opened_date') != '' and F('opened_date') != None) else NOW
  - months_since_funding: MONTHS(funding_on_record, NOW)
  - margin_start: >-
      K('margin_young') if (casualty_releases_12m >= 1 and months_since_funding < K('seasoned_months')) else (K('margin_seasoned')
      if (casualty_releases_12m >= 1 and months_since_funding >= K('seasoned_months')) else P('max_ltv_after_release_pct'))
  - line_active: EXISTS('operating', status='active')
  - line_late_charges_12m: >-
      XCOUNT('operating', 'operating_transactions', within_months=K('casualty_months'), date_field='effective_date',
      event_type='operating_fee_assessed', fee_code='late_charge')
  - margin_credit_points: >-
      K('rel_pts_clean') if (line_active and line_late_charges_12m == 0) else (K('rel_pts_late') if (line_active
      and line_late_charges_12m >= 1) else 0)
  - units_remaining: >-
      COUNT('equipment_collateral', event_type='equipment_unit_pledged') - COUNT('equipment_collateral', event_type='equipment_unit_released')
  - margin_unit_points: K('units_pts_one') if units_remaining == 1 else (K('units_pts_two') if units_remaining ==
      2 else 0)
  - value_left: >-
      SUM('equipment_collateral', 'pledged_value', event_type='equipment_unit_pledged') - SUM('equipment_collateral',
      'pledged_value', event_type='equipment_unit_released')
  - average_model_year: >-
      (SUM('equipment_collateral', 'model_year', event_type='equipment_unit_pledged') - SUM('equipment_collateral',
      'model_year', event_type='equipment_unit_released')) / MX(1, units_remaining)
  - test_year: 2000 + MONTHS('2000-01-01', NOW) // 12
  - depreciation_rate: >-
      K('rate_old') if (test_year - average_model_year) > K('age_old_years') else (K('rate_mid') if (test_year -
      average_model_year) > K('age_mid_years') else 0)
  - full_years: months_since_funding // 12
  - value_tested: >-
      RND(value_left * (1 - depreciation_rate / 100) ** full_years, 2) if months_since_funding > K('declining_after_months')
      else (RND(value_left * (1 - depreciation_rate / 100 * full_years), 2) if months_since_funding >= K('straight_from_months')
      else value_left)
  - last_due_date: >-
      LATEST('equipment_transactions', 'due_date', date_field='due_date', event_type='equipment_interest_accrual')
  - last_due_on_record: last_due_date if (last_due_date != '' and last_due_date != None) else NOW
  - days_since_last_due: DAYS(last_due_on_record, NOW)
  - billed_interest_unpaid: >-
      RND(SUM('equipment_transactions', 'amount', event_type='equipment_interest_accrual') + SUM('equipment_transactions',
      'amount', event_type='equipment_interest_payment_return') - SUM('equipment_transactions', 'amount', event_type='equipment_interest_payment'),
      2)
  - balance_tested: >-
      (F('principal_balance') + RND(F('principal_balance') * F('interest_rate') / 100 * days_since_last_due / K('days_per_year'),
      2)) if days_since_last_due > K('accrual_after_days') else ((F('principal_balance') + billed_interest_unpaid)
      if billed_interest_unpaid > 0 else F('principal_balance'))
  - margin_pct: margin_start + margin_credit_points + margin_unit_points
  - excess: MX(0, RND(balance_tested - margin_pct / 100 * value_tested, 2))
  - released_today: >-
      COUNT('equipment_collateral', event_type='equipment_unit_released', action_date=NOW) - COUNT('equipment_collateral',
      event_type='equipment_unit_released', action_date=NOW, release_reason='payoff')
  - result: excess if (F('status') == 'active' and released_today >= 1) else 0
  compute_basis:
    casualty_releases_12m: >-
      The post-release margin starts from the loan's casualty record: 66 percent when a unit of the loan was released
      on a total loss less than 12 whole months before and the loan was funded fewer than 24 whole months before;
      70 percent when a unit was released on a total loss less than 12 whole months before and the loan was funded
      24 or more whole months before; and the product's loan-to-value limit after release when no unit was released
      on a total loss in those 12 months.
    months_since_funding: >-
      The post-release margin starts from the loan's casualty record: 66 percent when a unit of the loan was released
      on a total loss less than 12 whole months before and the loan was funded fewer than 24 whole months before;
      70 percent when a unit was released on a total loss less than 12 whole months before and the loan was funded
      24 or more whole months before; and the product's loan-to-value limit after release when no unit was released
      on a total loss in those 12 months.
    margin_start: >-
      The post-release margin starts from the loan's casualty record: 66 percent when a unit of the loan was released
      on a total loss less than 12 whole months before and the loan was funded fewer than 24 whole months before;
      70 percent when a unit was released on a total loss less than 12 whole months before and the loan was funded
      24 or more whole months before; and the product's loan-to-value limit after release when no unit was released
      on a total loss in those 12 months.
    line_active: >-
      The post-release margin is widened or narrowed by the member's operating credit: 4 points are added when the
      member holds an operating line in active status and none of the member's operating lines carries a late charge
      dated less than 12 whole months before; 4 points are taken off when the member holds an operating line in
      active status and one of the member's operating lines carries such a late charge; and nothing changes when
      the member holds no operating line in active status.
    line_late_charges_12m: >-
      The post-release margin is widened or narrowed by the member's operating credit: 4 points are added when the
      member holds an operating line in active status and none of the member's operating lines carries a late charge
      dated less than 12 whole months before; 4 points are taken off when the member holds an operating line in
      active status and one of the member's operating lines carries such a late charge; and nothing changes when
      the member holds no operating line in active status.
    margin_credit_points: >-
      The post-release margin is widened or narrowed by the member's operating credit: 4 points are added when the
      member holds an operating line in active status and none of the member's operating lines carries a late charge
      dated less than 12 whole months before; 4 points are taken off when the member holds an operating line in
      active status and one of the member's operating lines carries such a late charge; and nothing changes when
      the member holds no operating line in active status.
    units_remaining: >-
      The post-release margin is narrowed by how few units remain pledged: 8 points are taken off when a single
      unit remains, 4 points when two units remain, and nothing when three or more remain.
    margin_unit_points: >-
      The post-release margin is narrowed by how few units remain pledged: 8 points are taken off when a single
      unit remains, 4 points when two units remain, and nothing when three or more remain.
    value_left: >-
      The curtailment is the amount by which the principal balance exceeds the product's loan-to-value limit after
      release, taken as a percentage of the pledged value of the units still securing the loan, rounded to cents;
      when the principal is within that limit no curtailment is owed.
    average_model_year: >-
      The depreciation rate for that test is set by the average model year of the units still pledged against the
      calendar year of the test: 12 percent a year when that average is more than 8 years earlier, 10 percent a
      year when it is more than 4 but not more than 8 years earlier, and no depreciation when it is 4 years earlier
      or less.
    test_year: >-
      The depreciation rate for that test is set by the average model year of the units still pledged against the
      calendar year of the test: 12 percent a year when that average is more than 8 years earlier, 10 percent a
      year when it is more than 4 but not more than 8 years earlier, and no depreciation when it is 4 years earlier
      or less.
    depreciation_rate: >-
      The depreciation rate for that test is set by the average model year of the units still pledged against the
      calendar year of the test: 12 percent a year when that average is more than 8 years earlier, 10 percent a
      year when it is more than 4 but not more than 8 years earlier, and no depreciation when it is 4 years earlier
      or less.
    full_years: >-
      The value tested against the post-release margin depends on how long ago the units were pledged at funding:
      when more than 36 whole months have passed since funding, the pledged value still securing the loan is depreciated
      on a declining balance, reduced by the depreciation rate once for each full year since funding, each year's
      reduction acting on the value left after the year before; when 12 to 36 whole months have passed, it is depreciated
      on a straight line, reduced by the depreciation rate times the full years since funding, all acting on the
      pledged value; when fewer than 12 whole months have passed, the pledged value itself is tested.
    value_tested: >-
      The value tested against the post-release margin depends on how long ago the units were pledged at funding:
      when more than 36 whole months have passed since funding, the pledged value still securing the loan is depreciated
      on a declining balance, reduced by the depreciation rate once for each full year since funding, each year's
      reduction acting on the value left after the year before; when 12 to 36 whole months have passed, it is depreciated
      on a straight line, reduced by the depreciation rate times the full years since funding, all acting on the
      pledged value; when fewer than 12 whole months have passed, the pledged value itself is tested.
    last_due_date: >-
      The balance tested against the post-release margin depends on how the loan stands on the test date: when more
      than 90 days have passed since the most recent installment due date, it is the principal balance plus the
      interest accrued on it from the day after that due date through the test date at the contract rate on an actual/365
      basis, that interest rounded to cents; when 90 days or fewer have passed and billed interest remains unpaid,
      it is the principal balance plus that billed interest; otherwise it is the principal balance.
    days_since_last_due: >-
      The balance tested against the post-release margin depends on how the loan stands on the test date: when more
      than 90 days have passed since the most recent installment due date, it is the principal balance plus the
      interest accrued on it from the day after that due date through the test date at the contract rate on an actual/365
      basis, that interest rounded to cents; when 90 days or fewer have passed and billed interest remains unpaid,
      it is the principal balance plus that billed interest; otherwise it is the principal balance.
    billed_interest_unpaid: >-
      The balance tested against the post-release margin depends on how the loan stands on the test date: when more
      than 90 days have passed since the most recent installment due date, it is the principal balance plus the
      interest accrued on it from the day after that due date through the test date at the contract rate on an actual/365
      basis, that interest rounded to cents; when 90 days or fewer have passed and billed interest remains unpaid,
      it is the principal balance plus that billed interest; otherwise it is the principal balance.
    balance_tested: >-
      The balance tested against the post-release margin depends on how the loan stands on the test date: when more
      than 90 days have passed since the most recent installment due date, it is the principal balance plus the
      interest accrued on it from the day after that due date through the test date at the contract rate on an actual/365
      basis, that interest rounded to cents; when 90 days or fewer have passed and billed interest remains unpaid,
      it is the principal balance plus that billed interest; otherwise it is the principal balance.
    margin_pct: >-
      The post-release margin is the casualty-record starting percentage with the operating-credit points and the
      remaining-unit points added; the tested value is rounded to cents; the curtailment is the tested balance less
      the margin percentage of the tested value, rounded once to cents, and never less than zero.
    excess: >-
      The post-release margin is the casualty-record starting percentage with the operating-credit points and the
      remaining-unit points added; the tested value is rounded to cents; the curtailment is the tested balance less
      the margin percentage of the tested value, rounded once to cents, and never less than zero.
    result: >-
      When a unit of the loan has been released on the test date on sale, after a total loss or in substitution,
      the principal may not exceed the post-release margin of the value of the units still securing the loan, and
      any excess is paid down by the member the same day as a curtailment applied to principal as a prepayment;
      no curtailment is owed while the loan is not in active status, when no unit of the loan was released that
      day other than at payoff, or when the principal is within the margin.
    released_today: >-
      When a unit of the loan has been released on the test date on sale, after a total loss or in substitution,
      the principal may not exceed the post-release margin of the value of the units still securing the loan, and
      any excess is paid down by the member the same day as a curtailment applied to principal as a prepayment;
      no curtailment is owed while the loan is not in active status, when no unit of the loan was released that
      day other than at payoff, or when the principal is within the margin.
    funding_on_record: >-
      The post-release margin starts from the loan's casualty record: 66 percent when a unit of the loan was released
      on a total loss less than 12 whole months before and the loan was funded fewer than 24 whole months before;
      70 percent when a unit was released on a total loss less than 12 whole months before and the loan was funded
      24 or more whole months before; and the product's loan-to-value limit after release when no unit was released
      on a total loss in those 12 months.
    last_due_on_record: >-
      The balance tested against the post-release margin depends on how the loan stands on the test date: when more
      than 90 days have passed since the most recent installment due date, it is the principal balance plus the
      interest accrued on it from the day after that due date through the test date at the contract rate on an actual/365
      basis, that interest rounded to cents; when 90 days or fewer have passed and billed interest remains unpaid,
      it is the principal balance plus that billed interest; otherwise it is the principal balance.
  factors:
  - id: casualty_margin_start
    effect: parameter
    decides: margin_start
    bindings:
    - casualty_releases_12m
    - months_since_funding
    - margin_start
    ladder:
    - when: >-
        a unit released on a total loss in the last 12 months AND the loan funded fewer than 24 whole months before
      value: 66 percent
    - when: >-
        a unit released on a total loss in the last 12 months AND the loan funded 24 or more whole months before
      value: 70 percent
    - when: otherwise (no total-loss release in 12 months)
      value: P('max_ltv_after_release_pct')
    baseline:
      margin_start: P('max_ltv_after_release_pct')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: operating_credit_points
    effect: parameter
    decides: margin_credit_points
    bindings:
    - line_active
    - line_late_charges_12m
    - margin_credit_points
    ladder:
    - when: >-
        an operating line in active status AND none of the member's operating lines carries a late charge in the
        last 12 months
      value: +4 points
    - when: >-
        an operating line in active status AND one of the member's operating lines carries a late charge in the
        last 12 months
      value: -4 points
    - when: otherwise (no active operating line)
      value: '0'
    baseline:
      margin_credit_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: operating
  - id: remaining_unit_points
    effect: parameter
    decides: margin_unit_points
    bindings:
    - units_remaining
    - margin_unit_points
    ladder:
    - when: a single unit remains pledged
      value: -8 points
    - when: two units remain pledged
      value: -4 points
    - when: otherwise (three or more)
      value: '0'
    baseline:
      margin_unit_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: depreciation_method
    effect: method
    decides: value_tested
    bindings:
    - value_left
    - full_years
    - value_tested
    ladder:
    - when: more than 36 whole months since funding
      method: 'declining balance: each full year''s reduction acts on the value left after the year before'
    - when: 12 to 36 whole months since funding
      method: 'straight line: rate times full years, all acting on the pledged value'
    - when: otherwise (fewer than 12)
      method: the pledged value itself
    baseline:
      value_tested: value_left
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: depreciation_rate
    effect: parameter
    decides: depreciation_rate
    bindings:
    - average_model_year
    - test_year
    - depreciation_rate
    ladder:
    - when: average model year of the units still pledged more than 8 years before the test year
      value: 12 percent a year
    - when: more than 4 but not more than 8 years before
      value: 10 percent a year
    - when: otherwise
      value: 0 (no depreciation)
    baseline:
      depreciation_rate: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: tested_balance_basis
    effect: method
    decides: balance_tested
    bindings:
    - last_due_date
    - days_since_last_due
    - billed_interest_unpaid
    - balance_tested
    ladder:
    - when: more than 90 days since the most recent installment due date
      method: principal plus interest accrued since the day after that due date, actual/365 at the contract rate
    - when: 90 days or fewer AND billed interest unpaid
      method: principal plus the billed interest not yet paid
    - when: otherwise
      method: the principal balance
    baseline:
      balance_tested: F('principal_balance')
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The curtailment is the amount by which the principal balance exceeds the product's loan-to-value limit after
      release, taken as a percentage of the pledged value of the units still securing the loan, rounded to cents;
      when the principal is within that limit no curtailment is owed.
    params:
    - max_ltv_after_release_pct
  inputs:
    history:
    - table: equipment_collateral
      aggregate: count
      field: collateral_action_id
      within_months: 12
      filters:
        event_type: equipment_unit_released
        release_reason: total_loss
    - table: equipment_collateral
      aggregate: sum
      field: pledged_value
      filters:
        event_type: equipment_unit_pledged|equipment_unit_released
    - table: equipment_transactions
      aggregate: latest
      field: due_date
      filters:
        event_type: equipment_interest_accrual
    - category: operating
      table: operating_transactions
      aggregate: count
      field: txn_id
      within_months: 12
      filters:
        event_type: operating_fee_assessed
        fee_code: late_charge
    - table: equipment_collateral
      aggregate: count
      field: collateral_action_id
      filters:
        event_type: equipment_unit_released
        action_date: NOW
    cross_category:
    - operating
- id: equipment_ext_deferral_fee
  base_policy_refs:
  - equipment_deferral
  - equipment_agg_cross_collateral
  overwrite:
  - base_policy: equipment_deferral
    superseded_clause: deferral_fee_usd is assessed on the grant date
    replaced_by: >-
      The figured fee is multiplied by the casualty relief factor first, then the operating-credit credit, the early-request
      credit, the seasoning charge and the automatic-debit credit are added to that result, and the total is rounded
      once to cents and is never less than zero.
  trigger: on_request
  subject:
  - equipment_deferral_grant
  computes: deferral_fee
  target_tool: grant_installment_deferral_57477c3f
  params:
    large_inst_usd: 20000.0
    mid_inst_usd: 5000.0
    large_pct: 0.75
    mid_pct: 0.5
    relief_clean: 0.5
    relief_late: 0.75
    relief_months: 12
    rel_credit_current: -50.0
    rel_credit_other: -25.0
    early_days_1: 30
    early_days_2: 20
    early_credit_1: -25.0
    early_credit_2: -10.0
    season_bills_1: 2
    season_bills_2: 4
    season_charge_1: 50.0
    season_charge_2: 25.0
    auto_credit_clean: -20.0
    auto_charge_returned: 20.0
  rule: >-
    On the member's request one scheduled installment is deferred to the end of the schedule on a product that offers
    deferrals, while the loan is in active status: the installment after the deferred one becomes the next due,
    the maturity date moves out by one installment period, the deferral count rises by one, the grant date becomes
    the last deferral date, and the deferral fee is booked on the grant date. The deferral fee is fixed only after
    the collateral records carry the release of every pledged unit that a submitted collateral release request names
    as destroyed in a total loss. A deferral of a loan with a unit released on the grant date other than at payoff
    is not granted until the balance tested against the post-release margin stands within that margin of the tested
    value of the units still pledged. The deferral fee is the product's deferral fee for each installment deferred,
    rounded to cents. How a deferral fee is figured depends on the size of the installment deferred, taken as the
    interest and principal paid on the most recently billed installment, with the most recent interest payment and
    the most recent principal payment on that bill taken out again when the member's bank returned them: for an
    installment of 20,000.00 or more the fee is 0.75 percent of the installment; for an installment of at least
    5,000.00 but less than 20,000.00 the fee is the product's deferral fee plus 0.5 percent of the part of the installment
    above 5,000.00; for a smaller installment the fee is the product's deferral fee. A deferral fee carries casualty
    relief: it is multiplied by 0.5 when a unit of the loan was released on a total loss less than 12 whole months
    before the grant and the loan carries no late charge dated less than 12 whole months before; by 0.75 when a
    unit was released on a total loss in those 12 months and the loan carries such a late charge; and by 1.0 when
    no unit was released on a total loss in those 12 months. A deferral fee carries an operating-credit credit,
    the crop year of the grant date being its calendar year: 50.00 is taken off when the member holds an operating
    line in active status renewed for that crop year; 25.00 is taken off when the member holds an operating line
    in active status but none renewed for that crop year; and nothing when the member holds no operating line in
    active status. A deferral fee carries an early-request credit set by the days from the grant date to the due
    date of the installment deferred: 25.00 is taken off for 30 days or more, 10.00 for 20 to 29 days, and nothing
    for fewer than 20 days. A deferral fee carries a seasoning charge set by how many installments the loan has
    billed: 50.00 is added when fewer than 2 have been billed, 25.00 when 2 or 3 have been billed, and nothing when
    4 or more have been billed. A deferral fee carries an automatic-debit credit: 20.00 is taken off when the loan's
    installments are collected by automatic debit and the loan carries no returned payment dated less than 12 whole
    months before the grant; 20.00 is added when they are collected by automatic debit and the loan carries such
    a returned payment; and nothing when the loan is not on automatic debit. The figured fee is multiplied by the
    casualty relief factor first, then the operating-credit credit, the early-request credit, the seasoning charge
    and the automatic-debit credit are added to that result, and the total is rounded once to cents and is never
    less than zero.
  prerequisite:
  - problem: equipment_ext_total_loss_release_price
    kind: value_input
    gate: casualty_releases_12m
    form: state
    policy_source: >-
      The deferral fee is fixed only after the collateral records carry the release of every pledged unit that a
      submitted collateral release request names as destroyed in a total loss.
    condition: >-
      the loan's collateral records carry a release with release reason total loss for the unit whose serial number
      a submitted collateral release request names
    resolved_by: release_total_loss_unit_e8bdf554
    effect: >-
      the total-loss release is counted in the casualty record, so the deferral fee takes the casualty relief factor
  - problem: equipment_ext_post_release_curtailment
    kind: state_gate
    gate: equipment_loans.principal_balance
    form: state
    policy_source: >-
      A deferral of a loan with a unit released on the grant date other than at payoff is not granted until the
      balance tested against the post-release margin stands within that margin of the tested value of the units
      still pledged.
    condition: >-
      when a unit of the loan was released on the grant date other than at payoff, the balance tested against the
      post-release margin (the principal balance, plus the interest the post-release test adds when more than 90
      days have passed since the last due date) is no more than the post-release margin percentage of the tested
      value of the units still pledged
    resolved_by: apply_ltv_curtailment_c1e2b439
    effect: >-
      the curtailment lowers the principal balance to the post-release margin, so the deferral may be granted
  cross_category:
  - category: operating
    as: branch
    reads:
    - status
    - crop_year
    note: >-
      the operating-credit credit of the deferral fee is decided from the member's active operating line and the
      crop year it is renewed for
  compute:
  - latest_bill_id: >-
      LATEST('equipment_transactions', 'txn_id', date_field='due_date', event_type='equipment_interest_accrual')
  - latest_interest_payment_id: >-
      LATEST('equipment_transactions', 'txn_id', date_field='effective_date', event_type='equipment_interest_payment',
      source_ref_id=latest_bill_id)
  - latest_principal_payment_id: >-
      LATEST('equipment_transactions', 'txn_id', date_field='effective_date', event_type='equipment_principal_payment',
      payment_purpose='scheduled', source_ref_id=latest_bill_id)
  - installment_size: >-
      SUM('equipment_transactions', 'amount', event_type='equipment_interest_payment', source_ref_id=latest_bill_id)
      + SUM('equipment_transactions', 'amount', event_type='equipment_principal_payment', payment_purpose='scheduled',
      source_ref_id=latest_bill_id) - SUM('equipment_transactions', 'amount', event_type='equipment_interest_payment_return',
      source_ref_id=latest_interest_payment_id) - SUM('equipment_transactions', 'amount', event_type='equipment_principal_payment_return',
      source_ref_id=latest_principal_payment_id)
  - fee_figured: >-
      (K('large_pct') / 100 * installment_size) if installment_size >= K('large_inst_usd') else ((P('deferral_fee_usd')
      + K('mid_pct') / 100 * (installment_size - K('mid_inst_usd'))) if installment_size >= K('mid_inst_usd') else
      P('deferral_fee_usd'))
  - casualty_releases_12m: >-
      COUNT('equipment_collateral', within_months=K('relief_months'), date_field='action_date', event_type='equipment_unit_released',
      release_reason='total_loss')
  - late_charges_12m: >-
      COUNT('equipment_transactions', within_months=K('relief_months'), date_field='effective_date', event_type='equipment_fee_assessed',
      fee_code='late_charge')
  - casualty_relief: >-
      K('relief_clean') if (casualty_releases_12m >= 1 and late_charges_12m == 0) else (K('relief_late') if (casualty_releases_12m
      >= 1 and late_charges_12m >= 1) else 1.0)
  - grant_year: 2000 + MONTHS('2000-01-01', NOW) // 12
  - line_active: EXISTS('operating', status='active')
  - line_current_year: CFIELD('operating', 'crop_year', status='active', crop_year=grant_year) != None
  - operating_credit: K('rel_credit_current') if line_current_year else (K('rel_credit_other') if line_active else
      0)
  - next_due_on_record: F('next_due_date') if (F('next_due_date') != '' and F('next_due_date') != None) else NOW
  - days_to_due: DAYS(NOW, next_due_on_record)
  - early_credit: >-
      K('early_credit_1') if days_to_due >= K('early_days_1') else (K('early_credit_2') if days_to_due >= K('early_days_2')
      else 0)
  - installments_billed: COUNT('equipment_transactions', event_type='equipment_interest_accrual')
  - seasoning_charge: >-
      K('season_charge_1') if installments_billed < K('season_bills_1') else (K('season_charge_2') if installments_billed
      < K('season_bills_2') else 0)
  - returned_payments_12m: >-
      COUNT('equipment_transactions', within_months=K('relief_months'), date_field='effective_date', event_type='equipment_principal_payment_return')
      + COUNT('equipment_transactions', within_months=K('relief_months'), date_field='effective_date', event_type='equipment_interest_payment_return')
  - autodebit_credit: >-
      K('auto_credit_clean') if (F('autopay_enrolled') == True and returned_payments_12m == 0) else (K('auto_charge_returned')
      if (F('autopay_enrolled') == True and returned_payments_12m >= 1) else 0)
  - fee_total: >-
      MX(0, RND(fee_figured * casualty_relief + operating_credit + early_credit + seasoning_charge + autodebit_credit,
      2))
  - grant_ok: F('status') == 'active' and P('deferral_available') == True
  - result: fee_total if grant_ok else 0
  compute_basis:
    latest_bill_id: >-
      How a deferral fee is figured depends on the size of the installment deferred, taken as the interest and principal
      paid on the most recently billed installment, with the most recent interest payment and the most recent principal
      payment on that bill taken out again when the member's bank returned them: for an installment of 20,000.00
      or more the fee is 0.75 percent of the installment; for an installment of at least 5,000.00 but less than
      20,000.00 the fee is the product's deferral fee plus 0.5 percent of the part of the installment above 5,000.00;
      for a smaller installment the fee is the product's deferral fee.
    installment_size: >-
      How a deferral fee is figured depends on the size of the installment deferred, taken as the interest and principal
      paid on the most recently billed installment, with the most recent interest payment and the most recent principal
      payment on that bill taken out again when the member's bank returned them: for an installment of 20,000.00
      or more the fee is 0.75 percent of the installment; for an installment of at least 5,000.00 but less than
      20,000.00 the fee is the product's deferral fee plus 0.5 percent of the part of the installment above 5,000.00;
      for a smaller installment the fee is the product's deferral fee.
    fee_figured: >-
      How a deferral fee is figured depends on the size of the installment deferred, taken as the interest and principal
      paid on the most recently billed installment, with the most recent interest payment and the most recent principal
      payment on that bill taken out again when the member's bank returned them: for an installment of 20,000.00
      or more the fee is 0.75 percent of the installment; for an installment of at least 5,000.00 but less than
      20,000.00 the fee is the product's deferral fee plus 0.5 percent of the part of the installment above 5,000.00;
      for a smaller installment the fee is the product's deferral fee.
    casualty_releases_12m: >-
      A deferral fee carries casualty relief: it is multiplied by 0.5 when a unit of the loan was released on a
      total loss less than 12 whole months before the grant and the loan carries no late charge dated less than
      12 whole months before; by 0.75 when a unit was released on a total loss in those 12 months and the loan carries
      such a late charge; and by 1.0 when no unit was released on a total loss in those 12 months.
    late_charges_12m: >-
      A deferral fee carries casualty relief: it is multiplied by 0.5 when a unit of the loan was released on a
      total loss less than 12 whole months before the grant and the loan carries no late charge dated less than
      12 whole months before; by 0.75 when a unit was released on a total loss in those 12 months and the loan carries
      such a late charge; and by 1.0 when no unit was released on a total loss in those 12 months.
    casualty_relief: >-
      A deferral fee carries casualty relief: it is multiplied by 0.5 when a unit of the loan was released on a
      total loss less than 12 whole months before the grant and the loan carries no late charge dated less than
      12 whole months before; by 0.75 when a unit was released on a total loss in those 12 months and the loan carries
      such a late charge; and by 1.0 when no unit was released on a total loss in those 12 months.
    grant_year: >-
      A deferral fee carries an operating-credit credit, the crop year of the grant date being its calendar year:
      50.00 is taken off when the member holds an operating line in active status renewed for that crop year; 25.00
      is taken off when the member holds an operating line in active status but none renewed for that crop year;
      and nothing when the member holds no operating line in active status.
    line_active: >-
      A deferral fee carries an operating-credit credit, the crop year of the grant date being its calendar year:
      50.00 is taken off when the member holds an operating line in active status renewed for that crop year; 25.00
      is taken off when the member holds an operating line in active status but none renewed for that crop year;
      and nothing when the member holds no operating line in active status.
    line_current_year: >-
      A deferral fee carries an operating-credit credit, the crop year of the grant date being its calendar year:
      50.00 is taken off when the member holds an operating line in active status renewed for that crop year; 25.00
      is taken off when the member holds an operating line in active status but none renewed for that crop year;
      and nothing when the member holds no operating line in active status.
    operating_credit: >-
      A deferral fee carries an operating-credit credit, the crop year of the grant date being its calendar year:
      50.00 is taken off when the member holds an operating line in active status renewed for that crop year; 25.00
      is taken off when the member holds an operating line in active status but none renewed for that crop year;
      and nothing when the member holds no operating line in active status.
    days_to_due: >-
      A deferral fee carries an early-request credit set by the days from the grant date to the due date of the
      installment deferred: 25.00 is taken off for 30 days or more, 10.00 for 20 to 29 days, and nothing for fewer
      than 20 days.
    early_credit: >-
      A deferral fee carries an early-request credit set by the days from the grant date to the due date of the
      installment deferred: 25.00 is taken off for 30 days or more, 10.00 for 20 to 29 days, and nothing for fewer
      than 20 days.
    installments_billed: >-
      A deferral fee carries a seasoning charge set by how many installments the loan has billed: 50.00 is added
      when fewer than 2 have been billed, 25.00 when 2 or 3 have been billed, and nothing when 4 or more have been
      billed.
    seasoning_charge: >-
      A deferral fee carries a seasoning charge set by how many installments the loan has billed: 50.00 is added
      when fewer than 2 have been billed, 25.00 when 2 or 3 have been billed, and nothing when 4 or more have been
      billed.
    returned_payments_12m: >-
      A deferral fee carries an automatic-debit credit: 20.00 is taken off when the loan's installments are collected
      by automatic debit and the loan carries no returned payment dated less than 12 whole months before the grant;
      20.00 is added when they are collected by automatic debit and the loan carries such a returned payment; and
      nothing when the loan is not on automatic debit.
    autodebit_credit: >-
      A deferral fee carries an automatic-debit credit: 20.00 is taken off when the loan's installments are collected
      by automatic debit and the loan carries no returned payment dated less than 12 whole months before the grant;
      20.00 is added when they are collected by automatic debit and the loan carries such a returned payment; and
      nothing when the loan is not on automatic debit.
    fee_total: >-
      The figured fee is multiplied by the casualty relief factor first, then the operating-credit credit, the early-request
      credit, the seasoning charge and the automatic-debit credit are added to that result, and the total is rounded
      once to cents and is never less than zero.
    grant_ok: >-
      On the member's request one scheduled installment is deferred to the end of the schedule on a product that
      offers deferrals, while the loan is in active status: the installment after the deferred one becomes the next
      due, the maturity date moves out by one installment period, the deferral count rises by one, the grant date
      becomes the last deferral date, and the deferral fee is booked on the grant date.
    result: >-
      On the member's request one scheduled installment is deferred to the end of the schedule on a product that
      offers deferrals, while the loan is in active status: the installment after the deferred one becomes the next
      due, the maturity date moves out by one installment period, the deferral count rises by one, the grant date
      becomes the last deferral date, and the deferral fee is booked on the grant date.
    latest_interest_payment_id: >-
      How a deferral fee is figured depends on the size of the installment deferred, taken as the interest and principal
      paid on the most recently billed installment, with the most recent interest payment and the most recent principal
      payment on that bill taken out again when the member's bank returned them: for an installment of 20,000.00
      or more the fee is 0.75 percent of the installment; for an installment of at least 5,000.00 but less than
      20,000.00 the fee is the product's deferral fee plus 0.5 percent of the part of the installment above 5,000.00;
      for a smaller installment the fee is the product's deferral fee.
    latest_principal_payment_id: >-
      How a deferral fee is figured depends on the size of the installment deferred, taken as the interest and principal
      paid on the most recently billed installment, with the most recent interest payment and the most recent principal
      payment on that bill taken out again when the member's bank returned them: for an installment of 20,000.00
      or more the fee is 0.75 percent of the installment; for an installment of at least 5,000.00 but less than
      20,000.00 the fee is the product's deferral fee plus 0.5 percent of the part of the installment above 5,000.00;
      for a smaller installment the fee is the product's deferral fee.
    next_due_on_record: >-
      A deferral fee carries an early-request credit set by the days from the grant date to the due date of the
      installment deferred: 25.00 is taken off for 30 days or more, 10.00 for 20 to 29 days, and nothing for fewer
      than 20 days.
  factors:
  - id: fee_formula
    effect: method
    decides: fee_figured
    bindings:
    - latest_bill_id
    - latest_interest_payment_id
    - latest_principal_payment_id
    - installment_size
    - fee_figured
    ladder:
    - when: the installment deferred is 20,000.00 or more
      method: 0.75 percent of the installment
    - when: at least 5,000.00 but less than 20,000.00
      method: the product's deferral fee plus 0.5 percent of the part of the installment above 5,000.00
    - when: otherwise (less than 5,000.00)
      method: the product's flat deferral fee
    baseline:
      fee_figured: P('deferral_fee_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: casualty_relief
    effect: parameter
    decides: casualty_relief
    bindings:
    - casualty_releases_12m
    - late_charges_12m
    - casualty_relief
    ladder:
    - when: a unit released on a total loss in the last 12 months AND no late charge in the last 12 months
      value: the figured fee is multiplied by 0.5
    - when: a unit released on a total loss in the last 12 months AND a late charge in the last 12 months
      value: the figured fee is multiplied by 0.75
    - when: otherwise (no total-loss release in 12 months)
      value: the figured fee is taken as figured
    baseline:
      casualty_relief: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: operating_credit
    effect: parameter
    decides: operating_credit
    bindings:
    - grant_year
    - line_active
    - line_current_year
    - operating_credit
    ladder:
    - when: an operating line in active status renewed for the crop year of the grant date
      value: '-50.00'
    - when: an operating line in active status, but none of the member's active lines renewed for that crop year
      value: '-25.00'
    - when: otherwise (no active operating line)
      value: '0'
    baseline:
      operating_credit: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: operating
  - id: early_request_credit
    effect: parameter
    decides: early_credit
    bindings:
    - days_to_due
    - early_credit
    ladder:
    - when: 30 days or more from the grant date to the due date deferred
      value: '-25.00'
    - when: 20 to 29 days
      value: '-10.00'
    - when: otherwise (fewer than 20)
      value: '0'
    baseline:
      early_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: seasoning_charge
    effect: parameter
    decides: seasoning_charge
    bindings:
    - installments_billed
    - seasoning_charge
    ladder:
    - when: fewer than 2 installments billed
      value: '+50.00'
    - when: 2 or 3 installments billed
      value: '+25.00'
    - when: otherwise (4 or more)
      value: '0'
    baseline:
      seasoning_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: autodebit_credit
    effect: parameter
    decides: autodebit_credit
    bindings:
    - returned_payments_12m
    - autodebit_credit
    ladder:
    - when: installments collected by automatic debit AND no returned payment in the last 12 months
      value: '-20.00'
    - when: installments collected by automatic debit AND a returned payment in the last 12 months
      value: '+20.00'
    - when: otherwise (not on automatic debit)
      value: '0'
    baseline:
      autodebit_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The deferral fee is the product's deferral fee for each installment deferred, rounded to cents.
    params:
    - deferral_fee_usd
  inputs:
    history:
    - table: equipment_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: equipment_interest_payment|equipment_principal_payment
    - table: equipment_collateral
      aggregate: count
      field: collateral_action_id
      within_months: 12
      filters:
        event_type: equipment_unit_released
        release_reason: total_loss
    - table: equipment_transactions
      aggregate: count
      field: txn_id
      filters:
        event_type: >-
          equipment_interest_accrual|equipment_fee_assessed|equipment_principal_payment_return|equipment_interest_payment_return
    cross_category:
    - operating
