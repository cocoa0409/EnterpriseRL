events:
- type: equipment_loan_open
  target: equipment_loans
  mutation: create
  meaning: An application to finance one or more units is registered.
  grain: One row per application; the row becomes the loan once funded.
  fields:
    loan_id: Reference of the new loan.
    customer_id: Applying member.
    variant_name: Official name of the product applied for.
    original_principal: Amount requested, USD.
    rate_type: fixed or variable as requested.
    payment_frequency: Installment frequency requested.
    dealer_name: Originating dealer for an EquipDirect Dealer Contract, else empty.
    applied_date: Date received.
  triggers: []
- type: equipment_loan_fund
  target: equipment_loans
  mutation:
    transition:
      from: applied
      to: active
  meaning: The approved loan is funded to the seller or dealer after the lien is perfected.
  grain: One per loan.
  fields:
    opened_date: Funding date.
    interest_rate: Contract rate set under equipment_rate_setting.
    installment_amount: Level installment amortising original_principal over the term at the contract rate.
    next_due_date: First installment due date.
    maturity_date: Final installment due date.
    insurance_expiry_date: Expiry of the proof of insurance received at funding.
    insurance_carrier: Insurer named on that proof.
    autopay_enrolled: Whether automatic debit was authorised at closing.
    autopay_account_last4: Last four digits of the debited account, else empty.
  triggers:
  - event: equipment:equipment_fee_assessed
    map:
      fee_code: loan_fee
      effective_date: opened_date
      channel: system
- type: equipment_loan_decline
  target: equipment_loans
  mutation:
    transition:
      from: applied
      to: declined
  meaning: The credit decision on the application is a decline.
  grain: One per declined application.
  fields:
    closed_date: Decision date.
  triggers: []
- type: equipment_deferral_grant
  target: equipment_loans
  mutation:
    transition:
      from: active
      to: deferred
  meaning: One installment is deferred to the end of the schedule at the member's request.
  grain: One per deferral granted.
  fields:
    next_due_date: Due date of the installment after the deferred one.
    maturity_date: Old maturity date plus one installment period.
    deferrals_used: Previous count plus 1.
    last_deferral_date: Date the deferral was granted.
  triggers:
  - event: equipment:equipment_fee_assessed
    map:
      fee_code: deferral
      effective_date: last_deferral_date
      channel: system
- type: equipment_deferral_end
  target: equipment_loans
  mutation:
    transition:
      from: deferred
      to: active
  meaning: The deferral period ends when the installment after the deferred one comes due.
  grain: One per deferral.
  fields:
    next_due_date: Due date of the following installment.
  triggers: []
- type: equipment_nonaccrual
  target: equipment_loans
  mutation:
    transition:
      from: active
      to: nonaccrual
  meaning: The loan is placed in nonaccrual because an installment stayed unpaid for the threshold.
  grain: One per placement.
  fields:
    nonaccrual_date: Date placed in nonaccrual.
  triggers: []
- type: equipment_accrual_restore
  target: equipment_loans
  mutation:
    transition:
      from: nonaccrual
      to: active
  meaning: The loan returns to accrual once all past-due installments are paid.
  grain: One per restoration.
  fields:
    nonaccrual_date: Cleared to empty.
  triggers: []
- type: equipment_loan_payoff
  target: equipment_loans
  mutation:
    transition:
    - from: active
      to: paid_off
    - from: deferred
      to: paid_off
    - from: nonaccrual
      to: paid_off
  meaning: The final installment or a payoff brings everything owed to zero.
  grain: One per loan.
  fields:
    closed_date: Effective date of the final payment.
    next_due_date: Cleared to empty.
  triggers:
  - event: equipment:equipment_unit_released
    map:
      release_reason: payoff
      action_date: closed_date
- type: equipment_installment_roll
  target: equipment_loans
  mutation: update
  meaning: An installment is billed and the next due date moves to the following installment.
  grain: One per installment billed.
  fields:
    next_due_date: Due date of the following installment, or empty after the final one.
  triggers:
  - event: equipment:equipment_interest_accrual
    map:
      channel: system
- type: equipment_reamortize
  target: equipment_loans
  mutation: update
  meaning: >-
    The installment is recalculated over the remaining schedule after principal was paid down ahead of schedule.
  grain: One per re-amortization.
  fields:
    installment_amount: >-
      New level installment amortising principal_balance over the installments remaining to maturity at the contract
      rate.
  triggers:
  - event: equipment:equipment_fee_assessed
    map:
      fee_code: reamortization
      channel: system
- type: equipment_autopay_change
  target: equipment_loans
  mutation: update
  meaning: Automatic debit of installments is authorised, moved to another account or cancelled.
  grain: One per change.
  fields:
    autopay_enrolled: New flag.
    autopay_account_last4: Last four digits of the debited account, empty when cancelled.
    interest_rate: Contract rate after the autopay discount is added or removed.
  triggers: []
- type: equipment_insurance_update
  target: equipment_loans
  mutation: update
  meaning: >-
    Renewed or replacement proof of physical-damage insurance naming the association loss payee is recorded.
  grain: One per proof received.
  fields:
    insurance_expiry_date: Expiry date on the new proof.
    insurance_carrier: Insurer on the new proof.
  triggers: []
- type: equipment_rate_reset
  target: equipment_loans
  mutation: update
  meaning: A variable-rate loan's contract rate moves with the Association Variable Base Rate.
  grain: One per loan per base-rate change.
  fields:
    interest_rate: New contract rate.
  triggers: []
- type: equipment_interest_accrual
  target: equipment_transactions
  meaning: Interest for one installment period is booked and billed with the installment.
  grain: One row per installment billed.
  distinguish_by:
  - period_start
  - period_end
  fields:
    amount: Interest for the period, USD.
    period_start: Day after the previous due date (funding date for the first installment).
    period_end: Installment due date.
    due_date: Installment due date.
    rate_applied: Annual rate used.
    channel: Always system.
  account: interest_accrued
  direction: in
  triggers: []
- type: equipment_interest_payment
  target: equipment_transactions
  meaning: A remittance (or its interest share) is applied to the interest of one installment.
  grain: One row per installment per remittance.
  distinguish_by:
  - source_ref_id
  - effective_date
  - amount
  - channel
  fields:
    amount: Interest paid, USD.
    effective_date: Date received.
    channel: Channel.
    source_ref_id: The installment bill (interest accrual row) paid.
  account: interest_accrued
  direction: out
  triggers: []
- type: equipment_principal_payment
  target: equipment_transactions
  meaning: A remittance (or its principal share) is applied to principal.
  grain: One row per principal application.
  distinguish_by:
  - payment_purpose
  - source_ref_id
  - effective_date
  - amount
  - channel
  fields:
    amount: Principal paid, USD.
    effective_date: Date received.
    channel: Channel.
    payment_purpose: scheduled, prepayment, release_proceeds or payoff.
    source_ref_id: The installment bill for a scheduled payment, the release record for release proceeds, else empty.
  account: principal
  direction: out
  triggers: []
- type: equipment_fee_assessed
  target: equipment_transactions
  meaning: A fee or charge is assessed on the loan.
  grain: One row per fee occurrence.
  distinguish_by:
  - fee_code
  - effective_date
  - source_ref_id
  fields:
    fee_code: Which fee.
    amount: Fee amount, USD.
    effective_date: Date assessed.
    source_ref_id: The installment, returned payment, collateral record or payment the fee arises from, else empty.
    channel: Always system.
  account: fees
  direction: in
  triggers: []
- type: equipment_fee_payment
  target: equipment_transactions
  meaning: A remittance (or its fee share) is applied to one assessed fee.
  grain: One row per assessment per remittance.
  distinguish_by:
  - source_ref_id
  - effective_date
  - amount
  - channel
  fields:
    fee_code: Code of the fee paid.
    amount: Amount applied, USD.
    effective_date: Date received.
    channel: Channel.
    source_ref_id: The fee assessment paid.
  account: fees
  direction: out
  triggers: []
- type: equipment_fee_waiver
  target: equipment_transactions
  meaning: An assessed fee is waived in whole.
  grain: One row per waived assessment.
  distinguish_by:
  - source_ref_id
  - waiver_basis
  fields:
    fee_code: Code of the fee waived.
    amount: Unpaid amount waived, USD.
    effective_date: Date of the waiver.
    source_ref_id: The fee assessment waived.
    waiver_basis: courtesy or error_correction.
  account: fees
  direction: out
  triggers: []
- type: equipment_principal_payment_return
  target: equipment_transactions
  meaning: A principal payment is returned unpaid by the member's bank and reversed.
  grain: One row per returned principal payment.
  distinguish_by:
  - source_ref_id
  fields:
    amount: Amount of the original payment, USD.
    effective_date: Effective date of the original payment.
    source_ref_id: The principal payment reversed.
    return_reason: Bank return reason.
  account: principal
  direction: in
  triggers:
  - event: equipment:equipment_fee_assessed
    when:
      return_reason:
        not: unauthorized
    map:
      fee_code: returned_payment
      source_ref_id: txn_id
      channel: system
- type: equipment_interest_payment_return
  target: equipment_transactions
  meaning: An interest payment is returned unpaid by the member's bank and reversed.
  grain: One row per returned interest payment.
  distinguish_by:
  - source_ref_id
  fields:
    amount: Amount of the original payment, USD.
    effective_date: Effective date of the original payment.
    source_ref_id: The interest payment reversed.
    return_reason: Bank return reason.
  account: interest_accrued
  direction: in
  triggers: []
- type: equipment_unit_pledged
  target: equipment_collateral
  meaning: A unit is pledged as collateral for the loan (at funding or in substitution for another unit).
  grain: One row per unit pledged.
  distinguish_by:
  - serial_number
  - action_date
  fields:
    unit_description: Make, model and type.
    serial_number: PIN or VIN.
    model_year: Model year.
    pledged_value: Purchase price or appraised value at pledge, USD.
    action_date: Date the lien attached.
    source_action_id: For a substitution, the release record of the unit replaced; else empty.
  account: collateral_pledged
  direction: in
  triggers:
  - event: equipment:equipment_fee_assessed
    map:
      fee_code: lien_filing
      source_ref_id: collateral_action_id
      effective_date: action_date
      channel: system
- type: equipment_unit_released
  target: equipment_collateral
  meaning: The association's lien on one pledged unit is released.
  grain: One row per unit released.
  distinguish_by:
  - source_action_id
  fields:
    unit_description: Copied from the pledge record.
    serial_number: Copied from the pledge record.
    model_year: Copied from the pledge record.
    pledged_value: Pledged value of the unit released, USD.
    action_date: Date of the release.
    source_action_id: The pledge record of the unit released.
    release_reason: payoff, sale, substitution or total_loss.
  account: collateral_pledged
  direction: out
  triggers:
  - event: equipment:equipment_principal_payment
    when:
      release_reason:
      - sale
      - total_loss
    map:
      payment_purpose: release_proceeds
      source_ref_id: collateral_action_id
      effective_date: action_date
  - event: equipment:equipment_fee_assessed
    when:
      release_reason: sale
    map:
      fee_code: partial_release
      source_ref_id: collateral_action_id
      effective_date: action_date
      channel: system
  - event: equipment:equipment_fee_assessed
    when:
      release_reason: substitution
    map:
      fee_code: substitution
      source_ref_id: collateral_action_id
      effective_date: action_date
      channel: system
measures:
- id: equipment_msr_installment_paid
  window: All rows on the loan.
  measure: >-
    For one installment bill, the sum of amount over equipment_interest_payment rows and equipment_principal_payment
    rows with payment_purpose scheduled whose source_ref_id is that bill, minus the amount of return rows reversing
    any of those payments.
- id: equipment_msr_past_due_installments
  window: Installment bills on the loan whose due_date is earlier than the date considered.
  measure: >-
    Count of those bills for which equipment_msr_installment_paid is below the installment due (installment_amount
    in force at billing; for the final installment, the bill's interest plus the principal then outstanding).
- id: equipment_msr_installments_paid_count
  window: All installment bills on the loan since funding.
  measure: >-
    Count of installment bills paid in full (equipment_msr_installment_paid at least the installment due).
- id: equipment_msr_principal_day_sum
  window: The days of the installment period being billed, period_start through period_end inclusive.
  measure: >-
    Sum over each calendar day of the end-of-day principal balance (payments and back-dated returns effective that
    day included).
- id: equipment_msr_courtesy_waivers_12m
  window: >-
    Rolling 12 months ending on the date considered, from the same calendar date one year earlier (exclusive) through
    that date (inclusive).
  measure: Count of equipment_fee_waiver rows on the loan with waiver_basis courtesy in the window.
- id: equipment_msr_loan_year_prepaid
  window: >-
    The current loan year — the 12-month period beginning on the funding date or on an anniversary of it — through
    the date considered.
  measure: >-
    Sum of amount over equipment_principal_payment rows with payment_purpose prepayment in the window, net of returns.
- id: equipment_msr_curtailment_since_reamortization
  window: >-
    From the effective date of the latest equipment_fee_assessed row with fee_code reamortization (or from opened_date
    if none) through the date considered.
  measure: >-
    Sum of amount over equipment_principal_payment rows with payment_purpose prepayment or release_proceeds in the
    window, net of returns.
- id: equipment_msr_units_pledged
  window: All collateral records on the loan.
  measure: Count of equipment_unit_pledged rows minus count of equipment_unit_released rows.
- id: equipment_msr_member_delinquent_loans
  window: The member's equipment loans at the date considered, excluding the loan being acted on.
  measure: Count of those loans in nonaccrual status or with equipment_msr_past_due_installments at least 1.
- id: equipment_msr_active_operating_lines
  window: The member's portfolio on the rate effective date.
  measure: Count of the member's operating_lines rows in active status.
- id: equipment_msr_suspended_operating_lines
  window: The member's portfolio on the date considered.
  measure: Count of the member's operating_lines rows in suspended status.
policies:
- id: equipment_agg_multi_holding
  subject:
  - equipment_loan_open
  rule: >-
    A member may hold any number of equipment loans; each financed purchase is its own loan with its own schedule,
    rate and collateral, and units bought together from one seller on one bill of sale are financed on one loan.
    There is no cap on the number of loans held (max_per_customer null); how loans held together interact is set
    by equipment_agg_cross_collateral.
  eligibility: []
  params:
    max_per_customer: null
- id: equipment_agg_cross_collateral
  subject:
  - equipment_unit_released
  - equipment_unit_pledged
  - equipment_deferral_grant
  rule: >-
    Every equipment loan a member holds is secured by the units pledged to it and, under the cross-collateral clause
    of the security agreement, by the units pledged to the member's other equipment loans. A unit may be released
    on sale, substituted or released after total loss only when none of the member's other equipment loans is in
    nonaccrual status or has a past-due installment (equipment_msr_member_delinquent_loans is 0). The same test
    applies to a deferral. Paying a loan off in full always releases that loan's own units, whatever the state of
    the member's other loans. The loan-to-value test after a release or substitution is applied to each loan on
    its own principal and its own remaining pledged value.
  eligibility:
  - id: no_delinquent_sibling_loan
    applies_to:
    - equipment_unit_released
    kind: authorization
    condition: >-
      A unit may be released on sale, substituted or released after total loss only when none of the member's other
      equipment loans is in nonaccrual status or has a past-due installment (equipment_msr_member_delinquent_loans
      is 0).
    evidence_fields:
    - equipment_loans.customer_id
    - equipment_loans.status
    - equipment_transactions.due_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_loans.customer_id
      action_bindings:
        equipment_loans.customer_id: customer_id
  measures:
  - equipment_msr_member_delinquent_loans
- id: equipment_application_funding
  subject:
  - equipment_loan_open
  - equipment_loan_fund
  - equipment_loan_decline
  - equipment_unit_pledged
  rule: >-
    An application is registered with the product's official name, the amount, the rate type and the installment
    frequency requested; a credit officer decides it, and the servicing desk never approves or declines. The amount
    may not exceed max_loan_usd or fall below min_loan_usd, and may not exceed max_advance_new_pct of the purchase
    price of new units or max_advance_used_pct of the purchase price or appraised value (whichever is lower) of
    pre-owned units; a unit older than max_unit_age_years from its model year is not financed. The term may not
    exceed max_term_months and the frequency must be one of payment_frequencies_allowed; a variable rate may be
    chosen only where variable_rate_available is true. An EquipDirect Dealer Contract is originated only through
    a participating dealer, whose name is recorded. The loan is funded only after every unit is pledged with its
    serial number and pledged value, proof of physical-damage insurance naming the association loss payee is received
    and the member holds the stock or participation certificate required under equity_stock_requirement. On funding
    the first installment falls no more than first_installment_max_days after the funding date, the installment
    is the level payment amortising the original principal over the term at the contract rate, rounded up to the
    cent, and a loan fee of loan_fee_pct of original principal, bounded by loan_fee_min_usd and loan_fee_max_usd,
    is assessed; a product whose loan fee bounds are both zero books no loan fee row. Each unit pledged carries
    lien_filing_fee_usd.
  eligibility: []
  params:
    per_tier:
      Truck & Trailer Loan:
        min: =min_loan_usd
        max: =max_loan_usd
        term: =max_term_months
        new_pct: =max_advance_new_pct
        used_pct: =max_advance_used_pct
        age: =max_unit_age_years
        fee_pct: =loan_fee_pct
        fee_min: =loan_fee_min_usd
        fee_max: =loan_fee_max_usd
        filing: =lien_filing_fee_usd
      EquipDirect Dealer Contract:
        min: =min_loan_usd
        max: =max_loan_usd
        term: =max_term_months
        new_pct: =max_advance_new_pct
        used_pct: =max_advance_used_pct
        age: =max_unit_age_years
        fee_pct: =loan_fee_pct
        fee_min: =loan_fee_min_usd
        fee_max: =loan_fee_max_usd
        filing: =lien_filing_fee_usd
      Used Equipment Loan:
        min: =min_loan_usd
        max: =max_loan_usd
        term: =max_term_months
        new_pct: =max_advance_new_pct
        used_pct: =max_advance_used_pct
        age: =max_unit_age_years
        fee_pct: =loan_fee_pct
        fee_min: =loan_fee_min_usd
        fee_max: =loan_fee_max_usd
        filing: =lien_filing_fee_usd
      New Equipment Loan:
        min: =min_loan_usd
        max: =max_loan_usd
        term: =max_term_months
        new_pct: =max_advance_new_pct
        used_pct: =max_advance_used_pct
        age: =max_unit_age_years
        fee_pct: =loan_fee_pct
        fee_min: =loan_fee_min_usd
        fee_max: =loan_fee_max_usd
        filing: =lien_filing_fee_usd
      Irrigation System Loan:
        min: =min_loan_usd
        max: =max_loan_usd
        term: =max_term_months
        new_pct: =max_advance_new_pct
        used_pct: =max_advance_used_pct
        age: =max_unit_age_years
        fee_pct: =loan_fee_pct
        fee_min: =loan_fee_min_usd
        fee_max: =loan_fee_max_usd
        filing: =lien_filing_fee_usd
      Grain Storage & Handling Loan:
        min: =min_loan_usd
        max: =max_loan_usd
        term: =max_term_months
        new_pct: =max_advance_new_pct
        used_pct: =max_advance_used_pct
        age: =max_unit_age_years
        fee_pct: =loan_fee_pct
        fee_min: =loan_fee_min_usd
        fee_max: =loan_fee_max_usd
        filing: =lien_filing_fee_usd
  formula:
    loan_fee: min(loan_fee_max_usd, max(loan_fee_min_usd, round(original_principal * loan_fee_pct / 100, 2)))
- id: equipment_rate_setting
  subject:
  - equipment_loan_fund
  - equipment_autopay_change
  - equipment_rate_reset
  rule: >-
    A fixed rate is read from the product's fixed_rate_sheet: the rate of the first band whose max_term_months is
    at least the loan's term. A variable rate is the Association Variable Base Rate in effect on the rate effective
    date, as registered in operating_rate_setting, plus variable_rate_spread_pct. From either, the autopay discount
    autopay_rate_discount_pct applies while autopay_enrolled is true, and the relationship discount relationship_rate_discount_pct
    applies when the member holds an operating line in active status on the funding date (equipment_msr_active_operating_lines
    at least 1); the two are added and capped at rate_discount_cap_pct, and the result is rounded to 3 decimal places
    and may not be lower than rate_floor_pct. An EquipDirect Dealer Contract carries the dealer-supported rate of
    its sheet and takes no discount of any kind, because dealer promotional rates exclude all other pricing. The
    relationship discount is fixed at funding and is not removed if the operating line later closes; the autopay
    discount is added or removed on the day autopay is enrolled or cancelled. A variable rate moves on each base-rate
    history date for loans in active, deferred or nonaccrual status, and the installment is not changed by a rate
    move (the final installment absorbs the difference).
  eligibility: []
  measures:
  - equipment_msr_active_operating_lines
  params:
    per_tier:
      Truck & Trailer Loan:
        sheet: =fixed_rate_sheet
        spread: =variable_rate_spread_pct
        floor: =rate_floor_pct
        autopay: =autopay_rate_discount_pct
        relationship: =relationship_rate_discount_pct
        cap: =rate_discount_cap_pct
      EquipDirect Dealer Contract:
        sheet: =fixed_rate_sheet
        spread: =variable_rate_spread_pct
        floor: =rate_floor_pct
        autopay: =autopay_rate_discount_pct
        relationship: =relationship_rate_discount_pct
        cap: =rate_discount_cap_pct
      Used Equipment Loan:
        sheet: =fixed_rate_sheet
        spread: =variable_rate_spread_pct
        floor: =rate_floor_pct
        autopay: =autopay_rate_discount_pct
        relationship: =relationship_rate_discount_pct
        cap: =rate_discount_cap_pct
      New Equipment Loan:
        sheet: =fixed_rate_sheet
        spread: =variable_rate_spread_pct
        floor: =rate_floor_pct
        autopay: =autopay_rate_discount_pct
        relationship: =relationship_rate_discount_pct
        cap: =rate_discount_cap_pct
      Irrigation System Loan:
        sheet: =fixed_rate_sheet
        spread: =variable_rate_spread_pct
        floor: =rate_floor_pct
        autopay: =autopay_rate_discount_pct
        relationship: =relationship_rate_discount_pct
        cap: =rate_discount_cap_pct
      Grain Storage & Handling Loan:
        sheet: =fixed_rate_sheet
        spread: =variable_rate_spread_pct
        floor: =rate_floor_pct
        autopay: =autopay_rate_discount_pct
        relationship: =relationship_rate_discount_pct
        cap: =rate_discount_cap_pct
  formula:
    autopay_part: autopay_rate_discount_pct if autopay_enrolled else 0
    relationship_part: relationship_rate_discount_pct if equipment_msr_active_operating_lines >= 1 else 0
    discount_total: min(rate_discount_cap_pct, autopay_part + relationship_part)
- id: equipment_installment_billing
  subject:
  - equipment_installment_roll
  - equipment_interest_accrual
  rule: >-
    Interest is simple interest accruing daily on the principal balance using day_count_basis actual_365. On each
    installment due date the interest for the installment period — from the day after the previous due date (the
    funding date for the first installment) through the due date, both inclusive — is booked as one accrual row
    billed with that installment, rounded once to cents, and next_due_date moves forward by one installment period
    (one, three, six or twelve calendar months by payment_frequency; when the day does not exist in the target month
    the last day of that month is used). The installment due is installment_amount, of which the billed interest
    is the interest share and the rest the principal share; the final installment is the billed interest plus all
    principal then outstanding. A deferred installment is not billed on its original date: its period simply runs
    on to the next due date. While a loan is in nonaccrual status, accrual rows are still booked for the record
    but no late charge is assessed on them.
  eligibility: []
  params:
    per_tier:
      Truck & Trailer Loan:
        basis: =day_count_basis
        frequencies: =payment_frequencies_allowed
      EquipDirect Dealer Contract:
        basis: =day_count_basis
        frequencies: =payment_frequencies_allowed
      Used Equipment Loan:
        basis: =day_count_basis
        frequencies: =payment_frequencies_allowed
      New Equipment Loan:
        basis: =day_count_basis
        frequencies: =payment_frequencies_allowed
      Irrigation System Loan:
        basis: =day_count_basis
        frequencies: =payment_frequencies_allowed
      Grain Storage & Handling Loan:
        basis: =day_count_basis
        frequencies: =payment_frequencies_allowed
  measures:
  - equipment_msr_principal_day_sum
  formula:
    amount: round(equipment_msr_principal_day_sum * rate_applied / 100 / 365, 2)
- id: equipment_payment_application
  subject:
  - equipment_interest_payment
  - equipment_principal_payment
  - equipment_fee_payment
  rule: >-
    A payment may be applied only while the loan is in active, deferred or nonaccrual status. An installment payment
    is applied to the oldest unpaid installment first: its billed interest (an interest payment row) and then its
    principal share (a principal payment row with payment_purpose scheduled), both pointing to that installment
    bill through source_ref_id. An undesignated remittance follows the product's payment_application_order across
    assessed fees, unpaid installments and principal; any amount left after every billed item is paid is a prepayment,
    handled under equipment_prepayment. A remittance the member designates as a prepayment is applied to principal
    as a prepayment only when no installment is past due; otherwise it first pays the past-due installments. A payoff
    applies, in order, fees, billed interest, interest accrued since the last due date through the payoff date (booked
    as a final accrual row with that date as period_end and due_date), any prepayment fee, and all principal, with
    payment_purpose payoff.
  eligibility:
  - id: loan_accepts_payments
    applies_to:
    - equipment_interest_payment
    - equipment_principal_payment
    - equipment_fee_payment
    kind: state
    condition: A payment may be applied only while the loan is in active, deferred or nonaccrual status.
    evidence_fields:
    - equipment_loans.status
    - equipment_loans.loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_loans.loan_id
      action_bindings:
        equipment_loans.loan_id: loan_id
    state_contract:
      field: equipment_loans.status
      allowed:
      - active
      - deferred
      - nonaccrual
  measures:
  - equipment_msr_installment_paid
  - equipment_msr_past_due_installments
  params:
    per_tier:
      Truck & Trailer Loan:
        order: =payment_application_order
      EquipDirect Dealer Contract:
        order: =payment_application_order
      Used Equipment Loan:
        order: =payment_application_order
      New Equipment Loan:
        order: =payment_application_order
      Irrigation System Loan:
        order: =payment_application_order
      Grain Storage & Handling Loan:
        order: =payment_application_order
- id: equipment_evt_late_charge
  subject:
  - equipment_fee_assessed
  - equipment_fee_waiver
  rule: >-
    A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date
    of the installment, counted with the due date itself as day 0, so the charge first arises on the day after the
    last grace day. It applies to an installment not paid in full by then (equipment_msr_installment_paid below
    the installment due), at late_charge_pct of the unpaid part of the installment, no less than late_charge_min_usd
    and no more than late_charge_max_usd, rounded to cents, as a fee row with fee_code late_charge whose source_ref_id
    is the installment bill. Only one late charge may be assessed per installment. No late charge applies to an
    installment deferred under equipment_deferral, to fees, or while the loan is in nonaccrual status. A late charge
    is waived with waiver_basis error_correction when a payment effective on or before the last grace day paid the
    installment in full; on the member's request it may be waived with waiver_basis courtesy only when the installment
    has since been paid in full and equipment_msr_courtesy_waivers_12m is below courtesy_waivers_per_12_months.
    One waiver per fee assessment, for its unpaid amount.
  eligibility:
  - id: installment_late_after_grace
    applies_to:
    - equipment_fee_assessed
    kind: time
    condition: >-
      A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date
      of the installment
    evidence_fields:
    - equipment_transactions.due_date
    - equipment_transactions.txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_transactions.txn_id
      action_bindings:
        equipment_transactions.txn_id: source_ref_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of the installment
      anchor_source: equipment_transactions.due_date
      relation: not_before
      duration_source: variants.late_charge_grace_days
      unit: calendar_days
      counting_rule: >-
        counted with the due date itself as day 0, so the charge first arises on the day after the last grace day
      boundary: exclusive
  - id: one_late_charge_per_installment
    applies_to:
    - equipment_fee_assessed
    kind: dedup
    condition: Only one late charge may be assessed per installment.
    evidence_fields:
    - equipment_transactions.source_ref_id
    - equipment_transactions.fee_code
    - equipment_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_transactions.source_ref_id
      action_bindings:
        equipment_transactions.source_ref_id: source_ref_id
    dedup_contract:
      table: equipment_transactions
      mode: separate_record
      object_bindings:
        source_ref_id: source_ref_id
      duplicate_filters:
        event_type:
        - equipment_fee_assessed
        fee_code:
        - late_charge
      distinct_fields: []
  measures:
  - equipment_msr_installment_paid
  - equipment_msr_courtesy_waivers_12m
  params:
    per_tier:
      Truck & Trailer Loan:
        pct: =late_charge_pct
        min: =late_charge_min_usd
        max: =late_charge_max_usd
        grace: =late_charge_grace_days
        courtesy: =courtesy_waivers_per_12_months
      EquipDirect Dealer Contract:
        pct: =late_charge_pct
        min: =late_charge_min_usd
        max: =late_charge_max_usd
        grace: =late_charge_grace_days
        courtesy: =courtesy_waivers_per_12_months
      Used Equipment Loan:
        pct: =late_charge_pct
        min: =late_charge_min_usd
        max: =late_charge_max_usd
        grace: =late_charge_grace_days
        courtesy: =courtesy_waivers_per_12_months
      New Equipment Loan:
        pct: =late_charge_pct
        min: =late_charge_min_usd
        max: =late_charge_max_usd
        grace: =late_charge_grace_days
        courtesy: =courtesy_waivers_per_12_months
      Irrigation System Loan:
        pct: =late_charge_pct
        min: =late_charge_min_usd
        max: =late_charge_max_usd
        grace: =late_charge_grace_days
        courtesy: =courtesy_waivers_per_12_months
      Grain Storage & Handling Loan:
        pct: =late_charge_pct
        min: =late_charge_min_usd
        max: =late_charge_max_usd
        grace: =late_charge_grace_days
        courtesy: =courtesy_waivers_per_12_months
  formula:
    late_charge: >-
      min(late_charge_max_usd, max(late_charge_min_usd, round((installment_amount - equipment_msr_installment_paid)
      * late_charge_pct / 100, 2)))
- id: equipment_evt_returned_payment
  subject:
  - equipment_principal_payment_return
  - equipment_interest_payment_return
  - equipment_fee_assessed
  rule: >-
    A payment returned unpaid by the member's bank is reversed row by row: each interest and principal payment row
    of the returned remittance gets its own return row with the original amount and effective date and source_ref_id
    pointing to it, which reopens the installment it had paid. A payment may be reversed only once. One returned
    payment fee of returned_payment_fee_usd is assessed per returned remittance, booked from the principal return
    row through the trigger (an interest-only remittance books the fee from its interest return row in the same
    way), and no fee is charged when the return reason is unauthorized. A late charge that becomes due because the
    reopened installment is now late is assessed under equipment_evt_late_charge as of the day it arises.
  eligibility:
  - id: equipment_reverse_once
    applies_to:
    - equipment_principal_payment_return
    - equipment_interest_payment_return
    kind: dedup
    condition: A payment may be reversed only once.
    evidence_fields:
    - equipment_transactions.source_ref_id
    - equipment_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_transactions.source_ref_id
      action_bindings:
        equipment_transactions.source_ref_id: source_ref_id
    dedup_contract:
      table: equipment_transactions
      mode: separate_record
      object_bindings:
        source_ref_id: source_ref_id
      duplicate_filters:
        event_type:
        - equipment_principal_payment_return
        - equipment_interest_payment_return
      distinct_fields: []
  params:
    per_tier:
      Truck & Trailer Loan:
        fee: =returned_payment_fee_usd
      EquipDirect Dealer Contract:
        fee: =returned_payment_fee_usd
      Used Equipment Loan:
        fee: =returned_payment_fee_usd
      New Equipment Loan:
        fee: =returned_payment_fee_usd
      Irrigation System Loan:
        fee: =returned_payment_fee_usd
      Grain Storage & Handling Loan:
        fee: =returned_payment_fee_usd
- id: equipment_deferral
  subject:
  - equipment_deferral_grant
  - equipment_deferral_end
  - equipment_fee_assessed
  rule: >-
    On the member's request, one scheduled installment may be deferred to the end of the schedule on a product with
    deferral_available true. A deferral request must be registered at least deferral_request_lead_days calendar
    days before the due date of the installment to be deferred. The days are counted backwards from that due date
    as calendar days, the due date itself being day 0, and the last qualifying day is the one exactly that many
    days earlier. A deferral may be granted no earlier than deferral_spacing_months calendar months after the last
    deferral was granted, counted from the last deferral date to the same day of the target month (the last day
    of that month when the day does not exist), that day itself qualifying. A deferral may be granted only when
    the member holds no operating line in suspended status (equipment_msr_suspended_operating_lines is 0), because
    frozen operating credit puts the whole relationship under loan-officer review. It further requires that the
    loan is in active status with no past-due installment, that at least deferral_min_installments_paid installments
    have been paid in full since funding (equipment_msr_installments_paid_count), that deferrals_used is below max_deferrals_life,
    and that the test of equipment_agg_cross_collateral is met. Interest keeps accruing through the deferral and
    is billed with the next installment; the maturity date moves out by one installment period and deferral_fee_usd
    is assessed on the grant date. The deferral ends, and the loan returns to active status, when the next installment
    comes due.
  eligibility:
  - id: deferral_lead_time
    applies_to:
    - equipment_deferral_grant
    kind: time
    condition: >-
      A deferral request must be registered at least deferral_request_lead_days calendar days before the due date
      of the installment to be deferred.
    evidence_fields:
    - equipment_loans.next_due_date
    - equipment_loans.loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_loans.loan_id
      action_bindings:
        equipment_loans.loan_id: loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of the installment to be deferred
      anchor_source: equipment_loans.next_due_date
      relation: not_after
      duration_source: variants.deferral_request_lead_days
      unit: calendar_days
      counting_rule: >-
        The days are counted backwards from that due date as calendar days, the due date itself being day 0, and
        the last qualifying day is the one exactly that many days earlier.
      boundary: inclusive
  - id: deferral_spacing
    applies_to:
    - equipment_deferral_grant
    kind: time
    condition: >-
      A deferral may be granted no earlier than deferral_spacing_months calendar months after the last deferral
      was granted
    evidence_fields:
    - equipment_loans.last_deferral_date
    - equipment_loans.loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_loans.loan_id
      action_bindings:
        equipment_loans.loan_id: loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the last deferral was granted
      anchor_source: equipment_loans.last_deferral_date
      relation: not_before
      duration_source: variants.deferral_spacing_months
      unit: calendar_months
      counting_rule: >-
        counted from the last deferral date to the same day of the target month (the last day of that month when
        the day does not exist), that day itself qualifying
      boundary: inclusive
  - id: no_frozen_operating_credit
    applies_to:
    - equipment_deferral_grant
    kind: authorization
    condition: >-
      A deferral may be granted only when the member holds no operating line in suspended status (equipment_msr_suspended_operating_lines
      is 0), because frozen operating credit puts the whole relationship under loan-officer review.
    evidence_fields:
    - operating_lines.customer_id
    - operating_lines.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - operating_lines.customer_id
      action_bindings:
        operating_lines.customer_id: customer_id
  measures:
  - equipment_msr_installments_paid_count
  - equipment_msr_suspended_operating_lines
  - equipment_msr_past_due_installments
  params:
    per_tier:
      Truck & Trailer Loan:
        available: =deferral_available
        max_life: =max_deferrals_life
        spacing: =deferral_spacing_months
        min_paid: =deferral_min_installments_paid
        lead_days: =deferral_request_lead_days
        fee: =deferral_fee_usd
      EquipDirect Dealer Contract:
        available: =deferral_available
        max_life: =max_deferrals_life
        spacing: =deferral_spacing_months
        min_paid: =deferral_min_installments_paid
        lead_days: =deferral_request_lead_days
        fee: =deferral_fee_usd
      Used Equipment Loan:
        available: =deferral_available
        max_life: =max_deferrals_life
        spacing: =deferral_spacing_months
        min_paid: =deferral_min_installments_paid
        lead_days: =deferral_request_lead_days
        fee: =deferral_fee_usd
      New Equipment Loan:
        available: =deferral_available
        max_life: =max_deferrals_life
        spacing: =deferral_spacing_months
        min_paid: =deferral_min_installments_paid
        lead_days: =deferral_request_lead_days
        fee: =deferral_fee_usd
      Irrigation System Loan:
        available: =deferral_available
        max_life: =max_deferrals_life
        spacing: =deferral_spacing_months
        min_paid: =deferral_min_installments_paid
        lead_days: =deferral_request_lead_days
        fee: =deferral_fee_usd
      Grain Storage & Handling Loan:
        available: =deferral_available
        max_life: =max_deferrals_life
        spacing: =deferral_spacing_months
        min_paid: =deferral_min_installments_paid
        lead_days: =deferral_request_lead_days
        fee: =deferral_fee_usd
- id: equipment_prepayment
  subject:
  - equipment_principal_payment
  - equipment_fee_assessed
  - equipment_reamortize
  rule: >-
    Principal may be prepaid at any time. A prepayment fee applies only to a fixed-rate loan whose original_principal
    is at or above prepayment_fee_threshold_usd: principal prepaid in a loan year beyond free_prepayment_pct_per_loan_year
    of original principal (counting earlier prepayments of the same loan year, equipment_msr_loan_year_prepaid)
    carries the fee_pct of the prepayment_fee_schedule entry for the current loan year, rounded to cents, booked
    with fee_code prepayment and source_ref_id the principal payment it is charged on. Prepayments by release proceeds
    of a sale count toward the allowance and the fee; proceeds of a total-loss insurance settlement and principal
    paid as part of scheduled installments never do. A variable-rate loan, and every product with an empty schedule,
    has no prepayment fee. A prepayment shortens the schedule and leaves the installment unchanged, unless the member
    asks to re-amortize: re-amortization is offered only when reamortization_min_curtailment_usd is above zero and
    principal prepaid or paid from release proceeds since funding or the last re-amortization (equipment_msr_curtailment_since_reamortization)
    is at least that amount; the new installment amortises the principal balance over the installments remaining
    to the maturity date at the contract rate, and reamortization_fee_usd is assessed.
  eligibility: []
  measures:
  - equipment_msr_loan_year_prepaid
  - equipment_msr_curtailment_since_reamortization
  params:
    per_tier:
      Truck & Trailer Loan:
        schedule: =prepayment_fee_schedule
        threshold: =prepayment_fee_threshold_usd
        free_pct: =free_prepayment_pct_per_loan_year
        reamort_min: =reamortization_min_curtailment_usd
        reamort_fee: =reamortization_fee_usd
      EquipDirect Dealer Contract:
        schedule: =prepayment_fee_schedule
        threshold: =prepayment_fee_threshold_usd
        free_pct: =free_prepayment_pct_per_loan_year
        reamort_min: =reamortization_min_curtailment_usd
        reamort_fee: =reamortization_fee_usd
      Used Equipment Loan:
        schedule: =prepayment_fee_schedule
        threshold: =prepayment_fee_threshold_usd
        free_pct: =free_prepayment_pct_per_loan_year
        reamort_min: =reamortization_min_curtailment_usd
        reamort_fee: =reamortization_fee_usd
      New Equipment Loan:
        schedule: =prepayment_fee_schedule
        threshold: =prepayment_fee_threshold_usd
        free_pct: =free_prepayment_pct_per_loan_year
        reamort_min: =reamortization_min_curtailment_usd
        reamort_fee: =reamortization_fee_usd
      Irrigation System Loan:
        schedule: =prepayment_fee_schedule
        threshold: =prepayment_fee_threshold_usd
        free_pct: =free_prepayment_pct_per_loan_year
        reamort_min: =reamortization_min_curtailment_usd
        reamort_fee: =reamortization_fee_usd
      Grain Storage & Handling Loan:
        schedule: =prepayment_fee_schedule
        threshold: =prepayment_fee_threshold_usd
        free_pct: =free_prepayment_pct_per_loan_year
        reamort_min: =reamortization_min_curtailment_usd
        reamort_fee: =reamortization_fee_usd
  formula:
    free_remaining: >-
      max(0, round(original_principal * free_prepayment_pct_per_loan_year / 100, 2) - equipment_msr_loan_year_prepaid)
    chargeable: max(0, amount - free_remaining)
- id: equipment_collateral_release
  subject:
  - equipment_unit_released
  - equipment_principal_payment
  - equipment_fee_assessed
  rule: >-
    A unit may be released only while the loan is in active or paid_off status: on payoff every unit still pledged
    is released through the trigger, and while the loan is active a unit may be released on its sale or after its
    total loss. A release on sale is registered as a collateral_release request naming the unit's serial number
    and the net sale price, and is made only when at least one other unit remains pledged (the last unit is released
    only at payoff). Each pledged unit may be released only once. The release price is the greater of the net sale
    price and partial_release_premium_pct of the unit's share of principal, that share being principal_balance times
    the unit's pledged_value divided by the loan's collateral_value, rounded to cents; the release price is applied
    to principal as release proceeds on the release date, and after it the principal may not exceed max_ltv_after_release_pct
    of the value still pledged, any excess being paid down at the same time. A partial release fee of partial_release_fee_usd
    applies to each release on sale; a total-loss release applies the insurance proceeds the same way but carries
    no release fee and no prepayment fee. The test of equipment_agg_cross_collateral applies to every release except
    on payoff. The title lien is released, or the termination or fixture release is filed, within lien_release_business_days
    business days (Monday to Friday excluding Federal Reserve holidays) after the release.
  eligibility:
  - id: release_loan_state
    applies_to:
    - equipment_unit_released
    kind: state
    condition: A unit may be released only while the loan is in active or paid_off status
    evidence_fields:
    - equipment_loans.status
    - equipment_loans.loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_loans.loan_id
      action_bindings:
        equipment_loans.loan_id: loan_id
    state_contract:
      field: equipment_loans.status
      allowed:
      - active
      - paid_off
  - id: release_once_per_unit
    applies_to:
    - equipment_unit_released
    kind: dedup
    condition: Each pledged unit may be released only once.
    evidence_fields:
    - equipment_collateral.source_action_id
    - equipment_collateral.event_type
    - equipment_collateral.serial_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_collateral.source_action_id
      action_bindings:
        equipment_collateral.source_action_id: source_action_id
    dedup_contract:
      table: equipment_collateral
      mode: separate_record
      object_bindings:
        source_action_id: source_action_id
      duplicate_filters:
        event_type:
        - equipment_unit_released
      distinct_fields: []
  measures:
  - equipment_msr_units_pledged
  params:
    per_tier:
      Truck & Trailer Loan:
        premium: =partial_release_premium_pct
        fee: =partial_release_fee_usd
        ltv: =max_ltv_after_release_pct
        lien_days: =lien_release_business_days
      EquipDirect Dealer Contract:
        premium: =partial_release_premium_pct
        fee: =partial_release_fee_usd
        ltv: =max_ltv_after_release_pct
        lien_days: =lien_release_business_days
      Used Equipment Loan:
        premium: =partial_release_premium_pct
        fee: =partial_release_fee_usd
        ltv: =max_ltv_after_release_pct
        lien_days: =lien_release_business_days
      New Equipment Loan:
        premium: =partial_release_premium_pct
        fee: =partial_release_fee_usd
        ltv: =max_ltv_after_release_pct
        lien_days: =lien_release_business_days
      Irrigation System Loan:
        premium: =partial_release_premium_pct
        fee: =partial_release_fee_usd
        ltv: =max_ltv_after_release_pct
        lien_days: =lien_release_business_days
      Grain Storage & Handling Loan:
        premium: =partial_release_premium_pct
        fee: =partial_release_fee_usd
        ltv: =max_ltv_after_release_pct
        lien_days: =lien_release_business_days
  formula:
    unit_share: round(principal_balance * pledged_value / collateral_value, 2)
    premium_floor: round(unit_share * partial_release_premium_pct / 100, 2)
- id: equipment_collateral_substitution
  subject:
  - equipment_unit_pledged
  - equipment_unit_released
  - equipment_fee_assessed
  rule: >-
    On a product with substitution_allowed true, the member may replace one pledged unit with another unit without
    paying the loan down, typically when trading the unit in. A substitution is registered as a collateral_substitution
    request naming the serial number of the unit to be replaced and the appraised value of the replacement. A unit
    may be pledged only while the loan is in applied status (before funding) or in active status (in substitution).
    The replacement unit may be no older than substitute_max_age_years from its model year, and its value must be
    at least substitution_min_value_pct of the replaced unit's pledged_value; when it is lower, the shortfall is
    paid to principal as a prepayment before the substitution is made. The replaced unit is released with release_reason
    substitution and the replacement is pledged the same day with source_action_id pointing to that release, at
    the lower of its appraised value and its purchase price; one substitution fee of substitution_fee_usd is assessed
    per substitution and the replacement's lien filing fee is assessed under the pledge trigger. The test of equipment_agg_cross_collateral
    applies. A product with substitution_allowed false never substitutes; the member must sell under equipment_collateral_release
    or pay off.
  eligibility:
  - id: substitution_active_loan
    applies_to:
    - equipment_unit_pledged
    kind: state
    condition: >-
      A unit may be pledged only while the loan is in applied status (before funding) or in active status (in substitution).
    evidence_fields:
    - equipment_loans.status
    - equipment_loans.loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - equipment_loans.loan_id
      action_bindings:
        equipment_loans.loan_id: loan_id
    state_contract:
      field: equipment_loans.status
      allowed:
      - applied
      - active
  params:
    per_tier:
      Truck & Trailer Loan:
        allowed: =substitution_allowed
        max_age: =substitute_max_age_years
        min_value_pct: =substitution_min_value_pct
        fee: =substitution_fee_usd
      EquipDirect Dealer Contract:
        allowed: =substitution_allowed
        max_age: =substitute_max_age_years
        min_value_pct: =substitution_min_value_pct
