- id: equipment_ext_autopay_enrolment_rate
  base_policy_refs:
  - equipment_rate_setting
  - equipment_autopay_enrolment
  overwrite:
  - base_policy: equipment_rate_setting
    superseded_clause: the autopay discount autopay_rate_discount_pct applies while autopay_enrolled is true
    replaced_by: >-
      The rate reduction on an enrolment is the granted autopay discount plus the autopay relationship increment,
      limited to the product's rate discount cap less the relationship discount received at funding; that reduction
      is subtracted from the contract rate on record, and only the resulting rate is rounded to 3 decimal places
      before the rate floor is applied.
  - base_policy: equipment_autopay_enrolment
    superseded_clause: On a product with autopay_rate_discount_pct above zero the discount is added on the enrolment
      date
    replaced_by: >-
      The rate reduction on an enrolment is the granted autopay discount plus the autopay relationship increment,
      limited to the product's rate discount cap less the relationship discount received at funding; that reduction
      is subtracted from the contract rate on record, and only the resulting rate is rounded to 3 decimal places
      before the rate floor is applied.
  - base_policy: equipment_rate_setting
    superseded_clause: >-
      the relationship discount relationship_rate_discount_pct applies when the member holds an operating line in
      active status on the funding date (equipment_msr_active_operating_lines at least 1)
    replaced_by: >-
      On enrolment the contract rate on record is reduced by the product's autopay rate discount, except that the
      reduction may not exceed the product's rate discount cap less the relationship discount the loan received
      at funding; the loan received that discount when the member's operating line, the first one the operating-line
      lookup lists where there are several, was booked on or before the loan's funding date and had not been closed
      by that date, and the discount so received stays fixed at funding and counts against the cap whatever the
      line's status has become since; the reduced rate is rounded to 3 decimal places and may not be lower than
      the product's rate floor.
  trigger: on_request
  subject:
  - equipment_autopay_change
  computes: interest_rate
  target_tool: enrol_installment_autopay_aa82d556
  params:
    final_year_months: 12
    full_discount_months: 48
    mid_term_discount_pts: 0.2
    long_lookback_months: 24
    base_lookback_months: 12
    share_half: 0.5
    inc_clean: 0.04
    inc_late: 0.02
    per_entry_deduction_pts: 0.05
    flat_deduction_pts: 0.05
  rule: >-
    Automatic debit of a loan's installments is enrolled only on the member's own instruction, with the checking
    account identified by the last four digits the member gives, and the enrolment sets the contract rate in force
    from the enrolment date as follows; on a product whose autopay rate discount is zero, such as the EquipDirect
    Dealer Contract, the enrolment leaves the contract rate unchanged. The contract rate set on an enrolment is
    fixed only after the loan's fee entries carry a late charge for the most recently billed installment whenever
    the loan is in active status and that installment is still not paid in full after its late-charge grace period.
    The contract rate set on an enrolment is not fixed until the loan's fee entries carry the collateral protection
    premium owed whenever renewed proof of insurance was not received within the insurance lapse cure period. On
    enrolment the contract rate on record is reduced by the product's autopay rate discount, except that the reduction
    may not exceed the product's rate discount cap less the relationship discount the loan received at funding;
    the loan received that discount when the member's operating line, the first one the operating-line lookup lists
    where there are several, was booked on or before the loan's funding date and had not been closed by that date,
    and the discount so received stays fixed at funding and counts against the cap whatever the line's status has
    become since; the reduced rate is rounded to 3 decimal places and may not be lower than the product's rate floor.
    The autopay discount offered on an enrolment depends on the whole months remaining from the enrolment date to
    the maturity date: none when fewer than 12 remain, 0.20 point, or the product's autopay rate discount when that
    is smaller, when 12 to 47 remain, and the product's autopay rate discount when 48 or more remain. The servicing-record
    look-back for an enrolment reads the loan's fee entries dated less than a set number of whole months before
    the enrolment date: 24 months when an operating line of the member carries a late charge dated less than 24
    whole months before the enrolment date; the whole months since the loan's funding date plus one when no operating
    line of the member carries such a late charge and the loan was funded fewer than 12 whole months before the
    enrolment date; and 12 months otherwise. How the autopay discount granted on an enrolment is worked out from
    the offered discount follows the late charges and collateral protection premiums among the loan's fee entries
    within the servicing-record look-back: when there are two or more late charges and at least one collateral protection
    premium, the offered discount is reduced by 0.05 point for every late charge and every collateral protection
    premium in the look-back, never below zero; when there are two or more late charges and no collateral protection
    premium, or at most one late charge and at least one collateral protection premium, one half of the offered
    discount is granted; when there is exactly one late charge and no collateral protection premium, the offered
    discount is reduced by a flat 0.05 point, never below zero; and when there is neither, the whole offered discount
    is granted. An autopay relationship increment is added to the granted discount: 0.04 point when the member holds
    an operating line in active status that collects its interest by AutoDraft and none of the member's operating
    lines carries a late charge dated less than 12 whole months before the enrolment date; 0.02 point when the member
    holds such an AutoDraft operating line in active status and one of the member's operating lines carries a late
    charge dated less than 12 whole months before the enrolment date; and nothing otherwise. The rate reduction
    on an enrolment is the granted autopay discount plus the autopay relationship increment, limited to the product's
    rate discount cap less the relationship discount received at funding; that reduction is subtracted from the
    contract rate on record, and only the resulting rate is rounded to 3 decimal places before the rate floor is
    applied.
  prerequisite:
  - problem: equipment_ext_installment_late_charge
    kind: value_input
    gate: late_charges_in_lookback
    form: state
    policy_source: >-
      The contract rate set on an enrolment is fixed only after the loan's fee entries carry a late charge for the
      most recently billed installment whenever the loan is in active status and that installment is still not paid
      in full after its late-charge grace period.
    condition: >-
      the loan's fee entries carry a late-charge fee entry pointing at the most recently billed installment bill
      whenever the loan is in active status and that bill is still not paid in full after more than the product's
      late-charge grace period since its due date
    resolved_by: assess_installment_late_charge_7bb353d6
    effect: >-
      the late-charge fee entry booked for the overdue installment is counted among the late charges within the
      servicing-record look-back, which changes how the granted autopay discount is worked out
  - problem: equipment_ext_collateral_protection_premium
    kind: value_input
    gate: protection_premiums_in_lookback
    form: state
    policy_source: >-
      The contract rate set on an enrolment is not fixed until the loan's fee entries carry the collateral protection
      premium owed whenever renewed proof of insurance was not received within the insurance lapse cure period.
    condition: >-
      the loan's fee entries carry a collateral-protection fee entry whenever the insurance expiry date on record
      is more than the product's insurance lapse cure period in the past with no renewed proof recorded, on a product
      that places collateral protection
    resolved_by: assess_collateral_protection_premium_372633e7
    effect: >-
      the collateral-protection fee entry is counted among the collateral protection premiums within the servicing-record
      look-back, which changes how the granted autopay discount is worked out
  cross_category:
  - category: operating
    as: history
    reads:
    - opened_date
    - closed_date
    - autodraft_enrolled
    - status
    - operating_transactions.event_type
    - operating_transactions.fee_code
    - operating_transactions.effective_date
    note: >-
      the servicing-record look-back length and the autopay relationship increment are decided from the member's
      operating lines, their AutoDraft enrolment and their late charges; the relationship discount at funding from
      the listed line's booking and closing dates
  compute:
  - loan_funded: F('opened_date') != '' and F('opened_date') != None
  - line_booked_on: CFIELD('operating', 'opened_date') if EXISTS('operating') else ''
  - line_closed_on: CFIELD('operating', 'closed_date') if EXISTS('operating') else ''
  - line_before_funding: >-
      loan_funded and line_booked_on != '' and line_booked_on != None and line_booked_on <= F('opened_date') and
      (line_closed_on == '' or line_closed_on == None or line_closed_on > F('opened_date'))
  - relationship_at_funding: P('relationship_rate_discount_pct') if line_before_funding else 0
  - cap_room: MX(0, P('rate_discount_cap_pct') - relationship_at_funding)
  - maturity_on_record: F('maturity_date') if (F('maturity_date') != '' and F('maturity_date') != None) else NOW
  - months_left: MONTHS(NOW, maturity_on_record)
  - autopay_discount_offered: >-
      0 if months_left < K('final_year_months') else (MN(K('mid_term_discount_pts'), P('autopay_rate_discount_pct'))
      if months_left < K('full_discount_months') else P('autopay_rate_discount_pct'))
  - line_late_charges_24m: >-
      XCOUNT('operating', 'operating_transactions', within_months=K('long_lookback_months'), date_field='effective_date',
      event_type='operating_fee_assessed', fee_code='late_charge')
  - funding_on_record: F('opened_date') if loan_funded else NOW
  - months_since_funding: MONTHS(funding_on_record, NOW)
  - lookback_months: >-
      K('long_lookback_months') if line_late_charges_24m >= 1 else ((months_since_funding + 1) if months_since_funding
      < K('base_lookback_months') else K('base_lookback_months'))
  - late_charges_in_lookback: >-
      COUNT('equipment_transactions', within_months=lookback_months, date_field='effective_date', event_type='equipment_fee_assessed',
      fee_code='late_charge')
  - protection_premiums_in_lookback: >-
      COUNT('equipment_transactions', within_months=lookback_months, date_field='effective_date', event_type='equipment_fee_assessed',
      fee_code='collateral_protection')
  - granted_discount: >-
      MX(0, autopay_discount_offered - K('per_entry_deduction_pts') * (late_charges_in_lookback + protection_premiums_in_lookback))
      if (late_charges_in_lookback >= 2 and protection_premiums_in_lookback >= 1) else (autopay_discount_offered
      * K('share_half') if ((late_charges_in_lookback >= 2 and protection_premiums_in_lookback == 0) or (late_charges_in_lookback
      <= 1 and protection_premiums_in_lookback >= 1)) else (MX(0, autopay_discount_offered - K('flat_deduction_pts'))
      if (late_charges_in_lookback == 1 and protection_premiums_in_lookback == 0) else autopay_discount_offered))
  - line_on_autodraft: CFIELD('operating', 'autodraft_enrolled', status='active', autodraft_enrolled=True) == True
  - line_late_charges_12m: >-
      XCOUNT('operating', 'operating_transactions', within_months=K('base_lookback_months'), date_field='effective_date',
      event_type='operating_fee_assessed', fee_code='late_charge')
  - relationship_increment: >-
      K('inc_clean') if (line_on_autodraft and line_late_charges_12m == 0) else (K('inc_late') if (line_on_autodraft
      and line_late_charges_12m >= 1) else 0)
  - rate_reduction: >-
      MN(cap_room, granted_discount + relationship_increment) if (P('autopay_rate_discount_pct') > 0 and loan_funded)
      else 0
  - result: MX(P('rate_floor_pct'), RND(F('interest_rate') - rate_reduction, 3))
