        lien_days: =lien_release_business_days
- id: equipment_insurance_requirement
  subject:
  - equipment_insurance_update
  - equipment_fee_assessed
  rule: >-
    Every pledged unit must be insured against physical damage with the association named loss payee for as long
    as the loan is open. Proof is recorded as received, with the expiry date and insurer exactly as printed on the
    certificate; a member's statement that a policy was renewed is not proof. Renewed proof must be received within
    insurance_lapse_cure_days calendar days after the insurance expiry date on record, that date being day 0. When
    it is not, a product with collateral_protection_available true places collateral protection insurance and assesses
    its premium, collateral_protection_annual_pct of the principal balance on the placement date for one year, rounded
    to cents, with fee_code collateral_protection; when proof covering the placement date is later received, that
    premium is waived with waiver_basis error_correction. On every other product a lapse past the cure period is
    a default that only a loan officer can address.
  eligibility: []
  params:
    per_tier:
      Truck & Trailer Loan:
        cure_days: =insurance_lapse_cure_days
        cpi: =collateral_protection_available
        cpi_pct: =collateral_protection_annual_pct
      EquipDirect Dealer Contract:
        cure_days: =insurance_lapse_cure_days
        cpi: =collateral_protection_available
        cpi_pct: =collateral_protection_annual_pct
