- id: equipment_autopay_enrolment
  subject:
  - equipment_autopay_change
  rule: >-
    Automatic debit of installments is authorised, moved or cancelled only on the member's own instruction, with
    the checking account identified by the last four digits the member gives, recorded exactly as given. Autopay
    may be changed only while the loan is in active, deferred or nonaccrual status. Once enrolled, each installment
    is debited on its due date for the unpaid installment. On a product with autopay_rate_discount_pct above zero
    the discount is added on the enrolment date and removed on the cancellation date under equipment_rate_setting;
    moving the debit to another account leaves the rate unchanged.
