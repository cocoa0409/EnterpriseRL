- id: equipment_ext_installment_late_charge
  base_policy_refs:
  - equipment_evt_late_charge
  - equipment_evt_returned_payment
  - equipment_deferral
  - equipment_prepayment
  - equipment_collateral_release
  - equipment_collateral_substitution
  - equipment_insurance_requirement
  overwrite:
  - base_policy: equipment_evt_late_charge
    superseded_clause: >-
      A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date
      of the installment
    replaced_by: >-
      A late charge is booked as one fee entry against the installment most recently billed on the loan, and only
      while the loan is in active status, when that installment is still not paid in full after more than the product's
      late-charge grace period has passed since its due date, the due date itself being day 0; no entry is booked
      when that installment already carries a late charge.
  - base_policy: equipment_evt_late_charge
    superseded_clause: Only one late charge may be assessed per installment.
    replaced_by: >-
      A late charge is booked as one fee entry against the installment most recently billed on the loan, and only
      while the loan is in active status, when that installment is still not paid in full after more than the product's
      late-charge grace period has passed since its due date, the due date itself being day 0; no entry is booked
      when that installment already carries a late charge.
  - base_policy: equipment_evt_late_charge
    superseded_clause: >-
      at late_charge_pct of the unpaid part of the installment, no less than late_charge_min_usd and no more than
      late_charge_max_usd, rounded to cents
    replaced_by: >-
      The lowered percentage is applied to the unpaid part, that result is multiplied first by the lateness factor
      and then by the seasonal factor, and only the final product is rounded to cents before the minimum and maximum
      late charge are applied.
  - base_policy: equipment_evt_late_charge
    superseded_clause: >-
      It applies to an installment not paid in full by then (equipment_msr_installment_paid below the installment
      due)
    replaced_by: >-
      The late charge is the product's late-charge percentage of the unpaid part of that installment, the unpaid
      part being the installment due less the interest and principal payments applied to that installment bill,
      with the most recent interest payment and the most recent principal payment on that bill added back when the
      member's bank returned them, all as they stand on the day the charge is booked, and the installment due being
      the level installment on the loan record on that day or, for the final installment, its billed interest plus
      all principal then outstanding.
  trigger: state_due
  subject:
  - equipment_fee_assessed
  computes: late_charge_amount
  target_tool: assess_installment_late_charge_7bb353d6
  params:
    pct_both: 6.0
    pct_one: 5.5
    repeat_lookback_months: 24
    size_adj_large_pts: 1.0
    size_adj_mid_pts: 0.5
    size_large_usd: 5000.0
    size_mid_usd: 1500.0
    mult_23: 1.5
    mult_16: 1.25
    days_23: 23
    days_16: 16
    mult_harvest: 0.8
    mult_planting: 0.9
  rule: >-
    A late charge is booked as one fee entry against the installment most recently billed on the loan, and only
    while the loan is in active status, when that installment is still not paid in full after more than the product's
    late-charge grace period has passed since its due date, the due date itself being day 0; no entry is booked
    when that installment already carries a late charge. The late charge is the product's late-charge percentage
    of the unpaid part of that installment, the unpaid part being the installment due less the interest and principal
    payments applied to that installment bill, with the most recent interest payment and the most recent principal
    payment on that bill added back when the member's bank returned them, all as they stand on the day the charge
    is booked, and the installment due being the level installment on the loan record on that day or, for the final
    installment, its billed interest plus all principal then outstanding. The charge is figured once and rounded
    to cents, and the rounded charge may not be less than the product's minimum late charge or more than the product's
    maximum late charge. The late-charge percentage of an installment's late charge follows the member's recent
    delinquency: when the loan carries a late charge dated less than 24 whole months before the booking date and
    an operating line of the member also carries a late charge dated less than 24 whole months before the booking
    date, the percentage is 6.0; when exactly one of the two carries such a late charge, the percentage is 5.5;
    when neither does, the product's late-charge percentage applies. That late-charge percentage is then lowered
    according to the unpaid part of the installment: by 1.0 point when the unpaid part is 5,000.00 or more, by 0.5
    point when it is at least 1,500.00 but less than 5,000.00, and not at all when it is less than 1,500.00. The
    days a late installment counts as past due are counted from its due date, except that a due date falling on
    a Saturday is counted from the following Monday, two days later, and a due date falling on a Sunday is counted
    from the following Monday, one day later. The late charge is multiplied by a lateness factor set by those days
    past due on the booking date: 1.5 when they are 23 or more, 1.25 when they are 16 to 22, and 1.0 when they are
    15 or fewer. The late charge is also multiplied by a seasonal factor set by the calendar month of the installment's
    due date: 0.8 for a due date in September, October or November, when harvest receipts are not yet in, 0.9 for
    a due date in March, April or May, when planting costs fall due, and 1.0 for a due date in any other month.
    The lowered percentage is applied to the unpaid part, that result is multiplied first by the lateness factor
    and then by the seasonal factor, and only the final product is rounded to cents before the minimum and maximum
    late charge are applied.
  prerequisite: []
  cross_category:
  - category: operating
    as: history
    reads:
    - operating_transactions.event_type
    - operating_transactions.fee_code
    - operating_transactions.effective_date
    note: >-
      the late-charge percentage tier counts late charges on the member's operating lines over the last 24 months
  compute:
  - bill_due: >-
      LATEST('equipment_transactions', 'due_date', date_field='due_date', event_type='equipment_interest_accrual')
  - bill_id: >-
      LATEST('equipment_transactions', 'txn_id', date_field='due_date', event_type='equipment_interest_accrual')
  - bill_interest: >-
      LATEST('equipment_transactions', 'amount', date_field='due_date', event_type='equipment_interest_accrual')
  - installment_due: >-
      (bill_interest + F('principal_balance')) if bill_due == F('maturity_date') else F('installment_amount')
  - latest_interest_payment_id: >-
      LATEST('equipment_transactions', 'txn_id', date_field='effective_date', event_type='equipment_interest_payment',
      source_ref_id=bill_id)
  - latest_principal_payment_id: >-
      LATEST('equipment_transactions', 'txn_id', date_field='effective_date', event_type='equipment_principal_payment',
      payment_purpose='scheduled', source_ref_id=bill_id)
  - returned_on_bill: >-
      SUM('equipment_transactions', 'amount', event_type='equipment_interest_payment_return', source_ref_id=latest_interest_payment_id)
      + SUM('equipment_transactions', 'amount', event_type='equipment_principal_payment_return', source_ref_id=latest_principal_payment_id)
  - paid_on_bill: >-
      SUM('equipment_transactions', 'amount', event_type='equipment_interest_payment', source_ref_id=bill_id) +
      SUM('equipment_transactions', 'amount', event_type='equipment_principal_payment', payment_purpose='scheduled',
      source_ref_id=bill_id) - returned_on_bill
  - unpaid_part: MX(0, RND(installment_due - paid_on_bill, 2))
  - size_adjustment: >-
      K('size_adj_large_pts') if unpaid_part >= K('size_large_usd') else (K('size_adj_mid_pts') if unpaid_part >=
      K('size_mid_usd') else 0)
  - loan_late_charges_24m: >-
      COUNT('equipment_transactions', within_months=K('repeat_lookback_months'), date_field='effective_date', event_type='equipment_fee_assessed',
      fee_code='late_charge')
  - line_late_charges_24m: >-
      XCOUNT('operating', 'operating_transactions', within_months=K('repeat_lookback_months'), date_field='effective_date',
      event_type='operating_fee_assessed', fee_code='late_charge')
  - late_charge_pct: >-
      K('pct_both') if (loan_late_charges_24m >= 1 and line_late_charges_24m >= 1) else (K('pct_one') if ((loan_late_charges_24m
      >= 1 and line_late_charges_24m == 0) or (loan_late_charges_24m == 0 and line_late_charges_24m >= 1)) else
      P('late_charge_pct'))
  - bill_due_on_record: bill_due if (bill_due != '' and bill_due != None) else NOW
  - due_weekday: DAYS('2024-01-01', bill_due_on_record) % 7
  - anchor_shift_days: 2 if due_weekday == 5 else (1 if due_weekday == 6 else 0)
  - days_past_due: DAYS(bill_due_on_record, NOW) - anchor_shift_days
  - lateness_factor: >-
      K('mult_23') if days_past_due >= K('days_23') else (K('mult_16') if days_past_due >= K('days_16') else 1.0)
  - due_month_index: MONTHS('2000-01-01', bill_due_on_record) % 12
  - seasonal_factor: >-
      K('mult_harvest') if (due_month_index >= 8 and due_month_index <= 10) else (K('mult_planting') if (due_month_index
      >= 2 and due_month_index <= 4) else 1.0)
  - charge_raw: RND(unpaid_part * (late_charge_pct - size_adjustment) / 100 * lateness_factor * seasonal_factor,
      2)
  - charge_bounded: MN(P('late_charge_max_usd'), MX(P('late_charge_min_usd'), charge_raw))
  - prior_charge_on_bill: >-
      COUNT('equipment_transactions', event_type='equipment_fee_assessed', fee_code='late_charge', source_ref_id=bill_id)
  - charge_arises: >-
      F('status') == 'active' and bill_due != None and DAYS(bill_due_on_record, NOW) > P('late_charge_grace_days')
      and unpaid_part > 0 and prior_charge_on_bill == 0
  - result: charge_bounded if charge_arises else 0
