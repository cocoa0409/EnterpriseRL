        cpi: =collateral_protection_available
        cpi_pct: =collateral_protection_annual_pct
      Grain Storage & Handling Loan:
        cure_days: =insurance_lapse_cure_days
        cpi: =collateral_protection_available
        cpi_pct: =collateral_protection_annual_pct
  formula:
