- id: equipment_nonaccrual_status
  subject:
  - equipment_nonaccrual
  - equipment_accrual_restore
  rule: >-
    A loan in active status is placed in nonaccrual when an installment remains not paid in full more than nonaccrual_past_due_days
    calendar days after its due date, the due date being day 0. While in nonaccrual, payments are still applied
    under equipment_payment_application, late charges stop, and no deferral, release on sale or substitution is
    available. The loan returns to active status on the day every installment whose due date has passed is paid
    in full (equipment_msr_past_due_installments is 0). A deferred loan is not placed in nonaccrual for the deferred
    installment.
  eligibility: []
  measures:
  - equipment_msr_past_due_installments
  params:
    per_tier:
      Truck & Trailer Loan:
        days: =nonaccrual_past_due_days
      EquipDirect Dealer Contract:
        days: =nonaccrual_past_due_days
      Used Equipment Loan:
        days: =nonaccrual_past_due_days
      New Equipment Loan:
        days: =nonaccrual_past_due_days
      Irrigation System Loan:
        days: =nonaccrual_past_due_days
      Grain Storage & Handling Loan:
        days: =nonaccrual_past_due_days
- id: equipment_payoff
  subject:
  - equipment_loan_payoff
  - equipment_unit_released
  rule: >-
    A payoff quote states, for a payoff date the member names, all assessed fees not yet paid, billed interest not
    yet paid, interest from the day after the last due date through the payoff date at the contract rate, any prepayment
    fee under equipment_prepayment on the principal paid ahead of schedule, and the principal balance. A quote is
    good through payoff_quote_valid_days calendar days after the quote date, the quote date being day 0; a payment
    received later is applied as a regular payment and a new quote is needed. The loan is paid off on the effective
    date of the payment that brings principal, interest and fees to zero, every pledged unit is released with release_reason
    payoff, and the lien is released within lien_release_business_days business days. An overpayment of the payoff
    is refunded to the member and never held on the loan.
  eligibility: []
  params:
    per_tier:
      Truck & Trailer Loan:
        quote_days: =payoff_quote_valid_days
        lien_days: =lien_release_business_days
      EquipDirect Dealer Contract:
        quote_days: =payoff_quote_valid_days
        lien_days: =lien_release_business_days
