- id: equipment_ext_collateral_protection_premium
  base_policy_refs:
  - equipment_insurance_requirement
  - equipment_evt_late_charge
  - equipment_evt_returned_payment
  - equipment_deferral
  - equipment_prepayment
  - equipment_collateral_release
  - equipment_collateral_substitution
  overwrite:
  - base_policy: equipment_insurance_requirement
    superseded_clause: >-
      collateral_protection_annual_pct of the principal balance on the placement date for one year, rounded to cents
    replaced_by: >-
      The premium is the insured amount multiplied by the annual percentage with its age loading, divided by 100,
      multiplied by the days charged and divided by 365, and only that final figure is rounded to cents.
  - base_policy: equipment_insurance_requirement
    superseded_clause: >-
      When it is not, a product with collateral_protection_available true places collateral protection insurance
      and assesses its premium
    replaced_by: >-
      On a product that places collateral protection insurance, when renewed proof of physical-damage insurance
      has not been received within the product's insurance lapse cure period after the insurance expiry date on
      record, the expiry date being day 0, the association places collateral protection insurance on the loan's
      units and books its premium as one fee entry dated the placement date; no premium is booked on a product that
      does not place collateral protection, on a loan that is no longer open, being paid off, declined or not yet
      funded, or when a collateral protection premium was already booked less than 12 whole months before the placement
      date.
  trigger: state_due
  subject:
  - equipment_fee_assessed
  computes: premium_amount
  target_tool: assess_collateral_protection_premium_372633e7
  params:
    backdate_after_days: 30
    days_per_year: 365
    short_term_months: 12
    rate_three_units: 5.5
    rate_two_units: 6.0
    age_load_old: 0.5
    age_load_mid: 0.25
    age_old_years: 10
    age_mid_years: 5
    repeat_months: 12
  rule: >-
    On a product that places collateral protection insurance, when renewed proof of physical-damage insurance has
    not been received within the product's insurance lapse cure period after the insurance expiry date on record,
    the expiry date being day 0, the association places collateral protection insurance on the loan's units and
    books its premium as one fee entry dated the placement date; no premium is booked on a product that does not
    place collateral protection, on a loan that is no longer open, being paid off, declined or not yet funded, or
    when a collateral protection premium was already booked less than 12 whole months before the placement date.
    The collateral protection premium is the product's collateral protection annual percentage of the principal
    balance on the placement date for one year of coverage, figured once and rounded to cents. The coverage term
    a collateral protection premium is charged for depends on how the lapse stands on the placement date: when more
    than 30 days have passed since the insurance expiry date on record, the coverage is backdated and runs from
    the day after that expiry date through one year after the placement date, so the premium is charged for the
    days since the expiry date plus 365 days; when 30 days or fewer have passed since the expiry date and fewer
    than 12 whole months remain to the maturity date, the coverage runs only to the maturity date and the premium
    is charged for the days from the placement date to the maturity date; otherwise the premium is charged for 365
    days. The amount collateral protection insures depends on the loan's position on the placement date: when the
    principal balance is above the pledged value of the units still securing the loan, the coverage insures that
    pledged value; when the principal balance is not above it and billed interest remains unpaid on the loan, the
    coverage insures the principal balance plus that billed interest not yet paid; otherwise it insures the principal
    balance. The annual percentage for a collateral protection premium depends on how many units still secure the
    loan: 5.5 for three or more units, 6.0 for two units, and the product's collateral protection annual percentage
    for a single unit. That annual percentage carries an age loading set by the average model year of the units
    still securing the loan: 0.5 point is added when that average is more than 10 years before the calendar year
    of the placement date, 0.25 point when it is more than 5 but not more than 10 years before, and nothing otherwise.
    The premium is the insured amount multiplied by the annual percentage with its age loading, divided by 100,
    multiplied by the days charged and divided by 365, and only that final figure is rounded to cents.
  prerequisite: []
  cross_category: []
  compute:
  - expiry_on_record: >-
      F('insurance_expiry_date') if (F('insurance_expiry_date') != '' and F('insurance_expiry_date') != None) else
      NOW
  - days_since_expiry: DAYS(expiry_on_record, NOW)
  - maturity_on_record: F('maturity_date') if (F('maturity_date') != '' and F('maturity_date') != None) else NOW
  - months_to_maturity: MONTHS(NOW, maturity_on_record)
  - coverage_days: >-
      (days_since_expiry + K('days_per_year')) if days_since_expiry > K('backdate_after_days') else (DAYS(NOW, maturity_on_record)
      if months_to_maturity < K('short_term_months') else K('days_per_year'))
  - pledged_value_left: >-
      SUM('equipment_collateral', 'pledged_value', event_type='equipment_unit_pledged') - SUM('equipment_collateral',
      'pledged_value', event_type='equipment_unit_released')
  - billed_interest_unpaid: >-
      RND(SUM('equipment_transactions', 'amount', event_type='equipment_interest_accrual') + SUM('equipment_transactions',
      'amount', event_type='equipment_interest_payment_return') - SUM('equipment_transactions', 'amount', event_type='equipment_interest_payment'),
      2)
  - insured_amount: >-
      pledged_value_left if F('principal_balance') > pledged_value_left else ((F('principal_balance') + billed_interest_unpaid)
      if billed_interest_unpaid > 0 else F('principal_balance'))
  - units_left: >-
      COUNT('equipment_collateral', event_type='equipment_unit_pledged') - COUNT('equipment_collateral', event_type='equipment_unit_released')
  - protection_rate: >-
      K('rate_three_units') if units_left >= 3 else (K('rate_two_units') if units_left == 2 else P('collateral_protection_annual_pct'))
  - average_model_year: >-
      (SUM('equipment_collateral', 'model_year', event_type='equipment_unit_pledged') - SUM('equipment_collateral',
      'model_year', event_type='equipment_unit_released')) / MX(1, units_left)
  - placement_year: 2000 + MONTHS('2000-01-01', NOW) // 12
  - age_loading: >-
      K('age_load_old') if (placement_year - average_model_year) > K('age_old_years') else (K('age_load_mid') if
      (placement_year - average_model_year) > K('age_mid_years') else 0)
  - premium_figured: RND(insured_amount * (protection_rate + age_loading) / 100 * coverage_days / K('days_per_year'),
      2)
  - prior_premium_12m: >-
      COUNT('equipment_transactions', within_months=K('repeat_months'), date_field='effective_date', event_type='equipment_fee_assessed',
      fee_code='collateral_protection')
  - premium_due: >-
      P('collateral_protection_available') == True and (F('status') == 'active' or F('status') == 'deferred' or
      F('status') == 'nonaccrual') and days_since_expiry > P('insurance_lapse_cure_days') and prior_premium_12m
      == 0
  - result: premium_figured if premium_due else 0
  compute_basis:
    days_since_expiry: >-
      The coverage term a collateral protection premium is charged for depends on how the lapse stands on the placement
      date: when more than 30 days have passed since the insurance expiry date on record, the coverage is backdated
