      A late charge is booked as one fee entry against the installment most recently billed on the loan, and only
      while the loan is in active status, when that installment is still not paid in full after more than the product's
      late-charge grace period has passed since its due date, the due date itself being day 0; no entry is booked
      when that installment already carries a late charge.
  factors:
  - id: repeat_delinquency_pct
    effect: parameter
    decides: late_charge_pct
    bindings:
    - loan_late_charges_24m
    - line_late_charges_24m
    - late_charge_pct
    ladder:
    - when: >-
        the loan carries a late charge dated less than 24 whole months before the booking date AND an operating
        line of the member carries one in that period
      value: K('pct_both') = 6.0
    - when: >-
        exactly one of the loan and the member's operating lines carries a late charge dated less than 24 whole
        months before the booking date (the loan and not the line, OR the line and not the loan)
      value: K('pct_one') = 5.5
    - when: otherwise (neither carries such a late charge)
      value: P('late_charge_pct')
    baseline:
      late_charge_pct: P('late_charge_pct')
    evidence:
    - history
    - cross_category
    cross_difficulty: operating
  - id: unpaid_size_reduction
    effect: parameter
    decides: size_adjustment
    bindings:
    - latest_interest_payment_id
    - latest_principal_payment_id
    - returned_on_bill
    - paid_on_bill
    - unpaid_part
    - size_adjustment
    ladder:
    - when: the unpaid part of the installment is 5,000.00 or more
      value: K('size_adj_large_pts') = 1.0 point off
    - when: the unpaid part is at least 1,500.00 but less than 5,000.00
      value: K('size_adj_mid_pts') = 0.5 point off
    - when: otherwise (less than 1,500.00)
      value: '0'
    baseline:
      size_adjustment: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: weekend_due_anchor
    effect: method
    decides: anchor_shift_days
    bindings:
    - due_weekday
    - anchor_shift_days
    ladder:
    - when: the installment's due date falls on a Saturday
      method: days past due are counted from the following Monday, two days after the due date
    - when: the due date falls on a Sunday
      method: days past due are counted from the following Monday, one day after the due date
    - when: otherwise
      method: days past due are counted from the due date itself
    baseline:
      anchor_shift_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lateness_factor
    effect: parameter
    decides: lateness_factor
    bindings:
    - days_past_due
    - lateness_factor
    ladder:
    - when: 23 or more days past due on the booking date
      value: the charge is multiplied by 1.5
    - when: 16 to 22 days past due on the booking date
      value: the charge is multiplied by 1.25
    - when: otherwise (15 or fewer)
      value: the charge is taken as figured (multiplied by 1.0)
    baseline:
      lateness_factor: '1.0'
    evidence:
    - date
    cross_difficulty: null
  - id: seasonal_factor
    effect: parameter
    decides: seasonal_factor
    bindings:
    - due_month_index
    - seasonal_factor
    ladder:
    - when: the due date falls in September, October or November
      value: the charge is multiplied by 0.8
    - when: the due date falls in March, April or May
      value: the charge is multiplied by 0.9
    - when: otherwise
      value: the charge is taken as figured (multiplied by 1.0)
    baseline:
      seasonal_factor: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The late charge is the product's late-charge percentage of the unpaid part of that installment, the unpaid
      part being the installment due less the interest and principal payments applied to that installment bill,
      with the most recent interest payment and the most recent principal payment on that bill added back when the
      member's bank returned them, all as they stand on the day the charge is booked, and the installment due being
      the level installment on the loan record on that day or, for the final installment, its billed interest plus
      all principal then outstanding. The charge is figured once and rounded to cents, and the rounded charge may
      not be less than the product's minimum late charge or more than the product's maximum late charge.
    params:
    - late_charge_pct
    - late_charge_min_usd
    - late_charge_max_usd
    - late_charge_grace_days
