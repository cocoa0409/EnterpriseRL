        quote_days: =payoff_quote_valid_days
        lien_days: =lien_release_business_days
      New Equipment Loan:
        quote_days: =payoff_quote_valid_days
        lien_days: =lien_release_business_days
      Irrigation System Loan:
        quote_days: =payoff_quote_valid_days
        lien_days: =lien_release_business_days
      Grain Storage & Handling Loan:
