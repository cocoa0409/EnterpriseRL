# ---- data flow (every write is an event) ----
events:
  - type: farmland_loan_open
    target: farmland_loans
    mutation: create
    meaning: An application for a farm real estate loan (purchase or refinance) is registered.
    grain: One row per application.
    fields:
      loan_id: Reference of the new loan.
      customer_id: Applying member.
      variant_name: Official name of the product applied for.
      original_principal: Amount requested, USD.
      payment_frequency: Installment frequency requested.
      applied_date: Date received.
    triggers: []
  - type: farmland_loan_fund
    target: farmland_loans
    mutation: {transition: {from: applied, to: active}}
    meaning: The loan closes; the mortgage is recorded and funds are disbursed.
    grain: One per loan.
    fields:
      opened_date: Closing date.
      interest_rate: Contract rate set under farmland_rate_setting.
      initial_rate: Same as interest_rate at closing.
      rate_fixed_until: Closing date plus rate_fixed_period_months, minus one day; empty for the variable product.
      next_reset_date: Day after rate_fixed_until for adjustable products; empty otherwise.
      installment_amount: Level installment amortising original principal over the amortization at the contract rate.
      next_due_date: First installment due date.
      maturity_date: Final installment due date.
      tax_verified_year: Latest tax year shown paid at closing.
      autopay_enrolled: Whether automatic debit was authorised at closing.
      autopay_account_last4: Last four digits of the debited account, else empty.
    triggers:
      - event: farmland:farmland_fee_assessed
        map: {fee_code: origination, effective_date: opened_date, channel: system}
  - type: farmland_loan_decline
    target: farmland_loans
    mutation: {transition: {from: applied, to: declined}}
    meaning: The credit decision is a decline.
    grain: One per declined application.
    fields:
      closed_date: Decision date.
    triggers: []
  - type: farmland_nonaccrual
    target: farmland_loans
    mutation: {transition: {from: active, to: nonaccrual}}
    meaning: The loan is placed in nonaccrual.
    grain: One per placement.
    fields:
      nonaccrual_date: Date placed in nonaccrual.
    triggers: []
  - type: farmland_accrual_restore
    target: farmland_loans
    mutation: {transition: {from: nonaccrual, to: active}}
    meaning: The loan returns to accrual.
    grain: One per restoration.
    fields:
      nonaccrual_date: Cleared to empty.
    triggers: []
  - type: farmland_loan_payoff
    target: farmland_loans
    mutation: {transition: [{from: active, to: paid_off}, {from: nonaccrual, to: paid_off}]}
    meaning: The final installment or a payoff brings everything owed to zero.
    grain: One per loan.
    fields:
      closed_date: Effective date of the final payment.
      next_due_date: Cleared to empty.
      next_reset_date: Cleared to empty.
    triggers:
      - event: farmland:farmland_parcel_released
        map: {release_reason: payoff, action_date: closed_date}
  - type: farmland_installment_roll
    target: farmland_loans
    mutation: update
    meaning: An installment is billed and next_due_date moves to the following installment.
    grain: One per installment billed.
    fields:
      next_due_date: Due date of the following installment, or empty after the final one.
    triggers:
      - event: farmland:farmland_interest_accrual
        map: {channel: system}
  - type: farmland_rate_adjustment
    target: farmland_loans
    mutation: update
    meaning: A scheduled adjustment of an adjustable product, or a base-rate move on the variable product, changes the contract rate.
    grain: One per loan per adjustment or base-rate change.
    fields:
      interest_rate: New contract rate.
      rate_fixed_until: End of the new fixed period for an adjustable product.
      next_reset_date: Date of the following scheduled adjustment.
      installment_amount: Re-amortised installment at a scheduled adjustment; unchanged on a base-rate move.
    triggers: []
  - type: farmland_rate_conversion
    target: farmland_loans
    mutation: update
    meaning: At the member's request the loan is converted to another farm real estate product without refinancing.
    grain: One per conversion.
    fields:
      variant_name: Product converted into.
      interest_rate: Contract rate of the new product under farmland_rate_setting.
      initial_rate: Same as the new interest_rate.
      rate_fixed_until: Conversion date plus the new product's rate_fixed_period_months, minus one day; empty for the variable product.
      next_reset_date: Day after rate_fixed_until for an adjustable product; empty otherwise.
      installment_amount: Installment re-amortising the principal balance over the remaining amortization at the new rate.
      last_conversion_date: Conversion effective date.
    triggers:
      - event: farmland:farmland_fee_assessed
        map: {fee_code: conversion, effective_date: last_conversion_date, channel: system}
  - type: farmland_autopay_change
    target: farmland_loans
    mutation: update
    meaning: Automatic debit of installments is authorised, moved or cancelled.
    grain: One per change.
    fields:
      autopay_enrolled: New flag.
      autopay_account_last4: Last four digits of the debited account, empty when cancelled.
      interest_rate: Contract rate after the autopay discount is added or removed.
    triggers: []
  - type: farmland_tax_verification
    target: farmland_loans
    mutation: update
    meaning: The association verifies with the county treasurer that a tax year is paid on every mortgaged parcel.
    grain: One per loan per tax year verified.
    fields:
      tax_verified_year: Tax year verified paid.
      tax_delinquent_since: County delinquency date of the earliest unpaid tax installment reported, or empty when none is unpaid.
    triggers: []
  - type: farmland_loan_assumption
    target: farmland_loans
    mutation: update
    meaning: A buyer of the mortgaged land, approved by credit, assumes the loan and becomes the borrowing member.
    grain: One per assumption.
    fields:
      customer_id: The assuming member.
      autopay_enrolled: Reset to false; the assuming member enrols separately.
      autopay_account_last4: Cleared to empty.
    triggers:
      - event: farmland:farmland_fee_assessed
        map: {fee_code: assumption, channel: system}
  - type: farmland_interest_accrual
    target: farmland_transactions
    meaning: Interest for one installment period (or the part at one rate) is booked and billed.
    grain: One row per installment period per rate segment.
    distinguish_by: [period_start, period_end, rate_basis]
    fields:
      amount: Interest, USD.
      period_start: First day covered.
      period_end: Last day covered.
      due_date: Installment due date.
      rate_applied: Annual rate used.
      rate_basis: contract_rate or default_rate.
      channel: Always system.
    account: interest_accrued
    direction: in
    triggers: []
  - type: farmland_interest_payment
    target: farmland_transactions
    meaning: A remittance (or its interest share) is applied to the interest of one installment.
    grain: One row per installment per remittance.
    distinguish_by: [source_ref_id, effective_date, amount, channel]
    fields:
      amount: Interest paid, USD.
      effective_date: Date received.
      channel: Channel.
      source_ref_id: The installment bill paid.
    account: interest_accrued
    direction: out
    triggers: []
  - type: farmland_principal_payment
    target: farmland_transactions
    meaning: A remittance (or its principal share) is applied to principal.
    grain: One row per principal application.
    distinguish_by: [payment_purpose, source_ref_id, effective_date, amount, channel]
    fields:
      amount: Principal paid, USD.
      effective_date: Date received.
      channel: Channel.
      payment_purpose: scheduled, prepayment, release_proceeds or payoff.
      source_ref_id: The installment bill for a scheduled payment, the release record for release proceeds, else empty.
    account: principal
    direction: out
    triggers: []
  - type: farmland_protective_advance
    target: farmland_transactions
    meaning: The association pays delinquent property taxes on a mortgaged parcel and adds the amount to principal.
    grain: One row per tax year advanced.
    distinguish_by: [tax_year, effective_date]
    fields:
      amount: Tax paid to the county, USD.
      effective_date: Date paid.
      tax_year: Tax year paid.
      channel: Always system.
    account: principal
    direction: in
    triggers:
      - event: farmland:farmland_fee_assessed
        map: {fee_code: protective_advance, source_ref_id: txn_id, effective_date: effective_date, channel: system}
  - type: farmland_fee_assessed
    target: farmland_transactions
    meaning: A fee or charge is assessed.
    grain: One row per fee occurrence.
    distinguish_by: [fee_code, effective_date, source_ref_id]
    fields:
      fee_code: Which fee.
      amount: Fee, USD.
      effective_date: Date assessed.
      source_ref_id: Record the fee arises from, else empty.
      channel: Always system.
    account: fees
    direction: in
    triggers: []
  - type: farmland_fee_payment
    target: farmland_transactions
    meaning: A remittance (or its fee share) is applied to one assessed fee.
    grain: One row per assessment per remittance.
    distinguish_by: [source_ref_id, effective_date, amount, channel]
    fields:
      fee_code: Code of the fee paid.
      amount: Amount applied, USD.
      effective_date: Date received.
      channel: Channel.
      source_ref_id: The fee assessment paid.
    account: fees
    direction: out
    triggers: []
  - type: farmland_fee_waiver
    target: farmland_transactions
    meaning: An assessed fee is waived in whole.
    grain: One row per waived assessment.
    distinguish_by: [source_ref_id, waiver_basis]
    fields:
      fee_code: Code of the fee waived.
      amount: Unpaid amount waived, USD.
      effective_date: Date of the waiver.
      source_ref_id: The fee assessment waived.
      waiver_basis: courtesy or error_correction.
    account: fees
    direction: out
    triggers: []
  - type: farmland_principal_payment_return
    target: farmland_transactions
    meaning: A principal payment is returned unpaid and reversed.
    grain: One row per returned principal payment.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount of the original payment, USD.
      effective_date: Effective date of the original payment.
      source_ref_id: The principal payment reversed.
      return_reason: Bank return reason.
    account: principal
    direction: in
    triggers:
      - event: farmland:farmland_fee_assessed
        when: {return_reason: {not: unauthorized}}
        map: {fee_code: returned_payment, source_ref_id: txn_id, channel: system}
  - type: farmland_interest_payment_return
    target: farmland_transactions
    meaning: An interest payment is returned unpaid and reversed.
    grain: One row per returned interest payment.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount of the original payment, USD.
      effective_date: Effective date of the original payment.
      source_ref_id: The interest payment reversed.
      return_reason: Bank return reason.
    account: interest_accrued
    direction: in
    triggers: []
  - type: farmland_parcel_mortgaged
    target: farmland_parcels
    meaning: A parcel is made subject to the loan's recorded mortgage.
    grain: One row per parcel mortgaged.
    distinguish_by: [parcel_number, action_date]
    fields:
      parcel_number: County parcel number.
      legal_description: Legal description.
      county: County and state.
      acres: Deeded acres.
      land_use: Predominant use.
      appraised_value: Appraised value, USD.
      action_date: Recording date.
    account: collateral_mortgaged
    direction: in
    triggers: []
  - type: farmland_parcel_released
    target: farmland_parcels
    meaning: One mortgaged parcel is released from the mortgage.
    grain: One row per parcel released.
    distinguish_by: [source_action_id]
    fields:
      parcel_number: Copied from the mortgage record.
      legal_description: Copied from the mortgage record.
      county: Copied from the mortgage record.
      acres: Copied from the mortgage record.
      land_use: Copied from the mortgage record.
      appraised_value: Value of the parcel released, USD.
      action_date: Release date.
      source_action_id: The mortgage record of the parcel released.
      release_reason: payoff, sale, condemnation or farmstead_split.
    account: collateral_mortgaged
    direction: out
    triggers:
      - event: farmland:farmland_principal_payment
        when: {release_reason: [sale, condemnation, farmstead_split]}
        map: {payment_purpose: release_proceeds, source_ref_id: parcel_action_id, effective_date: action_date}
      - event: farmland:farmland_fee_assessed
        when: {release_reason: [sale, farmstead_split]}
        map: {fee_code: partial_release, source_ref_id: parcel_action_id, effective_date: action_date, channel: system}

# ---- derived measures ----
measures:
  - id: farmland_msr_installment_paid
    window: All rows on the loan.
    measure: For one installment bill, the sum of farmland_interest_payment rows and farmland_principal_payment rows with payment_purpose scheduled whose source_ref_id is that bill, minus returns of those payments.
  - id: farmland_msr_past_due_installments
    window: Installment bills on the loan whose due_date is earlier than the date considered.
    measure: Count of those bills with farmland_msr_installment_paid below the installment due.
  - id: farmland_msr_oldest_past_due_days
    window: The date considered.
    measure: Calendar days from the due date of the oldest installment bill not paid in full to the date considered (0 when none is past due).
  - id: farmland_msr_principal_day_sum
    window: The days of the period being billed, period_start through period_end inclusive.
    measure: Sum over each calendar day of the end-of-day principal balance.
  - id: farmland_msr_courtesy_waivers_12m
    window: Rolling 12 months ending on the date considered, from the same calendar date one year earlier (exclusive) through that date (inclusive).
    measure: Count of farmland_fee_waiver rows on the loan with waiver_basis courtesy in the window.
  - id: farmland_msr_loan_year_prepaid
    window: The current loan year — the 12-month period beginning on the closing or last conversion date or an anniversary of it — through the date considered.
    measure: Sum of farmland_principal_payment rows with payment_purpose prepayment in the window, net of returns.
  - id: farmland_msr_loan_year_start_balance
    window: The first day of the current loan year.
    measure: Principal balance at the start of that day.
  - id: farmland_msr_member_combined_ltv
    window: The member's farm real estate loans in active or nonaccrual status at the date considered.
    measure: Sum of their principal_balance divided by the sum of their collateral_value, as a percentage rounded to 2 decimals, with the transaction being considered applied.
  - id: farmland_msr_active_startright
    window: The member's portfolio on the rate effective date.
    measure: Count of the member's operating_lines rows with variant_name StartRight Operating Line in active status.
  - id: farmland_msr_parcels_mortgaged
    window: All parcel records on the loan.
    measure: Count of farmland_parcel_mortgaged rows minus count of farmland_parcel_released rows.

# ---- policies ----
policies:
  - id: farmland_agg_multi_holding
    subject: [farmland_loan_open]
    rule: >-
      A member may hold any number of farm real estate loans (max_per_customer null); each purchase or refinance of a
      distinct set of parcels is its own loan with its own mortgage, rate product and schedule. How loans held together
      are tested is set by farmland_agg_combined_ltv.
    eligibility: []
    params:
      max_per_customer: null

  - id: farmland_agg_combined_ltv
    subject: [farmland_loan_open, farmland_parcel_released, farmland_loan_fund]
    rule: >-
      Because the association's farm real estate mortgages carry a cross-default and future-advance clause, a member's
      farm real estate loans are also tested together. When a new loan is closed or a parcel is released on sale,
      condemnation or farmstead split, the combined principal of all the member's farm real estate loans in active or
      nonaccrual status divided by the combined value of all parcels still mortgaged to them, with the transaction applied
      (farmland_msr_member_combined_ltv), may not exceed the lowest max_ltv_after_release_pct among the products of those
      loans. When the combined test fails, the release or closing proceeds only after the member pays principal down on
      the loan concerned until the test is met. A release on payoff is never tested.
    eligibility: []
    measures: [farmland_msr_member_combined_ltv]
    formula:
      combined_test_met: farmland_msr_member_combined_ltv <= max_ltv_after_release_pct

  - id: farmland_application_closing
    subject: [farmland_loan_open, farmland_loan_fund, farmland_loan_decline, farmland_parcel_mortgaged]
    rule: >-
      An application is registered with the product's official name, the amount and the installment frequency, and a
      credit officer decides it; the servicing desk never approves or declines. The amount must lie between min_loan_usd
      and max_loan_usd and may not exceed the value-weighted average of max_ltv_by_land_use over the parcels to be
      mortgaged, applied to their appraised value; an amount above appraisal_required_over_usd needs a full appraisal, and
      any other amount an evaluation. A parcel that secures a Country Home loan in active status cannot also be mortgaged
      to a farm real estate loan. The amortization may not exceed max_amortization_years and the frequency must be one of
      payment_frequencies_allowed. A rate quoted at application is held for rate_lock_days calendar days from the lock
      date; a loan closing later takes the rate of the current sheet. The loan closes only when the member holds the stock
      required under equity_stock_requirement, hazard insurance names the association mortgagee where insurable buildings
      exceed improvements_insurance_threshold_usd, and flood insurance is in force on buildings in a special flood hazard
      area. On closing an origination fee of origination_fee_pct of the original principal, bounded by
      origination_fee_min_usd and origination_fee_max_usd, is assessed.
    eligibility:
      - id: parcel_not_home_collateral
        applies_to: [farmland_parcel_mortgaged]
        kind: authorization
        condition: "A parcel that secures a Country Home loan in active status cannot also be mortgaged to a farm real estate loan."
        evidence_fields: [homeloan_loans.property_parcel_number, homeloan_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[homeloan_loans.property_parcel_number]]
          action_bindings: {homeloan_loans.property_parcel_number: parcel_number}
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {min: "=min_loan_usd", max: "=max_loan_usd", ltv: "=max_ltv_by_land_use", amortization: "=max_amortization_years", lock_days: "=rate_lock_days", appraisal_over: "=appraisal_required_over_usd", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", fee_max: "=origination_fee_max_usd", buildings: "=improvements_insurance_threshold_usd"}
        FarmLand 3-Year Adjustable Mortgage: {min: "=min_loan_usd", max: "=max_loan_usd", ltv: "=max_ltv_by_land_use", amortization: "=max_amortization_years", lock_days: "=rate_lock_days", appraisal_over: "=appraisal_required_over_usd", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", fee_max: "=origination_fee_max_usd", buildings: "=improvements_insurance_threshold_usd"}
        FarmLand 5-Year Adjustable Mortgage: {min: "=min_loan_usd", max: "=max_loan_usd", ltv: "=max_ltv_by_land_use", amortization: "=max_amortization_years", lock_days: "=rate_lock_days", appraisal_over: "=appraisal_required_over_usd", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", fee_max: "=origination_fee_max_usd", buildings: "=improvements_insurance_threshold_usd"}
        FarmLand 10-Year Adjustable Mortgage: {min: "=min_loan_usd", max: "=max_loan_usd", ltv: "=max_ltv_by_land_use", amortization: "=max_amortization_years", lock_days: "=rate_lock_days", appraisal_over: "=appraisal_required_over_usd", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", fee_max: "=origination_fee_max_usd", buildings: "=improvements_insurance_threshold_usd"}
        FarmLand 15-Year Fixed Mortgage: {min: "=min_loan_usd", max: "=max_loan_usd", ltv: "=max_ltv_by_land_use", amortization: "=max_amortization_years", lock_days: "=rate_lock_days", appraisal_over: "=appraisal_required_over_usd", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", fee_max: "=origination_fee_max_usd", buildings: "=improvements_insurance_threshold_usd"}
        FarmLand 25-Year Fixed Mortgage: {min: "=min_loan_usd", max: "=max_loan_usd", ltv: "=max_ltv_by_land_use", amortization: "=max_amortization_years", lock_days: "=rate_lock_days", appraisal_over: "=appraisal_required_over_usd", fee_pct: "=origination_fee_pct", fee_min: "=origination_fee_min_usd", fee_max: "=origination_fee_max_usd", buildings: "=improvements_insurance_threshold_usd"}
    formula:
      origination_fee: min(origination_fee_max_usd, max(origination_fee_min_usd, round(original_principal * origination_fee_pct / 100, 2)))

  - id: farmland_rate_setting
    subject: [farmland_loan_fund, farmland_rate_conversion, farmland_autopay_change]
    rule: >-
      At closing and at a rate conversion, the starting rate of an adjustable or fixed product is its initial_rate_pct;
      the starting rate of the variable product is the Association Variable Base Rate in effect that day, as registered
      in operating_rate_setting, plus variable_rate_spread_pct. From it are taken the autopay discount
      autopay_rate_discount_pct while autopay_enrolled is true, and the young-farmer land discount
      ybs_land_rate_discount_pct when the member holds a StartRight Operating Line in active status on that day
      (farmland_msr_active_startright at least 1); the two are added, capped at rate_discount_cap_pct, and the result is
      rounded to 3 decimal places and may not be lower than rate_floor_pct. The young-farmer discount, once given, stays
      for the fixed period even if the StartRight line later closes, and is re-tested only at a conversion. Enrolling in
      or cancelling autopay adds or removes the autopay discount from that day without restarting any fixed period.
    eligibility: []
    measures: [farmland_msr_active_startright]
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {initial: "=initial_rate_pct", spread: "=variable_rate_spread_pct", autopay: "=autopay_rate_discount_pct", ybs: "=ybs_land_rate_discount_pct", cap: "=rate_discount_cap_pct", floor: "=rate_floor_pct"}
        FarmLand 3-Year Adjustable Mortgage: {initial: "=initial_rate_pct", spread: "=variable_rate_spread_pct", autopay: "=autopay_rate_discount_pct", ybs: "=ybs_land_rate_discount_pct", cap: "=rate_discount_cap_pct", floor: "=rate_floor_pct"}
        FarmLand 5-Year Adjustable Mortgage: {initial: "=initial_rate_pct", spread: "=variable_rate_spread_pct", autopay: "=autopay_rate_discount_pct", ybs: "=ybs_land_rate_discount_pct", cap: "=rate_discount_cap_pct", floor: "=rate_floor_pct"}
        FarmLand 10-Year Adjustable Mortgage: {initial: "=initial_rate_pct", spread: "=variable_rate_spread_pct", autopay: "=autopay_rate_discount_pct", ybs: "=ybs_land_rate_discount_pct", cap: "=rate_discount_cap_pct", floor: "=rate_floor_pct"}
        FarmLand 15-Year Fixed Mortgage: {initial: "=initial_rate_pct", spread: "=variable_rate_spread_pct", autopay: "=autopay_rate_discount_pct", ybs: "=ybs_land_rate_discount_pct", cap: "=rate_discount_cap_pct", floor: "=rate_floor_pct"}
        FarmLand 25-Year Fixed Mortgage: {initial: "=initial_rate_pct", spread: "=variable_rate_spread_pct", autopay: "=autopay_rate_discount_pct", ybs: "=ybs_land_rate_discount_pct", cap: "=rate_discount_cap_pct", floor: "=rate_floor_pct"}
    formula:
      when_not: rate_fixed_period_months == 0
      autopay_part: autopay_rate_discount_pct if autopay_enrolled else 0
      ybs_part: ybs_land_rate_discount_pct if farmland_msr_active_startright >= 1 else 0
      discount_total: min(rate_discount_cap_pct, autopay_part + ybs_part)
      interest_rate: max(rate_floor_pct, round(initial_rate_pct - discount_total, 3))

  - id: farmland_rate_adjustment_rule
    subject: [farmland_rate_adjustment]
    rule: >-
      The variable product's rate moves on each Association Variable Base Rate history date to the new base rate plus
      variable_rate_spread_pct less the discounts in force, never below rate_floor_pct, and its installment is unchanged
      (the final installment absorbs the difference). An adjustable product adjusts on its next_reset_date: the new rate
      is the Association Variable Base Rate in effect that day plus reset_margin_pct less the discounts in force, but it
      may move by no more than periodic_adjustment_cap_pct up or down from the rate in force before the adjustment, may not
      exceed initial_rate plus lifetime_cap_over_initial_pct and may not be lower than rate_floor_pct; it is rounded to 3
      decimal places, a new fixed period of rate_fixed_period_months begins, and the installment is re-amortised over the
      remaining amortization at the new rate. A fully fixed product never adjusts.
    eligibility: []
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {margin: "=reset_margin_pct", periodic_cap: "=periodic_adjustment_cap_pct", lifetime_cap: "=lifetime_cap_over_initial_pct", floor: "=rate_floor_pct", fixed_months: "=rate_fixed_period_months"}
        FarmLand 3-Year Adjustable Mortgage: {margin: "=reset_margin_pct", periodic_cap: "=periodic_adjustment_cap_pct", lifetime_cap: "=lifetime_cap_over_initial_pct", floor: "=rate_floor_pct", fixed_months: "=rate_fixed_period_months"}
        FarmLand 5-Year Adjustable Mortgage: {margin: "=reset_margin_pct", periodic_cap: "=periodic_adjustment_cap_pct", lifetime_cap: "=lifetime_cap_over_initial_pct", floor: "=rate_floor_pct", fixed_months: "=rate_fixed_period_months"}
        FarmLand 10-Year Adjustable Mortgage: {margin: "=reset_margin_pct", periodic_cap: "=periodic_adjustment_cap_pct", lifetime_cap: "=lifetime_cap_over_initial_pct", floor: "=rate_floor_pct", fixed_months: "=rate_fixed_period_months"}
        FarmLand 15-Year Fixed Mortgage: {margin: "=reset_margin_pct", periodic_cap: "=periodic_adjustment_cap_pct", lifetime_cap: "=lifetime_cap_over_initial_pct", floor: "=rate_floor_pct", fixed_months: "=rate_fixed_period_months"}
        FarmLand 25-Year Fixed Mortgage: {margin: "=reset_margin_pct", periodic_cap: "=periodic_adjustment_cap_pct", lifetime_cap: "=lifetime_cap_over_initial_pct", floor: "=rate_floor_pct", fixed_months: "=rate_fixed_period_months"}

  - id: farmland_installment_billing
    subject: [farmland_installment_roll, farmland_interest_accrual]
    rule: >-
      Interest accrues daily on the principal balance using day_count_basis actual_365. On each due date the interest for
      the installment period — the day after the previous due date (the closing date for the first installment) through
      the due date — is booked and billed with that installment, rounded once to cents, and next_due_date moves by one
      installment period (one, six or twelve calendar months by payment_frequency, falling back to the last day of a
      shorter month). When the rate changes inside a period, the period is booked as two accrual rows split at the change
      date. While an installment is past due more than default_interest_trigger_days calendar days, principal accrues at
      the contract rate plus default_interest_addon_pct, booked with rate_basis default_rate, from the day after that
      threshold until the day every past-due installment is paid. The installment due is installment_amount, of which the
      billed interest is the interest share; the final installment is billed interest plus all principal outstanding.
    eligibility: []
    measures: [farmland_msr_principal_day_sum, farmland_msr_oldest_past_due_days]
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {addon: "=default_interest_addon_pct", trigger_days: "=default_interest_trigger_days", frequencies: "=payment_frequencies_allowed"}
        FarmLand 3-Year Adjustable Mortgage: {addon: "=default_interest_addon_pct", trigger_days: "=default_interest_trigger_days", frequencies: "=payment_frequencies_allowed"}
        FarmLand 5-Year Adjustable Mortgage: {addon: "=default_interest_addon_pct", trigger_days: "=default_interest_trigger_days", frequencies: "=payment_frequencies_allowed"}
        FarmLand 10-Year Adjustable Mortgage: {addon: "=default_interest_addon_pct", trigger_days: "=default_interest_trigger_days", frequencies: "=payment_frequencies_allowed"}
        FarmLand 15-Year Fixed Mortgage: {addon: "=default_interest_addon_pct", trigger_days: "=default_interest_trigger_days", frequencies: "=payment_frequencies_allowed"}
        FarmLand 25-Year Fixed Mortgage: {addon: "=default_interest_addon_pct", trigger_days: "=default_interest_trigger_days", frequencies: "=payment_frequencies_allowed"}
    formula:
      amount: round(farmland_msr_principal_day_sum * rate_applied / 100 / 365, 2)

  - id: farmland_payment_application
    subject: [farmland_interest_payment, farmland_principal_payment, farmland_fee_payment]
    rule: >-
      A payment may be applied only while the loan is in active or nonaccrual status. An installment payment pays the
      oldest unpaid installment first, its billed interest and then its principal share (payment_purpose scheduled), both
      pointing to the installment bill; fees are paid only when designated or after every billed installment is paid. A
      remittance designated as a prepayment goes to principal as a prepayment only when no installment is past due. A
      payoff pays fees, billed interest, interest from the day after the last due date through the payoff date (booked as
      a final accrual with that date as period_end and due_date), any prepayment fee and all principal, with
      payment_purpose payoff.
    eligibility:
      - id: farmland_accepts_payments
        applies_to: [farmland_interest_payment, farmland_principal_payment, farmland_fee_payment]
        kind: state
        condition: "A payment may be applied only while the loan is in active or nonaccrual status."
        evidence_fields: [farmland_loans.status, farmland_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_loans.loan_id]]
          action_bindings: {farmland_loans.loan_id: loan_id}
        state_contract:
          field: farmland_loans.status
          allowed: [active, nonaccrual]
    measures: [farmland_msr_installment_paid]

  - id: farmland_evt_late_charge
    subject: [farmland_fee_assessed, farmland_fee_waiver]
    rule: >-
      A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date of
      the installment, counted with the due date itself as day 0, so the charge first arises on the day after the last
      grace day. It is charged on an installment not paid in full by then, at late_charge_pct of the unpaid part of the
      installment, no less than late_charge_min_usd and no more than late_charge_max_usd, rounded to cents, with
      source_ref_id the installment bill. Only one late charge may be assessed per installment. No late charge is charged
      while the loan is in nonaccrual status, on fees, or on a protective advance. A late charge is waived with
      waiver_basis error_correction when a payment effective on or before the last grace day paid the installment in
      full; on the member's request it may be waived with waiver_basis courtesy only when the installment has since been
      paid in full and farmland_msr_courtesy_waivers_12m is below courtesy_waivers_per_12_months. Default interest under
      farmland_installment_billing is never waived by a courtesy waiver.
    eligibility:
      - id: farmland_late_after_grace
        applies_to: [farmland_fee_assessed]
        kind: time
        condition: "A late charge arises only after more than late_charge_grace_days calendar days have passed since the due date of the installment"
        evidence_fields: [farmland_transactions.due_date, farmland_transactions.txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_transactions.txn_id]]
          action_bindings: {farmland_transactions.txn_id: source_ref_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the due date of the installment"
          anchor_source: farmland_transactions.due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: "counted with the due date itself as day 0, so the charge first arises on the day after the last grace day"
          boundary: exclusive
      - id: farmland_one_late_charge
        applies_to: [farmland_fee_assessed]
        kind: dedup
        condition: "Only one late charge may be assessed per installment."
        evidence_fields: [farmland_transactions.source_ref_id, farmland_transactions.fee_code, farmland_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_transactions.source_ref_id]]
          action_bindings: {farmland_transactions.source_ref_id: source_ref_id}
        dedup_contract:
          table: farmland_transactions
          mode: separate_record
          object_bindings: {source_ref_id: source_ref_id}
          duplicate_filters: {event_type: [farmland_fee_assessed], fee_code: [late_charge]}
          distinct_fields: []
    measures: [farmland_msr_installment_paid, farmland_msr_courtesy_waivers_12m]
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        FarmLand 3-Year Adjustable Mortgage: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        FarmLand 5-Year Adjustable Mortgage: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        FarmLand 10-Year Adjustable Mortgage: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        FarmLand 15-Year Fixed Mortgage: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        FarmLand 25-Year Fixed Mortgage: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
    formula:
      late_charge: min(late_charge_max_usd, max(late_charge_min_usd, round((installment_amount - farmland_msr_installment_paid) * late_charge_pct / 100, 2)))

  - id: farmland_evt_returned_payment
    subject: [farmland_principal_payment_return, farmland_interest_payment_return, farmland_fee_assessed]
    rule: >-
      A returned payment is reversed row by row, each return row carrying the original row's amount and effective date and
      pointing to it through source_ref_id, so the installment it paid is reopened. A payment may be reversed only once.
      One returned payment fee of returned_payment_fee_usd is assessed per returned remittance (booked from the principal
      return row), and none when the return reason is unauthorized.
    eligibility:
      - id: farmland_reverse_once
        applies_to: [farmland_principal_payment_return, farmland_interest_payment_return]
        kind: dedup
        condition: "A payment may be reversed only once."
        evidence_fields: [farmland_transactions.source_ref_id, farmland_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_transactions.source_ref_id]]
          action_bindings: {farmland_transactions.source_ref_id: source_ref_id}
        dedup_contract:
          table: farmland_transactions
          mode: separate_record
          object_bindings: {source_ref_id: source_ref_id}
          duplicate_filters: {event_type: [farmland_principal_payment_return, farmland_interest_payment_return]}
          distinct_fields: []
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {fee: "=returned_payment_fee_usd"}
        FarmLand 3-Year Adjustable Mortgage: {fee: "=returned_payment_fee_usd"}
        FarmLand 5-Year Adjustable Mortgage: {fee: "=returned_payment_fee_usd"}
        FarmLand 10-Year Adjustable Mortgage: {fee: "=returned_payment_fee_usd"}
        FarmLand 15-Year Fixed Mortgage: {fee: "=returned_payment_fee_usd"}
        FarmLand 25-Year Fixed Mortgage: {fee: "=returned_payment_fee_usd"}

  - id: farmland_prepayment
    subject: [farmland_principal_payment, farmland_fee_assessed]
    rule: >-
      Principal may be prepaid in part or in full at any time. Prepayments in a loan year up to
      free_prepayment_pct_per_loan_year of the principal balance at the start of that loan year
      (farmland_msr_loan_year_start_balance), counting earlier prepayments of the same loan year
      (farmland_msr_loan_year_prepaid), carry no fee; the excess carries the fee_pct of the prepayment_fee_schedule entry
      for the current loan year, the loan year being counted from the closing date or, after a conversion, from the
      conversion date, rounded to cents and booked with fee_code prepayment and source_ref_id the principal payment it is
      charged on. Payoffs count as prepayments of the whole balance. Release proceeds from a sale or farmstead split
      count toward the allowance and the fee; condemnation awards, scheduled installments and a rate conversion never
      carry a prepayment fee. A product with an empty schedule, and every loan year past the schedule's last entry,
      carries no fee. A prepayment shortens the schedule; the installment is unchanged until the next scheduled
      adjustment or conversion.
    eligibility: []
    measures: [farmland_msr_loan_year_prepaid, farmland_msr_loan_year_start_balance]
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {schedule: "=prepayment_fee_schedule", free_pct: "=free_prepayment_pct_per_loan_year"}
        FarmLand 3-Year Adjustable Mortgage: {schedule: "=prepayment_fee_schedule", free_pct: "=free_prepayment_pct_per_loan_year"}
        FarmLand 5-Year Adjustable Mortgage: {schedule: "=prepayment_fee_schedule", free_pct: "=free_prepayment_pct_per_loan_year"}
        FarmLand 10-Year Adjustable Mortgage: {schedule: "=prepayment_fee_schedule", free_pct: "=free_prepayment_pct_per_loan_year"}
        FarmLand 15-Year Fixed Mortgage: {schedule: "=prepayment_fee_schedule", free_pct: "=free_prepayment_pct_per_loan_year"}
        FarmLand 25-Year Fixed Mortgage: {schedule: "=prepayment_fee_schedule", free_pct: "=free_prepayment_pct_per_loan_year"}
    formula:
      free_remaining: max(0, round(farmland_msr_loan_year_start_balance * free_prepayment_pct_per_loan_year / 100, 2) - farmland_msr_loan_year_prepaid)
      chargeable: max(0, amount - free_remaining)

  - id: farmland_rate_conversion_rule
    subject: [farmland_rate_conversion, farmland_fee_assessed]
    rule: >-
      At the member's request, registered as a rate_conversion request naming the product to convert into, a loan may be
      converted to another farm real estate product without refinancing, keeping its mortgage, maturity and
      amortization. A conversion may take effect only while the loan is in active status. A conversion may take effect no
      earlier than conversion_min_months_between calendar months after the loan closed or was last converted, counted
      from the later of opened_date and last_conversion_date to the same day of the target month (the last day of that
      month when the day does not exist), that day itself qualifying. The product converted into must be one of the
      current product's conversion_targets, and no installment may be past due. On conversion the new rate is set under
      farmland_rate_setting, the installment is re-amortised over the remaining amortization, a new loan year count
      starts for the prepayment fee schedule, and a conversion fee of conversion_fee_pct of the principal balance, but
      not less than conversion_fee_min_usd, is assessed in place of any prepayment fee.
    eligibility:
      - id: conversion_active_loan
        applies_to: [farmland_rate_conversion]
        kind: state
        condition: "A conversion may take effect only while the loan is in active status."
        evidence_fields: [farmland_loans.status, farmland_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_loans.loan_id]]
          action_bindings: {farmland_loans.loan_id: loan_id}
        state_contract:
          field: farmland_loans.status
          allowed: [active]
      - id: conversion_spacing
        applies_to: [farmland_rate_conversion]
        kind: time
        condition: "A conversion may take effect no earlier than conversion_min_months_between calendar months after the loan closed or was last converted"
        evidence_fields: [farmland_loans.last_conversion_date, farmland_loans.opened_date, farmland_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_loans.loan_id]]
          action_bindings: {farmland_loans.loan_id: loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the loan closed or was last converted"
          anchor_source: farmland_loans.last_conversion_date
          relation: not_before
          duration_source: variants.conversion_min_months_between
          unit: calendar_months
          counting_rule: "counted from the later of opened_date and last_conversion_date to the same day of the target month (the last day of that month when the day does not exist), that day itself qualifying"
          boundary: inclusive
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {allowed: "=conversion_allowed", targets: "=conversion_targets", fee_pct: "=conversion_fee_pct", fee_min: "=conversion_fee_min_usd", spacing: "=conversion_min_months_between"}
        FarmLand 3-Year Adjustable Mortgage: {allowed: "=conversion_allowed", targets: "=conversion_targets", fee_pct: "=conversion_fee_pct", fee_min: "=conversion_fee_min_usd", spacing: "=conversion_min_months_between"}
        FarmLand 5-Year Adjustable Mortgage: {allowed: "=conversion_allowed", targets: "=conversion_targets", fee_pct: "=conversion_fee_pct", fee_min: "=conversion_fee_min_usd", spacing: "=conversion_min_months_between"}
        FarmLand 10-Year Adjustable Mortgage: {allowed: "=conversion_allowed", targets: "=conversion_targets", fee_pct: "=conversion_fee_pct", fee_min: "=conversion_fee_min_usd", spacing: "=conversion_min_months_between"}
        FarmLand 15-Year Fixed Mortgage: {allowed: "=conversion_allowed", targets: "=conversion_targets", fee_pct: "=conversion_fee_pct", fee_min: "=conversion_fee_min_usd", spacing: "=conversion_min_months_between"}
        FarmLand 25-Year Fixed Mortgage: {allowed: "=conversion_allowed", targets: "=conversion_targets", fee_pct: "=conversion_fee_pct", fee_min: "=conversion_fee_min_usd", spacing: "=conversion_min_months_between"}
    formula:
      conversion_fee: max(conversion_fee_min_usd, round(principal_balance * conversion_fee_pct / 100, 2))

  - id: farmland_partial_release
    subject: [farmland_parcel_released, farmland_principal_payment, farmland_fee_assessed]
    rule: >-
      A parcel may be released only while the loan is in active or paid_off status: on payoff every parcel still
      mortgaged is released through the trigger, and while the loan is active one parcel of several may be released on
      its sale, on a public taking, or as a farmstead split. Each mortgaged parcel may be released only once. A partial
      release is registered as a partial_release request naming the parcel number and the net sale price or award (0.00
      for a farmstead split), and is made only while at least one other parcel remains mortgaged. The release price is the
      greater of the net sale price or award and partial_release_premium_pct of the parcel's share of principal, that
      share being principal_balance times the parcel's appraised_value divided by the loan's collateral_value, rounded to
      cents; for a farmstead split the release price is the premium amount alone. The release price is applied to
      principal as release proceeds on the release date, after which principal may not exceed max_ltv_after_release_pct
      of the value still mortgaged and the combined test of farmland_agg_combined_ltv must be met, any excess being paid
      down at the same time. A tract smaller than survey_required_below_acres acres is released only on a recorded survey.
      A release on sale or farmstead split carries partial_release_fee_usd; a release on condemnation carries no fee. No
      partial release is made while an installment is past due. The recorded release of mortgage is delivered within
      release_processing_business_days business days of approval or payoff.
    eligibility:
      - id: release_loan_status
        applies_to: [farmland_parcel_released]
        kind: state
        condition: "A parcel may be released only while the loan is in active or paid_off status"
        evidence_fields: [farmland_loans.status, farmland_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_loans.loan_id]]
          action_bindings: {farmland_loans.loan_id: loan_id}
        state_contract:
          field: farmland_loans.status
          allowed: [active, paid_off]
      - id: parcel_released_once
        applies_to: [farmland_parcel_released]
        kind: dedup
        condition: "Each mortgaged parcel may be released only once."
        evidence_fields: [farmland_parcels.source_action_id, farmland_parcels.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_parcels.source_action_id]]
          action_bindings: {farmland_parcels.source_action_id: source_action_id}
        dedup_contract:
          table: farmland_parcels
          mode: separate_record
          object_bindings: {source_action_id: source_action_id}
          duplicate_filters: {event_type: [farmland_parcel_released]}
          distinct_fields: []
    measures: [farmland_msr_parcels_mortgaged, farmland_msr_past_due_installments]
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {premium: "=partial_release_premium_pct", fee: "=partial_release_fee_usd", ltv_after: "=max_ltv_after_release_pct", survey_acres: "=survey_required_below_acres", days: "=release_processing_business_days"}
        FarmLand 3-Year Adjustable Mortgage: {premium: "=partial_release_premium_pct", fee: "=partial_release_fee_usd", ltv_after: "=max_ltv_after_release_pct", survey_acres: "=survey_required_below_acres", days: "=release_processing_business_days"}
        FarmLand 5-Year Adjustable Mortgage: {premium: "=partial_release_premium_pct", fee: "=partial_release_fee_usd", ltv_after: "=max_ltv_after_release_pct", survey_acres: "=survey_required_below_acres", days: "=release_processing_business_days"}
        FarmLand 10-Year Adjustable Mortgage: {premium: "=partial_release_premium_pct", fee: "=partial_release_fee_usd", ltv_after: "=max_ltv_after_release_pct", survey_acres: "=survey_required_below_acres", days: "=release_processing_business_days"}
        FarmLand 15-Year Fixed Mortgage: {premium: "=partial_release_premium_pct", fee: "=partial_release_fee_usd", ltv_after: "=max_ltv_after_release_pct", survey_acres: "=survey_required_below_acres", days: "=release_processing_business_days"}
        FarmLand 25-Year Fixed Mortgage: {premium: "=partial_release_premium_pct", fee: "=partial_release_fee_usd", ltv_after: "=max_ltv_after_release_pct", survey_acres: "=survey_required_below_acres", days: "=release_processing_business_days"}
    formula:
      parcel_share: round(principal_balance * appraised_value / collateral_value, 2)
      premium_amount: round(parcel_share * partial_release_premium_pct / 100, 2)

  - id: farmland_property_tax
    subject: [farmland_protective_advance, farmland_tax_verification, farmland_fee_assessed]
    rule: >-
      The member pays the real estate taxes on every mortgaged parcel directly to the county; the association verifies
      each tax year with the county treasurer and records the latest year verified paid and, when the treasurer reports an
      installment unpaid, the county delinquency date of the earliest one. When a tax year becomes
      delinquent under county rules, the member is notified, and a protective advance may be made only after more than
      tax_delinquency_cure_days calendar days have passed since the county delinquency date of that tax year, counted with
      the delinquency date as day 0. The advance pays the delinquent tax, penalty and county interest as billed by the
      treasurer, is added to principal on the payment date, accrues interest at the contract rate, and carries
      protective_advance_fee_usd. A member's statement that the tax was paid is not verification; a county receipt or
      treasurer record is. One protective advance is made per parcel tax year.
    eligibility:
      - id: tax_cure_period_passed
        applies_to: [farmland_protective_advance]
        kind: time
        condition: "a protective advance may be made only after more than tax_delinquency_cure_days calendar days have passed since the county delinquency date of that tax year"
        evidence_fields: [farmland_loans.tax_delinquent_since, farmland_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_loans.loan_id]]
          action_bindings: {farmland_loans.loan_id: loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the county delinquency date of that tax year"
          anchor_source: farmland_loans.tax_delinquent_since
          relation: not_before
          duration_source: variants.tax_delinquency_cure_days
          unit: calendar_days
          counting_rule: "counted with the delinquency date as day 0"
          boundary: exclusive
      - id: one_advance_per_tax_year
        applies_to: [farmland_protective_advance]
        kind: dedup
        condition: "One protective advance is made per parcel tax year."
        evidence_fields: [farmland_transactions.loan_id, farmland_transactions.tax_year, farmland_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_transactions.loan_id, farmland_transactions.tax_year]]
          action_bindings: {farmland_transactions.loan_id: loan_id, farmland_transactions.tax_year: tax_year}
        dedup_contract:
          table: farmland_transactions
          mode: separate_record
          object_bindings: {loan_id: loan_id, tax_year: tax_year}
          duplicate_filters: {event_type: [farmland_protective_advance]}
          distinct_fields: []
    params:
      county_delinquency_dates_ne: {first_half: "May 1 of the year after the tax year", second_half: "September 1 of the year after the tax year"}
      per_tier:
        FarmLand Variable-Rate Mortgage: {cure_days: "=tax_delinquency_cure_days", fee: "=protective_advance_fee_usd"}
        FarmLand 3-Year Adjustable Mortgage: {cure_days: "=tax_delinquency_cure_days", fee: "=protective_advance_fee_usd"}
        FarmLand 5-Year Adjustable Mortgage: {cure_days: "=tax_delinquency_cure_days", fee: "=protective_advance_fee_usd"}
        FarmLand 10-Year Adjustable Mortgage: {cure_days: "=tax_delinquency_cure_days", fee: "=protective_advance_fee_usd"}
        FarmLand 15-Year Fixed Mortgage: {cure_days: "=tax_delinquency_cure_days", fee: "=protective_advance_fee_usd"}
        FarmLand 25-Year Fixed Mortgage: {cure_days: "=tax_delinquency_cure_days", fee: "=protective_advance_fee_usd"}

  - id: farmland_insurance_requirement
    subject: [farmland_fee_assessed]
    rule: >-
      Where the appraised value of insurable buildings on the mortgaged parcels exceeds
      improvements_insurance_threshold_usd, hazard insurance naming the association mortgagee must be kept in force.
      Buildings in a special flood hazard area must carry flood insurance for the lesser of the building value and the
      National Flood Insurance Program maximum for the building type; when coverage is not in force, the member is
      notified and, if proof is not received by the end of flood_force_place_notice_days calendar days after the notice
      date, the association force-places flood coverage and assesses its premium with fee_code flood_insurance. Proof of
      coverage effective on or before the force-placement date received later waives that premium with waiver_basis
      error_correction. Bare land without buildings carries no insurance requirement.
    eligibility: []
    params:
      nfip_building_maximum_usd: {residential: 250000.00, non_residential: 500000.00}
      per_tier:
        FarmLand Variable-Rate Mortgage: {threshold: "=improvements_insurance_threshold_usd", notice_days: "=flood_force_place_notice_days"}
        FarmLand 3-Year Adjustable Mortgage: {threshold: "=improvements_insurance_threshold_usd", notice_days: "=flood_force_place_notice_days"}
        FarmLand 5-Year Adjustable Mortgage: {threshold: "=improvements_insurance_threshold_usd", notice_days: "=flood_force_place_notice_days"}
        FarmLand 10-Year Adjustable Mortgage: {threshold: "=improvements_insurance_threshold_usd", notice_days: "=flood_force_place_notice_days"}
        FarmLand 15-Year Fixed Mortgage: {threshold: "=improvements_insurance_threshold_usd", notice_days: "=flood_force_place_notice_days"}
        FarmLand 25-Year Fixed Mortgage: {threshold: "=improvements_insurance_threshold_usd", notice_days: "=flood_force_place_notice_days"}

  - id: farmland_nonaccrual_status
    subject: [farmland_nonaccrual, farmland_accrual_restore]
    rule: >-
      A loan in active status is placed in nonaccrual when an installment remains not paid in full more than
      nonaccrual_past_due_days calendar days after its due date, the due date being day 0. In nonaccrual, payments are
      still applied, late charges stop, default interest continues to be booked, and no conversion or partial release is
      available. The loan returns to active status on the day every past-due installment is paid in full.
    eligibility: []
    measures: [farmland_msr_past_due_installments, farmland_msr_oldest_past_due_days]
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {days: "=nonaccrual_past_due_days"}
        FarmLand 3-Year Adjustable Mortgage: {days: "=nonaccrual_past_due_days"}
        FarmLand 5-Year Adjustable Mortgage: {days: "=nonaccrual_past_due_days"}
        FarmLand 10-Year Adjustable Mortgage: {days: "=nonaccrual_past_due_days"}
        FarmLand 15-Year Fixed Mortgage: {days: "=nonaccrual_past_due_days"}
        FarmLand 25-Year Fixed Mortgage: {days: "=nonaccrual_past_due_days"}

  - id: farmland_payoff
    subject: [farmland_loan_payoff, farmland_parcel_released]
    rule: >-
      A payoff quote for the payoff date the member names states unpaid fees, unpaid billed interest, interest from the day
      after the last due date through the payoff date (at the default rate where default interest applies), the
      prepayment fee under farmland_prepayment, and the principal balance. It is good through payoff_quote_valid_days
      calendar days after the quote date, the quote date being day 0. The loan is paid off on the effective date of the
      payment that brings everything owed to zero; every parcel is released with release_reason payoff and the recorded
      release of mortgage is delivered within release_processing_business_days business days. Any overpayment is refunded.
    eligibility: []
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {quote_days: "=payoff_quote_valid_days"}
        FarmLand 3-Year Adjustable Mortgage: {quote_days: "=payoff_quote_valid_days"}
        FarmLand 5-Year Adjustable Mortgage: {quote_days: "=payoff_quote_valid_days"}
        FarmLand 10-Year Adjustable Mortgage: {quote_days: "=payoff_quote_valid_days"}
        FarmLand 15-Year Fixed Mortgage: {quote_days: "=payoff_quote_valid_days"}
        FarmLand 25-Year Fixed Mortgage: {quote_days: "=payoff_quote_valid_days"}

  - id: farmland_autopay_enrolment
    subject: [farmland_autopay_change]
    rule: >-
      Automatic debit of installments is authorised, moved or cancelled only on the member's own instruction, the
      checking account identified by the last four digits the member gives, recorded exactly as given. Autopay may be
      changed only while the loan is in active or nonaccrual status. Each installment is then debited on its due date.
      The autopay discount of farmland_rate_setting is added or removed from the change date; moving the debit to another
      account leaves the rate unchanged.
    eligibility:
      - id: farmland_autopay_open
        applies_to: [farmland_autopay_change]
        kind: state
        condition: "Autopay may be changed only while the loan is in active or nonaccrual status."
        evidence_fields: [farmland_loans.status, farmland_loans.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[farmland_loans.loan_id]]
          action_bindings: {farmland_loans.loan_id: loan_id}
        state_contract:
          field: farmland_loans.status
          allowed: [active, nonaccrual]
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {available: "=autopay_available", discount: "=autopay_rate_discount_pct"}
        FarmLand 3-Year Adjustable Mortgage: {available: "=autopay_available", discount: "=autopay_rate_discount_pct"}
        FarmLand 5-Year Adjustable Mortgage: {available: "=autopay_available", discount: "=autopay_rate_discount_pct"}
        FarmLand 10-Year Adjustable Mortgage: {available: "=autopay_available", discount: "=autopay_rate_discount_pct"}
        FarmLand 15-Year Fixed Mortgage: {available: "=autopay_available", discount: "=autopay_rate_discount_pct"}
        FarmLand 25-Year Fixed Mortgage: {available: "=autopay_available", discount: "=autopay_rate_discount_pct"}

  - id: farmland_assumption_rule
    subject: [farmland_loan_assumption, farmland_fee_assessed]
    rule: >-
      When mortgaged land is sold, the loan is due on sale unless a buyer who is or becomes a member assumes it. An
      assumption is registered as an assumption request, is available only on a product with assumption_allowed true,
      requires credit approval of the buyer and no past-due installment, and keeps the rate, schedule and maturity
      unchanged. On the effective date the assuming member becomes the borrower and an assumption fee of
      assumption_fee_pct of the principal balance assumed, rounded to cents, is assessed; the selling member is released
      from the note only by the credit officer's written release. Products with assumption_allowed false are paid off on
      sale.
    eligibility: []
    params:
      per_tier:
        FarmLand Variable-Rate Mortgage: {allowed: "=assumption_allowed", fee_pct: "=assumption_fee_pct", financials: "=annual_financials_threshold_usd"}
        FarmLand 3-Year Adjustable Mortgage: {allowed: "=assumption_allowed", fee_pct: "=assumption_fee_pct", financials: "=annual_financials_threshold_usd"}
        FarmLand 5-Year Adjustable Mortgage: {allowed: "=assumption_allowed", fee_pct: "=assumption_fee_pct", financials: "=annual_financials_threshold_usd"}
        FarmLand 10-Year Adjustable Mortgage: {allowed: "=assumption_allowed", fee_pct: "=assumption_fee_pct", financials: "=annual_financials_threshold_usd"}
        FarmLand 15-Year Fixed Mortgage: {allowed: "=assumption_allowed", fee_pct: "=assumption_fee_pct", financials: "=annual_financials_threshold_usd"}
        FarmLand 25-Year Fixed Mortgage: {allowed: "=assumption_allowed", fee_pct: "=assumption_fee_pct", financials: "=annual_financials_threshold_usd"}
    formula:
      assumption_fee: round(principal_balance * assumption_fee_pct / 100, 2)

# ---- extended policies (this difficulty) ----
extended_policies:
  - id: farmland_ext_default_interest_entry
    base_policy_refs: [farmland_installment_billing]
    overwrite:
      - base_policy: farmland_installment_billing
        superseded_clause: >-
          While an installment is past due more than default_interest_trigger_days calendar days, principal accrues at
          the contract rate plus default_interest_addon_pct, booked with rate_basis default_rate, from the day after that
          threshold until the day every past-due installment is paid.
        replaced_by: >-
          The default-rate interest entry carries only the default-interest add-on, because the contract-rate interest
          for the same days is billed with the regular installment, and it is booked as its own interest entry marked
          as default-rate interest, dated the day it is booked.
    trigger: state_due
    subject: [farmland_interest_accrual]
    computes: amount
    target_tool: book_default_interest_ef623284
    params:
      seasoned_loan_months: 36
      prior_default_lookback_months: 60
      trigger_first_episode_days: 75
      trigger_repeat_days: 45
      prompt_cure_days: 120
      slow_cure_days: 180
      addon_prompt_cure_pct: 2.0
      addon_slow_cure_pct: 4.0
      wire_or_branch_end_offset_days: -1
      mail_check_end_offset_days: 2
      indemnity_lookback_months: 6
      relief_full_cover: 0.5
      relief_partial_cover: 0.75
    rule: >-
      Default-rate interest is owed on an installment that was paid in full more than the trigger days after it fell
      due, and the entry for it is booked as soon as the desk finds it missing; the installment considered is the
      most recent installment bill, together with the most recent scheduled principal payment, which is the payment
      that completed it.
      The default-rate interest entry carries only the default-interest add-on, because the contract-rate interest
      for the same days is billed with the regular installment, and it is booked as its own interest entry marked
      as default-rate interest, dated the day it is booked.
      The standard default-interest entry is figured as follows. The trigger is the product's default-interest
      trigger days. The default clock counts calendar days from the installment's due date, the due date itself
      being day 0. The entry covers the days after the trigger day through the day the installment was paid in
      full, that day included. It is figured on the principal balance as it stood before the payment that completed
      the installment, which is the principal balance now plus that payment's principal, at the product's
      default-interest add-on, for the days covered on an actual/365 basis, the product of balance, add-on and
      days being rounded once to cents.
      The trigger days depend on the loan's seasoning and its record: a loan at least 36 months old at the
      installment's due date that has had no default-rate interest entry in the last 60 months is allowed the
      first-episode trigger of 75 days; a loan at least 36 months old at the due date that has had a default-rate
      interest entry in the last 60 months is held to the repeat trigger of 45 days; any other loan uses the
      product's default-interest trigger days.
      The add-on depends on how promptly the installment was cured, counted in calendar days from the due date to
      the day it was paid in full: cured within 120 days, the add-on is 2.0 percent; cured more than 180 days after
      the due date, the add-on is 4.0 percent; cured in between, the add-on is the product's default-interest
      add-on.
      Where the member paid the interest share of the installment early, the default clock starts later: when the
      latest interest payment came within the late-charge grace period, counted from the due date as day 0, the
      clock starts at the end of the grace period, so the grace days are taken off the days counted; when the
      latest interest payment came after the grace period but before the day the installment was paid in full, the
      clock starts on the day of that interest payment, so the days from the due date to that payment are taken
      off; otherwise the clock starts on the due date.
      The last day covered depends on how the completing payment arrived: a payment received by wire or at a
      branch stops the default interest the day before it was received; a payment received as a mailed check
      carries the default interest through the second day after it was received; a payment by any other channel
      stops the default interest on the day it was received, that day included.
      The number of days covered is the days counted from the due date to the last day covered, less the days the
      later clock start takes off, less the trigger days, never below zero.
      Disaster relief applies where a crop insurance indemnity paid jointly to the member and the association
      under an assignment arrived in the last 6 months: when that indemnity is at least the principal share of
      the installment (the installment amount less its billed interest), the entry is half of the figure worked
      out above; when such an indemnity arrived but is smaller than the principal share, the entry is three
      quarters of that figure; when no such indemnity arrived, the entry is the full figure; the relief is applied
      to the unrounded figure before the single rounding to cents.
    prerequisite: []
    cross_category:
      - category: cropins
        as: history
        reads: [cropins_transactions.amount, cropins_transactions.event_type, cropins_transactions.payee, cropins_transactions.effective_date]
        note: The disaster-relief factor decides its tier from assigned crop insurance indemnities paid to the member in the last 6 months.
    compute:
      - bill_due: "LATEST('farmland_transactions', 'due_date', date_field='due_date', event_type='farmland_interest_accrual', rate_basis='contract_rate')"
      - bill_interest: "SUM('farmland_transactions', 'amount', event_type='farmland_interest_accrual', rate_basis='contract_rate', due_date=bill_due)"
      - cure_on: "LATEST('farmland_transactions', 'effective_date', date_field='effective_date', event_type='farmland_principal_payment', payment_purpose='scheduled')"
      - cure_principal: "LATEST('farmland_transactions', 'amount', date_field='effective_date', event_type='farmland_principal_payment', payment_purpose='scheduled')"
      - prior_default: "COUNT('farmland_transactions', within_months=K('prior_default_lookback_months'), date_field='effective_date', event_type='farmland_interest_accrual', rate_basis='default_rate')"
      - age_at_due: "MONTHS(F('opened_date'), bill_due)"
      - trigger_days: "K('trigger_first_episode_days') if (prior_default == 0 and age_at_due >= K('seasoned_loan_months')) else (K('trigger_repeat_days') if (prior_default >= 1 and age_at_due >= K('seasoned_loan_months')) else P('default_interest_trigger_days'))"
      - days_to_cure: "DAYS(bill_due, cure_on)"
      - addon: "K('addon_prompt_cure_pct') if days_to_cure <= K('prompt_cure_days') else (K('addon_slow_cure_pct') if days_to_cure > K('slow_cure_days') else P('default_interest_addon_pct'))"
      - interest_paid_on: "LATEST('farmland_transactions', 'effective_date', date_field='effective_date', event_type='farmland_interest_payment')"
      - anchor_offset: "P('late_charge_grace_days') if DAYS(bill_due, interest_paid_on) <= P('late_charge_grace_days') else (DAYS(bill_due, interest_paid_on) if (DAYS(bill_due, interest_paid_on) > P('late_charge_grace_days') and DAYS(interest_paid_on, cure_on) > 0) else 0)"
      - cure_channel: "LATEST('farmland_transactions', 'channel', date_field='effective_date', event_type='farmland_principal_payment', payment_purpose='scheduled')"
      - end_offset: "K('wire_or_branch_end_offset_days') if (cure_channel == 'wire_in' or cure_channel == 'branch') else (K('mail_check_end_offset_days') if cure_channel == 'mail_check' else 0)"
      - default_days: "MX(0, days_to_cure + end_offset - anchor_offset - trigger_days)"
      - default_principal: "F('principal_balance') + cure_principal"
      - indemnity: "XSUM('cropins', 'cropins_transactions', 'amount', within_months=K('indemnity_lookback_months'), date_field='effective_date', event_type='cropins_indemnity_paid', payee='member_and_association')"
      - principal_share: "F('installment_amount') - bill_interest"
      - relief: "K('relief_full_cover') if (indemnity > 0 and indemnity >= principal_share) else (K('relief_partial_cover') if (indemnity > 0 and indemnity < principal_share) else 1.0)"
      - result: "RND(default_principal * addon / 100 * default_days / 365 * relief, 2)"
    compute_basis:
      bill_due: "the installment considered is the most recent installment bill, together with the most recent scheduled principal payment, which is the payment that completed it"
      bill_interest: "the principal share of the installment (the installment amount less its billed interest)"
      cure_on: "the installment considered is the most recent installment bill, together with the most recent scheduled principal payment, which is the payment that completed it"
      cure_principal: "which is the principal balance now plus that payment's principal"
      prior_default: "that has had no default-rate interest entry in the last 60 months"
      age_at_due: "a loan at least 36 months old at the installment's due date"
      trigger_days: "a loan at least 36 months old at the installment's due date that has had no default-rate interest entry in the last 60 months is allowed the first-episode trigger of 75 days; a loan at least 36 months old at the due date that has had a default-rate interest entry in the last 60 months is held to the repeat trigger of 45 days; any other loan uses the product's default-interest trigger days."
      days_to_cure: "counted in calendar days from the due date to the day it was paid in full"
      addon: "cured within 120 days, the add-on is 2.0 percent; cured more than 180 days after the due date, the add-on is 4.0 percent; cured in between, the add-on is the product's default-interest add-on."
      interest_paid_on: "when the latest interest payment came within the late-charge grace period, counted from the due date as day 0"
      anchor_offset: "when the latest interest payment came within the late-charge grace period, counted from the due date as day 0, the clock starts at the end of the grace period, so the grace days are taken off the days counted; when the latest interest payment came after the grace period but before the day the installment was paid in full, the clock starts on the day of that interest payment, so the days from the due date to that payment are taken off; otherwise the clock starts on the due date."
      cure_channel: "The last day covered depends on how the completing payment arrived"
      end_offset: "a payment received by wire or at a branch stops the default interest the day before it was received; a payment received as a mailed check carries the default interest through the second day after it was received; a payment by any other channel stops the default interest on the day it was received, that day included."
      default_days: "The number of days covered is the days counted from the due date to the last day covered, less the days the later clock start takes off, less the trigger days, never below zero."
      default_principal: "It is figured on the principal balance as it stood before the payment that completed the installment, which is the principal balance now plus that payment's principal"
      indemnity: "a crop insurance indemnity paid jointly to the member and the association under an assignment arrived in the last 6 months"
      principal_share: "the principal share of the installment (the installment amount less its billed interest)"
      relief: "when that indemnity is at least the principal share of the installment (the installment amount less its billed interest), the entry is half of the figure worked out above; when such an indemnity arrived but is smaller than the principal share, the entry is three quarters of that figure; when no such indemnity arrived, the entry is the full figure"
      result: "the relief is applied to the unrounded figure before the single rounding to cents."
    factors:
      - id: trigger_by_seasoning_and_record
        effect: parameter
        decides: trigger_days
        bindings: [prior_default, age_at_due, trigger_days]
        ladder:
          - when: "the loan is at least 36 months old at the due date and has had no default-rate interest entry in the last 60 months"
            value: "K('trigger_first_episode_days') (75 days)"
          - when: "the loan is at least 36 months old at the due date and has had a default-rate interest entry in the last 60 months"
            value: "K('trigger_repeat_days') (45 days)"
          - when: "otherwise"
            value: "P('default_interest_trigger_days')"
        baseline:
          trigger_days: "P('default_interest_trigger_days')"
        evidence: [history, date]
        cross_difficulty: null
      - id: addon_by_cure_speed
        effect: parameter
        decides: addon
        bindings: [days_to_cure, addon]
        ladder:
          - when: "the installment was paid in full within 120 days of its due date"
            value: "K('addon_prompt_cure_pct') (2.0 percent)"
          - when: "the installment was paid in full more than 180 days after its due date"
            value: "K('addon_slow_cure_pct') (4.0 percent)"
          - when: "otherwise"
            value: "P('default_interest_addon_pct')"
        baseline:
          addon: "P('default_interest_addon_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: clock_start_after_interest_paid
        effect: method
        decides: anchor_offset
        bindings: [interest_paid_on, anchor_offset]
        ladder:
          - when: "the latest interest payment came within the late-charge grace period"
            method: "the default clock starts at the end of the grace period: the grace days are taken off the days counted"
          - when: "the latest interest payment came after the grace period but before the installment was paid in full"
            method: "the default clock starts on the day of that interest payment: the days from the due date to that payment are taken off"
          - when: "otherwise"
            method: "the default clock starts on the due date"
        baseline:
          anchor_offset: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: last_day_by_payment_channel
        effect: method
        decides: end_offset
        bindings: [cure_channel, end_offset]
        ladder:
          - when: "the completing payment arrived by wire or at a branch"
            method: "the default interest stops the day before the payment was received"
          - when: "the completing payment arrived as a mailed check"
            method: "the default interest runs through the second day after the payment was received"
          - when: "otherwise"
            method: "the default interest stops on the day the payment was received, that day included"
        baseline:
          end_offset: "0"
        evidence: [history]
        cross_difficulty: null
      - id: disaster_relief_from_assigned_indemnity
        effect: method
        decides: relief
        bindings: [indemnity, principal_share, relief]
        ladder:
          - when: "an assigned crop insurance indemnity arrived in the last 6 months and is at least the installment's principal share"
            method: "the entry is half of the figure worked out"
          - when: "an assigned crop insurance indemnity arrived in the last 6 months and is smaller than the installment's principal share"
            method: "the entry is three quarters of the figure worked out"
          - when: "otherwise"
            method: "the entry is the full figure"
        baseline:
          relief: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: cropins
    baseline:
      rule: >-
        The standard default-interest entry is figured as follows. The trigger is the product's default-interest
        trigger days. The default clock counts calendar days from the installment's due date, the due date itself
        being day 0. The entry covers the days after the trigger day through the day the installment was paid in
        full, that day included. It is figured on the principal balance as it stood before the payment that completed
        the installment, which is the principal balance now plus that payment's principal, at the product's
        default-interest add-on, for the days covered on an actual/365 basis, the product of balance, add-on and
        days being rounded once to cents.
      params: [default_interest_trigger_days, default_interest_addon_pct]
    inputs:
      history:
        - {table: farmland_transactions, aggregate: latest, field: due_date, filters: {event_type: farmland_interest_accrual, rate_basis: contract_rate}}
        - {table: farmland_transactions, aggregate: sum, field: amount, filters: {event_type: farmland_interest_accrual, rate_basis: contract_rate}}
        - {table: farmland_transactions, aggregate: latest, field: effective_date, filters: {event_type: farmland_principal_payment, payment_purpose: scheduled}}
        - {table: farmland_transactions, aggregate: count, field: txn_id, within_months: 60, filters: {event_type: farmland_interest_accrual, rate_basis: default_rate}}
        - {table: farmland_transactions, aggregate: latest, field: effective_date, filters: {event_type: farmland_interest_payment}}
        - {category: cropins, table: cropins_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: cropins_indemnity_paid, payee: member_and_association}}
      cross_category: [cropins]
  - id: farmland_ext_autopay_enrolment_rate
    base_policy_refs: [farmland_rate_setting, farmland_autopay_enrolment]
    overwrite:
      - base_policy: farmland_rate_setting
        superseded_clause: >-
          Enrolling in or cancelling autopay adds or removes the autopay discount from that day without restarting any
          fixed period.
        replaced_by: >-
          On the variable-rate product, an authorisation of automatic debit re-sets the contract rate from that day under
          the full rate build-up below; on every other product it takes the autopay discount off the contract rate in
          force from that day without restarting any fixed period.
      - base_policy: farmland_rate_setting
        superseded_clause: >-
          The young-farmer discount, once given, stays for the fixed period even if the StartRight line later closes, and is
          re-tested only at a conversion.
        replaced_by: >-
          The young-farmer land discount follows the member's StartRight Operating Line
      - base_policy: farmland_autopay_enrolment
        superseded_clause: >-
          The autopay discount of farmland_rate_setting is added or removed from the change date; moving the debit to
          another account leaves the rate unchanged.
        replaced_by: >-
          On the variable-rate product, an authorisation of automatic debit re-sets the contract rate from that day under
          the full rate build-up below; on every other product it takes the autopay discount off the contract rate in
          force from that day without restarting any fixed period.
    trigger: on_request
    subject: [farmland_autopay_change]
    computes: interest_rate
    target_tool: authorize_installment_autodebit_3b801ea5
    params:
      association_variable_base_rate_pct: 6.75
      strong_ltv_pct: 50
      thin_ltv_pct: 65
      spread_strong_collateral_pct: 0.10
      spread_thin_collateral_pct: 0.50
      irrigated_share_pct: 50
      grazing_share_pct: 50
      irrigated_credit_pct: 0.05
      grazing_surcharge_pct: 0.10
      record_lookback_months: 24
      autopay_clean_record_pct: 0.15
      autopay_impaired_record_pct: 0.05
      relationship_partial_pct: 0.05
      relationship_autodraft_floor_pct: 0.10
      ybs_full_months: 60
      ybs_seasoned_pct: 0.25
    rule: >-
      On the variable-rate product, an authorisation of automatic debit re-sets the contract rate from that day under
      the full rate build-up below; on every other product it takes the autopay discount off the contract rate in
      force from that day without restarting any fixed period.
      The re-set rate is fixed only after the records carry a default-rate interest entry for every installment that
      was paid in full more than its default-interest trigger days after it fell due.
      The standard build-up of the variable rate is the Association Variable Base Rate in effect on the change date
      (6.75 percent since its most recent history date), plus the product's variable-rate spread, less the
      discounts, the discounts being the product's autopay discount alone, capped at the product's discount cap; the
      result is rounded to 3 decimal places and may not be lower than the product's rate floor.
      The spread follows the loan's collateral coverage, the principal balance divided by the appraised value of the
      parcels still mortgaged (every parcel mortgaged to the loan less every parcel released from it), as a
      percentage rounded to 2 decimals: at or below 50 percent the spread is 0.10 percentage points; above 65
      percent it is 0.50 percentage points; in between it is the product's variable-rate spread.
      The collateral mix adjusts the rate: when irrigated cropland makes up at least half of the appraised value
      still mortgaged, 0.05 percentage points are taken off; when pasture and recreational land together make up
      more than half of it, 0.10 percentage points are added; otherwise there is no mix adjustment.
      The autopay discount follows the loan's record over the last 24 months: with no late charge assessed and no
      default-rate interest entry in that time it is 0.15 percentage points; with a default-rate interest entry in
      that time, or with two or more late charges assessed in it, it is 0.05 percentage points; otherwise it is the
      product's autopay discount.
      The relationship discount follows the member's operating credit: a member holding an operating line in active
      status that is collected by AutoDraft receives the same relationship discount that operating product grants,
      but never less than 0.10 percentage points; a member holding an operating line in active status that is not on AutoDraft receives 0.05 percentage points;
      any other member receives none.
      The young-farmer land discount follows the member's StartRight Operating Line: when it is in active status and
      the farm real estate loan closed less than 60 months ago, the discount is the product's young-farmer land
      discount; when it is in active status and the loan closed 60 or more months ago, the discount is 0.25
      percentage points; otherwise there is none.
      How the discounts combine depends on the program they come from: for a member whose StartRight Operating Line
      is in active status, the autopay and relationship discounts are added and capped at the product's discount
      cap, and the young-farmer land discount is then added outside the cap; for a member without an active
      StartRight Operating Line who holds an operating line in active status on AutoDraft, the autopay and
      young-farmer discounts are added and capped, and the relationship discount is then added outside the cap; for
      any other member, all the discounts are added together and the total is capped at the product's discount cap.
      The re-set rate is the base rate plus the spread plus the collateral mix adjustment, less the combined
      discounts, rounded to 3 decimal places and never below the product's rate floor.
      On every other product the new rate is the contract rate in force less the autopay discount set out above,
      that discount being no more than the product's discount cap, rounded to 3 decimal places and never below the
      product's rate floor.
    prerequisite:
      - problem: farmland_ext_default_interest_entry
        kind: value_input
        gate: autopay_disc
        form: state
        policy_source: >-
          The re-set rate is fixed only after the records carry a default-rate interest entry for every installment that
          was paid in full more than its default-interest trigger days after it fell due.
        condition: >-
          For every installment bill whose completing scheduled payment came more than its default-interest trigger days
          after the due date, a farm real estate interest entry with rate basis default_rate stands on the loan.
        resolved_by: book_default_interest_ef623284
        effect: >-
          The count of default-rate interest entries in the last 24 months that the autopay-discount ladder reads now
          includes the entry booked for the cured installment, which can move the autopay discount onto the
          impaired-record tier.
    cross_category:
      - category: operating
        as: branch
        reads: [status, autodraft_enrolled, variant_name, relationship_rate_discount_pct]
        note: The relationship-discount, young-farmer-discount and discount-combination factors decide their tiers from the member's operating lines.
    compute:
      - mortgaged_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged')"
      - released_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released')"
      - net_value: "mortgaged_value - released_value"
      - ltv_pct: "RND(F('principal_balance') / net_value * 100, 2)"
      - spread_tier: "K('spread_strong_collateral_pct') if ltv_pct <= K('strong_ltv_pct') else (K('spread_thin_collateral_pct') if ltv_pct > K('thin_ltv_pct') else P('variable_rate_spread_pct'))"
      - irrigated_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='cropland_irrigated') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='cropland_irrigated')"
      - grazing_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='pasture') + SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='recreational') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='pasture') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='recreational')"
      - mix_adj: "(0 - K('irrigated_credit_pct')) if irrigated_value * 100 >= K('irrigated_share_pct') * net_value else (K('grazing_surcharge_pct') if grazing_value * 100 > K('grazing_share_pct') * net_value else 0)"
      - late_24: "COUNT('farmland_transactions', within_months=K('record_lookback_months'), date_field='effective_date', event_type='farmland_fee_assessed', fee_code='late_charge')"
      - default_24: "COUNT('farmland_transactions', within_months=K('record_lookback_months'), date_field='effective_date', event_type='farmland_interest_accrual', rate_basis='default_rate')"
      - autopay_disc: "K('autopay_clean_record_pct') if (late_24 == 0 and default_24 == 0) else (K('autopay_impaired_record_pct') if (default_24 >= 1 or late_24 >= 2) else P('autopay_rate_discount_pct'))"
      - ops_active: "EXISTS('operating', status='active')"
      - ops_autodraft: "CFIELD('operating', 'autodraft_enrolled', status='active')"
      - rel_disc: "MX(K('relationship_autodraft_floor_pct'), CPARAM('operating', 'relationship_rate_discount_pct', status='active') or 0) if (ops_active and ops_autodraft == True) else (K('relationship_partial_pct') if (ops_active and ops_autodraft != True) else 0)"
      - startright_status: "CFIELD('operating', 'status', variant_name='StartRight Operating Line', status='active')"
      - loan_age_months: "MONTHS(F('opened_date'), NOW)"
      - ybs_disc: "P('ybs_land_rate_discount_pct') if (startright_status == 'active' and loan_age_months < K('ybs_full_months')) else (K('ybs_seasoned_pct') if (startright_status == 'active' and loan_age_months >= K('ybs_full_months')) else 0)"
      - stack_rule: "1 if CFIELD('operating', 'status', variant_name='StartRight Operating Line', status='active') == 'active' else (2 if (EXISTS('operating', status='active') and CFIELD('operating', 'autodraft_enrolled', status='active') == True) else 0)"
      - disc_total: "(MN(P('rate_discount_cap_pct'), autopay_disc + rel_disc) + ybs_disc) if stack_rule == 1 else ((MN(P('rate_discount_cap_pct'), autopay_disc + ybs_disc) + rel_disc) if stack_rule == 2 else MN(P('rate_discount_cap_pct'), autopay_disc + rel_disc + ybs_disc))"
      - variable_rate: "MX(P('rate_floor_pct'), RND(K('association_variable_base_rate_pct') + spread_tier + mix_adj - disc_total, 3))"
      - other_rate: "MX(P('rate_floor_pct'), RND(F('interest_rate') - MN(autopay_disc, P('rate_discount_cap_pct')), 3))"
      - result: "variable_rate if P('rate_fixed_period_months') == 0 else other_rate"
    compute_basis:
      mortgaged_value: "the appraised value of the parcels still mortgaged (every parcel mortgaged to the loan less every parcel released from it)"
      released_value: "the appraised value of the parcels still mortgaged (every parcel mortgaged to the loan less every parcel released from it)"
      ltv_pct: "the principal balance divided by the appraised value of the parcels still mortgaged (every parcel mortgaged to the loan less every parcel released from it), as a percentage rounded to 2 decimals"
      spread_tier: "at or below 50 percent the spread is 0.10 percentage points; above 65 percent it is 0.50 percentage points; in between it is the product's variable-rate spread."
      irrigated_value: "when irrigated cropland makes up at least half of the appraised value still mortgaged"
      grazing_value: "when pasture and recreational land together make up more than half of it"
      mix_adj: "when irrigated cropland makes up at least half of the appraised value still mortgaged, 0.05 percentage points are taken off; when pasture and recreational land together make up more than half of it, 0.10 percentage points are added; otherwise there is no mix adjustment."
      late_24: "with no late charge assessed and no default-rate interest entry in that time"
      default_24: "with a default-rate interest entry in that time, or with two or more late charges assessed in it"
      autopay_disc: "with no late charge assessed and no default-rate interest entry in that time it is 0.15 percentage points; with a default-rate interest entry in that time, or with two or more late charges assessed in it, it is 0.05 percentage points; otherwise it is the product's autopay discount."
      ops_active: "a member holding an operating line in active status"
      ops_autodraft: "that is collected by AutoDraft"
      rel_disc: "a member holding an operating line in active status that is collected by AutoDraft receives the same relationship discount that operating product grants, but never less than 0.10 percentage points; a member holding an operating line in active status that is not on AutoDraft receives 0.05 percentage points; any other member receives none."
      startright_status: "The young-farmer land discount follows the member's StartRight Operating Line"
      loan_age_months: "the farm real estate loan closed less than 60 months ago"
      ybs_disc: "when it is in active status and the farm real estate loan closed less than 60 months ago, the discount is the product's young-farmer land discount; when it is in active status and the loan closed 60 or more months ago, the discount is 0.25 percentage points; otherwise there is none."
      stack_rule: "How the discounts combine depends on the program they come from"
      disc_total: "for a member whose StartRight Operating Line is in active status, the autopay and relationship discounts are added and capped at the product's discount cap, and the young-farmer land discount is then added outside the cap; for a member without an active StartRight Operating Line who holds an operating line in active status on AutoDraft, the autopay and young-farmer discounts are added and capped, and the relationship discount is then added outside the cap; for any other member, all the discounts are added together and the total is capped at the product's discount cap."
      variable_rate: "The re-set rate is the base rate plus the spread plus the collateral mix adjustment, less the combined discounts, rounded to 3 decimal places and never below the product's rate floor."
      other_rate: "On every other product the new rate is the contract rate in force less the autopay discount set out above, that discount being no more than the product's discount cap, rounded to 3 decimal places and never below the product's rate floor."
      result: "On the variable-rate product, an authorisation of automatic debit re-sets the contract rate from that day under the full rate build-up below; on every other product it takes the autopay discount off the contract rate in force from that day without restarting any fixed period."
    factors:
      - id: spread_by_collateral_coverage
        effect: parameter
        decides: spread_tier
        bindings: [mortgaged_value, released_value, net_value, ltv_pct, spread_tier]
        ladder:
          - when: "principal is at or below 50 percent of the appraised value still mortgaged"
            value: "K('spread_strong_collateral_pct') (0.10)"
          - when: "principal is above 65 percent of the appraised value still mortgaged"
            value: "K('spread_thin_collateral_pct') (0.50)"
          - when: "otherwise"
            value: "P('variable_rate_spread_pct')"
        baseline:
          spread_tier: "P('variable_rate_spread_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: collateral_mix_adjustment
        effect: parameter
        decides: mix_adj
        bindings: [irrigated_value, grazing_value, mix_adj]
        ladder:
          - when: "irrigated cropland makes up at least half of the appraised value still mortgaged"
            value: "minus K('irrigated_credit_pct') (0.05 off)"
          - when: "pasture and recreational land together make up more than half of the appraised value still mortgaged"
            value: "K('grazing_surcharge_pct') (0.10 added)"
          - when: "otherwise"
            value: "0"
        baseline:
          mix_adj: "0"
        evidence: [history]
        cross_difficulty: null
      - id: autopay_discount_by_record
        effect: parameter
        decides: autopay_disc
        bindings: [late_24, default_24, autopay_disc]
        ladder:
          - when: "no late charge assessed and no default-rate interest entry in the last 24 months"
            value: "K('autopay_clean_record_pct') (0.15)"
          - when: "a default-rate interest entry in the last 24 months, or two or more late charges assessed in them"
            value: "K('autopay_impaired_record_pct') (0.05)"
          - when: "otherwise"
            value: "P('autopay_rate_discount_pct')"
        baseline:
          autopay_disc: "P('autopay_rate_discount_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: relationship_discount_from_operating_credit
        effect: parameter
        decides: rel_disc
        bindings: [ops_active, ops_autodraft, rel_disc]
        ladder:
          - when: "the member holds an operating line in active status and it is collected by AutoDraft"
            value: "CPARAM('operating', 'relationship_rate_discount_pct') of that line's product, never less than K('relationship_autodraft_floor_pct') (0.10)"
          - when: "the member holds an operating line in active status and it is not on AutoDraft"
            value: "K('relationship_partial_pct') (0.05)"
          - when: "otherwise"
            value: "0"
        baseline:
          rel_disc: "0"
        evidence: [cross_category]
        cross_difficulty: operating
      - id: young_farmer_land_discount
        effect: parameter
        decides: ybs_disc
        bindings: [startright_status, loan_age_months, ybs_disc]
        ladder:
          - when: "the member's StartRight Operating Line is in active status and the farm loan closed less than 60 months ago"
            value: "P('ybs_land_rate_discount_pct')"
          - when: "the member's StartRight Operating Line is in active status and the farm loan closed 60 or more months ago"
            value: "K('ybs_seasoned_pct') (0.25)"
          - when: "otherwise"
            value: "0"
        baseline:
          ybs_disc: "0"
        evidence: [cross_category, date]
        cross_difficulty: operating
      - id: discount_combination_by_program
        effect: method
        decides: disc_total
        bindings: [stack_rule, disc_total]
        ladder:
          - when: "the member's StartRight Operating Line is in active status"
            method: "autopay and relationship discounts are added and capped; the young-farmer land discount is added outside the cap"
          - when: "no active StartRight Operating Line, and an operating line in active status on AutoDraft"
            method: "autopay and young-farmer discounts are added and capped; the relationship discount is added outside the cap"
          - when: "otherwise"
            method: "all discounts are added together and the total is capped"
        baseline:
          disc_total: "MN(P('rate_discount_cap_pct'), autopay_disc + rel_disc + ybs_disc)"
        evidence: [cross_category]
        cross_difficulty: operating
    baseline:
      rule: >-
        The standard build-up of the variable rate is the Association Variable Base Rate in effect on the change date
        (6.75 percent since its most recent history date), plus the product's variable-rate spread, less the
        discounts, the discounts being the product's autopay discount alone, capped at the product's discount cap; the
        result is rounded to 3 decimal places and may not be lower than the product's rate floor.
      params: [association_variable_base_rate_pct, variable_rate_spread_pct, autopay_rate_discount_pct, rate_discount_cap_pct, rate_floor_pct]
    inputs:
      history:
        - {table: farmland_parcels, aggregate: sum, field: appraised_value, filters: {event_type: farmland_parcel_mortgaged}}
        - {table: farmland_parcels, aggregate: sum, field: appraised_value, filters: {event_type: farmland_parcel_released}}
        - {table: farmland_transactions, aggregate: count, field: txn_id, within_months: 24, filters: {event_type: farmland_fee_assessed, fee_code: late_charge}}
        - {table: farmland_transactions, aggregate: count, field: txn_id, within_months: 24, filters: {event_type: farmland_interest_accrual, rate_basis: default_rate}}
      cross_category: [operating]
  - id: farmland_ext_missed_late_charge
    base_policy_refs: [farmland_evt_late_charge, farmland_evt_returned_payment, farmland_prepayment, farmland_rate_conversion_rule, farmland_partial_release, farmland_property_tax, farmland_insurance_requirement, farmland_assumption_rule]
    overwrite:
      - base_policy: farmland_evt_late_charge
        superseded_clause: >-
          It is charged on an installment not paid in full by then, at late_charge_pct of the unpaid part of the
          installment, no less than late_charge_min_usd and no more than late_charge_max_usd, rounded to cents, with
          source_ref_id the installment bill.
        replaced_by: >-
          The late charge is the unpaid part of the installment at the end of the grace period times the net late-charge
          percentage, times the lateness multiplier, rounded to cents, and then held to no less than the product's
          minimum late charge and no more than its maximum late charge; it is assessed against the installment bill.
    trigger: state_due
    subject: [farmland_fee_assessed]
    computes: amount
    target_tool: assess_late_charge_e3cbcc6c
    params:
      record_lookback_months: 36
      seasoned_months: 24
      first_late_pct: 3.0
      repeat_late_pct: 5.0
      partial_credit_pct: 0.5
      majority_credit_pct: 1.0
      autodraft_credit_pct: 0.25
      operating_credit_pct: 0.10
      harvest_credit_pct: 0.5
      planting_credit_pct: 0.25
      prompt_days: 25
      slow_days: 60
      prompt_multiplier: 0.5
      slow_multiplier: 1.5
    rule: >-
      A late charge that should have arisen on an installment and was never assessed is owed and is assessed as soon
      as the desk finds it missing; the installment considered is the most recent installment bill, which counts as
      completed by the most recent scheduled principal payment.
      The late charge is the unpaid part of the installment at the end of the grace period times the net late-charge
      percentage, times the lateness multiplier, rounded to cents, and then held to no less than the product's
      minimum late charge and no more than its maximum late charge; it is assessed against the installment bill.
      The standard late charge is the product's late-charge percentage of the unpaid part of the installment at the
      end of the grace period, the unpaid part being the installment amount less the interest paid on that
      installment when the most recent interest payment was received within the grace period, the due date being day 0; the standard lateness
      multiplier is one.
      The late-charge percentage follows the loan's record: when no late charge was assessed on the loan in the last 36
      months and the loan was at least 24 months old on the installment's due date, the percentage is 3.0; when
      two or more late charges were assessed in those 36 months, it is 5.0; otherwise it is the product's late-charge
      percentage.
      A good-faith interest payment within the grace period earns a credit taken off the percentage, the amount
      counted being the interest paid on the installment when the most recent interest payment was received within
      the grace period: when that amount is more than half of the installment, the credit is 1.0 percentage point;
      when it is half of the installment or less, the credit is 0.5 percentage point; when no interest payment was
      received within the grace period, there is no credit.
      The member's operating credit earns a further credit: a member holding an operating line in active status that
      is collected by AutoDraft receives 0.25 percentage point; a member holding an operating line in active status
      that is not on AutoDraft receives 0.10 percentage point; any other member receives none.
      An installment falling due in the harvest months of September, October or November earns a seasonal credit of
      0.5 percentage point, one falling due in the planting months of March, April or May earns 0.25 percentage point,
      and one falling due in any other month earns none.
      The net late-charge percentage is the percentage less the three credits, never below zero.
      The lateness multiplier follows how long the installment took to complete, in calendar days from its due date
      to the most recent scheduled principal payment: completed within 25 days, the charge is halved; completed more
      than 60 days after the due date, the charge is one and a half times the figure; otherwise it is the figure
      itself.
    prerequisite: []
    cross_category:
      - category: operating
        as: branch
        reads: [status, autodraft_enrolled]
        note: The relationship-credit factor decides its tier from the member's operating lines.
    compute:
      - bill_due: "LATEST('farmland_transactions', 'due_date', date_field='due_date', event_type='farmland_interest_accrual', rate_basis='contract_rate')"
      - interest_paid_on: "LATEST('farmland_transactions', 'effective_date', date_field='effective_date', event_type='farmland_interest_payment')"
      - bill_ref: "LATEST('farmland_transactions', 'txn_id', date_field='period_end', event_type='farmland_interest_accrual', rate_basis='contract_rate')"
      - interest_paid_amt: "SUM('farmland_transactions', 'amount', event_type='farmland_interest_payment', source_ref_id=bill_ref)"
      - paid_in_grace: "interest_paid_amt if DAYS(bill_due, interest_paid_on) <= P('late_charge_grace_days') else 0"
      - unpaid_part: "RND(F('installment_amount') - paid_in_grace, 2)"
      - prior_late: "COUNT('farmland_transactions', within_months=K('record_lookback_months'), date_field='effective_date', event_type='farmland_fee_assessed', fee_code='late_charge')"
      - age_at_due: "MONTHS(F('opened_date'), bill_due)"
      - base_pct: "K('first_late_pct') if (prior_late == 0 and age_at_due >= K('seasoned_months')) else (K('repeat_late_pct') if prior_late >= 2 else P('late_charge_pct'))"
      - grace_credit: "K('majority_credit_pct') if paid_in_grace * 2 > F('installment_amount') else (K('partial_credit_pct') if (paid_in_grace > 0 and paid_in_grace * 2 <= F('installment_amount')) else 0)"
      - ops_active: "EXISTS('operating', status='active')"
      - ops_autodraft: "CFIELD('operating', 'autodraft_enrolled', status='active')"
      - relationship_credit: "K('autodraft_credit_pct') if (ops_active and ops_autodraft == True) else (K('operating_credit_pct') if (ops_active and ops_autodraft != True) else 0)"
      - due_month: "MONTHS('2000-01-01', bill_due) % 12 + 1"
      - season_credit: "K('harvest_credit_pct') if (due_month >= 9 and due_month <= 11) else (K('planting_credit_pct') if (due_month >= 3 and due_month <= 5) else 0)"
      - net_pct: "MX(0, base_pct - grace_credit - relationship_credit - season_credit)"
      - completed_on: "LATEST('farmland_transactions', 'effective_date', date_field='effective_date', event_type='farmland_principal_payment', payment_purpose='scheduled')"
      - lateness_multiplier: "K('prompt_multiplier') if DAYS(bill_due, completed_on) <= K('prompt_days') else (K('slow_multiplier') if DAYS(bill_due, completed_on) > K('slow_days') else 1.0)"
      - result: "MN(P('late_charge_max_usd'), MX(P('late_charge_min_usd'), RND(unpaid_part * net_pct / 100 * lateness_multiplier, 2)))"
    compute_basis:
      bill_due: "the installment considered is the most recent installment bill, which counts as completed by the most recent scheduled principal payment"
      interest_paid_on: "the unpaid part being the installment amount less the interest paid on that installment when the most recent interest payment was received within the grace period, the due date being day 0"
      bill_ref: "the installment considered is the most recent installment bill, which counts as completed by the most recent scheduled principal payment"
      interest_paid_amt: "the unpaid part being the installment amount less the interest paid on that installment when the most recent interest payment was received within the grace period, the due date being day 0"
      paid_in_grace: "the unpaid part being the installment amount less the interest paid on that installment when the most recent interest payment was received within the grace period, the due date being day 0"
      unpaid_part: "the unpaid part being the installment amount less the interest paid on that installment when the most recent interest payment was received within the grace period"
      prior_late: "when no late charge was assessed on the loan in the last 36 months"
      age_at_due: "the loan was at least 24 months old on the installment's due date"
      base_pct: "when no late charge was assessed on the loan in the last 36 months and the loan was at least 24 months old on the installment's due date, the percentage is 3.0; when two or more late charges were assessed in those 36 months, it is 5.0; otherwise it is the product's late-charge percentage."
      grace_credit: "when that amount is more than half of the installment, the credit is 1.0 percentage point; when it is half of the installment or less, the credit is 0.5 percentage point; when no interest payment was received within the grace period, there is no credit."
      ops_active: "a member holding an operating line in active status"
      ops_autodraft: "that is collected by AutoDraft"
      relationship_credit: "a member holding an operating line in active status that is collected by AutoDraft receives 0.25 percentage point; a member holding an operating line in active status that is not on AutoDraft receives 0.10 percentage point; any other member receives none."
      due_month: "An installment falling due in the harvest months of September, October or November"
      season_credit: "An installment falling due in the harvest months of September, October or November earns a seasonal credit of 0.5 percentage point, one falling due in the planting months of March, April or May earns 0.25 percentage point, and one falling due in any other month earns none."
      net_pct: "The net late-charge percentage is the percentage less the three credits, never below zero."
      completed_on: "in calendar days from its due date to the most recent scheduled principal payment"
      lateness_multiplier: "completed within 25 days, the charge is halved; completed more than 60 days after the due date, the charge is one and a half times the figure; otherwise it is the figure itself."
      result: "The late charge is the unpaid part of the installment at the end of the grace period times the net late-charge percentage, times the lateness multiplier, rounded to cents, and then held to no less than the product's minimum late charge and no more than its maximum late charge"
    factors:
      - id: late_charge_percentage_by_record
        effect: parameter
        decides: base_pct
        bindings: [prior_late, age_at_due, base_pct]
        ladder:
          - when: "no late charge on the loan in the last 36 months and the loan at least 24 months old at the due date"
            value: "K('first_late_pct') (3.0)"
          - when: "two or more late charges in the last 36 months"
            value: "K('repeat_late_pct') (5.0)"
          - when: "otherwise"
            value: "P('late_charge_pct')"
        baseline:
          base_pct: "P('late_charge_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: good_faith_payment_credit
        effect: parameter
        decides: grace_credit
        bindings: [interest_paid_on, bill_ref, interest_paid_amt, paid_in_grace, grace_credit]
        ladder:
          - when: "the interest paid on the installment, received within the grace period, is more than half of the installment"
            value: "K('majority_credit_pct') (1.0)"
          - when: "interest was paid on the installment within the grace period and it is half of the installment or less"
            value: "K('partial_credit_pct') (0.5)"
          - when: "otherwise"
            value: "0"
        baseline:
          grace_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: operating_relationship_credit
        effect: parameter
        decides: relationship_credit
        bindings: [ops_active, ops_autodraft, relationship_credit]
        ladder:
          - when: "an operating line in active status collected by AutoDraft"
            value: "K('autodraft_credit_pct') (0.25)"
          - when: "an operating line in active status not on AutoDraft"
            value: "K('operating_credit_pct') (0.10)"
          - when: "otherwise"
            value: "0"
        baseline:
          relationship_credit: "0"
        evidence: [cross_category]
        cross_difficulty: operating
      - id: crop_season_credit
        effect: parameter
        decides: season_credit
        bindings: [due_month, season_credit]
        ladder:
          - when: "the installment fell due in September, October or November"
            value: "K('harvest_credit_pct') (0.5)"
          - when: "the installment fell due in March, April or May"
            value: "K('planting_credit_pct') (0.25)"
          - when: "otherwise"
            value: "0"
        baseline:
          season_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: lateness_multiplier
        effect: method
        decides: lateness_multiplier
        bindings: [completed_on, lateness_multiplier]
        ladder:
          - when: "the installment was completed within 25 days of its due date"
            method: "the charge figure is halved"
          - when: "the installment was completed more than 60 days after its due date"
            method: "the charge figure is multiplied by one and a half"
          - when: "otherwise"
            method: "the charge figure is taken as it is"
        baseline:
          lateness_multiplier: "1.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard late charge is the product's late-charge percentage of the unpaid part of the installment at the
        end of the grace period, the unpaid part being the installment amount less the interest paid on that
        installment when the most recent interest payment was received within the grace period, the due date being
        day 0; the standard lateness
        multiplier is one.
      params: [late_charge_pct, late_charge_min_usd, late_charge_max_usd, late_charge_grace_days]
    inputs:
      history:
        - {table: farmland_transactions, aggregate: latest, field: due_date, filters: {event_type: farmland_interest_accrual, rate_basis: contract_rate}}
        - {table: farmland_transactions, aggregate: latest, field: effective_date, filters: {event_type: farmland_interest_payment}}
        - {table: farmland_transactions, aggregate: count, field: txn_id, within_months: 36, filters: {event_type: farmland_fee_assessed, fee_code: late_charge}}
        - {table: farmland_transactions, aggregate: latest, field: effective_date, filters: {event_type: farmland_principal_payment, payment_purpose: scheduled}}
      cross_category: [operating]
  - id: farmland_ext_split_paydown
    base_policy_refs: [farmland_payment_application, farmland_prepayment, farmland_partial_release]
    overwrite:
      - base_policy: farmland_partial_release
        superseded_clause: >-
          after which principal may not exceed max_ltv_after_release_pct of the value still mortgaged and the combined test
          of farmland_agg_combined_ltv must be met, any excess being paid down at the same time.
        replaced_by: >-
          When a member asks to split the farmstead out of a farm real estate loan, the paydown the member makes from
          their own funds is the shortfall that leaves the loan within the post-split limit once the release price is
          applied, together with any split curtailment.
    trigger: on_request
    subject: [farmland_principal_payment]
    computes: amount
    target_tool: authorize_principal_paydown_4d1911cd
    params:
      utilization_pct: 75
      leverage_cut_pct: 5.0
      stressed_cut_pct: 10.0
      grazing_share_pct: 30
      irrigated_share_pct: 60
      grazing_cut_pct: 5.0
      irrigated_lift_pct: 5.0
      assigned_cover_lift_pct: 2.5
      unassigned_cover_lift_pct: 1.0
      home_ltv_pct: 80
      outside_curtailment_share: 0.10
      thin_home_curtailment_share: 0.05
    rule: >-
      When a member asks to split the farmstead out of a farm real estate loan, the paydown the member makes from
      their own funds is the shortfall that leaves the loan within the post-split limit once the release price is
      applied, together with any split curtailment.
      The standard paydown is figured as follows. The post-split limit is the product's largest principal after a
      release, as a percentage of the value still mortgaged. The homesite is the parcel of land use farmstead still
      mortgaged, and its value and the value still mortgaged are the appraised values at mortgage (every parcel
      mortgaged to the loan less every parcel released from it). The release price is counted at the product's
      release premium on the principal left after the paydown, so the principal after the paydown may be no more
      than the limit times the value that stays mortgaged (the value still mortgaged less the homesite's value),
      divided by one less the release premium times the homesite's share of the value still mortgaged. The paydown is
      the principal balance less that most, never below zero, rounded up to the next cent.
      The limit is lowered for an operation leaning on its operating credit: when the member holds an operating line
      in active status drawn above 75 percent of its commitment and no operating line in suspended or matured status,
      it is 5.0 points lower; when the member holds an operating line in suspended or matured status, it is 10.0
      points lower; otherwise it is not changed.
      The limit follows what stays mortgaged: when pasture and recreational land make up more than 30 percent of the
      value that stays mortgaged, it is 5.0 points lower; when irrigated cropland makes up at least 60 percent of that
      value and pasture and recreational land 30 percent or less, it is 5.0 points higher; otherwise it is not changed.
      The limit follows the member's crop insurance: with a crop insurance policy in active status whose indemnity is
      assigned to the association it is 2.5 points higher; with a crop insurance policy in active status and none of
      them assigned it is 1.0 point higher; otherwise it is not changed.
      A split curtailment is added to the paydown according to how the homesite is to be financed, figured on the
      release price at the product's release premium on the principal before the paydown: when the member has no
      Country Home loan application with the association on the homesite, the curtailment is 10 percent of that
      release price; when the member has such an application and the amount applied for is more than 80 percent of
      the homesite value stated in it, the curtailment is 5 percent of that release price; otherwise there is no
      curtailment. The curtailment is added to the shortfall before any rounding, and the sum of the two is rounded up
      to the next cent once; neither part is rounded on its own.
    prerequisite: []
    cross_category:
      - category: operating
        as: branch
        reads: [status, outstanding_principal, commitment_amount]
        note: The operating-leverage factor decides its tier from the member's operating lines.
      - category: cropins
        as: branch
        reads: [status, indemnity_assigned]
        note: The crop-insurance factor decides its tier from the member's crop insurance policies.
      - category: homeloan
        as: branch
        reads: [status, property_parcel_number, original_principal, original_value]
        note: The split-curtailment factor decides its tier from the member's Country Home loan application on the homesite.
    compute:
      - mortgaged_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged')"
      - released_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released')"
      - net_value: "mortgaged_value - released_value"
      - home_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='farmstead') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='farmstead')"
      - stay_value: "net_value - home_value"
      - ops_active: "EXISTS('operating', status='active')"
      - ops_used_pct: "(CFIELD('operating', 'outstanding_principal', status='active') or 0) * 100 / MX(1, (CFIELD('operating', 'commitment_amount', status='active') or 0))"
      - ops_stressed: "EXISTS('operating', status='suspended') or EXISTS('operating', status='matured')"
      - leverage_adj: "(0 - K('leverage_cut_pct')) if (ops_active and ops_used_pct > K('utilization_pct') and not ops_stressed) else ((0 - K('stressed_cut_pct')) if ops_stressed else 0)"
      - grazing_stay: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='pasture') + SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='recreational') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='pasture') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='recreational')"
      - irrigated_stay: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='cropland_irrigated') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='cropland_irrigated')"
      - mix_adj: "(0 - K('grazing_cut_pct')) if grazing_stay * 100 > K('grazing_share_pct') * stay_value else (K('irrigated_lift_pct') if (irrigated_stay * 100 >= K('irrigated_share_pct') * stay_value and grazing_stay * 100 <= K('grazing_share_pct') * stay_value) else 0)"
      - assigned_cover: "EXISTS('cropins', status='active', indemnity_assigned=True)"
      - any_cover: "EXISTS('cropins', status='active')"
      - cover_adj: "K('assigned_cover_lift_pct') if (any_cover and assigned_cover) else (K('unassigned_cover_lift_pct') if (any_cover and not assigned_cover) else 0)"
      - limit_pct: "P('max_ltv_after_release_pct') + leverage_adj + mix_adj + cover_adj"
      - max_principal: "limit_pct / 100 * stay_value / (1 - P('partial_release_premium_pct') / 100 * home_value / net_value)"
      - shortfall: "MX(0, F('principal_balance') - max_principal)"
      - home_parcel: "LATEST('farmland_parcels', 'parcel_number', date_field='action_date', event_type='farmland_parcel_mortgaged', land_use='farmstead')"
      - home_app: "EXISTS('homeloan', status='applied', property_parcel_number=home_parcel)"
      - home_ltv: "(CFIELD('homeloan', 'original_principal', status='applied', property_parcel_number=home_parcel) or 0) * 100 / MX(1, (CFIELD('homeloan', 'original_value', status='applied', property_parcel_number=home_parcel) or 0))"
      - est_release: "P('partial_release_premium_pct') / 100 * F('principal_balance') * home_value / net_value"
      - curtailment: "K('outside_curtailment_share') * est_release if not home_app else (K('thin_home_curtailment_share') * est_release if (home_app and home_ltv > K('home_ltv_pct')) else 0)"
      - cents_due: "(shortfall + curtailment) * 100"
      - result: "RND((int(cents_due) + (1 if cents_due - int(cents_due) > 0.000001 else 0)) / 100, 2)"
    compute_basis:
      mortgaged_value: "the appraised values at mortgage (every parcel mortgaged to the loan less every parcel released from it)"
      released_value: "the appraised values at mortgage (every parcel mortgaged to the loan less every parcel released from it)"
      home_value: "The homesite is the parcel of land use farmstead still mortgaged"
      stay_value: "the value that stays mortgaged (the value still mortgaged less the homesite's value)"
      ops_active: "when the member holds an operating line in active status drawn above 75 percent of its commitment"
      ops_used_pct: "drawn above 75 percent of its commitment"
      ops_stressed: "when the member holds an operating line in suspended or matured status"
      leverage_adj: "when the member holds an operating line in active status drawn above 75 percent of its commitment and no operating line in suspended or matured status, it is 5.0 points lower; when the member holds an operating line in suspended or matured status, it is 10.0 points lower; otherwise it is not changed."
      grazing_stay: "when pasture and recreational land make up more than 30 percent of the value that stays mortgaged"
      irrigated_stay: "when irrigated cropland makes up at least 60 percent of that value"
      mix_adj: "when pasture and recreational land make up more than 30 percent of the value that stays mortgaged, it is 5.0 points lower; when irrigated cropland makes up at least 60 percent of that value and pasture and recreational land 30 percent or less, it is 5.0 points higher; otherwise it is not changed."
      assigned_cover: "with a crop insurance policy in active status whose indemnity is assigned to the association"
      any_cover: "with a crop insurance policy in active status and none of them assigned"
      cover_adj: "with a crop insurance policy in active status whose indemnity is assigned to the association it is 2.5 points higher; with a crop insurance policy in active status and none of them assigned it is 1.0 point higher; otherwise it is not changed."
      limit_pct: "The post-split limit is the product's largest principal after a release, as a percentage of the value still mortgaged."
      max_principal: "so the principal after the paydown may be no more than the limit times the value that stays mortgaged (the value still mortgaged less the homesite's value), divided by one less the release premium times the homesite's share of the value still mortgaged"
      shortfall: "The paydown is the principal balance less that most, never below zero, rounded up to the next cent."
      home_parcel: "The homesite is the parcel of land use farmstead still mortgaged"
      home_app: "when the member has no Country Home loan application with the association on the homesite"
      home_ltv: "the amount applied for is more than 80 percent of the homesite value stated in it"
      est_release: "figured on the release price at the product's release premium on the principal before the paydown"
      curtailment: "when the member has no Country Home loan application with the association on the homesite, the curtailment is 10 percent of that release price; when the member has such an application and the amount applied for is more than 80 percent of the homesite value stated in it, the curtailment is 5 percent of that release price; otherwise there is no curtailment."
      cents_due: "The curtailment is added to the shortfall before any rounding"
      result: "The curtailment is added to the shortfall before any rounding, and the sum of the two is rounded up to the next cent once; neither part is rounded on its own."
    factors:
      - id: limit_by_operating_leverage
        effect: parameter
        decides: leverage_adj
        bindings: [ops_active, ops_used_pct, ops_stressed, leverage_adj]
        ladder:
          - when: "an operating line in active status drawn above 75 percent of its commitment and no operating line suspended or matured"
            value: "minus K('leverage_cut_pct') (5.0 points)"
          - when: "an operating line in suspended or matured status"
            value: "minus K('stressed_cut_pct') (10.0 points)"
          - when: "otherwise"
            value: "0"
        baseline:
          leverage_adj: "0"
        evidence: [cross_category]
        cross_difficulty: operating
      - id: limit_by_collateral_mix
        effect: parameter
        decides: mix_adj
        bindings: [grazing_stay, irrigated_stay, mix_adj]
        ladder:
          - when: "pasture and recreational land more than 30 percent of the value that stays mortgaged"
            value: "minus K('grazing_cut_pct') (5.0 points)"
          - when: "irrigated cropland at least 60 percent of that value and pasture and recreational land 30 percent or less"
            value: "K('irrigated_lift_pct') (5.0 points)"
          - when: "otherwise"
            value: "0"
        baseline:
          mix_adj: "0"
        evidence: [history]
        cross_difficulty: null
      - id: limit_by_crop_insurance
        effect: parameter
        decides: cover_adj
        bindings: [assigned_cover, any_cover, cover_adj]
        ladder:
          - when: "a crop insurance policy in active status with its indemnity assigned to the association"
            value: "K('assigned_cover_lift_pct') (2.5 points)"
          - when: "a crop insurance policy in active status and none assigned"
            value: "K('unassigned_cover_lift_pct') (1.0 point)"
          - when: "otherwise"
            value: "0"
        baseline:
          cover_adj: "0"
        evidence: [cross_category]
        cross_difficulty: cropins
      - id: split_curtailment_by_home_financing
        effect: method
        decides: curtailment
        bindings: [home_parcel, home_app, home_ltv, est_release, curtailment]
        ladder:
          - when: "no Country Home loan application with the association on the homesite"
            method: "10 percent of the release price at the standard premium on the principal before the paydown is added to the paydown"
          - when: "a Country Home loan application with the association on the homesite for more than 80 percent of the homesite value stated in it"
            method: "5 percent of that release price is added to the paydown"
          - when: "otherwise"
            method: "the paydown is the shortfall alone"
        baseline:
          curtailment: "0"
        evidence: [cross_category, history]
        cross_difficulty: homeloan
    baseline:
      rule: >-
        The standard paydown is figured as follows. The post-split limit is the product's largest principal after a
        release, as a percentage of the value still mortgaged. The homesite is the parcel of land use farmstead still
        mortgaged, and its value and the value still mortgaged are the appraised values at mortgage (every parcel
        mortgaged to the loan less every parcel released from it). The release price is counted at the product's
        release premium on the principal left after the paydown, so the principal after the paydown may be no more
        than the limit times the value that stays mortgaged (the value still mortgaged less the homesite's value),
        divided by one less the release premium times the homesite's share of the value still mortgaged. The paydown is
        the principal balance less that most, never below zero, rounded up to the next cent.
      params: [max_ltv_after_release_pct, partial_release_premium_pct]
    inputs:
      history:
        - {table: farmland_parcels, aggregate: sum, field: appraised_value, filters: {event_type: farmland_parcel_mortgaged}}
        - {table: farmland_parcels, aggregate: sum, field: appraised_value, filters: {event_type: farmland_parcel_released}}
        - {table: farmland_parcels, aggregate: latest, field: parcel_number, filters: {event_type: farmland_parcel_mortgaged, land_use: farmstead}}
      cross_category: [operating, cropins, homeloan]
  - id: farmland_ext_farmstead_release_price
    base_policy_refs: [farmland_agg_combined_ltv, farmland_partial_release, farmland_payoff]
    overwrite:
      - base_policy: farmland_partial_release
        superseded_clause: >-
          The release price is the greater of the net sale price or award and partial_release_premium_pct of the parcel's
          share of principal, that share being principal_balance times the parcel's appraised_value divided by the loan's
          collateral_value, rounded to cents; for a farmstead split the release price is the premium amount alone.
        replaced_by: >-
          For a farmstead split the release price is the release premium percentage of the homesite's share of principal,
          rounded to cents, the share being the principal balance times the homesite's value divided by the value still
          mortgaged, and rounded to cents.
    trigger: on_request
    subject: [farmland_parcel_released]
    computes: release_price
    target_tool: release_farmstead_parcel_0569f2e2
    params:
      record_lookback_months: 24
      record_add_pct: 10.0
      repeat_record_add_pct: 15.0
      large_homesite_acres: 10
      mid_homesite_acres: 5
      large_homesite_add_pct: 10.0
      mid_homesite_add_pct: 5.0
      release_lookback_months: 60
      one_release_add_pct: 5.0
      many_release_add_pct: 10.0
      young_loan_months: 48
      seasoned_loan_months: 120
      young_loan_add_pct: 5.0
      mid_loan_add_pct: 2.5
      appraisal_fresh_months: 12
      stale_appraisal_share: 0.9
    rule: >-
      A farmstead split releases the homesite, the parcel of land use farmstead still mortgaged, so that it can secure
      separate home financing, while the other parcels stay mortgaged.
      For a farmstead split the release price is the release premium percentage of the homesite's share of principal,
      rounded to cents, the share being the principal balance times the homesite's value divided by the value still
      mortgaged, and rounded to cents.
      A homesite release is not recorded until the principal standing on the loan, less the release price at the
      product's standard release premium on the homesite's appraised value at mortgage, already sits within the
      post-split loan-to-value limit of the parcels that stay mortgaged.
      The release price is set only once the records carry the late charge owed on every installment that was paid in
      full after its grace period.
      The standard release price uses the product's release premium percentage and the homesite's appraised value at
      mortgage, the value still mortgaged being every parcel mortgaged to the loan less every parcel released from it,
      on the principal balance on the release date.
      The premium percentage is the product's release premium plus four additions, added together. The record
      addition follows the late charges assessed on the loan in the last 24 months: two or more add 15.0 points; one
      adds 10.0 points; none adds nothing. The
      homesite addition follows its deeded acres: 10 acres or more adds 10.0 points; 5 acres or more but less than 10
      adds 5.0 points; a smaller homesite adds none. The release-history addition follows the parcels already released
      from the loan in the last 60 months: one release adds 5.0 points; two or more add 10.0 points; none adds
      nothing. The seasoning addition follows how long ago the loan closed: less than 48 months adds 5.0 points; 48
      months up to 120 months adds 2.5 points; longer adds none.
      The homesite's value follows the newest appraisal on record: when the member has a Country Home loan application
      with the association on the homesite received less than 12 months ago, the homesite is valued at the greater of
      its appraised value at mortgage and the value stated in that application; when such an application was received
      12 or more months ago, at the greater of the appraised value at mortgage and 90 percent of the value stated in
      it; otherwise at its appraised value at mortgage; the value still mortgaged is adjusted by the same difference.
    prerequisite:
      - problem: farmland_ext_split_paydown
        kind: state_gate
        gate: farmland_loans.principal_balance
        form: state
        policy_source: >-
          A homesite release is not recorded until the principal standing on the loan, less the release price at the
          product's standard release premium on the homesite's appraised value at mortgage, already sits within the
          post-split loan-to-value limit of the parcels that stay mortgaged.
        condition: >-
          The farm real estate loan's principal_balance, less the release price at the product's standard premium on it
          with the homesite at its appraised value at mortgage, is no more than the post-split limit percentage of the
          appraised value that stays mortgaged.
        resolved_by: authorize_principal_paydown_4d1911cd
        effect: >-
          The member's principal prepayment lowers principal_balance to within the post-split limit, so the release may
          be recorded; the principal the release price share is figured on is the lower balance.
      - problem: farmland_ext_missed_late_charge
        kind: value_input
        gate: record_add
        form: state
        policy_source: >-
          The release price is set only once the records carry the late charge owed on every installment that was paid in
          full after its grace period.
        condition: >-
          For every installment bill completed after its grace period, a farmland_fee_assessed late_charge entry pointing
          to that bill stands on the loan.
        resolved_by: assess_late_charge_e3cbcc6c
        effect: >-
          The count of late charges assessed in the last 24 months that the record addition reads includes the newly
          assessed charge, which can move the record addition from none to 10.0 points.
    cross_category:
      - category: homeloan
        as: branch
        reads: [status, property_parcel_number, original_value, applied_date]
        note: The homesite-value factor decides its tier from the member's Country Home loan application on the homesite.
    compute:
      - mortgaged_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged')"
      - released_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released')"
      - net_value: "mortgaged_value - released_value"
      - home_value: "SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_mortgaged', land_use='farmstead') - SUM('farmland_parcels', 'appraised_value', event_type='farmland_parcel_released', land_use='farmstead')"
      - home_acres: "SUM('farmland_parcels', 'acres', event_type='farmland_parcel_mortgaged', land_use='farmstead') - SUM('farmland_parcels', 'acres', event_type='farmland_parcel_released', land_use='farmstead')"
      - late_24: "COUNT('farmland_transactions', within_months=K('record_lookback_months'), date_field='effective_date', event_type='farmland_fee_assessed', fee_code='late_charge')"
      - record_add: "K('repeat_record_add_pct') if late_24 >= 2 else (K('record_add_pct') if late_24 == 1 else 0)"
      - size_add: "K('large_homesite_add_pct') if home_acres >= K('large_homesite_acres') else (K('mid_homesite_add_pct') if home_acres >= K('mid_homesite_acres') else 0)"
      - releases_60: "COUNT('farmland_parcels', within_months=K('release_lookback_months'), date_field='action_date', event_type='farmland_parcel_released')"
      - history_add: "K('many_release_add_pct') if releases_60 >= 2 else (K('one_release_add_pct') if releases_60 == 1 else 0)"
      - loan_age: "MONTHS(F('opened_date'), NOW)"
      - seasoning_add: "K('young_loan_add_pct') if loan_age < K('young_loan_months') else (K('mid_loan_add_pct') if loan_age <= K('seasoned_loan_months') else 0)"
      - premium_pct: "P('partial_release_premium_pct') + record_add + size_add + history_add + seasoning_add"
      - home_parcel: "LATEST('farmland_parcels', 'parcel_number', date_field='action_date', event_type='farmland_parcel_mortgaged', land_use='farmstead')"
      - app_value: "CFIELD('homeloan', 'original_value', status='applied', property_parcel_number=home_parcel) or 0"
      - app_months: "MONTHS(CFIELD('homeloan', 'applied_date', status='applied', property_parcel_number=home_parcel) or NOW, NOW)"
      - home_used: "MX(home_value, app_value) if (app_value > 0 and app_months < K('appraisal_fresh_months')) else (MX(home_value, K('stale_appraisal_share') * app_value) if (app_value > 0 and app_months >= K('appraisal_fresh_months')) else home_value)"
      - share: "RND(F('principal_balance') * home_used / (net_value - home_value + home_used), 2)"
      - result: "RND(premium_pct / 100 * share, 2)"
    compute_basis:
      mortgaged_value: "the value still mortgaged being every parcel mortgaged to the loan less every parcel released from it"
      released_value: "the value still mortgaged being every parcel mortgaged to the loan less every parcel released from it"
      home_value: "A farmstead split releases the homesite, the parcel of land use farmstead still mortgaged"
      home_acres: "The homesite addition follows its deeded acres"
      late_24: "The record addition follows the late charges assessed on the loan in the last 24 months"
      record_add: "two or more add 15.0 points; one adds 10.0 points; none adds nothing."
      size_add: "10 acres or more adds 10.0 points; 5 acres or more but less than 10 adds 5.0 points; a smaller homesite adds none."
      releases_60: "The release-history addition follows the parcels already released from the loan in the last 60 months"
      history_add: "one release adds 5.0 points; two or more add 10.0 points; none adds nothing."
      loan_age: "The seasoning addition follows how long ago the loan closed"
      seasoning_add: "less than 48 months adds 5.0 points; 48 months up to 120 months adds 2.5 points; longer adds none."
      premium_pct: "The premium percentage is the product's release premium plus four additions, added together."
      home_parcel: "A farmstead split releases the homesite, the parcel of land use farmstead still mortgaged"
      app_value: "the value stated in that application"
      app_months: "a Country Home loan application with the association on the homesite received less than 12 months ago"
      home_used: "when the member has a Country Home loan application with the association on the homesite received less than 12 months ago, the homesite is valued at the greater of its appraised value at mortgage and the value stated in that application; when such an application was received 12 or more months ago, at the greater of the appraised value at mortgage and 90 percent of the value stated in it; otherwise at its appraised value at mortgage; the value still mortgaged is adjusted by the same difference."
      share: "the share being the principal balance times the homesite's value divided by the value still mortgaged, and rounded to cents"
      result: "For a farmstead split the release price is the release premium percentage of the homesite's share of principal, rounded to cents"
    factors:
      - id: premium_by_late_record
        effect: parameter
        decides: record_add
        bindings: [late_24, record_add]
        ladder:
          - when: "two or more late charges assessed on the loan in the last 24 months"
            value: "K('repeat_record_add_pct') (15.0 points)"
          - when: "one late charge assessed on the loan in the last 24 months"
            value: "K('record_add_pct') (10.0 points)"
          - when: "otherwise"
            value: "0"
        baseline:
          record_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: premium_by_homesite_size
        effect: parameter
        decides: size_add
        bindings: [home_acres, size_add]
        ladder:
          - when: "the homesite is 10 deeded acres or more"
            value: "K('large_homesite_add_pct') (10.0 points)"
          - when: "the homesite is 5 deeded acres or more but less than 10"
            value: "K('mid_homesite_add_pct') (5.0 points)"
          - when: "otherwise"
            value: "0"
        baseline:
          size_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: premium_by_release_history
        effect: parameter
        decides: history_add
        bindings: [releases_60, history_add]
        ladder:
          - when: "two or more parcels released from the loan in the last 60 months"
            value: "K('many_release_add_pct') (10.0 points)"
          - when: "one parcel released from the loan in the last 60 months"
            value: "K('one_release_add_pct') (5.0 points)"
          - when: "otherwise"
            value: "0"
        baseline:
          history_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: premium_by_loan_seasoning
        effect: parameter
        decides: seasoning_add
        bindings: [loan_age, seasoning_add]
        ladder:
          - when: "the loan closed less than 48 months ago"
            value: "K('young_loan_add_pct') (5.0 points)"
          - when: "the loan closed 48 months up to 120 months ago"
            value: "K('mid_loan_add_pct') (2.5 points)"
          - when: "otherwise"
            value: "0"
        baseline:
          seasoning_add: "0"
        evidence: [date]
        cross_difficulty: null
      - id: homesite_value_by_newest_appraisal
        effect: method
        decides: home_used
        bindings: [home_parcel, app_value, app_months, home_used]
        ladder:
          - when: "a Country Home loan application with the association on the homesite received less than 12 months ago"
            method: "the homesite is valued at the greater of its appraised value at mortgage and the value stated in the application, the value still mortgaged adjusted by the same difference"
          - when: "such an application received 12 or more months ago"
            method: "the homesite is valued at the greater of its appraised value at mortgage and 90 percent of the value stated in the application"
          - when: "otherwise"
            method: "the homesite is valued at its appraised value at mortgage"
        baseline:
          home_used: "home_value"
        evidence: [cross_category, date]
        cross_difficulty: homeloan
    baseline:
      rule: >-
        For a farmstead split the release price is the release premium percentage of the homesite's share of principal,
        rounded to cents, the share being the principal balance times the homesite's value divided by the value still
        mortgaged, and rounded to cents. The standard release price uses the product's release premium percentage and the
        homesite's appraised value at mortgage, the value still mortgaged being every parcel mortgaged to the loan less
        every parcel released from it, on the principal balance on the release date.
      params: [partial_release_premium_pct]
    inputs:
      history:
        - {table: farmland_parcels, aggregate: sum, field: appraised_value, filters: {event_type: farmland_parcel_mortgaged}}
        - {table: farmland_parcels, aggregate: sum, field: acres, filters: {event_type: farmland_parcel_mortgaged, land_use: farmstead}}
        - {table: farmland_parcels, aggregate: count, field: parcel_action_id, within_months: 60, filters: {event_type: farmland_parcel_released}}
        - {table: farmland_transactions, aggregate: count, field: txn_id, within_months: 24, filters: {event_type: farmland_fee_assessed, fee_code: late_charge}}
      cross_category: [homeloan]
