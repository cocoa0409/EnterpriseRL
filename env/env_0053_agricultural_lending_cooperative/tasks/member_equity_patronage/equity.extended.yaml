# Policy charter: Member Equities & Patronage (Cottonwood Plains Farm Credit, ACA).
# Every borrower is a member-owner: borrowing requires a stock or participation certificate
# purchase, the cooperative's earnings come back as patronage — part paid in cash each spring and
# part retained as allocated surplus that is revolved in later years — and members may invest in
# preferred stock.
category: equity
display_name: Member Equities & Patronage

binding:
  holding_table: equity_accounts
  event_tables: [equity_transactions]
  intake_tables: [equity_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance: equity_balance, patronage_payable: patronage_payable}

lifecycle:
  states: [subscribed, active, retirement_requested, retired, cancelled]
  transitions:
    - {from: subscribed, to: active, by: system, means: The equity was issued — stock or a participation certificate at the closing of the member's loan, allocated surplus at the first patronage allocation, preferred stock when the purchase funds cleared.}
    - {from: subscribed, to: cancelled, by: system, means: The loan the subscription was made for was declined or withdrawn before closing and the subscription was cancelled.}
    - {from: active, to: retirement_requested, by: user, means: The member, or the estate's representative, asked in writing for the equity to be retired or redeemed.}
    - {from: retirement_requested, to: retired, by: system, means: The board-approved retirement was paid and the holding's balance is zero.}
    - {from: retirement_requested, to: active, by: system, means: The retirement was deferred or declined and the holding remains outstanding.}
    - {from: active, to: retired, by: system, means: The association retired the holding's last balance on its own motion (revolvement of the last allocation year, or offset against a loan in default).}

accounts:
  - key: equity_balance
    unit: USD
    meaning: Par or stated value of the equity held — raised by purchases, retained patronage and reinvested dividends; lowered by retirements, revolvements, redemptions and offsets.
  - key: patronage_payable
    unit: USD
    meaning: Cash patronage declared to the member and not yet paid — raised by cash declarations and by voided payouts; lowered by payouts.

# ---- category-level parameter dictionary ----
parameter_schema:
  par_value_usd: Par or stated value of one share, certificate or allocation unit, USD.
  voting_rights: Boolean; whether the class carries a vote in director elections and bylaw changes.
  votes_per_member: Votes a member holding the class has, regardless of amount held.
  eligible_segments: Member segments (customers.primary_segment) to which the class is issued as borrower equity; preferred and allocated classes are open to any segment.
  required_for_borrowing: Boolean; whether holding the class is a condition of borrowing.
  requirement_pct_of_loans: Required holding as % of the combined original principal or commitment of the member's open loans; 0 = no requirement.
  requirement_cap_usd: Required holding never exceeds this amount, USD; 0 = no requirement.
  purchase_increment_usd: Purchases are made in multiples of this amount, rounded up, USD; 0 = not purchased.
  min_purchase_usd: Smallest single purchase, USD; 0 = not purchased.
  max_holding_usd: Largest balance a member may hold, USD; 0 = no limit.
  purchase_payment_methods: How a purchase may be paid.
  transferable: Boolean; whether the class may be transferred to another member with the association's consent.
  dividend_eligible: Boolean; whether the class earns dividends.
  dividend_rate_pct: Annual dividend rate currently declared by the board, %.
  dividend_frequency: How often dividends are declared and paid.
  dividend_reinvest_allowed: Boolean; whether dividends may be reinvested in additional shares.
  patronage_cash_pct: Share of each patronage allocation declared as cash and booked as payable on this class, % of the allocation.
  patronage_retained_pct: Share of each patronage allocation retained as allocated surplus in this class, % of the allocation.
  qualified_written_notice: Boolean; whether allocations to the class are qualified written notices of allocation (taxable to the member in the year allocated).
  tax_reporting: Tax form issued for amounts on the class.
  min_cash_patronage_payout_usd: Cash patronage below this amount is not paid out but retained in the same class, USD; 0 = not applicable.
  apply_to_loan_available: Boolean; whether cash on this class may be applied to one of the member's loans instead of paid out.
  direct_deposit_available: Boolean; whether payouts may be made by direct deposit.
  check_stale_days: Calendar days after its issue date after which an uncashed association check is void.
  lost_check_wait_business_days: Business days after a check's issue date before a check reported lost may be voided and reissued.
  unclaimed_property_years: Years after a payout check goes stale before uncollected funds are reported to the state as unclaimed property.
  retire_on_loan_payoff: Boolean; whether the class is retired once the member has no open loan.
  retirement_requires_no_open_loans: Boolean; whether retirement on request requires that the member has no loan in any open status.
  retirement_processing_days: Calendar days after the retirement request (or the last loan payoff, for automatic retirements) within which an approved retirement is paid.
  redemption_notice_days: Calendar days of written notice required before a redemption takes effect; 0 = not applicable.
  partial_retirement_allowed: Boolean; whether part of the balance may be retired while the rest stays outstanding.
  min_balance_after_partial_usd: Smallest balance that may remain after a partial redemption, USD; 0 = not applicable.
  revolvement_cycle_years: Target years between allocation and board revolvement of an allocation year; 0 = not revolved.
  estate_early_retirement: Boolean; whether a deceased individual member's estate may have the class retired ahead of schedule.
  estate_retirement_discount_pct: Discount from stated value on an estate's early retirement, %.
  offset_allowed: Boolean; whether the association may apply the class against a loan of the member that is in default.
  offset_trigger_days_past_due: Calendar days a loan must be past due before equity may be applied against it; 0 = not applicable.
  at_risk_disclosure: Boolean; whether the member must acknowledge that the equity is at risk and not insured before issue.
  liquidation_priority_rank: Order of repayment in a liquidation, 1 first.
  issuance_trigger: What causes the class to be issued.
  retirement_at_board_discretion: Boolean; whether every retirement, revolvement or redemption requires board approval.
  statement_frequency: How often the member receives an equity statement.
  rounding_rule: How required purchases are rounded.
  retirement_payment_methods: How retirement or redemption proceeds are paid.
  patronage_eligible_class: Boolean; whether patronage allocations are booked to the class.
  subscription_refund_days: Calendar days after a subscription is cancelled within which a paid purchase is refunded; 0 = not applicable.
  preferred_purchase_settlement_business_days: Business days after the purchase funds clear before preferred shares are issued; 0 = not applicable.
  preferred_max_purchase_per_quarter_usd: Most preferred stock a member may buy in one calendar quarter, USD; 0 = not applicable.
  dividend_record_rule: Which shares earn a quarter's dividend.
  one_holding_per_class: Boolean; whether a member holds at most one holding of the class (all amounts are pooled in it).

