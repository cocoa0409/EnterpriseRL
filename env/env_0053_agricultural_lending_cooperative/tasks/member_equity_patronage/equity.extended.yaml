# ---- data flow (every write is an event) ----
events:
  - type: equity_subscribe
    target: equity_accounts
    mutation: create
    meaning: A member subscribes to an equity class — borrower stock or a participation certificate with a loan application, allocated surplus at the first allocation, or preferred stock on a purchase order.
    grain: One row per member per class (one holding per class).
    fields:
      equity_id: Reference of the holding.
      customer_id: Member.
      variant_name: Official class name.
      patronage_payment_method: Payout method chosen (check unless the member chooses otherwise).
      dividend_option: cash or reinvest for preferred stock, none otherwise.
    triggers: []
  - type: equity_issue
    target: equity_accounts
    mutation: {transition: {from: subscribed, to: active}}
    meaning: The equity is issued.
    grain: One per holding.
    fields:
      issued_date: Issue date.
    triggers: []
  - type: equity_subscription_cancel
    target: equity_accounts
    mutation: {transition: {from: subscribed, to: cancelled}}
    meaning: A subscription is cancelled because the loan it was made for did not close.
    grain: One per cancelled subscription.
    fields:
      retired_date: Cancellation date.
    triggers: []
  - type: equity_retirement_request
    target: equity_accounts
    mutation: {transition: {from: active, to: retirement_requested}}
    meaning: The member, or a deceased member's estate, asks in writing for retirement or redemption.
    grain: One per request.
    fields:
      retirement_requested_date: Date the written request took effect.
    triggers: []
  - type: equity_retirement_complete
    target: equity_accounts
    mutation: {transition: {from: retirement_requested, to: retired}}
    meaning: The requested retirement or redemption is paid and the holding is closed.
    grain: One per holding retired on request.
    fields:
      retired_date: Payment date.
      retirement_requested_date: Cleared to empty.
    triggers: []
  - type: equity_retirement_deferred
    target: equity_accounts
    mutation: {transition: {from: retirement_requested, to: active}}
    meaning: The requested retirement is deferred or declined, or a partial redemption leaves a balance outstanding.
    grain: One per request not completed in full.
    fields:
      retirement_requested_date: Cleared to empty.
    triggers: []
  - type: equity_account_close
    target: equity_accounts
    mutation: {transition: {from: active, to: retired}}
    meaning: The association retires the holding's last balance on its own motion.
    grain: One per holding.
    fields:
      retired_date: Date the balance reached zero.
    triggers: []
  - type: equity_payment_preference
    target: equity_accounts
    mutation: update
    meaning: The member changes how cash patronage, retirement proceeds or preferred dividends are paid.
    grain: One per change.
    fields:
      patronage_payment_method: check, direct_deposit or applied_to_loan.
      deposit_account_last4: Last four digits for direct deposit, else empty.
      apply_to_loan_id: Loan to receive cash patronage, else empty.
      apply_to_loan_line: Line of that loan, else none.
      dividend_option: cash or reinvest for preferred stock, none otherwise.
    triggers: []
  - type: equity_purchase
    target: equity_transactions
    meaning: Equity is bought — borrower stock or a participation certificate at a loan closing, or preferred shares.
    grain: One row per purchase.
    distinguish_by: [effective_date, source_loan_id, amount]
    fields:
      amount: Purchase amount, USD.
      effective_date: Purchase date.
      payment_method: cash_at_closing, deducted_from_proceeds, check or direct_deposit.
      source_loan_id: Loan whose closing required the purchase, else empty.
      source_loan_line: Line of that loan, else none.
    account: equity_balance
    direction: in
    triggers: []
  - type: equity_patronage_retained
    target: equity_transactions
    meaning: The retained part of a patronage allocation earned on one loan is credited to an allocated surplus class.
    grain: One row per loan per patronage year per class.
    distinguish_by: [patronage_year, source_loan_id]
    fields:
      amount: Retained amount, USD.
      effective_date: Board declaration date.
      patronage_year: Year the volume was earned.
      source_loan_id: Loan that earned it.
      source_loan_line: Line of that loan.
      eligible_adb: Eligible average daily balance of the loan for the year, USD.
      patronage_rate_pct: Rate declared for the line and year.
    account: equity_balance
    direction: in
    triggers: []
  - type: equity_patronage_cash_declared
    target: equity_transactions
    meaning: The cash part of a patronage allocation earned on one loan is declared payable.
    grain: One row per loan per patronage year.
    distinguish_by: [patronage_year, source_loan_id]
    fields:
      amount: Cash declared, USD.
      effective_date: Board declaration date.
      patronage_year: Year the volume was earned.
      source_loan_id: Loan that earned it.
      source_loan_line: Line of that loan.
      eligible_adb: Eligible average daily balance, USD.
      patronage_rate_pct: Rate declared.
    account: patronage_payable
    direction: in
    triggers: []
  - type: equity_patronage_cash_paid
    target: equity_transactions
    meaning: Declared cash patronage for a patronage year is paid out, or reissued after a void.
    grain: One row per payout (the whole year's cash on the holding, or a reissue).
    distinguish_by: [patronage_year, payment_method, check_number, source_ref_id]
    fields:
      amount: Amount paid, USD.
      effective_date: Payout date.
      patronage_year: Year paid.
      payment_method: check, direct_deposit or applied_to_loan.
      check_number: Check number for a check, else empty.
      source_loan_id: Loan the cash was applied to, else empty.
      source_loan_line: Line of that loan, else none.
      source_ref_id: For a reissue, the void it replaces; else empty.
    account: patronage_payable
    direction: out
    triggers:
      - event: operating:operating_principal_payment
        when: {payment_method: applied_to_loan, source_loan_line: operating}
        map: {amount: amount, effective_date: effective_date, channel: system}
      - event: equipment:equipment_principal_payment
        when: {payment_method: applied_to_loan, source_loan_line: equipment}
        map: {amount: amount, effective_date: effective_date, payment_purpose: prepayment, channel: system}
      - event: farmland:farmland_principal_payment
        when: {payment_method: applied_to_loan, source_loan_line: farmland}
        map: {amount: amount, effective_date: effective_date, payment_purpose: prepayment, channel: system}
      - event: homeloan:homeloan_principal_payment
        when: {payment_method: applied_to_loan, source_loan_line: homeloan}
        map: {amount: amount, effective_date: effective_date, payment_purpose: curtailment, channel: system}
  - type: equity_patronage_payout_void
    target: equity_transactions
    meaning: A patronage payout is voided (a check reported lost, stale-dated, or a direct deposit rejected) and the amount becomes payable again.
    grain: One row per voided payout.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount of the voided payout, USD.
      effective_date: Void date.
      patronage_year: Year of the voided payout.
      check_number: Number of the voided check, else empty.
      source_ref_id: The payout voided.
    account: patronage_payable
    direction: in
    triggers: []
  - type: equity_retirement
    target: equity_transactions
    meaning: Equity is retired, revolved, redeemed or applied against a defaulted loan.
    grain: One row per retirement action per allocation year.
    distinguish_by: [retirement_reason, patronage_year, effective_date]
    fields:
      amount: Value retired (before any estate discount), USD.
      effective_date: Retirement date.
      retirement_reason: loan_payoff, subscription_cancelled, revolvement, estate, offset_default or redemption.
      patronage_year: Allocation year retired for allocated surplus, else empty.
      payment_method: check or direct_deposit for payouts, none for an offset.
      check_number: Check number for a check payout, else empty.
      source_loan_id: Loan the equity was applied against for an offset, else empty.
      source_loan_line: Line of that loan, else none.
    account: equity_balance
    direction: out
    triggers:
      - event: operating:operating_principal_payment
        when: {retirement_reason: offset_default, source_loan_line: operating}
        map: {amount: amount, effective_date: effective_date, channel: system}
      - event: equipment:equipment_principal_payment
        when: {retirement_reason: offset_default, source_loan_line: equipment}
        map: {amount: amount, effective_date: effective_date, payment_purpose: prepayment, channel: system}
      - event: farmland:farmland_principal_payment
        when: {retirement_reason: offset_default, source_loan_line: farmland}
        map: {amount: amount, effective_date: effective_date, payment_purpose: prepayment, channel: system}
      - event: homeloan:homeloan_principal_payment
        when: {retirement_reason: offset_default, source_loan_line: homeloan}
        map: {amount: amount, effective_date: effective_date, payment_purpose: curtailment, channel: system}
  - type: equity_dividend_reinvested
    target: equity_transactions
    meaning: A quarterly preferred dividend is reinvested in additional preferred shares.
    grain: One row per quarter.
    distinguish_by: [effective_date]
    fields:
      amount: Dividend reinvested, USD.
      effective_date: Dividend payment date.
      payment_method: Always reinvested.
    account: equity_balance
    direction: in
    triggers: []
  - type: equity_dividend_paid
    target: equity_transactions
    meaning: A quarterly preferred dividend is paid in cash.
    grain: One row per quarter.
    distinguish_by: [effective_date]
    fields:
      amount: Dividend paid, USD.
      effective_date: Dividend payment date.
      payment_method: check or direct_deposit.
      check_number: Check number for a check, else empty.
    triggers: []
  - type: equity_check_cleared
    target: equity_transactions
    meaning: The association's bank reports that a payout check was presented and paid.
    grain: One row per check paid by the bank.
    distinguish_by: [source_ref_id]
    fields:
      amount: Amount of the check, USD.
      effective_date: Date the bank paid the check.
      check_number: Check number.
      source_ref_id: The payout row the check was issued on.
    triggers: []

# ---- derived measures ----
measures:
  - id: equity_msr_member_open_loans
    window: The member's portfolio at the date considered.
    measure: Count of the member's loans in an open status — operating_lines in applied, active, suspended or matured; equipment_loans in applied, active, deferred or nonaccrual; farmland_loans in applied, active or nonaccrual; homeloan_loans in applied, active, forbearance or nonaccrual; construction_loans in applied, active, extended or converting.
  - id: equity_msr_combined_loan_amount
    window: The member's open loans at the date considered, including the loan being closed.
    measure: Sum of commitment_amount for operating lines and original_principal for every other loan in an open status.
  - id: equity_msr_borrower_equity_held
    window: The member's holdings at the date considered.
    measure: balance of the member's Class C Participation Certificate, Class A Nonvoting Common Stock or Class B Voting Stock holding in subscribed or active status (0.00 when none).
  - id: equity_msr_year_retained_balance
    window: One allocated surplus holding and one patronage year.
    measure: Sum of equity_patronage_retained rows of that year minus equity_retirement rows of that year on the holding.
  - id: equity_msr_year_cash_payable
    window: One holding and one patronage year.
    measure: Sum of equity_patronage_cash_declared and equity_patronage_payout_void rows of that year minus equity_patronage_cash_paid rows of that year.
  - id: equity_msr_last_loan_closed_date
    window: The member's loans.
    measure: Latest closed_date among the member's loans once none remains in an open status.
  - id: equity_msr_defaulted_loans
    window: The member's loans at the date considered.
    measure: Loans of the member with an installment, interest bill or matured balance unpaid offset_trigger_days_past_due or more calendar days past its due date, with their line.
  - id: equity_msr_quarter_preferred_purchases
    window: The calendar quarter containing the date considered.
    measure: Sum of equity_purchase rows on the member's Class H Preferred Stock holding in the quarter.

# ---- policies ----
policies:
  - id: equity_agg_multi_holding
    subject: [equity_subscribe]
    rule: >-
      A member may hold several equity classes at once — one borrower equity class, the two allocated surplus classes
      and preferred stock — so there is no overall cap on holdings (max_per_customer null); which classes may be held
      together, and how many holdings of one class, is set by equity_agg_class_combination.
    eligibility: []
    params:
      max_per_customer: null

  - id: equity_agg_class_combination
    subject: [equity_subscribe, equity_purchase, equity_retirement]
    rule: >-
      All of a member's amounts in one class are pooled in a single holding, so a second holding of a class the member
      already holds in subscribed, active or retirement_requested status is never opened; new amounts are booked to the
      existing holding. The three borrower equity classes exclude one another: a member holds only the one matching
      customers.primary_segment under eligible_segments. When the member's segment changes (a rural homeowner who starts
      farming in their own right, for example), the old class is retired at par and the same amount is purchased in the
      new class on the same day, with retirement_reason redemption and payment_method deducted_from_proceeds, so the
      requirement under equity_stock_requirement stays met without any cash changing hands. Allocated surplus and
      preferred stock may be held alongside any borrower equity class.
    eligibility:
      - id: one_holding_per_class
        applies_to: [equity_subscribe]
        kind: dedup
        condition: "a second holding of a class the member already holds in subscribed, active or retirement_requested status is never opened"
        evidence_fields: [equity_accounts.customer_id, equity_accounts.variant_name, equity_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_accounts.customer_id, equity_accounts.variant_name]]
          action_bindings: {equity_accounts.customer_id: customer_id, equity_accounts.variant_name: variant_name}
        dedup_contract:
          table: equity_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [subscribed, active, retirement_requested]}
          distinct_fields: []
    params:
      per_tier:
        Class C Participation Certificate: {segments: "=eligible_segments", one_holding: "=one_holding_per_class"}
        Class A Nonvoting Common Stock: {segments: "=eligible_segments", one_holding: "=one_holding_per_class"}
        Class B Voting Stock: {segments: "=eligible_segments", one_holding: "=one_holding_per_class"}
        Qualified Allocated Surplus: {segments: "=eligible_segments", one_holding: "=one_holding_per_class"}
        Nonqualified Allocated Surplus: {segments: "=eligible_segments", one_holding: "=one_holding_per_class"}
        Class H Preferred Stock: {segments: "=eligible_segments", one_holding: "=one_holding_per_class"}

  - id: equity_stock_requirement
    subject: [equity_subscribe, equity_issue, equity_subscription_cancel, equity_purchase, equity_retirement]
    rule: >-
      Every borrower must own borrower equity of the class matching their segment before any loan closes. The required
      holding is the lesser of requirement_cap_usd and requirement_pct_of_loans of the combined original principal (or
      commitment, for operating lines) of all the member's open loans including the one closing
      (equity_msr_combined_loan_amount), rounded up to a whole purchase_increment_usd. At each closing the member buys the
      difference between the required holding and the borrower equity already held (equity_msr_borrower_equity_held), if
      positive, paid in cash at closing or deducted from the loan proceeds; nothing is bought when the existing holding
      already meets the requirement, and the holding never exceeds requirement_cap_usd. A member applying for a first
      loan subscribes with the application; the equity is issued on the closing date, and if the loan is declined or
      withdrawn the subscription is cancelled and anything paid is refunded within subscription_refund_days calendar days
      with retirement_reason subscription_cancelled. Borrower equity is at risk and is retired only under
      equity_retirement_on_payoff, equity_estate_retirement or equity_offset_default.
    eligibility: []
    measures: [equity_msr_combined_loan_amount, equity_msr_borrower_equity_held]
    params:
      per_tier:
        Class C Participation Certificate: {pct: "=requirement_pct_of_loans", cap: "=requirement_cap_usd", increment: "=purchase_increment_usd", refund_days: "=subscription_refund_days", methods: "=purchase_payment_methods"}
        Class A Nonvoting Common Stock: {pct: "=requirement_pct_of_loans", cap: "=requirement_cap_usd", increment: "=purchase_increment_usd", refund_days: "=subscription_refund_days", methods: "=purchase_payment_methods"}
        Class B Voting Stock: {pct: "=requirement_pct_of_loans", cap: "=requirement_cap_usd", increment: "=purchase_increment_usd", refund_days: "=subscription_refund_days", methods: "=purchase_payment_methods"}
        Qualified Allocated Surplus: {pct: "=requirement_pct_of_loans", cap: "=requirement_cap_usd", increment: "=purchase_increment_usd", refund_days: "=subscription_refund_days", methods: "=purchase_payment_methods"}
        Nonqualified Allocated Surplus: {pct: "=requirement_pct_of_loans", cap: "=requirement_cap_usd", increment: "=purchase_increment_usd", refund_days: "=subscription_refund_days", methods: "=purchase_payment_methods"}
        Class H Preferred Stock: {pct: "=requirement_pct_of_loans", cap: "=requirement_cap_usd", increment: "=purchase_increment_usd", refund_days: "=subscription_refund_days", methods: "=purchase_payment_methods"}
    formula:
      required_holding: min(requirement_cap_usd, equity_msr_combined_loan_amount * requirement_pct_of_loans / 100)
      purchase_needed: max(0, required_holding - equity_msr_borrower_equity_held)

  - id: equity_patronage_allocation
    subject: [equity_patronage_retained, equity_patronage_cash_declared, equity_subscribe, equity_issue]
    rule: >-
      Each December the board declares patronage for the calendar year on the member's patronage-eligible loan volume. A
      loan earns patronage for a year when it carried interest-bearing principal in that year; a loan in nonaccrual status
      on December 31 of the year, an EquipDirect Dealer Contract (which already carries a dealer-supported rate) and the
      interim period of a construction loan earn none. For each earning loan the allocation is its eligible average daily
      balance for the year (eligible_adb, from the year-end patronage run) times the rate declared for its line and year in
      patronage_rates_by_year, divided by 100 and rounded to cents. The allocation is split by class: patronage_cash_pct of
      it is declared as cash payable on the member's Qualified Allocated Surplus holding, patronage_retained_pct of it is
      retained in Qualified Allocated Surplus, and the remainder — patronage_retained_pct of Nonqualified Allocated
      Surplus, absorbing any rounding cent — is retained in Nonqualified Allocated Surplus, each part rounded to cents
      and booked per loan with the loan's eligible_adb and rate, effective on the declaration date of the year. A member
      without an allocated surplus holding is subscribed to and issued one on the declaration date. When the member's
      allocations for the year total less than min_member_allocation_usd, nothing is allocated. A member whose loans have
      all been repaid still receives the allocation earned while they borrowed.
    eligibility: []
    params:
      patronage_rates_by_year:
        "2024": {operating: 1.050, equipment: 1.050, farmland: 1.050, homeloan: 0.500, construction: 0.000}
        "2025": {operating: 1.100, equipment: 1.100, farmland: 1.100, homeloan: 0.550, construction: 0.000}
      declaration_dates: {"2024": "2024-12-17", "2025": "2025-12-16"}
      excluded_products: [EquipDirect Dealer Contract]
      min_member_allocation_usd: 5.00
      per_tier:
        Class C Participation Certificate: {cash_pct: "=patronage_cash_pct", retained_pct: "=patronage_retained_pct", eligible: "=patronage_eligible_class", qualified: "=qualified_written_notice"}
        Class A Nonvoting Common Stock: {cash_pct: "=patronage_cash_pct", retained_pct: "=patronage_retained_pct", eligible: "=patronage_eligible_class", qualified: "=qualified_written_notice"}
        Class B Voting Stock: {cash_pct: "=patronage_cash_pct", retained_pct: "=patronage_retained_pct", eligible: "=patronage_eligible_class", qualified: "=qualified_written_notice"}
        Qualified Allocated Surplus: {cash_pct: "=patronage_cash_pct", retained_pct: "=patronage_retained_pct", eligible: "=patronage_eligible_class", qualified: "=qualified_written_notice"}
        Nonqualified Allocated Surplus: {cash_pct: "=patronage_cash_pct", retained_pct: "=patronage_retained_pct", eligible: "=patronage_eligible_class", qualified: "=qualified_written_notice"}
        Class H Preferred Stock: {cash_pct: "=patronage_cash_pct", retained_pct: "=patronage_retained_pct", eligible: "=patronage_eligible_class", qualified: "=qualified_written_notice"}
    formula:
      allocation: round(eligible_adb * patronage_rate_pct / 100, 2)
      class_share: round(allocation * (patronage_cash_pct + patronage_retained_pct) / 100, 2)

  - id: equity_patronage_payout
    subject: [equity_patronage_cash_paid, equity_patronage_payout_void, equity_check_cleared]
    rule: >-
      Cash patronage declared for a year is paid on that year's payment date in patronage_payment_dates, in one payout per
      Qualified Allocated Surplus holding for the whole year's cash (equity_msr_year_cash_payable), by the
      patronage_payment_method on the holding: a check, a direct deposit to the account ending in deposit_account_last4,
      or a principal payment applied to apply_to_loan_id. A payment method change recorded later than
      preference_cutoff_days calendar days before the payment date applies from the next payout. Cash applied to a loan
      is booked on the loan as a principal payment through the trigger; when that loan is no longer in an open status on
      the payment date, the cash is paid by check instead. A year's cash below min_cash_patronage_payout_usd is not paid
      out but retained in Qualified Allocated Surplus. A check outstanding more than check_stale_days calendar days after
      its issue date is voided by the association and the amount becomes payable again. A check the member reports lost
      may be voided only after lost_check_wait_business_days business days have passed since its issue date, counting
      Monday to Friday excluding Federal Reserve holidays with the issue date as day 0. A check may be voided only when
      the bank has not reported it paid (no equity_check_cleared row for that payout). A voided payout may be voided only
      once, and is reissued once, as a new payout pointing to the void through source_ref_id, by the method on the
      holding at reissue; a check the bank paid is never reissued, and a member who says they never received the money
      for a cleared check is referred to a loan officer. Payable amounts unclaimed for unclaimed_property_years years
      after a check goes stale are reported to the state as unclaimed property.
    eligibility:
      - id: lost_check_wait
        applies_to: [equity_patronage_payout_void]
        kind: time
        condition: "A check the member reports lost may be voided only after lost_check_wait_business_days business days have passed since its issue date"
        evidence_fields: [equity_transactions.effective_date, equity_transactions.eq_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_transactions.eq_txn_id]]
          action_bindings: {equity_transactions.eq_txn_id: source_ref_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "its issue date"
          anchor_source: equity_transactions.effective_date
          relation: not_before
          duration_source: variants.lost_check_wait_business_days
          unit: business_days
          counting_rule: "counting Monday to Friday excluding Federal Reserve holidays with the issue date as day 0"
          boundary: exclusive
      - id: check_not_cleared
        applies_to: [equity_patronage_payout_void]
        kind: authorization
        condition: "A check may be voided only when the bank has not reported it paid (no equity_check_cleared row for that payout)."
        evidence_fields: [equity_transactions.source_ref_id, equity_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_transactions.source_ref_id]]
          action_bindings: {equity_transactions.source_ref_id: source_ref_id}
      - id: void_once
        applies_to: [equity_patronage_payout_void]
        kind: dedup
        condition: "A voided payout may be voided only once"
        evidence_fields: [equity_transactions.source_ref_id, equity_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_transactions.source_ref_id]]
          action_bindings: {equity_transactions.source_ref_id: source_ref_id}
        dedup_contract:
          table: equity_transactions
          mode: separate_record
          object_bindings: {source_ref_id: source_ref_id}
          duplicate_filters: {event_type: [equity_patronage_payout_void]}
          distinct_fields: []
    measures: [equity_msr_year_cash_payable]
    params:
      patronage_payment_dates: {"2024": "2025-03-14", "2025": "2026-03-13"}
      preference_cutoff_days: 15
      per_tier:
        Class C Participation Certificate: {min_payout: "=min_cash_patronage_payout_usd", stale_days: "=check_stale_days", lost_wait: "=lost_check_wait_business_days", unclaimed_years: "=unclaimed_property_years", apply_to_loan: "=apply_to_loan_available"}
        Class A Nonvoting Common Stock: {min_payout: "=min_cash_patronage_payout_usd", stale_days: "=check_stale_days", lost_wait: "=lost_check_wait_business_days", unclaimed_years: "=unclaimed_property_years", apply_to_loan: "=apply_to_loan_available"}
        Class B Voting Stock: {min_payout: "=min_cash_patronage_payout_usd", stale_days: "=check_stale_days", lost_wait: "=lost_check_wait_business_days", unclaimed_years: "=unclaimed_property_years", apply_to_loan: "=apply_to_loan_available"}
        Qualified Allocated Surplus: {min_payout: "=min_cash_patronage_payout_usd", stale_days: "=check_stale_days", lost_wait: "=lost_check_wait_business_days", unclaimed_years: "=unclaimed_property_years", apply_to_loan: "=apply_to_loan_available"}
        Nonqualified Allocated Surplus: {min_payout: "=min_cash_patronage_payout_usd", stale_days: "=check_stale_days", lost_wait: "=lost_check_wait_business_days", unclaimed_years: "=unclaimed_property_years", apply_to_loan: "=apply_to_loan_available"}
        Class H Preferred Stock: {min_payout: "=min_cash_patronage_payout_usd", stale_days: "=check_stale_days", lost_wait: "=lost_check_wait_business_days", unclaimed_years: "=unclaimed_property_years", apply_to_loan: "=apply_to_loan_available"}

  - id: equity_retirement_on_payoff
    subject: [equity_retirement, equity_account_close]
    rule: >-
      Borrower equity (a class with retire_on_loan_payoff true) is retired at par once the member has no loan left in an
      open status. Borrower equity may be retired on payoff only when the member has no loan in an open status in any
      product line (equity_msr_member_open_loans is 0). The retirement is made within retirement_processing_days calendar
      days after the closed date of the member's last open loan (equity_msr_last_loan_closed_date), by the holding's
      payment method (a holding set to applied_to_loan is paid by check), with retirement_reason loan_payoff, and the
      holding is then closed. While any loan remains open, even one in a different product line, nothing is retired, and
      a member who pays off one of several loans keeps the whole borrower equity. Allocated surplus is never retired on
      payoff; it waits for revolvement or estate retirement. Retirement remains at the board's discretion and is
      suspended for every member while the board has suspended retirements to protect capital.
    eligibility:
      - id: no_open_loans_for_payoff_retirement
        applies_to: [equity_retirement]
        kind: authorization
        condition: "Borrower equity may be retired on payoff only when the member has no loan in an open status in any product line (equity_msr_member_open_loans is 0)."
        evidence_fields: [operating_lines.status, equipment_loans.status, farmland_loans.status, homeloan_loans.status, construction_loans.status, equity_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_accounts.customer_id]]
          action_bindings: {equity_accounts.customer_id: customer_id}
    measures: [equity_msr_member_open_loans, equity_msr_last_loan_closed_date]
    params:
      per_tier:
        Class C Participation Certificate: {on_payoff: "=retire_on_loan_payoff", days: "=retirement_processing_days", methods: "=retirement_payment_methods"}
        Class A Nonvoting Common Stock: {on_payoff: "=retire_on_loan_payoff", days: "=retirement_processing_days", methods: "=retirement_payment_methods"}
        Class B Voting Stock: {on_payoff: "=retire_on_loan_payoff", days: "=retirement_processing_days", methods: "=retirement_payment_methods"}
        Qualified Allocated Surplus: {on_payoff: "=retire_on_loan_payoff", days: "=retirement_processing_days", methods: "=retirement_payment_methods"}
        Nonqualified Allocated Surplus: {on_payoff: "=retire_on_loan_payoff", days: "=retirement_processing_days", methods: "=retirement_payment_methods"}
        Class H Preferred Stock: {on_payoff: "=retire_on_loan_payoff", days: "=retirement_processing_days", methods: "=retirement_payment_methods"}

  - id: equity_revolvement
    subject: [equity_retirement, equity_account_close]
    rule: >-
      Allocated surplus is revolved only by board declaration. Each program in revolvement_programs retires in cash, on
      its payment date, the whole retained balance (equity_msr_year_retained_balance) of the listed allocation years on
      every Qualified and Nonqualified Allocated Surplus holding, one retirement row per holding per year with
      retirement_reason revolvement and the year in patronage_year, paid by the holding's payment method (a holding set to
      applied_to_loan is paid by check). Years not listed are not revolved, whatever their age; revolvement_cycle_years is
      the board's target, not an entitlement. A holding whose last balance is revolved is closed. Revolvement is paid to
      members and former members alike.
    eligibility: []
    measures: [equity_msr_year_retained_balance]
    params:
      revolvement_programs:
        - {program_year: 2025, payment_date: "2025-03-14", qualified_years: ["2019"], nonqualified_years: ["2014"]}
        - {program_year: 2026, payment_date: "2026-03-13", qualified_years: ["2020"], nonqualified_years: ["2015"]}
      per_tier:
        Class C Participation Certificate: {cycle_years: "=revolvement_cycle_years", partial: "=partial_retirement_allowed"}
        Class A Nonvoting Common Stock: {cycle_years: "=revolvement_cycle_years", partial: "=partial_retirement_allowed"}
        Class B Voting Stock: {cycle_years: "=revolvement_cycle_years", partial: "=partial_retirement_allowed"}
        Qualified Allocated Surplus: {cycle_years: "=revolvement_cycle_years", partial: "=partial_retirement_allowed"}
        Nonqualified Allocated Surplus: {cycle_years: "=revolvement_cycle_years", partial: "=partial_retirement_allowed"}
        Class H Preferred Stock: {cycle_years: "=revolvement_cycle_years", partial: "=partial_retirement_allowed"}

  - id: equity_estate_retirement
    subject: [equity_retirement_request, equity_retirement, equity_retirement_complete, equity_retirement_deferred]
    rule: >-
      When an individual member dies, the estate's personal representative may ask in writing for early retirement of the
      member's equity, registered as an estate_retirement request for each holding. An estate retirement may be paid only
      when the estate retirement request for that holding has been approved by the association after receipt of the death
      certificate and letters of appointment. Allocated surplus of every year is then retired at once, the
      Nonqualified Allocated Surplus at its stated value less estate_retirement_discount_pct (the discounted amount is
      paid; the full stated value is retired), and borrower equity at par only when the member's loans have been repaid or
      assumed by another member; preferred stock is redeemed at par. Payment is made within retirement_processing_days
      calendar days of approval, by check to the estate. A request that is declined, or borrower equity whose loans are
      still open, returns the holding to active status. Joint and entity members have no estate retirement.
    eligibility:
      - id: estate_request_approved
        applies_to: [equity_retirement, equity_retirement_complete]
        kind: authorization
        condition: "An estate retirement may be paid only when the estate retirement request for that holding has been approved by the association after receipt of the death certificate and letters of appointment."
        evidence_fields: [equity_requests.equity_id, equity_requests.request_type, equity_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_requests.equity_id]]
          action_bindings: {equity_requests.equity_id: equity_id}
    params:
      per_tier:
        Class C Participation Certificate: {allowed: "=estate_early_retirement", discount: "=estate_retirement_discount_pct", days: "=retirement_processing_days"}
        Class A Nonvoting Common Stock: {allowed: "=estate_early_retirement", discount: "=estate_retirement_discount_pct", days: "=retirement_processing_days"}
        Class B Voting Stock: {allowed: "=estate_early_retirement", discount: "=estate_retirement_discount_pct", days: "=retirement_processing_days"}
        Qualified Allocated Surplus: {allowed: "=estate_early_retirement", discount: "=estate_retirement_discount_pct", days: "=retirement_processing_days"}
        Nonqualified Allocated Surplus: {allowed: "=estate_early_retirement", discount: "=estate_retirement_discount_pct", days: "=retirement_processing_days"}
        Class H Preferred Stock: {allowed: "=estate_early_retirement", discount: "=estate_retirement_discount_pct", days: "=retirement_processing_days"}
    formula:
      estate_payout: round(amount * (100 - estate_retirement_discount_pct) / 100, 2)

  - id: equity_offset_default
    subject: [equity_retirement]
    rule: >-
      When a loan of the member has been past due offset_trigger_days_past_due calendar days or more
      (equity_msr_defaulted_loans) and the credit officer has charged it off or begun collection, the association may
      apply the member's equity of a class with offset_allowed true against that loan, borrower equity first, then
      Qualified and then Nonqualified Allocated Surplus, oldest allocation year first, up to the amount owed on the
      loan. Each offset is a retirement row with retirement_reason offset_default naming the loan and its line, which
      books a principal payment on that loan through the trigger. Preferred stock is never offset. An offset is never
      made at a member's request and never against a loan that is merely late.
    eligibility: []
    measures: [equity_msr_defaulted_loans]
    params:
      per_tier:
        Class C Participation Certificate: {allowed: "=offset_allowed", trigger_days: "=offset_trigger_days_past_due", priority: "=liquidation_priority_rank"}
        Class A Nonvoting Common Stock: {allowed: "=offset_allowed", trigger_days: "=offset_trigger_days_past_due", priority: "=liquidation_priority_rank"}
        Class B Voting Stock: {allowed: "=offset_allowed", trigger_days: "=offset_trigger_days_past_due", priority: "=liquidation_priority_rank"}
        Qualified Allocated Surplus: {allowed: "=offset_allowed", trigger_days: "=offset_trigger_days_past_due", priority: "=liquidation_priority_rank"}
        Nonqualified Allocated Surplus: {allowed: "=offset_allowed", trigger_days: "=offset_trigger_days_past_due", priority: "=liquidation_priority_rank"}
        Class H Preferred Stock: {allowed: "=offset_allowed", trigger_days: "=offset_trigger_days_past_due", priority: "=liquidation_priority_rank"}

  - id: equity_preferred_stock
    subject: [equity_subscribe, equity_purchase, equity_dividend_reinvested, equity_dividend_paid, equity_retirement_request, equity_retirement, equity_retirement_complete, equity_retirement_deferred]
    rule: >-
      Class H Preferred Stock is sold only to members in good standing who acknowledge the offering circular. A purchase
      must be at least min_purchase_usd in multiples of purchase_increment_usd, may not take the holding above
      max_holding_usd, and purchases in one calendar quarter may not exceed preferred_max_purchase_per_quarter_usd
      (equity_msr_quarter_preferred_purchases); shares are issued preferred_purchase_settlement_business_days business
      days after the funds clear. Dividends are declared quarterly at dividend_rate_pct per year on the average daily
      shares held in the quarter and paid on the 15th day after quarter end, in cash or reinvested according to
      dividend_option. A redemption is requested in writing as a preferred_redemption request for an amount or the whole
      holding. A redemption takes effect no earlier than redemption_notice_days calendar days after the written
      redemption request, counted with the request date as day 0, the last notice day itself qualifying. It is paid at
      par, subject to board approval; a partial redemption must leave at least min_balance_after_partial_usd, and a
      redemption that would leave less is made for the whole holding. Preferred stock is not insured and is not a deposit.
    eligibility:
      - id: redemption_notice_elapsed
        applies_to: [equity_retirement, equity_retirement_complete, equity_retirement_deferred]
        kind: time
        condition: "A redemption takes effect no earlier than redemption_notice_days calendar days after the written redemption request"
        evidence_fields: [equity_accounts.retirement_requested_date, equity_accounts.equity_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_accounts.equity_id]]
          action_bindings: {equity_accounts.equity_id: equity_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the written redemption request"
          anchor_source: equity_accounts.retirement_requested_date
          relation: not_before
          duration_source: variants.redemption_notice_days
          unit: calendar_days
          counting_rule: "counted with the request date as day 0, the last notice day itself qualifying"
          boundary: inclusive
    measures: [equity_msr_quarter_preferred_purchases]
    params:
      per_tier:
        Class C Participation Certificate: {min: "=min_purchase_usd", increment: "=purchase_increment_usd", max: "=max_holding_usd", per_quarter: "=preferred_max_purchase_per_quarter_usd", rate: "=dividend_rate_pct", notice: "=redemption_notice_days", min_after: "=min_balance_after_partial_usd"}
        Class A Nonvoting Common Stock: {min: "=min_purchase_usd", increment: "=purchase_increment_usd", max: "=max_holding_usd", per_quarter: "=preferred_max_purchase_per_quarter_usd", rate: "=dividend_rate_pct", notice: "=redemption_notice_days", min_after: "=min_balance_after_partial_usd"}
        Class B Voting Stock: {min: "=min_purchase_usd", increment: "=purchase_increment_usd", max: "=max_holding_usd", per_quarter: "=preferred_max_purchase_per_quarter_usd", rate: "=dividend_rate_pct", notice: "=redemption_notice_days", min_after: "=min_balance_after_partial_usd"}
        Qualified Allocated Surplus: {min: "=min_purchase_usd", increment: "=purchase_increment_usd", max: "=max_holding_usd", per_quarter: "=preferred_max_purchase_per_quarter_usd", rate: "=dividend_rate_pct", notice: "=redemption_notice_days", min_after: "=min_balance_after_partial_usd"}
        Nonqualified Allocated Surplus: {min: "=min_purchase_usd", increment: "=purchase_increment_usd", max: "=max_holding_usd", per_quarter: "=preferred_max_purchase_per_quarter_usd", rate: "=dividend_rate_pct", notice: "=redemption_notice_days", min_after: "=min_balance_after_partial_usd"}
        Class H Preferred Stock: {min: "=min_purchase_usd", increment: "=purchase_increment_usd", max: "=max_holding_usd", per_quarter: "=preferred_max_purchase_per_quarter_usd", rate: "=dividend_rate_pct", notice: "=redemption_notice_days", min_after: "=min_balance_after_partial_usd"}

  - id: equity_payment_preference_rule
    subject: [equity_payment_preference]
    rule: >-
      The member chooses how payouts on a holding are made, only on their own instruction. A payment preference may be
      changed only while the holding is in subscribed, active or retirement_requested status. Direct deposit requires
      the last four digits of the checking account, recorded exactly as the member gives them. applied_to_loan is
      available only on a class with apply_to_loan_available true, and the chosen loan must be one of the member's own
      operating lines, equipment loans, farm real estate loans or Country Home loans in an open status, named with its
      line. dividend_option may be set only on preferred stock. Changes take effect for payouts as set out in
      equity_patronage_payout.
    eligibility:
      - id: preference_open_holding
        applies_to: [equity_payment_preference]
        kind: state
        condition: "A payment preference may be changed only while the holding is in subscribed, active or retirement_requested status."
        evidence_fields: [equity_accounts.status, equity_accounts.equity_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[equity_accounts.equity_id]]
          action_bindings: {equity_accounts.equity_id: equity_id}
        state_contract:
          field: equity_accounts.status
          allowed: [subscribed, active, retirement_requested]
    params:
      per_tier:
        Class C Participation Certificate: {direct_deposit: "=direct_deposit_available", apply_to_loan: "=apply_to_loan_available", reinvest: "=dividend_reinvest_allowed"}
        Class A Nonvoting Common Stock: {direct_deposit: "=direct_deposit_available", apply_to_loan: "=apply_to_loan_available", reinvest: "=dividend_reinvest_allowed"}
        Class B Voting Stock: {direct_deposit: "=direct_deposit_available", apply_to_loan: "=apply_to_loan_available", reinvest: "=dividend_reinvest_allowed"}
        Qualified Allocated Surplus: {direct_deposit: "=direct_deposit_available", apply_to_loan: "=apply_to_loan_available", reinvest: "=dividend_reinvest_allowed"}
        Nonqualified Allocated Surplus: {direct_deposit: "=direct_deposit_available", apply_to_loan: "=apply_to_loan_available", reinvest: "=dividend_reinvest_allowed"}
        Class H Preferred Stock: {direct_deposit: "=direct_deposit_available", apply_to_loan: "=apply_to_loan_available", reinvest: "=dividend_reinvest_allowed"}

# ============================================================================
# extended_policies — member_equity_patronage
# ============================================================================
extended_policies:
  - id: equity_ext_preferred_dividend_reinvestment
    base_policy_refs: [equity_preferred_stock]
    overwrite:
      - base_policy: equity_preferred_stock
        superseded_clause: >-
          Dividends are declared quarterly at dividend_rate_pct per year on the average daily shares held in the quarter
          and paid on the 15th day after quarter end, in cash or reinvested according to dividend_option.
        replaced_by: >-
          The quarterly preferred dividend equals the dividend share basis times the dividend annual rate, divided by 100,
          times the days in the declared quarter, divided by 365, rounded half up to the cent once, on the final figure only.
    trigger: state_due
    subject: [equity_dividend_reinvested]
    computes: amount
    target_tool: book_preferred_dividend_reinvestment_5d71129c
    params:
      declared_quarter_start: "2026-04-01"
      declared_quarter_end: "2026-06-30"
      declared_quarter_days: 91
      declared_quarter_payment_date: "2026-07-15"
      bracket_mid_usd: 50000.0
      bracket_high_usd: 100000.0
      rate_mid_pct: 4.375
      rate_high_pct: 4.5
      loyalty_months: 60
      loyalty_quarters: 4
      loyalty_full_pct: 0.10
      loyalty_part_pct: 0.05
      relationship_threshold_usd: 250000.0
      relationship_high_pct: 0.15
      relationship_low_pct: 0.05
    rule: >
      A Class H Preferred Stock holding whose dividend option is reinvest receives each declared quarter's dividend as
      additional preferred shares, booked as one reinvested dividend entry effective on the declared payment date of that
      quarter (the 15th day after the quarter end); the board's current declaration covers the quarter from
      declared_quarter_start to declared_quarter_end, declared_quarter_days days, paid on declared_quarter_payment_date.
      The quarterly preferred dividend equals the dividend share basis times the dividend annual rate, divided by 100,
      times the days in the declared quarter, divided by 365, rounded half up to the cent once, on the final figure only.
      The dividend share basis is the shares the holding carried at the end of the declared quarter, that is the holding's
      purchases plus its reinvested dividends less its retirements, at par of 1.00 per share.
      The dividend annual rate is the declared dividend_rate_pct per year.
      Where the rules below set a dividend bracket rate, a dividend loyalty premium or a dividend relationship premium,
      the dividend annual rate is instead the dividend bracket rate plus the dividend loyalty premium plus the dividend
      relationship premium, all in percentage points, summed into one annual rate before it is applied; the parts never
      act on one another.
      Where the holding's latest entries show share activity inside the declared quarter, the dividend share basis is
      adjusted so that shares earn only for the days they were held: when the holding's latest purchase is dated inside the declared quarter and its latest retirement is
      also dated inside it, the basis is the quarter-end shares less that purchase times the days of the quarter before
      the purchase date divided by the days in the quarter, plus that retirement times the days of the quarter before the
      retirement date divided by the days in the quarter; when only the latest purchase is dated inside the declared
      quarter, the basis is the quarter-end shares less that purchase times the days of the quarter before the purchase
      date divided by the days in the quarter; when only the latest retirement is dated inside the declared quarter, the
      basis is the quarter-end shares plus that retirement times the days of the quarter before the retirement date
      divided by the days in the quarter; otherwise the basis is the quarter-end shares; the days of the quarter before a
      date are counted from the quarter's first day, inclusive, to that date, exclusive.
      The dividend bracket rate is read against the dividend share basis: a basis of bracket_high_usd or more carries
      rate_high_pct, a basis of bracket_mid_usd or more but below bracket_high_usd carries rate_mid_pct, and a basis below
      bracket_mid_usd carries dividend_rate_pct.
      The dividend loyalty premium rests on the holding's age and its reinvestment record: a holding issued at least
      loyalty_months whole months before today and carrying at least loyalty_quarters reinvested dividend entries earns
      loyalty_full_pct; a holding that meets exactly one of those two conditions earns loyalty_part_pct; a holding that
      meets neither earns no premium.
      The dividend relationship premium rests on the member's farm real estate borrowing with the association: a member
      with an active farm real estate loan whose principal balance is relationship_threshold_usd or more earns
      relationship_high_pct; a member with an active farm real estate loan whose principal balance is below
      relationship_threshold_usd earns relationship_low_pct; a member with no active farm real estate loan earns no premium.
      The quarterly preferred dividend is fixed only after the holding carries a cancellation entry for every share it
      held above the largest balance a member may hold.
      A holding whose dividend option is cash is paid the dividend in cash and is outside this rule; a holding already
      carrying a reinvested dividend entry for the declared payment date has nothing further booked.
    prerequisite:
      - problem: equity_ext_preferred_holding_excess_refund
        kind: value_input
        gate: div_basis
        form: state
        policy_source: >-
          The quarterly preferred dividend is fixed only after the holding carries a cancellation entry for every share
          it held above the largest balance a member may hold.
        condition: >-
          The Class H Preferred Stock holding carries a subscription-cancelled entry, dated as of the purchase that took
          it over the maximum, for every share above the largest balance a member may hold.
        resolved_by: refund_preferred_holding_excess_154bc05b
        effect: >-
          Once the cancellation entry stands inside the declared quarter, the latest retirement is dated inside it, so
          the dividend share basis adds back that cancellation only for the days before it and the quarter-end shares
          fall by the cancelled amount; the dividend share basis and the dividend change.
    cross_category:
      - category: farmland
        as: branch
        reads: [status, principal_balance]
        note: the dividend relationship premium tier is read from the member's active farm real estate loan principal balance.
    compute:
      - div_purchased: "SUM('equity_transactions', 'amount', event_type='equity_purchase')"
      - div_reinvested: "SUM('equity_transactions', 'amount', event_type='equity_dividend_reinvested')"
      - div_retired: "SUM('equity_transactions', 'amount', event_type='equity_retirement')"
      - div_end_shares: "div_purchased + div_reinvested - div_retired"
      - div_last_purchase_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_purchase') or ''"
      - div_last_purchase_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_purchase') or 0"
      - div_last_retire_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_retirement') or ''"
      - div_last_retire_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_retirement') or 0"
      - div_purchase_in_q: "K('declared_quarter_start') <= div_last_purchase_date <= K('declared_quarter_end')"
      - div_retire_in_q: "K('declared_quarter_start') <= div_last_retire_date <= K('declared_quarter_end')"
      - div_basis: "(div_end_shares - div_last_purchase_amt * DAYS(K('declared_quarter_start'), div_last_purchase_date) / K('declared_quarter_days') + div_last_retire_amt * DAYS(K('declared_quarter_start'), div_last_retire_date) / K('declared_quarter_days')) if (div_purchase_in_q and div_retire_in_q) else ((div_end_shares - div_last_purchase_amt * DAYS(K('declared_quarter_start'), div_last_purchase_date) / K('declared_quarter_days')) if (div_purchase_in_q and not div_retire_in_q) else ((div_end_shares + div_last_retire_amt * DAYS(K('declared_quarter_start'), div_last_retire_date) / K('declared_quarter_days')) if (div_retire_in_q and not div_purchase_in_q) else div_end_shares))"
      - div_bracket_rate: "K('rate_high_pct') if div_basis >= K('bracket_high_usd') else (K('rate_mid_pct') if div_basis >= K('bracket_mid_usd') else P('dividend_rate_pct'))"
      - div_months_held: "MONTHS(F('issued_date'), NOW)"
      - div_reinvest_count: "COUNT('equity_transactions', event_type='equity_dividend_reinvested')"
      - div_loyalty: "K('loyalty_full_pct') if (div_months_held >= K('loyalty_months') and div_reinvest_count >= K('loyalty_quarters')) else (K('loyalty_part_pct') if (div_months_held >= K('loyalty_months') or div_reinvest_count >= K('loyalty_quarters')) else 0)"
      - div_farm_principal: "CFIELD('farmland', 'principal_balance', status='active') or 0"
      - div_relationship: "K('relationship_high_pct') if div_farm_principal >= K('relationship_threshold_usd') else (K('relationship_low_pct') if div_farm_principal > 0 else 0)"
      - div_rate: "div_bracket_rate + div_loyalty + div_relationship"
      - result: "RND(div_basis * div_rate / 100 * K('declared_quarter_days') / 365, 2)"
    compute_basis:
      div_purchased: "The dividend share basis is the shares the holding carried at the end of the declared quarter, that is the holding's purchases plus its reinvested dividends less its retirements, at par of 1.00 per share."
      div_reinvested: "The dividend share basis is the shares the holding carried at the end of the declared quarter, that is the holding's purchases plus its reinvested dividends less its retirements, at par of 1.00 per share."
      div_retired: "The dividend share basis is the shares the holding carried at the end of the declared quarter, that is the holding's purchases plus its reinvested dividends less its retirements, at par of 1.00 per share."
      div_last_purchase_date: "Where the holding's latest entries show share activity inside the declared quarter, the dividend share basis is adjusted so that shares earn only for the days they were held"
      div_last_retire_date: "Where the holding's latest entries show share activity inside the declared quarter, the dividend share basis is adjusted so that shares earn only for the days they were held"
      div_purchase_in_q: "the board's current declaration covers the quarter from declared_quarter_start to declared_quarter_end, declared_quarter_days days, paid on declared_quarter_payment_date."
      div_basis: "when the holding's latest purchase is dated inside the declared quarter and its latest retirement is also dated inside it, the basis is the quarter-end shares less that purchase times the days of the quarter before the purchase date divided by the days in the quarter, plus that retirement times the days of the quarter before the retirement date divided by the days in the quarter; when only the latest purchase is dated inside the declared quarter, the basis is the quarter-end shares less that purchase times the days of the quarter before the purchase date divided by the days in the quarter; when only the latest retirement is dated inside the declared quarter, the basis is the quarter-end shares plus that retirement times the days of the quarter before the retirement date divided by the days in the quarter; otherwise the basis is the quarter-end shares; the days of the quarter before a date are counted from the quarter's first day, inclusive, to that date, exclusive."
      div_bracket_rate: "The dividend bracket rate is read against the dividend share basis: a basis of bracket_high_usd or more carries rate_high_pct, a basis of bracket_mid_usd or more but below bracket_high_usd carries rate_mid_pct, and a basis below bracket_mid_usd carries dividend_rate_pct."
      div_months_held: "a holding issued at least loyalty_months whole months before today and carrying at least loyalty_quarters reinvested dividend entries earns loyalty_full_pct"
      div_reinvest_count: "a holding issued at least loyalty_months whole months before today and carrying at least loyalty_quarters reinvested dividend entries earns loyalty_full_pct"
      div_loyalty: "The dividend loyalty premium rests on the holding's age and its reinvestment record: a holding issued at least loyalty_months whole months before today and carrying at least loyalty_quarters reinvested dividend entries earns loyalty_full_pct; a holding that meets exactly one of those two conditions earns loyalty_part_pct; a holding that meets neither earns no premium."
      div_farm_principal: "a member with an active farm real estate loan whose principal balance is relationship_threshold_usd or more earns relationship_high_pct"
      div_relationship: "The dividend relationship premium rests on the member's farm real estate borrowing with the association: a member with an active farm real estate loan whose principal balance is relationship_threshold_usd or more earns relationship_high_pct; a member with an active farm real estate loan whose principal balance is below relationship_threshold_usd earns relationship_low_pct; a member with no active farm real estate loan earns no premium."
      div_rate: "the dividend annual rate is instead the dividend bracket rate plus the dividend loyalty premium plus the dividend relationship premium, all in percentage points, summed into one annual rate before it is applied; the parts never act on one another."
      result: "The quarterly preferred dividend equals the dividend share basis times the dividend annual rate, divided by 100, times the days in the declared quarter, divided by 365, rounded half up to the cent once, on the final figure only."
    factors:
      - id: dividend_share_basis
        effect: method
        decides: div_basis
        bindings: [div_last_purchase_date, div_last_purchase_amt, div_last_retire_date, div_last_retire_amt, div_purchase_in_q, div_retire_in_q, div_basis]
        ladder:
          - when: "the holding's latest purchase and its latest retirement are both dated inside the declared quarter"
            method: "quarter-end shares less the purchase times the quarter days before its date over the quarter days, plus the retirement times the quarter days before its date over the quarter days"
          - when: "only the holding's latest purchase is dated inside the declared quarter"
            method: "quarter-end shares less the purchase times the quarter days before its date over the quarter days"
          - when: "only the holding's latest retirement is dated inside the declared quarter"
            method: "quarter-end shares plus the retirement times the quarter days before its date over the quarter days"
          - when: "otherwise"
            method: "the quarter-end shares as they stand"
        baseline:
          div_basis: "div_end_shares"
        evidence: [history, date]
        cross_difficulty: null
      - id: dividend_bracket_rate
        effect: parameter
        decides: div_bracket_rate
        bindings: [div_purchased, div_reinvested, div_retired, div_bracket_rate]
        ladder:
          - when: "a dividend share basis of bracket_high_usd or more"
            value: "K('rate_high_pct')"
          - when: "a dividend share basis of bracket_mid_usd or more but below bracket_high_usd"
            value: "K('rate_mid_pct')"
          - when: "otherwise (a basis below bracket_mid_usd)"
            value: "P('dividend_rate_pct')"
        baseline:
          div_bracket_rate: "P('dividend_rate_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: dividend_loyalty_premium
        effect: parameter
        decides: div_loyalty
        bindings: [div_months_held, div_reinvest_count, div_loyalty]
        ladder:
          - when: "the holding was issued at least loyalty_months whole months ago and carries at least loyalty_quarters reinvested dividend entries"
            value: "K('loyalty_full_pct')"
          - when: "the holding meets exactly one of those two conditions"
            value: "K('loyalty_part_pct')"
          - when: "otherwise (it meets neither)"
            value: "0"
        baseline:
          div_loyalty: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: dividend_relationship_premium
        effect: parameter
        decides: div_relationship
        bindings: [div_farm_principal, div_relationship]
        ladder:
          - when: "the member has an active farm real estate loan with a principal balance of relationship_threshold_usd or more"
            value: "K('relationship_high_pct')"
          - when: "the member has an active farm real estate loan with a principal balance below relationship_threshold_usd"
            value: "K('relationship_low_pct')"
          - when: "otherwise (no active farm real estate loan)"
            value: "0"
        baseline:
          div_relationship: "0"
        evidence: [cross_category]
        cross_difficulty: farmland
    baseline:
      rule: >-
        The quarterly preferred dividend equals the dividend share basis times the dividend annual rate, divided by 100,
        times the days in the declared quarter, divided by 365, rounded half up to the cent once, on the final figure only.
        The dividend share basis is the shares the holding carried at the end of the declared quarter, that is the holding's
        purchases plus its reinvested dividends less its retirements, at par of 1.00 per share.
        The dividend annual rate is the declared dividend_rate_pct per year.
      params: [dividend_rate_pct, declared_quarter_days]
    inputs:
      history:
