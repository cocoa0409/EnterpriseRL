        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_dividend_reinvested}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_retirement}}
        - {table: equity_transactions, aggregate: latest, field: effective_date, filters: {event_type: equity_purchase}}
        - {table: equity_transactions, aggregate: count, field: eq_txn_id, filters: {event_type: equity_dividend_reinvested}}
      cross_category: [farmland]

  - id: equity_ext_preferred_redemption_payment
    base_policy_refs: [equity_estate_retirement, equity_preferred_stock]
    overwrite:
      - base_policy: equity_preferred_stock
        superseded_clause: >-
          It is paid at par, subject to board approval
        replaced_by: >-
          The par amount paid on an approved redemption is the lesser of the amount named on the holding's latest approved
          preferred redemption request and the quarter's redemption allowance
    trigger: state_due
    subject: [equity_retirement_deferred]
    computes: amount
    target_tool: pay_preferred_redemption_7befd982
    params:
      allowance_quarter_start: "2026-07-01"
      allowance_quarter_end: "2026-09-30"
      allowance_pct: 25
      tenure_months_long: 120
      tenure_months_mid: 60
      tenure_pts_long: 10
      tenure_pts_mid: 5
      reinvest_quarters_long: 16
      reinvest_quarters_mid: 8
      reinvest_pts_long: 10
      reinvest_pts_mid: 5
      size_bracket_high_usd: 500000.0
      size_bracket_mid_usd: 100000.0
      size_reduction_high_pts: 5
      size_reduction_mid_pts: 2
      delay_addition_pct: 10
      delay_extended_days: 45
      delay_addition_extended_pct: 20
    rule: >
      An approved Class H Preferred Stock redemption whose notice period has run is paid within
      retirement_processing_days calendar days of the written request, by the payout method on the holding, as one
      retirement entry with reason redemption dated the day it is paid; the board limits what it pays on redemptions in
      each calendar quarter, and the current quarter runs from allowance_quarter_start to allowance_quarter_end.
      The amount paid on an approved redemption is fixed only after the holding carries the reinvested dividend for every
      quarter whose dividend payment date has passed.
      The par amount paid on an approved redemption is the lesser of the amount named on the holding's latest approved
      preferred redemption request and the quarter's redemption allowance; when paying that amount would leave less than
      min_balance_after_partial_usd on the holding, the whole holding is paid instead.
      The quarter's redemption allowance is allowance_pct percent of the redemption allowance base, rounded half up to the
      cent.
      The redemption allowance base is the shares the holding carried at the start of the current quarter, that is its
      present shares (purchases plus reinvested dividends less retirements) less its latest reinvested dividend and its
      latest purchase when either is dated inside the quarter, plus its latest retirement when that is dated inside the
      quarter.
      Where the rules below set redemption tenure points, redemption reinvestment points or a redemption installment
      addition, the quarter's redemption allowance is instead the redemption allowance base times allowance_pct plus
      the redemption tenure points plus the redemption reinvestment points less the redemption size reduction, divided
      by 100, plus the redemption installment addition, plus the redemption delay addition, rounded half up to the cent
      once, on that final figure.
      The redemption size reduction protects the association's capital from large redemptions: a holding that carried
      size_bracket_high_usd or more at the start of the current quarter has size_reduction_high_pts points taken off; a
      holding that carried size_bracket_mid_usd or more but below size_bracket_high_usd has size_reduction_mid_pts
      points taken off; a smaller holding has none taken off.
      The redemption delay addition makes good the association's own delay in paying an approved request: when today is
      more than delay_extended_days calendar days after the written request, the addition is delay_addition_extended_pct
      percent of the amount named on the request; when today is more than retirement_processing_days but no more than
      delay_extended_days calendar days after it, delay_addition_pct percent of that amount; otherwise there is no
      addition.
      Where the holding's latest entries show activity inside the current quarter, the redemption allowance base is
      measured on the shares after that activity: when the latest reinvested dividend is dated inside the quarter and
      the latest retirement is not, the base is the start-of-quarter shares plus that reinvested dividend; when the latest
      retirement is dated inside the quarter, the base is the start-of-quarter shares less that retirement; otherwise the
      base is the start-of-quarter shares.
      Redemption tenure points rest on the holding's age: a holding issued at least tenure_months_long whole months before
      today earns tenure_pts_long points; a holding issued at least tenure_months_mid but fewer than tenure_months_long
      whole months before today earns tenure_pts_mid points; a younger holding earns none.
      Redemption reinvestment points rest on the holding's reinvestment record: a holding carrying at least
      reinvest_quarters_long reinvested dividend entries earns reinvest_pts_long points; a holding carrying at least
      reinvest_quarters_mid but fewer than reinvest_quarters_long earns reinvest_pts_mid points; a holding with fewer earns
      none.
      The redemption installment addition lets a redemption fund an installment the member owes the association in the
      quarter: when the member's active farm real estate loan has its next installment due inside the current quarter,
      the addition is that installment amount; when no farm real estate installment is due inside the quarter but the
      member's active equipment loan has its next installment due inside it, the addition is that equipment installment
      amount; otherwise there is no addition.
      The part of an approved request above the quarter's redemption allowance is not paid; the holding returns to active
      status with its remaining shares, and the member may ask again in writing. A holding without an approved preferred
      redemption request whose notice period has run has nothing paid under this rule.
    prerequisite:
      - problem: equity_ext_preferred_dividend_reinvestment
        kind: value_input
        gate: rp_base
        form: state
        policy_source: >-
          The amount paid on an approved redemption is fixed only after the holding carries the reinvested dividend for
          every quarter whose dividend payment date has passed.
        condition: >-
          The Class H Preferred Stock holding carries a reinvested dividend entry dated on the payment date of every
          declared quarter whose payment date is on or before today.
        resolved_by: book_preferred_dividend_reinvestment_5d71129c
        effect: >-
          Once the latest quarter's reinvested dividend entry stands on the holding inside the current quarter, the
          redemption allowance base is measured on the start-of-quarter shares plus that dividend, and the present shares
          rise by the dividend, so the quarter's redemption allowance and the amount paid change.
    cross_category:
      - category: farmland
        as: branch
        reads: [status, next_due_date, installment_amount]
        note: the redemption installment addition first reads the active farm real estate loan's next installment.
      - category: equipment
        as: branch
        reads: [status, next_due_date, installment_amount]
        note: when no farm real estate installment falls due in the quarter, the addition reads the active equipment loan's next installment.
    compute:
      - rp_purchased: "SUM('equity_transactions', 'amount', event_type='equity_purchase')"
      - rp_reinvested: "SUM('equity_transactions', 'amount', event_type='equity_dividend_reinvested')"
      - rp_retired: "SUM('equity_transactions', 'amount', event_type='equity_retirement')"
      - rp_shares: "rp_purchased + rp_reinvested - rp_retired"
      - rp_named: "LATEST('equity_requests', 'requested_amount', date_field='created_at', request_type='preferred_redemption', request_status='approved') or 0"
      - rp_pur_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_purchase') or ''"
      - rp_pur_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_purchase') or 0"
      - rp_pur_in_q: "K('allowance_quarter_start') <= rp_pur_date <= K('allowance_quarter_end')"
      - rp_ret_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_retirement') or ''"
      - rp_ret_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_retirement') or 0"
      - rp_ret_in_q: "K('allowance_quarter_start') <= rp_ret_date <= K('allowance_quarter_end')"
      - rp_div_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_dividend_reinvested') or ''"
      - rp_div_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_dividend_reinvested') or 0"
      - rp_div_in_q: "K('allowance_quarter_start') <= rp_div_date <= K('allowance_quarter_end')"
      - rp_start_shares: "rp_shares - (rp_div_amt if rp_div_in_q else 0) - (rp_pur_amt if rp_pur_in_q else 0) + (rp_ret_amt if rp_ret_in_q else 0)"
      - rp_base: "(rp_start_shares + rp_div_amt) if (rp_div_in_q and not rp_ret_in_q) else ((rp_start_shares - rp_ret_amt) if rp_ret_in_q else rp_start_shares)"
      - rp_months_held: "MONTHS(F('issued_date'), NOW)"
      - rp_tenure: "K('tenure_pts_long') if rp_months_held >= K('tenure_months_long') else (K('tenure_pts_mid') if rp_months_held >= K('tenure_months_mid') else 0)"
      - rp_reinvest_count: "COUNT('equity_transactions', event_type='equity_dividend_reinvested')"
      - rp_reinvest: "K('reinvest_pts_long') if rp_reinvest_count >= K('reinvest_quarters_long') else (K('reinvest_pts_mid') if rp_reinvest_count >= K('reinvest_quarters_mid') else 0)"
      - rp_farm_due: "CFIELD('farmland', 'next_due_date', status='active') or ''"
      - rp_farm_inst: "CFIELD('farmland', 'installment_amount', status='active') or 0"
      - rp_equip_due: "CFIELD('equipment', 'next_due_date', status='active') or ''"
      - rp_equip_inst: "CFIELD('equipment', 'installment_amount', status='active') or 0"
      - rp_farm_due_in_q: "K('allowance_quarter_start') <= rp_farm_due <= K('allowance_quarter_end')"
      - rp_equip_due_in_q: "K('allowance_quarter_start') <= rp_equip_due <= K('allowance_quarter_end')"
      - rp_installment: "rp_farm_inst if rp_farm_due_in_q else (rp_equip_inst if rp_equip_due_in_q else 0)"
      - rp_size_reduction: "K('size_reduction_high_pts') if rp_start_shares >= K('size_bracket_high_usd') else (K('size_reduction_mid_pts') if rp_start_shares >= K('size_bracket_mid_usd') else 0)"
      - rp_request_date: "LATEST('equity_requests', 'created_at', date_field='created_at', request_type='preferred_redemption', request_status='approved') or NOW"
      - rp_days_waiting: "DAYS(rp_request_date, NOW)"
      - rp_delay_addition: "rp_named * K('delay_addition_extended_pct') / 100 if rp_days_waiting > K('delay_extended_days') else (rp_named * K('delay_addition_pct') / 100 if rp_days_waiting > P('retirement_processing_days') else 0)"
      - rp_allowance: "RND(rp_base * (K('allowance_pct') + rp_tenure + rp_reinvest - rp_size_reduction) / 100 + rp_installment + rp_delay_addition, 2)"
      - rp_pay: "MN(rp_named, rp_allowance)"
      - result: "RND(rp_shares, 2) if rp_shares - rp_pay < P('min_balance_after_partial_usd') else RND(rp_pay, 2)"
    compute_basis:
      rp_purchased: "its present shares (purchases plus reinvested dividends less retirements)"
      rp_reinvested: "its present shares (purchases plus reinvested dividends less retirements)"
      rp_retired: "its present shares (purchases plus reinvested dividends less retirements)"
      rp_named: "The par amount paid on an approved redemption is the lesser of the amount named on the holding's latest approved preferred redemption request and the quarter's redemption allowance"
