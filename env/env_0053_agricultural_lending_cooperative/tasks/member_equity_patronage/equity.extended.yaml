  - id: equity_ext_preferred_redemption_request
    base_policy_refs: [equity_estate_retirement, equity_preferred_stock]
    overwrite:
      - base_policy: equity_preferred_stock
        superseded_clause: >-
          a partial redemption must leave at least min_balance_after_partial_usd
        replaced_by: >-
          a holding of keep_bracket_high_usd or more at the start of the quarter keeps the larger of
          min_balance_after_partial_usd and keep_pct_high percent of those start-of-quarter shares
    trigger: on_request
    subject: [equity_retirement_request]
    computes: requested_amount
    target_tool: submit_preferred_redemption_request_9710f0b7
    params:
      request_quarter_start: "2026-07-01"
      request_quarter_end: "2026-09-30"
      season_held_long_months: 120
      season_held_mid_months: 60
      season_purchase_long_months: 6
      season_purchase_mid_months: 9
      season_purchase_std_months: 12
      season_reinvest_long: 20
      season_reinvest_mid: 8
      season_dividend_mid_months: 3
      season_dividend_std_months: 6
      keep_bracket_high_usd: 50000.0
      keep_bracket_mid_usd: 20000.0
      keep_pct_high: 15
      keep_pct_mid: 10
      overlap_months: 3
      pace_recent_months: 3
      pace_year_months: 12
      pace_recent_pct: 10
      pace_year_pct: 5
    rule: >
      A member asks in writing, on their own instruction, to redeem Class H Preferred Stock; a member who asks to redeem
      everything the redemption rules allow while keeping the holding open signs a preferred redemption request for the
      redeemable share amount, and the holding is marked as having a redemption requested from that day.
      A new preferred redemption request is not registered until no approved redemption on the holding whose notice
      period has run remains unpaid.
      The redeemable share amount is the holding's present shares less its unseasoned shares and less the redemption
      minimum, never below zero, to the cent.
      The holding's present shares are its purchases plus its reinvested dividends less its retirements.
      Unseasoned shares are the purchases dated within the last season_purchase_std_months whole months and the reinvested
      dividends dated within the last season_dividend_std_months whole months, counting whole calendar months back from
      today.
      The redemption minimum is min_balance_after_partial_usd.
      The purchase seasoning period rests on the holding's age: for a holding issued at least season_held_long_months
      whole months before today, purchases are unseasoned for season_purchase_long_months whole months; for a holding
      issued at least season_held_mid_months but fewer than season_held_long_months whole months before today, for
      season_purchase_mid_months whole months; for a younger holding, for season_purchase_std_months whole months.
      The dividend seasoning period rests on the holding's reinvestment record: for a holding carrying at least
      season_reinvest_long reinvested dividend entries, reinvested dividends are seasoned at once; for a holding carrying at
      least season_reinvest_mid but fewer than season_reinvest_long, they are unseasoned for season_dividend_mid_months
      whole months; for a holding with fewer, for season_dividend_std_months whole months.
      The redemption minimum rests on the size of the holding at the start of the current quarter (request_quarter_start
      to request_quarter_end), measured as its present shares less its latest reinvested dividend and latest purchase when
      dated inside the quarter, plus its latest retirement when dated inside the quarter: a holding of
      keep_bracket_high_usd or more at the start of the quarter keeps the larger of min_balance_after_partial_usd and
      keep_pct_high percent of those start-of-quarter shares; a holding of keep_bracket_mid_usd or more but below
      keep_bracket_high_usd keeps the larger of min_balance_after_partial_usd and keep_pct_mid percent of them; a smaller
      holding keeps min_balance_after_partial_usd.
      How the unseasoned shares and the redemption minimum combine rests on whether the holding is still taking reinvested
      dividends: for a holding with a reinvested dividend entry dated within the last overlap_months whole months whose
      unseasoned shares are at least the redemption minimum, the unseasoned shares stand as the minimum and the
      redeemable share amount is the present shares less the unseasoned shares; for such a holding whose unseasoned shares
      are below the redemption minimum, the redeemable share amount is the present shares less the redemption minimum; for
      a holding with no reinvested dividend entry in that period, the present shares less both.
      Where the rule below sets a redemption pacing reserve, it is taken off the redeemable share amount as well, after
      the unseasoned shares and the redemption minimum have been dealt with: a holding with a redemption paid within the
      last pace_recent_months whole months holds back pace_recent_pct percent of its present shares; a holding with a
      redemption paid within the last pace_year_months whole months but none within the last pace_recent_months holds
      back pace_year_pct percent of them; any other holding holds back nothing.
      A request for a named dollar amount is written for that amount as the member states it, and a request for the whole
      holding is written as the whole holding; neither is sized under this rule.
    prerequisite:
      - problem: equity_ext_preferred_redemption_payment
        kind: value_input
        gate: rq_shares
        form: state
        policy_source: >-
          A new preferred redemption request is not registered until no approved redemption on the holding whose notice
          period has run remains unpaid.
        condition: >-
          No preferred redemption request on the holding stands approved with its notice period run while the holding is
          still marked as having a redemption requested; the holding is active and its redemption entry for that request
          stands in its activity.
        resolved_by: pay_preferred_redemption_7befd982
        effect: >-
          Once the approved redemption is paid, the holding is active again and its present shares fall by the par amount
          paid, while the start-of-quarter shares that set the redemption minimum add that retirement back, so the
          redeemable share amount changes.
    cross_category: []
    compute:
      - rq_purchased: "SUM('equity_transactions', 'amount', event_type='equity_purchase')"
      - rq_reinvested: "SUM('equity_transactions', 'amount', event_type='equity_dividend_reinvested')"
      - rq_retired: "SUM('equity_transactions', 'amount', event_type='equity_retirement')"
      - rq_shares: "rq_purchased + rq_reinvested - rq_retired"
      - rq_months_held: "MONTHS(F('issued_date'), NOW)"
      - rq_purchase_window: "K('season_purchase_long_months') if rq_months_held >= K('season_held_long_months') else (K('season_purchase_mid_months') if rq_months_held >= K('season_held_mid_months') else K('season_purchase_std_months'))"
      - rq_unseasoned_purchases: "SUM('equity_transactions', 'amount', within_months=rq_purchase_window, date_field='effective_date', event_type='equity_purchase')"
      - rq_reinvest_count: "COUNT('equity_transactions', event_type='equity_dividend_reinvested')"
      - rq_dividend_window: "0 if rq_reinvest_count >= K('season_reinvest_long') else (K('season_dividend_mid_months') if rq_reinvest_count >= K('season_reinvest_mid') else K('season_dividend_std_months'))"
      - rq_unseasoned_dividends: "SUM('equity_transactions', 'amount', within_months=rq_dividend_window, date_field='effective_date', event_type='equity_dividend_reinvested')"
      - rq_unseasoned: "rq_unseasoned_purchases + rq_unseasoned_dividends"
      - rq_div_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_dividend_reinvested') or ''"
      - rq_div_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_dividend_reinvested') or 0"
      - rq_pur_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_purchase') or ''"
      - rq_pur_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_purchase') or 0"
      - rq_ret_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_retirement') or ''"
      - rq_ret_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_retirement') or 0"
      - rq_start_shares: "rq_shares - (rq_div_amt if K('request_quarter_start') <= rq_div_date <= K('request_quarter_end') else 0) - (rq_pur_amt if K('request_quarter_start') <= rq_pur_date <= K('request_quarter_end') else 0) + (rq_ret_amt if K('request_quarter_start') <= rq_ret_date <= K('request_quarter_end') else 0)"
      - rq_keep_pct: "K('keep_pct_high') if rq_start_shares >= K('keep_bracket_high_usd') else (K('keep_pct_mid') if rq_start_shares >= K('keep_bracket_mid_usd') else 0)"
      - rq_keep: "MX(P('min_balance_after_partial_usd'), rq_start_shares * rq_keep_pct / 100)"
      - rq_recent_reinvest: "COUNT('equity_transactions', within_months=K('overlap_months'), date_field='effective_date', event_type='equity_dividend_reinvested')"
      - rq_redeemable: "(rq_shares - rq_unseasoned) if (rq_recent_reinvest >= 1 and rq_unseasoned >= rq_keep) else ((rq_shares - rq_keep) if (rq_recent_reinvest >= 1 and rq_unseasoned < rq_keep) else (rq_shares - rq_unseasoned - rq_keep))"
      - rq_redeemed_recent: "COUNT('equity_transactions', within_months=K('pace_recent_months'), date_field='effective_date', event_type='equity_retirement', retirement_reason='redemption')"
      - rq_redeemed_year: "COUNT('equity_transactions', within_months=K('pace_year_months'), date_field='effective_date', event_type='equity_retirement', retirement_reason='redemption')"
      - rq_pace_pct: "K('pace_recent_pct') if rq_redeemed_recent >= 1 else (K('pace_year_pct') if rq_redeemed_year >= 1 else 0)"
      - result: "RND(MX(0, rq_redeemable - rq_shares * rq_pace_pct / 100), 2)"
    compute_basis:
      rq_purchased: "The holding's present shares are its purchases plus its reinvested dividends less its retirements."
      rq_reinvested: "The holding's present shares are its purchases plus its reinvested dividends less its retirements."
      rq_retired: "The holding's present shares are its purchases plus its reinvested dividends less its retirements."
      rq_months_held: "for a holding issued at least season_held_long_months whole months before today, purchases are unseasoned for season_purchase_long_months whole months"
      rq_purchase_window: "The purchase seasoning period rests on the holding's age: for a holding issued at least season_held_long_months whole months before today, purchases are unseasoned for season_purchase_long_months whole months; for a holding issued at least season_held_mid_months but fewer than season_held_long_months whole months before today, for season_purchase_mid_months whole months; for a younger holding, for season_purchase_std_months whole months."
      rq_unseasoned_purchases: "Unseasoned shares are the purchases dated within the last season_purchase_std_months whole months and the reinvested dividends dated within the last season_dividend_std_months whole months, counting whole calendar months back from today."
      rq_reinvest_count: "for a holding carrying at least season_reinvest_long reinvested dividend entries, reinvested dividends are seasoned at once"
      rq_dividend_window: "The dividend seasoning period rests on the holding's reinvestment record: for a holding carrying at least season_reinvest_long reinvested dividend entries, reinvested dividends are seasoned at once; for a holding carrying at least season_reinvest_mid but fewer than season_reinvest_long, they are unseasoned for season_dividend_mid_months whole months; for a holding with fewer, for season_dividend_std_months whole months."
      rq_unseasoned_dividends: "Unseasoned shares are the purchases dated within the last season_purchase_std_months whole months and the reinvested dividends dated within the last season_dividend_std_months whole months, counting whole calendar months back from today."
      rq_div_date: "measured as its present shares less its latest reinvested dividend and latest purchase when dated inside the quarter, plus its latest retirement when dated inside the quarter"
      rq_pur_date: "measured as its present shares less its latest reinvested dividend and latest purchase when dated inside the quarter, plus its latest retirement when dated inside the quarter"
      rq_ret_date: "measured as its present shares less its latest reinvested dividend and latest purchase when dated inside the quarter, plus its latest retirement when dated inside the quarter"
      rq_start_shares: "The redemption minimum rests on the size of the holding at the start of the current quarter (request_quarter_start to request_quarter_end), measured as its present shares less its latest reinvested dividend and latest purchase when dated inside the quarter, plus its latest retirement when dated inside the quarter"
      rq_keep_pct: "a holding of keep_bracket_high_usd or more at the start of the quarter keeps the larger of min_balance_after_partial_usd and keep_pct_high percent of those start-of-quarter shares; a holding of keep_bracket_mid_usd or more but below keep_bracket_high_usd keeps the larger of min_balance_after_partial_usd and keep_pct_mid percent of them; a smaller holding keeps min_balance_after_partial_usd."
      rq_keep: "The redemption minimum is min_balance_after_partial_usd."
      rq_recent_reinvest: "for a holding with a reinvested dividend entry dated within the last overlap_months whole months whose unseasoned shares are at least the redemption minimum"
      rq_redeemable: "for a holding with a reinvested dividend entry dated within the last overlap_months whole months whose unseasoned shares are at least the redemption minimum, the unseasoned shares stand as the minimum and the redeemable share amount is the present shares less the unseasoned shares; for such a holding whose unseasoned shares are below the redemption minimum, the redeemable share amount is the present shares less the redemption minimum; for a holding with no reinvested dividend entry in that period, the present shares less both."
      rq_redeemed_recent: "a holding with a redemption paid within the last pace_recent_months whole months holds back pace_recent_pct percent of its present shares"
      rq_redeemed_year: "a holding with a redemption paid within the last pace_year_months whole months but none within the last pace_recent_months holds back pace_year_pct percent of them"
      rq_pace_pct: "Where the rule below sets a redemption pacing reserve, it is taken off the redeemable share amount as well, after the unseasoned shares and the redemption minimum have been dealt with: a holding with a redemption paid within the last pace_recent_months whole months holds back pace_recent_pct percent of its present shares; a holding with a redemption paid within the last pace_year_months whole months but none within the last pace_recent_months holds back pace_year_pct percent of them; any other holding holds back nothing."
      result: "The redeemable share amount is the holding's present shares less its unseasoned shares and less the redemption minimum, never below zero, to the cent."
    factors:
      - id: purchase_seasoning_period
        effect: parameter
        decides: rq_purchase_window
        bindings: [rq_months_held, rq_purchase_window, rq_unseasoned_purchases]
        ladder:
          - when: "the holding was issued at least season_held_long_months whole months ago"
            value: "K('season_purchase_long_months')"
          - when: "the holding was issued at least season_held_mid_months but fewer than season_held_long_months whole months ago"
            value: "K('season_purchase_mid_months')"
          - when: "otherwise"
            value: "K('season_purchase_std_months')"
        baseline:
          rq_purchase_window: "K('season_purchase_std_months')"
        evidence: [history, date]
        cross_difficulty: null
      - id: dividend_seasoning_period
        effect: parameter
        decides: rq_dividend_window
        bindings: [rq_reinvest_count, rq_dividend_window, rq_unseasoned_dividends]
        ladder:
          - when: "the holding carries at least season_reinvest_long reinvested dividend entries"
            value: "0"
          - when: "the holding carries at least season_reinvest_mid but fewer than season_reinvest_long reinvested dividend entries"
            value: "K('season_dividend_mid_months')"
          - when: "otherwise"
            value: "K('season_dividend_std_months')"
        baseline:
          rq_dividend_window: "K('season_dividend_std_months')"
        evidence: [history]
        cross_difficulty: null
      - id: redemption_minimum
        effect: parameter
        decides: rq_keep_pct
        bindings: [rq_div_date, rq_div_amt, rq_pur_date, rq_pur_amt, rq_ret_date, rq_ret_amt, rq_start_shares, rq_keep_pct, rq_keep]
        ladder:
          - when: "the holding carried keep_bracket_high_usd or more at the start of the current quarter"
            value: "the larger of min_balance_after_partial_usd and K('keep_pct_high') percent of the start-of-quarter shares"
          - when: "the holding carried keep_bracket_mid_usd or more but below keep_bracket_high_usd at the start of the current quarter"
            value: "the larger of min_balance_after_partial_usd and K('keep_pct_mid') percent of the start-of-quarter shares"
          - when: "otherwise"
            value: "P('min_balance_after_partial_usd')"
        baseline:
          rq_keep_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: unseasoned_and_minimum_combination
        effect: method
        decides: rq_redeemable
        bindings: [rq_recent_reinvest, rq_redeemable]
        ladder:
          - when: "a reinvested dividend entry is dated within the last overlap_months whole months and the unseasoned shares are at least the redemption minimum"
            method: "present shares less the unseasoned shares (the unseasoned shares stand as the minimum)"
          - when: "a reinvested dividend entry is dated within the last overlap_months whole months and the unseasoned shares are below the redemption minimum"
            method: "present shares less the redemption minimum"
          - when: "otherwise"
            method: "present shares less the unseasoned shares and less the redemption minimum"
        baseline:
          rq_redeemable: "rq_shares - rq_unseasoned - rq_keep"
        evidence: [history]
        cross_difficulty: null
      - id: redemption_pacing_reserve
        effect: parameter
        decides: rq_pace_pct
        bindings: [rq_redeemed_recent, rq_redeemed_year, rq_pace_pct]
        ladder:
          - when: "a redemption was paid on the holding within the last pace_recent_months whole months"
            value: "K('pace_recent_pct') percent of the present shares held back"
          - when: "a redemption was paid within the last pace_year_months whole months but none within the last pace_recent_months"
            value: "K('pace_year_pct') percent of the present shares held back"
          - when: "otherwise"
            value: "0"
        baseline:
          rq_pace_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The redeemable share amount is the holding's present shares less its unseasoned shares and less the redemption
        minimum, never below zero, to the cent.
        The holding's present shares are its purchases plus its reinvested dividends less its retirements.
        Unseasoned shares are the purchases dated within the last season_purchase_std_months whole months and the reinvested
        dividends dated within the last season_dividend_std_months whole months, counting whole calendar months back from
        today.
        The redemption minimum is min_balance_after_partial_usd.
      params: [season_purchase_std_months, season_dividend_std_months, min_balance_after_partial_usd]
    inputs:
      history:
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_purchase}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_dividend_reinvested}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_retirement}}
        - {table: equity_transactions, aggregate: count, field: eq_txn_id, within_months: 3, filters: {event_type: equity_dividend_reinvested}}
      cross_category: []

  - id: equity_ext_preferred_holding_excess_refund
    base_policy_refs: [equity_agg_class_combination, equity_stock_requirement, equity_preferred_stock]
    overwrite:
      - base_policy: equity_preferred_stock
        superseded_clause: >-
          may not take the holding above max_holding_usd
        replaced_by: >-
          Where the rules below set holding-ceiling tolerances, the holding ceiling is instead max_holding_usd plus the
          holding-ceiling relationship tolerance, the holding-ceiling tenure tolerance, the holding-ceiling size tolerance
          and the holding-ceiling operating tolerance, all in dollars and added together before the excess is taken.
    trigger: state_due
    subject: [equity_purchase]
    computes: amount
    target_tool: refund_preferred_holding_excess_154bc05b
    params:
      recent_months: 4
      count_reinvest_many: 8
      tol_relationship_threshold_usd: 250000.0
      tol_relationship_high_usd: 10000.0
      tol_relationship_low_usd: 5000.0
      tol_tenure_long_months: 120
      tol_tenure_mid_months: 60
      tol_tenure_long_usd: 5000.0
      tol_tenure_mid_usd: 2500.0
      tol_size_high_usd: 750000.0
      tol_size_mid_usd: 250000.0
      tol_size_high_amt_usd: 5000.0
      tol_size_mid_amt_usd: 2500.0
      tol_operating_threshold_usd: 500000.0
      tol_operating_high_usd: 5000.0
      tol_operating_low_usd: 2500.0
    rule: >
      When a purchase has been accepted that takes a Class H Preferred Stock holding above the holding ceiling, the shares above it are cancelled as of the date of that purchase
      (the holding's latest purchase) and refunded within subscription_refund_days calendar days by the payout method on
      the holding, as one entry with reason subscription cancelled.
      The holding-ceiling excess is the shares counted toward the ceiling less the holding ceiling, never below zero, to
      the cent.
      The shares counted toward the ceiling are the holding's purchases plus its reinvested dividends less its
      retirements.
      The holding ceiling is max_holding_usd.
      Where the rules below set holding-ceiling tolerances, the holding ceiling is instead max_holding_usd plus the
      holding-ceiling relationship tolerance, the holding-ceiling tenure tolerance, the holding-ceiling size tolerance and
      the holding-ceiling operating tolerance, all in dollars and added together before the excess is taken.
      Which shares count toward the ceiling rests on the holding's reinvestment record, because the ceiling governs what
      a member buys: for a holding with a reinvested dividend entry dated within the last recent_months whole months and
      at least count_reinvest_many reinvested dividend entries in all, the shares counted are its purchases less its
      retirements, all reinvested dividend shares left out; for a holding with a reinvested dividend entry dated within the
      last recent_months whole months but fewer than count_reinvest_many entries in all, the shares counted leave out only
      its latest reinvested dividend; for any other holding every share counts.
      The holding-ceiling relationship tolerance rests on the member's farm real estate borrowing: an active farm real
      estate loan with a principal balance of tol_relationship_threshold_usd or more gives tol_relationship_high_usd; an
      active farm real estate loan below that gives tol_relationship_low_usd; no active farm real estate loan gives none.
      The holding-ceiling tenure tolerance rests on the holding's age: a holding issued at least tol_tenure_long_months
      whole months before today gives tol_tenure_long_usd; at least tol_tenure_mid_months but fewer than
      tol_tenure_long_months gives tol_tenure_mid_usd; a younger holding gives none.
      The holding-ceiling size tolerance rests on what the member has put into the holding: purchases totalling
      tol_size_high_usd or more give tol_size_high_amt_usd; purchases totalling tol_size_mid_usd or more but below
      tol_size_high_usd give tol_size_mid_amt_usd; smaller totals give none.
      The holding-ceiling operating tolerance rests on the member's operating credit: an active operating line with a
      commitment of tol_operating_threshold_usd or more gives tol_operating_high_usd; an active operating line with a
      smaller commitment gives tol_operating_low_usd; no active operating line gives none.
      A holding whose counted shares do not exceed the holding ceiling has nothing cancelled under this rule.
    prerequisite: []
    cross_category:
      - category: farmland
        as: branch
        reads: [status, principal_balance]
        note: the holding-ceiling relationship tolerance is read from the active farm real estate loan principal balance.
      - category: operating
        as: branch
        reads: [status, commitment_amount]
        note: the holding-ceiling operating tolerance is read from the active operating line commitment.
    compute:
      - hx_purchased: "SUM('equity_transactions', 'amount', event_type='equity_purchase')"
      - hx_reinvested: "SUM('equity_transactions', 'amount', event_type='equity_dividend_reinvested')"
      - hx_retired: "SUM('equity_transactions', 'amount', event_type='equity_retirement')"
      - hx_all_shares: "hx_purchased + hx_reinvested - hx_retired"
      - hx_recent_reinvest: "COUNT('equity_transactions', within_months=K('recent_months'), date_field='effective_date', event_type='equity_dividend_reinvested')"
      - hx_reinvest_count: "COUNT('equity_transactions', event_type='equity_dividend_reinvested')"
      - hx_latest_dividend: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_dividend_reinvested') or 0"
      - hx_counted: "(hx_purchased - hx_retired) if (hx_recent_reinvest >= 1 and hx_reinvest_count >= K('count_reinvest_many')) else ((hx_all_shares - hx_latest_dividend) if (hx_recent_reinvest >= 1 and hx_reinvest_count < K('count_reinvest_many')) else hx_all_shares)"
      - hx_farm_principal: "CFIELD('farmland', 'principal_balance', status='active') or 0"
      - hx_tol_relationship: "K('tol_relationship_high_usd') if hx_farm_principal >= K('tol_relationship_threshold_usd') else (K('tol_relationship_low_usd') if hx_farm_principal > 0 else 0)"
      - hx_months_held: "MONTHS(F('issued_date'), NOW)"
      - hx_tol_tenure: "K('tol_tenure_long_usd') if hx_months_held >= K('tol_tenure_long_months') else (K('tol_tenure_mid_usd') if hx_months_held >= K('tol_tenure_mid_months') else 0)"
      - hx_purchase_total: "SUM('equity_transactions', 'amount', event_type='equity_purchase')"
      - hx_tol_size: "K('tol_size_high_amt_usd') if hx_purchase_total >= K('tol_size_high_usd') else (K('tol_size_mid_amt_usd') if hx_purchase_total >= K('tol_size_mid_usd') else 0)"
      - hx_op_commitment: "CFIELD('operating', 'commitment_amount', status='active') or 0"
      - hx_tol_operating: "K('tol_operating_high_usd') if hx_op_commitment >= K('tol_operating_threshold_usd') else (K('tol_operating_low_usd') if hx_op_commitment > 0 else 0)"
      - hx_ceiling: "P('max_holding_usd') + hx_tol_relationship + hx_tol_tenure + hx_tol_size + hx_tol_operating"
      - result: "RND(MX(0, hx_counted - hx_ceiling), 2)"
    compute_basis:
      hx_purchased: "The shares counted toward the ceiling are the holding's purchases plus its reinvested dividends less its retirements."
      hx_reinvested: "The shares counted toward the ceiling are the holding's purchases plus its reinvested dividends less its retirements."
      hx_retired: "The shares counted toward the ceiling are the holding's purchases plus its reinvested dividends less its retirements."
      hx_recent_reinvest: "for a holding with a reinvested dividend entry dated within the last recent_months whole months and at least count_reinvest_many reinvested dividend entries in all"
      hx_reinvest_count: "for a holding with a reinvested dividend entry dated within the last recent_months whole months and at least count_reinvest_many reinvested dividend entries in all"
      hx_latest_dividend: "the shares counted leave out only its latest reinvested dividend"
      hx_counted: "for a holding with a reinvested dividend entry dated within the last recent_months whole months and at least count_reinvest_many reinvested dividend entries in all, the shares counted are its purchases less its retirements, all reinvested dividend shares left out; for a holding with a reinvested dividend entry dated within the last recent_months whole months but fewer than count_reinvest_many entries in all, the shares counted leave out only its latest reinvested dividend; for any other holding every share counts."
      hx_farm_principal: "an active farm real estate loan with a principal balance of tol_relationship_threshold_usd or more gives tol_relationship_high_usd"
      hx_tol_relationship: "The holding-ceiling relationship tolerance rests on the member's farm real estate borrowing: an active farm real estate loan with a principal balance of tol_relationship_threshold_usd or more gives tol_relationship_high_usd; an active farm real estate loan below that gives tol_relationship_low_usd; no active farm real estate loan gives none."
      hx_months_held: "a holding issued at least tol_tenure_long_months whole months before today gives tol_tenure_long_usd"
      hx_tol_tenure: "The holding-ceiling tenure tolerance rests on the holding's age: a holding issued at least tol_tenure_long_months whole months before today gives tol_tenure_long_usd; at least tol_tenure_mid_months but fewer than tol_tenure_long_months gives tol_tenure_mid_usd; a younger holding gives none."
      hx_purchase_total: "purchases totalling tol_size_high_usd or more give tol_size_high_amt_usd"
      hx_tol_size: "The holding-ceiling size tolerance rests on what the member has put into the holding: purchases totalling tol_size_high_usd or more give tol_size_high_amt_usd; purchases totalling tol_size_mid_usd or more but below tol_size_high_usd give tol_size_mid_amt_usd; smaller totals give none."
      hx_op_commitment: "an active operating line with a commitment of tol_operating_threshold_usd or more gives tol_operating_high_usd"
      hx_tol_operating: "The holding-ceiling operating tolerance rests on the member's operating credit: an active operating line with a commitment of tol_operating_threshold_usd or more gives tol_operating_high_usd; an active operating line with a smaller commitment gives tol_operating_low_usd; no active operating line gives none."
      hx_ceiling: "the holding ceiling is instead max_holding_usd plus the holding-ceiling relationship tolerance, the holding-ceiling tenure tolerance, the holding-ceiling size tolerance and the holding-ceiling operating tolerance, all in dollars and added together before the excess is taken."
      result: "The holding-ceiling excess is the shares counted toward the ceiling less the holding ceiling, never below zero, to the cent."
    factors:
      - id: ceiling_counted_shares
        effect: method
        decides: hx_counted
        bindings: [hx_recent_reinvest, hx_reinvest_count, hx_latest_dividend, hx_counted]
        ladder:
          - when: "a reinvested dividend entry dated within the last recent_months whole months and at least count_reinvest_many reinvested dividend entries in all"
            method: "purchases less retirements, every reinvested dividend share left out"
          - when: "a reinvested dividend entry dated within the last recent_months whole months and fewer than count_reinvest_many entries in all"
            method: "all shares less the latest reinvested dividend"
          - when: "otherwise"
            method: "all shares"
        baseline:
          hx_counted: "hx_all_shares"
        evidence: [history]
        cross_difficulty: null
      - id: ceiling_relationship_tolerance
        effect: parameter
        decides: hx_tol_relationship
        bindings: [hx_farm_principal, hx_tol_relationship]
        ladder:
          - when: "an active farm real estate loan with a principal balance of tol_relationship_threshold_usd or more"
            value: "K('tol_relationship_high_usd')"
          - when: "an active farm real estate loan with a principal balance below tol_relationship_threshold_usd"
            value: "K('tol_relationship_low_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_tol_relationship: "0"
        evidence: [cross_category]
        cross_difficulty: farmland
      - id: ceiling_tenure_tolerance
        effect: parameter
        decides: hx_tol_tenure
        bindings: [hx_months_held, hx_tol_tenure]
        ladder:
          - when: "the holding was issued at least tol_tenure_long_months whole months ago"
            value: "K('tol_tenure_long_usd')"
          - when: "the holding was issued at least tol_tenure_mid_months but fewer than tol_tenure_long_months whole months ago"
            value: "K('tol_tenure_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_tol_tenure: "0"
        evidence: [date]
        cross_difficulty: null
      - id: ceiling_size_tolerance
        effect: parameter
        decides: hx_tol_size
        bindings: [hx_purchase_total, hx_tol_size]
        ladder:
          - when: "purchases on the holding totalling tol_size_high_usd or more"
            value: "K('tol_size_high_amt_usd')"
          - when: "purchases totalling tol_size_mid_usd or more but below tol_size_high_usd"
            value: "K('tol_size_mid_amt_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_tol_size: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ceiling_operating_tolerance
        effect: parameter
        decides: hx_tol_operating
        bindings: [hx_op_commitment, hx_tol_operating]
        ladder:
          - when: "an active operating line with a commitment of tol_operating_threshold_usd or more"
            value: "K('tol_operating_high_usd')"
          - when: "an active operating line with a commitment below tol_operating_threshold_usd"
            value: "K('tol_operating_low_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          hx_tol_operating: "0"
        evidence: [cross_category]
        cross_difficulty: operating
    baseline:
      rule: >-
        The holding-ceiling excess is the shares counted toward the ceiling less the holding ceiling, never below zero, to
        the cent.
        The shares counted toward the ceiling are the holding's purchases plus its reinvested dividends less its
        retirements.
        The holding ceiling is max_holding_usd.
      params: [max_holding_usd]
    inputs:
      history:
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_purchase}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_dividend_reinvested}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_retirement}}
        - {table: equity_transactions, aggregate: count, field: eq_txn_id, filters: {event_type: equity_dividend_reinvested}}
      cross_category: [farmland, operating]

  - id: equity_ext_preferred_quarter_limit_refund
    base_policy_refs: [equity_agg_class_combination, equity_stock_requirement, equity_preferred_stock]
    overwrite:
      - base_policy: equity_preferred_stock
        superseded_clause: >-
          purchases in one calendar quarter may not exceed preferred_max_purchase_per_quarter_usd
        replaced_by: >-
          Where the rules below set quarter-limit tolerances, the quarter's purchase allowance is instead
          preferred_max_purchase_per_quarter_usd plus the quarter-limit relationship tolerance, the quarter-limit
          reinvestment tolerance and the quarter-limit tenure tolerance, all in dollars and added together before the
          excess is taken.
    trigger: state_due
    subject: [equity_purchase]
    computes: amount
    target_tool: refund_preferred_quarter_excess_3d5c0453
    params:
      review_quarter_start: "2026-04-01"
      review_quarter_end: "2026-06-30"
      review_quarter_dividend_date: "2026-04-15"
      qtol_farm_threshold_usd: 250000.0
      qtol_relationship_both_usd: 10000.0
      qtol_relationship_one_usd: 5000.0
      qtol_reinvest_long: 8
      qtol_reinvest_mid: 4
      qtol_reinvest_long_usd: 4000.0
      qtol_reinvest_mid_usd: 2000.0
      qtol_tenure_long_months: 120
      qtol_tenure_mid_months: 60
      qtol_tenure_long_usd: 7500.0
      qtol_tenure_mid_usd: 3000.0
    rule: >
      When the holding's latest Class H Preferred Stock purchase, with what else counts against its calendar quarter, is
      above the quarter's purchase allowance, the part above it is cancelled as of that purchase's date and refunded within
      subscription_refund_days calendar days by the payout method on the holding, as one entry with reason subscription
      cancelled; the quarter under review runs from review_quarter_start to review_quarter_end, and the reinvested dividend
      paid inside it is the one paid on review_quarter_dividend_date.
      The quarter-limit excess is the amount counted against the quarter less the quarter's purchase allowance, never
      below zero, to the cent.
      The amount counted against the quarter is the latest purchase alone.
      The quarter's purchase allowance is preferred_max_purchase_per_quarter_usd.
      Where the rules below set quarter-limit tolerances, the quarter's purchase allowance is instead
      preferred_max_purchase_per_quarter_usd plus the quarter-limit relationship tolerance, the quarter-limit
      reinvestment tolerance and the quarter-limit tenure tolerance, all in dollars and added together before the excess
      is taken.
      What counts against the quarter rests on the holding's other entries inside it: when the holding carries a
      reinvested dividend dated inside the quarter and no retirement dated inside it, the amount counted is the latest
      purchase plus that reinvested dividend, because reinvested shares use the quarter's room as purchases do; when the
      holding carries a retirement dated inside the quarter, the amount counted is the latest purchase less that
      retirement; otherwise it is the latest purchase alone.
      The quarter-limit relationship tolerance rests on the member's borrowing with the association: a member with an
      active farm real estate loan whose principal balance is qtol_farm_threshold_usd or more and an active operating line
      gets qtol_relationship_both_usd; a member with only one of those two gets qtol_relationship_one_usd; a member with
      neither gets none.
      The quarter-limit reinvestment tolerance rests on the holding's reinvestment record: at least qtol_reinvest_long
      reinvested dividend entries give qtol_reinvest_long_usd; at least qtol_reinvest_mid but fewer than
      qtol_reinvest_long give qtol_reinvest_mid_usd; fewer give none.
      The quarter-limit tenure tolerance rests on the holding's age: a holding issued at least qtol_tenure_long_months
      whole months before today gets qtol_tenure_long_usd; at least qtol_tenure_mid_months but fewer than
      qtol_tenure_long_months gets qtol_tenure_mid_usd; a younger holding gets none.
      A purchase whose counted amount is within the quarter's purchase allowance has nothing cancelled under this rule.
    prerequisite: []
    cross_category:
      - category: farmland
        as: branch
        reads: [status, principal_balance]
        note: the quarter-limit relationship tolerance reads the active farm real estate loan's principal balance.
      - category: operating
        as: existence
        reads: [status, commitment_amount]
        note: the quarter-limit relationship tolerance also reads whether an active operating line stands.
    compute:
      - ql_purchase: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_purchase') or 0"
      - ql_purchase_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_purchase') or ''"
      - ql_dividend_in_q: "SUM('equity_transactions', 'amount', event_type='equity_dividend_reinvested', effective_date=K('review_quarter_dividend_date'))"
      - ql_retire_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_retirement') or ''"
      - ql_retire_amt: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_retirement') or 0"
      - ql_retire_in_q: "K('review_quarter_start') <= ql_retire_date <= K('review_quarter_end')"
      - ql_counted: "(ql_purchase + ql_dividend_in_q) if (ql_dividend_in_q > 0 and not ql_retire_in_q) else ((ql_purchase - ql_retire_amt) if ql_retire_in_q else ql_purchase)"
      - ql_farm_principal: "CFIELD('farmland', 'principal_balance', status='active') or 0"
      - ql_has_operating: "(CFIELD('operating', 'commitment_amount', status='active') or 0) > 0"
      - ql_tol_relationship: "K('qtol_relationship_both_usd') if (ql_farm_principal >= K('qtol_farm_threshold_usd') and ql_has_operating) else (K('qtol_relationship_one_usd') if (ql_farm_principal >= K('qtol_farm_threshold_usd') or ql_has_operating) else 0)"
      - ql_reinvest_count: "COUNT('equity_transactions', event_type='equity_dividend_reinvested')"
      - ql_tol_reinvest: "K('qtol_reinvest_long_usd') if ql_reinvest_count >= K('qtol_reinvest_long') else (K('qtol_reinvest_mid_usd') if ql_reinvest_count >= K('qtol_reinvest_mid') else 0)"
      - ql_months_held: "MONTHS(F('issued_date'), NOW)"
      - ql_tol_tenure: "K('qtol_tenure_long_usd') if ql_months_held >= K('qtol_tenure_long_months') else (K('qtol_tenure_mid_usd') if ql_months_held >= K('qtol_tenure_mid_months') else 0)"
      - ql_allowance: "P('preferred_max_purchase_per_quarter_usd') + ql_tol_relationship + ql_tol_reinvest + ql_tol_tenure"
      - result: "RND(MX(0, ql_counted - ql_allowance), 2)"
    compute_basis:
      ql_purchase: "The amount counted against the quarter is the latest purchase alone."
      ql_purchase_date: "the part above it is cancelled as of that purchase's date"
      ql_dividend_in_q: "the quarter under review runs from review_quarter_start to review_quarter_end, and the reinvested dividend paid inside it is the one paid on review_quarter_dividend_date."
      ql_retire_date: "when the holding carries a retirement dated inside the quarter, the amount counted is the latest purchase less that retirement"
      ql_retire_in_q: "when the holding carries a retirement dated inside the quarter, the amount counted is the latest purchase less that retirement"
      ql_counted: "when the holding carries a reinvested dividend dated inside the quarter and no retirement dated inside it, the amount counted is the latest purchase plus that reinvested dividend, because reinvested shares use the quarter's room as purchases do; when the holding carries a retirement dated inside the quarter, the amount counted is the latest purchase less that retirement; otherwise it is the latest purchase alone."
      ql_farm_principal: "a member with an active farm real estate loan whose principal balance is qtol_farm_threshold_usd or more and an active operating line gets qtol_relationship_both_usd"
      ql_has_operating: "a member with an active farm real estate loan whose principal balance is qtol_farm_threshold_usd or more and an active operating line gets qtol_relationship_both_usd"
      ql_tol_relationship: "The quarter-limit relationship tolerance rests on the member's borrowing with the association: a member with an active farm real estate loan whose principal balance is qtol_farm_threshold_usd or more and an active operating line gets qtol_relationship_both_usd; a member with only one of those two gets qtol_relationship_one_usd; a member with neither gets none."
      ql_reinvest_count: "at least qtol_reinvest_long reinvested dividend entries give qtol_reinvest_long_usd"
      ql_tol_reinvest: "The quarter-limit reinvestment tolerance rests on the holding's reinvestment record: at least qtol_reinvest_long reinvested dividend entries give qtol_reinvest_long_usd; at least qtol_reinvest_mid but fewer than qtol_reinvest_long give qtol_reinvest_mid_usd; fewer give none."
      ql_months_held: "a holding issued at least qtol_tenure_long_months whole months before today gets qtol_tenure_long_usd"
      ql_tol_tenure: "The quarter-limit tenure tolerance rests on the holding's age: a holding issued at least qtol_tenure_long_months whole months before today gets qtol_tenure_long_usd; at least qtol_tenure_mid_months but fewer than qtol_tenure_long_months gets qtol_tenure_mid_usd; a younger holding gets none."
      ql_allowance: "the quarter's purchase allowance is instead preferred_max_purchase_per_quarter_usd plus the quarter-limit relationship tolerance, the quarter-limit reinvestment tolerance and the quarter-limit tenure tolerance, all in dollars and added together before the excess is taken."
      result: "The quarter-limit excess is the amount counted against the quarter less the quarter's purchase allowance, never below zero, to the cent."
    factors:
      - id: quarter_counted_amount
        effect: method
        decides: ql_counted
        bindings: [ql_dividend_in_q, ql_retire_date, ql_retire_amt, ql_retire_in_q, ql_counted]
        ladder:
          - when: "a reinvested dividend dated inside the quarter and no retirement dated inside it"
            method: "the latest purchase plus that reinvested dividend"
          - when: "a retirement dated inside the quarter"
            method: "the latest purchase less that retirement"
          - when: "otherwise"
            method: "the latest purchase alone"
        baseline:
          ql_counted: "ql_purchase"
        evidence: [history, date]
        cross_difficulty: null
      - id: quarter_relationship_tolerance
        effect: parameter
        decides: ql_tol_relationship
        bindings: [ql_farm_principal, ql_has_operating, ql_tol_relationship]
        ladder:
          - when: "an active farm real estate loan with a principal balance of qtol_farm_threshold_usd or more and an active operating line"
            value: "K('qtol_relationship_both_usd')"
          - when: "only one of an active farm real estate loan of qtol_farm_threshold_usd or more and an active operating line"
            value: "K('qtol_relationship_one_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          ql_tol_relationship: "0"
        evidence: [cross_category]
        cross_difficulty: farmland
      - id: quarter_reinvestment_tolerance
        effect: parameter
        decides: ql_tol_reinvest
        bindings: [ql_reinvest_count, ql_tol_reinvest]
        ladder:
          - when: "at least qtol_reinvest_long reinvested dividend entries"
            value: "K('qtol_reinvest_long_usd')"
          - when: "at least qtol_reinvest_mid but fewer than qtol_reinvest_long reinvested dividend entries"
            value: "K('qtol_reinvest_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          ql_tol_reinvest: "0"
        evidence: [history]
        cross_difficulty: null
      - id: quarter_tenure_tolerance
        effect: parameter
        decides: ql_tol_tenure
        bindings: [ql_months_held, ql_tol_tenure]
        ladder:
          - when: "the holding was issued at least qtol_tenure_long_months whole months ago"
            value: "K('qtol_tenure_long_usd')"
          - when: "the holding was issued at least qtol_tenure_mid_months but fewer than qtol_tenure_long_months whole months ago"
            value: "K('qtol_tenure_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          ql_tol_tenure: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The quarter-limit excess is the amount counted against the quarter less the quarter's purchase allowance, never
        below zero, to the cent.
        The amount counted against the quarter is the latest purchase alone.
        The quarter's purchase allowance is preferred_max_purchase_per_quarter_usd.
      params: [preferred_max_purchase_per_quarter_usd]
    inputs:
      history:
        - {table: equity_transactions, aggregate: latest, field: amount, filters: {event_type: equity_purchase}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_dividend_reinvested}}
        - {table: equity_transactions, aggregate: latest, field: effective_date, filters: {event_type: equity_retirement}}
        - {table: equity_transactions, aggregate: count, field: eq_txn_id, filters: {event_type: equity_dividend_reinvested}}
      cross_category: [farmland, operating]

  - id: equity_ext_preferred_dividend_reversal
    base_policy_refs: [equity_preferred_stock]
    overwrite: []
    trigger: state_due
    subject: [equity_dividend_reinvested]
    computes: amount
    target_tool: reverse_preferred_dividend_68f89242
    params:
      reversal_quarter_start: "2026-04-01"
      reversal_quarter_end: "2026-06-30"
      reversal_quarter_days: 91
      waive_farm_threshold_usd: 250000.0
      waive_farm_high_pct: 20
      waive_farm_low_pct: 10
      waive_tenure_long_months: 120
      waive_tenure_mid_months: 60
      waive_tenure_long_pct: 10
      waive_tenure_mid_pct: 5
      waive_reinvest_long: 8
      waive_reinvest_mid: 4
      waive_reinvest_long_pct: 5
      waive_reinvest_mid_pct: 2
    rule: >
      A reinvested Class H Preferred Stock dividend that was figured on shares later cancelled as above a quarter's
      purchase allowance is reversed in part: the reinvested shares that the cancelled shares earned are cancelled in one
      entry dated the day the reversal is booked, with reason subscription cancelled and nothing paid out; the dividend
      concerned is the holding's latest reinvested dividend, whose quarter runs from reversal_quarter_start to
      reversal_quarter_end, reversal_quarter_days days.
      The reversal on a reinvested dividend is worked out only after the holding carries the cancellation entry for
      every purchase share above its quarter's purchase allowance.
      The dividend reversal is the latest reinvested dividend times the cancelled shares, divided by the shares the
      holding carried on its books at that quarter's end, rounded half up to the cent once, on the final figure.
      The cancelled shares are the amount of the holding's latest subscription-cancelled entry, and the shares carried at
      the quarter's end are the present shares (purchases plus reinvested dividends less retirements) less the latest
      reinvested dividend plus the cancelled shares.
      Where the rules below set a holding-period fraction or reversal waivers, the dividend reversal is instead the latest
      reinvested dividend times the cancelled shares times the holding-period fraction, divided by the shares carried at
      the quarter's end, times 100 less the sum of the reversal waivers, divided by 100, rounded half up to the cent once,
      on that final figure.
      The holding-period fraction charges the cancelled shares only for the part of the quarter they stood on the
      holding: when the cancellation is dated inside the dividend's quarter, the fraction is the days from the
      cancellation date to the quarter's last day, both counted, divided by the days in the quarter; when it is dated
      after the quarter's end, the fraction is zero; otherwise the fraction is one.
      The reversal farm waiver shares the cost of the association's acceptance of the excess with borrowing members: a
      member with an active farm real estate loan whose principal balance is waive_farm_threshold_usd or more has
      waive_farm_high_pct percent of the reversal waived; a member with an active farm real estate loan below that has
      waive_farm_low_pct percent waived; any other member has none waived.
      The reversal tenure waiver rests on the holding's age: a holding issued at least waive_tenure_long_months whole
      months before today has waive_tenure_long_pct percent waived; at least waive_tenure_mid_months but fewer than
      waive_tenure_long_months has waive_tenure_mid_pct percent waived; a younger holding has none waived.
      The reversal reinvestment waiver rests on the holding's reinvestment record: at least waive_reinvest_long reinvested
      dividend entries have waive_reinvest_long_pct percent waived; at least waive_reinvest_mid but fewer than
      waive_reinvest_long have waive_reinvest_mid_pct percent waived; fewer have none waived.
      A holding with no subscription-cancelled entry, or whose latest reinvested dividend was figured before the cancelled
      shares were bought, has nothing reversed under this rule.
    prerequisite:
      - problem: equity_ext_preferred_quarter_limit_refund
        kind: value_input
        gate: dr_cancelled
        form: state
        policy_source: >-
          The reversal on a reinvested dividend is worked out only after the holding carries the cancellation entry for
          every purchase share above its quarter's purchase allowance.
        condition: >-
          The Class H Preferred Stock holding carries a subscription-cancelled entry, dated as of the over-allowance
          purchase, for the part of that purchase above its quarter's purchase allowance.
        resolved_by: refund_preferred_quarter_excess_3d5c0453
        effect: >-
          Once the cancellation entry stands, the cancelled shares and the shares carried at the quarter's end take the
          refunded amount, and the holding-period fraction is read from its date, so the dividend reversal becomes a
          positive figure.
    cross_category:
      - category: farmland
        as: branch
        reads: [status, principal_balance]
        note: the reversal farm waiver reads the active farm real estate loan principal balance.
    compute:
      - dr_purchased: "SUM('equity_transactions', 'amount', event_type='equity_purchase')"
      - dr_reinvested: "SUM('equity_transactions', 'amount', event_type='equity_dividend_reinvested')"
      - dr_retired: "SUM('equity_transactions', 'amount', event_type='equity_retirement')"
      - dr_dividend: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_dividend_reinvested') or 0"
      - dr_cancelled: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_retirement', retirement_reason='subscription_cancelled') or 0"
      - dr_cancel_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_retirement', retirement_reason='subscription_cancelled') or ''"
      - dr_end_shares: "dr_purchased + dr_reinvested - dr_retired - dr_dividend + dr_cancelled"
      - dr_fraction: "((DAYS(dr_cancel_date, K('reversal_quarter_end')) + 1) / K('reversal_quarter_days')) if (dr_cancel_date != '' and K('reversal_quarter_start') <= dr_cancel_date <= K('reversal_quarter_end')) else (0 if (dr_cancel_date != '' and dr_cancel_date > K('reversal_quarter_end')) else 1)"
      - dr_farm_principal: "CFIELD('farmland', 'principal_balance', status='active') or 0"
      - dr_waive_farm: "K('waive_farm_high_pct') if dr_farm_principal >= K('waive_farm_threshold_usd') else (K('waive_farm_low_pct') if dr_farm_principal > 0 else 0)"
      - dr_months_held: "MONTHS(F('issued_date'), NOW)"
      - dr_waive_tenure: "K('waive_tenure_long_pct') if dr_months_held >= K('waive_tenure_long_months') else (K('waive_tenure_mid_pct') if dr_months_held >= K('waive_tenure_mid_months') else 0)"
      - dr_reinvest_count: "COUNT('equity_transactions', event_type='equity_dividend_reinvested')"
      - dr_waive_reinvest: "K('waive_reinvest_long_pct') if dr_reinvest_count >= K('waive_reinvest_long') else (K('waive_reinvest_mid_pct') if dr_reinvest_count >= K('waive_reinvest_mid') else 0)"
      - result: "RND(dr_dividend * dr_cancelled * dr_fraction / dr_end_shares * (100 - dr_waive_farm - dr_waive_tenure - dr_waive_reinvest) / 100, 2) if dr_end_shares > 0 else 0"
    compute_basis:
      dr_purchased: "the shares carried at the quarter's end are the present shares (purchases plus reinvested dividends less retirements) less the latest reinvested dividend plus the cancelled shares."
      dr_reinvested: "the shares carried at the quarter's end are the present shares (purchases plus reinvested dividends less retirements) less the latest reinvested dividend plus the cancelled shares."
      dr_retired: "the shares carried at the quarter's end are the present shares (purchases plus reinvested dividends less retirements) less the latest reinvested dividend plus the cancelled shares."
      dr_dividend: "the dividend concerned is the holding's latest reinvested dividend, whose quarter runs from reversal_quarter_start to reversal_quarter_end, reversal_quarter_days days."
      dr_cancelled: "The cancelled shares are the amount of the holding's latest subscription-cancelled entry"
      dr_cancel_date: "when the cancellation is dated inside the dividend's quarter, the fraction is the days from the cancellation date to the quarter's last day, both counted, divided by the days in the quarter"
      dr_end_shares: "the shares carried at the quarter's end are the present shares (purchases plus reinvested dividends less retirements) less the latest reinvested dividend plus the cancelled shares."
      dr_fraction: "The holding-period fraction charges the cancelled shares only for the part of the quarter they stood on the holding: when the cancellation is dated inside the dividend's quarter, the fraction is the days from the cancellation date to the quarter's last day, both counted, divided by the days in the quarter; when it is dated after the quarter's end, the fraction is zero; otherwise the fraction is one."
      dr_farm_principal: "a member with an active farm real estate loan whose principal balance is waive_farm_threshold_usd or more has waive_farm_high_pct percent of the reversal waived"
      dr_waive_farm: "The reversal farm waiver shares the cost of the association's acceptance of the excess with borrowing members: a member with an active farm real estate loan whose principal balance is waive_farm_threshold_usd or more has waive_farm_high_pct percent of the reversal waived; a member with an active farm real estate loan below that has waive_farm_low_pct percent waived; any other member has none waived."
      dr_months_held: "a holding issued at least waive_tenure_long_months whole months before today has waive_tenure_long_pct percent waived"
      dr_waive_tenure: "The reversal tenure waiver rests on the holding's age: a holding issued at least waive_tenure_long_months whole months before today has waive_tenure_long_pct percent waived; at least waive_tenure_mid_months but fewer than waive_tenure_long_months has waive_tenure_mid_pct percent waived; a younger holding has none waived."
      dr_reinvest_count: "at least waive_reinvest_long reinvested dividend entries have waive_reinvest_long_pct percent waived"
      dr_waive_reinvest: "The reversal reinvestment waiver rests on the holding's reinvestment record: at least waive_reinvest_long reinvested dividend entries have waive_reinvest_long_pct percent waived; at least waive_reinvest_mid but fewer than waive_reinvest_long have waive_reinvest_mid_pct percent waived; fewer have none waived."
      result: "the dividend reversal is instead the latest reinvested dividend times the cancelled shares times the holding-period fraction, divided by the shares carried at the quarter's end, times 100 less the sum of the reversal waivers, divided by 100, rounded half up to the cent once, on that final figure."
    factors:
      - id: reversal_holding_period
        effect: method
        decides: dr_fraction
        bindings: [dr_cancel_date, dr_fraction]
        ladder:
          - when: "the cancellation is dated inside the dividend's quarter"
            method: "days from the cancellation date to the quarter's last day, both counted, over the days in the quarter"
          - when: "the cancellation is dated after the quarter's end"
            method: "zero: the cancelled shares earned nothing in that quarter"
          - when: "otherwise"
            method: "one: the whole quarter"
        baseline:
          dr_fraction: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: reversal_farm_waiver
        effect: parameter
        decides: dr_waive_farm
        bindings: [dr_farm_principal, dr_waive_farm]
        ladder:
          - when: "an active farm real estate loan with a principal balance of waive_farm_threshold_usd or more"
            value: "K('waive_farm_high_pct')"
          - when: "an active farm real estate loan with a principal balance below waive_farm_threshold_usd"
            value: "K('waive_farm_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          dr_waive_farm: "0"
        evidence: [cross_category]
        cross_difficulty: farmland
      - id: reversal_tenure_waiver
        effect: parameter
        decides: dr_waive_tenure
        bindings: [dr_months_held, dr_waive_tenure]
        ladder:
          - when: "the holding was issued at least waive_tenure_long_months whole months ago"
            value: "K('waive_tenure_long_pct')"
          - when: "the holding was issued at least waive_tenure_mid_months but fewer than waive_tenure_long_months whole months ago"
            value: "K('waive_tenure_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          dr_waive_tenure: "0"
        evidence: [date]
        cross_difficulty: null
      - id: reversal_reinvestment_waiver
        effect: parameter
        decides: dr_waive_reinvest
        bindings: [dr_reinvest_count, dr_waive_reinvest]
        ladder:
          - when: "at least waive_reinvest_long reinvested dividend entries"
            value: "K('waive_reinvest_long_pct')"
          - when: "at least waive_reinvest_mid but fewer than waive_reinvest_long reinvested dividend entries"
            value: "K('waive_reinvest_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          dr_waive_reinvest: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The dividend reversal is the latest reinvested dividend times the cancelled shares, divided by the shares the
        holding carried on its books at that quarter's end, rounded half up to the cent once, on the final figure.
        The cancelled shares are the amount of the holding's latest subscription-cancelled entry, and the shares carried at
        the quarter's end are the present shares (purchases plus reinvested dividends less retirements) less the latest
        reinvested dividend plus the cancelled shares.
      params: []
    inputs:
      history:
        - {table: equity_transactions, aggregate: latest, field: amount, filters: {event_type: equity_dividend_reinvested}}
        - {table: equity_transactions, aggregate: latest, field: amount, filters: {event_type: equity_retirement, retirement_reason: subscription_cancelled}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_purchase}}
        - {table: equity_transactions, aggregate: count, field: eq_txn_id, filters: {event_type: equity_dividend_reinvested}}
      cross_category: [farmland]

  - id: equity_ext_preferred_purchase_room
    base_policy_refs: [equity_agg_class_combination, equity_stock_requirement, equity_preferred_stock]
    overwrite:
      - base_policy: equity_preferred_stock
        superseded_clause: >-
          A purchase must be at least min_purchase_usd in multiples of purchase_increment_usd, may not take the holding
          above max_holding_usd
        replaced_by: >-
          the holding room is instead max_holding_usd less the present shares, less the dividend cushion and less the
          operating reserve
    trigger: on_request
    subject: [equity_purchase]
    computes: amount
    target_tool: submit_preferred_purchase_895be76e
    params:
      room_quarter_start: "2026-07-01"
      room_quarter_end: "2026-09-30"
      cushion_size_high_usd: 500000.0
      cushion_size_mid_usd: 100000.0
      cushion_size_high_quarters: 6
      cushion_size_mid_quarters: 3
      cushion_loyal_months: 120
      cushion_loyal_both_quarters: 2
      cushion_loyal_one_quarters: 1
      recent_dividend_months: 3
      stale_dividend_months: 6
      reserve_high_ratio: 0.75
      reserve_mid_ratio: 0.5
      reserve_high_pct: 10
      reserve_mid_pct: 5
    rule: >
      A member who asks to buy as much Class H Preferred Stock as the rules allow at once buys, on their own
      authorization and paid by an electronic draw from the checking account on record, the purchase room in whole
      multiples of purchase_increment_usd; when the purchase room is below min_purchase_usd nothing can be bought.
      The purchase room is fixed only after the holding carries the cancellation entry for every share that a purchase
      took above its quarter's purchase allowance.
      Before the purchase room is worked out, every reinvested dividend earned by cancelled shares must stand reversed on
      the holding.
      The purchase room is the lesser of the quarter room and the holding room, cut down to a whole multiple of
      purchase_increment_usd.
      The quarter room is preferred_max_purchase_per_quarter_usd less the holding's latest purchase when that is dated
      inside the current quarter, which runs from room_quarter_start to room_quarter_end.
      The holding room is max_holding_usd less the present shares, the present shares being purchases plus reinvested
      dividends less retirements.
      Where the rules below set a dividend cushion or an operating reserve, the holding room is instead max_holding_usd
      less the present shares, less the dividend cushion and less the operating reserve, so that coming reinvested
      dividends and an operating paydown fit under the maximum.
      The dividend cushion is the cushion quarters times the cushion dividend estimate, and the cushion quarters are the
      size quarters plus the loyalty quarters.
      The size quarters rest on the present shares: present shares of cushion_size_high_usd or more give
      cushion_size_high_quarters; cushion_size_mid_usd or more but below cushion_size_high_usd give
      cushion_size_mid_quarters; smaller holdings give none.
      The loyalty quarters rest on whether the holding keeps reinvesting and how long it has been held: a holding with a
      reinvested dividend dated within the last recent_dividend_months whole months and issued at least
      cushion_loyal_months whole months before today gives cushion_loyal_both_quarters; a holding meeting exactly one of
      those two conditions gives cushion_loyal_one_quarters; a holding meeting neither gives none.
      The cushion dividend estimate depends on the holding's latest dividend entries: when a dividend-reversal entry
      (subscription cancelled with nothing paid out) is dated on or after the latest reinvested dividend and a reinvested
      dividend is dated within the last stale_dividend_months whole months, the estimate is the latest reinvested
      dividend less that reversal; when no reinvested dividend is dated within the last stale_dividend_months whole
      months, the estimate is the present shares times dividend_rate_pct divided by 400; otherwise the estimate is the
      latest reinvested dividend.
      The operating reserve rests on how far the member's active operating line is drawn: a line drawn to
      reserve_high_ratio of its commitment or more holds back reserve_high_pct percent of its outstanding principal; a
      line drawn to reserve_mid_ratio or more but below reserve_high_ratio holds back reserve_mid_pct percent; a line
      drawn less, or no active line, holds back nothing.
    prerequisite:
      - problem: equity_ext_preferred_quarter_limit_refund
        kind: value_input
        gate: pr_shares
        form: state
        policy_source: >-
          The purchase room is fixed only after the holding carries the cancellation entry for every share that a
          purchase took above its quarter's purchase allowance.
        condition: >-
          The Class H Preferred Stock holding carries a subscription-cancelled entry for the part of its latest purchase
          above that purchase's quarter's purchase allowance.
        resolved_by: refund_preferred_quarter_excess_3d5c0453
        effect: >-
          Once the cancellation stands, the present shares fall by the refunded amount, so the holding room and the
          purchase room rise by it (before whole-increment rounding).
      - problem: equity_ext_preferred_dividend_reversal
        kind: value_input
        gate: pr_estimate
        form: state
        policy_source: >-
          Before the purchase room is worked out, every reinvested dividend earned by cancelled shares must stand
          reversed on the holding.
        condition: >-
          The holding carries a dividend-reversal entry (subscription cancelled, nothing paid out) dated after its latest
          reinvested dividend, for the dividend the cancelled shares earned.
        resolved_by: reverse_preferred_dividend_68f89242
        effect: >-
          Once the reversal stands, the present shares fall by it and the cushion dividend estimate becomes the latest
          reinvested dividend less the reversal, so the dividend cushion and the holding room change.
    cross_category:
      - category: operating
        as: branch
        reads: [status, commitment_amount, outstanding_principal]
        note: the operating reserve is read from the active operating line's outstanding principal against its commitment.
    compute:
      - pr_purchased: "SUM('equity_transactions', 'amount', event_type='equity_purchase')"
      - pr_reinvested: "SUM('equity_transactions', 'amount', event_type='equity_dividend_reinvested')"
      - pr_retired: "SUM('equity_transactions', 'amount', event_type='equity_retirement')"
      - pr_shares: "pr_purchased + pr_reinvested - pr_retired"
      - pr_last_purchase: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_purchase') or 0"
      - pr_last_purchase_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_purchase') or ''"
      - pr_quarter_room: "P('preferred_max_purchase_per_quarter_usd') - (pr_last_purchase if K('room_quarter_start') <= pr_last_purchase_date <= K('room_quarter_end') else 0)"
      - pr_size_quarters: "K('cushion_size_high_quarters') if pr_shares >= K('cushion_size_high_usd') else (K('cushion_size_mid_quarters') if pr_shares >= K('cushion_size_mid_usd') else 0)"
      - pr_recent_dividends: "COUNT('equity_transactions', within_months=K('recent_dividend_months'), date_field='effective_date', event_type='equity_dividend_reinvested')"
      - pr_months_held: "MONTHS(F('issued_date'), NOW)"
      - pr_loyal_quarters: "K('cushion_loyal_both_quarters') if (pr_recent_dividends >= 1 and pr_months_held >= K('cushion_loyal_months')) else (K('cushion_loyal_one_quarters') if (pr_recent_dividends >= 1 or pr_months_held >= K('cushion_loyal_months')) else 0)"
      - pr_latest_dividend: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_dividend_reinvested') or 0"
      - pr_latest_dividend_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_dividend_reinvested') or ''"
      - pr_reversal: "LATEST('equity_transactions', 'amount', date_field='effective_date', event_type='equity_retirement', retirement_reason='subscription_cancelled', payment_method='none') or 0"
      - pr_reversal_date: "LATEST('equity_transactions', 'effective_date', date_field='effective_date', event_type='equity_retirement', retirement_reason='subscription_cancelled', payment_method='none') or ''"
      - pr_stale_window: "COUNT('equity_transactions', within_months=K('stale_dividend_months'), date_field='effective_date', event_type='equity_dividend_reinvested')"
      - pr_estimate: "(pr_latest_dividend - pr_reversal) if (pr_reversal_date != '' and pr_reversal_date >= pr_latest_dividend_date and pr_stale_window >= 1) else ((pr_shares * P('dividend_rate_pct') / 400) if pr_stale_window == 0 else pr_latest_dividend)"
      - pr_cushion: "(pr_size_quarters + pr_loyal_quarters) * pr_estimate"
      - pr_op_out: "CFIELD('operating', 'outstanding_principal', status='active') or 0"
      - pr_op_commit: "CFIELD('operating', 'commitment_amount', status='active') or 0"
      - pr_reserve_pct: "K('reserve_high_pct') if (pr_op_commit > 0 and pr_op_out >= K('reserve_high_ratio') * pr_op_commit) else (K('reserve_mid_pct') if (pr_op_commit > 0 and pr_op_out >= K('reserve_mid_ratio') * pr_op_commit) else 0)"
      - pr_reserve: "pr_op_out * pr_reserve_pct / 100"
      - pr_hold_room: "P('max_holding_usd') - pr_shares - pr_cushion - pr_reserve"
      - pr_room: "MN(pr_quarter_room, pr_hold_room)"
      - result: "float(int(pr_room / P('purchase_increment_usd')) * P('purchase_increment_usd')) if pr_room >= P('min_purchase_usd') else 0.0"
    compute_basis:
      pr_purchased: "The holding room is max_holding_usd less the present shares, the present shares being purchases plus reinvested dividends less retirements."
      pr_reinvested: "The holding room is max_holding_usd less the present shares, the present shares being purchases plus reinvested dividends less retirements."
      pr_retired: "The holding room is max_holding_usd less the present shares, the present shares being purchases plus reinvested dividends less retirements."
      pr_last_purchase: "The quarter room is preferred_max_purchase_per_quarter_usd less the holding's latest purchase when that is dated inside the current quarter, which runs from room_quarter_start to room_quarter_end."
      pr_quarter_room: "The quarter room is preferred_max_purchase_per_quarter_usd less the holding's latest purchase when that is dated inside the current quarter, which runs from room_quarter_start to room_quarter_end."
      pr_size_quarters: "The size quarters rest on the present shares: present shares of cushion_size_high_usd or more give cushion_size_high_quarters; cushion_size_mid_usd or more but below cushion_size_high_usd give cushion_size_mid_quarters; smaller holdings give none."
      pr_recent_dividends: "a holding with a reinvested dividend dated within the last recent_dividend_months whole months and issued at least cushion_loyal_months whole months before today gives cushion_loyal_both_quarters"
      pr_months_held: "a holding with a reinvested dividend dated within the last recent_dividend_months whole months and issued at least cushion_loyal_months whole months before today gives cushion_loyal_both_quarters"
      pr_loyal_quarters: "The loyalty quarters rest on whether the holding keeps reinvesting and how long it has been held: a holding with a reinvested dividend dated within the last recent_dividend_months whole months and issued at least cushion_loyal_months whole months before today gives cushion_loyal_both_quarters; a holding meeting exactly one of those two conditions gives cushion_loyal_one_quarters; a holding meeting neither gives none."
      pr_latest_dividend: "otherwise the estimate is the latest reinvested dividend."
      pr_reversal: "when a dividend-reversal entry (subscription cancelled with nothing paid out) is dated on or after the latest reinvested dividend and a reinvested dividend is dated within the last stale_dividend_months whole months, the estimate is the latest reinvested dividend less that reversal"
      pr_stale_window: "when no reinvested dividend is dated within the last stale_dividend_months whole months, the estimate is the present shares times dividend_rate_pct divided by 400"
      pr_estimate: "The cushion dividend estimate depends on the holding's latest dividend entries: when a dividend-reversal entry (subscription cancelled with nothing paid out) is dated on or after the latest reinvested dividend and a reinvested dividend is dated within the last stale_dividend_months whole months, the estimate is the latest reinvested dividend less that reversal; when no reinvested dividend is dated within the last stale_dividend_months whole months, the estimate is the present shares times dividend_rate_pct divided by 400; otherwise the estimate is the latest reinvested dividend."
      pr_cushion: "The dividend cushion is the cushion quarters times the cushion dividend estimate, and the cushion quarters are the size quarters plus the loyalty quarters."
      pr_op_out: "a line drawn to reserve_high_ratio of its commitment or more holds back reserve_high_pct percent of its outstanding principal"
      pr_op_commit: "a line drawn to reserve_high_ratio of its commitment or more holds back reserve_high_pct percent of its outstanding principal"
      pr_reserve_pct: "The operating reserve rests on how far the member's active operating line is drawn: a line drawn to reserve_high_ratio of its commitment or more holds back reserve_high_pct percent of its outstanding principal; a line drawn to reserve_mid_ratio or more but below reserve_high_ratio holds back reserve_mid_pct percent; a line drawn less, or no active line, holds back nothing."
      pr_hold_room: "the holding room is instead max_holding_usd less the present shares, less the dividend cushion and less the operating reserve, so that coming reinvested dividends and an operating paydown fit under the maximum."
      pr_room: "The purchase room is the lesser of the quarter room and the holding room, cut down to a whole multiple of purchase_increment_usd."
      result: "the purchase room in whole multiples of purchase_increment_usd; when the purchase room is below min_purchase_usd nothing can be bought."
    factors:
      - id: cushion_size_quarters
        effect: parameter
        decides: pr_size_quarters
        bindings: [pr_purchased, pr_reinvested, pr_retired, pr_size_quarters]
        ladder:
          - when: "present shares of cushion_size_high_usd or more"
            value: "K('cushion_size_high_quarters')"
          - when: "present shares of cushion_size_mid_usd or more but below cushion_size_high_usd"
            value: "K('cushion_size_mid_quarters')"
          - when: "otherwise"
            value: "0"
        baseline:
          pr_size_quarters: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cushion_loyalty_quarters
        effect: parameter
        decides: pr_loyal_quarters
        bindings: [pr_recent_dividends, pr_months_held, pr_loyal_quarters]
        ladder:
          - when: "a reinvested dividend dated within the last recent_dividend_months whole months and the holding issued at least cushion_loyal_months whole months ago"
            value: "K('cushion_loyal_both_quarters')"
          - when: "exactly one of those two conditions"
            value: "K('cushion_loyal_one_quarters')"
          - when: "otherwise"
            value: "0"
        baseline:
          pr_loyal_quarters: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cushion_dividend_estimate
        effect: method
        decides: pr_estimate
        bindings: [pr_latest_dividend, pr_latest_dividend_date, pr_reversal, pr_reversal_date, pr_stale_window, pr_estimate]
        ladder:
          - when: "a dividend-reversal entry dated on or after the latest reinvested dividend, and a reinvested dividend within the last stale_dividend_months whole months"
            method: "the latest reinvested dividend less that reversal"
          - when: "no reinvested dividend within the last stale_dividend_months whole months"
            method: "present shares times dividend_rate_pct divided by 400"
          - when: "otherwise"
            method: "the latest reinvested dividend"
        baseline:
          pr_estimate: "pr_latest_dividend"
        evidence: [history, date]
        cross_difficulty: null
      - id: operating_reserve
        effect: parameter
        decides: pr_reserve_pct
        bindings: [pr_op_out, pr_op_commit, pr_reserve_pct]
        ladder:
          - when: "an active operating line drawn to reserve_high_ratio of its commitment or more"
            value: "K('reserve_high_pct') percent of its outstanding principal"
          - when: "an active operating line drawn to reserve_mid_ratio or more but below reserve_high_ratio"
            value: "K('reserve_mid_pct') percent of its outstanding principal"
          - when: "otherwise"
            value: "0"
        baseline:
          pr_reserve_pct: "0"
        evidence: [cross_category]
        cross_difficulty: operating
    baseline:
      rule: >-
        The purchase room is the lesser of the quarter room and the holding room, cut down to a whole multiple of
        purchase_increment_usd.
        The quarter room is preferred_max_purchase_per_quarter_usd less the holding's latest purchase when that is dated
        inside the current quarter, which runs from room_quarter_start to room_quarter_end.
        The holding room is max_holding_usd less the present shares, the present shares being purchases plus reinvested
        dividends less retirements.
      params: [preferred_max_purchase_per_quarter_usd, max_holding_usd, purchase_increment_usd, min_purchase_usd]
    inputs:
      history:
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_purchase}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_dividend_reinvested}}
        - {table: equity_transactions, aggregate: sum, field: amount, filters: {event_type: equity_retirement}}
        - {table: equity_transactions, aggregate: latest, field: amount, filters: {event_type: equity_dividend_reinvested}}
        - {table: equity_transactions, aggregate: count, field: eq_txn_id, within_months: 3, filters: {event_type: equity_dividend_reinvested}}
      cross_category: [operating]
