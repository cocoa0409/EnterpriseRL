      rp_installment: "when the member's active farm real estate loan has its next installment due inside the current quarter, the addition is that installment amount; when no farm real estate installment is due inside the quarter but the member's active equipment loan has its next installment due inside it, the addition is that equipment installment amount; otherwise there is no addition."
      rp_size_reduction: "The redemption size reduction protects the association's capital from large redemptions: a holding that carried size_bracket_high_usd or more at the start of the current quarter has size_reduction_high_pts points taken off; a holding that carried size_bracket_mid_usd or more but below size_bracket_high_usd has size_reduction_mid_pts points taken off; a smaller holding has none taken off."
      rp_request_date: "when today is more than delay_extended_days calendar days after the written request, the addition is delay_addition_extended_pct percent of the amount named on the request"
      rp_days_waiting: "when today is more than delay_extended_days calendar days after the written request, the addition is delay_addition_extended_pct percent of the amount named on the request"
      rp_delay_addition: "The redemption delay addition makes good the association's own delay in paying an approved request: when today is more than delay_extended_days calendar days after the written request, the addition is delay_addition_extended_pct percent of the amount named on the request; when today is more than retirement_processing_days but no more than delay_extended_days calendar days after it, delay_addition_pct percent of that amount; otherwise there is no addition."
      rp_allowance: "the quarter's redemption allowance is instead the redemption allowance base times allowance_pct plus the redemption tenure points plus the redemption reinvestment points less the redemption size reduction, divided by 100, plus the redemption installment addition, plus the redemption delay addition, rounded half up to the cent once, on that final figure."
      rp_pay: "The par amount paid on an approved redemption is the lesser of the amount named on the holding's latest approved preferred redemption request and the quarter's redemption allowance"
      result: "when paying that amount would leave less than min_balance_after_partial_usd on the holding, the whole holding is paid instead."
    factors:
