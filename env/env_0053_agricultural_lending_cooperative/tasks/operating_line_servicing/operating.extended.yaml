    advance_rate_market_livestock_pct: 75.0
    advance_rate_receivables_pct: 85.0
    advance_rate_prepaid_inputs_pct: 70.0
    advance_rate_insured_growing_crops_pct: 60.0
    receivable_max_age_days: 90
    overadvance_tolerance_pct: 7.5
    overadvance_fee_pct: 0.75
    overadvance_max_days: 45
    unused_commitment_fee_pct: 0.25
    max_midterm_increase_pct: 30.0
    commitment_increase_fee_pct: 0.15
    crop_insurance_required: false
    crop_insurance_min_coverage_pct: 0
    max_seasonal_loans_per_crop_year: 2

# ---- data flow (every write is an event) ----
events:
  - type: operating_line_open
    target: operating_lines
    mutation: create
    meaning: A credit application for an operating line or seasonal operating loan is registered for a member.
    grain: One row per application; the row becomes the line once booked.
    fields:
      line_id: Reference of the new line.
      customer_id: Applying member.
      variant_name: Official name of the product applied for.
      commitment_amount: Commitment requested, USD.
      crop_year: Crop or production year to be financed.
      applied_date: Date the application was received.
    triggers: []
  - type: operating_line_book
    target: operating_lines
    mutation: {transition: {from: applied, to: active}}
    meaning: The approved line is closed (note and security agreement signed) and booked for its first term.
    grain: One per line, on the booking date.
    fields:
      opened_date: Booking date; the first term starts this day.
      maturity_date: Booking date plus term_months.
      advance_cutoff_date: Booking date plus advance_period_months, never later than maturity_date.
      interest_rate: Contract rate set under operating_rate_setting.
      autodraft_enrolled: Whether AutoDraft was authorised at closing.
      autodraft_account_last4: Last four digits of the AutoDraft checking account, empty if not enrolled.
    triggers:
      - event: operating:operating_fee_assessed
        map: {fee_code: origination, effective_date: opened_date, channel: system}
  - type: operating_line_decline
    target: operating_lines
    mutation: {transition: {from: applied, to: declined}}
    meaning: The credit decision on the application is a decline.
    grain: One per declined application.
    fields:
      closed_date: Date of the decline decision.
    triggers: []
  - type: operating_line_suspend
    target: operating_lines
    mutation: {transition: {from: active, to: suspended}}
    meaning: Advances on the line are frozen.
    grain: One per freeze.
    fields:
      suspended_reason: Condition that froze advances (past_due_interest, borrowing_base_deficiency or overadvance_uncured).
      suspended_date: Date advances were frozen.
    triggers: []
  - type: operating_line_reinstate
    target: operating_lines
    mutation: {transition: {from: suspended, to: active}}
    meaning: Advances are reopened after the freezing condition is cured.
    grain: One per reinstatement.
    fields:
      suspended_reason: Reset to none.
      suspended_date: Cleared to empty.
    triggers: []
  - type: operating_line_mature
    target: operating_lines
    mutation: {transition: [{from: active, to: matured}, {from: suspended, to: matured}]}
    meaning: The current term reached its maturity date without a renewal taking effect.
    grain: One per term that matures unrenewed.
    fields:
      suspended_reason: Reset to none; a matured line takes no advances in any case.
      suspended_date: Cleared to empty.
    triggers: []
  - type: operating_line_renew
    target: operating_lines
    mutation: update
    meaning: An approved renewal of an active line takes effect at the end of the current term and sets a new term.
    grain: One per renewal of an active line.
    fields:
      maturity_date: Old maturity date plus term_months.
      advance_cutoff_date: Start of the new term plus advance_period_months, never later than the new maturity date.
      commitment_amount: Commitment approved for the new term.
      interest_rate: Contract rate reset under operating_rate_setting on the renewal effective date.
      crop_year: Crop year of the new term.
      last_renewed_date: Renewal effective date (the day after the old maturity date).
      streamlined_renewal_count: Previous count plus 1 for a streamlined renewal, 0 after a full review.
    triggers:
      - event: operating:operating_fee_assessed
        map: {fee_code: renewal, effective_date: last_renewed_date, channel: system}
  - type: operating_line_renew_matured
    target: operating_lines
    mutation: {transition: {from: matured, to: active}}
    meaning: A renewal approved after the line matured takes effect and starts a new term on the renewal effective date.
    grain: One per late renewal.
    fields:
      maturity_date: Renewal effective date plus term_months.
      advance_cutoff_date: Renewal effective date plus advance_period_months, never later than the new maturity date.
      commitment_amount: Commitment approved for the new term.
      interest_rate: Contract rate reset under operating_rate_setting on the renewal effective date.
      crop_year: Crop year of the new term.
      last_renewed_date: Renewal effective date.
      streamlined_renewal_count: Previous count plus 1 for a streamlined renewal, 0 after a full review.
    triggers:
      - event: operating:operating_fee_assessed
        map: {fee_code: renewal, effective_date: last_renewed_date, channel: system}
  - type: operating_line_close
    target: operating_lines
    mutation: {transition: {from: active, to: closed}}
    meaning: The member confirms termination of a line on which nothing is owed.
    grain: One per terminated line.
    fields:
      closed_date: Date the member's confirmation took effect.
    triggers: []
  - type: operating_line_payoff_close
    target: operating_lines
    mutation: {transition: {from: matured, to: closed}}
    meaning: A matured line is closed after the last amount owed on it is paid.
    grain: One per matured line paid in full.
    fields:
      closed_date: Effective date of the payment that brought principal, interest and fees to zero.
    triggers: []
  - type: operating_commitment_increase
    target: operating_lines
    mutation: update
    meaning: An approved mid-term increase of the commitment takes effect.
    grain: One per approved increase.
    fields:
      commitment_amount: New commitment after the increase.
    triggers:
      - event: operating:operating_fee_assessed
        map: {fee_code: commitment_increase, channel: system}
  - type: operating_commitment_decrease
    target: operating_lines
    mutation: update
    meaning: The member reduces the commitment of the line for the rest of the term.
    grain: One per reduction.
    fields:
      commitment_amount: New, lower commitment.
    triggers: []
  - type: operating_autodraft_change
    target: operating_lines
    mutation: update
    meaning: AutoDraft collection of interest bills is authorised, changed to another account, or cancelled.
    grain: One per enrolment change.
    fields:
      autodraft_enrolled: New enrolment flag.
      autodraft_account_last4: Last four digits of the debited checking account, empty when cancelled.
      interest_rate: Contract rate after the AutoDraft discount is added or removed.
    triggers: []
  - type: operating_rate_reset
    target: operating_lines
    mutation: update
    meaning: The contract rate of a variable-rate line moves because the Association Variable Base Rate changed.
    grain: One per line per base-rate change.
    fields:
      interest_rate: New contract rate effective on the base-rate change date.
    triggers: []
  - type: operating_draw
    target: operating_transactions
    meaning: An advance of principal is booked on the line.
    grain: One row per advance.
    distinguish_by: [effective_date, amount, channel, disbursement_method]
    fields:
      amount: Principal advanced, USD.
      effective_date: Date the advance takes effect.
      channel: Channel the advance was requested through.
      disbursement_method: How proceeds were delivered.
    account: principal
    direction: in
    triggers:
      - event: operating:operating_fee_assessed
        when: {disbursement_method: wire}
        map: {fee_code: wire_draw, source_txn_id: txn_id, effective_date: effective_date, channel: system}
  - type: operating_principal_payment
    target: operating_transactions
    meaning: A remittance (or the principal share of one) is applied to principal.
    grain: One row per principal application.
    distinguish_by: [effective_date, amount, channel]
    fields:
      amount: Principal repaid, USD.
      effective_date: Date the payment was received.
      channel: Channel the payment came through.
    account: principal
    direction: out
    triggers: []
  - type: operating_interest_accrual
    target: operating_transactions
    meaning: Interest for one billing period (or the part of a period at one rate) is booked and billed.
    grain: One row per billed period per rate segment.
    distinguish_by: [period_start, period_end, rate_basis]
    fields:
      amount: Interest for the period, USD.
      period_start: First day covered, inclusive.
      period_end: Last day covered, inclusive.
      due_date: Date the billed interest is due.
      rate_applied: Annual rate used.
      rate_basis: contract_rate or post_maturity_rate.
      channel: Always system.
    account: interest_accrued
    direction: in
    triggers: []
  - type: operating_interest_payment
    target: operating_transactions
    meaning: A remittance (or the interest share of one) is applied to one interest bill.
    grain: One row per interest bill paid by one remittance.
    distinguish_by: [effective_date, amount, channel, source_txn_id]
    fields:
      amount: Interest paid, USD.
      effective_date: Date the payment was received.
      channel: Channel the payment came through.
      period_end: Last day of the billed period being paid.
      source_txn_id: The interest accrual row (bill) being paid.
    account: interest_accrued
    direction: out
    triggers: []
  - type: operating_fee_assessed
    target: operating_transactions
    meaning: A fee or charge is assessed on the line.
    grain: One row per fee occurrence.
    distinguish_by: [fee_code, effective_date, period_end, source_txn_id]
    fields:
      fee_code: Which fee.
      amount: Fee amount, USD.
      effective_date: Date assessed.
      period_start: First day of the period for a periodic fee (unused commitment), else empty.
      period_end: Last day of the period for a periodic fee, else empty.
      source_txn_id: The advance, returned payment or interest bill the fee arises from, else empty.
      channel: Always system.
    account: fees
    direction: in
    triggers: []
  - type: operating_fee_payment
    target: operating_transactions
    meaning: A remittance (or the fee share of one) is applied to one assessed fee.
    grain: One row per fee assessment paid by one remittance.
    distinguish_by: [source_txn_id, effective_date, amount, channel]
    fields:
      fee_code: Code of the fee paid.
      amount: Amount applied, USD.
      effective_date: Date the payment was received.
      channel: Channel the payment came through.
      source_txn_id: The fee assessment being paid.
    account: fees
    direction: out
    triggers: []
  - type: operating_fee_waiver
    target: operating_transactions
    meaning: An assessed fee is waived in whole.
    grain: One row per waived fee assessment.
    distinguish_by: [source_txn_id, waiver_basis]
    fields:
      fee_code: Code of the fee waived.
      amount: Unpaid amount of the assessment waived, USD.
      effective_date: Date of the waiver.
      source_txn_id: The fee assessment waived.
      waiver_basis: courtesy, early_renewal or error_correction.
    account: fees
    direction: out
    triggers: []
  - type: operating_principal_payment_return
    target: operating_transactions
    meaning: A principal payment is returned unpaid by the member's bank and reversed.
    grain: One row per returned principal payment.
    distinguish_by: [source_txn_id]
    fields:
      amount: Amount of the original principal payment, USD.
      effective_date: Effective date of the original payment (the reversal is back-dated).
      source_txn_id: The principal payment reversed.
      return_reason: Bank return reason.
    account: principal
    direction: in
    triggers:
      - event: operating:operating_fee_assessed
        when: {return_reason: {not: unauthorized}}
        map: {fee_code: returned_payment, source_txn_id: txn_id, channel: system}
  - type: operating_interest_payment_return
    target: operating_transactions
    meaning: An interest payment is returned unpaid by the member's bank and reversed.
    grain: One row per returned interest payment.
    distinguish_by: [source_txn_id]
    fields:
      amount: Amount of the original interest payment, USD.
      effective_date: Effective date of the original payment (the reversal is back-dated).
      source_txn_id: The interest payment reversed.
      return_reason: Bank return reason.
    account: interest_accrued
    direction: in
    triggers:
      - event: operating:operating_fee_assessed
        when: {return_reason: {not: unauthorized}}
        map: {fee_code: returned_payment, source_txn_id: txn_id, channel: system}
  - type: operating_bbc_submitted
    target: operating_borrowing_base
    meaning: The member delivers a signed borrowing base certificate stating collateral values at an as-of date.
    grain: One row per certificate received.
    distinguish_by: [as_of_date, submitted_date]
    fields:
      as_of_date: Date the values are stated at.
      submitted_date: Date the certificate was received.
      stored_grain_value: Unpriced stored grain, USD.
      contracted_grain_value: Contracted stored grain, USD.
      market_livestock_value: Feeder and slaughter livestock, USD.
      receivables_value: Eligible receivables, USD.
      prepaid_inputs_value: Prepaid unapplied inputs, USD.
      insured_growing_crops_value: Crop insurance guarantee on planted crops, USD.
      borrowing_base_amount: Lendable value computed under operating_borrowing_base_calculation.
      submission_channel: How the certificate arrived.
    triggers: []

# ---- derived measures ----
measures:
  - id: operating_msr_courtesy_waivers_12m
    window: Rolling 12 months ending on the date of the waiver being considered, from the same calendar date one year earlier (exclusive) through that date (inclusive).
    measure: Count of operating_fee_waiver rows on the line with waiver_basis courtesy whose effective_date falls in the window.
  - id: operating_msr_online_draws_day
    window: The single calendar day equal to the effective date of the advance being considered.
    measure: Sum of amount over operating_draw rows on the line with channel online_banking or mobile_app and that effective_date.
  - id: operating_msr_phone_draws_day
    window: The single calendar day equal to the effective date of the advance being considered.
    measure: Sum of amount over operating_draw rows on the line with channel phone and that effective_date.
  - id: operating_msr_term_advances
    window: The current term, from its start (last_renewed_date when present, otherwise opened_date) through the date considered, inclusive.
    measure: Sum of amount over operating_draw rows on the line in the window, less nothing for repayments (used for non-revolving availability).
  - id: operating_msr_latest_bbc
    window: All borrowing base certificates on the line.
    measure: The operating_bbc_submitted row with the latest as_of_date (ties broken by the latest submitted_date); yields its as_of_date and borrowing_base_amount.
  - id: operating_msr_principal_day_sum
    window: The days of the period being billed, period_start through period_end inclusive.
    measure: Sum over each calendar day of the end-of-day outstanding principal (advances, payments and back-dated returns effective that day included).
  - id: operating_msr_period_days
    window: The period being billed.
    measure: Number of calendar days from period_start through period_end inclusive.
  - id: operating_msr_bill_paid
    window: All rows on the line.
    measure: Sum of amount over operating_interest_payment rows whose source_txn_id is the interest bill considered, minus the amount of operating_interest_payment_return rows reversing any of those payments.
  - id: operating_msr_returns_12m
    window: Rolling 12 months ending on the date considered, from the same calendar date one year earlier (exclusive) through that date (inclusive).
    measure: Count of operating_principal_payment_return and operating_interest_payment_return rows on the line whose original payment came through channel autodraft.
  - id: operating_msr_portfolio_commitment
    window: The member's lines at the moment considered.
    measure: Sum of commitment_amount over the member's operating_lines in applied, active, suspended or matured status, excluding the line being changed, plus the commitment requested for it.
  - id: operating_msr_base_rate
    window: The Association Variable Base Rate history registered in operating_rate_setting.
    measure: rate_pct of the latest history entry whose effective_date is on or before the rate effective date being considered.
  - id: operating_msr_active_farmland
    window: The member's portfolio on the rate effective date.
    measure: Count of the member's farmland_loans rows in active status.
  - id: operating_msr_assigned_crop_policy
    window: The member's crop insurance policies on the certificate as-of date.
    measure: Count of the member's cropins_policies rows in active status for the line's crop_year whose indemnity is assigned to the association and whose coverage level is at least crop_insurance_min_coverage_pct.

# ---- policies ----
policies:
  - id: operating_agg_multi_holding
    subject: [operating_line_open]
    rule: >-
      A member may hold at most max_per_customer operating credit products at one time, counting every line in applied,
      active, suspended or matured status; closed and declined lines do not count. Within that cap a member may hold only
      one revolving product (StartRight Operating Line, ExpressLine Operating Credit, Revolving Operating Line, Borrowing
      Base Operating Line or Agribusiness Revolving Line); the rest of the cap can only be Seasonal Operating Loans, and no
      more than max_seasonal_loans_per_crop_year of them may finance the same crop year. A new revolving application is
      not registered when the member already holds a revolving product in applied, active, suspended or matured status;
      the member is instead offered a commitment change or a renewal of the line already held. An application that would
      exceed the overall cap is not registered. When the existing revolving product is matured, the member is offered a
      renewal of it rather than a second line.
    eligibility:
      - id: one_revolving_product
        applies_to: [operating_line_open]
        kind: dedup
        condition: "A new revolving application is not registered when the member already holds a revolving product in applied, active, suspended or matured status"
        evidence_fields: [operating_lines.customer_id, operating_lines.variant_name, operating_lines.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.customer_id]]
          action_bindings: {operating_lines.customer_id: customer_id}
        dedup_contract:
          table: operating_lines
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, suspended, matured]}
          distinct_fields: [variant_name, crop_year]
    params:
      max_per_customer: 3
      per_tier:
        StartRight Operating Line: {max_seasonal_loans_per_crop_year: "=max_seasonal_loans_per_crop_year"}
        ExpressLine Operating Credit: {max_seasonal_loans_per_crop_year: "=max_seasonal_loans_per_crop_year"}
        Seasonal Operating Loan: {max_seasonal_loans_per_crop_year: "=max_seasonal_loans_per_crop_year"}
        Revolving Operating Line: {max_seasonal_loans_per_crop_year: "=max_seasonal_loans_per_crop_year"}
        Borrowing Base Operating Line: {max_seasonal_loans_per_crop_year: "=max_seasonal_loans_per_crop_year"}
        Agribusiness Revolving Line: {max_seasonal_loans_per_crop_year: "=max_seasonal_loans_per_crop_year"}

  - id: operating_agg_portfolio_commitment
    subject: [operating_line_open, operating_commitment_increase, operating_line_renew, operating_line_renew_matured]
    rule: >-
      Commitments are aggregated across the member's operating credit. The combined commitment of all the member's lines
      in applied, active, suspended or matured status, with the line being opened, increased or renewed counted at its
      requested commitment (operating_msr_portfolio_commitment), may not exceed the max_commitment_usd of the
      highest-ranked product among those lines. When any of those lines is a StartRight Operating Line, the combined cap
      is the StartRight Operating Line max_commitment_usd regardless of the other products held, because the young,
      beginning and small farmer program limits the member's total operating exposure. Each individual line must also
      stay between its own product's min_commitment_usd and max_commitment_usd. A request that would breach either limit
      is not registered at the amount asked; the member may resubmit at an amount within the limits. Seasonal Operating
      Loans repaid in full and closed release their commitment from the aggregate on their closed date.
    eligibility: []
    measures: [operating_msr_portfolio_commitment]
    formula:
      within_aggregate_cap: operating_msr_portfolio_commitment <= max_commitment_usd
      within_product_band: commitment_amount >= min_commitment_usd and commitment_amount <= max_commitment_usd

  - id: operating_application_decision
    subject: [operating_line_open, operating_line_book, operating_line_decline]
    rule: >-
      An application is registered with the product's official name, the commitment requested and the crop year, and is
      decided by a credit officer against the product's entry gate; the servicing desk registers applications but never
      approves or declines them. A declined application is closed with the decision date. An approved line is booked
      only after the member has signed the note and security agreement, the financing statement has been filed and the
      member holds the stock or participation certificate required under equity_stock_requirement. For products with
      crop_insurance_required true, the line is booked only when the member holds a crop insurance policy in active
      status for the financed crop year whose indemnity is assigned to the association and whose coverage level is at
      least crop_insurance_min_coverage_pct. On booking, the maturity date is the booking date plus term_months
      calendar months and the advance cutoff date is the booking date plus advance_period_months calendar months, never
      later than the maturity date; when the day does not exist in the target month the last day of that month is used.
    eligibility:
      - id: insured_crop_for_required_products
        applies_to: [operating_line_book]
        kind: authorization
        condition: "For products with crop_insurance_required true, the line is booked only when the member holds a crop insurance policy in active status for the financed crop year whose indemnity is assigned to the association and whose coverage level is at least crop_insurance_min_coverage_pct."
        evidence_fields: [cropins_policies.customer_id, cropins_policies.status, cropins_policies.crop_year, cropins_policies.indemnity_assigned, cropins_policies.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cropins_policies.customer_id, cropins_policies.crop_year]]
          action_bindings: {cropins_policies.customer_id: customer_id, cropins_policies.crop_year: crop_year}
    params:
      per_tier:
        StartRight Operating Line: {term_months: "=term_months", advance_period_months: "=advance_period_months", crop_insurance_required: "=crop_insurance_required", crop_insurance_min_coverage_pct: "=crop_insurance_min_coverage_pct"}
        ExpressLine Operating Credit: {term_months: "=term_months", advance_period_months: "=advance_period_months", crop_insurance_required: "=crop_insurance_required", crop_insurance_min_coverage_pct: "=crop_insurance_min_coverage_pct"}
        Seasonal Operating Loan: {term_months: "=term_months", advance_period_months: "=advance_period_months", crop_insurance_required: "=crop_insurance_required", crop_insurance_min_coverage_pct: "=crop_insurance_min_coverage_pct"}
        Revolving Operating Line: {term_months: "=term_months", advance_period_months: "=advance_period_months", crop_insurance_required: "=crop_insurance_required", crop_insurance_min_coverage_pct: "=crop_insurance_min_coverage_pct"}
        Borrowing Base Operating Line: {term_months: "=term_months", advance_period_months: "=advance_period_months", crop_insurance_required: "=crop_insurance_required", crop_insurance_min_coverage_pct: "=crop_insurance_min_coverage_pct"}
        Agribusiness Revolving Line: {term_months: "=term_months", advance_period_months: "=advance_period_months", crop_insurance_required: "=crop_insurance_required", crop_insurance_min_coverage_pct: "=crop_insurance_min_coverage_pct"}

  - id: operating_rate_setting
    subject: [operating_line_book, operating_line_renew, operating_line_renew_matured, operating_autodraft_change, operating_rate_reset]
    rule: >-
      Every operating product carries a variable contract rate equal to the Association Variable Base Rate in effect on
      the rate effective date (operating_msr_base_rate, read from association_variable_base_rate_history) plus the
      product's variable_rate_spread_pct, minus the discounts the line qualifies for on that date. The program discount
      is program_rate_discount_pct. The AutoDraft discount is autodraft_rate_discount_pct and applies only while
      autodraft_enrolled is true. The relationship discount is relationship_rate_discount_pct and applies only while the
      member holds at least one Farm Real Estate loan in active status (operating_msr_active_farmland). Discounts are
      added together and the total is capped at rate_discount_cap_pct; a discount the product does not offer is zero, not
      a reason to raise another. The result is rounded to 3 decimal places and may not be lower than rate_floor_pct. The
      rate is set on the booking date and on every renewal effective date, and is recomputed with the same components
      when AutoDraft is enrolled or cancelled (effective the date of the change) and when the base rate changes
      (effective on the base-rate history date, for every line in active, suspended or matured status). Losing the
      relationship discount because a Farm Real Estate loan closed takes effect only at the next renewal, never mid-term.
    eligibility: []
    measures: [operating_msr_base_rate, operating_msr_active_farmland]
    params:
      association_variable_base_rate_history:
        - {effective_date: "2025-09-18", rate_pct: 7.750}
        - {effective_date: "2025-10-30", rate_pct: 7.500}
        - {effective_date: "2025-12-11", rate_pct: 7.250}
        - {effective_date: "2026-04-30", rate_pct: 7.000}
        - {effective_date: "2026-07-30", rate_pct: 6.750}
      per_tier:
        StartRight Operating Line: {spread: "=variable_rate_spread_pct", floor: "=rate_floor_pct", program: "=program_rate_discount_pct", autodraft: "=autodraft_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct"}
        ExpressLine Operating Credit: {spread: "=variable_rate_spread_pct", floor: "=rate_floor_pct", program: "=program_rate_discount_pct", autodraft: "=autodraft_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct"}
        Seasonal Operating Loan: {spread: "=variable_rate_spread_pct", floor: "=rate_floor_pct", program: "=program_rate_discount_pct", autodraft: "=autodraft_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct"}
        Revolving Operating Line: {spread: "=variable_rate_spread_pct", floor: "=rate_floor_pct", program: "=program_rate_discount_pct", autodraft: "=autodraft_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct"}
        Borrowing Base Operating Line: {spread: "=variable_rate_spread_pct", floor: "=rate_floor_pct", program: "=program_rate_discount_pct", autodraft: "=autodraft_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct"}
        Agribusiness Revolving Line: {spread: "=variable_rate_spread_pct", floor: "=rate_floor_pct", program: "=program_rate_discount_pct", autodraft: "=autodraft_rate_discount_pct", relationship: "=relationship_rate_discount_pct", cap: "=rate_discount_cap_pct"}
    formula:
      autodraft_part: autodraft_rate_discount_pct if autodraft_enrolled else 0
      relationship_part: relationship_rate_discount_pct if operating_msr_active_farmland >= 1 else 0
      discount_total: min(rate_discount_cap_pct, program_rate_discount_pct + autodraft_part + relationship_part)
      interest_rate: max(rate_floor_pct, round(operating_msr_base_rate + variable_rate_spread_pct - discount_total, 3))

  - id: operating_advance_eligibility
    subject: [operating_draw]
    rule: >-
      An advance may be booked only while the line is in active status. An advance may be booked only when its effective
      date is on or before the advance cutoff date recorded on the line. For a product that requires a borrowing base, an
      advance may be booked only when its effective date is no later than bbc_staleness_days calendar days after the
      as-of date of the line's most recent borrowing base certificate. The days are counted as calendar days after the
      anchor date, the anchor date itself being day 0, and the last counted day still qualifies. The available credit of
      a revolving product is the commitment (or, when borrowing_base_required is true, the lower of the commitment and the
      borrowing_base_amount of the most recent certificate) minus outstanding principal; the available credit of a
      non-revolving product is the commitment minus all advances booked in the current term (operating_msr_term_advances),
      whatever has been repaid. An advance must be at least min_draw_usd and no larger than the available credit, except
      as permitted under operating_overadvance. Advances requested through online banking or the mobile app may not take
      that channel's total for the effective date above online_draw_daily_limit_usd, and advances requested by phone may
      not take that channel's total above phone_draw_daily_limit_usd; branch advances have no daily channel limit. An
      advance that fails any limit is declined in full, never booked in part. A request received on a business day after
      same_day_draw_cutoff_local_time Central time, or on a weekend or Federal Reserve holiday, takes effect the next
      business day. Proceeds go to the member's checking account, by check, by wire (charged wire_draw_fee_usd per wire
      under the fee trigger) or, only where input_supplier_direct_allowed is true, directly to the named input supplier.
    eligibility:
      - id: line_active_for_advance
        applies_to: [operating_draw]
        kind: state
        condition: "An advance may be booked only while the line is in active status."
        evidence_fields: [operating_lines.status, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        state_contract:
          field: operating_lines.status
          allowed: [active]
      - id: within_advance_period
        applies_to: [operating_draw]
        kind: time
        condition: "An advance may be booked only when its effective date is on or before the advance cutoff date recorded on the line."
        evidence_fields: [operating_lines.advance_cutoff_date, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the advance cutoff date recorded on the line"
          anchor_source: operating_lines.advance_cutoff_date
          relation: not_after
          duration_source: params.cutoff_grace_days
          unit: calendar_days
          counting_rule: "The days are counted as calendar days after the anchor date, the anchor date itself being day 0, and the last counted day still qualifies."
          boundary: inclusive
      - id: current_borrowing_base_certificate
        applies_to: [operating_draw]
        kind: time
        condition: "For a product that requires a borrowing base, an advance may be booked only when its effective date is no later than bbc_staleness_days calendar days after the as-of date of the line's most recent borrowing base certificate."
        evidence_fields: [operating_borrowing_base.as_of_date, operating_borrowing_base.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_borrowing_base.line_id]]
          action_bindings: {operating_borrowing_base.line_id: line_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the as-of date of the line's most recent borrowing base certificate"
          anchor_source: operating_borrowing_base.as_of_date
          relation: not_after
          duration_source: variants.bbc_staleness_days
          unit: calendar_days
          counting_rule: "The days are counted as calendar days after the anchor date, the anchor date itself being day 0, and the last counted day still qualifies."
          boundary: inclusive
    measures: [operating_msr_term_advances, operating_msr_latest_bbc, operating_msr_online_draws_day, operating_msr_phone_draws_day]
    params:
      cutoff_grace_days: 0
      per_tier:
        StartRight Operating Line: {min_draw_usd: "=min_draw_usd", online_limit: "=online_draw_daily_limit_usd", phone_limit: "=phone_draw_daily_limit_usd", cutoff_time: "=same_day_draw_cutoff_local_time", revolving: "=revolving", supplier_direct: "=input_supplier_direct_allowed"}
        ExpressLine Operating Credit: {min_draw_usd: "=min_draw_usd", online_limit: "=online_draw_daily_limit_usd", phone_limit: "=phone_draw_daily_limit_usd", cutoff_time: "=same_day_draw_cutoff_local_time", revolving: "=revolving", supplier_direct: "=input_supplier_direct_allowed"}
        Seasonal Operating Loan: {min_draw_usd: "=min_draw_usd", online_limit: "=online_draw_daily_limit_usd", phone_limit: "=phone_draw_daily_limit_usd", cutoff_time: "=same_day_draw_cutoff_local_time", revolving: "=revolving", supplier_direct: "=input_supplier_direct_allowed"}
        Revolving Operating Line: {min_draw_usd: "=min_draw_usd", online_limit: "=online_draw_daily_limit_usd", phone_limit: "=phone_draw_daily_limit_usd", cutoff_time: "=same_day_draw_cutoff_local_time", revolving: "=revolving", supplier_direct: "=input_supplier_direct_allowed"}
        Borrowing Base Operating Line: {min_draw_usd: "=min_draw_usd", online_limit: "=online_draw_daily_limit_usd", phone_limit: "=phone_draw_daily_limit_usd", cutoff_time: "=same_day_draw_cutoff_local_time", revolving: "=revolving", supplier_direct: "=input_supplier_direct_allowed"}
        Agribusiness Revolving Line: {min_draw_usd: "=min_draw_usd", online_limit: "=online_draw_daily_limit_usd", phone_limit: "=phone_draw_daily_limit_usd", cutoff_time: "=same_day_draw_cutoff_local_time", revolving: "=revolving", supplier_direct: "=input_supplier_direct_allowed"}
    formula:
      revolving_limit: min(commitment_amount, borrowing_base_amount) if borrowing_base_required else commitment_amount
      available_credit: revolving_limit - outstanding_principal if revolving else commitment_amount - operating_msr_term_advances
      advance_allowed: amount >= min_draw_usd and amount <= available_credit

  - id: operating_overadvance
    subject: [operating_draw, operating_fee_assessed, operating_line_suspend]
    rule: >-
      Only a product with overadvance_tolerance_pct above zero may book an advance larger than the available credit
      computed under operating_advance_eligibility, and only when the excess (the overadvance portion) is no larger than
      overadvance_tolerance_pct of the commitment in force and no earlier overadvance on the line remains uncured. The
      advance is booked in full and an overadvance fee equal to overadvance_fee_pct of the overadvance portion, rounded
      to cents, is assessed the same day as a separate fee row with fee_code overadvance whose source_txn_id is that
      advance. An overadvance is cured when outstanding principal is back at or below the available credit. An
      overadvance must be cured within overadvance_max_days calendar days after the effective date of the advance that
      created it, the effective date itself being day 0; if it is not cured by the end of the last day, advances are
      frozen with suspended_reason overadvance_uncured. On every other product, and above the tolerance on these, the
      advance is declined in full and no fee arises.
    eligibility: []
    params:
      per_tier:
        StartRight Operating Line: {tolerance: "=overadvance_tolerance_pct", fee: "=overadvance_fee_pct", cure_days: "=overadvance_max_days"}
        ExpressLine Operating Credit: {tolerance: "=overadvance_tolerance_pct", fee: "=overadvance_fee_pct", cure_days: "=overadvance_max_days"}
        Seasonal Operating Loan: {tolerance: "=overadvance_tolerance_pct", fee: "=overadvance_fee_pct", cure_days: "=overadvance_max_days"}
        Revolving Operating Line: {tolerance: "=overadvance_tolerance_pct", fee: "=overadvance_fee_pct", cure_days: "=overadvance_max_days"}
        Borrowing Base Operating Line: {tolerance: "=overadvance_tolerance_pct", fee: "=overadvance_fee_pct", cure_days: "=overadvance_max_days"}
        Agribusiness Revolving Line: {tolerance: "=overadvance_tolerance_pct", fee: "=overadvance_fee_pct", cure_days: "=overadvance_max_days"}
    formula:
      when_not: overadvance_tolerance_pct == 0
      revolving_limit: min(commitment_amount, borrowing_base_amount) if borrowing_base_required else commitment_amount
      available_credit: revolving_limit - outstanding_principal if revolving else commitment_amount - operating_msr_term_advances
      overadvance_portion: max(0, amount - available_credit)
      overadvance_permitted: overadvance_portion <= round(commitment_amount * overadvance_tolerance_pct / 100, 2)
      overadvance_fee: round(overadvance_portion * overadvance_fee_pct / 100, 2)

  - id: operating_interest_accrual_billing
    subject: [operating_interest_accrual]
    rule: >-
      Interest accrues daily on the end-of-day outstanding principal using day_count_basis actual_365, so the interest for
      a period is the sum over its calendar days of principal times the annual rate divided by 365
      (operating_msr_principal_day_sum), rounded once to cents for the period. Interest is billed by
      interest_billing_frequency: monthly bills cover calendar months, quarterly bills cover calendar quarters ending
      March 31, June 30, September 30 and December 31, annual bills cover each year from the term start, and at_maturity
      bills cover the whole term; the first and last bills of a term are cut at the term start and the maturity date. Each
      bill is due interest_due_days_after_period_end calendar days after its period_end. When the contract rate changes
      inside a period, the period is booked as two accrual rows split at the change date, each with its own rate_applied,
      sharing one due date. At payoff, a final accrual is booked from the day after the last billed period_end through the
      payoff date with the payoff date as its due date. Principal still unpaid after maturity_date plus
      matured_payoff_grace_days accrues at interest_rate plus post_maturity_rate_addon_pct, booked with rate_basis
      post_maturity_rate; until then matured principal accrues at the contract rate. Accrued interest is never added to
      principal.
    eligibility: []
    measures: [operating_msr_principal_day_sum]
    params:
      per_tier:
        StartRight Operating Line: {basis: "=day_count_basis", frequency: "=interest_billing_frequency", due_days: "=interest_due_days_after_period_end", post_maturity_addon: "=post_maturity_rate_addon_pct", grace_days: "=matured_payoff_grace_days"}
        ExpressLine Operating Credit: {basis: "=day_count_basis", frequency: "=interest_billing_frequency", due_days: "=interest_due_days_after_period_end", post_maturity_addon: "=post_maturity_rate_addon_pct", grace_days: "=matured_payoff_grace_days"}
        Seasonal Operating Loan: {basis: "=day_count_basis", frequency: "=interest_billing_frequency", due_days: "=interest_due_days_after_period_end", post_maturity_addon: "=post_maturity_rate_addon_pct", grace_days: "=matured_payoff_grace_days"}
        Revolving Operating Line: {basis: "=day_count_basis", frequency: "=interest_billing_frequency", due_days: "=interest_due_days_after_period_end", post_maturity_addon: "=post_maturity_rate_addon_pct", grace_days: "=matured_payoff_grace_days"}
        Borrowing Base Operating Line: {basis: "=day_count_basis", frequency: "=interest_billing_frequency", due_days: "=interest_due_days_after_period_end", post_maturity_addon: "=post_maturity_rate_addon_pct", grace_days: "=matured_payoff_grace_days"}
        Agribusiness Revolving Line: {basis: "=day_count_basis", frequency: "=interest_billing_frequency", due_days: "=interest_due_days_after_period_end", post_maturity_addon: "=post_maturity_rate_addon_pct", grace_days: "=matured_payoff_grace_days"}
    formula:
      amount: round(operating_msr_principal_day_sum * rate_applied / 100 / 365, 2)

  - id: operating_payment_application
    subject: [operating_principal_payment, operating_interest_payment, operating_fee_payment]
    rule: >-
      A payment may be applied only while the line is in active, suspended or matured status. A remittance the member
      designates (a principal paydown, or payment of a named interest bill or fee) is applied as designated, up to what is
      owed on that item. An undesignated remittance is applied in the product's payment_application_order: fees (oldest
      assessment first), then billed interest (oldest due date first), then principal; interest accrued but not yet billed
      is not collected except at payoff. Each application is booked as its own row: one interest payment row per bill paid
      (source_txn_id the bill) and one fee payment row per assessment paid (source_txn_id the assessment), all with the
      remittance's effective date and channel. Principal may be prepaid at any time without penalty; on a revolving
      product the repaid amount becomes available again, on a non-revolving product it does not. A remittance larger than
      everything owed on the line, including the final accrual at payoff, is not accepted for the excess.
    eligibility:
      - id: line_accepts_payments
        applies_to: [operating_principal_payment, operating_interest_payment, operating_fee_payment]
        kind: state
        condition: "A payment may be applied only while the line is in active, suspended or matured status."
        evidence_fields: [operating_lines.status, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        state_contract:
          field: operating_lines.status
          allowed: [active, suspended, matured]
    params:
      per_tier:
        StartRight Operating Line: {order: "=payment_application_order"}
        ExpressLine Operating Credit: {order: "=payment_application_order"}
        Seasonal Operating Loan: {order: "=payment_application_order"}
        Revolving Operating Line: {order: "=payment_application_order"}
        Borrowing Base Operating Line: {order: "=payment_application_order"}
        Agribusiness Revolving Line: {order: "=payment_application_order"}

  - id: operating_evt_late_charge
    subject: [operating_fee_assessed, operating_fee_waiver]
    rule: >-
      A late charge may be assessed only after more than late_charge_grace_days calendar days have passed since the due
      date of the interest bill, counted as calendar days with the due date itself as day 0, so the charge first arises on
      the day after the last grace day. It is charged on an interest bill (an operating_interest_accrual row) whose billed
      amount is not fully paid by then (operating_msr_bill_paid below the bill amount), at late_charge_pct of the unpaid
      billed interest, no less than late_charge_min_usd and no more than late_charge_max_usd, rounded to cents, as a fee
      row with fee_code late_charge whose source_txn_id is that bill. Only one late charge may be assessed per interest
      bill. No late charge applies to principal, to fees, or to matured principal (which carries the post-maturity rate
      instead). A late charge is waived with waiver_basis error_correction when the record shows a payment effective on
      or before the last grace day that fully paid the bill. Otherwise, on the member's request, a late charge may be
      waived with waiver_basis courtesy only when its interest bill has since been paid in full and the line has fewer
      than courtesy_waivers_per_12_months courtesy waivers in the rolling window (operating_msr_courtesy_waivers_12m).
      Only one waiver may be booked per fee assessment, and only for its unpaid amount.
    eligibility:
      - id: late_charge_after_grace
        applies_to: [operating_fee_assessed]
        kind: time
        condition: "A late charge may be assessed only after more than late_charge_grace_days calendar days have passed since the due date of the interest bill"
        evidence_fields: [operating_transactions.due_date, operating_transactions.txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_transactions.txn_id]]
          action_bindings: {operating_transactions.txn_id: source_txn_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the due date of the interest bill"
          anchor_source: operating_transactions.due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: "counted as calendar days with the due date itself as day 0, so the charge first arises on the day after the last grace day"
          boundary: exclusive
      - id: one_late_charge_per_bill
        applies_to: [operating_fee_assessed]
        kind: dedup
        condition: "Only one late charge may be assessed per interest bill."
        evidence_fields: [operating_transactions.source_txn_id, operating_transactions.fee_code, operating_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_transactions.source_txn_id]]
          action_bindings: {operating_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: operating_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [operating_fee_assessed], fee_code: [late_charge]}
          distinct_fields: []
      - id: one_waiver_per_fee
        applies_to: [operating_fee_waiver]
        kind: dedup
        condition: "Only one waiver may be booked per fee assessment, and only for its unpaid amount."
        evidence_fields: [operating_transactions.source_txn_id, operating_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_transactions.source_txn_id]]
          action_bindings: {operating_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: operating_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [operating_fee_waiver]}
          distinct_fields: []
    measures: [operating_msr_bill_paid, operating_msr_courtesy_waivers_12m]
    params:
      per_tier:
        StartRight Operating Line: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        ExpressLine Operating Credit: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Seasonal Operating Loan: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Revolving Operating Line: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Borrowing Base Operating Line: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
        Agribusiness Revolving Line: {pct: "=late_charge_pct", min: "=late_charge_min_usd", max: "=late_charge_max_usd", grace: "=late_charge_grace_days", courtesy: "=courtesy_waivers_per_12_months"}
    formula:
      unpaid_billed_interest: amount - operating_msr_bill_paid
      late_charge: min(late_charge_max_usd, max(late_charge_min_usd, round(unpaid_billed_interest * late_charge_pct / 100, 2)))
      courtesy_available: operating_msr_courtesy_waivers_12m < courtesy_waivers_per_12_months

  - id: operating_evt_returned_payment
    subject: [operating_principal_payment_return, operating_interest_payment_return, operating_fee_assessed, operating_autodraft_change]
    rule: >-
      When the member's bank returns a payment unpaid, exactly that payment row is reversed: the return row carries the
      original payment's amount and effective date and points to it through source_txn_id, so balances and interest are
      restated as though the payment had never been made. A payment may be reversed only once. Unless the return reason is
      unauthorized, a returned payment fee of returned_payment_fee_usd is assessed under the trigger, with source_txn_id
      the return row; a debit the member did not authorise carries no fee. When a second AutoDraft payment on the line is
      returned within the rolling window (operating_msr_returns_12m reaches returns_cancelling_autodraft), AutoDraft is
      cancelled the day the second return is booked, which removes the AutoDraft discount under operating_rate_setting.
    eligibility:
      - id: reverse_once
        applies_to: [operating_principal_payment_return, operating_interest_payment_return]
        kind: dedup
        condition: "A payment may be reversed only once."
        evidence_fields: [operating_transactions.source_txn_id, operating_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_transactions.source_txn_id]]
          action_bindings: {operating_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: operating_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [operating_principal_payment_return, operating_interest_payment_return]}
          distinct_fields: []
    measures: [operating_msr_returns_12m]
    params:
      returns_cancelling_autodraft: 2
      per_tier:
        StartRight Operating Line: {fee: "=returned_payment_fee_usd"}
        ExpressLine Operating Credit: {fee: "=returned_payment_fee_usd"}
        Seasonal Operating Loan: {fee: "=returned_payment_fee_usd"}
        Revolving Operating Line: {fee: "=returned_payment_fee_usd"}
        Borrowing Base Operating Line: {fee: "=returned_payment_fee_usd"}
        Agribusiness Revolving Line: {fee: "=returned_payment_fee_usd"}

  - id: operating_renewal
    subject: [operating_line_renew, operating_line_renew_matured, operating_line_mature, operating_fee_assessed, operating_fee_waiver]
    rule: >-
      Only a product with renewable true can be renewed; a Seasonal Operating Loan matures and a new loan is applied for.
      A renewal request may be accepted no earlier than renewal_application_window_days calendar days before the maturity
      date of the current term. The days are counted backwards from the maturity date as calendar days, the maturity date
      itself being day 0, and the first day of the window qualifies. The request is registered as a renewal request
      (request_status submitted) with the commitment the member asks for, and is decided by a credit officer. A renewal
      may be processed only while the line is in active or matured status; a suspended line must first be reinstated
      under operating_suspension_reinstatement. The renewal is approved under streamlined review when
      streamlined_renewal_count is below streamlined_renewals_max, otherwise under full review, and when
      renewal_financial_statement_required is true it is not decided until a current balance sheet and income statement
      are received. A renewal of an active line takes effect the day after the current maturity date and the new maturity
      date is the old one plus term_months; a renewal of a matured line takes effect on its approval date and the new
      maturity date is that date plus term_months. A line still in active status at the end of its maturity date with no
      renewal in effect matures (operating_line_mature). On the renewal effective date the contract rate is reset under
      operating_rate_setting and the renewal fee renewal_fee_usd is assessed under the trigger; the renewal fee is waived
      with waiver_basis early_renewal when the renewal request was registered at least early_renewal_waiver_days calendar
      days before the maturity date of the term being renewed (a matured line never qualifies, and a product with
      early_renewal_waiver_days 0 has no early-renewal waiver).
    eligibility:
      - id: renewal_window_open
        applies_to: [operating_line_renew, operating_line_renew_matured]
        kind: time
        condition: "A renewal request may be accepted no earlier than renewal_application_window_days calendar days before the maturity date of the current term."
        evidence_fields: [operating_lines.maturity_date, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the maturity date of the current term"
          anchor_source: operating_lines.maturity_date
          relation: not_before
          duration_source: variants.renewal_application_window_days
          unit: calendar_days
          counting_rule: "The days are counted backwards from the maturity date as calendar days, the maturity date itself being day 0, and the first day of the window qualifies."
          boundary: inclusive
      - id: renewable_status
        applies_to: [operating_line_renew]
        kind: state
        condition: "A renewal may be processed only while the line is in active or matured status"
        evidence_fields: [operating_lines.status, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        state_contract:
          field: operating_lines.status
          allowed: [active, matured]
    params:
      per_tier:
        StartRight Operating Line: {renewable: "=renewable", window_days: "=renewal_application_window_days", streamlined_max: "=streamlined_renewals_max", statements: "=renewal_financial_statement_required", fee: "=renewal_fee_usd", early_waiver_days: "=early_renewal_waiver_days", term_months: "=term_months"}
        ExpressLine Operating Credit: {renewable: "=renewable", window_days: "=renewal_application_window_days", streamlined_max: "=streamlined_renewals_max", statements: "=renewal_financial_statement_required", fee: "=renewal_fee_usd", early_waiver_days: "=early_renewal_waiver_days", term_months: "=term_months"}
        Seasonal Operating Loan: {renewable: "=renewable", window_days: "=renewal_application_window_days", streamlined_max: "=streamlined_renewals_max", statements: "=renewal_financial_statement_required", fee: "=renewal_fee_usd", early_waiver_days: "=early_renewal_waiver_days", term_months: "=term_months"}
        Revolving Operating Line: {renewable: "=renewable", window_days: "=renewal_application_window_days", streamlined_max: "=streamlined_renewals_max", statements: "=renewal_financial_statement_required", fee: "=renewal_fee_usd", early_waiver_days: "=early_renewal_waiver_days", term_months: "=term_months"}
        Borrowing Base Operating Line: {renewable: "=renewable", window_days: "=renewal_application_window_days", streamlined_max: "=streamlined_renewals_max", statements: "=renewal_financial_statement_required", fee: "=renewal_fee_usd", early_waiver_days: "=early_renewal_waiver_days", term_months: "=term_months"}
        Agribusiness Revolving Line: {renewable: "=renewable", window_days: "=renewal_application_window_days", streamlined_max: "=streamlined_renewals_max", statements: "=renewal_financial_statement_required", fee: "=renewal_fee_usd", early_waiver_days: "=early_renewal_waiver_days", term_months: "=term_months"}
    formula:
      review_type_streamlined: streamlined_renewal_count < streamlined_renewals_max

  - id: operating_borrowing_base_calculation
    subject: [operating_bbc_submitted, operating_line_suspend]
    rule: >-
      A borrowing base certificate may be accepted only for a line in active or suspended status. The borrowing base is
      the sum, over the collateral classes stated on the certificate, of each value times the product's advance rate for
      that class (advance_rate_stored_grain_pct, advance_rate_contracted_grain_pct, advance_rate_market_livestock_pct,
      advance_rate_receivables_pct, advance_rate_prepaid_inputs_pct, advance_rate_insured_growing_crops_pct), rounded
      to cents. Receivables older than receivable_max_age_days from invoice are left off the certificate. Insured growing
      crops count only when the member holds a crop insurance policy in active status for the line's crop year with the
      indemnity assigned to the association and a coverage level of at least crop_insurance_min_coverage_pct
      (operating_msr_assigned_crop_policy at least 1); otherwise that class contributes zero, whatever value is stated.
      Certificates are due every bbc_frequency_days; a late certificate does not freeze the line but stops advances under
      operating_advance_eligibility until a current one is received. When a certificate shows outstanding principal above
      its borrowing base, the shortfall must be repaid within bbc_deficiency_cure_days calendar days after the
      certificate's submitted_date (the submitted date being day 0); if principal is still above the borrowing base at
      the end of the last day, advances are frozen with suspended_reason borrowing_base_deficiency.
    eligibility:
      - id: certificate_line_open
        applies_to: [operating_bbc_submitted]
        kind: state
        condition: "A borrowing base certificate may be accepted only for a line in active or suspended status."
        evidence_fields: [operating_lines.status, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        state_contract:
          field: operating_lines.status
          allowed: [active, suspended]
    measures: [operating_msr_assigned_crop_policy]
    params:
      per_tier:
        StartRight Operating Line: {grain: "=advance_rate_stored_grain_pct", contracted: "=advance_rate_contracted_grain_pct", livestock: "=advance_rate_market_livestock_pct", receivables: "=advance_rate_receivables_pct", inputs: "=advance_rate_prepaid_inputs_pct", growing_crops: "=advance_rate_insured_growing_crops_pct", receivable_age: "=receivable_max_age_days", frequency: "=bbc_frequency_days", cure_days: "=bbc_deficiency_cure_days"}
        ExpressLine Operating Credit: {grain: "=advance_rate_stored_grain_pct", contracted: "=advance_rate_contracted_grain_pct", livestock: "=advance_rate_market_livestock_pct", receivables: "=advance_rate_receivables_pct", inputs: "=advance_rate_prepaid_inputs_pct", growing_crops: "=advance_rate_insured_growing_crops_pct", receivable_age: "=receivable_max_age_days", frequency: "=bbc_frequency_days", cure_days: "=bbc_deficiency_cure_days"}
        Seasonal Operating Loan: {grain: "=advance_rate_stored_grain_pct", contracted: "=advance_rate_contracted_grain_pct", livestock: "=advance_rate_market_livestock_pct", receivables: "=advance_rate_receivables_pct", inputs: "=advance_rate_prepaid_inputs_pct", growing_crops: "=advance_rate_insured_growing_crops_pct", receivable_age: "=receivable_max_age_days", frequency: "=bbc_frequency_days", cure_days: "=bbc_deficiency_cure_days"}
        Revolving Operating Line: {grain: "=advance_rate_stored_grain_pct", contracted: "=advance_rate_contracted_grain_pct", livestock: "=advance_rate_market_livestock_pct", receivables: "=advance_rate_receivables_pct", inputs: "=advance_rate_prepaid_inputs_pct", growing_crops: "=advance_rate_insured_growing_crops_pct", receivable_age: "=receivable_max_age_days", frequency: "=bbc_frequency_days", cure_days: "=bbc_deficiency_cure_days"}
        Borrowing Base Operating Line: {grain: "=advance_rate_stored_grain_pct", contracted: "=advance_rate_contracted_grain_pct", livestock: "=advance_rate_market_livestock_pct", receivables: "=advance_rate_receivables_pct", inputs: "=advance_rate_prepaid_inputs_pct", growing_crops: "=advance_rate_insured_growing_crops_pct", receivable_age: "=receivable_max_age_days", frequency: "=bbc_frequency_days", cure_days: "=bbc_deficiency_cure_days"}
        Agribusiness Revolving Line: {grain: "=advance_rate_stored_grain_pct", contracted: "=advance_rate_contracted_grain_pct", livestock: "=advance_rate_market_livestock_pct", receivables: "=advance_rate_receivables_pct", inputs: "=advance_rate_prepaid_inputs_pct", growing_crops: "=advance_rate_insured_growing_crops_pct", receivable_age: "=receivable_max_age_days", frequency: "=bbc_frequency_days", cure_days: "=bbc_deficiency_cure_days"}
    formula:
      growing_crop_part: insured_growing_crops_value * advance_rate_insured_growing_crops_pct / 100 if operating_msr_assigned_crop_policy >= 1 else 0
      borrowing_base_amount: round(stored_grain_value * advance_rate_stored_grain_pct / 100 + contracted_grain_value * advance_rate_contracted_grain_pct / 100 + market_livestock_value * advance_rate_market_livestock_pct / 100 + receivables_value * advance_rate_receivables_pct / 100 + prepaid_inputs_value * advance_rate_prepaid_inputs_pct / 100 + growing_crop_part, 2)

  - id: operating_evt_unused_commitment_fee
    subject: [operating_fee_assessed]
    rule: >-
      A product with unused_commitment_fee_pct above zero is charged an unused commitment fee for each calendar quarter
      (and for the stub quarter ending on the maturity date), assessed on the day after the quarter ends with period_start
      and period_end set to the days covered. The fee is unused_commitment_fee_pct per year on the commitment in force on
      period_end minus the average daily outstanding principal of the period (operating_msr_principal_day_sum divided by
      operating_msr_period_days), for the days of the period over 365, rounded to cents. A period in which average
      principal is at or above the commitment carries no fee, and no fee is charged for any period after the line is
      closed. Products with unused_commitment_fee_pct of zero are never charged.
    eligibility: []
    measures: [operating_msr_principal_day_sum, operating_msr_period_days]
    params:
      per_tier:
        StartRight Operating Line: {unused_fee_pct: "=unused_commitment_fee_pct"}
        ExpressLine Operating Credit: {unused_fee_pct: "=unused_commitment_fee_pct"}
        Seasonal Operating Loan: {unused_fee_pct: "=unused_commitment_fee_pct"}
        Revolving Operating Line: {unused_fee_pct: "=unused_commitment_fee_pct"}
        Borrowing Base Operating Line: {unused_fee_pct: "=unused_commitment_fee_pct"}
        Agribusiness Revolving Line: {unused_fee_pct: "=unused_commitment_fee_pct"}
    formula:
      when_not: unused_commitment_fee_pct == 0
      amount: round(max(0, commitment_amount - operating_msr_principal_day_sum / operating_msr_period_days) * unused_commitment_fee_pct / 100 * operating_msr_period_days / 365, 2)

  - id: operating_suspension_reinstatement
    subject: [operating_line_suspend, operating_line_reinstate]
    rule: >-
      Advances on an active line are frozen with suspended_reason past_due_interest when an interest bill remains not fully
      paid more than suspension_past_due_days calendar days after its due date (the due date being day 0), and are frozen
      for the other two reasons as set out in operating_overadvance and operating_borrowing_base_calculation. Freezing
      stops advances only; payments, certificates and renewal requests continue to be received. A suspended line is
      reinstated only when the condition recorded in suspended_reason is cured on the record: for past_due_interest,
      every interest bill whose due date has passed is paid in full and every late charge assessed on those bills is paid
      or waived; for borrowing_base_deficiency, a certificate received after the freeze shows outstanding principal at or
      below its borrowing base; for overadvance_uncured, outstanding principal is at or below the available credit.
      Reinstatement reopens advances from the day it is booked and never back-dates advances refused while frozen. A line
      whose maturity date passes while suspended matures instead and can only be renewed or paid off.
    eligibility: []
    params:
      per_tier:
        StartRight Operating Line: {past_due_days: "=suspension_past_due_days"}
        ExpressLine Operating Credit: {past_due_days: "=suspension_past_due_days"}
        Seasonal Operating Loan: {past_due_days: "=suspension_past_due_days"}
        Revolving Operating Line: {past_due_days: "=suspension_past_due_days"}
        Borrowing Base Operating Line: {past_due_days: "=suspension_past_due_days"}
        Agribusiness Revolving Line: {past_due_days: "=suspension_past_due_days"}

  - id: operating_line_closure
    subject: [operating_line_close, operating_line_payoff_close]
    rule: >-
      An active line is terminated only at the member's own instruction: the request is registered as a line_closure
      request and the termination takes effect when the member confirms it. An active line may be closed only when the
      member has a line closure request on file for that line. It may be closed only when outstanding_principal,
      accrued_interest and fees_due are all 0.00, including the final accrual through the payoff date booked under
      operating_interest_accrual_billing and paid. A zero balance alone never closes an active line before maturity. A
      matured line is closed by the servicing platform on the effective date of the payment that brings principal,
      interest and fees to zero. After closure the association files a UCC termination statement within
      ucc_termination_days calendar days of the closed date, unless another line or loan of the member is secured by the
      same financing statement. No origination, renewal or other fee is refunded on closure.
    eligibility:
      - id: member_closure_instruction
        applies_to: [operating_line_close]
        kind: authorization
        condition: "An active line may be closed only when the member has a line closure request on file for that line."
        evidence_fields: [operating_requests.line_id, operating_requests.request_type, operating_requests.request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_requests.line_id]]
          action_bindings: {operating_requests.line_id: line_id}
    params:
      ucc_termination_days: 20

  - id: operating_commitment_change
    subject: [operating_commitment_increase, operating_commitment_decrease, operating_fee_assessed]
    rule: >-
      A commitment may be changed only while the line is in active status. A mid-term increase is requested as a
      commitment_increase request for the amount of the increase, may not exceed max_midterm_increase_pct of the
      commitment in force, must keep the new commitment within max_commitment_usd and within
      operating_agg_portfolio_commitment, and takes effect only on credit approval; at most max_increases_per_term
      increases may take effect in one term. On the effective date a fee of commitment_increase_fee_pct of the increase,
      rounded to cents, is assessed under the trigger (no fee row is booked where the percentage is zero). A product with
      max_midterm_increase_pct of zero takes no mid-term increase. The member may reduce the commitment at any time with
      immediate effect to any amount that is no lower than the outstanding principal and no lower than
      min_commitment_usd; a reduction carries no fee and refunds no fee already charged.
    eligibility:
      - id: active_line_for_change
        applies_to: [operating_commitment_increase, operating_commitment_decrease]
        kind: state
        condition: "A commitment may be changed only while the line is in active status."
        evidence_fields: [operating_lines.status, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        state_contract:
          field: operating_lines.status
          allowed: [active]
    params:
      max_increases_per_term: 1
      per_tier:
        StartRight Operating Line: {max_increase_pct: "=max_midterm_increase_pct", fee_pct: "=commitment_increase_fee_pct"}
        ExpressLine Operating Credit: {max_increase_pct: "=max_midterm_increase_pct", fee_pct: "=commitment_increase_fee_pct"}
        Seasonal Operating Loan: {max_increase_pct: "=max_midterm_increase_pct", fee_pct: "=commitment_increase_fee_pct"}
        Revolving Operating Line: {max_increase_pct: "=max_midterm_increase_pct", fee_pct: "=commitment_increase_fee_pct"}
        Borrowing Base Operating Line: {max_increase_pct: "=max_midterm_increase_pct", fee_pct: "=commitment_increase_fee_pct"}
        Agribusiness Revolving Line: {max_increase_pct: "=max_midterm_increase_pct", fee_pct: "=commitment_increase_fee_pct"}

  - id: operating_autodraft_enrolment
    subject: [operating_autodraft_change]
    rule: >-
      AutoDraft is authorised, moved to another checking account or cancelled only on the member's own instruction, except
      the cancellation after repeated returns under operating_evt_returned_payment. AutoDraft may be changed only while the
      line is in active, suspended or matured status. The account is identified by the last four digits the member gives,
      recorded exactly as given. Once enrolled, each interest bill is debited on its due date for the unpaid billed
      amount. Enrolment or cancellation takes effect the day it is recorded, and the contract rate is recomputed that day
      under operating_rate_setting; changing only the debited account leaves the rate unchanged.
    eligibility:
      - id: autodraft_open_line
        applies_to: [operating_autodraft_change]
        kind: state
        condition: "AutoDraft may be changed only while the line is in active, suspended or matured status."
        evidence_fields: [operating_lines.status, operating_lines.line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[operating_lines.line_id]]
          action_bindings: {operating_lines.line_id: line_id}
        state_contract:
          field: operating_lines.status
          allowed: [active, suspended, matured]

  - id: operating_evt_booking_fees
    subject: [operating_line_book, operating_fee_assessed]
    rule: >-
      When a line is booked, an origination fee of origination_fee_pct of the commitment, but not less than
      origination_fee_min_usd, rounded to cents, is assessed on the booking date; a product whose origination percentage
      and minimum are both zero books no origination fee row. The UCC filing fee ucc_filing_fee_usd is passed through as
      its own fee row on the booking date only when a new financing statement had to be filed, that is when the member
      held no other operating line in active, suspended or matured status on the booking date (an existing financing
      statement already covers the member's crops, livestock and farm products). Neither fee is charged again at renewal, and neither is refunded if the line is
      later closed.
    eligibility: []
    params:
      per_tier:
        StartRight Operating Line: {pct: "=origination_fee_pct", min: "=origination_fee_min_usd", ucc: "=ucc_filing_fee_usd"}
        ExpressLine Operating Credit: {pct: "=origination_fee_pct", min: "=origination_fee_min_usd", ucc: "=ucc_filing_fee_usd"}
        Seasonal Operating Loan: {pct: "=origination_fee_pct", min: "=origination_fee_min_usd", ucc: "=ucc_filing_fee_usd"}
        Revolving Operating Line: {pct: "=origination_fee_pct", min: "=origination_fee_min_usd", ucc: "=ucc_filing_fee_usd"}
        Borrowing Base Operating Line: {pct: "=origination_fee_pct", min: "=origination_fee_min_usd", ucc: "=ucc_filing_fee_usd"}
        Agribusiness Revolving Line: {pct: "=origination_fee_pct", min: "=origination_fee_min_usd", ucc: "=ucc_filing_fee_usd"}
    formula:
      origination_fee: max(origination_fee_min_usd, round(commitment_amount * origination_fee_pct / 100, 2))

# ============================================================================
# extended_policies — operating_line_servicing
# ============================================================================
extended_policies:
  - id: operating_ext_certificate_lendable_value
    base_policy_refs: [operating_borrowing_base_calculation]
    overwrite:
      - base_policy: operating_borrowing_base_calculation
        superseded_clause: >-
          The borrowing base is the sum, over the collateral classes stated on the certificate, of each value times the
          product's advance rate for that class (advance_rate_stored_grain_pct, advance_rate_contracted_grain_pct,
          advance_rate_market_livestock_pct, advance_rate_receivables_pct, advance_rate_prepaid_inputs_pct,
          advance_rate_insured_growing_crops_pct), rounded to cents.
        replaced_by: >-
          Where a collateral class's advance rate or counted value is set by one of the rules below, that rate or value
          takes the place of the product's own for that class, and every class no rule names keeps the product's own
          advance rate and its stated value.
      - base_policy: operating_borrowing_base_calculation
        superseded_clause: >-
          Insured growing crops count only when the member holds a crop insurance policy in active status for the line's
          crop year with the indemnity assigned to the association and a coverage level of at least
          crop_insurance_min_coverage_pct (operating_msr_assigned_crop_policy at least 1); otherwise that class
          contributes zero, whatever value is stated.
        replaced_by: >-
          In these rules the crop-year assigned policy is a crop insurance policy in active status for the line's crop
          year whose indemnity is assigned to the association for this line.
    trigger: state_due
    subject: [operating_bbc_submitted]
    computes: borrowing_base_amount
    target_tool: record_certificate_borrowing_base_37c8bf27
    params:
      growing_crop_rate_high_coverage: 70.0
      growing_crop_high_coverage_pct: 80
      prepaid_inputs_applied_months: 6
      prepaid_inputs_midseason_months: 3
      prepaid_inputs_midseason_share: 0.5
      stale_value_late_days: 30
      stale_value_mid_days: 15
      stale_value_factor_late: 0.8
      stale_value_factor_mid: 0.9
      bin_secured_rate_addon_pct: 5.0
      bin_partial_rate_addon_pct: 2.5
      bin_secured_min_collateral_usd: 250000.0
      receivables_reporting_full_count: 11
      receivables_reporting_irregular_count: 6
      receivables_rate_irregular_pct: 70.0
      receivables_rate_sparse_pct: 60.0
    rule: >-
      The association works out its own borrowing base for a borrowing base certificate the member has delivered on a
      line in active or suspended status and records it on that certificate in place of any figure the member worked
      out; the figure always rests on the collateral values stated on the line's most recent certificate, the one with
      the latest as-of date. The certificate's borrowing base is the stated unpriced stored grain value times
      advance_rate_stored_grain_pct, plus the stated contracted grain value times advance_rate_contracted_grain_pct,
      plus the stated market livestock value times advance_rate_market_livestock_pct, plus the stated receivables value
      times advance_rate_receivables_pct, plus the stated prepaid inputs value times advance_rate_prepaid_inputs_pct,
      plus the stated insured growing crops value times advance_rate_insured_growing_crops_pct when the member holds a
      crop insurance policy in active status for the line's crop year whose indemnity is assigned to the association
      for this line at a coverage level of at least crop_insurance_min_coverage_pct and nothing for that class when the
      member holds none, each rate read as a percentage. The six products are added together and the total is rounded once to cents. Where a collateral
      class's advance rate or counted value is set by one of the rules below, that rate or value takes the place of the
      product's own for that class, and every class no rule names keeps the product's own advance rate and its stated
      value. In these rules the crop-year assigned policy is a crop insurance policy in active status for the line's
      crop year whose indemnity is assigned to the association for this line.
      Insured growing crops are lent against at growing_crop_rate_high_coverage percent when the line has a crop-year
      assigned policy whose coverage level is at least growing_crop_high_coverage_pct percent; at zero when the line
      has no crop-year assigned policy or that policy's coverage level is below crop_insurance_min_coverage_pct; and at
      advance_rate_insured_growing_crops_pct when the line has a crop-year assigned policy whose coverage level is at
      least crop_insurance_min_coverage_pct but below growing_crop_high_coverage_pct percent.
      The insured growing crops value counted is the lower of the stated value and the policy guarantee figured at the
      higher of the projected price and the harvest price when the crop-year assigned policy's harvest price has been
      released; the lower of the stated value and the policy guarantee figured at the projected price when that
      policy's harvest price has not yet been released; and the stated value when the line has no crop-year assigned
      policy. The policy guarantee is the approved yield times the insured acres times the coverage level read as a
      percentage times the price named.
      Prepaid inputs are lent against at zero when the certificate's as-of date falls prepaid_inputs_applied_months or
      more whole months after the start of the current term, at prepaid_inputs_midseason_share times
      advance_rate_prepaid_inputs_pct when it falls at least prepaid_inputs_midseason_months but fewer than
      prepaid_inputs_applied_months whole months after it, and at advance_rate_prepaid_inputs_pct when it falls fewer
      than prepaid_inputs_midseason_months whole months after it. The start of the current term is the last renewal
      date, or the booking date for a line never renewed, and a whole month is counted only once the as-of date reaches
      the same day of the month as the term start.
      The stated unpriced stored grain value and the stated market livestock value are each taken at
      stale_value_factor_late times the stated amount when the certificate was received more than stale_value_late_days
      calendar days after its as-of date, at stale_value_factor_mid times the stated amount when it was received more
      than stale_value_mid_days but no more than stale_value_late_days calendar days after it, and at the stated amount
      when it was received no more than stale_value_mid_days calendar days after it, the as-of date itself being day 0;
      the advance rate then acts on the value so taken.
      Unpriced stored grain is lent against at advance_rate_stored_grain_pct plus bin_secured_rate_addon_pct points
      when the member holds a Grain Storage & Handling Loan in active status whose pledged collateral value is at least
      bin_secured_min_collateral_usd, at advance_rate_stored_grain_pct plus bin_partial_rate_addon_pct points when the
      member holds a Grain Storage & Handling Loan in active status whose pledged collateral value is below
      bin_secured_min_collateral_usd, and at advance_rate_stored_grain_pct when the member holds no Grain Storage &
      Handling Loan in active status.
      Receivables are lent against at receivables_rate_sparse_pct percent when fewer than
      receivables_reporting_irregular_count certificates on the line have an as-of date within the twelve whole months
      before today, at receivables_rate_irregular_pct percent when at least receivables_reporting_irregular_count but
      fewer than receivables_reporting_full_count do, and at advance_rate_receivables_pct when
      receivables_reporting_full_count or more do; the certificate being figured counts among them.
    baseline:
      rule: >-
        The certificate's borrowing base is the stated unpriced stored grain value times advance_rate_stored_grain_pct,
        plus the stated contracted grain value times advance_rate_contracted_grain_pct, plus the stated market livestock
        value times advance_rate_market_livestock_pct, plus the stated receivables value times
        advance_rate_receivables_pct, plus the stated prepaid inputs value times advance_rate_prepaid_inputs_pct, plus
        the stated insured growing crops value times advance_rate_insured_growing_crops_pct when the member holds a crop
        insurance policy in active status for the line's crop year whose indemnity is assigned to the association for
        this line at a coverage level of at least crop_insurance_min_coverage_pct and nothing for that class when the
        member holds none, each rate read as a percentage. The six products are added together and the total is rounded once to cents.
      params: [advance_rate_stored_grain_pct, advance_rate_contracted_grain_pct, advance_rate_market_livestock_pct,
               advance_rate_receivables_pct, advance_rate_prepaid_inputs_pct, advance_rate_insured_growing_crops_pct]
    prerequisite: []
    cross_category:
      - category: cropins
        as: branch
        reads: [status, crop_year, indemnity_assigned, assigned_loan_id, variant_name, approved_yield_bu, insured_acres, projected_price, harvest_price]
        note: The growing-crop advance rate and the growing-crop value counted are decided from the crop-year policy assigned to the line.
      - category: equipment
        as: branch
        reads: [status, variant_name, collateral_value]
        note: The stored-grain advance rate is decided from the member's Grain Storage & Handling Loan and its pledged collateral.
    compute:
      - stated_stored_grain: "LATEST('operating_borrowing_base', 'stored_grain_value', date_field='as_of_date')"
      - stated_contracted_grain: "LATEST('operating_borrowing_base', 'contracted_grain_value', date_field='as_of_date')"
      - stated_livestock: "LATEST('operating_borrowing_base', 'market_livestock_value', date_field='as_of_date')"
      - stated_receivables: "LATEST('operating_borrowing_base', 'receivables_value', date_field='as_of_date')"
      - stated_prepaid_inputs: "LATEST('operating_borrowing_base', 'prepaid_inputs_value', date_field='as_of_date')"
      - stated_growing_crops: "LATEST('operating_borrowing_base', 'insured_growing_crops_value', date_field='as_of_date')"
      - certificate_as_of: "LATEST('operating_borrowing_base', 'as_of_date', date_field='as_of_date')"
      - certificate_received: "LATEST('operating_borrowing_base', 'submitted_date', date_field='as_of_date')"
      - assigned_policy_held: "EXISTS('cropins', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True)"
      - assigned_coverage_pct: "CPARAM('cropins', 'coverage_level_pct', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - growing_crop_rate: "K('growing_crop_rate_high_coverage') if (assigned_policy_held and assigned_coverage_pct >= K('growing_crop_high_coverage_pct')) else (0 if ((not assigned_policy_held) or assigned_coverage_pct < P('crop_insurance_min_coverage_pct')) else P('advance_rate_insured_growing_crops_pct'))"
      - guarantee_yield: "CFIELD('cropins', 'approved_yield_bu', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - guarantee_acres: "CFIELD('cropins', 'insured_acres', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - guarantee_coverage: "CPARAM('cropins', 'coverage_level_pct', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - guarantee_projected_price: "CFIELD('cropins', 'projected_price', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - guarantee_harvest_price: "CFIELD('cropins', 'harvest_price', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True) or ''"
      - guarantee_policy_held: "EXISTS('cropins', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True)"
      - growing_crops_counted: "MN(stated_growing_crops, guarantee_yield * guarantee_acres * guarantee_coverage / 100 * MX(guarantee_projected_price, float(guarantee_harvest_price))) if (guarantee_policy_held and guarantee_harvest_price != '') else (MN(stated_growing_crops, guarantee_yield * guarantee_acres * guarantee_coverage / 100 * guarantee_projected_price) if (guarantee_policy_held and guarantee_harvest_price == '') else stated_growing_crops)"
      - term_start: "F('last_renewed_date') if F('last_renewed_date') else F('opened_date')"
      - months_into_term: "MONTHS(term_start, certificate_as_of)"
      - prepaid_inputs_rate: "0 if months_into_term >= K('prepaid_inputs_applied_months') else (K('prepaid_inputs_midseason_share') * P('advance_rate_prepaid_inputs_pct') if months_into_term >= K('prepaid_inputs_midseason_months') else P('advance_rate_prepaid_inputs_pct'))"
      - receipt_lag_days: "DAYS(certificate_as_of, certificate_received)"
      - market_value_factor: "K('stale_value_factor_late') if receipt_lag_days > K('stale_value_late_days') else (K('stale_value_factor_mid') if receipt_lag_days > K('stale_value_mid_days') else 1)"
      - bin_loan_held: "EXISTS('equipment', variant_name='Grain Storage & Handling Loan', status='active')"
      - bin_loan_collateral: "CFIELD('equipment', 'collateral_value', variant_name='Grain Storage & Handling Loan', status='active') or 0"
      - stored_grain_rate: "P('advance_rate_stored_grain_pct') + K('bin_secured_rate_addon_pct') if (bin_loan_held and bin_loan_collateral >= K('bin_secured_min_collateral_usd')) else (P('advance_rate_stored_grain_pct') + K('bin_partial_rate_addon_pct') if (bin_loan_held and bin_loan_collateral < K('bin_secured_min_collateral_usd')) else P('advance_rate_stored_grain_pct'))"
      - certificates_last_year: "COUNT('operating_borrowing_base', within_months=12, date_field='as_of_date')"
      - receivables_rate: "K('receivables_rate_sparse_pct') if certificates_last_year < K('receivables_reporting_irregular_count') else (K('receivables_rate_irregular_pct') if certificates_last_year < K('receivables_reporting_full_count') else P('advance_rate_receivables_pct'))"
      - result: "RND(stated_stored_grain * market_value_factor * stored_grain_rate / 100 + stated_contracted_grain * P('advance_rate_contracted_grain_pct') / 100 + stated_livestock * market_value_factor * P('advance_rate_market_livestock_pct') / 100 + stated_receivables * receivables_rate / 100 + stated_prepaid_inputs * prepaid_inputs_rate / 100 + growing_crops_counted * growing_crop_rate / 100, 2)"
    compute_basis:
      stated_stored_grain: "the figure always rests on the collateral values stated on the line's most recent certificate, the one with the latest as-of date."
      stated_contracted_grain: "the figure always rests on the collateral values stated on the line's most recent certificate, the one with the latest as-of date."
      stated_livestock: "the figure always rests on the collateral values stated on the line's most recent certificate, the one with the latest as-of date."
      stated_receivables: "the figure always rests on the collateral values stated on the line's most recent certificate, the one with the latest as-of date."
      stated_prepaid_inputs: "the figure always rests on the collateral values stated on the line's most recent certificate, the one with the latest as-of date."
      stated_growing_crops: "the figure always rests on the collateral values stated on the line's most recent certificate, the one with the latest as-of date."
      certificate_as_of: "the figure always rests on the collateral values stated on the line's most recent certificate, the one with the latest as-of date."
      certificate_received: "when the certificate was received more than stale_value_late_days calendar days after its as-of date"
      assigned_policy_held: "In these rules the crop-year assigned policy is a crop insurance policy in active status for the line's crop year whose indemnity is assigned to the association for this line."
      assigned_coverage_pct: "when the line has a crop-year assigned policy whose coverage level is at least growing_crop_high_coverage_pct percent"
      growing_crop_rate: "Insured growing crops are lent against at growing_crop_rate_high_coverage percent when the line has a crop-year assigned policy whose coverage level is at least growing_crop_high_coverage_pct percent; at zero when the line has no crop-year assigned policy or that policy's coverage level is below crop_insurance_min_coverage_pct; and at advance_rate_insured_growing_crops_pct when the line has a crop-year assigned policy whose coverage level is at least crop_insurance_min_coverage_pct but below growing_crop_high_coverage_pct percent."
      guarantee_yield: "The policy guarantee is the approved yield times the insured acres times the coverage level read as a percentage times the price named."
      guarantee_acres: "The policy guarantee is the approved yield times the insured acres times the coverage level read as a percentage times the price named."
      guarantee_coverage: "The policy guarantee is the approved yield times the insured acres times the coverage level read as a percentage times the price named."
      guarantee_projected_price: "the lower of the stated value and the policy guarantee figured at the projected price when that policy's harvest price has not yet been released"
      guarantee_harvest_price: "the lower of the stated value and the policy guarantee figured at the higher of the projected price and the harvest price when the crop-year assigned policy's harvest price has been released"
      guarantee_policy_held: "and the stated value when the line has no crop-year assigned policy."
      growing_crops_counted: "The insured growing crops value counted is the lower of the stated value and the policy guarantee figured at the higher of the projected price and the harvest price when the crop-year assigned policy's harvest price has been released; the lower of the stated value and the policy guarantee figured at the projected price when that policy's harvest price has not yet been released; and the stated value when the line has no crop-year assigned policy."
      term_start: "The start of the current term is the last renewal date, or the booking date for a line never renewed, and a whole month is counted only once the as-of date reaches the same day of the month as the term start."
      months_into_term: "The start of the current term is the last renewal date, or the booking date for a line never renewed, and a whole month is counted only once the as-of date reaches the same day of the month as the term start."
      prepaid_inputs_rate: "Prepaid inputs are lent against at zero when the certificate's as-of date falls prepaid_inputs_applied_months or more whole months after the start of the current term, at prepaid_inputs_midseason_share times advance_rate_prepaid_inputs_pct when it falls at least prepaid_inputs_midseason_months but fewer than prepaid_inputs_applied_months whole months after it, and at advance_rate_prepaid_inputs_pct when it falls fewer than prepaid_inputs_midseason_months whole months after it."
      receipt_lag_days: "the as-of date itself being day 0; the advance rate then acts on the value so taken."
      market_value_factor: "The stated unpriced stored grain value and the stated market livestock value are each taken at stale_value_factor_late times the stated amount when the certificate was received more than stale_value_late_days calendar days after its as-of date, at stale_value_factor_mid times the stated amount when it was received more than stale_value_mid_days but no more than stale_value_late_days calendar days after it, and at the stated amount when it was received no more than stale_value_mid_days calendar days after it, the as-of date itself being day 0; the advance rate then acts on the value so taken."
      bin_loan_held: "and at advance_rate_stored_grain_pct when the member holds no Grain Storage & Handling Loan in active status."
      bin_loan_collateral: "when the member holds a Grain Storage & Handling Loan in active status whose pledged collateral value is at least bin_secured_min_collateral_usd"
      stored_grain_rate: "Unpriced stored grain is lent against at advance_rate_stored_grain_pct plus bin_secured_rate_addon_pct points when the member holds a Grain Storage & Handling Loan in active status whose pledged collateral value is at least bin_secured_min_collateral_usd, at advance_rate_stored_grain_pct plus bin_partial_rate_addon_pct points when the member holds a Grain Storage & Handling Loan in active status whose pledged collateral value is below bin_secured_min_collateral_usd, and at advance_rate_stored_grain_pct when the member holds no Grain Storage & Handling Loan in active status."
      certificates_last_year: "certificates on the line have an as-of date within the twelve whole months before today"
      receivables_rate: "Receivables are lent against at receivables_rate_sparse_pct percent when fewer than receivables_reporting_irregular_count certificates on the line have an as-of date within the twelve whole months before today, at receivables_rate_irregular_pct percent when at least receivables_reporting_irregular_count but fewer than receivables_reporting_full_count do, and at advance_rate_receivables_pct when receivables_reporting_full_count or more do; the certificate being figured counts among them."
      result: "The six products are added together and the total is rounded once to cents."
    factors:
      - id: growing_crop_advance_rate
        effect: parameter
        decides: growing_crop_rate
        bindings: [assigned_policy_held, assigned_coverage_pct, growing_crop_rate]
        ladder:
          - when: "the line has a crop-year assigned policy whose coverage level is at least growing_crop_high_coverage_pct percent"
            value: "K('growing_crop_rate_high_coverage')"
          - when: "the line has no crop-year assigned policy, or that policy's coverage level is below crop_insurance_min_coverage_pct"
            value: "0"
          - when: "otherwise: a crop-year assigned policy whose coverage level is at least crop_insurance_min_coverage_pct but below growing_crop_high_coverage_pct percent"
            value: "P('advance_rate_insured_growing_crops_pct')"
        baseline:
          growing_crop_rate: "P('advance_rate_insured_growing_crops_pct') if (assigned_policy_held and assigned_coverage_pct >= P('crop_insurance_min_coverage_pct')) else 0"
        evidence: [cross_category, tier_param]
        cross_difficulty: null
      - id: growing_crop_value_counted
        effect: method
        decides: growing_crops_counted
        bindings: [guarantee_yield, guarantee_acres, guarantee_coverage, guarantee_projected_price, guarantee_harvest_price, guarantee_policy_held, growing_crops_counted]
        ladder:
          - when: "the crop-year assigned policy's harvest price has been released"
            method: "the lower of the stated value and the policy guarantee figured at the higher of the projected and harvest prices"
          - when: "the crop-year assigned policy's harvest price has not yet been released"
            method: "the lower of the stated value and the policy guarantee figured at the projected price"
          - when: "otherwise: the line has no crop-year assigned policy"
            method: "the stated value as written on the certificate"
        baseline:
          growing_crops_counted: "stated_growing_crops"
        evidence: [cross_category]
        cross_difficulty: null
      - id: prepaid_inputs_seasonal_rate
        effect: parameter
        decides: prepaid_inputs_rate
        bindings: [term_start, months_into_term, prepaid_inputs_rate]
        ladder:
          - when: "the as-of date falls prepaid_inputs_applied_months or more whole months after the term start"
            value: "0"
          - when: "the as-of date falls at least prepaid_inputs_midseason_months but fewer than prepaid_inputs_applied_months whole months after the term start"
            value: "K('prepaid_inputs_midseason_share') * P('advance_rate_prepaid_inputs_pct')"
          - when: "otherwise: fewer than prepaid_inputs_midseason_months whole months after the term start"
            value: "P('advance_rate_prepaid_inputs_pct')"
        baseline:
          prepaid_inputs_rate: "P('advance_rate_prepaid_inputs_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: late_certificate_market_value
        effect: method
        decides: market_value_factor
        bindings: [certificate_received, receipt_lag_days, market_value_factor]
        ladder:
          - when: "the certificate was received more than stale_value_late_days calendar days after its as-of date"
            method: "stored grain and market livestock are taken at stale_value_factor_late times their stated values"
          - when: "the certificate was received more than stale_value_mid_days but no more than stale_value_late_days calendar days after its as-of date"
            method: "stored grain and market livestock are taken at stale_value_factor_mid times their stated values"
          - when: "otherwise: received no more than stale_value_mid_days calendar days after its as-of date"
            method: "stored grain and market livestock are taken at their stated values"
        baseline:
          market_value_factor: "1"
        evidence: [date, history]
        cross_difficulty: null
      - id: bin_secured_stored_grain_rate
        effect: parameter
        decides: stored_grain_rate
        bindings: [bin_loan_held, bin_loan_collateral, stored_grain_rate]
        ladder:
          - when: "the member holds a Grain Storage & Handling Loan in active status whose pledged collateral value is at least bin_secured_min_collateral_usd"
            value: "P('advance_rate_stored_grain_pct') + K('bin_secured_rate_addon_pct')"
          - when: "the member holds a Grain Storage & Handling Loan in active status whose pledged collateral value is below bin_secured_min_collateral_usd"
            value: "P('advance_rate_stored_grain_pct') + K('bin_partial_rate_addon_pct')"
          - when: "otherwise: no Grain Storage & Handling Loan in active status"
            value: "P('advance_rate_stored_grain_pct')"
        baseline:
          stored_grain_rate: "P('advance_rate_stored_grain_pct')"
        evidence: [cross_category, tier_param]
        cross_difficulty: equipment
      - id: certificate_reporting_receivables_rate
        effect: parameter
        decides: receivables_rate
        bindings: [certificates_last_year, receivables_rate]
        ladder:
          - when: "fewer than receivables_reporting_irregular_count certificates with an as-of date in the last twelve whole months"
            value: "K('receivables_rate_sparse_pct')"
          - when: "at least receivables_reporting_irregular_count but fewer than receivables_reporting_full_count such certificates"
            value: "K('receivables_rate_irregular_pct')"
          - when: "otherwise: receivables_reporting_full_count or more such certificates"
            value: "P('advance_rate_receivables_pct')"
        baseline:
          receivables_rate: "P('advance_rate_receivables_pct')"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: operating_borrowing_base, aggregate: latest, field: stored_grain_value, filters: {}}
        - {table: operating_borrowing_base, aggregate: count, field: certificate_id, within_months: 12, filters: {}}
      cross_category: [cropins, equipment]

  - id: operating_ext_overadvance_fee
    base_policy_refs: [operating_advance_eligibility, operating_overadvance]
    overwrite:
      - base_policy: operating_overadvance
        superseded_clause: >-
          The advance is booked in full and an overadvance fee equal to overadvance_fee_pct of the overadvance portion,
          rounded to cents, is assessed the same day as a separate fee row with fee_code overadvance whose source_txn_id
          is that advance.
        replaced_by: >-
          an overadvance fee is charged once against an advance that took outstanding principal past the line's
          available credit, as a separate fee charge with the overadvance fee code pointing to that advance, on the day
          the overadvance shows on the records: the day of the advance itself, or, when the borrowing base that reveals
          it is recorded later, the day that borrowing base is recorded.
    trigger: state_due
    subject: [operating_draw]
    computes: amount
    target_tool: assess_overadvance_fee_10e059b9
    params:
      overadvance_fee_repeat_pct: 1.5
      overadvance_fee_habitual_pct: 2.0
      overadvance_unplanned_addon_pct: 0.25
      overadvance_supplier_credit_pct: 0.25
      overadvance_deep_share: 0.75
      overadvance_mid_share: 0.5
      overadvance_deep_addon_pct: 0.5
      overadvance_mid_addon_pct: 0.25
      overadvance_relief_autopay_share: 0.25
      overadvance_relief_share: 0.1
      unverified_early_days: 3
      unverified_late_days: 10
      unverified_early_share: 0.5
      unverified_late_share: 0.75
    rule: >-
      On a product with overadvance_tolerance_pct above zero, an overadvance fee is charged once against an advance
      that took outstanding principal past the line's available credit, as a separate fee charge with the overadvance
      fee code pointing to that advance, on the day the overadvance shows on the records: the day of the advance itself,
      or, when the borrowing base that reveals it is recorded later, the day that borrowing base is recorded. This rule
      prices the fee on the line's latest advance; every earlier advance was priced, or found within its available
      credit, on the day it was drawn. The overadvance fee on the line's latest advance is fixed only after the
      association has recorded its own borrowing base on the line's most recent certificate. The overadvance portion
      is the advance amount less the available credit immediately before it, and never less than zero. The outstanding
      principal before the advance is the line's principal worked out from its transaction history (advances plus
      returned principal payments less principal payments) less the advance itself. On a revolving product the
      available credit immediately before the advance is the lending limit less the outstanding principal before the
      advance, the lending limit being the lower of the commitment and the borrowing base on the line's most recent
      certificate when the product requires a borrowing base and the commitment when it does not; on a product that is
      not revolving, which runs a single term, it is the commitment less every earlier advance booked on the line. The
      fee is the overadvance portion times overadvance_fee_pct, read as a percentage, rounded once to cents. Where one
      of the rules below sets the fee percentage, a reduction of the fee or a share of it, it takes the place of the
      standard figure.
      The fee percentage is overadvance_fee_habitual_pct when two or more overadvance fees were charged on the line in
      the twelve whole months before today, overadvance_fee_repeat_pct when exactly one was, and overadvance_fee_pct
      when none was.
      overadvance_unplanned_addon_pct points are added to the fee percentage when the advance was requested through
      online banking or the mobile app, overadvance_supplier_credit_pct points are taken off it when the advance was
      requested through any other channel and its proceeds were paid directly to an input supplier, and nothing is added
      or taken off when the advance was requested through any other channel with any other delivery of proceeds.
      overadvance_deep_addon_pct points are added to the fee percentage when the overadvance portion is at least
      overadvance_deep_share of the line's overadvance tolerance (overadvance_tolerance_pct of the commitment),
      overadvance_mid_addon_pct points when it is at least overadvance_mid_share of the tolerance but below
      overadvance_deep_share of it, and nothing when it is below overadvance_mid_share of the tolerance.
      The fee is reduced by the share overadvance_relief_autopay_share when the member holds a Farm Real Estate loan in
      active status whose installments are collected by automatic payment, by the share overadvance_relief_share when the
      member holds a Farm Real Estate loan in active status whose installments are not collected by automatic payment,
      and by nothing when the member holds no Farm Real Estate loan in active status.
      An advance drawn while the association had not yet verified a newly delivered certificate is treated as a
      technical overadvance: the fee is taken at unverified_early_share of itself when the advance was drawn no more
      than unverified_early_days calendar days after the line's most recent certificate was received, at
      unverified_late_share of itself when it was drawn more than unverified_early_days but no more than
      unverified_late_days calendar days after that receipt, and whole when it was drawn more than unverified_late_days
      days after that receipt or before the certificate was received, the received date itself being day 0.
      The fee percentage and the points added or taken off are first added together into one percentage, the
      overadvance portion is multiplied by that percentage, that result is multiplied by one less the reduction share
      and then by the technical-overadvance share, and only that final figure is rounded to cents.
    baseline:
      rule: >-
        The overadvance portion is the advance amount less the available credit immediately before it, and never less
        than zero. The outstanding principal before the advance is the line's principal worked out from its transaction
        history (advances plus returned principal payments less principal payments) less the advance itself. On a
        revolving product the available credit immediately before the advance is the lending limit less the outstanding
        principal before the advance, the lending limit being the lower of the commitment and the borrowing base on the
        line's most recent certificate when the product requires a borrowing base and the commitment when it does not;
        on a product that is not revolving, which runs a single term, it is the commitment less every earlier advance
        booked on the line. The fee is the overadvance portion times overadvance_fee_pct, read as a percentage, rounded
        once to cents.
      params: [overadvance_fee_pct]
    prerequisite:
      - problem: operating_ext_certificate_lendable_value
        kind: value_input
        gate: credit_before_advance
        form: action
        policy_source: >-
          The overadvance fee on the line's latest advance is fixed only after the association has recorded its own
          borrowing base on the line's most recent certificate.
        fallback_reason: >-
          A certificate always carries a borrowing base figure, whether the member's own or the association's; no field
          of the certificate or the line shows which of the two stands, so the records cannot name a state that marks the
          association's figure as recorded, and the dependency is stated as the recording itself.
        condition: >-
          The line's most recent borrowing base certificate carries the borrowing base the association worked out from
          its stated collateral values, not the figure the member wrote on it.
        resolved_by: record_certificate_borrowing_base_37c8bf27
        effect: >-
          The available credit immediately before the advance is measured against the recorded association borrowing
          base, so a lower borrowing base than the member's figure turns part of the advance into an overadvance portion
          on which the fee is charged.
    cross_category:
      - category: farmland
        as: branch
        reads: [status, autopay_enrolled]
        note: The fee reduction is decided from the member's Farm Real Estate loan in active status and whether it is on automatic payment.
    compute:
      - advance_amount: "LATEST('operating_transactions', 'amount', date_field='effective_date', event_type='operating_draw')"
      - principal_from_history: "SUM('operating_transactions', 'amount', event_type='operating_draw') + SUM('operating_transactions', 'amount', event_type='operating_principal_payment_return') - SUM('operating_transactions', 'amount', event_type='operating_principal_payment')"
      - principal_before_advance: "principal_from_history - advance_amount"
      - latest_certificate_base: "LATEST('operating_borrowing_base', 'borrowing_base_amount', date_field='as_of_date')"
      - lending_limit_before: "MN(F('commitment_amount'), latest_certificate_base) if (P('borrowing_base_required') and latest_certificate_base) else F('commitment_amount')"
      - earlier_advances: "SUM('operating_transactions', 'amount', event_type='operating_draw') - advance_amount"
      - credit_before_advance: "lending_limit_before - principal_before_advance if P('revolving') else F('commitment_amount') - earlier_advances"
      - overadvance_portion: "MX(0, advance_amount - credit_before_advance)"
      - overadvance_fees_last_year: "COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_fee_assessed', fee_code='overadvance')"
      - fee_pct: "K('overadvance_fee_habitual_pct') if overadvance_fees_last_year >= 2 else (K('overadvance_fee_repeat_pct') if overadvance_fees_last_year == 1 else P('overadvance_fee_pct'))"
      - advance_channel: "LATEST('operating_transactions', 'channel', date_field='effective_date', event_type='operating_draw')"
      - advance_delivery: "LATEST('operating_transactions', 'disbursement_method', date_field='effective_date', event_type='operating_draw')"
      - channel_points: "K('overadvance_unplanned_addon_pct') if (advance_channel == 'online_banking' or advance_channel == 'mobile_app') else (0 - K('overadvance_supplier_credit_pct') if (advance_delivery == 'input_supplier_direct' and advance_channel != 'online_banking' and advance_channel != 'mobile_app') else 0)"
      - depth_advance_amount: "LATEST('operating_transactions', 'amount', date_field='effective_date', event_type='operating_draw')"
      - depth_share: "MX(0, depth_advance_amount - credit_before_advance) / MX(F('commitment_amount') * P('overadvance_tolerance_pct') / 100, 0.01)"
      - depth_points: "K('overadvance_deep_addon_pct') if depth_share >= K('overadvance_deep_share') else (K('overadvance_mid_addon_pct') if depth_share >= K('overadvance_mid_share') else 0)"
      - land_loan_held: "EXISTS('farmland', status='active')"
      - land_loan_autopay: "CFIELD('farmland', 'autopay_enrolled', status='active')"
      - relief_share: "K('overadvance_relief_autopay_share') if (land_loan_held and land_loan_autopay == True) else (K('overadvance_relief_share') if (land_loan_held and land_loan_autopay != True) else 0)"
      - certificate_received: "LATEST('operating_borrowing_base', 'submitted_date', date_field='as_of_date')"
      - unverified_advance_date: "LATEST('operating_transactions', 'effective_date', date_field='effective_date', event_type='operating_draw')"
      - days_after_receipt: "DAYS(certificate_received, unverified_advance_date) if certificate_received else -1"
      - unverified_share: "K('unverified_early_share') if (days_after_receipt >= 0 and days_after_receipt <= K('unverified_early_days')) else (K('unverified_late_share') if (days_after_receipt > K('unverified_early_days') and days_after_receipt <= K('unverified_late_days')) else 1)"
      - result: "RND(overadvance_portion * (fee_pct + channel_points + depth_points) / 100 * (1 - relief_share) * unverified_share, 2)"
    compute_basis:
      advance_amount: "This rule prices the fee on the line's latest advance; every earlier advance was priced, or found within its available credit, on the day it was drawn."
      principal_from_history: "The outstanding principal before the advance is the line's principal worked out from its transaction history (advances plus returned principal payments less principal payments) less the advance itself."
      principal_before_advance: "The outstanding principal before the advance is the line's principal worked out from its transaction history (advances plus returned principal payments less principal payments) less the advance itself."
      latest_certificate_base: "the lending limit being the lower of the commitment and the borrowing base on the line's most recent certificate when the product requires a borrowing base and the commitment when it does not"
      lending_limit_before: "the lending limit being the lower of the commitment and the borrowing base on the line's most recent certificate when the product requires a borrowing base and the commitment when it does not"
      earlier_advances: "on a product that is not revolving, which runs a single term, it is the commitment less every earlier advance booked on the line."
      credit_before_advance: "On a revolving product the available credit immediately before the advance is the lending limit less the outstanding principal before the advance"
      overadvance_portion: "The overadvance portion is the advance amount less the available credit immediately before it, and never less than zero."
      overadvance_fees_last_year: "when two or more overadvance fees were charged on the line in the twelve whole months before today"
      fee_pct: "The fee percentage is overadvance_fee_habitual_pct when two or more overadvance fees were charged on the line in the twelve whole months before today, overadvance_fee_repeat_pct when exactly one was, and overadvance_fee_pct when none was."
      advance_channel: "when the advance was requested through online banking or the mobile app"
      advance_delivery: "when the advance was requested through any other channel and its proceeds were paid directly to an input supplier"
      channel_points: "overadvance_unplanned_addon_pct points are added to the fee percentage when the advance was requested through online banking or the mobile app, overadvance_supplier_credit_pct points are taken off it when the advance was requested through any other channel and its proceeds were paid directly to an input supplier, and nothing is added or taken off when the advance was requested through any other channel with any other delivery of proceeds."
      depth_advance_amount: "when the overadvance portion is at least overadvance_deep_share of the line's overadvance tolerance (overadvance_tolerance_pct of the commitment)"
      depth_share: "when the overadvance portion is at least overadvance_deep_share of the line's overadvance tolerance (overadvance_tolerance_pct of the commitment)"
      depth_points: "overadvance_deep_addon_pct points are added to the fee percentage when the overadvance portion is at least overadvance_deep_share of the line's overadvance tolerance (overadvance_tolerance_pct of the commitment), overadvance_mid_addon_pct points when it is at least overadvance_mid_share of the tolerance but below overadvance_deep_share of it, and nothing when it is below overadvance_mid_share of the tolerance."
      land_loan_held: "and by nothing when the member holds no Farm Real Estate loan in active status."
      land_loan_autopay: "when the member holds a Farm Real Estate loan in active status whose installments are collected by automatic payment"
      relief_share: "The fee is reduced by the share overadvance_relief_autopay_share when the member holds a Farm Real Estate loan in active status whose installments are collected by automatic payment, by the share overadvance_relief_share when the member holds a Farm Real Estate loan in active status whose installments are not collected by automatic payment, and by nothing when the member holds no Farm Real Estate loan in active status."
      certificate_received: "when the advance was drawn no more than unverified_early_days calendar days after the line's most recent certificate was received"
      unverified_advance_date: "when the advance was drawn no more than unverified_early_days calendar days after the line's most recent certificate was received"
      days_after_receipt: "the received date itself being day 0."
      unverified_share: "An advance drawn while the association had not yet verified a newly delivered certificate is treated as a technical overadvance: the fee is taken at unverified_early_share of itself when the advance was drawn no more than unverified_early_days calendar days after the line's most recent certificate was received, at unverified_late_share of itself when it was drawn more than unverified_early_days but no more than unverified_late_days calendar days after that receipt, and whole when it was drawn more than unverified_late_days days after that receipt or before the certificate was received, the received date itself being day 0."
      result: "The fee percentage and the points added or taken off are first added together into one percentage, the overadvance portion is multiplied by that percentage, that result is multiplied by one less the reduction share and then by the technical-overadvance share, and only that final figure is rounded to cents."
    factors:
      - id: overadvance_repeat_percentage
        effect: parameter
        decides: fee_pct
        bindings: [overadvance_fees_last_year, fee_pct]
        ladder:
          - when: "two or more overadvance fees charged on the line in the last twelve whole months"
            value: "K('overadvance_fee_habitual_pct')"
          - when: "exactly one overadvance fee charged on the line in the last twelve whole months"
            value: "K('overadvance_fee_repeat_pct')"
          - when: "otherwise: none"
            value: "P('overadvance_fee_pct')"
        baseline:
          fee_pct: "P('overadvance_fee_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: overadvance_channel_points
        effect: parameter
        decides: channel_points
        bindings: [advance_channel, advance_delivery, channel_points]
        ladder:
          - when: "the advance was requested through online banking or the mobile app"
            value: "K('overadvance_unplanned_addon_pct')"
          - when: "the advance was requested through any other channel and its proceeds were paid directly to an input supplier"
            value: "0 - K('overadvance_supplier_credit_pct')"
          - when: "otherwise: any other channel with any other delivery of proceeds"
            value: "0"
        baseline:
          channel_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: overadvance_depth_points
        effect: parameter
        decides: depth_points
        bindings: [depth_advance_amount, depth_share, depth_points]
        ladder:
          - when: "the overadvance portion is at least overadvance_deep_share of the line's overadvance tolerance"
            value: "K('overadvance_deep_addon_pct')"
          - when: "the overadvance portion is at least overadvance_mid_share but below overadvance_deep_share of the tolerance"
            value: "K('overadvance_mid_addon_pct')"
          - when: "otherwise: below overadvance_mid_share of the tolerance"
            value: "0"
        baseline:
          depth_points: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: land_relationship_fee_relief
        effect: parameter
        decides: relief_share
        bindings: [land_loan_held, land_loan_autopay, relief_share]
        ladder:
          - when: "the member holds a Farm Real Estate loan in active status whose installments are collected by automatic payment"
            value: "K('overadvance_relief_autopay_share')"
          - when: "the member holds a Farm Real Estate loan in active status whose installments are not collected by automatic payment"
            value: "K('overadvance_relief_share')"
          - when: "otherwise: no Farm Real Estate loan in active status"
            value: "0"
        baseline:
          relief_share: "0"
        evidence: [cross_category]
        cross_difficulty: farmland
      - id: technical_overadvance_share
        effect: method
        decides: unverified_share
        bindings: [certificate_received, unverified_advance_date, days_after_receipt, unverified_share]
        ladder:
          - when: "the advance was drawn no more than unverified_early_days calendar days after the line's most recent certificate was received"
            method: "the fee figured so far is multiplied by unverified_early_share"
          - when: "the advance was drawn more than unverified_early_days but no more than unverified_late_days calendar days after that receipt"
            method: "the fee figured so far is multiplied by unverified_late_share"
          - when: "otherwise: drawn more than unverified_late_days days after that receipt, or before the certificate was received"
            method: "the fee figured so far is charged whole"
        baseline:
          unverified_share: "1"
        evidence: [date, history]
        cross_difficulty: null
    inputs:
      history:
        - {table: operating_transactions, aggregate: sum, field: amount, filters: {event_type: operating_draw}}
        - {table: operating_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: operating_fee_assessed, fee_code: overadvance}}
        - {table: operating_transactions, aggregate: latest, field: channel, filters: {event_type: operating_draw}}
      cross_category: [farmland]

  - id: operating_ext_borrowing_base_shortfall_paydown
    base_policy_refs: [operating_payment_application, operating_borrowing_base_calculation]
    overwrite:
      - base_policy: operating_borrowing_base_calculation
        superseded_clause: >-
          When a certificate shows outstanding principal above its borrowing base, the shortfall must be repaid within
          bbc_deficiency_cure_days calendar days after the certificate's submitted_date (the submitted date being day 0)
        replaced_by: >-
          When a member asks to pay down an operating line by what is needed to bring it back within its borrowing base,
          the paydown is a principal payment debited from the member's own checking account on the member's own
          authorisation, in the amount worked out below, and it is made within bbc_deficiency_cure_days calendar days
          after the certificate's received date, that date being day 0.
    trigger: on_request
    subject: [operating_principal_payment]
    computes: amount
    target_tool: authorize_shortfall_paydown_62bf68fd
    params:
      shortfall_cushion_share: 0.98
      shortfall_cushion_flat_usd: 5000.0
      land_allowance_high_pct: 1.0
      land_allowance_low_pct: 0.5
      land_equity_high_share: 0.5
      land_equity_low_share: 0.25
    rule: >-
      When a member asks to pay down an operating line by what is needed to bring it back within its borrowing base,
      the paydown is a principal payment debited from the member's own checking account on the member's own
      authorisation, in the amount worked out below, and it is made within bbc_deficiency_cure_days calendar days
      after the certificate's received date, that date being day 0. The shortfall paydown is not fixed until the
      association has worked out its own borrowing base for the line's most recent certificate and recorded it in place
      of the member's own figure. The shortfall paydown is fixed only after an overadvance fee stands against the line's
      latest advance whenever that advance took the line past its available credit. The lendable limit is the lower of the commitment and the
      borrowing base on the line's most recent certificate when the product requires a borrowing base, and the
      commitment when it does not. The paydown is the outstanding principal worked out from the line's transaction
      history (advances plus returned principal payments less principal payments) less the lendable limit, never less
      than zero, rounded to cents. Where one of the rules below sets a reserve, a cushion, an allowance or a credit, it
      enters the paydown as set out here.
      The lendable limit is reduced by a reserve: the billed interest not yet paid plus the fees assessed on the line and
      not yet paid or waived, when billed interest is unpaid and the due date of the line's latest interest bill has
      passed; the unpaid fees alone when no billed interest is past due in that sense and fees are owed; and nothing
      when no billed interest is past due and no fee is owed.
      The limit left after that reserve is taken at shortfall_cushion_share of itself when two or more overadvance fees
      were charged on the line in the twelve whole months before today, at itself less shortfall_cushion_flat_usd when
      exactly one was, and at itself when none was.
      A land-equity allowance is taken off the shortfall: land_allowance_high_pct percent of the commitment when the
      member holds a Farm Real Estate loan in active status whose mortgaged collateral value less its principal balance
      is at least land_equity_high_share of the commitment, land_allowance_low_pct percent of the commitment when that
      land equity is at least land_equity_low_share of the commitment but below land_equity_high_share of it, and
      nothing when the member holds no Farm Real Estate loan in active status or its land equity is below
      land_equity_low_share of the commitment.
      An assigned indemnity credit is taken off the shortfall: the indemnity determined and not yet paid on the crop
      insurance policy whose indemnity is assigned to this line, in full when that policy owes no premium; that
      indemnity less the premium the policy owes when it owes premium and the indemnity is larger than the premium; and
      nothing when no indemnity is payable or the premium owed is at least the indemnity.
      The order is fixed: the reserve is first taken off the lendable limit, the cushion is applied to that result,
      the outstanding principal less the cushioned limit gives the shortfall, the land-equity allowance and the assigned
      indemnity credit are both subtracted from that shortfall, and the remainder, never less than zero, rounded once to
      cents, is the paydown.
    baseline:
      rule: >-
        The lendable limit is the lower of the commitment and the borrowing base on the line's most recent certificate
        when the product requires a borrowing base, and the commitment when it does not. The paydown is the outstanding
        principal worked out from the line's transaction history (advances plus returned principal payments less
        principal payments) less the lendable limit, never less than zero, rounded to cents.
      params: []
    prerequisite:
      - problem: operating_ext_certificate_lendable_value
        kind: value_input
        gate: lendable_limit
        form: action
        policy_source: >-
          The shortfall paydown is not fixed until the association has worked out its own borrowing base for the line's
          most recent certificate and recorded it in place of the member's own figure.
        fallback_reason: >-
          The certificate's borrowing base field holds a figure whether the member wrote it or the association recorded
          it, and nothing on the certificate or the line tells the two apart, so no record-visible state singles out the
          recording; the sentence names the recording itself.
        condition: >-
          The line's most recent borrowing base certificate carries the association's own borrowing base worked out from
          its stated collateral values.
        resolved_by: record_certificate_borrowing_base_37c8bf27
        effect: >-
          The lendable limit takes the association's borrowing base instead of the member's own figure, which changes the
          shortfall the paydown covers.
      - problem: operating_ext_overadvance_fee
        kind: value_input
        gate: reserve
        form: state
        policy_source: >-
          The shortfall paydown is fixed only after an overadvance fee stands against the line's latest advance whenever
          that advance took the line past its available credit.
        condition: >-
          When the line's latest advance exceeded the available credit immediately before it, an overadvance fee charge on
          the line points to that advance.
        resolved_by: assess_overadvance_fee_10e059b9
        effect: >-
          The overadvance fee becomes an unpaid fee on the line, so the reserve taken off the lendable limit includes it,
          and the count of overadvance fees in the last twelve months that sets the cushion includes it.
    cross_category:
      - category: farmland
        as: branch
        reads: [status, collateral_value, principal_balance]
        note: The land-equity allowance is decided from the member's Farm Real Estate loan in active status and its collateral less principal.
      - category: cropins
        as: branch
        reads: [assigned_loan_id, indemnity_assigned, indemnity_payable, premium_due]
        note: The assigned indemnity credit is decided from the indemnity payable and premium owed on the policy assigned to the line.
    compute:
      - principal_on_record: "SUM('operating_transactions', 'amount', event_type='operating_draw') + SUM('operating_transactions', 'amount', event_type='operating_principal_payment_return') - SUM('operating_transactions', 'amount', event_type='operating_principal_payment')"
      - recorded_borrowing_base: "LATEST('operating_borrowing_base', 'borrowing_base_amount', date_field='as_of_date')"
      - lendable_limit: "MN(F('commitment_amount'), recorded_borrowing_base) if P('borrowing_base_required') else F('commitment_amount')"
      - fees_unpaid: "RND(SUM('operating_transactions', 'amount', event_type='operating_fee_assessed') - SUM('operating_transactions', 'amount', event_type='operating_fee_payment') - SUM('operating_transactions', 'amount', event_type='operating_fee_waiver'), 2)"
      - billed_interest_unpaid: "RND(SUM('operating_transactions', 'amount', event_type='operating_interest_accrual') + SUM('operating_transactions', 'amount', event_type='operating_interest_payment_return') - SUM('operating_transactions', 'amount', event_type='operating_interest_payment'), 2)"
      - latest_bill_due_date: "LATEST('operating_transactions', 'due_date', date_field='due_date', event_type='operating_interest_accrual')"
      - interest_past_due: "billed_interest_unpaid > 0 and latest_bill_due_date and DAYS(latest_bill_due_date, NOW) > 0"
      - reserve: "billed_interest_unpaid + fees_unpaid if (interest_past_due and billed_interest_unpaid > 0) else (fees_unpaid if ((not interest_past_due) and fees_unpaid > 0) else 0)"
      - overadvance_fees_counted: "COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_fee_assessed', fee_code='overadvance')"
      - cushioned_limit: "(lendable_limit - reserve) * K('shortfall_cushion_share') if overadvance_fees_counted >= 2 else ((lendable_limit - reserve) - K('shortfall_cushion_flat_usd') if overadvance_fees_counted == 1 else (lendable_limit - reserve))"
      - land_loan_active: "EXISTS('farmland', status='active')"
      - land_collateral: "CFIELD('farmland', 'collateral_value', status='active') or 0"
      - land_principal: "CFIELD('farmland', 'principal_balance', status='active') or 0"
      - land_equity: "land_collateral - land_principal"
      - land_allowance: "F('commitment_amount') * K('land_allowance_high_pct') / 100 if (land_loan_active and land_equity >= K('land_equity_high_share') * F('commitment_amount')) else (F('commitment_amount') * K('land_allowance_low_pct') / 100 if (land_loan_active and land_equity >= K('land_equity_low_share') * F('commitment_amount')) else 0)"
      - indemnity_payable: "CFIELD('cropins', 'indemnity_payable', assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - premium_owed: "CFIELD('cropins', 'premium_due', assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - indemnity_credit: "indemnity_payable if (indemnity_payable > 0 and premium_owed == 0) else (indemnity_payable - premium_owed if (premium_owed > 0 and indemnity_payable > premium_owed) else 0)"
      - result: "RND(MX(0, principal_on_record - cushioned_limit - land_allowance - indemnity_credit), 2)"
    compute_basis:
      principal_on_record: "The paydown is the outstanding principal worked out from the line's transaction history (advances plus returned principal payments less principal payments) less the lendable limit, never less than zero, rounded to cents."
      recorded_borrowing_base: "The lendable limit is the lower of the commitment and the borrowing base on the line's most recent certificate when the product requires a borrowing base, and the commitment when it does not."
      lendable_limit: "The lendable limit is the lower of the commitment and the borrowing base on the line's most recent certificate when the product requires a borrowing base, and the commitment when it does not."
      fees_unpaid: "the unpaid fees alone when no billed interest is past due in that sense and fees are owed"
      billed_interest_unpaid: "the billed interest not yet paid plus the fees assessed on the line and not yet paid or waived"
      latest_bill_due_date: "when billed interest is unpaid and the due date of the line's latest interest bill has passed"
      interest_past_due: "when billed interest is unpaid and the due date of the line's latest interest bill has passed"
      reserve: "The lendable limit is reduced by a reserve: the billed interest not yet paid plus the fees assessed on the line and not yet paid or waived, when billed interest is unpaid and the due date of the line's latest interest bill has passed; the unpaid fees alone when no billed interest is past due in that sense and fees are owed; and nothing when no billed interest is past due and no fee is owed."
      overadvance_fees_counted: "when two or more overadvance fees were charged on the line in the twelve whole months before today"
      cushioned_limit: "The limit left after that reserve is taken at shortfall_cushion_share of itself when two or more overadvance fees were charged on the line in the twelve whole months before today, at itself less shortfall_cushion_flat_usd when exactly one was, and at itself when none was."
      land_loan_active: "and nothing when the member holds no Farm Real Estate loan in active status or its land equity is below land_equity_low_share of the commitment."
      land_collateral: "whose mortgaged collateral value less its principal balance is at least land_equity_high_share of the commitment"
      land_principal: "whose mortgaged collateral value less its principal balance is at least land_equity_high_share of the commitment"
      land_equity: "whose mortgaged collateral value less its principal balance is at least land_equity_high_share of the commitment"
      land_allowance: "A land-equity allowance is taken off the shortfall: land_allowance_high_pct percent of the commitment when the member holds a Farm Real Estate loan in active status whose mortgaged collateral value less its principal balance is at least land_equity_high_share of the commitment, land_allowance_low_pct percent of the commitment when that land equity is at least land_equity_low_share of the commitment but below land_equity_high_share of it, and nothing when the member holds no Farm Real Estate loan in active status or its land equity is below land_equity_low_share of the commitment."
      indemnity_payable: "the indemnity determined and not yet paid on the crop insurance policy whose indemnity is assigned to this line"
      premium_owed: "that indemnity less the premium the policy owes when it owes premium and the indemnity is larger than the premium"
      indemnity_credit: "An assigned indemnity credit is taken off the shortfall: the indemnity determined and not yet paid on the crop insurance policy whose indemnity is assigned to this line, in full when that policy owes no premium; that indemnity less the premium the policy owes when it owes premium and the indemnity is larger than the premium; and nothing when no indemnity is payable or the premium owed is at least the indemnity."
      result: "The order is fixed: the reserve is first taken off the lendable limit, the cushion is applied to that result, the outstanding principal less the cushioned limit gives the shortfall, the land-equity allowance and the assigned indemnity credit are both subtracted from that shortfall, and the remainder, never less than zero, rounded once to cents, is the paydown."
    factors:
      - id: unpaid_charges_reserve
        effect: parameter
        decides: reserve
        bindings: [fees_unpaid, billed_interest_unpaid, latest_bill_due_date, interest_past_due, reserve]
        ladder:
          - when: "billed interest is unpaid and the due date of the line's latest interest bill has passed"
            value: "the unpaid billed interest plus the unpaid fees"
          - when: "no billed interest is past due and fees are owed"
            value: "the unpaid fees alone"
          - when: "otherwise: no billed interest past due and no fee owed"
            value: "0"
        baseline:
          reserve: "0"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_overadvance_cushion
        effect: method
        decides: cushioned_limit
        bindings: [overadvance_fees_counted, cushioned_limit]
        ladder:
          - when: "two or more overadvance fees charged on the line in the last twelve whole months"
            method: "the limit after the reserve is multiplied by shortfall_cushion_share"
          - when: "exactly one overadvance fee charged in the last twelve whole months"
            method: "shortfall_cushion_flat_usd is subtracted from the limit after the reserve"
          - when: "otherwise: none"
            method: "the limit after the reserve is used as it stands"
        baseline:
          cushioned_limit: "lendable_limit - reserve"
        evidence: [history]
        cross_difficulty: null
      - id: land_equity_allowance
        effect: parameter
        decides: land_allowance
        bindings: [land_loan_active, land_collateral, land_principal, land_equity, land_allowance]
        ladder:
          - when: "a Farm Real Estate loan in active status whose collateral less principal is at least land_equity_high_share of the commitment"
            value: "F('commitment_amount') * K('land_allowance_high_pct') / 100"
          - when: "a Farm Real Estate loan in active status whose land equity is at least land_equity_low_share but below land_equity_high_share of the commitment"
            value: "F('commitment_amount') * K('land_allowance_low_pct') / 100"
          - when: "otherwise: no such loan, or land equity below land_equity_low_share of the commitment"
            value: "0"
        baseline:
          land_allowance: "0"
        evidence: [cross_category]
        cross_difficulty: farmland
      - id: assigned_indemnity_credit
        effect: parameter
        decides: indemnity_credit
        bindings: [indemnity_payable, premium_owed, indemnity_credit]
        ladder:
          - when: "an indemnity is payable on the policy assigned to this line and the policy owes no premium"
            value: "the indemnity payable"
          - when: "the assigned policy owes premium and its payable indemnity is larger than that premium"
            value: "the indemnity payable less the premium owed"
          - when: "otherwise: no indemnity payable, or premium owed at least the indemnity"
            value: "0"
        baseline:
          indemnity_credit: "0"
        evidence: [cross_category]
        cross_difficulty: null
    inputs:
      history:
        - {table: operating_transactions, aggregate: sum, field: amount, filters: {event_type: operating_draw}}
        - {table: operating_transactions, aggregate: sum, field: amount, filters: {event_type: operating_fee_assessed}}
        - {table: operating_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: operating_fee_assessed, fee_code: overadvance}}
      cross_category: [farmland, cropins]

  - id: operating_ext_late_charge_amount
    base_policy_refs: [operating_evt_late_charge, operating_overadvance, operating_evt_returned_payment, operating_renewal,
                       operating_evt_unused_commitment_fee, operating_commitment_change, operating_evt_booking_fees]
    overwrite:
      - base_policy: operating_evt_late_charge
        superseded_clause: >-
          at late_charge_pct of the unpaid billed interest, no less than late_charge_min_usd and no more than
          late_charge_max_usd, rounded to cents,
        replaced_by: >-
          The late charge is the charge base times late_charge_pct, read as a percentage, rounded to cents and then kept
          no lower than late_charge_min_usd and no higher than late_charge_max_usd.
      - base_policy: operating_evt_late_charge
        superseded_clause: >-
          It is charged on an interest bill (an operating_interest_accrual row) whose billed amount is not fully paid by
          then (operating_msr_bill_paid below the bill amount)
        replaced_by: >-
          A line carries at most one late charge for a run of unpaid bills: the charge is assessed on the line's interest
          bill with the latest due date once that bill has passed its grace period with its billed amount not fully paid,
          and an older bill still unpaid at that point carries no further late charge.
    trigger: state_due
    subject: [operating_fee_assessed]
    computes: amount
    target_tool: assess_late_charge_706782fd
    params:
      late_charge_repeat_pct: 6.0
      late_charge_habitual_pct: 7.0
      land_current_share: 0.75
      land_paid_off_share: 0.9
      tenure_long_months: 120
      tenure_mid_months: 60
      tenure_long_share: 0.5
      tenure_mid_share: 0.8
    rule: >-
      A late charge is owed on an interest bill whose billed amount was not fully paid by the end of its grace period;
      it is charged once against that bill, as a fee charge with the late charge fee code pointing to the bill, on the
      day after the last grace day. A line carries at most one late charge for a run of unpaid bills: the charge is
      assessed on the line's interest bill with the latest due date once that bill has passed its grace period with its
      billed amount not fully paid, and an older bill still unpaid at that point carries no further late charge. The
      charge base is the bill's billed amount less the interest payments applied to it, with the bill's AutoDraft debit
      added back when it came back unpaid. The late
      charge is the charge base times late_charge_pct, read as a percentage, rounded to cents and then kept no lower
      than late_charge_min_usd and no higher than late_charge_max_usd. Where one of the rules below sets the charge
      base, the percentage or a share of the charge, it takes the place of the standard figure.
      The charge base is the bill's full billed amount, whatever was paid on it afterwards, when the bill's AutoDraft
      debit came back unpaid for a reason other than unauthorized; the billed amount less every payment applied to it,
      the returned debit counted as paid, when that debit came back unpaid as unauthorized; and the billed amount less
      the payments applied to it when no AutoDraft debit of the bill came back unpaid.
      The percentage is late_charge_habitual_pct when two or more late charges were charged on the line in the
      twenty-four whole months before today, late_charge_repeat_pct when exactly one was, and late_charge_pct when
      none was.
      The member is charged land_current_share of the figure when the member holds a Farm Real Estate loan in active
      status with no billed interest unpaid on it, land_paid_off_share of the figure when the member holds no Farm Real
      Estate loan in active status but holds one paid off, and the whole figure in every other case.
      The member is charged tenure_long_share of the figure when the line was first booked tenure_long_months or more
      whole months before today, tenure_mid_share of the figure when it was first booked at least tenure_mid_months but
      fewer than tenure_long_months whole months before today, and the whole figure when it was first booked fewer than
      tenure_mid_months whole months before today.
      The order is fixed: the charge base is multiplied by the percentage, that result by the land share and that
      result by the tenure share; the product is rounded to cents and only then kept within late_charge_min_usd and
      late_charge_max_usd.
    baseline:
      rule: >-
        The charge base is the bill's billed amount less the interest payments applied to it, with the bill's AutoDraft
        debit added back when it came back unpaid. The late charge is the charge base times late_charge_pct, read as a
        percentage, rounded to cents and then kept no lower than late_charge_min_usd and no higher than
        late_charge_max_usd.
      params: [late_charge_pct, late_charge_min_usd, late_charge_max_usd]
    prerequisite: []
    cross_category:
      - category: farmland
        as: branch
        reads: [status, accrued_interest]
        note: The land share of the charge is decided from the member's Farm Real Estate loans, their status and their unpaid billed interest.
    compute:
      - bill_ref: "LATEST('operating_transactions', 'txn_id', date_field='due_date', event_type='operating_interest_accrual')"
      - bill_amount: "LATEST('operating_transactions', 'amount', date_field='due_date', event_type='operating_interest_accrual')"
      - bill_due: "LATEST('operating_transactions', 'due_date', date_field='due_date', event_type='operating_interest_accrual')"
      - paid_on_bill: "SUM('operating_transactions', 'amount', event_type='operating_interest_payment', source_txn_id=bill_ref)"
      - debit_on_bill: "LATEST('operating_transactions', 'txn_id', date_field='effective_date', event_type='operating_interest_payment', source_txn_id=bill_ref, channel='autodraft') or ''"
      - returned_on_bill: "SUM('operating_transactions', 'amount', event_type='operating_interest_payment_return', source_txn_id=debit_on_bill) if debit_on_bill else 0"
      - return_reason_on_bill: "(LATEST('operating_transactions', 'return_reason', date_field='effective_date', event_type='operating_interest_payment_return', source_txn_id=debit_on_bill) or '') if debit_on_bill else ''"
      - charge_base: "bill_amount if (returned_on_bill > 0 and return_reason_on_bill != 'unauthorized') else (bill_amount - paid_on_bill if (returned_on_bill > 0 and return_reason_on_bill == 'unauthorized') else bill_amount - paid_on_bill + returned_on_bill)"
      - late_charges_two_years: "COUNT('operating_transactions', within_months=24, date_field='effective_date', event_type='operating_fee_assessed', fee_code='late_charge')"
      - charge_pct: "K('late_charge_habitual_pct') if late_charges_two_years >= 2 else (K('late_charge_repeat_pct') if late_charges_two_years == 1 else P('late_charge_pct'))"
      - land_loan_active: "EXISTS('farmland', status='active')"
      - land_billed_unpaid: "CFIELD('farmland', 'accrued_interest', status='active') or 0"
      - land_loan_paid_off: "EXISTS('farmland', status='paid_off')"
      - land_share: "K('land_current_share') if (land_loan_active and land_billed_unpaid == 0) else (K('land_paid_off_share') if ((not land_loan_active) and land_loan_paid_off) else 1)"
      - months_since_booked: "MONTHS(F('opened_date'), NOW)"
      - tenure_share: "K('tenure_long_share') if months_since_booked >= K('tenure_long_months') else (K('tenure_mid_share') if months_since_booked >= K('tenure_mid_months') else 1)"
      - result: "RND(MN(P('late_charge_max_usd'), MX(P('late_charge_min_usd'), RND(charge_base * charge_pct / 100 * land_share * tenure_share, 2))), 2)"
    compute_basis:
      bill_ref: "the charge is assessed on the line's interest bill with the latest due date once that bill has passed its grace period with its billed amount not fully paid"
      bill_amount: "The charge base is the bill's billed amount less the interest payments applied to it, with the bill's AutoDraft debit added back when it came back unpaid."
      bill_due: "the charge is assessed on the line's interest bill with the latest due date once that bill has passed its grace period with its billed amount not fully paid"
      paid_on_bill: "The charge base is the bill's billed amount less the interest payments applied to it, with the bill's AutoDraft debit added back when it came back unpaid."
      debit_on_bill: "with the bill's AutoDraft debit added back when it came back unpaid"
      returned_on_bill: "with the bill's AutoDraft debit added back when it came back unpaid"
      return_reason_on_bill: "when the bill's AutoDraft debit came back unpaid for a reason other than unauthorized"
      charge_base: "The charge base is the bill's full billed amount, whatever was paid on it afterwards, when the bill's AutoDraft debit came back unpaid for a reason other than unauthorized; the billed amount less every payment applied to it, the returned debit counted as paid, when that debit came back unpaid as unauthorized; and the billed amount less the payments applied to it when no AutoDraft debit of the bill came back unpaid."
      late_charges_two_years: "when two or more late charges were charged on the line in the twenty-four whole months before today"
      charge_pct: "The percentage is late_charge_habitual_pct when two or more late charges were charged on the line in the twenty-four whole months before today, late_charge_repeat_pct when exactly one was, and late_charge_pct when none was."
      land_loan_active: "when the member holds a Farm Real Estate loan in active status with no billed interest unpaid on it"
      land_billed_unpaid: "when the member holds a Farm Real Estate loan in active status with no billed interest unpaid on it"
      land_loan_paid_off: "when the member holds no Farm Real Estate loan in active status but holds one paid off"
      land_share: "The member is charged land_current_share of the figure when the member holds a Farm Real Estate loan in active status with no billed interest unpaid on it, land_paid_off_share of the figure when the member holds no Farm Real Estate loan in active status but holds one paid off, and the whole figure in every other case."
      months_since_booked: "when the line was first booked tenure_long_months or more whole months before today"
      tenure_share: "The member is charged tenure_long_share of the figure when the line was first booked tenure_long_months or more whole months before today, tenure_mid_share of the figure when it was first booked at least tenure_mid_months but fewer than tenure_long_months whole months before today, and the whole figure when it was first booked fewer than tenure_mid_months whole months before today."
      result: "The order is fixed: the charge base is multiplied by the percentage, that result by the land share and that result by the tenure share; the product is rounded to cents and only then kept within late_charge_min_usd and late_charge_max_usd."
    factors:
      - id: returned_debit_charge_base
        effect: method
        decides: charge_base
        bindings: [debit_on_bill, returned_on_bill, return_reason_on_bill, charge_base]
        ladder:
          - when: "the bill's AutoDraft debit came back unpaid for a reason other than unauthorized"
            method: "the charge base is the bill's full billed amount, whatever was paid afterwards"
          - when: "the bill's AutoDraft debit came back unpaid as unauthorized"
            method: "the charge base is the billed amount less every payment applied, the returned debit counted as paid"
          - when: "otherwise: no AutoDraft debit of the bill came back unpaid"
            method: "the charge base is the billed amount less the payments applied"
        baseline:
          charge_base: "bill_amount - paid_on_bill + returned_on_bill"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_late_percentage
        effect: parameter
        decides: charge_pct
        bindings: [late_charges_two_years, charge_pct]
        ladder:
          - when: "two or more late charges on the line in the last twenty-four whole months"
            value: "K('late_charge_habitual_pct')"
          - when: "exactly one late charge on the line in the last twenty-four whole months"
            value: "K('late_charge_repeat_pct')"
          - when: "otherwise: none"
            value: "P('late_charge_pct')"
        baseline:
          charge_pct: "P('late_charge_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: land_standing_share
        effect: parameter
        decides: land_share
        bindings: [land_loan_active, land_billed_unpaid, land_loan_paid_off, land_share]
        ladder:
          - when: "a Farm Real Estate loan in active status with no billed interest unpaid on it"
            value: "K('land_current_share')"
          - when: "no Farm Real Estate loan in active status but one paid off"
            value: "K('land_paid_off_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          land_share: "1"
        evidence: [cross_category]
        cross_difficulty: farmland
      - id: line_tenure_share
        effect: parameter
        decides: tenure_share
        bindings: [months_since_booked, tenure_share]
        ladder:
          - when: "the line was first booked tenure_long_months or more whole months ago"
            value: "K('tenure_long_share')"
          - when: "first booked at least tenure_mid_months but fewer than tenure_long_months whole months ago"
            value: "K('tenure_mid_share')"
          - when: "otherwise: fewer than tenure_mid_months whole months ago"
            value: "1"
        baseline:
          tenure_share: "1"
        evidence: [date]
        cross_difficulty: null
    inputs:
      history:
        - {table: operating_transactions, aggregate: latest, field: amount, filters: {event_type: operating_interest_accrual}}
        - {table: operating_transactions, aggregate: sum, field: amount, filters: {event_type: operating_interest_payment}}
        - {table: operating_transactions, aggregate: count, field: txn_id, within_months: 24, filters: {event_type: operating_fee_assessed, fee_code: late_charge}}
      cross_category: [farmland]

  - id: operating_ext_autodraft_enrolment_rate
    base_policy_refs: [operating_rate_setting, operating_evt_returned_payment, operating_autodraft_enrolment]
    overwrite:
      - base_policy: operating_rate_setting
        superseded_clause: "The program discount is program_rate_discount_pct."
        replaced_by: >-
          The program discount is program_taper_share times program_rate_discount_pct when the member is certified a
          beginning farmer on an active crop insurance policy for the line's crop year and the line was first booked more
          than program_full_months whole months before the enrolment day
      - base_policy: operating_rate_setting
        superseded_clause: "The AutoDraft discount is autodraft_rate_discount_pct and applies only while autodraft_enrolled is true."
        replaced_by: >-
          The AutoDraft discount is autodraft_late_share times autodraft_rate_discount_pct when one or more late charges
          were charged on the line in the twelve whole months before the enrolment day
      - base_policy: operating_rate_setting
        superseded_clause: >-
          The relationship discount is relationship_rate_discount_pct and applies only while the member holds at least
          one Farm Real Estate loan in active status (operating_msr_active_farmland).
        replaced_by: >-
          The relationship discount is relationship_rate_discount_pct times the principal balance of the member's Farm
          Real Estate loan in active status divided by the line's commitment, rounded to 3 decimal places, when that
          balance is below the commitment
      - base_policy: operating_rate_setting
        superseded_clause: >-
          Losing the relationship discount because a Farm Real Estate loan closed takes effect only at the next renewal,
          never mid-term.
        replaced_by: >-
          and zero when the member holds no Farm Real Estate loan in active status.
      - base_policy: operating_rate_setting
        superseded_clause: "Discounts are added together and the total is capped at rate_discount_cap_pct"
        replaced_by: >-
          The program, AutoDraft, relationship, equipment, membership and Country Home discounts are added together and
          the total is capped at rate_discount_cap_pct
    trigger: on_request
    subject: [operating_autodraft_change]
    computes: interest_rate
    target_tool: enroll_autodraft_36bd3fb2
    params:
      base_rate_1: 7.75
      base_rate_2_from: "2025-10-30"
      base_rate_2: 7.5
      base_rate_3_from: "2025-12-11"
      base_rate_3: 7.25
      base_rate_4_from: "2026-04-30"
      base_rate_4: 7.0
      base_rate_5_from: "2026-07-30"
      base_rate_5: 6.75
      program_full_months: 60
      program_taper_share: 0.5
      program_lapsed_share: 0.25
      autodraft_late_share: 0.25
      autodraft_returned_share: 0.5
      relationship_deep_ratio: 2.0
      relationship_deep_multiple: 1.5
      equipment_autopay_pts: 0.05
      equipment_pts: 0.025
      membership_long_months: 120
      membership_mid_months: 60
      membership_long_pts: 0.05
      membership_mid_pts: 0.025
      home_autopay_pts: 0.05
      home_pts: 0.025
    rule: >-
      When a member authorises AutoDraft on an operating line in active, suspended or matured status, the contract rate
      is set again on the enrolment day, effective that day. The contract rate set when AutoDraft is enrolled is fixed
      only after the records carry a late charge on the line's latest interest bill whenever that bill is still unpaid
      after its grace period. On
      the day AutoDraft is enrolled, the contract rate is the Association Variable Base Rate in effect that day plus
      variable_rate_spread_pct, less the discounts. The Association Variable Base Rate in effect that day is the rate of
      the latest entry of the association's base-rate history dated on or before it. The discounts are the program
      discount program_rate_discount_pct, the AutoDraft discount autodraft_rate_discount_pct, and the relationship
      discount relationship_rate_discount_pct when the member holds a Farm Real Estate loan in active status, added together and capped at rate_discount_cap_pct. The
      program, AutoDraft, relationship, equipment, membership and Country Home discounts are added together and the total
      is capped at rate_discount_cap_pct, and a discount no rule grants is zero. The rate is the base rate plus the
      spread less the capped total, rounded to 3 decimal places and never set below rate_floor_pct. Where one of the
      rules below sets a discount, it takes the place of the standard discount.
      The program discount is program_taper_share times program_rate_discount_pct when the member is certified a
      beginning farmer on an active crop insurance policy for the line's crop year and the line was first booked more
      than program_full_months whole months before the enrolment day; program_lapsed_share times
      program_rate_discount_pct when the member is not so certified and the line was first booked more than
      program_full_months whole months before; and program_rate_discount_pct when the line was first booked no more
      than program_full_months whole months before.
      The AutoDraft discount is autodraft_late_share times autodraft_rate_discount_pct when one or more late charges
      were charged on the line in the twelve whole months before the enrolment day; autodraft_returned_share times
      autodraft_rate_discount_pct when no late charge was and two or more payments on the line came back unpaid in
      those twelve months; and autodraft_rate_discount_pct when no late charge was and fewer than two payments came back
      unpaid.
      The relationship discount is relationship_rate_discount_pct times the principal balance of the member's Farm Real
      Estate loan in active status divided by the line's commitment, rounded to 3 decimal places, when that balance is
      below the commitment; relationship_deep_multiple times relationship_rate_discount_pct when that balance is at
      least relationship_deep_ratio times the commitment; relationship_rate_discount_pct when the balance is at least
      the commitment but below relationship_deep_ratio times it; and zero when the member holds no Farm Real Estate
      loan in active status.
      An equipment discount of equipment_autopay_pts points applies when the member holds an equipment loan in active
      or deferred status whose installments are collected by automatic payment, equipment_pts points when the member
      holds such a loan not collected by automatic payment, and none when the member holds no equipment loan in active
      or deferred status.
      A membership discount of membership_long_pts points applies when the member's voting stock or participation
      certificate in active status was issued membership_long_months or more whole months before the enrolment day,
      membership_mid_pts points when it was issued at least membership_mid_months but fewer than
      membership_long_months whole months before, and none when it was issued more recently or the member holds none.
      A Country Home discount of home_autopay_pts points applies when the member holds a Country Home loan in active
      status on automatic payment, home_pts points when the member holds a Country Home loan in active status not on
      automatic payment, and none when the member holds no Country Home loan in active status.
    baseline:
      rule: >-
        On the day AutoDraft is enrolled, the contract rate is the Association Variable Base Rate in effect that day plus
        variable_rate_spread_pct, less the discounts. The Association Variable Base Rate in effect that day is the rate
        of the latest entry of the association's base-rate history dated on or before it. The discounts are the program
        discount program_rate_discount_pct, the AutoDraft discount autodraft_rate_discount_pct, and the relationship
        discount relationship_rate_discount_pct when the member holds a Farm Real Estate loan in active status, added together and capped at rate_discount_cap_pct. The rate
        is the base rate plus the spread less the capped total, rounded to 3 decimal places and never set below
        rate_floor_pct.
      params: [variable_rate_spread_pct, program_rate_discount_pct, autodraft_rate_discount_pct,
               relationship_rate_discount_pct, rate_discount_cap_pct, rate_floor_pct, base_rate_1, base_rate_2,
               base_rate_3, base_rate_4, base_rate_5]
    prerequisite:
      - problem: operating_ext_late_charge_amount
        kind: value_input
        gate: autodraft_part
        form: state
        policy_source: >-
          The contract rate set when AutoDraft is enrolled is fixed only after the records carry a late charge on the
          line's latest interest bill whenever that bill is still unpaid after its grace period.
        condition: >-
          When the line's interest bill with the latest due date was not fully paid by its last grace day, a late charge
          fee charge points to that bill.
        resolved_by: assess_late_charge_706782fd
        effect: >-
          The late charge joins the count of late charges in the last twelve months, which moves the AutoDraft discount
          to autodraft_late_share of the product's AutoDraft discount.
    cross_category:
      - category: cropins
        as: branch
        reads: [status, crop_year, beginning_farmer]
        note: The program discount taper is decided from the beginning-farmer certification on the crop-year policy.
      - category: farmland
        as: branch
        reads: [status, principal_balance]
        note: The relationship discount is decided from the principal of the member's Farm Real Estate loan in active status.
      - category: equipment
        as: branch
        reads: [status, autopay_enrolled]
        note: The equipment discount is decided from the member's equipment loans and their automatic payment.
      - category: equity
        as: branch
        reads: [variant_name, status, issued_date]
        note: The membership discount is decided from the issue date of the member's voting stock or participation certificate.
      - category: homeloan
        as: branch
        reads: [status, autopay_enrolled]
        note: The Country Home discount is decided from the member's Country Home loan and its automatic payment.
    compute:
      - base_rate: "K('base_rate_5') if NOW >= K('base_rate_5_from') else (K('base_rate_4') if NOW >= K('base_rate_4_from') else (K('base_rate_3') if NOW >= K('base_rate_3_from') else (K('base_rate_2') if NOW >= K('base_rate_2_from') else K('base_rate_1'))))"
      - crop_year_beginning: "CFIELD('cropins', 'beginning_farmer', status='active', crop_year=F('crop_year'))"
      - months_line_booked: "MONTHS(F('opened_date'), NOW)"
      - program_part: "P('program_rate_discount_pct') * K('program_taper_share') if (crop_year_beginning == True and months_line_booked > K('program_full_months')) else (P('program_rate_discount_pct') * K('program_lapsed_share') if (crop_year_beginning != True and months_line_booked > K('program_full_months')) else P('program_rate_discount_pct'))"
      - returned_payments_year: "COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_interest_payment_return') + COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_principal_payment_return')"
      - late_charges_year: "COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_fee_assessed', fee_code='late_charge')"
      - autodraft_part: "P('autodraft_rate_discount_pct') * K('autodraft_late_share') if late_charges_year >= 1 else (P('autodraft_rate_discount_pct') * K('autodraft_returned_share') if (late_charges_year == 0 and returned_payments_year >= 2) else P('autodraft_rate_discount_pct'))"
      - land_loan_held: "EXISTS('farmland', status='active')"
      - land_loan_principal: "CFIELD('farmland', 'principal_balance', status='active') or 0"
      - relationship_part: "RND(P('relationship_rate_discount_pct') * land_loan_principal / F('commitment_amount'), 3) if (land_loan_held and land_loan_principal < F('commitment_amount')) else (P('relationship_rate_discount_pct') * K('relationship_deep_multiple') if (land_loan_held and land_loan_principal >= K('relationship_deep_ratio') * F('commitment_amount')) else (P('relationship_rate_discount_pct') if land_loan_held else 0))"
      - equipment_held: "EXISTS('equipment', status='active') or EXISTS('equipment', status='deferred')"
      - equipment_on_autopay: "CFIELD('equipment', 'autopay_enrolled', status='active') == True or CFIELD('equipment', 'autopay_enrolled', status='deferred') == True"
      - equipment_part: "K('equipment_autopay_pts') if (equipment_held and equipment_on_autopay) else (K('equipment_pts') if (equipment_held and not equipment_on_autopay) else 0)"
      - stock_issued: "CFIELD('equity', 'issued_date', variant_name='Class B Voting Stock', status='active') or CFIELD('equity', 'issued_date', variant_name='Class C Participation Certificate', status='active') or NOW"
      - membership_months: "MONTHS(stock_issued, NOW)"
      - membership_part: "K('membership_long_pts') if membership_months >= K('membership_long_months') else (K('membership_mid_pts') if membership_months >= K('membership_mid_months') else 0)"
      - home_loan_held: "EXISTS('homeloan', status='active')"
      - home_loan_autopay: "CFIELD('homeloan', 'autopay_enrolled', status='active')"
      - home_part: "K('home_autopay_pts') if (home_loan_held and home_loan_autopay == True) else (K('home_pts') if (home_loan_held and home_loan_autopay != True) else 0)"
      - discount_total: "MN(P('rate_discount_cap_pct'), program_part + autodraft_part + relationship_part + equipment_part + membership_part + home_part)"
      - result: "MX(P('rate_floor_pct'), RND(base_rate + P('variable_rate_spread_pct') - discount_total, 3))"
    compute_basis:
      base_rate: "The Association Variable Base Rate in effect that day is the rate of the latest entry of the association's base-rate history dated on or before it."
      crop_year_beginning: "when the member is certified a beginning farmer on an active crop insurance policy for the line's crop year"
      months_line_booked: "the line was first booked more than program_full_months whole months before the enrolment day"
      program_part: "The program discount is program_taper_share times program_rate_discount_pct when the member is certified a beginning farmer on an active crop insurance policy for the line's crop year and the line was first booked more than program_full_months whole months before the enrolment day; program_lapsed_share times program_rate_discount_pct when the member is not so certified and the line was first booked more than program_full_months whole months before; and program_rate_discount_pct when the line was first booked no more than program_full_months whole months before."
      returned_payments_year: "two or more payments on the line came back unpaid in those twelve months"
      late_charges_year: "when one or more late charges were charged on the line in the twelve whole months before the enrolment day"
      autodraft_part: "The AutoDraft discount is autodraft_late_share times autodraft_rate_discount_pct when one or more late charges were charged on the line in the twelve whole months before the enrolment day; autodraft_returned_share times autodraft_rate_discount_pct when no late charge was and two or more payments on the line came back unpaid in those twelve months; and autodraft_rate_discount_pct when no late charge was and fewer than two payments came back unpaid."
      land_loan_held: "and zero when the member holds no Farm Real Estate loan in active status."
      land_loan_principal: "times the principal balance of the member's Farm Real Estate loan in active status divided by the line's commitment"
      relationship_part: "The relationship discount is relationship_rate_discount_pct times the principal balance of the member's Farm Real Estate loan in active status divided by the line's commitment, rounded to 3 decimal places, when that balance is below the commitment; relationship_deep_multiple times relationship_rate_discount_pct when that balance is at least relationship_deep_ratio times the commitment; relationship_rate_discount_pct when the balance is at least the commitment but below relationship_deep_ratio times it; and zero when the member holds no Farm Real Estate loan in active status."
      equipment_held: "when the member holds an equipment loan in active or deferred status whose installments are collected by automatic payment"
      equipment_on_autopay: "when the member holds an equipment loan in active or deferred status whose installments are collected by automatic payment"
      equipment_part: "An equipment discount of equipment_autopay_pts points applies when the member holds an equipment loan in active or deferred status whose installments are collected by automatic payment, equipment_pts points when the member holds such a loan not collected by automatic payment, and none when the member holds no equipment loan in active or deferred status."
      stock_issued: "when the member's voting stock or participation certificate in active status was issued membership_long_months or more whole months before the enrolment day"
      membership_months: "when the member's voting stock or participation certificate in active status was issued membership_long_months or more whole months before the enrolment day"
      membership_part: "A membership discount of membership_long_pts points applies when the member's voting stock or participation certificate in active status was issued membership_long_months or more whole months before the enrolment day, membership_mid_pts points when it was issued at least membership_mid_months but fewer than membership_long_months whole months before, and none when it was issued more recently or the member holds none."
      home_loan_held: "and none when the member holds no Country Home loan in active status."
      home_loan_autopay: "when the member holds a Country Home loan in active status on automatic payment"
      home_part: "A Country Home discount of home_autopay_pts points applies when the member holds a Country Home loan in active status on automatic payment, home_pts points when the member holds a Country Home loan in active status not on automatic payment, and none when the member holds no Country Home loan in active status."
      discount_total: "The program, AutoDraft, relationship, equipment, membership and Country Home discounts are added together and the total is capped at rate_discount_cap_pct, and a discount no rule grants is zero."
      result: "The rate is the base rate plus the spread less the capped total, rounded to 3 decimal places and never set below rate_floor_pct."
    factors:
      - id: beginning_farmer_program_taper
        effect: parameter
        decides: program_part
        bindings: [crop_year_beginning, months_line_booked, program_part]
        ladder:
          - when: "certified a beginning farmer on the crop-year policy and the line first booked more than program_full_months whole months ago"
            value: "P('program_rate_discount_pct') * K('program_taper_share')"
          - when: "not so certified and the line first booked more than program_full_months whole months ago"
            value: "P('program_rate_discount_pct') * K('program_lapsed_share')"
          - when: "otherwise: the line first booked no more than program_full_months whole months ago"
            value: "P('program_rate_discount_pct')"
        baseline:
          program_part: "P('program_rate_discount_pct')"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: autodraft_payment_record
        effect: parameter
        decides: autodraft_part
        bindings: [returned_payments_year, late_charges_year, autodraft_part]
        ladder:
          - when: "one or more late charges on the line in the last twelve whole months"
            value: "P('autodraft_rate_discount_pct') * K('autodraft_late_share')"
          - when: "no late charge and two or more payments returned unpaid in the last twelve whole months"
            value: "P('autodraft_rate_discount_pct') * K('autodraft_returned_share')"
          - when: "otherwise: no late charge and fewer than two returned payments"
            value: "P('autodraft_rate_discount_pct')"
        baseline:
          autodraft_part: "P('autodraft_rate_discount_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: land_relationship_scaling
        effect: method
        decides: relationship_part
        bindings: [land_loan_held, land_loan_principal, relationship_part]
        ladder:
          - when: "a Farm Real Estate loan in active status whose principal balance is below the line's commitment"
            method: "the relationship discount is scaled by the loan's principal balance over the line's commitment, rounded to 3 decimal places"
          - when: "a Farm Real Estate loan in active status whose principal balance is at least relationship_deep_ratio times the commitment"
            method: "the relationship discount is multiplied by relationship_deep_multiple"
          - when: "otherwise: a balance between the commitment and relationship_deep_ratio times it, or no such loan"
            method: "the relationship discount is taken flat when such a loan is held, and is zero when none is"
        baseline:
          relationship_part: "P('relationship_rate_discount_pct') if land_loan_held else 0"
        evidence: [cross_category]
        cross_difficulty: farmland
      - id: equipment_relationship_points
        effect: parameter
        decides: equipment_part
        bindings: [equipment_held, equipment_on_autopay, equipment_part]
        ladder:
          - when: "an equipment loan in active or deferred status collected by automatic payment"
            value: "K('equipment_autopay_pts')"
          - when: "an equipment loan in active or deferred status not collected by automatic payment"
            value: "K('equipment_pts')"
          - when: "otherwise: no equipment loan in active or deferred status"
            value: "0"
        baseline:
          equipment_part: "0"
        evidence: [cross_category]
        cross_difficulty: equipment
      - id: membership_tenure_points
        effect: parameter
        decides: membership_part
        bindings: [stock_issued, membership_months, membership_part]
        ladder:
          - when: "voting stock or participation certificate issued membership_long_months or more whole months ago"
            value: "K('membership_long_pts')"
          - when: "issued at least membership_mid_months but fewer than membership_long_months whole months ago"
            value: "K('membership_mid_pts')"
          - when: "otherwise: issued more recently, or none held"
            value: "0"
        baseline:
          membership_part: "0"
        evidence: [cross_category, date]
        cross_difficulty: equity
      - id: country_home_relationship_points
        effect: parameter
        decides: home_part
        bindings: [home_loan_held, home_loan_autopay, home_part]
        ladder:
          - when: "a Country Home loan in active status on automatic payment"
            value: "K('home_autopay_pts')"
          - when: "a Country Home loan in active status not on automatic payment"
            value: "K('home_pts')"
          - when: "otherwise: no Country Home loan in active status"
            value: "0"
        baseline:
          home_part: "0"
        evidence: [cross_category]
        cross_difficulty: homeloan
    inputs:
      history:
        - {table: operating_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: operating_fee_assessed, fee_code: late_charge}}
        - {table: operating_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: operating_interest_payment_return}}
      cross_category: [cropins, farmland, equipment, equity, homeloan]

  - id: operating_ext_most_available_advance
    base_policy_refs: [operating_advance_eligibility, operating_overadvance]
    overwrite:
      - base_policy: operating_advance_eligibility
        superseded_clause: >-
          The available credit of a revolving product is the commitment (or, when borrowing_base_required is true, the
          lower of the commitment and the borrowing_base_amount of the most recent certificate) minus outstanding
          principal; the available credit of a non-revolving product is the commitment minus all advances booked in the
          current term (operating_msr_term_advances), whatever has been repaid.
        replaced_by: >-
          The available credit is the lending limit less the outstanding principal worked out from the line's
          transaction history (advances plus returned principal payments less principal payments) on a revolving
          product, and the commitment less every advance booked on the line on a product that is not revolving.
      - base_policy: operating_advance_eligibility
        superseded_clause: >-
          For a product that requires a borrowing base, an advance may be booked only when its effective date is no later
          than bbc_staleness_days calendar days after the as-of date of the line's most recent borrowing base certificate.
        replaced_by: >-
          On a product that requires a borrowing base an advance is booked only when its effective date is no later than
          bbc_staleness_days calendar days after the as-of date of the line's most recent certificate, that as-of date
          being day 0; on a product that requires none, no certificate enters the advance.
    trigger: on_request
    subject: [operating_draw]
    computes: amount
    target_tool: book_operating_advance_f71c3718
    params:
      uninsured_share: 0.8
      thin_cover_share: 0.95
      full_cover_pct: 80
      early_season_months: 2
      mid_season_months: 4
      early_season_share: 0.85
      mid_season_share: 0.95
      within_grace_share: 0.5
      interest_reserve_long_days: 90
      interest_reserve_short_days: 30
      hold_repeat_share: 0.5
      hold_single_share: 0.75
      deferral_repeat_share: 0.5
      deferral_single_share: 0.8
    rule: >-
      When a member asks for as much as the line will advance, the advance is the line's available credit on the day of
      the request, booked by phone with the proceeds deposited to the member's checking account. On a line whose
      AutoDraft was cancelled after returned payments, the amount of an advance is not fixed until the line's records
      show AutoDraft enrolled again. On a product that requires a borrowing base an advance is booked only when its
      effective date is no later than bbc_staleness_days calendar days after the as-of date of the line's most recent
      certificate, that as-of date being day 0; on a product that requires none, no certificate enters the advance.
      The lending limit is the commitment, or the lower of the commitment and the borrowing base on the line's most
      recent certificate when the product requires a borrowing base. The available credit is the lending limit less
      the outstanding principal worked out from the line's transaction history (advances plus returned principal
      payments less principal payments) on a revolving product, and the commitment less every advance booked on the
      line on a product that is not revolving. The advance is that available credit, never less than zero and never
      more than what is left of phone_draw_daily_limit_usd after the phone advances already booked that day, rounded to
      cents. Where one of the rules below sets a share or a reserve, it enters the advance as set out here.
      On a product with crop_insurance_required true, the lending limit is taken at uninsured_share of itself when the
      line has no active crop insurance policy for its crop year with the indemnity assigned to this line or that
      policy's coverage level is below crop_insurance_min_coverage_pct, at thin_cover_share of itself when it has such
      a policy at a coverage level of at least crop_insurance_min_coverage_pct but below full_cover_pct percent, and at
      the whole of itself in every other case.
      On a product with program_rate_discount_pct above zero, the lending limit is further taken at early_season_share
      of itself when the request falls fewer than early_season_months whole months after the start of the current term,
      at mid_season_share of itself when it falls at least early_season_months but fewer than mid_season_months whole
      months after it, and at the whole of itself in every other case; the start of the current term is the last
      renewal date, or the booking date for a line never renewed.
      A past-due reserve is taken off: all the billed interest not yet paid when the latest bill's due date is more than
      late_charge_grace_days calendar days past, within_grace_share of it when that due date has passed by no more than
      late_charge_grace_days calendar days, and nothing when no billed interest is unpaid or the latest bill is not yet
      due.
      An interest reserve is taken off: the outstanding principal times the line's contract rate in force, read as a
      percentage, times interest_reserve_long_days over 365 when two or more payments on the line came back unpaid in
      the twelve whole months before today, times interest_reserve_short_days over 365 when exactly one did, and nothing
      when none did; the reserve is rounded to cents.
      The figure left is taken at hold_repeat_share of itself when a payment on the line came back unpaid within one whole month
      before today and two or more did in the twelve whole months before today, at hold_single_share of
      itself when one came back within one whole month before today and fewer than two did in the twelve months, and at the whole
      of itself when none came back within one whole month before today.
      The figure is further taken at deferral_repeat_share of itself when the member holds an equipment loan in
      deferred status that has used two or more deferrals, at deferral_single_share of itself when the member holds an
      equipment loan in deferred status that has used fewer than two, and at the whole of itself when the member holds
      no equipment loan in deferred status.
      The order is fixed: the lending limit is multiplied by the insured share and then by the season share; the
      outstanding principal, the past-due reserve and the interest reserve are taken off that; the result is multiplied
      by the hold share and then by the deferral share; the advance is that figure, never less than zero and never more
      than what is left of the day's phone limit, rounded once to cents.
    baseline:
      rule: >-
        The lending limit is the commitment, or the lower of the commitment and the borrowing base on the line's most
        recent certificate when the product requires a borrowing base. The available credit is the lending limit less
        the outstanding principal worked out from the line's transaction history (advances plus returned principal
        payments less principal payments) on a revolving product, and the commitment less every advance booked on the
        line on a product that is not revolving. The advance is that available credit, never less than zero and never
        more than what is left of phone_draw_daily_limit_usd after the phone advances already booked that day, rounded
        to cents.
      params: [phone_draw_daily_limit_usd]
    prerequisite:
      - problem: operating_ext_autodraft_enrolment_rate
        kind: value_input
        gate: interest_reserve
        form: state
        policy_source: >-
          On a line whose AutoDraft was cancelled after returned payments, the amount of an advance is not fixed until
          the line's records show AutoDraft enrolled again.
        condition: >-
          The line shows AutoDraft enrolled, with the debited account's last four digits and the contract rate set on
          the enrolment day.
        resolved_by: enroll_autodraft_36bd3fb2
        effect: >-
          The enrolment puts the enrolment-day contract rate in force on the line, and the interest reserve taken off
          the available credit is figured at that rate.
    cross_category:
      - category: cropins
        as: branch
        reads: [status, crop_year, assigned_loan_id, indemnity_assigned, variant_name]
        note: The insured share of the lending limit is decided from the crop-year policy assigned to the line and its coverage level.
      - category: equipment
        as: branch
        reads: [status, deferrals_used]
        note: The deferral share is decided from the member's equipment loans in deferred status and their deferral count.
    compute:
      - principal_on_line: "SUM('operating_transactions', 'amount', event_type='operating_draw') + SUM('operating_transactions', 'amount', event_type='operating_principal_payment_return') - SUM('operating_transactions', 'amount', event_type='operating_principal_payment')"
      - certificate_base: "LATEST('operating_borrowing_base', 'borrowing_base_amount', date_field='as_of_date')"
      - lending_limit: "MN(F('commitment_amount'), certificate_base) if (P('borrowing_base_required') and certificate_base) else F('commitment_amount')"
      - assigned_cover_held: "EXISTS('cropins', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True)"
      - assigned_cover_pct: "CPARAM('cropins', 'coverage_level_pct', status='active', crop_year=F('crop_year'), assigned_loan_id=HID, indemnity_assigned=True) or 0"
      - insured_share: "K('uninsured_share') if (P('crop_insurance_required') and ((not assigned_cover_held) or assigned_cover_pct < P('crop_insurance_min_coverage_pct'))) else (K('thin_cover_share') if (P('crop_insurance_required') and assigned_cover_held and assigned_cover_pct < K('full_cover_pct')) else 1)"
      - term_begin: "F('last_renewed_date') if F('last_renewed_date') else F('opened_date')"
      - months_into_current_term: "MONTHS(term_begin, NOW)"
      - season_share: "K('early_season_share') if (P('program_rate_discount_pct') > 0 and months_into_current_term < K('early_season_months')) else (K('mid_season_share') if (P('program_rate_discount_pct') > 0 and months_into_current_term < K('mid_season_months')) else 1)"
      - billed_unpaid: "RND(SUM('operating_transactions', 'amount', event_type='operating_interest_accrual') + SUM('operating_transactions', 'amount', event_type='operating_interest_payment_return') - SUM('operating_transactions', 'amount', event_type='operating_interest_payment'), 2)"
      - latest_bill_due: "LATEST('operating_transactions', 'due_date', date_field='due_date', event_type='operating_interest_accrual')"
      - days_past_due: "DAYS(latest_bill_due, NOW) if latest_bill_due else 0"
      - past_due_reserve: "billed_unpaid if (billed_unpaid > 0 and days_past_due > P('late_charge_grace_days')) else (billed_unpaid * K('within_grace_share') if (billed_unpaid > 0 and days_past_due > 0) else 0)"
      - contract_rate: "F('interest_rate')"
      - returns_for_reserve: "COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_interest_payment_return') + COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_principal_payment_return')"
      - reserve_days: "K('interest_reserve_long_days') if returns_for_reserve >= 2 else (K('interest_reserve_short_days') if returns_for_reserve == 1 else 0)"
      - interest_reserve: "RND(principal_on_line * contract_rate / 100 * reserve_days / 365, 2)"
      - returns_this_month: "COUNT('operating_transactions', within_months=1, date_field='effective_date', event_type='operating_interest_payment_return') + COUNT('operating_transactions', within_months=1, date_field='effective_date', event_type='operating_principal_payment_return')"
      - returns_this_year: "COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_interest_payment_return') + COUNT('operating_transactions', within_months=12, date_field='effective_date', event_type='operating_principal_payment_return')"
      - hold_share: "K('hold_repeat_share') if (returns_this_month >= 1 and returns_this_year >= 2) else (K('hold_single_share') if (returns_this_month >= 1 and returns_this_year < 2) else 1)"
      - deferred_equipment: "EXISTS('equipment', status='deferred')"
      - deferrals_on_equipment: "CFIELD('equipment', 'deferrals_used', status='deferred') or 0"
      - deferral_share: "K('deferral_repeat_share') if (deferred_equipment and deferrals_on_equipment >= 2) else (K('deferral_single_share') if (deferred_equipment and deferrals_on_equipment < 2) else 1)"
      - all_advances: "SUM('operating_transactions', 'amount', event_type='operating_draw')"
      - headroom: "(lending_limit * insured_share * season_share - principal_on_line - past_due_reserve - interest_reserve) if P('revolving') else (F('commitment_amount') * insured_share * season_share - all_advances - past_due_reserve - interest_reserve)"
      - phone_advances_today: "SUM('operating_transactions', 'amount', event_type='operating_draw', channel='phone', effective_date=NOW)"
      - phone_room: "P('phone_draw_daily_limit_usd') - phone_advances_today"
      - result: "RND(MX(0, MN(headroom * hold_share * deferral_share, phone_room)), 2)"
    compute_basis:
      principal_on_line: "The available credit is the lending limit less the outstanding principal worked out from the line's transaction history (advances plus returned principal payments less principal payments) on a revolving product, and the commitment less every advance booked on the line on a product that is not revolving."
      certificate_base: "The lending limit is the commitment, or the lower of the commitment and the borrowing base on the line's most recent certificate when the product requires a borrowing base."
      lending_limit: "The lending limit is the commitment, or the lower of the commitment and the borrowing base on the line's most recent certificate when the product requires a borrowing base."
      assigned_cover_held: "when the line has no active crop insurance policy for its crop year with the indemnity assigned to this line"
      assigned_cover_pct: "or that policy's coverage level is below crop_insurance_min_coverage_pct"
      insured_share: "On a product with crop_insurance_required true, the lending limit is taken at uninsured_share of itself when the line has no active crop insurance policy for its crop year with the indemnity assigned to this line or that policy's coverage level is below crop_insurance_min_coverage_pct, at thin_cover_share of itself when it has such a policy at a coverage level of at least crop_insurance_min_coverage_pct but below full_cover_pct percent, and at the whole of itself in every other case."
      term_begin: "the start of the current term is the last renewal date, or the booking date for a line never renewed."
      months_into_current_term: "when the request falls fewer than early_season_months whole months after the start of the current term"
      season_share: "On a product with program_rate_discount_pct above zero, the lending limit is further taken at early_season_share of itself when the request falls fewer than early_season_months whole months after the start of the current term, at mid_season_share of itself when it falls at least early_season_months but fewer than mid_season_months whole months after it, and at the whole of itself in every other case"
      billed_unpaid: "A past-due reserve is taken off: all the billed interest not yet paid when the latest bill's due date is more than late_charge_grace_days calendar days past"
      latest_bill_due: "when the latest bill's due date is more than late_charge_grace_days calendar days past"
      days_past_due: "when that due date has passed by no more than late_charge_grace_days calendar days"
      past_due_reserve: "A past-due reserve is taken off: all the billed interest not yet paid when the latest bill's due date is more than late_charge_grace_days calendar days past, within_grace_share of it when that due date has passed by no more than late_charge_grace_days calendar days, and nothing when no billed interest is unpaid or the latest bill is not yet due."
      contract_rate: "the outstanding principal times the line's contract rate in force, read as a percentage"
      returns_for_reserve: "when two or more payments on the line came back unpaid in the twelve whole months before today"
      reserve_days: "An interest reserve is taken off: the outstanding principal times the line's contract rate in force, read as a percentage, times interest_reserve_long_days over 365 when two or more payments on the line came back unpaid in the twelve whole months before today, times interest_reserve_short_days over 365 when exactly one did, and nothing when none did; the reserve is rounded to cents."
      interest_reserve: "An interest reserve is taken off: the outstanding principal times the line's contract rate in force, read as a percentage, times interest_reserve_long_days over 365 when two or more payments on the line came back unpaid in the twelve whole months before today, times interest_reserve_short_days over 365 when exactly one did, and nothing when none did; the reserve is rounded to cents."
      returns_this_month: "when a payment on the line came back unpaid within one whole month before today"
      returns_this_year: "and two or more did in the twelve whole months before today"
      hold_share: "The figure left is taken at hold_repeat_share of itself when a payment on the line came back unpaid within one whole month before today and two or more did in the twelve whole months before today, at hold_single_share of itself when one came back within one whole month before today and fewer than two did in the twelve months, and at the whole of itself when none came back within one whole month before today."
      deferred_equipment: "when the member holds an equipment loan in deferred status that has used two or more deferrals"
      deferrals_on_equipment: "when the member holds an equipment loan in deferred status that has used two or more deferrals"
      deferral_share: "The figure is further taken at deferral_repeat_share of itself when the member holds an equipment loan in deferred status that has used two or more deferrals, at deferral_single_share of itself when the member holds an equipment loan in deferred status that has used fewer than two, and at the whole of itself when the member holds no equipment loan in deferred status."
      all_advances: "and the commitment less every advance booked on the line on a product that is not revolving."
      headroom: "The order is fixed: the lending limit is multiplied by the insured share and then by the season share; the outstanding principal, the past-due reserve and the interest reserve are taken off that; the result is multiplied by the hold share and then by the deferral share; the advance is that figure, never less than zero and never more than what is left of the day's phone limit, rounded once to cents."
      phone_advances_today: "never more than what is left of phone_draw_daily_limit_usd after the phone advances already booked that day"
      phone_room: "never more than what is left of phone_draw_daily_limit_usd after the phone advances already booked that day"
      result: "The order is fixed: the lending limit is multiplied by the insured share and then by the season share; the outstanding principal, the past-due reserve and the interest reserve are taken off that; the result is multiplied by the hold share and then by the deferral share; the advance is that figure, never less than zero and never more than what is left of the day's phone limit, rounded once to cents."
    factors:
      - id: crop_cover_limit_share
        effect: parameter
        decides: insured_share
        bindings: [assigned_cover_held, assigned_cover_pct, insured_share]
        ladder:
          - when: "insurance required, and no active assigned crop-year policy or its coverage below crop_insurance_min_coverage_pct"
            value: "K('uninsured_share')"
          - when: "insurance required, an active assigned crop-year policy at coverage of at least crop_insurance_min_coverage_pct but below full_cover_pct percent"
            value: "K('thin_cover_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          insured_share: "1"
        evidence: [cross_category, tier_param]
        cross_difficulty: null
      - id: program_season_share
        effect: parameter
        decides: season_share
        bindings: [term_begin, months_into_current_term, season_share]
        ladder:
          - when: "a program product and fewer than early_season_months whole months into the current term"
            value: "K('early_season_share')"
          - when: "a program product and at least early_season_months but fewer than mid_season_months whole months into the term"
            value: "K('mid_season_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          season_share: "1"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: past_due_interest_reserve
        effect: parameter
        decides: past_due_reserve
        bindings: [billed_unpaid, latest_bill_due, days_past_due, past_due_reserve]
        ladder:
          - when: "billed interest unpaid and the latest bill's due date more than late_charge_grace_days days past"
            value: "all the unpaid billed interest"
          - when: "billed interest unpaid and the latest due date past by no more than late_charge_grace_days days"
            value: "within_grace_share of the unpaid billed interest"
          - when: "otherwise: nothing unpaid or the latest bill not yet due"
            value: "0"
        baseline:
          past_due_reserve: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: returned_payment_interest_reserve
        effect: parameter
        decides: interest_reserve
        bindings: [contract_rate, returns_for_reserve, reserve_days, interest_reserve]
        ladder:
          - when: "two or more payments returned unpaid in the last twelve whole months"
            value: "interest_reserve_long_days of interest at the contract rate"
          - when: "exactly one payment returned unpaid in the last twelve whole months"
            value: "interest_reserve_short_days of interest at the contract rate"
          - when: "otherwise: none returned"
            value: "0"
        baseline:
          interest_reserve: "0"
        evidence: [history]
        cross_difficulty: null
      - id: returned_payment_hold
        effect: method
        decides: hold_share
        bindings: [returns_this_month, returns_this_year, hold_share]
        ladder:
          - when: "a payment returned within one whole month before today and two or more in the last twelve whole months"
            method: "the figure left is multiplied by hold_repeat_share"
          - when: "a payment returned within one whole month before today and fewer than two in the twelve months"
            method: "the figure left is multiplied by hold_single_share"
          - when: "otherwise: none returned within one whole month before today"
            method: "the figure left is used whole"
        baseline:
          hold_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: equipment_deferral_share
        effect: parameter
        decides: deferral_share
        bindings: [deferred_equipment, deferrals_on_equipment, deferral_share]
        ladder:
          - when: "an equipment loan in deferred status that has used two or more deferrals"
            value: "K('deferral_repeat_share')"
          - when: "an equipment loan in deferred status that has used fewer than two deferrals"
            value: "K('deferral_single_share')"
          - when: "otherwise: no equipment loan in deferred status"
            value: "1"
        baseline:
          deferral_share: "1"
        evidence: [cross_category]
        cross_difficulty: equipment
    inputs:
      history:
        - {table: operating_transactions, aggregate: sum, field: amount, filters: {event_type: operating_draw}}
        - {table: operating_transactions, aggregate: sum, field: amount, filters: {event_type: operating_interest_accrual}}
        - {table: operating_transactions, aggregate: count, field: txn_id, within_months: 12, filters: {event_type: operating_interest_payment_return}}
      cross_category: [cropins, equipment]
