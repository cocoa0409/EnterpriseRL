name: env_0054_ecommerce_marketplace_operator
company: Northloop Marketplace, Inc.

background: |
  Northloop Marketplace, Inc. runs a third-party online marketplace in the United States where independent businesses sell new, renewed and used goods to consumers, from phone cases and apparel to refrigerators and sofas.
  The company is headquartered in Columbus, Ohio, serves roughly 38 million active buyers and about 410,000 active sellers, and operates sixteen fulfillment centers and four returns centers across the country.
  Its support desk answers buyers and sellers in a plain, courteous, precise voice, and every contact is about a record the customer can see in their own account.
  Buyers shop through Marketplace Orders, and every order carries the delivery option chosen at checkout: Seller Fulfilled Standard Shipping, Seller Fulfilled Expedited Shipping, Fulfilled by Northloop Standard, Fulfilled by Northloop Two-Day, Fulfilled by Northloop Same-Day, or Large Item Freight Delivery.
  An order is booked from placement through capture, shipment and delivery, and afterwards through any return requests, return scans, refunds, replacements and Northloop Guarantee claims.
  Buyers may hold one Loop+ Membership on one of six plans: Loop+ Access Monthly, Loop+ Student Monthly, Loop+ Student Annual, Loop+ Monthly, Loop+ Annual and Loop+ Household Annual, with fees, declines, refunds, benefit uses and promotional credits booked against it.
  Buyers can also add Northloop Protect Plans to eligible items they bought: Protect 1-Year, 2-Year and 3-Year Extended Warranty, and Protect 2-Year, 3-Year and 4-Year Accident Protection, each with its own charges, claims, settlements and cancellations.
  Sellers hold one of six Selling Plans, the Individual Seller Plan or the Starter, Basic, Premium, Anchor or Enterprise Store, which bill subscription, insertion and final value fees and give fee credits.
  Many sellers also enroll in Fulfilled by Northloop (FBN), placed by volume in the FBN Starter, Core, Growth, Scale, Premier or Enterprise Program, where inbound receipts, shipments, monthly storage, aged inventory surcharges, removals, warehouse adjustments and reimbursements are booked per SKU.
  Every seller is paid through a Northloop Payments account on one of six payout plans, Payments Starter, Biweekly, Weekly, Daily, Daily Plus and Enterprise, whose ledger books sale proceeds, reserves, payouts, fee deductions, refund debits, chargebacks and reimbursements.
  Each seller also has a Seller Performance Standing record, evaluated monthly into Below Standard Level, Developing Seller Level, Standard Level, Above Standard Level, Top Rated Level or Preferred Partner Level, which books order defects, policy violation points, feedback and review removals, suspensions, appeals and reinstatements.
  A typical buyer who calls holds a Loop+ plan, has a handful of open and recent orders from several sellers, and may carry a Protect plan on an electronics purchase.
  A typical seller who calls holds a store plan, an FBN enrollment, a payments account and a standing record at once, with months of fees, sales, reserves, storage charges and defects behind them.
  Callers arrive with history: earlier returns and refunds, partial credits, past claims and appeals, a bank account changed last week, or a level that moved at the last evaluation.
  Some customers are both buyers and sellers on the same profile, and a seller's buyer refunds, fees and reimbursements all meet in that seller's payments ledger.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: order_returns_refunds_guarantee
    claim:
      categories: [order]
      event_types: [order_charge, order_cancel, order_mark_undeliverable, order_return_request, order_return_receipt, order_refund, order_replacement, order_claim_file, order_guarantee_decision]
    summary: >
      Buyers call about orders that did not go as expected: an item they want to cancel before it ships, return after
      delivery, report damaged, defective, wrong or missing, a package the carrier lost or sent back, a refund that has
      not arrived or arrived short, a late guaranteed delivery, or a Northloop Guarantee claim they want to file or
      appeal; the setting varies with the delivery option on the order, the order status and dates, the item's
      category and condition, whether it was a gift, how many units were already returned, and the buyer's return
      history and Loop+ membership. The records involved are the order, its captures, return requests and scans,
      refunds by component with their deductions, replacements and guarantee claims; the governing rules are the
      return window with its renewed and holiday variants and non-returnable categories (order_return_window), the
      deductions for remorse returns by received condition and late scans (order_return_deductions), the refund
      components, tax share, gift destination and funding party (order_refund_amount), when a refund is released
      under each option and the buyer's return history (order_refund_timing, order_agg_return_history), replacement
      eligibility and its exclusivity with refunds (order_replacement_terms), lost and undeliverable shipments
      (order_lost_and_undeliverable), late-delivery shipping refunds (order_late_delivery), cancellation
      (order_cancellation) and guarantee claim windows, prerequisites, caps and appeals (order_guarantee_claim), all
      varying per delivery option. In the natural order of the domain an order is placed, captured, shipped and
      delivered before a return is requested, a return is scanned before its item refund is released, and a claim is
      filed before it is decided. The agent books refunds, replacements, undeliverable reports and claim decisions
      on a verified account, while cancelling an order, opening a return and filing a guarantee claim are the buyer's
      own requests and are handed to the buyer to confirm. Requests no rule decides, such as compensation for
      consequential losses, a price-drop refund after delivery, refunds on orders placed on another retailer, or
      reversing a refund already sent to a gift card into cash, are not covered and go to a human with
      POLICY_NOT_COVERED.

  - name: seller_fees_and_selling_plans
    claim:
      categories: [selling]
      event_types: [selling_subscription_fee, selling_insertion_fee, selling_final_value_fee, selling_fee_credit, selling_early_termination_fee, selling_plan_change, selling_schedule_cancel, selling_withdraw_cancel, selling_close, selling_lift_restriction]
    summary: >
      Sellers call about what their selling plan costs them: a final value fee they think is wrong, a fee credit
      missing or smaller than expected after refunding a buyer, insertion fees charged although they believed they
      were within the allowance, a store upgrade or downgrade, an annual term they want to leave early, a scheduled
      cancellation to withdraw, or a plan restricted for unpaid fees; the setting varies with the plan and billing
      term, the term and billing dates, the item categories and fee bases of their orders, their performance standing
      level on each order date, and the state of their payments balance. The records involved are the selling plan,
      its fee and credit records, fee disputes, and the orders, refunds, standing levels and payments balance those
      fees depend on; the governing rules are subscription billing per plan and term (selling_subscription_billing),
      the monthly insertion allowance (selling_insertion_fees), final value fees by fee group, threshold and per-order
      fee with the standing discount and surcharge (selling_final_value_fees), refund credits with the administration
      fee and its cap (selling_refund_fee_credit), fee disputes and their window (selling_fee_disputes), upgrades,
      downgrades and the annual-term lock (selling_plan_change_rules), cancellation and the early termination fee
      (selling_cancellation) and restriction for past-due fees (selling_fee_collection), most of them varying by plan.
      In the natural order of the domain a fee is billed before it can be credited or disputed, a refund precedes its
      fee credit, and a past-due balance is cleared before a restriction is lifted. The agent books fee credits,
      upheld disputes, plan changes and the lifting of a restriction on a verified account, while scheduling,
      withdrawing or forcing a cancellation and accepting an early termination fee are the seller's own decisions and
      are handed to the seller to confirm. Requests no rule decides, such as waiving fees for a seller's personal
      hardship, refunding subscription months already used, crediting advertising spend, or negotiating a custom fee
      rate, are not covered and go to a human with POLICY_NOT_COVERED.

  - name: fbn_storage_inventory_reimbursements
    claim:
      categories: [fulfill]
      event_types: [fulfill_storage_fee, fulfill_aged_surcharge, fulfill_capacity_overage_fee, fulfill_removal_shipment, fulfill_removal_fee, fulfill_reimbursement, fulfill_inventory_found, fulfill_fee_credit, fulfill_restore_inbound, fulfill_request_exit, fulfill_cancel_exit]
    summary: >
      Sellers using Fulfilled by Northloop call about their inventory and what it costs to hold it: a storage or aged
      inventory charge they question, a capacity overage fee or an inbound suspension, units lost or damaged in a
      fulfillment center, an inbound shipment received short, a customer return that never came back, removals and
      disposals, or leaving FBN altogether; the setting varies with the FBN program the enrollment sits in, the
      storage month and season, each SKU's size tier, volume, age and units on hand, the enrollment status, and
      earlier adjustments, reimbursements and fee credits. The records involved are the enrollment, its per-SKU
      receipts, shipments, storage and surcharge charges, removal orders and fees, adjustments, found units,
      reimbursements, seller cases and fee credits, together with the seller's selling plan and payments balance; the
      governing rules are storage fees by class and season (fulfill_storage_fees), aged surcharges by band with the
      per-unit minimum and exemption (fulfill_aged_surcharge_terms), capacity overage and inbound suspension
      (fulfill_capacity_terms), removal and disposal fees (fulfill_removal_terms), reimbursement windows, valuation,
      caps and reversal on found units (fulfill_reimbursement_terms), fee disputes (fulfill_fee_disputes), program
      reviews (fulfill_enrollment_and_review) and exit (fulfill_exit_terms), most of them varying by program. In the
      natural order of the domain units are received before they are stored, shipped or removed, an adjustment
      precedes its reimbursement, and a fee is billed before it is disputed. The agent books reimbursements, fee
      credits and the lifting of a cleared inbound suspension on a verified account, while placing or cancelling a
      removal order and requesting or withdrawing an exit are the seller's own decisions about their inventory and
      are handed to the seller to confirm. Requests no rule decides, such as compensation for lost sales while units
      were missing, storage waivers for slow seasons, valuing units at retail price, or reimbursing damage that
      happened in the seller's own carrier's hands, are not covered and go to a human with POLICY_NOT_COVERED.

  - name: seller_payouts_reserves_chargebacks
    claim:
      categories: [payout]
      event_types: [payout_reserve_release, payout_disbursement, payout_instant_fee, payout_chargeback_reversal, payout_negative_balance_charge, payout_hold_release, payout_bank_change, payout_plan_change, payout_request_close]
    summary: >
      Sellers call about money they expected to receive: a payout that did not arrive or was smaller than the balance
      shown, funds still reserved after delivery, an instant payout and its fee, a payout returned by the bank, a
      chargeback debited from their balance and their dispute of it, a negative balance charged to their card, a hold
      on their account, or a wish to change payout plan, bank account or close the account; the setting varies with
      the payout plan, the account status and hold reason, the delivered and promised dates of the orders behind
      each reserve, the size of each sale, the bank change date, the seller's standing level and the trailing sales.
      The records involved are the payments account, its ledger of sale credits, reserves, payouts, fees, refund
      debits, chargebacks and reimbursements, the chargeback disputes, and the orders, standing record and fee
      records they relate to; the governing rules are sale credits and delivery, high-value and rolling reserves
      (payout_sale_and_reserve), the payout schedule, minimum, maximum and bank change hold
      (payout_disbursement_schedule), instant payout fees and limits (payout_instant_terms), deductions and debits
      (payout_debits), chargebacks, fees and dispute outcomes (payout_chargebacks), negative balance collection
      (payout_negative_balance), holds and their release (payout_holds), plan and bank changes (payout_plan_and_bank)
      and closure (payout_closure), most of them varying by payout plan. In the natural order of the domain a sale is
      credited and reserved before its reserve is released, a payable amount exists before it is paid out, and a
      chargeback is debited before it is disputed and reversed. The agent releases due reserves, sends payouts, books
      won chargeback reversals and lifts cleared holds on a verified account, while changing the bank account,
      requesting an instant payout, submitting chargeback evidence and closing the account are the seller's own acts
      and are handed to the seller to confirm. Requests no rule decides, such as paying out reserved funds early as a
      favour, sending funds to a third party's account, waiving a chargeback the seller is liable for, or paying
      interest on held funds, are not covered and go to a human with POLICY_NOT_COVERED.

  - name: seller_standing_reviews_account_actions
    claim:
      categories: [standing]
      event_types: [standing_evaluate, standing_defect_removal, standing_violation_reversal, standing_points_expiry, standing_feedback_removal, standing_submit_appeal, standing_reinstate, standing_reject_appeal, standing_close]
    summary: >
      Sellers call about the health of their selling account: a performance level that dropped at the last
      evaluation, negative feedback or a product review they want removed, an order defect they believe should not
      count, violation points that should have expired or been reversed, a warning, a suspension they want to appeal,
      an appeal decision, or closing their selling account; the setting varies with the current level and status,
      the order volume and defect, late shipment, cancellation and tracking rates in each window, the violation types
      and dates on record, how many disputes were already filed this month, how many appeals were already made, and
      whether the order was fulfilled by Northloop or the claim was funded by Northloop. The records involved are the
      standing record, its defects, violations, removals and expiries, the review disputes and appeals, and the
      orders, guarantee decisions and chargebacks behind each defect; the governing rules are the monthly evaluation
      gates per level (standing_monthly_evaluation), what counts as a defect and when it is removed
      (standing_defect_rules), violation points, expiry and reversal (standing_violation_rules), warnings, suspension,
      probation and deactivation (standing_account_actions), the appeal window, limit and accepted bases
      (standing_appeal_rules), feedback and review disputes with their window, monthly allowance and removable
      reasons (standing_feedback_disputes) and voluntary closure (standing_closure), several of them varying by level.
      In the natural order of the domain a defect or violation is recorded before it can be removed or reversed, a
      suspension precedes an appeal, and an appeal is decided before reinstatement. The agent records removals,
      reversals, expiries, evaluations and appeal decisions on a verified account, while submitting an appeal and
      closing the selling account are the seller's own acts and are handed to the seller to confirm. Requests no rule
      decides, such as removing an unfavourable but policy-compliant review, revealing a buyer's identity, restoring
      a deactivated account outside the appeal process, or compensating sales lost during a suspension, are not
      covered and go to a human with POLICY_NOT_COVERED.
