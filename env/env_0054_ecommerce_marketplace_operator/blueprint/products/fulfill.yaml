  - type: fulfill_aged_surcharge
    target: fulfill_events
    meaning: "The aged inventory surcharge of one SKU in one age band on a monthly assessment."
    grain: "one row per SKU per storage month per age band"
    distinguish_by: [storage_month, sku, inventory_age_band]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date billed."
      storage_month: "Storage month assessed."
      sku: "Seller SKU."
      inventory_age_band: "Age band of the units."
      units: "Units in the band on the assessment date."
