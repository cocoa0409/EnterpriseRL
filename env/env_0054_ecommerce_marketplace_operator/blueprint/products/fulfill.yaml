        map: {removal_order_id: removal_order_id, sku: sku, units: units, removal_type: removal_type, size_tier: size_tier}
  - type: fulfill_removal_fee
    target: fulfill_events
    meaning: "The per-unit removal or disposal fee of a removal order line."
    grain: "one row per removal order per SKU"
    distinguish_by: [removal_order_id, sku]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date billed."
      removal_order_id: "Removal order."
      sku: "Seller SKU."
      units: "Units removed or disposed."
      removal_type: "return_to_seller or disposal."
      size_tier: "Size tier of the SKU."
      amount: "Fee billed, positive."
    account: fbn_fees
    direction: in
    triggers:
      - event: payout:payout_fee_deduction
        map: {fee_source: fulfill, fee_event_ref: fulfill_event_id, amount: amount}
  - type: fulfill_inventory_adjustment
    target: fulfill_events
    meaning: "Units are written off as lost or damaged inside a fulfillment center."
    grain: "one row per inventory adjustment"
    distinguish_by: [adjustment_ref]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date of the adjustment."
      adjustment_ref: "Inventory adjustment reference."
      sku: "Seller SKU."
      units: "Units written off."
      discrepancy_type: "lost_in_warehouse or damaged_in_warehouse."
    account: inventory_units
    direction: out
    triggers: []
  - type: fulfill_inventory_found
    target: fulfill_events
    meaning: "Units earlier written off as lost are found and returned to inventory."
    grain: "one row per original adjustment found"
    distinguish_by: [adjustment_ref]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date found."
      adjustment_ref: "The original loss adjustment."
      sku: "Seller SKU."
      units: "Units found."
      was_reimbursed: "Whether the loss had already been reimbursed."
      reimbursement_ref: "The reimbursement record of that loss, when one exists."
    account: inventory_units
    direction: in
    triggers:
      - event: payout:payout_reimbursement_reversal
        when: {was_reimbursed: true}
        map: {reimbursement_ref: reimbursement_ref}
  - type: fulfill_return_restock
    target: fulfill_events
    meaning: "A buyer's return of an FBN order is graded sellable and put back into inventory."
    grain: "one row per order per SKU restocked"
    distinguish_by: [order_id, sku]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date restocked."
      order_id: "Order the return belongs to."
      sku: "Seller SKU."
      units: "Units restocked."
    account: inventory_units
    direction: in
    triggers: []
  - type: fulfill_reimbursement
    target: fulfill_events
    meaning: "Northloop reimburses the seller for units lost or damaged while in its custody."
    grain: "one row per reimbursed source object per SKU"
    distinguish_by: [reimbursement_type, adjustment_ref, shipment_id, order_id, removal_order_id, sku]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date reimbursed."
      reimbursement_type: "Which loss the reimbursement covers."
      adjustment_ref: "Inventory adjustment reimbursed (warehouse loss or damage)."
      shipment_id: "Inbound shipment reimbursed (inbound shortage)."
      order_id: "Order whose customer return was never received."
      removal_order_id: "Removal order whose shipment was lost."
      case_id: "Seller case that requested it (blank when automatic)."
      sku: "Seller SKU."
      units: "Units reimbursed."
      amount: "Amount reimbursed, positive."
    triggers:
      - event: payout:payout_reimbursement_credit
        map: {reimbursement_ref: fulfill_event_id, amount: amount}
  - type: fulfill_fee_credit
    target: fulfill_events
    meaning: "All or part of an FBN fee is credited back after an upheld fee dispute."
    grain: "one row per credited fee record"
    distinguish_by: [fee_event_ref]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date credited."
      fee_event_ref: "The fee record credited."
      case_id: "Fee dispute case."
      amount: "Credit, positive."
    account: fbn_fees
    direction: out
    triggers:
      - event: payout:payout_fee_reversal
        map: {fee_source: fulfill, fee_event_ref: fee_event_ref, amount: amount}
  - type: fulfill_suspend_inbound
    target: fulfill_enrollments
    mutation: {transition: {from: active, to: inbound_suspended}}
    meaning: "New inbound shipments are blocked."
    grain: "one row per transaction"
    fields:
      suspension_reason: "capacity_overage or unpaid_fees."
    triggers: []
  - type: fulfill_restore_inbound
    target: fulfill_enrollments
    mutation: {transition: {from: inbound_suspended, to: active}}
    meaning: "Inbound shipments are allowed again."
    grain: "one row per transaction"
    fields:
      suspension_reason: "Reset to none."
    triggers: []
  - type: fulfill_request_exit
    target: fulfill_enrollments
    mutation: {transition: [{from: active, to: winding_down}, {from: inbound_suspended, to: winding_down}]}
    meaning: "The seller asks to leave FBN."
    grain: "one row per transaction"
    fields:
      exit_requested_date: "Date of the request."
    triggers: []
  - type: fulfill_cancel_exit
    target: fulfill_enrollments
    mutation: {transition: {from: winding_down, to: active}}
    meaning: "The seller withdraws the exit request."
    grain: "one row per transaction"
    fields:
      exit_requested_date: "Cleared (empty)."
    triggers: []
  - type: fulfill_close
    target: fulfill_enrollments
    mutation: {transition: [{from: winding_down, to: closed}, {from: pending, to: closed}]}
    meaning: "The enrollment ends."
    grain: "one row per transaction"
    fields:
      closed_date: "Date closed."
    triggers: []

measures:
  - id: fulfill_msr_sku_units_on_hand
    window: "From activation to the handling date (frozen time), inclusive."
    measure: "For one SKU: sum of units over inventory_units in-events minus sum of units over inventory_units out-events of the enrollment."
  - id: fulfill_msr_trailing_90d_units
    window: "Rolling 90 calendar days ending the day before the review date."
    measure: "Sum of units over fulfill_outbound_shipment rows of the enrollment with event_date in the window."
  - id: fulfill_msr_consecutive_overage_months
    window: "Storage months counted back from the most recent billed storage month."
    measure: "Number of consecutive storage months, ending with the most recent, that carry a fulfill_capacity_overage_fee row."
  - id: fulfill_msr_reimbursed_units_on_object
    window: "Lifetime of the source object."
    measure: "Sum of units over fulfill_reimbursement rows with the same reimbursement_type, source object reference and sku."

policies:
  - id: fulfill_agg_multi_holding
    subject: [fulfill_enroll]
    rule: >-
      A seller holds at most one FBN enrollment; all of the seller's SKUs in the fulfillment network belong to it. A
      closed enrollment does not count, so a seller who left FBN may enroll again.
    eligibility: []
    params: {max_per_customer: 1}
  - id: fulfill_enrollment_and_review
    subject: [fulfill_enroll, fulfill_activate, fulfill_program_change]
    rule: >-
      A seller may enroll in FBN only while holding a selling plan in one of the statuses listed in
      requires_selling_plan_status; a seller without such a plan cannot enroll or be activated. A new enrollment
      starts in FBN Starter Program. Every review interval the enrollment is placed in the highest program whose
      minimum trailing 90-day units is met by the units shipped through FBN over the trailing 90 days; a program change
      takes effect on the review date and applies to every fee billed from that date, while fees for an earlier
      storage month or an earlier shipment keep the program in force when they were incurred.
    eligibility: []
    measures: [fulfill_msr_trailing_90d_units]
  - id: fulfill_inbound_terms
    subject: [fulfill_inbound_receipt, fulfill_inbound_placement_fee]
    rule: >-
      Inbound shipments may be sent only while the enrollment is active; a shipment already created before a suspension
      or an exit request is still received. Each received SKU line records the units received against the units
      declared on the shipment plan. The inbound placement fee is billed per unit on the shipment plan at the rate of
      the placement option the seller chose: minimal split, partial split or Northloop-optimized split.
    eligibility: []
    formula:
      placement_fee: "round(units * (placement_fee_minimal_split_per_unit if placement_option == 'minimal_split' else (placement_fee_partial_split_per_unit if placement_option == 'partial_split' else placement_fee_optimized_split_per_unit)), 2)"
  - id: fulfill_fulfillment_fees
    subject: [fulfill_outbound_shipment, fulfill_fulfillment_fee]
    rule: >-
      Every unit shipped from FBN inventory for a marketplace order is billed the fulfillment fee of its size tier at
      the program in force on the ship date. The fee is billed once per order and SKU and is not credited when the buyer
      later returns or is refunded for the item.
    eligibility: []
    formula:
      fulfillment_fee: "round(units * (fulfillment_fee_small_standard if size_tier == 'small_standard' else (fulfillment_fee_large_standard if size_tier == 'large_standard' else (fulfillment_fee_large_bulky if size_tier == 'large_bulky' else fulfillment_fee_extra_large))), 2)"
  - id: fulfill_storage_fees
    subject: [fulfill_storage_fee]
    rule: >-
      Storage is billed per SKU per storage month on the storage fee billing day of the following month: the SKU's
      average daily cubic feet times the rate for its storage class (through the size class map) and season. Months
      listed in peak_season_months use the peak rate, every other month the off-peak rate. The program in force on the
      last day of the storage month sets the rate. A SKU with no units on hand during the whole storage month is not
      billed.
    eligibility: []
    formula:
      standard_off_peak_fee: "round(cubic_feet * storage_fee_std_off_peak, 2)"
      standard_peak_fee: "round(cubic_feet * storage_fee_std_peak, 2)"
      oversize_off_peak_fee: "round(cubic_feet * storage_fee_oversize_off_peak, 2)"
      oversize_peak_fee: "round(cubic_feet * storage_fee_oversize_peak, 2)"
  - id: fulfill_aged_surcharge_terms
    subject: [fulfill_aged_surcharge]
    rule: >-
      On each monthly assessment the units of a SKU are aged first-in-first-out from their receipt dates, and every
      unit aged 181 days or more is billed the surcharge of its age band per cubic foot; in the 366-plus band the
      greater of the per-cubic-foot amount and the per-unit minimum times units is billed. Units on a removal order
      created on or before the assessment date are excluded. An enrollment within its aged surcharge exemption days
      after activation pays no surcharge.
    eligibility: []
    formula:
      band_366_plus: "max(round(cubic_feet * aged_fee_366_plus_per_cuft, 2), round(units * aged_fee_366_plus_per_unit_min, 2))"
  - id: fulfill_capacity_terms
    subject: [fulfill_capacity_overage_fee, fulfill_suspend_inbound, fulfill_restore_inbound]
    rule: >-
      When peak daily usage in a storage month exceeds the program's storage capacity, a capacity overage fee of the
      overage rate times the cubic feet above the limit is billed for that month. When the consecutive months with an
      overage fee reach the program's overage months for suspension, or the seller's payments balance has stayed
      negative longer than the unpaid fee suspension days, inbound shipments are suspended. A suspension is lifted only
      when its cause is cleared: for overage, a storage month billed with no overage fee; for unpaid fees, a payments
      balance of zero or more.
    eligibility: []
    measures: [fulfill_msr_consecutive_overage_months]
    formula:
      overage_fee: "round(cubic_feet * capacity_overage_fee_per_cuft, 2)"
  - id: fulfill_removal_terms
    subject: [fulfill_removal_shipment, fulfill_removal_fee]
    rule: >-
      A removal order is the seller's own instruction to return or dispose of their inventory and is placed and
      confirmed by the seller; it can be cancelled only while its status is the removal_order_cancel_allowed_status.
      A removal order may not request more units of a SKU than that SKU's units on hand.
      Removal and disposal fees are billed per unit when the units leave inventory, at the fee class of the SKU's size
      tier through the removal fee size class map and the program in force on that date. Removal fees may be billed
      only while the enrollment is active, inbound_suspended or winding_down.
    eligibility:
      - id: enrollment_not_closed
        applies_to: [fulfill_removal_fee]
        kind: state
        condition: "Removal fees may be billed only while the enrollment is active, inbound_suspended or winding_down."
        evidence_fields: [fulfill_enrollments.status, fulfill_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [fulfill_enrollments.enrollment_id]
          action_bindings:
            fulfill_enrollments.enrollment_id: enrollment_id
        state_contract:
          field: fulfill_enrollments.status
          allowed: [active, inbound_suspended, winding_down]
    measures: [fulfill_msr_sku_units_on_hand]
    formula:
      removal_fee: "round(units * (removal_fee_small_standard if size_tier == 'small_standard' else (removal_fee_large_standard if size_tier == 'large_standard' else removal_fee_oversize)), 2)"
      disposal_fee: "round(units * (disposal_fee_standard if size_tier in ['small_standard', 'large_standard'] else disposal_fee_oversize), 2)"
  - id: fulfill_reimbursement_terms
    subject: [fulfill_reimbursement, fulfill_inventory_adjustment, fulfill_inventory_found]
    rule: >-
      Northloop reimburses units lost or damaged in its custody. A lost_in_warehouse or damaged_in_warehouse adjustment
      not found within the auto-reimburse days is reimbursed automatically. A warehouse loss claim is filed no later
      than the warehouse loss claim window counted in calendar days from the inventory adjustment date. An inbound
      shortage claim (units expected less units received on a shipment line) may be filed only after the inbound
      reconciliation wait and within the inbound shortage claim window, both counted in calendar days from the receipt
      date of that line. A customer_return_not_received claim may be filed after the return wait and within the
      return claim window, both counted from the buyer refund date of the order, and only when no restock of that
      order exists. A lost removal claim may be filed within the removal claim window counted from the removal order's
      creation. Each unit is valued at the declared unit cost on the SKU's latest inbound receipt, capped at the
      program's reimbursement unit value cap, and units already reimbursed on the same source object are never
      reimbursed again. When reimbursed units are found and found_inventory_reversal is true, the reimbursement is
      reversed.
    eligibility:
      - id: warehouse_loss_window
        applies_to: [fulfill_reimbursement]
        kind: time
        condition: "A warehouse loss claim is filed no later than the warehouse loss claim window counted in calendar days from the inventory adjustment date."
        evidence_fields: [fulfill_events.event_date, fulfill_events.adjustment_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [fulfill_events.adjustment_ref]
          action_bindings:
            fulfill_events.adjustment_ref: adjustment_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: "the inventory adjustment date"
          anchor_source: fulfill_events.event_date
          relation: not_after
          duration_source: variants.warehouse_loss_claim_window_days
          unit: calendar_days
          counting_rule: "counted in calendar days from the inventory adjustment date"
          boundary: inclusive
      - id: no_double_reimbursement
        applies_to: [fulfill_reimbursement]
        kind: dedup
        condition: "units already reimbursed on the same source object are never reimbursed again"
        evidence_fields: [fulfill_events.reimbursement_type, fulfill_events.adjustment_ref, fulfill_events.shipment_id, fulfill_events.order_id, fulfill_events.removal_order_id, fulfill_events.sku]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [fulfill_events.reimbursement_type, fulfill_events.adjustment_ref, fulfill_events.sku]
            - [fulfill_events.reimbursement_type, fulfill_events.shipment_id, fulfill_events.sku]
            - [fulfill_events.reimbursement_type, fulfill_events.order_id, fulfill_events.sku]
            - [fulfill_events.reimbursement_type, fulfill_events.removal_order_id, fulfill_events.sku]
          action_bindings:
            fulfill_events.reimbursement_type: reimbursement_type
            fulfill_events.adjustment_ref: adjustment_ref
            fulfill_events.shipment_id: shipment_id
            fulfill_events.order_id: order_id
            fulfill_events.removal_order_id: removal_order_id
            fulfill_events.sku: sku
        dedup_contract:
          table: fulfill_events
          mode: separate_record
          object_bindings: {reimbursement_type: reimbursement_type, adjustment_ref: adjustment_ref, shipment_id: shipment_id, order_id: order_id, removal_order_id: removal_order_id, sku: sku}
          duplicate_filters: {event_type: [fulfill_reimbursement]}
          distinct_fields: []
    measures: [fulfill_msr_reimbursed_units_on_object]
    formula:
      reimbursement: "round(units * min(unit_cost, reimbursement_unit_value_cap), 2)"
  - id: fulfill_return_restock_terms
    subject: [fulfill_return_restock]
    rule: >-
      A buyer return of an FBN order received at the Northloop returns center is restocked only when it is graded
      unopened or opened_resellable; any other grade stays out of sellable inventory and is not restocked. A restock
      never changes fees already billed on the order.
    eligibility: []
  - id: fulfill_fee_disputes
    subject: [fulfill_fee_credit]
    rule: >-
      A seller may dispute an FBN fee no later than the fee dispute window counted in calendar days from that fee's
      event_date. A dispute is upheld when the enrollment records show the fee used the wrong size tier, the wrong
      program, the wrong season or units that were already on a removal order; the credit is the billed fee less the
      fee recomputed correctly. A rejected dispute books nothing, and one fee record is credited at most once.
    eligibility:
      - id: fbn_dispute_window
        applies_to: [fulfill_fee_credit]
        kind: time
        condition: "A seller may dispute an FBN fee no later than the fee dispute window counted in calendar days from that fee's event_date."
        evidence_fields: [fulfill_events.event_date, fulfill_events.fulfill_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [fulfill_events.fulfill_event_id]
          action_bindings:
            fulfill_events.fulfill_event_id: fee_event_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: "that fee's event_date"
          anchor_source: fulfill_events.event_date
          relation: not_after
          duration_source: variants.fee_dispute_window_days
          unit: calendar_days
          counting_rule: "counted in calendar days from that fee's event_date"
          boundary: inclusive
  - id: fulfill_exit_terms
    subject: [fulfill_request_exit, fulfill_cancel_exit, fulfill_close]
    rule: >-
      Leaving FBN is the seller's own decision and is confirmed by the seller. After an exit request the seller must
      remove the remaining units within the exit removal deadline counted in calendar days from the exit request date;
      units still on hand after it are disposed at the seller's cost at the disposal fee. An exit request may be
      withdrawn only while units remain on hand. The enrollment closes when units_on_hand reaches zero. Storage fees
      continue to be billed for every storage month in which units remain.
    eligibility: []
    params:
      per_tier:
        "FBN Starter Program": {exit_deadline_days: "=exit_removal_deadline_days"}
        "FBN Core Program": {exit_deadline_days: "=exit_removal_deadline_days"}
        "FBN Growth Program": {exit_deadline_days: "=exit_removal_deadline_days"}
        "FBN Scale Program": {exit_deadline_days: "=exit_removal_deadline_days"}
        "FBN Premier Program": {exit_deadline_days: "=exit_removal_deadline_days"}
        "FBN Enterprise Program": {exit_deadline_days: "=exit_removal_deadline_days"}
