  - type: fulfill_capacity_overage_fee
    target: fulfill_events
    meaning: "The capacity overage fee for a storage month in which peak usage exceeded the capacity limit."
    grain: "one row per storage month"
    distinguish_by: [storage_month]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date billed."
      storage_month: "Storage month."
      cubic_feet: "Peak cubic feet above the capacity limit."
      amount: "Fee billed, positive."
    account: fbn_fees
    direction: in
    triggers:
      - event: payout:payout_fee_deduction
        map: {fee_source: fulfill, fee_event_ref: fulfill_event_id, amount: amount}
  - type: fulfill_removal_shipment
    target: fulfill_events
    meaning: "Units leave inventory on a removal order, shipped back to the seller or disposed."
    grain: "one row per removal order per SKU"
    distinguish_by: [removal_order_id, sku]
    fields:
