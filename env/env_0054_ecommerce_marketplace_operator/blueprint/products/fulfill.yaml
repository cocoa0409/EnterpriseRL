
# Fulfilled by Northloop (FBN) — the seller's fulfillment enrollment: inventory stored in Northloop
# fulfillment centers, picked, packed and shipped for marketplace orders, with storage and service fees.
category: fulfill
display_name: Fulfilled by Northloop (FBN)

binding:
  holding_table: fulfill_enrollments
  event_tables: [fulfill_events]
  intake_tables: [fulfill_removal_orders, fulfill_cases]
  status_field: status
  variant_field: variant_name
  quantity_fields: {units_on_hand: inventory_units}

lifecycle:
  states: [pending, active, inbound_suspended, winding_down, closed]
  transitions:
    - {from: pending, to: active, by: system, means: "The enrollment is approved and the seller may send inventory."}
    - {from: pending, to: closed, by: system, means: "The enrollment is declined or abandoned before approval."}
    - {from: active, to: inbound_suspended, by: system, means: "New inbound shipments are blocked for repeated capacity overage or unpaid fees."}
    - {from: inbound_suspended, to: active, by: agent, means: "The suspension cause is cleared and inbound shipments are allowed again."}
    - {from: active, to: winding_down, by: user, means: "The seller asks to leave FBN; remaining inventory must be removed or disposed."}
    - {from: inbound_suspended, to: winding_down, by: user, means: "A suspended seller asks to leave FBN."}
    - {from: winding_down, to: active, by: user, means: "The seller withdraws the exit request while inventory is still on hand."}
    - {from: winding_down, to: closed, by: system, means: "All units have left the fulfillment network and the enrollment ends."}

accounts:
  - key: inventory_units
    unit: units
    meaning: "Sellable and unsellable units of the seller held in Northloop fulfillment centers; the holding's units_on_hand is its running sum."
  - key: fbn_fees
    unit: USD
    meaning: "FBN service fees billed on the enrollment net of fee credits."

parameter_schema:
  min_trailing_90d_units: Minimum units shipped through FBN in the trailing 90 days to be placed in the program at a quarterly review (integer).
  tier_review_frequency_months: Months between program reviews that re-place the enrollment by trailing 90-day units (integer).
  storage_capacity_cuft: Storage capacity limit in cubic feet (peak daily volume in a calendar month).
  capacity_measure_basis: How usage is measured against the capacity limit (enum string).
  capacity_overage_fee_per_cuft: Fee per cubic foot of peak usage above the capacity limit in a storage month, USD.
  overage_months_for_suspension: Consecutive storage months with a capacity overage fee after which inbound shipments are suspended (integer).
  unpaid_fee_suspension_days: Calendar days the seller's payments balance may stay negative before inbound shipments are suspended (integer).
  storage_fee_basis: Volume the monthly storage fee is charged on (enum string).
  storage_fee_billing_day: Day of the following month on which a storage month's storage fees and aged surcharges are billed (integer).
  peak_season_months: Calendar months billed at peak-season storage rates (list of month numbers).
  storage_fee_size_class_map: Mapping of size tier to storage rate class (mapping).
  storage_fee_std_off_peak: Monthly storage fee per cubic foot, standard class, January-September, USD.
  storage_fee_std_peak: Monthly storage fee per cubic foot, standard class, October-December, USD.
  storage_fee_oversize_off_peak: Monthly storage fee per cubic foot, oversize class, January-September, USD.
  storage_fee_oversize_peak: Monthly storage fee per cubic foot, oversize class, October-December, USD.
  aged_age_basis: How a unit's inventory age is measured (enum string).
  aged_fee_181_270_per_cuft: Aged inventory surcharge per cubic foot for units aged 181-270 days on the assessment date, USD.
  aged_fee_271_365_per_cuft: Aged inventory surcharge per cubic foot for units aged 271-365 days on the assessment date, USD.
  aged_fee_366_plus_per_cuft: Aged inventory surcharge per cubic foot for units aged 366 days or more on the assessment date, USD.
  aged_fee_366_plus_per_unit_min: Per-unit alternative for units aged 366 days or more; the greater of the per-cubic-foot and per-unit amounts is charged, USD.
  aged_surcharge_exempt_first_days: Calendar days after activation during which the enrollment pays no aged inventory surcharge (integer; 0 = no exemption).
  fulfillment_fee_small_standard: Fulfillment fee per unit shipped, small standard size tier, USD.
  fulfillment_fee_large_standard: Fulfillment fee per unit shipped, large standard size tier, USD.
  fulfillment_fee_large_bulky: Fulfillment fee per unit shipped, large bulky size tier, USD.
  fulfillment_fee_extra_large: Fulfillment fee per unit shipped, extra large size tier, USD.
  placement_fee_minimal_split_per_unit: Inbound placement fee per unit when the seller ships to a single fulfillment center (minimal split), USD.
  placement_fee_partial_split_per_unit: Inbound placement fee per unit for a partial split (two or three centers), USD.
  placement_fee_optimized_split_per_unit: Inbound placement fee per unit when the seller follows Northloop's optimized split, USD.
  removal_fee_size_class_map: Mapping of size tier to removal and disposal fee class (mapping).
  removal_fee_small_standard: Removal (return to seller) fee per unit, small standard class, USD.
  removal_fee_large_standard: Removal (return to seller) fee per unit, large standard class, USD.
  removal_fee_oversize: Removal (return to seller) fee per unit, oversize class, USD.
  disposal_fee_standard: Disposal fee per unit, small and large standard classes, USD.
  disposal_fee_oversize: Disposal fee per unit, oversize class, USD.
  removal_order_cancel_allowed_status: Removal order status in which the seller may still cancel it (removal order status value).
  inbound_reconciliation_wait_days: Calendar days after a shipment's last receipt before an inbound shortage claim may be filed (integer).
  inbound_shortage_claim_window_days: Calendar days after a shipment's last receipt within which an inbound shortage claim may be filed (integer).
  auto_reimburse_after_days: Calendar days after a lost or damaged-in-warehouse adjustment after which Northloop reimburses automatically if the units are not found (integer).
  warehouse_loss_claim_window_days: Calendar days after a lost or damaged-in-warehouse adjustment within which the seller may claim a reimbursement not issued automatically (integer).
  return_not_received_wait_days: Calendar days after a buyer refund before a seller may claim for a customer return never received (integer).
  return_not_received_claim_window_days: Calendar days after a buyer refund within which a customer-return-not-received claim may be filed (integer).
  removal_lost_claim_window_days: Calendar days after the removal order's creation within which a lost removal shipment may be claimed (integer).
  reimbursement_basis: Per-unit value used for reimbursements (enum string).
  reimbursement_unit_value_cap: Maximum reimbursement value per unit, USD.
  found_inventory_reversal: Whether a reimbursement is reversed when the reimbursed units are later found and returned to inventory (boolean).
  fee_dispute_window_days: Calendar days after a fee's event_date within which the seller may dispute an FBN fee (integer).
  exit_removal_deadline_days: Calendar days after the exit request within which remaining units must be removed; units still on hand afterwards are disposed at the seller's cost (integer).
  requires_selling_plan_status: Selling plan statuses the seller must hold to enroll or to send inventory (list of selling plan status values).

