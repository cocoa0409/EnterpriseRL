  - type: fulfill_fulfillment_fee
    target: fulfill_events
    meaning: "The per-unit fulfillment fee of an order shipped from FBN inventory."
    grain: "one row per order per SKU"
    distinguish_by: [order_id, sku]
    fields:
      enrollment_id: "Enrollment."
