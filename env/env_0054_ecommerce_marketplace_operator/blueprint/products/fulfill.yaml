  - type: fulfill_storage_fee
    target: fulfill_events
    meaning: "The monthly storage fee of one SKU for one storage month."
    grain: "one row per SKU per storage month"
    distinguish_by: [storage_month, sku]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date billed."
      storage_month: "Calendar month of storage."
      sku: "Seller SKU."
      size_tier: "Size tier of the SKU."
