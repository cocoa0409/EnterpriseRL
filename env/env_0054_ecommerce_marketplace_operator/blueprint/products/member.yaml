events:
  - type: member_enroll
    target: member_memberships
    mutation: create
    meaning: "A buyer signs up for a Loop+ plan."
    grain: "one row per membership"
    fields:
      membership_id: "Membership reference."
      customer_id: "The buyer."
      variant_name: "Plan chosen."
      start_date: "Sign-up date."
      payment_last4: "Card on file for the fee."
    triggers: []
  - type: member_start_trial
    target: member_memberships
    mutation: {transition: {from: pending, to: trial}}
    meaning: "The free trial starts."
    grain: "one row per transaction"
    fields:
      trial_end_date: "Last day of the trial."
      eligibility_verified_date: "Date eligibility proof was accepted (empty when none required)."
    triggers: []
  - type: member_activate
    target: member_memberships
    mutation: {transition: [{from: pending, to: active}, {from: trial, to: active}, {from: payment_hold, to: active}, {from: cancel_pending, to: active}, {from: lapsed, to: active}]}
    meaning: "The membership becomes paid and active (first charge, trial conversion, recovered payment, resumed or rejoined membership)."
    grain: "one row per transaction"
    fields:
      paid_through_date: "Last day covered by the fees paid."
      next_billing_date: "Next renewal date."
    triggers: []
  - type: member_fee_charge
    target: member_events
    meaning: "A membership fee is charged."
    grain: "one row per billing period per charge type"
    distinguish_by: [billing_period_start, charge_type]
    fields:
      membership_id: "Membership."
      customer_id: "The buyer."
      event_date: "Date charged."
      amount: "Fee charged, positive."
      billing_period_start: "First day of the period the fee covers."
      charge_type: "first_charge, renewal or plan_switch."
    account: membership_fees
    direction: in
    triggers: []
  - type: member_fee_decline
    target: member_events
    meaning: "A renewal charge attempt is declined."
    grain: "one row per billing period per attempt"
    distinguish_by: [billing_period_start, decline_attempt]
    fields:
      membership_id: "Membership."
      customer_id: "The buyer."
      event_date: "Date of the attempt."
      billing_period_start: "Period the renewal would cover."
      decline_attempt: "Attempt number (1 = original charge)."
    triggers:
      - event: member:member_payment_hold
        when: {decline_attempt: 1}
        map: {}
  - type: member_payment_hold
    target: member_memberships
    mutation: {transition: {from: active, to: payment_hold}}
    meaning: "The membership enters payment hold after a declined renewal."
    grain: "one row per transaction"
    fields:
      next_billing_date: "Date of the next retry."
    triggers: []
  - type: member_lapse
    target: member_memberships
    mutation: {transition: {from: payment_hold, to: lapsed}}
    meaning: "Retries are exhausted and the membership lapses."
    grain: "one row per transaction"
    fields:
      end_date: "Date benefits stopped."
    triggers: []
  - type: member_fee_refund
    target: member_events
    meaning: "All or part of a membership fee is refunded."
    grain: "one row per refunded charge per refund basis"
    distinguish_by: [charge_ref, refund_basis]
    fields:
      membership_id: "Membership."
      customer_id: "The buyer."
      event_date: "Date refunded."
      amount: "Amount refunded, positive."
      charge_ref: "The fee charge refunded."
      refund_basis: "full_unused, prorated_unused_months or switch_credit."
      unused_months: "Whole months of the paid period not yet started (prorated refunds)."
    account: membership_fees
    direction: out
    triggers: []
  - type: member_request_cancel
    target: member_memberships
    mutation: {transition: [{from: active, to: cancel_pending}, {from: trial, to: cancel_pending}]}
    meaning: "The buyer turns off renewal; the membership ends at the paid-through or trial end date."
    grain: "one row per transaction"
    fields:
      cancel_effective_date: "Date the membership will end."
    triggers: []
  - type: member_resume_trial
    target: member_memberships
    mutation: {transition: {from: cancel_pending, to: trial}}
    meaning: "The buyer resumes a trial that was set to end."
    grain: "one row per transaction"
    fields:
      cancel_effective_date: "Cleared (empty)."
    triggers: []
  - type: member_end
    target: member_memberships
    mutation: {transition: [{from: cancel_pending, to: cancelled}, {from: pending, to: cancelled}, {from: lapsed, to: cancelled}]}
    meaning: "The membership ends at its effective date or after verification or reactivation lapses."
    grain: "one row per transaction"
    fields:
      end_date: "Date ended."
    triggers: []
  - type: member_cancel_now
    target: member_memberships
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The buyer ends a paid membership immediately."
    grain: "one row per transaction"
    fields:
      end_date: "Date ended."
    triggers:
      - event: member:member_fee_refund
        map: {membership_id: membership_id}
  - type: member_benefit_use
    target: member_events
    meaning: "The member uses a membership benefit."
    grain: "one row per order or session per benefit"
    distinguish_by: [usage_ref, benefit_code]
    fields:
      membership_id: "Membership."
      customer_id: "The buyer."
      event_date: "Date used."
      usage_ref: "Order number or streaming session reference."
      benefit_code: "Benefit used."
    triggers: []
  - type: member_credit_earn
    target: member_events
    meaning: "Promotional credit is earned."
    grain: "one row per order per credit type"
    distinguish_by: [usage_ref, credit_type]
    fields:
      membership_id: "Membership."
      customer_id: "The buyer."
      event_date: "Date earned."
      usage_ref: "Order that earned it."
      credit_type: "no_rush or late_delivery."
      amount: "Credit earned, positive."
      expiry_date: "Date the credit expires."
    account: promo_credit
    direction: in
    triggers: []
  - type: member_credit_redeem
    target: member_events
    meaning: "Promotional credit is applied to an order."
    grain: "one row per order"
    distinguish_by: [usage_ref]
    fields:
      membership_id: "Membership."
      customer_id: "The buyer."
      event_date: "Date applied."
      usage_ref: "Order it was applied to."
      amount: "Credit applied, positive."
    account: promo_credit
    direction: out
    triggers: []
  - type: member_credit_expire
    target: member_events
    meaning: "An unused credit expires."
    grain: "one row per expired credit"
    distinguish_by: [credit_ref]
    fields:
      membership_id: "Membership."
      customer_id: "The buyer."
      event_date: "Date expired."
      credit_ref: "The credit that expired."
      amount: "Unused amount expired, positive."
    account: promo_credit
    direction: out
    triggers: []
  - type: member_plan_switch
    target: member_memberships
    mutation: update
    meaning: "The member moves to another Loop+ plan."
    grain: "one row per transaction"
    fields:
      variant_name: "New plan."
      paid_through_date: "Paid-through date after the switch."
      next_billing_date: "Next renewal after the switch."
    triggers: []
  - type: member_reverify
    target: member_memberships
    mutation: update
    meaning: "Eligibility proof is re-verified."
    grain: "one row per transaction"
    fields:
      eligibility_verified_date: "Date re-verified."
    triggers: []

measures:
  - id: member_msr_benefit_uses_since_charge
    window: "From the event_date of the most recent paid fee charge to the handling date (frozen time), inclusive."
    measure: "Count of member_benefit_use rows of the membership whose benefit_code is in benefit_uses_counted."
  - id: member_msr_credit_earned_month
    window: "The calendar month of the earning date."
    measure: "Sum of amount over member_credit_earn rows of the membership in that month."
  - id: member_msr_late_credits_cycle
    window: "The current billing cycle, from the start of the period covered by the latest fee charge to the handling date."
    measure: "Count of member_credit_earn rows of the membership with credit_type late_delivery in the window."

policies:
  - id: member_agg_multi_holding
    subject: [member_enroll]
    rule: >-
      A buyer holds at most one Loop+ membership at a time across all plans; a buyer who wants another plan switches
      the existing membership. Household adults and teens share the owner's membership and hold none of their own. A
      cancelled membership does not count.
    eligibility: []
    params: {max_per_customer: 1}
  - id: member_trial_and_eligibility
    subject: [member_enroll, member_start_trial, member_activate, member_end, member_reverify, member_plan_switch]
    rule: >-
      A plan that requires eligibility proof starts only after an accepted proof document of its type is provided
      within the verification days; otherwise the pending membership ends. A buyer gets the plan's free trial unless a
      trial or paid membership of theirs ended within the trial lookback months before sign-up, in which case the first
      fee is charged at once. Eligibility is re-verified every re-verification interval counted from the last verified
      date; when it is not completed within the grace days after it falls due, the membership moves to the failed
      re-verification rollover plan at its next billing date. A student plan whose tenure reaches the cap moves to its
      tenure rollover plan at the next billing date.
    eligibility: []
  - id: member_billing
    subject: [member_fee_charge, member_fee_decline, member_payment_hold, member_lapse, member_activate]
    rule: >-
      The fee of the plan is charged on the day after the trial ends and then every billing cycle on the next billing
      date. A declined renewal puts the membership in payment hold with benefits kept, and the charge is retried every
      retry interval up to the retry count; a successful retry or updated card returns it to active with the paid
      period running from the original renewal date, and exhausted retries lapse it. A lapsed buyer may rejoin within the reactivation window,
      paying a fresh fee and keeping tenure. A fee change applies only to renewals after the price change notice days.
    eligibility: []
  - id: member_refunds
    subject: [member_fee_refund, member_cancel_now]
    rule: >-
      A buyer who ends a paid membership immediately is refunded in full when the cancellation is requested within the
      full refund window counted in calendar days from the most recent paid charge and the benefit uses since that
      charge do not exceed the allowed uses. Otherwise, on plans with annual_partial_refund true, the refund is the fee
      times the whole months not yet started of the paid period over the months in the cycle, paid only when at least
      the partial refund minimum; on other plans no refund is due and the buyer should instead turn off renewal and keep
      benefits to the paid-through date. A trial is never refunded because nothing was charged. Refunds go to the
      original payment method and a charge is refunded at most once per basis.
    eligibility:
      - id: full_refund_window
        applies_to: [member_fee_refund]
        kind: time
        condition: "the cancellation is requested within the full refund window counted in calendar days from the most recent paid charge"
        evidence_fields: [member_events.event_date, member_events.member_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [member_events.member_event_id]
          action_bindings:
            member_events.member_event_id: charge_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: "the most recent paid charge"
          anchor_source: member_events.event_date
          relation: not_after
          duration_source: variants.full_refund_window_days
          unit: calendar_days
          counting_rule: "counted in calendar days from the most recent paid charge"
          boundary: inclusive
    measures: [member_msr_benefit_uses_since_charge]
    params:
      per_tier:
        "Loop+ Access Monthly": {partial: "=annual_partial_refund", minimum: "=partial_refund_min_amount"}
        "Loop+ Student Monthly": {partial: "=annual_partial_refund", minimum: "=partial_refund_min_amount"}
        "Loop+ Student Annual": {partial: "=annual_partial_refund", minimum: "=partial_refund_min_amount"}
        "Loop+ Monthly": {partial: "=annual_partial_refund", minimum: "=partial_refund_min_amount"}
        "Loop+ Annual": {partial: "=annual_partial_refund", minimum: "=partial_refund_min_amount"}
        "Loop+ Household Annual": {partial: "=annual_partial_refund", minimum: "=partial_refund_min_amount"}
    formula:
      prorated_refund: "round(membership_fee * unused_months / billing_cycle_months, 2)"
  - id: member_cancellation
    subject: [member_request_cancel, member_resume_trial, member_end, member_activate]
    rule: >-
      Cancelling is the buyer's own decision and is confirmed by the buyer. By default a cancellation turns off renewal
      and the membership ends on the paid-through date, or on the trial end date during a trial, with benefits until
      then. Until that date the buyer may resume, returning to trial or active as before with no new charge.
    eligibility: []
  - id: member_plan_switching
    subject: [member_plan_switch, member_fee_charge, member_fee_refund]
    rule: >-
      A move from a monthly plan to an annual plan takes effect immediately: the annual fee is charged and the unused
      calendar days of the current monthly cycle are refunded as a switch credit. A move from an annual plan takes
      effect at the end of the term. A move onto a plan that requires eligibility proof needs accepted proof first.
    eligibility: []
  - id: member_promo_credits
    subject: [member_credit_earn, member_credit_redeem, member_credit_expire, member_benefit_use]
    rule: >-
      A member in trial or active status earns the No-Rush credit for each order where No-Rush delivery is chosen, and
      the late-delivery credit when an order on one of the late-credit delivery options is delivered with
      delivery_promise_met missed, no more than the plan's late credits per billing cycle. Credit earned in one calendar
      month never exceeds the plan's monthly earn cap; earnings beyond it are not booked. Each credit expires after its
      validity days counted from the earning date, and the unused part is expired. Credits are applied oldest first.
      Every use of a benefit is recorded with its benefit code.
    eligibility: []
    measures: [member_msr_credit_earned_month, member_msr_late_credits_cycle]
  - id: member_household_sharing
    subject: [member_benefit_use]
    rule: >-
      The owner may share benefits with up to the plan's household adults and household teens; a plan allowing zero
      shares nothing. Shopping benefits used by a household adult or teen are recorded on the owner's membership and
      count as benefit uses of that membership for refund purposes. Music is shared only on the family music tier;
      video, photo storage and deal early access belong to the owner and adults only. Removing a household member never
      changes the owner's fee.
    eligibility: []
  - id: member_lapsed_rejoin
    subject: [member_activate, member_fee_charge]
    rule: >-
      A lapsed membership may be rejoined only within the reactivation window counted in calendar days from end_date;
      rejoining charges a fresh first charge of the plan's fee, starts a new billing cycle on the rejoin date and, when
      reactivation_keeps_tenure is true, keeps the original start_date for tenure caps. After the window the buyer
      signs up again as a new membership with no trial when the trial lookback applies.
    eligibility:
      - id: rejoin_window
        applies_to: [member_activate]
        kind: time
        condition: "A lapsed membership may be rejoined only within the reactivation window counted in calendar days from end_date"
        evidence_fields: [member_memberships.end_date, member_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [member_memberships.membership_id]
          action_bindings:
            member_memberships.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "end_date"
          anchor_source: member_memberships.end_date
          relation: not_after
          duration_source: variants.reactivation_window_days
          unit: calendar_days
          counting_rule: "counted in calendar days from end_date"
          boundary: inclusive
