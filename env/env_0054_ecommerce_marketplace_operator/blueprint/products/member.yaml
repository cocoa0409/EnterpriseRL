
# Loop+ Membership — the buyer's paid shopping membership on Northloop.
category: member
display_name: Loop+ Membership

binding:
  holding_table: member_memberships
  event_tables: [member_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {promo_credit_balance: promo_credit}

lifecycle:
  states: [pending, trial, active, payment_hold, cancel_pending, lapsed, cancelled]
  transitions:
    - {from: pending, to: trial, by: system, means: "Sign-up completes (eligibility verified where required) and the buyer qualifies for a free trial."}
    - {from: pending, to: active, by: system, means: "Sign-up completes without a trial and the first fee is charged."}
    - {from: pending, to: cancelled, by: system, means: "Required eligibility proof is not provided within the verification period."}
    - {from: trial, to: active, by: system, means: "The trial ends and the first fee is charged."}
    - {from: trial, to: cancel_pending, by: user, means: "The buyer turns off conversion during the trial; benefits continue to the trial end."}
    - {from: active, to: cancel_pending, by: user, means: "The buyer turns off auto-renew; benefits continue to the paid-through date."}
    - {from: cancel_pending, to: active, by: user, means: "The buyer resumes a paid membership before it ends."}
    - {from: cancel_pending, to: trial, by: user, means: "The buyer resumes a trial before it ends."}
    - {from: cancel_pending, to: cancelled, by: system, means: "The paid-through or trial end date is reached."}
    - {from: active, to: cancelled, by: user, means: "The buyer ends the membership immediately with the refund the refund policy allows."}
    - {from: active, to: payment_hold, by: system, means: "A renewal charge is declined; benefits continue while retries run."}
    - {from: payment_hold, to: active, by: system, means: "A retry or an updated card succeeds."}
    - {from: payment_hold, to: lapsed, by: system, means: "All retries fail; benefits stop."}
    - {from: lapsed, to: active, by: user, means: "The buyer rejoins within the reactivation window and pays the fee."}
    - {from: lapsed, to: cancelled, by: system, means: "The reactivation window passes."}

accounts:
  - key: membership_fees
    unit: USD
    meaning: "Membership fees paid net of refunds: fee charges in, fee refunds out."
  - key: promo_credit
    unit: USD
    meaning: "Promotional Loop+ credit available to the member: credits earned in, credits redeemed or expired out; the holding's promo_credit_balance is its running sum."

parameter_schema:
  membership_fee: Fee per billing cycle, USD.
  billing_cycle_months: Months covered by one fee (integer).
  free_trial_days: Length of the free trial in calendar days (integer).
  trial_lookback_months: A buyer whose trial or paid membership ended within this many months before sign-up gets no trial (integer).
  trial_conversion_charge_rule: When the first fee is charged after a trial (enum string).
  eligibility_proof_type: Eligibility the plan requires (enum string).
  eligibility_proof_documents: Documents accepted as eligibility proof (list).
  eligibility_verification_days: Calendar days after sign-up to provide eligibility proof; not_applicable when no proof is required.
  reverification_interval_months: Months between eligibility re-verifications; not_applicable when no proof is required.
  reverification_grace_days: Calendar days after a re-verification falls due before the membership moves to the rollover plan; not_applicable when no proof is required.
  failed_reverification_rollover_plan: Plan the membership moves to when re-verification is not completed (official plan name); not_applicable when no proof is required.
  tier_tenure_cap_months: Maximum months a member may hold the plan (integer); no_cap when unlimited.
  tenure_cap_rollover_plan: Plan the membership moves to when the tenure cap is reached (official plan name); not_applicable without a cap.
  renewal_notice_days: Calendar days before an annual renewal that the reminder is sent; not_applicable on monthly plans.
  renewal_retry_count: Retries of a declined renewal charge before the membership lapses (integer).
  renewal_retry_interval_days: Calendar days between retries of a declined renewal charge (integer).
  payment_hold_benefits: Whether benefits continue while a declined renewal is being retried (boolean).
  reactivation_window_days: Calendar days after lapsing within which the buyer may rejoin keeping tenure (integer).
  reactivation_keeps_tenure: Whether rejoining within the window keeps the original start date for tenure caps (boolean).
  full_refund_window_days: Calendar days after a paid charge within which an immediate cancellation with no benefit use is refunded in full (integer).
  full_refund_max_benefit_uses: Benefit uses allowed since the charge for a full refund to apply (integer).
  benefit_uses_counted: Benefit codes that count as a use for refund purposes (list of benefit_code values).
  annual_partial_refund: Whether an immediate cancellation outside the full-refund conditions earns a prorated refund (boolean).
  partial_refund_basis: How a prorated refund is sized (enum string); not_applicable without partial refunds.
  partial_refund_min_amount: Smallest prorated refund paid, USD; not_applicable without partial refunds.
  cancel_effective_default: When a cancellation takes effect unless the buyer ends immediately (enum string).
  refund_destination: Where membership refunds are sent (enum string).
  switch_to_annual_effective: When a move from a monthly to an annual plan takes effect (enum string); not_applicable on annual plans.
  switch_to_annual_credit_basis: Credit given for the unused part of the monthly fee when switching to annual (enum string); not_applicable on annual plans.
  switch_from_annual_effective: When a move from an annual plan to another plan takes effect (enum string); not_applicable on monthly plans.
  two_day_delivery_included: Whether Two-Day delivery on eligible items is free (boolean).
  same_day_delivery_included: Whether member Same-Day pricing applies (boolean).
  video_streaming_included: Whether Loop+ Video is included (boolean).
  music_streaming_tier: Loop+ Music entitlement (enum string).
  photo_storage_unlimited: Whether unlimited full-resolution photo storage is included (boolean).
  grocery_delivery_min_subtotal: Grocery subtotal at or above which grocery delivery is free, USD.
  grocery_delivery_fee_below_min: Grocery delivery fee below the minimum, USD.
  deal_early_access_minutes: Minutes of early access to Lightning Deals (integer).
  household_adults_allowed: Additional adults who may share benefits (integer).
  household_teens_allowed: Teen sub-accounts who may share shipping benefits (integer).
  no_rush_credit_amount: Promotional credit earned per order where the member chooses No-Rush delivery, USD.
  no_rush_credit_validity_days: Calendar days after earning that a No-Rush credit expires (integer).
  promo_credit_monthly_earn_cap: Most promotional credit earnable per calendar month, USD.
  late_delivery_credit_amount: Credit earned when a guaranteed member order is delivered after its promised date, USD.
  late_delivery_credits_per_cycle: Most late-delivery credits per billing cycle (integer).
  late_credit_delivery_options: Delivery options whose late delivery earns the credit (list of official option names).
  late_credit_validity_days: Calendar days after earning that a late-delivery credit expires (integer).
  price_change_notice_days: Calendar days of notice before a fee change applies at renewal (integer).

