
# Northloop Payments — the seller's payments account: sale proceeds, reserves, deductions and payouts to the bank.
category: payout
display_name: Northloop Payments

binding:
  holding_table: payout_accounts
  event_tables: [payout_events]
  intake_tables: [payout_chargeback_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance: payments_balance, reserved_balance: reserved_funds}

lifecycle:
  states: [pending_verification, active, on_hold, closing, closed]
  transitions:
    - {from: pending_verification, to: active, by: system, means: "Identity and bank account verification completes."}
    - {from: pending_verification, to: closed, by: system, means: "Verification is never completed and the application lapses."}
    - {from: active, to: on_hold, by: system, means: "Payouts are held: selling suspended, bank details invalid, or re-verification overdue."}
    - {from: on_hold, to: active, by: agent, means: "The hold cause is cleared and payouts resume."}
    - {from: active, to: closing, by: user, means: "The seller asks to close the payments account; the balance is held for the final hold period."}
    - {from: on_hold, to: closing, by: user, means: "A held seller asks to close the payments account."}
    - {from: closing, to: closed, by: system, means: "The final hold has ended, reserves are released and the balance is paid out or collected to zero."}

accounts:
  - key: payments_balance
    unit: USD
    meaning: "Total seller balance on the payments account, reserved funds included; may go negative. The holding's balance is its running sum."
  - key: reserved_funds
    unit: USD
    meaning: "Part of the balance held back and not yet payable; the holding's reserved_balance is its running sum."

parameter_schema:
  payout_schedule_rule: When scheduled payouts are initiated (enum string).
  business_day_calendar: Business-day calendar for every business-day count of this category (enum string).
  payout_cutoff_time_et: Eastern-time cutoff (HH:MM) on a payout day for funds released that day to be included.
  min_payout_amount: Smallest available amount that is paid out; a smaller amount rolls to the next payout, USD.
  max_payout_per_disbursement: Largest amount sent in one scheduled payout; the excess rolls to the next payout, USD.
  bank_arrival_business_days: Business days for a scheduled payout to reach the bank after initiation (integer).
  on_demand_payout_allowed: Whether the seller may request an extra standard payout outside the schedule (boolean).
  on_demand_interval_hours: Minimum hours between two on-demand payouts; not_applicable without on-demand payouts.
  sale_credit_basis: Amount credited to the balance for a sold order (enum string).
  delivery_reserve_days: Calendar days after an order's delivered_date for which its sale credit stays reserved (integer).
  no_scan_release_days_after_promised: Calendar days after the promised delivery date at which a sale credit with no delivered scan is released (integer).
  reserve_release_basis: Anchor of the delivery reserve release date (enum string).
  high_value_order_threshold: Sale credit (USD) at or above which an extra high-value hold is added to the delivery reserve.
  high_value_extra_hold_days: Extra calendar days added to the delivery reserve of a high-value sale (integer).
  rolling_reserve_rate: Share of each sale credit additionally held as a rolling reserve (decimal fraction).
  rolling_reserve_hold_days: Calendar days a rolling reserve is held from the sale credit date; not_applicable when the rate is zero.
  instant_payout_available: Whether instant payouts to an eligible debit card are offered (boolean).
  instant_payout_fee_rate: Instant payout fee as a share of the amount paid out (decimal fraction); not_applicable without instant payouts.
  instant_payout_min_fee: Minimum instant payout fee per payout, USD; not_applicable without instant payouts.
  instant_payout_daily_limit: Maximum total instant payouts per calendar day, USD; not_applicable without instant payouts.
  instant_payout_max_per_day: Maximum number of instant payouts per calendar day; not_applicable without instant payouts.
  instant_payout_arrival: Arrival time of an instant payout (enum string); not_applicable without instant payouts.
  refund_debit_source: Where buyer refunds funded by the seller are debited (enum string).
  chargeback_liability_follows_order_liability: Whether a chargeback is debited to the seller only when the order's liability party is the seller (boolean).
  chargeback_debit_timing: When a seller-liable chargeback is debited (enum string).
  chargeback_fee: Fee per seller-liable chargeback, USD.
  chargeback_fee_refunded_on_win: Whether the chargeback fee is returned when the seller wins the dispute (boolean).
  chargeback_response_days: Calendar days after the chargeback debit within which the seller may submit dispute evidence (integer).
  chargeback_disputes_per_case: Maximum dispute submissions per chargeback case (integer).
  chargeback_win_reversal_timing: When the debit of a won chargeback is reversed (enum string).
  negative_balance_card_charge_days: Calendar days a balance may stay negative before the card on file is charged for the deficit (integer).
  negative_balance_card_retry_count: Card charge attempts made for one negative balance before it is referred for collection (integer).
  negative_balance_collection_days: Calendar days of continuous negative balance after which the deficit is referred for collection (integer).
  bank_change_payout_hold_days: Calendar days after a bank account change during which no payout is sent (integer).
  bank_name_match_required: Whether the bank account holder name must match the profile or business name (boolean).
  disbursement_return_resend_business_days: Business days after updated bank details are verified by which a returned payout is re-sent (integer).
  reverification_interval_months: Months between mandatory identity and bank re-verifications (integer).
  reverification_grace_days: Calendar days after a re-verification falls due before payouts are held (integer).
  suspension_fund_hold_days: Calendar days the balance is held after the seller's selling privileges are suspended, unless reinstated earlier (integer).
  suspension_hold_release_basis: How a suspension hold ends (enum string).
  closure_final_hold_days: Calendar days the balance is held after a closure request before final payout (integer).
  closure_release_basis: What is paid out at the end of the final hold (enum string).
  min_account_age_days: Minimum age of the seller profile, counted from account_opened_date, to hold the plan (integer).
  eligible_standing_levels: Seller performance standing levels allowed to hold the plan (list of official level names).
  min_trailing_12m_sales: Minimum sale credits over the trailing 12 months to hold the plan, USD.
  standing_fallback_plan: Plan the account is moved to at a plan review when it no longer qualifies (official plan name); not_applicable for plans open to every level.
  plan_review_cycle: When payout plan qualification is reviewed (enum string).
  plan_change_effective: When a payout plan change takes effect (enum string).

