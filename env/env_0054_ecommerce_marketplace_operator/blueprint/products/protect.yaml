events:
  - type: protect_purchase
    target: protect_plans
    mutation: create
    meaning: "A buyer buys a protection plan for an item ordered on Northloop."
    grain: "one row per plan"
    fields:
      plan_id: "Plan reference."
      customer_id: "The buyer."
      variant_name: "Plan bought."
      covered_order_id: "Order of the covered item."
      purchase_date: "Date bought."
      plan_price: "Price paid."
      covered_item_price: "Unit price of the covered item."
    triggers:
      - event: protect:protect_premium_charge
        map: {amount: plan_price}
  - type: protect_premium_charge
    target: protect_events
    meaning: "The plan price is charged."
    grain: "one row per plan"
    distinguish_by: [event_date]
    fields:
      plan_id: "Plan."
      customer_id: "The buyer."
      event_date: "Date charged."
      amount: "Plan price, positive."
    account: plan_premium
    direction: in
    triggers: []
  - type: protect_activate
    target: protect_plans
    mutation: {transition: {from: purchased, to: active}}
    meaning: "Coverage begins on delivery of the covered item."
    grain: "one row per transaction"
    fields:
      coverage_start_date: "First day of coverage."
      coverage_end_date: "Last day of coverage."
    triggers: []
  - type: protect_claim_settlement
    target: protect_events
    meaning: "An approved claim is settled by repair, replacement or reimbursement."
    grain: "one row per claim"
    distinguish_by: [claim_id]
    fields:
      plan_id: "Plan."
      customer_id: "The buyer."
      event_date: "Date settled."
      claim_id: "Claim settled."
      resolution_type: "repair, replacement or reimbursement."
      amount: "Value of the settlement, positive."
    account: claim_benefits
    direction: in
    triggers:
      - event: protect:protect_fulfill
        when: {resolution_type: [replacement, reimbursement]}
        map: {}
  - type: protect_settlement_reversal
    target: protect_events
    meaning: "A paid settlement is reversed."
    grain: "one row per claim reversed"
    distinguish_by: [claim_id]
    fields:
      plan_id: "Plan."
      customer_id: "The buyer."
      event_date: "Date reversed."
      claim_id: "Claim reversed."
      reversal_reason: "Why."
      amount: "Value reversed, positive."
    account: claim_benefits
    direction: out
    triggers: []
  - type: protect_service_fee_charge
    target: protect_events
    meaning: "The service fee of a claim is collected."
    grain: "one row per claim"
    distinguish_by: [claim_id]
    fields:
      plan_id: "Plan."
      customer_id: "The buyer."
      event_date: "Date collected."
      claim_id: "Claim."
      amount: "Service fee, positive."
    account: service_fees
    direction: in
    triggers: []
  - type: protect_service_fee_refund
    target: protect_events
    meaning: "A collected service fee is refunded after a denial."
    grain: "one row per claim"
    distinguish_by: [claim_id]
    fields:
      plan_id: "Plan."
      customer_id: "The buyer."
      event_date: "Date refunded."
      claim_id: "Claim."
      amount: "Fee refunded, positive."
    account: service_fees
    direction: out
    triggers: []
  - type: protect_cancel
    target: protect_plans
    mutation: {transition: [{from: purchased, to: cancelled}, {from: active, to: cancelled}]}
    meaning: "The buyer cancels the plan."
    grain: "one row per transaction"
    fields:
      cancel_date: "Date cancelled."
    triggers:
      - event: protect:protect_cancel_refund
        map: {}
  - type: protect_cancel_refund
    target: protect_events
    meaning: "The refund due on a cancelled plan."
    grain: "one row per plan"
    distinguish_by: [refund_basis]
    fields:
      plan_id: "Plan."
      customer_id: "The buyer."
      event_date: "Date refunded."
      refund_basis: "full or prorated."
      admin_fee_amount: "Administrative fee withheld."
      unused_days: "Coverage days not yet used."
      term_days: "Total coverage days."
      amount: "Refund, positive (0.00 when nothing is due)."
    account: plan_premium
    direction: out
    triggers: []
  - type: protect_expire
    target: protect_plans
    mutation: {transition: {from: active, to: expired}}
    meaning: "Coverage ends at the term end."
    grain: "one row per transaction"
    fields:
      end_date: "Date ended."
    triggers: []
  - type: protect_fulfill
    target: protect_plans
    mutation: {transition: {from: active, to: fulfilled}}
    meaning: "The plan is fulfilled by a replacement, a reimbursement or reaching the aggregate limit."
    grain: "one row per transaction"
    fields:
      end_date: "Date fulfilled."
    triggers: []
  - type: protect_transfer
    target: protect_plans
    mutation: update
    meaning: "The plan is transferred to the person the covered item was given to."
    grain: "one row per transaction"
    fields:
      customer_id: "The new plan holder."
    triggers: []

measures:
  - id: protect_msr_accident_claims_12m
    window: "Rolling 12 months ending on the incident date of the new claim."
    measure: "Count of protect_claims rows of the plan with claim_status approved or fulfilled and failure_type in accidental_damage, liquid_damage or cracked_screen whose incident_date falls in the window."
  - id: protect_msr_repairs_same_failure
    window: "Lifetime of the plan."
    measure: "Count of protect_claim_settlement rows of the plan with resolution_type repair whose claim has the same failure_type as the new claim."

policies:
  - id: protect_agg_multi_holding
    subject: [protect_purchase]
    rule: >-
      A buyer may hold any number of protection plans, but each ordered item can be covered by only one plan; a second
      plan on the same covered order is refused.
    eligibility: []
    params: {max_per_customer: null}
  - id: protect_agg_per_item_limit
    subject: [protect_claim_settlement]
    rule: >-
      Plans are never pooled: each plan's aggregate limit is its own covered item price, and settlements on one plan
      never reduce another plan's limit even when both cover items from the same order history.
    eligibility: []
  - id: protect_purchase_terms
    subject: [protect_purchase, protect_premium_charge]
    rule: >-
      A plan may be bought only for an item whose category is in the plan's eligible categories, whose condition is
      eligible, whose unit price lies between the minimum and maximum eligible price, and only within the purchase
      window counted in calendar days from the item's order date. The plan price is the price of the item's price band
      in the plan price ladder, charged once at purchase.
    eligibility: []
  - id: protect_coverage_period
    subject: [protect_activate, protect_expire]
    rule: >-
      Coverage starts on the covered item's delivered date and ends on the coverage start plus the term months less one
      day. The plan expires the day after the coverage end date unless it was fulfilled or cancelled earlier.
    eligibility: []
  - id: protect_claim_terms
    subject: [protect_claim_settlement, protect_service_fee_charge]
    rule: >-
      A claim is covered only for a failure type listed in the plan's covered failure types, for an incident inside the
      coverage period after the applicable waiting days, filed within the claim filing window counted from the incident
      date and, for in-term incidents, no later than the grace days after coverage end. Mechanical failures inside the
      manufacturer's warranty go to the manufacturer first when manufacturer_warranty_first is true. Theft, loss,
      cosmetic damage, pre-existing conditions and commercial use are never covered. Accident claims are limited to the
      plan's accident claims per rolling 12 months. Only one claim may be open at a time. A claim of a service-fee
      failure type is charged the service fee of the item's price band before it is settled.
    eligibility: []
    measures: [protect_msr_accident_claims_12m]
    params:
      per_tier:
        "Protect 1-Year Extended Warranty": {accident_limit: "=accident_claims_per_12m"}
        "Protect 2-Year Extended Warranty": {accident_limit: "=accident_claims_per_12m"}
        "Protect 3-Year Extended Warranty": {accident_limit: "=accident_claims_per_12m"}
        "Protect 2-Year Accident Protection": {accident_limit: "=accident_claims_per_12m"}
        "Protect 3-Year Accident Protection": {accident_limit: "=accident_claims_per_12m"}
        "Protect 4-Year Accident Protection": {accident_limit: "=accident_claims_per_12m"}
  - id: protect_resolution
    subject: [protect_claim_settlement, protect_fulfill]
    rule: >-
      An approved claim is repaired unless the estimated repair exceeds the replace threshold rate times the covered
      item price, or the same failure has already been repaired the lemon repair count of times; then it is replaced
      with an item of like kind and quality, or reimbursed by Northloop gift card when no replacement is available. One
      claim never pays more than the covered item price less settlements already paid. A replacement or reimbursement,
      or settlements reaching the covered item price, fulfil the plan.
    eligibility: []
    measures: [protect_msr_repairs_same_failure]
  - id: protect_settlement_and_fee_reversals
    subject: [protect_settlement_reversal, protect_service_fee_refund]
    rule: >-
      A paid settlement is reversed only for a reason in settlement_reversal_reasons. A collected service fee is
      refunded when the claim is denied and service_fee_refund_on_denial is true; a fee on a settled claim is never
      refunded.
    eligibility: []
  - id: protect_cancellation
    subject: [protect_cancel, protect_cancel_refund]
    rule: >-
      Cancelling is the buyer's own decision and is confirmed by the buyer. A plan cancelled within the free cancel days
      counted in calendar days from purchase_date, with no settlement paid, is refunded in full. Any later cancellation
      is refunded the plan price times the unused coverage days over the term days, less the administrative fee (the
      admin rate times the plan price, capped at the admin fee cap) and less settlements already paid; a negative
      result is a refund of 0.00. A plan cancelled before coverage starts is always refunded in full.
    eligibility: []
    formula:
      prorated_refund: "max(round(plan_price * unused_days / term_days - min(plan_price * cancel_admin_fee_rate, cancel_admin_fee_cap) - claims_paid_total, 2), 0)"
  - id: protect_transfer_terms
    subject: [protect_transfer]
    rule: >-
      A plan may be transferred, when transferable_on_gift is true, only to the recipient of an order marked as a gift;
      the coverage period and the claims already paid carry over unchanged.
    eligibility: []
