
# Northloop Protect — protection plans buyers add to an eligible item they bought on Northloop
# (administered by Northloop's protection plan administrator).
category: protect
display_name: Northloop Protect Plans

binding:
  holding_table: protect_plans
  event_tables: [protect_events]
  intake_tables: [protect_claims]
  status_field: status
  variant_field: variant_name
  quantity_fields: {claims_paid_total: claim_benefits}

lifecycle:
  states: [purchased, active, fulfilled, expired, cancelled]
  transitions:
    - {from: purchased, to: active, by: system, means: "The covered item is delivered and coverage begins."}
    - {from: purchased, to: cancelled, by: user, means: "The buyer cancels the plan before coverage begins."}
    - {from: active, to: cancelled, by: user, means: "The buyer cancels the plan during coverage."}
    - {from: active, to: fulfilled, by: system, means: "A replacement or reimbursement is provided, or paid claims reach the aggregate limit."}
    - {from: active, to: expired, by: system, means: "The coverage end date passes."}

accounts:
  - key: plan_premium
    unit: USD
    meaning: "Plan price paid net of cancellation refunds."
  - key: claim_benefits
    unit: USD
    meaning: "Value of claim settlements paid under the plan net of reversals; the holding's claims_paid_total is its running sum."
  - key: service_fees
    unit: USD
    meaning: "Claim service fees paid by the buyer net of service fee refunds."

parameter_schema:
  term_months: Coverage term in months (integer).
  coverage_start_basis: Event that starts coverage (enum string).
  coverage_end_basis: How the coverage end date is set (enum string).
  covered_failure_types: Failure types the plan covers (list of failure_type values).
  theft_loss_covered: Whether theft or loss is covered (boolean).
  cosmetic_damage_covered: Whether cosmetic damage that does not affect function is covered (boolean).
  battery_failure_covered: Whether a battery that no longer holds a charge is covered (boolean).
  pre_existing_conditions_covered: Whether failures existing before coverage start are covered (boolean).
  commercial_use_covered: Whether items used commercially are covered (boolean).
  mechanical_waiting_days: Calendar days after coverage start before a mechanical_failure or power_surge incident is covered (integer).
  accident_waiting_days: Calendar days after coverage start before an accident incident is covered (integer); not_applicable without accident cover.
  manufacturer_warranty_first: Whether mechanical failures within the manufacturer's warranty period are sent to the manufacturer first (boolean).
  plan_price_ladder: Plan price by covered item price band, USD (mapping band -> price).
  premium_billing: How the plan price is paid (enum string).
  purchase_window_days: Calendar days after the covered item's order date within which the plan may be bought (integer).
  min_item_price_eligible: Lowest covered item price eligible, USD.
  max_item_price_eligible: Highest covered item price eligible, USD.
  eligible_item_categories: Item categories the plan can cover (list of item_category values).
  eligible_item_conditions: Item conditions the plan can cover (list of item_condition values).
  service_fee_ladder: Service fee per approved claim by covered item price band, USD (mapping band -> fee).
  service_fee_failure_types: Failure types whose claims carry the service fee (list).
  service_fee_refund_on_denial: Whether a collected service fee is refunded when the claim is denied (boolean).
  accident_claims_per_12m: Approved accident claims allowed in any rolling 12 months; not_applicable without accident cover.
  aggregate_limit_basis: Total claim settlements allowed over the plan (enum string).
  per_claim_limit_basis: Most one claim may pay (enum string).
  replacement_ends_plan: Whether a replacement or reimbursement fulfils and ends the plan (boolean).
  repair_cost_replace_threshold_rate: Share of the covered item price above which an estimated repair is replaced instead (decimal fraction).
  lemon_repair_count: Completed repairs for the same failure after which the next qualifying claim is replaced (integer).
  replacement_value_basis: How a replacement is valued (enum string).
  reimbursement_method: How a reimbursement is paid when no replacement is available (enum string).
  in_home_service_categories: Item categories repaired in the home (list of item_category values).
  food_loss_cap: Most reimbursed for food spoilage after a covered refrigerator failure, USD.
  shipping_for_repair_paid: Whether shipping to and from repair is paid by the plan (boolean).
  claim_filing_window_days: Calendar days after the incident date within which a claim must be filed (integer).
  claim_after_expiry_grace_days: Calendar days after the coverage end date during which an in-term incident may still be filed (integer).
  claim_decision_business_days: Business days within which a claim is decided (integer).
  max_open_claims: Claims that may be open at once on a plan (integer).
  evidence_required_failure_types: Failure types whose claims need photos of the damage (list).
  free_cancel_days: Calendar days after plan purchase within which a cancellation with no claim paid is refunded in full (integer).
  prorated_refund_after_window: Whether a later cancellation earns a prorated refund (boolean).
  refund_proration_basis: How a prorated refund is computed (enum string).
  cancel_admin_fee_rate: Administrative fee on a prorated cancellation, share of the plan price (decimal fraction).
  cancel_admin_fee_cap: Most charged as administrative fee on a cancellation, USD.
  claims_deducted_from_refund: Whether claim settlements paid are deducted from a cancellation refund (boolean).
  refund_destination: Where plan refunds are sent (enum string).
  transferable_on_gift: Whether the plan may be transferred to the person the covered item was given to (boolean).
  settlement_reversal_reasons: Reasons a paid settlement is reversed (list of reversal_reason values).
  coverage_territory: Where incidents are covered (enum string).

variants:
