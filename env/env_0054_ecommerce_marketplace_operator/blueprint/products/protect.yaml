      term_months: 12
      coverage_start_basis: covered_item_delivered_date
      coverage_end_basis: coverage_start_plus_term_months_minus_one_day
      covered_failure_types: [mechanical_failure, power_surge]
      theft_loss_covered: false
      cosmetic_damage_covered: false
      battery_failure_covered: false
      pre_existing_conditions_covered: false
      commercial_use_covered: false
      mechanical_waiting_days: 30
      accident_waiting_days: not_applicable
      manufacturer_warranty_first: true
      plan_price_ladder: {10.00-49.99: 3.99, 50.00-99.99: 6.99, 100.00-199.99: 11.99, 200.00-499.99: 24.99, 500.00-999.99: 49.99, 1000.00-5000.00: 89.99}
      premium_billing: single_upfront_payment
      purchase_window_days: 30
      min_item_price_eligible: 10.0
      max_item_price_eligible: 5000.0
      eligible_item_categories: [electronics, computers, home_kitchen, large_appliances, furniture]
      eligible_item_conditions: [new, renewed]
      service_fee_ladder: {10.00-5000.00: 0.0}
      service_fee_failure_types: []
      service_fee_refund_on_denial: true
      accident_claims_per_12m: not_applicable
      aggregate_limit_basis: covered_item_price
      per_claim_limit_basis: covered_item_price_less_settlements_paid
      replacement_ends_plan: true
      repair_cost_replace_threshold_rate: 0.8
      lemon_repair_count: 3
      replacement_value_basis: like_kind_and_quality_up_to_covered_item_price
      reimbursement_method: northloop_gift_card
      in_home_service_categories: [large_appliances, furniture]
      food_loss_cap: 250.0
      shipping_for_repair_paid: true
      claim_filing_window_days: 30
      claim_after_expiry_grace_days: 30
      claim_decision_business_days: 3
      max_open_claims: 1
      evidence_required_failure_types: []
      free_cancel_days: 30
      prorated_refund_after_window: true
      refund_proration_basis: unused_days_over_term_days
      cancel_admin_fee_rate: 0.1
      cancel_admin_fee_cap: 25.0
      claims_deducted_from_refund: true
      refund_destination: original_payment_method
      transferable_on_gift: true
      settlement_reversal_reasons: [voided_gift_card, duplicate_payment]
      coverage_territory: fifty_us_states_and_dc
