
# Selling Plans — the seller's subscription contract with the Northloop marketplace and the seller fees it bills.
category: selling
display_name: Selling Plans

binding:
  holding_table: selling_plans
  event_tables: [selling_fees]
  intake_tables: [selling_fee_disputes]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_verification, active, restricted, cancel_scheduled, closed]
  transitions:
    - {from: pending_verification, to: active, by: system, means: "The seller's identity, tax and bank details pass verification and selling starts."}
    - {from: pending_verification, to: closed, by: system, means: "Verification is not completed within the verification deadline and the application lapses."}
    - {from: active, to: restricted, by: system, means: "Seller fees remain unpaid past the restriction threshold; new listings are blocked."}
    - {from: restricted, to: active, by: agent, means: "The past-due amount is cleared and the restriction is lifted."}
    - {from: active, to: cancel_scheduled, by: user, means: "The seller schedules cancellation of the store subscription for the end of the billing period or term."}
    - {from: cancel_scheduled, to: active, by: user, means: "The seller withdraws a scheduled cancellation before it takes effect."}
    - {from: cancel_scheduled, to: closed, by: system, means: "The scheduled cancellation date is reached."}
    - {from: active, to: closed, by: user, means: "The seller closes the plan immediately (Individual plan, or an annual term ended early with an early termination fee)."}
    - {from: restricted, to: closed, by: system, means: "Fees remain unpaid past the closure threshold and the selling account is closed."}

accounts:
  - key: net_fees_billed
    unit: USD
    meaning: "Seller fees billed on the plan net of fee credits: subscription, insertion, final value and early termination fees in; fee credits out."

parameter_schema:
  billing_terms_offered: Subscription billing terms the plan can be held on (list of billing_term values; none = no subscription).
  monthly_term_fee: Subscription fee per month on the monthly billing term, USD; not_offered when the term is not offered.
  annual_term_monthly_fee: Subscription fee per month on the annual billing term (billed monthly, committed for the term), USD; not_offered when the term is not offered.
  annual_term_months: Length of an annual term in months; not_applicable without an annual term.
  annual_auto_renew: Whether an annual term renews automatically for another annual term at term end (boolean; not_applicable without an annual term).
  renewal_notice_days: Calendar days before an annual term ends by which the renewal reminder is sent; not_applicable without an annual term.
  subscription_bill_day_rule: Day of month subscription fees are billed (enum string).
  first_period_charge: How the first subscription period is charged on activation (enum string).
  zero_insertion_listings_per_month: Listings (new or renewed) per calendar month that carry no insertion fee (integer).
  insertion_fee_after_allowance: Insertion fee per listing beyond the monthly zero-insertion allowance, USD.
  listing_duration_days: Days a fixed-price listing runs before it renews automatically; each renewal counts as a new listing for the allowance (integer).
  fvf_rate_most_categories: Variable final value fee rate for the most_categories fee group (decimal fraction).
  fvf_rate_electronics_computers: Variable final value fee rate for the electronics_computers fee group (decimal fraction).
  fvf_rate_apparel_shoes: Variable final value fee rate for the apparel_shoes fee group (decimal fraction).
  fvf_rate_large_items: Variable final value fee rate for the large_items fee group (decimal fraction).
  fvf_category_map: Mapping of order item_category to final value fee group (mapping).
  fvf_basis: Amount the variable final value fee is computed on (enum string).
  fvf_threshold_per_order: Portion of the fee basis (USD) charged at the fee group rate; the excess is charged at the above-threshold rate.
  fvf_rate_above_threshold: Variable final value fee rate on the portion of the fee basis above the threshold (decimal fraction).
  per_order_fee_low: Fixed per-order fee when the order total is at or below the breakpoint, USD.
  per_order_fee_high: Fixed per-order fee when the order total is above the breakpoint, USD.
  per_order_fee_breakpoint: Fee basis (USD) separating the low and high per-order fee.
  top_rated_fvf_discount_rate: Discount on the variable final value fee for sellers at a discount standing level on the order date (decimal fraction).
  discount_standing_levels: Seller performance standing levels that earn the final value fee discount (list of official level names).
  top_rated_discount_max_handling_business_days: Maximum business days between order date and shipped date for an order to earn the standing discount (integer).
  below_standard_surcharge_rate: Additional final value fee, as a share of the fee basis, charged while the seller is at a surcharge standing level on the order date (decimal fraction).
  surcharge_standing_levels: Seller performance standing levels that pay the below-standard surcharge (list of official level names).
  discount_stacking_rule: Which fee components the standing discount reduces (enum string).
  refund_admin_fee_rate: Refund administration fee withheld from a variable final value fee credit, as a share of that credit (decimal fraction).
  refund_admin_fee_cap: Maximum refund administration fee per credited order, USD.
  partial_refund_credit_basis: How the variable fee credit is sized on a partial refund (enum string).
  per_order_fee_credit_on_full_refund: Whether the per-order fee is credited when the whole order is refunded (boolean).
  refund_credit_window_days: Calendar days after the order date within which a refund earns a final value fee credit (integer).
  cancellation_credit_admin_fee_waived: Whether the refund administration fee is waived when the order is cancelled before shipment (boolean).
  fee_dispute_window_days: Calendar days after a fee's event_date within which the seller may dispute it (integer).
  fee_disputes_per_fee: Maximum disputes that may be filed on one fee record (integer).
  early_termination_fee_share: Share of the remaining committed monthly fees charged when an annual term is ended early (decimal fraction); not_applicable without an annual term.
  monthly_cancel_effective_point: When a cancellation of the plan takes effect on the monthly term or without a term (enum string).
  annual_cancel_effective_point: When a scheduled cancellation takes effect on the annual term (enum string).
  upgrade_proration_basis: How the upgrade charge for the rest of the current billing period is prorated (enum string).
  downgrade_effective_point: When a move to a lower plan or to a cheaper term takes effect (enum string).
  annual_downgrade_mid_term_allowed: Whether an annual-term plan may move to a lower plan before its term ends (boolean; not_applicable without an annual term).
  store_name_required: Whether the plan requires a store name (boolean).
  verification_deadline_days: Calendar days after the plan is opened within which verification must be completed (integer).
  restriction_after_past_due_days: Calendar days a fee balance may stay past due on the seller's payments account before the plan is restricted (integer).
  closure_after_restriction_days: Calendar days a plan may stay restricted with fees still past due before it is closed (integer).
  fee_settlement_method: How billed seller fees are collected (enum string).
  min_trailing_12m_sales: Minimum gross sales in the trailing 12 months (USD) to open or move to the plan.

