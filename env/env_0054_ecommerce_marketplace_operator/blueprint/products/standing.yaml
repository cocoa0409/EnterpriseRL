      probation_after_reinstatement_days: 90
      appeal_window_days: 30
      max_appeals_per_suspension: 3
      appeal_decision_business_days: 2
      plan_of_action_required_types: [listing_policy, restricted_product, product_authenticity, review_manipulation]
      error_appeal_reverses_points: true
      poa_reinstatement_keeps_points: true
      feedback_removal_requests_per_month: 5
      feedback_dispute_window_days: 90
      feedback_removable_reasons: [review_about_product_not_seller, contains_personal_or_obscene_content, fbn_fulfillment_experience, buyer_retracted]
      product_review_removable_reasons: [conflict_of_interest, incentivized_review, contains_personal_or_obscene_content, review_about_seller_not_product]
