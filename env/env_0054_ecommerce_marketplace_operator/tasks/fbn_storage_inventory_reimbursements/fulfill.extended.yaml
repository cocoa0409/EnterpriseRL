    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: store_lookback_bonus
    effect: parameter
    decides: store_bonus_months
    bindings:
    - store_plan
    - store_age_months
    - store_bonus_months
    ladder:
    - when: >-
        the seller's selling plan is Anchor Store or Enterprise Store AND it was opened at least the store tenure
