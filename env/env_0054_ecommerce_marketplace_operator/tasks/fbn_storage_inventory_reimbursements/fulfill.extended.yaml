  rule: >-
    This policy fixes the units the support desk approves when it decides a seller's open warehouse-loss case, the
    reimbursement case whose loss kind is lost in warehouse; the approved units become the unit count of the case
    and the reimbursement run pays them afterwards. The units approved on a warehouse-loss case are fixed only after
    the units claimed on that case equal the claimable lost units of its SKU. The units approved on a warehouse-loss
    case are the units claimed on the case, less the shrinkage allowance after it is limited to the allowance cap,
    less the verification holdback, less the compliance holdback, each deducted from the units claimed in that order;
    a negative remainder counts as zero, and the remainder is then capped at the approval limit plus the limit uplift.
    For a warehouse-loss approval, a record is dated inside the desk review span or the case-history span when fewer
    than that span's number of whole months have passed from its date to the handling date, a whole month passing
    on the same day number of a later month. The shrinkage allowance is the standard shrinkage share of the units
    of the case's SKU on inbound receipts dated inside the desk review span, rounded down to a whole unit. The allowance
    cap is the standard allowance cap. The verification holdback is the standard verification holdback in units.
    The compliance holdback is the standard compliance holdback in units. The approval limit is the standard approval
    limit, and the limit uplift is none. The shrinkage allowance is waived for an enrollment in FBN Premier Program
    or FBN Enterprise Program whose seller stands at Top Rated Level or Preferred Partner Level; for an enrollment
    in FBN Core Program, FBN Growth Program or FBN Scale Program whose seller stands at Above Standard Level, Top
    Rated Level or Preferred Partner Level it is the per-incident allowance times the number of lost-in-warehouse
    inventory adjustments of the case's SKU dated inside the desk review span; for every other enrollment it is
    the standard shrinkage share of the SKU's received units described above. The allowance cap is the long-tenure
    allowance cap for an enrollment active at least the long tenure in whole months since its activation date, the
    mid-tenure allowance cap for an enrollment active at least the mid tenure but fewer than the long tenure in
    whole months, and the standard allowance cap for an enrollment active fewer than the mid tenure in whole months.
    The verification holdback is the holdback share of the units claimed, rounded down to a whole unit, for a seller
    with at least the denied-case trigger of FBN reimbursement cases denied among the cases opened inside the case-history
    span; it is waived for a seller with no denied reimbursement case and at least the approved-case trigger of
    approved FBN reimbursement cases among the cases opened inside that span; for every other seller it is the standard
    verification holdback in units. The compliance holdback is waived for a seller with no active violation points
    whose standing status is good standing, is the high compliance holdback for a seller with at least the violation-point
    trigger of active violation points, and is the standard compliance holdback for every other seller. The approval
    limit is the large-store approval limit for a seller whose selling plan is Anchor Store or Enterprise Store,
    the mid-store approval limit for a seller whose selling plan is Basic Store or Premium Store, and the standard
    approval limit for any other selling plan. The limit uplift is the long-wait uplift for a case opened at least
    the long-wait days before the handling date, the short-wait uplift for a case opened at least the short-wait
    days but fewer than the long-wait days before it, and no uplift for a case opened fewer than the short-wait
    days before it.
  prerequisite:
  - problem: fulfill_ext_lost_claim_units
    kind: value_input
    gate: claimed_units
    form: state
    policy_source: >-
      The units approved on a warehouse-loss case are fixed only after the units claimed on that case equal the
      claimable lost units of its SKU.
    condition: >-
      The open lost-in-warehouse case of the SKU carries, as its units claimed, the claimable lost units that the
      claim-correction rule computes for that SKU at handling time.
    resolved_by: amend_lost_inventory_claim_06dd83f3
    effect: >-
      claimed_units changes from the units the seller first entered to the claimable lost units, and every deduction
      and the final approval are taken from that corrected figure.
  cross_category:
  - category: standing
    as: branch
    reads:
    - variant_name
    - violation_points
    - status
    note: >-
      The shrinkage allowance method and the compliance holdback are decided from the seller's standing level, active
      violation points and standing status.
  - category: selling
    as: branch
    reads:
    - variant_name
