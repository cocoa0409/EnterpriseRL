events:
  - type: fulfill_enroll
    target: fulfill_enrollments
    mutation: create
    meaning: "A seller applies to Fulfilled by Northloop."
    grain: "one row per enrollment"
    fields:
      enrollment_id: "Enrollment reference."
      customer_id: "The seller."
      variant_name: "Program the enrollment starts in."
      enrolled_date: "Date applied."
    triggers: []
  - type: fulfill_activate
    target: fulfill_enrollments
    mutation: {transition: {from: pending, to: active}}
    meaning: "The enrollment is approved."
    grain: "one row per transaction"
    fields:
      activated_date: "Date approved."
    triggers: []
  - type: fulfill_program_change
    target: fulfill_enrollments
    mutation: update
    meaning: "A quarterly review places the enrollment in another program."
    grain: "one row per transaction"
    fields:
      variant_name: "New program."
      last_review_date: "Date of the review."
    triggers: []
  - type: fulfill_inbound_receipt
    target: fulfill_events
    meaning: "Units of one SKU from an inbound shipment are received into a fulfillment center."
    grain: "one row per inbound shipment per SKU"
    distinguish_by: [shipment_id, sku]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date receiving closed for the SKU on the shipment."
      shipment_id: "Inbound shipment number."
      sku: "Seller SKU."
      size_tier: "Size tier of the SKU."
      units: "Units received."
      units_expected: "Units declared on the shipment plan."
      unit_cost: "Declared unit cost on the shipment plan."
    account: inventory_units
    direction: in
    triggers: []
  - type: fulfill_inbound_placement_fee
    target: fulfill_events
    meaning: "The inbound placement fee of a shipment."
    grain: "one row per inbound shipment"
    distinguish_by: [shipment_id]
    fields:
      enrollment_id: "Enrollment."
      customer_id: "The seller."
      event_date: "Date billed."
