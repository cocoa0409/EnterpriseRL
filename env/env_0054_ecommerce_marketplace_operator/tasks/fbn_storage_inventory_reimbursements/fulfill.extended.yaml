    Store and was opened at least the store tenure threshold in whole months before the handling date, the small
    store bonus when the selling plan is Basic Store or Premium Store opened at least that threshold before, and
    no bonus for any other selling plan or a plan opened more recently. The warehouse-loss search hold is a span
    of the small-item search hold months when the latest inbound receipt of the SKU records the small standard size
    tier, of the oversize search hold months when it records the large bulky or extra large size tier, and of the
    standard search hold months when it records the large standard size tier. The warehouse-loss claim ceiling is
    waived for a seller whose performance standing level is Top Rated Level or Preferred Partner Level; for a seller
