      Level it is the per-incident allowance times the number of lost-in-warehouse inventory adjustments of the
      case's SKU dated inside the desk review span; for every other enrollment it is the standard shrinkage share
      of the SKU's received units described above. For a warehouse-loss approval, a record is dated inside the desk
      review span or the case-history span when fewer than that span's number of whole months have passed from its
