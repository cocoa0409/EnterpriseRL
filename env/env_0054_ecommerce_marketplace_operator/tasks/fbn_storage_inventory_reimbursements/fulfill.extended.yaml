- id: fulfill_ext_shortage_claim_units
  base_policy_refs:
  - fulfill_reimbursement_terms
  overwrite:
  - base_policy: fulfill_reimbursement_terms
    superseded_clause: >-
      An inbound shortage claim (units expected less units received on a shipment line) may be filed only after
      the inbound reconciliation wait and within the inbound shortage claim window, both counted in calendar days
      from the receipt date of that line.
    replaced_by: >-
      The claimable shortage of a shipment line is the netted shortage of the line, less the over-receipt carry-forward,
      less the receiving tolerance, less the units already reimbursed as inbound shortage on the same shipment and
      SKU, each deducted from the netted shortage in that order; a negative remainder counts as zero.
  trigger: state_due
  subject:
  - fulfill_reimbursement
  computes: units_claimed
  target_tool: amend_inbound_shortage_claim_fdee09ae
  params:
    same_cost_min_lines: 2
    carry_long: 12
    carry_middle: 6
    carry_none: 0
    carry_tenure: 24
    history_span: 6
    tolerance_waived: 0
    tolerance_repeat: 3
    tolerance_standard: 1
    tolerance_tenure: 24
    repeat_cases: 2
    share_large_line: 0.01
    share_small_line: 0.0
    share_standard: 0.02
    large_line: 200
    small_line: 50
  rule: >-
    This policy fixes the claimable shortage of a shipment line, the figure a seller enters as the units claimed
    when correcting their own open inbound-shortage case, the reimbursement case for units of one inbound shipment
    line that were never received. The case may be corrected only for a line whose receipt date is at least the
    inbound reconciliation wait and no more than the inbound shortage claim window before the handling date, both
    counted in calendar days from the receipt date of that line. The claimable shortage of a shipment line is the
    netted shortage of the line, less the over-receipt carry-forward, less the receiving tolerance, less the units
    already reimbursed as inbound shortage on the same shipment and SKU, each deducted from the netted shortage
    in that order; a negative remainder counts as zero. The netted shortage of the line is the units expected on
    that line less the units received on it. The over-receipt carry-forward is none. The receiving tolerance is
    the standard tolerance units plus the standard tolerance share of the units expected on the line, the share
    rounded down to a whole unit before it is added. When the shipment was sent under the minimal split placement
    option, the netted shortage is measured over the whole shipment: the units expected on all of its lines less
    the units received on all of them; when it was sent under any other placement option and the shipment carries
    at least two lines, the claimed one included, with the same declared unit cost, the netted shortage is measured
    over those same-cost lines together, so that units of a look-alike SKU received in excess offset the claimed
    line; otherwise it is measured on the line alone. For the over-receipt carry-forward, a receipt is dated inside
    the carry span when fewer than the carry span's number of whole months have passed from its receipt date to
    the handling date, a whole month passing on the same day number of a later month, and a carry span of zero months
    holds no receipt. The over-receipt carry-forward is the excess of units received over units expected on the
    SKU's other inbound lines dated inside the carry span, taken together and counted only when that excess is positive;
    the carry span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
    Program active at least the carry tenure in whole months since its activation date, the middle carry span for
    an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months for
    every other enrollment. The tolerance units are waived for a seller who opened no other inbound-shortage case
    inside the case-history span and whose enrollment has been active at least the tolerance tenure in whole months,
    are the repeat-shortage tolerance units for a seller who opened at least the repeat-case count of other inbound-shortage
    cases inside that span, and are the standard tolerance units for every other seller. Cases count toward the
    case-history span when fewer than the span's number of whole months have passed from their opening moment to
    the handling date. The tolerance share is the large-line tolerance share for a line with at least the large-line
    threshold of units expected, nothing for a line with fewer than the small-line threshold of units expected,
    and the standard tolerance share for a line in between.
  prerequisite: []
  cross_category: []
  compute:
  - claim_shipment: >-
      LATEST('fulfill_cases', 'shipment_id', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='inbound_shortage',
      case_status='submitted')
  - claim_sku: >-
      LATEST('fulfill_cases', 'sku', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='inbound_shortage',
      case_status='submitted')
  - line_expected: >-
      SUM('fulfill_events', 'units_expected', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment,
      sku=claim_sku)
  - line_received: >-
      SUM('fulfill_events', 'units', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment, sku=claim_sku)
  - line_cost: >-
      LATEST('fulfill_events', 'unit_cost', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment, sku=claim_sku)
  - split_option: >-
      LATEST('fulfill_events', 'placement_option', event_type='fulfill_inbound_placement_fee', shipment_id=claim_shipment)
  - same_cost_lines: >-
      COUNT('fulfill_events', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment, unit_cost=line_cost)
  - shipment_expected: >-
      SUM('fulfill_events', 'units_expected', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment)
  - shipment_received: SUM('fulfill_events', 'units', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment)
  - same_cost_expected: >-
      SUM('fulfill_events', 'units_expected', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment,
      unit_cost=line_cost)
  - same_cost_received: >-
      SUM('fulfill_events', 'units', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment, unit_cost=line_cost)
  - netted_shortage: >-
      (shipment_expected - shipment_received) if split_option == 'minimal_split' else ((same_cost_expected - same_cost_received)
      if (split_option != 'minimal_split' and same_cost_lines >= K('same_cost_min_lines')) else (line_expected -
      line_received))
  - carry_tenure_months: MONTHS(F('activated_date'), NOW)
  - carry_span_months: >-
      K('carry_long') if ((F('variant_name') == 'FBN Scale Program' or F('variant_name') == 'FBN Premier Program'
      or F('variant_name') == 'FBN Enterprise Program') and carry_tenure_months >= K('carry_tenure')) else (K('carry_middle')
      if ((F('variant_name') == 'FBN Core Program' or F('variant_name') == 'FBN Growth Program') and carry_tenure_months
      >= K('carry_tenure')) else K('carry_none'))
  - sku_received_in_span: >-
      SUM('fulfill_events', 'units', within_months=carry_span_months, event_type='fulfill_inbound_receipt', sku=claim_sku)
  - sku_expected_in_span: >-
      SUM('fulfill_events', 'units_expected', within_months=carry_span_months, event_type='fulfill_inbound_receipt',
      sku=claim_sku)
  - line_received_in_span: >-
      SUM('fulfill_events', 'units', within_months=carry_span_months, event_type='fulfill_inbound_receipt', shipment_id=claim_shipment,
      sku=claim_sku)
  - line_expected_in_span: >-
      SUM('fulfill_events', 'units_expected', within_months=carry_span_months, event_type='fulfill_inbound_receipt',
      shipment_id=claim_shipment, sku=claim_sku)
  - carry_forward: >-
      MX(0, (sku_received_in_span - sku_expected_in_span) - (line_received_in_span - line_expected_in_span))
  - other_shortage_cases: >-
      COUNT('fulfill_cases', within_months=K('history_span'), date_field='created_at', reimbursement_type='inbound_shortage')
      - 1
  - tolerance_units: >-
      K('tolerance_waived') if (other_shortage_cases == 0 and carry_tenure_months >= K('tolerance_tenure')) else
      (K('tolerance_repeat') if other_shortage_cases >= K('repeat_cases') else K('tolerance_standard'))
  - tolerance_line_units: >-
      SUM('fulfill_events', 'units_expected', event_type='fulfill_inbound_receipt', shipment_id=claim_shipment,
      sku=claim_sku)
  - tolerance_share: >-
      K('share_large_line') if tolerance_line_units >= K('large_line') else (K('share_small_line') if tolerance_line_units
      < K('small_line') else K('share_standard'))
  - receiving_tolerance: tolerance_units + int(line_expected * tolerance_share)
  - reimbursed_on_line: >-
      SUM('fulfill_events', 'units', event_type='fulfill_reimbursement', reimbursement_type='inbound_shortage',
      shipment_id=claim_shipment, sku=claim_sku)
  - result: MX(0, netted_shortage - carry_forward - receiving_tolerance - reimbursed_on_line)
  compute_basis:
    claim_shipment: >-
      This policy fixes the claimable shortage of a shipment line, the figure a seller enters as the units claimed
      when correcting their own open inbound-shortage case, the reimbursement case for units of one inbound shipment
      line that were never received.
    claim_sku: >-
      This policy fixes the claimable shortage of a shipment line, the figure a seller enters as the units claimed
      when correcting their own open inbound-shortage case, the reimbursement case for units of one inbound shipment
      line that were never received.
    line_expected: The netted shortage of the line is the units expected on that line less the units received on
      it.
    line_received: The netted shortage of the line is the units expected on that line less the units received on
      it.
    line_cost: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    split_option: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    same_cost_lines: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    shipment_expected: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    shipment_received: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    same_cost_expected: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    same_cost_received: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    netted_shortage: >-
      When the shipment was sent under the minimal split placement option, the netted shortage is measured over
      the whole shipment: the units expected on all of its lines less the units received on all of them; when it
      was sent under any other placement option and the shipment carries at least two lines, the claimed one included,
      with the same declared unit cost, the netted shortage is measured over those same-cost lines together, so
      that units of a look-alike SKU received in excess offset the claimed line; otherwise it is measured on the
      line alone.
    carry_tenure_months: >-
      The over-receipt carry-forward is the excess of units received over units expected on the SKU's other inbound
      lines dated inside the carry span, taken together and counted only when that excess is positive; the carry
      span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
      Program active at least the carry tenure in whole months since its activation date, the middle carry span
      for an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months
      for every other enrollment.
    carry_span_months: >-
      The over-receipt carry-forward is the excess of units received over units expected on the SKU's other inbound
      lines dated inside the carry span, taken together and counted only when that excess is positive; the carry
      span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
      Program active at least the carry tenure in whole months since its activation date, the middle carry span
      for an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months
      for every other enrollment.
    sku_received_in_span: >-
      The over-receipt carry-forward is the excess of units received over units expected on the SKU's other inbound
      lines dated inside the carry span, taken together and counted only when that excess is positive; the carry
      span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
      Program active at least the carry tenure in whole months since its activation date, the middle carry span
      for an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months
      for every other enrollment. For the over-receipt carry-forward, a receipt is dated inside the carry span when
      fewer than the carry span's number of whole months have passed from its receipt date to the handling date,
      a whole month passing on the same day number of a later month, and a carry span of zero months holds no receipt.
    sku_expected_in_span: >-
      The over-receipt carry-forward is the excess of units received over units expected on the SKU's other inbound
      lines dated inside the carry span, taken together and counted only when that excess is positive; the carry
      span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
      Program active at least the carry tenure in whole months since its activation date, the middle carry span
      for an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months
      for every other enrollment. For the over-receipt carry-forward, a receipt is dated inside the carry span when
      fewer than the carry span's number of whole months have passed from its receipt date to the handling date,
      a whole month passing on the same day number of a later month, and a carry span of zero months holds no receipt.
    line_received_in_span: >-
      The over-receipt carry-forward is the excess of units received over units expected on the SKU's other inbound
      lines dated inside the carry span, taken together and counted only when that excess is positive; the carry
      span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
      Program active at least the carry tenure in whole months since its activation date, the middle carry span
      for an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months
      for every other enrollment.
    line_expected_in_span: >-
      The over-receipt carry-forward is the excess of units received over units expected on the SKU's other inbound
      lines dated inside the carry span, taken together and counted only when that excess is positive; the carry
      span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
      Program active at least the carry tenure in whole months since its activation date, the middle carry span
      for an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months
      for every other enrollment.
    carry_forward: >-
      The over-receipt carry-forward is the excess of units received over units expected on the SKU's other inbound
      lines dated inside the carry span, taken together and counted only when that excess is positive; the carry
      span is the long carry span for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise
      Program active at least the carry tenure in whole months since its activation date, the middle carry span
      for an enrollment in FBN Core Program or FBN Growth Program active at least that carry tenure, and zero months
      for every other enrollment.
    other_shortage_cases: >-
      The tolerance units are waived for a seller who opened no other inbound-shortage case inside the case-history
      span and whose enrollment has been active at least the tolerance tenure in whole months, are the repeat-shortage
      tolerance units for a seller who opened at least the repeat-case count of other inbound-shortage cases inside
      that span, and are the standard tolerance units for every other seller. Cases count toward the case-history
      span when fewer than the span's number of whole months have passed from their opening moment to the handling
      date.
    tolerance_units: >-
      The tolerance units are waived for a seller who opened no other inbound-shortage case inside the case-history
      span and whose enrollment has been active at least the tolerance tenure in whole months, are the repeat-shortage
      tolerance units for a seller who opened at least the repeat-case count of other inbound-shortage cases inside
      that span, and are the standard tolerance units for every other seller.
    tolerance_line_units: >-
      The tolerance share is the large-line tolerance share for a line with at least the large-line threshold of
      units expected, nothing for a line with fewer than the small-line threshold of units expected, and the standard
      tolerance share for a line in between.
    tolerance_share: >-
      The tolerance share is the large-line tolerance share for a line with at least the large-line threshold of
      units expected, nothing for a line with fewer than the small-line threshold of units expected, and the standard
      tolerance share for a line in between.
    receiving_tolerance: >-
      The receiving tolerance is the standard tolerance units plus the standard tolerance share of the units expected
      on the line, the share rounded down to a whole unit before it is added.
    reimbursed_on_line: >-
      The claimable shortage of a shipment line is the netted shortage of the line, less the over-receipt carry-forward,
      less the receiving tolerance, less the units already reimbursed as inbound shortage on the same shipment and
      SKU, each deducted from the netted shortage in that order; a negative remainder counts as zero.
    result: >-
      The claimable shortage of a shipment line is the netted shortage of the line, less the over-receipt carry-forward,
      less the receiving tolerance, less the units already reimbursed as inbound shortage on the same shipment and
      SKU, each deducted from the netted shortage in that order; a negative remainder counts as zero.
  factors:
  - id: netting_scope
    effect: method
    decides: netted_shortage
    bindings:
    - split_option
    - same_cost_lines
    - shipment_expected
    - shipment_received
    - same_cost_expected
    - same_cost_received
    - netted_shortage
    ladder:
    - when: the shipment was sent under the minimal split placement option
      method: the shortage is measured over all lines of the shipment together
    - when: >-
        the shipment was sent under another placement option AND it carries at least two lines with the claimed
        line's declared unit cost
      method: the shortage is measured over the same-cost lines together
    - when: otherwise
      method: the shortage is measured on the claimed line alone
    baseline:
      netted_shortage: line_expected - line_received
    evidence:
    - history
    cross_difficulty: null
  - id: carry_span
    effect: parameter
    decides: carry_span_months
    bindings:
    - carry_tenure_months
    - carry_span_months
    ladder:
    - when: >-
        the enrollment is in FBN Scale, Premier or Enterprise Program AND active at least the carry tenure in whole
        months
      value: K('carry_long')
    - when: the enrollment is in FBN Core or Growth Program AND active at least the carry tenure in whole months
      value: K('carry_middle')
    - when: otherwise
      value: K('carry_none')
    baseline:
      carry_span_months: K('carry_none')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: tolerance_units
    effect: parameter
    decides: tolerance_units
    bindings:
    - other_shortage_cases
    - tolerance_units
    ladder:
    - when: >-
        the seller opened no other inbound-shortage case inside the case-history span AND the enrollment is active
        at least the tolerance tenure
      value: K('tolerance_waived')
    - when: the seller opened at least the repeat-case count of other inbound-shortage cases inside the span
      value: K('tolerance_repeat')
    - when: otherwise
      value: K('tolerance_standard')
    baseline:
      tolerance_units: K('tolerance_standard')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: tolerance_share
    effect: parameter
    decides: tolerance_share
    bindings:
    - tolerance_line_units
    - tolerance_share
    ladder:
    - when: the line has at least the large-line threshold of units expected
      value: K('share_large_line')
    - when: the line has fewer than the small-line threshold of units expected
      value: K('share_small_line')
    - when: otherwise
      value: K('share_standard')
    baseline:
      tolerance_share: K('share_standard')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The claimable shortage of a shipment line is the netted shortage of the line, less the over-receipt carry-forward,
      less the receiving tolerance, less the units already reimbursed as inbound shortage on the same shipment and
      SKU, each deducted from the netted shortage in that order; a negative remainder counts as zero. The netted
      shortage of the line is the units expected on that line less the units received on it. The over-receipt carry-forward
      is none. The receiving tolerance is the standard tolerance units plus the standard tolerance share of the
      units expected on the line, the share rounded down to a whole unit before it is added.
    params:
    - tolerance_standard
    - share_standard
  inputs:
    history:
    - table: fulfill_events
      aggregate: sum
      field: units
      filters:
        event_type: fulfill_inbound_receipt
    - table: fulfill_events
      aggregate: sum
      field: units_expected
      filters:
        event_type: fulfill_inbound_receipt
    - table: fulfill_events
      aggregate: latest
      field: placement_option
      filters:
        event_type: fulfill_inbound_placement_fee
    - table: fulfill_events
      aggregate: sum
      field: units
      filters:
        event_type: fulfill_reimbursement
        reimbursement_type: inbound_shortage
    - table: fulfill_cases
      aggregate: count
      field: case_id
      within_months: 6
      filters:
        reimbursement_type: inbound_shortage
    cross_category: []
- id: fulfill_ext_damaged_case_approval
  base_policy_refs:
  - fulfill_reimbursement_terms
  overwrite:
  - base_policy: fulfill_reimbursement_terms
    superseded_clause: Northloop reimburses units lost or damaged in its custody.
    replaced_by: >-
      The units approved on a warehouse-damage case are the units claimed on the case, limited to the units on the
      damaged-in-warehouse inventory adjustments of its SKU dated inside the damage claim span, less the damage
      shrinkage allowance after it is limited to the damage allowance cap, less the damage compliance holdback,
      each deducted in that order; a negative remainder counts as zero, and the remainder is then capped at the
      damage approval limit plus the damage limit uplift.
  - base_policy: fulfill_reimbursement_terms
    superseded_clause: >-
      A warehouse loss claim is filed no later than the warehouse loss claim window counted in calendar days from
      the inventory adjustment date.
    replaced_by: >-
      For a warehouse-damage case the warehouse loss claim window is replaced by the damage claim span: only damaged-in-warehouse
      adjustments dated inside the damage claim span, counted back from the handling date, can be approved, and
      units of an older damaged-in-warehouse adjustment are not approved on any case.
  trigger: state_due
  subject:
  - fulfill_reimbursement
  computes: units_approved
  target_tool: approve_damaged_inventory_case_556f0f6d
  params:
    damage_span: 6
    damage_allowance_waived: 0
    damage_per_incident: 1
    damage_share: 0.002
    damage_cap_long: 1
    damage_cap_mid: 2
    damage_cap_standard: 4
    damage_tenure_long: 24
    damage_tenure_mid: 12
    damage_compliance_waived: 0
    damage_compliance_high: 3
    damage_compliance_standard: 1
    damage_points_trigger: 6
    damage_limit_large: 40
    damage_limit_mid: 20
    damage_limit_standard: 8
    damage_uplift_long: 6
    damage_uplift_short: 3
    damage_uplift_none: 0
    damage_wait_long: 45
    damage_wait_short: 21
    damage_claim_span: 2
  rule: >-
    This policy fixes the units the support desk approves when it decides a seller's open warehouse-damage case,
    the reimbursement case whose loss kind is damaged in warehouse; the approved units become the unit count of
    the case and the reimbursement run pays them afterwards. The units approved on a warehouse-damage case are the
    units claimed on the case, limited to the units on the damaged-in-warehouse inventory adjustments of its SKU
    dated inside the damage claim span, less the damage shrinkage allowance after it is limited to the damage allowance
    cap, less the damage compliance holdback, each deducted in that order; a negative remainder counts as zero,
    and the remainder is then capped at the damage approval limit plus the damage limit uplift. For a warehouse-damage
    case the warehouse loss claim window is replaced by the damage claim span: only damaged-in-warehouse adjustments
    dated inside the damage claim span, counted back from the handling date, can be approved, and units of an older
    damaged-in-warehouse adjustment are not approved on any case. For a warehouse-damage approval, a record is dated
    inside the damage review span or the damage claim span when fewer than that span's number of whole months have
    passed from its date to the handling date, a whole month passing on the same day number of a later month. The
    damage shrinkage allowance is the standard damage shrinkage share of the units of the case's SKU on inbound
    receipts dated inside the damage review span, rounded down to a whole unit. The damage allowance cap is the
    standard damage allowance cap. The damage compliance holdback is the standard damage compliance holdback in
    units. The damage approval limit is the standard damage approval limit, and the damage limit uplift is none.
    The damage shrinkage allowance is waived for an enrollment in FBN Premier Program or FBN Enterprise Program
    whose seller stands at Top Rated Level or Preferred Partner Level; for an enrollment in FBN Core Program, FBN
    Growth Program or FBN Scale Program whose seller stands at Above Standard Level, Top Rated Level or Preferred
    Partner Level it is the damage per-incident allowance times the number of damaged-in-warehouse inventory adjustments
    of the case's SKU dated inside the damage review span; for every other enrollment it is the standard damage
    shrinkage share of the SKU's received units. The damage allowance cap is the long-tenure damage cap for an enrollment
    active at least the long damage tenure in whole months since its activation date, the mid-tenure damage cap
    for one active at least the mid damage tenure but fewer than the long damage tenure in whole months, and the
    standard damage allowance cap for one active fewer than the mid damage tenure. The damage compliance holdback
    is waived for a seller with no active violation points whose standing status is good standing, is the high damage
    compliance holdback for a seller with at least the damage violation-point trigger of active violation points,
    and is the standard damage compliance holdback for every other seller. The damage approval limit is the large-store
    damage limit for a seller whose selling plan is Anchor Store or Enterprise Store, the mid-store damage limit
    for Basic Store or Premium Store, and the standard damage approval limit for any other selling plan. The damage
    limit uplift is the long-wait damage uplift for a case opened at least the long damage wait in days before the
    handling date, the short-wait damage uplift for a case opened at least the short damage wait but fewer than
    the long damage wait in days before it, and no uplift for a newer case.
  prerequisite: []
  cross_category:
  - category: standing
    as: branch
    reads:
    - variant_name
    - violation_points
    - status
    note: >-
      The damage allowance method and the damage compliance holdback are decided from the seller's standing level,
      active violation points and status.
  - category: selling
    as: branch
    reads:
    - variant_name
    note: The damage approval limit is decided from the seller's selling plan.
  compute:
  - damage_sku: >-
      LATEST('fulfill_cases', 'sku', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='damaged_in_warehouse',
      case_status='submitted')
  - damage_claimed: >-
      LATEST('fulfill_cases', 'units_claimed', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='damaged_in_warehouse',
      case_status='submitted')
  - damage_opened: >-
      LATEST('fulfill_cases', 'created_at', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='damaged_in_warehouse',
      case_status='submitted')
  - damage_standing: CFIELD('standing', 'variant_name')
  - damage_adjustments: >-
      COUNT('fulfill_events', within_months=K('damage_span'), event_type='fulfill_inventory_adjustment', discrepancy_type='damaged_in_warehouse',
      sku=damage_sku)
  - damage_received: >-
      SUM('fulfill_events', 'units', within_months=K('damage_span'), event_type='fulfill_inbound_receipt', sku=damage_sku)
  - damage_allowance: >-
      K('damage_allowance_waived') if ((F('variant_name') == 'FBN Premier Program' or F('variant_name') == 'FBN
      Enterprise Program') and (damage_standing == 'Top Rated Level' or damage_standing == 'Preferred Partner Level'))
      else (damage_adjustments * K('damage_per_incident') if ((F('variant_name') == 'FBN Core Program' or F('variant_name')
      == 'FBN Growth Program' or F('variant_name') == 'FBN Scale Program') and (damage_standing == 'Above Standard
      Level' or damage_standing == 'Top Rated Level' or damage_standing == 'Preferred Partner Level')) else int(damage_received
      * K('damage_share')))
  - damage_tenure_months: MONTHS(F('activated_date'), NOW)
  - damage_allowance_cap: >-
      K('damage_cap_long') if damage_tenure_months >= K('damage_tenure_long') else (K('damage_cap_mid') if damage_tenure_months
      >= K('damage_tenure_mid') else K('damage_cap_standard'))
  - damage_applied_allowance: MN(damage_allowance, damage_allowance_cap)
  - damage_points: CFIELD('standing', 'violation_points')
  - damage_standing_status: CFIELD('standing', 'status')
  - damage_compliance: >-
      K('damage_compliance_waived') if (damage_points == 0 and damage_standing_status == 'good_standing') else (K('damage_compliance_high')
      if damage_points >= K('damage_points_trigger') else K('damage_compliance_standard'))
  - damage_store: CFIELD('selling', 'variant_name')
  - damage_limit: >-
      K('damage_limit_large') if (damage_store == 'Anchor Store' or damage_store == 'Enterprise Store') else (K('damage_limit_mid')
      if (damage_store == 'Basic Store' or damage_store == 'Premium Store') else K('damage_limit_standard'))
  - damage_age_days: DAYS(damage_opened, NOW)
  - damage_uplift: >-
      K('damage_uplift_long') if damage_age_days >= K('damage_wait_long') else (K('damage_uplift_short') if damage_age_days
      >= K('damage_wait_short') else K('damage_uplift_none'))
  - timely_damage_units: >-
      SUM('fulfill_events', 'units', within_months=K('damage_claim_span'), event_type='fulfill_inventory_adjustment',
      discrepancy_type='damaged_in_warehouse', sku=damage_sku)
  - damage_start_units: MN(damage_claimed, timely_damage_units)
  - damage_net: damage_start_units - damage_applied_allowance - damage_compliance
  - result: MN(damage_limit + damage_uplift, MX(0, damage_net))
  compute_basis:
    damage_sku: >-
      This policy fixes the units the support desk approves when it decides a seller's open warehouse-damage case,
      the reimbursement case whose loss kind is damaged in warehouse; the approved units become the unit count of
      the case and the reimbursement run pays them afterwards.
    damage_claimed: >-
      The units approved on a warehouse-damage case are the units claimed on the case, limited to the units on the
      damaged-in-warehouse inventory adjustments of its SKU dated inside the damage claim span, less the damage
      shrinkage allowance after it is limited to the damage allowance cap, less the damage compliance holdback,
      each deducted in that order; a negative remainder counts as zero, and the remainder is then capped at the
      damage approval limit plus the damage limit uplift.
    damage_opened: >-
      The damage limit uplift is the long-wait damage uplift for a case opened at least the long damage wait in
      days before the handling date, the short-wait damage uplift for a case opened at least the short damage wait
      but fewer than the long damage wait in days before it, and no uplift for a newer case.
    damage_standing: >-
      The damage shrinkage allowance is waived for an enrollment in FBN Premier Program or FBN Enterprise Program
      whose seller stands at Top Rated Level or Preferred Partner Level; for an enrollment in FBN Core Program,
      FBN Growth Program or FBN Scale Program whose seller stands at Above Standard Level, Top Rated Level or Preferred
      Partner Level it is the damage per-incident allowance times the number of damaged-in-warehouse inventory adjustments
      of the case's SKU dated inside the damage review span; for every other enrollment it is the standard damage
      shrinkage share of the SKU's received units.
    damage_adjustments: >-
      The damage shrinkage allowance is waived for an enrollment in FBN Premier Program or FBN Enterprise Program
      whose seller stands at Top Rated Level or Preferred Partner Level; for an enrollment in FBN Core Program,
      FBN Growth Program or FBN Scale Program whose seller stands at Above Standard Level, Top Rated Level or Preferred
      Partner Level it is the damage per-incident allowance times the number of damaged-in-warehouse inventory adjustments
      of the case's SKU dated inside the damage review span; for every other enrollment it is the standard damage
      shrinkage share of the SKU's received units. For a warehouse-damage approval, a record is dated inside the
      damage review span or the damage claim span when fewer than that span's number of whole months have passed
      from its date to the handling date, a whole month passing on the same day number of a later month.
    damage_received: >-
      The damage shrinkage allowance is the standard damage shrinkage share of the units of the case's SKU on inbound
      receipts dated inside the damage review span, rounded down to a whole unit. For a warehouse-damage approval,
      a record is dated inside the damage review span or the damage claim span when fewer than that span's number
      of whole months have passed from its date to the handling date, a whole month passing on the same day number
      of a later month.
    damage_allowance: >-
      The damage shrinkage allowance is waived for an enrollment in FBN Premier Program or FBN Enterprise Program
      whose seller stands at Top Rated Level or Preferred Partner Level; for an enrollment in FBN Core Program,
      FBN Growth Program or FBN Scale Program whose seller stands at Above Standard Level, Top Rated Level or Preferred
      Partner Level it is the damage per-incident allowance times the number of damaged-in-warehouse inventory adjustments
      of the case's SKU dated inside the damage review span; for every other enrollment it is the standard damage
      shrinkage share of the SKU's received units.
    damage_tenure_months: >-
      The damage allowance cap is the long-tenure damage cap for an enrollment active at least the long damage tenure
      in whole months since its activation date, the mid-tenure damage cap for one active at least the mid damage
      tenure but fewer than the long damage tenure in whole months, and the standard damage allowance cap for one
      active fewer than the mid damage tenure.
    damage_allowance_cap: >-
      The damage allowance cap is the long-tenure damage cap for an enrollment active at least the long damage tenure
      in whole months since its activation date, the mid-tenure damage cap for one active at least the mid damage
      tenure but fewer than the long damage tenure in whole months, and the standard damage allowance cap for one
      active fewer than the mid damage tenure.
    damage_applied_allowance: >-
      The units approved on a warehouse-damage case are the units claimed on the case, limited to the units on the
      damaged-in-warehouse inventory adjustments of its SKU dated inside the damage claim span, less the damage
      shrinkage allowance after it is limited to the damage allowance cap, less the damage compliance holdback,
      each deducted in that order; a negative remainder counts as zero, and the remainder is then capped at the
      damage approval limit plus the damage limit uplift.
    damage_points: >-
      The damage compliance holdback is waived for a seller with no active violation points whose standing status
      is good standing, is the high damage compliance holdback for a seller with at least the damage violation-point
      trigger of active violation points, and is the standard damage compliance holdback for every other seller.
    damage_standing_status: >-
      The damage compliance holdback is waived for a seller with no active violation points whose standing status
      is good standing, is the high damage compliance holdback for a seller with at least the damage violation-point
      trigger of active violation points, and is the standard damage compliance holdback for every other seller.
    damage_compliance: >-
      The damage compliance holdback is waived for a seller with no active violation points whose standing status
      is good standing, is the high damage compliance holdback for a seller with at least the damage violation-point
      trigger of active violation points, and is the standard damage compliance holdback for every other seller.
    damage_store: >-
      The damage approval limit is the large-store damage limit for a seller whose selling plan is Anchor Store
      or Enterprise Store, the mid-store damage limit for Basic Store or Premium Store, and the standard damage
      approval limit for any other selling plan.
    damage_limit: >-
      The damage approval limit is the large-store damage limit for a seller whose selling plan is Anchor Store
      or Enterprise Store, the mid-store damage limit for Basic Store or Premium Store, and the standard damage
      approval limit for any other selling plan.
    damage_age_days: >-
      The damage limit uplift is the long-wait damage uplift for a case opened at least the long damage wait in
      days before the handling date, the short-wait damage uplift for a case opened at least the short damage wait
      but fewer than the long damage wait in days before it, and no uplift for a newer case.
    damage_uplift: >-
      The damage limit uplift is the long-wait damage uplift for a case opened at least the long damage wait in
      days before the handling date, the short-wait damage uplift for a case opened at least the short damage wait
      but fewer than the long damage wait in days before it, and no uplift for a newer case.
    timely_damage_units: >-
      For a warehouse-damage case the warehouse loss claim window is replaced by the damage claim span: only damaged-in-warehouse
      adjustments dated inside the damage claim span, counted back from the handling date, can be approved, and
      units of an older damaged-in-warehouse adjustment are not approved on any case. For a warehouse-damage approval,
      a record is dated inside the damage review span or the damage claim span when fewer than that span's number
      of whole months have passed from its date to the handling date, a whole month passing on the same day number
      of a later month.
    damage_start_units: >-
      The units approved on a warehouse-damage case are the units claimed on the case, limited to the units on the
      damaged-in-warehouse inventory adjustments of its SKU dated inside the damage claim span, less the damage
      shrinkage allowance after it is limited to the damage allowance cap, less the damage compliance holdback,
      each deducted in that order; a negative remainder counts as zero, and the remainder is then capped at the
      damage approval limit plus the damage limit uplift.
    damage_net: >-
      The units approved on a warehouse-damage case are the units claimed on the case, limited to the units on the
      damaged-in-warehouse inventory adjustments of its SKU dated inside the damage claim span, less the damage
      shrinkage allowance after it is limited to the damage allowance cap, less the damage compliance holdback,
      each deducted in that order; a negative remainder counts as zero, and the remainder is then capped at the
      damage approval limit plus the damage limit uplift.
    result: >-
      The units approved on a warehouse-damage case are the units claimed on the case, limited to the units on the
      damaged-in-warehouse inventory adjustments of its SKU dated inside the damage claim span, less the damage
      shrinkage allowance after it is limited to the damage allowance cap, less the damage compliance holdback,
      each deducted in that order; a negative remainder counts as zero, and the remainder is then capped at the
      damage approval limit plus the damage limit uplift.
  factors:
  - id: damage_allowance_method
    effect: method
    decides: damage_allowance
    bindings:
    - damage_standing
    - damage_adjustments
    - damage_received
    - damage_allowance
    ladder:
    - when: >-
        the enrollment is in FBN Premier or Enterprise Program AND the seller stands at Top Rated Level or Preferred
        Partner Level
      method: no damage shrinkage allowance is deducted
    - when: >-
        the enrollment is in FBN Core, Growth or Scale Program AND the seller stands at Above Standard Level or
        better
      method: >-
        the allowance is the damage per-incident allowance times the count of damaged-in-warehouse adjustments of
        the SKU inside the damage review span
    - when: otherwise
      method: >-
        the allowance is the standard damage shrinkage share of the SKU's units received inside the damage review
        span, rounded down
    baseline:
      damage_allowance: int(damage_received * K('damage_share'))
    evidence:
    - cross_category
    - history
    cross_difficulty: standing
  - id: damage_allowance_cap
    effect: parameter
    decides: damage_allowance_cap
    bindings:
    - damage_tenure_months
    - damage_allowance_cap
    ladder:
    - when: the enrollment is active at least the long damage tenure in whole months
      value: K('damage_cap_long')
    - when: it is active at least the mid damage tenure but fewer than the long damage tenure
      value: K('damage_cap_mid')
    - when: otherwise
      value: K('damage_cap_standard')
    baseline:
      damage_allowance_cap: K('damage_cap_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: damage_compliance_holdback
    effect: parameter
    decides: damage_compliance
    bindings:
    - damage_points
    - damage_standing_status
    - damage_compliance
    ladder:
    - when: no active violation points AND standing status good standing
      value: K('damage_compliance_waived')
    - when: at least the damage violation-point trigger of active violation points
      value: K('damage_compliance_high')
    - when: otherwise
      value: K('damage_compliance_standard')
    baseline:
      damage_compliance: K('damage_compliance_standard')
    evidence:
    - cross_category
    cross_difficulty: standing
  - id: damage_approval_limit
    effect: parameter
    decides: damage_limit
    bindings:
    - damage_store
    - damage_limit
    ladder:
    - when: the selling plan is Anchor Store or Enterprise Store
      value: K('damage_limit_large')
    - when: the selling plan is Basic Store or Premium Store
      value: K('damage_limit_mid')
    - when: otherwise
      value: K('damage_limit_standard')
    baseline:
      damage_limit: K('damage_limit_standard')
    evidence:
    - cross_category
    cross_difficulty: selling
  - id: damage_limit_uplift
    effect: parameter
    decides: damage_uplift
    bindings:
    - damage_opened
    - damage_age_days
    - damage_uplift
    ladder:
    - when: the case was opened at least the long damage wait in days before the handling date
      value: K('damage_uplift_long')
    - when: it was opened at least the short damage wait but fewer than the long damage wait in days before
      value: K('damage_uplift_short')
    - when: otherwise
      value: K('damage_uplift_none')
    baseline:
      damage_uplift: K('damage_uplift_none')
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
