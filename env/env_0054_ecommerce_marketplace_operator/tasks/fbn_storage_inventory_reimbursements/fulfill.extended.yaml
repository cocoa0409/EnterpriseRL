      counting as zero; that remainder is multiplied by the approval share and rounded down to a whole unit; the
      result is then capped at the line approval ceiling and at the inbound approval limit plus the inbound limit
      uplift, whichever is lower. The units approved on an inbound shortage case are not fixed until the units claimed
      on that case equal the claimable shortage of its shipment line.
    inbound_opened: >-
      The inbound limit uplift is the long-wait inbound uplift for a case opened at least the long inbound wait
      in days before the handling date, the short-wait inbound uplift for a case opened at least the short inbound
      wait but fewer than the long inbound wait in days before it, and no uplift for a newer case.
    inbound_standing: >-
      The approval share is the full approval share for a seller whose performance standing level is Top Rated Level
      or Preferred Partner Level, the reduced approval share for a seller at Below Standard Level or Developing
      Seller Level, and the standard approval share for a seller at Standard Level or Above Standard Level.
    approval_share: >-
      The approval share is the full approval share for a seller whose performance standing level is Top Rated Level
