      cases opened inside the case-history span; it is waived for a seller with no denied reimbursement case and
      at least the inbound approved-case trigger of approved FBN reimbursement cases among the cases opened inside
      that span; for every other seller it is the standard inbound verification holdback in units. An inbound shortage
      case is decided only after no warehouse-damage case of the same SKU opened before it still stands submitted.
    inbound_verification: >-
      The inbound verification holdback is the inbound holdback share of the units claimed, rounded down to a whole
      unit, for a seller with at least the inbound denied-case trigger of FBN reimbursement cases denied among the
      cases opened inside the case-history span; it is waived for a seller with no denied reimbursement case and
      at least the inbound approved-case trigger of approved FBN reimbursement cases among the cases opened inside
      that span; for every other seller it is the standard inbound verification holdback in units.
    inbound_points: >-
      The inbound compliance holdback is waived for a seller with no active violation points whose standing status
      is good standing, is the high inbound compliance holdback for a seller with at least the inbound violation-point
      trigger of active violation points, and is the standard inbound compliance holdback for every other seller.
    inbound_standing_status: >-
      The inbound compliance holdback is waived for a seller with no active violation points whose standing status
      is good standing, is the high inbound compliance holdback for a seller with at least the inbound violation-point
      trigger of active violation points, and is the standard inbound compliance holdback for every other seller.
    inbound_compliance: >-
      The inbound compliance holdback is waived for a seller with no active violation points whose standing status
      is good standing, is the high inbound compliance holdback for a seller with at least the inbound violation-point
      trigger of active violation points, and is the standard inbound compliance holdback for every other seller.
    ceiling_line_expected: >-
      The line approval ceiling is the line ceiling share of the units expected on the case's shipment line, rounded
      down to a whole unit, the line ceiling share being the standard line ceiling share.
    line_ceiling_share: >-
      The line ceiling share is the large-program line ceiling share for an enrollment in FBN Scale Program, FBN
      Premier Program or FBN Enterprise Program, the mid-program line ceiling share for an enrollment in FBN Core
      Program or FBN Growth Program, and the standard line ceiling share for an enrollment in FBN Starter Program.
    line_ceiling: >-
      The line approval ceiling is the line ceiling share of the units expected on the case's shipment line, rounded
      down to a whole unit, the line ceiling share being the standard line ceiling share.
    inbound_store: >-
      The inbound approval limit is the large-store inbound limit for a seller whose selling plan is Anchor Store
      or Enterprise Store, the mid-store inbound limit for Basic Store or Premium Store, and the standard inbound
      approval limit for any other selling plan.
    inbound_limit: >-
      The inbound approval limit is the large-store inbound limit for a seller whose selling plan is Anchor Store
      or Enterprise Store, the mid-store inbound limit for Basic Store or Premium Store, and the standard inbound
      approval limit for any other selling plan.
    inbound_age_days: >-
      The inbound limit uplift is the long-wait inbound uplift for a case opened at least the long inbound wait
      in days before the handling date, the short-wait inbound uplift for a case opened at least the short inbound
      wait but fewer than the long inbound wait in days before it, and no uplift for a newer case.
    inbound_uplift: >-
      The inbound limit uplift is the long-wait inbound uplift for a case opened at least the long inbound wait
      in days before the handling date, the short-wait inbound uplift for a case opened at least the short inbound
      wait but fewer than the long inbound wait in days before it, and no uplift for a newer case.
    after_holdbacks: >-
      The units approved on an inbound shortage case are worked out in this order: first the inbound verification
      holdback and then the inbound compliance holdback are deducted from the units claimed, a negative remainder
      counting as zero; that remainder is multiplied by the approval share and rounded down to a whole unit; the
      result is then capped at the line approval ceiling and at the inbound approval limit plus the inbound limit
      uplift, whichever is lower.
    shared_units: >-
      The units approved on an inbound shortage case are worked out in this order: first the inbound verification
      holdback and then the inbound compliance holdback are deducted from the units claimed, a negative remainder
      counting as zero; that remainder is multiplied by the approval share and rounded down to a whole unit; the
      result is then capped at the line approval ceiling and at the inbound approval limit plus the inbound limit
      uplift, whichever is lower.
    result: >-
      The units approved on an inbound shortage case are worked out in this order: first the inbound verification
      holdback and then the inbound compliance holdback are deducted from the units claimed, a negative remainder
      counting as zero; that remainder is multiplied by the approval share and rounded down to a whole unit; the
      result is then capped at the line approval ceiling and at the inbound approval limit plus the inbound limit
      uplift, whichever is lower.
  factors:
  - id: approval_share
    effect: parameter
    decides: approval_share
    bindings:
    - inbound_standing
    - approval_share
    ladder:
    - when: the seller's performance standing level is Top Rated Level or Preferred Partner Level
      value: K('share_full')
    - when: the level is Below Standard Level or Developing Seller Level
      value: K('share_reduced')
    - when: otherwise (Standard Level or Above Standard Level)
      value: K('share_standard')
    baseline:
      approval_share: K('share_standard')
    evidence:
    - cross_category
    cross_difficulty: standing
  - id: inbound_verification_holdback
    effect: method
    decides: inbound_verification
    bindings:
    - inbound_denied
    - inbound_approved
    - inbound_verification
    ladder:
    - when: >-
        at least the inbound denied-case trigger of the seller's cases opened inside the case-history span were
        denied
      method: the holdback is the inbound holdback share of the units claimed, rounded down
    - when: >-
        no case opened inside the span was denied AND at least the inbound approved-case trigger were approved
      method: no verification holdback is deducted
    - when: otherwise
      method: the holdback is the standard inbound verification holdback in units
    baseline:
      inbound_verification: K('inbound_holdback_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: inbound_compliance_holdback
    effect: parameter
    decides: inbound_compliance
    bindings:
    - inbound_points
    - inbound_standing_status
    - inbound_compliance
    ladder:
    - when: no active violation points AND standing status good standing
      value: K('inbound_compliance_waived')
    - when: at least the inbound violation-point trigger of active violation points
      value: K('inbound_compliance_high')
    - when: otherwise
      value: K('inbound_compliance_standard')
    baseline:
      inbound_compliance: K('inbound_compliance_standard')
    evidence:
    - cross_category
    cross_difficulty: standing
  - id: line_ceiling_share
    effect: parameter
    decides: line_ceiling_share
    bindings:
    - ceiling_line_expected
    - line_ceiling_share
    ladder:
    - when: the enrollment is in FBN Scale, Premier or Enterprise Program
      value: K('ceiling_large_program')
    - when: the enrollment is in FBN Core or Growth Program
      value: K('ceiling_mid_program')
    - when: otherwise (FBN Starter Program)
      value: K('ceiling_standard')
    baseline:
      line_ceiling_share: K('ceiling_standard')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: inbound_approval_limit
    effect: parameter
    decides: inbound_limit
    bindings:
    - inbound_store
    - inbound_limit
    ladder:
    - when: the selling plan is Anchor Store or Enterprise Store
      value: K('inbound_limit_large')
    - when: the selling plan is Basic Store or Premium Store
      value: K('inbound_limit_mid')
    - when: otherwise
      value: K('inbound_limit_standard')
    baseline:
      inbound_limit: K('inbound_limit_standard')
    evidence:
    - cross_category
    cross_difficulty: selling
  - id: inbound_limit_uplift
    effect: parameter
    decides: inbound_uplift
    bindings:
    - inbound_opened
    - inbound_age_days
    - inbound_uplift
    ladder:
    - when: the case was opened at least the long inbound wait in days before the handling date
      value: K('inbound_uplift_long')
    - when: it was opened at least the short inbound wait but fewer than the long inbound wait in days before
      value: K('inbound_uplift_short')
    - when: otherwise
      value: K('inbound_uplift_none')
    baseline:
      inbound_uplift: K('inbound_uplift_none')
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The units approved on an inbound shortage case are worked out in this order: first the inbound verification
      holdback and then the inbound compliance holdback are deducted from the units claimed, a negative remainder
      counting as zero; that remainder is multiplied by the approval share and rounded down to a whole unit; the
      result is then capped at the line approval ceiling and at the inbound approval limit plus the inbound limit
      uplift, whichever is lower. For an inbound shortage approval, a case counts inside the case-history span when
      fewer than that span's number of whole months have passed from its opening moment to the handling date. The
      approval share is the standard approval share. The inbound verification holdback is the standard inbound verification
      holdback in units. The inbound compliance holdback is the standard inbound compliance holdback in units. The
      line approval ceiling is the line ceiling share of the units expected on the case's shipment line, rounded
      down to a whole unit, the line ceiling share being the standard line ceiling share. The inbound approval limit
      is the standard inbound approval limit, and the inbound limit uplift is none.
    params:
    - share_standard
    - inbound_holdback_standard
    - inbound_compliance_standard
    - ceiling_standard
    - inbound_limit_standard
    - inbound_uplift_none
    - inbound_history_span
  inputs:
    history:
    - table: fulfill_cases
      aggregate: latest
      field: units_claimed
      filters:
        reimbursement_type: inbound_shortage
        case_status: submitted
    - table: fulfill_cases
      aggregate: count
      field: case_id
      within_months: 12
      filters:
        case_status: denied
    - table: fulfill_cases
      aggregate: count
      field: case_id
      within_months: 12
      filters:
        case_status: approved
    - table: fulfill_events
      aggregate: sum
      field: units_expected
      filters:
        event_type: fulfill_inbound_receipt
    cross_category:
    - standing
    - selling
