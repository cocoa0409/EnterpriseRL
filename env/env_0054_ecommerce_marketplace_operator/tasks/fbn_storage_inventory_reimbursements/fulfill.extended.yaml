  factors:
  - id: shrinkage_allowance_method
    effect: method
    decides: shrinkage_allowance
    bindings:
    - desk_standing
    - desk_adjustments
    - desk_received
    - shrinkage_allowance
    ladder:
    - when: >-
        the enrollment is in FBN Premier Program or FBN Enterprise Program AND the seller stands at Top Rated Level
        or Preferred Partner Level
      method: no shrinkage allowance is deducted
    - when: >-
        the enrollment is in FBN Core Program, FBN Growth Program or FBN Scale Program AND the seller stands at
        Above Standard Level, Top Rated Level or Preferred Partner Level
      method: >-
        the allowance is the per-incident allowance times the count of lost-in-warehouse adjustments of the SKU
        dated inside the desk review span
    - when: otherwise
      method: >-
        the allowance is the standard shrinkage share of the SKU's units received inside the desk review span, rounded
        down
    baseline:
      shrinkage_allowance: int(desk_received * K('shrinkage_share'))
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: standing
  - id: allowance_cap
    effect: parameter
    decides: allowance_cap
    bindings:
    - enrollment_months
    - allowance_cap
    ladder:
    - when: the enrollment has been active at least the long tenure in whole months
      value: K('cap_long')
    - when: >-
        the enrollment has been active at least the mid tenure but fewer than the long tenure in whole months
      value: K('cap_mid')
    - when: otherwise (active fewer than the mid tenure)
      value: K('cap_standard')
    baseline:
      allowance_cap: K('cap_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: verification_holdback_method
    effect: method
    decides: verification_holdback
    bindings:
    - denied_cases
    - approved_cases
    - verification_holdback
    ladder:
    - when: >-
        at least the denied-case trigger of the seller's FBN cases opened inside the case-history span were denied
      method: the holdback is the holdback share of the units claimed, rounded down
    - when: >-
        none of the seller's cases opened inside the case-history span was denied AND at least the approved-case
        trigger of them were approved
      method: no verification holdback is deducted
    - when: otherwise
      method: the holdback is the standard verification holdback in units
    baseline:
      verification_holdback: K('holdback_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: compliance_holdback
    effect: parameter
    decides: compliance_holdback
    bindings:
    - violation_points
    - standing_status
    - compliance_holdback
    ladder:
    - when: the seller has no active violation points AND the standing status is good standing
      value: K('compliance_waived')
    - when: the seller has at least the violation-point trigger of active violation points
      value: K('compliance_high')
    - when: otherwise
      value: K('compliance_standard')
    baseline:
      compliance_holdback: K('compliance_standard')
    evidence:
    - cross_category
    cross_difficulty: standing
  - id: approval_limit
    effect: parameter
    decides: approval_limit
    bindings:
    - desk_store_plan
    - approval_limit
    ladder:
    - when: the seller's selling plan is Anchor Store or Enterprise Store
      value: K('limit_large')
    - when: the seller's selling plan is Basic Store or Premium Store
      value: K('limit_mid')
    - when: otherwise
      value: K('limit_standard')
    baseline:
      approval_limit: K('limit_standard')
    evidence:
    - cross_category
    cross_difficulty: selling
  - id: limit_uplift
    effect: parameter
    decides: limit_uplift
    bindings:
    - case_opened
    - case_age_days
    - limit_uplift
    ladder:
    - when: the case was opened at least the long-wait days before the handling date
      value: K('uplift_long')
    - when: the case was opened at least the short-wait days but fewer than the long-wait days before
      value: K('uplift_short')
    - when: otherwise
      value: K('uplift_none')
    baseline:
      limit_uplift: K('uplift_none')
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The units approved on a warehouse-loss case are the units claimed on the case, less the shrinkage allowance
      after it is limited to the allowance cap, less the verification holdback, less the compliance holdback, each
      deducted from the units claimed in that order; a negative remainder counts as zero, and the remainder is then
      capped at the approval limit plus the limit uplift. For a warehouse-loss approval, a record is dated inside
      the desk review span or the case-history span when fewer than that span's number of whole months have passed
      from its date to the handling date, a whole month passing on the same day number of a later month. The shrinkage
      allowance is the standard shrinkage share of the units of the case's SKU on inbound receipts dated inside
      the desk review span, rounded down to a whole unit. The allowance cap is the standard allowance cap. The verification
      holdback is the standard verification holdback in units. The compliance holdback is the standard compliance
      holdback in units. The approval limit is the standard approval limit, and the limit uplift is none.
    params:
    - desk_span
    - shrinkage_share
    - cap_standard
    - holdback_standard
    - compliance_standard
    - limit_standard
    - uplift_none
    - history_span
  inputs:
    history:
    - table: fulfill_cases
      aggregate: latest
      field: units_claimed
      filters:
        reimbursement_type: lost_in_warehouse
        case_status: submitted
    - table: fulfill_events
      aggregate: count
      field: fulfill_event_id
      within_months: 6
      filters:
        event_type: fulfill_inventory_adjustment
        discrepancy_type: lost_in_warehouse
    - table: fulfill_events
      aggregate: sum
      field: units
      within_months: 6
      filters:
        event_type: fulfill_inbound_receipt
    - table: fulfill_cases
      aggregate: count
      field: case_id
      within_months: 12
      filters:
        case_status: denied
    - table: fulfill_cases
      aggregate: count
      field: case_id
