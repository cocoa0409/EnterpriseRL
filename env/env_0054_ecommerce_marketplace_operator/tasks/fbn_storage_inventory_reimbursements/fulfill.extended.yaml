    evidence:
    - cross_category
    - date
    cross_difficulty: selling
  - id: search_hold
    effect: parameter
    decides: search_hold_months
    bindings:
    - sku_size_tier
    - search_hold_months
    ladder:
    - when: the SKU's latest inbound receipt records the small standard size tier
      value: K('hold_small')
    - when: the SKU's latest inbound receipt records the large bulky or extra large size tier
      value: K('hold_oversize')
    - when: otherwise (large standard size tier)
      value: K('hold_standard')
    baseline:
      search_hold_months: K('hold_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: claim_ceiling_method
    effect: method
    decides: claim_ceiling
    bindings:
    - standing_level
    - largest_lost_adjustment
    - claim_ceiling
    ladder:
    - when: the seller's performance standing level is Top Rated Level or Preferred Partner Level
      method: 'no claim ceiling applies: the ceiling equals the uncapped remainder'
    - when: the level is Below Standard Level or Developing Seller Level
      method: >-
        the ceiling is the units of the largest single lost-in-warehouse adjustment ever recorded for the SKU
    - when: otherwise (Standard Level or Above Standard Level)
      method: >-
