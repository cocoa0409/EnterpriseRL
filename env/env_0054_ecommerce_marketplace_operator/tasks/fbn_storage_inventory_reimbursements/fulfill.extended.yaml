- id: fulfill_ext_shortage_case_approval
  base_policy_refs:
  - fulfill_reimbursement_terms
  overwrite:
  - base_policy: fulfill_reimbursement_terms
    superseded_clause: Northloop reimburses units lost or damaged in its custody.
    replaced_by: >-
      The units approved on an inbound shortage case are worked out in this order: first the inbound verification
      holdback and then the inbound compliance holdback are deducted from the units claimed, a negative remainder
      counting as zero; that remainder is multiplied by the approval share and rounded down to a whole unit; the
      result is then capped at the line approval ceiling and at the inbound approval limit plus the inbound limit
      uplift, whichever is lower.
  trigger: state_due
  subject:
  - fulfill_reimbursement
  computes: units_approved
  target_tool: approve_inbound_shortage_case_dfebd527
  params:
    share_full: 1.0
    share_reduced: 0.75
    share_standard: 0.9
    inbound_history_span: 12
    inbound_holdback_share: 0.2
    inbound_denied_trigger: 2
    inbound_approved_trigger: 3
    inbound_holdback_waived: 0
    inbound_holdback_standard: 1
    inbound_compliance_waived: 0
    inbound_compliance_high: 3
    inbound_compliance_standard: 1
    inbound_points_trigger: 6
    ceiling_large_program: 0.15
    ceiling_mid_program: 0.1
    ceiling_standard: 0.05
    inbound_limit_large: 40
    inbound_limit_mid: 20
    inbound_limit_standard: 10
    inbound_uplift_long: 10
    inbound_uplift_short: 5
    inbound_uplift_none: 0
    inbound_wait_long: 30
    inbound_wait_short: 14
  rule: >-
    This policy fixes the units the support desk approves when it decides a seller's open inbound-shortage case;
    the approved units become the unit count of the case and the reimbursement run pays them afterwards. The units
    approved on an inbound shortage case are not fixed until the units claimed on that case equal the claimable
    shortage of its shipment line. An inbound shortage case is decided only after no warehouse-damage case of the
    same SKU opened before it still stands submitted. The units approved on an inbound shortage case are worked
    out in this order: first the inbound verification holdback and then the inbound compliance holdback are deducted
    from the units claimed, a negative remainder counting as zero; that remainder is multiplied by the approval
    share and rounded down to a whole unit; the result is then capped at the line approval ceiling and at the inbound
    approval limit plus the inbound limit uplift, whichever is lower. For an inbound shortage approval, a case counts
    inside the case-history span when fewer than that span's number of whole months have passed from its opening
    moment to the handling date. The approval share is the standard approval share. The inbound verification holdback
    is the standard inbound verification holdback in units. The inbound compliance holdback is the standard inbound
    compliance holdback in units. The line approval ceiling is the line ceiling share of the units expected on the
    case's shipment line, rounded down to a whole unit, the line ceiling share being the standard line ceiling share.
    The inbound approval limit is the standard inbound approval limit, and the inbound limit uplift is none. The
    approval share is the full approval share for a seller whose performance standing level is Top Rated Level or
    Preferred Partner Level, the reduced approval share for a seller at Below Standard Level or Developing Seller
    Level, and the standard approval share for a seller at Standard Level or Above Standard Level. The inbound verification
    holdback is the inbound holdback share of the units claimed, rounded down to a whole unit, for a seller with
    at least the inbound denied-case trigger of FBN reimbursement cases denied among the cases opened inside the
    case-history span; it is waived for a seller with no denied reimbursement case and at least the inbound approved-case
    trigger of approved FBN reimbursement cases among the cases opened inside that span; for every other seller
    it is the standard inbound verification holdback in units. The inbound compliance holdback is waived for a seller
    with no active violation points whose standing status is good standing, is the high inbound compliance holdback
    for a seller with at least the inbound violation-point trigger of active violation points, and is the standard
    inbound compliance holdback for every other seller. The line ceiling share is the large-program line ceiling
    share for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise Program, the mid-program
    line ceiling share for an enrollment in FBN Core Program or FBN Growth Program, and the standard line ceiling
    share for an enrollment in FBN Starter Program. The inbound approval limit is the large-store inbound limit
    for a seller whose selling plan is Anchor Store or Enterprise Store, the mid-store inbound limit for Basic Store
    or Premium Store, and the standard inbound approval limit for any other selling plan. The inbound limit uplift
    is the long-wait inbound uplift for a case opened at least the long inbound wait in days before the handling
    date, the short-wait inbound uplift for a case opened at least the short inbound wait but fewer than the long
    inbound wait in days before it, and no uplift for a newer case.
  prerequisite:
  - problem: fulfill_ext_shortage_claim_units
    kind: value_input
    gate: inbound_claimed
    form: state
    policy_source: >-
      The units approved on an inbound shortage case are not fixed until the units claimed on that case equal the
      claimable shortage of its shipment line.
    condition: >-
      The open inbound-shortage case carries, as its units claimed, the claimable shortage that the shortage-claim
      rule computes for its shipment line at handling time.
    resolved_by: amend_inbound_shortage_claim_fdee09ae
    effect: >-
      inbound_claimed changes from the units the seller first entered to the claimable shortage, and every deduction,
      the share and the caps act on that corrected figure.
  - problem: fulfill_ext_damaged_case_approval
    kind: value_input
    gate: inbound_approved
    form: state
    policy_source: >-
      An inbound shortage case is decided only after no warehouse-damage case of the same SKU opened before it still
      stands submitted.
    condition: >-
      No damaged-in-warehouse case of the shortage case's SKU that was opened before the shortage case has case_status
      submitted; every such case stands decided.
    resolved_by: approve_damaged_inventory_case_556f0f6d
    effect: >-
      Deciding the earlier warehouse-damage case turns it from submitted to approved, so inbound_approved counts
      one more approved case inside the case-history span, which can move the seller onto the waived tier of the
      verification holdback.
  cross_category:
  - category: standing
    as: branch
    reads:
    - variant_name
    - violation_points
    - status
    note: >-
      The approval share and the inbound compliance holdback are decided from the seller's standing level, active
      violation points and status.
  - category: selling
    as: branch
    reads:
    - variant_name
    note: The inbound approval limit is decided from the seller's selling plan.
  compute:
  - inbound_shipment: >-
      LATEST('fulfill_cases', 'shipment_id', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='inbound_shortage',
      case_status='submitted')
  - inbound_sku: >-
      LATEST('fulfill_cases', 'sku', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='inbound_shortage',
      case_status='submitted')
  - inbound_claimed: >-
      LATEST('fulfill_cases', 'units_claimed', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='inbound_shortage',
      case_status='submitted')
  - inbound_opened: >-
      LATEST('fulfill_cases', 'created_at', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='inbound_shortage',
      case_status='submitted')
  - inbound_standing: CFIELD('standing', 'variant_name')
  - approval_share: >-
      K('share_full') if (inbound_standing == 'Top Rated Level' or inbound_standing == 'Preferred Partner Level')
      else (K('share_reduced') if (inbound_standing == 'Below Standard Level' or inbound_standing == 'Developing
      Seller Level') else K('share_standard'))
  - inbound_denied: >-
      COUNT('fulfill_cases', within_months=K('inbound_history_span'), date_field='created_at', case_type='reimbursement_claim',
      case_status='denied')
  - inbound_approved: >-
      COUNT('fulfill_cases', within_months=K('inbound_history_span'), date_field='created_at', case_type='reimbursement_claim',
      case_status='approved')
  - inbound_verification: >-
      int(inbound_claimed * K('inbound_holdback_share')) if inbound_denied >= K('inbound_denied_trigger') else (K('inbound_holdback_waived')
      if (inbound_denied == 0 and inbound_approved >= K('inbound_approved_trigger')) else K('inbound_holdback_standard'))
  - inbound_points: CFIELD('standing', 'violation_points')
  - inbound_standing_status: CFIELD('standing', 'status')
  - inbound_compliance: >-
      K('inbound_compliance_waived') if (inbound_points == 0 and inbound_standing_status == 'good_standing') else
      (K('inbound_compliance_high') if inbound_points >= K('inbound_points_trigger') else K('inbound_compliance_standard'))
  - ceiling_line_expected: >-
      SUM('fulfill_events', 'units_expected', event_type='fulfill_inbound_receipt', shipment_id=inbound_shipment,
      sku=inbound_sku)
  - line_ceiling_share: >-
      K('ceiling_large_program') if (F('variant_name') == 'FBN Scale Program' or F('variant_name') == 'FBN Premier
      Program' or F('variant_name') == 'FBN Enterprise Program') else (K('ceiling_mid_program') if (F('variant_name')
      == 'FBN Core Program' or F('variant_name') == 'FBN Growth Program') else K('ceiling_standard'))
  - line_ceiling: int(ceiling_line_expected * line_ceiling_share)
  - inbound_store: CFIELD('selling', 'variant_name')
  - inbound_limit: >-
      K('inbound_limit_large') if (inbound_store == 'Anchor Store' or inbound_store == 'Enterprise Store') else
      (K('inbound_limit_mid') if (inbound_store == 'Basic Store' or inbound_store == 'Premium Store') else K('inbound_limit_standard'))
  - inbound_age_days: DAYS(inbound_opened, NOW)
  - inbound_uplift: >-
      K('inbound_uplift_long') if inbound_age_days >= K('inbound_wait_long') else (K('inbound_uplift_short') if
      inbound_age_days >= K('inbound_wait_short') else K('inbound_uplift_none'))
  - after_holdbacks: MX(0, inbound_claimed - inbound_verification - inbound_compliance)
  - shared_units: int(after_holdbacks * approval_share)
  - result: MN(line_ceiling, inbound_limit + inbound_uplift, shared_units)
  compute_basis:
    inbound_shipment: >-
      This policy fixes the units the support desk approves when it decides a seller's open inbound-shortage case;
      the approved units become the unit count of the case and the reimbursement run pays them afterwards.
    inbound_sku: >-
      This policy fixes the units the support desk approves when it decides a seller's open inbound-shortage case;
      the approved units become the unit count of the case and the reimbursement run pays them afterwards.
    inbound_claimed: >-
      The units approved on an inbound shortage case are worked out in this order: first the inbound verification
