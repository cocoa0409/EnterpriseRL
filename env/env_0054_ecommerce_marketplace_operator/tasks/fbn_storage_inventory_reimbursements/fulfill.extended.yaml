      seller stands at Top Rated Level or Preferred Partner Level; for an enrollment in FBN Core Program, FBN Growth
      Program or FBN Scale Program whose seller stands at Above Standard Level, Top Rated Level or Preferred Partner
      Level it is the per-incident allowance times the number of lost-in-warehouse inventory adjustments of the
      case's SKU dated inside the desk review span; for every other enrollment it is the standard shrinkage share
