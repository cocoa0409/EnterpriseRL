  rule: >-
    This policy fixes the claimable lost units, the figure a seller enters as the units claimed when correcting
    their own open warehouse-loss case, which is the reimbursement case whose loss kind is lost in warehouse. The
    claimable lost units of a warehouse-loss case are the units on the lost-in-warehouse inventory adjustments of
    the case's SKU dated inside the warehouse-loss lookback and outside the warehouse-loss search hold, less the
    units of that SKU on found-inventory records dated inside the warehouse-loss lookback, less the units on lost-in-warehouse
    reimbursements of that SKU dated inside the warehouse-loss lookback; a negative remainder counts as zero, and
    that remainder is then capped at the warehouse-loss claim ceiling and at the claim unit cap, whichever is lower.
    For the claimable lost units, a record is dated inside a span of a given number of months when fewer than that
    number of whole months have passed from its date to the handling date, a whole month passing on the same day
    number of a later month, so a span of zero months holds no record. The warehouse-loss lookback is the standard
    lookback base. The warehouse-loss search hold is a span of the standard search hold months, during which a lost-in-warehouse
    adjustment is still being searched for and is not yet claimable. The warehouse-loss claim ceiling is the standard
    ceiling share of the units of the SKU on inbound receipts dated inside the warehouse-loss lookback, rounded
    down to a whole unit. The claim unit cap is the standard claim unit cap. The lookback base is the long lookback
    base for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise Program that has been active
    for at least the lookback tenure threshold in whole months since its activation date, the middle lookback base
    for an enrollment in FBN Core Program or FBN Growth Program active for at least that same threshold, and the
