  compute:
  - case_sku: >-
      LATEST('fulfill_cases', 'sku', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='lost_in_warehouse',
      case_status='submitted')
  - claimed_units: >-
      LATEST('fulfill_cases', 'units_claimed', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='lost_in_warehouse',
      case_status='submitted')
  - case_opened: >-
      LATEST('fulfill_cases', 'created_at', date_field='created_at', case_type='reimbursement_claim', reimbursement_type='lost_in_warehouse',
      case_status='submitted')
  - desk_standing: CFIELD('standing', 'variant_name')
  - desk_adjustments: >-
      COUNT('fulfill_events', within_months=K('desk_span'), event_type='fulfill_inventory_adjustment', discrepancy_type='lost_in_warehouse',
      sku=case_sku)
  - desk_received: >-
      SUM('fulfill_events', 'units', within_months=K('desk_span'), event_type='fulfill_inbound_receipt', sku=case_sku)
  - shrinkage_allowance: >-
      K('allowance_waived') if ((F('variant_name') == 'FBN Premier Program' or F('variant_name') == 'FBN Enterprise
      Program') and (desk_standing == 'Top Rated Level' or desk_standing == 'Preferred Partner Level')) else (desk_adjustments
      * K('per_incident_units') if ((F('variant_name') == 'FBN Core Program' or F('variant_name') == 'FBN Growth
      Program' or F('variant_name') == 'FBN Scale Program') and (desk_standing == 'Above Standard Level' or desk_standing
      == 'Top Rated Level' or desk_standing == 'Preferred Partner Level')) else int(desk_received * K('shrinkage_share')))
  - enrollment_months: MONTHS(F('activated_date'), NOW)
  - allowance_cap: >-
      K('cap_long') if enrollment_months >= K('tenure_long') else (K('cap_mid') if enrollment_months >= K('tenure_mid')
      else K('cap_standard'))
  - applied_allowance: MN(shrinkage_allowance, allowance_cap)
  - denied_cases: >-
      COUNT('fulfill_cases', within_months=K('history_span'), date_field='created_at', case_type='reimbursement_claim',
      case_status='denied')
  - approved_cases: >-
      COUNT('fulfill_cases', within_months=K('history_span'), date_field='created_at', case_type='reimbursement_claim',
      case_status='approved')
  - verification_holdback: >-
      int(claimed_units * K('holdback_share')) if denied_cases >= K('denied_trigger') else (K('holdback_waived')
      if (denied_cases == 0 and approved_cases >= K('approved_trigger')) else K('holdback_standard'))
  - violation_points: CFIELD('standing', 'violation_points')
  - standing_status: CFIELD('standing', 'status')
  - compliance_holdback: >-
      K('compliance_waived') if (violation_points == 0 and standing_status == 'good_standing') else (K('compliance_high')
      if violation_points >= K('points_trigger') else K('compliance_standard'))
  - desk_store_plan: CFIELD('selling', 'variant_name')
  - approval_limit: >-
      K('limit_large') if (desk_store_plan == 'Anchor Store' or desk_store_plan == 'Enterprise Store') else (K('limit_mid')
      if (desk_store_plan == 'Basic Store' or desk_store_plan == 'Premium Store') else K('limit_standard'))
  - case_age_days: DAYS(case_opened, NOW)
  - limit_uplift: >-
      K('uplift_long') if case_age_days >= K('wait_long') else (K('uplift_short') if case_age_days >= K('wait_short')
      else K('uplift_none'))
  - net_approvable: claimed_units - applied_allowance - verification_holdback - compliance_holdback
  - result: MN(approval_limit + limit_uplift, MX(0, net_approvable))
  compute_basis:
    case_sku: >-
      This policy fixes the units the support desk approves when it decides a seller's open warehouse-loss case,
      the reimbursement case whose loss kind is lost in warehouse; the approved units become the unit count of the
      case and the reimbursement run pays them afterwards.
    claimed_units: >-
      The units approved on a warehouse-loss case are the units claimed on the case, less the shrinkage allowance
      after it is limited to the allowance cap, less the verification holdback, less the compliance holdback, each
      deducted from the units claimed in that order; a negative remainder counts as zero, and the remainder is then
      capped at the approval limit plus the limit uplift. The units approved on a warehouse-loss case are fixed
      only after the units claimed on that case equal the claimable lost units of its SKU.
