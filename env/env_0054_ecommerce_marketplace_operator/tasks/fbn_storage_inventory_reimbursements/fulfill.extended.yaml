    cap for an enrollment in FBN Scale Program, FBN Premier Program or FBN Enterprise Program active at least the
    claim-cap tenure in whole months since its activation date, the mid-program claim unit cap for an enrollment
    in FBN Core Program or FBN Growth Program active at least that tenure, and the standard claim unit cap for every
    other enrollment. Units already reimbursed on the same source object are never claimed again, and the corrected
    figure replaces whatever units the seller first entered on the case.
