    applied_allowance: >-
      The units approved on a warehouse-loss case are the units claimed on the case, less the shrinkage allowance
      after it is limited to the allowance cap, less the verification holdback, less the compliance holdback, each
      deducted from the units claimed in that order; a negative remainder counts as zero, and the remainder is then
