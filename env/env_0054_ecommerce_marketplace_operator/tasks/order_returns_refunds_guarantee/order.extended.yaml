
# Marketplace Orders — the buyer-side order contract of the Northloop marketplace.
category: order
display_name: Marketplace Orders

binding:
  holding_table: order_orders
  event_tables: [order_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {net_paid_amount: order_paid}

lifecycle:
  states: [placed, shipped, delivered, undeliverable, cancelled, closed]
  transitions:
    - {from: placed, to: shipped, by: system, means: "The seller (or a Northloop fulfillment center) confirms shipment and uploads carrier tracking."}
    - {from: placed, to: cancelled, by: user, means: "The buyer cancels the order before it ships."}
    - {from: placed, to: cancelled, by: system, means: "The seller or Northloop cancels an order that cannot be fulfilled (out of stock, pricing error, address cannot be served)."}
    - {from: shipped, to: delivered, by: system, means: "The carrier posts a delivered scan (or the freight carrier closes the delivery appointment)."}
    - {from: shipped, to: undeliverable, by: system, means: "The carrier reports the package lost, destroyed, refused, or returned to sender."}
    - {from: delivered, to: closed, by: system, means: "Both the return window and the Northloop Guarantee claim window have elapsed and no return or claim is open."}
    - {from: undeliverable, to: closed, by: system, means: "The undeliverable order has been refunded or replaced in full."}

accounts:
  - key: order_paid
    unit: USD
    meaning: "Net amount the buyer has paid on this order: captures booked in, refunds booked out; the holding's net_paid_amount is its running sum."

parameter_schema:
  fulfilled_by: 'Who picks, packs and ships the order and processes its returns: seller | northloop (enum string).'
  max_handling_business_days: Business days after the order date by which the order must ship (integer; 0 = ships the same business day).
  max_transit_business_days: Maximum carrier transit time in business days used to set the promised delivery date (integer; 0 = delivered the day it ships).
  business_day_calendar: Business-day calendar for every business-day count of this category (enum string).
  nonmember_shipping_charge: Shipping charge per order for a buyer without an active Loop+ membership, USD.
  nonmember_free_shipping_threshold: Item subtotal (USD) at or above which a non-member pays no shipping; not_offered = no free-shipping threshold.
  member_shipping_charge: Shipping charge per order for a buyer holding an active Loop+ membership, USD.
  member_same_day_free_subtotal: Item subtotal (USD) at or above which a Loop+ member's Same-Day shipping charge is waived; not_applicable outside Same-Day.
  same_day_order_cutoff_time: Local time (HH:MM) by which a Same-Day order must be placed to be promised for that day; not_applicable elsewhere.
  freight_appointment_window_hours: Length of the scheduled freight delivery appointment window, hours; not_applicable for parcel options.
  guaranteed_delivery: Whether the promised delivery date is guaranteed (a late delivery earns a shipping-charge refund) (boolean).
  late_refund_request_window_days: Calendar days after the delivered date within which a late-delivery shipping refund may be requested; not_applicable when delivery is not guaranteed.
  charge_capture_point: 'When the buyer''s payment is captured: at_shipment | at_order (enum string).'
  tax_collected_by: Party that collects and remits sales tax on the order as marketplace facilitator (enum string).
  standard_return_window_days: Calendar days after the delivered date within which a return may be requested for new and used items (integer).
  renewed_return_window_days: Calendar days after the delivered date within which a return may be requested for items sold in renewed condition (integer).
  holiday_extension_applies: Whether the holiday return calendar extends the return deadline for this delivery option (boolean).
  holiday_return_calendar: 'Holiday extension calendar: orders delivered from delivered_from to delivered_to (MM-DD, inclusive) may be returned until return_by (MM-DD) of the following calendar year (mapping).'
  non_returnable_item_categories: Item categories that cannot be returned for a refund (list of item_category values).
  return_ship_by_days: Calendar days after the return request within which the returned item must receive its first carrier scan (integer).
  late_return_grace_days: Calendar days after the ship-by deadline during which a late first scan is still accepted with a deduction; 0 = late returns are rejected.
  late_return_deduction_rate: Share of the returned item price withheld when the return is scanned inside the late grace period (decimal fraction); not_applicable when there is no grace.
  remorse_return_shipping_fee: Return shipping fee deducted from the refund of a return whose reason is not a seller-fault reason, USD per return.
  allowed_return_methods: Return methods a return request may use besides returnless (list of return_method values).
  restocking_rate_opened: Restocking fee as a share of the returned item price when the item arrives opened but resellable on a non-seller-fault return (decimal fraction).
  restocking_rate_used_or_incomplete: Restocking fee as a share of the returned item price when the item arrives used, incomplete or damaged by the buyer on a non-seller-fault return (decimal fraction).
  seller_fault_return_reasons: 'Return reasons treated as the seller''s fault: no return shipping fee, no restocking fee, original shipping refunded (list of return_reason values).'
  returnless_refund_max_unit_price: Highest item unit price (USD) for which a seller-fault return is refunded without the item being sent back; not_offered = always returned.
  refund_trigger: 'Earliest return milestone that releases the item refund: carrier_first_scan | seller_receipt (enum string).'
  first_scan_refund_max_order_total: Highest order total (USD) for which the refund is released at first carrier scan; not_applicable where the trigger is receipt.
  first_scan_min_buyer_account_age_days: Minimum age of the buyer's Northloop profile, in calendar days counted from account_opened_date, for a first-scan refund; not_applicable where the trigger is receipt.
  refund_deadline_after_receipt_business_days: Business days after the received-at-destination scan by which the item refund must be issued (integer).
  refund_rounding: Rounding applied to every computed refund component and deduction (enum string).
  gift_return_refund_destination: Where the refund of an order marked as a gift is sent when the return is requested (refund_destination value).
  undeliverable_refund_includes_shipping: Whether the original shipping charge is refunded when an order is returned to sender for a bad address or refused (boolean).
  replacement_offered: Whether a free replacement may be shipped instead of a refund for a seller-fault return or a lost package (boolean).
  replacement_request_window_days: Calendar days after the delivered date within which a replacement may be requested; not_applicable when replacements are not offered.
  replacement_max_per_order: Maximum number of replacements shipped against one order; not_applicable when replacements are not offered.
  unreturned_replacement_charge_days: Calendar days after a replacement ships by which the original item must receive its first carrier scan, failing which the buyer is charged for the replacement; not_applicable when replacements are not offered.
  item_not_received_wait_days: Calendar days after the promised delivery date before an undelivered shipment may be reported lost or claimed under the Northloop Guarantee (integer).
  liability_party: 'Party that funds refunds owed for loss, fulfillment error or a granted Northloop Guarantee claim: seller | northloop (enum string).'
  guarantee_claim_window_days: Calendar days after the promised delivery date within which a Northloop Guarantee claim may be filed (integer).
  guarantee_claim_cap: Maximum amount payable on one Northloop Guarantee claim, USD.
  guarantee_claims_per_order: Maximum number of Northloop Guarantee claims that may be filed on one order (integer).
  seller_claim_response_business_days: Business days the seller has to respond to a Northloop Guarantee claim before it is decided; not_applicable when Northloop is the liability party.
  guarantee_appeal_window_days: Calendar days after a guarantee decision within which the buyer or the seller may appeal it once (integer).
  invalid_tracking_auto_grant: Whether an item-not-received claim on an order shipped without valid tracking is granted against the seller without a seller response (boolean; not_applicable for Northloop-fulfilled orders).
  signature_confirmation_threshold: Order total (USD) at or above which a delivered scan protects the seller against an item-not-received claim only when signature confirmation was obtained; not_applicable for Northloop-fulfilled orders.
  transit_damage_report_days: Calendar days after the delivered date within which damage in transit must be reported to qualify as damaged_in_transit (integer).
  seller_cancel_counts_as_defect: Whether a cancellation initiated by the seller is recorded against the seller's performance standing (boolean).

