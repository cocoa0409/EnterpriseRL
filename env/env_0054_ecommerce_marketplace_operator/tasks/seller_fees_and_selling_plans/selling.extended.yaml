  - id: selling_ext_early_termination_fee
    base_policy_refs:
    - selling_cancellation
    - selling_onboarding
    - selling_fee_collection
    overwrite:
    - base_policy: selling_cancellation
      superseded_clause: an early termination fee of the early termination share
      replaced_by: >-
        Where a relief below applies, the early termination share is instead the plan's early termination fee share
        less the volume relief, the standing relief and the loyalty relief, which are added together first and taken
        from the share once.
    - base_policy: selling_cancellation
      superseded_clause: >-
        times the remaining committed monthly fees (whole months from the next billing date to the term end) is billed
      replaced_by: >-
        The months counted in an early termination fee follow the renewal rule: when the term renewed automatically
        no more than the renewal grace days before the decision date, the seller is held only to the grace commitment
        months of the renewed term, so the months counted are the grace commitment months less the whole months from
        the term start date to the next billing date, never below zero; when the term did not renew within those days
        and the term end date is no more than the plan's renewal notice days after the decision date, no committed
        months are counted; otherwise the remaining committed months are counted.
    trigger: on_request
    subject:
    - selling_early_termination_fee
    - selling_close
    computes: early_termination_fee
    target_tool: end_store_term_early_0def8036
    params:
      high_termination_net_fee_threshold: 12000.0
      mid_termination_net_fee_threshold: 6000.0
      high_termination_volume_relief: 0.15
      mid_termination_volume_relief: 0.1
      top_termination_standing_relief: 0.1
      above_termination_standing_relief: 0.05
      long_loyalty_count: 36
      mid_loyalty_count: 24
      long_loyalty_relief: 0.08
      mid_loyalty_relief: 0.05
      renewal_grace_days: 30
      grace_commitment_months: 3
    rule: >-
      A seller on the annual term of a store plan may end the term at once instead of waiting for its end; the plan
      closes on the spot and an early termination fee is billed on it, and ending the term is the seller's own decision,
      confirmed by the seller. The early termination fee is not billed until every seller-funded refund debited to
      the seller's payments account in the last twelve months for an order that shipped carries its refund credit
      on the order's variable final value fee record. The early termination fee is the plan's annual term monthly
      fee times the remaining committed months times the early termination share, rounded to the nearest cent. The
      remaining committed months are the billing dates still to come in the term: the whole calendar months from the
      next billing date to the term end date, plus one for the next billing date itself, and the early termination
      share is the plan's early termination fee share. Where a relief below applies, the early termination share is
      instead the plan's early termination fee share less the volume relief, the standing relief and the loyalty relief,
      which are added together first and taken from the share once. The volume relief of an early termination fee
      is the high termination volume relief when the plan's net seller fees over the last twelve whole months are
      at least the high termination net-fee threshold, the mid termination volume relief when they are at least the
      mid termination net-fee threshold but below the high one, and nothing otherwise; net seller fees are the subscription,
      insertion, final value and early termination fees billed less the fee credits booked, each counted when its
      billing date is less than twelve whole months before the decision date. The standing relief of an early termination
      fee is the top termination standing relief when the seller's performance level is one of the discount standing
      levels and the standing record shows no active violation points, the above termination standing relief when
      the level is Above Standard Level and no active violation points are shown, and nothing otherwise. The loyalty
      relief of an early termination fee is the long loyalty relief when the plan has been billed at least the long
      loyalty count of regular subscription charges in all, the mid loyalty relief when it has been billed at least
      the mid loyalty count but fewer than the long loyalty count, and nothing otherwise. The months counted in an
      early termination fee follow the renewal rule: when the term renewed automatically no more than the renewal
      grace days before the decision date, the seller is held only to the grace commitment months of the renewed term,
      so the months counted are the grace commitment months less the whole months from the term start date to the
      next billing date, never below zero; when the term did not renew within those days and the term end date is
      no more than the plan's renewal notice days after the decision date, no committed months are counted; otherwise
      the remaining committed months are counted. A term renewed automatically is a term whose start date is later
      than the plan's verification date.
    prerequisite:
    - problem: selling_ext_refund_fee_credit
      kind: value_input
      gate: et_net_fees
      form: state
      policy_source: >-
        The early termination fee is not billed until every seller-funded refund debited to the seller's payments
        account in the last twelve months for an order that shipped carries its refund credit on the order's variable
        final value fee record.
      condition: >-
        The variable final value fee record of the order of every seller-funded payout refund debit dated within the
        last twelve months, on an order that shipped, carries a seller fee credit booked with the order refund credit
        reason.
      resolved_by: book_refund_fee_credit_a1b0f084
      effect: >-
        Booking the refund credit lowers the plan's net seller fees over the last twelve months (et_net_fees) by the
        credit, which can move the volume relief to a lower tier.
    cross_category:
    - category: standing
      as: branch
      reads:
      - variant_name
      - violation_points
      note: The standing relief reads the performance level and active violation points.
    compute:
    - et_fee: P('annual_term_monthly_fee')
    - et_months_left: MONTHS(F('next_billing_date'), F('term_end_date')) + 1
    - et_since_renewal: DAYS(F('term_start_date'), NOW)
    - et_renewed: DAYS(F('verified_date'), F('term_start_date'))
    - et_to_end: DAYS(NOW, F('term_end_date'))
    - et_months: >-
        MX(0, K('grace_commitment_months') - MONTHS(F('term_start_date'), F('next_billing_date'))) if et_renewed >
        0 and et_since_renewal <= K('renewal_grace_days') else (0 if et_to_end <= P('renewal_notice_days') else et_months_left)
    - et_net_fees: >-
        SUM('selling_fees', 'amount', within_months=12, event_type='selling_subscription_fee') + SUM('selling_fees',
        'amount', within_months=12, event_type='selling_insertion_fee') + SUM('selling_fees', 'amount', within_months=12,
        event_type='selling_final_value_fee') + SUM('selling_fees', 'amount', within_months=12, event_type='selling_early_termination_fee')
        - SUM('selling_fees', 'amount', within_months=12, event_type='selling_fee_credit')
    - et_volume_relief: >-
        K('high_termination_volume_relief') if et_net_fees >= K('high_termination_net_fee_threshold') else (K('mid_termination_volume_relief')
        if et_net_fees >= K('mid_termination_net_fee_threshold') else 0)
    - et_level: CFIELD('standing', 'variant_name')
    - et_points: CFIELD('standing', 'violation_points')
    - et_standing_relief: >-
        K('top_termination_standing_relief') if et_level in P('discount_standing_levels') and et_points == 0 else
        (K('above_termination_standing_relief') if et_level == 'Above Standard Level' and et_points == 0 else 0)
    - et_charges: >-
        COUNT('selling_fees', event_type='selling_subscription_fee', subscription_charge_type='regular')
    - et_loyalty_relief: >-
        K('long_loyalty_relief') if et_charges >= K('long_loyalty_count') else (K('mid_loyalty_relief') if et_charges
        >= K('mid_loyalty_count') else 0)
    - et_share: >-
        P('early_termination_fee_share') - (et_volume_relief + et_standing_relief + et_loyalty_relief)
    - result: RND(et_fee * et_months * et_share, 2)
    compute_basis:
      et_fee: >-
        The early termination fee is the plan's annual term monthly fee times the remaining committed months times
        the early termination share, rounded to the nearest cent.
      et_months_left: >-
        The remaining committed months are the billing dates still to come in the term: the whole calendar months
        from the next billing date to the term end date, plus one for the next billing date itself, and the early
        termination share is the plan's early termination fee share.
      et_since_renewal: >-
        The months counted in an early termination fee follow the renewal rule: when the term renewed automatically
        no more than the renewal grace days before the decision date, the seller is held only to the grace commitment
        months of the renewed term, so the months counted are the grace commitment months less the whole months from
        the term start date to the next billing date, never below zero; when the term did not renew within those days
        and the term end date is no more than the plan's renewal notice days after the decision date, no committed
        months are counted; otherwise the remaining committed months are counted. A term renewed automatically is
        a term whose start date is later than the plan's verification date.
      et_renewed: >-
        The months counted in an early termination fee follow the renewal rule: when the term renewed automatically
        no more than the renewal grace days before the decision date, the seller is held only to the grace commitment
        months of the renewed term, so the months counted are the grace commitment months less the whole months from
        the term start date to the next billing date, never below zero; when the term did not renew within those days
        and the term end date is no more than the plan's renewal notice days after the decision date, no committed
        months are counted; otherwise the remaining committed months are counted. A term renewed automatically is
        a term whose start date is later than the plan's verification date.
      et_months: >-
        The months counted in an early termination fee follow the renewal rule: when the term renewed automatically
        no more than the renewal grace days before the decision date, the seller is held only to the grace commitment
        months of the renewed term, so the months counted are the grace commitment months less the whole months from
        the term start date to the next billing date, never below zero; when the term did not renew within those days
        and the term end date is no more than the plan's renewal notice days after the decision date, no committed
        months are counted; otherwise the remaining committed months are counted. A term renewed automatically is
        a term whose start date is later than the plan's verification date.
      et_net_fees: >-
        The volume relief of an early termination fee is the high termination volume relief when the plan's net seller
        fees over the last twelve whole months are at least the high termination net-fee threshold, the mid termination
        volume relief when they are at least the mid termination net-fee threshold but below the high one, and nothing
        otherwise; net seller fees are the subscription, insertion, final value and early termination fees billed
        less the fee credits booked, each counted when its billing date is less than twelve whole months before the
        decision date.
      et_volume_relief: >-
        The volume relief of an early termination fee is the high termination volume relief when the plan's net seller
        fees over the last twelve whole months are at least the high termination net-fee threshold, the mid termination
        volume relief when they are at least the mid termination net-fee threshold but below the high one, and nothing
        otherwise; net seller fees are the subscription, insertion, final value and early termination fees billed
        less the fee credits booked, each counted when its billing date is less than twelve whole months before the
        decision date.
      et_level: >-
        The standing relief of an early termination fee is the top termination standing relief when the seller's performance
        level is one of the discount standing levels and the standing record shows no active violation points, the
        above termination standing relief when the level is Above Standard Level and no active violation points are
        shown, and nothing otherwise.
      et_points: >-
        The standing relief of an early termination fee is the top termination standing relief when the seller's performance
        level is one of the discount standing levels and the standing record shows no active violation points, the
        above termination standing relief when the level is Above Standard Level and no active violation points are
        shown, and nothing otherwise.
      et_standing_relief: >-
        The standing relief of an early termination fee is the top termination standing relief when the seller's performance
        level is one of the discount standing levels and the standing record shows no active violation points, the
        above termination standing relief when the level is Above Standard Level and no active violation points are
        shown, and nothing otherwise.
      et_charges: >-
        The loyalty relief of an early termination fee is the long loyalty relief when the plan has been billed at
        least the long loyalty count of regular subscription charges in all, the mid loyalty relief when it has been
        billed at least the mid loyalty count but fewer than the long loyalty count, and nothing otherwise.
      et_loyalty_relief: >-
        The loyalty relief of an early termination fee is the long loyalty relief when the plan has been billed at
        least the long loyalty count of regular subscription charges in all, the mid loyalty relief when it has been
        billed at least the mid loyalty count but fewer than the long loyalty count, and nothing otherwise.
      et_share: >-
        Where a relief below applies, the early termination share is instead the plan's early termination fee share
        less the volume relief, the standing relief and the loyalty relief, which are added together first and taken
        from the share once.
      result: >-
        The early termination fee is the plan's annual term monthly fee times the remaining committed months times
        the early termination share, rounded to the nearest cent.
      et_to_end: >-
        The months counted in an early termination fee follow the renewal rule: when the term renewed automatically
        no more than the renewal grace days before the decision date, the seller is held only to the grace commitment
        months of the renewed term, so the months counted are the grace commitment months less the whole months from
        the term start date to the next billing date, never below zero; when the term did not renew within those days
        and the term end date is no more than the plan's renewal notice days after the decision date, no committed
        months are counted; otherwise the remaining committed months are counted. A term renewed automatically is
        a term whose start date is later than the plan's verification date.
    factors:
    - id: renewal_month_rule
      effect: method
      decides: et_months
      bindings:
      - et_since_renewal
      - et_renewed
      - et_to_end
      - et_months
      ladder:
      - when: >-
          the term renewed automatically no more than the renewal grace days before the decision date
        method: >-
          the months counted are the grace commitment months less the whole months from the term start date to the
          next billing date, never below zero
      - when: >-
          the term did not renew within those days and ends no more than the plan's renewal notice days after the
          decision date
        method: no committed months are counted
      - when: otherwise
        method: the remaining committed months (billing dates still to come) are counted
      baseline:
        et_months: et_months_left
      evidence:
      - date
      cross_difficulty: null
    - id: termination_volume_relief
      effect: parameter
      decides: et_volume_relief
      bindings:
      - et_net_fees
      - et_volume_relief
      ladder:
      - when: >-
          net seller fees dated less than twelve whole months before the decision date are at least the high termination
          net-fee threshold
        value: K('high_termination_volume_relief')
      - when: they are at least the mid termination net-fee threshold but below the high one
        value: K('mid_termination_volume_relief')
      - when: otherwise
        value: '0'
      baseline:
        et_volume_relief: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: termination_standing_relief
      effect: parameter
      decides: et_standing_relief
      bindings:
      - et_level
      - et_points
      - et_standing_relief
      ladder:
      - when: >-
          the level is one of the discount standing levels and no active violation points are shown
        value: K('top_termination_standing_relief')
      - when: the level is Above Standard Level and no active violation points are shown
        value: K('above_termination_standing_relief')
      - when: otherwise
        value: '0'
      baseline:
        et_standing_relief: '0'
      evidence:
      - cross_category
      cross_difficulty: standing
    - id: loyalty_relief
      effect: parameter
      decides: et_loyalty_relief
      bindings:
      - et_charges
      - et_loyalty_relief
      ladder:
      - when: >-
          the plan has been billed at least the long loyalty count of regular subscription charges
        value: K('long_loyalty_relief')
      - when: at least the mid loyalty count but fewer than the long loyalty count
        value: K('mid_loyalty_relief')
      - when: otherwise
        value: '0'
      baseline:
        et_loyalty_relief: '0'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: >-
        The early termination fee is the plan's annual term monthly fee times the remaining committed months times
        the early termination share, rounded to the nearest cent. The remaining committed months are the billing dates
        still to come in the term: the whole calendar months from the next billing date to the term end date, plus
        one for the next billing date itself, and the early termination share is the plan's early termination fee
        share.
      params:
      - annual_term_monthly_fee
      - early_termination_fee_share
    inputs:
      history:
      - table: selling_fees
        aggregate: count
        field: selling_event_id
        filters:
          event_type: selling_subscription_fee
          subscription_charge_type: regular
      - table: selling_fees
        aggregate: sum
        field: amount
        within_months: 12
        filters:
          event_type: fees and credits
      cross_category:
      - standing
  - id: selling_ext_refund_fee_credit
    base_policy_refs:
    - selling_refund_fee_credit
    - selling_fee_disputes
    - selling_final_value_fees
    overwrite:
    - base_policy: selling_refund_fee_credit
      superseded_clause: >-
        the variable final value fee of that order is credited in proportion to the refunded share of the fee basis
      replaced_by: >-
        For the variable fee credit, the refunded share is counted as one when the refunds reach at least the whole-order
        refund share of the fee basis, as half of the proportional share when they are no more than the small-refund
        share of the fee basis, and as the proportional share between the two.
    - base_policy: selling_refund_fee_credit
      superseded_clause: >-
        less a refund administration fee of the admin rate times that credit, capped at the admin fee cap
      replaced_by: >-
        The refund administration fee is worked out as the refund credit before the fee times the rate times both
        multipliers, rounded to the nearest cent, and only then compared with the cap; the FBN refund relief is subtracted
        after the cap and never takes the fee below zero.
    trigger: state_due
    subject:
    - selling_fee_credit
    computes: credit_amount
    target_tool: book_refund_fee_credit_a1b0f084
    params:
      whole_order_refund_share: 0.9
      small_refund_share: 0.25
      small_refund_share_factor: 0.5
      top_refund_admin_rate: 0.1
      above_refund_admin_rate: 0.15
      recent_defect_months: 2
      large_order_refund_cap: 10.0
      mid_order_refund_cap: 7.5
      large_order_basis: 1000.0
      mid_order_basis: 250.0
      frequent_refund_count: 4
      repeat_refund_count: 2
      frequent_refund_multiplier: 1.5
      repeat_refund_multiplier: 1.25
      long_tenure_months: 36
      mid_tenure_months: 24
      long_tenure_refund_multiplier: 0.5
      mid_tenure_refund_multiplier: 0.75
      same_day_fbn_refund_relief: 3.0
      fbn_refund_relief: 1.5
    rule: >-
      A refund the seller funds for a buyer, debited to the seller's Northloop Payments account, earns a refund credit
      on the variable final value fee record of the refunded order, booked with the order refund credit reason; an
      order the seller cancelled before it shipped is credited under the cancellation credit instead and earns no
      refund credit. The order worked on is the order of the most recent seller-funded refund debit on the payments
      account. The refund credit is the creditable variable fee times the refunded share, rounded to the nearest cent,
      less the refund administration fee. The creditable variable fee of a refund credit is the variable final value
      fee billed on the order less every credit already booked on that fee record, administration fees included, and
      never below zero. The refunded share is the seller-funded refund debits for the order added together and divided
      by the order's fee basis, never above one. The refund administration fee is the refund credit before the fee
      times the refund administration fee rate, rounded to the nearest cent, and capped at the refund administration
      fee cap. For the variable fee credit, the refunded share is counted as one when the refunds reach at least the
      whole-order refund share of the fee basis, as half of the proportional share when they are no more than the
      small-refund share of the fee basis, and as the proportional share between the two. The refund administration
      fee rate is the top refund admin rate when the seller's performance level is one of the discount standing levels
      and the standing record carries no order defect dated within the last recent-defect months, the above refund
      admin rate when the level is Above Standard Level and no order defect is dated within those months, and the
      refund administration fee rate otherwise; the months are whole months counted back from the decision date. The
      refund administration fee cap is the large-order refund cap when the order's fee basis is at least the large-order
      basis, the mid-order refund cap when it is at least the mid-order basis but below the large-order basis, and
      the refund administration fee cap below the mid-order basis. The refund administration fee is multiplied by
      the frequent-refund multiplier when the payments account shows at least the frequent-refund count of seller-funded
      refund debits dated less than three whole months before the decision date, by the repeat-refund multiplier when
      it shows at least the repeat-refund count but fewer than the frequent-refund count, and by one when it shows
      fewer. The refund administration fee is also multiplied by the long-tenure refund multiplier when the selling
      plan was verified at least the long tenure months before the decision date, by the mid-tenure refund multiplier
      when it was verified at least the mid tenure months but fewer than the long tenure months before, and by one
      otherwise, the tenure being counted in whole months. The refund administration fee is worked out as the refund
      credit before the fee times the rate times both multipliers, rounded to the nearest cent, and only then compared
      with the cap; the FBN refund relief is subtracted after the cap and never takes the fee below zero. The FBN
      refund relief is the same-day FBN refund relief when the refunded order's FBN outbound shipment is dated the
      same calendar day as its variable fee record, the FBN refund relief when that shipment is dated later, and nothing
      when the order has no FBN outbound shipment.
    prerequisite: []
    cross_category:
    - category: payout
      as: history
      reads:
      - payout_events.order_id
      - payout_events.amount
      - payout_events.event_date
      note: >-
        The order worked on, the refunded share and the refund frequency read the payments ledger's seller-funded
        refund debits.
    - category: standing
      as: branch
      reads:
      - variant_name
      - standing_events.order_id
      note: >-
        The refund admin rate reads the performance level and the order defects recorded in the recent months.
    - category: fulfill
      as: history
      reads:
      - fulfill_events.event_date
      note: The FBN refund relief reads the refunded order's FBN outbound shipment.
    compute:
    - rc_order: XLATEST('payout', 'payout_events', 'order_id', event_type='payout_refund_debit')
    - rc_fee_ref: >-
        LATEST('selling_fees', 'selling_event_id', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=rc_order)
    - rc_fee_date: >-
        LATEST('selling_fees', 'event_date', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=rc_order)
    - rc_billed: >-
        SUM('selling_fees', 'amount', event_type='selling_final_value_fee', fee_type='final_value_variable', order_id=rc_order)
    - rc_prior: >-
        SUM('selling_fees', 'gross_credit_amount', event_type='selling_fee_credit', fee_event_ref=rc_fee_ref)
    - rc_creditable: MX(0, rc_billed - rc_prior)
    - rc_refunded: >-
        XSUM('payout', 'payout_events', 'amount', event_type='payout_refund_debit', order_id=rc_order)
    - rc_basis: >-
        SUM('selling_fees', 'fee_basis_amount', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=rc_order)
    - rc_raw_share: MN(1, rc_refunded / rc_basis)
    - rc_share: >-
        1 if rc_raw_share >= K('whole_order_refund_share') else (rc_raw_share * K('small_refund_share_factor') if
        rc_raw_share <= K('small_refund_share') else rc_raw_share)
    - rc_gross: RND(rc_creditable * rc_share, 2)
    - rc_level: CFIELD('standing', 'variant_name')
    - rc_defects: >-
        XCOUNT('standing', 'standing_events', within_months=K('recent_defect_months'), event_type='standing_defect_record')
    - rc_rate: >-
        K('top_refund_admin_rate') if rc_level in P('discount_standing_levels') and rc_defects == 0 else (K('above_refund_admin_rate')
        if rc_level == 'Above Standard Level' and rc_defects == 0 else P('refund_admin_fee_rate'))
    - rc_cap: >-
        K('large_order_refund_cap') if rc_basis >= K('large_order_basis') else (K('mid_order_refund_cap') if rc_basis
        >= K('mid_order_basis') else P('refund_admin_fee_cap'))
    - rc_refunds_3m: >-
        XCOUNT('payout', 'payout_events', within_months=3, event_type='payout_refund_debit')
    - rc_freq_mult: >-
        K('frequent_refund_multiplier') if rc_refunds_3m >= K('frequent_refund_count') else (K('repeat_refund_multiplier')
        if rc_refunds_3m >= K('repeat_refund_count') else 1)
    - rc_tenure: MONTHS(F('verified_date'), NOW)
    - rc_tenure_mult: >-
        K('long_tenure_refund_multiplier') if rc_tenure >= K('long_tenure_months') else (K('mid_tenure_refund_multiplier')
        if rc_tenure >= K('mid_tenure_months') else 1)
    - rc_ship_date: >-
        XLATEST('fulfill', 'fulfill_events', 'event_date', event_type='fulfill_outbound_shipment', order_id=rc_order)
    - rc_fbn_relief: >-
        K('same_day_fbn_refund_relief') if rc_ship_date and DAYS(rc_fee_date, rc_ship_date) == 0 else (K('fbn_refund_relief')
        if rc_ship_date else 0)
    - rc_admin_raw: RND(rc_gross * rc_rate * rc_freq_mult * rc_tenure_mult, 2)
    - rc_admin: MX(0, MN(rc_admin_raw, rc_cap) - rc_fbn_relief)
    - result: RND(rc_gross - rc_admin, 2)
    compute_basis:
      rc_order: >-
        The order worked on is the order of the most recent seller-funded refund debit on the payments account.
      rc_fee_ref: >-
        The creditable variable fee of a refund credit is the variable final value fee billed on the order less every
        credit already booked on that fee record, administration fees included, and never below zero.
      rc_fee_date: >-
        The FBN refund relief is the same-day FBN refund relief when the refunded order's FBN outbound shipment is
        dated the same calendar day as its variable fee record, the FBN refund relief when that shipment is dated
        later, and nothing when the order has no FBN outbound shipment.
      rc_billed: >-
        The creditable variable fee of a refund credit is the variable final value fee billed on the order less every
        credit already booked on that fee record, administration fees included, and never below zero.
      rc_prior: >-
        The creditable variable fee of a refund credit is the variable final value fee billed on the order less every
        credit already booked on that fee record, administration fees included, and never below zero.
      rc_creditable: >-
        The creditable variable fee of a refund credit is the variable final value fee billed on the order less every
        credit already booked on that fee record, administration fees included, and never below zero.
      rc_refunded: >-
        The refunded share is the seller-funded refund debits for the order added together and divided by the order's
        fee basis, never above one.
      rc_basis: >-
        The refunded share is the seller-funded refund debits for the order added together and divided by the order's
        fee basis, never above one.
      rc_raw_share: >-
        The refunded share is the seller-funded refund debits for the order added together and divided by the order's
        fee basis, never above one.
      rc_share: >-
        For the variable fee credit, the refunded share is counted as one when the refunds reach at least the whole-order
        refund share of the fee basis, as half of the proportional share when they are no more than the small-refund
        share of the fee basis, and as the proportional share between the two.
      rc_gross: >-
        The refund credit is the creditable variable fee times the refunded share, rounded to the nearest cent, less
        the refund administration fee.
      rc_level: >-
        The refund administration fee rate is the top refund admin rate when the seller's performance level is one
        of the discount standing levels and the standing record carries no order defect dated within the last recent-defect
        months, the above refund admin rate when the level is Above Standard Level and no order defect is dated within
        those months, and the refund administration fee rate otherwise; the months are whole months counted back from
        the decision date.
      rc_defects: >-
        The refund administration fee rate is the top refund admin rate when the seller's performance level is one
        of the discount standing levels and the standing record carries no order defect dated within the last recent-defect
        months, the above refund admin rate when the level is Above Standard Level and no order defect is dated within
        those months, and the refund administration fee rate otherwise; the months are whole months counted back from
        the decision date.
      rc_rate: >-
        The refund administration fee rate is the top refund admin rate when the seller's performance level is one
        of the discount standing levels and the standing record carries no order defect dated within the last recent-defect
        months, the above refund admin rate when the level is Above Standard Level and no order defect is dated within
        those months, and the refund administration fee rate otherwise; the months are whole months counted back from
        the decision date.
      rc_cap: >-
        The refund administration fee cap is the large-order refund cap when the order's fee basis is at least the
        large-order basis, the mid-order refund cap when it is at least the mid-order basis but below the large-order
        basis, and the refund administration fee cap below the mid-order basis.
      rc_refunds_3m: >-
        The refund administration fee is multiplied by the frequent-refund multiplier when the payments account shows
        at least the frequent-refund count of seller-funded refund debits dated less than three whole months before
        the decision date, by the repeat-refund multiplier when it shows at least the repeat-refund count but fewer
        than the frequent-refund count, and by one when it shows fewer.
      rc_freq_mult: >-
        The refund administration fee is multiplied by the frequent-refund multiplier when the payments account shows
        at least the frequent-refund count of seller-funded refund debits dated less than three whole months before
        the decision date, by the repeat-refund multiplier when it shows at least the repeat-refund count but fewer
        than the frequent-refund count, and by one when it shows fewer.
      rc_tenure: >-
        The refund administration fee is also multiplied by the long-tenure refund multiplier when the selling plan
        was verified at least the long tenure months before the decision date, by the mid-tenure refund multiplier
        when it was verified at least the mid tenure months but fewer than the long tenure months before, and by one
        otherwise, the tenure being counted in whole months.
      rc_tenure_mult: >-
        The refund administration fee is also multiplied by the long-tenure refund multiplier when the selling plan
        was verified at least the long tenure months before the decision date, by the mid-tenure refund multiplier
        when it was verified at least the mid tenure months but fewer than the long tenure months before, and by one
        otherwise, the tenure being counted in whole months.
      rc_ship_date: >-
        The FBN refund relief is the same-day FBN refund relief when the refunded order's FBN outbound shipment is
        dated the same calendar day as its variable fee record, the FBN refund relief when that shipment is dated
        later, and nothing when the order has no FBN outbound shipment.
      rc_fbn_relief: >-
        The FBN refund relief is the same-day FBN refund relief when the refunded order's FBN outbound shipment is
        dated the same calendar day as its variable fee record, the FBN refund relief when that shipment is dated
        later, and nothing when the order has no FBN outbound shipment.
      rc_admin_raw: >-
        The refund administration fee is worked out as the refund credit before the fee times the rate times both
        multipliers, rounded to the nearest cent, and only then compared with the cap; the FBN refund relief is subtracted
        after the cap and never takes the fee below zero.
      rc_admin: >-
        The refund administration fee is worked out as the refund credit before the fee times the rate times both
        multipliers, rounded to the nearest cent, and only then compared with the cap; the FBN refund relief is subtracted
        after the cap and never takes the fee below zero.
      result: >-
        The refund credit is the creditable variable fee times the refunded share, rounded to the nearest cent, less
        the refund administration fee.
    factors:
    - id: refunded_share_rule
      effect: method
      decides: rc_share
      bindings:
      - rc_refunded
      - rc_raw_share
      - rc_share
      ladder:
      - when: the refunds reach at least the whole-order refund share of the fee basis
        method: the share is counted as one for the variable fee credit
      - when: the refunds are no more than the small-refund share of the fee basis
        method: the share is half of the proportional share
      - when: otherwise
        method: the share is the proportional share (refunds over fee basis)
      baseline:
        rc_share: rc_raw_share
      evidence:
      - cross_category
      - history
      cross_difficulty: payout
    - id: refund_admin_rate
      effect: parameter
      decides: rc_rate
      bindings:
      - rc_level
      - rc_defects
      - rc_rate
      ladder:
      - when: >-
          the level is one of the discount standing levels and no order defect is dated within the last recent-defect
          months
        value: K('top_refund_admin_rate')
      - when: >-
          the level is Above Standard Level and no order defect is dated within those months
        value: K('above_refund_admin_rate')
      - when: otherwise
        value: P('refund_admin_fee_rate')
      baseline:
        rc_rate: P('refund_admin_fee_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: standing
    - id: refund_admin_cap
      effect: parameter
      decides: rc_cap
      bindings:
      - rc_basis
      - rc_cap
      ladder:
      - when: the order's fee basis is at least the large-order basis
        value: K('large_order_refund_cap')
      - when: it is at least the mid-order basis but below the large-order basis
        value: K('mid_order_refund_cap')
      - when: otherwise
        value: P('refund_admin_fee_cap')
      baseline:
        rc_cap: P('refund_admin_fee_cap')
      evidence:
      - history
      cross_difficulty: null
    - id: refund_frequency_multiplier
      effect: parameter
      decides: rc_freq_mult
      bindings:
      - rc_refunds_3m
      - rc_freq_mult
      ladder:
      - when: >-
          at least the frequent-refund count of seller-funded refund debits dated less than three whole months before
          the decision date
        value: K('frequent_refund_multiplier')
      - when: at least the repeat-refund count but fewer than the frequent-refund count
        value: K('repeat_refund_multiplier')
      - when: otherwise
        value: '1'
      baseline:
        rc_freq_mult: '1'
      evidence:
      - cross_category
      - history
      cross_difficulty: payout
    - id: refund_tenure_multiplier
      effect: parameter
      decides: rc_tenure_mult
      bindings:
      - rc_tenure
      - rc_tenure_mult
      ladder:
      - when: >-
          the selling plan was verified at least the long tenure months before the decision date
        value: K('long_tenure_refund_multiplier')
      - when: >-
          it was verified at least the mid tenure months but fewer than the long tenure months before
        value: K('mid_tenure_refund_multiplier')
      - when: otherwise
        value: '1'
      baseline:
        rc_tenure_mult: '1'
      evidence:
      - date
      cross_difficulty: null
    - id: fbn_refund_relief
      effect: parameter
      decides: rc_fbn_relief
      bindings:
      - rc_ship_date
      - rc_fbn_relief
      ladder:
      - when: >-
          the refunded order's FBN outbound shipment is dated the same calendar day as its variable fee record
        value: K('same_day_fbn_refund_relief')
      - when: that shipment is dated later
        value: K('fbn_refund_relief')
      - when: otherwise (no FBN outbound shipment)
        value: '0'
      baseline:
        rc_fbn_relief: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: fulfill
    baseline:
      rule: >-
        The refund credit is the creditable variable fee times the refunded share, rounded to the nearest cent, less
        the refund administration fee. The creditable variable fee of a refund credit is the variable final value
        fee billed on the order less every credit already booked on that fee record, administration fees included,
        and never below zero. The refunded share is the seller-funded refund debits for the order added together and
        divided by the order's fee basis, never above one. The refund administration fee is the refund credit before
        the fee times the refund administration fee rate, rounded to the nearest cent, and capped at the refund administration
        fee cap.
      params:
      - refund_admin_fee_rate
      - refund_admin_fee_cap
    inputs:
      history:
      - category: payout
        table: payout_events
        aggregate: latest
        field: order_id
        filters:
          event_type: payout_refund_debit
      - category: payout
        table: payout_events
        aggregate: sum
        field: amount
        filters:
          event_type: payout_refund_debit
      - category: payout
        table: payout_events
        aggregate: count
        field: payout_event_id
        within_months: 3
        filters:
          event_type: payout_refund_debit
      - table: selling_fees
        aggregate: sum
        field: amount
        filters:
          event_type: selling_final_value_fee
          fee_type: final_value_variable
      - table: selling_fees
        aggregate: sum
        field: gross_credit_amount
        filters:
          event_type: selling_fee_credit
      - category: fulfill
        table: fulfill_events
        aggregate: latest
        field: event_date
        filters:
          event_type: fulfill_outbound_shipment
      cross_category:
      - payout
      - standing
      - fulfill
