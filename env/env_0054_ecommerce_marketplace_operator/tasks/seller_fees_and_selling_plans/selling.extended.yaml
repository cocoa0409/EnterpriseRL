      - cross_category
      cross_difficulty: payout
    - id: chargeback_tenure_multiplier
      effect: parameter
      decides: kc_tenure_mult
      bindings:
      - kc_tenure
      - kc_tenure_mult
      ladder:
      - when: >-
          the selling plan was verified at least the long tenure months before the decision date
        value: K('long_tenure_chargeback_multiplier')
      - when: >-
          it was verified at least the mid tenure months but fewer than the long tenure months before
        value: K('mid_tenure_chargeback_multiplier')
      - when: otherwise
        value: '1'
      baseline:
        kc_tenure_mult: '1'
      evidence:
      - date
      cross_difficulty: null
    - id: fbn_chargeback_relief
      effect: parameter
      decides: kc_fbn_relief
      bindings:
      - kc_ship_date
      - kc_fbn_relief
      ladder:
      - when: >-
          the order's FBN outbound shipment is dated the same calendar day as its variable fee record
        value: K('same_day_fbn_chargeback_relief')
      - when: the order's FBN outbound shipment is dated later
        value: K('fbn_chargeback_relief')
      - when: otherwise (no FBN outbound shipment)
        value: '0'
      baseline:
        kc_fbn_relief: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: fulfill
    baseline:
      rule: >-
        The chargeback credit is the creditable variable fee times the chargeback share, rounded to the nearest cent,
        less the chargeback administration fee. The creditable variable fee of a chargeback credit is the variable
        final value fee billed on the order less every credit already booked on that fee record, administration fees
        included, and never below zero. The chargeback share is the chargeback amount debited for the order divided
        by the order's fee basis, never above one. The chargeback administration fee is the chargeback credit before
        the fee times the refund administration fee rate, rounded to the nearest cent, and capped at the refund administration
        fee cap.
      params:
