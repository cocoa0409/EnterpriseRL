      kc_admin_raw: >-
        The chargeback administration fee is worked out as the chargeback credit before the fee times the rate times
        both multipliers, rounded to the nearest cent, and only then compared with the cap; the FBN chargeback relief
        is subtracted after the cap and never takes the fee below zero.
      kc_admin: >-
        The chargeback administration fee is worked out as the chargeback credit before the fee times the rate times
        both multipliers, rounded to the nearest cent, and only then compared with the cap; the FBN chargeback relief
        is subtracted after the cap and never takes the fee below zero.
      result: >-
        The chargeback credit is the creditable variable fee times the chargeback share, rounded to the nearest cent,
        less the chargeback administration fee.
    factors:
    - id: chargeback_share_rule
      effect: method
      decides: kc_share
      bindings:
      - kc_cb_amount
      - kc_raw_share
      - kc_share
      ladder:
      - when: >-
          the chargeback amount is at least the whole-order chargeback share of the fee basis
        method: the share is counted as one (the whole order)
      - when: the chargeback amount is below the minimum chargeback share of the fee basis
        method: the share is half of the proportional share
      - when: otherwise
        method: the share is the proportional share (chargeback amount over fee basis)
      baseline:
        kc_share: kc_raw_share
      evidence:
      - cross_category
      - history
      cross_difficulty: null
    - id: chargeback_admin_rate
      effect: parameter
      decides: kc_rate
      bindings:
      - kc_cb_count
      - kc_level
      - kc_rate
      ladder:
      - when: >-
          no more than the few-chargebacks count of chargeback debits dated less than twelve whole months before the
          decision date and the level is one of the discount standing levels
        value: K('low_chargeback_admin_rate')
      - when: no more than that count and the level is Above Standard Level
        value: K('mid_chargeback_admin_rate')
      - when: otherwise
        value: P('refund_admin_fee_rate')
