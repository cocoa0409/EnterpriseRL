events:
  - type: selling_plan_open
    target: selling_plans
    mutation: create
    meaning: "A seller opens a selling plan (Individual or a store tier) and enters verification."
    grain: "one row per selling plan"
    fields:
      selling_plan_id: "Selling plan reference."
      customer_id: "The seller."
      variant_name: "Plan chosen."
      opened_date: "Date the plan was opened."
      store_name: "Store name for store plans; empty for the Individual plan."
      billing_term: "Billing term chosen."
    triggers: []
  - type: selling_activate
    target: selling_plans
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: "Verification completes and the plan goes live."
    grain: "one row per transaction"
    fields:
      verified_date: "Date verification completed."
      term_start_date: "Start of the first billing period or term."
      term_end_date: "End of the annual term (empty on monthly and Individual)."
      next_billing_date: "Next date the subscription fee is billed."
    triggers:
      - event: selling:selling_subscription_fee
        when: {billing_term: [monthly, annual]}
        map: {subscription_charge_type: regular}
  - type: selling_subscription_fee
    target: selling_fees
    meaning: "The store subscription fee for one billing period, or the prorated upgrade charge for the rest of a period."
    grain: "one row per billing period per charge type"
    distinguish_by: [billing_period, subscription_charge_type]
    fields:
      selling_plan_id: "The plan billed."
      customer_id: "The seller."
      event_date: "Date billed."
      amount: "Fee billed, positive."
      billing_period: "Billing period the fee covers (month the period starts)."
      billing_term: "Term the fee was billed on."
      subscription_charge_type: "regular or upgrade_proration."
    account: net_fees_billed
    direction: in
    triggers:
      - event: payout:payout_fee_deduction
        map: {fee_source: selling, fee_event_ref: selling_event_id, amount: amount}
  - type: selling_insertion_fee
    target: selling_fees
    meaning: "A listing is created or renews; listings within the monthly allowance are booked at 0.00, the rest at the insertion fee."
    grain: "one row per listing per billing period"
    distinguish_by: [listing_id, billing_period]
    fields:
      selling_plan_id: "The plan."
      customer_id: "The seller."
      event_date: "Date the listing was created or renewed."
      amount: "Insertion fee, 0.00 within the allowance."
      listing_id: "Listing number."
      billing_period: "Calendar month the listing counts against."
    account: net_fees_billed
    direction: in
    triggers:
      - event: payout:payout_fee_deduction
        when: {amount: {not: 0.00}}
        map: {fee_source: selling, fee_event_ref: selling_event_id, amount: amount}
  - type: selling_final_value_fee
    target: selling_fees
    meaning: "A final value fee component is billed on a sold order."
    grain: "one row per order per fee component"
    distinguish_by: [order_id, fee_type]
    fields:
      selling_plan_id: "The plan."
      customer_id: "The seller."
      event_date: "Date billed (the order's capture date)."
      amount: "Fee component billed, positive."
      order_id: "Order the fee is charged on."
      fee_type: "final_value_variable, final_value_per_order or below_standard_surcharge."
      fee_category_group: "Fee group the order's item category maps to."
      standing_discount_applied: "Whether the standing discount reduced this component."
      fee_basis_amount: "Fee basis of the order: item subtotal plus shipping, tax excluded."
    account: net_fees_billed
    direction: in
    triggers:
      - event: payout:payout_fee_deduction
        map: {fee_source: selling, fee_event_ref: selling_event_id, amount: amount}
  - type: selling_fee_credit
    target: selling_fees
    meaning: "All or part of a billed fee is credited back to the seller."
    grain: "one row per credited fee record per credit reason"
    distinguish_by: [fee_event_ref, credit_reason]
    fields:
      selling_plan_id: "The plan."
      customer_id: "The seller."
      event_date: "Date credited."
      amount: "Credit, positive (after any refund administration fee)."
      order_id: "Order the credited fee was charged on (blank for non-order fees)."
      fee_event_ref: "The fee record being credited."
      credit_reason: "order_refund, order_cancellation or fee_dispute_upheld."
      gross_credit_amount: "Credit before the refund administration fee."
      refund_admin_fee_amount: "Refund administration fee withheld from the credit."
    account: net_fees_billed
    direction: out
    triggers:
      - event: payout:payout_fee_reversal
        map: {fee_source: selling, fee_event_ref: fee_event_ref, amount: amount}
  - type: selling_early_termination_fee
    target: selling_fees
    meaning: "An annual term is ended before its term end date and the early termination fee is billed."
    grain: "one row per early-terminated term"
    distinguish_by: [billing_period]
    fields:
      selling_plan_id: "The plan."
      customer_id: "The seller."
      event_date: "Date billed."
      amount: "Early termination fee, positive."
      billing_period: "Month the term was ended."
      remaining_term_months: "Whole committed months left in the term."
    account: net_fees_billed
    direction: in
    triggers:
      - event: payout:payout_fee_deduction
        map: {fee_source: selling, fee_event_ref: selling_event_id, amount: amount}
  - type: selling_plan_change
    target: selling_plans
    mutation: update
    meaning: "The seller moves to another plan or billing term."
    grain: "one row per transaction"
    fields:
      variant_name: "New plan."
      billing_term: "New billing term."
      store_name: "Store name (required when moving onto a store plan)."
      term_start_date: "Start of the new term when the term changes."
      term_end_date: "End of the new annual term."
      next_billing_date: "Next billing date after the change."
    triggers: []
  - type: selling_schedule_cancel
    target: selling_plans
    mutation: {transition: {from: active, to: cancel_scheduled}}
    meaning: "The seller schedules cancellation of the subscription."
    grain: "one row per transaction"
    fields:
      cancel_effective_date: "Date the cancellation will take effect."
    triggers: []
  - type: selling_withdraw_cancel
    target: selling_plans
    mutation: {transition: {from: cancel_scheduled, to: active}}
    meaning: "The seller withdraws the scheduled cancellation."
    grain: "one row per transaction"
    fields:
      cancel_effective_date: "Cleared (empty) when the cancellation is withdrawn."
    triggers: []
  - type: selling_close
    target: selling_plans
    mutation: {transition: [{from: cancel_scheduled, to: closed}, {from: active, to: closed}, {from: pending_verification, to: closed}, {from: restricted, to: closed}]}
    meaning: "The selling plan ends."
    grain: "one row per transaction"
    fields:
      closed_date: "Date the plan closed."
    triggers: []
  - type: selling_restrict
    target: selling_plans
    mutation: {transition: {from: active, to: restricted}}
    meaning: "The plan is restricted for past-due seller fees."
    grain: "one row per transaction"
    fields:
      restricted_date: "Date the restriction began."
    triggers: []
  - type: selling_lift_restriction
    target: selling_plans
    mutation: {transition: {from: restricted, to: active}}
    meaning: "The restriction is lifted after the past-due amount is cleared."
    grain: "one row per transaction"
    fields:
      restricted_date: "Cleared (empty) when the restriction is lifted."
    triggers: []

measures:
  - id: selling_msr_listings_in_period
    window: "One calendar month (the billing_period), first to last day inclusive."
    measure: "Count of selling_insertion_fee rows of the plan with that billing_period, booked before the listing being priced."
  - id: selling_msr_credited_on_fee
    window: "Lifetime of the credited fee record."
    measure: "Sum of amount plus refund_admin_fee_amount over selling_fee_credit rows whose fee_event_ref is the fee record."

policies:
  - id: selling_agg_multi_holding
    subject: [selling_plan_open]
    rule: >-
      A seller profile holds at most one selling plan at a time; a seller who wants a different plan changes the
      existing plan rather than opening a second one. A closed plan does not count, so a seller whose plan closed may
      open a new one.
    eligibility: []
    params: {max_per_customer: 1}
  - id: selling_onboarding
    subject: [selling_plan_open, selling_activate, selling_close]
    rule: >-
      A plan opens in pending_verification and goes live only when identity, tax and bank verification completes. A
      store plan requires a store name; the Individual plan has none. A plan whose minimum trailing 12-month sales is
      above zero may be opened only by a seller whose gross sales over the trailing 12 months meet it. A plan still in
      pending_verification when its verification deadline (counted in calendar days from opened_date) has passed is
      closed. Activation starts the first billing period; a store plan bills its first period in full on activation.
    eligibility: []
  - id: selling_subscription_billing
    subject: [selling_subscription_fee]
    rule: >-
      A store plan is billed its subscription fee once per billing period on the bill day, at the monthly term fee on
      the monthly term and the annual term monthly fee on the annual term; the Individual plan has no subscription
      fee. An annual term renews for another term at term end when annual auto-renew is true, unless a cancellation is
      scheduled. A plan in cancel_scheduled is still billed for every period that starts before the cancellation
      effective date. A restricted plan continues to be billed. Subscription fees are collected by deduction from the
      seller's payments balance.
    eligibility: []
    params:
      per_tier:
        "Individual Seller Plan": {monthly: "=monthly_term_fee", annual: "=annual_term_monthly_fee"}
        "Starter Store": {monthly: "=monthly_term_fee", annual: "=annual_term_monthly_fee"}
        "Basic Store": {monthly: "=monthly_term_fee", annual: "=annual_term_monthly_fee"}
        "Premium Store": {monthly: "=monthly_term_fee", annual: "=annual_term_monthly_fee"}
        "Anchor Store": {monthly: "=monthly_term_fee", annual: "=annual_term_monthly_fee"}
        "Enterprise Store": {monthly: "=monthly_term_fee", annual: "=annual_term_monthly_fee"}
  - id: selling_insertion_fees
    subject: [selling_insertion_fee]
    rule: >-
      Every new listing and every automatic renewal of a listing counts once against the plan's zero-insertion
      allowance of the calendar month it is created or renewed in. Listings up to the allowance are booked at 0.00;
      each listing beyond it is booked at the plan's insertion fee after allowance. The allowance is the plan held on
      the day the listing is created; an unused allowance never carries into the next month.
    eligibility: []
    measures: [selling_msr_listings_in_period]
    formula:
      insertion_fee: "0 if selling_msr_listings_in_period < zero_insertion_listings_per_month else insertion_fee_after_allowance"
  - id: selling_final_value_fees
    subject: [selling_final_value_fee]
    rule: >-
      When an order's payment is captured, the seller's plan on the order date bills final value fees on it. The
      variable component is the fee group rate (the item category mapped through the fee category map) on the fee
      basis up to the threshold, plus the above-threshold rate on any excess. The per-order component is the low fee
      when the fee basis is at or below the breakpoint and the high fee above it. When the seller's performance
      standing level on the order date is one of the discount standing levels and the order shipped within the
      discount's maximum handling business days, the variable component is reduced by the discount rate; the discount
      never touches the per-order fee or the surcharge. When the standing level on the order date is one of the
      surcharge standing levels, a separate below_standard_surcharge component of the surcharge rate times the fee
      basis is billed. A seller can never be at a discount level and a surcharge level at once, so discount and
      surcharge never apply to the same order.
    eligibility: []
    formula:
      group_rate: "fvf_rate_electronics_computers if fee_category_group == 'electronics_computers' else (fvf_rate_apparel_shoes if fee_category_group == 'apparel_shoes' else (fvf_rate_large_items if fee_category_group == 'large_items' else fvf_rate_most_categories))"
      variable_fee: "round((min(fee_basis_amount, fvf_threshold_per_order) * group_rate + max(fee_basis_amount - fvf_threshold_per_order, 0) * fvf_rate_above_threshold) * ((1 - top_rated_fvf_discount_rate) if standing_discount_applied else 1), 2)"
      per_order_fee: "per_order_fee_low if fee_basis_amount <= per_order_fee_breakpoint else per_order_fee_high"
      surcharge: "round(fee_basis_amount * below_standard_surcharge_rate, 2)"
  - id: selling_refund_fee_credit
    subject: [selling_fee_credit]
    rule: >-
      When the seller refunds the item on an order within the refund credit window counted in calendar days from the
      order date, the variable final value fee of that order is credited in proportion to the refunded share of the
      fee basis, less a refund administration fee of the admin rate times that credit, capped at the admin fee cap;
      the per-order fee is credited too when the whole order has been refunded. A refund on an order cancelled before
      shipment is credited in full with no administration fee. The below-standard surcharge is never credited. Credits
      on one fee record, administration fees included, never exceed the fee billed. Refunds funded by Northloop earn no
      credit because the seller never paid them.
    eligibility:
      - id: one_credit_per_fee_and_reason
        applies_to: [selling_fee_credit]
        kind: dedup
        condition: "Credits on one fee record, administration fees included, never exceed the fee billed."
        evidence_fields: [selling_fees.fee_event_ref, selling_fees.credit_reason, selling_fees.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [selling_fees.fee_event_ref, selling_fees.credit_reason]
          action_bindings:
            selling_fees.fee_event_ref: fee_event_ref
            selling_fees.credit_reason: credit_reason
        dedup_contract:
          table: selling_fees
          mode: separate_record
          object_bindings: {fee_event_ref: fee_event_ref, credit_reason: credit_reason}
          duplicate_filters: {event_type: [selling_fee_credit]}
          distinct_fields: []
    measures: [selling_msr_credited_on_fee]
    formula:
      refund_admin_fee_amount: "min(round(gross_credit_amount * refund_admin_fee_rate, 2), refund_admin_fee_cap)"
      net_credit: "gross_credit_amount - refund_admin_fee_amount"
  - id: selling_fee_disputes
    subject: [selling_fee_credit]
    rule: >-
      A seller may dispute a fee record no later than the fee dispute window counted in calendar days from that fee's
      event_date, and at most the disputes-per-fee limit may be filed on one fee record. A dispute is upheld only when
      the plan, order and listing records show the fee was billed wrongly: a fee on an order that was cancelled before
      capture, a fee group that does not match the item category map, a second record for the same order and fee
      type, a standing discount not applied although the standing level and handling time qualified, or an insertion
      fee on a listing that was within the allowance. An upheld dispute credits the overcharged difference with no
      administration fee; a rejected dispute books nothing.
    eligibility:
      - id: dispute_window
        applies_to: [selling_fee_credit]
        kind: time
        condition: "A seller may dispute a fee record no later than the fee dispute window counted in calendar days from that fee's event_date"
        evidence_fields: [selling_fees.event_date, selling_fees.selling_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [selling_fees.selling_event_id]
          action_bindings:
            selling_fees.selling_event_id: fee_event_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: "that fee's event_date"
          anchor_source: selling_fees.event_date
          relation: not_after
          duration_source: variants.fee_dispute_window_days
          unit: calendar_days
          counting_rule: "counted in calendar days from that fee's event_date"
          boundary: inclusive
  - id: selling_plan_change_rules
    subject: [selling_plan_change, selling_subscription_fee]
    rule: >-
      A move to a higher plan takes effect immediately and bills an upgrade_proration charge equal to the new plan's
      fee for the current term less the old plan's fee, times the remaining calendar days of the current billing
      period over the days in that period. A move to a lower plan, or from the annual to the monthly term, takes effect
      at the plan's downgrade effective point. An annual-term plan whose annual_downgrade_mid_term_allowed is false
      cannot move to a lower plan before its term ends; the seller either waits for the term end or ends the term
      early under the cancellation policy. Moving onto a store plan requires a store name. Moving onto a plan with a
      minimum trailing 12-month sales requires meeting it. A plan that is restricted cannot change plans until the
      restriction is lifted.
    eligibility:
      - id: not_restricted
        applies_to: [selling_plan_change]
        kind: state
        condition: "A plan that is restricted cannot change plans until the restriction is lifted."
        evidence_fields: [selling_plans.status, selling_plans.selling_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [selling_plans.selling_plan_id]
          action_bindings:
            selling_plans.selling_plan_id: selling_plan_id
        state_contract:
          field: selling_plans.status
          allowed: [active, cancel_scheduled]
  - id: selling_cancellation
    subject: [selling_schedule_cancel, selling_withdraw_cancel, selling_close, selling_early_termination_fee]
    rule: >-
      Cancelling a plan is the seller's own decision and is confirmed by the seller. The Individual plan closes
      immediately. A monthly-term store cancellation is scheduled for the end of the current billing period, and an
      annual-term store cancellation for the end of the term. A seller on an annual term may instead end the term
      immediately; the plan closes and an early termination fee of the early termination share times the remaining
      committed monthly fees (whole months from the next billing date to the term end) is billed. A scheduled
      cancellation may be withdrawn only before its effective date. Closing a plan never cancels fees already billed;
      they remain collectable from the payments balance.
    eligibility:
      - id: withdraw_before_effective
        applies_to: [selling_withdraw_cancel]
        kind: time
        condition: "A scheduled cancellation may be withdrawn only before its effective date."
        evidence_fields: [selling_plans.cancel_effective_date, selling_plans.selling_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [selling_plans.selling_plan_id]
          action_bindings:
            selling_plans.selling_plan_id: selling_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "its effective date"
          anchor_source: selling_plans.cancel_effective_date
          relation: not_after
          duration_source: params.withdraw_lead_days
          unit: calendar_days
          counting_rule: "only before its effective date"
          boundary: exclusive
    params:
      withdraw_lead_days: 0
      per_tier:
        "Individual Seller Plan": {early_termination_share: "=early_termination_fee_share"}
        "Starter Store": {early_termination_share: "=early_termination_fee_share"}
        "Basic Store": {early_termination_share: "=early_termination_fee_share"}
        "Premium Store": {early_termination_share: "=early_termination_fee_share"}
        "Anchor Store": {early_termination_share: "=early_termination_fee_share"}
        "Enterprise Store": {early_termination_share: "=early_termination_fee_share"}
    formula:
      early_termination_fee: "round(annual_term_monthly_fee * remaining_term_months * early_termination_fee_share, 2)"
  - id: selling_fee_collection
    subject: [selling_restrict, selling_lift_restriction, selling_close]
    rule: >-
      Seller fees are collected by deduction from the seller's Northloop Payments balance. A fee is past due while the
      seller's payments account shows a negative balance that the card on file has not cleared. A plan is restricted
      once the payments account has been negative for longer than the plan's restriction days, counted in calendar
      days from the date the balance first went negative. A restricted plan is returned to active once the payments
      account balance is zero or positive. A plan still restricted with the balance negative longer than the closure
      days after restriction is closed.
    eligibility: []

# ============================================================================
# extended_policies (seller_fees_and_selling_plans)
# ============================================================================
extended_policies:
  - id: selling_ext_discount_dispute_credit
    base_policy_refs:
    - selling_fee_disputes
    - selling_refund_fee_credit
    - selling_final_value_fees
    overwrite:
    - base_policy: selling_fee_disputes
      superseded_clause: An upheld dispute credits the overcharged difference with no administration fee
      replaced_by: >-
        The discount dispute credit is the variable final value fee billed on the disputed record times the discount
        dispute rate times the defect adjustment, rounded to the nearest cent, and no administration fee is withheld
        from it.
    - base_policy: selling_final_value_fees
      superseded_clause: >-
        When the seller's performance standing level on the order date is one of the discount standing levels and
        the order shipped within the discount's maximum handling business days, the variable component is reduced
        by the discount rate
      replaced_by: >-
        Where a level discount rate or a bonus below applies, the discount dispute rate is instead the level discount
        rate plus the volume bonus, the handling bonus and the tenure bonus, added together first and applied once
        to the variable fee billed; the bonuses never act on one another.
    trigger: state_due
    subject:
    - selling_fee_credit
    computes: credit_amount
    target_tool: uphold_fee_dispute_credit_4fd06f6c
    params:
      partner_discount_rate: 0.15
      top_rated_fbn_discount_rate: 0.12
      long_volume_window_months: 6
      fbn_volume_window_months: 3
      standard_volume_window_months: 1
      large_fbn_stock_units: 500
      high_volume_basis: 20000.0
      mid_volume_basis: 8000.0
      high_volume_bonus: 0.03
      mid_volume_bonus: 0.02
      same_day_handling_bonus: 0.01
      next_day_handling_bonus: 0.005
      long_tenure_months: 36
      mid_tenure_months: 24
      long_tenure_bonus: 0.02
      mid_tenure_bonus: 0.01
      claim_defect_multiplier: 0.5
      feedback_defect_multiplier: 0.75
    rule: >-
      A fee dispute submitted on the ground that the standing discount was not applied to the variable final value
      fee of an order is decided by working out the discount dispute credit, which is booked against the disputed
      variable fee record with the fee dispute upheld credit reason when the dispute is upheld, and the dispute is
      then marked upheld. The disputed record is the variable final value fee record named by the most recently submitted
      standing-discount dispute that is still awaiting a decision. The discount dispute credit is the variable final
      value fee billed on the disputed record times the discount dispute rate times the defect adjustment, rounded
      to the nearest cent, and no administration fee is withheld from it. The discount dispute rate is the standard
      top-rated discount rate, and the defect adjustment is one. Where a level discount rate or a bonus below applies,
      the discount dispute rate is instead the level discount rate plus the volume bonus, the handling bonus and the
      tenure bonus, added together first and applied once to the variable fee billed; the bonuses never act on one
      another. The performance level of a discount dispute credit is the level in force on the disputed fee record's
      date: the level recorded at the seller's latest standing evaluation when that evaluation is dated on or before
      the fee's date; when the latest evaluation is dated after the fee's date, no level in force on that date is
      on record and the level discount rate is the standard top-rated discount rate. The level discount rate of a
      discount dispute credit is the partner discount rate when the seller's performance level is Preferred Partner
      Level, the top-rated FBN discount rate when the level is Top Rated Level and an FBN outbound shipment is recorded
      for the disputed order, and the standard top-rated discount rate for any other seller. The fee basis behind
      the volume bonus of a discount dispute credit is measured over the volume window: the long volume window when
      the seller's FBN enrollment is active and holds at least the large FBN stock of units on hand, the FBN volume
      window when the FBN enrollment is active and holds fewer units than that, and the standard volume window when
      the seller has no active FBN enrollment; the window takes the variable final value fee records billed within
      that many whole months before the decision date. The volume bonus of a discount dispute credit is the high volume
      bonus when the fee basis of the variable final value fee records billed within the volume window is at least
      the high volume basis, the mid volume bonus when it is at least the mid volume basis but below the high volume
      basis, and nothing below the mid volume basis. The handling bonus of a discount dispute credit is the same-day
      handling bonus when the disputed order's FBN outbound shipment is dated the same calendar day as the disputed
      fee record, the next-day handling bonus when it is dated the following calendar day, and nothing when it is
      dated later or the order has no FBN outbound shipment. The tenure bonus of a discount dispute credit is the
      long-tenure bonus when the selling plan was verified at least the long tenure months before the decision date,
      the mid-tenure bonus when it was verified at least the mid tenure months but fewer than the long tenure months
      before, and nothing otherwise, the tenure being counted in whole months. The defect adjustment of a discount
      dispute credit is the claim defect multiplier when the seller's standing record carries a chargeback or guarantee
      claim defect for the disputed order, the feedback defect multiplier when it carries a negative feedback defect
      and no chargeback or guarantee claim defect for that order, and one when it carries no defect for that order.
      The discount dispute credit is never more than the variable fee billed on the disputed record less the credits
      already booked on that record, administration fees included.
    prerequisite: []
    cross_category:
    - category: standing
      as: branch
      reads:
      - variant_name
      - standing_events.defect_type
      note: >-
        The level discount rate reads the seller's performance level and the defect adjustment reads the defects recorded
        for the disputed order.
    - category: fulfill
      as: history
      reads:
      - status
      - units_on_hand
      - fulfill_events.event_date
      note: >-
        The level discount rate and the handling bonus read the order's FBN outbound shipment; the volume window reads
        the FBN enrollment's status and stock.
    compute:
    - dd_fee_ref: >-
        LATEST('selling_fee_disputes', 'fee_event_ref', date_field='created_at', dispute_status='submitted', dispute_reason='standing_discount_missing')
    - dd_billed: SUM('selling_fees', 'amount', selling_event_id=dd_fee_ref)
    - dd_order: LATEST('selling_fees', 'order_id', selling_event_id=dd_fee_ref)
    - dd_fee_date: LATEST('selling_fees', 'event_date', selling_event_id=dd_fee_ref)
    - dd_prior: >-
        SUM('selling_fees', 'gross_credit_amount', event_type='selling_fee_credit', fee_event_ref=dd_fee_ref)
    - dd_level: >-
        CFIELD('standing', 'variant_name') if CFIELD('standing', 'last_evaluation_date') <= dd_fee_date else 'no level
        on record'
    - dd_fbn_ships: >-
        XCOUNT('fulfill', 'fulfill_events', event_type='fulfill_outbound_shipment', order_id=dd_order)
    - dd_level_rate: >-
        K('partner_discount_rate') if dd_level == 'Preferred Partner Level' else (K('top_rated_fbn_discount_rate')
        if dd_level == 'Top Rated Level' and dd_fbn_ships > 0 else P('top_rated_fvf_discount_rate'))
    - dd_fbn_status: CFIELD('fulfill', 'status')
    - dd_fbn_units: CFIELD('fulfill', 'units_on_hand')
    - dd_volume_window: >-
        K('long_volume_window_months') if dd_fbn_status == 'active' and dd_fbn_units >= K('large_fbn_stock_units')
        else (K('fbn_volume_window_months') if dd_fbn_status == 'active' and dd_fbn_units < K('large_fbn_stock_units')
        else K('standard_volume_window_months'))
    - dd_window_basis: >-
        SUM('selling_fees', 'fee_basis_amount', within_months=dd_volume_window, event_type='selling_final_value_fee',
        fee_type='final_value_variable')
    - dd_volume_bonus: >-
        K('high_volume_bonus') if dd_window_basis >= K('high_volume_basis') else (K('mid_volume_bonus') if dd_window_basis
        >= K('mid_volume_basis') else 0)
    - dd_ship_date: >-
        XLATEST('fulfill', 'fulfill_events', 'event_date', event_type='fulfill_outbound_shipment', order_id=dd_order)
    - dd_handling_days: DAYS(dd_fee_date, dd_ship_date) if dd_ship_date else 99
    - dd_handling_bonus: >-
        K('same_day_handling_bonus') if dd_handling_days == 0 else (K('next_day_handling_bonus') if dd_handling_days
        == 1 else 0)
    - dd_tenure: MONTHS(F('verified_date'), NOW)
    - dd_tenure_bonus: >-
        K('long_tenure_bonus') if dd_tenure >= K('long_tenure_months') else (K('mid_tenure_bonus') if dd_tenure >=
        K('mid_tenure_months') else 0)
    - dd_claim_defects: >-
        XCOUNT('standing', 'standing_events', event_type='standing_defect_record', defect_type='chargeback', order_id=dd_order)
        + XCOUNT('standing', 'standing_events', event_type='standing_defect_record', defect_type='guarantee_claim',
        order_id=dd_order)
    - dd_feedback_defects: >-
        XCOUNT('standing', 'standing_events', event_type='standing_defect_record', defect_type='negative_feedback',
        order_id=dd_order)
    - dd_defect_mult: >-
        K('claim_defect_multiplier') if dd_claim_defects > 0 else (K('feedback_defect_multiplier') if dd_feedback_defects
        > 0 else 1)
    - dd_rate: dd_level_rate + dd_volume_bonus + dd_handling_bonus + dd_tenure_bonus
    - dd_raw: RND(dd_billed * dd_rate * dd_defect_mult, 2)
    - result: MN(dd_raw, MX(0, dd_billed - dd_prior))
    compute_basis:
      dd_fee_ref: >-
        The disputed record is the variable final value fee record named by the most recently submitted standing-discount
        dispute that is still awaiting a decision.
      dd_billed: >-
        The discount dispute credit is the variable final value fee billed on the disputed record times the discount
        dispute rate times the defect adjustment, rounded to the nearest cent, and no administration fee is withheld
        from it.
      dd_level: >-
        The performance level of a discount dispute credit is the level in force on the disputed fee record's date:
        the level recorded at the seller's latest standing evaluation when that evaluation is dated on or before the
        fee's date; when the latest evaluation is dated after the fee's date, no level in force on that date is on
        record and the level discount rate is the standard top-rated discount rate.
      dd_fbn_ships: >-
        The level discount rate of a discount dispute credit is the partner discount rate when the seller's performance
        level is Preferred Partner Level, the top-rated FBN discount rate when the level is Top Rated Level and an
        FBN outbound shipment is recorded for the disputed order, and the standard top-rated discount rate for any
        other seller.
      dd_level_rate: >-
        The level discount rate of a discount dispute credit is the partner discount rate when the seller's performance
        level is Preferred Partner Level, the top-rated FBN discount rate when the level is Top Rated Level and an
        FBN outbound shipment is recorded for the disputed order, and the standard top-rated discount rate for any
        other seller.
      dd_fbn_status: >-
        The fee basis behind the volume bonus of a discount dispute credit is measured over the volume window: the
        long volume window when the seller's FBN enrollment is active and holds at least the large FBN stock of units
        on hand, the FBN volume window when the FBN enrollment is active and holds fewer units than that, and the
        standard volume window when the seller has no active FBN enrollment; the window takes the variable final value
        fee records billed within that many whole months before the decision date.
      dd_fbn_units: >-
        The fee basis behind the volume bonus of a discount dispute credit is measured over the volume window: the
        long volume window when the seller's FBN enrollment is active and holds at least the large FBN stock of units
        on hand, the FBN volume window when the FBN enrollment is active and holds fewer units than that, and the
        standard volume window when the seller has no active FBN enrollment; the window takes the variable final value
        fee records billed within that many whole months before the decision date.
      dd_volume_window: >-
        The fee basis behind the volume bonus of a discount dispute credit is measured over the volume window: the
        long volume window when the seller's FBN enrollment is active and holds at least the large FBN stock of units
        on hand, the FBN volume window when the FBN enrollment is active and holds fewer units than that, and the
        standard volume window when the seller has no active FBN enrollment; the window takes the variable final value
        fee records billed within that many whole months before the decision date.
      dd_window_basis: >-
        The volume bonus of a discount dispute credit is the high volume bonus when the fee basis of the variable
        final value fee records billed within the volume window is at least the high volume basis, the mid volume
        bonus when it is at least the mid volume basis but below the high volume basis, and nothing below the mid
        volume basis.
      dd_volume_bonus: >-
        The volume bonus of a discount dispute credit is the high volume bonus when the fee basis of the variable
        final value fee records billed within the volume window is at least the high volume basis, the mid volume
        bonus when it is at least the mid volume basis but below the high volume basis, and nothing below the mid
        volume basis.
      dd_ship_date: >-
        The handling bonus of a discount dispute credit is the same-day handling bonus when the disputed order's FBN
        outbound shipment is dated the same calendar day as the disputed fee record, the next-day handling bonus when
        it is dated the following calendar day, and nothing when it is dated later or the order has no FBN outbound
        shipment.
      dd_handling_days: >-
        The handling bonus of a discount dispute credit is the same-day handling bonus when the disputed order's FBN
        outbound shipment is dated the same calendar day as the disputed fee record, the next-day handling bonus when
        it is dated the following calendar day, and nothing when it is dated later or the order has no FBN outbound
        shipment.
      dd_handling_bonus: >-
        The handling bonus of a discount dispute credit is the same-day handling bonus when the disputed order's FBN
        outbound shipment is dated the same calendar day as the disputed fee record, the next-day handling bonus when
        it is dated the following calendar day, and nothing when it is dated later or the order has no FBN outbound
        shipment.
      dd_tenure: >-
        The tenure bonus of a discount dispute credit is the long-tenure bonus when the selling plan was verified
        at least the long tenure months before the decision date, the mid-tenure bonus when it was verified at least
        the mid tenure months but fewer than the long tenure months before, and nothing otherwise, the tenure being
        counted in whole months.
      dd_tenure_bonus: >-
        The tenure bonus of a discount dispute credit is the long-tenure bonus when the selling plan was verified
        at least the long tenure months before the decision date, the mid-tenure bonus when it was verified at least
        the mid tenure months but fewer than the long tenure months before, and nothing otherwise, the tenure being
        counted in whole months.
      dd_claim_defects: >-
        The defect adjustment of a discount dispute credit is the claim defect multiplier when the seller's standing
        record carries a chargeback or guarantee claim defect for the disputed order, the feedback defect multiplier
        when it carries a negative feedback defect and no chargeback or guarantee claim defect for that order, and
        one when it carries no defect for that order.
      dd_feedback_defects: >-
        The defect adjustment of a discount dispute credit is the claim defect multiplier when the seller's standing
        record carries a chargeback or guarantee claim defect for the disputed order, the feedback defect multiplier
        when it carries a negative feedback defect and no chargeback or guarantee claim defect for that order, and
        one when it carries no defect for that order.
      dd_defect_mult: >-
        The defect adjustment of a discount dispute credit is the claim defect multiplier when the seller's standing
        record carries a chargeback or guarantee claim defect for the disputed order, the feedback defect multiplier
        when it carries a negative feedback defect and no chargeback or guarantee claim defect for that order, and
        one when it carries no defect for that order.
      dd_rate: >-
        Where a level discount rate or a bonus below applies, the discount dispute rate is instead the level discount
        rate plus the volume bonus, the handling bonus and the tenure bonus, added together first and applied once
        to the variable fee billed; the bonuses never act on one another.
      result: >-
        The discount dispute credit is never more than the variable fee billed on the disputed record less the credits
        already booked on that record, administration fees included.
      dd_prior: >-
        The discount dispute credit is never more than the variable fee billed on the disputed record less the credits
        already booked on that record, administration fees included.
      dd_raw: >-
        The discount dispute credit is the variable final value fee billed on the disputed record times the discount
        dispute rate times the defect adjustment, rounded to the nearest cent, and no administration fee is withheld
        from it.
    factors:
    - id: level_discount_rate
      effect: parameter
      decides: dd_level_rate
      bindings:
      - dd_level
      - dd_fbn_ships
      - dd_level_rate
      ladder:
      - when: the seller's performance level is Preferred Partner Level
        value: K('partner_discount_rate')
      - when: >-
          the level is Top Rated Level and an FBN outbound shipment is recorded for the disputed order
        value: K('top_rated_fbn_discount_rate')
      - when: otherwise
        value: P('top_rated_fvf_discount_rate')
      baseline:
        dd_level_rate: P('top_rated_fvf_discount_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: standing
    - id: volume_window
      effect: method
      decides: dd_volume_window
      bindings:
      - dd_fbn_status
      - dd_fbn_units
      - dd_volume_window
      ladder:
      - when: >-
          the FBN enrollment is active and holds at least the large FBN stock of units on hand
        method: >-
          the fee basis is summed over the variable fee records of the last long volume window of whole months
      - when: the FBN enrollment is active and holds fewer units than the large FBN stock
        method: >-
          the fee basis is summed over the variable fee records of the last FBN volume window of whole months
      - when: otherwise (no active FBN enrollment)
        method: >-
          the fee basis is summed over the variable fee records of the last standard volume window of whole months
      baseline:
        dd_volume_window: K('standard_volume_window_months')
      evidence:
      - cross_category
      cross_difficulty: fulfill
    - id: volume_bonus
      effect: parameter
      decides: dd_volume_bonus
      bindings:
      - dd_window_basis
      - dd_volume_bonus
      ladder:
      - when: fee basis billed within the volume window is at least the high volume basis
        value: K('high_volume_bonus')
      - when: it is at least the mid volume basis but below the high volume basis
        value: K('mid_volume_bonus')
      - when: otherwise
        value: '0'
      baseline:
        dd_volume_bonus: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: handling_bonus
      effect: parameter
      decides: dd_handling_bonus
      bindings:
      - dd_ship_date
      - dd_handling_days
      - dd_handling_bonus
      ladder:
      - when: >-
          the order's FBN outbound shipment is dated the same calendar day as the disputed fee record
        value: K('same_day_handling_bonus')
      - when: it is dated the following calendar day
        value: K('next_day_handling_bonus')
      - when: otherwise (later, or no FBN outbound shipment)
        value: '0'
      baseline:
        dd_handling_bonus: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: fulfill
    - id: tenure_bonus
      effect: parameter
      decides: dd_tenure_bonus
      bindings:
      - dd_tenure
      - dd_tenure_bonus
      ladder:
      - when: >-
          the selling plan was verified at least the long tenure months before the decision date
        value: K('long_tenure_bonus')
      - when: >-
          it was verified at least the mid tenure months but fewer than the long tenure months before
        value: K('mid_tenure_bonus')
      - when: otherwise
        value: '0'
      baseline:
        dd_tenure_bonus: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: defect_adjustment
      effect: parameter
      decides: dd_defect_mult
      bindings:
      - dd_claim_defects
      - dd_feedback_defects
      - dd_defect_mult
      ladder:
      - when: >-
          the standing record carries a chargeback or guarantee claim defect for the disputed order
        value: K('claim_defect_multiplier')
      - when: >-
          it carries a negative feedback defect and no chargeback or guarantee claim defect for that order
        value: K('feedback_defect_multiplier')
      - when: otherwise (no defect for that order)
        value: '1'
      baseline:
        dd_defect_mult: '1'
      evidence:
      - cross_category
      - history
      cross_difficulty: standing
    baseline:
      rule: >-
        The discount dispute credit is the variable final value fee billed on the disputed record times the discount
        dispute rate times the defect adjustment, rounded to the nearest cent, and no administration fee is withheld
        from it. The discount dispute rate is the standard top-rated discount rate, and the defect adjustment is one.
      params:
      - top_rated_fvf_discount_rate
    inputs:
      history:
      - table: selling_fee_disputes
        aggregate: latest
        field: fee_event_ref
        filters:
          dispute_status: submitted
          dispute_reason: standing_discount_missing
      - table: selling_fees
        aggregate: sum
        field: amount
        filters:
          selling_event_id: <disputed record>
      - table: selling_fees
        aggregate: sum
        field: fee_basis_amount
        within_months: volume window
        filters:
          event_type: selling_final_value_fee
          fee_type: final_value_variable
      - category: fulfill
        table: fulfill_events
        aggregate: latest
        field: event_date
        filters:
          event_type: fulfill_outbound_shipment
      - category: standing
        table: standing_events
        aggregate: count
        field: standing_event_id
        filters:
          event_type: standing_defect_record
      cross_category:
      - standing
      - fulfill
  - id: selling_ext_term_change_fee
    base_policy_refs:
    - selling_plan_change_rules
    - selling_cancellation
    overwrite:
    - base_policy: selling_plan_change_rules
      superseded_clause: >-
        A move to a lower plan, or from the annual to the monthly term, takes effect at the plan's downgrade effective
        point.
      replaced_by: >-
        A store held on the annual term may move to the monthly term of the same plan before its annual term ends;
        the move is the seller's own decision, it takes effect at the plan's downgrade effective point, and because
        the annual-term saving was given in return for the whole term, a term change fee is billed on the move.
    trigger: on_request
    subject:
    - selling_plan_change
    - selling_early_termination_fee
    computes: term_change_fee
    target_tool: switch_store_to_monthly_term_ae40bf8f
    params:
      long_tenure_months: 36
      mid_tenure_months: 24
      long_tenure_lookback: 3
      mid_tenure_lookback: 6
      high_net_fee_threshold: 4000.0
      mid_net_fee_threshold: 1500.0
      high_volume_relief: 0.3
      mid_volume_relief: 0.15
      top_standing_relief: 0.2
      above_standing_relief: 0.1
      premium_payout_relief: 0.1
      daily_payout_relief: 0.05
      large_fbn_stock_units: 500
      large_stock_fbn_multiplier: 0.5
      fbn_multiplier: 0.8
    rule: >-
      A store held on the annual term may move to the monthly term of the same plan before its annual term ends; the
      move is the seller's own decision, it takes effect at the plan's downgrade effective point, and because the
      annual-term saving was given in return for the whole term, a term change fee is billed on the move. The term
      change fee is not worked out until every chargeback debited to the seller's payments account in the last twelve
      months carries its chargeback credit on the order's variable final value fee record. The term change fee is
      worked out only after every order the seller cancelled before shipment in the last twelve months carries its
      cancellation credit on the order's variable final value fee record. The term change fee repays the annual-term
      saving: it is the plan's monthly term fee less its annual term monthly fee, times the number of regular subscription
      charges billed on the annual term in the current term, times the repayment share, rounded to the nearest cent;
      the repayment share is one. The regular charges of the current term are those billed in the whole months from
      the term start date through the decision date. The number of regular charges repaid in a term change fee is
      capped by a lookback: only the long-tenure lookback count of charges is repaid when the selling plan was verified
      at least the long tenure months before the decision date, only the mid-tenure lookback count when it was verified
      at least the mid tenure months but fewer than the long tenure months before, and every regular charge of the
      current term otherwise, the tenure being counted in whole months. Where a relief below applies, the repayment
      share of a term change fee is one less the volume relief, the standing relief and the payout plan relief, which
      are added together first and taken from one once. The volume relief of a term change fee is the high volume
      relief when the plan's net seller fees over the last twelve whole months are at least the high net-fee threshold,
      the mid volume relief when they are at least the mid net-fee threshold but below the high net-fee threshold,
      and nothing below the mid net-fee threshold; net seller fees are the subscription, insertion, final value and
      early termination fees billed less the fee credits booked, each counted when its billing date is less than twelve
      whole months before the decision date. The standing relief of a term change fee is the top standing relief when
      the seller's performance level is one of the discount standing levels and the standing record shows no active
      violation points, the above standing relief when the level is Above Standard Level and no active violation points
      are shown, and nothing otherwise. The payout plan relief of a term change fee is the premium payout relief when
      the seller's payments account is on Payments Daily Plus or Payments Enterprise and its balance is zero or positive,
      the daily payout relief when it is on Payments Daily and its balance is zero or positive, and nothing otherwise.
      The term change fee is finally multiplied by the large-stock FBN multiplier when the seller's FBN enrollment
      is active and holds at least the large FBN stock of units on hand, by the FBN multiplier when it is active and
      holds some units but fewer than that, and by one otherwise.
    prerequisite:
    - problem: selling_ext_chargeback_fee_credit
      kind: value_input
      gate: tc_net_fees
      form: state
      policy_source: >-
        The term change fee is not worked out until every chargeback debited to the seller's payments account in the
        last twelve months carries its chargeback credit on the order's variable final value fee record.
      condition: >-
        The variable final value fee record of the order of every payout chargeback debit dated within the last twelve
        months carries a seller fee credit booked with the order refund credit reason.
      resolved_by: book_chargeback_fee_credit_32d8a153
      effect: >-
        Booking the chargeback credit lowers the plan's net seller fees over the last twelve months (tc_net_fees)
        by the credit, which can move the volume relief to a lower tier.
    - problem: selling_ext_cancellation_fee_credit
      kind: value_input
      gate: tc_net_fees
      form: state
      policy_source: >-
        The term change fee is worked out only after every order the seller cancelled before shipment in the last
        twelve months carries its cancellation credit on the order's variable final value fee record.
      condition: >-
        The variable final value fee record of the order of every seller cancellation defect dated within the last
        twelve months carries a seller fee credit booked with the order cancellation credit reason.
      resolved_by: book_cancellation_fee_credit_79bf63bc
      effect: >-
        Booking the cancellation credit lowers the plan's net seller fees over the last twelve months (tc_net_fees)
        by the credit, which can move the volume relief to a lower tier.
    cross_category:
    - category: standing
      as: branch
      reads:
      - variant_name
      - violation_points
      note: >-
        The standing relief reads the seller's performance level and active violation points.
    - category: payout
      as: branch
      reads:
      - variant_name
      - balance
      note: The payout plan relief reads the payments account's plan and balance.
    - category: fulfill
      as: branch
      reads:
      - status
      - units_on_hand
      note: The FBN multiplier reads the FBN enrollment's status and units on hand.
    compute:
    - tc_gap: P('monthly_term_fee') - P('annual_term_monthly_fee')
    - tc_term_window: MONTHS(F('term_start_date'), NOW) + 1
    - tc_charges_in_term: >-
        COUNT('selling_fees', within_months=tc_term_window, event_type='selling_subscription_fee', subscription_charge_type='regular',
        billing_term='annual')
    - tc_tenure: MONTHS(F('verified_date'), NOW)
    - tc_charges_repaid: >-
        MN(tc_charges_in_term, K('long_tenure_lookback')) if tc_tenure >= K('long_tenure_months') else (MN(tc_charges_in_term,
        K('mid_tenure_lookback')) if tc_tenure >= K('mid_tenure_months') else tc_charges_in_term)
    - tc_net_fees: >-
        SUM('selling_fees', 'amount', within_months=12, event_type='selling_subscription_fee') + SUM('selling_fees',
        'amount', within_months=12, event_type='selling_insertion_fee') + SUM('selling_fees', 'amount', within_months=12,
        event_type='selling_final_value_fee') + SUM('selling_fees', 'amount', within_months=12, event_type='selling_early_termination_fee')
        - SUM('selling_fees', 'amount', within_months=12, event_type='selling_fee_credit')
    - tc_volume_relief: >-
        K('high_volume_relief') if tc_net_fees >= K('high_net_fee_threshold') else (K('mid_volume_relief') if tc_net_fees
        >= K('mid_net_fee_threshold') else 0)
    - tc_level: CFIELD('standing', 'variant_name')
    - tc_points: CFIELD('standing', 'violation_points')
    - tc_standing_relief: >-
        K('top_standing_relief') if tc_level in P('discount_standing_levels') and tc_points == 0 else (K('above_standing_relief')
        if tc_level == 'Above Standard Level' and tc_points == 0 else 0)
    - tc_payout_plan: CFIELD('payout', 'variant_name')
    - tc_payout_balance: CFIELD('payout', 'balance')
    - tc_payout_relief: >-
        K('premium_payout_relief') if (tc_payout_plan == 'Payments Daily Plus' or tc_payout_plan == 'Payments Enterprise')
        and tc_payout_balance >= 0 else (K('daily_payout_relief') if tc_payout_plan == 'Payments Daily' and tc_payout_balance
        >= 0 else 0)
    - tc_fbn_status: CFIELD('fulfill', 'status')
    - tc_fbn_units: CFIELD('fulfill', 'units_on_hand')
    - tc_fbn_mult: >-
        K('large_stock_fbn_multiplier') if tc_fbn_status == 'active' and tc_fbn_units >= K('large_fbn_stock_units')
        else (K('fbn_multiplier') if tc_fbn_status == 'active' and tc_fbn_units > 0 else 1)
    - tc_share: 1 - (tc_volume_relief + tc_standing_relief + tc_payout_relief)
    - result: RND(tc_gap * tc_charges_repaid * tc_share * tc_fbn_mult, 2)
    compute_basis:
      tc_gap: >-
        The term change fee repays the annual-term saving: it is the plan's monthly term fee less its annual term
        monthly fee, times the number of regular subscription charges billed on the annual term in the current term,
        times the repayment share, rounded to the nearest cent; the repayment share is one.
      tc_term_window: >-
        The regular charges of the current term are those billed in the whole months from the term start date through
        the decision date.
      tc_charges_in_term: >-
        The regular charges of the current term are those billed in the whole months from the term start date through
        the decision date.
      tc_tenure: >-
        The number of regular charges repaid in a term change fee is capped by a lookback: only the long-tenure lookback
        count of charges is repaid when the selling plan was verified at least the long tenure months before the decision
        date, only the mid-tenure lookback count when it was verified at least the mid tenure months but fewer than
        the long tenure months before, and every regular charge of the current term otherwise, the tenure being counted
        in whole months.
      tc_charges_repaid: >-
        The number of regular charges repaid in a term change fee is capped by a lookback: only the long-tenure lookback
        count of charges is repaid when the selling plan was verified at least the long tenure months before the decision
        date, only the mid-tenure lookback count when it was verified at least the mid tenure months but fewer than
        the long tenure months before, and every regular charge of the current term otherwise, the tenure being counted
        in whole months.
      tc_net_fees: >-
        The volume relief of a term change fee is the high volume relief when the plan's net seller fees over the
        last twelve whole months are at least the high net-fee threshold, the mid volume relief when they are at least
        the mid net-fee threshold but below the high net-fee threshold, and nothing below the mid net-fee threshold;
        net seller fees are the subscription, insertion, final value and early termination fees billed less the fee
        credits booked, each counted when its billing date is less than twelve whole months before the decision date.
      tc_volume_relief: >-
        The volume relief of a term change fee is the high volume relief when the plan's net seller fees over the
        last twelve whole months are at least the high net-fee threshold, the mid volume relief when they are at least
        the mid net-fee threshold but below the high net-fee threshold, and nothing below the mid net-fee threshold;
        net seller fees are the subscription, insertion, final value and early termination fees billed less the fee
        credits booked, each counted when its billing date is less than twelve whole months before the decision date.
      tc_level: >-
        The standing relief of a term change fee is the top standing relief when the seller's performance level is
        one of the discount standing levels and the standing record shows no active violation points, the above standing
        relief when the level is Above Standard Level and no active violation points are shown, and nothing otherwise.
      tc_points: >-
        The standing relief of a term change fee is the top standing relief when the seller's performance level is
        one of the discount standing levels and the standing record shows no active violation points, the above standing
        relief when the level is Above Standard Level and no active violation points are shown, and nothing otherwise.
      tc_standing_relief: >-
        The standing relief of a term change fee is the top standing relief when the seller's performance level is
        one of the discount standing levels and the standing record shows no active violation points, the above standing
        relief when the level is Above Standard Level and no active violation points are shown, and nothing otherwise.
      tc_payout_plan: >-
        The payout plan relief of a term change fee is the premium payout relief when the seller's payments account
        is on Payments Daily Plus or Payments Enterprise and its balance is zero or positive, the daily payout relief
        when it is on Payments Daily and its balance is zero or positive, and nothing otherwise.
      tc_payout_balance: >-
        The payout plan relief of a term change fee is the premium payout relief when the seller's payments account
        is on Payments Daily Plus or Payments Enterprise and its balance is zero or positive, the daily payout relief
        when it is on Payments Daily and its balance is zero or positive, and nothing otherwise.
      tc_payout_relief: >-
        The payout plan relief of a term change fee is the premium payout relief when the seller's payments account
        is on Payments Daily Plus or Payments Enterprise and its balance is zero or positive, the daily payout relief
        when it is on Payments Daily and its balance is zero or positive, and nothing otherwise.
      tc_fbn_status: >-
        The term change fee is finally multiplied by the large-stock FBN multiplier when the seller's FBN enrollment
        is active and holds at least the large FBN stock of units on hand, by the FBN multiplier when it is active
        and holds some units but fewer than that, and by one otherwise.
      tc_fbn_units: >-
        The term change fee is finally multiplied by the large-stock FBN multiplier when the seller's FBN enrollment
        is active and holds at least the large FBN stock of units on hand, by the FBN multiplier when it is active
        and holds some units but fewer than that, and by one otherwise.
      tc_fbn_mult: >-
        The term change fee is finally multiplied by the large-stock FBN multiplier when the seller's FBN enrollment
        is active and holds at least the large FBN stock of units on hand, by the FBN multiplier when it is active
        and holds some units but fewer than that, and by one otherwise.
      tc_share: >-
        Where a relief below applies, the repayment share of a term change fee is one less the volume relief, the
        standing relief and the payout plan relief, which are added together first and taken from one once.
      result: >-
        The term change fee repays the annual-term saving: it is the plan's monthly term fee less its annual term
        monthly fee, times the number of regular subscription charges billed on the annual term in the current term,
        times the repayment share, rounded to the nearest cent; the repayment share is one.
    factors:
    - id: repaid_charge_lookback
      effect: method
      decides: tc_charges_repaid
      bindings:
      - tc_tenure
      - tc_charges_repaid
      ladder:
      - when: >-
          the selling plan was verified at least the long tenure months before the decision date
        method: only the long-tenure lookback count of the term's regular charges is repaid
      - when: >-
          it was verified at least the mid tenure months but fewer than the long tenure months before
        method: only the mid-tenure lookback count of the term's regular charges is repaid
      - when: otherwise
        method: every regular charge of the current term is repaid
      baseline:
        tc_charges_repaid: tc_charges_in_term
      evidence:
      - date
      - history
      cross_difficulty: null
    - id: volume_relief
      effect: parameter
      decides: tc_volume_relief
      bindings:
      - tc_net_fees
      - tc_volume_relief
      ladder:
      - when: >-
          net seller fees dated less than twelve whole months before the decision date are at least the high net-fee
          threshold
        value: K('high_volume_relief')
      - when: they are at least the mid net-fee threshold but below the high net-fee threshold
        value: K('mid_volume_relief')
      - when: otherwise
        value: '0'
      baseline:
        tc_volume_relief: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: standing_relief
      effect: parameter
      decides: tc_standing_relief
      bindings:
      - tc_level
      - tc_points
      - tc_standing_relief
      ladder:
      - when: >-
          the level is one of the discount standing levels and no active violation points are shown
        value: K('top_standing_relief')
      - when: the level is Above Standard Level and no active violation points are shown
        value: K('above_standing_relief')
      - when: otherwise
        value: '0'
      baseline:
        tc_standing_relief: '0'
      evidence:
      - cross_category
      cross_difficulty: standing
    - id: payout_plan_relief
      effect: parameter
      decides: tc_payout_relief
      bindings:
      - tc_payout_plan
      - tc_payout_balance
      - tc_payout_relief
      ladder:
      - when: >-
          the payments account is on Payments Daily Plus or Payments Enterprise and its balance is zero or positive
        value: K('premium_payout_relief')
      - when: it is on Payments Daily and its balance is zero or positive
        value: K('daily_payout_relief')
      - when: otherwise
        value: '0'
      baseline:
        tc_payout_relief: '0'
      evidence:
      - cross_category
      cross_difficulty: payout
    - id: fbn_stock_multiplier
      effect: parameter
      decides: tc_fbn_mult
      bindings:
      - tc_fbn_status
      - tc_fbn_units
      - tc_fbn_mult
      ladder:
      - when: >-
          the FBN enrollment is active and holds at least the large FBN stock of units on hand
        value: K('large_stock_fbn_multiplier')
      - when: it is active and holds some units but fewer than the large FBN stock
        value: K('fbn_multiplier')
      - when: otherwise
        value: '1'
      baseline:
        tc_fbn_mult: '1'
      evidence:
      - cross_category
      cross_difficulty: fulfill
    baseline:
      rule: >-
        The term change fee repays the annual-term saving: it is the plan's monthly term fee less its annual term
        monthly fee, times the number of regular subscription charges billed on the annual term in the current term,
        times the repayment share, rounded to the nearest cent; the repayment share is one. The regular charges of
        the current term are those billed in the whole months from the term start date through the decision date.
      params:
      - monthly_term_fee
      - annual_term_monthly_fee
    inputs:
      history:
      - table: selling_fees
        aggregate: count
        field: selling_event_id
        within_months: current term
        filters:
          event_type: selling_subscription_fee
          subscription_charge_type: regular
          billing_term: annual
      - table: selling_fees
        aggregate: sum
        field: amount
        within_months: 12
        filters:
          event_type: fees and credits
      cross_category:
      - standing
      - payout
      - fulfill
  - id: selling_ext_chargeback_fee_credit
    base_policy_refs:
    - selling_refund_fee_credit
    - selling_fee_disputes
    - selling_final_value_fees
    overwrite:
    - base_policy: selling_refund_fee_credit
      superseded_clause: >-
        When the seller refunds the item on an order within the refund credit window counted in calendar days from
        the order date, the variable final value fee of that order is credited in proportion to the refunded share
        of the fee basis, less a refund administration fee of the admin rate times that credit, capped at the admin
        fee cap
      replaced_by: >-
        A chargeback that the seller is liable for and that is debited to the seller's Northloop Payments account
        earns a chargeback credit on the variable final value fee record of the charged-back order, booked with the
        order refund credit reason, because the buyer's money has left the seller's balance just as on a refund.
    trigger: state_due
    subject:
    - selling_fee_credit
    computes: credit_amount
    target_tool: book_chargeback_fee_credit_32d8a153
    params:
      whole_order_chargeback_share: 0.9
      minimum_chargeback_share: 0.2
      small_chargeback_share_factor: 0.5
      low_chargeback_admin_rate: 0.1
      mid_chargeback_admin_rate: 0.15
      few_chargebacks_count: 1
      large_order_chargeback_cap: 10.0
      mid_order_chargeback_cap: 7.5
      large_order_basis: 1000.0
      mid_order_basis: 250.0
      quick_chargeback_days: 14
      mid_chargeback_days: 45
      quick_chargeback_multiplier: 1.5
      mid_chargeback_multiplier: 1.25
      long_tenure_months: 36
      mid_tenure_months: 24
      long_tenure_chargeback_multiplier: 0.5
      mid_tenure_chargeback_multiplier: 0.75
      same_day_fbn_chargeback_relief: 3.0
      fbn_chargeback_relief: 1.5
    rule: >-
      A chargeback that the seller is liable for and that is debited to the seller's Northloop Payments account earns
      a chargeback credit on the variable final value fee record of the charged-back order, booked with the order
      refund credit reason, because the buyer's money has left the seller's balance just as on a refund. The order
      worked on is the order of the most recent chargeback debit on the seller's payments account. The chargeback
      credit on an order is fixed only after every fee dispute submitted on that order's variable final value fee
      record carries a decision. The chargeback credit is the creditable variable fee times the chargeback share,
      rounded to the nearest cent, less the chargeback administration fee. The creditable variable fee of a chargeback
      credit is the variable final value fee billed on the order less every credit already booked on that fee record,
      administration fees included, and never below zero. The chargeback share is the chargeback amount debited for
      the order divided by the order's fee basis, never above one. The chargeback administration fee is the chargeback
      credit before the fee times the refund administration fee rate, rounded to the nearest cent, and capped at the
      refund administration fee cap. The chargeback share is counted as one when the chargeback amount reaches at
      least the whole-order chargeback share of the fee basis, as half of the proportional share when it is below
      the minimum chargeback share, and as the proportional share between the two. The chargeback administration fee
      rate is the low chargeback admin rate when the payments account shows no more than the few-chargebacks count
      of chargeback debits dated less than twelve whole months before the decision date and the seller's performance
      level is one of the discount standing levels, the mid chargeback admin rate when the account shows no more than
      that count and the level is Above Standard Level, and the refund administration fee rate otherwise. The chargeback
      administration fee cap is the large-order chargeback cap when the order's fee basis is at least the large-order
      basis, the mid-order chargeback cap when it is at least the mid-order basis but below the large-order basis,
      and the refund administration fee cap below the mid-order basis. The chargeback administration fee is multiplied
      by the quick-chargeback multiplier when the chargeback was debited no more than the quick-chargeback days after
      the order's variable fee billing date, by the mid-chargeback multiplier when it was debited later but no more
      than the mid-chargeback days after, and by one when it was debited later still. The chargeback administration
      fee is also multiplied by the long-tenure chargeback multiplier when the selling plan was verified at least
      the long tenure months before the decision date, by the mid-tenure chargeback multiplier when it was verified
      at least the mid tenure months but fewer than the long tenure months before, and by one otherwise, the tenure
      being counted in whole months. The chargeback administration fee is worked out as the chargeback credit before
      the fee times the rate times both multipliers, rounded to the nearest cent, and only then compared with the
      cap; the FBN chargeback relief is subtracted after the cap and never takes the fee below zero. The FBN chargeback
      relief is the same-day FBN chargeback relief when the order's FBN outbound shipment is dated the same calendar
      day as the order's variable fee record, the FBN chargeback relief when the order's FBN outbound shipment is
      dated later, and nothing when the order has no FBN outbound shipment.
    prerequisite:
    - problem: selling_ext_discount_dispute_credit
      kind: value_input
      gate: kc_prior
      form: state
      policy_source: >-
        The chargeback credit on an order is fixed only after every fee dispute submitted on that order's variable
        final value fee record carries a decision.
      condition: >-
        No seller fee dispute with status submitted names the variable final value fee record of the order of the
        most recent chargeback debit; every dispute on it is upheld or rejected.
      resolved_by: uphold_fee_dispute_credit_4fd06f6c
      effect: >-
        Deciding the pending standing-discount dispute books a fee dispute upheld credit on the same variable fee
        record, so the credits already booked on it (kc_prior) rise by that credit and the creditable variable fee
        the chargeback credit is sized on falls by the same amount.
    cross_category:
    - category: payout
      as: history
      reads:
      - payout_events.order_id
      - payout_events.amount
      - payout_events.event_date
      note: >-
        The order worked on, the chargeback share, the chargeback count behind the admin rate and the chargeback timing
        read the payments ledger's chargeback debits.
    - category: standing
      as: branch
      reads:
      - variant_name
      note: The chargeback admin rate reads the seller's performance level.
    - category: fulfill
      as: history
      reads:
      - fulfill_events.event_date
      note: The FBN chargeback relief reads the order's FBN outbound shipment.
    compute:
    - kc_order: >-
        XLATEST('payout', 'payout_events', 'order_id', event_type='payout_chargeback_debit')
    - kc_cb_date: >-
        XLATEST('payout', 'payout_events', 'event_date', event_type='payout_chargeback_debit')
    - kc_fee_ref: >-
        LATEST('selling_fees', 'selling_event_id', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=kc_order)
    - kc_fee_date: >-
        LATEST('selling_fees', 'event_date', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=kc_order)
    - kc_billed: >-
        SUM('selling_fees', 'amount', event_type='selling_final_value_fee', fee_type='final_value_variable', order_id=kc_order)
    - kc_basis: >-
        SUM('selling_fees', 'fee_basis_amount', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=kc_order)
    - kc_prior: >-
        SUM('selling_fees', 'gross_credit_amount', event_type='selling_fee_credit', fee_event_ref=kc_fee_ref)
    - kc_creditable: MX(0, kc_billed - kc_prior)
    - kc_cb_amount: >-
        XSUM('payout', 'payout_events', 'amount', event_type='payout_chargeback_debit', order_id=kc_order)
    - kc_raw_share: MN(1, kc_cb_amount / kc_basis)
    - kc_share: >-
        1 if kc_raw_share >= K('whole_order_chargeback_share') else (kc_raw_share * K('small_chargeback_share_factor')
        if kc_raw_share < K('minimum_chargeback_share') else kc_raw_share)
    - kc_gross: RND(kc_creditable * kc_share, 2)
    - kc_cb_count: >-
        XCOUNT('payout', 'payout_events', within_months=12, event_type='payout_chargeback_debit')
    - kc_level: CFIELD('standing', 'variant_name')
    - kc_rate: >-
        K('low_chargeback_admin_rate') if kc_cb_count <= K('few_chargebacks_count') and kc_level in P('discount_standing_levels')
        else (K('mid_chargeback_admin_rate') if kc_cb_count <= K('few_chargebacks_count') and kc_level == 'Above Standard
        Level' else P('refund_admin_fee_rate'))
    - kc_cap: >-
        K('large_order_chargeback_cap') if kc_basis >= K('large_order_basis') else (K('mid_order_chargeback_cap')
        if kc_basis >= K('mid_order_basis') else P('refund_admin_fee_cap'))
    - kc_days: DAYS(kc_fee_date, kc_cb_date)
    - kc_timing_mult: >-
        K('quick_chargeback_multiplier') if kc_days <= K('quick_chargeback_days') else (K('mid_chargeback_multiplier')
        if kc_days <= K('mid_chargeback_days') else 1)
    - kc_tenure: MONTHS(F('verified_date'), NOW)
    - kc_tenure_mult: >-
        K('long_tenure_chargeback_multiplier') if kc_tenure >= K('long_tenure_months') else (K('mid_tenure_chargeback_multiplier')
        if kc_tenure >= K('mid_tenure_months') else 1)
    - kc_ship_date: >-
        XLATEST('fulfill', 'fulfill_events', 'event_date', event_type='fulfill_outbound_shipment', order_id=kc_order)
    - kc_fbn_relief: >-
        K('same_day_fbn_chargeback_relief') if kc_ship_date and DAYS(kc_fee_date, kc_ship_date) == 0 else (K('fbn_chargeback_relief')
        if kc_ship_date else 0)
    - kc_admin_raw: RND(kc_gross * kc_rate * kc_timing_mult * kc_tenure_mult, 2)
    - kc_admin: MX(0, MN(kc_admin_raw, kc_cap) - kc_fbn_relief)
    - result: RND(kc_gross - kc_admin, 2)
    compute_basis:
      kc_order: >-
        The order worked on is the order of the most recent chargeback debit on the seller's payments account.
      kc_cb_date: >-
        The chargeback administration fee is multiplied by the quick-chargeback multiplier when the chargeback was
        debited no more than the quick-chargeback days after the order's variable fee billing date, by the mid-chargeback
        multiplier when it was debited later but no more than the mid-chargeback days after, and by one when it was
        debited later still.
      kc_fee_ref: >-
        The creditable variable fee of a chargeback credit is the variable final value fee billed on the order less
        every credit already booked on that fee record, administration fees included, and never below zero.
      kc_fee_date: >-
        The chargeback administration fee is multiplied by the quick-chargeback multiplier when the chargeback was
        debited no more than the quick-chargeback days after the order's variable fee billing date, by the mid-chargeback
        multiplier when it was debited later but no more than the mid-chargeback days after, and by one when it was
        debited later still.
      kc_billed: >-
        The creditable variable fee of a chargeback credit is the variable final value fee billed on the order less
        every credit already booked on that fee record, administration fees included, and never below zero.
      kc_basis: >-
        The chargeback share is the chargeback amount debited for the order divided by the order's fee basis, never
        above one.
      kc_prior: >-
        The creditable variable fee of a chargeback credit is the variable final value fee billed on the order less
        every credit already booked on that fee record, administration fees included, and never below zero.
      kc_creditable: >-
        The creditable variable fee of a chargeback credit is the variable final value fee billed on the order less
        every credit already booked on that fee record, administration fees included, and never below zero.
      kc_cb_amount: >-
        The chargeback share is the chargeback amount debited for the order divided by the order's fee basis, never
        above one.
      kc_raw_share: >-
        The chargeback share is the chargeback amount debited for the order divided by the order's fee basis, never
        above one.
      kc_share: >-
        The chargeback share is counted as one when the chargeback amount reaches at least the whole-order chargeback
        share of the fee basis, as half of the proportional share when it is below the minimum chargeback share, and
        as the proportional share between the two.
      kc_gross: >-
        The chargeback credit is the creditable variable fee times the chargeback share, rounded to the nearest cent,
        less the chargeback administration fee.
      kc_cb_count: >-
        The chargeback administration fee rate is the low chargeback admin rate when the payments account shows no
        more than the few-chargebacks count of chargeback debits dated less than twelve whole months before the decision
        date and the seller's performance level is one of the discount standing levels, the mid chargeback admin rate
        when the account shows no more than that count and the level is Above Standard Level, and the refund administration
        fee rate otherwise.
      kc_level: >-
        The chargeback administration fee rate is the low chargeback admin rate when the payments account shows no
        more than the few-chargebacks count of chargeback debits dated less than twelve whole months before the decision
        date and the seller's performance level is one of the discount standing levels, the mid chargeback admin rate
        when the account shows no more than that count and the level is Above Standard Level, and the refund administration
        fee rate otherwise.
      kc_rate: >-
        The chargeback administration fee rate is the low chargeback admin rate when the payments account shows no
        more than the few-chargebacks count of chargeback debits dated less than twelve whole months before the decision
        date and the seller's performance level is one of the discount standing levels, the mid chargeback admin rate
        when the account shows no more than that count and the level is Above Standard Level, and the refund administration
        fee rate otherwise.
      kc_cap: >-
        The chargeback administration fee cap is the large-order chargeback cap when the order's fee basis is at least
        the large-order basis, the mid-order chargeback cap when it is at least the mid-order basis but below the
        large-order basis, and the refund administration fee cap below the mid-order basis.
      kc_days: >-
        The chargeback administration fee is multiplied by the quick-chargeback multiplier when the chargeback was
        debited no more than the quick-chargeback days after the order's variable fee billing date, by the mid-chargeback
        multiplier when it was debited later but no more than the mid-chargeback days after, and by one when it was
        debited later still.
      kc_timing_mult: >-
        The chargeback administration fee is multiplied by the quick-chargeback multiplier when the chargeback was
        debited no more than the quick-chargeback days after the order's variable fee billing date, by the mid-chargeback
        multiplier when it was debited later but no more than the mid-chargeback days after, and by one when it was
        debited later still.
      kc_tenure: >-
        The chargeback administration fee is also multiplied by the long-tenure chargeback multiplier when the selling
        plan was verified at least the long tenure months before the decision date, by the mid-tenure chargeback multiplier
        when it was verified at least the mid tenure months but fewer than the long tenure months before, and by one
        otherwise, the tenure being counted in whole months.
      kc_tenure_mult: >-
        The chargeback administration fee is also multiplied by the long-tenure chargeback multiplier when the selling
        plan was verified at least the long tenure months before the decision date, by the mid-tenure chargeback multiplier
        when it was verified at least the mid tenure months but fewer than the long tenure months before, and by one
        otherwise, the tenure being counted in whole months.
      kc_ship_date: >-
        The FBN chargeback relief is the same-day FBN chargeback relief when the order's FBN outbound shipment is
