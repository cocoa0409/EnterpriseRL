  - id: selling_ext_cancellation_fee_credit
    base_policy_refs:
    - selling_refund_fee_credit
    - selling_fee_disputes
    - selling_final_value_fees
    overwrite:
    - base_policy: selling_refund_fee_credit
      superseded_clause: A refund on an order cancelled before shipment is credited in full
      replaced_by: >-
        The cancellation credit share is the near-late cancellation share when the seller cancellation defect is dated
        at least the near-late days but fewer than the far-late days after the order's variable fee billing date,
        the far-late cancellation share when it is dated at least the far-late days after, and the whole fee when
        it is dated fewer than the near-late days after
    - base_policy: selling_refund_fee_credit
      superseded_clause: with no administration fee.
      replaced_by: >-
        A cancellation administration fee is withheld when the standing record shows at least the repeat-cancellation
        count of seller cancellation defects dated within the cancellation record window
    trigger: state_due
    subject:
    - selling_fee_credit
    computes: credit_amount
    target_tool: book_cancellation_fee_credit_79bf63bc
    params:
      near_late_days: 2
      far_late_days: 4
      near_late_cancellation_share: 0.75
      far_late_cancellation_share: 0.5
      repeat_cancellation_count: 2
      top_level_cancellation_admin_rate: 0.05
      other_level_cancellation_admin_rate: 0.1
      large_order_cancellation_cap: 10.0
      mid_order_cancellation_cap: 7.5
      large_order_basis: 1000.0
      mid_order_basis: 250.0
      long_record_tenure_months: 24
      mid_record_tenure_months: 12
      long_record_window_months: 12
      mid_record_window_months: 9
      standard_record_window_months: 6
    rule: >-
      An order the seller cancelled after its payment was captured and before it shipped, recorded as a seller cancellation
      defect on the seller's standing record, earns a cancellation credit on the variable final value fee record of
      that order, booked with the order cancellation credit reason. The order worked on is the order of the most recent
      seller cancellation defect on the standing record. The cancellation credit is the creditable variable fee credited
      in full, with no administration fee withheld. The creditable variable fee of a cancellation credit is the variable
      final value fee billed on the order less every credit already booked on that fee record, administration fees
      included, and never below zero. The cancellation credit share is the near-late cancellation share when the seller
      cancellation defect is dated at least the near-late days but fewer than the far-late days after the order's
      variable fee billing date, the far-late cancellation share when it is dated at least the far-late days after,
      and the whole fee when it is dated fewer than the near-late days after; the cancellation credit before any administration
      fee is the creditable variable fee times that share, rounded to the nearest cent. A cancellation administration
      fee is withheld when the standing record shows at least the repeat-cancellation count of seller cancellation
      defects dated within the cancellation record window: at the top-level cancellation admin rate when the seller's
      performance level is one of the discount standing levels, and at the other-level cancellation admin rate when
      the level is any other level; with fewer seller cancellation defects in that period no cancellation administration
      fee is withheld. The cancellation record window of a cancellation administration fee is the long record window
      when the selling plan was verified at least the long record tenure months before the decision date, the mid
      record window when it was verified at least the mid record tenure months but fewer than the long record tenure
      months before, and the standard record window otherwise, the tenure being counted in whole months; a window
      of that many whole months takes the seller cancellation defects dated less than that many whole months before
      the decision date. The cancellation administration fee is capped at the large-order cancellation cap when the
      order's fee basis is at least the large-order basis, at the mid-order cancellation cap when it is at least the
      mid-order basis but below the large-order basis, and at the refund administration fee cap below the mid-order
      basis. The cancellation administration fee is the cancellation credit before the fee times the rate, rounded
      to the nearest cent, and then held to the cap; the cancellation credit booked is the credit before the fee less
      that fee.
    prerequisite: []
    cross_category:
    - category: standing
      as: history
      reads:
      - variant_name
      - standing_events.order_id
      - standing_events.event_date
      note: >-
        The order worked on, the cancellation timing and the repeat-cancellation count read the seller cancellation
        defects; the admin rate reads the performance level.
    compute:
    - cx_order: >-
        XLATEST('standing', 'standing_events', 'order_id', event_type='standing_defect_record', defect_type='seller_cancellation')
    - cx_cancel_date: >-
        XLATEST('standing', 'standing_events', 'event_date', event_type='standing_defect_record', defect_type='seller_cancellation')
    - cx_fee_ref: >-
        LATEST('selling_fees', 'selling_event_id', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=cx_order)
    - cx_fee_date: >-
        LATEST('selling_fees', 'event_date', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=cx_order)
    - cx_billed: >-
        SUM('selling_fees', 'amount', event_type='selling_final_value_fee', fee_type='final_value_variable', order_id=cx_order)
    - cx_prior: >-
        SUM('selling_fees', 'gross_credit_amount', event_type='selling_fee_credit', fee_event_ref=cx_fee_ref)
    - cx_creditable: MX(0, cx_billed - cx_prior)
    - cx_days: DAYS(cx_fee_date, cx_cancel_date)
    - cx_share: >-
        K('far_late_cancellation_share') if cx_days >= K('far_late_days') else (K('near_late_cancellation_share')
        if cx_days >= K('near_late_days') else 1)
    - cx_gross: RND(cx_creditable * cx_share, 2)
    - cx_tenure: MONTHS(F('verified_date'), NOW)
    - cx_window: >-
        K('long_record_window_months') if cx_tenure >= K('long_record_tenure_months') else (K('mid_record_window_months')
        if cx_tenure >= K('mid_record_tenure_months') else K('standard_record_window_months'))
    - cx_cancels: >-
        XCOUNT('standing', 'standing_events', within_months=cx_window, event_type='standing_defect_record', defect_type='seller_cancellation')
    - cx_level: CFIELD('standing', 'variant_name')
    - cx_rate: >-
        K('top_level_cancellation_admin_rate') if cx_cancels >= K('repeat_cancellation_count') and cx_level in P('discount_standing_levels')
        else (K('other_level_cancellation_admin_rate') if cx_cancels >= K('repeat_cancellation_count') and cx_level
        not in P('discount_standing_levels') else 0)
    - cx_basis: >-
        SUM('selling_fees', 'fee_basis_amount', event_type='selling_final_value_fee', fee_type='final_value_variable',
        order_id=cx_order)
    - cx_cap: >-
        K('large_order_cancellation_cap') if cx_basis >= K('large_order_basis') else (K('mid_order_cancellation_cap')
        if cx_basis >= K('mid_order_basis') else P('refund_admin_fee_cap'))
    - cx_admin: MN(RND(cx_gross * cx_rate, 2), cx_cap)
    - result: RND(cx_gross - cx_admin, 2)
