    - id: chargeback_admin_cap
      effect: parameter
      decides: kc_cap
      bindings:
      - kc_basis
      - kc_cap
      ladder:
      - when: the order's fee basis is at least the large-order basis
        value: K('large_order_chargeback_cap')
      - when: it is at least the mid-order basis but below the large-order basis
        value: K('mid_order_chargeback_cap')
      - when: otherwise
        value: P('refund_admin_fee_cap')
      baseline:
        kc_cap: P('refund_admin_fee_cap')
      evidence:
      - history
      cross_difficulty: null
    - id: chargeback_timing_multiplier
      effect: parameter
      decides: kc_timing_mult
      bindings:
      - kc_cb_date
      - kc_days
      - kc_timing_mult
      ladder:
      - when: >-
