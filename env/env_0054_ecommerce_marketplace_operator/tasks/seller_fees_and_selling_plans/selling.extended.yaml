        value: K('quick_chargeback_multiplier')
      - when: it was debited later but no more than the mid-chargeback days after
        value: K('mid_chargeback_multiplier')
      - when: otherwise
        value: '1'
      baseline:
        kc_timing_mult: '1'
      evidence:
