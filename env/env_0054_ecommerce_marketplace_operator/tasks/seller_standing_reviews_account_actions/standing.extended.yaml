    - mn_mid: F('variant_name') == 'Standard Level' or F('variant_name') == 'Above Standard Level'
    - mn_base_period: K('period_top') if (mn_top and mn_lt_3 == 0) else (K('period_mid') if (mn_mid and mn_lt_3 == 0) else K('period_standard'))
    - mn_serious_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='intellectual_property') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='inauthentic_complaint') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='product_authenticity') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='review_manipulation')
    - mn_all_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record')
    - mn_lt_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='listing_policy') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='restricted_product')
    - mn_same_12: MX(COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='listing_policy'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='restricted_product'))
    - mn_repeat_count: mn_all_12 if mn_serious_12 >= 1 else (mn_lt_12 if mn_lt_12 >= 2 else mn_same_12)
    - mn_ext: K('ext_three') if mn_repeat_count >= 3 else (K('ext_two') if mn_repeat_count == 2 else 0)
