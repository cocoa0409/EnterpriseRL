      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: top_performer_repeat_adjustment
      effect: parameter
      decides: tp_repeat_add
      bindings:
      - tp_same_type_max
      - tp_repeat_add
      ladder:
      - when: no violation type recorded more than once in the last twelve whole calendar months
        value: K('repeat_none')
      - when: a type recorded twice in that period and none more often
        value: K('repeat_one')
      - when: otherwise (a type recorded three or more times)
        value: '0'
      baseline:
        tp_repeat_add: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: top_performer_band_method
      effect: method
      decides: tp_relief_raw
      bindings:
      - tp_threshold
      - tp_viol_6
      - tp_relief_raw
      ladder:
      - when: active points at or above the warning points threshold AND no violation recorded in the last six whole calendar months
        method: the points above the threshold come off in full and the threshold points are multiplied by the top-performer rate
      - when: active points at or above the warning points threshold AND a violation recorded in that period
        method: the threshold points are multiplied by the rate and the points above the threshold by twice the rate, and the two products are added
      - when: otherwise (active points below the threshold)
        method: all the active points are multiplied by the top-performer rate
      baseline:
        tp_relief_raw: tp_active * tp_rate
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: top_performer_severity_credit
      effect: parameter
      decides: tp_severity_credit
      bindings:
      - tp_serious_active
      - tp_serious_6
      - tp_severity_credit
      ladder:
      - when: no active points from intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violations
        value: K('severity_clean')
      - when: active serious points all from serious violations recorded six or more whole calendar months before the handling date
        value: K('severity_stepped')
      - when: otherwise (a serious violation recorded in the last six whole calendar months)
        value: '0'
      baseline:
        tp_severity_credit: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: top_performer_remediation_credit
      effect: parameter
      decides: tp_remediation_credit
      bindings:
      - tp_disposals_6
      - tp_returns_6
      - tp_remediation_credit
      ladder:
      - when: a disposal removal fee billed on the Fulfilled by Northloop enrollment in the last six whole calendar months
        value: K('remediation_disposal')
      - when: no disposal removal fee but a return-to-seller removal fee billed in that period
        value: K('remediation_return')
      - when: otherwise
        value: '0'
      baseline:
        tp_remediation_credit: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: fulfill
    - id: top_performer_tenure_cap
      effect: parameter
      decides: tp_cap
      bindings:
      - tp_tenure_days
      - tp_cap
      ladder:
      - when: standing record opened 1,095 days or more before the handling date
        value: K('cap_long')
      - when: standing record opened at least 730 but fewer than 1,095 days before the handling date
        value: K('cap_mid')
      - when: otherwise
        value: K('cap_standard')
      baseline:
        tp_cap: K('cap_standard')
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: The active points for top-performer relief are the points of every violation recorded on the standing record, less every point reversed and every point already expired, stepped down or relieved on that record. The standard top-performer relief is those active points multiplied by the standard top-performer rate and rounded down to a whole point, and it never exceeds the standard top-performer cap.
      params:
