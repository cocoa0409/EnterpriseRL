    rule: 'A seller whose standing record is in good_standing or at_risk and carries active points above zero may apply for action-plan relief after working through the account health action plan for the listings behind their active violations; applying is the seller''s own act and is confirmed by the seller. Action-plan relief takes points off before any violation''s point expiry period has passed. Action-plan relief is fixed only after the standing record carries a points-expiry entry for every clean-span relief owed on it. For action-plan relief, whole calendar months are counted by calendar date back from the handling date: a date lies in the last N whole calendar months when fewer than N whole months have passed from it to the handling date. The active points for action-plan relief are the points of every violation recorded on the standing record, less every point reversed and every point already expired or relieved on that record. The standard action-plan relief covers the active listing_policy points, meaning the points recorded for listing_policy violations less every point expired, relieved or reversed on entries carrying that type; it is those points multiplied by the standard action-plan share and rounded down to a whole point, and it never exceeds the standard action-plan cap. The action-plan share is the high action-plan share for a seller placed at Above Standard Level, Top Rated Level or Preferred Partner Level with at most two listing_policy or restricted_product violations recorded in the last twelve whole calendar months, the middle action-plan share for a seller placed at Standard Level, Developing Seller Level or Below Standard Level with at most two such violations recorded in that period, and the standard action-plan share for a seller with three or more such violations recorded in that period. Which points the plan covers depends on the flagged stock the seller has taken out of the Fulfilled by Northloop network: for a seller whose enrollment billed a disposal removal fee in the last three whole calendar months the plan covers all the active points for action-plan relief; for a seller whose enrollment billed no disposal removal fee but a return-to-seller removal fee in that period it covers the active listing-type points, meaning the points recorded for listing_policy and restricted_product violations less every point expired, relieved or reversed on entries carrying those types; for every other seller it covers the active listing_policy points only. The listing clean-span bonus is the long listing-span bonus when six or more whole calendar months have passed since the most recent listing_policy or restricted_product violation was recorded, the mid listing-span bonus when four or five have passed, and nothing when fewer have passed; a seller with no such violation on record takes the long listing-span bonus. The action-plan cap is the long-tenure action-plan cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure action-plan cap for a record opened at least 730 but fewer than 1,095 days before, and the standard action-plan cap for every other record. The action-plan relief is worked out in this order: the covered points are multiplied by the action-plan share, the product is rounded down to a whole point, the listing clean-span bonus is added, and the total is limited to the action-plan cap; products are worked to four decimal places before any rounding down. The action-plan relief is booked as one points-expiry entry against the active violation that still carries the most points, the oldest of them where two carry the same, and the entry carries that violation''s type; where the relief exceeds that violation''s remaining points, the rest is booked the same way against the next. A violation that has received action-plan relief keeps its remaining points on record until they expire or are reversed, and a violation already reversed or fully expired never receives relief.'
