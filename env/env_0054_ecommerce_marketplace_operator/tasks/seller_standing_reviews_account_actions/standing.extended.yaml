events:
  - type: standing_enroll
    target: standing_records
    mutation: create
    meaning: "A seller's standing record is opened when the seller first lists."
    grain: "one row per seller standing record"
    fields:
      standing_id: "Standing record reference."
      customer_id: "The seller."
      variant_name: "Initial level."
      enrolled_date: "Date opened."
    triggers: []
  - type: standing_activate
    target: standing_records
    mutation: {transition: {from: onboarding, to: good_standing}}
    meaning: "The first monthly evaluation places the seller."
    grain: "one row per transaction"
    fields:
      last_evaluation_date: "Date of the first evaluation."
    triggers: []
  - type: standing_evaluate
    target: standing_records
    mutation: update
    meaning: "The monthly evaluation sets the seller's performance level."
    grain: "one row per transaction"
    fields:
      variant_name: "Level assigned."
      last_evaluation_date: "Date of this evaluation."
      next_evaluation_date: "Date of the next evaluation."
    triggers: []
  - type: standing_defect_record
    target: standing_events
    meaning: "An order becomes defective for the seller: negative feedback, a granted guarantee claim, a chargeback or a seller cancellation."
    grain: "one row per order per defect type"
    distinguish_by: [order_id, defect_type]
    fields:
      standing_id: "Standing record."
      customer_id: "The seller."
      event_date: "Date the defect arose."
      order_id: "Order concerned."
      defect_type: "Kind of defect."
    triggers: []
  - type: standing_defect_removal
    target: standing_events
    meaning: "A recorded defect is removed and stops counting."
    grain: "one row per order per defect type removed"
    distinguish_by: [order_id, defect_type]
    fields:
      standing_id: "Standing record."
      customer_id: "The seller."
      event_date: "Date removed."
      order_id: "Order concerned."
      defect_type: "Kind of defect removed."
      removal_reason: "Why it was removed."
    triggers: []
  - type: standing_violation_record
    target: standing_events
    meaning: "A policy violation is recorded against the seller with its points."
    grain: "one row per violation"
    distinguish_by: [violation_ref]
    fields:
      standing_id: "Standing record."
      customer_id: "The seller."
      event_date: "Date recorded."
      violation_ref: "Violation reference."
      violation_type: "Kind of violation."
      listing_id: "Listing concerned."
      points: "Points recorded."
    account: violation_points
    direction: in
    triggers:
      - event: standing:standing_suspend
        when: {violation_type: [product_authenticity, review_manipulation]}
        map: {}
  - type: standing_violation_reversal
    target: standing_events
    meaning: "A violation is overturned and its points removed."
    grain: "one row per violation reversed"
    distinguish_by: [violation_ref]
    fields:
      standing_id: "Standing record."
      customer_id: "The seller."
      event_date: "Date reversed."
      violation_ref: "Violation reversed."
      points: "Points removed."
      reversal_reason: "Why it was reversed."
    account: violation_points
    direction: out
    triggers: []
  - type: standing_points_expiry
    target: standing_events
    meaning: "A violation's points expire after the expiry period."
    grain: "one row per violation expired"
    distinguish_by: [violation_ref]
    fields:
      standing_id: "Standing record."
      customer_id: "The seller."
      event_date: "Date expired."
      violation_ref: "Violation whose points expired."
      points: "Points removed."
    account: violation_points
    direction: out
    triggers: []
  - type: standing_feedback_removal
    target: standing_events
    meaning: "A seller feedback entry or product review is removed after a dispute."
    grain: "one row per feedback or review removed"
    distinguish_by: [review_ref]
    fields:
      standing_id: "Standing record."
      customer_id: "The seller."
      event_date: "Date removed."
      review_ref: "Feedback or review reference."
      order_id: "Order the feedback belongs to (blank for a product review)."
      review_kind: "seller_feedback or product_review."
      feedback_rating: "Rating of the removed feedback."
      dispute_id: "Dispute that led to the removal."
    triggers:
      - event: standing:standing_defect_removal
        when: {review_kind: seller_feedback, feedback_rating: negative}
        map: {order_id: order_id, defect_type: negative_feedback, removal_reason: feedback_removed}
  - type: standing_warn
    target: standing_records
    mutation: {transition: {from: good_standing, to: at_risk}}
    meaning: "The seller is placed at risk."
    grain: "one row per transaction"
    fields:
      at_risk_reason: "violation_points or metric_breach."
    triggers: []
  - type: standing_recover
    target: standing_records
    mutation: {transition: {from: at_risk, to: good_standing}}
    meaning: "The seller returns to good standing."
    grain: "one row per transaction"
    fields:
      at_risk_reason: "Reset to none."
    triggers: []
  - type: standing_suspend
    target: standing_records
    mutation: {transition: [{from: at_risk, to: suspended}, {from: good_standing, to: suspended}]}
    meaning: "Selling privileges are suspended."
    grain: "one row per transaction"
    fields:
      suspended_date: "Date suspended."
    triggers:
      - event: payout:payout_hold_place
        map: {hold_reason: account_suspended}
  - type: standing_submit_appeal
    target: standing_records
    mutation: {transition: {from: suspended, to: under_appeal}}
    meaning: "The seller submits an appeal against the suspension."
    grain: "one row per transaction"
    fields:
      appeal_submitted_date: "Date of the latest appeal."
    triggers: []
  - type: standing_reinstate
    target: standing_records
    mutation: {transition: {from: under_appeal, to: good_standing}}
    meaning: "The appeal is accepted and selling privileges are reinstated."
    grain: "one row per transaction"
    fields:
      reinstated_date: "Date reinstated."
      suspended_date: "Cleared (empty)."
    triggers:
      - event: payout:payout_hold_release
        map: {hold_reason: none}
  - type: standing_reject_appeal
    target: standing_records
    mutation: {transition: {from: under_appeal, to: suspended}}
    meaning: "The appeal is rejected and the suspension continues."
    grain: "one row per transaction"
    fields:
      appeal_submitted_date: "Kept as the latest appeal date."
    triggers: []
  - type: standing_deactivate
    target: standing_records
    mutation: {transition: {from: suspended, to: deactivated}}
    meaning: "The suspension becomes a permanent deactivation."
    grain: "one row per transaction"
    fields:
      deactivated_date: "Date deactivated."
    triggers: []
  - type: standing_close
    target: standing_records
    mutation: {transition: [{from: good_standing, to: closed}, {from: at_risk, to: closed}, {from: deactivated, to: closed}]}
    meaning: "The selling account is closed."
    grain: "one row per transaction"
    fields:
      closed_date: "Date closed."
    triggers: []

measures:
  - id: standing_msr_order_defect_rate
    window: "Rolling defect window in calendar days ending the day before the evaluation date."
    measure: "Distinct orders of the seller (order_orders with seller_customer_id = the seller and order_date in the window) carrying at least one standing_defect_record of a counted defect type not cancelled by a standing_defect_removal, divided by all such orders; when the orders number fewer than the low-volume threshold, the count of those defective orders is used instead."
  - id: standing_msr_late_shipment_rate
    window: "Rolling late shipment window in calendar days ending the day before the evaluation date."
    measure: "Seller-shipped orders of the seller in the window shipped late, divided by seller-shipped orders of the seller in the window."
  - id: standing_msr_seller_cancel_rate
    window: "Rolling cancellation window in calendar days ending the day before the evaluation date."
    measure: "Orders of the seller in the window with cancel_initiator seller, divided by all orders of the seller in the window."
  - id: standing_msr_valid_tracking_rate
    window: "Rolling tracking window in calendar days ending the day before the evaluation date."
    measure: "Seller-shipped orders of the seller in the window with tracking_status valid_tracking, divided by seller-shipped orders shipped in the window."
  - id: standing_msr_disputes_this_month
    window: "The calendar month of the handling date (frozen time)."
    measure: "Count of standing_review_disputes rows of the seller created in that month, withdrawn ones included."
  - id: standing_msr_appeals_on_suspension
    window: "From the current suspended_date to the handling date (frozen time)."
    measure: "Count of standing_appeals rows of the seller created on or after suspended_date."

policies:
  - id: standing_agg_multi_holding
    subject: [standing_enroll]
    rule: >-
      A seller has exactly one standing record; every order, defect and violation of the seller is booked to it. A
      closed record does not count, so a seller who closed voluntarily and returns gets a new record.
    eligibility: []
    params: {max_per_customer: 1}
  - id: standing_monthly_evaluation
    subject: [standing_activate, standing_evaluate]
    rule: >-
      On the evaluation day each month the seller is placed at the highest level whose every gate is met; a seller who
      meets no other level is placed at Below Standard Level. A level's gates are its maximum order defect rate (or,
      below the low-volume order threshold, its maximum defect count), maximum late shipment rate, maximum seller
      cancellation rate, minimum valid tracking rate, minimum trailing 12-month transactions and sales, and minimum
      and maximum profile age; a gate valued not_applicable is not checked. A seller's first evaluation moves the record
      from onboarding to good_standing at the level so computed. The level applies from the evaluation date until the
      next evaluation and is the level other programs read for that period. An evaluation never changes the status of
      a suspended, under_appeal, deactivated or closed record, but still records its level.
    eligibility: []
    measures: [standing_msr_order_defect_rate, standing_msr_late_shipment_rate, standing_msr_seller_cancel_rate, standing_msr_valid_tracking_rate]
    params:
      per_tier:
        "Below Standard Level": {odr_limit: "=max_order_defect_rate", late_limit: "=max_late_shipment_rate", cancel_limit: "=max_seller_cancel_rate"}
        "Developing Seller Level": {odr_limit: "=max_order_defect_rate", late_limit: "=max_late_shipment_rate", cancel_limit: "=max_seller_cancel_rate"}
        "Standard Level": {odr_limit: "=max_order_defect_rate", late_limit: "=max_late_shipment_rate", cancel_limit: "=max_seller_cancel_rate"}
        "Above Standard Level": {odr_limit: "=max_order_defect_rate", late_limit: "=max_late_shipment_rate", cancel_limit: "=max_seller_cancel_rate"}
        "Top Rated Level": {odr_limit: "=max_order_defect_rate", late_limit: "=max_late_shipment_rate", cancel_limit: "=max_seller_cancel_rate"}
        "Preferred Partner Level": {odr_limit: "=max_order_defect_rate", late_limit: "=max_late_shipment_rate", cancel_limit: "=max_seller_cancel_rate"}
  - id: standing_defect_rules
    subject: [standing_defect_record, standing_defect_removal]
    rule: >-
      An order becomes defective for the seller when it receives negative seller feedback, when a Northloop Guarantee
      claim on it is granted and funded by the seller, or when a chargeback on it is debited to the seller; a seller
      cancellation is recorded as a defect type of its own that feeds the cancellation rate, not the defect rate. A
      claim funded by Northloop is never a defect. A defect is removed when the negative feedback is removed after a
      dispute, when the seller wins the chargeback dispute, or when the guarantee claim decision is reversed on appeal
      in the seller's favour. Several defects on one order count as one defective order.
    eligibility: []
  - id: standing_violation_rules
    subject: [standing_violation_record, standing_violation_reversal, standing_points_expiry]
    rule: >-
      Each recorded policy violation adds the points of its type from the violation points map. Points expire when the
      point expiry period has passed, counted in calendar days from the violation's event_date. An intellectual_property
      violation is reversed in full when the rights owner retracts the complaint. A violation is reversed when an appeal
      on the basis violation_issued_in_error is accepted; an accepted plan_of_action appeal reinstates the seller but
      keeps the points on record until they expire. A reversed or expired violation is never reversed or expired a
      second time.
    eligibility:
      - id: expiry_due
        applies_to: [standing_points_expiry]
        kind: time
        condition: "Points expire when the point expiry period has passed, counted in calendar days from the violation's event_date."
        evidence_fields: [standing_events.event_date, standing_events.violation_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [standing_events.violation_ref]
          action_bindings:
            standing_events.violation_ref: violation_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: "the violation's event_date"
          anchor_source: standing_events.event_date
          relation: not_before
          duration_source: variants.point_expiry_days
          unit: calendar_days
          counting_rule: "counted in calendar days from the violation's event_date"
          boundary: exclusive
      - id: reverse_once
        applies_to: [standing_violation_reversal, standing_points_expiry]
        kind: dedup
        condition: "A reversed or expired violation is never reversed or expired a second time."
        evidence_fields: [standing_events.violation_ref, standing_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [standing_events.violation_ref]
          action_bindings:
            standing_events.violation_ref: violation_ref
        dedup_contract:
          table: standing_events
          mode: separate_record
          object_bindings: {violation_ref: violation_ref}
          duplicate_filters: {event_type: [standing_violation_reversal, standing_points_expiry]}
          distinct_fields: []
  - id: standing_account_actions
    subject: [standing_warn, standing_recover, standing_suspend, standing_deactivate]
    rule: >-
      A good-standing seller is placed at risk when active violation points reach the warning threshold, or when a
      metric breaches the limits of the seller's current level at evaluation and metric_breach_warning is true. An
      at-risk seller returns to good standing at an evaluation where points are below the warning threshold and every
      metric is within the level's limits. Selling privileges are suspended when active points reach the suspension
      threshold, when a violation of an immediate-suspension type is recorded, or when any violation is recorded within
      the probation period counted in calendar days from reinstated_date. A suspended seller who has not appealed by
      the end of the appeal window, or whose appeals have reached the per-suspension limit and the last one was
      rejected, is deactivated.
    eligibility: []
  - id: standing_appeal_rules
    subject: [standing_submit_appeal, standing_reinstate, standing_reject_appeal]
    rule: >-
      Submitting an appeal is the seller's own act and is confirmed by the seller. An appeal is submitted no later than
      the appeal window counted in calendar days from suspended_date, and no more than the per-suspension appeal limit
      may be submitted. When the suspension stems from a violation type listed in plan_of_action_required_types, the
      appeal must be a plan of action; an appeal on another basis is rejected. An appeal is accepted when its basis is
      supported by the records: a plan of action addressing every active violation, or a violation_issued_in_error
      appeal where the violation record shows the listing was not active, the complaint was retracted, or the
      violation was recorded twice. Acceptance reinstates the seller and releases the payments hold; rejection returns
      the record to suspended with the appeal count unchanged.
    eligibility:
      - id: appeal_window
        applies_to: [standing_submit_appeal]
        kind: time
        condition: "An appeal is submitted no later than the appeal window counted in calendar days from suspended_date"
        evidence_fields: [standing_records.suspended_date, standing_records.standing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [standing_records.standing_id]
          action_bindings:
            standing_records.standing_id: standing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "suspended_date"
          anchor_source: standing_records.suspended_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: "counted in calendar days from suspended_date"
          boundary: inclusive
    measures: [standing_msr_appeals_on_suspension]
  - id: standing_feedback_disputes
    subject: [standing_feedback_removal, standing_defect_removal]
    rule: >-
      A seller may dispute seller feedback or a product review no later than the feedback dispute window counted in
      calendar days from the date the feedback or review was left, and may submit no more disputes in a calendar month
      than the level's monthly allowance. Seller feedback is removed only for a reason in feedback_removable_reasons
      that the records support; negative feedback about the delivery of a Fulfilled by Northloop order is removed under
      fbn_fulfillment_experience. A product review is removed only for a reason in product_review_removable_reasons; a
      review that is merely unfavourable is never removed. Removing negative seller feedback removes its defect;
      product reviews never carry defects.
    eligibility: []
    measures: [standing_msr_disputes_this_month]
  - id: standing_closure
    subject: [standing_close]
    rule: >-
      A seller may close the selling account voluntarily only while the record is in one of the
      voluntary_close_allowed_statuses; a suspended or under_appeal seller must first have the suspension resolved. A
      deactivated record is closed by the system once the payments account has settled.
    eligibility: []

extended_policies:
  - id: standing_ext_clean_span_relief
    base_policy_refs:
    - standing_violation_rules
    overwrite:
    - base_policy: standing_violation_rules
      superseded_clause: Points expire when the point expiry period has passed, counted in calendar days from the violation's event_date.
      replaced_by: Part of a seller's active points also comes off before any violation's point expiry period has passed, as clean-span relief.
    - base_policy: standing_violation_rules
      superseded_clause: A reversed or expired violation is never reversed or expired a second time.
      replaced_by: A violation that has received clean-span relief keeps its remaining points on record until they expire or are reversed, and a violation already reversed or fully expired never receives relief.
    trigger: state_due
    subject:
    - standing_points_expiry
    computes: points
    target_tool: grant_clean_span_relief_513362ca
    params:
      rate_above: 0.3
      rate_standard_level: 0.25
      rate_standard: 0.2
      cap_long: 8
      cap_mid: 6
      cap_standard: 4
      repeat_none: 2
      repeat_one: 1
    rule: 'Clean-span relief is owed on the handling date to a seller placed at Below Standard Level, Developing Seller Level, Standard Level or Above Standard Level whose standing record is in good_standing or at_risk, carries active points above zero, and shows no policy violation recorded in the last three whole calendar months before the handling date. Clean-span relief is owed once for each clean span: a record that already carries a points-expiry entry dated three or more whole calendar months after its most recent violation has received it. For clean-span relief, whole calendar months are counted by calendar date back from the handling date: a date lies in the last N whole calendar months when fewer than N whole months have passed from it to the handling date, and the clean span is the number of whole months that have passed from the event date of the most recent violation recorded on the standing record to the handling date. Part of a seller''s active points also comes off before any violation''s point expiry period has passed, as clean-span relief. The active points are the points of every violation recorded on the standing record, less every point reversed and every point already expired or relieved on that record. The standard clean-span relief is the active points multiplied by the standard clean-span relief rate and rounded down to a whole point, and it never exceeds the standard clean-span relief cap. The clean-span relief rate is the above-standard clean-span rate for a seller placed at Above Standard Level with at most three policy violations recorded in the last twelve whole calendar months, the standard-level clean-span rate for a seller placed at Standard Level with at most three policy violations recorded in that period, and the standard clean-span relief rate for a seller placed at a lower level or with four or more policy violations recorded in that period. How the clean-span relief rate is applied depends on where the active points stand against the warning points threshold of the seller''s level: when they are at or above the threshold and the clean span is six months or more, the points above the threshold come off in full and the threshold points are multiplied by the clean-span relief rate; when they are at or above the threshold and the clean span is shorter, the threshold points are multiplied by the clean-span relief rate and the points above the threshold by twice that rate, and the two products are added; when they are below the threshold, all the active points are multiplied by the clean-span relief rate. The repeat-record credit of clean-span relief is the no-repeat credit for a seller with no violation type recorded more than once in the last twelve whole calendar months, the single-repeat credit for a seller with a type recorded twice in that period and none more often, and nothing for a seller with a type recorded three or more times in that period. The clean-span relief cap is the long-tenure cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure cap for a record opened at least 730 but fewer than 1,095 days before, and the standard clean-span relief cap for every other record. The clean-span relief is worked out in this order: the relief points the band rule gives are rounded down to a whole point, the repeat-record credit is added, and the total is limited to the clean-span relief cap; products are worked to four decimal places before any rounding down. The relief is booked as one points-expiry entry against the active violation that still carries the most points, the oldest of them where two carry the same, and the entry carries that violation''s type; where the relief exceeds that violation''s remaining points, the rest is booked the same way against the next. A violation that has received clean-span relief keeps its remaining points on record until they expire or are reversed, and a violation already reversed or fully expired never receives relief.'
    prerequisite: []
    cross_category: []
    compute:
    - cs_active: SUM('standing_events','points', event_type='standing_violation_record') - SUM('standing_events','points', event_type='standing_violation_reversal') - SUM('standing_events','points', event_type='standing_points_expiry')
    - cs_viol_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record')
    - cs_rate: K('rate_above') if (F('variant_name') == 'Above Standard Level' and cs_viol_12 <= 3) else (K('rate_standard_level') if (F('variant_name') == 'Standard Level' and cs_viol_12 <= 3) else K('rate_standard'))
    - cs_span: MONTHS(LATEST('standing_events','event_date', event_type='standing_violation_record'), NOW)
    - cs_threshold: P('warning_points_threshold')
    - cs_relief_points: ((cs_active - cs_threshold) + int(RND(cs_threshold * cs_rate, 4))) if (cs_active >= cs_threshold and cs_span >= 6) else (int(RND(cs_threshold * cs_rate + (cs_active - cs_threshold) * cs_rate * 2, 4)) if (cs_active >= cs_threshold and cs_span < 6) else int(RND(cs_active * cs_rate, 4)))
    - cs_same_type_max: MX(COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='listing_policy'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='restricted_product'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='intellectual_property'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='inauthentic_complaint'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='product_authenticity'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='review_manipulation'))
    - cs_repeat: K('repeat_none') if cs_same_type_max <= 1 else (K('repeat_one') if cs_same_type_max == 2 else 0)
    - cs_tenure_days: DAYS(F('enrolled_date'), NOW)
    - cs_cap: K('cap_long') if cs_tenure_days >= 1095 else (K('cap_mid') if cs_tenure_days >= 730 else K('cap_standard'))
    - result: MN(cs_cap, cs_relief_points + cs_repeat)
    compute_basis:
      cs_active: The active points are the points of every violation recorded on the standing record, less every point reversed and every point already expired or relieved on that record.
      cs_viol_12: The clean-span relief rate is the above-standard clean-span rate for a seller placed at Above Standard Level with at most three policy violations recorded in the last twelve whole calendar months, the standard-level clean-span rate for a seller placed at Standard Level with at most three policy violations recorded in that period, and the standard clean-span relief rate for a seller placed at a lower level or with four or more policy violations recorded in that period.
      cs_rate: The clean-span relief rate is the above-standard clean-span rate for a seller placed at Above Standard Level with at most three policy violations recorded in the last twelve whole calendar months, the standard-level clean-span rate for a seller placed at Standard Level with at most three policy violations recorded in that period, and the standard clean-span relief rate for a seller placed at a lower level or with four or more policy violations recorded in that period.
      cs_span: 'For clean-span relief, whole calendar months are counted by calendar date back from the handling date: a date lies in the last N whole calendar months when fewer than N whole months have passed from it to the handling date, and the clean span is the number of whole months that have passed from the event date of the most recent violation recorded on the standing record to the handling date.'
      cs_threshold: 'How the clean-span relief rate is applied depends on where the active points stand against the warning points threshold of the seller''s level: when they are at or above the threshold and the clean span is six months or more, the points above the threshold come off in full and the threshold points are multiplied by the clean-span relief rate; when they are at or above the threshold and the clean span is shorter, the threshold points are multiplied by the clean-span relief rate and the points above the threshold by twice that rate, and the two products are added; when they are below the threshold, all the active points are multiplied by the clean-span relief rate.'
      cs_relief_points: 'How the clean-span relief rate is applied depends on where the active points stand against the warning points threshold of the seller''s level: when they are at or above the threshold and the clean span is six months or more, the points above the threshold come off in full and the threshold points are multiplied by the clean-span relief rate; when they are at or above the threshold and the clean span is shorter, the threshold points are multiplied by the clean-span relief rate and the points above the threshold by twice that rate, and the two products are added; when they are below the threshold, all the active points are multiplied by the clean-span relief rate.'
      cs_tenure_days: The clean-span relief cap is the long-tenure cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure cap for a record opened at least 730 but fewer than 1,095 days before, and the standard clean-span relief cap for every other record.
      cs_cap: The clean-span relief cap is the long-tenure cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure cap for a record opened at least 730 but fewer than 1,095 days before, and the standard clean-span relief cap for every other record.
      result: 'The clean-span relief is worked out in this order: the relief points the band rule gives are rounded down to a whole point, the repeat-record credit is added, and the total is limited to the clean-span relief cap; products are worked to four decimal places before any rounding down.'
      cs_repeat: The repeat-record credit of clean-span relief is the no-repeat credit for a seller with no violation type recorded more than once in the last twelve whole calendar months, the single-repeat credit for a seller with a type recorded twice in that period and none more often, and nothing for a seller with a type recorded three or more times in that period.
      cs_same_type_max: The repeat-record credit of clean-span relief is the no-repeat credit for a seller with no violation type recorded more than once in the last twelve whole calendar months, the single-repeat credit for a seller with a type recorded twice in that period and none more often, and nothing for a seller with a type recorded three or more times in that period.
    factors:
    - id: clean_relief_rate
      effect: parameter
      decides: cs_rate
      bindings:
      - cs_viol_12
      - cs_rate
      ladder:
      - when: placed at Above Standard Level AND at most three policy violations recorded in the last twelve whole calendar months
        value: K('rate_above')
      - when: placed at Standard Level AND at most three policy violations recorded in the last twelve whole calendar months
        value: K('rate_standard_level')
