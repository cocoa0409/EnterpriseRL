
# Seller Performance Standing — the seller's account-health record: monthly performance level, order defects,
# policy violation points, review and feedback disputes, and account actions (warning, suspension, appeal, reinstatement).
category: standing
display_name: Seller Performance Standing

binding:
  holding_table: standing_records
  event_tables: [standing_events]
  intake_tables: [standing_review_disputes, standing_appeals]
  status_field: status
  variant_field: variant_name
  quantity_fields: {violation_points: violation_points}

lifecycle:
  states: [onboarding, good_standing, at_risk, suspended, under_appeal, deactivated, closed]
  transitions:
    - {from: onboarding, to: good_standing, by: system, means: "The first monthly evaluation places the new seller."}
    - {from: good_standing, to: at_risk, by: system, means: "Violation points reach the warning threshold, or a performance metric breaches the seller's level limit at evaluation."}
    - {from: at_risk, to: good_standing, by: system, means: "Points fall below the warning threshold and metrics are back within limits at evaluation."}
    - {from: at_risk, to: suspended, by: system, means: "Violation points reach the suspension threshold, or a violation occurs during probation."}
    - {from: good_standing, to: suspended, by: system, means: "A violation of an immediate-suspension type, or points reaching the suspension threshold at once."}
    - {from: suspended, to: under_appeal, by: user, means: "The seller submits an appeal."}
    - {from: under_appeal, to: good_standing, by: agent, means: "The appeal is accepted and selling privileges are reinstated."}
    - {from: under_appeal, to: suspended, by: agent, means: "The appeal is rejected."}
    - {from: suspended, to: deactivated, by: system, means: "No appeal is submitted within the appeal window, or the appeal limit is exhausted."}
    - {from: good_standing, to: closed, by: user, means: "The seller closes the selling account voluntarily."}
    - {from: at_risk, to: closed, by: user, means: "A seller at risk closes the selling account voluntarily."}
    - {from: deactivated, to: closed, by: system, means: "A deactivated account is closed once its funds are settled."}

accounts:
  - key: violation_points
    unit: points
    meaning: "Active policy violation points of the seller: points of recorded violations in, reversals and expiries out; the holding's violation_points is its running sum."

parameter_schema:
  max_order_defect_rate: Highest order defect rate (defective orders / orders in the defect window, decimal fraction) allowed at the level; not_applicable for the fallback level.
  max_defects_low_volume: When the seller has fewer orders than the low-volume threshold in the defect window, the highest count of defective orders allowed at the level; not_applicable for the fallback level.
  low_volume_order_threshold: Orders in the defect window below which the defect count, not the rate, is compared (integer).
  max_late_shipment_rate: Highest late shipment rate (decimal fraction) allowed at the level; not_applicable for the fallback level.
  max_seller_cancel_rate: Highest seller cancellation rate (decimal fraction) allowed at the level; not_applicable for the fallback level.
  min_valid_tracking_rate: Lowest valid tracking rate on seller-shipped orders (decimal fraction) required at the level; not_applicable where not required.
  min_transactions_12m: Minimum orders over the trailing 12 months required at the level (integer).
  min_sales_12m: Minimum gross sales over the trailing 12 months required at the level, USD.
  min_account_age_days: Minimum seller profile age in calendar days from account_opened_date required at the level (integer).
  max_account_age_days: Maximum seller profile age in calendar days for the level; not_applicable when there is no maximum.
  defect_window_days: Rolling window, in calendar days ending the day before evaluation, for the order defect rate (integer).
  late_shipment_window_days: Rolling window in calendar days for the late shipment rate (integer).
  cancel_rate_window_days: Rolling window in calendar days for the seller cancellation rate (integer).
  tracking_rate_window_days: Rolling window in calendar days for the valid tracking rate (integer).
  defect_types_counted: Defect types that make an order defective (list of defect_type values).
  late_shipment_definition: When a seller-shipped order counts as shipped late (enum string).
  evaluation_day_of_month: Day of the month on which the monthly evaluation runs (integer).
  evaluation_rule: How the level is chosen at evaluation (enum string).
  level_effective_rule: How long an evaluated level applies (enum string).
  warning_points_threshold: Active violation points at or above which the seller is placed at risk (integer).
  suspension_points_threshold: Active violation points at or above which selling privileges are suspended (integer).
  metric_breach_warning: Whether a metric above the seller's level limit at evaluation places a good-standing seller at risk (boolean).
  point_expiry_days: Calendar days after a violation's event_date after which its points expire (integer).
  violation_points_map: Points recorded per violation type (mapping).
  immediate_suspension_violation_types: Violation types that suspend selling privileges as soon as they are recorded (list of violation_type values).
  ip_retraction_reverses_violation: Whether an intellectual_property violation is reversed when the rights owner retracts the complaint (boolean).
  probation_after_reinstatement_days: Calendar days after reinstatement during which any new violation suspends selling privileges immediately (integer).
  appeal_window_days: Calendar days after suspended_date within which an appeal may be submitted (integer).
  max_appeals_per_suspension: Appeals that may be submitted against one suspension (integer).
  appeal_decision_business_days: Business days within which Northloop decides an appeal (integer).
  plan_of_action_required_types: Violation types for which an appeal must be a plan of action (list of violation_type values).
  error_appeal_reverses_points: Whether accepting an appeal on the basis violation_issued_in_error reverses the appealed violation's points (boolean).
  poa_reinstatement_keeps_points: Whether accepting a plan-of-action appeal keeps the violation points on record (boolean).
  feedback_removal_requests_per_month: Seller feedback and product review disputes the seller may submit per calendar month (integer).
  feedback_dispute_window_days: Calendar days after the feedback or review was left within which it may be disputed (integer).
  feedback_removable_reasons: Dispute reasons for which seller feedback is removed when the records support them (list of dispute_reason values).
  product_review_removable_reasons: Dispute reasons for which a product review is removed when the records support them (list of dispute_reason values).
  fbn_feedback_struck: Whether negative feedback solely about the delivery of a Fulfilled by Northloop order is struck (boolean).
  product_reviews_affect_standing: Whether product reviews count as order defects (boolean).
  northloop_funded_claim_not_defect: Whether a guarantee claim funded by Northloop is excluded from defects (boolean).
  chargeback_defect_removed_on_win: Whether a chargeback defect is removed when the seller wins the chargeback dispute (boolean).
  voluntary_close_allowed_statuses: Standing statuses in which the seller may close the selling account voluntarily (list of status values).
  seller_cancel_reasons_excluded: Seller cancellation reasons that do not count toward the cancellation rate (list).
  tracking_valid_definition: When tracking counts as valid (enum string).
  evaluation_order_basis: Which orders the rates are computed over (enum string).
  deactivation_rule: When a suspension becomes a deactivation (enum string).
  new_seller_initial_level: Level assigned at the first evaluation of a seller whose profile is younger than the Developing maximum age (official level name).
  defect_dedup_rule: How several defects on one order are counted in the defect rate (enum string).

