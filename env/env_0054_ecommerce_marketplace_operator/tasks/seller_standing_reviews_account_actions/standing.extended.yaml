    rule: 'Top-performer relief is owed on the evaluation day, once that month''s evaluation is recorded, to a seller placed at Top Rated Level or Preferred Partner Level whose standing record is in good_standing or at_risk and carries active points above zero; it takes points off before any violation''s point expiry period has passed. Top-performer relief is not worked out until every listing-type violation whose listing expiry period has run carries its expiry entry. Top-performer relief is not worked out until every serious violation whose first period has run carries its step-down entry. For top-performer relief, whole calendar months are counted by calendar date back from the handling date: a date lies in the last N whole calendar months when fewer than N whole months have passed from it to the handling date. The active points for top-performer relief are the points of every violation recorded on the standing record, less every point reversed and every point already expired, stepped down or relieved on that record. The standard top-performer relief is those active points multiplied by the standard top-performer rate and rounded down to a whole point, and it never exceeds the standard top-performer cap. The top-performer base rate is the Preferred Partner rate for a seller placed at Preferred Partner Level with no violation recorded in the last three whole calendar months, the Top Rated rate for a seller placed at Top Rated Level with no violation recorded in that period, and the standard top-performer rate for a seller with a violation recorded in that period. The top-performer rate is the base rate plus the repeat adjustment: the no-repeat adjustment when no violation type was recorded more than once in the last twelve whole calendar months, the single-repeat adjustment when a type was recorded twice in that period and none more often, and nothing when a type was recorded three or more times. How the top-performer rate is applied depends on where the active points for top-performer relief stand against the warning points threshold of the seller''s level: when they are at or above the threshold and no violation was recorded in the last six whole calendar months, the points above the threshold come off in full and the threshold points are multiplied by the top-performer rate; when they are at or above the threshold and a violation was recorded in that period, the threshold points are multiplied by the top-performer rate and the points above it by twice that rate, and the two products are added; when they are below the threshold, all the active points are multiplied by the top-performer rate. The severity credit is the clean-severity credit for a seller whose record carries no active points from intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violations, the stepped-down credit for a seller whose active serious points all come from serious violations recorded six or more whole calendar months before the handling date, and nothing for a seller with a serious violation recorded in the last six whole calendar months. The remediation credit is the disposal credit for a seller whose Fulfilled by Northloop enrollment billed a disposal removal fee in the last six whole calendar months, the return credit for a seller whose enrollment billed no disposal removal fee but a return-to-seller removal fee in that period, and nothing for every other seller. The top-performer cap is the long-tenure relief cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure relief cap for a record opened at least 730 but fewer than 1,095 days before, and the standard top-performer cap for every other record. The top-performer relief is worked out in this order: the relief points the band rule gives, the severity credit and the remediation credit are added together, the sum is rounded down to a whole point, and the total is limited to the top-performer cap; products are worked to four decimal places before any rounding down. The top-performer relief is booked as one points-expiry entry against the active violation that still carries the most points, the oldest of them where two carry the same, and the entry carries that violation''s type; where the relief exceeds that violation''s remaining points, the rest is booked the same way against the next. A violation that has received top-performer relief keeps its remaining points on record until they expire, step down or are reversed, and a violation already reversed or fully expired never receives relief.'
