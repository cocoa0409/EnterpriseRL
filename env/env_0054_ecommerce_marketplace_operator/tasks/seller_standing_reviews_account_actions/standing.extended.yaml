  - id: standing_ext_listing_violation_expiry
    base_policy_refs:
    - standing_violation_rules
    overwrite:
    - base_policy: standing_violation_rules
      superseded_clause: Points expire when the point expiry period has passed, counted in calendar days from the violation's event_date.
      replaced_by: A listing-type violation, meaning a listing_policy or restricted_product violation, expires once its listing expiry period has run, counted in whole calendar months back from the handling date to the violation's event date, and its expiry is booked as one points-expiry entry carrying the violation's reference and type.
    - base_policy: standing_violation_rules
      superseded_clause: A reversed or expired violation is never reversed or expired a second time.
      replaced_by: A listing-type violation that received relief expires for the points it still carries, and a violation already reversed or fully expired never receives another expiry entry.
    trigger: state_due
    subject:
    - standing_points_expiry
    computes: points
    target_tool: book_listing_violation_expiry_caba69b5
    params:
      period_top: 4
      period_mid: 5
      period_standard: 6
      ext_three: 2
      ext_two: 1
      stock_offset_no_disposal: 2
      stock_offset_disposal: 1
    rule: 'A listing-type violation, meaning a listing_policy or restricted_product violation, expires once its listing expiry period has run, counted in whole calendar months back from the handling date to the violation''s event date, and its expiry is booked as one points-expiry entry carrying the violation''s reference and type. For listing-type expiry, a date lies in the last N whole calendar months when fewer than N whole months have passed from it to the handling date. Under the standard method every listing-type violation expires once the standard expiry period, in whole calendar months, has run. The points that expire are, for each listing type, the points recorded for violations of that type whose listing expiry period has run, less every point already expired, relieved or reversed on entries carrying that type, never less than zero, and the expiring points of the two listing types are added together. The listing expiry period starts from the top-level expiry period for a seller placed at Top Rated Level or Preferred Partner Level with no listing-type violation recorded in the last three whole calendar months, from the mid-level expiry period for a seller placed at Standard Level or Above Standard Level with no listing-type violation recorded in that period, and from the standard expiry period for every other seller. The repeat count is taken over the last twelve whole calendar months: for a seller with a serious violation (intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation) recorded in that period it counts every violation of any type recorded in that period; for a seller with no serious violation but two or more listing-type violations recorded in that period it counts the listing-type violations of both types together; for every other seller it counts the violations of the more frequent listing type only. The repeat extension adds the three-violation extension to the period when the repeat count is three or more, the two-violation extension when it is two, and nothing when it is lower. The stock-hold offset adds the no-disposal offset for a seller whose Fulfilled by Northloop enrollment still holds units on hand and billed no disposal removal fee in the last six whole calendar months, the disposal offset for a seller whose enrollment holds units on hand and billed a disposal removal fee in that period, and nothing for a seller whose enrollment holds no units or who has no enrollment. The listing expiry period is the starting period plus the repeat extension plus the stock-hold offset, and the same period applies to both listing types. A listing-type violation that received relief expires for the points it still carries, and a violation already reversed or fully expired never receives another expiry entry.'
