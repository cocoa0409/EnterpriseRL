    - tp_serious_active: (SUM('standing_events','points', event_type='standing_violation_record', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='review_manipulation')) - (SUM('standing_events','points', event_type='standing_points_expiry', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='review_manipulation') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='review_manipulation'))
    - tp_serious_6: COUNT('standing_events', within_months=6, event_type='standing_violation_record', violation_type='intellectual_property') + COUNT('standing_events', within_months=6, event_type='standing_violation_record', violation_type='inauthentic_complaint') + COUNT('standing_events', within_months=6, event_type='standing_violation_record', violation_type='product_authenticity') + COUNT('standing_events', within_months=6, event_type='standing_violation_record', violation_type='review_manipulation')
    - tp_severity_credit: K('severity_clean') if tp_serious_active <= 0 else (K('severity_stepped') if tp_serious_6 == 0 else 0)
    - tp_disposals_6: XCOUNT('fulfill','fulfill_events', within_months=6, event_type='fulfill_removal_fee', removal_type='disposal')
    - tp_returns_6: XCOUNT('fulfill','fulfill_events', within_months=6, event_type='fulfill_removal_fee', removal_type='return_to_seller')
    - tp_remediation_credit: K('remediation_disposal') if tp_disposals_6 >= 1 else (K('remediation_return') if tp_returns_6 >= 1 else 0)
    - tp_tenure_days: DAYS(F('enrolled_date'), NOW)
    - tp_cap: K('cap_long') if tp_tenure_days >= 1095 else (K('cap_mid') if tp_tenure_days >= 730 else K('cap_standard'))
    - result: MN(tp_cap, int(RND(tp_relief_raw + tp_severity_credit + tp_remediation_credit, 4)))
