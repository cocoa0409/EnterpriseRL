    - ap_lp_last: LATEST('standing_events','event_date', event_type='standing_violation_record', violation_type='listing_policy')
    - ap_rp_last: LATEST('standing_events','event_date', event_type='standing_violation_record', violation_type='restricted_product')
    - ap_listing_span: 99 if (ap_lp_last == None and ap_rp_last == None) else MONTHS(ap_rp_last if ap_lp_last == None else (ap_lp_last if ap_rp_last == None else MX(ap_lp_last, ap_rp_last)), NOW)
