    compute:
    - tp_active: SUM('standing_events','points', event_type='standing_violation_record') - SUM('standing_events','points', event_type='standing_violation_reversal') - SUM('standing_events','points', event_type='standing_points_expiry')
    - tp_viol_3: COUNT('standing_events', within_months=3, event_type='standing_violation_record')
    - tp_base_rate: K('rate_preferred') if (F('variant_name') == 'Preferred Partner Level' and tp_viol_3 == 0) else (K('rate_top_rated') if (F('variant_name') == 'Top Rated Level' and tp_viol_3 == 0) else K('rate_standard'))
    - tp_same_type_max: MX(COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='listing_policy'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='restricted_product'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='intellectual_property'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='inauthentic_complaint'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='product_authenticity'), COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='review_manipulation'))
    - tp_repeat_add: K('repeat_none') if tp_same_type_max <= 1 else (K('repeat_one') if tp_same_type_max == 2 else 0)
