    overwrite:
    - base_policy: standing_violation_rules
      superseded_clause: Points expire when the point expiry period has passed, counted in calendar days from the violation's event_date.
      replaced_by: Action-plan relief takes points off before any violation's point expiry period has passed.
    - base_policy: standing_violation_rules
      superseded_clause: A reversed or expired violation is never reversed or expired a second time.
      replaced_by: A violation that has received action-plan relief keeps its remaining points on record until they expire or are reversed, and a violation already reversed or fully expired never receives relief.
    trigger: on_request
