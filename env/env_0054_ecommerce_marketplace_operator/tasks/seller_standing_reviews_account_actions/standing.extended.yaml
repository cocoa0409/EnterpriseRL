    - ap_lp_active: SUM('standing_events','points', event_type='standing_violation_record', violation_type='listing_policy') - (SUM('standing_events','points', event_type='standing_points_expiry', violation_type='listing_policy') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='listing_policy'))
    - ap_lt_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='listing_policy') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='restricted_product')
