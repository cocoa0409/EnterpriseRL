    - cf_lt_active: (SUM('standing_events','points', event_type='standing_violation_record', violation_type='listing_policy') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='restricted_product')) - (SUM('standing_events','points', event_type='standing_points_expiry', violation_type='listing_policy') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='listing_policy') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='restricted_product') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='restricted_product'))
    - cf_viol_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record')
    - cf_share: K('share_top') if ((F('variant_name') == 'Top Rated Level' or F('variant_name') == 'Preferred Partner Level') and cf_viol_12 <= 3) else (K('share_mid') if ((F('variant_name') == 'Standard Level' or F('variant_name') == 'Above Standard Level') and cf_viol_12 <= 3) else K('share_standard'))
    - cf_ser_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='intellectual_property') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='inauthentic_complaint') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='product_authenticity') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='review_manipulation')
    - cf_ser_24: COUNT('standing_events', within_months=24, event_type='standing_violation_record', violation_type='intellectual_property') + COUNT('standing_events', within_months=24, event_type='standing_violation_record', violation_type='inauthentic_complaint') + COUNT('standing_events', within_months=24, event_type='standing_violation_record', violation_type='product_authenticity') + COUNT('standing_events', within_months=24, event_type='standing_violation_record', violation_type='review_manipulation')
    - cf_ser_active: (SUM('standing_events','points', event_type='standing_violation_record', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='review_manipulation')) - (SUM('standing_events','points', event_type='standing_points_expiry', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='review_manipulation') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='review_manipulation'))
    - cf_base: (cf_lt_active + int(cf_ser_active / 2)) if cf_ser_12 >= 1 else ((cf_lt_active + int(cf_ser_active * 3 / 4)) if cf_ser_24 >= 1 else cf_active)
    - cf_lt_6: COUNT('standing_events', within_months=6, event_type='standing_violation_record', violation_type='listing_policy') + COUNT('standing_events', within_months=6, event_type='standing_violation_record', violation_type='restricted_product')
    - cf_lt_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='listing_policy') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='restricted_product')
    - cf_hold: K('hold_recent') if cf_lt_6 >= 1 else (K('hold_year') if cf_lt_12 >= 1 else 0)
    - cf_risk_points: SUM('standing_events','points', event_type='standing_violation_record') - SUM('standing_events','points', event_type='standing_violation_reversal') - SUM('standing_events','points', event_type='standing_points_expiry')
    - cf_risk_hold: K('risk_warning') if (F('status') == 'at_risk' and cf_risk_points >= P('warning_points_threshold')) else (K('risk_below') if (F('status') == 'at_risk' and cf_risk_points < P('warning_points_threshold')) else 0)
    - cf_tenure_days: DAYS(F('enrolled_date'), NOW)
    - cf_cap: K('cap_long') if cf_tenure_days >= 1095 else (K('cap_mid') if cf_tenure_days >= 730 else K('cap_standard'))
    - result: MN(cf_cap, MX(0, int(RND(cf_base * cf_share, 4)) - cf_hold - cf_risk_hold))
    compute_basis:
      cf_active: The active points at closing are the points of every violation recorded on the standing record less every point reversed, expired, stepped down or relieved; the listing-type points at closing are the same for listing_policy and restricted_product violations and the entries carrying those types, and the serious points at closing are the same for intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violations and the entries carrying those types.
      cf_lt_active: The active points at closing are the points of every violation recorded on the standing record less every point reversed, expired, stepped down or relieved; the listing-type points at closing are the same for listing_policy and restricted_product violations and the entries carrying those types, and the serious points at closing are the same for intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violations and the entries carrying those types.
      cf_viol_12: The retirement share is the top-level retirement share for a seller placed at Top Rated Level or Preferred Partner Level with at most three policy violations recorded in the last twelve whole calendar months, the mid-level retirement share for a seller placed at Standard Level or Above Standard Level with at most three policy violations recorded in that period, and the standard retirement share for a seller placed at a lower level or with four or more policy violations recorded in that period.
      cf_share: The retirement share is the top-level retirement share for a seller placed at Top Rated Level or Preferred Partner Level with at most three policy violations recorded in the last twelve whole calendar months, the mid-level retirement share for a seller placed at Standard Level or Above Standard Level with at most three policy violations recorded in that period, and the standard retirement share for a seller placed at a lower level or with four or more policy violations recorded in that period.
      cf_ser_12: 'Which points can be retired depends on how recent the seller''s serious violations are: for a seller with a serious violation recorded in the last twelve whole calendar months the retirement acts on the listing-type points at closing plus half of the serious points at closing, the half rounded down to a whole point; for a seller whose most recent serious violation was recorded twelve to twenty-three whole calendar months before the closing date it acts on the listing-type points plus three quarters of the serious points, rounded down; for every other seller it acts on all the active points at closing.'
      cf_ser_24: 'Which points can be retired depends on how recent the seller''s serious violations are: for a seller with a serious violation recorded in the last twelve whole calendar months the retirement acts on the listing-type points at closing plus half of the serious points at closing, the half rounded down to a whole point; for a seller whose most recent serious violation was recorded twelve to twenty-three whole calendar months before the closing date it acts on the listing-type points plus three quarters of the serious points, rounded down; for every other seller it acts on all the active points at closing.'
      cf_ser_active: The active points at closing are the points of every violation recorded on the standing record less every point reversed, expired, stepped down or relieved; the listing-type points at closing are the same for listing_policy and restricted_product violations and the entries carrying those types, and the serious points at closing are the same for intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violations and the entries carrying those types.
      cf_base: 'Which points can be retired depends on how recent the seller''s serious violations are: for a seller with a serious violation recorded in the last twelve whole calendar months the retirement acts on the listing-type points at closing plus half of the serious points at closing, the half rounded down to a whole point; for a seller whose most recent serious violation was recorded twelve to twenty-three whole calendar months before the closing date it acts on the listing-type points plus three quarters of the serious points, rounded down; for every other seller it acts on all the active points at closing.'
      cf_lt_6: The recent-listing hold is the recent hold when a listing_policy or restricted_product violation was recorded in the last six whole calendar months, the year hold when one was recorded in the last twelve whole calendar months but none in the last six, and nothing otherwise.
      cf_lt_12: The recent-listing hold is the recent hold when a listing_policy or restricted_product violation was recorded in the last six whole calendar months, the year hold when one was recorded in the last twelve whole calendar months but none in the last six, and nothing otherwise.
      cf_hold: The recent-listing hold is the recent hold when a listing_policy or restricted_product violation was recorded in the last six whole calendar months, the year hold when one was recorded in the last twelve whole calendar months but none in the last six, and nothing otherwise.
      cf_tenure_days: The retirement cap is the long-tenure retirement cap for a standing record opened 1,095 days or more before the closing date, the mid-tenure retirement cap for a record opened at least 730 but fewer than 1,095 days before, and the standard retirement cap for every other record.
      cf_cap: The retirement cap is the long-tenure retirement cap for a standing record opened 1,095 days or more before the closing date, the mid-tenure retirement cap for a record opened at least 730 but fewer than 1,095 days before, and the standard retirement cap for every other record.
      result: 'The retired points are worked out in this order: the retirement basis is multiplied by the retirement share and rounded down to a whole point, the recent-listing hold and the at-risk hold are subtracted, the result never falls below zero, and it is limited to the retirement cap; products are worked to four decimal places before any rounding down.'
      cf_risk_points: The at-risk hold is the warning-band hold for a seller whose record is at_risk and whose active points at closing are at or above the warning points threshold of the seller's level, the at-risk hold for a seller whose record is at_risk with active points at closing below that threshold, and nothing for a seller in good_standing.
      cf_risk_hold: The at-risk hold is the warning-band hold for a seller whose record is at_risk and whose active points at closing are at or above the warning points threshold of the seller's level, the at-risk hold for a seller whose record is at_risk with active points at closing below that threshold, and nothing for a seller in good_standing.
    factors:
    - id: retirement_share
      effect: parameter
      decides: cf_share
      bindings:
      - cf_viol_12
      - cf_share
      ladder:
      - when: placed at Top Rated Level or Preferred Partner Level AND at most three policy violations recorded in the last twelve whole calendar months
        value: K('share_top')
      - when: placed at Standard Level or Above Standard Level AND at most three policy violations recorded in that period
        value: K('share_mid')
      - when: otherwise (placed at a lower level, or four or more policy violations recorded in that period)
        value: K('share_standard')
      baseline:
        cf_share: K('share_standard')
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: retirement_basis
      effect: method
      decides: cf_base
      bindings:
      - cf_ser_12
      - cf_ser_24
      - cf_base
      ladder:
      - when: a serious violation recorded in the last twelve whole calendar months
        method: the retirement acts on the listing-type points at closing plus half of the serious points at closing
      - when: the most recent serious violation recorded twelve to twenty-three whole calendar months before the closing date
        method: the retirement acts on the listing-type points plus three quarters of the serious points
      - when: otherwise
        method: the retirement acts on all the active points at closing
      baseline:
        cf_base: cf_active
      evidence:
      - history
      cross_difficulty: null
    - id: recent_listing_hold
      effect: parameter
      decides: cf_hold
      bindings:
      - cf_lt_6
      - cf_lt_12
      - cf_hold
      ladder:
      - when: a listing_policy or restricted_product violation recorded in the last six whole calendar months
        value: K('hold_recent')
      - when: one recorded in the last twelve whole calendar months but none in the last six
        value: K('hold_year')
      - when: otherwise
        value: '0'
      baseline:
        cf_hold: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: at_risk_hold
      effect: parameter
      decides: cf_risk_hold
      bindings:
      - cf_risk_points
      - cf_risk_hold
      ladder:
      - when: record at_risk AND active points at closing at or above the warning points threshold
        value: K('risk_warning')
      - when: record at_risk AND active points at closing below the warning points threshold
        value: K('risk_below')
      - when: otherwise (record in good_standing)
        value: '0'
      baseline:
        cf_risk_hold: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: retirement_tenure_cap
      effect: parameter
      decides: cf_cap
      bindings:
      - cf_tenure_days
      - cf_cap
      ladder:
      - when: standing record opened 1,095 days or more before the closing date
        value: K('cap_long')
      - when: standing record opened at least 730 but fewer than 1,095 days before
        value: K('cap_mid')
      - when: otherwise
        value: K('cap_standard')
      baseline:
        cf_cap: K('cap_standard')
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: The active points at closing are the points of every violation recorded on the standing record less every point reversed, expired, stepped down or relieved; the listing-type points at closing are the same for listing_policy and restricted_product violations and the entries carrying those types, and the serious points at closing are the same for intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violations and the entries carrying those types. The standard retired points are the active points at closing multiplied by the standard retirement share and rounded down to a whole point, and never more than the standard retirement cap.
      params:
      - share_standard
      - cap_standard
    inputs:
      history:
      - table: standing_events
        aggregate: sum
        field: points
        filters:
          event_type: standing_violation_record
      - table: standing_events
        aggregate: count
        field: standing_event_id
        within_months: 12
        filters:
          event_type: standing_violation_record
      cross_category: []
