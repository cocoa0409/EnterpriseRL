  - id: standing_ext_serious_violation_step_down
    base_policy_refs:
    - standing_violation_rules
    overwrite:
    - base_policy: standing_violation_rules
      superseded_clause: Points expire when the point expiry period has passed, counted in calendar days from the violation's event_date.
      replaced_by: 'A serious violation, meaning an intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violation, does not expire in full when its first period of six whole calendar months from its event date has run: it steps down once, part of the points it still carries coming off as one points-expiry entry carrying the violation''s reference and type, and the rest expiring when a second period of the same length has run.'
    - base_policy: standing_violation_rules
      superseded_clause: A reversed or expired violation is never reversed or expired a second time.
      replaced_by: A serious violation that has stepped down keeps its remaining points on record until its second period has run, and a violation already reversed or fully expired never steps down.
    trigger: state_due
    subject:
    - standing_points_expiry
    computes: points
    target_tool: book_serious_step_down_71a20607
    params:
      step_high: 0.2
      step_mid: 0.15
      step_standard: 0.125
      quiet_long: 1.5
      quiet_short: 1.25
      cap_long: 4
      cap_mid: 3
      cap_standard: 2
    rule: 'A serious violation, meaning an intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violation, does not expire in full when its first period of six whole calendar months from its event date has run: it steps down once, part of the points it still carries coming off as one points-expiry entry carrying the violation''s reference and type, and the rest expiring when a second period of the same length has run. For the step-down, whole calendar months are counted by calendar date back from the handling date: a date lies in the last N whole calendar months when fewer than N whole months have passed from it to the handling date. The points carried at the step-down are the points recorded for serious violations whose first period has run, less every point already expired, relieved or reversed on entries carrying a serious type, and never less than zero. The standard step-down is the carried points multiplied by the standard step-down share and rounded down to a whole point, and it never exceeds the standard step-down cap or the carried points. The step-down share is the high step-down share for a seller placed at Above Standard Level, Top Rated Level or Preferred Partner Level with no more than one serious violation recorded in the last twelve whole calendar months, the middle step-down share for a seller placed at Standard Level, Developing Seller Level or Below Standard Level with no more than one serious violation recorded in that period, and the standard step-down share for a seller with two or more serious violations recorded in that period. The share-applied points are the carried points multiplied by the step-down share and then by the quiet multiplier, rounded down to a whole point; the quiet multiplier is the long-quiet multiplier when six or more whole calendar months have passed since the most recent violation of any type was recorded, the short-quiet multiplier when three to five have passed, and one when fewer have passed. How much steps down depends on what the seller has done with stock in the Fulfilled by Northloop network: for a seller whose enrollment billed a disposal removal fee in the last six whole calendar months all the carried points come off at the step-down; for a seller whose enrollment billed no disposal removal fee but a return-to-seller removal fee in that period the share-applied points come off together with one quarter of the carried points left after them, rounded down to a whole point; for every other seller the share-applied points come off. The step-down cap is the long-tenure step-down cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure step-down cap for a record opened at least 730 but fewer than 1,095 days before, and the standard step-down cap for every other record. The step-down is worked out in this order: the share-applied points are found, the stock rule gives the points that step down, and the total is limited to the step-down cap or to the carried points, whichever is lower; products are worked to four decimal places before any rounding down. A serious violation that has stepped down keeps its remaining points on record until its second period has run, and a violation already reversed or fully expired never steps down.'
    prerequisite: []
    cross_category:
    - category: fulfill
      as: history
      reads:
      - fulfill_events.event_type
      - fulfill_events.removal_type
      - fulfill_events.event_date
      note: The stock-rule tier of the step-down is decided from the disposal and return-to-seller removal fees the seller's Fulfilled by Northloop enrollment billed in the last six whole calendar months.
    compute:
    - sv_carried: MX(0, (SUM('standing_events','points', event_type='standing_violation_record', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_violation_record', violation_type='review_manipulation')) - (SUM('standing_events','points', event_type='standing_violation_record', violation_type='intellectual_property', within_months=6) + SUM('standing_events','points', event_type='standing_violation_record', violation_type='inauthentic_complaint', within_months=6) + SUM('standing_events','points', event_type='standing_violation_record', violation_type='product_authenticity', within_months=6) + SUM('standing_events','points', event_type='standing_violation_record', violation_type='review_manipulation', within_months=6)) - (SUM('standing_events','points', event_type='standing_points_expiry', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='intellectual_property') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='inauthentic_complaint') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='product_authenticity') + SUM('standing_events','points', event_type='standing_points_expiry', violation_type='review_manipulation') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='review_manipulation')))
    - sv_serious_12: COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='intellectual_property') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='inauthentic_complaint') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='product_authenticity') + COUNT('standing_events', within_months=12, event_type='standing_violation_record', violation_type='review_manipulation')
    - sv_upper: F('variant_name') == 'Above Standard Level' or F('variant_name') == 'Top Rated Level' or F('variant_name') == 'Preferred Partner Level'
    - sv_share: K('step_high') if (sv_upper and sv_serious_12 <= 1) else (K('step_mid') if ((not sv_upper) and sv_serious_12 <= 1) else K('step_standard'))
    - sv_quiet: MONTHS(LATEST('standing_events','event_date', event_type='standing_violation_record'), NOW)
    - sv_quiet_mult: K('quiet_long') if sv_quiet >= 6 else (K('quiet_short') if sv_quiet >= 3 else 1)
    - sv_share_points: int(RND(sv_carried * sv_share * sv_quiet_mult, 4))
    - sv_disposals_6: XCOUNT('fulfill','fulfill_events', within_months=6, event_type='fulfill_removal_fee', removal_type='disposal')
    - sv_returns_6: XCOUNT('fulfill','fulfill_events', within_months=6, event_type='fulfill_removal_fee', removal_type='return_to_seller')
    - sv_step: sv_carried if sv_disposals_6 >= 1 else ((sv_share_points + int((sv_carried - sv_share_points) / 4)) if sv_returns_6 >= 1 else sv_share_points)
    - sv_tenure_days: DAYS(F('enrolled_date'), NOW)
    - sv_cap: K('cap_long') if sv_tenure_days >= 1095 else (K('cap_mid') if sv_tenure_days >= 730 else K('cap_standard'))
    - result: MN(sv_carried, sv_cap, sv_step)
    compute_basis:
      sv_carried: The points carried at the step-down are the points recorded for serious violations whose first period has run, less every point already expired, relieved or reversed on entries carrying a serious type, and never less than zero.
      sv_serious_12: The step-down share is the high step-down share for a seller placed at Above Standard Level, Top Rated Level or Preferred Partner Level with no more than one serious violation recorded in the last twelve whole calendar months, the middle step-down share for a seller placed at Standard Level, Developing Seller Level or Below Standard Level with no more than one serious violation recorded in that period, and the standard step-down share for a seller with two or more serious violations recorded in that period.
      sv_upper: The step-down share is the high step-down share for a seller placed at Above Standard Level, Top Rated Level or Preferred Partner Level with no more than one serious violation recorded in the last twelve whole calendar months, the middle step-down share for a seller placed at Standard Level, Developing Seller Level or Below Standard Level with no more than one serious violation recorded in that period, and the standard step-down share for a seller with two or more serious violations recorded in that period.
      sv_share: The step-down share is the high step-down share for a seller placed at Above Standard Level, Top Rated Level or Preferred Partner Level with no more than one serious violation recorded in the last twelve whole calendar months, the middle step-down share for a seller placed at Standard Level, Developing Seller Level or Below Standard Level with no more than one serious violation recorded in that period, and the standard step-down share for a seller with two or more serious violations recorded in that period.
      sv_quiet: The share-applied points are the carried points multiplied by the step-down share and then by the quiet multiplier, rounded down to a whole point; the quiet multiplier is the long-quiet multiplier when six or more whole calendar months have passed since the most recent violation of any type was recorded, the short-quiet multiplier when three to five have passed, and one when fewer have passed.
      sv_quiet_mult: The share-applied points are the carried points multiplied by the step-down share and then by the quiet multiplier, rounded down to a whole point; the quiet multiplier is the long-quiet multiplier when six or more whole calendar months have passed since the most recent violation of any type was recorded, the short-quiet multiplier when three to five have passed, and one when fewer have passed.
      sv_share_points: The share-applied points are the carried points multiplied by the step-down share and then by the quiet multiplier, rounded down to a whole point; the quiet multiplier is the long-quiet multiplier when six or more whole calendar months have passed since the most recent violation of any type was recorded, the short-quiet multiplier when three to five have passed, and one when fewer have passed.
      sv_disposals_6: 'How much steps down depends on what the seller has done with stock in the Fulfilled by Northloop network: for a seller whose enrollment billed a disposal removal fee in the last six whole calendar months all the carried points come off at the step-down; for a seller whose enrollment billed no disposal removal fee but a return-to-seller removal fee in that period the share-applied points come off together with one quarter of the carried points left after them, rounded down to a whole point; for every other seller the share-applied points come off.'
      sv_returns_6: 'How much steps down depends on what the seller has done with stock in the Fulfilled by Northloop network: for a seller whose enrollment billed a disposal removal fee in the last six whole calendar months all the carried points come off at the step-down; for a seller whose enrollment billed no disposal removal fee but a return-to-seller removal fee in that period the share-applied points come off together with one quarter of the carried points left after them, rounded down to a whole point; for every other seller the share-applied points come off.'
      sv_step: 'How much steps down depends on what the seller has done with stock in the Fulfilled by Northloop network: for a seller whose enrollment billed a disposal removal fee in the last six whole calendar months all the carried points come off at the step-down; for a seller whose enrollment billed no disposal removal fee but a return-to-seller removal fee in that period the share-applied points come off together with one quarter of the carried points left after them, rounded down to a whole point; for every other seller the share-applied points come off.'
      sv_tenure_days: The step-down cap is the long-tenure step-down cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure step-down cap for a record opened at least 730 but fewer than 1,095 days before, and the standard step-down cap for every other record.
      sv_cap: The step-down cap is the long-tenure step-down cap for a standing record opened 1,095 days or more before the handling date, the mid-tenure step-down cap for a record opened at least 730 but fewer than 1,095 days before, and the standard step-down cap for every other record.
      result: 'The step-down is worked out in this order: the share-applied points are found, the stock rule gives the points that step down, and the total is limited to the step-down cap or to the carried points, whichever is lower; products are worked to four decimal places before any rounding down.'
