      policy_source: Top-performer relief is not worked out until every listing-type violation whose listing expiry period has run carries its expiry entry.
      condition: standing_events carries, for every listing_policy or restricted_product violation whose listing expiry period has run, a standing_points_expiry entry booking its remaining points, so the active points for top-performer relief already exclude them.
