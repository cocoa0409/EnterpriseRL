    rule: 'A seller may close the selling account voluntarily while the standing record is in good_standing or at_risk; closing is the seller''s own act and is confirmed by the seller. The closing write sets the record to closed with the closing date and books the retired points as a points-expiry entry; the points left on the record after it are the closed record''s active points, which carry forward. A seller who closed voluntarily and returns gets a new record, which opens with the active points the closed record kept. The retired points are fixed only after any top-performer relief owed on the evaluation day stands booked on the standing record. For closure, whole calendar months are counted by calendar date back from the closing date: a date lies in the last N whole calendar months when fewer than N whole months have passed from it to the closing date. The active points at closing are the points of every violation recorded on the standing record less every point reversed, expired, stepped down or relieved; the listing-type points at closing are the same for listing_policy and restricted_product violations and the entries carrying those types, and the serious points at closing are the same for intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation violations and the entries carrying those types. The standard retired points are the active points at closing multiplied by the standard retirement share and rounded down to a whole point, and never more than the standard retirement cap. The retirement share is the top-level retirement share for a seller placed at Top Rated Level or Preferred Partner Level with at most three policy violations recorded in the last twelve whole calendar months, the mid-level retirement share for a seller placed at Standard Level or Above Standard Level with at most three policy violations recorded in that period, and the standard retirement share for a seller placed at a lower level or with four or more policy violations recorded in that period. Which points can be retired depends on how recent the seller''s serious violations are: for a seller with a serious violation recorded in the last twelve whole calendar months the retirement acts on the listing-type points at closing plus half of the serious points at closing, the half rounded down to a whole point; for a seller whose most recent serious violation was recorded twelve to twenty-three whole calendar months before the closing date it acts on the listing-type points plus three quarters of the serious points, rounded down; for every other seller it acts on all the active points at closing. The recent-listing hold is the recent hold when a listing_policy or restricted_product violation was recorded in the last six whole calendar months, the year hold when one was recorded in the last twelve whole calendar months but none in the last six, and nothing otherwise. The at-risk hold is the warning-band hold for a seller whose record is at_risk and whose active points at closing are at or above the warning points threshold of the seller''s level, the at-risk hold for a seller whose record is at_risk with active points at closing below that threshold, and nothing for a seller in good_standing. The retirement cap is the long-tenure retirement cap for a standing record opened 1,095 days or more before the closing date, the mid-tenure retirement cap for a record opened at least 730 but fewer than 1,095 days before, and the standard retirement cap for every other record. The retired points are worked out in this order: the retirement basis is multiplied by the retirement share and rounded down to a whole point, the recent-listing hold and the at-risk hold are subtracted, the result never falls below zero, and it is limited to the retirement cap; products are worked to four decimal places before any rounding down. The retired points are booked against the listing-type violation that still carries the most points, the oldest of them where two carry the same, and the entry carries that violation''s type; where they exceed that violation''s remaining points, the rest is booked the same way against the next listing-type violation and only then against serious violations.'
