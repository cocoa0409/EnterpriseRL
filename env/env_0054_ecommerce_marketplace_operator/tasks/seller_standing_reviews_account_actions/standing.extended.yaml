    - mn_period: mn_base_period + mn_ext + mn_stock_offset
    - mn_lp_due: MX(0, SUM('standing_events','points', event_type='standing_violation_record', violation_type='listing_policy') - SUM('standing_events','points', event_type='standing_violation_record', violation_type='listing_policy', within_months=mn_period) - (SUM('standing_events','points', event_type='standing_points_expiry', violation_type='listing_policy') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='listing_policy')))
    - mn_rp_due: MX(0, SUM('standing_events','points', event_type='standing_violation_record', violation_type='restricted_product') - SUM('standing_events','points', event_type='standing_violation_record', violation_type='restricted_product', within_months=mn_period) - (SUM('standing_events','points', event_type='standing_points_expiry', violation_type='restricted_product') + SUM('standing_events','points', event_type='standing_violation_reversal', violation_type='restricted_product')))
    - result: mn_lp_due + mn_rp_due
    compute_basis:
      mn_lt_3: The listing expiry period starts from the top-level expiry period for a seller placed at Top Rated Level or Preferred Partner Level with no listing-type violation recorded in the last three whole calendar months, from the mid-level expiry period for a seller placed at Standard Level or Above Standard Level with no listing-type violation recorded in that period, and from the standard expiry period for every other seller.
      mn_top: The listing expiry period starts from the top-level expiry period for a seller placed at Top Rated Level or Preferred Partner Level with no listing-type violation recorded in the last three whole calendar months, from the mid-level expiry period for a seller placed at Standard Level or Above Standard Level with no listing-type violation recorded in that period, and from the standard expiry period for every other seller.
      mn_mid: The listing expiry period starts from the top-level expiry period for a seller placed at Top Rated Level or Preferred Partner Level with no listing-type violation recorded in the last three whole calendar months, from the mid-level expiry period for a seller placed at Standard Level or Above Standard Level with no listing-type violation recorded in that period, and from the standard expiry period for every other seller.
      mn_base_period: The listing expiry period starts from the top-level expiry period for a seller placed at Top Rated Level or Preferred Partner Level with no listing-type violation recorded in the last three whole calendar months, from the mid-level expiry period for a seller placed at Standard Level or Above Standard Level with no listing-type violation recorded in that period, and from the standard expiry period for every other seller.
      mn_serious_12: 'The repeat count is taken over the last twelve whole calendar months: for a seller with a serious violation (intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation) recorded in that period it counts every violation of any type recorded in that period; for a seller with no serious violation but two or more listing-type violations recorded in that period it counts the listing-type violations of both types together; for every other seller it counts the violations of the more frequent listing type only.'
      mn_all_12: 'The repeat count is taken over the last twelve whole calendar months: for a seller with a serious violation (intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation) recorded in that period it counts every violation of any type recorded in that period; for a seller with no serious violation but two or more listing-type violations recorded in that period it counts the listing-type violations of both types together; for every other seller it counts the violations of the more frequent listing type only.'
      mn_lt_12: 'The repeat count is taken over the last twelve whole calendar months: for a seller with a serious violation (intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation) recorded in that period it counts every violation of any type recorded in that period; for a seller with no serious violation but two or more listing-type violations recorded in that period it counts the listing-type violations of both types together; for every other seller it counts the violations of the more frequent listing type only.'
      mn_same_12: 'The repeat count is taken over the last twelve whole calendar months: for a seller with a serious violation (intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation) recorded in that period it counts every violation of any type recorded in that period; for a seller with no serious violation but two or more listing-type violations recorded in that period it counts the listing-type violations of both types together; for every other seller it counts the violations of the more frequent listing type only.'
      mn_repeat_count: 'The repeat count is taken over the last twelve whole calendar months: for a seller with a serious violation (intellectual_property, inauthentic_complaint, product_authenticity or review_manipulation) recorded in that period it counts every violation of any type recorded in that period; for a seller with no serious violation but two or more listing-type violations recorded in that period it counts the listing-type violations of both types together; for every other seller it counts the violations of the more frequent listing type only.'
      mn_ext: The repeat extension adds the three-violation extension to the period when the repeat count is three or more, the two-violation extension when it is two, and nothing when it is lower.
      mn_units: The stock-hold offset adds the no-disposal offset for a seller whose Fulfilled by Northloop enrollment still holds units on hand and billed no disposal removal fee in the last six whole calendar months, the disposal offset for a seller whose enrollment holds units on hand and billed a disposal removal fee in that period, and nothing for a seller whose enrollment holds no units or who has no enrollment.
      mn_disposals_6: The stock-hold offset adds the no-disposal offset for a seller whose Fulfilled by Northloop enrollment still holds units on hand and billed no disposal removal fee in the last six whole calendar months, the disposal offset for a seller whose enrollment holds units on hand and billed a disposal removal fee in that period, and nothing for a seller whose enrollment holds no units or who has no enrollment.
      mn_stock_offset: The stock-hold offset adds the no-disposal offset for a seller whose Fulfilled by Northloop enrollment still holds units on hand and billed no disposal removal fee in the last six whole calendar months, the disposal offset for a seller whose enrollment holds units on hand and billed a disposal removal fee in that period, and nothing for a seller whose enrollment holds no units or who has no enrollment.
      mn_period: The listing expiry period is the starting period plus the repeat extension plus the stock-hold offset, and the same period applies to both listing types.
      mn_lp_due: Under the standard method every listing-type violation expires once the standard expiry period, in whole calendar months, has run. The points that expire are, for each listing type, the points recorded for violations of that type whose listing expiry period has run, less every point already expired, relieved or reversed on entries carrying that type, never less than zero, and the expiring points of the two listing types are added together.
      mn_rp_due: Under the standard method every listing-type violation expires once the standard expiry period, in whole calendar months, has run. The points that expire are, for each listing type, the points recorded for violations of that type whose listing expiry period has run, less every point already expired, relieved or reversed on entries carrying that type, never less than zero, and the expiring points of the two listing types are added together.
      result: Under the standard method every listing-type violation expires once the standard expiry period, in whole calendar months, has run. The points that expire are, for each listing type, the points recorded for violations of that type whose listing expiry period has run, less every point already expired, relieved or reversed on entries carrying that type, never less than zero, and the expiring points of the two listing types are added together.
