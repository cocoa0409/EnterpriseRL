    base_policy_refs:
    - standing_closure
    - standing_violation_rules
    - standing_agg_multi_holding
    overwrite:
    - base_policy: standing_agg_multi_holding
      superseded_clause: A closed record does not count, so a seller who closed voluntarily and returns gets a new record.
      replaced_by: A seller who closed voluntarily and returns gets a new record, which opens with the active points the closed record kept.
    - base_policy: standing_violation_rules
      superseded_clause: Points expire when the point expiry period has passed, counted in calendar days from the violation's event_date.
      replaced_by: A seller may close the selling account voluntarily while the standing record is in good_standing or at_risk; closing is the seller's own act and is confirmed by the seller. The closing write sets the record to closed with the closing date and books the retired points as a points-expiry entry; the points left on the record after it are the closed record's active points, which carry forward.
    - base_policy: standing_violation_rules
      superseded_clause: A reversed or expired violation is never reversed or expired a second time.
      replaced_by: The retired points are booked against the listing-type violation that still carries the most points, the oldest of them where two carry the same, and the entry carries that violation's type; where they exceed that violation's remaining points, the rest is booked the same way against the next listing-type violation and only then against serious violations.
    trigger: on_request
    subject:
