    factors:
    - id: top_performer_rate
      effect: parameter
      decides: tp_base_rate
      bindings:
      - tp_viol_3
      - tp_base_rate
      ladder:
      - when: placed at Preferred Partner Level AND no violation recorded in the last three whole calendar months
        value: K('rate_preferred')
      - when: placed at Top Rated Level AND no violation recorded in the last three whole calendar months
        value: K('rate_top_rated')
      - when: otherwise (a violation recorded in that period)
        value: K('rate_standard')
      baseline:
