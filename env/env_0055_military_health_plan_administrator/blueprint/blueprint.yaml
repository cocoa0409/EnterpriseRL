name: env_0055_military_health_plan_administrator
company: Westbridge Military Health Services

background: |
  Westbridge Military Health Services is the managed care support contractor that administers TRICARE, the health program of the uniformed services, for the TRICARE West Region on behalf of the Defense Health Agency, serving roughly 3.1 million beneficiaries across 26 western states from its beneficiary contact centers in Phoenix and San Antonio.
  It enrolls beneficiaries in their health plans, bills enrollment fees and premiums, manages primary care manager assignments, reviews referrals and authorizations, processes claims and handles appeals and grievances, while eligibility itself is recorded by the services in DEERS, the Defense Enrollment Eligibility Reporting System, and is read by Westbridge rather than decided by it.
  Its tone is plain, courteous and precise, written for service members, retirees and families who often call between duty stations, deployments and life changes.
  TRICARE Prime is held per beneficiary in one of seven tiers: TRICARE Prime Active Duty Service Member, TRICARE Prime Remote Active Duty Service Member, TRICARE Prime Active Duty Family Member, TRICARE Prime Remote Active Duty Family Member, TRICARE Prime Transitional Survivor, TRICARE Prime Retiree Group A and TRICARE Prime Retiree Group B.
  A Prime enrollment carries a primary care manager at a military hospital or clinic or in the civilian network, enrollment-fee installments billed to the sponsor family, and the copayments of Prime claims.
  TRICARE Select is held per beneficiary in six tiers: TRICARE Select Active Duty Family Member Group A (E-1 to E-4), TRICARE Select Active Duty Family Member Group A (E-5 and Above), TRICARE Select Active Duty Family Member Group B (E-1 to E-4), TRICARE Select Active Duty Family Member Group B (E-5 and Above), TRICARE Select Retiree Group A and TRICARE Select Retiree Group B, and its claims book deductibles, cost shares and family catastrophic totals.
  The TRICARE Premium-Based Plans are bought by the reserve member or young adult and billed monthly in advance: TRICARE Reserve Select Member-Only, TRICARE Reserve Select Member-and-Family, TRICARE Young Adult Select, TRICARE Retired Reserve Member-Only, TRICARE Young Adult Prime and TRICARE Retired Reserve Member-and-Family.
  Referrals and Authorizations are issued per patient as a Specialty Care Referral, Rehabilitative Therapy Referral, Durable Medical Equipment Authorization, Home Health Care Authorization, Applied Behavior Analysis Authorization, Skilled Nursing Facility Authorization or Inpatient Mental Health Authorization, each carrying a validity span and a balance of authorized visits, days, hours or rental months.
  Appeals and Grievances are opened per determination as an Allowable Charge Review, Beneficiary Grievance, Claim Factual Reconsideration, Enrollment Reinstatement Review, Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration.
  The Extended Care Health Option (ECHO) registers active duty family members with qualifying conditions in ten tiers named for the sponsor's pay grade, from Extended Care Health Option, Sponsor E-1 to E-5 through Extended Care Health Option, Sponsor E-6, Sponsor E-7 and O-1, Sponsor E-8 and O-2, Sponsor E-9, W-1, W-2 and O-3, Sponsor W-3, W-4 and O-4, Sponsor W-5 and O-5, Sponsor O-6 and O-7, Sponsor O-8 and Extended Care Health Option, Sponsor O-9 and O-10, and books ECHO benefit payments and monthly family cost shares.
  Durable Medical Equipment Rentals are tracked per placed item by payment class - Inexpensive or Routinely Purchased Equipment, Capped Rental Equipment, Continuous Positive Airway Pressure Equipment, Power Mobility Device, Oxygen and Oxygen Equipment, Frequently Serviced Equipment and Customized Equipment - with each paid rental month booked against the item.
  Callers are sponsors and family members: active duty spouses managing a child's PCM after a move, retirees paying Prime or Select enrollment fees by allotment or bank draft, Selected Reserve members buying or changing TRICARE Reserve Select, and adult children aging out into TRICARE Young Adult.
  A typical family holds several enrollments under one sponsor, often a mix of Prime and Select members, together with a few referrals or authorizations, a history of claim lines and fee or premium payments, and the DEERS life events - marriages, births, moves, retirements and changes in other health insurance - that shaped their coverage.
  Many arrive with an Explanation of Benefits, a denial letter or a delinquency notice in hand, and some already have an appeal or a grievance open from an earlier dispute.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_log

difficulties:
  - name: prime_enrollment_fees_and_pcm
    claim:
      categories: [prime]
      event_types: [prime_enroll, prime_activate, prime_reject, prime_fee_charge, prime_fee_payment, prime_fee_credit, prime_fee_refund, prime_pcm_assign, prime_access_waiver_signed, prime_disenroll_voluntary, prime_transfer_out, prime_payment_setup_update, prime_fee_policy_update, prime_ohi_update]
    summary: >
      Callers are TRICARE Prime enrollees and their sponsors - active duty families choosing or changing a
      primary care manager after a move or a panel closure, retirees in Group A or Group B asking about
      installment bills, a missed payment or a switch from quarterly to monthly allotment, families
      enrolling a newborn or a new spouse after a DEERS life event, and enrollees leaving Prime or moving out
      of the region; the setting varies by Prime tier, by whether the residence is inside a Prime Service Area
      or remote, by how many family members share the fee, and by the fee ledger's history of charges,
      payments and credits. The records involved are the beneficiary's DEERS profile and life events, the
      Prime enrollments of the whole family, the fee ledger of the fee-bearing enrollment, the PCM assignment
      history and the provider directory, governed by tier eligibility from DEERS (prime_tier_eligibility),
      the qualifying-life-event and open-season windows (prime_enrollment_window), the per-tier fee schedule
      with its individual and family levels and installment arithmetic (prime_enrollment_fee_schedule), the
      payment-method and grace-period rules (prime_fee_payment_methods, prime_nonpayment_disenrollment), PCM
      eligibility, the service-area access standard and its waiver (prime_pcm_selection), and proration
      credits on exit (prime_fee_proration_credit); in the domain's natural order a family's enrollment is
      processed and paid before a PCM is assigned, and fees run by calendar plan year. Enrolling, posting
      charges, payments, credits and refunds, recording PCM assignments and payment-setup changes are agent
      service actions on a verified caller, while signing an access-standard waiver and confirming a
      voluntary disenrollment are the beneficiary's own acts, handed to them as user actions. Requests that
      no Prime rule decides - a waiver of the enrollment fee itself, choosing a specific military clinic
      physician over the facility's capacity decision, keeping West Region Prime after moving to another
      region, or disputing a DEERS eligibility record - have no policy path and are handed off as
      POLICY_NOT_COVERED.

  - name: select_claims_and_cost_shares
    claim:
      categories: [select]
      event_types: [select_claim_line_post, select_claim_line_reverse, select_fee_payment, select_fee_charge, select_ohi_update, select_tier_update, select_fee_credit, select_fee_refund]
    summary: >
      Callers are TRICARE Select enrollees - active duty families in Group A or Group B whose sponsor sits on
      either side of the E-4/E-5 line, and Group A or Group B retirees - holding an Explanation of Benefits
      they do not understand, a bill from a nonparticipating provider above the allowed amount, a line
      denied for a missing authorization or late filing, or a belief that the family has already met its
      deductible or catastrophic cap; the setting varies by tier, by network status of the provider on the
      service date, by other health insurance, and by how many family members' lines and fee payments have
      already accumulated in the plan year. The records involved are the family's Select enrollments, the
      claim lines with their deductible, cost share, TRICARE payment and outcome, the fee ledger, the
      provider directory and any authorizations, governed by the family deductible and catastrophic
      accumulators (select_agg_family_accumulators, select_deductible, select_catastrophic_cap), the per-tier
      outpatient and inpatient cost-share bases (select_outpatient_cost_shares, select_inpatient_cost_shares,
      select_cost_share_tier_ladder), nonparticipating-provider limits (select_nonparticipating_providers),
      other-insurance coordination (select_ohi_coordination), authorization and timely-filing rules
      (select_prior_authorization_and_filing) and the reversal rule (select_claim_line_reversal); lines
      accumulate by the calendar year of the service date and a corrected adjudication follows the reversal
      of the line it replaces. Reversing and re-adjudicating lines, recording other health insurance,
      moving a tier after a DEERS pay-grade change and posting fee entries are agent service actions on a
      verified caller; a beneficiary who wants to contest a determination files the appeal themselves in
      the appeals domain. Requests outside every rule - paying a nonparticipating provider's balance bill,
      waiving a deductible for hardship, re-pricing a line under a neighbouring tier, or refunding a cost
      share the family paid a provider directly without any claim on record - have no policy path and are
      handed off as POLICY_NOT_COVERED.

  - name: premium_plans_and_life_events
    claim:
      categories: [premium]
      event_types: [premium_purchase, premium_activate, premium_reject, premium_bill, premium_payment, premium_proration_credit, premium_refund, premium_coverage_type_change, premium_payment_method_update, premium_terminate_request]
    summary: >
      Callers are Selected Reserve members on TRICARE Reserve Select, gray-area retired reservists on
      TRICARE Retired Reserve and young adults on TRICARE Young Adult Select or Prime, who want to buy a
      plan after a qualifying life event, add a new spouse or baby by moving from member-only to
      member-and-family, drop to member-only after a divorce, change the recurring payment method, end the
      plan, or understand a delinquency notice or a refund; the setting varies by tier and monthly premium,
      by whether the DEERS life event is still inside its window, by where in the month coverage or the
      change starts, and by the premium ledger's history of initial, monthly, adjustment and credit entries.
      The records involved are the purchaser's DEERS profile and life events, the premium-plan enrollment,
      the premium ledger and any other Prime or Select enrollment in the family, governed by DEERS-based plan
      eligibility (premium_plan_eligibility), the purchase and change windows (premium_purchase_window,
      premium_coverage_type_rules), the billing schedule with its initial payment and daily proration
      (premium_billing_schedule), the recurring-payment and nonpayment lockout rules
      (premium_payment_and_nonpayment), termination credits and refunds (premium_termination_and_refund) and
      the mutual exclusion with Prime and Select (premium_agg_multi_holding); in the domain's natural order
      a purchase is billed and its initial payment posted before coverage is active, and premiums are paid a
      month in advance. Recording purchases, bills, payments, credits, refunds, coverage-type changes and
      payment-method updates are agent service actions on a verified caller, while confirming a termination
      of the plan is the purchaser's own act handed to them as a user action. Requests no rule decides - a
      premium discount or hardship waiver, buying TRICARE Reserve Select while eligible for FEHB, extending
      TRICARE Young Adult past the age limit, or lifting a nonpayment lockout without a reinstatement
      review - have no policy path and are handed off as POLICY_NOT_COVERED.

  - name: referrals_and_authorizations
    claim:
      categories: [referral]
      event_types: [referral_submit, referral_servicing_change, referral_units_extend, referral_validity_update, referral_units_consume, referral_cancel, referral_units_release, referral_expire, referral_exhaust]
    summary: >
      Callers are patients and parents asking whether a specialist visit, therapy course, home health
      episode, applied behavior analysis plan, equipment rental or admission is authorized, how many visits
      or days remain, whether an authorization can move to a different specialist, be extended before it
      runs out, or be cancelled, and why a request is still pending; the setting varies by authorization
      type, by the plan the patient holds on the service date (Prime, Select or a premium-based plan), by
      active duty or remote status, and by the unit ledger's history of grants, extensions and uses. The
      records involved are the referral or authorization with its validity span, units and servicing
      provider, the unit ledger, the patient's Prime, Select and premium-plan enrollments and PCM, the
      provider directory and any appeal on a denial, governed by plan-dependent requirements
      (referral_requirement_by_plan), review and pend periods (referral_review_and_pend), validity and unit
      arithmetic per tier (referral_validity_and_units), the military clinic's right of first refusal
      (referral_right_of_first_refusal), servicing-provider changes (referral_servicing_provider_change),
      unit use and extensions (referral_unit_consumption, referral_extension), duplicate control
      (referral_agg_duplicate_requests) and cancellation and expiry (referral_cancellation_and_expiry); in
      the domain's natural order a request is reviewed and approved before units can be used or extended.
      Moving a servicing provider, posting extensions and uses, and recording requests are agent service
      actions on a verified caller, while cancelling an authorization is the patient's own confirmation
      handed to them as a user action. Requests that no rule decides - approving a denied request by phone
      without a reconsideration, letting the caller supply clinical notes in place of the provider, carrying
      an authorization into another region, or authorizing a service TRICARE does not cover - have no policy
      path and are handed off as POLICY_NOT_COVERED.

  - name: appeals_and_grievances
    claim:
      categories: [appeal]
      event_types: [appeal_file, appeal_document_receive, appeal_representative_update, appeal_review_track_update, appeal_withdraw, appeal_escalate]
    summary: >
      Callers are beneficiaries, parents and appointed representatives who want to contest a claim line, an
      authorization denial or a nonpayment disenrollment, ask for a review of an allowed amount, complain
      about service, send records or an appointment of representative, move an urgent case to the expedited
      track, withdraw a case, or take an upheld decision to the next level; the setting varies by case tier,
      by how far the filing is from the determination date on the subject record, by who is filing and
      whether a representative form is on file, by the amount in dispute, and by whether another case on the
      same subject is already open. The records involved are the appeal case and its documents, the subject
      record in the owning category (a Prime, Select or premium-plan claim line, a referral or authorization,
      an enrollment ended for nonpayment) and the beneficiary's DEERS profile, governed by tier selection
      (appeal_tier_selection), the filing deadline counted from the subject record (appeal_filing_deadline),
      standing and representation (appeal_standing_and_representation), one open case per subject
      (appeal_agg_one_open_case), review tracks and records (appeal_review_tracks), decision and
      effectuation (appeal_decision_and_effectuation), reinstatement good cause
      (appeal_reinstatement_review) and next-level rights with their deadlines and amount thresholds
      (appeal_next_level, appeal_amount_in_dispute); in the domain's natural order a case is filed and
      acknowledged before documents complete it, and a decision precedes any escalation. Filing a case,
      withdrawing it and asking for the next level are the appellant's own acts handed to them as user
      actions, while recording documents, representative appointments and track changes are agent service
      actions on a verified caller. Requests no rule decides - overturning a determination on the call,
      appealing a DEERS eligibility record or a network status, extending a deadline without documented good
      cause, or escalating an Allowable Charge Review or a grievance - have no policy path and are handed off
      as POLICY_NOT_COVERED.
