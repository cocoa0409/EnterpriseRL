events:
  - type: appeal_file
    target: appeal_cases
    mutation: create
    meaning: An appeal, review or grievance is received for one initial determination or one service complaint.
    grain: one row per case
    fields:
      customer_id: the beneficiary the determination or complaint concerns
      variant_name: the case tier, as its official full name
      filed_by: who filed
      representative_appointment_on_file: whether an appointment of representative is on file for a third-party filer
      subject_kind: what kind of initial determination or matter the case is about
      subject_plan: the plan the subject record belongs to
      subject_claim_line_id: the adjudicated claim line appealed; empty unless subject_kind is claim_line or allowable_charge
      subject_claim_number: the claim number of that line as printed on the Explanation of Benefits; empty otherwise
      subject_referral_authorization_id: the denied authorization appealed; empty unless subject_kind is authorization_denial
      subject_enrollment_id: the enrollment or plan disenrolled or terminated; empty unless subject_kind is enrollment_disenrollment
      initial_determination_date: date of the determination appealed, copied from the subject record
      filing_date: date the case was received
      review_track: standard or expedited
      amount_in_dispute: amount at issue under amount_in_dispute_basis
    triggers: []
  - type: appeal_acknowledge
    target: appeal_cases
    mutation: {transition: {from: filed, to: under_review}}
    meaning: The case is acknowledged and assigned for review.
    grain: one row per transaction
    fields:
      status: set to under_review
      acknowledgment_date: date of the acknowledgment letter
      appeal_reference: the case reference printed on the acknowledgment letter
    triggers: []
  - type: appeal_dismiss
    target: appeal_cases
    mutation: {transition: [{from: filed, to: dismissed}, {from: under_review, to: dismissed}]}
    meaning: The case is dismissed without a decision on the merits.
    grain: one row per transaction
    fields:
      status: set to dismissed
      decision_date: date of the dismissal
      dismissal_reason: why the case was dismissed
    triggers: []
  - type: appeal_decide_upheld
    target: appeal_cases
    mutation: {transition: {from: under_review, to: decided_upheld}}
    meaning: The initial determination is upheld.
    grain: one row per transaction
    fields:
      status: set to decided_upheld
      decision_date: date of the decision
    triggers: []
  - type: appeal_decide_overturned
    target: appeal_cases
    mutation: {transition: {from: under_review, to: decided_overturned}}
    meaning: The initial determination is reversed in full.
    grain: one row per transaction
    fields:
      status: set to decided_overturned
      decision_date: date of the decision
      subject_kind: (unchanged) kind of determination reversed - selects the effectuation
      subject_plan: (unchanged) plan of the subject record - selects the owning category
      subject_claim_line_id: (unchanged) the claim line to be reversed and adjudicated again
      subject_claim_number: (unchanged) claim number of that line
      subject_referral_authorization_id: (unchanged) the denied authorization to be issued
      subject_enrollment_id: (unchanged) the enrollment to be reinstated
    triggers:
      - event: select:select_claim_line_reverse
        when: {subject_kind: claim_line, subject_plan: tricare_select}
        map: {reversed_claim_line_id: subject_claim_line_id, claim_number: subject_claim_number, reversal_reason: appeal_overturned, posted_date: decision_date}
      - event: prime:prime_claim_line_reverse
        when: {subject_kind: claim_line, subject_plan: tricare_prime}
        map: {reversed_claim_line_id: subject_claim_line_id, claim_number: subject_claim_number, reversal_reason: appeal_overturned, posted_date: decision_date}
      - event: premium:premium_claim_line_reverse
        when: {subject_kind: claim_line, subject_plan: premium_based_plan}
        map: {reversed_claim_line_id: subject_claim_line_id, claim_number: subject_claim_number, reversal_reason: appeal_overturned, posted_date: decision_date}
      - event: referral:referral_approve_on_appeal
        when: {subject_kind: authorization_denial}
        map: {referral_authorization_id: subject_referral_authorization_id, decision_date: decision_date}
      - event: prime:prime_reinstate
        when: {subject_kind: enrollment_disenrollment, subject_plan: tricare_prime}
        map: {prime_enrollment_id: subject_enrollment_id}
      - event: select:select_reinstate
        when: {subject_kind: enrollment_disenrollment, subject_plan: tricare_select}
        map: {select_enrollment_id: subject_enrollment_id}
      - event: premium:premium_reinstate
        when: {subject_kind: enrollment_disenrollment, subject_plan: premium_based_plan}
        map: {premium_enrollment_id: subject_enrollment_id}
  - type: appeal_decide_partially_overturned
    target: appeal_cases
    mutation: {transition: {from: under_review, to: decided_partially_overturned}}
    meaning: Part of the initial determination is reversed.
    grain: one row per transaction
    fields:
      status: set to decided_partially_overturned
      decision_date: date of the decision
      subject_kind: (unchanged) kind of determination partly reversed
      subject_plan: (unchanged) plan of the subject record
      subject_claim_line_id: (unchanged) the claim line to be reversed and adjudicated again at the decided amount
      subject_claim_number: (unchanged) claim number of that line
      subject_referral_authorization_id: (unchanged) the denied authorization to be issued with the decided units
    triggers:
      - event: select:select_claim_line_reverse
        when: {subject_kind: claim_line, subject_plan: tricare_select}
        map: {reversed_claim_line_id: subject_claim_line_id, claim_number: subject_claim_number, reversal_reason: appeal_overturned, posted_date: decision_date}
      - event: prime:prime_claim_line_reverse
        when: {subject_kind: claim_line, subject_plan: tricare_prime}
        map: {reversed_claim_line_id: subject_claim_line_id, claim_number: subject_claim_number, reversal_reason: appeal_overturned, posted_date: decision_date}
      - event: premium:premium_claim_line_reverse
        when: {subject_kind: claim_line, subject_plan: premium_based_plan}
        map: {reversed_claim_line_id: subject_claim_line_id, claim_number: subject_claim_number, reversal_reason: appeal_overturned, posted_date: decision_date}
      - event: referral:referral_approve_on_appeal
        when: {subject_kind: authorization_denial}
        map: {referral_authorization_id: subject_referral_authorization_id, decision_date: decision_date}
  - type: appeal_withdraw
    target: appeal_cases
    mutation: {transition: [{from: filed, to: withdrawn}, {from: under_review, to: withdrawn}]}
    meaning: The appellant confirms withdrawing the case.
    grain: one row per transaction
    fields:
      status: set to withdrawn
      decision_date: date the withdrawal was confirmed
    triggers: []
  - type: appeal_escalate
    target: appeal_cases
    mutation: {transition: [{from: decided_upheld, to: escalated}, {from: decided_partially_overturned, to: escalated}]}
    meaning: The appellant asks for the next appeal level and the case file is forwarded.
    grain: one row per transaction
    fields:
      status: set to escalated
      escalation_date: date the next-level request was received
    triggers: []
  - type: appeal_document_receive
    target: appeal_case_documents
    meaning: A document for the case is received (records, bills, an appointment of representative, a statement of good cause).
    grain: one document of one kind received on one date
    distinguish_by: [document_kind, received_date]
    fields:
      appeal_case_id: the case
      customer_id: the beneficiary the case concerns
      document_kind: kind of document
      received_date: date received
      submitted_by: who sent it
    triggers:
      - event: appeal:appeal_representative_update
        when: {document_kind: appointment_of_representative_form}
        map: {representative_appointment_on_file: true}
  - type: appeal_records_request
    target: appeal_case_documents
    meaning: The reviewer asks the appellant or a provider for records needed to decide.
    grain: one request for one document kind on one date
    distinguish_by: [document_kind, received_date]
    fields:
      appeal_case_id: the case
      customer_id: the beneficiary the case concerns
      document_kind: kind of document requested
      received_date: date the request was sent
      submitted_by: the reviewer (region)
    triggers: []
  - type: appeal_representative_update
    target: appeal_cases
    mutation: update
    meaning: An appointment of representative is recorded as on file for the case.
    grain: one row per transaction
    fields:
      representative_appointment_on_file: whether an appointment of representative is now on file
    triggers: []
  - type: appeal_review_track_update
    target: appeal_cases
    mutation: update
    meaning: The case is moved between the standard and the expedited track.
    grain: one row per transaction
    fields:
      review_track: the new review track
    triggers: []

measures:
  - id: appeal_msr_open_cases_on_subject
    window: current, at the moment of the filing
    measure: count of appeal_cases with the same subject record (subject_claim_line_id, subject_referral_authorization_id or subject_enrollment_id) whose status is filed or under_review

policies:
  - id: appeal_agg_multi_holding
    subject: [appeal_file]
    rule: >-
      A beneficiary may have any number of cases, but only one open case per subject record under
      appeal_agg_one_open_case.
    eligibility: []
    params:
      max_per_customer: null

  - id: appeal_agg_one_open_case
    subject: [appeal_file]
    rule: >-
      The subject of a case is the narrowest record the determination sits on - one claim line, one
      authorization, one enrollment - never the beneficiary or a claim as a whole. Several denied lines
      of one claim with the same reason may be grouped into one case under lines_per_case_rule, each
      line keeping its own subject reference. A new case on the same subject is refused while another case on that subject is filed or under review (appeal_msr_open_cases_on_subject).
      A decided case is not reopened by a second filing at the same level; the route forward is the next
      level, and a grievance about the same events is a separate matter that does not block an appeal.
    eligibility:
      - id: no_open_case_on_subject
        applies_to: [appeal_file]
        kind: dedup
        condition: A new case on the same subject is refused while another case on that subject is filed or under review (appeal_msr_open_cases_on_subject).
        evidence_fields: [appeal_cases.subject_claim_line_id, appeal_cases.subject_referral_authorization_id, appeal_cases.subject_enrollment_id, appeal_cases.status, appeal_cases.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.subject_claim_line_id]
            - [appeal_cases.subject_referral_authorization_id]
            - [appeal_cases.subject_enrollment_id]
          action_bindings:
            appeal_cases.subject_claim_line_id: subject_claim_line_id
            appeal_cases.subject_referral_authorization_id: subject_referral_authorization_id
            appeal_cases.subject_enrollment_id: subject_enrollment_id
        dedup_contract:
          table: appeal_cases
          mode: separate_record
          object_bindings: {subject_claim_line_id: subject_claim_line_id, subject_referral_authorization_id: subject_referral_authorization_id, subject_enrollment_id: subject_enrollment_id}
          duplicate_filters: {status: [filed, under_review]}
          distinct_fields: [variant_name]
    measures: [appeal_msr_open_cases_on_subject]

  - id: appeal_tier_selection
    subject: [appeal_file, appeal_dismiss]
    rule: >-
      The tier follows the determination, not the caller's wording. A dispute about the amount TRICARE
      allowed for a covered service is an Allowable Charge Review. A claim line denied or cost-shared on a
      factual basis (benefit exclusion, eligibility on the service date, timely filing, missing
      authorization, other health insurance, the cost share figured) is a Claim Factual Reconsideration.
      An authorization denied as not medically necessary is a Medical Necessity Reconsideration, or an
      Expedited Medical Necessity Reconsideration when expedited_criteria are met. A disenrollment or
      termination for nonpayment is an Enrollment Reinstatement Review. Dissatisfaction with service,
      access or conduct that disputes no determination is a Beneficiary Grievance. The case's subject_kind must be one of the tier's appealable_subject_kinds.
      Matters in non_appealable_issues are dismissed as not_appealable: DEERS eligibility decisions belong
      to DEERS and the uniformed services, network status is not a beneficiary right, and enrollment fee
      and premium amounts are set by law.
    eligibility:
      - id: subject_kind_appealable
        applies_to: [appeal_file]
        kind: authorization
        condition: The case's subject_kind must be one of the tier's appealable_subject_kinds.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.variant_name, appeal_cases.subject_kind]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id

  - id: appeal_filing_deadline
    subject: [appeal_file, appeal_dismiss]
    rule: >-
      The initial_determination_date is taken from the subject record - the posted date of the claim
      line (the Explanation of Benefits date), the decision date of the authorization denial, or the
      disenrollment or termination date of the enrollment - never from the caller. The case must be received no later than filing_deadline_days after the initial determination recorded on the subject record.
      The deadline is counted in calendar days starting the day after the initial determination date, so the last timely day is that date plus filing_deadline_days and a case received on that day is timely while one received the next day is late.
      Timeliness is measured under deadline_measured_by. A late case is dismissed as untimely unless
      late_filing_good_cause_allowed is true and a statement of good cause documenting one of
      good_cause_examples is on file, in which case it proceeds as if timely.
    eligibility:
      - id: filed_on_time
        applies_to: [appeal_file]
        kind: time
        condition: The case must be received no later than filing_deadline_days after the initial determination recorded on the subject record.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.initial_determination_date, select_claim_lines.posted_date, referral_authorizations.decision_date, prime_enrollments.disenrollment_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the initial determination recorded on the subject record
          anchor_source: appeal_cases.initial_determination_date
          relation: not_after
          duration_source: variants.filing_deadline_days
          unit: calendar_days
          counting_rule: The deadline is counted in calendar days starting the day after the initial determination date, so the last timely day is that date plus filing_deadline_days and a case received on that day is timely while one received the next day is late.
          boundary: inclusive

  - id: appeal_standing_and_representation
    subject: [appeal_file, appeal_dismiss, appeal_representative_update, appeal_decide_upheld, appeal_decide_overturned, appeal_decide_partially_overturned]
    rule: >-
      Only a party in who_may_file has standing: the beneficiary, a parent or legal guardian of a minor
      or incapacitated beneficiary, an appointed representative, or - where
      participating_provider_may_file is true - a participating provider on its own denied claim. A filing by an appointed representative proceeds to a decision only once an appointment of representative is on file for the case.
      A missing appointment must arrive within representative_form_window_days of filing; when it does
      not, the case is dismissed as no_representative_appointment. A spouse is not a representative by
      marriage alone. A sponsor may file for a minor child; an adult beneficiary's case is the
      beneficiary's own.
    eligibility:
      - id: representative_on_file
        applies_to: [appeal_decide_upheld, appeal_decide_overturned, appeal_decide_partially_overturned]
        kind: authorization
        condition: A filing by an appointed representative proceeds to a decision only once an appointment of representative is on file for the case.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.filed_by, appeal_cases.representative_appointment_on_file, appeal_case_documents.document_kind]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id

  - id: appeal_review_tracks
    subject: [appeal_acknowledge, appeal_review_track_update, appeal_records_request, appeal_document_receive]
    rule: >-
      A case is acknowledged within acknowledgment_business_days of receipt and decided within
      decision_deadline counted in decision_deadline_unit from receipt; business days are Monday through
      Friday excluding federal holidays. A case meets the expedited track only under expedited_criteria
      (an ongoing inpatient stay or a delay that could seriously jeopardize life or health), as certified
      by the treating provider; the beneficiary's own urgency alone does not move a case. A standard case
      that meets the criteria is moved to the expedited track where standard_to_expedited_conversion is
      true, and an expedited request that does not meet them continues on the standard track where
      expedited_to_standard_conversion is true. The reviewer may ask for records; the appellant has
      additional_records_window_days to send them, after which the case is decided on the record. Every
      document in required_documents must be on file before a decision. Records requests and documents are recorded only on a case whose status is filed or under_review.
    eligibility:
      - id: case_open_for_documents
        applies_to: [appeal_records_request, appeal_document_receive]
        kind: state
        condition: Records requests and documents are recorded only on a case whose status is filed or under_review.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id
        state_contract:
          field: appeal_cases.status
          allowed: [filed, under_review]

  - id: appeal_decision_and_effectuation
    subject: [appeal_decide_upheld, appeal_decide_overturned, appeal_decide_partially_overturned]
    rule: >-
      The reviewer re-examines the determination under review_basis; a medical necessity case is decided
      by a physician reviewer of the same or similar specialty who took no part in the denial where
      physician_reviewer_required and independent_reviewer_required are true. An overturned decision is
      effectuated in the category that owns the subject within effectuation_days under
      effectuation_action: a claim line is reversed and adjudicated again, a denied authorization is
      issued, a nonpayment disenrollment or termination is reinstated. A partially overturned decision
      effectuates only the part reversed. Where past_due_payment_required is true, a favorable decision
      on an enrollment is effectuated only after every past-due fee or premium is paid. The decision
      letter states the next-level rights and deadline where decision_letter_includes_next_level_rights
      is true. While the case is open, collection of the disputed beneficiary amount is suspended where
      collection_suspended_during_review is true.
    eligibility: []

  - id: appeal_next_level
    subject: [appeal_escalate]
    rule: >-
      Only the appellant's own request moves a case to next_level_name; it is not escalated on the
      region's initiative. The next level must be asked for no later than next_level_filing_deadline_days after this tier's decision date.
      The next-level deadline is counted in calendar days starting the day after decision_date, so the last timely day is decision_date plus next_level_filing_deadline_days and a request on the next day is late.
      The amount in dispute must be at least next_level_min_amount_in_dispute, and a hearing after the
      next level needs at least hearing_min_amount_in_dispute. A tier whose next_level_name is none
      (Allowable Charge Review, Beneficiary Grievance) is final at the region. The case file is
      forwarded within case_file_forwarding_days of the request.
    eligibility:
      - id: next_level_on_time
        applies_to: [appeal_escalate]
        kind: time
        condition: The next level must be asked for no later than next_level_filing_deadline_days after this tier's decision date.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.decision_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id
        temporal_basis:
          clock: frozen_time
          anchor_event: this tier's decision date
          anchor_source: appeal_cases.decision_date
          relation: not_after
          duration_source: variants.next_level_filing_deadline_days
          unit: calendar_days
          counting_rule: The next-level deadline is counted in calendar days starting the day after decision_date, so the last timely day is decision_date plus next_level_filing_deadline_days and a request on the next day is late.
          boundary: inclusive
    params:
      per_tier:
        Allowable Charge Review: {next_level_min_amount_in_dispute: "=next_level_min_amount_in_dispute", next_level_filing_deadline_days: "=next_level_filing_deadline_days"}
        Beneficiary Grievance: {next_level_min_amount_in_dispute: "=next_level_min_amount_in_dispute", next_level_filing_deadline_days: "=next_level_filing_deadline_days"}
        Claim Factual Reconsideration: {next_level_min_amount_in_dispute: "=next_level_min_amount_in_dispute", next_level_filing_deadline_days: "=next_level_filing_deadline_days"}
        Enrollment Reinstatement Review: {next_level_min_amount_in_dispute: "=next_level_min_amount_in_dispute", next_level_filing_deadline_days: "=next_level_filing_deadline_days"}
        Medical Necessity Reconsideration: {next_level_min_amount_in_dispute: "=next_level_min_amount_in_dispute", next_level_filing_deadline_days: "=next_level_filing_deadline_days"}
        Expedited Medical Necessity Reconsideration: {next_level_min_amount_in_dispute: "=next_level_min_amount_in_dispute", next_level_filing_deadline_days: "=next_level_filing_deadline_days"}
    formula:
      escalation_allowed: amount_in_dispute >= next_level_min_amount_in_dispute and next_level_filing_deadline_days > 0

  - id: appeal_withdrawal
    subject: [appeal_withdraw]
    rule: >-
      A case is withdrawn only by the appellant's own confirmation: the agent records the request as an
      intake and the appellant confirms it. Withdrawal is possible only before a decision where
      withdrawal_allowed is true. A withdrawn case may be filed again under refiling_after_withdrawal -
      only within the original filing deadline, which a withdrawal does not extend.
    eligibility: []

  - id: appeal_reinstatement_review
    subject: [appeal_file, appeal_decide_overturned, appeal_decide_upheld]
    rule: >-
      An Enrollment Reinstatement Review asks to reverse a disenrollment or termination for nonpayment.
      It is decided overturned only when a statement of good cause documenting one of good_cause_examples
      is on file and the circumstance covers the due date that was missed; forgetting, a changed bank
      account the beneficiary did not report, or disagreement with the fee amount are not good cause. The
      enrollment is reinstated only after every past-due fee or premium through the current period is
      paid. A reinstatement request about an enrollment that was not ended for nonpayment is dismissed as
      not_appealable. A reinstatement is decided overturned only when a statement of good cause is on file for the case.
    eligibility:
      - id: good_cause_statement_on_file
        applies_to: [appeal_decide_overturned]
        kind: authorization
        condition: A reinstatement is decided overturned only when a statement of good cause is on file for the case.
        evidence_fields: [appeal_case_documents.appeal_case_id, appeal_case_documents.document_kind]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_case_documents.appeal_case_id]
          action_bindings:
            appeal_case_documents.appeal_case_id: appeal_case_id

  - id: appeal_grievance_and_charge_review
    subject: [appeal_file, appeal_decide_upheld, appeal_decide_overturned]
    rule: >-
      A Beneficiary Grievance is answered in writing within decision_deadline and is referred to clinical
      quality management where quality_of_care_referral is true; it changes no claim, authorization or
      enrollment and has no next level. An Allowable Charge Review checks only that the allowed amount
      was figured under the correct TRICARE maximum allowable charge, prevailing rate or negotiated rate
      for the service, date and locality; an overturned review reprocesses the line at the corrected
      allowed amount and the result is final. Neither may be used to contest medical necessity or
      coverage, which have their own tiers.
    eligibility: []

  - id: appeal_amount_in_dispute
    subject: [appeal_file, appeal_escalate]
    rule: >-
      amount_in_dispute is figured under amount_in_dispute_basis: for a claim line, the TRICARE payment
      denied plus the beneficiary liability at issue on the line; for an authorization, the allowed amount
      of the services requested as estimated on the request; for an enrollment, zero; for a grievance,
      zero. Amounts a nonparticipating provider bills above the allowed amount are never in dispute.
    eligibility: []
