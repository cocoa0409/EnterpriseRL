events:
  - type: dme_order
    target: dme_placements
    mutation: create
    meaning: An order for an item of durable medical equipment for a patient is received from the supplier.
    grain: one row per item ordered
    fields:
      customer_id: the patient
      variant_name: DMEPOS payment class of the item, as its official full name
      item_description: make and model as on the supplier's order
      hcpcs_code: HCPCS code of the item
      supplier_provider_id: the supplier
      coverage_plan: plan the item is covered under
      referral_authorization_id: Durable Medical Equipment Authorization covering the item, when the plan requires one
      order_date: date of the written order
      purchase_fee_schedule_amount: purchase amount on the TRICARE DMEPOS fee schedule
    triggers: []
  - type: dme_deliver_rental
    target: dme_placements
    mutation: {transition: {from: ordered, to: in_rental}}
    meaning: The item is delivered as a rental.
    grain: one row per transaction
    fields:
      status: set to in_rental
      delivery_date: delivery date, the start of rental month 1
    triggers: []
  - type: dme_deliver_purchase
    target: dme_placements
    mutation: {transition: {from: ordered, to: purchased}}
    meaning: The item is delivered as a purchase.
    grain: one row per transaction
    fields:
      status: set to purchased
      delivery_date: delivery date
      title_transfer_date: same as the delivery date
    triggers:
      - event: dme:dme_purchase_charge
        map: {dme_placement_id: dme_placement_id, customer_id: customer_id, charge_date: delivery_date}
  - type: dme_cancel
    target: dme_placements
    mutation: {transition: {from: ordered, to: cancelled}}
    meaning: The patient confirms cancelling the order before delivery.
    grain: one row per transaction
    fields:
      status: set to cancelled
      return_date: date cancelled
    triggers: []
  - type: dme_title_transfer
    target: dme_placements
    mutation: {transition: {from: in_rental, to: owned}}
    meaning: The capped rental is complete and title passes to the patient.
    grain: one row per transaction
    fields:
      status: set to owned
      title_transfer_date: day after the last capped rental month ends
    triggers: []
  - type: dme_purchase_option
    target: dme_placements
    mutation: {transition: {from: in_rental, to: purchased}}
    meaning: The patient elects the purchase option.
    grain: one row per transaction
    fields:
      status: set to purchased
      title_transfer_date: date the purchase option took effect
    triggers:
      - event: dme:dme_purchase_charge
        map: {dme_placement_id: dme_placement_id, customer_id: customer_id, charge_date: title_transfer_date}
  - type: dme_return
    target: dme_placements
    mutation: {transition: {from: in_rental, to: returned}}
    meaning: The patient confirms returning rented equipment.
    grain: one row per transaction
    fields:
      status: set to returned
      return_date: date the rental ends
    triggers: []
  - type: dme_compliance_update
    target: dme_placements
    mutation: update
    meaning: The documented-use result of a compliance trial is recorded.
    grain: one row per transaction
    fields:
      compliance_status: compliance result
    triggers: []
  - type: dme_rental_charge
    target: dme_rental_ledger
    meaning: One rental month of a rented item is paid.
    grain: one paid rental month of one placement
    distinguish_by: [rental_month_number, rental_period_start]
    fields:
      dme_placement_id: the placement
      customer_id: the patient
      rental_month_number: position of the month in the rental period (1, 2, 3 ...)
      rental_period_start: first day of the rental month
      claim_number: claim number of the rental claim line
      allowed_amount: allowed amount for the rental month
      cost_share_amount: patient cost share on the rental month
      charge_date: date paid
      months: rental months booked (1)
    account: rental_months
    direction: in
    triggers: []
  - type: dme_rental_charge_reverse
    target: dme_rental_ledger
    meaning: A paid rental month is reversed.
    grain: one reversal of one paid rental month
    distinguish_by: [reversed_entry_id]
    fields:
      dme_placement_id: the placement
      customer_id: the patient
      reversed_entry_id: the paid rental month reversed
      reversal_reason: why it is reversed
      allowed_amount: allowed amount withdrawn
      cost_share_amount: cost share withdrawn
      charge_date: reversal date
      months: rental months withdrawn (1)
    account: rental_months
    direction: out
    triggers: []
  - type: dme_purchase_charge
    target: dme_rental_ledger
    meaning: The purchase of an item is paid.
    grain: one purchase payment of one placement
    distinguish_by: [charge_date]
    fields:
      dme_placement_id: the placement
      customer_id: the patient
      claim_number: claim number of the purchase claim line
      allowed_amount: purchase allowed amount (less rental months already paid where the purchase option applies)
      cost_share_amount: patient cost share on the purchase
      charge_date: date paid
    triggers: []
  - type: dme_servicing_charge
    target: dme_rental_ledger
    meaning: A payable maintenance and servicing visit on owned, purchased or capped equipment is paid.
    grain: one servicing visit of one placement
    distinguish_by: [service_period_start]
    fields:
      dme_placement_id: the placement
      customer_id: the patient
      service_period_start: first day of the servicing interval the visit covers
      claim_number: claim number of the servicing claim line
      allowed_amount: allowed amount of the visit
      cost_share_amount: patient cost share
      charge_date: date paid
    triggers: []

measures:
  - id: dme_msr_rental_months_paid
    window: the current rental period of the placement (restarted after a qualifying interruption)
    measure: count of dme_rental_charge rows minus dme_rental_charge_reverse rows of the placement within the rental period

policies:
  - id: dme_agg_multi_holding
    subject: [dme_order]
    rule: >-
      A patient may hold any number of equipment placements of different items, subject to
      dme_agg_same_item.
    eligibility: []
    params:
      max_per_customer: null

  - id: dme_agg_same_item
    subject: [dme_order, dme_rental_charge]
    rule: >-
      A patient may have only one ordered, rented or owned placement per HCPCS code at a time; an order
      for a second identical item is payable only as a replacement under the replacement rules. Rental
      months of two placements are never added together toward one cap, and a replacement starts a new
      rental period. The patient has no ordered or in-rental placement with the same HCPCS code.
    eligibility:
      - id: no_open_same_item
        applies_to: [dme_order]
        kind: dedup
        condition: The patient has no ordered or in-rental placement with the same HCPCS code.
        evidence_fields: [dme_placements.customer_id, dme_placements.hcpcs_code, dme_placements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dme_placements.customer_id, dme_placements.hcpcs_code]
          action_bindings:
            dme_placements.customer_id: customer_id
            dme_placements.hcpcs_code: hcpcs_code
        dedup_contract:
          table: dme_placements
          mode: separate_record
          object_bindings: {customer_id: customer_id, hcpcs_code: hcpcs_code}
          duplicate_filters: {status: [ordered, in_rental]}
          distinct_fields: [order_date]

  - id: dme_order_requirements
    subject: [dme_order, dme_deliver_rental, dme_deliver_purchase]
    rule: >-
      An item is delivered only on a written order where written_order_before_delivery_required is true,
      after a face-to-face examination within face_to_face_window_days before the order where
      face_to_face_exam_required is true, and with a certificate of medical necessity where
      certificate_of_medical_necessity_required is true. Under TRICARE Prime an item needs an approved Durable Medical Equipment Authorization covering the supplier where authorization_required_prime is true.
      Under TRICARE Select and the premium-based plans an authorization is needed only where
      authorization_required_select is true. The supplier must be of a kind in supplier_kinds_allowed and
      the item must be for home use.
    eligibility:
      - id: authorization_on_file
        applies_to: [dme_deliver_rental, dme_deliver_purchase]
        kind: authorization
        condition: Under TRICARE Prime an item needs an approved Durable Medical Equipment Authorization covering the supplier where authorization_required_prime is true.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.status, referral_authorizations.servicing_provider_id, dme_placements.referral_authorization_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dme_placements.referral_authorization_id]
          action_bindings:
            dme_placements.referral_authorization_id: referral_authorization_id

  - id: dme_rental_payment_schedule
    subject: [dme_rental_charge]
    rule: >-
      Each rental month is paid at the percent of purchase_fee_schedule_amount that rental_rate_ladder
      gives for its rental_month_number, rounded to the cent; a rental month runs under
      rental_month_definition and is never prorated. Rental months are paid only while the placement's status is in_rental.
      No rental month is paid once dme_msr_rental_months_paid reaches rental_cap_months, nor while the
      patient is an inpatient where rental_suspended_during_inpatient_stay is true; those inpatient months
      do not count toward the cap. The patient's cost share on each month follows the plan's durable
      medical equipment cost share.
    eligibility:
      - id: placement_in_rental
        applies_to: [dme_rental_charge]
        kind: state
        condition: Rental months are paid only while the placement's status is in_rental.
        evidence_fields: [dme_placements.dme_placement_id, dme_placements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dme_placements.dme_placement_id]
          action_bindings:
            dme_placements.dme_placement_id: dme_placement_id
        state_contract:
          field: dme_placements.status
          allowed: [in_rental]
    measures: [dme_msr_rental_months_paid]
    params:
      per_tier:
        Inexpensive or Routinely Purchased Equipment: {rental_cap_months: "=rental_cap_months", rental_rate_ladder: "=rental_rate_ladder"}
        Capped Rental Equipment: {rental_cap_months: "=rental_cap_months", rental_rate_ladder: "=rental_rate_ladder"}
        Continuous Positive Airway Pressure Equipment: {rental_cap_months: "=rental_cap_months", rental_rate_ladder: "=rental_rate_ladder"}
        Power Mobility Device: {rental_cap_months: "=rental_cap_months", rental_rate_ladder: "=rental_rate_ladder"}
        Oxygen and Oxygen Equipment: {rental_cap_months: "=rental_cap_months", rental_rate_ladder: "=rental_rate_ladder"}
        Frequently Serviced Equipment: {rental_cap_months: "=rental_cap_months", rental_rate_ladder: "=rental_rate_ladder"}
        Customized Equipment: {rental_cap_months: "=rental_cap_months", rental_rate_ladder: "=rental_rate_ladder"}
      ladder_pct_for_month: percent rental_rate_ladder gives for the month's band
    formula:
      allowed_amount: round(purchase_fee_schedule_amount * ladder_pct_for_month / 100, 2)

  - id: dme_cap_and_title
    subject: [dme_title_transfer, dme_purchase_option, dme_purchase_charge, dme_servicing_charge]
    rule: >-
      When the paid rental months reach rental_cap_months and title_transfers_at_cap is true, title passes
      to the patient on the day after the last capped month ends and maintenance and servicing becomes
      payable every servicing_payment_interval_months where maintenance_and_servicing_payable_after_cap is
      true. Where title does not transfer (oxygen equipment, frequently serviced equipment) the supplier
      keeps ownership and must keep furnishing the item for continued_furnishing_months_after_cap without
      rental payment. Where purchase_option_month is not zero the patient is offered the purchase option
      in that rental month and may decline it and keep renting where ownership_option_may_be_declined is
      true; an elected purchase is paid at the purchase amount less the rental months already paid.
    eligibility: []

  - id: dme_cpap_compliance
    subject: [dme_compliance_update, dme_rental_charge]
    rule: >-
      Where compliance_trial_required is true, continued rental after the trial depends on documented use
      of at least compliance_min_hours_per_night hours on at least compliance_min_pct_nights percent of
      nights in a span of compliance_consecutive_days consecutive days inside the first
      compliance_window_days after delivery, read from the device's usage report. When compliance is not
      shown, compliance_failure_outcome applies and no rental month after the window is paid until the
      patient is re-evaluated in person and a new trial is passed.
    eligibility: []

  - id: dme_interruption_and_replacement
    subject: [dme_order, dme_rental_charge]
    rule: >-
      An interruption in medical need longer than rental_interruption_restart_days, followed by a new
      order where new_order_required_after_interruption is true, starts a new rental period and a new cap;
      a shorter interruption continues the old period. Like-for-like replacement is payable after
      reasonable_useful_lifetime_months, or earlier for documented loss, theft or irreparable damage where
      replacement_for_loss_or_irreparable_damage is true; wear from normal use within the lifetime is a
      repair, not a replacement.
    eligibility: []

  - id: dme_return_and_cancellation
    subject: [dme_return, dme_cancel]
    rule: >-
      A patient may return rented equipment or cancel an undelivered order only by their own confirmation
      recorded on an intake. The rental ends on the return date; the rental month in which the return
      falls is paid in full where partial_month_proration is false, and no later month is paid. The
      supplier collects returned equipment within return_pickup_business_days. Owned or purchased
      equipment is never returned for credit.
    eligibility: []

  - id: dme_rental_reversal
    subject: [dme_rental_charge_reverse]
    rule: >-
      A reversal withdraws exactly one paid rental month, identified by its own record, for a stated
      reversal_reason (paid during an inpatient stay, paid after the cap, paid after return, duplicate),
      and that month stops counting toward the cap. A paid rental month is reversed at most once.
    eligibility:
      - id: not_already_reversed
        applies_to: [dme_rental_charge_reverse]
        kind: dedup
        condition: A paid rental month is reversed at most once.
        evidence_fields: [dme_rental_ledger.dme_rental_entry_id, dme_rental_ledger.reversed_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dme_rental_ledger.dme_rental_entry_id]
          action_bindings:
            dme_rental_ledger.dme_rental_entry_id: reversed_entry_id
        dedup_contract:
          table: dme_rental_ledger
          mode: separate_record
          object_bindings: {reversed_entry_id: reversed_entry_id}
          duplicate_filters: {event_type: [dme_rental_charge_reverse]}
          distinct_fields: []
