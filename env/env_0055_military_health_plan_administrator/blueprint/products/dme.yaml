# Durable medical equipment rental charter for the Westbridge Military Health Services regional contract (TRICARE West Region).
# One holding = one item of durable medical equipment placed with one patient by one supplier, classed by its
# TRICARE DMEPOS payment class. Rental months are booked on the rental ledger; capped classes pass to the patient's
# ownership after the cap, oxygen and frequently serviced classes stay supplier-owned.

category: dme
display_name: Durable Medical Equipment Rentals

binding:
  holding_table: dme_placements
  event_tables: [dme_rental_ledger]
  intake_tables: [dme_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {rental_months_billed: rental_months}

lifecycle:
  states: [ordered, in_rental, purchased, owned, returned, cancelled]
  transitions:
    - {from: ordered, to: in_rental, by: agent, means: The supplier delivers the equipment as a rental and rental month 1 starts on the delivery date.}
    - {from: ordered, to: purchased, by: agent, means: The supplier delivers the equipment as a purchase.}
    - {from: ordered, to: cancelled, by: user, means: The patient confirms cancelling the order before delivery; the agent records the request as an intake and the patient's confirmation ends it.}
    - {from: in_rental, to: owned, by: system, means: The last capped rental month is paid and title passes to the patient.}
    - {from: in_rental, to: purchased, by: agent, means: The patient elects the purchase option offered in the purchase-option month.}
    - {from: in_rental, to: returned, by: user, means: The patient confirms returning rented equipment no longer needed; the agent records the request as an intake and the patient's confirmation ends the rental.}

accounts:
  - key: rental_months
    unit: rental months
    meaning: Rental months paid on the placement, counted toward the class's rental cap; each paid rental month adds one and a reversal withdraws it.

parameter_schema:
  hcpcs_examples: list of HCPCS codes typical of the class
  purchase_allowed: boolean - whether the item may be bought outright at delivery
  rental_allowed: boolean - whether the item may be rented
  rental_cap_months: integer, paid rental months after which rental payments stop (0 = no cap)
  title_transfers_at_cap: boolean - whether ownership passes to the patient when the cap is reached
  purchase_option_month: integer, rental month in which the patient is offered the purchase option (0 = none)
  rental_rate_ladder: mapping rental-month band -> percent of the purchase fee-schedule amount paid per rental month (empty bands = not applicable)
  rental_rate_basis: string - what the monthly rental allowed amount is figured from
  continued_furnishing_months_after_cap: integer, months the supplier must keep furnishing the item without rental payment after the cap (0 = none)
  maintenance_and_servicing_payable_after_cap: boolean - whether maintenance and servicing is paid after the cap or purchase
  servicing_payment_interval_months: integer, months between payable maintenance and servicing visits (0 = not payable)
  reasonable_useful_lifetime_months: integer, months before like-for-like replacement is payable
  replacement_after_lifetime_allowed: boolean - whether replacement is payable after the reasonable useful lifetime
  replacement_for_loss_or_irreparable_damage: boolean - whether replacement is payable earlier after documented loss, theft or irreparable damage
  rental_interruption_restart_days: integer, days of interruption in medical need after which a new rental period and cap start
  new_order_required_after_interruption: boolean - whether a new order is needed to restart the rental after an interruption
  face_to_face_exam_required: boolean - whether a face-to-face examination must precede the order
  face_to_face_window_days: integer, days before the order within which the face-to-face exam must fall (0 = not applicable)
  written_order_before_delivery_required: boolean - whether a written order must be on file before delivery
  certificate_of_medical_necessity_required: boolean - whether a certificate of medical necessity is required
  recertification_months: integer, months after which medical necessity must be recertified (0 = none)
  authorization_required_prime: boolean - whether TRICARE Prime enrollees need a Durable Medical Equipment Authorization
  authorization_required_select: boolean - whether TRICARE Select and premium-based plan enrollees need a Durable Medical Equipment Authorization
  compliance_trial_required: boolean - whether continued rental depends on documented use in a trial period
  compliance_window_days: integer, days from delivery within which compliance must be shown (0 = not applicable)
  compliance_min_hours_per_night: integer, minimum nightly use counted toward compliance (0 = not applicable)
  compliance_min_pct_nights: integer, percent of nights in the measurement span with at least the minimum use (0 = not applicable)
  compliance_consecutive_days: integer, length of the consecutive-day measurement span (0 = not applicable)
  compliance_failure_outcome: string - what happens when compliance is not shown in the window
  supplier_kinds_allowed: list of providers.provider_kind values the supplier may be
  delivery_proof_required: boolean - whether signed proof of delivery is required before the first rental month is paid
  setup_and_training_included: boolean - whether setup and patient training are included in the rental or purchase payment
  accessories_separately_payable: boolean - whether accessories and supplies are paid separately
  supplies_replacement_schedule: string - the replacement schedule for related supplies
  rental_month_definition: string - how a rental month is counted
  partial_month_proration: boolean - whether a partial rental month is prorated
  cost_share_basis: string - how the patient's cost share on rental months is figured
  purchase_price_basis: string - the fee schedule that sets the purchase amount
  return_pickup_business_days: integer, business days within which the supplier picks up returned equipment
  loaner_during_repair: boolean - whether the supplier must provide a loaner while owned equipment is repaired
  rental_suspended_during_inpatient_stay: boolean - whether rental months are not paid while the patient is an inpatient
  inpatient_months_count_toward_cap: boolean - whether months not paid during an inpatient stay count toward the cap
  ownership_option_may_be_declined: boolean - whether the patient may decline the purchase option and keep renting
  max_rental_charges_per_month: integer, most rental charges payable for one placement in one rental month
  home_use_required: boolean - whether the item must be for use in the home
  upgrade_paid_by_patient: boolean - whether the patient pays the difference for an upgrade beyond what is medically necessary
  manufacturer_warranty_honored: boolean - whether the supplier must pass on the manufacturer warranty on purchased or owned items
  contents_separately_payable: boolean - whether oxygen contents are paid separately from equipment
  temporary_supplier_while_traveling: boolean - whether a temporary supplier may furnish the item while the patient travels

