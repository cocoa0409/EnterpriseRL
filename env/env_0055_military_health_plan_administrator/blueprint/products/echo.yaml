events:
  - type: echo_register
    target: echo_registrations
    mutation: create
    meaning: An ECHO registration request is received for a beneficiary.
    grain: one row per registration request
    fields:
      customer_id: the beneficiary with the qualifying condition
      variant_name: tier by the sponsor's pay grade, as its official full name
      qualifying_condition: the qualifying condition documented
      efmp_enrollment_confirmed: whether the Exceptional Family Member Program enrollment is confirmed
      application_date: date the registration request was received
    triggers: []
  - type: echo_approve
    target: echo_registrations
    mutation: {transition: {from: applied, to: registered}}
    meaning: The registration is approved and takes effect.
    grain: one row per transaction
    fields:
      status: set to registered
      effective_date: date the registration takes effect
    triggers: []
  - type: echo_deny
    target: echo_registrations
    mutation: {transition: {from: applied, to: denied}}
    meaning: The registration is denied.
    grain: one row per transaction
    fields:
      status: set to denied
      end_date: date of the denial
    triggers: []
  - type: echo_close_request
    target: echo_registrations
    mutation: {transition: {from: registered, to: closed_by_request}}
    meaning: The family confirms ending the registration.
    grain: one row per transaction
    fields:
      status: set to closed_by_request
      end_date: last day of the registration
    triggers: []
  - type: echo_close_ineligible
    target: echo_registrations
    mutation: {transition: {from: registered, to: closed_ineligible}}
    meaning: The registration ends for loss of eligibility.
    grain: one row per transaction
    fields:
      status: set to closed_ineligible
      end_date: last day of eligibility
    triggers: []
  - type: echo_tier_update
    target: echo_registrations
    mutation: update
    meaning: The registration moves to the tier of the sponsor's new pay grade.
    grain: one row per transaction
    fields:
      variant_name: new tier
      tier_effective_month: first calendar month the new tier's cost share applies
    triggers: []
  - type: echo_service_authorize
    target: echo_service_authorizations
    meaning: The ECHO case manager authorizes one ECHO service for a span of months.
    grain: one authorization of one service kind starting in one month
    distinguish_by: [service_kind, start_month]
    fields:
      echo_registration_id: the registration
      customer_id: the beneficiary
      service_kind: ECHO service authorized
      start_month: first month covered
      end_month: last month covered
      hours_per_month: hours authorized per month (0 for non-hourly services)
      provider_id: authorized ECHO provider
    triggers: []
  - type: echo_benefit_claim
    target: echo_benefit_ledger
    meaning: One ECHO claim line is paid and the government share booked against the beneficiary's fiscal-year cap.
    grain: one paid ECHO claim line
    distinguish_by: [claim_number, line_number]
    fields:
      echo_registration_id: the registration
      customer_id: the beneficiary
      claim_number: claim number printed on the Explanation of Benefits
      line_number: line on that claim
      service_kind: ECHO service paid
      service_month: calendar month of service
      fiscal_year: federal fiscal year of the service date
      hours: respite or care hours on the line (0 for non-hourly services)
      allowed_amount: allowed amount of the line
      amount: government share paid, positive USD
      posted_date: date paid
    account: echo_benefit_used
    direction: in
    triggers: []
  - type: echo_benefit_reverse
    target: echo_benefit_ledger
    meaning: A paid ECHO claim line is reversed.
    grain: one reversal of one paid line
    distinguish_by: [reversed_entry_id]
    fields:
      echo_registration_id: the registration
      customer_id: the beneficiary
      claim_number: claim number of the original line
      line_number: line number of the original line
      reversed_entry_id: the paid line reversed
      amount: government share withdrawn, positive USD
      posted_date: reversal date
    account: echo_benefit_used
    direction: out
    triggers: []
  - type: echo_monthly_cost_share
    target: echo_benefit_ledger
    meaning: The family's monthly ECHO cost share is assessed for a month with ECHO benefits.
    grain: one cost share per sponsor family per calendar month
    distinguish_by: [service_month]
    fields:
      echo_registration_id: the registration whose first claim of the month carries the cost share
      customer_id: the beneficiary on that registration
      service_month: calendar month assessed
      claim_number: the first ECHO claim of the month the cost share was taken from
      amount: cost share assessed, positive USD
      posted_date: date assessed
    account: echo_cost_share_assessed
    direction: in
    triggers: []
  - type: echo_cost_share_reverse
    target: echo_benefit_ledger
    meaning: A monthly cost share is withdrawn (assessed in error, a second assessment in the same family month, or the only claim of the month reversed).
    grain: one reversal of one cost share
    distinguish_by: [reversed_entry_id]
    fields:
      echo_registration_id: the registration
      customer_id: the beneficiary
      service_month: month of the cost share withdrawn
      reversed_entry_id: the cost share reversed
      amount: amount withdrawn, positive USD
      posted_date: reversal date
    account: echo_cost_share_assessed
    direction: out
    triggers: []

measures:
  - id: echo_msr_fiscal_year_benefit_used
    window: the federal fiscal year (October 1 through September 30) containing the service date
    measure: per beneficiary, sum of amount on echo_benefit_claim rows with service_kind other than ehhc minus amount on the matching echo_benefit_reverse rows
  - id: echo_msr_respite_hours_month
    window: the calendar month of service
    measure: per beneficiary, sum of hours on echo_benefit_claim rows with service_kind respite_care minus hours on reversed respite lines
  - id: echo_msr_family_cost_shares_month
    window: the calendar month of service
    measure: across the ECHO registrations of one sponsor family (same sponsor_customer_id), count of echo_monthly_cost_share rows not reversed

policies:
  - id: echo_agg_multi_holding
    subject: [echo_register]
    rule: >-
      A beneficiary may hold one ECHO registration at a time; several children of one sponsor each hold
      their own registration. A new request for a beneficiary whose registration is applied or registered
      is not a second registration. The beneficiary has no applied or registered ECHO registration.
    eligibility:
      - id: no_open_registration
        applies_to: [echo_register]
        kind: dedup
        condition: The beneficiary has no applied or registered ECHO registration.
        evidence_fields: [echo_registrations.customer_id, echo_registrations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [echo_registrations.customer_id]
          action_bindings:
            echo_registrations.customer_id: customer_id
        dedup_contract:
          table: echo_registrations
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, registered]}
          distinct_fields: [application_date]
    params:
      max_per_customer: 1

  - id: echo_agg_family_cost_share
    subject: [echo_monthly_cost_share, echo_cost_share_reverse]
    rule: >-
      The monthly cost share is a family charge: in any calendar month in which one or more family
      members registered in ECHO receive an ECHO benefit, the sponsor family pays one cost share
      (max_cost_shares_per_family_per_month), taken from the first ECHO claim of that month among all the
      family's registrations, at the monthly_cost_share of the tier in effect for that month. A second
      assessment for the same family month is reversed. A month with no ECHO benefit carries no cost
      share. A cost share is assessed only for a month in which some family member has a paid ECHO claim.
    eligibility:
      - id: benefit_month_exists
        applies_to: [echo_monthly_cost_share]
        kind: authorization
        condition: A cost share is assessed only for a month in which some family member has a paid ECHO claim.
        evidence_fields: [echo_benefit_ledger.echo_registration_id, echo_benefit_ledger.service_month, echo_benefit_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [echo_benefit_ledger.echo_registration_id]
          action_bindings:
            echo_benefit_ledger.echo_registration_id: echo_registration_id
    measures: [echo_msr_family_cost_shares_month]

  - id: echo_registration_requirements
    subject: [echo_register, echo_approve, echo_deny]
    rule: >-
      ECHO is open only to beneficiaries whose DEERS category is in eligible_beneficiary_categories and
      who have a qualifying condition in qualifying_conditions documented by the case manager. The beneficiary holds an active TRICARE Prime or TRICARE Select enrollment and, where efmp_enrollment_required is true, is enrolled in the Exceptional Family Member Program.
      A complete registration is decided within registration_review_business_days and takes effect under
      registration_effective_rule; no ECHO benefit is paid for services before the effective date.
      Retirees and their family members are not eligible.
    eligibility:
      - id: basic_coverage_and_efmp
        applies_to: [echo_approve]
        kind: authorization
        condition: The beneficiary holds an active TRICARE Prime or TRICARE Select enrollment and, where efmp_enrollment_required is true, is enrolled in the Exceptional Family Member Program.
        evidence_fields: [prime_enrollments.customer_id, prime_enrollments.status, select_enrollments.customer_id, select_enrollments.status, echo_registrations.efmp_enrollment_confirmed, customers.beneficiary_category]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_enrollments.customer_id]
            - [select_enrollments.customer_id]
          action_bindings:
            prime_enrollments.customer_id: customer_id
            select_enrollments.customer_id: customer_id

  - id: echo_cost_share_by_pay_grade
    subject: [echo_monthly_cost_share, echo_tier_update]
    rule: >-
      The monthly cost share is set by the sponsor's pay grade through the tier. A promotion or reduction
      moves the registration to the tier of the new grade under tier_change_effective_rule (from the
      first calendar month after DEERS records the new grade); a month already assessed is not re-rated.
    eligibility: []
    params:
      per_tier:
        Extended Care Health Option, Sponsor E-1 to E-5: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor E-6: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor E-7 and O-1: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor E-8 and O-2: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor E-9, W-1, W-2 and O-3: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor W-3, W-4 and O-4: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor W-5 and O-5: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor O-6 and O-7: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor O-8: {monthly_cost_share: "=monthly_cost_share"}
        Extended Care Health Option, Sponsor O-9 and O-10: {monthly_cost_share: "=monthly_cost_share"}

  - id: echo_fiscal_year_cap
    subject: [echo_benefit_claim, echo_benefit_reverse]
    rule: >-
      The government share for ECHO benefits other than ECHO Home Health Care is limited to
      fiscal_year_benefit_cap per beneficiary per federal fiscal year of the service date
      (echo_msr_fiscal_year_benefit_used); a line that crosses the cap is paid only up to the amount
      remaining and the rest is the family's to pay. The monthly cost share is taken from the government
      share of the first claim of the month. ECHO Home Health Care is limited separately under
      ehhc_cap_rule. Services the basic TRICARE program covers are paid by the basic program, never by
      ECHO, and other health insurance pays first.
    eligibility: []
    measures: [echo_msr_fiscal_year_benefit_used]
    formula:
      remaining_cap: max(0, fiscal_year_benefit_cap - echo_msr_fiscal_year_benefit_used)
      amount: min(allowed_amount, remaining_cap)

  - id: echo_respite_limits
    subject: [echo_benefit_claim, echo_service_authorize]
    rule: >-
      ECHO respite care is covered for at most respite_hours_per_month hours per beneficiary per calendar
      month (echo_msr_respite_hours_month) and only in a month in which the beneficiary also receives
      another authorized ECHO benefit where respite_requires_other_echo_benefit_in_month is true; unused
      hours never carry over. ECHO Home Health Care respite is limited to ehhc_respite_hours_per_day hours
      a day on ehhc_respite_days_per_week days a week and requires a homebound beneficiary with a primary
      caregiver. Hours beyond these limits are not paid.
    eligibility: []
    measures: [echo_msr_respite_hours_month]
    formula:
      payable_respite_hours: min(hours, max(0, respite_hours_per_month - echo_msr_respite_hours_month))

  - id: echo_service_authorization_required
    subject: [echo_service_authorize, echo_benefit_claim]
    rule: >-
      Every ECHO service needs an authorization from the case manager covering the service kind, provider
      and month, valid for authorization_validity_months; services that a public facility could provide
      need a public facility use certification for beneficiaries aged public_facility_certification_min_age_years
      or older. A claim line is paid only when an ECHO authorization for its service kind and provider covers its month.
      ECHO services are authorized only on a registration whose status is registered.
    eligibility:
      - id: authorized_month
        applies_to: [echo_benefit_claim]
        kind: authorization
        condition: A claim line is paid only when an ECHO authorization for its service kind and provider covers its month.
        evidence_fields: [echo_service_authorizations.echo_registration_id, echo_service_authorizations.service_kind, echo_service_authorizations.start_month, echo_service_authorizations.end_month, echo_service_authorizations.provider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [echo_service_authorizations.echo_registration_id]
          action_bindings:
            echo_service_authorizations.echo_registration_id: echo_registration_id
      - id: registration_active
        applies_to: [echo_service_authorize]
        kind: state
        condition: ECHO services are authorized only on a registration whose status is registered.
        evidence_fields: [echo_registrations.echo_registration_id, echo_registrations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [echo_registrations.echo_registration_id]
          action_bindings:
            echo_registrations.echo_registration_id: echo_registration_id
        state_contract:
          field: echo_registrations.status
          allowed: [registered]

  - id: echo_registration_end
    subject: [echo_close_ineligible, echo_close_request]
    rule: >-
      The registration ends under registration_ends_rule when DEERS shows the sponsor separated or retired
      (after continuation_months_after_sponsor_retirement months), when the transitional survivor period
      ends, or when the case manager finds the qualifying condition no longer present at recertification
      every annual_recertification_months. A family may end the registration at any time, but only by its
      own confirmation recorded on an intake. Services after the end date are not paid.
    eligibility: []

  - id: echo_benefit_reversal
    subject: [echo_benefit_reverse, echo_cost_share_reverse]
    rule: >-
      A reversal withdraws exactly one paid line or one cost share, identified by its own record, at most
      once. When the only paid ECHO claim of a family month is reversed, that month's cost share is
      reversed too. A paid line or cost share is reversed at most once.
    eligibility:
      - id: not_already_reversed
        applies_to: [echo_benefit_reverse, echo_cost_share_reverse]
        kind: dedup
        condition: A paid line or cost share is reversed at most once.
        evidence_fields: [echo_benefit_ledger.echo_entry_id, echo_benefit_ledger.reversed_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [echo_benefit_ledger.echo_entry_id]
          action_bindings:
            echo_benefit_ledger.echo_entry_id: reversed_entry_id
        dedup_contract:
          table: echo_benefit_ledger
          mode: separate_record
          object_bindings: {reversed_entry_id: reversed_entry_id}
          duplicate_filters: {event_type: [echo_benefit_reverse, echo_cost_share_reverse]}
          distinct_fields: []
