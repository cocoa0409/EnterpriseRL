# Extended Care Health Option charter for the Westbridge Military Health Services regional contract (TRICARE West Region).
# One holding = one beneficiary's ECHO registration. The tier is the sponsor pay-grade band that sets the monthly
# family cost share. Government payments for ECHO services are booked against the beneficiary's fiscal-year
# benefit cap; monthly cost shares are assessed once per sponsor family per month in which ECHO benefits are used.

category: echo
display_name: Extended Care Health Option (ECHO)

binding:
  holding_table: echo_registrations
  event_tables: [echo_benefit_ledger, echo_service_authorizations]
  intake_tables: [echo_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, registered, denied, closed_by_request, closed_ineligible]
  transitions:
    - {from: applied, to: registered, by: agent, means: The ECHO case manager confirms the qualifying condition, the Exceptional Family Member Program enrollment and the basic TRICARE coverage, and the registration takes effect.}
    - {from: applied, to: denied, by: agent, means: The registration is denied because a registration requirement is not met.}
    - {from: registered, to: closed_by_request, by: user, means: The sponsor or the beneficiary's guardian confirms ending the ECHO registration; the agent records the request as an intake and the family's confirmation ends it.}
    - {from: registered, to: closed_ineligible, by: system, means: DEERS or the case manager shows the beneficiary no longer eligible (sponsor separation or retirement, loss of the qualifying condition, end of the transitional survivor period).}

accounts:
  - key: echo_benefit_used
    unit: USD
    meaning: Government share paid for ECHO services (other than ECHO Home Health Care) for the beneficiary, counted against the fiscal-year benefit cap; payments add to it and reversals withdraw them.
  - key: echo_cost_share_assessed
    unit: USD
    meaning: Monthly ECHO cost shares assessed to the sponsor family; assessments add to it and reversals withdraw them.

parameter_schema:
  sponsor_pay_grades_covered: list of sponsor pay grades (customers.sponsor_pay_grade values) the tier applies to
  monthly_cost_share: USD per calendar month in which the family receives any ECHO benefit
  cost_share_basis: string - the unit on which the monthly cost share is assessed
  max_cost_shares_per_family_per_month: integer, most monthly cost shares one sponsor family pays in a calendar month
  cost_share_applied_to: string - the claim the monthly cost share is taken from
  cost_share_months_without_benefits: string - treatment of months with no ECHO benefit
  eligible_beneficiary_categories: list of DEERS beneficiary categories eligible to register
  qualifying_conditions: list of qualifying_condition values that support registration
  efmp_enrollment_required: boolean - whether the sponsor must have the beneficiary enrolled in the service's Exceptional Family Member Program
  case_manager_required: boolean - whether an ECHO case manager must be assigned before any ECHO service
  basic_program_coverage_required: boolean - whether the beneficiary must hold TRICARE Prime or TRICARE Select coverage
  registration_review_business_days: integer, business days within which a complete registration is decided
  registration_effective_rule: string - the date the registration takes effect
  registration_documents_required: list of documents a registration must include
  annual_recertification_months: integer, months between case-manager recertifications of the qualifying condition
  fiscal_year_benefit_cap: USD per beneficiary per federal fiscal year, government share for all ECHO benefits other than ECHO Home Health Care
  benefit_cap_year_basis: string - the year the cap is counted over
  fiscal_year_cap_shared_across_family: boolean - whether family members share one cap
  amount_over_cap_payer: string - who pays charges above the cap
  ehhc_counts_toward_cap: boolean - whether ECHO Home Health Care payments count toward fiscal_year_benefit_cap
  ehhc_cap_rule: string - the separate annual limit on ECHO Home Health Care
  ehhc_homebound_required: boolean - whether ECHO Home Health Care requires homebound status
  ehhc_primary_caregiver_required: boolean - whether ECHO Home Health Care requires a primary caregiver in the home
  ehhc_respite_hours_per_day: integer, most ECHO Home Health Care respite hours in one day
  ehhc_respite_days_per_week: integer, most days a week of ECHO Home Health Care respite
  respite_hours_per_month: integer, most ECHO respite care hours per beneficiary per calendar month
  respite_requires_other_echo_benefit_in_month: boolean - whether respite is covered only in a month the beneficiary also receives another authorized ECHO benefit
  respite_unused_hours_carry_over: boolean - whether unused respite hours carry to the next month
  respite_unit: string - the unit respite is counted in
  services_covered: list of service_kind values ECHO covers
  authorization_required_for_each_service: boolean - whether every ECHO service needs its own authorization
  authorization_validity_months: integer, months one ECHO service authorization covers
  public_facility_use_certification_required: boolean - whether a public facility use certification is required for services public facilities could provide
  public_facility_certification_min_age_years: integer, youngest age at which the certification applies
  training_benefit_covered: boolean - whether training for the beneficiary and family is covered
  transportation_covered: boolean - whether transportation to and from an ECHO-authorized institution is covered
  institutional_care_covered: boolean - whether institutional care is covered when residential care is medically or psychologically necessary
  assistive_technology_covered: boolean - whether assistive services and technology are covered
  durable_equipment_covered: boolean - whether ECHO durable equipment (including adaptations) is covered
  basic_program_first: boolean - whether services the basic TRICARE program covers must be paid by the basic program, not ECHO
  ohi_first: boolean - whether other health insurance pays before ECHO
  registration_ends_rule: string - when the registration ends for loss of eligibility
  continuation_after_sponsor_death: string - ECHO eligibility after the sponsor dies on active duty
  continuation_months_after_sponsor_retirement: integer, months ECHO continues after the sponsor retires (0 = ends at retirement)
  benefit_claim_filing_deadline_days: integer, calendar days after the date of service within which an ECHO claim must be received
  case_review_interval_days: integer, days between ECHO case-management reviews of the service plan
  government_share_rounding: string - rounding of the government share
  tier_change_effective_rule: string - when a sponsor pay-grade change moves the registration to another tier

variants:
  - name: Extended Care Health Option, Sponsor E-1 to E-5
    rank: 1
    entry_gate:
      beneficiary_categories: [active_duty_family_member, transitional_survivor]
      sponsor_pay_grades: [E-1, E-2, E-3, E-4, E-5]
      qualifying_condition_documented: true
      efmp_enrolled: true
      basic_program: TRICARE Prime or TRICARE Select
    parameters:
      sponsor_pay_grades_covered: [E-1, E-2, E-3, E-4, E-5]
      monthly_cost_share: 25.00
      cost_share_basis: per_sponsor_family_per_calendar_month_with_echo_benefits
      max_cost_shares_per_family_per_month: 1
      cost_share_applied_to: first_paid_echo_claim_of_the_month_among_the_family
      cost_share_months_without_benefits: no_cost_share
      eligible_beneficiary_categories: [active_duty_family_member, transitional_survivor]
      qualifying_conditions: [moderate_or_severe_intellectual_disability, serious_physical_disability, extraordinary_physical_or_psychological_condition, neuromuscular_developmental_condition, multiple_disabilities]
      efmp_enrollment_required: true
      case_manager_required: true
      basic_program_coverage_required: true
      registration_review_business_days: 10
      registration_effective_rule: date_the_case_manager_approves_the_registration
      registration_documents_required: [diagnosis_from_a_tricare_authorized_provider, efmp_enrollment_confirmation]
      annual_recertification_months: 12
      fiscal_year_benefit_cap: 36000.00
      benefit_cap_year_basis: federal_fiscal_year_october_1_to_september_30
      fiscal_year_cap_shared_across_family: false
      amount_over_cap_payer: sponsor_family
      ehhc_counts_toward_cap: false
      ehhc_cap_rule: annual_amount_tricare_would_pay_for_skilled_nursing_facility_care_in_the_locality
      ehhc_homebound_required: true
      ehhc_primary_caregiver_required: true
      ehhc_respite_hours_per_day: 8
      ehhc_respite_days_per_week: 5
      respite_hours_per_month: 16
      respite_requires_other_echo_benefit_in_month: true
      respite_unused_hours_carry_over: false
      respite_unit: hour
      services_covered: [respite_care, ehhc, assistive_services, durable_equipment, training, institutional_care, transportation, rehabilitative_services]
      authorization_required_for_each_service: true
      authorization_validity_months: 6
      public_facility_use_certification_required: true
      public_facility_certification_min_age_years: 3
      training_benefit_covered: true
      transportation_covered: true
      institutional_care_covered: true
      assistive_technology_covered: true
      durable_equipment_covered: true
      basic_program_first: true
      ohi_first: true
      registration_ends_rule: end_of_the_month_deers_shows_loss_of_active_duty_family_member_status_or_the_case_manager_ends_the_qualifying_condition
      continuation_after_sponsor_death: eligible_for_the_transitional_survivor_period
      continuation_months_after_sponsor_retirement: 0
      benefit_claim_filing_deadline_days: 365
      case_review_interval_days: 90
      government_share_rounding: to_the_cent
      tier_change_effective_rule: first_calendar_month_after_deers_records_the_new_pay_grade
