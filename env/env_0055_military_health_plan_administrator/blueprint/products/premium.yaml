# Premium-based plans charter for the Westbridge Military Health Services regional contract (TRICARE West Region):
# TRICARE Reserve Select, TRICARE Retired Reserve and TRICARE Young Adult. One holding = one premium-plan
# purchase by its purchaser (the Selected Reserve or Retired Reserve member, or the young adult). Monthly premiums
# are billed in advance and booked on the premium ledger; claims are cost-shared under a mapped TRICARE schedule.

category: premium
display_name: TRICARE Premium-Based Plans

binding:
  holding_table: premium_plan_enrollments
  event_tables: [premium_ledger, premium_claim_lines]
  intake_tables: [premium_plan_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance_due: premium_due}

lifecycle:
  states: [applied, active, rejected, terminated_by_request, terminated_nonpayment, terminated_ineligible]
  transitions:
    - {from: applied, to: active, by: agent, means: The purchase is processed - DEERS shows the purchaser eligible, the purchase window is met and the initial premium payment is posted - and coverage starts on the coverage effective date.}
    - {from: applied, to: rejected, by: agent, means: The purchase cannot be processed because the purchaser is not eligible for the plan, the purchase window was missed, or a nonpayment lockout is still running.}
    - {from: active, to: terminated_by_request, by: user, means: The purchaser confirms a request to end the plan; the agent records the request as an intake and the purchaser's confirmation ends coverage.}
    - {from: active, to: terminated_nonpayment, by: system, means: A monthly premium stayed unpaid past the grace period; coverage ends on the paid-through date and a purchase lockout starts.}
    - {from: active, to: terminated_ineligible, by: system, means: DEERS no longer shows the purchaser eligible (activation on federal orders, FEHB eligibility, age limit, marriage or employer coverage for a young adult, loss of Selected Reserve status).}
    - {from: terminated_nonpayment, to: active, by: agent, means: An approved Enrollment Reinstatement Review restores the plan without a break once every past-due premium is paid.}

accounts:
  - key: premium_due
    unit: USD
    meaning: Premiums owed on the plan - monthly and adjustment bills and refunds of credit balances increase it, payments and proration credits reduce it; a negative value is a credit owed to the purchaser.
  - key: beneficiary_liability_accrued
    unit: USD
    meaning: Beneficiary out-of-pocket liability (deductible plus cost share) assessed on adjudicated claim lines of the premium-based plan, net of reversals.

parameter_schema:
  eligible_beneficiary_categories: list of DEERS beneficiary categories (customers.beneficiary_category values) of the purchaser
  coverage_type: string - member_only, member_and_family or young_adult_individual
  covers_family_members: boolean - whether the purchase covers the purchaser's DEERS-eligible family members
  purchaser_min_age_years: integer, youngest age in completed years at which the purchaser may buy the plan (0 = no minimum)
  purchaser_min_age_full_time_student_years: integer, youngest purchase age for a young adult enrolled as a full-time student (0 = not applicable)
  coverage_end_age_years: integer, age at which coverage ends under coverage_end_rule (0 = no age limit)
  coverage_end_rule: string - how coverage ends when the age limit is reached
  must_be_unmarried: boolean - whether the purchaser must be unmarried
  excluded_if_fehb_eligible: boolean - whether eligibility for the Federal Employees Health Benefits program bars the purchase
  excluded_if_employer_coverage_eligible: boolean - whether eligibility for employer-sponsored coverage based on own employment bars the purchase
  sponsor_status_required: string - the sponsor status the plan depends on
  plan_design: string - select_type (no PCM, no referrals) or prime_type (PCM and referrals)
  requires_residence_in_prime_service_area: boolean - whether the purchaser must reside in a Prime Service Area
  qle_purchase_window_days: integer, calendar days after a DEERS-recorded qualifying life event within which a purchase must be received
  open_season_purchase_allowed: boolean - whether the plan may be bought during open season
  qle_effective_date_rule: string - date a qualifying-life-event purchase takes effect
  open_season_effective_date_rule: string - date an open-season purchase takes effect
  initial_payment_months: integer, number of monthly premiums that must accompany the purchase
  monthly_premium: USD per coverage month, calendar year 2026 rate
  premium_rate_year: string - the calendar year the premium rate applies to
  premium_due_rule: string - when each monthly premium is due
  recurring_payment_methods: list of methods accepted for monthly premiums after the initial payment
  initial_payment_methods: list of methods accepted for the initial payment
  nonpayment_grace_days: integer, calendar days after a premium's due date before termination for nonpayment applies
  delinquency_notice_day: integer, calendar day after the due date on which the delinquency letter is issued
  lockout_months_after_nonpayment: integer, calendar months after a nonpayment termination during which the plan cannot be purchased again
  reinstatement_request_window_days: integer, calendar days after a nonpayment termination within which an Enrollment Reinstatement Review may be filed
  proration_basis: string - how premiums for a partial month are figured
  premium_refund_issue_days: integer, calendar days after a credit balance arises within which the refund is issued
  termination_effective_rule: string - when a purchaser-requested termination takes effect
  voluntary_termination_lockout_months: integer, months after a purchaser-requested termination during which the plan cannot be bought again (0 = none)
  coverage_type_change_on_qle_allowed: boolean - whether a qualifying life event lets the purchaser move between member-only and member-and-family
  coverage_type_change_window_days: integer, calendar days after the DEERS-recorded event within which a coverage-type change must be requested (0 = not applicable)
  coverage_type_change_target: string - the official tier name the coverage-type change moves to (not_applicable where none)
  survivor_continuation_rule: string - coverage of family members after the purchaser's death
  activation_effect: string - what happens to the plan when the sponsor is called to active duty for more than 30 days
  claims_cost_share_schedule: string - the TRICARE cost-share schedule claims under this plan are adjudicated with
  deductible_individual: mapping cost-share key -> USD per calendar plan year, outpatient deductible per beneficiary
  deductible_family: mapping cost-share key -> USD per calendar plan year, outpatient deductible per family
  catastrophic_cap_family: mapping cost-share key -> USD per calendar plan year, family catastrophic cap
  premiums_count_toward_catastrophic_cap: boolean - whether premiums paid count toward the catastrophic cap
  network_outpatient_cost_share_pct: mapping cost-share key -> percent of allowed for network outpatient care (Group A keys) after the deductible
  non_network_outpatient_cost_share_pct: mapping cost-share key -> percent of allowed for non-network outpatient care after the deductible
  pcm_required: boolean - whether a primary care manager is assigned
  specialty_referral_required: boolean - whether specialty care needs a PCM referral
  pos_option_available: boolean - whether point-of-service charges apply to unreferred care
  tricare_secondary_to_ohi: boolean - whether TRICARE pays after other health insurance
  region_transfer_allowed: boolean - whether the plan moves to the gaining region on a move out of the West Region
  claim_filing_deadline_days: integer, calendar days after the date of service within which a claim must be received

