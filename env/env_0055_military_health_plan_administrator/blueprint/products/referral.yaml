events:
  - type: referral_submit
    target: referral_authorizations
    mutation: create
    meaning: A referral or authorization request for a patient is received by the region.
    grain: one row per request
    fields:
      customer_id: the patient
      variant_name: the authorization type requested, as its official full name
      referral_number: the reference number printed on the referral or authorization letter
      requesting_provider_id: the PCM or treating provider who requested it
      servicing_provider_id: the provider or facility requested to deliver the care
      coverage_plan: the plan the patient's care is covered under
      request_date: date the request was received
      review_priority: standard, urgent or retrospective
      units_requested: units the requesting provider asked for
    triggers: []
  - type: referral_pend
    target: referral_authorizations
    mutation: {transition: {from: submitted, to: pended_information}}
    meaning: The request is pended for missing clinical information.
    grain: one row per transaction
    fields:
      status: set to pended_information
      information_requested_date: date the information was requested from the requesting provider
    triggers: []
  - type: referral_approve
    target: referral_authorizations
    mutation: {transition: [{from: submitted, to: approved}, {from: pended_information, to: approved}]}
    meaning: The request is approved on review.
    grain: one row per transaction
    fields:
      status: set to approved
      decision_date: date of the decision
      valid_from: first day of the validity span
      valid_through: last day of the validity span
      units_authorized: units authorized on approval
    triggers:
      - event: referral:referral_units_grant
        map: {referral_authorization_id: referral_authorization_id, customer_id: customer_id, units: units_authorized, entry_date: decision_date, grant_basis: initial_approval}
  - type: referral_deny
    target: referral_authorizations
    mutation: {transition: [{from: submitted, to: denied}, {from: pended_information, to: denied}]}
    meaning: The request is denied on review.
    grain: one row per transaction
    fields:
      status: set to denied
      decision_date: date of the decision
      denial_reason: reason for the denial
    triggers: []
  - type: referral_approve_on_appeal
    target: referral_authorizations
    mutation: {transition: {from: denied, to: approved}}
    meaning: A denied request is approved because its medical necessity reconsideration was decided overturned.
    grain: one row per transaction
    fields:
      referral_authorization_id: the denied authorization being approved
      status: set to approved
      decision_date: date the overturned decision is effectuated
      valid_from: first day of the validity span
      valid_through: last day of the validity span
      units_authorized: units authorized
      denial_reason: reset to not_applicable
    triggers:
      - event: referral:referral_units_grant
        map: {referral_authorization_id: referral_authorization_id, customer_id: customer_id, units: units_authorized, entry_date: decision_date, grant_basis: appeal_overturn}
  - type: referral_units_grant
    target: referral_unit_ledger
    meaning: The units of an approval are put on the authorization.
    grain: one grant per approval of one authorization
    distinguish_by: [entry_date, grant_basis]
    fields:
      referral_authorization_id: the authorization
      customer_id: the patient
      units: units granted
      entry_date: date granted (the decision date)
      grant_basis: initial_approval or appeal_overturn
    account: authorized_units
    direction: in
    triggers: []
  - type: referral_units_extend
    target: referral_unit_ledger
    meaning: An extension adds units to an approved authorization and moves its valid_through out.
    grain: one extension of one authorization
    distinguish_by: [extension_sequence]
    fields:
      referral_authorization_id: the authorization
      customer_id: the patient
      units: units added
      entry_date: date the extension was approved
      extension_sequence: 1 for the first extension, 2 for the second and so on
      extended_valid_through: new last day of the validity span
    account: authorized_units
    direction: in
    triggers:
      - event: referral:referral_validity_update
        map: {valid_through: extended_valid_through}
  - type: referral_units_consume
    target: referral_unit_ledger
    meaning: A visit, day, hour or rental month is used against the authorization.
    grain: one use on one service date under one claim line
    distinguish_by: [claim_number, line_number]
    fields:
      referral_authorization_id: the authorization
      customer_id: the patient
      units: units used
      entry_date: date the use was posted
      service_date: date of service
      claim_number: claim number of the claim line the use comes from
      line_number: line number of that claim line
    account: authorized_units
    direction: out
    triggers: []
  - type: referral_units_release
    target: referral_unit_ledger
    meaning: Units left on an authorization are released when it is cancelled or expires.
    grain: one release per authorization end
    distinguish_by: [release_reason]
    fields:
      referral_authorization_id: the authorization
      customer_id: the patient
      units: units released (all units remaining)
      entry_date: date released
      release_reason: cancellation or expiration
    account: authorized_units
    direction: out
    triggers: []
  - type: referral_servicing_change
    target: referral_authorizations
    mutation: update
    meaning: The approved authorization is moved to another servicing provider - at the patient's request, under the military clinic's right of first refusal, or because the provider is unavailable.
    grain: one row per transaction
    fields:
      servicing_provider_id: the new servicing provider
      servicing_change_reason: why the servicing provider changed
      servicing_change_date: date the change takes effect
    triggers: []
  - type: referral_validity_update
    target: referral_authorizations
    mutation: update
    meaning: The validity span of the authorization is moved out after an approved extension.
    grain: one row per transaction
    fields:
      valid_through: new last day of the validity span
    triggers: []
  - type: referral_cancel
    target: referral_authorizations
    mutation: {transition: {from: approved, to: cancelled}}
    meaning: The patient confirms cancelling the authorization.
    grain: one row per transaction
    fields:
      status: set to cancelled
      closed_date: date the authorization ended
    triggers:
      - event: referral:referral_units_release
        map: {referral_authorization_id: referral_authorization_id, customer_id: customer_id, release_reason: cancellation, entry_date: closed_date}
  - type: referral_expire
    target: referral_authorizations
    mutation: {transition: {from: approved, to: expired}}
    meaning: The authorization's validity span has ended.
    grain: one row per transaction
    fields:
      status: set to expired
      closed_date: the day after valid_through
    triggers:
      - event: referral:referral_units_release
        map: {referral_authorization_id: referral_authorization_id, customer_id: customer_id, release_reason: expiration, entry_date: closed_date}
  - type: referral_exhaust
    target: referral_authorizations
    mutation: {transition: {from: approved, to: exhausted}}
    meaning: Every authorized unit has been used.
    grain: one row per transaction
    fields:
      status: set to exhausted
      closed_date: posting date of the use that brought units_remaining to zero
    triggers: []

measures:
  - id: referral_msr_units_used
    window: the life of the authorization
    measure: sum of units on referral_units_consume rows of the authorization
  - id: referral_msr_extensions_granted
    window: the life of the authorization
    measure: count of referral_units_extend rows of the authorization

policies:
  - id: referral_agg_multi_holding
    subject: [referral_submit]
    rule: >-
      A patient may hold any number of referrals and authorizations at once, of the same or different
      types, so long as no two of them are duplicates under referral_agg_duplicate_requests.
    eligibility: []
    params:
      max_per_customer: null

  - id: referral_agg_duplicate_requests
    subject: [referral_submit, referral_approve, referral_units_consume]
    rule: >-
      Two authorizations of the same type for the same patient and the same servicing provider whose
      validity spans overlap are duplicates; a new request that would duplicate an approved, unexpired
      authorization is denied as duplicate_request and the patient is pointed to the authorization already
      on file. A request for a different servicing provider or a different authorization type is never a
      duplicate. When several approved authorizations could cover one claim line, the line consumes the
      one whose servicing provider is the line's provider; among those, the one with the earliest
      valid_through that still has units. A request is not a duplicate of an approved authorization of the same type for the same patient and servicing provider whose validity span overlaps it.
    eligibility:
      - id: no_overlapping_duplicate
        applies_to: [referral_approve]
        kind: dedup
        condition: A request is not a duplicate of an approved authorization of the same type for the same patient and servicing provider whose validity span overlaps it.
        evidence_fields: [referral_authorizations.customer_id, referral_authorizations.variant_name, referral_authorizations.servicing_provider_id, referral_authorizations.status, referral_authorizations.valid_through]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.customer_id, referral_authorizations.variant_name, referral_authorizations.servicing_provider_id]
          action_bindings:
            referral_authorizations.customer_id: customer_id
            referral_authorizations.variant_name: variant_name
            referral_authorizations.servicing_provider_id: servicing_provider_id
        dedup_contract:
          table: referral_authorizations
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name, servicing_provider_id: servicing_provider_id}
          duplicate_filters: {status: [approved]}
          distinct_fields: [valid_from, valid_through]

  - id: referral_requirement_by_plan
    subject: [referral_submit, referral_approve, referral_deny]
    rule: >-
      Whether an authorization is needed depends on the plan the patient holds on the date of service,
      not on what the caller believes. The patient holds an active enrollment in a plan listed in the tier's required_for_plans on the request date.
      Under TRICARE Prime, non-emergency specialty care and rehabilitative therapy need a PCM referral and
      care received without one falls under missing_authorization_outcome_prime; under TRICARE Select and
      the premium-based plans only the services of authorization tiers that list tricare_select or
      premium_based_plan need an authorization and care without one falls under
      missing_authorization_outcome_select. Services in referral_exempt_service_classes never need one
      (preventive care, emergency care, urgent care and office-based outpatient behavioral health
      visits). A request for a patient whose plan does not require that authorization is not reviewed
      for medical necessity; it is denied as not_required_for_plan so that no unneeded authorization
      sits on the record. A request for a patient with no active TRICARE coverage on the request date is
      denied as no_eligibility.
    eligibility:
      - id: plan_requires_authorization
        applies_to: [referral_approve]
        kind: authorization
        condition: The patient holds an active enrollment in a plan listed in the tier's required_for_plans on the request date.
        evidence_fields: [prime_enrollments.customer_id, prime_enrollments.status, select_enrollments.customer_id, select_enrollments.status, premium_plan_enrollments.customer_id, premium_plan_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_enrollments.customer_id]
            - [select_enrollments.customer_id]
            - [premium_plan_enrollments.customer_id]
          action_bindings:
            prime_enrollments.customer_id: customer_id
            select_enrollments.customer_id: customer_id
            premium_plan_enrollments.customer_id: customer_id

  - id: referral_review_and_pend
    subject: [referral_submit, referral_pend, referral_approve, referral_deny]
    rule: >-
      A standard request is decided within standard_review_business_days and an urgent request within
      urgent_review_hours of receipt; business days are Monday through Friday excluding federal holidays.
      Where clinical_documentation_required is true and the notes are missing, the request is pended and
      the requesting provider asked for them; the patient cannot supply clinical notes on the provider's
      behalf by phone. A pended request is denied for missing information only once more than information_pend_days have passed since the information was requested.
      The pend period is counted in calendar days starting the day after information_requested_date, so the denial may be made from the day after information_requested_date plus information_pend_days and not on that day itself.
      Information that arrives inside the pend period is reviewed and the request approved or denied on
      its merits. A retrospective request is accepted only within retrospective_request_window_days of the
      service start, and an emergency admission is covered without a prior request only when the facility
      notified the region within emergency_notification_hours of the admission.
    eligibility:
      - id: pend_period_elapsed
        applies_to: [referral_deny]
        kind: time
        condition: A pended request is denied for missing information only once more than information_pend_days have passed since the information was requested.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.information_requested_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.referral_authorization_id]
          action_bindings:
            referral_authorizations.referral_authorization_id: referral_authorization_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the information was requested
          anchor_source: referral_authorizations.information_requested_date
          relation: not_before
          duration_source: variants.information_pend_days
          unit: calendar_days
          counting_rule: The pend period is counted in calendar days starting the day after information_requested_date, so the denial may be made from the day after information_requested_date plus information_pend_days and not on that day itself.
          boundary: exclusive

  - id: referral_validity_and_units
    subject: [referral_approve, referral_approve_on_appeal, referral_units_grant]
    rule: >-
      On approval valid_from is set under validity_start_rule and valid_through is the last day of a span
      of validity_days calendar days counting valid_from as day 1. The units authorized are the lesser of
      the units requested and default_units_authorized, and never more than max_units_per_authorization;
      units are counted in the tier's unit_of_measure. An approval made on appeal starts its span on the
      effectuation date unless the care was already given, in which case it starts on the first service
      date under appeal. The validity span and the units are separate limits: an authorization ends when
      either runs out.
    eligibility: []
    params:
      per_tier:
        Specialty Care Referral: {validity_days: "=validity_days", default_units_authorized: "=default_units_authorized"}
        Rehabilitative Therapy Referral: {validity_days: "=validity_days", default_units_authorized: "=default_units_authorized"}
        Durable Medical Equipment Authorization: {validity_days: "=validity_days", default_units_authorized: "=default_units_authorized"}
        Home Health Care Authorization: {validity_days: "=validity_days", default_units_authorized: "=default_units_authorized"}
        Applied Behavior Analysis Authorization: {validity_days: "=validity_days", default_units_authorized: "=default_units_authorized"}
        Skilled Nursing Facility Authorization: {validity_days: "=validity_days", default_units_authorized: "=default_units_authorized"}
        Inpatient Mental Health Authorization: {validity_days: "=validity_days", default_units_authorized: "=default_units_authorized"}
    formula:
      units_authorized: min(units_requested, default_units_authorized, max_units_per_authorization)

  - id: referral_right_of_first_refusal
    subject: [referral_servicing_change, referral_approve]
    rule: >-
      For a TRICARE Prime request of a tier whose rofr_applies is true, when a military hospital or clinic
      in the patient's residence service area offers the requested specialty, that facility has
      rofr_response_business_days to accept the patient. If it accepts, the servicing provider becomes the
      military clinic (servicing_change_reason military_clinic_right_of_first_refusal) and the patient is
      seen there; a Prime enrollee who goes to the civilian provider instead is under point-of-service. If
      it declines or does not answer in time, the network provider requested stays the servicing provider.
      The right of first refusal never applies under TRICARE Select or the premium-based plans.
    eligibility: []

  - id: referral_servicing_provider_change
    subject: [referral_servicing_change]
    rule: >-
      A patient may ask to move an approved authorization to another servicing provider where
      redirect_allowed is true. The servicing provider can be changed only while the authorization's status is approved.
      The new provider must be of a kind listed in servicing_provider_kinds_allowed, of the same specialty
      as the original servicing provider and in the patient's residence service area, or, when it is
      outside, the patient accepts that the access standards (access_standard_days,
      drive_time_standard_minutes) no longer bind the region. The change takes effect on the date it is
      made; the units remaining and the validity span carry over unchanged and units already used stay
      used. A patient may not move the authorization to a provider who has already declined the patient.
    eligibility:
      - id: authorization_approved_for_change
        applies_to: [referral_servicing_change]
        kind: state
        condition: The servicing provider can be changed only while the authorization's status is approved.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.referral_authorization_id]
          action_bindings:
            referral_authorizations.referral_authorization_id: referral_authorization_id
        state_contract:
          field: referral_authorizations.status
          allowed: [approved]

  - id: referral_unit_consumption
    subject: [referral_units_consume, referral_exhaust]
    rule: >-
      One unit is used per the tier's units_used_definition. A use is posted only for a service date inside the validity span of an approved authorization whose servicing provider delivered the service.
      Services outside the span or from another provider consume nothing and are treated as received
      without authorization. When units_remaining reaches zero the authorization is exhausted on that
      posting date; further care needs an extension or a new authorization.
    eligibility:
      - id: use_inside_span
        applies_to: [referral_units_consume]
        kind: authorization
        condition: A use is posted only for a service date inside the validity span of an approved authorization whose servicing provider delivered the service.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.status, referral_authorizations.valid_from, referral_authorizations.valid_through, referral_authorizations.servicing_provider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.referral_authorization_id]
          action_bindings:
            referral_authorizations.referral_authorization_id: referral_authorization_id
    measures: [referral_msr_units_used]

  - id: referral_extension
    subject: [referral_units_extend, referral_validity_update]
    rule: >-
      Where extension_allowed is true the requesting or servicing provider may ask to extend an approved
      authorization; each extension adds extension_units and moves valid_through out by
      extension_validity_days, up to max_extensions extensions (referral_msr_extensions_granted) and never
      beyond max_units_per_authorization in total. An extension request must be received no later than extension_after_expiry_days after the authorization's valid_through.
      The deadline is counted in calendar days starting the day after valid_through, so with zero days the request must arrive on or before valid_through itself and a request on the next day is late.
      A late request, or one beyond the extension limits, is a new request under reauthorization_basis.
    eligibility:
      - id: extension_on_time
        applies_to: [referral_units_extend]
        kind: time
        condition: An extension request must be received no later than extension_after_expiry_days after the authorization's valid_through.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.valid_through]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.referral_authorization_id]
          action_bindings:
            referral_authorizations.referral_authorization_id: referral_authorization_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the authorization's valid_through
          anchor_source: referral_authorizations.valid_through
          relation: not_after
          duration_source: variants.extension_after_expiry_days
          unit: calendar_days
          counting_rule: The deadline is counted in calendar days starting the day after valid_through, so with zero days the request must arrive on or before valid_through itself and a request on the next day is late.
          boundary: inclusive
    measures: [referral_msr_extensions_granted]
    formula:
      units: min(extension_units, max_units_per_authorization - units_authorized - referral_msr_extensions_granted * extension_units)

  - id: referral_cancellation_and_expiry
    subject: [referral_cancel, referral_expire, referral_units_release]
    rule: >-
      A patient may cancel an approved authorization they no longer need, only by their own confirmation:
      the agent records the request as an intake and the patient (or parent or guardian of a minor)
      confirms it. Cancellation and expiry release every unit still remaining where
      cancellation_releases_units or expiry_releases_units is true. An authorization expires on the day
      after valid_through. Units are released only from an authorization whose status is cancelled or expired.
      A cancelled or expired authorization is never reopened; later care needs a new request.
    eligibility:
      - id: release_after_end
        applies_to: [referral_units_release]
        kind: state
        condition: Units are released only from an authorization whose status is cancelled or expired.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.referral_authorization_id]
          action_bindings:
            referral_authorizations.referral_authorization_id: referral_authorization_id
        state_contract:
          field: referral_authorizations.status
          allowed: [cancelled, expired]

  - id: referral_continuity_on_changes
    subject: [referral_units_consume, referral_servicing_change]
    rule: >-
      An authorization stays valid after the patient changes PCM where valid_after_pcm_change is true, and
      the new PCM does not need to re-request it. It does not survive an enrollment transfer out of the
      West Region where valid_after_region_transfer is false: the gaining region issues its own. A change of
      plan inside the region (Prime to Select or the reverse) keeps the authorization on file, but whether
      the care still needs it follows the new plan.
    eligibility: []

  - id: referral_active_duty_review
    subject: [referral_submit, referral_approve]
    rule: >-
      For an active duty service member every civilian specialty, therapy and inpatient request goes first
      to military clinic referral management where adsm_military_review_required is true, and for a TRICARE
      Prime Remote service member to the service point of contact where remote_adsm_service_review_required
      is true; the region approves only after that review. Active duty service members have no
      point-of-service option, so care they receive without the required authorization is referred to the
      military medical support office, not cost-shared.
    eligibility: []

  - id: referral_program_requirements
    subject: [referral_submit, referral_approve, referral_deny]
    rule: >-
      Program conditions are checked before medical necessity. The patient's age must be at least
      minimum_age_months; the request must document diagnosis_requirement; applied behavior analysis
      requests must include the outcome measures where outcome_measures_required is true and a plan with at
      least parent_training_sessions_required parent training sessions; home health requires homebound
      status where homebound_status_required is true; a skilled nursing facility admission requires a prior
      hospital stay of prior_hospital_stay_days consecutive days and admission within
      admission_within_days_of_discharge of discharge; durable medical equipment rented for
      capped_rental_months passes to the patient. A request that misses a program condition is denied as
      program_requirement_not_met.
    eligibility: []

  - id: referral_appeal_effectuation
    subject: [referral_approve_on_appeal]
    rule: >-
      A denied authorization is approved without a new review only when its reconsideration is decided
      overturned. The denial is approved on appeal only when a Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration case for this authorization is decided overturned.
      The approval takes the validity span and units the reconsideration decided, under
      referral_validity_and_units.
    eligibility:
      - id: reconsideration_overturned
        applies_to: [referral_approve_on_appeal]
        kind: authorization
        condition: The denial is approved on appeal only when a Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration case for this authorization is decided overturned.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.subject_referral_authorization_id, appeal_cases.status, appeal_cases.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.subject_referral_authorization_id]
          action_bindings:
            appeal_cases.subject_referral_authorization_id: referral_authorization_id
