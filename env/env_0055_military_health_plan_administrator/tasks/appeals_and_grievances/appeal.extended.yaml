        == 'per_admission_copay' else RND(MX(jr_daily_charge * jr_days, jr_minimum_charge), 2)))
    - jr_payment: 0.0 if jr_ohi_counted >= jr_claimed_allowed else RND(jr_base - jr_cost_share, 2)
