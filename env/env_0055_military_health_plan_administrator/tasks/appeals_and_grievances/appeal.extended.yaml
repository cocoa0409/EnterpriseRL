    - base_policy: appeal_filing_deadline
      superseded_clause: >-
        The case must be received no later than filing_deadline_days after the initial determination recorded on the
        subject record.
      replaced_by: >-
        A line joins in time when the day its record is received is no later than the joining line's posted date plus
