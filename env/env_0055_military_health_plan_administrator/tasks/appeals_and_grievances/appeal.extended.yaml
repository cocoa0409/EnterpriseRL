        Select claim ledger and the tier schedule of the Select enrollment the line was billed under
    compute:
    - fl_service_date: >-
        XLATEST('select', 'select_claim_lines', 'service_date', date_field='posted_date', select_claim_line_id=HID)
    - fl_claim: >-
        XLATEST('select', 'select_claim_lines', 'claim_number', date_field='posted_date', select_claim_line_id=HID)
    - fl_provider: >-
        XLATEST('select', 'select_claim_lines', 'provider_id', date_field='posted_date', select_claim_line_id=HID)
    - fl_service_class: >-
        XLATEST('select', 'select_claim_lines', 'service_class', date_field='posted_date', select_claim_line_id=HID)
    - fl_billed: >-
        XLATEST('select', 'select_claim_lines', 'billed_amount', date_field='posted_date', select_claim_line_id=HID)
    - fl_enrollment: >-
        XLATEST('select', 'select_claim_lines', 'select_enrollment_id', date_field='posted_date', select_claim_line_id=HID)
    - fl_network: >-
        XLATEST('select', 'select_claim_lines', 'provider_network_status', date_field='posted_date', select_claim_line_id=HID)
    - fl_ohi_line: >-
        XLATEST('select', 'select_claim_lines', 'ohi_paid_amount', date_field='posted_date', select_claim_line_id=HID)
    - fl_peer_count: >-
        XCOUNT('select', 'select_claim_lines', within_months=K('fl_peer_window_months'), date_field='posted_date',
        provider_id=fl_provider, service_class=fl_service_class, line_outcome='paid')
    - fl_peer_total: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', within_months=K('fl_peer_window_months'), date_field='posted_date',
        provider_id=fl_provider, service_class=fl_service_class, line_outcome='paid')
    - fl_peer_latest: >-
        XLATEST('select', 'select_claim_lines', 'allowed_amount', date_field='posted_date', provider_id=fl_provider,
        service_class=fl_service_class, line_outcome='paid')
    - fl_nonpar_limit: CPARAM('select', 'nonparticipating_balance_billing_limit_pct', select_enrollment_id=fl_enrollment)
    - fl_billed_basis: >-
        RND(fl_billed * 100 / (100 + fl_nonpar_limit), 2) if fl_network == 'non_network_nonparticipating' else fl_billed
    - fl_allowed: >-
        RND(fl_peer_total / fl_peer_count, 2) if fl_peer_count >= K('fl_peer_average_minimum') else (fl_peer_latest
        if fl_peer_count >= 1 else fl_billed_basis)
    - fl_nn_pct: CPARAM('select', 'non_network_outpatient_cost_share_pct', select_enrollment_id=fl_enrollment)
    - fl_nw_pct: CPARAM('select', 'network_outpatient_cost_share_pct', select_enrollment_id=fl_enrollment)
    - fl_pct: >-
        fl_nn_pct if fl_network != 'network' else (0 if fl_service_class == 'preventive_care' else fl_nw_pct)
    - fl_tier_basis: CPARAM('select', 'network_cost_share_basis', select_enrollment_id=fl_enrollment)
    - fl_class_copay: >-
        CPARAM('select', 'network_copay_preventive_care', select_enrollment_id=fl_enrollment) if fl_service_class
        == 'preventive_care' else (CPARAM('select', 'network_copay_primary_care_visit', select_enrollment_id=fl_enrollment)
        if fl_service_class == 'primary_care_visit' else (CPARAM('select', 'network_copay_specialty_care_visit', select_enrollment_id=fl_enrollment)
        if fl_service_class == 'specialty_care_visit' else (CPARAM('select', 'network_copay_urgent_care_visit', select_enrollment_id=fl_enrollment)
        if fl_service_class == 'urgent_care_visit' else (CPARAM('select', 'network_copay_emergency_room_visit', select_enrollment_id=fl_enrollment)
        if fl_service_class == 'emergency_room_visit' else (CPARAM('select', 'network_copay_ground_ambulance', select_enrollment_id=fl_enrollment)
        if fl_service_class == 'ground_ambulance' else (CPARAM('select', 'network_copay_outpatient_behavioral_health_individual',
        select_enrollment_id=fl_enrollment) if fl_service_class == 'outpatient_behavioral_health_individual' else
        (CPARAM('select', 'network_copay_outpatient_behavioral_health_group', select_enrollment_id=fl_enrollment)
        if fl_service_class == 'outpatient_behavioral_health_group' else (CPARAM('select', 'network_copay_rehabilitative_therapy_visit',
        select_enrollment_id=fl_enrollment) if fl_service_class == 'rehabilitative_therapy_visit' else (CPARAM('select',
        'network_copay_ambulatory_surgery', select_enrollment_id=fl_enrollment) if fl_service_class == 'ambulatory_surgery'
        else (-1))))))))))
    - fl_ohi_on_file: CFIELD('select', 'ohi_on_file', status='active') == True
    - fl_earlier_ohi: >-
        XMAX('select', 'select_claim_lines', 'ohi_paid_amount', claim_number=fl_claim, service_date=fl_service_date,
        event_type='select_claim_line_post')
    - fl_ohi_counted: >-
        fl_ohi_line if (fl_ohi_on_file and fl_ohi_line > 0) else (fl_earlier_ohi if (fl_ohi_on_file and fl_ohi_line
        == 0 and fl_earlier_ohi > 0) else 0.0)
    - fl_base: >-
        RND(fl_allowed - fl_ohi_counted, 2) if (fl_ohi_counted > 0 and fl_ohi_counted < fl_allowed) else fl_allowed
    - fl_cost_share: >-
        RND(MN(fl_class_copay, fl_base), 2) if (fl_network == 'network' and fl_tier_basis == 'fixed_copayment' and
        fl_service_class != 'preventive_care' and fl_class_copay >= 0) else RND(fl_base * fl_pct / 100, 2)
    - fl_payment: 0.0 if fl_ohi_counted >= fl_allowed else RND(fl_base - fl_cost_share, 2)
    - result: fl_payment
