    - jr_minimum_charge: CPARAM('select', 'inpatient_network_minimum_charge', select_enrollment_id=jr_enrollment)
    - jr_admission_copay: CPARAM('select', 'inpatient_network_admission_copay', select_enrollment_id=jr_enrollment)
    - jr_base: >-
