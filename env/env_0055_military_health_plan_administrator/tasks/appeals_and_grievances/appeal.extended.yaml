    trigger: on_request
    subject:
    - appeal_file
    computes: amount_in_dispute
    target_tool: join_select_line_reconsideration_711ff8e9
    params:
      jl_peer_window_months: 12
      jl_peer_average_minimum: 3
    rule: >-
      Further TRICARE Select postings of one claim still standing with the same late-filing denial as a line already
      under an open Claim Factual Reconsideration join that case one at a time, each keeping its own line reference.
      The case a posting joins is the patient's Claim Factual Reconsideration most recently filed among those still
      filed, or, where none is still filed, the one most recently filed among those under review; the amount that
      case already carries is the largest amount in dispute recorded on its records on the claim, since each joining
      record carries the running total; and the joining line is the claim's highest-numbered posting carrying the
      case line's denial. The amount recorded for a further line joining a reconsideration is fixed only after a Claim
      Factual Reconsideration stands filed or under review on an earlier line of the same claim carrying the same
      denial. A joining line is recorded under the Claim Factual Reconsideration it joins with the claim line itself
      as its subject, which is a kind of subject that tier hears. A line joins in time when the day its record is
      received is no later than the joining line's posted date plus the tier's filing deadline in calendar days, counted
      from the day after that posted date, a record received on the last of those days being in time. The amount in
      dispute recorded for a further late-filed line joining an open reconsideration is the amount the case carries
      once the line has joined it: the amount the case already carries plus the payment at issue on the joining line,
      rounded to the cent. The allowed amount at issue on the joining line is set from the provider's own paid lines
      for the patient: where the provider has three or more paid Select lines for the patient in the joining line's
      service class posted in the twelve months before the day the amount is figured, it is the average of their allowed
      amounts, rounded to the cent; where it has one or two such lines, it is the allowed amount of the provider's
      most recently posted paid line in that class for the patient; where it has none, it is the amount the provider
      billed on the joining line, which for a nonparticipating provider is first divided by one plus the tier's nonparticipating
      balance-billing limit so that nothing such a provider may bill above the allowed amount comes into dispute,
      rounded to the cent. The cost-share percentage on the joining line follows the provider's network status recorded
      on it and the schedule of the tier the joining line was billed under: from a non-network provider it is that
      tier's non-network outpatient percentage; a network line for preventive care carries none; any other network
      line carries that tier's network outpatient percentage, which is none on a tier that charges fixed network copayments.
      Under a tier that charges fixed network copayments, the cost share on the joining line, when it is a network
      line other than preventive care, is that tier's network copayment for its service class, never more than the
      amount the cost share is figured on. The other insurer's payment counted on the joining line is taken as follows:
      where other health insurance is on file for the patient and the joining line itself shows the other insurer's
      payment, that payment is counted; where other health insurance is on file, the joining line shows no such payment
      and an earlier posting of the same service date on the same claim shows one, the largest payment shown on the
      claim's postings of that service date is counted; in every other case no payment by another insurer is counted.
      The payment at issue on the joining line is figured by one of three methods: where the other insurer's payment
      counted is at least the allowed amount at issue, no payment is at issue; where a payment by another insurer
      below the allowed amount at issue is counted, the cost share is figured on the allowed amount at issue less
      that payment and the payment at issue is that net amount less the cost share; in every other case the cost share
      is figured on the allowed amount at issue itself and the payment at issue is the allowed amount at issue less
      the cost share; each amount is rounded to the cent. The payment at issue on the joining line is the TRICARE
      payment it would have carried had it been paid, and no beneficiary liability is at issue on a line denied for
      the provider's late filing. By default the allowed amount at issue on the joining line is the amount the provider
      billed on it, divided for a nonparticipating provider by one plus the tier's nonparticipating balance-billing
      limit, rounded to the cent. By default the cost share on the joining line is the network outpatient cost-share
      percentage of the tier the joining line was billed under applied to the allowed amount at issue, or under a
      tier that charges fixed network copayments that tier's network copayment for the service class, never more than
      the allowed amount at issue, and the payment at issue is the allowed amount at issue less that cost share; each
      amount is rounded to the cent.
    prerequisite:
    - problem: appeal_ext_late_filed_line_first_case
      kind: value_input
      gate: case_amount_so_far
      form: state
      policy_source: >-
        The amount recorded for a further line joining a reconsideration is fixed only after a Claim Factual Reconsideration
        stands filed or under review on an earlier line of the same claim carrying the same denial.
      condition: >-
        appeal_cases holds a Claim Factual Reconsideration with status filed or under_review whose subject_claim_number
        is the joining line's claim and whose subject_claim_line_id is an earlier posting of that claim with the same
        line_outcome
      resolved_by: file_select_line_reconsideration_8918facf
      effect: >-
        the open case record exists, so the case's claim, its line and its recorded amount in dispute, which the joining
        amount adds to, are present; without it the joining amount has no case to join
    cross_category: *id002
    compute:
    - case_claim_number: >-
        LATEST('appeal_cases', 'subject_claim_number', date_field='filing_date', status='filed', variant_name='Claim
        Factual Reconsideration') or LATEST('appeal_cases', 'subject_claim_number', date_field='filing_date', status='under_review',
        variant_name='Claim Factual Reconsideration')
    - case_line: >-
        LATEST('appeal_cases', 'subject_claim_line_id', date_field='filing_date', status='filed', variant_name='Claim
        Factual Reconsideration', subject_claim_number=case_claim_number) or LATEST('appeal_cases', 'subject_claim_line_id',
        date_field='filing_date', status='under_review', variant_name='Claim Factual Reconsideration', subject_claim_number=case_claim_number)
    - case_amount_so_far: >-
        MX(MAX('appeal_cases', 'amount_in_dispute', status='filed', variant_name='Claim Factual Reconsideration',
        subject_claim_number=case_claim_number), MAX('appeal_cases', 'amount_in_dispute', status='under_review', variant_name='Claim
        Factual Reconsideration', subject_claim_number=case_claim_number))
    - case_line_outcome: >-
        XLATEST('select', 'select_claim_lines', 'line_outcome', date_field='posted_date', select_claim_line_id=case_line)
    - joining_line: >-
        XLATEST('select', 'select_claim_lines', 'select_claim_line_id', date_field='line_number', claim_number=case_claim_number,
        line_outcome=case_line_outcome, event_type='select_claim_line_post')
    - jl_service_date: >-
        XLATEST('select', 'select_claim_lines', 'service_date', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_claim: >-
        XLATEST('select', 'select_claim_lines', 'claim_number', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_provider: >-
        XLATEST('select', 'select_claim_lines', 'provider_id', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_service_class: >-
        XLATEST('select', 'select_claim_lines', 'service_class', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_billed: >-
        XLATEST('select', 'select_claim_lines', 'billed_amount', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_enrollment: >-
        XLATEST('select', 'select_claim_lines', 'select_enrollment_id', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_network: >-
        XLATEST('select', 'select_claim_lines', 'provider_network_status', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_ohi_line: >-
        XLATEST('select', 'select_claim_lines', 'ohi_paid_amount', date_field='posted_date', select_claim_line_id=joining_line)
    - jl_peer_count: >-
        XCOUNT('select', 'select_claim_lines', within_months=K('jl_peer_window_months'), date_field='posted_date',
        provider_id=jl_provider, service_class=jl_service_class, line_outcome='paid')
    - jl_peer_total: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', within_months=K('jl_peer_window_months'), date_field='posted_date',
        provider_id=jl_provider, service_class=jl_service_class, line_outcome='paid')
    - jl_peer_latest: >-
        XLATEST('select', 'select_claim_lines', 'allowed_amount', date_field='posted_date', provider_id=jl_provider,
        service_class=jl_service_class, line_outcome='paid')
    - jl_nonpar_limit: CPARAM('select', 'nonparticipating_balance_billing_limit_pct', select_enrollment_id=jl_enrollment)
    - jl_billed_basis: >-
        RND(jl_billed * 100 / (100 + jl_nonpar_limit), 2) if jl_network == 'non_network_nonparticipating' else jl_billed
    - jl_allowed: >-
        RND(jl_peer_total / jl_peer_count, 2) if jl_peer_count >= K('jl_peer_average_minimum') else (jl_peer_latest
        if jl_peer_count >= 1 else jl_billed_basis)
    - jl_nn_pct: CPARAM('select', 'non_network_outpatient_cost_share_pct', select_enrollment_id=jl_enrollment)
    - jl_nw_pct: CPARAM('select', 'network_outpatient_cost_share_pct', select_enrollment_id=jl_enrollment)
    - jl_pct: >-
        jl_nn_pct if jl_network != 'network' else (0 if jl_service_class == 'preventive_care' else jl_nw_pct)
    - jl_tier_basis: CPARAM('select', 'network_cost_share_basis', select_enrollment_id=jl_enrollment)
    - jl_class_copay: >-
        CPARAM('select', 'network_copay_preventive_care', select_enrollment_id=jl_enrollment) if jl_service_class
        == 'preventive_care' else (CPARAM('select', 'network_copay_primary_care_visit', select_enrollment_id=jl_enrollment)
        if jl_service_class == 'primary_care_visit' else (CPARAM('select', 'network_copay_specialty_care_visit', select_enrollment_id=jl_enrollment)
        if jl_service_class == 'specialty_care_visit' else (CPARAM('select', 'network_copay_urgent_care_visit', select_enrollment_id=jl_enrollment)
        if jl_service_class == 'urgent_care_visit' else (CPARAM('select', 'network_copay_emergency_room_visit', select_enrollment_id=jl_enrollment)
        if jl_service_class == 'emergency_room_visit' else (CPARAM('select', 'network_copay_ground_ambulance', select_enrollment_id=jl_enrollment)
        if jl_service_class == 'ground_ambulance' else (CPARAM('select', 'network_copay_outpatient_behavioral_health_individual',
        select_enrollment_id=jl_enrollment) if jl_service_class == 'outpatient_behavioral_health_individual' else
        (CPARAM('select', 'network_copay_outpatient_behavioral_health_group', select_enrollment_id=jl_enrollment)
        if jl_service_class == 'outpatient_behavioral_health_group' else (CPARAM('select', 'network_copay_rehabilitative_therapy_visit',
        select_enrollment_id=jl_enrollment) if jl_service_class == 'rehabilitative_therapy_visit' else (CPARAM('select',
        'network_copay_ambulatory_surgery', select_enrollment_id=jl_enrollment) if jl_service_class == 'ambulatory_surgery'
        else (-1))))))))))
    - jl_ohi_on_file: CFIELD('select', 'ohi_on_file', status='active') == True
    - jl_earlier_ohi: >-
        XMAX('select', 'select_claim_lines', 'ohi_paid_amount', claim_number=jl_claim, service_date=jl_service_date,
        event_type='select_claim_line_post')
    - jl_ohi_counted: >-
        jl_ohi_line if (jl_ohi_on_file and jl_ohi_line > 0) else (jl_earlier_ohi if (jl_ohi_on_file and jl_ohi_line
        == 0 and jl_earlier_ohi > 0) else 0.0)
    - jl_base: >-
        RND(jl_allowed - jl_ohi_counted, 2) if (jl_ohi_counted > 0 and jl_ohi_counted < jl_allowed) else jl_allowed
    - jl_cost_share: >-
        RND(MN(jl_class_copay, jl_base), 2) if (jl_network == 'network' and jl_tier_basis == 'fixed_copayment' and
        jl_service_class != 'preventive_care' and jl_class_copay >= 0) else RND(jl_base * jl_pct / 100, 2)
    - jl_payment: 0.0 if jl_ohi_counted >= jl_allowed else RND(jl_base - jl_cost_share, 2)
    - result: RND(case_amount_so_far + jl_payment, 2)
