        A line joins in time when the day its record is received is no later than the joining line's posted date plus
        the tier's filing deadline in calendar days, counted from the day after that posted date, a record received
        on the last of those days being in time.
    - base_policy: appeal_amount_in_dispute
      superseded_clause: for a claim line, the TRICARE payment denied plus the beneficiary liability at issue on the
        line
      replaced_by: >-
        The amount in dispute recorded for a further late-filed line joining an open reconsideration is the amount
