    - jr_basis: jr_nn_basis if jr_network != 'network' else jr_nw_basis
    - jr_daily_charge: >-
        CPARAM('select', 'inpatient_non_network_daily_charge', select_enrollment_id=jr_enrollment) if jr_network !=
