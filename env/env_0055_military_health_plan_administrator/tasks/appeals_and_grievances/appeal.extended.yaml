    factors:
    - id: fl_allowed_source
      effect: method
      decides: fl_allowed
      bindings:
      - fl_billed
      - fl_peer_count
      - fl_peer_total
      - fl_peer_latest
      - fl_nonpar_limit
      - fl_billed_basis
      - fl_allowed
      ladder:
      - when: >-
          the provider has three or more paid Select lines for the patient in the line opening a case's service class
          posted in the last twelve months
        method: >-
          the allowed amount at issue on the line opening a case is the average of those lines' allowed amounts
      - when: the provider has one or two such paid lines
        method: >-
          the allowed amount at issue on the line opening a case is the allowed amount of the provider's most recently
          posted paid line in that class
      - when: otherwise
        method: >-
          the allowed amount at issue on the line opening a case is the billed amount, divided for a nonparticipating
          provider by one plus the balance-billing limit
      baseline:
        fl_allowed: fl_billed_basis
      evidence:
      - history
      cross_difficulty: select
    - id: fl_cost_share_percentage
      effect: parameter
      decides: fl_pct
      bindings:
      - fl_network
      - fl_nn_pct
      - fl_nw_pct
      - fl_pct
      ladder:
      - when: the provider is recorded on the line opening a case as non-network
        value: >-
          the non-network outpatient cost-share percentage of the tier the line opening a case was billed under
      - when: >-
          the provider is recorded on the line opening a case as network and the line opening a case is preventive
          care
        value: no percentage (0)
      - when: otherwise
        value: the network outpatient cost-share percentage of the tier the line opening a case was billed under
      baseline:
        fl_pct: fl_nw_pct
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: fl_other_insurer_payment
      effect: parameter
      decides: fl_ohi_counted
      bindings:
      - fl_ohi_on_file
      - fl_ohi_line
      - fl_earlier_ohi
      - fl_ohi_counted
      ladder:
      - when: >-
          other health insurance is on file for the patient and the line opening a case shows the other insurer's
          payment
        value: the payment shown on the line opening a case
      - when: >-
          other health insurance is on file, the line opening a case shows no such payment and an earlier posting
          of the same service date on the same claim shows one
        value: the largest other-insurer payment shown on the claim's postings of that service date
      - when: otherwise
        value: no other-insurer payment (0.00)
      baseline:
        fl_ohi_counted: '0.0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: fl_payment_method
      effect: method
      decides: fl_payment
      bindings:
      - fl_enrollment
      - fl_base
      - fl_payment
      ladder:
      - when: the other insurer's payment counted is at least the allowed amount at issue
        method: no payment is at issue
      - when: a counted other-insurer payment is below the allowed amount at issue
        method: >-
          the cost share is figured on the allowed amount less the counted payment and the payment at issue is that
          net amount less the cost share
      - when: otherwise
        method: >-
          the cost share is figured on the allowed amount itself and the payment at issue is the allowed amount less
          the cost share
      baseline:
        fl_base: fl_allowed
        fl_payment: RND(fl_allowed - fl_cost_share, 2)
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    baseline:
      rule: >-
        The amount in dispute on a case opened on a TRICARE Select claim line denied because the claim reached the
        region after the filing deadline is the TRICARE payment the line would have carried had it been paid; the
        beneficiary owes the provider nothing on a line denied for the provider's late filing, so no beneficiary liability
        is at issue on it. By default the allowed amount at issue on the line opening a case is the amount the provider
        billed on it, divided for a nonparticipating provider by one plus the tier's nonparticipating balance-billing
        limit, rounded to the cent. By default the cost share on the line opening a case is the network outpatient
