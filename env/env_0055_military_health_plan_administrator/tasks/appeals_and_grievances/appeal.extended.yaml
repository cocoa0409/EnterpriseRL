    - jr_ref_days: >-
        XSUM('select', 'select_claim_lines', 'inpatient_days', service_date=jr_ref_admission, provider_id=jr_provider,
        line_outcome='paid')
    - jr_ref_recent: jr_ref_days > 0 and 0 <= MONTHS(jr_ref_admission, jr_service_date) < K('jr_reference_window_months')
    - jr_claimed_rate: >-
        RND(jr_ref_allowed / jr_ref_days, 2) if jr_ref_recent else (jr_billed_rate if (not jr_ref_recent and jr_billed_rate
        > jr_paid_rate) else jr_paid_rate)
    - jr_claimed_allowed: RND(jr_claimed_rate * jr_days, 2)
    - jr_ohi_on_file: CFIELD('select', 'ohi_on_file', status='active') == True
    - jr_earlier_ohi: >-
        XMAX('select', 'select_claim_lines', 'ohi_paid_amount', claim_number=jr_claim, service_date=jr_service_date,
        event_type='select_claim_line_post')
    - jr_ohi_counted: >-
        jr_ohi_line if (jr_ohi_on_file and jr_ohi_line > 0) else (jr_earlier_ohi if (jr_ohi_on_file and jr_ohi_line
        == 0 and jr_earlier_ohi > 0) else 0.0)
    - jr_nn_basis: CPARAM('select', 'inpatient_non_network_basis', select_enrollment_id=jr_enrollment)
    - jr_nw_basis: CPARAM('select', 'inpatient_network_basis', select_enrollment_id=jr_enrollment)
    - jr_nn_pct: CPARAM('select', 'inpatient_non_network_pct', select_enrollment_id=jr_enrollment)
    - jr_nw_pct: CPARAM('select', 'inpatient_network_pct_of_allowed', select_enrollment_id=jr_enrollment)
    - jr_pct: >-
