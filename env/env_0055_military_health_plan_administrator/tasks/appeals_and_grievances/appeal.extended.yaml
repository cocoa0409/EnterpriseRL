# Appeals and grievances charter for the Westbridge Military Health Services regional contract (TRICARE West Region).
# One holding = one appeal, review or grievance case opened for one beneficiary against one initial determination
# (a claim line, an authorization denial, a nonpayment disenrollment or termination, an allowed amount) or one
# service complaint. Overturned decisions are effectuated in the category that owns the determination.

category: appeal
display_name: Appeals and Grievances

binding:
  holding_table: appeal_cases
  event_tables: [appeal_case_documents]
  intake_tables: [appeal_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [filed, under_review, decided_upheld, decided_overturned, decided_partially_overturned, dismissed, withdrawn, escalated]
  transitions:
    - {from: filed, to: under_review, by: agent, means: The case is acknowledged and assigned to a reviewer.}
    - {from: filed, to: dismissed, by: agent, means: The case cannot be reviewed - filed late without good cause, about a matter that is not appealable at this level, or by someone without standing.}
    - {from: under_review, to: dismissed, by: agent, means: A third-party filing is dismissed because the appointment of representative never arrived within the window.}
    - {from: under_review, to: decided_upheld, by: agent, means: The reviewer upholds the initial determination in full.}
    - {from: under_review, to: decided_overturned, by: agent, means: The reviewer reverses the initial determination in full and the decision is effectuated in the owning category.}
    - {from: under_review, to: decided_partially_overturned, by: agent, means: The reviewer reverses part of the initial determination (some lines, some units or part of the amount) and that part is effectuated.}
    - {from: filed, to: withdrawn, by: user, means: The appellant confirms withdrawing the case before review starts.}
    - {from: under_review, to: withdrawn, by: user, means: The appellant confirms withdrawing the case before a decision.}
    - {from: decided_upheld, to: escalated, by: user, means: The appellant asks for the next appeal level and the case file is forwarded to it.}
    - {from: decided_partially_overturned, to: escalated, by: user, means: The appellant asks for the next appeal level on the part still denied and the case file is forwarded to it.}

accounts: []

parameter_schema:
  appealable_subject_kinds: list of subject_kind values a case of this tier may be opened on
  non_appealable_issues: list of matters that cannot be decided by this tier and are dismissed as not appealable
  filing_deadline_days: integer, calendar days after the initial determination date within which the case must be received
  filing_deadline_anchor: string - the record date the filing deadline is counted from
  deadline_measured_by: string - which date of the filing is compared with the deadline
  late_filing_good_cause_allowed: boolean - whether a late filing is accepted when good cause for the delay is documented
  good_cause_examples: list of documented circumstances accepted as good cause for a late filing or for nonpayment
  oral_filing_accepted: boolean - whether the case may be opened by telephone rather than in writing
  who_may_file: list of filed_by values that have standing for this tier
  representative_appointment_required: boolean - whether a filing by someone other than the beneficiary needs an appointment of representative on file
  representative_form_window_days: integer, calendar days after filing within which a missing appointment of representative must arrive (0 = not applicable)
  participating_provider_may_file: boolean - whether a participating provider may file in its own right
  required_documents: list of document_kind values that must be on file before a decision
  additional_records_window_days: integer, calendar days the appellant has to send records once the reviewer asks for them
  acknowledgment_business_days: integer, business days after receipt within which the case is acknowledged
  decision_deadline: integer, the time limit for the decision counted in decision_deadline_unit from receipt
  decision_deadline_unit: string - calendar_days, business_days or hours
  independent_reviewer_required: boolean - whether the reviewer must not have taken part in the initial determination
  physician_reviewer_required: boolean - whether a physician of the same or similar specialty must decide
  expedited_criteria: string - when the case runs on the expedited track (not_applicable where the tier has none)
  effectuation_days: integer, calendar days after an overturned or partially overturned decision within which it is effectuated
  effectuation_action: string - what effectuating an overturned decision does in the owning category
  decision_outcomes_available: list of outcomes the tier can reach
  collection_suspended_during_review: boolean - whether collection of the disputed beneficiary amount is suspended while the case is open
  withdrawal_allowed: boolean - whether the appellant may withdraw before a decision
  refiling_after_withdrawal: string - whether and until when a withdrawn case may be filed again
  one_open_case_per_subject: boolean - whether a second case on the same subject is refused while one is open
  lines_per_case_rule: string - how several lines or items of one determination are grouped into one case
  amount_in_dispute_basis: string - how amount_in_dispute is figured
  next_level_name: string - the next appeal level (none where the tier is final)
  next_level_body: string - who decides the next level
  next_level_filing_deadline_days: integer, calendar days after this tier's decision date within which the next level must be asked for (0 = no next level)
  next_level_min_amount_in_dispute: USD, least amount in dispute that gives a right to the next level (0.00 = no minimum or no next level)
  hearing_min_amount_in_dispute: USD, least amount in dispute that gives a right to a hearing after the next level (0.00 = no hearing right)
  case_file_forwarding_days: integer, calendar days after an escalation request within which the case file is forwarded (0 = not applicable)
  escalation_requires_appellant_request: boolean - whether only the appellant's own request moves the case up a level
  past_due_payment_required: boolean - whether every past-due fee or premium must be paid before a favorable decision is effectuated
  quality_of_care_referral: boolean - whether the case is also referred to clinical quality management
  filing_fee: USD charged to file the case
  reconsideration_level: integer, appeal level of the tier (0 = review or grievance outside the appeal levels, 1 = first level)
  review_basis: string - what the reviewer re-examines
  decision_letter_includes_next_level_rights: boolean - whether the decision letter states the next-level rights and deadline
  dismissal_reasons_available: list of dismissal_reason values the tier can use
  expedited_track_available: boolean - whether the tier has an expedited track
  standard_to_expedited_conversion: boolean - whether a standard case may be moved to the expedited track when the criteria are met
  expedited_to_standard_conversion: boolean - whether an expedited request that does not meet the criteria continues on the standard track
  status_inquiry_channel: string - where the appellant can follow the case
  subject_record_lock: boolean - whether the subject record is held from further routine adjustment while the case is open
  decision_effective_date_rule: string - the date the effect of a favorable decision runs from

