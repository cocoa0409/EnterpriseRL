          of a daily charge and a percentage
        value: the tier's network inpatient percentage
      - when: otherwise
        value: no percentage (0)
      baseline:
        jr_pct: '0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: jr_cost_share_basis
      effect: method
      decides: jr_cost_share
      bindings:
      - jr_nn_basis
      - jr_nw_basis
      - jr_basis
      - jr_daily_charge
      - jr_minimum_charge
      - jr_admission_copay
      - jr_cost_share
      ladder:
      - when: >-
          the tier's inpatient basis for a facility of that network status is a percentage of the allowed amount
        method: the cost share is the cost-share percentage of the amount it is figured on
      - when: that basis is the lesser of a daily charge and a percentage
        method: >-
          the cost share is the smaller of the daily inpatient charge for each day and the cost-share percentage of
          the amount it is figured on
      - when: that basis is a per-admission copayment
        method: the cost share is the tier's admission copayment
      - when: otherwise
        method: >-
          the cost share is the daily inpatient charge for each day, never less than the minimum inpatient charge
      baseline:
        jr_cost_share: RND(MX(jr_daily_charge * jr_days, jr_minimum_charge), 2)
      evidence:
      - cross_category
      cross_difficulty: select
    - id: jr_claimed_rate_source
      effect: parameter
      decides: jr_claimed_rate
      bindings:
      - jr_billed
      - jr_nonpar_limit
      - jr_billed_rate
      - jr_ref_auth
      - jr_ref_admission
      - jr_ref_allowed
      - jr_ref_days
      - jr_ref_recent
      - jr_claimed_rate
      ladder:
      - when: >-
          a paid admission of the patient at the same facility under an earlier, since-expired inpatient mental health
          authorization began within the twelve months before the service date of the joining line
        value: that admission's allowed amount divided by its covered days
      - when: >-
          there is no such admission and the billed daily amount of the joining line, divided further for a nonparticipating
          facility by one plus the balance-billing limit, exceeds its paid daily rate
        value: that billed daily amount
      - when: otherwise
        value: the paid daily rate of the joining line
      baseline:
        jr_claimed_rate: jr_paid_rate
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: jr_other_insurer_payment
      effect: parameter
      decides: jr_ohi_counted
      bindings:
      - jr_ohi_on_file
      - jr_earlier_ohi
      - jr_ohi_counted
      ladder:
      - when: >-
          other health insurance is on file for the patient and the joining line shows the other insurer's payment
        value: the payment shown on the joining line
      - when: >-
          other health insurance is on file, the joining line shows no such payment and an earlier posting of the
          same service date on the same claim shows one
        value: the largest other-insurer payment shown on the claim's postings of that service date
      - when: otherwise
        value: no other-insurer payment (0.00)
      baseline:
        jr_ohi_counted: '0.0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: jr_payment_method
      effect: method
      decides: jr_payment
      bindings:
      - jr_enrollment
      - jr_base
      - jr_payment
      ladder:
      - when: the other insurer's payment counted is at least the allowed amount
        method: no payment would be made
      - when: a counted other-insurer payment is below the allowed amount
        method: >-
          the cost share is figured on the allowed amount less the counted payment and the payment is that net amount
          less the cost share
      - when: otherwise
        method: >-
          the cost share is figured on the allowed amount itself and the payment is the allowed amount less the cost
          share
      baseline:
        jr_base: jr_claimed_allowed
        jr_payment: RND(jr_claimed_allowed - jr_cost_share, 2)
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    baseline:
      rule: >-
        The amount in dispute recorded for a further paid line joining an Allowable Charge Review is the amount the
        review carries once the line has joined it: the amount the review already carries plus the payment difference
        on the joining line, rounded to the cent. The payment difference on the joining line is the TRICARE payment
        it would carry at the allowed amount claimed, less the TRICARE payment the line shows, never below zero and
        rounded to the cent. The allowed amount claimed on the joining line is its covered days at its paid daily
        rate, the paid daily rate being its allowed amount divided by its covered days and rounded to the cent. The
        payment the joining line would carry at the allowed amount claimed is that allowed amount less the cost share
        figured on it, the cost share being the daily inpatient charge of the tier for each covered day, never less
        than the tier's minimum inpatient charge.
      params: []
    inputs: *id009
  - id: appeal_ext_stay_reconsideration_second_level
    base_policy_refs:
    - appeal_next_level
    - appeal_amount_in_dispute
    overwrite:
    - base_policy: appeal_amount_in_dispute
      superseded_clause: for an authorization, the allowed amount of the services requested as estimated on the request
      replaced_by: >-
        For an inpatient mental health authorization, the amount in dispute carried to the next level is the TRICARE
        payment the days still at issue would carry, figured from the stay's records.
    trigger: on_request
    subject:
    - appeal_escalate
    computes: amount_in_dispute
    target_tool: request_second_level_reconsideration_e1311ea5
    params:
      sl_reference_window_months: 12
    rule: >-
      When the appellant asks for a second-level reconsideration of a decided Medical Necessity Reconsideration of
      an inpatient mental health authorization, the amount in dispute booked on the case is the amount carried to
      the second level, figured on the day the request is made. For an inpatient mental health authorization, the
      amount in dispute carried to the next level is the TRICARE payment the days still at issue would carry, figured
      from the stay's records. Where the stay's paid daily rate falls below the facility's daily rate on the patient's
      admission of the past twelve months, the amount carried to the second level is not priced until the highest-numbered
      paid day line of the stay's claim stands joined to an Allowable Charge Review opened on an earlier paid line
      of that claim. The case whose request is carried is the patient's Medical Necessity Reconsideration most recently
      decided, and the stay is the admission under the authorization that case concerns. The amount carried to the
      second level on a decided Medical Necessity Reconsideration of an inpatient mental health authorization is the
      TRICARE payment the days the case still covers would carry, rounded to the cent. The days still covered are
      the days the request asked for that the authorization did not grant when it was decided. Those days are valued
      at the stay's paid allowed amount per paid covered day, rounded to the cent, with no payment by another insurer
      counted. The cost share on them is the tier's daily inpatient charge for each day, never less than the tier's
      minimum inpatient charge, and the payment is their allowed amount less that cost share, rounded to the cent.
      The days the case still covers are counted from its decision and the authorization's unit ledger: where the
      case was decided partially overturned, they are the days requested less the days the authorization granted when
      first decided and less the days granted on appeal; where the case was decided upheld and extensions were granted
      on the authorization, they are the days requested less the days first granted and less the extension days granted;
      in every other case they are the days requested less the days first granted. These amounts are figured only
      for a stay that already has at least one paid day line; a stay with no paid day line has no daily allowed amount
      on record and is outside this rule. The daily allowed amount used to value the days carried is set as follows:
      where the highest-numbered paid day line of the stay's claim stands joined to an Allowable Charge Review opened
      on an earlier paid line of that claim, and the patient had a paid admission at the same facility under an earlier
      inpatient mental health authorization that has since expired and began within the twelve months before the stay's
      admission, it is that earlier admission's allowed amount divided by its covered days; where that joined review
      stands and there is no such admission, it is the higher of the stay's paid daily rate and the stay's billed
      amount per paid covered day, the latter divided for a nonparticipating facility by one plus the tier's nonparticipating
      balance-billing limit; in every other case it is the stay's paid allowed amount divided by its paid covered
      days; each is rounded to the cent. The other insurer's daily payment used for the days carried is taken as follows:
      where other health insurance is on file for the patient and the stay's paid day lines show the other insurer's
      payments, it is their total divided by the stay's paid covered days; where other health insurance is on file,
      the stay's lines show none and the earlier admission's lines show one, it is that admission's other-insurer
      total divided by its covered days; in every other case it is zero; each is rounded to the cent. The cost-share
      percentage on the days carried follows the facility's network status recorded on the stay's lines and the inpatient
      schedule of the tier the stay is billed under: a non-network facility under a tier whose non-network inpatient
      basis takes a percentage of the allowed amount carries that tier's non-network inpatient percentage; a network
      facility under a tier whose network inpatient basis is the lesser of a daily charge and a percentage carries
      that tier's network inpatient percentage; any other carries no percentage. The cost share on the days carried
      is figured by the tier's inpatient basis for a facility of that network status: under a percentage-of-allowed
      basis it is the cost-share percentage of the amount it is figured on; under a lesser-of basis it is the smaller
      of the daily inpatient charge for each day and the cost-share percentage of the amount it is figured on; under
      a per-admission basis it is the tier's admission copayment; under any other basis it is the daily inpatient
      charge for each day, never less than the tier's minimum inpatient charge; it is rounded to the cent. The payment
      the days carried would carry is figured by one of three methods: where the other insurer's payment counted is
      at least the allowed amount, no payment would be made; where a payment by another insurer below the allowed
      amount is counted, the cost share is figured on the allowed amount less that payment and the payment is that
      net amount less the cost share, rounded to the cent; in every other case the cost share is figured on the allowed
      amount itself and the payment is the allowed amount less the cost share, rounded to the cent.
    prerequisite:
    - problem: appeal_ext_stay_charge_review_joining
      kind: value_input
      gate: sl_daily_allowed
      form: state
      policy_source: >-
        Where the stay's paid daily rate falls below the facility's daily rate on the patient's admission of the past
        twelve months, the amount carried to the second level is not priced until the highest-numbered paid day line
        of the stay's claim stands joined to an Allowable Charge Review opened on an earlier paid line of that claim.
      condition: >-
        appeal_cases holds a filed Allowable Charge Review record on the highest line_number paid line of the stay's
        claim and another filed Allowable Charge Review record on an earlier paid line of that claim
      resolved_by: join_line_charge_review_4bed256c
      effect: >-
        once the stay's last paid day line stands joined to the review opened on an earlier line, the daily allowed
        amount used for the days carried becomes the earlier admission's rate
    cross_category: *id008
    compute:
    - sl_case_status: >-
        LATEST('appeal_cases', 'status', date_field='decision_date', variant_name='Medical Necessity Reconsideration')
    - sl_auth: >-
        LATEST('appeal_cases', 'subject_referral_authorization_id', date_field='decision_date', variant_name='Medical
        Necessity Reconsideration')
    - sl_requested: CFIELD('referral', 'units_requested', referral_authorization_id=sl_auth)
    - sl_authorized: CFIELD('referral', 'units_authorized', referral_authorization_id=sl_auth)
    - sl_admission: CFIELD('referral', 'valid_from', referral_authorization_id=sl_auth)
    - sl_facility: CFIELD('referral', 'servicing_provider_id', referral_authorization_id=sl_auth)
    - sl_appeal_granted: >-
        XSUM('referral', 'referral_unit_ledger', 'units', referral_authorization_id=sl_auth, event_type='referral_units_grant',
        grant_basis='appeal_overturn')
    - sl_extension_granted: >-
        XSUM('referral', 'referral_unit_ledger', 'units', referral_authorization_id=sl_auth, event_type='referral_units_extend')
    - sl_days: >-
        MX(0, sl_requested - sl_authorized - sl_appeal_granted) if sl_case_status == 'decided_partially_overturned'
        else (MX(0, sl_requested - sl_authorized - sl_extension_granted) if (sl_case_status == 'decided_upheld' and
        sl_extension_granted > 0) else MX(0, sl_requested - sl_authorized))
    - sl_stay_allowed: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', service_date=sl_admission, provider_id=sl_facility,
        line_outcome='paid')
    - sl_stay_days: >-
        XSUM('select', 'select_claim_lines', 'inpatient_days', service_date=sl_admission, provider_id=sl_facility,
        line_outcome='paid')
    - sl_stay_ohi: >-
        XSUM('select', 'select_claim_lines', 'ohi_paid_amount', service_date=sl_admission, provider_id=sl_facility,
        line_outcome='paid')
    - sl_stay_billed: >-
        XSUM('select', 'select_claim_lines', 'billed_amount', service_date=sl_admission, provider_id=sl_facility,
        line_outcome='paid')
    - sl_stay_claim: >-
        XLATEST('select', 'select_claim_lines', 'claim_number', date_field='posted_date', service_date=sl_admission,
        provider_id=sl_facility, line_outcome='paid')
    - sl_stay_enrollment: >-
        XLATEST('select', 'select_claim_lines', 'select_enrollment_id', date_field='posted_date', service_date=sl_admission,
        provider_id=sl_facility, line_outcome='paid')
    - sl_stay_network: >-
        XLATEST('select', 'select_claim_lines', 'provider_network_status', date_field='posted_date', service_date=sl_admission,
        provider_id=sl_facility, line_outcome='paid')
    - sl_high_line: >-
        XLATEST('select', 'select_claim_lines', 'select_claim_line_id', date_field='line_number', claim_number=sl_stay_claim,
        line_outcome='paid')
    - sl_reviews_on_high_line: >-
        COUNT('appeal_cases', variant_name='Allowable Charge Review', status='filed', subject_claim_line_id=sl_high_line)
    - sl_reviews_on_claim: >-
        COUNT('appeal_cases', variant_name='Allowable Charge Review', status='filed', subject_claim_number=sl_stay_claim)
    - sl_joined_review: sl_reviews_on_high_line >= 1 and sl_reviews_on_claim >= 2
    - sl_ref_auth: >-
        XLATEST('referral', 'referral_authorizations', 'referral_authorization_id', date_field='valid_from', variant_name='Inpatient
        Mental Health Authorization', status='expired', servicing_provider_id=sl_facility)
    - sl_ref_admission: CFIELD('referral', 'valid_from', referral_authorization_id=sl_ref_auth)
    - sl_ref_allowed: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', service_date=sl_ref_admission, provider_id=sl_facility,
        line_outcome='paid')
    - sl_ref_days: >-
        XSUM('select', 'select_claim_lines', 'inpatient_days', service_date=sl_ref_admission, provider_id=sl_facility,
        line_outcome='paid')
    - sl_ref_ohi: >-
        XSUM('select', 'select_claim_lines', 'ohi_paid_amount', service_date=sl_ref_admission, provider_id=sl_facility,
        line_outcome='paid')
    - sl_ref_recent: sl_ref_days > 0 and 0 <= MONTHS(sl_ref_admission, sl_admission) < K('sl_reference_window_months')
    - sl_nonpar_limit: >-
        CPARAM('select', 'nonparticipating_balance_billing_limit_pct', select_enrollment_id=sl_stay_enrollment)
    - sl_paid_rate: RND(sl_stay_allowed / MX(sl_stay_days, 1), 2)
    - sl_billed_rate: >-
        RND(sl_stay_billed / MX(sl_stay_days, 1) * 100 / (100 + sl_nonpar_limit), 2) if sl_stay_network == 'non_network_nonparticipating'
        else RND(sl_stay_billed / MX(sl_stay_days, 1), 2)
    - sl_daily_allowed: >-
        RND(sl_ref_allowed / sl_ref_days, 2) if (sl_joined_review and sl_ref_recent) else (MX(sl_paid_rate, sl_billed_rate)
        if (sl_joined_review and not sl_ref_recent) else sl_paid_rate)
    - sl_ohi_on_file: CFIELD('select', 'ohi_on_file', status='active') == True
    - sl_daily_ohi: >-
        RND(sl_stay_ohi / MX(sl_stay_days, 1), 2) if (sl_ohi_on_file and sl_stay_ohi > 0) else (RND(sl_ref_ohi / sl_ref_days,
        2) if (sl_ohi_on_file and sl_stay_ohi == 0 and sl_ref_ohi > 0) else 0.0)
    - sl_allowed_total: RND(sl_daily_allowed * sl_days, 2)
    - sl_ohi_total: RND(sl_daily_ohi * sl_days, 2)
    - sl_nn_basis: CPARAM('select', 'inpatient_non_network_basis', select_enrollment_id=sl_stay_enrollment)
    - sl_nw_basis: CPARAM('select', 'inpatient_network_basis', select_enrollment_id=sl_stay_enrollment)
    - sl_nn_pct: CPARAM('select', 'inpatient_non_network_pct', select_enrollment_id=sl_stay_enrollment)
    - sl_nw_pct: CPARAM('select', 'inpatient_network_pct_of_allowed', select_enrollment_id=sl_stay_enrollment)
    - sl_pct: >-
        sl_nn_pct if (sl_stay_network != 'network' and (sl_nn_basis == 'percent_of_allowed' or sl_nn_basis == 'lesser_of_per_diem_or_pct'))
        else (sl_nw_pct if (sl_stay_network == 'network' and sl_nw_basis == 'lesser_of_per_diem_or_pct') else 0)
    - sl_basis: sl_nn_basis if sl_stay_network != 'network' else sl_nw_basis
    - sl_daily_charge: >-
        CPARAM('select', 'inpatient_non_network_daily_charge', select_enrollment_id=sl_stay_enrollment) if sl_stay_network
        != 'network' else CPARAM('select', 'inpatient_network_daily_charge', select_enrollment_id=sl_stay_enrollment)
    - sl_minimum_charge: CPARAM('select', 'inpatient_network_minimum_charge', select_enrollment_id=sl_stay_enrollment)
    - sl_admission_copay: CPARAM('select', 'inpatient_network_admission_copay', select_enrollment_id=sl_stay_enrollment)
    - sl_base: >-
        RND(sl_allowed_total - sl_ohi_total, 2) if (sl_ohi_total > 0 and sl_ohi_total < sl_allowed_total) else sl_allowed_total
    - sl_cost_share: >-
        RND(sl_pct * sl_base / 100, 2) if sl_basis == 'percent_of_allowed' else (RND(MN(sl_daily_charge * sl_days,
        sl_pct * sl_base / 100), 2) if sl_basis == 'lesser_of_per_diem_or_pct' else (sl_admission_copay if sl_basis
        == 'per_admission_copay' else RND(MX(sl_daily_charge * sl_days, sl_minimum_charge), 2)))
    - sl_payment: 0.0 if sl_ohi_total >= sl_allowed_total else RND(sl_base - sl_cost_share, 2)
    - result: sl_payment
