        A further paid TRICARE Select inpatient line of a claim joins the Allowable Charge Review already filed on
        that claim for the same allowed-amount dispute, keeping its own line reference; the review a line joins is
        the patient's Allowable Charge Review most recently filed among those still filed, the amount that review
