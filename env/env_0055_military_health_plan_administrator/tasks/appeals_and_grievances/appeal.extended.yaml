      jl_cost_share: >-
        Under a tier that charges fixed network copayments, the cost share on the joining line, when it is a network
        line other than preventive care, is that tier's network copayment for its service class, never more than the
        amount the cost share is figured on.
      jl_payment: >-
        The payment at issue on the joining line is figured by one of three methods: where the other insurer's payment
        counted is at least the allowed amount at issue, no payment is at issue; where a payment by another insurer
        below the allowed amount at issue is counted, the cost share is figured on the allowed amount at issue less
        that payment and the payment at issue is that net amount less the cost share; in every other case the cost
        share is figured on the allowed amount at issue itself and the payment at issue is the allowed amount at issue
        less the cost share; each amount is rounded to the cent.
      result: >-
        The amount in dispute recorded for a further late-filed line joining an open reconsideration is the amount
        the case carries once the line has joined it: the amount the case already carries plus the payment at issue
        on the joining line, rounded to the cent.
    factors:
    - id: jl_allowed_source
      effect: method
      decides: jl_allowed
      bindings:
      - jl_billed
      - jl_peer_count
      - jl_peer_total
      - jl_peer_latest
      - jl_nonpar_limit
      - jl_billed_basis
      - jl_allowed
      ladder:
      - when: >-
          the provider has three or more paid Select lines for the patient in the joining line's service class posted
          in the last twelve months
        method: the allowed amount at issue on the joining line is the average of those lines' allowed amounts
      - when: the provider has one or two such paid lines
        method: >-
          the allowed amount at issue on the joining line is the allowed amount of the provider's most recently posted
          paid line in that class
      - when: otherwise
        method: >-
          the allowed amount at issue on the joining line is the billed amount, divided for a nonparticipating provider
          by one plus the balance-billing limit
      baseline:
        jl_allowed: jl_billed_basis
      evidence:
      - history
      cross_difficulty: select
    - id: jl_cost_share_percentage
      effect: parameter
      decides: jl_pct
      bindings:
      - jl_network
      - jl_nn_pct
      - jl_nw_pct
      - jl_pct
      ladder:
      - when: the provider is recorded on the joining line as non-network
        value: the non-network outpatient cost-share percentage of the tier the joining line was billed under
      - when: the provider is recorded on the joining line as network and the joining line is preventive care
        value: no percentage (0)
      - when: otherwise
        value: the network outpatient cost-share percentage of the tier the joining line was billed under
      baseline:
        jl_pct: jl_nw_pct
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: jl_other_insurer_payment
      effect: parameter
      decides: jl_ohi_counted
      bindings:
      - jl_ohi_on_file
      - jl_ohi_line
      - jl_earlier_ohi
      - jl_ohi_counted
      ladder:
      - when: >-
          other health insurance is on file for the patient and the joining line shows the other insurer's payment
        value: the payment shown on the joining line
      - when: >-
          other health insurance is on file, the joining line shows no such payment and an earlier posting of the
          same service date on the same claim shows one
        value: the largest other-insurer payment shown on the claim's postings of that service date
      - when: otherwise
        value: no other-insurer payment (0.00)
      baseline:
        jl_ohi_counted: '0.0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: jl_payment_method
      effect: method
      decides: jl_payment
      bindings:
      - jl_enrollment
      - jl_base
      - jl_payment
      ladder:
      - when: the other insurer's payment counted is at least the allowed amount at issue
        method: no payment is at issue
      - when: a counted other-insurer payment is below the allowed amount at issue
        method: >-
          the cost share is figured on the allowed amount less the counted payment and the payment at issue is that
          net amount less the cost share
      - when: otherwise
        method: >-
          the cost share is figured on the allowed amount itself and the payment at issue is the allowed amount less
          the cost share
      baseline:
        jl_base: jl_allowed
        jl_payment: RND(jl_allowed - jl_cost_share, 2)
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    baseline:
      rule: >-
        The amount in dispute recorded for a further late-filed line joining an open reconsideration is the amount
        the case carries once the line has joined it: the amount the case already carries plus the payment at issue
        on the joining line, rounded to the cent. The payment at issue on the joining line is the TRICARE payment
        it would have carried had it been paid, and no beneficiary liability is at issue on a line denied for the
        provider's late filing. By default the allowed amount at issue on the joining line is the amount the provider
        billed on it, divided for a nonparticipating provider by one plus the tier's nonparticipating balance-billing
        limit, rounded to the cent. By default the cost share on the joining line is the network outpatient cost-share
        percentage of the tier the joining line was billed under applied to the allowed amount at issue, or under
        a tier that charges fixed network copayments that tier's network copayment for the service class, never more
        than the allowed amount at issue, and the payment at issue is the allowed amount at issue less that cost share;
        each amount is rounded to the cent.
      params: []
    inputs: *id003
  - id: appeal_ext_late_filed_case_formal_review
    base_policy_refs:
    - appeal_next_level
    - appeal_amount_in_dispute
    overwrite: []
    trigger: on_request
    subject:
    - appeal_escalate
    computes: amount_in_dispute
    target_tool: request_formal_review_d6793db3
    params:
      fr_peer_window_months: 12
      fr_peer_average_minimum: 3
    rule: >-
      When the appellant asks for a formal review of a decided Claim Factual Reconsideration on a TRICARE Select line
      denied for late filing, the amount in dispute booked on the case is the amount carried to the next level, figured
      afresh on the day the next level is asked for. Where a claim has more than one posting still standing with the
      same denial, the amount carried to the next level is fixed only after the claim's highest-numbered such posting
      stands joined to a Claim Factual Reconsideration opened on an earlier posting of the claim. The allowed amount
      at issue on the case's line is set from the provider's own paid lines for the patient: where the provider has
      three or more paid Select lines for the patient in the case's line's service class posted in the twelve months
      before the day the amount is figured, it is the average of their allowed amounts, rounded to the cent; where
      it has one or two such lines, it is the allowed amount of the provider's most recently posted paid line in that
      class for the patient; where it has none, it is the amount the provider billed on the case's line, which for
      a nonparticipating provider is first divided by one plus the tier's nonparticipating balance-billing limit so
      that nothing such a provider may bill above the allowed amount comes into dispute, rounded to the cent. The
      cost-share percentage on the case's line follows the provider's network status recorded on it and the schedule
      of the tier the case's line was billed under: from a non-network provider it is that tier's non-network outpatient
      percentage; a network line for preventive care carries none; any other network line carries that tier's network
      outpatient percentage, which is none on a tier that charges fixed network copayments. Under a tier that charges
      fixed network copayments, the cost share on the case's line, when it is a network line other than preventive
      care, is that tier's network copayment for its service class, never more than the amount the cost share is figured
      on. The other insurer's payment counted on the case's line is taken as follows: where the case holds the other
      insurer's explanation of benefits, other health insurance is on file for the patient and the case's line itself
      shows the other insurer's payment, that payment is counted; where the case holds the other insurer's explanation
      of benefits, other health insurance is on file, the case's line shows no such payment and an earlier posting
      of the same service date on the same claim shows one, the largest payment shown on the claim's postings of that
      service date is counted; in every other case no payment by another insurer is counted. The payment at issue
      on the case's line is figured by one of three methods: where the other insurer's payment counted is at least
      the allowed amount at issue, no payment is at issue; where a payment by another insurer below the allowed amount
      at issue is counted, the cost share is figured on the allowed amount at issue less that payment and the payment
      at issue is that net amount less the cost share; in every other case the cost share is figured on the allowed
      amount at issue itself and the payment at issue is the allowed amount at issue less the cost share; each amount
      is rounded to the cent. The amount carried to the next level on a decided reconsideration of a TRICARE Select
      line denied for late filing is the payment at issue on the case's line. By default the allowed amount at issue
      on the case's line is the amount the provider billed on it, divided for a nonparticipating provider by one plus
      the tier's nonparticipating balance-billing limit, rounded to the cent. By default the cost share on the case's
      line is the network outpatient cost-share percentage of the tier the case's line was billed under applied to
      the allowed amount at issue, or under a tier that charges fixed network copayments that tier's network copayment
      for the service class, never more than the allowed amount at issue, and the payment at issue is the allowed
      amount at issue less that cost share; each amount is rounded to the cent. What part of the payment at issue
      is carried up depends on what the first level already did with the case's line: where the case was decided partially
      overturned and a paid corrected posting of the same service date on the same claim has been made, the amount
      carried is the payment at issue less the TRICARE payment on that corrected posting, never below zero and rounded
      to the cent; where the case's line has been reversed as a duplicate claim and no paid corrected posting exists,
      nothing is carried; in every other case the whole payment at issue is carried.
    prerequisite:
    - problem: appeal_ext_late_filed_line_joining
      kind: state_gate
      gate: appeal_cases.subject_claim_line_id
      form: state
      policy_source: >-
        Where a claim has more than one posting still standing with the same denial, the amount carried to the next
        level is fixed only after the claim's highest-numbered such posting stands joined to a Claim Factual Reconsideration
        opened on an earlier posting of the claim.
      condition: >-
        appeal_cases holds a Claim Factual Reconsideration record with status filed or under_review on the highest
        line_number posting of the case's claim still standing with the case line's line_outcome, and another such
        record on an earlier posting of that claim
      resolved_by: join_select_line_reconsideration_711ff8e9
      effect: >-
        the claim's last same-denial posting stands joined to a first-level case opened on an earlier posting, so
        the condition the next-level amount waits on holds and the formal review request may be booked
    cross_category:
    - category: select
      as: history
      reads:
      - select_claim_lines.service_date
      - select_claim_lines.claim_number
      - select_claim_lines.provider_id
      - select_claim_lines.service_class
      - select_claim_lines.billed_amount
      - select_claim_lines.ohi_paid_amount
      - select_claim_lines.provider_network_status
      - select_claim_lines.select_enrollment_id
      - select_claim_lines.allowed_amount
      - select_claim_lines.line_outcome
      - select_enrollments.ohi_on_file
      - non_network_outpatient_cost_share_pct
      - network_outpatient_cost_share_pct
      - network_cost_share_basis
      - network_copay_*
      - nonparticipating_balance_billing_limit_pct
      - select_claim_lines.tricare_paid_amount
      - select_claim_lines.reversal_reason
      note: >-
        the allowed amount, other-insurer payment, cost share and payment at issue are decided from the patient's
        Select claim ledger and the tier schedule of the Select enrollment the line was billed under
    compute:
    - review_line: F('subject_claim_line_id')
    - fr_eob_held: >-
        COUNT('appeal_case_documents', document_kind='explanation_of_benefits', event_type='appeal_document_receive')
    - fr_service_date: >-
        XLATEST('select', 'select_claim_lines', 'service_date', date_field='posted_date', select_claim_line_id=review_line)
    - fr_claim: >-
        XLATEST('select', 'select_claim_lines', 'claim_number', date_field='posted_date', select_claim_line_id=review_line)
    - fr_provider: >-
        XLATEST('select', 'select_claim_lines', 'provider_id', date_field='posted_date', select_claim_line_id=review_line)
    - fr_service_class: >-
        XLATEST('select', 'select_claim_lines', 'service_class', date_field='posted_date', select_claim_line_id=review_line)
    - fr_billed: >-
        XLATEST('select', 'select_claim_lines', 'billed_amount', date_field='posted_date', select_claim_line_id=review_line)
    - fr_enrollment: >-
        XLATEST('select', 'select_claim_lines', 'select_enrollment_id', date_field='posted_date', select_claim_line_id=review_line)
    - fr_network: >-
        XLATEST('select', 'select_claim_lines', 'provider_network_status', date_field='posted_date', select_claim_line_id=review_line)
    - fr_ohi_line: >-
        XLATEST('select', 'select_claim_lines', 'ohi_paid_amount', date_field='posted_date', select_claim_line_id=review_line)
    - fr_peer_count: >-
        XCOUNT('select', 'select_claim_lines', within_months=K('fr_peer_window_months'), date_field='posted_date',
        provider_id=fr_provider, service_class=fr_service_class, line_outcome='paid')
    - fr_peer_total: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', within_months=K('fr_peer_window_months'), date_field='posted_date',
        provider_id=fr_provider, service_class=fr_service_class, line_outcome='paid')
    - fr_peer_latest: >-
        XLATEST('select', 'select_claim_lines', 'allowed_amount', date_field='posted_date', provider_id=fr_provider,
        service_class=fr_service_class, line_outcome='paid')
    - fr_nonpar_limit: CPARAM('select', 'nonparticipating_balance_billing_limit_pct', select_enrollment_id=fr_enrollment)
    - fr_billed_basis: >-
        RND(fr_billed * 100 / (100 + fr_nonpar_limit), 2) if fr_network == 'non_network_nonparticipating' else fr_billed
    - fr_allowed: >-
        RND(fr_peer_total / fr_peer_count, 2) if fr_peer_count >= K('fr_peer_average_minimum') else (fr_peer_latest
        if fr_peer_count >= 1 else fr_billed_basis)
    - fr_nn_pct: CPARAM('select', 'non_network_outpatient_cost_share_pct', select_enrollment_id=fr_enrollment)
    - fr_nw_pct: CPARAM('select', 'network_outpatient_cost_share_pct', select_enrollment_id=fr_enrollment)
    - fr_pct: >-
        fr_nn_pct if fr_network != 'network' else (0 if fr_service_class == 'preventive_care' else fr_nw_pct)
    - fr_tier_basis: CPARAM('select', 'network_cost_share_basis', select_enrollment_id=fr_enrollment)
    - fr_class_copay: >-
        CPARAM('select', 'network_copay_preventive_care', select_enrollment_id=fr_enrollment) if fr_service_class
        == 'preventive_care' else (CPARAM('select', 'network_copay_primary_care_visit', select_enrollment_id=fr_enrollment)
        if fr_service_class == 'primary_care_visit' else (CPARAM('select', 'network_copay_specialty_care_visit', select_enrollment_id=fr_enrollment)
        if fr_service_class == 'specialty_care_visit' else (CPARAM('select', 'network_copay_urgent_care_visit', select_enrollment_id=fr_enrollment)
        if fr_service_class == 'urgent_care_visit' else (CPARAM('select', 'network_copay_emergency_room_visit', select_enrollment_id=fr_enrollment)
        if fr_service_class == 'emergency_room_visit' else (CPARAM('select', 'network_copay_ground_ambulance', select_enrollment_id=fr_enrollment)
        if fr_service_class == 'ground_ambulance' else (CPARAM('select', 'network_copay_outpatient_behavioral_health_individual',
        select_enrollment_id=fr_enrollment) if fr_service_class == 'outpatient_behavioral_health_individual' else
        (CPARAM('select', 'network_copay_outpatient_behavioral_health_group', select_enrollment_id=fr_enrollment)
        if fr_service_class == 'outpatient_behavioral_health_group' else (CPARAM('select', 'network_copay_rehabilitative_therapy_visit',
        select_enrollment_id=fr_enrollment) if fr_service_class == 'rehabilitative_therapy_visit' else (CPARAM('select',
        'network_copay_ambulatory_surgery', select_enrollment_id=fr_enrollment) if fr_service_class == 'ambulatory_surgery'
        else (-1))))))))))
    - fr_ohi_on_file: CFIELD('select', 'ohi_on_file', status='active') == True
    - fr_earlier_ohi: >-
        XMAX('select', 'select_claim_lines', 'ohi_paid_amount', claim_number=fr_claim, service_date=fr_service_date,
        event_type='select_claim_line_post')
    - fr_ohi_counted: >-
        fr_ohi_line if (fr_eob_held >= 1 and fr_ohi_on_file and fr_ohi_line > 0) else (fr_earlier_ohi if (fr_eob_held
        >= 1 and fr_ohi_on_file and fr_ohi_line == 0 and fr_earlier_ohi > 0) else 0.0)
    - fr_base: >-
        RND(fr_allowed - fr_ohi_counted, 2) if (fr_ohi_counted > 0 and fr_ohi_counted < fr_allowed) else fr_allowed
    - fr_cost_share: >-
