    params:
      ex_reference_window_months: 12
    rule: >-
      A denied continued-stay request for an inpatient mental health stay that is still ongoing is taken by telephone
      as an Expedited Medical Necessity Reconsideration, the treating provider's urgent request on record standing
      as the provider's certification, and the amount in dispute booked on it is the payment at issue on the days
      requested. A case taken this way is an Expedited Medical Necessity Reconsideration whose subject is the denied
      continued-stay request itself, which is a kind of subject that tier hears. Such a case is received in time when
      the day it is received is no later than the denial date plus the expedited filing deadline in calendar days,
      counted from the day after the denial date, a case received on the last of those days being in time. For a continued-stay
      request of an inpatient mental health stay, the amount in dispute is the TRICARE payment the days at issue would
      carry, figured from the stay's records. The days at issue on a continued-stay request are counted only after
      the stay's earlier medical necessity reconsideration stands escalated or its next-level window has closed. Where
      the stay's paid daily rate falls below that of the patient's admission at the same facility in the past twelve
      months, the continued-stay amount is not valued until the last paid day line of the stay's claim stands joined
      to an Allowable Charge Review opened on an earlier paid line of that claim. The continued-stay request is the
      patient's inpatient mental health request most recently denied as not medically necessary, and the stay's earlier
      reconsideration is the patient's Medical Necessity Reconsideration most recently filed, whose authorization's
      admission is the stay. The amount in dispute on an expedited reconsideration of a denied continued-stay request
      is the TRICARE payment the days at issue would carry, rounded to the cent. The days at issue are the days the
      continued-stay request asked for, counted from its request date, less those the stay's earlier authorization
      already covers on or before its last valid day. Those days are valued at the stay's paid allowed amount per
      paid covered day, rounded to the cent, with no payment by another insurer counted. The cost share on them is
      the tier's daily inpatient charge for each day, never less than the tier's minimum inpatient charge, and the
      payment is their allowed amount less that cost share, rounded to the cent. Days of the continued-stay request
      already at issue elsewhere are left out: where the stay's earlier reconsideration stands escalated, the days
      its request asked for beyond what the authorization covers on or before its last valid day are left out wherever
      the continued-stay request asks for them again; where that earlier reconsideration is still filed or under review,
      the days it covers beyond those first granted are left out wherever asked for again; in every other case none
      are left out. These amounts are figured only for a stay that already has at least one paid day line; a stay
      with no paid day line has no daily allowed amount on record and is outside this rule. The daily allowed amount
      used to value the days at issue is set as follows: where the highest-numbered paid day line of the stay's claim
      stands joined to an Allowable Charge Review opened on an earlier paid line of that claim, and the patient had
      a paid admission at the same facility under an earlier inpatient mental health authorization that has since
      expired and began within the twelve months before the stay's admission, it is that earlier admission's allowed
      amount divided by its covered days; where that joined review stands and there is no such admission, it is the
      higher of the stay's paid daily rate and the stay's billed amount per paid covered day, the latter divided for
      a nonparticipating facility by one plus the tier's nonparticipating balance-billing limit; in every other case
      it is the stay's paid allowed amount divided by its paid covered days; each is rounded to the cent. The other
      insurer's daily payment used for the days at issue is taken as follows: where other health insurance is on file
      for the patient and the stay's paid day lines show the other insurer's payments, it is their total divided by
      the stay's paid covered days; where other health insurance is on file, the stay's lines show none and the earlier
      admission's lines show one, it is that admission's other-insurer total divided by its covered days; in every
      other case it is zero; each is rounded to the cent. The cost-share percentage on the days at issue follows the
      facility's network status recorded on the stay's lines and the inpatient schedule of the tier the stay is billed
      under: a non-network facility under a tier whose non-network inpatient basis takes a percentage of the allowed
      amount carries that tier's non-network inpatient percentage; a network facility under a tier whose network inpatient
      basis is the lesser of a daily charge and a percentage carries that tier's network inpatient percentage; any
      other carries no percentage. The cost share on the days at issue is figured by the tier's inpatient basis for
      a facility of that network status: under a percentage-of-allowed basis it is the cost-share percentage of the
      amount it is figured on; under a lesser-of basis it is the smaller of the daily inpatient charge for each day
      and the cost-share percentage of the amount it is figured on; under a per-admission basis it is the tier's admission
      copayment; under any other basis it is the daily inpatient charge for each day, never less than the tier's minimum
      inpatient charge; it is rounded to the cent. The payment the days at issue would carry is figured by one of
      three methods: where the other insurer's payment counted is at least the allowed amount, no payment would be
      made; where a payment by another insurer below the allowed amount is counted, the cost share is figured on the
      allowed amount less that payment and the payment is that net amount less the cost share, rounded to the cent;
      in every other case the cost share is figured on the allowed amount itself and the payment is the allowed amount
      less the cost share, rounded to the cent.
    prerequisite:
    - problem: appeal_ext_stay_reconsideration_second_level
      kind: value_input
      gate: ex_days
      form: state
      policy_source: >-
        The days at issue on a continued-stay request are counted only after the stay's earlier medical necessity
        reconsideration stands escalated or its next-level window has closed.
      condition: >-
        the patient's most recently filed Medical Necessity Reconsideration has status escalated, or its decision_date
        plus the tier's next-level filing deadline has passed
      resolved_by: request_second_level_reconsideration_e1311ea5
      effect: >-
        once the earlier reconsideration stands escalated, its still-denied days that the continued-stay request asks
        for again are left out of the days at issue
    - problem: appeal_ext_stay_charge_review_joining
      kind: value_input
      gate: ex_daily_allowed
      form: state
      policy_source: >-
        Where the stay's paid daily rate falls below that of the patient's admission at the same facility in the past
        twelve months, the continued-stay amount is not valued until the last paid day line of the stay's claim stands
        joined to an Allowable Charge Review opened on an earlier paid line of that claim.
      condition: >-
        appeal_cases holds a filed Allowable Charge Review record on the highest line_number paid line of the stay's
        claim and another filed Allowable Charge Review record on an earlier paid line of that claim
      resolved_by: join_line_charge_review_4bed256c
      effect: >-
        once the stay's last paid day line stands joined to the review opened on an earlier line, the daily allowed
        amount used for the days at issue becomes the earlier admission's rate
    cross_category: *id008
    compute:
    - ex_request: >-
        XLATEST('referral', 'referral_authorizations', 'referral_authorization_id', date_field='decision_date', variant_name='Inpatient
        Mental Health Authorization', status='denied', denial_reason='not_medically_necessary')
    - ex_requested: CFIELD('referral', 'units_requested', referral_authorization_id=ex_request)
    - ex_start: CFIELD('referral', 'request_date', referral_authorization_id=ex_request)
    - ex_facility: CFIELD('referral', 'servicing_provider_id', referral_authorization_id=ex_request)
    - ex_earlier_status: >-
        LATEST('appeal_cases', 'status', date_field='filing_date', variant_name='Medical Necessity Reconsideration')
    - ex_earlier_auth: >-
        LATEST('appeal_cases', 'subject_referral_authorization_id', date_field='filing_date', variant_name='Medical
        Necessity Reconsideration')
    - ex_earlier_from: CFIELD('referral', 'valid_from', referral_authorization_id=ex_earlier_auth)
    - ex_earlier_through: CFIELD('referral', 'valid_through', referral_authorization_id=ex_earlier_auth)
    - ex_earlier_requested: CFIELD('referral', 'units_requested', referral_authorization_id=ex_earlier_auth)
    - ex_earlier_authorized: CFIELD('referral', 'units_authorized', referral_authorization_id=ex_earlier_auth)
    - ex_covered: MX(0, MN(DAYS(ex_start, ex_earlier_through) + 1, ex_requested))
    - ex_overlap_still_denied: >-
        MX(0, MN(DAYS(ex_start, ex_earlier_from) + ex_earlier_requested - 1, ex_requested - 1) - MX(DAYS(ex_start,
        ex_earlier_through) + 1, 0) + 1)
    - ex_overlap_open_case: >-
        MX(0, MN(DAYS(ex_start, ex_earlier_from) + ex_earlier_requested - 1, ex_requested - 1) - MX(DAYS(ex_start,
        ex_earlier_from) + ex_earlier_authorized, 0) + 1)
    - ex_days: >-
        MX(0, ex_requested - ex_covered - ex_overlap_still_denied) if ex_earlier_status == 'escalated' else (MX(0,
        ex_requested - ex_covered - ex_overlap_open_case) if (ex_earlier_status == 'filed' or ex_earlier_status ==
        'under_review') else MX(0, ex_requested - ex_covered))
    - ex_stay_allowed: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', service_date=ex_earlier_from, provider_id=ex_facility,
        line_outcome='paid')
    - ex_stay_days: >-
        XSUM('select', 'select_claim_lines', 'inpatient_days', service_date=ex_earlier_from, provider_id=ex_facility,
        line_outcome='paid')
    - ex_stay_ohi: >-
        XSUM('select', 'select_claim_lines', 'ohi_paid_amount', service_date=ex_earlier_from, provider_id=ex_facility,
        line_outcome='paid')
    - ex_stay_billed: >-
        XSUM('select', 'select_claim_lines', 'billed_amount', service_date=ex_earlier_from, provider_id=ex_facility,
        line_outcome='paid')
    - ex_stay_claim: >-
        XLATEST('select', 'select_claim_lines', 'claim_number', date_field='posted_date', service_date=ex_earlier_from,
        provider_id=ex_facility, line_outcome='paid')
    - ex_stay_enrollment: >-
        XLATEST('select', 'select_claim_lines', 'select_enrollment_id', date_field='posted_date', service_date=ex_earlier_from,
        provider_id=ex_facility, line_outcome='paid')
    - ex_stay_network: >-
        XLATEST('select', 'select_claim_lines', 'provider_network_status', date_field='posted_date', service_date=ex_earlier_from,
        provider_id=ex_facility, line_outcome='paid')
    - ex_high_line: >-
        XLATEST('select', 'select_claim_lines', 'select_claim_line_id', date_field='line_number', claim_number=ex_stay_claim,
        line_outcome='paid')
    - ex_reviews_on_high_line: >-
        COUNT('appeal_cases', variant_name='Allowable Charge Review', status='filed', subject_claim_line_id=ex_high_line)
    - ex_reviews_on_claim: >-
        COUNT('appeal_cases', variant_name='Allowable Charge Review', status='filed', subject_claim_number=ex_stay_claim)
    - ex_joined_review: ex_reviews_on_high_line >= 1 and ex_reviews_on_claim >= 2
    - ex_ref_auth: >-
        XLATEST('referral', 'referral_authorizations', 'referral_authorization_id', date_field='valid_from', variant_name='Inpatient
        Mental Health Authorization', status='expired', servicing_provider_id=ex_facility)
    - ex_ref_admission: CFIELD('referral', 'valid_from', referral_authorization_id=ex_ref_auth)
    - ex_ref_allowed: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', service_date=ex_ref_admission, provider_id=ex_facility,
        line_outcome='paid')
    - ex_ref_days: >-
        XSUM('select', 'select_claim_lines', 'inpatient_days', service_date=ex_ref_admission, provider_id=ex_facility,
        line_outcome='paid')
    - ex_ref_ohi: >-
        XSUM('select', 'select_claim_lines', 'ohi_paid_amount', service_date=ex_ref_admission, provider_id=ex_facility,
        line_outcome='paid')
    - ex_ref_recent: ex_ref_days > 0 and 0 <= MONTHS(ex_ref_admission, ex_earlier_from) < K('ex_reference_window_months')
    - ex_nonpar_limit: >-
        CPARAM('select', 'nonparticipating_balance_billing_limit_pct', select_enrollment_id=ex_stay_enrollment)
    - ex_paid_rate: RND(ex_stay_allowed / MX(ex_stay_days, 1), 2)
    - ex_billed_rate: >-
        RND(ex_stay_billed / MX(ex_stay_days, 1) * 100 / (100 + ex_nonpar_limit), 2) if ex_stay_network == 'non_network_nonparticipating'
        else RND(ex_stay_billed / MX(ex_stay_days, 1), 2)
    - ex_daily_allowed: >-
        RND(ex_ref_allowed / ex_ref_days, 2) if (ex_joined_review and ex_ref_recent) else (MX(ex_paid_rate, ex_billed_rate)
        if (ex_joined_review and not ex_ref_recent) else ex_paid_rate)
    - ex_ohi_on_file: CFIELD('select', 'ohi_on_file', status='active') == True
    - ex_daily_ohi: >-
        RND(ex_stay_ohi / MX(ex_stay_days, 1), 2) if (ex_ohi_on_file and ex_stay_ohi > 0) else (RND(ex_ref_ohi / ex_ref_days,
        2) if (ex_ohi_on_file and ex_stay_ohi == 0 and ex_ref_ohi > 0) else 0.0)
    - ex_allowed_total: RND(ex_daily_allowed * ex_days, 2)
    - ex_ohi_total: RND(ex_daily_ohi * ex_days, 2)
    - ex_nn_basis: CPARAM('select', 'inpatient_non_network_basis', select_enrollment_id=ex_stay_enrollment)
    - ex_nw_basis: CPARAM('select', 'inpatient_network_basis', select_enrollment_id=ex_stay_enrollment)
    - ex_nn_pct: CPARAM('select', 'inpatient_non_network_pct', select_enrollment_id=ex_stay_enrollment)
    - ex_nw_pct: CPARAM('select', 'inpatient_network_pct_of_allowed', select_enrollment_id=ex_stay_enrollment)
    - ex_pct: >-
        ex_nn_pct if (ex_stay_network != 'network' and (ex_nn_basis == 'percent_of_allowed' or ex_nn_basis == 'lesser_of_per_diem_or_pct'))
        else (ex_nw_pct if (ex_stay_network == 'network' and ex_nw_basis == 'lesser_of_per_diem_or_pct') else 0)
    - ex_basis: ex_nn_basis if ex_stay_network != 'network' else ex_nw_basis
    - ex_daily_charge: >-
        CPARAM('select', 'inpatient_non_network_daily_charge', select_enrollment_id=ex_stay_enrollment) if ex_stay_network
        != 'network' else CPARAM('select', 'inpatient_network_daily_charge', select_enrollment_id=ex_stay_enrollment)
    - ex_minimum_charge: CPARAM('select', 'inpatient_network_minimum_charge', select_enrollment_id=ex_stay_enrollment)
    - ex_admission_copay: CPARAM('select', 'inpatient_network_admission_copay', select_enrollment_id=ex_stay_enrollment)
    - ex_base: >-
        RND(ex_allowed_total - ex_ohi_total, 2) if (ex_ohi_total > 0 and ex_ohi_total < ex_allowed_total) else ex_allowed_total
    - ex_cost_share: >-
        RND(ex_pct * ex_base / 100, 2) if ex_basis == 'percent_of_allowed' else (RND(MN(ex_daily_charge * ex_days,
        ex_pct * ex_base / 100), 2) if ex_basis == 'lesser_of_per_diem_or_pct' else (ex_admission_copay if ex_basis
        == 'per_admission_copay' else RND(MX(ex_daily_charge * ex_days, ex_minimum_charge), 2)))
    - ex_payment: 0.0 if ex_ohi_total >= ex_allowed_total else RND(ex_base - ex_cost_share, 2)
    - result: ex_payment
