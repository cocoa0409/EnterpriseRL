        fr_service_class != 'preventive_care' and fr_class_copay >= 0) else RND(fr_base * fr_pct / 100, 2)
    - fr_payment: 0.0 if fr_ohi_counted >= fr_allowed else RND(fr_base - fr_cost_share, 2)
    - fr_corrected_paid: >-
        XLATEST('select', 'select_claim_lines', 'tricare_paid_amount', date_field='posted_date', claim_number=fr_claim,
        service_date=fr_service_date, line_outcome='paid') or 0.0
    - fr_duplicate_reversals: >-
        XCOUNT('select', 'select_claim_lines', reversed_claim_line_id=review_line, reversal_reason='duplicate_claim')
    - fr_carried: >-
        RND(MX(0, fr_payment - fr_corrected_paid), 2) if (F('status') == 'decided_partially_overturned' and fr_corrected_paid
        > 0) else (0.0 if (fr_duplicate_reversals >= 1 and fr_corrected_paid == 0) else fr_payment)
