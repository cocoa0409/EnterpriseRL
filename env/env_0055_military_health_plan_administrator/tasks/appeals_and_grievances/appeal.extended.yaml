    factors:
    - id: sl_cost_share_percentage
      effect: parameter
      decides: sl_pct
      bindings:
      - sl_nn_pct
      - sl_nw_pct
      - sl_pct
      ladder:
      - when: >-
          the facility is recorded on the stay's lines as non-network and the tier's non-network inpatient basis takes
          a percentage of the allowed amount
        value: the tier's non-network inpatient percentage
      - when: >-
          the facility is recorded on the stay's lines as network and the tier's network inpatient basis is the lesser
          of a daily charge and a percentage
        value: the tier's network inpatient percentage
      - when: otherwise
        value: no percentage (0)
      baseline:
        sl_pct: '0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: sl_cost_share_basis
      effect: method
      decides: sl_cost_share
      bindings:
      - sl_nn_basis
      - sl_nw_basis
      - sl_basis
      - sl_daily_charge
      - sl_minimum_charge
      - sl_admission_copay
      - sl_cost_share
      ladder:
      - when: >-
          the tier's inpatient basis for a facility of that network status is a percentage of the allowed amount
        method: the cost share is the cost-share percentage of the amount it is figured on
      - when: that basis is the lesser of a daily charge and a percentage
        method: >-
          the cost share is the smaller of the daily inpatient charge for each day and the cost-share percentage of
          the amount it is figured on
      - when: that basis is a per-admission copayment
        method: the cost share is the tier's admission copayment
      - when: otherwise
        method: >-
          the cost share is the daily inpatient charge for each day, never less than the minimum inpatient charge
      baseline:
        sl_cost_share: RND(MX(sl_daily_charge * sl_days, sl_minimum_charge), 2)
      evidence:
      - cross_category
      cross_difficulty: select
    - id: sl_daily_allowed_source
      effect: parameter
      decides: sl_daily_allowed
      bindings:
      - sl_stay_billed
      - sl_high_line
      - sl_reviews_on_high_line
      - sl_reviews_on_claim
      - sl_joined_review
      - sl_ref_auth
      - sl_ref_admission
      - sl_ref_allowed
      - sl_ref_days
      - sl_ref_recent
      - sl_nonpar_limit
      - sl_billed_rate
      - sl_daily_allowed
      ladder:
      - when: >-
          the highest-numbered paid day line of the stay's claim stands joined to an Allowable Charge Review opened
          on an earlier paid line, and the patient had a paid admission at the same facility under an earlier, since-expired
          inpatient mental health authorization that began within the twelve months before the stay's admission
        value: that earlier admission's allowed amount per covered day
      - when: that joined review stands and there is no such admission
        value: >-
          the higher of the stay's paid daily rate and its billed daily amount, the latter divided for a nonparticipating
          facility by one plus the balance-billing limit
      - when: otherwise
        value: the stay's paid allowed amount per paid covered day
      baseline:
        sl_daily_allowed: sl_paid_rate
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: sl_daily_other_insurer_payment
      effect: parameter
      decides: sl_daily_ohi
      bindings:
      - sl_ohi_on_file
      - sl_stay_ohi
      - sl_ref_ohi
      - sl_daily_ohi
      ladder:
      - when: other health insurance is on file and the stay's paid day lines show the other insurer's payments
        value: their total per paid covered day
      - when: >-
          other health insurance is on file, the stay's lines show none and the earlier admission's lines show one
        value: that admission's other-insurer total per covered day
      - when: otherwise
        value: zero
      baseline:
        sl_daily_ohi: '0.0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: sl_payment_method
      effect: method
      decides: sl_payment
      bindings:
      - sl_stay_enrollment
      - sl_allowed_total
      - sl_ohi_total
      - sl_base
      - sl_payment
      ladder:
      - when: the other insurer's payment counted is at least the allowed amount
        method: no payment would be made
      - when: a counted other-insurer payment is below the allowed amount
        method: >-
          the cost share is figured on the allowed amount less the counted payment and the payment is that net amount
          less the cost share
      - when: otherwise
        method: >-
          the cost share is figured on the allowed amount itself and the payment is the allowed amount less the cost
          share
      baseline:
        sl_base: sl_allowed_total
        sl_payment: RND(sl_allowed_total - sl_cost_share, 2)
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: sl_days_still_covered
      effect: method
      decides: sl_days
      bindings:
      - sl_case_status
      - sl_appeal_granted
      - sl_extension_granted
      - sl_days
      ladder:
      - when: the case was decided partially overturned
        method: the days requested less the days first granted and less the days granted on appeal
      - when: the case was decided upheld and extensions were granted on the authorization
        method: the days requested less the days first granted and less the extension days granted
      - when: otherwise
        method: the days requested less the days first granted
      baseline:
        sl_days: MX(0, sl_requested - sl_authorized)
      evidence:
      - history
      - cross_category
      cross_difficulty: referral
    baseline:
      rule: >-
