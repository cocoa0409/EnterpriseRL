        day line of the stay's claim stands joined to an Allowable Charge Review opened on an earlier paid line of
        that claim, and the patient had a paid admission at the same facility under an earlier inpatient mental health
        authorization that has since expired and began within the twelve months before the stay's admission, it is
        that earlier admission's allowed amount divided by its covered days; where that joined review stands and there
        is no such admission, it is the higher of the stay's paid daily rate and the stay's billed amount per paid
        covered day, the latter divided for a nonparticipating facility by one plus the tier's nonparticipating balance-billing
        limit; in every other case it is the stay's paid allowed amount divided by its paid covered days; each is
        rounded to the cent.
      ex_billed_rate: >-
        The daily allowed amount used to value the days at issue is set as follows: where the highest-numbered paid
        day line of the stay's claim stands joined to an Allowable Charge Review opened on an earlier paid line of
        that claim, and the patient had a paid admission at the same facility under an earlier inpatient mental health
        authorization that has since expired and began within the twelve months before the stay's admission, it is
        that earlier admission's allowed amount divided by its covered days; where that joined review stands and there
        is no such admission, it is the higher of the stay's paid daily rate and the stay's billed amount per paid
        covered day, the latter divided for a nonparticipating facility by one plus the tier's nonparticipating balance-billing
        limit; in every other case it is the stay's paid allowed amount divided by its paid covered days; each is
        rounded to the cent.
      ex_daily_allowed: >-
        The daily allowed amount used to value the days at issue is set as follows: where the highest-numbered paid
        day line of the stay's claim stands joined to an Allowable Charge Review opened on an earlier paid line of
        that claim, and the patient had a paid admission at the same facility under an earlier inpatient mental health
        authorization that has since expired and began within the twelve months before the stay's admission, it is
        that earlier admission's allowed amount divided by its covered days; where that joined review stands and there
        is no such admission, it is the higher of the stay's paid daily rate and the stay's billed amount per paid
        covered day, the latter divided for a nonparticipating facility by one plus the tier's nonparticipating balance-billing
        limit; in every other case it is the stay's paid allowed amount divided by its paid covered days; each is
        rounded to the cent.
      ex_ohi_on_file: >-
        The other insurer's daily payment used for the days at issue is taken as follows: where other health insurance
        is on file for the patient and the stay's paid day lines show the other insurer's payments, it is their total
        divided by the stay's paid covered days; where other health insurance is on file, the stay's lines show none
        and the earlier admission's lines show one, it is that admission's other-insurer total divided by its covered
        days; in every other case it is zero; each is rounded to the cent.
      ex_daily_ohi: >-
        The other insurer's daily payment used for the days at issue is taken as follows: where other health insurance
        is on file for the patient and the stay's paid day lines show the other insurer's payments, it is their total
        divided by the stay's paid covered days; where other health insurance is on file, the stay's lines show none
        and the earlier admission's lines show one, it is that admission's other-insurer total divided by its covered
        days; in every other case it is zero; each is rounded to the cent.
      ex_allowed_total: >-
        The daily allowed amount used to value the days at issue is set as follows: where the highest-numbered paid
        day line of the stay's claim stands joined to an Allowable Charge Review opened on an earlier paid line of
        that claim, and the patient had a paid admission at the same facility under an earlier inpatient mental health
        authorization that has since expired and began within the twelve months before the stay's admission, it is
        that earlier admission's allowed amount divided by its covered days; where that joined review stands and there
        is no such admission, it is the higher of the stay's paid daily rate and the stay's billed amount per paid
        covered day, the latter divided for a nonparticipating facility by one plus the tier's nonparticipating balance-billing
        limit; in every other case it is the stay's paid allowed amount divided by its paid covered days; each is
        rounded to the cent.
      ex_ohi_total: >-
        The other insurer's daily payment used for the days at issue is taken as follows: where other health insurance
        is on file for the patient and the stay's paid day lines show the other insurer's payments, it is their total
        divided by the stay's paid covered days; where other health insurance is on file, the stay's lines show none
        and the earlier admission's lines show one, it is that admission's other-insurer total divided by its covered
        days; in every other case it is zero; each is rounded to the cent.
      ex_nn_basis: >-
        The cost share on the days at issue is figured by the tier's inpatient basis for a facility of that network
        status: under a percentage-of-allowed basis it is the cost-share percentage of the amount it is figured on;
        under a lesser-of basis it is the smaller of the daily inpatient charge for each day and the cost-share percentage
        of the amount it is figured on; under a per-admission basis it is the tier's admission copayment; under any
        other basis it is the daily inpatient charge for each day, never less than the tier's minimum inpatient charge;
        it is rounded to the cent.
      ex_nw_basis: >-
        The cost share on the days at issue is figured by the tier's inpatient basis for a facility of that network
        status: under a percentage-of-allowed basis it is the cost-share percentage of the amount it is figured on;
        under a lesser-of basis it is the smaller of the daily inpatient charge for each day and the cost-share percentage
        of the amount it is figured on; under a per-admission basis it is the tier's admission copayment; under any
        other basis it is the daily inpatient charge for each day, never less than the tier's minimum inpatient charge;
        it is rounded to the cent.
      ex_nn_pct: >-
        The cost-share percentage on the days at issue follows the facility's network status recorded on the stay's
        lines and the inpatient schedule of the tier the stay is billed under: a non-network facility under a tier
        whose non-network inpatient basis takes a percentage of the allowed amount carries that tier's non-network
        inpatient percentage; a network facility under a tier whose network inpatient basis is the lesser of a daily
        charge and a percentage carries that tier's network inpatient percentage; any other carries no percentage.
      ex_nw_pct: >-
        The cost-share percentage on the days at issue follows the facility's network status recorded on the stay's
        lines and the inpatient schedule of the tier the stay is billed under: a non-network facility under a tier
        whose non-network inpatient basis takes a percentage of the allowed amount carries that tier's non-network
        inpatient percentage; a network facility under a tier whose network inpatient basis is the lesser of a daily
        charge and a percentage carries that tier's network inpatient percentage; any other carries no percentage.
      ex_pct: >-
        The cost-share percentage on the days at issue follows the facility's network status recorded on the stay's
        lines and the inpatient schedule of the tier the stay is billed under: a non-network facility under a tier
        whose non-network inpatient basis takes a percentage of the allowed amount carries that tier's non-network
        inpatient percentage; a network facility under a tier whose network inpatient basis is the lesser of a daily
        charge and a percentage carries that tier's network inpatient percentage; any other carries no percentage.
      ex_basis: >-
        The cost share on the days at issue is figured by the tier's inpatient basis for a facility of that network
        status: under a percentage-of-allowed basis it is the cost-share percentage of the amount it is figured on;
        under a lesser-of basis it is the smaller of the daily inpatient charge for each day and the cost-share percentage
        of the amount it is figured on; under a per-admission basis it is the tier's admission copayment; under any
        other basis it is the daily inpatient charge for each day, never less than the tier's minimum inpatient charge;
        it is rounded to the cent.
      ex_daily_charge: >-
        The cost share on the days at issue is figured by the tier's inpatient basis for a facility of that network
        status: under a percentage-of-allowed basis it is the cost-share percentage of the amount it is figured on;
        under a lesser-of basis it is the smaller of the daily inpatient charge for each day and the cost-share percentage
        of the amount it is figured on; under a per-admission basis it is the tier's admission copayment; under any
        other basis it is the daily inpatient charge for each day, never less than the tier's minimum inpatient charge;
        it is rounded to the cent.
      ex_minimum_charge: >-
        The cost share on them is the tier's daily inpatient charge for each day, never less than the tier's minimum
        inpatient charge, and the payment is their allowed amount less that cost share, rounded to the cent.
      ex_admission_copay: >-
        The cost share on the days at issue is figured by the tier's inpatient basis for a facility of that network
        status: under a percentage-of-allowed basis it is the cost-share percentage of the amount it is figured on;
        under a lesser-of basis it is the smaller of the daily inpatient charge for each day and the cost-share percentage
        of the amount it is figured on; under a per-admission basis it is the tier's admission copayment; under any
        other basis it is the daily inpatient charge for each day, never less than the tier's minimum inpatient charge;
        it is rounded to the cent.
      ex_base: >-
        The payment the days at issue would carry is figured by one of three methods: where the other insurer's payment
        counted is at least the allowed amount, no payment would be made; where a payment by another insurer below
        the allowed amount is counted, the cost share is figured on the allowed amount less that payment and the payment
        is that net amount less the cost share, rounded to the cent; in every other case the cost share is figured
        on the allowed amount itself and the payment is the allowed amount less the cost share, rounded to the cent.
      ex_cost_share: >-
        The cost share on the days at issue is figured by the tier's inpatient basis for a facility of that network
        status: under a percentage-of-allowed basis it is the cost-share percentage of the amount it is figured on;
        under a lesser-of basis it is the smaller of the daily inpatient charge for each day and the cost-share percentage
        of the amount it is figured on; under a per-admission basis it is the tier's admission copayment; under any
        other basis it is the daily inpatient charge for each day, never less than the tier's minimum inpatient charge;
        it is rounded to the cent.
      ex_payment: >-
        The payment the days at issue would carry is figured by one of three methods: where the other insurer's payment
        counted is at least the allowed amount, no payment would be made; where a payment by another insurer below
        the allowed amount is counted, the cost share is figured on the allowed amount less that payment and the payment
        is that net amount less the cost share, rounded to the cent; in every other case the cost share is figured
        on the allowed amount itself and the payment is the allowed amount less the cost share, rounded to the cent.
      result: >-
        A denied continued-stay request for an inpatient mental health stay that is still ongoing is taken by telephone
        as an Expedited Medical Necessity Reconsideration, the treating provider's urgent request on record standing
        as the provider's certification, and the amount in dispute booked on it is the payment at issue on the days
        requested.
    factors:
    - id: ex_cost_share_percentage
      effect: parameter
      decides: ex_pct
      bindings:
      - ex_nn_pct
      - ex_nw_pct
      - ex_pct
      ladder:
      - when: >-
          the facility is recorded on the stay's lines as non-network and the tier's non-network inpatient basis takes
          a percentage of the allowed amount
        value: the tier's non-network inpatient percentage
      - when: >-
          the facility is recorded on the stay's lines as network and the tier's network inpatient basis is the lesser
          of a daily charge and a percentage
        value: the tier's network inpatient percentage
      - when: otherwise
        value: no percentage (0)
      baseline:
        ex_pct: '0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: ex_cost_share_basis
      effect: method
      decides: ex_cost_share
      bindings:
      - ex_nn_basis
      - ex_nw_basis
      - ex_basis
      - ex_daily_charge
      - ex_minimum_charge
      - ex_admission_copay
      - ex_cost_share
      ladder:
      - when: >-
          the tier's inpatient basis for a facility of that network status is a percentage of the allowed amount
        method: the cost share is the cost-share percentage of the amount it is figured on
      - when: that basis is the lesser of a daily charge and a percentage
        method: >-
          the cost share is the smaller of the daily inpatient charge for each day and the cost-share percentage of
          the amount it is figured on
      - when: that basis is a per-admission copayment
        method: the cost share is the tier's admission copayment
      - when: otherwise
        method: >-
          the cost share is the daily inpatient charge for each day, never less than the minimum inpatient charge
      baseline:
        ex_cost_share: RND(MX(ex_daily_charge * ex_days, ex_minimum_charge), 2)
      evidence:
      - cross_category
      cross_difficulty: select
    - id: ex_daily_allowed_source
      effect: parameter
      decides: ex_daily_allowed
      bindings:
      - ex_stay_billed
      - ex_high_line
      - ex_reviews_on_high_line
      - ex_reviews_on_claim
      - ex_joined_review
      - ex_ref_auth
      - ex_ref_admission
      - ex_ref_allowed
      - ex_ref_days
      - ex_ref_recent
      - ex_nonpar_limit
      - ex_billed_rate
      - ex_daily_allowed
      ladder:
      - when: >-
          the highest-numbered paid day line of the stay's claim stands joined to an Allowable Charge Review opened
          on an earlier paid line, and the patient had a paid admission at the same facility under an earlier, since-expired
          inpatient mental health authorization that began within the twelve months before the stay's admission
        value: that earlier admission's allowed amount per covered day
      - when: that joined review stands and there is no such admission
        value: >-
          the higher of the stay's paid daily rate and its billed daily amount, the latter divided for a nonparticipating
          facility by one plus the balance-billing limit
      - when: otherwise
        value: the stay's paid allowed amount per paid covered day
      baseline:
        ex_daily_allowed: ex_paid_rate
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: ex_daily_other_insurer_payment
      effect: parameter
      decides: ex_daily_ohi
      bindings:
      - ex_ohi_on_file
      - ex_stay_ohi
      - ex_ref_ohi
      - ex_daily_ohi
      ladder:
      - when: other health insurance is on file and the stay's paid day lines show the other insurer's payments
        value: their total per paid covered day
      - when: >-
          other health insurance is on file, the stay's lines show none and the earlier admission's lines show one
        value: that admission's other-insurer total per covered day
      - when: otherwise
        value: zero
      baseline:
        ex_daily_ohi: '0.0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: ex_payment_method
      effect: method
      decides: ex_payment
      bindings:
      - ex_stay_enrollment
      - ex_allowed_total
      - ex_ohi_total
      - ex_base
      - ex_payment
      ladder:
      - when: the other insurer's payment counted is at least the allowed amount
        method: no payment would be made
      - when: a counted other-insurer payment is below the allowed amount
        method: >-
          the cost share is figured on the allowed amount less the counted payment and the payment is that net amount
          less the cost share
      - when: otherwise
        method: >-
          the cost share is figured on the allowed amount itself and the payment is the allowed amount less the cost
          share
      baseline:
        ex_base: ex_allowed_total
        ex_payment: RND(ex_allowed_total - ex_cost_share, 2)
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: ex_days_at_issue
      effect: method
      decides: ex_days
      bindings:
      - ex_earlier_status
      - ex_earlier_requested
      - ex_earlier_authorized
      - ex_overlap_still_denied
      - ex_overlap_open_case
      - ex_days
      ladder:
      - when: the stay's earlier reconsideration stands escalated
        method: >-
          the days requested less those already covered and less the earlier request's still-denied days asked for
          again
      - when: the stay's earlier reconsideration is still filed or under review
        method: >-
          the days requested less those already covered and less the days the open case covers beyond those first
          granted, where asked for again
      - when: otherwise
        method: the days requested less those already covered
      baseline:
        ex_days: MX(0, ex_requested - ex_covered)
      evidence:
      - history
      - cross_category
      cross_difficulty: referral
    baseline:
      rule: >-
        The amount in dispute on an expedited reconsideration of a denied continued-stay request is the TRICARE payment
        the days at issue would carry, rounded to the cent. The days at issue are the days the continued-stay request
        asked for, counted from its request date, less those the stay's earlier authorization already covers on or
        before its last valid day. Those days are valued at the stay's paid allowed amount per paid covered day, rounded
        to the cent, with no payment by another insurer counted. The cost share on them is the tier's daily inpatient
        charge for each day, never less than the tier's minimum inpatient charge, and the payment is their allowed
        amount less that cost share, rounded to the cent.
      params: []
    inputs: *id009
