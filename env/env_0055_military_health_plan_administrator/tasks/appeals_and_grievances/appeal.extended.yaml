    target_tool: join_line_charge_review_4bed256c
    params:
      jr_reference_window_months: 12
    rule: >-
      A further paid TRICARE Select inpatient line of a claim joins the Allowable Charge Review already filed on that
      claim for the same allowed-amount dispute, keeping its own line reference; the review a line joins is the patient's
      Allowable Charge Review most recently filed among those still filed, the amount that review already carries
      is the largest amount in dispute recorded on its filed records on the claim, since each joining record carries
      the running total, and the joining line is the claim's highest-numbered paid line. The amount recorded for a
      further paid line joining an Allowable Charge Review is not fixed until an Allowable Charge Review stands filed
      on an earlier paid line of the same claim. A paid line joining an Allowable Charge Review is recorded with the
      claim line itself as its subject, an allowable charge being the kind of subject that review hears. A line joins
      in time when the day its record is received is no later than the joining line's posted date plus the review's
      filing deadline in calendar days, counted from the day after that posted date, a record received on the last
      of those days being in time. The amount in dispute recorded for a further paid line joining an Allowable Charge
      Review is the amount the review carries once the line has joined it: the amount the review already carries plus
      the payment difference on the joining line, rounded to the cent. The payment difference on the joining line
      is the TRICARE payment it would carry at the allowed amount claimed, less the TRICARE payment the line shows,
      never below zero and rounded to the cent. The allowed amount claimed on the joining line is its covered days
      at its paid daily rate, the paid daily rate being its allowed amount divided by its covered days and rounded
      to the cent. The payment the joining line would carry at the allowed amount claimed is that allowed amount less
      the cost share figured on it, the cost share being the daily inpatient charge of the tier for each covered day,
      never less than the tier's minimum inpatient charge. The daily rate claimed on the joining line is set as follows:
      where the patient had a paid admission at the same facility under an earlier inpatient mental health authorization
      that has since expired, and that admission began within the twelve months before the service date of the joining
      line, the rate claimed is that admission's allowed amount divided by its covered days; where there is no such
      admission and the billed amount of the joining line divided by its covered days, divided further for a nonparticipating
      facility by one plus the tier's nonparticipating balance-billing limit, exceeds its paid daily rate, the rate
      claimed is that billed daily amount; in every other case the rate claimed is its paid daily rate; each rate
      is rounded to the cent. The other insurer's payment counted on the joining line is taken as follows: where other
      health insurance is on file for the patient and the joining line itself shows the other insurer's payment, that
      payment is counted; where other health insurance is on file, the joining line shows no such payment and an earlier
      posting of the same service date on the same claim shows one, the largest payment shown on the claim's postings
      of that service date is counted; in every other case no payment by another insurer is counted. The cost-share
      percentage on the joining line follows the facility's network status recorded on the joining line and the inpatient
      schedule of the tier the stay is billed under: a non-network facility under a tier whose non-network inpatient
      basis takes a percentage of the allowed amount carries that tier's non-network inpatient percentage; a network
      facility under a tier whose network inpatient basis is the lesser of a daily charge and a percentage carries
      that tier's network inpatient percentage; any other carries no percentage. The cost share on the joining line
      is figured by the tier's inpatient basis for a facility of that network status: under a percentage-of-allowed
      basis it is the cost-share percentage of the amount it is figured on; under a lesser-of basis it is the smaller
      of the daily inpatient charge for each day and the cost-share percentage of the amount it is figured on; under
      a per-admission basis it is the tier's admission copayment; under any other basis it is the daily inpatient
      charge for each day, never less than the tier's minimum inpatient charge; it is rounded to the cent. The payment
      the joining line would carry is figured by one of three methods: where the other insurer's payment counted is
      at least the allowed amount, no payment would be made; where a payment by another insurer below the allowed
      amount is counted, the cost share is figured on the allowed amount less that payment and the payment is that
      net amount less the cost share, rounded to the cent; in every other case the cost share is figured on the allowed
      amount itself and the payment is the allowed amount less the cost share, rounded to the cent.
    prerequisite:
    - problem: appeal_ext_stay_charge_review_first_line
      kind: value_input
      gate: jr_review_amount_so_far
      form: state
      policy_source: >-
        The amount recorded for a further paid line joining an Allowable Charge Review is not fixed until an Allowable
        Charge Review stands filed on an earlier paid line of the same claim.
      condition: >-
        appeal_cases holds an Allowable Charge Review with status filed whose subject_claim_number is the joining
        line's claim and whose subject_claim_line_id is an earlier paid line of that claim
      resolved_by: file_allowable_charge_review_fa2a3df4
      effect: >-
        the filed review record exists, so the review's claim and its recorded amount, which the joining record adds
        to, are present; without it the joining amount has nothing to join
    cross_category: *id008
    compute:
    - jr_review_claim: >-
        LATEST('appeal_cases', 'subject_claim_number', date_field='filing_date', status='filed', variant_name='Allowable
        Charge Review')
    - jr_review_amount_so_far: >-
        MAX('appeal_cases', 'amount_in_dispute', status='filed', variant_name='Allowable Charge Review', subject_claim_number=jr_review_claim)
    - jr_line: >-
        XLATEST('select', 'select_claim_lines', 'select_claim_line_id', date_field='line_number', claim_number=jr_review_claim,
        line_outcome='paid', event_type='select_claim_line_post')
    - jr_service_date: >-
        XLATEST('select', 'select_claim_lines', 'service_date', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_claim: >-
        XLATEST('select', 'select_claim_lines', 'claim_number', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_provider: >-
        XLATEST('select', 'select_claim_lines', 'provider_id', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_days: >-
        XLATEST('select', 'select_claim_lines', 'inpatient_days', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_allowed: >-
        XLATEST('select', 'select_claim_lines', 'allowed_amount', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_billed: >-
        XLATEST('select', 'select_claim_lines', 'billed_amount', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_paid: >-
        XLATEST('select', 'select_claim_lines', 'tricare_paid_amount', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_ohi_line: >-
        XLATEST('select', 'select_claim_lines', 'ohi_paid_amount', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_network: >-
        XLATEST('select', 'select_claim_lines', 'provider_network_status', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_enrollment: >-
        XLATEST('select', 'select_claim_lines', 'select_enrollment_id', date_field='posted_date', select_claim_line_id=jr_line)
    - jr_paid_rate: RND(jr_allowed / jr_days, 2)
    - jr_nonpar_limit: CPARAM('select', 'nonparticipating_balance_billing_limit_pct', select_enrollment_id=jr_enrollment)
    - jr_billed_rate: >-
        RND(jr_billed / jr_days * 100 / (100 + jr_nonpar_limit), 2) if jr_network == 'non_network_nonparticipating'
        else RND(jr_billed / jr_days, 2)
    - jr_ref_auth: >-
        XLATEST('referral', 'referral_authorizations', 'referral_authorization_id', date_field='valid_from', variant_name='Inpatient
        Mental Health Authorization', status='expired', servicing_provider_id=jr_provider)
    - jr_ref_admission: CFIELD('referral', 'valid_from', referral_authorization_id=jr_ref_auth)
    - jr_ref_allowed: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', service_date=jr_ref_admission, provider_id=jr_provider,
