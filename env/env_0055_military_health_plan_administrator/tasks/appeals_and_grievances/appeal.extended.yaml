        where the provider has three or more paid Select lines for the patient in the case's line's service class
        posted in the twelve months before the day the amount is figured, it is the average of their allowed amounts,
        rounded to the cent; where it has one or two such lines, it is the allowed amount of the provider's most recently
        posted paid line in that class for the patient; where it has none, it is the amount the provider billed on
        the case's line, which for a nonparticipating provider is first divided by one plus the tier's nonparticipating
        balance-billing limit so that nothing such a provider may bill above the allowed amount comes into dispute,
        rounded to the cent.
      fr_allowed: >-
        The allowed amount at issue on the case's line is set from the provider's own paid lines for the patient:
        where the provider has three or more paid Select lines for the patient in the case's line's service class
        posted in the twelve months before the day the amount is figured, it is the average of their allowed amounts,
        rounded to the cent; where it has one or two such lines, it is the allowed amount of the provider's most recently
        posted paid line in that class for the patient; where it has none, it is the amount the provider billed on
        the case's line, which for a nonparticipating provider is first divided by one plus the tier's nonparticipating
        balance-billing limit so that nothing such a provider may bill above the allowed amount comes into dispute,
        rounded to the cent.
      fr_nn_pct: >-
        The cost-share percentage on the case's line follows the provider's network status recorded on it and the
        schedule of the tier the case's line was billed under: from a non-network provider it is that tier's non-network
        outpatient percentage; a network line for preventive care carries none; any other network line carries that
        tier's network outpatient percentage, which is none on a tier that charges fixed network copayments.
      fr_nw_pct: >-
        The cost-share percentage on the case's line follows the provider's network status recorded on it and the
        schedule of the tier the case's line was billed under: from a non-network provider it is that tier's non-network
        outpatient percentage; a network line for preventive care carries none; any other network line carries that
        tier's network outpatient percentage, which is none on a tier that charges fixed network copayments.
      fr_pct: >-
        The cost-share percentage on the case's line follows the provider's network status recorded on it and the
        schedule of the tier the case's line was billed under: from a non-network provider it is that tier's non-network
        outpatient percentage; a network line for preventive care carries none; any other network line carries that
        tier's network outpatient percentage, which is none on a tier that charges fixed network copayments.
      fr_tier_basis: >-
        Under a tier that charges fixed network copayments, the cost share on the case's line, when it is a network
        line other than preventive care, is that tier's network copayment for its service class, never more than the
        amount the cost share is figured on.
      fr_class_copay: >-
        Under a tier that charges fixed network copayments, the cost share on the case's line, when it is a network
        line other than preventive care, is that tier's network copayment for its service class, never more than the
        amount the cost share is figured on.
      fr_ohi_on_file: >-
        The other insurer's payment counted on the case's line is taken as follows: where the case holds the other
        insurer's explanation of benefits, other health insurance is on file for the patient and the case's line itself
        shows the other insurer's payment, that payment is counted; where the case holds the other insurer's explanation
        of benefits, other health insurance is on file, the case's line shows no such payment and an earlier posting
        of the same service date on the same claim shows one, the largest payment shown on the claim's postings of
        that service date is counted; in every other case no payment by another insurer is counted.
      fr_earlier_ohi: >-
        The other insurer's payment counted on the case's line is taken as follows: where the case holds the other
        insurer's explanation of benefits, other health insurance is on file for the patient and the case's line itself
        shows the other insurer's payment, that payment is counted; where the case holds the other insurer's explanation
        of benefits, other health insurance is on file, the case's line shows no such payment and an earlier posting
        of the same service date on the same claim shows one, the largest payment shown on the claim's postings of
        that service date is counted; in every other case no payment by another insurer is counted.
      fr_ohi_counted: >-
        The other insurer's payment counted on the case's line is taken as follows: where the case holds the other
        insurer's explanation of benefits, other health insurance is on file for the patient and the case's line itself
        shows the other insurer's payment, that payment is counted; where the case holds the other insurer's explanation
        of benefits, other health insurance is on file, the case's line shows no such payment and an earlier posting
        of the same service date on the same claim shows one, the largest payment shown on the claim's postings of
        that service date is counted; in every other case no payment by another insurer is counted.
      fr_base: >-
        The payment at issue on the case's line is figured by one of three methods: where the other insurer's payment
        counted is at least the allowed amount at issue, no payment is at issue; where a payment by another insurer
        below the allowed amount at issue is counted, the cost share is figured on the allowed amount at issue less
        that payment and the payment at issue is that net amount less the cost share; in every other case the cost
        share is figured on the allowed amount at issue itself and the payment at issue is the allowed amount at issue
        less the cost share; each amount is rounded to the cent.
      fr_cost_share: >-
        Under a tier that charges fixed network copayments, the cost share on the case's line, when it is a network
        line other than preventive care, is that tier's network copayment for its service class, never more than the
        amount the cost share is figured on.
      fr_payment: >-
        The payment at issue on the case's line is figured by one of three methods: where the other insurer's payment
        counted is at least the allowed amount at issue, no payment is at issue; where a payment by another insurer
        below the allowed amount at issue is counted, the cost share is figured on the allowed amount at issue less
        that payment and the payment at issue is that net amount less the cost share; in every other case the cost
        share is figured on the allowed amount at issue itself and the payment at issue is the allowed amount at issue
        less the cost share; each amount is rounded to the cent.
      fr_corrected_paid: >-
        What part of the payment at issue is carried up depends on what the first level already did with the case's
        line: where the case was decided partially overturned and a paid corrected posting of the same service date
        on the same claim has been made, the amount carried is the payment at issue less the TRICARE payment on that
        corrected posting, never below zero and rounded to the cent; where the case's line has been reversed as a
        duplicate claim and no paid corrected posting exists, nothing is carried; in every other case the whole payment
        at issue is carried.
      fr_duplicate_reversals: >-
        What part of the payment at issue is carried up depends on what the first level already did with the case's
        line: where the case was decided partially overturned and a paid corrected posting of the same service date
        on the same claim has been made, the amount carried is the payment at issue less the TRICARE payment on that
        corrected posting, never below zero and rounded to the cent; where the case's line has been reversed as a
        duplicate claim and no paid corrected posting exists, nothing is carried; in every other case the whole payment
        at issue is carried.
      fr_carried: >-
        What part of the payment at issue is carried up depends on what the first level already did with the case's
        line: where the case was decided partially overturned and a paid corrected posting of the same service date
        on the same claim has been made, the amount carried is the payment at issue less the TRICARE payment on that
        corrected posting, never below zero and rounded to the cent; where the case's line has been reversed as a
        duplicate claim and no paid corrected posting exists, nothing is carried; in every other case the whole payment
        at issue is carried.
      result: >-
        When the appellant asks for a formal review of a decided Claim Factual Reconsideration on a TRICARE Select
        line denied for late filing, the amount in dispute booked on the case is the amount carried to the next level,
        figured afresh on the day the next level is asked for.
    factors:
    - id: fr_allowed_source
      effect: method
      decides: fr_allowed
      bindings:
      - fr_billed
      - fr_peer_count
      - fr_peer_total
      - fr_peer_latest
      - fr_nonpar_limit
      - fr_billed_basis
      - fr_allowed
      ladder:
      - when: >-
          the provider has three or more paid Select lines for the patient in the case's line's service class posted
          in the last twelve months
        method: the allowed amount at issue on the case's line is the average of those lines' allowed amounts
      - when: the provider has one or two such paid lines
        method: >-
          the allowed amount at issue on the case's line is the allowed amount of the provider's most recently posted
          paid line in that class
      - when: otherwise
        method: >-
          the allowed amount at issue on the case's line is the billed amount, divided for a nonparticipating provider
          by one plus the balance-billing limit
      baseline:
        fr_allowed: fr_billed_basis
      evidence:
      - history
      cross_difficulty: select
    - id: fr_cost_share_percentage
      effect: parameter
      decides: fr_pct
      bindings:
      - fr_network
      - fr_nn_pct
      - fr_nw_pct
      - fr_pct
      ladder:
      - when: the provider is recorded on the case's line as non-network
        value: the non-network outpatient cost-share percentage of the tier the case's line was billed under
      - when: the provider is recorded on the case's line as network and the case's line is preventive care
        value: no percentage (0)
      - when: otherwise
        value: the network outpatient cost-share percentage of the tier the case's line was billed under
      baseline:
        fr_pct: fr_nw_pct
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: fr_other_insurer_payment
      effect: parameter
      decides: fr_ohi_counted
      bindings:
      - fr_eob_held
      - fr_ohi_on_file
      - fr_ohi_line
      - fr_earlier_ohi
      - fr_ohi_counted
      ladder:
      - when: >-
          the case holds the other insurer's explanation of benefits, other health insurance is on file for the patient
          and the case's line shows the other insurer's payment
        value: the payment shown on the case's line
      - when: >-
          the case holds the other insurer's explanation of benefits, other health insurance is on file, the case's
          line shows no such payment and an earlier posting of the same service date on the same claim shows one
        value: the largest other-insurer payment shown on the claim's postings of that service date
      - when: otherwise
        value: no other-insurer payment (0.00)
      baseline:
        fr_ohi_counted: '0.0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: fr_payment_method
      effect: method
      decides: fr_payment
      bindings:
      - fr_enrollment
      - fr_base
      - fr_payment
      ladder:
      - when: the other insurer's payment counted is at least the allowed amount at issue
        method: no payment is at issue
      - when: a counted other-insurer payment is below the allowed amount at issue
        method: >-
          the cost share is figured on the allowed amount less the counted payment and the payment at issue is that
          net amount less the cost share
      - when: otherwise
        method: >-
          the cost share is figured on the allowed amount itself and the payment at issue is the allowed amount less
          the cost share
      baseline:
        fr_base: fr_allowed
        fr_payment: RND(fr_allowed - fr_cost_share, 2)
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: fr_first_level_outcome_carry
      effect: method
      decides: fr_carried
      bindings:
      - fr_corrected_paid
      - fr_duplicate_reversals
      - fr_carried
      ladder:
      - when: >-
          the case was decided partially overturned and a paid corrected posting of the same service date on the same
          claim has been made
        method: >-
          the amount carried is the payment at issue less the TRICARE payment on the corrected posting, never below
          zero
      - when: the case's line has been reversed as a duplicate claim and no paid corrected posting exists
        method: nothing is carried to the next level
      - when: otherwise
        method: the whole payment at issue is carried to the next level
      baseline:
        fr_carried: fr_payment
      evidence:
      - history
      cross_difficulty: select
    baseline:
      rule: >-
        The amount carried to the next level on a decided reconsideration of a TRICARE Select line denied for late
        filing is the payment at issue on the case's line. By default the allowed amount at issue on the case's line
        is the amount the provider billed on it, divided for a nonparticipating provider by one plus the tier's nonparticipating
        balance-billing limit, rounded to the cent. By default the cost share on the case's line is the network outpatient
        cost-share percentage of the tier the case's line was billed under applied to the allowed amount at issue,
        or under a tier that charges fixed network copayments that tier's network copayment for the service class,
        never more than the allowed amount at issue, and the payment at issue is the allowed amount at issue less
        that cost share; each amount is rounded to the cent.
      params: []
    inputs:
      history:
      - *id004
      - *id005
      - *id006
      - table: appeal_case_documents
        aggregate: count
        field: appeal_document_id
        filters:
          document_kind: explanation_of_benefits
      cross_category: *id007
  - id: appeal_ext_stay_charge_review_first_line
    base_policy_refs: *id001
    overwrite:
    - base_policy: appeal_tier_selection
      superseded_clause: The case's subject_kind must be one of the tier's appealable_subject_kinds.
      replaced_by: >-
        An Allowable Charge Review opened this way has the paid claim line itself as its subject, an allowable charge
        being the kind of subject that review hears.
    - base_policy: appeal_filing_deadline
      superseded_clause: >-
        The case must be received no later than filing_deadline_days after the initial determination recorded on the
        subject record.
      replaced_by: >-
        Such a review is received in time when the day it is received is no later than the line's posted date plus
        the review's filing deadline in calendar days, counted from the day after the posted date, a review received
        on the last of those days being in time.
    - base_policy: appeal_amount_in_dispute
      superseded_clause: amount_in_dispute is figured under amount_in_dispute_basis
      replaced_by: >-
        The amount in dispute on an Allowable Charge Review of a paid TRICARE Select inpatient line is the payment
        difference on the line: the TRICARE payment the line would carry at the allowed amount claimed, less the TRICARE
        payment the line shows, never below zero and rounded to the cent.
    trigger: on_request
    subject:
    - appeal_file
    computes: amount_in_dispute
    target_tool: file_allowable_charge_review_fa2a3df4
    params:
      ar_reference_window_months: 12
    rule: >-
      An Allowable Charge Review opened on a paid TRICARE Select inpatient line records as its amount in dispute the
      payment difference on that line. A review is opened on the lowest-numbered paid line of the claim whose daily
      rate is disputed; the claim's further paid lines with the same dispute join it rather than opening reviews of
      their own. An Allowable Charge Review opened this way has the paid claim line itself as its subject, an allowable
      charge being the kind of subject that review hears. Such a review is received in time when the day it is received
      is no later than the line's posted date plus the review's filing deadline in calendar days, counted from the
      day after the posted date, a review received on the last of those days being in time. The amount in dispute
      on an Allowable Charge Review of a paid TRICARE Select inpatient line is the payment difference on the line:
      the TRICARE payment the line would carry at the allowed amount claimed, less the TRICARE payment the line shows,
      never below zero and rounded to the cent. The allowed amount claimed on the line under review is its covered
      days at its paid daily rate, the paid daily rate being its allowed amount divided by its covered days and rounded
      to the cent. The payment the line under review would carry at the allowed amount claimed is that allowed amount
      less the cost share figured on it, the cost share being the daily inpatient charge of the tier for each covered
      day, never less than the tier's minimum inpatient charge. The daily rate claimed on the line under review is
      set as follows: where the patient had a paid admission at the same facility under an earlier inpatient mental
      health authorization that has since expired, and that admission began within the twelve months before the service
      date of the line under review, the rate claimed is that admission's allowed amount divided by its covered days;
      where there is no such admission and the billed amount of the line under review divided by its covered days,
      divided further for a nonparticipating facility by one plus the tier's nonparticipating balance-billing limit,
      exceeds its paid daily rate, the rate claimed is that billed daily amount; in every other case the rate claimed
      is its paid daily rate; each rate is rounded to the cent. The other insurer's payment counted on the line under
      review is taken as follows: where other health insurance is on file for the patient and the line under review
      itself shows the other insurer's payment, that payment is counted; where other health insurance is on file,
      the line under review shows no such payment and an earlier posting of the same service date on the same claim
      shows one, the largest payment shown on the claim's postings of that service date is counted; in every other
      case no payment by another insurer is counted. The cost-share percentage on the line under review follows the
      facility's network status recorded on the line under review and the inpatient schedule of the tier the stay
      is billed under: a non-network facility under a tier whose non-network inpatient basis takes a percentage of
      the allowed amount carries that tier's non-network inpatient percentage; a network facility under a tier whose
      network inpatient basis is the lesser of a daily charge and a percentage carries that tier's network inpatient
      percentage; any other carries no percentage. The cost share on the line under review is figured by the tier's
      inpatient basis for a facility of that network status: under a percentage-of-allowed basis it is the cost-share
      percentage of the amount it is figured on; under a lesser-of basis it is the smaller of the daily inpatient
      charge for each day and the cost-share percentage of the amount it is figured on; under a per-admission basis
      it is the tier's admission copayment; under any other basis it is the daily inpatient charge for each day, never
      less than the tier's minimum inpatient charge; it is rounded to the cent. The payment the line under review
      would carry is figured by one of three methods: where the other insurer's payment counted is at least the allowed
      amount, no payment would be made; where a payment by another insurer below the allowed amount is counted, the
      cost share is figured on the allowed amount less that payment and the payment is that net amount less the cost
      share, rounded to the cent; in every other case the cost share is figured on the allowed amount itself and the
      payment is the allowed amount less the cost share, rounded to the cent.
    prerequisite: []
    cross_category: &id008
    - category: select
      as: history
      reads:
      - select_claim_lines.service_date
      - select_claim_lines.inpatient_days
      - select_claim_lines.allowed_amount
      - select_claim_lines.billed_amount
      - select_claim_lines.ohi_paid_amount
      - select_claim_lines.tricare_paid_amount
      - select_claim_lines.provider_network_status
      - select_claim_lines.claim_number
      - select_claim_lines.select_enrollment_id
      - select_enrollments.ohi_on_file
      - inpatient_non_network_pct
      - inpatient_network_pct_of_allowed
      - inpatient_non_network_basis
      - inpatient_network_basis
      - inpatient_non_network_daily_charge
      - inpatient_network_daily_charge
      - inpatient_network_minimum_charge
      - inpatient_network_admission_copay
      - nonparticipating_balance_billing_limit_pct
      note: >-
        the stay's and the earlier admission's paid day lines and the tier's inpatient schedule price the days or
        the line
    - category: referral
      as: history
      reads:
      - referral_authorizations.valid_from
      - referral_authorizations.valid_through
      - referral_authorizations.units_requested
      - referral_authorizations.units_authorized
      - referral_authorizations.request_date
      - referral_authorizations.status
      - referral_authorizations.servicing_provider_id
      - referral_unit_ledger.units
      note: >-
        the earlier admission is the one under the patient's earlier expired inpatient mental health authorization
        at the same facility; the days at issue come from the stay's authorization requests and unit ledger
    compute:
    - ar_service_date: >-
        XLATEST('select', 'select_claim_lines', 'service_date', date_field='posted_date', select_claim_line_id=HID)
    - ar_claim: >-
        XLATEST('select', 'select_claim_lines', 'claim_number', date_field='posted_date', select_claim_line_id=HID)
    - ar_provider: >-
        XLATEST('select', 'select_claim_lines', 'provider_id', date_field='posted_date', select_claim_line_id=HID)
    - ar_days: >-
        XLATEST('select', 'select_claim_lines', 'inpatient_days', date_field='posted_date', select_claim_line_id=HID)
    - ar_allowed: >-
        XLATEST('select', 'select_claim_lines', 'allowed_amount', date_field='posted_date', select_claim_line_id=HID)
    - ar_billed: >-
        XLATEST('select', 'select_claim_lines', 'billed_amount', date_field='posted_date', select_claim_line_id=HID)
    - ar_paid: >-
        XLATEST('select', 'select_claim_lines', 'tricare_paid_amount', date_field='posted_date', select_claim_line_id=HID)
    - ar_ohi_line: >-
        XLATEST('select', 'select_claim_lines', 'ohi_paid_amount', date_field='posted_date', select_claim_line_id=HID)
    - ar_network: >-
        XLATEST('select', 'select_claim_lines', 'provider_network_status', date_field='posted_date', select_claim_line_id=HID)
    - ar_enrollment: >-
        XLATEST('select', 'select_claim_lines', 'select_enrollment_id', date_field='posted_date', select_claim_line_id=HID)
    - ar_paid_rate: RND(ar_allowed / ar_days, 2)
    - ar_nonpar_limit: CPARAM('select', 'nonparticipating_balance_billing_limit_pct', select_enrollment_id=ar_enrollment)
    - ar_billed_rate: >-
        RND(ar_billed / ar_days * 100 / (100 + ar_nonpar_limit), 2) if ar_network == 'non_network_nonparticipating'
        else RND(ar_billed / ar_days, 2)
    - ar_ref_auth: >-
        XLATEST('referral', 'referral_authorizations', 'referral_authorization_id', date_field='valid_from', variant_name='Inpatient
        Mental Health Authorization', status='expired', servicing_provider_id=ar_provider)
    - ar_ref_admission: CFIELD('referral', 'valid_from', referral_authorization_id=ar_ref_auth)
    - ar_ref_allowed: >-
        XSUM('select', 'select_claim_lines', 'allowed_amount', service_date=ar_ref_admission, provider_id=ar_provider,
        line_outcome='paid')
    - ar_ref_days: >-
        XSUM('select', 'select_claim_lines', 'inpatient_days', service_date=ar_ref_admission, provider_id=ar_provider,
        line_outcome='paid')
    - ar_ref_recent: ar_ref_days > 0 and 0 <= MONTHS(ar_ref_admission, ar_service_date) < K('ar_reference_window_months')
    - ar_claimed_rate: >-
        RND(ar_ref_allowed / ar_ref_days, 2) if ar_ref_recent else (ar_billed_rate if (not ar_ref_recent and ar_billed_rate
        > ar_paid_rate) else ar_paid_rate)
    - ar_claimed_allowed: RND(ar_claimed_rate * ar_days, 2)
    - ar_ohi_on_file: CFIELD('select', 'ohi_on_file', status='active') == True
    - ar_earlier_ohi: >-
        XMAX('select', 'select_claim_lines', 'ohi_paid_amount', claim_number=ar_claim, service_date=ar_service_date,
        event_type='select_claim_line_post')
    - ar_ohi_counted: >-
        ar_ohi_line if (ar_ohi_on_file and ar_ohi_line > 0) else (ar_earlier_ohi if (ar_ohi_on_file and ar_ohi_line
        == 0 and ar_earlier_ohi > 0) else 0.0)
    - ar_nn_basis: CPARAM('select', 'inpatient_non_network_basis', select_enrollment_id=ar_enrollment)
    - ar_nw_basis: CPARAM('select', 'inpatient_network_basis', select_enrollment_id=ar_enrollment)
    - ar_nn_pct: CPARAM('select', 'inpatient_non_network_pct', select_enrollment_id=ar_enrollment)
    - ar_nw_pct: CPARAM('select', 'inpatient_network_pct_of_allowed', select_enrollment_id=ar_enrollment)
    - ar_pct: >-
        ar_nn_pct if (ar_network != 'network' and (ar_nn_basis == 'percent_of_allowed' or ar_nn_basis == 'lesser_of_per_diem_or_pct'))
        else (ar_nw_pct if (ar_network == 'network' and ar_nw_basis == 'lesser_of_per_diem_or_pct') else 0)
    - ar_basis: ar_nn_basis if ar_network != 'network' else ar_nw_basis
    - ar_daily_charge: >-
        CPARAM('select', 'inpatient_non_network_daily_charge', select_enrollment_id=ar_enrollment) if ar_network !=
        'network' else CPARAM('select', 'inpatient_network_daily_charge', select_enrollment_id=ar_enrollment)
    - ar_minimum_charge: CPARAM('select', 'inpatient_network_minimum_charge', select_enrollment_id=ar_enrollment)
    - ar_admission_copay: CPARAM('select', 'inpatient_network_admission_copay', select_enrollment_id=ar_enrollment)
    - ar_base: >-
        RND(ar_claimed_allowed - ar_ohi_counted, 2) if (ar_ohi_counted > 0 and ar_ohi_counted < ar_claimed_allowed)
        else ar_claimed_allowed
    - ar_cost_share: >-
        RND(ar_pct * ar_base / 100, 2) if ar_basis == 'percent_of_allowed' else (RND(MN(ar_daily_charge * ar_days,
        ar_pct * ar_base / 100), 2) if ar_basis == 'lesser_of_per_diem_or_pct' else (ar_admission_copay if ar_basis
        == 'per_admission_copay' else RND(MX(ar_daily_charge * ar_days, ar_minimum_charge), 2)))
    - ar_payment: 0.0 if ar_ohi_counted >= ar_claimed_allowed else RND(ar_base - ar_cost_share, 2)
    - ar_difference: RND(MX(0, ar_payment - ar_paid), 2)
    - result: ar_difference
    compute_basis:
      ar_service_date: >-
        The daily rate claimed on the line under review is set as follows: where the patient had a paid admission
        at the same facility under an earlier inpatient mental health authorization that has since expired, and that
        admission began within the twelve months before the service date of the line under review, the rate claimed
        is that admission's allowed amount divided by its covered days; where there is no such admission and the billed
        amount of the line under review divided by its covered days, divided further for a nonparticipating facility
        by one plus the tier's nonparticipating balance-billing limit, exceeds its paid daily rate, the rate claimed
        is that billed daily amount; in every other case the rate claimed is its paid daily rate; each rate is rounded
        to the cent.
      ar_claim: >-
        The other insurer's payment counted on the line under review is taken as follows: where other health insurance
        is on file for the patient and the line under review itself shows the other insurer's payment, that payment
        is counted; where other health insurance is on file, the line under review shows no such payment and an earlier
        posting of the same service date on the same claim shows one, the largest payment shown on the claim's postings
