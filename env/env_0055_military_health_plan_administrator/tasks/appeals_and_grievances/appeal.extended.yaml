    factors:
    - id: ar_cost_share_percentage
      effect: parameter
      decides: ar_pct
      bindings:
      - ar_nn_pct
      - ar_nw_pct
      - ar_pct
      ladder:
      - when: >-
          the facility is recorded on the line under review as non-network and the tier's non-network inpatient basis
          takes a percentage of the allowed amount
        value: the tier's non-network inpatient percentage
      - when: >-
          the facility is recorded on the line under review as network and the tier's network inpatient basis is the
          lesser of a daily charge and a percentage
        value: the tier's network inpatient percentage
      - when: otherwise
        value: no percentage (0)
      baseline:
        ar_pct: '0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: ar_cost_share_basis
      effect: method
      decides: ar_cost_share
      bindings:
      - ar_nn_basis
      - ar_nw_basis
      - ar_basis
      - ar_daily_charge
      - ar_minimum_charge
      - ar_admission_copay
      - ar_cost_share
      ladder:
      - when: >-
          the tier's inpatient basis for a facility of that network status is a percentage of the allowed amount
        method: the cost share is the cost-share percentage of the amount it is figured on
      - when: that basis is the lesser of a daily charge and a percentage
        method: >-
          the cost share is the smaller of the daily inpatient charge for each day and the cost-share percentage of
          the amount it is figured on
      - when: that basis is a per-admission copayment
        method: the cost share is the tier's admission copayment
      - when: otherwise
        method: >-
          the cost share is the daily inpatient charge for each day, never less than the minimum inpatient charge
      baseline:
        ar_cost_share: RND(MX(ar_daily_charge * ar_days, ar_minimum_charge), 2)
      evidence:
      - cross_category
      cross_difficulty: select
    - id: ar_claimed_rate_source
      effect: parameter
      decides: ar_claimed_rate
      bindings:
      - ar_billed
      - ar_nonpar_limit
      - ar_billed_rate
      - ar_ref_auth
      - ar_ref_admission
      - ar_ref_allowed
      - ar_ref_days
      - ar_ref_recent
      - ar_claimed_rate
      ladder:
      - when: >-
          a paid admission of the patient at the same facility under an earlier, since-expired inpatient mental health
          authorization began within the twelve months before the service date of the line under review
        value: that admission's allowed amount divided by its covered days
      - when: >-
          there is no such admission and the billed daily amount of the line under review, divided further for a nonparticipating
          facility by one plus the balance-billing limit, exceeds its paid daily rate
        value: that billed daily amount
      - when: otherwise
        value: the paid daily rate of the line under review
      baseline:
        ar_claimed_rate: ar_paid_rate
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: ar_other_insurer_payment
      effect: parameter
      decides: ar_ohi_counted
      bindings:
      - ar_ohi_on_file
      - ar_earlier_ohi
      - ar_ohi_counted
      ladder:
      - when: >-
          other health insurance is on file for the patient and the line under review shows the other insurer's payment
        value: the payment shown on the line under review
      - when: >-
          other health insurance is on file, the line under review shows no such payment and an earlier posting of
          the same service date on the same claim shows one
        value: the largest other-insurer payment shown on the claim's postings of that service date
      - when: otherwise
        value: no other-insurer payment (0.00)
      baseline:
        ar_ohi_counted: '0.0'
      evidence:
      - history
      - cross_category
      cross_difficulty: select
    - id: ar_payment_method
      effect: method
      decides: ar_payment
      bindings:
      - ar_enrollment
      - ar_base
      - ar_payment
      ladder:
      - when: the other insurer's payment counted is at least the allowed amount
        method: no payment would be made
      - when: a counted other-insurer payment is below the allowed amount
        method: >-
          the cost share is figured on the allowed amount less the counted payment and the payment is that net amount
          less the cost share
      - when: otherwise
        method: >-
          the cost share is figured on the allowed amount itself and the payment is the allowed amount less the cost
          share
      baseline:
        ar_base: ar_claimed_allowed
        ar_payment: RND(ar_claimed_allowed - ar_cost_share, 2)
      evidence:
      - history
      - cross_category
      cross_difficulty: select
