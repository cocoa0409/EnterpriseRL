- id: premium_ext_later_month_family_relief
  base_policy_refs: *id001
  overwrite:
  - base_policy: premium_termination_and_refund
    superseded_clause: A credit is posted only against a bill that has a payment posted against it.
    replaced_by: >-
      The paid-bill condition for credits is set aside only for a later-month family relief, which is posted against
      such a bill although no payment stands against it; every other credit on the plan still needs a payment posted
      against its bill.
  trigger: state_due
  subject:
  - premium_proration_credit
  computes: amount
  target_tool: relieve_later_month_family_adjustment_600a6ce9
  params: {}
  rule: >-
    When a coverage-type adjustment has been billed on a TRICARE Reserve Select plan for a coverage month later
    than its most recently paid month, and the purchaser's active duty TRICARE coverage carried days of the period
    that adjustment covers, the adjustment bill of that latest-billed month owes a later-month family relief for
    those days, posted against it as an activation-on-orders credit. The paid-bill condition for credits is set
    aside only for a later-month family relief, which is posted against such a bill although no payment stands against
    it; every other credit on the plan still needs a payment posted against its bill. The later-month family relief's
    standard figure is nothing: the base posts no credit against an unpaid bill, so only days after the plan's termination
    date are counted, nothing is relieved for them per day, nothing is posted now, and the result is rounded to
    the cent. The adjustment the later-month family relief works from is every coverage-type adjustment billed for
    the latest-billed month, over the days those adjustments cover, ending on the last day of the month. The day
    the later-month family relief is counted from follows the purchaser's TRICARE Prime Active Duty Service Member
    enrollment: where that enrollment is applied or active and its effective date falls inside the period the adjustment
    covers, the later-month family relief is counted from that effective date; where that enrollment is applied
    or active and its effective date falls before the period the adjustment covers began, the later-month family
    relief is counted from the first day the adjustment covers; otherwise the later-month family relief is counted
    from the plan's termination date. Active duty days count toward the later-month family relief only as the length
    of that coverage allows: where the active duty enrollment shows its coverage running more than 30 days from
    its effective date, those days count from the enrollment's effective date; where it shows its coverage running
    30 days or fewer, no day counts; otherwise days count only after the plan's termination date. Whether the day
    the later-month family relief is counted from is itself counted follows the application for that active duty
    enrollment: where the later-month family relief is counted from the enrollment's effective date or from the
    first day the adjustment covers and the enrollment was applied for on or before that day, that day is the first
    day counted; where it is counted from either of those days and the enrollment was applied for after that day,
    the first day counted is the day after the application date; otherwise the first day counted is the day after
    the day the later-month family relief is counted from. The daily amount the later-month family relief withdraws
    follows what was paid on the adjustment: where no payment stands against it, it is the amount of the adjustment
    divided by the days it covers; where a payment covers only part of it, it is the part still unpaid divided by
    those days; otherwise nothing is withdrawn, the paid adjustment being credited back with the Reserve Select
    closing reconciliation instead. How much of the later-month family relief is posted now follows the plan's state:
    where the plan has ended, the whole relief is posted now; where the plan is in force, it is posted now up to
    what that adjustment bill still owes; otherwise nothing is posted now. The later-month family relief is the
    number of relieved days, from the first day counted through the last day of the month, multiplied by the daily
    amount withdrawn; it is rounded to the cent once, at the end, and is never less than zero.
  prerequisite: []
  cross_category: *id002
  compute:
  - n_mbill: >-
      LATEST('premium_ledger', 'premium_entry_id', date_field='due_date', event_type='premium_bill', billing_kind='monthly_premium')
  - n_pay_bill: >-
      LATEST('premium_ledger', 'related_premium_entry_id', date_field='posted_date', event_type='premium_payment')
  - n_later: n_mbill != n_pay_bill
  - n_month: >-
      LATEST('premium_ledger', 'coverage_month', date_field='due_date', premium_entry_id=n_mbill)
  - n_eve: LATEST('premium_ledger', 'due_date', date_field='due_date', premium_entry_id=n_mbill)
  - n_mdays: LATEST('premium_ledger', 'coverage_days', date_field='due_date', premium_entry_id=n_mbill)
  - n_bill: >-
      LATEST('premium_ledger', 'premium_entry_id', date_field='posted_date', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=n_month)
  - n_billed: >-
      SUM('premium_ledger', 'amount', event_type='premium_bill', billing_kind='coverage_type_adjustment', coverage_month=n_month)
  - n_cov: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=n_month)
  - n_start: n_mdays - n_cov + 1
  - n_has_end: (F('termination_date') or '') != ''
  - n_term_day: DAYS(n_eve, F('termination_date')) if n_has_end else n_mdays
  - n_ad_open: >-
      (EXISTS('prime', variant_name='TRICARE Prime Active Duty Service Member', status='applied') or EXISTS('prime',
      variant_name='TRICARE Prime Active Duty Service Member', status='active'))
  - n_ad_start: >-
      CFIELD('prime', 'enrollment_effective_date', variant_name='TRICARE Prime Active Duty Service Member')
  - n_ad_applied: >-
      CFIELD('prime', 'application_date', variant_name='TRICARE Prime Active Duty Service Member')
  - n_ad_end: >-
      CFIELD('prime', 'disenrollment_date', variant_name='TRICARE Prime Active Duty Service Member')
  - n_ad_day: DAYS(n_eve, n_ad_start) if n_ad_open else 0
  - n_anchor: >-
      n_ad_day if (n_ad_open and n_ad_day >= n_start and n_ad_day <= n_mdays) else (n_start if (n_ad_open and n_ad_day
      < n_start) else n_term_day)
  - n_ad_len: DAYS(n_ad_start, n_ad_end) if (n_ad_open and n_ad_end) else 0
  - n_ee_day: >-
      n_ad_day if (n_ad_open and n_ad_end and n_ad_len > 30) else ((n_mdays + 1) if (n_ad_open and n_ad_end) else
      n_term_day)
  - n_from: MX(n_anchor, n_ee_day)
  - n_app_day: DAYS(n_eve, n_ad_applied) if n_ad_open else 0
  - n_first: >-
      n_from if (n_ad_open and n_ad_day <= n_mdays and n_from <= MX(n_ad_day, n_start) and n_app_day <= n_from)
      else ((n_app_day + 1) if (n_ad_open and n_ad_day <= n_mdays and n_from <= MX(n_ad_day, n_start)) else n_from
      + 1)
  - n_ndays: MX(0, n_mdays - n_first + 1)
  - n_paid: >-
      SUM('premium_ledger', 'amount', event_type='premium_payment', related_premium_entry_id=n_bill) if n_bill else
      0
  - n_rate: >-
      (n_billed / n_cov) if (n_cov > 0 and n_paid == 0) else (((n_billed - n_paid) / n_cov) if (n_cov > 0 and n_paid
      < n_billed) else 0)
  - n_figured: n_ndays * n_rate
  - n_credited: >-
      SUM('premium_ledger', 'amount', event_type='premium_proration_credit', related_premium_entry_id=n_bill) if
      n_bill else 0
  - n_owed: MX(0, n_billed - n_paid - n_credited)
  - n_ended: >-
      F('status') == 'terminated_by_request' or F('status') == 'terminated_nonpayment' or F('status') == 'terminated_ineligible'
  - n_post: n_figured if n_ended else (MN(n_figured, n_owed) if F('status') == 'active' else 0)
  - result: MX(0, RND(n_post, 2)) if n_later else 0
