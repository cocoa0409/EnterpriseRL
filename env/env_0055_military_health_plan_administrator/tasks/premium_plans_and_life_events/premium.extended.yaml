- id: premium_ext_reserve_select_closing_reconciliation
  base_policy_refs:
  - premium_termination_and_refund
  - premium_coverage_type_rules
  - premium_survivor_and_activation
  - premium_billing_schedule
  - premium_payment_and_nonpayment
  overwrite:
  - base_policy: premium_termination_and_refund
    superseded_clause: >-
      A purchaser may end the plan at any time, but only by their own confirmation: the agent records the request
      as an intake and the purchaser confirms it.
    replaced_by: >-
      For a TRICARE Reserve Select plan, the purchaser ends the plan only by confirming in person a request the
      agent recorded as an intake, and the Reserve Select closing reconciliation is the consequence of that confirmation
      and is booked by it, not recorded afterwards as a separate agent service action.
  - base_policy: premium_termination_and_refund
    superseded_clause: >-
      Premium paid for days after the termination date is credited back: the month containing the termination date
      is credited for the days after the termination date at monthly_premium times those days over the days in the
      month, every later paid month in full.
    replaced_by: >-
      For a TRICARE Reserve Select plan ended at the purchaser's confirmed request, the Reserve Select closing reconciliation
      takes the place of the termination credit for the bills of the closing period; an ending for loss of eligibility
      or the purchaser's death, and every plan of another kind, keeps the termination credit.
  - base_policy: premium_termination_and_refund
    superseded_clause: A credit is posted only against a bill that has a payment posted against it.
    replaced_by: >-
      The paid-bill condition for credits is set aside only for a Reserve Select closing reconciliation, which is
      posted against that monthly bill although no payment stands against it; every other credit on the plan still
      needs a payment posted against its bill.
  trigger: on_request
  subject:
  - premium_terminate_request
  - premium_proration_credit
  computes: amount
  target_tool: confirm_reserve_select_ending_f251f30d
  params: {}
  rule: >-
    When the purchaser of a TRICARE Reserve Select plan confirms in person the ending of the plan they asked for,
    the plan books with that confirmation its Reserve Select closing reconciliation: one termination-by-request
    credit, posted against the monthly bill of the latest-billed coverage month, for the premium billed for days
    of the closing period that the plan no longer charges for and that no credit has yet returned or relieved. For
    a TRICARE Reserve Select plan, the purchaser ends the plan only by confirming in person a request the agent
    recorded as an intake, and the Reserve Select closing reconciliation is the consequence of that confirmation
    and is booked by it, not recorded afterwards as a separate agent service action. The paid-bill condition for
    credits is set aside only for a Reserve Select closing reconciliation, which is posted against that monthly
    bill although no payment stands against it; every other credit on the plan still needs a payment posted against
    its bill. For a TRICARE Reserve Select plan ended at the purchaser's confirmed request, the Reserve Select closing
    reconciliation takes the place of the termination credit for the bills of the closing period; an ending for
    loss of eligibility or the purchaser's death, and every plan of another kind, keeps the termination credit.
    The termination date the Reserve Select closing reconciliation works from is the later of the date asked for
    in the pending request and the date that request was taken. The Reserve Select closing reconciliation is figured
    only after the monthly bill of the most recently paid month carries the early-duty month credit owed for its
    days of active duty coverage. The Reserve Select closing reconciliation is not figured before the coverage-type
    adjustment billed for the most recently paid month carries the family-adjustment relief owed for its days of
    active duty coverage. The Reserve Select closing reconciliation is figured only after the coverage-type adjustment
    billed for a later latest-billed month carries the later-month family relief owed for its days of active duty
    coverage. The Reserve Select closing reconciliation's standard figure is the termination credit taken bill by
    bill: for each bill taken in, the days of its period after the termination date, multiplied by the bill's daily
    amount, with nothing taken off for credits already standing; each bill's figure is rounded to the cent and the
    figures are added. The closing period is the most recently paid coverage month and, where a later coverage month
    has been billed, that latest-billed month; the Reserve Select closing reconciliation takes in the monthly bill
    and the coverage-type adjustment bill of each month of the closing period, each for the days of its own period,
    which end on the last day of its month. The day each bill taken in is counted from follows the purchaser's TRICARE
    Prime Active Duty Service Member enrollment: where that enrollment is applied or active and its effective date
    falls inside the period the bill covers, the bill is counted from that effective date; where that enrollment
    is applied or active and its effective date falls before that period began, the bill is counted from the first
    day it covers; otherwise the bill is counted from the plan's termination date. Active duty days count toward
    the Reserve Select closing reconciliation only as the length of that coverage allows: where the active duty
    enrollment shows its coverage running more than 30 days from its effective date, those days count from the enrollment's
    effective date; where it shows its coverage running 30 days or fewer, no day counts; otherwise days count only
    after the plan's termination date. Whether the day a bill is counted from is itself counted follows the application
    for that active duty enrollment: where the bill is counted from the enrollment's effective date or from the
    first day it covers and the enrollment was applied for on or before that day, that day is the first day counted;
    where it is counted from either of those days and the enrollment was applied for after that day, the first day
    counted is the day after the application date; otherwise the first day counted is the day after the day the
    bill is counted from. Each monthly bill taken in has as its daily amount the amount billed divided by the days
    the bill covers, credited back where a payment stands against it and withdrawn where none does; each coverage-type
    adjustment bill taken in has as its daily amount the part of it still unpaid divided by the days it covers,
    the part paid on it coming back through the monthly bill of its month. A coverage-type change already settled
    for a month of the closing period changes what that month's monthly bill brings into the Reserve Select closing
    reconciliation: where a coverage-type change credit stands against that monthly bill, that credit is taken off;
    where a coverage-type adjustment bill for that month has a payment posted against it, the part paid is added;
    otherwise nothing is taken off or added. Which counted days of the monthly bill that change applies to follows
    the period it covers: where the change credit or paid adjustment covers only part of the month, it is spread
    over the days it covers and applies to the counted days from the first day it covers; where it covers the whole
    month, it is spread over every day of the month and applies to every counted day; otherwise it applies to no
    counted day. Activation-on-orders credits already standing against a bill taken in are taken off what that bill
    brings into the Reserve Select closing reconciliation: where they cover only part of the days that bill covers,
    they are spread over the days they cover and taken off for the counted days from the first day they cover; where
    they cover every day that bill covers, they are spread over those days and taken off for every counted day;
    otherwise nothing is taken off. The Reserve Select closing reconciliation is the sum, over the bills taken in,
    of what each bill brings in: the number of counted days, from the first day counted through the last day of
    its month, multiplied by the bill's daily amount, less the coverage-type change taken off or plus the paid adjustment
    added, and less the activation-on-orders credits taken off, rounded to the cent and never less than zero.
  prerequisite:
