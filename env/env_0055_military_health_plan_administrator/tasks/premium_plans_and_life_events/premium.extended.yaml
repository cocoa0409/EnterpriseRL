      The recall paid-month credit is the number of credited days, from the first day counted through the last day
      of the month, multiplied by the amount billed divided by the days the bill covers, less the change taken off
      or plus the change added, spread over its days, for each credited day it applies to; it is rounded to the
      cent once, at the end, and is never less than zero.
