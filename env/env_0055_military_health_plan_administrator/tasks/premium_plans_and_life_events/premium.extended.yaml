  rule: >-
    When a TRICARE Retired Reserve plan has been billed for a coverage month later than its most recently paid month,
    the monthly bill of that latest-billed month owes a recall month relief for the days of the month the purchaser's
    active duty TRICARE coverage carried, posted against it as an activation-on-orders credit. The paid-bill condition
    for credits is set aside only for a recall month relief, which is posted against such a bill although no payment
    stands against it; every other credit on the plan still needs a payment posted against its bill. The recall
    month relief's standard figure is nothing: the base posts no credit against an unpaid bill, so no day of the
    latest-billed month is counted, nothing is withdrawn per day, and the result is rounded to the cent. The day
    the recall month relief is counted from follows the purchaser's TRICARE Prime Active Duty Service Member enrollment:
    where that enrollment is applied or active and its effective date falls inside the latest-billed month, the
    recall month relief is counted from that effective date; where that enrollment is applied or active and its
    effective date falls before the latest-billed month began, the recall month relief is counted from the first
    day of the month; otherwise no day of the recall month relief is counted. Active duty days count toward the
    recall month relief only as far as that coverage runs: where the active duty enrollment shows its coverage running
    more than 30 days from its effective date, the relief counts through the last day of the month; where it shows
    its coverage running 30 days or fewer, the relief counts only through the last day that coverage runs; otherwise
    no day counts. Whether the day the recall month relief is counted from is itself counted follows the application
    for that active duty enrollment: where the recall month relief is counted from the enrollment's effective date
    or from the first day of the month and the enrollment was applied for on or before that day, that day is the
    first day counted; where it is counted from either of those days and the enrollment was applied for after that
    day, the first day counted is the day after the application date; otherwise the first day counted is the day
    after the day the recall month relief is counted from. The daily amount the recall month relief withdraws follows
    what was paid on the monthly bill: where no payment stands against it, it is the amount billed divided by the
    days the bill covers; where a payment covers only part of it, it is the part still unpaid divided by those days;
    otherwise nothing is withdrawn, the paid month being credited back with the Retired Reserve closing reconciliation
    instead. The recall month relief is the number of counted days, from the first day counted through the last
    day counted, multiplied by the daily amount withdrawn; it is rounded to the cent once, at the end, and is never
    less than zero.
