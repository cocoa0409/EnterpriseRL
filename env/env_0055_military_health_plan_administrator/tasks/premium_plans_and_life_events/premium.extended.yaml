  - l_bill: >-
      LATEST('premium_ledger', 'premium_entry_id', date_field='posted_date', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=l_month)
  - l_billed: >-
      SUM('premium_ledger', 'amount', event_type='premium_bill', billing_kind='coverage_type_adjustment', coverage_month=l_month)
  - l_cov: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=l_month)
  - l_start: l_mdays - l_cov + 1
  - l_has_end: (F('termination_date') or '') != ''
  - l_term_day: DAYS(l_eve, F('termination_date')) if l_has_end else l_mdays
  - l_ad_open: >-
      (EXISTS('prime', variant_name='TRICARE Prime Active Duty Service Member', status='applied') or EXISTS('prime',
      variant_name='TRICARE Prime Active Duty Service Member', status='active'))
  - l_ad_start: >-
      CFIELD('prime', 'enrollment_effective_date', variant_name='TRICARE Prime Active Duty Service Member')
  - l_ad_applied: >-
      CFIELD('prime', 'application_date', variant_name='TRICARE Prime Active Duty Service Member')
  - l_ad_end: >-
      CFIELD('prime', 'disenrollment_date', variant_name='TRICARE Prime Active Duty Service Member')
  - l_ad_day: DAYS(l_eve, l_ad_start) if l_ad_open else 0
  - l_anchor: >-
      l_ad_day if (l_ad_open and l_ad_day >= l_start and l_ad_day <= l_mdays) else (l_start if (l_ad_open and l_ad_day
      < l_start) else l_term_day)
  - l_ad_len: DAYS(l_ad_start, l_ad_end) if (l_ad_open and l_ad_end) else 0
  - l_ee_day: >-
      l_ad_day if (l_ad_open and l_ad_end and l_ad_len > 30) else ((l_mdays + 1) if (l_ad_open and l_ad_end) else
      l_term_day)
  - l_from: MX(l_anchor, l_ee_day)
  - l_app_day: DAYS(l_eve, l_ad_applied) if l_ad_open else 0
  - l_first: >-
      l_from if (l_ad_open and l_ad_day <= l_mdays and l_from <= MX(l_ad_day, l_start) and l_app_day <= l_from)
      else ((l_app_day + 1) if (l_ad_open and l_ad_day <= l_mdays and l_from <= MX(l_ad_day, l_start)) else l_from
      + 1)
  - l_ndays: MX(0, l_mdays - l_first + 1)
  - l_paid: >-
      SUM('premium_ledger', 'amount', event_type='premium_payment', related_premium_entry_id=l_bill)
  - l_rate: >-
      (l_billed / l_cov) if (l_cov > 0 and l_paid == 0) else (((l_billed - l_paid) / l_cov) if (l_cov > 0 and l_paid
      < l_billed) else 0)
  - l_figured: l_ndays * l_rate
  - l_credited: >-
      SUM('premium_ledger', 'amount', event_type='premium_proration_credit', related_premium_entry_id=l_bill)
  - l_owed: MX(0, l_billed - l_paid - l_credited)
  - l_ended: >-
      F('status') == 'terminated_by_request' or F('status') == 'terminated_nonpayment' or F('status') == 'terminated_ineligible'
  - l_post: l_figured if l_ended else (MN(l_figured, l_owed) if F('status') == 'active' else 0)
  - result: MX(0, RND(l_post, 2))
