  compute:
  - e_bill: >-
      LATEST('premium_ledger', 'related_premium_entry_id', date_field='posted_date', event_type='premium_payment')
  - e_billed: LATEST('premium_ledger', 'amount', date_field='posted_date', premium_entry_id=e_bill)
  - e_bill_days: >-
