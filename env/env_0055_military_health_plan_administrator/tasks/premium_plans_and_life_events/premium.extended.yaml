      The activation-on-orders credits standing against that monthly bill rise by the early-duty month credit, so
      what the bill brings into the closing reconciliation falls by the same amount.
  - problem: premium_ext_family_adjustment_relief
    kind: value_input
    gate: c_a1_act
    form: state
    policy_source: >-
