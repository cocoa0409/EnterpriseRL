- id: premium_ext_recall_paid_month_credit
  base_policy_refs: *id001
  overwrite:
  - base_policy: premium_termination_and_refund
    superseded_clause: >-
      Premium paid for days after the termination date is credited back: the month containing the termination date
      is credited for the days after the termination date at monthly_premium times those days over the days in the
      month, every later paid month in full.
    replaced_by: >-
      For the most recently paid month of a TRICARE Retired Reserve plan whose purchaser came under active duty
      TRICARE coverage in it, the recall paid-month credit takes the place of the termination credit for that month's
      bill; every other paid month, and every plan of another kind, keeps the termination credit.
  trigger: state_due
  subject:
  - premium_proration_credit
  computes: amount
  target_tool: post_recall_paid_month_credit_948d1b7a
  params: {}
  rule: >-
    When the purchaser of a TRICARE Retired Reserve plan, recalled to active duty, comes under active duty TRICARE
    coverage during the most recently paid coverage month, and a later coverage month has already been billed, the
    monthly bill of that most recently paid month owes a recall paid-month credit for the days of the month the
    active duty coverage carried, posted against it as an activation-on-orders credit. For the most recently paid
    month of a TRICARE Retired Reserve plan whose purchaser came under active duty TRICARE coverage in it, the recall
    paid-month credit takes the place of the termination credit for that month's bill; every other paid month, and
    every plan of another kind, keeps the termination credit. The recall paid-month credit is figured as the days
    of the most recently paid month after the plan's termination date, multiplied by the amount billed for that
    month divided by the days its bill covers, with nothing taken off or added for coverage-type changes, rounded
    to the cent once at the end. The day the recall paid-month credit is counted from follows the purchaser's TRICARE
    Prime Active Duty Service Member enrollment: where that enrollment is applied or active and its effective date
    falls inside the most recently paid month, the recall paid-month credit is counted from that effective date;
    where that enrollment is applied or active and its effective date falls before the most recently paid month
    began, the recall paid-month credit is counted from the first day of the month; otherwise the recall paid-month
    credit is counted from the plan's termination date. Active duty days count toward the recall paid-month credit
    only as the length of that coverage allows: where the active duty enrollment shows its coverage running more
    than 30 days from its effective date, those days count from the enrollment's effective date; where it shows
    its coverage running 30 days or fewer, no day counts; otherwise days count only after the plan's termination
    date. Whether the day the recall paid-month credit is counted from is itself counted follows the application
    for that active duty enrollment: where the recall paid-month credit is counted from the enrollment's effective
    date or from the first day of the month and the enrollment was applied for on or before that day, that day is
    the first day counted; where it is counted from either of those days and the enrollment was applied for after
    that day, the first day counted is the day after the application date; otherwise the first day counted is the
    day after the day the recall paid-month credit is counted from. A coverage-type change already settled for the
    most recently paid month changes what the recall paid-month credit returns: where a coverage-type change credit
    stands against that month's bill, that credit is taken off; where a coverage-type adjustment bill for that month
    has a payment posted against it, that adjustment is added; otherwise nothing is taken off or added. The change
    in the recall paid-month credit is spread over days: where the change credit covers only part of the month,
    it is spread over the days that credit covers; where the paid adjustment bill covers only part of the month,
    it is spread over the days that adjustment covers; otherwise it is spread over every day of the month. Which
    credited days the change in the recall paid-month credit applies to follows the period it covers: where the
    change credit or paid adjustment covers only part of the month, it applies only to the credited days from the
    first day it covers; where it covers the whole month, it applies to every credited day; otherwise it applies
    to no credited day. The recall paid-month credit is the number of credited days, from the first day counted
    through the last day of the month, multiplied by the amount billed divided by the days the bill covers, less
    the change taken off or plus the change added, spread over its days, for each credited day it applies to; it
    is rounded to the cent once, at the end, and is never less than zero.
  prerequisite: []
  cross_category: *id002
  compute:
  - k_bill: >-
      LATEST('premium_ledger', 'related_premium_entry_id', date_field='posted_date', event_type='premium_payment')
  - k_billed: LATEST('premium_ledger', 'amount', date_field='posted_date', premium_entry_id=k_bill)
  - k_bill_days: >-
      LATEST('premium_ledger', 'coverage_days', date_field='posted_date', premium_entry_id=k_bill)
  - k_month: >-
      LATEST('premium_ledger', 'coverage_month', date_field='posted_date', premium_entry_id=k_bill)
  - k_eve: LATEST('premium_ledger', 'due_date', date_field='posted_date', premium_entry_id=k_bill)
  - k_latest: >-
      LATEST('premium_ledger', 'premium_entry_id', date_field='due_date', event_type='premium_bill', billing_kind='monthly_premium')
  - k_later: k_latest != k_bill
  - k_rate: k_billed / k_bill_days
  - k_has_end: (F('termination_date') or '') != ''
  - k_term_day: DAYS(k_eve, F('termination_date')) if k_has_end else k_bill_days
  - k_ad_open: >-
      (EXISTS('prime', variant_name='TRICARE Prime Active Duty Service Member', status='applied') or EXISTS('prime',
      variant_name='TRICARE Prime Active Duty Service Member', status='active'))
  - k_ad_start: >-
      CFIELD('prime', 'enrollment_effective_date', variant_name='TRICARE Prime Active Duty Service Member')
  - k_ad_applied: >-
      CFIELD('prime', 'application_date', variant_name='TRICARE Prime Active Duty Service Member')
  - k_ad_end: >-
      CFIELD('prime', 'disenrollment_date', variant_name='TRICARE Prime Active Duty Service Member')
  - k_ad_day: DAYS(k_eve, k_ad_start) if k_ad_open else 0
  - k_anchor: >-
      k_ad_day if (k_ad_open and k_ad_day >= 1 and k_ad_day <= k_bill_days) else (1 if (k_ad_open and k_ad_day <
      1) else k_term_day)
  - k_ad_len: DAYS(k_ad_start, k_ad_end) if (k_ad_open and k_ad_end) else 0
  - k_ee_day: >-
      k_ad_day if (k_ad_open and k_ad_end and k_ad_len > 30) else ((k_bill_days + 1) if (k_ad_open and k_ad_end)
      else k_term_day)
  - k_from: MX(k_anchor, k_ee_day)
  - k_app_day: DAYS(k_eve, k_ad_applied) if k_ad_open else 0
  - k_first: >-
      k_from if (k_ad_open and k_ad_day <= k_bill_days and k_from <= MX(k_ad_day, 1) and k_app_day <= k_from) else
      ((k_app_day + 1) if (k_ad_open and k_ad_day <= k_bill_days and k_from <= MX(k_ad_day, 1)) else k_from + 1)
  - k_chg: >-
      SUM('premium_ledger', 'amount', event_type='premium_proration_credit', adjustment_reason='coverage_type_change',
      related_premium_entry_id=k_bill)
  - k_chg_days: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_proration_credit', adjustment_reason='coverage_type_change',
      related_premium_entry_id=k_bill)
  - k_adj_bill: >-
      LATEST('premium_ledger', 'premium_entry_id', date_field='posted_date', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=k_month)
  - k_adj: >-
      SUM('premium_ledger', 'amount', event_type='premium_bill', billing_kind='coverage_type_adjustment', coverage_month=k_month)
  - k_adj_days: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=k_month)
  - k_adj_paid: >-
      SUM('premium_ledger', 'amount', event_type='premium_payment', related_premium_entry_id=k_adj_bill) if k_adj
      > 0 else 0
  - k_off: k_chg if k_chg > 0 else ((0 - k_adj) if k_adj_paid > 0 else 0)
  - k_offdays: >-
      k_chg_days if (k_chg > 0 and k_chg_days < k_bill_days) else (k_adj_days if (k_adj_paid > 0 and k_adj_days
      < k_bill_days) else k_bill_days)
  - k_days: MX(0, k_bill_days - k_first + 1)
  - k_cov: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_proration_credit', adjustment_reason='coverage_type_change',
      related_premium_entry_id=k_bill) if k_chg > 0 else (SUM('premium_ledger', 'coverage_days', event_type='premium_bill',
      billing_kind='coverage_type_adjustment', coverage_month=k_month) if k_adj_paid > 0 else 0)
  - k_offn: >-
      MX(0, k_bill_days - MX(k_first, k_bill_days - k_cov + 1) + 1) if (k_cov > 0 and k_cov < k_bill_days) else
      (k_days if k_cov >= k_bill_days else 0)
  - result: MX(0, RND(k_days * k_rate - k_off / k_offdays * k_offn, 2)) if k_later else 0
