- id: premium_ext_recall_adjustment_relief
  base_policy_refs: *id001
  overwrite:
  - base_policy: premium_termination_and_refund
    superseded_clause: A credit is posted only against a bill that has a payment posted against it.
    replaced_by: >-
      The paid-bill condition for credits is set aside only for a recall adjustment relief, which is posted against
      such a bill although no payment stands against it; every other credit on the plan still needs a payment posted
      against its bill.
  trigger: state_due
  subject:
  - premium_proration_credit
  computes: amount
  target_tool: relieve_recall_adjustment_165573c8
  params: {}
  rule: >-
    When a coverage-type adjustment has been billed on a TRICARE Retired Reserve plan for the most recently paid
    coverage month and the purchaser's active duty TRICARE coverage after a recall carried days of the period that
    adjustment covers, the adjustment bill owes a recall adjustment relief for those days, posted against it as
    an activation-on-orders credit. The paid-bill condition for credits is set aside only for a recall adjustment
    relief, which is posted against such a bill although no payment stands against it; every other credit on the
    plan still needs a payment posted against its bill. The recall adjustment relief's standard figure is nothing:
    the base posts no credit against an unpaid bill, so only days after the plan's termination date are counted,
    nothing is relieved for them per day, nothing is posted now, and the result is rounded to the cent. The adjustment
    the recall adjustment relief works from is every coverage-type adjustment billed for the most recently paid
    month, over the days those adjustments cover, ending on the last day of the month. The day the recall adjustment
    relief is counted from follows the purchaser's TRICARE Prime Active Duty Service Member enrollment: where that
    enrollment is applied or active and its effective date falls inside the period the adjustment covers, the recall
    adjustment relief is counted from that effective date; where that enrollment is applied or active and its effective
    date falls before the period the adjustment covers began, the recall adjustment relief is counted from the first
    day the adjustment covers; otherwise the recall adjustment relief is counted from the plan's termination date.
    Active duty days count toward the recall adjustment relief only as the length of that coverage allows: where
    the active duty enrollment shows its coverage running more than 30 days from its effective date, those days
    count from the enrollment's effective date; where it shows its coverage running 30 days or fewer, no day counts;
    otherwise days count only after the plan's termination date. Whether the day the recall adjustment relief is
    counted from is itself counted follows the application for that active duty enrollment: where the recall adjustment
    relief is counted from the enrollment's effective date or from the first day the adjustment covers and the enrollment
    was applied for on or before that day, that day is the first day counted; where it is counted from either of
    those days and the enrollment was applied for after that day, the first day counted is the day after the application
    date; otherwise the first day counted is the day after the day the recall adjustment relief is counted from.
    The daily amount the recall adjustment relief withdraws follows what was paid on the adjustment: where no payment
    stands against it, it is the amount of the adjustment divided by the days it covers; where a payment covers
    only part of it, it is the part still unpaid divided by those days; otherwise nothing is withdrawn, the paid
    adjustment being returned with the recall paid-month credit instead. How much of the recall adjustment relief
    is posted now follows the plan's state: where the plan has ended, the whole relief is posted now; where the
    plan is in force, it is posted now up to what that adjustment bill still owes; otherwise nothing is posted now.
    The recall adjustment relief is the number of relieved days, from the first day counted through the last day
    of the month, multiplied by the daily amount withdrawn; it is rounded to the cent once, at the end, and is never
    less than zero.
  prerequisite: []
  cross_category: *id002
  compute:
  - j_pay_bill: >-
      LATEST('premium_ledger', 'related_premium_entry_id', date_field='posted_date', event_type='premium_payment')
  - j_month: >-
      LATEST('premium_ledger', 'coverage_month', date_field='posted_date', premium_entry_id=j_pay_bill)
  - j_eve: >-
      LATEST('premium_ledger', 'due_date', date_field='posted_date', premium_entry_id=j_pay_bill)
  - j_mdays: >-
      LATEST('premium_ledger', 'coverage_days', date_field='posted_date', premium_entry_id=j_pay_bill)
  - j_bill: >-
      LATEST('premium_ledger', 'premium_entry_id', date_field='posted_date', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=j_month)
  - j_billed: >-
      SUM('premium_ledger', 'amount', event_type='premium_bill', billing_kind='coverage_type_adjustment', coverage_month=j_month)
  - j_cov: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=j_month)
  - j_start: j_mdays - j_cov + 1
  - j_has_end: (F('termination_date') or '') != ''
  - j_term_day: DAYS(j_eve, F('termination_date')) if j_has_end else j_mdays
  - j_ad_open: >-
      (EXISTS('prime', variant_name='TRICARE Prime Active Duty Service Member', status='applied') or EXISTS('prime',
      variant_name='TRICARE Prime Active Duty Service Member', status='active'))
  - j_ad_start: >-
      CFIELD('prime', 'enrollment_effective_date', variant_name='TRICARE Prime Active Duty Service Member')
  - j_ad_applied: >-
      CFIELD('prime', 'application_date', variant_name='TRICARE Prime Active Duty Service Member')
  - j_ad_end: >-
      CFIELD('prime', 'disenrollment_date', variant_name='TRICARE Prime Active Duty Service Member')
  - j_ad_day: DAYS(j_eve, j_ad_start) if j_ad_open else 0
  - j_anchor: >-
      j_ad_day if (j_ad_open and j_ad_day >= j_start and j_ad_day <= j_mdays) else (j_start if (j_ad_open and j_ad_day
      < j_start) else j_term_day)
  - j_ad_len: DAYS(j_ad_start, j_ad_end) if (j_ad_open and j_ad_end) else 0
  - j_ee_day: >-
      j_ad_day if (j_ad_open and j_ad_end and j_ad_len > 30) else ((j_mdays + 1) if (j_ad_open and j_ad_end) else
      j_term_day)
  - j_from: MX(j_anchor, j_ee_day)
  - j_app_day: DAYS(j_eve, j_ad_applied) if j_ad_open else 0
  - j_first: >-
      j_from if (j_ad_open and j_ad_day <= j_mdays and j_from <= MX(j_ad_day, j_start) and j_app_day <= j_from)
      else ((j_app_day + 1) if (j_ad_open and j_ad_day <= j_mdays and j_from <= MX(j_ad_day, j_start)) else j_from
      + 1)
  - j_ndays: MX(0, j_mdays - j_first + 1)
  - j_paid: >-
      SUM('premium_ledger', 'amount', event_type='premium_payment', related_premium_entry_id=j_bill)
  - j_rate: >-
      (j_billed / j_cov) if (j_cov > 0 and j_paid == 0) else (((j_billed - j_paid) / j_cov) if (j_cov > 0 and j_paid
      < j_billed) else 0)
  - j_figured: j_ndays * j_rate
  - j_credited: >-
      SUM('premium_ledger', 'amount', event_type='premium_proration_credit', related_premium_entry_id=j_bill)
  - j_owed: MX(0, j_billed - j_paid - j_credited)
  - j_ended: >-
      F('status') == 'terminated_by_request' or F('status') == 'terminated_nonpayment' or F('status') == 'terminated_ineligible'
  - j_post: j_figured if j_ended else (MN(j_figured, j_owed) if F('status') == 'active' else 0)
  - result: MX(0, RND(j_post, 2))
