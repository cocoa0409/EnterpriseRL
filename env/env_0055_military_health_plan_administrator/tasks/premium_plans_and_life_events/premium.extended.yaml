      Activation-on-orders credits already standing against a bill taken in are taken off what that bill brings
      into the Reserve Select closing reconciliation: where they cover only part of the days that bill covers, they
      are spread over the days they cover and taken off for the counted days from the first day they cover; where
      they cover every day that bill covers, they are spread over those days and taken off for every counted day;
      otherwise nothing is taken off.
    c_m1_val: >-
      The Reserve Select closing reconciliation is the sum, over the bills taken in, of what each bill brings in:
      the number of counted days, from the first day counted through the last day of its month, multiplied by the
      bill's daily amount, less the coverage-type change taken off or plus the paid adjustment added, and less the
      activation-on-orders credits taken off, rounded to the cent and never less than zero.
