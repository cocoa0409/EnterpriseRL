  compute_basis:
    g_req: >-
      The termination date the Retired Reserve closing reconciliation works from is the later of the date asked
      for in the pending request and the date that request was taken.
    g_made: >-
      The termination date the Retired Reserve closing reconciliation works from is the later of the date asked
      for in the pending request and the date that request was taken.
    g_ad_open: >-
      The day each bill taken in is counted from follows the purchaser's TRICARE Prime Active Duty Service Member
      enrollment: where that enrollment is applied or active and its effective date falls inside the period the
      bill covers, the bill is counted from that effective date; where that enrollment is applied or active and
      its effective date falls before that period began, the bill is counted from the first day it covers; otherwise
      the bill is counted from the plan's termination date.
    g_ad_start: >-
      The day each bill taken in is counted from follows the purchaser's TRICARE Prime Active Duty Service Member
      enrollment: where that enrollment is applied or active and its effective date falls inside the period the
      bill covers, the bill is counted from that effective date; where that enrollment is applied or active and
      its effective date falls before that period began, the bill is counted from the first day it covers; otherwise
      the bill is counted from the plan's termination date.
    g_ad_applied: >-
      Whether the day a bill is counted from is itself counted follows the application for that active duty enrollment:
      where the bill is counted from the enrollment's effective date or from the first day it covers and the enrollment
      was applied for on or before that day, that day is the first day counted; where it is counted from either
      of those days and the enrollment was applied for after that day, the first day counted is the day after the
      application date; otherwise the first day counted is the day after the day the bill is counted from.
    g_ad_end: >-
      Active duty days count toward the Retired Reserve closing reconciliation only as the length of that coverage
      allows: where the active duty enrollment shows its coverage running more than 30 days from its effective date,
      those days count from the enrollment's effective date; where it shows its coverage running 30 days or fewer,
      no day counts; otherwise days count only after the plan's termination date.
    g_ad_len: >-
      Active duty days count toward the Retired Reserve closing reconciliation only as the length of that coverage
      allows: where the active duty enrollment shows its coverage running more than 30 days from its effective date,
      those days count from the enrollment's effective date; where it shows its coverage running 30 days or fewer,
      no day counts; otherwise days count only after the plan's termination date.
    g_m1: >-
      The closing period is the most recently paid coverage month and, where a later coverage month has been billed,
      that latest-billed month; the Retired Reserve closing reconciliation takes in the monthly bill and the coverage-type
      adjustment bill of each month of the closing period, each for the days of its own period, which end on the
      last day of its month.
    g_m2: >-
      The closing period is the most recently paid coverage month and, where a later coverage month has been billed,
      that latest-billed month; the Retired Reserve closing reconciliation takes in the monthly bill and the coverage-type
      adjustment bill of each month of the closing period, each for the days of its own period, which end on the
      last day of its month.
    g_later: >-
      The closing period is the most recently paid coverage month and, where a later coverage month has been billed,
      that latest-billed month; the Retired Reserve closing reconciliation takes in the monthly bill and the coverage-type
      adjustment bill of each month of the closing period, each for the days of its own period, which end on the
      last day of its month.
    g_m1_amt: >-
      Each monthly bill taken in has as its daily amount the amount billed divided by the days the bill covers,
      credited back where a payment stands against it and withdrawn where none does; each coverage-type adjustment
      bill taken in has as its daily amount the part of it still unpaid divided by the days it covers, the part
      paid on it coming back through the monthly bill of its month.
    g_m1_days: >-
      The closing period is the most recently paid coverage month and, where a later coverage month has been billed,
      that latest-billed month; the Retired Reserve closing reconciliation takes in the monthly bill and the coverage-type
      adjustment bill of each month of the closing period, each for the days of its own period, which end on the
      last day of its month.
    g_m1_month: >-
