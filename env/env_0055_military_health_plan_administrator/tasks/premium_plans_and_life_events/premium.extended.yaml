- id: premium_ext_family_adjustment_relief
  base_policy_refs: *id001
  overwrite:
  - base_policy: premium_termination_and_refund
    superseded_clause: A credit is posted only against a bill that has a payment posted against it.
    replaced_by: >-
      The paid-bill condition for credits is set aside only for a family-adjustment relief, which is posted against
      such a bill although no payment stands against it; every other credit on the plan still needs a payment posted
      against its bill.
  trigger: state_due
  subject:
  - premium_proration_credit
  computes: amount
  target_tool: relieve_family_adjustment_280360d9
  params: {}
  rule: >-
    When a coverage-type adjustment has been billed on a TRICARE Reserve Select plan for the most recently paid
    coverage month and the purchaser's active duty TRICARE coverage carried days of the period that adjustment covers,
    the adjustment bill owes a family-adjustment relief for those days, posted against it as an activation-on-orders
    credit. The paid-bill condition for credits is set aside only for a family-adjustment relief, which is posted
    against such a bill although no payment stands against it; every other credit on the plan still needs a payment
    posted against its bill. The family-adjustment relief's standard figure is nothing: the base posts no credit
    against an unpaid bill, so only days after the plan's termination date are counted, nothing is relieved for
    them per day, nothing is posted now, and the result is rounded to the cent. The adjustment the family-adjustment
    relief works from is every coverage-type adjustment billed for the most recently paid month, over the days those
    adjustments cover, ending on the last day of the month. The day the family-adjustment relief is counted from
    follows the purchaser's TRICARE Prime Active Duty Service Member enrollment: where that enrollment is applied
    or active and its effective date falls inside the period the adjustment covers, the family-adjustment relief
    is counted from that effective date; where that enrollment is applied or active and its effective date falls
    before the period the adjustment covers began, the family-adjustment relief is counted from the first day the
    adjustment covers; otherwise the family-adjustment relief is counted from the plan's termination date. Active
    duty days count toward the family-adjustment relief only as the length of that coverage allows: where the active
    duty enrollment shows its coverage running more than 30 days from its effective date, those days count from
    the enrollment's effective date; where it shows its coverage running 30 days or fewer, no day counts; otherwise
    days count only after the plan's termination date. Whether the day the family-adjustment relief is counted from
    is itself counted follows the application for that active duty enrollment: where the family-adjustment relief
    is counted from the enrollment's effective date or from the first day the adjustment covers and the enrollment
    was applied for on or before that day, that day is the first day counted; where it is counted from either of
    those days and the enrollment was applied for after that day, the first day counted is the day after the application
    date; otherwise the first day counted is the day after the day the family-adjustment relief is counted from.
    The daily amount the family-adjustment relief withdraws follows what was paid on the adjustment: where no payment
    stands against it, it is the amount of the adjustment divided by the days it covers; where a payment covers
    only part of it, it is the part still unpaid divided by those days; otherwise nothing is withdrawn, the paid
    adjustment being returned with the early-duty month credit instead. How much of the family-adjustment relief
    is posted now follows the plan's state: where the plan has ended, the whole relief is posted now; where the
    plan is in force, it is posted now up to what that adjustment bill still owes; otherwise nothing is posted now.
    The family-adjustment relief is the number of relieved days, from the first day counted through the last day
    of the month, multiplied by the daily amount withdrawn; it is rounded to the cent once, at the end, and is never
    less than zero.
  prerequisite: []
  cross_category: *id002
  compute:
  - l_pay_bill: >-
      LATEST('premium_ledger', 'related_premium_entry_id', date_field='posted_date', event_type='premium_payment')
  - l_month: >-
      LATEST('premium_ledger', 'coverage_month', date_field='posted_date', premium_entry_id=l_pay_bill)
  - l_eve: >-
