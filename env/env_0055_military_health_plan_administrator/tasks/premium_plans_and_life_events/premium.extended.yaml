      coverage_month=e_month)
  - e_adj: >-
      SUM('premium_ledger', 'amount', event_type='premium_bill', billing_kind='coverage_type_adjustment', coverage_month=e_month)
  - e_adj_days: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_bill', billing_kind='coverage_type_adjustment',
      coverage_month=e_month)
  - e_adj_paid: >-
      SUM('premium_ledger', 'amount', event_type='premium_payment', related_premium_entry_id=e_adj_bill) if e_adj
      > 0 else 0
  - e_off: e_chg if e_chg > 0 else ((0 - e_adj) if e_adj_paid > 0 else 0)
  - e_offdays: >-
      e_chg_days if (e_chg > 0 and e_chg_days < e_bill_days) else (e_adj_days if (e_adj_paid > 0 and e_adj_days
      < e_bill_days) else e_bill_days)
  - e_days: MX(0, e_bill_days - e_first + 1)
  - e_cov: >-
      SUM('premium_ledger', 'coverage_days', event_type='premium_proration_credit', adjustment_reason='coverage_type_change',
      related_premium_entry_id=e_bill) if e_chg > 0 else (SUM('premium_ledger', 'coverage_days', event_type='premium_bill',
      billing_kind='coverage_type_adjustment', coverage_month=e_month) if e_adj_paid > 0 else 0)
  - e_offn: >-
      MX(0, e_bill_days - MX(e_first, e_bill_days - e_cov + 1) + 1) if (e_cov > 0 and e_cov < e_bill_days) else
      (e_days if e_cov >= e_bill_days else 0)
  - result: MX(0, RND(e_days * e_rate - e_off / e_offdays * e_offn, 2)) if e_later else 0
