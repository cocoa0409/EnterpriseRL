      open_season_purchase_allowed: true
      qle_effective_date_rule: date_of_qualifying_life_event
      open_season_effective_date_rule: january_1_of_the_following_plan_year
      initial_payment_months: 2
      monthly_premium: 1471.73
      premium_rate_year: '2026'
      premium_due_rule: last_calendar_day_of_the_month_before_the_coverage_month
      recurring_payment_methods: [electronic_funds_transfer, recurring_card]
      initial_payment_methods: [card_single, check, electronic_funds_transfer, recurring_card]
      nonpayment_grace_days: 30
      delinquency_notice_day: 10
      lockout_months_after_nonpayment: 12
      reinstatement_request_window_days: 90
      proration_basis: daily_by_calendar_days_in_the_month
      premium_refund_issue_days: 30
      termination_effective_rule: later_of_requested_date_and_request_date
      voluntary_termination_lockout_months: 0
      coverage_type_change_on_qle_allowed: true
      coverage_type_change_window_days: 90
      coverage_type_change_target: TRICARE Retired Reserve Member-Only
      survivor_continuation_rule: family_members_continue_until_the_date_the_member_would_have_turned_60
      activation_effect: not_applicable
      claims_cost_share_schedule: plan_cost_share_keys_by_sponsor_group_retiree
      deductible_individual: {group_a_retiree: 150.00, group_b_retiree: 183.00}
      deductible_family: {group_a_retiree: 300.00, group_b_retiree: 366.00}
      catastrophic_cap_family: {group_a_retiree: 3000.00, group_b_retiree: 4034.00}
      premiums_count_toward_catastrophic_cap: false
      network_outpatient_cost_share_pct: {group_a_retiree: 20, group_b_retiree: 0}
      non_network_outpatient_cost_share_pct: {group_a_retiree: 25, group_b_retiree: 25}
      pcm_required: false
      specialty_referral_required: false
      pos_option_available: false
      tricare_secondary_to_ohi: true
      region_transfer_allowed: true
      claim_filing_deadline_days: 365

events:
  - type: premium_purchase
    target: premium_plan_enrollments
    mutation: create
    meaning: A purchase application for a premium-based plan is received and recorded.
    grain: one row per purchase application
    fields:
      customer_id: the purchaser (Selected Reserve member, Retired Reserve member or young adult)
      variant_name: the plan and coverage type bought, as its official full name
      coverage_effective_date: date coverage starts once processed (DEERS qualifying-life-event date or January 1 after open season)
      purchase_reason: open_season or qualifying_life_event
      qualifying_life_event_id: the DEERS life-event record the purchase relies on; empty for open-season purchases
      application_date: date the purchase application was received
      payment_method: recurring method set up for monthly premiums
      ohi_on_file: whether other health insurance is on file at purchase
    triggers:
      - event: premium:premium_bill
        map: {premium_enrollment_id: premium_enrollment_id, customer_id: customer_id, billing_kind: initial_payment}
  - type: premium_activate
    target: premium_plan_enrollments
    mutation: {transition: {from: applied, to: active}}
    meaning: The purchase is processed and coverage begins.
    grain: one row per transaction
    fields:
      status: set to active
      coverage_effective_date: confirmed coverage start date
    triggers: []
  - type: premium_reject
    target: premium_plan_enrollments
    mutation: {transition: {from: applied, to: rejected}}
    meaning: A purchase application is rejected without coverage starting.
    grain: one row per transaction
    fields:
      status: set to rejected
    triggers: []
  - type: premium_bill
    target: premium_ledger
    meaning: A premium amount is billed for one coverage month - an initial-payment month, a regular monthly premium, a partial-month premium or a coverage-type adjustment.
    grain: one bill of one billing kind for one coverage month
    distinguish_by: [coverage_month, billing_kind]
    fields:
      premium_enrollment_id: plan billed
      customer_id: purchaser
      coverage_month: the coverage month billed
      billing_kind: initial_payment, monthly_premium, partial_month_proration or coverage_type_adjustment
      coverage_days: days of the month the bill covers (the full month for whole-month bills)
      amount: amount billed, positive USD
      posted_date: date billed
    account: premium_due
    direction: in
    triggers: []
  - type: premium_payment
    target: premium_ledger
    meaning: A premium payment is received against one bill.
    grain: one payment applied to one bill
    distinguish_by: [related_premium_entry_id, posted_date]
    fields:
      premium_enrollment_id: plan paid
      customer_id: purchaser
      related_premium_entry_id: bill this payment settles
      amount: amount paid, positive USD
      payment_method: method used
      posted_date: date received
    account: premium_due
    direction: out
    triggers: []
  - type: premium_proration_credit
    target: premium_ledger
    meaning: Premium already paid for days or months after a termination or a coverage-type reduction is credited back.
    grain: one credit against one paid bill
    distinguish_by: [related_premium_entry_id, adjustment_reason]
    fields:
      premium_enrollment_id: plan credited
      customer_id: purchaser
      related_premium_entry_id: paid bill whose unused days are credited
      coverage_month: coverage month credited
      coverage_days: days of that month credited
      adjustment_reason: why the credit arises
      amount: credit amount, positive USD
      posted_date: date posted
    account: premium_due
    direction: out
    triggers: []
  - type: premium_refund
    target: premium_ledger
    meaning: A credit balance on the plan is refunded to the purchaser.
    grain: one refund of one posted credit
    distinguish_by: [related_premium_entry_id]
    fields:
      premium_enrollment_id: plan refunded
      customer_id: purchaser
      related_premium_entry_id: credit refunded
      amount: refund amount, positive USD
      payment_method: method the refund is returned through
      posted_date: date issued
    account: premium_due
    direction: in
    triggers: []
  - type: premium_claim_line_post
    target: premium_claim_lines
    meaning: One line of a claim under a premium-based plan is adjudicated and the beneficiary liability assessed under the mapped cost-share schedule.
    grain: one adjudicated line of one claim
    distinguish_by: [claim_number, line_number]
    fields:
      premium_enrollment_id: plan the care was billed under
      customer_id: the patient
      claim_number: claim number printed on the TRICARE Explanation of Benefits
      line_number: line on that claim
      service_date: date of service
      provider_id: rendering provider
      service_class: benefit class of the service
      cost_share_key: the cost-share key (group and pay-grade band) the line was priced under
      allowed_amount: TRICARE allowed amount
      deductible_applied: part of the line applied to the deductible
      cost_share_amount: total beneficiary liability on the line
      posted_date: adjudication date
    account: beneficiary_liability_accrued
    direction: in
    triggers: []
  - type: premium_claim_line_reverse
    target: premium_claim_lines
    meaning: A previously adjudicated premium-plan claim line is reversed.
    grain: one reversal of one adjudicated line
    distinguish_by: [reversed_claim_line_id]
    fields:
      premium_enrollment_id: plan of the original line
      customer_id: the patient
      claim_number: claim number of the original line
      line_number: line number of the original line
      reversed_claim_line_id: adjudicated line being reversed
      reversal_reason: why the line is reversed
      deductible_applied: deductible withdrawn
      cost_share_amount: liability withdrawn, equal to the original line's
      posted_date: reversal date
    account: beneficiary_liability_accrued
    direction: out
    triggers: []
  - type: premium_coverage_type_change
    target: premium_plan_enrollments
    mutation: update
    meaning: The plan moves between member-only and member-and-family coverage after a qualifying life event.
    grain: one row per transaction
    fields:
      variant_name: the new tier after the change
      coverage_type_change_date: date the new coverage type takes effect (the DEERS event date)
      qualifying_life_event_id: DEERS life-event record the change relies on
    triggers:
      - event: premium:premium_bill
        when: {variant_name: [TRICARE Reserve Select Member-and-Family, TRICARE Retired Reserve Member-and-Family]}
        map: {premium_enrollment_id: premium_enrollment_id, customer_id: customer_id, billing_kind: coverage_type_adjustment}
      - event: premium:premium_proration_credit
        when: {variant_name: [TRICARE Reserve Select Member-Only, TRICARE Retired Reserve Member-Only]}
        map: {premium_enrollment_id: premium_enrollment_id, customer_id: customer_id, adjustment_reason: coverage_type_change}
  - type: premium_payment_method_update
    target: premium_plan_enrollments
    mutation: update
    meaning: The recurring payment method for monthly premiums is changed.
    grain: one row per transaction
    fields:
      payment_method: new recurring payment method
    triggers: []
  - type: premium_ohi_update
    target: premium_plan_enrollments
    mutation: update
    meaning: Other health insurance is reported or removed for the purchaser.
    grain: one row per transaction
    fields:
      ohi_on_file: whether other health insurance is now on file
    triggers: []
  - type: premium_terminate_request
    target: premium_plan_enrollments
    mutation: {transition: {from: active, to: terminated_by_request}}
    meaning: The purchaser confirms ending the plan.
    grain: one row per transaction
    fields:
      status: set to terminated_by_request
      termination_date: last day of coverage
    triggers: []
  - type: premium_terminate_nonpayment
    target: premium_plan_enrollments
    mutation: {transition: {from: active, to: terminated_nonpayment}}
    meaning: The plan ends because a monthly premium went unpaid past the grace period.
    grain: one row per transaction
    fields:
      status: set to terminated_nonpayment
      termination_date: paid-through date
    triggers: []
  - type: premium_terminate_ineligible
    target: premium_plan_enrollments
    mutation: {transition: {from: active, to: terminated_ineligible}}
    meaning: The plan ends because DEERS no longer shows the purchaser eligible.
    grain: one row per transaction
    fields:
      status: set to terminated_ineligible
      termination_date: last day of eligibility under the plan's rules
    triggers: []
  - type: premium_reinstate
    target: premium_plan_enrollments
    mutation: {transition: {from: terminated_nonpayment, to: active}}
    meaning: A nonpayment termination is reversed and the plan restored without a break.
    grain: one row per transaction
    fields:
      premium_enrollment_id: the enrollment being restored
      status: set back to active
      termination_date: cleared to empty
    triggers: []

measures:
  - id: premium_msr_paid_through_date
    window: the life of the plan
    measure: the last day of the latest coverage_month whose premium_bill rows of billing_kind initial_payment or monthly_premium are fully settled by premium_payment rows referencing them
  - id: premium_msr_family_catastrophic_ytd
    window: the calendar plan year that contains the service date of the line being adjudicated
    measure: across the premium-plan enrollments of the purchaser's family (same sponsor_customer_id), sum of cost_share_amount on premium_claim_line_post rows minus cost_share_amount on matching premium_claim_line_reverse rows
  - id: premium_msr_individual_deductible_ytd
    window: the calendar plan year that contains the service date of the line being adjudicated
    measure: per beneficiary, sum of deductible_applied on premium_claim_line_post rows minus the same field on matching premium_claim_line_reverse rows

policies:
  - id: premium_agg_multi_holding
    subject: [premium_purchase]
    rule: >-
      A purchaser may hold at most one premium-based plan at a time; member-only and member-and-family
      are two tiers of one plan, not two purchases, and moving between them is a coverage-type change on
      the same plan. A premium-based plan cannot be held together with TRICARE Prime or TRICARE Select by
      the same beneficiary; buying it while holding one of them is a plan change that ends the other
      enrollment on the day before the plan's effective date. The purchaser has no applied or active premium-based plan on the application date.
    eligibility:
      - id: no_open_premium_plan
        applies_to: [premium_purchase]
        kind: dedup
        condition: The purchaser has no applied or active premium-based plan on the application date.
        evidence_fields: [premium_plan_enrollments.customer_id, premium_plan_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premium_plan_enrollments.customer_id]
          action_bindings:
            premium_plan_enrollments.customer_id: customer_id
        dedup_contract:
          table: premium_plan_enrollments
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active]}
          distinct_fields: [coverage_effective_date]
    params:
      max_per_customer: 1

  - id: premium_plan_eligibility
    subject: [premium_purchase, premium_activate, premium_reject, premium_terminate_ineligible]
    rule: >-
      Eligibility rests on DEERS. TRICARE Reserve Select may be bought only by a member of the Selected
      Reserve who is not on active duty orders and is not eligible for the Federal Employees Health
      Benefits program. TRICARE Retired Reserve may be bought only by a member of the Retired Reserve who
      is qualified for non-regular retirement and has not reached coverage_end_age_years. TRICARE Young
      Adult may be bought only by an unmarried adult child of an eligible sponsor who has aged out of
      dependent eligibility (purchaser_min_age_years, or purchaser_min_age_full_time_student_years for a
      full-time student), is under coverage_end_age_years and is not eligible for employer-sponsored
      coverage through their own job; TRICARE Young Adult Prime additionally requires residence in a Prime
      Service Area. The purchaser's DEERS beneficiary category, age, marital and coverage-eligibility facts meet the plan's requirements on the coverage effective date.
      Coverage ends under coverage_end_rule at the age limit, at the end of the day before an activation
      for more than 30 days starts (the family then moves to active duty family coverage), on marriage or
      on gaining employer-coverage eligibility for a young adult, and on loss of Selected or Retired
      Reserve status.
    eligibility:
      - id: deers_plan_match
        applies_to: [premium_purchase, premium_activate]
        kind: authorization
        condition: The purchaser's DEERS beneficiary category, age, marital and coverage-eligibility facts meet the plan's requirements on the coverage effective date.
        evidence_fields: [customers.customer_id, customers.beneficiary_category, customers.date_of_birth, customers.residence_service_area, customers.sponsor_customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id

  - id: premium_purchase_window
    subject: [premium_purchase, premium_reject]
    rule: >-
      A premium-based plan is bought during open season (effective January 1) or within a
      qualifying-life-event window (effective on the DEERS event date). The purchase application must be received no later than the qle_purchase_window_days after the qualifying life event recorded in DEERS.
      The window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus qle_purchase_window_days and an application received on that day is timely while one received the next day is not.
      The caller's own account of a life change never stands in for the DEERS record. A purchase is
      rejected while a nonpayment lockout of lockout_months_after_nonpayment is still running, counted
      from the day after the termination date of the plan terminated for nonpayment; a purchaser-requested
      termination starts no lockout.
    eligibility:
      - id: qle_window
        applies_to: [premium_purchase]
        kind: time
        condition: The purchase application must be received no later than the qle_purchase_window_days after the qualifying life event recorded in DEERS.
        evidence_fields: [deers_life_events.life_event_id, deers_life_events.customer_id, deers_life_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deers_life_events.life_event_id]
          action_bindings:
            deers_life_events.life_event_id: qualifying_life_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the qualifying life event recorded in DEERS
          anchor_source: deers_life_events.event_date
          relation: not_after
          duration_source: variants.qle_purchase_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus qle_purchase_window_days and an application received on that day is timely while one received the next day is not.
          boundary: inclusive

  - id: premium_billing_schedule
    subject: [premium_bill, premium_purchase, premium_activate]
    rule: >-
      Premiums are billed per coverage month at the tier's monthly_premium for the premium_rate_year and
      are due on the last calendar day of the month before the coverage month. A purchase is accompanied
      by initial_payment_months of premium, billed as initial_payment bills for the first coverage months
      starting with the month that contains the coverage effective date; when coverage starts after the
      first day of a month, that month's initial_payment bill covers only the days from the effective date
      to month end, at monthly_premium times those days divided by the days in that month, rounded to the
      cent. The plan is activated only after every initial_payment bill has a payment posted against it.
      Bills are posted only on a plan whose status is applied or active. Premiums never count toward any catastrophic cap.
    eligibility:
      - id: plan_open_for_billing
        applies_to: [premium_bill]
        kind: state
        condition: Bills are posted only on a plan whose status is applied or active.
        evidence_fields: [premium_plan_enrollments.premium_enrollment_id, premium_plan_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premium_plan_enrollments.premium_enrollment_id]
          action_bindings:
            premium_plan_enrollments.premium_enrollment_id: premium_enrollment_id
        state_contract:
          field: premium_plan_enrollments.status
          allowed: [applied, active]
      - id: initial_payment_posted
        applies_to: [premium_activate]
        kind: authorization
        condition: The plan is activated only after every initial_payment bill has a payment posted against it.
        evidence_fields: [premium_ledger.premium_enrollment_id, premium_ledger.billing_kind, premium_ledger.related_premium_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premium_ledger.premium_enrollment_id]
          action_bindings:
            premium_ledger.premium_enrollment_id: premium_enrollment_id
    formula:
      amount: round(monthly_premium * coverage_days / days_in_month, 2)
    params:
      days_in_month: number of calendar days in the coverage month billed

  - id: premium_payment_and_nonpayment
    subject: [premium_payment, premium_payment_method_update, premium_terminate_nonpayment]
    rule: >-
      The initial payment may be made by any method in initial_payment_methods; every later monthly
      premium must be paid through a recurring method in recurring_payment_methods, and a change of
      recurring method applies from the next monthly bill. A payment settles the oldest unpaid bill first.
      When a premium is unpaid on its due date a delinquency letter is issued on the delinquency_notice_day
      after the due date. The plan is terminated for nonpayment only once more than nonpayment_grace_days have passed since the due date of the oldest unpaid monthly premium.
      The grace period is counted in calendar days starting the day after the due date (the last calendar day of the month before that coverage month), so termination may be processed from the day after due date plus nonpayment_grace_days and not on that day itself.
      Termination takes effect on the paid-through date (premium_msr_paid_through_date), starts a purchase
      lockout of lockout_months_after_nonpayment, and may be reviewed through an Enrollment Reinstatement
      Review filed within reinstatement_request_window_days.
    eligibility:
      - id: grace_period_expired
        applies_to: [premium_terminate_nonpayment]
        kind: time
        condition: The plan is terminated for nonpayment only once more than nonpayment_grace_days have passed since the due date of the oldest unpaid monthly premium.
        evidence_fields: [premium_ledger.premium_entry_id, premium_ledger.due_date, premium_ledger.premium_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premium_ledger.premium_entry_id]
          action_bindings:
            premium_ledger.premium_entry_id: premium_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the due date of the oldest unpaid monthly premium
          anchor_source: premium_ledger.due_date
          relation: not_before
          duration_source: variants.nonpayment_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date (the last calendar day of the month before that coverage month), so termination may be processed from the day after due date plus nonpayment_grace_days and not on that day itself.
          boundary: exclusive
    measures: [premium_msr_paid_through_date]

  - id: premium_coverage_type_rules
    subject: [premium_coverage_type_change, premium_bill, premium_proration_credit]
    rule: >-
      Marriage, birth, adoption or court placement recorded in DEERS lets a member-only purchaser move to
      member-and-family coverage, and divorce, death or loss of the last eligible family member lets a
      member-and-family purchaser move to member-only, where coverage_type_change_on_qle_allowed is true;
      the move is always to the tier named in coverage_type_change_target. The change must be requested no later than the coverage_type_change_window_days after the life event recorded in DEERS.
      The change window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus coverage_type_change_window_days and a request on that day is timely while one on the next day is not.
      The new coverage type takes effect on the DEERS event date. For every coverage month from the event
      date onward that was already billed at the old rate, the difference between the new and old
      monthly_premium is billed (an upward change, as a coverage_type_adjustment bill) or credited (a
      downward change, as a credit with reason coverage_type_change); for the month containing the event
      date the difference is prorated by the days from the event date to month end over the days in that
      month, rounded to the cent. TRICARE Young Adult has no coverage-type change.
    eligibility:
      - id: change_window
        applies_to: [premium_coverage_type_change]
        kind: time
        condition: The change must be requested no later than the coverage_type_change_window_days after the life event recorded in DEERS.
        evidence_fields: [deers_life_events.life_event_id, deers_life_events.event_date, deers_life_events.event_kind]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deers_life_events.life_event_id]
          action_bindings:
            deers_life_events.life_event_id: qualifying_life_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the life event recorded in DEERS
          anchor_source: deers_life_events.event_date
          relation: not_after
          duration_source: variants.coverage_type_change_window_days
          unit: calendar_days
          counting_rule: The change window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus coverage_type_change_window_days and a request on that day is timely while one on the next day is not.
          boundary: inclusive
    params:
      per_tier:
        TRICARE Reserve Select Member-Only: {coverage_type_change_target: "=coverage_type_change_target", monthly_premium: "=monthly_premium"}
        TRICARE Reserve Select Member-and-Family: {coverage_type_change_target: "=coverage_type_change_target", monthly_premium: "=monthly_premium"}
        TRICARE Young Adult Select: {coverage_type_change_target: "=coverage_type_change_target", monthly_premium: "=monthly_premium"}
        TRICARE Retired Reserve Member-Only: {coverage_type_change_target: "=coverage_type_change_target", monthly_premium: "=monthly_premium"}
        TRICARE Young Adult Prime: {coverage_type_change_target: "=coverage_type_change_target", monthly_premium: "=monthly_premium"}
        TRICARE Retired Reserve Member-and-Family: {coverage_type_change_target: "=coverage_type_change_target", monthly_premium: "=monthly_premium"}
      days_in_month: number of calendar days in the month containing the event date
      new_monthly_premium: monthly_premium of the coverage_type_change_target tier
    formula:
      partial_month_adjustment: round(abs(new_monthly_premium - monthly_premium) * coverage_days / days_in_month, 2)
      whole_month_adjustment: round(abs(new_monthly_premium - monthly_premium), 2)

  - id: premium_termination_and_refund
    subject: [premium_terminate_request, premium_proration_credit, premium_refund]
    rule: >-
      A purchaser may end the plan at any time, but only by their own confirmation: the agent records the
      request as an intake and the purchaser confirms it. Termination takes effect under
      termination_effective_rule - on the later of the date the purchaser asks for and the date the request
      is made, never retroactively - and starts no lockout. Premium paid for days after the termination date
      is credited back: the month containing the termination date is credited for the days after the
      termination date at monthly_premium times those days over the days in the month, every later paid
      month in full. A credit is posted only against a bill that has a payment posted against it.
      A credit balance is refunded through the original payment method within premium_refund_issue_days.
      A termination for loss of eligibility or the purchaser's death is credited the same way.
    eligibility:
      - id: credit_against_paid_bill
        applies_to: [premium_proration_credit]
        kind: authorization
        condition: A credit is posted only against a bill that has a payment posted against it.
        evidence_fields: [premium_ledger.premium_entry_id, premium_ledger.related_premium_entry_id, premium_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premium_ledger.premium_entry_id]
          action_bindings:
            premium_ledger.premium_entry_id: related_premium_entry_id
    params:
      days_in_month: number of calendar days in the month containing the termination date
    formula:
      partial_month_credit: round(monthly_premium * coverage_days / days_in_month, 2)

  - id: premium_reinstatement
    subject: [premium_reinstate]
    rule: >-
      A nonpayment termination is reversed only through an Enrollment Reinstatement Review. The plan is reinstated only when an Enrollment Reinstatement Review case for this plan is decided overturned and every past-due premium through the current month has a payment posted.
      Reinstatement restores coverage from the day after the old paid-through date with no gap and cancels
      the purchase lockout.
    eligibility:
      - id: reinstatement_review_overturned
        applies_to: [premium_reinstate]
        kind: authorization
        condition: The plan is reinstated only when an Enrollment Reinstatement Review case for this plan is decided overturned and every past-due premium through the current month has a payment posted.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.subject_enrollment_id, appeal_cases.status, premium_ledger.premium_enrollment_id, premium_ledger.related_premium_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
            - [appeal_cases.subject_enrollment_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id
            appeal_cases.subject_enrollment_id: premium_enrollment_id

  - id: premium_claims_cost_shares
    subject: [premium_claim_line_post, premium_claim_line_reverse, premium_ohi_update]
    rule: >-
      Claims under a premium-based plan are priced with the plan's own cost-share keys: the cost_share_key
      is the sponsor's entry group (group_a before 2018-01-01, group_b on or after) followed, for TRICARE
      Reserve Select and TRICARE Young Adult, by the pay-grade band of the sponsor (e1_to_e4 or
      e5_and_above) and, for TRICARE Retired Reserve, by retiree. The deductible, family catastrophic cap
      and outpatient percentages are the values the tier's mappings give for that key, and for a group_b
      key network outpatient care carries the fixed network copayments of the TRICARE Select tier of the
      same group and band (the TRICARE Select Retiree Group B tier for group_b_retiree); deductibles and
      caps are calendar-year family accumulators of the service date (premium_msr_individual_deductible_ytd,
      premium_msr_family_catastrophic_ytd) and premiums never count toward them. Once the family reaches
      its cap the line carries no liability. TRICARE Young Adult Prime and TRICARE Reserve Select members
      in a Prime Service Area receive PCM services only where pcm_required is true, and point-of-service
      charges apply only where pos_option_available is true. TRICARE pays after other health insurance.
      A reversal withdraws exactly one adjudicated line's deductible and liability, at most once.
      The line being reversed has not already been reversed.
    eligibility:
      - id: line_not_already_reversed
        applies_to: [premium_claim_line_reverse]
        kind: dedup
        condition: The line being reversed has not already been reversed.
        evidence_fields: [premium_claim_lines.premium_claim_line_id, premium_claim_lines.reversed_claim_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premium_claim_lines.premium_claim_line_id]
          action_bindings:
            premium_claim_lines.premium_claim_line_id: reversed_claim_line_id
        dedup_contract:
          table: premium_claim_lines
          mode: separate_record
          object_bindings: {reversed_claim_line_id: reversed_claim_line_id}
          duplicate_filters: {event_type: [premium_claim_line_reverse]}
          distinct_fields: []
    measures: [premium_msr_individual_deductible_ytd, premium_msr_family_catastrophic_ytd]

  - id: premium_survivor_and_activation
    subject: [premium_terminate_ineligible, premium_purchase]
    rule: >-
      When the purchaser of a member-and-family plan dies, the surviving family members keep coverage
      under survivor_continuation_rule and are billed at the member-and-family rate until it ends. When a
      TRICARE Reserve Select member is called to active duty for more than 30 days the plan ends under
      activation_effect on the day before the orders start, unpaid future bills are cancelled by a credit,
      and the member may buy the plan again within the qualifying-life-event window after deactivation.
      A TRICARE Retired Reserve plan ends under coverage_end_rule when the member reaches
      coverage_end_age_years and the member and family then enroll in TRICARE Prime or TRICARE Select as
      retirees within the qualifying-life-event window.
    eligibility: []

extended_policies:
- id: premium_ext_early_duty_month_credit
  base_policy_refs: &id001
  - premium_termination_and_refund
  - premium_coverage_type_rules
  - premium_survivor_and_activation
  - premium_billing_schedule
  overwrite:
  - base_policy: premium_termination_and_refund
    superseded_clause: >-
      Premium paid for days after the termination date is credited back: the month containing the termination date
      is credited for the days after the termination date at monthly_premium times those days over the days in the
      month, every later paid month in full.
    replaced_by: >-
      For the most recently paid month of a TRICARE Reserve Select plan whose purchaser came under active duty TRICARE
      coverage in it, the early-duty month credit takes the place of the termination credit for that month's bill;
      every other paid month, and every plan of another kind, keeps the termination credit.
  trigger: state_due
  subject:
  - premium_proration_credit
  computes: amount
  target_tool: post_early_duty_month_credit_9948ac5b
  params: {}
  rule: >-
    When the purchaser of a TRICARE Reserve Select plan comes under active duty TRICARE coverage during the most
    recently paid coverage month, and a later coverage month has already been billed, the monthly bill of that most
    recently paid month owes an early-duty month credit for the days of the month the active duty coverage carried,
    posted against it as an activation-on-orders credit. For the most recently paid month of a TRICARE Reserve Select
    plan whose purchaser came under active duty TRICARE coverage in it, the early-duty month credit takes the place
    of the termination credit for that month's bill; every other paid month, and every plan of another kind, keeps
    the termination credit. The early-duty month credit is figured as the days of the most recently paid month after
    the plan's termination date, multiplied by the amount billed for that month divided by the days its bill covers,
    with nothing taken off or added for coverage-type changes, rounded to the cent once at the end. The day the
    early-duty month credit is counted from follows the purchaser's TRICARE Prime Active Duty Service Member enrollment:
    where that enrollment is applied or active and its effective date falls inside the most recently paid month,
    the early-duty month credit is counted from that effective date; where that enrollment is applied or active
    and its effective date falls before the most recently paid month began, the early-duty month credit is counted
    from the first day of the month; otherwise the early-duty month credit is counted from the plan's termination
    date. Active duty days count toward the early-duty month credit only as the length of that coverage allows:
    where the active duty enrollment shows its coverage running more than 30 days from its effective date, those
    days count from the enrollment's effective date; where it shows its coverage running 30 days or fewer, no day
    counts; otherwise days count only after the plan's termination date. Whether the day the early-duty month credit
    is counted from is itself counted follows the application for that active duty enrollment: where the early-duty
    month credit is counted from the enrollment's effective date or from the first day of the month and the enrollment
    was applied for on or before that day, that day is the first day counted; where it is counted from either of
    those days and the enrollment was applied for after that day, the first day counted is the day after the application
    date; otherwise the first day counted is the day after the day the early-duty month credit is counted from.
    A coverage-type change already settled for the most recently paid month changes what the early-duty month credit
    returns: where a coverage-type change credit stands against that month's bill, that credit is taken off; where
    a coverage-type adjustment bill for that month has a payment posted against it, that adjustment is added; otherwise
    nothing is taken off or added. The change in the early-duty month credit is spread over days: where the change
    credit covers only part of the month, it is spread over the days that credit covers; where the paid adjustment
    bill covers only part of the month, it is spread over the days that adjustment covers; otherwise it is spread
    over every day of the month. Which credited days the change in the early-duty month credit applies to follows
    the period it covers: where the change credit or paid adjustment covers only part of the month, it applies only
    to the credited days from the first day it covers; where it covers the whole month, it applies to every credited
    day; otherwise it applies to no credited day. The early-duty month credit is the number of credited days, from
    the first day counted through the last day of the month, multiplied by the amount billed divided by the days
    the bill covers, less the change taken off or plus the change added, spread over its days, for each credited
    day it applies to; it is rounded to the cent once, at the end, and is never less than zero.
