      begins in the current plan year on or before today.
    cu_year_val: >-
      Where the enrollment's payment arrangement is monthly, the catch-up charge is the months it bills at the monthly
      rate, less what TRICARE Select's coverage takes off; where the arrangement is quarterly, it is the quarters
      from the one containing its first month through the one containing its last month at the quarterly installment,
      less the installment charges whose coverage begins from the first month of that first quarter through its
      last month, less what TRICARE Select's coverage takes off and less the months the region bears at the monthly
      rate; otherwise it is the plan year's annual fee less the installment charges on the account whose coverage
      begins in the current plan year on or before today.
    cu_amount: >-
      Where the enrollment's payment arrangement is monthly, the catch-up charge is the months it bills at the monthly
      rate, less what TRICARE Select's coverage takes off; where the arrangement is quarterly, it is the quarters
      from the one containing its first month through the one containing its last month at the quarterly installment,
      less the installment charges whose coverage begins from the first month of that first quarter through its
      last month, less what TRICARE Select's coverage takes off and less the months the region bears at the monthly
      rate; otherwise it is the plan year's annual fee less the installment charges on the account whose coverage
      begins in the current plan year on or before today.
    cu_new: >-
      This policy settles the charge for the catch-up installment of a fee-bearing TRICARE Prime enrollment that
      an Enrollment Reinstatement Review brought back after a nonpayment disenrollment, covering months of its restored
      coverage that carry no installment charge; no catch-up is charged on an enrollment that took effect in the
      current plan year.
    result: The catch-up charge is never below zero and is rounded to the cent.
