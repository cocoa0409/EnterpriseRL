events:
  - type: prime_enroll
    target: prime_enrollments
    mutation: create
    meaning: A beneficiary's application to enroll in a TRICARE Prime option is received and recorded.
    grain: one row per beneficiary enrollment application
    fields:
      customer_id: the enrolling beneficiary
      variant_name: the Prime option and beneficiary-category tier applied for, as its official full name
      enrollment_effective_date: the date coverage starts once processed (DEERS qualifying-life-event date, or January 1 for an open-season election)
      enrollment_reason: why the enrollment is being made (initial eligibility, open season, qualifying life event, region transfer in)
      qualifying_life_event_id: the DEERS life-event record the enrollment relies on; empty for open-season and initial-eligibility enrollments
      application_date: the date the application was received
      fee_bearing: whether this enrollment carries the sponsor family's enrollment-fee billing
      fee_coverage_type: individual or family fee, or not_applicable for fee-exempt tiers
      payment_frequency: installment frequency elected for the enrollment fee
      payment_method: payment method elected for the enrollment fee
      ohi_on_file: whether other health insurance is on file for the beneficiary at enrollment
    triggers:
      - event: prime:prime_fee_charge
        when: {fee_bearing: true}
        map: {prime_enrollment_id: prime_enrollment_id, customer_id: customer_id, installment_frequency: payment_frequency, coverage_period_start: enrollment_effective_date}
  - type: prime_activate
    target: prime_enrollments
    mutation: {transition: {from: applied, to: active}}
    meaning: The enrollment is processed and coverage under the Prime option begins.
    grain: one row per transaction
    fields:
      status: set to active
      enrollment_effective_date: confirmed coverage start date
    triggers:
      - event: prime:prime_pcm_assign
        map: {prime_enrollment_id: prime_enrollment_id, customer_id: customer_id, assignment_reason: initial_enrollment, effective_date: enrollment_effective_date}
  - type: prime_reject
    target: prime_enrollments
    mutation: {transition: {from: applied, to: rejected}}
    meaning: An enrollment application is rejected without coverage starting.
    grain: one row per transaction
    fields:
      status: set to rejected
    triggers: []
  - type: prime_fee_charge
    target: prime_fee_ledger
    meaning: An enrollment-fee installment is charged for one coverage period of a fee-bearing enrollment.
    grain: one installment charge for one coverage period
    distinguish_by: [coverage_period_start, installment_frequency]
    fields:
      prime_enrollment_id: the fee-bearing enrollment billed
      customer_id: the beneficiary who holds the fee-bearing enrollment
      coverage_period_start: first day of the coverage period the installment pays for
      coverage_period_end: last day of the coverage period the installment pays for
      installment_frequency: annual, quarterly or monthly
      amount: installment amount charged, positive USD
      posted_date: date the charge was posted
    account: enrollment_fee_due
    direction: in
    triggers: []
  - type: prime_fee_payment
    target: prime_fee_ledger
    meaning: A payment against an enrollment-fee installment is received.
    grain: one payment applied to one installment charge
    distinguish_by: [related_fee_entry_id, posted_date]
    fields:
      prime_enrollment_id: the fee-bearing enrollment paid
      customer_id: the beneficiary who holds the fee-bearing enrollment
      related_fee_entry_id: the installment charge this payment settles
      amount: amount paid, positive USD
      payment_method: method used for this payment
      posted_date: date the payment was received
    account: enrollment_fee_due
    direction: out
    triggers: []
  - type: prime_fee_credit
    target: prime_fee_ledger
    meaning: A proration credit returns the prepaid enrollment fee for whole calendar months after an enrollment ends for a credit-eligible reason.
    grain: one proration credit against one paid installment
    distinguish_by: [related_fee_entry_id, adjustment_reason]
    fields:
      prime_enrollment_id: the fee-bearing enrollment credited
      customer_id: the beneficiary who holds the fee-bearing enrollment
      related_fee_entry_id: the paid installment charge whose unused months are credited
      adjustment_reason: the credit-eligible reason the enrollment ended
      coverage_period_start: first whole calendar month credited
      coverage_period_end: last day of the credited span
      amount: credit amount, positive USD
      posted_date: date the credit was posted
    account: enrollment_fee_due
    direction: out
    triggers: []
  - type: prime_fee_refund
    target: prime_fee_ledger
    meaning: A credit balance on a fee-bearing enrollment is refunded to the beneficiary.
    grain: one refund of one posted credit
    distinguish_by: [related_fee_entry_id]
    fields:
      prime_enrollment_id: the fee-bearing enrollment refunded
      customer_id: the beneficiary who holds the fee-bearing enrollment
      related_fee_entry_id: the proration credit (or overpayment) being refunded
      amount: refund amount, positive USD
      payment_method: method the refund is returned through
      posted_date: date the refund was issued
    account: enrollment_fee_due
    direction: in
    triggers: []
  - type: prime_pcm_assign
    target: prime_pcm_assignments
    meaning: A primary care manager is assigned to the Prime enrollee, effective on a stated date.
    grain: one PCM assignment taking effect on one date
    distinguish_by: [provider_id, effective_date]
    fields:
      prime_enrollment_id: the enrollment whose PCM changes
      customer_id: the enrollee
      provider_id: the provider or military clinic assigned as PCM
      effective_date: date the assignment takes effect
      assignment_reason: why the assignment is made
      access_waiver_signed: whether a signed access-standard waiver covers this PCM
    triggers: []
  - type: prime_access_waiver_signed
    target: prime_pcm_assignments
    meaning: The enrollee (or the sponsor for a minor) signs a waiver of the primary care drive-time access standard for a chosen PCM outside the residence Prime Service Area.
    grain: one signed waiver for one chosen PCM
    distinguish_by: [provider_id, effective_date]
    fields:
      prime_enrollment_id: the enrollment the waiver belongs to
      customer_id: the enrollee
      provider_id: the PCM the waiver covers
      effective_date: date the waiver was signed
      access_waiver_signed: always true on a waiver row
    triggers: []
  - type: prime_claim_line_post
    target: prime_claim_lines
    meaning: One line of a Prime claim is adjudicated and the beneficiary cost share is assessed.
    grain: one adjudicated line of one claim
    distinguish_by: [claim_number, line_number]
    fields:
      prime_enrollment_id: enrollment the care was billed under
      customer_id: the patient
      claim_number: the claim number printed on the TRICARE Explanation of Benefits
      line_number: the line on that claim
      service_date: date of service
      provider_id: rendering provider
      service_class: benefit class of the service
      referral_authorization_id: the referral or authorization that covers the line; empty when none
      pos_applied: whether point-of-service charges were applied
      allowed_amount: TRICARE allowed amount for the line
      ohi_paid_amount: amount paid by other health insurance first
      pos_deductible_applied: part of the cost share that went to the point-of-service deductible
      cost_share_amount: beneficiary cost share assessed on the line (copayment, or POS deductible plus POS cost share)
      posted_date: adjudication date
    account: cost_share_accrued
    direction: in
    triggers: []
  - type: prime_claim_line_reverse
    target: prime_claim_lines
    meaning: A previously adjudicated Prime claim line is reversed and its cost share withdrawn.
    grain: one reversal of one adjudicated claim line
    distinguish_by: [reversed_claim_line_id]
    fields:
      prime_enrollment_id: enrollment of the original line
      customer_id: the patient
      claim_number: claim number of the original line
      line_number: line number of the original line
      reversed_claim_line_id: the adjudicated line being reversed
      reversal_reason: why the line is reversed
      pos_deductible_applied: POS deductible withdrawn with the reversal
      cost_share_amount: cost share withdrawn, equal to the original line's cost share
      posted_date: reversal date
    account: cost_share_accrued
    direction: out
    triggers: []
  - type: prime_disenroll_voluntary
    target: prime_enrollments
    mutation: {transition: {from: active, to: disenrolled_voluntary}}
    meaning: The beneficiary confirms leaving TRICARE Prime.
    grain: one row per transaction
    fields:
      status: set to disenrolled_voluntary
      disenrollment_date: last day of Prime coverage
    triggers: []
  - type: prime_disenroll_nonpayment
    target: prime_enrollments
    mutation: {transition: {from: active, to: disenrolled_nonpayment}}
    meaning: The enrollment ends because an enrollment-fee installment went unpaid past the grace period.
    grain: one row per transaction
    fields:
      status: set to disenrolled_nonpayment
      disenrollment_date: paid-through date of the enrollment
    triggers: []
  - type: prime_reinstate
    target: prime_enrollments
    mutation: {transition: {from: disenrolled_nonpayment, to: active}}
    meaning: A nonpayment disenrollment is reversed and the enrollment restored without a break in coverage.
    grain: one row per transaction
    fields:
      prime_enrollment_id: the enrollment being restored
      status: set back to active
      disenrollment_date: cleared to empty
    triggers: []
  - type: prime_terminate_ineligible
    target: prime_enrollments
    mutation: {transition: {from: active, to: terminated_ineligible}}
    meaning: The enrollment ends because DEERS no longer shows eligibility for the Prime option.
    grain: one row per transaction
    fields:
      status: set to terminated_ineligible
      disenrollment_date: last day of eligibility shown in DEERS
    triggers: []
  - type: prime_transfer_out
    target: prime_enrollments
    mutation: {transition: {from: active, to: transferred_out}}
    meaning: The enrollment is transferred to another region after the beneficiary moves.
    grain: one row per transaction
    fields:
      status: set to transferred_out
      disenrollment_date: last day of West Region enrollment
    triggers: []
  - type: prime_payment_setup_update
    target: prime_enrollments
    mutation: update
    meaning: The installment frequency or payment method for the enrollment fee is changed.
    grain: one row per transaction
    fields:
      payment_frequency: new installment frequency
      payment_method: new payment method
    triggers: []
  - type: prime_fee_policy_update
    target: prime_enrollments
    mutation: update
    meaning: The fee arrangement of the sponsor family changes - the family moves between the individual and the family enrollment fee, or the fee-bearing enrollment moves to another family member.
    grain: one row per transaction
    fields:
      fee_bearing: whether this enrollment now carries the family's fee billing
      fee_coverage_type: individual, family or not_applicable after the change
    triggers: []
  - type: prime_ohi_update
    target: prime_enrollments
    mutation: update
    meaning: Other health insurance is reported or removed for the enrollee.
    grain: one row per transaction
    fields:
      ohi_on_file: whether other health insurance is now on file
    triggers: []

measures:
  - id: prime_msr_family_catastrophic_ytd
    window: the calendar plan year (January 1 through December 31) that contains the service date of the line being adjudicated
    measure: sum, across every Prime enrollment whose holder shares the patient's sponsor_customer_id, of cost_share_amount on prime_claim_line_post rows with pos_applied false minus cost_share_amount on the matching prime_claim_line_reverse rows, plus - where fees_count_toward_catastrophic_cap is true - the amount of prime_fee_payment rows whose installment's coverage_period_start falls in that plan year
  - id: prime_msr_pos_deductible_ytd
    window: the calendar plan year that contains the service date of the line being adjudicated
    measure: per beneficiary and per sponsor family, sum of pos_deductible_applied on prime_claim_line_post rows minus the same field on matching prime_claim_line_reverse rows
  - id: prime_msr_paid_through_date
    window: the life of the fee-bearing enrollment
    measure: the latest coverage_period_end among prime_fee_charge rows whose amount is fully settled by prime_fee_payment rows referencing them (related_fee_entry_id)

policies:
  - id: prime_agg_multi_holding
    subject: [prime_enroll]
    rule: >-
      A beneficiary may hold at most one Prime enrollment at a time. An application for a beneficiary
      who already has an applied or active Prime enrollment is not a second enrollment; a change of
      Prime option inside the region (for example from TRICARE Prime Remote Active Duty Family Member
      to TRICARE Prime Active Duty Family Member after a move into a Prime Service Area) ends the old
      enrollment and starts the new one on the qualifying-life-event date. A beneficiary may not be
      enrolled in TRICARE Prime and TRICARE Select, or in TRICARE Prime and a premium-based plan, at
      the same time; holding an active TRICARE Select or premium-based plan enrollment means the Prime
      election is a plan change that ends the other enrollment on the day before the Prime effective date.
      The beneficiary has no applied or active Prime enrollment in the region on the application date.
    eligibility:
      - id: no_open_prime_enrollment
        applies_to: [prime_enroll]
        kind: dedup
        condition: The beneficiary has no applied or active Prime enrollment in the region on the application date.
        evidence_fields: [prime_enrollments.customer_id, prime_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_enrollments.customer_id]
          action_bindings:
            prime_enrollments.customer_id: customer_id
        dedup_contract:
          table: prime_enrollments
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active]}
          distinct_fields: [enrollment_effective_date]
    params:
      max_per_customer: 1

  - id: prime_tier_eligibility
    subject: [prime_enroll, prime_activate, prime_reject, prime_terminate_ineligible]
    rule: >-
      The Prime tier is fixed by the beneficiary's DEERS record, never by what the caller says about
      themselves. The DEERS beneficiary category must be one of the tier's eligible_beneficiary_categories.
      Residence decides between Prime and Prime Remote: a residence_service_area that is a Prime Service
      Area admits only the tiers whose residence_requirement is inside_prime_service_area, and a
      residence_service_area of non_psa admits only the tiers whose residence_requirement is
      outside_prime_service_area; a family member qualifies for TRICARE Prime Remote Active Duty Family
      Member only while residing with a sponsor who holds TRICARE Prime Remote Active Duty Service Member.
      For retirees, their family members and survivors the sponsor entry group decides between Group A
      and Group B - a sponsor whose sponsor_initial_entry_date is before 2018-01-01 is Group A and a
      sponsor whose sponsor_initial_entry_date is on or after 2018-01-01 is Group B. Survivors of a
      sponsor who died on active duty are transitional survivors for the transitional survivor period
      and hold TRICARE Prime Transitional Survivor; afterwards they take the retiree tier of the sponsor's
      group. Active duty service members are placed in Prime automatically and may not choose another plan.
      The beneficiary's DEERS beneficiary category, residence service area and sponsor entry date match the requested Prime tier.
      An application that fails this match is rejected, and an active enrollment whose DEERS record
      stops matching any Prime tier is terminated as ineligible on the last day of eligibility DEERS shows.
    eligibility:
      - id: deers_tier_match
        applies_to: [prime_enroll, prime_activate]
        kind: authorization
        condition: The beneficiary's DEERS beneficiary category, residence service area and sponsor entry date match the requested Prime tier.
        evidence_fields: [customers.customer_id, customers.beneficiary_category, customers.residence_service_area, customers.sponsor_initial_entry_date, customers.sponsor_customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      group_b_entry_date_boundary: "2018-01-01"
      transitional_survivor_period_years: 3

  - id: prime_enrollment_window
    subject: [prime_enroll, prime_activate, prime_reject]
    rule: >-
      A beneficiary who is not enrolled automatically may enroll in Prime only during the open season or
      after a qualifying life event. The open season runs from the Monday of the second full week of
      November through the Monday of the second full week of December, and an open-season election takes
      effect on January 1 of the following plan year. Outside the open season, a Prime enrollment rests
      on a qualifying life event that DEERS has recorded for the beneficiary (marriage, birth or adoption,
      divorce, a move, a change in the sponsor's status, loss or gain of other health insurance, death of
      the sponsor); the caller's own account of a life change is never a substitute for the DEERS record.
      The enrollment application must be received no later than the qle_enrollment_window_days after the qualifying life event recorded in DEERS.
      The window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus qle_enrollment_window_days and an application received on that day is timely while one received the next day is not.
      A qualifying-life-event enrollment takes effect on the DEERS event_date, not on the application
      date. Each qualifying life event supports one enrollment change per family member; an application
      that misses the window is rejected and the beneficiary may enroll at the next open season or after
      a new qualifying life event.
    eligibility:
      - id: qle_window
        applies_to: [prime_enroll]
        kind: time
        condition: The enrollment application must be received no later than the qle_enrollment_window_days after the qualifying life event recorded in DEERS.
        evidence_fields: [deers_life_events.life_event_id, deers_life_events.customer_id, deers_life_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deers_life_events.life_event_id]
          action_bindings:
            deers_life_events.life_event_id: qualifying_life_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the qualifying life event recorded in DEERS
          anchor_source: deers_life_events.event_date
          relation: not_after
          duration_source: variants.qle_enrollment_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus qle_enrollment_window_days and an application received on that day is timely while one received the next day is not.
          boundary: inclusive
    params:
      open_season_window: Monday of the second full week of November through Monday of the second full week of December

  - id: prime_enrollment_fee_schedule
    subject: [prime_fee_charge, prime_enroll, prime_activate, prime_fee_policy_update]
    rule: >-
      Enrollment fees are owed only by tiers whose fee_exempt is false, are set per calendar plan year,
      and are billed once per sponsor family to the fee-bearing enrollment - the sponsor's own enrollment
      when the sponsor is enrolled in Prime, otherwise the enrollment of the eldest enrolled family member.
      The family owes annual_fee_individual while exactly one family member is enrolled in Prime and
      annual_fee_family while two or more are; family members enrolled in TRICARE Select are billed
      separately under TRICARE Select and do not count toward the Prime family. An annual installment is
      the full annual fee, a quarterly installment is one quarter of it and a monthly installment is one
      twelfth of it, each rounded to the cent. Installments cover calendar quarters (January, April, July,
      October) or calendar months and are due on the first day of the period they cover. For an enrollment
      that starts mid-period, the first installment covers the months from the month containing the
      enrollment effective date (counted as a whole month) to the end of that installment period and
      equals one twelfth of the annual fee for each of those months. A first installment is charged
      together with the application. A fee-bearing enrollment is activated only after its first installment charge has a payment posted against it.
      Installments are charged only on a fee-bearing enrollment whose status is applied or active. When a second
      family member enrolls the family moves from the individual to the family fee from the next
      installment period, and when the family drops to one enrolled member it moves back to the
      individual fee from the next installment period.
    eligibility:
      - id: fee_bearing_enrollment_open
        applies_to: [prime_fee_charge]
        kind: state
        condition: Installments are charged only on a fee-bearing enrollment whose status is applied or active.
        evidence_fields: [prime_enrollments.prime_enrollment_id, prime_enrollments.status, prime_enrollments.fee_bearing]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_enrollments.prime_enrollment_id]
          action_bindings:
            prime_enrollments.prime_enrollment_id: prime_enrollment_id
        state_contract:
          field: prime_enrollments.status
          allowed: [applied, active]
      - id: first_installment_paid
        applies_to: [prime_activate]
        kind: authorization
        condition: A fee-bearing enrollment is activated only after its first installment charge has a payment posted against it.
        evidence_fields: [prime_fee_ledger.prime_enrollment_id, prime_fee_ledger.related_fee_entry_id, prime_fee_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_fee_ledger.prime_enrollment_id]
          action_bindings:
            prime_fee_ledger.prime_enrollment_id: prime_enrollment_id
    params:
      per_tier:
        TRICARE Prime Active Duty Service Member: {annual_fee_individual: "=annual_fee_individual", annual_fee_family: "=annual_fee_family", fee_exempt: "=fee_exempt"}
        TRICARE Prime Remote Active Duty Service Member: {annual_fee_individual: "=annual_fee_individual", annual_fee_family: "=annual_fee_family", fee_exempt: "=fee_exempt"}
        TRICARE Prime Active Duty Family Member: {annual_fee_individual: "=annual_fee_individual", annual_fee_family: "=annual_fee_family", fee_exempt: "=fee_exempt"}
        TRICARE Prime Remote Active Duty Family Member: {annual_fee_individual: "=annual_fee_individual", annual_fee_family: "=annual_fee_family", fee_exempt: "=fee_exempt"}
        TRICARE Prime Transitional Survivor: {annual_fee_individual: "=annual_fee_individual", annual_fee_family: "=annual_fee_family", fee_exempt: "=fee_exempt"}
        TRICARE Prime Retiree Group A: {annual_fee_individual: "=annual_fee_individual", annual_fee_family: "=annual_fee_family", fee_exempt: "=fee_exempt"}
        TRICARE Prime Retiree Group B: {annual_fee_individual: "=annual_fee_individual", annual_fee_family: "=annual_fee_family", fee_exempt: "=fee_exempt"}
      quarterly_divisor: 4
      monthly_divisor: 12
    formula:
      when_not: fee_exempt
      annual_fee: annual_fee_family if fee_coverage_type == "family" else annual_fee_individual
      monthly_rate: round(annual_fee / monthly_divisor, 2)
      quarterly_installment: round(annual_fee / quarterly_divisor, 2)

  - id: prime_fee_payment_methods
    subject: [prime_fee_payment, prime_payment_setup_update]
    rule: >-
      Monthly installments may be paid only through a method listed in monthly_payment_methods (a
      retired-pay allotment, electronic funds transfer or a recurring credit or debit card); annual and
      quarterly installments may also be paid with a single card payment or a check. An allotment is
      available only to a sponsor who draws retired pay. A change of frequency or method takes effect
      from the next installment period; an installment already due is paid under the old arrangement.
      A payment is applied to the oldest unpaid installment first and never to a future period while an
      earlier installment is open. The payment method on a fee payment is one the tier accepts for the enrollment's installment frequency.
    eligibility:
      - id: method_allowed_for_frequency
        applies_to: [prime_fee_payment, prime_payment_setup_update]
        kind: authorization
        condition: The payment method on a fee payment is one the tier accepts for the enrollment's installment frequency.
        evidence_fields: [prime_enrollments.prime_enrollment_id, prime_enrollments.variant_name, prime_enrollments.payment_frequency]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_enrollments.prime_enrollment_id]
          action_bindings:
            prime_enrollments.prime_enrollment_id: prime_enrollment_id

  - id: prime_nonpayment_disenrollment
    subject: [prime_disenroll_nonpayment, prime_fee_payment]
    rule: >-
      When an installment is not paid by its due date a delinquency letter is issued on the
      delinquency_notice_day after the due date. The enrollment is disenrolled for nonpayment only once more than nonpayment_grace_days have passed since the due date of the oldest unpaid installment.
      The grace period is counted in calendar days starting the day after the due date (the coverage_period_start of that installment), so disenrollment may be processed from the day after due date plus nonpayment_grace_days and not on that day itself.
      A payment received inside the grace period cures the delinquency. The disenrollment takes effect on the
      enrollment's paid-through date (prime_msr_paid_through_date), not on the processing date, and claims
      for later dates of service are denied. Every family member whose Prime enrollment relies on the same
      fee-bearing enrollment is disenrolled together. A beneficiary disenrolled for nonpayment may enroll
      again at the next open season or after a new qualifying life event, or ask for an Enrollment
      Reinstatement Review within reinstatement_request_window_days.
    eligibility:
      - id: grace_period_expired
        applies_to: [prime_disenroll_nonpayment]
        kind: time
        condition: The enrollment is disenrolled for nonpayment only once more than nonpayment_grace_days have passed since the due date of the oldest unpaid installment.
        evidence_fields: [prime_fee_ledger.prime_fee_entry_id, prime_fee_ledger.coverage_period_start, prime_fee_ledger.prime_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_fee_ledger.prime_fee_entry_id]
          action_bindings:
            prime_fee_ledger.prime_fee_entry_id: prime_fee_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the due date of the oldest unpaid installment
          anchor_source: prime_fee_ledger.coverage_period_start
          relation: not_before
          duration_source: variants.nonpayment_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date (the coverage_period_start of that installment), so disenrollment may be processed from the day after due date plus nonpayment_grace_days and not on that day itself.
          boundary: exclusive
    measures: [prime_msr_paid_through_date]

  - id: prime_reinstatement
    subject: [prime_reinstate]
    rule: >-
      A nonpayment disenrollment is reversed only through an Enrollment Reinstatement Review. The enrollment is reinstated only when an Enrollment Reinstatement Review case for this enrollment is decided overturned and every past-due installment through the current period has a payment posted.
      Reinstatement restores the enrollment from the day after the old paid-through date with no gap,
      the same PCM assignment and the same fee arrangement; claims denied for the gap are reprocessed.
      A request made after reinstatement_request_window_days, or without good cause shown, is not a
      reinstatement and the beneficiary must wait for the open season or a new qualifying life event.
    eligibility:
      - id: reinstatement_review_overturned
        applies_to: [prime_reinstate]
        kind: authorization
        condition: The enrollment is reinstated only when an Enrollment Reinstatement Review case for this enrollment is decided overturned and every past-due installment through the current period has a payment posted.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.subject_enrollment_id, appeal_cases.status, prime_fee_ledger.prime_enrollment_id, prime_fee_ledger.related_fee_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
            - [appeal_cases.subject_enrollment_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id
            appeal_cases.subject_enrollment_id: prime_enrollment_id

  - id: prime_pcm_selection
    subject: [prime_pcm_assign, prime_access_waiver_signed]
    rule: >-
      Every active Prime enrollee has exactly one PCM at a time; a new assignment replaces the previous
      one from its effective date and referrals already issued by the previous PCM stay valid until they
      expire. PCM assignments are made only on an enrollment whose status is active. The PCM's provider_kind must be one of the
      tier's pcm_setting_allowed. Active duty service members are assigned to a military hospital or clinic
      PCM by their unit and the military clinic, and a beneficiary request alone cannot move them to a
      network PCM. Every other enrollee may choose any network primary care provider whose panel_status is
      open, and may change PCM at any time without stating a reason; a change takes effect under the
      tier's pcm_change_effective_rule. A military hospital or clinic PCM requested by a tier whose
      mtf_pcm_requires_mtf_approval is true is a request to that facility, recorded as an intake and
      decided by the facility in order of mtf_access_priority_group. A provider whose specialty is
      pediatrics may serve as PCM only for an enrollee whose age on the effective date does not exceed
      pediatric_pcm_max_age_years. The chosen PCM's service_area must be the enrollee's residence_service_area, unless a signed access-standard waiver for that PCM is on file.
      A waiver may be signed only by tiers whose access_standard_waiver_allowed is true, only by the
      enrollee (or the sponsor or legal guardian for a minor), covers only the named PCM, and lapses
      when that PCM assignment ends. When a PCM leaves the network or closes the panel the region
      reassigns the enrollee and records the reason accordingly.
    eligibility:
      - id: enrollment_active_for_pcm
        applies_to: [prime_pcm_assign]
        kind: state
        condition: PCM assignments are made only on an enrollment whose status is active.
        evidence_fields: [prime_enrollments.prime_enrollment_id, prime_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_enrollments.prime_enrollment_id]
          action_bindings:
            prime_enrollments.prime_enrollment_id: prime_enrollment_id
        state_contract:
          field: prime_enrollments.status
          allowed: [active]
      - id: pcm_in_service_area_or_waived
        applies_to: [prime_pcm_assign]
        kind: authorization
        condition: The chosen PCM's service_area must be the enrollee's residence_service_area, unless a signed access-standard waiver for that PCM is on file.
        evidence_fields: [providers.provider_id, providers.service_area, providers.panel_status, providers.provider_kind, customers.residence_service_area, prime_pcm_assignments.provider_id, prime_pcm_assignments.access_waiver_signed]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [providers.provider_id]
          action_bindings:
            providers.provider_id: provider_id

  - id: prime_point_of_service
    subject: [prime_claim_line_post]
    rule: >-
      For tiers whose pos_option_available is true, non-emergency care that required a referral and was
      received without one - no approved referral authorization for the patient whose servicing provider
      and validity span cover the line's provider and service date - is paid under the point-of-service
      option. Point-of-service charges apply only to a line whose service_class is not in pos_exempt_service_classes and that no approved referral covers.
      Care from the enrollee's own PCM never triggers point-of-service charges. Under point-of-service the
      line first applies to the POS deductible until the beneficiary has met pos_deductible_individual or
      the family has met pos_deductible_family for the plan year (prime_msr_pos_deductible_ytd), and the
      beneficiary then pays pos_cost_share_pct of the remaining allowed amount. Point-of-service charges
      never count toward the catastrophic cap and are never stopped by it. Active duty service members
      have no point-of-service option; their unreferred civilian care is reviewed by the military
      medical support office and is not cost-shared to the member.
    eligibility:
      - id: pos_line_unreferred
        applies_to: [prime_claim_line_post]
        kind: authorization
        condition: Point-of-service charges apply only to a line whose service_class is not in pos_exempt_service_classes and that no approved referral covers.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.customer_id, referral_authorizations.status, referral_authorizations.servicing_provider_id, referral_authorizations.valid_from, referral_authorizations.valid_through]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.customer_id]
          action_bindings:
            referral_authorizations.customer_id: customer_id
    measures: [prime_msr_pos_deductible_ytd]
    formula:
      when: pos_applied
      pos_deductible_applied: min(allowed_amount, max(0, pos_deductible_individual - prime_msr_pos_deductible_ytd))
      cost_share_amount: round(pos_deductible_applied + (allowed_amount - pos_deductible_applied) * pos_cost_share_pct / 100, 2)

  - id: prime_network_cost_shares
    subject: [prime_claim_line_post]
    rule: >-
      A line not paid under point-of-service carries the tier's fixed copayment for its service_class
      (copay_primary_care_visit, copay_specialty_care_visit and the rest of the copayment schedule;
      durable medical equipment carries dme_cost_share_pct of the allowed amount). The copayment is never
      more than the allowed amount. Once the family's catastrophic total for the plan year
      (prime_msr_family_catastrophic_ytd) reaches the catastrophic cap for the sponsor's entry group, the
      line's cost share is zero for the rest of that calendar plan year, and a line that crosses the cap
      is cut to the amount still remaining under it. When other health insurance paid first, the
      beneficiary owes the lesser of the TRICARE cost share and the allowed amount left after the other
      insurer's payment.
    eligibility: []
    measures: [prime_msr_family_catastrophic_ytd]
    formula:
      when_not: pos_applied
      remaining_cap: max(0, catastrophic_cap_family - prime_msr_family_catastrophic_ytd)
      cost_share_amount: min(copay_specialist_or_class, allowed_amount - ohi_paid_amount, remaining_cap)
    params:
      copay_specialist_or_class: the copayment parameter that matches the line's service_class

  - id: prime_claim_line_reversal
    subject: [prime_claim_line_reverse]
    rule: >-
      A reversal withdraws exactly the cost share and POS deductible of one adjudicated line, identified
      by that line's own record, and is posted only for the reasons in reversal_reason (an overturned
      appeal, a duplicate claim, other health insurance found retroactively, a provider correction or
      reprocessing after the catastrophic cap was reached). A line is reversed at most once; a corrected
      line, when needed, is posted as a new claim line. The line being reversed has not already been reversed.
    eligibility:
      - id: line_not_already_reversed
        applies_to: [prime_claim_line_reverse]
        kind: dedup
        condition: The line being reversed has not already been reversed.
        evidence_fields: [prime_claim_lines.prime_claim_line_id, prime_claim_lines.reversed_claim_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_claim_lines.prime_claim_line_id]
          action_bindings:
            prime_claim_lines.prime_claim_line_id: reversed_claim_line_id
        dedup_contract:
          table: prime_claim_lines
          mode: separate_record
          object_bindings: {reversed_claim_line_id: reversed_claim_line_id}
          duplicate_filters: {event_type: [prime_claim_line_reverse]}
          distinct_fields: []

  - id: prime_fee_proration_credit
    subject: [prime_fee_credit, prime_fee_refund, prime_disenroll_voluntary, prime_terminate_ineligible, prime_transfer_out]
    rule: >-
      When a fee-bearing enrollment ends for a reason listed in fee_credit_eligible_reasons, the paid
      enrollment fee for every whole calendar month after the disenrollment date is credited back, at one
      twelfth of the annual fee per month; the month in which the disenrollment date falls is never
      credited. A nonpayment disenrollment earns no credit. A credit is posted against the paid
      installment whose months are unused, once per installment and reason. A credit that leaves the
      account with a credit balance is refunded through the method of the original payment within
      fee_refund_issue_days. A voluntary disenrollment needs the beneficiary's own confirmation - the
      agent records the request and the beneficiary confirms it - and takes effect on the date confirmed,
      never earlier than the confirmation. A credit is posted only against an installment charge that has a payment posted against it.
    eligibility:
      - id: credit_against_paid_installment
        applies_to: [prime_fee_credit]
        kind: authorization
        condition: A credit is posted only against an installment charge that has a payment posted against it.
        evidence_fields: [prime_fee_ledger.prime_fee_entry_id, prime_fee_ledger.related_fee_entry_id, prime_fee_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prime_fee_ledger.prime_fee_entry_id]
          action_bindings:
            prime_fee_ledger.prime_fee_entry_id: related_fee_entry_id
    formula:
      amount: round(credited_months * (annual_fee_family if fee_coverage_type == "family" else annual_fee_individual) / 12, 2)
    params:
      credited_months: count of whole calendar months after the disenrollment date that fall inside the paid installment's coverage period

  - id: prime_region_transfer
    subject: [prime_transfer_out, prime_pcm_assign]
    rule: >-
      A Prime enrollee who moves to a residence outside the West Region keeps Prime by transferring the
      enrollment to the gaining region; the transfer is processed when DEERS shows the new address, the
      West Region enrollment ends on the day before the gaining region's effective date, prepaid fees are
      credited under the proration rule, and the family's catastrophic total moves with it. A move inside
      the region is not a transfer: the enrollee keeps the enrollment and selects a PCM in the new Prime
      Service Area, or moves between Prime and Prime Remote on the DEERS move date. The DEERS record shows a residential move or permanent change of station for the beneficiary.
    eligibility:
      - id: deers_move_recorded
        applies_to: [prime_transfer_out]
        kind: authorization
        condition: The DEERS record shows a residential move or permanent change of station for the beneficiary.
        evidence_fields: [deers_life_events.life_event_id, deers_life_events.customer_id, deers_life_events.event_kind]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deers_life_events.life_event_id]
          action_bindings:
            deers_life_events.life_event_id: life_event_id

  - id: prime_ohi_coordination
    subject: [prime_ohi_update, prime_claim_line_post]
    rule: >-
      TRICARE is secondary payer to other health insurance for tiers whose tricare_secondary_to_ohi is
      true; Medicaid and TRICARE supplements are not other health insurance. Other health insurance is
      put on file or removed from the date the beneficiary reports it, and claim lines adjudicated earlier
      on the wrong basis are reversed and posted again. Active duty service members are never treated as
      having other health insurance. The ohi_paid_amount on a line is the other insurer's payment shown
      on its explanation of benefits and is never estimated.
    eligibility: []

extended_policies:
- id: prime_ext_reinstatement_catch_up
  base_policy_refs:
  - prime_enrollment_fee_schedule
  - prime_reinstatement
  - prime_nonpayment_disenrollment
  overwrite:
  - base_policy: prime_enrollment_fee_schedule
    superseded_clause: >-
      Installments cover calendar quarters (January, April, July, October) or calendar months and are due on the
      first day of the period they cover.
    replaced_by: >-
      The catch-up installment's coverage period runs from the first day of the first month it bills to the last
      day of the last month it bills, it carries the installment frequency of the enrollment's payment arrangement,
      and it falls due on the day it is posted.
  trigger: state_due
  subject:
  - prime_fee_charge
  computes: amount
  target_tool: post_catch_up_installment_4baf2609
  params:
    epoch: '2000-01-01'
    months_per_year: 12
    quarters_per_year: 4
  rule: >-
    This policy settles the charge for the catch-up installment of a fee-bearing TRICARE Prime enrollment that an
    Enrollment Reinstatement Review brought back after a nonpayment disenrollment, covering months of its restored
    coverage that carry no installment charge; no catch-up is charged on an enrollment that took effect in the current
    plan year. A catch-up installment bills every month from the month the reinstatement review was filed through
    the month before the current month that no monthly installment charge on the account begins in, and its charge
    is the plan year's annual fee less the installment charges on the account whose coverage begins in the current
    plan year on or before today, TRICARE Select coverage taking nothing off it. The annual fee of the enrollment's
    fee arrangement is the tier's annual individual fee for an individual arrangement and its annual family fee
    for a family arrangement. Each month is valued at one twelfth of the annual fee of the enrollment's fee arrangement
    - the tier's annual individual fee for an individual arrangement and its annual family fee for a family arrangement
    - rounded to the cent, and a quarterly installment at one quarter of that annual fee, rounded to the cent. Every
    installment charge on the account begins on the first day of the period it covers, except a first installment,
    which begins on the enrollment's effective date; a charge begins in the month containing that day. The catch-up
    installment's coverage period runs from the first day of the first month it bills to the last day of the last
    month it bills, it carries the installment frequency of the enrollment's payment arrangement, and it falls due
    on the day it is posted. Where the review's case file holds proof of payment, the catch-up starts with the month
    after the month the review was decided, the region bearing the gap its own billing error caused; where it holds
    medical records and no proof of payment, the catch-up starts with the month after the old paid-through date,
    the beneficiary owing every restored month; otherwise it starts with the month the review was filed, the region
    bearing the months before the beneficiary came forward. Where the review was decided more than twice its decision
    deadline after it was filed, counted in calendar days, the region bears every month from the month after the
    filing month through the month of the decision; where it was decided after its deadline but within twice it,
    the region bears the month of the decision; otherwise the region bears no month. A month the region bears is
    not billed. TRICARE Select coverage is read from the beneficiary's TRICARE Select enrollment: a month lies wholly
    inside it when it falls after the month containing the Select effective date and before the month containing
    the Select disenrollment date, or, where the Select enrollment has no disenrollment date, when it falls after
    the month containing the Select effective date; a month is touched by it when it contains the Select effective
    date or the Select disenrollment date. Where Select coverage holds a month the catch-up would bill wholly, that
    month is left out; where Select coverage only touches the month, the month is billed less Select's monthly share;
    otherwise the month is billed in full. Select's monthly share is read from the beneficiary's TRICARE Select
    installment charge whose coverage period begins latest: where it is a monthly installment, its whole amount;
    where it is a quarterly installment, one third of its amount, rounded to the cent; otherwise one twelfth of
    its amount, rounded to the cent. Where the enrollment's payment arrangement is monthly, the catch-up charge
    is the months it bills at the monthly rate, less what TRICARE Select's coverage takes off; where the arrangement
    is quarterly, it is the quarters from the one containing its first month through the one containing its last
    month at the quarterly installment, less the installment charges whose coverage begins from the first month
    of that first quarter through its last month, less what TRICARE Select's coverage takes off and less the months
    the region bears at the monthly rate; otherwise it is the plan year's annual fee less the installment charges
    on the account whose coverage begins in the current plan year on or before today. The catch-up charge is never
    below zero and is rounded to the cent.
  prerequisite: []
  cross_category:
  - category: appeal
    as: branch
    reads:
    - appeal_case_id
    - initial_determination_date
    - filing_date
    - decision_date
    - decision_deadline
    - appeal_case_documents.document_kind
    note: >-
      The Enrollment Reinstatement Review of the enrollment decides where the catch-up starts (its old paid-through
      date, filing date, decision and the documents in its case file) and which months the region bears for a late
      decision.
  - category: select
    as: history
    reads:
    - enrollment_effective_date
    - disenrollment_date
    - select_fee_ledger.coverage_period_start
    - select_fee_ledger.installment_frequency
    - select_fee_ledger.amount
    note: >-
      The beneficiary's TRICARE Select enrollment dates show which restored months Select coverage holds or touches,
      and its latest Select installment sets Select's monthly share.
  compute:
  - cu_now: MONTHS(K('epoch'), NOW)
  - cu_fi_n: >-
      COUNT('prime_fee_ledger', event_type='prime_fee_charge', installment_frequency='monthly', coverage_period_start=F('enrollment_effective_date'))
  - cu_fi_amt: >-
      SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', coverage_period_start=F('enrollment_effective_date'))
  - cu_fi_m: MONTHS(K('epoch'), F('enrollment_effective_date'))
  - cu_fi_lag: MONTHS(F('enrollment_effective_date'), NOW)
  - cu_fi_adj: cu_now - cu_fi_lag
  - cu_ann: (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - cu_m: RND(cu_ann / K('months_per_year'), 2)
  - cu_q: RND(cu_ann / K('quarters_per_year'), 2)
  - rv_case: >-
      CFIELD('appeal', 'appeal_case_id', variant_name='Enrollment Reinstatement Review', subject_enrollment_id=HID)
  - rv_paid_through: >-
      CFIELD('appeal', 'initial_determination_date', variant_name='Enrollment Reinstatement Review', subject_enrollment_id=HID)
  - rv_filed: >-
      CFIELD('appeal', 'filing_date', variant_name='Enrollment Reinstatement Review', subject_enrollment_id=HID)
  - rv_decided: >-
      CFIELD('appeal', 'decision_date', variant_name='Enrollment Reinstatement Review', subject_enrollment_id=HID)
  - rv_deadline: >-
      CPARAM('appeal', 'decision_deadline', variant_name='Enrollment Reinstatement Review', subject_enrollment_id=HID)
  - cu_mi_paid: MONTHS(K('epoch'), rv_paid_through)
  - cu_mi_filed: MONTHS(K('epoch'), rv_filed)
  - cu_mi_decided: MONTHS(K('epoch'), rv_decided)
  - cu_proof: XCOUNT('appeal', 'appeal_case_documents', document_kind='proof_of_payment', appeal_case_id=rv_case)
  - cu_med: XCOUNT('appeal', 'appeal_case_documents', document_kind='medical_records', appeal_case_id=rv_case)
  - cu_first: (cu_mi_decided + 1) if cu_proof > 0 else ((cu_mi_paid + 1) if cu_med > 0 else cu_mi_filed)
  - cu_last: cu_now - 1
  - cu_days: DAYS(rv_filed, rv_decided)
  - cu_borne_lo: >-
      (cu_mi_filed + 1) if cu_days > 2 * rv_deadline else (cu_mi_decided if cu_days > rv_deadline else 99999)
  - cu_blo: MX(cu_borne_lo, cu_first)
  - cu_bhi: MN(cu_mi_decided, cu_last)
  - cu_borne_n: >-
      (MX(0, cu_bhi - cu_blo + 1) - (COUNT('prime_fee_ledger', within_months=cu_now - (cu_blo) + 1, date_field='coverage_period_start',
      event_type='prime_fee_charge', installment_frequency='monthly') - COUNT('prime_fee_ledger', within_months=cu_now
      - (cu_bhi), date_field='coverage_period_start', event_type='prime_fee_charge', installment_frequency='monthly')
      + cu_fi_n * (((cu_blo) <= cu_fi_m <= (cu_bhi)) - ((cu_blo) <= cu_fi_adj <= (cu_bhi))))) if cu_bhi >= cu_blo
      else 0
  - cu_span_n: MX(0, cu_last - cu_first + 1)
  - cu_charged_n: >-
      (COUNT('prime_fee_ledger', within_months=cu_now - (cu_first) + 1, date_field='coverage_period_start', event_type='prime_fee_charge',
      installment_frequency='monthly') - COUNT('prime_fee_ledger', within_months=cu_now - (cu_last), date_field='coverage_period_start',
      event_type='prime_fee_charge', installment_frequency='monthly') + cu_fi_n * (((cu_first) <= cu_fi_m <= (cu_last))
      - ((cu_first) <= cu_fi_adj <= (cu_last)))) if cu_last >= cu_first else 0
  - cu_open_n: MX(0, cu_span_n - cu_charged_n - cu_borne_n)
  - cu_s_eff: CFIELD('select', 'enrollment_effective_date')
  - cu_s_end: CFIELD('select', 'disenrollment_date')
  - cu_s_lo: MONTHS(K('epoch'), cu_s_eff) if cu_s_eff else 99999
  - cu_s_hi: MONTHS(K('epoch'), cu_s_end) if cu_s_end else 99999
  - cu_lo_open: >-
      1 if (((cu_s_lo) >= cu_first and (cu_s_lo) <= cu_last) and (COUNT('prime_fee_ledger', within_months=cu_now
      - (cu_s_lo) + 1, date_field='coverage_period_start', event_type='prime_fee_charge', installment_frequency='monthly')
      - COUNT('prime_fee_ledger', within_months=cu_now - (cu_s_lo), date_field='coverage_period_start', event_type='prime_fee_charge',
