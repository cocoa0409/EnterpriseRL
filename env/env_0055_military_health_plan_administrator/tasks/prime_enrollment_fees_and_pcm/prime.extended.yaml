      being the whole annual fee of the enrollment's fee arrangement; the region keeps nothing of it on the account.
      The first installment charge is the installment charge whose coverage period begins on the enrollment's effective
      date. The duplicate refund is posted against the latest payment posted against the first installment charge
      and goes back through that payment's method. The annual fee of the enrollment's fee arrangement is the tier's
      annual individual fee for an individual arrangement and its annual family fee for a family arrangement.
