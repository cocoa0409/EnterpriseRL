- id: prime_ext_duplicate_payment_refund
  base_policy_refs:
  - prime_fee_proration_credit
  - prime_fee_payment_methods
  overwrite:
  - base_policy: prime_fee_proration_credit
    superseded_clause: >-
      A credit that leaves the account with a credit balance is refunded through the method of the original payment
      within fee_refund_issue_days.
    replaced_by: >-
      Where the enrollment pays through an allotment and the account shows payments collected through it, the region
      keeps two regular installments of the excess on the account; where it pays through a recurring card or electronic
      funds transfer and the account shows payments collected through that method, the region keeps one regular
      installment on the account; otherwise it keeps nothing.
  trigger: state_due
  subject:
  - prime_fee_refund
  computes: amount
  target_tool: refund_duplicate_payment_360f0d4a
  params:
    epoch: '2000-01-01'
    months_per_year: 12
    quarters_per_year: 4
  rule: >-
    This policy settles the refund owed when an installment of a fee-bearing TRICARE Prime enrollment whose status
    is applied or active has been paid more than once; it does not settle a duplicate on the first installment charge
    - the installment charge whose coverage period begins on the enrollment's effective date - of an enrollment
    that took effect in the current plan year. The installment a duplicate refund concerns is the one against which
    the payment posted most recently stands. The duplicate refund returns the smaller of the latest payment posted
    against that installment and its earlier payments together, less the refunds already issued against that latest
    payment, never more than the amount by which all of its payments exceed the installment's value less those refunds,
    and that value is the whole annual fee of the enrollment's fee arrangement; the region keeps nothing of it on
    the account. The duplicate refund is rounded to the cent, is posted against the latest payment posted against
    the refunded installment and goes back through that payment's method. The annual fee of the enrollment's fee
    arrangement is the tier's annual individual fee for an individual arrangement and its annual family fee for
    a family arrangement. Where a payment made through a method other than the enrollment's payment arrangement
    stands on the account, the duplicate refund concerns the installment against which the largest such payment
    stands; where none does but the largest single payment on the account exceeds the charge of the installment
    it was posted against, it concerns that installment; otherwise it concerns the installment against which the
    payment posted most recently stands. Of equally large payments the one posted latest is taken. Where the installment
    so chosen is the first installment charge of an enrollment that took effect in the current plan year, this policy
    refunds nothing. Where the refunded installment is a monthly installment, its value is one twelfth of the annual
    fee of the enrollment's fee arrangement, rounded to the cent; where it is a quarterly installment, one quarter
    of that fee, rounded to the cent; otherwise the whole annual fee. Where more than one payment stands against
    the refunded installment and the latest of them was made through a method other than the enrollment's payment
    arrangement, the duplicate refund returns that latest payment; where more than one stands and the latest was
    collected through the arrangement's own method, the duplicate refund returns the earlier payments together;
    otherwise it returns the smaller of the latest payment and the earlier payments together. Refunds already issued
    against the latest payment posted against the refunded installment come off both the payment the duplicate refund
    returns and its excess. Where the enrollment pays through an allotment and the account shows payments collected
    through it, the region keeps two regular installments of the excess on the account; where it pays through a
    recurring card or electronic funds transfer and the account shows payments collected through that method, the
    region keeps one regular installment on the account; otherwise it keeps nothing. A regular installment kept
    on the account is valued by the installment charge whose coverage period begins latest: where it is a monthly
    installment, one twelfth of the annual fee of the enrollment's fee arrangement, rounded to the cent; where it
    is a quarterly installment, one quarter of that fee, rounded to the cent; otherwise the whole annual fee. The
    duplicate refund is the payment it returns less what comes off it, never more than the excess less what comes
    off and less what the region keeps, never below zero, rounded to the cent.
  prerequisite: []
  cross_category: []
  compute:
  - dr_now: MONTHS(K('epoch'), NOW)
  - dr_ann: (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - dr_top_other: >-
      MX(0, (MAX('prime_fee_ledger', 'amount', event_type='prime_fee_payment', payment_method='allotment') if F('payment_method')
      != 'allotment' else 0), (MAX('prime_fee_ledger', 'amount', event_type='prime_fee_payment', payment_method='electronic_funds_transfer')
      if F('payment_method') != 'electronic_funds_transfer' else 0), (MAX('prime_fee_ledger', 'amount', event_type='prime_fee_payment',
      payment_method='recurring_card') if F('payment_method') != 'recurring_card' else 0), (MAX('prime_fee_ledger',
      'amount', event_type='prime_fee_payment', payment_method='card_single') if F('payment_method') != 'card_single'
      else 0), (MAX('prime_fee_ledger', 'amount', event_type='prime_fee_payment', payment_method='check') if F('payment_method')
      != 'check' else 0))
  - dr_top_inst: >-
      LATEST('prime_fee_ledger', 'related_fee_entry_id', date_field='posted_date', event_type='prime_fee_payment',
      amount=dr_top_other)
  - dr_top_all: MAX('prime_fee_ledger', 'amount', event_type='prime_fee_payment')
  - dr_top_all_inst: >-
      LATEST('prime_fee_ledger', 'related_fee_entry_id', date_field='posted_date', event_type='prime_fee_payment',
      amount=dr_top_all)
  - dr_top_all_chg: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', prime_fee_entry_id=dr_top_all_inst)
  - dr_last_pay_inst: >-
      LATEST('prime_fee_ledger', 'related_fee_entry_id', date_field='posted_date', event_type='prime_fee_payment')
  - dr_inst: >-
      dr_top_inst if dr_top_other > 0 else (dr_top_all_inst if dr_top_all > dr_top_all_chg else dr_last_pay_inst)
  - dr_freq: >-
      LATEST('prime_fee_ledger', 'installment_frequency', date_field='posted_date', prime_fee_entry_id=dr_inst)
  - dr_value: >-
      RND(dr_ann / K('months_per_year'), 2) if dr_freq == 'monthly' else (RND(dr_ann / K('quarters_per_year'), 2)
      if dr_freq == 'quarterly' else dr_ann)
  - dr_paid: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_payment', related_fee_entry_id=dr_inst)
  - dr_n_pay: COUNT('prime_fee_ledger', event_type='prime_fee_payment', related_fee_entry_id=dr_inst)
  - dr_late_id: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='posted_date', event_type='prime_fee_payment',
      related_fee_entry_id=dr_inst)
  - dr_late_amt: >-
      LATEST('prime_fee_ledger', 'amount', date_field='posted_date', event_type='prime_fee_payment', related_fee_entry_id=dr_inst)
      or 0
  - dr_late_method: >-
      LATEST('prime_fee_ledger', 'payment_method', date_field='posted_date', event_type='prime_fee_payment', related_fee_entry_id=dr_inst)
  - dr_pick: >-
      dr_late_amt if (dr_n_pay > 1 and dr_late_method != F('payment_method')) else ((dr_paid - dr_late_amt) if (dr_n_pay
      > 1 and dr_late_method == F('payment_method')) else MN(dr_late_amt, dr_paid - dr_late_amt))
  - dr_excess: RND(MX(0, dr_paid - dr_value), 2)
  - dr_ref_ret: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_refund', related_fee_entry_id=dr_late_id)
  - dr_cur_freq: >-
      LATEST('prime_fee_ledger', 'installment_frequency', date_field='coverage_period_start', event_type='prime_fee_charge')
  - dr_reg: >-
      RND(dr_ann / K('months_per_year'), 2) if dr_cur_freq == 'monthly' else (RND(dr_ann / K('quarters_per_year'),
      2) if dr_cur_freq == 'quarterly' else dr_ann)
  - dr_coll: COUNT('prime_fee_ledger', event_type='prime_fee_payment', payment_method=F('payment_method'))
  - dr_kept: >-
      2 * dr_reg if (F('payment_method') == 'allotment' and dr_coll > 0) else (dr_reg if ((F('payment_method') ==
      'recurring_card' or F('payment_method') == 'electronic_funds_transfer') and dr_coll > 0) else 0)
  - dr_first: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='posted_date', event_type='prime_fee_charge',
      coverage_period_start=F('enrollment_effective_date'))
  - dr_new_first: >-
      1 if (dr_first and dr_inst == dr_first and MONTHS(K('epoch'), F('enrollment_effective_date')) >= dr_now -
      dr_now % 12) else 0
  - result: >-
      0 if dr_new_first == 1 else RND(MX(0, MN(dr_pick - dr_ref_ret, dr_excess - dr_ref_ret - dr_kept)), 2)
