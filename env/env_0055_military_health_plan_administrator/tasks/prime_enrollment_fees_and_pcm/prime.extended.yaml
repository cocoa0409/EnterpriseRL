    a fee-bearing TRICARE Prime enrollment; it settles no payment toward an enrollment that took effect in the current
    plan year. A one-time payment settles the annual installment whose coverage period begins latest at the whole
    annual fee of the enrollment's fee arrangement, less the payments standing against it, plus the refunds issued
    against the latest payment on that installment, never below zero, rounded to the cent, and pays nothing ahead.
    The annual fee of the enrollment's fee arrangement is the tier's annual individual fee for an individual arrangement
    and its annual family fee for a family arrangement. Where the enrollment's payment arrangement is monthly, the
    one-time payment settles the monthly installment whose coverage period begins latest; where the arrangement
    is quarterly, it settles the quarterly installment whose coverage period begins latest; otherwise it settles
    the annual installment whose coverage period begins latest. Where the settled installment is a monthly installment,
    it is owed at one twelfth of the annual fee of the enrollment's fee arrangement, rounded to the cent; where
    it is a quarterly installment, at one quarter of that fee, rounded to the cent; otherwise at the whole annual
    fee. The payments standing against the settled installment count as received. Refunds issued against the latest
    payment on the settled installment are owed again. The method on file counts as lapsed when the account shows
    no payment collected through it since a starting month: where the enrollment was brought back by an Enrollment
    Reinstatement Review decided overturned, the month after the old paid-through date the review recorded; where
    the enrollment took effect in the current plan year, the month containing its effective date; otherwise the
