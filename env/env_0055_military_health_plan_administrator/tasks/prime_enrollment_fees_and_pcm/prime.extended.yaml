    and it counts as lapsed, it pays two regular installments ahead; otherwise it pays nothing ahead. An installment
    paid ahead is valued like the installment the method on file last collected, or, where it has never collected,
    like the settled installment: one twelfth of the annual fee of the enrollment's fee arrangement when that was
    a monthly installment, one quarter of it when it was a quarterly one, each rounded to the cent, and the whole
    annual fee otherwise. The one-time payment is what the settled installment is owed, less what counts as received,
