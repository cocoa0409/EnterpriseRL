- id: prime_ext_first_installment_supplement
  base_policy_refs:
  - prime_enrollment_fee_schedule
  - prime_agg_multi_holding
  overwrite:
  - base_policy: prime_enrollment_fee_schedule
    superseded_clause: >-
      For an enrollment that starts mid-period, the first installment covers the months from the month containing
      the enrollment effective date (counted as a whole month) to the end of that installment period and equals
      one twelfth of the annual fee for each of those months.
    replaced_by: >-
      Where the application was received after the end of the installment period containing the effective date,
      the first installment runs through the end of the installment period containing the application date; where
      it was received inside the installment period containing the effective date, twenty or more days after the
      effective date, it runs through the end of the installment period that follows; otherwise it runs through
      the end of the installment period containing the effective date.
  trigger: state_due
  subject:
  - prime_fee_charge
  computes: amount
  target_tool: post_first_installment_supplement_bc87e2fc
  params:
    epoch: '2000-01-01'
    months_per_year: 12
    quarters_per_year: 4
    late_application_days: 20
  rule: >-
    This policy settles the supplement charged on a fee-bearing TRICARE Prime enrollment whose first installment
    charge does not reach every month its first installment owes; no supplement is charged on an enrollment that
    took effect before the current plan year. A first installment owes the months from the month containing the
    enrollment effective date to the end of the installment period containing that date, installment periods being
    calendar months for a monthly arrangement, calendar quarters for a quarterly one and the calendar year for an
    annual one; the month containing the effective date counts at the monthly rate times the lesser of 30 and its
    days from the effective date through the last day of the coverage period of the installment charge beginning
    on the effective date, 30 where no such charge stands, over 30, every later month owed at the monthly rate,
    TRICARE Select coverage takes nothing off, and the installment charges posted on the application date count
    against it. The annual fee of the enrollment's fee arrangement is the tier's annual individual fee for an individual
    arrangement and its annual family fee for a family arrangement. The monthly rate is one twelfth of the annual
    fee of the enrollment's fee arrangement, rounded to the cent. Where the application was received after the end
    of the installment period containing the effective date, the first installment runs through the end of the installment
    period containing the application date; where it was received inside the installment period containing the effective
    date, twenty or more days after the effective date, it runs through the end of the installment period that follows;
    otherwise it runs through the end of the installment period containing the effective date. Where the enrollment
    came in by a transfer from another region, the month containing the effective date is not billed; where it rests
    on a qualifying life event, that month counts as a whole month at the monthly rate; otherwise that month counts
    at the monthly rate times the lesser of 30 and its days from the effective date through the last day of the
    coverage period of the installment charge beginning on the effective date, 30 where no such charge stands, over
    30, rounded to the cent. TRICARE Select coverage is read from the beneficiary's TRICARE Select enrollment: a
    month lies wholly inside it when it falls after the month containing the Select effective date and before the
    month containing the Select disenrollment date, or, where the Select enrollment has no disenrollment date, when
    it falls after the month containing the Select effective date; a month is touched by it when it contains the
    Select effective date or the Select disenrollment date. Where Select coverage holds a month the first installment
    owes wholly, that month is left out; where Select coverage only touches the month, the month is billed less
    Select's monthly share; otherwise the month is billed in full. Select's monthly share is read from the beneficiary's
    TRICARE Select installment charge whose coverage period begins latest: where it is a monthly installment, its
    whole amount; where it is a quarterly installment, one third of its amount, rounded to the cent; otherwise one
    twelfth of its amount, rounded to the cent. The first installment is the month containing the effective date
    at its value and every later month it owes at the monthly rate, less what TRICARE Select's coverage takes off,
    rounded to the cent. Where an installment charge on the account was posted after the application date, every
    installment charge on the account counts against it; where none was and the application was received before
    the effective date, the installment charge beginning on the effective date counts against it; otherwise the
    installment charges posted on the application date count against it. The supplement's coverage period runs from
    the first day of the first month the first installment owes that no counted charge covers to the last day of
    the last such month; it carries the installment frequency of the enrollment's payment arrangement and falls
    due on the day it is posted. The supplement is the first installment so figured less the charges that count
    against it, never below zero, rounded to the cent.
  prerequisite: []
  cross_category:
  - category: select
    as: history
    reads:
    - enrollment_effective_date
    - disenrollment_date
    - select_fee_ledger.coverage_period_start
    - select_fee_ledger.installment_frequency
    - select_fee_ledger.amount
    note: >-
      The beneficiary's TRICARE Select enrollment dates show which months of the first installment Select coverage
      holds or touches, and its latest Select installment sets Select's monthly share.
  compute:
  - su_now: MONTHS(K('epoch'), NOW)
  - su_ann: (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - su_m: RND(su_ann / K('months_per_year'), 2)
  - su_mi_eff: MONTHS(K('epoch'), F('enrollment_effective_date'))
  - su_mi_app: MONTHS(K('epoch'), F('application_date'))
  - su_pend_eff: >-
      (su_mi_eff if F('payment_frequency') == 'monthly' else ((su_mi_eff - su_mi_eff % 3 + 2) if F('payment_frequency')
      == 'quarterly' else (su_mi_eff - su_mi_eff % 12 + 11)))
  - su_pend_app: >-
      (su_mi_app if F('payment_frequency') == 'monthly' else ((su_mi_app - su_mi_app % 3 + 2) if F('payment_frequency')
      == 'quarterly' else (su_mi_app - su_mi_app % 12 + 11)))
  - su_pend_next: >-
      su_pend_eff + (1 if F('payment_frequency') == 'monthly' else (3 if F('payment_frequency') == 'quarterly' else
      12))
  - su_app_days: DAYS(F('enrollment_effective_date'), F('application_date'))
  - su_last: >-
      su_pend_app if su_mi_app > su_pend_eff else (su_pend_next if su_app_days >= K('late_application_days') else
      su_pend_eff)
  - su_n: MX(0, su_last - su_mi_eff + 1)
  - su_first_end: >-
      LATEST('prime_fee_ledger', 'coverage_period_end', date_field='posted_date', event_type='prime_fee_charge',
      coverage_period_start=F('enrollment_effective_date'))
  - su_eff_days: (DAYS(F('enrollment_effective_date'), su_first_end) + 1) if su_first_end else 30
  - su_eff_val: >-
      0 if F('enrollment_reason') == 'region_transfer_in' else (su_m if F('enrollment_reason') == 'qualifying_life_event'
      else RND(su_m * MN(30, su_eff_days) / 30, 2))
  - su_s_eff: CFIELD('select', 'enrollment_effective_date')
  - su_s_end: CFIELD('select', 'disenrollment_date')
  - su_s_lo: MONTHS(K('epoch'), su_s_eff) if su_s_eff else 99999
  - su_s_hi: MONTHS(K('epoch'), su_s_end) if su_s_end else (99999 if su_s_eff else -1)
  - su_part_n: >-
      (1 if (su_s_lo >= su_mi_eff and su_s_lo <= su_last) else 0) + (1 if (su_s_hi != su_s_lo and su_s_hi >= su_mi_eff
      and su_s_hi <= su_last) else 0)
  - su_whole_n: MX(0, MN(su_s_hi - 1, su_last) - MX(su_s_lo + 1, su_mi_eff) + 1)
  - su_s_last: >-
      XLATEST('select', 'select_fee_ledger', 'select_fee_entry_id', date_field='coverage_period_start', event_type='select_fee_charge')
  - su_s_freq: >-
      XLATEST('select', 'select_fee_ledger', 'installment_frequency', date_field='coverage_period_start', select_fee_entry_id=su_s_last)
  - su_s_amt: XSUM('select', 'select_fee_ledger', 'amount', select_fee_entry_id=su_s_last)
  - su_s_share: >-
      su_s_amt if su_s_freq == 'monthly' else (RND(su_s_amt / 3, 2) if su_s_freq == 'quarterly' else RND(su_s_amt
      / K('months_per_year'), 2))
  - su_sel_off: >-
      RND(su_whole_n * su_m + su_part_n * su_s_share, 2) if (su_whole_n > 0 and su_part_n > 0) else (RND(su_whole_n
      * su_m, 2) if su_whole_n > 0 else (RND(su_part_n * su_s_share, 2) if su_part_n > 0 else 0))
  - su_amount: RND(su_eff_val + MX(0, su_n - 1) * su_m - su_sel_off, 2)
  - su_last_post: LATEST('prime_fee_ledger', 'posted_date', date_field='posted_date', event_type='prime_fee_charge')
  - su_late_post: 1 if (su_last_post and su_last_post > F('application_date')) else 0
  - su_cnt_win: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge')
  - su_cnt_eff: >-
      SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', coverage_period_start=F('enrollment_effective_date'))
  - su_cnt_app: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', posted_date=F('application_date'))
  - su_counted: >-
      su_cnt_win if su_late_post > 0 else (su_cnt_eff if DAYS(F('application_date'), F('enrollment_effective_date'))
      > 0 else su_cnt_app)
  - su_old: 1 if MONTHS(K('epoch'), F('enrollment_effective_date')) < su_now - su_now % 12 else 0
  - result: 0 if su_old == 1 else RND(MX(0, su_amount - su_counted), 2)
