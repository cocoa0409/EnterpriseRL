  baseline:
    rule: >-
      A first installment owes the months from the month containing the enrollment effective date to the end of
      the installment period containing that date, installment periods being calendar months for a monthly arrangement,
      calendar quarters for a quarterly one and the calendar year for an annual one; the month containing the effective
      date counts at the monthly rate times the lesser of 30 and its days from the effective date through the last
      day of the coverage period of the installment charge beginning on the effective date, 30 where no such charge
      stands, over 30, every later month owed at the monthly rate, TRICARE Select coverage takes nothing off, and
      the installment charges posted on the application date count against it. The annual fee of the enrollment's
      fee arrangement is the tier's annual individual fee for an individual arrangement and its annual family fee
      for a family arrangement.
