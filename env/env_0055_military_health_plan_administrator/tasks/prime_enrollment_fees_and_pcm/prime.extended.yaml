# TRICARE Prime enrollment charter for the Westbridge Military Health Services regional contract (TRICARE West Region).
# One holding = one beneficiary's enrollment in a TRICARE Prime option. Enrollment fees are billed to the
# fee-bearing enrollment of the sponsor family; PCM assignments, Prime claim-line cost shares and the
# point-of-service option are booked against the beneficiary's own enrollment.

category: prime
display_name: TRICARE Prime

binding:
  holding_table: prime_enrollments
  event_tables: [prime_fee_ledger, prime_pcm_assignments, prime_claim_lines]
  intake_tables: [prime_enrollment_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fee_balance_due: enrollment_fee_due}

lifecycle:
  states: [applied, active, rejected, disenrolled_voluntary, disenrolled_nonpayment, terminated_ineligible, transferred_out]
  transitions:
    - {from: applied, to: active, by: agent, means: The enrollment is processed - the DEERS eligibility and window checks pass and either the first installment is paid or the tier is fee-exempt - and coverage starts on the enrollment effective date.}
    - {from: applied, to: rejected, by: agent, means: The application cannot be processed because the beneficiary is not eligible for the requested Prime option or the application missed its enrollment window.}
    - {from: active, to: disenrolled_voluntary, by: user, means: The beneficiary (or the sponsor for a minor) confirms a request to leave Prime; the agent only records the request as an intake and the beneficiary's confirmation ends coverage.}
    - {from: active, to: disenrolled_nonpayment, by: system, means: An enrollment-fee installment stayed unpaid past the grace period and the enrollment ends on its paid-through date.}
    - {from: active, to: terminated_ineligible, by: system, means: DEERS no longer shows the beneficiary as eligible for this Prime option (for example the sponsor separated or the beneficiary aged out).}
    - {from: active, to: transferred_out, by: agent, means: The beneficiary moved outside the West Region and the enrollment was transferred to the gaining region's contractor.}
    - {from: disenrolled_nonpayment, to: active, by: agent, means: An approved Enrollment Reinstatement Review restores the enrollment without a break once every past-due installment is paid.}

accounts:
  - key: enrollment_fee_due
    unit: USD
    meaning: Enrollment fees owed on a fee-bearing Prime enrollment - installment charges and refunds of credit balances increase it, payments and proration credits reduce it; a negative value is a credit owed to the beneficiary.
  - key: cost_share_accrued
    unit: USD
    meaning: Beneficiary cost shares (network copayments and point-of-service deductible and cost share) assessed on adjudicated Prime claim lines of this enrollment, net of reversals.

parameter_schema:
  eligible_beneficiary_categories: list of DEERS beneficiary categories (customers.beneficiary_category values) that may hold this Prime option
  enrollment_group: string - the sponsor entry group the tier serves (group_a = sponsor first entered uniformed service before 2018-01-01, group_b = on or after 2018-01-01, not_applicable = group does not change the tier)
  residence_requirement: string - inside_prime_service_area (residence_service_area must be a Prime Service Area) or outside_prime_service_area (residence_service_area must be non_psa)
  auto_enrollment_on_eligibility: boolean - whether DEERS eligibility alone places the beneficiary in this option without an application
  qle_enrollment_window_days: integer, calendar days after a DEERS-recorded qualifying life event within which an enrollment application must be received
  open_season_enrollment_allowed: boolean - whether the beneficiary may elect this option during open season
  qle_effective_date_rule: string - the date a qualifying-life-event enrollment takes effect
  open_season_effective_date_rule: string - the date an open-season election takes effect
  fee_exempt: boolean - whether the tier pays no enrollment fee
  annual_fee_individual: USD per calendar plan year, enrollment fee when exactly one family member is enrolled in Prime under the sponsor
  annual_fee_family: USD per calendar plan year, enrollment fee when two or more family members are enrolled in Prime under the sponsor
  allowed_payment_frequencies: list of installment frequencies the fee-bearing enrollment may use (annual, quarterly, monthly)
  monthly_payment_methods: list of payment methods accepted for monthly installments
  annual_quarterly_payment_methods: list of payment methods accepted for annual and quarterly installments
  installment_due_rule: string - the day on which each installment is due
  nonpayment_grace_days: integer, calendar days after an installment's due date before nonpayment disenrollment applies (0 for fee-exempt tiers)
  delinquency_notice_day: integer, calendar day after the due date on which the delinquency letter is issued (0 for fee-exempt tiers)
  reinstatement_request_window_days: integer, calendar days after a nonpayment disenrollment within which an Enrollment Reinstatement Review may be filed (0 for fee-exempt tiers)
  reenrollment_after_nonpayment: string - when a beneficiary disenrolled for nonpayment may enroll again without reinstatement
  fee_proration_unit: string - the unit by which partial-year fees and proration credits are counted
  fee_credit_eligible_reasons: list of adjustment reasons that earn a proration credit of prepaid enrollment fees
  fee_refund_issue_days: integer, calendar days after a credit balance arises within which the refund is issued (0 for fee-exempt tiers)
  fees_count_toward_catastrophic_cap: boolean - whether enrollment fees paid for the plan year count toward the family catastrophic cap
  catastrophic_cap_family: mapping sponsor entry group -> USD per calendar plan year, the family catastrophic cap on out-of-pocket costs
  copay_preventive_care: USD per visit, network preventive care (clinical preventive services, well-child, screenings)
  copay_primary_care_visit: USD per visit, network primary care outpatient visit
  copay_specialty_care_visit: USD per visit, network specialty care outpatient visit (referred)
  copay_urgent_care_visit: USD per visit, network urgent care center visit
  copay_emergency_room_visit: USD per visit, emergency room visit (network or non-network)
  copay_ground_ambulance: USD per trip, ground ambulance
  copay_outpatient_behavioral_health_individual: USD per visit, network outpatient behavioral health individual visit
  copay_outpatient_behavioral_health_group: USD per visit, network outpatient behavioral health group visit
  copay_rehabilitative_therapy_visit: USD per visit, network physical, occupational or speech therapy visit
  copay_ambulatory_surgery: USD per procedure, network ambulatory surgery
  copay_inpatient_admission: USD per admission, network acute inpatient admission
  copay_inpatient_mental_health_admission: USD per admission, network inpatient mental health admission
  dme_cost_share_pct: percent of the allowed amount, network durable medical equipment cost share
  copay_lab_and_xray: USD per service, network laboratory and diagnostic radiology
  pos_option_available: boolean - whether the point-of-service option applies to non-emergency care obtained without a required referral
  pos_deductible_individual: USD per calendar plan year, point-of-service deductible per beneficiary
  pos_deductible_family: USD per calendar plan year, point-of-service deductible per sponsor family
  pos_cost_share_pct: percent of the allowed amount the beneficiary pays under point-of-service after the POS deductible
  pos_counts_toward_catastrophic_cap: boolean - whether point-of-service charges count toward the catastrophic cap
  pos_exempt_service_classes: list of service_class values that never trigger point-of-service charges
  specialty_referral_required: boolean - whether non-emergency specialty care needs a PCM referral
  urgent_care_referral_required: boolean - whether network urgent care needs a referral
  routine_eye_exam_interval_months: integer, months between covered routine eye exams without a referral
  pcm_setting_allowed: list of providers.provider_kind values the beneficiary's PCM may be
  mtf_access_priority_group: integer, military hospital or clinic access priority group (1 is highest)
  mtf_pcm_requires_mtf_approval: boolean - whether choosing a military hospital or clinic PCM needs that facility's capacity approval
  pcm_change_effective_rule: string - the date a PCM change takes effect
  primary_care_drive_time_standard_minutes: integer, maximum drive time from residence to the PCM under the access standard
  specialty_care_drive_time_standard_minutes: integer, maximum drive time from residence to a referred specialist under the access standard
  access_standard_waiver_allowed: boolean - whether the beneficiary may sign a waiver to keep a PCM outside the residence Prime Service Area
  pediatric_pcm_max_age_years: integer, oldest age (in completed years) at which a pediatrics provider may serve as PCM
  tricare_secondary_to_ohi: boolean - whether TRICARE pays after other health insurance for this tier
  region_transfer_allowed: boolean - whether the enrollment may be transferred to another region's contractor on a move
  claim_filing_deadline_days: integer, calendar days after the date of service within which a claim must be filed

