  compute_basis:
    cu_now: >-
      A catch-up installment bills every month from the month the reinstatement review was filed through the month
      before the current month that no monthly installment charge on the account begins in, and its charge is the
      plan year's annual fee less the installment charges on the account whose coverage begins in the current plan
      year on or before today, TRICARE Select coverage taking nothing off it.
    cu_fi_n: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    cu_fi_amt: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    cu_fi_m: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    cu_fi_lag: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    cu_fi_adj: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    cu_ann: >-
      The annual fee of the enrollment's fee arrangement is the tier's annual individual fee for an individual arrangement
      and its annual family fee for a family arrangement.
    cu_m: >-
      Each month is valued at one twelfth of the annual fee of the enrollment's fee arrangement - the tier's annual
      individual fee for an individual arrangement and its annual family fee for a family arrangement - rounded
      to the cent, and a quarterly installment at one quarter of that annual fee, rounded to the cent.
    cu_q: >-
      Each month is valued at one twelfth of the annual fee of the enrollment's fee arrangement - the tier's annual
      individual fee for an individual arrangement and its annual family fee for a family arrangement - rounded
      to the cent, and a quarterly installment at one quarter of that annual fee, rounded to the cent.
    rv_case: >-
      Where the review's case file holds proof of payment, the catch-up starts with the month after the month the
      review was decided, the region bearing the gap its own billing error caused; where it holds medical records
      and no proof of payment, the catch-up starts with the month after the old paid-through date, the beneficiary
      owing every restored month; otherwise it starts with the month the review was filed, the region bearing the
      months before the beneficiary came forward.
    rv_paid_through: >-
      A catch-up installment bills every month from the month the reinstatement review was filed through the month
      before the current month that no monthly installment charge on the account begins in, and its charge is the
      plan year's annual fee less the installment charges on the account whose coverage begins in the current plan
      year on or before today, TRICARE Select coverage taking nothing off it.
