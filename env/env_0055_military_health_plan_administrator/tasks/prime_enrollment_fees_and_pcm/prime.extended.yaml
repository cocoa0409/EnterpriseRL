  params:
    epoch: '2000-01-01'
    months_per_year: 12
    quarters_per_year: 4
  rule: >-
    This policy settles the refund owed when the first installment of a new fee-bearing TRICARE Prime enrollment,
    one that took effect in the current plan year, has been paid more than once; where the enrollment took effect
    before the current plan year, this policy refunds nothing. The duplicate refund returns the smaller of the latest
    payment posted against the first installment charge and its earlier payments together, less the refunds already
    issued against that latest payment, never more than the amount by which all of its payments exceed the installment's
    value less those refunds, that value being the whole annual fee of the enrollment's fee arrangement; the region
    keeps nothing of it on the account. The first installment charge is the installment charge whose coverage period
    begins on the enrollment's effective date. The duplicate refund is posted against the latest payment posted
    against the first installment charge and goes back through that payment's method. The annual fee of the enrollment's
    fee arrangement is the tier's annual individual fee for an individual arrangement and its annual family fee
    for a family arrangement. Where the first installment is a monthly installment, its value is one twelfth of
    the annual fee of the enrollment's fee arrangement, rounded to the cent; where it is a quarterly installment,
    one quarter of that fee, rounded to the cent; otherwise the whole annual fee. Where more than one payment stands
    against the first installment and the latest of them was made through a method other than the enrollment's payment
    arrangement, the duplicate refund returns that latest payment; where more than one stands and the latest was
    collected through the arrangement's own method, it returns the earlier payments together; otherwise it returns
    the smaller of the latest payment and the earlier payments together. Refunds already issued against the latest
    payment posted against the first installment charge come off both the payment the duplicate refund returns and
    its excess. Where the enrollment pays through an allotment and the account shows payments collected through
    it, the region keeps two regular installments of the excess on the account for the installments that follow;
    where it pays through a recurring card or electronic funds transfer and the account shows payments collected
    through that method, it keeps one regular installment; otherwise it keeps nothing. A regular installment kept
    on the account is valued by the installment charge whose coverage period begins latest: one twelfth of the annual
    fee of the enrollment's fee arrangement for a monthly installment, one quarter of it for a quarterly installment,
    each rounded to the cent, and the whole annual fee otherwise. The duplicate refund is the payment it returns
    less what comes off it, never more than the excess less what comes off and less what the region keeps, never
    below zero, rounded to the cent.
  prerequisite: []
  cross_category: []
  compute:
  - rf_ann: (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - rf_mi_now: MONTHS(K('epoch'), NOW)
  - rf_old: 1 if MONTHS(K('epoch'), F('enrollment_effective_date')) < rf_mi_now - rf_mi_now % 12 else 0
  - rf_inst: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='posted_date', event_type='prime_fee_charge',
      coverage_period_start=F('enrollment_effective_date'))
  - rf_freq: >-
      LATEST('prime_fee_ledger', 'installment_frequency', date_field='posted_date', prime_fee_entry_id=rf_inst)
  - rf_value: >-
      RND(rf_ann / K('months_per_year'), 2) if rf_freq == 'monthly' else (RND(rf_ann / K('quarters_per_year'), 2)
      if rf_freq == 'quarterly' else rf_ann)
  - rf_paid: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_payment', related_fee_entry_id=rf_inst)
  - rf_n_pay: COUNT('prime_fee_ledger', event_type='prime_fee_payment', related_fee_entry_id=rf_inst)
  - rf_late_id: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='posted_date', event_type='prime_fee_payment',
      related_fee_entry_id=rf_inst)
  - rf_late_amt: >-
      LATEST('prime_fee_ledger', 'amount', date_field='posted_date', event_type='prime_fee_payment', related_fee_entry_id=rf_inst)
      or 0
  - rf_late_method: >-
      LATEST('prime_fee_ledger', 'payment_method', date_field='posted_date', event_type='prime_fee_payment', related_fee_entry_id=rf_inst)
  - rf_pick: >-
      rf_late_amt if (rf_n_pay > 1 and rf_late_method != F('payment_method')) else ((rf_paid - rf_late_amt) if (rf_n_pay
      > 1 and rf_late_method == F('payment_method')) else MN(rf_late_amt, rf_paid - rf_late_amt))
  - rf_excess: RND(MX(0, rf_paid - rf_value), 2)
  - rf_ref_ret: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_refund', related_fee_entry_id=rf_late_id)
  - rf_cur_freq: >-
      LATEST('prime_fee_ledger', 'installment_frequency', date_field='coverage_period_start', event_type='prime_fee_charge')
  - rf_reg: >-
      RND(rf_ann / K('months_per_year'), 2) if rf_cur_freq == 'monthly' else (RND(rf_ann / K('quarters_per_year'),
      2) if rf_cur_freq == 'quarterly' else rf_ann)
  - rf_coll: COUNT('prime_fee_ledger', event_type='prime_fee_payment', payment_method=F('payment_method'))
  - rf_kept: >-
      2 * rf_reg if (F('payment_method') == 'allotment' and rf_coll > 0) else (rf_reg if ((F('payment_method') ==
      'recurring_card' or F('payment_method') == 'electronic_funds_transfer') and rf_coll > 0) else 0)
  - result: 0 if rf_old == 1 else RND(MX(0, MN(rf_pick - rf_ref_ret, rf_excess - rf_ref_ret - rf_kept)), 2)
