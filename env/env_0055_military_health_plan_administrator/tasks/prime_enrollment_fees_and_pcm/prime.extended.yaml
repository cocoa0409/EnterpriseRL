- id: prime_ext_draft_on_file_method
  base_policy_refs:
  - prime_fee_payment_methods
  - prime_nonpayment_disenrollment
  - prime_reinstatement
  overwrite:
  - base_policy: prime_fee_payment_methods
    superseded_clause: >-
      A payment is applied to the oldest unpaid installment first and never to a future period while an earlier
      installment is open.
    replaced_by: >-
      Where the installment posted most recently covers a month before the current month, the region's draft is
      toward that back-billed installment; where no such installment was posted most recently and the enrollment's
      payment arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise
      it is toward the installment whose coverage period begins latest.
  trigger: on_request
  subject:
  - prime_fee_payment
  computes: amount
  target_tool: run_draft_on_file_method_99529347
  params:
    epoch: '2000-01-01'
    months_per_year: 12
    quarters_per_year: 4
  rule: >-
    This policy settles the amount the region draws through the payment method an enrollment keeps on file when
    the beneficiary asks for an amount owed on a fee-bearing TRICARE Prime enrollment to be collected that way;
    the region draws nothing on an enrollment that took effect in the current plan year. The region's draft is toward
    the installment whose coverage period begins latest and draws that installment's whole open amount, its charge
    less the payments posted against it, less the whole excess of the account history running from the first month
    of the plan year in which the history ends, with nothing kept for the next installment, never below zero, rounded
    to the cent and taken through the method on file. The annual fee of the enrollment's fee arrangement is the
    tier's annual individual fee for an individual arrangement and its annual family fee for a family arrangement.
    Where the installment posted most recently covers a month before the current month, the region's draft is toward
    that back-billed installment; where no such installment was posted most recently and the enrollment's payment
    arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise it
    is toward the installment whose coverage period begins latest. Where the installment whose coverage period begins
    latest is a monthly installment, a regular installment for a draft is one twelfth of the annual fee of the enrollment's
    fee arrangement, rounded to the cent; where it is a quarterly installment, one quarter of that fee, rounded
    to the cent; otherwise the whole annual fee. Where the method on file is a recurring card and the account shows
    payments collected through it, one draft draws at most two regular installments; where the method on file is
    electronic funds transfer and the account shows payments collected through it, one draft draws at most three
    regular installments; otherwise one draft may draw the whole open amount. The account history a draft weighs
    runs from a starting month: where the enrollment was brought back by an Enrollment Reinstatement Review decided
    overturned, the month after the old paid-through date the review recorded; where the enrollment took effect
    in the plan year in which the history ends, the month containing its effective date; otherwise the first month
    of the plan year in which the history ends. The history runs through the end of the last closed installment
    period of the enrollment's payment arrangement: the month before the current month for a monthly arrangement,
    the last month of the previous calendar quarter for a quarterly arrangement and December of the previous plan
    year for an annual one. Every installment charge on the account begins on the first day of the period it covers,
    except a first installment, which begins on the enrollment's effective date; a charge begins in the month containing
    that day. Payments and refunds are weighed over the look-back of that history: what was posted after the date
    that falls as many months before today as there are calendar months from its starting month through the current
    month - on the same day of the month as today, or on the last day of that month where it is shorter - through
    today. Where the payments posted on the account within that look-back, other than payments against the drafted
    installment and against the installment whose coverage period begins latest, less the refunds posted within
    it, exceed the installment charges whose coverage begins from that starting month through the end of that history,
    other than the drafted installment, that excess, less what the region keeps on the account for the next installment,
    comes off what the draft draws. Where the enrollment pays through an allotment and the account shows payments
    collected through it, the region keeps two regular installments of that excess on the account for the next installment;
    where it pays through a recurring card or electronic funds transfer and the account shows payments collected
    through that method, it keeps one regular installment; otherwise it keeps nothing. The region's draft is the
    smaller of the open amount and that limit, less what comes off, never below zero, rounded to the cent. A draft
    toward a back-billed installment is made only after an installment charge on the account has a coverage period
    that reaches the month before the current month. No draft is made on an account until the region has made the
    duplicate refund owed on it, wherever that refund comes to more than nothing. The region does not draw a back-billed
    installment until the installment of the current month stands paid in full.
  prerequisite:
  - problem: prime_ext_reinstatement_catch_up
    kind: value_input
    gate: dd_target
    form: state
    policy_source: >-
      A draft toward a back-billed installment is made only after an installment charge on the account has a coverage
      period that reaches the month before the current month.
    condition: >-
      A prime_fee_charge row on the enrollment's fee ledger has a coverage period that includes the month before
      the current month.
    resolved_by: post_catch_up_installment_4baf2609
    effect: >-
      Once the catch-up installment is posted it is the installment posted most recently and covers months before
      the current month, so the draft is toward it (dd_target) and the open amount the draft can draw becomes its
      charge.
  - problem: prime_ext_duplicate_payment_refund
    kind: value_input
    gate: dd_off
    form: action
    policy_source: >-
      No draft is made on an account until the region has made the duplicate refund owed on it, wherever that refund
      comes to more than nothing.
    fallback_reason: >-
      A refund entry can already stand against the duplicate payment from an earlier partial refund, so a refund
      on the record does not show whether the refund owed has been made; the sentence therefore names the act, and
      says outright that no act is awaited where the refund owed comes to nothing.
    condition: >-
      Where the duplicate refund the duplicate-refund rule figures on the account's records comes to more than nothing,
      a prime_fee_refund row of that amount stands against the latest payment on the installment it concerns, after
      which the rule figures nothing.
    resolved_by: refund_duplicate_payment_360f0d4a
    effect: >-
      Refunding the duplicate raises the refunds posted in the account history the draft weighs, so the excess beyond
      what the region keeps, which comes off the draft (dd_off), falls to nothing.
  - problem: prime_ext_current_installment_payment
    kind: state_gate
    gate: prime_fee_ledger.amount
    form: state
    policy_source: >-
      The region does not draw a back-billed installment until the installment of the current month stands paid
      in full.
    condition: >-
      The payments posted against the installment whose coverage period begins in the current month, less refunds
      issued against them, reach its charge.
    resolved_by: pay_current_installment_by_bank_draft_694809d0
    effect: >-
      Once the current month's installment stands paid in full the draft toward the back-billed installment may
      be drawn.
  cross_category:
  - category: appeal
    as: branch
    reads:
    - status
    - initial_determination_date
    - subject_enrollment_id
    note: >-
      An Enrollment Reinstatement Review decided overturned on the enrollment starts the account history the draft
      weighs at the month after the old paid-through date it recorded.
  compute:
  - dd_now: MONTHS(K('epoch'), NOW)
  - dd_ann: (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - dd_last_post: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='posted_date', event_type='prime_fee_charge')
  - dd_last_post_start: >-
      LATEST('prime_fee_ledger', 'coverage_period_start', date_field='posted_date', prime_fee_entry_id=dd_last_post)
  - dd_cur: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='coverage_period_start', event_type='prime_fee_charge')
  - dd_annual_inst: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='coverage_period_start', event_type='prime_fee_charge',
      installment_frequency='annual')
  - dd_target: >-
      dd_last_post if MONTHS(K('epoch'), dd_last_post_start) < dd_now else (dd_annual_inst if F('payment_frequency')
      == 'annual' else dd_cur)
  - dd_open: >-
      RND(SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', prime_fee_entry_id=dd_target) - SUM('prime_fee_ledger',
      'amount', event_type='prime_fee_payment', related_fee_entry_id=dd_target), 2)
  - dd_cur_freq: >-
      LATEST('prime_fee_ledger', 'installment_frequency', date_field='posted_date', prime_fee_entry_id=dd_cur)
  - dd_reg: >-
      RND(dd_ann / K('months_per_year'), 2) if dd_cur_freq == 'monthly' else (RND(dd_ann / K('quarters_per_year'),
      2) if dd_cur_freq == 'quarterly' else dd_ann)
  - dd_coll: COUNT('prime_fee_ledger', event_type='prime_fee_payment', payment_method=F('payment_method'))
  - dd_cap: >-
      2 * dd_reg if (F('payment_method') == 'recurring_card' and dd_coll > 0) else (3 * dd_reg if (F('payment_method')
      == 'electronic_funds_transfer' and dd_coll > 0) else dd_open)
  - dd_reinst: >-
      EXISTS('appeal', variant_name='Enrollment Reinstatement Review', status='decided_overturned', subject_enrollment_id=HID)
  - dd_paid_thr: >-
      CFIELD('appeal', 'initial_determination_date', variant_name='Enrollment Reinstatement Review', status='decided_overturned',
      subject_enrollment_id=HID)
  - dd_mi_eff: MONTHS(K('epoch'), F('enrollment_effective_date'))
  - dd_end: >-
      (dd_now - 1) if F('payment_frequency') == 'monthly' else ((dd_now - dd_now % 3 - 1) if F('payment_frequency')
      == 'quarterly' else (dd_now - dd_now % 12 - 1))
  - dd_year0: dd_end - dd_end % 12
  - dd_win: >-
      (MONTHS(K('epoch'), dd_paid_thr) + 1) if dd_reinst else (dd_mi_eff if dd_mi_eff >= dd_year0 else dd_year0)
  - dd_pay_w: >-
      SUM('prime_fee_ledger', 'amount', within_months=dd_now - dd_win + 1, date_field='posted_date', event_type='prime_fee_payment')
      - SUM('prime_fee_ledger', 'amount', within_months=dd_now - dd_win + 1, date_field='posted_date', event_type='prime_fee_payment',
      related_fee_entry_id=dd_cur) - (SUM('prime_fee_ledger', 'amount', within_months=dd_now - dd_win + 1, date_field='posted_date',
      event_type='prime_fee_payment', related_fee_entry_id=dd_target) if dd_target != dd_cur else 0)
  - dd_ref_w: >-
      SUM('prime_fee_ledger', 'amount', within_months=dd_now - dd_win + 1, date_field='posted_date', event_type='prime_fee_refund')
  - dd_fi_amt: >-
      SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', coverage_period_start=F('enrollment_effective_date'))
  - dd_fi_m: MONTHS(K('epoch'), F('enrollment_effective_date'))
  - dd_fi_adj: dd_now - MONTHS(F('enrollment_effective_date'), NOW)
  - dd_t_start: >-
      LATEST('prime_fee_ledger', 'coverage_period_start', date_field='posted_date', event_type='prime_fee_charge',
      prime_fee_entry_id=dd_target)
  - dd_t_amt: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', prime_fee_entry_id=dd_target)
  - dd_chg_w: >-
      RND(SUM('prime_fee_ledger', 'amount', within_months=dd_now - dd_win + 1, date_field='coverage_period_start',
      event_type='prime_fee_charge') - SUM('prime_fee_ledger', 'amount', within_months=MX(0, dd_now - dd_end), date_field='coverage_period_start',
      event_type='prime_fee_charge') + dd_fi_amt * ((dd_win <= dd_fi_m <= dd_end) - (dd_win <= dd_fi_adj <= dd_end))
      - dd_t_amt * (dd_win <= MONTHS(K('epoch'), dd_t_start or '1900-01-01') <= dd_end), 2) if dd_win <= dd_end
      else 0
  - dd_excess: RND(dd_pay_w - dd_ref_w - dd_chg_w, 2)
  - dd_coll_k: COUNT('prime_fee_ledger', event_type='prime_fee_payment', payment_method=F('payment_method'))
  - dd_kept: >-
      2 * dd_reg if (F('payment_method') == 'allotment' and dd_coll_k > 0) else (dd_reg if ((F('payment_method')
      == 'recurring_card' or F('payment_method') == 'electronic_funds_transfer') and dd_coll_k > 0) else 0)
  - dd_off: MX(0, dd_excess - dd_kept)
  - dd_new: 1 if MONTHS(K('epoch'), F('enrollment_effective_date')) >= dd_now - dd_now % 12 else 0
  - result: 0 if dd_new == 1 else RND(MX(0, MN(dd_open, dd_cap) - dd_off), 2)
  compute_basis:
    dd_now: >-
      Where the installment posted most recently covers a month before the current month, the region's draft is
      toward that back-billed installment; where no such installment was posted most recently and the enrollment's
      payment arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise
      it is toward the installment whose coverage period begins latest.
    dd_ann: >-
      The annual fee of the enrollment's fee arrangement is the tier's annual individual fee for an individual arrangement
      and its annual family fee for a family arrangement.
    dd_last_post: >-
      Where the installment posted most recently covers a month before the current month, the region's draft is
      toward that back-billed installment; where no such installment was posted most recently and the enrollment's
      payment arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise
      it is toward the installment whose coverage period begins latest.
    dd_last_post_start: >-
      Where the installment posted most recently covers a month before the current month, the region's draft is
      toward that back-billed installment; where no such installment was posted most recently and the enrollment's
      payment arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise
      it is toward the installment whose coverage period begins latest.
    dd_cur: >-
      Where the installment posted most recently covers a month before the current month, the region's draft is
      toward that back-billed installment; where no such installment was posted most recently and the enrollment's
      payment arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise
      it is toward the installment whose coverage period begins latest.
    dd_annual_inst: >-
      Where the installment posted most recently covers a month before the current month, the region's draft is
      toward that back-billed installment; where no such installment was posted most recently and the enrollment's
      payment arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise
      it is toward the installment whose coverage period begins latest.
    dd_target: >-
      Where the installment posted most recently covers a month before the current month, the region's draft is
      toward that back-billed installment; where no such installment was posted most recently and the enrollment's
      payment arrangement is annual, it is toward the annual installment whose coverage period begins latest; otherwise
      it is toward the installment whose coverage period begins latest.
    dd_open: >-
      The region's draft is toward the installment whose coverage period begins latest and draws that installment's
      whole open amount, its charge less the payments posted against it, less the whole excess of the account history
      running from the first month of the plan year in which the history ends, with nothing kept for the next installment,
      never below zero, rounded to the cent and taken through the method on file.
    dd_cur_freq: >-
      Where the installment whose coverage period begins latest is a monthly installment, a regular installment
      for a draft is one twelfth of the annual fee of the enrollment's fee arrangement, rounded to the cent; where
      it is a quarterly installment, one quarter of that fee, rounded to the cent; otherwise the whole annual fee.
    dd_reg: >-
      Where the installment whose coverage period begins latest is a monthly installment, a regular installment
      for a draft is one twelfth of the annual fee of the enrollment's fee arrangement, rounded to the cent; where
      it is a quarterly installment, one quarter of that fee, rounded to the cent; otherwise the whole annual fee.
    dd_coll: >-
      Where the method on file is a recurring card and the account shows payments collected through it, one draft
      draws at most two regular installments; where the method on file is electronic funds transfer and the account
      shows payments collected through it, one draft draws at most three regular installments; otherwise one draft
      may draw the whole open amount.
    dd_cap: >-
      Where the method on file is a recurring card and the account shows payments collected through it, one draft
      draws at most two regular installments; where the method on file is electronic funds transfer and the account
      shows payments collected through it, one draft draws at most three regular installments; otherwise one draft
      may draw the whole open amount.
    dd_reinst: >-
      The account history a draft weighs runs from a starting month: where the enrollment was brought back by an
      Enrollment Reinstatement Review decided overturned, the month after the old paid-through date the review recorded;
      where the enrollment took effect in the plan year in which the history ends, the month containing its effective
      date; otherwise the first month of the plan year in which the history ends.
    dd_paid_thr: >-
      The account history a draft weighs runs from a starting month: where the enrollment was brought back by an
      Enrollment Reinstatement Review decided overturned, the month after the old paid-through date the review recorded;
      where the enrollment took effect in the plan year in which the history ends, the month containing its effective
      date; otherwise the first month of the plan year in which the history ends.
    dd_mi_eff: >-
      The account history a draft weighs runs from a starting month: where the enrollment was brought back by an
      Enrollment Reinstatement Review decided overturned, the month after the old paid-through date the review recorded;
      where the enrollment took effect in the plan year in which the history ends, the month containing its effective
      date; otherwise the first month of the plan year in which the history ends.
    dd_end: >-
      The history runs through the end of the last closed installment period of the enrollment's payment arrangement:
      the month before the current month for a monthly arrangement, the last month of the previous calendar quarter
      for a quarterly arrangement and December of the previous plan year for an annual one.
    dd_year0: >-
      The account history a draft weighs runs from a starting month: where the enrollment was brought back by an
      Enrollment Reinstatement Review decided overturned, the month after the old paid-through date the review recorded;
      where the enrollment took effect in the plan year in which the history ends, the month containing its effective
      date; otherwise the first month of the plan year in which the history ends.
    dd_win: >-
      The account history a draft weighs runs from a starting month: where the enrollment was brought back by an
      Enrollment Reinstatement Review decided overturned, the month after the old paid-through date the review recorded;
      where the enrollment took effect in the plan year in which the history ends, the month containing its effective
      date; otherwise the first month of the plan year in which the history ends.
    dd_pay_w: >-
      Where the payments posted on the account within that look-back, other than payments against the drafted installment
      and against the installment whose coverage period begins latest, less the refunds posted within it, exceed
      the installment charges whose coverage begins from that starting month through the end of that history, other
      than the drafted installment, that excess, less what the region keeps on the account for the next installment,
      comes off what the draft draws.
    dd_ref_w: >-
      Payments and refunds are weighed over the look-back of that history: what was posted after the date that falls
      as many months before today as there are calendar months from its starting month through the current month
      - on the same day of the month as today, or on the last day of that month where it is shorter - through today.
    dd_fi_amt: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    dd_fi_m: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    dd_fi_adj: >-
      Every installment charge on the account begins on the first day of the period it covers, except a first installment,
      which begins on the enrollment's effective date; a charge begins in the month containing that day.
    dd_t_start: >-
      Where the payments posted on the account within that look-back, other than payments against the drafted installment
      and against the installment whose coverage period begins latest, less the refunds posted within it, exceed
      the installment charges whose coverage begins from that starting month through the end of that history, other
      than the drafted installment, that excess, less what the region keeps on the account for the next installment,
      comes off what the draft draws.
    dd_t_amt: >-
      Where the payments posted on the account within that look-back, other than payments against the drafted installment
      and against the installment whose coverage period begins latest, less the refunds posted within it, exceed
      the installment charges whose coverage begins from that starting month through the end of that history, other
      than the drafted installment, that excess, less what the region keeps on the account for the next installment,
      comes off what the draft draws.
    dd_chg_w: >-
      Where the payments posted on the account within that look-back, other than payments against the drafted installment
      and against the installment whose coverage period begins latest, less the refunds posted within it, exceed
      the installment charges whose coverage begins from that starting month through the end of that history, other
      than the drafted installment, that excess, less what the region keeps on the account for the next installment,
      comes off what the draft draws.
    dd_excess: >-
      Where the payments posted on the account within that look-back, other than payments against the drafted installment
      and against the installment whose coverage period begins latest, less the refunds posted within it, exceed
      the installment charges whose coverage begins from that starting month through the end of that history, other
      than the drafted installment, that excess, less what the region keeps on the account for the next installment,
      comes off what the draft draws.
    dd_coll_k: >-
      Where the enrollment pays through an allotment and the account shows payments collected through it, the region
      keeps two regular installments of that excess on the account for the next installment; where it pays through
      a recurring card or electronic funds transfer and the account shows payments collected through that method,
      it keeps one regular installment; otherwise it keeps nothing.
    dd_kept: >-
      Where the enrollment pays through an allotment and the account shows payments collected through it, the region
      keeps two regular installments of that excess on the account for the next installment; where it pays through
      a recurring card or electronic funds transfer and the account shows payments collected through that method,
      it keeps one regular installment; otherwise it keeps nothing.
    dd_off: >-
      Where the payments posted on the account within that look-back, other than payments against the drafted installment
      and against the installment whose coverage period begins latest, less the refunds posted within it, exceed
      the installment charges whose coverage begins from that starting month through the end of that history, other
      than the drafted installment, that excess, less what the region keeps on the account for the next installment,
      comes off what the draft draws.
    dd_new: >-
      This policy settles the amount the region draws through the payment method an enrollment keeps on file when
      the beneficiary asks for an amount owed on a fee-bearing TRICARE Prime enrollment to be collected that way;
      the region draws nothing on an enrollment that took effect in the current plan year.
    result: >-
      The region's draft is the smaller of the open amount and that limit, less what comes off, never below zero,
      rounded to the cent.
  factors:
  - id: draft_installment
    effect: method
    decides: dd_target
    bindings:
    - dd_last_post
    - dd_last_post_start
    - dd_annual_inst
    - dd_target
    ladder:
    - when: the installment posted most recently covers a month before the current month
      method: the draft is toward that back-billed installment
    - when: no such installment was posted most recently and the arrangement is annual
      method: the draft is toward the annual installment whose coverage begins latest
    - when: otherwise
      method: the draft is toward the installment whose coverage period begins latest
    baseline:
      dd_target: dd_cur
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: draft_regular_installment
    effect: parameter
    decides: dd_reg
    bindings:
    - dd_cur_freq
    - dd_reg
    ladder:
    - when: the installment whose coverage period begins latest is a monthly installment
      value: one twelfth of the annual fee
    - when: it is a quarterly installment
      value: one quarter of the annual fee
    - when: otherwise
      value: the whole annual fee
    baseline:
      dd_reg: dd_ann
    evidence:
    - history
    cross_difficulty: null
  - id: draft_limit_by_method
    effect: parameter
    decides: dd_cap
    bindings:
    - dd_coll
    - dd_cap
    ladder:
    - when: the method on file is a recurring card and the account shows payments collected through it
      value: two regular installments
    - when: the method on file is electronic funds transfer and the account shows payments collected through it
      value: three regular installments
    - when: otherwise
      value: the whole open amount
    baseline:
      dd_cap: dd_open
    evidence:
    - history
    cross_difficulty: null
  - id: draft_history_window
    effect: parameter
    decides: dd_win
    bindings:
    - dd_reinst
    - dd_paid_thr
    - dd_mi_eff
    - dd_year0
    - dd_win
    ladder:
    - when: the enrollment was brought back by an Enrollment Reinstatement Review decided overturned
      value: the month after the old paid-through date the review recorded
    - when: the enrollment took effect in the plan year in which the history ends
      value: the month containing its effective date
    - when: otherwise
      value: the first month of the plan year in which the history ends
    baseline:
      dd_win: dd_year0
    evidence:
    - cross_category
    - date
    cross_difficulty: appeal
  - id: draft_amount_kept
    effect: parameter
    decides: dd_kept
    bindings:
    - dd_coll_k
    - dd_kept
    ladder:
    - when: the enrollment pays through an allotment and the account shows payments collected through it
      value: two regular installments
    - when: >-
        it pays through a recurring card or electronic funds transfer and the account shows payments collected through
        that method
      value: one regular installment
    - when: otherwise
      value: '0'
    baseline:
      dd_kept: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The region's draft is toward the installment whose coverage period begins latest and draws that installment's
