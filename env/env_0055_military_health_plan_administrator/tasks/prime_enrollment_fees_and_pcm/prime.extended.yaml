- id: prime_ext_initial_payment
  base_policy_refs:
  - prime_enrollment_fee_schedule
  - prime_fee_payment_methods
  - prime_nonpayment_disenrollment
  overwrite:
  - base_policy: prime_fee_payment_methods
    superseded_clause: >-
      A payment is applied to the oldest unpaid installment first and never to a future period while an earlier
      installment is open.
    replaced_by: >-
      Where the enrollment's payment arrangement is a recurring card or electronic funds transfer, the method has
      not yet started and no installment on the account covers a month after the current month, the initial payment
      also pays one installment ahead; where the arrangement is a retired-pay allotment, it has not yet started
      and no installment covers a month after the current month, it pays two installments ahead; otherwise it pays
      none ahead.
  trigger: on_request
  subject:
  - prime_fee_payment
  computes: amount
  target_tool: pay_first_installment_by_bank_draft_5f63627f
  params:
    epoch: '2000-01-01'
    months_per_year: 12
    quarters_per_year: 4
  rule: >-
    This policy settles the initial payment a beneficiary authorizes by one-time bank draft toward the first installment
    of a fee-bearing TRICARE Prime enrollment; it settles nothing toward an enrollment that took effect before the
    current plan year. An initial payment settles the installment charge posted most recently on the enrollment's
    account, less the payments posted on the account, plus the refunds issued on the account, never below zero;
    the method on file counts as started once it has collected since the month containing the effective date, and
    no installment is paid ahead. The annual fee of the enrollment's fee arrangement is the tier's annual individual
    fee for an individual arrangement and its annual family fee for a family arrangement. The initial payment is
    posted against the charge whose coverage period begins latest among the charges it settles. Where the application
    was received after the end of the installment period containing the effective date, the initial payment settles
    every installment charge on the account; where the application was received before the effective date, it settles
    the installment charge whose coverage period begins on the effective date; otherwise it settles the installment
    charge posted most recently. The payments posted on the account count as received. Refunds issued on the account
    are owed again. The method on file has started when the account shows a payment collected through it from a
    starting month: where the enrollment rests on a qualifying life event, the month after the month the application
    was received; where it rests on an open season election, the first month of the plan year in which it took effect;
    otherwise the month containing its effective date. Where the enrollment's payment arrangement is a recurring
    card or electronic funds transfer, the method has not yet started and no installment on the account covers a
    month after the current month, the initial payment also pays one installment ahead; where the arrangement is
    a retired-pay allotment, it has not yet started and no installment covers a month after the current month, it
    pays two installments ahead; otherwise it pays none ahead. An installment paid ahead is valued by the frequency
    of the installment charge whose coverage period begins latest: one twelfth of the annual fee of the enrollment's
    fee arrangement for a monthly installment, rounded to the cent; one quarter of it for a quarterly installment,
    rounded to the cent; otherwise the whole annual fee. The initial payment is what the settled charges total,
    less what counts as received, plus what is owed again, never below zero, plus the installments paid ahead at
    that value, rounded to the cent. An initial payment toward a new enrollment is figured only after the enrollment's
    installment charges cover every month from the month containing its effective date through the last month its
    first installment owes. An initial payment toward a new enrollment is figured only after its first installment
    carries no payments beyond its value other than what the region keeps on the account for the installments that
    follow. An initial payment toward a new Prime enrollment is not taken until every month of the last paid installment
    of a Prime enrollment the beneficiary ended earlier in the same plan year that a following TRICARE Select enrollment's
    coverage reaches, or that falls after the month containing its disenrollment date, stands credited.
  prerequisite:
  - problem: prime_ext_first_installment_supplement
    kind: value_input
    gate: rp_owed
    form: state
    policy_source: >-
      An initial payment toward a new enrollment is figured only after the enrollment's installment charges cover
      every month from the month containing its effective date through the last month its first installment owes.
    condition: >-
      Every month from the month containing the enrollment's effective date through the last month its first installment
      owes lies inside the coverage period of a prime_fee_charge row on the enrollment's fee ledger.
    resolved_by: post_first_installment_supplement_bc87e2fc
    effect: >-
      Once the first-installment supplement is posted its months fall inside the window the initial payment settles,
      so what the settled charges total (rp_owed) rises by the supplement.
  - problem: prime_ext_first_installment_duplicate_refund
    kind: value_input
    gate: rp_returned
    form: state
    policy_source: >-
      An initial payment toward a new enrollment is figured only after its first installment carries no payments
      beyond its value other than what the region keeps on the account for the installments that follow.
    condition: >-
      The payments posted against the new enrollment's first installment charge, less the refunds issued against
      them, do not exceed the installment's value plus the regular installments the duplicate-refund rule lets the
      region keep on the account.
    resolved_by: refund_first_installment_duplicate_7d2e91c4
    effect: >-
      Refunding the duplicate on the first installment raises the refunds issued on the account, which the initial
      payment owes again (rp_returned).
  - problem: prime_ext_unused_month_credit
    kind: state_gate
    gate: prime_fee_ledger.coverage_period_start
    form: state
    policy_source: >-
      An initial payment toward a new Prime enrollment is not taken until every month of the last paid installment
      of a Prime enrollment the beneficiary ended earlier in the same plan year that a following TRICARE Select
      enrollment's coverage reaches, or that falls after the month containing its disenrollment date, stands credited.
    condition: >-
      Every month of the ended enrollment's last paid installment that the beneficiary's TRICARE Select enrollment
      coverage reaches (from the month containing its effective date through the month containing its disenrollment
      date, or every month from its effective month on where it has none), or that falls after the month containing
      the disenrollment date, lies inside the coverage period of a prime_fee_credit row against that installment.
    resolved_by: post_unused_month_credit_3ad1a050
    effect: >-
      Once the make-up credit for the month Select coverage reaches is posted, the ended enrollment stands credited
      and the initial payment may be taken.
  cross_category: []
  compute:
  - rp_ann: (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - rp_mi_eff: MONTHS(K('epoch'), F('enrollment_effective_date'))
  - rp_mi_app: MONTHS(K('epoch'), F('application_date'))
  - rp_mi_now: MONTHS(K('epoch'), NOW)
  - rp_pend_eff: >-
      (rp_mi_eff if F('payment_frequency') == 'monthly' else ((rp_mi_eff - rp_mi_eff % 3 + 2) if F('payment_frequency')
      == 'quarterly' else (rp_mi_eff - rp_mi_eff % 12 + 11)))
  - rp_win_all: RND(SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge'), 2)
  - rp_eff_only: >-
      RND(SUM('prime_fee_ledger', 'amount', event_type='prime_fee_charge', coverage_period_start=F('enrollment_effective_date')),
      2)
  - rp_last_id: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='posted_date', event_type='prime_fee_charge')
  - rp_last_amt: SUM('prime_fee_ledger', 'amount', prime_fee_entry_id=rp_last_id)
  - rp_owed: >-
      rp_win_all if rp_mi_app > rp_pend_eff else (rp_eff_only if DAYS(F('application_date'), F('enrollment_effective_date'))
      > 0 else rp_last_amt)
  - rp_received: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_payment')
  - rp_returned: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_refund')
  - rp_last_end: >-
      LATEST('prime_fee_ledger', 'coverage_period_end', date_field='coverage_period_end', event_type='prime_fee_charge')
  - rp_billed_ahead: (1 if MONTHS(K('epoch'), rp_last_end) > rp_mi_now else 0) if rp_last_end else 0
  - rp_start_m: >-
      (rp_mi_app + 1) if F('enrollment_reason') == 'qualifying_life_event' else ((rp_mi_eff - rp_mi_eff % 12) if
      F('enrollment_reason') == 'open_season' else rp_mi_eff)
  - rp_last_cd: >-
      LATEST('prime_fee_ledger', 'posted_date', date_field='posted_date', event_type='prime_fee_payment', payment_method=F('payment_method'))
  - rp_started: 1 * (MONTHS(K('epoch'), rp_last_cd or '1900-01-01') >= rp_start_m)
  - rp_adv: >-
      1 if ((F('payment_method') == 'recurring_card' or F('payment_method') == 'electronic_funds_transfer') and
      rp_started == 0 and rp_billed_ahead == 0) else (2 if (F('payment_method') == 'allotment' and rp_started ==
      0 and rp_billed_ahead == 0) else 0)
  - rp_last_freq: >-
      LATEST('prime_fee_ledger', 'installment_frequency', date_field='coverage_period_start', event_type='prime_fee_charge')
  - rp_aval: >-
      RND(rp_ann / K('months_per_year'), 2) if rp_last_freq == 'monthly' else (RND(rp_ann / K('quarters_per_year'),
      2) if rp_last_freq == 'quarterly' else rp_ann)
  - rp_out: 1 if rp_mi_eff < rp_mi_now - rp_mi_now % 12 else 0
  - result: 0 if rp_out == 1 else RND(MX(0, rp_owed - rp_received + rp_returned) + rp_adv * rp_aval, 2)
