- id: prime_ext_unused_month_credit
  base_policy_refs:
  - prime_fee_proration_credit
  - prime_agg_multi_holding
  overwrite:
  - base_policy: prime_fee_proration_credit
    superseded_clause: the month in which the disenrollment date falls is never credited.
    replaced_by: >-
      A counted month that is not after the month containing the disenrollment date is credited instead as follows:
      where TRICARE Select took effect the day after the disenrollment date, at the full value of a counted month;
      where Select took effect two to fifteen days after it, at half that value, rounded to the cent; otherwise
      at nothing.
  - base_policy: prime_fee_proration_credit
    superseded_clause: >-
      A credit is posted against the paid installment whose months are unused, once per installment and reason.
    replaced_by: >-
      A credit posted to make up what earlier credits did not cover may be posted against the same installment for
      the same reason; its coverage period runs from the first to the last counted month that earlier credits did
      not cover.
  trigger: state_due
  subject:
  - prime_fee_credit
  computes: amount
  target_tool: post_unused_month_credit_3ad1a050
  params:
    epoch: '2000-01-01'
    months_per_year: 12
    quarters_per_year: 4
  rule: >-
    This policy settles the proration credit owed on the last paid installment of a fee-bearing TRICARE Prime enrollment
    that ended for a credit-eligible reason, including any part of it that credits already posted did not cover.
    The installment credited is the enrollment's installment charge whose coverage period begins latest; the credit
    counts the whole calendar months of it after the month containing the disenrollment date, credits each at one
    twelfth of the installment's charge, rounded to the cent, and takes off the amount by which the payments against
    the installment fall short of its charge. TRICARE Select coverage is read from the beneficiary's TRICARE Select
    enrollment, from the month containing its effective date through the month containing its disenrollment date,
    or every month from its effective month on where it has no disenrollment date. Where that coverage reaches every
    month of the credited installment, counting starts with the installment's first month; where it reaches the
    month containing the disenrollment date, counting starts with that month; otherwise counting starts with the
    month after the month containing the disenrollment date. Every month of the credited installment from that first
    month on counts. Where the credited installment is a monthly installment, a counted month is credited at its
    whole charge; where it is a quarterly installment, at one third of its charge, rounded to the cent; otherwise
    at one twelfth of its charge, rounded to the cent. A counted month that is not after the month containing the
    disenrollment date is credited instead as follows: where TRICARE Select took effect the day after the disenrollment
    date, at the full value of a counted month; where Select took effect two to fifteen days after it, at half that
    value, rounded to the cent; otherwise at nothing. Where credits were already posted against the credited installment,
    they come off; where none were but refunds stand against its latest payment, those refunds come off; otherwise
    the amount by which the payments against it fall short of its charge comes off. A credit posted to make up what
    earlier credits did not cover may be posted against the same installment for the same reason; its coverage period
    runs from the first to the last counted month that earlier credits did not cover. The credit posted is the value
    of the counted months less what comes off, never below zero, rounded to the cent.
  prerequisite: []
  cross_category:
  - category: select
    as: history
    reads:
    - enrollment_effective_date
    - disenrollment_date
    note: >-
      The beneficiary's TRICARE Select enrollment dates show which months of the credited Prime installment Select
      coverage reaches and how soon Select took effect after the Prime enrollment ended.
  compute:
  - cr_now: MONTHS(K('epoch'), NOW)
  - cr_inst: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='coverage_period_start', event_type='prime_fee_charge')
  - cr_amt: SUM('prime_fee_ledger', 'amount', prime_fee_entry_id=cr_inst)
  - cr_freq: >-
      LATEST('prime_fee_ledger', 'installment_frequency', date_field='coverage_period_start', prime_fee_entry_id=cr_inst)
  - cr_cov_start: >-
      LATEST('prime_fee_ledger', 'coverage_period_start', date_field='coverage_period_start', prime_fee_entry_id=cr_inst)
  - cr_cov_end: >-
      LATEST('prime_fee_ledger', 'coverage_period_end', date_field='coverage_period_start', prime_fee_entry_id=cr_inst)
  - cr_mi_start: MONTHS(K('epoch'), cr_cov_start)
  - cr_mi_cend: MONTHS(K('epoch'), cr_cov_end)
  - cr_mi_dis: MONTHS(K('epoch'), F('disenrollment_date'))
  - cr_s_eff: CFIELD('select', 'enrollment_effective_date')
  - cr_s_end: CFIELD('select', 'disenrollment_date')
  - cr_s_lo: MONTHS(K('epoch'), cr_s_eff) if cr_s_eff else 99999
  - cr_s_hi: MONTHS(K('epoch'), cr_s_end) if cr_s_end else 99999
  - cr_first: >-
      cr_mi_start if (cr_s_lo <= cr_mi_start and cr_s_hi >= cr_mi_cend) else (cr_mi_dis if (cr_s_lo <= cr_mi_dis
      and cr_s_hi >= cr_mi_dis) else cr_mi_dis + 1)
  - cr_months: MX(0, cr_mi_cend - MX(cr_first, cr_mi_start) + 1)
  - cr_pre_n: MX(0, MN(cr_mi_dis, cr_mi_cend) - MX(cr_first, cr_mi_start) + 1)
  - cr_val: >-
      cr_amt if cr_freq == 'monthly' else (RND(cr_amt / 3, 2) if cr_freq == 'quarterly' else RND(cr_amt / K('months_per_year'),
      2))
  - cr_gap: DAYS(F('disenrollment_date'), CFIELD('select', 'enrollment_effective_date')) if cr_s_eff else 999
  - cr_dis_val: >-
      cr_val if (cr_s_eff and cr_gap == 1) else (RND(cr_val / 2, 2) if (cr_s_eff and cr_gap >= 2 and cr_gap <= 15)
      else 0)
  - cr_figured: RND((cr_months - cr_pre_n) * cr_val + cr_pre_n * cr_dis_val, 2)
  - cr_posted: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_credit', related_fee_entry_id=cr_inst)
  - cr_late_pay: >-
      LATEST('prime_fee_ledger', 'prime_fee_entry_id', date_field='posted_date', event_type='prime_fee_payment',
      related_fee_entry_id=cr_inst)
  - cr_ref: SUM('prime_fee_ledger', 'amount', event_type='prime_fee_refund', related_fee_entry_id=cr_late_pay)
  - cr_short: >-
      RND(MX(0, cr_amt - SUM('prime_fee_ledger', 'amount', event_type='prime_fee_payment', related_fee_entry_id=cr_inst)),
      2)
  - cr_off: cr_posted if cr_posted > 0 else (cr_ref if cr_ref > 0 else cr_short)
  - result: RND(MX(0, cr_figured - cr_off), 2)
  compute_basis:
