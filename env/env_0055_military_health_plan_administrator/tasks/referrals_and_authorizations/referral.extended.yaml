      the block stands as set.
    a_readmit_gap: >-
      A rapid readmission is approved in a shorter first block and reviewed sooner: where the patient's most recent inpatient
      mental health admission line is dated one to seven days before the request date, the block is halved and rounded up;
      where it is dated eight to thirty days before the request date and the tier sets a concurrent review interval, the block
      is rounded up to a whole number of those intervals; otherwise, including a tier that sets no concurrent review interval,
      the block stands as set.
    paced: >-
      A rapid readmission is approved in a shorter first block and reviewed sooner: where the patient's most recent inpatient
      mental health admission line is dated one to seven days before the request date, the block is halved and rounded up;
      where it is dated eight to thirty days before the request date and the tier sets a concurrent review interval, the block
      is rounded up to a whole number of those intervals; otherwise, including a tier that sets no concurrent review interval,
      the block stands as set.
    result: >-
      The days approved are the paced block plus the aftercare, emergency and repeat-admission days, never fewer than one,
      and never more than the units requested or the tier's maximum units per authorization.
  factors:
  - id: readmission_initial_block
    effect: parameter
    decides: block
    bindings:
    - a_ed_last
    - a_imh_1m
    - block
    ladder:
    - when: an inpatient mental health admission line in the last month and an emergency visit no more than seven days ago
      value: K('readmission_initial_days')
    - when: such an admission line in the last month and no emergency visit that recent
