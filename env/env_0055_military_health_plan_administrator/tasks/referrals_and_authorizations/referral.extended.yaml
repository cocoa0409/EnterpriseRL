  cross_category:
  - category: appeal
    as: branch
    reads:
    - status
    - filing_date
    - subject_referral_authorization_id
    - appeal_case_documents.document_kind
    note: The decision of the most recent reconsideration of the authorization, and the letter of medical necessity on it,
