    k_status: >-
      An authorization issued on an overturned denial releases no more than the reconsideration reversed: where its unit history
      shows a grant on an appeal overturn and the patient's most recent reconsideration of it is decided overturned, the units
      left are capped at the units requested less the units used and less the lines counted as used; where its unit history
      shows such a grant and that reconsideration is decided partially overturned, the units left are capped at half the units
      requested, rounded down, less the same; otherwise the units left are not capped.
    open_units: >-
      An authorization issued on an overturned denial releases no more than the reconsideration reversed: where its unit history
