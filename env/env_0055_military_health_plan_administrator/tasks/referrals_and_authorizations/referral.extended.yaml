- id: referral_ext_inpatient_closure
  base_policy_refs:
  - referral_cancellation_and_expiry
  overwrite:
  - base_policy: referral_cancellation_and_expiry
    superseded_clause: >-
      Cancellation and expiry release every unit still remaining where cancellation_releases_units or expiry_releases_units
      is true.
    replaced_by: >-
      The held days are subtracted from the days that count toward the release and any day added back by aftercare is added,
      and the release is never fewer than zero.
  trigger: on_request
  subject:
  - referral_cancel
  computes: units_released
  target_tool: confirm_inpatient_closure_5bde1317
  params:
    crisis_two_hold: 1
    crisis_three_hold: 2
    fresh_line_hold: 1
    unposted_line_hold: 2
    fresh_line_days: 3
    repeat_reserve_recent: 2
    repeat_reserve_year: 1
    step_down_window_days: 7
    aftercare_return_days: 1
    late_aftercare_hold: 1
  rule: >-
    When the patient, or the parent or guardian of a minor patient, confirms the cancellation of an approved skilled nursing
    facility or inpatient mental health authorization covered under TRICARE Prime whose stay has ended, it is closed as cancelled
    that day and the inpatient days left on it are released. The days left are the units granted plus the units added by extensions
    less the units used, all read from the authorization's unit history, and the standard release is every day left. A readmission
    inside the span decides which days count toward the release: where the patient's most recent emergency department visit
    is dated on or before the authorization's last span day and after the last day covered by its latest use (the patient
    came back into crisis care inside the span), only the days from the day after that covered day through the readmission
    day count, never more than the days left, and the span days after the readmission are closed for the new stay; where there
    is no such readmission and the span days after the last covered day are fewer than the days left, only those span days
    count, because days that no longer fit in the span could never have been used; otherwise the days left count in full.
    Repeated crisis care keeps days back from the release, because a patient in a run of emergency visits is the one most
    likely to need another short admission: where three or more emergency department visits of the patient are dated in the
    last month, two days are held; where exactly two are, one day is held; otherwise nothing is held. A fresh facility bill
    holds a day: where the facility's most recent claim line under the authorization was posted no more than three days ago
    and a use is already posted, one day is held; where such a line was posted no more than three days ago and no use is posted
    yet, two days are held; otherwise nothing is held. Repeat admissions keep a crisis reserve: where two or more inpatient
    mental health admission lines of the patient are dated in the last three months, two days are held; where fewer than two
    are dated in the last three months but two or more are dated in the last twelve months, one day is held; otherwise nothing
    is held. Outpatient aftercare decides the step-down day: where the patient's most recent outpatient behavioral health
    visit falls after the last covered day and within seven days of it, aftercare picked the patient up and one day is added
    back to the release; where it falls more than seven days after the last covered day and there is a readmission inside
    the span (the patient's most recent emergency department visit is dated after the last covered day and on or before the
    span's last day, the same test the readmission split uses), one more day is held for a step-down to partial hospitalization;
    otherwise nothing changes. The held days are subtracted from the days that count toward the release and any day added
    back by aftercare is added, and the release is never fewer than zero.
  prerequisite: []
  cross_category:
  - category: prime
    as: history
    reads:
    - prime_claim_lines.service_class
    - prime_claim_lines.service_date
    - prime_claim_lines.posted_date
    - prime_claim_lines.referral_authorization_id
    note: Emergency, inpatient mental health and outpatient behavioral health lines of the patient decide the readmission
      split, the crisis hold, the fresh-bill hold, the repeat-admission reserve and the step-down day.
  compute:
  - i_granted: SUM('referral_unit_ledger', 'units', event_type='referral_units_grant')
  - i_added: SUM('referral_unit_ledger', 'units', event_type='referral_units_extend')
  - i_used: SUM('referral_unit_ledger', 'units', event_type='referral_units_consume')
  - i_left: i_granted + i_added - i_used
  - i_last_use: LATEST('referral_unit_ledger', 'service_date', date_field='service_date', event_type='referral_units_consume')
  - i_last_use_days: LATEST('referral_unit_ledger', 'units', date_field='service_date', event_type='referral_units_consume')
      or 0
  - i_readmit: XLATEST('prime', 'prime_claim_lines', 'service_date', date_field='service_date', service_class='emergency_room_visit',
      event_type='prime_claim_line_post')
  - i_gap: DAYS(i_last_use, i_readmit) - i_last_use_days + 1 if (i_last_use != None and i_readmit != None) else -999
  - i_inside: DAYS(i_readmit, F('valid_through')) if i_readmit != None else -999
  - i_span_after: DAYS(i_last_use, F('valid_through')) - i_last_use_days + 1 if i_last_use != None else i_left
  - basis: MN(i_left, i_gap) if (i_inside >= 0 and i_gap > 0) else (MX(0, i_span_after) if i_span_after < i_left else i_left)
  - i_ed_1m: XCOUNT('prime', 'prime_claim_lines', within_months=1, date_field='service_date', service_class='emergency_room_visit',
      event_type='prime_claim_line_post')
  - crisis_hold: K('crisis_three_hold') if i_ed_1m >= 3 else (K('crisis_two_hold') if i_ed_1m == 2 else 0)
  - i_line_posted: XLATEST('prime', 'prime_claim_lines', 'posted_date', date_field='posted_date', referral_authorization_id=HID,
      event_type='prime_claim_line_post')
  - i_line_age: DAYS(i_line_posted, NOW) if i_line_posted != None else 999
  - line_hold: K('fresh_line_hold') if (i_line_age <= K('fresh_line_days') and i_used > 0) else (K('unposted_line_hold') if
      (i_line_age <= K('fresh_line_days') and i_used == 0) else 0)
  - i_imh_3m: XCOUNT('prime', 'prime_claim_lines', within_months=3, date_field='service_date', service_class='inpatient_mental_health_admission',
      event_type='prime_claim_line_post')
  - i_imh_12m: XCOUNT('prime', 'prime_claim_lines', within_months=12, date_field='service_date', service_class='inpatient_mental_health_admission',
      event_type='prime_claim_line_post')
  - repeat_hold: K('repeat_reserve_recent') if (i_imh_3m >= 2 and i_imh_12m >= 2) else (K('repeat_reserve_year') if (i_imh_3m
      < 2 and i_imh_12m >= 2) else 0)
  - i_op_last: XLATEST('prime', 'prime_claim_lines', 'service_date', date_field='service_date', service_class='outpatient_behavioral_health_individual',
      event_type='prime_claim_line_post')
  - i_op_after: DAYS(i_last_use, i_op_last) - i_last_use_days + 1 if (i_last_use != None and i_op_last != None) else -999
  - step_adj: K('aftercare_return_days') if (i_op_after > 0 and i_op_after <= K('step_down_window_days')) else ((0 - K('late_aftercare_hold'))
      if (i_op_after > K('step_down_window_days') and i_inside >= 0 and i_gap > 0) else 0)
  - result: int(MX(0, basis - crisis_hold - line_hold - repeat_hold + step_adj))
