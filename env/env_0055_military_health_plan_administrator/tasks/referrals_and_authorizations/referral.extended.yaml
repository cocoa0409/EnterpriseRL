      requested, rounded down, less the same; otherwise the units left are not capped.
    k_last_visit: >-
      A closing visit is held for the provider's discharge assessment: where the tier requires the patient to be homebound
      and the servicing provider's latest claim line is dated no more than seven days ago, one visit is held; where the tier
      is counted in hours and that latest line is dated no more than seven days ago, two hours are held for a transition session;
      otherwise nothing is held.
    k_since_visit: >-
      A closing visit is held for the provider's discharge assessment: where the tier requires the patient to be homebound
      and the servicing provider's latest claim line is dated no more than seven days ago, one visit is held; where the tier
      is counted in hours and that latest line is dated no more than seven days ago, two hours are held for a transition session;
      otherwise nothing is held.
    closing_hold: >-
      A closing visit is held for the provider's discharge assessment: where the tier requires the patient to be homebound
      and the servicing provider's latest claim line is dated no more than seven days ago, one visit is held; where the tier
      is counted in hours and that latest line is dated no more than seven days ago, two hours are held for a transition session;
      otherwise nothing is held.
    k_dme_class: >-
      An equipment follow-up is held for tiers that require the patient to be homebound, so the provider can close out training
      on newly placed equipment: where the patient's most recently delivered item in rental is Capped Rental Equipment or
      a Power Mobility Device delivered no more than thirty days ago, two visits are held; where it is another kind of item
      delivered no more than thirty days ago, one visit is held; otherwise nothing is held.
    k_dme_delivered: >-
      An equipment follow-up is held for tiers that require the patient to be homebound, so the provider can close out training
      on newly placed equipment: where the patient's most recently delivered item in rental is Capped Rental Equipment or
      a Power Mobility Device delivered no more than thirty days ago, two visits are held; where it is another kind of item
      delivered no more than thirty days ago, one visit is held; otherwise nothing is held.
    equip_hold: >-
      An equipment follow-up is held for tiers that require the patient to be homebound, so the provider can close out training
      on newly placed equipment: where the patient's most recently delivered item in rental is Capped Rental Equipment or
      a Power Mobility Device delivered no more than thirty days ago, two visits are held; where it is another kind of item
      delivered no more than thirty days ago, one visit is held; otherwise nothing is held.
    k_last_bill: >-
      A billing-lag hold covers visits made but not yet billed: where the servicing provider's most recent claim line was
      posted no more than three days ago and three or more of its lines are dated in the last month, one unit is held; where
      its most recent line was posted no more than three days ago and fewer than three of its lines are dated in the last
      month (the provider bills irregularly), two units are held; otherwise nothing is held.
    k_bill_age: >-
      A billing-lag hold covers visits made but not yet billed: where the servicing provider's most recent claim line was
      posted no more than three days ago and three or more of its lines are dated in the last month, one unit is held; where
      its most recent line was posted no more than three days ago and fewer than three of its lines are dated in the last
      month (the provider bills irregularly), two units are held; otherwise nothing is held.
    lag_hold: >-
      A billing-lag hold covers visits made but not yet billed: where the servicing provider's most recent claim line was
      posted no more than three days ago and three or more of its lines are dated in the last month, one unit is held; where
      its most recent line was posted no more than three days ago and fewer than three of its lines are dated in the last
      month (the provider bills irregularly), two units are held; otherwise nothing is held.
    k_span_age: >-
      A first-period hold protects the provider's thirty-day home health billing period, whose low-utilization threshold turns
      on the visits made in it, for tiers that require the patient to be homebound: where fewer than thirty days have passed
      from the first day of the span to today and fewer than eight lines from the servicing provider are dated in the last
      month, two units are held; where thirty days or more have passed and fewer than eight such lines are dated in the last
      month, one unit is held; otherwise nothing is held.
    period_hold: >-
      A first-period hold protects the provider's thirty-day home health billing period, whose low-utilization threshold turns
      on the visits made in it, for tiers that require the patient to be homebound: where fewer than thirty days have passed
      from the first day of the span to today and fewer than eight lines from the servicing provider are dated in the last
      month, two units are held; where thirty days or more have passed and fewer than eight such lines are dated in the last
      month, one unit is held; otherwise nothing is held.
    result: >-
      The holds are subtracted from the units left after any cap, and the release is never fewer than zero.
