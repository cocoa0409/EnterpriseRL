    step_adj: >-
      Outpatient aftercare decides the step-down day: where the patient's most recent outpatient behavioral health visit falls
      after the last covered day and within seven days of it, aftercare picked the patient up and one day is added back to
      the release; where it falls more than seven days after the last covered day and there is a readmission inside the span
      (the patient's most recent emergency department visit is dated after the last covered day and on or before the span's
      last day, the same test the readmission split uses), one more day is held for a step-down to partial hospitalization;
      otherwise nothing changes.
    result: >-
      The held days are subtracted from the days that count toward the release and any day added back by aftercare is added,
      and the release is never fewer than zero.
  factors:
  - id: readmission_split
    effect: method
    decides: basis
    bindings:
    - i_readmit
    - i_gap
    - i_inside
    - i_span_after
    - basis
    ladder:
    - when: the latest emergency visit is on or before the span's last day and after the last day covered by the latest use
      method: count only the days from the day after the last covered day through the readmission day, never more than the
        days left
    - when: no such readmission and the span days after the last covered day are fewer than the days left
      method: count only those span days
    - when: otherwise
      method: the days left count in full
    baseline:
      basis: i_left
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: prime
  - id: crisis_frequency_hold
    effect: parameter
    decides: crisis_hold
    bindings:
    - i_ed_1m
    - crisis_hold
    ladder:
    - when: three or more emergency visits in the last month
      value: K('crisis_three_hold')
    - when: exactly two emergency visits in the last month
      value: K('crisis_two_hold')
    - when: otherwise
      value: '0'
    baseline:
      crisis_hold: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  - id: fresh_facility_line
    effect: parameter
    decides: line_hold
    bindings:
    - i_line_posted
    - i_line_age
    - line_hold
    ladder:
    - when: the facility's latest line posted no more than three days ago and a use is posted
      value: K('fresh_line_hold')
    - when: such a line posted no more than three days ago and no use is posted
      value: K('unposted_line_hold')
    - when: otherwise
      value: '0'
    baseline:
      line_hold: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: prime
  - id: repeat_admission_reserve
    effect: parameter
    decides: repeat_hold
    bindings:
    - i_imh_3m
    - i_imh_12m
    - repeat_hold
    ladder:
    - when: two or more inpatient mental health admission lines in the last three months
      value: K('repeat_reserve_recent')
    - when: fewer than two in three months but two or more in twelve months
      value: K('repeat_reserve_year')
    - when: otherwise
      value: '0'
    baseline:
      repeat_hold: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  - id: outpatient_step_down
    effect: parameter
    decides: step_adj
    bindings:
    - i_op_last
    - i_op_after
    - step_adj
    ladder:
    - when: the latest outpatient behavioral health visit falls after the last covered day and within seven days of it
      value: plus K('aftercare_return_days')
    - when: it falls more than seven days after the last covered day and the most recent emergency visit is dated after the
        last covered day and on or before the span's last day
      value: minus K('late_aftercare_hold')
    - when: otherwise
      value: '0'
    baseline:
      step_adj: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: prime
  baseline:
    rule: >-
      When the patient, or the parent or guardian of a minor patient, confirms the cancellation of an approved skilled nursing
      facility or inpatient mental health authorization covered under TRICARE Prime whose stay has ended, it is closed as
      cancelled that day and the inpatient days left on it are released. The days left are the units granted plus the units
      added by extensions less the units used, all read from the authorization's unit history, and the standard release is
      every day left.
    params: []
  inputs:
    history:
    - table: referral_unit_ledger
      aggregate: sum
      field: units
      filters:
        event_type: referral_units_consume
    - category: prime
      table: prime_claim_lines
      aggregate: count
      field: prime_claim_line_id
      within_months: 12
      filters:
        service_class: inpatient_mental_health_admission
    cross_category:
    - prime
- id: referral_ext_rofr_lapse_approval
  base_policy_refs:
  - referral_agg_multi_holding
  - referral_agg_duplicate_requests
  - referral_requirement_by_plan
  - referral_review_and_pend
  - referral_validity_and_units
  - referral_right_of_first_refusal
  - referral_active_duty_review
  - referral_program_requirements
  overwrite:
  - base_policy: referral_validity_and_units
    superseded_clause: >-
      The units authorized are the lesser of the units requested and default_units_authorized, and never more than max_units_per_authorization
    replaced_by: >-
      The days approved are the paced block plus the aftercare, emergency and repeat-admission days, never fewer than one,
      and never more than the units requested or the tier's maximum units per authorization.
  - base_policy: referral_agg_multi_holding
    superseded_clause: >-
      A patient may hold any number of referrals and authorizations at once, of the same or different types, so long as no
      two of them are duplicates under referral_agg_duplicate_requests.
    replaced_by: >-
      A patient holds only one open inpatient mental health authorization at a time, whatever the facility, because a patient
      is an inpatient of one psychiatric facility at a time.
  - base_policy: referral_requirement_by_plan
    superseded_clause: >-
      The patient holds an active enrollment in a plan listed in the tier's required_for_plans on the request date.
    replaced_by: >-
      For a TRICARE Prime request, the patient holds an active TRICARE Prime enrollment on the request date.
  trigger: state_due
  subject:
  - referral_approve
  computes: units_authorized
  target_tool: approve_pending_authorization_775ce183
  params:
    rapid_readmission_days: 7
    readmission_window_days: 30
    readmission_initial_days: 3
    readmission_quiet_days: 5
    recent_ed_days: 7
    engaged_visits: 3
    engaged_reduction: 1
    no_aftercare_addition: 2
    crisis_two: 1
    crisis_three: 2
    repeat_two: 1
    repeat_three: 2
  rule: >-
    When a TRICARE Prime request of a tier whose military clinic has the right of first refusal is still submitted after the
    clinic's response window has passed with no answer and it duplicates no approved, unexpired authorization of the patient,
    the region approves it to the requested network provider: the validity span starts under the tier's start rule and runs
    the tier's validity days counting the first day as day 1. The days approved are the lesser of the units requested, the
    tier's default units authorized and the tier's maximum units per authorization. For a TRICARE Prime request, the patient
    holds an active TRICARE Prime enrollment on the request date. A request that would duplicate an approved, unexpired authorization
    of the same type for the same patient and the same servicing provider is not approved under this rule: it is denied as
    duplicate_request and the patient is pointed to the authorization already on file, as the duplicate rule requires. A patient
    holds only one open inpatient mental health authorization at a time, whatever the facility, because a patient is an inpatient
    of one psychiatric facility at a time. A pending inpatient mental health request is not approved until every other inpatient
    mental health authorization of the patient with a different servicing provider whose validity span is still running shows
    as cancelled or exhausted. A readmission shortens the initial block: where an inpatient mental health admission line of
    the patient is dated in the last month and an emergency department visit is dated no more than seven days ago, the block
    is three days; where such an admission line is dated in the last month and no emergency visit is that recent, the block
    is five days; otherwise the block is the tier's default units authorized. Aftercare engagement moves the block: where
    three or more outpatient behavioral health visits of the patient are dated in the last three months, one day is taken
    off; where none is dated in the last twelve months, two days are added; otherwise nothing changes. Emergency frequency
    adds days: where three or more emergency department visits of the patient are dated in the last month, two days are added;
    where exactly two are, one day is added; otherwise none. Repeat admissions add days: where three or more inpatient mental
    health admission lines of the patient are dated in the last twelve months, two days are added; where exactly two are,
    one day is added; otherwise none. A rapid readmission is approved in a shorter first block and reviewed sooner: where
    the patient's most recent inpatient mental health admission line is dated one to seven days before the request date, the
    block is halved and rounded up; where it is dated eight to thirty days before the request date and the tier sets a concurrent
    review interval, the block is rounded up to a whole number of those intervals; otherwise, including a tier that sets no
    concurrent review interval, the block stands as set. The days approved are the paced block plus the aftercare, emergency
    and repeat-admission days, never fewer than one, and never more than the units requested or the tier's maximum units per
    authorization.
  prerequisite:
  - problem: referral_ext_inpatient_closure
    kind: state_gate
    gate: referral_authorizations.status
    form: state
    policy_source: >-
      A pending inpatient mental health request is not approved until every other inpatient mental health authorization of
      the patient with a different servicing provider whose validity span is still running shows as cancelled or exhausted.
    condition: >-
      Every other referral_authorizations row of the patient with variant_name Inpatient Mental Health Authorization, a servicing_provider_id
      different from the request's and a valid_through on or after today has status cancelled or exhausted.
    resolved_by: confirm_inpatient_closure_5bde1317
    effect: >-
      Once the earlier stay's authorization at the other facility shows as cancelled, the patient holds no other open inpatient
      mental health authorization and the pending request may be approved.
  cross_category:
  - category: prime
    as: history
    reads:
    - prime_claim_lines.service_class
    - prime_claim_lines.service_date
    note: Inpatient mental health, emergency and outpatient behavioral health lines of the patient decide the readmission
      block, aftercare engagement, emergency frequency, repeat-admission and readmission-pacing tiers.
  compute:
  - a_ed_last: XLATEST('prime', 'prime_claim_lines', 'service_date', date_field='service_date', service_class='emergency_room_visit',
      event_type='prime_claim_line_post')
  - a_imh_1m: XCOUNT('prime', 'prime_claim_lines', within_months=1, date_field='service_date', service_class='inpatient_mental_health_admission',
      event_type='prime_claim_line_post')
  - block: K('readmission_initial_days') if (a_imh_1m > 0 and a_ed_last != None and DAYS(a_ed_last, NOW) <= K('recent_ed_days'))
      else (K('readmission_quiet_days') if (a_imh_1m > 0 and (a_ed_last == None or DAYS(a_ed_last, NOW) > K('recent_ed_days')))
      else P('default_units_authorized'))
  - a_op_3m: XCOUNT('prime', 'prime_claim_lines', within_months=3, date_field='service_date', service_class='outpatient_behavioral_health_individual',
      event_type='prime_claim_line_post')
  - a_op_12m: XCOUNT('prime', 'prime_claim_lines', within_months=12, date_field='service_date', service_class='outpatient_behavioral_health_individual',
      event_type='prime_claim_line_post')
  - engage: (0 - K('engaged_reduction')) if a_op_3m >= K('engaged_visits') else (K('no_aftercare_addition') if a_op_12m ==
      0 else 0)
  - a_ed_1m: XCOUNT('prime', 'prime_claim_lines', within_months=1, date_field='service_date', service_class='emergency_room_visit',
      event_type='prime_claim_line_post')
  - crisis: K('crisis_three') if a_ed_1m >= 3 else (K('crisis_two') if a_ed_1m == 2 else 0)
  - a_imh_12m: XCOUNT('prime', 'prime_claim_lines', within_months=12, date_field='service_date', service_class='inpatient_mental_health_admission',
      event_type='prime_claim_line_post')
  - repeat: K('repeat_three') if a_imh_12m >= 3 else (K('repeat_two') if a_imh_12m == 2 else 0)
  - a_prev_imh: XLATEST('prime', 'prime_claim_lines', 'service_date', date_field='service_date', service_class='inpatient_mental_health_admission',
      event_type='prime_claim_line_post')
  - a_readmit_gap: DAYS(a_prev_imh, F('request_date')) if a_prev_imh != None else -1
  - paced: int((block + 1) / 2) if (a_readmit_gap > 0 and a_readmit_gap <= K('rapid_readmission_days')) else ((int((block
      + P('concurrent_review_interval_days') - 1) / P('concurrent_review_interval_days')) * P('concurrent_review_interval_days'))
      if (a_readmit_gap > K('rapid_readmission_days') and a_readmit_gap <= K('readmission_window_days') and P('concurrent_review_interval_days')
      > 0) else block)
  - result: MN(F('units_requested'), P('max_units_per_authorization'), MX(1, paced + engage + crisis + repeat))
  compute_basis:
    a_ed_last: >-
      A readmission shortens the initial block: where an inpatient mental health admission line of the patient is dated in
      the last month and an emergency department visit is dated no more than seven days ago, the block is three days; where
      such an admission line is dated in the last month and no emergency visit is that recent, the block is five days; otherwise
      the block is the tier's default units authorized.
    a_imh_1m: >-
      A readmission shortens the initial block: where an inpatient mental health admission line of the patient is dated in
