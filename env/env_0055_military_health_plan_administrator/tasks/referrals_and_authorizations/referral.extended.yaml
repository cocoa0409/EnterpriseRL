    reads:
    - select_claim_lines.provider_id
    - select_claim_lines.service_class
    - select_claim_lines.service_date
    note: Claim lines from the servicing provider, facility and acute lines, home health visits and emergency visits decide
      the care-under-appeal, admission-source, later-period and readmission tiers.
  - category: dme
    as: branch
    reads:
    - variant_name
    - delivery_date
    - status
    note: The most recently delivered item in rental decides the equipment-training tier.
  compute:
  - case_status: XLATEST('appeal', 'appeal_cases', 'status', date_field='filing_date', subject_referral_authorization_id=HID)
  - case_id: XLATEST('appeal', 'appeal_cases', 'appeal_case_id', date_field='filing_date', subject_referral_authorization_id=HID)
  - case_lmn: XCOUNT('appeal', 'appeal_case_documents', appeal_case_id=case_id, document_kind='letter_of_medical_necessity')
      if case_id != None else 0
  - basis: MN(F('units_requested'), P('max_units_per_authorization')) if (case_status == 'decided_overturned' and case_lmn
      > 0) else (int(MN(F('units_requested'), P('max_units_per_authorization')) / 2) if case_status == 'decided_partially_overturned'
      else MN(F('units_requested'), P('default_units_authorized'), P('max_units_per_authorization')))
  - delivered: XCOUNT('select', 'select_claim_lines', within_months=1, date_field='service_date', provider_id=F('servicing_provider_id'),
      event_type='select_claim_line_post')
  - addback: delivered if (delivered > 0 and case_status == 'decided_overturned') else (int((delivered + 1) / 2) if (delivered
      > 0 and case_status == 'decided_partially_overturned') else 0)
  - snf_recent: XCOUNT('select', 'select_claim_lines', within_months=1, date_field='service_date', service_class='skilled_nursing_facility',
      event_type='select_claim_line_post')
  - acute_recent: XCOUNT('select', 'select_claim_lines', within_months=1, date_field='service_date', service_class='inpatient_admission',
      event_type='select_claim_line_post')
  - frontload: K('institutional_both_visits') if (P('homebound_status_required') == True and snf_recent > 0 and acute_recent
