    a_prev_imh: >-
      A rapid readmission is approved in a shorter first block and reviewed sooner: where the patient's most recent inpatient
      mental health admission line is dated one to seven days before the request date, the block is halved and rounded up;
      where it is dated eight to thirty days before the request date and the tier sets a concurrent review interval, the block
