    basis: >-
      The reversal sets the basis of the units issued: where the patient's most recent reconsideration of the authorization
      is decided overturned and a letter of medical necessity is on that case (the plan of care the reviewer reversed on),
      the basis is the units requested, never more than the tier's maximum units per authorization; where it is decided partially
      overturned, the basis is half of that figure, rounded down; otherwise the basis is the lesser of the units requested,
      the default units authorized and the maximum.
    delivered: >-
      Care the servicing provider gave while the denial stood is covered on top of the basis: where claim lines from the authorization's
      servicing provider are dated in the last month and that reconsideration is decided overturned, one unit per such line
      is added; where such lines exist and it is decided partially overturned, half of those lines, rounded up, is added;
      otherwise nothing is added.
    addback: >-
      Care the servicing provider gave while the denial stood is covered on top of the basis: where claim lines from the authorization's
      servicing provider are dated in the last month and that reconsideration is decided overturned, one unit per such line
      is added; where such lines exist and it is decided partially overturned, half of those lines, rounded up, is added;
      otherwise nothing is added.
    snf_recent: >-
      An institutional admission source front-loads visits for tiers that require the patient to be homebound: where both
      a skilled nursing facility line and an acute inpatient admission line of the patient are dated in the last month, six
      visits are added; where only one of the two is dated in the last month, three visits are added; otherwise none are added.
    acute_recent: >-
      An institutional admission source front-loads visits for tiers that require the patient to be homebound: where both
      a skilled nursing facility line and an acute inpatient admission line of the patient are dated in the last month, six
      visits are added; where only one of the two is dated in the last month, three visits are added; otherwise none are added.
    frontload: >-
      An institutional admission source front-loads visits for tiers that require the patient to be homebound: where both
      a skilled nursing facility line and an acute inpatient admission line of the patient are dated in the last month, six
      visits are added; where only one of the two is dated in the last month, three visits are added; otherwise none are added.
    hh_1m: >-
      An episode that follows earlier home care is a later period and is shorter for tiers that require the patient to be
      homebound: where home health visits of the patient are dated between one and three months ago, four visits are taken
      off; where none are but home health visits are dated between three and twelve months ago, two visits are taken off;
      otherwise nothing is taken off.
    hh_3m: >-
      An episode that follows earlier home care is a later period and is shorter for tiers that require the patient to be
      homebound: where home health visits of the patient are dated between one and three months ago, four visits are taken
      off; where none are but home health visits are dated between three and twelve months ago, two visits are taken off;
      otherwise nothing is taken off.
    hh_12m: >-
      An episode that follows earlier home care is a later period and is shorter for tiers that require the patient to be
      homebound: where home health visits of the patient are dated between one and three months ago, four visits are taken
      off; where none are but home health visits are dated between three and twelve months ago, two visits are taken off;
      otherwise nothing is taken off.
    timing: >-
      An episode that follows earlier home care is a later period and is shorter for tiers that require the patient to be
      homebound: where home health visits of the patient are dated between one and three months ago, four visits are taken
      off; where none are but home health visits are dated between three and twelve months ago, two visits are taken off;
      otherwise nothing is taken off.
    dme_class: >-
      Equipment newly placed for home use adds training visits: where the patient's most recently delivered item in rental
      is Capped Rental Equipment or a Power Mobility Device delivered no more than thirty days ago, two visits are added;
      where it is another kind of item delivered no more than thirty days ago, one visit is added; otherwise none are added.
    dme_delivered: >-
      Equipment newly placed for home use adds training visits: where the patient's most recently delivered item in rental
      is Capped Rental Equipment or a Power Mobility Device delivered no more than thirty days ago, two visits are added;
      where it is another kind of item delivered no more than thirty days ago, one visit is added; otherwise none are added.
    training: >-
      Equipment newly placed for home use adds training visits: where the patient's most recently delivered item in rental
      is Capped Rental Equipment or a Power Mobility Device delivered no more than thirty days ago, two visits are added;
      where it is another kind of item delivered no more than thirty days ago, one visit is added; otherwise none are added.
    acute_latest: >-
      A readmission during a facility stay adds visits: where the patient's most recent acute inpatient admission began after
      the start of the patient's most recent skilled nursing facility line, four visits are added; where that is not so but
      an emergency department visit of the patient is dated in the last month, two visits are added; otherwise none are added.
    facility_latest: >-
      A readmission during a facility stay adds visits: where the patient's most recent acute inpatient admission began after
      the start of the patient's most recent skilled nursing facility line, four visits are added; where that is not so but
      an emergency department visit of the patient is dated in the last month, two visits are added; otherwise none are added.
    ed_recent: >-
      A readmission during a facility stay adds visits: where the patient's most recent acute inpatient admission began after
      the start of the patient's most recent skilled nursing facility line, four visits are added; where that is not so but
      an emergency department visit of the patient is dated in the last month, two visits are added; otherwise none are added.
    risk: >-
      A readmission during a facility stay adds visits: where the patient's most recent acute inpatient admission began after
      the start of the patient's most recent skilled nursing facility line, four visits are added; where that is not so but
      an emergency department visit of the patient is dated in the last month, two visits are added; otherwise none are added.
    result: >-
      The units issued are the basis plus the care under appeal, the admission-source visits, the training visits and the
      readmission visits, less the later-period reduction, never more than the tier's maximum units per authorization.
  factors:
