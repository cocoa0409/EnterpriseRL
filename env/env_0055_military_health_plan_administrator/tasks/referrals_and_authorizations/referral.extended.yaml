- id: referral_ext_outpatient_cancellation
  base_policy_refs:
  - referral_cancellation_and_expiry
  overwrite:
  - base_policy: referral_cancellation_and_expiry
    superseded_clause: >-
      Cancellation and expiry release every unit still remaining where cancellation_releases_units or expiry_releases_units
      is true.
    replaced_by: >-
      The holds are subtracted from the units left after any cap, and the release is never fewer than zero.
  trigger: on_request
  subject:
  - referral_cancel
  computes: units_released
  target_tool: confirm_outpatient_cancellation_09e1d470
  params:
    discharge_visit_hold: 1
    transition_hours_hold: 2
    closing_window_days: 7
    major_equipment_followup: 2
    minor_equipment_followup: 1
    equipment_window_days: 30
    lag_window_days: 3
    lag_min_lines: 3
    lag_hold_regular: 1
    lag_hold_sparse: 2
    period_days: 30
    period_minimum_visits: 8
    first_period_hold: 2
    late_period_hold: 1
  rule: >-
    When the patient, or the parent or guardian of a minor patient, confirms the cancellation of an approved authorization
    counted in visits, hours or rental months, it is closed as cancelled that day and the units left on it are released. The
    units left are the units granted plus the units added by extensions less the units used, all read from the authorization's
    unit history, and the standard release is every unit left. The units a cancellation releases are figured only after any
    reconsideration of the authorization's denial that was decided overturned or partially overturned shows as a grant on
    an appeal overturn in the authorization's unit history. Visits the servicing provider has billed count as used even before
    their use entries are posted, over the window the authorization's issue makes relevant: where its unit history shows a
    grant on an appeal overturn (care was given while the denial stood), the servicing provider's claim lines dated in the
    last month count as used, less the uses already posted; where it shows no such grant and the servicing provider's claim
    lines outnumber the uses posted, every one of those lines beyond the posted uses counts as used; otherwise only the posted
    uses count. An authorization issued on an overturned denial releases no more than the reconsideration reversed: where
    its unit history shows a grant on an appeal overturn and the patient's most recent reconsideration of it is decided overturned,
    the units left are capped at the units requested less the units used and less the lines counted as used; where its unit
    history shows such a grant and that reconsideration is decided partially overturned, the units left are capped at half
    the units requested, rounded down, less the same; otherwise the units left are not capped. A closing visit is held for
    the provider's discharge assessment: where the tier requires the patient to be homebound and the servicing provider's
    latest claim line is dated no more than seven days ago, one visit is held; where the tier is counted in hours and that
    latest line is dated no more than seven days ago, two hours are held for a transition session; otherwise nothing is held.
    An equipment follow-up is held for tiers that require the patient to be homebound, so the provider can close out training
    on newly placed equipment: where the patient's most recently delivered item in rental is Capped Rental Equipment or a
    Power Mobility Device delivered no more than thirty days ago, two visits are held; where it is another kind of item delivered
    no more than thirty days ago, one visit is held; otherwise nothing is held. A billing-lag hold covers visits made but
    not yet billed: where the servicing provider's most recent claim line was posted no more than three days ago and three
    or more of its lines are dated in the last month, one unit is held; where its most recent line was posted no more than
    three days ago and fewer than three of its lines are dated in the last month (the provider bills irregularly), two units
    are held; otherwise nothing is held. A first-period hold protects the provider's thirty-day home health billing period,
    whose low-utilization threshold turns on the visits made in it, for tiers that require the patient to be homebound: where
    fewer than thirty days have passed from the first day of the span to today and fewer than eight lines from the servicing
    provider are dated in the last month, two units are held; where thirty days or more have passed and fewer than eight such
    lines are dated in the last month, one unit is held; otherwise nothing is held. The holds are subtracted from the units
    left after any cap, and the release is never fewer than zero.
  prerequisite:
  - problem: referral_ext_overturned_issue
    kind: value_input
    gate: k_granted
    form: state
    policy_source: >-
      The units a cancellation releases are figured only after any reconsideration of the authorization's denial that was
      decided overturned or partially overturned shows as a grant on an appeal overturn in the authorization's unit history.
    condition: >-
      Every appeal_cases row decided_overturned or decided_partially_overturned whose subject_referral_authorization_id is
      the authorization is matched by a referral_units_grant entry with grant_basis appeal_overturn in referral_unit_ledger.
    resolved_by: issue_overturned_authorization_2ad92a55
    effect: >-
      Once the overturned denial shows as a grant, the units granted read from the unit history rise from zero to the units
      issued, and the units the cancellation releases are figured from them.
  cross_category:
  - category: select
    as: history
    reads:
    - select_claim_lines.provider_id
    - select_claim_lines.service_date
    - select_claim_lines.posted_date
    note: Lines from the servicing provider decide the billed-visit, closing-visit, billing-lag and first-period tiers.
  - category: appeal
    as: branch
    reads:
    - status
    - filing_date
    - subject_referral_authorization_id
    note: The decision of the most recent reconsideration of the authorization decides the appeal-issue cap.
  - category: dme
    as: branch
    reads:
    - variant_name
    - delivery_date
    - status
    note: The most recently delivered item in rental decides the equipment follow-up hold.
  compute:
  - k_granted: SUM('referral_unit_ledger', 'units', event_type='referral_units_grant')
  - k_added: SUM('referral_unit_ledger', 'units', event_type='referral_units_extend')
  - k_used: SUM('referral_unit_ledger', 'units', event_type='referral_units_consume')
  - k_appeal_grants: COUNT('referral_unit_ledger', event_type='referral_units_grant', grant_basis='appeal_overturn')
  - k_lines_month: XCOUNT('select', 'select_claim_lines', within_months=1, date_field='service_date', provider_id=F('servicing_provider_id'),
      event_type='select_claim_line_post')
  - k_lines_all: XCOUNT('select', 'select_claim_lines', provider_id=F('servicing_provider_id'), event_type='select_claim_line_post')
  - counted: MX(0, k_lines_month - k_used) if k_appeal_grants > 0 else ((k_lines_all - k_used) if k_lines_all > k_used else
      0)
  - k_status: XLATEST('appeal', 'appeal_cases', 'status', date_field='filing_date', subject_referral_authorization_id=HID)
  - open_units: MN(k_granted + k_added - k_used - counted, F('units_requested') - k_used - counted) if (k_appeal_grants >
      0 and k_status == 'decided_overturned') else (MN(k_granted + k_added - k_used - counted, int(F('units_requested') /
      2) - k_used - counted) if (k_appeal_grants > 0 and k_status == 'decided_partially_overturned') else k_granted + k_added
      - k_used - counted)
  - k_last_visit: XLATEST('select', 'select_claim_lines', 'service_date', date_field='service_date', provider_id=F('servicing_provider_id'),
      event_type='select_claim_line_post')
  - k_since_visit: DAYS(k_last_visit, NOW) if k_last_visit != None else 999
  - closing_hold: K('discharge_visit_hold') if (P('homebound_status_required') == True and k_since_visit <= K('closing_window_days'))
      else (K('transition_hours_hold') if (P('unit_of_measure') == 'hours' and k_since_visit <= K('closing_window_days'))
      else 0)
  - k_dme_class: XLATEST('dme', 'dme_placements', 'variant_name', date_field='delivery_date', status='in_rental')
  - k_dme_delivered: XLATEST('dme', 'dme_placements', 'delivery_date', date_field='delivery_date', status='in_rental')
  - equip_hold: K('major_equipment_followup') if ((k_dme_class == 'Capped Rental Equipment' or k_dme_class == 'Power Mobility
      Device') and P('homebound_status_required') == True and DAYS(k_dme_delivered, NOW) <= K('equipment_window_days')) else
      (K('minor_equipment_followup') if (k_dme_class != None and P('homebound_status_required') == True and DAYS(k_dme_delivered,
      NOW) <= K('equipment_window_days')) else 0)
  - k_last_bill: XLATEST('select', 'select_claim_lines', 'posted_date', date_field='posted_date', provider_id=F('servicing_provider_id'),
      event_type='select_claim_line_post')
  - k_bill_age: DAYS(k_last_bill, NOW) if k_last_bill != None else 999
  - lag_hold: K('lag_hold_regular') if (k_bill_age <= K('lag_window_days') and k_lines_month >= K('lag_min_lines')) else (K('lag_hold_sparse')
      if (k_bill_age <= K('lag_window_days') and k_lines_month < K('lag_min_lines')) else 0)
  - k_span_age: DAYS(F('valid_from'), NOW) if F('valid_from') != '' else 0
  - period_hold: K('first_period_hold') if (P('homebound_status_required') == True and k_span_age < K('period_days') and k_lines_month
      < K('period_minimum_visits')) else (K('late_period_hold') if (P('homebound_status_required') == True and k_span_age
      >= K('period_days') and k_lines_month < K('period_minimum_visits')) else 0)
  - result: int(MX(0, open_units - closing_hold - equip_hold - lag_hold - period_hold))
