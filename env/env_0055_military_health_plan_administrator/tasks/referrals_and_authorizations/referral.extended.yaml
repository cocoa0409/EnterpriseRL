# Referrals and authorizations charter for the Westbridge Military Health Services regional contract (TRICARE West Region).
# One holding = one referral or authorization issued for one patient. Approved units (visits, days, hours,
# rental months) are booked on the unit ledger; claims and appointments consume them.

category: referral
display_name: Referrals and Authorizations

binding:
  holding_table: referral_authorizations
  event_tables: [referral_unit_ledger]
  intake_tables: [referral_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {units_remaining: authorized_units}

lifecycle:
  states: [submitted, pended_information, approved, denied, cancelled, expired, exhausted]
  transitions:
    - {from: submitted, to: approved, by: agent, means: Clinical or administrative review approves the request and the authorization becomes usable from its valid_from date.}
    - {from: submitted, to: denied, by: agent, means: Review denies the request (not medically necessary, not a covered benefit, provider not authorized, duplicate).}
    - {from: submitted, to: pended_information, by: agent, means: Review cannot decide without clinical information and the request is pended while the requesting provider is asked for it.}
    - {from: pended_information, to: approved, by: agent, means: The requested information arrives in time and review approves.}
    - {from: pended_information, to: denied, by: agent, means: The information is found insufficient, or does not arrive within the pend period.}
    - {from: denied, to: approved, by: agent, means: A Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration of this denial is decided overturned and the authorization is issued.}
    - {from: approved, to: cancelled, by: user, means: The patient (or parent or guardian) confirms cancelling an authorization they no longer need; the agent records the request as an intake and the patient's confirmation ends it.}
    - {from: approved, to: expired, by: system, means: The validity span ended (the day after valid_through began) with units still unused.}
    - {from: approved, to: exhausted, by: system, means: Every authorized unit has been used.}

accounts:
  - key: authorized_units
    unit: units of the tier's unit_of_measure (visits, days, hours or rental months)
    meaning: Units authorized and not yet used on the authorization - grants and extensions add units, use consumes them and cancellation or expiry releases what is left.

parameter_schema:
  unit_of_measure: string - what one authorized unit is (visits, inpatient_days, hours, rental_months)
  service_classes_covered: list of claim service_class values the authorization covers
  required_for_plans: list of coverage plans (tricare_prime, tricare_select, premium_based_plan) under which this authorization is required for the service to be covered
  missing_authorization_outcome_prime: string - what happens under TRICARE Prime when the service is received without this authorization
  missing_authorization_outcome_select: string - what happens under TRICARE Select and premium-based plans when the service is received without this authorization
  requesting_party_required: string - who must request the authorization
  default_units_authorized: integer, units authorized on a standard approval
  max_units_per_authorization: integer, most units one authorization (including extensions) may carry
  validity_days: integer, calendar days in the validity span, counting valid_from as day 1
  validity_start_rule: string - the date valid_from is set to on approval
  standard_review_business_days: integer, business days after receipt within which a standard request is decided
  urgent_review_hours: integer, hours after receipt within which an urgent request is decided
  information_pend_days: integer, calendar days a pended request waits for clinical information before it is decided on the record
  clinical_documentation_required: boolean - whether clinical notes must accompany the request
  emergency_notification_hours: integer, hours after an emergency admission within which the facility must notify the region (0 = not applicable)
  retrospective_request_window_days: integer, calendar days after the service start within which a retrospective request is accepted (0 = no retrospective requests)
  rofr_applies: boolean - whether a military hospital or clinic gets the right of first refusal on a Prime request
  rofr_response_business_days: integer, business days the military clinic has to accept or decline (0 = not applicable)
  extension_allowed: boolean - whether units and validity may be extended on the same authorization
  max_extensions: integer, most extensions on one authorization (0 = none)
  extension_units: integer, units added by one extension (0 = none)
  extension_validity_days: integer, calendar days valid_through moves out by one extension (0 = none)
  extension_after_expiry_days: integer, calendar days after valid_through an extension request is still accepted (0 = must be received on or before valid_through)
  concurrent_review_interval_days: integer, calendar days between concurrent reviews of an ongoing stay or course (0 = none)
  redirect_allowed: boolean - whether the patient may move the approved authorization to another servicing provider
  servicing_provider_kinds_allowed: list of providers.provider_kind values a servicing provider may be
  access_standard_days: integer, calendar days within which the servicing provider must offer an appointment under the access standard (0 = not applicable)
  drive_time_standard_minutes: integer, maximum drive time to the servicing provider under the access standard (0 = not applicable)
  adsm_military_review_required: boolean - whether an active duty service member's civilian request goes through military clinic referral management first
  remote_adsm_service_review_required: boolean - whether a TRICARE Prime Remote service member's request needs the service point-of-contact review
  minimum_age_months: integer, youngest patient age in months for the service (0 = none)
  diagnosis_requirement: string - qualifying diagnosis or condition the request must document
  outcome_measures_required: boolean - whether standardized outcome measures must be submitted with each request
  parent_training_sessions_required: integer, minimum parent or caregiver training sessions per authorization (0 = none)
  homebound_status_required: boolean - whether the patient must be homebound
  prior_hospital_stay_days: integer, consecutive inpatient days required before admission (0 = none)
  admission_within_days_of_discharge: integer, calendar days after hospital discharge within which admission must occur (0 = not applicable)
  capped_rental_months: integer, rental months after which equipment ownership passes to the patient (0 = not applicable)
  units_used_definition: string - what counts as one unit used
  valid_after_pcm_change: boolean - whether the authorization stays valid after the patient changes PCM
  valid_after_region_transfer: boolean - whether the authorization stays valid after an enrollment transfer out of the West Region
  cancellation_releases_units: boolean - whether cancelling releases the unused units
  expiry_releases_units: boolean - whether expiry releases the unused units
  denial_appeal_type: string - the appeal tier a clinical denial of this authorization is reconsidered under
  expedited_appeal_available: boolean - whether a denial of this authorization may be reconsidered on the expedited track
  duplicate_overlap_rule: string - which overlapping authorizations count as duplicates
  referral_exempt_service_classes: list of service_class values that never need this authorization
  reauthorization_basis: string - how care beyond max_units_per_authorization is authorized
  cost_share_effect: string - the cost-share treatment of services covered by the authorization
  region_schedules_first_appointment: boolean - whether the region books the first appointment with the servicing provider on approval
  max_units_per_service_date: integer, most units one service date may consume
  decision_letter_business_days: integer, business days after the decision within which the decision letter is issued to the patient and providers

