- id: referral_ext_lapse_closeout
  base_policy_refs:
  - referral_cancellation_and_expiry
  overwrite:
  - base_policy: referral_cancellation_and_expiry
    superseded_clause: >-
      Cancellation and expiry release every unit still remaining where cancellation_releases_units or expiry_releases_units
      is true.
    replaced_by: >-
      The reserve and the holds are subtracted from the days left, and the release is never fewer than zero.
  trigger: state_due
  subject:
  - referral_expire
  computes: units_released
  target_tool: close_lapsed_authorization_515f616b
  params:
    readmission_reserve_days: 1
    late_lapse_days: 5
    fresh_bill_days: 7
    late_bill_hold_days: 1
    prompt_bill_hold_days: 2
    dispute_hold_days: 1
    stale_dispute_hold_days: 2
    acute_interruption_hold_days: 2
    emergency_interruption_hold_days: 1
  rule: >-
    When an approved skilled nursing facility or inpatient mental health authorization covered under TRICARE Select reaches
    the day after the last day of its validity span, it is closed as expired on that day and the days left on it are released.
    The days left are the units granted plus the units added by extensions less the units used, all read from the authorization's
    unit history, and the standard release is every day left. The days a lapsed facility authorization releases are fixed
    only after every facility claim line billed under the authorization carries its use entry in the unit history. In these
    rules the facility line is the facility claim line most recently posted under the authorization, and its last covered
    day is its service date plus its covered inpatient days, less one day. A readmission reserve is kept from the release,
    because a patient admitted again within the tier's readmission window (the days within which an admission must follow
    a discharge) needs no new qualifying hospital stay: where no more than that window has passed from the day after the facility
    line's last covered day to today and home health visits of the patient are dated in the last month, one day is reserved,
    or the days left if fewer; where that window has not passed and no home health visit is dated in the last month (no home
    care picked the patient up), half of the days left, rounded down, is reserved; otherwise nothing is reserved. A closing-bill
    hold covers corrections to the facility's latest bill: where the facility's most recent line under the authorization was
    posted no more than seven days ago and the lapse is recorded more than five days after the day it fell due (the day after
    the span's last day), one day is held; where that line was posted no more than seven days ago and the lapse is recorded
    no more than five days after it fell due, two days are held; otherwise nothing is held. A reconsideration hold applies
    while a case about one of the patient's TRICARE Select claim lines may still change the days a line carries: where the
    patient's most recent such case is filed or under review and was filed no more than thirty days ago, one day is held;
    where it is filed or under review and was filed more than thirty days ago, two days are held; otherwise nothing is held.
    A stay interrupted by hospital care is held open for the leave days the facility's final bill must still report: where
    the patient's most recent acute inpatient admission is dated on or after the span's first day and on or before the facility
    line's last covered day, two days are held; where no such admission is, but the patient's most recent emergency department
    visit is dated in that stretch, one day is held; otherwise nothing is held. Days the facility has not billed yet are held,
    because a facility may bill a stay's last days up to the claims filing deadline: where the facility line's last covered
    day falls before the span's last day and the patient's most recent home health visit is dated after the span's last day
    (the stay ran to the span's last day, which is its discharge day and not a covered day), the days from the day after the
    line's last covered day up to, but not counting, the span's last day are held; where the line's last covered day falls
    before the span's last day and no home health visit, acute inpatient admission or emergency department visit of the patient
    is dated after the line's last covered day (the patient is taken to have stayed through the span), the days from the day
    after the line's last covered day through the span's last day are held; otherwise nothing is held. The reserve and the
    holds are subtracted from the days left, and the release is never fewer than zero.
  prerequisite:
  - problem: referral_ext_facility_day_posting
    kind: value_input
    gate: x_used
    form: state
    policy_source: >-
      The days a lapsed facility authorization releases are fixed only after every facility claim line billed under the authorization
      carries its use entry in the unit history.
    condition: >-
      Every select_claim_lines row whose prior_authorization_id is the authorization has a referral_units_consume entry in
      referral_unit_ledger carrying its claim_number and line_number.
    resolved_by: post_facility_day_use_bc338a65
    effect: >-
      Once the facility line's use is posted, the units used read from the unit history rise by the days that line posts,
      and the days left on the lapsing authorization fall by the same number.
  cross_category:
  - category: select
    as: history
    reads:
    - select_claim_lines.inpatient_days
    - select_claim_lines.service_date
    - select_claim_lines.posted_date
    - select_claim_lines.service_class
    note: The facility line, home health visits, the latest acute admission and the latest emergency visit decide the readmission
      reserve, the closing-bill hold, the interrupted-stay hold and the unbilled-days hold.
  - category: appeal
    as: branch
    reads:
    - status
    - filing_date
    - subject_kind
    - subject_plan
    note: The patient's most recent case about a TRICARE Select claim line decides the reconsideration hold.
  compute:
  - x_granted: SUM('referral_unit_ledger', 'units', event_type='referral_units_grant')
  - x_added: SUM('referral_unit_ledger', 'units', event_type='referral_units_extend')
  - x_used: SUM('referral_unit_ledger', 'units', event_type='referral_units_consume')
  - x_left: x_granted + x_added - x_used
  - x_line_start: XLATEST('select', 'select_claim_lines', 'service_date', date_field='posted_date', prior_authorization_id=HID,
      event_type='select_claim_line_post')
  - x_line_days: XLATEST('select', 'select_claim_lines', 'inpatient_days', date_field='posted_date', prior_authorization_id=HID,
      event_type='select_claim_line_post') or 0
  - x_last_offset: x_line_days - 1
  - x_end_gap: DAYS(x_line_start, NOW) - x_line_days if x_line_start != None else 999
  - x_home_count: XCOUNT('select', 'select_claim_lines', within_months=1, date_field='service_date', service_class='home_health_visit',
      event_type='select_claim_line_post')
  - reserve: MN(x_left, K('readmission_reserve_days')) if (x_end_gap <= P('admission_within_days_of_discharge') and x_home_count
      > 0) else (int(x_left / 2) if (x_end_gap <= P('admission_within_days_of_discharge') and x_home_count == 0) else 0)
  - x_bill_age: DAYS(XLATEST('select', 'select_claim_lines', 'posted_date', date_field='posted_date', prior_authorization_id=HID,
      event_type='select_claim_line_post'), NOW) if x_line_start != None else 999
  - x_lateness: DAYS(F('valid_through'), NOW) - 1
  - bill_hold: K('late_bill_hold_days') if (x_bill_age <= K('fresh_bill_days') and x_lateness > K('late_lapse_days')) else
      (K('prompt_bill_hold_days') if (x_bill_age <= K('fresh_bill_days') and x_lateness <= K('late_lapse_days')) else 0)
  - x_dispute: XLATEST('appeal', 'appeal_cases', 'status', date_field='filing_date', subject_kind='claim_line', subject_plan='tricare_select')
  - x_dispute_filed: XLATEST('appeal', 'appeal_cases', 'filing_date', date_field='filing_date', subject_kind='claim_line',
      subject_plan='tricare_select')
  - dispute_hold: K('dispute_hold_days') if ((x_dispute == 'filed' or x_dispute == 'under_review') and DAYS(x_dispute_filed,
      NOW) <= 30) else (K('stale_dispute_hold_days') if ((x_dispute == 'filed' or x_dispute == 'under_review') and DAYS(x_dispute_filed,
      NOW) > 30) else 0)
  - x_acute_start: XLATEST('select', 'select_claim_lines', 'service_date', date_field='service_date', service_class='inpatient_admission',
      event_type='select_claim_line_post')
  - x_ed_date: XLATEST('select', 'select_claim_lines', 'service_date', date_field='service_date', service_class='emergency_room_visit',
      event_type='select_claim_line_post')
  - x_acute_in: DAYS(F('valid_from'), x_acute_start) >= 0 and DAYS(x_line_start, x_acute_start) <= x_last_offset if (x_acute_start
      != None and x_line_start != None) else False
  - x_ed_in: DAYS(F('valid_from'), x_ed_date) >= 0 and DAYS(x_line_start, x_ed_date) <= x_last_offset if (x_ed_date != None
      and x_line_start != None) else False
  - interruption_hold: K('acute_interruption_hold_days') if x_acute_in else (K('emergency_interruption_hold_days') if x_ed_in
      else 0)
  - x_tail_days: DAYS(x_line_start, F('valid_through')) - x_last_offset if x_line_start != None else 0
  - x_home_latest: XLATEST('select', 'select_claim_lines', 'service_date', date_field='service_date', service_class='home_health_visit',
      event_type='select_claim_line_post')
  - x_home_after_span: DAYS(F('valid_through'), x_home_latest) > 0 if x_home_latest != None else False
  - x_care_after_line: (x_home_latest != None and DAYS(x_line_start, x_home_latest) > x_last_offset) or (x_acute_start !=
      None and DAYS(x_line_start, x_acute_start) > x_last_offset) or (x_ed_date != None and DAYS(x_line_start, x_ed_date)
      > x_last_offset) if x_line_start != None else False
  - final_bill_hold: (x_tail_days - 1) if (x_tail_days > 0 and x_home_after_span) else (x_tail_days if (x_tail_days > 0 and
      not x_care_after_line) else 0)
  - result: int(MX(0, x_left - reserve - bill_hold - dispute_hold - interruption_hold - final_bill_hold))
  compute_basis:
    x_granted: >-
      When an approved skilled nursing facility or inpatient mental health authorization covered under TRICARE Select reaches
      the day after the last day of its validity span, it is closed as expired on that day and the days left on it are released.
      The days left are the units granted plus the units added by extensions less the units used, all read from the authorization's
      unit history, and the standard release is every day left.
    x_added: >-
      When an approved skilled nursing facility or inpatient mental health authorization covered under TRICARE Select reaches
      the day after the last day of its validity span, it is closed as expired on that day and the days left on it are released.
      The days left are the units granted plus the units added by extensions less the units used, all read from the authorization's
      unit history, and the standard release is every day left.
    x_used: >-
      When an approved skilled nursing facility or inpatient mental health authorization covered under TRICARE Select reaches
      the day after the last day of its validity span, it is closed as expired on that day and the days left on it are released.
      The days left are the units granted plus the units added by extensions less the units used, all read from the authorization's
      unit history, and the standard release is every day left.
    x_left: >-
      When an approved skilled nursing facility or inpatient mental health authorization covered under TRICARE Select reaches
      the day after the last day of its validity span, it is closed as expired on that day and the days left on it are released.
      The days left are the units granted plus the units added by extensions less the units used, all read from the authorization's
      unit history, and the standard release is every day left.
    x_line_start: >-
      In these rules the facility line is the facility claim line most recently posted under the authorization, and its last
      covered day is its service date plus its covered inpatient days, less one day.
    x_line_days: >-
      In these rules the facility line is the facility claim line most recently posted under the authorization, and its last
      covered day is its service date plus its covered inpatient days, less one day.
    x_last_offset: >-
      In these rules the facility line is the facility claim line most recently posted under the authorization, and its last
      covered day is its service date plus its covered inpatient days, less one day.
    x_end_gap: >-
      A readmission reserve is kept from the release, because a patient admitted again within the tier's readmission window
      (the days within which an admission must follow a discharge) needs no new qualifying hospital stay: where no more than
      that window has passed from the day after the facility line's last covered day to today and home health visits of the
      patient are dated in the last month, one day is reserved, or the days left if fewer; where that window has not passed
      and no home health visit is dated in the last month (no home care picked the patient up), half of the days left, rounded
      down, is reserved; otherwise nothing is reserved.
    x_home_count: >-
      A readmission reserve is kept from the release, because a patient admitted again within the tier's readmission window
      (the days within which an admission must follow a discharge) needs no new qualifying hospital stay: where no more than
      that window has passed from the day after the facility line's last covered day to today and home health visits of the
      patient are dated in the last month, one day is reserved, or the days left if fewer; where that window has not passed
      and no home health visit is dated in the last month (no home care picked the patient up), half of the days left, rounded
      down, is reserved; otherwise nothing is reserved.
    reserve: >-
      A readmission reserve is kept from the release, because a patient admitted again within the tier's readmission window
      (the days within which an admission must follow a discharge) needs no new qualifying hospital stay: where no more than
      that window has passed from the day after the facility line's last covered day to today and home health visits of the
      patient are dated in the last month, one day is reserved, or the days left if fewer; where that window has not passed
      and no home health visit is dated in the last month (no home care picked the patient up), half of the days left, rounded
      down, is reserved; otherwise nothing is reserved.
    x_bill_age: >-
      A closing-bill hold covers corrections to the facility's latest bill: where the facility's most recent line under the
      authorization was posted no more than seven days ago and the lapse is recorded more than five days after the day it
      fell due (the day after the span's last day), one day is held; where that line was posted no more than seven days ago
      and the lapse is recorded no more than five days after it fell due, two days are held; otherwise nothing is held.
    x_lateness: >-
      A closing-bill hold covers corrections to the facility's latest bill: where the facility's most recent line under the
      authorization was posted no more than seven days ago and the lapse is recorded more than five days after the day it
      fell due (the day after the span's last day), one day is held; where that line was posted no more than seven days ago
      and the lapse is recorded no more than five days after it fell due, two days are held; otherwise nothing is held.
    bill_hold: >-
      A closing-bill hold covers corrections to the facility's latest bill: where the facility's most recent line under the
      authorization was posted no more than seven days ago and the lapse is recorded more than five days after the day it
      fell due (the day after the span's last day), one day is held; where that line was posted no more than seven days ago
      and the lapse is recorded no more than five days after it fell due, two days are held; otherwise nothing is held.
    x_dispute: >-
      A reconsideration hold applies while a case about one of the patient's TRICARE Select claim lines may still change the
      days a line carries: where the patient's most recent such case is filed or under review and was filed no more than thirty
      days ago, one day is held; where it is filed or under review and was filed more than thirty days ago, two days are held;
      otherwise nothing is held.
    x_dispute_filed: >-
      A reconsideration hold applies while a case about one of the patient's TRICARE Select claim lines may still change the
      days a line carries: where the patient's most recent such case is filed or under review and was filed no more than thirty
      days ago, one day is held; where it is filed or under review and was filed more than thirty days ago, two days are held;
      otherwise nothing is held.
    dispute_hold: >-
      A reconsideration hold applies while a case about one of the patient's TRICARE Select claim lines may still change the
      days a line carries: where the patient's most recent such case is filed or under review and was filed no more than thirty
      days ago, one day is held; where it is filed or under review and was filed more than thirty days ago, two days are held;
      otherwise nothing is held.
    x_acute_start: >-
      A stay interrupted by hospital care is held open for the leave days the facility's final bill must still report: where
      the patient's most recent acute inpatient admission is dated on or after the span's first day and on or before the facility
      line's last covered day, two days are held; where no such admission is, but the patient's most recent emergency department
      visit is dated in that stretch, one day is held; otherwise nothing is held.
    x_ed_date: >-
      A stay interrupted by hospital care is held open for the leave days the facility's final bill must still report: where
      the patient's most recent acute inpatient admission is dated on or after the span's first day and on or before the facility
      line's last covered day, two days are held; where no such admission is, but the patient's most recent emergency department
      visit is dated in that stretch, one day is held; otherwise nothing is held.
    x_acute_in: >-
      A stay interrupted by hospital care is held open for the leave days the facility's final bill must still report: where
      the patient's most recent acute inpatient admission is dated on or after the span's first day and on or before the facility
      line's last covered day, two days are held; where no such admission is, but the patient's most recent emergency department
      visit is dated in that stretch, one day is held; otherwise nothing is held.
    x_ed_in: >-
      A stay interrupted by hospital care is held open for the leave days the facility's final bill must still report: where
      the patient's most recent acute inpatient admission is dated on or after the span's first day and on or before the facility
      line's last covered day, two days are held; where no such admission is, but the patient's most recent emergency department
      visit is dated in that stretch, one day is held; otherwise nothing is held.
    interruption_hold: >-
      A stay interrupted by hospital care is held open for the leave days the facility's final bill must still report: where
      the patient's most recent acute inpatient admission is dated on or after the span's first day and on or before the facility
      line's last covered day, two days are held; where no such admission is, but the patient's most recent emergency department
      visit is dated in that stretch, one day is held; otherwise nothing is held.
    x_tail_days: >-
      Days the facility has not billed yet are held, because a facility may bill a stay's last days up to the claims filing
      deadline: where the facility line's last covered day falls before the span's last day and the patient's most recent
      home health visit is dated after the span's last day (the stay ran to the span's last day, which is its discharge day
      and not a covered day), the days from the day after the line's last covered day up to, but not counting, the span's
      last day are held; where the line's last covered day falls before the span's last day and no home health visit, acute
      inpatient admission or emergency department visit of the patient is dated after the line's last covered day (the patient
      is taken to have stayed through the span), the days from the day after the line's last covered day through the span's
      last day are held; otherwise nothing is held.
    x_home_latest: >-
      Days the facility has not billed yet are held, because a facility may bill a stay's last days up to the claims filing
      deadline: where the facility line's last covered day falls before the span's last day and the patient's most recent
      home health visit is dated after the span's last day (the stay ran to the span's last day, which is its discharge day
      and not a covered day), the days from the day after the line's last covered day up to, but not counting, the span's
      last day are held; where the line's last covered day falls before the span's last day and no home health visit, acute
      inpatient admission or emergency department visit of the patient is dated after the line's last covered day (the patient
      is taken to have stayed through the span), the days from the day after the line's last covered day through the span's
      last day are held; otherwise nothing is held.
    x_home_after_span: >-
      Days the facility has not billed yet are held, because a facility may bill a stay's last days up to the claims filing
      deadline: where the facility line's last covered day falls before the span's last day and the patient's most recent
      home health visit is dated after the span's last day (the stay ran to the span's last day, which is its discharge day
      and not a covered day), the days from the day after the line's last covered day up to, but not counting, the span's
      last day are held; where the line's last covered day falls before the span's last day and no home health visit, acute
      inpatient admission or emergency department visit of the patient is dated after the line's last covered day (the patient
      is taken to have stayed through the span), the days from the day after the line's last covered day through the span's
      last day are held; otherwise nothing is held.
    x_care_after_line: >-
      Days the facility has not billed yet are held, because a facility may bill a stay's last days up to the claims filing
      deadline: where the facility line's last covered day falls before the span's last day and the patient's most recent
      home health visit is dated after the span's last day (the stay ran to the span's last day, which is its discharge day
      and not a covered day), the days from the day after the line's last covered day up to, but not counting, the span's
      last day are held; where the line's last covered day falls before the span's last day and no home health visit, acute
      inpatient admission or emergency department visit of the patient is dated after the line's last covered day (the patient
      is taken to have stayed through the span), the days from the day after the line's last covered day through the span's
      last day are held; otherwise nothing is held.
    final_bill_hold: >-
      Days the facility has not billed yet are held, because a facility may bill a stay's last days up to the claims filing
      deadline: where the facility line's last covered day falls before the span's last day and the patient's most recent
      home health visit is dated after the span's last day (the stay ran to the span's last day, which is its discharge day
      and not a covered day), the days from the day after the line's last covered day up to, but not counting, the span's
      last day are held; where the line's last covered day falls before the span's last day and no home health visit, acute
      inpatient admission or emergency department visit of the patient is dated after the line's last covered day (the patient
      is taken to have stayed through the span), the days from the day after the line's last covered day through the span's
      last day are held; otherwise nothing is held.
    result: >-
      The reserve and the holds are subtracted from the days left, and the release is never fewer than zero.
  factors:
  - id: readmission_window_reserve
    effect: method
    decides: reserve
    bindings:
    - x_end_gap
    - x_home_count
    - reserve
    ladder:
    - when: the readmission window has not passed since the day after the line's last covered day and home health visits are
        dated in the last month
      method: reserve one day, or the days left if fewer
    - when: the window has not passed and no home health visit is dated in the last month
      method: reserve half the days left, rounded down
    - when: otherwise
      method: reserve nothing
    baseline:
      reserve: '0'
    evidence:
    - cross_category
    - date
    - tier_param
    cross_difficulty: select
  - id: closing_bill_hold
    effect: parameter
    decides: bill_hold
    bindings:
    - x_bill_age
    - x_lateness
    - bill_hold
    ladder:
    - when: the facility's latest line posted no more than seven days ago and the lapse is recorded more than five days after
        it fell due
      value: K('late_bill_hold_days')
    - when: that line posted no more than seven days ago and the lapse is recorded no more than five days after it fell due
      value: K('prompt_bill_hold_days')
    - when: otherwise
      value: '0'
    baseline:
      bill_hold: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: select
  - id: open_reconsideration_hold
    effect: parameter
    decides: dispute_hold
    bindings:
    - x_dispute
    - x_dispute_filed
    - dispute_hold
    ladder:
    - when: the most recent case about a Select claim line is filed or under review and was filed no more than thirty days
        ago
      value: K('dispute_hold_days')
    - when: it is filed or under review and was filed more than thirty days ago
      value: K('stale_dispute_hold_days')
    - when: otherwise
      value: '0'
    baseline:
      dispute_hold: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: appeal
  - id: interrupted_stay_hold
    effect: parameter
    decides: interruption_hold
    bindings:
    - x_acute_start
    - x_ed_date
    - x_acute_in
    - x_ed_in
    - interruption_hold
    ladder:
    - when: the most recent acute admission is dated between the span's first day and the line's last covered day
      value: K('acute_interruption_hold_days')
    - when: no such admission, but the most recent emergency visit is dated in that stretch
      value: K('emergency_interruption_hold_days')
    - when: otherwise
      value: '0'
    baseline:
      interruption_hold: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: select
  - id: final_bill_days
    effect: method
    decides: final_bill_hold
    bindings:
    - x_tail_days
    - x_home_latest
    - x_home_after_span
    - x_care_after_line
    - final_bill_hold
    ladder:
    - when: the line ends before the span's last day and the most recent home health visit is after the span's last day
      method: hold the days after the line's last covered day up to, not counting, the span's last day (the discharge day)
    - when: the line ends before the span's last day and no home health, acute or emergency care is dated after the line
      method: hold the days after the line's last covered day through the span's last day
    - when: otherwise
      method: hold nothing
    baseline:
      final_bill_hold: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: select
