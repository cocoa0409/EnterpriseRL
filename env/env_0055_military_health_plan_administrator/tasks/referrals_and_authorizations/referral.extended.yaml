      nothing changes.
    a_ed_1m: >-
      Emergency frequency adds days: where three or more emergency department visits of the patient are dated in the last
      month, two days are added; where exactly two are, one day is added; otherwise none.
    crisis: >-
      Emergency frequency adds days: where three or more emergency department visits of the patient are dated in the last
      month, two days are added; where exactly two are, one day is added; otherwise none.
    a_imh_12m: >-
      Repeat admissions add days: where three or more inpatient mental health admission lines of the patient are dated in
      the last twelve months, two days are added; where exactly two are, one day is added; otherwise none.
    repeat: >-
      Repeat admissions add days: where three or more inpatient mental health admission lines of the patient are dated in
