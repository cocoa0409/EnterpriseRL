- id: referral_ext_overturned_issue
  base_policy_refs:
  - referral_validity_and_units
  - referral_appeal_effectuation
  overwrite:
  - base_policy: referral_validity_and_units
    superseded_clause: >-
      The units authorized are the lesser of the units requested and default_units_authorized, and never more than max_units_per_authorization
    replaced_by: >-
      The units issued are the basis plus the care under appeal, the admission-source visits, the training visits and the
      readmission visits, less the later-period reduction, never more than the tier's maximum units per authorization.
  - base_policy: referral_appeal_effectuation
    superseded_clause: >-
      A denied authorization is approved without a new review only when its reconsideration is decided overturned.
    replaced_by: >-
      When a Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration of a denied authorization is
      decided overturned or decided partially overturned, the authorization is issued: its validity span starts on the first
      service date under appeal when care was already given and on the issue date otherwise, and runs the tier's validity
      days counting the first day as day 1.
  - base_policy: referral_appeal_effectuation
    superseded_clause: >-
      The denial is approved on appeal only when a Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration
      case for this authorization is decided overturned.
    replaced_by: >-
      When a Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration of a denied authorization is
      decided overturned or decided partially overturned, the authorization is issued: its validity span starts on the first
      service date under appeal when care was already given and on the issue date otherwise, and runs the tier's validity
      days counting the first day as day 1.
  - base_policy: referral_appeal_effectuation
    superseded_clause: >-
      The approval takes the validity span and units the reconsideration decided, under referral_validity_and_units.
    replaced_by: >-
      The reversal sets the basis of the units issued: where the patient's most recent reconsideration of the authorization
      is decided overturned and a letter of medical necessity is on that case (the plan of care the reviewer reversed on),
      the basis is the units requested, never more than the tier's maximum units per authorization; where it is decided partially
      overturned, the basis is half of that figure, rounded down; otherwise the basis is the lesser of the units requested,
      the default units authorized and the maximum.
  trigger: state_due
  subject:
  - referral_approve_on_appeal
  computes: units_authorized
  target_tool: issue_overturned_authorization_2ad92a55
  params:
    institutional_both_visits: 6
    institutional_one_visits: 3
    repeat_episode_visits: 2
    continuing_episode_visits: 4
    equipment_training_visits: 2
    equipment_other_visits: 1
    equipment_window_days: 30
    readmission_risk_visits: 4
    ed_risk_visits: 2
  rule: >-
    When a Medical Necessity Reconsideration or Expedited Medical Necessity Reconsideration of a denied authorization is decided
    overturned or decided partially overturned, the authorization is issued: its validity span starts on the first service
    date under appeal when care was already given and on the issue date otherwise, and runs the tier's validity days counting
    the first day as day 1. The units issued are the lesser of the units requested, the tier's default units authorized and
    the tier's maximum units per authorization. A home health care authorization overturned on reconsideration is not issued
    until every skilled nursing facility authorization of the patient whose validity span has ended shows as expired or exhausted.
    The reversal sets the basis of the units issued: where the patient's most recent reconsideration of the authorization
    is decided overturned and a letter of medical necessity is on that case (the plan of care the reviewer reversed on), the
    basis is the units requested, never more than the tier's maximum units per authorization; where it is decided partially
    overturned, the basis is half of that figure, rounded down; otherwise the basis is the lesser of the units requested,
    the default units authorized and the maximum. Care the servicing provider gave while the denial stood is covered on top
    of the basis: where claim lines from the authorization's servicing provider are dated in the last month and that reconsideration
    is decided overturned, one unit per such line is added; where such lines exist and it is decided partially overturned,
    half of those lines, rounded up, is added; otherwise nothing is added. An institutional admission source front-loads visits
    for tiers that require the patient to be homebound: where both a skilled nursing facility line and an acute inpatient
    admission line of the patient are dated in the last month, six visits are added; where only one of the two is dated in
    the last month, three visits are added; otherwise none are added. An episode that follows earlier home care is a later
    period and is shorter for tiers that require the patient to be homebound: where home health visits of the patient are
    dated between one and three months ago, four visits are taken off; where none are but home health visits are dated between
    three and twelve months ago, two visits are taken off; otherwise nothing is taken off. Equipment newly placed for home
    use adds training visits: where the patient's most recently delivered item in rental is Capped Rental Equipment or a Power
    Mobility Device delivered no more than thirty days ago, two visits are added; where it is another kind of item delivered
    no more than thirty days ago, one visit is added; otherwise none are added. A readmission during a facility stay adds
    visits: where the patient's most recent acute inpatient admission began after the start of the patient's most recent skilled
    nursing facility line, four visits are added; where that is not so but an emergency department visit of the patient is
    dated in the last month, two visits are added; otherwise none are added. The units issued are the basis plus the care
    under appeal, the admission-source visits, the training visits and the readmission visits, less the later-period reduction,
    never more than the tier's maximum units per authorization.
  prerequisite:
  - problem: referral_ext_lapse_closeout
    kind: state_gate
    gate: referral_authorizations.status
    form: state
    policy_source: >-
      A home health care authorization overturned on reconsideration is not issued until every skilled nursing facility authorization
