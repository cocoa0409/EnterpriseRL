    - category: select
      table: select_claim_lines
      aggregate: latest
      field: inpatient_days
      filters:
        event_type: select_claim_line_post
    - category: select
      table: select_claim_lines
      aggregate: latest
      field: service_date
      filters:
        event_type: select_claim_line_post
