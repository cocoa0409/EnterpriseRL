      the clinic's response window has passed with no answer and it duplicates no approved, unexpired authorization of the
      patient, the region approves it to the requested network provider: the validity span starts under the tier's start rule
      and runs the tier's validity days counting the first day as day 1. The days approved are the lesser of the units requested,
