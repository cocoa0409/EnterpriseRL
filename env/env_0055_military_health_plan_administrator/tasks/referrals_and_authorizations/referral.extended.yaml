- id: referral_ext_stay_extension
  base_policy_refs:
  - referral_extension
  overwrite:
  - base_policy: referral_extension
    superseded_clause: >-
      each extension adds extension_units and moves valid_through out by extension_validity_days, up to max_extensions extensions
      (referral_msr_extensions_granted) and never beyond max_units_per_authorization in total.
    replaced_by: >-
      The extension adds the timed block plus the aftercare, netting, readmission and emergency days, never more than the
      room left under the maximum, never fewer than zero, and nothing once the authorization has had the tier's maximum extensions.
  trigger: on_request
  subject:
  - referral_units_extend
  - referral_validity_update
  computes: units
  target_tool: extend_authorization_stay_203c17fe
  params:
    readmission_first_block: 5
    readmission_later_block: 4
    engaged_visits: 3
    engaged_reduction: 1
    no_aftercare_addition: 1
    close_readmission_days: 7
    close_readmission_add: 2
    month_readmission_add: 1
    crisis_two: 1
    crisis_three: 2
  rule: >-
    When the requesting or servicing provider asks to extend an approved authorization of a tier that allows extensions, each
    extension moves the span's last day out by the tier's extension validity days and adds days to the authorization. The
    days an extension adds are the tier's extension units, never more than the room left under the tier's maximum units per
    authorization after the units granted and the units added by earlier extensions. The days an extension adds are fixed
    only after the authorization's unit history shows a grant on an initial approval. A readmission sets a longer block: where
    an inpatient mental health admission line of the patient is dated in the last month and the authorization has no earlier
    extension, the block is five days; where such a line is dated in the last month and an earlier extension exists, the block
    is four days; otherwise the block is the tier's extension units. The point in the span when the extension is asked shapes
    the block: where fewer than half of the tier's validity days have passed since the span's first day, the block is halved
    and rounded up; where the span's last day is today or has passed, one bridging day is added to the block; otherwise the
    block stands as set. Aftercare engagement moves the extension: where three or more outpatient behavioral health visits
    of the patient are dated in the last three months, one day is taken off; where none is dated in the last twelve months,
    one day is added; otherwise nothing changes. Units already on hand are netted against the span: where the days left on
    the authorization (granted plus added less used) exceed the span days still ahead counting today, the excess is taken
    off the extension; where they fall short of the span days still ahead, the shortfall is added, rounded up to a whole number
    of the tier's concurrent review intervals, or added as it stands where the tier sets no concurrent review interval; otherwise
    nothing changes. A close readmission adds days: where the patient's most recent inpatient mental health admission line
    is dated before the span's first day by no more than seven days, two days are added; where it is dated before the span's
    first day by more than seven and no more than thirty days, one day is added; otherwise none. Emergency frequency lengthens
    the extension: where three or more emergency department visits of the patient are dated in the last month, two days are
    added; where exactly two are, one day is added; otherwise none. The extension adds the timed block plus the aftercare,
    netting, readmission and emergency days, never more than the room left under the maximum, never fewer than zero, and nothing
    once the authorization has had the tier's maximum extensions.
  prerequisite:
  - problem: referral_ext_rofr_lapse_approval
    kind: value_input
    gate: e_granted
    form: state
    policy_source: >-
      The days an extension adds are fixed only after the authorization's unit history shows a grant on an initial approval.
    condition: >-
      The referral_unit_ledger holds a referral_units_grant entry with grant_basis initial_approval for the authorization.
    resolved_by: approve_pending_authorization_775ce183
    effect: >-
      Once the request is approved, the units granted read from the unit history become the days approved and the span is
      set, so the netting of days on hand against the span days ahead, the review timing and the room under the maximum are
      figured from them.
  cross_category:
  - category: prime
    as: history
    reads:
    - prime_claim_lines.service_class
    - prime_claim_lines.service_date
    note: Inpatient mental health, emergency and outpatient behavioral health lines of the patient decide the readmission
      block, aftercare, readmission-interval and emergency tiers.
  compute:
  - e_granted: SUM('referral_unit_ledger', 'units', event_type='referral_units_grant')
  - e_added: SUM('referral_unit_ledger', 'units', event_type='referral_units_extend')
  - e_used: SUM('referral_unit_ledger', 'units', event_type='referral_units_consume')
  - e_ext_count: COUNT('referral_unit_ledger', event_type='referral_units_extend')
  - e_imh_1m: XCOUNT('prime', 'prime_claim_lines', within_months=1, date_field='service_date', service_class='inpatient_mental_health_admission',
      event_type='prime_claim_line_post')
  - block: K('readmission_first_block') if (e_imh_1m > 0 and e_ext_count == 0) else (K('readmission_later_block') if (e_imh_1m
      > 0 and e_ext_count > 0) else P('extension_units'))
  - e_days_in: DAYS(F('valid_from'), NOW)
  - paced: int((block + 1) / 2) if e_days_in * 2 < P('validity_days') else ((block + 1) if DAYS(NOW, F('valid_through')) <=
      0 else block)
  - e_op_3m: XCOUNT('prime', 'prime_claim_lines', within_months=3, date_field='service_date', service_class='outpatient_behavioral_health_individual',
      event_type='prime_claim_line_post')
  - e_op_12m: XCOUNT('prime', 'prime_claim_lines', within_months=12, date_field='service_date', service_class='outpatient_behavioral_health_individual',
      event_type='prime_claim_line_post')
  - engage: (0 - K('engaged_reduction')) if e_op_3m >= K('engaged_visits') else (K('no_aftercare_addition') if e_op_12m ==
      0 else 0)
  - e_ahead: DAYS(NOW, F('valid_through')) + 1
  - e_left: e_granted + e_added - e_used
  - net: (0 - (e_left - e_ahead)) if e_left > e_ahead else (((int((e_ahead - e_left + P('concurrent_review_interval_days')
      - 1) / P('concurrent_review_interval_days')) * P('concurrent_review_interval_days')) if P('concurrent_review_interval_days')
      > 0 else (e_ahead - e_left)) if e_left < e_ahead else 0)
  - e_prev_imh: XLATEST('prime', 'prime_claim_lines', 'service_date', date_field='service_date', service_class='inpatient_mental_health_admission',
      event_type='prime_claim_line_post')
  - e_interval: DAYS(e_prev_imh, F('valid_from')) if e_prev_imh != None else 999
  - interval_add: K('close_readmission_add') if (e_interval > 0 and e_interval <= K('close_readmission_days')) else (K('month_readmission_add')
      if (e_interval > K('close_readmission_days') and e_interval <= 30) else 0)
  - e_ed_1m: XCOUNT('prime', 'prime_claim_lines', within_months=1, date_field='service_date', service_class='emergency_room_visit',
      event_type='prime_claim_line_post')
  - crisis: K('crisis_three') if e_ed_1m >= 3 else (K('crisis_two') if e_ed_1m == 2 else 0)
  - room: (P('max_units_per_authorization') - e_granted - e_added) if e_ext_count < P('max_extensions') else 0
  - result: int(MX(0, MN(room, paced + engage + net + interval_add + crisis)))
  compute_basis:
    e_granted: >-
      Units already on hand are netted against the span: where the days left on the authorization (granted plus added less
      used) exceed the span days still ahead counting today, the excess is taken off the extension; where they fall short
      of the span days still ahead, the shortfall is added, rounded up to a whole number of the tier's concurrent review intervals,
      or added as it stands where the tier sets no concurrent review interval; otherwise nothing changes.
    e_added: >-
      Units already on hand are netted against the span: where the days left on the authorization (granted plus added less
      used) exceed the span days still ahead counting today, the excess is taken off the extension; where they fall short
      of the span days still ahead, the shortfall is added, rounded up to a whole number of the tier's concurrent review intervals,
      or added as it stands where the tier sets no concurrent review interval; otherwise nothing changes.
    e_used: >-
      Units already on hand are netted against the span: where the days left on the authorization (granted plus added less
      used) exceed the span days still ahead counting today, the excess is taken off the extension; where they fall short
      of the span days still ahead, the shortfall is added, rounded up to a whole number of the tier's concurrent review intervals,
      or added as it stands where the tier sets no concurrent review interval; otherwise nothing changes.
    e_ext_count: >-
      A readmission sets a longer block: where an inpatient mental health admission line of the patient is dated in the last
      month and the authorization has no earlier extension, the block is five days; where such a line is dated in the last
      month and an earlier extension exists, the block is four days; otherwise the block is the tier's extension units.
    e_imh_1m: >-
      A readmission sets a longer block: where an inpatient mental health admission line of the patient is dated in the last
      month and the authorization has no earlier extension, the block is five days; where such a line is dated in the last
      month and an earlier extension exists, the block is four days; otherwise the block is the tier's extension units.
    block: >-
      A readmission sets a longer block: where an inpatient mental health admission line of the patient is dated in the last
      month and the authorization has no earlier extension, the block is five days; where such a line is dated in the last
      month and an earlier extension exists, the block is four days; otherwise the block is the tier's extension units.
    e_days_in: >-
      The point in the span when the extension is asked shapes the block: where fewer than half of the tier's validity days
      have passed since the span's first day, the block is halved and rounded up; where the span's last day is today or has
      passed, one bridging day is added to the block; otherwise the block stands as set.
    paced: >-
      The point in the span when the extension is asked shapes the block: where fewer than half of the tier's validity days
      have passed since the span's first day, the block is halved and rounded up; where the span's last day is today or has
      passed, one bridging day is added to the block; otherwise the block stands as set.
    e_op_3m: >-
      Aftercare engagement moves the extension: where three or more outpatient behavioral health visits of the patient are
      dated in the last three months, one day is taken off; where none is dated in the last twelve months, one day is added;
      otherwise nothing changes.
    e_op_12m: >-
      Aftercare engagement moves the extension: where three or more outpatient behavioral health visits of the patient are
      dated in the last three months, one day is taken off; where none is dated in the last twelve months, one day is added;
      otherwise nothing changes.
    engage: >-
      Aftercare engagement moves the extension: where three or more outpatient behavioral health visits of the patient are
      dated in the last three months, one day is taken off; where none is dated in the last twelve months, one day is added;
      otherwise nothing changes.
    e_left: >-
      Units already on hand are netted against the span: where the days left on the authorization (granted plus added less
      used) exceed the span days still ahead counting today, the excess is taken off the extension; where they fall short
      of the span days still ahead, the shortfall is added, rounded up to a whole number of the tier's concurrent review intervals,
      or added as it stands where the tier sets no concurrent review interval; otherwise nothing changes.
    e_ahead: >-
      Units already on hand are netted against the span: where the days left on the authorization (granted plus added less
      used) exceed the span days still ahead counting today, the excess is taken off the extension; where they fall short
      of the span days still ahead, the shortfall is added, rounded up to a whole number of the tier's concurrent review intervals,
      or added as it stands where the tier sets no concurrent review interval; otherwise nothing changes.
    net: >-
      Units already on hand are netted against the span: where the days left on the authorization (granted plus added less
      used) exceed the span days still ahead counting today, the excess is taken off the extension; where they fall short
      of the span days still ahead, the shortfall is added, rounded up to a whole number of the tier's concurrent review intervals,
      or added as it stands where the tier sets no concurrent review interval; otherwise nothing changes.
    e_prev_imh: >-
      A close readmission adds days: where the patient's most recent inpatient mental health admission line is dated before
      the span's first day by no more than seven days, two days are added; where it is dated before the span's first day by
      more than seven and no more than thirty days, one day is added; otherwise none.
    e_interval: >-
      A close readmission adds days: where the patient's most recent inpatient mental health admission line is dated before
      the span's first day by no more than seven days, two days are added; where it is dated before the span's first day by
      more than seven and no more than thirty days, one day is added; otherwise none.
    interval_add: >-
      A close readmission adds days: where the patient's most recent inpatient mental health admission line is dated before
      the span's first day by no more than seven days, two days are added; where it is dated before the span's first day by
      more than seven and no more than thirty days, one day is added; otherwise none.
    e_ed_1m: >-
      Emergency frequency lengthens the extension: where three or more emergency department visits of the patient are dated
      in the last month, two days are added; where exactly two are, one day is added; otherwise none.
    crisis: >-
      Emergency frequency lengthens the extension: where three or more emergency department visits of the patient are dated
      in the last month, two days are added; where exactly two are, one day is added; otherwise none.
    room: >-
      The extension adds the timed block plus the aftercare, netting, readmission and emergency days, never more than the
      room left under the maximum, never fewer than zero, and nothing once the authorization has had the tier's maximum extensions.
    result: >-
      The extension adds the timed block plus the aftercare, netting, readmission and emergency days, never more than the
      room left under the maximum, never fewer than zero, and nothing once the authorization has had the tier's maximum extensions.
  factors:
  - id: readmission_block
    effect: parameter
    decides: block
    bindings:
    - e_ext_count
    - e_imh_1m
    - block
    ladder:
    - when: an inpatient mental health admission line in the last month and no earlier extension
      value: K('readmission_first_block')
    - when: such a line in the last month and an earlier extension
      value: K('readmission_later_block')
    - when: otherwise
      value: P('extension_units')
    baseline:
      block: P('extension_units')
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  - id: review_timing
    effect: method
    decides: paced
    bindings:
    - e_days_in
    - paced
    ladder:
    - when: fewer than half of the validity days have passed since the span's first day
      method: halve the block and round up
    - when: the span's last day is today or has passed
      method: add one bridging day to the block
    - when: otherwise
      method: the block as set
    baseline:
      paced: block
    evidence:
    - date
    cross_difficulty: null
  - id: aftercare_step_down
    effect: parameter
    decides: engage
    bindings:
    - e_op_3m
    - e_op_12m
    - engage
    ladder:
    - when: three or more outpatient behavioral health visits in the last three months
      value: minus K('engaged_reduction')
    - when: none in the last twelve months
      value: plus K('no_aftercare_addition')
    - when: otherwise
      value: '0'
    baseline:
      engage: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  - id: unit_span_netting
    effect: method
    decides: net
    bindings:
    - e_left
    - e_ahead
    - net
    ladder:
    - when: days left on the authorization exceed the span days still ahead
      method: take the excess off the extension
    - when: days left fall short of the span days still ahead
      method: add the shortfall rounded up to a whole number of concurrent review intervals, or as it stands where the tier
        sets none
    - when: otherwise
      method: no netting
    baseline:
      net: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: readmission_interval
    effect: parameter
    decides: interval_add
    bindings:
    - e_prev_imh
    - e_interval
    - interval_add
    ladder:
    - when: the latest inpatient mental health admission line is no more than seven days before the span's first day
      value: K('close_readmission_add')
    - when: it is more than seven and no more than thirty days before
      value: K('month_readmission_add')
    - when: otherwise
      value: '0'
    baseline:
      interval_add: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: prime
  - id: emergency_frequency_block
    effect: parameter
    decides: crisis
    bindings:
    - e_ed_1m
    - crisis
    ladder:
    - when: three or more emergency visits in the last month
      value: K('crisis_three')
    - when: exactly two
      value: K('crisis_two')
    - when: otherwise
      value: '0'
    baseline:
      crisis: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  baseline:
    rule: >-
      When the requesting or servicing provider asks to extend an approved authorization of a tier that allows extensions,
      each extension moves the span's last day out by the tier's extension validity days and adds days to the authorization.
      The days an extension adds are the tier's extension units, never more than the room left under the tier's maximum units
      per authorization after the units granted and the units added by earlier extensions.
    params:
    - extension_units
    - extension_validity_days
    - max_units_per_authorization
  inputs:
    history:
    - table: referral_unit_ledger
      aggregate: sum
      field: units
      filters:
        event_type: referral_units_grant
    - table: referral_unit_ledger
      aggregate: count
      field: referral_unit_entry_id
      filters:
        event_type: referral_units_extend
    - category: prime
      table: prime_claim_lines
      aggregate: count
      field: prime_claim_line_id
      within_months: 1
      filters:
        service_class: emergency_room_visit
    cross_category:
    - prime
