  overwrite:
  - base_policy: select_agg_family_accumulators
    superseded_clause: Prime cost shares, point-of-service charges and premium-based plan costs are separate accumulators and never count toward the Select family totals.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_catastrophic_cap
    superseded_clause: Point-of-service charges, Prime cost shares, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_ohi_coordination
    superseded_clause: With other health insurance on file, the line's deductible and cost share are figured on the allowed amount net of the other insurer's payment, and TRICARE pays no more than the allowed amount less the other insurer's payment and the beneficiary liability.
    replaced_by: 'With other health insurance on file, the deductible and cost share of a corrected outpatient line are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
