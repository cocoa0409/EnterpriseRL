    chg_begun_s: Where the tier's fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a corrected stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added.
    paid_s: Where the tier's fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a corrected stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added.
    fees_counted: Where the tier's fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a corrected stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added.
    plan_change_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_cs_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_chg_begun_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_paid_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_amt_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    carry_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    basis: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a corrected stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    daily: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a corrected stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    pctv: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a corrected stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    uncapped: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a corrected stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    room: Where the family catastrophic total of a corrected stay (the liability posted on the enrollment's claim lines less the liability their reversals withdrew, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has already reached catastrophic_cap_family, a corrected stay carries no beneficiary liability; where the room left under catastrophic_cap_family once that total is taken away is less than the liability figured under the inpatient basis, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured under the inpatient basis.
    liability: Where the family catastrophic total of a corrected stay (the liability posted on the enrollment's claim lines less the liability their reversals withdrew, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has already reached catastrophic_cap_family, a corrected stay carries no beneficiary liability; where the room left under catastrophic_cap_family once that total is taken away is less than the liability figured under the inpatient basis, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured under the inpatient basis.
    billed_cov: 'With other health insurance on file, the deductible and cost share of a corrected stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
    primary_s: What TRICARE would pay as primary payer on a corrected stay is its payable allowed amount less the beneficiary liability, never below zero.
    tricare_s: 'With other health insurance on file, the deductible and cost share of a corrected stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
    result: 'With other health insurance on file, the deductible and cost share of a corrected stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  factors:
  - id: stay_covered_days
    effect: parameter
    decides: cov_days
    bindings:
    - auth_ok
    - auth_days
    - needs_auth
    - cov_days
    ladder:
    - when: an approved Inpatient Mental Health Authorization at the stay's facility starts on the admission date and authorizes fewer days than the stay billed
      value: the days it authorizes
    - when: the stay's service class needs prior authorization and no such approved authorization is on file
      value: '0'
    - when: otherwise
      value: every billed inpatient day
    baseline:
      cov_days: billed_days
    evidence:
    - cross_category
    - history
    cross_difficulty: referral
  - id: stay_inpatient_basis
    effect: method
    decides: uncapped
    bindings:
    - net_status
    - basis
    - daily
    - pctv
    - uncapped
    ladder:
    - when: the basis for the facility's network relationship is lesser_of_per_diem_or_pct
      method: the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared
    - when: the basis is per_diem_with_minimum
      method: the daily charge times the covered days, never less than the minimum charge
    - when: the basis is percent_of_allowed
      method: the stated percent of the amount cost-shared
    - when: otherwise (per_admission_copay)
      method: the admission copayment once for the stay
    baseline:
      uncapped: 0 if cov_days == 0 else P('inpatient_network_admission_copay')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: stay_fees_counted
    effect: parameter
    decides: fees_counted
    bindings:
    - chg_begun_s
    - paid_s
    - fees_counted
    ladder: &id007
    - when: fees count toward the cap for the tier and the payments posted cover the installments whose coverage period has begun
      value: the begun installments in full
    - when: fees count and some but less has been paid
      value: the payments posted
    - when: otherwise
      value: '0'
    baseline:
      fees_counted: '0'
    evidence:
    - history
    - tier_param
    - date
    cross_difficulty: null
  - id: stay_prime_carryover
    effect: parameter
    decides: carry_s
    bindings:
    - plan_change_s
    - pr_cs_s
    - pr_chg_begun_s
    - pr_paid_s
    - pr_amt_s
    - carry_s
    ladder:
    - when: the beneficiary changed from TRICARE Prime during the plan year and the Prime amounts reach catastrophic_cap_family
      value: P('catastrophic_cap_family')
    - when: the beneficiary changed from TRICARE Prime during the plan year
      value: pr_amt_s
    - when: otherwise
      value: '0'
    baseline:
      carry_s: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  - id: stay_cap_stage
    effect: parameter
    decides: liability
    bindings:
    - claims_s
    - room
    - liability
    ladder:
    - when: the family catastrophic total has already reached catastrophic_cap_family
      value: '0'
    - when: the room left under the cap is less than the liability figured under the inpatient basis
      value: room
    - when: otherwise
      value: uncapped
    baseline:
      liability: uncapped
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: stay_payer_coordination
    effect: method
    decides: tricare_s
    bindings:
    - billed_amt
    - primary_s
    - tricare_s
    ladder: *id003
    baseline:
      tricare_s: primary_s
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'Every billed inpatient day of a corrected stay is covered. The beneficiary liability on a corrected stay is inpatient_network_admission_copay, charged once for the stay. TRICARE pays as primary payer on a corrected stay: the payable allowed amount less the beneficiary liability that amount carries, rounded to the cent and never below zero. A corrected stay with no covered day carries no beneficiary liability. An inpatient mental health stay is priced by the day, so its payable allowed amount is the reversed line''s allowed amount times the covered days divided by the billed days, rounded to the cent; any other corrected stay is payable at the reversed line''s full allowed amount when it has a covered day and not at all otherwise. With other health insurance on file, the amount a corrected stay is cost-shared on is its payable allowed amount less the other insurer''s payment, never below zero; otherwise it is the payable allowed amount.'
    params:
    - inpatient_network_admission_copay
  inputs:
    history:
    - table: select_claim_lines
      aggregate: latest
      field: reversed_claim_line_id
      filters:
        event_type: select_claim_line_reverse
    - table: select_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: select_claim_line_post
    - table: select_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: select_claim_line_reverse
    - table: select_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: select_fee_payment
    - category: prime
      table: prime_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: prime_claim_line_post
    - category: referral
      table: referral_authorizations
      aggregate: latest
      field: units_authorized
      filters:
        variant_name: Inpatient Mental Health Authorization
    cross_category:
    - prime
    - referral
- id: select_ext_ohi_line_reprocessing
  base_policy_refs: *id001
  overwrite:
  - base_policy: select_prior_authorization_and_filing
    superseded_clause: A line whose service_class is in prior_authorization_required_service_classes is payable only when an approved authorization for the patient covers the provider and the service date.
    replaced_by: 'For a line this policy reprocesses for other health insurance found retroactively, and only for such a line, the authorization finding of the line it replaces stands in place of a fresh authorization test: the reprocessed line is payable on that finding and carries that line''s authorization reference, because only the payer order changes; every other Select line remains under the base authorization rule.'
  - base_policy: select_agg_family_accumulators
    superseded_clause: Prime cost shares, point-of-service charges and premium-based plan costs are separate accumulators and never count toward the Select family totals.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_catastrophic_cap
    superseded_clause: Point-of-service charges, Prime cost shares, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_ohi_coordination
    superseded_clause: With other health insurance on file, the line's deductible and cost share are figured on the allowed amount net of the other insurer's payment, and TRICARE pays no more than the allowed amount less the other insurer's payment and the beneficiary liability.
    replaced_by: 'With other health insurance on file, the deductible and cost share of a line reprocessed for other health insurance are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  trigger: state_due
  subject:
  - select_claim_line_post
  computes: tricare_paid_amount
  target_tool: post_select_ohi_reprocessed_line_2895a639
  params:
    plan_year_anchor: '2000-01-01'
    months_per_year: 12
    ledger_months: 600
  rule: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed because the beneficiary''s other health insurance was found retroactively: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent reversal for other health insurance found retroactively, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line. It covers the reprocessed line of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee''s own Select enrollment carrying the family''s fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family''s deductible and catastrophic totals are the enrollee''s own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family''s Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design. For a line this policy reprocesses for other health insurance found retroactively, and only for such a line, the authorization finding of the line it replaces stands in place of a fresh authorization test: the reprocessed line is payable on that finding and carries that line''s authorization reference, because only the payer order changes; every other Select line remains under the base authorization rule. The amount a line reprocessed for other health insurance is cost-shared on is the reversed line''s allowed amount. It applies to the deductible the smaller of that amount and the tier''s deductible_individual, and its cost share is network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent. The beneficiary liability on the reprocessed line is the deductible applied plus the cost share, rounded to the cent, and TRICARE pays as primary payer: the allowed amount less that liability, never below zero. The deductible already met for a reprocessed line is the deductible applied on the enrollment''s claim lines less the deductible their reversals withdrew. The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states. Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total. Where other health insurance is on file and the other insurer paid some but less than the allowed amount, the other insurer''s payment is taken off before a line reprocessed for other health insurance is cost-shared; where other health insurance is on file and the other insurer paid at least the allowed amount, the whole allowed amount is taken off; otherwise nothing is taken off. Where the service date of the reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the reprocessed line is cost-shared on is the amount left times the attending share, rounded to the cent. Where the reprocessed line''s service class is in deductible_exempt_service_classes or the line is network preventive care, it takes no deductible; where the tier''s deductible_individual less the deductible already met is less than the amount cost-shared, it takes that remainder, never below zero, rounded to the cent; otherwise it takes the whole amount cost-shared. Where the provider was not in the network on the service date, the cost share on a line reprocessed for other health insurance is non_network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent; where the provider was in the network and the line is durable medical equipment, it is network_dme_cost_share_pct of the amount left, rounded to the cent; where the provider was in the network and the line is preventive care or the tier''s network_cost_share_basis is fixed_copayment, it is the tier''s network copayment for the line''s service class, never more than the amount left; otherwise it is network_outpatient_cost_share_pct of the amount left, rounded to the cent. What TRICARE would pay as primary payer on a reprocessed line is the allowed amount times the attending share, less the beneficiary liability, never below zero. With other health insurance on file, the deductible and cost share of a line reprocessed for other health insurance are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
