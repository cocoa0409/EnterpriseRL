    earlier_d: 'Which installment is the latest installment depends on the enrollment''s standing: where the enrollment has ended, it is the installment charged for the installment period that contains the last day of coverage, read as the charges whose coverage period starts in that period, no later than the month containing the last day of coverage and no later than the payment date; where the enrollment has not ended and a charge has been made for a coverage period starting in the installment period that contains the payment date, on or before that date, it is that period''s charges; otherwise it is the enrollment''s first installment, the charge whose coverage period starts on the effective date. The earlier counted charges are the charges that count toward the past-due balance other than those of the latest installment.'
