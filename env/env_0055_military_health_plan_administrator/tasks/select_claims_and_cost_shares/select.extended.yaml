    carry_r: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a cap-reprocessed line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    room_r: Where the family catastrophic total of a cap-reprocessed line (the Select liability posted less the liability withdrawn, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has reached catastrophic_cap_family, the line carries no liability; where the room left under the cap is less than the liability figured before the cap, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured before the cap.
    liability_r: Where the family catastrophic total of a cap-reprocessed line (the Select liability posted less the liability withdrawn, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has reached catastrophic_cap_family, the line carries no liability; where the room left under the cap is less than the liability figured before the cap, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured before the cap.
    primary_r: What TRICARE would pay as primary payer on a cap-reprocessed line is the allowed amount times the attending share, less the beneficiary liability, never below zero.
    tricare_r: 'With other health insurance on file, the deductible and cost share of a line reprocessed for the catastrophic cap are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
    result: 'With other health insurance on file, the deductible and cost share of a line reprocessed for the catastrophic cap are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  factors:
  - id: cap_line_attending_share
    effect: parameter
    decides: att_r
    bindings:
    - mh_stay_r
    - auth_ok_r
    - auth_days_r
    - req_days_r
    - att_r
    ladder:
    - when: the line's service date is the admission date of an inpatient mental health stay and an Inpatient Mental Health Authorization starting that day was approved for fewer days than it was requested for
      value: auth_days_r / req_days_r
    - when: an inpatient mental health stay was admitted that day and no approved authorization starting that day is on file
      value: '0'
    - when: otherwise
      value: '1'
    baseline:
      att_r: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: referral
  - id: cap_line_select_fees
    effect: parameter
    decides: fees_r
    bindings:
    - chg_begun_r
    - paid_r
    - fees_r
    ladder: *id007
    baseline:
      fees_r: '0'
    evidence:
    - history
    - tier_param
    - date
    cross_difficulty: null
  - id: cap_line_prime_carryover
    effect: parameter
    decides: carry_r
    bindings:
    - plan_change_r
    - pr_cs_r
    - pr_chg_begun_r
    - pr_paid_r
    - pr_amt_r
    - carry_r
    ladder:
    - when: the beneficiary changed from TRICARE Prime during the plan year and the Prime amounts reach catastrophic_cap_family
      value: P('catastrophic_cap_family')
    - when: the beneficiary changed from TRICARE Prime during the plan year
      value: pr_amt_r
    - when: otherwise
      value: '0'
    baseline:
      carry_r: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  - id: cap_line_stage
    effect: parameter
    decides: liability_r
    bindings:
    - claims_r
    - room_r
    - liability_r
    ladder:
    - when: the family catastrophic total has reached catastrophic_cap_family
      value: '0'
    - when: the room left under the cap is less than the liability figured before the cap
      value: room_r
    - when: otherwise
      value: uncapped_r
    baseline:
      liability_r: uncapped_r
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: cap_line_payer_coordination
    effect: method
    decides: tricare_r
    bindings:
    - billed_r
    - primary_r
    - tricare_r
    ladder: *id003
    baseline:
      tricare_r: primary_r
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The amount a line reprocessed for the catastrophic cap is cost-shared and paid on is the reversed line''s allowed amount. Its liability figured before the cap is the deductible it takes, the smaller of the amount cost-shared and the tier''s deductible_individual less the deductible already applied on the enrollment''s claim lines net of reversals and nothing for a service class in deductible_exempt_service_classes or network preventive care, plus the cost share the tier''s outpatient basis gives for its network relationship and service class on what is left (non_network_outpatient_cost_share_pct outside the network, network_dme_cost_share_pct for network durable medical equipment, the network copayment for network preventive care or on a fixed_copayment tier, never more than what is left, and network_outpatient_cost_share_pct otherwise), rounded to the cent. The beneficiary liability on a line reprocessed for the catastrophic cap is that liability figured before the cap, and TRICARE pays as primary payer: the allowed amount less that liability, rounded to the cent and never below zero. With other health insurance on file, the amount a line reprocessed for the catastrophic cap is cost-shared on is the allowed amount less the other insurer''s payment, never below zero; otherwise it is the allowed amount.'
    params:
    - deductible_individual
    - network_outpatient_cost_share_pct
  inputs:
    history:
    - table: select_claim_lines
      aggregate: latest
      field: reversed_claim_line_id
      filters:
        event_type: select_claim_line_reverse
    - table: select_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: select_claim_line_post
    - table: select_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: select_fee_payment
    - *id008
    - *id011
    - *id009
    cross_category:
    - prime
    - referral
