      inpatient_non_network_basis: percent_of_allowed
      inpatient_non_network_daily_charge: 0.00
      inpatient_non_network_pct: 25
      inpatient_deductible_applies: false
      nonparticipating_balance_billing_limit_pct: 15
      prior_authorization_required_service_classes: [inpatient_mental_health_admission]
      specialty_referral_required: false
      routine_eye_exam_interval_months: 0
      claim_filing_deadline_days: 365
      tricare_secondary_to_ohi: true
      region_transfer_allowed: true

events:
  - type: select_enroll
    target: select_enrollments
    mutation: create
    meaning: A beneficiary's application to enroll in a TRICARE Select tier is received and recorded.
    grain: one row per beneficiary enrollment application
    fields:
      customer_id: the enrolling beneficiary
      variant_name: the Select tier applied for, as its official full name
      enrollment_effective_date: date coverage starts once processed (DEERS qualifying-life-event date, or January 1 for an open-season election)
      enrollment_reason: why the enrollment is being made
      qualifying_life_event_id: the DEERS life-event record the enrollment relies on; empty for open-season enrollments
      application_date: date the application was received
      fee_bearing: whether this enrollment carries the sponsor family's Select fee billing
      fee_coverage_type: individual or family fee, or not_applicable
      payment_frequency: installment frequency elected
      payment_method: payment method elected
      ohi_on_file: whether other health insurance is on file at enrollment
    triggers:
      - event: select:select_fee_charge
        when: {fee_bearing: true}
        map: {select_enrollment_id: select_enrollment_id, customer_id: customer_id, installment_frequency: payment_frequency, coverage_period_start: enrollment_effective_date}
  - type: select_activate
    target: select_enrollments
    mutation: {transition: {from: applied, to: active}}
    meaning: The enrollment is processed and Select coverage begins.
    grain: one row per transaction
    fields:
      status: set to active
      enrollment_effective_date: confirmed coverage start date
    triggers: []
  - type: select_reject
    target: select_enrollments
    mutation: {transition: {from: applied, to: rejected}}
    meaning: An enrollment application is rejected without coverage starting.
    grain: one row per transaction
    fields:
      status: set to rejected
    triggers: []
  - type: select_fee_charge
    target: select_fee_ledger
    meaning: An enrollment-fee installment is charged for one coverage period of a fee-bearing Select enrollment.
    grain: one installment charge for one coverage period
    distinguish_by: [coverage_period_start, installment_frequency]
    fields:
      select_enrollment_id: fee-bearing enrollment billed
      customer_id: beneficiary holding the fee-bearing enrollment
      coverage_period_start: first day of the period the installment pays for (its due date)
      coverage_period_end: last day of the period the installment pays for
      installment_frequency: annual, quarterly or monthly
      amount: installment amount, positive USD
      posted_date: date the charge was posted
    account: enrollment_fee_due
    direction: in
    triggers: []
  - type: select_fee_payment
    target: select_fee_ledger
    meaning: A payment against a Select enrollment-fee installment is received.
    grain: one payment applied to one installment charge
    distinguish_by: [related_fee_entry_id, posted_date]
    fields:
      select_enrollment_id: fee-bearing enrollment paid
      customer_id: beneficiary holding the fee-bearing enrollment
      related_fee_entry_id: installment charge this payment settles
      amount: amount paid, positive USD
      payment_method: method used
      posted_date: date received
    account: enrollment_fee_due
    direction: out
    triggers: []
  - type: select_fee_credit
    target: select_fee_ledger
    meaning: A proration credit returns prepaid enrollment fees for whole calendar months after a Select enrollment ends for a credit-eligible reason.
    grain: one proration credit against one paid installment
    distinguish_by: [related_fee_entry_id, adjustment_reason]
    fields:
      select_enrollment_id: fee-bearing enrollment credited
      customer_id: beneficiary holding the fee-bearing enrollment
      related_fee_entry_id: paid installment whose unused months are credited
      adjustment_reason: credit-eligible reason the enrollment ended
      coverage_period_start: first whole calendar month credited
      coverage_period_end: last day of the credited span
      amount: credit amount, positive USD
      posted_date: date posted
    account: enrollment_fee_due
    direction: out
    triggers: []
  - type: select_fee_refund
    target: select_fee_ledger
    meaning: A credit balance on a Select fee-bearing enrollment is refunded to the beneficiary.
    grain: one refund of one posted credit
    distinguish_by: [related_fee_entry_id]
    fields:
      select_enrollment_id: fee-bearing enrollment refunded
      customer_id: beneficiary holding the fee-bearing enrollment
      related_fee_entry_id: credit (or overpayment) refunded
      amount: refund amount, positive USD
      payment_method: method the refund is returned through
      posted_date: date issued
    account: enrollment_fee_due
    direction: in
    triggers: []
  - type: select_claim_line_post
    target: select_claim_lines
    meaning: One line of a TRICARE Select claim is adjudicated - paid or denied - and the beneficiary's deductible and cost share are assessed.
    grain: one adjudicated line of one claim
    distinguish_by: [claim_number, line_number]
    fields:
      select_enrollment_id: enrollment the care was billed under
      customer_id: the patient
      claim_number: claim number printed on the TRICARE Explanation of Benefits
      line_number: line on that claim
      service_date: date of service (admission date for an inpatient stay)
      claim_received_date: date the claim was received
      provider_id: rendering provider or facility
      provider_network_status: network relationship of the provider on the service date
      service_class: benefit class of the service
      inpatient_days: covered inpatient days on an inpatient line; 0 for outpatient lines
      prior_authorization_id: the approved authorization covering the line; empty when none
      billed_amount: amount the provider billed
      allowed_amount: TRICARE allowed amount
      ohi_paid_amount: amount other health insurance paid first
      deductible_applied: part of the line applied to the deductible
      cost_share_amount: total beneficiary liability on the line (deductible applied plus cost share or copayment)
      tricare_paid_amount: amount TRICARE paid
      line_outcome: paid or the denial reason
      posted_date: adjudication date
    account: beneficiary_liability_accrued
    direction: in
    triggers: []
  - type: select_claim_line_reverse
    target: select_claim_lines
    meaning: A previously adjudicated Select claim line is reversed so that it can be adjudicated again on a corrected basis.
    grain: one reversal of one adjudicated claim line
    distinguish_by: [reversed_claim_line_id]
    fields:
      select_enrollment_id: enrollment of the original line
      customer_id: the patient
      claim_number: claim number of the original line
      line_number: line number of the original line
      reversed_claim_line_id: adjudicated line being reversed
      reversal_reason: why the line is reversed
      deductible_applied: deductible withdrawn with the reversal
      cost_share_amount: beneficiary liability withdrawn, equal to the original line's cost_share_amount
      tricare_paid_amount: TRICARE payment withdrawn
      posted_date: reversal date
    account: beneficiary_liability_accrued
    direction: out
    triggers: []
  - type: select_disenroll_voluntary
    target: select_enrollments
    mutation: {transition: {from: active, to: disenrolled_voluntary}}
    meaning: The beneficiary confirms leaving TRICARE Select.
    grain: one row per transaction
    fields:
      status: set to disenrolled_voluntary
      disenrollment_date: last day of Select coverage
    triggers: []
  - type: select_disenroll_nonpayment
    target: select_enrollments
    mutation: {transition: {from: active, to: disenrolled_nonpayment}}
    meaning: The enrollment ends because an installment went unpaid past the grace period.
    grain: one row per transaction
    fields:
      status: set to disenrolled_nonpayment
      disenrollment_date: paid-through date
    triggers: []
  - type: select_reinstate
    target: select_enrollments
    mutation: {transition: {from: disenrolled_nonpayment, to: active}}
    meaning: A nonpayment disenrollment is reversed and the enrollment restored without a break.
    grain: one row per transaction
    fields:
      select_enrollment_id: the enrollment being restored
      status: set back to active
      disenrollment_date: cleared to empty
    triggers: []
  - type: select_terminate_ineligible
    target: select_enrollments
    mutation: {transition: {from: active, to: terminated_ineligible}}
    meaning: The enrollment ends because DEERS no longer shows eligibility for the Select tier.
    grain: one row per transaction
    fields:
      status: set to terminated_ineligible
      disenrollment_date: last day of eligibility shown in DEERS
    triggers: []
  - type: select_transfer_out
    target: select_enrollments
    mutation: {transition: {from: active, to: transferred_out}}
    meaning: The enrollment is transferred to another region after the beneficiary moves.
    grain: one row per transaction
    fields:
      status: set to transferred_out
      disenrollment_date: last day of West Region enrollment
    triggers: []
  - type: select_tier_update
    target: select_enrollments
    mutation: update
    meaning: The enrollment moves between the E-1 to E-4 and the E-5 and above active duty family tier of its group after a sponsor pay-grade change.
    grain: one row per transaction
    fields:
      variant_name: the new Select tier
    triggers: []
  - type: select_payment_setup_update
    target: select_enrollments
    mutation: update
    meaning: The installment frequency or payment method for the Select enrollment fee is changed.
    grain: one row per transaction
    fields:
      payment_frequency: new installment frequency
      payment_method: new payment method
    triggers: []
  - type: select_fee_policy_update
    target: select_enrollments
    mutation: update
    meaning: The sponsor family's Select fee arrangement changes between individual and family, or the fee-bearing enrollment moves to another family member.
    grain: one row per transaction
    fields:
      fee_bearing: whether this enrollment now carries the family's fee billing
      fee_coverage_type: individual, family or not_applicable after the change
    triggers: []
  - type: select_ohi_update
    target: select_enrollments
    mutation: update
    meaning: Other health insurance is reported or removed for the enrollee.
    grain: one row per transaction
    fields:
      ohi_on_file: whether other health insurance is now on file
    triggers: []

measures:
  - id: select_msr_individual_deductible_ytd
    window: the calendar plan year that contains the service date of the line being adjudicated
    measure: per beneficiary, sum of deductible_applied on select_claim_line_post rows minus deductible_applied on the matching select_claim_line_reverse rows
  - id: select_msr_family_deductible_ytd
    window: the calendar plan year that contains the service date of the line being adjudicated
    measure: across every Select enrollment whose holder shares the patient's sponsor_customer_id, sum of deductible_applied on select_claim_line_post rows minus the same field on matching select_claim_line_reverse rows
  - id: select_msr_family_catastrophic_ytd
    window: the calendar plan year that contains the service date of the line being adjudicated
    measure: across every Select enrollment whose holder shares the patient's sponsor_customer_id, sum of cost_share_amount on select_claim_line_post rows minus cost_share_amount on matching select_claim_line_reverse rows, plus - where fees_count_toward_catastrophic_cap is true - the amount of select_fee_payment rows whose installment's coverage_period_start falls in that plan year
  - id: select_msr_paid_through_date
    window: the life of the fee-bearing enrollment
    measure: the latest coverage_period_end among select_fee_charge rows fully settled by select_fee_payment rows referencing them (related_fee_entry_id)

policies:
  - id: select_agg_multi_holding
    subject: [select_enroll]
    rule: >-
      A beneficiary may hold at most one TRICARE Select enrollment at a time. A beneficiary may not be
      enrolled in TRICARE Select and TRICARE Prime, or in TRICARE Select and a premium-based plan, at
      the same time; electing Select while holding an active Prime or premium-based plan enrollment is a
      plan change that ends the other enrollment on the day before the Select effective date and can
      only be made at open season or within a qualifying-life-event window. The beneficiary has no applied or active Select enrollment in the region on the application date.
    eligibility:
      - id: no_open_select_enrollment
        applies_to: [select_enroll]
        kind: dedup
        condition: The beneficiary has no applied or active Select enrollment in the region on the application date.
        evidence_fields: [select_enrollments.customer_id, select_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [select_enrollments.customer_id]
          action_bindings:
            select_enrollments.customer_id: customer_id
        dedup_contract:
          table: select_enrollments
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active]}
          distinct_fields: [enrollment_effective_date]
    params:
      max_per_customer: 1

  - id: select_agg_family_accumulators
    subject: [select_claim_line_post, select_claim_line_reverse, select_fee_payment]
    rule: >-
      Deductibles and the catastrophic cap are family accumulators. Every Select enrollment whose holder
      shares the same sponsor_customer_id belongs to one family; a line's deductible is limited both by
      the patient's own remaining individual deductible and by the family's remaining family deductible,
      and once the family deductible is met no member owes any further deductible that plan year. The
      family catastrophic total combines every member's net liability on Select claim lines and, where
      fees count, the Select enrollment fees paid for the plan year. Amounts accumulate to the calendar
      plan year of the service date (the admission date for inpatient stays), never of the posting date.
      Prime cost shares, point-of-service charges and premium-based plan costs are separate accumulators
      and never count toward the Select family totals.
    eligibility: []
    measures: [select_msr_individual_deductible_ytd, select_msr_family_deductible_ytd, select_msr_family_catastrophic_ytd]

  - id: select_tier_eligibility
    subject: [select_enroll, select_activate, select_reject, select_terminate_ineligible, select_tier_update]
    rule: >-
      The Select tier is fixed by the DEERS record, never by the caller's description. The DEERS
      beneficiary category must be one of the tier's eligible_beneficiary_categories; the sponsor's
      sponsor_initial_entry_date places the family in Group A when it is before 2018-01-01 and in Group B
      when it is on or after 2018-01-01; and for active duty family members the sponsor's DEERS pay grade
      places the family in the E-1 to E-4 tier (E-1 through E-4) or the E-5 and above tier (every other
      grade, warrant officers and commissioned officers included). Transitional survivors take the
      active duty family tier of their group and the sponsor's pay grade at death. The beneficiary's DEERS beneficiary category, sponsor entry date and sponsor pay grade match the requested Select tier.
      A promotion or reduction that moves the sponsor across the E-4/E-5 line moves the family's
      enrollments to the matching tier from January 1 of the next plan year, and deductibles already met
      that year stand. When DEERS stops showing the beneficiary in any Select category (sponsor
      retirement, separation, divorce, aging out) the enrollment is terminated as ineligible on the last
      day of eligibility; a retiring sponsor's family re-enrolls in a retiree tier within the
      qualifying-life-event window, effective on the retirement date.
    eligibility:
      - id: deers_tier_match
        applies_to: [select_enroll, select_activate, select_tier_update]
        kind: authorization
        condition: The beneficiary's DEERS beneficiary category, sponsor entry date and sponsor pay grade match the requested Select tier.
        evidence_fields: [customers.customer_id, customers.beneficiary_category, customers.sponsor_initial_entry_date, customers.sponsor_pay_grade, customers.sponsor_customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      group_b_entry_date_boundary: "2018-01-01"
      e1_to_e4_grades: [E-1, E-2, E-3, E-4]

  - id: select_enrollment_window
    subject: [select_enroll, select_reject]
    rule: >-
      Outside the open season (the Monday of the second full week of November through the Monday of the
      second full week of December, effective January 1) a Select enrollment rests on a qualifying life
      event that DEERS has recorded for the beneficiary; the caller's own account of the event is never a
      substitute for the DEERS record. The enrollment application must be received no later than the qle_enrollment_window_days after the qualifying life event recorded in DEERS.
      The window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus qle_enrollment_window_days and an application received on that day is timely while one received the next day is not.
      A qualifying-life-event enrollment takes effect on the DEERS event_date. An application that misses
      the window is rejected; the beneficiary may enroll at the next open season or after a new event.
    eligibility:
      - id: qle_window
        applies_to: [select_enroll]
        kind: time
        condition: The enrollment application must be received no later than the qle_enrollment_window_days after the qualifying life event recorded in DEERS.
        evidence_fields: [deers_life_events.life_event_id, deers_life_events.customer_id, deers_life_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deers_life_events.life_event_id]
          action_bindings:
            deers_life_events.life_event_id: qualifying_life_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the qualifying life event recorded in DEERS
          anchor_source: deers_life_events.event_date
          relation: not_after
          duration_source: variants.qle_enrollment_window_days
          unit: calendar_days
          counting_rule: The window is counted in calendar days starting the day after the DEERS event_date, so the last timely day is event_date plus qle_enrollment_window_days and an application received on that day is timely while one received the next day is not.
          boundary: inclusive

  - id: select_enrollment_fee_schedule
    subject: [select_fee_charge, select_enroll, select_activate, select_fee_policy_update]
    rule: >-
      Enrollment fees are owed only by tiers whose fee_exempt is false (the retiree tiers) and are billed
      once per sponsor family to the fee-bearing enrollment - the sponsor's own Select enrollment when the
      sponsor is enrolled, otherwise that of the eldest enrolled family member. The family owes
      annual_fee_individual while exactly one member is enrolled in Select and annual_fee_family while two
      or more are. An annual installment is the full annual fee, a quarterly installment one quarter and a
      monthly installment one twelfth, each rounded to the cent; installments cover calendar quarters or
      calendar months and are due on the first day of the period they cover. A first installment for an
      enrollment that starts mid-period covers the months from the month containing the effective date
      (counted whole) to the end of that installment period, at one twelfth of the annual fee per month,
      and is charged with the application. A fee-bearing enrollment is activated only after its first installment charge has a payment posted against it.
      Installments are charged only on a fee-bearing enrollment whose status is applied or active.
    eligibility:
      - id: fee_bearing_enrollment_open
        applies_to: [select_fee_charge]
        kind: state
        condition: Installments are charged only on a fee-bearing enrollment whose status is applied or active.
        evidence_fields: [select_enrollments.select_enrollment_id, select_enrollments.status, select_enrollments.fee_bearing]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [select_enrollments.select_enrollment_id]
          action_bindings:
            select_enrollments.select_enrollment_id: select_enrollment_id
        state_contract:
          field: select_enrollments.status
          allowed: [applied, active]
      - id: first_installment_paid
        applies_to: [select_activate]
        kind: authorization
        condition: A fee-bearing enrollment is activated only after its first installment charge has a payment posted against it.
        evidence_fields: [select_fee_ledger.select_enrollment_id, select_fee_ledger.related_fee_entry_id, select_fee_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [select_fee_ledger.select_enrollment_id]
          action_bindings:
            select_fee_ledger.select_enrollment_id: select_enrollment_id
    params:
      quarterly_divisor: 4
      monthly_divisor: 12
    formula:
      when_not: fee_exempt
      annual_fee: annual_fee_family if fee_coverage_type == "family" else annual_fee_individual
      monthly_rate: round(annual_fee / monthly_divisor, 2)
      quarterly_installment: round(annual_fee / quarterly_divisor, 2)

  - id: select_fee_payment_and_nonpayment
    subject: [select_fee_payment, select_payment_setup_update, select_disenroll_nonpayment]
    rule: >-
      Monthly installments may be paid only through a method in monthly_payment_methods; annual and
      quarterly installments may also be paid by a single card payment or check, and an allotment is
      available only to a sponsor who draws retired pay. A change of frequency or method takes effect from
      the next installment period. A payment is applied to the oldest unpaid installment first. When an
      installment is unpaid on its due date a delinquency letter is issued on the delinquency_notice_day
      after the due date. The enrollment is disenrolled for nonpayment only once more than nonpayment_grace_days have passed since the due date of the oldest unpaid installment.
      The grace period is counted in calendar days starting the day after the due date (the coverage_period_start of that installment), so disenrollment may be processed from the day after due date plus nonpayment_grace_days and not on that day itself.
      A payment inside the grace period cures the delinquency. The disenrollment takes effect on the
      paid-through date (select_msr_paid_through_date) and covers every family member billed through the
      same fee-bearing enrollment; the family may enroll again at the next open season or after a new
      qualifying life event, or ask for an Enrollment Reinstatement Review within
      reinstatement_request_window_days.
    eligibility:
      - id: grace_period_expired
        applies_to: [select_disenroll_nonpayment]
        kind: time
        condition: The enrollment is disenrolled for nonpayment only once more than nonpayment_grace_days have passed since the due date of the oldest unpaid installment.
        evidence_fields: [select_fee_ledger.select_fee_entry_id, select_fee_ledger.coverage_period_start, select_fee_ledger.select_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [select_fee_ledger.select_fee_entry_id]
          action_bindings:
            select_fee_ledger.select_fee_entry_id: select_fee_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the due date of the oldest unpaid installment
          anchor_source: select_fee_ledger.coverage_period_start
          relation: not_before
          duration_source: variants.nonpayment_grace_days
          unit: calendar_days
          counting_rule: The grace period is counted in calendar days starting the day after the due date (the coverage_period_start of that installment), so disenrollment may be processed from the day after due date plus nonpayment_grace_days and not on that day itself.
          boundary: exclusive
    measures: [select_msr_paid_through_date]

  - id: select_reinstatement
    subject: [select_reinstate]
    rule: >-
      A nonpayment disenrollment is reversed only through an Enrollment Reinstatement Review. The enrollment is reinstated only when an Enrollment Reinstatement Review case for this enrollment is decided overturned and every past-due installment through the current period has a payment posted.
      Reinstatement restores coverage from the day after the old paid-through date with no gap and claim
      lines denied for the gap are reversed and adjudicated again.
    eligibility:
      - id: reinstatement_review_overturned
        applies_to: [select_reinstate]
        kind: authorization
        condition: The enrollment is reinstated only when an Enrollment Reinstatement Review case for this enrollment is decided overturned and every past-due installment through the current period has a payment posted.
        evidence_fields: [appeal_cases.appeal_case_id, appeal_cases.subject_enrollment_id, appeal_cases.status, select_fee_ledger.select_enrollment_id, select_fee_ledger.related_fee_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appeal_cases.appeal_case_id]
            - [appeal_cases.subject_enrollment_id]
          action_bindings:
            appeal_cases.appeal_case_id: appeal_case_id
            appeal_cases.subject_enrollment_id: select_enrollment_id

  - id: select_deductible
    subject: [select_claim_line_post]
    rule: >-
      The deductible applies per calendar plan year of the service date, to network and non-network
      outpatient care alike, and never to a service_class listed in deductible_exempt_service_classes.
      Inpatient facility lines take the deductible only where inpatient_deductible_applies is true. A line
      applies to the deductible the smaller of its allowed amount net of any other health insurance
      payment, the patient's remaining individual deductible (deductible_individual less
      select_msr_individual_deductible_ytd) and the family's remaining family deductible
      (deductible_family less select_msr_family_deductible_ytd). A denied line applies nothing to the
      deductible. Lines are accumulated in adjudication order; a line adjudicated later for an earlier
      service date does not reopen deductibles already met.
    eligibility: []
    measures: [select_msr_individual_deductible_ytd, select_msr_family_deductible_ytd]
    formula:
      when: line_outcome == "paid"
      deductible_applied: max(0, min(allowed_amount - ohi_paid_amount, deductible_individual - select_msr_individual_deductible_ytd, deductible_family - select_msr_family_deductible_ytd))

  - id: select_outpatient_cost_shares
    subject: [select_claim_line_post]
    rule: >-
      After the deductible, a network outpatient line carries network_outpatient_cost_share_pct of the
      remaining allowed amount where network_cost_share_basis is percent_of_allowed, and the fixed
      network copayment for its service_class where it is fixed_copayment (durable medical equipment
      always carries network_dme_cost_share_pct); a copayment is never more than the remaining allowed
      amount. A non-network outpatient line - participating or nonparticipating alike - carries
      non_network_outpatient_cost_share_pct of the remaining allowed amount. Network preventive care
      carries network_copay_preventive_care and no deductible. The provider's network status is the one in
      the provider record on the service date. Cost shares are rounded to the cent.
    eligibility: []
    params:
      network_copay_for_class: the network_copay_* parameter matching the line's service_class
    formula:
      when: line_outcome == "paid"
      remaining_allowed: allowed_amount - ohi_paid_amount - deductible_applied
      outpatient_cost_share: round(remaining_allowed * network_outpatient_cost_share_pct / 100, 2) if provider_network_status == "network" and network_cost_share_basis == "percent_of_allowed" else (min(network_copay_for_class, remaining_allowed) if provider_network_status == "network" else round(remaining_allowed * non_network_outpatient_cost_share_pct / 100, 2))
      cost_share_amount: deductible_applied + outpatient_cost_share

  - id: select_inpatient_cost_shares
    subject: [select_claim_line_post]
    rule: >-
      An inpatient facility line is cost-shared by the stay, not by the day of posting. Under
      per_diem_with_minimum the beneficiary pays the daily charge times inpatient_days, but never less
      than the minimum charge for the admission; under lesser_of_per_diem_or_pct the beneficiary pays the
      lesser of the daily charge times inpatient_days and the stated percent of the facility allowed
      amount; under per_admission_copay the beneficiary pays the admission copayment once per stay;
      under percent_of_allowed the beneficiary pays the stated percent of the allowed amount. Network
      stays use the network basis and amounts, non-network stays the non-network ones. Separately billed
      professional services during the stay are outpatient lines. A non-emergency inpatient mental
      health admission needs an approved authorization before it is payable.
    eligibility: []
    formula:
      when: service_class in ["inpatient_admission", "inpatient_mental_health_admission"] and line_outcome == "paid"
      network_per_diem_total: max(inpatient_network_daily_charge * inpatient_days, inpatient_network_minimum_charge)
      network_lesser_of: min(inpatient_network_daily_charge * inpatient_days, round(allowed_amount * inpatient_network_pct_of_allowed / 100, 2))
      non_network_lesser_of: min(inpatient_non_network_daily_charge * inpatient_days, round(allowed_amount * inpatient_non_network_pct / 100, 2))

  - id: select_catastrophic_cap
    subject: [select_claim_line_post, select_claim_line_reverse, select_fee_payment]
    rule: >-
      Once the family's catastrophic total for the plan year (select_msr_family_catastrophic_ytd) reaches
      catastrophic_cap_family, every later line of that plan year carries no deductible and no cost share,
      and a line that crosses the cap is cut to the amount still remaining under it. Point-of-service
      charges, Prime cost shares, premium-based plan costs and amounts a nonparticipating provider bills
      above the allowed amount never count. When a line adjudicated earlier is found to have been
      cost-shared after the family had already reached the cap, that line is reversed with reason
      catastrophic_cap_reprocessing and adjudicated again with no cost share.
    eligibility: []
    measures: [select_msr_family_catastrophic_ytd]
    formula:
      remaining_cap: max(0, catastrophic_cap_family - select_msr_family_catastrophic_ytd)
      capped_liability: min(cost_share_amount, remaining_cap)

  - id: select_prior_authorization_and_filing
    subject: [select_claim_line_post]
    rule: >-
      A line whose service_class is in prior_authorization_required_service_classes is payable only when an approved authorization for the patient covers the provider and the service date.
      A line without one is denied with line_outcome denied_no_authorization (no deductible, no cost share,
      no TRICARE payment); emergency admissions are covered without prior authorization when the facility
      notified the region within the notification window. A claim received more than
      claim_filing_deadline_days after the service date (or, for inpatient stays, the discharge date) is
      denied as denied_untimely_filing, unless the provider's or beneficiary's documented reason was
      retroactive DEERS eligibility or another insurer's late processing. Specialty care needs no referral
      under TRICARE Select. A line for a date of service on which the patient had no active Select
      enrollment is denied as denied_no_eligibility.
    eligibility:
      - id: authorization_on_file
        applies_to: [select_claim_line_post]
        kind: authorization
        condition: A line whose service_class is in prior_authorization_required_service_classes is payable only when an approved authorization for the patient covers the provider and the service date.
        evidence_fields: [referral_authorizations.referral_authorization_id, referral_authorizations.customer_id, referral_authorizations.status, referral_authorizations.servicing_provider_id, referral_authorizations.valid_from, referral_authorizations.valid_through]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [referral_authorizations.referral_authorization_id]
          action_bindings:
            referral_authorizations.referral_authorization_id: prior_authorization_id

  - id: select_nonparticipating_providers
    subject: [select_claim_line_post]
    rule: >-
      A participating provider (network, or non-network accepting assignment on the claim) is paid
      directly and may bill the beneficiary only the deductible and cost share. A nonparticipating
      provider is not paid by TRICARE: the TRICARE payment goes to the beneficiary, who pays the provider,
      and the provider may bill the beneficiary up to nonparticipating_balance_billing_limit_pct above the
      allowed amount. The amount billed above the allowed amount is not a cost share, is never recorded as
      beneficiary liability and never counts toward the deductible or catastrophic cap.
    eligibility: []
    formula:
      maximum_billable: round(allowed_amount * (100 + nonparticipating_balance_billing_limit_pct) / 100, 2)

  - id: select_ohi_coordination
    subject: [select_ohi_update, select_claim_line_post]
    rule: >-
      TRICARE pays after other health insurance for tiers whose tricare_secondary_to_ohi is true; Medicaid
      and TRICARE supplement policies are not other health insurance. With other health insurance on file,
      the line's deductible and cost share are figured on the allowed amount net of the other insurer's
      payment, and TRICARE pays no more than the allowed amount less the other insurer's payment and the
      beneficiary liability. Other health insurance is put on file or removed from the date reported;
      earlier lines adjudicated on the wrong basis are reversed with reason ohi_retroactive and adjudicated
      again. The ohi_paid_amount is the other insurer's payment shown on its explanation of benefits.
    eligibility: []
    formula:
      tricare_paid_amount: max(0, allowed_amount - ohi_paid_amount - cost_share_amount)

  - id: select_claim_line_reversal
    subject: [select_claim_line_reverse]
    rule: >-
      A reversal withdraws exactly the deductible, beneficiary liability and TRICARE payment of one
      adjudicated line, identified by that line's own record, and is posted only for a reason in
      reversal_reason (an overturned appeal, a duplicate claim, other health insurance found
      retroactively, a provider correction or catastrophic-cap reprocessing). The corrected adjudication is
      posted afterwards as a new line of the same claim with the next unused line number. The line being reversed has not already been reversed.
    eligibility:
      - id: line_not_already_reversed
        applies_to: [select_claim_line_reverse]
        kind: dedup
        condition: The line being reversed has not already been reversed.
        evidence_fields: [select_claim_lines.select_claim_line_id, select_claim_lines.reversed_claim_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [select_claim_lines.select_claim_line_id]
          action_bindings:
            select_claim_lines.select_claim_line_id: reversed_claim_line_id
        dedup_contract:
          table: select_claim_lines
          mode: separate_record
          object_bindings: {reversed_claim_line_id: reversed_claim_line_id}
          duplicate_filters: {event_type: [select_claim_line_reverse]}
          distinct_fields: []

  - id: select_fee_proration_and_exit
    subject: [select_fee_credit, select_fee_refund, select_disenroll_voluntary, select_terminate_ineligible, select_transfer_out]
    rule: >-
      When a fee-bearing Select enrollment ends for a reason in fee_credit_eligible_reasons, the paid fee
      for every whole calendar month after the disenrollment date is credited at one twelfth of the
      annual fee per month; the month containing the disenrollment date is never credited and a
      nonpayment disenrollment earns no credit. A credit is posted only against an installment charge that has a payment posted against it.
      A resulting credit balance is refunded through the original payment method within
      fee_refund_issue_days. A voluntary disenrollment needs the beneficiary's own confirmation - the agent
      records the request as an intake and the beneficiary confirms it - and takes effect on the date
      confirmed, never earlier. A move outside the West Region transfers the enrollment to the gaining
      region, carrying the family accumulators; a move inside the region changes nothing for Select.
    eligibility:
      - id: credit_against_paid_installment
        applies_to: [select_fee_credit]
        kind: authorization
        condition: A credit is posted only against an installment charge that has a payment posted against it.
        evidence_fields: [select_fee_ledger.select_fee_entry_id, select_fee_ledger.related_fee_entry_id, select_fee_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [select_fee_ledger.select_fee_entry_id]
          action_bindings:
            select_fee_ledger.select_fee_entry_id: related_fee_entry_id
    params:
      credited_months: count of whole calendar months after the disenrollment date inside the paid installment's coverage period
    formula:
      amount: round(credited_months * (annual_fee_family if fee_coverage_type == "family" else annual_fee_individual) / 12, 2)

  - id: select_cost_share_tier_ladder
    subject: [select_claim_line_post]
    rule: >-
      The deductible, catastrophic cap and network basis of a line are always those of the tier the
      enrollment holds on the service date; a line is never cost-shared under a neighbouring tier of the
      same group or under the other group, and a sponsor's later pay-grade change never re-prices lines
      already adjudicated for earlier service dates.
    eligibility: []
    params:
      per_tier:
        TRICARE Select Active Duty Family Member Group A (E-1 to E-4): {deductible_individual: "=deductible_individual", deductible_family: "=deductible_family", catastrophic_cap_family: "=catastrophic_cap_family", network_cost_share_basis: "=network_cost_share_basis"}
        TRICARE Select Active Duty Family Member Group A (E-5 and Above): {deductible_individual: "=deductible_individual", deductible_family: "=deductible_family", catastrophic_cap_family: "=catastrophic_cap_family", network_cost_share_basis: "=network_cost_share_basis"}
        TRICARE Select Active Duty Family Member Group B (E-1 to E-4): {deductible_individual: "=deductible_individual", deductible_family: "=deductible_family", catastrophic_cap_family: "=catastrophic_cap_family", network_cost_share_basis: "=network_cost_share_basis"}
        TRICARE Select Active Duty Family Member Group B (E-5 and Above): {deductible_individual: "=deductible_individual", deductible_family: "=deductible_family", catastrophic_cap_family: "=catastrophic_cap_family", network_cost_share_basis: "=network_cost_share_basis"}
        TRICARE Select Retiree Group A: {deductible_individual: "=deductible_individual", deductible_family: "=deductible_family", catastrophic_cap_family: "=catastrophic_cap_family", network_cost_share_basis: "=network_cost_share_basis"}
        TRICARE Select Retiree Group B: {deductible_individual: "=deductible_individual", deductible_family: "=deductible_family", catastrophic_cap_family: "=catastrophic_cap_family", network_cost_share_basis: "=network_cost_share_basis"}

extended_policies:
- id: select_ext_card_installment_payment
  base_policy_refs: &id005
  - select_agg_family_accumulators
  - select_catastrophic_cap
  - select_fee_payment_and_nonpayment
  - select_enrollment_fee_schedule
  overwrite:
  - base_policy: select_enrollment_fee_schedule
    superseded_clause: The family owes annual_fee_individual while exactly one member is enrolled in Select and annual_fee_family while two or more are.
    replaced_by: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a card-paid installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
  trigger: state_due
  subject:
  - select_fee_payment
  computes: amount
  target_tool: pay_select_installment_by_card_fa3a0d38
  params:
    plan_year_anchor: '2000-01-01'
    months_per_year: 12
    ledger_months: 600
    quarterly_divisor: 4
    monthly_divisor: 12
  rule: 'This policy settles the amount a beneficiary pays by one-time card to clear the past-due balance of a fee-bearing TRICARE Select enrollment whose installments are quarterly or annual and whose elected payment method is a single card payment or a check; the card payment is recorded against one installment, called here the latest installment: where the enrollment has ended, the charges whose coverage period starts in the installment period (the calendar quarter for quarterly installments, the calendar year for annual ones) that contains the last day of coverage, no later than the month containing that day and no later than the payment date; otherwise the charges made for coverage periods starting in the installment period that contains the payment date, on or before that date. It covers a fee-bearing enrollment (fee_bearing true) that took effect in the plan year that contains the payment date, whose elected payment method is a single card payment (card_single) or a check and whose frequency in force is quarterly or annual, so that every installment whose coverage period has begun belongs to that plan year; for any other enrollment this policy settles nothing. An enrollment''s standing in this policy is its lifecycle status: it has ended when its status is disenrolled_voluntary, disenrolled_nonpayment, terminated_ineligible or transferred_out, whatever the payment date, and its last day of coverage is then the disenrollment date on its record; it is active when its status is active; and it is awaiting activation when its status is applied. A rejected enrollment owes no fee and is outside this policy. A change of installment frequency takes effect from the next installment period, so an installment is owed at the frequency in force, the one installments are being charged at: where an annual installment has been charged for a coverage period starting in the calendar year of the payment date, on or before that date, the frequency in force is annual; otherwise, where a quarterly installment has been charged for a coverage period starting in the calendar quarter of the payment date, on or before that date, it is quarterly; otherwise, where a monthly installment has been charged for a coverage period starting in the month of the payment date, on or before that date, it is monthly; and where none has been, it is the frequency the enrollment has elected. At the frequency in force an installment period is the calendar year for an annual installment and the calendar quarter for a quarterly one. With no other rule applied, the latest installment is owed at the annual family fee, annual_fee_family, for its whole period (one quarter of it for a quarterly installment, all of it for an annual one), nothing counts as already received on it, only the enrollment''s first installment counts as a charge on the account, and the card payment is the installment owed plus the amount by which the charges counted other than the latest installment exceed the payments posted, rounded to the cent. Where the enrollment''s fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family''s catastrophic total is that member''s own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a card-paid installment is figured from is zero; that total is the beneficiary liability posted on the enrollment''s Select claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family. Where only one installment''s coverage period has begun on the enrollment, so that it is the enrollment''s first, and the enrollment took effect after the first month of that installment''s calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is the annual fee for the whole period, one quarter of it for a quarterly installment and all of it for an annual one; each figure is rounded to the cent. The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts. The earlier counted charges are the charges that count other than those of the latest installment. Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received. The card payment is the installment owed less what counts as already received, plus any part of the earlier counted charges the payments did not settle, rounded to the cent and never below zero.'
  prerequisite: []
  cross_category: []
  compute:
  - charged_freq_c: '''annual'' if (COUNT(''select_fee_ledger'', within_months=MONTHS(K(''plan_year_anchor''), NOW) % 12 + 1, date_field=''coverage_period_start'', event_type=''select_fee_charge'', installment_frequency=''annual'') - (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''annual'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(F(''enrollment_effective_date''), NOW) < (MONTHS(K(''plan_year_anchor''), NOW) % 12 + 1)) else 0) + (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''annual'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(K(''plan_year_anchor''), NOW) - MONTHS(K(''plan_year_anchor''), F(''enrollment_effective_date'')) < (MONTHS(K(''plan_year_anchor''), NOW) % 12 + 1)) else 0)) > 0 else (''quarterly'' if (COUNT(''select_fee_ledger'', within_months=MONTHS(K(''plan_year_anchor''), NOW) % 3 + 1, date_field=''coverage_period_start'', event_type=''select_fee_charge'', installment_frequency=''quarterly'') - (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''quarterly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(F(''enrollment_effective_date''), NOW) < (MONTHS(K(''plan_year_anchor''), NOW) % 3 + 1)) else 0) + (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''quarterly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(K(''plan_year_anchor''), NOW) - MONTHS(K(''plan_year_anchor''), F(''enrollment_effective_date'')) < (MONTHS(K(''plan_year_anchor''), NOW) % 3 + 1)) else 0)) > 0 else (''monthly'' if (COUNT(''select_fee_ledger'', within_months=1, date_field=''coverage_period_start'', event_type=''select_fee_charge'', installment_frequency=''monthly'') - (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''monthly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(F(''enrollment_effective_date''), NOW) < (1)) else 0) + (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''monthly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(K(''plan_year_anchor''), NOW) - MONTHS(K(''plan_year_anchor''), F(''enrollment_effective_date'')) < (1)) else 0)) > 0 else None))'
  - freq_c: charged_freq_c if charged_freq_c else F('payment_frequency')
  - per_c: 12 if freq_c == 'annual' else (3 if freq_c == 'quarterly' else 1)
  - scope_c: (MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12) and (F('status') == 'applied' or F('status') == 'active' or (F('status') == 'disenrolled_voluntary' or F('status') == 'disenrolled_nonpayment' or F('status') == 'terminated_ineligible' or F('status') == 'transferred_out')) and F('fee_bearing') == True and (F('payment_method') == 'card_single' or F('payment_method') == 'check') and (freq_c == 'annual' or freq_c == 'quarterly')
  - ended_c: (F('status') == 'disenrolled_voluntary' or F('status') == 'disenrolled_nonpayment' or F('status') == 'terminated_ineligible' or F('status') == 'transferred_out')
  - latest_amt: RND(RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')) + MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_c + 1, date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')) + MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_c + 1)) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')) + MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_c + 1)) else 0), 2) - RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')), date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0), 2), 2) if ended_c else RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) % per_c + 1, date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) % per_c + 1)) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) % per_c + 1)) else 0), 2)
  - n_begun: COUNT('select_fee_ledger', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - claims_c: SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_post') - SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_reverse')
  - chg_begun_c: SUM('select_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - paid_c: SUM('select_fee_ledger','amount', event_type='select_fee_payment')
  - total_c: claims_c + (MN(chg_begun_c, paid_c) if P('fees_count_toward_catastrophic_cap') else 0)
  - annual_fee: 0 if (F('fee_coverage_type') == 'individual' and total_c >= P('catastrophic_cap_family')) else (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - first_months: per_c - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) % per_c
  - end_months: MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_c + 1 if ended_c else per_c
  - installment: RND(annual_fee * first_months / K('monthly_divisor'), 2) if (n_begun == 1 and first_months < per_c) else (RND(annual_fee * end_months / K('monthly_divisor'), 2) if (ended_c and end_months < per_c) else RND(annual_fee * per_c / K('monthly_divisor'), 2))
  - after_end: RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')), date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0), 2) if ended_c else 0
  - first_amt: SUM('select_fee_ledger','amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date'))
  - first_in_l_c: (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) >= MONTHS(K('plan_year_anchor'), F('disenrollment_date')) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_c) if ended_c else (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < MONTHS(K('plan_year_anchor'), NOW) % per_c + 1)
  - earlier_c: RND(chg_begun_c - after_end - latest_amt, 2) if ended_c else (RND(chg_begun_c - latest_amt, 2) if F('status') == 'active' else RND(first_amt - (first_amt if first_in_l_c else 0), 2))
  - left_c: RND(paid_c - earlier_c, 2)
  - received: installment if left_c >= installment else (left_c if left_c > 0 else 0)
  - unsettled: MX(0, -left_c)
  - result: RND(MX(0, installment - received + unsettled), 2) if scope_c else None
  compute_basis:
    charged_freq_c: 'A change of installment frequency takes effect from the next installment period, so an installment is owed at the frequency in force, the one installments are being charged at: where an annual installment has been charged for a coverage period starting in the calendar year of the payment date, on or before that date, the frequency in force is annual; otherwise, where a quarterly installment has been charged for a coverage period starting in the calendar quarter of the payment date, on or before that date, it is quarterly; otherwise, where a monthly installment has been charged for a coverage period starting in the month of the payment date, on or before that date, it is monthly; and where none has been, it is the frequency the enrollment has elected. At the frequency in force an installment period is the calendar year for an annual installment and the calendar quarter for a quarterly one.'
    freq_c: 'A change of installment frequency takes effect from the next installment period, so an installment is owed at the frequency in force, the one installments are being charged at: where an annual installment has been charged for a coverage period starting in the calendar year of the payment date, on or before that date, the frequency in force is annual; otherwise, where a quarterly installment has been charged for a coverage period starting in the calendar quarter of the payment date, on or before that date, it is quarterly; otherwise, where a monthly installment has been charged for a coverage period starting in the month of the payment date, on or before that date, it is monthly; and where none has been, it is the frequency the enrollment has elected. At the frequency in force an installment period is the calendar year for an annual installment and the calendar quarter for a quarterly one.'
    per_c: 'A change of installment frequency takes effect from the next installment period, so an installment is owed at the frequency in force, the one installments are being charged at: where an annual installment has been charged for a coverage period starting in the calendar year of the payment date, on or before that date, the frequency in force is annual; otherwise, where a quarterly installment has been charged for a coverage period starting in the calendar quarter of the payment date, on or before that date, it is quarterly; otherwise, where a monthly installment has been charged for a coverage period starting in the month of the payment date, on or before that date, it is monthly; and where none has been, it is the frequency the enrollment has elected. At the frequency in force an installment period is the calendar year for an annual installment and the calendar quarter for a quarterly one.'
    scope_c: It covers a fee-bearing enrollment (fee_bearing true) that took effect in the plan year that contains the payment date, whose elected payment method is a single card payment (card_single) or a check and whose frequency in force is quarterly or annual, so that every installment whose coverage period has begun belongs to that plan year; for any other enrollment this policy settles nothing.
    ended_c: 'An enrollment''s standing in this policy is its lifecycle status: it has ended when its status is disenrolled_voluntary, disenrolled_nonpayment, terminated_ineligible or transferred_out, whatever the payment date, and its last day of coverage is then the disenrollment date on its record; it is active when its status is active; and it is awaiting activation when its status is applied. A rejected enrollment owes no fee and is outside this policy.'
    latest_amt: 'This policy settles the amount a beneficiary pays by one-time card to clear the past-due balance of a fee-bearing TRICARE Select enrollment whose installments are quarterly or annual and whose elected payment method is a single card payment or a check; the card payment is recorded against one installment, called here the latest installment: where the enrollment has ended, the charges whose coverage period starts in the installment period (the calendar quarter for quarterly installments, the calendar year for annual ones) that contains the last day of coverage, no later than the month containing that day and no later than the payment date; otherwise the charges made for coverage periods starting in the installment period that contains the payment date, on or before that date.'
    n_begun: Where only one installment's coverage period has begun on the enrollment, so that it is the enrollment's first, and the enrollment took effect after the first month of that installment's calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is the annual fee for the whole period, one quarter of it for a quarterly installment and all of it for an annual one; each figure is rounded to the cent.
    claims_c: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a card-paid installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
    chg_begun_c: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a card-paid installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
    paid_c: 'Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received.'
    total_c: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a card-paid installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
    annual_fee: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a card-paid installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
    first_months: Where only one installment's coverage period has begun on the enrollment, so that it is the enrollment's first, and the enrollment took effect after the first month of that installment's calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is the annual fee for the whole period, one quarter of it for a quarterly installment and all of it for an annual one; each figure is rounded to the cent.
    end_months: Where only one installment's coverage period has begun on the enrollment, so that it is the enrollment's first, and the enrollment took effect after the first month of that installment's calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is the annual fee for the whole period, one quarter of it for a quarterly installment and all of it for an annual one; each figure is rounded to the cent.
    installment: Where only one installment's coverage period has begun on the enrollment, so that it is the enrollment's first, and the enrollment took effect after the first month of that installment's calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is the annual fee for the whole period, one quarter of it for a quarterly installment and all of it for an annual one; each figure is rounded to the cent.
    after_end: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts. The earlier counted charges are the charges that count other than those of the latest installment.'
    first_amt: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts. The earlier counted charges are the charges that count other than those of the latest installment.'
    first_in_l_c: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts. The earlier counted charges are the charges that count other than those of the latest installment.'
    earlier_c: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts. The earlier counted charges are the charges that count other than those of the latest installment.'
    left_c: 'Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received.'
    received: 'Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received.'
    unsettled: The card payment is the installment owed less what counts as already received, plus any part of the earlier counted charges the payments did not settle, rounded to the cent and never below zero.
    result: The card payment is the installment owed less what counts as already received, plus any part of the earlier counted charges the payments did not settle, rounded to the cent and never below zero.
  factors:
  - id: card_fee_level
    effect: parameter
    decides: annual_fee
    bindings:
    - claims_c
    - total_c
    - annual_fee
    ladder: &id006
    - when: the fee arrangement is individual (one member enrolled, so the family's catastrophic total is the enrollee's own) and that total for the plan year has reached catastrophic_cap_family
      value: '0'
    - when: the fee arrangement is individual
      value: P('annual_fee_individual')
    - when: otherwise (two or more members enrolled, family arrangement)
      value: P('annual_fee_family')
    baseline:
      annual_fee: P('annual_fee_family')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: card_installment_owed
    effect: method
    decides: installment
    bindings:
    - n_begun
    - first_months
    - end_months
    - installment
    ladder:
    - when: only one installment has begun on the enrollment (its first) and the enrollment took effect after the first month of that installment's period
      method: one twelfth of the annual fee for each month from the effective month through the period end
    - when: the enrollment ended before the last month of the installment period that contains its last day of coverage
      method: one twelfth of the annual fee for each month from that period's start through the month of the last day of coverage
    - when: otherwise
      method: the annual fee for the whole period
    baseline:
      installment: RND(annual_fee * per_c / K('monthly_divisor'), 2)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: card_counted_charges
    effect: method
    decides: earlier_c
    bindings:
    - ended_c
    - after_end
    - first_amt
    - first_in_l_c
    - earlier_c
    ladder:
    - when: the enrollment has ended
      method: count the charges whose period began in or before the month of the last day of coverage, other than the latest installment
    - when: the enrollment is active
      method: count the charges whose period has begun, other than the latest installment
    - when: otherwise (awaiting activation)
      method: count only the first installment, and nothing where it is the latest installment
    baseline:
      earlier_c: RND(first_amt - (first_amt if first_in_l_c else 0), 2)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: card_already_received
    effect: parameter
    decides: received
    bindings:
    - paid_c
    - left_c
    - received
    ladder:
    - when: the payments left once the earlier counted charges are settled reach the installment owed
      value: installment
    - when: some but less is left
      value: left_c
    - when: otherwise
      value: '0'
    baseline:
      received: '0'
    evidence:
    - history
    cross_difficulty: null
