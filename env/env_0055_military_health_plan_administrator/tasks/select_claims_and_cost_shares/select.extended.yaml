    note: 'The attending share is decided from the patient''s Inpatient Mental Health Authorization in the referrals and authorizations product: its status and the days it authorizes.'
  compute:
  - scope_p: (F('fee_bearing') == True and F('fee_coverage_type') == 'individual') and (MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12) and (XCOUNT('prime','prime_enrollments') == 0 or (XCOUNT('prime','prime_enrollments') == 1 and MONTHS(K('plan_year_anchor'), CFIELD('prime','enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12))
  - rev_p: LATEST('select_claim_lines','reversed_claim_line_id', date_field='posted_date', event_type='select_claim_line_reverse', inpatient_days=0, reversal_reason='appeal_overturned')
  - sd: LATEST('select_claim_lines','service_date', date_field='posted_date', select_claim_line_id=rev_p)
  - svc_class: LATEST('select_claim_lines','service_class', date_field='posted_date', select_claim_line_id=rev_p)
  - net_status_p: LATEST('select_claim_lines','provider_network_status', date_field='posted_date', select_claim_line_id=rev_p)
  - allowed_p: LATEST('select_claim_lines','allowed_amount', date_field='posted_date', select_claim_line_id=rev_p)
  - billed_p: LATEST('select_claim_lines','billed_amount', date_field='posted_date', select_claim_line_id=rev_p)
  - ohi_paid_p: LATEST('select_claim_lines','ohi_paid_amount', date_field='posted_date', select_claim_line_id=rev_p)
  - ohi_base: 0 if (F('ohi_on_file') and ohi_paid_p >= allowed_p) else (allowed_p - ohi_paid_p if (F('ohi_on_file') and ohi_paid_p > 0) else allowed_p)
  - stay_days: LATEST('select_claim_lines','inpatient_days', date_field='posted_date', event_type='select_claim_line_reverse', service_class='inpatient_mental_health_admission', service_date=sd) or LATEST('select_claim_lines','inpatient_days', date_field='posted_date', event_type='select_claim_line_post', service_class='inpatient_mental_health_admission', service_date=sd) or 0
  - auth_ok_p: CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', valid_from=sd) == 'approved'
  - auth_days_p: CFIELD('referral','units_authorized', variant_name='Inpatient Mental Health Authorization', valid_from=sd, status='approved')
  - att_share: auth_days_p / stay_days if (auth_ok_p and stay_days > auth_days_p) else (0 if (stay_days > 0 and not auth_ok_p) else 1)
  - base_amt: RND(ohi_base * att_share, 2)
  - ded_met: SUM('select_claim_lines','deductible_applied', event_type='select_claim_line_post') - SUM('select_claim_lines','deductible_applied', event_type='select_claim_line_reverse')
  - ded_taken: 0 if (svc_class in P('deductible_exempt_service_classes') or (svc_class == 'preventive_care' and net_status_p == 'network')) else (RND(MX(0, P('deductible_individual') - ded_met), 2) if P('deductible_individual') - ded_met < base_amt else base_amt)
  - left_p: RND(base_amt - ded_taken, 2)
  - cs_part: RND(left_p * P('non_network_outpatient_cost_share_pct') / 100, 2) if net_status_p != 'network' else (RND(left_p * P('network_dme_cost_share_pct') / 100, 2) if svc_class == 'durable_medical_equipment' else (MN(P('network_copay_' + svc_class), left_p) if (svc_class == 'preventive_care' or P('network_cost_share_basis') == 'fixed_copayment') else RND(left_p * P('network_outpatient_cost_share_pct') / 100, 2)))
  - uncapped_p: RND(ded_taken + cs_part, 2)
  - claims_p: SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_post') - SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_reverse')
  - chg_begun_p: SUM('select_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - paid_p: SUM('select_fee_ledger','amount', event_type='select_fee_payment')
  - plan_change_p: CFIELD('prime','status') == 'disenrolled_voluntary' and DAYS(CFIELD('prime','disenrollment_date'), F('enrollment_effective_date')) == 1
  - pr_cs_p: XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_reverse') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post', pos_applied=True)
  - pr_chg_begun_p: XSUM('prime','prime_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='prime_fee_charge')
  - pr_paid_p: XSUM('prime','prime_fee_ledger','amount', event_type='prime_fee_payment')
  - pr_amt_p: RND(pr_cs_p + MN(pr_chg_begun_p, pr_paid_p), 2)
  - carry_p: P('catastrophic_cap_family') if (plan_change_p and pr_amt_p >= P('catastrophic_cap_family')) else (pr_amt_p if plan_change_p else 0)
  - room_p: MX(0, P('catastrophic_cap_family') - claims_p - (MN(chg_begun_p, paid_p) if P('fees_count_toward_catastrophic_cap') else 0) - carry_p)
  - liab_p: RND(MN(uncapped_p, room_p), 2)
  - amt_prim: RND(allowed_p * att_share, 2)
  - primary_p: RND(MX(0, amt_prim - liab_p), 2)
  - tricare_p: RND(MN(primary_p, MX(0, (MN(billed_p, allowed_p * (1 + P('nonparticipating_balance_billing_limit_pct') / 100)) - ohi_paid_p) * att_share - liab_p)), 2) if (F('ohi_on_file') and ohi_paid_p > 0 and net_status_p == 'non_network_nonparticipating') else (RND(MX(0, (allowed_p - ohi_paid_p) * att_share - liab_p), 2) if (F('ohi_on_file') and ohi_paid_p > 0) else primary_p)
  - result: tricare_p if scope_p else None
  compute_basis:
    scope_p: It covers the corrected line of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee's own Select enrollment carrying the family's fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family's deductible and catastrophic totals are the enrollee's own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family's Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design.
    rev_p: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select professional or other outpatient claim line whose earlier adjudication stands reversed: the line re-adjudicated is the line with no inpatient days named by the enrollment''s most recent reversal of such a line made to effectuate an overturned appeal, and its service date, provider network relationship, service class, billed and allowed amounts and other-insurance payment are read from that reversed line.'
    sd: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select professional or other outpatient claim line whose earlier adjudication stands reversed: the line re-adjudicated is the line with no inpatient days named by the enrollment''s most recent reversal of such a line made to effectuate an overturned appeal, and its service date, provider network relationship, service class, billed and allowed amounts and other-insurance payment are read from that reversed line.'
    svc_class: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select professional or other outpatient claim line whose earlier adjudication stands reversed: the line re-adjudicated is the line with no inpatient days named by the enrollment''s most recent reversal of such a line made to effectuate an overturned appeal, and its service date, provider network relationship, service class, billed and allowed amounts and other-insurance payment are read from that reversed line.'
    net_status_p: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select professional or other outpatient claim line whose earlier adjudication stands reversed: the line re-adjudicated is the line with no inpatient days named by the enrollment''s most recent reversal of such a line made to effectuate an overturned appeal, and its service date, provider network relationship, service class, billed and allowed amounts and other-insurance payment are read from that reversed line.'
    allowed_p: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select professional or other outpatient claim line whose earlier adjudication stands reversed: the line re-adjudicated is the line with no inpatient days named by the enrollment''s most recent reversal of such a line made to effectuate an overturned appeal, and its service date, provider network relationship, service class, billed and allowed amounts and other-insurance payment are read from that reversed line.'
    billed_p: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select professional or other outpatient claim line whose earlier adjudication stands reversed: the line re-adjudicated is the line with no inpatient days named by the enrollment''s most recent reversal of such a line made to effectuate an overturned appeal, and its service date, provider network relationship, service class, billed and allowed amounts and other-insurance payment are read from that reversed line.'
    ohi_paid_p: Where other health insurance is on file for the enrollee and the other insurer paid at least the allowed amount of the line, nothing of a corrected outpatient line is left to cost-share; where other health insurance is on file and the other insurer paid some but less than the allowed amount, the amount of a corrected outpatient line left to cost-share is the allowed amount less that payment; otherwise the amount left to cost-share is the allowed amount.
    ohi_base: Where other health insurance is on file for the enrollee and the other insurer paid at least the allowed amount of the line, nothing of a corrected outpatient line is left to cost-share; where other health insurance is on file and the other insurer paid some but less than the allowed amount, the amount of a corrected outpatient line left to cost-share is the allowed amount less that payment; otherwise the amount left to cost-share is the allowed amount.
    stay_days: Where the corrected outpatient line's service date is the admission date of an inpatient mental health stay on the enrollment and an approved Inpatient Mental Health Authorization starting that day authorizes fewer days than the stay billed, the attending share is the authorized days divided by the billed days of the stay, read from the reversal of that stay's earlier adjudication or, where the stay was never reversed, from its posted line; where such a stay billed days and no approved Inpatient Mental Health Authorization starting that day is on file, the attending share is zero; otherwise the attending share is one.
    auth_ok_p: Where the corrected outpatient line's service date is the admission date of an inpatient mental health stay on the enrollment and an approved Inpatient Mental Health Authorization starting that day authorizes fewer days than the stay billed, the attending share is the authorized days divided by the billed days of the stay, read from the reversal of that stay's earlier adjudication or, where the stay was never reversed, from its posted line; where such a stay billed days and no approved Inpatient Mental Health Authorization starting that day is on file, the attending share is zero; otherwise the attending share is one.
    auth_days_p: Where the corrected outpatient line's service date is the admission date of an inpatient mental health stay on the enrollment and an approved Inpatient Mental Health Authorization starting that day authorizes fewer days than the stay billed, the attending share is the authorized days divided by the billed days of the stay, read from the reversal of that stay's earlier adjudication or, where the stay was never reversed, from its posted line; where such a stay billed days and no approved Inpatient Mental Health Authorization starting that day is on file, the attending share is zero; otherwise the attending share is one.
    att_share: Where the corrected outpatient line's service date is the admission date of an inpatient mental health stay on the enrollment and an approved Inpatient Mental Health Authorization starting that day authorizes fewer days than the stay billed, the attending share is the authorized days divided by the billed days of the stay, read from the reversal of that stay's earlier adjudication or, where the stay was never reversed, from its posted line; where such a stay billed days and no approved Inpatient Mental Health Authorization starting that day is on file, the attending share is zero; otherwise the attending share is one.
    base_amt: The amount a corrected outpatient line is cost-shared on is the amount left to cost-share times the attending share, rounded to the cent.
    ded_met: The deductible already met for a corrected outpatient line is the deductible applied on the enrollment's claim lines less the deductible their reversals withdrew.
    ded_taken: Where the corrected outpatient line's service class is in deductible_exempt_service_classes or the line is network preventive care, it takes no deductible; where deductible_individual less the deductible already met is less than the amount cost-shared, it takes that remainder, never below zero, rounded to the cent; otherwise it takes the whole amount cost-shared.
    left_p: Where the provider was not in the network on the service date, the cost share on a corrected outpatient line is non_network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent; where the provider was in the network and the line is durable medical equipment, it is network_dme_cost_share_pct of the amount left, rounded to the cent; where the provider was in the network and the line is preventive care or the tier's network_cost_share_basis is fixed_copayment, it is the tier's network copayment for the line's service class, never more than the amount left; otherwise it is network_outpatient_cost_share_pct of the amount left, rounded to the cent.
    cs_part: Where the provider was not in the network on the service date, the cost share on a corrected outpatient line is non_network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent; where the provider was in the network and the line is durable medical equipment, it is network_dme_cost_share_pct of the amount left, rounded to the cent; where the provider was in the network and the line is preventive care or the tier's network_cost_share_basis is fixed_copayment, it is the tier's network copayment for the line's service class, never more than the amount left; otherwise it is network_outpatient_cost_share_pct of the amount left, rounded to the cent.
    uncapped_p: 'The beneficiary liability on the corrected outpatient line is the deductible applied plus the cost share, rounded to the cent, and TRICARE pays as primary payer: the allowed amount less that liability, never below zero.'
    claims_p: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    chg_begun_p: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    paid_p: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    plan_change_p: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_cs_p: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_chg_begun_p: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_paid_p: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_amt_p: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    carry_p: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    room_p: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    liab_p: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    amt_prim: What TRICARE would pay as primary payer on a corrected outpatient line is the allowed amount times the attending share, less the beneficiary liability, never below zero.
    primary_p: What TRICARE would pay as primary payer on a corrected outpatient line is the allowed amount times the attending share, less the beneficiary liability, never below zero.
    tricare_p: 'With other health insurance on file, the deductible and cost share of a corrected outpatient line are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
    result: 'With other health insurance on file, the deductible and cost share of a corrected outpatient line are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  factors:
  - id: outpatient_other_insurance
    effect: parameter
    decides: ohi_base
    bindings:
    - ohi_paid_p
    - ohi_base
    ladder:
    - when: other health insurance is on file and the other insurer paid at least the allowed amount
      value: '0'
    - when: other health insurance is on file and the other insurer paid some but less than the allowed amount
      value: allowed_p - ohi_paid_p
    - when: otherwise
      value: allowed_p
    baseline:
      ohi_base: allowed_p
    evidence:
    - history
    cross_difficulty: null
  - id: attending_share
    effect: parameter
    decides: att_share
    bindings:
    - stay_days
    - auth_ok_p
    - auth_days_p
    - att_share
    ladder:
    - when: the line's service date is the admission date of an inpatient mental health stay and an approved Inpatient Mental Health Authorization starting that day authorizes fewer days than the stay billed
      value: auth_days_p / stay_days
    - when: such a stay billed days and no approved authorization starting that day is on file
      value: '0'
    - when: otherwise
      value: '1'
    baseline:
      att_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: referral
  - id: outpatient_deductible_taken
    effect: parameter
    decides: ded_taken
    bindings:
    - ded_met
    - ded_taken
    ladder:
    - when: the service class is in deductible_exempt_service_classes or the line is network preventive care
      value: '0'
    - when: deductible_individual less the deductible already met is less than the amount cost-shared
      value: that remainder, never below zero
    - when: otherwise
      value: the whole amount cost-shared
    baseline:
      ded_taken: RND(MN(base_amt, P('deductible_individual')), 2)
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: outpatient_cost_share_basis
    effect: method
    decides: cs_part
    bindings:
    - net_status_p
    - left_p
    - cs_part
    ladder: &id004
    - when: the provider was not in the network on the service date
      method: non_network_outpatient_cost_share_pct of the amount left once the deductible is taken off
    - when: the provider was in the network and the line is durable medical equipment
      method: network_dme_cost_share_pct of the amount left once the deductible is taken off
    - when: the provider was in the network and the line is preventive care or the tier's network_cost_share_basis is fixed_copayment
      method: the tier's network copayment for the service class, never more than the amount left
    - when: otherwise
      method: network_outpatient_cost_share_pct of the amount left once the deductible is taken off
    baseline:
      cs_part: RND(left_p * P('network_outpatient_cost_share_pct') / 100, 2)
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: outpatient_payer_coordination
    effect: method
    decides: tricare_p
    bindings:
    - billed_p
    - primary_p
    - tricare_p
    ladder: &id003
    - when: other health insurance is on file, the other insurer paid on the line and the provider is non-network nonparticipating
      method: the lesser of what TRICARE would pay as primary and the charge the provider may bill (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer's payment and the beneficiary liability
    - when: other health insurance is on file and the other insurer paid on the line
      method: the allowed amount less the other insurer's payment and the beneficiary liability
    - when: otherwise
      method: what TRICARE would pay as primary payer
    baseline:
      tricare_p: primary_p
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The amount a corrected outpatient line is cost-shared on is the reversed line''s allowed amount. The corrected outpatient line applies to the deductible the smaller of that amount and deductible_individual. Its cost share is network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent. The beneficiary liability on the corrected outpatient line is the deductible applied plus the cost share, rounded to the cent, and TRICARE pays as primary payer: the allowed amount less that liability, never below zero. The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states. Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    params:
    - deductible_individual
    - network_outpatient_cost_share_pct
    - catastrophic_cap_family
  inputs:
    history:
    - table: select_claim_lines
      aggregate: latest
      field: reversed_claim_line_id
      filters:
        event_type: select_claim_line_reverse
    - table: select_claim_lines
      aggregate: sum
      field: deductible_applied
      filters:
        event_type: select_claim_line_post
    - table: select_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: select_claim_line_post
    - table: select_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: select_fee_payment
    - category: prime
      table: prime_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: prime_claim_line_post
    - category: referral
      table: referral_authorizations
      aggregate: latest
      field: units_authorized
      filters:
        variant_name: Inpatient Mental Health Authorization
    cross_category:
    - prime
    - referral
- id: select_ext_inpatient_stay_correction
  base_policy_refs: *id001
  overwrite:
  - base_policy: select_agg_family_accumulators
    superseded_clause: Prime cost shares, point-of-service charges and premium-based plan costs are separate accumulators and never count toward the Select family totals.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_catastrophic_cap
    superseded_clause: Point-of-service charges, Prime cost shares, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_ohi_coordination
    superseded_clause: With other health insurance on file, the line's deductible and cost share are figured on the allowed amount net of the other insurer's payment, and TRICARE pays no more than the allowed amount less the other insurer's payment and the beneficiary liability.
    replaced_by: 'With other health insurance on file, the deductible and cost share of a corrected stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  trigger: state_due
  subject:
  - select_claim_line_post
  computes: tricare_paid_amount
  target_tool: post_select_inpatient_stay_a4ca4c06
  params:
    plan_year_anchor: '2000-01-01'
    months_per_year: 12
    ledger_months: 600
  rule: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select inpatient facility stay whose earlier adjudication stands reversed: the stay re-adjudicated is the stay line named by the enrollment''s most recent reversal, made to effectuate an overturned appeal, of an inpatient mental health stay or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and other-insurance payment are read from that reversed line. It covers the corrected stay of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee''s own Select enrollment carrying the family''s fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family''s deductible and catastrophic totals are the enrollee''s own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family''s Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design. The TRICARE payment on a corrected stay is fixed only after every professional line billed for the same admission date that stands reversed carries its corrected adjudication. The TRICARE payment on a corrected stay is not fixed until the fee account shows no past-due balance on the installments of the plan year whose coverage period has begun. Every billed inpatient day of a corrected stay is covered. The beneficiary liability on a corrected stay is inpatient_network_admission_copay, charged once for the stay. TRICARE pays as primary payer on a corrected stay: the payable allowed amount less the beneficiary liability that amount carries, rounded to the cent and never below zero. A corrected stay with no covered day carries no beneficiary liability. Where an approved Inpatient Mental Health Authorization for the patient at the stay''s facility starts on the admission date and authorizes fewer days than the stay billed, the covered days of a corrected stay are the days it authorizes; where the stay''s service class is in prior_authorization_required_service_classes and no such approved authorization is on file, a corrected stay has no covered day; otherwise every billed inpatient day of a corrected stay is covered. An inpatient mental health stay is priced by the day, so its payable allowed amount is the reversed line''s allowed amount times the covered days divided by the billed days, rounded to the cent; any other corrected stay is payable at the reversed line''s full allowed amount when it has a covered day and not at all otherwise. With other health insurance on file, the amount a corrected stay is cost-shared on is its payable allowed amount less the other insurer''s payment, never below zero; otherwise it is the payable allowed amount. Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a corrected stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent. Where the tier''s fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a corrected stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added. Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total. Where the family catastrophic total of a corrected stay (the liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has already reached catastrophic_cap_family, a corrected stay carries no beneficiary liability; where the room left under catastrophic_cap_family once that total is taken away is less than the liability figured under the inpatient basis, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured under the inpatient basis. What TRICARE would pay as primary payer on a corrected stay is its payable allowed amount less the beneficiary liability, never below zero. With other health insurance on file, the deductible and cost share of a corrected stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  prerequisite:
  - problem: select_ext_professional_line_correction
    kind: value_input
    gate: claims_s
    form: state
    policy_source: The TRICARE payment on a corrected stay is fixed only after every professional line billed for the same admission date that stands reversed carries its corrected adjudication.
    condition: Every reversed select_claim_lines entry with no inpatient days whose service_date equals the stay's admission date has a later select_claim_line_post entry on the same claim_number carrying its corrected adjudication.
    resolved_by: post_select_professional_line_96ff63a5
    effect: Once the corrected professional line is posted, its beneficiary liability enters the liability posted on the enrollment's claim lines, so claims_s rises by that liability and the room under the catastrophic cap shrinks by it.
  - problem: select_ext_card_installment_payment
    kind: value_input
    gate: fees_counted
    form: state
    policy_source: The TRICARE payment on a corrected stay is not fixed until the fee account shows no past-due balance on the installments of the plan year whose coverage period has begun.
    condition: The select_fee_charge entries of the plan year whose coverage_period_start is on or before the adjudication date are covered by the select_fee_payment entries on the account applied oldest first (an installment of an ended enrollment counted for the months through the month of its last day of coverage), leaving no past-due balance.
    resolved_by: pay_select_installment_by_card_fa3a0d38
    effect: Once the card payment is posted, the payments on the fee account grow by the amount paid, so fees_counted rises by it and the room under the catastrophic cap shrinks by the same amount.
  cross_category:
  - *id002
  - category: referral
    as: branch
    reads:
    - status
    - units_authorized
    - variant_name
    - servicing_provider_id
    - valid_from
    note: 'The covered days of the stay are decided from the patient''s Inpatient Mental Health Authorization at the facility in the referrals and authorizations product: its status and the days it authorizes.'
  compute:
  - scope_s: (F('fee_bearing') == True and F('fee_coverage_type') == 'individual') and (MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12) and (XCOUNT('prime','prime_enrollments') == 0 or (XCOUNT('prime','prime_enrollments') == 1 and MONTHS(K('plan_year_anchor'), CFIELD('prime','enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12))
  - rev_mh: LATEST('select_claim_lines','reversed_claim_line_id', date_field='posted_date', event_type='select_claim_line_reverse', service_class='inpatient_mental_health_admission', reversal_reason='appeal_overturned')
  - rev_acute: LATEST('select_claim_lines','reversed_claim_line_id', date_field='posted_date', event_type='select_claim_line_reverse', service_class='inpatient_admission', reversal_reason='appeal_overturned')
  - rev_line: rev_mh if rev_mh else rev_acute
  - adm_class: LATEST('select_claim_lines','service_class', date_field='posted_date', select_claim_line_id=rev_line)
  - adm_date: LATEST('select_claim_lines','service_date', date_field='posted_date', select_claim_line_id=rev_line)
  - facility: LATEST('select_claim_lines','provider_id', date_field='posted_date', select_claim_line_id=rev_line)
  - net_status: LATEST('select_claim_lines','provider_network_status', date_field='posted_date', select_claim_line_id=rev_line)
  - billed_days: LATEST('select_claim_lines','inpatient_days', date_field='posted_date', select_claim_line_id=rev_line)
  - billed_amt: LATEST('select_claim_lines','billed_amount', date_field='posted_date', select_claim_line_id=rev_line)
  - allowed: LATEST('select_claim_lines','allowed_amount', date_field='posted_date', select_claim_line_id=rev_line)
  - ohi_paid: LATEST('select_claim_lines','ohi_paid_amount', date_field='posted_date', select_claim_line_id=rev_line)
  - auth_ok: CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', servicing_provider_id=facility, valid_from=adm_date) == 'approved'
  - auth_days: CFIELD('referral','units_authorized', variant_name='Inpatient Mental Health Authorization', servicing_provider_id=facility, valid_from=adm_date, status='approved')
  - needs_auth: adm_class in P('prior_authorization_required_service_classes')
  - cov_days: auth_days if (auth_ok and auth_days < billed_days) else (0 if (needs_auth and not auth_ok) else billed_days)
  - cov_share: cov_days / billed_days if adm_class == 'inpatient_mental_health_admission' else (1 if cov_days > 0 else 0)
  - cov_allowed: RND(allowed * cov_share, 2)
  - net_base: MX(0, RND(cov_allowed - ohi_paid, 2)) if F('ohi_on_file') else cov_allowed
  - claims_s: SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_post') - SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_reverse')
  - chg_begun_s: SUM('select_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - paid_s: SUM('select_fee_ledger','amount', event_type='select_fee_payment')
  - fees_counted: chg_begun_s if (P('fees_count_toward_catastrophic_cap') and paid_s >= chg_begun_s) else (paid_s if (P('fees_count_toward_catastrophic_cap') and paid_s > 0) else 0)
  - plan_change_s: CFIELD('prime','status') == 'disenrolled_voluntary' and DAYS(CFIELD('prime','disenrollment_date'), F('enrollment_effective_date')) == 1
  - pr_cs_s: XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_reverse') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post', pos_applied=True)
  - pr_chg_begun_s: XSUM('prime','prime_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='prime_fee_charge')
  - pr_paid_s: XSUM('prime','prime_fee_ledger','amount', event_type='prime_fee_payment')
  - pr_amt_s: RND(pr_cs_s + MN(pr_chg_begun_s, pr_paid_s), 2)
  - carry_s: P('catastrophic_cap_family') if (plan_change_s and pr_amt_s >= P('catastrophic_cap_family')) else (pr_amt_s if plan_change_s else 0)
  - basis: P('inpatient_non_network_basis') if net_status != 'network' else P('inpatient_network_basis')
  - daily: P('inpatient_non_network_daily_charge') if net_status != 'network' else P('inpatient_network_daily_charge')
  - pctv: P('inpatient_non_network_pct') if net_status != 'network' else P('inpatient_network_pct_of_allowed')
  - uncapped: 0 if cov_days == 0 else (RND(MN(daily * cov_days, RND(net_base * pctv / 100, 2)), 2) if basis == 'lesser_of_per_diem_or_pct' else (RND(MX(daily * cov_days, P('inpatient_network_minimum_charge')), 2) if basis == 'per_diem_with_minimum' else (RND(net_base * pctv / 100, 2) if basis == 'percent_of_allowed' else P('inpatient_network_admission_copay'))))
  - room: RND(P('catastrophic_cap_family') - claims_s - fees_counted - carry_s, 2)
  - liability: 0 if room <= 0 else (room if room < uncapped else uncapped)
  - primary_s: RND(MX(0, cov_allowed - liability), 2)
  - billed_cov: RND(billed_amt * cov_share, 2)
  - tricare_s: RND(MN(primary_s, MX(0, (MN(billed_cov, cov_allowed * (1 + P('nonparticipating_balance_billing_limit_pct') / 100)) - ohi_paid) * 1 - liability)), 2) if (F('ohi_on_file') and ohi_paid > 0 and net_status == 'non_network_nonparticipating') else (RND(MX(0, (cov_allowed - ohi_paid) * 1 - liability), 2) if (F('ohi_on_file') and ohi_paid > 0) else primary_s)
  - result: tricare_s if scope_s else None
