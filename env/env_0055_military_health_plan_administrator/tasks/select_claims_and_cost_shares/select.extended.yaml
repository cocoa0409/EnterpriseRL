  rule: 'This policy settles the TRICARE payment on the corrected adjudication of a TRICARE Select professional or other outpatient claim line whose earlier adjudication stands reversed: the line re-adjudicated is the line with no inpatient days named by the enrollment''s most recent reversal of such a line made to effectuate an overturned appeal, and its service date, provider network relationship, service class, billed and allowed amounts and other-insurance payment are read from that reversed line. It covers the corrected line of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee''s own Select enrollment carrying the family''s fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family''s deductible and catastrophic totals are the enrollee''s own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family''s Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design. A corrected outpatient line carries an authorization reference only where its service class is in prior_authorization_required_service_classes and an approved authorization for the patient covers its provider and service date; otherwise its prior_authorization_id is left empty. The amount a corrected outpatient line is cost-shared on is the reversed line''s allowed amount. The corrected outpatient line applies to the deductible the smaller of that amount and deductible_individual. Its cost share is network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent. The beneficiary liability on the corrected outpatient line is the deductible applied plus the cost share, rounded to the cent, and TRICARE pays as primary payer: the allowed amount less that liability, never below zero. The deductible already met for a corrected outpatient line is the deductible applied on the enrollment''s claim lines less the deductible their reversals withdrew. The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states. Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a corrected outpatient line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total. Where other health insurance is on file for the enrollee and the other insurer paid at least the allowed amount of the line, nothing of a corrected outpatient line is left to cost-share; where other health insurance is on file and the other insurer paid some but less than the allowed amount, the amount of a corrected outpatient line left to cost-share is the allowed amount less that payment; otherwise the amount left to cost-share is the allowed amount. Where the corrected outpatient line''s service date is the admission date of an inpatient mental health stay on the enrollment and an approved Inpatient Mental Health Authorization starting that day authorizes fewer days than the stay billed, the attending share is the authorized days divided by the billed days of the stay, read from the reversal of that stay''s earlier adjudication or, where the stay was never reversed, from its posted line; where such a stay billed days and no approved Inpatient Mental Health Authorization starting that day is on file, the attending share is zero; otherwise the attending share is one. The amount a corrected outpatient line is cost-shared on is the amount left to cost-share times the attending share, rounded to the cent. Where the corrected outpatient line''s service class is in deductible_exempt_service_classes or the line is network preventive care, it takes no deductible; where deductible_individual less the deductible already met is less than the amount cost-shared, it takes that remainder, never below zero, rounded to the cent; otherwise it takes the whole amount cost-shared. Where the provider was not in the network on the service date, the cost share on a corrected outpatient line is non_network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent; where the provider was in the network and the line is durable medical equipment, it is network_dme_cost_share_pct of the amount left, rounded to the cent; where the provider was in the network and the line is preventive care or the tier''s network_cost_share_basis is fixed_copayment, it is the tier''s network copayment for the line''s service class, never more than the amount left; otherwise it is network_outpatient_cost_share_pct of the amount left, rounded to the cent. What TRICARE would pay as primary payer on a corrected outpatient line is the allowed amount times the attending share, less the beneficiary liability, never below zero. With other health insurance on file, the deductible and cost share of a corrected outpatient line are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
