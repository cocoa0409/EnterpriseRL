# TRICARE Select enrollment charter for the Westbridge Military Health Services regional contract (TRICARE West Region).
# One holding = one beneficiary's TRICARE Select enrollment. Claims adjudicated under the enrollment book the
# beneficiary's deductible and cost share; deductibles and catastrophic caps aggregate across the sponsor family.

category: select
display_name: TRICARE Select

binding:
  holding_table: select_enrollments
  event_tables: [select_fee_ledger, select_claim_lines]
  intake_tables: [select_enrollment_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fee_balance_due: enrollment_fee_due}

lifecycle:
  states: [applied, active, rejected, disenrolled_voluntary, disenrolled_nonpayment, terminated_ineligible, transferred_out]
  transitions:
    - {from: applied, to: active, by: agent, means: The enrollment is processed - the DEERS eligibility and window checks pass and either the first installment is paid or the tier is fee-exempt - and coverage starts on the enrollment effective date.}
    - {from: applied, to: rejected, by: agent, means: The application cannot be processed because the beneficiary is not eligible for the requested Select tier or the application missed its enrollment window.}
    - {from: active, to: disenrolled_voluntary, by: user, means: The beneficiary (or the sponsor for a minor) confirms leaving TRICARE Select; the agent records the request as an intake and the beneficiary's confirmation ends coverage.}
    - {from: active, to: disenrolled_nonpayment, by: system, means: An enrollment-fee installment stayed unpaid past the grace period and the enrollment ends on its paid-through date.}
    - {from: active, to: terminated_ineligible, by: system, means: DEERS no longer shows the beneficiary as eligible for this Select tier (for example the sponsor retired, separated or the beneficiary aged out).}
    - {from: active, to: transferred_out, by: agent, means: The beneficiary moved outside the West Region and the enrollment was transferred to the gaining region's contractor.}
    - {from: disenrolled_nonpayment, to: active, by: agent, means: An approved Enrollment Reinstatement Review restores the enrollment without a break once every past-due installment is paid.}

accounts:
  - key: enrollment_fee_due
    unit: USD
    meaning: Enrollment fees owed on a fee-bearing Select enrollment - installment charges and refunds of credit balances increase it, payments and proration credits reduce it; a negative value is a credit owed to the beneficiary.
  - key: beneficiary_liability_accrued
    unit: USD
    meaning: Beneficiary out-of-pocket liability (deductible plus cost share) assessed on adjudicated Select claim lines of this enrollment, net of reversals.

parameter_schema:
  eligible_beneficiary_categories: list of DEERS beneficiary categories (customers.beneficiary_category values) that may hold this Select tier
  enrollment_group: string - sponsor entry group the tier serves (group_a = sponsor first entered uniformed service before 2018-01-01, group_b = on or after 2018-01-01)
  sponsor_pay_grade_band: string - the sponsor pay grades the tier serves (e1_to_e4, e5_and_above, any)
  qle_enrollment_window_days: integer, calendar days after a DEERS-recorded qualifying life event within which an enrollment application must be received
  open_season_enrollment_allowed: boolean - whether the beneficiary may elect this tier during open season
  qle_effective_date_rule: string - the date a qualifying-life-event enrollment takes effect
  open_season_effective_date_rule: string - the date an open-season election takes effect
  fee_exempt: boolean - whether the tier pays no enrollment fee
  annual_fee_individual: USD per calendar plan year, enrollment fee when exactly one family member is enrolled in Select under the sponsor
  annual_fee_family: USD per calendar plan year, enrollment fee when two or more family members are enrolled in Select under the sponsor
  allowed_payment_frequencies: list of installment frequencies the fee-bearing enrollment may use
  monthly_payment_methods: list of payment methods accepted for monthly installments
  annual_quarterly_payment_methods: list of payment methods accepted for annual and quarterly installments
  installment_due_rule: string - the day on which each installment is due
  nonpayment_grace_days: integer, calendar days after an installment's due date before nonpayment disenrollment applies (0 for fee-exempt tiers)
  delinquency_notice_day: integer, calendar day after the due date on which the delinquency letter is issued (0 for fee-exempt tiers)
  reinstatement_request_window_days: integer, calendar days after a nonpayment disenrollment within which an Enrollment Reinstatement Review may be filed (0 for fee-exempt tiers)
  fee_credit_eligible_reasons: list of adjustment reasons that earn a proration credit of prepaid enrollment fees
  fee_refund_issue_days: integer, calendar days after a credit balance arises within which the refund is issued (0 for fee-exempt tiers)
  fees_count_toward_catastrophic_cap: boolean - whether enrollment fees paid for the plan year count toward the family catastrophic cap
  deductible_individual: USD per calendar plan year, outpatient deductible per beneficiary
  deductible_family: USD per calendar plan year, outpatient deductible per sponsor family (two or more members)
  deductible_exempt_service_classes: list of service_class values the deductible never applies to
  catastrophic_cap_family: USD per calendar plan year, family catastrophic cap on enrollment fees, deductibles and cost shares
  network_cost_share_basis: string - percent_of_allowed (Group A) or fixed_copayment (Group B) for network outpatient care
  network_outpatient_cost_share_pct: percent of the allowed amount for network outpatient care after the deductible (0 where fixed copayments apply)
  non_network_outpatient_cost_share_pct: percent of the allowed amount for non-network outpatient care after the deductible
  network_copay_preventive_care: USD per visit, network preventive care
  network_copay_primary_care_visit: USD per visit, network primary care (fixed-copayment tiers; 0.00 where percent_of_allowed applies)
  network_copay_specialty_care_visit: USD per visit, network specialty care (fixed-copayment tiers)
  network_copay_urgent_care_visit: USD per visit, network urgent care (fixed-copayment tiers)
  network_copay_emergency_room_visit: USD per visit, network emergency room (fixed-copayment tiers)
  network_copay_ground_ambulance: USD per trip, network ground ambulance (fixed-copayment tiers)
  network_copay_outpatient_behavioral_health_individual: USD per visit, network outpatient behavioral health individual visit (fixed-copayment tiers)
  network_copay_outpatient_behavioral_health_group: USD per visit, network outpatient behavioral health group visit (fixed-copayment tiers)
  network_copay_rehabilitative_therapy_visit: USD per visit, network physical, occupational or speech therapy (fixed-copayment tiers)
  network_copay_ambulatory_surgery: USD per procedure, network ambulatory surgery (fixed-copayment tiers)
  network_dme_cost_share_pct: percent of the allowed amount, network durable medical equipment (fixed-copayment tiers; equals network_outpatient_cost_share_pct on percent tiers)
  inpatient_network_basis: string - per_diem_with_minimum, lesser_of_per_diem_or_pct or per_admission_copay for network inpatient stays
  inpatient_network_daily_charge: USD per inpatient day, network (0.00 where not used)
  inpatient_network_minimum_charge: USD per admission, network minimum charge (0.00 where not used)
  inpatient_network_admission_copay: USD per admission, network (0.00 where not used)
  inpatient_network_pct_of_allowed: percent of the facility allowed amount used in the lesser-of comparison (0 where not used)
  inpatient_non_network_basis: string - per_diem_with_minimum, lesser_of_per_diem_or_pct or percent_of_allowed for non-network inpatient stays
  inpatient_non_network_daily_charge: USD per inpatient day, non-network (0.00 where not used)
  inpatient_non_network_pct: percent of the facility allowed amount, non-network (0 where not used)
  inpatient_deductible_applies: boolean - whether the outpatient deductible also applies to inpatient facility charges
  nonparticipating_balance_billing_limit_pct: percent above the allowed amount a nonparticipating provider may bill the beneficiary
  prior_authorization_required_service_classes: list of service_class values that need an approved authorization to be payable
  specialty_referral_required: boolean - whether specialty care needs a PCM referral
  routine_eye_exam_interval_months: integer, months between covered routine eye exams (0 = routine eye exams not covered)
  claim_filing_deadline_days: integer, calendar days after the date of service (or inpatient discharge) within which a claim must be received
  tricare_secondary_to_ohi: boolean - whether TRICARE pays after other health insurance
  region_transfer_allowed: boolean - whether the enrollment may be transferred to another region's contractor on a move

