  compute:
  - scope_o: (F('fee_bearing') == True and F('fee_coverage_type') == 'individual') and (MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12) and (XCOUNT('prime','prime_enrollments') == 0 or (XCOUNT('prime','prime_enrollments') == 1 and MONTHS(K('plan_year_anchor'), CFIELD('prime','enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12))
  - rev_o: LATEST('select_claim_lines','reversed_claim_line_id', date_field='posted_date', event_type='select_claim_line_reverse', inpatient_days=0, reversal_reason='ohi_retroactive')
  - sd_o: LATEST('select_claim_lines','service_date', date_field='posted_date', select_claim_line_id=rev_o)
  - class_o: LATEST('select_claim_lines','service_class', date_field='posted_date', select_claim_line_id=rev_o)
  - net_o: LATEST('select_claim_lines','provider_network_status', date_field='posted_date', select_claim_line_id=rev_o)
  - allowed_o: LATEST('select_claim_lines','allowed_amount', date_field='posted_date', select_claim_line_id=rev_o)
  - billed_o: LATEST('select_claim_lines','billed_amount', date_field='posted_date', select_claim_line_id=rev_o)
  - ohi_paid_o: LATEST('select_claim_lines','ohi_paid_amount', date_field='posted_date', select_claim_line_id=rev_o)
  - ohi_take_o: ohi_paid_o if (F('ohi_on_file') and 0 < ohi_paid_o < allowed_o) else (allowed_o if (F('ohi_on_file') and ohi_paid_o >= allowed_o) else 0)
  - base_o: MX(0, allowed_o - ohi_take_o)
  - mh_stay_o: COUNT('select_claim_lines', event_type='select_claim_line_post', service_class='inpatient_mental_health_admission', service_date=sd_o)
  - auth_ok_o: CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', valid_from=sd_o) == 'approved' or CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', valid_from=sd_o) == 'exhausted'
  - auth_days_o: CFIELD('referral','units_authorized', variant_name='Inpatient Mental Health Authorization', valid_from=sd_o)
  - req_days_o: CFIELD('referral','units_requested', variant_name='Inpatient Mental Health Authorization', valid_from=sd_o)
  - att_o: auth_days_o / req_days_o if (mh_stay_o > 0 and auth_ok_o and req_days_o > auth_days_o) else (0 if (mh_stay_o > 0 and not auth_ok_o) else 1)
  - amt_o: RND(base_o * att_o, 2)
  - ded_met_o: SUM('select_claim_lines','deductible_applied', event_type='select_claim_line_post') - SUM('select_claim_lines','deductible_applied', event_type='select_claim_line_reverse')
  - ded_o: 0 if (class_o in P('deductible_exempt_service_classes') or (class_o == 'preventive_care' and net_o == 'network')) else (RND(MX(0, P('deductible_individual') - ded_met_o), 2) if P('deductible_individual') - ded_met_o < amt_o else amt_o)
  - left_o: RND(amt_o - ded_o, 2)
  - cs_o: RND(left_o * P('non_network_outpatient_cost_share_pct') / 100, 2) if net_o != 'network' else (RND(left_o * P('network_dme_cost_share_pct') / 100, 2) if class_o == 'durable_medical_equipment' else (MN(P('network_copay_' + class_o), left_o) if (class_o == 'preventive_care' or P('network_cost_share_basis') == 'fixed_copayment') else RND(left_o * P('network_outpatient_cost_share_pct') / 100, 2)))
  - uncapped_o: RND(ded_o + cs_o, 2)
  - claims_o: SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_post') - SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_reverse')
  - chg_begun_o: SUM('select_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - paid_o: SUM('select_fee_ledger','amount', event_type='select_fee_payment')
  - plan_change_o: CFIELD('prime','status') == 'disenrolled_voluntary' and DAYS(CFIELD('prime','disenrollment_date'), F('enrollment_effective_date')) == 1
  - pr_cs_o: XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_reverse') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post', pos_applied=True)
  - pr_chg_begun_o: XSUM('prime','prime_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='prime_fee_charge')
  - pr_paid_o: XSUM('prime','prime_fee_ledger','amount', event_type='prime_fee_payment')
  - pr_amt_o: RND(pr_cs_o + MN(pr_chg_begun_o, pr_paid_o), 2)
  - carry_o: P('catastrophic_cap_family') if (plan_change_o and pr_amt_o >= P('catastrophic_cap_family')) else (pr_amt_o if plan_change_o else 0)
  - room_o: MX(0, P('catastrophic_cap_family') - claims_o - (MN(chg_begun_o, paid_o) if P('fees_count_toward_catastrophic_cap') else 0) - carry_o)
  - liab_o: RND(MN(uncapped_o, room_o), 2)
  - primary_o: RND(MX(0, RND(allowed_o * att_o, 2) - liab_o), 2)
  - tricare_o: RND(MN(primary_o, MX(0, (MN(billed_o, allowed_o * (1 + P('nonparticipating_balance_billing_limit_pct') / 100)) - ohi_paid_o) * att_o - liab_o)), 2) if (F('ohi_on_file') and ohi_paid_o > 0 and net_o == 'non_network_nonparticipating') else (RND(MX(0, (allowed_o - ohi_paid_o) * att_o - liab_o), 2) if (F('ohi_on_file') and ohi_paid_o > 0) else primary_o)
  - result: tricare_o if scope_o else None
  compute_basis:
    scope_o: It covers the reprocessed line of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee's own Select enrollment carrying the family's fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family's deductible and catastrophic totals are the enrollee's own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family's Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design.
    rev_o: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed because the beneficiary''s other health insurance was found retroactively: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent reversal for other health insurance found retroactively, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    sd_o: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed because the beneficiary''s other health insurance was found retroactively: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent reversal for other health insurance found retroactively, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    class_o: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed because the beneficiary''s other health insurance was found retroactively: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent reversal for other health insurance found retroactively, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    net_o: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed because the beneficiary''s other health insurance was found retroactively: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent reversal for other health insurance found retroactively, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    allowed_o: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed because the beneficiary''s other health insurance was found retroactively: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent reversal for other health insurance found retroactively, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    billed_o: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed because the beneficiary''s other health insurance was found retroactively: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent reversal for other health insurance found retroactively, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    ohi_paid_o: Where other health insurance is on file and the other insurer paid some but less than the allowed amount, the other insurer's payment is taken off before a line reprocessed for other health insurance is cost-shared; where other health insurance is on file and the other insurer paid at least the allowed amount, the whole allowed amount is taken off; otherwise nothing is taken off.
    ohi_take_o: Where other health insurance is on file and the other insurer paid some but less than the allowed amount, the other insurer's payment is taken off before a line reprocessed for other health insurance is cost-shared; where other health insurance is on file and the other insurer paid at least the allowed amount, the whole allowed amount is taken off; otherwise nothing is taken off.
    base_o: Where other health insurance is on file and the other insurer paid some but less than the allowed amount, the other insurer's payment is taken off before a line reprocessed for other health insurance is cost-shared; where other health insurance is on file and the other insurer paid at least the allowed amount, the whole allowed amount is taken off; otherwise nothing is taken off.
    mh_stay_o: Where the service date of the reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the reprocessed line is cost-shared on is the amount left times the attending share, rounded to the cent.
    auth_ok_o: Where the service date of the reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the reprocessed line is cost-shared on is the amount left times the attending share, rounded to the cent.
    auth_days_o: Where the service date of the reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the reprocessed line is cost-shared on is the amount left times the attending share, rounded to the cent.
    req_days_o: Where the service date of the reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the reprocessed line is cost-shared on is the amount left times the attending share, rounded to the cent.
    att_o: Where the service date of the reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the reprocessed line is cost-shared on is the amount left times the attending share, rounded to the cent.
    amt_o: Where the service date of the reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the reprocessed line is cost-shared on is the amount left times the attending share, rounded to the cent.
    ded_met_o: The deductible already met for a reprocessed line is the deductible applied on the enrollment's claim lines less the deductible their reversals withdrew.
    ded_o: Where the reprocessed line's service class is in deductible_exempt_service_classes or the line is network preventive care, it takes no deductible; where the tier's deductible_individual less the deductible already met is less than the amount cost-shared, it takes that remainder, never below zero, rounded to the cent; otherwise it takes the whole amount cost-shared.
    left_o: Where the provider was not in the network on the service date, the cost share on a line reprocessed for other health insurance is non_network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent; where the provider was in the network and the line is durable medical equipment, it is network_dme_cost_share_pct of the amount left, rounded to the cent; where the provider was in the network and the line is preventive care or the tier's network_cost_share_basis is fixed_copayment, it is the tier's network copayment for the line's service class, never more than the amount left; otherwise it is network_outpatient_cost_share_pct of the amount left, rounded to the cent.
    cs_o: Where the provider was not in the network on the service date, the cost share on a line reprocessed for other health insurance is non_network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent; where the provider was in the network and the line is durable medical equipment, it is network_dme_cost_share_pct of the amount left, rounded to the cent; where the provider was in the network and the line is preventive care or the tier's network_cost_share_basis is fixed_copayment, it is the tier's network copayment for the line's service class, never more than the amount left; otherwise it is network_outpatient_cost_share_pct of the amount left, rounded to the cent.
    uncapped_o: 'The beneficiary liability on the reprocessed line is the deductible applied plus the cost share, rounded to the cent, and TRICARE pays as primary payer: the allowed amount less that liability, never below zero.'
    claims_o: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    chg_begun_o: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    paid_o: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    plan_change_o: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_cs_o: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_chg_begun_o: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_paid_o: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_amt_o: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    carry_o: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    room_o: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    liab_o: 'The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states.'
    primary_o: What TRICARE would pay as primary payer on a reprocessed line is the allowed amount times the attending share, less the beneficiary liability, never below zero.
    tricare_o: 'With other health insurance on file, the deductible and cost share of a line reprocessed for other health insurance are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
    result: 'With other health insurance on file, the deductible and cost share of a line reprocessed for other health insurance are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  factors:
  - id: ohi_line_other_insurer
    effect: parameter
    decides: ohi_take_o
    bindings:
    - ohi_paid_o
    - ohi_take_o
    ladder:
    - when: other health insurance is on file and the other insurer paid some but less than the allowed amount
      value: ohi_paid_o
    - when: other health insurance is on file and the other insurer paid at least the allowed amount
      value: allowed_o
    - when: otherwise
      value: '0'
    baseline:
      ohi_take_o: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: ohi_line_attending_share
    effect: parameter
    decides: att_o
    bindings:
    - mh_stay_o
    - auth_ok_o
    - auth_days_o
    - req_days_o
    - att_o
    ladder:
    - when: the line's service date is the admission date of an inpatient mental health stay and an Inpatient Mental Health Authorization starting that day was approved for fewer days than it was requested for
      value: auth_days_o / req_days_o
    - when: an inpatient mental health stay was admitted that day and no approved authorization starting that day is on file
      value: '0'
    - when: otherwise
      value: '1'
    baseline:
      att_o: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: referral
  - id: ohi_line_deductible_taken
    effect: parameter
    decides: ded_o
    bindings:
    - ded_met_o
    - ded_o
    ladder:
    - when: the service class is in deductible_exempt_service_classes or the line is network preventive care
      value: '0'
    - when: the tier's deductible_individual less the deductible already met is less than the amount cost-shared
      value: that remainder, never below zero
    - when: otherwise
      value: the whole amount cost-shared
    baseline:
      ded_o: RND(MN(amt_o, P('deductible_individual')), 2)
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: ohi_line_cost_share_basis
    effect: method
    decides: cs_o
    bindings:
    - net_o
    - left_o
    - cs_o
    ladder: *id004
    baseline:
      cs_o: RND(left_o * P('network_outpatient_cost_share_pct') / 100, 2)
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: ohi_line_payer_coordination
    effect: method
    decides: tricare_o
    bindings:
    - billed_o
    - primary_o
    - tricare_o
    ladder: *id003
    baseline:
      tricare_o: primary_o
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The amount a line reprocessed for other health insurance is cost-shared on is the reversed line''s allowed amount. It applies to the deductible the smaller of that amount and the tier''s deductible_individual, and its cost share is network_outpatient_cost_share_pct of the amount left once the deductible is taken off, rounded to the cent. The beneficiary liability on the reprocessed line is the deductible applied plus the cost share, rounded to the cent, and TRICARE pays as primary payer: the allowed amount less that liability, never below zero. The beneficiary liability is cut to the room left under catastrophic_cap_family once the family catastrophic total is taken away, never below zero: that total is the beneficiary liability posted on the enrollment''s claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid for installments whose coverage period has begun, plus any amount credited from TRICARE Prime as the carryover rule below states. Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a line reprocessed for other health insurance. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    params:
    - deductible_individual
    - network_outpatient_cost_share_pct
    - catastrophic_cap_family
  inputs:
    history:
    - table: select_claim_lines
      aggregate: latest
      field: reversed_claim_line_id
      filters:
        event_type: select_claim_line_reverse
    - table: select_claim_lines
      aggregate: sum
      field: deductible_applied
      filters:
        event_type: select_claim_line_post
    - table: select_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: select_fee_payment
    - &id008
      category: prime
      table: prime_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: prime_claim_line_post
    - &id009
      category: referral
      table: referral_authorizations
      aggregate: latest
      field: units_authorized
      filters:
        variant_name: Inpatient Mental Health Authorization
    cross_category:
    - prime
    - referral
- id: select_ext_bank_draft_payment
  base_policy_refs: *id005
  overwrite:
  - base_policy: select_enrollment_fee_schedule
    superseded_clause: The family owes annual_fee_individual while exactly one member is enrolled in Select and annual_fee_family while two or more are.
    replaced_by: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a drafted installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
  trigger: state_due
  subject:
  - select_fee_payment
  computes: amount
  target_tool: authorize_select_bank_draft_0bb89bb0
  params:
    plan_year_anchor: '2000-01-01'
    months_per_year: 12
    ledger_months: 600
    quarterly_divisor: 4
    monthly_divisor: 12
  rule: 'This policy settles the amount a beneficiary authorizes by one-time bank draft to clear the past-due balance of a fee-bearing TRICARE Select enrollment whose elected payment method is an allotment, an electronic funds transfer or a recurring card payment; the draft is recorded against one installment of the enrollment, called here the latest installment, which the rule on the latest installment identifies. It covers a fee-bearing enrollment (fee_bearing true) that took effect in the plan year that contains the payment date and whose elected payment method is an allotment, an electronic funds transfer or a recurring card payment, so that every installment whose coverage period has begun belongs to that plan year; for any other enrollment this policy settles nothing. An enrollment''s standing in this policy is its lifecycle status: it has ended when its status is disenrolled_voluntary, disenrolled_nonpayment, terminated_ineligible or transferred_out, whatever the payment date, and its last day of coverage is then the disenrollment date on its record; it is active when its status is active; and it is awaiting activation when its status is applied. A rejected enrollment owes no fee and is outside this policy. With no other rule applied, the latest installment is the enrollment''s first installment, it is owed at the annual family fee, annual_fee_family, for one month of it, nothing counts as already received on it, only the enrollment''s first installment counts as a charge on the account, and the bank draft is the installment owed plus the amount by which the charges counted other than the latest installment exceed the payments posted, rounded to the cent. Where the enrollment''s fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family''s catastrophic total is that member''s own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a drafted installment is figured from is zero; that total is the beneficiary liability posted on the enrollment''s Select claim lines less the liability their reversals withdrew, plus, where the tier''s fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family. A change of installment frequency takes effect from the next installment period, so an installment is owed at the frequency in force, the one installments are being charged at: where an annual installment has been charged for a coverage period starting in the calendar year of the payment date, on or before that date, the frequency in force is annual; otherwise, where a quarterly installment has been charged for a coverage period starting in the calendar quarter of the payment date, on or before that date, it is quarterly; otherwise, where a monthly installment has been charged for a coverage period starting in the month of the payment date, on or before that date, it is monthly; and where none has been, it is the frequency the enrollment has elected. At the frequency in force an installment period is the calendar year for an annual installment, which covers twelve months, the calendar quarter for a quarterly installment, which covers three, and otherwise, for a monthly installment, the calendar month, which covers one. Which installment is the latest installment depends on the enrollment''s standing: where the enrollment has ended, it is the installment charged for the installment period that contains the last day of coverage, read as the charges whose coverage period starts in that period, no later than the month containing the last day of coverage and no later than the payment date; where the enrollment has not ended and a charge has been made for a coverage period starting in the installment period that contains the payment date, on or before that date, it is that period''s charges; otherwise it is the enrollment''s first installment, the charge whose coverage period starts on the effective date. The earlier counted charges are the charges that count toward the past-due balance other than those of the latest installment. Where only one installment''s coverage period has begun on the enrollment, so that it is the enrollment''s first, and the enrollment took effect after the first month of that installment''s calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is one twelfth of the annual fee for each month the installment covers; each figure is rounded to the cent. The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts. Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received. The bank draft is the installment owed less what counts as already received, plus any part of the earlier counted charges the payments did not settle, rounded to the cent and never below zero.'
  prerequisite: []
  cross_category: []
  compute:
  - scope_d: (MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12) and (F('status') == 'applied' or F('status') == 'active' or (F('status') == 'disenrolled_voluntary' or F('status') == 'disenrolled_nonpayment' or F('status') == 'terminated_ineligible' or F('status') == 'transferred_out')) and F('fee_bearing') == True and (F('payment_method') == 'allotment' or F('payment_method') == 'electronic_funds_transfer' or F('payment_method') == 'recurring_card')
  - charged_freq_d: '''annual'' if (COUNT(''select_fee_ledger'', within_months=MONTHS(K(''plan_year_anchor''), NOW) % 12 + 1, date_field=''coverage_period_start'', event_type=''select_fee_charge'', installment_frequency=''annual'') - (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''annual'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(F(''enrollment_effective_date''), NOW) < (MONTHS(K(''plan_year_anchor''), NOW) % 12 + 1)) else 0) + (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''annual'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(K(''plan_year_anchor''), NOW) - MONTHS(K(''plan_year_anchor''), F(''enrollment_effective_date'')) < (MONTHS(K(''plan_year_anchor''), NOW) % 12 + 1)) else 0)) > 0 else (''quarterly'' if (COUNT(''select_fee_ledger'', within_months=MONTHS(K(''plan_year_anchor''), NOW) % 3 + 1, date_field=''coverage_period_start'', event_type=''select_fee_charge'', installment_frequency=''quarterly'') - (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''quarterly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(F(''enrollment_effective_date''), NOW) < (MONTHS(K(''plan_year_anchor''), NOW) % 3 + 1)) else 0) + (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''quarterly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(K(''plan_year_anchor''), NOW) - MONTHS(K(''plan_year_anchor''), F(''enrollment_effective_date'')) < (MONTHS(K(''plan_year_anchor''), NOW) % 3 + 1)) else 0)) > 0 else (''monthly'' if (COUNT(''select_fee_ledger'', within_months=1, date_field=''coverage_period_start'', event_type=''select_fee_charge'', installment_frequency=''monthly'') - (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''monthly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(F(''enrollment_effective_date''), NOW) < (1)) else 0) + (COUNT(''select_fee_ledger'', event_type=''select_fee_charge'', coverage_period_start=F(''enrollment_effective_date''), installment_frequency=''monthly'') if (MONTHS(F(''enrollment_effective_date''), NOW) >= 0 and MONTHS(K(''plan_year_anchor''), NOW) - MONTHS(K(''plan_year_anchor''), F(''enrollment_effective_date'')) < (1)) else 0)) > 0 else None))'
  - freq_d: charged_freq_d if charged_freq_d else F('payment_frequency')
  - per_d: 12 if freq_d == 'annual' else (3 if freq_d == 'quarterly' else 1)
  - ended_d: (F('status') == 'disenrolled_voluntary' or F('status') == 'disenrolled_nonpayment' or F('status') == 'terminated_ineligible' or F('status') == 'transferred_out')
  - cur_n_d: (COUNT('select_fee_ledger', within_months=MONTHS(K('plan_year_anchor'), NOW) % per_d + 1, date_field='coverage_period_start', event_type='select_fee_charge') - (COUNT('select_fee_ledger', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) % per_d + 1)) else 0) + (COUNT('select_fee_ledger', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) % per_d + 1)) else 0))
  - cur_amt_d: RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) % per_d + 1, date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) % per_d + 1)) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) % per_d + 1)) else 0), 2)
  - end_amt_d: RND(RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')) + MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_d + 1, date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')) + MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_d + 1)) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')) + MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_d + 1)) else 0), 2) - RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')), date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0), 2), 2) if ended_d else 0
  - first_amt_d: SUM('select_fee_ledger','amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date'))
  - first_cur_d: (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < MONTHS(K('plan_year_anchor'), NOW) % per_d + 1)
  - first_counted_d: MONTHS(F('enrollment_effective_date'), NOW) >= 0 or (not ended_d and F('status') != 'active')
  - n_begun_d: COUNT('select_fee_ledger', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - claims_d: SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_post') - SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_reverse')
  - chg_begun_d: SUM('select_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - paid_d: SUM('select_fee_ledger','amount', event_type='select_fee_payment')
  - total_d: claims_d + (MN(chg_begun_d, paid_d) if P('fees_count_toward_catastrophic_cap') else 0)
  - annual_d: 0 if (F('fee_coverage_type') == 'individual' and total_d >= P('catastrophic_cap_family')) else (P('annual_fee_individual') if F('fee_coverage_type') == 'individual' else P('annual_fee_family'))
  - first_months_d: per_d - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) % per_d
  - end_months_d: MONTHS(K('plan_year_anchor'), F('disenrollment_date')) % per_d + 1 if ended_d else per_d
  - inst_owed_d: RND(annual_d * first_months_d / K('monthly_divisor'), 2) if (n_begun_d == 1 and first_months_d < per_d) else (RND(annual_d * end_months_d / K('monthly_divisor'), 2) if (ended_d and end_months_d < per_d) else RND(annual_d * per_d / K('monthly_divisor'), 2))
  - after_end_d: RND(SUM('select_fee_ledger', 'amount', within_months=MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')), date_field='coverage_period_start', event_type='select_fee_charge') - (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(F('enrollment_effective_date'), NOW) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0) + (SUM('select_fee_ledger', 'amount', event_type='select_fee_charge', coverage_period_start=F('enrollment_effective_date')) if (MONTHS(F('enrollment_effective_date'), NOW) >= 0 and MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) < (MONTHS(K('plan_year_anchor'), NOW) - MONTHS(K('plan_year_anchor'), F('disenrollment_date')))) else 0), 2) if ended_d else 0
  - charged_due_d: RND(chg_begun_d - after_end_d, 2) if ended_d else (chg_begun_d if F('status') == 'active' else first_amt_d)
  - earlier_d: RND(charged_due_d - end_amt_d, 2) if ended_d else (RND(charged_due_d - (cur_amt_d if F('status') == 'active' else (first_amt_d if first_cur_d else 0)), 2) if cur_n_d > 0 else RND(charged_due_d - (first_amt_d if first_counted_d else 0), 2))
  - left_d: RND(paid_d - earlier_d, 2)
  - received_d: inst_owed_d if left_d >= inst_owed_d else (left_d if left_d > 0 else 0)
  - unsettled_d: MX(0, -left_d)
  - result: RND(MX(0, inst_owed_d - received_d + unsettled_d), 2) if scope_d else None
